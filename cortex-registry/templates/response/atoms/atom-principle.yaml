# ─────────────────────────────────────────────────────────────────────────────
# ATOM: Principle of the Moment
# ID: atom-principle
# Tier: 1 (Atom — smallest renderable unit)
#
# PURPOSE: Injects a curated SDLC engineering principle inside the ## 🔍 Analysis
# section of the 5-Section Golden Format — specifically for QUERY, DESIGN, PLAN,
# INVESTIGATE, ONBOARD, INTRODUCE responses.
# Principles are drawn from cortex-registry/knowledge/sdlc/high-value-principles.yaml
# and selected by PrincipleSelector (pool='principles').
#
# Position: Inside ## 🔍 Analysis — FIRST element, before analysis prose or tables.
# NOT in Zone 3 of the response header (that was the retired Phase 124 position).
#
# Rendering: blockquote (> prefix) — renders with VS Code left-accent bar,
# matching the visual weight of the book quote in Zone 2. H3 was retired (Phase 127)
# because H3 headings do not render with a left-accent bar.
#
# Template (verbatim):
#   > 💡 **Principle: {title}**
#   > {body}
#
# Selection: PrincipleSelector(intent_type, pool='principles').select()
#
# SSOT: cortex-registry/knowledge/sdlc/high-value-principles.yaml (90 principles)
# Phase: 124 (created) | 127 (position + format update — blockquote, inside Analysis)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: atom-principle
type: atom
phase: "127"         # Phase 127: blockquote format + Analysis section position (retired H3 + Zone 3)

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  element: blockquote          # blockquote renders with VS Code left-accent bar — same as the header quote
  heading_level: null          # no H3 — blockquote format only (H3 does NOT render with left-accent bar)
  heading_prefix: null
  position: "Inside ## 🔍 Analysis — FIRST element, before any analysis prose or tables"
  zone: analysis_section       # not a header zone — this is inside the 5-section body
  max_per_response: 1
  body_max_chars: 200
  body_max_lines: 2
  forbidden_in_content:
    - "raw URLs"
    - "HTML tags"
    - "tree characters"
    - "nested bullet lists"
  omit_if:
    - "intent is IMPLEMENT or FIX (action intents — execution-focused, no principle injection)"
    - "intent is REFACTOR (execution-focused — use comp-refactor which omits atom-principle)"
    - "intent is TDD (execution-focused — use comp-implement-fix which omits atom-principle)"
    - "intent is DEBUG (execution-focused — use comp-debug which omits atom-principle)"
    - "intent is AUDIT (execution-focused — use comp-audit-fix which omits atom-principle)"
    - "intent is HEALTH (execution-focused — use comp-health which omits atom-principle)"
    - "intent is VACUUM (execution-focused — use comp-vacuum which omits atom-principle)"
    - "silent autonomous execution mode (CORE-049)"
    - "request is ≤8 words with no analytical signal (complexity gate)"
  render_only_for:
    - "QUERY (analysis — default analysis/question response)"
    - "DESIGN (design — architecture and interface design responses)"
    - "PLAN (design-adjacent — roadmap and strategy responses)"
    - "INVESTIGATE (analysis — root cause and investigation responses)"
    - "ONBOARD (design-adjacent — repository comprehension)"
    - "INTRODUCE (design-adjacent — capability introduction)"

# ─── Template ─────────────────────────────────────────────────────────────────
# Render as blockquote (> prefix) — this produces a left-accent bar in VS Code
# Copilot Chat, matching the visual weight of the header quote in Zone 2.
# Do NOT use ### h3 — that renders as a plain heading with no visual distinction.
template: |
  > 💡 **Principle: {title}**
  > {body}

# ─── Theme Map (intent_type → domain filter) ─────────────────────────────────
# Maps CORTEX intent_type to a preferred principle domain.
# PrincipleSelector filters high-value-principles.yaml by intent_types field.
theme_map:
  QUERY: universal            # all domains eligible; no domain pre-filter
  DESIGN: architecture        # prefer architecture + api_design + security
  PLAN: devops                # prefer devops + observability + architecture
  AUDIT: code_quality         # prefer code_quality + testing + security
  REFACTOR: refactoring       # prefer refactoring + code_quality
  TDD: tdd                    # prefer tdd + testing
  IMPLEMENT: tdd              # prefer tdd + refactoring
  FIX: code_quality           # prefer code_quality + testing (but omit_if applies)
  ONBOARD: documentation      # prefer documentation + architecture
  INTRODUCE: documentation    # prefer documentation + architecture
  DEFAULT: universal          # fallback — no domain pre-filter

# ─── Selection Rules ──────────────────────────────────────────────────────────
selection:
  source: "cortex-registry/knowledge/sdlc/high-value-principles.yaml"
  engine: "PrincipleSelector (cortex/intelligence/principle_selector.py)"
  pool: "principles"
  anti_repetition: "ring buffer n=10 (shared with quote atom)"
  weighted_random: true
  fallback: "return first principle in catalogue if pool exhausted"

# ─── Variables (injected by PrincipleSelector) ────────────────────────────────
variables:
  title:
    type: string
    source: "principle.title from high-value-principles.yaml"
    example: "Red–Green–Refactor"
  body:
    type: string
    source: "principle.body from high-value-principles.yaml"
    example: >
      Write a failing test (Red), write the minimum code to pass it (Green),
      then improve the code without changing behaviour (Refactor). This cycle
      keeps confidence high and change sets small.
