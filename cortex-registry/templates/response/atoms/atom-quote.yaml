# ─────────────────────────────────────────────────────────────────────────────
# ATOM: Quote Library
# ID: atom-quote
# Tier: 1 (Atom — smallest renderable unit)
#
# PURPOSE: Thematic quote selection for the response header Zone 2.
# Renders as a Markdown blockquote — VS Code Copilot Chat renders blockquotes
# with a distinctive blue left-accent bar, making it visually prominent.
#
# Selection logic: match quote.themes to request intent (see theme_map below)
# Position: Zone 2 of the 3-zone header — after first --- separator
#
# Template:
#   > *"{text}"*
#   > — {author}, **{book}**
#
# SSOT: .github/templates/cortex-response-templates.md § 📚 Quote Library
# Phase: 120 (Sub-Phase A)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: atom-quote
type: atom
version: "3.0"
phase: "120"

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  element: blockquote
  heading_level: null
  position: "Zone 2 — after first --- separator, before Zone 3"
  zone: 2
  zone_separator_before: "--- (HR)"
  zone_separator_after: "--- (HR)"
  vs_code_render: "blue left-accent bar — distinctive and scannable"
  max_per_response: 1
  forbidden_in_content:
    - "raw URLs"
    - "HTML tags"
    - "tree characters"

# ─── Template ─────────────────────────────────────────────────────────────────
template: |
  > *"{text}"*
  > — {author}, **{book}**

# ─── Theme Map (intent_type → theme) ──────────────────────────────────────────
# Selection: match request intent → theme → pick quote from matching theme pool
theme_map:
  IMPLEMENT: quality
  FIX: systems_thinking
  REFACTOR: improvement
  AUDIT: discipline
  DEBUG: systems_thinking
  DESIGN: architecture
  PLAN: strategy
  HEALTH: discipline
  VACUUM: discipline
  TOTALRECALL: strategy
  QUERY: universal
  INTRODUCE: universal
  SECURITY_AUDIT: security
  DIGEST: learning
  ONBOARD: learning
  SYNC: flow
  TRAIN: learning
  META_AUDIT: discipline
  DEFAULT: universal

# ─── Quote Library (32 quotes across 10 themes) ───────────────────────────────
quotes:
  # THEME: quality
  - text: "Quality is not an act, it is a habit."
    author: "Aristotle"
    book: "Nicomachean Ethics"
    themes: [quality]
    dedup_key: "aristotle-quality-habit"
    relevance_weight: 0.9

  - text: "The bitterness of poor quality remains long after the sweetness of low price is forgotten."
    author: "Benjamin Franklin"
    book: "Poor Richard's Almanack"
    themes: [quality]
    dedup_key: "franklin-quality-bitterness"
    relevance_weight: 0.7

  - text: "Measure twice, cut once."
    author: "Traditional Proverb"
    book: "Craftsmanship Wisdom"
    themes: [quality, discipline]
    dedup_key: "proverb-quality-measure-twice"
    relevance_weight: 0.8

  - text: "First, do it. Then, do it right. Then, do it better."
    author: "Addy Osmani"
    book: "Learning Patterns"
    themes: [quality, improvement]
    dedup_key: "osmani-quality-do-it"
    relevance_weight: 0.8

  # THEME: systems_thinking
  - text: "A complex system that works is invariably found to have evolved from a simple system that worked."
    author: "John Gall"
    book: "Systemantics"
    themes: [systems_thinking, architecture]
    dedup_key: "gall-systems-complex"
    relevance_weight: 0.9

  - text: "The system will always defeat the strategy."
    author: "Donella Meadows"
    book: "Thinking in Systems"
    themes: [systems_thinking]
    dedup_key: "meadows-systems-defeat"
    relevance_weight: 0.7

  - text: "Every system is perfectly designed to get the results it gets."
    author: "W. Edwards Deming"
    book: "Out of the Crisis"
    themes: [systems_thinking, discipline]
    dedup_key: "deming-systems-designed"
    relevance_weight: 0.9

  - text: "You don't rise to the level of your goals. You fall to the level of your systems."
    author: "James Clear"
    book: "Atomic Habits"
    themes: [systems_thinking, discipline]
    dedup_key: "clear-systems-fall"
    relevance_weight: 0.8

  # THEME: improvement
  - text: "Make it work, make it right, make it fast."
    author: "Kent Beck"
    book: "Test-Driven Development: By Example"
    themes: [improvement, quality]
    dedup_key: "beck-improvement-work-right"
    relevance_weight: 0.9

  - text: "Simplicity is the soul of efficiency."
    author: "Austin Freeman"
    book: "The Eye of Osiris"
    themes: [improvement]
    dedup_key: "freeman-improvement-simplicity"
    relevance_weight: 0.7

  - text: "Any fool can write code that a computer can understand. Good programmers write code that humans can understand."
    author: "Martin Fowler"
    book: "Refactoring"
    themes: [improvement, quality]
    dedup_key: "fowler-improvement-humans"
    relevance_weight: 0.9

  - text: "The best code is no code at all."
    author: "Jeff Atwood"
    book: "Coding Horror"
    themes: [improvement]
    dedup_key: "atwood-improvement-no-code"
    relevance_weight: 0.8

  # THEME: architecture
  - text: "Good architecture makes the system easy to understand, easy to develop, easy to maintain, and easy to deploy."
    author: "Robert C. Martin"
