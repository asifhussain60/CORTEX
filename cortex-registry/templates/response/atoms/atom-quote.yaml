id: atom-quote
type: atom
phase: '120'
rendering_rules:
  copilot_chat_compatible: true
  element: blockquote
  heading_level: null
  position: Zone 2 — after first --- separator, before Zone 3
  zone: 2
  zone_separator_before: '--- (HR)'
  zone_separator_after: '--- (HR)'
  vs_code_render: blue left-accent bar — distinctive and scannable
  max_per_response: 1
  forbidden_in_content:
  - raw URLs
  - HTML tags
  - tree characters
template: '> *"{text}"*

  > — {author}, **{book}**

  '
theme_map:
  IMPLEMENT: quality
  FIX: systems-thinking
  REFACTOR: improvement
  AUDIT: discipline
  DEBUG: systems-thinking
  DESIGN: architecture
  PLAN: strategy
  HEALTH: discipline
  VACUUM: discipline
  TOTALRECALL: strategy
  QUERY: universal
  INTRODUCE: universal
  SECURITY_AUDIT: security
  DIGEST: learning
  ONBOARD: learning
  SYNC: flow
  TRAIN: learning
  META_AUDIT: discipline
  DEFAULT: universal
