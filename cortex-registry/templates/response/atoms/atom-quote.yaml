    dedup_key: "aristotle-discipline-excellence"
    relevance_weight: 0.8

  # THEME: strategy
  - text: "Plans are nothing; planning is everything."
    author: "Dwight D. Eisenhower"
    book: "Mandate for Change"
    themes: [strategy]
    dedup_key: "eisenhower-strategy-planning"
    relevance_weight: 0.9

  - text: "However beautiful the strategy, you should occasionally look at the results."
    author: "Winston Churchill"
    book: "War Memoirs"
    themes: [strategy]
    dedup_key: "churchill-strategy-results"
    relevance_weight: 0.8

  - text: "Give me six hours to chop down a tree and I will spend the first four sharpening the axe."
