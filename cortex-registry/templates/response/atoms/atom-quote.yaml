    dedup_key: "jobs-universal-great-work"
    relevance_weight: 0.9

# ─── Validation Rules ─────────────────────────────────────────────────────────
validation:
  minimum_quotes: 32
  required_fields_per_quote: [text, author, book, themes, dedup_key]
  required_themes: [quality, systems_thinking, improvement, architecture, discipline, strategy, security, learning, flow, universal]
  theme_coverage: "all 10 themes must have at least 1 quote"
  no_fabricated_quotes: true
  quote_selection: "weighted-random-anti-repeat — PrincipleSelector filters by theme_map[intent_type], excludes ring_buffer dedup_keys, weighted random on remaining pool"
