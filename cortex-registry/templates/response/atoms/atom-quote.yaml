# ─────────────────────────────────────────────────────────────────────────────
# ATOM: Quote Library
# ID: atom-quote
# Tier: 1 (Atom — smallest renderable unit)
#
# PURPOSE: Thematic quote selection for the response header Zone 2.
# Renders as a Markdown blockquote — VS Code Copilot Chat renders blockquotes
# with a distinctive blue left-accent bar, making it visually prominent.
#
# Selection logic: match quote.themes to request intent (see theme_map below)
# Position: Zone 2 of the 3-zone header — after first --- separator
#
# Template:
#   > *"{text}"*
#   > — {author}, **{book}**
#
# SSOT: This file (atom-quote.yaml) IS the single source of truth for quotes.
# Phase: 120 (Sub-Phase A)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: atom-quote
type: atom
phase: "120"

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  element: blockquote
  heading_level: null
  position: "Zone 2 — after first --- separator, before Zone 3"
  zone: 2
  zone_separator_before: "--- (HR)"
  zone_separator_after: "--- (HR)"
  vs_code_render: "blue left-accent bar — distinctive and scannable"
  max_per_response: 1
  forbidden_in_content:
    - "raw URLs"
    - "HTML tags"
    - "tree characters"

# ─── Template ─────────────────────────────────────────────────────────────────
template: |
  > *"{text}"*
  > — {author}, **{book}**

# ─── Theme Map (intent_type → theme) ──────────────────────────────────────────
# Selection: match request intent → theme → pick quote from matching theme pool
theme_map:
  IMPLEMENT: quality
  FIX: systems_thinking
  REFACTOR: improvement
  AUDIT: discipline
  DEBUG: systems_thinking
  DESIGN: architecture
  PLAN: strategy
  HEALTH: discipline
  VACUUM: discipline
  TOTALRECALL: strategy
  QUERY: universal
  INTRODUCE: universal
  SECURITY_AUDIT: security
  DIGEST: learning
  ONBOARD: learning
  SYNC: flow
  TRAIN: learning
  META_AUDIT: discipline
  DEFAULT: universal

