    themes: [architecture]
    dedup_key: "martin-architecture-good"
    relevance_weight: 0.9

  - text: "Architecture is the art of how to waste space."
    author: "Philip Johnson"
    book: "Philip Johnson: Life and Work"
    themes: [architecture]
    dedup_key: "johnson-architecture-waste"
    relevance_weight: 0.6

  - text: "Design is not just what it looks like and feels like. Design is how it works."
    author: "Steve Jobs"
    book: "The Innovation Secrets of Steve Jobs"
    themes: [architecture, improvement]
    dedup_key: "jobs-architecture-design-works"
    relevance_weight: 0.9

  - text: "The purpose of software architecture is to minimize the human resources required to build and maintain the required system."
    author: "Robert C. Martin"
    book: "Clean Architecture"
