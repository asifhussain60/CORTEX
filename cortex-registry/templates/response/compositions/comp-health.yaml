# ─────────────────────────────────────────────────────────────────────────────
# COMPOSITION: Health Check
# ID: comp-health
# Tier: 3 (Composition — terminal-ready assembly)
#
# PURPOSE: Response header for /health — 22 orchestrator health endpoints.
# Via chain: Classifier → Health Monitor
#
# Rendering: VS Code Copilot Chat 3-zone layout (300-500px panel)
# SSOT: .github/templates/cortex-response-templates.md § Response Header
# Phase: 120 (Sub-Phase B)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: comp-health
type: composition
phase: "120"
trigger: "/health | /healthcheck"
intent: HEALTH

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  zone_count: 3
  zone_separator: "---"
  max_heading_levels: 3
  single_h1: true
  forbidden:
    - "tree characters (U+251C U+2514 U+2502)"
    - "raw HTML except details/summary"
    - "raw URLs"
    - "tables with more than 4 columns"

# ─── Atom Assembly (ordered) ──────────────────────────────────────────────────
atoms:
  - id: atom-identity
    zone: 1
    params:
      product_title: "🧠 CORTEX"
      mode: "Checking"
  - id: atom-orchestration
    zone: 1
    params:
      chain: "Classifier → Health Monitor"
  - id: atom-quote
    zone: 2
    params:
      theme: discipline
  - id: atom-intent-reflection
    zone: body
  - id: atom-status-footer
    zone: footer

# ─── Rendered Template ────────────────────────────────────────────────────────
template: |
  # 🧠 CORTEX Checking
  **Author:** Asif Hussain | © 2025–2026 CORTEX Framework. All rights reserved.
  🧭 Orchestration: Classifier → Health Monitor
  ---

  > *"{quote}"*
  > — {author}, **{book}**

  ---

# ─── Pre-built Via Chain ──────────────────────────────────────────────────────
orchestration_chain: "Classifier → Health Monitor"
health_endpoints: 22
workflow_template: "cortex-registry/workflows/templates/maintenance/health-check-workflow.yaml"
