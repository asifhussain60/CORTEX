# ─────────────────────────────────────────────────────────────────────────────
# COMPOSITION: Audit Fix Pipeline
# ID: comp-audit-fix
# Tier: 3 (Composition — terminal-ready assembly)
#
# PURPOSE: Response header for /audit fix — 9-stage pipeline.
# Via chain: Classifier → Audit Coordinator → Health Monitor → Workspace Cleaner → Governance Enforcer
#
# Rendering: VS Code Copilot Chat 3-zone layout (300-500px panel)
# SSOT: .github/templates/cortex-response-templates.md § Response Header
