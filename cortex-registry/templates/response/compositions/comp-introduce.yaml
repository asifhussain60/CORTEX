# ─────────────────────────────────────────────────────────────────────────────
# COMPOSITION: Introduction / Onboarding
# ID: comp-introduce
# Tier: 3 (Composition — terminal-ready assembly)
#
# PURPOSE: Response header for INTRODUCE intent — CORTEX overview, onboarding,
# "who are you?" responses. Uses Mission Control chain.
# Via chain: Classifier → Mission Control
#
# Rendering: VS Code Copilot Chat 3-zone layout (300-500px panel)
# SSOT: .github/templates/cortex-response-templates.md § Response Header
# Phase: 120 (Sub-Phase B)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: comp-introduce
type: composition
version: "3.0"
phase: "120"
trigger: "who are you, what can you do, introduce yourself, /onboard"
intent: INTRODUCE

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  zone_count: 3
  zone_separator: "---"
  max_heading_levels: 3
  single_h1: true
  forbidden:
    - "tree characters (U+251C U+2514 U+2502)"
    - "raw HTML except details/summary"
    - "raw URLs"
    - "tables with more than 4 columns"

# ─── Atom Assembly (ordered) ──────────────────────────────────────────────────
atoms:
  - id: atom-identity
    zone: 1
    params:
      product_title: "🧠 CORTEX"
      mode: "Introducing"
  - id: atom-orchestration
    zone: 1
    params:
      chain: "Classifier → Mission Control"
  - id: atom-quote
    zone: 2
    params:
      theme: universal
  - id: atom-principle
    zone: 3
    params:
      intent_type: INTRODUCE
  - id: atom-intent-reflection
    zone: body
  - id: atom-status-footer
    zone: footer

# ─── Rendered Template ────────────────────────────────────────────────────────
template: |
  # 🧠 CORTEX Introducing
  **Author:** Asif Hussain | © 2025–2026 CORTEX Framework. All rights reserved.
  🧭 Orchestration: Classifier → Mission Control
  ---

  > *"{quote}"*
  > — {author}, **{book}**

  ---

  ### 💡 Principle: {title}
  {body}

# ─── Pre-built Via Chain ──────────────────────────────────────────────────────
orchestration_chain: "Classifier → Mission Control"
response_blocks:
  - "INTRO"
  - "CAPABILITIES"
  - "TUTORIAL"
  - "NEXT-STEPS"
