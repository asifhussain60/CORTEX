# ─────────────────────────────────────────────────────────────────────────────
# COMPOSITION: Refactor Pipeline
# ID: comp-refactor
# Tier: 3 (Composition — terminal-ready assembly)
#
# PURPOSE: Response header for /refactor — Code Improver + Workflow Composer.
# Via chain: Classifier → Code Improver → Workflow Composer
#
# Rendering: VS Code Copilot Chat 3-zone layout (300-500px panel)
# SSOT: .github/templates/cortex-response-templates.md § Response Header
# Phase: 120 (Sub-Phase B)
# Author: Asif Hussain | © 2025-2026 CORTEX Framework
# ─────────────────────────────────────────────────────────────────────────────

id: comp-refactor
type: composition
phase: "120"
trigger: "/refactor"
intent: REFACTOR

# ─── Rendering Rules ──────────────────────────────────────────────────────────
rendering_rules:
  copilot_chat_compatible: true
  zone_count: 3
  zone_separator: "---"
  max_heading_levels: 3
  single_h1: true
  forbidden:
    - "tree characters (U+251C U+2514 U+2502)"
    - "raw HTML except details/summary"
    - "raw URLs"
    - "tables with more than 4 columns"

# ─── Atom Assembly (ordered) ──────────────────────────────────────────────────
atoms:
  - id: atom-identity
    zone: 1
    params:
      product_title: "🧠 CORTEX"
      mode: "Improving"
  - id: atom-orchestration
    zone: 1
    params:
      chain: "Classifier → Code Improver → Workflow Composer"
  - id: atom-quote
    zone: 2
    params:
      theme: improvement
  - id: atom-intent-reflection
    zone: body
  - id: atom-status-footer
    zone: footer

# ─── Rendered Template ────────────────────────────────────────────────────────
template: |
  # 🧠 CORTEX Improving
  **Author:** Asif Hussain | © 2025–2026 CORTEX Framework. All rights reserved.
  🧭 Orchestration: Classifier → Code Improver → Workflow Composer
  ---

  > *"{quote}"*
  > — {author}, **{book}**

  ---

# ─── Pre-built Via Chain ──────────────────────────────────────────────────────
orchestration_chain: "Classifier → Code Improver → Workflow Composer"
workflow_template: "cortex-registry/workflows/templates/quality/refactor-workflow.yaml"
