    file: compositions/comp-audit-fix.yaml
    description: "Audit Fix pipeline header — 9-stage audit + governance enforcer"
    orchestration_chain: "Classifier → Audit Coordinator → Health Monitor → Workspace Cleaner → Governance Enforcer"
