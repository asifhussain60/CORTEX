# ============================================================================
# GOVERNANCE INTEGRATION
# ============================================================================

governance:
  core_rules_applied:
    - "CORE-008: TDD-first (Golden Path tests before deletion, RGR loop enforces RED before GREEN)"
    - "CORE-027: Audit trail (AC markers on all changes, audit.db verification in every golden test)"
    - "CORE-035: Single canonical (no duplicate tests, DuplicateDetectionStrategy enforces)"
    - "CORE-030: Implementation Truth (audit.db is the evidence, not mocks)"
    
  ac_markers:
    - "AC-WAVE10-T1-001 through T1-010 (Golden Path incl. RGR Intelligence)"
    - "AC-WAVE10-T2-001 through T2-003 (Reference Repo)"
    - "AC-WAVE10-T3-001 through T3-006 (Deletion Phases)"
    - "AC-WAVE10-T4-001 through T4-003 (De-Mocking)"
    - "AC-WAVE10-T5-001 through T5-006 (RGR Intelligence Engine)"
    - "AC-WAVE10-T5.5-001 (RGR Final Sweep)"
    
  rgr_governance_integration: |
    The RGR Intelligence Engine (Track 5) is itself governed:
    - IScanStrategy implementations must emit audit entries
    - ConvergenceDetector must log halt reasons
    - FeedbackHub events are audit-logged
    - Non-convergent halts trigger governance alert
    - Every fix applied through RGR has an AC marker

# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  - risk: "Delete test that was catching real bugs"
    probability: "LOW"
    mitigation: "Git history check before deletion - did this test ever catch a bug?"
    
  - risk: "Reference repo too complex to maintain"
    probability: "MEDIUM"
    mitigation: "Keep minimal (500 files), document structure, auto-generate where possible"
    
  - risk: "Team resistance to 40% test deletion"
    probability: "HIGH"
    mitigation: "Show Golden Path tests first - demonstrate quality > quantity"
    
  - risk: "Coverage drops below acceptable"
    probability: "MEDIUM"
    mitigation: "Track coverage per-track, pause if drops below 80%"
    
  - risk: "RGR loop infinite cycling (non-convergent edge case)"
    probability: "LOW"
    mitigation: "ConvergenceDetector with oscillation detection + hard max_cycles=5 limit"
    
  - risk: "ScanStrategy.fix() introduces new violations"
    probability: "MEDIUM"
    mitigation: "verify() step after every fix batch + regression test suite run"
    
  - risk: "FeedbackHub not ready when RGR Engine implemented"
    probability: "MEDIUM"
    mitigation: "Graceful fallback — stdout logging if FeedbackHub unavailable"
    
  - risk: "Strategy proliferation (too many strategies, maintenance burden)"
    probability: "LOW"
    mitigation: "Start with 2 strategies (Reference + Governance), add only when proven need"

