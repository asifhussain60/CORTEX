# ============================================================================
# TRACK 5: RGR INTELLIGENCE ENGINE (CORE - SCAN-FIX-VERIFY LOOP)
# ============================================================================

  - track_id: "T5"
    name: "RGR Intelligence Engine"
    priority: "P0-CRITICAL"
    duration: "5-7 days"
    effort: "30-42h"
    parallelizable: false
    depends_on: ["T1", "T2"]
    
    description: |
      Implements the RGR (Red-Green-Refactor) Intelligence Engine as a
      Strategy Pattern injected into TDDOrchestrator.execute_multi_cycle().
      Replaces mock cycle body with real ScanStrategy.scan() → fix() → verify() calls.
      
      Each RED phase creates DEEPER tests across layers to find ALL instances.
      Each GREEN phase fixes one batch of issues.
      Each REFACTOR phase verifies no regressions and no new issues.
      Loop continues until convergence (zero violations) or safety halt.
      
      Integrates with:
      - ENH-088: execute_multi_cycle infrastructure (CycleMetrics, GateResult)
      - ENH-100: FeedbackHub for visual progress (color indicators, ASCII bars)
      - ENH-099: TestGenerationOrchestrator for intelligent test scaffolding
      
    architecture:
      pattern: "Strategy Pattern (ScanStrategy interface)"
      location: "cortex/orchestrators/strategies/"
      
      scan_strategy_interface:
        name: "IScanStrategy"
        file: "cortex/orchestrators/strategies/scan_strategy.py"
        methods:
          - name: "scan"
            signature: "scan(scope: ScanScope, depth: ScanDepth) -> ScanResult"
            purpose: "Discover all violations/issues at given depth"
            returns: "List of Issue objects with fingerprints for convergence tracking"
          - name: "fix"
            signature: "fix(issues: List[Issue]) -> List[FixResult]"
            purpose: "Apply fixes for discovered issues"
            returns: "Fix results with before/after state for verification"
          - name: "verify"
            signature: "verify(fix_results: List[FixResult]) -> VerifyResult"
            purpose: "Confirm fixes applied correctly, no regressions"
            returns: "Verification result with regression check"
          - name: "get_scan_depth_progression"
            signature: "get_scan_depth_progression() -> List[ScanDepth]"
            purpose: "Define depth escalation per cycle (surface → structural → semantic)"
            returns: "Ordered list of scan depths for progressive deepening"

      scan_depths:
        SURFACE: "Direct references (imports, file-level)"
        STRUCTURAL: "Cross-file dependencies (registry, wiring, config)"
        SEMANTIC: "Behavioral consistency (docstrings, test fixtures, naming)"
        ALL: "Combined scan at all depths (final verification)"
        
      convergence_detector:
        name: "ConvergenceDetector"
        file: "cortex/orchestrators/strategies/convergence.py"
        purpose: "Detects when RGR loop should halt"
        detection_modes:
          CONVERGED: "Zero issues found → exit with success"
          NON_CONVERGENT: "Same issue fingerprints appearing across cycles → halt with diagnostic"
          MAX_CYCLES: "Hard limit reached → halt with remaining gaps"
        algorithm: |
          For each cycle N:
            current_fingerprints = set(issue.fingerprint for issue in scan_result)
            if current_fingerprints == empty_set:
              return CONVERGED
            if current_fingerprints.intersection(previous_fingerprints) > threshold:
              if oscillation_count >= 2:
                return NON_CONVERGENT(oscillating=current_fingerprints & previous_fingerprints)
            previous_fingerprints = current_fingerprints
          return MAX_CYCLES
    
      built_in_strategies:
        - name: "ReferenceCleanupStrategy"
          scope: "Stale references across .md/.yaml/.py files"
          used_by: "REFACTOR intent, DIGEST mode cleanup"
          scan_depths: [SURFACE, STRUCTURAL, SEMANTIC]
          production_scenario: |
            After renaming WrappedTDDOrchestrator → TDDOrchestrator:
            Cycle 1 (SURFACE): grep for 'WrappedTDD' in imports → 8 hits
            Cycle 2 (STRUCTURAL): scan registry YAML, wiring specs → 3 hits
            Cycle 3 (SEMANTIC): scan docstrings, test names, dashboard HTML → 2 hits
            Cycle 4: All-depth re-scan → 0 → converged
            
        - name: "GovernanceViolationStrategy"
          scope: "CORE rule violations across codebase"
          used_by: "AUDIT intent, EnforcementOrchestrator"
          scan_depths: [SURFACE, STRUCTURAL, SEMANTIC]
          production_scenario: |
            Running /audit on a PR branch:
            Cycle 1: Find CORE-008 violations (tests missing) → fix 4
            Cycle 2: Find CORE-011 violations (type hints missing on new code) → fix 6
            Cycle 3: Find CORE-035 violations (duplicate impl created by fix) → fix 1
            Cycle 4: Re-scan → 0 → converged
            
        - name: "TestCoverageStrategy"
          scope: "Uncovered code paths requiring new tests"
          used_by: "IMPLEMENT intent, TDDOrchestrator"
          scan_depths: [SURFACE, STRUCTURAL]
          production_scenario: |
            Implementing new MCP tool:
            Cycle 1: Coverage 72% → generate tests for uncovered methods → 82%
            Cycle 2: Coverage 82% → generate edge case tests → 89%
            Cycle 3: Coverage 89% → coverage gate passes (85% threshold) → converged
            
        - name: "DuplicateDetectionStrategy"
          scope: "CORE-035 violations (duplicate implementations)"
          used_by: "REFACTOR intent, any consolidation"
          scan_depths: [SURFACE, STRUCTURAL, SEMANTIC]
          production_scenario: |
            Consolidating 3 progress reporter implementations:
            Cycle 1: Find 3 classes with >80% similarity → merge into 1
            Cycle 2: Find 5 callers still referencing old classes → update imports
            Cycle 3: Find 2 test files testing old classes → consolidate
            Cycle 4: Re-scan → 0 → converged

      feedback_integration:
        hub: "ENH-100 FeedbackHub"
        events_emitted:
          - event: "RGR_CYCLE_START"
            data: "cycle_number, strategy_name, scan_depth, scope"
            visual: "🔴 RGR Cycle {n} — {strategy} — Depth: {depth}"
          - event: "RGR_SCAN_COMPLETE"
            data: "issues_found, fingerprints, scan_duration_ms"
            visual: "[█████░░░░░] {n} issues found ({depth} scan)"
          - event: "RGR_FIX_APPLIED"
            data: "issue_id, fix_type, files_modified"
            visual: "  ├─ ✅ Fixed: {issue_summary} ({files} files)"
          - event: "RGR_FIX_FAILED"
            data: "issue_id, error, rollback_applied"
            visual: "  ├─ 🔴 FAILED: {issue_summary} — {error}"
          - event: "RGR_VERIFY_COMPLETE"
            data: "regressions_found, test_pass_rate"
            visual: "  └─ 🟢 Verified: {pass_rate}% tests passing, 0 regressions"
          - event: "RGR_CONVERGENCE"
            data: "final_cycle, total_fixes, convergence_type"
            visual: "[██████████] 100% Converged in {n} cycles ({fixes} fixes)"
          - event: "RGR_NON_CONVERGENT"
            data: "oscillating_issues, cycles_run"
            visual: "⚠️ Non-convergent after {n} cycles — {issues} oscillating"
        
        visual_template: |
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          🔄 RGR Intelligence: {strategy_name}
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
          🔴 Cycle 1 — SURFACE scan
          [██████████] Found: 8 issues
            ├─ ✅ Fixed: Import ref in orchestrators/core/ (3 files)
            ├─ ✅ Fixed: Import ref in mcp/tools/ (2 files)
            └─ ✅ Fixed: Import ref in agents/ (3 files)
          🟢 Verified: 100% pass, 0 regressions
          
          🔴 Cycle 2 — STRUCTURAL scan
          [██████████] Found: 3 issues
            ├─ ✅ Fixed: Registry YAML entry (1 file)
            ├─ ✅ Fixed: Wiring spec reference (1 file)
            └─ ✅ Fixed: Dashboard graph node (1 file)
          🟢 Verified: 100% pass, 0 regressions
          
          🔴 Cycle 3 — SEMANTIC scan
          [██████████] Found: 2 issues
            ├─ ✅ Fixed: Docstring reference (1 file)
            └─ ✅ Fixed: Test fixture name (1 file)
          🟢 Verified: 100% pass, 0 regressions
          
          🔴 Cycle 4 — ALL depth re-scan
          [██████████] Found: 0 issues
          
          ✅ CONVERGED in 4 cycles | 13 fixes | 0 regressions
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    deliverables:
      - id: "T5-D1"
        name: "IScanStrategy Interface + Base Classes"
        file: "cortex/orchestrators/strategies/scan_strategy.py"
        tests: "tests/unit/orchestrators/strategies/test_scan_strategy.py"
        test_scenarios:
          - name: "test_scan_strategy_interface_enforced"
            scenario: "Concrete strategy missing scan() method"
            expected: "TypeError at instantiation"
            audit_check: "No audit entry (construction failure)"
            
          - name: "test_scan_returns_fingerprinted_issues"
            scenario: "Strategy scans reference repo with known violations"
            expected: "Each Issue has unique fingerprint (sha256 of location+type)"
            audit_check: "audit log has scan_executed entry with issue_count"
            
          - name: "test_scan_depth_progression_respected"
            scenario: "Strategy defines [SURFACE, STRUCTURAL, SEMANTIC]"
            expected: "Cycle 1 uses SURFACE, Cycle 2 uses STRUCTURAL, etc."
            audit_check: "audit log scan entries show depth escalation"
        
      - id: "T5-D2"
        name: "ConvergenceDetector"
        file: "cortex/orchestrators/strategies/convergence.py"
        tests: "tests/unit/orchestrators/strategies/test_convergence.py"
        test_scenarios:
          - name: "test_convergence_detected_on_zero_issues"
            scenario: "Scan returns empty issue list"
            expected: "ConvergenceResult.type == CONVERGED"
            audit_check: "audit log has convergence_reached entry"
            
          - name: "test_non_convergence_detected_on_oscillation"
            scenario: "Cycle N issues == Cycle N-2 issues (fingerprint match)"
            expected: "ConvergenceResult.type == NON_CONVERGENT"
            audit_check: "audit log has non_convergent_halt with oscillating_fingerprints"
            
          - name: "test_max_cycles_halt_with_remaining_gaps"
            scenario: "Issues decreasing but not zero after max_cycles"
            expected: "ConvergenceResult.type == MAX_CYCLES, remaining_issues populated"
            audit_check: "audit log has max_cycles_reached with remaining_count"
            
          - name: "test_fingerprint_tracking_across_cycles"
            scenario: "3 cycles with overlapping but shifting issue sets"
            expected: "Fingerprint history maintained, diff computed per cycle"
            audit_check: "audit log has fingerprint_delta entries per cycle"

      - id: "T5-D3"
        name: "ReferenceCleanupStrategy"
        file: "cortex/orchestrators/strategies/reference_cleanup.py"
        tests: "tests/unit/orchestrators/strategies/test_reference_cleanup.py"
        test_scenarios:
          - name: "test_surface_scan_finds_direct_imports"
            scenario: "Reference repo has 8 imports of deprecated OldOrchestrator"
            expected: "scan(depth=SURFACE) returns 8 issues"
            audit_check: "audit log has 8 issue_detected entries"
            
          - name: "test_structural_scan_finds_registry_refs"
            scenario: "Reference repo has YAML registry entries for OldOrchestrator"
            expected: "scan(depth=STRUCTURAL) returns registry + wiring refs"
            audit_check: "audit log entries include file_type=yaml"
            
          - name: "test_fix_applies_rename_across_files"
            scenario: "Fix all 8 surface imports"
            expected: "All files updated, no partial application"
            audit_check: "audit log has fix_applied entries with before/after content"
            
          - name: "test_verify_confirms_no_regressions"
            scenario: "After fix, run affected test suite"
            expected: "All tests pass, no new failures"
            audit_check: "audit log has verify_passed entry with test_count"
            
          - name: "test_full_rgr_loop_cleans_all_refs"
            scenario: "Run complete RGR loop on deprecated orchestrator"
            expected: "Converges in 3-4 cycles, zero remaining refs"
            audit_check: "audit log shows full lifecycle: scan→fix→verify per cycle"

      - id: "T5-D4"
        name: "GovernanceViolationStrategy"
        file: "cortex/orchestrators/strategies/governance_violation.py"
        tests: "tests/unit/orchestrators/strategies/test_governance_violation.py"
        test_scenarios:
          - name: "test_scans_all_core_rules"
            scenario: "Reference repo with CORE-008, CORE-011, CORE-035 violations"
            expected: "All violation types detected with correct rule_id"
            audit_check: "audit log entries have rule_id field matching CORE-XXX"
            
          - name: "test_fix_respects_orchestrator_boundaries"
            scenario: "CORE-008 violation fix must go through TDDOrchestrator"
            expected: "Fix delegates to correct orchestrator, not direct file edit"
            audit_check: "audit log has orchestrator_delegated entry"
            
          - name: "test_cross_orchestrator_chain_validation"
            scenario: "Violation spans TDD + Enforcement + Master orchestrators"
            expected: "Each orchestrator validates its domain, all three audit logged"
            audit_check: "audit log has entries from 3 different orchestrator sources"

      - id: "T5-D5"
        name: "TDDOrchestrator Integration (execute_multi_cycle enhancement)"
        file: "cortex/orchestrators/core/tdd_orchestrator.py"
        tests: "tests/unit/orchestrators/test_rgr_integration.py"
        test_scenarios:
          - name: "test_execute_multi_cycle_uses_scan_strategy"
            scenario: "Pass ReferenceCleanupStrategy to execute_multi_cycle"
            expected: "Real scan→fix→verify calls replace mock body"
            audit_check: "audit log has strategy_executed entries, not mock_executed"
            
          - name: "test_backward_compatible_without_strategy"
            scenario: "Call execute_multi_cycle without strategy (legacy)"
            expected: "Falls back to original mock behavior (no regression)"
            audit_check: "audit log has legacy_mode=true entry"
            
          - name: "test_feedback_events_emitted_per_cycle"
            scenario: "Strategy runs 3 cycles"
            expected: "FeedbackHub receives RGR_CYCLE_START, RGR_SCAN_COMPLETE per cycle"
            audit_check: "audit log has event_emitted entries matching FeedbackHub events"
            
          - name: "test_convergence_detector_integrated"
            scenario: "Strategy converges after 2 cycles"
            expected: "ConvergenceDetector called after each cycle, exits on CONVERGED"
            audit_check: "audit log has convergence_check entries per cycle"

      - id: "T5-D6"
        name: "Production Scenario Integration Tests"
        file: "tests/golden/test_rgr_production_scenarios.py"
        test_scenarios:
          - name: "test_pr_review_rgr_loop"
            scenario: |
              Simulates PR review pipeline:
              1. Developer submits code with 3 violations
              2. RGR loop runs with GovernanceViolationStrategy
              3. Each cycle fixes one violation type
              4. Final cycle confirms zero violations
            expected: "3 cycles, 3 fixes, converged"
            audit_check: "Full audit trail: pr_submitted → rgr_started → 3x(scan→fix→verify) → converged"
            
          - name: "test_orchestrator_consolidation_rgr_loop"
            scenario: |
              Simulates orchestrator rename/consolidation:
              1. Old name has 15 references across 12 files
              2. RGR loop with ReferenceCleanupStrategy
              3. Progressive depth: surface(8) → structural(5) → semantic(2)
              4. Final all-depth scan: 0 remaining
            expected: "4 cycles, 15 fixes, converged"
            audit_check: "Depth escalation visible in audit, fix_count per cycle matches"
            
          - name: "test_test_suite_quality_rgr_loop"
            scenario: |
              Simulates test quality remediation:
              1. Suite has 10 assertion-free tests + 5 heavy-mock tests
              2. RGR loop with TestCoverageStrategy
              3. Cycle 1: Delete assertion-free tests
              4. Cycle 2: Refactor heavy-mock tests
              5. Cycle 3: Verify coverage maintained
            expected: "3 cycles, 15 test fixes, coverage >= baseline"
            audit_check: "audit log shows test_deleted vs test_refactored counts"

    tests_created: 28
    tests_deleted: 0
    
    success_gate: |
      Track 5 is COMPLETE when:
      1. IScanStrategy interface usable by any orchestrator
      2. ConvergenceDetector prevents infinite loops
      3. At least 2 built-in strategies working (ReferenceCleanup + GovernanceViolation)
      4. TDDOrchestrator.execute_multi_cycle() wired to real strategies
      5. FeedbackHub receives RGR events with visual rendering
      6. All 28 tests passing with audit log verification
      7. Production scenario tests prove realistic workflows

# ============================================================================
# TRACK 5.5: RGR FINAL SWEEP (DEPENDS ON ALL TRACKS)
# ============================================================================

  - track_id: "T5.5"
    name: "RGR Final Sweep"
    priority: "P0-CRITICAL"
    duration: "2-3 days"
    effort: "12-18h"
    parallelizable: false
    depends_on: ["T1", "T2", "T3", "T4", "T5"]
    
    description: |
      Uses the RGR Intelligence Engine (Track 5) to sweep the entire test suite.
      This is the final gate — eat your own dogfood by running the RGR loop
      on the test suite itself using TestCoverageStrategy + GovernanceViolationStrategy.
      
    process:
      iteration_limit: 5
      strategies_used:
        - "TestCoverageStrategy (ensure coverage >= 85%)"
        - "GovernanceViolationStrategy (ensure CORE compliance)"
        - "DuplicateDetectionStrategy (ensure no duplicate tests)"
      
      step_1_red:
        name: "Run RGR Loop with all 3 strategies (chained)"
        expected: "Discovers remaining gaps from Track 1-4 work"
        audit_check: "rgr_sweep_started entry with strategy_chain list"
        
      step_2_green:
        name: "Auto-fix discovered issues"
        approach: |
          For each issue:
          1. Strategy.fix() applies correction
          2. Strategy.verify() confirms no regression
          3. Continue to next issue
        audit_check: "rgr_sweep_fix entries per issue"
        
      step_3_refactor:
        name: "Convergence verification"
        approach: |
          1. ConvergenceDetector confirms zero issues across all strategies
          2. Final all-depth scan at SEMANTIC level
          3. Exit with full audit trail
        audit_check: "rgr_sweep_converged entry with total_cycles and total_fixes"
        
      exit_criteria:
        - "Zero violations from all 3 strategies"
        - "Coverage >= 85%"
        - "Mock ratio < 0.5 average"
        - "All 10 Golden Path tests passing"
        - "No duplicate test names"
        - "No phase-dated test files"
        - "Audit log complete for every fix"
        
    final_metrics:
      target_test_count: "8,000-10,000"
      target_pass_rate: "100%"
      target_coverage: ">= 85%"
      target_mock_ratio: "< 0.5"
      
    verification:
      commands:
        - "pytest tests/ -v --tb=short"
        - "pytest tests/golden/ -v --no-cov"
        - "coverage report --fail-under=85"
        
    tests_created: 0
    tests_deleted: "variable (during RGR sweep)"

