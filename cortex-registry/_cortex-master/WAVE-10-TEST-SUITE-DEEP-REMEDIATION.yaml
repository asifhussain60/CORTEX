# ============================================================================
# TRACK 1: GOLDEN PATH TRUTH TESTS (NEW - HIGH VALUE)
# ============================================================================

tracks:
  - track_id: "T1"
    name: "Golden Path Truth Tests"
    priority: "P0-CRITICAL"
    duration: "7-9 days"
    effort: "40-50h"
    parallelizable: true
    
    description: |
      Create 7 strategic "truth tests" that run the real production pipeline.
      These tests use NO mocks and verify actual component integration.
      A single failing truth test indicates production will fail.
      
    deliverables:
      - id: "T1-D1"
        name: "Company Override Truth Test"
        file: "tests/golden/test_company_override_truth.py"
        description: |
          Load real company/domains/*.yaml + cortex/knowledge/*.yaml
          Run through KnowledgeSynthesisEngine
          Assert company standards override CORTEX defaults
          VERIFY via audit log (hard evidence)
        assertions:
          - "company_rule.precedence > cortex_rule.precedence"
          - "merged_output.security_standards == company_standards"
          - "no data loss in merge"
        audit_requirements:
          - "audit log contains 'rule_resolution' entry"
          - "entry timestamp within 5 seconds of test run"
          - "audit data shows company precedence=100, cortex=50"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit.db has zero entries for this operation
          2. latest audit timestamp > 5 seconds old (stale/cached)
          3. audit record missing expected precedence values
        
      - id: "T1-D2"
        name: "Tier Cascade Truth Test"
        file: "tests/golden/test_tier_cascade_truth.py"
        description: |
          Insert a rule at tier0 (cortex_brain/tier0/)
          Trace propagation through tier1, tier2, tier3
          Verify rule appears correctly at tier3 output
          VERIFY via audit log (hard evidence)
        assertions:
          - "tier0_rule propagates to tier1"
          - "tier1 enrichment applied"
          - "tier2 domain context added"
          - "tier3 output contains enriched rule"
        audit_requirements:
          - "audit log shows tier0→tier1→tier2→tier3 cascade"
          - "each tier has timestamp progression"
          - "rule ID consistent across all tiers"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log missing any tier transition entry
          2. tier timestamps not in ascending order
          3. rule ID changes between tiers (data loss)
        
      - id: "T1-D3"
        name: "Multi-Analyzer Integration Truth Test"
        file: "tests/golden/test_multi_analyzer_truth.py"
        description: |
          Run ALL LENS analyzers (12) on reference repository
          Verify synthesized output is coherent (no conflicts)
          Assert each analyzer contributes non-overlapping insights
          VERIFY via audit log (hard evidence)
        assertions:
          - "all 12 analyzers produce output"
          - "no conflicting metadata"
          - "synthesis produces unified result"
        audit_requirements:
          - "audit log has 12 'analyzer_completed' entries"
          - "each analyzer has unique execution timestamp"
          - "synthesis_completed entry after all analyzers"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log shows <12 analyzer completions
          2. any analyzer timestamp missing
          3. synthesis timestamp before last analyzer completion
        
      - id: "T1-D4"
        name: "Governance + Domain Truth Test"
        file: "tests/golden/test_governance_domain_truth.py"
        description: |
          Apply security rule to domain code snippet
          Run through EnforcementOrchestrator
          Verify violation detected and reported correctly
          VERIFY via audit log (hard evidence)
        assertions:
          - "CORE-008 TDD violation detected"
          - "correct file + line reported"
          - "remediation suggestion provided"
        audit_requirements:
          - "audit log has 'governance_violation' entry"
          - "entry contains rule_id=CORE-008"
          - "entry contains exact file path + line number"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log has zero governance_violation entries
          2. rule_id in audit ≠ CORE-008
          3. file path or line number missing from audit
        
      - id: "T1-D5"
        name: "Conflict Resolution Truth Test"
        file: "tests/golden/test_conflict_resolution_truth.py"
        description: |
          Create conflicting rules (company vs CORTEX, tier1 vs tier2)
          Run resolution pipeline
          Assert correct winner based on precedence rules
          VERIFY via audit log (hard evidence)
        assertions:
          - "company wins over CORTEX"
          - "higher tier wins within same source"
          - "audit trail captures resolution"
        audit_requirements:
          - "audit log shows conflict_detected entry"
          - "audit log shows resolution_applied entry"
          - "winning rule + losing rule both recorded"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log missing conflict_detected entry
          2. resolution_applied entry missing
          3. winning_rule_id not equal to expected winner
        
      - id: "T1-D6"
        name: "MCP End-to-End Truth Test"
        file: "tests/golden/test_mcp_e2e_truth.py"
        description: |
          Send real request through MCP gateway
          Trace through IntentRouter → Orchestrator → Execution
          Verify complete request/response cycle
          VERIFY via audit log (hard evidence)
        assertions:
          - "request classified correctly"
          - "correct orchestrator invoked"
          - "response formatted per standards"
        audit_requirements:
          - "audit log has request_received entry"
          - "audit log has intent_classified entry"
          - "audit log has orchestrator_invoked entry"
          - "audit log has response_sent entry"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log missing any of 4 lifecycle entries
          2. timestamps not in ascending order
          3. request_id not consistent across all entries
        
      - id: "T1-D7"
        name: "LENS Full Pipeline Truth Test"
        file: "tests/golden/test_lens_full_pipeline_truth.py"
        description: |
          Run LENS on real repository (tests/fixtures/reference_repo)
          Verify AST + Git + Domain + Knowledge extraction
          Assert unified LENSResult contains all expected data
          VERIFY via audit log (hard evidence)
        assertions:
          - "AST analysis complete"
          - "Git history extracted (24h)"
          - "Domain patterns detected"
          - "Knowledge synthesis correct"
        audit_requirements:
          - "audit log has lens_pipeline_started entry"
          - "audit log has ast_analysis_completed entry"
          - "audit log has git_extraction_completed entry"
          - "audit log has lens_pipeline_completed entry"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. audit log missing pipeline_started entry
          2. any stage completion entry missing
          3. pipeline_completed timestamp before last stage
        
    # ========================================================================
    # T1-D8 through T1-D10: RGR CROSS-ORCHESTRATOR PRODUCTION SCENARIOS
    # ========================================================================

      - id: "T1-D8"
        name: "RGR Cross-Orchestrator Chain Truth Test"
        file: "tests/golden/test_rgr_cross_orchestrator_truth.py"
        description: |
          Validates the full orchestrator chain under RGR loop conditions.
          Injects 5 governance violations across 3 orchestrators (TDD, Enforcement, Master).
          Runs RGR loop. Each RED cycle must discover remaining violations.
          GREEN cycle fixes one. Loop continues until zero remain.
          VERIFY: audit log has one entry per fix cycle per orchestrator.
        production_scenario: |
          SCENARIO: Developer submits PR touching auth module.
          - TDDOrchestrator finds 2 missing test files
          - EnforcementOrchestrator finds 1 CORE-008 violation (impl before test)
          - MasterOrchestrator finds 2 stale refs to deprecated module
          - RGR Cycle 1: Fix missing tests → re-scan → still 3 violations
          - RGR Cycle 2: Fix CORE-008 → re-scan → still 2 violations
          - RGR Cycle 3: Fix stale refs → re-scan → 0 violations → EXIT
        assertions:
          - "exactly 3 RGR cycles executed (convergence in 3)"
          - "each cycle audit log shows decreasing violation count"
          - "final audit entry has violation_count=0"
          - "all 3 orchestrators invoked per scan cycle"
        audit_requirements:
          - "audit log has rgr_cycle_start entries: exactly 3"
          - "audit log has rgr_scan_result entries with monotonically decreasing issue_count"
          - "audit log has rgr_fix_applied entries: exactly 5 (one per violation)"
          - "audit log has rgr_convergence_reached entry with final_cycle=3"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. RGR loop exits after cycle 1 (premature termination)
          2. audit log missing any rgr_cycle_start entry
          3. violation count not monotonically decreasing
          4. convergence entry missing or final_cycle != expected

      - id: "T1-D9"
        name: "RGR Non-Convergence Safety Gate Truth Test"
        file: "tests/golden/test_rgr_non_convergence_truth.py"
        description: |
          Validates RGR loop safety when fixes introduce new issues (non-convergent).
          Injects circular dependency: fixing issue A creates issue B, fixing B recreates A.
          RGR loop must detect non-convergence and halt with diagnostic report.
          VERIFY: audit log records cycle-over-cycle issue fingerprints.
        production_scenario: |
          SCENARIO: Refactoring creates oscillating import cycle.
          - Cycle 1: Fix circular import in module_a → creates new import in module_b
          - Cycle 2: Fix module_b import → re-introduces module_a import
          - Cycle 3: Same pattern detected (fingerprint match) → HALT
          - Report: "Non-convergent: issues {A,B} oscillating since cycle 1"
        assertions:
          - "RGR loop halts at max_cycles or convergence detection"
          - "halt reason is NON_CONVERGENT not MAX_CYCLES_REACHED"
          - "diagnostic includes issue fingerprints across cycles"
          - "audit log records identical fingerprints in consecutive cycles"
        audit_requirements:
          - "audit log has rgr_convergence_check entries per cycle"
          - "at least 2 entries show matching issue_fingerprint sets"
          - "audit log has rgr_non_convergent_halt entry"
          - "halt entry includes oscillating_issues list"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. RGR loop runs to max_cycles without detecting oscillation
          2. halt reason is MAX_CYCLES_REACHED instead of NON_CONVERGENT
          3. audit log missing fingerprint comparison entries

      - id: "T1-D10"
        name: "RGR Multi-Scope Depth Scan Truth Test"
        file: "tests/golden/test_rgr_depth_scan_truth.py"
        description: |
          Validates that each RGR RED phase deepens its scan across layers.
          Cycle 1: Surface scan (file-level issues).
          Cycle 2: Structural scan (cross-file dependency issues).
          Cycle 3: Semantic scan (behavioral inconsistencies).
          Each cycle's scan depth must exceed the previous.
          VERIFY: audit log records scan_depth per cycle.
        production_scenario: |
          SCENARIO: Cleaning up stale references after orchestrator rename.
          - Cycle 1 (surface): Finds 8 direct import references → fixes all 8
          - Cycle 2 (structural): Finds 3 registry entries + 2 wiring refs → fixes 5
          - Cycle 3 (semantic): Finds 1 docstring ref + 1 test fixture name → fixes 2
          - Cycle 4: Re-scan at all depths → 0 found → EXIT
        assertions:
          - "4 RGR cycles executed"
          - "scan_depth increases: SURFACE → STRUCTURAL → SEMANTIC → ALL"
          - "total fixes = 15 across all cycles"
          - "final all-depth scan finds 0 issues"
        audit_requirements:
          - "audit log has rgr_scan entries with depth field"
          - "depth values are SURFACE, STRUCTURAL, SEMANTIC, ALL in order"
          - "each scan entry has issues_found count"
          - "final scan has issues_found=0"
        mocks_allowed: 0
        red_phase_criteria: |
          Test MUST FAIL if:
          1. all cycles use same scan depth (no deepening)
          2. audit log scan entries don't show progressive depth
          3. final cycle issues_found > 0

    tests_created: 10
    tests_deleted: 0
    audit_enhancement: |
      CRITICAL ADDITION: Every Golden Path test includes "Audit Truth Layer"
      - Tests query SQLite audit.db for hard evidence
      - RED phase fails if audit entries missing/stale/incorrect
      - Proves production behavior, not just test behavior
      - Creates permanent record for debugging
      
      RGR INTELLIGENCE ADDITION: Tests T1-D8 through T1-D10 validate the
      RGR loop engine itself via production-realistic scenarios:
      - Cross-orchestrator chain validation (TDD + Enforcement + Master)
      - Non-convergence safety gate (oscillation detection)
      - Progressive depth scanning (surface → structural → semantic)
      - Audit log as single source of truth for cycle-over-cycle behavior
    effort_adjustment: "+4 days for audit verification + RGR intelligence tests"
    
