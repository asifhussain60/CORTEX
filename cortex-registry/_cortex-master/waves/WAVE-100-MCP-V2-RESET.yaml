# ============================================================================
# CROSS-PLATFORM SETUP
# ============================================================================
cross_platform:
  approach: |
    Single setup script (.cortex/setup-mcp-v2.py) that:
    1. Detects OS (macOS/Windows/Linux)
    2. Finds Python interpreter (venv or system)
    3. Generates platform-specific .vscode/mcp.json
    4. Validates MCP server starts correctly
    5. Reports success/failure with troubleshooting
  
  platforms:
    macos:
      python_path: "${workspaceFolder}/.venv/bin/python"
      path_separator: "/"
    windows:
      python_path: "${workspaceFolder}\\.venv\\Scripts\\python.exe"
      path_separator: "\\"
    linux:
      python_path: "${workspaceFolder}/.venv/bin/python"
      path_separator: "/"
  
  mcp_json_template:
    schema: "servers"  # NOT "mcpServers"
    type: "stdio"      # Required field
    command: "${PYTHON_PATH}"
    args: ["-m", "cortex.mcp.v2"]
    env:
      PYTHONPATH: "${workspaceFolder}"
      CORTEX_MCP_ENABLED: "true"

