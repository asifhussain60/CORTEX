---

example_scenario_2:
  
  title: "High Impact, Medium Confidence - CONFIRM_BEFORE_EXECUTE"
  description: "Refactor core orchestrator interface"
  
  user_request:
    description: "Refactor IOrchestrator interface to add new method"
    scope: "module"
    impact: "high"
    confidence: 0.80
    
  temp_plan_output:
    plan_id: "xyz789abc123"
    status: "temp"
    classification:
      intent: "REFACTOR"
      confidence: 0.85
      handler: "RefactoringOrchestrator"
    challenges:
      - type: "risk_mismatch"
        title: "High impact with medium confidence"
        severity: "high"
        recommendation: "Review design with team before executing"
        can_proceed_without_addressing: false  # BLOCKING
    execution_gates:
      gate_type: "confirm_before_execute"
      requires_confirmation: true
      reason: "High impact + medium confidence requires confirmation"
      
  approval_flow:
    step_1: "Display TEMP YAML to user"
    step_2: "🚨 BLOCKING CHALLENGE detected: Risk mismatch"
    step_3: "User options:"
    options: |
      [1] Address challenge (modify confidence or reduce scope)
      [2] Acknowledge challenge and proceed anyway
      [3] Reject plan entirely
    step_4: "User chooses [2] - acknowledge and proceed"
    step_5: "User approves → moves to ACTIVE"
    
  execution_flow:
    step_1: "Plan in ACTIVE state, ready for execution"
    step_2: "Execution initiated"
    step_3: "Gate check: CONFIRM_BEFORE_EXECUTE"
    step_4: "Display context and ask for confirmation:"
    
    confirmation_display: |
      ┌────────────────────────────────────────────────────────────┐
      │ ⚠️  EXECUTION CONFIRMATION REQUIRED                        │
      ├────────────────────────────────────────────────────────────┤
      │                                                             │
      │ Plan: xyz789abc123                                         │
      │ Intent: REFACTOR (IOrchestrator interface)                 │
      │                                                             │
      │ IMPACT: 🔴 HIGH                                            │
      │ CONFIDENCE: 🟡 MEDIUM (80%)                               │
      │                                                             │
      │ This operation will affect 23 orchestrators across         │
      │ the entire system. Proceed with caution.                   │
      │                                                             │
      │ Estimated Duration: 30-45 seconds                          │
      │                                                             │
      │ Do you want to proceed? [Y/N]:                             │
      │                                                             │
      └────────────────────────────────────────────────────────────┘
      
    step_5: "User confirms: Y"
    step_6: "Progress bars display during execution"
    step_7: "On success: move to executed_plans/, display summary"

---

example_scenario_3:
  
  title: "Medium Impact, Low Confidence - BLOCKED (Design Review)"
  description: "Overhaul database schema"
  
  user_request:
    description: "Redesign orchestrator_registry table structure"
    scope: "system"
    impact: "high"
    confidence: 0.60
    
  temp_plan_output:
    plan_id: "ghi012jkl345"
    status: "temp"
    classification:
      intent: "REFACTOR"
      confidence: 0.70
      handler: "RefactoringOrchestrator"
    challenges:
      - type: "risk_mismatch"
        title: "High impact with low confidence"
        severity: "high"
        recommendation: "Increase confidence through design review or reduce scope"
        can_proceed_without_addressing: false  # BLOCKING
    execution_gates:
      gate_type: "blocked"
      requires_confirmation: true
      requires_design_review: true
      reason: "High impact + low confidence requires design review"
      
  approval_flow:
    step_1: "Display TEMP YAML to user"
    step_2: "🚫 EXECUTION BLOCKED - Design review required"
    step_3: "User sees:"
    
    blocked_message: |
      This plan cannot proceed to ACTIVE state because it violates
      the execution gate policy:
      
      - Impact Level: HIGH (affects entire system)
      - Confidence: LOW (60% - not sufficient)
      - Required Gate: Design Review + Confidence increase to 75%+
      
      Options:
      [1] Modify plan to reduce scope/impact
      [2] Gather more information to increase confidence
      [3] Request formal design review (escalate to team)
      [4] Reject plan entirely
      
    step_4: "User chooses [3] - request design review"
    step_5: "Plan marked for escalation, awaiting design review approval"

---

##############################################################################
# SECTION 6: CONFIGURATION SECTION - RUNTIME PARAMETERS
##############################################################################

runtime_config:
  
  # Default thresholds
  thresholds:
    high_confidence: 0.85
    medium_confidence: 0.70
    low_confidence: 0.50
    
    high_impact: 3  # Affects 3+ modules
    medium_impact: 1  # Affects 1-2 modules
    low_impact: 0   # Single file or less
    
  # Approval gates configuration
  approval:
    require_dor_validation: true
    require_challenge_resolution: true  # If any challenges exist
    blocking_challenge_types:
      - "governance"           # Always blocking
      - "risk_mismatch"        # If high impact + low confidence
      
    non_blocking_challenge_types:
      - "alternative_path"     # Informational
      - "scope_creep"          # Informational (unless word count > 2x)
      
  # Execution configuration
  execution:
    enable_auto_execute: true   # Allow AUTO_EXECUTE gates
    enable_progress_bars: true  # Display ASCII progress
    progress_bar_refresh_ms: 500  # Update frequency
    
    # Gate policy
    gate_policy:
      low_impact_high_confidence: "auto_execute"
      low_impact_medium_confidence: "notify_and_execute"
      low_impact_low_confidence: "confirm_before_execute"
      
      medium_impact_very_high_confidence: "auto_execute"
      medium_impact_high_confidence: "confirm_before_execute"
      medium_impact_medium_confidence: "blocked"
      medium_impact_low_confidence: "blocked"
      
      high_impact_very_high_confidence: "notify_user"
      high_impact_high_confidence: "confirm_before_execute"
      high_impact_medium_confidence: "blocked"
      high_impact_low_confidence: "blocked"
  
  # Storage configuration
  storage:
    temp_plans_path: "cortex-registry/planning/temp/"
    active_plans_path: "cortex-registry/planning/active/"
    executed_plans_path: "cortex-registry/planning/executed/"
    cache_in_memory: true
    yaml_format:
      default_flow_style: false
      sort_keys: false
      
  # Audit & Logging
  audit:
    enable_audit_trail: true
    log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    record_execution_output: true
    record_duration: true
    record_side_effects: true

---
##############################################################################
# SECTION 7: INTEGRATION POINTS - BUILT-IN ORCHESTRATORS
##############################################################################

integrations:
  
  lens_synthesis:
    module: "cortex.orchestrators.core.lens_synthesis"
    class: "LENSSynthesis"
    method: "synthesize"
    phase: "TEMP plan creation"
    input: "user_request"
    output: "classification (intent, confidence, handler)"
    
  git_analysis:
    module: "cortex.orchestrators.core.planner_orchestrator"
    method: "_initialize_git_context"
    phase: "TEMP plan creation"
    input: "local git state"
    output: "git_context (branch, status, commits)"
    
  challenge_engine:
    module: "cortex.orchestrators.core.planner_orchestrator"
    method: "_generate_challenges"
    phase: "TEMP plan creation"
    input: "user_request, classification"
    output: "challenges[] (4 types)"
    
  interaction_orchestrator:
    module: "cortex.orchestrators.core.interaction_orchestrator"
    class: "InteractionOrchestrator"
    phase: "Challenge resolution (optional)"
    input: "challenges[]"
    output: "user responses, modifications"
    
  execution_gates:
    module: "cortex.orchestrators.core.planner_orchestrator"
    method: "_compute_execution_gates"
    phase: "TEMP plan creation"
    input: "impact, confidence"
    output: "ExecutionGate (type, requires_confirmation)"
    
  routing_orchestrators:
    # Based on classification.handler, route to appropriate orchestrator
    routing_map:
      "IMPLEMENT": "TDDOrchestrator"
      "FIX": "IntentRouter"
      "REFACTOR": "RefactoringOrchestrator"
      "DOCUMENT": "DocumentationOrchestrator"
      "TEST": "TDDOrchestrator"
      "ANALYZE": "MasterOrchestrator"
    phase: "EXECUTE phase"
    input: "active_plan (full context)"
    output: "execution_result (success/failure)"
    
  database_registry:
    module: "cortex.orchestrators.core.database_registry"
    class: "DatabaseBackedRegistry"
    phase: "Orchestrator initialization"
    operation: "Register PlannerOrchestrator"
    status: "✅ Registered as CORE orchestrator"

---
##############################################################################
# SECTION 8: TRANSITION DIAGRAM (ASCII)
##############################################################################

ascii_state_diagram: |

  ┌──────────────────────────────────────────────────────────────────┐
  │         PLANNERORCHESTRATOR LIFECYCLE STATE MACHINE              │
  └──────────────────────────────────────────────────────────────────┘
  
  User Request
      │
      ▼
  ┌─────────────┐
  │   CREATE    │  [Generate plan_id, run LENS, git analysis]
  └────┬────────┘
       │
       ▼
  ┌──────────────────────────────────────────────────────────┐
  │              TEMP (Draft with Context)                   │
  │  - YAML structure fully built                            │
  │  - Challenges identified (if any)                        │
  │  - Execution gate computed                               │
  │  - Awaiting user review & approval                       │
  └──────┬─────────────────────────────────────────────────┬─┘
         │                                                 │
    [User reviews]                                [Can modify]
         │                                                 │
    ┌────┴───────────────────────────────────────────┐     │
    │                                                 │     │
    ▼                                                 ▼     │
