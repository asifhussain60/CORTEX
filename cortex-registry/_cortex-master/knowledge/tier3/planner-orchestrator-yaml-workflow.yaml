# ============================================================================
# PlannerOrchestrator YAML Workflow Configuration
# AC-PLANNER-YAML-001: Holistic Planning with LENS, Git Analysis, Challenges
# ============================================================================
# 
# WORKFLOW STATES:
#   1. TEMP (Draft with context) - Pending user approval
#   2. PENDING_APPROVAL - Awaiting explicit approval with DoR review
#   3. ACTIVE - Approved, ready for autonomous execution
#   4. EXECUTING - Currently running with progress tracking
#   5. EXECUTED - Completed successfully
#
# BUILT-IN ORCHESTRATORS:
#   - LENS Classification (Language→Examination→Navigation→Synthesis)
#   - Git Analysis (branch, status, recent commits)
#   - Challenge System (4 types: governance, alternative, scope, risk)
#   - InteractionOrchestrator (integrated for user challenges)
#   - Execution Gates (impact/confidence matrix)
#   - Autonomous Execution (with ASCII progress bars)
# ============================================================================

---
##############################################################################
# SECTION 1: YAML PLAN TEMPLATE (TEMP STATE - Pending Approval)
##############################################################################

plan_template:
  
  # Basic Metadata
  metadata:
    plan_id: "string (UUID12)"  # Generated automatically
    created_at: "ISO8601 timestamp"
    created_by: "user | system"
    version: "1.0"
    schema_version: "1.0"
    
  # Request Details (Context for Approval)
  request:
    description: "User's original request (REQUIRED)"
    scope: "line|function|file|module|system"  # Default: file
    impact: "low|medium|high"  # Default: medium
    confidence: 0.0-1.0 or "low|medium|high"  # Default: inferred from impact
    intent_override: "IMPLEMENT|FIX|REFACTOR|DOCUMENT|TEST|ANALYZE"  # Optional
    context: "Additional context for human reviewers"
    
  # LENS Classification Output
  classification:
    intent: "IMPLEMENT|FIX|REFACTOR|DOCUMENT|TEST|ANALYZE"
    confidence: 0.0-1.0  # Classifier confidence
    scope: "line|function|file|module|system"
    impact: "low|medium|high"
    handler: "TDDOrchestrator|IntentRouter|RefactoringOrchestrator|..."
    rationale: "Why this intent was chosen"
    
  # Git Context (Lightweight Analysis)
  git_context:
    branch: "current branch name"
    status: "clean|dirty|error"  # clean = no uncommitted changes
    uncommitted_changes:
      - "file path 1"
      - "file path 2"
    recent_commits:
      - hash: "abc123def456"
        message: "feat: added feature X"
      - hash: "def456ghi789"
        message: "fix: resolved issue Y"
    
  # Strategic Challenges (Context for Discussion)
  challenges:
    - type: "governance|alternative_path|scope_creep|risk_mismatch"
      title: "Challenge title"
      description: "Why this is a challenge"
      severity: "low|medium|high"
      recommendation: "How to address it"
      can_proceed_without_addressing: true|false  # Blocking vs advisory
      
  # Approval Status (Tracked Through Lifecycle)
  approval_status:
    status: "pending_approval|approved|rejected|modified"
    requested_at: "ISO8601 timestamp"
    approved_at: "ISO8601 timestamp or null"
    approved_by: "user or system"
    rejection_reason: "Why it was rejected (if rejected)"
    modification_history:
      - modified_at: "ISO8601 timestamp"
        modified_by: "user"
        changes: "What was changed"
        reason: "Why it was changed"
        
  # Execution Gates (Autonomous Decision Matrix)
  execution_gates:
    gate_type: "auto_execute|notify_and_execute|confirm_before_execute|notify_user|blocked"
    requires_confirmation: true|false
    requires_design_review: true|false  # Only if gate_type = blocked
    impact_level: "low|medium|high"
    confidence_level: "low|medium|high"
    reason: "Why this gate was selected"
    
  # Status State Machine
  status: "temp|pending_approval|active|executing|executed|rejected|failed|archived"
  
  # Execution History (Filled During/After Execution)
  execution_history:
    - executed_at: "ISO8601 timestamp"
      executed_by: "system|user"
      confirmed: true|false
      gate_applied: "gate_type that was applied"
      result: "success|failure|blocked"
      execution_log: "Output from orchestrator"
      duration_ms: 1234

---
##############################################################################
# SECTION 2: CONTEXT-BASED APPROVAL GATES
##############################################################################

approval_gates:
  
  # Gate 1: Definition of Ready (DoR)
  dor_gate:
    name: "Definition of Ready"
    checkpoint: "BEFORE moving TEMP → ACTIVE"
    required_fields:
      - request.description  # Must be non-empty
      - request.scope       # Must be specified
      - request.impact      # Must be specified
      - classification.intent  # LENS must have classified
      - execution_gates.gate_type  # Must have computed gate
    checklist:
      - "✓ Request description clear and specific"
      - "✓ Scope appropriately sized"
      - "✓ Impact level realistic"
      - "✓ Challenges reviewed (if any)"
      - "✓ Execution gate accepted"
    
    approval_flow:
      step_1: "Display TEMP YAML to user with context"
      step_2: "Show DoR checklist"
      step_3: "Highlight any CHALLENGES that are BLOCKING"
      step_4: "User reviews and approves/rejects/modifies"
      step_5: "If approved: move to ACTIVE, lock YAML"
      
  # Gate 2: Challenge Review Gate
  challenge_gate:
    name: "Strategic Challenge Review"
    checkpoint: "BEFORE DoR gate, if challenges exist"
    rules:
      - severity_high_and_blocking: "MUST address before approval"
      - severity_high_non_blocking: "Recommend addressing but not required"
      - severity_medium: "Can be addressed later"
      - severity_low: "Informational only"
      
    blocking_rules:
      - governance_violations: "Always blocking (CORE rules)"
      - risk_mismatch: "Blocking if high impact + low confidence"
      - scope_creep_severe: "Blocking if >2x expected word count"
      
    user_actions:
      - "address_challenge": "Modify request to address challenge"
      - "acknowledge_and_proceed": "Accept challenge, proceed anyway"
      - "reject_plan": "Reject plan entirely"
      
  # Gate 3: Execution Gate Enforcement
  execution_gate:
    name: "Autonomous Execution Gate"
    checkpoint: "AT execution time (ACTIVE → EXECUTING)"
    gate_matrix:
      low_impact:
        high_confidence: "AUTO_EXECUTE - proceed immediately"
        medium_confidence: "NOTIFY_AND_EXECUTE - notify, then proceed"
        low_confidence: "CONFIRM_BEFORE_EXECUTE - wait for user confirmation"
      medium_impact:
        very_high_confidence: "AUTO_EXECUTE - proceed immediately"
        high_confidence: "CONFIRM_BEFORE_EXECUTE - wait for user confirmation"
        medium_confidence: "BLOCKED - requires design review"
        low_confidence: "BLOCKED - requires design review"
      high_impact:
        very_high_confidence: "NOTIFY_USER - notify, wait for permission"
        high_confidence: "CONFIRM_BEFORE_EXECUTE - wait for explicit confirmation"
        medium_confidence: "BLOCKED - requires design review"
        low_confidence: "BLOCKED - requires design review"

---
##############################################################################
# SECTION 3: WORKFLOW STATE TRANSITIONS
##############################################################################

state_machine:
  
  initial_state: "temp"
  
  transitions:
    
    # Creation: User Request → TEMP YAML
    creation:
      from: "[new request]"
      to: "temp"
      actions:
        - "Generate plan_id (UUID12)"
        - "Run LENS classification"
        - "Perform git_context analysis"
        - "Generate challenges"
        - "Compute execution gates"
        - "Write TEMP YAML to disk"
      side_effects:
        - "Cache in memory"
        - "Log AC_START in audit trail"
        
    # Modification: User modifies TEMP before approval
    modify_temp:
      from: "temp"
      to: "temp"  # Stays in temp, but status becomes "modified"
      actions:
        - "Validate modifications against request schema"
        - "Re-run LENS classification with new request"
        - "Regenerate challenges"
        - "Recompute execution gates"
        - "Update YAML on disk"
      preconditions:
        - "Plan must be in TEMP state"
        - "Plan must not be locked (approval_status != approved)"
        
    # Approval: TEMP → ACTIVE (locks the plan)
    approve_plan:
      from: "temp"
      to: "pending_approval"
      then_to: "active"
      actions:
        - "Validate DoR checklist"
        - "Display final context to user"
        - "Wait for explicit approval confirmation"
        - "Lock YAML (no further modifications allowed)"
        - "Move from temp_plans/ to active_plans/"
        - "Set approval_status.status = approved"
        - "Record approval_status.approved_at timestamp"
      preconditions:
        - "DoR gate must pass (all required fields)"
        - "Challenge gate must be resolved (if blocking challenges)"
        - "User must explicitly confirm"
      side_effects:
        - "Trigger ac_approval_gate if configured"
        
    # Rejection: TEMP → REJECTED
    reject_plan:
      from: "temp"
      to: "rejected"
      actions:
        - "Record rejection reason"
        - "Update status in YAML"
        - "Keep in temp_plans/ for reference"
      side_effects:
        - "Log rejection reason in audit trail"
        
    # Execution: ACTIVE → EXECUTING → EXECUTED
    execute_plan:
      from: "active"
      to: "executing"
      then_to: "executed"
      actions:
        - "Check execution gate"
        - "If gate requires confirmation:"
        - "  - Ask user for explicit confirmation"
        - "  - Wait for response"
        - "If gate is AUTO_EXECUTE or confirmed:"
        - "  - Update status to EXECUTING"
        - "  - Display ASCII progress bar (live)"
        - "  - Execute via appropriate orchestrator"
        - "  - Capture execution output and timing"
        - "  - Move to executed_plans/"
        - "  - Update status to EXECUTED"
      execution_flow:
        - "Pass plan details to routing orchestrator"
        - "Orchestrator handles actual implementation"
        - "Stream progress with ASCII bars"
        - "Collect results and side effects"
        - "Return to PlannerOrchestrator for recording"

---
##############################################################################
# SECTION 4: ASCII PROGRESS TRACKING (EXECUTING STATE)
##############################################################################

progress_tracking:
  
  template: |
    ┌────────────────────────────────────────────────────────────┐
    │ 🚀 PLAN EXECUTION: {plan_id}                              │
    ├────────────────────────────────────────────────────────────┤
    │                                                             │
    │ PHASE: {current_phase}                                     │
    │ Progress: [{progress_bar}] {percentage}%                  │
    │                                                             │
    │ Status: {status_emoji} {status_text}                       │
    │ Duration: {elapsed}s / {estimated}s                        │
    │ ETA: {eta_seconds}s remaining                              │
    │                                                             │
    │ Last Action: {last_action}                                 │
    │ Current Step: {current_step}                               │
    │                                                             │
    └────────────────────────────────────────────────────────────┘
  
  phases:
    - phase: "INITIALIZE"
      weight: 5  # 5% of total time
      description: "Setting up execution environment"
      ascii_char: "⚙️"
      
    - phase: "VALIDATE"
      weight: 10  # 10% of total time
      description: "Validating inputs and preconditions"
      ascii_char: "✓"
      
    - phase: "PREPARE"
      weight: 15  # 15% of total time
      description: "Preparing work area and dependencies"
      ascii_char: "📦"
      
    - phase: "EXECUTE"
      weight: 50  # 50% of total time
      description: "Executing main operations"
      ascii_char: "▶️"
      
    - phase: "VERIFY"
      weight: 15  # 15% of total time
      description: "Verifying results and outputs"
      ascii_char: "🔍"
      
    - phase: "FINALIZE"
      weight: 5  # 5% of total time
      description: "Finalizing and recording results"
      ascii_char: "✨"
  
  progress_bar_styles:
    compact:    "⠀⠁⠂⠃⠄⠅⠆⠇⠈⠉⠊⠋⠌⠍⠎⠏"
    blocks:     "░░░░░░░░░░░░░░░░░░░░"
    arrows:     "←←←←←←←←←←→→→→→→→→→→"
    equals:     "═══════════════════════"
    
  status_emoji_mapping:
    queued: "⏳"
    executing: "🔄"
    success: "✅"
    failure: "❌"
    blocked: "🚫"
    warning: "⚠️"

---
##############################################################################
# SECTION 5: SAMPLE EXECUTION SCENARIO
##############################################################################

example_scenario_1:
  
