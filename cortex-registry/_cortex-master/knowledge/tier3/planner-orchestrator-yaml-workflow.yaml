    impact: "low"
    confidence: 0.95
    
  temp_plan_output:
    plan_id: "abc123def456"
    status: "temp"
    classification:
      intent: "REFACTOR"
      confidence: 0.90
      handler: "RefactoringOrchestrator"
    challenges: []  # No challenges
    execution_gates:
      gate_type: "auto_execute"
      requires_confirmation: false
      reason: "Low impact + very high confidence"
      
  approval_flow:
    step_1: "Display TEMP YAML to user"
    step_2: "✓ DoR checklist passes (all fields valid)"
    step_3: "✓ No challenges to review"
