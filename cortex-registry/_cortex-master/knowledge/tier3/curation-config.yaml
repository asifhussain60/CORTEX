---
# AI Curation Configuration
# AC: KN-002-01 - AI-Assisted Knowledge Curation

metadata:
  ac_id: "KN-002-01"
  title: "AI-Assisted Knowledge Curation"
  version: "1.0"
  updated: "2026-01-20"

quality_rules:
  content_length:
    min_length: 50
    recommended_length: 200
    weight: 0.3
    
  structure:
    required_fields:
      - entry_id
      - title
      - content
      - domain
    weight: 0.3
    
  completeness:
    fields:
      - ac_ids
      - tags
      - references
    weight: 0.4

duplicate_detection:
  similarity_threshold: 0.85
  comparison_fields:
    - title
    - content
  algorithm: "content_hash"

category_suggestion:
  confidence_threshold: 0.3
  max_suggestions: 5
  algorithm: "keyword_matching"
