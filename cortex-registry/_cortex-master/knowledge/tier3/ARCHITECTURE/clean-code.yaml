# 1. MEANINGFUL NAMES
naming_conventions:
  principle: "Names should reveal intent without requiring comments"
  importance: "Critical - names are everywhere in code"
  
  rules:
    - id: "naming_001"
      name: "Use Intention-Revealing Names"
      description: "Name should answer why it exists, what it does, how it's used"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              elapsed_time_in_days = 365  # Clear intent
              days_since_creation = 100
              days_since_modification = 50
            explanation: "Variable names explain what they measure"
          
          - language: "csharp"
            code: |
              List<Customer> activeCustomers = GetActiveCustomers();
              decimal totalRevenueThisQuarter = CalculateQuarterlyRevenue();
            explanation: "Names describe content and purpose"
        
        bad:
          - language: "python"
            code: |
              d = 365  # What does 'd' represent?
              elap = 100
              t = 50
            explanation: "Single-letter names require mental mapping"
          
          - language: "csharp"
            code: |
              List<Customer> list1 = GetCustomers();
              decimal amt = Calculate();
            explanation: "Generic names hide intent"
      
      detection_rules:
        - pattern: "^[a-z]$"
          description: "Single-letter variable names (except loop counters i, j, k)"
          severity: "HIGH"
        - pattern: "^(tmp|temp|data|value|item)[0-9]*$"
          description: "Generic meaningless names"
          severity: "MEDIUM"
    
    - id: "naming_002"
      name: "Avoid Disinformation"
      description: "Don't use names that mislead about what the code does"
      severity: "CRITICAL"
      examples:
        good:
          - language: "python"
            code: |
              account_group = []  # It's a list, not a dict
              customer_collection = {}  # It's a dict
            explanation: "Names match actual data structures"
        
        bad:
          - language: "python"
            code: |
              accountList = {}  # Misleading - it's a dict, not a list
              hp = calculate_distance()  # 'hp' suggests health points, not distance
            explanation: "Names contradict implementation"
      
      detection_rules:
        - pattern: ".*[Ll]ist.*"
          check: "Ensure variable is actually a list type"
          severity: "HIGH"
    
    - id: "naming_003"
      name: "Make Meaningful Distinctions"
      description: "If names must be different, they should also mean something different"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              def copy_chars(source: str, destination: str):
                  """Clear distinction between source and destination"""
                  pass
            explanation: "Names explain roles"
        
        bad:
          - language: "python"
            code: |
              def copy_chars(a1: str, a2: str):  # Which is source? Which is destination?
                  pass
              
              # Number-series naming
              product_info = {}
              product_data = {}  # What's the difference?
            explanation: "Indistinguishable names cause confusion"
      
      detection_rules:
        - pattern: ".*[0-9]+$"
          description: "Number-series naming (var1, var2)"
          severity: "HIGH"
        - pattern: ".*(Info|Data)$"
          description: "Noise words that don't add meaning"
          severity: "MEDIUM"
    
    - id: "naming_004"
      name: "Use Pronounceable Names"
      description: "If you can't pronounce it, you can't discuss it"
      severity: "MEDIUM"
      examples:
        good:
          - language: "python"
            code: |
              generation_timestamp = datetime.now()
              modification_timestamp = datetime.now()
            explanation: "Easy to discuss: 'generation timestamp'"
        
        bad:
          - language: "python"
            code: |
              genymdhms = datetime.now()  # Generate YMDHMS?
              modymdhms = datetime.now()
            explanation: "Unpronounceable abbreviations"
    
    - id: "naming_005"
      name: "Use Searchable Names"
      description: "Single-letter names and numeric constants are hard to locate"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              MAX_CLASSES_PER_STUDENT = 7
              
              for student in students:
                  if student.class_count > MAX_CLASSES_PER_STUDENT:
                      raise ValueError("Too many classes")
            explanation: "Can search for 'MAX_CLASSES_PER_STUDENT'"
        
        bad:
          - language: "python"
            code: |
              for s in students:
                  if s.count > 7:  # What is 7? Why 7?
                      raise ValueError("error")
            explanation: "Can't search for '7' or 's'"
      
      detection_rules:
        - pattern: "^[0-9]+$"
          description: "Magic numbers (except 0, 1, -1)"
          severity: "HIGH"
    
    - id: "naming_006"
      name: "Avoid Encodings (No Hungarian Notation)"
      description: "Modern IDEs make type prefixes unnecessary"
      severity: "LOW"
      examples:
        good:
          - language: "python"
            code: |
              phone_number: str = "+1-555-0100"
              customer: Customer = Customer()
            explanation: "Type hints > prefixes"
        
        bad:
          - language: "python"
            code: |
              str_phone_number = "+1-555-0100"  # Redundant
              obj_customer = Customer()  # Type obvious from constructor
            explanation: "Type prefixes are noise"
    
    - id: "naming_007"
      name: "Class Names Should Be Nouns"
      description: "Classes represent things, so use noun or noun phrases"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              class Customer:
                  pass
              
              class Account:
                  pass
              
              class AddressParser:
                  pass
            explanation: "Nouns describe entities"
        
        bad:
          - language: "python"
            code: |
              class Manager:  # Too generic
                  pass
              
              class Process:  # Verb, not noun
                  pass
            explanation: "Verbs or generic nouns"
      
      detection_rules:
        - pattern: "^(Manager|Processor|Data|Info)$"
          description: "Generic class names"
          severity: "MEDIUM"
    
    - id: "naming_008"
      name: "Method Names Should Be Verbs"
      description: "Methods do things, so use verb or verb phrases"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              def save_customer(customer: Customer):
                  pass
              
              def delete_page(page: Page):
                  pass
              
              def is_valid_email(email: str) -> bool:
                  return True
            explanation: "Verbs describe actions"
        
        bad:
          - language: "python"
            code: |
              def customer(data):  # Noun, not verb
                  pass
              
              def page():  # What does it do?
                  pass
            explanation: "Nouns don't describe actions"

# 2. FUNCTION DESIGN
function_design:
  principle: "Functions should do one thing and do it well"
  importance: "Critical - functions are the first line of organization"
  
  rules:
    - id: "function_001"
      name: "Small Functions"
      description: "Functions should be small, ideally 5-10 lines"
      severity: "HIGH"
      max_lines: 20
      ideal_lines: 10
      examples:
        good:
          - language: "python"
            code: |
              def is_test_page(page: Page) -> bool:
                  """Single responsibility: check if page is test page"""
                  return page.name.startswith("Test")
            explanation: "Does one thing, easy to understand"
        
        bad:
          - language: "python"
            code: |
              def process_page(page: Page):
                  """50+ lines doing multiple things"""
                  # Validate page
                  if not page.name:
                      raise ValueError("Invalid")
                  # Transform page
                  page.name = page.name.upper()
                  # Save page
                  db.save(page)
                  # Send notification
                  email.send(page.owner, "Page updated")
                  # Log activity
                  logger.info(f"Processed {page.name}")
                  # ... 40 more lines
            explanation: "Does 5+ things, hard to test"
      
      detection_rules:
        - metric: "lines_of_code"
          threshold: 20
          severity: "MEDIUM"
        - metric: "lines_of_code"
          threshold: 50
          severity: "HIGH"
    
    - id: "function_002"
      name: "Single Responsibility Principle (SRP)"
      description: "Functions should do ONE thing, do it well, do it only"
      severity: "CRITICAL"
      examples:
        good:
          - language: "python"
            code: |
              def calculate_total_price(items: List[Item]) -> Decimal:
                  """Single responsibility: calculate price"""
                  return sum(item.price for item in items)
              
              def apply_discount(price: Decimal, discount: Decimal) -> Decimal:
                  """Single responsibility: apply discount"""
                  return price * (1 - discount)
              
              def format_currency(amount: Decimal) -> str:
                  """Single responsibility: format as currency"""
                  return f"${amount:.2f}"
            explanation: "Each function has one clear purpose"
        
        bad:
          - language: "python"
            code: |
              def process_order(items: List[Item], discount: Decimal) -> str:
                  """Multiple responsibilities violated"""
                  # Calculate
                  total = sum(item.price for item in items)
                  # Apply business logic
                  discounted = total * (1 - discount)
                  # Format
                  formatted = f"${discounted:.2f}"
                  # Save to database
                  db.save_order(formatted)
                  # Send email
                  email.send("Order processed")
                  return formatted
            explanation: "Does 5 things: calculate, discount, format, save, notify"
      
      detection_rules:
        - metric: "cyclomatic_complexity"
          threshold: 5
          severity: "MEDIUM"
          description: "High complexity suggests multiple responsibilities"
    
    - id: "function_003"
      name: "One Level of Abstraction Per Function"
      description: "All statements in function should be at same level of abstraction"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              def render_page_with_setups_and_teardowns(page: Page) -> str:
                  """High-level abstraction"""
                  if is_test_page(page):
                      page = include_setup_and_teardown_pages(page)
                  return page.render_as_html()
            explanation: "All calls at same abstraction level"
        
        bad:
          - language: "python"
            code: |
              def render_page(page: Page) -> str:
                  """Mixed abstraction levels"""
                  if page.name.startswith("Test"):  # Low-level detail
                      setup = get_setup_pages()  # High-level
                      html = "<html>" + setup + "</html>"  # Low-level string concat
                      return html
            explanation: "Mixes high-level (get_setup) and low-level (string concat)"
    
    - id: "function_004"
      name: "Function Arguments (Ideal: 0-2, Max: 3)"
      description: "Fewer arguments = easier to understand and test"
      severity: "HIGH"
      ideal_args: 2
      max_args: 3
      examples:
        good:
          - language: "python"
            code: |
              # Zero arguments (best)
              def get_current_time() -> datetime:
                  return datetime.now()
              
              # One argument (good)
              def is_valid_email(email: str) -> bool:
                  return "@" in email
              
              # Two arguments (acceptable)
              def calculate_area(width: float, height: float) -> float:
                  return width * height
              
              # Three arguments with dataclass (better)
              @dataclass
              class Rectangle:
                  width: float
                  height: float
                  color: str
              
              def draw_rectangle(rect: Rectangle):
                  """Single argument encapsulates related data"""
                  pass
            explanation: "Fewer arguments or use data objects"
        
        bad:
          - language: "python"
            code: |
              def draw_rectangle(x: int, y: int, width: int, height: int, 
                               color: str, fill: bool, border_width: int):
                  """7 arguments - overwhelming!"""
                  pass
            explanation: "Too many arguments, hard to remember order"
      
      detection_rules:
        - metric: "parameter_count"
          threshold: 3
          severity: "MEDIUM"
        - metric: "parameter_count"
          threshold: 5
          severity: "HIGH"
    
    - id: "function_005"
      name: "Have No Side Effects"
      description: "Function should not change state outside its scope unexpectedly"
      severity: "CRITICAL"
      examples:
        good:
          - language: "python"
            code: |
              def check_password(username: str, password: str) -> bool:
                  """Pure function - no side effects"""
                  user = db.get_user(username)
                  return user.password == hash(password)
            explanation: "Only returns result, no hidden state changes"
        
        bad:
          - language: "python"
            code: |
              def check_password(username: str, password: str) -> bool:
                  """Hidden side effect!"""
                  user = db.get_user(username)
                  if user.password == hash(password):
                      Session.initialize()  # SIDE EFFECT!
                      return True
                  return False
            explanation: "Unexpectedly initializes session (temporal coupling)"
      
      detection_rules:
        - pattern: "global.*="
          description: "Modifying global state"
          severity: "CRITICAL"
        - pattern: "self\\.[a-z_]+ = "
          context: "outside_constructor"
          description: "Modifying instance state in query method"
          severity: "HIGH"
    
    - id: "function_006"
      name: "Command Query Separation"
      description: "Functions should either DO something or ANSWER something, not both"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              # Command (no return value)
              def set_attribute(name: str, value: str) -> None:
                  """Does something, returns nothing"""
                  self.attributes[name] = value
              
              # Query (returns value, no side effects)
              def attribute_exists(name: str) -> bool:
                  """Answers question, changes nothing"""
                  return name in self.attributes
            explanation: "Clear separation: command OR query"
        
        bad:
          - language: "python"
            code: |
              def set(attribute: str, value: str) -> bool:
                  """Does AND answers - confusing!"""
                  if self.attribute_exists(attribute):
                      self.attributes[attribute] = value
                      return True  # Success?
                  return False  # Or was attribute already false?
            explanation: "Return value ambiguous: success flag or attribute value?"

# 3. ERROR HANDLING
error_handling:
  principle: "Error handling is important, but shouldn't obscure logic"
  importance: "High - errors are facts of life"
  
  rules:
    - id: "error_001"
      name: "Use Exceptions Rather Than Return Codes"
      description: "Exceptions separate error handling from happy path logic"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              def send_shutdown_signal():
                  """Clean happy path"""
                  try:
                      device_handle = get_device_handle(DEV1)
                      device_handle.send_shutdown_signal()
                  except DeviceShutdownError as e:
                      logger.error(f"Shutdown failed: {e}")
            explanation: "Logic separated from error handling"
        
        bad:
          - language: "python"
            code: |
              def send_shutdown_signal():
                  """Cluttered with error checks"""
                  handle = get_handle(DEV1)
                  if handle != DeviceHandle.INVALID:
                      status = handle.send_shutdown()
                      if status != STATUS.OK:
                          logger.error("Shutdown failed")
                  else:
                      logger.error("Invalid handle")
            explanation: "Error checks obscure main logic"
    
    - id: "error_002"
      name: "Write Try-Catch-Finally First"
      description: "Try blocks define transaction scope - think of them first"
      severity: "MEDIUM"
      examples:
        good:
          - language: "python"
            code: |
              def retrieve_section(page_id: str) -> Section:
                  """Transaction boundaries clear"""
                  try:
                      page = load_page(page_id)
                      return page.get_section()
                  except Exception:
                      return Section.empty()
            explanation: "Clear scope of operation"
    
    - id: "error_003"
      name: "Provide Context with Exceptions"
      description: "Include informative error messages about operation and failure type"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              class InsufficientFundsError(Exception):
                  def __init__(self, account: str, requested: Decimal, available: Decimal):
                      self.account = account
                      self.requested = requested
                      self.available = available
                      super().__init__(
                          f"Insufficient funds in account {account}: "
                          f"requested ${requested}, available ${available}"
                      )
            explanation: "Detailed context for debugging"
        
        bad:
          - language: "python"
            code: |
              raise Exception("Error")  # What error? Where? Why?
            explanation: "No context for troubleshooting"
    
    - id: "error_004"
      name: "Don't Return Null"
      description: "Returning None forces callers to check, leading to NullPointerExceptions"
      severity: "CRITICAL"
      examples:
        good:
          - language: "python"
            code: |
              def get_employees() -> List[Employee]:
                  """Return empty list, never None"""
                  employees = fetch_from_db()
                  return employees if employees else []
              
              # Caller doesn't need null check
              for employee in get_employees():
                  total_pay += employee.salary
            explanation: "No None checks needed"
        
        bad:
          - language: "python"
            code: |
              def get_employees() -> Optional[List[Employee]]:
                  """Returns None if no employees"""
                  employees = fetch_from_db()
                  return employees if employees else None
              
              # Caller must check for None (often forgotten!)
              employees = get_employees()
              if employees is not None:  # Easy to forget this check
                  for employee in employees:
                      total_pay += employee.salary
            explanation: "Burden on every caller, easy to forget"
      
      detection_rules:
        - pattern: "return None"
          context: "collection_return_type"
          severity: "HIGH"
          suggestion: "Return empty collection instead"

# 4. COMMENTING
commenting:
  principle: "Comments should explain WHY, not WHAT. Code should explain WHAT."
  importance: "Medium - good code is self-documenting"
  
  rules:
    - id: "comment_001"
      name: "Comments Do Not Make Up for Bad Code"
      description: "Don't comment bad code - rewrite it!"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              # No comment needed - code is clear
              if employee.is_eligible_for_full_benefits():
                  process_benefits(employee)
            explanation: "Self-documenting code"
        
        bad:
          - language: "python"
            code: |
              # Check to see if employee is eligible for full benefits
              if (employee.flags & HOURLY_FLAG) and (employee.age > 65):
                  process_benefits(employee)
            explanation: "Comment explains confusing code - refactor instead!"
    
    - id: "comment_002"
      name: "Explain Yourself in Code, Not Comments"
      description: "Create functions/variables that explain intent"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              def is_employee_eligible_for_full_benefits(employee: Employee) -> bool:
                  return employee.is_hourly() and employee.age > 65
            explanation: "Function name explains intent"
        
        bad:
          - language: "python"
            code: |
              # Check if employee is eligible
              if (e.flags & HOURLY) and e.age > 65:
                  pass
            explanation: "Comment necessary because code unclear"
    
    - id: "comment_003"
      name: "Good Comments: Legal, Informative, Explanation of Intent"
      description: "Some comments are necessary and beneficial"
      severity: "INFO"
      good_comment_types:
        - type: "legal"
          example: "# Copyright (C) 2025 Company Inc. All rights reserved."
        
        - type: "docstring"
          example: |
            def calculate_tax(income: Decimal) -> Decimal:
                """
                Calculate federal income tax based on 2025 brackets.
                
                Args:
                    income: Gross annual income in USD
                
                Returns:
                    Federal tax amount owed
                
                Raises:
                    ValueError: If income is negative
                """
        
        - type: "explanation_of_intent"
          example: |
            # We use regex instead of simple string split because
            # customer names may contain hyphens (e.g., "Mary-Jane")
            pattern = re.compile(r"[A-Z][a-z]+(?:-[A-Z][a-z]+)?")
        
        - type: "warning_of_consequences"
          example: |
            # Don't run this test in production - it deletes data!
            @pytest.mark.destructive
            def test_database_cleanup():
                pass
        
        - type: "TODO"
          example: |
            # Use clear issue references instead of vague TODOs
            def fetch_user_data(user_id: str):
                pass
    
    - id: "comment_004"
      name: "Bad Comments: Mumbling, Redundant, Misleading"
      description: "These comments add no value or actively harm"
      severity: "MEDIUM"
      bad_comment_types:
        - type: "mumbling"
          example: |
            # Bad: Vague, unhelpful
            # This is important
            x = calculate_value()
        
        - type: "redundant"
          example: |
            # Bad: Comment repeats code
            # Increment counter by 1
            counter += 1
        
        - type: "misleading"
          example: |
            # Bad: Comment wrong after code changed
            # Returns list of active users
            def get_users():
                return User.objects.all()  # Actually returns ALL users!
        
        - type: "commented_out_code"
          example: |
            # Bad: Dead code
            # old_method()
            # legacy_system.connect()
            new_method()
      
      detection_rules:
        - pattern: "^\\s*#.*$"
          check: "Comment adds information not obvious from code"
          severity: "LOW"
        - pattern: "^\\s*# [A-Z][a-z]+.*$"
          description: "Sentence-style comment (often redundant)"
          severity: "LOW"

# 5. FORMATTING
formatting:
  principle: "Code formatting is about communication"
  importance: "Medium - consistency matters"
  
  rules:
    - id: "format_001"
      name: "Vertical Openness Between Concepts"
      description: "Blank lines separate thoughts"
      severity: "LOW"
      examples:
        good:
          - language: "python"
            code: |
              import os
              import sys
              
              from typing import List
              
              class Customer:
                  def __init__(self, name: str):
                      self.name = name
                  
                  def get_name(self) -> str:
                      return self.name
            explanation: "Blank lines separate import groups and methods"
    
    - id: "format_002"
      name: "Vertical Density (Related Code Should Be Close)"
      description: "Lines of code that are tightly related should appear vertically dense"
      severity: "MEDIUM"
      examples:
        good:
          - language: "python"
            code: |
              class ReporterConfig:
                  """Configuration for test reporter"""
                  def __init__(self):
                      self.class_name = "ReporterConfig"
                      self.properties = []
            explanation: "Related fields together, no blank lines"
    
    - id: "format_003"
      name: "Horizontal Alignment"
      description: "Prefer natural left-to-right flow"
      severity: "LOW"
      examples:
        good:
          - language: "python"
            code: |
              # Natural flow
              first_name = "John"
              last_name = "Doe"
              age = 30
            explanation: "No artificial alignment"
        
        bad:
          - language: "python"
            code: |
              # Artificial alignment (avoid)
              first_name  = "John"
              last_name   = "Doe"
              age         = 30
            explanation: "Alignment draws eye to wrong thing"

# 6. SOLID PRINCIPLES INTEGRATION
solid_principles:
  principle: "Clean code embodies SOLID principles"
  reference: "See OOP-DESIGN-BEST-PRACTICES.md for full SOLID documentation"
  
  integration_examples:
    - principle: "Single Responsibility Principle (SRP)"
      clean_code_rule: "function_002"
      example:
        language: "python"
        code: |
          # SRP + Clean Code
          class UserRepository:
              """Single responsibility: data access"""
              def save(self, user: User) -> None:
                  db.insert(user)
          
          class UserValidator:
              """Single responsibility: validation"""
              def validate(self, user: User) -> bool:
                  return user.email and "@" in user.email
        explanation: "Small, focused classes with clear names"
    
    - principle: "Open-Closed Principle (OCP)"
      clean_code_rule: "function_003"
      example:
        language: "python"
        code: |
          # OCP + Clean Code
          class PaymentProcessor(ABC):
              @abstractmethod
              def process(self, amount: Decimal) -> bool:
                  """Clean interface - one level of abstraction"""
                  pass
          
          class CreditCardProcessor(PaymentProcessor):
              def process(self, amount: Decimal) -> bool:
                  return self.charge_card(amount)
        explanation: "Extension without modification, clear abstractions"

# 7. CODE SMELLS (Integration with Anti-Patterns)
code_smells:
  reference: "See ANTI-PATTERNS-CATALOG.md for full smell documentation"
  
  smells_detected_by_clean_code_rules:
    - smell: "Long Method"
      violated_rules: ["function_001"]
      threshold: "20+ lines"
      refactoring: "Extract Method"
    
    - smell: "Long Parameter List"
      violated_rules: ["function_004"]
      threshold: "3+ parameters"
      refactoring: "Introduce Parameter Object"
    
    - smell: "Mysterious Name"
      violated_rules: ["naming_001", "naming_004"]
      refactoring: "Rename Variable/Method"
    
    - smell: "Comments"
      violated_rules: ["comment_001", "comment_002"]
      refactoring: "Extract Method, Rename Variable"
    
    - smell: "Dead Code"
      violated_rules: ["comment_004"]
      refactoring: "Delete Code"

# 8. AUTOMATION & TOOLING
automation:
  static_analysis_tools:
    python:
      - name: "pylint"
        rules_coverage:
          - "naming_*"
          - "function_001"
          - "function_004"
      - name: "flake8"
        rules_coverage:
          - "format_*"
          - "comment_004"
      - name: "mypy"
        rules_coverage:
          - "naming_006"
          - "error_004"
    
    csharp:
      - name: "StyleCop"
        rules_coverage:
          - "naming_*"
          - "format_*"
      - name: "FxCop"
        rules_coverage:
          - "function_*"
          - "error_*"
    
    typescript:
      - name: "ESLint"
        rules_coverage:
          - "naming_*"
          - "function_*"
      - name: "TSLint"
        rules_coverage:
          - "format_*"

# 9. METRICS & THRESHOLDS
metrics:
  function_length:
    ideal: 10
    warning: 20
    error: 50
    unit: "lines"
  
  function_parameters:
    ideal: 2
    warning: 3
    error: 5
    unit: "count"
  
  cyclomatic_complexity:
    ideal: 3
    warning: 5
    error: 10
    unit: "branches"
  
  class_length:
    ideal: 100
    warning: 200
    error: 500
    unit: "lines"

# 10. CORTEX AGENT INTEGRATION
cortex_integration:
  code_review_agent:
    capabilities:
      - "Validate all naming_* rules via AST parsing"
      - "Check function lengths and parameter counts"
      - "Detect side effects in query methods"
      - "Flag redundant/misleading comments"
    
    severity_mapping:
      CRITICAL: "Block PR merge"
      HIGH: "Require review approval"
      MEDIUM: "Warning only"
      LOW: "Informational"
  
  code_generation_agent:
    default_behaviors:
      - "Generate intention-revealing names (naming_001)"
      - "Keep functions under 10 lines (function_001)"
      - "Limit parameters to 2 (function_004)"
      - "Use exceptions, not return codes (error_001)"
      - "Add docstrings for public APIs only"
  
  refactoring_agent:
    triggers:
      - rule: "function_001"
        action: "Extract Method refactoring"
      - rule: "function_004"
        action: "Introduce Parameter Object"
      - rule: "comment_001"
        action: "Rename Variable/Method"

# END OF CLEAN CODE GUIDELINE
