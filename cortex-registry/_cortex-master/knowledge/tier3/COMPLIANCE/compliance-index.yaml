# Compliance Standards Index - Routing & Registry
# Authority: AC-COMPLIANCE-001
# Version: 1.0
# Created: 2026-01-28
# Purpose: Lightweight index for compliance standard routing (details in company/domains/)

metadata:
  version: "1.0"
  created_at: "2026-01-28T00:00:00Z"
  authority: "AC-COMPLIANCE-001"
  purpose: "Registry and routing rules for compliance standards"
  layer: "tier3-index"
  details_location: "company/domains/compliance-standards/"

# =============================================================================
# COMPLIANCE CATEGORIES
# =============================================================================

categories:
  payment_security:
    id: "PAYMENT"
    description: "Payment card and financial transaction security"
    standards: ["pci-dss"]
    triggers:
      - "credit card"
      - "payment processing"
      - "cardholder data"
      - "PAN"
      - "CVV"
    
  data_privacy:
    id: "PRIVACY"
    description: "Personal data protection and privacy regulations"
    standards: ["pii-protection", "gdpr", "ccpa"]
    triggers:
      - "personal data"
      - "PII"
      - "user data"
      - "consent"
      - "data subject"
      - "right to delete"
    
  healthcare:
    id: "HEALTHCARE"
    description: "Healthcare data and benefits administration"
    standards: ["hipaa", "hsa-fsa"]
    triggers:
      - "PHI"
      - "health data"
      - "medical records"
      - "HIPAA"
      - "HSA"
      - "FSA"
      - "healthcare"
    
  financial_services:
    id: "FINANCIAL"
    description: "Financial industry regulations and controls"
    standards: ["sox", "glba", "psd2"]
    triggers:
      - "financial reporting"
      - "audit trail"
      - "SOX"
      - "internal controls"
      - "banking"
      - "loan"
    
  security_frameworks:
    id: "SECURITY"
    description: "General security management frameworks"
    standards: ["soc2", "iso27001", "nist-800-53"]
    triggers:
      - "security controls"
      - "SOC 2"
      - "ISO 27001"
      - "NIST"
      - "security audit"
    
  government:
    id: "GOVERNMENT"
    description: "Government and federal compliance"
    standards: ["fedramp"]
    triggers:
      - "federal"
      - "government"
      - "FedRAMP"
      - "FISMA"
      - "public sector"
    
  accessibility:
    id: "ACCESSIBILITY"
    description: "Digital accessibility standards"
    standards: ["wcag"]
    triggers:
      - "accessibility"
      - "WCAG"
      - "ADA"
      - "screen reader"
      - "a11y"

# =============================================================================
# ROUTING RULES
# =============================================================================

routing:
  precedence:
    - "company/domains/{company}/compliance/"      # 1. Company-specific overrides
    - "company/domains/compliance-standards/"       # 2. Generic industry standards
    - "cortex_brain/tier3/knowledge/COMPLIANCE/"   # 3. Fallback patterns
  
  resolution_strategy: "merge_with_override"
  conflict_resolution: "company_wins"
  
  auto_detect:
    enabled: true
    scan_targets:
      - "code_comments"
      - "file_names"
      - "import_statements"
      - "string_literals"

# =============================================================================
# STANDARD REGISTRY
# =============================================================================

standards_registry:
  pci-dss:
    id: "PCI-DSS"
    name: "Payment Card Industry Data Security Standard"
    version: "4.0"
    category: "payment_security"
    path: "company/domains/compliance-standards/pci-dss.yaml"
    governing_body: "PCI Security Standards Council"
    
  pii-protection:
    id: "PII"
    name: "Personal Identifiable Information Protection"
    version: "1.0"
    category: "data_privacy"
    path: "company/domains/compliance-standards/pii-protection.yaml"
    governing_body: "Various (framework synthesis)"
    
  hipaa:
    id: "HIPAA"
    name: "Health Insurance Portability and Accountability Act"
    version: "2013"
    category: "healthcare"
    path: "company/domains/compliance-standards/hipaa.yaml"
    governing_body: "U.S. HHS"
    
  hsa-fsa:
    id: "HSA-FSA"
    name: "Health Savings & Flexible Spending Account Rules"
    version: "2026"
    category: "healthcare"
    path: "company/domains/compliance-standards/hsa-fsa.yaml"
    governing_body: "U.S. IRS / Treasury"
    
  gdpr:
    id: "GDPR"
    name: "General Data Protection Regulation"
    version: "2018"
    category: "data_privacy"
    path: "company/domains/compliance-standards/gdpr.yaml"
    governing_body: "European Union"
    
  ccpa:
    id: "CCPA"
    name: "California Consumer Privacy Act"
    version: "2023"
    category: "data_privacy"
    path: "company/domains/compliance-standards/ccpa.yaml"
    governing_body: "State of California"
    
  sox:
    id: "SOX"
    name: "Sarbanes-Oxley Act"
    version: "2002"
    category: "financial_services"
    path: "company/domains/compliance-standards/sox.yaml"
    governing_body: "U.S. SEC"
    
  glba:
    id: "GLBA"
    name: "Gramm-Leach-Bliley Act"
    version: "1999"
    category: "financial_services"
    path: "company/domains/compliance-standards/glba.yaml"
    governing_body: "U.S. FTC"
    
  psd2:
    id: "PSD2"
    name: "Payment Services Directive 2"
    version: "2018"
    category: "financial_services"
    path: "company/domains/compliance-standards/psd2.yaml"
    governing_body: "European Union"
    
  soc2:
    id: "SOC2"
    name: "Service Organization Control 2"
    version: "2017"
    category: "security_frameworks"
    path: "company/domains/compliance-standards/soc2.yaml"
    governing_body: "AICPA"
    
  iso27001:
    id: "ISO27001"
    name: "ISO/IEC 27001 Information Security"
    version: "2022"
    category: "security_frameworks"
    path: "company/domains/compliance-standards/iso27001.yaml"
    governing_body: "ISO/IEC"
    
  nist-800-53:
    id: "NIST-800-53"
    name: "NIST Security and Privacy Controls"
    version: "Rev 5"
    category: "security_frameworks"
    path: "company/domains/compliance-standards/nist-800-53.yaml"
    governing_body: "U.S. NIST"
    
  fedramp:
    id: "FEDRAMP"
    name: "Federal Risk and Authorization Management Program"
    version: "2024"
    category: "government"
    path: "company/domains/compliance-standards/fedramp.yaml"
    governing_body: "U.S. GSA"
    
  wcag:
    id: "WCAG"
    name: "Web Content Accessibility Guidelines"
    version: "2.1"
    category: "accessibility"
    path: "company/domains/compliance-standards/wcag.yaml"
    governing_body: "W3C"

# =============================================================================
# INTEGRATION HOOKS
# =============================================================================

integration:
  knowledge_synthesis:
    enabled: true
    hook: "cortex.brain.core.knowledge.knowledge_repository"
    method: "register_compliance_standards"
    
  intent_router:
    enabled: true
    hook: "cortex.orchestrators.core.intent_router"
    compliance_check_phase: "pre_execution"
    
  governance:
    enabled: true
    hook: "cortex.brain.core.governance_registry"
    rule_prefix: "COMPLIANCE"
    tier: 1
    escalation_policy: "warn_and_log"
