# Refactoring Techniques
# Authority: AC-PHASE65-S1-001

title: "Refactoring Best Practices"
category: "backend-python"
version: "1.0"

best_practices:
  preconditions:
    test_coverage_first:
      description: "Ensure adequate test coverage before refactoring"
    one_change_at_a_time:
      description: "Apply one refactoring step at a time; verify tests pass"
    commit_between_steps:
      description: "Commit after each successful refactoring step"
  techniques:
    extract_method:
      description: "Extract long code blocks into well-named helper methods"
    rename_variable:
      description: "Rename unclear variables/functions to reveal intent"
    introduce_parameter_object:
      description: "Replace long parameter lists with a value object"
    extract_class:
      description: "Move cohesive responsibilities to a dedicated class"
    replace_conditional_with_polymorphism:
      description: "Use polymorphism instead of complex if/elif chains"
    introduce_explaining_variable:
      description: "Name complex expressions with intermediate variables"
    remove_dead_code:
      description: "Delete unused functions, variables, and imports"
  validation:
    all_tests_pass:
      description: "All existing tests must pass after each refactoring"
    no_behaviour_change:
      description: "Refactoring must not alter observable behaviour"
    coverage_maintained:
      description: "Test coverage must not decrease"
