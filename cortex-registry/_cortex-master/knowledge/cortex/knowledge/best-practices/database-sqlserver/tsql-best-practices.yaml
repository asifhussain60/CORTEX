---
metadata:
  domain: "T-SQL Best Practices"
  version: "1.0.0"
  source: "Microsoft SQL Server Documentation + Industry Standards"
  authority: "Microsoft"
  date: "2026-02-14"
  description: "Best practices for T-SQL development and performance"
  tags: ["tsql", "sql-server", "database", "performance", "query-optimization"]

patterns:
  query_optimization:
    - id: "TSQL-PERF-001"
      name: "Use EXISTS Instead of IN for Large Datasets"
      category: "performance"
      description: "EXISTS stops at first match, IN evaluates all values"
      bad: "WHERE column IN (SELECT id FROM large_table)"
      good: "WHERE EXISTS (SELECT 1 FROM large_table WHERE id = column)"
      benefit: "Faster for large subquery results"

    - id: "TSQL-PERF-002"
      name: "Avoid SELECT *"
      category: "performance"
      description: "Select only needed columns"
      why:
        - "Reduces I/O and network traffic"
        - "Prevents blocking when table schema changes"
        - "Improves index usage"
      example: "SELECT UserId, UserName FROM Users"

    - id: "TSQL-PERF-003"
      name: "Use SET NOCOUNT ON"
      category: "performance"
      description: "Disable row count messages in stored procedures"
      implementation: "SET NOCOUNT ON; at start of procedure"
      benefit: "Reduces network traffic, faster execution"

    - id: "TSQL-PERF-004"
      name: "Use Table Variables or Temp Tables Appropriately"
      category: "performance"
      description: "Choose based on data volume and complexity"
      table_variables:
        use_when: "< 100 rows, simple queries"
        pros: "No statistics, less logging, function-scoped"
        cons: "No statistics (poor execution plans for large data)"
      temp_tables:
        use_when: "> 100 rows, complex queries, need indexes"
        pros: "Statistics available, can create indexes"
        cons: "More overhead, stored in tempdb"

  indexing:
    - id: "TSQL-IDX-001"
      name: "Create Indexes on Foreign Keys"
      category: "indexing"
      description: "Foreign keys are frequently used in JOINs"
      implementation: "CREATE INDEX IX_TableName_ForeignKeyColumn ON TableName(ForeignKeyColumn)"
      benefit: "Faster JOIN operations"

    - id: "TSQL-IDX-002"
      name: "Use Covering Indexes for Frequent Queries"
      category: "indexing"
      description: "Include all columns needed in INCLUDE clause"
      example: "CREATE INDEX IX_Users_Email INCLUDE (FirstName, LastName) ON Users(Email)"
      benefit: "Index contains all needed data, no table lookup"

    - id: "TSQL-IDX-003"
      name: "Monitor Index Fragmentation"
      category: "maintenance"
      description: "Rebuild or reorganize fragmented indexes"
      thresholds:
        - "< 10%: No action"
        - "10-30%: REORGANIZE"
        - "> 30%: REBUILD"
      query: "SELECT * FROM sys.dm_db_index_physical_stats(...)"

  stored_procedures:
    - id: "TSQL-SP-001"
      name: "Use Parameterized Queries"
      category: "security"
      description: "Prevent SQL injection"
      bad: "EXEC('SELECT * FROM Users WHERE Id = ' + @Id)"
      good: "SELECT * FROM Users WHERE Id = @Id"
      benefit: "Prevents SQL injection, enables plan caching"

    - id: "TSQL-SP-002"
      name: "Use TRY...CATCH for Error Handling"
      category: "error-handling"
      description: "Gracefully handle errors in stored procedures"
      pattern: |
        BEGIN TRY
          -- code
        END TRY
        BEGIN CATCH
          -- log error, rollback transaction
          THROW;
        END CATCH

    - id: "TSQL-SP-003"
      name: "Use Explicit Transactions"
      category: "transactions"
      description: "Control transaction boundaries explicitly"
      pattern: |
        BEGIN TRANSACTION;
        BEGIN TRY
          -- multiple operations
          COMMIT TRANSACTION;
        END TRY
        BEGIN CATCH
          ROLLBACK TRANSACTION;
          THROW;
        END CATCH

  data_types:
    - id: "TSQL-DT-001"
      name: "Use Appropriate Data Types"
      category: "schema-design"
      description: "Choose smallest appropriate data type"
      examples:
        - "Use INT instead of BIGINT if values < 2 billion"
        - "Use VARCHAR(50) instead of VARCHAR(MAX) for short strings"
        - "Use DATE instead of DATETIME if time not needed"
      benefit: "Reduces storage, faster queries"

    - id: "TSQL-DT-002"
      name: "Use NVARCHAR for Unicode, VARCHAR for ASCII"
      category: "schema-design"
      description: "NVARCHAR uses 2 bytes per char, VARCHAR uses 1"
      when_nvarchar: "International characters, emojis"
      when_varchar: "English-only, no special characters"

  joins:
    - id: "TSQL-JOIN-001"
      name: "Use INNER JOIN Syntax, Not WHERE"
      category: "readability"
      description: "Modern explicit JOIN syntax preferred"
      old: "FROM Users u, Orders o WHERE u.Id = o.UserId"
      new: "FROM Users u INNER JOIN Orders o ON u.Id = o.UserId"
      why: "Clearer intent, harder to accidentally create Cartesian product"

    - id: "TSQL-JOIN-002"
      name: "Filter Early with WHERE, Not HAVING"
      category: "performance"
      description: "WHERE filters before aggregation, HAVING after"
      bad: "GROUP BY ... HAVING Status = 'Active'"
      good: "WHERE Status = 'Active' GROUP BY ..."
      benefit: "Reduces rows processed by GROUP BY"

best_practices:
  query_writing:
    - "Always specify column names (no SELECT *)"
    - "Use EXISTS instead of COUNT(*) > 0 for existence checks"
    - "Avoid functions on indexed columns in WHERE (kills index usage)"
    - "Use SET NOCOUNT ON in stored procedures"
    - "Comment complex queries"
  
  performance:
    - "Create indexes on foreign keys and WHERE/JOIN columns"
    - "Use execution plans to identify bottlenecks"
    - "Avoid cursors (use set-based operations)"
    - "Limit result sets with TOP or pagination"
    - "Use parameterized queries for plan reuse"
  
  security:
    - "Never concatenate user input into SQL (use parameters)"
    - "Grant minimum required permissions"
    - "Use schemas to organize objects"
    - "Enable SQL Server Audit for sensitive operations"
  
  maintenance:
    - "Rebuild indexes regularly (>30% fragmentation)"
    - "Update statistics after large data changes"
    - "Monitor deadlocks and long-running queries"
    - "Archive old data to keep tables lean"

anti_patterns:
  - name: "Using Cursors for Row-by-Row Processing"
    why: "Very slow, procedural instead of set-based"
    fix: "Use JOINs, CTEs, or window functions"
  
  - name: "Using NOLOCK Hint Everywhere"
    why: "Can read uncommitted/dirty data"
    fix: "Use READ COMMITTED SNAPSHOT ISOLATION if stale reads acceptable"
  
  - name: "Not Using Transactions for Multi-Statement Operations"
    why: "Inconsistent state if error occurs mid-operation"
    fix: "Wrap in explicit transaction with TRY...CATCH"
  
  - name: "Using Functions in WHERE Clause"
    why: "Prevents index usage (not SARGable)"
    example_bad: "WHERE YEAR(OrderDate) = 2024"
    example_good: "WHERE OrderDate >= '2024-01-01' AND OrderDate < '2025-01-01'"

references:
  - name: "SQL Server Best Practices"
    url: "https://learn.microsoft.com/en-us/sql/relational-databases/best-practices"
  - name: "T-SQL Performance Tuning"
    url: "https://learn.microsoft.com/en-us/sql/relational-databases/performance/performance-monitoring-and-tuning-tools"
