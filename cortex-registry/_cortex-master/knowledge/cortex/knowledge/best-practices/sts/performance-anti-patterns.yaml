---
metadata:
  domain: "STS Performance Anti-Patterns"
  version: "1.0.0"
  source: "CORTEX STS Catalog - Performance Issues"
  authority: "Asif Hussain"
  date: "2026-02-14"
  description: "8 performance anti-patterns from STS transformation showcase"
  tags: ["performance", "optimization", "n+1", "caching", "async", "sts"]

anti_patterns:
  - id: "PERF-001"
    name: "N+1 Query Problem"
    severity: "HIGH"
    category: "database"
    description: "Loop executes separate query for each iteration instead of batch query"
    detection:
      indicators:
        - "Query inside foreach/for loop"
        - "ORM lazy loading in iteration"
        - "Multiple round-trips to database"
      code_smells:
        - "foreach + DbContext.Find()"
        - "for + repository.GetById()"
    impact:
      performance: "100x slower for 100 items"
      scalability: "Linear degradation with data growth"
      cost: "Excessive database connection usage"
    fix:
      pattern: "Eager loading or batch query"
      example: "Use Include() or load all IDs in single query"
      effort: "LOW"
    related_standards:
      - "Entity Framework Core: Eager Loading"
      - "Repository Pattern: Batch Operations"

  - id: "PERF-002"
    name: "Missing Result Caching"
    severity: "MEDIUM"
    category: "caching"
    description: "Expensive computation repeated without caching (API calls, DB queries, calculations)"
    detection:
      indicators:
        - "Repeated identical expensive operations"
        - "No IMemoryCache or IDistributedCache usage"
        - "API calls in every request"
      code_smells:
        - "Same DB query in multiple methods"
        - "External API call without cache-aside pattern"
    impact:
      performance: "2-10x slower depending on operation"
      cost: "Wasted API quota/database load"
      user_experience: "Slower page loads"
    fix:
      pattern: "Cache-aside pattern or memoization"
      example: "ASP.NET Core IMemoryCache or Redis"
      effort: "MEDIUM"
    related_standards:
      - "Azure Well-Architected: Performance Efficiency"
      - "Caching Strategies: Cache-Aside Pattern"

  - id: "PERF-003"
    name: "Synchronous Blocking I/O"
    severity: "HIGH"
    category: "async"
    description: "Blocking thread while waiting for I/O (DB, file, API) instead of async/await"
    detection:
      indicators:
        - ".Result or .Wait() on async methods"
        - "Synchronous file/network operations"
        - "Thread starvation under load"
      code_smells:
        - "Task.Result in ASP.NET Core"
        - "File.ReadAllText() instead of ReadAllTextAsync()"
    impact:
      performance: "Thread pool exhaustion"
      scalability: "Cannot handle concurrent requests"
      reliability: "Deadlocks possible"
    fix:
      pattern: "async/await throughout call chain"
      example: "async Task + await DbContext.ToListAsync()"
      effort: "MEDIUM to HIGH (requires cascading changes)"
    related_standards:
      - "C# Best Practices: Async/Await"
      - "ASP.NET Core: Asynchronous Programming"

  - id: "PERF-004"
    name: "Large Payload Transfer"
    severity: "MEDIUM"
    category: "api"
    description: "Returning entire entity with unused fields instead of DTO projection"
    detection:
      indicators:
        - "API returns full database entity"
        - "No Select() projection in LINQ"
        - "Large JSON responses (>1MB)"
      code_smells:
        - "return await DbContext.Entities.ToListAsync()"
        - "Circular reference serialization issues"
    impact:
      performance: "Network bandwidth waste"
      security: "Over-exposure of data"
      user_experience: "Slow API responses"
    fix:
      pattern: "DTO projection with Select()"
      example: "Select(e => new EntityDto { Id, Name })"
      effort: "LOW"
    related_standards:
      - "REST API Design: Response Optimization"
      - "GraphQL: Field Selection"

  - id: "PERF-005"
    name: "Inefficient String Concatenation"
    severity: "LOW"
    category: "code"
    description: "Using + operator in loop instead of StringBuilder"
    detection:
      indicators:
        - "String concatenation in loop"
        - "Repeated string += operations"
      code_smells:
        - "for (var i=0; i<1000; i++) str += i;"
    impact:
      performance: "O(n²) vs O(n) with StringBuilder"
      memory: "Excessive allocations"
    fix:
      pattern: "StringBuilder for loops, string interpolation for single"
      example: "var sb = new StringBuilder(); sb.Append()"
      effort: "LOW"
    related_standards:
      - "C# Performance: String Handling"

  - id: "PERF-006"
    name: "Unbounded Query Results"
    severity: "HIGH"
    category: "database"
    description: "No pagination or result limiting on large datasets"
    detection:
      indicators:
        - "ToList() without Take()"
        - "No pagination parameters in API"
        - "SELECT * without WHERE or LIMIT"
      code_smells:
        - "DbContext.Entities.ToListAsync()"
        - "No Skip/Take in LINQ"
    impact:
      performance: "Memory overflow on large tables"
      scalability: "Database load increases with data growth"
      user_experience: "Timeouts on large datasets"
    fix:
      pattern: "Pagination with Skip/Take or cursor-based"
      example: ".Skip(page * size).Take(size)"
      effort: "MEDIUM"
    related_standards:
      - "REST API Design: Pagination"
      - "Entity Framework: Query Optimization"

  - id: "PERF-007"
    name: "Missing Database Indexes"
    severity: "HIGH"
    category: "database"
    description: "Frequent queries on non-indexed columns causing table scans"
    detection:
      indicators:
        - "Slow queries on WHERE/JOIN columns"
        - "Execution plan shows table scan"
        - "No indexes defined in migrations"
      code_smells:
        - "Where(e => e.NonIndexedColumn == value)"
        - "Missing HasIndex() in EF Core configuration"
    impact:
      performance: "Linear search instead of logarithmic"
      scalability: "Degrades with table size"
      cost: "High CPU usage on database"
    fix:
      pattern: "Add indexes on frequently queried columns"
      example: "HasIndex(e => e.Email).IsUnique()"
      effort: "LOW (migration only)"
    related_standards:
      - "Database Design: Indexing Strategies"
      - "Entity Framework Core: Indexes"

  - id: "PERF-008"
    name: "Heavy Computation in Controller"
    severity: "MEDIUM"
    category: "architecture"
    description: "Business logic and transformations in controller instead of service layer"
    detection:
      indicators:
        - "Complex LINQ in controller action"
        - "Data transformation logic in controller"
        - "No service layer abstraction"
      code_smells:
        - "Multiple .Select(), .Where() in controller"
        - "Business rules in controller methods"
    impact:
      testability: "Hard to unit test"
      reusability: "Logic duplicated across controllers"
      performance: "Cannot optimize centrally"
    fix:
      pattern: "Move to service layer or CQRS handler"
      example: "Controller calls service.ProcessData()"
      effort: "MEDIUM (refactoring required)"
    related_standards:
      - "SOLID: Single Responsibility Principle"
      - "Clean Architecture: Service Layer"

best_practices:
  detection_workflow:
    - "Profile application under load (dotTrace, PerfView)"
    - "Identify bottlenecks (CPU, I/O, memory, database)"
    - "Apply targeted fix (don't optimize prematurely)"
    - "Measure improvement with benchmarks"
  
  tools:
    - "BenchmarkDotNet: Micro-benchmarking"
    - "Application Insights: APM monitoring"
    - "SQL Server Profiler: Query analysis"
    - "dotTrace: CPU/memory profiling"
  
  prevention:
    - "Use async/await for I/O operations"
    - "Add indexes on foreign keys and WHERE columns"
    - "Implement caching for expensive operations"
    - "Use pagination on list endpoints"
    - "Project DTOs instead of full entities"

references:
  - name: "ASP.NET Core Performance Best Practices"
    url: "https://learn.microsoft.com/en-us/aspnet/core/performance/performance-best-practices"
  - name: "Entity Framework Core Performance"
    url: "https://learn.microsoft.com/en-us/ef/core/performance/"
  - name: "Azure Architecture: Performance Efficiency"
    url: "https://learn.microsoft.com/en-us/azure/architecture/framework/scalability/performance-efficiency"
