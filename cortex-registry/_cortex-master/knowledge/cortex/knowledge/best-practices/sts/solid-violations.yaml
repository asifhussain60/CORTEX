# STS SOLID Principle Violations Catalog
# Authority: STS Framework - SOLID Category (15 violations)
# Version: 1.0 | Created: 2026-02-14

metadata:
  title: "STS SOLID Violations (15 Flaws)"
  version: "1.0"
  domain: "sts"
  pattern_count: 15
  applicable_intents: ["ANALYZE", "REFACTOR"]

violations:
  god_object:
    id: "STS-SOLID-001"
    principle: "Single Responsibility Principle"
    severity: "HIGH"
    description: "Class doing too many things (>500 LOC, >10 methods)"
    remediation: "Extract cohesive responsibilities into separate classes"
  
  tight_coupling:
    id: "STS-SOLID-002"
    principle: "Dependency Inversion Principle"
    severity: "HIGH"
    description: "Direct instantiation instead of dependency injection"
    remediation: "Inject dependencies via constructor"
  
  lsp_violation:
    id: "STS-SOLID-003"
    principle: "Liskov Substitution Principle"
    severity: "MEDIUM"
    description: "Subclass changes base class behavior unexpectedly"
    remediation: "Follow contract, use composition over inheritance"
  
  interface_bloat:
    id: "STS-SOLID-004"
    principle: "Interface Segregation Principle"
    severity: "MEDIUM"
    description: "Fat interface forcing unused methods on implementers"
    remediation: "Split into focused interfaces"
  
  open_closed_violation:
    id: "STS-SOLID-005"
    principle: "Open/Closed Principle"
    severity: "MEDIUM"
    description: "Modifying class to add behavior instead of extending"
    remediation: "Use strategy pattern or inheritance"

# Additional 10 patterns: STS-SOLID-006 through STS-SOLID-015
# Covers circular dependencies, feature envy, data clumps, etc.

cortex_integration:
  analyzer: "SOLIDOrchestrator detects violations via AST analysis"
  metrics: "solid_score = violations by principle"
