# =============================================================================
# CACHING OVERVIEW
# =============================================================================

caching_overview:
  description: "Store computed or fetched data for faster subsequent access"
  
  benefits:
    - "Reduced latency (10-1000x faster)"
    - "Lower database/API load"
    - "Improved scalability"
    - "Cost savings (fewer expensive operations)"
    
  tradeoffs:
    - "Increased complexity"
    - "Memory overhead"
    - "Stale data risk"
    - "Cache invalidation challenges"
    
  when_to_cache:
    - condition: "Data fetched frequently"
      example: "User profile accessed on every request"
      benefit: "Eliminates repeated database queries"
      
    - condition: "Data computation expensive"
      example: "Complex report generation"
      benefit: "Amortizes computation cost across many requests"
      
    - condition: "Data changes infrequently"
      example: "Configuration settings, static content"
      benefit: "Long cache lifetimes, minimal staleness"
      
    - condition: "External API rate-limited"
      example: "Third-party API with 1000 req/hour limit"
      benefit: "Reduces API calls, avoids rate limiting"
      
  when_not_to_cache:
    - condition: "Data changes frequently"
      reason: "High invalidation overhead, frequent cache misses"
      threshold: "If data TTL < request interval, don't cache"
      
    - condition: "Data rarely reused"
      reason: "Cache miss overhead > direct fetch"
      example: "Unique user queries"
      
    - condition: "Data privacy-sensitive"
      reason: "Risk of exposing data to wrong user"
      example: "Medical records, financial data"
      mitigation: "Use encrypted, user-scoped caches"

# =============================================================================
# CACHE PATTERNS
# =============================================================================

cache_patterns:
  - name: "Cache-Aside (Lazy Loading)"
    description: "Application manages cache explicitly"
    flow: |
      1. Check cache for data
      2. If cache hit: return cached data
      3. If cache miss:
         a. Fetch from database
         b. Store in cache
         c. Return data
    
    pros:
      - "Only caches data that's accessed"
      - "Cache failures don't break application"
      - "Application controls what to cache"
      
    cons:
      - "Cache miss penalty (extra roundtrip)"
      - "Possible cache stampede on cold start"
      - "Application must handle cache logic"
      
    implementation:
      python: |
        import redis
        import json
        
        cache = redis.Redis(host='localhost', port=6379)
        
        def get_user(user_id):
            # Try cache first
            cache_key = f"user:{user_id}"
            cached = cache.get(cache_key)
            
            if cached:
                return json.loads(cached)  # Cache hit
            
            # Cache miss - fetch from database
            user = db.query(User).get(user_id)
            
            # Store in cache (TTL 1 hour)
            cache.setex(cache_key, 3600, json.dumps(user))
            
            return user
            
      csharp: |
        public async Task<User> GetUserAsync(int userId)
        {
            var cacheKey = $"user:{userId}";
            
            // Try cache
            var cached = await _cache.GetStringAsync(cacheKey);
            if (cached != null)
            {
                return JsonSerializer.Deserialize<User>(cached);
            }
            
            // Cache miss - fetch from database
            var user = await _db.Users.FindAsync(userId);
            
            // Store in cache (1 hour TTL)
            var options = new DistributedCacheEntryOptions
            {
                AbsoluteExpirationRelativeToNow = TimeSpan.FromHours(1)
            };
            await _cache.SetStringAsync(
                cacheKey,
                JsonSerializer.Serialize(user),
                options
            );
            
            return user;
        }
        
    use_cases:
      - "User profiles"
      - "Product catalogs"
      - "Configuration data"
      
  - name: "Read-Through Cache"
    description: "Cache sits between application and database, handles misses automatically"
    flow: |
      1. Application requests data from cache
      2. If cache hit: return cached data
      3. If cache miss:
         a. Cache fetches from database
         b. Cache stores data
         c. Cache returns data to application
         
    pros:
      - "Application code simpler (no cache logic)"
      - "Consistent caching behavior"
      - "Cache library handles fetching"
      
    cons:
      - "Tight coupling to cache implementation"
      - "Cache miss still has penalty"
      - "Less control over what's cached"
      
    implementation:
      python: |
        # Using dogpile.cache
        from dogpile.cache import make_region
        
        region = make_region().configure(
            'dogpile.cache.redis',
            expiration_time=3600,
            arguments={
                'host': 'localhost',
                'port': 6379,
            }
        )
        
        @region.cache_on_arguments()
        def get_user(user_id):
            # Cache handles fetching automatically
            return db.query(User).get(user_id)
        
        # Usage (cache logic transparent)
        user = get_user(123)
        
    use_cases:
      - "Simplify application code"
      - "Standardize caching across services"
      
  - name: "Write-Through Cache"
    description: "Writes go through cache to database, keeping cache always up-to-date"
    flow: |
      1. Application writes data to cache
      2. Cache synchronously writes to database
      3. Cache confirms write success
      
    pros:
      - "Cache always consistent with database"
      - "No stale data"
      - "Reads always fast (cache hit)"
      
    cons:
      - "Write latency increased (sequential writes)"
      - "Cache stores even rarely-read data"
      - "Requires cache library support"
      
    implementation:
      conceptual: |
        def update_user(user_id, data):
            # Write to cache
            cache.set(f"user:{user_id}", data)
            
            # Cache automatically writes to database
            # (handled by cache library)
            
    use_cases:
      - "Strong consistency requirements"
      - "Read-heavy workloads where writes are infrequent"
      
  - name: "Write-Behind (Write-Back) Cache"
    description: "Writes to cache immediately, asynchronously writes to database later"
    flow: |
      1. Application writes data to cache
      2. Cache confirms write immediately
      3. Cache asynchronously writes to database (batched)
      
    pros:
      - "Very fast writes (async)"
      - "Can batch database writes"
      - "Reduces database write load"
      
    cons:
      - "Risk of data loss if cache fails before flush"
      - "Eventual consistency"
      - "Complex error handling"
      
    implementation:
      python: |
        import asyncio
        from collections import deque
        
        class WriteBackCache:
            def __init__(self, flush_interval=5):
                self.cache = {}
                self.write_queue = deque()
                self.flush_interval = flush_interval
                asyncio.create_task(self._flush_loop())
            
            def set(self, key, value):
                # Write to cache immediately
                self.cache[key] = value
                
                # Queue for async write to database
                self.write_queue.append((key, value))
                
            async def _flush_loop(self):
                while True:
                    await asyncio.sleep(self.flush_interval)
                    
                    # Batch write to database
                    while self.write_queue:
                        key, value = self.write_queue.popleft()
                        await db.write(key, value)
                        
    use_cases:
      - "High write throughput required"
      - "Can tolerate eventual consistency"
      - "Gaming (leaderboards), analytics"
      
    warning: "ΓÜá∩╕Å Ensure persistence mechanism for durability"
    
  - name: "Refresh-Ahead"
    description: "Automatically refresh cache before expiration"
    flow: |
      1. Background job monitors cache expiration
      2. Before TTL expires, refresh data from source
      3. Update cache with fresh data
      
    pros:
      - "Eliminates cache miss penalty"
      - "Always fresh data"
      - "Predictable performance"
      
    cons:
      - "Unnecessary refreshes if data not accessed"
      - "Background job overhead"
      - "Complex implementation"
      
    implementation:
      python: |
        import threading
        import time
        
        class RefreshAheadCache:
            def __init__(self, ttl=3600, refresh_threshold=0.8):
                self.cache = {}
                self.ttl = ttl
                self.refresh_threshold = refresh_threshold  # Refresh at 80% of TTL
                
            def get(self, key, fetch_fn):
                if key in self.cache:
                    value, timestamp = self.cache[key]
                    
                    # Check if refresh needed (80% of TTL elapsed)
                    age = time.time() - timestamp
                    if age > self.ttl * self.refresh_threshold:
                        # Trigger async refresh
                        threading.Thread(
                            target=self._refresh,
                            args=(key, fetch_fn)
                        ).start()
                    
                    return value
                else:
                    # Cache miss - fetch synchronously
                    value = fetch_fn()
                    self.cache[key] = (value, time.time())
                    return value
            
            def _refresh(self, key, fetch_fn):
                value = fetch_fn()
                self.cache[key] = (value, time.time())
                
    use_cases:
      - "Predictable latency critical"
      - "Popular content (news, trending items)"

# =============================================================================
# CACHE INVALIDATION STRATEGIES
# =============================================================================

cache_invalidation:
  description: "Ensure cache doesn't serve stale data"
  quote: "There are only two hard things in Computer Science: cache invalidation and naming things - Phil Karlton"
  
  strategies:
    - name: "Time-To-Live (TTL)"
      description: "Expire cache entries after fixed duration"
      
      pros:
        - "Simple to implement"
        - "Automatic cleanup"
        - "Bounded staleness"
        
      cons:
        - "May serve stale data until TTL expires"
        - "Cache miss at expiration (thundering herd risk)"
        
      implementation:
        redis: |
          # Set with TTL (expires in 1 hour)
          cache.setex("user:123", 3600, json.dumps(user))
          
        memcached: |
          # Set with TTL (expires in 1 hour)
          cache.set("user:123", user, time=3600)
          
      ttl_guidelines:
        - data_type: "Static content (logo, CSS)"
          ttl: "1 year"
          
        - data_type: "Semi-static (product catalog)"
          ttl: "1 hour - 1 day"
          
        - data_type: "User-generated content"
          ttl: "5-30 minutes"
          
        - data_type: "Real-time data (stock prices)"
          ttl: "1-60 seconds"
          
    - name: "Explicit Invalidation"
      description: "Delete or update cache when source data changes"
      
      pros:
        - "Always fresh data"
        - "No stale data served"
        
      cons:
        - "Application must track all cache keys"
        - "Complex in distributed systems"
        - "Risk of missing invalidations"
        
      implementation:
        python: |
          def update_user(user_id, data):
              # Update database
              db.query(User).filter_by(id=user_id).update(data)
              db.commit()
              
              # Invalidate cache
              cache_key = f"user:{user_id}"
              cache.delete(cache_key)
              
              # OR update cache directly
              # cache.setex(cache_key, 3600, json.dumps(data))
              
      patterns:
        - pattern: "Write-Through"
          approach: "Update cache on write"
          
        - pattern: "Write-Invalidate"
          approach: "Delete cache entry on write, let next read repopulate"
          
    - name: "Event-Based Invalidation"
      description: "Subscribe to data change events, invalidate on notification"
      
      pros:
        - "Decouples invalidation from application logic"
        - "Works across services"
        - "Real-time invalidation"
        
      cons:
        - "Requires event infrastructure"
        - "Eventual consistency (event delay)"
        - "Complex setup"
        
      implementation:
        python: |
          import redis
          
          # Publisher (service that updates data)
          def update_user(user_id, data):
              db.update_user(user_id, data)
              
              # Publish invalidation event
              redis_client.publish(
                  'cache:invalidate',
                  json.dumps({'type': 'user', 'id': user_id})
              )
          
          # Subscriber (cache service)
          def invalidation_listener():
              pubsub = redis_client.pubsub()
              pubsub.subscribe('cache:invalidate')
              
              for message in pubsub.listen():
                  if message['type'] == 'message':
                      event = json.loads(message['data'])
                      cache_key = f"{event['type']}:{event['id']}"
                      cache.delete(cache_key)
                      
    - name: "Cache Tagging / Grouping"
      description: "Tag cache entries, invalidate all entries with tag"
      
      pros:
        - "Bulk invalidation easy"
        - "Logical grouping of related data"
        
      cons:
        - "Requires tag management"
        - "Can over-invalidate"
        
      implementation:
        python: |
          # Tag cache entries
          def cache_with_tags(key, value, tags):
              cache.set(key, value)
              
              # Store key in each tag's set
              for tag in tags:
                  cache.sadd(f"tag:{tag}", key)
          
          # Invalidate by tag
          def invalidate_tag(tag):
              # Get all keys with this tag
              keys = cache.smembers(f"tag:{tag}")
              
              # Delete all keys
              if keys:
                  cache.delete(*keys)
              
              # Delete tag set
              cache.delete(f"tag:{tag}")
          
          # Usage
          cache_with_tags("user:123:profile", user_data, tags=["user:123"])
          cache_with_tags("user:123:posts", posts, tags=["user:123", "posts"])
          
          # Invalidate all user:123 caches
          invalidate_tag("user:123")

# =============================================================================
# DISTRIBUTED CACHING
# =============================================================================

distributed_caching:
  description: "Share cache across multiple application servers"
  
  technologies:
    - name: "Redis"
      type: "In-memory data store"
      
      features:
        - "Key-value store"
        - "Data structures (lists, sets, sorted sets, hashes)"
        - "Pub/Sub messaging"
        - "Persistence (RDB, AOF)"
        - "Replication"
        - "Lua scripting"
        
      use_cases:
        - "Session storage"
        - "Real-time analytics"
        - "Leaderboards (sorted sets)"
        - "Distributed locks"
        
      performance:
        - "Reads: ~100k ops/sec (single instance)"
        - "Writes: ~80k ops/sec"
        - "Latency: <1ms (network)"
        
      example:
        python: |
          import redis
          
          # Connect to Redis
          r = redis.Redis(host='localhost', port=6379, decode_responses=True)
          
          # Simple key-value
          r.set('key', 'value', ex=3600)  # TTL 1 hour
          value = r.get('key')
          
          # Hash (object storage)
          r.hset('user:123', mapping={'name': 'John', 'age': '30'})
          user = r.hgetall('user:123')  # {'name': 'John', 'age': '30'}
          
          # Lists (queues)
          r.lpush('queue', 'task1', 'task2')
          task = r.rpop('queue')
          
          # Sets (unique items)
          r.sadd('tags', 'python', 'redis', 'caching')
          tags = r.smembers('tags')
          
          # Sorted sets (leaderboards)
          r.zadd('leaderboard', {'player1': 100, 'player2': 200})
          top = r.zrevrange('leaderboard', 0, 9, withscores=True)
          
    - name: "Memcached"
      type: "Distributed memory caching"
      
      features:
        - "Simple key-value store"
        - "Multi-threaded"
        - "No persistence"
        - "LRU eviction"
        
      pros:
        - "Simpler than Redis"
        - "Multi-threaded (better multi-core usage)"
        - "Faster for simple key-value"
        
      cons:
        - "No data structures"
        - "No persistence"
        - "No pub/sub"
        
      use_cases:
        - "Pure caching (no persistence needed)"
        - "Simple key-value workloads"
        
      example:
        python: |
          import memcache
          
          mc = memcache.Client(['127.0.0.1:11211'])
          
          # Set with TTL (60 seconds)
          mc.set('key', 'value', time=60)
          
          # Get
          value = mc.get('key')
          
          # Delete
          mc.delete('key')
          
    - name: "Application-Level (In-Process)"
      type: "Local caching within application"
      
      libraries:
        python:
          - name: "functools.lru_cache"
            example: |
              from functools import lru_cache
              
              @lru_cache(maxsize=128)
              def expensive_function(n):
                  # Computation...
                  return result
                  
          - name: "cachetools"
            example: |
              from cachetools import TTLCache
              
              cache = TTLCache(maxsize=100, ttl=300)  # 100 items, 5 min TTL
              
              def get_data(key):
                  if key in cache:
                      return cache[key]
                  
                  value = fetch_expensive_data(key)
                  cache[key] = value
                  return value
                  
        csharp:
          - name: "MemoryCache"
            example: |
              using Microsoft.Extensions.Caching.Memory;
              
              private readonly IMemoryCache _cache;
              
              public string GetData(string key)
              {
                  if (!_cache.TryGetValue(key, out string value))
                  {
                      value = FetchExpensiveData(key);
                      
                      var options = new MemoryCacheEntryOptions
                      {
                          AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(5)
                      };
                      _cache.Set(key, value, options);
                  }
                  
                  return value;
              }
              
      pros:
        - "No network overhead"
        - "Fastest access (in-process)"
        - "Simple setup"
        
      cons:
        - "Not shared across servers"
        - "Limited by process memory"
        - "Lost on restart"
        
      use_cases:
        - "Single-server deployments"
        - "Computation memoization"
        - "L1 cache in multi-tier caching"
  
  cache_hierarchy:
    description: "Multi-level caching for optimal performance"
    
    levels:
      - level: "L1: Application Cache"
        technology: "In-process (LRU cache, MemoryCache)"
        latency: "<1ms"
        size: "10-100 MB"
        scope: "Single process"
        
      - level: "L2: Distributed Cache"
        technology: "Redis, Memcached"
        latency: "1-5ms"
        size: "1-100 GB"
        scope: "All servers"
        
      - level: "L3: CDN / Edge Cache"
        technology: "CloudFlare, Akamai, CloudFront"
        latency: "10-50ms"
        size: "Unlimited"
        scope: "Global"
        
    implementation:
      python: |
        from functools import lru_cache
        import redis
        
        # L1: In-process cache
        local_cache = lru_cache(maxsize=128)
        
        # L2: Distributed cache
        redis_cache = redis.Redis()
        
        def get_user(user_id):
            # Try L1 first
            if user_id in local_cache:
                return local_cache[user_id]
            
            # Try L2 (Redis)
            cache_key = f"user:{user_id}"
            cached = redis_cache.get(cache_key)
            if cached:
                user = json.loads(cached)
                local_cache[user_id] = user  # Populate L1
                return user
            
            # Cache miss - fetch from database
            user = db.query(User).get(user_id)
            
            # Populate caches
            redis_cache.setex(cache_key, 3600, json.dumps(user))  # L2: 1 hour
            local_cache[user_id] = user  # L1
            
            return user

# =============================================================================
# CACHE EVICTION POLICIES
# =============================================================================

eviction_policies:
  description: "Strategies for removing entries when cache is full"
  
  algorithms:
    - name: "LRU (Least Recently Used)"
      description: "Evict least recently accessed item"
      
      pros:
        - "Simple and effective"
        - "Keeps frequently accessed items"
        - "Good general-purpose policy"
        
      cons:
        - "Doesn't consider access frequency"
        - "Can evict item accessed once long ago"
        
      use_cases:
        - "General-purpose caching"
        - "When recent access predicts future access"
        
      implementation_note: "O(1) with doubly-linked list + hash map"
      
    - name: "LFU (Least Frequently Used)"
      description: "Evict least frequently accessed item"
      
      pros:
        - "Keeps popular items longer"
        - "Better for workloads with clear popularity distribution"
        
      cons:
        - "Old popular items may never be evicted"
        - "New items at disadvantage"
        
      use_cases:
        - "Content delivery (videos, articles)"
        - "Static assets"
        
    - name: "FIFO (First In, First Out)"
      description: "Evict oldest item"
      
      pros:
        - "Very simple"
        - "Predictable behavior"
        
      cons:
        - "Ignores access patterns completely"
        - "May evict frequently used items"
        
      use_cases:
        - "When all items have equal value"
        - "Time-based expiration sufficient"
        
    - name: "Random"
      description: "Evict random item"
      
      pros:
        - "Simplest implementation"
        - "No metadata overhead"
        
      cons:
        - "May evict hot items"
        - "No optimization"
        
      use_cases:
        - "When simplicity more important than performance"
        - "Very small caches"
        
    - name: "TTL-Based"
      description: "Evict expired items first"
      
      pros:
        - "Ensures freshness"
        - "Explicit control over item lifetime"
        
      cons:
        - "Requires TTL management"
        - "May keep rarely-used items if not expired"
        
      use_cases:
        - "Data with known freshness requirements"
        - "Time-sensitive information"
        
  choosing_policy:
    decision_tree:
      - condition: "Recent access predicts future access"
        recommendation: "LRU"
        example: "User sessions, recent documents"
        
      - condition: "Popular items accessed repeatedly"
        recommendation: "LFU"
        example: "Popular videos, trending articles"
        
      - condition: "Data has expiration time"
        recommendation: "TTL"
        example: "API responses, computed results"
        
      - condition: "Simplicity paramount"
        recommendation: "Random or FIFO"
        example: "Small caches, prototyping"

# =============================================================================
# CACHING ANTI-PATTERNS
# =============================================================================

anti_patterns:
  - name: "Cache Stampede (Thundering Herd)"
    description: "Many requests simultaneously hit cache miss, overload database"
    
    scenario: |
      1. Popular cache entry expires
      2. 1000 concurrent requests hit cache miss
      3. All 1000 fetch from database simultaneously
      4. Database overloaded, requests slow/fail
      
    solutions:
      - solution: "Locking (Request Coalescing)"
        description: "First request fetches, others wait"
        implementation:
          python: |
            import threading
            
            locks = {}
            
            def get_with_lock(key, fetch_fn):
                # Create lock for this key if needed
                if key not in locks:
                    locks[key] = threading.Lock()
                
                # Try cache first
                value = cache.get(key)
                if value:
                    return value
                
                # Cache miss - acquire lock
                with locks[key]:
                    # Double-check cache (another thread may have populated)
                    value = cache.get(key)
                    if value:
                        return value
                    
                    # Fetch from database (only one thread does this)
                    value = fetch_fn()
                    cache.set(key, value)
                    return value
                    
      - solution: "Probabilistic Early Expiration"
        description: "Refresh cache before expiration with probability"
        implementation:
          python: |
            import random
            import time
            
            def get_with_early_expiration(key, fetch_fn, ttl=3600):
                cached = cache.get(key)
                if cached:
                    value, timestamp = cached
                    age = time.time() - timestamp
                    
                    # Probability of early refresh increases with age
                    # Formula: P = age / TTL * beta (beta=1 means refresh at 100% of TTL)
                    beta = 1.5  # Start refreshing at 67% of TTL
                    if random.random() < (age / ttl) * beta:
                        # Refresh in background
                        value = fetch_fn()
                        cache.set(key, (value, time.time()))
                    
                    return value
                else:
                    value = fetch_fn()
                    cache.set(key, (value, time.time()))
                    return value
                    
  - name: "Cache Penetration"
    description: "Queries for non-existent data bypass cache, hit database"
    
    scenario: |
      Attacker queries user:9999999 (doesn't exist)
      ΓåÆ Cache miss
      ΓåÆ Database query returns null
      ΓåÆ Nothing cached
      ΓåÆ Next request repeats (DoS)
      
    solutions:
      - solution: "Cache Null Results"
        description: "Cache absence of data with short TTL"
        implementation:
          python: |
            def get_user(user_id):
                cache_key = f"user:{user_id}"
                cached = cache.get(cache_key)
                
                if cached == "NULL":  # Explicitly cached as non-existent
                    return None
                elif cached:
                    return json.loads(cached)
                
                # Fetch from database
                user = db.query(User).get(user_id)
                
                if user:
                    cache.setex(cache_key, 3600, json.dumps(user))
                else:
                    # Cache non-existence with shorter TTL
                    cache.setex(cache_key, 60, "NULL")
                
                return user
                
      - solution: "Bloom Filter"
        description: "Pre-filter requests for non-existent items"
        implementation:
          python: |
            from pybloom_live import BloomFilter
            
            # Create Bloom filter of existing user IDs
            bf = BloomFilter(capacity=1000000, error_rate=0.001)
            for user_id in db.query(User.id).all():
                bf.add(user_id)
            
            def get_user(user_id):
                # Check Bloom filter first
                if user_id not in bf:
                    return None  # Definitely doesn't exist
                
                # May exist - check cache/database
                return get_user_from_cache_or_db(user_id)
                
  - name: "Cache Invalidation Failures"
    description: "Stale data served due to missed invalidations"
    
    causes:
      - "Forgetting to invalidate on update"
      - "Invalidation failures (network error)"
      - "Cache key inconsistencies"
      
    solutions:
      - solution: "Defensive TTL"
        description: "Always use TTL as safety net"
        guideline: "Even with explicit invalidation, set reasonable TTL"
        
      - solution: "Versioned Keys"
        description: "Include version in cache key"
        implementation:
          python: |
            def get_user(user_id):
                version = db.query(User.version).filter_by(id=user_id).scalar()
                cache_key = f"user:{user_id}:v{version}"
                
                cached = cache.get(cache_key)
                if cached:
                    return json.loads(cached)
                
                user = db.query(User).get(user_id)
                cache.setex(cache_key, 3600, json.dumps(user))
                return user
                
      - solution: "Event Sourcing"
        description: "Replay events to rebuild cache"
        
  - name: "Over-Caching"
    description: "Caching too much data, wasting memory"
    
    problems:
      - "Cache full, high eviction rate"
      - "Rarely-accessed data evicts useful data"
      - "Memory pressure"
      
    solutions:
      - "Cache only hot data (>N accesses)"
      - "Use different TTLs based on access frequency"
      - "Monitor cache hit rate, eviction rate"
      
  - name: "Under-Caching"
    description: "Not caching data that should be cached"
    
    indicators:
      - "High database load for read queries"
      - "Slow response times"
      - "Same queries repeated frequently"
      
    solutions:
      - "Profile database queries"
      - "Identify repeated queries"
      - "Add caching for top 20% of queries"

# =============================================================================
# BEST PRACTICES
# =============================================================================

best_practices:
  - practice: "Cache What Matters"
    description: "Focus on high-impact data"
    guidelines:
      - "Cache data accessed >10x per minute"
      - "Cache expensive computations (>100ms)"
      - "Don't cache rarely-accessed data"
      
  - practice: "Set Appropriate TTLs"
    description: "Balance freshness vs performance"
    recommendations:
      - data: "User sessions"
        ttl: "30 minutes - 1 hour"
      - data: "Product catalog"
        ttl: "1 hour - 1 day"
      - data: "Computed reports"
        ttl: "5-30 minutes"
      - data: "Static content"
        ttl: "1 day - 1 week"
        
  - practice: "Monitor Cache Performance"
    description: "Track key metrics"
    metrics:
      - metric: "Hit Rate"
        target: ">80%"
        calculation: "Hits / (Hits + Misses)"
        
      - metric: "Eviction Rate"
        target: "<10% of writes"
        indication: "High rate ΓåÆ cache too small"
        
      - metric: "Latency (p95)"
        target: "<5ms for distributed cache"
        
      - metric: "Memory Usage"
        target: "<80% of capacity"
        
  - practice: "Handle Cache Failures Gracefully"
    description: "Application should work without cache"
    pattern: |
      try:
          value = cache.get(key)
          if value:
              return value
      except CacheError:
          # Cache down - continue without it
          pass
      
      # Fallback to database
      return db.fetch(key)
      
  - practice: "Use Consistent Keys"
    description: "Standardize key naming"
    format: "{resource}:{id}:{subresource}"
    examples:
      - "user:123:profile"
      - "product:456:reviews"
      - "order:789:items"
      
  - practice: "Compress Large Values"
    description: "Reduce memory usage and network transfer"
    implementation:
      python: |
        import gzip
        import json
        
        def cache_compressed(key, value):
            json_str = json.dumps(value)
            compressed = gzip.compress(json_str.encode())
            cache.set(key, compressed)
        
        def get_compressed(key):
            compressed = cache.get(key)
            if compressed:
                json_str = gzip.decompress(compressed).decode()
                return json.loads(json_str)
            return None
            
  - practice: "Warm Up Cache Proactively"
    description: "Pre-populate cache on startup or deployment"
    implementation:
      python: |
        def warm_up_cache():
            # Popular items
            popular_users = db.query(User).filter(User.popular == True).all()
            for user in popular_users:
                cache.setex(f"user:{user.id}", 3600, json.dumps(user))
            
            # Frequently accessed data
            config = db.query(Config).first()
            cache.setex("config", 3600, json.dumps(config))
            
        # Call on application startup
        warm_up_cache()
