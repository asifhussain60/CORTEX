# =============================================================================
# PROFILING OVERVIEW
# =============================================================================

profiling_overview:
  description: "Systematic measurement and analysis of program performance"
  
  goals:
    - "Identify performance bottlenecks"
    - "Understand resource consumption patterns"
    - "Validate optimization effectiveness"
    - "Establish performance baselines"
    - "Enable data-driven optimization decisions"
  
  profiling_types:
    - type: "CPU Profiling"
      measures: "Function execution time, call counts"
      use_when: "High CPU usage, slow computations"
      overhead: "5-30% slowdown"
      
    - type: "Memory Profiling"
      measures: "Memory allocation, retention, leaks"
      use_when: "High memory usage, out-of-memory errors"
      overhead: "50-200% slowdown"
      
    - type: "I/O Profiling"
      measures: "Disk, network, database operations"
      use_when: "Waiting on external resources"
      overhead: "Minimal (<5%)"
      
    - type: "Concurrency Profiling"
      measures: "Thread/process utilization, contention"
      use_when: "Multi-threaded applications, race conditions"
      overhead: "10-50% slowdown"

# =============================================================================
# CPU PROFILING
# =============================================================================

cpu_profiling:
  description: "Identify which functions consume the most CPU time"
  
  profiling_approaches:
    - name: "Deterministic Profiling"
      description: "Records every function call"
      pros:
        - "Complete accuracy"
        - "Exact call counts"
      cons:
        - "High overhead (20-30%)"
        - "May distort timing"
      tools: "cProfile (Python), Instrumentation profilers"
      
    - name: "Statistical/Sampling Profiling"
      description: "Periodically samples call stack"
      pros:
        - "Low overhead (<5%)"
        - "More realistic timing"
      cons:
        - "May miss infrequent calls"
        - "Statistical approximation"
      tools: "py-spy (Python), Sampling profilers"
  
  tools_by_language:
    python:
      tools:
        - name: "cProfile"
          type: "Deterministic"
          use_case: "General CPU profiling"
          overhead: "HIGH"
          example: |
            import cProfile
            import pstats
            from io import StringIO
            
            # Profile function
            profiler = cProfile.Profile()
            profiler.enable()
            
            your_function()  # Code to profile
            
            profiler.disable()
            
            # Print stats
            stream = StringIO()
            stats = pstats.Stats(profiler, stream=stream)
            stats.strip_dirs()
            stats.sort_stats('cumulative')
            stats.print_stats(20)  # Top 20 functions
            print(stream.getvalue())
          interpretation: |
            Key columns:
            - ncalls: Number of calls
            - tottime: Total time in function (excluding subcalls)
            - cumtime: Total time including subcalls
            - Focus on high cumtime functions
            
        - name: "line_profiler"
          type: "Line-by-line"
          use_case: "Detailed function analysis"
          overhead: "VERY HIGH"
          example: |
            # Install: pip install line_profiler
            # Decorate functions to profile
            
            @profile
            def slow_function():
                result = []
                for i in range(1000):
                    result.append(i ** 2)
                return result
            
            # Run: kernprof -l -v script.py
          interpretation: |
            Shows time per line:
            Line #  Hits  Time    Per Hit  % Time  Line Contents
            ======================================================
            5       1     1000.0  1000.0   20.0    result = []
            6       1000  3000.0  3.0      60.0    result.append(i ** 2)
            7       1     1000.0  1000.0   20.0    return result
            
        - name: "py-spy"
          type: "Statistical (sampling)"
          use_case: "Production profiling, long-running processes"
          overhead: "LOW"
          example: |
            # Install: pip install py-spy
            
            # Profile running process
            py-spy record -o profile.svg --pid 12345
            
            # Profile script
            py-spy record -o profile.svg -- python script.py
            
            # Live top view
            py-spy top --pid 12345
          interpretation: "Flame graph visualization shows call stack hierarchy"
          
    csharp:
      tools:
        - name: "dotTrace"
          type: "JetBrains profiler"
          use_case: "Comprehensive .NET profiling"
          features:
            - "Timeline profiling"
            - "Sampling profiling"
            - "Tracing profiling"
            - "Call tree visualization"
          example: |
            // Programmatic profiling
            using JetBrains.Profiler.SelfApi;
            
            DotTrace.EnsurePrerequisite();
            
            var config = new DotTrace.Config();
            config.SaveToDir(@"C:\snapshots");
            
            DotTrace.StartCollectingData();
            
            // Code to profile
            PerformExpensiveOperation();
            
            DotTrace.SaveData();
            
        - name: "Visual Studio Profiler"
          type: "Built-in IDE profiler"
          use_case: "Quick profiling during development"
          modes:
            - "CPU Usage"
            - "Memory Usage"
            - "GPU Usage"
            - ".NET Object Allocation"
          example: |
            // Add diagnostic code
            using System.Diagnostics;
            
            var sw = Stopwatch.StartNew();
            
            // Code to measure
            PerformOperation();
            
            sw.Stop();
            Console.WriteLine($"Elapsed: {sw.ElapsedMilliseconds}ms");
            
    java:
      tools:
        - name: "JProfiler"
          type: "Commercial profiler"
          features:
            - "CPU profiling (sampling/instrumentation)"
            - "Memory profiling"
            - "Thread profiling"
            - "Database profiling"
          
        - name: "VisualVM"
          type: "Free profiler"
          features:
            - "CPU sampling"
            - "Memory profiling"
            - "Thread analysis"
            - "Heap dump analysis"
            
        - name: "Async-profiler"
          type: "Low-overhead sampling"
          use_case: "Production profiling"
          overhead: "VERY LOW (<1%)"
          
    javascript:
      tools:
        - name: "Chrome DevTools"
          type: "Browser profiler"
          features:
            - "Performance timeline"
            - "JavaScript profiler"
            - "Memory profiler"
            - "Network profiler"
          example: |
            // Programmatic profiling
            console.profile('MyOperation');
            
            // Code to profile
            performExpensiveOperation();
            
            console.profileEnd('MyOperation');
            
        - name: "Node.js --prof"
          type: "Built-in V8 profiler"
          use_case: "Server-side Node.js profiling"
          example: |
            # Run with profiling
            node --prof app.js
            
            # Process log
            node --prof-process isolate-0x*.log > profile.txt
  
  cpu_profiling_workflow:
    - step: 1
      action: "Run application with profiler"
      details: "Use low-overhead profiler for production, detailed for development"
      
    - step: 2
      action: "Identify hot paths"
      details: "Find functions consuming >5% of total time"
      metrics:
        - "Cumulative time (including subcalls)"
        - "Self time (excluding subcalls)"
        - "Call count"
      
    - step: 3
      action: "Analyze call tree"
      details: "Understand why hot functions are called frequently"
      questions:
        - "Is function called in loop?"
        - "Are there unnecessary calls?"
        - "Can results be cached?"
        
    - step: 4
      action: "Optimize identified bottlenecks"
      strategies:
        - "Algorithmic optimization"
        - "Caching"
        - "Reduce call frequency"
        - "Parallelize if possible"
        
    - step: 5
      action: "Re-profile and compare"
      details: "Verify optimization effectiveness"
      success_criteria:
        - ">20% reduction in hot path time"
        - "No new bottlenecks introduced"

# =============================================================================
# MEMORY PROFILING
# =============================================================================

memory_profiling:
  description: "Analyze memory allocation, retention, and leaks"
  
  memory_issues:
    - issue: "Memory Leaks"
      symptom: "Memory usage grows over time, never decreases"
      causes:
        - "Objects not released (circular references)"
        - "Event listeners not removed"
        - "Global variables accumulating data"
      detection: "Compare heap snapshots over time"
      
    - issue: "Excessive Allocations"
      symptom: "High GC pressure, frequent pauses"
      causes:
        - "Creating too many temporary objects"
        - "String concatenation in loops"
        - "Repeated list resizing"
      detection: "Allocation profiling shows high rate"
      
    - issue: "Memory Bloat"
      symptom: "High memory usage even with small dataset"
      causes:
        - "Inefficient data structures"
        - "Duplicate data storage"
        - "Caching too aggressively"
      detection: "Heap snapshot shows large objects"
  
  tools_by_language:
    python:
      tools:
        - name: "memory_profiler"
          use_case: "Line-by-line memory usage"
          example: |
            from memory_profiler import profile
            
            @profile
            def my_function():
                big_list = [i for i in range(1000000)]  # ~8MB
                del big_list
                return "done"
            
            # Run: python -m memory_profiler script.py
          output: |
            Line #  Mem usage  Increment  Line Contents
            =============================================
            3       10.5 MiB   0.0 MiB    @profile
            4       10.5 MiB   0.0 MiB    def my_function():
            5       18.5 MiB   8.0 MiB        big_list = [...]
            6       10.5 MiB  -8.0 MiB        del big_list
            7       10.5 MiB   0.0 MiB        return "done"
            
        - name: "tracemalloc"
          use_case: "Built-in memory tracking"
          example: |
            import tracemalloc
            
            tracemalloc.start()
            
            # Code to analyze
            big_data = [i ** 2 for i in range(100000)]
            
            snapshot = tracemalloc.take_snapshot()
            top_stats = snapshot.statistics('lineno')
            
            print("[ Top 10 memory allocations ]")
            for stat in top_stats[:10]:
                print(stat)
                
        - name: "objgraph"
          use_case: "Find memory leaks, visualize object references"
          example: |
            import objgraph
            
            # Find objects that weren't released
            objgraph.show_growth()
            
            # Run code...
            
            objgraph.show_growth()  # Shows what grew
            
            # Visualize references to leaked object
            leaked = objgraph.by_type('MyClass')[0]
            objgraph.show_backrefs([leaked], filename='leak.png')
            
    csharp:
      tools:
        - name: "dotMemory"
          use_case: "Comprehensive .NET memory analysis"
          features:
            - "Memory snapshots"
            - "Diff comparison"
            - "Retention path analysis"
            - "Traffic analysis"
          example: |
            using JetBrains.Profiler.SelfApi;
            
            DotMemory.EnsurePrerequisite();
            
            DotMemory.GetSnapshot("Before");
            
            // Code that may leak
            for (int i = 0; i < 1000; i++)
            {
                CreateObjects();
            }
            
            DotMemory.GetSnapshot("After");
            
        - name: "PerfView"
          use_case: "GC heap analysis, ETW tracing"
          capabilities:
            - "Heap snapshots"
            - "GC events"
            - "Allocation call stacks"
            
    java:
      tools:
        - name: "JProfiler / VisualVM"
          features:
            - "Heap dumps"
            - "Allocation profiling"
            - "GC monitoring"
            
        - name: "Eclipse MAT"
          use_case: "Heap dump analysis"
          features:
            - "Leak suspects report"
            - "Dominator tree"
            - "Histogram of objects"
  
  memory_profiling_workflow:
    - step: 1
      action: "Establish baseline"
      details: "Measure memory usage under normal conditions"
      
    - step: 2
      action: "Take snapshots over time"
      details: "Compare heap before/after operations"
      key_points:
        - "After startup (initial state)"
        - "After processing N items"
        - "After GC (to see retained objects)"
        
    - step: 3
      action: "Identify growing objects"
      details: "Find object types whose count/size increases"
      tools: "Diff comparison between snapshots"
      
    - step: 4
      action: "Analyze retention paths"
      details: "Understand why objects aren't released"
      questions:
        - "What references keep object alive?"
        - "Is reference intentional (cache) or leak?"
        
    - step: 5
      action: "Fix and validate"
      strategies:
        - "Remove circular references"
        - "Explicitly dispose objects"
        - "Use weak references for caches"
        - "Unregister event handlers"

# =============================================================================
# I/O PROFILING
# =============================================================================

io_profiling:
  description: "Measure disk, network, and database operations"
  
  metrics:
    - metric: "Latency"
      description: "Time to complete single operation"
      targets:
        - "Disk read: <10ms (SSD), <20ms (HDD)"
        - "Network request: <100ms (local), <500ms (internet)"
        - "Database query: <50ms (simple), <200ms (complex)"
        
    - metric: "Throughput"
      description: "Operations per second"
      targets:
        - "Disk: >500 MB/s (SSD)"
        - "Network: >100 MB/s (gigabit)"
        - "Database: >1000 queries/s (simple)"
        
    - metric: "Wait Time"
      description: "Time spent waiting vs processing"
      problem_indicator: "High wait time (>50%) indicates I/O bottleneck"
  
  tools:
    - name: "Database Query Profiling"
      techniques:
        - technique: "EXPLAIN / EXPLAIN ANALYZE"
          purpose: "Understand query execution plan"
          example: |
            -- PostgreSQL
            EXPLAIN ANALYZE
            SELECT u.name, COUNT(o.id) as order_count
            FROM users u
            LEFT JOIN orders o ON o.user_id = u.id
            WHERE u.created_at > '2025-01-01'
            GROUP BY u.id, u.name;
          output: |
            QUERY PLAN
            ----------------------------------------------------------
            GroupAggregate  (cost=100..200 rows=10 width=32) (actual time=5.2..10.1 rows=10 loops=1)
              ->  Nested Loop Left Join  (cost=0..150 rows=50 width=16) (actual time=0.1..4.8 rows=50 loops=1)
                    ->  Index Scan using idx_users_created on users u  (cost=0..50 rows=10 width=12) (actual time=0.05..0.5 rows=10 loops=1)
                          Index Cond: (created_at > '2025-01-01')
                    ->  Index Scan using idx_orders_user on orders o  (cost=0..10 rows=5 width=4) (actual time=0.02..0.4 rows=5 loops=10)
                          Index Cond: (user_id = u.id)
            Planning Time: 0.5 ms
            Execution Time: 10.3 ms
          analysis:
            - "Uses indexes (good)"
            - "Low rows estimate vs actual (potential issue)"
            - "Total execution time: 10.3ms (acceptable)"
            
        - technique: "Slow Query Log"
          purpose: "Identify queries exceeding threshold"
          config: |
            # MySQL
            slow_query_log = 1
            long_query_time = 1  # Log queries >1 second
            slow_query_log_file = /var/log/mysql/slow.log
          analysis: "Review log for frequent slow queries"
          
    - name: "Network Profiling"
      tools:
        - tool: "Chrome DevTools Network Tab"
          metrics:
            - "Request/response time"
            - "Waiting time (TTFB)"
            - "Content download time"
            - "Total transferred size"
          indicators:
            - "High waiting time ΓåÆ Server processing slow"
            - "High download time ΓåÆ Response too large"
            - "Many requests ΓåÆ Consider batching"
            
        - tool: "Wireshark"
          use_case: "Deep packet analysis"
          metrics:
            - "Round-trip time (RTT)"
            - "Retransmissions"
            - "TCP window size"
            
    - name: "Disk I/O Profiling"
      tools:
        - tool: "iostat (Linux)"
          example: |
            iostat -x 1
          output: |
            Device  r/s  w/s  rkB/s  wkB/s  await  %util
            sda     10   20   1024   2048   15.2   40.5
          analysis:
            - "await: Average wait time (should be <20ms SSD)"
            - "%util: Disk utilization (>80% indicates saturation)"
            
        - tool: "Python I/O profiling"
          example: |
            import time
            
            start = time.time()
            with open('large_file.txt', 'r') as f:
                data = f.read()
            io_time = time.time() - start
            
            print(f"I/O time: {io_time:.2f}s")

# =============================================================================
# BENCHMARKING
# =============================================================================

benchmarking:
  description: "Measure performance under controlled conditions"
  
  benchmarking_principles:
    - principle: "Warm up"
      description: "Run code several times before measuring"
      reason: "JIT compilation, caching, OS optimizations"
      example: |
        # Python
        import timeit
        
        # Warmup (not measured)
        for _ in range(10):
            my_function()
        
        # Actual benchmark
        time = timeit.timeit(my_function, number=1000) / 1000
        print(f"Average: {time*1000:.2f}ms")
        
    - principle: "Multiple iterations"
      description: "Run many times, report statistics"
      metrics:
        - "Mean / Median"
        - "Standard deviation"
        - "Min / Max"
        - "Percentiles (p50, p95, p99)"
      example: |
        import statistics
        
        times = [measure_operation() for _ in range(100)]
        print(f"Median: {statistics.median(times):.2f}ms")
        print(f"p95: {statistics.quantiles(times, n=20)[18]:.2f}ms")
        
    - principle: "Isolate what you measure"
      description: "Measure only target operation, exclude setup"
      example: |
        # Bad: Includes list creation
        timeit.timeit('sum([i for i in range(1000)])')
        
        # Good: Pre-create list
        data = [i for i in range(1000)]
        timeit.timeit('sum(data)', globals={'data': data})
        
    - principle: "Use realistic data"
      description: "Benchmark with production-like data"
      considerations:
        - "Data size"
        - "Data distribution"
        - "Edge cases"
  
  benchmarking_tools:
    python:
      - name: "timeit"
        use_case: "Micro-benchmarks"
        example: |
          import timeit
          
          # Compare two implementations
          time1 = timeit.timeit('[i**2 for i in range(1000)]', number=10000)
          time2 = timeit.timeit('list(map(lambda x: x**2, range(1000)))', number=10000)
          
          print(f"List comp: {time1:.4f}s")
          print(f"Map: {time2:.4f}s")
          print(f"Speedup: {time2/time1:.2f}x")
          
      - name: "pytest-benchmark"
        use_case: "Integrated with tests"
        example: |
          def test_my_function(benchmark):
              result = benchmark(my_function, arg1, arg2)
              assert result == expected
              
    csharp:
      - name: "BenchmarkDotNet"
        use_case: "Gold standard .NET benchmarking"
        example: |
          using BenchmarkDotNet.Attributes;
          using BenchmarkDotNet.Running;
          
          [MemoryDiagnoser]
          public class MyBenchmarks
          {
              [Benchmark]
              public int ListSum()
              {
                  var list = Enumerable.Range(0, 1000).ToList();
                  return list.Sum();
              }
              
              [Benchmark]
              public int ArraySum()
              {
                  var array = Enumerable.Range(0, 1000).ToArray();
                  return array.Sum();
              }
          }
          
          // Run: BenchmarkRunner.Run<MyBenchmarks>();
        output: |
          | Method   | Mean     | Error   | StdDev  | Gen 0  | Allocated |
          |--------- |---------:|--------:|--------:|-------:|----------:|
          | ListSum  | 12.5 ╬╝s  | 0.15 ╬╝s | 0.14 ╬╝s | 0.9000 | 4024 B    |
          | ArraySum | 10.2 ╬╝s  | 0.12 ╬╝s | 0.11 ╬╝s | 0.8000 | 4000 B    |
          
    java:
      - name: "JMH (Java Microbenchmark Harness)"
        use_case: "Accurate JVM benchmarking"
        features:
          - "Handles JIT warm-up"
          - "Measures allocation"
          - "Statistical analysis"

# =============================================================================
# PERFORMANCE MONITORING
# =============================================================================

performance_monitoring:
  description: "Continuous tracking of performance metrics in production"
  
  apm_tools:
    - name: "New Relic"
      capabilities:
        - "Transaction tracing"
        - "Database query analysis"
        - "External service monitoring"
        - "Error tracking"
        - "Real user monitoring (RUM)"
      use_case: "Full-stack APM"
      
    - name: "Datadog"
      capabilities:
        - "Infrastructure monitoring"
        - "APM (application traces)"
        - "Log aggregation"
        - "Custom metrics"
      use_case: "Unified monitoring platform"
      
    - name: "Prometheus + Grafana"
      capabilities:
        - "Time-series metrics"
        - "Custom dashboards"
        - "Alerting"
      use_case: "Self-hosted monitoring"
      example: |
        from prometheus_client import Counter, Histogram, start_http_server
        import time
        
        # Metrics
        request_count = Counter('requests_total', 'Total requests')
        request_duration = Histogram('request_duration_seconds', 'Request duration')
        
        @request_duration.time()
        def handle_request():
            request_count.inc()
            # Process request
            time.sleep(0.1)
        
        # Start metrics server
        start_http_server(8000)
  
  key_metrics:
    - metric: "Apdex (Application Performance Index)"
      description: "User satisfaction score based on response times"
      calculation: |
        Apdex = (Satisfied + 0.5├ùTolerating) / Total
        Satisfied: < T seconds
        Tolerating: T to 4T seconds
        Frustrated: > 4T seconds
      example: "T=0.5s ΓåÆ Satisfied <0.5s, Tolerating 0.5-2s, Frustrated >2s"
      target: ">0.9 (excellent), 0.7-0.9 (good), <0.7 (poor)"
      
    - metric: "Error Rate"
      description: "Percentage of failed requests"
      calculation: "Errors / Total Requests ├ù 100"
      target: "<0.1%"
      
    - metric: "Throughput"
      description: "Requests per second"
      use: "Capacity planning, scaling decisions"
      
    - metric: "Latency Percentiles"
      description: "Response time distribution"
      metrics:
        - "p50 (median): Typical user experience"
        - "p95: 95% of users see this or better"
        - "p99: Catches outliers/worst case"
      target: "p95 < 200ms for web APIs"

# =============================================================================
# BOTTLENECK IDENTIFICATION
# =============================================================================

bottleneck_identification:
  description: "Systematic process to find performance bottlenecks"
  
  methodology:
    - step: 1
      name: "Reproduce Issue"
      actions:
        - "Identify slow operation (e.g., 'page load takes 5 seconds')"
        - "Create reproducible test case"
        - "Measure baseline performance"
        
    - step: 2
      name: "Broad Profiling"
      actions:
        - "Profile entire operation with low overhead"
        - "Identify general category (CPU, I/O, memory)"
        - "Find hot spots (>10% of time)"
      tools: "APM, sampling profiler, browser DevTools"
      
    - step: 3
      name: "Narrow Focus"
      actions:
        - "Profile specific hot functions in detail"
        - "Use line-by-line profiling if needed"
        - "Understand why function is slow"
      tools: "cProfile, line_profiler, debugger"
      
    - step: 4
      name: "Root Cause Analysis"
      questions:
        - "What is the algorithmic complexity?"
        - "Are there unnecessary operations?"
        - "Is data fetched efficiently?"
        - "Are there N+1 query problems?"
        - "Is computation redundant?"
        
    - step: 5
      name: "Validate Hypothesis"
      actions:
        - "Implement targeted fix"
        - "Re-profile to confirm improvement"
        - "Ensure no regressions elsewhere"
  
  common_bottleneck_patterns:
    - pattern: "N+1 Queries"
      symptom: "Many database queries in loop"
      detection: "Database profiler shows 100s of identical queries"
      solution: "Use JOIN or eager loading"
      
    - pattern: "Quadratic Algorithms"
      symptom: "Performance degrades rapidly with input size"
      detection: "Profiler shows nested loops consuming time"
      solution: "Use better data structure or algorithm"
      
    - pattern: "Synchronous I/O"
      symptom: "High wait time, low CPU usage"
      detection: "Threads blocked on I/O"
      solution: "Use async/await or multi-threading"
      
    - pattern: "Memory Thrashing"
      symptom: "Slow performance, high disk I/O"
      detection: "Memory usage near/exceeds RAM, swap usage high"
      solution: "Reduce memory footprint or add RAM"
      
    - pattern: "Serialization Overhead"
      symptom: "High CPU in serialize/deserialize functions"
      detection: "JSON/XML parsing high in profile"
      solution: "Use binary formats (protobuf, msgpack)"

# =============================================================================
# PERFORMANCE TESTING
# =============================================================================

performance_testing:
  description: "Validate performance under various conditions"
  
  test_types:
    - type: "Load Testing"
      description: "Test behavior under expected load"
      goal: "Verify application meets SLA under normal traffic"
      example: "Sustain 1000 req/s for 30 minutes"
      tools: "JMeter, Gatling, Locust, k6"
      
    - type: "Stress Testing"
      description: "Test behavior beyond capacity"
      goal: "Find breaking point, validate graceful degradation"
      example: "Ramp from 1000 to 10000 req/s"
      
    - type: "Spike Testing"
      description: "Sudden traffic increase"
      goal: "Validate auto-scaling, handling burst traffic"
      example: "Jump from 100 to 5000 req/s instantly"
      
    - type: "Endurance Testing"
      description: "Long-duration testing"
      goal: "Detect memory leaks, resource exhaustion"
      example: "Run at 500 req/s for 24 hours"
  
  load_testing_tools:
    - name: "Locust"
      language: "Python"
      example: |
        from locust import HttpUser, task, between
        
        class WebsiteUser(HttpUser):
            wait_time = between(1, 3)
            
            @task
            def load_homepage(self):
                self.client.get("/")
            
            @task(3)  # 3x more frequent
            def load_api(self):
                self.client.get("/api/users/123")
        
        # Run: locust -f locustfile.py --users 100 --spawn-rate 10
      metrics:
        - "Requests per second"
        - "Response time (p50, p95, p99)"
        - "Error rate"
        - "Users concurrent"
        
    - name: "k6"
      language: "JavaScript"
      example: |
        import http from 'k6/http';
        import { check, sleep } from 'k6';
        
        export let options = {
          stages: [
            { duration: '2m', target: 100 },  // Ramp up
            { duration: '5m', target: 100 },  // Stay at 100
            { duration: '2m', target: 0 },    // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<200'],  // 95% under 200ms
          },
        };
        
        export default function () {
          let res = http.get('https://api.example.com/users');
          check(res, { 'status is 200': (r) => r.status === 200 });
          sleep(1);
        }
        
        // Run: k6 run script.js

# =============================================================================
# BEST PRACTICES
# =============================================================================

best_practices:
  - practice: "Profile Before Optimizing"
    rationale: "Avoid wasting time on non-bottlenecks"
    quote: "Premature optimization is the root of all evil - Donald Knuth"
    
  - practice: "Measure in Production-Like Environment"
    rationale: "Development environments often don't reflect production behavior"
    recommendations:
      - "Use realistic data volumes"
      - "Similar hardware specs"
      - "Include network latency"
      
  - practice: "Focus on High-Impact Optimizations"
    rationale: "Optimize 20% of code that causes 80% of issues"
    approach: "Sort by cumulative time, optimize top functions first"
    
  - practice: "Monitor Continuously"
    rationale: "Catch regressions early"
    implementation: "Integrate performance tests in CI/CD"
    
  - practice: "Use Statistical Significance"
    rationale: "Ensure improvements are real, not noise"
    approach: "Run multiple iterations, compare distributions"
    
  - practice: "Document Performance Requirements"
    rationale: "Enable objective validation"
    example:
      - "API endpoints: p95 < 200ms"
      - "Page load: < 2 seconds"
      - "Throughput: > 1000 req/s"
