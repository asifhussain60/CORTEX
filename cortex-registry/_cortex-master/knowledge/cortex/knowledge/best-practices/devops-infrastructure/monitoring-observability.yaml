# ==============================================================================
# OBSERVABILITY OVERVIEW
# ==============================================================================

observability_overview:
  definition: "Measure of how well internal states of a system can be inferred from knowledge of its external outputs"
  
  monitoring_vs_observability:
    monitoring:
      definition: "Watching predefined metrics/logs for known failure modes"
      approach: "Reactive - detect known problems"
      example: "Alert when CPU > 80%"
    observability:
      definition: "Understanding system behavior through metrics, logs, traces"
      approach: "Proactive - explore unknown unknowns"
      example: "Correlate user complaint ΓåÆ trace ΓåÆ logs ΓåÆ metrics to find root cause"
  
  three_pillars:
    - pillar: "Metrics"
      description: "Numerical measurements over time (CPU, memory, request rate, latency)"
      characteristics:
        - "Aggregatable"
        - "Efficient storage (time-series databases)"
        - "Good for dashboards and alerting"
      examples: ["Request count", "Error rate", "Latency percentiles", "CPU usage"]
      tools: ["Prometheus", "Datadog", "New Relic", "CloudWatch"]
    
    - pillar: "Logs"
      description: "Discrete events with timestamp and context"
      characteristics:
        - "High cardinality (detailed)"
        - "Large storage requirements"
        - "Good for debugging specific issues"
      examples: ["Application logs", "Access logs", "Error logs", "Audit logs"]
      tools: ["ELK Stack", "Splunk", "Loki", "CloudWatch Logs"]
    
    - pillar: "Traces"
      description: "Record of request journey through distributed system"
      characteristics:
        - "Shows causality"
        - "Reveals performance bottlenecks"
        - "Essential for microservices"
      examples: ["API Gateway ΓåÆ Service A ΓåÆ Service B ΓåÆ Database"]
      tools: ["Jaeger", "Zipkin", "AWS X-Ray", "Datadog APM"]
  
  benefits:
    - "Faster incident resolution (reduce MTTR by 50-70%)"
    - "Proactive problem detection (before users notice)"
    - "Better understanding of system behavior"
    - "Data-driven optimization decisions"
    - "Improved reliability and user experience"

