# 2. EC2 BEST PRACTICES
ec2_patterns:
  principle: "Elastic Compute Cloud instance management"
  importance: "High - core compute service"
  
  rules:
    - id: "aws_ec2_001"
      name: "Right-Size Your Instances"
      description: "Choose instance types that match workload requirements"
      severity: "HIGH"
      examples:
        good:
          - language: "yaml"
            code: |
              # Infrastructure as Code (CloudFormation/Terraform)
              InstanceType: t3.medium  # General purpose, burstable
              # For: Web servers, small databases
              
              InstanceType: c5.large   # Compute optimized
              # For: CPU-intensive workloads
              
              InstanceType: r5.xlarge  # Memory optimized
              # For: In-memory databases, caching
            explanation: "Match instance family to workload type"

    - id: "aws_ec2_002"
      name: "Use Auto Scaling Groups"
      description: "Automatically adjust capacity based on demand"
      severity: "HIGH"
      examples:
        good:
          - language: "yaml"
            code: |
              # Auto Scaling Group configuration
              AutoScalingGroup:
                MinSize: 2
                MaxSize: 10
                DesiredCapacity: 3
                HealthCheckType: ELB
                HealthCheckGracePeriod: 300
                Metrics:
                  - CPUUtilization
                  - TargetResponseTime
            explanation: "Scales based on metrics, maintains availability"

    - id: "aws_ec2_003"
      name: "Use Spot Instances for Non-Critical Workloads"
      description: "Save up to 90% on compute costs"
      severity: "MEDIUM"
      examples:
        good:
          - language: "python"
            code: |
              # Spot instance request
              response = ec2.request_spot_instances(
                  SpotPrice='0.05',
                  InstanceCount=5,
                  LaunchSpecification={
                      'ImageId': 'ami-12345678',
                      'InstanceType': 't3.medium',
                      'KeyName': 'my-key'
                  },
                  Type='one-time'  # or 'persistent'
              )
            explanation: "Use for batch processing, testing, fault-tolerant apps"

# 3. S3 BEST PRACTICES
s3_patterns:
  principle: "Simple Storage Service optimization"
  importance: "High - primary storage service"
  
  rules:
    - id: "aws_s3_001"
      name: "Use Appropriate Storage Classes"
      description: "Match storage class to access patterns"
      severity: "HIGH"
      examples:
        good:
          - language: "yaml"
            code: |
              # S3 Lifecycle Policy
              Rules:
                - Id: "archive-old-logs"
                  Status: Enabled
                  Transitions:
                    - Days: 30
                      StorageClass: STANDARD_IA  # Infrequent Access
                    - Days: 90
                      StorageClass: GLACIER       # Long-term archive
                    - Days: 365
                      StorageClass: DEEP_ARCHIVE  # Cheapest, rarely accessed
                  Expiration:
                    Days: 2555  # 7 years
            explanation: "Automatically transition to cheaper storage"

    - id: "aws_s3_002"
      name: "Enable Versioning for Critical Data"
      description: "Protect against accidental deletion"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              s3.put_bucket_versioning(
                  Bucket='my-critical-bucket',
                  VersioningConfiguration={'Status': 'Enabled'}
              )
            explanation: "Allows recovery of deleted or overwritten objects"

    - id: "aws_s3_003"
      name: "Use S3 Transfer Acceleration"
      description: "Speed up uploads over long distances"
      severity: "MEDIUM"
      examples:
        good:
          - language: "python"
            code: |
              s3_client = boto3.client(
                  's3',
                  region_name='us-west-2',
                  config=Config(s3={'use_accelerate_endpoint': True})
              )
            explanation: "Uses CloudFront edge locations for faster uploads"

# 4. LAMBDA BEST PRACTICES
lambda_patterns:
  principle: "Serverless function optimization"
  importance: "High - serverless compute"
  
  rules:
    - id: "aws_lambda_001"
      name: "Minimize Cold Start Impact"
      description: "Optimize function initialization"
      severity: "HIGH"
      examples:
        good:
          - language: "python"
            code: |
              import json
              # Γ£à Initialize outside handler (runs once per container)
              import boto3
              s3 = boto3.client('s3')
              
              def lambda_handler(event, context):
                  # Γ£à Handler logic only
                  bucket = event['Records'][0]['s3']['bucket']['name']
                  key = event['Records'][0]['s3']['object']['key']
                  
                  obj = s3.get_object(Bucket=bucket, Key=key)
                  return {'statusCode': 200, 'body': json.dumps('Success')}
            explanation: "Reuse connections and clients across invocations"
        
        bad:
          - language: "python"
            code: |
              def lambda_handler(event, context):
                  # Γ¥î Import inside handler (runs every invocation)
                  import boto3
                  s3 = boto3.client('s3')
                  # Processing...
            explanation: "Recreates client on every invocation"

    - id: "aws_lambda_002"
      name: "Right-Size Memory Allocation"
      description: "CPU allocation scales with memory"
      severity: "MEDIUM"
      examples:
        good:
          - language: "yaml"
            code: |
              # Test different memory sizes
              MemorySize: 1024  # MB (increases CPU proportionally)
              Timeout: 30       # seconds
              
              # Monitor CloudWatch metrics:
              # - Duration
              # - Billed Duration
              # - Memory Used
            explanation: "More memory = more CPU, find sweet spot"

# 5. VPC BEST PRACTICES
vpc_patterns:
  principle: "Virtual Private Cloud network design"
  importance: "High - network foundation"
  
  rules:
    - id: "aws_vpc_001"
      name: "Use Multi-AZ for High Availability"
      description: "Distribute resources across availability zones"
      severity: "CRITICAL"
      examples:
        good:
          - language: "yaml"
            code: |
              # VPC with subnets in multiple AZs
              VPC:
                CIDR: 10.0.0.0/16
                Subnets:
                  PublicSubnetA:
                    CIDR: 10.0.1.0/24
                    AvailabilityZone: us-east-1a
                  PublicSubnetB:
                    CIDR: 10.0.2.0/24
                    AvailabilityZone: us-east-1b
                  PrivateSubnetA:
                    CIDR: 10.0.10.0/24
                    AvailabilityZone: us-east-1a
                  PrivateSubnetB:
                    CIDR: 10.0.11.0/24
                    AvailabilityZone: us-east-1b
            explanation: "Survives AZ failure"

    - id: "aws_vpc_002"
      name: "Use Security Groups as Firewalls"
      description: "Control inbound/outbound traffic"
      severity: "CRITICAL"
      examples:
        good:
          - language: "yaml"
            code: |
              SecurityGroup:
                GroupName: web-servers
                InboundRules:
                  - Protocol: tcp
                    Port: 443
                    Source: 0.0.0.0/0  # HTTPS from anywhere
                  - Protocol: tcp
                    Port: 80
                    Source: 0.0.0.0/0  # HTTP from anywhere
                OutboundRules:
                  - Protocol: -1        # All traffic
                    Destination: 0.0.0.0/0
            explanation: "Least privilege access"

# 6. COST OPTIMIZATION
cost_patterns:
  principle: "Optimize AWS spending"
  importance: "High - financial impact"
  
  rules:
    - id: "aws_cost_001"
      name: "Use Reserved Instances for Steady State"
      description: "Save up to 75% on predictable workloads"
      severity: "HIGH"
      examples:
        good:
          - language: "text"
            code: |
              # Reserved Instance commitment
              Instance Type: t3.medium
              Term: 1 year or 3 years
              Payment: All Upfront (maximum savings)
                       Partial Upfront
                       No Upfront
              
              # Best for:
              # - Production databases
              # - Always-on web servers
              # - Predictable traffic
            explanation: "Commit to usage, get discount"

    - id: "aws_cost_002"
      name: "Tag All Resources"
      description: "Enable cost allocation and tracking"
      severity: "HIGH"
      examples:
        good:
          - language: "yaml"
            code: |
              Tags:
                - Key: Environment
                  Value: Production
                - Key: Project
                  Value: WebApp
                - Key: CostCenter
                  Value: Engineering
                - Key: Owner
                  Value: team@company.com
            explanation: "Track costs by project, team, environment"

