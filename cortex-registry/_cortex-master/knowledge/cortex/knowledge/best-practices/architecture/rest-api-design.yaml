# REST API Design Best Practices
# CORTEX Knowledge Base - Engineering Domain
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain
# Category: API Design Excellence
# Purpose: Comprehensive REST API design guidelines following industry best practices

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  updated: "2025-12-22"
  author: "Asif Hussain"
  category: "api-design"
  subcategory: "rest"
  scope: "REST API design patterns, best practices, anti-patterns"
  target_audience: ["backend-engineers", "api-developers", "architects"]
  maturity_level: "production-ready"
  learning_objectives:
    - "Design RESTful APIs following REST constraints"
    - "Implement proper HTTP semantics and status codes"
    - "Apply pagination, filtering, and sorting patterns"
    - "Secure APIs with authentication and authorization"
    - "Version APIs with minimal client impact"
  prerequisites:
    - "HTTP protocol fundamentals"
    - "JSON data format"
    - "Web architecture basics"

# REST Architectural Constraints
rest_constraints:
  - name: "Client-Server Separation"
    description: "Separate concerns between client and server"
    principles:
      - "Server manages data and business logic"
      - "Client manages user interface and user state"
      - "Independent evolution of client and server"
    benefits: ["scalability", "portability", "independent_evolution"]

  - name: "Statelessness"
    description: "Each request contains all information needed to process it"
    principles:
      - "No session state stored on server"
      - "All state maintained by client"
      - "Server treats each request independently"
    benefits: ["scalability", "reliability", "simplified_server"]

  - name: "Cacheability"
    description: "Responses must define themselves as cacheable or not"
    principles:
      - "Use Cache-Control headers"
      - "Support ETags for conditional requests"
      - "Mark immutable resources appropriately"
    benefits: ["performance", "reduced_server_load", "bandwidth_savings"]

  - name: "Uniform Interface"
    description: "Standardized way to interact with resources"
    principles:
      - "Resource identification via URIs"
      - "Manipulation via representations"
      - "Self-descriptive messages"
      - "HATEOAS (Hypermedia as Engine of Application State)"
    benefits: ["simplicity", "discoverability", "evolvability"]

  - name: "Layered System"
    description: "Client cannot tell if connected directly to end server"
    principles:
      - "Intermediaries (proxies, gateways) transparent"
      - "Support load balancers and caches"
      - "Enable security layers"
    benefits: ["scalability", "security", "legacy_encapsulation"]

# Resource Naming Best Practices
resource_naming:
  conventions:
    - rule: "Use nouns, not verbs"
      good: "/users, /orders, /products"
      bad: "/getUsers, /createOrder, /updateProduct"
      rationale: "HTTP methods provide the verbs (GET, POST, PUT, DELETE)"

    - rule: "Use plural nouns for collections"
      good: "/users, /users/123"
      bad: "/user, /user/123"
      rationale: "Consistency - all resources treated as collections"

    - rule: "Use lowercase and hyphens"
      good: "/order-items, /shipping-addresses"
      bad: "/OrderItems, /shipping_addresses"
      rationale: "URL case-sensitivity and readability"

    - rule: "Nest resources for relationships"
      good: "/users/123/orders, /orders/456/items"
      bad: "/userOrders?userId=123"
      rationale: "Express hierarchy and ownership clearly"

    - rule: "Limit nesting depth to 2-3 levels"
      good: "/authors/123/books/456/reviews"
      bad: "/publishers/1/authors/2/books/3/chapters/4/sections/5"
      rationale: "Avoid complexity and coupling"

    - rule: "Use query parameters for filtering/sorting"
      good: "/users?role=admin&sort=created_at"
      bad: "/users/admin/sorted-by-created"
      rationale: "Keep URLs clean and flexible"

# HTTP Methods and Semantics
http_methods:
  - method: "GET"
    purpose: "Retrieve resource(s)"
    safe: true
    idempotent: true
    request_body: false
    response_body: true
    status_codes: [200, 304, 404]
    examples:
      - "GET /users - List all users"
      - "GET /users/123 - Get specific user"
      - "GET /users?role=admin - Filter users"
    best_practices:
      - "Never modify state"
      - "Support caching with ETags"
      - "Return 404 for missing resources"

  - method: "POST"
    purpose: "Create new resource"
    safe: false
    idempotent: false
    request_body: true
    response_body: true
    status_codes: [201, 400, 409]
    examples:
      - "POST /users - Create new user"
      - "POST /orders - Place new order"
    best_practices:
      - "Return 201 Created with Location header"
      - "Include created resource in response body"
      - "Validate input thoroughly"
      - "Return 409 Conflict for duplicates"

  - method: "PUT"
    purpose: "Replace entire resource"
    safe: false
    idempotent: true
    request_body: true
    response_body: true
    status_codes: [200, 204, 404]
    examples:
      - "PUT /users/123 - Replace user"
      - "PUT /orders/456 - Replace order"
    best_practices:
      - "Require all fields in request"
      - "Create if not exists (optional)"
      - "Return 404 if resource doesn't exist"

  - method: "PATCH"
    purpose: "Partial update of resource"
    safe: false
    idempotent: true
    request_body: true
    response_body: true
    status_codes: [200, 400, 404]
    examples:
      - "PATCH /users/123 - Update user fields"
      - "PATCH /orders/456 - Update order status"
    best_practices:
      - "Accept partial representation"
      - "Use JSON Patch (RFC 6902) or JSON Merge Patch (RFC 7396)"
      - "Validate field-level permissions"

  - method: "DELETE"
    purpose: "Remove resource"
    safe: false
    idempotent: true
    request_body: false
    response_body: false
    status_codes: [204, 404]
    examples:
      - "DELETE /users/123 - Delete user"
      - "DELETE /orders/456 - Cancel order"
    best_practices:
      - "Return 204 No Content on success"
      - "Return 404 if already deleted"
      - "Consider soft deletes for audit trails"

# HTTP Status Codes
status_codes:
  success_2xx:
    - code: 200
      name: "OK"
      usage: "GET, PUT, PATCH successful"
      response_body: "Resource representation"

    - code: 201
      name: "Created"
      usage: "POST successful"
      headers: ["Location: /users/123"]
      response_body: "Created resource"

    - code: 204
      name: "No Content"
      usage: "DELETE, PUT successful with no response body"
      response_body: "Empty"

  redirection_3xx:
    - code: 301
      name: "Moved Permanently"
      usage: "Resource permanently moved"
      headers: ["Location: /new-url"]

    - code: 304
      name: "Not Modified"
      usage: "Conditional GET with valid cache"
      headers: ["ETag", "Last-Modified"]

  client_error_4xx:
    - code: 400
      name: "Bad Request"
      usage: "Invalid request syntax or validation error"
      response_body: "Error details with field-level errors"

    - code: 401
      name: "Unauthorized"
      usage: "Authentication required or failed"
      headers: ["WWW-Authenticate"]

    - code: 403
      name: "Forbidden"
      usage: "Authenticated but insufficient permissions"
      response_body: "Permission details"

    - code: 404
      name: "Not Found"
      usage: "Resource does not exist"
      response_body: "Error message"

    - code: 409
      name: "Conflict"
      usage: "Resource state conflict (e.g., duplicate)"
      response_body: "Conflict details"

    - code: 422
      name: "Unprocessable Entity"
      usage: "Semantic validation error"
      response_body: "Validation errors"

    - code: 429
      name: "Too Many Requests"
      usage: "Rate limit exceeded"
      headers: ["Retry-After", "X-RateLimit-*"]

  server_error_5xx:
    - code: 500
      name: "Internal Server Error"
      usage: "Unexpected server error"
      response_body: "Generic error (no sensitive details)"

    - code: 503
      name: "Service Unavailable"
      usage: "Temporary server overload or maintenance"
      headers: ["Retry-After"]

# Pagination Patterns
pagination:
  offset_based:
    description: "Use page number and size"
    parameters:
      - "page: Page number (1-indexed)"
      - "limit: Items per page"
    example_request: "GET /users?page=2&limit=20"
    example_response:
      data: ["user1", "user2"]
      pagination:
        page: 2
        limit: 20
        total_pages: 10
        total_items: 200
    pros: ["simple", "familiar", "supports_jumping"]
    cons: ["performance_degradation", "inconsistent_with_inserts"]

  cursor_based:
    description: "Use opaque cursor for next page"
    parameters:
      - "cursor: Opaque token pointing to next page"
      - "limit: Items per page"
    example_request: "GET /users?cursor=eyJpZCI6MTIzfQ&limit=20"
    example_response:
      data: ["user1", "user2"]
      pagination:
        next_cursor: "eyJpZCI6MTQzfQ"
        has_more: true
    pros: ["consistent", "performance", "handles_inserts"]
    cons: ["no_jumping", "complex_implementation"]

  link_header:
    description: "Use Link header for pagination URLs"
    example_header: |
      Link: </users?page=3>; rel="next",
            </users?page=1>; rel="first",
            </users?page=10>; rel="last"
    pros: ["standard", "discoverable", "separates_concerns"]

# Filtering and Sorting
filtering:
  query_parameters:
    - pattern: "Field-value pairs"
      example: "GET /users?role=admin&status=active"
      use_case: "Simple equality filters"

    - pattern: "Comparison operators"
      example: "GET /orders?total[gte]=100&created_at[lt]=2025-01-01"
      use_case: "Range queries"

    - pattern: "Complex filters (JSON)"
      example: "GET /users?filter={\"age\":{\"$gte\":18,\"$lte\":65}}"
      use_case: "Advanced queries (use sparingly)"

  best_practices:
    - "Support multiple filters with AND logic by default"
    - "Document available filter fields and operators"
    - "Validate filter parameters"
    - "Consider search endpoints for complex queries (POST /users/search)"

sorting:
  patterns:
    - pattern: "Single field"
      example: "GET /users?sort=created_at"
      default_order: "ascending"

    - pattern: "Multiple fields"
      example: "GET /users?sort=last_name,first_name"
      description: "Sort by last_name, then first_name"

    - pattern: "Direction prefix"
      example: "GET /users?sort=-created_at,+name"
      description: "- for descending, + for ascending"

  best_practices:
    - "Default to meaningful sort order (e.g., created_at desc)"
    - "Limit sortable fields to indexed columns"
    - "Document available sort fields"

# Error Response Format
error_response:
  standard_format:
    type: "object"
    required: ["error"]
    properties:
      error:
        code: "VALIDATION_ERROR"
        message: "Invalid input provided"
        details:
          - field: "email"
            message: "Invalid email format"
            code: "INVALID_FORMAT"
          - field: "age"
            message: "Must be between 18 and 120"
            code: "OUT_OF_RANGE"
        request_id: "req_abc123xyz"
        timestamp: "2025-12-22T10:30:00Z"

  error_codes:
    - code: "VALIDATION_ERROR"
      http_status: 400
      description: "Input validation failed"

    - code: "AUTHENTICATION_FAILED"
      http_status: 401
      description: "Authentication credentials invalid"

    - code: "INSUFFICIENT_PERMISSIONS"
      http_status: 403
      description: "User lacks required permissions"

    - code: "RESOURCE_NOT_FOUND"
      http_status: 404
      description: "Requested resource does not exist"

    - code: "CONFLICT"
      http_status: 409
      description: "Resource state conflict"

    - code: "RATE_LIMIT_EXCEEDED"
      http_status: 429
      description: "Too many requests"

    - code: "INTERNAL_ERROR"
      http_status: 500
      description: "Unexpected server error"

# Security Best Practices
security:
  authentication:
    - method: "OAuth 2.0"
      use_case: "Third-party integrations"
      recommendation: "Use Authorization Code + PKCE for web/mobile"

    - method: "JWT (JSON Web Tokens)"
      use_case: "Stateless authentication"
      best_practices:
        - "Use short expiration times (15 minutes)"
        - "Implement refresh token rotation"
        - "Validate signature and claims"
        - "Store securely (httpOnly cookies or secure storage)"

    - method: "API Keys"
      use_case: "Server-to-server communication"
      best_practices:
        - "Use separate keys per client"
        - "Support key rotation"
        - "Rate limit per key"
        - "Never log or expose keys"

  authorization:
    - "Implement role-based access control (RBAC)"
    - "Validate permissions on every request"
    - "Use principle of least privilege"
    - "Return 403 for insufficient permissions"

  input_validation:
    - "Validate all inputs on server side"
    - "Use allowlists over denylists"
    - "Sanitize inputs to prevent injection attacks"
    - "Validate content types and sizes"

  rate_limiting:
    - "Implement per-user and per-endpoint limits"
    - "Use sliding window or token bucket algorithms"
    - "Return 429 with Retry-After header"
    - "Provide rate limit info in headers (X-RateLimit-*)"

  https:
    - "Always use HTTPS in production"
    - "Redirect HTTP to HTTPS"
    - "Use HSTS header (Strict-Transport-Security)"
    - "Validate certificates properly"

# Performance Optimization
performance:
  caching:
    - "Use ETags for conditional requests"
    - "Set Cache-Control headers appropriately"
    - "Support If-None-Match and If-Modified-Since"
    - "Cache immutable resources with max-age"

  compression:
    - "Enable gzip/brotli compression"
    - "Compress responses > 1KB"
    - "Support Accept-Encoding header"

  field_selection:
    - pattern: "Sparse fieldsets"
      example: "GET /users/123?fields=id,name,email"
      benefit: "Reduce payload size"

  batching:
    - pattern: "Batch requests"
      example: "POST /batch with array of operations"
      benefit: "Reduce HTTP overhead"

  async_operations:
    - "Use 202 Accepted for long-running operations"
    - "Return job ID and status endpoint"
    - "Support webhooks for completion notifications"

# API Versioning Strategies (see api-versioning.yaml for details)
versioning:
  importance: "Critical for backward compatibility and evolution"
  strategies:
    - "URI versioning: /v1/users"
    - "Header versioning: Accept: application/vnd.api.v1+json"
    - "Query parameter: /users?version=1"
  recommendation: "See api-versioning.yaml for comprehensive guidance"

# HATEOAS (Hypermedia)
hateoas:
  description: "Include links to related resources and actions"
  example_response:
    id: 123
    name: "John Doe"
    email: "john@example.com"
    _links:
      self: {href: "/users/123"}
      orders: {href: "/users/123/orders"}
      edit: {href: "/users/123", method: "PUT"}
      delete: {href: "/users/123", method: "DELETE"}
  benefits:
    - "Discoverability"
    - "Reduced coupling"
    - "Self-documenting API"
  adoption_level: "Optional - use for complex APIs with many relationships"

# REST API Anti-Patterns
anti_patterns:
  - name: "RPC-style URLs"
    bad: "POST /getUserOrders"
    good: "GET /users/123/orders"
    reason: "REST uses resources, not actions"

  - name: "Ignoring HTTP methods"
    bad: "POST /deleteUser with user ID in body"
    good: "DELETE /users/123"
    reason: "Use appropriate HTTP verbs"

  - name: "Breaking changes without versioning"
    bad: "Removing fields from response"
    good: "Deprecate in v1, remove in v2 with migration period"
    reason: "Maintain backward compatibility"

  - name: "Not using HTTP status codes properly"
    bad: "Always returning 200 with error flag in body"
    good: "Return appropriate 4xx/5xx status codes"
    reason: "Status codes provide semantic meaning"

  - name: "Ignoring caching"
    bad: "No Cache-Control headers"
    good: "Appropriate Cache-Control and ETags"
    reason: "Performance and scalability"

  - name: "Leaking implementation details"
    bad: "URLs reflecting database structure /tables/users"
    good: "Abstract resources /users"
    reason: "Decouple API from implementation"

  - name: "Inconsistent naming"
    bad: "Mix of camelCase, snake_case, PascalCase"
    good: "Consistent snake_case or camelCase throughout"
    reason: "Predictability and usability"

  - name: "No pagination for collections"
    bad: "GET /users returning all 1 million users"
    good: "GET /users?page=1&limit=20"
    reason: "Performance and usability"

  - name: "Exposing internal IDs"
    bad: "Sequential integer IDs in URLs"
    good: "UUIDs or opaque identifiers"
    reason: "Security and abstraction"

  - name: "Not supporting filtering/sorting"
    bad: "Clients must fetch all data and filter locally"
    good: "Server-side filtering and sorting"
    reason: "Efficiency and performance"

# Testing REST APIs
testing:
  unit_tests:
    - "Test route handlers in isolation"
    - "Mock external dependencies"
    - "Validate request/response schemas"

  integration_tests:
    - "Test complete request/response cycle"
    - "Validate HTTP status codes"
    - "Test authentication and authorization"
    - "Verify database interactions"

  contract_tests:
    - "Use OpenAPI/Swagger specs"
    - "Validate request/response against schema"
    - "Test backward compatibility"

  performance_tests:
    - "Load testing with expected traffic"
    - "Stress testing to find limits"
    - "Monitor response times under load"

  security_tests:
    - "Test authentication bypass"
    - "Test authorization escalation"
    - "Test injection attacks (SQL, XSS)"
    - "Test rate limiting"

# Documentation
documentation:
  openapi:
    description: "Industry standard for REST API documentation"
    features:
      - "Machine-readable specification"
      - "Auto-generated interactive docs (Swagger UI)"
      - "Client SDK generation"
      - "Contract testing"
    recommendation: "Always maintain OpenAPI 3.x spec"

  api_reference:
    includes:
      - "Endpoint descriptions"
      - "Request/response schemas"
      - "Authentication methods"
      - "Error codes"
      - "Examples"
      - "Rate limits"

  guides:
    - "Quickstart guide with authentication"
    - "Common use cases with examples"
    - "Migration guides for version changes"
    - "SDKs and client libraries"

