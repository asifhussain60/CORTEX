# LaunchDarkly Feature Flag Architecture and Governance
# Authority: LaunchDarkly Best Practices Documentation
# Source: https://docs.launchdarkly.com/guides/best-practices
# Version: 1.0
# Created: 2026-02-14

metadata:
  title: "LaunchDarkly Feature Flag Architecture and Governance"
  version: "1.0"
  domain: "feature-flags"
  source: "https://docs.launchdarkly.com/guides/best-practices"
  tech_stack: ["launchdarkly", "feature-flags", "continuous-delivery"]
  applicable_intents: ["IMPLEMENT", "DESIGN", "AUDIT", "REFACTOR"]
  created: "2026-02-14"
  author: "CORTEX Phase 23"

overview:
  description: |
    LaunchDarkly best practices covering flag architecture, naming conventions,
    lifecycle management, targeting strategies, and governance policies. Ensures
    feature flags enable safe releases without technical debt accumulation.
  
  core_principles:
    - "Use temporary flags for releases, permanent flags for operations"
    - "Apply consistent naming conventions for discoverability"
    - "Implement flag lifecycle with archival after release"
    - "Use targeting rules for progressive rollouts"
    - "Enforce governance with approval workflows"

# ============================================================================
# FLAG TYPES & LIFECYCLE
# ============================================================================

flag_types:
  release_flags:
    description: "Temporary flags controlling feature rollout"
    lifecycle: "Create → Enable → Rollout 100% → Archive (30-90 days)"
    naming: "release-{feature}-{date}"
    example: "release-payment-v2-2026q1"
    cleanup: "Archive after 100% rollout for 2 weeks"
    rationale: "Prevents technical debt from abandoned flags"
  
  ops_flags:
    description: "Permanent flags for operational control"
    lifecycle: "Create → Manage indefinitely"
    naming: "ops-{capability}"
    examples:
      - "ops-maintenance-mode"
      - "ops-rate-limiting-enabled"
      - "ops-feature-x-kill-switch"
    rationale: "Long-lived flags for circuit breakers, kill switches"
  
  experiment_flags:
    description: "Flags for A/B testing and experiments"
    lifecycle: "Create → Run experiment → Archive after analysis"
    naming: "exp-{hypothesis}-{date}"
    example: "exp-checkout-redesign-2026q1"
    duration: "2-4 weeks typical experiment"
  
  permission_flags:
    description: "Control access to features by user segments"
    lifecycle: "Create → Manage indefinitely"
    naming: "perm-{feature}-{tier}"
    example: "perm-advanced-analytics-enterprise"
    rationale: "Implement feature tiering without code changes"

# ============================================================================
# NAMING CONVENTIONS
# ============================================================================

naming_conventions:
  structure:
    description: "Use kebab-case with prefix-category-description pattern"
    pattern: "{type}-{component}-{feature}-{qualifier}"
    examples:
      - "release-api-graphql-v2"
      - "ops-database-read-replica-enabled"
      - "exp-homepage-hero-variant-b"
      - "perm-reporting-custom-dashboards"
  
  prefixes:
    release: "Temporary release flag"
    ops: "Operational/infrastructure flag"
    exp: "Experiment/A-B test flag"
    perm: "Permission/entitlement flag"
    config: "Configuration toggle"
  
  anti_patterns:
    - pattern: "enable_new_feature"
      reason: "Unclear lifecycle, no category"
      fix: "release-checkout-express-flow"
    
    - pattern: "flag_123"
      reason: "Non-descriptive, no context"
      fix: "release-payments-stripe-integration"
    
    - pattern: "camelCaseFlag"
      reason: "Inconsistent with LaunchDarkly conventions"
      fix: "kebab-case-flag"

# ============================================================================
# TARGETING STRATEGIES
# ============================================================================

targeting:
  progressive_rollout:
    description: "Gradually increase percentage of users"
    phases:
      - "Internal users: 100%"
      - "Beta users: 10%"
      - "General availability: 25% → 50% → 100%"
    monitoring: "Monitor error rates at each phase"
    rollback: "Instant rollback to 0% if errors spike"
  
  ring_deployment:
    description: "Roll out to groups in sequence"
    rings:
      ring_0: "Developers and QA"
      ring_1: "Internal employees"
      ring_2: "Early adopters (opt-in)"
      ring_3: "General availability"
    duration: "1-3 days per ring"
  
  canary_release:
    description: "Route small percentage to new version"
    configuration: "5% canary, 95% baseline"
    metrics: ["Error rate", "Latency", "Conversion rate"]
    decision: "Promote if metrics within 5% of baseline"
  
  user_segments:
    description: "Target based on user attributes"
    attributes:
      - "user_tier: free | pro | enterprise"
      - "region: us-east | eu-west | ap-south"
      - "beta_opt_in: true | false"
    example: "Enable premium feature for enterprise tier only"

# ============================================================================
# FLAG EVALUATION PATTERNS
# ============================================================================

evaluation:
  client_side:
    description: "Evaluate flags in browser/mobile app"
    use_cases: ["UI feature toggles", "UX experiments"]
    sdk: "JavaScript, iOS, Android SDKs"
    security: "Use anonymous contexts for public apps"
    performance: "Caches flag values, evaluates locally"
  
  server_side:
    description: "Evaluate flags in backend services"
    use_cases: ["API features", "Business logic", "Infrastructure"]
    sdk: "Node.js, Python, Java, .NET SDKs"
    best_practices:
      - "Pass user context for personalization"
      - "Use variation() for boolean flags"
      - "Use jsonVariation() for complex config"
  
  edge_evaluation:
    description: "Evaluate at CDN/edge for low latency"
    providers: ["Cloudflare Workers", "AWS Lambda@Edge"]
    latency: "<10ms flag evaluation"
    use_case: "Geo-based routing, A/B testing"

# ============================================================================
# GOVERNANCE & WORKFLOWS
# ============================================================================

governance:
  approval_workflows:
    description: "Require approvals for production flag changes"
    policy:
      development: "No approval required"
      staging: "1 approver (any team member)"
      production: "2 approvers (lead + architect)"
    example: "Enabling payment feature requires security review"
  
  change_requests:
    description: "Document reason for flag state changes"
    required_fields:
      - "What: Feature being enabled"
      - "Why: Business justification"
      - "Risk: Blast radius if failure"
      - "Rollback: How to revert"
    template: "Use LaunchDarkly change request templates"
  
  flag_lifecycle_management:
    description: "Automate flag cleanup to prevent debt"
    rules:
      - "Archive release flags 30 days after 100% rollout"
      - "Review ops flags quarterly for deprecation"
      - "Delete archived flags after 90 days"
    automation: "Use LaunchDarkly API + scheduled jobs"
  
  audit_logging:
    description: "Track all flag changes for compliance"
    logged_events:
      - "Flag created/modified/deleted"
      - "Targeting rules changed"
      - "Rollout percentage changed"
      - "Approvals granted/denied"
    retention: "2 years for audit compliance"

# ============================================================================
# INTEGRATION PATTERNS
# ============================================================================

integration:
  ci_cd_pipeline:
    description: "Integrate flags with deployment pipeline"
    workflow:
      - "Deploy code with flag OFF"
      - "Run smoke tests"
      - "Enable flag via LaunchDarkly (no redeploy)"
      - "Monitor metrics"
      - "Rollback flag if issues (instant)"
    tools: ["GitHub Actions", "Azure DevOps", "Jenkins"]
  
  observability:
    description: "Track flag impact on application metrics"
    integrations:
      - "DataDog: Track metrics by flag variant"
      - "New Relic: Monitor performance per flag"
      - "Splunk: Log flag evaluations"
    example: "Alert if error rate increases when flag enabled"
  
  experimentation_platforms:
    description: "Integrate with A/B testing tools"
    tools: ["Amplitude", "Optimizely", "Google Analytics"]
    pattern: "LaunchDarkly assigns variant → Analytics tracks conversion"

# ============================================================================
# SECURITY BEST PRACTICES
# ============================================================================

security:
  sdk_keys:
    description: "Use appropriate SDK keys for environment"
    types:
      client_side: "Safe to expose publicly (mobile/browser)"
      server_side: "Secret, never expose to clients"
      mobile: "Environment-specific keys"
    storage: "Store server-side keys in secret manager"
  
  user_context:
    description: "Avoid sending PII in flag evaluation context"
    good_example: |
      context = {
        "key": user_id_hash,
        "tier": "enterprise",
        "region": "us-east"
      }
    bad_example: |
      context = {
        "email": "user@example.com",  # PII
        "ssn": "123-45-6789"  # Sensitive data
      }
  
  flag_defaults:
    description: "Always provide safe default when flag unavailable"
    pattern: |
      is_enabled = ld_client.variation("release-feature-x", user, False)
    rationale: "Fail closed if LaunchDarkly unreachable"

# ============================================================================
# PERFORMANCE OPTIMIZATION
# ============================================================================

performance:
  caching:
    description: "SDKs cache flag values automatically"
    configuration:
      polling_interval: "30 seconds (default)"
      streaming: "true (real-time updates)"
    best_practice: "Use streaming for production, polling for dev"
  
  batch_evaluation:
    description: "Evaluate multiple flags in single request"
    sdk_method: "all_flags(user_context)"
    use_case: "Mobile apps: fetch flags on app launch"
  
  local_evaluation:
    description: "Evaluate flags locally without network calls"
    sdk: "Relay Proxy for high-throughput services"
    latency: "<1ms evaluation time"
    use_case: "Microservices with >10k requests/second"

# ============================================================================
# ANTI-PATTERNS (AVOID)
# ============================================================================

anti_patterns:
  - pattern: "Never archiving flags after release"
    reason: "Accumulates technical debt, confuses team"
    fix: "Archive flags 30 days after 100% rollout"
  
  - pattern: "Using flags for configuration instead of config management"
    reason: "LaunchDarkly not designed for config values"
    fix: "Use environment variables or config service"
  
  - pattern: "Creating flag per user for testing"
    reason: "Flag explosion, hard to manage"
    fix: "Use user segments or custom attributes"
  
  - pattern: "Hardcoding flag keys as strings throughout codebase"
    reason: "Typos, hard to refactor"
    fix: "Define constants or use SDK's flag key validation"
  
  - pattern: "Evaluating flags in tight loops"
    reason: "Performance degradation"
    fix: "Evaluate once, cache result for loop"
  
  - pattern: "No monitoring when enabling flags"
    reason: "Miss errors and degradation"
    fix: "Always monitor error rates and latency"

# ============================================================================
# CORTEX INTEGRATION
# ============================================================================

cortex_integration:
  onboarding:
    description: "Detect LaunchDarkly usage during repository analysis"
    indicators: ["launchdarkly-sdk imports", "ld_client usage"]
  
  governance_checks:
    description: "Audit flag usage against best practices"
    violations:
      - "Hardcoded flag keys (not constants)"
      - "Missing default values in variation() calls"
      - "PII in user context"
      - "Flags older than 90 days without archival"
  
  refactoring:
    description: "Suggest improvements for flag implementation"
    recommendations:
      - "Extract flag keys to constants"
      - "Add default values to variation() calls"
      - "Replace config flags with environment variables"
      - "Archive stale flags"

references:
  - title: "LaunchDarkly Best Practices"
    url: "https://docs.launchdarkly.com/guides/best-practices"
  
  - title: "Feature Flag Best Practices"
    url: "https://docs.launchdarkly.com/guides/best-practices/using-feature-flags"
  
  - title: "Flag Lifecycle Management"
    url: "https://docs.launchdarkly.com/guides/best-practices/flag-lifecycle"
  
  - title: "Targeting and Rollouts"
    url: "https://docs.launchdarkly.com/home/flags/targeting"
