# Engineering Design Patterns
# Authority: AC-PHASE65-S1-001

title: "Engineering Design Patterns"
category: "architecture"
version: "1.0"

best_practices:
  creational:
    factory_pattern:
      description: "Use Factory to decouple object creation from usage"
    singleton_pattern:
      description: "Use Singleton sparingly; prefer dependency injection"
    builder_pattern:
      description: "Use Builder for complex object construction"
  structural:
    adapter_pattern:
      description: "Use Adapter to integrate incompatible interfaces"
    facade_pattern:
      description: "Use Facade to simplify complex subsystem interactions"
    decorator_pattern:
      description: "Use Decorator to add behaviour without modifying the original class"
    composite_pattern:
      description: "Use Composite for tree structures and recursive hierarchies"
  behavioural:
    observer_pattern:
      description: "Use Observer / Event Bus for decoupled event-driven communication"
    strategy_pattern:
      description: "Use Strategy to swap algorithms at runtime"
    command_pattern:
      description: "Use Command to encapsulate requests as objects"
    chain_of_responsibility:
      description: "Use Chain of Responsibility for flexible request processing pipelines"
  selection:
    pattern_necessity:
      description: "Only introduce a pattern when it solves a concrete problem"
    avoid_overengineering:
      description: "Simple code without a pattern is better than complex code with one"
