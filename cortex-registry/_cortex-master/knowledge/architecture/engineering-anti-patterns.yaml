# Anti-Patterns Catalog
# Comprehensive guide to software development anti-patterns
# Sources: AntiPatterns (Brown et al. 1998), Refactoring (Fowler), Code Smells

metadata:
  version: "1.0.0"
  author: "Asif Hussain"
  created: "2025-12-22"
  updated: "2025-12-22"
  source: "AntiPatterns: Refactoring Software, Architectures, and Projects in Crisis (1998)"
  purpose: "Comprehensive anti-pattern knowledge for detection and refactoring"
  schema: "AntiPatternsSchema"
  integration:
    - "Code review agents for anti-pattern detection"
    - "Refactoring agents for transformation guidance"
    - "Architecture agents for system-level anti-pattern identification"
    - "Quality agents for code smell detection"

# Detection framework - Automatic anti-pattern identification
detection_framework:
  code_metrics:
    - metric: "cyclomatic_complexity"
      threshold: 20
      indicates: ["God Object", "Spaghetti Code"]
    
    - metric: "lines_of_code"
      threshold: 500
      indicates: ["God Object", "Monster Method"]
    
    - metric: "number_of_methods"
      threshold: 30
      indicates: ["God Object", "Interface Bloat"]
    
    - metric: "depth_of_inheritance"
      threshold: 5
      indicates: ["Deep Inheritance Tree"]
    
    - metric: "coupling_count"
      threshold: 10
      indicates: ["God Object", "Hub-like Dependency"]
    
    - metric: "duplicate_code_percentage"
      threshold: 5
      indicates: ["Copy-Paste Programming", "Code Clone"]
    
    - metric: "comment_to_code_ratio"
      threshold_min: 0.02
      threshold_max: 0.30
      indicates: ["Insufficient Documentation", "Excessive Documentation"]
  
  code_patterns:
    - pattern: "class.*extends.*extends.*extends"
      type: "regex"
      indicates: ["Deep Inheritance Tree"]
    
    - pattern: "if.*else if.*else if.*else if"
      type: "regex"
      indicates: ["Arrow Anti-Pattern", "Complex Conditional"]
    
    - pattern: "TODO|FIXME|HACK|XXX"
      type: "regex"
      indicates: ["Lava Flow", "Technical Debt"]
    
    - pattern: "getInstance\\(\\)"
      type: "regex"
      indicates: ["Singleton Overuse"]
  
  architecture_patterns:
    - pattern: "circular_dependency"
      detection: "dependency_graph_analysis"
      indicates: ["Circular Dependency"]
    
    - pattern: "vendor_specific_api"
      detection: "import_analysis"
      indicates: ["Vendor Lock-In"]

# ==========================================
# DEVELOPMENT ANTI-PATTERNS (15 patterns)
# ==========================================

development_anti_patterns:
  - name: "God Object"
    aliases: ["Blob", "Winnebago"]
    category: "development"
    severity: "CRITICAL"
    
    description: |
      Single class that knows too much or does too much. Takes on most responsibilities
      in system, causing tight coupling and low cohesion.
    
    symptoms:
      - "Single class with >30 methods"
      - "Class with >1000 lines of code"
      - "Class name is generic (Manager, Controller, Handler, Service)"
      - "Many dependencies on this class"
      - "Class touches many different concerns"
      - "Difficult to test in isolation"
    
    consequences:
      - "High coupling to many other classes"
      - "Low cohesion (unrelated responsibilities)"
      - "Hard to understand and maintain"
      - "Difficult to test"
      - "Limits reusability"
      - "Single point of failure"
    
    detection_heuristics:
      cyclomatic_complexity: ">50"
      lines_of_code: ">500"
      number_of_methods: ">30"
      fan_in: ">10"  # Many classes depend on it
      fan_out: ">20"  # Depends on many classes
    
    examples:
      python: |
        # Γ¥î God Object
        class UserManager:
            def authenticate(self, username, password): pass
            def authorize(self, user, resource): pass
            def send_email(self, user, message): pass
            def log_action(self, action): pass
            def generate_report(self, user): pass
            def update_profile(self, user, data): pass
            def delete_account(self, user): pass
            def export_data(self, user): pass
            def import_data(self, user, data): pass
            # ... 20+ more methods
      
      csharp: |
        // Γ¥î God Object
        public class ApplicationManager
        {
            public void HandleLogin(string username, string password) { }
            public void HandleLogout(User user) { }
            public void SendNotification(User user, string message) { }
            public void ProcessPayment(User user, Payment payment) { }
            public void GenerateInvoice(User user) { }
            public void UpdateSettings(User user, Settings settings) { }
            // ... many more unrelated methods
        }
    
    refactoring_path:
      - step: "Identify distinct responsibilities"
        action: "Group methods by cohesive functionality"
      
      - step: "Extract classes for each responsibility"
        actions:
          - "AuthenticationService for login/logout"
          - "NotificationService for emails/alerts"
          - "ReportGenerator for reports"
          - "UserRepository for CRUD operations"
      
      - step: "Apply Single Responsibility Principle"
        pattern: "Extract Class refactoring"
      
      - step: "Use Dependency Injection"
        pattern: "Inject services instead of creating them"
    
    refactored_example:
      python: |
        # Γ£à Separated responsibilities
        class AuthenticationService:
            def authenticate(self, username, password): pass
        
        class AuthorizationService:
            def authorize(self, user, resource): pass
        
        class EmailService:
            def send_email(self, user, message): pass
        
        class UserRepository:
            def update_profile(self, user, data): pass
            def delete_account(self, user): pass
        
        class ReportGenerator:
            def generate_report(self, user): pass
      
      csharp: |
        // Γ£à Separated responsibilities
        public class AuthenticationService
        {
            public void Login(string username, string password) { }
            public void Logout(User user) { }
        }
        
        public class NotificationService
        {
            public void Send(User user, string message) { }
        }
        
        public class PaymentProcessor
        {
            public void Process(User user, Payment payment) { }
        }
    
    related_patterns:
      - name: "Facade"
        relationship: "Use Facade to provide simple interface to separated services"
      - name: "Dependency Injection"
        relationship: "Inject separated services instead of creating them"

  - name: "Spaghetti Code"
    category: "development"
    severity: "HIGH"
    
    description: |
      Code with complex and tangled control structure. Difficult to follow logic flow,
      heavy use of GOTO (in old languages) or complex nested conditionals.
    
    symptoms:
      - "Deeply nested if/else statements (>5 levels)"
      - "Complex control flow (hard to follow)"
      - "Methods with >50 lines"
      - "Minimal use of functions/methods"
      - "Lots of global state"
      - "Hard to debug"
    
    consequences:
      - "Impossible to understand without running"
      - "High defect rate"
      - "Difficult to modify safely"
      - "No code reuse"
    
    detection_heuristics:
      cyclomatic_complexity: ">20"
      nesting_depth: ">5"
      method_length: ">50 lines"
    
    examples:
      python: |
        # Γ¥î Spaghetti Code
        def process_order(order):
            if order.items:
                if order.customer:
                    if order.customer.is_active:
                        if order.total > 0:
                            if order.payment_method:
                                if order.payment_method.is_valid:
                                    if order.shipping_address:
                                        # ... deeply nested logic
                                        pass
      
      csharp: |
        // Γ¥î Spaghetti Code
        public void ProcessOrder(Order order)
        {
            if (order.Items != null)
            {
                if (order.Customer != null)
                {
                    if (order.Customer.IsActive)
                    {
                        if (order.Total > 0)
                        {
                            // ... deeply nested
                        }
                    }
                }
            }
        }
    
    refactoring_path:
      - step: "Extract nested logic into methods"
        pattern: "Extract Method"
      
      - step: "Use guard clauses (early returns)"
        pattern: "Replace Nested Conditional with Guard Clauses"
      
      - step: "Apply Strategy pattern for complex conditionals"
        pattern: "Replace Conditional with Polymorphism"
    
    refactored_example:
      python: |
        # Γ£à Refactored with guard clauses
        def process_order(order):
            if not order.items:
                raise ValueError("Order has no items")
            if not order.customer or not order.customer.is_active:
                raise ValueError("Invalid customer")
            if order.total <= 0:
                raise ValueError("Invalid order total")
            if not self._validate_payment(order):
                raise ValueError("Invalid payment")
            if not order.shipping_address:
                raise ValueError("Missing shipping address")
            
            self._charge_payment(order)
            self._ship_order(order)
        
        def _validate_payment(self, order):
            return order.payment_method and order.payment_method.is_valid
      
      csharp: |
        // Γ£à Refactored with guard clauses
        public void ProcessOrder(Order order)
        {
            if (order.Items == null) throw new ArgumentException("No items");
            if (!IsCustomerValid(order.Customer)) throw new ArgumentException("Invalid customer");
            if (order.Total <= 0) throw new ArgumentException("Invalid total");
            if (!ValidatePayment(order)) throw new ArgumentException("Invalid payment");
            
            ChargePayment(order);
            ShipOrder(order);
        }
        
        private bool IsCustomerValid(Customer customer)
        {
            return customer != null && customer.IsActive;
        }

  - name: "Lava Flow"
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Dead code and forgotten design artifacts that remain in codebase.
      Code that was experimental or temporary but never removed.
    
    symptoms:
      - "Commented-out code blocks"
      - "TODO/FIXME comments from years ago"
      - "Unused variables/methods/classes"
      - "Obsolete design patterns"
      - "Fear of deleting code ('might need it later')"
    
    consequences:
      - "Increased codebase size"
      - "Confusion about what's actually used"
      - "Maintenance burden"
      - "Slower builds"
    
    detection_heuristics:
      - "Static analysis for unused code"
      - "Search for TODO/FIXME older than 6 months"
      - "Find commented-out code blocks"
      - "Coverage analysis (0% coverage = likely unused)"
    
    examples:
      python: |
        # Γ¥î Lava Flow
        class UserService:
            def get_user(self, id):
                # Old implementation - DO NOT USE
                # return self.db.query(User).filter(User.id == id).first()
                
                # TODO: Remove this after migration (Added: 2019-03-15)
                # user = legacy_get_user(id)
                
                return self.repository.find_by_id(id)
      
      csharp: |
        // Γ¥î Lava Flow
        public class OrderService
        {
            // FIXME: This needs to be refactored (Added: 2018-06-20)
            // public void OldProcessOrder(Order order) { ... }
            
            public void ProcessOrder(Order order)
            {
                // var temp = CalculateDiscount(order);  // Unused
                order.Process();
            }
        }
    
    refactoring_path:
      - step: "Run static analysis for unused code"
        tools: ["pylint", "ruff", "ReSharper", "SonarQube"]
      
      - step: "Delete commented-out code"
        reason: "Version control preserves history"
      
      - step: "Remove or complete TODO/FIXME items"
        action: "Create tickets for valid TODOs, delete old ones"
      
      - step: "Delete unused methods/classes"
        verification: "Ensure no references exist"
    
    best_practices:
      - "Use feature flags instead of commenting code"
      - "Trust version control - don't comment out code"
      - "Review and act on TODOs monthly"
      - "Set up automated unused code detection"

  - name: "Golden Hammer"
    aliases: ["Silver Bullet"]
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Using familiar tool/technology for everything, regardless of fit.
      "If all you have is a hammer, everything looks like a nail."
    
    symptoms:
      - "Same pattern used everywhere"
      - "Forcing technology into inappropriate use cases"
      - "Resistance to learning new approaches"
      - "Complex workarounds to make tool fit"
    
    consequences:
      - "Suboptimal solutions"
      - "Over-engineered simple problems"
      - "Under-engineered complex problems"
      - "Technical debt"
    
    examples:
      - example: "Using Singleton pattern for everything"
        problem: "Makes testing difficult, hides dependencies"
      
      - example: "Using ORM for all database access"
        problem: "Complex queries become inefficient"
      
      - example: "Using microservices for small applications"
        problem: "Unnecessary complexity, operational overhead"
      
      - example: "Using NoSQL for all data"
        problem: "Loses ACID guarantees when needed"
    
    refactoring_path:
      - step: "Understand problem requirements first"
      - step: "Evaluate multiple solutions"
      - step: "Choose technology that fits problem"
      - step: "Be willing to use different approaches"
    
    prevention:
      - "Learn multiple tools/patterns"
      - "Evaluate pros/cons for each use case"
      - "Be pragmatic, not dogmatic"
      - "Consider simplest solution first"

  - name: "Magic Numbers"
    category: "development"
    severity: "LOW"
    
    description: |
      Using unnamed numerical constants directly in code.
      Reduces readability and maintainability.
    
    symptoms:
      - "Unexplained numbers in code"
      - "Same number repeated multiple places"
      - "No context for what number represents"
    
    examples:
      python: |
        # Γ¥î Magic Numbers
        def calculate_discount(price):
            if price > 1000:
                return price * 0.15
            elif price > 500:
                return price * 0.10
            else:
                return price * 0.05
      
      csharp: |
        // Γ¥î Magic Numbers
        public decimal CalculateDiscount(decimal price)
        {
            if (price > 1000)
                return price * 0.15m;
            else if (price > 500)
                return price * 0.10m;
            else
                return price * 0.05m;
        }
    
    refactoring_path:
      - step: "Extract constants with meaningful names"
        pattern: "Replace Magic Number with Symbolic Constant"
    
    refactored_example:
      python: |
        # Γ£à Named Constants
        PREMIUM_THRESHOLD = 1000
        STANDARD_THRESHOLD = 500
        PREMIUM_DISCOUNT = 0.15
        STANDARD_DISCOUNT = 0.10
        BASIC_DISCOUNT = 0.05
        
        def calculate_discount(price):
            if price > PREMIUM_THRESHOLD:
                return price * PREMIUM_DISCOUNT
            elif price > STANDARD_THRESHOLD:
                return price * STANDARD_DISCOUNT
            else:
                return price * BASIC_DISCOUNT
      
      csharp: |
        // Γ£à Named Constants
        private const decimal PremiumThreshold = 1000m;
        private const decimal StandardThreshold = 500m;
        private const decimal PremiumDiscount = 0.15m;
        private const decimal StandardDiscount = 0.10m;
        private const decimal BasicDiscount = 0.05m;
        
        public decimal CalculateDiscount(decimal price)
        {
            if (price > PremiumThreshold)
                return price * PremiumDiscount;
            else if (price > StandardThreshold)
                return price * StandardDiscount;
            else
                return price * BasicDiscount;
        }

  - name: "Copy-Paste Programming"
    aliases: ["Code Clone", "Duplicate Code"]
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Copying code from one place and pasting it elsewhere with minor modifications.
      Creates maintenance burden - bugs must be fixed in multiple places.
    
    symptoms:
      - "Similar code blocks in multiple places"
      - "Same logic with slightly different variables"
      - "Duplicate validation logic"
      - "Repeated algorithms"
    
    consequences:
      - "Bug fixes required in multiple places"
      - "Inconsistent behavior"
      - "Increased maintenance cost"
      - "Larger codebase"
    
    detection_heuristics:
      tools:
        - "PMD Copy/Paste Detector (CPD)"
        - "SonarQube duplicate code detection"
        - "Clone detection tools"
      threshold: ">5% duplicate code"
    
    examples:
      python: |
        # Γ¥î Copy-Paste Programming
        def validate_user_email(email):
            if not email:
                return False
            if '@' not in email:
                return False
            if len(email) < 5:
                return False
            return True
        
        def validate_admin_email(email):
            if not email:
                return False
            if '@' not in email:
                return False
            if len(email) < 5:
                return False
            if not email.endswith('@company.com'):
                return False
            return True
    
    refactoring_path:
      - step: "Extract common logic into method"
        pattern: "Extract Method"
      
      - step: "Parameterize differences"
        pattern: "Parameterize Method"
      
      - step: "Use inheritance/composition for variants"
        pattern: "Template Method or Strategy"
    
    refactored_example:
      python: |
        # Γ£à Extracted common logic
        def validate_email_format(email):
            if not email:
                return False
            if '@' not in email:
                return False
            if len(email) < 5:
                return False
            return True
        
        def validate_user_email(email):
            return validate_email_format(email)
        
        def validate_admin_email(email):
            if not validate_email_format(email):
                return False
            return email.endswith('@company.com')

  - name: "Premature Optimization"
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Optimizing code before knowing if it's a performance bottleneck.
      "Premature optimization is the root of all evil" - Donald Knuth
    
    symptoms:
      - "Complex code for unproven performance gains"
      - "Sacrificing readability for perceived speed"
      - "Optimization without profiling"
      - "Micro-optimizations in non-critical paths"
    
    consequences:
      - "Reduced code readability"
      - "Increased complexity"
      - "Longer development time"
      - "Potential for new bugs"
    
    approach:
      - "Make it work first"
      - "Make it right (clean, maintainable)"
      - "Profile to find bottlenecks"
      - "Make it fast (optimize critical paths only)"
    
    examples:
      bad: |
        # Γ¥î Premature optimization - unreadable bit manipulation
        def is_even(n):
            return (n & 1) == 0  # Clever but less clear
      
      good: |
        # Γ£à Clear and sufficient
        def is_even(n):
            return n % 2 == 0  # Clear intent

  - name: "Not Invented Here (NIH)"
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Refusing to use existing solutions, insisting on building everything in-house.
    
    symptoms:
      - "Reimplementing common libraries"
      - "Building custom frameworks when good ones exist"
      - "Rejecting open-source solutions"
      - "Reinventing the wheel"
    
    consequences:
      - "Wasted development time"
      - "Maintenance burden"
      - "Likely inferior to mature solutions"
      - "Duplicated effort"
    
    examples:
      - "Building custom ORM instead of using Entity Framework/SQLAlchemy"
      - "Writing custom JSON parser instead of using standard library"
      - "Creating custom logging framework instead of using established solutions"
    
    solution:
      - "Evaluate existing solutions first"
      - "Build only when no good solution exists"
      - "Contribute to existing projects instead"

  - name: "Reinventing the Wheel"
    category: "development"
    severity: "LOW"
    
    description: |
      Recreating functionality that already exists in standard libraries or frameworks.
    
    examples:
      - "Custom array sorting when language has built-in sort"
      - "Custom date formatting when libraries exist"
      - "Custom HTTP client when standard libraries available"
    
    solution:
      - "Learn standard library thoroughly"
      - "Research before implementing"
      - "Use package managers (pip, npm, NuGet)"

  - name: "Cargo Cult Programming"
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Using patterns/practices without understanding why or when they're appropriate.
      Blindly copying code patterns without understanding.
    
    symptoms:
      - "Copying code without understanding"
      - "Using patterns because 'best practice'"
      - "Cargo cult design patterns"
      - "Following rules without knowing reasons"
    
    examples:
      - "Using interfaces for everything because 'SOLID'"
      - "Creating repository for every entity without justification"
      - "Adding abstraction layers without need"
    
    solution:
      - "Understand WHY before copying WHAT"
      - "Learn principles, not just patterns"
      - "Question every pattern/practice"

  - name: "Analysis Paralysis"
    category: "development"
    severity: "MEDIUM"
    
    description: |
      Over-analyzing problem to point where no decision is made or action is taken.
    
    symptoms:
      - "Endless design discussions"
      - "Inability to commit to approach"
      - "Fear of making wrong choice"
      - "Perfectionism blocking progress"
    
    consequences:
      - "Delayed delivery"
      - "Missed opportunities"
      - "Team frustration"
    
    solution:
      - "Set decision deadlines"
      - "Accept 'good enough' solutions"
      - "Use timeboxing"
      - "Make reversible decisions quickly"

  - name: "Mushroom Management"
    category: "organizational"
    severity: "HIGH"
    
    description: |
      Management style of keeping employees 'in the dark and fed manure'.
      Lack of communication and transparency.
    
    symptoms:
      - "Decisions made without team input"
      - "No visibility into roadmap"
      - "Surprises and last-minute changes"
      - "Information hoarding"
    
    consequences:
      - "Low morale"
      - "Poor decisions (lack of input)"
      - "High turnover"
      - "Misaligned efforts"

# ==========================================
# ARCHITECTURE ANTI-PATTERNS (10 patterns)
# ==========================================

architecture_anti_patterns:
  - name: "Big Ball of Mud"
    category: "architecture"
    severity: "CRITICAL"
    
    description: |
      System with no discernible architecture. Haphazardly grown with no structure.
      Most common software architecture in practice.
    
    symptoms:
      - "No clear architectural layers"
      - "Everything depends on everything"
      - "No module boundaries"
      - "Impossible to understand system structure"
      - "Changes have unpredictable ripple effects"
    
    consequences:
      - "High maintenance cost"
      - "Difficult to onboard new developers"
      - "Slow feature development"
      - "High defect rate"
      - "Eventually requires rewrite"
    
    detection:
      - "Dependency analysis shows high coupling"
      - "No clear layering (presentation/business/data)"
      - "Circular dependencies"
      - "No modularization"
    
    refactoring_path:
      - step: "Identify core domains"
        pattern: "Domain-Driven Design"
      
      - step: "Establish architectural layers"
        patterns: ["Layered Architecture", "Clean Architecture"]
      
      - step: "Define module boundaries"
        pattern: "Bounded Contexts (DDD)"
      
      - step: "Break circular dependencies"
        pattern: "Dependency Inversion"
      
      - step: "Incremental refactoring"
        strategy: "Strangler Fig Pattern"

  - name: "Monolithic Build"
    category: "architecture"
    severity: "HIGH"
    
    description: |
      Single large build that takes hours to complete. Any change requires full rebuild.
    
    symptoms:
      - "Build time >30 minutes"
      - "Must rebuild everything for small change"
      - "Developers avoid running full build"
      - "Continuous Integration takes too long"
    
    consequences:
      - "Slow feedback cycle"
      - "Reduced productivity"
      - "Developers don't run tests"
      - "Integration hell"
    
    refactoring_path:
      - step: "Modularize codebase"
      - step: "Incremental builds"
      - step: "Parallel builds"
      - step: "Consider microservices (if appropriate)"

  - name: "Vendor Lock-In"
    category: "architecture"
    severity: "HIGH"
    
    description: |
      Heavy dependence on specific vendor's products, making it expensive/difficult to switch.
    
    symptoms:
      - "Direct dependencies on vendor APIs throughout codebase"
      - "Vendor-specific features used extensively"
      - "No abstraction layer for vendor services"
      - "Migration cost is prohibitive"
    
    consequences:
      - "Locked into vendor pricing"
      - "Can't leverage better alternatives"
      - "Vendor dictates upgrade timeline"
      - "High switching costs"
    
    prevention:
      - "Use abstraction layers (Repository, Adapter patterns)"
      - "Avoid vendor-specific features when possible"
      - "Use open standards"
      - "Plan exit strategy"

  - name: "Stovepipe System"
    aliases: ["Silos"]
    category: "architecture"
    severity: "HIGH"
    
    description: |
      Subsystems that cannot interoperate. Data cannot be shared between systems.
    
    symptoms:
      - "Multiple systems with duplicate data"
      - "No integration between systems"
      - "Manual data transfer between systems"
      - "Inconsistent data across systems"
    
    consequences:
      - "Data inconsistency"
      - "Manual effort to sync data"
      - "Poor user experience"
      - "Duplicated functionality"
    
    solution:
      - "Implement integration layer"
      - "Use message bus/event-driven architecture"
      - "Standardize data formats"
      - "Build APIs for interoperability"

  - name: "Circular Dependency"
    category: "architecture"
    severity: "HIGH"
    
    description: |
      Two or more modules depend on each other, creating cycle in dependency graph.
    
    symptoms:
      - "Module A depends on Module B which depends on Module A"
      - "Difficult to compile/deploy independently"
      - "Changes ripple between modules"
      - "Hard to test in isolation"
    
    consequences:
      - "Tight coupling"
      - "Cannot reuse modules independently"
      - "Complex initialization order"
      - "Build system issues"
    
    detection:
      tools: ["dependency graph visualization", "static analysis"]
    
    refactoring_path:
      - step: "Identify dependency cycle"
      - step: "Extract common interface"
      - step: "Use Dependency Inversion Principle"
      - step: "Introduce mediator if needed"

# ==========================================
# Anti-Pattern to Pattern Mapping
# ==========================================

anti_pattern_to_pattern_mapping:
  - anti_pattern: "God Object"
    refactoring_patterns:
      - "Extract Class"
      - "Move Method"
      - "Single Responsibility Principle"
    design_patterns:
      - "Facade (for simplified interface)"
      - "Strategy (for algorithmic variations)"
      - "Dependency Injection (for decoupling)"
  
  - anti_pattern: "Spaghetti Code"
    refactoring_patterns:
      - "Extract Method"
      - "Replace Nested Conditional with Guard Clauses"
      - "Replace Conditional with Polymorphism"
    design_patterns:
      - "Strategy (for complex conditionals)"
      - "State (for state-based behavior)"
      - "Template Method (for algorithm skeleton)"
  
  - anti_pattern: "Copy-Paste Programming"
    refactoring_patterns:
      - "Extract Method"
      - "Pull Up Method"
      - "Form Template Method"
    design_patterns:
      - "Template Method (for common algorithm)"
      - "Strategy (for variations)"
  
  - anti_pattern: "Big Ball of Mud"
    refactoring_patterns:
      - "Extract Class"
      - "Move Method"
      - "Introduce Layer"
    design_patterns:
      - "Layered Architecture"
      - "Clean Architecture"
      - "Bounded Context (DDD)"
  
  - anti_pattern: "Vendor Lock-In"
    design_patterns:
      - "Adapter (wrap vendor API)"
      - "Facade (simplify vendor interface)"
      - "Repository (abstract data access)"
  
  - anti_pattern: "Circular Dependency"
    design_patterns:
      - "Dependency Inversion"
      - "Mediator"
      - "Observer"

# ==========================================
# Severity Guidelines
# ==========================================

severity_levels:
  CRITICAL:
    description: "System-wide impact, requires immediate attention"
    examples: ["God Object", "Big Ball of Mud", "Mushroom Management"]
    action: "Prioritize refactoring immediately"
  
  HIGH:
    description: "Significant impact on maintainability/quality"
    examples: ["Spaghetti Code", "Vendor Lock-In", "Circular Dependency"]
    action: "Schedule refactoring in next sprint"
  
  MEDIUM:
    description: "Moderate impact, should be addressed"
    examples: ["Copy-Paste Programming", "Lava Flow", "Golden Hammer"]
    action: "Address during regular refactoring sessions"
  
  LOW:
    description: "Minor issue, low priority"
    examples: ["Magic Numbers"]
    action: "Fix opportunistically when touching code"

