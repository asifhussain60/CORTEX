# =============================================================================
# DOMAIN EVENTS OVERVIEW
# =============================================================================

domain_events_overview:
  description: "Record of something significant that happened in the domain"
  
  definition:
    quote: "Use a domain event to capture an occurrence of something that happened in the domain - Eric Evans"
    
  characteristics:
    - "Past tense naming (OrderPlaced, not PlaceOrder)"
    - "Immutable (what happened cannot change)"
    - "Contains data relevant to event"
    - "Published after aggregate state change persisted"
    - "Can trigger side effects in other aggregates/contexts"
    
  benefits:
    - "Decouples aggregates and bounded contexts"
    - "Enables eventual consistency"
    - "Provides audit trail"
    - "Supports temporal queries"
    - "Enables event sourcing"
    - "Makes implicit business processes explicit"
    
  types:
    - type: "Internal Domain Events"
      scope: "Within same bounded context"
      purpose: "Decouple aggregates, trigger workflows"
      example: "OrderConfirmed triggers EmailConfirmationSent"
      
    - type: "Integration Events"
      scope: "Across bounded contexts"
      purpose: "Notify other contexts of changes"
      example: "OrderPlaced event published to Fulfillment context"
      
    - type: "Event Sourcing Events"
      scope: "Complete state representation"
      purpose: "Rebuild aggregate state from events"
      example: "All events stored, state derived"

# =============================================================================
# DOMAIN EVENT DESIGN
# =============================================================================

domain_event_design:
  description: "How to structure and implement domain events"
  
  event_structure:
    - component: "Event ID"
      description: "Unique identifier for event instance"
      type: "Guid/UUID"
      
    - component: "Aggregate ID"
      description: "ID of aggregate that generated event"
      purpose: "Correlate events to aggregate"
      
    - component: "Event Type/Name"
      description: "What happened"
      format: "PastTense (OrderPlaced, PaymentProcessed)"
      
    - component: "Event Data"
      description: "Relevant information about what happened"
      guideline: "Include what consumers need, avoid over-communication"
      
    - component: "Metadata"
      description: "Timestamp, user, correlation ID"
      purpose: "Auditing, tracing, debugging"
      
  implementation_example:
    csharp: |
      // Base domain event
      public abstract class DomainEvent {
          public Guid EventId { get; }
          public DateTime OccurredOn { get; }
          
          protected DomainEvent() {
              EventId = Guid.NewGuid();
              OccurredOn = DateTime.UtcNow;
          }
      }
      
      // Specific event
      public class OrderPlaced : DomainEvent {
          public Guid OrderId { get; }
          public Guid CustomerId { get; }
          public Money Total { get; }
          public DateTime OrderDate { get; }
          
          public OrderPlaced(Guid orderId, Guid customerId, Money total, DateTime orderDate) {
              OrderId = orderId;
              CustomerId = customerId;
              Total = total;
              OrderDate = orderDate;
          }
      }
      
    python: |
      from dataclasses import dataclass
      from datetime import datetime
      from uuid import UUID, uuid4
      
      @dataclass(frozen=True)  # Immutable
      class DomainEvent:
          event_id: UUID
          occurred_on: datetime
          
      @dataclass(frozen=True)
      class OrderPlaced(DomainEvent):
          order_id: UUID
          customer_id: UUID
          total: Money
          order_date: datetime
          
          def __post_init__(self):
              if not self.event_id:
                  object.__setattr__(self, 'event_id', uuid4())
              if not self.occurred_on:
                  object.__setattr__(self, 'occurred_on', datetime.utcnow())
                  
  naming_conventions:
    - pattern: "Past Tense"
      examples:
        - "OrderPlaced (not PlaceOrder)"
        - "PaymentProcessed (not ProcessPayment)"
        - "InventoryReserved (not ReserveInventory)"
        
    - pattern: "Domain Language"
      guideline: "Use ubiquitous language from domain"
      examples:
        - "Good: CustomerRegistered, ProductAddedToCatalog"
        - "Bad: UserCreated, ItemInserted (technical terms)"
        
    - pattern: "Specific Over Generic"
      examples:
        - "Good: PremiumSubscriptionActivated"
        - "Bad: SubscriptionChanged"

# =============================================================================
# IMPLEMENTING DOMAIN EVENTS
# =============================================================================

implementing_domain_events:
  description: "Patterns for generating, collecting, and dispatching domain events"
  
  aggregate_event_collection:
    description: "Aggregates collect events during state changes"
    
    implementation: |
      public abstract class AggregateRoot : Entity {
          private readonly List<DomainEvent> _domainEvents = new();
          
          public IReadOnlyList<DomainEvent> DomainEvents => _domainEvents.AsReadOnly();
          
          protected void AddDomainEvent(DomainEvent eventItem) {
              _domainEvents.Add(eventItem);
          }
          
          public void ClearDomainEvents() {
              _domainEvents.Clear();
          }
      }
      
      // Usage in aggregate
      public class Order : AggregateRoot {
          public void Confirm() {
              if (Status != OrderStatus.Pending)
                  throw new DomainException("Only pending orders can be confirmed");
              
              Status = OrderStatus.Confirmed;
              
              // Add domain event
              AddDomainEvent(new OrderConfirmed(Id, Total, DateTime.UtcNow));
          }
      }
      
  event_dispatch_strategies:
    - strategy: "Immediate Dispatch"
      description: "Dispatch events immediately after aggregate method"
      
      pros:
        - "Simple implementation"
        - "Immediate feedback"
        
      cons:
        - "Events dispatched even if save fails"
        - "No transactional guarantee"
        
      implementation: |
        public class OrderService {
            public void ConfirmOrder(Guid orderId) {
                var order = _repository.GetById(orderId);
                order.Confirm();
                
                // Dispatch immediately
                foreach (var @event in order.DomainEvents) {
                    _eventBus.Publish(@event);
                }
                
                _repository.Save(order);  // What if this fails?
            }
        }
        
    - strategy: "Deferred Dispatch (After Save)"
      description: "Dispatch events after successful persistence"
      
      pros:
        - "Events only dispatched if save succeeds"
        - "Transactional consistency"
        
      cons:
        - "Event handlers not in same transaction"
        
      implementation: |
        public class OrderRepository : IOrderRepository {
            public async Task SaveAsync(Order order) {
                // Save aggregate
                await _context.SaveChangesAsync();
                
                // Dispatch events after successful save
                var events = order.DomainEvents.ToList();
                order.ClearDomainEvents();
                
                foreach (var @event in events) {
                    await _eventBus.PublishAsync(@event);
                }
            }
        }
        
    - strategy: "Outbox Pattern"
      description: "Save events to database, dispatch later"
      
      pros:
        - "Guaranteed delivery"
        - "Transactional consistency"
        - "Handles failures gracefully"
        
      cons:
        - "More complex"
        - "Eventual consistency"
        
      implementation: |
        public class OrderRepository : IOrderRepository {
            public async Task SaveAsync(Order order) {
                using var transaction = await _context.Database.BeginTransactionAsync();
                
                try {
                    // Save aggregate
                    _context.Orders.Update(order);
                    
                    // Save events to outbox table
                    foreach (var @event in order.DomainEvents) {
                        _context.OutboxEvents.Add(new OutboxEvent {
                            EventId = @event.EventId,
                            EventType = @event.GetType().Name,
                            EventData = JsonSerializer.Serialize(@event),
                            CreatedAt = DateTime.UtcNow,
                            Processed = false
                        });
                    }
                    
                    await _context.SaveChangesAsync();
                    await transaction.CommitAsync();
                    
                    order.ClearDomainEvents();
                } catch {
                    await transaction.RollbackAsync();
                    throw;
                }
            }
        }
        
        // Background worker processes outbox
        public class OutboxProcessor : BackgroundService {
            protected override async Task ExecuteAsync(CancellationToken stoppingToken) {
                while (!stoppingToken.IsCancellationRequested) {
                    var pendingEvents = await _context.OutboxEvents
                        .Where(e => !e.Processed)
                        .Take(100)
                        .ToListAsync();
                    
                    foreach (var outboxEvent in pendingEvents) {
                        try {
                            var @event = DeserializeEvent(outboxEvent);
                            await _eventBus.PublishAsync(@event);
                            
                            outboxEvent.Processed = true;
                            outboxEvent.ProcessedAt = DateTime.UtcNow;
                        } catch (Exception ex) {
                            outboxEvent.RetryCount++;
                            outboxEvent.LastError = ex.Message;
                        }
                    }
                    
                    await _context.SaveChangesAsync();
                    await Task.Delay(TimeSpan.FromSeconds(5), stoppingToken);
                }
            }
        }

# =============================================================================
# EVENT HANDLERS
# =============================================================================

event_handlers:
  description: "Subscribing to and handling domain events"
  
  handler_design:
    - principle: "Single Responsibility"
      description: "One handler per side effect"
      rationale: "Easier to test, modify, disable"
      
    - principle: "Idempotent"
      description: "Safe to handle same event multiple times"
      rationale: "Events may be delivered multiple times"
      
    - principle: "Fast Execution"
      description: "Don't block event processing"
      guideline: "Queue long-running work"
      
  implementation_mediator:
    description: "Using MediatR for in-process event handling"
    
    example: |
      // Event handler
      public class SendOrderConfirmationEmailHandler 
          : INotificationHandler<OrderConfirmed> 
      {
          private readonly IEmailService _emailService;
          private readonly ICustomerRepository _customerRepo;
          
          public async Task Handle(OrderConfirmed notification, CancellationToken cancellationToken) {
              // Idempotency check
              if (await _emailService.WasEmailSent(notification.OrderId))
                  return;
              
              var customer = await _customerRepo.GetByIdAsync(notification.CustomerId);
              
              await _emailService.SendAsync(new Email {
                  To = customer.Email,
                  Subject = "Order Confirmed",
                  Body = $"Your order #{notification.OrderId} has been confirmed. Total: {notification.Total}"
              });
          }
      }
      
      // Multiple handlers for same event
      public class ReserveInventoryHandler : INotificationHandler<OrderConfirmed> {
          public async Task Handle(OrderConfirmed notification, CancellationToken cancellationToken) {
              // Publish integration event to Inventory context
              await _eventBus.PublishAsync(new InventoryReservationRequested(
                  notification.OrderId,
                  notification.Items
              ));
          }
      }
      
  implementation_message_broker:
    description: "Using message broker for cross-context events"
    
    kafka_example: |
      from kafka import KafkaProducer, KafkaConsumer
      import json
      
      # Producer (Order context)
      producer = KafkaProducer(
          bootstrap_servers=['localhost:9092'],
          value_serializer=lambda v: json.dumps(v).encode('utf-8')
      )
      
      # Publish domain event
      order_placed = {
          'event_type': 'OrderPlaced',
          'order_id': str(order.id),
          'customer_id': str(order.customer_id),
          'total': float(order.total.amount),
          'occurred_on': datetime.utcnow().isoformat()
      }
      
      producer.send('order-events', value=order_placed)
      
      # Consumer (Fulfillment context)
      consumer = KafkaConsumer(
          'order-events',
          bootstrap_servers=['localhost:9092'],
          group_id='fulfillment-service',
          value_deserializer=lambda m: json.loads(m.decode('utf-8'))
      )
      
      for message in consumer:
          event = message.value
          if event['event_type'] == 'OrderPlaced':
              create_shipment(event['order_id'])

# =============================================================================
# EVENT SOURCING
# =============================================================================

event_sourcing:
  description: "Store all state changes as sequence of events, derive state by replaying"
  
  concept:
    traditional: "Store current state in database"
    event_sourcing: "Store all events, rebuild state from events"
    
  benefits:
    - "Complete audit trail"
    - "Temporal queries (state at any point in time)"
    - "Event replay for debugging"
    - "New projections from existing events"
    - "Natural fit for event-driven architecture"
    
  costs:
    - "Increased complexity"
    - "Event versioning challenges"
    - "Query performance (must rebuild state)"
    - "Storage overhead (all events)"
    
  when_to_use:
    - "Audit trail critical (financial, healthcare)"
    - "Temporal queries needed (analytics, compliance)"
    - "Event-driven architecture"
    - "Undo/replay functionality"
    
  implementation:
    event_store: |
      // Event store interface
      public interface IEventStore {
          Task SaveEventsAsync(Guid aggregateId, IEnumerable<DomainEvent> events, int expectedVersion);
          Task<IEnumerable<DomainEvent>> GetEventsAsync(Guid aggregateId);
      }
      
      // Aggregate base for event sourcing
      public abstract class EventSourcedAggregate : AggregateRoot {
          public int Version { get; private set; }
          private readonly List<DomainEvent> _uncommittedEvents = new();
          
          public IEnumerable<DomainEvent> GetUncommittedEvents() => _uncommittedEvents;
          
          public void MarkEventsAsCommitted() {
              _uncommittedEvents.Clear();
          }
          
          protected void ApplyEvent(DomainEvent @event) {
              ApplyChange(@event, isNew: true);
          }
          
          private void ApplyChange(DomainEvent @event, bool isNew) {
              // Use reflection to call appropriate When() method
              this.GetType()
                  .GetMethod("When", new[] { @event.GetType() })
                  ?.Invoke(this, new object[] { @event });
              
              if (isNew) {
                  _uncommittedEvents.Add(@event);
              }
          }
          
          public void LoadFromHistory(IEnumerable<DomainEvent> history) {
              foreach (var @event in history) {
                  ApplyChange(@event, isNew: false);
                  Version++;
              }
          }
      }
      
    aggregate_example: |
      public class BankAccount : EventSourcedAggregate {
          public Guid AccountId { get; private set; }
          public decimal Balance { get; private set; }
          public AccountStatus Status { get; private set; }
          
          // Event application methods
          private void When(AccountOpened @event) {
              AccountId = @event.AccountId;
              Balance = @event.InitialBalance;
              Status = AccountStatus.Active;
          }
          
          private void When(MoneyDeposited @event) {
              Balance += @event.Amount;
          }
          
          private void When(MoneyWithdrawn @event) {
              Balance -= @event.Amount;
          }
          
          private void When(AccountClosed @event) {
              Status = AccountStatus.Closed;
          }
          
          // Commands generate events
          public static BankAccount Open(Guid accountId, decimal initialBalance) {
              var account = new BankAccount();
              account.ApplyEvent(new AccountOpened(accountId, initialBalance));
              return account;
          }
          
          public void Deposit(decimal amount) {
              if (Status != AccountStatus.Active)
                  throw new DomainException("Cannot deposit to inactive account");
              
              if (amount <= 0)
                  throw new DomainException("Amount must be positive");
              
              ApplyEvent(new MoneyDeposited(AccountId, amount));
          }
          
          public void Withdraw(decimal amount) {
              if (Status != AccountStatus.Active)
                  throw new DomainException("Cannot withdraw from inactive account");
              
              if (amount <= 0)
                  throw new DomainException("Amount must be positive");
              
              if (Balance < amount)
                  throw new DomainException("Insufficient funds");
              
              ApplyEvent(new MoneyWithdrawn(AccountId, amount));
          }
      }
      
    repository: |
      public class EventSourcedRepository<T> where T : EventSourcedAggregate {
          private readonly IEventStore _eventStore;
          
          public async Task<T> GetByIdAsync(Guid id) {
              var events = await _eventStore.GetEventsAsync(id);
              
              if (!events.Any())
                  return null;
              
              var aggregate = (T)Activator.CreateInstance(typeof(T), true);
              aggregate.LoadFromHistory(events);
              
              return aggregate;
          }
          
          public async Task SaveAsync(T aggregate) {
              var uncommittedEvents = aggregate.GetUncommittedEvents();
              await _eventStore.SaveEventsAsync(
                  aggregate.Id,
                  uncommittedEvents,
                  aggregate.Version
              );
              
              aggregate.MarkEventsAsCommitted();
          }
      }
      
  snapshots:
    description: "Periodic state snapshot to avoid replaying all events"
    
    rationale: "Replaying 1M events slow - snapshot every 100 events"
    
    implementation: |
      public class SnapshotRepository {
          public async Task<Snapshot> GetLatestSnapshotAsync(Guid aggregateId) {
              return await _context.Snapshots
                  .Where(s => s.AggregateId == aggregateId)
                  .OrderByDescending(s => s.Version)
                  .FirstOrDefaultAsync();
          }
          
          public async Task SaveSnapshotAsync(Snapshot snapshot) {
              _context.Snapshots.Add(snapshot);
              await _context.SaveChangesAsync();
          }
      }
      
      // Load with snapshot
      public async Task<T> GetByIdAsync(Guid id) {
          var snapshot = await _snapshotRepo.GetLatestSnapshotAsync(id);
          
          T aggregate;
          int version;
          
          if (snapshot != null) {
              aggregate = DeserializeSnapshot<T>(snapshot.Data);
              version = snapshot.Version;
          } else {
              aggregate = (T)Activator.CreateInstance(typeof(T), true);
              version = 0;
          }
          
          // Load events since snapshot
          var events = await _eventStore.GetEventsAsync(id, fromVersion: version);
          aggregate.LoadFromHistory(events);
          
          return aggregate;
      }

# =============================================================================
# CQRS (COMMAND QUERY RESPONSIBILITY SEGREGATION)
# =============================================================================

cqrs:
  description: "Separate read and write models"
  
  concept:
    traditional: "Same model for reads and writes"
    cqrs: "Separate command model (write) and query model (read)"
    
  benefits:
    - "Optimize reads and writes independently"
    - "Scale reads and writes separately"
    - "Simpler models (single purpose)"
    - "Better performance"
    - "Natural fit with event sourcing"
    
  levels:
    - level: "CQRS Lite"
      description: "Separate read/write methods, same database"
      complexity: "LOW"
      example: "Different classes for commands and queries"
      
    - level: "CQRS with Read Models"
      description: "Separate read models (projections), same database"
      complexity: "MEDIUM"
      example: "Write to normalized tables, read from denormalized views"
      
    - level: "CQRS with Separate Stores"
      description: "Different databases for reads and writes"
      complexity: "HIGH"
      example: "Write to SQL, read from Elasticsearch"
      
  implementation:
    commands: |
      // Commands (write operations)
      public class CreateOrderCommand {
          public Guid CustomerId { get; }
          public List<OrderItemDto> Items { get; }
      }
      
      public class CreateOrderCommandHandler {
          private readonly IOrderRepository _repository;
          
          public async Task<Guid> Handle(CreateOrderCommand command) {
              var order = Order.Create(command.CustomerId);
              
              foreach (var item in command.Items) {
                  order.AddItem(item.ProductId, item.Quantity, item.UnitPrice);
              }
              
              await _repository.SaveAsync(order);
              return order.Id;
          }
      }
      
    queries: |
      // Queries (read operations)
      public class GetOrderQuery {
          public Guid OrderId { get; }
      }
      
      public class GetOrderQueryHandler {
          private readonly AppDbContext _context;
          
          public async Task<OrderDto> Handle(GetOrderQuery query) {
              // Read from denormalized view
              return await _context.OrderViews
                  .Where(o => o.OrderId == query.OrderId)
                  .Select(o => new OrderDto {
                      OrderId = o.OrderId,
                      CustomerName = o.CustomerName,
                      Total = o.Total,
                      Items = o.Items
                  })
                  .FirstOrDefaultAsync();
          }
      }
      
    projections: |
      // Event handler builds read model
      public class OrderViewProjection : INotificationHandler<OrderPlaced> {
          private readonly AppDbContext _context;
          
          public async Task Handle(OrderPlaced @event) {
              var orderView = new OrderView {
                  OrderId = @event.OrderId,
                  CustomerId = @event.CustomerId,
                  CustomerName = await GetCustomerName(@event.CustomerId),
                  Total = @event.Total,
                  OrderDate = @event.OrderDate,
                  Status = "Placed"
              };
              
              _context.OrderViews.Add(orderView);
              await _context.SaveChangesAsync();
          }
      }

# =============================================================================
# SAGAS (PROCESS MANAGERS)
# =============================================================================

sagas:
  description: "Coordinate long-running business processes across aggregates/contexts"
  
  purpose:
    - "Manage distributed transactions"
    - "Coordinate multiple aggregates"
    - "Handle failures and compensations"
    - "Maintain process state"
    
  types:
    - type: "Choreography"
      description: "Each service listens to events and reacts"
      pros:
        - "No central coordinator"
        - "Simple for linear flows"
      cons:
        - "Hard to understand overall flow"
        - "Difficult to manage failures"
      example: |
        OrderPlaced ΓåÆ (Payment listens) ΓåÆ PaymentProcessed ΓåÆ 
        (Inventory listens) ΓåÆ InventoryReserved ΓåÆ (Shipping listens) ΓåÆ Shipped
        
    - type: "Orchestration"
      description: "Central saga coordinates all steps"
      pros:
        - "Clear process flow"
        - "Easier error handling"
        - "Centralized compensation logic"
      cons:
        - "Single point of failure"
        - "More complex implementation"
      example: |
        OrderSaga coordinates:
        1. Process payment
        2. Reserve inventory
        3. Create shipment
        
  orchestration_implementation:
    saga_state: |
      public class OrderFulfillmentSaga {
          public Guid SagaId { get; private set; }
          public Guid OrderId { get; private set; }
          public SagaState State { get; private set; }
          public PaymentResult Payment { get; private set; }
          public ReservationResult Inventory { get; private set; }
          
          public enum SagaState {
              Started,
              PaymentProcessed,
              InventoryReserved,
              ShipmentCreated,
              Completed,
              Failed
          }
          
          public void Start(Guid orderId) {
              SagaId = Guid.NewGuid();
              OrderId = orderId;
              State = SagaState.Started;
              
              // Send command to payment service
              SendCommand(new ProcessPayment(orderId));
          }
          
          public void Handle(PaymentProcessed @event) {
              Payment = @event.Result;
              State = SagaState.PaymentProcessed;
              
              // Send command to inventory service
              SendCommand(new ReserveInventory(OrderId, @event.Items));
          }
          
          public void Handle(InventoryReserved @event) {
              Inventory = @event.Result;
              State = SagaState.InventoryReserved;
              
              // Send command to shipping service
              SendCommand(new CreateShipment(OrderId, @event.ReservationId));
          }
          
          public void Handle(ShipmentCreated @event) {
              State = SagaState.Completed;
          }
          
          // Compensating transactions
          public void Handle(PaymentFailed @event) {
              State = SagaState.Failed;
              // No compensation needed - payment never happened
          }
          
          public void Handle(InventoryReservationFailed @event) {
              State = SagaState.Failed;
              
              // Compensate: Refund payment
              SendCommand(new RefundPayment(OrderId, Payment.TransactionId));
          }
          
          public void Handle(ShipmentCreationFailed @event) {
              State = SagaState.Failed;
              
              // Compensate: Release inventory and refund payment
              SendCommand(new ReleaseInventory(OrderId, Inventory.ReservationId));
              SendCommand(new RefundPayment(OrderId, Payment.TransactionId));
          }
      }

# =============================================================================
# EVENT VERSIONING
# =============================================================================

event_versioning:
  description: "Handling event schema changes over time"
  
  strategies:
    - strategy: "Upcasting"
      description: "Convert old events to new format when loading"
      
      example: |
        // V1 event
        public class OrderPlacedV1 {
            public Guid OrderId { get; set; }
            public decimal Total { get; set; }
        }
        
        // V2 event (added currency)
        public class OrderPlacedV2 {
            public Guid OrderId { get; set; }
            public Money Total { get; set; }  // Money includes currency
        }
        
        // Upcaster
        public class OrderPlacedUpcaster : IEventUpcaster {
            public DomainEvent Upcast(DomainEvent @event) {
                if (@event is OrderPlacedV1 v1) {
                    return new OrderPlacedV2 {
                        OrderId = v1.OrderId,
                        Total = new Money(v1.Total, "USD")  // Default to USD
                    };
                }
                return @event;
            }
        }
        
    - strategy: "Version Field"
      description: "Include version in event, handle multiple versions"
      
      example: |
        public class OrderPlaced {
            public int Version { get; set; }
            public Guid OrderId { get; set; }
            public object Total { get; set; }  // Decimal (V1) or Money (V2)
        }
        
        // Handler supports multiple versions
        public void When(OrderPlaced @event) {
            if (@event.Version == 1) {
                Balance = (decimal)@event.Total;
            } else if (@event.Version == 2) {
                Balance = ((Money)@event.Total).Amount;
            }
        }
        
    - strategy: "Weak Schema"
      description: "Use dynamic types, add optional fields"
      
      example: |
        // Use JSON with optional fields
        {
          "eventType": "OrderPlaced",
          "orderId": "123",
          "total": 100.00,
          "currency": "USD"  // Optional, added in V2
        }

# =============================================================================
# BEST PRACTICES
# =============================================================================

best_practices:
  - practice: "Events are Immutable"
    rationale: "What happened cannot be changed"
    guideline: "No setters, only constructor"
    
  - practice: "Events Record the Past"
    rationale: "Name events in past tense"
    examples: "OrderPlaced, PaymentProcessed, ItemShipped"
    
  - practice: "Include Relevant Data"
    rationale: "Consumers shouldn't need to query for more info"
    guideline: "Include what consumers need, not everything"
    
  - practice: "Use Idempotent Handlers"
    rationale: "Events may be delivered multiple times"
    implementation: "Check if already processed before handling"
    
  - practice: "Version Events from Day One"
    rationale: "Events will evolve"
    approach: "Include version field or use separate event types"
    
  - practice: "Eventual Consistency is OK"
    rationale: "Most business processes are async anyway"
    example: "Order placed ΓåÆ email sent (seconds later is fine)"
    
  - practice: "Use Outbox for Reliability"
    rationale: "Guarantees event delivery"
    tradeoff: "More complexity, eventual consistency"
    
  - practice: "Don't Use Events for Queries"
    rationale: "Events for notifications, not data retrieval"
    alternative: "Use direct API calls or read models"

# =============================================================================
# ANTI-PATTERNS
# =============================================================================

anti_patterns:
  - name: "Event as Command"
    description: "Using events to tell other systems what to do"
    
    bad_example: "SendEmailToCustomer (command, not event)"
    good_example: "OrderPlaced (event) ΓåÆ handler decides to send email"
    
    problem: "Couples publisher to consumer's actions"
    
  - name: "Fat Events"
    description: "Including too much data in events"
    
    problem: "Large payload, coupling to internal data structures"
    guideline: "Include only what consumers need"
    
  - name: "Event Chain Hell"
    description: "Long chains of events triggering events"
    
    symptom: "Event A ΓåÆ Event B ΓåÆ Event C ΓåÆ Event D ΓåÆ ..."
    problem: "Hard to understand, debug, maintain"
    solution: "Use saga to orchestrate complex workflows"
    
  - name: "Using Events for Synchronous Operations"
    description: "Using events when direct call better"
    
    example: "Bad: Publish ValidateOrderEvent to get validation result"
    alternative: "Good: Call validation service directly"
    
    guideline: "Events for async notifications, direct calls for queries"
