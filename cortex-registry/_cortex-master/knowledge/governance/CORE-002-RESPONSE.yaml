---
# CORE-002-RESPONSE: Response-Level Markdown Prevention Rule
# ============================================================================
# Authority: CORTEX Inline-First Architecture (Response-Level Gate)
# Phase: CORTEX Architecture Enhancement
# Component: ResponseContentValidationAgent (EnforcementOrchestrator)
# 
# Purpose: Prevents markdown file suggestions from appearing in chat responses
# to Copilot Chat users. Complements CORE-002 (output_files validation) with
# response text validation.
#
# Enforcement Level: BLOCKING (immediately transforms response to inline)
# Coverage: 100% of responses to Copilot Chat
#
# Created: 2026-02-13
# Modified: 2026-02-13
# ============================================================================

rule_id: "CORE-002-RESPONSE"
title: "No markdown file suggestions in responses"
description: |
  Responses must NEVER suggest creating markdown files. All findings, analyses,
  reports, and documentation must be displayed inline in Copilot Chat.
  
  This rule complements CORE-002 by validating response TEXT (not just output_files).
  It catches suggestions like "save this as file.md" or "create_file(...).md" 
  in response text to users.
  
  When violations detected:
  1. Log violation with AC markers
  2. Transform response to suggest inline display
  3. Continue execution (non-blocking, transformative)

severity: "BLOCKING"
tier: 0
category: "inline-first-architecture"

patterns:
  # Terminal/shell patterns
  - pattern: "cat\\s*>\\s*[^\\s]+\\.md"
    description: "cat > file.md redirection"
    replacement: "Display the content inline in this chat"
  
  - pattern: "cat\\s*>>\\s*[^\\s]+\\.md"
    description: "cat >> file.md append redirection"
    replacement: "Display the content inline in this chat"
  
  - pattern: "echo\\s+.+>\\s*[^\\s]+\\.md"
    description: "echo ... > file.md"
    replacement: "Display the output inline in this chat"
  
  - pattern: "printf\\s+.+>\\s*[^\\s]+\\.md"
    description: "printf ... > file.md"
    replacement: "Display the output inline in this chat"
  
  # Tool/code patterns
  - pattern: "create_file\\s*\\(\\s*['\\\"][^'\\\"]*\\.md['\\\"]"
    description: "create_file with .md file"
    replacement: "Display inline instead of creating files"
  
  - pattern: "create\\s+.*\\.md.*file"
    description: "create markdown file"
    replacement: "Display the result inline"
  
  # Natural language patterns
  - pattern: "generate.*markdown.*report"
    description: "generate markdown report suggestion"
    replacement: "Display findings as markdown table inline"
  
  - pattern: "save\\s+.*as\\s+.*\\.md"
    description: "save as file.md suggestion"
    replacement: "Display inline; user can save chat transcript if needed"
  
  - pattern: "write\\s+.*to\\s+.*\\.md"
    description: "write to file.md suggestion"
    replacement: "Display inline instead"
  
  - pattern: "output\\s+.*to\\s+.*\\.md"
    description: "output to file.md suggestion"
    replacement: "Display inline instead"
  
  - pattern: "generated?\\s+.*\\.md.*file"
    description: "generated .md file suggestion"
    replacement: "Display inline without creating files"

allowed_exceptions:
  # These paths are ALLOWED to reference in file suggestions
  - ".github/prompts/"
    description: "Prompt file updates (DESIGN mode)"
  
  - ".github/agents/"
    description: "Agent specification updates"
  
  - "README.md"
    description: "Root repository README only (exact path)"

enforcement_behavior:
  type: "transformative"
  action_on_violation: "transform_response"
  continues_execution: true
  blocks_execution: false
  log_marker_prefix: "AC-CORE-002-RESPONSE"
  
  transformation_strategy:
    method: "regex_replacement"
    description: "Replace file suggestions with inline alternatives"
    examples:
      - from: "create_file('analysis.md', content)"
        to: "Display the analysis inline in this chat"
      
      - from: "save this as metrics-report.md"
        to: "Display the metrics inline; user can save chat transcript"
      
      - from: "generate a comprehensive markdown report"
        to: "Display findings using markdown table format in chat"

integration:
  orchestrator: "EnforcementOrchestrator"
  agent_class: "ResponseContentValidationAgent"
  validation_method: "validate_response_content(response_text, allow_markdown=False)"
  hook_point: "MasterOrchestrator.get_response_with_headers()"
  execution_order: "After response policies, before header injection"
  
  method_signatures:
    validate:
      params:
        - name: "context"
          type: "Dict[str, Any]"
          required_keys:
            - "response_text"
          optional_keys:
            - "allow_markdown_suggestions"
      returns: "EnforcementResult (level, violations, warnings, metadata)"
    
    transform:
      params:
        - name: "response_text"
          type: "str"
      returns: "str (transformed response)"

audit_trail:
  success_case:
    ac_marker: "AC-CORE-002-RESPONSE-001"
    operation: "RESPONSE_CONTENT_VALIDATION_PASSED"
    details:
      message: "Response is inline-first compliant"
      patterns_checked: "10"
  
  violation_case:
    ac_marker: "AC-CORE-002-RESPONSE-001"
    operation: "RESPONSE_CONTENT_VIOLATION_DETECTED"
    details:
      violations: "list of detected patterns"
      count: "number of violations"
  
  transformation_case:
    ac_marker: "AC-CORE-002-RESPONSE-002"
    operation: "RESPONSE_TRANSFORMED_TO_INLINE"
    details:
      action: "Replaced file suggestions with inline alternatives"
      original_length: "int"
      transformed_length: "int"

metadata:
  version: "1.0.0"
  authority: "CORTEX Inline-First Architecture"
  phase: "Response-Level Gate Integration"
  implemented_by: "ResponseContentValidationAgent (EnforcementOrchestrator)"
  test_coverage: "Unit tests in tests/unit/governance/enforcement/"
  related_rules:
    - "CORE-002: No markdown file generation (output_files level)"
    - "CORE-049: Silent autonomous execution (no user narration)"
  
  rationale: |
    CORE-002 blocks markdown FILES from being generated/committed. But it doesn't
    catch markdown FILE SUGGESTIONS in response text. This rule closes that gap.
    
    User journey:
    1. User asks for analysis (ANALYZE mode)
    2. Response contains: "Let me create a detailed analysis report..."
    3. CORE-002 blocks: output_files = ["analysis-report.md"]
    4. But response text already says "create a detailed analysis report"
    5. User reads response and tries to run the suggestion manually ❌
    
    This rule prevents step 4: transforms "create" → "display inline"
    
    Result: 100% inline-first architecture across ALL communication layers

examples:
  example_1:
    input_response: |
      "Let me create a comprehensive security audit report for you:
      
      ```bash
      create_file('security-audit-report.md', content)
      ```
      
      Then save this as project-security-audit-2026-02-13.md"
    
    output_response: |
      "Let me provide a comprehensive security audit for you, displayed inline:
      
      Display the audit findings as markdown table inline in this chat
      
      Display the results inline; user can save chat transcript if needed"
    
    violations:
      - "create_file suggestion for .md file"
      - "save as file.md suggestion"
  
  example_2:
    input_response: |
      "I'll generate a detailed analysis report in markdown format for your review."
    
    output_response: |
      "I'll display a detailed analysis using markdown table format inline for your review."
    
    violations:
      - "generate markdown report suggestion"

testing:
  unit_tests:
    - "test_validate_empty_response"
    - "test_validate_response_no_violations"
    - "test_detect_cat_redirection_pattern"
    - "test_detect_create_file_pattern"
    - "test_detect_save_as_pattern"
    - "test_detect_generate_report_pattern"
    - "test_allowed_exceptions_pass_validation"
    - "test_transform_response_cat_pattern"
    - "test_transform_response_create_file_pattern"
    - "test_transform_response_save_as_pattern"
  
  integration_tests:
    - "test_enforcement_orchestrator_includes_agent"
    - "test_master_orchestrator_calls_validation"
    - "test_response_transformation_in_get_response_with_headers"
    - "test_transformation_applied_before_header_injection"
