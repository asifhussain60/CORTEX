# ============================================================================
# STAGE BREAKDOWN
# ============================================================================
stages:
  - stage_id: "S1"
    name: "Scenario Framework & Fixtures"
    duration: "1.5-2 hours"
    tests_target: 10
    description: |
      Build test framework and shared fixtures for E2E scenarios.
      
    deliverables:
      - name: "E2EScenarioFramework"
        file: "tests/e2e/scenario_framework.py"
        description: |
          Base framework for E2E scenario tests.
          - ScenarioRunner: Executes scenarios with event capture
          - EventExpectation: Defines expected event sequences
          - AuditAssertion: Verifies audit trail completeness
          - ReportGenerator: Creates scenario execution reports
          
      - name: "SharedFixtures"
        file: "tests/e2e/conftest.py"
        description: |
          Shared pytest fixtures for all E2E tests.
          - workflow_runtime: Configured WorkflowRuntime
          - event_bus: Clean EventBus instance
          - audit_verifier: AuditVerifier instance
          - mock_orchestrators: Configurable orchestrator mocks

  - stage_id: "S2"
    name: "CORTEX Self-Dev & Production Scenarios"
    duration: "1.5-2 hours"
    tests_target: 20
    description: |
      Implement scenarios 1-20 (Categories 1 & 2).
      
    deliverables:
      - name: "SelfDevScenarios"
        file: "tests/e2e/test_cortex_self_development.py"
        tests: 10
        scenarios: "E2E-001 through E2E-010"
        
      - name: "ProductionScenarios"
        file: "tests/e2e/test_production_repository.py"
        tests: 10
        scenarios: "E2E-011 through E2E-020"

  - stage_id: "S3"
    name: "Cross-Cutting, Security & Edge Cases"
    duration: "1.5-2 hours"
    tests_target: 20
    description: |
      Implement scenarios 21-40 (Categories 3, 4 & 5).
      
    deliverables:
      - name: "CrossCuttingScenarios"
        file: "tests/e2e/test_cross_cutting_concerns.py"
        tests: 10
        scenarios: "E2E-021 through E2E-030"
        
      - name: "SecurityScenarios"
        file: "tests/e2e/test_security_first.py"
        tests: 5
        scenarios: "E2E-031 through E2E-035"
        
      - name: "EdgeCaseScenarios"
        file: "tests/e2e/test_edge_cases_recovery.py"
        tests: 5
        scenarios: "E2E-036 through E2E-040"

# ============================================================================
