    rainy_day: 15  # 37.5%
    
  orchestrator_coverage:
    - IntentRouter: 18 scenarios
    - TDDOrchestrator: 15 scenarios
    - MasterOrchestrator: 12 scenarios
    - CoherenceValidator: 10 scenarios
    - LENSSynthesis: 8 scenarios
    - SecurityAnalyzer: 7 scenarios
    - EnforcementOrchestrator: 6 scenarios
    - WorkflowRuntime: 10 scenarios
    - AuditVerifier: 40 scenarios (all)

# ============================================================================
# EXECUTION COMMANDS
# ============================================================================
execution:
  single_session:
    duration: "4-5 hours"
    token_budget: "<200k"
    command: |
      /implement WAVE-W: E2E Scenario Harness
      
      Authority: WAVE-W-E2E-SCENARIO-HARNESS.yaml
      Mode: Silent autonomous execution
      Tests: 40 target (10 per category, 5 for security, 5 for edge cases)
      Prerequisite: WAVE-V complete
      
      Stages:
      - S1: Framework & Fixtures (10 tests)
      - S2: Self-Dev & Production (20 tests)
      - S3: Cross-Cutting & Security (20 tests)

