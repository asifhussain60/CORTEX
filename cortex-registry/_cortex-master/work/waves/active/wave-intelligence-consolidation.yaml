intelligence_enhancements:
  phase_65_s4:
    description: "Unified Intelligence Provider implementation"
    authority: AC-PHASE65-S4-001
    status: COMPLETE (to be integrated in T1.1)
    components:
      - IIntelligenceProvider abstract interface
      - UnifiedIntelligenceProvider singleton implementation
      - ExecutionTier enum (QUICK/TARGETED/FULL)
      - CacheEntry with TTL (5-minute default)
      - Thread-safe singleton pattern with Lock
      - Single canonical LENSCache (CORE-035)
      - Budget-aware tiered execution
      - Graceful degradation on source failures
    
    integration_points:
      - Audit logging wraps get_context(), synthesize(), quick(), targeted(), full()
      - Session metrics track cumulative intelligence usage
      - AC_START/AC_COMPLETE markers on all operations
      - EnhancedAuditLogger integration from cortex.brain.observability
  
  phase_65_s5:
    description: "Turn-Over-Turn Intelligence Accumulation"
    authority: AC-PHASE65-S5-001
    status: COMPLETE (to be integrated in T1.1)
    components:
      - TurnContext class for session-scoped intelligence
      - _session_profiles storage (session_id → profile)
      - record_intelligence_fetch() for turn tracking
      - get_accumulated_intelligence() for cross-turn synthesis
      - Thread-safe operations with Lock
      - Session cleanup on session_end
    
    integration_points:
      - UnifiedIntelligenceProvider._session_profiles integration
      - get_context() records intelligence fetch in TurnContext
      - synthesize() uses accumulated turn intelligence
      - Audit trail tracks turn-level intelligence accumulation
  
  enh_092_phase_53_3:
    description: "Lifecycle Hook System for Automatic Cleanup"
    authority: ENH-092
    status: COMPLETE (to be integrated in T1.2)
    components:
      - LifecycleHookSystem class
      - CompletionEvent enum (WAVE_COMPLETE, PHASE_COMPLETE, SESSION_END)
      - CompletionContext dataclass
      - register_hook() for event subscription
      - trigger_completion() for event emission
      - _execution_history tracking
      - Default hooks for vacuum orchestration
    
    integration_points:
      - LENS trigger decisions logged as CompletionEvent.LENS_DECISION (NEW)
      - IntentRouter._should_engage_lens() emits lifecycle events
      - Automatic cleanup on wave/phase completion (70% commit overhead reduction)
      - Audit trail integration for LENS engagement tracking
      - MasterOrchestrator._trigger_lifecycle_hooks_sync() integration
  
  lens_orchestrator:
    description: "LENS Code Intelligence Orchestration"
    authority: cortex.lens.orchestrator
    status: PRODUCTION
    components:
      - LENSOrchestrator with tiered API (Phase 20)
      - LENSCache singleton (CORE-035 compliance)
      - ASTAnalyzer, GitHistoryAnalyzer, CommentExtractor
      - ConfigAnalyzer, DatabaseAnalyzer, APIAnalyzer
      - analyze_file() with depth control (shallow/medium/deep)
      - Cache with 5-minute TTL
    
    integration_points:
      - UnifiedIntelligenceProvider._ensure_lens_orchestrator() lazy loading
      - get_lens_analysis() for LENS data retrieval
      - IntentRouter._should_engage_lens() for trigger decisions
      - Lifecycle hooks log LENS invocations
  
  enhanced_audit_logger:
    description: "Searchable, Queryable Audit Trail"
    authority: cortex.brain.observability.audit_trail
    status: PRODUCTION
    components:
      - AuditTrail class with SQLite persistence
      - AuditEvent dataclass with full context
      - AuditEventType, AuditSeverity enums
      - RetentionPolicy for automatic cleanup
      - search() with filters (event_type, component, date range)
      - export() to JSON/CSV
      - Thread-safe with Lock
    
    integration_points:
      - get_audit_trail() singleton pattern
      - UnifiedIntelligenceProvider uses for AC markers
      - IntentRouter uses for LENS trigger logging
      - record_event() wraps all intelligence operations
      - Searchable by session_id, operation_id, component

# ============================================================================
# TRACK 1: Intelligence Enhancements (PARALLEL - 3.5 hours)
# ============================================================================

track_1:
  name: Intelligence Layer Enhancements
  execution: parallel
  duration_hours: 3.5
  dependencies: []
  
  tasks:
    - task_id: T1.1
      name: Intelligence Audit Trail + Phase 65 Integration
      duration_hours: 1.5
      priority: P0
      
      description: |
        Add EnhancedAuditLogger to UnifiedIntelligenceProvider for full
        traceability of every intelligence decision (LENS invoked, rules
        cited, synthesis duration, cache hits, tier executed).
        
        Integrate Phase 65 S4/S5 enhancements:
        - Session-scoped profile storage (_session_profiles)
        - TurnContext integration for turn-over-turn accumulation
        - Tiered execution budget tracking (quick/targeted/full)
        - Graceful degradation with fallback logging
      
      files_modified:
        - cortex/intelligence/provider.py  # Add audit logging hooks
        - cortex/intelligence/__init__.py  # Export new audit types
        - cortex/intelligence/turn_context.py  # Integrate with provider
      
      files_created:
        - tests/unit/intelligence/test_audit_trail_integration.py
        - cortex/intelligence/audit_integration.py  # Audit bridge module
      
      implementation_steps:
        1_setup:
          - Import EnhancedAuditLogger from cortex.brain.observability.audit_trail
          - Add self.audit_logger to __init__ (use get_audit_trail() singleton)
          - Add self._session_metrics tracking dict
          - Import TurnContext for turn-over-turn tracking
        
        2_context_audit:
          - Wrap get_context() with AC_START/AC_COMPLETE
          - Log: intent, tier, duration_ms, lens_invoked, rules_cited
          - Track cumulative session metrics
          - Integrate TurnContext.record_intelligence_fetch()
        
        3_synthesis_audit:
          - Wrap synthesize() with AC_START/AC_COMPLETE
          - Log: sources (LENS/company/CORTEX), precedence resolution
          - Track synthesis complexity score
          - Record in TurnContext for accumulation
        
        4_tier_execution_audit:
          - Add logging to quick() / targeted() / full() methods
          - Log tier-specific metrics (cache hit rate, fetch count)
          - Track escalation path (quick → targeted → full)
          - Record budget consumption per tier
        
        5_phase_65_integration:
          - Integrate _session_profiles with audit logging
          - Connect TurnContext to audit trail
          - Add fallback logging for graceful degradation
          - Test session-scoped intelligence accumulation
      
      tests:
        file: tests/unit/intelligence/test_audit_trail_integration.py
        count: 24
        coverage:
          # Happy Path (5 tests, was 4)
          - Test audit logging on successful intelligence fetch
          - Test audit logging on cache hit
          - Test AC markers in log output (AC_START → AC_COMPLETE)
          - Test session metrics accumulation
          - Test TurnContext integration for turn-over-turn tracking
          
          # Failure Scenarios (5 tests)
          - Test audit logging on synthesis failure (exception handling)
          - Test audit logging on LENS timeout (>10s)
          - Test audit logging on partial failure (LENS fails, CORTEX succeeds)
          - Test audit logging on cascade failure (LENS → KG → Profile all fail)
          - Test audit logging when audit logger itself fails (meta-failure)
          
          # Concurrency & Performance (5 tests, was 4)
          - Test concurrent request logging (race conditions)
          - Test thread-safe session metrics updates
          - Test audit log performance (<5ms overhead verified)
          - Test high-throughput logging (1000 ops/sec sustained)
          - Test TurnContext thread safety with concurrent turns
          
          # Edge Cases (5 tests, was 4)
          - Test tier escalation logging (quick → targeted → full)
          - Test audit log queryability by session_id
          - Test audit log queryability by operation_id
          - Test audit log rotation (10MB limit, auto-archive)
          - Test session profile storage with audit trail
          
          # Boundary Conditions & Phase 65 (4 tests, was 3)
          - Test empty session_id handling (generate UUID)
          - Test null/None intelligence context (graceful degradation)
          - Test extremely long session (>1000 operations, memory leak check)
          - Test turn-over-turn accumulation across multiple requests
      
      acceptance_criteria:
        - Every intelligence operation has AC_START → AC_COMPLETE
        - Logs include: timestamp, duration, tier, rules_cited, cache_status
        - Session metrics track cumulative intelligence usage
        - Audit logs queryable by session_id or operation_id
        - Zero performance regression (<5ms overhead)
        - Phase 65 S4/S5 enhancements integrated (session profiles, turn context)
        - TurnContext supporting turn-over-turn accumulation
        - Graceful degradation on audit logger failure
      
      dependencies: []
      blocks: [T2.1, T2.2]
    
    - task_id: T1.2
      name: LENS Trigger Extraction + Lifecycle Hook Integration
      duration_hours: 1.5
      priority: P0
      
      description: |
        Extract LENS engagement logic from IntentRouter into public
        extensible method. Allows custom LENS triggering rules per
        domain/company without modifying IntentRouter internals.
        
        Integrate with LifecycleHookSystem (ENH-092 Phase 53.3):
        - LENS trigger decisions logged via lifecycle hooks
        - Automatic cleanup on phase/wave completion
        - Event-driven LENS trigger auditing
      
      files_modified:
        - cortex/orchestrators/core/intent_router.py
        - cortex/orchestrators/core/__init__.py
        - cortex/orchestrators/core/lifecycle_hook_system.py  # Add LENS audit hooks
      
      files_created:
        - tests/unit/orchestrators/test_lens_triggers_lifecycle.py
        - cortex/orchestrators/core/lens_trigger_policy.py
        - cortex/orchestrators/core/lens_audit_hooks.py  # Lifecycle integration
      
      implementation_steps:
        1_extract_method:
          - Create _should_engage_lens() method in IntentRouter
          - Parameters: intent, file_path, context
          - Returns: bool (engage LENS or skip)
          - Document extension points for subclasses
        
        2_refactor_route_with_lens_auto_fetch:
          - Replace hardcoded conditions with _should_engage_lens()
          - Preserve existing behavior (IMPLEMENT/FIX/REFACTOR/ANALYZE)
          - Add debug logging for LENS engagement decisions
        
        3_create_policy_interface:
          - Create LENSTriggerPolicy abstract class
          - Define should_trigger(intent, context) interface
          - Implement DefaultPolicy (current behavior)
          - Implement NeverPolicy (for testing)
          - Implement AlwaysPolicy (for debugging)
        
        4_wire_policy_injection:
          - Add lens_trigger_policy parameter to IntentRouter.__init__
          - Default to DefaultPolicy (backward compatible)
          - Document how to inject custom policies
        
        5_lifecycle_hook_integration:
          - Wire LENS trigger decisions to LifecycleHookSystem
          - Register CompletionEvent.LENS_DECISION hook
          - Log LENS engagement/skip decisions to audit trail
          - Connect to automatic cleanup on wave/phase completion
      
      tests:
        file: tests/unit/orchestrators/test_lens_triggers_lifecycle.py
        count: 28
        coverage:
          # Basic Triggers (5 tests)
          - Test LENS engaged for IMPLEMENT intent + file_path
          - Test LENS skipped for QUERY intent
          - Test LENS skipped for LIST intent
          - Test LENS skipped when file_path=None
          - Test LENS engaged for AUDIT intent (always)
          
          # Policy Injection (4 tests)
          - Test custom policy injection via constructor
          - Test NeverPolicy skips all LENS (testing mode)
          - Test AlwaysPolicy engages all LENS (debugging mode)
          - Test backward compatibility (no policy = DefaultPolicy)
          
          # Edge Cases (6 tests)
          - Test LENS trigger with empty file_path string
          - Test LENS trigger with nonexistent file_path
          - Test LENS trigger with binary file (non-code)
          - Test LENS trigger with extremely large file (>10MB)
          - Test LENS trigger with circular symlink
          - Test LENS trigger with permission denied file
          
          # Concurrency (3 tests)
          - Test concurrent policy evaluation (thread-safe)
          - Test policy decision caching (avoid re-evaluation)
          - Test cache invalidation on policy change
          
          # Failure Modes (4 tests)
          - Test policy exception handling (fallback to DefaultPolicy)
          - Test malformed context handling (missing keys)
          - Test policy decision logging includes reasoning
          - Test policy timeout (>5s = skip LENS)
          
          # Integration (3 tests, was 2)
          - Test LENS trigger respects MCP gate (no bypass)
          - Test LENS trigger metrics tracking (engagement rate)
          - Test LENS decision audit via lifecycle hooks
          
          # Lifecycle Hook Integration (3 tests, NEW)
          - Test LENS engagement logged to LifecycleHookSystem
          - Test automatic cleanup on wave/phase completion
          - Test LENS decision audit trail queryable
      
      acceptance_criteria:
        - _should_engage_lens() method public and documented
        - Existing behavior preserved (no regression)
        - Custom policies injectable via constructor
        - 70% reduction in LENS calls for non-code queries (LIST/QUERY)
        - Decision logging includes policy name and reasoning
        - Zero breaking changes to existing orchestrators
        - Lifecycle hooks integrated (LENS decisions logged)
        - Automatic cleanup on wave/phase completion (ENH-092)
      
      dependencies: []
      blocks: [T2.1, T2.2]
    
    - task_id: T1.3
      name: Refactoring Multi-Cycle RGR
      duration_hours: 1
      priority: P1
      
      description: |
        Wire ENH-088 multi-cycle pattern into RefactoringOrchestrator.
        Enables automatic refactor loops until success criteria met or
        max cycles reached (prevents infinite loops).
      
      files_modified:
        - cortex/orchestrators/refactoring_orchestrator.py
        - cortex/refactoring/__init__.py
      
      files_created:
        - tests/unit/orchestrators/test_refactoring_multi_cycle.py
      
      implementation_steps:
        1_copy_pattern_from_tdd:
          - Import SuccessCriteria from TDDOrchestrator
          - Import CycleMetrics from TDDOrchestrator
          - Import GateResult from TDDOrchestrator
        
        2_implement_execute_multi_cycle:
          - Create execute_multi_cycle() method
          - Parameters: target_file, success_criteria, max_cycles=5
          - Returns: Dict[str, Any] with cycle_metrics
          - Loop: Run refactor cycle → Collect metrics → Check gate
        
        3_implement_holistic_refactor_gate:
          - Create _holistic_refactor_gate() method
          - Check: coverage >= min_coverage
          - Check: complexity <= max_complexity
          - Check: all tests passing
          - Check: no new issues introduced
          - Returns: GateResult(passed, gaps, recommendations)
        
        4_wire_mcp_tool:
          - Add cortex_refactor_multi_cycle to get_mcp_tools()
          - Parameters: target_file, success_criteria
          - Expose multi-cycle refactoring via MCP
      
      tests:
        file: tests/unit/orchestrators/test_refactoring_multi_cycle.py
        count: 22
        coverage:
          # Basic Cycle Execution (4 tests)
          - Test single cycle executes correctly
          - Test multi-cycle loops until criteria met
          - Test max_cycles safety (exits after 5 cycles)
          - Test success criteria validation (schema check)
          
          # Gate Validation (5 tests)
          - Test gate checks coverage threshold
          - Test gate checks complexity threshold
          - Test gate checks all tests passing
          - Test gate checks no new issues introduced (regression detection)
          - Test gate checks extensibility requirements
          
          # Cycle Metrics (3 tests)
          - Test cycle metrics accumulation per iteration
          - Test metrics include: tests_passed, tests_failed, coverage, complexity
          - Test metrics queryable after completion
          
          # Infinite Loop Prevention (4 tests)
          - Test max_cycles enforced even if criteria not met
          - Test cycle timeout (30min hard limit)
          - Test regression detection stops loop (new issues > previous)
          - Test oscillation detection (coverage fluctuating ±10%)
          
          # Edge Cases (4 tests)
          - Test empty target_file handling
          - Test nonexistent target_file handling
          - Test criteria with impossible thresholds (coverage=1.0, complexity=0)
          - Test criteria with conflicting goals (max coverage + min changes)
          
          # Integration (2 tests)
          - Test MCP tool exposure (cortex_refactor_multi_cycle)
          - Test pattern consistency with TDDOrchestrator (same SuccessCriteria)
      
      acceptance_criteria:
        - execute_multi_cycle() method implemented
        - Bounded loops with max_cycles safety (default 5)
        - Success criteria enforced (coverage, complexity, tests)
        - Cycle metrics tracked per iteration
        - MCP tool exposed (cortex_refactor_multi_cycle)
        - Pattern matches TDDOrchestrator (consistency)
        - Zero infinite loop risk (max_cycles enforced)
      
      dependencies: []
      blocks: [T2.1]

  deliverables:
    - UnifiedIntelligenceProvider with full audit logging + Phase 65 S4/S5 enhancements
    - IntentRouter with extensible LENS trigger policy + lifecycle hook integration
    - RefactoringOrchestrator with bounded multi-cycle RGR
    - LifecycleHookSystem integration for automatic LENS trigger cleanup
    - TurnContext integration for turn-over-turn intelligence accumulation
    - 34 new tests (24 + 28 + 22 = 74 total intelligence tests, was 30)
    - Zero regression in existing functionality

