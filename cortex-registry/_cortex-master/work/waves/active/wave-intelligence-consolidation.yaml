# ============================================================================
# TESTING STRATEGY
# ============================================================================

testing:
  total_tests: 88
  breakdown:
    track_1:
      - Intelligence Audit + Phase 65: 24 tests (was 20, +4 for Phase 65 S5 integration)
      - LENS Triggers + Lifecycle: 28 tests (was 24, +4 for ENH-092 integration)
      - Refactoring Multi-Cycle: 22 tests (unchanged)
    track_2:
      - Prompt Loading: 8 tests
      - Entry Point: 6 tests
  
  blind_spots_addressed:
    intelligence_audit:
      - Meta-failure scenario (audit logger itself fails)
      - Cascade failure (all intelligence sources fail sequentially)
      - Memory leak detection in long-running sessions (>1000 ops)
      - Log rotation and archival (prevent disk fill)
      - Thread-safety in high-throughput scenarios (1000 ops/sec)
    
    lens_triggers:
      - Binary file handling (non-code files)
      - Permission denied scenarios
      - Circular symlink detection
      - Extremely large files (>10MB)
      - Policy timeout handling (>5s decision = fallback)
      - Cache invalidation on policy hot-swap
    
    refactoring_multi_cycle:
      - Oscillation detection (metrics fluctuating)
      - Regression cascade (fixing one issue creates three more)
      - Impossible criteria handling (coverage=1.0, complexity=0)
      - Conflicting goals (maximize coverage, minimize changes)
      - Hard timeout enforcement (30min absolute limit)
      - Memory accumulation in cycle metrics (prevent leak)
  
  coverage_targets:
    - UnifiedIntelligenceProvider: 95% coverage (including error paths)
    - IntentRouter LENS logic: 95% coverage (including policy injection)
    - RefactoringOrchestrator multi-cycle: 95% coverage (including safety gates)
    - Prompt loading: 100% coverage (critical path)
  
  regression_testing:
    - Run full test suite after each track (2,400+ existing tests)
    - Verify zero breaking changes to existing orchestrators
    - Verify MCP tools unchanged (10 production tools)
    - Verify orchestrator behavior unchanged (28 orchestrators)
    - Performance benchmark suite (latency, throughput, memory)
  
  integration_testing:
    - Test ARCHITECT mode end-to-end (10 scenarios)
    - Test PRODUCTION mode end-to-end (10 scenarios)
    - Test mode switching mid-session
    - Test intelligence audit trail queryable (SQL-like queries)
    - Test LENS trigger policies injectable at runtime
    - Test multi-cycle RGR terminates correctly (all edge cases)
    - Test cross-orchestrator intelligence sharing
    - Test concurrent intelligence requests (10 parallel sessions)
  
  chaos_testing:
    intelligence_audit:
      - Simulate disk full during log write (fallback to memory)
      - Simulate logger crash mid-operation (transaction rollback)
      - Simulate time drift (NTP failure, timestamp correction)
      - Simulate log corruption (checksum verification)
    
    lens_triggers:
      - Simulate policy server unavailable (local cache fallback)
      - Simulate file system lag (>10s read latency)
      - Simulate concurrent policy updates (version conflict resolution)
      - Simulate corrupted policy definition (schema validation)
    
    refactoring_multi_cycle:
      - Simulate test framework crash mid-cycle (resume from checkpoint)
      - Simulate metric collection failure (use defaults, continue)
      - Simulate criteria file modification mid-execution (reload, warn)
      - Simulate process kill mid-refactor (atomic rollback)

