# Output Format Specification
output_format:
  feasibility_report:
    template: |
      ### 🔍 Capability Feasibility Analysis
      
      **Request:** {user_request_summary}
      **Feasibility Score:** {score}/1.0 ({verdict})
      **Architecture Drift:** {drift_score}/1.0 ({drift_verdict})
      
      #### ✅ Available Capabilities
      | Capability | Provider | Coverage |
      |------------|----------|----------|
      | {cap_name} | {orchestrator/analyzer} | {full/partial/none} |
      
      #### ❌ Missing Capabilities (Gaps)
      | Gap | Impact | Enhancement Required |
      |-----|--------|---------------------|
      | {gap_name} | {impact_desc} | {ENH-ID or "New"} |
      
      #### ⚠️ Architecture Drift Warnings
      | Warning | Existing Pattern | Proposed Change | Risk |
      |---------|-----------------|-----------------|------|
      | {warning} | {file:line} | {proposed} | {HIGH/MEDIUM/LOW} |
      
      **Verdict:** {PROCEED / PROCEED_WITH_CAUTION / BLOCKED}
      **Reason:** {justification}
      
  block_conditions:
    - "Feasibility score < 0.3 (insufficient capabilities)"
    - "Architecture drift > 0.7 (major deviation from patterns)"
    - "CORE-035 violation detected (duplicate functionality)"
    - "Security regression risk > HIGH"

# Scoring Algorithms
scoring:
  feasibility_score:
    formula: "sum(capability_coverage) / total_capabilities_required"
    inputs:
      - "Language adapters available (0.0-1.0 per language)"
      - "Analyzers available (0.0-1.0 per analysis type)"
      - "Orchestrators available (0.0-1.0 per operation type)"
    thresholds:
      full: 0.9  # All capabilities exist
      partial: 0.5  # Some gaps but can proceed
      blocked: 0.3  # Too many gaps
      
  drift_score:
    formula: "max(pattern_deviation, dependency_impact, duplication_risk)"
    inputs:
      - "Pattern deviation: similarity to existing orchestrators/modules"
      - "Dependency impact: how many files would need changes"
      - "Duplication risk: semantic similarity to existing code"
    thresholds:
      aligned: 0.2  # Follows existing patterns
      caution: 0.5  # Some deviation, needs review
      blocked: 0.7  # Major architectural change

# Integration Points
integration:
  interaction_orchestrator:
    hook_point: "execute_turn() → BEFORE comprehension stage"
    flow: |
      User Request → LENS Context → CapabilityFeasibilityGate
                                           ↓
                                   [feasibility_score, drift_score]
                                           ↓
                              score >= 0.5 AND drift <= 0.7?
                                     ↓             ↓
                                   YES            NO
                                     ↓             ↓
                            Continue to DoR    BLOCKED Response
                                              (with gap details)
    
  challenge_engine:
    enhancement: "Add capability matrix to challenge output"
    new_section: |
      ### 🔧 CORTEX Capability Matrix
      | Category | Your Request | CORTEX Status |
      |----------|--------------|---------------|
      | Language Analysis | C# | ✅ CSharpAdapter |
      | Use Case Extraction | API → Use Cases | ⚠️ Partial (needs ENH-017) |
      | Diagram Generation | Architecture | ❌ Not integrated |
      
  enforcement_orchestrator:
    new_agent: "CapabilityFeasibilityAgent"
    rules:
      - "CFG-001: Block if feasibility_score < 0.3"
      - "CFG-002: Block if drift_score > 0.7"
      - "CFG-003: Warning if drift_score > 0.5"

