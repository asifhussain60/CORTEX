# Three Core Programming Workflows (90% coverage)
programming_workflows:
  workflow_1_legacy_rescue:
    name: "Legacy Rescue"
    pattern: "BadMonolith → Clean Architecture"
    coverage: "40% of real-world scenarios"
    
    steps:
      scan:
        orchestrator: "LENSOrchestrator"
        intelligence: ["DotNetLensAnalyzer", "SecurityThreatAnalyzer"]
        output: "25 flaws discovered (God endpoint, SQL injection, secrets, no tests)"
        
      classify:
        orchestrator: "IntentRouter"
        intelligence: ["AntiPatternDetector", "tier3/SECURITY YAMLs"]
        output: "Categorized by severity (P0 security → P3 style)"
        
      prioritize:
        orchestrator: "MasterOrchestrator"
        intelligence: "Eisenhower Matrix (Covey Habit 3)"
        output: "Urgent+Important first (SQL injection, secrets), then SOLID violations"
        
      decompose:
        orchestrator: "IncrementalTaskDecomposer"
        intelligence: "<500 LOC chunks"
        output: "Extract config → Parameterize SQL → Add error handling → Layer architecture → Add tests"
        
      execute:
        orchestrator: "TDDOrchestrator"
        intelligence: "RGR per step"
        phases:
          red: "Write test for SQL injection"
          green: "Fix with parameterized queries"
          refactor: "Extract data access layer"
          
      validate:
        orchestrator: "CoherenceValidator"
        intelligence: "Cross-step coherence"
        output: "New layers don't break existing endpoints"
        
      learn:
        orchestrator: "UniversalLearningLoop"
        intelligence: "PatternLibrary"
        output: "Capture 'monolith rescue pattern' → tier3 knowledge"
  
  workflow_2_security_hardening:
    name: "Security Hardening"
    pattern: "OWASP/CWE remediation"
    coverage: "30% of real-world scenarios"
    
    steps:
      threat_model:
        orchestrator: "SecurityThreatAnalyzer"
        intelligence: "CWE pattern library (tier3/SECURITY)"
        
      vulnerability_map:
        orchestrator: "LENSOrchestrator"
        intelligence: "Cross-reference with OWASP Top 10"
        
      fix_priority:
        orchestrator: "EnforcementOrchestrator"
        intelligence: "P0: Injection → P1: Auth → P2: Config → P3: Logging"
        
      remediate:
        orchestrator: "TDDOrchestrator"
        intelligence: "Security test FIRST, then fix (RGR)"
        
      verify:
        orchestrator: "CoherenceValidator"
        intelligence: "No regressions, no new vulnerabilities"
        
      certify:
        orchestrator: "AuditVerifier (NEW)"
        intelligence: "Audit log proves: all CWEs addressed, all tests pass"
  
  workflow_3_quality_uplift:
    name: "Quality Uplift"
    pattern: "Code quality + SOLID compliance"
    coverage: "20% of real-world scenarios"
    
    steps:
      quality_scan:
        orchestrator: "LENSOrchestrator"
        intelligence: ["AntiPatternDetector", "complexity analysis"]
        
      solid_audit:
        orchestrator: "PatternDetector"
        intelligence: "tier3/solid YAMLs (SRP, OCP, LSP, ISP, DIP)"
        
      refactor_plan:
        orchestrator: "RefactoringOrchestrator"
        intelligence: "Decompose God objects, extract interfaces, inject dependencies"
        
      execute:
        orchestrator: "TDDOrchestrator"
        intelligence: "RGR for each extraction"
        
      measure:
        orchestrator: "TestValueScorer"
        intelligence: "Before/after quality scores"
        
      learn:
        orchestrator: "PatternLibrary"
        intelligence: "Quality uplift pattern → reusable template"

# Controlled Intelligence Architecture (Digestive System)
controlled_learning:
  architecture: |
    STS SAMPLE (e.g. BadMonolith)
         ↓
    LENS ANALYSIS (existing)
         ↓ findings + patterns
    KNOWLEDGE CHECK (existing tier0-3)
         ↓ "Do I already know about this?"
    ┌────────────────────────────────────┐
    │ CONFIDENCE GATE (existing)         │
    │                                    │
    │ Known pattern (>0.7)  → Apply fix  │
    │ Uncertain (0.4-0.7)  → Flag + Ask  │
    │ Unknown (<0.4)        → Learn only │
    └────────────────────────────────────┘
         ↓ outcome
    LEARNING CAPTURE (existing)
         ↓ pattern + confidence
    ┌────────────────────────────────────┐
    │ PROMOTION GATE (NEW ~50 LOC)       │
    │                                    │
    │ Seen 3+ times + high confidence    │
    │ → Promote to tier3 YAML            │
    │                                    │
    │ Seen <3 times + medium confidence  │
    │ → Keep in PatternLibrary only      │
    │                                    │
    │ Low confidence + old (>30 days)    │
    │ → Flush (FlushManager)             │
    └────────────────────────────────────┘
  
  control_mechanisms:
    confidence_scoring:
      component: "ConfidenceScorer (exists)"
      purpose: "Prevents low-quality patterns from entering knowledge"
      
    occurrence_threshold:
      rule: "Promote only after 3+ sightings"
      purpose: "Prevents one-off anomalies from becoming 'knowledge'"
      
    governance_gate:
      component: "EnforcementOrchestrator (exists)"
      purpose: "All promoted patterns pass CORE rule validation"
      
    audit_trail:
      component: "EventBus + AuditVerifier"
      purpose: "Every promotion/flush is traceable"
      
    human_override:
      rule: "company/domains/*.yaml takes precedence"
      purpose: "Business rules always win over learned patterns"
  
  neuron_metaphor:
    nervous_system: "EventBus IS the axon"
    neurons: "28 orchestrators (receive events, process, emit events)"
    signal_tracing: "Correlation IDs"
    error_correction: "Dead letter queue"
    inhibitory_neurons: "7 governance agents (block rule violations)"
    signal_strength: "ConfidenceScorer (weak signals filtered)"
    long_term_memory: "PromotionGate (strong repeated signals become knowledge)"
    forgetting: "FlushManager (stale signals decay)"

