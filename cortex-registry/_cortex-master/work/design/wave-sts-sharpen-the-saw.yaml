# Execution Strategy
execution_strategy:
  mode: "Silent Autonomous"
  orchestrator: "MasterOrchestrator"
  progress_format: "ASCII progress bars + tables"
  checkpoint_frequency: "After each stage"
  
  dependencies_check:
    - "Verify WorkflowComposer exists (WAVE-V prerequisite)"
    - "Verify EventBus correlation tracking active"
    - "Verify UniversalLearningLoop wired to EventBus"
    - "Verify PatternLibrary persistence working"
    
  stage_execution_order:
    1: "Stage 1: Knowledge Base (workflow templates + SOLID YAMLs)"
    2: "Stage 2: Controlled Learning (PromotionGate + FlushManager)"
    3: "Stage 3: Audit Verification (AuditVerifier + E2EPathGenerator)"
    4: "Stage 4: E2E Wiring (STS scenarios #41-50 with BadMonolith)"
    
  test_strategy:
    approach: "TDD (RED → GREEN → REFACTOR)"
    execution: "Run tests after each stage"
    failure_handling: "STOP and fix (no --ignore, no _skip_, CORE-008 enforcement)"
    coverage_target: "≥80% per stage"
    
  audit_trail:
    format: "AC_START → AC_COMPLETE markers"
    correlation_ids: "Generated by EventBus"
    verification: "AuditVerifier validates event chains"
    
  completion_report:
    format: "Progress bar + table"
    content:
      - "Tests passed/total"
      - "Coverage percentage"
      - "Files created/modified"
      - "Commit hash"
      - "STS scenarios validated"

# Integration Points
integration_points:
  orchestrators:
    - "MasterOrchestrator - Route STS requests to appropriate workflows"
    - "LENSOrchestrator - Analyze STS sample apps"
    - "TDDOrchestrator - Execute RGR cycles for fixes"
    - "RefactoringOrchestrator - Extract layers from God endpoints"
    - "EnforcementOrchestrator - Gate all pattern promotions"
    
  intelligence:
    - "DotNetLensAnalyzer - Scan C# projects"
    - "SecurityThreatAnalyzer - Detect CWE patterns"
    - "AntiPatternDetector - Find God objects, Feature Envy"
    - "tier3/SECURITY YAMLs - Provide remediation knowledge"
    - "tier3/solid/*.yaml - Provide SOLID principles"
    
  learning:
    - "UniversalLearningLoop - Capture patterns from operations"
    - "PatternLibrary - Store/retrieve learned patterns"
    - "PromotionGate (NEW) - Promote patterns to tier3 knowledge"
    - "FlushManager (NEW) - Remove stale patterns"
    - "ConfidenceScorer - Score pattern quality"
    
  audit:
    - "EventBus - Emit correlation-tracked events"
    - "AuditVerifier (NEW) - Validate event chains"
    - "E2EPathGenerator (NEW) - Generate test scenarios"
    - "governance.db - Persist audit logs"

# Risk Analysis
risks:
  technical:
    - risk: "WorkflowComposer from WAVE-V not ready"
      mitigation: "Hard dependency - must complete WAVE-V first"
      severity: "P0 - BLOCKING"
      
    - risk: "C# AST analysis limited (no tree-sitter)"
      mitigation: "File-structure analysis sufficient for initial STS. Defer tree-sitter to future enhancement."
      severity: "P2 - ACCEPTABLE"
      
    - risk: "EventBus correlation tracking not complete"
      mitigation: "Verify in pre-flight check. EventBus already has correlation ID support."
      severity: "P1 - VERIFY"
      
  governance:
    - risk: "Uncontrolled learning (hallucination drift)"
      mitigation: "Multi-gate control: ConfidenceScorer → PromotionGate → EnforcementOrchestrator"
      severity: "P1 - MITIGATED"
      
    - risk: "Pattern library grows unbounded"
      mitigation: "FlushManager removes stale patterns (>30 days, low confidence)"
      severity: "P2 - MITIGATED"
      
  execution:
    - risk: "10 STS scenarios insufficient for confidence"
      mitigation: "40 additional scenarios from workflow-engine.md (50 total)"
      severity: "P2 - ACCEPTABLE"
      
    - risk: "BadMonolith not representative of real codebases"
      mitigation: "RA-Domain and payment-processor provide production-scale validation"
      severity: "P2 - ACCEPTABLE"

