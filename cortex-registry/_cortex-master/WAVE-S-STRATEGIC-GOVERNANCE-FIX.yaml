architecture:
  two_tier_planning:
    strategic:
      description: "Multi-session, multi-phase initiatives"
      orchestrator: "PlanningOrchestrator"
      file: "workflow-core.yaml"
      hierarchy: "INITIATIVE → PHASE → STAGE → TASK"
      examples:
        - "Modernize authentication architecture"
        - "Implement event-driven observability"
        - "WAVE-S governance fix"
    
    tactical:
      description: "Single-session execution"
      orchestrators:
        - "TDDOrchestrator"
        - "RefactoringOrchestrator"
        - "AnalysisOrchestrator"
      file: "workflow-tactical.yaml"
      hierarchy: "OPERATION → STEP → ACTION"
      examples:
        - "Implement user authentication"
        - "Fix MCP connection error"
        - "Refactor DebuggerOrchestrator"
  
  event_driven_sync:
    description: "Orchestrators broadcast events, registry subscribes passively"
    components:
      event_bus:
        location: "cortex/infrastructure/event_bus.py"
        status: "EXISTS (enhance)"
      
      registry_sync_service:
        location: "cortex/registry/sync/registry_sync_service.py"
        status: "NEW"
        purpose: "Subscribe to orchestrator events, update registry automatically"
      
      event_definitions:
        file: "registry-events.yaml"
        status: "NEW"
        events:
          - "PlanCreated"
          - "StageStarted"
          - "StageCompleted"
          - "PhasePaused"
          - "PhaseResumed"
          - "PhaseCompleted"
          - "OperationCompleted"
          - "ValidationFailed"
          - "RegressionDetected"
    
    benefits:
      - "Decoupling: Orchestrators don't know registry exists"
      - "Resilience: Registry failure doesn't stop orchestrators"
      - "Extensibility: Add new subscribers without touching orchestrators"
      - "Audit trail: All events logged automatically"
  
  adaptive_workflows:
    description: "Context-aware workflow templates, not rigid universal stages"
    interface:
      required_methods:
        - "create_plan(request) → Plan"
        - "execute_stage(stage) → StageResult"
        - "report_progress() → ProgressReport"
        - "handle_failure(error) → RecoveryAction"
    
    customization:
      complexity_based:
        simple: "3-stage fast track"
        medium: "5-stage standard"
        complex: "7-stage deep validation"
      
      risk_based:
        low: "Parallel execution allowed"
        medium: "Sequential with checkpoints"
        high: "Stage-by-stage approval"
      
      domain_based:
        tdd: "RED → GREEN → REFACTOR cycle"
        refactoring: "Extract → Verify → Consolidate"
        analysis: "Scan → Correlate → Report"

