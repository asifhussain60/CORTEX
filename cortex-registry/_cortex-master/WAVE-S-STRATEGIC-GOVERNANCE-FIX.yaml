automation:
  status_updates:
    trigger: "PhaseCompleted | StageCompleted | OperationCompleted events"
    handler: "RegistrySyncService.on_event()"
    updates:
      - "status field in YAML"
      - "completion_date timestamp"
      - "test_results summary"
      - "coverage_percentage"
  
  file_cleanup:
    trigger: "PhaseCompleted event"
    handler: "AutoVacuum.on_phase_complete()"
    actions:
      - "Move completed artifacts to _archive/YYYY-MM/"
      - "Update cross-references"
      - "Generate archival index"
      - "Verify no broken links"
  
  file_naming_enforcement:
    trigger: "Pre-commit hook"
    handler: "FileNamingEnforcementAgent.validate()"
    checks:
      - "No SCREAMING_CASE files"
      - "kebab-case for all YAML/MD files"
      - "Plan files ≤ 40 characters"
    action_on_violation: "BLOCK commit with fix instructions"
  
  ac_marker_injection:
    trigger: "Operation start/complete"
    handler: "ACMarkerInjector.inject()"
    markers:
      - "AC_START: AC-{phase_id}-{sequence}"
      - "AC_COMPLETE: AC-{phase_id}-{sequence} ✅ {test_count} passing"
    integration: "Git commit message templates"

