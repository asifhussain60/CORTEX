    Transform CORTEX planning into an integrated "nervous system" that operates
    invisibly across all orchestrators. Implement two-tier planning (strategic
    for multi-session projects, tactical for single-session tasks) with event-driven
    status synchronization, ensuring automatic registry updates, file governance,
    and holistic validation with regression prevention.
  
  key_principles:
    - "Planning as invisible coordination layer"
    - "Event-driven decoupling (broadcast, don't call)"
    - "Adaptive workflows (context-aware, not rigid)"
    - "Automatic everything (status, cleanup, archival)"
    - "RGR loops at every level (continuous improvement)"
    - "202 files → 4 core files (radical simplification)"

