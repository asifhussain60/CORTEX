# Risk Assessment
risks:
  risk_1:
    id: "RISK-ML-001"
    title: "Tree-sitter Performance on Large Repos"
    likelihood: "Medium"
    impact: "High"
    mitigation:
      - "Limit files per language (default 100, configurable)"
      - "Parallel parsing (ProcessPoolExecutor)"
      - "Cache parsed AST results in SQLite"
      - "Incremental analysis (only changed files)"
    
  risk_2:
    id: "RISK-ML-002"
    title: "Language-Specific Edge Cases"
    likelihood: "High"
    impact: "Medium"
    mitigation:
      - "Comprehensive test fixtures (sample repos per language)"
      - "Fallback regex analyzer (if tree-sitter fails)"
      - "Language-specific quirks documented"
      - "Community feedback loop (GitHub issues)"
    
  risk_3:
    id: "RISK-ML-003"
    title: "Diagram Rendering Complexity"
    likelihood: "Medium"
    impact: "Medium"
    mitigation:
      - "Progressive disclosure (layer toggle, zoom)"
      - "Smart diagram simplification (hide private methods)"
      - "Limit diagram nodes (max 50 classes per diagram)"
      - "Fallback to text summary (if diagram too large)"

