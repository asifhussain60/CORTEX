      - "cortex/lens/models/call_graph.py"
      - "tests/unit/lens/analyzers/test_call_graph_analyzer.py"
      - "tests/integration/lens/test_call_graph_e2e.py"

# Test Strategy
testing:
  total_estimated_tests: 300
  coverage_target: 85%
  
  unit_tests:
    count: 200
    focus:
      - "Language adapter contracts (each language adapter)"
      - "AST parsing correctness (sample files per language)"
      - "Use case extraction heuristics"
      - "Diagram generation logic"
    
  integration_tests:
    count: 75
    focus:
      - "LENSOrchestrator + PolyglotASTAnalyzer"
      - "RepositoryOnboardingOrchestrator + DiagramOrchestrator"
      - "End-to-end multi-language analysis"
    
  e2e_tests:
    count: 25
    focus:
      - "Onboard sample .NET repo → verify dashboard has C# classes"
      - "Onboard sample Java repo → verify ER diagrams rendered"
      - "Onboard polyglot repo → verify all languages analyzed"
      - "Interactive explorer: zoom, filter, export (Playwright)"
    
  contract_tests:
    count: 10
    focus:
      - "LanguageAdapter interface contracts"
      - "DiagramOrchestrator output schema"
      - "RepoDashboardModel v3.0 schema"

# MCP Tool Exposure
mcp_tools:
  new_tools:
    - name: "cortex_analyze_polyglot"
      description: "Analyze multi-language codebase with full AST parsing"
      parameters:
        - "repo_path: Path"
        - "languages: List[str] (default: auto-detect)"
        - "max_files_per_language: int (default: 100)"
      returns: "PolyglotAnalysisResult"
      
    - name: "cortex_extract_use_cases"
      description: "Auto-extract use cases from code analysis"
      parameters:
        - "lens_context: Dict"
        - "security_model: Dict"
      returns: "List[UseCase]"
      
    - name: "cortex_generate_diagrams"
      description: "Generate all dashboard diagrams from LENS analysis"
      parameters:
        - "lens_context: Dict"
        - "repo_path: Path"
        - "security_model: Dict"
      returns: "Dict[str, str] (diagram_type → mermaid_content)"

