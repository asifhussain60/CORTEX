# LENS Multi-Language Enhancement Plan
# Generated from: chat01.md DIGEST analysis
# Created: 2026-02-04
# Status: DESIGN PHASE
# Priority: P0 (Critical Gap - Blocks Multi-Stack Adoption)

meta:
  plan_id: "LENS-MLang-001"
  enhancement_id: "ENH-017"
  version: "1.0"
  authority: "chat01.md DIGEST + cortex-architect.prompt.md v13.0"
  
objective:
  summary: "Enable CORTEX LENS to perform deep code analysis for C#, Java, TypeScript, JavaScript (not just Python)"
  business_value: "Unlock 30-40% of enterprise repos that are polyglot or non-Python"
  success_criteria:
    - "Onboard .NET repositories with full class/method extraction"
    - "Onboard Java repositories with package/interface analysis"
    - "Onboard TypeScript/JavaScript with component/module mapping"
    - "Generate accurate architecture diagrams for polyglot systems"
    - "Auto-extract use cases from non-Python codebases"

# Gap Analysis (From DIGEST)
gaps:
  gap_1:
    id: "GAP-ML-001"
    title: "Python-Only AST Parsing"
    current_state: "LENS v2.0 only parses Python via ast.parse()"
    missing: "No AST parsing for C#, Java, TypeScript, JavaScript, Go, Rust"
    impact: "Cannot reverse engineer 70% of enterprise codebases"
    evidence:
      - "cortex/lens/analyzers/ast_analyzer.py: Python-specific (ast.parse)"
      - "cortex/lens/orchestrator.py: _analyze_codebase_structure() filters *.py only"
      - "No tree-sitter or Roslyn integration detected"
    stakeholder_impact:
      business_leaders: "Cannot see what non-Python systems do"
      product_owners: "Cannot understand feature coverage in .NET/Java"
      software_engineers: "Cannot navigate polyglot codebases"
      architects: "Cannot visualize multi-stack architectures"

  gap_2:
    id: "GAP-ML-002"
    title: "No Use Case Extraction from Non-Python Code"
    current_state: "Hardcoded security-based use cases only"
    missing: "Automated use case discovery from API endpoints, CLI commands, DB models"
    impact: "Business narratives incomplete for non-Python repos"
    evidence:
      - "cortex/orchestrators/support/repository_onboarding_orchestrator.py:_generate_use_cases() manual only"
    
  gap_3:
    id: "GAP-ML-003"
    title: "Diagram Generation Not Integrated"
    current_state: "Mermaid renderers exist but not called during onboarding"
    missing: "Real-time diagram generation step in onboarding workflow"
    impact: "Dashboards have placeholder text instead of rich visuals"
    evidence:
      - "cortex/visualization/mermaid_renderer.py: exists but unused"
      - "company/dashboards/repos/kashkole/index.html: placeholders only"

# Phased Implementation Roadmap
phases:
  phase_0:
    id: "PHASE-0"
    title: "Foundation & Data Models"
    duration_weeks: 1
    owner: "TDDOrchestrator"
    dependencies: []
    deliverables:
      - "PolyglotASTResult data model (unified across languages)"
      - "LanguageAdapter interface (abstract base class)"
      - "DiagramData model (for visualization integration)"
      - "UseCaseExtractionContext model"
    tests:
      unit_tests: 15
      integration_tests: 0
      contract_tests: 5
    files_created:
      - "cortex/lens/models/polyglot_ast_result.py"
      - "cortex/lens/adapters/language_adapter.py"
      - "cortex/visualization/models/diagram_data.py"
      - "cortex/lens/models/use_case_context.py"
      - "tests/unit/lens/models/test_polyglot_ast_result.py"
      - "tests/unit/lens/adapters/test_language_adapter.py"
      - "tests/contracts/test_language_adapter_contracts.py"
    
  phase_1:
    id: "PHASE-1"
    title: "Multi-Language AST Parsing (Tree-sitter Integration)"
    duration_weeks: 4
    owner: "TDDOrchestrator"
    dependencies: ["PHASE-0"]
    deliverables:
      - "PolyglotASTAnalyzer with tree-sitter backend"
      - "CSharpAdapter (namespaces, classes, methods, properties)"
      - "JavaAdapter (packages, classes, methods, interfaces)"
      - "TypeScriptAdapter (interfaces, types, components, decorators)"
      - "JavaScriptAdapter (functions, modules, React components)"
      - "Language auto-detection (by file extension + content sniffing)"
      - "Fallback regex parser (for unsupported languages)"
    tests:
      unit_tests: 50
      integration_tests: 15
      e2e_tests: 8
    files_created:
      - "cortex/lens/analyzers/polyglot_ast_analyzer.py"
      - "cortex/lens/adapters/csharp_adapter.py"
      - "cortex/lens/adapters/java_adapter.py"
      - "cortex/lens/adapters/typescript_adapter.py"
      - "cortex/lens/adapters/javascript_adapter.py"
      - "cortex/lens/analyzers/language_detector.py"
      - "cortex/lens/analyzers/fallback_regex_analyzer.py"
      - "tests/unit/lens/analyzers/test_polyglot_ast_analyzer.py"
      - "tests/unit/lens/adapters/test_csharp_adapter.py"
      - "tests/unit/lens/adapters/test_java_adapter.py"
      - "tests/unit/lens/adapters/test_typescript_adapter.py"
      - "tests/unit/lens/adapters/test_javascript_adapter.py"
      - "tests/integration/lens/test_polyglot_analysis_e2e.py"
      - "tests/fixtures/sample_repos/dotnet_sample/"
      - "tests/fixtures/sample_repos/java_sample/"
      - "tests/fixtures/sample_repos/typescript_sample/"
    dependencies_added:
      - "tree-sitter>=0.20.0"
      - "tree-sitter-languages>=1.9.0"
    wiring_updates:
      - "Add PolyglotASTAnalyzer to analyzers section in wiring.yaml"
      - "Priority: 2 (after GitHistoryAnalyzer)"
      - "CWE coverage: None (focus on structure, not security)"
    
  phase_2:
    id: "PHASE-2"
    title: "LENSOrchestrator Integration"
    duration_weeks: 1
    owner: "TDDOrchestrator"
    dependencies: ["PHASE-1"]
    deliverables:
      - "Update LENSOrchestrator._analyze_codebase_structure()"
      - "Multi-language file collection (*.py, *.cs, *.java, *.ts, *.js)"
      - "Language-specific aggregation (classes by language, methods by language)"
      - "Unified code analysis result schema"
    tests:
      unit_tests: 10
      integration_tests: 8
    files_modified:
      - "cortex/lens/orchestrator.py"
      - "tests/unit/lens/test_lens_orchestrator.py"
      - "tests/integration/lens/test_lens_polyglot_integration.py"
    
  phase_3:
    id: "PHASE-3"
    title: "Automated Use Case Extraction"
    duration_weeks: 2
    owner: "TDDOrchestrator"
    dependencies: ["PHASE-2"]
    deliverables:
      - "UseCaseExtractor orchestrator"
      - "API endpoint → Use case mapping"
      - "CLI command → Use case mapping"
      - "Database model → Use case mapping"
      - "Business logic method → Use case mapping"
      - "Persona inference heuristics"
    tests:
