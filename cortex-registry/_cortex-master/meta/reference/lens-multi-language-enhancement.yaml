      - "cortex/models/dashboard_schema.py (RepoDashboardModel v3.0)"
      - "cortex/templates/dashboard_template_v3.html"
      - "tests/unit/orchestrators/support/test_repository_onboarding_orchestrator.py"
    schema_updates:
      - "RepoDashboardModel.diagrams: Dict[str, str] (diagram_type → mermaid_content)"
    
  phase_5:
