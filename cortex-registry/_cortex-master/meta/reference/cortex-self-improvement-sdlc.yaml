      - "Python 'type' vs JavaScript 'category' field names"
      - "No contract tests until manually added post-failure"
    impact: "HIGH - 60% of bugs were layer alignment issues"
    resolution: "Add cross-layer contract validation to planning phase"
    
  rc4_no_post_phase_review:
    title: "No Post-Phase Review or Verification"
    evidence:
