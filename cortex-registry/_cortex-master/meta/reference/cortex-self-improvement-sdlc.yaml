        parameters:
          task: "Dict - Task specification"
          layers: "List[str] - Layers involved (backend, frontend, data)"
        returns: "MultiLayerDesign - Coordinated design"
        
      - name: "cortex_validate_integration"
        description: "Validate that all layers will integrate correctly"
        parameters:
          design: "MultiLayerDesign - Design to validate"
        returns: "IntegrationValidation - Pass/fail with details"

