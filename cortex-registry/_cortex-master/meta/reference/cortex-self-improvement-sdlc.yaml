      - "No smoke tests between phases"
      - "Integration bugs discovered 4+ hours into implementation"
    impact: "MEDIUM - Cascading failures from early phases to late phases"
    resolution: "Add automated post-phase verification with checkpoint gates"
    
  rc5_mcp_gateway_bypass:
    title: "Direct Chat Bypassed MCP Gateway"
    evidence:
      - "User typing 'implement X' went to TDDOrchestrator directly"
      - "MCP-GATE rule not enforced by Copilot"
      - "No audit trail for implementation decisions"
