          description: |
            Extend challenge generation to include:
            - Cross-layer alignment challenges
            - Integration risk challenges
            - Schema migration challenges
          new_challenge_types:
            - "LAYER_MISALIGNMENT: Detected potential cross-layer issues"
            - "INTEGRATION_RISK: This change affects multiple systems"
            - "SCHEMA_DRIFT: Schema changes require migration"
            
    mcp_tools:
      - name: "cortex_coordinate_layers"
