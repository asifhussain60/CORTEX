orchestrator_enhancements:
  # =========================================================================
  # PLANNING ORCHESTRATOR ENHANCEMENT
  # =========================================================================
  enhanced_planning_orchestrator:
    current_state:
      file: "cortex/orchestrators/domain/enhanced_planning_orchestrator.py"
      version: "3.0.0"
      capabilities:
        - "YAML-driven phase templates (AC-DOMAIN-PLAN-001)"
        - "Topological phase sorting (AC-DOMAIN-PLAN-003)"
        - "ML-based effort estimation (AC-DOMAIN-PLAN-009)"
        - "Resource constraint modeling (AC-DOMAIN-PLAN-011)"
        - "Risk assessment matrix (AC-DOMAIN-PLAN-012)"
      gaps:
        - "❌ No code-level planning (stops at phase level)"
        - "❌ No cross-layer contract specification"
        - "❌ No file/function/interface breakdown"
        - "❌ No post-phase verification hooks"
        - "❌ No integration coherence checking"
        
    target_state:
      version: "4.0.0"
      new_capabilities:
        code_level_planning:
          title: "Code-Level Planning Intelligence"
          description: |
            Plan down to the code level WITHOUT generating code:
            - File specifications (what files to create/modify)
            - Function signatures (inputs, outputs, types)
            - Interface contracts (Python ↔ JavaScript alignment)
            - Data model schemas (with cross-layer validation)
            - Test requirements (what tests to write first)
          methods:
            - name: "generate_code_level_plan"
              signature: "(task: Dict, lens_context: LENSContext) -> CodeLevelPlan"
              description: "Generate detailed code-level plan from high-level task"
              returns:
                file_specs: "List[FileSpec] - Files to create/modify"
                function_specs: "List[FunctionSpec] - Function signatures"
                interface_contracts: "List[InterfaceContract] - Cross-layer contracts"
                test_specs: "List[TestSpec] - Required tests (TDD-first)"
                
            - name: "validate_cross_layer_coherence"
              signature: "(plan: CodeLevelPlan) -> CoherenceReport"
              description: "Validate that all layers will work together"
              checks:
                - "Enum value alignment (Python ↔ JavaScript)"
                - "Field name consistency (snake_case ↔ camelCase mapping)"
                - "Type compatibility (Pydantic ↔ JSON Schema)"
                - "Import path correctness (relative imports work)"
                
            - name: "generate_integration_contracts"
              signature: "(plan: CodeLevelPlan) -> List[IntegrationContract]"
              description: "Generate testable integration contracts"
              output: "Contract tests that can be run to verify alignment"
              
        post_phase_review:
          title: "Automated Post-Phase Review"
          description: |
            After each phase completion, automatically:
            1. Run phase-specific verification tests
            2. Check cross-layer contracts still pass
            3. Generate phase completion report
            4. Gate next phase on verification pass
          methods:
            - name: "execute_post_phase_review"
              signature: "(phase_id: str) -> PhaseReviewResult"
              description: "Run automated verification after phase completion"
              steps:
                - "Run unit tests for phase artifacts"
                - "Run integration contracts"
                - "Check LENS analysis for new issues"
                - "Generate review summary"
                
            - name: "gate_next_phase"
              signature: "(current_phase: str, review: PhaseReviewResult) -> GateDecision"
              description: "Decide if next phase can start based on review"
              conditions:
                - "All phase tests pass"
                - "No new HIGH/CRITICAL issues from LENS"
                - "Cross-layer contracts still valid"
                
        comprehensive_logging:
          title: "Enhanced Audit Logging"
          description: |
            Log all planning decisions with full context:
            - LENS context used for decisions
            - Alternative approaches considered
            - Risk assessments at each level
            - Traceability from requirement → code spec
          log_points:
            - "PLAN_START: Task decomposition begins"
            - "CODE_SPEC_GENERATED: Each file/function spec"
            - "COHERENCE_CHECK: Cross-layer validation"
            - "PHASE_GATE: Transition decisions"
            - "PLAN_COMPLETE: Final plan summary"
            
    data_models:
      FileSpec:
        path: "str - Relative file path"
        action: "Enum[CREATE, MODIFY, DELETE]"
        purpose: "str - What this file does"
        dependencies: "List[str] - Files this depends on"
        estimated_loc: "int - Estimated lines of code"
        language: "str - Programming language"
        
      FunctionSpec:
        file_path: "str - Which file contains this"
        name: "str - Function/method name"
        signature: "str - Full signature with types"
        purpose: "str - What this function does"
        inputs: "List[ParameterSpec] - Input parameters"
        outputs: "ReturnSpec - Return type and meaning"
        test_cases: "List[TestCase] - Example test cases"
        
      InterfaceContract:
        contract_id: "str - Unique identifier"
        python_side: "PythonSpec - Python implementation"
        javascript_side: "JavaScriptSpec - JavaScript implementation"
        validation_tests: "List[str] - Tests to verify alignment"
        field_mappings: "Dict[str, str] - Python name → JS name"
        
      CodeLevelPlan:
        task_id: "str - Parent task"
        file_specs: "List[FileSpec]"
        function_specs: "List[FunctionSpec]"
        interface_contracts: "List[InterfaceContract]"
        test_specs: "List[TestSpec]"
        execution_order: "List[str] - Topologically sorted"
        estimated_effort: "EffortEstimate"
        risk_assessment: "RiskMatrix"
        
    mcp_tools:
      - name: "cortex_generate_code_plan"
        description: "Generate code-level implementation plan (no code generation)"
        parameters:
          task_description: "str - What to implement"
          target_modules: "List[str] - Where to implement"
          lens_context: "Optional[str] - Pre-gathered LENS context"
        returns: "CodeLevelPlan - Detailed implementation plan"
        
      - name: "cortex_validate_plan_coherence"
        description: "Validate cross-layer coherence of a plan"
        parameters:
          plan: "CodeLevelPlan - Plan to validate"
        returns: "CoherenceReport - Validation results"
        
      - name: "cortex_execute_phase_review"
        description: "Run post-phase verification and gating"
        parameters:
          phase_id: "str - Phase to review"
          artifacts: "List[str] - Files created in phase"
        returns: "PhaseReviewResult - Pass/fail with details"

  # =========================================================================
  # INTERACTION ORCHESTRATOR ENHANCEMENT
  # =========================================================================
  enhanced_interaction_orchestrator:
    current_state:
      file: "cortex/orchestrators/core/interaction_orchestrator.py"
      version: "Current"
      capabilities:
        - "Challenge system integration (AC-CHALLENGE-SYSTEM-002)"
        - "LENS context building on every turn"
        - "Security threat assessment (Phase 8.3)"
        - "Communication pattern enforcement"
      gaps:
        - "❌ No planning phase invocation for IMPLEMENT intents"
        - "❌ Challenge system doesn't check for cross-layer alignment"
        - "❌ No cohesive design coordination across layers"
        - "❌ Single-layer focus (doesn't orchestrate multi-layer)"
        
    target_state:
      version: "Enhanced with Planning Integration"
      new_capabilities:
        planning_integration:
          title: "Mandatory Planning for IMPLEMENT Intents"
          description: |
            Before any IMPLEMENT intent proceeds to execution:
            1. Invoke PlanningOrchestrator for code-level plan
            2. Present plan to user for approval (DoR includes plan)
            3. Validate cross-layer coherence
            4. Only then proceed to TDDOrchestrator
          flow: |
            User Request (IMPLEMENT)
                ↓
            LENS Context Build
                ↓
            Challenge Generation (if disagreement)
                ↓
            Planning Phase (NEW) ← PlanningOrchestrator
                ├─ Generate CodeLevelPlan
                ├─ Validate Coherence
                └─ Present Plan in DoR
                ↓
            User Approval (DoR with Plan)
                ↓
            TDD Execution (per plan)
                ↓
