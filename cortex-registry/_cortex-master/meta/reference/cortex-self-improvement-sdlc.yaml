      - "PlanningOrchestrator never invoked (0 calls in 3846-line session)"
      - "MasterOrchestrator routes IMPLEMENT directly to TDDOrchestrator"
    impact: "HIGH - Features implemented without coherent cross-layer design"
    resolution: "Add mandatory planning phase between intent classification and execution"
    
  rc2_shallow_planning_depth:
    title: "Planning Stops at Phase Level, Not Code Level"
    evidence:
      - "EnhancedPlanningOrchestrator creates phases like 'Implement Data Layer'"
      - "No breakdown to: which files, which functions, which interfaces"
      - "No cross-layer contract specification (Python enums ↔ JavaScript)"
