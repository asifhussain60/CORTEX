# ============================================================================
# MANDATORY CORTEX REVIEW PHASE
# ============================================================================

cortex_review_phase:
  overview: |
    Every implementation MUST have a final CORTEX Review Phase that:
    1. Uses git lens to analyze all commits holistically
    2. Compares implementation against the original plan
    3. Verifies cross-layer coherence was maintained
    4. Generates implementation fidelity score
    5. Only reports success after review passes
    
  review_orchestrator:
    name: "ReviewOrchestrator"
    location: "cortex/orchestrators/core/review_orchestrator.py"
    purpose: "Holistic implementation verification using LENS + Git"
    
    capabilities:
      git_based_review:
        title: "Git History Analysis"
        methods:
          - name: "analyze_implementation_commits"
            signature: "(task_id: str, plan: CodeLevelPlan) -> CommitAnalysis"
            description: "Analyze all commits related to task implementation"
            data_sources:
              - "GitHistoryAnalyzer - commit messages, authors, timestamps"
              - "ASTAnalyzer - code structure changes per commit"
              - "DiffAnalyzer - line-level changes"
            analysis_points:
              - "Commit message quality (descriptive, references task)"
              - "Commit atomicity (one logical change per commit)"
              - "Commit sequence (matches plan phases)"
              - "No unrelated changes sneaked in"
              
          - name: "verify_plan_implementation"
            signature: "(plan: CodeLevelPlan, commits: CommitAnalysis) -> PlanFidelityReport"
            description: "Compare implemented code against plan specifications"
            checks:
              - "All FileSpecs were created/modified as planned"
              - "All FunctionSpecs have matching implementations"
              - "All InterfaceContracts are satisfied"
              - "No extra files created outside plan"
              - "No missing files from plan"
            output: |
              PlanFidelityReport:
                score: 0-100 (100 = perfect match)
                missing_specs: List[Spec] - Planned but not implemented
                extra_artifacts: List[str] - Implemented but not planned
                deviations: List[Deviation] - Implemented differently than planned
                
          - name: "verify_cross_layer_coherence_final"
            signature: "(task_id: str) -> CoherenceReport"
            description: "Final verification that all layers work together"
            verification_steps:
              - "Re-run all contract tests"
              - "Check enum alignments via AST"
              - "Verify field name mappings"
              - "Run integration smoke tests"
              
      holistic_review:
        title: "Holistic Implementation Review"
        methods:
          - name: "execute_final_review"
            signature: "(task_id: str, plan: CodeLevelPlan) -> FinalReviewResult"
            description: "Complete holistic review before reporting success"
            steps:
              1: "Collect all commits for task (git log --grep=task_id)"
              2: "Analyze commit sequence against plan phases"
              3: "Run plan fidelity check"
              4: "Run cross-layer coherence verification"
              5: "Run LENS analysis on final codebase"
              6: "Generate review report with recommendations"
              7: "Determine PASS/FAIL/CONDITIONAL_PASS"
            
          - name: "generate_implementation_report"
            signature: "(review: FinalReviewResult) -> ImplementationReport"
            description: "Generate human-readable implementation report"
            sections:
              - "Executive Summary (pass/fail, score)"
              - "Plan Adherence (what was planned vs implemented)"
              - "Quality Metrics (test coverage, complexity)"
              - "Security Status (vulnerabilities introduced?)"
              - "Recommendations (follow-up actions)"
              
    review_criteria:
      must_pass:
        - "All planned artifacts exist"
        - "All tests pass (unit + integration + contract)"
        - "No HIGH/CRITICAL security vulnerabilities introduced"
        - "Plan fidelity score >= 80%"
        
      should_pass:
        - "Commit messages reference task/phase"
        - "No extra unplanned files"
        - "LENS complexity within acceptable range"
        
      nice_to_have:
        - "Documentation updated"
        - "Changelog entry added"
        
    review_outcomes:
      PASS:
        criteria: "All must_pass + majority of should_pass"
        action: "Report success to user"
        
      CONDITIONAL_PASS:
        criteria: "All must_pass, some should_pass failed"
        action: "Report success with recommendations"
        
      FAIL:
        criteria: "Any must_pass failed"
        action: "Block completion, report issues, require fixes"
        
    async_behavior:
      description: |
        Review runs asynchronously to not block user:
        1. Report "Implementation complete, review in progress..."
        2. Run full review in background
        3. Emit FINAL_REVIEW_COMPLETE event
        4. Update user with final status (badge/notification)
      timeout: "60 seconds max"
      fallback: "If timeout, report CONDITIONAL_PASS with warning"
      
  integration_with_interaction:
    flow: |
      IMPLEMENTATION_COMPLETE event
          ↓
      ReviewOrchestrator.execute_final_review()
          ↓
      FINAL_REVIEW_COMPLETE event
          ↓
      InteractionOrchestrator receives result
          ↓
      Report to user:
        - PASS: "✅ Implementation complete and verified"
        - CONDITIONAL_PASS: "✅ Implementation complete (see recommendations)"
        - FAIL: "❌ Implementation has issues (see report)"

