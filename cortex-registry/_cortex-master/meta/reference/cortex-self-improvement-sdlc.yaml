        multi_layer_coordination:
          title: "Cross-Layer Design Coordination"
          description: |
            When a feature touches multiple layers:
            - Backend (Python): API, data models, orchestrators
            - Frontend (JavaScript): UI components, data binding
            - Data (JSON/SQL): Schema, migrations, contracts
            
            Ensure all layers are designed together:
            - Shared interface contracts
            - Field name mapping
            - Type alignment
            - Test coverage per layer
          methods:
            - name: "coordinate_multi_layer_design"
              signature: "(task: Dict, layers: List[str]) -> MultiLayerDesign"
              description: "Coordinate design across identified layers"
              
            - name: "validate_layer_contracts"
              signature: "(design: MultiLayerDesign) -> ContractValidation"
              description: "Validate all layers can work together"
              
        enhanced_challenge:
