# ============================================================================
# ARCHITECTURAL ENHANCEMENT: EVENT-DRIVEN ORCHESTRATOR MESH
# ============================================================================

event_driven_architecture:
  overview: |
    Replace direct orchestrator coupling with an event-driven mesh where:
    1. Orchestrators advertise capabilities via event subscriptions
    2. InteractionOrchestrator emits classified events
    3. Relevant orchestrators react based on subscriptions
    4. MasterOrchestrator observes all events for audit + coordination
    
  benefits:
    - "Decoupled: Orchestrators don't import each other"
    - "Extensible: Add new orchestrators via subscriptions, no code changes"
    - "Testable: Each orchestrator testable in isolation"
    - "Async-ready: Events can be processed in parallel"
    - "Observable: Full event stream for debugging"
    
  event_bus:
    location: "cortex/infrastructure/orchestrator_event_bus.py"
    interface: |
      class OrchestratorEventBus:
          def publish(self, event: OrchestratorEvent) -> None
          def subscribe(self, event_type: str, handler: Callable) -> None
          def unsubscribe(self, event_type: str, handler: Callable) -> None
          def get_event_history(self, since: datetime) -> List[OrchestratorEvent]
          
  event_types:
    request_events:
      - name: "REQUEST_RECEIVED"
        emitter: "InteractionOrchestrator"
        data: "{user_request, session_id, timestamp}"
        subscribers: ["MasterOrchestrator (observe)"]
        
      - name: "INTENT_CLASSIFIED"
        emitter: "IntentRouter"
        data: "{intent, confidence, complexity, target_modules}"
        subscribers: ["MasterOrchestrator (observe)", "PlanningOrchestrator (conditional)"]
        
      - name: "PLANNING_REQUIRED"
        emitter: "InteractionOrchestrator"
        data: "{task_spec, complexity_level, layers_involved}"
        subscribers: ["PlanningOrchestrator"]
        trigger_condition: "complexity >= SIMPLE AND intent == IMPLEMENT"
        
    planning_events:
      - name: "PLAN_GENERATED"
        emitter: "PlanningOrchestrator"
        data: "{code_level_plan, coherence_report, estimated_effort}"
        subscribers: ["InteractionOrchestrator", "TDDOrchestrator"]
        
      - name: "PLAN_APPROVED"
        emitter: "InteractionOrchestrator"
        data: "{plan_id, user_approval_timestamp}"
        subscribers: ["TDDOrchestrator", "MasterOrchestrator (observe)"]
        
    execution_events:
      - name: "PHASE_STARTED"
        emitter: "TDDOrchestrator"
        data: "{phase_id, phase_spec, plan_id}"
        subscribers: ["MasterOrchestrator (observe)", "ReviewOrchestrator"]
        
      - name: "PHASE_COMPLETE"
        emitter: "TDDOrchestrator"
        data: "{phase_id, artifacts_created, tests_passed}"
        subscribers: ["ReviewOrchestrator", "PlanningOrchestrator"]
        
      - name: "PHASE_REVIEW_COMPLETE"
        emitter: "ReviewOrchestrator"
        data: "{phase_id, review_result, issues_found}"
        subscribers: ["TDDOrchestrator (gate next phase)", "MasterOrchestrator (observe)"]
        
    completion_events:
      - name: "IMPLEMENTATION_COMPLETE"
        emitter: "TDDOrchestrator"
        data: "{task_id, all_phases_complete, total_artifacts}"
        subscribers: ["ReviewOrchestrator (trigger final review)"]
        
      - name: "FINAL_REVIEW_STARTED"
        emitter: "ReviewOrchestrator"
        data: "{task_id, review_scope}"
        subscribers: ["MasterOrchestrator (observe)"]
        
      - name: "FINAL_REVIEW_COMPLETE"
        emitter: "ReviewOrchestrator"
        data: "{task_id, holistic_review_result, plan_implementation_score}"
        subscribers: ["InteractionOrchestrator (report to user)"]
        
  complexity_gating:
    purpose: "Automatically determine when planning is needed"
    location: "cortex/orchestrators/core/complexity_classifier.py"
    levels:
      TRIVIAL:
        criteria: "LOC impact < 5, single file, no new functions"
        planning_required: false
        examples: ["typo fix", "comment update", "log message change"]
        
      SIMPLE:
        criteria: "LOC impact 5-50, single module, ≤3 new functions"
        planning_required: true
        planning_depth: "lightweight (file specs only)"
        examples: ["add helper function", "extend existing class"]
        
      MODERATE:
        criteria: "LOC impact 50-200, single layer, new class/module"
        planning_required: true
        planning_depth: "standard (file + function specs)"
        examples: ["new orchestrator", "new MCP tool"]
        
      COMPLEX:
        criteria: "LOC impact > 200, multiple layers, cross-module"
        planning_required: true
        planning_depth: "full (file + function + interface contracts)"
        examples: ["new feature system", "architecture change"]
        
      CRITICAL:
        criteria: "Breaking changes, security-sensitive, governance-affecting"
        planning_required: true
        planning_depth: "full + mandatory challenge + extended review"
        examples: ["auth system changes", "data model migrations"]
        
    classification_method: |
      def classify_complexity(task: Dict, lens_context: LENSContext) -> ComplexityLevel:
          # Analyze task description
          loc_estimate = estimate_loc_impact(task, lens_context)
          layers_affected = identify_affected_layers(task, lens_context)
          modules_touched = count_modules(task, lens_context)
          security_sensitive = check_security_sensitivity(task)
          
          if security_sensitive or is_governance_affecting(task):
              return ComplexityLevel.CRITICAL
          elif len(layers_affected) > 1 or loc_estimate > 200:
              return ComplexityLevel.COMPLEX
          elif modules_touched > 1 or loc_estimate > 50:
              return ComplexityLevel.MODERATE
          elif loc_estimate > 5:
              return ComplexityLevel.SIMPLE
          else:
              return ComplexityLevel.TRIVIAL

