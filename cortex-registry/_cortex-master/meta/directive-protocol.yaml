# CORTEX Directive Protocol (CDP) - Architecture & Governance
# Version: 1.0.0
# Status: Foundation Complete
# Authority: Single Source of Truth for directive system

version: 1.0.0
status: foundation_complete
completion_date: 2026-02-06T00:00:00Z

# System Overview
overview:
  description: "Machine-readable directive system replacing bloated markdown prompts"
  problem: "cortex-architect.prompt.md = 2948 lines, causing token waste and maintenance overhead"
  solution: "YAML-based directives with JSON Schema validation, lazy loading, context-aware pruning"
  token_reduction: 75-86  # Percentage
  
  benefits:
    - "O(1) directive lookup via index registry"
    - "60-80% token reduction for single-intent requests"
    - "Composition via inheritance (DRY principle)"
    - "Schema validation prevents drift"
    - "Versioned with deprecation paths"
    - "Auto-generated human docs from machine source"

# Architecture
architecture:
  components:
    registry:
      location: cortex-registry/_cortex-master/directives/
      structure:
        - core/              # System prompts
        - agents/core/       # Core agents
        - agents/domain/     # Domain-specific agents
        - knowledge/         # Best practices
        - schema.json        # JSON Schema validator
      
    index:
      location: cortex-registry/_cortex-master/meta/directive-index.yaml
      purpose: "O(1) lookup registry with metadata"
      fields:
        - id
        - version
        - path
        - replaces
        - status
        - token_budget
        - intent_patterns
        
    loader:
      location: cortex/brain/core/directive_loader.py
      capabilities:
        - load_directive(name, context_hints, version)
        - validate_directive(path)
        - compile_directive(name, format)
        - Context-aware pruning (60-80% reduction)
        - LRU caching (5min TTL)
        
    mcp_tools:
      - cortex_load_directive: "Load directive with pruning"
      - cortex_validate_directive: "Schema validation"
      - cortex_compile_directive: "Resolve inheritance + format"
      - cortex_directive_diff: "Semantic version comparison"

  data_flow: |
    User Request → IntentRouter → LENS Classification
         ↓
    Load directive via cortex_load_directive(name, intent_hints)
         ↓
    DirectiveLoader:
      1. Check cache (LRU, 5min TTL)
      2. Lookup in directive-index.yaml (O(1))
      3. Load YAML file
      4. Prune based on context_hints (60-80% reduction)
      5. Cache result
         ↓
    Return minimal YAML subset to orchestrator
         ↓
    Execute based on capabilities/constraints

# Governance Rules (New ARCH-* series)
governance:
  ARCH-050:
    name: "Directive-First Prompts"
    enforcement: BLOCKING
    description: "All new prompts MUST use .directive.yaml format"
    violations:
      - "New .prompt.md files (except legitimate docs)"
      - "Prompts >500 lines without directive migration plan"
    remediation: "Migrate to directives/core/{name}.directive.yaml"
    
  ARCH-051:
    name: "Agent Specification Format"
    enforcement: BLOCKING
    description: "Agents MUST use structured YAML with capabilities/constraints/examples"
    violations:
      - "Agent docs >500 lines"
      - "Freeform markdown without structure"
    remediation: "Use directives/agents/{domain}/{name}.directive.yaml"
    metrics:
      - "Token efficiency score <200 tokens/capability"
    
  ARCH-052:
    name: "Directive Composition"
    enforcement: BLOCKING
    description: "Use inherits_from or extends, NOT copy-paste"
    violations:
      - ">70% similarity between directives"
    detection: "cortex_detect_duplicates on directives/"
    remediation: "Extract common capabilities to base directive"
    
  ARCH-053:
    name: "Token Budget Enforcement"
    enforcement: WARNING
    description: "Directives MUST declare token_budget and stay within ±20%"
    violations:
      - "Actual usage > declared budget * 1.2"
    monitoring: "cortex_load_directive emits token_usage metric"
    action: "Log warning, update budget if persistent"
    
  ARCH-054:
    name: "Breaking Change Gating"
    enforcement: BLOCKING
    description: "Version bumps MUST include replaces metadata and deprecation path"
    violations:
      - "Major version change without replaces field"
      - "Deprecated directive without deprecation_date"
    remediation: "Add 30-day deprecation window, update index"

