# Integration Points
integration:
  mcp_gateway:
    endpoints:
      - "GET /directives/{name}"
      - "GET /directives/{name}/{version}"
      - "POST /directives/validate"
      - "GET /directives/index"
    caching: "In-memory with 5min TTL, invalidate on git pull"
    
  enforcement_orchestrator:
    agent: DirectiveComplianceAgent
    checks:
      - "Pre-execution: Validate directive exists, not deprecated"
      - "Runtime: Monitor token usage vs budget"
      - "Post-execution: Validate success criteria met"
      
  documentation:
    auto_generation:
      trigger: "Pre-commit hook"
      input: "directives/**/*.directive.yaml"
      output: "docs/directives/{name}.md"
      format: "Human-readable markdown from YAML"
      
  challenge_engine:
    usage: "Use directives as source of truth for challenge generation"
    validation: "Compare execution against declared constraints"

# File Placement Rules
file_placement:
  prompts:
    legacy: ".github/prompts/*.prompt.md"
    new: "cortex-registry/_cortex-master/directives/core/*.directive.yaml"
    deprecation: "30-day window, keep both during transition"
    
  agents:
    legacy: ".github/agents/**/*.md"
    new: "cortex-registry/_cortex-master/directives/agents/**/*.directive.yaml"
    deprecation: "30-day window"
    
  knowledge:
    legacy: "cortex/knowledge/best-practices/*.md"
    new: "cortex-registry/_cortex-master/directives/knowledge/*.directive.yaml"
    
  documentation:
    human_readable: "docs/directives/*.md (auto-generated, never edit)"
    source_of_truth: "directives/**/*.directive.yaml"

# Token Optimization
token_optimization:
  baseline: "cortex-architect.prompt.md = 2948 lines = ~12,000 tokens"
  
  strategies:
    context_aware_pruning:
      description: "Load only capabilities matching intent_patterns"
      reduction: "60-80%"
      example: "AUDIT intent → load only audit capability (150 tokens vs 500)"
      
    lazy_agent_loading:
      description: "Load agents based on mode (AUDIT/DESIGN/PLAN)"
      reduction: "70-85%"
      example: "AUDIT → 2 agents (300 tokens) vs 6 agents (1800 tokens)"
      
    inheritance_flattening:
      description: "Resolve inherits_from at compile time, cache result"
      reduction: "30-50%"
      
    caching:
      description: "LRU cache with 5min TTL"
      hit_rate_target: 70
      
  measurement:
    before_request: "Log token count from DirectiveLoader"
    after_request: "Compare actual vs budgeted usage"
    metrics: "cortex_directive_token_usage_bytes"

