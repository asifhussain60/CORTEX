# 🎨 Enhanced Response Template with Visual Hierarchy
# Purpose: GitHub Copilot Chat optimized response formatting with visual distinction
# Version: 2.0
# Authority: CORTEX-ARCH-014 + Visual Enhancement Pattern Analysis (2026-02-09)
# Effective: 2026-02-09

# ============================================================================
# VISUAL HIERARCHY PRINCIPLES (GitHub Copilot Chat Optimized)
# ============================================================================

# Based on analysis of effective Copilot Chat patterns:
# 1. Large emoji headers (🔧 🔨 📋) for major sections
# 2. Bold text for subsection titles
# 3. Code blocks with syntax highlighting for commands
# 4. Clear numbered options for decision points
# 5. Consistent spacing (blank lines between sections)
# 6. Status-aware emoji prefixes (no HTML color - not supported)

# EMOJI STATUS CODES (Visual Hierarchy)
color_codes:
  complete: "✅"           # SUCCESS/PASSED/READY
  excellent: "🟢"          # EXCELLENT/OPTIMAL
  in_progress: "🔵"        # IN PROGRESS/ACTIVE
  pending: "🟠"            # PENDING/NEXT/TODO
  blocked: "🔴"            # BLOCKED/CRITICAL
  failed: "❌"             # FAILED/ERROR
  warning: "⚠️"            # WARNING/CAUTION
  critical: "🚨"           # CRITICAL BLOCKER
  danger: "🔴"             # DANGER/ALERT
  design: "🎨"             # DESIGN/ANALYSIS
  information: "ℹ️"        # INFORMATION
  next: "➡️"               # NEXT STEPS
  
  # Large Section Headers (Primary Visual Anchors)
  remediation: "🔧"        # REMEDIATION PLAN
  action: "📋"             # NEXT ACTIONS
  implementation: "🔨"     # IMPLEMENTATION PLAN
  progress: "📊"           # PROGRESS REPORT
  analysis: "🔍"           # ANALYSIS RESULTS

# ============================================================================
# RESPONSE TEMPLATES (GitHub Copilot Chat Format)
# ============================================================================

templates:
  # Large Header Pattern (Primary Visual Anchor)
  large_section_header:
    format: |
      # {emoji} {TITLE_UPPERCASE}
      
      {subtitle_or_status}
    examples:
      - "# 🔧 REMEDIATION PLAN"
      - "# 📋 NEXT ACTIONS"
      - "# 🔨 IMPLEMENTATION PLAN"
  
  # Standard Response with Visual Hierarchy
  standard_response:
    header: |
      ## 🧠 CORTEX {mode}
      **Author:** {author} | **Mode:** {mode} {status_badge}
      
      ---
      
    sections:
      - name: "remediation_plan"
        emoji: "🔧"
        size: "large"
        format: |
          # 🔧 REMEDIATION PLAN
          
          {priority_level}
          
          ## {numbered_item}. {action_title} ({impact_badge})
          
          ```{language}
          {code_block}
          ```
          
      - name: "next_actions"
        emoji: "📋"
        size: "large"
        format: |
          # 📋 NEXT ACTIONS
          
          **Option {number}: {action_title}** ({time_estimate})
          
          ```{language}
          # {comment}
          {command}
          ```
          
      - name: "progress"
        emoji: "📊"
        size: "medium"
        format: |
          ## 📊 Progress Summary
          
          [{progress_bar}] {percent}% | {current}/{total} {metric}
          
      - name: "completed_items"
        emoji: "✅"
        status: "complete"
        format: |
          ## ✅ COMPLETED WORK
          **Status:** 🟢 COMPLETE
          
          ### {item_name}
          - ✅ {achievement1}
          - ✅ {achievement2}
          - ✅ {achievement3}
          
      - name: "in_progress_items"
        emoji: "🔵"
        status: "in_progress"
        format: |
          ## 🔵 IN PROGRESS WORK
          **Status:** 🟠 PENDING
          
          ### {item_name}
          - 🔵 {current_task}
          - ⚪ {next_task}
          - ⚪ {future_task}
          
      - name: "blocked_items"
        emoji: "🔴"
        status: "blocked"
        format: |
          ## 🔴 BLOCKED / CRITICAL
          **Status:** 🚨 BLOCKER
          
          ### {item_name}
          - ❌ {blocker_reason}
          - 📋 {resolution_path}
          - ⏱️ {estimated_unblock_time}
          
      - name: "next_steps_with_options"
        emoji: "📋"
        status: "pending"
        format: |
          # 📋 NEXT ACTIONS
          
          **Option {number}: {action_title}** ({time_estimate})
          
          ```{language}
          # {description}
          {command_or_code}
          ```

# ============================================================================
# VISUAL FORMATTING RULES (Copilot Chat Best Practices)
# ============================================================================

visual_hierarchy:
  font_sizes:
    large_header: "# {emoji} {UPPERCASE_TITLE}"
    medium_header: "## {emoji} {Title Case}"
    small_header: "### {Title Case}"
    emphasis: "**Bold Text**"
    code: "`inline_code`"
    
  spacing:
    after_large_header: 2  # blank lines
    after_medium_header: 1  # blank line
    before_code_block: 1  # blank line
    after_code_block: 1  # blank line
    between_options: 1  # blank line
    
  status_badges:
    complete: " ✅"
    success: " ✅"
    in_progress: " 🔵"
    pending: " 🟠"
    blocked: " 🔴"
    critical: " 🚨"
    warning: " ⚠️"
    danger: " 🔴"
    
  code_blocks:
    - language: "bash"
      use_for: "Shell commands"
    - language: "python"
      use_for: "Python code"
    - language: "yaml"
      use_for: "Configuration"
    - language: "json"
      use_for: "Structured data"

# ============================================================================
# PATTERN EXAMPLES (From Effective Copilot Chat Responses)
# ============================================================================

pattern_examples:
  large_remediation_plan:
    pattern: |
      # 🔧 REMEDIATION PLAN
      
      {priority_section}
      
      ## 1. {Action Title} ({HIGHEST IMPACT})
      
      ```yaml
      # {Description}
      {code_content}
      ```
    
  next_actions_with_options:
    pattern: |
      # 📋 NEXT ACTIONS
      
      **Option 1: {Action Title}** ({time_estimate})
      
      ```bash
      # {Ready to implement}
      {command}
      ```
      
      **Option 2: {Alternative Action}**
      
      ```bash
      # {Alternative approach}
      {alternative_command}
      ```
      
  progress_with_status:
    pattern: |
      ## 📊 PROGRESS SUMMARY
      
      [{progress_bar}] {percent}%
      
      ### ✅ Completed
      - Item 1
      - Item 2
      
      ### 🔵 In Progress
      - Current item
      
      ### ⚪ Pending
      - Future item

# Markdown Rendering Notes (GitHub Copilot Chat Limitations)
rendering_notes:
  supported:
    - "# H1 headers (large font)"
    - "## H2 headers (medium font)"
    - "**Bold text**"
    - "`inline code`"
    - "```language code blocks```"
    - "Emoji prefixes"
    - "Numbered lists"
    - "Bullet lists"
    
  not_supported:
    - "HTML <span> with inline styles (renders as text)"
    - "CSS color codes (ignored)"
    - "Custom fonts (default only)"
    - "Background colors"
    
  workarounds:
    color_indication: "Use status emoji (✅🔵🔴🟠) instead of HTML colors"
    emphasis: "Use **bold**, *italic*, `code` formatting"
    hierarchy: "Use # ## ### heading levels for font size"
    sections: "Use horizontal rules --- for separation"

header_patterns:
  # Pattern 1: Completion
  "## ✅ {title}":
    use_when: "section is complete, all tasks done, no blockers"
    example: "## ✅ FIX 1: MCP Governance Tools Implementation"
    visual: "Bright green header"
    
  # Pattern 2: In Progress
  "## 🔵 {title}":
    use_when: "section is actively being worked on, pending completion"
    example: "## 🔵 FIX 2: YAML Loader Enhancement"
    visual: "Orange header with blue indicator"
    
  # Pattern 3: Blocked/Critical
  "## 🔴 {title}":
    use_when: "section has blockers, critical issues, or failures"
    example: "## 🔴 DEPLOYMENT: Database Migration Failed"
    visual: "Red header for critical attention"
    
  # Pattern 4: Next/Planning
  "## ➡️ {title}":
    use_when: "section describes upcoming work, not yet started"
    example: "## ➡️ NEXT PHASE: Source Code Consolidation"
    visual: "Orange header for future work"
    
  # Pattern 5: Analysis/Design
  "## 🎨 {title}":
    use_when: "section is design, analysis, or planning phase"
    example: "## 🎨 DESIGN: Enhanced Response Template"
    visual: "Blue header for neutral/informational"

# Enhanced Session Summary Template (Mandatory Format)
session_summary_template:
  header: |
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## ✅ SESSION SUMMARY
    **Session:** {session_name} | **Status:** {status_emoji} {status_text}
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    
  sections:
    - id: "token_budget"
      header: "## 📊 Token Usage"
      required: true
      order: 1
      content: |
        **Used:** {tokens_used}k / {tokens_total}k ({percent}%)
        **Status:** {budget_status_emoji} {budget_status_text}
        
    - id: "completed"
      header: "## ✅ COMPLETED"
      color: "green"
      order: 2
      content: |
        | Item | Metric | Status |
        |------|--------|--------|
        | {item} | {metric} | ✅ {status} |
        
    - id: "in_progress"
      header: "## 🔵 IN PROGRESS"
      color: "orange"
      order: 3
      content: |
        | Item | Progress | ETA |
        |------|----------|-----|
        | {item} | {progress}% | {eta} |
        
    - id: "blocked"
      header: "## 🔴 BLOCKED"
      color: "red"
      order: 4
      content: |
        | Item | Blocker | Resolution |
        |------|---------|------------|
        | {item} | {blocker} | {resolution} |
        
    - id: "metrics"
      header: "## 📈 Quality Metrics"
      color: "neutral"
      order: 5
      content: |
        | Metric | Value | Target |
        |--------|-------|--------|
        | Tests | {tests_pass}/{tests_total} | 100% |
        | Coverage | {coverage}% | {coverage_target}% |
        | Errors | {errors} | 0 |
        
    - id: "next_steps"
      header: "## ➡️ NEXT STEPS"
      color: "orange"
      order: 6
      content: |
        1. {step1}
        2. {step2}
        3. {step3}

# Markdown Color Simulation Techniques
# Since Markdown doesn't support inline colors natively, use:
markdown_color_techniques:
  # Technique 1: Emoji Prefixes (RECOMMENDED - Works everywhere)
  emoji_prefix:
    complete: "✅"
    in_progress: "🔵"
    blocked: "🔴"
    next: "➡️"
    design: "🎨"
    example: |
      ## ✅ COMPLETED WORK
      ## 🔵 IN PROGRESS
      ## 🔴 BLOCKED ITEMS
      ## ➡️ NEXT STEPS
    advantage: "Works in all Markdown viewers"
    limitation: "Not true colors, but effective visual distinction"
    
  # Technique 2: Bold with Status Word (SUPPLEMENT)
  bold_status:
    example: |
      ## **COMPLETED:** MCP Governance Tools
      ## **IN PROGRESS:** YAML Loader Enhancement
      ## **BLOCKED:** Database Migration
    advantage: "Clear text-based indication"
    limitation: "Less visually distinct"
    
  # Technique 3: HTML Color Codes (If supported)
  html_colors:
    complete: '<span style="color: #00AA00">## COMPLETED: {title}</span>'
    in_progress: '<span style="color: #FF8800">## IN PROGRESS: {title}</span>'
    blocked: '<span style="color: #FF0000">## BLOCKED: {title}</span>'
    advantage: "True colors if HTML supported"
    limitation: "Not supported in all Markdown renderers (GitHub, VS Code markdown preview)"
    recommendation: "Use emoji + bold as primary, HTML as fallback"

# Agent Integration Rules
agent_rules:
  session_start:
    - "Load this template YAML"
    - "Detect session status (complete/in_progress/blocked)"
    - "Apply appropriate emoji prefix to main header"
    - "Use status badges throughout response"
    
  section_creation:
    - "Determine section status (BEFORE writing content)"
    - "Choose appropriate emoji from color_codes"
    - "Format header as: ## {emoji} {title}"
    - "Maintain status consistency throughout section"
    
  status_propagation:
    - "Single failed test → mark section as 🔵 (in_progress) or 🔴 (blocked)"
    - "All tests passing → mark section as ✅ (complete)"
    - "Awaiting user input → mark as 🟠 (pending)"
    - "Partial work → use 🔵 (in_progress)"
    
  color_override_rules:
    - "If ANY critical issue exists → use 🔴 (red)"
    - "If NO blockers BUT work remaining → use 🔵 (orange)"
    - "If ALL work complete → use ✅ (green)"
    - "If planning phase → use ➡️ (orange) or 🎨 (blue)"

# Example Usage in Responses
example_response:
  "## ✅ FIX 1: Comprehensive MCP Governance Tools":
    explains: "Section is COMPLETE - use green emoji"
    template: |
      ## ✅ FIX 1: Comprehensive MCP Governance Tools
      **Status:** 🟢 COMPLETE | **Tests:** 23/23 ✅
      
      - ✅ 5 production-grade MCP tools implemented
      - ✅ Zero stubs, all real logic
      - ✅ Audit trail integration complete
      
  "## 🔵 FIX 2: YAML Loader Enhancement":
    explains: "Section is IN PROGRESS - use orange emoji"
    template: |
      ## 🔵 FIX 2: YAML Loader Enhancement
      **Status:** 🟠 IN PROGRESS | **Progress:** 80%
      
      - ✅ TierRulesLoader created
      - 🔵 Test suite being expanded
      - ⚪ Final validation pending
      
  "## 🔴 DEPLOY: Critical Database Issue":
    explains: "Section has BLOCKERS - use red emoji"
    template: |
      ## 🔴 DEPLOY: Critical Database Issue
      **Status:** 🚨 BLOCKED | **Fix ETA:** 2h
      
      - ❌ Migration script failed
      - 📋 Rollback in progress
      - ⏳ Awaiting verification
      
  "## ➡️ NEXT: Source Code Consolidation":
    explains: "Section is UPCOMING - use orange emoji"
    template: |
      ## ➡️ NEXT: Source Code Consolidation
      **Status:** ⚪ PLANNED | **Effort:** 2-3h
      
      - Move src/components → cortex-lens/
      - Update imports across codebase
      - Run integration tests

# Integration with cortex-architect.prompt.md
prompt_integration:
  when_loading: "Load this template YAML on every session"
  when_creating_responses: "Check template for appropriate emoji + status"
  when_displaying_headers: "Always use emoji prefix for semantic color coding"
  when_summarizing: "Apply session_summary_template with proper status badges"
  
# Token-Optimized Color Reference (Quick Copy)
quick_reference: |
  ✅ = COMPLETE/SUCCESS (green)
  🔵 = IN PROGRESS (orange)
  🔴 = BLOCKED/CRITICAL (red)
  ➡️ = NEXT/PENDING (orange)
  🎨 = DESIGN/ANALYSIS (blue)
  ⚪ = PLANNED/TODO (gray)
  ⚠️ = WARNING/CAUTION (yellow)
  🚨 = CRITICAL BLOCKER (red alert)
  ❌ = FAILED/ERROR (red)
  ℹ️ = INFORMATION (blue)

