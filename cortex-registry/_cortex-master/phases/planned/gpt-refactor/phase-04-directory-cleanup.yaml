# ==============================================================================
# PHASE 04 — DIRECTORY CLEANUP: Eliminate small/redundant directories
# ==============================================================================
# Purpose: Reduce cortex/ top-level directories from ~50 to ~15 canonical ones
# Gate: Clean directory tree, all imports resolve, all tests pass
# ==============================================================================

phase:
  id: "phase-04"
  name: "Directory Cleanup — Eliminate small/redundant directories"
  status: "pending"
  priority: "P1"
  estimated_effort: "3-5 days"
  risk: "medium"
  depends_on: ["phase-03"]
  description: |
    After phases 01-03, cortex/ still has ~50 top-level subdirectories.
    Many contain 1-5 files and could be absorbed into canonical directories.
    This phase consolidates small directories into their natural homes,
    achieving a clean ~15-directory structure.

    Target structure:
      cortex/
      ├── core/              (kernel: base classes, DI, event bus, file factory, workflow engine)
      ├── governance/        (rules, enforcement, audit — ONE location)
      ├── intelligence/      (LENS, domain brain, memory, analysis, NLP, reasoning)
      ├── orchestrators/     (ALL orchestrators — flat registry)
      ├── mcp/               (external API surface)
      ├── infrastructure/    (logging, tracing, DB, caching, security, devx)
      ├── observability/     (metrics, visibility, reports)
      ├── models/            (all data models, enums, events)
      ├── config/            (configuration loading)
      ├── testing/           (test scaffolding, demand generator)
      ├── cli/               (CLI interface)
      ├── templates/         (code templates, scaffolding)
      ├── api/               (API layer)
      └── tools/             (standalone tools, utilities)

  # ============================================================================
  # DIRECTORY CONSOLIDATION MAP
  # ============================================================================
  consolidations:
    # --- Small directories (1-5 files) → absorbed ---
    - from: "cortex/automation/ (3 files)"
      to: "cortex/infrastructure/automation/"
      rationale: "Too small for own directory, automation is infra"

    - from: "cortex/capacity/ (3 files)"
      to: "cortex/infrastructure/capacity/"
      rationale: "Capacity planning is infrastructure concern"

    - from: "cortex/collaboration/ (3 files)"
      to: "cortex/infrastructure/collaboration/"
      rationale: "Too small, team collaboration tooling is infra"

    - from: "cortex/confirmation/ (2 files)"
      to: "cortex/core/confirmation/"
      rationale: "Confirmation flow is core interaction concern"

    - from: "cortex/domain_brain/ (13 files)"
      to: "cortex/intelligence/domain_brain/"
      rationale: "Already consolidated in Phase 01/02"
      condition: "Only if not already done"

    - from: "cortex/domain_orchestrators/ (5 files)"
      to: "cortex/orchestrators/domain/"
      rationale: "All orchestrators go to cortex/orchestrators/"

    - from: "cortex/enforcement/ (1 file)"
      to: "cortex/governance/enforcement/"
      rationale: "Enforcement is governance concern"

    - from: "cortex/execution/ (21 files)"
      to: "cortex/core/execution/"
      rationale: "Execution engine is core kernel concern"

    - from: "cortex/explainability/ (3 files)"
      to: "cortex/intelligence/explainability/"
      rationale: "Explainability is intelligence concern"

    - from: "cortex/intent_router/ (19 files)"
      to: "cortex/orchestrators/core/intent_router/"
      rationale: "Intent routing is core orchestration — already has IntentRouter"

    - from: "cortex/interaction/ (14 files)"
      to: "cortex/core/interaction/"
      rationale: "Interaction patterns (BLUF, DoR) are core concerns"

    - from: "cortex/knowledge/ (6 files)"
      to: "cortex/intelligence/knowledge/"
      rationale: "Knowledge is intelligence concern"

    - from: "cortex/learning/ (26 files)"
      to: "cortex/intelligence/learning/"
      rationale: "Learning is intelligence concern"

    - from: "cortex/devx/ (11 files)"
      to: "cortex/infrastructure/devx/"
      rationale: "Developer experience tooling is infrastructure"

    - from: "cortex/reports/ (1 file)"
      to: "cortex/observability/reports/"
      rationale: "Reporting is observability concern"

    - from: "cortex/repositories/ (4 files)"
      to: "cortex/infrastructure/repositories/"
      rationale: "Repository management is infrastructure"

    - from: "cortex/scripts/ (6 files)"
      to: "scripts/ (top-level)"
      rationale: "Scripts are not a Python package"

    - from: "cortex/sensory/ (4 files)"
      to: "cortex/intelligence/sensory/"
      rationale: "Sensory processing is intelligence"

    - from: "cortex/sts/ (1 file)"
      to: "cortex/testing/sts/"
      rationale: "STS is a testing/evaluation concern"

    - from: "cortex/versioning/ (3 files)"
      to: "cortex/infrastructure/versioning/"
      rationale: "Version management is infrastructure"

    - from: "cortex/debugging/ (8 files)"
      to: "cortex/orchestrators/support/debugging/"
      rationale: "Debugging support is orchestrator concern"

    - from: "cortex/deployment/ (13 files)"
      to: "cortex/infrastructure/deployment/"
      rationale: "Deployment is infrastructure concern"

    - from: "cortex/documentation/ (9 files)"
      to: "cortex/intelligence/documentation/"
      rationale: "Doc generation is intelligence (analysis) concern"

    - from: "cortex/refactoring/ (9 files)"
      to: "cortex/orchestrators/domain/refactoring/"
      rationale: "Refactoring adapters support RefactoringOrchestrator"

    - from: "cortex/secrets/ (17 files)"
      to: "cortex/infrastructure/security/secrets/"
      rationale: "Secrets management is security infrastructure"

    - from: "cortex/security/ (4 files)"
      to: "cortex/infrastructure/security/"
      rationale: "Already has infrastructure/security/"

    - from: "cortex/storage/ (11 files)"
      to: "cortex/infrastructure/storage/"
      rationale: "Storage is infrastructure concern"

    - from: "cortex/visualization/ (42 files)"
      to: "cortex/dashboards/"
      rationale: "Visualization serves dashboards — consolidate"

    - from: "cortex/wiring/ (12 files)"
      to: "cortex/core/wiring/"
      rationale: "Wiring/DI is kernel concern"

    - from: "cortex/bootstrap/ (2 files)"
      to: "cortex/core/bootstrap/"
      rationale: "Bootstrap is kernel concern"

    - from: "cortex/registry/ (21 files)"
      to: "cortex/core/registry/"
      rationale: "Internal registry is kernel concern"

    - from: "cortex/toolkit/ (13 files)"
      to: "cortex/tools/toolkit/"
      rationale: "Toolkit is tools subfolder"

    - from: "cortex/ci_cd/ (6 files)"
      to: "cortex/infrastructure/ci_cd/"
      rationale: "CI/CD is infrastructure concern"

    - from: "cortex/common/ (12 files)"
      to: "cortex/core/common/"
      rationale: "Common utilities are kernel concern"

    # --- Previously uncovered directories (gap from prior plan) ---
    - from: "cortex/agents/ (11 files)"
      to: "cortex/orchestrators/agents/"
      rationale: "Agents are orchestration patterns — belong under orchestrators"

    - from: "cortex/validation/ (5 files)"
      to: "cortex/governance/validation/"
      rationale: "Validation is governance concern"

    - from: "cortex/cortex-registry/ (inner duplicate)"
      to: "DELETE — data belongs in top-level cortex-registry/"
      rationale: "Inner copy of registry data is SSOT violation"
      action: "Move unique artifacts/knowledge-base to top-level, delete inner"

    - from: "cortex/cortex_intelligence/ (inner empty duplicate)"
      to: "DELETE"
      rationale: "Empty duplicate of top-level cortex_intelligence"

    - from: "cortex/tests/ (8 inner test files)"
      to: "tests/ (top-level)"
      rationale: "Tests must not live inside source package"

  # ============================================================================
  # RESULTING CLEAN STRUCTURE
  # ============================================================================
  target_structure:
    cortex:
      core:
        description: "Kernel — stable foundation"
        subdirs:
          - "bootstrap/"
          - "common/"
          - "confirmation/"
          - "decorators/"
          - "execution/"
          - "interaction/"
          - "interfaces/"
          - "registry/"
          - "wiring/"
        key_files:
          - "orchestrator_base.py"
          - "file_factory.py"
          - "workflow_engine.py"
          - "master_orchestrator_gateway.py"
          - "brain_populator.py"
          - "event_bus.py"

      governance:
        description: "Rules, enforcement, audit — ONE location"
        subdirs:
          - "enforcement/"
          - "verification/"
          - "state/"
          - "validation/"

      intelligence:
        description: "LENS, domain brain, memory, analysis"
        subdirs:
          - "lens/"
          - "domain_brain/"
          - "memory/"
          - "analysis/"
          - "discovery/"
          - "documentation/"
          - "explainability/"
          - "knowledge/"
          - "learning/"
          - "nlp/"
          - "perception/"
          - "reasoning/"
          - "sensory/"

      orchestrators:
        description: "ALL orchestrators"
        subdirs:
          - "core/"
          - "domain/"
          - "git/"
          - "health/"
          - "intelligence/"
          - "onboarding/"
          - "support/"
          - "validation/"
          - "observability/"
          - "migration/"
          - "security/"
          - "quality/"

      mcp:
        description: "External API surface"

      infrastructure:
        description: "Cross-cutting operational concerns"
        subdirs:
          - "automation/"
          - "capacity/"
          - "ci_cd/"
          - "collaboration/"
          - "deployment/"
          - "devx/"
          - "ide/"
          - "llm/"
          - "repositories/"
          - "security/"
          - "storage/"
          - "versioning/"

      observability:
        description: "Metrics, visibility, reports"

      models:
        description: "Data models, enums, events"

      config:
        description: "Configuration loading"

      testing:
        description: "Test scaffolding, demand generator"

      cli:
        description: "CLI interface"

      templates:
        description: "Code templates, scaffolding"

      api:
        description: "API layer"

      tools:
        description: "Standalone tools, utilities"
        subdirs:
          - "toolkit/"

      dashboards:
        description: "Dashboard generation, visualization"

  # ============================================================================
  # EXECUTION SEQUENCE (Step-by-step)
  # ============================================================================
  execution_sequence:
    - step: 1
      name: "Create target directory structure"
      commands:
        - "mkdir -p cortex/infrastructure/{automation,capacity,ci_cd,collaboration,deployment,devx,ide,llm,repositories,security/secrets,storage,versioning,production}"
        - "mkdir -p cortex/intelligence/{documentation,explainability,knowledge,learning,sensory}"
        - "mkdir -p cortex/core/{bootstrap,common,confirmation,execution,interaction,registry,wiring}"
        - "mkdir -p cortex/governance/{enforcement,validation}"
        - "mkdir -p cortex/orchestrators/{agents,domain/refactoring}"
        - "mkdir -p cortex/testing/sts/"
        - "mkdir -p cortex/tools/toolkit/"

    - step: 2
      name: "Move small directories (batch 1 — infrastructure)"
      description: "automation, capacity, ci_cd, collaboration, deployment, devx, repositories, security, secrets, storage, versioning"
      gate: "pytest tests/ -k 'infrastructure' -v — PASS"

    - step: 3
      name: "Move small directories (batch 2 — intelligence)"
      description: "documentation, explainability, knowledge, learning, sensory"
      gate: "pytest tests/ -k 'intelligence' -v — PASS"

    - step: 4
      name: "Move small directories (batch 3 — core)"
      description: "bootstrap, common, confirmation, execution, interaction, registry, wiring"
      gate: "pytest tests/ -k 'core' -v — PASS"

    - step: 5
      name: "Move small directories (batch 4 — governance + orchestrators)"
      description: "enforcement → governance/enforcement, validation → governance/validation, agents → orchestrators/agents, domain_orchestrators → orchestrators/domain, refactoring → orchestrators/domain/refactoring"
      gate: "pytest tests/ -k 'governance or orchestrator' -v — PASS"

    - step: 6
      name: "Move remaining small directories"
      description: "reports → observability/reports, scripts → scripts/ (top-level), sts → testing/sts, toolkit → tools/toolkit, visualization → dashboards/"
      gate: "Each batch tested independently"

    - step: 7
      name: "Delete inner duplicates"
      commands:
        - "rm -rf cortex/cortex-registry/"
        - "rm -rf cortex/cortex_intelligence/"
      gate: "Inner duplicates gone"

    - step: 8
      name: "Move inner test files to top-level tests/"
      command: "mv cortex/tests/*.py tests/ 2>/dev/null && rm -rf cortex/tests/"
      gate: "No test files inside cortex/"

    - step: 9
      name: "Rewrite all imports"
      description: "Systematic sed replacement for each moved directory"
      gate: "python -c 'import cortex' — no import errors"

    - step: 10
      name: "Verify directory count"
      command: "ls -d cortex/*/ | wc -l"
      expected: "≤15 directories"

    - step: 11
      name: "Import quarantine check"
      command: "python -c 'import cortex; print(\"OK\")'"
      expected: "OK — no import errors"

    - step: 12
      name: "Run full test suite"
      command: "pytest tests/ -v --tb=short -q"
      expected: "ALL tests pass"

    - step: 13
      name: "Run capability manifest regression gate"
      command: "pytest tests/golden/regression/test_capability_manifest.py -v"
      expected: "PASS"

    - step: 14
      name: "Commit Phase 04"
      command: "git add -A && git commit -m 'refactor(phase-04): directory cleanup — 59 dirs to ~15 canonical'"
      tag: "gpt-refactor-phase-04"

  # ============================================================================
  # EXIT GATE
  # ============================================================================
  exit_gate:
    all_tests_passing: true
    capability_manifest_check: true
    max_top_level_dirs: 15
    no_single_file_dirs: true
    all_imports_resolve: true
    coverage_minimum: 90
    description: |
      Phase 04 is complete when:
      1. cortex/ has ≤15 top-level subdirectories
      2. No single-file directories at top level
      3. All imports resolve correctly
      4. All MCP tools respond
      5. Capability manifest shows zero regressions
