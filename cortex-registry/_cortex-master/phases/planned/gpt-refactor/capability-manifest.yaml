        description: "Audit + remediation + validation + analysis (consolidated)"
        absorbs: ["cortex_audit_remediation_plan", "toolkit_validate", "toolkit_analyze"]
        modes: ["remediate", "validate", "analyze"]
        validation: "operation=remediate, expect 4 options; operation=validate, expect compliance"
