# ==============================================================================
# CAPABILITY MANIFEST — ZERO REGRESSION CHECKLIST
# ==============================================================================
# Purpose: Machine-readable manifest of ALL CORTEX capabilities
# Usage: Validate after every phase to ensure zero regression
# Status: BASELINE (populated in Phase 00, checked in Phases 01-07)
# ==============================================================================

manifest:
