        behavior: "Initializes ChallengeGenerator but doesn't auto-invoke"
        trigger: "Manual — challenge_generator.generate() must be called explicitly"
        problem: "Not wired into default execution flow"

      - location: "cortex/orchestrators/request_rephrase_orchestrator.py (line 259)"
        behavior: "Step 5 in rephrase flow — challenge-first protocol"
        trigger: "Only during request rephrase operations"
        problem: "Not part of every request lifecycle"

    desired_state: |
      Challenge-first with single best recommendation should be the DEFAULT
      brain behavior on EVERY request. The user should never need to specify
      challenge-first instructions. The MasterOrchestrator should ALWAYS:
      1. Audit existing CORTEX capabilities against the request
      2. Identify architectural fit within current patterns
      3. Deliver SINGLE BEST recommendation (no alternatives list)
      4. Address ask vs. challenge tension inline
      5. Evaluate through core design pillars
      6. Present in executive-ready format (≤60s read, tables, hierarchy)
      7. All feedback inline in VS Code Copilot Chat (never create summary files)

