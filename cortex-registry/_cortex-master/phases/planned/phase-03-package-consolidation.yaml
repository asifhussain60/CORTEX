# ==============================================================================
# PHASE 03 — PACKAGE CONSOLIDATION: 3 Packages → 1
# ==============================================================================
# Purpose: Eliminate cortex/intelligence/ and cortex/lens/ top-level packages
# Gate: All imports resolve to cortex.*, all MCP tools respond, all tests pass
# ==============================================================================

phase:
  id: "phase-03"
  name: "Package Consolidation — 3 packages to 1"
  status: "pending"
  priority: "P0"
  estimated_effort: "3-5 days"
  risk: "medium"
  depends_on: ["phase-02"]
  description: |
    CORTEX currently has 3 top-level Python packages:
    1. cortex/ (1,288 files) — main package
    2. cortex/intelligence/ (~50 files) — intelligence data + adaptive memory
    3. cortex/lens/ (~30 files) — LENS analyzers, domain inference, .NET Roslyn

    This creates import confusion, duplicate concept directories, and prevents
    CORTEX from operating as a single cohesive brain. This phase consolidates
    all into the single cortex/ package.

  # ============================================================================
  # CURRENT STATE AUDIT
  # ============================================================================
  current_state:
    cortex/intelligence:
      location: "cortex/intelligence/"
      file_count: ~50
      unique_capabilities:
        - "action/ — action dispatching"
        - "audit/ — audit migrations, SQLite schema"
        - "domain/ — domain implementations"
        - "domain_brain/ — domain brain models"
        - "governance/ — governance state"
        - "intelligence/ — intelligence layer"
        - "memory/ — adaptive intelligence (hallucination prevention, credential protection, coherence)"
        - "memory/learned_patterns/ — orchestrator patterns, governance patterns"
        - "observability/ — observability state"
        - "onboarded_repos/ — onboarded repository data"
        - "perception/ — perception layer"
        - "quality/ — quality metrics"
        - "reasoning/ — reasoning engine"
        - "releases/ — release artifacts"
        - "state/ — state persistence, digests"
        - "wiring/ — intelligence wiring"
      data_files:
        - "governance.db — SQLite database (RUNTIME DATA, not code)"
      overlap_with_cortex:
        - "governance/ overlaps cortex/governance/"
        - "domain_brain/ overlaps cortex/domain_brain/"
        - "observability/ overlaps cortex/observability/"
        - "wiring/ overlaps cortex/wiring/"

    cortex/lens:
      location: "cortex/lens/"
      file_count: ~30
      unique_capabilities:
        - "analyzers/ — LENS analyzers"
        - "domain_inference/ — domain type inference"
        - "dotnet/roslyn_cli/ — .NET Roslyn analyzer (C# compiled binary)"
        - "knowledge_graph/ — knowledge graph"
        - "models/ — LENS models"
        - "runtime_correlation/ — runtime correlation"
      overlap_with_cortex:
        - "cortex/lens/ (62 files) duplicates core LENS functionality"

  # ============================================================================
  # MIGRATION PLAN
  # ============================================================================
  migrations:

    # --------------------------------------------------------------------------
    # M1: cortex/intelligence → cortex/intelligence/
    # --------------------------------------------------------------------------
    - id: "M1"
      name: "Migrate cortex/intelligence to cortex/intelligence/"
      steps:
        - action: "archive"
          from: "cortex/intelligence/"
          to: "_archive/cortex/intelligence/"
          note: "Full copy for rollback safety"

        - action: "migrate_code"
          mappings:
            - from: "cortex/intelligence/action/"
              to: "cortex/intelligence/action/"
            - from: "cortex/intelligence/audit/"
              to: "cortex/intelligence/audit/"
            - from: "cortex/intelligence/domain/"
              to: "cortex/intelligence/domain/"
            - from: "cortex/intelligence/domain_brain/"
              to: "cortex/intelligence/domain_brain/"
            - from: "cortex/intelligence/governance/"
              to: "cortex/governance/state/"
              note: "Governance state goes to SSOT governance dir"
            - from: "cortex/intelligence/intelligence/"
              to: "cortex/intelligence/engine/"
            - from: "cortex/intelligence/memory/"
              to: "cortex/intelligence/memory/"
              note: "Largest unique capability — adaptive intelligence, learned patterns"
            - from: "cortex/intelligence/observability/"
              to: "cortex/observability/intelligence/"
            - from: "cortex/intelligence/perception/"
              to: "cortex/intelligence/perception/"
            - from: "cortex/intelligence/quality/"
              to: "cortex/intelligence/quality/"
            - from: "cortex/intelligence/reasoning/"
              to: "cortex/intelligence/reasoning/"
            - from: "cortex/intelligence/state/"
              to: "cortex/intelligence/state/"
            - from: "cortex/intelligence/wiring/"
              to: "cortex/intelligence/wiring/"

        - action: "migrate_data"
          mappings:
            - from: "cortex/intelligence/governance.db"
              to: ".cortex-runtime/governance.db"
              note: "Runtime data goes to runtime dir, not source"
            - from: "cortex/intelligence/onboarded_repos/"
              to: ".cortex-runtime/onboarded_repos/"
            - from: "cortex/intelligence/releases/"
              to: ".cortex-runtime/releases/"

        - action: "rewrite_imports"
          pattern: "cortex/intelligence."
          replacement: "cortex.intelligence."
          scope: "all .py files in cortex/ and tests/"

    # --------------------------------------------------------------------------
    # M2: cortex/lens → cortex/intelligence/lens/
    # --------------------------------------------------------------------------
    - id: "M2"
      name: "Migrate cortex/lens to cortex/intelligence/lens/"
      steps:
        - action: "archive"
          from: "cortex/lens/"
          to: "_archive/cortex/lens/"

        - action: "migrate_code"
          mappings:
            - from: "cortex/lens/analyzers/"
              to: "cortex/intelligence/lens/analyzers/"
            - from: "cortex/lens/domain_inference/"
              to: "cortex/intelligence/lens/domain_inference/"
            - from: "cortex/lens/knowledge_graph/"
              to: "cortex/intelligence/lens/knowledge_graph/"
            - from: "cortex/lens/models/"
              to: "cortex/intelligence/lens/models/"
            - from: "cortex/lens/runtime_correlation/"
              to: "cortex/intelligence/lens/runtime_correlation/"

        - action: "migrate_binary"
          mappings:
            - from: "cortex/lens/dotnet/"
              to: "cortex/intelligence/lens/dotnet/"
              note: "Roslyn CLI binary — compiled .NET, not Python"

        - action: "rewrite_imports"
          pattern: "cortex/lens."
          replacement: "cortex.intelligence.lens."
          scope: "all .py files in cortex/ and tests/"

    # --------------------------------------------------------------------------
    # M3: Deduplicate cortex/lens/ vs cortex/intelligence/lens/
    # --------------------------------------------------------------------------
    - id: "M3"
      name: "Consolidate cortex/lens/ into cortex/intelligence/lens/"
      description: |
        After M2, there will be two lens directories:
        - cortex/lens/ (62 files, original)
        - cortex/intelligence/lens/ (from cortex/lens/)
        Merge unique files, archive duplicates.
      steps:
        - action: "audit_duplicates"
          compare:
            - "cortex/lens/"
            - "cortex/intelligence/lens/"
          output: "duplicate_report for manual review"

        - action: "merge_unique"
          primary: "cortex/intelligence/lens/"
          secondary: "cortex/lens/"
          note: "cortex/lens/ has 62 files including orchestrators — these are primary"

        - action: "archive"
          from: "cortex/lens/"
          to: "_archive/cortex/lens_original/"
          condition: "after merge validated"

        - action: "create_compatibility_shim"
          file: "cortex/lens/__init__.py"
          content: "Re-export from cortex.intelligence.lens for backward compat"
          ttl: "Remove in Phase 07"

  # ============================================================================
  # CONSOLIDATION OPPORTUNITIES
  # ============================================================================
  consolidations:
    - type: "duplicate_directory"
      concept: "governance"
      locations:
        - "cortex/governance/ (35 files) — PRIMARY"
        - "cortex/intelligence/governance/ — merge to cortex/governance/state/"
        - "cortex/core/governance/ — merge to cortex/governance/"
        - "cortex/knowledge/governance/ — YAML data, move to cortex-registry"
      action: "Consolidate to cortex/governance/ as SSOT"

    - type: "duplicate_directory"
      concept: "domain_brain"
      locations:
        - "cortex/domain_brain/ (13 files)"
        - "cortex/intelligence/domain_brain/"
        - "cortex/brain/domain_brain/"
      action: "Consolidate to cortex/intelligence/domain_brain/ as SSOT"

    - type: "duplicate_directory"
      concept: "wiring"
      locations:
        - "cortex/wiring/ (12 files) — PRIMARY"
        - "cortex/intelligence/wiring/"
      action: "Consolidate to cortex/wiring/ (or cortex/core/wiring/)"

    - type: "duplicate_directory"
      concept: "observability"
      locations:
        - "cortex/observability/ (7 files) — PRIMARY"
        - "cortex/intelligence/observability/"
        - "cortex/orchestrators/observability/"
        - "cortex/brain/observability/"
        - "cortex/brain/core/observability/"
      action: "Consolidate to cortex/observability/ as SSOT"

  # ============================================================================
  # TEST MIGRATION
  # ============================================================================
  test_migrations:
    - from: "tests/cortex/intelligence/"
      to: "tests/intelligence/"
    - from: "tests/cortex/lens/"
      to: "tests/lens/"

  # ============================================================================
  # EXECUTION SEQUENCE (Step-by-step)
  # ============================================================================
  execution_sequence:
    - step: 1
      name: "Archive cortex/intelligence/"
      command: "cp -r cortex/intelligence/ _archive/cortex/intelligence/"
      gate: "Archive exists, original untouched"

    - step: 2
      name: "Archive cortex/lens/"
      command: "cp -r cortex/lens/ _archive/cortex/lens/"
      gate: "Archive exists, original untouched"

    - step: 3
      name: "Create target directories"
      commands:
        - "mkdir -p cortex/intelligence/{action,audit,domain,domain_brain,engine,memory,perception,quality,reasoning,state,wiring}"
        - "mkdir -p cortex/intelligence/lens/{analyzers,domain_inference,dotnet,knowledge_graph,models,runtime_correlation}"
        - "mkdir -p cortex/governance/state/"
        - "mkdir -p cortex/observability/intelligence/"
        - "mkdir -p .cortex-runtime/{onboarded_repos,releases}"

    - step: 4
      name: "Migrate cortex/intelligence/ code → cortex/intelligence/"
      description: "Move each subdir per the migration mapping in M1"
      gate: "All files in target, __init__.py files created"

    - step: 5
      name: "Migrate cortex/intelligence/ data → .cortex-runtime/"
      description: "governance.db, onboarded_repos/, releases/ are runtime data"
      gate: "Data files in .cortex-runtime/"

    - step: 6
      name: "Migrate cortex/lens/ code → cortex/intelligence/lens/"
      description: "Move each subdir per the migration mapping in M2"
      gate: "All files in target"

    - step: 7
      name: "Delete inner duplicates"
      commands:
        - "rm -rf cortex/cortex/intelligence/"
        - "rm -rf cortex/cortex-registry/"
      gate: "Inner duplicates gone"

    - step: 8
      name: "Rewrite ALL imports"
      commands:
        - "find cortex/ tests/ -name '*.py' -exec sed -i '' 's/from cortex/intelligence\\./from cortex.intelligence./g' {} +"
        - "find cortex/ tests/ -name '*.py' -exec sed -i '' 's/import cortex/intelligence\\./import cortex.intelligence./g' {} +"
        - "find cortex/ tests/ -name '*.py' -exec sed -i '' 's/from cortex/lens\\./from cortex.intelligence.lens./g' {} +"
        - "find cortex/ tests/ -name '*.py' -exec sed -i '' 's/import cortex/lens\\./import cortex.intelligence.lens./g' {} +"
      gate: "Zero imports from cortex/intelligence or cortex/lens"

    - step: 9
      name: "Consolidate cortex/lens/ (62 files) with cortex/intelligence/lens/"
      description: "Diff, merge unique files, create compatibility shim"
      gate: "Single lens implementation at cortex/intelligence/lens/"

    - step: 10
      name: "Import quarantine check"
      command: "grep -r 'from cortex/intelligence\\|from cortex/lens\\|from _archive' cortex/ | wc -l"
      expected: "0"

    - step: 11
      name: "Run full test suite"
      command: "pytest tests/ -v --tb=short -q"
      expected: "ALL tests pass"

    - step: 12
      name: "Run capability manifest regression gate"
      command: "pytest tests/golden/regression/test_capability_manifest.py -v"
      expected: "PASS"

    - step: 13
      name: "Delete original source directories"
      commands:
        - "rm -rf cortex/intelligence/"
        - "rm -rf cortex/lens/"
      condition: "Only after step 11 and 12 pass"

    - step: 14
      name: "Update migration tracker"
      file: "cortex-registry/planning/phases/planned/cortex-refactor/migration-tracker.yaml"
      updates: "M-001, M-002, M-003 → status: completed"

    - step: 15
      name: "Commit Phase 01"
      command: "git add -A && git commit -m 'refactor(phase-03): package consolidation — 3 packages to 1'"
      tag: "cortex-refactor-phase-03"

  # ============================================================================
  # EXIT GATE
  # ============================================================================
  exit_gate:
    all_tests_passing: true
    capability_manifest_check: true
    mcp_tools_responding: true
    no_imports_from_archived: true
    coverage_minimum: 90
    description: |
      Phase 01 is complete when:
      1. ZERO imports from cortex/intelligence or cortex/lens anywhere
      2. All 28+ MCP tools respond correctly
      3. All golden tests pass
      4. Capability manifest checklist shows zero regressions
      5. cortex/intelligence/ and cortex/lens/ are in _archive/ only
      6. Migration tracker updated

  # ============================================================================
  # VALIDATION LOOP — FINAL STAGE (MANDATORY)
  # ============================================================================
  # Authority: cortex-refactor-master.yaml § validation_loops
  # This stage runs AFTER all deliverables are implemented.
  # It loops until every exit gate check passes. Once clean, CORTEX
  # autonomously begins Phase 04 without user intervention.
  # ============================================================================
  validation_loop:
    stage_id: "VL-03"
    phase: "phase-03"
    next_phase: "phase-04"
    next_phase_spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-04-brain-deduplication.yaml"
    max_iterations: 10
    iteration_timeout_minutes: 45

    checks:
      - id: "VL-03-C1"
        name: "Zero imports from cortex/intelligence"
        command: "grep -r 'from cortex/intelligence\\|import cortex/intelligence' cortex/ | wc -l"
        pass_condition: "output is 0"
        on_fail: "Re-run import rewriter on all files still referencing cortex/intelligence"

      - id: "VL-03-C2"
        name: "Zero imports from cortex/lens"
        command: "grep -r 'from cortex/lens\\|import cortex/lens' cortex/ | wc -l"
        pass_condition: "output is 0"
        on_fail: "Re-run import rewriter on all files still referencing cortex/lens"

      - id: "VL-03-C3"
        name: "cortex/intelligence/ is in _archive only"
        command: "test ! -d cortex/intelligence/ && echo 'archived' || echo 'STILL EXISTS'"
        pass_condition: "prints archived"
        on_fail: "Move cortex/intelligence/ to _archive/cortex/intelligence/ — only after C1 passes"

      - id: "VL-03-C4"
        name: "cortex/lens/ is in _archive only"
        command: "test ! -d cortex/lens/ && echo 'archived' || echo 'STILL EXISTS'"
        pass_condition: "prints archived"
        on_fail: "Move cortex/lens/ to _archive/cortex/lens/ — only after C2 passes"

      - id: "VL-03-C5"
        name: "All MCP tools respond"
        command: "python -c \"from cortex.mcp import list_tools; tools=list_tools(); print(len(tools),'tools'); assert len(tools)>=22,'Expected >=22 tools'\""
        pass_condition: "prints N tools where N >= 22, no assertion error"
        on_fail: "Debug MCP tool registration, fix broken imports causing tool failures"

      - id: "VL-03-C6"
        name: "All tests pass"
        command: "pytest tests/ -v --tb=short -q --ignore=tests/performance"
        pass_condition: "exit code 0, zero failures"
        on_fail: "Fix failing tests caused by import path changes, update all import statements"

      - id: "VL-03-C7"
        name: "Coverage ≥ 90%"
        command: "pytest tests/ --cov=cortex --cov-report=term-missing -q | tail -3"
        pass_condition: "coverage ≥ 90%"
        on_fail: "Add tests for uncovered migration paths in cortex/intelligence/"

      - id: "VL-03-C8"
        name: "Capability manifest regression gate"
        command: "pytest tests/golden/regression/test_capability_manifest.py -v --tb=short"
        pass_condition: "exit code 0"
        on_fail: "Fix any capability regressions detected by the manifest check"

      - id: "VL-03-C9"
        name: "Migration tracker updated"
        command: "python -c \"import yaml; t=yaml.safe_load(open('cortex-registry/planning/phases/planned/cortex-refactor/migration-tracker.yaml')); items=[i for i in t.get('migrations',[]) if i.get('id') in ['M-001','M-002','M-003']]; statuses=[i.get('status') for i in items]; assert all(s=='completed' for s in statuses), f'Not all complete: {statuses}'; print('tracker OK')\""
        pass_condition: "prints tracker OK"
        on_fail: "Update migration-tracker.yaml — set M-001, M-002, M-003 to status: completed"

    loop_behavior:
      strategy: "conditional_retry"
      description: |
        1. Run all checks (VL-03-C1 through VL-03-C9) in sequence.
        2. If ALL checks pass → loop exits CLEAN → proceed to autonomous_advance.
        3. If ANY check fails:
           a. Apply the on_fail remediation for each failing check.
           b. Record iteration result in cortex-refactor-master.yaml validation_loops.history.
           c. Increment iteration counter.
           d. If iteration_count > max_iterations → HALT with P0 alert to user.
           e. Otherwise → restart from check C1.
        4. Never skip a check — all must pass in the same iteration.

    autonomous_advance:
      enabled: true
      trigger: "All VL-03 checks pass in same iteration"
      actions:
        - action: "Update cortex-refactor-master.yaml"
          changes:
            - "phases[phase-03].status → complete"
            - "phases[phase-03].progress.completed → ISO timestamp"
            - "phases[phase-03].progress.validation_loop_iterations → N"
            - "metadata.counters.pending -= 1"
            - "metadata.counters.complete += 1"
        - action: "Move phase spec to completed/"
          command: "cp cortex-registry/planning/phases/planned/cortex-refactor/phase-03-package-consolidation.yaml cortex-registry/planning/phases/completed/cortex-refactor/"
        - action: "Git checkpoint"
          command: "git add -A && git commit -m 'refactor(phase-03): COMPLETE — 3 packages consolidated to 1, advancing to phase-04'"
        - action: "Load and execute next phase"
          spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-04-brain-deduplication.yaml"
          orchestrator: "CortexMasterPlanOrchestrator"
          method: "execute_phase(phase_id='phase-04')"
