  # SUB-PHASE A — GAP-80-01: Reduce master_orchestrator.py to coordinator
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-80-a"
    title: "Split MasterOrchestrator God Object → lean coordinator ≤500 lines"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-80-01"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "3 days"
    depends_on: []
    prerequisite: "smoke tests green; capture baseline test count"
    regression_gate: "python3 scripts/run_tests.py batch — zero new failures"

    tdd_cycle:
      red:
        action: |
          Write failing tests that assert:
          1. MasterOrchestrator.__init__ completes with ≤20 attribute assignments
          2. All stage logic is delegated (no inline stage code in master file)
          3. Soft ImportError try/except count ≤2 in master file (only mandatory ones)
          4. MasterOrchestrator.process_request() delegates to existing Stage classes
        gate: "python3 scripts/run_tests.py file tests/orchestrators/core/test_master_orchestrator_coordinator.py — ALL listed tests must FAIL"
        blocker: "Do NOT move any stage code until every listed test fails"
      green:
        action: |
          1. Audit which stage logic remains inline (not in Stage1/2/3/4 files)
          2. Move remaining inline logic to the appropriate Stage class
          3. Replace each soft ImportError block with direct import + hard fail OR move to stage class
          4. Reduce master file to: __init__ (DI wiring only), process_request() (delegation chain), health_check(), AC markers
          5. Ensure the 4 existing AC markers remain and all public methods emit AC_START/AC_COMPLETE
        gate: "python3 scripts/run_tests.py file tests/orchestrators/core/test_master_orchestrator_coordinator.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: |
          1. Add type hints to all new/modified signatures (CORE-011)
          2. Add/update docstrings on all public methods (CORE-012)
          3. Verify no duplicate stage logic remains between master and Stage files (CORE-035)
          4. Run complexity check: no function > 50 lines in master file
        gate: "python3 scripts/run_tests.py dir tests/orchestrators/core/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes and wc -l master_orchestrator.py ≤500"

    tdd_sequence:
      red:
        - "test_master_orchestrator_init_attribute_count — asserts len([a for a in vars(mo) if not a.startswith('_')]) ≤ 20"
        - "test_master_orchestrator_no_inline_stage_logic — AST scan: no function body > 50 lines in master file"
        - "test_master_orchestrator_soft_import_count — grep count of 'except ImportError' in master file ≤ 2"
        - "test_master_orchestrator_delegates_to_stage_classes — mock Stage1/2/3/4 and assert they are called"
        - "test_master_orchestrator_ac_markers_present — master file contains AC_START and AC_COMPLETE"
      green:
        - "Extract remaining inline stage logic to MasterOrchestrationStage1-4 as appropriate"
        - "Replace soft ImportError blocks with hard imports (move optional deps to Stage files)"
        - "Master __init__: only DI wiring (≤20 assignments)"
        - "Master process_request: only delegation chain + AC markers"
      refactor:
        - "Add docstrings to all public methods (CORE-012)"
        - "Verify all signatures have type hints (CORE-011)"
        - "Confirm no duplicate logic between master and Stage files (CORE-035)"

    acceptance_criteria:
      - "wc -l cortex/orchestrators/core/master_orchestrator.py ≤ 500"
      - "grep -c 'except ImportError' master_orchestrator.py ≤ 2"
      - "All existing orchestrators tests still pass (zero regressions)"
      - "MasterOrchestrator imports cleanly: python3 -c 'from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator'"
      - "health_check() returns status: ok"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/orchestrators/core/"
      min_tests_pass: 1
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ══════════════════════════════════════════════════════════════════════════
  # SUB-PHASE B — GAP-80-02: Fix KnowledgeRepository missing index
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-80-b"
    title: "KnowledgeRepository graceful degradation — no crash when index absent"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-80-02"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "0.5 days"
    depends_on: ["phase-80-a"]
    prerequisite: "phase-80-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py dir tests/core/ — zero new failures"

    tdd_cycle:
      red:
        action: |
          Write tests asserting:
          1. KnowledgeRepository() with missing index does NOT raise FileNotFoundError
          2. KnowledgeRepository().search("anything") returns [] when index absent
          3. KnowledgeRepository().is_available() returns False when index absent
          4. KnowledgeRepository() with valid index loads correctly (existing behaviour)
        gate: "python3 scripts/run_tests.py file tests/core/knowledge/test_knowledge_repository_degradation.py — ALL must FAIL"
        blocker: "Do NOT modify KnowledgeRepository until tests are RED"
      green:
        action: |
          1. In KnowledgeRepository._load_index(): catch FileNotFoundError, set self._index = {} and self._available = False
          2. Add is_available() -> bool property
          3. Guard all search/retrieve methods: return [] / None when not self._available
          4. Log a WARNING (not raise) when index is absent
          5. Create a generate_knowledge_index.py script in scripts/ that builds the index from cortex-registry/knowledge-base/
        gate: "python3 scripts/run_tests.py file tests/core/knowledge/test_knowledge_repository_degradation.py — ALL PASS"
        blocker: "Do NOT REFACTOR until GREEN"
      refactor:
        action: |
          1. Add type hints to _load_index, is_available, and all public methods
          2. Add docstring to is_available() explaining graceful-degradation contract
          3. Confirm existing KnowledgeRepository tests still pass (no regressions)
        gate: "python3 scripts/run_tests.py dir tests/core/knowledge/ — zero regressions"
        blocker: "Do NOT mark COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_knowledge_repository_no_crash_without_index — KnowledgeRepository() succeeds with missing index"
        - "test_knowledge_repository_search_returns_empty_without_index — search('test') returns []"
        - "test_knowledge_repository_is_available_false_without_index — is_available() == False"
        - "test_knowledge_repository_loads_with_valid_index — existing behaviour preserved"
      green:
        - "Modify _load_index to catch FileNotFoundError and degrade gracefully"
        - "Add is_available() property"
        - "Guard search/retrieve with is_available check"
        - "Create scripts/generate_knowledge_index.py"
      refactor:
        - "Type hints and docstrings on all modified methods (CORE-011, CORE-012)"

    acceptance_criteria:
      - "python3 -c 'from cortex.core.knowledge.knowledge_repository import KnowledgeRepository; r = KnowledgeRepository(); print(r.is_available())' → prints False (no crash)"
      - "All existing knowledge repository tests pass"
      - "scripts/generate_knowledge_index.py exists and produces a valid .knowledge-index.json"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/core/knowledge/"
      min_tests_pass: 1
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ══════════════════════════════════════════════════════════════════════════
  # SUB-PHASE C — GAP-80-03: Fix IOrchestrator ↔ mixin return type mismatch
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-80-c"
    title: "Align OrchestratorProtocolMixin return types to IOrchestrator Result[T] contract"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-80-03"]
    governance_authority: "CORE-008, CORE-011, CORE-035, CORE-064"
    duration_estimate: "1 day"
    depends_on: ["phase-80-b"]
    prerequisite: "phase-80-b completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py dir tests/core/ — zero new failures"

    tdd_cycle:
      red:
        action: |
          Write tests asserting:
          1. OrchestratorProtocolMixin().initialize() returns Result (Ok or Err), not plain Dict
          2. OrchestratorProtocolMixin().get_mcp_tools() returns Result, not plain Dict
          3. OrchestratorProtocolMixin().execute_operation('op', {}) returns Result, not plain Dict
          4. OrchestratorProtocolMixin().get_audit_trail() returns Result, not plain List
          5. All 4 mixin defaults satisfy isinstance(result, (Ok, Err))
        gate: "python3 scripts/run_tests.py file tests/core/test_orchestrator_protocol_mixin_result_types.py — ALL FAIL"
        blocker: "Do NOT modify mixin until tests are RED"
      green:
        action: |
          In OrchestratorProtocolMixin, wrap each default method return value in Ok(...):
            initialize() → return Ok({"status": "initialized", ...})
            get_mcp_tools() → return Ok({...})
            execute_operation() → return Ok({...}) or Err(message) on exception
            get_audit_trail() → return Ok([...])
          Import Ok, Err from cortex.core.result (already imported in many orchestrators).
        gate: "python3 scripts/run_tests.py file tests/core/test_orchestrator_protocol_mixin_result_types.py — ALL PASS"
        blocker: "Do NOT REFACTOR until GREEN"
      refactor:
        action: |
          1. Scan for callers of these mixin methods that unwrap with .value or check isinstance(r, Ok)
          2. Update any callers that expected plain Dict to unwrap Result
          3. Add type hints: def initialize(self) -> Result[Dict[str, Any]]:
          4. Confirm all 27 wired orchestrators that override these methods still pass their tests
        gate: "python3 scripts/run_tests.py batch — zero new failures across full suite"
        blocker: "Do NOT mark COMPLETE until batch gate passes"

    tdd_sequence:
      red:
        - "test_mixin_initialize_returns_result — isinstance(mixin.initialize(), (Ok, Err))"
        - "test_mixin_get_mcp_tools_returns_result — isinstance(mixin.get_mcp_tools(), (Ok, Err))"
        - "test_mixin_execute_operation_returns_result — isinstance(mixin.execute_operation('op', {}), (Ok, Err))"
        - "test_mixin_get_audit_trail_returns_result — isinstance(mixin.get_audit_trail(), (Ok, Err))"
      green:
        - "Wrap initialize() return in Ok(...)"
        - "Wrap get_mcp_tools() return in Ok(...)"
        - "Wrap execute_operation() return in Ok(...) or Err(...)"
        - "Wrap get_audit_trail() return in Ok(...)"
      refactor:
        - "Add Result[T] return type hints to all four methods (CORE-011)"
        - "Update callers that expected plain Dict (scan and fix)"
        - "Docstrings updated to document Result contract (CORE-012)"

    acceptance_criteria:
      - "All four mixin default methods return Result (Ok or Err) instances"
      - "IOrchestrator ABC contract satisfied at the type level"
      - "Zero regressions across batch test suite"
      - "mypy / static analysis: no return type mismatch on these 4 methods"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py batch"
      min_tests_pass: 1
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

