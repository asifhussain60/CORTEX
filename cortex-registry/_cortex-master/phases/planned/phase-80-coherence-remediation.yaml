background: |
  Source: copilot-review03.md (GitHub Copilot holistic architecture review, 2026-02-25)
  The review was a fully-verified, grep-confirmed analysis of 1,145 Python source files.
  All gaps below were confirmed against live codebase state before acceptance.

  Baseline measurements:
    - master_orchestrator.py: 5,222 lines (15 soft ImportError blocks, 4 AC markers)
    - SynthesisResult duplicate class count: 4
    - ValidationResult duplicate class count: 22
    - ContextCacheLayer/ContextSynthesisGateway: 2 copies each
    - OrchestratorLearningMixin: 2 copies
    - orchestrators missing AC_START/AC_COMPLETE: 162 / ~200 files
    - audit_sessions rows: 0 (empty pipeline tables)
    - audit_stage_log rows: 0
    - KnowledgeRepository: throws FileNotFoundError at instantiation
    - IOrchestrator declares Result[T] returns; mixin returns plain Dict/List
    - EnforcementOrchestrator instantiated fresh on every _governance_gate() call
    - wiring.yaml defines 41 orchestrators across 10 tiers (docs claim 27 across 3)
    - cortex-master.yaml: 470 lines (THIN INDEX CONTRACT compliant)
    - Smoke test baseline: to be captured at phase start

  Accepted gaps from review: GAP-80-01 through GAP-80-07 (all P0/P1).
  Rejected gap: 27-vs-41 narrative count (P2 — documentation only, low ROI vs risk).

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — all must be CLOSED before phase is COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-80-01"
    title: "God Object: master_orchestrator.py is 5,222 lines with 15 soft ImportError blocks"
    severity: P0
    source: "copilot-review03.md §1, §10"
    evidence: |
      wc -l cortex/orchestrators/core/master_orchestrator.py → 5222
      grep -c "except ImportError" → 15
      grep -c "AC_START|AC_COMPLETE" → 4 (only 4 markers in 5,222 lines)
      Stage classes already exist: master_orchestrator_stage_1/2/3/4.py
    action_ref: "phase-80-a"
    status: OPEN

  - id: "GAP-80-02"
    title: "KnowledgeRepository crashes at instantiation — .knowledge-index.json missing"
    severity: P0
    source: "copilot-review03.md §4"
    evidence: |
      python3 -c "from cortex.core.knowledge.knowledge_repository import KnowledgeRepository; KnowledgeRepository()"
      → FileNotFoundError: Knowledge index not found:
        cortex-registry/knowledge-base/.knowledge-index.json. Run knowledge migration first.
      find . -name ".knowledge-index.json" → (no results)
    action_ref: "phase-80-b"
    status: OPEN

  - id: "GAP-80-03"
    title: "IOrchestrator declares Result[T] returns; OrchestratorProtocolMixin returns plain Dict/List"
    severity: P1
    source: "copilot-review03.md §2"
    evidence: |
      cortex/core/interfaces/i_orchestrator.py:
        initialize() -> Result[str]
        get_mcp_tools() -> Result[Dict[str, Any]]
        execute_operation(...) -> Result[Any]
        get_audit_trail(...) -> Result[list]
      cortex/core/orchestrator_protocol_mixin.py:
        initialize() -> Dict[str, Any]     (line 108)
        get_mcp_tools() -> Dict[str, Any]  (line 124)
        execute_operation() — returns plain dict
        get_audit_trail() -> List[Dict[str, Any]]  (line 191)
      Mixin defaults do not satisfy ABC return type contract.
    action_ref: "phase-80-c"
    status: OPEN

  - id: "GAP-80-04"
    title: "SynthesisResult defined in 4 separate files; ValidationResult defined in 22 files"
    severity: P1
    source: "copilot-review03.md §3"
    evidence: |
      grep -rn "class SynthesisResult" cortex --include="*.py" | grep -v test:
        cortex/core/conversation_synthesizer.py:60
        cortex/core/context_synthesizer.py:40
        cortex/intelligence/knowledge/unified_intelligence_context.py:58
        cortex/intelligence/tier3/knowledge/synthesis_engine.py:11
      grep -rn "class ValidationResult" cortex --include="*.py" | grep -v test → 22 matches
      ContextCacheLayer: 2 copies (core/ + orchestrators/core/)
      ContextSynthesisGateway: 2 copies (legacy_ + canonical)
      OrchestratorLearningMixin: 2 copies (orchestrator_learning_mixin + orchestrator_integration_mixin)
    action_ref: "phase-80-d"
    status: OPEN

  - id: "GAP-80-05"
    title: "162 orchestrator files missing AC_START/AC_COMPLETE markers"
    severity: P1
    source: "copilot-review03.md §6"
    evidence: |
      find cortex/orchestrators -name "*.py" | xargs grep -rL "AC_START|AC_COMPLETE" \
        | grep -v "__init__|__pycache__" | wc -l → 162
      sqlite3 .cortex-runtime/traces/orchestrator-traces.db
        "SELECT COUNT(*) FROM audit_sessions" → 0
        "SELECT COUNT(*) FROM audit_stage_log" → 0
      audit_violations table → 0 rows
      Observability pipeline not functioning end-to-end.
    action_ref: "phase-80-e"
    status: OPEN

  - id: "GAP-80-06"
    title: "EnforcementOrchestrator instantiated fresh on every _governance_gate() call"
    severity: P1
    source: "copilot-review03.md §7"
    evidence: |
      cortex/core/orchestrator_protocol_mixin.py line 303:
        result = EnforcementOrchestrator().validate_operation(...)
      No singleton, no lru_cache, no module-level instance.
      With 41 orchestrators all calling this on execute_operation, cost is O(N) instantiations.
    action_ref: "phase-80-f"
    status: OPEN

  - id: "GAP-80-07"
    title: "Knowledge API has 5 uncoordinated entry points; no canonical synthesize() surface"
    severity: P1
    source: "copilot-review03.md §4"
    evidence: |
      Five separate knowledge entry points (all confirmed importable except KnowledgeRepository):
        KnowledgeRepository       → crashes (GAP-80-02)
        KnowledgeSynthesisEngine  → synthesize_unified_context(intent_type, operation)
        KnowledgeGuidanceEngine   → get_guidance_for_module(), get_ordered_guidance()
        IntelligentKnowledgeRouter → requires explicit backends dict at construction
        KnowledgeRegistryProxy    → dual-root YAML proxy (works, 30 YAMLs)
        UnifiedIntelligenceProvider → Phase 65 S4, 3-tier execution
      No single canonical synthesize(request, tier) → UnifiedIntelligenceContext method.
      Callers must know which of five engines to call per situation.
    action_ref: "phase-80-g"
    status: OPEN

