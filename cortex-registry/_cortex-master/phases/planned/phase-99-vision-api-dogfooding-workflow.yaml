# ============================================================================
# TECHNICAL DESIGN
# ============================================================================
technical_design:
  architecture_pattern: "Strategic Layering (3-tier)"
  
  tier_1_vision_api:
    models:
      - name: "PixelGrid"
        description: "RGB matrix for visual debugging"
        fields: ["width", "height", "data"]
      
      - name: "BoundingBox"
        description: "Precise element coordinates with confidence"
        fields: ["x", "y", "width", "height", "confidence", "semantic_type", "cortex_id"]
      
      - name: "TextSegment"
        description: "OCR text with metadata"
        fields: ["text", "confidence", "bbox", "font_family", "font_size"]
      
      - name: "ColorInfo"
        description: "Color palette extraction"
        fields: ["hex_code", "rgb", "percentage", "location"]
      
      - name: "FontInfo"
        description: "Font detection from visual"
        fields: ["family", "size", "weight", "style"]
    
    analysis_modes:
      - mode: "quick"
        speed: "<2s"
        detail: "URLs + major elements"
        
      - mode: "standard"
        speed: "5-8s"
        detail: "Current + bounding boxes"
        
      - mode: "atomic"
        speed: "15-20s"
        detail: "Full decomposition (NEW)"
  
  tier_2_semantic_selectors:
    naming_convention:
      prefix: "data-cortex-"
      
      attributes:
        - name: "data-cortex-id"
          format: "component-type-index"
          example: "hero-cta-001, nav-item-docs"
        
        - name: "data-cortex-type"
          values: ["nav", "cta", "content", "viz", "form"]
        
        - name: "data-cortex-track"
          values: ["conversion", "navigation", "engagement"]
    
    validation:
      - check: "uniqueness"
        enforcement: "pre-commit hook"
      
      - check: "format"
        pattern: "^[a-z0-9-]+$"
      
      - check: "max_length"
        limit: 50
  
  tier_3_workflow_template:
    structure:
      - stage: "analyze-screenshot"
        orchestrator: "LENSOrchestrator"
        output: "visual-analysis.json"
      
      - stage: "generate-challenges"
        orchestrator: "ChallengeEngine"
        output: "design-alternatives.md"
      
      - stage: "tdd-red-phase"
        orchestrator: "TDDOrchestrator"
        mode: "RED"
      
      - stage: "tdd-green-phase"
        orchestrator: "TDDOrchestrator"
        mode: "GREEN"
      
      - stage: "tdd-refactor-phase"
        orchestrator: "TDDOrchestrator"
        mode: "REFACTOR"
      
      - stage: "holistic-validation"
        orchestrator: "EnforcementOrchestrator"
        checks: ["CORE-008", "CORE-028", "CORE-035"]
      
      - stage: "deploy-preview"
        orchestrator: "DeploymentOrchestrator"
        environment: "staging"

