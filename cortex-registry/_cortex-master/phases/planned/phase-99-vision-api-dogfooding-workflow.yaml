# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
overview:
  vision: |
    Enhance CORTEX LENS Vision API with atomic-level visual decomposition and
    establish bidirectional mapping between screenshots and HTML DOM elements
    via data-cortex-* semantic selectors. Create reusable TDD workflow template
    for dogfooding CORTEX site development that ensures zero duplication, full
    compilation, and zero lint errors through holistic RGR cycles.

  problem_statement: |
    CURRENT STATE:
    - VisionAnalyzer extracts high-level elements (URLs, UI components, text)
    - No pixel-level analysis or bounding box precision
    - No way to map visual screenshots → actual HTML elements
    - CORTEX site development is manual (no automated workflow)
    - Vision API integration lacks semantic layer for test automation

    ROOT CAUSE:
    - Vision API designed for detection, not atomic decomposition
    - HTML elements lack semantic identifiers for visual mapping
    - No WorkflowComposer template for frontend TDD workflows
    - Missing bidirectional link between visual analysis and DOM structure

    IMPACT IF NOT FIXED:
    - ❌ Cannot dogfood CORTEX for own site development
    - ❌ Screenshot-driven testing remains manual
    - ❌ No automated visual regression detection
    - ❌ Vision API underutilized (only basic detection)
    - ❌ Frontend changes lack TDD discipline

  solution_approach: |
    3-TIER STRATEGIC LAYERING PATTERN:

    Tier 1: Enhanced Vision API (Atomic Analysis)
      - Add PixelGrid, BoundingBox, TextSegment, ColorInfo models
      - Implement "atomic" analysis depth mode (15-20s processing)
      - Extract font detection, visual hierarchy, color palettes
      - Link to data-cortex-id if present in screenshot

    Tier 2: Semantic Selector Bridge (Non-Breaking)
      - Add optional data-cortex-id attributes to HTML elements
      - Naming: data-cortex-id, data-cortex-type, data-cortex-track
      - Progressive enhancement (works even if attributes absent)
      - Pre-commit hook validates ID uniqueness
      - Vision API extracts cortex-ids from screenshots

    Tier 3: TDD Workflow Template (WorkflowComposer)
      - Create cortex-site-dogfood.yaml template
      - 5-stage workflow: Analyze → Challenge → RED → GREEN → REFACTOR
      - Integrated with EnforcementOrchestrator (Phase 48 gates)
      - Deployment preview generation
      - Performance targets: <30 min full cycle

  success_criteria:
    - "✅ Atomic Vision API mode operational (<20s per screenshot)"
    - "✅ BoundingBox, PixelGrid, TextSegment models implemented"
    - "✅ data-cortex-* attributes added to CORTEX site HTML"
    - "✅ Pre-commit hook validates unique cortex-ids"
    - "✅ Vision API extracts cortex-ids from screenshots"
    - "✅ cortex-site-dogfood.yaml workflow template created"
    - "✅ Full TDD cycle completes (analyze → RGR → deploy)"
    - "✅ Zero regression risk (no breaking changes)"
    - "✅ 95%+ test coverage for new components"
    - "✅ Lighthouse score ≥95 maintained"

