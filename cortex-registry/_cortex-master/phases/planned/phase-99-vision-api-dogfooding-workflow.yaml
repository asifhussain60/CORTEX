alternatives_rejected:
  - approach: "Add IDs to every element directly"
    pros: "Simple implementation"
    cons: "Breaks existing JavaScript selectors, high regression risk"
    verdict: "❌ REJECTED"
  
  - approach: "CSS-only selectors"
    pros: "No HTML changes required"
    cons: "Fragile (class changes break mapping), low accuracy"
    verdict: "❌ REJECTED"
  
  - approach: "XPath mapping"
    pros: "Precise element targeting"
    cons: "Browser-dependent, slow performance, poor DX"
    verdict: "❌ REJECTED"
  
  - approach: "data-testid (React pattern)"
    pros: "Industry standard pattern"
    cons: "Not semantic for CORTEX domain, generic naming"
    verdict: "⚠️ PARTIAL (inspired data-cortex-*)"

