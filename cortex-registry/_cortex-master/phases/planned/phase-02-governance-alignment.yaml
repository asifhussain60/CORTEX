# ==============================================================================
# PHASE 02 — GOVERNANCE ALIGNMENT: Rules Review, Enhancement & CCL Integration
# ==============================================================================
# Purpose: Review ALL 36 governance rules against the refactored architecture,
#          resolve duplicates, add new rules for SQLite/MCP/SDLC/CCL,
#          and determine CCL integration strategy for per-turn enforcement.
# Gate: All rules reviewed, duplicates resolved, new rules added, CCL wired
# Depends On: Phase 01 (Foundation must exist before governance can reference it)
# ==============================================================================

phase:
  id: "phase-02"
  name: "Governance Alignment — Rules Review, Enhancement & CCL Integration"
  status: "pending"
  priority: "P0"
  estimated_effort: "2-3 days"
  risk: "low (governance artifacts only — no code migration)"
  depends_on: ["phase-01"]
  description: |
    Every governance rule in skull-rules.yaml must be reviewed against the
    refactored CORTEX architecture. Rules referencing dissolved packages
    (cortex_intelligence, cortex_lens, cortex/brain/) must be updated.
    Duplicate rules must be merged. New rules must be added for SQLite audit,
    MCP consolidation, SDLC coverage, workflow template compliance, and CCL
    enforcement. The governance duplicate file (cortex-registry/core/governance/
    skull-rules.yaml) must be eliminated — SSOT violation.

    CCL INTEGRATION DECISION:
    Governance rule evaluation SHOULD be part of the CCL (Context Crystallization
    Layer). The CCL already warms LENS + 35+ YAMLs on every turn. Adding a
    "governance crystal" to CCL means:
    - Rules are pre-loaded and cached per session (not re-parsed per request)
    - Applicable rules are pre-filtered by intent category
    - Rule violations from prior turns are carried forward
    - Enforcement is consistent and near-zero latency (<10ms)
    
    This makes governance enforcement INTRINSIC to CORTEX cognition — not a
    bolt-on gate that can be bypassed. The CCL governance crystal becomes the
    "conscience" of the brain.

  # ============================================================================
  # DELIVERABLES
  # ============================================================================
  deliverables:

    # --------------------------------------------------------------------------
    # G1: Duplicate Skull-Rules Elimination (SSOT Violation)
    # --------------------------------------------------------------------------
    - id: "G1"
      name: "Eliminate Duplicate skull-rules.yaml"
      description: |
        TWO copies of skull-rules.yaml exist:
        - cortex-registry/core/tier0-skull/skull-rules.yaml (1856 lines) — CANONICAL
        - cortex-registry/core/governance/skull-rules.yaml (1815 lines) — DUPLICATE
        
        The duplicate violates EA-001 (SSOT) and CORE-035 (Single Canonical
        Implementation). The governance/ copy is 41 lines shorter — it is stale.
      actions:
        - "Delete cortex-registry/core/governance/skull-rules.yaml"
        - "Verify no imports/references point to the deleted path"
        - "Update any YAML loaders that reference the governance/ path"
        - "Add .gitignore entry to prevent re-creation"
      acceptance_criteria:
        - "Exactly ONE skull-rules.yaml exists in the repo"
        - "All rule loaders point to cortex-registry/core/tier0-skull/skull-rules.yaml"
        - "grep -r 'core/governance/skull-rules' returns 0 matches"

    # --------------------------------------------------------------------------
    # G2: Rule-by-Rule Review Against Refactored Architecture
    # --------------------------------------------------------------------------
    - id: "G2"
      name: "36-Rule Alignment Audit"
      description: |
        Every rule evaluated for relevance to the refactored architecture.
        Each rule gets one of four dispositions: KEEP, ENHANCE, MERGE, or ARCHIVE.
      
      rule_dispositions:
        # === KEEP AS-IS (rules that are perfectly aligned) ===
        keep:
          - rule_id: "CORE-001"
            name: "Incremental Autonomous Execution"
            reason: "Universal principle — applies regardless of architecture"
          
          - rule_id: "CORE-005"
            name: "No Hardcoded Paths"
            reason: "Portability is fundamental — no changes needed"
          
          - rule_id: "CORE-008"
            name: "Test-First Development"
            reason: "TDD is immutable — cornerstone of CORTEX"
          
          - rule_id: "CORE-011"
            name: "Python Type Hints Required"
            reason: "Quality gate — no changes needed"
          
          - rule_id: "CORE-012"
            name: "Docstrings Required"
            reason: "Quality gate — no changes needed"
          
          - rule_id: "CORE-013"
            name: "Explicit Error Handling"
            reason: "Quality gate — no changes needed"
          
          - rule_id: "CORE-017"
            name: "Strict Governance"
            reason: "Fundamental enforcement — no changes needed"
          
          - rule_id: "CORE-025"
            name: "Result[T] Pattern Required"
            reason: "Quality gate — applies to all orchestrators"
          
          - rule_id: "CORE-026"
            name: "Git Checkpoint Required"
            reason: "Development workflow — no changes needed"
          
          - rule_id: "CORE-027"
            name: "Audit Verification Required"
            reason: "Auditability — applies even more with SQLite audit"
          
          - rule_id: "CORE-041"
            name: "Event Idempotency Required"
            reason: "Architecture integrity — EventBus is core"
          
          - rule_id: "CORE-042"
            name: "Hierarchical Terminology Standard"
            reason: "Planning governance — universal"
          
          - rule_id: "CORE-050"
            name: "No Quality Degradation"
            reason: "Quality gate — more important post-refactor"
          
          - rule_id: "CORE-055"
            name: "Golden Test Tier Contract"
            reason: "Quality gate — golden tests are central to refactor validation"

        # === ENHANCE (rules that need updates for new architecture) ===
        enhance:
          - rule_id: "CORE-006"
            name: "Phase -2 Setup Verification"
            enhancement: |
              Update setup verification to check:
              - CortexAuditDB is initialized (SQL-001)
              - Cortex operates as single package (no cortex_intelligence imports)
              - Workflow engine has setup/teardown lifecycle
              - CCL governance crystal is loaded
            new_checks:
              - "CortexAuditDB.health_check() returns OK"
              - "Zero imports from cortex_intelligence or cortex_lens"
              - "WorkflowEngine.lifecycle_hooks_active == True"
              - "CCL.governance_crystal_loaded == True"
          
          - rule_id: "CORE-018"
            name: "YAML-First Design"
            enhancement: |
              Add explicit reference to workflow template architecture.
              Every orchestrator must have a YAML workflow template — not just
              YAML config. The workflow template IS the orchestrator's execution
              contract.
            new_checks:
              - "Every orchestrator in registry has a workflow_template field"
              - "Workflow template file exists at referenced path"
              - "Template follows lifecycle schema (setup/governance/execute/validate/teardown)"
          
          - rule_id: "CORE-019"
            name: "Route Through TDD-Master"
            enhancement: |
              Update to reference consolidated MCP tools (cortex_process_request
              routes to TDDOrchestrator via MasterOrchestrator). Remove references
              to old toolkit tools.
          
          - rule_id: "CORE-024"
            name: "@mcp_tool Required"
            enhancement: |
              Update to reflect consolidated MCP tool count (~22 tools).
              Add validation that every MCP tool maps to exactly ONE orchestrator.
              Cross-reference with capability-manifest.yaml MCP section.
            new_checks:
              - "MCPServer.list_tools() count == capability_manifest.mcp_tools.expected_count"
              - "Every tool has exactly one orchestrator mapping in wiring.yaml"
          
          - rule_id: "CORE-028"
            name: "Intelligent File Naming"
            enhancement: |
              Update to reference canonical FileFactory at cortex/core/file_factory.py.
              Remove references to old filename_factory.py locations.
              Add YAML kebab-case validation for workflow templates.
            new_checks:
              - "FileFactory is imported from cortex.core.file_factory (canonical)"
              - "All workflow template files use kebab-case naming"
          
          - rule_id: "CORE-029"
            name: "Documentation Drift Prevention"
            enhancement: |
              Add cortex-docs alignment check. After refactor, cortex-docs must
              accurately represent the new architecture (hexagonal, single package,
              workflow templates, ~22 MCP tools).
            new_checks:
              - "cortex-docs architecture page matches actual package structure"
              - "MCP tool documentation matches MCPServer.list_tools()"
          
          - rule_id: "CORE-030"
            name: "Implementation Truth Enforcement"
            enhancement: |
              Update verification commands to search cortex/ only (not
              cortex_intelligence/ or cortex_lens/ which no longer exist).
              Add SQLite audit trail verification as truth source.
            updated_protocol:
              - "grep_search scope: cortex/ only (single package)"
              - "SQLite audit logs as secondary truth verification"
              - "cortex_verify_claim validates against live code + audit trail"
          
          - rule_id: "CORE-032"
            name: "Mandatory Intent Classification"
            enhancement: |
              Update orchestrator count reference from "23" to "~44" (post-refactor).
              Add references to new SDLC orchestrators (CiCdOrchestrator,
              DesignOrchestrator). Ensure IntentRouterFactory covers all SDLC intents.
            updated_references:
              - "All ~44 orchestrators created via factory"
              - "SDLC intents classified: plan, design, code, test, security, review, cicd, docs, git, deploy, monitor, maintain, onboard"
          
          - rule_id: "CORE-034"
            name: "Mandatory Audit Logging"
            enhancement: |
              Update to reference CortexAuditDB (SQL-001) as the canonical
              audit logging destination. All AuditLogger.log_event() calls
              write to .cortex-runtime/cortex-audit.db (not scattered .db files).
              Add SQLite-specific audit events.
            new_audit_events:
              - "SQLITE_AUDIT_RECORDED"
              - "SQLITE_CLEANUP_EXECUTED"
              - "SQLITE_WAL_CHECKPOINT"
              - "GOVERNANCE_CRYSTAL_LOADED"
              - "CCL_GOVERNANCE_EVALUATED"
            updated_destination: "CortexAuditDB → .cortex-runtime/cortex-audit.db"
          
          - rule_id: "CORE-035"
            name: "Single Canonical Implementation"
            enhancement: |
              Update forbidden_patterns to include patterns discovered in the
              GPT review. Add explicit check for duplicate skull-rules.yaml.
              Add post-refactor verification scope (cortex/ only).
            additional_forbidden_patterns:
              - "Duplicate governance files (skull-rules.yaml in 2+ locations)"
              - "Inner package duplicates (cortex/cortex-registry/, cortex/cortex_intelligence/)"
              - "Shadow test directories (cortex/tests/ vs tests/)"
            verification_scope: "cortex/ only (cortex_intelligence/ and cortex_lens/ archived)"
          
          - rule_id: "CORE-038"
            name: "File Placement Policy"
            enhancement: |
              Update required_patterns to reflect consolidated package structure.
              Remove references to cortex_intelligence/ paths.
              Add cortex/orchestrators/ as the canonical orchestrator location.
            updated_patterns:
              required:
                - "cortex/{module}/file.py (single package)"
                - "cortex/orchestrators/{domain}/orchestrator.py"
                - "cortex/intelligence/{tier}/file.py"
                - "cortex/governance/{domain}/file.py"
              removed:
                - "cortex_intelligence/{tier}/{domain}/file.py (archived)"
                - "cortex_lens/{module}/file.py (archived)"
          
          - rule_id: "CORE-040"
            name: "Documentation Lifecycle Management"
            enhancement: |
              Add SQLite-backed lifecycle registry as alternative to YAML sidecar.
              CortexAuditDB can track document expiration natively.
            new_option: |
              Lifecycle metadata can be stored in cortex-audit.db instead of
              YAML sidecar files. CortexAuditDB.register_document(path, expires_at)
              provides centralized lifecycle tracking with query support.
          
          - rule_id: "CORE-051"
            name: "Intelligence-Architecture Tier Coupling"
            enhancement: |
              Update tier coupling to reference consolidated intelligence layer.
              LENS analysis now lives in cortex/intelligence/ (not cortex_lens/).
              Update wiring references.
          
          - rule_id: "CORE-052"
            name: "Holistic Validation Gate Mandatory"
            enhancement: |
              Add workflow template validation to holistic checks.
              Every orchestrator must have a workflow template. 
              Add capability manifest regression gate to validation sequence.
            additional_validations:
              - "Workflow template exists for every active orchestrator"
              - "Capability manifest regression check passes"
              - "SQLite audit trail consistent with execution history"
          
          - rule_id: "CORE-054"
            name: "MCP Tool Wiring Validation"
            enhancement: |
              Update expected tool count from legacy to ~22 (post-consolidation).
              Add cross-validation against capability-manifest.yaml MCP section.
              Validate that absorbed tools are NOT in wiring (they no longer exist).
            new_checks:
              - "No absorbed/deleted tools appear in wiring.yaml"
              - "Tool count matches capability-manifest expected_count"
              - "Every tool has a corresponding orchestrator in the registry"

        # === MERGE (rules with overlapping concerns) ===
        merge:
          - target_rule: "CORE-002"
            merge_from: "CORE-039"
            merged_name: "No Automatic File Generation"
            reason: |
              CORE-002 (Markdown Report Suppression) and CORE-039 (MD File
              Generation Prohibition) address the same concern from different
              angles. Merge into a single comprehensive rule:
              - No automatic markdown generation (CORE-002)
              - No phase-end MD generation (CORE-039)
              - Only user-requested documentation permitted
              - Runtime enforcement via monkey-patching (from CORE-039)
              - Audit event: AUTO_FILE_GENERATION_BLOCKED
            disposition: |
              Keep CORE-002 as the canonical rule, absorb CORE-039 content,
              archive CORE-039 with pointer to CORE-002.

        # === NORMALIZE (non-standard naming) ===
        normalize:
          - rule_id: "AC-PERMANENT-FIX-006"
            new_id: "CORE-056"
            name: "Challenge System Permanent Wiring"
            reason: |
              AC-PERMANENT-FIX naming is historical (from incident fixes).
              Normalize to CORE-* sequence for consistency. The rule content
              is valid — only the ID changes. Update all references.
          
          - rule_id: "AC-PERMANENT-FIX-007"
            new_id: "CORE-057"
            name: "Holistic Duplicate Detection Prevention"
            reason: |
              Same normalization as AC-PERMANENT-FIX-006. Absorb into CORE-035
              (Single Canonical Implementation) as a sub-rule, since duplicate
              detection is a specific enforcement of the SSOT principle.
              Alternative: keep as standalone CORE-057 if scope is broader.
            decision: "Absorb into CORE-035 as sub-section 'duplicate_detection'"

        # === REVIEW FOR RELEVANCE ===
        review:
          - rule_id: "CORE-004"
            name: "Minimal Continuation Prompts"
            assessment: |
              This rule suppresses "Would you like me to continue?" prompts.
              Still relevant in the cohesive brain — AI should execute
              autonomously within approved plans. KEEP but verify the
              enforcement mechanism still works post-refactor.
            disposition: "KEEP — verify enforcement"
          
          - rule_id: "CORE-020"
            name: "No Markdown in Brain"
            assessment: |
              References "brain" which is being dissolved. Update to reference
              "orchestrator responses" and "MCP tool outputs" instead.
              The principle (no markdown formatting in internal processing)
              is still valid.
            disposition: "ENHANCE — update terminology from 'brain' to 'orchestrators/MCP'"
          
          - rule_id: "CORE-053"
            name: "Context Crystallization Layer Timeout Policy"
            assessment: |
              Still relevant — CCL is becoming MORE important with governance
              crystal integration. Update timeout SLA if governance crystal
              adds latency. May need to increase p99 from 500ms to 750ms to
              accommodate governance rule pre-loading.
            disposition: "ENHANCE — update SLA for governance crystal overhead"

    # --------------------------------------------------------------------------
    # G3: New Rules for Refactored Architecture
    # --------------------------------------------------------------------------
    - id: "G3"
      name: "New Governance Rules"
      description: |
        The refactored architecture introduces concepts that need governance
        protection: SQLite audit, MCP consolidation, SDLC coverage, workflow
        templates, and CCL governance integration.
      
      new_rules:
        - rule_id: "CORE-058"
          name: "SQLite Audit Integrity"
          category: "auditability"
          severity: "blocked"
          description: |
            All CORTEX operations MUST log to CortexAuditDB via the canonical
            audit interface. No raw sqlite3.connect() calls permitted outside
            CortexAuditDB. All databases use WAL mode. Retention policies
            enforced automatically.
          enforcement:
            - "grep -r 'sqlite3.connect' cortex/ must return 0 matches outside audit_db.py"
            - "All .db files in .cortex-runtime/ only (no scattered databases)"
            - "WAL mode verified on database open"
          references: ["SQL-001", "SQL-002", "SQL-003", "SQL-004"]

        - rule_id: "CORE-059"
          name: "Workflow Template Mandatory"
          category: "architecture_integrity"
          severity: "blocked"
          description: |
            Every active orchestrator MUST have a corresponding workflow template
            in cortex-registry/workflows/templates/. The template defines the
            orchestrator's execution contract (setup, governance_gate, execute,
            validate, teardown). No orchestrator may execute without a template.
          enforcement:
            - "Registry validation: orchestrator.workflow_template field required"
            - "Template file must exist at referenced path"
            - "Template must follow lifecycle schema"
          references: ["EA-004", "00-overview workflow_templates section"]

        - rule_id: "CORE-060"
          name: "Single Package Boundary"
          category: "architecture_integrity"
          severity: "blocked"
          description: |
            CORTEX operates as a SINGLE Python package (cortex/). No code may
            import from cortex_intelligence/, cortex_lens/, or any other
            top-level package. The import quarantine check enforces this.
          enforcement:
            - "grep -r 'from cortex_intelligence' cortex/ must return 0"
            - "grep -r 'from cortex_lens' cortex/ must return 0"
            - "grep -r 'from _archive' cortex/ must return 0"
            - "pyproject.toml lists exactly one package: cortex"
          references: ["EA-001", "Phase 01 Package Consolidation"]

        - rule_id: "CORE-061"
          name: "SDLC Brain Coverage"
          category: "quality_gates"
          severity: "blocked"
          description: |
            CORTEX MUST cover ALL 13 SDLC phases with dedicated orchestrators
            and/or MCP tools. No SDLC phase may be orphaned. The capability
            manifest SDLC section is the verification source.
          sdlc_phases:
            - "SDLC-001: Planning (PlanOrchestrator)"
            - "SDLC-002: Design (DesignOrchestrator)"
            - "SDLC-003: Implementation (TDDOrchestrator)"
            - "SDLC-004: Testing (TestOrchestrator)"
            - "SDLC-005: Security (SecurityOrchestrator)"
            - "SDLC-006: Code Review (CodeReviewOrchestrator)"
            - "SDLC-007: CI/CD Pipeline (CiCdOrchestrator)"
            - "SDLC-008: Documentation (DocumentationOrchestrator)"
            - "SDLC-009: Version Control (GitOrchestrator)"
            - "SDLC-010: Deployment (DeploymentOrchestrator)"
            - "SDLC-011: Monitoring (ObservabilityOrchestrator)"
            - "SDLC-012: Maintenance (HealthOrchestrator + VacuumOrchestrator)"
            - "SDLC-013: Onboarding (OnboardingOrchestrator)"
          enforcement:
            - "Capability manifest Section 8 SDLC coverage verified"
            - "Each SDLC phase has at least one orchestrator mapped"
            - "Each orchestrator has a workflow template"
          references: ["capability-manifest Section 8", "Phase 07 V7 SDLC Verification"]

        - rule_id: "CORE-062"
          name: "MCP Tool Consolidation Contract"
          category: "architecture_integrity"
          severity: "blocked"
          description: |
            MCP tool count MUST stay within the consolidated target (~22 tools).
            No new standalone tools without absorbing or archiving an existing one.
            Every tool maps to exactly ONE orchestrator. No toolkit_ prefix permitted.
          enforcement:
            - "MCPServer.list_tools() count <= 25 (with buffer)"
            - "No tool name starts with 'toolkit_'"
            - "Every tool has exactly one orchestrator mapping"
            - "capability-manifest MCP section is the SSOT for tool inventory"
          references: ["00-overview mcp_consolidation section", "MCP-001 through MCP-022"]

        - rule_id: "CORE-063"
          name: "CCL Governance Crystal Required"
          category: "orchestration_lifecycle"
          severity: "blocked"
          description: |
            The Context Crystallization Layer (CCL) MUST include a governance
            crystal that pre-loads applicable rules per intent category.
            This makes governance enforcement intrinsic to every CORTEX turn —
            not an optional gate. The governance crystal is cached per session
            and re-evaluated when intent changes.
          crystal_contents:
            - "Tier 0 skull rules (all — always loaded)"
            - "Tier 1 project rules (filtered by intent category)"
            - "Tier 2 engineering rules (filtered by file type)"
            - "Prior violation history (from SQLite audit trail)"
            - "Applicable EA principles (filtered by operation type)"
          enforcement:
            - "CCL warm-up includes governance crystal loading"
            - "Governance crystal loaded within CCL timeout SLA (CORE-053)"
            - "Rule violations from prior turns carried forward"
            - "crystal_loaded == True before orchestrator execution"
          performance:
            - "Governance crystal adds <50ms to CCL warm-up"
            - "Rule filtering by intent: <5ms"
            - "Prior violations query: <10ms (SQLite indexed)"
          references: ["CORE-053 (CCL Timeout)", "EA-011 (Plan-First Memory)", "SQL-001"]

    # --------------------------------------------------------------------------
    # G4: Tier 1 & Tier 2 Rules Alignment
    # --------------------------------------------------------------------------
    - id: "G4"
      name: "Tier 1 & Tier 2 Rules Review"
      description: |
        Project-rules.yaml (Tier 1) and engineering-standards.yaml (Tier 2)
        must be reviewed for alignment with the refactored architecture.
      
      tier1_review:
        - rule_id: "P1-001"
          name: "Phase Registry Sync"
          disposition: "ENHANCE — add workflow template sync requirement"
        
        - rule_id: "P1-002"
          name: "Project TDD"
          disposition: "KEEP — reinforces CORE-008"
        
        - rule_id: "P1-003"
          name: "Registry Code Separation"
          disposition: "ENHANCE — update to single package (cortex/ only, not cortex_intelligence/)"
        
        - rule_id: "P1-004"
          name: "Deployment Safety Gate"
          disposition: "KEEP — add SQLite health check to safety gate"
      
      tier2_review:
        - rule_id: "E2-001"
          name: "Type Annotations"
          disposition: "KEEP — reinforces CORE-011"
        
        - rule_id: "E2-002"
          name: "Docstring Standards"
          disposition: "KEEP — reinforces CORE-012"
        
        - rule_id: "E2-003"
          name: "Specific Exception Handling"
          disposition: "KEEP — reinforces CORE-013"
        
        - rule_id: "E2-004"
          name: "No Hardcoded Absolute Paths"
          disposition: "KEEP — update core_rule_ref from CORE-051 to CORE-005"
        
        - rule_id: "E2-005"
          name: "Orchestrator Golden Tests"
          disposition: "KEEP — reinforces CORE-008 + CORE-055"
      
      new_tier1_rules:
        - rule_id: "P1-005"
          name: "Single Package Enforcement"
          description: "No imports from cortex_intelligence/ or cortex_lens/"
          core_rule_ref: "CORE-060"
        
        - rule_id: "P1-006"
          name: "SQLite Audit Mandatory"
          description: "All operations log to CortexAuditDB"
          core_rule_ref: "CORE-058"
      
      new_tier2_rules:
        - rule_id: "E2-006"
          name: "Workflow Template Required"
          description: "Every orchestrator must reference a workflow template"
          core_rule_ref: "CORE-059"
        
        - rule_id: "E2-007"
          name: "CortexAuditDB Usage"
          description: "Use CortexAuditDB.log_event(), never raw sqlite3.connect()"
          core_rule_ref: "CORE-058"

    # --------------------------------------------------------------------------
    # G5: CCL Integration Implementation Plan
    # --------------------------------------------------------------------------
    - id: "G5"
      name: "CCL Governance Crystal Integration"
      description: |
        Design and implement the governance crystal within CCL. This is the
        answer to "Should governance enforcement be part of CCL?" — YES.
        
        The governance crystal makes rules INTRINSIC to CORTEX cognition:
        - Pre-loaded on CCL warm-up (every turn)
        - Filtered by intent category (low overhead)
        - Violations carried forward across turns (persistent memory)
        - Cached per session (zero redundant parsing)
        
        This is NOT a new orchestrator. It extends the existing CCL module
        (cortex/orchestrators/context_crystallization.py) with a new crystal type.
      
      architecture:
        ccl_module: "cortex/orchestrators/context_crystallization.py"
        crystal_name: "GovernanceCrystal"
        crystal_class: "cortex/governance/crystal/governance_crystal.py"
        
        crystal_lifecycle:
          warm_up:
            - "Load tier0-skull/skull-rules.yaml (all rules)"
            - "Load tier1-project/project-rules.yaml (all rules)"
            - "Load tier2-engineering/engineering-standards.yaml (all rules)"
            - "Query SQLite for prior violations (last 24h)"
            - "Build rule index by category for O(1) lookup"
          
          per_request:
            - "Classify intent → get applicable rule categories"
            - "Filter rules by category from cached index"
            - "Inject applicable rules into orchestrator context"
            - "Check prior violations for same file/module"
          
          teardown:
            - "Log governance evaluation result to SQLite"
            - "Update violation history cache"
            - "Emit GOVERNANCE_CRYSTAL_EVALUATED audit event"
        
        data_model:
          governance_crystal:
            tier0_rules: "List[GovernanceRule]  # Always loaded"
            tier1_rules: "List[GovernanceRule]  # Always loaded"
            tier2_rules: "List[GovernanceRule]  # Always loaded"
            rule_index: "Dict[str, List[GovernanceRule]]  # Indexed by category"
            prior_violations: "List[ViolationRecord]  # From SQLite"
            session_cache_key: "str  # Hash of loaded YAML files"
          
          applicable_rules:
            intent: "str  # Current intent classification"
            rules: "List[GovernanceRule]  # Filtered for this intent"
            prior_violations_for_context: "List[ViolationRecord]"
            enforcement_level: "str  # strict | warning | advisory"
      
      output_files:
        - "cortex/governance/crystal/governance_crystal.py"
        - "cortex/governance/crystal/__init__.py"
      test_files:
        - "tests/golden/governance/test_governance_crystal.py"
      acceptance_criteria:
        - "GovernanceCrystal loads all 3 tiers within <50ms"
        - "Rule filtering by intent <5ms"
        - "Prior violations query <10ms"
        - "Crystal integrates with existing CCL warm-up"
        - "Golden test validates crystal accuracy against known rules"
        - "Violation history persists across turns"

    # --------------------------------------------------------------------------
    # G6: Governance Rule Summary — Post-Alignment Inventory
    # --------------------------------------------------------------------------
    - id: "G6"
      name: "Post-Alignment Rule Inventory"
      description: |
        After G1-G5, produce the final governance rule inventory as a
        verified YAML artifact. This becomes the SSOT for governance rules
        going forward and feeds into the capability manifest.
      
      post_alignment_inventory:
        tier0_skull_rules:
          total: 39  # 36 original - 1 merged (CORE-039) - 2 normalized (AC-*) + 6 new (CORE-058 to CORE-063) + 2 normalized back (as CORE-056, absorbed into CORE-035) = net ~39
          breakdown:
            kept_as_is: 14
            enhanced: 17
            merged: 1        # CORE-039 → absorbed into CORE-002
            normalized: 2    # AC-PERMANENT-FIX-006 → CORE-056, AC-PERMANENT-FIX-007 → absorbed into CORE-035
            new: 6           # CORE-058 through CORE-063
            archived: 0      # No rules deleted — only merged or absorbed
        
        tier1_project_rules:
          total: 6   # 4 existing + 2 new (P1-005, P1-006)
        
        tier2_engineering_rules:
          total: 7   # 5 existing + 2 new (E2-006, E2-007)
      
      output_files:
        - "cortex-registry/core/tier0-skull/skull-rules.yaml (updated)"
        - "cortex-registry/core/tier1-project/project-rules.yaml (updated)"
        - "cortex-registry/core/tier2-engineering/engineering-standards.yaml (updated)"
      acceptance_criteria:
        - "All YAML files parse cleanly (yaml.safe_load)"
        - "No duplicate rule_ids across all tiers"
        - "Every rule has: rule_id, name, severity, category, description"
        - "capability-manifest governance section matches rule inventory"
        - "Zero references to archived packages (cortex_intelligence, cortex_lens)"

  # ============================================================================
  # EXIT GATE
  # ============================================================================
  exit_gate:
    all_must_pass:
      - "Duplicate skull-rules.yaml eliminated (G1)"
      - "All 36 rules reviewed with documented disposition (G2)"
      - "6 new rules defined and validated (G3)"
      - "Tier 1 & Tier 2 rules aligned (G4)"
      - "CCL GovernanceCrystal designed and tested (G5)"
      - "Post-alignment inventory verified (G6)"
      - "All YAML files parse cleanly"
      - "Zero references to cortex_intelligence/ or cortex_lens/ in rules"
      - "No duplicate rule_ids"
      - "capability-manifest governance section updated"
      - "AC-PERMANENT-FIX-* rules normalized to CORE-* IDs"
      - "CORE-002 and CORE-039 merged successfully"
      - "GovernanceCrystal golden test passes"
      - "Import quarantine check passes (zero _archive imports)"

  # ============================================================================
  # EXECUTION SEQUENCE
  # ============================================================================
  execution_sequence:
    - step: 1
      action: "Delete duplicate skull-rules.yaml from governance/"
      deliverable: "G1"
      risk: "low"
      
    - step: 2
      action: "Review and apply all rule dispositions (keep/enhance/merge/normalize)"
      deliverable: "G2"
      risk: "low"
      
    - step: 3
      action: "Define and add 6 new governance rules (CORE-058 to CORE-063)"
      deliverable: "G3"
      risk: "low"
      
    - step: 4
      action: "Update Tier 1 and Tier 2 rules"
      deliverable: "G4"
      risk: "low"
      
    - step: 5
      action: "Implement GovernanceCrystal for CCL integration"
      deliverable: "G5"
      risk: "medium (new code, needs golden test)"
      
    - step: 6
      action: "Produce post-alignment inventory and update manifest"
      deliverable: "G6"
      risk: "low"

  # ============================================================================
  # EXIT GATE
  # ============================================================================
  exit_gate:
    all_rules_reviewed: true
    duplicate_eliminated: true
    new_rules_added: true
    ccl_crystal_designed: true
    no_stale_references: true
    coverage_minimum: 90
    description: |
      Phase 02 is complete when:
      1. Duplicate skull-rules.yaml eliminated (3 copies → 1)
      2. All 36 rules reviewed with documented disposition (G2)
      3. 6 new rules defined and validated (G3)
      4. Tier 1 & Tier 2 rules aligned (G4)
      5. CCL GovernanceCrystal designed and tested (G5)
      6. Post-alignment inventory verified (G6)
      7. All YAML files parse cleanly
      8. Zero references to cortex_intelligence/ or cortex_lens/ in rules
      9. No duplicate rule_ids
      10. capability-manifest governance section updated
      11. AC-PERMANENT-FIX-* rules normalized to CORE-* IDs
      12. CORE-002 and CORE-039 merged successfully
      13. GovernanceCrystal golden test passes
      14. Import quarantine check passes (zero _archive imports)

  # ============================================================================
  # VALIDATION LOOP — FINAL STAGE (MANDATORY)
  # ============================================================================
  # Authority: cortex-refactor-master.yaml § validation_loops
  # This stage runs AFTER all deliverables are implemented.
  # It loops until every exit gate check passes. Once clean, CORTEX
  # autonomously begins Phase 03 without user intervention.
  # ============================================================================
  validation_loop:
    stage_id: "VL-02"
    phase: "phase-02"
    next_phase: "phase-03"
    next_phase_spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-03-package-consolidation.yaml"
    max_iterations: 10
    iteration_timeout_minutes: 20

    checks:
      - id: "VL-02-C1"
        name: "Exactly one skull-rules.yaml"
        command: "find cortex-registry/ -name 'skull-rules.yaml' | wc -l"
        pass_condition: "output is 1"
        on_fail: "Delete the duplicate at cortex-registry/core/governance/skull-rules.yaml"

      - id: "VL-02-C2"
        name: "All rule loaders point to canonical path"
        command: "grep -r 'core/governance/skull-rules' cortex-registry/ cortex/ | wc -l"
        pass_condition: "output is 0"
        on_fail: "Update all YAML loaders to reference cortex-registry/core/tier0-skull/skull-rules.yaml"

      - id: "VL-02-C3"
        name: "No duplicate rule IDs"
        command: "python -c \"import yaml,re; rules=yaml.safe_load(open('cortex-registry/core/tier0-skull/skull-rules.yaml').read()); ids=[r.get('rule_id') for r in rules.get('rules',{}).values() if isinstance(r,dict)]; dupes=[x for x in ids if ids.count(x)>1]; print('DUPES:',dupes if dupes else 'none')\""
        pass_condition: "prints DUPES: none"
        on_fail: "Merge duplicate rule IDs, normalize AC-PERMANENT-FIX-* to CORE-* IDs"

      - id: "VL-02-C4"
        name: "Zero stale references to dissolved packages in rules"
        command: "grep -r 'cortex_intelligence\\|cortex_lens\\|cortex\\.brain' cortex-registry/core/ | wc -l"
        pass_condition: "output is 0"
        on_fail: "Update each stale rule reference to use new cortex.intelligence.* paths"

      - id: "VL-02-C5"
        name: "GovernanceCrystal golden test passes"
        command: "pytest tests/golden/governance/test_governance_crystal.py -v --tb=short"
        pass_condition: "exit code 0, zero failures"
        on_fail: "Fix GovernanceCrystal implementation, ensure CCL integration is correct"

      - id: "VL-02-C6"
        name: "6 new CORE rules present (058–063)"
        command: "grep -l 'CORE-058\\|CORE-059\\|CORE-060\\|CORE-061\\|CORE-062\\|CORE-063' cortex-registry/core/tier0-skull/skull-rules.yaml | wc -l"
        pass_condition: "output is 1"
        on_fail: "Add missing new governance rules to skull-rules.yaml"

      - id: "VL-02-C7"
        name: "Capability manifest governance section updated"
        command: "python -c \"import yaml; m=yaml.safe_load(open('cortex-registry/planning/phases/planned/cortex-refactor/capability-manifest.yaml')); gs=m.get('governance',{}); print('rules:',len(gs.get('rules',[])),'>= 40?', len(gs.get('rules',[]))>=40)\""
        pass_condition: "prints rules: N >= 40? True"
        on_fail: "Update capability-manifest.yaml governance section with all reviewed rules"

      - id: "VL-02-C8"
        name: "All governance YAML files parse cleanly"
        command: "python -c \"import yaml,os; [yaml.safe_load(open(os.path.join(r,f))) for r,d,files in os.walk('cortex-registry/core/') for f in files if f.endswith('.yaml')]; print('all parse OK')\""
        pass_condition: "prints all parse OK"
        on_fail: "Fix YAML syntax errors in failing governance files"

    loop_behavior:
      strategy: "conditional_retry"
      description: |
        1. Run all checks (VL-02-C1 through VL-02-C8) in sequence.
        2. If ALL checks pass → loop exits CLEAN → proceed to autonomous_advance.
        3. If ANY check fails:
           a. Apply the on_fail remediation for each failing check.
           b. Record iteration result in cortex-refactor-master.yaml validation_loops.history.
           c. Increment iteration counter.
           d. If iteration_count > max_iterations → HALT with P0 alert to user.
           e. Otherwise → restart from check C1.
        4. Never skip a check — all must pass in the same iteration.

    autonomous_advance:
      enabled: true
      trigger: "All VL-02 checks pass in same iteration"
      actions:
        - action: "Update cortex-refactor-master.yaml"
          changes:
            - "phases[phase-02].status → complete"
            - "phases[phase-02].progress.completed → ISO timestamp"
            - "phases[phase-02].progress.validation_loop_iterations → N"
            - "metadata.counters.pending -= 1"
            - "metadata.counters.complete += 1"
        - action: "Move phase spec to completed/"
          command: "cp cortex-registry/planning/phases/planned/cortex-refactor/phase-02-governance-alignment.yaml cortex-registry/planning/phases/completed/cortex-refactor/"
        - action: "Git checkpoint"
          command: "git add -A && git commit -m 'refactor(phase-02): COMPLETE — governance aligned, crystal wired, advancing to phase-03'"
        - action: "Load and execute next phase"
          spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-03-package-consolidation.yaml"
          orchestrator: "CortexMasterPlanOrchestrator"
          method: "execute_phase(phase_id='phase-03')"
