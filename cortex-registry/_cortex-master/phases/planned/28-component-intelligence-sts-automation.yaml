# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================

overview:
  vision: |
    Create complete domain intelligence with automated STS transformation engine:
    
    1. **Component Registration** — Consolidate 296 unregistered components into
       4 super-orchestrators (IntelligenceOrchestrator, SOLIDOrchestrator,
       StateOrchestrator, ObservabilityOrchestrator). 70 contract tests prevent
       unwiring. Component discovery automated.
    
    2. **Advanced Knowledge YAMLs** — Expand from 36 to 59 knowledge YAMLs covering
       90% of enterprise tech stacks. Includes Azure Security Benchmark, Databricks
       (Spark, Delta Lake), LaunchDarkly (feature flags), advanced .NET (EF Core,
       Blazor), Angular v17+, Python data engineering (Airflow, dbt).
    
    3. **STS Automated Analysis** — New cortex_analyze_sts_app MCP tool detects
       61 anti-patterns automatically. Generates before/after metrics, complexity
       scores, technical debt quantification. Enables scalable STS showcase.
    
    4. **CCL STS Integration** — Phase 49 Context Crystallization Layer gains
       STS-specific pattern cache. DigestOrchestrator integrates with STS workflow.
       15% faster analysis on repeated STS patterns.

  problem_statement: |
    CURRENT STATE (P1 GAPS):
    
    **Component Architecture:**
    - 296 components exist but not in wiring registry (21% coverage)
    - 71 HIGH_VALUE components providing critical functionality scattered
    - No contract enforcement (components removable without detection)
    - Orchestrators can bypass governance by avoiding registered components
    
    **Knowledge Coverage:**
    - 36 YAMLs cover 60% of enterprise needs (missing 23 critical domains)
    - No Azure Security Benchmark (cloud-native security)
    - No Databricks patterns (Spark, Delta Lake, data pipelines)
    - No LaunchDarkly governance (feature flag architecture)
    - No advanced .NET (EF Core, ASP.NET Core 8.0, Blazor)
    - No Angular v17+ (signals, standalone components)
    - No Python data engineering (Airflow, dbt, Great Expectations)
    
    **STS Capabilities:**
    - 61 anti-patterns documented but no automated detection
    - Manual showcase generation (not scalable)
    - No before/after state tracking
    - Cannot analyze Payment Processor or RA Domain apps automatically
    
    **Learning & Intelligence:**
    - Phase 49 CCL has no STS-specific pattern cache
    - DigestOrchestrator not integrated with STS workflow
    - No pattern frequency tracking across sessions
    - Repeated analysis of similar STS codebases (zero reuse)
    
    IMPACT:
    - ❌ Cannot refactor Azure/Databricks/LaunchDarkly apps (missing knowledge)
    - ❌ 71 critical components invisible to orchestrators
    - ❌ STS showcase requires manual effort (not scalable)
    - ❌ No data engineering best practices available
    - ❌ Repeated STS pattern analysis (inefficient)

  success_criteria:
    - "✅ Component registry: 296 components → 4 super-orchestrators"
    - "✅ Contract tests: 70 unwiring prevention tests operational"
    - "✅ Knowledge YAMLs: 36 → 59 (90% enterprise coverage)"
    - "✅ STS tool: cortex_analyze_sts_app MCP tool operational"
    - "✅ Anti-patterns: 61 automated detection patterns"
    - "✅ CCL cache: STS pattern cache with 15% speedup"
    - "✅ Golden tests: 80+ tests covering all components"

