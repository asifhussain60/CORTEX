# ============================================================================
# ARCHITECTURAL DECISIONS
# ============================================================================
architectural_decisions:
  - decision: "Python + Jinja2 (NOT Astro/Node.js)"
    rationale: |
      CORTEX is a Python-first system. The MEGA-B documentation library,
      all pipeline scripts, and the orchestrator infrastructure are Python.
      Adding Astro introduces a Node.js runtime dependency, a second
      build toolchain, and violates CORE-035 (single canonical implementation).
      Jinja2 integrates natively with existing pipeline modules.
    alternatives_rejected: ["Astro (Node.js)", "Next.js (Node.js)", "Hugo (Go)"]

  - decision: "content.json as build-time contract (NOT hardcoded JSON in HTML)"
    rationale: |
      Machine-readable contract enables: validation gates, future search indexing,
      incremental rebuilds via hash comparison, and adding new roles without HTML
      surgery. Hardcoded JSON creates maintenance burden and bypasses validation.
    alternatives_rejected: ["Inline JSON in HTML", "Direct MD-to-HTML without intermediate"]

  - decision: "Extend existing index.html (NOT replace)"
    rationale: |
      The 1093-line landing page is deployed, SEO-indexed (Google, Twitter Cards,
      Open Graph), has Web Vitals monitoring, and CSP headers. Replacing it would
      lose SEO ranking, break existing backlinks, and require re-certification.
      Adding 3 role gateway cards is a minimal, non-breaking change.
    alternatives_rejected: ["Replace with gemini-index.html", "New landing page"]

  - decision: "3 roles (Business, Product, Engineering) — NOT 5"
    rationale: |
      Agent spec consolidation (Chat01) reduced from 4-5 personas to 3 roles with
      blended perspectives. Dev Manager insights fold into Engineering, QA insights
      fold into Product + Engineering. 3 roles = simpler navigation, less content
      duplication, better maintenance profile.
    alternatives_rejected: ["5 roles (gemini pattern)", "4 roles (original spec)"]

# ============================================================================
# RISK ASSESSMENT
# ============================================================================
risks:
  - risk: "Jinja2 template complexity exceeds estimate"
    severity: medium
    mitigation: "gemini-index.html provides complete reference pattern (539 lines).
      Templates are structural extraction, not creative design."

  - risk: "content.json schema mismatch between extract.py and templates"
    severity: medium
    mitigation: "Define JSON schema in S2 before S4 extraction. Validate with
      jsonschema library in validation pipeline."

  - risk: "D3.js visualizations don't render in generated pages"
    severity: low
    mitigation: "D3.js integration proven in gemini-index.html. Copy pattern
      verbatim for 4 approved diagram types."

  - risk: "GitHub Actions deployment fails"
    severity: low
    mitigation: "Deployment pattern well-established. Use peaceiris/actions-gh-pages
      (standard, widely adopted). Test locally with serve-docs.bat first."

  - risk: "MD content insufficient for 15 child pages"
    severity: low
    mitigation: "30+ MD files across 8 categories already exist. Some pages may
      start thin and be enriched via refresh-docs-content.py in future cycles."

