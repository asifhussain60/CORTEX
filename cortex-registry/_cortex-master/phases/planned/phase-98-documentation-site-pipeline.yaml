# ============================================================================
# STAGES (CORE-042: PHASE→STAGE→TASK)
# ============================================================================
stages:
  - id: S1
    name: "CortexDocsOrchestrator — Wiring Layer"
    priority: P0
    estimated_sessions: 2-3
    estimated_tests: 15-20
    description: |
      Create the orchestrator that connects existing pipeline components.
      This is the missing glue layer referenced in both agent specs.

    tasks:
      - id: T1
        name: "CortexDocsOrchestrator core class with stage dispatch"
        files:
          - "cortex/orchestrators/internal/cortex_docs_orchestrator.py"
          - "cortex/orchestrators/internal/__init__.py"
        estimated_loc: 300-400
        details: |
          5-stage pipeline: discover → extract → render → validate → deploy.
          Imports and delegates to existing pipeline scripts.
          Uses incremental_builder.py for SHA-256 cache-based delta builds.
          Registers with orchestrator registry via __wiring_contract__.yaml.

      - id: T2
        name: "Integration with existing pipeline modules"
        files:
          - "cortex/orchestrators/internal/cortex_docs_orchestrator.py"
        estimated_loc: 100-150
        details: |
          Wire DiscoveryPipeline, ContentExtractor, and ContentValidator
          from cortex-registry/_cortex-docs/pipeline/ as stage delegates.
          Wire PortalGenerator and IncrementalBuilder from cortex/documentation/.

      - id: T3
        name: "Unit + integration tests"
        files:
          - "tests/unit/documentation/test_cortex_docs_orchestrator.py"
        estimated_loc: 200-250

    acceptance_criteria:
      - "✅ CortexDocsOrchestrator instantiates with pipeline dependencies"
      - "✅ 5-stage dispatch works (discover/extract/render/validate/deploy)"
      - "✅ Incremental build skips unchanged files (cache hit)"
      - "✅ Tests: 15-20 passing"
      - "✅ Lint clean, type hints, docstrings"
      - "✅ Enforcement gate passed"

  - id: S2
    name: "Jinja2 Templates — Glassmorphism Role Views"
    priority: P0
    estimated_sessions: 2-3
    estimated_tests: 10-15
    description: |
      Create the 2 Jinja2 templates that transform content.json into
      glassmorphism HTML. Pattern derived from gemini-index.html.

    tasks:
      - id: T1
        name: "Role landing template (role-landing.html.j2)"
        files:
          - "cortex-docs/templates/role-landing.html.j2"
        estimated_loc: 200-250
        details: |
          Sidebar navigation + multi-column glass card grid.
          Role-specific accent colors (purple=business, cyan=product, emerald=engineering).
          D3.js visualization containers.
          Truth badges (implemented/partial/aspirational).
          Journey bar with guided navigation path.
          Responsive breakpoints (320px, 768px, 1280px).
          Inherits glassmorphism v4.0 CSS from cortex-docs/assets/css/.

      - id: T2
        name: "Child page template (child-page.html.j2)"
        files:
          - "cortex-docs/templates/child-page.html.j2"
        estimated_loc: 150-200
        details: |
          Breadcrumb navigation (Home > Role > Page).
          Same sidebar + glass card pattern as landing.
          Content sections rendered from content.json.
          Optional D3.js visualization panels.
          Related pages cross-links.

      - id: T3
        name: "Template rendering engine + tests"
        files:
          - "cortex/documentation/template_renderer.py"
          - "tests/unit/documentation/test_template_renderer.py"
        estimated_loc: 250-300
        details: |
          Jinja2 Environment setup with template loader.
          Render function: content.json + template → HTML string.
          Role color/icon mapping.
          Breadcrumb builder.
          Navigation item builder from content.json structure.

    acceptance_criteria:
      - "✅ role-landing.html.j2 renders valid HTML with glassmorphism theme"
      - "✅ child-page.html.j2 renders with breadcrumbs and glass cards"
      - "✅ Template renderer passes Jinja2 content through autoescaping"
      - "✅ Generated HTML passes W3C validation"
      - "✅ Tests: 10-15 passing"
      - "✅ Responsive at 320px, 768px, 1280px"

  - id: S3
    name: "CLI Build Scripts — Pipeline Entry Points"
    priority: P0
    estimated_sessions: 1-2
    estimated_tests: 8-12
    description: |
      Create the CLI scripts that users and CI invoke to build the site.
      These are thin wrappers around CortexDocsOrchestrator.

    tasks:
      - id: T1
        name: "Main build script (build-docs-site.py)"
        files:
          - "scripts/build-docs-site.py"
        estimated_loc: 150-200
        details: |
          CLI entry point: python scripts/build-docs-site.py [--full|--incremental]
          Delegates to CortexDocsOrchestrator.run().
          Supports flags: --skip-discovery, --skip-validation, --dry-run.
          Outputs build summary table.

      - id: T2
        name: "Content refresh script (refresh-docs-content.py)"
        files:
          - "scripts/refresh-docs-content.py"
        estimated_loc: 100-150
        details: |
          Git delta detection: commits since last content update.
          Identifies affected MD files by category.
          Delegates to CortexDocsOrchestrator.discover() + extract() only.
          Outputs change manifest for review.

      - id: T3
        name: "Script tests"
        files:
          - "tests/unit/documentation/test_build_scripts.py"
        estimated_loc: 100-150

    acceptance_criteria:
      - "✅ build-docs-site.py executes full pipeline successfully"
      - "✅ refresh-docs-content.py detects git delta correctly"
      - "✅ --dry-run flag produces output without file creation"
      - "✅ --incremental flag skips unchanged files"
      - "✅ Tests: 8-12 passing"

  - id: S4
    name: "First Build — Generate content.json + Role Pages"
    priority: P0
    estimated_sessions: 1-2
    estimated_tests: 10-15
    description: |
      Execute the pipeline end-to-end for the first time.
      Generate content.json from 30+ MD files, then render
      3 role landing pages + 15 child pages.

    tasks:
      - id: T1
        name: "First content.json extraction"
        files:
          - "cortex-docs/content/content.json"
        estimated_loc: 0
        details: |
          Generated artifact. Run extract.py against cortex-docs/content/src/.
          Validate schema matches gitpages-builder.md § Stage 1 contract.
          Verify all 30+ documents indexed with metadata.

      - id: T2
        name: "Generate 3 role landing pages"
        files:
          - "cortex-docs/business/index.html"
          - "cortex-docs/product/index.html"
          - "cortex-docs/engineering/index.html"
        estimated_loc: 0
        details: |
          Generated artifacts. Template renderer + content.json → HTML.
          Business Leaders: ROI, governance, risk focus.
          Product Owners: capabilities, DoR, feature flow focus.
          Software Engineers: architecture, LENS, TDD, wiring focus.

      - id: T3
        name: "Generate 15 child view pages (5 per role)"
        files:
          - "cortex-docs/business/*.html (5 child pages)"
          - "cortex-docs/product/*.html (5 child pages)"
          - "cortex-docs/engineering/*.html (5 child pages)"
        estimated_loc: 0
        details: |
          Generated artifacts from content.json sections.
          Each child page has breadcrumbs, glass cards, optional D3.js.
          Business: roi-governance, risk-mitigation, compliance, metrics, strategy.
          Product: capabilities, definition-of-ready, feature-flow, use-cases, quality.
          Engineering: architecture, lens-intelligence, tdd-workflow, mcp-tools, wiring.

      - id: T4
        name: "End-to-end build validation tests"
        files:
          - "tests/integration/documentation/test_full_build_pipeline.py"
        estimated_loc: 150-200

    acceptance_criteria:
      - "✅ content.json generated with 30+ document entries"
      - "✅ 3 role landing pages render with glassmorphism theme"
      - "✅ 15 child pages render with correct breadcrumbs"
      - "✅ 0 broken links across all generated pages"
      - "✅ All pages reference cortex-docs/assets/css/ (no inline styles)"
      - "✅ D3.js visualizations render on architecture + intelligence pages"
      - "✅ Full pipeline executes in <30s"
      - "✅ Tests: 10-15 passing"

  - id: S5
    name: "Integration — Role Gateway + GitHub Actions + Cleanup"
    priority: P0
    estimated_sessions: 1-2
    estimated_tests: 5-8
    description: |
      Final integration: add role cards to existing index.html,
      create GitHub Actions deployment workflow, remove Astro scaffolding.

    tasks:
      - id: T1
        name: "Add role gateway cards to cortex-docs/index.html"
        files:
          - "cortex-docs/index.html"
        estimated_loc: 30-50
        details: |
          Minimal addition near bottom of existing 1093-line page.
          3 glass cards: Business Leaders → /business/, Product Owners → /product/,
          Software Engineers → /engineering/.
          Uses existing glassmorphism CSS classes.
          DO NOT restructure or rewrite existing page.

      - id: T2
        name: "GitHub Actions deployment workflow"
        files:
          - ".github/workflows/deploy-docs.yml"
        estimated_loc: 80-100
        details: |
          Trigger: push to CORTEX branch (paths: cortex-docs/content/src/**).
          Jobs: refresh-content → build-site → deploy-to-pages.
          Uses Python 3.11, installs jinja2.
          Deploys cortex-docs/ to GitHub Pages.

      - id: T3
        name: "Remove Astro scaffolding"
        files:
          - "cortex-registry/_cortex-docs/site/ (DELETE)"
        estimated_loc: 0
        details: |
          Remove Node.js dependency: astro.config.mjs, tailwind.config.mjs,
          tsconfig.json, package.json, src/ directory.
          Python + Jinja2 is the canonical build system (CORE-035).

      - id: T4
        name: "Integration tests"
        files:
          - "tests/integration/documentation/test_site_integration.py"
        estimated_loc: 80-100

    acceptance_criteria:
      - "✅ index.html has 3 role gateway cards linking to role pages"
      - "✅ GitHub Actions workflow passes dry-run validation"
      - "✅ Astro scaffolding removed (0 Node.js config files in _cortex-docs/)"
      - "✅ Full site navigable: index → role → child → back"
      - "✅ Tests: 5-8 passing"
      - "✅ Git commit with clean history"

