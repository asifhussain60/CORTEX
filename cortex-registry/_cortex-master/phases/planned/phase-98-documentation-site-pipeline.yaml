# ============================================================================
# ENFORCEMENT GATES (Visible Governance)
# ============================================================================
enforcement_gates:
  pre_execution:
    - gate: "EnforcementOrchestrator"
      agents: 7
      checks:
        - "CORE-008: TDD mandatory (tests before code)"
        - "CORE-011: Type hints on all parameters + returns"
        - "CORE-012: Google-style docstrings"
        - "CORE-013: No bare except blocks"
        - "CORE-026: Git checkpoint before major changes"
        - "CORE-027: AC_START → AC_COMPLETE audit trail"
        - "CORE-028: File naming (kebab-case, no SCREAMING_CASE)"
      blocking: true

  stage_boundaries:
    - gate: "Phase48HolisticValidation"
      checks:
        - "All tests passing (≥ baseline)"
        - "Lint clean (zero ruff errors)"
        - "Type hints (no new untyped public functions)"
        - "Docstrings (no new undocumented public functions)"
        - "No CORE-035 violations (duplicates)"
        - "AC markers present"
      blocking: true
      frequency: "per_stage"

  phase_completion:
    - gate: "ProductionReadinessGate"
      checks:
        - "Full test suite passing (baseline + new tests)"
        - "Coverage ≥ 80% for new code"
        - "No syntax errors (test collection works)"
        - "No import errors (all dependencies resolve)"
        - "Link validation passed (0 broken links)"
        - "Documentation site loads in <2s LCP"
        - "Role pages render correctly (3 roles × 5 views)"
      blocking: true

# ============================================================================
# SECURITY GATES (OWASP + Best Practices)
# ============================================================================
security_gates:
  owasp_top_10:
    - check: "injection_prevention"
      scope: "jinja2_templates"
      enforcement: "blocking"
      validation: "All Jinja2 variables autoescaped, no |safe without review"

    - check: "csp_headers"
      scope: "html_output"
      enforcement: "blocking"
      validation: "Content-Security-Policy meta tags present on all pages"

    - check: "secrets_management"
      scope: "build_scripts"
      enforcement: "blocking"
      validation: "No secrets in scripts, config, or generated HTML"

  dependency_security:
    - tool: "bandit"
      check: "python_security_issues"
      frequency: "pre_commit"
      enforcement: "warning"

# ============================================================================
# RED-GREEN-REFACTOR CYCLE (TDD Enforcement)
# ============================================================================
red_green_refactor:
  cycle_1_red:
    action: "Write failing test first (CORE-008)"
    validation: "Test must fail with expected error message"
    forbidden: "Code implementation before test exists"
    example: "pytest tests/unit/documentation/test_docs_orchestrator.py → ModuleNotFoundError"

  cycle_2_green:
    action: "Minimal code to pass test"
    validation: "Test must pass, no --ignore flags allowed"
    forbidden: "Skipping tests, mocking real dependencies without justification"
    example: "pytest tests/unit/documentation/test_docs_orchestrator.py → 1 passed"

  cycle_3_refactor:
    action: "Clean code while keeping tests green"
    validation: "All tests still pass + lint clean"
    forbidden: "Breaking existing tests during refactor"
    checklist:
      - "Extract magic numbers → constants"
      - "Extract complex conditionals → named functions"
      - "Remove duplication (CORE-035)"
      - "Add type hints + docstrings"
      - "Run full test suite → all pass"

# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================
overview:
  vision: |
    Wire the 15+ existing documentation infrastructure components into an
    end-to-end automated pipeline that transforms Markdown content into a
    multi-role, glassmorphism-themed static site deployed to GitHub Pages.

    This phase does NOT design a new system. It connects:
    - Discovery pipeline (cortex-registry/_cortex-docs/pipeline/discover.py) ✅
    - Extraction pipeline (cortex-registry/_cortex-docs/pipeline/extract.py) ✅
    - Validation pipeline (cortex-registry/_cortex-docs/pipeline/validate.py) ✅
    - MEGA-B library (cortex/documentation/*.py — 4 TDD-tested modules) ✅
    - Glassmorphism CSS system (cortex-docs/assets/css/ — 9 files) ✅
    - Gemini reference design (_workspaces/cortex-doc-gemini/gemini-index.html) ✅
    - Agent specs (documentation-architect + gitpages-builder) ✅
    - 30+ Markdown source files (cortex-docs/content/src/**/*.md) ✅

    The result: a single `python scripts/build-docs-site.py` command that
    discovers content, extracts to JSON, renders Jinja2 templates, populates
    3 role pages (Business Leaders, Product Owners, Software Engineers) with
    15 child views, and deploys to GitHub Pages.

  problem_statement: |
    CURRENT STATE:
    - cortex-docs/index.html is live on GitHub Pages (1093 lines, SEO-indexed)
    - Role subdirectories exist but are EMPTY (business/, product/, engineering/)
    - 30+ Markdown docs exist in cortex-docs/content/src/ (rich content, unused)
    - Discovery pipeline built (discover.py + 7,771-line baseline.yaml) but not wired
    - Extraction pipeline built (extract.py) but never executed end-to-end
    - MEGA-B modules (portal, diagram, incremental builder) TDD-tested but standalone
    - Jinja2 templates directory exists but contains ZERO files
    - CortexDocsOrchestrator referenced in 2 agent specs but file does not exist
    - No CLI entry points in scripts/ for doc generation or refresh
    - Astro scaffolding in cortex-registry/_cortex-docs/site/ introduces Node.js
      dependency (violates Python-first tech stack; to be removed)

    ROOT CAUSE:
    - Components built in isolation without wiring orchestrator
    - No content.json contract ever generated (designed but not executed)
    - Jinja2 templates never created (agent spec describes them, code absent)
    - Build scripts never authored (agent spec describes CLI, code absent)

    IMPACT IF NOT FIXED:
    - ❌ GitHub Pages site shows landing only — no role-based navigation
    - ❌ 30+ Markdown docs unreachable by end users
    - ❌ No automated refresh when codebase evolves
    - ❌ Documentation Architect and GitPages Builder agents cannot execute
    - ❌ Deferred phase-11 remains permanently deferred

  supersedes:
    - phase_id: "phase-11"
      reason: "Deferred phase-11 (Documentation Site Generation) was scoped as
        MkDocs + search. This phase uses the architecture already designed in
        cortex-documentation-architect.md and cortex-gitpages-builder.md agents:
        Python + Jinja2 + glassmorphism. Broader scope, reuses existing work."

  success_criteria:
    - "✅ CortexDocsOrchestrator wired and registered in orchestrator registry"
    - "✅ content.json generated from 30+ MD files via extract.py"
    - "✅ 2 Jinja2 templates (role-landing, child-page) render glassmorphism HTML"
    - "✅ 3 role landing pages generated (business, product, engineering)"
    - "✅ 15 child view pages generated with D3.js visualizations"
    - "✅ Role gateway cards added to existing cortex-docs/index.html"
    - "✅ 0 broken links across entire site"
    - "✅ GitHub Actions workflow deploys on push to CORTEX branch"
    - "✅ Full pipeline executes in <30s"
    - "✅ Astro scaffolding removed (Python-first)"

