# ============================================================================
# STAGES
# ============================================================================
stages:
  # -------------------------------------------------------------------------
  # STAGE 1: Pre-Migration Baseline (30 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S1"
    title: "Pre-Migration Baseline Capture"
    duration_minutes: 30
    risk: LOW
    deliverables:
      - Capture pytest baseline (all tests)
      - Capture lint baseline (ruff)
      - Document current import counts
      - Git checkpoint (pre-phase-103)
      - Create rollback script
    commands:
      - "git checkout -b phase-103-migration"
      - "pytest tests/ -v --tb=short > /tmp/phase-103-baseline-tests.txt 2>&1"
      - "ruff check cortex/ > /tmp/phase-103-baseline-lint.txt 2>&1 || true"
      - "grep -r 'from cortex_intelligence' --include='*.py' | wc -l > /tmp/phase-103-import-count.txt"
      - "git tag pre-phase-103-baseline"
    acceptance_criteria:
      - Baseline files created
      - Git tag created
      - Import counts documented

  # -------------------------------------------------------------------------
  # STAGE 2: cortex_intelligence → cortex_intelligence Rename (60 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S2"
    title: "Rename cortex_intelligence to cortex_intelligence"
    duration_minutes: 60
    risk: MEDIUM
    dependencies: ["S1"]
    deliverables:
      - Git mv cortex_intelligence → cortex_intelligence
      - Restructure tier0-3 → memory/*
      - Create __init__.py for memory/
      - Update pyproject.toml
    commands:
      - "git mv cortex_intelligence cortex_intelligence"
      - "cd cortex_intelligence && mkdir -p memory"
      - "git mv tier0 memory/core"
      - "git mv tier1 memory/tier1-learned"
      - "git mv tier2 memory/tier2-adaptive"
      - "git mv tier3 memory/tier3-scratch"
      - "touch memory/__init__.py"
      - "git commit -m 'refactor: rename cortex_intelligence → cortex_intelligence, tier → memory/{core,tier1-learned,tier2-adaptive,tier3-scratch}'"
    acceptance_criteria:
      - cortex_intelligence/ exists
      - memory/ subfolders created (core, tier1-learned, tier2-adaptive, tier3-scratch)
      - Git history preserved

  # -------------------------------------------------------------------------
  # STAGE 3: Update Python Imports (90 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S3"
    title: "Update Python Import Statements"
    duration_minutes: 90
    risk: MEDIUM
    dependencies: ["S2"]
    deliverables:
      - Update 311 Python imports
      - Update pyproject.toml known-first-party
      - Update tier references to memory/*
    commands:
      - "find . -name '*.py' -type f -not -path './.venv/*' -exec sed -i '' 's/from cortex_intelligence/from cortex_intelligence/g' {} \\;"
      - "find . -name '*.py' -type f -not -path './.venv/*' -exec sed -i '' 's/import cortex_intelligence/import cortex_intelligence/g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's/cortex_intelligence\\.tier0/cortex_intelligence.memory.core/g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's/cortex_intelligence\\.tier1/cortex_intelligence.memory.tier1_learned/g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's/cortex_intelligence\\.tier2/cortex_intelligence.memory.tier2_adaptive/g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's/cortex_intelligence\\.tier3/cortex_intelligence.memory.tier3_scratch/g' {} \\;"
      - "sed -i '' 's/cortex_intelligence/cortex_intelligence/g' pyproject.toml"
      - "git commit -am 'refactor: update all cortex_intelligence imports to cortex_intelligence'"
    acceptance_criteria:
      - Zero 'from cortex_intelligence' in codebase
      - pyproject.toml updated
      - All imports resolve

  # -------------------------------------------------------------------------
  # STAGE 4: Update YAML/Markdown References (30 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S4"
    title: "Update YAML and Markdown References"
    duration_minutes: 30
    risk: LOW
    dependencies: ["S3"]
    deliverables:
      - Update 47 YAML files
      - Update all Markdown documentation
    commands:
      - "find . -name '*.yaml' -type f -exec sed -i '' 's/cortex_intelligence/cortex_intelligence/g' {} \\;"
      - "find . -name '*.yml' -type f -exec sed -i '' 's/cortex_intelligence/cortex_intelligence/g' {} \\;"
      - "find . -name '*.md' -type f -exec sed -i '' 's/cortex_intelligence/cortex_intelligence/g' {} \\;"
      - "git commit -am 'docs: update YAML/MD references to cortex_intelligence'"
    acceptance_criteria:
      - Zero cortex_intelligence references in YAML
      - Documentation updated

  # -------------------------------------------------------------------------
  # STAGE 5: Track A Validation (30 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S5"
    title: "Track A Intelligence Validation"
    duration_minutes: 30
    risk: LOW
    dependencies: ["S4"]
    deliverables:
      - Validate all imports resolve
      - Run brain-related tests
      - Capture test count
    commands:
      - "python3 -c 'from cortex_intelligence.memory.core import governance; print(\"✅ Core OK\")'"
      - "python3 -c 'from cortex_intelligence.memory.tier1_learned import *; print(\"✅ Tier1-Learned OK\")'"
      - "python3 -c 'from cortex_intelligence.memory.tier2_adaptive import *; print(\"✅ Tier2-Adaptive OK\")'"
      - "python3 -c 'from cortex_intelligence.memory.tier3_scratch import *; print(\"✅ Tier3-Scratch OK\")'"
      - "python3 -c 'from cortex_intelligence.domain import DomainFactory; print(\"✅ Domain OK\")'"
      - "python3 -c 'from cortex_intelligence.perception import PatternRegistry; print(\"✅ Perception OK\")'"
      - "pytest tests/unit/brain/ -v --tb=short"
      - "pytest tests/unit/domain/ -v --tb=short"
    acceptance_criteria:
      - All memory tier imports work (core, tier1-learned, tier2-adaptive, tier3-scratch)
      - Brain tests pass
      - Domain tests pass

  # -------------------------------------------------------------------------
  # STAGE 6: Decompose _cortex-master (60 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S6"
    title: "Decompose _cortex-master Structure"
    duration_minutes: 60
    risk: MEDIUM
    dependencies: ["S5"]
    deliverables:
      - Create new registry top-level structure
      - Move governance, config, wiring, specifications → core/
      - Move templates → artifacts/templates/
      - Move phases → planning/phases/
      - Move baselines, reports, dashboard → metrics/
      - Move knowledge → knowledge-base/
      - Delete _cortex-master wrapper
    commands:
      - "cd cortex-registry && mkdir -p core artifacts/templates integration metrics/status knowledge-base"
      - "git mv _cortex-master/core/governance core/"
      - "git mv _cortex-master/core/config core/"
      - "git mv _cortex-master/core/wiring core/"
      - "git mv _cortex-master/core/specifications core/"
      - "git mv _cortex-master/core/templates/* artifacts/templates/"
      - "git mv interaction integration/"
      - "git mv patterns integration/"
      - "git mv _cortex-master/phases planning/"
      - "git mv _cortex-master/baselines metrics/"
      - "git mv _cortex-master/reports metrics/"
      - "git mv _cortex-master/dashboard metrics/dashboards"
      - "git mv _cortex-master/CORTEX-STATUS-*.yaml metrics/status/"
      - "git mv _cortex-master/DEFERRED-PHASES-ROADMAP.yaml metrics/status/"
      - "git mv _cortex-master/knowledge/* knowledge-base/"
      - "git mv _cortex-master/archive archive/"
      - "rm -rf _cortex-master"
      - "rm -rf templates/workflows"
      - "git mv workflows artifacts/"
      - "git commit -am 'refactor: decompose _cortex-master, create semantic registry structure'"
    acceptance_criteria:
      - _cortex-master/ deleted
      - core/, artifacts/, integration/, metrics/, knowledge-base/ created
      - No duplicate workflows/

  # -------------------------------------------------------------------------
  # STAGE 7: Update Registry Path References (60 minutes)
  # -------------------------------------------------------------------------
  - stage_id: "S7"
    title: "Update Registry Path References"
    duration_minutes: 60
    risk: MEDIUM
    dependencies: ["S6"]
    deliverables:
      - Update 144 Python files with new registry paths
      - Update _cortex-master → appropriate new paths
    commands:
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/core/governance|core/governance|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/core/config|core/config|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/core/wiring|core/wiring|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/core/templates|artifacts/templates|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/phases|planning/phases|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/baselines|metrics/baselines|g' {} \\;"
      - "find . -name '*.py' -type f -exec sed -i '' 's|_cortex-master/reports|metrics/reports|g' {} \\;"
