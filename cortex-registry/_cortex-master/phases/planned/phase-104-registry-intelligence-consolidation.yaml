    - Validate old _cortex-master paths empty
    - Detect duplicate template files
    - Verify zero Python references to old paths
    - Generate cleanup report
  
  commands:
    - "echo '=== Checking for stragglers in old paths ===' > /tmp/phase-103-s6b-report.txt"
    - "find cortex-registry -path '*_cortex-master*' -name '*.yaml' | tee -a /tmp/phase-103-s6b-report.txt"
    - "find cortex-registry -path '*_cortex-master*' -name '*.py' | tee -a /tmp/phase-103-s6b-report.txt"
    - "echo '=== Duplicate template files ===' >> /tmp/phase-103-s6b-report.txt"
    - "find . -name 'response-template-blocks-modern.md' | tee -a /tmp/phase-103-s6b-report.txt"
    - "find . -name '*template*.yaml' -path '*/templates/*' | sort | tee -a /tmp/phase-103-s6b-report.txt"
    - "echo '=== Python references to old paths ===' >> /tmp/phase-103-s6b-report.txt"
    - "grep -r '_cortex-master' --include='*.py' . 2>/dev/null | wc -l | tee -a /tmp/phase-103-s6b-report.txt"
    - "echo '=== Expected counts after S6 ===' >> /tmp/phase-103-s6b-report.txt"
    - "echo 'Old _cortex-master YAMLs: 0' >> /tmp/phase-103-s6b-report.txt"
    - "echo 'response-template-blocks-modern.md: 1 (.github/prompts/)' >> /tmp/phase-103-s6b-report.txt"
    - "echo 'Python _cortex-master refs: 144 (will be fixed in S7)' >> /tmp/phase-103-s6b-report.txt"
    - "cat /tmp/phase-103-s6b-report.txt"
  
