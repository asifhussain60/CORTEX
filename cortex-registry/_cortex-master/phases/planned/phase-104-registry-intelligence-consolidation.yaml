# ============================================================================
# STAGE 17: TEMPLATE COMPOSITION ENGINE (NEW)
# ============================================================================
stage_17_template_engine:
  stage_id: "S17"
  title: "TemplateCompositionEngine + VS Code Chat Optimization"
  duration: "2.5 hours"
  risk: MEDIUM
  dependencies: ["S15B", "S16"]
  priority: P1
  
  purpose: |
    Implement intelligent template composition system with persona-aware 
    response generation. Addresses chat01.md design for LEGO block assembly.
    
    Also creates .github/copilot-instructions.md for universal VS Code Chat 
    rendering enforcement per ChatGPT advice.
  
  deliverables:
    - cortex/interaction/template_composition_engine.py
    - .github/copilot-instructions.md
    - Update .github/prompts/response-template-blocks-modern.md
    - tests/unit/interaction/test_template_composition_engine.py
    - tests/e2e/test_vs_code_chat_rendering.py
  
  components:
    template_composition_engine:
      location: "cortex/interaction/template_composition_engine.py"
      classes:
        - TemplateCompositionEngine
        - RenderingValidator
        - BlockSelector
        - PersonaAdapter
      methods:
        - "compose(request_type, persona, depth, user_request) -> str"
        - "_select_blocks(persona, request_type) -> List[Block]"
        - "_deduplicate_concepts(blocks) -> List[Block]"
        - "_enforce_word_limit(text, persona) -> str"
        - "_should_show_code(request, persona, request_type) -> bool"
        - "validate_response(markdown) -> Tuple[bool, List[str]]"
    
    rendering_validator:
      checks:
        - "No full-response code blocks"
        - "Heading hierarchy ≤3 levels"
        - "Table row count ≤10 for educational"
        - "No HTML tags (except <hr>)"
        - "Paragraph length ≤100 words"
        - "Emoji palette consistency"
    
    persona_rules:
      business_leader:
        max_words: 400
        blocks: ["BLOCK-INTRO", "BLOCK-NEXT-STEPS"]
        code_snippets: false
        
      product_owner:
        max_words: 500
        blocks: ["BLOCK-INTRO", "BLOCK-CAPABILITIES", "BLOCK-NEXT-STEPS"]
        code_snippets: "pseudo_only"
        
      scrum_master:
        max_words: 500
        blocks: ["BLOCK-INTRO", "BLOCK-TUTORIAL", "BLOCK-NEXT-STEPS"]
        code_snippets: "pseudo_only"
        
      tech_lead:
        max_words: 700
        blocks: ["BLOCK-INTRO", "BLOCK-CAPABILITIES", "BLOCK-LENS", "BLOCK-ORCHESTRATORS"]
        code_snippets: "minimal"
        
      engineer:
        max_words: 800
        blocks: ["ALL"]
        code_snippets: "full"
  
  copilot_instructions:
    location: ".github/copilot-instructions.md"
    content: |
      # CORTEX Response Formatting Standards for VS Code Copilot Chat
      
      ## Core Principles
      - **Always include CORTEX header** at top of every response (once)
      - Format as **CommonMark Markdown** (not HTML)
      - **Never** wrap entire response in single fenced code block
      - Use VS Code Chat-optimized rendering (headings, lists, emojis)
      
      ## Header Template (MANDATORY - ONCE PER RESPONSE)
      # 🧠 CORTEX
      **Author:** Asif Hussain | **Orchestrator:** {OrchestratorName} ✅
      ---
      
      ## Visual Elements
      Standardized emoji palette:
      - ✅ Success, ⚠️ Warning, ❌ Error, 🧠 Intelligence
      - 🔧 Implementation, 🧪 Testing, 📊 Analysis, 🚀 Deployment
      - 🔒 Security, 🎯 Goal, 🏛️ Architecture, 📋 Planning
      
      ## Anti-Patterns (AVOID)
      ❌ Full-response code blocks (breaks Markdown rendering)
      ❌ Deeply nested bullets (>3 levels)
      ❌ Tables >10 rows for educational content
      ❌ HTML tags (except <hr> for separators)
  
  tasks:
    - task_id: S17.1
      name: "Create .github/copilot-instructions.md"
      duration: "20 min"
      deliverable: "Copilot formatting standards file"
      
    - task_id: S17.2
      name: "Implement TemplateCompositionEngine core"
      duration: "45 min"
      deliverable: "Block selection + composition algorithm"
      
    - task_id: S17.3
      name: "Implement RenderingValidator"
      duration: "30 min"
      deliverable: "VS Code Chat validation rules"
      
    - task_id: S17.4
      name: "Add persona-specific rules"
      duration: "20 min"
      deliverable: "Word limits, code suppression logic"
      
    - task_id: S17.5
      name: "Update response-template-blocks-modern.md"
      duration: "20 min"
      deliverable: "VS Code Chat optimization section"
      
    - task_id: S17.6
      name: "Create unit tests"
      duration: "30 min"
      deliverable: "15 tests for TemplateCompositionEngine"
      
    - task_id: S17.7
      name: "Create E2E rendering tests"
      duration: "15 min"
      deliverable: "10 tests for VS Code Chat validation"
      
    - task_id: S17.8
      name: "Test with all personas"
      duration: "20 min"
      deliverable: "Validation across 5 persona types"
  
  acceptance_criteria:
    - id: AC-PHASE103-S17-ENGINE
      description: "TemplateCompositionEngine class exists"
      validation: "test -f cortex/interaction/template_composition_engine.py"
      
    - id: AC-PHASE103-S17-COPILOT
      description: "copilot-instructions.md exists"
