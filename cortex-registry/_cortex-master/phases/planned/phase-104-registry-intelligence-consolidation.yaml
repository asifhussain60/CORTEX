registry_structure:
  sections:
    - section_id: core
      title: "core/ - System Foundation"
      what: "4 subdirs: governance/, config/, wiring/, specifications/"
      why: "Immutable system foundation - CORE rules, master config, orchestrator contracts, flow specs"
      when: "Start here when debugging governance violations, orchestrator wiring issues, or flow routing problems"
      how: |
        Troubleshooting:
        - Governance errors → Check core/governance/core-rules.yaml for CORE-XXX definitions
        - Wiring failures → Verify core/wiring/contract.yaml and wiring.yaml
        - Flow routing issues → Review core/specifications/intent-routing.yaml
        - Config overrides → Examine core/config/master-plan.yaml
      files:
        - name: "core/governance/core-rules.yaml"
          purpose: "48 CORE rules (CORE-001 to CORE-048)"
          usage: "Reference for all governance enforcement"
        - name: "core/config/master-plan.yaml"
          purpose: "Master orchestrator configuration"
          usage: "Entry point for orchestrator wiring"
        - name: "core/wiring/contract.yaml"
          purpose: "Orchestrator interface contracts"
          usage: "Defines expected inputs/outputs"
        - name: "core/specifications/exec-flow.yaml"
          purpose: "Execution flow specifications"
          usage: "Maps intent → orchestrator routing"
    
    - section_id: artifacts
      title: "artifacts/ - Templates & Workflows"
      what: "4 subdirs: response-templates/, phase-templates/, doc-templates/, workflows/"
      why: "Generated outputs - Response formats, phase templates, workflow definitions"
      when: "Customize response formats, create new phase templates, modify workflow steps"
      how: |
        Troubleshooting:
        - Response format issues → Check artifacts/response-templates/format-standards.yaml
        - LEGO blocks broken → Review artifacts/response-templates/content-blocks.yaml
        - Phase creation errors → Verify artifacts/phase-templates/phase-template.yaml
        - Workflow failures → Examine artifacts/workflows/*.yaml
      files:
        - name: "artifacts/response-templates/content-blocks.yaml"
          purpose: "7 LEGO blocks (INTRO, CAPABILITIES, LENS, etc.)"
          usage: "Composable educational response templates"
        - name: "artifacts/response-templates/headers.yaml"
          purpose: "Standard response headers (Tier 0 - immutable)"
          usage: "Used by all orchestrator responses"
        - name: "artifacts/workflows/tdd-workflow.yaml"
          purpose: "TDD workflow (RED-GREEN-REFACTOR)"
          usage: "Template for test-driven development"
    
    - section_id: integration
      title: "integration/ - External Patterns"
      what: "2 subdirs: interaction/, patterns/"
      why: "MCP communication patterns and architectural patterns for external system integration"
      when: "Adding new MCP tools, implementing new communication patterns, defining architectural standards"
      how: |
        Troubleshooting:
        - MCP tool registration fails → Check integration/interaction/request-response.yaml
        - Pattern enforcement errors → Review integration/patterns/*.yaml
        - Communication timeout → Verify integration/interaction/orchestrator-coordination.yaml
      files:
        - name: "integration/interaction/request-response.yaml"
          purpose: "Request-response MCP pattern validation"
          usage: "Enforced by PatternEnforcer at runtime"
        - name: "integration/patterns/api-design.yaml"
          purpose: "REST API design standards"
          usage: "Reference for all API implementations"
    
    - section_id: planning
      title: "planning/ - Work Management"
      what: "4 subdirs: phases/{planned,completed,deferred,consolidated}/, registry/, system/"
      why: "Phase lifecycle management - Track work from planning → completion"
      when: "Creating new phases, tracking progress, reviewing completed work, managing deferred items"
      how: |
        Troubleshooting:
        - Phase not found → Check planning/phases/planned/ for YAML file
        - Phase status wrong → Verify planning/index.yaml registry
        - Roadmap out of sync → Review planning/system/roadmap.yaml
        - Phase dependencies broken → Check phase YAML dependencies field
      files:
        - name: "planning/index.yaml"
          purpose: "Active plans registry"
          usage: "Used by PlanRegistry orchestrator"
        - name: "planning/phases/planned/phase-103.yaml"
          purpose: "This phase plan"
          usage: "Defines registry consolidation"
    
    - section_id: knowledge_base
      title: "knowledge-base/ - CORTEX Defaults"
      what: "20+ subdirs: architecture/, security/, testing/, cloud/, domains/, etc."
      why: "Industry best practices and CORTEX default knowledge (Tier 0 fallback)"
      when: "Company rules don't cover scenario, need industry standards, learning best practices"
      how: |
        Troubleshooting:
        - Missing best practice → Search knowledge-base/{domain}/ for YAML files
        - Override not working → Check if cortex-registry/company/domains/ overrides Tier 0
        - Knowledge gap → Review knowledge-base/architecture/ for patterns
      files:
        - name: "knowledge-base/architecture/solid-principles.yaml"
          purpose: "SOLID principles reference"
          usage: "Design pattern guidance"
        - name: "knowledge-base/security/owasp-top10.yaml"
          purpose: "OWASP Top 10 vulnerabilities"
          usage: "Security scanning rules"
        - name: "knowledge-base/testing/tdd-practices.yaml"
          purpose: "TDD best practices"
          usage: "Test-first development guide"
    
    - section_id: metrics
      title: "metrics/ - Observability"
      what: "4 subdirs: baselines/, reports/, dashboards/, status/"
      why: "System health monitoring - Test baselines, readiness reports, performance dashboards"
      when: "Checking system health, analyzing performance, validating test results, reviewing status"
      how: |
        Troubleshooting:
        - Tests regressing → Compare against metrics/baselines/*.json
        - Performance degraded → Review metrics/reports/*-inventory.json
        - System status unknown → Check metrics/status/cortex-status-*.yaml
        - Dashboard data stale → Examine metrics/dashboards/data/*.json
      files:
        - name: "metrics/baselines/phase-25-baseline.json"
          purpose: "Phase 25 test baseline snapshot"
          usage: "Regression detection reference"
        - name: "metrics/status/cortex-status-2026-02-17.yaml"
          purpose: "Current system health snapshot"
          usage: "System status overview"
  
  features:
    visual:
      - "Glassmorphism dark blue theme (#0a0e27 background)"
