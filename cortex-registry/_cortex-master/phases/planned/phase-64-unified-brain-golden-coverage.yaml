id: phase-64
title: "Unified Brain Golden Coverage — 10-Gap E2E Trace Test Renaissance"
status: PLANNED
priority: P0
created: "2026-02-24"
sweep_id: SWEEP-64-UNIFIED-BRAIN-GOLDEN
constraint: "ZERO new production orchestrators. Zero new abstraction tiers. Depth not breadth — wire what exists, test what exists."

governance_additions:
  description: |
    Phase 64 adds 2 new CORE governance rules to prevent the partial-sweep and
    inconsistent-response anti-patterns identified across all 5 reviews.
    These rules are backed by dedicated workflow templates and golden tests.
    They do NOT add new orchestrators — they govern existing ones.
  rules:
    - id: CORE-065
      name: "Holistic File Review Contract"
      severity: P0
      status: ACTIVE
      rationale: |
        CORE-064 catches open catalogue items. CORE-065 catches files that were
        never added to the catalogue — the silent scope-exclusion partial sweep.
        Example: fixing orchestrator_base.py without scanning its 24 subclasses.
      workflow_template: "cortex-registry/workflows/templates/governance/holistic-file-review-gate.yaml"
      golden_test: "tests/golden/workflow/test_holistic_file_review_golden.py"
    - id: CORE-066
      name: "Response Template Binding"
      severity: P1
      status: ACTIVE
      rationale: |
        All 5 reviews found inconsistent response formatting: missing headers,
        raw dict output from MCP tools, no standard pre/post work table schemas.
        CORE-066 makes the canonical Response Template a governance contract.
      workflow_template: "cortex-registry/workflows/templates/governance/copilot-chat-response-template.yaml"
      golden_test: "tests/golden/response/test_response_templates_golden.py"

workflow_templates_added:
  - id: "governance/holistic-file-review-gate"
    file: "cortex-registry/workflows/templates/governance/holistic-file-review-gate.yaml"
    purpose: |
      BEFORE/AFTER holistic file inventory gate. Prevents partial sweeps at
      file-inventory level. Enables multi-session autonomous execution via
      SQLite-persisted sweep manifests (resume across Copilot Chat Sessions).
    composites_using_this:
      - "audit/audit-fix-pipeline.yaml (Stages 7–8)"
      - "governance/request-execution-plan-gate.yaml (FIX/REFACTOR/IMPLEMENT)"
      - "All Phase 64–65 sub-phases via TemplateComposer auto-injection"
  - id: "governance/copilot-chat-response-template"
    file: "cortex-registry/workflows/templates/governance/copilot-chat-response-template.yaml"
    purpose: |
      Canonical Response Template renderer for all VS Code GitHub Copilot Chat
      Session outputs. Governs: header, progress bar, pre/post work manifests,
      violations table, stage table, session pause banners, gate results.
      All 14 execution modes + all 26 MCP tools must render through this.

summary: |
  Phase 64 closes 10 structural gaps where CORTEX capabilities exist but are
  not verified at the golden (E2E trace-verified) test tier. Every gap closes
  with a passing golden test file whose name appears in the acceptance criteria.
  Two new CORE governance rules (CORE-065, CORE-066) and two new workflow
  templates (holistic-file-review-gate, copilot-chat-response-template) prevent
  the partial-sweep and inconsistent-response anti-patterns from recurring.
  Review-derived gaps (MCP auth scaffold, 151 ImportError, 24 un-mixed orchestrators)
  are captured as RED scaffold tests in Phase 64 and implemented in Phase 65.

  Source: _workspaces/recommend/copilot-reviews-consolidated.md (reviews 01–05, scores 6.2→7.3/10)
  Target score after Phase 64: 8.0/10 | After Phase 65: 8.5/10

# =============================================================================
# MULTI-SESSION AUTONOMOUS EXECUTION PLAN
# =============================================================================
# This plan is designed to be executed across multiple VS Code GitHub Copilot
# Chat Sessions. Each session picks up where the previous one left off using
# the SQLite-persisted sweep manifest (CORE-065 + holistic-file-review-gate).
#
# RESUME PROTOCOL:
#   Start any session with: "resume sweep {sweep_id}"
#   Or: "continue Phase 64" — CORTEX will check list_open_sweeps() automatically
#
# SESSION HANDOFF FORMAT (auto-rendered at session end):
#   "⏸️ SESSION PAUSE — Sweep {sweep_id} | Last: {step} | Open items: {n}"
# =============================================================================
multi_session_execution_plan:
  sweep_id_prefix: "SWEEP-64"
  persistence_db: ".cortex-runtime/sweeps/phase-64-{session_num}.db"
  resume_trigger: "resume sweep SWEEP-64 | continue Phase 64"
  auto_resume_check: "SweepCatalogueOrchestrator.list_open_sweeps() at session start"

  sessions:
    - session: 1
      label: "Phase 64 — Session 1: Governance Foundation"
      sub_phases: [64-G]
      description: |
        Establish governance foundation FIRST. Wire CORE-065 and CORE-066.
        Create holistic-file-review-gate golden tests.
        Create response-template golden tests.
        All subsequent sessions run THROUGH these gates automatically.
      start_command: "implement Phase 64 sub-phase 64-G"
      deliverables:
        - "tests/golden/workflow/test_holistic_file_review_golden.py (RED → GREEN)"
        - "tests/golden/response/test_response_templates_golden.py (RED → GREEN, CORE-066)"
        - "TemplateComposer wires holistic-file-review-gate at index 0"
        - "WorkflowEngine wires ResponseTemplateValidator post-step hook"
      gate: "make test-smoke — holistic gate + response template tests green"
      pause_on_completion: true

    - session: 2
      label: "Phase 64 — Session 2: Trace Foundation"
      sub_phases: [64-A]
      description: |
        Upgrade HolisticIntegrationHarness to use real SQLite trace assertions.
        S01–S10 scenarios use real AC_START/AC_COMPLETE queries — not mocked.
        This is the foundational test infrastructure that all later sessions use.
      start_command: "implement Phase 64 sub-phase 64-A"
      deliverables:
        - "cortex/testing/holistic_integration_harness.py: assert_trace_chain() + assert_no_orphan_ac_starts()"
        - "tests/golden/integration/test_holistic_integration_simple.py: S01–S10 real trace"
      gate: "make test-smoke — S01–S10 real trace assertions green"
      pause_on_completion: true

    - session: 3
      label: "Phase 64 — Session 3: Stage 0 + Mode Chain Matrix"
      sub_phases: [64-B]
      description: |
        Create the 14-mode full-chain golden test matrix.
        Stage 0 CORE-002 and CORE-008 violation detection verified at golden tier.
        GOLDEN_TEST intent routing verified end-to-end.
      start_command: "implement Phase 64 sub-phase 64-B"
      deliverables:
        - "tests/golden/modes/test_execution_modes_golden.py (14 modes parametrized)"
      gate: "pytest tests/golden/modes/ -n auto --dist loadscope"
      pause_on_completion: true

    - session: 4
      label: "Phase 64 — Session 4: Workflow Runtime"
      sub_phases: [64-C]
      description: |
        Create workflow runtime golden tests. StepStateMachine and
        ConvergenceLoopExecutor verified E2E with SQLite persistence.
      start_command: "implement Phase 64 sub-phase 64-C"
      deliverables:
        - "tests/golden/workflow/test_workflow_runtime_golden.py"
      gate: "pytest tests/golden/workflow/ -n auto --dist loadscope"
      pause_on_completion: true

    - session: 5
      label: "Phase 64 — Session 5: MCP Operations + Multi-Repo"
      sub_phases: [64-D]
      description: |
        Create MCP operation-level golden tests. All 26 tools importable.
        cortex_vacuum, cortex_knowledge, cross_repo_search, dependency_graph verified.
      start_command: "implement Phase 64 sub-phase 64-D"
      deliverables:
        - "tests/golden/mcp/test_mcp_operations_golden.py"
      gate: "pytest tests/golden/mcp/ -n auto --dist loadscope"
      pause_on_completion: true

    - session: 6
      label: "Phase 64 — Session 6: Response Templates + Agent Matrix"
      sub_phases: [64-E]
      description: |
        Verify response template E2E rendering for all 14 modes.
        Verify all 17 agent files exist and AGENT-INDEX covers all intents.
      start_command: "implement Phase 64 sub-phase 64-E"
      deliverables:
        - "tests/golden/agents/test_agent_matrix_golden.py"
      gate: "pytest tests/golden/agents/ tests/golden/response/ -n auto --dist loadscope"
      pause_on_completion: true

    - session: 7
      label: "Phase 64 — Session 7: Debug + Scorer + Phase 65 Scaffolds"
      sub_phases: [64-F]
      description: |
        DebuggerOrchestrator strategy routing verified at golden tier.
        TestValueScorer self-scored with workflow_template + trace_assertion signals.
        RED scaffolds for Phase 65 (MCP auth, ImportError) committed as failing tests.
      start_command: "implement Phase 64 sub-phase 64-F"
      deliverables:
        - "tests/golden/modes/test_debug_mode_golden.py"
        - "tests/golden/intelligence/test_scorer_self_golden.py"
        - "RED scaffold: test_mcp_server_accepts_tenant_header"
        - "RED scaffold: test_no_silent_import_errors_in_golden_path"
      gate: "pytest tests/golden/modes/test_debug_mode_golden.py tests/golden/intelligence/ -n auto"
      pause_on_completion: true

    - session: 8
      label: "Phase 64 — Session 8: Final Convergence + Smoke Gate"
      sub_phases: []
      description: |
        Run full batch test suite. Fix any regressions via detect-fix-rescan-loop.
        Confirm all CORE-065 gates pass across all sub-phases.
        Confirm AC_COMPLETE emitted for Phase 64 to SQLite.
        Mark Phase 64 COMPLETE in cortex-master.yaml + move phase file to completed/.
      start_command: "audit fix — Phase 64 final convergence"
      deliverables:
        - "make test-batch — all golden tests green"
        - "Phase 64 moved to cortex-registry/_cortex-master/phases/completed/"
        - "cortex-master.yaml phase-64 status: COMPLETE"
      gate: "make test-batch — 0 failures, Phase 64 fully closed"
      pause_on_completion: false

