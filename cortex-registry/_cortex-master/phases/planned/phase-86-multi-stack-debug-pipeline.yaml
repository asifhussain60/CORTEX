background: |
  Source: Architecture design review (2026-02-27)
  Score at entry: 5.0 / 10 (debugging capability limited to Python-only strategies)
  Target score: 9.0 / 10 (universal multi-stack debugging with visual analysis)
  Baseline measurements:
    - Smoke tests: 1,443 passed
    - Existing strategies: 3 (test_failure, refactor_regression, governance_violation)
    - Vision API: stub only (returns mock_response)
    - Technology stacks covered: Python only
    - Production cleanup: Python marker strip only
  Git prerequisite: main branch clean, no merge conflicts

  Current state:
    - DebuggerOrchestrator: 471 lines, EventBus-driven, 3 strategies, wired in support spec
    - MarkerInjectionEngine: Strategy Pattern with pluggable strategies
    - AutoCleanupManager: Session-based cleanup, Python markers only
    - CortexVision MCP tool: Registered but returns mock data
    - Agent spec (cortex-debugger.md): Documents multi-language injection points but no strategies exist
    - Workflow templates: No debugging/ category exists

  Design decision: EXTEND existing Strategy Pattern (zero new orchestrators, zero new MCP tools).
  All 5 new strategies implement AbstractInjectionStrategy from debug_strategy_base.py.
  The DebuggerOrchestrator, MCP tools, and EventBus subscriptions are UNCHANGED.

  Expanded scope (2026-02-27 — unified brain analysis):
  Wire DebuggerOrchestrator into CORTEX's cross-cutting intelligence infrastructure:
  OPJMixin (learning persistence), URS (reinforcement signals), IntelligenceMatrix
  (CC-021/IC-021 cells), bidirectional EventBus (DEBUG_INSIGHT/DEBUG_FIX_APPLIED),
  and KnowledgeSynthesisEngine (debug pattern persistence). All 5 integrations
  follow proven patterns from MasterOrchestrator, TDDOrchestrator, and
  EnforcementOrchestrator — pure additive wiring, ~55 lines of production code.

