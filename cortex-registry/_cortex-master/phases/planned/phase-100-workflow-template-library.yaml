# ============================================================================
# TESTING STRATEGY
# ============================================================================
testing_strategy:
  total_tests: 125
  breakdown:
    stage_1: 15  # WorkflowTemplateRegistry
    stage_2: 10  # MCP Tool
    stage_3: 25  # Golden Test Harness
    stage_4: 5   # Phase 99 Migration
    stage_5: 0   # Scaffolds (no tests yet)
    integration: 70  # Template-specific tests (future)
  
  coverage_target: ">= 95%"
  
  test_types:
    unit:
      - "Registry auto-discovery"
      - "Metadata parsing"
      - "Semantic search"
      - "Validation engine"
      - "MCP tool operations"
    
    integration:
      - "End-to-end template execution"
      - "EnforcementOrchestrator validation"
      - "Audit trail verification"
      - "WorkflowComposer integration"
    
    golden:
      - "Sunshine paths (happy scenarios)"
      - "Rainy paths (error handling)"
      - "Edge cases (boundaries)"
      - "Blindspots (hidden assumptions)"
      - "Performance (duration, memory)"
      - "Regression (no breaking changes)"

# ============================================================================
# ENFORCEMENT GATES
# ============================================================================
enforcement_gates:
  pre_execution:
    - gate: "EnforcementOrchestrator"
      agents: 7
      checks:
        - "CORE-008: TDD mandatory (125 tests before code)"
        - "CORE-011: Type hints on all methods"
        - "CORE-012: Google-style docstrings"
        - "CORE-026: Git checkpoints at stage boundaries"
        - "CORE-027: AC_START → AC_COMPLETE markers"
        - "CORE-028: File naming (kebab-case, ≤40 chars)"
        - "CORE-035: No duplication with existing components"
  
  runtime_monitoring:
    - "Stage completion verification (cannot skip stages)"
    - "Test coverage enforcement (≥95% required)"
    - "No CORTEX_DEBUG markers in committed code"
    - "All audit trails verified"
  
  post_execution:
    - "125 tests passing"
    - "Zero lint errors"
    - "Zero breaking changes to WorkflowComposer"
    - "MCP server starts successfully (27 tools)"
    - "Template registry auto-discovers all 15 templates"
    - "Documentation complete (README + guides)"

