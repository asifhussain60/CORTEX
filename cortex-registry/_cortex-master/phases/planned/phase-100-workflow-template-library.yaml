# ============================================================================
# RISK MITIGATION
# ============================================================================
risks:
  - risk: "KnowledgeSynthesisEngine changes break existing synthesis"
    probability: "Very Low"
    impact: "High"
    mitigation: |
      WorkflowTemplateRegistry CALLS synthesize_unified_context() — does NOT modify it.
      New method resolve_for_workflow() wraps existing API. Zero changes to engine internals.

  - risk: "IntentRouter changes break existing intent classification"
    probability: "Very Low"
    impact: "High"
    mitigation: |
      New method classify_intent_with_workflow_suggestion() is ADDITIVE.
      Existing classify_intent() unchanged. New method calls old method + adds template hint.
      Fallback: if no template match, returns (intent, None) → standard routing.

  - risk: "MasterOrchestrator Stage 2 changes break orchestration pipeline"
    probability: "Very Low"
    impact: "Critical"
    mitigation: |
      Stage 2 update is CONDITIONAL: if template_id suggested → route to WorkflowComposer.
      Else → existing pipeline unchanged. Feature-flagged for safe rollout.

  - risk: "Knowledge conflict: company contradicts CORTEX rules"
    probability: "Medium"
    impact: "Medium"
    mitigation: |
      KnowledgeSynthesisEngine already handles precedence:
      company/domains/ OVERRIDES cortex knowledge. This is by design.
      Test verifies: company always wins on conflict.

  - risk: "Onboarded repo profile missing or incomplete"
    probability: "Medium"
    impact: "Low"
    mitigation: |
      Graceful fallback chain: onboarded profile → company/domains/ → CORTEX defaults.
      Golden tests verify each fallback level works independently.

  - risk: "Phase 99 migration breaks existing references"
    probability: "Very Low"
    impact: "Low"
    mitigation: "Phase 99 is planned (not yet executed), no production dependencies"

  - risk: "transitions library introduces dependency concerns"
    probability: "Very Low"
    impact: "Low"
    mitigation: |
      `transitions` is MIT-licensed, zero transitive dependencies, 50KB total.
      5K+ GitHub stars, actively maintained. Pure Python — no C extensions,
      no binary dependencies, no server required. If removed later, FSM logic
      is simple enough to inline (~100 LOC). Abstracted behind StepStateMachine
      class so library is swappable.

  - risk: "Convergence loops run infinitely or too long"
    probability: "Low"
    impact: "Medium"
    mitigation: |
      MANDATORY max_cycles limit on every ConvergenceGateConfig.
      Default max_cycles=5 if not specified. StepStateMachine enforces FAILED
      state after max_cycles exceeded. Backoff strategy prevents CPU thrash.
      MasterOrchestrator tracks total workflow execution time and aborts
      if global timeout exceeded (configurable, default 30 minutes).

  - risk: "PostPhaseDeduplicationReview false positives"
    probability: "Medium"
    impact: "Low"
    mitigation: |
      Uses LENS delta scan (only NEW duplicates introduced by completed phase).
      Excludes intentional similar code (test fixtures, data classes).
      Configurable similarity threshold (default: 0.85 from CORE-035).
      If false positive detected, user can mark as "intentional" to suppress.

