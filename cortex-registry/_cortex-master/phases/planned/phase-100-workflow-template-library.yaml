knowledge_architecture:
  description: |
    Templates contain knowledge placeholders that resolve differently
    based on repository context (ARCHITECT vs PRODUCTION mode).
    The KnowledgeSynthesisEngine already handles the merge logic —
    Phase 100 wires it into workflow template resolution.

  resolution_chain:
    - priority: 1
      source: "company/domains/*.yaml"
      description: "Company-specific overrides (highest precedence)"
      examples:
        - "api-design-standards.yaml → REST naming, pagination, versioning"
        - "security-standards.yaml → OAuth2, RBAC, TLS requirements"
        - "payment-security.yaml → PCI-DSS, fintech-specific rules"

    - priority: 2
      source: "cortex_brain/onboarded_repos/{repo}_enhanced.json"
      description: "Onboarded repo profile (tech stack, patterns, capabilities)"
      examples:
        - "tech_stack → determines test framework (Jest/pytest/NUnit)"
        - "architecture_patterns → determines component patterns"
        - "integration_points → determines API patterns"

    - priority: 3
      source: "cortex-registry/_cortex-master/knowledge/ (45+ YAMLs)"
      description: "CORTEX best practices (fills gaps not covered by company)"
      examples:
        - "tdd-best-practices.yaml → RED-GREEN-REFACTOR cycle"
        - "secure-coding-practices.yaml → OWASP Top 10"
        - "clean-code.yaml → SOLID, DRY, KISS"

  template_placeholders:
    - placeholder: "{test_framework}"
      architect_value: "pytest"
      production_value: "Resolved from onboarded repo profile tech_stack"
      fallback: "pytest"

    - placeholder: "{component_library}"
      architect_value: "CORTEX orchestrator patterns"
      production_value: "Resolved from onboarded repo profile (React/Angular/Vue)"
      fallback: "vanilla HTML/CSS/JS"

    - placeholder: "{auth_pattern}"
      architect_value: "MCP authentication"
      production_value: "Resolved from company/domains/security-standards.yaml"
      fallback: "OAuth2 with PKCE"

    - placeholder: "{api_style}"
      architect_value: "FastAPI + MCP endpoints"
      production_value: "Resolved from company/domains/api-design-standards.yaml"
      fallback: "RESTful with OpenAPI spec"

    - placeholder: "{compliance_standards}"
      architect_value: "CORTEX CORE rules"
      production_value: "Resolved from company/domains/ (PCI-DSS, HIPAA, SOX)"
      fallback: "OWASP Top 10"

    - placeholder: "{deployment_target}"
      architect_value: "CORTEX deployment pipeline"
      production_value: "Resolved from onboarded repo infrastructure detection"
      fallback: "Docker + CI/CD"

  mode_detection:
    architect_markers:
      - ".cortex/ directory exists"
      - "cortex-registry/ directory exists"
      - "cortex/__init__.py exists"
    production_markers:
      - "None of the above markers present"
    environment_variable: "CORTEX_MODE (architect|production)"

# ============================================================================
# CONVERGENCE-GATED STEP EXECUTION ARCHITECTURE
# ============================================================================
convergence_architecture:
  description: |
    Every workflow step is wrapped in a StepStateMachine (using `transitions` FSM).
    The ConvergenceNeuron (Phase 83) drives the success criteria check at the
    CHECKING state. Steps loop (RETRYING) until the convergence predicate returns
    True or max_cycles is exceeded. This enables "loop till resolved" semantics
    for cleanup, quality uplift, security remediation, and deduplication steps.

  step_state_machine:
    library: "transitions (pytransitions/transitions)"
    states:
      - PENDING: "Step queued, not yet started"
      - RUNNING: "Step actively executing via orchestrator"
      - CHECKING: "ConvergenceNeuron evaluating success criteria"
      - PASSED: "Success criteria met — proceed to next step"
      - RETRYING: "Success criteria NOT met — re-execute step (cycle++)"
      - FAILED: "max_cycles exceeded OR unrecoverable error"
      - SKIPPED: "Step skipped (optional step with unmet precondition)"

    transitions:
      - trigger: "start"
        source: "PENDING"
        dest: "RUNNING"
      - trigger: "check"
        source: "RUNNING"
        dest: "CHECKING"
      - trigger: "pass_gate"
        source: "CHECKING"
        dest: "PASSED"
        conditions: "convergence_neuron.check().converged == True"
      - trigger: "retry"
        source: "CHECKING"
        dest: "RETRYING"
        conditions: "cycle_count < max_cycles AND NOT converged"
      - trigger: "re_execute"
        source: "RETRYING"
        dest: "RUNNING"
      - trigger: "fail"
        source: "CHECKING"
        dest: "FAILED"
        conditions: "cycle_count >= max_cycles AND NOT converged"
      - trigger: "skip"
        source: "PENDING"
        dest: "SKIPPED"

  convergence_gate_config:
    description: |
      Each workflow step declares its own convergence gate configuration.
      The ConvergenceNeuron uses scan_function + target_predicate from this config.

    schema:
      max_cycles: "int — maximum retry iterations before FAILED (default: 5)"
      success_criteria: "dict — named criteria that must ALL be true"
      convergence_predicate: "str — Python expression evaluated against step output"
      scan_function: "str — what to measure (e.g., 'count_lint_errors', 'count_duplicates')"
      backoff_strategy: "str — 'none' | 'linear' | 'exponential' (delay between retries)"

    example:
      step_id: "fix_critical"
      convergence_gate:
        max_cycles: 10
        success_criteria:
          all_tests_pass: true
          no_regressions: true
          quality_improvement: ">10%"
        convergence_predicate: "all_tests_pass and no_regressions and quality_delta > 0.10"
        scan_function: "run_tests_and_measure_quality"
        backoff_strategy: "none"

  auto_injected_epilogues:
    description: |
      After multi-phase workflow completion, MasterOrchestrator auto-injects
      these epilogue steps. They are convergence-gated like any other step.

    epilogues:
      - id: "review/post-phase-dedup"
        name: "PostPhaseDeduplicationReview"
        trigger: "After each phase completion"
        orchestrator: "LENSSynthesis"
        convergence_gate:
          max_cycles: 3
          success_criteria:
            new_duplicates_count: 0
          convergence_predicate: "new_duplicates_count == 0"
          scan_function: "lens_duplicate_scan_delta"
        description: |
          LENS scans for code duplication introduced by the completed phase.
          Loops until no new duplicates found or max_cycles exceeded.
          Uses CORE-035 (single canonical implementation) as the standard.

      - id: "refactor/holistic-sweep"
        name: "HolisticRefactoringSweep"
        trigger: "After ALL phases in workflow complete"
        orchestrator: "RefactoringOrchestrator"
        convergence_gate:
          max_cycles: 5
          success_criteria:
            lens_score_above_baseline: true
            no_regressions: true
          convergence_predicate: "lens_score >= baseline_score and all_tests_pass"
          scan_function: "lens_score_all_modified_files"
        description: |
          RefactoringOrchestrator runs across ALL files modified during the
          workflow. Ensures holistic coherence — no local optima from
          individual phase work. Loops until LENS score meets baseline.

  ksessions_baseline_profile:
    description: |
      REMOVED: KSESSIONS-specific references replaced with generic production profiles.
      
      Golden tests now use multiple example tech stacks (legacy_dotnet_spa, modern_nodejs_api,
      python_data_pipeline, etc.) to verify templates work for ANY production repository.
      
      No repo-specific names or patterns in tests—only generic placeholders that resolve
      via KnowledgeSynthesisEngine at runtime.

  generic_production_profiles:
    description: |
      Multiple production repository profiles for golden test validation.
      Each profile represents a common tech stack pattern. Templates must resolve
      correctly for ALL profiles, proving universal applicability.

    profiles:
      - id: "legacy_dotnet_spa"
        description: "Legacy .NET monolith with modern E2E testing"
        tech_stack:
          backend: "asp_net_framework"
          frontend: "spa_framework"
          database: "mssql"
          testing_e2e: "playwright_typescript"
        test_framework_resolution:
          unit: "nunit"
          e2e: "playwright"
        expected_patterns:
          api_style: "asp_net_mvc_controllers"
          auth_pattern: "cookie_based_oauth"
          deployment_target: "iis_windows"

      - id: "modern_nodejs_api"
        description: "Modern Node.js microservices with React frontend"
        tech_stack:
          backend: "nodejs_express"
          frontend: "react"
          database: "postgresql"
          testing_e2e: "cypress"
        test_framework_resolution:
          unit: "jest"
          e2e: "cypress"
        expected_patterns:
          api_style: "rest_graphql_hybrid"
          auth_pattern: "jwt_oauth2_pkce"
          deployment_target: "docker_kubernetes"

      - id: "python_data_pipeline"
        description: "Python data engineering with batch processing"
        tech_stack:
          backend: "python_fastapi"
          data_processing: "pandas_spark"
          database: "postgresql_s3"
          testing: "pytest"
        test_framework_resolution:
          unit: "pytest"
          integration: "pytest_integration"
        expected_patterns:
          api_style: "fastapi_rest"
          auth_pattern: "api_key_oauth2"
          deployment_target: "aws_lambda_ecs"

# ============================================================================
# 10 CONVERGENCE-GATED KNOWLEDGE-PARAMETERIZED TEMPLATES
