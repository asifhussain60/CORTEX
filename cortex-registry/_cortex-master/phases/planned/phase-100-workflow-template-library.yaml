# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
overview:
  vision: |
    Build production-grade nested workflow template library at cortex-registry/workflows/
    with auto-discovery registry, golden test harness (sunshine/rainy/edge/blindspot),
    MCP-first exposure via cortex_workflow tool, and domain-driven team ownership.
    Enables zero-code template discovery, automatic governance validation, and
    audit-verified execution.

  problem_statement: |
    CURRENT STATE:
    - WorkflowComposer exists but no template library infrastructure
    - Templates scattered (Phase 99 in planned/, no organization)
    - No discovery system (manual path references required)
    - No golden test framework for workflow validation
    - Not MCP-exposed (cannot invoke via Copilot Chat)
    - No team ownership model for template maintenance
    
    VIOLATIONS DETECTED:
    - Phase 99 filename: "phase-99-vision-api-dogfooding-workflow.yaml" (49 chars)
      • Violates CORE-028: ≤40 char limit
      • Violates CORE-028: Concept-based naming ("dogfooding")
      • Correct: "frontend-visual-tdd-workflow.yaml" (33 chars)
    
    ROOT CAUSE:
    - WorkflowComposer designed for execution, not discovery
    - No registry pattern applied to workflow templates
    - Missing MCP tool for template operations
    - No quality gates for template validation
    - Ad-hoc template creation without governance

    IMPACT IF NOT FIXED:
    - ❌ Template sprawl (no organization)
    - ❌ Poor discoverability (how to find right template?)
    - ❌ No quality assurance (templates untested)
    - ❌ Maintenance burden (scattered ownership)
    - ❌ Not user-accessible (no MCP exposure)
    - ❌ Governance violations persist (CORE-028)

  solution_approach: |
    3-TIER ARCHITECTURE (Extends WorkflowComposer):
    
    TIER 1: WorkflowTemplateRegistry (New Component)
      - Nested folder structure: cortex-registry/workflows/{category}/{template}/
      - Auto-discovery from metadata.yaml files
      - 5 categories: tdd/, api/, frontend/, migration/, security/
      - 15 predesigned templates (3 per category)
      - Semantic search across template metadata
      - Validation engine (governance + golden tests)
    
    TIER 2: Golden Test Harness (Shared Infrastructure)
      - cortex-registry/workflows/_golden_tests/
      - Base test classes for all templates
      - Coverage: sunshine, rainy, edge cases, blindspots
      - Audit log verification patterns
      - Performance profiling
      - Regression detection
    
    TIER 3: MCP Tool (cortex_workflow)
      - Single tool for: execute, list, search, validate, preview
      - Routes through WorkflowComposer (no changes needed)
      - EnforcementOrchestrator integration
      - Audit trail verification
      - Results with governance scoring

  success_criteria:
    - "✅ WorkflowTemplateRegistry implemented with auto-discovery"
    - "✅ Nested folder structure created (5 categories)"
    - "✅ Golden test harness operational (25 tests)"
    - "✅ MCP tool cortex_workflow registered (tool #27)"
    - "✅ Phase 99 migrated to frontend-visual-tdd/ (CORE-028 compliant)"
    - "✅ 15 template scaffolds created with metadata"
    - "✅ Zero breaking changes to WorkflowComposer"
    - "✅ 125 tests passing (registry + tool + templates)"
    - "✅ Documentation complete (README + authoring guide)"
    - "✅ Team ownership model documented"

