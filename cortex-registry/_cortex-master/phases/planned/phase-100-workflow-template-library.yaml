templates:
  description: |
    10 convergence-gated templates (tech-agnostic). Each resolves differently
    based on knowledge context AND each step has convergence gates that loop
    until success criteria met. Higher value per template, lower maintenance.

  template_list:
    - id: "tdd/feature-implementation"
      name: "Feature Implementation TDD Workflow"
      category: "tdd"
      description: "Full RED→GREEN→REFACTOR TDD cycle for any feature"
      convergence_gate:
        max_cycles: 8
        success_criteria:
          all_tests_pass: true
          coverage_target_met: true
        convergence_predicate: "all_tests_pass and coverage >= target"
      architect_resolution:
        test_framework: "pytest"
        patterns: "Orchestrator + Registry pattern"
        coverage_target: "95%"
      production_resolution:
        test_framework: "{from onboarded profile}"
        patterns: "{from onboarded profile architecture_patterns}"
        coverage_target: "{from company/domains/ or 80% default}"

    - id: "tdd/frontend-visual"
      name: "Frontend Visual TDD Workflow"
      category: "tdd"
      description: "Full TDD cycle for visual frontend development"
      convergence_gate:
        max_cycles: 6
        success_criteria:
          visual_diff_zero: true
          a11y_violations_zero: true
        convergence_predicate: "screenshot_diff == 0 and a11y_violations == 0"
      architect_resolution:
        test_framework: "pytest + Playwright"
        component_patterns: "CORTEX site patterns (cortex-docs/)"
        a11y_standard: "WCAG 2.1 AA"
        deployment: "GitHub Pages"
      production_resolution:
        test_framework: "{from onboarded profile: Jest/Cypress/Playwright}"
        component_patterns: "{from onboarded profile: React/Angular/Vue}"
        a11y_standard: "{from company/domains/ or WCAG 2.1 AA default}"
        deployment: "{from onboarded profile infrastructure}"

    - id: "tdd/api-service"
      name: "API Service TDD Workflow"
      category: "tdd"
      description: "TDD cycle for API endpoint development"
      convergence_gate:
        max_cycles: 8
        success_criteria:
          api_contract_valid: true
          security_scan_clean: true
          all_tests_pass: true
        convergence_predicate: "contract_valid and security_clean and all_tests_pass"
      architect_resolution:
        test_framework: "pytest + httpx"
        api_style: "FastAPI + MCP endpoints"
        auth_pattern: "MCP tool authentication"
        security: "CORTEX CORE rules"
      production_resolution:
        test_framework: "{from profile: pytest/Jest/NUnit/xUnit}"
        api_style: "{from company/domains/api-design-standards.yaml}"
        auth_pattern: "{from company/domains/security-standards.yaml}"
        security: "{from company compliance standards}"

    - id: "security/compliance-audit"
      name: "Security Compliance Audit Workflow"
      category: "security"
      description: "Security audit with compliance standard verification"
      convergence_gate:
        max_cycles: 10
        success_criteria:
          p0_findings: 0
          p1_findings: 0
        convergence_predicate: "p0_count == 0 and p1_count == 0"
      architect_resolution:
        standards: "CORTEX CORE rules + OWASP"
        scanning: "MCP secret scanning"
        compliance: "Internal governance (30 CORE rules)"
      production_resolution:
        standards: "{from company/domains/security-standards.yaml}"
        scanning: "{from company/domains/payment-security.yaml if fintech}"
        compliance: "{PCI-DSS/HIPAA/SOX from company compliance}"

    - id: "quality/code-uplift"
      name: "Code Quality Uplift Workflow"
      category: "quality"
      description: "Systematic quality improvement with metric convergence"
      convergence_gate:
        max_cycles: 8
        success_criteria:
          quality_score_target: true
          complexity_reduced: true
        convergence_predicate: "quality_score >= target and complexity_delta < 0"
      architect_resolution:
        metrics: "CORTEX LENS quality metrics"
        refactoring: "CORTEX RefactoringOrchestrator patterns"
        target_score: "80+"
      production_resolution:
        metrics: "{from company/domains/ quality standards}"
        refactoring: "{from onboarded profile refactoring patterns}"
        target_score: "{from company/domains/ or 70+ default}"

    - id: "migration/modernize"
      name: "Legacy Modernization Workflow"
      category: "migration"
      description: "Incremental migration from legacy to modern patterns"
      convergence_gate:
        max_cycles: 12
        success_criteria:
          legacy_tests_still_pass: true
          new_tests_added: true
          migration_chunk_complete: true
        convergence_predicate: "legacy_pass and new_tests > 0 and chunk_migrated"
      architect_resolution:
        source_patterns: "Legacy CORTEX patterns"
        target_patterns: "Current CORTEX architecture"
        rollback: "Git checkpoint (CORE-026)"
        verification: "152+ test suite"
      production_resolution:
        source_patterns: "{from onboarded profile detected patterns}"
        target_patterns: "{from company/domains/ target architecture}"
        rollback: "{from onboarded profile version control patterns}"
        verification: "{from onboarded profile existing test suite}"

    - id: "cleanup/deduplication"
      name: "Code Deduplication Workflow"
      category: "cleanup"
      description: "Detect and remove duplicate code using LENS + CORE-035"
      convergence_gate:
        max_cycles: 5
        success_criteria:
          duplicate_count: 0
          no_regressions: true
        convergence_predicate: "duplicate_count == 0 and all_tests_pass"
      architect_resolution:
        scanner: "LENS duplicate detection"
        standard: "CORE-035 (single canonical implementation)"
        refactoring: "Extract shared module pattern"
      production_resolution:
        scanner: "{from LENS — tech-agnostic}"
        standard: "{from company/domains/ DRY standards}"
        refactoring: "{from onboarded profile architecture patterns}"

    - id: "onboarding/repo-setup"
      name: "Repository Onboarding Workflow"
      category: "onboarding"
      description: "Onboard a new repository with full profile generation"
      convergence_gate:
        max_cycles: 3
        success_criteria:
          profile_sections_complete: true
          security_scan_done: true
        convergence_predicate: "all_sections_populated and security_assessed"
      architect_resolution:
        profile_schema: "CORTEX onboarding profile v2"
        security: "CORTEX security agent"
        output: "cortex_brain/onboarded_repos/"
      production_resolution:
        profile_schema: "{same — CORTEX profile schema is universal}"
        security: "{from company/domains/security-standards.yaml}"
        output: "cortex_brain/onboarded_repos/"

    - id: "review/post-phase-dedup"
      name: "Post-Phase Deduplication Review"
      category: "review"
      description: "Cross-phase dedup check — auto-injected after each phase"
      convergence_gate:
        max_cycles: 3
        success_criteria:
          new_duplicates_count: 0
        convergence_predicate: "new_duplicates_count == 0"
      architect_resolution:
        scanner: "LENS + CORE-035"
        scope: "Files modified in completed phase"
      production_resolution:
        scanner: "{same — LENS is tech-agnostic}"
        scope: "Files modified in completed phase"

    - id: "refactor/holistic-sweep"
      name: "Holistic Refactoring Sweep"
      category: "refactor"
      description: "Multi-file coherence refactoring after workflow completion"
      convergence_gate:
        max_cycles: 5
        success_criteria:
          lens_score_above_baseline: true
          no_regressions: true
        convergence_predicate: "lens_score >= baseline and all_tests_pass"
      architect_resolution:
        orchestrator: "RefactoringOrchestrator"
        scope: "All files modified during workflow"
        patterns: "CORTEX architecture patterns"
      production_resolution:
        orchestrator: "RefactoringOrchestrator"
        scope: "All files modified during workflow"
        patterns: "{from company/domains/ + onboarded profile}"

# ============================================================================
# STAGE BREAKDOWN (8 Stages, 28 Hours)
# ============================================================================
stages:
  # --------------------------------------------------------------------------
  # STAGE 1: WorkflowTemplateRegistry + StepStateMachine + ConvergenceGateConfig
  # --------------------------------------------------------------------------
  - stage_id: S1
    name: "WorkflowTemplateRegistry + Convergence-Gated Execution Engine"
    priority: P0
    estimated_effort: "6 hours"
    estimated_tokens: "12000"

    objectives:
      - "Create WorkflowTemplateRegistry class with auto-discovery"
      - "Wire KnowledgeSynthesisEngine for template placeholder resolution"
      - "Implement mode-aware knowledge loading (ARCHITECT vs PRODUCTION)"
      - "Build StepStateMachine using `transitions` FSM library"
      - "Create ConvergenceGateConfig dataclass for per-step success criteria"
      - "Wire ConvergenceNeuron (Phase 83) into step checking state"
      - "Add semantic search + validation engine"

    deliverables:
      - file: "cortex/orchestrators/workflow/template_registry.py"
        type: "implementation"
        lines: 500
        tests: 12
        coverage: ">= 95%"
        description: |
          WorkflowTemplateRegistry class:
          - discover_templates(): scan cortex-registry/workflows/{category}/
          - resolve_template(template_id, context): inject knowledge into placeholders
          - search(query, filters): semantic search across templates
          - validate(template_id): governance + golden test verification
          - _resolve_knowledge_context(): calls KnowledgeSynthesisEngine
          - _detect_mode(): ARCHITECT vs PRODUCTION based on workspace markers

      - file: "cortex/orchestrators/workflow/step_state_machine.py"
        type: "implementation"
        lines: 300
        tests: 10
        coverage: ">= 95%"
        description: |
          StepStateMachine class (uses `transitions` library):
          - States: PENDING, RUNNING, CHECKING, PASSED, RETRYING, FAILED, SKIPPED
          - Transitions: start, check, pass_gate, retry, re_execute, fail, skip
          - ConvergenceNeuron integration at CHECKING state
          - Cycle counter with max_cycles safety limit
          - Event emission at each state transition (audit trail)
          
          ConvergenceGateConfig dataclass:
          - max_cycles: int
          - success_criteria: Dict[str, Any]
          - convergence_predicate: str
          - scan_function: str
          - backoff_strategy: str (none/linear/exponential)

      - file: "tests/unit/orchestrators/workflow/test_template_registry.py"
        type: "tests"
        lines: 400
        test_count: 12

      - file: "tests/unit/orchestrators/workflow/test_step_state_machine.py"
        type: "tests"
        lines: 350
        test_count: 10
        description: |
          Tests cover:
          - FSM state transitions (all 7 valid paths)
          - ConvergenceNeuron integration (converged → PASSED)
          - Retry loop (NOT converged → RETRYING → RUNNING cycle)
          - Max cycles exceeded → FAILED
          - Backoff strategy delays
          - Event emission at each transition
          - Concurrent step execution (thread safety)

    acceptance_criteria:
      - "AC-PHASE100-S1-001: Registry discovers templates from nested folders"
      - "AC-PHASE100-S1-002: Knowledge placeholders resolve in ARCHITECT mode"
      - "AC-PHASE100-S1-003: Knowledge placeholders resolve in PRODUCTION mode"
      - "AC-PHASE100-S1-004: company/domains/*.yaml overrides CORTEX defaults"
      - "AC-PHASE100-S1-005: Onboarded repo profile drives framework selection"
      - "AC-PHASE100-S1-006: Graceful fallback when knowledge sources missing"
      - "AC-PHASE100-S1-007: StepStateMachine transitions through all valid states"
      - "AC-PHASE100-S1-008: ConvergenceNeuron drives CHECKING → PASSED/RETRYING"
      - "AC-PHASE100-S1-009: Max cycles exceeded → FAILED state"
      - "AC-PHASE100-S1-010: Convergence gate config parsed from template YAML"

    enforcement_gates:
      - "CORE-008: 22 tests written BEFORE implementation"
      - "CORE-011: Type hints on all methods"
      - "CORE-012: Google-style docstrings"
      - "CORE-026: Git checkpoint before implementation"
      - "CORE-027: AC_START → AC_COMPLETE markers"

    tasks:
      - task_id: T1
        name: "Define WorkflowTemplate + ResolvedWorkflow + ConvergenceGateConfig dataclasses"
        effort: "1 hour"
        tests: 3

      - task_id: T2
        name: "Implement folder scanning + metadata parsing"
        effort: "1 hour"
        tests: 3

      - task_id: T3
        name: "Wire KnowledgeSynthesisEngine for placeholder resolution"
        effort: "1.5 hours"
        tests: 4
        description: |
          Key integration point. Calls synthesize_unified_context() with:
          - intent_type from template category
          - company_knowledge from CompanyKnowledgeLoader
          - lens_intelligence from onboarded repo profile
          Resolves {test_framework}, {auth_pattern}, etc.

      - task_id: T4
        name: "Build StepStateMachine using transitions FSM + ConvergenceNeuron"
        effort: "1.5 hours"
        tests: 10
        description: |
          Core innovation. Uses `transitions` library for FSM:
          - 7 states: PENDING, RUNNING, CHECKING, PASSED, RETRYING, FAILED, SKIPPED
          - ConvergenceNeuron.check() called at CHECKING state
          - Retry loop: CHECKING → RETRYING → RUNNING → CHECKING
          - Safety: max_cycles limit, backoff_strategy
          - Audit: event emission at every transition

      - task_id: T5
        name: "Add mode detection + semantic search + validation"
        effort: "1 hour"
        tests: 2

