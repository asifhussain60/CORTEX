# ============================================================================
# TESTING STRATEGY
# ============================================================================
testing_strategy:
  total_tests: 74
  breakdown:
    stage_1_registry: 12
    stage_2_mcp_tool: 8
    stage_3_integration: 8
    stage_4_golden_tests: 33
    stage_5_templates: 0
    stage_6_docs: 0
    subtotal_unit: 28
    subtotal_integration: 33
    subtotal_template: 13

  coverage_target: ">= 95%"

  two_context_strategy:
    description: |
      Every functional test runs in BOTH contexts to verify knowledge
      injection produces correct, mode-specific output.

    architect_context_tests:
      count: 10
      knowledge_sources:
        - "cortex-registry/_cortex-master/knowledge/ (45+ YAMLs)"
        - "CORTEX CORE rules (30 rules)"
        - "CORTEX architecture patterns"
      expected_output:
        - "pytest test framework"
        - "FastAPI API patterns"
        - "CORTEX orchestrator patterns"
        - "SQLite database patterns"

    production_context_tests:
      count: 10
      knowledge_sources:
        - "company/domains/api-design-standards.yaml (mocked)"
        - "company/domains/security-standards.yaml (mocked)"
        - "company/domains/payment-security.yaml (mocked)"
        - "cortex_brain/onboarded_repos/{repo}.json (mocked)"
      expected_output:
        - "User's test framework (Jest/NUnit/xUnit)"
        - "User's API patterns (REST/GraphQL)"
        - "User's auth patterns (OAuth2 + PKCE)"
        - "User's compliance standards (PCI-DSS)"

    audit_verification_tests:
      count: 5
      patterns:
        - "AC_START marker present at workflow initiation"
        - "AC_COMPLETE marker present with test count"
        - "Knowledge source attribution in audit log"
        - "Git checkpoint created at stage boundaries"
        - "Governance score recorded per execution"

    path_coverage_tests:
      count: 8
      sunshine:
        - "Valid inputs → knowledge resolved → domain-correct output"
        - "Template with full company knowledge → all placeholders resolved"
      rainy:
        - "Missing company knowledge → graceful fallback to CORTEX defaults"
        - "Invalid template ID → clear error with available templates"
        - "Corrupted metadata.yaml → skip template, log warning"
      edge:
        - "Concurrent template resolution → thread-safe execution"
        - "Empty onboarded profile → full fallback chain"
      blindspot:
        - "Knowledge conflict: company contradicts CORTEX → company wins"

  test_types:
    unit:
      - "Registry auto-discovery + metadata parsing"
      - "Knowledge placeholder resolution"
      - "Mode detection (ARCHITECT vs PRODUCTION)"
      - "MCP tool operations"
      - "IntentRouter workflow suggestion"
      - "MasterOrchestrator routing update"

    integration:
      - "WorkflowTemplateRegistry → KnowledgeSynthesisEngine wiring"
      - "IntentRouter → WorkflowTemplateRegistry → WorkflowComposer pipeline"
      - "MCP tool → MasterOrchestrator Stage 3 → knowledge resolution"
      - "company/domains/*.yaml → template placeholder resolution"
      - "Onboarded repo profile → test framework selection"

    e2e:
      - "Full TDD workflow execution in ARCHITECT mode"
      - "Full TDD workflow execution in PRODUCTION mode (mock data)"
      - "Audit log verification end-to-end"
      - "Knowledge source attribution verification"

# ============================================================================
# ENFORCEMENT GATES
# ============================================================================
enforcement_gates:
  pre_execution:
    - gate: "EnforcementOrchestrator"
      agents: 7
      checks:
        - "CORE-008: TDD mandatory (74 tests before code)"
        - "CORE-011: Type hints on all methods"
        - "CORE-012: Google-style docstrings"
        - "CORE-026: Git checkpoints at stage boundaries"
        - "CORE-027: AC_START → AC_COMPLETE markers"
        - "CORE-028: File naming (kebab-case, ≤40 chars)"
        - "CORE-035: No duplication with existing components"
        - "CORE-036: Industry standards (company/domains/ + CORTEX merged)"

  runtime_monitoring:
    - "Stage completion verification (cannot skip stages)"
    - "Test coverage enforcement (≥95% required)"
    - "Knowledge injection verified (no static defaults in PRODUCTION mode)"
    - "No CORTEX-internal patterns leak into PRODUCTION output"
    - "All audit trails verified"
    - "No CORTEX_DEBUG markers in committed code"

  post_execution:
    - "74 tests passing"
    - "Zero lint errors"
    - "Zero breaking changes to WorkflowComposer"
    - "Zero breaking changes to KnowledgeSynthesisEngine"
    - "Zero breaking changes to IntentRouter"
    - "Zero breaking changes to MasterOrchestrator"
    - "MCP server starts successfully (28+ tools)"
    - "Template registry auto-discovers all 5 templates"
    - "ARCHITECT mode tests pass"
    - "PRODUCTION mode tests pass"
    - "Audit verification tests pass"
    - "Documentation complete"

# ============================================================================
# RISK MITIGATION
# ============================================================================
risks:
  - risk: "KnowledgeSynthesisEngine changes break existing synthesis"
    probability: "Very Low"
    impact: "High"
    mitigation: |
      WorkflowTemplateRegistry CALLS synthesize_unified_context() — does NOT modify it.
      New method resolve_for_workflow() wraps existing API. Zero changes to engine internals.

  - risk: "IntentRouter changes break existing intent classification"
    probability: "Very Low"
    impact: "High"
    mitigation: |
      New method classify_intent_with_workflow_suggestion() is ADDITIVE.
      Existing classify_intent() unchanged. New method calls old method + adds template hint.
      Fallback: if no template match, returns (intent, None) → standard routing.

  - risk: "MasterOrchestrator Stage 2 changes break orchestration pipeline"
    probability: "Very Low"
    impact: "Critical"
    mitigation: |
      Stage 2 update is CONDITIONAL: if template_id suggested → route to WorkflowComposer.
      Else → existing pipeline unchanged. Feature-flagged for safe rollout.

  - risk: "Knowledge conflict: company contradicts CORTEX rules"
    probability: "Medium"
    impact: "Medium"
    mitigation: |
      KnowledgeSynthesisEngine already handles precedence:
      company/domains/ OVERRIDES cortex knowledge. This is by design.
      Test verifies: company always wins on conflict.

  - risk: "Onboarded repo profile missing or incomplete"
    probability: "Medium"
    impact: "Low"
    mitigation: |
      Graceful fallback chain: onboarded profile → company/domains/ → CORTEX defaults.
      Golden tests verify each fallback level works independently.

  - risk: "Phase 99 migration breaks existing references"
    probability: "Very Low"
    impact: "Low"
    mitigation: "Phase 99 is planned (not yet executed), no production dependencies"

