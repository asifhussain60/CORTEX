overview:
  vision: |
    Build 10 convergence-gated, knowledge-parameterized workflow templates that
    resolve differently based on repository context (ARCHITECT vs PRODUCTION mode).
    Every workflow step is gated by a ConvergenceNeuron (Phase 83) success criteria
    check — steps loop until their exit condition is met or max_cycles exceeded.
    Templates consume domain knowledge via KnowledgeSynthesisEngine. Workflows
    auto-inject PostPhaseDeduplicationReview and HolisticRefactoringSweep epilogues
    after multi-phase work. Uses `transitions` FSM library for step state machines.
    Same template, different knowledge injection, convergence-verified output.

  architectural_insight: |
    TWO VERSIONS OF CORTEX — SEPARATED BY CONTEXT, NOT CODE:
    
    Version 1 (ARCHITECT): cortex-architect.prompt.md
      - Builds CORTEX itself
      - Knowledge: CORTEX-internal specs (registry, wiring, phases)
      - Templates resolve with: pytest, FastAPI, orchestrator patterns
      - Golden tests verify: CORTEX architecture compliance
    
    Version 2 (PRODUCTION): CORTEX.prompt.md
      - Builds user's production repos
      - Knowledge: Onboarded repo profile + company/domains/*.yaml
      - Templates resolve with: USER's framework, USER's test runner, USER's standards
      - Golden tests verify: Domain compliance + company standard adherence
    
    SEPARATION MECHANISM (already exists):
      - Mode detection: .cortex/ marker → ARCHITECT, no marker → PRODUCTION
      - KnowledgeSynthesisEngine.synthesize_unified_context() already handles this
      - Company knowledge takes precedence (company/domains/*.yaml overrides CORTEX defaults)
      - Same 28 orchestrators, same MCP tools, different knowledge resolution

  problem_statement: |
    CURRENT STATE:
    - WorkflowComposer exists but templates are STATIC YAML recipes
    - Templates have NO knowledge injection point
    - KnowledgeSynthesisEngine merges Company→CORTEX at Stage 3 BUT
      workflow templates bypass this entirely
    - Onboarded repo profiles (cortex_brain/onboarded_repos/) NOT connected
    - company/domains/ knowledge NOT used during template resolution
    - Phase 99 violates CORE-028 (filename + concept naming)
    - ConvergenceNeuron (Phase 83) exists but NOT wired to workflow steps
    - Steps run once and fail-stop — no retry/convergence loop
    - No post-phase deduplication check across completed work
    - No holistic refactoring sweep after multi-phase execution
    
    CRITICAL GAPS:
    1. Static templates produce GENERIC code (no knowledge injection)
    2. Fire-and-forget steps (no convergence gates, no retry loops)
    3. No cross-phase deduplication review
    4. No holistic refactoring epilogue after multi-phase work
    5. No step state machine (steps have no lifecycle tracking)
    
    IMPACT IF NOT FIXED:
    - ❌ Templates produce boilerplate (not domain-aware)
    - ❌ Steps fail once and abort entire workflow
    - ❌ Cleanup loops don't iterate until resolved
    - ❌ Multi-phase work accrues local optima (no holistic refactor)
    - ❌ Duplicate code introduced across phases undetected
    - ❌ Users must manually adapt generated code to their patterns
    - ❌ No distinction between ARCHITECT and PRODUCTION output

  solution_approach: |
    CONVERGENCE-GATED KNOWLEDGE-PARAMETERIZED ARCHITECTURE (5 Tiers):
    
    TIER 1: WorkflowTemplateRegistry (New Component)
      - 10 convergence-gated, knowledge-parameterized templates
      - Templates contain PLACEHOLDERS resolved by KnowledgeSynthesisEngine
      - Auto-discovery from metadata.yaml files
      - Categories: tdd/, api/, security/, migration/, cleanup/, onboarding/, review/, refactor/
    
    TIER 2: Knowledge Bridge (New Wiring)
      - WorkflowTemplateRegistry → KnowledgeSynthesisEngine integration
      - Template placeholders: {test_framework}, {component_library}, {auth_pattern}
      - Resolution chain: Onboarded repo profile → company/domains/ → CORTEX defaults
      - Mode-aware: ARCHITECT loads CORTEX patterns, PRODUCTION loads user patterns
    
    TIER 3: Convergence-Gated Step Execution (New — Core Innovation)
      - Every workflow step wrapped in StepStateMachine (using `transitions` FSM)
      - States: PENDING → RUNNING → CHECKING → PASSED | RETRYING → FAILED
      - ConvergenceNeuron (Phase 83) drives CHECKING → PASSED/RETRYING transition
      - Each step declares success_criteria + max_cycles + convergence_predicate
      - Steps LOOP until success criteria met or max_cycles exceeded
      - Enables: "loop till resolved" for cleanup, quality, and security steps
    
    TIER 4: Auto-Injected Workflow Epilogues (New)
      - PostPhaseDeduplicationReview: LENS scan after each phase, loops till zero new dupes
      - HolisticRefactoringSweep: RefactoringOrchestrator across ALL modified files
      - Both auto-injected by MasterOrchestrator after multi-phase workflow completion
    
    TIER 5: Two-Context Golden Test Harness + Generic Production Baseline
      - ARCHITECT tests: verify CORTEX-compliant output
      - PRODUCTION tests: verify domain-compliant output (mock company knowledge)
      - Generic production profiles: multiple tech stack examples (no repo-specific references)
      - Shared: audit log verification, AC marker checks, E2E workflow execution
    
    TIER 6: MCP Tool (cortex_workflow)
      - Single entry point for all template operations
      - Knowledge injection + convergence monitoring transparent to user
      - Routes through MasterOrchestrator Stage 3 (knowledge synthesis)
    
    PYTHON LIBRARY DEPENDENCY:
      - `transitions` (MIT, 5K+ GitHub ★, zero deps, 50KB)
      - Provides: FSM for step lifecycle state machines
      - Why: Lightweight, in-process, no server required, MCP-compatible
      - Install: pip install transitions

  knowledge_injection_flow: |
    User Request + Context
         ↓
    MasterOrchestrator.coordinate_operation()
         ↓
    Stage 2: IntentRouter classifies → selects template
         ↓
    Stage 3: KnowledgeSynthesisEngine.synthesize_unified_context()
         ├─ ARCHITECT mode:
         │   - cortex-registry/_cortex-master/knowledge/ (45+ YAMLs)
         │   - CORTEX architecture patterns
         │   - pytest + FastAPI + Playwright
         └─ PRODUCTION mode:
             - company/domains/*.yaml (api-design, security, payment)
             - cortex_brain/onboarded_repos/{repo}_enhanced.json
             - User's tech stack (detected during onboarding)
         ↓
    Stage 4: WorkflowComposer executes template WITH resolved knowledge
         ├─ test_framework: {resolved from onboarded profile}
         ├─ component_patterns: {resolved from company domains}
         ├─ security_standards: {resolved from compliance YAMLs}
         └─ deployment_target: {resolved from infrastructure detection}

  success_criteria:
    - "✅ 10 convergence-gated, knowledge-parameterized templates operational"
    - "✅ Every workflow step gated by ConvergenceNeuron success criteria"
    - "✅ Steps loop until success criteria met (max_cycles safety limit)"
    - "✅ StepStateMachine (transitions FSM) tracks step lifecycle"
    - "✅ PostPhaseDeduplicationReview auto-injected after each phase"
    - "✅ HolisticRefactoringSweep runs as workflow epilogue"
    - "✅ KnowledgeSynthesisEngine wired to WorkflowTemplateRegistry"
    - "✅ company/domains/*.yaml knowledge used during template resolution"
    - "✅ Onboarded repo profiles drive test framework selection"
    - "✅ Generic production profiles validate PRODUCTION mode resolution"
    - "✅ AutonomousWorkflowExecutor bridges WorkflowComposer → AutonomousExecutor"
    - "✅ End-to-end autonomous execution (approve → done, zero interrupts)"
    - "✅ Two-context golden tests pass (ARCHITECT + PRODUCTION)"
    - "✅ E2E tests verify audit log integrity (AC_START → AC_COMPLETE)"
    - "✅ MCP tool cortex_workflow registered and operational (+ monitor operation)"
    - "✅ Phase 99 migrated to frontend-visual-tdd/ (CORE-028 compliant)"
    - "✅ Zero breaking changes to WorkflowComposer or KnowledgeSynthesisEngine"
    - "✅ ~104 high-value tests passing (96 + 8 autonomous execution)"

