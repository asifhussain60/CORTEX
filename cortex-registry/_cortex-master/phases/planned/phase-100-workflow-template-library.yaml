# ============================================================================
# KNOWLEDGE PARAMETERIZATION ARCHITECTURE
# ============================================================================
knowledge_architecture:
  description: |
    Templates contain knowledge placeholders that resolve differently
    based on repository context (ARCHITECT vs PRODUCTION mode).
    The KnowledgeSynthesisEngine already handles the merge logic —
    Phase 100 wires it into workflow template resolution.

  resolution_chain:
    - priority: 1
      source: "company/domains/*.yaml"
      description: "Company-specific overrides (highest precedence)"
      examples:
        - "api-design-standards.yaml → REST naming, pagination, versioning"
        - "security-standards.yaml → OAuth2, RBAC, TLS requirements"
        - "payment-security.yaml → PCI-DSS, fintech-specific rules"

    - priority: 2
      source: "cortex_brain/onboarded_repos/{repo}_enhanced.json"
      description: "Onboarded repo profile (tech stack, patterns, capabilities)"
      examples:
        - "tech_stack → determines test framework (Jest/pytest/NUnit)"
        - "architecture_patterns → determines component patterns"
        - "integration_points → determines API patterns"

    - priority: 3
      source: "cortex-registry/_cortex-master/knowledge/ (45+ YAMLs)"
      description: "CORTEX best practices (fills gaps not covered by company)"
      examples:
        - "tdd-best-practices.yaml → RED-GREEN-REFACTOR cycle"
        - "secure-coding-practices.yaml → OWASP Top 10"
        - "clean-code.yaml → SOLID, DRY, KISS"

  template_placeholders:
    - placeholder: "{test_framework}"
      architect_value: "pytest"
      production_value: "Resolved from onboarded repo profile tech_stack"
      fallback: "pytest"

    - placeholder: "{component_library}"
      architect_value: "CORTEX orchestrator patterns"
      production_value: "Resolved from onboarded repo profile (React/Angular/Vue)"
      fallback: "vanilla HTML/CSS/JS"

    - placeholder: "{auth_pattern}"
      architect_value: "MCP authentication"
      production_value: "Resolved from company/domains/security-standards.yaml"
      fallback: "OAuth2 with PKCE"

    - placeholder: "{api_style}"
      architect_value: "FastAPI + MCP endpoints"
      production_value: "Resolved from company/domains/api-design-standards.yaml"
      fallback: "RESTful with OpenAPI spec"

    - placeholder: "{compliance_standards}"
      architect_value: "CORTEX CORE rules"
      production_value: "Resolved from company/domains/ (PCI-DSS, HIPAA, SOX)"
      fallback: "OWASP Top 10"

    - placeholder: "{deployment_target}"
      architect_value: "CORTEX deployment pipeline"
      production_value: "Resolved from onboarded repo infrastructure detection"
      fallback: "Docker + CI/CD"

  mode_detection:
    architect_markers:
      - ".cortex/ directory exists"
      - "cortex-registry/ directory exists"
      - "cortex/__init__.py exists"
    production_markers:
      - "None of the above markers present"
    environment_variable: "CORTEX_MODE (architect|production)"

# ============================================================================
# 5 KNOWLEDGE-PARAMETERIZED TEMPLATES
# ============================================================================
templates:
  description: |
    5 templates (not 15 static ones). Each resolves differently based on
    knowledge context. Higher value per template, lower maintenance burden.

  template_list:
    - id: "tdd/frontend-visual"
      name: "Frontend Visual TDD Workflow"
      category: "tdd"
      description: "Full TDD cycle for visual frontend development"
      architect_resolution:
        test_framework: "pytest + Playwright"
        component_patterns: "CORTEX site patterns (cortex-docs/)"
        a11y_standard: "WCAG 2.1 AA"
        deployment: "GitHub Pages"
      production_resolution:
        test_framework: "{from onboarded profile: Jest/Cypress/Playwright}"
        component_patterns: "{from onboarded profile: React/Angular/Vue}"
        a11y_standard: "{from company/domains/ or WCAG 2.1 AA default}"
        deployment: "{from onboarded profile infrastructure}"

    - id: "tdd/api-service"
      name: "API Service TDD Workflow"
      category: "tdd"
      description: "TDD cycle for API endpoint development"
      architect_resolution:
        test_framework: "pytest + httpx"
        api_style: "FastAPI + MCP endpoints"
        auth_pattern: "MCP tool authentication"
        security: "CORTEX CORE rules"
      production_resolution:
        test_framework: "{from profile: pytest/Jest/NUnit/xUnit}"
        api_style: "{from company/domains/api-design-standards.yaml}"
        auth_pattern: "{from company/domains/security-standards.yaml}"
        security: "{from company compliance standards}"

    - id: "tdd/backend-service"
      name: "Backend Service TDD Workflow"
      category: "tdd"
      description: "TDD cycle for backend service/module development"
      architect_resolution:
        test_framework: "pytest"
        patterns: "Orchestrator + Registry pattern"
        error_handling: "CORTEX CORE-013 (no bare except)"
        database: "SQLite (governance.db pattern)"
      production_resolution:
        test_framework: "{from onboarded profile}"
        patterns: "{from onboarded profile architecture_patterns}"
        error_handling: "{from company/domains/ error handling standards}"
        database: "{from onboarded profile tech_stack}"

    - id: "security/compliance-audit"
      name: "Security Compliance Audit Workflow"
      category: "security"
      description: "Security audit with compliance standard verification"
      architect_resolution:
        standards: "CORTEX CORE rules + OWASP"
        scanning: "MCP secret scanning"
        compliance: "Internal governance (30 CORE rules)"
      production_resolution:
        standards: "{from company/domains/security-standards.yaml}"
        scanning: "{from company/domains/payment-security.yaml if fintech}"
        compliance: "{PCI-DSS/HIPAA/SOX from company compliance}"

    - id: "migration/modernize"
      name: "Legacy Modernization Workflow"
      category: "migration"
      description: "Structured migration from legacy to modern patterns"
      architect_resolution:
        source_patterns: "Legacy CORTEX patterns"
        target_patterns: "Current CORTEX architecture"
        rollback: "Git checkpoint (CORE-026)"
        verification: "152+ test suite"
      production_resolution:
        source_patterns: "{from onboarded profile detected patterns}"
        target_patterns: "{from company/domains/ target architecture}"
        rollback: "{from onboarded profile version control patterns}"
        verification: "{from onboarded profile existing test suite}"

