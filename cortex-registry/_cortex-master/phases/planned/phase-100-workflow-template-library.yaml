  # STAGE 1: WorkflowTemplateRegistry with Knowledge Resolution
  # --------------------------------------------------------------------------
  - stage_id: S1
    name: "WorkflowTemplateRegistry with Knowledge Bridge"
    priority: P0
    estimated_effort: "5 hours"
    estimated_tokens: "10000"

    objectives:
      - "Create WorkflowTemplateRegistry class with auto-discovery"
      - "Wire KnowledgeSynthesisEngine for template placeholder resolution"
      - "Implement mode-aware knowledge loading (ARCHITECT vs PRODUCTION)"
      - "Build metadata parsing with knowledge placeholder schema"
      - "Add semantic search + validation engine"

    deliverables:
      - file: "cortex/orchestrators/workflow/template_registry.py"
        type: "implementation"
        lines: 500
        tests: 12
        coverage: ">= 95%"
        description: |
          WorkflowTemplateRegistry class:
          - discover_templates(): scan cortex-registry/workflows/{category}/
          - resolve_template(template_id, context): inject knowledge into placeholders
          - search(query, filters): semantic search across templates
          - validate(template_id): governance + golden test verification
          - _resolve_knowledge_context(): calls KnowledgeSynthesisEngine
          - _detect_mode(): ARCHITECT vs PRODUCTION based on workspace markers

      - file: "tests/unit/orchestrators/workflow/test_template_registry.py"
        type: "tests"
        lines: 400
        test_count: 12
        coverage_target: "95%"
        description: |
          Tests cover:
          - Template discovery from nested folders
          - Knowledge resolution in ARCHITECT mode
          - Knowledge resolution in PRODUCTION mode (mock company knowledge)
          - Placeholder substitution correctness
          - Fallback when company knowledge missing
          - Metadata validation
          - Semantic search relevance

    acceptance_criteria:
      - "AC-PHASE100-S1-001: Registry discovers templates from nested folders"
      - "AC-PHASE100-S1-002: Knowledge placeholders resolve in ARCHITECT mode"
      - "AC-PHASE100-S1-003: Knowledge placeholders resolve in PRODUCTION mode"
      - "AC-PHASE100-S1-004: company/domains/*.yaml overrides CORTEX defaults"
      - "AC-PHASE100-S1-005: Onboarded repo profile drives framework selection"
      - "AC-PHASE100-S1-006: Graceful fallback when knowledge sources missing"

    enforcement_gates:
      - "CORE-008: 12 tests written BEFORE implementation"
      - "CORE-011: Type hints on all methods"
      - "CORE-012: Google-style docstrings"
      - "CORE-026: Git checkpoint before implementation"
      - "CORE-027: AC_START → AC_COMPLETE markers"

    tasks:
