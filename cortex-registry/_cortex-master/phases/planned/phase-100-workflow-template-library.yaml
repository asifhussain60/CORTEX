      - file: "cortex/orchestrators/workflow/workflow_composer.py"
        type: "update"
        lines: 120
        tests: 6
        description: |
          Extend with optional convergence_mode parameter (NON-BREAKING):
          
          def execute(
              self,
              workflow: Workflow,
              context: ExecutionContext,
              convergence_mode: bool = False  # NEW: optional parameter
          ) -> WorkflowExecutionResult:
              if convergence_mode:
                  return self._execute_with_convergence(workflow, context)
              else:
                  return self._execute_standard(workflow, context)  # Existing logic
          
          def _execute_with_convergence(
              self,
              workflow: Workflow,
              context: ExecutionContext
          ) -> WorkflowExecutionResult:
              \"\"\"Execute with StepStateMachine + ConvergenceNeuron.\"\"\"
              for step in workflow.steps:
                  fsm = StepStateMachine(
                      step=step,
                      convergence_config=step.convergence_gate,
                      neuron=ConvergenceNeuron()
                  )
                  
                  while not fsm.is_terminal_state():
                      fsm.execute_transition()
                      
                      if fsm.current_state == "RETRYING":
                          time.sleep(fsm.backoff_delay())

