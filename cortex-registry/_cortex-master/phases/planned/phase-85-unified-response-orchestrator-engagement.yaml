# ─────────────────────────────────────────────────────────────────────────────
# SUMMARY OF NEW BLOCKS
# ─────────────────────────────────────────────────────────────────────────────
new_blocks_summary:
  - id: "BLOCK-PHASE-ROADMAP"
    tier: "Progress"
    purpose: "Show full operation journey at start"
    always_visible: false
    trigger: "Multi-phase operations (>2 stages)"

  - id: "BLOCK-ENGAGEMENT-BREADCRUMB"
    tier: "Engagement (Tier 1)"
    purpose: "Subtle single-line routing chain"
    always_visible: true
    trigger: "All responses"

  - id: "BLOCK-ENGAGEMENT-TIMELINE"
    tier: "Engagement (Tier 2)"
    purpose: "Collapsible orchestrator timing panel"
    always_visible: false
    trigger: "Complex operations or on request"

  - id: "BLOCK-STAGE-PROGRESS (enhanced)"
    tier: "Progress"
    purpose: "Phase list with optional orchestrator pulse annotation"
    always_visible: false
    trigger: "During autonomous execution"

# ─────────────────────────────────────────────────────────────────────────────
# DESIGN PRINCIPLES
# ─────────────────────────────────────────────────────────────────────────────
design_principles:
  subtle_professional:
    description: "Visual cues should be subtle and professional, not intrusive"
    rules:
      - "Breadcrumb is max 80 chars, backtick-wrapped"
      - "Timeline is collapsible by default"
      - "Pulse annotation is optional, inline with stage"

  three_tier_visibility:
    description: "Engagement visibility scales with operation complexity"
    tiers:
      - tier: 1
        name: "Breadcrumb"
        visibility: "Always"
        format: "Single line in header"
      - tier: 2
        name: "Timeline"
        visibility: "On request or complex ops"
        format: "Collapsible <details> block"
      - tier: 3
        name: "Pulse"
        visibility: "During long operations"
        format: "Inline annotation after current stage"

  ssot_enforcement:
    description: "All template definitions live in templates SSOT"
    rules:
      - "prompts pointer-reference SSOT, never duplicate"
      - "YAML registry mirrors SSOT blocks"
      - "Single canonical definition per block"

# ─────────────────────────────────────────────────────────────────────────────
# AC MARKERS
# ─────────────────────────────────────────────────────────────────────────────
ac_markers:
  start: "AC_START: AC-85-UNIFIED-RESPONSE-ORCHESTRATOR-ENGAGEMENT-{timestamp}"
  complete: "AC_COMPLETE: AC-85-UNIFIED-RESPONSE-ORCHESTRATOR-ENGAGEMENT-{timestamp} ✅"
