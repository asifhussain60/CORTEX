# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists, what triggered it
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Total Recall session (2026-02-27) + chat session request for visual orchestrator engagement cues
  
  Score at entry: 8.5 / 10 (response templates functional but inconsistent)
  Target score: 9.5 / 10 (unified template system with orchestrator visibility)
  
  Baseline measurements:
    - Smoke tests: 1,443 passed
    - Response blocks: 16 defined in SSOT
    - Progress templates: 2 paradigms (bar-only vs phase-list)
    - Orchestrator engagement visibility: 0% (backend trace only)
  
  Git prerequisite: Phase 84 COMPLETE (stub elimination)
  
  Key findings from audit:
    1. Two progress display paradigms exist — "bar-only" vs "phase list + bar"
    2. Total Recall format is superior (shows completed/in-progress/next)
    3. BLOCK-HANDOFF exists but is text-only, easy to miss
    4. OrchestratorTraceLogger (commit 677b93816) captures traces but doesn't surface to user
    5. Visual feedback mixin (commit e86ef8b2d) was built but orphaned
  
  User request: Subtle, professional visual feedback showing orchestrator engagement
  without being intrusive. Three-tier system proposed:
    - Tier 1: Breadcrumb (always visible, single line)
    - Tier 2: Timeline (collapsible, shows timing)
    - Tier 3: Pulse (inline markers during long operations)

