sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — ROI-ordered, TDD-gated sub-phases
# ─────────────────────────────────────────────────────────────────────────────
phases:
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 85-A: Progress Template Unification
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-85-a"
    title: "Progress Template Unification — BLOCK-PHASE-ROADMAP + BLOCK-STAGE-PROGRESS Enhancement"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-85-01", "GAP-85-02", "GAP-85-03"]
    governance_authority: "CORE-002, CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥1,443 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    deliverables:
      new_blocks:
        - name: "BLOCK-PHASE-ROADMAP"
          purpose: "Display full operation journey at start"
          format: |
            ---
            **📋 {OPERATION_NAME} — {N} Phases**

            - ⚪ Phase 1: {NAME}
            - ⚪ Phase 2: {NAME}
            - ⚪ Phase 3: {NAME}

            **Starting Phase 1...**
          trigger: "Multi-phase operations (>2 stages)"
          placement: "After response header, before content"

        - name: "BLOCK-STAGE-PROGRESS (enhanced)"
          purpose: "Show completed/in-progress/next with optional orchestrator pulse"
          format: |
            ---
            **📋 {OPERATION_NAME} — Phase {N}: {PHASE_NAME}**

            [████░░░░░░] 40%

            - ✅ Phase 1: {NAME}
            - ✅ Phase 2: {NAME}
            - 🔵 Phase 3: {NAME} (in progress) `← {OrchestratorName} ({N}ms)`
            - ⚪ Phase 4: {NAME}
            - ⚪ Phase 5: {NAME}

            Tests: {N}/{N} | Coverage: {pct}%
          enhancement: "Optional orchestrator pulse annotation after current stage"

      files_modified:
        - path: ".github/templates/cortex-response-templates.md"
          section: "§Composable Content Blocks"
          action: "Add BLOCK-PHASE-ROADMAP definition"
        - path: ".github/templates/cortex-response-templates.md"
          section: "§Silent Autonomous Mode"
          action: "Update to mandate phase-list format, deprecate bar-only"

    tdd_cycle:
      red:
        action: "Write failing tests for new block definitions"
        gate: "python3 scripts/run_tests.py file tests/golden/test_response_blocks.py — tests FAIL"
        blocker: "Do NOT write implementation until tests fail"
      green:
        action: "Add BLOCK-PHASE-ROADMAP and enhance BLOCK-STAGE-PROGRESS in SSOT"
        gate: "python3 scripts/run_tests.py file tests/golden/test_response_blocks.py — tests PASS"
        blocker: "Do NOT begin REFACTOR until tests pass"
      refactor:
        action: "Verify SSOT consistency, no duplicate definitions"
        gate: "grep -c 'BLOCK-PHASE-ROADMAP' .github/templates/cortex-response-templates.md == 1"
        blocker: "Do NOT mark complete until single canonical definition verified"

    tdd_sequence:
      red:
        - "test_block_phase_roadmap_defined — asserts BLOCK-PHASE-ROADMAP exists in SSOT"
        - "test_block_phase_roadmap_format — asserts format matches spec"
        - "test_block_stage_progress_pulse_support — asserts orchestrator pulse annotation format"
        - "test_silent_autonomous_uses_phase_list — asserts phase-list is mandatory"
      green:
        - "Add BLOCK-PHASE-ROADMAP to §Composable Content Blocks"
        - "Update BLOCK-STAGE-PROGRESS with pulse annotation support"
        - "Update §Silent Autonomous Mode to mandate phase-list format"
      refactor:
        - "Remove any bar-only examples from §Silent Autonomous Mode"
        - "Add cross-reference from §Silent Autonomous to §Composable Blocks"

    acceptance_criteria:
      - "BLOCK-PHASE-ROADMAP defined in SSOT with trigger, format, placement"
      - "BLOCK-STAGE-PROGRESS enhanced with optional orchestrator pulse"
      - "§Silent Autonomous Mode mandates phase-list format"
      - "Bar-only templates marked as deprecated or removed"
      - "All tdd_sequence.red tests GREEN"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/golden/test_response_blocks.py"
      min_tests_pass: 4
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 85-B: Orchestrator Engagement Visibility
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-85-b"
    title: "Orchestrator Engagement Visibility — BLOCK-ENGAGEMENT-BREADCRUMB + BLOCK-ENGAGEMENT-TIMELINE"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-85-04", "GAP-85-05", "GAP-85-06"]
    governance_authority: "CORE-002, CORE-008, CORE-035, CORE-064"
    duration_estimate: "3 hours"
    depends_on: ["phase-85-a"]
    prerequisite: "phase-85-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    deliverables:
      new_blocks:
        - name: "BLOCK-ENGAGEMENT-BREADCRUMB"
          purpose: "Subtle single-line routing chain in response header"
          format: |
            **Route:** `IntentRouter → {Orchestrator} → {Sub-orchestrator}`
          trigger: "All responses (always visible)"
          placement: "Response header, after Author/Orchestrator line"
          design_notes: |
            - Subtle and professional — single backtick-wrapped line
            - Shows which orchestrators processed the request
            - Useful for debugging routing issues
            - Does not clutter response — max 80 chars

        - name: "BLOCK-ENGAGEMENT-TIMELINE"
          purpose: "Collapsible detailed orchestrator timing panel"
          format: |
            <details>
            <summary>🔗 Orchestrator Chain ({N} hops · {total_ms}ms)</summary>

            | # | Orchestrator | Action | Duration | Status |
            |---|--------------|--------|----------|--------|
            | 1 | IntentRouter | CLASSIFY | 12ms | ✅ |
            | 2 | MasterOrchestrator | COORDINATE | 8ms | ✅ |
            | 3 | {Orchestrator} | {ACTION} | {ms}ms | 🔵 |

            </details>
          trigger: "Complex operations (>2 orchestrator hops) or on request"
          placement: "After content, before Next Steps"
          design_notes: |
            - Collapsible by default — not intrusive
            - Shows timing for performance debugging
            - Reads from OrchestratorTraceLogger data
            - Professional tabular format

      response_header_enhancement:
        current: |
          ## {icon} CORTEX {mode}
          **Author:** Asif Hussain | **Orchestrator:** {OrchestratorName} ✅

          ---
        enhanced: |
          ## {icon} CORTEX {mode}
          **Author:** Asif Hussain | **Orchestrator:** {OrchestratorName} ✅
          **Route:** `IntentRouter → {Orchestrator} → {Sub-orchestrator}`

          ---

      files_modified:
        - path: ".github/templates/cortex-response-templates.md"
          section: "§Composable Content Blocks"
          action: "Add BLOCK-ENGAGEMENT-BREADCRUMB and BLOCK-ENGAGEMENT-TIMELINE"
        - path: ".github/templates/cortex-response-templates.md"
          section: "§Response Header"
          action: "Add optional Route line to header spec"
        - path: ".github/templates/cortex-response-templates.md"
          section: "§Standardized Assembly Order"
          action: "Insert engagement blocks in sequence"

    tdd_cycle:
      red:
        action: "Write failing tests for engagement blocks"
        gate: "python3 scripts/run_tests.py file tests/golden/test_engagement_blocks.py — tests FAIL"
        blocker: "Do NOT write implementation until tests fail"
      green:
        action: "Add engagement blocks to SSOT + update response header"
        gate: "python3 scripts/run_tests.py file tests/golden/test_engagement_blocks.py — tests PASS"
        blocker: "Do NOT begin REFACTOR until tests pass"
      refactor:
        action: "Verify block assembly order, SSOT consistency"
        gate: "python3 scripts/run_tests.py smoke — zero regressions"
        blocker: "Do NOT mark complete until smoke passes"

    tdd_sequence:
      red:
        - "test_block_engagement_breadcrumb_defined — asserts BLOCK-ENGAGEMENT-BREADCRUMB in SSOT"
        - "test_block_engagement_breadcrumb_format — asserts Route: backtick format"
        - "test_block_engagement_timeline_defined — asserts BLOCK-ENGAGEMENT-TIMELINE in SSOT"
        - "test_block_engagement_timeline_collapsible — asserts <details> wrapper"
        - "test_response_header_route_line — asserts Route line in header spec"
        - "test_assembly_order_includes_engagement — asserts engagement blocks in sequence"
      green:
        - "Add BLOCK-ENGAGEMENT-BREADCRUMB to §Composable Content Blocks"
        - "Add BLOCK-ENGAGEMENT-TIMELINE to §Composable Content Blocks"
        - "Update Response Header spec with optional Route line"
        - "Update §Standardized Assembly Order with engagement positions"
      refactor:
        - "Consolidate BLOCK-HANDOFF and BLOCK-ENGAGEMENT-BREADCRUMB if overlapping"
        - "Verify all block triggers documented"

    acceptance_criteria:
      - "BLOCK-ENGAGEMENT-BREADCRUMB defined with format, trigger, placement"
      - "BLOCK-ENGAGEMENT-TIMELINE defined with collapsible format"
      - "Response Header spec includes optional Route line"
      - "Assembly order updated: SESSION-IDENTITY → ENGAGEMENT-BREADCRUMB → ..."
      - "All tdd_sequence.red tests GREEN"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/golden/test_engagement_blocks.py"
      min_tests_pass: 6
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

