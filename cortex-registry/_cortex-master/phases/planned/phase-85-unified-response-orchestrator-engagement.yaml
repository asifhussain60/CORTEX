            replacement: "from interpreting [███░░░] as a link reference definition"
        rationale: |
          "Pasted Image" references are stale artifacts from screenshot-based design sessions.
          All progress bar rendering rules now have canonical SSOT definitions in
          .github/templates/cortex-response-templates.md §Progress Bar Format Rules.
