      - "cortex/agents/plan_auditor_agent.py"
      - "cortex/agents/audit_validation_engine.py"
      - "cortex/dashboards/dashboard_sync_service.py"
      - "tests/golden/agents/test_meta_auditor.py"
      - "tests/golden/agents/test_plan_auditor.py"
      - "tests/golden/agents/test_audit_validation.py"
      - "tests/golden/agents/test_dashboard_sync.py"
    
