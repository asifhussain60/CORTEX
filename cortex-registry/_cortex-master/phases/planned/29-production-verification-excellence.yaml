# GOLDEN TEST HARNESS SPECIFICATIONS
# ============================================================================

golden_test_harness:
  philosophy:
    - "Zero mocks: All 260 production tests use real components"
    - "End-to-end focus: Complete user workflows, not isolated units"
    - "Performance validation: Measure latency, throughput, memory"
    - "Chaos engineering: Test failure scenarios, recovery paths"
  
  production_scenarios:
    onboard_analyze_implement:
      - "Onboard Python API → analyze → detect 15+ patterns → implement feature → verify tests pass"
      - "Onboard .NET service → analyze → detect anti-patterns → refactor → verify improved metrics"
      - "Onboard React SPA → analyze → detect accessibility issues → fix → verify compliance"
    
    performance_under_load:
      - "10 concurrent onboard requests → measure p95 latency"
      - "50 concurrent analyze requests → measure throughput"
      - "100 concurrent implement requests → measure memory usage"
    
    chaos_scenarios:
      - "Database connection lost → expect retry + recovery"
      - "MCP server crash → expect request queuing + restart"
      - "Knowledge YAML corrupted → expect fallback + warning"
      - "Orchestrator timeout → expect graceful degradation"
  
  metrics_to_capture:
    - "Request latency: p50, p95, p99"
    - "Throughput: requests/second"
    - "Memory usage: baseline, peak, under load"
    - "Error rate: 4xx, 5xx responses"
    - "Recovery time: from failure to operational"

