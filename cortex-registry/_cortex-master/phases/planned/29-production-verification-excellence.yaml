        - "Onboard new repo → analyze code → implement feature → audit → verify"
        - "Fix bug → refactor → test → deploy → monitor"
        - "Analyze STS app → detect patterns → generate showcase"
      
      performance_benchmarks:
        - "Request latency: p50, p95, p99 under load"
        - "Throughput: requests/second with 10, 50, 100 concurrent users"
        - "Memory usage: baseline vs under load"
        - "Database performance: query latency, connection pooling"
      
