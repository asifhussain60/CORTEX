# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================

overview:
  vision: |
    Create production-grade quality assurance with comprehensive golden test suite
    and polished developer experience:
    
    1. **Meta-Auditor & Plan-Auditor Agents** — Close 2 critical governance gaps.
       Meta-auditor validates audit results (no false positives). Plan-auditor
       syncs registry with dashboard (prevents drift). Both integrated with
       EnforcementOrchestrator.
    
    2. **Production Verification Harness** — 200-260 zero-mock golden tests covering
       end-to-end workflows. Tests simulate real user scenarios: onboard repo,
       analyze code, implement feature, refactor, audit. Performance benchmarks
       under load. Chaos engineering for resilience.
    
    3. **Black/isort Mass Reformatting** — Automated cleanup of 962 files. Black
       formatting enforced via pre-commit hook. isort import sorting standardized.
       Zero code style inconsistencies remaining.
    
    4. **Developer Experience Tooling** — Enhanced CLI with quick-start commands.
       VS Code integration for seamless workflows. Quick-start templates (Python,
       TypeScript, .NET). Developer documentation with interactive tutorials.

  problem_statement: |
    CURRENT STATE (P1-P2 GAPS):
    
    **Governance:**
    - No meta-auditor (audit results not validated, false positives possible)
    - No plan-auditor (dashboard can drift from registry, sync manual)
    - Governance gaps allow inconsistencies
    
    **Production Verification:**
    - Comprehensive golden test suite deferred (not created yet)
    - No end-to-end production scenario tests
    - No performance benchmarks under load
    - No chaos engineering for resilience validation
    
    **Code Quality:**
    - 962 files need black formatting (baseline documented)
    - Import sorting inconsistent (no isort enforcement)
    - Code style violations (non-blocking but unprofessional)
    
    **Developer Experience:**
    - CLI requires manual setup (no quick-start)
    - No VS Code integration (manual workflow)
    - No quick-start templates (higher onboarding friction)
    - Developer docs lack interactive tutorials
    
    IMPACT:
    - ❌ Audit results not trustworthy (no validation layer)
    - ❌ Dashboard drift risk (manual sync error-prone)
    - ❌ Production confidence lower without comprehensive tests
    - ❌ Code style inconsistencies (unprofessional)
    - ❌ Developer onboarding friction (steeper learning curve)

  success_criteria:
    - "✅ Meta-auditor operational (validates audit results)"
    - "✅ Plan-auditor operational (syncs dashboard with registry)"
    - "✅ 200-260 golden tests (zero-mock production scenarios)"
    - "✅ 962 files reformatted (100% black/isort compliance)"
    - "✅ CLI quick-start commands operational"
    - "✅ VS Code integration installed"
    - "✅ 5+ quick-start templates available"

# ============================================================================
# ENFORCEMENT GATES (Visible Governance)
# ============================================================================
enforcement_gates:
  pre_execution:
    - gate: "EnforcementOrchestrator"
      agents: 9  # 7 existing + 2 new (meta-auditor, plan-auditor)
      checks:
        - "CORE-008: TDD mandatory (tests before code)"
        - "CORE-026: Git checkpoint before major changes"
        - "CORE-027: AC_START → AC_COMPLETE audit trail"
        - "CORE-028: File naming (kebab-case)"
      blocking: true
      
  golden_test_requirements:
    - requirement: "Zero-mock production tests"
      validation: "All 200-260 tests use real components, no mocks"
      enforcement: "BLOCKING"
      
    - requirement: "End-to-end workflows"
      validation: "Tests cover complete user journeys (onboard → analyze → implement → audit)"
      enforcement: "BLOCKING"
      
    - requirement: "Performance benchmarks"
      validation: "Tests validate latency, throughput, memory under load"
      enforcement: "BLOCKING"
      
  stage_boundaries:
    - gate: "Phase48HolisticValidation"
      checks:
        - "All production scenario tests passing"
        - "Black/isort 100% compliant"
        - "Pre-commit hooks enforcing formatting"
        - "Meta-auditor + Plan-auditor integrated"
      blocking: true
      frequency: "per_stage"

