id: phase-65
title: "Enterprise Hardening — MCP Auth + 151 ImportError Sweep"
status: PLANNED
priority: P0
created: "2026-02-24"
sweep_id: SWEEP-65-ENTERPRISE-HARDENING
prerequisite: "Phase 64 COMPLETE — all RED scaffolds committed and failing"
constraint: "Wire existing code. Do NOT create new orchestrators, new governance rules, new abstraction layers."

summary: |
  Phase 65 implements the 5 review-derived gaps that Phase 64 scaffolded as
  RED (failing) tests. All implementation work here involves wiring code that
  already exists — tenant_context_middleware.py, safe_import(), OrchestratorProtocolMixin
  are all built. Phase 65 makes them active.

  Source: copilot-reviews-consolidated.md REVIEW-GAP-01 through REVIEW-GAP-05
  Prerequisites: Phase 64 RED scaffolds committed (all 5 failing tests in place)
  Target score after Phase 65: 8.5/10

sub_phases:
  - id: 65-A
    title: "MCP Server Tenant Auth Wiring"
    closes_gaps: [REVIEW-GAP-01]
    scaffold_test: "tests/golden/mcp/test_mcp_operations_golden.py::test_mcp_server_accepts_tenant_header"
    deliverable: |
      Wire tenant_context_middleware.py into cortex/mcp/server.py.
      Server reads X-Tenant-ID header. TenantContext injected into all tool handlers.
    tdd_sequence:
      - "RED already committed (Phase 64-F scaffold)"
      - "GREEN: import TenantContextMiddleware in server.py, wire to handle_tool_call()"
      - "REFACTOR: ensure all 26 tool handlers receive tenant_context kwarg"
    holistic_gate: "holistic-file-review-gate.yaml — scope: [server.py, tenant_context_middleware.py, all 26 tool handlers]"

  - id: 65-B
    title: "151 Silent ImportError → safe_import() Sweep"
    closes_gaps: [REVIEW-GAP-02]
    scaffold_test: "tests/golden/intelligence/test_scorer_self_golden.py::test_no_silent_import_errors_in_golden_path"
    deliverable: |
      Replace all 151 'except ImportError: pass' with safe_import() + DependencyWarning.
      safe_import() already exists in cortex/core/dependencies.py (Phase 62-C).
      This is a sweep — CORE-064 catalogue of all 151 occurrences, closed one-by-one.
    tdd_sequence:
      - "RED already committed (Phase 64-F scaffold)"
      - "GREEN: SweepCatalogueOrchestrator.open_catalogue(FIX, 151 files)"
      - "GREEN: Replace each occurrence with safe_import(module, DependencyWarning)"
      - "GREEN: assert grep -rn 'except ImportError: pass' cortex/ | wc -l == 0"
    holistic_gate: "holistic-file-review-gate.yaml — scope: all 151 files (batched 10/session)"
    note: "This is the largest sweep in Phase 65 — likely needs 3–4 sessions to complete"

  - id: 65-C
    title: "24 Orchestrators Without Mixin + 4 Undocumented Tiers"
    closes_gaps: [REVIEW-GAP-03, REVIEW-GAP-04]
    scaffold_tests:
      - "tests/golden/agents/test_agent_matrix_golden.py::test_all_orchestrators_extend_protocol_mixin"
      - "tests/golden/agents/test_agent_matrix_golden.py::test_all_orchestrator_tiers_registered_in_wiring"
    deliverable: |
      Extend OrchestratorProtocolMixin to the 24 remaining orchestrators in
      git/, strategies/, synthesis/, workflow/ tiers.
      Register all 4 tiers in wiring.yaml (git, strategies, synthesis, workflow).
    tdd_sequence:
      - "RED already committed (Phase 64 REVIEW-GAP-03, REVIEW-GAP-04 scaffolds)"
      - "GREEN: For each of 24 orchestrators: add OrchestratorProtocolMixin to class bases"
      - "GREEN: Add git/strategies/synthesis/workflow entries to wiring.yaml"
      - "REFACTOR: Validate health_check() method present on all 24 newly-mixed orchestrators"
    holistic_gate: "holistic-file-review-gate.yaml — scope: 24 orchestrator files + wiring.yaml"

gap_catalogue:
  - id: REVIEW-GAP-01
    priority: P0
    title: "MCP server tenant auth not wired"
    status: OPEN
    scaffold_test_committed_in: phase-64-F

  - id: REVIEW-GAP-02
    priority: P1
    title: "151 silent ImportError suppressions"
    status: OPEN
    scaffold_test_committed_in: phase-64-F
    count_at_planning: 151

  - id: REVIEW-GAP-03
    priority: P1
    title: "24 orchestrators without OrchestratorProtocolMixin"
    status: OPEN
    scaffold_test_committed_in: phase-64-G
    count_at_planning: 24

  - id: REVIEW-GAP-04
    priority: P2
    title: "4 undocumented orchestrator tiers not in wiring.yaml"
    status: OPEN
    scaffold_test_committed_in: phase-64-G
    tiers: [git, strategies, synthesis, workflow]

  - id: REVIEW-GAP-05
    priority: P0
    title: "cortex-master.yaml THIN INDEX CONTRACT violated (988 lines > 500L)"
    status: IN_PROGRESS
    action: "Inline phase detail extraction is ongoing. Each completed phase moves its detail out."
    note: "Not a sub-phase — addressed continuously as phases complete."

acceptance_gate:
  smoke_gate: "make test-batch"
  golden_gate: "python3 -m pytest tests/golden/ -n auto --dist loadscope"
  p0_count_required: 0
  p1_count_required: 0
  specific_tests:
    - "test_mcp_server_accepts_tenant_header PASSES (was RED in Phase 64)"
    - "test_no_silent_import_errors_in_golden_path PASSES (was RED in Phase 64)"
    - "test_all_orchestrators_extend_protocol_mixin PASSES (was RED in Phase 64)"
    - "test_all_orchestrator_tiers_registered_in_wiring PASSES (was RED in Phase 64)"

multi_session_execution_plan:
  sessions:
    - session: 1
      label: "Phase 65 — Session 1: MCP Auth Wiring"
      sub_phases: [65-A]
      start_command: "fix REVIEW-GAP-01 — wire tenant_context_middleware into server.py"
      gate: "test_mcp_server_accepts_tenant_header GREEN"

    - session: "2–5"
      label: "Phase 65 — Sessions 2–5: ImportError Sweep (batched 10 files/session)"
      sub_phases: [65-B]
      start_command: "fix REVIEW-GAP-02 — replace silent ImportError suppressions with safe_import()"
      gate: "grep -rn 'except ImportError: pass' cortex/ | wc -l == 0"

    - session: 6
      label: "Phase 65 — Session 6: Mixin Rollout + Tier Registration"
      sub_phases: [65-C]
      start_command: "fix REVIEW-GAP-03 and REVIEW-GAP-04"
      gate: "test_all_orchestrators_extend_protocol_mixin + test_all_orchestrator_tiers_registered_in_wiring GREEN"

    - session: 7
      label: "Phase 65 — Session 7: Final Convergence"
      sub_phases: []
      start_command: "audit fix — Phase 65 final convergence"
      gate: "make test-batch — 0 failures, Phase 65 fully closed"
