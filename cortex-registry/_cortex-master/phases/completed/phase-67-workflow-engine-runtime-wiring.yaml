# ============================================================
# RISK ASSESSMENT
# ============================================================

risk_assessment:
  overall: LOW-MEDIUM
  verdict: "Proceed — fix is additive, not rearchitecture"
  reasoning: >-
    convergence_mode=False is the production default in WorkflowComposer —
    fixing convergence_mode=True path is pure additive (zero risk to existing callers).
    WorkflowEngine._execute_step() is currently a stub that silently succeeds —
    replacing with real dispatch is additive (currently no real callers depend on the stub return value).
    234 workflow tests provide a comprehensive regression safety net.
    No new orchestrators. No API surface changes. No schema changes to existing YAML templates
    (adding convergence_gate is additive/optional).

  risks:
    - risk: "WorkflowEngine._execute_step() replacement may surface previously hidden stub-reliant tests"
      mitigation: "Run PRE-02 baseline first; any newly-failing test was already broken (just silently)"
      severity: LOW

    - risk: "Adding convergence_gate to audit-fix-pipeline.yaml may change Stage 7-8 behavior in CI"
      mitigation: "Add convergence_gate as optional block; keep existing stages unchanged; gate only activates when max_iterations > 0"
      severity: LOW

    - risk: "cortex-master.yaml thinning may accidentally delete active phase entries"
      mitigation: "Only extract inline detail to files that already exist; never delete an id: pointer row"
      severity: MEDIUM — handled by extract-only strategy

  is_it_too_late: >-
    No. The primitives are fully functional and tested in isolation.
    The architecture is correct (YAML declarative spec + Python FSM execution).
    The gap is purely wiring — constructor kwargs and dispatch registry.
    These are surgical fixes, not a rewrite.

