id: phase-67
title: "WorkflowEngine Runtime Wiring — YAML→FSM→ConvergenceLoop E2E Integration"
priority: P1
status: PLANNED
created: "2026-02-24"
sweep_id: SWEEP-67-WORKFLOW-RUNTIME-WIRING
phase_prerequisites:
  - phase-64  # golden tests provide regression safety net (177 workflow tests)
  - phase-65  # enterprise hardening (safe_import, mixin rollout) before deep engine rewrites

# ============================================================
# LANDSCAPE AUDIT SUMMARY
# Full audit performed in Phase 64 session 8.
# ============================================================

landscape_findings:
  summary: >-
    CORTEX workflow layer has 3 components that exist in isolation and are
    NOT end-to-end wired. The YAML template execution flow is broken:
    WorkflowEngine._execute_step() is a pure stub; WorkflowComposer uses
    wrong StepStateMachine constructor kwargs; no YAML template defines
    convergence_gate blocks; ConvergenceLoopExecutor is never called from
    either engine. The primitives (StepStateMachine, ConvergenceLoopExecutor)
    are individually correct but disconnected.

  broken_components:
    - component: "cortex/core/workflow_engine.py"
      class: WorkflowEngine
      issue: "_execute_step() is a pure stub — returns {'status': 'complete'} with zero dispatch"
      severity: P0
      lines: "200-280 (approximately)"
      evidence: "operation = step.get('operation', 'noop') → no handler registry, no dispatch"
      risk_if_unchanged: "WorkflowEngine.execute_workflow() silently succeeds on all templates but does nothing"

    - component: "cortex/orchestrators/workflow/workflow_composer.py"
      class: WorkflowComposer
      issue: "_execute_with_convergence() calls StepStateMachine with wrong kwargs"
      severity: P1
      lines: "~358"
      evidence: "fsm = StepStateMachine(step=step.parameters, neuron=None) — valid params are step_id, convergence_config"
      risk_if_unchanged: "convergence_mode=True path always crashes silently; convergence_mode=False is default so no user-visible failure today"

    - component: "cortex/orchestrators/workflow/autonomous_workflow_executor.py"
      class: AutonomousWorkflowExecutor
      issue: "Also imports StepStateMachine with wrong usage pattern"
      severity: P2
      risk_if_unchanged: "Secondary bridge broken; real autonomous execution path dead"

    - component: "cortex-registry/workflows/templates/**/*.yaml"
      issue: "Zero templates define convergence_gate blocks"
      severity: P1
      evidence: "grep -r convergence_gate cortex-registry/workflows/templates/ → 0 matches"
      risk_if_unchanged: "_execute_with_convergence() code path never exercised even after kwargs fix"

    - component: "cortex-registry/cortex-master.yaml"
      issue: "1022 lines — P0 THIN INDEX CONTRACT VIOLATION (limit: 500)"
      severity: P0
      risk_if_unchanged: "Context exhaustion, un-reviewable diffs, YAML parse performance degradation"

  working_components:
    - "cortex/orchestrators/workflow/step_state_machine.py — FSM correct, transitions wired (11 unit + 15 golden tests GREEN)"
    - "cortex/orchestrators/workflow/convergence_loop_executor.py — exponential backoff loop correct (9 golden tests GREEN)"
    - "cortex/orchestrators/workflow/workflow_composer.py:compose() — YAML loading + step parsing correct"
    - "cortex/orchestrators/workflow/workflow_composer.py:_execute_standard() — works when orchestrator registry populated"

  regression_safety_net:
    test_count: 177
    suite: "tests/orchestrators/workflow/"
    additional:
      - "tests/unit/orchestrators/workflow/ — 20 tests"
      - "tests/integration/test_e2e_workflow.py — 7 tests"
      - "tests/golden/workflow/test_workflow_runtime_golden.py — 30 tests (Phase 64-C)"
    assessment: >-
      All 177 + 20 + 7 + 30 = 234 workflow tests are currently GREEN.
      convergence_mode=False is the production default in WorkflowComposer —
      fixing the convergence_mode=True path carries near-zero regression risk.
      WorkflowEngine._execute_step() is a stub today; any real dispatch is additive.

  verdict: >-
    NOT TOO LATE. Fixes are additive (handler registry behind flag, kwargs correction
    behind existing convergence_mode=True gate, YAML template additions are non-breaking).
    234 tests provide a solid regression safety net. Proceed with phased sub-phase plan.

# ============================================================
# GAP CATALOGUE
# ============================================================

gap_catalogue:
  - id: GAP-67-01
    title: "WorkflowEngine._execute_step() is a pure stub — no dispatch to handlers"
    severity: P0
    file: "cortex/core/workflow_engine.py"
    detail: >-
      _execute_step() reads operation = step.get('operation', 'noop') then returns
      {"status": "complete"} unconditionally. No handler registry, no orchestrator lookup,
      no actual work performed. execute_workflow() appears to succeed on all templates
      but is completely hollow. Must be replaced with a step_handler_registry pattern
      that dispatches to registered callables by operation name.
    tdd_sequence:
      - "RED: test_execute_step_dispatches_to_handler — verify operation 'noop' calls noop_handler"
      - "RED: test_execute_step_raises_on_unknown_operation — verify KeyError or StepError"
      - "RED: test_execute_step_returns_step_result — verify result schema {status, output, timing_ms}"
      - "GREEN: implement step_handler_registry dict in WorkflowEngine.__init__()"
      - "GREEN: implement _execute_step() dispatch: handler = self._registry[op]; return handler(step)"
      - "REFACTOR: extract StepHandlerRegistry as injectable dependency for testability"
    status: OPEN

  - id: GAP-67-02
    title: "WorkflowComposer._execute_with_convergence() wrong StepStateMachine constructor kwargs"
    severity: P1
    file: "cortex/orchestrators/workflow/workflow_composer.py"
    detail: >-
      Line ~358: StepStateMachine(step=step.parameters, convergence_config=..., neuron=None).
      Valid constructor signature: StepStateMachine(step_id: str, convergence_config: dict).
      'step' and 'neuron' are not valid params. This dead code path crashes when
      convergence_mode=True. Fix: StepStateMachine(step_id=step.step_id, convergence_config=convergence_config).
    tdd_sequence:
      - "RED: test_execute_with_convergence_creates_fsm — verify StepStateMachine instantiated with step_id"
      - "RED: test_execute_with_convergence_calls_convergence_loop — verify ConvergenceLoopExecutor.execute() called"
      - "GREEN: fix StepStateMachine(step_id=step.step_id, convergence_config=convergence_config)"
      - "GREEN: wire ConvergenceLoopExecutor.execute(fn=execute_step_fn, check_convergence=fsm.check)"
      - "REFACTOR: add ConvergenceResult dataclass with {converged, iterations, final_state}"
    status: OPEN

  - id: GAP-67-03
    title: "AutonomousWorkflowExecutor uses wrong StepStateMachine usage pattern"
    severity: P2
    file: "cortex/orchestrators/workflow/autonomous_workflow_executor.py"
    detail: >-
      Secondary bridge class; also uses StepStateMachine with wrong kwargs.
      Fix in same pass as GAP-67-02 to maintain consistency.
    tdd_sequence:
      - "RED: test_autonomous_executor_creates_fsm_per_step — verify correct step_id kwarg"
      - "GREEN: align constructor call to match StepStateMachine.__init__ signature"
    status: OPEN

  - id: GAP-67-04
    title: "Zero YAML templates define convergence_gate blocks"
    severity: P1
    file: "cortex-registry/workflows/templates/"
    detail: >-
      grep -r convergence_gate cortex-registry/workflows/templates/ → 0 matches.
      The convergence_mode=True code path in WorkflowComposer._execute_with_convergence()
      is never exercised in production because no template triggers it.
      Must add convergence_gate to at least 2 canonical templates to validate the E2E path.
      Target templates: audit-fix-pipeline.yaml (Stage 7-8 convergence loop) and
      tdd-feature-implementation.yaml (TDD RED→GREEN→REFACTOR loop).
    tdd_sequence:
      - "RED: test_convergence_gate_schema_in_template — verify template has convergence_gate block"
      - "RED: test_execute_with_convergence_mode_true_reaches_fsm — integration test"
      - "GREEN: add convergence_gate: {max_iterations: 5, check_operation: 'validate_p0_count'} to audit-fix-pipeline.yaml steps 7-8"
      - "GREEN: add convergence_gate: {max_iterations: 3, check_operation: 'validate_tests_green'} to tdd-feature-implementation.yaml refactor step"
      - "REFACTOR: add convergence_gate JSON schema to template validator"
    status: OPEN

  - id: GAP-67-05
    title: "ConvergenceLoopExecutor never called from WorkflowEngine or WorkflowComposer"
    severity: P1
    file: "cortex/orchestrators/workflow/workflow_composer.py"
    detail: >-
      ConvergenceLoopExecutor exists and works correctly but is an orphan —
      never invoked from any execution path. After GAP-67-02 fix, wire it as
      the convergence gate in _execute_with_convergence():
      loop = ConvergenceLoopExecutor(config=step.convergence_gate_config)
      result = loop.execute(fn=step_executor, check_convergence=fsm.check)
    tdd_sequence:
      - "RED: test_convergence_loop_executor_wired_in_composer — verify loop.execute() called when convergence_mode=True"
      - "GREEN: instantiate ConvergenceLoopExecutor in _execute_with_convergence() and pass fsm.check as check_convergence"
      - "REFACTOR: ConvergenceLoopExecutor.execute() result maps to WorkflowStepResult"
    status: OPEN

  - id: GAP-67-06
    title: "cortex-master.yaml exceeds THIN INDEX CONTRACT (1022 lines > 500 limit)"
    severity: P0
    file: "cortex-registry/cortex-master.yaml"
    detail: >-
      THIN INDEX CONTRACT (CORE policy): cortex-master.yaml must be ≤ 500 lines (alarm at 400).
      Current: 1022 lines. Prohibited inline content found: phases list with full detail,
      gap_catalogue inline in metadata, inline notes exceeding 3 lines.
      Must extract inline phase detail to dedicated files under
      cortex-registry/_cortex-master/phases/ and cortex-registry/planning/phases/.
    tdd_sequence:
      - "AUDIT: identify all sections > 3 lines that belong in dedicated phase files"
      - "EXTRACT: move metadata.planned_phases detail to phase file references only"
      - "EXTRACT: move any inline gap_catalogue or tdd_sequence to phase files"
      - "VERIFY: wc -l cortex-registry/cortex-master.yaml → must be ≤ 500"
      - "VALIDATE: python3 -c 'import yaml; yaml.safe_load(open(\"cortex-registry/cortex-master.yaml\"))'"
    status: OPEN

