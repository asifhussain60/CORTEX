  # ========================================================================
  # STAGE 9: MULTI-ROLE RESPONSE ENGINE (3 days)
  # ========================================================================
  stage_9:
    name: "Stage 8: Multi-Role Response Engine"
    duration: "3 days"
    priority: "P0"
    depends_on: ["stage_2", "stage_3", "stage_4", "stage_5", "stage_6", "stage_7"]
    
    goal: |
      Create unified response composition engine that adapts to user role:
      - Auto-detect role (explicit or inferred)
      - Select applicable template blocks
      - Compose response in correct order
      - Calibrate verbosity per role
      - Return structured response
    
    role_profiles:
      ENGINEER:
        code_examples: "REQUIRED"
        technical_depth: "MAXIMUM"
        business_context: "MINIMAL"
        security_focus: "P0-P2 inline"
        verbosity: "HIGH"
        blocks: [HEADER, SECURITY, TDD, METRICS, VERDICT, NEXT_STEPS]
      
      ARCHITECT:
        code_examples: "SELECTIVE"
        technical_depth: "HIGH"
        business_context: "MODERATE"
        security_focus: "P0-P1 summary"
        verbosity: "MEDIUM-HIGH"
        blocks: [HEADER, SECURITY, METRICS, VERDICT, CHALLENGE, NEXT_STEPS]
      
      PM:
        code_examples: "OPTIONAL"
        technical_depth: "MODERATE"
        business_context: "HIGH"
        security_focus: "Risk score only"
        verbosity: "MEDIUM"
        blocks: [HEADER, TIMELINE, RISK, BUSINESS_CONTEXT, VERDICT, NEXT_STEPS]
      
      BUSINESS:
        code_examples: "NONE"
        technical_depth: "LOW"
        business_context: "PRIMARY"
        security_focus: "Executive summary"
        verbosity: "LOW"
        blocks: [HEADER, BUSINESS_CONTEXT, VERDICT]
      
      SECURITY:
        code_examples: "REQUIRED"
        technical_depth: "MAXIMUM"
        business_context: "MINIMAL"
        security_focus: "ALL with CWE"
        verbosity: "HIGH"
        blocks: [HEADER, SECURITY, CODE_ISSUES, METRICS, VERDICT, NEXT_STEPS]
    
    task_template_matrix: |
      │ Task \ Role   │ Engineer            │ PM                  │ Business            │
      │───────────────┼─────────────────────┼─────────────────────┼─────────────────────│
      │ IMPLEMENT     │ H+Sec+TDD+Metrics   │ H+Timeline+Risk+Biz │ H+Impact+Milestones │
      │ AUDIT         │ H+P0-P2+Fixes       │ H+RiskMatrix        │ H+HealthScore       │
      │ QUERY         │ H+Technical+Evidence│ H+Summary           │ H+PlainLanguage     │
      │ PLAN          │ H+PhaseDetail+Effort│ H+Roadmap+Risks     │ H+StrategicValue    │
      │ DEBUG         │ H+StackTrace+Root   │ H+Impact+Timeline   │ H+Status            │
      │ SECURITY      │ H+AllSecurity+Tests │ H+RiskAssessment    │ H+ComplianceStatus  │
    
    tasks:
      - id: "s8.1"
        name: "Create RoleDetector with inference logic"
        owner: "TBD"
        effort: "3 hours"
        acceptance_criteria:
          - "Explicit role detection (from request)"
          - "Inferred role detection (from keywords)"
          - "Fallback to ENGINEER role"
          - "Accuracy >85% on test set"
        files:
          - "cortex/orchestrators/response/role_detector.py"
        deliverables:
          - "RoleDetector (180 LOC)"
          - "Role signal patterns (100 LOC)"
      
      - id: "s8.2"
        name: "Create MultiRoleResponseEngine core"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "Accepts role, task, context"
          - "Loads role profile"
          - "Selects applicable blocks"
          - "Calls BlockComposer"
          - "Returns structured response"
          - "Caches role profiles"
        files:
          - "cortex/orchestrators/response/multi_role_response_engine.py"
        deliverables:
          - "MultiRoleResponseEngine (280 LOC)"
      
      - id: "s8.3"
        name: "Build 14 role-task template combinations"
        owner: "TBD"
        effort: "6 hours"
        acceptance_criteria:
          - "5 roles × 6 tasks = 30 max combinations"
          - "14 primary combinations defined"
          - "Each combination specifies blocks + order"
          - "Each combination has context mapping"
        files:
          - "cortex_brain/tier2/response-templates/role_task_templates.yaml"
        deliverables:
          - "14 template specifications (YAML)"
      
      - id: "s8.4"
        name: "Implement verbosity calibration"
        owner: "TBD"
        effort: "2 hours"
        acceptance_criteria:
          - "Adjust word count per role"
          - "Adjust technical depth per role"
          - "Adjust example count per role"
          - "Maintain clarity across all roles"
        files:
          - "cortex/orchestrators/response/multi_role_response_engine.py (updated)"
        deliverables:
          - "VerbosityCalibrator (120 LOC)"
    
    tests:
      - "tests/unit/orchestrators/response/test_multi_role_response_engine.py (40 tests)"
      - RoleDetector: explicit detection (2 tests)
      - RoleDetector: inferred detection (5 tests)
      - RoleDetector: edge cases (3 tests)
      - Engine instantiation (1 test)
      - Block selection per role (5 tests)
      - Template composition (10 tests)
      - Verbosity calibration (5 tests)
      - End-to-end: 5 roles × 3 tasks (5 tests)
      - Error handling (4 tests)
    
    success_criteria: "All 40 tests passing, role detection >85% accurate, responses role-appropriate"
    deliverables:
      - "cortex/orchestrators/response/multi_role_response_engine.py (400+ LOC)"
      - "cortex/orchestrators/response/role_detector.py (280+ LOC)"
      - "cortex_brain/tier2/response-templates/role_task_templates.yaml"
      - "40 comprehensive tests"

