notes: |
  **Phase 36 Decision Context (from chat01.txt):**
  
  1. **Header Differentiation**: CORTEX.prompt.md uses 🧠 CORTEX icon,
     cortex-architect.prompt.md uses 🏛️ CORTEX Architect icon.
  
  2. **Template Architecture**: Modular "lego blocks" design enables:
     - Independent testing and maintenance
     - Easy enable/disable per role-task
     - Composable responses (no duplication)
     - Extensible for future blocks
  
  3. **Security-First**: All requests analyzed for P0-P2 threats:
     - P0: Hard gate (blocks execution)
     - P1: Included in challenges
     - P2: Included in synthesis
  
  4. **Multi-Role Adaptation**: Responses auto-adapt based on user role:
     - ENGINEER: Max technical depth, P0-P2 security inline
     - PM: Timeline focus, business metrics
     - BUSINESS: Plain language, impact focus
     - ARCHITECT: Design focus, pattern discussion
     - SECURITY: All security findings with CWE
  
  5. **Legacy Migration**: Consolidate 5 response systems:
     - TurnResponseGenerator → Adapter pattern
     - ResponseFormattingEngine → Consolidate
     - ResponseTemplateEngine → BlockComposer
     - UXOptimizer → Consolidate
     - TurnResponseWithChallenges → ChallengeBlock
  
  6. **CORTEX LENS Confirmation**: LENS remains read-only intelligence
     layer. Operations handled by TDD, Implement, Refactor orchestrators.
     LENS can write to analysis artifacts only (dashboards, cache, reports).

