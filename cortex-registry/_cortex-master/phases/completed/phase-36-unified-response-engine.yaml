  # ========================================================================
  # STAGE 5: INTELLIGENT CODE COMMENTS (2 days)
  # ========================================================================
  stage_6:
    name: "Stage 6: Intelligent Code Comments Generation"
    duration: "2 days"
    priority: "P1"
    depends_on: "stage_1"
    
    goal: |
      Auto-inject engineer-level comments that explain "why", not just "what".
      Enable code synthesis to include explanatory comments.
    
    comment_types:
      COMPLEXITY_COMMENT:
        pattern: "Complex algorithms with non-trivial logic"
        format: "# CORTEX-SYNTHESIS: {algorithm_name} implements {pattern} (Big-O: {complexity})"
        example: "# CORTEX-SYNTHESIS: Fibonacci with memoization (O(n) time, O(n) space)"
      
      SECURITY_COMMENT:
        pattern: "Security-sensitive code (validation, crypto, auth)"
        format: "# CORTEX-SECURITY: {description} - {CWE_ref} - see {function}()"
        example: "# CORTEX-SECURITY: Input validated against CWE-89 (SQL Injection) - see sanitize_input()"
      
      BUSINESS_COMMENT:
        pattern: "Business logic with domain context"
        format: "# CORTEX-BUSINESS: {domain_context} - {business_rule}"
        example: "# CORTEX-BUSINESS: Customer tier determines rate limit (Premium=1000/hr, Standard=100/hr)"
      
      PERFORMANCE_COMMENT:
        pattern: "Potential performance issues or optimizations"
        format: "# CORTEX-PERF: {issue} - {recommendation}"
        example: "# CORTEX-PERF: O(n²) complexity - consider optimization for datasets >10k items"
      
      CONTRACT_COMMENT:
        pattern: "API contracts, type expectations, interface boundaries"
        format: "# CORTEX-CONTRACT: Expected input: {schema} - see {spec_ref}"
        example: "# CORTEX-CONTRACT: Expected: {user_id: str, action: enum} - see API spec v2.1"
    
    tasks:
      - id: "s4.1"
        name: "Create IntelligentCommentGenerator class"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "Detects 5 comment types"
          - "Extracts code context (algorithms, security, domain)"
          - "Generates comments in CORTEX format"
          - "Comments don't violate existing code structure"
        files:
          - "cortex/orchestrators/support/intelligent_comment_generator.py"
        deliverables:
          - "IntelligentCommentGenerator (280 LOC)"
      
      - id: "s4.2"
        name: "Build pattern detection for each comment type"
        owner: "TBD"
        effort: "6 hours"
        acceptance_criteria:
          - "COMPLEXITY_COMMENT: Detects nested loops, recursion, memoization"
          - "SECURITY_COMMENT: Detects input validation, crypto, auth calls"
          - "BUSINESS_COMMENT: Detects domain objects, business rules, enums"
          - "PERFORMANCE_COMMENT: Detects N+1, unbounded loops, large allocations"
          - "CONTRACT_COMMENT: Detects type hints, function signatures, docstrings"
        files:
          - "cortex/orchestrators/support/intelligent_comment_generator.py (updated)"
        deliverables:
          - "5 pattern detectors (400 LOC)"
      
      - id: "s4.3"
        name: "Integrate with code synthesis pipeline"
        owner: "TBD"
        effort: "3 hours"
        acceptance_criteria:
          - "TDDOrchestrator calls IntelligentCommentGenerator"
          - "Comments injected into synthesized code"
          - "Comments configurable (enable/disable per type)"
        files_affected:
          - "cortex/orchestrators/core/tdd_orchestrator.py"
        deliverables:
          - "Integration glue (80 LOC)"
    
    tests:
      - "tests/unit/orchestrators/support/test_intelligent_comment_generator.py (25 tests)"
      - Generator instantiation
      - Each comment type detection (5 tests)
      - Pattern accuracy (8 tests)
      - Comment format validation (5 tests)
      - Integration with TDD (2 tests)
    
    success_criteria: "All 25 tests passing, comments generated for >70% of code"
    deliverables:
      - "cortex/orchestrators/support/intelligent_comment_generator.py (600+ LOC)"
      - "25 comprehensive tests"

  # ========================================================================
  # STAGE 5: TEST QUALITY ANALYZER (2 days)
  # ========================================================================
  stage_5:
    name: "Stage 5: Test Quality Analyzer (FLUFF Detection)"
    duration: "2 days"
    priority: "P1"
    depends_on: "stage_1"
    
    goal: |
      Detect zero-value tests that masquerade as coverage:
      - No assertions
      - All dependencies mocked
      - Trivial assertions (assert True)
      - Copy-paste tests
      - Missing edge cases
    
    fluff_patterns:
      NO_ASSERTIONS:
        detection: "Test has 0 assertions"
        severity: "P0"
        recommendation: "Add assertion for actual vs expected"
      
      MOCK_EVERYTHING:
        detection: ">80% of dependencies mocked"
        severity: "P1"
        recommendation: "Use real fixtures or integration test"
      
      TRIVIAL_ASSERTIONS:
        detection: "Only 'assert True', 'is not None', 'is not []'"
        severity: "P1"
        recommendation: "Assert on actual values, not existence"
      
      COPY_PASTE_TESTS:
        detection: ">90% similarity across test functions"
        severity: "P2"
        recommendation: "Parametrize or create helper function"
      
      MISSING_EDGE_CASES:
        detection: "Happy path only, no error/boundary cases"
        severity: "P2"
        recommendation: "Add tests for: errors, boundaries, edge cases"
      
      UNREACHABLE_CODE:
        detection: "Test doesn't exercise target function"
        severity: "P0"
        recommendation: "Verify test actually calls target"
    
    tasks:
      - id: "s5.1"
        name: "Create TestQualityAnalyzer class"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "AST-based test analysis"
          - "Detects 6 FLUFF patterns"
          - "Calculates 'effective test' score"
          - "Reports missing coverage"
        files:
          - "cortex/orchestrators/support/test_quality_analyzer.py"
