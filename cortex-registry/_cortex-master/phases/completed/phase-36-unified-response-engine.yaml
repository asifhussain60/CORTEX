          - "SecurityFirstAnalysis dataclass (80 LOC)"
          - "CWE pattern registry (150 LOC)"
      
      - id: "s3.2"
        name: "Integrate into ChallengeEngine"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "Auto-trigger on IMPLEMENT, FIX, REFACTOR, AUDIT"
          - "P0 findings block execution"
          - "P1 findings included in challenge"
          - "P2 findings in synthesis"
        files_affected:
          - "cortex/orchestrators/core/challenge_engine.py"
        deliverables:
          - "Enhanced ChallengeEngine (100 LOC added)"
      
      - id: "s3.3"
        name: "Add surrounding context analysis"
        owner: "TBD"
        effort: "3 hours"
        acceptance_criteria:
          - "Find related files in scope"
          - "Scan for similar security issues"
          - "Provide context to developer"
          - "Link to remediation patterns"
        files:
          - "cortex/orchestrators/core/security_first_analyzer.py (updated)"
        deliverables:
          - "SurroundingContextAnalyzer (120 LOC)"
      
      - id: "s3.4"
        name: "Create OWASP Top 10 coverage report"
        owner: "TBD"
        effort: "2 hours"
        acceptance_criteria:
          - "Report which OWASP Top 10 are checked"
          - "Report remediation suggestions"
          - "Include CWE references"
        files:
          - "cortex/orchestrators/core/security_first_analyzer.py (updated)"
        deliverables:
          - "OWASPCoverageReport (80 LOC)"
    
    tests:
      - "tests/unit/orchestrators/core/test_security_first_analyzer.py (35 tests)"
      - P0 detection (5 tests: CWE-94, 89, 22, 78, custom)
      - P1 detection (5 tests)
      - P2 detection (5 tests)
      - Surrounding context finding (4 tests)
      - ChallengeEngine integration (6 tests)
      - Hard gate enforcement (3 tests)
      - OWASP coverage (2 tests)
    
    success_criteria: "All 35 tests passing, P0/P1/P2 classification working, OWASP coverage >70%"
    deliverables:
      - "cortex/orchestrators/core/security_first_analyzer.py (600+ LOC)"
      - "35 comprehensive tests"
      - "OWASP Top 10 coverage matrix"

  # ========================================================================
  # STAGE 4: ACTION-FIRST AUDIT FORMAT (0.5 days)
  # ========================================================================
  stage_4:
    name: "Stage 4: Action-First AUDIT Format"
    duration: "0.5 days"
    priority: "P0"
    depends_on: "stage_2"
    
    goal: |
      Eliminate 3-layer redundancy in AUDIT responses. Replace with action-first
      format optimized for production readiness teams who need:
      - Immediate fix commands at top
      - One-line issue descriptions
      - Health snapshot (not verbose P0/P1/P3 sections)
      - 60% token reduction
      - 15-second scanability
    
    problem_statement: |
      Current AUDIT format has 3-layer redundancy:
      Layer 1: Executive Summary table (status only)
      Layer 2: Section tables P0/P1/P3 (status + brief evidence)
      Layer 3: Detailed subsections (repeats Layer 2 + recommendations)
      
      Example redundancy:
      Table: "Context governance | 🔴 NOT DEPLOYED | governance.db missing"
      Section: "P1-1: Context Governance Not Deployed
               Impact: Token consumption unmonitored
               Evidence: governance.db does not exist"
      
      Result: 40% token waste, 2-minute read time, buried action items
    
    new_format_structure:
      action_table: |
        TOP section with fix commands and immediate actions
        | Priority | Issue | Fix Command | Impact |
      
      health_snapshot: |
        MIDDLE section replacing verbose P0/P1/P3 sections
        | Metric | Status | Score | Evidence |
      
      innovation_recs: |
        BOTTOM section (optional) with future improvements
        Numbered list format, effort/impact indicators
    
    tasks:
      - id: "s4.1"
        name: "Create ActionFirstAuditBlock template block"
        owner: "TBD"
        effort: "2 hours"
        acceptance_criteria:
          - "Inherits from TemplateBlock"
          - "Renders action table (priority, issue, fix, impact)"
          - "Calculates production blocker count"
          - "Estimates total fix time"
        files:
          - "cortex/orchestrators/response/blocks/action_first_audit_block.py"
        deliverables:
          - "ActionFirstAuditBlock (150 LOC)"
      
      - id: "s4.2"
        name: "Create HealthSnapshotBlock template block"
        owner: "TBD"
        effort: "1.5 hours"
        acceptance_criteria:
          - "Replaces verbose P0/P1/P3 sections"
          - "Single table: metric, status, score, evidence"
          - "Calculates overall health score"
          - "One-line evidence citations"
        files:
          - "cortex/orchestrators/response/blocks/health_snapshot_block.py"
        deliverables:
          - "HealthSnapshotBlock (120 LOC)"
      
      - id: "s4.3"
        name: "Update cortex-auditor.md with new format"
        owner: "TBD"
        effort: "1 hour"
        acceptance_criteria:
          - "Replace old 3-layer format with action-first"
          - "Show example outputs"
          - "Document token reduction"
          - "Update execution flow"
        files_affected:
          - ".github/agents/core/cortex-auditor.md"
        deliverables:
          - "Updated agent documentation"
      
      - id: "s4.4"
        name: "Update cortex-architect.prompt.md AUDIT section"
        owner: "TBD"
        effort: "30 minutes"
        acceptance_criteria:
          - "Reference action-first format"
          - "Update example audit output"
          - "Document 15-second scanability goal"
        files_affected:
          - ".github/prompts/cortex-architect.prompt.md"
        deliverables:
          - "Updated prompt documentation"
    
    tests:
      - "tests/unit/orchestrators/response/blocks/test_action_first_audit_block.py (8 tests)"
      - Block instantiation
      - Action table rendering
      - Production blocker count calculation
      - Fix time estimation
      - Priority sorting (P0 → P1 → P2 → P3)
      
      - "tests/unit/orchestrators/response/blocks/test_health_snapshot_block.py (7 tests)"
      - Block instantiation
      - Health snapshot rendering
      - Overall score calculation
      - One-line evidence formatting
      - Category aggregation (Security, Tests, Infrastructure, Cleanup)
    
    success_criteria: |
      - All 15 tests passing
      - 60% token reduction validated (2,000 → 800 tokens)
      - User can identify action items in 15 seconds
      - No redundant information across sections
    
    deliverables:
      - "cortex/orchestrators/response/blocks/action_first_audit_block.py (150 LOC)"
      - "cortex/orchestrators/response/blocks/health_snapshot_block.py (120 LOC)"
      - "15 comprehensive tests"
      - "Updated agent and prompt documentation"
    
    before_after_comparison:
      token_count:
        before: "~2,000 tokens"
        after: "~800 tokens"
        reduction: "60%"
      
      read_time:
        before: "2 minutes"
        after: "15 seconds"
        improvement: "87.5%"
      
      action_visibility:
        before: "Buried at bottom in recommendations section"
