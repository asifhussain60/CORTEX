# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    Create a unified, role-aware, modular response language engine that:
    
    1. **Differentiates Headers** — CORTEX.prompt.md vs cortex-architect.prompt.md
    2. **Enables Modular Templates** — Lego-like blocks for composable responses
    3. **Adds Security-First Analysis** — Proactive P0-P2 threat detection
    4. **Injects Intelligent Comments** — Engineer-level "why" explanations
    5. **Detects FLUFF Tests** — Zero-value test identification
    6. **Surfaces Hidden Issues** — Performance, memory, concurrency problems
    7. **Generates Business Context** — PM/leader-focused summaries
    8. **Adapts to Roles** — ENGINEER, PM, BUSINESS, ARCHITECT, SECURITY
    9. **Migrates Legacy Code** — Consolidate 5 response systems into 1
    10. **Cleans Up Obsolete Code** — Remove redundant implementations
  
  business_impact: |
    - 🎯 **DX Improvement**: Role-specific responses reduce context switching
    - 🔒 **Security Hardening**: Proactive threat detection on every request
    - 🧪 **Quality Assurance**: FLUFF test detection prevents false confidence
    - 📊 **Business Intelligence**: Non-engineers understand technical impact
    - 🏗️ **Maintainability**: Modular blocks simplify template maintenance
    - ⚡ **Performance**: Template caching + block reuse improve response time
  
  expected_outcomes:
    - 14 role-task response templates (vs current scattered implementations)
    - 12 atomic template blocks (composable, reusable)
    - 260+ tests (85% coverage)
    - 0 legacy response implementations remaining
    - 5 MCP tools exposed
    - 40% template code reduction via modular blocks
    - Action-first AUDIT format (60% token reduction)

# ============================================================================
# STAGE BREAKDOWN (10 STAGES, 18.5 DAYS)
# ============================================================================

stages:
  
  # ========================================================================
  # STAGE 1: DUAL HEADER SYSTEM (1 day)
  # ========================================================================
  stage_1:
    name: "Stage 1: Dual Header System"
    duration: "1 day"
    priority: "P0"
    
