  # ========================================================================
  # STAGE 6: HIDDEN ISSUE DETECTOR (2 days)
  # ========================================================================
  stage_6:
    name: "Stage 6: Hidden Issue Detector"
    duration: "2 days"
    priority: "P1"
    depends_on: "stage_1"
    
    goal: |
      Surface issues engineers might not be aware of:
      - Performance (N+1 queries, unbounded loops)
      - Memory (large object retention, circular refs)
      - Concurrency (race conditions, missing locks)
      - Maintainability (god classes, deep nesting)
      - API contracts (breaking changes)
    
    issue_categories:
      PERFORMANCE:
        patterns:
          - "N+1 query pattern: loop + DB query"
          - "Unbounded loops: for/while without break condition"
          - "Full table scans in loops"
          - "Excessive object creation in hot paths"
        detection_method: "AST analysis + dataflow"
        severity: "P1"
      
      MEMORY:
        patterns:
          - "Large object retention in cache"
          - "Circular references (self-reference)"
          - "Accumulator without cleanup"
          - "Global state accumulation"
        detection_method: "AST analysis + semantic analysis"
        severity: "P1"
      
      CONCURRENCY:
        patterns:
          - "Shared mutable state without synchronization"
          - "Missing locks in multi-threaded code"
          - "Race condition in initialization"
          - "Double-checked locking antipattern"
        detection_method: "Pattern matching + semantic analysis"
        severity: "P1"
      
      MAINTAINABILITY:
        patterns:
          - "God classes: >500 LOC single class"
          - "Deep nesting: >5 indent levels"
          - "Multiple responsibilities per function"
          - "Missing documentation for complex logic"
        detection_method: "Metrics + AST analysis"
        severity: "P2"
      
      API_CONTRACTS:
        patterns:
          - "Breaking changes: removed required fields"
          - "Unversioned APIs"
          - "Incompatible type changes"
          - "Changed exception types"
        detection_method: "Signature comparison + semantic"
        severity: "P0"
    
    tasks:
      - id: "s6.1"
        name: "Create HiddenIssueDetector class"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "Detects 5 issue categories"
          - "Analyzes code using AST + semantics"
          - "Returns issue list with suggestions"
          - "Configurable detection sensitivity"
        files:
          - "cortex/orchestrators/support/hidden_issue_detector.py"
        deliverables:
          - "HiddenIssueDetector (250 LOC)"
      
      - id: "s6.2"
        name: "Implement detectors for each category"
        owner: "TBD"
        effort: "6 hours"
        acceptance_criteria:
          - "PERFORMANCE: Detect N+1, unbounded loops"
          - "MEMORY: Detect large retention, circular refs"
          - "CONCURRENCY: Detect race conditions, missing locks"
          - "MAINTAINABILITY: Detect god classes, deep nesting"
          - "API_CONTRACTS: Detect breaking changes"
        files:
          - "cortex/orchestrators/support/hidden_issue_detector.py (updated)"
        deliverables:
          - "5 issue detectors (400 LOC)"
      
      - id: "s6.3"
        name: "Create issue remediation suggester"
        owner: "TBD"
        effort: "2 hours"
        acceptance_criteria:
          - "For each issue, suggest fix pattern"
          - "Link to best practices"
          - "Provide code example"
        files:
          - "cortex/orchestrators/support/hidden_issue_detector.py (updated)"
        deliverables:
          - "RemediationSuggester (100 LOC)"
    
    tests:
      - "tests/unit/orchestrators/support/test_hidden_issue_detector.py (25 tests)"
      - Detector instantiation
      - PERFORMANCE detection (5 tests)
      - MEMORY detection (5 tests)
      - CONCURRENCY detection (5 tests)
      - MAINTAINABILITY detection (4 tests)
      - API_CONTRACTS detection (3 tests)
    
    success_criteria: "All 25 tests passing, issue detection >75% accurate"
    deliverables:
      - "cortex/orchestrators/support/hidden_issue_detector.py (550+ LOC)"
      - "25 comprehensive tests"

