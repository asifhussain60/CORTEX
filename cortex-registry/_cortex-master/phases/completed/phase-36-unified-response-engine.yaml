  # ========================================================================
  # STAGE 2: MODULAR TEMPLATE BLOCKS (3 days)
  # ========================================================================
  stage_2:
    name: "Stage 2: Modular Response Template Blocks"
    duration: "3 days"
    priority: "P0"
    depends_on: "stage_1"
    
    goal: |
      Design and implement 12 atomic template blocks that are:
      - Individually usable (can render standalone)
      - Composable (assemble into complete responses)
      - Removable (disable/enable per role-task combination)
      - Cacheable (block-level caching for performance)
      - Extensible (easy to add new blocks)
    
    architecture: |
      Response Template Engine
      ├── AtomicBlock (base class)
      │   ├── HeaderBlock
      │   ├── SecurityBlock
      │   ├── TestQualityBlock
      │   ├── CodeIssuesBlock
      │   ├── BusinessContextBlock
      │   ├── TDDPhaseBlock
      │   ├── MetricsBlock
      │   ├── RiskBlock
      │   ├── TimelineBlock
      │   ├── VerdictBlock
      │   ├── ChallengeBlock
      │   └── NextStepsBlock
      ├── TemplateBlockRegistry (discovery + management)
      ├── BlockComposer (assembly engine)
      └── BlockCache (caching + TTL management)
    
    tasks:
      - id: "s2.1"
        name: "Design TemplateBlock base class and registry"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "TemplateBlock dataclass with all required fields"
          - "BlockCategory enum (HEADER, ANALYSIS, SYNTHESIS, ACTION)"
          - "BlockRegistry for discovery and management"
          - "Enable/disable mechanism per role-task"
        files:
          - "cortex/orchestrators/response/template_blocks.py (Part 1)"
        deliverables:
          - "TemplateBlock base class (80 LOC)"
          - "BlockRegistry singleton (150 LOC)"
      
      - id: "s2.2"
        name: "Implement 12 atomic template blocks"
        owner: "TBD"
        effort: "12 hours"
        acceptance_criteria:
          - "All 12 blocks implemented and tested"
          - "Each block has pattern, variables, description"
          - "Blocks render independently without dependencies"
          - "Blocks follow consistent interface"
        blocks:
          - "HeaderBlock: Response header with icon, author, orchestrator, scope"
          - "SecurityBlock: P0-P2 security findings table"
          - "TestQualityBlock: FLUFF test detection results"
          - "CodeIssuesBlock: Hidden issues (perf, memory, concurrency)"
          - "BusinessContextBlock: Executive/PM/metrics summaries"
          - "TDDPhaseBlock: RED-GREEN-REFACTOR flow with code"
          - "MetricsBlock: Quality metrics, coverage, complexity"
          - "RiskBlock: Risk assessment matrix"
          - "TimelineBlock: Milestones, dates, dependencies"
          - "VerdictBlock: Final decision, approval gate"
          - "ChallengeBlock: Design challenges, weaknesses"
          - "NextStepsBlock: Recommended actions, decision gates"
        files:
          - "cortex/orchestrators/response/template_blocks.py (Part 2)"
        deliverables:
          - "12 block implementations (800+ LOC)"
      
      - id: "s2.3"
        name: "Build BlockComposer assembly engine"
        owner: "TBD"
        effort: "6 hours"
        acceptance_criteria:
          - "Composer accepts role, task, context"
          - "Selects applicable blocks for role-task"
          - "Assembles blocks in correct order (by order_weight)"
          - "Passes context to each block"
          - "Returns final rendered response"
          - "Handles block dependencies"
        files:
          - "cortex/orchestrators/response/block_composer.py"
        deliverables:
          - "BlockComposer class (300 LOC)"
          - "Template composition pipeline"
      
      - id: "s2.4"
        name: "Build block caching layer"
        owner: "TBD"
        effort: "4 hours"
        acceptance_criteria:
          - "LRU cache with TTL for block renders"
          - "Cache key: block_id + variables_hash"
          - "Cache invalidation on block update"
          - "50% hit rate target"
        files:
          - "cortex/orchestrators/response/template_blocks.py (Part 3)"
        deliverables:
          - "BlockCache implementation (150 LOC)"
    
    tests:
      - "tests/unit/orchestrators/response/test_template_blocks.py (40 tests)"
      - Base class instantiation
      - Registry operations (register, get, list, enable/disable)
      - Each block independent rendering (12 tests)
      - Block composition (8 tests)
      - Caching behavior (4 tests)
      - Cache invalidation (2 tests)
      - Error handling (5 tests)
    
    success_criteria: "All 40 tests passing, 12 blocks operational, 50% cache hit target"
    deliverables:
      - "cortex/orchestrators/response/template_blocks.py (1000+ LOC)"
      - "cortex/orchestrators/response/block_composer.py (300+ LOC)"
      - "40 comprehensive tests"

  # ========================================================================
  # STAGE 3: SECURITY-FIRST ANALYSIS ENHANCEMENT (3 days)
  # ========================================================================
  stage_3:
    name: "Stage 3: Security-First Analysis Enhancement"
    duration: "3 days"
    priority: "P0"
    depends_on: "stage_1"
    
    goal: |
      Add proactive security analysis to ChallengeEngine that:
      - Triggers on EVERY request (IMPLEMENT, FIX, REFACTOR, AUDIT)
      - Classifies threats as P0/P1/P2 (not P3/P4)
      - Provides surrounding context (related files with issues)
      - Blocks P0 threats before execution
      - Includes in challenges for P1/P2
    
    severity_matrix:
      P0_BLOCKERS:
        threats:
          - "CWE-94: Code Injection"
          - "CWE-89: SQL Injection"
          - "CWE-22: Path Traversal"
          - "CWE-78: OS Command Injection"
        action: "HARD GATE - Block until fixed"
      
      P1_WARNINGS:
        threats:
          - "CWE-327: Inadequate Encryption"
          - "CWE-502: Deserialization of Untrusted Data"
          - "Authentication/Authorization gaps"
          - "Session management flaws"
        action: "CHALLENGE - Present as weakness"
      
      P2_ADVISORIES:
        threats:
          - "Input validation gaps"
          - "Error handling (information disclosure)"
          - "Logging sensitive data"
          - "CORS misconfiguration"
        action: "ADVISORY - Include in synthesis"
    
    tasks:
      - id: "s3.1"
        name: "Create SecurityFirstAnalyzer class"
        owner: "TBD"
        effort: "6 hours"
        acceptance_criteria:
          - "Inherits from Analyzer base class"
          - "Detects CWE patterns in code"
          - "Classifies by P0/P1/P2"
          - "Finds surrounding context (related files)"
          - "Returns SecurityFirstAnalysis dataclass"
        files:
          - "cortex/orchestrators/core/security_first_analyzer.py"
        deliverables:
