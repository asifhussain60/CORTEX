# Overview
description: |
  Event-driven communication backbone enabling decoupled orchestrator communication.
  Provides publish-subscribe infrastructure for orchestrator coordination without direct imports.
  Foundation for extensible, testable orchestrator mesh architecture.

# Objectives
objectives:
  - "Enable event-driven orchestrator communication"
  - "Remove direct orchestrator dependencies via event bus"
  - "Support async event handlers and correlation tracking"
  - "Provide event history and replay capabilities"
  - "Implement dead letter queue for failed events"

# Implementation
implementation:
  component: "OrchestratorEventBus"
  module: "cortex.infrastructure.orchestrator_event_bus"
  tier: 3
  priority: 2
  singleton: true
  
  files:
    - path: "cortex/infrastructure/orchestrator_event_bus.py"
      lines_of_code: 304
      purpose: "Event bus implementation"
    
    - path: "tests/infrastructure/test_orchestrator_event_bus.py"
      lines_of_code: 447
      purpose: "Comprehensive test suite"
  
  total_loc: 751

# Features
features:
  - name: "Event Publishing"
    description: "OrchestratorEvent dataclass with type, payload, source, timestamp"
  
  - name: "Event Subscription"
    description: "Subscribe handlers to specific event types with filters"
  
  - name: "Event History"
    description: "Persistent event log with max 1000 entries (configurable)"
  
  - name: "Correlation ID Tracking"
    description: "Track related events across orchestrator boundaries"
  
  - name: "Async Handler Support"
    description: "Non-blocking event processing with concurrent execution"
  
  - name: "Dead Letter Queue"
    description: "Capture failed event processing for debugging"
  
  - name: "Event Replay"
    description: "Replay historical events for recovery scenarios"
  
  - name: "Backward Compatibility"
    description: "No breaking changes to existing orchestrator code"

# Event Types
event_types:
  - "REQUEST_RECEIVED"
  - "INTENT_CLASSIFIED"
  - "PLANNING_REQUIRED"
  - "PLAN_GENERATED"
  - "PLAN_APPROVED"
  - "PHASE_COMPLETE"
  - "PHASE_REVIEW_COMPLETE"
  - "IMPLEMENTATION_COMPLETE"
  - "FINAL_REVIEW_COMPLETE"

