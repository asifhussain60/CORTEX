# ============================================================================
# GRADUATION PATH: JSON → SQLite → PostgreSQL
# ============================================================================

graduation_criteria:
  stage_1_json:
    trigger: "Always (default for new repos)"
    file_format: "dashboard.json"
    size: "~10-15KB"
    load_time: "~5ms"
    capabilities:
      - "Display all tabs"
      - "Array filtering (Array.filter)"
      - "Client-side sorting"
    limitations:
      - "No full-text search"
      - "No SQL aggregation"
      - "Manual cross-repo queries"
    suitable_for:
      - "Small repos (<10K files)"
      - "Low search usage (<5 queries/month)"
      - "Single-repo analysis"
  
  stage_2_sqlite:
    trigger: |
      Automatic graduation when:
        - File count >10,000 OR
        - Search queries >5/month OR
        - User enables "Advanced Search"
    file_format: "dashboard.sqlite (alongside JSON)"
    size: "~200KB"
    load_time: "~200ms (WASM init) + 20ms (query)"
    capabilities:
      - "FTS5 full-text search"
      - "SQL WHERE clauses (indexed)"
      - "Aggregation (GROUP BY, SUM, AVG)"
      - "Joins (cross-table queries)"
    limitations:
      - "Client-side only (no server)"
      - "No concurrent writes"
      - "1.5MB bundle overhead (sql.js)"
    suitable_for:
      - "Large repos (10K-100K files)"
      - "Power users needing search"
      - "Cross-repo aggregation (limited)"
    implementation:
      - "Add SQLiteAdapter (future phase)"
      - "Onboarding generates both JSON + SQLite"
      - "SPA detects user preference or auto-graduates"
  
  stage_3_postgresql:
    trigger: |
      Manual migration when:
        - Repo count >100 OR
        - Multi-user collaboration OR
        - Real-time updates needed OR
        - Vector search for AI features
    database: "PostgreSQL 15+ with pgvector extension"
    capabilities:
      - "Server-side processing"
      - "Concurrent writes"
      - "Vector similarity search"
      - "Row-level security (multi-tenant)"
      - "Materialized views (aggregation cache)"
    suitable_for:
      - "Enterprise scale (100+ repos)"
      - "Multi-team organizations"
      - "AI-powered features"
    implementation:
      - "Add PostgreSQLAdapter (future phase)"
      - "Migrate data via SQL scripts"
      - "Update SPA to fetch from API"

graduation_decision_tree: |
  ```
  New Repo Onboarded
         ↓
  Generate JSON (always)
         ↓
  Check Complexity Gates:
    - File count <10K?
    - Search usage <5/month?
         ↓
    YES → Use JSON only ✅ (95% of cases)
         ↓
    NO → Also generate SQLite
         ↓
  User Preference:
    - Wants speed? → JSON
    - Wants search? → SQLite
         ↓
  Track Usage:
    - Search queries/month
    - Filter actions/month
         ↓
  Re-evaluate Monthly:
    - Upgrade to SQLite if search >5x
    - Downgrade to JSON if search drops
         ↓
  When 100+ Repos:
    - Evaluate PostgreSQL migration
    - Keep JSON for quick prototypes
  ```

