# ============================================================================
# ARCHITECTURE: JSON-FIRST WITH ADAPTER PATTERN
# ============================================================================

data_layer_architecture:
  current_state: "SQLite-only (complex, slow, premature optimization)"
  target_state: "JSON-first with adapter pattern for future graduation"
  
  interfaces:
    dashboard_data_adapter:
      location: "cortex/visualization/dashboard_data_adapter.py"
      purpose: "Abstract data loading (JSON, SQLite, PostgreSQL)"
      methods:
        - "load(repo_slug: str) -> DashboardData"
        - "save(repo_slug: str, data: DashboardData) -> Result"
        - "list_repos() -> List[RepoMetadata]"
        - "search(query: str) -> List[RepoMetadata]"
      
  implementations:
    json_adapter:
      location: "cortex/visualization/adapters/json_adapter.py"
      file_path: "company/dashboards/repos/{slug}/dashboard.json"
      load_time: "~5ms"
      advantages:
        - "Fast: JSON.parse() is native"
        - "Simple: No WASM, no SQL"
        - "Debuggable: cat | jq works"
        - "Versionable: Git-friendly diffs"
      disadvantages:
        - "No search: Array.filter O(n)"
        - "No aggregation: Manual reduce"
        - "No joins: Client-side merging"
      graduation_trigger: "Search usage >5x/month OR repo >10K files"
      
    sqlite_adapter:
      location: "cortex/visualization/adapters/sqlite_adapter.py"
      file_path: "company/dashboards/repos/{slug}/dashboard.sqlite"
      load_time: "~200ms (WASM init) + 20ms (query)"
      status: "FUTURE - Implement when graduation needed"
      advantages:
        - "Search: FTS5 full-text search"
        - "Aggregation: SQL GROUP BY"
        - "Indexing: Fast WHERE clauses"
      disadvantages:
        - "Slow init: 1.5MB WASM download"
        - "Complex: SQL.js debugging"
        - "Migrations: ALTER TABLE for schema changes"
      
    postgresql_adapter:
      location: "cortex/visualization/adapters/postgresql_adapter.py"
      status: "FUTURE - Implement for 100+ repos"
      advantages:
        - "Real-time: Concurrent writes"
        - "Vector search: pgvector extension"
        - "Multi-tenant: Row-level security"

  adapter_selection:
    logic: |
      ```python
      def get_adapter(repo_slug: str, config: Config) -> DashboardDataAdapter:
          # Check user preference
          if config.force_adapter:
              return load_adapter(config.force_adapter)
          
          # Check complexity gates
          metadata = load_metadata(repo_slug)
          
          if metadata.file_count < 10_000 and metadata.search_usage_count < 5:
              return JSONAdapter()  # 95% of cases
          elif metadata.repo_count < 100:
              return SQLiteAdapter()  # Power users
          else:
              return PostgreSQLAdapter()  # Enterprise
      ```

