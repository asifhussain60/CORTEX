location_evaluation:
  current_location:
    path: "company/dashboards/"
    structure: |
      company/dashboards/
      ├── index.html          # Landing page
      ├── registry.json       # Repo tiles
      ├── repos/              # Generated data
      │   ├── cortex/
      │   │   ├── dashboard.json
      │   │   ├── metadata.json
      │   │   └── manifest.json
      │   └── cortex-brain/
      │       └── ...
      └── spa/                # SPA assets
          ├── dashboard.html
          ├── css/
          ├── js/
          └── assets/
    
    issues_with_current:
      - "❌ company/ folder suggests company-specific (not CORTEX core)"
      - "❌ Separated from MCP tools that generate data (cortex/mcp/tools/)"
      - "❌ Not discoverable by MCP tool catalog"
      - "❌ Unclear ownership: CORTEX or company domain?"
      - "❌ Git ignore patterns target company/ (risk of exclusion)"
      - "⚠️ Works but architecturally inconsistent"
  
  proposed_location:
    path: "cortex/visualization/dashboards/"
    rationale: |
      - ✅ cortex/visualization/ already exists for visualization logic
      - ✅ Co-located with DashboardDataAdapter, JSONAdapter, generators
      - ✅ MCP tools in cortex/mcp/tools/ can reference ../visualization/dashboards/
      - ✅ Clear ownership: Core CORTEX feature (not company-specific)
      - ✅ Follows CORTEX folder structure conventions
      - ✅ Easier to expose via MCP (cortex.visualization.dashboards)
    
    structure: |
      cortex/visualization/dashboards/
      ├── spa/                    # SPA frontend
      │   ├── index.html          # Landing page
      │   ├── dashboard.html      # Dashboard SPA
      │   ├── registry.json       # Repo tiles
      │   ├── css/
      │   │   └── theme.css       # Dark glassmorphism
      │   ├── js/
      │   │   ├── app.js          # CortexDashboard class
      │   │   ├── components/     # DataBinder, TabManager, etc.
      │   │   ├── charts/         # ECharts integration
      │   │   └── data/
      │   │       └── JSONDataLayer.js
      │   └── assets/
      │       └── logos/
      ├── data/                   # Generated dashboard data
      │   ├── cortex/
      │   │   ├── dashboard.json
      │   │   ├── metadata.json
      │   │   └── manifest.json
      │   ├── cortex-brain/
      │   └── cortex-lens/
      └── README.md               # Dashboard system overview
    
    mcp_integration:
      - "MCP Tool: cortex_onboard_repository_json"
        output_path: "cortex/visualization/dashboards/data/{slug}/"
      
      - "MCP Tool: cortex_serve_dashboard (new)"
        serves_from: "cortex/visualization/dashboards/spa/"
        url: "http://localhost:8080"
      
      - "MCP Tool: cortex_list_dashboards (new)"
        reads_from: "cortex/visualization/dashboards/data/"
    
    migration_from_company:
      step_1:
        action: "Copy files to new location"
        source: "company/dashboards/"
        target: "cortex/visualization/dashboards/"
        
      step_2:
        action: "Update MCP tools to use new path"
        files:
          - "cortex/mcp/tools/repository_onboarding_json_tool.py"
          - "cortex/orchestrators/support/repository_onboarding_orchestrator.py"
        
      step_3:
        action: "Update SPA paths (if needed)"
        files:
          - "cortex/visualization/dashboards/spa/js/data/JSONDataLayer.js"
        
      step_4:
        action: "Archive old location"
        command: "mv company/dashboards company/.archive/dashboards-legacy"
        
      step_5:
        action: "Add redirect for backward compatibility"
        create: "company/dashboards/README.md"
        content: |
          # MOVED: Dashboard System Relocated
          
          **This folder has been moved to maintain architectural consistency.**
          
          **New Location:** `cortex/visualization/dashboards/`
          
          **Reason:** 
          - Dashboard system is a core CORTEX feature (not company-specific)
          - Co-located with visualization infrastructure
          - Better MCP tool integration
          
          **Migration:**
          - All data migrated automatically
          - MCP tools updated to use new location
          - No action required from users
          
          **Legacy Files:** Archived to `company/.archive/dashboards-legacy/`

  alternative_locations_considered:
    option_1:
      path: "cortex/dashboards/"
      pros:
        - "Shorter path"
        - "Top-level visibility"
      cons:
        - "Mixes static assets with Python packages"
        - "No existing dashboards/ folder convention"
        - "Breaks cortex/{module}/ structure"
      verdict: "❌ Rejected - Breaks conventions"
    
    option_2:
      path: "cortex/mcp/dashboards/"
      pros:
        - "Close to MCP tools"
        - "Clear MCP exposure"
      cons:
        - "cortex/mcp/ is for protocol infrastructure only"
        - "Dashboards are business logic, not protocol"
        - "Mixes concerns"
      verdict: "❌ Rejected - Wrong abstraction level"
    
    option_3:
      path: "cortex/api/dashboards/"
      pros:
        - "Could serve via FastAPI routes"
        - "RESTful API endpoint structure"
      cons:
        - "cortex/api/ is for API definitions, not static assets"
        - "Dashboard is not an API (it's a visualization)"
      verdict: "❌ Rejected - Not an API"
    
    option_4:
      path: "Keep in company/dashboards/"
      pros:
        - "No migration needed"
        - "Works today"
      cons:
        - "Architecturally inconsistent"
        - "Separated from MCP tools"
        - "company/ suggests domain-specific (not core)"
      verdict: "⚠️ Fallback - Only if migration cost too high"

  recommendation:
    decision: "MIGRATE to cortex/visualization/dashboards/"
    confidence: "High (90%)"
    rationale:
      - "Architectural consistency with CORTEX folder structure"
      - "Better MCP integration (clear import paths)"
      - "Visualization is a core CORTEX capability (not company-specific)"
      - "Easier to expose additional MCP tools (serve, list, migrate)"
      - "Follows existing cortex/visualization/ conventions"
    
    implementation_timing:
      when: "Phase 0 (Cleanup) - BEFORE implementing new adapters"
      why: "Easier to move files before creating new dependencies"
      duration: "30 minutes (part of 2-hour cleanup phase)"
    
    backward_compatibility:
