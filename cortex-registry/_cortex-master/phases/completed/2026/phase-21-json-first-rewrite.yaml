      - "JSONAdapter.load() - 100% coverage"
      - "JSONDataGenerator.generate() - 100% coverage"
      - "RepositoryOnboardingOrchestrator.onboard_repository() - 90% coverage"
    test_count: "~80 tests"
    framework: "pytest + pytest-cov"
  
  integration_tests:
    target_coverage: "Key workflows end-to-end"
    critical_paths:
      - "Onboarding → JSON generation → Registry update"
      - "JSON loading → Data binding → Chart rendering"
      - "Error handling: Missing JSON, corrupt JSON, network failure"
    test_count: "~20 tests"
    framework: "pytest"
  
  e2e_tests:
    target_coverage: "User journeys"
    critical_paths:
      - "Homepage → Tile click → Dashboard view"
      - "Dashboard → Tab navigation → Chart interaction"
      - "File protocol vs HTTP protocol detection"
    test_count: "~15 tests"
    framework: "Playwright (JavaScript)"
  
  performance_tests:
    benchmarks:
      - metric: "JSON load time"
        target: "<10ms"
        
      - metric: "First contentful paint"
        target: "<1s"
        
      - metric: "Tab switch latency"
        target: "<100ms"
        
      - metric: "Chart render time"
        target: "<500ms"
    
    test_count: "~8 benchmarks"
    framework: "Playwright + lighthouse"

test_execution:
  ci_pipeline:
    stages:
      - stage: "Unit Tests"
        command: "pytest tests/unit/ -v --cov --cov-report=html"
        fail_fast: true
        
      - stage: "Integration Tests"
        command: "pytest tests/integration/ -v"
        requires: "Unit tests pass"
        
      - stage: "E2E Tests"
        command: "playwright test tests/e2e/"
        requires: "Integration tests pass"
        
      - stage: "Performance Tests"
        command: "playwright test tests/performance/ --reporter=html"
        requires: "E2E tests pass"
    
    coverage_gate: "85% or fail"
    
  local_development:
    watch_mode: "pytest-watch tests/"
    coverage_report: "pytest --cov --cov-report=term-missing"

