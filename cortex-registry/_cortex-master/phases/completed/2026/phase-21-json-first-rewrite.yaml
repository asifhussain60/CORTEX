# ============================================================================
# RISK MITIGATION
# ============================================================================

risks:
  risk_1:
    description: "JSON too slow for large repos"
    likelihood: "Low (org has <10K files per repo)"
    impact: "Medium (user frustration)"
    mitigation:
      - "Profile load times during testing"
      - "Add pagination if needed"
      - "Graduate to SQLite if >10K files"
    fallback: "SQLite adapter already designed"
  
  risk_2:
    description: "Users miss SQLite features (search)"
    likelihood: "Low (usage data shows <5 searches/month)"
    impact: "Low (power users only)"
    mitigation:
      - "Implement client-side Array.filter search"
      - "Add SQLite adapter in Phase 2 (opt-in)"
    fallback: "Users can request SQLite generation"
  
  risk_3:
    description: "Breaking changes from v3.1 → v4.0"
    likelihood: "Medium (existing dashboards use SQLite)"
    impact: "High (dashboards stop working)"
    mitigation:
      - "Provide migration script: SQLite → JSON"
      - "Support both formats during transition"
      - "Clear migration guide in docs"
    fallback: "Preserve SQLite code in .archive for reference"
  
  risk_4:
