# ============================================================================
# SOLUTION DESIGN
# ============================================================================

architecture:
  overview: |
    Introduce 2 new policy components at orchestration layer:
    1. ChatResponsePolicy - Enforces 3-section structure + business language
    2. FileWritePolicy - Blocks markdown reports pre-emptively
    
    Wire BusinessLanguageOrchestrator into MasterOrchestrator response path.
    Configure UnifiedResponseComposer with COMPACT profile by default.
    Suppress tool narration at InteractionOrchestrator level.

  components:
    - name: "ChatResponsePolicy"
      location: "cortex/orchestrators/policies/chat_response_policy.py"
      responsibility: |
        - Enforce EXACTLY 3 sections: What was asked | What's recommended | Next steps
        - Route content through BusinessLanguageOrchestrator for role-inclusive language
        - Suppress tool narration (block patterns: "Let me read", "Perfect!", etc.)
        - Inject ASCII Plan Spine (≤8 lines) when progress required
        - Force single "Next Step: PROCEED" directive (no preference questions)
      interfaces:
        - "validate_response_structure(response: str) -> Tuple[bool, List[str]]"
        - "compress_to_business_language(response: str) -> str"
        - "inject_plan_spine(response: str, phases: List[Phase]) -> str"
        - "enforce_proceed_directive(response: str) -> str"
    
    - name: "FileWritePolicy"
      location: "cortex/orchestrators/policies/file_write_policy.py"
      responsibility: |
        - Intercept all file write operations (create_file, replace_string_in_file)
        - Block markdown writes when intent is reporting/progress/summary/completion
        - Forbidden patterns: **/report*.md, **/summary*.md, **/*completion*.md, etc.
        - Allow markdown only for: docs/ (product correctness), README.md
        - Output inline error guidance when blocked
      interfaces:
        - "is_report_intent(file_path: str, content: str) -> bool"
        - "block_markdown_report(file_path: str, reason: str) -> None"
        - "allow_exception(file_path: str) -> bool"
    
    - name: "MasterOrchestrator Integration"
      location: "cortex/orchestrators/master_orchestrator.py"
      responsibility: |
        - Inject ChatResponsePolicy into response assembly pipeline
        - Configure UnifiedResponseComposer with COMPACT profile default
        - Wire BusinessLanguageOrchestrator for business language translation
        - Apply FileWritePolicy to all file operations
      changes:
        - "Add response_policy: ChatResponsePolicy attribute"
        - "Add file_policy: FileWritePolicy attribute"
        - "Modify _format_response() to apply ChatResponsePolicy"
        - "Modify execute_operation() to check FileWritePolicy"
    
    - name: "InteractionOrchestrator Enhancement"
      location: "cortex/orchestrators/interaction/interaction_orchestrator.py"
      responsibility: |
        - Suppress tool call narration at response composition layer
        - Remove "Let me read...", "Perfect!", "Great!", etc.
        - Block "Which approach do you prefer?" after autonomous trigger
      changes:
        - "Add narration_suppression: bool = True config"
        - "Add autonomous_mode: bool = False state"
        - "Modify _compose_response() to filter narration patterns"

  data_flow:
    execution_path: |
      User Request → MasterOrchestrator
                        ↓
      Execute operation → InteractionOrchestrator (suppress narration)
                        ↓
      Generate response → ChatResponsePolicy.validate_response_structure()
                        ↓
      Business language → BusinessLanguageOrchestrator.compress_to_business_language()
                        ↓
      Format response → UnifiedResponseComposer (COMPACT profile)
                        ↓
      Return to user
    
    file_write_interception: |
      create_file() → FileWritePolicy.is_report_intent()
                        ↓
      If report intent → block_markdown_report() → inline error
      If allowed → proceed with write

