# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================

vision:
  mission: |
    Transform Copilot Chat responses from verbose, technical narration into 
    concise, business-friendly 3-section summaries accessible to ALL roles
    (Business Leaders, Product Owners, Production Owners, Engineers).
    
    **Core Principles:**
    1. EXACTLY 3 sections: What was asked | What's recommended | Next steps
    2. Business language for all roles (via BusinessLanguageOrchestrator)
    3. NO tool call narration ("Let me read...", "Perfect!", etc.)
    4. Single PROCEED directive (no preference questions after "continue autonomously")
    5. Embedded ASCII Plan Spine (≤8 lines) for progress visibility
    6. Aggressive markdown report ban (inline chat only)

  critical_requirement: |
    From chat02.txt: "Update CORTEX so that, during autonomous plan execution 
    in VS Code GitHub Copilot Chat Sessions, Copilot responses:
    1) stay high-signal and concise (no 'in the weeds' narration),
    2) consolidate findings/challenges/recommendations into no more than 3 sections,
    written in easy business language for all roles using LLM Business Language 
    Orchestrator, and
    3) aggressively prevent creation of markdown report files."

business_impact:
  value_drivers:
    - "Executive accessibility: Business leaders can scan responses in <30 seconds"
    - "Token efficiency: 73% reduction in response length (suppress narration)"
    - "Context preservation: Eliminates 'Summarizing conversation history...' events"
    - "Role inclusivity: Engineers, PMs, POs, Business all understand updates"
    - "Governance enforcement: Markdown report ban prevents CORE-002 violations"
  
  roi_calculation:
