# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  - risk: "Business language translation loses technical precision"
    likelihood: "medium"
    impact: "high"
    mitigation: |
      - Keep technical details as short bullets in section 2
      - Preserve critical terms (orchestrator names, file paths)
      - Test with engineers to validate no information loss
    contingency: "Toggle business_language_mode flag per user preference"
  
  - risk: "3-section structure too rigid for complex scenarios"
    likelihood: "low"
    impact: "medium"
    mitigation: |
      - Embed Plan Spine inside section 2 (not separate section)
      - Allow bullets within sections for detail
      - Emergency override: DESIGN_MODE excludes policy
    contingency: "Introduce VERBOSE_MODE flag for deep technical explanations"
  
  - risk: "FileWritePolicy false positives (blocks legitimate docs)"
    likelihood: "medium"
    impact: "medium"
    mitigation: |
      - Whitelist: docs/, README.md, CONTRIBUTING.md
      - Intent detection requires both: filename pattern + content analysis
      - Allow override with explicit user confirmation
    contingency: "Manual bypass: --force-write flag"
  
  - risk: "Performance degradation (policy latency)"
    likelihood: "low"
    impact: "low"
    mitigation: |
      - Lazy initialization of BusinessLanguageOrchestrator
      - Cache business language translations (70% hit rate target)
      - Target: <50ms policy enforcement latency
    contingency: "Disable policies if latency >100ms (fallback mode)"

