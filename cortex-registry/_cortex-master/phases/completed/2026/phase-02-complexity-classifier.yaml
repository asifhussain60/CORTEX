# Overview
description: |
  Intelligent task complexity classification system that analyzes user requests
  and routes them to appropriate orchestrators based on complexity level.
  Determines planning depth requirements (none, lightweight, standard, full, extended)
  and enables smart orchestrator switching without over-planning trivial tasks.

# Objectives
objectives:
  - "Classify task complexity into 5 levels (TRIVIAL to CRITICAL)"
  - "Estimate LOC impact and affected system layers"
  - "Detect security sensitivity and governance requirements"
  - "Determine appropriate planning depth"
  - "Assess risk levels and effort estimation"
  - "Enable automatic orchestrator routing based on complexity"

# Implementation
implementation:
  component: "ComplexityClassifier"
  module: "cortex.orchestrators.core.complexity_classifier"
  class: "ComplexityClassifier"
  tier: 1
  priority: 23
  
  files:
    - path: "cortex/orchestrators/core/complexity_classifier.py"
      lines_of_code: 394
      purpose: "Complexity classification implementation"
    
    - path: "tests/unit/orchestrators/core/test_complexity_classifier.py"
      lines_of_code: 389
      purpose: "Comprehensive test suite (37 tests)"
  
  total_loc: 783

# Classification Levels
complexity_levels:
  - level: "TRIVIAL"
    threshold: "< 0.15"
    planning: "Skip planning entirely"
    example: "Fix typo, update constant"
    orchestrator: "Direct execution"
  
  - level: "SIMPLE"
    threshold: "0.15 - 0.35"
    planning: "Lightweight (file specs only)"
    example: "Add utility function, simple refactor"
    orchestrator: "LightweightPlanner"
  
  - level: "MODERATE"
    threshold: "0.35 - 0.60"
    planning: "Standard (file + function specs)"
    example: "New feature, multi-file change"
    orchestrator: "CodeLevelPlanner"
  
  - level: "COMPLEX"
    threshold: "0.60 - 0.80"
    planning: "Full (contracts + review)"
    example: "Architecture change, cross-layer coordination"
    orchestrator: "CodeLevelPlanner + ReviewOrchestrator"
  
  - level: "CRITICAL"
    threshold: "> 0.80"
    planning: "Extended (full + security review)"
    example: "Security-critical, governance-impacting"
    orchestrator: "Full SDLC pipeline"

# Analysis Dimensions
analysis_dimensions:
  - name: "LOC Impact Estimation"
    description: "Predict lines of code affected by request"
  
  - name: "Layer Detection"
    layers:
      - "infrastructure"
      - "core"
      - "domain"
      - "api"
      - "frontend"
      - "backend"
      - "data"
  
  - name: "Security Sensitivity"
    indicators:
      - "Authentication/authorization changes"
      - "Data encryption modifications"
      - "Secret management updates"
      - "Network boundary changes"
  
  - name: "Governance Impact"
    indicators:
      - "CORE rule modifications"
      - "Policy enforcement changes"
      - "Compliance requirement updates"
  
  - name: "Risk Level Assessment"
    levels: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
  
  - name: "Effort Estimation"
    unit: "hours"
    range: "0.5 - 40 hours"

# Features
