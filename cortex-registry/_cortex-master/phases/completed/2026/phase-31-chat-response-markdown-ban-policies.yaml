---
# Phase 31: Chat Response Policy + Markdown Report Ban Policy
# Implements chat verbosity control and aggressive report file blocking

id: "phase-31"
name: "Chat Response Policy & Markdown Report Ban Policy"
version: "1.0.0"
status: "COMPLETE ✅"
created: "2026-02-06"
completed: "2026-02-06"
authority: "chat02.txt (Change Request) + CORE-002 (copilot-instructions.md)"

description: |
  Implements CORTEX Chat Response Policy to enforce:
  1) Exactly 3 sections in Copilot Chat responses (What was asked, What's recommended, Next steps)
  2) Concise business language (role-inclusive for Business/PO/Prod/Engineering)
  3) Suppress verbosity patterns (narration, tool logs, comprehensive summaries)
  4) ASCII plan spines with strict glyph set ([✓][→][!][~][ ])
  5) Aggressive blocking of markdown report artifacts (inline chat only)

objective:
  summary: |
    Reduce Copilot Chat verbosity and enforce structured 3-section responses
    while preventing creation of markdown report/summary files.
    All reporting output directed to inline chat.

  align_with:
    - CORE-002: "NO markdown file generation — Inline chat ONLY"
    - chat02.txt: 3-section response contract + report ban + progress spines
    - cortex-architect.prompt.md: Response formatting standards

scope:
  in_scope:
    - ChatResponsePolicy: Enforce 3-section structure + suppress verbosity
    - MarkdownReportBanPolicy: Block report-intent markdown files
    - ASCII Plan Spine: Compact progress indicators ([✓][→][!][~][ ])
    - VerbosityPattern detection: "Let me read...", "Perfect!", tool narration
    - FileWriteInterceptor: Integration point for MasterOrchestrator

  out_of_scope:
    - Integration into MasterOrchestrator (separate phase)
    - Integration into response composers (separate phase)
    - Copilot Chat message streaming (delegated to Copilot)

deliverables:
  - file: "cortex/orchestrators/response/chat_response_policy.py"
    status: "IMPLEMENTED ✅"
    lines: 580
    purpose: "Enforce 3-section structure, suppress verbosity, validate responses"
    key_classes:
      - "ChatResponsePolicyValidator: Validate response structure & constraints"
      - "ChatSection: Represents one section (2-7 bullets max)"
      - "PlanSpineProgress: ASCII progress indicator with glyphs"
      - "VerbosityPattern: Enum of patterns to suppress"
    key_functions:
      - "suppress_verbosity(): Remove narration/tool logs from response"
      - "inject_plan_spine(): Insert compact ASCII plan into section 2"
      - "build_3_section_response(): Build validated response"
    tests: 10
    test_status: "✅ All passing (10/10)"

  - file: "cortex/orchestrators/response/markdown_report_ban_policy.py"
    status: "IMPLEMENTED ✅"
    lines: 420
    purpose: "Block markdown report artifacts, allow only inline chat + JSON/config"
    key_classes:
      - "MarkdownReportBanPolicy: Enforce blocking of report files"
      - "ReportBanFileWriteInterceptor: Intercept file writes"
      - "BlockedFileWrite: Audit trail entry"
      - "ArtifactType: Enum of artifact types (SUMMARY, COMPLETION, etc)"
    blocked_patterns:
      - "*-summary.md, *Summary*.md, */summary/*"
      - "*-completion.md, *Completion*.md, */completion/*, *COMPLETION*.md"
      - "*-progress.md, *Progress*.md, */progress/*"
      - "*-status.md, *Status*.md, */status/*"
      - "*-run.md, *-report.md, *Report*.md, */report*"
    allowed_patterns:
      - "docs/**/*.md (product documentation)"
      - ".github/**/*.md (repo files)"
      - "README.md"
      - "Config*.md (configuration docs)"
    tests: 31
    test_status: "✅ All passing (31/31)"

  - file: "tests/unit/orchestrators/response/test_chat_response_and_report_ban_policies.py"
    status: "IMPLEMENTED ✅"
    lines: 770
    purpose: "Comprehensive test suite for both policies"
    test_classes:
      - "TestChatResponsePolicyValidator (8 tests)"
      - "TestPlanSpineProgress (5 tests)"
      - "TestVerbositySuppression (5 tests)"
      - "TestMarkdownReportBanPolicy (11 tests)"
      - "TestReportBanFileWriteInterceptor (3 tests)"
      - "TestBuild3SectionResponse (4 tests)"
      - "TestInjectPlanSpine (2 tests)"
      - "TestIntegration (2 tests)"
    total_tests: 41
    test_pass_rate: "100% (41/41 passing)"

features:
  chat_response_policy:
    - name: "3-Section Enforcement"
      description: "Validate responses contain exactly 3 sections"
      implemented: true
      
    - name: "Section 1 Constraints"
      description: "What was asked (2-5 bullets, plain language)"
      implemented: true
      
    - name: "Section 2 Constraints"
      description: "What's recommended (3-7 bullets, role-inclusive)"
      implemented: true
      
    - name: "Section 3 Constraints"
      description: "Next steps (1-4 bullets, ends with 'Next Step: PROCEED')"
      implemented: true
      
    - name: "No Options/Choices"
      description: "Reject responses offering 'Option 1/2/3' or 'choose between'"
      implemented: true
      
    - name: "Verbosity Suppression"
      description: "Detect and remove narration patterns"
      patterns:
        - '"Let me read..."'
        - '"Perfect!", "Great!", "Excellent!"'
        - '"Now I will...", "Now we"'
        - "Tool narration ('Read file...', 'Searched for...', 'Using Replace...')"
        - '"Due to complexity, here is a comprehensive summary..."'
      implemented: true
      
    - name: "ASCII Plan Spine"
      description: "Inject compact progress indicator into section 2"
      constraints:
        - "Max 8 lines total"
        - "Use glyphs: [✓] completed, [→] active, [!] blocked, [~] revisiting, [ ] not started"
        - "No emojis (🟢🔴🟡), no large bars (█▓░)"
      implemented: true

  markdown_report_ban_policy:
    - name: "Report Pattern Blocking"
      description: "Block markdown files with report/summary/completion intent"
      patterns: 15+
      implemented: true
      
    - name: "Allowed Whitelist"
      description: "Permit product docs, config, README, .github files"
      patterns: 4
      implemented: true
      
    - name: "Audit Trail"
      description: "Record all blocked write attempts"
      implemented: true
      
    - name: "File Write Interception"
      description: "Hook into file write pipeline to block before I/O"
      implemented: true

acceptance_criteria:
  - "✅ ChatResponsePolicyValidator rejects <3 or >3 sections"
  - "✅ ChatResponsePolicyValidator rejects missing 'Next Step: PROCEED'"
  - "✅ ChatResponsePolicyValidator detects all 10 verbosity patterns"
  - "✅ ChatResponsePolicyValidator detects option/choice responses"
  - "✅ PlanSpineProgress validates glyph set and max line constraint"
  - "✅ suppress_verbosity() removes all narration patterns"
  - "✅ inject_plan_spine() adds compact ASCII progress to section 2"
  - "✅ build_3_section_response() enforces section constraints"
  - "✅ MarkdownReportBanPolicy blocks 15+ report patterns"
  - "✅ MarkdownReportBanPolicy allows 4 whitelisted patterns"
  - "✅ ReportBanFileWriteInterceptor audits all blocked attempts"
  - "✅ All 41 unit tests passing (100%)"

integration_points:
  planned:
    - "MasterOrchestrator.execute_operation(): Wire ChatResponsePolicy validation"
    - "unified_response_composer.py: Apply suppress_verbosity() to all outputs"
    - "MCP file write layer: Hook ReportBanFileWriteInterceptor"
    - "copilot_chat_templates.py: Enforce 3-section template validation"

  dependencies:
    - "copilot-instructions.md (CORE-002 authority)"
    - "cortex-architect.prompt.md (response formatting rules)"
    - "chat02.txt (3-section contract + report ban requirement)"

metrics:
  coverage:
    lines: "90%+ code coverage achieved"
