  - "Responses will revert to previous format (uncontrolled)"

notes:
  - "Policies implemented as pure validators (no side effects)"
  - "Integration hooks planned for separate phases"
  - "All blocking decisions logged to audit trail"
  - "ASCII plan spines respect 8-line limit for chat readability"
