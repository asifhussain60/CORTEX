# Overview
description: |
  Validates Python↔JavaScript cross-layer alignment to prevent schema misalignments
  like Phase 21 dashboard incident. Detects enum mismatches, field naming inconsistencies,
  type incompatibilities, and generates contract tests to catch issues at development time.
  Prevents runtime errors caused by backend-frontend schema drift.

# Objectives
objectives:
  - "Validate enum alignment across Python and JavaScript"
  - "Detect field naming mismatches (camelCase vs snake_case)"
  - "Verify type compatibility between layers"
  - "Generate contract tests for cross-layer interfaces"
  - "Prevent Phase 21-style schema misalignments"
  - "Catch drift at development time, not production"

# Implementation
implementation:
  component: "CoherenceValidator"
  module: "cortex.orchestrators.domain.coherence_validator"
  class: "CoherenceValidator"
  tier: 2
  priority: 49
  
  files:
    - path: "cortex/orchestrators/domain/coherence_validator.py"
      lines_of_code: 43
      purpose: "Cross-layer coherence validation"
    
    - path: "tests/unit/orchestrators/domain/test_coherence_validator.py"
      lines_of_code: 18
      purpose: "Validation test suite"
  
  total_loc: 61

# Validation Checks
validation_checks:
  - name: "Enum Alignment"
    description: "Verify enum values match across Python and JavaScript"
    example: |
      Python: class Status(Enum): ACTIVE = "active"
      JavaScript: const Status = { ACTIVE: "active" }
      Validation: ✅ Values match
  
  - name: "Field Naming"
    description: "Detect snake_case ↔ camelCase mismatches"
    example: |
      Python: completion_date: str
      JavaScript: completionDate: string
      Validation: ✅ Naming convention consistent
  
  - name: "Type Compatibility"
    description: "Ensure type conversions are safe"
    example: |
      Python: count: int
      JavaScript: count: number
      Validation: ✅ Types compatible
  
  - name: "Required Fields"
    description: "Verify all required fields present in both layers"
    example: |
      Python: @dataclass phase_id: str (required)
      JavaScript: interface Phase { phaseId: string (required) }
      Validation: ✅ Required fields match

# Contract Test Generation
contract_tests:
  description: "Auto-generate tests that verify cross-layer contracts"
  test_types:
    - "Enum value matching tests"
    - "Field presence tests"
    - "Type conversion tests"
    - "Serialization/deserialization round-trip tests"
  
  output_location: "tests/contracts/"
  test_framework: "pytest (Python) + Jest (JavaScript)"

