architecture_diagram: |
  User Request
       ↓
  Environment Detection (MCP/Copilot/Dev)
       ↓
  Tool Adapter Selection
       ↓
  MasterOrchestrator Gateway (MANDATORY - no bypass)
       ↓
  LENS Protocol (Language→Examination→Navigation→Synthesis)
       ↓
  Mandatory Checkpoints
   ├─ Challenge Generation (DESIGN mode)
   ├─ Pre-Execution Discovery (IMPLEMENT intent)
   ├─ DoR Approval Gate (code operations)
   └─ Exit Gate (context loading)
       ↓
  Orchestrator Selection (from wiring.yaml)
       ↓
  Tool Execution (via adapter)
       ↓
  Response (inline, no markdown files)

key_design_decisions:
  environment_detection:
    rationale: "Prompts must work in both production (MCP) and development (Copilot) environments"
    approach: "Runtime detection with tool adapter pattern"
    fallback: "Graceful degradation to VS Code tools when MCP unavailable"

  mandatory_gateway:
    rationale: "Prevent governance bypass through direct tool calls"
    approach: "Single entry point (MasterOrchestratorGateway) enforced in all prompts/agents"
    enforcement: "Prompts explicitly state 'ALL operations through gateway'"

  non_bypassable_checkpoints:
    rationale: "Governance specifications from commits must be enforced, not optional"
    approach: "Checkpoint classes with is_bypassable() always returning False"
    coverage: "Challenge (DESIGN), Discovery (IMPLEMENT), DoR (code ops), Exit Gate (context)"

  lens_integration:
    rationale: "Uniform orchestration protocol regardless of environment"
    approach: "LENS protocol (L→E→N→S) applied before orchestrator selection"
    benefit: "Consistent governance, complete audit trails, testable flow"

