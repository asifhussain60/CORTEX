  - "✅ CORE-050 rule enforced at P0 level"
  - "✅ EnvironmentIntegrityAgent operational (8th agent)"
  - "✅ MCP unavailable → IMPLEMENT intents BLOCKED with clear message"
  - "✅ MCP unavailable → ANALYZE intents ALLOWED (read-only)"
  - "✅ Direct file tools blocked for IMPLEMENT/FIX/REFACTOR (*.py files)"
  - "✅ Session quality scorecard: A+ (95%+ CORE compliance)"
  - "✅ Zero quality degradation incidents in test scenarios"
  - "✅ Documentation complete and accurate"

notes: |
  **Key Principle:** Fix infrastructure, don't bypass it.
  
  **Before Phase 51:** CORTEX degrades quality when infra missing
  **After Phase 51:** CORTEX blocks and guides user to fix infra properly
  
  **Example Behavior Change:**
  
  BEFORE:
  User: "implement feature X"
  CORTEX: "MCP unavailable, trying direct file creation..."
          "Tests optional in basic mode..."
          "✅ Done (quality compromised)"
  
  AFTER:
  User: "implement feature X"
  CORTEX: "❌ BLOCKED: MCP Server not running
           
           Required: python -m cortex.mcp.server
           
           CORTEX operates at ONE quality level: Production.
           No shortcuts. No exceptions."
  
  User: [starts MCP server]
  CORTEX: "✅ MCP available. Proceeding with TDD implementation..."
          [Proper TDD via cortex_process_request]
          "✅ Done (100% CORE compliance)"
