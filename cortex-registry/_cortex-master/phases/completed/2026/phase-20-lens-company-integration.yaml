# =============================================================================

performance:
  latency:
    cache_hit: "<10ms"
    cache_miss_git_only: "<100ms"
    cache_miss_full_analysis: "<500ms"
    cache_miss_with_company: "<200ms (company knowledge cached separately)"
    
  memory:
    cache_size_limit: "100MB"
    max_cache_entries: 100
    eviction_policy: "LRU + TTL expiration"
    
  throughput:
    concurrent_requests: "10 requests/second"
    cache_hit_rate_target: ">80% after warmup"
    
  benchmarks:
    - "Measure latency for typical Python file (500 LOC)"
    - "Measure latency for large file (5000 LOC)"
    - "Measure cache hit rate over 100 requests"
    - "Measure memory usage with 100 cached entries"

# =============================================================================
# WIRING UPDATES
# =============================================================================

wiring:
  orchestrator_registry:
    - name: "LENSContextProvider"
      type: "Service"
      path: "cortex.orchestrators.core.lens_context_provider"
      singleton: true
      
  mcp_tools:
    - name: "cortex_lens_analyze"
      enhancement: "Add company_name parameter"
      backward_compatible: true
      
  configuration:
    - file: "cortex/config/lens_config.yaml"
      new_file: true
      contents:
        cache:
          enabled: true
          ttl_seconds: 300  # 5 minutes
          max_entries: 100
          max_size_mb: 100
        activation:
          intents: ["IMPLEMENT", "FIX", "REFACTOR", "ANALYZE"]
          require_file_path: true
        company_knowledge:
          enabled: true
          domains_path: "company/domains"
        performance:
          timeout_ms: 500
          enable_metrics: true

