# =============================================================================
# EXECUTIVE SUMMARY
# =============================================================================

executive_summary: |
  Integrate CORTEX LENS with company domain knowledge to provide unified,
  context-aware code intelligence that respects corporate policies and
  compliance requirements.
  
  **Problem:**
  - LENS provides git/AST/comment intelligence but lacks company context
  - IntentRouter has LENS integration but no company domain awareness
  - No automatic compliance violation detection during code analysis
  - Company knowledge fragmented across multiple access points
  
  **Solution:**
  - LENSContextProvider service for selective, cached LENS analysis
  - Company knowledge integration via CompanyKnowledgeLoader
  - Intent-based activation (IMPLEMENT/FIX/REFACTOR/ANALYZE only)
  - 5-minute cache with fail-safe fallback
  - Real-time compliance violation flagging
  
  **Impact:**
  - ✅ Single source of truth for all code intelligence
  - ✅ Company policies automatically enforced during analysis
  - ✅ PCI-DSS/HIPAA/SOC2 violations caught before implementation
  - ✅ <200ms latency with caching (down from 500ms)
  - ✅ Zero-config for existing flows (backward compatible)

# =============================================================================
# ARCHITECTURE
# =============================================================================

architecture:
  components:
    - name: "LENSContextProvider"
      type: "Service"
      location: "cortex/orchestrators/core/lens_context_provider.py"
      responsibility: "Selective LENS intelligence injection with company knowledge"
      
    - name: "CompanyKnowledgeIntegration"
      type: "Enhancement"
      location: "cortex/lens/orchestrator.py"
      responsibility: "Load and merge company domains into LENS context"
      
    - name: "IntentRouter Enhancement"
      type: "Integration"
      location: "cortex/orchestrators/core/intent_router.py"
      responsibility: "Auto-fetch LENS context when needed"
      
    - name: "MasterOrchestrator Integration"
      type: "Wiring"
      location: "cortex/orchestrators/core/master_orchestrator.py"
      responsibility: "Stage 2 LENS context injection"

  integration_points:
    master_orchestrator:
      stage: "Stage 2 (Post Intent Classification)"
      trigger: "After IntentRouter.classify_intent()"
      action: "Fetch LENS context if intent in [IMPLEMENT, FIX, REFACTOR, ANALYZE]"
      cache_strategy: "5-minute TTL per (file_path, company_name)"
      
    intent_router:
      enhancement: "_enhance_with_lens() auto-fetch"
      current_state: "Accepts optional lens_context parameter"
      new_behavior: "Auto-fetch from LENSContextProvider if not provided"
      backward_compatible: true
      
    tdd_orchestrator:
      enhancement: "Auto-inject LENS context for IMPLEMENT intents"
      current_state: "Supports lens_context in parameters"
      new_behavior: "Auto-fetch company knowledge for test generation"
      
    lens_orchestrator:
      enhancement: "Company knowledge integration"
      new_method: "analyze_with_company_knowledge()"
      output_format: "Extended LENSContext with company_knowledge field"

  data_flow: |
    1. User submits request → MasterOrchestrator
    2. Stage 1: Comprehension (InteractionOrchestrator)
    3. Stage 2: Intent Classification (IntentRouter)
       ↓
    4. IF intent IN [IMPLEMENT, FIX, REFACTOR, ANALYZE]
       AND file_path provided in context
       AND lens_enabled != False
       THEN:
         a. LENSContextProvider.get_context(file_path, company_name)
         b. Check cache (5-minute TTL)
         c. IF cache miss THEN:
            - LENSOrchestrator.analyze_file(file_path)
            - CompanyKnowledgeLoader.get_merged_knowledge(domain)
            - CompanyKnowledgeLoader.detect_compliance_standards(code)
            - Merge into unified LENSContext
            - Cache result
         d. Return cached/fresh context
       ↓
    5. IntentRouter._enhance_with_lens(lens_context)
       - Apply confidence boost based on evidence
       - Flag compliance violations
       - Add company rule citations
       ↓
    6. Stage 3: Governance validation
    7. Stage 4: Execution with company-aware context

# =============================================================================
# LENS CONTEXT STRUCTURE (ENHANCED)
# =============================================================================

lens_context_structure:
  existing_fields:
    git_analysis:
      description: "Git commit history, change patterns, hotspots"
      source: "GitHistoryAnalyzer"
      
    ast_analysis:
      description: "AST complexity, functions, classes, dead code"
      source: "ASTAnalyzer"
      
    comment_analysis:
      description: "TODOs, FIXMEs, docstrings"
      source: "CommentExtractor"
      
    _metadata:
      description: "Analysis timing, cache hits"
      source: "LENSOrchestrator"
  
  new_fields:
    company_knowledge:
      description: "Company-specific rules, patterns, constraints"
      source: "CompanyKnowledgeLoader"
      structure:
        domains:
          - name: "string (e.g., FINANCIAL-SERVICES)"
            rules: "array of company-specific rules"
            patterns: "array of company-specific patterns"
            precedence: "OVERRIDE | MERGE"
            
    compliance_flags:
      description: "Auto-detected compliance violations"
      source: "CompanyKnowledgeLoader.detect_compliance_standards()"
      structure:
        detected_standards:
          - standard_id: "string (e.g., PCI-DSS-3.2.1)"
            confidence: "float (0.0-1.0)"
            violations: "array of detected violations"
            file_locations: "array of line numbers"
            
    knowledge_precedence:
      description: "Which knowledge source was used for each rule"
      source: "LENSContextProvider"
      structure:
        company_overrides: "int (count of company rules applied)"
        cortex_base: "int (count of CORTEX rules used)"
        compliance_standards: "array of standard IDs applied"

