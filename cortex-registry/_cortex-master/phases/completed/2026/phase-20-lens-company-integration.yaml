# =============================================================================
# SECURITY IMPLICATIONS
# =============================================================================

security:
  input_validation:
    file_path:
      - "Sanitize file paths to prevent path traversal"
      - "Validate against workspace boundaries"
      - "Reject paths outside project root"
      
    company_name:
      - "Alphanumeric + hyphen/underscore only"
      - "Max 50 characters"
      - "No directory traversal sequences"
      
  secrets_management:
    - "No secrets in LENS context"
    - "Company knowledge loaded from local filesystem only"
    - "No network calls to external services"
    
  rate_limiting:
    - "Cache prevents repeated analysis abuse"
    - "Max 100 cache entries (memory limit)"
    - "Automatic eviction on TTL expiration"
    
  error_handling:
    - "No sensitive info in error messages"
    - "Fail-safe: Continue without LENS if unavailable"
    - "Audit trail logs all LENS invocations"

# =============================================================================
# EDGE CASES
# =============================================================================

edge_cases:
  file_not_in_git:
    scenario: "File not in git repository"
    behavior: "Skip git analysis, continue with AST/comments"
    test: "test_lens_context_provider_non_git_file"
    
  binary_file:
    scenario: "Binary file (e.g., .png, .pdf)"
    behavior: "Skip AST analysis, return minimal context"
    test: "test_lens_context_provider_binary_file"
    
  lens_service_down:
    scenario: "LENS service unavailable"
    behavior: "Log warning, continue without LENS context"
    test: "test_lens_context_provider_failsafe"
    
  cache_stale:
    scenario: "File modified after cache entry"
    behavior: "Invalidate cache, refresh analysis"
    test: "test_cache_invalidation_on_modification"
    
  multiple_files:
    scenario: "Request spans multiple files"
    behavior: "Batch analysis (future enhancement)"
    test: "test_lens_context_provider_batch_analysis (skip for now)"
    
  no_company_set:
    scenario: "Company name not configured"
    behavior: "Load CORTEX base knowledge only"
    test: "test_lens_context_no_company"
    
  conflicting_rules:
    scenario: "Company rule conflicts with CORTEX base"
    behavior: "Company rule takes precedence (override)"
    test: "test_knowledge_precedence_conflict"

