# PHASE 20.5: Knowledge Synthesis into MasterOrchestrator
# Authority: AC-KNOWLEDGE-SYNTHESIS-001
# Version: 1.0
# Date: 2026-02-02
# Status: APPROVED
# Dependency: PHASE-20 (LENS + Company Knowledge)

metadata:
  phase_id: "PHASE-20.5"
  title: "Knowledge Synthesis into MasterOrchestrator"
  authority: "AC-KNOWLEDGE-SYNTHESIS-001"
  version: "1.0"
  status: "APPROVED"
  created: "2026-02-02"
  depends_on: "PHASE-20"
  approval:
    approved_by: "Asif Hussain"
    approved_date: "2026-02-02"
    approval_context: "Active knowledge synthesis for engineer decision support"

# =============================================================================
# EXECUTIVE SUMMARY
# =============================================================================

executive_summary: |
  Wire CORTEX best practices (45+ YAMLs) and company domain knowledge into
  MasterOrchestrator for active synthesis during decision-making.
  
  **Problem:**
  - KnowledgeRepository exists but underutilized (passive access only)
  - 45+ best practices YAMLs loaded but not applied during execution
  - Engineers get no proactive guidance during implementation
  - Knowledge checked AFTER execution (violations caught too late)
  - LENS and Knowledge operate in silos (no unified intelligence)
  
  **Solution:**
  - Active knowledge synthesis at Stage 2 (Intent Classification)
  - KnowledgeSynthesisEngine integration (already implemented)
  - Unified Intelligence Context (LENS + Company + CORTEX knowledge)
  - Smart citations in routing decisions (cite specific rules)
  - Violation prevention (not detection) - catch issues early
  
  **Impact:**
  - ✅ Engineers get proactive guidance during planning
  - ✅ Best practices automatically applied (45+ YAMLs active)
  - ✅ Company rules cited in routing decisions
  - ✅ Violations prevented at Stage 2 (not caught at Stage 4)
  - ✅ Single unified intelligence context (no silos)
  - ✅ Pattern learning (track which rules violated most)

# =============================================================================
# ARCHITECTURE ENHANCEMENT
# =============================================================================

architecture:
  enhancement_to_phase_20:
    description: "Phase 20 adds company knowledge to LENS. Phase 20.5 adds CORTEX knowledge synthesis."
    
    phase_20_deliverable:
      - "LENSContextProvider with company domain knowledge"
      - "Compliance auto-detection"
      - "5-minute cache"
      
    phase_20_5_addition:
      - "KnowledgeSynthesisEngine integration"
      - "Active best practices synthesis"
      - "Rule citation in routing decisions"
      - "Early violation prevention"

  unified_intelligence_context:
    description: "Single context object combining all intelligence sources"
    structure:
      lens_intelligence:
        git_analysis: "Change patterns, hotspots, commit history"
        ast_analysis: "Complexity, functions, classes, dead code"
        comment_analysis: "TODOs, FIXMEs, docstrings"
        
      company_knowledge:
        domain_rules: "Company-specific rules from company/domains/"
        compliance_standards: "PCI-DSS, HIPAA, SOC2 detection"
        precedence: "OVERRIDE (company > CORTEX)"
        
      cortex_knowledge:
        best_practices: "45+ YAMLs from cortex_brain/tier3/knowledge/"
        applicable_patterns: "Patterns matching current intent"
        anti_patterns: "Anti-patterns to avoid"
        synthesis_metadata: "Which rules applied, conflicts resolved"
        
      synthesis_result:
        merged_rules: "Precedence-resolved final ruleset"
        citations: "Rule IDs cited in decision"
        violations: "Rules violated (if any)"
        guidance: "Proactive suggestions for engineer"

  integration_points:
    master_orchestrator_stage_2:
      timing: "After intent classification, before governance"
      current_flow: |
        1. Intent classification (IntentRouter)
        2. Governance validation
        3. Execution
        
      enhanced_flow: |
        1. Intent classification (IntentRouter)
        2. Knowledge synthesis (NEW)
           ├─ Load LENS context (Phase 20)
           ├─ Load company knowledge (Phase 20)
           ├─ Load CORTEX best practices (NEW)
           └─ Synthesize via KnowledgeSynthesisEngine
        3. Enhanced routing decision
           ├─ Cite applicable rules
           ├─ Flag violations early
           └─ Provide proactive guidance
        4. Governance validation (with synthesized knowledge)
        5. Execution (with full context)
        
    knowledge_synthesis_engine:
      status: "Already implemented (AC-HYBRID-KNOWLEDGE-005)"
      location: "cortex/brain/knowledge/knowledge_synthesis_engine.py"
      current_usage: "Passive (called explicitly)"
      enhanced_usage: "Active (auto-invoked at Stage 2)"
      
    intent_router_enhancement:
      current: "Accepts optional lens_context"
      enhanced: "Accepts unified_intelligence_context with synthesized knowledge"
      benefit: "Routing decisions cite specific rules from all sources"

# =============================================================================
# DATA FLOW
# =============================================================================

data_flow:
  stage_1_comprehension:
    input: "User request"
    output: "Parsed intent, context"
    knowledge_involvement: "None (understanding phase)"
    
  stage_2_intent_classification:
    input: "Parsed request + context"
    
    step_1_classify:
      action: "IntentRouter.classify_intent()"
      output: "IntentType (IMPLEMENT/FIX/REFACTOR/etc)"
      
    step_2_fetch_lens:
      action: "LENSContextProvider.get_context() [Phase 20]"
      output: "LENS context + company knowledge"
      cache: "5-minute TTL"
      
    step_3_fetch_cortex_knowledge:
      action: "KnowledgeRepository.get_relevant_knowledge() [NEW]"
      input: "Intent type, domain, keywords from request"
      output: "Applicable best practices from 45+ YAMLs"
      cache: "Repository-level cache (already exists)"
      
    step_4_synthesize:
      action: "KnowledgeSynthesisEngine.synthesize() [NEW]"
      inputs:
        - "LENS context (git, AST, comments)"
        - "Company knowledge (domains, compliance)"
        - "CORTEX knowledge (best practices, patterns)"
        - "Intent type"
        - "Request context"
      output: "UnifiedIntelligenceContext"
      precedence:
        - "Company rules (highest)"
        - "CORTEX best practices (medium)"
        - "LENS evidence (informational)"
        
    step_5_enhanced_routing:
      action: "IntentRouter._enhance_with_intelligence()"
      input: "UnifiedIntelligenceContext"
      output: "RoutingDecision with rule citations"
      enhancements:
        - "Confidence boost from knowledge match"
        - "Rule citations (e.g., 'SECURITY-042: Use HTTPS')"
        - "Violation flags (e.g., 'Bare except detected - CORE-013')"
        - "Proactive guidance (e.g., 'Consider using Argon2id for passwords')"
        
    output: "Enhanced RoutingDecision + UnifiedIntelligenceContext"
    
  stage_3_governance:
    input: "Enhanced RoutingDecision + UnifiedIntelligenceContext"
    enhancement: "Governance rules already know violations from Stage 2"
    action: "Validate against synthesized knowledge (not from scratch)"
    benefit: "Faster validation, no duplicate checks"
    
  stage_4_execution:
    input: "UnifiedIntelligenceContext"
    enhancement: "TDDOrchestrator receives full knowledge context"
    benefit: "Test generation aware of best practices and company rules"

# =============================================================================
# UNIFIED INTELLIGENCE CONTEXT STRUCTURE
# =============================================================================

unified_intelligence_context:
  structure: |
    @dataclass
    class UnifiedIntelligenceContext:
        """Single source of truth for all intelligence."""
        
        # LENS intelligence (Phase 20)
        lens: LENSContext
        
        # Company knowledge (Phase 20)
        company: CompanyKnowledge
        
        # CORTEX best practices (Phase 20.5 NEW)
        cortex_knowledge: CORTEXKnowledge
        
        # Synthesis result (Phase 20.5 NEW)
        synthesis: SynthesisResult
        
        # Metadata
        metadata: Dict[str, Any]
  
  lens_context:
    git_analysis: "GitHistoryAnalyzer output"
    ast_analysis: "ASTAnalyzer output"
    comment_analysis: "CommentExtractor output"
    
  company_knowledge:
    domains: "List[DomainKnowledge]"
    compliance_standards: "List[ComplianceStandard]"
    rules: "List[CompanyRule]"
    precedence: "OVERRIDE"
    
  cortex_knowledge:
    applicable_practices: "List[BestPractice]"
    patterns: "List[Pattern]"
    anti_patterns: "List[AntiPattern]"
    domains_loaded: "List[str] (e.g., SECURITY, ARCHITECTURE)"
    
  synthesis_result:
    merged_rules: "List[MergedRule]"
    citations: "List[Citation]"
    violations: "List[Violation]"
    guidance: "List[ProactiveGuidance]"
    conflicts_resolved: "int"
    precedence_applied: "Dict[str, str]"

# =============================================================================
# EXAMPLE: KNOWLEDGE SYNTHESIS IN ACTION
# =============================================================================

example_scenario:
  user_request: "Implement user authentication with password storage"
  
  stage_1_comprehension:
    parsed_intent: "IMPLEMENT authentication feature"
    context:
      domain: "SECURITY"
      keywords: ["authentication", "password", "storage"]
      
  stage_2_intelligence_gathering:
    lens_context:
      git_analysis:
        recent_changes: "security/auth.py modified 2 days ago"
        hotspots: ["authentication module"]
        
      ast_analysis:
        complexity: 15  # High complexity
        functions: ["login()", "hash_password()"]
        
      comment_analysis:
        todos: ["TODO: Implement 2FA"]
        fixmes: []
        
    company_knowledge:
      domain_rules:
        - id: "ACME-SECURITY-001"
          rule: "All passwords MUST use Argon2id (company policy)"
          precedence: "OVERRIDE"
          
      compliance_standards:
        - standard: "PCI-DSS-3.2.1"
          requirement: "Strong cryptography for password storage"
          confidence: 0.92
          
    cortex_knowledge:
      best_practices:
        - id: "SECURITY-042"
          title: "Password Hashing Best Practices"
          content: "Use bcrypt or Argon2id with salt"
          source: "cortex_brain/tier3/knowledge/SECURITY/password-security.yaml"
          
        - id: "ARCHITECTURE-023"
          title: "Authentication Pattern"
          content: "Use JWT tokens with refresh mechanism"
          source: "cortex_brain/tier3/knowledge/ARCHITECTURE/auth-patterns.yaml"
          
      anti_patterns:
        - id: "SECURITY-ANTI-001"
          title: "Plain Text Passwords"
          content: "NEVER store passwords in plain text"
          
  synthesis:
    merged_rules:
      - id: "MERGED-001"
        rule: "Use Argon2id for password hashing"
        sources:
          - "ACME-SECURITY-001 (company - OVERRIDE)"
          - "SECURITY-042 (CORTEX - bcrypt mentioned but overridden)"
        final_rule: "Argon2id (company precedence)"
        
    citations:
      - "ACME-SECURITY-001: Company policy requires Argon2id"
      - "SECURITY-042: CORTEX recommends bcrypt/Argon2id"
      - "PCI-DSS-3.2.1: Strong cryptography required"
      - "ARCHITECTURE-023: Use JWT with refresh tokens"
      
    violations:
      - type: "POTENTIAL"
        message: "No 2FA implementation detected (TODO exists)"
        severity: "MEDIUM"
        rule_id: "ACME-SECURITY-002"
        
    guidance:
      - "✅ Use Argon2id for password hashing (company policy)"
      - "✅ Implement JWT tokens with refresh mechanism"
      - "⚠️  Consider implementing 2FA (TODO already exists)"
      - "✅ PCI-DSS compliant approach detected"
      
  enhanced_routing_decision:
    intent_type: "IMPLEMENT"
    target_handler: "TDDOrchestrator"
    confidence_score: 0.92  # High confidence (knowledge + LENS align)
    reasoning: |
      Intent: IMPLEMENT authentication
      Knowledge Match: 4 applicable rules found
      Company Policy: Argon2id required (OVERRIDE)
      Compliance: PCI-DSS applicable (92% confidence)
      LENS Evidence: Recent auth.py changes, high complexity
      Guidance: 3 proactive suggestions provided
    citations:
      - "ACME-SECURITY-001"
      - "SECURITY-042"
      - "ARCHITECTURE-023"
      - "PCI-DSS-3.2.1"
    metadata:
      knowledge_sources: 3  # LENS, Company, CORTEX
      rules_applied: 4
      violations_prevented: 1
      guidance_items: 3

