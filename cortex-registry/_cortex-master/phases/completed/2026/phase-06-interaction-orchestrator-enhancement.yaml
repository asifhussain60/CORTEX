# Overview
description: |
  Enhances InteractionOrchestrator with event subscription and planning integration.
  Enables multi-layer coordination by subscribing to OrchestratorEventBus events
  and integrating with CodeLevelPlanner for intelligent request handling. Closes
  the loop between user interaction, complexity classification, planning, and execution.

# Objectives
objectives:
  - "Subscribe InteractionOrchestrator to OrchestratorEventBus"
  - "Integrate with CodeLevelPlanner for planning-driven workflows"
  - "Enable multi-layer coordination (interaction → planning → execution)"
  - "Enhance DoR (Definition of Ready) with planning context"
  - "Extend challenge generation with plan-based insights"
  - "Close SDLC loop: interaction → classify → plan → review → execute"

# Implementation
implementation:
  component: "InteractionOrchestratorEnhancement"
  module: "cortex.orchestrators.core.interaction_orchestrator_enhancement"
  class: "InteractionOrchestratorEnhancement"
  tier: 3
  priority: 2
  
  files:
    - path: "cortex/orchestrators/core/interaction_orchestrator_enhancement.py"
      lines_of_code: 22
      purpose: "Enhancement wrapper for InteractionOrchestrator"
    
    - path: "tests/unit/orchestrators/core/test_interaction_enhancement.py"
      lines_of_code: 4
      purpose: "Enhancement tests"
  
  total_loc: 26

# Enhancement Features
enhancements:
  - name: "Event Subscription"
    description: "Subscribe to key orchestrator events"
    subscribed_events:
      - "PLANNING_REQUIRED"
      - "PLAN_GENERATED"
      - "PLAN_APPROVED"
      - "PHASE_COMPLETE"
      - "PHASE_REVIEW_COMPLETE"
    actions:
      - "Update conversation context with planning state"
      - "Enhance DoR with plan fidelity metrics"
      - "Provide real-time progress updates to user"
  
  - name: "Planning Integration"
    description: "Coordinate with CodeLevelPlanner"
    capabilities:
      - "Request code-level plans for MODERATE+ complexity tasks"
      - "Display plan summaries in DoR display"
      - "Allow user approval/rejection of plans"
      - "Track plan adherence during execution"
  
  - name: "Multi-Layer Coordination"
    description: "Orchestrate across interaction, planning, execution layers"
    flow: |
      User Request → InteractionOrchestrator
        → ComplexityClassifier (via event)
        → CodeLevelPlanner (if MODERATE+)
        → DoR with Plan Context
        → User Approval
        → Execution with Plan Tracking
        → ReviewOrchestrator (post-phase)
        → Final Review (post-implementation)
  
  - name: "DoR Enhancement"
    description: "Enrich Definition of Ready with planning context"
    additions:
      - "Complexity level and planning depth"
      - "Code-level plan summary (if generated)"
      - "Affected files and test requirements"
      - "Estimated effort from plan"
  
  - name: "Challenge Extension"
    description: "Use plan insights in challenge generation"
    enhancements:
      - "Identify plan weaknesses (missing tests, unclear interfaces)"
      - "Suggest architectural improvements"
      - "Flag cross-layer coherence risks"

# Capabilities
