    CRITICAL remediation phase to restore CORTEX baseline health before Phase 38
    implementation. Addresses 5 blocking issues discovered during cohesion audit:
    
    1. Phase 34 regression (sentence-transformers dependency broken)
    2. 5 test collection errors blocking baseline validation
    3. Orchestrator inventory mismatch (35 expected, 234 files found)
    4. Missing regression baseline metrics
    5. No Phase 38 implementation readiness validation
    
    This phase establishes 100% cohesion baseline and zero-regression validation
    framework required for safe Phase 38 implementation.
  
  priority: "P0"
  blocking: ["phase-38"]
  estimated_effort: "2 days"
  test_count_target: 35
  coverage_target: "100% (baseline validation)"

# ROI Analysis
roi_analysis:
  value_score: 0.98
  success_probability: 0.95
  urgency_factor: 1.0
  effort_days: 2
  roi_formula: "(0.98 * 0.95 * 1.0) / 2 = 0.47 (normalized: 0.98)"
  justification: |
    Blocks Phase 38 (260 tests, 20 days) until baseline is stable.
    Prevents cascading failures during Phase 38 implementation.
    Establishes regression detection framework (Stage 10 requirement).
    Critical path blocker with minimal effort (2 days vs 20 days).

# Remediation Stages (TDD-First)
stages:
  stage_0:
    name: "Phase 34 Dependency Fix"
    description: |
      Restore Phase 34 (Advanced Response Optimization) functionality by
      installing missing ML dependencies and validating SemanticDeduplicator.
    acceptance_criteria:
      - id: "AC-PHASE38.0-001"
        description: "sentence-transformers installed and verified"
        tests_required: 1
        validation: "import sentence_transformers succeeds"
      - id: "AC-PHASE38.0-002"
        description: "SemanticDeduplicator 18 tests passing"
        tests_required: 18
        files:
          - "tests/unit/orchestrators/response/test_semantic_deduplicator.py"
      - id: "AC-PHASE38.0-003"
        description: "Phase 34 integration tests passing"
        tests_required: 5
        files:
          - "tests/integration/orchestrators/response/test_phase_34_advanced_response_optimization.py"
    fixes:
      - action: "pip install sentence-transformers>=2.2.0 scikit-learn>=1.3.0"
        validation: "python3 -c 'import sentence_transformers; print(sentence_transformers.__version__)'"
      - action: "Run full Phase 34 test suite"
        command: "pytest tests/unit/orchestrators/response/test_semantic_deduplicator.py -v"
        expected: "18/18 passing"
    duration: "2 hours"
    tests_target: 24
    
  stage_1:
    name: "Test Collection Error Resolution"
    description: |
      Fix 5 test collection errors blocking baseline validation.
      Ensures ALL tests can be discovered and collected.
    acceptance_criteria:
      - id: "AC-PHASE38.0-004"
        description: "Fix test_full_onboarding.py import errors"
        tests_required: 1
        file: "tests/integration/test_full_onboarding.py"
      - id: "AC-PHASE38.0-005"
        description: "Fix test_repository_onboarding_e2e.py import errors"
        tests_required: 1
        file: "tests/integration/test_repository_onboarding_e2e.py"
      - id: "AC-PHASE38.0-006"
        description: "Fix test_discovery_integration.py import errors"
        tests_required: 1
        file: "tests/integration/brain/discovery/test_discovery_integration.py"
      - id: "AC-PHASE38.0-007"
        description: "Fix test_domain_dashboard.py import errors"
        tests_required: 1
        file: "tests/manual/test_domain_dashboard.py"
      - id: "AC-PHASE38.0-008"
        description: "Fix test_json_generation.py import errors"
        tests_required: 1
        file: "tests/manual/test_json_generation.py"
    fixes:
      - action: "pytest --collect-only tests/integration/test_full_onboarding.py"
        expected: "No collection errors"
      - action: "pytest --collect-only tests/integration/test_repository_onboarding_e2e.py"
        expected: "No collection errors"
      - action: "pytest --collect-only tests/integration/brain/discovery/test_discovery_integration.py"
        expected: "No collection errors"
      - action: "pytest --collect-only tests/manual/test_domain_dashboard.py"
        expected: "No collection errors"
      - action: "pytest --collect-only tests/manual/test_json_generation.py"
        expected: "No collection errors"
    duration: "3 hours"
    tests_target: 5
    
  stage_2:
    name: "Orchestrator Inventory Audit"
    description: |
      Resolve orchestrator count discrepancy (35 wired vs 234 Python files).
      Document actual vs expected orchestrator architecture.
    acceptance_criteria:
      - id: "AC-PHASE38.0-009"
        description: "OrchestratorInventoryAuditor implementation"
        tests_required: 8
        capabilities:
          - "Scan cortex/orchestrators/ directory recursively"
          - "Distinguish: orchestrators vs adapters vs utilities vs tests"
          - "Cross-reference with wiring.yaml (35 orchestrators)"
          - "Generate inventory report (JSON + markdown)"
      - id: "AC-PHASE38.0-010"
        description: "Inventory report generation and validation"
        tests_required: 3
        outputs:
          - "cortex-registry/_cortex-master/reports/orchestrator-inventory.json"
          - "cortex-registry/_cortex-master/reports/orchestrator-inventory.md"
    files:
      - "cortex/tools/orchestrator_inventory_auditor.py"
      - "tests/unit/tools/test_orchestrator_inventory_auditor.py"
    validation:
      - "Compare wiring.yaml (35) vs actual orchestrator classes"
      - "Document: orchestrators (35) + adapters (35) + utilities (164) = 234 files"
      - "Verify: No orphaned orchestrators (in code but not wired)"
    duration: "3 hours"
    tests_target: 11
    
  stage_3:
    name: "Baseline Performance Metrics Capture"
    description: |
      Establish performance baseline for regression detection (Phase 38 Stage 10).
      Captures: test execution time, orchestrator latency, memory usage.
    acceptance_criteria:
      - id: "AC-PHASE38.0-011"
        description: "BaselineMetricsCollector implementation"
        tests_required: 10
        metrics:
          - "test_execution_time_p50"
          - "test_execution_time_p95"
          - "orchestrator_routing_latency_ms"
          - "memory_usage_mb_average"
          - "cache_hit_rate_percent"
      - id: "AC-PHASE38.0-012"
        description: "Baseline snapshot generation"
        tests_required: 5
        output: "cortex-registry/_cortex-master/baselines/2026-02-07-pre-phase38.json"
      - id: "AC-PHASE38.0-013"
        description: "Regression detection threshold configuration"
        tests_required: 3
        thresholds:
          - "latency_increase_threshold: 10%"
          - "memory_increase_threshold: 15%"
          - "test_time_increase_threshold: 20%"
    files:
      - "cortex/testing/baseline_metrics_collector.py"
      - "cortex/testing/regression_detector.py"
      - "tests/unit/testing/test_baseline_metrics_collector.py"
      - "tests/unit/testing/test_regression_detector.py"
    validation:
      - "Run full test suite with --durations=20"
      - "Capture MasterOrchestrator routing latency (10 sample operations)"
      - "Memory profiling: pytest --memray tests/"
    duration: "4 hours"
    tests_target: 18
    
  stage_4:
    name: "100% Baseline Validation"
    description: |
      Validate ALL existing tests pass before Phase 38 implementation.
      Zero tolerance: NO test failures, NO collection errors.
    acceptance_criteria:
      - id: "AC-PHASE38.0-014"
        description: "Full test suite execution (zero failures)"
        tests_required: 0
        validation: "pytest tests/ -v --tb=short --maxfail=0"
        expected: "~1,483 tests passing (100%)"
      - id: "AC-PHASE38.0-015"
        description: "Test collection validation (zero errors)"
        tests_required: 0
        validation: "pytest tests/ --collect-only"
        expected: "All tests collected successfully"
      - id: "AC-PHASE38.0-016"
        description: "Critical path test validation"
        tests_required: 0
        critical_suites:
          - "Phase 21 JSON-First: 57/57 passing"
          - "Phase 28 Onboarding: 18/18 passing"
          - "Phase 32 Dashboard: 10/10 passing"
          - "Phase 34 Response: 18/18 passing"
          - "MasterOrchestrator: All tests passing"
    validation_script:
      - "pytest tests/integration/test_phase21_contracts.py -v"
      - "pytest tests/unit/orchestrators/support/test_repository_onboarding_orchestrator.py -v"
      - "pytest tests/unit/visualization/test_phase_detail_template.py -v"
      - "pytest tests/unit/orchestrators/response/test_semantic_deduplicator.py -v"
      - "pytest tests/unit/orchestrators/core/test_master_orchestrator.py -v"
    duration: "2 hours"
    tests_target: 0  # Validation only, no new tests
    
  stage_5:
    name: "Phase 38 Readiness Checklist"
    description: |
      Final validation checklist ensuring Phase 38 can proceed safely.
      Documents dependencies, risks, and rollback plan.
    acceptance_criteria:
      - id: "AC-PHASE38.0-017"
        description: "Phase38ReadinessValidator implementation"
        tests_required: 12
        checks:
          - "All dependencies satisfied (Phase 27, 28, ENH-046, Phase 34)"
          - "Baseline metrics captured and stored"
          - "Regression detection framework operational"
          - "Orchestrator inventory documented"
          - "Zero test failures/collection errors"
          - "Feature flag infrastructure ready"
      - id: "AC-PHASE38.0-018"
        description: "Readiness report generation"
        tests_required: 3
        output: "cortex-registry/_cortex-master/reports/phase-38-readiness.md"
      - id: "AC-PHASE38.0-019"
        description: "Rollback plan documentation"
        tests_required: 2
        rollback_plan:
          - "Feature flags: CORTEX_BRAIN_COHESION_ENABLED=false"
          - "Git revert strategy documented"
          - "Baseline restoration procedure"
    files:
      - "cortex/tools/phase38_readiness_validator.py"
      - "tests/unit/tools/test_phase38_readiness_validator.py"
      - "cortex-registry/_cortex-master/reports/phase-38-readiness.md"
    validation:
      - "All 5 readiness checks pass (100%)"
      - "Readiness report generated with green status"
      - "Rollback plan approved"
    duration: "2 hours"
    tests_target: 17

