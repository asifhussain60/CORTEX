sweep_catalogue:
  - id: "GAP-99-01"
    title: "SecretsManager: no API key lifecycle methods"
    severity: P0
    source: "copilot-review.md + security wiring audit"
    evidence: |
      grep -n "def " cortex/infrastructure/secrets/secrets_manager.py
      → generate_api_key, validate_api_key, revoke_api_key, list_api_keys: absent
    action_ref: "phase-99-a"
    status: CLOSED
    closed_evidence: |
      tests/secrets/test_api_key_management.py — 21 tests GREEN
      Methods added: generate_api_key(), validate_api_key(), revoke_api_key(),
      list_api_keys(), _hash_api_key(), _list_api_key_vault_entries()
      Constant-time validation via hmac.compare_digest.

  - id: "GAP-99-02"
    title: "Pre-existing audit call bugs in set_secret / get_secret / delete_secret"
    severity: P0
    source: "Discovered during Phase 99-A TDD run"
    evidence: |
      set_secret line 137: self.audit_logger.log_secret_modification(...)  → AttributeError
      get_secret line ~189: self.audit_logger.log_secret_access(...)       → AttributeError
      delete_secret line 247: self.audit_logger.log_secret_modification(...) → AttributeError
      All three also called self.hash_chain.append_event() → AttributeError
      AuditLogger only exposes: log(action, key, actor, success, **meta)
      HashChain only exposes: append(entry: Dict)
    action_ref: "phase-99-a"
    status: CLOSED
    closed_evidence: |
      All three methods fixed to use audit_logger.log(action=..., key=...) and
      hash_chain.append({...}). get_audit_trail() fixed: .events → get_entries(),
      .verify_integrity() → .verify(), .previous_hash → get_chain()[-1].
      21/21 tests GREEN after fix.

  - id: "GAP-99-03"
    title: "MCP server has no authentication middleware"
    severity: P0
    source: "copilot-review.md + security wiring audit"
    evidence: |
      cortex/mcp/server.py — no auth check in dispatch loop
      Any caller with stdio access can invoke any tool without credentials
    action_ref: "phase-99-b"
    status: CLOSED
    closed_evidence: |
      cortex/mcp/auth_middleware.py — ApiKeyAuthMiddleware + AuthenticationError
      tests/mcp/test_auth_middleware.py — 20 tests GREEN
      authenticate(): constant-time via SecretsManager.validate_api_key()
      enforce(): raises AuthenticationError with generic message (no key echo)

  - id: "GAP-99-04"
    title: "MCP has no HTTP/SSE transport — K8s probes unreachable"
    severity: P0
    source: "copilot-review.md gap G2"
    evidence: |
      cortex/mcp/ — no FastAPI app, no /health endpoint
      K8s liveness + readiness probes would fail; no HTTP tool invocation path
    action_ref: "phase-99-c"
    status: CLOSED
    closed_evidence: |
      cortex/mcp/http_transport.py — create_app() returns configured FastAPI app
      GET  /health        — public, 200 {"status": "ok"}
      GET  /health/ready  — public, 200 {"status": "ok", "ready": true}
      GET  /tools/list    — auth-gated, returns registry.to_mcp_schema()
      POST /tools/call    — auth-gated, dispatches to registered tool
      tests/mcp/test_http_transport.py — 16 tests GREEN

  - id: "GAP-99-05"
    title: "Pre-commit hook had no test gate — broken wiring could be shipped"
    severity: P1
    source: "copilot-review.md gap G4 + security wiring audit"
    evidence: |
      .git/hooks/pre-commit — only copyright, naming, placement, stub checks
      No pytest execution — a developer could commit code that breaks preflight
    action_ref: "phase-99-d"
    status: CLOSED
    closed_evidence: |
      .git/hooks/pre-commit — PREFLIGHT GATE section appended (Phase 99-D)
      Runs: python3 -m pytest tests/preflight/ -q --tb=short
      Blocks commit if any preflight test fails; < 5s on 48 tests
      scripts/install-hooks.sh — one-command setup for new developers
      Verified: bash scripts/install-hooks.sh → 48 passed ✅

