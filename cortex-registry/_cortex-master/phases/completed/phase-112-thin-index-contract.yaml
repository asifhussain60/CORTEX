id: "phase-112"
title: "Master YAML THIN INDEX CONTRACT — Reduce cortex-master.yaml from 543L to ≤500L"
version: "1.0"
created: "2026-03-02"
status: COMPLETE
completed: "2026-03-02"
governance_authority:
  - CORE-002  # All output inline — no .md/.txt report files
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-112-THIN-INDEX-CONTRACT"

background: |
  Source: refresh_prompt_suite.py --counts-only output (2026-03-02).
  Finding: cortex-master.yaml is 543 lines — 43 lines over the cortex-architect.prompt.md
  documented limit of ≤500 lines. This breaches Audit Check #25 (THIN INDEX CONTRACT).
  The master YAML must be a reference index only. Prohibited inline keys are:
    gap_catalogue, tdd_sequence, rewrites, new_files, files_to_edit,
    implementation, code_snippets.
  All detail must live in dedicated cortex-registry/planning/phases/{planned|completed}/ files.
  This phase is non-code-touching: it is a YAML restructuring operation only.
  Score at entry: FAIL (543L vs 500L limit)
  Target score: PASS (≤500 lines, YAML valid, no prohibited keys)
  Baseline measurements:
    - cortex-master.yaml current: 543 lines
    - Reduction needed: ≥43 lines
    - Smoke tests: 18,085 collected, suite passes (exit 0)
  Git prerequisite: branch CORTEX, clean working tree

sweep_catalogue:
  - id: "GAP-112-01"
    title: "cortex-master.yaml is 543 lines — 43 lines over ≤500L limit"
    severity: P0
    source: "refresh_prompt_suite.py --counts-only output 2026-03-02"
    evidence: |
      wc -l cortex-registry/cortex-master.yaml → 543
      Audit Check #25 limit: ≤500 lines (alarm at 400)
      cortex-architect.prompt.md Check #25 states:
        "wc -l cortex-registry/cortex-master.yaml — must be ≤ 500"
    action_ref: "phase-112-a"
    status: OPEN

  - id: "GAP-112-02"
    title: "Inline phase detail likely present inside cortex-master.yaml"
    severity: P1
    source: "THIN INDEX CONTRACT — cortex-architect.prompt.md § PLAN MODE"
    evidence: |
      Historical pattern: cortex-master.yaml grew from ~150L to 3,007L due to
      inline phase detail (gap_catalogue, tdd_sequence, new_files, implementation).
      The THIN INDEX CONTRACT was introduced to prevent this. At 543L the file
      has likely accumulated inline blocks that should be in dedicated phase files.
    action_ref: "phase-112-a"
    status: OPEN

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

sub_phases:

  - id: "phase-112-a"
    title: "TRIAGE — Scan cortex-master.yaml for prohibited inline keys and fat entries"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-112-01", "GAP-112-02"]
    depends_on: []
    tdd_cycle:
      red:
        action: |
          Write tests/governance/test_master_yaml_thin_index.py:
            test_master_yaml_line_count: assert line count ≤ 500
            test_master_yaml_no_prohibited_keys: grep for gap_catalogue, tdd_sequence,
              new_files, files_to_edit, implementation, code_snippets — assert 0 matches
            test_master_yaml_is_valid_yaml: yaml.safe_load must not raise
          All three tests MUST FAIL at entry (543 lines, possible prohibited keys).
        gate: "python3 scripts/run_tests.py file tests/governance/test_master_yaml_thin_index.py
          — test_master_yaml_line_count FAILS (543 > 500)"
        blocker: "No edits to cortex-master.yaml until RED gate confirmed"
      green:
        action: |
          1. Run: grep -n 'gap_catalogue:\|tdd_sequence:\|new_files:\|files_to_edit:\|
             implementation:\|code_snippets:' cortex-registry/cortex-master.yaml
          2. For each prohibited key found: extract its block to the corresponding
             dedicated phase file in planning/phases/{planned|completed}/
          3. Replace extracted block with a thin file: pointer entry only
          4. For any phase entry with excessive inline notes (>5 lines):
             move detail to its dedicated phase file; leave only id, title, status,
             priority, sweep_id, gaps, sub_phases, file, note (one sentence)
          5. Continue editing until wc -l ≤ 500
        gate: "python3 scripts/run_tests.py file tests/governance/test_master_yaml_thin_index.py
          — ALL 3 tests PASS"
        blocker: "REFACTOR forbidden until ALL 3 tests pass"
      refactor:
        action: |
          Verify all phases still have their file: pointer resolving to a real path.
          Run: python3 -c "
          import yaml, pathlib
          doc = yaml.safe_load(open('cortex-registry/cortex-master.yaml'))
          missing = [e['id'] for e in doc.get('phases',[])
                     if 'file' in e and not pathlib.Path(e['file']).exists()]
          print('Missing files:', missing)"
          — must print: Missing files: []
          Run ruff on any .py files touched. Confirm YAML valid.
        gate: "python3 scripts/run_tests.py dir tests/governance/ — zero regressions"
        blocker: "sub-phase COMPLETE forbidden until gate passes"
    tdd_sequence:
      red:
        - "test_master_yaml_line_count"
        - "test_master_yaml_no_prohibited_keys"
        - "test_master_yaml_is_valid_yaml"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/governance/"
      min_tests_pass: 3
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-112-final"
    title: "Smoke Gate + CORE-064 Sweep Close + cortex-master.yaml self-update"
    priority: P0
    status: PLANNED
    gap_refs: []
    depends_on: ["phase-112-a"]
    prerequisite: "ALL preceding sub-phase completion_gates PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — ≥18085 tests pass"
    tdd_cycle:
      red:
        action: "N/A — verification gate only"
        gate: "GAP-112-01 and GAP-112-02 both verified CLOSED; wc -l ≤ 500"
        blocker: "Do NOT run smoke gate if any GAP remains OPEN"
      green:
        action: "Run full smoke gate — confirm ≥18085 tests pass with zero regressions"
        gate: "python3 scripts/run_tests.py smoke"
        blocker: "Do NOT mark phase COMPLETE if smoke gate fails"
      refactor:
        action: |
          Add thin phase-112 entry to cortex-master.yaml (status: COMPLETE).
          Move this file: planned/phase-112-thin-index-contract.yaml → completed/.
          Update file: pointer in cortex-master.yaml.
          Final line count check: wc -l cortex-registry/cortex-master.yaml — must be ≤ 500
          after adding the phase-112 completion entry.
        gate: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml')); print('YAML valid')\""
        blocker: "Do NOT close phase without final line count verified ≤ 500"
    acceptance_criteria:
      - "wc -l cortex-registry/cortex-master.yaml ≤ 500 ✅"
      - "grep for prohibited keys returns 0 matches ✅"
      - "python3 -c yaml.safe_load(master) does not raise ✅"
      - "All file: pointers in cortex-master.yaml resolve to existing files ✅"
      - "ALL GAP-112-* entries status: CLOSED ✅"
      - "python3 scripts/run_tests.py smoke passes ≥18085 tests ✅"
      - "Zero new test failures vs baseline ✅"
      - "phase-112 detail file moved: planned/ → completed/ ✅"
      - "cortex-master.yaml entry updated to status: COMPLETE ✅"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 18085
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: false

ac_markers:
  start: "AC_START: AC-112-THIN-INDEX-{timestamp}"
  complete: "AC_COMPLETE: AC-112-THIN-INDEX-{timestamp} ✅"
