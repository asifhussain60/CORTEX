# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================

overview:
  vision: |
    Create persistent intelligence layer with golden test harness that enables:
    
    1. **Knowledge Persistence** — Every repository onboarding generates immutable
       domain YAML artifacts in company/domains/{repo}/. Brain intelligence layers
       (perception/reasoning/action) updated after EVERY operation (not just TDD).
       Knowledge survives session boundaries.
    
    2. **Universal Learning Loop** — OBSERVE → ANALYZE → SYNTHESIZE → APPLY cycle
       engaged after ALL orchestrator operations (ONBOARD, ANALYZE, AUDIT, REFACTOR,
       IMPLEMENT). Pattern frequency tracking enables 15-20% faster analysis on
       similar codebases.
    
    3. **Agent Collaboration Protocol** — Machine-readable agent metadata enables
       capability-based discovery. Agents hand off work systematically with full
       audit trails. No manual coordination needed.
    
    4. **Golden Test Harness** — Zero-mock test framework for all intelligence
       components. Tests use real GitBackedRegistry, real domain YAMLs, real
       brain state. Validates learning loop convergence with production scenarios.

  problem_statement: |
    CURRENT STATE (P0 BLOCKING):
    
    **Knowledge Persistence:**
    - Repository onboarding returns inline report → knowledge vanishes after session
    - No company/domains/{repo}/ YAML artifacts → zero cross-session retention
    - Brain intelligence layers never updated → no learning accumulation
    - Re-onboarding same repo type → starts from zero (inefficient)
    
    **Learning Loop:**
    - Universal Learning Loop exists but underutilized (TDD only)
    - Not engaged for ONBOARD, ANALYZE, AUDIT, REFACTOR operations
    - No pattern frequency tracking across sessions
    - No measurable improvement in pattern recognition over time
    
    **Agent Collaboration:**
    - No systematic agent discovery mechanism
    - Manual agent coordination (error-prone)
    - No audit trail for agent handoffs
    - Capability-based routing not implemented
    
    **Test Coverage:**
    - Intelligence components lack golden tests
    - Mock-heavy tests hide integration failures
    - No production-like learning loop validation
    - Cannot verify cross-session learning works
    
    IMPACT:
    - ❌ Zero knowledge retention (repeat work every session)
    - ❌ Learning loop potential unrealized (80% underutilized)
    - ❌ Agent collaboration friction (manual coordination)
    - ❌ Low confidence in intelligence features (insufficient tests)

  success_criteria:
    - "✅ Knowledge persistence: company/domains/{repo}/ artifacts auto-generated"
    - "✅ Brain updates: perception/reasoning/action layers updated after every operation"
    - "✅ Learning loop: Engaged for 6+ orchestrators (TDD, ONBOARD, ANALYZE, AUDIT, REFACTOR, FIX)"
    - "✅ Pattern tracking: Frequency metrics prove 15-20% speedup on similar repos"
    - "✅ Agent protocol: Capability-based discovery with audit trail"
    - "✅ Golden tests: 50+ zero-mock tests for intelligence components"
    - "✅ Cross-session learning: Proven with before/after metrics"

