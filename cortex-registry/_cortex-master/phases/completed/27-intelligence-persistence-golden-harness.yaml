# ============================================================================
# GOLDEN TEST HARNESS SPECIFICATIONS
# ============================================================================

golden_test_harness:
  philosophy:
    - "Zero mocks: Use real GitBackedRegistry, real brain state, real domain YAMLs"
    - "Production scenarios: Onboard real sample repos, verify learning"
    - "Convergence validation: Measure before/after metrics"
    - "Integration focus: Test component interactions, not isolation"
  
  test_categories:
    knowledge_persistence:
      - "Real repo onboarding → verify company/domains/ YAML generated"
      - "Brain state updates → verify perception/reasoning/action layers"
      - "Cross-session retrieval → verify knowledge survives restart"
      - "Concurrent writes → verify artifact generation thread-safe"
    
    learning_loop:
      - "ONBOARD operation → verify OBSERVE → ANALYZE → SYNTHESIZE → APPLY"
      - "Pattern tracking → verify frequency metrics updated"
      - "Speedup verification → onboard repo1, repo2 (similar) → measure 15-20% faster"
      - "Multi-orchestrator → verify learning loop for 6+ orchestrators"
    
    agent_collaboration:
      - "Capability discovery → request 'security' → expect SecurityCheckpointAgent"
      - "Multi-agent scenario → GovernanceAgent → SecurityAgent → verify handoff"
      - "Audit trail → query SQLite → verify all interactions logged"
      - "Failure recovery → agent unavailable → verify graceful fallback"
  
  sample_repos:
    - "tests/golden/fixtures/sample-python-api/ (Flask API)"
    - "tests/golden/fixtures/sample-typescript-spa/ (React SPA)"
    - "tests/golden/fixtures/sample-dotnet-service/ (.NET microservice)"
  
  metrics_to_capture:
    - "Artifact generation time (target: <500ms)"
    - "Brain update latency (target: <200ms)"
    - "Learning loop overhead (target: <10% of operation time)"
    - "Pattern recognition speedup (target: 15-20% on similar repos)"
    - "Agent discovery time (target: <50ms)"

