status: "complete"
priority: "P1"
completion_date: "2026-02-07"
roi_score: 0.89

description: |
  Two-phase approval workflow with session-based state management.
  Replaces inline DoR display with stateful approval sessions enabling
  cleaner separation of concerns and better UX.

problem_statement: |
  Current DoR workflow displays classification inline and expects immediate
  user response. This creates coupling between classification and execution,
  makes testing harder, and provides poor UX for multi-step approvals.

solution: |
  Implement session-based approval workflow:
  1. cortex_classify_request: Display DoR + create 5min TTL session
  2. User reviews DoR table with confidence scores
  3. cortex_approve_request: Execute from session state
  4. Alternative: cortex_reject_request or cortex_modify_request

