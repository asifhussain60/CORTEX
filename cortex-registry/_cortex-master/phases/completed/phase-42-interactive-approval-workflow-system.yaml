mcp_tools:
  - name: "cortex_classify_request"
    purpose: "Display DoR table + create approval session"
    parameters: ["user_request"]
    returns: "DoR table + session_id"
  - name: "cortex_approve_request"
    purpose: "Execute request from approval session"
    parameters: ["session_id"]
    returns: "Execution result"
  - name: "cortex_reject_request"
    purpose: "Abort request with rejection reason"
    parameters: ["session_id", "reason"]
    returns: "Abort confirmation"
  - name: "cortex_modify_request"
    purpose: "Re-classify with corrections"
    parameters: ["session_id", "corrections"]
    returns: "New DoR table + updated session"

