id: phase-94-workflow-gateway-enforcement
title: "Phase 94 — Workflow Gateway + Mandatory Enforcement: WorkflowGateway, WorkflowEnforcementMixin, enforce_gateway Decorator"
status: COMPLETE
priority: P0
created: "2026-02-28"
completed: "2026-02-28"
sweep_id: SWEEP-094-WORKFLOW-GATEWAY-ENFORCEMENT

description: >
  Implements the mandatory Workflow Composer enforcement layer: no orchestrator
  may touch code without first passing through WorkflowGateway and receiving a
  canonical workflow template. Three sub-phases: (a) core gateway + mixin
  foundation + mode-workflow templates; (b) strict disk verification, TDD /
  Debugger / Refactoring opt-in; (c) enforce_gateway decorator + top-level
  coordinator wiring (Master, Enforcement, Audit).

governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-048  # Holistic validation gate
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate

background: |
  Originated from user audit request: "confirm no CODE will be touched by
  CORTEX without the workflow composer using dedicated workflow templates,
  convergence and conditional loops for all operational orchestrators."
  Baseline smoke: 1,717 → Final smoke: 1,784 passed (zero regressions).
  Architectural tensions addressed:
    Tension 1: execute_operation() bypass gap → enforce_gateway decorator
    Tension 2: YAML templates may not exist on disk → strict=True resolver
    Tension 3: Top-level coordinators untracked → advisory mixin wiring

acceptance_criteria:
  - ✅ WorkflowGateway: single enforced pre-execution gate for all code-touching modes
  - ✅ _MODE_TEMPLATE_MAP: 18 modes mapped (11 code-touching + 7 exempt)
  - ✅ WorkflowGateway.resolve_template(strict=True): disk YAML existence check
  - ✅ WorkflowGateway.execute_gated(): AC markers + SQLite trace
  - ✅ WorkflowEnforcementMixin: PHASE90_GATEWAY_ENABLED=False default, zero-risk rollout
  - ✅ enforce_gateway decorator: closes bypass gap on execute_operation() overrides
  - ✅ 5 orchestrators PHASE90_GATEWAY_ENABLED=True: Health, Vacuum, TDD, Debugger, Refactoring
  - ✅ 3 orchestrators advisory-wired (False): Master, Enforcement, Audit
  - ✅ tdd-workflow.yaml + review-and-cleanup.yaml primitive created
  - ✅ review-and-cleanup injected into all 7 mode-workflow templates
  - ✅ 27 golden tests GREEN (GW-001..GW-027)
  - ✅ 16 golden tests GREEN (GHV-001..GHV-016, health+vacuum)
  - ✅ 22 unit tests GREEN (Phase 94b enforcement cluster)
  - ✅ 14 unit tests GREEN (Phase 94c enforce_gateway cluster)
  - ✅ Smoke gate: 1,784 passed, 0 failed

sweep_catalogue:
  - id: GAP-94-01
    description: "No mandatory gateway: orchestrators could touch code without template routing"
    severity: P0
    status: CLOSED
    closed_by: "WorkflowGateway + WorkflowEnforcementMixin"

  - id: GAP-94-02
    description: "execute_operation() bypass: direct callers skip execute_via_gateway()"
    severity: P0
    status: CLOSED
    closed_by: "enforce_gateway decorator (Phase 94c)"

  - id: GAP-94-03
    description: "_MODE_TEMPLATE_MAP entries may point to non-existent YAML files"
    severity: P1
    status: CLOSED
    closed_by: "resolve_template(strict=True) + _assert_template_yaml_exists()"

  - id: GAP-94-04
    description: "TDD / Debug / Refactoring orchestrators not opted-in to gateway"
    severity: P1
    status: CLOSED
    closed_by: "Phase 94b: PHASE90_GATEWAY_ENABLED=True on all three"

  - id: GAP-94-05
    description: "Top-level coordinators (Master, Enforcement, Audit) have no mixin"
    severity: P1
    status: CLOSED
    closed_by: "Phase 94c: advisory mixin wiring, PHASE90_GATEWAY_ENABLED=False"

  - id: GAP-94-06
    description: "No review-and-cleanup step mandated after every CORTEX operation"
    severity: P1
    status: CLOSED
    closed_by: "review-and-cleanup.yaml primitive injected into all 7 mode-workflow templates"

  - id: GAP-94-07
    description: "No golden test coverage for WorkflowGateway routing and orchestrator opt-in"
    severity: P1
    status: CLOSED
    closed_by: "test_phase90_gateway_golden.py (27 tests) + test_phase90_health_vacuum_golden.py (16 tests)"

  - id: GAP-94-08
    description: "9 high-impact domain orchestrators (Interaction, Security, Planning, EnhancedPlanning, SDLC, Onboarding, HolisticValidation, Upgrade, Git) lack WorkflowEnforcementMixin"
    severity: P1
    status: CLOSED
    closed_by: "Phase 94d: advisory mixin wiring, PHASE90_GATEWAY_ENABLED=False, 18 tests GREEN"

  - id: GAP-94-09
    description: "14 additional orchestrators (MasterPlan, Review, Workflow, RequestRephrase, Domain, ServiceDecomposition, Dashboard, DigestSession, UnifiedQA, SweepCatalogue, SecurityVulnerability, Intelligence, PreCommitEnforcement, Sanitization) lack WorkflowEnforcementMixin"
    severity: P1
    status: CLOSED
    closed_by: "Phase 94e: advisory mixin wiring, PHASE90_GATEWAY_ENABLED=False, 28 tests GREEN"

  - id: GAP-94-10
    description: "24 remaining orchestrators (BrainHealth, CentralBrain, Conversation, Observability, PhaseOrchestrator, State, Inquiry, GitPublish, TechIntelligence, Trainer, PersonaMaster, AutoHealingMCP, BulkDigest, ContextAssembly, CortexDocs, LENSVisualization, PlanRegistrySync, PhaseCompletion, Plan, RepoDetection, Setup, TestClassifier, SupportVacuum, SOLID) lack WorkflowEnforcementMixin"
    severity: P1
