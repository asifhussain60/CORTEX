# Risks
risks:
  - risk: "Git diff parsing complexity"
    severity: "Medium"
    mitigation: "Start with simple regex patterns, iterate based on testing"
    
  - risk: "False positives (internal changes as features)"
    severity: "Low"
    mitigation: "Whitelist user-facing file patterns only"
    
  - risk: "Performance impact"
    severity: "Low"
    mitigation: "Cache diff results, run async if >100 files changed"

