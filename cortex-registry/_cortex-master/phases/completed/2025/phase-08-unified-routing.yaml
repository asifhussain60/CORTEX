# ============================================================================
# RISK MITIGATION
# ============================================================================

risks:
  - risk: "Performance degradation"
    likelihood: "Medium"
    impact: "High"
    mitigation:
      - Cache orchestrator instances
      - Use LRU cache for routing decisions
      - Profile and optimize keyword extraction
      - Feature flag for instant rollback
  
  - risk: "Orchestrator instance not found"
    likelihood: "Low"
    impact: "High"
    mitigation:
      - Validation check in verify_prod_ready.py
      - Fallback orchestrators for all intents
      - Clear error messages with remediation
      - Circuit breaker for repeated failures
  
  - risk: "Keyword mapping conflicts"
    likelihood: "Medium"
    impact: "Medium"
    mitigation:
      - YAML schema validation at startup
      - Conflict detection in OrchestratorLookup
      - Confidence scoring resolves ambiguity
      - Manual override capability

