# ============================================================================
# PHASE 8.5: LENS MICROSOFT STACK ENHANCEMENT
# ============================================================================

phase_8_5:
  name: "LENS Microsoft Stack Expertise"
  timeline: "1 week (Sprint 6)"
  status: "PLANNED"
  
  objective: |
    Enhance LENSOrchestrator with expert-level analysis for Microsoft stacks:
    - C# (.NET Framework, .NET Core, ASP.NET)
    - SQL Server (T-SQL, stored procedures, indexes)
    - Oracle Database (PL/SQL, packages, triggers)
    - Angular (TypeScript, RxJS, Angular Material)
  
  tasks:
    - id: "LENS-MS-001"
      name: "C# AST Analyzer"
      description: |
        Extend ASTAnalyzer to parse C# syntax trees.
      
      capabilities:
        - Parse C# classes, methods, properties
        - Extract LINQ queries
        - Detect async/await patterns
        - Identify dependency injection patterns
        - Extract Entity Framework usage
      
      files:
        - cortex/brain/analysis/ast_analyzer_csharp.py
      
      loc: 200
      effort: "2 days"

    - id: "LENS-MS-002"
      name: "SQL/Oracle Query Analyzer"
      description: |
        Add SQL and PL/SQL parsing capabilities.
      
      capabilities:
        - Parse T-SQL stored procedures
        - Extract PL/SQL packages
        - Detect SQL injection vulnerabilities
        - Analyze query complexity
        - Extract table dependencies
      
      files:
        - cortex/brain/analysis/sql_analyzer.py
      
      loc: 180
      effort: "2 days"

    - id: "LENS-MS-003"
      name: "Angular/TypeScript Analyzer"
      description: |
        Add TypeScript and Angular framework analysis.
      
      capabilities:
        - Parse TypeScript classes
        - Extract Angular components/services/pipes
        - Detect RxJS observable patterns
        - Analyze routing configuration
        - Extract HTTP client usage
      
      files:
        - cortex/brain/analysis/typescript_analyzer.py
      
      loc: 150
      effort: "2 days"

    - id: "LENS-MS-004"
      name: "Edge Case Identification"
      description: |
        Add edge case detection across all languages.
      
      edge_cases:
        csharp:
          - Unhandled null reference exceptions
          - Missing async cancellation tokens
          - IDisposable not disposed
          - Thread-unsafe static fields
        
        sql:
          - Missing transaction rollback
          - Unbounded result sets
          - Implicit type conversions
          - Missing indexes on joins
        
        oracle:
          - Missing exception handlers
          - Hardcoded credentials
          - Missing bind variables (SQL injection)
          - Missing commit/rollback
        
        angular:
          - Memory leaks (unsubscribed observables)
          - Missing error handlers
          - Unsafe innerHTML usage
          - Missing change detection strategy
      
      files:
        - cortex/brain/analysis/edge_case_detector.py
      
      loc: 250
      effort: "3 days"

  deliverables:
    - C# AST analyzer
    - SQL/Oracle query analyzer
    - Angular/TypeScript analyzer
    - Edge case detector (multi-language)
    - 30+ tests
    - Documentation: Microsoft stack analysis guide

  acceptance_criteria:
    - "✅ C# analysis extracts classes, methods, LINQ queries"
    - "✅ SQL analysis detects injection vulnerabilities"
    - "✅ Oracle analysis extracts PL/SQL packages"
    - "✅ Angular analysis detects memory leaks"
    - "✅ Edge case detection achieves 85%+ accuracy"
    - "✅ All analyzers integrated with LENSOrchestrator"

