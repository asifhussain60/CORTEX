# ============================================================================
# PHASE 8.2: UNIFIED USER-REQUEST-TO-ORCHESTRATOR MAPPING
# ============================================================================
# Date: 2026-01-30
# Status: ACTIVE - IN PROGRESS
# Author: CORTEX Team
# Authority: CORTEX Master Orchestrator
# AC-ID: AC-PHASE-8.2-01
#
# OBJECTIVE: Enable ALL user requests to map directly to orchestrator instances
#            via keyword-based routing with enforcement and blocking.
#
# PROBLEM STATEMENT:
#   Current IntentRouter returns generic handler names (strings) instead of
#   orchestrator instances, causing user requests to fail routing.
#   Example: "Use CORTEX LENS to onboard repo: XYZ" → Generic handler (FAIL)
#
# SOLUTION:
#   Three-phase intelligent routing system:
#   - Phase 8.2: Keyword-based routing (deterministic, fast)
#   - Phase 8.3: Semantic ranking (edge case handling)
#   - Phase 8.4: Optional NLP (future optimization)
#
# GOVERNANCE:
#   - CORE-008: TDD (tests before code)
#   - CORE-026: Git checkpoint before major changes
#   - CORE-027: Audit trail for all routing decisions
#   - CORE-030: Implementation Truth (verify code, not docs)
#   - CORE-035: Single Canonical Implementation
# ============================================================================

metadata:
  phase: "8.2"
  parent_phase: "8"
  name: "Unified User-Request-to-Orchestrator Mapping"
  date: "2026-01-30"
  status: "ACTIVE"
  priority: "P0-CRITICAL"
  blocking: true
  estimated_effort: "4 weeks (3 sub-phases)"
  total_loc: "~1200 LOC"
  total_tests: "60+ tests"
  git_checkpoint: "phase-8.2-unified-routing-start"

# ============================================================================
# ARCHITECTURE OVERVIEW
# ============================================================================

architecture:
  description: |
    Three-layer routing system with progressive intelligence:
    
    LAYER 1 (Phase 8.2): Keyword Matching
      - Fast path: Direct keyword → orchestrator lookup
      - Deterministic: YAML-driven rules
      - Performance: <5ms routing latency
      - Coverage: ~90% of user requests
    
    LAYER 2 (Phase 8.3): Semantic Ranking
      - Fallback: Multiple candidate orchestrators
      - Confidence scoring: keyword overlap + intent alignment
      - Interactive disambiguation: top 3 candidates
      - Coverage: Additional ~5-8% edge cases
    
    LAYER 3 (Phase 8.4): Optional NLP
      - Synonym expansion: "setup" ≈ "onboard"
      - Lightweight embeddings: cached similarity scores
      - A/B testing: explicit vs. semantic
      - Coverage: Remaining ~2-5% edge cases
  
  components:
    - OrchestratorLookup: Registry adapter (wiring.yaml → instances)
    - IntentRouter: Enhanced with keyword extraction + ranking
    - RoutingDecision: Extended with orchestrator instances
    - EnforcementEngine: Tier 0 blocking for routing violations
    - intent-routing.yaml: Extended schema with keywords + orchestrators

  enforcement:
    enabled: true
    mode: "blocking"
    tier0_rules:
      - "ROUTING-001: Keywords must map to registered orchestrators"
      - "ROUTING-002: Confidence must exceed threshold (default: 0.6)"
      - "ROUTING-003: Fallback orchestrators required for ambiguous requests"
      - "ROUTING-004: All routing decisions must be auditable"

# ============================================================================
# PHASE 8.2: KEYWORD-BASED ROUTING (DETERMINISTIC)
# ============================================================================

phase_8_2:
  name: "Keyword-Based Routing + Enforcement"
  timeline: "2 weeks (Sprints 1-2)"
  status: "IN_PROGRESS"
  
  tasks:
    - id: "ROUTE-001"
      name: "Extend intent-routing.yaml Schema"
      description: |
        Add orchestrator references and keyword lists to routing config.
        
        Changes:
          - Add 'orchestrator' field (orchestrator class name)
          - Add 'keywords' field (list of trigger words)
          - Add 'fallback_orchestrators' field (ranked alternatives)
          - Add 'confidence_boost' field (keyword match weight)
          - Add 'blocking' field (enforce routing rules)
      
      files:
        - cortex_brain/tier3/knowledge/intent-routing.yaml
      
      example:
        implement:
          onboarding:
            orchestrator: "OnboardingOrchestrator"
            keywords: ["onboard", "setup", "initialize", "bootstrap", "welcome"]
            fallback_orchestrators: ["LENSOrchestrator", "SetupOrchestrator"]
            confidence_boost: 0.25
            blocking: true
          
          lens_analysis:
            orchestrator: "LENSOrchestrator"
            keywords: ["lens", "analyze", "inspect", "examine", "code intelligence"]
            fallback_orchestrators: ["OnboardingOrchestrator"]
            confidence_boost: 0.20
            blocking: true
      
      tests:
        - test_routing_yaml_schema_validation
        - test_orchestrator_keyword_parsing
        - test_fallback_orchestrator_resolution
      
      loc: 80
      effort: "1 day"
      status: "PLANNED"

    - id: "ROUTE-002"
      name: "Create OrchestratorLookup Adapter"
      description: |
        Bridge between IntentRouter and Git-backed YAML registry.
        Provides orchestrator instance resolution.
      
      files:
        - cortex/orchestrators/registry/orchestrator_lookup.py
      
      class_structure:
        OrchestratorLookup:
          methods:
            - get_by_name(name: str) → Optional[IOrchestrator]
            - find_by_capabilities(caps: List[str]) → List[IOrchestrator]
            - find_by_keywords(keywords: List[str]) → List[Tuple[IOrchestrator, float]]
            - list_by_domain(domain: str) → List[IOrchestrator]
            - resolve_instance(orchestrator_name: str) → IOrchestrator
            - validate_orchestrator_exists(name: str) → bool
      
      tests:
        - test_orchestrator_lookup_by_name
        - test_orchestrator_lookup_by_capabilities
        - test_orchestrator_lookup_by_keywords
        - test_orchestrator_instance_resolution
        - test_orchestrator_lookup_caching
        - test_orchestrator_lookup_error_handling
      
      loc: 150
      effort: "2 days"
      status: "PLANNED"

    - id: "ROUTE-003"
      name: "Enhance IntentRouter with Keyword Extraction"
      description: |
        Add keyword extraction and orchestrator lookup to routing logic.
      
      files:
        - cortex/orchestrators/core/intent_router.py
      
      new_methods:
        - _extract_keywords(context: Dict[str, Any]) → List[str]
        - _lookup_orchestrators(keywords: List[str], intent: IntentType) → List[Tuple[IOrchestrator, float]]
        - _rank_orchestrators(candidates: List[Tuple[IOrchestrator, float]]) → List[IOrchestrator]
        - _resolve_orchestrator_instance(target_handler: str) → Optional[IOrchestrator]
        - _calculate_keyword_confidence(keywords: List[str], orchestrator: str) → float
      
      tests:
        - test_keyword_extraction_from_description
        - test_keyword_extraction_from_operation
        - test_orchestrator_lookup_integration
        - test_orchestrator_ranking_by_confidence
        - test_orchestrator_instance_resolution
        - test_fallback_orchestrator_selection
      
      loc: 200
      effort: "3 days"
      status: "PLANNED"

    - id: "ROUTE-004"
      name: "Update RoutingDecision Dataclass"
      description: |
        Extend RoutingDecision to include orchestrator instances.
      
      files:
        - cortex/orchestrators/core/intent_router.py
      
      changes:
        RoutingDecision:
          new_fields:
            - target_orchestrator: Optional[IOrchestrator]  # Actual instance
            - fallback_orchestrators: List[IOrchestrator]   # Ranked alternatives
            - keyword_matches: List[str]                    # Matched keywords
            - confidence_breakdown: Dict[str, float]        # Detailed scoring
      
      tests:
        - test_routing_decision_with_orchestrator_instance
        - test_routing_decision_with_fallbacks
        - test_routing_decision_confidence_breakdown
      
      loc: 30
      effort: "1 day"
      status: "PLANNED"

    - id: "ROUTE-005"
      name: "Add Routing Enforcement Engine"
      description: |
        Implement Tier 0 blocking for routing rule violations.
      
      files:
        - cortex/orchestrators/core/routing_enforcement.py
      
      class_structure:
        RoutingEnforcementEngine:
          rules:
            - ROUTING-001: Keywords must map to orchestrators
            - ROUTING-002: Confidence must exceed threshold
            - ROUTING-003: Fallback orchestrators required
            - ROUTING-004: Audit trail required
          
          methods:
            - validate_routing_decision(decision: RoutingDecision) → Result[bool]
            - check_orchestrator_exists(name: str) → Result[bool]
            - check_confidence_threshold(confidence: float) → Result[bool]
            - enforce_blocking_rules(decision: RoutingDecision) → Result[bool]
      
      tests:
        - test_routing_enforcement_orchestrator_exists
        - test_routing_enforcement_confidence_threshold
        - test_routing_enforcement_fallback_required
        - test_routing_enforcement_blocking_mode
        - test_routing_enforcement_audit_logging
      
      loc: 120
      effort: "2 days"
      status: "PLANNED"

    - id: "ROUTE-006"
      name: "Integration Tests (End-to-End)"
      description: |
        Verify complete user request → orchestrator flow.
      
      test_scenarios:
        - scenario: "Onboarding request"
          input: "Use CORTEX LENS to onboard repo: XYZ"
          expected_orchestrator: "OnboardingOrchestrator"
          expected_confidence: ">0.9"
        
        - scenario: "LENS analysis request"
          input: "Analyze code complexity with LENS"
          expected_orchestrator: "LENSOrchestrator"
          expected_confidence: ">0.85"
        
        - scenario: "Ambiguous request (multiple candidates)"
          input: "Setup the project"
          expected_orchestrators: ["OnboardingOrchestrator", "SetupOrchestrator"]
          expected_confidence: ">0.6"
        
        - scenario: "Enforcement blocking (low confidence)"
          input: "xyz abc 123"
          expected_result: "BLOCKED"
          expected_error: "Confidence below threshold"
      
      files:
        - tests/integration/orchestrators/test_unified_routing.py
      
      tests: 15
      loc: 300
      effort: "3 days"
      status: "PLANNED"

  deliverables:
    - Extended intent-routing.yaml with orchestrator mappings
    - OrchestratorLookup adapter class
    - Enhanced IntentRouter with keyword extraction
    - Updated RoutingDecision dataclass
    - RoutingEnforcementEngine (Tier 0 blocking)
    - 25+ unit tests
    - 15+ integration tests
    - Documentation: Routing architecture diagram

  acceptance_criteria:
    - "✅ All user requests map to orchestrator instances (not handler names)"
    - "✅ Keyword-based routing achieves 90%+ accuracy"
    - "✅ Fallback orchestrators honored for ambiguous requests"
    - "✅ Confidence threshold enforced (default: 0.6)"
    - "✅ Routing violations blocked in Tier 0 enforcement"
    - "✅ Audit trail captures all routing decisions"
    - "✅ Performance: <10ms routing latency (p95)"
    - "✅ Zero handler name references in production code"

# ============================================================================
# PHASE 8.3: SEMANTIC RANKING (EDGE CASE HANDLING)
# ============================================================================

phase_8_3:
  name: "Semantic Ranking + Disambiguation"
  timeline: "1 week (Sprint 3)"
  status: "PLANNED"
  
  tasks:
    - id: "SEMANTIC-001"
      name: "Implement Candidate Ranking Algorithm"
      description: |
        Rank multiple candidate orchestrators by confidence.
      
      algorithm:
        scoring_factors:
          - keyword_overlap: 0.5  # 50% weight
          - intent_alignment: 0.3 # 30% weight
          - capability_match: 0.2 # 20% weight
        
        formula: |
          confidence = (
            (matched_keywords / total_keywords) * 0.5 +
            (intent_match_score) * 0.3 +
            (capability_overlap) * 0.2
          )
      
      loc: 100
      effort: "2 days"

    - id: "SEMANTIC-002"
      name: "Interactive Disambiguation UI"
      description: |
        Show top 3 candidates when confidence < threshold.
      
      example_output: |
        🤔 Ambiguous Request - Multiple Orchestrators Available
        
        Your request: "Setup the project"
        
        Select orchestrator:
          1. ✅ OnboardingOrchestrator (confidence: 0.72)
             └─ Keywords matched: setup, project, initialize
          2. ⚙️  SetupOrchestrator (confidence: 0.68)
             └─ Keywords matched: setup, configure
          3. 📋 PlanningOrchestrator (confidence: 0.54)
             └─ Keywords matched: project, plan
        
        Reply: 1, 2, or 3
      
      loc: 80
      effort: "1 day"

    - id: "SEMANTIC-003"
      name: "Integration Tests for Edge Cases"
      description: |
        Test ambiguous requests, synonym handling, edge cases.
      
      tests: 12
      loc: 250
      effort: "2 days"

  deliverables:
    - Candidate ranking algorithm
    - Interactive disambiguation UI
    - 12+ edge case tests
    - Documentation: Disambiguation flow

  acceptance_criteria:
    - "✅ Ambiguous requests (confidence <0.7) trigger disambiguation"
    - "✅ Top 3 candidates shown with confidence scores"
    - "✅ User selection updates routing decision"
    - "✅ Edge cases achieve 95%+ resolution rate"

