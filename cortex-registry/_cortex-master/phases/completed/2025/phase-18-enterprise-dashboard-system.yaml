# PHASE-18: Enterprise Repository Dashboard System
# Version: 1.0 | Created: 2026-02-01
# Scope: Enterprise-Scale Static Dashboard with Vulnerabilities Analysis
# Authority: cortex-architect.prompt.md
# Target Repo: D:\PROJECTS\KASHKOLE (for development), scalable to enterprise

---
metadata:
  phase: "18"
  title: "Enterprise Repository Dashboard System"
  status: "PLANNING"
  author: "Asif Hussain"
  created: "2026-02-01"
  priority: "P0"
  estimated_effort: "5-7 days"
  governance:
    - "ARCH-011: Execute to completion"
    - "CORE-035: Single canonical implementation (single adaptive template)"
    - "CORE-008: Tests BEFORE code (TDD)"
    - "CORE-036: Industry standards compliance"
  depends_on:
    - "PHASE-15-STATIC-REPO-VISUALIZATION.yaml"
  supersedes:
    - ".archive/PHASE-14-LENS-DASHBOARD.yaml"
    - ".archive/PHASE-14-LENS-DASHBOARD-IMPLEMENTATION.yaml"
    - ".archive/PHASE-14.5-UNIVERSAL-DASHBOARD.yaml"

---
# ============================================================================
# VISION: ENTERPRISE-SCALE REPOSITORY DASHBOARD
# ============================================================================

vision:
  goal: |
    Create an enterprise-grade static dashboard system that:
    - Handles repos from 10 files to 500K+ files gracefully
    - Leverages 40+ CORTEX best-practices YAMLs for vulnerability detection
    - Uses single adaptive template with intelligent size adjustment
    - Generates static HTML (file:// protocol compatible)
    - Is fully test-harnessed with per-tab test suites
    
  target_repository: "D:\\PROJECTS\\KASHKOLE"
  future_scope: "All repositories via MCP tool exposure"
  
  principles:
    - "Single Adaptive Template": One template, config-driven rendering
    - "Test-First": All tabs have dedicated test suites
    - "Best Practices Integration": Vulnerabilities from 40+ YAMLs
    - "Enterprise Scale": Handles 500+ classes, 100K+ LOC
    - "Static First": No HTTP server required

---
# ============================================================================
# ARCHITECTURE: SINGLE ADAPTIVE TEMPLATE
# ============================================================================

architecture:
  decision: "SINGLE ADAPTIVE TEMPLATE (approved per chat01.txt)"
  rationale:
    - "DRY compliance (CORE-035)"
    - "1x maintenance vs 4x for multiple templates"
    - "Feature parity always in sync"
    - "Test once with data variations"
  
  components:
    template_engine:
      file: "company/dashboards/templates/dashboard_template.html.j2"
      type: "Jinja2 template"
      features:
        - "Conditional rendering based on size tier"
        - "Grid/card components for all data sections"
        - "Vertical sub-tabs within horizontal tabs"
        - "Lazy loading triggers for enterprise scale"
    
    data_analyzer:
      file: "company/dashboards/core/repo_analyzer.py"
      purpose: "Classify repository size and generate rendering config"
      outputs:
        - "Size tier (small/medium/large/enterprise)"
        - "Rendering config (max items, pagination, etc.)"
        - "Feature flags for adaptive display"
    
    vulnerability_analyzer:
      file: "company/dashboards/core/vulnerability_analyzer.py"
      purpose: "Analyze code against 40+ CORTEX best-practices YAMLs"
      sources:
        - "cortex/knowledge/best-practices/architecture/*.yaml"
        - "cortex/knowledge/best-practices/security/*.yaml"
        - "cortex/knowledge/best-practices/backend-python/*.yaml"
        - "cortex/knowledge/best-practices/testing-validation/*.yaml"
      outputs:
        - "Code smells (God Object, Spaghetti Code, etc.)"
        - "Security vulnerabilities (OWASP Top 10)"
        - "Design anti-patterns"
        - "Best practice violations"
    
    dashboard_generator:
      file: "company/dashboards/generate_enterprise_dashboard.py"
      purpose: "Main orchestrator for dashboard generation"
      features:
        - "Single entry point for all repo sizes"
        - "Calls repo_analyzer → vulnerability_analyzer → template"
        - "Outputs static HTML files"

---
# ============================================================================
# SIZE TIERS: AUTO-INTELLIGENT ADJUSTMENT
# ============================================================================

size_tiers:
  small:
    threshold: "< 100 files"
    characteristics:
      - "Show ALL items inline"
      - "No pagination"
      - "Simple D3.js visualizations"
      - "All tabs rendered immediately"
    rendering_config:
      max_list_items: null  # Show all
      show_pagination: false
      lazy_load_tabs: false
      d3_max_nodes: 50
      show_details_inline: true
      grid_columns: 2
  
  medium:
    threshold: "100-1,000 files"
    characteristics:
      - "Show top 20 with 'Show more' buttons"
      - "Standard D3.js graphs"
      - "Collapsible sections"
    rendering_config:
      max_list_items: 20
      show_pagination: false
      lazy_load_tabs: false
      d3_max_nodes: 75
      show_details_inline: true
      grid_columns: 3
  
  large:
    threshold: "1,000-10,000 files"
    characteristics:
      - "Show top 10 with pagination"
      - "Lazy-loaded visualizations"
      - "Virtual scrolling for lists"
    rendering_config:
      max_list_items: 10
      show_pagination: true
      lazy_load_tabs: true
      d3_max_nodes: 100
      show_details_inline: false
      grid_columns: 4
      show_summary_cards: true
  
  enterprise:
    threshold: "> 10,000 files OR > 500 classes OR > 100K LOC"
    characteristics:
      - "Summary cards only (counts, metrics)"
      - "On-demand detail loading"
      - "Truncated graphs (top 50 nodes max)"
      - "Export full data option"
    rendering_config:
      max_list_items: 5
      show_pagination: true
      lazy_load_tabs: true
      d3_max_nodes: 50  # Limit for performance
      show_details_inline: false
      show_export_option: true
      grid_columns: 4
      show_summary_cards: true
      enable_search_filter: true

---
# ============================================================================
# TAB STRUCTURE: HORIZONTAL + VERTICAL SUB-TABS
# ============================================================================

tab_structure:
  layout: "Horizontal top tabs with vertical left-justified sub-tabs"
  
  tabs:
    - id: "overview"
      label: "Overview"
      icon: "📊"
      sub_tabs: null  # No sub-tabs, single view
      content:
        - "Repository health score"
        - "Key metrics cards (files, classes, LOC, dependencies)"
        - "Quick navigation tiles"
        - "Recent activity summary"
    
    - id: "architecture"
      label: "Architecture"
      icon: "🏗️"
      sub_tabs:
        - id: "structure"
          label: "Directory Structure"
          vertical_position: "left"
        - id: "dependencies"
          label: "Dependencies"
          vertical_position: "left"
        - id: "layers"
          label: "Layer Analysis"
          vertical_position: "left"
      content:
        - "Directory tree visualization (D3.js treemap)"
        - "Dependency graph (D3.js force-directed)"
        - "Layer diagram (presentation → domain → infrastructure)"
    
    - id: "quality"
      label: "Code Quality"
      icon: "✨"
      sub_tabs:
        - id: "metrics"
          label: "Metrics"
          vertical_position: "left"
        - id: "complexity"
          label: "Complexity"
          vertical_position: "left"
        - id: "duplication"
          label: "Duplication"
          vertical_position: "left"
      content:
        - "Cyclomatic complexity per file"
        - "Lines of code distribution"
        - "Code duplication analysis"
        - "Technical debt indicators"
    
    - id: "vulnerabilities"
      label: "Vulnerabilities"
      icon: "⚠️"
      priority: "P1 - NEW TAB"
      description: "Code issues, code smells, bad design practices from CORTEX best-practices YAMLs"
      sub_tabs:
        - id: "code-smells"
          label: "Code Smells"
          vertical_position: "left"
        - id: "anti-patterns"
          label: "Anti-Patterns"
          vertical_position: "left"
        - id: "security"
          label: "Security"
          vertical_position: "left"
        - id: "best-practices"
          label: "Best Practices"
          vertical_position: "left"
      content:
        - "God Object detection"
        - "Spaghetti Code detection"
        - "SOLID violations"
        - "OWASP Top 10 vulnerabilities"
        - "Missing input validation"
        - "Hardcoded secrets"
        - "Design pattern violations"
      data_sources:
        - source: "cortex/knowledge/best-practices/architecture/engineering-anti-patterns.yaml"
          detections:
            - "God Object (class >1000 LOC or >30 methods)"
            - "Spaghetti Code (cyclomatic complexity >20)"
            - "Deep Inheritance (>5 levels)"
            - "Copy-Paste Programming"
        - source: "cortex/knowledge/best-practices/architecture/engineering-solid-principles.yaml"
          detections:
            - "Single Responsibility violations"
            - "Open-Closed violations"
            - "Interface Segregation violations"
        - source: "cortex/knowledge/best-practices/security/owasp-top-10.yaml"
          detections:
            - "A01 - Broken Access Control"
            - "A02 - Cryptographic Failures"
            - "A03 - Injection"
            - "A07 - Identification and Authentication Failures"
        - source: "cortex/knowledge/best-practices/security/secure-coding-practices.yaml"
          detections:
            - "Hardcoded credentials"
            - "Missing input validation"
            - "Insecure randomness"
        - source: "cortex/knowledge/best-practices/backend-python/clean-code.yaml"
          detections:
            - "Naming convention violations"
            - "Function too long"
            - "Too many parameters"
    
    - id: "security"
      label: "Security"
      icon: "🔒"
      sub_tabs:
        - id: "secrets"
          label: "Secrets Scan"
          vertical_position: "left"
        - id: "dependencies"
          label: "Dependency Audit"
          vertical_position: "left"
        - id: "owasp"
          label: "OWASP Compliance"
          vertical_position: "left"
      content:
        - "Hardcoded secrets detection"
        - "CVE vulnerability scan"
        - "OWASP Top 10 compliance matrix"
    
    - id: "dependencies"
      label: "Dependencies"
      icon: "📦"
      sub_tabs:
        - id: "packages"
          label: "Packages"
          vertical_position: "left"
        - id: "versions"
          label: "Versions"
          vertical_position: "left"
        - id: "graph"
          label: "Dependency Graph"
          vertical_position: "left"
      content:
        - "Package list with versions"
        - "Outdated dependency warnings"
        - "Dependency tree visualization"
    
    - id: "testing"
      label: "Testing"
      icon: "🧪"
      sub_tabs:
        - id: "coverage"
          label: "Coverage"
          vertical_position: "left"
        - id: "tests"
          label: "Test Files"
          vertical_position: "left"
      content:
        - "Test coverage metrics"
        - "Test file inventory"
        - "Testing pyramid analysis"

---
# ============================================================================
# VISUALIZATION LIBRARIES (STATIC COMPATIBLE)
# ============================================================================

visualization:
  primary:
    library: "D3.js"
    version: "7.x"
    use_cases:
      - "Force-directed graphs (dependencies, architecture)"
      - "Treemaps (directory structure)"
      - "Hierarchical trees (AST, inheritance)"
      - "Sankey diagrams (data flow)"
    static_compatible: true
    embedding: "Inline in HTML"
  
  secondary:
    library: "Chart.js"
    version: "4.x"
    use_cases:
      - "Bar charts (metrics comparison)"
      - "Pie/doughnut charts (distribution)"
      - "Line charts (trends)"
      - "Radar charts (code quality)"
    static_compatible: true
    embedding: "Inline in HTML"
  
  excluded:
    - library: "Mermaid.js"
      reason: "Does not work with static file:// protocol"
    - library: "Plotly.js"
      reason: "3MB+ size, CDN preferred"

---
# ============================================================================
# STYLING: APPROVED REFERENCES
# ============================================================================

styling:
  inspiration:
    - file: "docs/index.html"
      elements:
        - "Dark blue glassmorphism theme"
        - "Gradient backgrounds"
        - "Card-based layouts"
    - file: "_workspaces/approved-orchestrator-view/index.html"
      elements:
        - "Multi-column grid cards"
        - "Tile-based navigation"
        - "Subtle animations"
  
  principles:
    - "Multi-column grid cards (NOT static row-based data)"
    - "Vertical left-justified sub-tabs within tabs"
    - "Glassmorphism cards with subtle hover effects"
    - "Responsive grid (2-col mobile, 3-col tablet, 4-col desktop)"
    - "Color-coded severity indicators"
  
  css_framework: "Custom CSS (no external dependencies for static)"
  
  grid_layout:
    overview:
      columns: "4 (desktop) / 2 (mobile)"
      card_types:
        - "Metric card (number + label + trend)"
        - "Status card (icon + status + description)"
        - "Navigation tile (icon + label + link)"
    
    detail_views:
      columns: "3 (desktop) / 1 (mobile)"
      card_types:
        - "File card (name + metrics + status)"
        - "Issue card (severity + title + description + location)"
        - "Chart card (title + D3/Chart.js visualization)"

---
# ============================================================================
# TEST INFRASTRUCTURE (P0 - TDD)
# ============================================================================

testing:
  location: "company/dashboards/kashkole/tests/"
  framework: "pytest + html-linter"
  
  principles:
    - "Separate test file per tab (extensibility)"
    - "Zero warnings/errors from HTML lint"
    - "Scalability mindset (parameterized tests)"
  
  test_suites:
    html_lint:
      file: "test_html_lint.py"
      purpose: "Validate HTML syntax, zero warnings/errors"
      tests:
        - name: "test_html_valid_syntax"
          description: "Parse HTML, no syntax errors"
        - name: "test_html_no_lint_warnings"
          description: "html5lib lint returns zero warnings"
        - name: "test_html_no_broken_links"
          description: "All internal links resolve"
        - name: "test_html_accessibility"
          description: "ARIA labels, alt text present"
    
    test_overview_tab:
      file: "test_tab_overview.py"
      purpose: "Validate Overview tab content and rendering"
      tests:
        - name: "test_overview_health_score_present"
        - name: "test_overview_metrics_cards_count"
        - name: "test_overview_navigation_tiles_functional"
        - name: "test_overview_responsive_grid"
    
    test_architecture_tab:
      file: "test_tab_architecture.py"
      purpose: "Validate Architecture tab with sub-tabs"
      tests:
        - name: "test_architecture_subtabs_present"
        - name: "test_architecture_structure_tree"
        - name: "test_architecture_dependency_graph"
        - name: "test_architecture_layer_diagram"
    
    test_quality_tab:
      file: "test_tab_quality.py"
      purpose: "Validate Code Quality tab"
      tests:
        - name: "test_quality_subtabs_present"
        - name: "test_quality_metrics_display"
        - name: "test_quality_complexity_chart"
        - name: "test_quality_duplication_detection"
    
    test_vulnerabilities_tab:
      file: "test_tab_vulnerabilities.py"
      purpose: "Validate Vulnerabilities tab (NEW)"
      tests:
        - name: "test_vulnerabilities_subtabs_present"
          assertions:
            - "Code Smells sub-tab exists"
            - "Anti-Patterns sub-tab exists"
            - "Security sub-tab exists"
            - "Best Practices sub-tab exists"
        - name: "test_vulnerabilities_code_smells_detection"
          assertions:
            - "God Object detection works"
            - "Spaghetti Code detection works"
        - name: "test_vulnerabilities_anti_patterns_display"
        - name: "test_vulnerabilities_security_issues"
        - name: "test_vulnerabilities_best_practices_violations"
        - name: "test_vulnerabilities_severity_indicators"
    
    test_security_tab:
      file: "test_tab_security.py"
      purpose: "Validate Security tab"
      tests:
        - name: "test_security_subtabs_present"
        - name: "test_security_secrets_scan"
        - name: "test_security_dependency_audit"
        - name: "test_security_owasp_compliance"
    
    test_dependencies_tab:
      file: "test_tab_dependencies.py"
      purpose: "Validate Dependencies tab"
      tests:
        - name: "test_dependencies_subtabs_present"
        - name: "test_dependencies_package_list"
        - name: "test_dependencies_version_warnings"
        - name: "test_dependencies_graph_rendering"
    
    test_testing_tab:
      file: "test_tab_testing.py"
      purpose: "Validate Testing tab"
      tests:
        - name: "test_testing_subtabs_present"
        - name: "test_testing_coverage_display"
        - name: "test_testing_test_inventory"
    
    test_adaptive_rendering:
      file: "test_adaptive_rendering.py"
      purpose: "Validate size-tier adaptive behavior"
      tests:
        - name: "test_small_repo_shows_all_items"
          data: "< 100 files"
        - name: "test_medium_repo_shows_20_with_more_button"
          data: "500 files"
        - name: "test_large_repo_pagination"
          data: "5000 files"
        - name: "test_enterprise_repo_summary_cards"
          data: "50000 files, 500 classes"
    
    test_scale_simulation:
      file: "test_scale_simulation.py"
      purpose: "Test with simulated enterprise data"
      tests:
        - name: "test_500_classes_performance"
          simulated_data:
            classes: 500
            files: 10000
            loc: 150000
        - name: "test_1000_classes_performance"
          simulated_data:
            classes: 1000
            files: 50000
            loc: 500000
        - name: "test_render_time_under_5_seconds"

---
# ============================================================================
# IMPLEMENTATION PHASES
# ============================================================================

implementation_phases:
  phase_18_1:
    name: "Test Infrastructure Setup"
    priority: "P0"
    effort: "4 hours"
    tasks:
      - task: "Create test directory structure"
        file: "company/dashboards/kashkole/tests/__init__.py"
      - task: "Install test dependencies"
        packages:
          - "pytest"
          - "html5lib"
          - "beautifulsoup4"
          - "pytest-html"
      - task: "Create HTML lint test base"
        file: "company/dashboards/kashkole/tests/test_html_lint.py"
      - task: "Create conftest.py with fixtures"
        file: "company/dashboards/kashkole/tests/conftest.py"
    deliverables:
      - "Test infrastructure ready"
      - "HTML lint tests passing (or failing on known issues)"
  
  phase_18_2:
    name: "Vulnerability Analyzer"
    priority: "P1"
    effort: "8 hours"
    depends_on: ["phase_18_1"]
    tasks:
      - task: "Create VulnerabilityAnalyzer class"
        file: "company/dashboards/core/vulnerability_analyzer.py"
        features:
          - "Load and parse best-practices YAMLs"
          - "Code smell detection engine"
          - "Anti-pattern matching"
          - "Security vulnerability scanner"
      - task: "Integrate with 40+ best-practices YAMLs"
        sources:
          - "cortex/knowledge/best-practices/architecture/engineering-anti-patterns.yaml"
          - "cortex/knowledge/best-practices/architecture/engineering-solid-principles.yaml"
          - "cortex/knowledge/best-practices/security/owasp-top-10.yaml"
          - "cortex/knowledge/best-practices/security/secure-coding-practices.yaml"
          - "cortex/knowledge/best-practices/backend-python/clean-code.yaml"
      - task: "Create detection rules from YAMLs"
        rules:
          - "God Object: class >1000 LOC or >30 methods"
          - "Spaghetti Code: cyclomatic complexity >20"
          - "Copy-Paste: duplicate code >5%"
          - "Deep Inheritance: >5 levels"
          - "Hardcoded secrets: regex patterns"
    deliverables:
      - "VulnerabilityAnalyzer class"
      - "Detection rules for 15+ anti-patterns"
      - "Unit tests for analyzer"
  
  phase_18_3:
    name: "Adaptive Template System"
    priority: "P1"
    effort: "6 hours"
    depends_on: ["phase_18_1"]
    tasks:
      - task: "Create RenderingConfig dataclass"
        file: "company/dashboards/core/rendering_config.py"
      - task: "Create RepoAnalyzer for size classification"
        file: "company/dashboards/core/repo_analyzer.py"
      - task: "Create Jinja2 template with adaptive rendering"
        file: "company/dashboards/templates/dashboard_template.html.j2"
        features:
          - "Conditional rendering based on size tier"
          - "Horizontal tabs with vertical sub-tabs"
          - "Multi-column grid cards"
          - "Pagination components"
          - "Lazy loading placeholders"
    deliverables:
      - "Single adaptive template"
      - "Size classification logic"
      - "Rendering config system"
  
  phase_18_4:
    name: "Vulnerabilities Tab Implementation"
    priority: "P1"
    effort: "8 hours"
    depends_on: ["phase_18_2", "phase_18_3"]
    tasks:
      - task: "Add Vulnerabilities tab to template"
        sub_tabs:
          - "Code Smells"
          - "Anti-Patterns"
          - "Security"
          - "Best Practices"
      - task: "Create vulnerability cards component"
        features:
          - "Severity indicator (critical/high/medium/low)"
          - "Issue title and description"
          - "File location with line number"
          - "Recommended fix"
      - task: "Create vulnerability tests"
        file: "company/dashboards/kashkole/tests/test_tab_vulnerabilities.py"
    deliverables:
      - "Vulnerabilities tab with 4 sub-tabs"
      - "Vulnerability cards with severity"
      - "Full test coverage"
  
  phase_18_5:
    name: "Enterprise Scale Testing"
    priority: "P1"
    effort: "4 hours"
    depends_on: ["phase_18_3", "phase_18_4"]
    tasks:
      - task: "Create data simulator"
        file: "company/dashboards/testing/data_simulator.py"
        features:
          - "Generate 500 class scenario"
          - "Generate 100K LOC scenario"
          - "Generate 10K files scenario"
      - task: "Performance benchmark tests"
        file: "company/dashboards/kashkole/tests/test_scale_simulation.py"
      - task: "Verify adaptive rendering at all tiers"
    deliverables:
      - "Simulated enterprise data"
      - "Performance benchmarks"
      - "Adaptive rendering validated"
  
  phase_18_6:
    name: "Dashboard Generation Orchestrator"
    priority: "P1"
    effort: "4 hours"
    depends_on: ["phase_18_4", "phase_18_5"]
    tasks:
      - task: "Create main generator script"
        file: "company/dashboards/generate_enterprise_dashboard.py"
        features:
          - "CLI interface"
          - "Repository path input"
          - "Output path configuration"
          - "Size tier override option"
      - task: "Integration tests"
        file: "company/dashboards/kashkole/tests/test_integration.py"
    deliverables:
      - "Working dashboard generator"
      - "KASHKOLE dashboard generated"
      - "All tests passing"
  
  phase_18_7:
    name: "Visual Polish & Documentation"
    priority: "P2"
    effort: "4 hours"
    depends_on: ["phase_18_6"]
    tasks:
      - task: "Apply glassmorphism styling"
        reference: "docs/index.html"
      - task: "Add D3.js visualizations"
        visualizations:
          - "Dependency force graph"
          - "Directory treemap"
          - "Vulnerability distribution pie"
      - task: "Add Chart.js charts"
        charts:
          - "Code quality radar"
          - "LOC distribution bar"
          - "Complexity histogram"
      - task: "Create README.md"
        file: "company/dashboards/README.md"
    deliverables:
      - "Polished visual design"
      - "Interactive visualizations"
      - "Documentation"

---
# ============================================================================
# FUTURE MIGRATION: ENTERPRISE GENERALIZATION
# ============================================================================

future_migration:
  phase: "19 (Future)"
  title: "Enterprise Generalization & MCP Exposure"
  timeline: "After Phase 18 complete and validated"
  
  goals:
    - "Generalize from KASHKOLE to any repository"
    - "Expose via MCP tools"
    - "Support multi-repo dashboards"
    - "CI/CD integration"
  
  mcp_tools:
    cortex_generate_dashboard:
      description: "Generate repository dashboard"
      parameters:
        - name: "repo_path"
          type: "string"
          required: true
        - name: "output_path"
          type: "string"
          required: false
        - name: "size_tier_override"
          type: "string"
          enum: ["small", "medium", "large", "enterprise"]
          required: false
      returns:
        - "dashboard_path: string"
        - "metrics: dict"
        - "vulnerabilities_count: int"
    
    cortex_analyze_vulnerabilities:
      description: "Analyze repository for vulnerabilities"
      parameters:
        - name: "repo_path"
          type: "string"
          required: true
        - name: "severity_threshold"
          type: "string"
          enum: ["critical", "high", "medium", "low"]
          required: false
      returns:
        - "vulnerabilities: list[dict]"
        - "summary: dict"
  
  orchestrator_wiring:
    DashboardOrchestrator:
      location: "cortex/orchestrators/support/dashboard_orchestrator.py"
      responsibilities:
        - "Dashboard generation coordination"
        - "Multi-repo aggregation"
        - "Scheduled regeneration"
    
    VulnerabilityAnalysisOrchestrator:
