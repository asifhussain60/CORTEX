---
# ============================================================================
# PHASE 18.8: AUTOMATED DASHBOARD GENERATION SYSTEM
# ============================================================================

phase_18_8:
  title: "Automated Dashboard Generation & Validation System"
  objective: |
    Generate tested, validated dashboards for all 5 simulation tiers with
    automated CI validation and MCP exposure for enterprise consumption.
  
  motivation:
    problem: |
      Simulation data exists (repo-S, repo-M, repo-L, repo-XL, repo-enterprise)
      but no automated way to generate, validate, and deploy dashboards for each tier.
      Manual generation is error-prone and doesn't scale.
    
    solution: |
      Single generator script + validation suite + CI workflow ensures:
      - All tiers get dashboards automatically
      - HTML structure, accessibility, data rendering validated
      - Broken dashboards blocked by CI gates
      - MCP tool exposure for enterprise automation
  
  deliverables:
    dashboard_files:
      - path: "company/dashboards/kashkole/repo-simulation/repo-S/dashboard-small.html"
        description: "Small tier dashboard (89 files, 9 vulnerabilities)"
      - path: "company/dashboards/kashkole/repo-simulation/repo-M/dashboard-medium.html"
        description: "Medium tier dashboard (892 files, 25 vulnerabilities)"
      - path: "company/dashboards/kashkole/repo-simulation/repo-L/dashboard-large.html"
        description: "Large tier dashboard (8.5K files, 66 vulnerabilities)"
      - path: "company/dashboards/kashkole/repo-simulation/repo-XL/dashboard-xlarge.html"
        description: "XLarge tier dashboard (35K files, 188 vulnerabilities)"
      - path: "company/dashboards/kashkole/repo-simulation/repo-enterprise/dashboard-ent.html"
        description: "Enterprise tier dashboard (125K files, 618 vulnerabilities)"
    
    generator_script:
      - path: "company/dashboards/generate_dashboard_suite.py"
        purpose: |
          Main generator that:
          1. Reads each tier's simulation data (repo_metrics, database_schema, vulnerabilities, etc.)
          2. Calls dashboard_template.html.j2 with tier-specific config
          3. Outputs HTML to repo-simulation/{tier}/dashboard-{tier}.html
          4. Validates output structure and reports errors
        features:
          - "Single entry point for all 5 tiers"
          - "Parallel generation for speed"
          - "Error handling with detailed reporting"
          - "Graceful degradation on missing data"
        security:
          - "HTML escaping via Jinja2 autoescape"
          - "Path validation (no traversal)"
          - "Size limits (max 50MB per dashboard)"
    
    validation_suite:
      - path: "company/dashboards/tests/test_dashboard_suite.py"
        purpose: "Automated validation of all generated dashboards"
        test_categories:
          html_structure:
            - "Valid HTML5 (no parse errors)"
            - "Required sections present (Overview, Architecture, Vulnerabilities, etc.)"
            - "All tabs functional (no broken JS)"
          accessibility:
            - "WCAG 2.1 Level AA compliance"
            - "Semantic HTML (proper heading hierarchy)"
            - "ARIA labels for interactive elements"
          data_rendering:
            - "Metrics displayed correctly (file count, LOC, vulnerabilities)"
            - "Charts render (D3.js, Chart.js)"
            - "Tables populated with simulation data"
          visual_regression:
            - "Layout matches expected structure"
            - "No CSS render errors"
            - "Responsive breakpoints work"
          performance:
            - "Dashboard loads in <5s (enterprise tier)"
            - "JS bundle <1MB"
            - "Images optimized"
    
    ci_workflow:
      - path: ".github/workflows/dashboard-validation.yml"
        purpose: "Automated dashboard generation and validation on simulation data changes"
        triggers:
          - "Push to company/dashboards/kashkole/repo-simulation/**/*.json"
          - "Pull request affecting dashboard generator or templates"
        steps:
          - "Checkout code"
          - "Setup Python + dependencies"
          - "Run generate_dashboard_suite.py"
          - "Run test_dashboard_suite.py"
          - "Upload dashboards as artifacts"
          - "Fail build if validation fails"
    
    mcp_exposure:
      - tool_name: "cortex_generate_dashboard_suite"
        module: "cortex.mcp.tools.dashboard_generator"
        purpose: "Generate dashboards for all simulation tiers via MCP"
        parameters:
          output_dir: "Base directory for dashboard output"
          tiers: "List of tiers to generate (default: all)"
          validate: "Run validation after generation (default: true)"
        returns:
          generated_files: "List of generated dashboard paths"
          validation_results: "Per-dashboard validation status"
          errors: "List of errors encountered"
  
  implementation_phases:
    phase_1_generator_script:
      title: "Create Dashboard Generator Script"
      tasks:
        - "Create company/dashboards/generate_dashboard_suite.py"
        - "Implement tier detection (read repo_metrics.json)"
        - "Implement template rendering with tier config"
        - "Add error handling and validation"
        - "Add CLI interface (--tier, --output, --validate)"
      tests:
        - "Test with all 5 simulation tiers"
        - "Test missing JSON files (graceful degradation)"
        - "Test invalid JSON structure (error reporting)"
      
    phase_2_validation_suite:
      title: "Create Validation Test Suite"
      tasks:
        - "Create company/dashboards/tests/test_dashboard_suite.py"
        - "Implement HTML structure tests (pytest-html)"
        - "Implement accessibility tests (axe-core via selenium)"
        - "Implement data rendering tests (BeautifulSoup)"
        - "Implement visual regression tests (pytest-playwright)"
      tests:
        - "Run validation against all 5 generated dashboards"
        - "Verify all test categories pass"
    
    phase_3_ci_integration:
      title: "Add CI Workflow"
      tasks:
        - "Create .github/workflows/dashboard-validation.yml"
        - "Configure triggers (simulation data changes)"
        - "Add generation + validation steps"
        - "Add artifact upload for dashboards"
        - "Add failure notifications"
      tests:
        - "Trigger workflow manually (workflow_dispatch)"
        - "Verify dashboards generated and uploaded"
        - "Verify validation failures block merge"
    
    phase_4_mcp_exposure:
      title: "Expose via MCP Tool"
      tasks:
        - "Create cortex/mcp/tools/dashboard_generator.py"
        - "Implement cortex_generate_dashboard_suite tool"
        - "Register in MCPToolsCatalog"
        - "Add to CORTEX.prompt.md quick commands"
      tests:
        - "Test via MCP /tools endpoint"
        - "Verify tool execution returns correct structure"
  
  security_considerations:
    xss_prevention:
      - "Jinja2 autoescape enabled (default)"
      - "No user input in HTML attributes"
      - "All simulation data sanitized before rendering"
    
    path_traversal:
      - "Output paths validated (must be under company/dashboards/)"
      - "Input paths validated (must be under repo-simulation/)"
      - "Use Path.resolve() to prevent symlink attacks"
    
    dos_mitigation:
      - "Dashboard size limit: 50MB per file"
      - "Timeout: 60s per dashboard generation"
      - "Memory limit: 2GB per generator process"
  
  edge_cases:
    missing_data:
      behavior: "Graceful degradation — skip missing sections, log warning"
      example: "If vulnerabilities.json missing, show 'No vulnerability data available'"
    
    invalid_json:
      behavior: "Error reporting — fail generation, log detailed error"
      example: "If repo_metrics.json malformed, report parsing error with line number"
    
    empty_datasets:
      behavior: "Render empty state — show 'No data found' message"
      example: "If no dependencies, show 'No dependencies detected'"
    
    extremely_large_data:
      behavior: "Pagination — limit items per section, add 'Load More' button"
      example: "Enterprise tier: show first 100 vulnerabilities, paginate rest"
  
  validation_checklist:
    before_commit:
      - "[ ] All 5 dashboards generated successfully"
      - "[ ] test_dashboard_suite.py passes for all tiers"
      - "[ ] HTML lint tests pass (no errors/warnings)"
      - "[ ] Dashboards open in browser (file:// protocol)"
      - "[ ] All tabs functional (click test each tab)"
      - "[ ] Vulnerabilities data renders correctly"
    
    before_merge:
      - "[ ] CI workflow passes"
      - "[ ] MCP tool registered and functional"
      - "[ ] Documentation updated (README.md)"
      - "[ ] No security violations (OWASP checks)"
  
  success_metrics:
    generation:
      - "All 5 dashboards generated in <30s (parallel)"
      - "Zero generation errors"
      - "All sections populated with data"
    
    validation:
      - "100% HTML structure tests pass"
      - "100% accessibility tests pass (WCAG 2.1 AA)"
      - "100% data rendering tests pass"
    
    automation:
      - "CI workflow triggers on simulation data changes"
      - "Validation failures block merge"
      - "MCP tool callable from external systems"

# End of Phase 18 Plan
