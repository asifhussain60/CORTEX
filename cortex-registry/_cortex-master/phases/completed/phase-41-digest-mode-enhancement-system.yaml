# Stage 2: Quantitative Metrics System
stage_2:
  name: "Quantitative Confidence Scoring"
  description: |
    Implement confidence scoring system (5-10 scale) for enhancement quality:
    - Pattern match strength (0-3 points)
    - Context relevance (0-3 points)
    - Code evidence (0-2 points)
    - Historical success rate (0-2 points)
    
    Score interpretation:
    - 9-10: Auto-apply (high confidence)
    - 7-8: Recommend (review suggested)
    - 5-6: Analyze (manual review required)
    - <5: Reject (insufficient evidence)
  
  deliverables:
    - component: "ConfidenceScorer"
      path: "cortex/learning/confidence_scorer.py"
      lines: ~350
      description: "Multi-factor confidence calculation"
      
    - component: "MetricsCollector"
      path: "cortex/learning/metrics_collector.py"
      lines: ~280
      description: "Historical success rate tracking"
      
    - component: "ScoreCalibrator"
      path: "cortex/learning/score_calibrator.py"
      lines: ~220
      description: "Dynamic threshold adjustment"
  
  tests:
    unit: 18
    integration: 5
    e2e: 2
    total: 25
  
  acceptance_criteria:
    - id: "AC-PHASE41-006"
      description: "ConfidenceScorer calculates multi-factor scores (5-10 scale)"
      tests: 8
      
    - id: "AC-PHASE41-007"
      description: "MetricsCollector tracks historical success rates"
      tests: 6
      
    - id: "AC-PHASE41-008"
      description: "ScoreCalibrator adjusts thresholds based on feedback"
      tests: 6
      
    - id: "AC-PHASE41-009"
      description: "Score interpretation gates (auto-apply vs review vs reject)"
      tests: 3
      
    - id: "AC-PHASE41-010"
      description: "Integration with DigestSessionOrchestrator"
      tests: 2
  
  estimated_duration: "3 days"

