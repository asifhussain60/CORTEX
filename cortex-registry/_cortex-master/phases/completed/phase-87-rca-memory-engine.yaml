  - id: "GAP-87-08"
    title: "URS integration — STRONG_PUNISHMENT on recurrence, STRONG_REWARD on prevention"
    severity: P1
    source: "Architecture design session (2026-02-27)"
    evidence: |
      OPJMixin already emits MILD_PUNISHMENT on failure and MILD_REWARD on success.
