            S2_CATEGORY_ANALYSIS: Analyze each category (People, Process, Technology,
              Environment, Materials, Methods)
            S3_CROSS_CATEGORY_CORRELATION: Find root causes spanning categories
            S4_ROOT_CAUSE_RANKING: Rank by impact + evidence
            S5_PREVENTION_RULE_GENERATION: Create per-category prevention rules
            S6_STORE_AND_ACTIVATE: Persist + activate
      - path: "cortex-registry/workflows/templates/intelligence/rca-prevention-gate-workflow.yaml"
        description: |
          Prevention gate integration workflow:
            S1_OPERATION_CONTEXT: Capture incoming operation + context
            S2_SIGNATURE_MATCH: Query RCA store for matching signatures
            S3_RECURRENCE_CHECK: Count occurrences of matching signature
            S4_GATE_DECISION: BLOCK (3+) / WARN (2) / INFO (1) / PASS (0)
