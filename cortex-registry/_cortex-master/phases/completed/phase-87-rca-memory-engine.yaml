            S1_SYMPTOM_CAPTURE: Record symptom and initial context
            S2_WHY_CHAIN: Iterative why analysis (min 3, max 7 levels)
            S3_ROOT_CAUSE_IDENTIFICATION: Extract root cause from deepest why
            S4_CONTRIBUTING_FACTORS: Identify amplifying factors
            S5_PREVENTION_RULE_GENERATION: Create actionable prevention rule
            S6_RECURRENCE_SIGNATURE: Compute signature for future matching
            S7_STORE_AND_ACTIVATE: Persist to RCA store + activate prevention rule
      - path: "cortex-registry/workflows/templates/intelligence/rca-fishbone-workflow.yaml"
        description: |
