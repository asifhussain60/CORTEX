# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: User observation + architecture design session (2026-02-27)
  Problem: Developers repeat the same root-cause mistakes across sessions because:
    1. OPJMixin._opj_record_failure() captures `root_cause` as free-text — no structured methodology
    2. _opj_consult() returns prior failures but is ADVISORY only — no prevention gate blocks repeats
    3. No recurrence detection across orchestrators (same root cause class, different symptoms)
    4. cortex-docs (.content/ + flat-files/) has no documentation for RCA, URS, OPJ, or Phase 83-87

  Existing infrastructure that supports this (75% already built):
    - OPJMixin: _opj_record_failure(root_cause=..., avoid_in_future=...) ✅
    - OPJReader: query_failures() sorted by confidence ✅
    - ReinforcementEngine: emit_signal() + apply_to_learning() ✅
    - EffectivenessAnalyzer: decay/promote/quarantine ✅
    - CrossSessionPatternCache: SQLite persistence ✅
    - DoRTracker: rca_data field on DoRTurn ✅

  Gap: Structured RCA framework (Five Whys, Fishbone, Fault Tree, Causal Chain)
       + Active Prevention Gate + Recurrence Signature Engine
       + Holistic cortex-docs update (154 markdown files across 7 sections + flat-files)

  Score at entry: 5.0 / 10 (learning system captures root causes but can't prevent recurrence)
  Target score: 9.0 / 10 (structured RCA + active prevention + recurrence detection + docs current)
  Baseline measurements:
    - Smoke tests: 1,443 passed
    - OPJ entries: N failure patterns with free-text root_cause
    - cortex-docs accuracy: ~70% (Phase 84 complete but no RCA/URS/OPJ docs, stale counts)
    - Recurrence prevention: 0% (no gate exists)
  Git prerequisite: main branch clean, no merge conflicts

  Design decisions:
    - ZERO new orchestrators — extends OPJMixin with 2 new methods
    - ZERO new MCP tools — extends cortex_learning with op="rca" operation
    - RCA Engine lives in cortex/intelligence/learning/ (alongside existing learning infra)
    - RCA SQLite store in .cortex-runtime/rca/ (canonical runtime data location)
    - Prevention Gate is advisory by default (warn), blockable only for P0 recurrences (3+)
    - All 154 cortex-docs markdown files systematically reviewed and updated
    - New flat-file: 21-rca-memory-engine.md
    - New diagram: diagram-24-rca-prevention-flow.md
    - New visual prompt: prompt-13-rca-memory-shield.md

