phases:

  # ── SUB-PHASE A: RCA Core Data Model ────────────────────────────────────
  - id: "phase-87-a"
    title: "RCAAnalysis dataclass + RCATemplate enum + RCAEngine core methods"
    priority: P0
    status: COMPLETE
    gap_refs: ["GAP-87-01", "GAP-87-02"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥1,443 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    new_files:
      - path: "cortex/intelligence/learning/rca_engine.py"
        description: |
          RCATemplate enum: FIVE_WHYS, FISHBONE, FAULT_TREE, CAUSAL_CHAIN, CURRENT_REALITY_TREE
          RCAAnalysis dataclass: template, symptom, whys[] (Five Whys chain),
            categories{} (Fishbone), fault_tree{} (Fault Tree), causal_chain[] (Causal Chain),
            root_cause, contributing_factors[], prevention_rule, recurrence_signature,
            orchestrator, operation, timestamp, confidence, rca_id (auto-generated)
          PreventionRule dataclass: rule_id, description, severity (P0/P1/P2),
            recurrence_threshold (default 3), active (bool), created_at
          RCAEngine class:
            analyze_five_whys(symptom, whys[]) → RCAAnalysis  (enforces min 3 whys)
            analyze_fishbone(symptom, categories{}) → RCAAnalysis
            generate_prevention_rule(rca) → PreventionRule
            compute_recurrence_signature(rca) → str  (category + keyword hash)
      - path: "tests/unit/learning/test_rca_engine.py"
        description: "RED-phase tests for RCAAnalysis, RCATemplate, RCAEngine"

    tdd_cycle:
      red:
        action: "Write ALL failing tests for RCA data model + engine methods"
        gate: "python3 scripts/run_tests.py file tests/unit/learning/test_rca_engine.py — ALL tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails"
      green:
        action: "Implement RCATemplate, RCAAnalysis, PreventionRule, RCAEngine"
        gate: "python3 scripts/run_tests.py file tests/unit/learning/test_rca_engine.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints (CORE-011), docstrings (CORE-012), deduplication (CORE-035)"
        gate: "python3 scripts/run_tests.py dir tests/unit/learning/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_rca_template_enum_has_five_values — FIVE_WHYS, FISHBONE, FAULT_TREE, CAUSAL_CHAIN, CURRENT_REALITY_TREE"
        - "test_rca_analysis_dataclass_required_fields — symptom, root_cause, template, prevention_rule"
        - "test_rca_analysis_auto_generates_rca_id — UUID format"
        - "test_rca_analysis_auto_generates_timestamp — datetime"
        - "test_rca_analysis_to_dict_serializable — all fields round-trip through dict"
        - "test_prevention_rule_dataclass_fields — rule_id, description, severity, threshold, active"
        - "test_rca_engine_analyze_five_whys_requires_min_3_whys — ValueError if < 3"
        - "test_rca_engine_analyze_five_whys_creates_analysis — correct template, whys populated"
        - "test_rca_engine_analyze_five_whys_generates_prevention_rule — non-empty rule"
        - "test_rca_engine_analyze_fishbone_requires_at_least_one_category — ValueError if empty"
        - "test_rca_engine_analyze_fishbone_creates_analysis — categories populated"
        - "test_rca_engine_generate_prevention_rule — returns PreventionRule with active=True"
        - "test_rca_engine_compute_recurrence_signature — format RCA-CATEGORY-KEYWORDS"
        - "test_rca_engine_same_root_cause_class_same_signature — cross-orchestrator match"
        - "test_rca_engine_different_root_cause_different_signature — no false positive"
      green:
        - "Implement RCATemplate enum in rca_engine.py"
        - "Implement RCAAnalysis dataclass with auto-id and timestamp"
        - "Implement PreventionRule dataclass"
        - "Implement RCAEngine.analyze_five_whys() with min-3-whys guard"
        - "Implement RCAEngine.analyze_fishbone() with min-category guard"
        - "Implement RCAEngine.generate_prevention_rule()"
        - "Implement RCAEngine.compute_recurrence_signature()"
      refactor:
        - "Add docstrings to all public methods (CORE-012)"
        - "Verify type hints on all signatures (CORE-011)"
        - "Confirm no duplicate implementations exist (CORE-035)"

    acceptance_criteria:
      - "RCATemplate enum has exactly 5 values"
      - "RCAAnalysis.to_dict() serialises all fields"
      - "analyze_five_whys() rejects < 3 whys with ValueError"
      - "compute_recurrence_signature() produces deterministic hash"
