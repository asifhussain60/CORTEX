background: |
  Source: chat01.md holistic review — 89-phase landscape audit (2026-02-28)
  Score at entry: 7.8 / 10 (routing coverage gap identified)
  Target score: 9.5 / 10
  Baseline measurements:
    - Preflight tests: 41 passed
    - IntentType enum values: 27 total (CORTEX canonical_enums.py)
    - IntentRouter keyword lists wired: 14 of 27 (52%)
    - IntentClassifier _REGEX_PATTERNS: 14 entries
    - IntentClassifier _KEYWORD_BAGS: 13 entries
    - IntentClassifier _exact_operation_match: 17 entries
    - IntentClassifier _label_to_intent: 14 entries
    - YAML spec intent-routing-rules.yaml: 8 intents (33%)
    - Workflow templates total: 77
    - Templates bound in _check_for_workflow_template: 6 operation types
  Git prerequisite: Phase 89 COMPLETE (commit on CORTEX branch)

  Trigger:
    Phase 89 added 7 new IntentType values (VACUUM, DEBUG, HEALTH, SYNC, TRAIN,
    TOTALRECALL, RCA) with routing table entries pointing to named orchestrators,
    but did NOT wire the upstream classification pipeline that feeds those routing
    decisions. The 3-tier IntentClassifier, IntentRouter keyword lists, YAML spec,
    and MasterOrchestrator template binding were not updated. Result: all 7 modes
    are unreachable via natural language — users saying "debug", "total recall",
    "root cause", "health check", etc. fall through to IMPLEMENT or REFACTOR,
    bypassing dedicated orchestrators and workflow templates entirely.

