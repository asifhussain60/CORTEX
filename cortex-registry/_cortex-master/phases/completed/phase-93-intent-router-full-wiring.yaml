description: >
  Confirm and implement full wiring of IntentRouter into MasterOrchestrator
  for all CORTEX functionality. InteractionOrchestrator is the always-active
  default orchestrator with intelligent LENS analysis as the Stage 1 foundation
  of the 4-stage pipeline.

acceptance_criteria:
  - ✅ Stage2._classify() calls router.route() (not missing classify() method)
  - ✅ Stage2 passes request + operation_name context dict to router.route()
  - ✅ Stage2 extracts intent_type.value + target_handler from RoutingDecision
  - ✅ Stage2._get_routing_target() covers all 27 IntentType values (no MasterOrchestrator catch-all)
  - ✅ UNKNOWN/QUERY/INTERACT → InteractionOrchestrator (LENS default)
  - ✅ Stage1 uses interaction_orchestrator.execute() from dependencies when available
  - ✅ Stage1 preserves breadcrumb in context.metadata from InteractionOrchestrator
  - ✅ MasterOrchestrator passes both interaction_orchestrator and lens_orchestrator to Stage1 deps
  - ✅ 30 RED→GREEN tests (4 clusters), 0 regressions

sweep_catalogue:
  - id: GAP-93-01
    description: "Stage2._classify() calls router.classify() which doesn't exist on IntentRouter (only route())"
    file: cortex/orchestrators/core/stage234_strategies.py
    status: CLOSED
    fix: "Replaced router.classify() call with router.route(context_dict). Stores _last_decision for target_handler extraction."

  - id: GAP-93-02
    description: "Stage2 doesn't pass request/operation context to router.route() — just request string"
    file: cortex/orchestrators/core/stage234_strategies.py
    status: CLOSED
    fix: "Builds proper routing_context dict with request, operation, user_intent, description."

  - id: GAP-93-03
    description: "_get_routing_target() covers only 5 intents — 22 of 27 fall through to MasterOrchestrator catch-all"
    file: cortex/orchestrators/core/stage234_strategies.py
    status: CLOSED
    fix: "Expanded to all 27 IntentType values. UNKNOWN/QUERY/INTERACT → InteractionOrchestrator. TOTALRECALL → AuditOrchestrator."

  - id: GAP-93-04
    description: "Stage1 never calls InteractionOrchestrator — uses LENSOrchestrator direct only"
    file: cortex/orchestrators/core/stage1_comprehension_strategy.py
    status: CLOSED
    fix: "Phase 93: when interaction_orchestrator in deps, calls .execute() first. Preserves breadcrumb in context.metadata."

  - id: GAP-93-05
    description: "MasterOrchestrator doesn't pass lens_orchestrator to Stage1 dependencies"
    file: cortex/orchestrators/core/master_orchestrator.py
    status: CLOSED
    fix: "Added lens_orchestrator: getattr(self, '_lens_orchestrator', None) to dependencies dict."

