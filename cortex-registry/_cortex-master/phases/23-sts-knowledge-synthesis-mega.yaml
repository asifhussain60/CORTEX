      - Version lock with download date in metadata
      - Keep local copies in cortex/knowledge/sources/
      - Manual curation ensures quality over quantity
  
  - risk_id: R2
    category: "performance"
    description: "Component consolidation adds orchestration overhead"
    probability: "Low"
    impact: "Medium"
    mitigation: |
      - Performance benchmarking in S6
      - Lazy initialization for heavy components
      - Caching frequently accessed data
  
  - risk_id: R3
    category: "complexity"
    description: "70 contract tests become maintenance burden"
    probability: "Medium"
    impact: "Low"
    mitigation: |
      - Parameterized tests reduce duplication
      - Auto-generate tests from contract YAML
      - Clear documentation of contract philosophy
  
  - risk_id: R4
    category: "scope-creep"
    description: "STS enhancement expands to include more patterns"
    probability: "High"
    impact: "High"
    mitigation: |
      - Strict scope: 61 patterns only (no additions)
      - Defer new patterns to Phase 24
      - Focus on quality over quantity

