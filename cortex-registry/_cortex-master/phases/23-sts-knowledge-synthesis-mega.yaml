# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================

overview:
  vision: |
    Transform CORTEX into a cloud-native transformation engine covering modern application stacks:
    
    1. **Knowledge YAML Synthesis** — Download authoritative sources (Microsoft .NET/Azure,
       Angular, OWASP, Databricks, LaunchDarkly), convert to CORTEX schema. Create 23 new 
       domain YAMLs (59 total covering 90% of enterprise tech stacks).
    
    2. **Component Registration** — Consolidate 296 unregistered components into 4
       super-orchestrators (IntelligenceOrchestrator, SOLIDOrchestrator, StateOrchestrator,
       ObservabilityOrchestrator). Create unwiring prevention tests (70 contract tests).
    
    3. **STS Enhancement** — Build STS-specific knowledge YAMLs for 61 anti-patterns,
       create cortex_analyze_sts_app MCP tool, generate automated showcase with metrics.
    
    4. **Knowledge Packs** — Bundle domain knowledge into versioned packs (sts-dotnet-pack,
       sts-angular-pack, sts-python-pack, cloud-azure-pack, data-engineering-pack) with 
       dependency resolution.
    
    5. **Learning Integration** — Integrate DigestOrchestrator with STS workflow, track
       pattern frequency, enhance Phase 49 CCL with STS pattern cache.

  problem_statement: |
    CURRENT STATE (P1 GAPS):
    
    **Knowledge Management:**
    - 36 YAML files cover 60% of enterprise needs (missing Azure, Databricks, LaunchDarkly, advanced .NET)
    - No data engineering patterns (Spark, Delta Lake, data pipelines)
    - No feature flag governance (LaunchDarkly architecture patterns)
    - No cloud-native security baselines (Azure Security Benchmark missing)
    
    **Component Architecture:**
    - 296 components exist but not in wiring registry (21% coverage)
    - 71 HIGH_VALUE components providing critical functionality scattered
    - No contract enforcement (components can be removed without detection)
    - Orchestrators can bypass governance by avoiding registered components
    
    **STS Capabilities:**
    - 61 anti-patterns documented but no automated detection
    - Manual showcase generation (no metrics, no quantification)
    - No before/after state tracking for transformations
    - Cannot analyze Payment Processor or RA Domain apps automatically
    
    **Learning & Intelligence:**
    - Phase 49 CCL has no STS-specific pattern cache
    - DigestOrchestrator not integrated with STS workflow
    - No pattern frequency tracking across sessions
    - Repeated analysis of similar codebases (zero reuse)
    
    IMPACT:
    - ❌ CORTEX cannot refactor Azure/Databricks/LaunchDarkly apps (missing domain knowledge)
    - ❌ No data engineering best practices (Spark, Delta Lake, data quality patterns)
    - ❌ 71 critical components invisible to orchestrators
    - ❌ STS showcase requires manual effort (not scalable)
    - ❌ Cannot answer "How do I implement Azure Well-Architected pillars?"

  success_criteria:
    - "✅ 18 new knowledge YAMLs created (54 total, 90% STS coverage)"
    - "✅ 4 super-orchestrators operational (19 components consolidated)"
    - "✅ 70 contract tests prevent unwiring (100% coverage)"
    - "✅ cortex_analyze_sts_app MCP tool working (one-command analysis)"
    - "✅ 3 knowledge packs available (dotnet, angular, python)"
    - "✅ STS pattern cache integrated into Phase 49 CCL"
    - "✅ 200+ tests passing (60 knowledge + 70 contract + 40 STS + 30 integration)"
    - "✅ Performance: <225ms per STS file analysis (25% faster)"
    - "✅ Showcase auto-generation with metrics dashboard"

