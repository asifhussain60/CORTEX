metadata:
  phase_id: "phase-67"
  title: ".NET Roslyn Deep Intelligence"
  status: "planned"
  priority: "P1"
  created: "2026-02-09"
  updated: "2026-02-09"
  estimated_duration: "6-8 weeks"
  roi_score: 0.87
  execution_order: 18
  test_target: 95
  coverage_target: 90
  autonomous_execution: true
  approval_required: false
  cross_cutting: true
  breaking_changes: false
  production_blocker: false

overview:
  vision: |
    Transform CORTEX .NET analysis from syntax-level (Phase 55) to semantic-level 
    intelligence through Microsoft Roslyn semantic model integration. Enable CORTEX 
    to understand .NET codebases with architect-level depth: type resolution, DI 
    container graphs, EF Core entity lineage, compilation symbol analysis, and 
    cross-assembly relationship tracking.
    
    Addresses primary gap from chat01.md analysis: "Runtime truth (what actually 
    happens)" — specifically DI container registrations and ORM mapping validation.

  problem_statement: |
    Current .NET LENS (Phase 55) provides project-level analysis but lacks 
    semantic depth:
    
    1. Syntax-only: Cannot resolve method signatures across assemblies
    2. No type inference: Generic constraints, interface implementations unclear
    3. Missing DI graph: Cannot export "interface → concrete type" registrations
    4. Incomplete EF mapping: Detects models but not table↔entity↔DTO lineage
    5. No compilation context: Cannot validate cross-assembly references
    6. Token-inefficient: Requires full codebase scan for relationship queries
    
    Intelligence gap: CORTEX sees .NET syntax trees but not semantic meaning.
    
    chat01.md insight: "DI container graph: Export registrations (interfaces → 
    concrete types) at startup. This is gold for 'what implementations are 
    actually used.' This is how you avoid diagrams based on dead code."

  expected_outcomes:
    - "Roslyn semantic model integration (compilation analysis)"
    - "Type resolution across assemblies (interface implementations)"
    - "DI container registration export (.NET Core + Ninject + Autofac)"
    - "EF Core full mapping: DbContext → Entity → Table → DTO → API endpoint"
    - "Symbol analysis: method signatures, generic constraints, attributes"
    - "Cross-assembly call graph with resolved types"
    - "Navigation property relationship extraction"
    - "Fluent API configuration parsing"
    - "Startup.cs / Program.cs DI registration analysis"
    - "Integration with Phase 66 knowledge graph (unified Python+.NET)"
    - "MCP tool: cortex_dotnet_semantic_analyze"

roi_analysis:
  cost: "42-56 hours (6-8 weeks part-time)"
  impact: |
    Immediate:
    - .NET codebase understanding: 55% → 90% capability
    - DI container validation: "What implementations are actually used?"
    - EF Core lineage: Database schema → API endpoint full traceability
    
    Medium-term:
    - Architectural refactoring safety (validated dependency changes)
    - Dead code detection (unused DI registrations)
    - Test coverage gap identification (untested implementations)
    
    Long-term:
    - Cross-language knowledge graph (Python + .NET unified)
    - Domain-driven documentation for .NET microservices
    - Migration planning (legacy → modern with dependency tracking)
    
    Strategic: Closes 35% capability gap identified in chat01.md analysis.
    
  risk_mitigation: |
    - Builds on Phase 55 foundation (no rewrite, additive enhancement)
    - Roslyn is Microsoft-supported (stable, well-documented)
    - Incremental delivery: Value every 1.5-2 weeks per stage
    - Language-neutral design: Patterns applicable to Java/Kotlin later
    - Fallback: Phase 55 syntax analysis remains functional if semantic fails

dependencies:
  required:
    - "phase-55: .NET LENS Multi-Stage Implementation (Complete)"
    - "phase-66: LENS Knowledge Graph & Domain Intelligence (S2 complete for graph integration)"
  optional:
    - "phase-64: Intelligent LENS Tier Selection (enhances tier routing)"
  blocks:
