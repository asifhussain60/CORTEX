rollback_plan: |
  If phase fails:
  1. Revert SPA commits (git revert)
  2. Restore old dashboard directories from git
  3. Remove DashboardOrchestrator from orchestrator mesh
  4. Phase marked as "blocked" with failure reason
  5. Root cause analysis in next AUDIT cycle

