# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    A lightweight, non-blocking pre-flight context layer that enriches
    MasterOrchestrator Stages 2+ with pre-warmed knowledge:
    
    1. **Transparency** — Users see "thinking" progress:
       - "[████░░░░░░] 40% Loading rules..."
       - "[████████░░] 80% Analyzing code..."
    
    2. **Async Efficiency** — CCL runs in parallel with Stage 1:
       - Stage 1 comprehension: 200-300ms
       - CCL prefetch: 200-300ms (overlap, not additive)
       - Result: No latency penalty
    
    3. **Unified Context** — LENS + Rules + Infrastructure in one object:
       - CrystallizedContext carries all pre-warmed data
       - No repeated loading downstream
       - Orchestrators use ready-made context
    
    4. **Extensibility** — New knowledge sources plugged without Master changes:
       - Phase A/B/C run independently
       - Add Phase D (security checks) without touching Master
       - Scales to 50+ orchestrators without coupling

  problem_statement: |
    Current architecture has 5 scattered "thinking" points:
    
    **Problem 1: No Transparency**
    - Users don't see "thinking" happening
    - EXIT GATE synthesis invisible
    - LENS fetching hidden in IntentRouter
    - Challenge generation opacity → low confidence
    
    **Problem 2: Sequential Loading (Latency)**
    - LENS context loaded in Stage 2 (blocks routing)
    - Rules synthesized after LENS fetch (blocks again)
    - Latency: 300-400ms just for knowledge loading
    - Scales O(n) with new orchestrators
    
    **Problem 3: Knowledge Coupling**
    - Master knows CORTEX rules, Company domains, etc.
    - 1000+ LOC of knowledge loading in MasterOrchestrator
    - Hard to extend with Phase 49+
    - Violates separation of concerns
    
    **Problem 4: LENS + Rules Desynchronization**
    - LENS analyzes code independently
    - Rules loaded separately
    - Routing may miss code-specific rule matches
    - Challenge generation weak (no code context)

  expected_outcomes: |
    After Phase 48:
    
    ✅ **Transparency:** Progress bars show "Thinking..."
    ✅ **Efficiency:** -15% latency (350ms→300ms overall)
    ✅ **Accuracy:** +30% rule citation, +40% challenge relevance
    ✅ **Extensibility:** Add new knowledge without Master changes
    ✅ **Zero Regression:** All 515+ tests passing
    ✅ **Scalability:** Constant-time knowledge loading regardless of orchestrator count

# ============================================================================
# TECHNICAL APPROACH
# ============================================================================
technical_approach: |
  ## Architecture (Layer 0: Pre-Flight)
  
  ```
  USER REQUEST
      ↓
  ┌────────────────────────────────────────────────────┐
  │ LAYER 0 (PRE-FLIGHT): Context Crystallization     │
  │ Runs ASYNC in background, parallel with Stage 1   │
  ├────────────────────────────────────────────────────┤
  │ Phase A: Rules Cache Load (50ms)                   │
  │   ├─ Load tier0 rules (cached)                     │
  │   ├─ Load tier1 defaults (cached)                  │
  │   └─ Apply company precedence                      │
  │                                                    │
  │ Phase B: LENS Warm-up (100-200ms, if file given)  │
  │   ├─ AST analysis (fast)                           │
  │   ├─ Git history (cached)                          │
  │   └─ Comment extraction                            │
  │                                                    │
  │ Phase C: Infrastructure Detection (50ms)          │
  │   ├─ Check Phase 46 cache                          │
  │   ├─ Get environment capabilities                  │
  │   └─ Build infrastructure context                  │
  │                                                    │
  │ RESULT: CrystallizedContext ready                 │
  └────────────────────────────────────────────────────┘
      ↓ (merged into request)
  
  STAGE 1: InteractionOrchestrator (comprehension + challenge)
  STAGE 2: IntentRouter (routing — uses pre-warmed context)
  STAGE 3: GovernanceRegistry (validation)
  STAGE 4: Domain Orchestrators (execution)
  ```
  
  ## Key Design Decisions
  
  1. **Not a Stage** — CCL is a LAYER (Layer 0), not a 5th stage
     - Rationale: Stages must be serialized; layers can be parallel
     - Benefit: No MasterOrchestrator wiring changes needed
  
  2. **Async + Non-blocking** — CCL runs in thread pool
     - Rationale: Avoids blocking user request
     - Benefit: 300-400ms prefetch during 200-300ms Stage 1
  
  3. **Timeout SLA** — Max 300ms, fallback at 500ms
     - Rationale: Better to proceed without context than block
     - Benefit: Graceful degradation, never stalls
  
  4. **Pluggable Phases** — A/B/C independent
     - Rationale: Phase D (security) or E (compliance) plugged without touching A/B/C
     - Benefit: Extensibility (scales to Phase 50+)

