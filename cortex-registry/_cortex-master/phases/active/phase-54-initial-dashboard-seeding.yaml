# ============================================================================
# SOLUTION DESIGN
# ============================================================================

solution_overview: |
  Create BatchDashboardSeeder orchestrator that:
  1. Discovers all profiles in cortex_brain/onboarded_repos/
  2. For each profile: calls DashboardOrchestrator
  3. Validates JSON schema compliance
  4. Registers in dashboard index (index.yaml)
  5. Generates completion report with audit trail

architecture:
  components:
    - name: "BatchDashboardSeeder Orchestrator"
      responsibility: "Coordinate batch dashboard generation"
      location: "cortex/orchestrators/domain/batch_dashboard_seeder.py"
      methods:
        - "discover_profiles() → List[Path]"
        - "generate_dashboard_for_profile(profile_path) → DashboardJSON"
        - "validate_dashboard_json(json_data) → ValidationResult"
        - "register_in_index(repo_name, dashboard_path) → RegistrationResult"
        - "run_seeding() → SeedingReport"
      
    - name: "Dashboard Profile Loader"
      responsibility: "Read repository profiles"
      location: "cortex_brain/onboarded_repos/ (existing ProfileStore)"
      dependencies:
        - "ProfileStore from Phase-28"
    
    - name: "Dashboard Generator"
      responsibility: "Generate dashboard JSON per profile"
      location: "cortex/orchestrators/domain/dashboard_orchestrator.py (existing)"
      invocation: "DashboardOrchestrator.generate_from_profile()"
    
    - name: "Dashboard JSON Validator"
      responsibility: "Validate generated dashboards"
      location: "cortex-registry/_cortex-master/dashboard/schema/ (existing schema)"
      validation: "JSON Schema Draft 7"

  data_flow: |
    Profile Discovery
      ├─ /cortex_brain/onboarded_repos/*.yaml → Discover profiles
      ├─ Parse each YAML → Profile dataclass
      └─ Build ProfileList
    
    Dashboard Generation (Per Profile)
      ├─ Profile → DashboardOrchestrator.generate_from_profile()
      ├─ DashboardOrchestrator reads profile metadata
      ├─ Generates SPA-compatible JSON
      └─ Returns DashboardJSON
    
    Validation & Storage
      ├─ DashboardJSON → JSON Schema validation
      ├─ If valid: Write to company/dashboards/data/{repo_name}.json
      ├─ If invalid: Log error, skip (no partial writes)
      └─ AC_START/AC_COMPLETE markers
    
    Registration
      └─ Update cortex-registry/_cortex-master/index.yaml
         - Add dashboard entries to onboarded_repositories section
         - Mark dashboard_generated: true

