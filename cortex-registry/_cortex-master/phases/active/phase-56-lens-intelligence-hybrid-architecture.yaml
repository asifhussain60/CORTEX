# ============================================================================
# ARCHITECTURAL DESIGN
# ============================================================================
architecture:
  target_structure: |
    cortex/
      lens/                           # THIN ORCHESTRATION LAYER
        __init__.py
        orchestrator.py               # Main coordinator (LENSOrchestrator)
        cache.py                      # Result caching layer
        context.py                    # Context management
        interfaces.py                 # Intelligence engine contracts
        
      intelligence/                   # DEEP COMPUTATION LAYER (NEW)
        __init__.py
        base.py                       # BaseIntelligenceEngine (abstract)
        
        ast/                          # AST Analysis Engines
          __init__.py
          analyzer.py                 # Main AST analyzer
          extractor.py                # Code extraction
          parser.py                   # AST parsing utilities
          
        git/                          # Git Intelligence
          __init__.py
          history_analyzer.py         # Git history analysis
          blame_analyzer.py           # Git blame tracking
          commit_analyzer.py          # Commit intelligence
          
        relationships/                # Relationship & Graph Analysis
          __init__.py
          traversal.py                # Relationship traversal engine
          call_graph.py               # Call graph builder
          dependency_graph.py         # Dependency analysis
          
        patterns/                     # Pattern Detection
          __init__.py
          detector.py                 # Pattern detection engine
          anti_patterns.py            # Anti-pattern detection
          best_practices.py           # Best practice validation
          
        semantic/                     # Semantic Analysis (Future)
          __init__.py
          analyzer.py                 # Semantic code analysis
          embeddings.py               # (Future) ML-based embeddings
          similarity.py               # (Future) Code similarity
          
        comments/                     # Comment Intelligence
          __init__.py
          extractor.py                # Comment extraction
          analyzer.py                 # Comment quality analysis
          
      mcp/
        tools/
          lens_tools.py               # MCP exposes via LENS orchestrator

  flow_diagram: |
    User Request
        ↓
    MCP Tool (cortex_lens_analyze)
        ↓
    LENSOrchestrator (lens/orchestrator.py)
        ↓
    ┌─────────────────────────────────┐
    │   Intelligence Engine Selection  │
    └─────────────────────────────────┘
        ↓
    ┌─────────────────────────────────┐
    │   Parallel Engine Execution     │
    ├─────────────────────────────────┤
    │ • ASTAnalyzer                   │
    │ • GitHistoryAnalyzer            │
    │ • RelationshipTraversal         │
    │ • PatternDetector               │
    └─────────────────────────────────┘
        ↓
    ┌─────────────────────────────────┐
    │   Result Aggregation & Caching  │
    └─────────────────────────────────┘
        ↓
    Return to User

  key_design_decisions:
    - decision: "Intelligence engines are stateless and reusable"
      rationale: "Enables parallel execution and unit testing"
      
    - decision: "LENS orchestrator maintains all caching logic"
      rationale: "Single source of truth for cached intelligence"
      
    - decision: "Intelligence engines expose async interfaces"
      rationale: "Supports Phase 49 CCL async prefetch pattern"
      
    - decision: "Base class enforces contract via abstract methods"
      rationale: "Guarantees consistency across all engines"
      
    - decision: "No intelligence engine imports from LENS"
      rationale: "Eliminates circular dependencies permanently"

# ============================================================================
# MIGRATION PLAN (4 PHASES)
# ============================================================================
stages:
  # ============================================================================
  # PHASE 1: Foundation & Relationship Traversal (Week 1)
  # ============================================================================
  - stage_id: "S1"
    name: "Foundation & Relationship Migration"
    duration: "3 days"
    status: "planned"
    description: |
      Create intelligence layer foundation and migrate relationship traversal
      as proof-of-concept for the hybrid architecture pattern.
    
    tasks:
      - task_id: "S1-T1"
        name: "Create cortex/intelligence/ package structure"
        description: |
          Create new package with base classes and interfaces:
          - cortex/intelligence/__init__.py
          - cortex/intelligence/base.py (BaseIntelligenceEngine)
          - cortex/intelligence/interfaces.py (type definitions)
        tests_required: 5
        effort: "2 hours"
        
      - task_id: "S1-T2"
        name: "Define BaseIntelligenceEngine abstract class"
        description: |
          Abstract base class with contract:
          - analyze(context: AnalysisContext) -> AnalysisResult
          - async analyze_async() support
          - validate_context() enforcement
          - error handling patterns
        tests_required: 8
        effort: "3 hours"
        
      - task_id: "S1-T3"
        name: "Migrate relationship_traversal.py to intelligence/relationships/"
        description: |
          Move and refactor:
          - FROM: cortex/brain/core/intelligence/relationship_traversal.py
          - TO: cortex/intelligence/relationships/traversal.py
          - Update to use BaseIntelligenceEngine
          - Add async support
        tests_required: 15
        effort: "4 hours"
        
      - task_id: "S1-T4"
        name: "Update LENS to use intelligence.relationships"
        description: |
          Update lens/orchestrator.py:
          - Import from cortex.intelligence.relationships
          - Update call sites
          - Maintain backward compatibility via aliases
        tests_required: 10
        effort: "3 hours"
        
      - task_id: "S1-T5"
        name: "Validate zero circular dependencies"
        description: |
          Create import graph analysis script:
          - Scan all imports in lens/ and intelligence/
          - Detect circular dependencies
          - Assert zero violations
        tests_required: 5
        effort: "2 hours"
    
    tests:
      unit: 30
      integration: 8
      e2e: 5
    
    validation:
      - "BaseIntelligenceEngine enforces contract via abstract methods"
      - "RelationshipTraversal migrated with zero test failures"
      - "LENS orchestrator successfully uses intelligence.relationships"
      - "Import graph analysis shows zero circular dependencies"
      - "All existing LENS MCP tools still functional"

  # ============================================================================
  # PHASE 2: AST & Git Engine Migration (Week 2)
  # ============================================================================
  - stage_id: "S2"
    name: "AST & Git Intelligence Migration"
    duration: "4 days"
    status: "planned"
    description: |
      Migrate AST analysis and Git intelligence to new intelligence layer.
      Eliminate duplication between lens and brain packages.
    
    tasks:
      - task_id: "S2-T1"
        name: "Create intelligence/ast/ package"
        description: |
          Consolidate AST analysis:
          - Merge ast_analyzer.py (lens) + ast_intelligence.py (brain)
          - Single canonical AST analyzer
          - Inherit from BaseIntelligenceEngine
          - Support sync and async modes
        tests_required: 25
        effort: "6 hours"
        
      - task_id: "S2-T2"
        name: "Create intelligence/git/ package"
        description: |
          Consolidate git intelligence:
          - Migrate GitHistoryAnalyzer
          - Add GitBlameAnalyzer
          - Add CommitIntelligenceEngine
          - All inherit from BaseIntelligenceEngine
        tests_required: 20
        effort: "5 hours"
        
      - task_id: "S2-T3"
        name: "Update LENS to use new AST/Git engines"
        description: |
          Update lens/orchestrator.py:
          - Replace old ast_analyzer imports
          - Replace old git analyzer imports
          - Update all call sites
          - Maintain backward compatibility
        tests_required: 15
        effort: "4 hours"
        
      - task_id: "S2-T4"
        name: "Remove duplicate implementations"
        description: |
          Clean up old files:
          - Mark old files as deprecated
          - Add deprecation warnings
          - Create migration guide
          - Plan removal timeline (Phase 57)
        tests_required: 5
        effort: "2 hours"
        
      - task_id: "S2-T5"
        name: "Update MCP tools to use new engines"
        description: |
          Update mcp/tools/lens_tools.py:
          - Use intelligence engines directly
          - Verify tool signatures unchanged
          - Test all cortex_lens_* tools
        tests_required: 12
        effort: "3 hours"
    
    tests:
      unit: 45
      integration: 12
      e2e: 10
    
    validation:
      - "Single canonical AST analyzer (no duplication)"
      - "Git intelligence consolidated in intelligence/git/"
      - "All LENS operations use new engines"
      - "MCP tool signatures unchanged (backward compatible)"
      - "Performance: No regression in analysis latency"

  # ============================================================================
  # PHASE 3: Pattern Detection & Comment Intelligence (Week 3)
  # ============================================================================
  - stage_id: "S3"
    name: "Pattern & Comment Intelligence Migration"
    duration: "3 days"
    status: "planned"
    description: |
      Migrate pattern detection and comment analysis to intelligence layer.
      Add anti-pattern detection and best practice validation.
    
    tasks:
      - task_id: "S3-T1"
        name: "Create intelligence/patterns/ package"
        description: |
          Pattern detection engines:
          - PatternDetectionEngine (base patterns)
          - AntiPatternDetector (code smells)
          - BestPracticeValidator (standards check)
        tests_required: 20
        effort: "5 hours"
        
      - task_id: "S3-T2"
        name: "Create intelligence/comments/ package"
        description: |
          Comment intelligence:
          - Consolidate comment_extractor (lens) + comment_analyzer (brain)
          - CommentQualityAnalyzer
          - TODODetector
        tests_required: 15
        effort: "4 hours"
        
      - task_id: "S3-T3"
        name: "Integrate with LENS orchestrator"
        description: |
          Update lens/orchestrator.py:
          - Add pattern detection to analysis flow
          - Add comment intelligence to results
          - Support selective engine execution
        tests_required: 10
        effort: "3 hours"
        
      - task_id: "S3-T4"
        name: "Create intelligence engine catalog"
        description: |
          Documentation and discovery:
          - List all available intelligence engines
          - Document engine capabilities
          - Add to cortex_tools_catalog
        tests_required: 5
        effort: "2 hours"
    
    tests:
      unit: 30
      integration: 10
      e2e: 10
    
    validation:
      - "Pattern detection engines operational"
      - "Comment intelligence consolidated"
      - "LENS orchestrator uses all new engines"
      - "Intelligence engine catalog complete"
      - "Documentation updated"

  # ============================================================================
  # PHASE 4: Semantic Foundation & Future-Proofing (Week 3)
  # ============================================================================
  - stage_id: "S4"
    name: "Semantic Layer & Cleanup"
    duration: "3 days"
    status: "planned"
    description: |
      Create semantic analysis foundation for future ML/AI integration.
      Complete migration, cleanup deprecated code, finalize documentation.
    
    tasks:
      - task_id: "S4-T1"
        name: "Create intelligence/semantic/ package skeleton"
        description: |
          Future-proof semantic layer:
          - SemanticAnalyzer (basic semantic analysis)
          - Placeholders for embeddings (future)
          - Placeholders for similarity (future)
          - Design interfaces for ML integration
        tests_required: 10
        effort: "3 hours"
        
      - task_id: "S4-T2"
        name: "Update lens/interfaces.py with engine contracts"
        description: |
          Formalize interfaces:
          - AnalysisContext type definition
          - AnalysisResult type definition
          - Engine capability declarations
          - Async pattern contracts
        tests_required: 8
        effort: "2 hours"
        
      - task_id: "S4-T3"
        name: "Deprecate old brain/core/intelligence/"
        description: |
          Clean up old code:
          - Add deprecation warnings to all old files
          - Create aliases for backward compatibility
          - Set removal date (Phase 57)
          - Update all internal imports
        tests_required: 5
        effort: "2 hours"
        
      - task_id: "S4-T4"
        name: "Performance optimization & caching"
        description: |
          Optimize intelligence layer:
          - Add result caching to engines
          - Optimize parallel execution
          - Add performance metrics
          - Validate no latency regression
        tests_required: 12
        effort: "4 hours"
        
      - task_id: "S4-T5"
        name: "Create migration guide & architecture docs"
        description: |
          Documentation:
          - Migration guide for users
          - Architecture diagrams
          - Engine development guide
          - Update CORTEX.prompt.md
        tests_required: 3
        effort: "3 hours"
        
      - task_id: "S4-T6"
        name: "Final validation & test suite"
        description: |
          Comprehensive validation:
          - Run full test suite (515+ tests)
          - Import graph analysis (zero circular deps)
          - Performance benchmarks
          - MCP tool regression testing
        tests_required: 10
        effort: "4 hours"
    
    tests:
      unit: 25
      integration: 10
      e2e: 13
    
    validation:
      - "Semantic layer foundation ready for future ML integration"
      - "All deprecated code marked with removal timeline"
      - "Performance: Zero regression in LENS operations"
      - "Documentation: Migration guide complete"
      - "All 515+ tests passing"
      - "Import graph: Zero circular dependencies"

