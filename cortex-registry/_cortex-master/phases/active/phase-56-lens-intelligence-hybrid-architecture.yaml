    - "CORE-048: Holistic Validation Gate (Phase 48)"
    - "MCP-FIRST: All functionality via MCP tools"
  en**PHASE 56-A: PILOT VALIDATION (3-5 days)**
    
    Prove hybrid architecture viability by migrating ONE engine:
    - RelationshipTraversal: brain/core/intelligence/ → intelligence/relationships/
    - Establish BaseIntelligenceEngine pattern
    - Validate zero circular dependencies
    - Confirm backward compatibility
    - Document migration patterns for future phases
    
    **DEFERRED TO PHASES 56-B/C/D/E:**
    - 56-B: AST & Git engines (4 days)
    - 56-C: Pattern & Comment engines (3 days)
    - 56-D: Semantic foundation (3 days)
    - 56-E: Deprecation cleanup (2 days)
    
    **FULL VISION (after pilot success):**
    - LENS: Thin orchestration (coordination, caching, MCP)
    - Intelligence: Deep computation (AST, Git, relationships, patterns)
    - Clear one-way flow: LENS → Intelligence (no circular deps)
    
    **Pilot Benefits:**
    1. ✅ Lower risk: Single engine vs 6
    2. ✅ Faster validation: 3-5 days vs 2-3 weeks
    3. ✅ Easier rollback: Minimal code changes
    4. ✅ Pattern establishment: Reusable for 56-B/C/D/E
    5. ✅ Honest ROI: 0.75 realistic vs 0.95 optimistic
    - Git intelligence and history analysis
    - Relationship traversal and graph building
    - Pattern detection and semantic analysis
    - Future: ML/embedding-based insights
    
    **Benefits:**
    1. ✅ Eliminates circular dependencies (lens ↔ brain)
    2. ✅ Clear separation of concerns (orchestration vs computation)
    3. ✅ Intelligence engines reusable beyond LENS
    4. ✅ Future-proof for AI/ML integration
    5. ✅ Improved testability (unit test engines standalone)
    6. ✅ Scalable to 50+ intelligence engines

  problem_statement: |
    **Current Architecture Issues:**
    
    1. **Circular Dependencies:**
       - cortex/lens/orchestrator.py → imports from cortex.brain.analysis.*
       - cortex/brain/core/intelligence/__init__.py → imports from cortex.lens.analyzers.*
       - Violates clean architecture principles
    
    2. **Duplication of Responsibilities:**
       - AST Analysis: ast_analyzer.py (lens) AND ast_intelligence.py (brain)
       - Git History: Both packages import GitHistoryAnalyzer
       - Relationship Traversal: Lives in brain/core/intelligence/ but LENS needs it
       - Comment Analysis: comment_extractor.py vs brain/core/intelligence/comment_analyzer.py
    
    3. **Unclear Boundaries:**
       - When to use LENSOrchestrator vs RelationshipEngine?
       - When to use ASTAnalyzer (lens) vs ASTIntelligenceEngine (brain)?
       - Discovery plugins scattered across both packages
    
    4. **Scalability Challenges:**
       - Adding new analyzers requires coordination across 2 packages
       - No clear place for advanced ML/AI-based intelligence
       - Monolithic lens package becoming maintenance burden

  success_criteria:
    - "Zero circular dependencies (verified via import graph analysis)"
