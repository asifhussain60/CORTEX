    name: "Registry Isolation Architecture"
    description: "Design context-scoped registry pattern"
    estimated_hours: 6
    test_target: 15
    deliverables:
      - "WorkspaceContext dataclass (workspace_id, tenant_id, isolation_mode)"
      - "RegistryFactory with get_or_create(workspace_id) method"
      - "Lifecycle management (initialize, cleanup, reset)"
      - "Backward compatibility layer (no workspace_id = 'local')"
    acceptance_criteria:
      - "AC-PHASE48-S1-001: WorkspaceContext identifies unique isolation boundaries"
      - "AC-PHASE48-S1-002: RegistryFactory creates isolated instances per workspace"
      - "AC-PHASE48-S1-003: Default workspace_id='local' for individual devs"
  
  - id: "S2"
    name: "GitBackedRegistry Isolation"
    description: "Refactor GitBackedRegistry for workspace isolation"
    estimated_hours: 8
    test_target: 20
    deliverables:
      - "GitBackedRegistry(workspace_id) constructor"
      - "Per-workspace orchestrator instance cache"
      - "Workspace-scoped wiring.yaml loading"
      - "Registry.reset(workspace_id) for testing"
    acceptance_criteria:
      - "AC-PHASE48-S2-001: Each workspace has isolated orchestrator instances"
      - "AC-PHASE48-S2-002: Concurrent workspaces don't share state"
      - "AC-PHASE48-S2-003: All 450+ existing tests pass unchanged"
  
  - id: "S3"
    name: "CompanyKnowledgeLoader Isolation"
    description: "Isolate company knowledge per workspace"
    estimated_hours: 8
    test_target: 18
    deliverables:
      - "CompanyKnowledgeLoader(workspace_id, company_name)"
      - "Per-workspace knowledge cache (LRU with size limits)"
      - "Workspace-scoped compliance detection"
      - "Company override isolation"
    acceptance_criteria:
      - "AC-PHASE48-S3-001: Knowledge cache scoped to workspace"
      - "AC-PHASE48-S3-002: Company A knowledge doesn't leak to Company B"
      - "AC-PHASE48-S3-003: Cache eviction per-workspace"
  
  - id: "S4"
    name: "ToolRegistry & MCP Isolation"
    description: "Isolate MCP tool registry per session"
    estimated_hours: 8
    test_target: 17
    deliverables:
      - "ToolRegistry(session_id) constructor"
      - "Per-session tool registration"
      - "Session-scoped capability discovery"
      - "MCP server workspace routing"
    acceptance_criteria:
      - "AC-PHASE48-S4-001: Each MCP session has isolated tool registry"
      - "AC-PHASE48-S4-002: Tool capabilities scoped to session"
      - "AC-PHASE48-S4-003: Concurrent MCP requests don't interfere"
  
  - id: "S5"
    name: "Concurrency Testing & Stress Testing"
    description: "Validate isolation under load"
    estimated_hours: 10
    test_target: 25
    deliverables:
      - "100 concurrent workspace test suite"
      - "State leakage detection tests"
      - "Race condition verification"
      - "Memory leak prevention tests"
    acceptance_criteria:
      - "AC-PHASE48-S5-001: 100 concurrent workspaces with zero state leakage"
      - "AC-PHASE48-S5-002: No memory growth over 1000 request cycles"
      - "AC-PHASE48-S5-003: Thread-safe registry operations"
  
  - id: "S6"
    name: "Migration & Documentation"
    description: "Update all orchestrators + migration guide"
    estimated_hours: 8
    test_target: 10
    deliverables:
      - "Update 36 orchestrators to accept workspace_id"
      - "Backward compatibility tests (no workspace_id provided)"
      - "Migration guide for custom orchestrators"
      - "Performance benchmarks (isolation overhead <5ms)"
    acceptance_criteria:
      - "AC-PHASE48-S6-001: All orchestrators accept optional workspace_id"
      - "AC-PHASE48-S6-002: Zero breaking changes for existing code"
      - "AC-PHASE48-S6-003: Documentation complete with examples"

testing:
  total_tests: 105
  coverage_target: 95
  test_categories:
    - "Unit: Registry isolation (35 tests)"
    - "Unit: Knowledge loader isolation (25 tests)"
    - "Unit: Tool registry isolation (20 tests)"
    - "Integration: Concurrent workspace access (15 tests)"
    - "Stress: 100 concurrent workspaces (10 tests)"
  
  critical_scenarios:
    - "Two engineers from different companies use CORTEX simultaneously"
    - "Engineer switches between multiple repos in same session"
    - "1000 concurrent MCP requests with different workspaces"
    - "Memory usage remains stable over extended session"

architecture:
  core_pattern: "Context-Scoped Registry Factory"
  isolation_level: "Workspace-level (logical tenant isolation)"
  backward_compatibility: "Full - no workspace_id = local mode"
  
  components:
    - name: "WorkspaceContext"
      responsibility: "Unique workspace identifier + metadata"
      interfaces: ["workspace_id", "tenant_id", "isolation_mode", "company_name"]
    
    - name: "RegistryFactory"
      responsibility: "Create and manage isolated registry instances"
      interfaces: ["get_or_create(workspace_id)", "cleanup(workspace_id)", "list_active()"]
    
    - name: "IsolatedGitBackedRegistry"
      responsibility: "Workspace-scoped orchestrator instances"
      interfaces: ["load(workspace_id)", "get_orchestrator(name, workspace_id)"]
    
    - name: "IsolatedCompanyKnowledgeLoader"
      responsibility: "Workspace-scoped knowledge cache"
      interfaces: ["load_domain(domain, workspace_id)", "clear_cache(workspace_id)"]

deployment:
  individual_developers:
    - "Zero config changes required"
    - "Default workspace_id='local' automatically set"
    - "Single-user mode (no concurrency concerns)"
  
  enterprise_teams:
    - "Set workspace_id from environment variable or git remote"
    - "MCP server routes by workspace_id in request header"
    - "Centralized monitoring shows active workspaces"

risks:
  - risk: "Performance overhead from context passing"
    mitigation: "Benchmark shows <5ms overhead, acceptable"
    severity: "LOW"
  
  - risk: "Increased memory usage (multiple registry instances)"
    mitigation: "LRU cache with TTL, max 50 active workspaces"
    severity: "LOW"
  
  - risk: "Complex migration for custom orchestrators"
    mitigation: "Backward compatibility layer + detailed migration guide"
    severity: "MEDIUM"

success_metrics:
  - "100 concurrent workspaces with zero state leakage (100%)"
  - "All 450+ existing tests pass unchanged (100%)"
  - "Memory usage stable over 1000 request cycles (<5% growth)"
  - "Isolation overhead <5ms per operation (p95)"
  - "Individual developer experience unchanged (zero regression)"

