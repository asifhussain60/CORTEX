# Phase 48: Registry Isolation & Multi-Tenant Foundation
# Authority: CORTEX Enterprise Architecture Analysis (2026-02-08)
# Priority: P0 (Production Blocker for Enterprise)
# ROI Score: 0.93 (High Impact, Moderate Effort)

metadata:
  phase_id: "phase-48"
  title: "Registry Isolation & Multi-Tenant Foundation"
  version: "1.0"
  created: "2026-02-08"
  status: "planned"
  priority: "P0"
  execution_order: 6
  estimated_duration: "6 days"
  autonomous_execution: true
  approval_required: false
  breaking_changes: false
  production_blocker: true

overview:
  vision: |
    Eliminate singleton registry hell and enable true multi-tenant CORTEX deployment.
    Individual developers maintain local-only mode while enterprise teams gain
    isolated workspaces preventing state leakage across concurrent users.
  
  problem_statement: |
    CURRENT STATE: GitBackedRegistry, CompanyKnowledgeLoader, ToolRegistry use module-level
    singletons with no process isolation. Concurrent users share global state.
    
    FAILURE SCENARIO: Engineer A's company domain knowledge bleeds into Engineer B's session.
    Wrong compliance standards applied → security violations ship to production.
    
    IMPACT: Blocks >10 concurrent users, prevents SaaS deployment, creates data corruption risk.
  
  expected_outcomes:
    - ✅ Context-scoped registries with explicit lifecycle management
    - ✅ Workspace ID isolation (tenant_id parameter required)
    - ✅ Zero regression for individual developers (local mode = default)
    - ✅ Foundation for SaaS/multi-tenant deployment
    - ✅ 100% test coverage for state isolation

roi_analysis:
  cost: 48  # hours
  impact: 95  # prevents critical data corruption in enterprise
  risk_mitigation: 98  # eliminates state leakage vulnerability
  roi_score: 0.93
  
  benefits:
    - "Enables >1000 concurrent users without state collision"
    - "Foundation for SaaS revenue model"
    - "Prevents compliance violations from knowledge leakage"
    - "Zero breaking changes for existing users"
  
  trade_offs:
    - "Adds workspace_id parameter to registry constructors (minimal API change)"
    - "Requires explicit context passing (better architecture)"

dependencies:
  requires:
    - "phase-47"  # Company/CORTEX Separation (registry structure)
  blocks:
    - "phase-50"  # Storage Backend Abstraction
    - "phase-51"  # Secrets Management
  
  compatibility:
    individual_devs: "Fully compatible - local mode default"
    enterprise: "Enables multi-team deployment"

stages:
