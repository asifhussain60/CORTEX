---
# ============================================================================
# SOLUTION DESIGN
# ============================================================================

solution_overview: |
  Build StandardsResolver component with priority-based loading
  (company → cortex → defaults). Integrate with 5 initial orchestrators,
  then enable audit intelligence to auto-discover future orchestrators.
  Leverage Phase 28 repository profiles for company domain discovery.

architecture:
  approach: "Read-First Standards Resolution + Audit Intelligence"
  
  components:
    - name: "StandardsResolver"
      responsibility: "Priority-based standards loading with gap detection"
      location: "cortex/common/standards_resolver.py"
      behavior: |
        load_standards(domain, subdomain):
          1. Try: company/domains/{domain}/{subdomain}/
          2. If missing: cortex/knowledge/best-practices/{domain}/
          3. If missing: cortex/defaults/{domain}/
          4. Log gap if company standard missing
          5. Return: (standards_content, source_level, gaps)
      
      priority_levels:
        - level: "COMPANY"
          priority: 1
          source: "company/domains/"
          authority: "highest"
        
        - level: "CORTEX"
          priority: 2
          source: "cortex/knowledge/best-practices/"
          authority: "fallback"
        
        - level: "DEFAULTS"
          priority: 3
          source: "cortex/defaults/"
          authority: "last_resort"
      
      caching:
        strategy: "LRU cache (size=100, TTL=3600s)"
        invalidation: "File modification time check"
    
    - name: "Gap Analyzer"
      responsibility: "Detect missing company standards, generate reports"
      location: "cortex/governance/gap_analyzer.py"
      behavior: |
        - Track all standards resolution attempts
        - Log when fallback to cortex/defaults occurs
        - Generate gap report: "Missing company standards for {domain}"
        - Recommend what company should provide
        - DO NOT auto-generate company standards
      
      report_format: |
        # Company Domain Gap Report
        Generated: 2026-02-06
        
        ## Missing Standards
        - security/authentication.yaml
          Used by: SecurityCheckpointAgent
          Fallback: cortex/knowledge/best-practices/security/owasp-top-10.yaml
          Recommendation: Define company-specific auth patterns
        
        - testing/test-patterns.yaml
          Used by: TDDOrchestrator
          Fallback: cortex/defaults/testing/pytest-patterns.yaml
          Recommendation: Document company test conventions
    
    - name: "Audit Intelligence System"
      responsibility: "Auto-discover orchestrators, recommend integrations"
      location: "cortex/governance/audit_intelligence.py"
      behavior: |
        - Scan wiring.yaml for all registered orchestrators
        - Identify orchestrators without StandardsResolver integration
        - Generate integration recommendations for cortex-architect
        - Create integration templates (copy from existing patterns)
        - Track coverage over time
      
      discovery_process: |
        1. Load cortex/wiring/specifications/wiring.yaml
        2. Extract all orchestrator classes
        3. Check: Does orchestrator import StandardsResolver?
        4. If NO → Add to integration backlog
        5. Generate template: "How to integrate {orchestrator}"
        6. Notify cortex-architect in next AUDIT
      
      coverage_tracking:
        initial_orchestrators: 5
        target_coverage: "100% (all orchestrators)"
        auto_discovery: true
        update_frequency: "every AUDIT run"
    
    - name: "Repository Profile Integration"
      responsibility: "Use Phase 28 profiles for company domain discovery"
      location: "cortex/common/standards_resolver.py"
      behavior: |
        - Load repository profile from Phase 28
        - Check: profile.structure.has_company_domains
        - If true: Use profile.structure.company_domains_path
        - Use profile.structure.domains_detected for prioritization
        - Graceful degradation if profile missing
      
      example: |
        profile = load_repo_profile("ksessions")
        if profile.structure.has_company_domains:
          company_path = profile.structure.company_domains_path
          domains = profile.structure.domains_detected
          # Use for standards resolution
    
    - name: "Orchestrator Integration Pattern"
      responsibility: "Standard pattern for orchestrators to use StandardsResolver"
      template: |
        from cortex.common.standards_resolver import StandardsResolver
        
        class MyOrchestrator:
            def __init__(self):
                self.standards_resolver = StandardsResolver()
            
            def execute(self, request):
                # Load company standards first
                standards, source, gaps = self.standards_resolver.load_standards(
                    domain="security",
                    subdomain="authentication"
                )
                
                # Log gaps for reporting
                if gaps:
                    log_gap_detected(gaps)
                
                # Use standards for decision-making
                auth_pattern = standards.get("auth_pattern", "default")

  data_flow: |
    Orchestrator Request → StandardsResolver
                        ↓
    Try: company/domains/{domain}/{subdomain}/
                        ↓
    [FOUND] → Return company standard (authority=COMPANY)
    [MISSING] → Fallback to cortex/knowledge/
                        ↓
    [FOUND] → Return CORTEX standard (authority=CORTEX, gap_logged=True)
    [MISSING] → Fallback to cortex/defaults/
                        ↓
    Return default + log gap
                        ↓
    Gap Analyzer generates report
                        ↓
    Audit Intelligence discovers new orchestrators
                        ↓
    cortex-architect notified in next AUDIT

