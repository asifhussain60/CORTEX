enforcement_matrix:
  p0_blocking:
    - Exact duplicate files (CORE-035)
    - Import errors (broken code)
    - Security CWE violations
    - New files outside approved paths
    - Circular dependencies
    - Missing AC markers (audit trail)
    - Health score < 85
  
  p1_warning:
    - Similar files (>70% overlap)
    - Stub implementations (<200 LOC)
    - Weak crypto patterns
    - Complexity >15
    - Type errors
    - Deep nesting (>5 levels)
  
  p2_info:
    - Style violations
    - Complexity >10
    - Missing headers
    - Linting issues
    - Documentation gaps

