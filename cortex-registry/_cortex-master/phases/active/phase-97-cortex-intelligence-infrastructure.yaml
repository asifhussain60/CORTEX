# AC_START: AC-PHASE97-001
# Description: Comprehensive CORTEX enhancement - Health Orchestrator 2.0, LENS Intelligence Facade, Registry-Based Self-Wiring
# Authority: Phase 97 Specification

objective: |
  Transform CORTEX from reactive detection to proactive architecture enforcement through:
  1. Health Orchestrator 2.0 - Proactive sprawl prevention, security scanning, pre-implementation challenges
  2. LENS Intelligence Facade - Black-boxed unified entry point with registry-based self-wiring
  3. Orchestrator Consolidation - Reduce 147 files across 42 directories to lean production system
  4. Golden Test Workflows - End-to-end audit trace validation with SQLite metrics
  5. Evolution Timeline - Capability tracking from git history (AC markers)

business_value: |
  - 87% time savings per feature (registry auto-wiring vs manual integration)
  - 81% reduction in maintenance burden (orchestrator consolidation)
  - Zero P0 issues tolerated (progressive enforcement system)
  - 30% reduction in code quality issues (proactive prevention)
  - 50% faster onboarding (evolution timeline + documentation)

scope:
  in_scope:
    - Health Orchestrator enhancement (7 new agents)
    - LENS Intelligence Facade with workflow strategies
    - Registry-based analyzer capability system
    - Orchestrator sprawl analysis + consolidation recommendations
    - Evolution timeline analyzer (git AC markers)
    - Pre-implementation challenge agent
    - Audit trace validation workflows
    - Structure enforcement (prevent file creation outside approved paths)
    - Security gap analysis (OWASP/CWE scanning)
    - Quality metrics agent (cyclomatic complexity)
    - Brittleness detection agent
  
  out_of_scope:
    - Orchestrator deletion (deprecation only, 30-day sunset)
    - Full orchestrator rewrite (enhance existing)
    - External library additions (use existing CORTEX infrastructure)
    - Documentation generation system (separate phase)
    - Planning orchestrator rewiring (separate effort)

stages:
  - stage_id: "S1"
    title: "Health Orchestrator 2.0 - New Agents"
    duration_hours: 8
    deliverables:
      - StructureEnforcementAgent (blocks file creation outside approved paths)
      - OrchestratorConsolidationAgent (detect sprawl, propose merges)
      - BrittlenessDetectionAgent (find architectural weaknesses)
      - SecurityGapAnalyzer (OWASP/CWE scanning, secrets detection)
      - QualityMetricsAgent (cyclomatic complexity, maintainability index)
      - PreImplementationChallengeAgent (LENS-driven user guidance)
      - AuditTraceValidationAgent (golden test workflow validation)
    tests:
      - Unit tests for each agent (7 × 5 tests = 35 tests)
      - Integration tests with HealthOrchestrator
      - Golden test workflows
    acceptance_criteria:
      - All 7 agents registered in HealthOrchestrator
      - Pre-commit hook blocks P0 violations
      - Challenge agent triggers on IMPLEMENT intent
      - Audit trace validation passes for sample workflow
  
  - stage_id: "S2"
    title: "LENS Intelligence Facade - Black Box Entry Point"
    duration_hours: 8
    deliverables:
      - LENSIntelligenceFacade class (single entry point)
      - 9 workflow methods (refactor, security, implementation, evolution, onboarding, debugging, migration, documentation, compliance)
      - WorkflowStrategy base class + concrete strategies
      - LENSOrchestrator encapsulation (make analyzers private)
      - MCP tool unification (cortex_lens_analyze with workflow parameter)
    tests:
      - 45 golden tests (5 per workflow)
      - Facade integration tests
      - MCP tool backward compatibility tests
    acceptance_criteria:
      - Single LENSIntelligenceFacade.analyze() method
      - All workflows route through facade
      - Internal analyzers hidden from external callers
      - MCP tool supports all 9 workflows
  
  - stage_id: "S3"
    title: "Registry-Based Self-Wiring System"
    duration_hours: 10
    deliverables:
      - AnalyzerCapabilityRegistry (plugin discovery)
      - @analyzer_capabilities decorator
      - WorkflowAutoComposer (optimal pipeline selection)
      - Annotate 9 existing analyzers with capabilities
      - MCP auto-registration from capabilities
      - Cost-aware execution ordering
    tests:
      - 60 golden tests (auto-wiring validation)
      - Extension scenario tests (add analyzer without breaking)
      - Performance tests (cache hit rate >70%)
    acceptance_criteria:
      - New analyzers auto-register via decorator
      - Workflows auto-compose from capability queries
      - MCP tools auto-generate from analyzer capabilities
      - Adding analyzer takes <30 minutes (vs 4 hours manual)
  
  - stage_id: "S4"
    title: "Evolution Timeline Analyzer"
    duration_hours: 4
    deliverables:
      - EvolutionAnalyzer (LENS layer)
      - EvolutionMilestone + EvolutionTimeline data models
      - cortex_evolution_timeline MCP tool
      - Timeline YAML storage (cortex-registry/_cortex-master/evolution/)
      - Impact scoring algorithm (files_changed + tests_added + AC markers)
    tests:
      - 15 golden tests (milestone extraction, AC parsing, impact scoring)
      - Integration with GitHistoryAnalyzer
      - SQLite dashboard export
    acceptance_criteria:
      - Extracts milestones from AC_COMPLETE markers
      - Calculates impact scores for each phase
      - Generates timeline.yaml in registry
      - MCP tool returns JSON/YAML/markdown formats
  
  - stage_id: "S5"
    title: "Orchestrator Consolidation Analysis"
    duration_hours: 6
    deliverables:
      - Orchestrator sprawl detection (42 dirs, 147 files)
      - Pattern matching algorithm (>70% capability overlap)
      - Consolidation recommendations report
      - Merge simulation tests (dependency validation)
      - Deprecation strategy (30-day sunset)
    tests:
      - Pattern detection accuracy tests
      - Dependency graph validation
      - Merge simulation tests
    acceptance_criteria:
      - Report identifies duplicate orchestrator patterns
      - Proposes consolidated wiring.yaml
      - Validates no broken dependencies
      - Generates migration guide
  
  - stage_id: "S6"
    title: "Progressive Enforcement System"
    duration_hours: 4
    deliverables:
      - P0/P1/P2 enforcement matrix
      - Enhanced pre-commit hook (hard block on P0)
      - Soft block with justification requirement (P1)
      - Health score calculation (target: 85/100 minimum)
      - Dashboard metrics integration
    tests:
      - Enforcement rule tests
      - Pre-commit hook integration tests
      - Health score calculation tests
    acceptance_criteria:
      - P0 issues block commits (zero tolerance)
      - P1 issues require justification (warning + prompt)
      - P2 issues reported only (informational)
      - Health score ≥ 85 required for merge
  
  - stage_id: "S7"
    title: "Golden Test Workflows + Audit Validation"
    duration_hours: 4
    deliverables:
      - End-to-end workflow validation
      - SQLite audit trace validation
      - Regression detection (health score drops >10 points)
      - Baseline comparison framework
      - CI/CD integration
    tests:
      - Full cycle tests (create → edit → test → commit → push)
      - Audit trail completeness validation
      - Regression detection tests
    acceptance_criteria:
      - Golden tests validate complete audit trail
      - SQLite metrics match expected thresholds
      - No regressions vs baseline
      - CI workflow runs health checks on push
  
  - stage_id: "S8"
    title: "MasterOrchestrator + InteractionOrchestrator Integration"
    duration_hours: 6
    deliverables:
      - MasterOrchestrator prebuilt workflows (5 methods)
      - InteractionOrchestrator workflow detection
      - LENS facade wiring into both orchestrators
      - Workflow trigger logic (operation → strategy mapping)
      - Documentation for orchestrator integration
    tests:
      - Integration tests for both orchestrators
      - Workflow detection accuracy tests
      - End-to-end user flow tests
    acceptance_criteria:
      - MasterOrchestrator.gather_refactor_context() works
      - InteractionOrchestrator detects workflows from operations
      - All 9 workflows accessible from orchestrators
      - No regression in existing orchestrator behavior
  
  - stage_id: "S9"
    title: "Documentation + Deployment"
    duration_hours: 4
    deliverables:
      - Updated copilot-instructions.md (Phase 97 rules)
      - Agent documentation (health agents, LENS facade)
      - MCP tool documentation (updated tool catalog)
      - Migration guide (old MCP tools → unified tool)
      - Dashboard visualization updates
    tests:
      - Documentation completeness validation
      - Example code validation
      - Migration guide accuracy
    acceptance_criteria:
      - All new components documented
      - Migration guide tested on sample repo
      - Dashboard shows new health metrics
      - MCP tool catalog updated

