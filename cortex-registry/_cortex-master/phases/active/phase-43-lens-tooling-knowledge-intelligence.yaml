# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    A single cohesive initiative that:

    1. **Wires disconnected LENS components** — TypeScript/JS adapters, CallGraphBuilder,
       DependencyMapper, DoR checks already exist but are not connected
    2. **Adds semantic enrichment** — Jedi for Python deep analysis, symtable for scope
    3. **Bridges refactoring execution** — TDD REFACTOR phase actually invokes Rope/Roslyn
       instead of returning hardcoded strings; adds LibCST for safe transforms
    4. **Enhances onboarding** — Tiered domain extraction with confidence gating
    5. **Creates requirements intelligence** — Reverse-engineer requirements from git,
       AC markers, phase YAMLs, and digest sessions into company/requirements/
    6. **Restores registry data integrity** — Fix index.yaml status drift, stale
       plan-summary.json, frozen eras.json, orphan directives, mode naming

  problem_statement: |
    CORTEX has significant untapped value:
    - TypeScriptAdapter exists (8/8 tests) but isn't wired into PolyglotAnalyzer
    - CallGraphBuilder and DependencyMapper exist but LENS never populates relationship_findings
    - DoRValidator has zero registered checks (passes everything)
    - TDDOrchestrator REFACTOR phase returns hardcoded suggestion strings
    - EnhancedRefactoringOrchestrator never delegates to Rope/Roslyn adapters
    - _compute_risk_scores() and _compute_impact_analysis() are stubs
    - company/domains/ exists but onboarding doesn't do deep domain extraction
    - No requirements tracking — approved decisions scattered across git history
    - Registry data (plan-summary.json, eras.json, index.yaml) has 23% drift

  business_impact:
    - "🔌 Wire existing code → immediate capability with zero new dependencies"
    - "🧠 Jedi enrichment → DoR confidence based on real type resolution"
    - "🔧 Real refactoring execution → TDD cycle completes end-to-end"
    - "🏢 Deep onboarding → company domain knowledge grows with every repo"
    - "📋 Requirements intelligence → persistent, searchable decision history"
    - "📊 Registry hygiene → dashboard shows truth, tooling can trust status fields"

  expected_outcomes:
    - "PolyglotAnalyzer supports .ts/.tsx/.js/.jsx via existing adapters"
    - "LENS relationship_findings populated with call graph + dependency data"
    - "DoRValidator has 5+ default checks registered at init"
    - "TDD REFACTOR phase invokes RefactoringOrchestrator with real Rope operations"
    - "SemanticEnricher ABC + JediSemanticEnricher for Tier 2 LENS"
    - "symtable integration for scope analysis (<5ms)"
    - "LibCST for formatting-safe code transforms in REFACTOR path"
    - "DomainKnowledgeExtractor with confidence-gated tiered extraction"
    - "company/requirements/ with per-artifact YAML tracking"
    - "cortex_extract_requirements MCP tool"
    - "index.yaml reconciled, plan-summary.json regenerated, eras.json updated"
    - "200+ tests across all stages"

