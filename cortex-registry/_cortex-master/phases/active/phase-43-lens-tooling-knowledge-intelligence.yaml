         - Reconcile statistics section with actual counts
      2. Regenerate plan-summary.json from index.yaml SSOT
      3. Update eras.json with Eras 7-9 (phases 24-42)
      4. Unify mode naming: INTERACTIVE+LIST → QUERY in modes.yaml and directives
      5. Deduplicate enhancement-history.yaml (keep latest per ENH ID)
      6. CDP directive deprecation notice in directive-protocol.yaml
    duration: "1 day"
    tests_target: 14
    priority: "P0"
    effort: "LOW"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-044"
        description: "index.yaml active_phases contains only status=active|planned phases"
        tests: 2
      - id: "AC-PHASE43-045"
        description: "plan-summary.json matches index.yaml within 2% variance"
        tests: 2
      - id: "AC-PHASE43-046"
        description: "eras.json covers all phases through Phase 42"
        tests: 2
      - id: "AC-PHASE43-047"
        description: "modes.yaml references QUERY mode (not INTERACTIVE+LIST separately)"
        tests: 2
      - id: "AC-PHASE43-048"
        description: "enhancement-history.yaml has no duplicate ENH IDs"
        tests: 2
      - id: "AC-PHASE43-049"
        description: "Statistics section auto-calculated from actual entries"
        tests: 2
      - id: "AC-PHASE43-050"
        description: "CDP directive-protocol.yaml has deprecation notice"
        tests: 2
    files_to_modify:
      - "cortex-registry/_cortex-master/index.yaml"
      - "cortex-registry/_cortex-master/dashboard/data/plan-summary.json"
      - "cortex-registry/_cortex-master/dashboard/data/eras.json"
      - "cortex-registry/_cortex-master/meta/modes.yaml"
      - "cortex-registry/_cortex-master/meta/directive-protocol.yaml"
      - "cortex-registry/_cortex-master/meta/directive-index.yaml"

  stage_10:
    name: "Registry Validation Script + Integration Tests"
    description: |
      1. Create registry validation script that:
         - Counts phases and verifies statistics accuracy
         - Checks all file path references resolve to actual files
         - Validates status field consistency (no completed phases in active section)
         - Verifies test count claims against actual pytest output
         - Detects duplicate entries
      2. Integration tests verifying cross-stage cohesion:
         - LENS → DoR → TDD → REFACTOR → RefactoringOrchestrator flow
         - Onboarding → DomainExtraction → company/domains/ flow
         - Requirements extraction → company/requirements/ → DoR enrichment flow
      3. Wire validation script into AUDIT mode P1 checks
    duration: "1 day"
    tests_target: 10
    priority: "P1"
    effort: "LOW"
    impact: "MEDIUM"
    acceptance_criteria:
      - id: "AC-PHASE43-051"
