# ============================================================================
# STAGES (10 Stages — Execution Order)
# ============================================================================
# Order: S1-S2 (wire existing) → S3-S4 (enrich) → S5-S6 (refactor bridge)
#        → S7-S8 (knowledge) → S9-S10 (registry hygiene)
# ============================================================================

stages:
  # ──────────────────────────────────────────────────────────────────────
  # BATCH 1: Wire Existing Disconnected Code (Days 1-3)
  # ──────────────────────────────────────────────────────────────────────
  stage_1:
    name: "Wire LENS Adapters & Relationship Findings"
    description: |
      Connect components that already exist but are not wired:
      1. Wire TypeScriptAdapter + JavaScriptAdapter into PolyglotAnalyzer.language_map
      2. Wire CallGraphBuilder + DependencyMapper into LENSOrchestrator.analyze_file()
         to populate relationship_findings
      3. Wire PatternDetector for architectural pattern recognition
      
      All adapters already have passing tests — this is pure wiring work.
    duration: "1 day"
    tests_target: 18
    priority: "P0"
    effort: "LOW"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-001"
        description: "PolyglotAnalyzer maps .ts/.tsx to TypeScriptAdapter"
        tests: 3
      - id: "AC-PHASE43-002"
        description: "PolyglotAnalyzer maps .js/.jsx to JavaScriptAdapter"
        tests: 3
      - id: "AC-PHASE43-003"
        description: "LENSOrchestrator.analyze_file() populates relationship_findings via CallGraphBuilder"
        tests: 4
      - id: "AC-PHASE43-004"
        description: "LENSOrchestrator.analyze_file() populates dependency_findings via DependencyMapper"
        tests: 4
      - id: "AC-PHASE43-005"
        description: "PatternDetector results included in LENS context output"
        tests: 4
    files_to_modify:
      - "cortex/lens/analyzers/polyglot_analyzer.py"
      - "cortex/lens/orchestrator.py"
    files_to_create:
      - "tests/unit/lens/test_polyglot_wiring.py"
      - "tests/unit/lens/test_lens_relationship_findings.py"

  stage_2:
    name: "Wire DoR Default Checks & Risk Computation"
    description: |
      1. Register 5 default checks in DoRValidator at init:
         - LENS coverage check (files analyzed vs total)
         - Intent clarity check (keyword extraction confidence)
         - Target specificity check (file/class/function identified)
         - Dependency complexity check (import depth)
         - Test coverage baseline check
      2. Replace stub _compute_risk_scores() with real LENS-data-driven scoring
      3. Replace stub _compute_impact_analysis() with dependency-based impact
    duration: "2 days"
    tests_target: 22
    priority: "P0"
    effort: "LOW"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-006"
        description: "DoRValidator initializes with 5 default checks"
        tests: 5
      - id: "AC-PHASE43-007"
        description: "LENS coverage check computes file analysis ratio"
        tests: 3
      - id: "AC-PHASE43-008"
        description: "Intent clarity check extracts and scores keywords"
        tests: 3
      - id: "AC-PHASE43-009"
        description: "_compute_risk_scores() uses LENS complexity + dependency data"
        tests: 5
      - id: "AC-PHASE43-010"
        description: "_compute_impact_analysis() uses dependency graph for blast radius"
        tests: 6
    files_to_modify:
      - "cortex/orchestrators/core/validation/dor_validator.py"
      - "cortex/orchestrators/core/orchestrator_base_protocol.py"
    files_to_create:
      - "tests/unit/orchestrators/core/test_dor_default_checks.py"
      - "tests/unit/orchestrators/core/test_risk_computation.py"

  # ──────────────────────────────────────────────────────────────────────
  # BATCH 2: Semantic Enrichment (Days 4-6)
  # ──────────────────────────────────────────────────────────────────────
  stage_3:
    name: "SemanticEnricher ABC + Jedi Integration"
    description: |
      1. Create SemanticEnricher abstract base class with methods:
         - enrich(file_path) → SemanticContext
         - supports_language(lang) → bool
         - get_cross_references(symbol) → List[Reference]
         - resolve_types(scope) → TypeMap
      2. Implement JediSemanticEnricher using jedi library:
         - Cross-file references (goto_definitions, find_references)
         - Type inference (infer types for variables/functions)
         - Import resolution (follow import chains)
         - Call graph (function call relationships)
      3. Wire into LENSOrchestrator as optional Tier 2 pass:
         - Triggered when DoR confidence is borderline (55-65%)
         - OR when intent is REFACTOR/IMPLEMENT
         - Results feed into DoR confidence recalculation
    duration: "3 days"
    tests_target: 30
    priority: "P1"
    effort: "MEDIUM"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-011"
        description: "SemanticEnricher ABC defines standard enrichment interface"
        tests: 4
      - id: "AC-PHASE43-012"
        description: "JediSemanticEnricher resolves cross-file references for Python"
        tests: 6
      - id: "AC-PHASE43-013"
        description: "JediSemanticEnricher infers types for variables and return values"
        tests: 6
      - id: "AC-PHASE43-014"
        description: "JediSemanticEnricher resolves import chains"
        tests: 4
      - id: "AC-PHASE43-015"
        description: "LENSOrchestrator triggers Tier 2 enrichment when DoR borderline"
        tests: 5
      - id: "AC-PHASE43-016"
        description: "Enriched data recalculates DoR confidence (replaces stubs)"
        tests: 5
    files_to_create:
      - "cortex/lens/enrichers/semantic_enricher.py"
      - "cortex/lens/enrichers/jedi_enricher.py"
      - "cortex/lens/enrichers/__init__.py"
      - "tests/unit/lens/enrichers/test_semantic_enricher.py"
      - "tests/unit/lens/enrichers/test_jedi_enricher.py"
    files_to_modify:
      - "cortex/lens/orchestrator.py"

  stage_4:
    name: "symtable Integration for Scope Analysis"
    description: |
      1. Add symtable (stdlib) integration into ASTAnalyzer:
         - Variable scope resolution (local, global, free, cell)
         - Symbol classification (imported, assigned, referenced)
         - Nested scope analysis (closures, comprehensions)
      2. Zero external dependencies — stdlib only
      3. Performance: <5ms per file (negligible overhead)
    duration: "1 day"
    tests_target: 12
    priority: "P1"
    effort: "LOW"
    impact: "MEDIUM"
    acceptance_criteria:
      - id: "AC-PHASE43-017"
        description: "ASTAnalyzer.analyze() includes scope_analysis in output"
        tests: 3
      - id: "AC-PHASE43-018"
        description: "Scope analysis identifies local, global, free variables"
        tests: 3
      - id: "AC-PHASE43-019"
        description: "Scope analysis detects imported vs assigned symbols"
        tests: 3
      - id: "AC-PHASE43-020"
        description: "Performance: scope analysis completes in <5ms for 500-line file"
        tests: 3
    files_to_modify:
      - "cortex/lens/analyzers/ast_analyzer.py"
    files_to_create:
      - "tests/unit/lens/test_symtable_integration.py"

  # ──────────────────────────────────────────────────────────────────────
  # BATCH 3: Refactoring Bridge (Days 7-9)
  # ──────────────────────────────────────────────────────────────────────
  stage_5:
    name: "TDD REFACTOR → Real Refactoring Execution"
    description: |
      1. Wire TDDOrchestrator REFACTOR phase to invoke
         RefactoringOrchestrator.execute_refactoring() with the Rope adapter
         for Python files instead of returning hardcoded suggestion strings
      2. Wire EnhancedRefactoringOrchestrator to delegate execution to
         tool-specific adapters (Rope for Python, Roslyn for C#, TS adapter for TypeScript)
      3. Add tool availability checks to DoD criteria:
         REFACTOR phase verifies transformations via adapters before marking complete
    duration: "2 days"
    tests_target: 20
    priority: "P1"
    effort: "MEDIUM"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-021"
        description: "TDDOrchestrator REFACTOR phase calls RefactoringOrchestrator for Python"
        tests: 5
      - id: "AC-PHASE43-022"
        description: "EnhancedRefactoringOrchestrator delegates to Rope adapter for .py files"
        tests: 4
      - id: "AC-PHASE43-023"
        description: "EnhancedRefactoringOrchestrator delegates to TypeScript adapter for .ts/.tsx"
        tests: 4
      - id: "AC-PHASE43-024"
        description: "DoD criteria includes tool execution verification"
        tests: 4
      - id: "AC-PHASE43-025"
        description: "Graceful fallback when adapter unavailable (returns suggestions, not crash)"
        tests: 3
    files_to_modify:
      - "cortex/testing/tdd_orchestrator.py"
      - "cortex/domain_orchestrators/refactoring/enhanced_refactoring_orchestrator.py"
    files_to_create:
      - "tests/unit/testing/test_tdd_refactor_execution.py"
      - "tests/unit/domain_orchestrators/test_refactoring_bridge.py"

  stage_6:
    name: "LibCST for Formatting-Safe Transforms"
    description: |
      1. Add LibCST as optional backend for REFACTOR execution path:
         - Preserves whitespace, comments, and formatting during transforms
         - Supports extract_method, rename, inline operations
      2. Create LibCSTTransformer adapter implementing same interface as Rope adapter
      3. Configure preference: LibCST preferred over raw ast for Python transforms
         (Rope still used for cross-file operations like rename-across-project)
    duration: "2 days"
    tests_target: 16
    priority: "P1"
    effort: "MEDIUM"
    impact: "MEDIUM"
    acceptance_criteria:
      - id: "AC-PHASE43-026"
        description: "LibCSTTransformer preserves whitespace during rename operations"
        tests: 4
      - id: "AC-PHASE43-027"
        description: "LibCSTTransformer preserves comments during extract_method"
        tests: 4
      - id: "AC-PHASE43-028"
        description: "LibCSTTransformer integrates with RefactoringOrchestrator adapter registry"
        tests: 4
      - id: "AC-PHASE43-029"
        description: "Fallback to Rope when LibCST cannot handle operation"
        tests: 4
    files_to_create:
      - "cortex/refactoring/adapters/libcst_adapter.py"
      - "tests/unit/refactoring/test_libcst_adapter.py"
    files_to_modify:
      - "cortex/refactoring/orchestrator.py"

  # ──────────────────────────────────────────────────────────────────────
  # BATCH 4: Knowledge Intelligence (Days 10-12)
  # ──────────────────────────────────────────────────────────────────────
  stage_7:
    name: "Deep Onboarding Domain Extraction"
    description: |
      1. Create DomainKnowledgeExtractor with tiered confidence gating:
         - T0 (Structural): languages, frameworks, deps, file layout — Always (100%)
         - T1 (Behavioral): API contracts, DB schemas, config patterns — ≥70%
         - T2 (Semantic): Business terms, entity names, relationship patterns — ≥80%
         - T3 (Historical): Code evolution patterns, ADRs, deprecated patterns — ≥85%
      2. Wire into RepositoryOnboardingOrchestrator pipeline between
         LENSOrchestrator.analyze_repository_holistic() and _update_company_domains()
      3. Add staleness detection: extracted_at + source_commit fields in domain YAMLs
      4. Add DomainMergeStrategy for multi-user conflict resolution
         (confidence-weighted merge, not last-writer-wins)
    duration: "3 days"
    tests_target: 28
    priority: "P1"
    effort: "HIGH"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-030"
        description: "DomainKnowledgeExtractor produces T0 structural findings for any repo"
        tests: 4
      - id: "AC-PHASE43-031"
        description: "T1 behavioral extraction detects API contracts and DB schemas"
        tests: 4
      - id: "AC-PHASE43-032"
        description: "T2 semantic extraction identifies business domain terms from naming"
        tests: 4
      - id: "AC-PHASE43-033"
        description: "T3 historical extraction analyzes git evolution patterns"
        tests: 4
      - id: "AC-PHASE43-034"
        description: "Confidence gating filters low-quality extractions per tier threshold"
        tests: 4
      - id: "AC-PHASE43-035"
        description: "Staleness detection flags domain YAMLs older than source_commit"
        tests: 4
      - id: "AC-PHASE43-036"
        description: "DomainMergeStrategy resolves conflicts via confidence weighting"
        tests: 4
    files_to_create:
      - "cortex/domain_brain/extractors/domain_knowledge_extractor.py"
      - "cortex/domain_brain/extractors/domain_merge_strategy.py"
      - "cortex/domain_brain/extractors/__init__.py"
      - "tests/unit/domain_brain/extractors/test_domain_knowledge_extractor.py"
      - "tests/unit/domain_brain/extractors/test_domain_merge_strategy.py"
    files_to_modify:
      - "cortex/orchestrators/support/onboarding_orchestrator.py"

  stage_8:
    name: "Requirements Reverse Engineering"
    description: |
      1. Create RequirementsExtractor that mines 5 sources:
         - Phase YAML specs: problem_statement, success_criteria (⭐⭐⭐⭐⭐)
         - AC markers in code: AC_START/AC_COMPLETE descriptions (⭐⭐⭐⭐)
         - Copilot chat digests: approved decisions from DIGEST mode (⭐⭐⭐⭐)
         - Git diff analysis: section evolution patterns (⭐⭐⭐)
         - Git commit messages: NLP intent classification (⭐⭐)
      2. Create company/requirements/ structure:
         - index.yaml — master index of tracked artifacts
         - artifacts/*.yaml — per-artifact YAML with temporal entries
         - decisions/*.yaml — monthly decision log
      3. Expose as MCP tool: cortex_extract_requirements
         - Parameters: file_paths, depth (shallow|deep), since (date), output_path
      4. Integration points:
         - DoR gate checks company/requirements/ for existing context
         - Total Recall searches company/requirements/ as knowledge source
         - DIGEST mode adds requirements extraction category
    duration: "3 days"
    tests_target: 30
    priority: "P1"
    effort: "HIGH"
    impact: "HIGH"
    acceptance_criteria:
      - id: "AC-PHASE43-037"
        description: "RequirementsExtractor parses phase YAML problem_statement + success_criteria"
        tests: 5
      - id: "AC-PHASE43-038"
        description: "RequirementsExtractor scans codebase for AC_START/AC_COMPLETE markers"
        tests: 5
      - id: "AC-PHASE43-039"
        description: "RequirementsExtractor extracts decisions from DIGEST session outputs"
        tests: 4
      - id: "AC-PHASE43-040"
        description: "RequirementsExtractor analyzes git diff for file section evolution"
        tests: 4
      - id: "AC-PHASE43-041"
        description: "Per-artifact YAML generated with temporal entries and confidence scores"
        tests: 4
      - id: "AC-PHASE43-042"
        description: "cortex_extract_requirements MCP tool operational"
        tests: 4
      - id: "AC-PHASE43-043"
        description: "DoR gate enriches confidence from company/requirements/ context"
        tests: 4
    files_to_create:
      - "cortex/knowledge/requirements_extractor.py"
      - "cortex/mcp/tools/requirements_tool.py"
      - "company/requirements/index.yaml"
      - "tests/unit/knowledge/test_requirements_extractor.py"
      - "tests/unit/mcp/tools/test_requirements_tool.py"
    files_to_modify:
      - "cortex/wiring/specifications/wiring.yaml"

  # ──────────────────────────────────────────────────────────────────────
  # BATCH 5: Registry Hygiene (Days 13-14)
  # ──────────────────────────────────────────────────────────────────────
  stage_9:
    name: "Registry Data Reconciliation"
    description: |
      Fix all data integrity issues identified in audit:
      1. index.yaml status reconciliation:
         - Move completed phases out of active_phases section
         - Fix Phase 38 status from "complete" to "unblocked" (only 38.0 done)
