description: |
  REVISED SCOPE: Wire existing LENS components into unified pipeline, optimize
  performance, and cleanup obsolete implementations. Intelligence layer integration
  moved to Phase 54 (MCP-level enforcement, not LENS-specific).
  
  Production Reality (VERIFIED):
  - ✅ LENSOrchestrator EXISTS (AST + Git + Comments analysis)
  - ✅ KnowledgeSynthesisEngine EXISTS (45+ YAMLs loaded dynamically)
  - ✅ UnifiedIntelligenceContext EXISTS (Phase 20.5 - layered synthesis)
  - ✅ CCL EXISTS (Phase 49 - async prefetch)
  - ⚠️ GAP: LENS Pipeline Phase 2 uses stubs (not wired to LENSOrchestrator)
  - ⚠️ GAP: LENS Pipeline Phase 4 knowledge retrieval incomplete wiring
  - ⚠️ GAP: No adaptive routing (static 1:1 intent → orchestrator)
  - ⚠️ GAP: Obsolete implementations (lens_synthesis.py, lens_analysis_extractor.py)
  
  Revised Target State:
  - ✅ LENS Pipeline Phase 2 → LENSOrchestrator (real analysis)
  - ✅ LENS Pipeline Phase 4 → KnowledgeSynthesisEngine (YAML loading)
  - ✅ Adaptive routing with confidence gating (multi-orchestrator workflows)
  - ✅ Performance optimized (caching, parallel phases)
  - ✅ Obsolete code removed (mandatory cleanup)
  - ✅ Intelligence layer via Phase 54 (MCP enforcement, not LENS-internal)

objectives:
  - "Wire LENS Pipeline Phase 2 to LENSOrchestrator (real AST/Git analysis)"
  - "Wire LENS Pipeline Phase 4 to KnowledgeSynthesisEngine (YAML loading)"
  - "Implement semantic intent classification (replace pattern matching)"
  - "Build adaptive routing with confidence gating (multi-orchestrator workflows)"
  - "Add dynamic confidence scoring with historical success tracking"
  - "Optimize performance (caching, parallel execution, lazy loading)"
  - "Cleanup obsolete implementations (lens_synthesis.py, etc.)"
  - "Migrate consumers to unified LENS Pipeline (backward compatibility)"

success_metrics:
  - intent_accuracy: "95% (from 60%)"
  - codebase_understanding: "90% (from 0%)"
  - knowledge_retrieval: "100% (from 0%)"
  - knowledge_relevance: "92% (from 45%)"  # NEW: Context-aware knowledge
  - gap_coverage: "98% (from 60%)"  # NEW: Layered fallback coverage
  - tech_stack_detection: "100% (from 0%)"  # NEW: Auto-detect from AST
  - staleness_detection: "Auto (from manual)"  # NEW: Per-request staleness check
  - routing_accuracy: "95% (from 70%)"
  - confidence_calibration_error: "≤10%"  # NEW: Calibrated predictions
  - latency_p95: "<50ms (from <10ms baseline, +15ms for intelligence layer acceptable)"
  - test_coverage: "≥90% for all LENS components"

dependencies:
  required_before:
    - "Phase 48: Multi-Tenant Foundation (COMPLETE)"
    - "Phase 49: Context Crystallization (COMPLETE)"
    - "Phase 50: Storage Backend (COMPLETE)"
    - "Phase 51: MCP-FIRST Enforcement (COMPLETE)"
    - "Phase 54: Intelligence Layer Enforcement (S1-S5 DEPLOYED) [Coordination]"
  unlocks_phases:
    - "Phase 55: Multi-Tenant Expansion"
  phase_54_coordination:
    description: "Phase 53 and Phase 54 execute in parallel with coordination points"
    integration_points:
      - "S2: Validate gap-filling with Phase 54 S2 test suite (before Phase 53 S2 execution)"
      - "S4-S5: Assume Phase 54 S1 IntelligenceGate active (context pre-injected in kwargs)"
      - "S6: Parallel execution: CCL pre-warming active (Phase 54 S5) -> cache hits expected"
      - "S10 Optional: StalenessChecker can optionally run if Phase 54 S3 needs validation"
      - "Performance targets: Phase 54 S5 CCL caching enables <50ms LENS latency target"

# ============================================================================
# STAGE 1: FOUNDATION FIXES (P0 BLOCKERS)
# ============================================================================

stages:
  - stage_id: "S1"
    stage_name: "Foundation Fixes - Phase 2 Integration"
    duration_days: 2
    priority: "P0"
    
    description: |
      Connect LENS Pipeline Phase 2 (Examination) to LENSOrchestrator for real
      codebase analysis instead of stub data. Replace hardcoded feature lists
      with actual AST analysis, Git history, and comment extraction.
    
    tasks:
      - task_id: "S1.T1"
        description: "Create LENSOrchestrator integration adapter"
        file: "cortex/brain/lens/orchestrator_adapter.py"
        tests: "tests/unit/brain/lens/test_orchestrator_adapter.py"
        acceptance_criteria:
          - "Adapter wraps LENSOrchestrator.analyze_file()"
          - "Returns ExaminationPhaseOutput format"
          - "Handles missing repo_path gracefully"
          - "100% test coverage"
      
      - task_id: "S1.T2"
        description: "Replace ExaminationPhase stub logic with real analysis"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_pipeline_s1.py"
        acceptance_criteria:
          - "ExaminationPhase.execute() calls orchestrator_adapter"
          - "features_identified from AST analysis"
          - "relationships from call graph"
          - "complexity_score from McCabe complexity"
          - "Backwards compatible (graceful degradation if adapter fails)"
      
      - task_id: "S1.T3"
        description: "Add AST call graph relationship extraction"
        file: "cortex/lens/analyzers/ast_analyzer.py"
        tests: "tests/unit/lens/analyzers/test_ast_call_graph.py"
        acceptance_criteria:
          - "Extract function calls within file"
          - "Return List[Tuple[caller, callee]]"
          - "Handle import chains"
          - "Performance: <100ms for 1000 LOC file"
      
      - task_id: "S1.T4"
        description: "Integration test: Pipeline with real Python file"
        file: "tests/integration/lens/test_pipeline_real_analysis.py"
        acceptance_criteria:
          - "Analyze cortex/orchestrators/core/master_orchestrator.py"
          - "Extract ≥10 real functions"
          - "Identify ≥5 real relationships"
          - "Complexity score > 0.5 (non-trivial file)"
          - "End-to-end latency <50ms"
    
    validation:
      - "pytest tests/unit/brain/lens/test_orchestrator_adapter.py -v"
      - "pytest tests/unit/brain/lens/test_pipeline_s1.py -v"
      - "pytest tests/integration/lens/test_pipeline_real_analysis.py -v"
      - "Coverage ≥90% for Stage 1 files"

  # ========================================================================
  # STAGE 2: KNOWLEDGE INTEGRATION (P0 BLOCKER)
  # ========================================================================

  - stage_id: "S2"
    stage_name: "Knowledge Base Integration - Phase 4"
    duration_days: 2
    priority: "P0"
    
    description: |
      Implement dynamic knowledge retrieval from cortex/knowledge/ YAML repository.
      Replace empty cache with intelligent loading of best practices, standards,
      and domain knowledge based on intent, context, and examination results.
    
    tasks:
      - task_id: "S2.T1"
        description: "Create knowledge loader with semantic search"
        file: "cortex/brain/lens/knowledge_loader.py"
        tests: "tests/unit/brain/lens/test_knowledge_loader.py"
        acceptance_criteria:
          - "load_knowledge_for_intent(intent, context, patterns)"
          - "Loads relevant YAMLs from cortex/knowledge/best-practices/"
          - "Semantic matching (fuzzy string similarity ≥0.7)"
          - "Returns structured knowledge entries"
          - "Cache loaded YAMLs (avoid re-parsing)"
      
      - task_id: "S2.T2"
        description: "Intent-to-knowledge category mapping"
        file: "cortex/brain/lens/knowledge_categories.py"
        tests: "tests/unit/brain/lens/test_knowledge_categories.py"
        acceptance_criteria:
          - "IMPLEMENT → ['TDD', 'clean-code', '12-factor']"
          - "FIX → ['debugging', 'error-handling', 'testing']"
          - "REFACTOR → ['design-patterns', 'solid-principles']"
          - "SECURITY → ['owasp', 'authentication', 'encryption']"
          - "Extensible (easy to add new mappings)"
      
      - task_id: "S2.T3"
        description: "Replace KnowledgePhase stub with real retrieval"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_pipeline_s2.py"
        acceptance_criteria:
          - "KnowledgePhase.execute() calls knowledge_loader"
          - "Cache key = (intent, context_hash, patterns)"
          - "Returns ≥3 knowledge entries for common intents"
          - "Graceful degradation if knowledge loading fails"
      
      - task_id: "S2.T4"
        description: "Integration test: Knowledge retrieval for all intents"
        file: "tests/integration/lens/test_knowledge_retrieval.py"
        acceptance_criteria:
          - "Test all 5 intent types (IMPLEMENT, FIX, REFACTOR, UNDERSTAND, TEST)"
          - "Each returns ≥3 knowledge entries"
          - "Verify TDD patterns for IMPLEMENT"
          - "Verify OWASP for security-related intents"
          - "Latency <20ms for cached queries"
    
    validation:
      - "pytest tests/unit/brain/lens/test_knowledge_loader.py -v"
      - "pytest tests/integration/lens/test_knowledge_retrieval.py -v"
      - "Verify 45+ YAML files now accessible"
      - "Cache hit rate ≥70% after warmup"

  # ========================================================================
  # STAGE 3: SEMANTIC INTENT CLASSIFICATION
  # ========================================================================

  - stage_id: "S3"
    stage_name: "Semantic Intent Classification"
    duration_days: 3
    priority: "P1"
    
    description: |
      Replace pattern matching with semantic intent classification using
      embeddings and similarity scoring. Enable multi-label classification
      (compound intents like "fix and refactor").
    
    tasks:
      - task_id: "S3.T1"
        description: "Create intent embedding database"
        file: "cortex/brain/lens/intent_embeddings.py"
        tests: "tests/unit/brain/lens/test_intent_embeddings.py"
        acceptance_criteria:
          - "Pre-compute embeddings for 100+ example requests per intent"
          - "Use sentence-transformers (lightweight, no API calls)"
          - "Store in SQLite for fast lookup"
          - "Support multi-label classification"
      
      - task_id: "S3.T2"
        description: "Semantic similarity classifier"
        file: "cortex/brain/lens/semantic_classifier.py"
        tests: "tests/unit/brain/lens/test_semantic_classifier.py"
        acceptance_criteria:
          - "Calculate cosine similarity to example embeddings"
          - "Threshold: primary intent ≥0.7, secondary ≥0.5"
          - "Return confidence scores for all intents"
          - "Fallback to pattern matching if similarity <0.5"
      
      - task_id: "S3.T3"
        description: "Upgrade LanguagePhase to semantic classification"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_pipeline_s3.py"
        acceptance_criteria:
          - "LanguagePhase.execute() uses semantic_classifier"
          - "Return multi-label intents (sorted by confidence)"
          - "Maintain backwards compatibility (single intent as primary)"
          - "Performance: <10ms for classification"
      
      - task_id: "S3.T4"
        description: "Ambiguous intent test suite"
        file: "tests/integration/lens/test_ambiguous_intents.py"
        acceptance_criteria:
          - "'Fix bug and optimize performance' → [FIX:0.85, REFACTOR:0.65]"
          - "'Add feature with tests' → [IMPLEMENT:0.90, TEST:0.70]"
          - "'Investigate slow query' → [UNDERSTAND:0.80, REFACTOR:0.55]"
          - "Accuracy ≥90% on 100 ambiguous test cases"
    
    validation:
      - "pytest tests/unit/brain/lens/test_semantic_classifier.py -v"
      - "pytest tests/integration/lens/test_ambiguous_intents.py -v"
      - "Benchmark: Intent accuracy on validation set ≥95%"

  # ========================================================================
  # STAGE 4: DYNAMIC CONFIDENCE SCORING
  # ========================================================================

  - stage_id: "S4"
    stage_name: "Dynamic Confidence Scoring with History"
    duration_days: 2
    priority: "P1"
    
    description: |
      Replace naive averaging with weighted confidence scoring that incorporates
      examination quality, historical success rates, and uncertainty quantification.
    
    tasks:
      - task_id: "S4.T1"
        description: "Create confidence scoring engine"
        file: "cortex/brain/lens/confidence_engine.py"
        tests: "tests/unit/brain/lens/test_confidence_engine.py"
        acceptance_criteria:
          - "calculate_confidence(language, examination, history)"
          - "Weights: 40% language, 30% examination, 30% history"
          - "Examination quality = features_found / expected_features"
          - "Historical success from execution tracking"
          - "Return confidence + uncertainty bounds"
      
      - task_id: "S4.T2"
        description: "Execution history tracker"
        file: "cortex/brain/lens/execution_history.py"
        tests: "tests/unit/brain/lens/test_execution_history.py"
        acceptance_criteria:
          - "Track (intent, context_signature) → success_rate"
          - "Store last 1000 executions (LRU eviction)"
          - "Persist to SQLite for cross-session learning"
          - "Query by intent+context in <5ms"
      
      - task_id: "S4.T3"
        description: "Integrate confidence engine into SynthesisPhase"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_pipeline_s4.py"
        acceptance_criteria:
          - "SynthesisPhase uses confidence_engine.calculate_confidence()"
          - "Include uncertainty bounds in metadata"
          - "Log confidence components for debugging"
          - "Maintain backwards compatible final_confidence field"
      
      - task_id: "S4.T4"
        description: "Confidence calibration validation"
        file: "tests/integration/lens/test_confidence_calibration.py"
        acceptance_criteria:
          - "High confidence (≥0.9) → success rate ≥85%"
          - "Medium confidence (0.7-0.9) → success rate ≥70%"
          - "Low confidence (<0.7) → success rate ≥50%"
          - "Calibration error ≤10% across 100 test cases"
    
    validation:
      - "pytest tests/unit/brain/lens/test_confidence_engine.py -v"
      - "pytest tests/integration/lens/test_confidence_calibration.py -v"
      - "Verify confidence correlates with actual success"

  # ========================================================================
  # STAGE 5: MULTI-ORCHESTRATOR ADAPTIVE ROUTING
  # ========================================================================

  - stage_id: "S5"
    stage_name: "Multi-Orchestrator Adaptive Routing"
    duration_days: 3
    priority: "P1"
    
    description: |
      Replace static 1:1 intent→orchestrator mapping with adaptive routing that
      can compose multi-orchestrator workflows based on confidence, complexity,
      and context. Enable conditional routing (e.g., security checks only for
      high-risk operations).
    
    tasks:
      - task_id: "S5.T1"
        description: "Create orchestrator workflow builder"
        file: "cortex/brain/lens/workflow_builder.py"
        tests: "tests/unit/brain/lens/test_workflow_builder.py"
        acceptance_criteria:
          - "build_workflow(intent, confidence, examination)"
          - "Returns List[OrchestratorStep] (pipeline)"
          - "Conditional routing: if complexity > 0.7 → add analyzer"
          - "Multi-stage: TDD → Implementation → Security → Deployment"
          - "Fallback chains: primary fails → fallback orchestrator"
      
      - task_id: "S5.T2"
        description: "Routing rules engine"
        file: "cortex/brain/lens/routing_rules.py"
        tests: "tests/unit/brain/lens/test_routing_rules.py"
        acceptance_criteria:
          - "Rule: test_coverage < 50% → add tdd_orchestrator"
          - "Rule: 'security' in features → add security_checkpoint"
          - "Rule: confidence < 0.6 → add analysis_orchestrator first"
          - "Rule: complexity > 0.8 → add refactoring_orchestrator"
          - "Extensible (YAML-based rule definitions)"
      
      - task_id: "S5.T3"
        description: "Upgrade SynthesisPhase to multi-orchestrator routing"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_pipeline_s5.py"
        acceptance_criteria:
          - "routing_decision becomes List[str] (orchestrator pipeline)"
          - "Backwards compatible: single orchestrator if no multi-routing needed"
          - "Include routing reasoning (why each orchestrator selected)"
          - "Performance: <5ms for workflow composition"
      
      - task_id: "S5.T4"
        description: "Integration test: Complex workflow scenarios"
        file: "tests/integration/lens/test_multi_orchestrator_routing.py"
        acceptance_criteria:
          - "High complexity + low coverage → [Analyzer, TDD, Refactor, Primary]"
          - "Security feature + low confidence → [Security, Analysis, Primary]"
          - "Simple intent + high confidence → [Primary only]"
          - "Test 20 routing scenarios with expected workflows"
    
    validation:
      - "pytest tests/unit/brain/lens/test_workflow_builder.py -v"
      - "pytest tests/integration/lens/test_multi_orchestrator_routing.py -v"
      - "Verify routing accuracy ≥95% on validation set"

  # ========================================================================
  # STAGE 6: PERFORMANCE OPTIMIZATION & CACHING
  # ========================================================================

  - stage_id: "S6"
    stage_name: "Performance Optimization & Intelligent Caching"
    duration_days: 2
    priority: "P2"
    
    description: |
      Optimize LENS pipeline for production latency targets (<50ms P95) with
      intelligent caching, lazy loading, and parallel phase execution where possible.
    
    tasks:
      - task_id: "S6.T1"
        description: "Multi-level caching strategy"
        file: "cortex/brain/lens/cache_manager.py"
        tests: "tests/unit/brain/lens/test_cache_manager.py"
        acceptance_criteria:
          - "L1: In-memory LRU (1000 entries, <1ms lookup)"
          - "L2: SQLite persistent cache (10000 entries, <5ms)"
          - "L3: Knowledge YAML cache (preload at startup)"
          - "Cache invalidation on file changes (watch repo)"
          - "Cache hit rate target: ≥70% after warmup"
      
      - task_id: "S6.T2"
        description: "Lazy orchestrator adapter initialization"
        file: "cortex/brain/lens/orchestrator_adapter.py"
        tests: "tests/unit/brain/lens/test_lazy_initialization.py"
        acceptance_criteria:
          - "Initialize LENSOrchestrator only when needed"
          - "Reuse instance across multiple pipeline executions"
          - "Graceful degradation if initialization fails"
          - "Reduces cold-start latency by 50%"
      
      - task_id: "S6.T3"
        description: "Parallel phase execution where independent"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/unit/brain/lens/test_parallel_execution.py"
        acceptance_criteria:
          - "Phases 1+4 can run in parallel (Language + Knowledge warmup)"
          - "Use asyncio for non-blocking I/O"
          - "Fallback to sequential if parallelization fails"
          - "Latency improvement: 20-30% for cold cache"
      
      - task_id: "S6.T4"
        description: "Performance regression test suite"
        file: "tests/performance/lens/test_pipeline_performance.py"
        acceptance_criteria:
          - "P50 latency <20ms (warm cache)"
          - "P95 latency <50ms (cold cache)"
          - "P99 latency <100ms"
          - "Cache hit rate ≥70% after 100 requests"
          - "Memory usage <100MB for 1000 cached entries"
    
    validation:
      - "pytest tests/performance/lens/test_pipeline_performance.py -v"
      - "Run profiler: python -m cProfile cortex/brain/lens/pipeline.py"
      - "Verify latency targets met"

  # ========================================================================
  # STAGE 8: INTELLIGENCE LAYER INTEGRATION (NEW v2.0)
  # ========================================================================

  - stage_id: "S8"
    stage_name: "Intelligence Layer Integration"
    duration_days: 4
    priority: "P1"
    
    description: |
      Integrate IntelligenceOrchestrator between Phase 2 and Phase 3 to provide
      layered knowledge synthesis, staleness detection, and rich orchestrator
      instructions. Implements Company → Domain → CORTEX layered knowledge loading
      with automatic gap filling and tech stack awareness.
      
      NEW CAPABILITIES:
      - Layered knowledge loading (company best practices → domain rules → CORTEX base)
      - Automatic gap detection and filling across knowledge layers
      - Tech stack detection from AST imports
      - Staleness detection and auto-refresh triggers
      - Rich instruction synthesis for downstream orchestrators
      - Lightweight YAML summary layer for performance optimization
    
    tasks:
      - task_id: "S8.T1"
        description: "Create IntelligenceOrchestrator with 4-stage pipeline"
        file: "cortex/brain/lens/intelligence_orchestrator.py"
        tests: "tests/unit/brain/lens/test_intelligence_orchestrator.py"
        acceptance_criteria:
          - "4-stage pipeline: Context Analysis → Knowledge Loading → Staleness Check → Instruction Synthesis"
          - "Returns IntelligenceContext with enriched instructions"
          - "Tech stack detection from AST imports"
          - "Layered knowledge loading (company → domain → cortex)"
          - "Gap detection with automatic fallback"
          - "Test coverage: ≥95%"
      
      - task_id: "S8.T2"
        description: "Build layered knowledge loading system"
        file: "cortex/brain/lens/knowledge_layers.py"
        tests: "tests/unit/brain/lens/test_knowledge_layers.py"
        acceptance_criteria:
          - "Layer 1: Query company/domains/ for best practices"
          - "Layer 2: Query cortex/knowledge/best-practices/ for domain rules"
          - "Layer 3: Query cortex/knowledge/best-practices/ for base knowledge"
          - "Coverage calculation per layer (0.0-1.0)"
          - "Automatic gap filling when coverage <0.8"
          - "Precedence resolution (company > domain > cortex)"
      
      - task_id: "S8.T3"
        description: "Implement staleness checker with auto-refresh"
        file: "cortex/brain/lens/staleness_checker.py"
        tests: "tests/unit/brain/lens/test_staleness_checker.py"
        acceptance_criteria:
          - "Compare detected tech stack (AST) vs documented tech (YAMLs)"
          - "Flag missing frameworks/libraries"
          - "Generate refresh recommendations"
          - "Trigger async refresh (background job)"
          - "Staleness report format: {status, missing_tech, recommendation}"
      
      - task_id: "S8.T4"
        description: "Create instruction synthesizer for orchestrators"
        file: "cortex/brain/lens/instruction_synthesizer.py"
        tests: "tests/unit/brain/lens/test_instruction_synthesizer.py"
        acceptance_criteria:
          - "Merge all knowledge layers with precedence"
          - "Output format: {patterns, constraints, best_practices, security, testing, context}"
          - "Deduplicate across layers"
          - "Prioritize by source (company > domain > cortex)"
          - "Include staleness warnings if present"
      
      - task_id: "S8.T5"
        description: "Build lightweight YAML summary layer"
        file: "cortex/brain/lens/knowledge_summarizer.py"
        tests: "tests/unit/brain/lens/test_knowledge_summarizer.py"
        acceptance_criteria:
          - "Extract summaries from YAML headers (first 50 lines only)"
          - "KnowledgeSummary: id, title, domain, tags, priority, size, last_modified"
          - "Summary index built at startup (<100ms for 100 YAMLs)"
          - "Lazy expansion: load full YAML only when needed"
          - "Performance: <1ms per summary, 78% faster than full load"
      
      - task_id: "S8.T6"
        description: "Integrate IntelligenceOrchestrator into LENS Pipeline"
        file: "cortex/brain/lens/pipeline.py"
        tests: "tests/integration/lens/test_intelligence_integration.py"
        acceptance_criteria:
          - "Call IntelligenceOrchestrator between Phase 2 and Phase 3"
          - "Pass IntelligenceContext to Phase 3 (Synthesis)"
          - "Enrich SynthesisPhaseOutput with instruction_set"
          - "Pass instruction_set to Phase 4 (Knowledge)"
          - "Backwards compatible: graceful degradation if intelligence layer fails"
      
      - task_id: "S8.T7"
        description: "Tech stack detection from AST imports"
        file: "cortex/brain/lens/tech_stack_detector.py"
        tests: "tests/unit/brain/lens/test_tech_stack_detector.py"
        acceptance_criteria:
          - "Map imports to tech categories: fastapi → [fastapi, python-web, rest-api]"
          - "Support 20+ common frameworks (fastapi, flask, django, pytest, sqlalchemy, etc.)"
          - "Return List[str] of tech tags"
          - "Extensible: YAML-based tech mapping configuration"
      
      - task_id: "S8.T8"
        description: "Integration tests: Layered knowledge scenarios"
        file: "tests/integration/lens/test_intelligence_scenarios.py"
        acceptance_criteria:
          - "Scenario 1: Company knowledge complete → no domain/cortex loading"
          - "Scenario 2: Company gaps → domain fills gaps"
          - "Scenario 3: Company+domain gaps → cortex fills remaining"
          - "Scenario 4: Missing tech stack → staleness warning"
          - "Scenario 5: All layers empty → graceful degradation"
          - "All scenarios: instruction_set properly synthesized"
    
    validation:
      - "pytest tests/unit/brain/lens/test_intelligence_*.py -v"
      - "pytest tests/integration/lens/test_intelligence_*.py -v"
      - "Verify knowledge relevance ≥92% (context-aware queries)"
      - "Verify gap coverage ≥98% (layered fallback working)"
      - "Verify tech stack detection 100% for common frameworks"
      - "Verify latency impact ≤15ms (intelligence layer overhead acceptable)"
    
    acceptance_criteria:
      - id: "AC-PHASE53-011"
        description: "IntelligenceOrchestrator integrated into LENS Pipeline"
        validation: "pytest tests/integration/lens/test_intelligence_integration.py -v"
      
      - id: "AC-PHASE53-012"
        description: "Knowledge relevance ≥92% with layered loading"
        validation: "pytest tests/integration/lens/test_knowledge_relevance.py -v"
      
      - id: "AC-PHASE53-013"
        description: "Gap coverage ≥98% with automatic fallback"
        validation: "pytest tests/integration/lens/test_gap_coverage.py -v"
      
      - id: "AC-PHASE53-014"
        description: "Tech stack detection 100% for common frameworks"
        validation: "pytest tests/unit/brain/lens/test_tech_stack_detector.py -v"
      
      - id: "AC-PHASE53-015"
        description: "Staleness detection identifies missing frameworks"
        validation: "pytest tests/unit/brain/lens/test_staleness_checker.py -v"
      
      - id: "AC-PHASE53-016"
        description: "Instruction synthesis produces rich orchestrator context"
        validation: "pytest tests/integration/lens/test_instruction_synthesis.py -v"

  # ========================================================================
  # STAGE 7 (was Stage 7, now Stage 9): MANDATORY CLEANUP & MIGRATION
  # ========================================================================

  - stage_id: "S9"
    stage_name: "Mandatory Cleanup & Migration"
    duration_days: 3
    priority: "P0"
    blocking: true
    
    description: |
      MANDATORY FINAL STAGE: Remove obsolete LENS implementations, consolidate
      duplicated logic, migrate all consumers to unified LENS system, deprecate
      old APIs, and ensure zero breaking changes for existing workflows.
      
      THIS STAGE CANNOT BE SKIPPED. All previous stages build new capabilities,
      but S7 ensures production cleanliness and maintainability.
    
    tasks:
      - task_id: "S9.T1"
        description: "Deprecate obsolete LENS implementations"
        files:
          - "cortex/orchestrators/core/lens_synthesis.py"
          - "cortex/domain_brain/lens_integration.py"
        tests: "tests/unit/lens/test_deprecation_warnings.py"
        acceptance_criteria:
          - "Add @deprecated decorator with migration guide"
          - "Emit DeprecationWarning when old APIs called"
          - "Update all internal CORTEX callers to new pipeline"
          - "Document migration path in docstrings"
          - "No breaking changes (old APIs still work but warn)"
      
      - task_id: "S9.T2"
        description: "Consolidate LENS context models"
        files:
          - "cortex/brain/lens/models.py (NEW unified models)"
          - "cortex/orchestrators/core/lens_synthesis.py (migrate)"
          - "cortex/orchestrators/phase_49/context_crystallization_layer.py (migrate)"
        tests: "tests/unit/lens/test_unified_models.py"
        acceptance_criteria:
          - "Single LENSContext model (merge 3 existing variants)"
          - "Single LENSPipelineOutput (canonical format)"
          - "Backwards compatibility adapters for old models"
          - "All imports updated to use cortex.brain.lens.models"
          - "Zero breaking changes for existing code"
      
      - task_id: "S9.T3"
        description: "Migrate all LENS consumers to unified pipeline"
        files:
          - "cortex/orchestrators/core/challenge_engine.py"
          - "cortex/orchestrators/domain/enhanced_refactoring_orchestrator.py"
          - "cortex/orchestrators/support/upgrade_orchestrator.py"
          - "cortex/orchestrators/support/setup_orchestrator.py"
          - "cortex/orchestrators/support/rollback_orchestrator.py"
        tests: "tests/integration/lens/test_consumer_migration.py"
        acceptance_criteria:
          - "All 5 consumers use cortex.brain.lens.pipeline.LENSPipeline"
          - "Remove custom LENS implementations (LENSPhase classes)"
          - "Verify functionality unchanged (regression tests)"
          - "Update imports in 20+ files"
          - "All existing tests still pass (≥98%)"
      
      - task_id: "S9.T4"
        description: "Remove duplicate LENS logic"
        files:
          - "DELETE: cortex/orchestrators/support/lens_analysis_extractor.py"
          - "DELETE: cortex/orchestrators/domain/plan_pause_manager.py (LENSAnalysisResult)"
          - "CONSOLIDATE: cortex/lens/cached_lens_orchestrator.py → cortex/brain/lens/pipeline.py"
        tests: "tests/unit/lens/test_no_duplicates.py"
        acceptance_criteria:
          - "Single source of truth: cortex/brain/lens/pipeline.py"
          - "Remove 3 duplicate LENS implementations"
          - "Update 15+ files with new imports"
          - "Verify no orphaned LENS code (grep audit)"
          - "All tests still pass after deletion"
      
      - task_id: "S9.T5"
        description: "Update documentation for unified LENS system"
        files:
          - "docs/02-orchestrators/LENS-ARCHITECTURE.md (NEW)"
          - "docs/02-orchestrators/LENS-MIGRATION-GUIDE.md (NEW)"
          - "README.md (update LENS references)"
          - ".github/prompts/cortex-architect.prompt.md (update LENS section)"
        acceptance_criteria:
          - "Architecture diagram: 4-phase pipeline"
          - "Migration guide: Old API → New API mappings"
          - "Performance benchmarks: <50ms P95"
          - "Integration examples for common use cases"
          - "API reference for all public classes"
      
      - task_id: "S9.T6"
        description: "LENS system-wide audit & validation"
        file: "scripts/audit_lens_migration.py (NEW)"
        acceptance_criteria:
          - "Grep audit: No references to deprecated LENS files"
          - "Import audit: All use cortex.brain.lens.*"
          - "Test audit: Zero skipped LENS tests"
          - "Performance audit: Latency targets met (S6 validation)"
          - "Breaking change audit: Zero breaking changes detected"
          - "Generate migration report: Files changed, tests updated, performance delta"
      
      - task_id: "S9.T7"
        description: "Production readiness checklist"
        file: "docs/LENS-PRODUCTION-READINESS.md (NEW)"
        acceptance_criteria:
          - "All 6 previous stages validated (S1-S6)"
          - "Test coverage ≥90% (cortex/brain/lens/)"
          - "Performance targets met (P95 <50ms)"
          - "Zero P0/P1 issues in LENS codebase"
          - "Security scan passed (no vulnerabilities)"
          - "Documentation complete (architecture + migration + API)"
          - "Deployment plan approved"
          - "Rollback plan documented"
    
    validation:
      - "python scripts/audit_lens_migration.py --strict"
      - "pytest tests/ -k lens -v --cov=cortex/brain/lens --cov-report=html"
      - "pytest tests/integration/lens/ -v (all consumers work)"
      - "grep -r 'cortex.orchestrators.core.lens_synthesis' cortex/ (should be 0 hits)"
      - "grep -r '@deprecated' cortex/ | grep -i lens (verify deprecations marked)"
      - "Verify documentation: docs/02-orchestrators/LENS-*.md exists"
      - "Generate final report: LENS-PHASE53-COMPLETION-REPORT.md"
    
    rollback_plan: |
      If S9 validation fails:
      1. Revert S9 commits (git revert S9.T1..S9.T7)
      2. Old APIs still work (backwards compatibility maintained)
      3. New features available but old code paths intact
      4. Incremental migration: deprecate in Phase 53, remove in Phase 54
      5. No production impact (new pipeline opt-in via feature flag)

