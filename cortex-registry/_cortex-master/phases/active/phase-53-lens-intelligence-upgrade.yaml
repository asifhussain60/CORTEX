    validation: "ls docs/02-orchestrators/LENS-*.md | wc -l ≥2"

# ============================================================================
# CORE GOVERNANCE
# ============================================================================

core_rules:
  - "CORE-008: TDD - Tests BEFORE code (all 30+ test files)"
  - "CORE-011: Type hints mandatory (Python 3.9+)"
  - "CORE-012: Google-style docstrings"
  - "CORE-027: Audit trail (AC_START → AC_COMPLETE)"
  - "CORE-030: Implementation Truth (verify code not docs)"
  - "CORE-048: Holistic Validation Gate (pre-implementation review)"

# ============================================================================
# ROLLBACK & RISK MITIGATION
# ============================================================================

risk_mitigation:
  - risk: "Breaking changes for existing LENS consumers"
    mitigation: "Backwards compatibility adapters + deprecation warnings"
    severity: "HIGH"
    
  - risk: "Performance regression (latency >50ms P95)"
    mitigation: "Performance test suite gates + caching strategy"
    severity: "HIGH"
    
  - risk: "Knowledge YAML loading too slow"
    mitigation: "Preload + cache at startup, lazy load on demand"
    severity: "MEDIUM"
    
  - risk: "Semantic classification less accurate than patterns"
    mitigation: "Fallback to pattern matching if similarity <0.5"
    severity: "MEDIUM"
    
  - risk: "S7 cleanup breaks hidden dependencies"
    mitigation: "Comprehensive grep audit + integration tests + rollback plan"
    severity: "HIGH"

rollback_procedure: |
  If Phase 53 needs rollback:
  
  PARTIAL ROLLBACK (Stage-level):
  1. Identify failing stage (S1-S7)
  2. Revert commits for that stage only
  3. Previous stages remain active
  4. Fix issues, re-run stage with fixes
  
  FULL ROLLBACK (Phase-level):
  1. git revert <phase-53-commits>
  2. Old LENS implementations still work (backwards compatible)
  3. New features disabled via feature flag
  4. No production impact (opt-in migration)
  5. Re-plan Phase 53 with adjusted scope
  
  EMERGENCY ROLLBACK (Production incident):
  1. Feature flag: CORTEX_LENS_UNIFIED=false
  2. Reverts to old LENS implementations immediately
  3. Zero downtime
  4. Investigate incident post-rollback

# ============================================================================
# TESTING STRATEGY
# ============================================================================

testing_strategy:
  unit_tests:
    - "30+ test files (1 per task)"
    - "Coverage target: ≥90%"
    - "Fast: <5s total execution"
    
  integration_tests:
    - "7 integration test suites (1 per stage)"
    - "Test real CORTEX files (not mocks)"
    - "Verify cross-component integration"
    
  performance_tests:
    - "Latency benchmarks (P50/P95/P99)"
    - "Cache hit rate tracking"
    - "Memory profiling"
    
  regression_tests:
    - "All existing LENS tests must pass"
    - "Zero breaking changes detected"
    - "Backwards compatibility validation"
    
  end_to_end_tests:
    - "Full pipeline: User request → LENS → Orchestrator selection → Execution"
    - "Test 20 real-world scenarios"
    - "Validate intelligence improvements (95% accuracy targets)"

# ============================================================================
# DEPLOYMENT PLAN
# ============================================================================

deployment:
  strategy: "Phased rollout with feature flags"
  
  phases:
    - phase: "Stage 1-2 (P0 Fixes)"
      enabled_by_default: false
      feature_flag: "CORTEX_LENS_UNIFIED_EXAMINATION"
      rollout: "Internal testing only"
      
    - phase: "Stage 3-5 (Intelligence)"
      enabled_by_default: false
      feature_flag: "CORTEX_LENS_UNIFIED_FULL"
      rollout: "Beta users (opt-in)"
      
    - phase: "Stage 6 (Performance)"
      enabled_by_default: false
      feature_flag: "CORTEX_LENS_UNIFIED_OPTIMIZED"
      rollout: "50% canary deployment"
      
    - phase: "Stage 7 (Cleanup)"
      enabled_by_default: true
      feature_flag: "CORTEX_LENS_UNIFIED"
      rollout: "100% production (after validation)"
  
  validation_gates:
    - "Stage 1-2 complete → Enable for internal testing"
    - "No P0 issues for 48h → Enable for beta users"
    - "Beta feedback positive → 50% canary rollout"
    - "Canary metrics stable (7 days) → 100% production"
    - "Production metrics stable (14 days) → Deprecate old APIs"

# ============================================================================
# SUCCESS METRICS & MONITORING
# ============================================================================

monitoring:
  metrics:
    - "lens.intent.classification.accuracy (target: ≥95%)"
    - "lens.confidence.calibration.error (target: ≤10%)"
    - "lens.routing.accuracy (target: ≥95%)"
    - "lens.pipeline.latency.p95 (target: <50ms)"
    - "lens.cache.hit_rate (target: ≥70%)"
    - "lens.knowledge.retrieval.count (target: ≥3 per request)"
    - "lens.breaking_changes.detected (target: 0)"
  
  alerts:
    - condition: "lens.pipeline.latency.p95 > 100ms"
      severity: "WARNING"
      action: "Investigate performance regression"
      
    - condition: "lens.cache.hit_rate < 50%"
      severity: "WARNING"
      action: "Review caching strategy"
      
    - condition: "lens.intent.classification.accuracy < 85%"
      severity: "CRITICAL"
      action: "Fallback to pattern matching, investigate semantic classifier"
      
    - condition: "lens.breaking_changes.detected > 0"
      severity: "CRITICAL"
      action: "Rollback immediately, fix backwards compatibility"

