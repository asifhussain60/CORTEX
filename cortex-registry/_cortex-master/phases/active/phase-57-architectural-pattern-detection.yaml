# ============================================================================
# IMPLEMENTATION NOTES
# ============================================================================
implementation_notes: |
  **Architecture:**
  ```
  cortex/
    intelligence/
      patterns/
        __init__.py
        base.py                      # BasePatternDetector
        catalog.py                   # PatternCatalog registry
        
        detectors/
          creational.py              # Factory, Singleton, Builder, etc.
          structural.py              # Adapter, Facade, Proxy, Decorator, etc.
          behavioral.py              # Observer, Strategy, State, etc.
          concurrency.py             # Thread Pool, Producer-Consumer, etc.
        
        anti_patterns.py             # AntiPatternDetector
        classification.py            # ArchitectureClassifier
        confidence.py                # Confidence scoring algorithms
    
    lens/
      sources/
        architecture.py              # ArchitecturePatternSource (LENS source)
  
    mcp/
      tools/
        pattern_tools.py             # MCP tool definitions
  ```
  
  **Plugin Interface:**
  ```python
  class BasePatternDetector(ABC):
      @abstractmethod
      def detect(self, ast_node, context) -> List[PatternMatch]:
          """Detect pattern instances in AST node"""
      
      @property
      @abstractmethod
      def pattern_info(self) -> PatternInfo:
          """Return pattern metadata"""
  ```
  
  **TDD Approach:**
  1. Tests first (9 tests S1 → 12 tests S2 → 10 tests S3 → 8 tests S4 → 8 tests S5)
  2. Minimal implementation to pass tests
  3. Refactor for elegance and performance
  4. Validation gate before MCP exposure

