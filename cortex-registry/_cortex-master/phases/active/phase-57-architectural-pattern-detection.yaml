# ============================================================================
# PROBLEM STATEMENT
# ============================================================================
problem_statement: |
  **Current Limitations:**
  
  1. **No Pattern Recognition:**
     - LENS analyzes code but doesn't identify design patterns
     - No classification of architecture types (MVC, DDD, layered, etc.)
     - Missing pattern-based recommendations
  
  2. **Manual Architecture Classification:**
     - Current approach: Manual review of codebase structure
     - No automated architecture detection
     - Expensive knowledge requirement from reviewers
  
  3. **Limited Pattern Catalog:**
     - Only basic design patterns (Factory, Observer, etc.)
     - Missing enterprise patterns (CQRS, Event Sourcing, DDD)
     - No anti-pattern detection catalog
  
  4. **Scalability Challenge:**
     - Adding new patterns requires manual code updates
     - No plugin mechanism for pattern detectors
     - Hard to extend to domain-specific patterns
  
  **Impact:**
  - Manual reviews take 2-3x longer than necessary
  - Architects miss patterns invisible to code inspection
  - LENS recommendations lack pattern-aware context
  - Enterprise users can't validate custom patterns

