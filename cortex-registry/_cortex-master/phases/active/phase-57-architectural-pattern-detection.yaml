# ============================================================================
# STAGE BREAKDOWN (4 Days, 45+ Tests)
# ============================================================================
stages:
  - id: "S1"
    name: "Pattern Recognition Foundation & Design Pattern Catalog"
    duration: "1 day"
    test_target: 9
    description: |
      Establish pattern detection foundation and catalog 25+ design patterns.
      
      **Deliverables:**
      1. BasePatternDetector (abstract base class)
         - Pattern definition schema (name, signatures, confidence)
         - Detection algorithm interface
         - Matching confidence scoring
      
      2. PatternCatalog (registry of 25+ patterns)
         - CreationalPatterns: Singleton, Factory, AbstractFactory, Builder, Prototype
         - StructuralPatterns: Adapter, Bridge, Composite, Decorator, Facade, Proxy
         - BehavioralPatterns: ChainOfResponsibility, Command, Interpreter, Iterator,
           Mediator, Memento, Observer, State, Strategy, Template Method, Visitor
         - ConcurrencyPatterns: ActiveObject, Monitor, Producer-Consumer, Thread Pool
      
      3. Pattern descriptors (meta-programming approach)
         - Signature matching (call graphs, inheritance patterns)
         - Structural matching (class relationships, method patterns)
         - Behavioral matching (communication patterns, state flows)
      
      4. Tests (9):
         - T1-T3: BasePatternDetector instantiation and interface
         - T4-T6: PatternCatalog registry and lookups
         - T7-T9: Signature matching algorithms
    
    completion_criteria:
      - "✅ BasePatternDetector class with abstract methods"
      - "✅ PatternCatalog with 25+ design patterns registered"
      - "✅ Pattern descriptor schema validation"
      - "✅ 9/9 tests passing, 90%+ coverage"

  - id: "S2"
    name: "Design Pattern Detectors (15+ patterns)"
    duration: "1 day"
    test_target: 12
    description: |
      Implement specific pattern detectors for high-value design patterns.
      
      **Detectors Implemented:**
      1. CreationalPatectors:
         - SingletonDetector: Static instance + getInstance()
         - FactoryDetector: Factory class/method pattern
         - BuilderDetector: Builder with fluent API
      
      2. StructuralDetectors:
         - DecoratorDetector: Inheritance + wrapper pattern
         - FacadeDetector: Simplified interface to complex subsystem
         - ProxyDetector: Lazy loading / access control pattern
      
      3. BehavioralDetectors:
         - ObserverDetector: Subject + Observer pattern
         - StrategyDetector: Family of interchangeable algorithms
         - StateDetector: Object behavior changes based on internal state
         - TemplateMethodDetector: Algorithm skeleton in base class
      
      4. ConcurrencyDetectors:
         - ThreadPoolDetector: Thread pool implementation
         - ProducerConsumerDetector: Queue-based messaging
      
      **Tests (12):**
         - T1-T3: Creational pattern detection
         - T4-T7: Structural pattern detection
         - T8-T10: Behavioral pattern detection
         - T11-T12: Concurrency pattern detection
    
    completion_criteria:
      - "✅ 15+ pattern detector implementations"
      - "✅ Each detector with confidence scoring"
      - "✅ All tests passing (12/12)"
      - "✅ Coverage ≥ 90%"

  - id: "S3"
    name: "Architecture Classification Engine"
    duration: "1 day"
    test_target: 10
    description: |
      Classify overall architecture type based on pattern combinations.
      
      **Architecture Types:**
      1. MVC (Model-View-Controller)
         - Signatures: Models + Views + Controllers
         - Pattern indicators: Observer (model-view sync)
      
      2. MVVM (Model-View-ViewModel)
         - Signatures: Models + Views + ViewModels with bindings
         - Pattern indicators: Observer, Data binding
      
      3. DDD (Domain-Driven Design)
         - Signatures: Bounded contexts, Aggregates, Value objects, Services
         - Pattern indicators: Factory, Repository, Domain events
      
      4. LayeredArchitecture
         - Signatures: Presentation → Business → Persistence layers
         - Pattern indicators: Facade, Proxy, Data access objects
      
      5. Microservices
         - Signatures: Independent deployment units, API contracts
         - Pattern indicators: Factory, Producer-Consumer, Service locator
      
      6. EventDrivenArchitecture
         - Signatures: Event producers, consumers, brokers
         - Pattern indicators: Observer, Publisher-Subscriber
      
      7. CQRS (Command Query Responsibility Segregation)
         - Signatures: Separate command/query models
         - Pattern indicators: Strategy, Command pattern
      
      **Tests (10):**
         - T1-T2: MVC/MVVM classification
         - T3-T4: DDD classification
         - T5-T6: Layered/Microservices classification
         - T7-T8: Event-driven/CQRS classification
         - T9-T10: Confidence scoring and edge cases
    
    completion_criteria:
      - "✅ ArchitectureClassifier implementation"
      - "✅ 7+ architecture types recognized"
      - "✅ Confidence scoring for classifications"
      - "✅ 10/10 tests passing"

  - id: "S4"
    name: "Anti-Pattern Detection & Code Smell Classification"
    duration: "0.5 days"
    test_target: 8
    description: |
      Detect code smells and anti-patterns that violate CORTEX standards.
      
      **Anti-Patterns:**
      1. Structural Anti-Patterns:
         - GodClass: Class with too many responsibilities (>20 methods)
         - FeatureEnvy: Class using fields of another class excessively
         - DataClumps: Groups of variables that should be a class
         - CircularDependencies: A→B→A dependency cycles
      
      2. Behavioral Anti-Patterns:
         - DataTransferObject: Anemic models without behavior
         - ServiceLocator: Hidden dependencies via global service access
         - SwitchStatements: Complex switch/case replacing polymorphism
      
      3. Enterprise Anti-Patterns:
         - AnalysisParalysis: Over-engineering before requirements
         - GoldenHammer: Using one solution for all problems
         - LavaFlow: Dead code nobody dares to remove
      
      **Tests (8):**
         - T1-T3: Structural anti-pattern detection
         - T4-T6: Behavioral anti-pattern detection
         - T7-T8: Enterprise anti-pattern detection
    
    completion_criteria:
      - "✅ AntiPatternDetector implementation"
      - "✅ 8+ anti-patterns recognized"
      - "✅ Severity scoring (Critical/Warning/Info)"
      - "✅ 8/8 tests passing"

  - id: "S5"
    name: "LENS Integration & MCP Tools"
    duration: "1 day"
    test_target: 8
    description: |
      Integrate pattern detection with LENS and expose via MCP tools.
      
      **LENS Integration:**
      1. ArchitecturePatternSource (LENS source)
         - Detects patterns in analyzed code
         - Returns confidence scores
         - Provides refactoring recommendations
      
      2. Pattern-aware context enrichment
         - Add pattern info to LENS analysis results
         - Include architecture classification in reports
         - Recommend pattern-based refactorings
      
      **MCP Tools:**
      1. cortex_detect_patterns
         - Input: file path or AST
         - Output: {patterns: [{name, confidence, location}]}
      
      2. cortex_classify_architecture
         - Input: repository path
         - Output: {architecture_type, confidence, pattern_breakdown}
      
      3. cortex_detect_anti_patterns
         - Input: file path
         - Output: {anti_patterns: [{name, severity, location, fix}]}
      
      **Tests (8):**
         - T1-T2: ArchitecturePatternSource integration
         - T3-T4: LENS enrichment pipeline
         - T5-T6: MCP tool functionality
         - T7-T8: End-to-end pattern → recommendation
    
    completion_criteria:
      - "✅ LENS source implementation"
      - "✅ 3 MCP tools exposed"
      - "✅ MCP tool signatures documented"
      - "✅ 8/8 tests passing"

