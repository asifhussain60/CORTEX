      - Confidence scoring (0.0-1.0) on all inferences
      - Adjustable thresholds via configuration
      - Whitelist/blacklist patterns for known exceptions
    fallback: "Flag low-confidence inferences for manual review"

  - id: "RISK-66-02"
    description: "Graph storage scales poorly for large codebases"
    severity: "medium"
    probability: "low"
