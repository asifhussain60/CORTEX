# ============================================================================
# STAGE BREAKDOWN
# ============================================================================

stages:
  # --------------------------------------------------------------------------
  # STAGE 1: Architecture Lens + Dependency Analysis (2-3 weeks)
  # --------------------------------------------------------------------------
  - id: "S1"
    name: "Architecture Lens + Dependency Analysis"
    description: |
      Detect architectural patterns and layering violations through 
      import graph analysis and naming conventions.
    
    deliverables:
      - "Architecture pattern detector (MVC, Repository, Service layers)"
      - "Dependency graph builder (import relationship mapping)"
      - "Layering violation detector (upward dependency prevention)"
      - "Circular dependency detector with cycle visualization"
      - "Integration with LENS Advanced tier"
      
    acceptance_criteria:
      - "Detect 'Controller → Repository' violations (bypass Service layer)"
      - "Identify circular dependencies across modules with path display"
      - "Map component hierarchy: presentation → business → data"
      - "Generate architecture violation report with severity scoring"
      - "25+ tests covering pattern detection and violation scenarios"
      - "90%+ test coverage"
      - "Integration test: Analyze CORTEX codebase, detect known patterns"
      
    technical_approach: |
      1. Extend LENS Advanced tier with ArchitectureLens class
      2. Parse Python imports via AST → build directed graph
      3. Apply pattern matchers:
         - MVC: *Controller → *Service → *Repository
         - Layering: cortex/ → cortex_brain/ allowed, reverse blocked
      4. Detect violations: DFS for upward edges, cycle detection
      5. Output: ArchitectureReport with violations + suggestions
      
    files_to_create:
      - "cortex_lens/analyzers/architecture_lens.py"
      - "cortex_lens/models/architecture_report.py"
      - "tests/unit/cortex_lens/analyzers/test_architecture_lens.py"
      - "tests/integration/cortex_lens/test_architecture_analysis_e2e.py"
      
    tests:
      - "test_detect_mvc_pattern"
      - "test_detect_repository_pattern"
      - "test_detect_layering_violation_upward"
      - "test_detect_circular_dependency"
      - "test_component_hierarchy_mapping"
      - "test_architecture_report_generation"
      - "test_severity_scoring"
      - "test_integration_cortex_codebase_analysis"
      
    estimated_effort: "18-22 hours"
    depends_on: []

  # --------------------------------------------------------------------------
  # STAGE 2: Knowledge Graph Lite (3-4 weeks)
  # --------------------------------------------------------------------------
  - id: "S2"
    name: "Knowledge Graph Lite"
    description: |
      Store LENS analysis results as queryable graph structure in SQLite 
      for efficient relationship queries and incremental updates.
    
    deliverables:
      - "Graph schema design (nodes: File/Class/Function/Import/Test)"
      - "Edge types (calls, imports, tests, depends_on, writes_to)"
      - "SQLite storage backend with optimized indexes"
      - "Query interface for relationship traversal (Python API)"
      - "Incremental update system (file change → graph delta)"
      - "MCP tool: cortex_knowledge_graph_query"
      
    acceptance_criteria:
      - "Store full CORTEX codebase graph in <50MB SQLite DB"
      - "Query 'Which files call UserRepository.save()?' in <100ms"
      - "Support incremental updates: file change → rebuild subgraph only"
      - "2-hop queries (e.g., 'Which tests cover X through Y?') in <200ms"
      - "Graph serialization/deserialization for persistence"
      - "30+ tests covering graph operations (insert, query, update, delete)"
      - "90%+ test coverage"
      - "MCP tool integration test: Query graph via tool interface"
      
    technical_approach: |
      1. Design property graph schema:
         - Nodes: id, type, name, file_path, metadata (JSON)
         - Edges: source_id, target_id, edge_type, metadata (JSON)
      2. SQLite storage with indexes on (type, name), (edge_type, source_id)
      3. Query API: GraphQuery.traverse(start_node, edge_type, depth)
      4. Incremental updates: file hash tracking → rebuild delta only
      5. MCP tool wrapper for Copilot Chat access
      
    files_to_create:
      - "cortex_lens/knowledge_graph/graph_schema.py"
      - "cortex_lens/knowledge_graph/graph_storage.py"
      - "cortex_lens/knowledge_graph/graph_query.py"
      - "cortex_lens/knowledge_graph/graph_builder.py"
      - "cortex/mcp/tools/knowledge_graph_query_tool.py"
      - "tests/unit/cortex_lens/knowledge_graph/test_graph_storage.py"
      - "tests/unit/cortex_lens/knowledge_graph/test_graph_query.py"
      - "tests/integration/cortex_lens/test_knowledge_graph_e2e.py"
      - "tests/integration/cortex/mcp/test_knowledge_graph_query_tool.py"
      
    tests:
      - "test_graph_schema_validation"
      - "test_node_insertion"
      - "test_edge_insertion"
      - "test_query_1hop_relationships"
      - "test_query_2hop_relationships"
      - "test_query_performance_100ms"
      - "test_incremental_update_file_change"
      - "test_graph_serialization"
      - "test_mcp_tool_query_interface"
      
    estimated_effort: "24-28 hours"
    depends_on: ["S1"]

  # --------------------------------------------------------------------------
  # STAGE 3: Domain Inference Engine (4-5 weeks)
  # --------------------------------------------------------------------------
  - id: "S3"
    name: "Domain Inference Engine"
    description: |
      Automatically identify bounded contexts, business domains, state 
      machines, and business rules from code patterns and naming conventions.
    
    deliverables:
      - "Naming pattern analyzer (shared prefixes → domain clusters)"
      - "Lifecycle state detector (status enums → state machines)"
      - "Business rule extractor (validation decorators → constraints)"
      - "Domain glossary generator (entities + relationships + definitions)"
      - "Bounded context mapper with dependency visualization"
      
    acceptance_criteria:
      - "Identify 5+ domains in CORTEX codebase with 85%+ precision"
      - "Detect state transitions: Phase (planned → active → completed)"
      - "Extract business rules from validation logic (e.g., @validator)"
      - "Generate queryable domain glossary with entity relationships"
      - "Map bounded contexts with inter-context dependencies"
      - "Confidence scoring for each inference (0.0-1.0)"
      - "35+ tests with real CORTEX codebase examples"
      - "90%+ test coverage"
      - "Human validation: 85%+ precision on 50 inferred domains"
      
    technical_approach: |
      1. Naming pattern analysis:
         - Cluster classes by shared prefixes (e.g., User*, Order*)
         - Identify domain aggregates (root + children)
      2. State machine detection:
         - Parse Enum classes for status fields
         - Build transition graph from assignment patterns
      3. Business rule extraction:
         - Parse validation decorators (@validator, @field_validator)
         - Extract constraint logic from if/raise patterns
      4. Domain glossary:
         - Entity: name, domain, relationships, lifecycle
         - Verb: use cases extracted from method names
         - Rule: constraints extracted from validators
      5. Confidence scoring: weighted combination of signals
      
    files_to_create:
      - "cortex_lens/domain_inference/pattern_analyzer.py"
      - "cortex_lens/domain_inference/state_detector.py"
      - "cortex_lens/domain_inference/rule_extractor.py"
      - "cortex_lens/domain_inference/glossary_generator.py"
      - "cortex_lens/domain_inference/bounded_context_mapper.py"
      - "cortex_lens/models/domain_glossary.py"
      - "tests/unit/cortex_lens/domain_inference/test_pattern_analyzer.py"
      - "tests/unit/cortex_lens/domain_inference/test_state_detector.py"
      - "tests/unit/cortex_lens/domain_inference/test_rule_extractor.py"
      - "tests/integration/cortex_lens/test_domain_inference_e2e.py"
      
    tests:
      - "test_domain_clustering_by_prefix"
      - "test_aggregate_root_detection"
      - "test_state_machine_extraction_from_enum"
      - "test_state_transition_graph_building"
      - "test_validation_rule_extraction"
      - "test_business_constraint_detection"
      - "test_domain_glossary_generation"
      - "test_bounded_context_mapping"
      - "test_confidence_scoring"
      - "test_cortex_domain_inference_accuracy"
      
    estimated_effort: "28-32 hours"
    depends_on: ["S2"]

  # --------------------------------------------------------------------------
  # STAGE 4: Runtime Correlation (OPTIONAL - 6-8 weeks)
  # --------------------------------------------------------------------------
  - id: "S4"
    name: "Runtime Correlation (OPTIONAL)"
    description: |
      Enhance knowledge graph with execution traces from test runs to 
      identify hot paths, dead code, and actual call chains.
      
      DECISION POINT: Evaluate necessity after Stage 3 completion based 
      on user feedback and static analysis sufficiency.
    
    deliverables:
      - "pytest JSON output parser"
      - "Test coverage mapper (test → code paths)"
      - "Hot path identifier (frequently executed code)"
      - "Dead code detector (untested + uncalled)"
      - "Integration test flow analyzer"
      
    acceptance_criteria:
      - "Parse pytest --json output into graph edges"
      - "Map test_user_creation → UserRepository.save() call chain"
      - "Identify top 10 hot paths in CORTEX codebase"
      - "Flag dead code candidates (0 test coverage + 0 runtime calls)"
      - "Integration test flow visualization with coverage overlay"
      - "20+ tests covering trace parsing and analysis"
      - "90%+ test coverage"
      
    technical_approach: |
      1. pytest JSON parser:
         - Extract test → file → function execution paths
         - Build runtime call graph from coverage data
      2. Test coverage mapper:
         - Correlate pytest-cov output with knowledge graph
         - Add 'covered_by_test' edges
      3. Hot path analysis:
         - Frequency counting from test execution counts
         - Weight by execution time from pytest duration
      4. Dead code detection:
         - Cross-reference: no test coverage + no import edges = dead
      
    files_to_create:
      - "cortex_lens/runtime_correlation/pytest_parser.py"
      - "cortex_lens/runtime_correlation/coverage_mapper.py"
      - "cortex_lens/runtime_correlation/hot_path_analyzer.py"
      - "cortex_lens/runtime_correlation/dead_code_detector.py"
      - "tests/unit/cortex_lens/runtime_correlation/test_pytest_parser.py"
      - "tests/integration/cortex_lens/test_runtime_correlation_e2e.py"
      
    tests:
      - "test_pytest_json_parsing"
      - "test_coverage_data_integration"
      - "test_hot_path_identification"
      - "test_dead_code_detection"
      - "test_integration_flow_analysis"
      
    estimated_effort: "32-40 hours"
    depends_on: ["S3"]
    deferred: true
    defer_reason: "Evaluate necessity after Stage 3 based on static analysis sufficiency"

