overview:
  vision: |
    Transform CORTEX LENS from syntax analyzer to domain-aware intelligence 
    engine through incremental knowledge graph construction and pattern-based 
    domain inference. Enable CORTEX to understand codebases as architects do: 
    layers, boundaries, domains, relationships, and business rules.
    
    Strategic alignment with Phase 64 (Intelligent Tier Selection) and 
    addresses reverse-engineering intelligence gaps identified in chat01.md 
    digest analysis.

  problem_statement: |
    Current LENS provides syntax-level analysis (AST, complexity, security) 
    but lacks architectural and domain awareness:
    
    1. Cannot detect layering violations (Controller bypassing Service)
    2. Cannot answer "Which files write to User table?" (relationship queries)
    3. Cannot identify bounded contexts or business domains automatically
    4. Cannot infer state machines from status enums
    5. Cannot extract business rules from validation logic
    6. Token-inefficient: Full codebase scans = 50-150K tokens per query
    
    Intelligence gap: CORTEX analyzes trees but doesn't see the forest.
    
    Digest insight: Real codebases need "three-lens triangulation" - 
    static structure + runtime truth + data model. Phase 66 focuses on 
    static structure patterns (foundational) with optional runtime correlation.

  expected_outcomes:
    - "Architecture pattern detection (MVC, Repository, Service layers)"
    - "Dependency graph with circular dependency detection"
    - "Layering violation detection (upward dependencies blocked)"
    - "Queryable knowledge graph (SQLite storage, <100ms queries)"
    - "Relationship queries: 'Which files call UserRepository.save()?'"
    - "Domain inference from naming patterns and clustering"
    - "Lifecycle state detection from enums → state machines"
    - "Business rule extraction from validation decorators"
    - "Domain glossary generation (entities + relationships)"
    - "Token efficiency: 80-90% reduction vs. full codebase scans"
    - "Optional: Runtime correlation from pytest traces (Stage 4)"

roi_analysis:
  cost: "70-82 hours (Stage 1-3) + optional 32-40 hours (Stage 4)"
  impact: |
    Immediate (Stage 1-2):
    - Architectural violation prevention (tech debt reduction)
    - Cross-file relationship queries (5-10K vs. 50-150K tokens)
    - Dependency analysis for refactoring safety
    
    Medium-term (Stage 3):
    - Domain-driven documentation generation
    - Bounded context discovery (modularity insights)
    - Business rule catalog (audit + compliance)
    
    Long-term (Stage 4 - optional):
    - Test coverage gap identification
    - Performance hot path optimization
    - Dead code elimination
    
    Token efficiency: 80-90% reduction in context loading for queries.
    
  risk_mitigation: |
    - Incremental delivery: Value every 2-3 weeks vs. 6-9 months all-or-nothing
    - Builds on existing LENS foundation (Phase 64) — no new subsystem
    - Language-agnostic patterns work across Python/TS/Go stacks
    - Stage 4 deferred: Evaluate need after Stage 3 completion
    - Fallback: If graph queries insufficient, can upgrade to full Roslyn pipeline
    - Each stage independently testable and deployable

