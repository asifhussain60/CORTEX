    Establish repository onboarding as the MANDATORY first step when 
    interacting with any external repository. NO stubs or fake implementations.
    Test with KSESSIONS repository, maintain loose coupling for deletion safety.
    
    **Core Principles:**
    1. MUST be first interaction (enforced via MCP gateway)
    2. Real implementations only (NO placeholders)
    3. Loosely coupled (external repo can be deleted safely)
    4. Read-only operation (NO writes to external repo)
    5. Profile stored in CORTEX (single source of truth)

  critical_requirement: |
    From user Q1: "onboarding MUST BE the first step when interacting with repo. 
    Ensure this is completed first. Do not create stubs or fake implementations. 
    Use the KSESSIONS repo folder at the same location as this CORTEX repo to 
    onboard it and use it as a test case. Keep it loosely coupled so KSESSIONS 
    can be deleted."

