---
# ============================================================================
# SOLUTION DESIGN
# ============================================================================

solution_overview: |
  Enhance RepositoryOnboardingOrchestrator to be a mandatory first step,
  with profile persistence in CORTEX and loose coupling for deletion safety.
  Test with KSESSIONS repository (/Users/asifhussain/PROJECTS/KSESSIONS).

architecture:
  approach: "Loose-Coupled Repository Profiling"
  
  components:
    - name: "RepositoryOnboardingOrchestrator (Enhanced)"
      responsibility: "Scan, analyze, profile external repositories"
      location: "cortex/orchestrators/support/repository_onboarding_orchestrator.py"
      enhancements:
        - "Profile generation and persistence"
        - "Company domain structure detection"
        - "Tech stack auto-discovery"
        - "Security baseline assessment"
        - "Standards extraction"
    
    - name: "Repository Profile Store"
      responsibility: "Persist and retrieve repository profiles"
      location: "cortex_brain/onboarded_repos/"
      structure: |
        cortex_brain/onboarded_repos/
          ksessions.yaml         # Profile for KSESSIONS
          [repo-name].yaml       # Other repository profiles
      
    - name: "MCP Onboarding Gateway"
      responsibility: "Enforce onboarding-first policy"
      location: "cortex/mcp/server.py"
      behavior: |
        - Check if external repo is onboarded
        - If not, auto-trigger onboarding
        - Block operations until profile exists
    
    - name: "Loose Coupling Manager"
      responsibility: "Handle deleted repository scenarios"
      location: "cortex/common/repo_reference.py"
      behavior: |
        - Reference by path, not hard link
        - Validate existence before operations
        - Graceful degradation if missing
        - Log deletion events

  data_flow: |
    External Repo → RepositoryOnboardingOrchestrator
                 ↓
    Scan: structure, tech stack, standards, security
                 ↓
    Generate Profile (YAML)
                 ↓
    Store in cortex_brain/onboarded_repos/
                 ↓
    Operations use profile (NOT direct repo access)
                 ↓
    If repo deleted → Operations use cached profile + graceful degradation

profile_schema:
  example: |
    # cortex_brain/onboarded_repos/ksessions.yaml
    repository:
      name: "KSESSIONS"
      path: "/Users/asifhussain/PROJECTS/KSESSIONS"
      onboarded_at: "2026-02-06T10:30:00Z"
      last_validated: "2026-02-06T10:30:00Z"
      exists: true  # Updated on each validation
    
    tech_stack:
      primary_language: "Python"
      languages: ["Python", "YAML", "Markdown"]
      frameworks: ["FastAPI", "Pydantic"]
      dependencies:
        - "pyyaml>=6.0"
        - "pydantic>=2.0"
      
    structure:
      has_company_domains: true
      company_domains_path: "company/domains/"
      domains_detected:
        - "security/"
        - "testing/"
        - "api-standards/"
      
      has_tests: true
      test_framework: "pytest"
      test_coverage: "85%"
      
      has_docs: true
      doc_format: "markdown"
    
    standards:
      coding_style: "black + mypy + pylint"
      security_baseline: "OWASP Top 10 compliant"
      test_patterns: "TDD with pytest"
      api_patterns: "RESTful + OpenAPI 3.0"
    
    security:
      secrets_management: "environment variables"
      auth_pattern: "JWT + OAuth2"
      vulnerabilities_detected: 0
      last_scan: "2026-02-06T10:30:00Z"
    
    loose_coupling:
      referenced_by_cortex: true
      deletion_safe: true
      fallback_strategy: "use_cached_profile"

