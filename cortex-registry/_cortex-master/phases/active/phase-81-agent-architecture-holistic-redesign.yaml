summary: |
  Comprehensive agent architecture redesign implementing capability-based
  clustering for optimal extensibility, scalability, and efficiency. Closes
  2 critical gaps (META-AUDIT, PLAN sync) and establishes systematic agent
  collaboration protocol. Includes complete legacy cleanup, wiring migration,
  and machine-readable agent metadata system.

problem_statement: |
  CURRENT STATE ANALYSIS (from chat01.md digest):
  
  1. Mode-Agent Mapping Issues:
     - Implicit mapping causing discovery friction
     - 2 critical gaps: META-AUDIT mode and PLAN synchronization
     - No systematic agent collaboration protocol
     - Agent specs lack machine-readable metadata
  
  2. Architecture Inefficiencies:
     - 1-to-1 mode-agent mapping creates proliferation (10+ agents)
     - Redundant capabilities across agents (LENS analysis duplication)
     - Token overhead from loading multiple agent specs
     - Integration complexity from orchestrating 10+ separate agents
  
  3. Governance Gaps:
     - META-AUDIT: No recursive validation of auditors/validators
     - PLAN: No plan-reality synchronization or wave organization
     - Enforcement gaps slip through when validators have issues
     - Plan drifts from reality without systematic correction
  
  4. Technical Debt:
     - Legacy agent specs without standardized metadata
     - Inconsistent agent discovery mechanisms
     - No clear collaboration handoff patterns
     - Scattered wiring definitions

expected_outcomes:
  - "✅ All 8 modes have explicit agent coverage (100%)"
  - "✅ Agent collaboration protocol defined with request flow patterns"
  - "✅ Machine-readable agent metadata (YAML front-matter in all specs)"
  - "✅ IntentRouter capability-based routing (vs trigger-word routing)"
  - "✅ 2 new agents: cortex-meta-auditor, cortex-master-plan-auditor"
  - "✅ Mode → Agent → MCP Tool mapping matrix documented"
  - "✅ 60% token savings via agent reuse vs duplication"
  - "✅ Legacy test/data/file cleanup complete"
  - "✅ Wiring consolidated and migrated to specifications/"

success_metrics:
  extensibility:
    - "New mode addition: 4 days → 1 day (agent reuse)"
    - "Multi-repo support: N agent sets → 1 agent set"
    - "Token overhead per mode: 8K → 3K (60% reduction)"
  scalability:
    - "Concurrent audits: Stateless agent design"
    - "Plan size growth: Linear scaling (vs exponential)"
    - "Agent coordination: <150ms overhead"
  accuracy:
