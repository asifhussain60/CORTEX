        content: |
          # Mode-Agent-MCP Tool Mapping Matrix
          
          ## Overview
          CORTEX uses capability-based agent clustering where agents serve
          multiple modes based on shared capabilities.
          
          ## Mapping Table
          
          | Mode | Primary Agent | Secondary Agent | MCP Tools | Capabilities |
          |------|---------------|-----------------|-----------|--------------|
          | PRE-FLIGHT | cortex-environment-setup | - | cortex_validate_environment | env_validation |
          | AUDIT | cortex-auditor | cortex-meta-auditor | cortex_audit, cortex_meta_audit | code_analysis, governance_check |
          | META-AUDIT | cortex-meta-auditor | cortex-holistic-validator | cortex_meta_audit, cortex_validate_governance_health | recursive_validation |
          | DIGEST | cortex-digest | - | cortex_digest_session | session_learning |
          | QUERY | cortex-ask-coordinator | - | cortex_total_recall | knowledge_retrieval |
          | PLAN | cortex-phase-resolver | cortex-master-plan-auditor | cortex_plan_resolve, cortex_audit_plan, cortex_sync_plan_status | phase_management, plan_sync |
          | DESIGN | cortex-designer | cortex-holistic-validator | cortex_challenge | challenge_generation |
          | INTERACTIVE | cortex-interactive | - | cortex_process_request | user_refinement |
          
          ## Capability Clusters
          
          ### Analysis & Intelligence
          - cortex-auditor (codebase health)
          - cortex-meta-auditor (governance health)
          - cortex-ask-coordinator (knowledge)
          
          ### Planning & Execution
          - cortex-phase-resolver (phase ops)
          - cortex-master-plan-auditor (plan sync)
          
          ### Design & Learning
          - cortex-designer (challenges)
          - cortex-digest (learning)
          - cortex-interactive (refinement)
          
          ### Environment & Validation
          - cortex-environment-setup (pre-flight)
          - cortex-holistic-validator (validation)
          
          ### Communication
          - cortex-storyteller (formatting)
          
          ## Agent Collaboration Patterns
          
          ### Pattern 1: Resolver → Auditor → Executor
          User: "/plan sync" → cortex-phase-resolver identifies phases →
          cortex-master-plan-auditor organizes waves → Executor runs autonomous
          
          ### Pattern 2: Designer → Validator → Executor
          User: "/implement feature" → cortex-designer generates challenge →
          cortex-holistic-validator checks → TDDOrchestrator executes
          
          ### Pattern 3: Auditor → Meta-Auditor → Remediator
          User: "/audit" → cortex-auditor finds issues →
          cortex-meta-auditor validates audit process → Remediation plan generated
        acceptance_criteria:
