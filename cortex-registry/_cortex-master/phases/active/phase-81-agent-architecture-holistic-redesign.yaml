  - "Old trigger-word routing available as fallback"
  - "Wiring files in old locations supported (deprecated warnings)"
  - "MCP tools: Existing tools unchanged, new tools additive"

# ============================================================================
# ROLLOUT PLAN
# ============================================================================
rollout_strategy:
  phase_1_testing:
    duration: "2 days"
    scope: "Local testing on development branch"
    validation:
      - "All 65+ tests pass"
      - "Performance benchmarks met"
      - "No regression in existing functionality"
  
  phase_2_staging:
    duration: "1 day"
    scope: "Deploy to staging environment"
    validation:
      - "Integration tests with real MCP server"
      - "Multi-agent workflows functional"
      - "Dashboard updates working"
  
  phase_3_production:
    duration: "0.5 days"
    scope: "Gradual rollout to production"
    strategy: "Canary deployment (10% → 50% → 100%)"
    rollback_trigger: "Error rate >5% or user complaints"

monitoring:
  metrics:
    - "agent_routing_accuracy (target: >95%)"
    - "agent_handoff_latency_ms (target: <150ms)"
    - "lens_cache_hit_rate (target: >70%)"
    - "token_overhead_per_request (target: <8K)"
    - "meta_audit_governance_score (target: >85)"
  
  alerts:
    - "Agent routing failures >5%"
    - "Handoff latency >300ms"
    - "Cache hit rate <50%"
    - "Governance health score <70"

# ============================================================================
# RISK ASSESSMENT
# ============================================================================
risks:
  - risk: "Agent routing algorithm incorrect"
    severity: "P1"
    likelihood: "Low"
    mitigation: "Extensive unit tests + fallback to trigger-word routing"
    rollback: "Revert IntentRouter to previous version"
  
  - risk: "Performance regression from metadata parsing"
    severity: "P2"
    likelihood: "Medium"
    mitigation: "Metadata caching + lazy loading"
    rollback: "Disable metadata parsing, use hardcoded mappings"
  
  - risk: "Legacy cleanup breaks existing functionality"
    severity: "P1"
    likelihood: "Low"
    mitigation: "Comprehensive import validation + archive before delete"
    rollback: "Restore from _workspaces/__bak-phase81/"
  
  - risk: "Multi-agent collaboration overhead excessive"
    severity: "P2"
    likelihood: "Low"
    mitigation: "Token budget tracking + early termination if overhead >30%"
    rollback: "Disable collaboration, use single-agent routing"

