          - "User: '/implement feature' → Designer → Validator → Executor flow"
          - "User: 'proceed' with continuation → Resumes from checkpoint"
        acceptance_criteria:
          - "✅ All UAT scenarios pass"
          - "✅ User experience: Clear progress feedback"
          - "✅ Error messages: Actionable guidance"
    
    tests:
      - "test_agent_architecture_integration.py (25 tests)"
      - "test_agent_architecture_performance.py (8 benchmarks)"
      - "test_agent_architecture_governance.py (12 tests)"
      - "test_agent_architecture_uat.py (10 scenarios)"
    
    test_coverage_target: 88%

  - id: S8
    name: "Legacy Cleanup & Migration"
    duration: "1 day"
    estimated_tokens: "5000"
    description: |
      Comprehensive cleanup of legacy tests, data files, deprecated agents,
      and scattered wiring definitions. Consolidate to specifications/ and
      archive obsolete components.
    
    tasks:
      - task: "Identify legacy components"
        script: "scripts/identify_legacy_components.py"
        scan_targets:
          - "tests/ - Identify deprecated test files"
          - "cortex/wiring/ - Find scattered wiring definitions"
          - ".github/agents/ - Detect agents without metadata"
          - "docs/ - Find outdated documentation"
          - "cortex/ - Locate orphaned utility files"
        output: "docs/cleanup/LEGACY-COMPONENTS-INVENTORY.md"
        acceptance_criteria:
          - "✅ Complete inventory of legacy components"
          - "✅ Risk assessment for each component (safe to remove?)"
          - "✅ Migration plan for components to keep"
      
      - task: "Clean up legacy test files"
        targets:
          - "tests/test_old_orchestrator_*.py → Archive to _workspaces/__bak-tests/"
          - "tests/integration/test_deprecated_*.py → Delete (no longer valid)"
          - "tests/conftest_old.py → Delete (superseded by conftest.py)"
          - "tests/fixtures/legacy_*.yaml → Archive"
        acceptance_criteria:
          - "✅ tests/ contains only active tests"
          - "✅ All remaining tests pass (pytest tests/)"
          - "✅ Coverage maintained or improved"
      
      - task: "Consolidate wiring definitions"
        source: "cortex/wiring/ (scattered YAML/JSON files)"
        target: "cortex/wiring/specifications/"
        actions:
          - "Merge duplicate orchestrator definitions"
          - "Migrate JSON → YAML (consistent format)"
          - "Remove deprecated orchestrator references"
          - "Validate against __wiring_contract__.yaml"
        acceptance_criteria:
          - "✅ All wiring in specifications/ directory"
          - "✅ No duplicate definitions"
          - "✅ Wiring contract validation passes"
      
      - task: "Archive deprecated agents"
        targets:
          - ".github/agents/deprecated/ → Move old agent specs"
          - "Update AGENT-INDEX.md to remove deprecated entries"
        acceptance_criteria:
          - "✅ Only active agents in .github/agents/core|education|support"
          - "✅ Deprecated agents archived with timestamp"
          - "✅ AGENT-INDEX.md accurate"
      
      - task: "Clean up orphaned data files"
        targets:
          - "cortex_brain/state/old_*.json → Archive"
          - "cortex_brain/onboarded_repos/deprecated_*.yaml → Delete"
          - "docs/abandoned_*.md → Archive"
        acceptance_criteria:
          - "✅ Only active data files remain"
          - "✅ Archived files timestamped + indexed"
          - "✅ No broken references to removed files"
      
      - task: "Update import statements"
        script: "scripts/update_imports_after_cleanup.py"
        actions:
          - "Remove imports of deleted modules"
          - "Update wiring imports to new specifications/ path"
          - "Fix broken agent spec references"
        acceptance_criteria:
          - "✅ No import errors (python -m cortex.cli)"
          - "✅ All orchestrators load correctly"
          - "✅ MCP server starts without errors"
      
      - task: "Migration documentation"
        file: "docs/migration/PHASE-81-MIGRATION-GUIDE.md"
        content: |
          # Phase 81 Migration Guide
          
          ## Breaking Changes
          - Agent metadata required for new agents
          - Wiring definitions moved to specifications/
          - Deprecated agents removed
          
          ## Migration Steps
          1. Update agent references in custom code
          2. Use capability-based routing in IntentRouter
          3. Migrate wiring to specifications/ directory
          4. Update tests to use new agent metadata
          
          ## Rollback Plan
          - Archive available in _workspaces/__bak-phase81/
          - Restore command: scripts/rollback_phase81.sh
        acceptance_criteria:
          - "✅ Migration guide covers all breaking changes"
          - "✅ Rollback tested and working"
          - "✅ User impact documented"
    
    tests:
      - "test_legacy_cleanup_completeness.py (10 tests)"
      - "test_wiring_consolidation.py (8 tests)"
      - "test_import_integrity.py (12 tests)"
    
    test_coverage_target: 90%
    
    rollback_plan:
      archive_location: "_workspaces/__bak-phase81/"
      archive_date: "2026-02-11"
      restore_script: "scripts/rollback_phase81.sh"

