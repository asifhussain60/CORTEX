  - id: S5
    name: "Agent Collaboration Protocol Implementation"
    duration: "1.5 days"
    estimated_tokens: "7000"
    description: |
      Define and implement agent collaboration protocol with request handoff
      patterns, shared context passing, and Phase 49 CCL integration.
    
    tasks:
      - task: "Define collaboration protocol specification"
        file: "cortex/agents/collaboration_protocol.yaml"
        content: |
          # Agent Collaboration Protocol Specification
          version: 1.0
          
          handoff_patterns:
            - name: "resolver_to_auditor"
              trigger: "phase resolution complete"
              source_agent: "cortex-phase-resolver"
              target_agent: "cortex-master-plan-auditor"
              shared_context:
                - phase_id
                - phase_yaml_path
                - estimated_tokens
                - dependencies
              continuation_checkpoint: false
            
            - name: "auditor_to_executor"
              trigger: "wave plan generated"
              source_agent: "cortex-master-plan-auditor"
              target_agent: "TDDOrchestrator"
              shared_context:
                - wave_plan
                - token_budget
                - continuation_protocol
                - lens_cache_keys
              continuation_checkpoint: true
              checkpoint_threshold: 0.75  # 75% token budget
            
            - name: "designer_to_validator"
              trigger: "challenge generated"
              source_agent: "cortex-designer"
              target_agent: "cortex-holistic-validator"
              shared_context:
                - challenge_alternatives
                - user_intent
                - risk_score
              continuation_checkpoint: false
          
          shared_context_schema:
            lens_analysis:
              type: object
              fields:
                - file_path
                - ast_hash
                - git_hash
                - dependencies
                - complexity_score
              cache_key_pattern: "lens:{file_path}:{git_hash}"
            
            phase_metadata:
              type: object
              fields:
                - phase_id
                - status
                - stages
                - tests
                - token_estimate
              cache_key_pattern: "phase:{phase_id}:{status}"
          
          token_budget_tracking:
            checkpoint_thresholds:
              - 0.50  # Warning
              - 0.75  # Checkpoint + continuation
              - 0.90  # Force stop
            continuation_prompt_template: |
              Phase {phase_id} Checkpoint at {progress}%
              
              Completed: {completed_stages}
              Remaining: {remaining_stages}
              Token Budget: {used_tokens}/{total_tokens}
              
              Next Session Command: /plan continue {phase_id}
        acceptance_criteria:
          - "✅ All handoff patterns documented"
          - "✅ Shared context schema validated"
          - "✅ Token budget checkpoints defined"
      
      - task: "Implement collaboration context manager"
        file: "cortex/agents/collaboration_context.py"
        requirements:
          - "Shared context storage (in-memory + Redis optional)"
          - "LENS cache integration (Phase 49 CCL)"
          - "Token budget tracking across handoffs"
          - "Continuation protocol generation"
        acceptance_criteria:
          - "✅ Context shared without duplicate LENS analysis (60% reduction)"
          - "✅ Token budget enforced at checkpoints"
          - "✅ Continuation prompts auto-generated"
      
      - task: "Integrate Phase 49 CCL with collaboration"
        file: "cortex/orchestrators/context_crystallization.py"
        requirements:
          - "Pre-warm LENS analysis for incoming agent handoffs"
          - "Cache shared context across agent boundaries"
          - "Async prefetch for anticipated handoffs"
        acceptance_criteria:
          - "✅ 70% cache hit rate for LENS analysis"
          - "✅ Handoff latency reduced by 40%"
          - "✅ No duplicate analysis in multi-agent workflows"
    
    tests:
      - "test_collaboration_context_manager.py (15 tests)"
      - "test_handoff_patterns.py (12 tests)"
      - "test_ccl_agent_integration.py (10 tests)"
    
    test_coverage_target: 90%
    
