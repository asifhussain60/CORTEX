  - id: "AC-GLASS-001"
    description: "Dashboard generator uses approved glassmorphism template"
    verification: "Generated dashboards have dark glass backgrounds with backdrop-filter blur"
  
  - id: "AC-GLASS-002"
    description: "All dashboards follow glassmorphism-design-standard.md v4.0"
    verification: "CSS variables match approved design tokens (rgba(26, 31, 58, 0.7), blur(10px), etc.)"
  
  - id: "AC-GLASS-003"
    description: "file:// protocol compatibility maintained"
    verification: "Dashboards work when opened via file:// URLs (no fetch() calls, embedded data)"
  
  - id: "AC-GLASS-004"
    description: "Asset paths correctly relative to repo subdirectory"
    verification: "CSS/images load from ../../assets/ for repos/<slug>/index.html"
  
  - id: "AC-GLASS-005"
    description: "Existing test suite passes"
    verification: "tests/visualization/spa/ tests pass with new template"

