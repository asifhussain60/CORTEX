problem_statement: |
  Dashboard generation tooling (cortex/visualization/spa/suite_generator.py) is using
  an incorrect template that produces light-themed dashboards without glassmorphism effects.
  
  Current Issues:
  - Template path points to archived KASHKOLE template (light theme)
  - Missing glassmorphism CSS specifications
  - No dark theme support
  - Broken file:// protocol compatibility
  - External CSS links not relative to repo dashboard location

  Example: KSESSIONS dashboard shows white background instead of dark glass with blur effects.

