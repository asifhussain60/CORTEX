# MCP Tools (New)
mcp_tools:
  # ORIGINAL TOOLS (Stages 1-6)
  - name: "cortex_brain_health"
    description: "Get current brain health metrics"
    stage: "stage_1"
    inputs: []
    outputs:
      - "health_score: float (0-100)"
      - "dimensions: Dict[str, float]"
      - "recommendations: List[str]"
  
  - name: "cortex_capability_mesh"
    description: "Query orchestrator capabilities at runtime"
    stage: "stage_2"
    inputs:
      - "capability_name: str"
    outputs:
      - "orchestrators: List[str]"
      - "best_match: str"
      - "confidence: float"
  
  - name: "cortex_flush_brain"
    description: "Trigger brain state flush"
    stage: "stage_5"
    inputs:
      - "targets: List[str] (optional)"
      - "force: bool (default False)"
    outputs:
      - "flushed_items: int"
      - "freed_bytes: int"
      - "duration_ms: int"
  
  - name: "cortex_enhance_domain"
    description: "Suggest or create company domain enhancements"
    stage: "stage_4"
    inputs:
      - "domain_name: str"
      - "operation_context: Dict"
    outputs:
      - "gaps: List[str]"
      - "template_suggestion: Optional[str]"
      - "auto_created: bool"
  
  # NEW TOOLS (Stages 7-12)
  - name: "cortex_mcp_audit"
    description: "Audit MCP toolkit completeness for all orchestrators"
    stage: "stage_7"
    inputs:
      - "include_missing: bool (default True)"
    outputs:
      - "total_orchestrators: int"
      - "exposed_count: int"
      - "missing_count: int"
      - "coverage_percent: float"
      - "missing_orchestrators: List[str]"
      - "generated_specs: List[Dict]"
  
  - name: "cortex_brain_share"
    description: "Share brain context with team members"
    stage: "stage_8"
    inputs:
      - "context_id: str"
      - "target_users: List[str]"
      - "scope: str (session|project|global)"
    outputs:
      - "shared_with: List[str]"
      - "share_id: str"
      - "expiry: datetime"
  
  - name: "cortex_brain_merge"
    description: "Merge learnings from team members"
    stage: "stage_8"
    inputs:
      - "source_users: List[str]"
      - "conflict_resolution: str (latest|vote|manual)"
    outputs:
      - "merged_learnings: int"
      - "conflicts: int"
      - "success: bool"
  
  - name: "cortex_brain_sync"
    description: "Sync brain state across users/instances"
    stage: "stage_8"
    inputs:
      - "target_instance: str (optional)"
    outputs:
      - "synced_items: int"
      - "sync_time_ms: int"
      - "conflicts_resolved: int"
  
  - name: "cortex_validate_deployment"
    description: "Validate SaaS/MCP deployment readiness"
    stage: "stage_9"
    inputs:
      - "mode: str (mcp|saas|both)"
      - "run_load_tests: bool (default False)"
    outputs:
      - "mcp_compliant: bool"
      - "saas_ready: bool"
      - "load_test_results: Dict"
      - "issues: List[str]"
  
  - name: "cortex_regression_check"
    description: "Check for regressions in existing functionality"
    stage: "stage_10"
    inputs:
      - "baseline_version: str (optional)"
      - "check_performance: bool (default True)"
    outputs:
      - "regressions_found: int"
      - "broken_tests: List[str]"
      - "performance_delta: Dict[str, float]"
      - "backward_compatible: bool"
  
  - name: "cortex_vacuum_relocate"
    description: "Relocate files with recataloging and path updates"
    stage: "stage_11"
    inputs:
      - "file_paths: List[str]"
      - "target_location: str (optional, auto-detect if not provided)"
      - "update_references: bool (default True)"
    outputs:
      - "files_relocated: int"
      - "references_updated: int"
      - "screaming_case_fixed: int"
      - "relocation_plan: List[Dict]"

