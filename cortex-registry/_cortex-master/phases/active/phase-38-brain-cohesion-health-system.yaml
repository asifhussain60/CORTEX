      - "cortex/mcp/tools/brain_collaboration_tools.py"
      - "tests/unit/orchestrators/core/test_central_brain.py"
    duration: "4 days"
    tests_target: 33
    
  stage_9:
    name: "SaaS/MCP Deployment Validation"
    description: |
      Validate CORTEX can be deployed as both MCP server AND SaaS.
      Load testing, multi-user scaling, API compatibility checks.
    acceptance_criteria:
      - id: "AC-PHASE38-024"
        description: "DeploymentValidator for MCP and SaaS modes"
        tests_required: 12
        validations:
          - "MCP protocol compliance (SSE streaming, tool discovery)"
          - "SaaS API endpoints (REST + WebSocket)"
          - "Load testing (100 concurrent users)"
          - "State persistence across restarts"
      - id: "AC-PHASE38-025"
        description: "Multi-user scaling validation"
        tests_required: 10
        targets:
          - "10 users: <200ms p95 latency"
          - "50 users: <500ms p95 latency"
          - "100 users: <1s p95 latency"
      - id: "AC-PHASE38-026"
