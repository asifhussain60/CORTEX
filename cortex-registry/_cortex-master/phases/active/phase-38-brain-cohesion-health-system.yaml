      - "cortex/orchestrators/support/vacuum_orchestrator.py"
      - "tests/unit/governance/test_cohesion_audit.py"
    duration: "2 days"
    tests_target: 13
    
  # NEW STAGES (2026-02-07 Enhancement)
  stage_7:
    name: "MCP Toolkit Completeness Audit"
    description: |
      Audit ALL 35 orchestrators for MCP exposure. Ensure every orchestrator
