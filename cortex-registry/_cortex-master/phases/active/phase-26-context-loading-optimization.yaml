---
# ============================================================================
# SOLUTION DESIGN
# ============================================================================

solution_overview: |
  Remove ALL file path references from instruction files.
  Replace with directory-level discovery hints.
  AI uses semantic_search or explicit read_file only when needed.
  EXIT GATE handles cost-aware context synthesis.

architecture:
  approach: "Discovery-Based Lazy Loading"
  
  components:
    - name: "Prompt Path Removal"
      responsibility: "Remove file paths from all instruction files"
      files_affected:
        - ".github/copilot-instructions.md"
        - ".github/prompts/cortex-architect.prompt.md"
        - ".github/prompts/CORTEX.prompt.md"
        - ".github/prompts/response-format-standards.md"
      
      before: |
        **Primary Prompt:** `prompts/CORTEX.prompt.md` (load explicitly when needed)
        **Agents:** `agents/core/cortex-architect.md` (load explicitly when needed)
      
      after: |
        **Primary Prompt:** CORTEX.prompt.md
        **Agents:** cortex-architect.md
        
        **Location:** .github/prompts/ directory
        **Loading:** Use semantic_search or read_file when actually needed
    
    - name: "Discovery Hints System"
      responsibility: "Provide directory-level context for discovery"
      pattern: |
        ## Context Loading Strategy
        **On-Demand Only:** Use semantic_search or read_file when actually needed
        
        **File Discovery:**
        - Prompts: .github/prompts/ directory
        - Agents: .github/agents/core/ directory
        - Knowledge: cortex/knowledge/best-practices/
        
        **Intent-Based Loading:**
        - IMPLEMENT → Load TDD patterns via EXIT GATE
        - AUDIT → Load governance rules via EXIT GATE
        - DESIGN → Load architecture patterns via EXIT GATE
    
    - name: "EXIT GATE Integration"
      responsibility: "Cost-aware context synthesis"
      location: "cortex/brain/core/context_synthesis_gateway.py"
      behavior: |
        - MasterOrchestrator invokes EXIT GATE before intent classification
        - EXIT GATE determines minimal context needed
        - Compression: agents 95%, YAML 91%, code 88%
        - Cache hit rate target: 70%
        - Budget enforcement: ≤20k tokens per turn
    
    - name: "CORE-047 Enforcement"
      responsibility: "Update rule to clarify auto-load behavior"
      location: ".github/copilot-instructions.md"
      before: |
        CORE-047: Instruction files MUST use backtick references (NO markdown links)
      after: |
        CORE-047: Instruction files MUST NOT include file paths (even backticks 
        trigger VS Code auto-load). Use directory references only.

  data_flow: |
    User Request → MasterOrchestrator
                ↓
    EXIT GATE synthesizes minimal context (≤20k tokens)
                ↓
    AI classifies intent (IMPLEMENT/AUDIT/etc.)
                ↓
    IF additional context needed:
      → AI explicitly calls semantic_search("agent for {intent}")
      → AI explicitly calls read_file(path) for specific needs
                ↓
    NO auto-loading by VS Code

