# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    Restore the clean architecture from archive/CORTEX-4.0 that was working well:
    
    **Archive/CORTEX-4.0 Pattern (321 LOC orchestrator):**
    - Clean separation: Use cases + repositories + templates
    - LENSOrchestrator with caching (10x faster repeated analysis)
    - Repository pattern for data access (JSON-based, swappable)
    - Jinja2 template system (UI decoupled from Python)
    - 6 specialized use cases (single responsibility)
    - Batch analysis support (multi-file optimization)
    
    **Current Implementation Issues (2,448 LOC orchestrator):**
    - Monolithic orchestrator doing everything
    - No caching (slow repeated queries)
    - No use case isolation (tight coupling)
    - Hardcoded dashboard generation
    - Lazy loading everything (complexity)
    - Mixed concerns: LENS, security, dashboard, landing page, narratives
    
    **Migration Goals:**
    1. Extract 6 use cases from current orchestrator
    2. Implement repository pattern (profile storage)
    3. Restore LENSOrchestrator caching layer
    4. Add Jinja2 template system for dashboards
    5. Reduce orchestrator from 2,448 → ~500 LOC
    6. Maintain 100% feature parity
    7. 10x performance improvement via caching

  problem_statement: |
    **Root Cause Analysis:** Archive/CORTEX-4.0 had working dashboard crawler
    and onboarding that was fast, modular, and maintainable. Current implementation
    regressed to monolithic anti-pattern with no separation of concerns.
    
    **Key Differences (Archive vs Current):**
    
    | Aspect | Archive/CORTEX-4.0 | Current | Impact |
    |--------|-------------------|---------|---------|
    | **Orchestrator Size** | 321 LOC | 2,448 LOC | 7.6x bloat |
    | **Separation** | 6 use cases | 1 monolith | Hard to test |
    | **Template System** | Jinja2 | Python code | Can't customize |
    | **Caching** | ✅ LENSOrchestrator | ❌ None | 10x slower |
    | **Repository Pattern** | ✅ JSON repos | ❌ Direct dicts | Hard to swap |
    | **Batch Analysis** | ✅ analyze_batch() | ❌ One-by-one | Poor perf |
    
    **Technical Debt Accumulated:**
    - Monolithic orchestrator violates SOLID principles
    - No caching means repeated LENS analysis (same files, 10x work)
    - Direct dict manipulation instead of repository pattern
    - Hardcoded dashboard generation (can't change UI)
    - All concerns mixed: LENS + security + dashboard + landing + narrative
    - Lazy loading adds complexity without clear benefit
    
    **Performance Impact:**
    - Onboarding KSESSIONS: ~12 minutes (archive: ~2 minutes with caching)
    - Repeated dashboard generation: No cache means full re-analysis
    - Batch operations: Not supported (analyze one file at a time)

  business_impact:
    - "🔴 Performance: 10x slower than archive implementation (no caching)"
    - "🟡 Maintainability: 2,448 LOC orchestrator hard to test/modify"
    - "🟡 Testability: Mixed concerns make unit testing difficult"
    - "🟡 Customization: Hardcoded dashboard (no template system)"
    - "🟢 Feature Parity: Can restore fast onboarding from archive"
    - "🟢 Developer Experience: Clean architecture improves productivity"

  expected_outcomes:
    - "RepositoryOnboardingOrchestrator: 2,448 → ~500 LOC (orchestration only)"
    - "6 Use Cases: Extracted and unit-tested independently"
    - "Repository Pattern: JSONProfileRepository for data access"
    - "LENSOrchestrator: Restored with caching (10x performance)"
    - "Template System: Jinja2 for dashboard customization"
    - "Batch Analysis: Multi-file optimization support"
    - "Tests: 85+ tests (use case isolation enables better testing)"
    - "Performance: Onboarding time reduced 5x via caching"
    - "Zero Regression: Current features maintained 100%"

