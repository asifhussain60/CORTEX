    validation:
      method: "pytest + manual template review"
      criteria: "10+ tests passing, template renders correctly"
      estimated_time: "30 minutes"

  stage_5:
    name: "Refactor RepositoryOnboardingOrchestrator to Coordinator"
    id: "S5"
    duration: "3 hours"
    priority: "P0"
    dependencies: ["S1", "S2", "S3", "S4"]
    
    description: |
      Refactor RepositoryOnboardingOrchestrator from 2,448 LOC monolith
      to ~500 LOC coordinator:
      
      **New Architecture:**
      ```python
      class RepositoryOnboardingOrchestrator:
          def __init__(self):
              self.lens_orchestrator = LENSOrchestratorV2()
              self.profile_repo = JSONProfileRepository()
              self.dashboard_renderer = DashboardRenderer()
              self.use_cases = {
                  'overview': LoadRepoOverviewUseCase(),
                  'security': AnalyzeSecurityThreatsUseCase(),
                  'narrative': GenerateBusinessNarrativeUseCase(),
                  'dependencies': BuildDependencyGraphUseCase(),
                  'dashboard': RenderDashboardJSONUseCase(),
                  'landing': UpdateLandingPageUseCase(),
              }
          
          def onboard_repository(self, repo_path):
              # Orchestrate use cases (delegation only)
              overview = self.use_cases['overview'].execute(repo_path)
              security = self.use_cases['security'].execute(lens_context)
              narrative = self.use_cases['narrative'].execute(overview)
              dependencies = self.use_cases['dependencies'].execute(repo_path)
              dashboard = self.use_cases['dashboard'].execute(...)
              landing = self.use_cases['landing'].execute(dashboard)
              
              return OnboardingResult(...)
      ```
      
      **Reduction:**
      - 2,448 LOC → ~500 LOC (orchestration only)
      - All business logic in use cases (testable)
      - Clean separation of concerns
      
      Output: Refactored orchestrator + 10 integration tests.
    
    tasks:
      - task: "Refactor onboard_repository() to coordinator"
        acceptance_criteria:
          - "AC-054-S5-01: Method coordinates use cases only"
          - "AC-054-S5-02: No business logic in orchestrator"
          - "AC-054-S5-03: Reduced to ~500 LOC"
      
      - task: "Wire use cases via dependency injection"
        acceptance_criteria:
          - "AC-054-S5-04: Use cases injected in __init__"
          - "AC-054-S5-05: Supports mock use cases (testing)"
      
      - task: "Remove legacy methods (moved to use cases)"
        acceptance_criteria:
          - "AC-054-S5-06: _convert_to_dashboard_model() removed"
          - "AC-054-S5-07: _generate_dashboard() removed"
          - "AC-054-S5-08: All helper methods extracted"
      
      - task: "Add integration tests"
        acceptance_criteria:
          - "AC-054-S5-09: Test end-to-end onboarding flow"
          - "AC-054-S5-10: Test with real use cases (not mocks)"
    
    deliverables:
      - "cortex/orchestrators/support/repository_onboarding_orchestrator.py (refactored)"
      - "tests/orchestrators/support/test_repository_onboarding_orchestrator_integration.py (10+ tests)"
    
    tests:
