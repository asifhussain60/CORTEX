      criteria: "41+ tests passing, 100% coverage"
      estimated_time: "30 minutes"

  stage_2:
    name: "Implement Repository Pattern for Profile Storage"
    id: "S2"
    duration: "2 hours"
    priority: "P0"
    dependencies: ["S1"]
    
    description: |
      Implement repository pattern for onboarding profile storage:
      
      **JSONProfileRepository:**
      - get_by_name(repo_name) → OnboardingProfile
      - save(profile) → str (file path)
      - delete(repo_name) → bool
      - list_all() → List[OnboardingProfile]
      - exists(repo_name) → bool
      
      **Benefits:**
      - Abstraction: Can swap JSON → SQLite → API later
      - Testability: Mock repository in tests
      - Encapsulation: Hide storage implementation
      
      Output: Repository with 15+ tests.
    
    tasks:
      - task: "Implement JSONProfileRepository interface"
        acceptance_criteria:
          - "AC-054-S2-01: Repository implements get_by_name()"
          - "AC-054-S2-02: Repository implements save()"
          - "AC-054-S2-03: Repository implements delete()"
          - "AC-054-S2-04: Repository implements list_all()"
          - "AC-054-S2-05: Repository implements exists()"
      
      - task: "Add profile model validation"
        acceptance_criteria:
          - "AC-054-S2-06: Validates OnboardingProfile schema"
          - "AC-054-S2-07: Rejects invalid profiles"
      
      - task: "Implement file operations with error handling"
        acceptance_criteria:
          - "AC-054-S2-08: Handles missing files gracefully"
          - "AC-054-S2-09: Handles write errors"
          - "AC-054-S2-10: Creates directories as needed"
    
    deliverables:
      - "cortex/repositories/__init__.py"
      - "cortex/repositories/json_profile_repository.py"
      - "cortex/repositories/repository_interface.py"
      - "tests/repositories/test_json_profile_repository.py (15+ tests)"
    
    tests:
      - "test_repository_get_by_name"
      - "test_repository_save_profile"
      - "test_repository_delete_profile"
      - "test_repository_list_all"
      - "test_repository_exists"
    
    validation:
      method: "pytest tests/repositories/"
      criteria: "15+ tests passing, error cases covered"
      estimated_time: "20 minutes"

  stage_3:
    name: "Restore LENSOrchestrator Caching Layer"
    id: "S3"
    duration: "3 hours"
    priority: "P0"
    dependencies: []
    
    description: |
      Restore LENSOrchestrator from archive/CORTEX-4.0 with caching:
      
      **Key Features:**
      - analyze_file() with result caching (file_path → LENSContext)
      - analyze_batch() for multi-file optimization
      - Cache invalidation on file modification
      - IntentRouter-compatible output format
      
      **Performance:**
      - First analysis: ~500ms per file
      - Cached analysis: ~5ms per file (100x faster)
      - Batch analysis: Parallel processing (4x throughput)
      
      Output: LENSOrchestrator with caching + 20 tests.
    
    tasks:
      - task: "Implement LENSOrchestrator with cache"
        acceptance_criteria:
          - "AC-054-S3-01: analyze_file() returns LENSContext"
          - "AC-054-S3-02: Cache stores results by file_path"
          - "AC-054-S3-03: analyze_batch() supports multi-file"
      
      - task: "Implement cache invalidation"
        acceptance_criteria:
          - "AC-054-S3-04: Invalidates on file modification"
          - "AC-054-S3-05: Configurable TTL (default 10 minutes)"
      
      - task: "Add GitHistoryAnalyzer integration"
        acceptance_criteria:
          - "AC-054-S3-06: Integrates GitHistoryAnalyzer"
          - "AC-054-S3-07: Returns recent commits data"
      
      - task: "Add ASTAnalyzer integration"
        acceptance_criteria:
          - "AC-054-S3-08: Integrates ASTAnalyzer"
          - "AC-054-S3-09: Returns functions, classes, complexity"
      
      - task: "Add CommentExtractor integration"
        acceptance_criteria:
          - "AC-054-S3-10: Integrates CommentExtractor"
          - "AC-054-S3-11: Returns TODOs, docstrings"
    
    deliverables:
      - "cortex/orchestrators/support/lens_orchestrator_v2.py"
      - "tests/orchestrators/support/test_lens_orchestrator_v2.py (20+ tests)"
    
    tests:
      - "test_lens_orchestrator_analyze_file"
      - "test_lens_orchestrator_caching"
      - "test_lens_orchestrator_batch_analysis"
      - "test_lens_orchestrator_cache_invalidation"
      - "test_lens_orchestrator_integrations"
    
    validation:
      method: "pytest + performance benchmark"
      criteria: "20+ tests passing, 100x cache speedup measured"
      estimated_time: "30 minutes"

  stage_4:
    name: "Implement Jinja2 Template System for Dashboards"
    id: "S4"
    duration: "3 hours"
    priority: "P1"
    dependencies: ["S1", "S2"]
    
    description: |
      Add Jinja2 template system for dashboard rendering:
      
      **Templates:**
      - onboarding_dashboard.html.j2 — Main dashboard template
      - dashboard_components/*.html.j2 — Reusable components
      - Custom filters: format_number, round_decimal, etc.
      
      **Benefits:**
      - UI decoupled from Python code
      - Designers can edit templates without Python knowledge
      - Template inheritance (DRY principle)
      - Server-side rendering (no client JS required)
      
      Output: Template system with 3 templates + 10 tests.
    
    tasks:
      - task: "Setup Jinja2 environment"
        acceptance_criteria:
          - "AC-054-S4-01: Jinja2 environment initialized"
          - "AC-054-S4-02: Template loader configured"
          - "AC-054-S4-03: Auto-escape enabled for security"
      
      - task: "Create onboarding_dashboard.html.j2 template"
        acceptance_criteria:
