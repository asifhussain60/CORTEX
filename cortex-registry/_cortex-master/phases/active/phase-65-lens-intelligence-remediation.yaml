# ============================================================================
# EXECUTION CONSTRAINTS
# ============================================================================

execution:
  tdd_mandatory: true
  incremental: true
  max_loc_per_increment: 500
  checkpoint_frequency: "per_stage"
  rollback_strategy: "git revert to pre-stage commit"

  stage_order:
    critical_path: "S1 → S3 → S4 → S5 → S8"
    parallel_safe: ["S2 (parallel with S1)", "S6 (parallel with S5)", "S7 (after S6)"]
    
  execution_sequence:
    - batch_1:
        stages: ["S1", "S2"]
        parallel: true
        description: "Foundation — wire YAML loading and LENSWarmer in parallel"
    - batch_2:
        stages: ["S3"]
        parallel: false
        description: "ChallengeEngine wiring — depends on S1 and S2"
    - batch_3:
        stages: ["S4"]
        parallel: false
        description: "Unified Provider — depends on S1, S2, S3"
    - batch_4:
        stages: ["S5", "S6"]
        parallel: true
        description: "Accumulation + consolidation in parallel"
    - batch_5:
        stages: ["S7"]
        parallel: false
        description: "Tier wiring — depends on S6 canonical models"
    - batch_6:
        stages: ["S8"]
        parallel: false
        description: "Integration testing — depends on everything"

# ============================================================================
# RISK ASSESSMENT
# ============================================================================

risks:
  - id: "RISK-001"
    description: "YAML loading performance — 40+ files on every intent"
    probability: "medium"
    impact: "medium"
    mitigation: "TTL-based caching (5 min). First load ~500ms, cached <10ms."

  - id: "RISK-002"
    description: "Breaking existing tests — wiring changes touch core orchestrators"
    probability: "low"
    impact: "high"
    mitigation: "All wiring uses delegation with try/except fallback to original stubs."

  - id: "RISK-003"
    description: "Circular imports — intelligence/provider.py importing from multiple layers"
    probability: "medium"
    impact: "medium"
    mitigation: "Use lazy imports and interface-based injection (IIntelligenceProvider)."

  - id: "RISK-004"
    description: "Token budget impact — richer intelligence context increases response size"
    probability: "medium"
    impact: "low"
    mitigation: "Provider respects tier budgets. Quick tier caps at 2KB context."

