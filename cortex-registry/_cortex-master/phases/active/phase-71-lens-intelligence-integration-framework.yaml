risks_and_mitigations:
  - risk: "Schema too restrictive; breaks existing LENS outputs"
    severity: "HIGH"
    mitigation: |
      - Mark v1 as "beta"
      - Add explicit schemaVersion to all outputs
      - Maintain backward compat mode (old outputs parse as LDv1)
      - Test against existing dashboard.json
  
  - risk: "Evidence protocol adds 5-10% overhead"
    severity: "MEDIUM"
    mitigation: |
      - Measure baseline (git log, AST parse, comment scan)
      - Profile hot paths
      - Optimize if overhead > 10%
      - Accept slight overhead for accuracy benefit
  
  - risk: "Cache invalidation miss (stale results)"
    severity: "HIGH"
    mitigation: |
      - Versioning + explicit invalidate command
      - Hash-check before using cached results
      - TTL expiration (30 days max age)
      - Integration tests verify cache consistency
  
  - risk: "Discovery of new gap during S3-S4"
    severity: "MEDIUM"
    mitigation: |
      - Buffer 2-3 days in schedule
      - Split Phase 71 if needed (S1-S2 core, S3-S5 defer)
      - Pivot to Phase 70 if blockers emerge

