# ============================================================================
# STAGES (3 Stages — MVP Focused)
# ============================================================================
stages:
  stage_1:
    name: "Extract Use Cases from Monolithic Orchestrator"
    id: "S1"
    duration: "6 hours"  # Revised from 3h (realistic estimate)
    priority: "P0"
    dependencies: []
    
    description: |
      Extract 6 independent use cases from RepositoryOnboardingOrchestrator:
      
      1. **LoadRepoOverviewUseCase** — Basic repo metadata extraction
      2. **AnalyzeSecurityThreatsUseCase** — P0/P1/P2 threat modeling
      3. **GenerateBusinessNarrativeUseCase** — Business language generation
      4. **BuildDependencyGraphUseCase** — Dependency analysis
      5. **RenderDashboardJSONUseCase** — Dashboard model conversion
      6. **UpdateLandingPageUseCase** — Landing page hub updates
      
      Each use case:
      - Single responsibility (SOLID)
      - Independent unit tests (no orchestrator dependency)
      - Repository pattern for data access
      - Graceful error handling
      
      Output: 6 use case classes with 100% test coverage (41+ tests).
    
    tasks:
      - task: "Extract LoadRepoOverviewUseCase"
        acceptance_criteria:
          - "AC-054A-S1-01: Use case extracts basic repo metadata"
          - "AC-054A-S1-02: Uses JSONProfileRepository for storage"
          - "AC-054A-S1-03: 5+ unit tests (no orchestrator dependency)"
      
      - task: "Extract AnalyzeSecurityThreatsUseCase"
        acceptance_criteria:
          - "AC-054A-S1-04: Use case runs P0/P1/P2 threat modeling"
          - "AC-054A-S1-05: Uses SecurityRisk models"
          - "AC-054A-S1-06: 8+ unit tests with mock data"
      
      - task: "Extract GenerateBusinessNarrativeUseCase"
        acceptance_criteria:
          - "AC-054A-S1-07: Use case generates business narratives"
          - "AC-054A-S1-08: Delegates to BusinessLanguageOrchestrator"
          - "AC-054A-S1-09: 6+ unit tests with confidence scores"
      
      - task: "Extract BuildDependencyGraphUseCase"
        acceptance_criteria:
          - "AC-054A-S1-10: Use case builds dependency graphs"
          - "AC-054A-S1-11: Uses PackageDependency models"
          - "AC-054A-S1-12: 7+ unit tests with mock packages"
      
      - task: "Extract RenderDashboardJSONUseCase"
        acceptance_criteria:
          - "AC-054A-S1-13: Use case converts to RepoDashboardModel"
          - "AC-054A-S1-14: Validates schema v3.0"
          - "AC-054A-S1-15: 10+ unit tests with model validation"
      
      - task: "Extract UpdateLandingPageUseCase"
        acceptance_criteria:
          - "AC-054A-S1-16: Use case updates landing page hub"
          - "AC-054A-S1-17: Uses LandingPageGenerator"
          - "AC-054A-S1-18: 5+ unit tests with mock generator"
    
    deliverables:
      - "cortex/orchestrators/support/onboarding_use_cases/__init__.py"
      - "cortex/orchestrators/support/onboarding_use_cases/load_repo_overview.py"
      - "cortex/orchestrators/support/onboarding_use_cases/analyze_security_threats.py"
      - "cortex/orchestrators/support/onboarding_use_cases/generate_business_narrative.py"
      - "cortex/orchestrators/support/onboarding_use_cases/build_dependency_graph.py"
      - "cortex/orchestrators/support/onboarding_use_cases/render_dashboard_json.py"
      - "cortex/orchestrators/support/onboarding_use_cases/update_landing_page.py"
      - "tests/orchestrators/support/onboarding_use_cases/ (41+ tests)"
    
    tests:
      - "test_load_repo_overview_use_case"
      - "test_analyze_security_threats_use_case"
      - "test_generate_business_narrative_use_case"
      - "test_build_dependency_graph_use_case"
      - "test_render_dashboard_json_use_case"
      - "test_update_landing_page_use_case"
    
    validation:
      method: "pytest tests/orchestrators/support/onboarding_use_cases/"
      criteria: "41+ tests passing, 100% coverage, no orchestrator dependencies"
      estimated_time: "30 minutes"

  stage_2:
    name: "Implement Repository Pattern for Profile Storage"
    id: "S2"
    duration: "3 hours"
    priority: "P0"
    dependencies: ["S1"]
    
    description: |
      Implement repository pattern for onboarding profile storage:
      
      **JSONProfileRepository:**
      - get_by_name(repo_name) → OnboardingProfile
      - save(profile) → str (file path)
      - delete(repo_name) → bool
      - list_all() → List[OnboardingProfile]
      - exists(repo_name) → bool
      
      **Benefits:**
      - Abstraction: Can swap JSON → SQLite → API later
      - Testability: Mock repository in tests
      - Encapsulation: Hide storage implementation
      
      Output: Repository with 15+ tests.
    
    tasks:
      - task: "Implement JSONProfileRepository interface"
        acceptance_criteria:
          - "AC-054A-S2-01: Repository implements get_by_name()"
          - "AC-054A-S2-02: Repository implements save()"
          - "AC-054A-S2-03: Repository implements delete()"
          - "AC-054A-S2-04: Repository implements list_all()"
          - "AC-054A-S2-05: Repository implements exists()"
      
      - task: "Add profile model validation"
        acceptance_criteria:
          - "AC-054A-S2-06: Validates OnboardingProfile schema"
          - "AC-054A-S2-07: Rejects invalid profiles"
      
      - task: "Implement file operations with error handling"
        acceptance_criteria:
          - "AC-054A-S2-08: Handles missing files gracefully"
          - "AC-054A-S2-09: Handles write errors"
          - "AC-054A-S2-10: Creates directories as needed"
    
    deliverables:
      - "cortex/repositories/__init__.py"
      - "cortex/repositories/json_profile_repository.py"
      - "cortex/repositories/repository_interface.py"
      - "tests/repositories/test_json_profile_repository.py (15+ tests)"
    
    tests:
      - "test_repository_get_by_name"
      - "test_repository_save_profile"
      - "test_repository_delete_profile"
      - "test_repository_list_all"
      - "test_repository_exists"
      - "test_repository_validation"
      - "test_repository_error_handling"
    
    validation:
      method: "pytest tests/repositories/"
      criteria: "15+ tests passing, error cases covered"
      estimated_time: "20 minutes"

  stage_3:
    name: "Jinja2 Template System MVP (Single Template)"
    id: "S3"
    duration: "5 hours"
    priority: "P1"
    dependencies: ["S1", "S2"]
    
    description: |
      Implement Jinja2 template system MVP (1 template vs full library):
      
      **MVP Scope:**
      - onboarding_dashboard.html.j2 — Main dashboard template
      - 3 custom filters: format_number, round_decimal, format_date
      - DashboardRenderer — Coordinates use cases + renders template
      
      **Deferred to Future:**
      - Component library (dashboard_components/*.j2)
      - Template inheritance
      - Advanced filters
      
      **Benefits:**
      - Proves template system works
      - Enables designer editing (no Python knowledge)
      - Foundation for future expansion
      
      Output: 1 template + renderer + 10 tests.
    
    tasks:
      - task: "Setup Jinja2 environment"
        acceptance_criteria:
          - "AC-054A-S3-01: Jinja2 environment initialized"
          - "AC-054A-S3-02: Template loader configured"
          - "AC-054A-S3-03: Auto-escape enabled for security"
      
      - task: "Create onboarding_dashboard.html.j2 MVP template"
        acceptance_criteria:
          - "AC-054A-S3-04: Template renders dashboard HTML"
          - "AC-054A-S3-05: Includes all sections (overview, metrics, security)"
          - "AC-054A-S3-06: Uses variables from context"
      
      - task: "Implement 3 essential Jinja2 filters"
        acceptance_criteria:
          - "AC-054A-S3-07: format_number filter works"
          - "AC-054A-S3-08: round_decimal filter works"
          - "AC-054A-S3-09: format_date filter works"
      
      - task: "Create DashboardRenderer MVP"
        acceptance_criteria:
          - "AC-054A-S3-10: DashboardRenderer coordinates use cases"
          - "AC-054A-S3-11: Renders template with data"
          - "AC-054A-S3-12: Error handling for missing templates"
    
    deliverables:
      - "cortex/templates/dashboards/onboarding_dashboard.html.j2"
      - "cortex/orchestrators/support/dashboard_renderer.py"
      - "tests/orchestrators/support/test_dashboard_renderer.py (10+ tests)"
    
    tests:
      - "test_jinja_environment_setup"
      - "test_dashboard_template_rendering"
      - "test_custom_filters"
      - "test_dashboard_renderer_coordinates_use_cases"
      - "test_error_handling"
    
    validation:
      method: "pytest + manual template review"
      criteria: "10+ tests passing, template renders correctly, designers can edit"
      estimated_time: "30 minutes"

