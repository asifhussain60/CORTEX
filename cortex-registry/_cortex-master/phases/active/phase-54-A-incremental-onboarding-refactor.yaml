# ============================================================================
# VISION & GOALS (REVISED)
# ============================================================================
overview:
  vision: |
    Incremental refactoring of RepositoryOnboardingOrchestrator focusing on
    immediate value: use case extraction, repository pattern abstraction, and
    Jinja2 MVP template system.
    
    **Current State (2,418 LOC orchestrator):**
    - Monolithic: LENS + security + dashboard + landing page + narratives
    - Working: No performance complaints from users
    - Tested: Comprehensive test coverage exists
    - Functional: All features operational
    
    **Incremental Goals (14h, 3 stages):**
    1. ✅ Extract 6 use cases (SOLID Single Responsibility)
    2. ✅ Implement repository pattern (data abstraction)
    3. ✅ Jinja2 MVP (1 template, not full library)
    
    **Deferred to Future Phases:**
    - ⏸️ LENS cache restoration (already exists via ENH-042)
    - ⏸️ 500 LOC refactor (no user pain, defer until bottleneck)
    - ⏸️ TDD state machine (YAGNI - current 830 LOC working)
    - ⏸️ Plugin registry (YAGNI - 3 languages sufficient)
    - ⏸️ Performance benchmarks (no complaints, defer)

  problem_statement: |
    **Real Problem (Evidence-Based):**
    
    1. **Monolithic Orchestrator** (CORE-035 compliance)
       - 2,418 LOC doing everything
       - Hard to unit test individual concerns
       - Violates Single Responsibility Principle
    
    2. **No Repository Pattern** (Storage abstraction)
       - Direct dict manipulation for profile storage
       - Hard to swap JSON → SQLite → API later
       - Couples orchestrator to storage implementation
    
    3. **Hardcoded Dashboard HTML** (UI coupling)
       - Dashboard generation mixed with Python code
       - Designers can't edit UI without Python knowledge
       - No template inheritance (DRY violations)
    
    **NOT Problems (Validated via CORE-030):**
    - ❌ "No caching" — ENH-042 cache exists (TTL + LRU)
    - ❌ "10x slower" — No user complaints, benchmarks needed
    - ❌ "Archive was better" — Archive had different domain

  business_impact:
    - "🟡 Maintainability: 2,418 LOC orchestrator hard to modify"
    - "🟡 Testability: Mixed concerns make unit testing difficult"
    - "🟡 UI Flexibility: Hardcoded dashboard limits customization"
    - "🟢 SOLID Compliance: Use case extraction improves architecture"
    - "🟢 Storage Abstraction: Repository pattern enables future migrations"
    - "🟢 Designer Productivity: Jinja2 enables non-Python UI edits"

  expected_outcomes:
    - "6 Use Cases: Extracted and unit-tested independently (41+ tests)"
    - "Repository Pattern: JSONProfileRepository abstraction (15+ tests)"
    - "Jinja2 MVP: 1 dashboard template with basic filters (10+ tests)"
    - "Orchestrator: Still 2,418 LOC (coordinator refactor deferred)"
    - "Tests: 66+ tests (85% of original 115 target)"
    - "Coverage: 90% (focused on new code)"
    - "Zero Regression: Current features maintained 100%"
    - "Foundation: Architecture ready for future optimizations"

