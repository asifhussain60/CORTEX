overview:
  vision: |
    Unify chat file analysis (DIGEST) and knowledge entry population (INGEST)
    into a single, intelligent facade that routes to specialized orchestrators
    while maintaining complete isolation and CORE-035 compliance.
  
  problem_statement: |
    - DIGEST and INGEST developed separately, risk of drift
    - No unified MCP interface for combined operations
    - Brittleness: Potential code duplication in routing logic
    - PROMPT improvements not coordinated across modes
  
  expected_outcomes:
    - Single UnifiedDigestIngestionFacade composition layer
    - Intelligent auto-detection of operation mode
    - MCP tool (cortex_unified_digest_ingest) for chat/console access
    - Prompt enhancements for both DIGEST and INGEST in CORTEX.prompt.md
    - Complete documentation with usage examples

