architecture:
  components:
    - name: "UnifiedDigestIngestionFacade"
      file: "cortex/orchestrators/unified_digest_ingest_facade.py"
      responsibility: "Composition layer routing to DIGEST or INGEST orchestrators"
      pattern: "Composition (NOT inheritance) prevents brittleness"
      interface: |
        - async unified_process(
            content: str,
            operation_hint: str = "auto",
            context: Optional[Dict] = None
          ) → Dict[str, Any]
        
        - auto_detect_operation(content: str) → Literal["DIGEST", "INGEST"]
        - route_to_orchestrator(operation: str, context: Dict) → OrchestratorBase
    
    - name: "cortex_unified_digest_ingest MCP Tool"
      file: "cortex/mcp/tools/cortex_unified_digest_ingest.py"
      responsibility: "CLI access to unified facade"
      parameters:
        - mode: "digest|ingest|auto"
        - content: "Input data"
        - context: "Optional routing hints"
      output: "Unified response with operation metadata"

design_decisions:
  - decision: "Composition over Inheritance"
    rationale: "Prevents tight coupling between DIGEST and INGEST logic"
    impact: "Reduces complexity, increases testability, prevents brittleness"
  
  - decision: "Auto-detection with Manual Override"
    rationale: "Smart defaults + user control for edge cases"
    impact: "User friendly, flexible, handles ambiguous inputs"
  
  - decision: "Unified MCP Tool"
    rationale: "Single command to user, intelligent routing behind scenes"
    impact: "Better UX, centralized error handling, easier maintenance"

