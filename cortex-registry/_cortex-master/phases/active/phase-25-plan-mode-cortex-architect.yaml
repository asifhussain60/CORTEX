# ============================================================================
# PLAN MODE SPECIFICATION
# ============================================================================

plan_mode:
  # ============================================================================
  # SINGLE COMMAND: /plan
  # ============================================================================
  # CORTEX intelligently determines operation (create/update/deprecate/complete)
  # User does NOT specify operation - CORTEX decides based on:
  # 1. Request semantics
  # 2. Existing phase alignment
  # 3. Current plan organization strategy
  
  trigger_patterns:
    # Primary trigger - single command, CORTEX decides operation
    explicit:
      - "/plan {description}"
      - "/plan"  # Opens plan wizard
    
    implicit_cortex_change:
      - "add {feature} to CORTEX"
      - "implement {orchestrator}"
      - "enhance cortex-architect"
      - "modify {cortex component}"
      - "refactor {cortex module}"
      - "add mode to CORTEX"
      - "create orchestrator"
      - "add MCP tool"
      - "update wiring"
      - "delete {cortex feature}"
      - "remove {orchestrator}"
      - "deprecate {component}"
    
    excluded_patterns:
      # Don't trigger PLAN mode for these
      - "audit"
      - "analyze"
      - "check"
      - "review"
      - "digest"
      - "fix bug"  # Use DESIGN for bugs
      - "external project"  # Non-CORTEX work
  
  # ============================================================================
  # INTELLIGENT PHASE RESOLUTION (CORTEX DECIDES)
  # ============================================================================
  intelligent_resolution:
    description: |
      CORTEX automatically determines whether to CREATE new phase or UPDATE existing phase.
      User does NOT need to specify - CORTEX uses semantic analysis + plan organization.
    
    decision_algorithm:
      step_1_load_context:
        - "Load cortex-registry/_cortex-master/index.yaml"
        - "Parse all active_phases with their deliverables"
        - "Load current plan organization strategy"
      
      step_2_semantic_analysis:
        - "Extract keywords from user request"
        - "Identify affected CORTEX components"
        - "Classify change type: ADD | MODIFY | REMOVE | REFACTOR"
      
      step_3_phase_matching:
        algorithm: |
          FOR each active_phase IN index.yaml:
            match_score = 0
            
            # Keyword matching (weight: 40%)
            keywords_in_phase = extract_keywords(phase.name + phase.deliverables)
            keywords_in_request = extract_keywords(user_request)
            keyword_overlap = intersection(keywords_in_phase, keywords_in_request)
            match_score += len(keyword_overlap) * 0.4
            
            # Component alignment (weight: 30%)
            IF request_affects_same_component(phase, request):
              match_score += 0.3
            
            # Scope compatibility (weight: 30%)
            IF phase.status == "IN_PROGRESS" AND similar_scope(phase, request):
              match_score += 0.3
            
            IF match_score >= 0.6:
              RETURN PHASE_UPDATE(phase)
          
          # No match found - create new phase
          RETURN PHASE_CREATE
      
      step_4_operation_decision:
        rules:
          - condition: "match_score >= 0.8"
            operation: "PHASE_UPDATE"
            rationale: "Strong alignment with existing phase"
          
          - condition: "match_score >= 0.6 AND match_score < 0.8"
            operation: "PHASE_UPDATE_WITH_EXPANSION"
            rationale: "Partial alignment - expand existing phase"
          
          - condition: "match_score < 0.6 AND is_significant_change"
            operation: "PHASE_CREATE"
            rationale: "New significant work needs dedicated phase"
          
          - condition: "match_score < 0.6 AND is_minor_change"
            operation: "DESIGN_MODE"
            rationale: "Minor change doesn't need phase tracking"
          
          - condition: "request_contains_deletion_intent"
            operation: "PHASE_DEPRECATE"
            rationale: "Deprecate phase if feature being removed"
    
    user_notification:
      format: |
        ### 🎯 Plan Resolution
        
        **Request:** {user_request_summary}
        
        **CORTEX Decision:** {CREATE | UPDATE | DEPRECATE}
        
        **Rationale:**
        - Match Score: {score}% with Phase {N}
        - Operation: {operation_description}
        - Affected Phase: {phase_name or "NEW"}
        
        **Proceed?** (yes/no/modify)

  phase_operations:
    create:
      description: "Create new phase for significant CORTEX enhancement"
      threshold:
        - "Multi-file changes (3+)"
        - "New orchestrator"
        - "New MCP tool"
        - "New mode/capability"
        - "Architecture change"
      action: |
        1. Generate phase-{N}-{kebab-name}.yaml from template
        2. Add to _cortex-master/phases/active/
        3. Update _cortex-master/index.yaml (active_phases)
        4. Regenerate dashboard data (plan-summary.json)
        5. Commit: "feat(phase-{N}): Initialize {name} phase"
    
    update:
      description: "Update existing phase with new deliverables"
      threshold:
        - "Work aligns with active/planned phase"
        - "Incremental progress on existing phase"
      action: |
        1. Load existing phase YAML
        2. Update deliverables/tasks/status
        3. Update progress percentage
        4. Regenerate dashboard data
        5. Commit: "feat(phase-{N}): Update {description}"
    
    deprecate:
      description: "Mark phase as deprecated (not deleted)"
      threshold:
        - "Feature removed or superseded"
        - "Approach changed fundamentally"
      action: |
        1. Move from active/ to deprecated/ (new folder)
        2. Add deprecation metadata (reason, superseded_by)
        3. Update index.yaml (remove from active)
        4. Regenerate dashboard
        5. Commit: "chore(phase-{N}): Deprecate - {reason}"
    
    complete:
      description: "Mark phase as complete and move to completed/"
      requirements:
        - "All deliverables verified"
        - "Tests passing"
        - "Dashboard synced"
        - "Cleanup completed via VacuumOrchestrator"
      action: |
        1. Move from active/ to completed/2026/
        2. Update index.yaml (completed_phases_2026)
        3. Regenerate dashboard with completion stats
        4. Commit: "feat(phase-{N}): COMPLETE - {summary}"

  mandatory_hooks:
    setup:
      description: "Run before any phase implementation"
      steps:
        - "Load phase specification"
        - "Verify no conflicting active phases"
        - "Run VacuumOrchestrator.cleanup_stale_artifacts()"
        - "Create git checkpoint (CORE-026)"
        - "Initialize AC_START audit trail (CORE-027)"
      mcp_tool: "cortex_plan_setup"
    
    teardown:
      description: "Run after every phase completion"
      steps:
        - "Verify all deliverables"
        - "Run VacuumOrchestrator.cleanup_phase_artifacts()"
        - "Archive temporary files"
        - "Delete stale markdown (CORE-002 enforcement)"
        - "Update dashboard data"
        - "Regenerate dashboard HTML"
        - "Log AC_COMPLETE audit trail"
        - "Commit all changes"
      mcp_tool: "cortex_plan_teardown"

  # ============================================================================
  # MANDATORY SYNC VERIFICATION (COMPLETION GATE)
  # ============================================================================
  mandatory_sync_verification:
    description: |
      CRITICAL: Phase CANNOT be marked complete until all 3 sources are in sync.
      cortex-architect and all agents MUST verify this before allowing completion.
    
    sources_to_sync:
      source_1:
        name: "Master Plan Registry"
        path: "cortex-registry/_cortex-master/index.yaml"
        checks:
          - "Phase exists in active_phases OR completed_phases"
          - "Phase status matches actual state"
          - "All deliverables marked done"
          - "statistics.total_phases is accurate"
          - "statistics.active_phases is accurate"
          - "statistics.completed_phases is accurate"
      
      source_2:
        name: "CORTEX Live Implementation"
        description: "Actual code/files in the repository"
        checks:
          - "All phase deliverables exist as files"
          - "All tests passing for phase"
          - "No orphaned/incomplete code"
          - "MCP tools registered (if applicable)"
          - "Wiring.yaml updated (if orchestrators added)"
          - "Prompts updated (if mode/behavior changed)"
          - "Agents updated (if routing changed)"
      
      source_3:
        name: "Dashboard HTML"
        path: "cortex-registry/_cortex-master/dashboard/index.html"
        checks:
          - "plan-summary.json reflects index.yaml state"
          - "Dashboard loads without JS errors"
          - "Active phases count matches index.yaml"
          - "Completed phases count matches index.yaml"
          - "Phase details page exists (if applicable)"
          - "All links resolve correctly"
    
    verification_algorithm:
      pre_completion_check: |
        def verify_sync_before_completion(phase_id: str) -> SyncVerificationResult:
            """
            MANDATORY: Called by cortex-architect/agents before marking phase complete.
            Blocks completion if any source is out of sync.
            """
            results = SyncVerificationResult()
            
            # Source 1: Master Plan Registry
            index = load_yaml("cortex-registry/_cortex-master/index.yaml")
            phase = find_phase(index, phase_id)
            results.registry = RegistryCheck(
                phase_exists=phase is not None,
                status_correct=phase.status == "completing",
                deliverables_done=all(d.done for d in phase.deliverables),
                statistics_accurate=verify_statistics(index)
            )
            
            # Source 2: Live Implementation
            results.implementation = ImplementationCheck(
                files_exist=all_files_exist(phase.deliverables),
                tests_passing=run_phase_tests(phase_id),
                no_orphans=check_no_orphaned_code(phase),
                mcp_registered=verify_mcp_tools(phase),
                wiring_updated=verify_wiring_yaml(phase),
                prompts_updated=verify_prompts(phase),
                agents_updated=verify_agents(phase)
            )
            
            # Source 3: Dashboard
            dashboard_json = load_json("cortex-registry/_cortex-master/dashboard/data/plan-summary.json")
            results.dashboard = DashboardCheck(
                json_matches_index=compare_stats(dashboard_json, index),
                html_renders=test_dashboard_render(),
                counts_match=verify_phase_counts(dashboard_json, index),
                links_resolve=verify_all_links()
            )
            
            # Calculate overall sync status
            results.all_synced = (
                results.registry.all_passed() and
                results.implementation.all_passed() and
                results.dashboard.all_passed()
            )
            
            return results
    
    completion_gate:
      rule: |
        Phase completion is BLOCKED unless verify_sync_before_completion() returns all_synced=True.
        
        IF NOT all_synced:
          1. Display sync verification report
          2. List specific failures
          3. Suggest fixes for each failure
          4. HALT completion process
          5. User must fix issues and re-verify
        
        IF all_synced:
          1. Update phase status to "completed"
          2. Move phase YAML to completed/ folder
          3. Update index.yaml statistics
          4. Final dashboard regeneration
          5. Git commit: "feat(phase-{N}): ✅ Complete - {name}"
    
    output_format: |
      ### 🔄 Sync Verification Report
      
      | Source | Status | Details |
      |--------|--------|---------|
      | **Registry** (index.yaml) | {✅/❌} | {pass_count}/{total_checks} |
      | **Implementation** (code) | {✅/❌} | {pass_count}/{total_checks} |
      | **Dashboard** (HTML/JSON) | {✅/❌} | {pass_count}/{total_checks} |
      
      **Overall:** {ALL SYNCED ✅ | OUT OF SYNC ❌}
      
      {IF failures:}
      ### ❌ Sync Failures
      | Source | Check | Issue | Fix |
      |--------|-------|-------|-----|
      | {source} | {check_name} | {issue} | {suggested_fix} |
      
      **BLOCKED:** Cannot mark phase complete until all syncs pass.
      **Action:** Fix issues above and type `/plan verify` to re-check.

  dashboard_integration:
    sync_points:
      - "Phase created"
      - "Phase updated"
      - "Phase completed"
      - "Phase deprecated"
    
    regeneration:
      data_file: "cortex-registry/_cortex-master/dashboard/data/plan-summary.json"
      html_file: "cortex-registry/_cortex-master/dashboard/index.html"
      method: |
        1. Parse index.yaml for all phases
        2. Calculate statistics (total, active, completed)
        3. Generate plan-summary.json with current state
        4. Update dashboard HTML with latest data
        5. Verify dashboard loads correctly
    
    verification:
      - "JSON valid and parseable"
      - "HTML renders without JS errors"
      - "Statistics match actual phase counts"
      - "Links resolve correctly"

