# ============================================================================
# PLAN MODE FLOW SPECIFICATION
# ============================================================================

flow:
  detection:
    diagram: |
      User Request
           ↓
      PRE-FLIGHT CHECK (environment validation)
           ↓
      Intent Detection (IntentRouter)
           ↓
      [CORTEX_CHANGE_DETECTED?]
           ├─ YES → PLAN MODE
           │         ↓
           │   Phase Resolution
           │         ↓
           │   [PHASE_EXISTS?]
           │         ├─ YES → Update existing phase
           │         └─ NO → Create new phase
           │                    ↓
           │   Setup Hook (VacuumOrchestrator + checkpoint)
           │                    ↓
           │   Dashboard Sync (pre-implementation)
           │                    ↓
           │   DoR Display with Phase Context
           │                    ↓
           │   Implementation (TDD via MasterOrchestrator)
           │                    ↓
           │   Teardown Hook (cleanup + archive)
           │                    ↓
           │   Dashboard Sync (post-implementation)
           │                    ↓
           │   Phase Completion (if all deliverables done)
           │                    ↓
           │   Completion Report
           │
           └─ NO → [AUDIT|DESIGN|DIGEST] (existing modes)

  phase_resolution:
    description: "Determine if work aligns with existing phase"
    logic: |
      1. Load _cortex-master/index.yaml
      2. Parse user request for keywords
      3. Match against active_phases[].name
      4. Match against active_phases[].deliverables
      5. If match found: return PHASE_UPDATE
      6. If no match: return PHASE_CREATE
      7. If deletion requested: return PHASE_DEPRECATE

  response_format:
    header: |
      ## 🏗️ CORTEX Architect
      **Author:** Asif Hussain | **Mode:** Plan | **Phase:** {phase_number} | **Operation:** {Create|Update|Complete} ✅
    
    phase_context: |
      ### 📋 Phase Context
      | Field | Value |
      |-------|-------|
      | Phase | {phase_number}: {phase_name} |
      | Status | {PLANNED|IN_PROGRESS|COMPLETING} |
      | Progress | {percentage}% |
      | Deliverables | {completed}/{total} |
      
      **Registry:** cortex-registry/_cortex-master/phases/active/{phase_file}
      **Dashboard:** Auto-sync enabled ✅
    
    setup_report: |
      ### ⚙️ Setup Complete
      - ✅ Git checkpoint created
      - ✅ VacuumOrchestrator cleanup: {files_cleaned} artifacts removed
      - ✅ Audit trail: AC_START logged
      - ✅ Phase specification loaded
    
    teardown_report: |
      ### 🧹 Teardown Complete
      - ✅ VacuumOrchestrator: {files_cleaned} temporary files archived
      - ✅ Dashboard data regenerated
      - ✅ Dashboard HTML verified
      - ✅ Audit trail: AC_COMPLETE logged
      - ✅ Git commit: {commit_hash}
    
    completion_report: |
      ## ✅ Phase {number} Complete
      
      **Delivered:**
      - {deliverable_1}
      - {deliverable_2}
      - {deliverable_3}
      
      **Verified:**
      - Tests: {passing}/{total} passing
      - Dashboard: Synced ✅
      - Cleanup: Complete ✅
      
      ### 📊 Dashboard Status
      | Metric | Before | After |
      |--------|--------|-------|
      | Active Phases | {n} | {n} |
      | Completed Phases | {n} | {n+1} |
      | Total Deliverables | {n} | {n} |
      
      **Registry Updated:** cortex-registry/_cortex-master/index.yaml ✅

