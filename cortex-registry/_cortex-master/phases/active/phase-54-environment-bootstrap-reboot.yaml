rollout_plan:
  
  phase_1_internal_testing:
    duration: "2 days"
    scope: "Test bootstrap on clean Copilot sessions"
    validation: "3 developers validate on fresh environments"
    
  phase_2_staged_rollout:
    duration: "3 days"
    scope: "Enable for 25% of Copilot sessions (feature flag)"
    validation: "Monitor session init times + error rates"
    
  phase_3_full_deployment:
    duration: "2 days"
    scope: "Enable for all sessions, make default"
    validation: "Session init times < 30s for 95% of users"

notes: |
  **Key Insight from chat01.md:**
  
  The session revealed a fundamental architectural paradox:
  - CORTEX has world-class enforcement agents
  - CORTEX has comprehensive governance rules
  - CORTEX has MCP-FIRST architecture documented
  
  **BUT:** None of this runs UNTIL the user triggers an operation.
  
  **The Fix:** Make enforcement EAGER, not LAZY.
  - Bootstrap on session init (not first operation)
  - Validate environment before user asks (not during)
  - Display health status proactively (not reactively)
  
  **Expected Outcome:**
  - Fresh Copilot session → 30s → "CORTEX READY" banner
  - Zero manual dependency installs
  - Zero database initialization commands
  - Zero MCP server confusion
  
  **This is the difference between "powerful but unwired" and "seamlessly integrated."**

