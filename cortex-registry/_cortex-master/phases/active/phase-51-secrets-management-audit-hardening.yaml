# Phase 51: Secrets Management & Audit Trail Hardening
# Authority: CORTEX Enterprise Architecture Analysis (2026-02-08)
# Priority: P0 (Security/Compliance Blocker)
# ROI Score: 0.96 (Critical Impact, Moderate Effort)

metadata:
  phase_id: "phase-51"
  title: "Secrets Management & Audit Trail Hardening"
  version: "1.0"
  created: "2026-02-08"
  status: "planned"
  priority: "P0"
  execution_order: 9
  estimated_duration: "10 days"
  autonomous_execution: false
  approval_required: true
  breaking_changes: false
  production_blocker: true

overview:
  vision: |
    Eliminate secrets from git history and configuration files. Integrate with
    enterprise secrets managers (AWS Secrets Manager, Azure Key Vault, HashiCorp Vault).
    Harden audit trail with immutable append-only logs and cryptographic hash chaining
    for SOX/HIPAA/PCI-DSS compliance.
  
  problem_statement: |
    CURRENT STATE:
    - Individual engineers clone repos with company/domains/ containing sensitive config
    - Git history exposes secrets forever once committed
    - AC markers in code comments can be edited (not tamper-proof)
    - No integration with enterprise secrets management
    
    FAILURE SCENARIO:
    - Junior engineer commits API keys to company/domains/api-config.yaml
    - Keys exposed in git history forever
    - Automated scanners flag repo → security incident → repo locked
    - Audit asks "Who changed PCI-DSS rules on March 15?" → no tamper-proof answer
    
    IMPACT: Security incidents, compliance failures, audit failures, data breaches.
  
  expected_outcomes:
    - ✅ Secrets manager integration (AWS/Azure/Vault)
    - ✅ Zero secrets in git (all external references)
    - ✅ Immutable audit trail (hash-chained, append-only)
    - ✅ Automated secrets scanning (pre-commit hooks)
    - ✅ SOX/HIPAA/PCI-DSS compliant audit logs

roi_analysis:
  cost: 80  # hours
  impact: 98  # prevents security breaches + compliance failures
  risk_mitigation: 99  # eliminates critical vulnerabilities
  roi_score: 0.96
  
  benefits:
    - "Prevents security incidents (credentials exposure)"
    - "Passes SOX/HIPAA/PCI-DSS audit requirements"
    - "Enables automated compliance reporting"
    - "Immutable audit trail for legal defensibility"
  
  trade_offs:
    - "Requires secrets manager setup (AWS/Azure/Vault)"
    - "Adds operational complexity (secrets rotation)"

dependencies:
  requires:
    - "phase-48"  # Registry Isolation (workspace-scoped secrets)
  blocks:
    - "SOX/HIPAA/PCI-DSS certification"
    - "Enterprise security audits"
  
  compatibility:
    individual_devs: "Optional for personal projects, required for production"
    enterprise: "Mandatory for compliance"

stages:
  - id: "S1"
    name: "Secrets Manager Abstraction"
    description: "Unified interface for secrets providers"
    estimated_hours: 8
    test_target: 15
    deliverables:
      - "ISecretsProvider protocol (get, set, rotate, delete)"
      - "SecretsConfig dataclass (provider, endpoint, auth)"
      - "Factory: get_secrets_provider(config) → ISecretsProvider"
      - "Environment-based provider selection"
    acceptance_criteria:
      - "AC-PHASE51-S1-001: ISecretsProvider defines CRUD + rotate"
      - "AC-PHASE51-S1-002: Factory supports AWS/Azure/Vault/Local"
      - "AC-PHASE51-S1-003: Error handling for auth failures"
  
  - id: "S2"
    name: "AWS Secrets Manager Integration"
    description: "AWS Secrets Manager backend"
    estimated_hours: 10
    test_target: 18
    deliverables:
      - "AWSSecretsProvider with boto3"
      - "IAM role authentication (no hardcoded credentials)"
      - "Secret versioning support"
      - "Auto-rotation configuration"
      - "KMS encryption for secrets at rest"
    acceptance_criteria:
      - "AC-PHASE51-S2-001: Retrieve secrets via ARN reference"
      - "AC-PHASE51-S2-002: Rotation triggers on expiration"
      - "AC-PHASE51-S2-003: Audit log tracks all secret access"
  
  - id: "S3"
    name: "Azure Key Vault Integration"
    description: "Azure Key Vault backend"
    estimated_hours: 10
    test_target: 18
    deliverables:
      - "AzureKeyVaultProvider with azure-keyvault-secrets"
      - "Managed identity authentication"
      - "Secret versioning + soft delete"
      - "Access policies (RBAC)"
    acceptance_criteria:
      - "AC-PHASE51-S3-001: Retrieve secrets via Key Vault URI"
      - "AC-PHASE51-S3-002: Soft delete enables 30-day recovery"
      - "AC-PHASE51-S3-003: RBAC enforces least-privilege"
  
  - id: "S4"
    name: "HashiCorp Vault Integration"
    description: "Vault backend for on-prem/hybrid"
    estimated_hours: 10
    test_target: 15
    deliverables:
      - "VaultProvider with hvac library"
      - "AppRole authentication"
      - "Dynamic secrets support"
      - "Lease renewal automation"
    acceptance_criteria:
      - "AC-PHASE51-S4-001: Retrieve secrets via Vault path"
      - "AC-PHASE51-S4-002: Dynamic secrets auto-renew"
      - "AC-PHASE51-S4-003: AppRole tokens rotate automatically"
  
  - id: "S5"
    name: "Git Secrets Scanning & Prevention"
    description: "Block secrets from entering git"
    estimated_hours: 12
    test_target: 20
    deliverables:
      - "Pre-commit hook (detect secrets with truffleHog/gitleaks)"
      - "Pre-receive hook (server-side enforcement)"
      - "GitHub Action workflow (scan PRs)"
      - "Git history scanner (find existing secrets)"
      - "Remediation guide (remove secrets from history)"
    acceptance_criteria:
      - "AC-PHASE51-S5-001: Pre-commit blocks 100% of secret commits"
      - "AC-PHASE51-S5-002: GitHub Action fails PRs with secrets"
      - "AC-PHASE51-S5-003: History scanner finds all leaks"
  
  - id: "S6"
    name: "Configuration Secrets Migration"
    description: "Replace inline secrets with references"
    estimated_hours: 10
    test_target: 12
    deliverables:
      - "Scan company/domains/ for secrets"
      - "Replace secrets with ${SECRET:aws:arn:...} references"
      - "Runtime secret resolution (orchestrators)"
      - "Fallback to .env for local development"
      - "Migration script + validation"
    acceptance_criteria:
      - "AC-PHASE51-S6-001: Zero plaintext secrets in git"
      - "AC-PHASE51-S6-002: All secrets referenced by ARN/URI"
      - "AC-PHASE51-S6-003: Local dev uses .env (not committed)"
  
  - id: "S7"
    name: "Immutable Audit Trail"
    description: "Hash-chained append-only audit log"
    estimated_hours: 12
    test_target: 18
    deliverables:
      - "AuditLogEntry dataclass (timestamp, user, operation, before, after, hash)"
      - "Hash chain: each entry includes hash(previous_entry)"
      - "Append-only storage (S3 with object lock OR blockchain)"
      - "Digital signatures (sign with user's private key)"
      - "Tamper detection (verify hash chain integrity)"
    acceptance_criteria:
      - "AC-PHASE51-S7-001: Audit log immutable (can't edit/delete)"
      - "AC-PHASE51-S7-002: Hash chain detects tampering"
      - "AC-PHASE51-S7-003: Digital signatures verify authenticity"
  
  - id: "S8"
    name: "Compliance Reporting"
    description: "SOX/HIPAA/PCI-DSS audit reports"
    estimated_hours: 8
    test_target: 10
    deliverables:
      - "Audit query API (who changed what when)"
      - "Compliance report generator (SOX/HIPAA/PCI-DSS templates)"
      - "Change timeline visualization"
      - "Access log export (CSV/JSON)"
      - "Retention policies (7 years for SOX)"
    acceptance_criteria:
      - "AC-PHASE51-S8-001: Query returns all changes to specific domain"
      - "AC-PHASE51-S8-002: Compliance reports pass audit review"
      - "AC-PHASE51-S8-003: Retention policy enforced automatically"

testing:
  total_tests: 126
  coverage_target: 95
  test_categories:
    - "Unit: AWS Secrets Manager (20 tests)"
    - "Unit: Azure Key Vault (18 tests)"
    - "Unit: HashiCorp Vault (15 tests)"
    - "Unit: Secrets scanning (25 tests)"
    - "Unit: Audit trail (25 tests)"
    - "Integration: End-to-end secrets flow (15 tests)"
    - "Compliance: SOX/HIPAA/PCI-DSS (8 tests)"
  
  critical_scenarios:
    - "Engineer attempts to commit secret → blocked by pre-commit hook"
    - "Secrets retrieved from AWS during orchestrator initialization"
    - "Audit trail tampered → hash chain verification fails"
    - "Secrets rotated → orchestrators fetch new version automatically"

architecture:
  components:
    - name: "ISecretsProvider"
      responsibility: "Abstract secrets operations"
      methods: ["get", "set", "rotate", "delete", "list"]
    
    - name: "SecretsProviderFactory"
      responsibility: "Create provider based on environment"
      method: "get_provider() → ISecretsProvider"
    
    - name: "AWSSecretsProvider"
      responsibility: "AWS Secrets Manager integration"
      authentication: "IAM roles (no credentials in code)"
    
    - name: "AzureKeyVaultProvider"
      responsibility: "Azure Key Vault integration"
      authentication: "Managed identity"
    
    - name: "VaultProvider"
      responsibility: "HashiCorp Vault integration"
      authentication: "AppRole (short-lived tokens)"
    
    - name: "SecretsScanner"
      responsibility: "Detect secrets in code/config"
      tools: ["truffleHog", "gitleaks", "custom patterns"]
    
    - name: "ImmutableAuditLog"
      responsibility: "Hash-chained audit entries"
      storage: "S3 with object lock OR blockchain ledger"

deployment:
  individual_developers:
    - "Local development: use .env file (not committed)"
    - "Secrets scanning enabled via pre-commit hook"
    - "Optional: use AWS Secrets Manager for personal projects"
  
  enterprise_teams:
    - "Mandatory: integrate with enterprise secrets manager"
    - "Secrets referenced by ARN/URI in company/domains/"
    - "Pre-receive hooks block secrets at server level"
    - "Audit logs exported to compliance SIEM (Splunk/DataDog)"

configuration:
  environment_variables:
    - "SECRETS_PROVIDER: aws|azure|vault|local (default: local)"
    - "AWS_SECRETS_REGION: us-east-1 (for AWS)"
    - "AZURE_KEYVAULT_URL: https://vault.azure.net (for Azure)"
    - "VAULT_ADDR: https://vault.company.com (for Vault)"
    - "AUDIT_LOG_BACKEND: s3|local (default: local)"
  
  example_aws:
    SECRETS_PROVIDER: "aws"
    AWS_SECRETS_REGION: "us-east-1"
    AUDIT_LOG_BACKEND: "s3"
    AUDIT_LOG_BUCKET: "cortex-audit-logs"

risks:
  - risk: "Secrets manager outage → orchestrators can't initialize"
    mitigation: "Local cache of secrets (encrypted), automatic retry with backoff"
    severity: "HIGH"
  
  - risk: "Audit log storage costs (7-year retention)"
    mitigation: "Lifecycle rules move old logs to Glacier, compression"
    severity: "LOW"
  
  - risk: "Pre-commit hooks bypassed (--no-verify flag)"
    mitigation: "Server-side pre-receive hooks enforce at push time"
    severity: "MEDIUM"

success_metrics:
  - "Zero secrets in git history after migration (100%)"
  - "Pre-commit hooks block 100% of secret commits"
  - "Audit trail immutability verified (hash chain validation)"
  - "SOX/HIPAA/PCI-DSS compliance reports pass audit review"
  - "Secrets rotation automated with zero manual intervention"

tags:
  - "secrets-management"
  - "audit-trail"
  - "compliance"
  - "security"
  - "production-critical"
