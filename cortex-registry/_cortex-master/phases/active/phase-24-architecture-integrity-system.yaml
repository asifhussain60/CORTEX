# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================

vision:
  mission: |
    Build a **4-layer Architecture Integrity System** that ensures:
    
    1. **Pre-Implementation Gate:** Validates changes against master plan BEFORE execution
    2. **Runtime Regression Guard:** Monitors for architectural brittleness during execution
    3. **Post-Completion Sync:** Auto-updates phases & dashboard after successful completion
    4. **Architecture Evolution Tracking:** Records all architectural decisions with rationale
    
    Result: **ZERO chance of regression** — Every change validated against master plan.
            **ZERO brittleness** — Architectural patterns enforced at runtime.
            **100% sync** — Master plan always reflects current implementation state.

  key_outcomes:
    - "✅ Pre-Implementation Gate: Blocks changes not aligned with active phases"
    - "✅ Regression Detection: Real-time check against completed phase commitments"
    - "✅ Auto-Phase Creation: User changes auto-create/update master plan phases"
    - "✅ Dashboard Sync: Completed work auto-updates phase status + dashboard"
    - "✅ Brittleness Scanner: Detects architectural anti-patterns during implementation"
    - "✅ Decision Journal: Records all architectural decisions with rationale"
    - "✅ MCP Integration: Full exposure via cortex_validate_architecture tool"

