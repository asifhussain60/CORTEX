# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  risk_1:
    description: "ArchitectureGuard false positives block valid requests"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation: |
      - Whitelist patterns for known-good changes
      - Override mechanism: `/bypass-gate {reason}` (audit logged)
      - Continuous tuning based on false positive rate
  
  risk_2:
    description: "Performance overhead from pre-execution checks"
    likelihood: "LOW"
    impact: "MEDIUM"
    mitigation: |
      - Cache index.yaml in memory (reload every 5 minutes)
      - Async validation (non-blocking UI)
      - Target: <100ms latency for ArchitectureGuard.validate_request()
  
  risk_3:
    description: "Phase YAML format changes break ArchitectureGuard"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation: |
      - Schema validation on YAML load
      - Graceful degradation (warn but don't block)
      - Version compatibility checks

