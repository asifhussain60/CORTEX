# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

current_state:
  gaps:
    gap_001:
      name: "No Pre-Implementation Phase Validation"
      description: |
        cortex-architect can proceed with DESIGN mode without checking if:
        - Request aligns with active phases
        - Request contradicts completed phases
        - New phase needs to be created
      impact: "User can implement changes that diverge from master plan"
      severity: "CRITICAL"
      evidence: "cortex-architect.prompt.md has no 'Check Master Plan' step in DESIGN flow"
    
    gap_002:
      name: "No Architecture Regression Gate"
      description: |
        No validation during execution that changes don't:
        - Violate commitments from completed phases
        - Introduce brittleness (tight coupling, circular dependencies)
        - Break architectural patterns
      impact: "Completed phases can be silently violated"
      severity: "CRITICAL"
      evidence: "No ArchitectureGuard or RegressionGate orchestrator exists"
    
    gap_003:
      name: "No Automatic Phase Creation/Update"
      description: |
        When user requests DESIGN work:
        - No automatic phase creation in _cortex-master/
        - No phase update if work extends existing phase
        - No dashboard sync until manual intervention
      impact: "Master plan becomes stale, dashboard shows outdated data"
      severity: "CRITICAL"
      evidence: "PlanRegistrySyncOrchestrator is reactive, not proactive"
    
    gap_004:
      name: "No Implementation→Phase Sync"
      description: |
        After successful TDD completion:
        - Phase status not auto-updated to 'completed'
        - Dashboard not refreshed with completion data
        - Enhancement-history.yaml not updated
      impact: "Manual toil, drift between implementation & plan"
      severity: "HIGH"
      evidence: "No post-completion hook in TDDOrchestrator"
    
    gap_005:
      name: "cortex-architect Mode Isolation"
      description: |
        Modes defined in prompt but not enforced at orchestrator level:
        - No mode-specific validation logic
        - No clear boundary between AUDIT/DESIGN/DIGEST orchestrators
      impact: "Mode behavior can drift from prompt specification"
      severity: "HIGH"
      evidence: "cortex-architect.md delegates but doesn't enforce mode contracts"
    
    gap_006:
      name: "No Brittleness Detection"
      description: |
        No automated scanning for:
        - Circular dependencies between orchestrators
        - Tight coupling violations
        - Missing abstraction layers
        - Anti-patterns (God objects, feature envy)
      impact: "Technical debt accumulates silently"
      severity: "MEDIUM"
      evidence: "No BrittlenessScanner orchestrator"

---
# ============================================================================
# SOLUTION ARCHITECTURE
# ============================================================================

solution:
  name: "4-Layer Architecture Integrity System"
  layers:
    layer_1:
      name: "Pre-Implementation Gate"
      purpose: "Validate before execution"
      components:
        - "ArchitectureGuard orchestrator"
        - "PhaseAlignmentValidator"
        - "RegressionRiskAnalyzer"
      trigger: "cortex-architect DESIGN mode entry"
      blocking: true
      checks:
        - "Does request align with active phases?"
        - "Does request contradict completed phases?"
        - "Should new phase be created?"
        - "Regression risk score < 0.3?"
      output: "PROCEED | CREATE_PHASE | BLOCK (with explanation)"
    
    layer_2:
      name: "Runtime Regression Guard"
      purpose: "Monitor during execution"
      components:
        - "RegressionMonitor"
        - "BrittlenessScanner"
        - "ArchitecturalPatternValidator"
      trigger: "TDDOrchestrator execution hooks"
      blocking: false
      checks:
        - "Are architectural patterns maintained?"
        - "Are coupling metrics within bounds?"
        - "Are abstraction layers respected?"
        - "Are completed phase commitments honored?"
      output: "Real-time warnings + violation log"
    
    layer_3:
      name: "Post-Completion Sync"
      purpose: "Update master plan after success"
      components:
        - "PhaseCompletionOrchestrator"
        - "DashboardSyncTrigger"
        - "EnhancementHistoryRecorder"
      trigger: "TDDOrchestrator completion (all tests pass)"
      blocking: false
      actions:
        - "Update phase status to 'completed'"
        - "Trigger dashboard data regeneration"
        - "Record in enhancement-history.yaml"
        - "Update index.yaml statistics"
      output: "Phase status updated + dashboard refreshed"
    
    layer_4:
      name: "Architecture Evolution Tracking"
      purpose: "Record all architectural decisions"
      components:
        - "DecisionJournal"
        - "ArchitecturalRationaleCapture"
        - "PatternLibraryUpdater"
      trigger: "Any significant architectural change"
      blocking: false
      records:
        - "Decision: What was decided"
        - "Rationale: Why it was decided"
        - "Alternatives: What was rejected and why"
        - "Impact: Which phases/orchestrators affected"
      output: "Architecture decision records (ADRs)"

