# ============================================================================
# INTEGRATION POINTS
# ============================================================================

integration:
  dashboard_integration:
    file: "cortex-registry/_cortex-master/dashboard/index.html"
    requirements:
      - "Auto-refresh mechanism (poll plan-summary.json every 30 seconds)"
      - "Display phase status changes in real-time"
      - "Show completion timestamps"
      - "Highlight newly completed phases"
      - "Update statistics (total phases, completion rate)"
    data_source: "cortex-registry/_cortex-master/dashboard/data/plan-summary.json"
    sync_trigger: "PhaseCompletionOrchestrator updates plan-summary.json"
    sync_latency: "< 60 seconds from completion to dashboard display"
  
  cortex_architect_prompt:
    file: ".github/prompts/cortex-architect.prompt.md"
    changes:
      - section: "MODE 2: DESIGN"
        line: "~350"
        addition: |
          ## Architecture Integrity Gate (NEW - Phase 24)
          
          **BEFORE Challenge, ALWAYS check master plan alignment:**
          
          ```
          User Request
              ↓
          PRE-FLIGHT CHECK (existing)
              ↓
          [NEW] ARCHITECTURE INTEGRITY GATE
              ├─ Load cortex-registry/_cortex-master/index.yaml
              ├─ Call ArchitectureGuard.validate_request()
              ├─ Check: Aligns with active phases?
              ├─ Check: Contradicts completed phases?
              ├─ Check: Needs new phase creation?
              └─ Calculate: Regression risk score
              ↓
          [PROCEED] → Continue to LENS Context Gathering
              ↓
          [CREATE_PHASE] → Display phase creation template
              ├─ Offer auto-creation (cortex_create_phase tool)
              ├─ Await user approval
              └─ Create phase YAML in _cortex-master/phases/active/
              ↓
          [BLOCK] → Display blocking reasons
              ├─ Show: Conflicting completed phases
              ├─ Show: Regression risk breakdown
              └─ Suggest: Alternative approach or phase modification
          ```
          
          **Phase Alignment Table (MANDATORY DISPLAY):**
          
          | Check | Status | Details |
          |-------|--------|---------|
          | Active Phase Match | ✅/❌ | {phase-21, phase-22, ...} |
          | Completed Phase Conflict | ✅/❌ | {potential violations} |
          | Regression Risk | {score} | {Low/Medium/High} |
          | Verdict | {PROCEED/CREATE_PHASE/BLOCK} | {reasoning} |
          
          **If CREATE_PHASE:**
          - Display suggested phase YAML structure
          - Offer `/create-phase` command (calls cortex_create_phase MCP tool)
          - Await user: "create phase" / "skip" / "manual"
          
          **If BLOCK:**
          - Show conflicting phase details
          - Explain regression risk factors
          - Suggest remediation (modify request, update phase, seek architect review)
          - HALT execution until user resolves conflict
  
  cortex_architect_agent:
    file: ".github/agents/core/cortex-architect.md"
    changes:
      - section: "Master Mode Flow"
        line: "~85"
        addition: |
          [DESIGN Mode] → cortex-designer (+ this agent orchestration)
              ↓
          [NEW] ARCHITECTURE INTEGRITY GATE (Phase 24)
              ├─ Call: ArchitectureGuard.validate_request()
              ├─ Display: Phase Alignment Table
              ├─ Decision: PROCEED | CREATE_PHASE | BLOCK
              └─ If BLOCK: HALT execution, display remediation
              ↓
          LENS Context (existing - only if PROCEED)
  
  tdd_orchestrator:
    file: "cortex/orchestrators/core/tdd_orchestrator.py"
    changes:
      - location: "execute() method - start"
        addition: |
          # Phase 24: Pre-execution regression check
          regression_check = self.regression_monitor.check_completed_phases(context)
          if regression_check.has_violations():
              self.logger.warning(f"Regression warnings: {regression_check.violations}")
      
      - location: "execute() method - end (success path)"
        addition: |
          # Phase 24: Post-completion sync
          if all_tests_passed:
              phase_completion = PhaseCompletionOrchestrator()
              completion_result = phase_completion.complete_phase(
                  phase_id=context.get('phase_id'),
                  completion_data={
                      'files_modified': modified_files,
                      'tests_passed': test_results,
                      'timestamp': datetime.utcnow().isoformat()
                  }
              )
              if completion_result.is_ok():
                  self.logger.info(f"Phase {context.get('phase_id')} marked completed, dashboard synced")
  
  wiring_yaml:
    file: "cortex/wiring/specifications/wiring.yaml"
    additions:
      - |
        # Phase 24: Architecture Integrity System
        - name: "ArchitectureGuard"
          path: "cortex.orchestrators.core.architecture_guard"
          class: "ArchitectureGuard"
          priority: 900  # High priority (runs before DESIGN)
          description: "Pre-implementation validation against master plan"
          mcp_tools:
            - "cortex_validate_architecture"
        
        - name: "BrittlenessScanner"
          path: "cortex.orchestrators.support.brittleness_scanner"
          class: "BrittlenessScanner"
          priority: 500
          description: "Runtime brittleness detection"
        
        - name: "PhaseCompletionOrchestrator"
          path: "cortex.orchestrators.support.phase_completion_orchestrator"
          class: "PhaseCompletionOrchestrator"
          priority: 100  # Low priority (runs after TDD)
          description: "Post-completion master plan sync"

---
# ============================================================================
# MCP TOOLS
# ============================================================================

mcp_tools:
  cortex_validate_architecture:
    name: "cortex_validate_architecture"
    description: "Validate user request against master plan to prevent regression"
    parameters:
      request_description:
        type: "string"
        required: true
        description: "Description of requested change"
      intent_type:
        type: "string"
        required: true
        enum: ["IMPLEMENT", "REFACTOR", "FIX", "DESIGN"]
        description: "Type of change intent"
      scope:
        type: "array"
        items: "string"
        required: false
        description: "Affected files/orchestrators"
    returns:
      verdict:
        type: "string"
        enum: ["PROCEED", "CREATE_PHASE", "BLOCK"]
      phase_alignment:
        type: "object"
        properties:
          active_phases: ["phase-21", "phase-22"]
          conflicts: []
          regression_risk: 0.15
      reasoning:
        type: "string"
      suggested_phase:
        type: "object"  # Only if verdict = CREATE_PHASE
    example: |
      Input: {
        "request_description": "Refactor MasterOrchestrator to use async/await",
        "intent_type": "REFACTOR",
        "scope": ["cortex/orchestrators/core/master_orchestrator.py"]
      }
      Output: {
        "verdict": "CREATE_PHASE",
        "phase_alignment": {
          "active_phases": ["phase-21", "phase-22"],
          "conflicts": [],
          "regression_risk": 0.2
        },
        "reasoning": "Async refactor is significant architectural change, should be tracked as phase-25",
        "suggested_phase": {
          "id": "phase-25",
          "title": "Async MasterOrchestrator Refactor",
          "priority": "P1",
          "estimated_effort": "3 days"
        }
      }
  
  cortex_create_phase:
    name: "cortex_create_phase"
    description: "Auto-create new phase YAML in _cortex-master/phases/active/"
    parameters:
      phase_data:
        type: "object"
        required: true
        properties:
          title: "string"
          description: "string"
          priority: "string (P0/P1/P2/P3)"
          estimated_effort: "string"
    returns:
      phase_id: "string"
      file_path: "string"
      status: "created"
    example: |
      Input: {
        "phase_data": {
          "title": "Async MasterOrchestrator Refactor",
          "description": "Convert MasterOrchestrator to async/await pattern",
          "priority": "P1",
          "estimated_effort": "3 days"
        }
      }
      Output: {
        "phase_id": "phase-25",
        "file_path": "cortex-registry/_cortex-master/phases/active/phase-25-async-master-refactor.yaml",
        "status": "created"
      }
  
  cortex_scan_brittleness:
    name: "cortex_scan_brittleness"
    description: "Scan codebase for architectural brittleness patterns"
    parameters:
      scope:
        type: "array"
        items: "string"
        required: false
        description: "Files to scan (default: all orchestrators)"
    returns:
      brittleness_score: "float (0-1.0)"
      violations:
        type: "array"
        items:
          type: "string"
          pattern: "string"
          severity: "string"
          file: "string"
          line: "integer"
    example: |
      Output: {
        "brittleness_score": 0.35,
        "violations": [
          {
            "type": "CIRCULAR_DEPENDENCY",
            "pattern": "MasterOrchestrator → IntentRouter → MasterOrchestrator",
            "severity": "HIGH",
            "file": "cortex/orchestrators/core/intent_router.py",
            "line": 145
          },
          {
            "type": "TIGHT_COUPLING",
            "pattern": "TDDOrchestrator directly imports 8 orchestrators",
            "severity": "MEDIUM",
            "file": "cortex/orchestrators/core/tdd_orchestrator.py",
            "line": 20
          }
        ]
      }

