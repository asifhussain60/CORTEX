    - "Restore _workspaces/cortex-architecture/ from git history"
    - "Roll back docs/ folder to previous commit"
    - "Investigate validation failures"
    - "Fix issues in development branch"
    - "Re-run Phase 74 from failing stage"

notes: |
  Phase 74 represents a strategic shift in CORTEX documentation delivery:
  
  **Key Design Decisions:**
  1. **Option C Hybrid Structure** — Balances stakeholder needs (guides/) with technical depth (architecture/)
  2. **Delta Intelligence** — Git-aware regeneration prevents full rebuild waste (80% time savings)
  3. **Embedded Design System** — Zero external dependencies ensures long-term maintainability
  4. **Source Deletion** — HTML becomes single source of truth (prevents markdown/HTML drift)
  5. **6-Tier Validation** — Production-ready quality gate (Lighthouse >90, WCAG AA)
  
  **Future Phases Enabled:**
  - Phase 75: Documentation versioning (v1.0, v2.0 support)
  - Phase 76: Search analytics + user tracking (understand documentation usage)
  - Phase 77: Multi-language support (i18n for global teams)
  
  **Maintenance Model:**
  - Content changes: Edit HTML directly in docs/ (not markdown)
  - Design changes: Update embedded design system in agent spec
  - New pages: Run documentation builder with new markdown source
  - Delta updates: Automatic detection + incremental rebuild
  
  **Success Metrics:**
  - Build time: <10 seconds for typical change (3-5 pages)
  - Full rebuild: <45 seconds (baseline: 45 seconds)
  - Page load: <2.5s LCP, <0.1 CLS
  - Accessibility: WCAG AA compliant, Lighthouse >90
  - User engagement: Track via Phase 76 analytics
