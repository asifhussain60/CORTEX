overview:
  vision: |
    Transform CORTEX documentation from 47 markdown files into a production-ready
    multi-stakeholder web portal hosted on GitHub Pages with:
    
    1. **Multi-Role Navigation** — Business/Product/Engineering entry paths with adaptive depth
    2. **Glassmorphism Design v4.0.0** — Dark blue theme with glass panels, responsive mobile-first
    3. **Intelligent D3.js Diagrams** — 8 diagram types auto-generated from markdown metadata
    4. **Delta Detection Intelligence** — Git-aware regeneration (only rebuild changed content)
    5. **Structure Enforcement** — Mandatory cleanup with nested folder hierarchy validation
    6. **6-Tier Validation Pipeline** — HTML5, CSS, JS, Typography, Accessibility, Performance
    7. **GitHub Pages Compatibility** — Relative paths, asset optimization, CSP headers
    8. **Source Cleanup** — Delete markdown source after successful validation (HTML becomes SSOT)
    
    Strategic Outcome:
    - Unified documentation portal replacing scattered markdown files
    - Role-based entry (business stakeholders see value, engineers see architecture)
    - Incremental builds (5-10 second updates vs 45 second full regeneration)
    - Production-ready hosting (GitHub Pages with zero config)
    - Self-documenting (content changes trigger automatic site updates)

  problem_statement: |
    Current documentation state has strong content (_workspaces/cortex-architecture/47 files)
    but lacks production-ready delivery mechanism:
    
    **Gap 1: No Stakeholder Navigation**
    - 47 markdown files organized by technical domain (orchestration/, lens/, mcp/)
    - Business users cannot find "What can CORTEX do for me?"
    - Product managers cannot see feature roadmap
    - Engineers face 11,600 lines of flat markdown
    
    **Gap 2: Static Content (No Diagrams)**
    - Markdown describes architecture but lacks visual representation
    - No interactive diagrams showing orchestrator relationships
    - Cannot visualize data flow, request lifecycle, deployment topology
    
    **Gap 3: Full Regeneration Required**
    - No incremental build capability (all-or-nothing)
    - Phase 75 content change requires regenerating all 47 HTML pages
    - Wastes CI/CD time (45+ seconds per build)
    
    **Gap 4: No Structure Enforcement**
    - No folder hierarchy validation
    - Risk of orphaned files (not linked from navigation)
    - Broken internal links possible
    - Nesting depth unlimited (hard to navigate)
    
    **Gap 5: No Source of Truth Clarity**
    - Markdown AND HTML coexist (which is canonical?)
    - Developers might edit markdown expecting docs to update
    - Drift risk between source and generated output
    
    **Gap 6: GitHub Pages Compatibility Unknown**
    - No validation for relative paths
    - Asset loading not tested on GitHub CDN
    - CSP headers may conflict with GitHub Pages

  success_criteria:
    - "47 HTML pages generated from _workspaces/cortex-architecture/ markdown (zero content modification)"
    - "8 D3.js diagram types working responsively (force-directed, tree, Sankey, timeline, packed circles, flow, sunburst, network)"
    - "Delta detection functional (detect 3 markdown changes → regenerate only 3 HTML pages)"
    - "Folder structure validated (Option C hybrid: guides/, architecture/, capabilities/, deployment/)"
    - "360 tests passing (40 build + 50 agent + 60 portal + 80 content + 60 diagrams + 50 validation + 20 cleanup)"
    - "Lighthouse score >90, WCAG AA compliant, Web Vitals: LCP <2.5s, CLS <0.1"
    - "GitHub Pages test deployment successful (site accessible at https://{owner}.github.io/{repo}/)"
    - "_workspaces/cortex-architecture/ deleted after successful validation"
    - "Search index generated from final HTML output (full-text search functional)"

