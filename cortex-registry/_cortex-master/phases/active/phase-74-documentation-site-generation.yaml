      - "AC-PHASE74-S7-004: WCAG AA compliant (keyboard nav + screen reader tested)"
      - "AC-PHASE74-S7-005: No debug code in production (console.log removed)"
      - "AC-PHASE74-S7-006: 40 tests passing (compatibility + performance + a11y + deployment)"

  - stage_id: "S8"
    name: "Structure Cleanup & Source Deletion"
    duration: "2 days"
    effort_hours: 8
    status: "planned"
    description: |
      Mandatory structure validation and source markdown deletion after successful generation.
      
      Deliverables:
      1. cortex/documentation/structure_validator.py
         - StructureValidator class with folder hierarchy enforcement
         - Cleanup script removing orphaned files, fixing broken links
         - Navigation breadcrumb generator (automatic from folder hierarchy)
      
      2. Folder structure validation rules
         - Rule 1: No files in docs/ root (except index.html)
         - Rule 2: Max nesting depth = 3 levels (docs/architecture/orchestration/tdd.html)
         - Rule 3: No orphaned files (all HTML linked from navigation)
         - Rule 4: No broken internal links (all cross-references valid)
         - Rule 5: Approved hierarchy only (guides/, architecture/, capabilities/, deployment/)
      
      3. Source deletion gate
         - Verify all 47 HTML pages exist and pass validation
         - Verify GitHub Pages test deployment successful
         - Delete _workspaces/cortex-architecture/ folder
         - Update documentation references (README.md, CONTRIBUTING.md)
      
      4. Documentation updates
         - README.md: Update links to point to GitHub Pages site
         - CONTRIBUTING.md: Document HTML-first workflow (no markdown editing)
         - docs/README.md: Add maintenance guide for documentation site
      
      5. Tests (30 tests)
         - Structure validation (10 tests)
         - Orphan detection (5 tests)
         - Link validation (5 tests)
         - Deletion gate (5 tests)
         - Documentation updates (5 tests)
      
      Risks & Mitigations:
      - Risk: Premature deletion (source deleted before validation passes)
        Mitigation: Strict gate enforcement, require explicit approval
      - Risk: No rollback path (markdown deleted, HTML broken)
        Mitigation: Git commit before deletion, easy revert
    
    acceptance_criteria:
      - "AC-PHASE74-S8-001: Zero files in docs/ root (except index.html)"
      - "AC-PHASE74-S8-002: Max nesting depth = 3 levels (validated)"
      - "AC-PHASE74-S8-003: Zero orphaned files (all linked from navigation)"
      - "AC-PHASE74-S8-004: Zero broken internal links (all cross-references valid)"
      - "AC-PHASE74-S8-005: _workspaces/cortex-architecture/ deleted (after validation passes)"
      - "AC-PHASE74-S8-006: Documentation updated (README.md, CONTRIBUTING.md, docs/README.md)"
      - "AC-PHASE74-S8-007: 30 tests passing (structure + orphans + links + deletion + docs)"

