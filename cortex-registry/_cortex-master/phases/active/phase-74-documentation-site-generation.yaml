stages:
  - stage_id: "S0"
    name: "Git-Aware Build Infrastructure"
    duration: "3 days"
    effort_hours: 12
    status: "planned"
    description: |
      Create incremental build engine with SHA-256 content hashing for efficient regeneration.
      
      Deliverables:
      1. cortex/documentation/builder.py
         - DocumentationBuilder class with incremental build logic
         - SHA-256 content hashing per markdown file
         - Dependency tracking (shared templates, CSS, JS)
         - Manifest generation (docs/_manifest.json)
      
      2. cortex/documentation/manifest.py
         - Manifest schema (version, build_date, files[], dependencies[])
         - Validation logic (manifest integrity checks)
         - Cache invalidation rules (git SHA, file mtime, template changes)
      
      3. cortex/documentation/search_indexer.py
         - Post-build search index generator
         - Full-text indexing from generated HTML
         - Lunr.js compatible output (docs/assets/search-index.json)
      
      4. Tests (40 total)
         - Build script correctness (10 tests)
         - Cache invalidation (10 tests)
         - Manifest integrity (10 tests)
         - Search indexing (10 tests)
      
      Risks & Mitigations:
      - Risk: Cache invalidation bugs (stale content served)
        Mitigation: Conservative invalidation (regenerate on doubt), extensive tests
      - Risk: Shared template changes not detected (partial regeneration)
        Mitigation: Dependency graph tracking, invalidate all on template change
    
    acceptance_criteria:
      - "AC-PHASE74-S0-001: DocumentationBuilder runs on 47 markdown files → generates 47 HTML pages"
      - "AC-PHASE74-S0-002: Change 1 markdown file → only 1 HTML regenerated (not all 47)"
      - "AC-PHASE74-S0-003: Manifest tracks all files with SHA-256 hashes"
      - "AC-PHASE74-S0-004: Search index generated with full-text search working"
      - "AC-PHASE74-S0-005: Cache survives git checkout/branch switch (SHA-based)"
      - "AC-PHASE74-S0-006: 40 tests passing (build + cache + manifest + search)"

  - stage_id: "S1"
    name: "Delta Detection Intelligence"
    duration: "3 days"
    effort_hours: 12
    status: "planned"
    description: |
      Implement intelligent change detection beyond file-level granularity.
      
      Deliverables:
      1. cortex/documentation/delta_detector.py
         - DeltaDetector class with git diff analysis
         - Functionality tracking (new/deprecated orchestrators, tools, phases)
         - Cross-reference analysis (which pages mention changed features)
         - Regeneration rules engine (content/functionality/dependency deltas)
      
      2. Integration with CORTEX registry
         - cortex-registry/_cortex-master/index.yaml monitoring (new phases)
         - cortex/mcp/tools/catalog.py monitoring (tool changes)
         - cortex/wiring/specifications/*.yaml monitoring (orchestrator changes)
      
      3. Delta reporting
         - Detailed report generation (changed markdown, new features, deprecated)
         - Affected pages calculation (which HTML needs rebuild)
         - Time savings estimation (incremental vs full rebuild)
      
      4. Tests (40 tests)
         - Git diff parsing (10 tests)
         - Registry comparison (10 tests)
         - Cross-reference detection (10 tests)
         - False positive prevention (10 tests)
      
      Risks & Mitigations:
      - Risk: False negatives (miss changes requiring regeneration)
        Mitigation: Conservative detection, regenerate on ambiguity
      - Risk: Performance overhead (delta detection slower than full rebuild)
        Mitigation: Parallel git operations, cache registry comparisons
    
    acceptance_criteria:
      - "AC-PHASE74-S1-001: Detect 3 markdown changes → regenerate only affected pages"
      - "AC-PHASE74-S1-002: Detect new orchestrator → regenerate orchestration/* + index"
      - "AC-PHASE74-S1-003: Detect deprecated tool → regenerate tool catalog + cross-refs"
      - "AC-PHASE74-S1-004: Shared template change → regenerate all pages"
      - "AC-PHASE74-S1-005: Delta report accurate (time savings ≥80% vs full rebuild)"
      - "AC-PHASE74-S1-006: 40 tests passing (delta detection accuracy)"

