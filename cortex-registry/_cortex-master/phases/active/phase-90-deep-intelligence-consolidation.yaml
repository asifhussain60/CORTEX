# ============================================================================

risk_analysis:
  technical_risks:
    - risk: 'Knowledge graph performance degradation at scale'
      probability: 'LOW'
      impact: 'MEDIUM'
      mitigation: 'SQLite FTS5 with indexes, <500ms query budget, fallback to simpler queries'
      
    - risk: 'Roslyn/.NET integration complexity'
      probability: 'MEDIUM'
      impact: 'LOW'
      mitigation: 'Use existing dotnet_analyzer.py foundation, incremental C# feature additions'
      
    - risk: 'Multi-tenancy isolation leaks'
      probability: 'LOW'
      impact: 'HIGH'
      mitigation: 'P0 security tests, tenant_id validation at all boundaries, audit logging'
  
  schedule_risks:
    - risk: '18-24 day estimate exceeded'
      probability: 'MEDIUM'
      impact: 'MEDIUM'
      mitigation: 'Staged rollout: S1 (P0) → Production, S2/S3 deferred if needed'
      
    - risk: 'Test suite expansion slows CI/CD'
      probability: 'LOW'
      impact: 'LOW'
      mitigation: 'Already 2.9x parallel speedup, target maintained with 420 new tests'
  
  architectural_risks:
    - risk: 'Facade pattern adds abstraction overhead'
      probability: 'VERY LOW'
      impact: 'VERY LOW'
      mitigation: 'Facade is thin wrapper, <5% overhead measured in similar patterns'
      
    - risk: 'Breaking existing LENS callers'
      probability: 'VERY LOW'
      impact: 'HIGH'
      mitigation: 'Backward compatibility: LENSOrchestrator unchanged, facade is additive'

