## 🎯 MISSION

Create an ASK mode that provides **implementation-truth-based** education about CORTEX architecture, engaging users progressively through intelligent interaction patterns with numbered next-step suggestions.

**Core Principles:**
1. **Implementation Truth** - ALWAYS verify live code, never rely on documentation
2. **Progressive Disclosure** - Meet users where they are, guide them deeper
3. **Intelligent Interaction** - Use InteractionOrchestrator + ChallengeEngine for engagement
4. **Numbered Options** - Every response ends with 3-5 intelligent next steps
5. **Fault Detection** - Identify implementation issues early with recommendations

---

