## 📝 NOTES

### Design Decisions
1. **Why separate ASK mode?**
   - AUDIT = autonomous scan (no user context)
   - DESIGN = enhanced request (user wants to build)
   - ASK = educational (user wants to learn)

2. **Why implementation truth?**
   - Docs drift, code is reality
   - Builds trust through verification
   - Identifies issues early

3. **Why numbered options?**
   - Reduces cognitive load
   - Guides exploration naturally
   - Tracks user journey

4. **Why progressive disclosure?**
   - Meets users where they are
   - Prevents information overload
   - Encourages deeper learning

### Risk Mitigation
- **Risk:** Verification overhead slows responses
  - **Mitigation:** Cache verification results, async checking

- **Risk:** Options too generic/unhelpful
  - **Mitigation:** Context-aware generation, user feedback loop

- **Risk:** Over-correction confuses users
  - **Mitigation:** Gentle corrections, evidence-based explanations

