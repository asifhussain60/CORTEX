## 📊 RESPONSE FORMAT

### ASK Mode Response Template
```markdown
## 🧠 CORTEX ASK
**Author:** Asif Hussain | **Mode:** Educational | **Level:** {Beginner|Intermediate|Advanced} ✅

---

### {Question Title}

**Implementation Reality:**
{verified information from live code}

**Evidence:**
- File: `{file_path}` (lines {start}-{end})
- Wiring: `{wiring.yaml reference}`
- Tests: `{test file coverage}`

**{Detailed Explanation}**

{Progressive disclosure based on knowledge level}

---

### ⚠️ Detected Issues (Optional)
{If implementation drift or issues found}

**Issue:** {description}
**Recommendation:** {how to fix}
**Priority:** {P0|P1|P2}

---

### 🔮 Next Steps

Choose an option to continue learning:

1. **{Deeper Dive}** - {description}
2. **{Related Concept}** - {description}
3. **{Practical Example}** - {description}
4. **{Common Pitfall}** - {description}
5. **{Advanced Topic}** - {description}

*Tip: {contextual suggestion based on user's path}*
```

