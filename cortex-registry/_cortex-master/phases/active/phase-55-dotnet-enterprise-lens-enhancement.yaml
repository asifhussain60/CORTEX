notes: |
  **Dry-Run Findings for Enterprise .NET Monoliths:**
  
  **WHAT CURRENT LENS CAPTURES:**
  ✅ C# file structure (classes, methods via CSharpAdapter)
  ✅ Git history (commits, authors, patterns)
  ✅ Config files security (Web.config, App.config)
  ✅ Basic PackageReference parsing (regex in .csproj)
  ✅ Comment extraction (TODOs, docstrings)
  
  **WHAT CURRENT LENS MISSES:**
  ❌ Solution architecture (main .sln structure invisible)
  ❌ Inter-project dependencies (can't map cross-segment references)
  ❌ Centralized package versions (Directory.Packages.props ignored)
  ❌ Database projects (20+ .sqlproj files unrecognized)
  ❌ EF migration history (schema evolution timeline missing)
  ❌ Azure DevOps pipelines (CI/CD configuration hidden)
  ❌ WCF services (endpoint catalog incomplete)
  ❌ Multi-solution architecture (can't identify segment boundaries)
  
  **Business Value of This Enhancement:**
  1. **Complete Repository Intelligence:** >90% coverage for .NET monoliths
  2. **Security Improvement:** Accurate transitive dependency vulnerability detection
  3. **Migration Planning:** Service catalog + dependency graph for decomposition
  4. **Developer Onboarding:** Visual architecture diagrams for faster ramp-up
  5. **Compliance:** Database schema tracking for audit trails
  6. **DevOps Maturity:** CI/CD pipeline analysis for process improvement
  
  **Post-Implementation: Enterprise Monolith Onboarding Should Produce:**
  - Solution dependency graph (300+ projects mapped)
  - Service catalog (WCF endpoints + REST APIs)
  - Database schema inventory (20+ databases documented)
  - EF migration timeline (schema evolution tracked)
  - Azure DevOps maturity score (CI/CD assessment)
  - Package vulnerability report (including transitive dependencies)
  - Architecture visualization (Mermaid diagram embedded)

