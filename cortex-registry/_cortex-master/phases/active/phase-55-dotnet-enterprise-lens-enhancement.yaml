---
# Phase 55: .NET Enterprise LENS Enhancement
# Comprehensive .NET monolith onboarding capabilities

phase_id: PHASE-55
title: ".NET Enterprise LENS Enhancement"
category: lens-enhancement
priority: P1-HIGH
status: proposed
created_date: 2026-02-08
owner: CORTEX Architecture Team

problem_statement: |
  DRY-RUN DISCOVERY: Repository onboarding for enterprise .NET monolith repositories reveals
  significant gaps in LENS's .NET enterprise analysis capabilities.
  
  **Typical Enterprise .NET Monolith Characteristics:**
  - 300+ .csproj files (massive solution with multiple segments/bounded contexts)
  - MSBuild-based build system with complex dependency chains
  - 20+ Database projects with SQL Server schemas
  - Multi-solution architecture (Main.sln, Financial.slnf, Services.slnf, etc.)
  - Azure DevOps pipelines for CI/CD
  - WCF services + ASP.NET endpoints
  - Entity Framework migrations across multiple contexts
  - Directory.Build.props/Directory.Packages.props centralized package management
  - NuGet package ecosystem with private feeds
  
  **Current LENS Capabilities (WHAT WORKS):**
  ✅ C# AST parsing (via CSharpAdapter + tree-sitter)
  ✅ Basic .csproj PackageReference parsing (regex-based)
  ✅ Basic packages.config parsing (XML-based)
  ✅ Config security scanning (Web.config, App.config)
  ✅ Git history analysis (language-agnostic)
  ✅ Database schema detection (basic)
  
  **Current LENS Gaps (WHAT FAILS):**
  ❌ Solution file (.sln) parsing — no project dependency graphs
  ❌ MSBuild project references — can't map inter-project dependencies
  ❌ Directory.Build.props/Directory.Packages.props — centralized package versions ignored
  ❌ Solution filters (.slnf) — subset solution detection
  ❌ Azure DevOps pipelines — CI/CD analysis missing
  ❌ WCF service contracts — endpoint discovery incomplete
  ❌ Entity Framework migrations — schema evolution tracking absent
  ❌ Database project analysis — SQL Server schema projects unrecognized
  ❌ Multi-solution architecture — can't map segment boundaries
  ❌ NuGet.Config — private feed detection missing
  ❌ Transitive dependency resolution — can't detect indirect vulnerabilities
  ❌ Build configuration analysis — Debug/Release differences hidden
  
  **Business Impact:**
  - Repository onboarding for enterprise .NET monoliths produces incomplete dashboards
  - Security analysis misses transitive vulnerabilities (CRITICAL for compliance)
  - Architecture understanding fragmentary (can't trace cross-project dependencies)
  - Migration planning incomplete (missing EF schema evolution data)
  - Developer onboarding hampered (no solution architecture visualization)

objectives:
  - Implement .sln parser to extract project dependency graphs
  - Add MSBuild analyzer for ProjectReference resolution
  - Enhance DependencyAnalyzer for Directory.Build.props/Directory.Packages.props
  - Add Azure DevOps pipeline analyzer
  - Implement WCF service contract analyzer
  - Add Entity Framework migration analyzer
  - Create SQL Server database project analyzer
  - Build solution architecture visualizer
  - Expose all new analyzers via RepositoryOnboardingOrchestrator
  - Achieve >90% coverage for enterprise .NET monolith repositories

root_cause_analysis:
  
  gap_1_solution_file_parsing:
    symptom: "No awareness of solution-level structure (.sln files ignored)"
    evidence:
      - "Enterprise monoliths typically have main solution files with 100+ projects"
      - "LENS currently treats each .csproj independently"
      - "Can't identify solution filters (.slnf) for subset builds"
    root_cause: "No .sln parser implemented — treated as text files"
    impact: "Can't generate solution dependency graphs or architecture diagrams"
    
  gap_2_msbuild_project_references:
    symptom: "ProjectReference elements not resolved to create dependency graph"
    evidence:
      - "DependencyAnalyzer only parses PackageReference"
      - "Can't identify which projects depend on which internal projects"
      - "Cross-segment dependencies invisible (e.g., ServiceLayer → DataLayer)"
    root_cause: "No MSBuild project reference resolver"
    impact: "Can't perform impact analysis or layered architecture validation"
    
  gap_3_centralized_package_management:
    symptom: "Directory.Build.props and Directory.Packages.props ignored"
    evidence:
      - "Enterprise monoliths typically use Directory.Packages.props for centralized versions"
      - "DependencyAnalyzer looks for versions in .csproj only"
      - "Actual package versions come from parent directory props"
    root_cause: "DependencyAnalyzer doesn't traverse MSBuild property hierarchy"
    impact: "Incorrect vulnerability detection (wrong versions reported)"
    
  gap_4_database_project_analysis:
    symptom: "Database/*.sqlproj files not recognized as database projects"
    evidence:
      - "Enterprise monoliths typically have 20+ database projects"
      - "Each contains SQL Server schema definitions"
      - "DatabaseAnalyzer only looks for migration folders"
    root_cause: "No SQL Server database project (.sqlproj) analyzer"
    impact: "Database schema inventory incomplete"
    
  gap_5_ef_migration_tracking:
    symptom: "Entity Framework migrations not tracked or analyzed"
    evidence:
      - "Enterprise monoliths often have multiple bounded contexts with EF migrations"
      - "No timeline of schema changes extracted"
      - "Can't identify migration conflicts or rollback risks"
    root_cause: "DatabaseAnalyzer doesn't parse EF migration files"
    impact: "Schema evolution history invisible"
    
  gap_6_azure_devops_pipelines:
    symptom: "Azure DevOps YAML pipelines not analyzed"
    evidence:
      - "Enterprise monoliths typically have azure-pipelines.yml with deployment stages"
      - "Build/test/deploy steps not extracted"
      - "CI/CD configuration gaps not identified"
    root_cause: "No Azure DevOps pipeline analyzer"
    impact: "DevOps maturity assessment incomplete"
    
  gap_7_wcf_service_discovery:
    symptom: "WCF service contracts not detected or cataloged"
    evidence:
      - "Enterprise monoliths commonly use WCF endpoints for service layer"
      - "APIAnalyzer only understands REST APIs"
      - "Service contracts (.svc, [ServiceContract]) not extracted"
    root_cause: "APIAnalyzer doesn't support WCF/SOAP services"
    impact: "Service inventory incomplete for monolith decomposition planning"

stages:
  
  s1_solution_file_parser:
    name: "Solution File (.sln) Parser"
    description: |
      Implement SolutionFileParser to extract:
      - Project list with GUIDs and paths
      - Solution folders (logical grouping)
      - Project configurations (Debug, Release)
      - Solution-level properties
      - Solution filters (.slnf) for subset solutions
      
      Output Format:
      {
        "solution_name": "Enterprise.sln",
        "projects": [
          {"name": "ConsoleApp", "path": "Apps/ConsoleApp/ConsoleApp.csproj", "guid": "..."},
          {"name": "CoreLibrary", "path": "Libs/CoreLibrary/CoreLibrary.csproj", "guid": "..."}
        ],
        "solution_folders": ["Apps", "Libs", "Tests"],
        "configurations": ["Debug|AnyCPU", "Release|AnyCPU"]
      }
    
    acceptance_criteria:
      - "Parses Visual Studio 2017-2022 .sln format"
      - "Extracts all ProjectReference entries with GUIDs"
      - "Identifies solution folders and nested projects"
      - "Handles solution filters (.slnf) for subset builds"
      - "Performance: <1s for 100+ project solutions"
    
    tests:
      - test_solution_parser_extracts_projects
      - test_solution_parser_handles_solution_folders
      - test_solution_parser_parses_configurations
      - test_solution_parser_handles_solution_filters
      - test_solution_parser_performance_100_projects
      - test_solution_parser_invalid_format_handling
      - test_solution_parser_unicode_project_names
    
    test_count: 7
    
  s2_msbuild_dependency_resolver:
    name: "MSBuild ProjectReference Dependency Resolver"
    description: |
      Enhance DependencyAnalyzer to resolve ProjectReference elements:
      - Parse .csproj for <ProjectReference Include="..."/> elements
      - Build project-to-project dependency graph
      - Detect circular dependencies (build errors)
      - Identify layered architecture violations
      - Resolve relative paths to absolute project paths
      
      Output Format:
      {
        "project_dependencies": {
          "ConsoleApp.csproj": ["CoreLibrary.csproj", "DataAccess.csproj"],
          "CoreLibrary.csproj": ["SharedControls.csproj"]
        },
        "dependency_graph": {
          "nodes": [{"id": "ConsoleApp", "type": "app"}],
          "edges": [{"from": "ConsoleApp", "to": "CoreLibrary"}]
        },
        "circular_dependencies": [],
        "layer_violations": []
      }
    
    acceptance_criteria:
      - "Resolves relative ProjectReference paths to absolute"
      - "Builds transitive dependency graph (project A → B → C)"
      - "Detects circular dependencies"
      - "Identifies layer violations (e.g., Data → UI)"
      - "Performance: <5s for 345+ projects"
    
    tests:
      - test_msbuild_resolver_parses_project_references
      - test_msbuild_resolver_resolves_relative_paths
      - test_msbuild_resolver_builds_dependency_graph
      - test_msbuild_resolver_detects_circular_deps
      - test_msbuild_resolver_identifies_layer_violations
      - test_msbuild_resolver_handles_missing_projects
      - test_msbuild_resolver_performance_345_projects
    
    test_count: 7
    
  s3_centralized_package_management:
    name: "Directory.Build.props/Directory.Packages.props Support"
    description: |
      Enhance DependencyAnalyzer to:
      - Detect Directory.Build.props in parent directories
      - Parse Directory.Packages.props for centralized package versions
      - Merge package versions from hierarchy (local overrides parent)
      - Extract MSBuild properties ($(TargetFramework), $(Configuration))
      - Resolve package version variables
      
      Priority: HIGH (impacts vulnerability detection accuracy)
      
      Output Format:
      {
        "centralized_packages": {
          "Newtonsoft.Json": "13.0.1",
          "Microsoft.EntityFrameworkCore": "6.0.8"
        },
        "directory_build_props": {
          "TargetFramework": "net6.0",
          "LangVersion": "10.0"
        },
        "package_sources": [
          {"name": "nuget.org", "url": "https://api.nuget.org/v3/index.json"},
          {"name": "DevOne", "url": "https://pkgs.dev.azure.com/..."}
        ]
      }
    
    acceptance_criteria:
      - "Traverses directory hierarchy to find Directory.Build.props"
      - "Parses Directory.Packages.props XML for PackageVersion elements"
      - "Merges versions (local .csproj overrides parent props)"
      - "Detects NuGet.Config for private feed configuration"
      - "Handles MSBuild property expansion $(PropertyName)"
    
    tests:
      - test_centralized_packages_detects_directory_packages_props
      - test_centralized_packages_merges_hierarchy
      - test_centralized_packages_local_overrides_parent
      - test_centralized_packages_parses_nuget_config
      - test_centralized_packages_expands_msbuild_properties
      - test_centralized_packages_handles_missing_props
    
    test_count: 6
    
  s4_database_project_analyzer:
    name: "SQL Server Database Project (.sqlproj) Analyzer"
    description: |
      Add DatabaseProjectAnalyzer to DatabaseAnalyzer:
      - Detect .sqlproj files (SQL Server Database Projects)
      - Extract schema objects (tables, views, stored procedures)
      - Parse pre-deployment and post-deployment scripts
      - Identify database references (cross-database dependencies)
      - Extract database properties (collation, compatibility level)
      
      Output Format:
      {
        "database_projects": [
          {
            "name": "EnterpriseArchive",
            "path": "Database/EnterpriseArchive/EnterpriseArchive.sqlproj",
            "tables": ["dbo.Users", "dbo.Claims"],
            "stored_procedures": ["dbo.usp_ProcessClaim"],
            "views": ["dbo.vw_ActiveUsers"],
            "database_references": ["DatabaseVersion"]
          }
        ]
      }
    
    acceptance_criteria:
      - "Detects .sqlproj files as database projects"
      - "Parses .sql files to extract CREATE TABLE/PROCEDURE/VIEW statements"
      - "Identifies database references (cross-database calls)"
      - "Extracts pre/post deployment scripts"
      - "Generates database schema inventory"
    
    tests:
      - test_database_project_analyzer_detects_sqlproj
      - test_database_project_analyzer_extracts_schema_objects
      - test_database_project_analyzer_parses_deployment_scripts
      - test_database_project_analyzer_identifies_db_references
      - test_database_project_analyzer_handles_complex_sql
    
    test_count: 5
    
  s5_entity_framework_migration_analyzer:
    name: "Entity Framework Migration Analyzer"
    description: |
      Enhance DatabaseAnalyzer to:
      - Detect EF migration folders (Migrations/*.cs)
      - Parse migration files to extract schema changes
      - Build migration timeline (chronological order)
      - Identify migration conflicts or missing migrations
      - Extract DbContext configurations
      
      Output Format:
      {
        "ef_contexts": [
          {
            "name": "ApplicationContext",
            "migration_count": 47,
            "migrations": [
              {"name": "20230115_AddUserTable", "timestamp": "2023-01-15", "changes": ["CreateTable(Users)"]},
              {"name": "20230120_AddEmailColumn", "timestamp": "2023-01-20", "changes": ["AddColumn(Users.Email)"]}
            ],
            "pending_migrations": [],
            "conflicts": []
          }
        ]
      }
    
    acceptance_criteria:
      - "Detects EF migration files by pattern (Migrations/*_*.cs)"
      - "Extracts migration timestamp from filename"
      - "Parses Up/Down methods for schema changes"
      - "Builds chronological migration timeline"
      - "Identifies missing migrations in sequence"
    
    tests:
      - test_ef_migration_analyzer_detects_migrations
      - test_ef_migration_analyzer_extracts_schema_changes
      - test_ef_migration_analyzer_builds_timeline
      - test_ef_migration_analyzer_identifies_conflicts
      - test_ef_migration_analyzer_handles_multiple_contexts
    
    test_count: 5
    
  s6_azure_devops_pipeline_analyzer:
    name: "Azure DevOps Pipeline Analyzer"
    description: |
      Add AzureDevOpsPipelineAnalyzer to analyze:
      - azure-pipelines.yml (build/test/deploy stages)
      - Multi-stage pipeline configurations
      - Variable groups and service connections
      - Trigger configurations (CI/CD triggers)
      - Agent pools and dependencies
      
      Output Format:
      {
        "pipelines": [
          {
            "name": "azure-pipelines.yml",
            "trigger": ["main", "develop"],
            "stages": [
              {"name": "Build", "steps": ["dotnet restore", "dotnet build", "dotnet test"]},
              {"name": "Deploy", "steps": ["AzureWebApp@1"]}
            ],
            "variables": {"BuildConfiguration": "Release"},
            "agent_pools": ["Azure Pipelines"]
          }
        ]
      }
    
    acceptance_criteria:
      - "Parses azure-pipelines.yml YAML structure"
      - "Extracts stages, jobs, and steps"
      - "Identifies trigger and PR configurations"
      - "Detects variable groups and service connections"
      - "Generates CI/CD maturity score (0-100)"
    
    tests:
      - test_azure_devops_analyzer_parses_pipeline_yaml
      - test_azure_devops_analyzer_extracts_stages
      - test_azure_devops_analyzer_identifies_triggers
      - test_azure_devops_analyzer_detects_variables
      - test_azure_devops_analyzer_calculates_maturity_score
    
    test_count: 5
    
  s7_wcf_service_analyzer:
    name: "WCF Service Contract Analyzer"
    description: |
      Enhance APIAnalyzer to detect WCF/SOAP services:
      - Find [ServiceContract] attributes in C# code
      - Extract [OperationContract] methods
      - Parse .svc files for service endpoints
      - Identify WCF bindings (BasicHttpBinding, etc.)
      - Detect service configuration in Web.config
      
      Output Format:
      {
        "wcf_services": [
          {
            "name": "IUserService",
            "file": "Services/IUserService.cs",
            "operations": [
              {"name": "GetUser", "parameters": ["int userId"], "return_type": "User"},
              {"name": "CreateUser", "parameters": ["User user"], "return_type": "int"}
            ],
            "endpoint": "/UserService.svc",
            "binding": "BasicHttpBinding"
          }
        ]
      }
    
    acceptance_criteria:
      - "Detects [ServiceContract] interfaces via C# AST"
      - "Extracts [OperationContract] methods with signatures"
      - "Parses .svc files for service endpoints"
      - "Identifies WCF bindings in Web.config"
      - "Generates service catalog for monolith decomposition"
    
    tests:
      - test_wcf_analyzer_detects_service_contracts
      - test_wcf_analyzer_extracts_operation_contracts
      - test_wcf_analyzer_parses_svc_files
      - test_wcf_analyzer_identifies_bindings
      - test_wcf_analyzer_generates_service_catalog
    
    test_count: 5
    
  s8_solution_architecture_visualizer:
    name: "Solution Architecture Visualizer"
    description: |
      Create SolutionArchitectureVisualizer to:
      - Generate Mermaid diagrams from solution structure
      - Visualize project dependency graphs
      - Show layer separation (UI → Service → Data)
      - Highlight circular dependencies
      - Export to dashboard-compatible format
      
      Output Format: Mermaid graph LR syntax
      ```mermaid
      graph LR
        ConsoleApp[ConsoleApp<br/>App] --> CoreLibrary
        ConsoleApp --> DataAccess
        CoreLibrary[CoreLibrary<br/>Libs] --> SharedControls
        DataAccess[DataAccess<br/>Data Layer]
        
        style ConsoleApp fill:#e1f5fe
        style DataAccess fill:#fff3e0
      ```
    
    acceptance_criteria:
      - "Generates Mermaid diagram from project dependency graph"
      - "Color-codes projects by layer (UI, Service, Data)"
      - "Highlights circular dependencies in red"
      - "Supports solution filters (subset visualization)"
      - "Embeds in repository dashboard HTML"
    
    tests:
      - test_visualizer_generates_mermaid_diagram
      - test_visualizer_color_codes_layers
      - test_visualizer_highlights_circular_deps
      - test_visualizer_handles_solution_filters
      - test_visualizer_embeds_in_dashboard
    
    test_count: 5
    
  s9_repository_onboarding_integration:
    name: "RepositoryOnboardingOrchestrator Integration"
    description: |
      Wire all new analyzers into RepositoryOnboardingOrchestrator:
      - Add .NET-specific analysis step to onboard_repository()
      - Integrate SolutionFileParser results into dashboard
      - Add project dependency graph to holistic_context
      - Include EF migration timeline in database section
      - Expose Azure DevOps maturity score in metrics
      
      Update OnboardingResult schema to include:
      - solution_analysis: Dict with solution structure
      - project_dependencies: Dependency graph
      - ef_migrations: Migration timeline
      - wcf_services: Service catalog
      - azure_devops_maturity: CI/CD score
    
    acceptance_criteria:
      - "Detects .sln files during onboarding"
      - "Runs all .NET analyzers if .sln found"
      - "Merges .NET analysis into holistic_context"
      - "Dashboard includes solution architecture diagram"
      - "Enterprise .NET monolith onboarding completes with >90% coverage"
    
    tests:
      - test_onboarding_detects_dotnet_repository
      - test_onboarding_runs_solution_parser
      - test_onboarding_includes_project_dependencies
      - test_onboarding_includes_ef_migrations
      - test_onboarding_includes_wcf_services
      - test_onboarding_enterprise_monolith_coverage_90_percent
      - test_onboarding_dashboard_includes_architecture_diagram
    
    test_count: 7

total_tests: 51

