      - "cortex/infrastructure/capability_detector.py"
      - "tests/unit/infrastructure/test_infrastructure_scanner.py (10 tests)"
      - "tests/unit/infrastructure/test_capability_detector.py (5 tests)"
    acceptance_criteria:
      - "✅ Scan discovery-config.yaml for endpoints"
      - "✅ Query health checks, API registries"
      - "✅ Environment-specific capability detection (dev/staging/prod)"
      - "✅ Merge with company/domains/infrastructure/ (PRECEDENCE)"
      - "✅ Persist to cortex-registry/infrastructure/<environment>/"
    
  stage_4:
    id: "S4"
    name: "MCP Tools: Infrastructure Discovery"
    description: "Expose discovery via MCP tools with orchestrator integration"
    effort_hours: 2
    test_count: 18
    deliverables:
      - "cortex/mcp/tools/infrastructure_discovery.py"
      - "MCP tool: cortex_discover_infrastructure"
      - "MCP tool: cortex_github_discover"
      - "tests/unit/mcp/tools/test_infrastructure_discovery.py (18 tests)"
    acceptance_criteria:
      - "✅ cortex_discover_infrastructure(capability, environment)"
      - "✅ cortex_github_discover(query_type, scope)"
      - "✅ Cache integration (check TTL before discovery)"
      - "✅ Error handling with fallback to static data"
      - "✅ MCP schema validation (input/output)"
      - "✅ Tool registration in cortex/mcp/server.py"
    
  stage_5:
    id: "S5"
    name: "Orchestrator Integration: LENS"
    description: "Wire infrastructure awareness into LENS for recommendations"
    effort_hours: 1.5
    test_count: 10
    deliverables:
      - "cortex/lens/infrastructure_integration.py"
      - "LENS queries: internal packages, security alerts"
      - "tests/unit/lens/test_infrastructure_integration.py (10 tests)"
    acceptance_criteria:
      - "✅ LENS recommends internal packages over external"
      - "✅ Block vulnerable dependencies via Dependabot alerts"
      - "✅ 'Package X available in registry, use instead of npm install'"
      - "✅ Security gates: CVE detection prevents usage"
    
  stage_6:
    id: "S6"
    name: "Orchestrator Integration: Planning & Interaction"
    description: "Environment-aware planning and tooling suggestions"
    effort_hours: 1
    test_count: 5
    deliverables:
      - "cortex/orchestrators/planning/infrastructure_integration.py"
      - "cortex/interaction/tooling_suggestions.py"
      - "tests/unit/orchestrators/planning/test_infrastructure_integration.py (3 tests)"
      - "tests/unit/interaction/test_tooling_suggestions.py (2 tests)"
    acceptance_criteria:
      - "✅ PlanningOrchestrator adjusts deployment plans per environment"
      - "✅ Detect capability gaps (API X unavailable in staging)"
      - "✅ InteractionOrchestrator suggests available tooling"
      - "✅ 'Use company/actions/deploy@v1 for deployment'"

# ============================================================================
# TESTING STRATEGY
# ============================================================================
testing:
  unit_tests:
    target: 75
    coverage: 90
    focus_areas:
      - "Cache manager: TTL, invalidation, thread-safety (12 tests)"
      - "GitHub client: GraphQL queries, rate limiting, mocking (20 tests)"
      - "Infrastructure scanner: Discovery, environment detection (15 tests)"
      - "MCP tools: Input validation, caching, fallbacks (18 tests)"
      - "Orchestrator integration: LENS, Planning, Interaction (15 tests)"
  
  integration_tests:
    target: 5
    coverage: 85
    scenarios:
      - "End-to-end discovery: Cache miss → API query → cache update → orchestrator"
      - "GitHub ecosystem: Query packages → recommend in LENS → validate usage"
      - "Environment-aware planning: Detect capability gap → adjust deployment plan"
      - "Security gates: Dependabot alert → block vulnerable dependency"
      - "Cache expiry: TTL expires → re-discover → update orchestrators"
  
  mocking_strategy:
    - "Mock GitHub API responses (no real API calls in tests)"
    - "Mock infrastructure endpoints (health checks, registries)"
    - "Mock company/domains/infrastructure/ YAML loading"
    - "Freeze time for TTL cache expiry tests"

# ============================================================================
# RISK MITIGATION
# ============================================================================
risks:
  api_rate_limits:
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation:
      - "Aggressive caching (1-hour TTL for packages)"
      - "Exponential backoff on 429 responses"
      - "Fallback to static company/domains/ on quota exhaustion"
  
  github_api_changes:
    likelihood: "LOW"
    impact: "HIGH"
    mitigation:
      - "Version GitHub API queries (v4 GraphQL)"
      - "Graceful degradation on schema changes"
      - "Monitor GitHub changelog for breaking changes"
  
  stale_cache_data:
    likelihood: "MEDIUM"
    impact: "LOW"
    mitigation:
      - "5-minute TTL for deployments (real-time state)"
      - "Manual invalidation API for force refresh"
      - "Cache metrics: track staleness, hit rate"
  
  security_token_exposure:
    likelihood: "LOW"
    impact: "CRITICAL"
    mitigation:
      - "Environment variable only (GITHUB_TOKEN)"
      - "Never log tokens in error messages"
      - "Validate token scopes at initialization"
      - "Audit logs exclude sensitive data"

