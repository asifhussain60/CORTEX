# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    A CORTEX infrastructure awareness system that enables orchestrators to:
    
    1. **Discover Company Infrastructure** — APIs, in-house tooling, services (dynamic)
    2. **GitHub Ecosystem Integration** — Packages, Actions, Environments, Dependabot
    3. **Environment-Specific Capabilities** — Dev/staging/prod awareness
    4. **Real-Time State Synchronization** — Health checks, availability monitoring
    5. **Orchestrator Integration** — LENS, Planning, Interaction, TDD aware of infrastructure
    
    Cross-cutting integration:
    - LENS recommends internal packages over external dependencies
    - PlanningOrchestrator adjusts plans based on environment capabilities
    - InteractionOrchestrator suggests available tooling for user tasks
    - TDDOrchestrator applies reusable GitHub Actions for testing workflows
    - Security gates block vulnerable dependencies via Dependabot alerts

  problem_statement: |
    CORTEX currently operates in an infrastructure vacuum:
    
    **Problem 1: Static Knowledge Only**
    - company/domains/ contains best practices (static)
    - No runtime discovery of available APIs/tooling
    - Recommendations ignore actual infrastructure state
    - Example: Suggests npm install when internal package exists
    
    **Problem 2: GitHub Blindness**
    - No awareness of GitHub Actions (reusable workflows)
    - No internal package registry integration
    - No deployment environment discovery
    - No security alert integration (Dependabot)
    - Example: PlanningOrchestrator can't see what's deployed where
    
    **Problem 3: Environment Ignorance**
    - Dev/staging/prod treated identically
    - No capability differentiation per environment
    - Plans fail due to unavailable services in staging
    - Example: API X available in prod but not staging
    
    **Problem 4: Stale Recommendations**
    - YAML files lag behind infrastructure changes
    - API deprecations not reflected in CORTEX knowledge
    - Service outages invisible to orchestrators
    - Example: Recommends deprecated API version
    
    **Problem 5: Manual Infrastructure Maintenance**
    - Engineers must manually update company/domains/ YAMLs
    - No automated discovery or refresh mechanism
    - High maintenance burden for infrastructure changes

  business_impact:
    - "🟡 Wasted effort: Developers build custom clients when internal packages exist"
    - "🟡 Deployment friction: Plans fail due to environment capability gaps"
    - "🔴 Security risk: No blocking of vulnerable dependencies (Dependabot blind)"
    - "🟢 Productivity: Dynamic discovery enables better recommendations"
    - "🟢 Consistency: Automated infrastructure awareness reduces manual updates"
    - "🟢 Cost savings: Leverage existing infrastructure instead of duplicating"

  expected_outcomes:
    - "cortex-registry/infrastructure/: Dynamic capability registry (JSON state)"
    - "company/domains/infrastructure/: Static best practices (YAML patterns)"
    - "New MCP tool: cortex_discover_infrastructure (all infrastructure discovery)"
    - "New MCP tool: cortex_github_discover (GitHub ecosystem queries)"
    - "GitHub GraphQL integration: Packages, Actions, Environments, Dependabot"
    - "LENS integration: 'Package X available, use instead of building custom client'"
    - "PlanningOrchestrator: Environment-specific deployment plans"
    - "TDDOrchestrator: Reusable GitHub Actions workflow suggestions"
    - "Security gates: Block vulnerable dependencies via Dependabot alerts"
    - "Cache with TTL: 5-minute refresh for dynamic state"
    - "80+ tests: Discovery logic, API integration, caching, fallbacks"

