# ============================================================================
# ARCHITECTURE DESIGN
# ============================================================================
architecture:
  components:
    infrastructure_registry:
      description: "Dynamic infrastructure state storage with TTL caching"
      location: "cortex-registry/infrastructure/"
      structure:
        - "capabilities.yaml: Static capability schemas (what to discover)"
        - "discovery-config.yaml: Discovery endpoints and health checks"
        - "<environment>/apis.json: Available APIs per environment (runtime)"
        - "<environment>/tools.json: In-house tooling availability (runtime)"
        - "<environment>/integrations.json: Third-party integrations (runtime)"
        - "github/packages.json: Internal package catalog (hourly refresh)"
        - "github/actions.json: Reusable workflows (org-wide)"
        - "github/deployments.json: Environment deployment states (per repo)"
      cache_strategy: "5-minute TTL for dynamic state, 1-hour for GitHub packages"
    
    static_best_practices:
      description: "Static infrastructure usage patterns (PRECEDENCE over dynamic)"
      location: "company/domains/infrastructure/"
      structure:
        - "api-standards.yaml: How to USE infrastructure (REST, GraphQL patterns)"
        - "tooling-patterns.yaml: When to use which tool (decision trees)"
        - "integration-guidelines.yaml: Third-party integration best practices"
        - "github-workflows.yaml: GitHub Actions usage patterns"
      precedence: "HIGHEST — Company standards override CORTEX defaults"
    
    discovery_engine:
      description: "Infrastructure state discovery and synchronization"
      location: "cortex/infrastructure/"
      modules:
        - "infrastructure_scanner.py: Core discovery logic (APIs, tools, services)"
        - "github_client.py: GitHub GraphQL/REST API wrapper"
        - "capability_detector.py: Environment-specific capability detection"
        - "cache_manager.py: TTL cache with invalidation strategies"
        - "health_monitor.py: Service health checks and availability tracking"
      mcp_tools:
        - "cortex_discover_infrastructure: Main discovery tool (all infrastructure)"
        - "cortex_github_discover: GitHub ecosystem queries (packages, actions, etc.)"
    
    orchestrator_integration:
      description: "Wire infrastructure awareness into orchestrators"
      affected_orchestrators:
        lens:
          integration: "Recommend internal packages, block vulnerable dependencies"
          queries: ["Available packages for {functionality}", "Security alerts for {dependency}"]
        planning_orchestrator:
          integration: "Environment-specific deployment plans, capability gaps detection"
          queries: ["Capabilities available in {environment}", "Deployment state for {repo}"]
        interaction_orchestrator:
          integration: "Suggest available tooling for user tasks"
          queries: ["Tools available for {task}", "Reusable workflows for {action}"]
        tdd_orchestrator:
          integration: "Apply reusable GitHub Actions for testing workflows"
          queries: ["Test workflows for {language}", "Coverage actions available"]

  data_flow:
    discovery_workflow: |
      1. Orchestrator needs infrastructure info
         ↓
      2. Invoke cortex_discover_infrastructure(capability, environment)
         ↓
      3. Check cache (TTL not expired?)
         ├─ YES: Return cached state
         └─ NO: Continue to discovery
         ↓
      4. Query discovery endpoints (health checks, API registries)
         ↓
      5. Update cache with TTL
         ↓
      6. Merge with company/domains/infrastructure/ best practices (PRECEDENCE)
         ↓
      7. Return enriched infrastructure state to orchestrator
    
    github_workflow: |
      1. Orchestrator needs GitHub ecosystem info
         ↓
      2. Invoke cortex_github_discover(query_type, scope)
         ↓
      3. Check cache (1-hour TTL for packages, 5-min for deployments)
         ├─ YES: Return cached data
         └─ NO: Continue to GitHub API
         ↓
      4. Query GitHub GraphQL API (with rate limit handling)
         ↓
      5. Transform response (normalize to CORTEX schema)
         ↓
      6. Update cache + persist to cortex-registry/infrastructure/github/
         ↓
      7. Return GitHub data to orchestrator

  security_considerations:
    authentication:
      - "GitHub token via environment variable (GITHUB_TOKEN)"
      - "Never log tokens or expose in error messages"
      - "Validate token scopes: read:packages, read:org, repo:status"
    rate_limiting:
      - "GitHub API: 5000 requests/hour (authenticated)"
      - "Implement exponential backoff on 429 responses"
      - "Cache aggressively to minimize API calls"
    error_handling:
      - "Fallback to static company/domains/infrastructure/ on API failures"
      - "Log discovery failures for monitoring (no sensitive data)"
      - "Graceful degradation: Return partial results if some endpoints fail"
    data_privacy:
      - "No storage of sensitive infrastructure details in git"
      - "Dynamic state in cortex-registry/infrastructure/ (gitignored)"
      - "Only schemas in version control"

