# ============================================================================
# NOTES & REFERENCES
# ============================================================================
notes:
  design_decisions:
    - "Separation of static (company/domains/) vs dynamic (cortex-registry/) — prevents stale YAML files, enables real-time awareness"
    - "MCP-FIRST architecture — consistent with CORTEX design, all discovery via tools"
    - "Cache with TTL — balance freshness vs API rate limits (5-min for deployments, 1-hour for packages)"
    - "Graceful degradation — fallback to static data on API failures ensures orchestrators never block"
    - "GitHub GraphQL preferred over REST — more efficient, single query for multiple resources"
  
  future_enhancements:
    - "AWS/Azure infrastructure discovery (cloud provider APIs)"
    - "Database schema registry (Postgres, MySQL metadata)"
    - "API contract discovery (OpenAPI spec auto-ingestion)"
    - "Real-time service mesh monitoring (Istio, Linkerd integration)"
    - "Cost awareness (track API usage costs, recommend cheaper alternatives)"
  
