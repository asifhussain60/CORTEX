      - "✅ Thread-safe cache operations"
      - "✅ Metrics: cache hit rate, miss rate, eviction count"
    
  stage_2:
    id: "S2"
    name: "GitHub API Client"
    description: "GitHub GraphQL/REST wrapper with rate limiting and caching"
    effort_hours: 3
    test_count: 20
    deliverables:
      - "cortex/infrastructure/github_client.py"
      - "tests/unit/infrastructure/test_github_client.py (20 tests)"
      - "GitHub queries: packages, actions, environments, dependabot, deployments"
    acceptance_criteria:
      - "✅ GraphQL queries for packages, actions, environments"
      - "✅ REST API for Dependabot alerts, deployment status"
      - "✅ Rate limit handling: check remaining, exponential backoff on 429"
      - "✅ Secure token management (environment variable only)"
      - "✅ Response normalization to CORTEX schema"
      - "✅ Mocked tests (no real API calls in CI/CD)"
    
  stage_3:
    id: "S3"
