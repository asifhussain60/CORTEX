# ============================================================================
# ARCHITECTURE DESIGN
# ============================================================================
architecture:
  current_state:
    root_company_dir:
      path: "company/"
      contents:
        - "domains/ — API standards, security standards, payment-security.yaml (6 YAMLs)"
        - "dashboards/ — Repository dashboards (assets/images/cortex-logo-200.png)"
        - "_archive/ — Legacy files"
      references:
        - "20+ Python files reference 'company/domains'"
        - "RepositoryOnboardingOrchestrator: company/dashboards/{repo_name}/"
        - "StandardsResolver: company/domains/ (PRECEDENCE)"
        - "CompanyDomainLoader: company/domains/**/*.yaml"
        - "DomainEnhancementOrchestrator: company/domains/{domain}-standards.yaml"
      
    cortex_brain_tiers:
      tier0:
        path: "cortex_brain/tier0/"
        purpose: "SKULL rules (immutable CORTEX governance)"
        contents:
          - "governance/core-rules.yaml (29 rules)"
          - "governance/core-040-execution-spec-mandate.yaml"
          - "governance/governance_kernel.yaml"
          - "path_abstraction.py, windows_path_compat.py, etc."
        company_data: "❌ None (pure CORTEX)"
      
      tier1:
        path: "cortex_brain/tier1/"
        purpose: "Domain-specific rules (orchestrators, operations)"
        contents:
          - "governance/security-rules.yaml"
          - "governance/operations-rules.yaml"
          - "governance/development-rules.yaml"
          - "governance/data-rules.yaml"
          - "governance/compliance-rules.yaml"
          - "orchestrators/, templates/, profiles/"
        company_data: "⚠️ Partial — May contain company-specific rule overrides"
      
      tier2:
        path: "cortex_brain/tier2/"
        purpose: "Context-specific rules (audit, production, high-risk)"
        contents:
          - "governance/audit-critical-rules.yaml"
          - "governance/high-risk-operations-rules.yaml"
          - "governance/sensitive-data-rules.yaml"
          - "governance/production-rules.yaml"
          - "governance/development-rules.yaml"
        company_data: "⚠️ Partial — May contain company overrides (e.g., 'staging requires 2 reviewers')"
      
      tier3:
        path: "cortex_brain/tier3/"
        purpose: "(Empty directory)"
        contents: []
        company_data: "❌ None"
    
    precedence_system:
      standards_resolver:
        order: "company/domains/ → cortex/knowledge/ → cortex/defaults/"
        implementation: "cortex/common/standards_resolver.py"
        code_references: "20+ files use StandardsResolver"
      
      tier_resolver:
        order: "Tier 0 > Tier 1 > Tier 2 (higher tier precedence)"
        implementation: "cortex/brain/core/tier_resolver.py"
        note: "Opposite direction from StandardsResolver (Tier 0 = highest)"
      
      company_knowledge_loader:
        layers:
          - "Layer 1: company/domains/{company}/ (precedence=1, highest)"
          - "Layer 2: company/domains/compliance-standards/ (precedence=2)"
          - "Layer 3: cortex_brain/tier3/knowledge/ (precedence=3, lowest)"
        implementation: "cortex/brain/core/knowledge/company_knowledge_loader.py"
    
    registry_state:
      cortex_registry:
        path: "cortex-registry/_cortex-master/"
        contents:
          - "phases/ — Phase definitions (active, completed, planned)"
          - "enhancements/ — Enhancement tracking"
          - "governance/ — CORTEX governance (core-rules.yaml, precedence.yaml)"
          - "meta/ — Wiring schema, modes, response-format"
          - "dashboard/ — CORTEX self-improvement dashboard"
          - "directives/ — CORTEX directives"
          - "reports/ — Orchestrator inventory, phase readiness"
        company_data: "❌ None — Pure CORTEX registry"
      
      no_company_registry:
        issue: "Company-specific data NOT in registry (root company/ instead)"
        gap: "Phase 46 defines infrastructure/ but company/ still in root"

  target_state:
    new_registry_structure:
      path: "cortex-registry/"
      structure: |
        cortex-registry/
        ├─ _cortex-master/          # CORTEX self-development (existing)
        │  ├─ phases/
        │  ├─ enhancements/
        │  ├─ governance/
        │  ├─ meta/
        │  └─ dashboard/
        │
        ├─ infrastructure/          # Phase 46: Dynamic discovery (existing)
        │  ├─ capabilities.yaml
        │  ├─ discovery-config.yaml
        │  ├─ <environment>/
        │  └─ github/
        │
        └─ company/                 # NEW: Company-specific assets (PRECEDENCE)
           ├─ domains/              # Moved from root company/domains/
           │  ├─ api-design-standards.yaml
           │  ├─ security-standards.yaml
           │  ├─ payment-security.yaml
           │  ├─ ALIST/
           │  ├─ KASHKOLE/
           │  └─ ...
           │
           ├─ dashboards/           # Moved from root company/dashboards/
           │  ├─ assets/
           │  │  └─ images/
           │  └─ repos/
           │
           ├─ governance/           # NEW: Company governance overrides
           │  ├─ tier1-overrides.yaml
           │  └─ tier2-overrides.yaml
           │
           └─ _archive/             # Moved from root company/_archive/
      
      benefits:
        - "✅ Single registry root: _cortex-master + infrastructure + company"
        - "✅ Phase 46 aligned: Infrastructure + company in same parent"
        - "✅ Gitignore-ready: cortex-registry/company/ excluded per-client"
        - "✅ Clean root: company/ deprecated (only cortex/, cortex_brain/, docs/)"
    
    cortex_brain_cleanup:
      tier0:
        remains: "Pure CORTEX governance (no changes)"
        verification: "✅ No company-specific data"
      
      tier1:
        cleanup: "Extract company overrides → cortex-registry/company/governance/"
        remains: "Pure CORTEX domain defaults"
        verification: "✅ security-rules.yaml = CORTEX defaults only"
      
      tier2:
        cleanup: "Extract company overrides → cortex-registry/company/governance/"
        remains: "Pure CORTEX context defaults"
        verification: "✅ production-rules.yaml = CORTEX defaults only"
      
      tier3:
        action: "Remove empty directory (not used)"
    
    dual_path_resolution:
      purpose: "Zero-regression fallback during migration"
      implementation: |
        # CompanyKnowledgeLoader enhanced
        def _load_company_domain(domain: str) -> Dict:
            # Try new registry location first
            registry_path = Path("cortex-registry/company/domains") / domain
            if registry_path.exists():
                return load_yaml(registry_path)
            
            # Fallback to legacy root location
            legacy_path = Path("company/domains") / domain
            if legacy_path.exists():
                logger.warning(f"Using legacy path for {domain} (migrate to registry)")
                return load_yaml(legacy_path)
            
            return {}
      
      duration: "Indefinite fallback (until all clients migrate)"
      deprecation: "Log warnings when legacy paths used"

  precedence_preservation:
    standards_resolver:
      before: "company/domains/ → cortex/knowledge/ → defaults/"
      after: "cortex-registry/company/domains/ → cortex/knowledge/ → defaults/"
      change: "Path update only, precedence unchanged"
    
    company_knowledge_loader:
      before:
        - "Layer 1: company/domains/{company}/ (precedence=1)"
        - "Layer 2: company/domains/compliance-standards/ (precedence=2)"
        - "Layer 3: cortex_brain/tier3/knowledge/ (precedence=3)"
      after:
        - "Layer 1: cortex-registry/company/domains/{company}/ (precedence=1)"
        - "Layer 2: cortex-registry/company/domains/compliance-standards/ (precedence=2)"
        - "Layer 3: cortex_brain/tier3/knowledge/ (precedence=3)"
      change: "Path update only, precedence unchanged"
    
    tier_resolver:
      before: "Tier 0 > Tier 1 > Tier 2"
      after: "Tier 0 > Tier 1 > Tier 2 (Company overrides in cortex-registry/company/governance/)"
      change: "Company overrides separated, tier precedence unchanged"

  migration_strategy:
    phase_1_registry_setup:
      actions:
        - "Create cortex-registry/company/ directory structure"
        - "Add .gitignore for cortex-registry/company/ (client-specific)"
        - "Copy company/domains/ → cortex-registry/company/domains/"
        - "Copy company/dashboards/ → cortex-registry/company/dashboards/"
        - "Copy company/_archive/ → cortex-registry/company/_archive/"
      
      validation:
        - "✅ All files copied successfully (checksum verification)"
        - "✅ Directory structure matches design"
        - "✅ Git status clean (no accidental commits of company data)"
    
    phase_2_code_updates:
      updates:
        - "CompanyDomainLoader: Add dual-path resolution"
        - "StandardsResolver: Add registry path lookup"
        - "CompanyKnowledgeLoader: Update layer paths"
        - "RepositoryOnboardingOrchestrator: Update dashboard paths"
        - "DomainEnhancementOrchestrator: Update domain write paths"
        - "All 20+ company/domains references updated with fallback"
      
      pattern:
        old: "Path('company/domains') / domain"
        new: |
          def _resolve_company_path(domain: str) -> Path:
              registry_path = Path("cortex-registry/company/domains") / domain
              if registry_path.exists():
                  return registry_path
              return Path("company/domains") / domain  # Fallback
    
    phase_3_tier_cleanup:
      actions:
        - "Audit cortex_brain/tier1/governance/*.yaml for company overrides"
        - "Extract company-specific rules → cortex-registry/company/governance/tier1-overrides.yaml"
        - "Audit cortex_brain/tier2/governance/*.yaml for company overrides"
        - "Extract company-specific rules → cortex-registry/company/governance/tier2-overrides.yaml"
        - "Verify cortex_brain/ contains only CORTEX defaults"
      
      verification:
        - "✅ No references to specific company names in cortex_brain/"
        - "✅ All rules in tiers are CORTEX universal"
        - "✅ Company overrides in cortex-registry/company/governance/"
    
    phase_4_testing:
      test_categories:
        - "Unit tests: CompanyDomainLoader, StandardsResolver, TierResolver (20 tests)"
        - "Integration tests: Full precedence chain (10 tests)"
        - "Migration tests: Dual-path resolution, fallback behavior (10 tests)"
        - "Regression tests: All 450+ existing tests passing (0 failures)"
      
      acceptance_criteria:
        - "✅ 65+ new tests passing (100%)"
        - "✅ 450+ existing tests passing (zero regression)"
        - "✅ Precedence behavior unchanged (company still wins)"
        - "✅ Performance unchanged (<5ms overhead for dual-path)"
    
    phase_5_deprecation:
      timeline: "Post-Phase 47 completion"
      warnings:
        - "Log WARNING when legacy company/ paths used"
        - "Include migration guide URL in log message"
      
      future_removal: "Phase 50+ (after all clients migrate)"

