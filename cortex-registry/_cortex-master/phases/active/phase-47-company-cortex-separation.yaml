# ============================================================================
# VISION & GOALS
# ============================================================================
overview:
  vision: |
    A cleanly separated CORTEX architecture:
    
    1. **CORTEX Universal** — Portable, company-agnostic code
       - cortex/ — Python modules (core logic)
       - cortex_brain/ — Tier-based governance (SKULL → Domain → Context)
       - cortex-registry/_cortex-master/ — CORTEX self-development
    
    2. **Company-Specific** — Client-specific overrides (PRECEDENCE)
       - cortex-registry/company/ — Company knowledge, domains, infrastructure
       - .gitignore-able — Each company runs their own registry
       - Phase 46 integration — Infrastructure discovery state
    
    3. **Precedence Preserved** — Existing behavior unchanged
       - Company > CORTEX hierarchy maintained
       - Tier 0 > Tier 1 > Tier 2 preserved
       - StandardsResolver continues company → cortex → defaults
    
    4. **Zero Regression** — Seamless migration
       - Dual-path resolution (new + legacy)
       - All 450+ tests passing
       - No broken imports
       - No changed behavior

  problem_statement: |
    Current architecture mixes CORTEX universal code with company-specific data:
    
    **Problem 1: Root-Level company/ Directory**
    - Location: d:\PROJECTS\CORTEX\company/
    - Contents: domains/, dashboards/, _archive/
    - Issue: Pollutes root, prevents clean CORTEX distribution
    - Impact: Cannot ship CORTEX to other companies without exposing one company's data
    
    **Problem 2: Tier Blurring (cortex_brain/)**
    - Tier 0: Pure CORTEX governance (✅ Correct)
    - Tier 1/2: Mix of CORTEX defaults + company overrides (❌ Blurred)
    - Example: tier1/governance/operations-rules.yaml may contain company-specific rules
    - Impact: Cannot distinguish CORTEX universal from company-specific
    
    **Problem 3: Scattered Company Assets**
    - company/domains/ — Domain standards (API design, security)
    - company/dashboards/ — Repository dashboards
    - company/_archive/ — Legacy files
    - No centralized registry for company-specific state
    
    **Problem 4: Phase 46 Alignment Gap**
    - Phase 46 defines cortex-registry/infrastructure/ for discovery
    - But company/ is still in root, not in registry
    - Inconsistent: Some registry-based (infrastructure), some root (domains)
    
    **Problem 5: Portability Blocked**
    - CORTEX cannot be packaged without company data leakage
    - Company A's dashboards/domains visible when shipping to Company B
    - No clean separation for open-source or multi-tenant scenarios

  business_impact:
    - "🔴 Portability blocked: Cannot ship CORTEX to other companies cleanly"
    - "🟡 Security risk: Company data mixed with universal code"
    - "🟡 Maintenance burden: Unclear which files are CORTEX vs company"
    - "🟢 Registry consistency: Phase 46 infrastructure + Phase 47 company = unified registry"
    - "🟢 Multi-tenant ready: Enables SaaS model with per-company registries"

  expected_outcomes:
    - "cortex-registry/company/ — All company-specific assets consolidated"
    - "company/ (root) — Deprecated, dual-path fallback for zero regression"
    - "cortex_brain/ tiers — Pure CORTEX (no company overrides)"
    - "Precedence preserved: Company > CORTEX > Defaults (unchanged behavior)"
    - "65+ tests: Migration tests + existing tests passing"
    - "Phase 46 aligned: Infrastructure + company in same registry"
    - "Gitignore-ready: Each company runs cortex-registry/company/ (not version-controlled)"
    - "Zero regression: All 450+ existing tests passing post-migration"

