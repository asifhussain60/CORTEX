## RISKS & MITIGATIONS

risks:
  - risk_id: "RISK-001"
    description: "Knowledge synthesis quality (auto-generated artifacts may be incorrect)"
    severity: "HIGH"
    mitigation: |
      - Human review queue for first-gen artifacts
      - Confidence scores on generated knowledge
      - User feedback loop (mark artifact as incorrect)
      - Fallback to manual expert review
  
  - risk_id: "RISK-002"
    description: "Performance impact (continuous scanning overhead)"
    severity: "MEDIUM"
    mitigation: |
      - Background async processing
      - Rate limiting on scans
      - Incremental analysis (only changed files)
      - Caching layer for readiness scores
  
  - risk_id: "RISK-003"
    description: "False positives in tech detection"
    severity: "MEDIUM"
    mitigation: |
      - Multi-signal detection (files + dependencies + configs)
      - Confidence thresholds on detection
      - User confirmation for novel tech stacks
  
  - risk_id: "RISK-004"
    description: "External feed reliability (CVE APIs down)"
    severity: "LOW"
    mitigation: |
      - Cached feed data (stale acceptable for 24h)
      - Multiple feed sources (redundancy)
      - Degraded mode (proceed without latest updates)

