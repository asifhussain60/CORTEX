      - "push"
      - "pull_request"
      - "tag"
    analysis:
      - "File diff analysis (new languages/frameworks)"
      - "Package file changes (dependencies added)"
      - "Config file modifications (tool adoption)"
    response_time: "<5 seconds"
    priority: "P0"
  
  scheduled_scan:
    frequency: "nightly (02:00 UTC)"
    scope:
      - "All onboarded repositories"
      - "External tech trend feeds"
      - "CVE databases"
    analysis:
      - "Cross-repo pattern detection"
      - "Tech adoption trends"
      - "Missing capability gaps"
    duration: "<30 minutes"
    priority: "P2"
  
  onboarding_event:
    trigger: "RepositoryOnboardingOrchestrator.onboard()"
    immediate_checks:
