## KNOWLEDGE ARTIFACT STRUCTURE

artifact_types:
  best_practices:
    location: "cortex/knowledge/best-practices/{language}/{framework}/"
    schema:
      - "language: str"
      - "framework: str | null"
      - "version: str"
      - "practices: List[Practice]"
      - "anti_patterns: List[AntiPattern]"
      - "source: str (URL or authority)"
      - "last_updated: datetime"
    example: "cortex/knowledge/best-practices/python/django/security.yaml"
  
  tdd_patterns:
    location: "cortex/knowledge/testing/{framework}/"
    schema:
      - "framework: str (pytest, jest, junit)"
      - "language: str"
      - "test_structure: dict"
      - "mocking_patterns: List[Pattern]"
      - "assertion_styles: List[Style]"
      - "coverage_config: dict"
    example: "cortex/knowledge/testing/pytest/patterns.yaml"
  
  security_rules:
    location: "cortex/knowledge/security/{tech-stack}/"
    schema:
      - "tech_stack: str"
      - "vulnerabilities: List[Vulnerability]"
      - "scanning_tools: List[Tool]"
      - "owasp_mapping: dict"
      - "cve_references: List[str]"
    example: "cortex/knowledge/security/nodejs/owasp-top-10.yaml"
  
  tool_configs:
    location: "cortex/knowledge/tooling/{language}/"
    schema:
      - "tool_type: str (linter, formatter, analyzer)"
      - "tool_name: str"
      - "default_config: str (file content)"
      - "installation_command: str"
      - "verification_command: str"
    example: "cortex/knowledge/tooling/python/pylint-config.yaml"

## READINESS SCORING ALGORITHM

readiness_calculation:
  formula: |
    readiness_score = (
      best_practices_coverage * 0.4 +
      tdd_framework_support * 0.3 +
      security_tooling * 0.2 +
      cross_repo_confidence * 0.1
    )
  
  components:
    best_practices_coverage:
      calculation: "artifacts_present / artifacts_required"
      required_artifacts:
        - "Language best practices YAML"
        - "Framework-specific patterns (if applicable)"
        - "Code style guide"
        - "Naming conventions"
      weight: 0.4
    
    tdd_framework_support:
      calculation: "test_capabilities / test_requirements"
      required_capabilities:
        - "Test framework patterns"
        - "Mocking library support"
        - "Coverage tool config"
        - "Test structure templates"
      weight: 0.3
    
    security_tooling:
      calculation: "security_tools / security_requirements"
      required_tools:
        - "Static analysis scanner"
        - "Dependency vulnerability checker"
        - "OWASP rule templates"
        - "Secret scanning patterns"
      weight: 0.2
    
    cross_repo_confidence:
      calculation: "repos_using_stack / total_repos"
      boost: "+0.1 if 3+ repos using same stack"
      weight: 0.1
  
  thresholds:
    high_confidence: 
      score: "≥0.7"
      action: "Proceed immediately"
      user_impact: "Zero wait time"
    
    medium_confidence:
      score: "0.5-0.69"
      action: "Proceed with warnings"
      user_impact: "Show capability gaps, offer to learn"
    
    low_confidence:
      score: "<0.5"
      action: "Block operation, trigger learning"
      user_impact: "Wait for knowledge synthesis (max 5 min)"

