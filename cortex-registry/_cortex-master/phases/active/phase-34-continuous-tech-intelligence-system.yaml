## EXECUTIVE SUMMARY
#
# CORTEX shifts from reactive to proactive tech learning.
# TechIntelligenceOrchestrator becomes central knowledge hub for ALL orchestrators.
# Learning triggers: git webhooks, file patterns, scheduled scans, cross-repo analysis.
# Result: Zero-wait onboarding, predictive capability synthesis, ecosystem awareness.

objective: |
  Create TechIntelligenceOrchestrator as the central knowledge synthesis engine that:
  1. Continuously monitors tech ecosystem (repos, files, trends, CVEs)
  2. Proactively generates best practices, TDD patterns, security rules BEFORE user needs
  3. Serves all orchestrators with readiness scores and capability verification
  4. Enables instant onboarding through pre-learned knowledge
  5. Self-improves through cross-repo pattern recognition

problem_statement: |
  Current Issues:
  - RepositoryOnboardingOrchestrator learns reactively (user waits)
  - No cross-repo intelligence (each onboarding starts from zero)
  - Missing tech stacks require manual intervention
  - TDD/security capabilities assumed, not verified
  - No predictive learning (CORTEX always catching up)
  
  Impact:
  - Slow onboarding (research delays)
  - Inconsistent quality (knowledge gaps)
  - Poor scalability (duplicate learning per repo)
  - User frustration (unexpected capability failures)

solution_approach: |
  Architecture: Event-Driven Continuous Learning
  
  Core Component: TechIntelligenceOrchestrator
  - Location: cortex/orchestrators/intelligence/tech_intelligence_orchestrator.py
  - Role: Central knowledge hub for ALL orchestrators
  - Model: Publisher-subscriber pattern (orchestrators subscribe to tech updates)
  
  Learning Triggers (Multi-Channel):
  1. Git Webhooks → File changes detected
  2. Scheduled Scans → Nightly ecosystem analysis
  3. Onboarding Events → Immediate gap analysis
  4. Cross-Repo Patterns → Predictive synthesis
  5. External Feeds → CVE, framework updates, language releases
  
  Knowledge Artifacts Generated:
  - Best practices YAMLs (cortex/knowledge/best-practices/{language}/*)
  - TDD patterns (cortex/knowledge/testing/{framework}/*)
  - Security rules (cortex/knowledge/security/{tech-stack}/*)
  - Linting configs (.eslintrc, .pylintrc templates)
  - CI/CD templates (language-specific workflows)
  
  Integration Model:
  - Every orchestrator queries TechIntelligenceOrchestrator at init
  - Readiness check: "Can I handle {tech-stack}?" → Score 0-1.0
  - Low score (<0.7) → Triggers immediate learning cycle
  - High score (≥0.7) → Proceeds with confidence

## ARCHITECTURE

components:
  tech_intelligence_orchestrator:
    path: "cortex/orchestrators/intelligence/tech_intelligence_orchestrator.py"
    role: "Central tech knowledge hub"
    responsibilities:
      - "Monitor git repos for tech stack changes"
      - "Detect new languages/frameworks/tools"
      - "Generate missing best practices/TDD patterns"
      - "Maintain readiness scores per tech stack"
      - "Serve capability queries from all orchestrators"
      - "Publish tech update events to subscribers"
    
    sub_components:
      ecosystem_scanner:
        description: "File pattern analysis across all repos"
        triggers:
          - "Git webhook events"
          - "Scheduled scans (nightly)"
          - "Manual scan requests"
        outputs:
          - "Detected tech stacks (language + frameworks)"
          - "Missing capability gaps"
          - "Trend analysis (rising tech adoption)"
      
      knowledge_synthesizer:
        description: "Auto-generates missing knowledge artifacts"
        inputs:
          - "Tech stack identifier"
          - "Existing knowledge base"
          - "External best practice sources"
        outputs:
          - "Best practices YAML files"
          - "TDD framework patterns"
          - "Security scanning configs"
          - "Linting rule templates"
        intelligence_sources:
          - "Official framework documentation"
          - "Industry best practices (OWASP, CWE)"
          - "Community standards (PEP, PSR, JSR)"
          - "CVE databases (security patterns)"
      
      readiness_engine:
        description: "Calculates CORTEX readiness per tech stack"
        scoring_factors:
          - "Best practices coverage (0-0.4 weight)"
          - "TDD framework support (0-0.3 weight)"
          - "Security tooling availability (0-0.2 weight)"
          - "Cross-repo usage frequency (0-0.1 weight)"
        thresholds:
          high_confidence: 0.7
          medium_confidence: 0.5
          low_confidence: "<0.5"
        actions:
          - "Score <0.5 → Block operation, trigger learning"
          - "Score 0.5-0.7 → Proceed with warnings"
          - "Score ≥0.7 → Full confidence proceed"
      
      pattern_predictor:
        description: "Predicts future tech needs from trends"
        analysis:
          - "If 3+ repos use React → Auto-learn React comprehensively"
          - "If TypeScript adoption rising → Pre-generate TypeScript best practices"
          - "If Python 3.12 detected → Update Python patterns proactively"
        benefits:
          - "Zero user wait on 4th React repo"
          - "Ecosystem-aware (not single-repo reactive)"
          - "Stays ahead of user needs"

  tech_intelligence_agent:
    path: "cortex/agents/tech_intelligence_agent.py"
    role: "Execution engine for TechIntelligenceOrchestrator"
    capabilities:
      - "File pattern recognition (language detection)"
      - "Framework identification (package.json, requirements.txt, etc.)"
      - "Best practice research (external API queries)"
      - "YAML generation (knowledge artifact creation)"
      - "Readiness scoring calculation"

  integration_layer:
    description: "How orchestrators integrate with tech intelligence"
    pattern: |
      class AnyOrchestrator:
          def __init__(self):
              self.tech_intel = TechIntelligenceOrchestrator()
          
          async def execute(self, request):
              # Check readiness BEFORE execution
              tech_stack = self.detect_tech_stack(request)
              readiness = await self.tech_intel.check_readiness(tech_stack)
              
              if readiness.score < 0.7:
                  # Trigger immediate learning
                  await self.tech_intel.learn_tech_stack(tech_stack)
                  readiness = await self.tech_intel.check_readiness(tech_stack)
              
              if readiness.score < 0.5:
                  raise InsufficientCapabilityError(
                      f"CORTEX readiness for {tech_stack}: {readiness.score}"
                  )
              
              # Proceed with confidence
              return await self._execute_with_tech_support(request, readiness)

