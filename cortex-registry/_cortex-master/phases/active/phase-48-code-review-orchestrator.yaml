# Architecture
architecture:
  component_name: "CodeReviewOrchestrator"
  module_path: "cortex.orchestrators.domain.code_review_orchestrator"
  tier: 2  # Domain orchestrator
  priority: 45
  
  key_capabilities:
    - "PR diff analysis with LENS integration"
    - "Security vulnerability detection (CWE-89, 94, 327, etc)"
    - "Cross-layer coherence validation"
    - "Company domain compliance checking"
    - "Automated fix suggestion generation"
    - "Review comment synthesis"
    - "Conflict resolution assistance"
    - "Integration with GitHub/GitLab/Azure DevOps (future)"
  
  dependencies:
    orchestrators:
      - "LENSOrchestrator (code intelligence)"
      - "ReviewOrchestrator (plan fidelity verification)"
      - "CoherenceValidator (cross-layer checks)"
      - "SecurityThreatAnalyzer (CWE detection)"
      - "TDDOrchestrator (fix generation with tests)"
    
    mcp_tools:
      - "cortex_lens_analyze (unified code analysis)"
      - "cortex_git_history (commit context)"
      - "cortex_detect_duplicates (CORE-035 enforcement)"
      - "cortex_process_request (fix generation)"
    
    external_integrations:
      - "Git (diff parsing, merge strategies)"
      - "GitHub API (PR comments) - optional"
      - "GitLab API (merge requests) - optional"
      - "Azure DevOps API (PRs) - optional"
  
  data_flow: |
    1. PR Submission → CodeReviewOrchestrator
    2. Parse diff → identify changed files
    3. LENS Analysis → AST, Git history, security threats
    4. Company Domain Loading → compliance rules
    5. Multi-Layer Validation:
       a. Security Checks (OWASP, CWE patterns)
       b. Cross-Layer Coherence (Python↔JS↔SQL)
       c. Business Requirements (company domains)
       d. CORE Rules (TDD, type hints, docstrings)
       e. Plan Fidelity (if phase plan exists)
    6. Generate Review Report:
       - Severity (P0/P1/P2)
       - Location (file:line)
       - Description (what's wrong)
       - Fix Suggestion (TDD-based)
       - Context (why it matters)
    7. MCP Response → structured review comments
    8. Optional: Post to GitHub/GitLab/Azure DevOps

# Implementation Plan
stages:
  - id: "S1"
    name: "Core Review Engine + Diff Parsing"
    duration: "1 day"
    estimated_loc: 400
    test_count: 20
    description: |
      Foundation: PR diff parser + review engine architecture
      
      DELIVERABLES:
      - CodeReviewOrchestrator class (base structure)
      - GitDiffParser (parse git diff to file changes)
      - ReviewContext (PR metadata: author, branch, files changed)
      - ReviewReport dataclass (findings, severity, suggestions)
      - Review severity classification (P0/P1/P2)
      
      TESTS:
      - Parse simple diff (1 file, 10 lines)
      - Parse complex diff (10 files, 1000 lines)
      - Handle binary files (skip review)
      - Handle deleted files
      - Handle renamed files
    
    acceptance_criteria:
      - "GitDiffParser extracts file paths, line changes, and context"
      - "ReviewContext captures PR metadata (author, branch, timestamp)"
      - "ReviewReport structures findings with severity levels"
      - "All tests passing (20/20)"

  - id: "S2"
    name: "LENS Integration - Security & Code Intelligence"
    duration: "1.5 days"
    estimated_loc: 600
    test_count: 25
    dependencies: ["S1"]
    description: |
      Deep integration with CORTEX LENS for holistic analysis
      
      DELIVERABLES:
      - SecurityReviewEngine (CWE detection wrapper)
      - ASTReviewEngine (code structure validation)
      - GitHistoryReviewEngine (commit quality checks)
      - CommentExtractionEngine (TODO/FIXME analysis)
      - LENS analyzer orchestration
      
      CWE COVERAGE:
      - CWE-89 (SQL Injection)
      - CWE-94 (Code Injection)
      - CWE-78 (Command Injection)
      - CWE-327 (Weak Cryptography)
      - CWE-22 (Path Traversal)
      - CWE-79 (XSS)
      - CWE-502 (Deserialization)
      
      TESTS:
      - Detect SQL injection in Python
      - Detect XSS in JavaScript
      - Detect weak crypto (MD5, SHA1)
      - Detect unsafe deserialization
      - Validate AST extraction
      - Validate git history analysis
    
    acceptance_criteria:
      - "SecurityReviewEngine detects 7 CWE patterns with 95%+ accuracy"
      - "ASTReviewEngine extracts function signatures, complexity metrics"
      - "GitHistoryReviewEngine validates commit message quality"
      - "All LENS analyzers integrate via MCP tools"
      - "All tests passing (25/25)"

  - id: "S3"
    name: "Company Domain Compliance Validation"
    duration: "1 day"
    estimated_loc: 500
    test_count: 20
    dependencies: ["S2"]
    description: |
      Validate PRs against company-specific standards
      
      DELIVERABLES:
      - CompanyDomainLoader (load relevant domains for PR)
      - ComplianceValidator (check against domain rules)
      - Domain rule matching engine
      - Violation report generation
      
      DOMAIN CATEGORIES:
      - Security standards (PCI-DSS, HIPAA, SOX)
      - Architecture patterns (microservices, event-driven)
      - API conventions (REST, GraphQL)
      - Database standards (schema naming, indexes)
      - Deployment requirements (12-factor)
      
      TESTS:
      - Load PCI-DSS rules for payment code
      - Validate HIPAA compliance for health data
      - Check architecture pattern adherence
      - Detect API convention violations
      - Validate database naming standards
    
    acceptance_criteria:
      - "CompanyDomainLoader identifies relevant domains based on file paths"
      - "ComplianceValidator matches code patterns against domain rules"
      - "Violation reports include specific rule references"
      - "All tests passing (20/20)"

  - id: "S4"
    name: "Cross-Layer Coherence Validation"
    duration: "1 day"
    estimated_loc: 450
    test_count: 18
    dependencies: ["S3"]
    description: |
      Integrate CoherenceValidator for multi-stack consistency
      
      DELIVERABLES:
      - CrossLayerReviewEngine (wrapper for CoherenceValidator)
      - Enum alignment checks (Python↔JavaScript)
      - Field naming consistency (camelCase↔snake_case)
      - Type compatibility validation (Pydantic↔JSON Schema)
      - Contract test suggestions
      
      VALIDATION LAYERS:
      - Python ↔ JavaScript (models, enums, field names)
      - Python ↔ SQL (table names, column names)
      - JavaScript ↔ SQL (ORMs, query builders)
      - API contracts (OpenAPI, GraphQL schemas)
      
      TESTS:
      - Detect Python enum mismatch with JS
      - Detect field naming inconsistency
      - Validate Pydantic↔JSON Schema compatibility
      - Suggest contract tests for new APIs
    
    acceptance_criteria:
      - "CrossLayerReviewEngine detects enum mismatches with file references"
      - "Field naming consistency validated across layers"
      - "Type compatibility checked for API boundaries"
      - "Contract test suggestions generated"
      - "All tests passing (18/18)"

  - id: "S5"
    name: "Fix Suggestion Generation with TDD"
    duration: "1.5 days"
    estimated_loc: 550
    test_count: 22
    dependencies: ["S4"]
    description: |
      Generate automated fix suggestions using TDDOrchestrator
      
      DELIVERABLES:
      - FixSuggestionEngine (coordinate TDD-based fixes)
      - CodePatchGenerator (generate diff patches)
      - TestCaseGenerator (generate tests for fixes)
      - Fix confidence scoring
      - Interactive fix application
      
      FIX CATEGORIES:
      - Security fixes (parameterized queries, input validation)
      - Code quality (type hints, docstrings)
      - Cross-layer fixes (enum alignment, field renaming)
      - Best practice violations (SOLID, DRY)
      
      TESTS:
      - Generate SQL injection fix with test
      - Generate missing type hints
      - Generate docstring for function
      - Generate enum alignment fix
      - Score fix confidence (0-100)
    
    acceptance_criteria:
      - "FixSuggestionEngine generates TDD-compliant fixes"
      - "CodePatchGenerator produces valid git patches"
      - "TestCaseGenerator creates passing tests"
      - "Fix confidence scores >80 for automated suggestions"
      - "All tests passing (22/22)"

  - id: "S6"
    name: "Review Report Synthesis & MCP Tool"
    duration: "1 day"
    estimated_loc: 400
    test_count: 15
    dependencies: ["S5"]
    description: |
      Synthesize review reports and expose via MCP
      
      DELIVERABLES:
      - ReviewReportSynthesizer (aggregate findings)
      - ReviewCommentFormatter (markdown output)
      - MCPToolAdapter (cortex_review_pr)
      - Review summary generation
      - Approval/rejection logic
      
      REPORT SECTIONS:
      - Executive Summary (approve/reject/conditional)
      - Security Findings (P0/P1/P2)
      - Cross-Layer Issues
      - Business Requirements Violations
      - Fix Suggestions (with confidence)
      - Test Coverage Impact
      
      TESTS:
      - Generate review report from findings
      - Format review as markdown
      - Test MCP tool invocation
      - Validate approval logic
      - Test rejection logic
    
    acceptance_criteria:
      - "ReviewReportSynthesizer produces comprehensive reports"
      - "ReviewCommentFormatter generates readable markdown"
      - "MCP tool cortex_review_pr functional"
      - "Approval/rejection logic follows governance rules"
      - "All tests passing (15/15)"

  - id: "S7"
    name: "CI/CD Integration & GitHub Actions"
    duration: "1 day"
    estimated_loc: 300
    test_count: 10
    dependencies: ["S6"]
    description: |
      Integrate with GitHub Actions for automated PR review
      
      DELIVERABLES:
      - GitHub Actions workflow (pr-review.yml)
      - GitHub API client (post comments)
      - PR status checks (approve/block merge)
      - Webhook handler (PR events)
      - Audit trail logging
      
      WORKFLOW TRIGGERS:
      - PR opened
      - PR updated (new commits)
      - PR synchronized (force push)
      
      TESTS:
      - Workflow triggers on PR events
      - GitHub API client posts comments
      - Status checks update correctly
      - Webhook handler parses events
      - Audit trail captures all actions
    
    acceptance_criteria:
      - "GitHub Actions workflow runs on PR events"
      - "Review comments posted to PR via API"
      - "Status checks block merge on P0 violations"
      - "Webhook handler processes PR payloads"
      - "All tests passing (10/10)"

  - id: "S8"
    name: "Enterprise Extensions & Multi-Tenant Support"
    duration: "1 day"
    estimated_loc: 350
    test_count: 10
    dependencies: ["S7"]
    description: |
      Enterprise features for future scalability
      
      DELIVERABLES:
      - TenantIsolation (multi-team support)
      - RBAC integration (reviewer assignments)
      - Custom review rules (team-specific standards)
      - GitLab/Azure DevOps adapters (future)
      - Performance optimization (caching, parallelization)
      
      ENTERPRISE FEATURES:
      - Tenant-scoped domain loading
      - Role-based reviewer routing
      - Custom compliance rules per team
      - Adapter pattern for multiple VCS platforms
      - Review caching (same commit → same result)
      
      TESTS:
      - Tenant isolation validates correctly
      - RBAC routes reviewers by role
      - Custom rules loaded per tenant
      - Adapter pattern extensible
      - Cache hit rate >70%
    
    acceptance_criteria:
      - "TenantIsolation enforces data boundaries"
      - "RBAC integration routes reviews correctly"
      - "Custom rules per tenant functional"
      - "Adapter pattern supports future VCS platforms"
      - "All tests passing (10/10)"

