# Rollback & Safety
safety:
  checkpoints:
    - id: "PRE-PHASE-48"
      tag: "phase-48/pre"
      command: "git tag phase-48/pre"
      description: "Checkpoint before Code Review Orchestrator implementation"
    
    - id: "POST-STAGE-4"
      tag: "phase-48/s4-complete"
      command: "git tag phase-48/s4-complete"
      description: "Checkpoint after cross-layer validation complete"
    
    - id: "POST-PHASE-48"
      tag: "phase-48/complete"
      command: "git tag phase-48/complete"
      description: "Checkpoint after full Code Review Orchestrator complete"
  
  rollback_procedure: |
    If issues arise during Phase 48:
    
    1. STOP all PR reviews immediately
    2. git checkout phase-48/pre (or relevant stage checkpoint)
    3. Investigate failure (check logs in cortex-logs/)
    4. Fix issue in isolated branch
    5. Run full test suite (120 tests)
    6. Resume from checkpoint
    
    EMERGENCY ROLLBACK:
    - git reset --hard phase-48/pre
    - git clean -fd
    - Notify team of rollback
  
  graceful_degradation:
    - "If LENS unavailable: Skip security checks, log warning"
    - "If company domains unavailable: Use CORTEX defaults"
    - "If GitHub API unavailable: Return review report only (no comment posting)"
    - "If CoherenceValidator fails: Skip cross-layer checks, flag warning"

