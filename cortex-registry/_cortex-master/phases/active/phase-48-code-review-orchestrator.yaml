# MCP Tool Specification
mcp_tools:
  - name: "cortex_review_pr"
    description: "Comprehensive PR code review with security-first CORTEX tooling"
    parameters:
      - name: "pr_diff"
        type: "string"
        required: true
        description: "Git diff output (unified format)"
      
      - name: "pr_metadata"
        type: "object"
        required: true
        properties:
          author: "string"
          branch: "string"
          base_branch: "string"
          timestamp: "string (ISO 8601)"
      
      - name: "review_config"
        type: "object"
        required: false
        properties:
          enable_security: "boolean (default: true)"
          enable_cross_layer: "boolean (default: true)"
          enable_fix_suggestions: "boolean (default: true)"
          min_confidence_threshold: "integer (0-100, default: 70)"
          tenant_id: "string (optional, for multi-tenant)"
    
    returns:
      type: "object"
      properties:
        status: "string (APPROVED|REJECTED|CONDITIONAL)"
        summary: "string"
        findings:
          type: "array"
          items:
            severity: "string (P0|P1|P2)"
            category: "string (security|cross_layer|compliance|quality)"
            file: "string"
            line: "integer"
            description: "string"
            fix_suggestion: "object (optional)"
            confidence: "integer (0-100)"
        metrics:
          total_findings: "integer"
          p0_count: "integer"
          p1_count: "integer"
          p2_count: "integer"
          fix_suggestions_generated: "integer"
          review_time_ms: "integer"
        approval_decision:
          approved: "boolean"
          conditions: "array (if CONDITIONAL)"
          block_reason: "string (if REJECTED)"

