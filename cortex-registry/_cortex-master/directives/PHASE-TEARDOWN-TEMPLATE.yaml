# How to use this template

usage_instructions: |
  1. Copy this file to phase YAML metadata.teardown section
  2. Customize on_success/on_failure for phase-specific logic
  3. Update next_phase_on_completion based on phase execution order
  4. Add machine_specifics if phase has OS/platform requirements
  5. Ensure next phases exist in execution_queue with same machine rules
  6. Test teardown in dev: 
     - python -c "from cortex.phase_management import PhaseExecutor; 
                  exec = PhaseExecutor(); 
                  exec.run_teardown('phase-52', simulate=True)"

