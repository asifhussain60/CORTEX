## Risk Assessment & Mitigation

| Risk | Probability | Impact | Mitigation |
|------|-------------|--------|-----------|
| Strategy extraction breaks existing code | Low (5%) | High | Comprehensive unit + integration tests before deprecation |
| Git hooks false positives | Medium (20%) | Medium | Whitelist exceptions clearly; manual override available |
| User templates become stale | Low (10%) | Medium | Quarterly review + automation to generate templates from real plans |
| Blacklist not enforced in CI/CD | Medium (15%) | High | Pre-push hook runs in CI + local; dual enforcement |
| Performance regression after refactoring | Low (8%) | High | Benchmark all strategies; compare to EnhancedPlanningOrchestrator baseline |

