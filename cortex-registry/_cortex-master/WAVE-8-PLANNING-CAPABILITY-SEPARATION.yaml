## Governance Artifacts

### New CORE Rules (CORE-056 through CORE-059)

**CORE-056: Internal Registry Blacklist Enforcement**
- Mandate: Files in `cortex-registry/_cortex-master/{index.yaml, phases/, waves/, execution/, meta/}` MUST NOT appear in commits to origin/main
- Enforcement: Pre-commit + pre-push hooks block violations
- Exceptions: `governance/`, `enhancements/`, `directives/` explicitly allowed
- Audit: Track violations in `.cortex/git-violations.log` for governance reporting

**CORE-057: Capability Model Export Validation**
- Mandate: Public algorithms in `cortex/orchestrators/planning/models/` must have test coverage ≥95%
- Enforcement: CI/CD gate before merge to origin/main
- Validation: All exported models must have docstrings (CORE-012), type hints (CORE-011), tests (CORE-008)
- Audit: `cortex-registry/_cortex-master/governance/CORE-057-export-validation.yaml` tracks coverage

**CORE-058: Registry Separation Audit Trail**
- Mandate: All changes to internal artifacts logged with AC markers
- Enforcement: `AC_REGISTRY_SEP_START` → changes → `AC_REGISTRY_SEP_COMPLETE` pattern
- Audit: Separate audit log from normal orchestrator audit trail
- Reporting: Monthly governance report includes registry separation compliance

**CORE-059: User Template Governance**
- Mandate: User templates in `cortex/templates/planning/` must pass same validation as shipped code
- Enforcement: YAML validation, structure validation, example execution
- Testing: Each template runs through UnifiedPlanningOrchestrator (integration test)
- Maintenance: Quarterly template review (new CORTEX features → update examples)

### Audit Checkpoints

1. **Stage 1 Completion:** All strategies extracted + 30/30 unit tests passing
2. **Stage 2 Completion:** Pre-commit hook tested (prevents blacklisted files) + pre-push hook tested (prevents origin/main push)
3. **Stage 3 Completion:** All models at 95%+ coverage + public API working + 5+ end-to-end tests
4. **Stage 4 Completion:** All templates executable + user guide clarity review + integration tests 100% passing

