# Wave-8 Planning Capability: Execution Tracking & Architecture

**Decision:** APPROVED 2026-02-11 | **Incorporation:** Master Plan Index Updated  
**Status:** PLANNED | **Priority:** P0-CRITICAL | **ROI Composite:** 8.9  
**Duration:** 12-16 days | **Effort:** 20 hours | **Critical Path:** Blocks Wave 9

---

## Initiative Summary

**Title:** Planning Orchestrator Capability (Registry Separation + Layered Export)

**Vision:** Separate CORTEX's internal master plan (_cortex-master, blacklisted from origin/main) from user-facing planning orchestrator capability (shipped, extensible). Single UnifiedPlanningOrchestrator with pluggable strategies handles both use cases without code duplication.

**Outcome:** Users get production-grade planning capability (Wave → Track → Phase orchestration) without exposure to CORTEX's internal 50-wave roadmap. CORTEX's self-development remains internal; algorithms + patterns shipped as reusable capability.

---

## Architectural Model: Layered Capability Export (Alternative 3, Approved)

### Registry Structure

```
cortex-registry/
├── _cortex-master/                           [INTERNAL - BLACKLIST]
│   ├── index.yaml
│   ├── phases/{active,completed}/
│   ├── waves/
│   └── metadata: environment="internal", auto_export=false
│
├── _capability-models/                       [SHIPPED]
│   ├── orchestration-strategies.yaml         (Wave/Track/Phase strategies)
│   ├── roi-scoring-model.yaml               (Composite ROI algorithm)
│   ├── dependency-resolution.yaml           (Dependency graph logic)
│   └── metadata: environment="shared", auto_export=true
│
└── _user-examples/                          [SHIPPED + PUBLIC]
    ├── simple-phase-plan.yaml
    ├── wave-based-roadmap.yaml
    └── metadata: environment="public", auto_export=true
```

### Release Scope

**Internal (Blacklisted from origin/main):**
- `cortex-registry/_cortex-master/` (all)
- CORTEX's wave-based 50-day execution plan
- Internal governance rules, meta-plans, decision trees

**Shipped (Public Release to origin/main):**
- `cortex/orchestrators/planning/strategies/` (PhaseStrategy, WaveStrategy, TrackStrategy)
- `cortex/orchestrators/planning/models/` (ROI scoring, dependency resolution algorithms)
- `cortex/templates/planning/` (Reference registry templates)
- User workflow documentation + integration examples
- Governance patterns (reusable for users)

**Shared (Both Internal + Public):**
- `cortex-registry/_cortex-master/governance/` (core rules, reusable patterns)
- `cortex-registry/_cortex-master/enhancements/` (enhancement specifications)
- `cortex-registry/_cortex-master/directives/` (execution directives, reusable)

