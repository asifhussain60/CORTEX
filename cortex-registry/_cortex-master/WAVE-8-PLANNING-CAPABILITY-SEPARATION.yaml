## Implementation Stages

### Stage 1: UnifiedPlanningOrchestrator Strategy Extraction (6 hours)

**Objective:** Refactor EnhancedPlanningOrchestrator into single unified orchestrator with pluggable strategies.

**Current State:**
- 2 orchestrators: PlanningOrchestrator (stub), EnhancedPlanningOrchestrator (production)
- Mixed responsibilities (phase planning, wave orchestration, track parallelization)
- 663 LOC, 12 AC fixes (AC-DOMAIN-PLAN-001 through 012)

**Target State:**
- Single UnifiedPlanningOrchestrator
- 3 pluggable strategies: PhaseExecutionStrategy, WaveOrchestrationStrategy, TrackParallelizationStrategy
- Total: ~500 LOC (strategies) + 100 LOC (router) = ~600 LOC (8% reduction)

**Deliverables:**
1. `cortex/orchestrators/core/unified_planning_orchestrator.py` (main entry point)
2. `cortex/orchestrators/core/strategies/phase_execution_strategy.py` (Phase planning, critical path, risks, progress)
3. `cortex/orchestrators/core/strategies/wave_orchestration_strategy.py` (ROI scoring, dependency resolution, timeline)
4. `cortex/orchestrators/core/strategies/track_parallelization_strategy.py` (Parallel coordination, gating, sync)
5. Unit tests: 30+ tests validating strategy isolation + orchestrator routing
6. Deprecation: Mark EnhancedPlanningOrchestrator for sunset 2026-Q3

**Success Criteria:**
- All 12 AC fixes preserved in respective strategies
- 99%+ test pass rate (maintain existing coverage)
- Strategy routing O(1) complexity
- Backward compatibility: existing PlanningOrchestrator calls work (via adapter)

---

### Stage 2: Registry Separation + Blacklist Setup (4 hours)

**Objective:** Implement git-level + governance-level controls for _cortex-master internal state.

**Deliverables:**

1. **Git Ignore (.gitignore update):**
```
# Blacklist internal master plan
cortex-registry/_cortex-master/index.yaml
cortex-registry/_cortex-master/phases/
cortex-registry/_cortex-master/waves/
cortex-registry/_cortex-master/execution/
cortex-registry/_cortex-master/meta/

# EXCEPT: Share governance + enhancements + directives (reusable patterns)
!cortex-registry/_cortex-master/governance/
!cortex-registry/_cortex-master/enhancements/
!cortex-registry/_cortex-master/directives/
```

2. **Pre-commit Hook (hooks/pre-commit):**
   - Check: Any staged files in `cortex-registry/_cortex-master/` (excluding exceptions)
   - If staging blacklisted files: Block with clear message
   - Allow override: `git commit --no-verify` (for internal branches only)
   - Audit: Log violations to `.cortex/git-violations.log`

3. **Pre-push Hook (hooks/pre-push):**
   - Check: Any commits pushing `cortex-registry/_cortex-master/` to origin/main
   - If detected: Block with enforcement message
   - Allow: Pushing to feature branches (cortex/*, develop)
   - Reason: Prevent accidental exposure of internal plan

4. **Visibility Metadata (in index.yaml):**
```yaml
registry_metadata:
  visibility_model:
    - artifact: "index.yaml"
      environment: "internal"
      access: ["cortex_dev"]
      export: false
      git_blacklist: true
    
    - artifact: "governance/"
      environment: "shared"
      access: ["cortex_dev", "users"]
      export: true
      git_blacklist: false
```

5. **Governance Rules (CORE-056 through CORE-059):**
   - CORE-056: Internal registry blacklist enforcement
   - CORE-057: Capability model export validation
   - CORE-058: Registry separation audit trail
   - CORE-059: User template governance

**Success Criteria:**
- _cortex-master/ files cannot be accidentally pushed to origin/main
- Pre-commit hook prevents staging blacklisted files
- Visibility metadata documented + auditable
- Zero regressions: legitimate files still pushed successfully

