critical_enhancements:
  - id: ENH-063
    title: "Production Architecture Remediation (15 Critical Fixes)"
    source: "chat01.md"
    priority: P0
    effort: "19 days (12 days parallelized)"
    confidence: 9.5
    created: "2026-02-11"
    description: |
      Comprehensive production architecture analysis identified 15 critical issues
      across security, reliability, performance, and operability dimensions.
      
      P0 Critical (8 issues):
      1. MCP server lacks authentication (any localhost process can deploy to prod)
      2. Command injection in cortex_refactor (arbitrary code execution)
      3. No circuit breakers (git operations can deadlock server)
      4. Race condition in DebugOrchestrator (file corruption)
      5. Unhandled exceptions crash MCP server (all 73 tools unavailable)
      6. Git operations block event loop (2-5s synchronous calls)
      7. No liveness probe (cannot detect deadlocks)
      8. Hardcoded AWS credentials in tests (git history exposure)
      
      P1 High Priority (7 issues):
      9. Configuration drift (wiring.yaml vs __wiring_contract__.yaml)
      10. Session state lost on MCP restart
      11. No RBAC on deployment tools
      12. Unbounded event history growth (memory leak)
      13. No structured logging (30+ min MTTR)
      14. Path traversal in onboarding tool
      15. No distributed tracing
    impact: |
      - Production deployment BLOCKED by security vulnerabilities
      - Server deadlocks and crashes under load
      - 30+ min MTTR due to poor observability
      - Memory leaks and file corruption
      - SOC 2 compliance violations
    solution: |
      6-phase remediation plan:
      - Phase 1: Critical Security Fixes (Week 1, 5-7 days)
      - Phase 2: Reliability & Performance (Week 2, 3 days)
      - Phase 3: Operability & Monitoring (Week 2-3, 2 days)
      - Phase 4: Authorization & Security (Week 3, 3 days)
      - Phase 5: Configuration & State (Week 4, 3 days)
      - Phase 6: Scalability & Resources (Week 4, 1 day)
    roi: "Security hardening + reliability → production-ready deployment"
    files:
      - cortex/mcp/server.py (AUTH, EXCEPTION HANDLER, LIVENESS)
      - cortex/mcp/gateway.py (AUTH, RBAC)
      - cortex/mcp/tools/refactor_tool.py (COMMAND INJECTION FIX)
      - cortex/repositories/git_operations.py (CIRCUIT BREAKERS, ASYNC)
      - cortex/orchestrators/support/debug_orchestrator.py (RACE CONDITION)
      - tests/integration/ (CREDENTIALS CLEANUP)
      - cortex/*/*.py (STRUCTURED LOGGING, TRACING)
    status: "active"
    tracking_file: "enhancements/active/enh-063-production-architecture-remediation.yaml"
    implementation_plan: "_workspaces/.chats/PRODUCTION-READINESS-PLAN.md"
    digest_file: "_workspaces/.chats/chat01-digest.yaml"
  
  - id: ENH-064
    title: "LENS Intelligence Layer Separation"
    source: "chat01.md, violations.md"
    priority: P0
    effort: "2 weeks"
    description: |
      Current LENS implementation in brain/lens/pipeline.py has stub examination phase.
      Phase 2 uses hardcoded feature lists instead of real codebase analysis.
    impact: |
      - 0% actual codebase understanding
      - Cannot detect real dependencies
      - Complexity scores meaningless
    solution: |
      - Extract intelligence layer: cortex/intelligence/
      - Connect Phase 2 to LENSOrchestrator
      - Real AST analysis via ASTAnalyzer
      - Git history via GitHistoryAnalyzer
      - Comment extraction for context
    roi: "10x - 90% codebase understanding improvement"
    files:
      - cortex/brain/lens/pipeline.py (REFACTOR Phase 2)
      - cortex/intelligence/ (NEW directory)
      - cortex/lens/orchestrator.py (INTEGRATE)
    
  - id: ENH-065
    title: "SPA Dashboard Production Readiness"
    source: "violations.md, console-log.md, gpr-recommendation.txt"
    priority: P0
    effort: "7 days (6 phases)"
    description: |
      SPA dashboard has 15 critical production issues:
      1. State management catastrophe (race conditions)
      2. Loading state hell (no per-component states)
      3. Error handling vacuum (no boundaries)
      4. Data integrity theater (validation after render)
      5. Concurrency hazards (no request coordination)
      6. Scalability issues (8000-item graphs freeze browser)
      7. Zero observability (no telemetry)
      8. Testing impossibility (monolithic structure)
      9. Security vulnerabilities (XSS risks)
      10. file:// protocol breaks fetch()
      11. CSS/SVG sizing rules (100% height on min-height parent)
      12. Data contradictions (LOC=0 with language counts)
      13. No explainability panel for KPIs
      14. No virtualization for large lists
      15. No progressive disclosure pattern
    solution: |
      Phase 1: State Management (state versioning + freeze pattern)
      Phase 2: Error Boundaries (per-tab fallback UI)
      Phase 3: Lazy Loading & Performance (virtual scrolling)
      Phase 4: Security Hardening (DOMPurify + CSP)
      Phase 5: Schema Validation (Zod before render)
      Phase 6: Observability (telemetry integration)
    roi: "Production readiness: 3.6/10 → 9/10"
    files:
      - company/dashboards/spa/js/state-manager.js (NEW)
      - company/dashboards/spa/js/error-handler.js (NEW)
      - company/dashboards/spa/js/lazy-loader.js (NEW)
      - company/dashboards/spa/js/sanitizer.js (NEW)
      - company/dashboards/spa/js/schema.js (NEW)
    
  - id: ENH-066
    title: "MCP Pylance-Style Architecture Clarification"
    source: "struggle.md, tdd-violations.txt"
    priority: P0
    effort: "1 day"
    description: |
      Users confused about MCP server startup. Documentation shows manual
      'python -m cortex.mcp.server' but MCP should auto-start like Pylance.
      Gap between documented approach and actual MCP architecture.
    impact: |
      - User friction during onboarding
      - Wasted time troubleshooting
      - Inconsistent MCP availability
    solution: |
      - Update all documentation to clarify Pylance-style auto-start
      - Add VS Code MCP configuration validation
      - Enhance pre-flight check with 3-method detection
      - Create MCP-SETUP-GUIDE.md with cross-platform instructions
    roi: "10x - Onboarding time: 30 min → 3 min"
    files:
      - .github/prompts/MCP-SETUP-GUIDE.md (NEW)
      - .github/prompts/cortex-architect.prompt.md (UPDATE)
      - scripts/setup-mcp.py (ENHANCE)

