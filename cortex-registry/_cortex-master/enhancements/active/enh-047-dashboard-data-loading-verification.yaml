## Problem Statement

**Issue Discovery:**
The dashboard at `cortex-registry/_cortex-master/dashboard/index.html` loads data from `plan-summary.json` via async fetch, but there's no verification that the data is correctly loaded and displayed. The screenshot shows 0% complete with 0 active phases, suggesting potential data loading issues.

**Evidence:**
- Dashboard displays: 0% Complete, 0 Done, 0 Active, 0 Blocked
- plan-summary.json shows: 25 total phases, 3 active phases, 92% completion rate
- Console logs exist but no automated verification
- No end-to-end tests for dashboard rendering

**Impact:**
- Users may see incorrect/stale data without knowing
- Silent failures in data loading go undetected
- No confidence in dashboard accuracy
- Manual verification required after every update

## Solution Architecture

### Phase 1: Dashboard Data Loading Tests (2 days)

**Objective:** Create automated tests to verify data loading and transformation

**Deliverables:**
```yaml
tests:
  - file: "tests/integration/dashboard/test_data_loading.py"
    tests:
      - test_plan_summary_json_exists
      - test_json_structure_valid
      - test_statistics_loaded
      - test_active_phases_loaded
      - test_completed_phases_loaded
      - test_critical_issues_loaded
      - test_enhancements_loaded
    coverage: 90%
  
  - file: "tests/e2e/dashboard/test_dashboard_rendering.py"
    framework: "playwright"
    tests:
      - test_dashboard_loads
      - test_statistics_displayed
      - test_active_phases_rendered
      - test_tabs_functional
      - test_data_matches_json
    coverage: 85%
```

**Implementation:**
```python
# tests/integration/dashboard/test_data_loading.py
import json
import pytest
from pathlib import Path

def test_plan_summary_json_exists():
    """Verify plan-summary.json exists and is readable"""
    json_path = Path("cortex-registry/_cortex-master/dashboard/data/plan-summary.json")
    assert json_path.exists(), "plan-summary.json not found"
    assert json_path.stat().st_size > 0, "plan-summary.json is empty"

def test_json_structure_valid():
    """Verify JSON structure matches expected schema"""
    json_path = Path("cortex-registry/_cortex-master/dashboard/data/plan-summary.json")
    with open(json_path) as f:
        data = json.load(f)
    
    # Validate required top-level keys
    assert "metadata" in data
    assert "statistics" in data
    assert "active_phases" in data
    
    # Validate statistics structure
    stats = data["statistics"]
    assert "total_phases" in stats
    assert "active_phases" in stats
    assert "completion_rate" in stats
    assert stats["total_phases"] > 0

def test_active_phases_loaded():
    """Verify active phases are correctly loaded"""
    json_path = Path("cortex-registry/_cortex-master/dashboard/data/plan-summary.json")
    with open(json_path) as f:
        data = json.load(f)
    
    active = data["active_phases"]
    assert len(active) > 0, "No active phases found"
    
    for phase in active:
        assert "number" in phase
        assert "name" in phase
        assert "status" in phase
```

