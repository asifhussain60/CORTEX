// Add to index.html after loadDashboardData()
function displayDataLoadingStatus(success, timestamp, error = null) {
  const statusEl = document.getElementById('data-loading-status');
  
  if (success) {
    statusEl.innerHTML = `
      <div class="alert alert-success">
        ✅ Data loaded successfully at ${timestamp}
        <br>Active: ${CORTEX_DATA.stats.active} | Completed: ${CORTEX_DATA.stats.completed}
      </div>
    `;
  } else {
    statusEl.innerHTML = `
      <div class="alert alert-danger">
        ❌ Failed to load dashboard data: ${error}
        <br>Using fallback data. Please refresh or check plan-summary.json
      </div>
    `;
  }
}
```

### Phase 3: Automated Sync Verification (1 day)

**Objective:** Verify dashboard auto-sync is working

**Deliverables:**
```yaml
verification_script:
  - file: "scripts/verify_dashboard_sync.py"
    checks:
      - index_yaml_vs_plan_summary_json
      - phase_count_consistency
      - enhancement_count_consistency
      - critical_issues_propagation
      - blocked_by_relationships
```

**Implementation:**
```python
# scripts/verify_dashboard_sync.py
import yaml
import json
from pathlib import Path

def verify_dashboard_sync():
    """Verify index.yaml and plan-summary.json are synchronized"""
    
    # Load index.yaml
    index_path = Path("cortex-registry/_cortex-master/index.yaml")
    with open(index_path) as f:
        index = yaml.safe_load(f)
    
    # Load plan-summary.json
    json_path = Path("cortex-registry/_cortex-master/dashboard/data/plan-summary.json")
    with open(json_path) as f:
        dashboard = json.load(f)
    
    # Verify phase counts
    index_total = index["statistics"]["total_phases"]
    dashboard_total = dashboard["statistics"]["total_phases"]
    assert index_total == dashboard_total, \
        f"Phase count mismatch: index={index_total}, dashboard={dashboard_total}"
    
    # Verify active phases count
    index_active = index["statistics"]["active_phases"]
    dashboard_active = len(dashboard["active_phases"])
    assert index_active == dashboard_active, \
        f"Active phase count mismatch: index={index_active}, dashboard={dashboard_active}"
    
    print("✅ Dashboard sync verification PASSED")
    return True

if __name__ == "__main__":
    verify_dashboard_sync()
```

