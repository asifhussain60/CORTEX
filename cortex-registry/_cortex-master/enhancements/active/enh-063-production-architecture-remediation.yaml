      - "Production deployment unprotected"
      - "SOC 2 compliance violation"
    
    effort_estimate: "2 days"
    
    affected_components:
      - "cortex/mcp/server.py"
      - "cortex/mcp/gateway.py"
      - ".vscode/settings.json (MCP config)"
    
    implementation_steps:
