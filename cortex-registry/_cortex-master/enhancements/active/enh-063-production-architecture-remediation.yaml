        tasks:
          - "JWT tokens with VS Code integration"
          - "Token validation middleware"
          - "Token refresh mechanism"
      
      - title: "Implement authentication layer"
        tasks:
          - "Add auth middleware to MCP gateway"
          - "Integrate with VS Code auth provider"
          - "Update all 73 tool invocations"
      
      - title: "Add authorization audit log"
        tasks:
