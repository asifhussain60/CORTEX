    title: "Command Injection in cortex_refactor"
    confidence: 10.0
    status: "🔴 CRITICAL"
    
    problem: |
      Shell commands built from unsanitized input enable arbitrary code execution.
      subprocess(shell=True) used with user-provided input.
    
    current_behavior: "subprocess(shell=True) with user input allows injection"
    proposed_behavior: "Use subprocess(shell=False) with argument lists"
    
    impact:
      - "Attackers can execute arbitrary commands"
      - "Server compromise possible"
      - "OWASP A03 critical vulnerability"
    
    effort_estimate: "4 hours"
    
    affected_components:
      - "cortex/mcp/tools/refactor_tool.py"
      - "cortex/refactoring/semantic_refactor.py"
    
    implementation_steps:
      - title: "Replace shell=True with argument lists"
        tasks:
          - "Convert all subprocess calls to shell=False"
          - "Use list arguments instead of string commands"
          - "Add input validation layer"
      
      - title: "Add security tests"
        tasks:
          - "Test injection attempts (expect failure)"
          - "Validate argument escaping"
          - "Fuzz testing with malicious inputs"
    
    acceptance_criteria:
      - "No shell=True usage with user input"
      - "All commands use argument lists"
      - "Security tests for injection attempts pass"
    
    testing_strategy:
      - "Unit: Input validation rejects malicious patterns"
      - "Security: Injection attempts fail gracefully"
      - "Regression: Existing refactoring operations work"
    
    references:
