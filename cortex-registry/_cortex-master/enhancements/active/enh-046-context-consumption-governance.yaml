  - id: "phase-2"
    name: "Token Optimizer Extension (Copilot-Bound Context)"
    duration: "Week 2"
    status: "PLANNED"
    start_date: "2026-02-10"
    estimated_completion: "2026-02-14"
    depends_on:
      - "phase-1"
    
    architecture_rationale: |
      The existing Token Optimizer achieves 95-96% compression for INTERNAL
      composite requests. Phase 2 EXTENDS this to Copilot-bound context.
      
      Instead of creating a separate ContextBudgetManager, we extend the
      Token Optimizer's budget allocation to include a "copilot_exit_budget"
      that enforces limits on what leaves CORTEX.
    
    deliverables:
      - file: "cortex/brain/core/copilot_context_optimizer.py"
        estimated_lines: 250
        purpose: "Extends Token Optimizer for Copilot-bound context"
        features:
          - "optimize_for_copilot(context: Dict) → OptimizedContext"
          - "estimate_copilot_tokens(content: str) → int (tiktoken-based)"
          - "enforce_exit_budget(context: Dict, budget: int = 20000) → Dict"
          - "compress_orchestrator_output(output: Dict, orchestrator: str) → Dict"
          - "session_token_tracker(session_id: str) → cumulative token usage"
        design_notes: |
          This is NOT a standalone class — it extends the Token Optimizer
          pipeline with a new Stage 6: Copilot Exit Optimization.
          
          Existing stages (internal):
            Stage 1: Tier Identification & Loading
            Stage 2: Rule Compression (20-30%)
            Stage 3: AC-ID Condensing (10-15%)
            Stage 4: Template Reference (15-25%)
            Stage 5: Knowledge Abstraction (10-20%)
          
          NEW stage (Copilot-bound):
            Stage 6: Copilot Exit Optimization (60%+ reduction)
              - Compress LENS context (agent summaries, not full files)
              - Compress governance results (pass/fail, not full analysis)
              - Compress challenge context (verdict, not full reasoning)
              - Track cumulative session tokens (prevent acceleration)
        tests: 20
        coverage_target: "90%"
      
      - file: "tests/unit/brain/test_copilot_context_optimizer.py"
        estimated_lines: 350
        purpose: "Token Optimizer extension validation"
        test_categories:
          - "Copilot token estimation accuracy (4 tests)"
          - "Exit budget enforcement (4 tests)"
          - "Orchestrator output compression (5 tests, one per orchestrator type)"
          - "Session cumulative tracking (3 tests)"
          - "Edge cases: empty context, oversized, nested (4 tests)"
    
    dependencies_to_add:
      - name: "tiktoken"
        version: ">=0.5.0"
        purpose: "Accurate GPT tokenization for Copilot context estimation"
        install: "pip install tiktoken"
    
    integration_points:
      - location: "cortex/interaction/context_synthesis_gateway.py"
        method: "synthesize()"
        integration: "Call budget_manager.estimate_tokens() before synthesis"
      
      - location: "cortex/orchestrators/core/interaction_orchestrator.py"
        method: "execute_turn()"
        integration: "Initialize budget_manager at turn start"
    
    acceptance_criteria:
      - "Token estimation accuracy within ±5% of actual GPT tokens"
      - "Budget violations caught before Copilot handoff"
      - "All 15 tests passing with 90% coverage"
      - "Integration tests with Phase 1 metrics collection"
  
  - id: "phase-3"
