      Each orchestrator produces different types of context.
      The synthesizer provides per-type compression strategies:
      - Agent/prompt files: Extract purpose + key API surface (99.8% reduction)
      - YAML knowledge: Filter by active intent type (97% reduction)
      - Source code: AST summary (class/method signatures only) (98% reduction)
      - Governance results: Pass/fail + violated rules only (90% reduction)
      - Challenge context: Verdict + top alternative only (85% reduction)
      - LENS context: Classification + confidence only (95% reduction)
    
