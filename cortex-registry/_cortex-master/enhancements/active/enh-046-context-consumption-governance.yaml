          - "MasterOrchestrator exit gate tests (7)"
          - "MCP tool session tracking tests (5)"
          - "Cross-orchestrator synthesis tests (10 — one per orchestrator)"
          - "Cumulative session token tracking tests (5)"
          - "Fail-safe tests: synthesis error → original context returned (5)"
    
    cache_configuration:
      max_entries: 1000
      ttl_seconds: 600  # 10 minutes
      eviction_policy: "LRU"
