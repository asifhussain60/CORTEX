# ═══════════════════════════════════════════════════════════════════════════════
# OVERFLOW HANDLING STRATEGY (WARN + LOG Approach)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Source: chat01.txt - User specification for graceful degradation on budget violations
# Purpose: Continue operations with warnings rather than blocking on context overflows
#
overflow_handling_strategy:
  approach: "WARN + LOG"
  philosophy: "Graceful degradation with observability"
  
  on_budget_exceeded:
    display_warning:
      enabled: true
      format: "⚠️ Context load exceeded budget ({actual}/{budget} tokens). Review markdown links."
      visibility: "User-facing in Copilot Chat"
      example: "⚠️ Context load exceeded budget (347/250 tokens). Review markdown links."
    
    continue_operation:
      enabled: true
      rationale: "Blocking would break user workflow - better to warn and continue"
      fallback: "Use truncated/synthesized context if available"
    
    log_to_governance_db:
      enabled: true
      table: "audit_log"
      fields:
        - "timestamp: datetime"
        - "operation: 'context_budget_exceeded'"
        - "actual_tokens: int"
        - "budget_tokens: int"
        - "overflow_amount: int"
        - "session_id: str"
        - "user_request: str (truncated to 200 chars)"
        - "orchestrator: str"
      purpose: "Enable AUDIT mode detection and trend analysis"
    
    violation_tracking:
      window: "24 hours"
      threshold: 3  # violations within window
      action: "trigger_auto_audit"
      prometheus_metrics:
        - name: "cortex_budget_violations_24h"
          type: "gauge"
          description: "Rolling count of violations in 24h window"
          labels: ["orchestrator", "session_id"]
        
        - name: "cortex_auto_audit_triggers_total"
          type: "counter"
          description: "Number of auto-audits triggered by 3-strike rule"
          labels: ["trigger_reason"]
    
    three_strike_rule:
      description: "3+ violations in 24h → automatic AUDIT mode trigger"
      trigger_conditions:
        - "violations_count >= 3"
        - "within_window: 24 hours"
        - "status: 'auto_audit_triggered'"
      
      auto_audit_behavior:
        command: "cortex_audit --mode governance --focus context_efficiency --period 24h"
        report_location: ".cortex/audit/context-efficiency-YYYYMMDD-HHMMSS.json"
        notification: "Send to governance dashboard + Slack #cortex-alerts"
        
        analysis_includes:
          - "Top 5 violating orchestrators"
          - "Most loaded files (>5 refs)"
          - "Cache miss patterns"
          - "Compression ratio degradation"
          - "Synthesis time spikes"
        
        recommendations:
          - "Increase cache TTL for frequently referenced files"
          - "Add file-specific synthesis rules"
          - "Refactor high-context orchestrators"
          - "Update TOKEN_OPTIMIZER_CONFIG thresholds"

  implementation_requirements:
    - file: "cortex/brain/core/token_optimizer.py"
      method: "optimize_context()"
      changes: "Add overflow detection + warning emission + governance.db logging"
    
    - file: "cortex/infrastructure/enhanced_audit_logger.py"
      method: "log_budget_violation()"
      changes: "New method for budget overflow logging with 24h window tracking"
    
    - file: "cortex/orchestrators/core/master_orchestrator.py"
      method: "coordinate_operation()"
      changes: "Catch ContextBudgetExceededError → warn + log + continue (not block)"
    
    - file: "cortex/observability/governance_dashboard.py"
      changes: "Add 24h violation gauge widget + auto-audit trigger history"
  
  testing:
    unit_tests:
      - "test_overflow_warning_display (cortex warns user on overflow)"
      - "test_overflow_continues_operation (operation not blocked)"
      - "test_overflow_logs_to_governance_db (audit trail captured)"
      - "test_three_strike_detection (3 violations within 24h)"
      - "test_auto_audit_trigger (audit triggered on 3rd strike)"
      - "test_prometheus_metrics_updated (violation count incremented)"
    
    integration_tests:
      - "test_e2e_overflow_to_auto_audit (full 3-strike → audit → report cycle)"
      - "test_overflow_during_chat_session (Copilot Chat displays warning)"
      - "test_governance_db_query_violations (AUDIT can retrieve violations)"

