# Root Cause (Evidence: chat01.md deep analysis)
root_cause:
  problem: |
    chat01.md reveals ACCELERATING summarization towards the end:
    - Line 809: "Summarized conversation history" (1st in final section)
    - Line 827: "Summarized conversation history" (2nd, 18 lines later)
    - Line 835: "Summarized conversation history" (3rd, 8 lines later)
    
    This proves CUMULATIVE token exhaustion, not just per-turn overload.
    Each turn adds unsynthesized context:
    - LENS context (full agent files, YAML rules, source code)
    - Challenge context (disagreement analysis, alternatives)
    - Governance context (enforcement results, audit trail)
    - Knowledge context (45+ YAML files, domain practices)
    
    The Token Optimizer (95-96% compression) only optimizes CORTEX's
    internal composite requests. The COPILOT-BOUND context — which is
    the response that gets displayed in chat — has 0% compression.
    
    Result: ~65KB context per turn (3.25x over 20KB budget)
    → GitHub Copilot exhausted after 200 lines of conversation
    → Summarization accelerates: 200→18→8 lines between events
  
  why_not_caught:
    - "Token Optimizer scope was INTERNAL only (Brain composite requests)"
    - "No EXIT gate validates context BEFORE Copilot handoff"
    - "No observability (metrics, dashboards) for Copilot-bound context"
    - "Each orchestrator assumes its context is small enough"
    - "Cumulative effect invisible without session-level analysis"
  
  why_accelerating: |
    Copilot maintains conversation history in its context window.
    Each new turn = previous history + new CORTEX context.
    Without synthesis:
    - Turn 1: 65KB new context → OK (within window)
    - Turn 5: 65KB × 5 = 325KB cumulative → Summarization starts
    - Turn 8: History compressed + 65KB new → Rapid summarization
    - Turn 10: History barely fits → 3 summarizations in 35 lines

