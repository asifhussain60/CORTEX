  - id: "phase-4"
    name: "Exit Gate Integration (MasterOrchestrator + ALL Orchestrators)"
    duration: "Week 4"
    status: "PLANNED"
    start_date: "2026-02-24"
    estimated_completion: "2026-02-28"
    depends_on:
      - "phase-1"
      - "phase-2"
      - "phase-3"
    
    architecture_rationale: |
      This is the CRITICAL phase. The ContextSynthesisGateway is wired as
      an EXIT GATE in MasterOrchestrator.execute_operation() — the single
      point through which ALL CORTEX responses flow before reaching Copilot.
      
      Because MasterOrchestrator is the final aggregation point for ALL
      orchestrators (InteractionOrchestrator, IntentRouter, ChallengeEngine,
      EnforcementOrchestrator, TDD, Refactoring, Documentation, Onboarding),
      a SINGLE integration point automatically covers EVERY request type.
      
      Integration point:
        MasterOrchestrator.execute_operation() → return result
        BECOMES:
        MasterOrchestrator.execute_operation() → synthesize(result) → return
    
    deliverables:
      - file: "cortex/brain/core/context_synthesis_gateway.py"
        estimated_lines: 300
        purpose: "EXIT GATE: synthesize ALL orchestrator outputs before Copilot"
        features:
          - "synthesize(context: Dict, session_id: str) → SynthesizedContext"
          - "Orchestrates: CopilotContextOptimizer → Synthesizer → Cache → Metrics"
          - "Pre-synthesis validation: Estimate raw tokens"
          - "Post-synthesis verification: Confirm compression targets met"
          - "Session-aware: Tracks cumulative tokens across turns"
          - "Fail-safe: Returns original context if synthesis errors"
        tests: 30
        coverage_target: "90%"
      
      - file: "cortex/brain/core/context_cache_layer.py"
        estimated_lines: 200
        purpose: "LRU cache with TTL (10 minutes)"
        features:
          - "get(cache_key: str) → Optional[SynthesizedContext]"
          - "set(cache_key: str, context: SynthesizedContext, ttl: int)"
          - "invalidate(cache_key: str)"
          - "get_stats() → CacheStats (hit rate, size, evictions)"
        tests: 20
        coverage_target: "90%"
      
      - file: "cortex/orchestrators/core/master_orchestrator.py"
        modifications: "EXIT GATE integration in execute_operation()"
        purpose: "Single integration point for ALL orchestrators"
        changes:
          - location: "execute_operation() — after Stage 4 Execution, before return"
          - integration: |
              # ═══════════════════════════════════════════════════════════════
              # ENH-046: Context Synthesis Exit Gate (Token Optimizer Extension)
              # EVERY orchestrator output passes through here automatically
              # ═══════════════════════════════════════════════════════════════
              if self._context_gateway:
                  result = self._context_gateway.synthesize(
                      context=result,
                      session_id=self._session_id,
                      orchestrator_name=operation_name
                  )
        tests: "15 integration tests"
      
      - file: "cortex/mcp/cortex_tools.py"
        modifications: "Session tracking in CORTEXProcessRequestTool"
        purpose: "Track session tokens across MCP tool invocations"
        changes:
          - location: "CORTEXProcessRequestTool.execute()"
