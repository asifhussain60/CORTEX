# AUDIT Mode Integration
audit_integration:
  check_name: "P1: Context Consumption Governance (ENH-046)"
  location: ".github/prompts/cortex-architect.prompt.md lines 372, 505-587"
  trigger: "Every AUDIT mode execution"
  
  procedure:
    step_1:
      action: "Scan chat session files"
      location: "docs/archive/workspaces/*.md"
      metrics:
        - "Count 'Summarized conversation history' events"
        - "Count file references (Read \\[)"
        - "Calculate lines per summarization"
        - "Estimate context size per turn"
    
    step_2:
      action: "Calculate violation severity"
      thresholds:
        critical: "Summarizations >3 OR context >50KB"
        high: "Summarizations >1 OR context >30KB"
        medium: "Context >20KB"
        low: "Within targets"
    
    step_3:
      action: "Auto-fix if violations detected"
      conditions:
        - "Violations detected: Deploy ContextSynthesisGateway (Phase 4)"
        - "Phase 4 incomplete: Report status + ETA"
        - "All clear: Report metrics + compliance"
  
  report_format: |
    ### P1: Context Consumption Governance ✅/❌
    
    **Status:** {PASS|FAIL|DEGRADED}
    
    **Metrics:**
