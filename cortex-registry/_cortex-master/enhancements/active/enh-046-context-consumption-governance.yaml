              # Pass session_id to MasterOrchestrator for cumulative tracking
              # This prevents the ACCELERATION pattern seen in chat01.md
              session_id = context.get("session_id", str(uuid4()))
        tests: "5 integration tests"
      
      - file: "tests/integration/test_context_synthesis_integration.py"
        estimated_lines: 500
        purpose: "End-to-end integration validation across ALL orchestrators"
        test_categories:
          - "Gateway end-to-end tests (10)"
