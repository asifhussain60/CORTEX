# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

problem_analysis:
  summary: |
    Copilot (and AI assistants generally) edit files section-by-section without 
    full-file awareness. This leads to accumulating technical debt:
    - Duplicate sections (GAP-001 appeared 3x in copilot-instructions.md)
    - Version mismatches (header v8.0, footer v7.0)
    - Contradictory content across sections
    - Bloat from never-cleaned orphaned content
    
  evidence:
    source_file: "chat01.md"
    observed_issues:
      - issue: "Triple duplicate GAP-001 sections"
        lines_wasted: 350
        root_cause: "Edit added section without checking if it existed"
      - issue: "MCP Detection pseudo-code duplicated"
        lines_wasted: 200
        root_cause: "No cross-reference validation before edit"
      - issue: "Version mismatch header/footer"
        root_cause: "Edit touched header, never checked footer"
      - issue: "Quick Commands duplicated"
        lines_wasted: 30
        root_cause: "No full-file scan before adding content"
    
  total_waste: "1,041 lines (52% of original file)"
  
  impact:
    - "Increased token consumption (bloated files in context)"
    - "Maintenance burden (finding canonical version)"
    - "Confusion (contradictory rules in same file)"
    - "Technical debt accumulation over time"

# ============================================================================
# SOLUTION: CHANGE COHERENCE ENGINE
# ============================================================================

solution:
  name: "ChangeCoherenceEngine"
  type: "Orchestrator + Validation Layer"
  
  architecture:
    description: |
      Three-phase coherence enforcement around every file modification:
      
      1. PRE-EDIT: Load full file context + detect existing structure
      2. EDIT: Apply change with cross-reference awareness
      3. POST-EDIT: Validate coherence + best practice compliance
      
    flow: |
      User Request
           │
           ▼
      IntentRouter (IMPLEMENT/FIX/REFACTOR)
           │
           ▼
      ChangeCoherenceEngine.pre_edit()
           │
           ├── ContextCrystallizationLayer.load_full_file()
           ├── StructureAnalyzer.detect_sections()
           ├── DuplicateScanner.find_existing_patterns()
           └── BestPracticeLoader.load_relevant_rules()
           │
           ▼
      TDDOrchestrator / RefactoringOrchestrator (apply edit)
           │
           ▼
      ChangeCoherenceEngine.post_edit()
           │
           ├── CoherenceValidator.check_duplicates()
           ├── VersionConsistencyChecker.validate()
           ├── CrossReferenceValidator.detect_contradictions()
           └── BestPracticeCompliance.verify()
           │
           ▼
      Result (PASS/FAIL with remediation)

  components:
    existing_reused:
      - name: "ContextCrystallizationLayer"
        location: "cortex/orchestrators/context_crystallization/"
        purpose: "Pre-warms full file context asynchronously"
        reuse: "Direct - call crystallize() before edit"
        
      - name: "CrossReferenceValidator"
        location: "cortex/validation/cross_reference_validator.py"
        purpose: "Detects contradictions across files"
        reuse: "Extend - add intra-file contradiction detection"
        
      - name: "RefactoringOrchestrator"
        location: "cortex/orchestrators/refactoring_orchestrator.py"
        purpose: "Handles REFACTOR intents"
        reuse: "Coordinate - CCE wraps refactoring operations"
        
      - name: "Knowledge YAMLs"
        location: "cortex/knowledge/best-practices/"
        purpose: "40+ best practice guides"
        reuse: "Load relevant rules: refactoring.yaml, clean-code.yaml"
        
      - name: "EnforcementOrchestrator"
        location: "cortex/governance/"
        purpose: "7-agent pre-execution gate"
        reuse: "CCE becomes 8th agent for edit coherence"
        
      - name: "HolisticValidationOrchestrator"
        location: ".github/agents/core/"
        purpose: "Phase 48 pre-implementation validation"
        reuse: "Complementary - runs BEFORE CCE, different scope"
    
    new_components:
      - name: "ChangeCoherenceEngine"
        location: "cortex/orchestrators/coherence/change_coherence_engine.py"
        purpose: "Main orchestrator coordinating pre/post edit validation"
        methods:
          - "pre_edit(file_path: Path, proposed_changes: List[Change]) -> PreEditContext"
          - "post_edit(file_path: Path, changes_applied: List[Change]) -> CoherenceReport"
          - "validate_coherence(file_content: str) -> ValidationResult"
        
      - name: "StructureAnalyzer"
        location: "cortex/orchestrators/coherence/structure_analyzer.py"
        purpose: "Detect file structure (sections, headers, version markers)"
        methods:
          - "analyze_structure(content: str) -> FileStructure"
          - "detect_sections(content: str) -> List[Section]"
          - "find_version_markers(content: str) -> List[VersionMarker]"
        
      - name: "DuplicateScanner"
        location: "cortex/orchestrators/coherence/duplicate_scanner.py"
        purpose: "Find duplicate/similar content before adding more"
        methods:
          - "scan_for_duplicates(content: str, pattern: str) -> List[DuplicateMatch]"
          - "calculate_similarity(text_a: str, text_b: str) -> float"
          - "suggest_consolidation(duplicates: List[DuplicateMatch]) -> ConsolidationPlan"
        
      - name: "CoherenceValidator"
        location: "cortex/orchestrators/coherence/coherence_validator.py"
        purpose: "Post-edit validation for coherence"
        methods:
          - "validate_no_new_duplicates(before: str, after: str) -> ValidationResult"
          - "validate_version_consistency(content: str) -> ValidationResult"
          - "validate_cross_references(content: str) -> ValidationResult"
        
      - name: "BestPracticeCompliance"
        location: "cortex/orchestrators/coherence/best_practice_compliance.py"
        purpose: "Check edits against knowledge YAML rules"
        methods:
          - "load_relevant_practices(file_type: str) -> List[Practice]"
          - "check_compliance(changes: List[Change], practices: List[Practice]) -> ComplianceReport"

