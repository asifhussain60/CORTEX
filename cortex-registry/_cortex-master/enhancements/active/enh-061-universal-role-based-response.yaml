# ============================================================================
# USER REQUIREMENTS (ORIGINAL REQUEST)
# ============================================================================
user_requirements:
  original_request: |
    1. Generate role-based response templates for various IT roles:
       - Business leader, product owner, scrum master, dev manager, tech lead,
         software engineer, business analyst, etc.
    
    2. Each response tailored to role (business context vs technical details)
    
    3. Create intelligent reusable response snippets that can be stitched intelligently
    
    4. Final response checked for duplicates, repetitions
    
    5. Prefer summary responses (15-20 seconds to read)
    
    6. Use comprehension-based reading time (not token count)
    
    7. Visual formatting: font size separations, colors, icons (professional, not excessive)
    
    8. Use this response system across ALL of CORTEX
    
    9. Full vacuum of legacy snippets and conflicting code

  user_decision:
    original_plan: "Create new role-based template system from scratch"
    challenge: "Why rebuild when BlockComposer exists?"
    user_response: "I was wrong. I accept your recommendation."
    approved_approach: "Enhance BlockComposer + vacuum legacy systems"
    additional_requirements:
      - "Think of other IT roles that could benefit from CORTEX"
      - "Ensure overlap in snippets (reusability across roles)"
      - "Do not include roles that CORTEX cannot help"
      - "Comprehension-based (not token-based) reading time"
      - "Visual formatting: font size, colors, icons (professional)"
      - "All of CORTEX uses this system"
      - "Full vacuum of legacy snippets and conflicting code"

# ============================================================================
# SOLUTION DESIGN
# ============================================================================
solution:
  overview: |
    Enhance existing BlockComposer with 4 new capabilities:
    
    1. **15 IT Roles** — Add 10 new roles to existing 5 (73% block reuse)
    2. **Comprehension-Based Summaries** — 15-20 second reading time targets
    3. **Professional Visual Standards** — Font hierarchy + minimal icons + colors
    4. **Legacy Vacuum** — Remove 2,400 LOC duplicates (6 files)
    
    Enhancement Strategy:
      ENHANCE (not rebuild) → VISUAL STANDARDS → VACUUM LEGACY → CORTEX MIGRATION → VERIFY
    
    Why Enhancement (not new system):
      - BlockComposer production-ready (81 tests passing)
      - 7 atomic blocks with BlockRegistry
      - BlockComposer.compose() supports lego-style composition
      - BlockCache with LRU + TTL
      - Just needs: 10 new roles + visual profiles + cleanup

  architecture:
    existing_components:
      - name: "BlockComposer"
        status: "ENHANCE"
        file: "cortex/orchestrators/response/template_blocks.py"
        changes:
          - "Add 10 new BlockRole enums"
          - "Add role-specific block presets"
          - "Add comprehension-based max_reading_time parameter"
      
      - name: "BlockRegistry"
        status: "ENHANCE"
        file: "cortex/orchestrators/response/template_blocks.py"
        changes:
          - "Register role-specific presets"
          - "Add get_preset_for_role() method"
      
      - name: "RoleVerbosityProfiles"
        status: "ENHANCE"
        file: "cortex/orchestrators/response/role_verbosity_profiles.py"
        changes:
          - "Add 10 new role profiles"
          - "Add comprehension_time_target field"
    
    new_components:
      - name: "VisualFormattingProfile"
        status: "CREATE"
        file: "cortex/orchestrators/response/visual_formatting_profiles.py"
        purpose: "Professional visual standards (fonts, colors, icons)"
        methods:
          - "get_font_hierarchy() → FontSizes"
          - "get_color_palette() → ProfessionalColors"
          - "validate_icon_usage(response) → IconValidationResult"
      
      - name: "ComprehensionOptimizer"
        status: "CREATE"
        file: "cortex/orchestrators/response/comprehension_optimizer.py"
        purpose: "Calculate and enforce 15-20 second reading times"
        methods:
          - "calculate_reading_time(text, code_blocks, tables) → seconds"
          - "optimize_for_reading_time(content, target_seconds) → optimized"
          - "validate_comprehension(response) → ComprehensionReport"
    
    vacuum_targets:
      - file: "cortex/orchestrators/response/copilot_chat_templates.py"
        loc: 697
        action: "DELETE"
        reason: "Duplicates BlockComposer (5 templates vs 7+ blocks)"
        replacement: "Use BlockComposer.compose() with role presets"
      
      - file: "cortex/orchestrators/response/response_formatting_engine.py"
        loc: ~400
        action: "DELETE"
        reason: "Duplicates UnifiedResponseComposer"
        replacement: "Use UnifiedResponseComposer.format_response()"
      
      - file: "cortex/orchestrators/response/multi_role_response_engine.py"
        loc: 605
        action: "CONSOLIDATE"
        reason: "Overlaps with RoleVerbosityProfiles + BlockComposer"
        replacement: "Thin adapter to BlockComposer (100 LOC max)"

