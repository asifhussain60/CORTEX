# ============================================================================
# VISUAL FORMATTING STANDARDS
# ============================================================================
visual_standards:
  font_hierarchy:
    title:
      size: "28px"
      weight: 700
      scan_time: "2 seconds"
    
    section:
      size: "22px"
      weight: 600
      scan_time: "1.5 seconds"
    
    subsection:
      size: "18px"
      weight: 600
      scan_time: "1 second"
    
    body:
      size: "16px"
      weight: 400
      scan_time: "standard reading speed"
  
  color_palette:
    primary:
      hex: "#00D4FF"
      usage: "Action items, key metrics"
      max_per_response: 5
    
    success:
      hex: "#10B981"
      usage: "Completed items, positive signals"
      max_per_response: 3
    
    warning:
      hex: "#F59E0B"
      usage: "Cautions, medium priority"
      max_per_response: 3
    
    danger:
      hex: "#EF4444"
      usage: "Critical issues, blockers"
      max_per_response: 2
    
    secondary:
      hex: "#8B5CF6"
      usage: "Architecture, design elements"
      max_per_response: 3
  
  icon_usage:
    allowed:
      - icon: "🟢"
        purpose: "Success indicator"
        max: 1
      
      - icon: "🔴"
        purpose: "Critical blocker"
        max: 1
      
      - icon: "⚡"
        purpose: "Key action"
        max: 1
    
    forbidden:
      - "Decorative emojis"
      - "Multiple icons per line"
      - "Celebration emojis (🎉 🚀 🎊)"
  
  comprehension_formula:
    formula: "reading_time = (token_count / 5) + (code_blocks * 3) + (tables * 2)"
    target: "≤20 seconds for 80% of responses"
    optimization:
      - "Truncate low-priority sections if > target"
      - "Use tables instead of paragraphs (faster scan)"
      - "Bold key metrics (faster recognition)"

