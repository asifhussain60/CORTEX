# ============================================================================
risks:
  - risk: "Breaking changes to existing code"
    likelihood: HIGH
    impact: HIGH
    mitigation:
      - "Incremental wave-based rollout (4 parallel tracks)"
      - "Adapter pattern preserves old signatures"
      - "Feature flags for gradual cutover"
  
  - risk: "Test coverage loss during consolidation"
    likelihood: MEDIUM
    impact: HIGH
    mitigation:
      - "Behavioral contract tests before consolidation"
      - "Require 85%+ coverage before deleting orchestrator"
      - "Multi-cycle TDD ensures quality"
  
  - risk: "Performance regression from EventBus"
    likelihood: LOW
    impact: MEDIUM
    mitigation:
      - "EventBus already tested at 1000+ concurrent requests"
      - "Performance tests in Cycle 2"
      - "< 200ms latency SLA enforced"
  
  - risk: "Integration issues with MCP adapters"
    likelihood: MEDIUM
    impact: MEDIUM
    mitigation:
      - "MCP adapter layer isolates changes"
      - "Adapter pattern maintains interface stability"
      - "Integration tests cover MCP tool invocations"

