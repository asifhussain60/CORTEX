  integration:
    - "TDDOrchestrator emits TEST_FAILURE"
    - "RefactoringOrchestrator emits REFACTOR_REGRESSION"
    - "EnforcementOrchestrator emits GOVERNANCE_VIOLATION"
    - "MCP tools: cortex_debug_auto_inject, cortex_debug_auto_cleanup"
  
  quality:
