# TEST CASES (High-Value)
# ============================================================================
test_cases:
  p0_critical:
    - name: "test_debugger_auto_injects_on_test_failure"
      scenario: "TDDOrchestrator runs test, test fails"
      expected: "Markers injected at failure location within 500ms"
      validation: "Check file contains CORTEX_DEBUG_START marker"
      value: 5
    
    - name: "test_markers_include_failure_context"
      scenario: "Test fails with AssertionError"
      expected: "Marker includes: test name, expected vs actual, local variables"
      value: 5
    
    - name: "test_auto_cleanup_removes_markers_when_tests_pass"
      scenario: "Debug session → fix issue → tests pass"
      expected: "Markers for session removed automatically"
      value: 5
  
  p1_high:
    - name: "test_refactor_regression_triggers_markers_at_hot_path"
      scenario: "Refactoring increases latency 15ms"
      expected: "Markers at hot path with timing data"
      value: 4
    
    - name: "test_pre_commit_hook_blocks_commit_with_markers"
      scenario: "Developer attempts: git commit"
      expected: "Commit blocked, message: 'Remove CORTEX_DEBUG markers first'"
      value: 4
    
    - name: "test_time_based_cleanup_notifies_after_24_hours"
      scenario: "Markers present for 24 hours"
      expected: "Developer notified: 'Debug session stale, cleanup?'"
      value: 3

# ============================================================================
# INTEGRATION WITH ENH-087
# ============================================================================
integration_enh_087:
  usage_pattern: |
    # ENH-087 Track 1, Cycle 2: MasterOrchestrator performance test fails
    
    1. TDDOrchestrator runs: test_master_orchestrator_latency_under_200ms
    2. Test fails: Actual latency = 245ms
    3. TDDOrchestrator emits: TEST_FAILURE event
    4. DebuggerOrchestrator receives event
    5. Markers injected at execute_operation() method
    6. Developer opens master_orchestrator.py
    7. Sees markers with context:
       - Latency: 245ms (target: <200ms)
       - Hot path: Stage 2 (intent verification)
       - Recommendation: Apply Phase 49 CCL
    8. Developer applies CCL, re-runs test
    9. Test passes: Latency = 145ms
    10. Auto-cleanup removes markers
  
  benefits:
    - "Zero manual debug commands during ENH-087"
    - "Performance regressions caught immediately"
    - "Context-rich markers (not just line numbers)"
    - "Auto-cleanup after fix (no marker pollution)"

# ============================================================================
# RISKS & MITIGATION
# ============================================================================
risks:
  - risk: "Markers injected in wrong location (false positive)"
    likelihood: MEDIUM
    mitigation:
      - "Smart traceback parsing (skip test framework frames)"
      - "Confidence score per injection (low confidence → ask user)"
      - "Developer can override via MCP tool"
  
  - risk: "Marker pollution (cleanup fails)"
    likelihood: LOW
    mitigation:
      - "3-layer cleanup: on_success, pre-commit, time-based"
      - "Monitoring: alert if markers > 24 hours old"
  
  - risk: "Performance overhead from EventBus"
    likelihood: LOW
    mitigation:
      - "EventBus already tested at 1000+ events/sec"
      - "Async marker injection (non-blocking)"
      - "Impact: <50ms per debug session"

