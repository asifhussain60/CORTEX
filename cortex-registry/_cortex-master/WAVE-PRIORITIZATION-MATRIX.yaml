# ============================================================================
# ROI SCORING MODEL
# ============================================================================

scoring_model:
  name: "Composite ROI Score"
  formula: "(impact * 0.35) + (effort_inverse * 0.25) + (strategic_value * 0.20) + (unblocking * 0.20)"
  scale: "0.0 - 10.0"
  thresholds:
    critical: ">= 9.5"  # Tier 1 Foundation
    high: "9.0 - 9.4"   # Tier 2 High-Value
    medium: "8.5 - 8.9" # Tier 3 Consolidation
    low: "< 8.5"        # Deferred to WAVE-3/4/5
    
  components:
    impact:
      weight: 0.35
      description: "User-facing value + system quality improvement"
      scale: "1-10"
      
    effort_inverse:
      weight: 0.25
      description: "10 - (weeks * 2)"
      scale: "1-10"
      
    strategic_value:
      weight: 0.20
      description: "Foundational enablement for other work"
      scale: "1-10"
      
    unblocking:
      weight: 0.20
      description: "Number of dependent waves unlocked"
      scale: "1-10"

