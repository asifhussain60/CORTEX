# ============================================================================
# TRACK 1: VERSION NUMBER ELIMINATION (P0-BLOCKING)
# ============================================================================

track_1_version_cleanup:
  name: "Version Number Elimination"
  priority: "P0-CRITICAL"
  duration: "2-3 hours"
  roi_score: 10.0
  
  problem_statement: |
    CORE-035 violation: Version-numbered files create ambiguity about
    canonical implementation. Production code should never have _v2, _v3
    suffixes. Version control (git) handles versioning, not filenames.
    
  violations_detected:
    count: 2
    severity: "P0-GOVERNANCE"
    rule_violated: "CORE-035: Single Canonical Implementation"
    
  files_to_remediate:
    - file_id: "V1"
      current_path: "cortex/intelligence/intent_classifier_v2.py"
      target_path: "cortex/intelligence/intent_classifier.py"
      action: "RENAME + UPDATE IMPORTS"
      reason: "Enhanced v2 is canonical, supersedes domain_brain/intent_classifier.py"
      supersedes:
        - "cortex/brain/domain_brain/intent_classifier.py (old, less capable)"
      imports_to_update:
        - file: "cortex/intelligence/clarification_reducer.py"
          line: 14
          current: "from cortex.intelligence.intent_classifier_v2 import"
          replace: "from cortex.intelligence.intent_classifier import"
      tests_to_update:
        - file: "tests/unit/intelligence/test_intent_classifier_v2.py"
          target: "tests/unit/intelligence/test_intent_classifier.py"
      documentation:
        - "Update docstring to remove v2 reference"
        - "Update AC-ID to reflect canonical status"
        
    - file_id: "V2"
      current_path: "cortex/models/dashboard_schema_v3.py"
      target_path: "cortex/models/dashboard_schema.py"
      action: "CONSOLIDATE OR SUPERSEDE"
      reason: "v3 is canonical dashboard schema"
      conflict_check:
        existing_file: "cortex/models/dashboard_schema.py"
        action_if_exists: "COMPARE + MERGE BEST"
        merge_strategy: |
          1. Compare v3 vs non-versioned
          2. If v3 is superset → DELETE non-versioned, rename v3
          3. If both have unique content → MERGE into canonical
          4. If v3 is inferior → Keep non-versioned, delete v3
      imports_to_update:
        - file: "cortex/visualization/json_data_generator.py"
          line: 24
          current: "cortex/models/dashboard_schema_v3.py"
          replace: "cortex/models/dashboard_schema.py"
      tests_to_update:
        - file: "tests/unit/visualization/test_dashboard_schema_v3.py"
          target: "tests/unit/visualization/test_dashboard_schema.py"
          
  execution_steps:
    step_1_analysis:
      name: "Conflict Detection"
      action: |
        For each versioned file:
        1. Check if non-versioned equivalent exists
        2. If yes: Compare implementations (which is canonical?)
        3. If no: Safe rename to non-versioned
        4. Document decision in AC marker
        
    step_2_rename:
      name: "File Rename (git mv)"
      commands:
        - "git mv cortex/intelligence/intent_classifier_v2.py cortex/intelligence/intent_classifier.py"
        - "git mv tests/unit/intelligence/test_intent_classifier_v2.py tests/unit/intelligence/test_intent_classifier.py"
        - "# dashboard_schema_v3.py requires conflict check first"
        
    step_3_imports:
      name: "Update Import Statements"
      files:
        - "cortex/intelligence/clarification_reducer.py"
        - "cortex/visualization/json_data_generator.py (if schema renamed)"
        
    step_4_docstrings:
      name: "Remove Version References"
      action: |
        Update docstrings to remove "v2", "v3" references.
        Replace with "canonical implementation" or similar.
        
    step_5_tests:
      name: "Run Test Suite"
      command: "pytest tests/unit/intelligence/ tests/unit/visualization/ tests/unit/models/ -v"
      exit_criteria: "100% pass rate"
      
    step_6_commit:
      name: "Commit with AC Marker"
      message: |
        fix: Eliminate version-numbered files (CORE-035 compliance)
        
        AC_START: AC-WAVE11-T1-001
        
        Remediation:
        - Renamed intent_classifier_v2.py → intent_classifier.py
        - Renamed dashboard_schema_v3.py → dashboard_schema.py
        - Updated 2 import statements
        - Updated 2 test files
        
        Reason: CORE-035 requires single canonical implementation.
        Version control (git) handles versioning, not filenames.
        
        AC_COMPLETE: AC-WAVE11-T1-001 ✅
        
  success_criteria:
    - metric: "Version-numbered files in cortex/"
      before: 2
      after: 0
      improvement: "100% elimination"
    - metric: "Import statement errors"
      before: "unknown"
      after: 0
      improvement: "All imports resolved"
    - metric: "Test pass rate"
      before: "unknown"
      after: "100%"
      improvement: "All tests passing"
      
  risks:
    - risk: "Breaking imports in other files"
      mitigation: "Grep search for all imports, update comprehensively"
    - risk: "Test failures after rename"
      mitigation: "Run targeted test suite after each rename"

