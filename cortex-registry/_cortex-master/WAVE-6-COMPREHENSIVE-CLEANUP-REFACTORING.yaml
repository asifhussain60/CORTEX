  # ENH-082: Response Template System Integration (From chat01.md)
  # -------------------------------------------------------------------------
  - enhancement_id: "ENH-082"
    title: "Response Template System Integration"
    authority: "chat01.md analysis"
    status: "ready"
    priority: "P1-HIGH"
    roi: 8.5
    estimated_effort: "8-11 days"
    
    problem:
      current_state: "72 orchestrator templates built but ZERO production usage"
      gaps:
        - "Dual registry (orchestrator vs role) with no bridge"
        - "Integration layer missing - orchestrators hardcode responses"
        - "Templates are passive data structures"
        - "Maintenance burden grows linearly with orchestrators"
      impact: "Extensibility poor, scalability issues, inconsistent responses"
    
    solution:
      approach: "Unified Response Engine"
      benefits:
        - "Bridges both registries (role + orchestrator templates)"
        - "Automatic role detection from intent (IMPLEMENT→ENGINEER, etc.)"
        - "Template fusion: merge role structure + orchestrator content"
        - "Variable auto-binding: context → template variables (80%+ automatic)"
        - "Centralized composition: single path, no duplication"
        - "Zero orchestrator code changes (backward compatible)"
    
    waves:
      - wave: "W1-Foundation"
        duration: "3 days"
        effort: "8-12h"
        deliverables:
          - "Registry audit (map both registries, find overlaps)"
          - "Stale component cleanup (remove orphaned templates)"
          - "Master plan sync (update index.yaml, WAVE-BASED-EXECUTION-PLAN.yaml)"
        tests: 6
        
      - wave: "W2-Engine"
        duration: "3 days"
        effort: "16-20h"
        deliverables:
          - "UnifiedResponseEngine implementation"
          - "Injection point in OrchestratorBaseProtocol"
          - "5 core orchestrators enabled (Master, TDD, LENS, Intent, Challenge)"
        tests: 50
        
      - wave: "W3-Migration"
        duration: "3 days"
        effort: "20-24h"
        deliverables:
          - "Linter + batch migration script"
          - "67 remaining orchestrators migrated"
          - "200+ regression tests"
        tests: 200
        
      - wave: "W4-Polish"
        duration: "2 days"
        effort: "8-10h"
        deliverables:
          - "Developer guide + 5 examples"
          - "Architecture diagrams"
          - "Master plan sync (mark ENH-082 complete)"
        tests: 10
    
    success_metrics:
      - "72/72 orchestrators using UnifiedResponseEngine"
      - "0 hardcoded response strings in orchestrators"
      - "200+ tests passing (100% coverage)"
      - "Developer guide with 5 working examples"
      - "Linter enforcing template usage"
    
    file_reference: "cortex-registry/_cortex-master/phases/active/ENH-082-response-template-integration-wave.yaml"
  
  # -------------------------------------------------------------------------
  # ENH-084: Standard Phase Creation Practices (New - From chat01.md insight)
  # -------------------------------------------------------------------------
  - enhancement_id: "ENH-084"
    title: "Standard Phase Creation Practices"
    authority: "chat01.md - 'should be standard practice when phases are created'"
    status: "design"
    priority: "P1-HIGH"
    roi: 9.5  # Highest ROI - prevents future technical debt
    estimated_effort: "3-4 days"
    
    problem:
      current_state: "Ad-hoc phase creation without cleanup/migration standards"
      gaps:
        - "No standard template for wave-based phase specs"
        - "Cleanup/migration not baked into phase design"
        - "Registry sync manual and inconsistent"
        - "No linting for phase spec quality"
      impact: "Technical debt accumulates, orphaned components, plan drift"
    
    solution:
      approach: "Codify ENH-082 cleanup pattern as standard practice"
      components:
        - "Phase Specification Template (YAML)"
        - "Mandatory Wave Structure (Foundation → Core → Migration → Polish)"
        - "Auto-Cleanup Requirements (vacuum stage per wave)"
        - "Registry Sync Enforcement (linter + CI checks)"
        - "Phase Creation CLI (guided wizard)"
    
    deliverables:
      phase_template:
        file: ".github/templates/phase-specification-template.yaml"
        sections:
          - "Metadata (ID, title, priority, ROI, effort)"
          - "Problem statement (current state, gaps, impact)"
          - "Solution approach (benefits, architecture)"
          - "Wave breakdown (4 waves minimum: Foundation/Core/Migration/Polish)"
          - "Cleanup requirements (vacuum stage per wave)"
          - "Registry sync checkpoints (index.yaml, WAVE-BASED-EXECUTION-PLAN.yaml)"
          - "Success metrics (quantifiable)"
          - "Test requirements (coverage targets)"
      
      phase_cli:
        file: "cortex/cli/phase_creator.py"
        commands:
          - "cortex phase create --id ENH-XXX --title 'Feature Name'"
          - "cortex phase validate --spec phase-XXX.yaml"
          - "cortex phase lint --check-cleanup"
          - "cortex phase sync --update-registry"
      
      linter:
        file: "cortex/validation/phase_spec_linter.py"
        checks:
          - "Wave structure complete (4 waves minimum)"
          - "Cleanup stage present in each wave"
          - "Registry sync checkpoints defined"
          - "Test targets defined (coverage ≥ 80%)"
          - "ROI score justified with evidence"
          - "Dependencies mapped correctly"
      
      documentation:
        file: ".github/agents/core/phase-creation-standards.md"
        content:
          - "Phase lifecycle overview"
          - "Wave-based design principles"
          - "Cleanup/migration requirements"
          - "Registry synchronization protocol"
          - "5 worked examples (ENH-082, Phase-48, Phase-71, etc.)"
    
    integration:
      with_cortex_architect:
        trigger: "When cortex-architect.prompt.md creates new phase"
        workflow: |
          1. cortex-architect detects IMPLEMENT/DESIGN intent for new phase
          2. Auto-invoke phase_creator.py with guided wizard
          3. Generate phase spec from template with user input
          4. Run phase_spec_linter.py to validate
          5. Sync with registry (update index.yaml)
          6. Display wave execution plan + ROI estimate
          7. User approves → phase enters active/ folder
      
      with_agents:
        - "cortex-architect.md: Auto-use phase template on DESIGN intent"
        - "cortex-phase-resolver.md: Validate phase specs during resolution"
        - "cortex-vacuum.md: Use cleanup requirements from phase spec"
        - "cortex-auditor.md: Verify cleanup stages executed"
    
    success_metrics:
      - "Phase specification template in .github/templates/"
      - "phase_creator.py CLI functional (5 commands)"
      - "phase_spec_linter.py enforcing 8 checks"
      - "phase-creation-standards.md with 5 examples"
      - "100% of new phases (post-ENH-084) use template"
      - "0 orphaned components in phases created post-ENH-084"
  
  # -------------------------------------------------------------------------
  # ENH-085: Completed Phase Cleanup Audit (New - Comprehensive)
  # -------------------------------------------------------------------------
  - enhancement_id: "ENH-085"
    title: "Completed Phase Cleanup Audit & Migration"
    authority: "Vision: 'comprehensive final refactoring and cleanup phase'"
    status: "design"
    priority: "P1-HIGH"
    roi: 8.8
    estimated_effort: "4-5 days"
    
    problem:
      current_state: "35+ completed phases with varying degrees of cleanup"
      gaps:
        - "Unknown count of orphaned components from completed phases"
        - "No systematic audit of completed phase artifacts"
        - "Stale files in cortex/ and cortex_brain/ from old phases"
        - "Registry completed/ folder not synchronized with active/"
      impact: "Codebase bloat, confusion, maintenance burden"
    
    solution:
      approach: "Systematic audit + cleanup + migration of all completed phases"
      stages:
        - "S1: Audit (Identify all completed phases + artifacts)"
        - "S2: Classification (Essential vs Stale vs Orphaned)"
        - "S3: Migration (Move completed phases to registry/completed/)"
        - "S4: Cleanup (Remove stale/orphaned components)"
        - "S5: Verification (Ensure no regressions)"
    
    audit_methodology:
      discovery:
        - "Scan cortex-registry/_cortex-master/phases/active/ for status=completed"
        - "Scan cortex/ for file timestamps > 6 months with 0 imports"
        - "Scan cortex_brain/ for onboarded repos with 0 dashboard access"
        - "Git log analysis: files with 0 commits in last 90 days"
        - "Import graph analysis: modules with 0 inbound references"
      
      classification:
        essential: "Core infrastructure used in production"
        stale: "Completed phases not moved to completed/ folder"
        orphaned: "Files/modules with 0 references, 6+ months old"
        deprecated: "Functionality replaced by newer implementations"
      
      cleanup_rules:
        essential: "Keep, add tests if coverage < 80%"
        stale: "Move to completed/ folder, update registry"
        orphaned: "Archive to _workspaces/__cleanup-archive/"
        deprecated: "Delete after verifying 0 imports"
    
    deliverables:
      - "Audit report (CSV: file, classification, last_used, action)"
      - "Cleanup script (cortex/scripts/cleanup_completed_phases.py)"
      - "Migration script (move phases to completed/)"
      - "Verification tests (ensure no regressions after cleanup)"
      - "Updated registry (completed/ folder synchronized)"
    
    success_metrics:
      - "100% of completed phases in registry/completed/ folder"
      - "0 files in cortex/ with 0 imports + age > 6 months"
      - "Codebase size reduced by 15-25%"
      - "All tests passing after cleanup (0 regressions)"
      - "Audit report reviewed and approved"
  
  # -------------------------------------------------------------------------
  # ENH-086: Architecture Alignment Verification (New - Comprehensive)
  # -------------------------------------------------------------------------
  - enhancement_id: "ENH-086"
    title: "Architecture Alignment Verification & Remediation"
    authority: "Vision: 'get completed work aligned with existing architecture'"
    status: "design"
    priority: "P1-HIGH"
    roi: 9.0
    estimated_effort: "3-4 days"
    
    problem:
      current_state: "Unknown drift between completed phases and architectural standards"
      gaps:
        - "No systematic verification that completed phases follow CORTEX patterns"
        - "Possible violations of CORE rules in older phases"
        - "Response format inconsistencies across orchestrators"
        - "MCP-FIRST violations in pre-Phase-53 code"
      impact: "Architectural erosion, inconsistent behavior, technical debt"
    
    solution:
      approach: "Automated alignment verification + remediation plan"
      verification_layers:
        - "L1: CORE Rules Compliance (30 rules)"
        - "L2: MCP-FIRST Architecture (no direct file ops in IMPLEMENT)"
        - "L3: Response Format Standards (headers, DoR, inline-only)"
        - "L4: Orchestrator Patterns (protocol adherence)"
        - "L5: Test Coverage (≥80% for all modules)"
      
      remediation_strategy:
        detect: "Run alignment checks on all cortex/ modules"
        classify: "P0 (blocking), P1 (high), P2 (nice-to-have)"
        fix: "Auto-fix where possible, manual for P0/P1"
        verify: "Re-run alignment checks + full test suite"
    
    alignment_checks:
      core_rules:
        - "CORE-002: No markdown file generation (check all orchestrators)"
        - "CORE-008: TDD mandatory (check all IMPLEMENT flows)"
        - "CORE-029: Response header mandatory (check all orchestrators)"
        - "CORE-030: Implementation Truth (verify with code inspection)"
        - "CORE-035: Single canonical implementation (detect duplicates)"
        - "CORE-048: Holistic validation gate (verify MCP integration)"
      
      mcp_first:
        - "No create_file in IMPLEMENT intent handlers"
        - "No replace_string_in_file in FIX intent handlers"
        - "All file operations route through cortex_process_request"
        - "MCP pre-flight check present in all entry points"
      
      response_format:
        - "Response header present (🧠 CORTEX {operation})"
        - "Orchestrator identified in header"
        - "DoR displayed before execution"
        - "No file generation for reports/summaries"
        - "Inline chat ONLY for all outputs"
      
      orchestrator_patterns:
        - "All orchestrators extend OrchestratorBaseProtocol"
        - "execute_with_protocol() implemented correctly"
        - "Context loading follows pattern"
        - "Error handling via try/except with logging"
        - "AC markers for audit trail"
    
    deliverables:
      - "Alignment checker (cortex/validation/architecture_alignment_checker.py)"
      - "Alignment report (violations by layer, priority, module)"
      - "Auto-fix script (handle 70%+ of violations automatically)"
      - "Manual remediation plan (P0/P1 violations)"
      - "Verification tests (100% alignment post-remediation)"
    
    success_metrics:
      - "100% CORE rules compliance (30/30 rules)"
      - "0 MCP-FIRST violations in production code"
      - "100% orchestrators with correct response format"
      - "100% orchestrators following protocol pattern"
      - "≥80% test coverage across all modules"

