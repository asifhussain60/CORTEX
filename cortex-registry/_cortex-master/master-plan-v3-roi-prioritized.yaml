# ROI Calculation Framework
roi_framework:
  impact_score:
    description: "Business value delivered"
    scale: "1-10"
    factors:
      - "User-facing improvement"
      - "Developer experience gain"
      - "System stability increase"
      - "Governance strengthening"
  
  effort_score:
    description: "Implementation complexity"
    scale: "1-10"
    factors:
      - "Lines of code to change"
      - "Number of components affected"
      - "Test suite additions"
      - "Integration complexity"
  
  roi_formula: "ROI = (Impact Score × 10) / Effort Score"
  
  priority_tiers:
    tier_1_critical: "ROI ≥ 8.0 (Must do now)"
    tier_2_high: "ROI 5.0-7.9 (Next wave)"
    tier_3_medium: "ROI 3.0-4.9 (Future wave)"
    tier_4_low: "ROI < 3.0 (Backlog)"

# Feature-Based Wave Planning (Holistic End-to-End)
