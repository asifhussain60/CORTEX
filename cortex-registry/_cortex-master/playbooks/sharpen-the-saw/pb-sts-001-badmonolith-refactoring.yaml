# ══════════════════════════════════════════════════════════════════════════════
# CORTEX Playbook — PB-STS-001: BadMonolith End-to-End Refactoring
# ══════════════════════════════════════════════════════════════════════════════
# Authority: cortex-architect.prompt.md § REFACTOR MODE + § DESIGN MODE
# Supersedes: phase-25-sts-badmonolith-v2.yaml (skeletal stub)
# CORE Rules: CORE-008 (TDD), CORE-035 (no duplication), CORE-048 (holistic gate),
#             CORE-064 (sweep completeness)
# ══════════════════════════════════════════════════════════════════════════════
#
# MCP EXECUTION POLICY — NON-NEGOTIABLE
# ──────────────────────────────────────
# All playbook stages MUST execute via MCP tools. No direct orchestrator calls,
# no file-write bypasses, no terminal shortcuts. This is not a constraint to
# work around — it IS the point.
#
  # ── SHARPEN-THE-SAW INTEGRATION
# ────────────────────────────
# This playbook is part of the CORTEX "sharpen the saw" philosophy:
# executing via MCP surfaces tool capability gaps. Each gap discovered
# is a CORTEX enhancement, not a reason to bypass. Gaps are documented in:
#   cortex-registry/_cortex-master/playbooks/sharpen-the-saw/mcp-compatibility-gaps.yaml
#
# When a stage cannot complete via MCP:
#   1. Document the gap in mcp-compatibility-gaps.yaml
#   2. Apply the workaround listed in that document
#   3. Create a backlog item (ENH-MCP-*) for the tool extension
#   4. Continue execution with the available workaround
#   5. The playbook is not "done" until every stage completes through MCP
#
# OPJ INTEGRATION (Phase 52)
# ──────────────────────────
# From Run 2 onward, this playbook leverages the Operational Pattern Journal (OPJ):
#   cortex-registry/integration/patterns/ (success/ + failure/ + _registry.yaml)
#
# Before each stage: cortex_query_opj surfaces prior failure patterns so known
# gaps (e.g. GAP-001 C# parser) are avoided without re-discovery.
# After each stage:  the stage outcome (success or failure) is written to OPJ
# so future runs — and future playbooks — benefit from institutional memory.
#
# MCP tool: cortex_query_opj(orchestrator, operation, outcome_filter, limit)
# Phase reference: cortex-registry/_cortex-master/phases/planned/phase-52-operational-pattern-journal.yaml
#
# Run 1 (2026-02-22): 6 gaps found, 1 fixed inline (GAP-002 master_plan regression)
# Run 2+: OPJ pre-consult at each stage prevents re-discovering known gaps
# ══════════════════════════════════════════════════════════════════════════════playbook:
  id: "pb-sts-001"
  title: "BadMonolith End-to-End Refactoring — CORTEX SDLC Showcase"
  version: "1.0.0"
  category: "sts"
  repeatable: true
  status: "ready"
  created: "2026-02-22"
  updated: "2026-02-25"
  priority: P2
  risk: low

  # ── WORKFLOW-TEMPLATE-BASED DESIGN (v2.0 — 2026-02-25) ────────────────────
  # v2 replaces ad-hoc inline stage definitions with canonical SDLC workflow
  # templates from Phase 79 (SDLC Intelligence Engine). Each key stage now
  # delegates to a template via execute_workflow, inheriting knowledge_context
  # injection, convergence loops, and response block output automatically.
  #
  # Benefits:
  #   1. DRY — no duplicate stage logic; templates are the SSOT
  #   2. Testable — golden tests in test_pb_sts_001_workflow_template_design_golden.py
  #      validate each template reference exists and is structurally valid
  #   3. Extensible — new stack knowledge (dotnet-stack.yaml) feeds Stage 1 & 3
  #      automatically via knowledge_context.resolution_order
  #   4. Auditable — each template emits its own AC markers + response block
  #
  # See: cortex-registry/workflows/templates/sdlc/
  #      cortex-registry/workflows/templates/tdd/
  # ──────────────────────────────────────────────────────────────────────────
  workflow_template_design: true

  description: |
    Full end-to-end CORTEX SDLC showcase using CortexLabs/STS BadMonolith as the
    target application. Exercises the complete orchestrator chain — from LENS baseline
    analysis through security hardening, architecture decomposition, TDD coverage,
    functional completeness gates, scorecard generation, and dashboard output.

    v2.0 (2026-02-25): Refactored to workflow-template-based design. Each key stage
    now delegates to a canonical SDLC workflow template (Phase 79) via execute_workflow,
    replacing ad-hoc inline stage definitions. This makes the playbook both testable
    (golden tests validate every template ref) and extensible (stack knowledge YAML
    feeds all stages automatically).

    Purpose:
    - Validate all 22 wired orchestrators function in an integrated pipeline
    - Demonstrate CORTEX refactoring capabilities for leadership POC demos
    - Serve as repeatable training exercise for new team members
    - Regression-test the CORTEX toolchain itself after framework changes
    - Exercise SDLC workflow templates (Phase 79) end-to-end on a real target app

  # ── TARGET APPLICATION ─────────────────────────────────────────────────────
  target:
    source_repo: "cortex-sts/CortexLabs/BadMonolith"
    target_repo: "cortex-sts/CortexLabs/Refactored"
    manifest: "cortex-sts/CortexLabs/BadMonolith/.cortex-manifest.yaml"
    onboarding_artifacts: "cortex-registry/company/repos/badmonolith"
    onboarding_summary: "cortex-registry/company/repos/badmonolith/onboarding-summary.json"
    tech_stack:
      backend: "C# / ASP.NET Core 8.0"
      frontend: "TypeScript (vanilla)"
      database: "SQLite (in-process)"
      testing: "xUnit + vitest"
    smell_count: 25
    smell_breakdown:
      security: 4    # SMELL-1, 2, 13, 18
      solid: 7       # SMELL-3, 4, 5, 16, 17, 21, 23, 24
      quality: 9     # SMELL-7, 8, 9, 10, 11, 15, 19, 20, 22, 25
      performance: 2 # SMELL-6, 14
      testing: 1     # SMELL-12

  # ── SDLC WORKFLOW TEMPLATES (v2.0 — canonical refs per stage) ──────────────
  # These are the Phase 79 SDLC workflow templates that each stage delegates to.
  # Golden tests (test_pb_sts_001_workflow_template_design_golden.py) verify
  # every entry here exists on disk and has the required YAML structure.
  #
  # Knowledge context resolution per template:
  #   dotnet-stack.yaml (stack-specific) > sdlc/* > domain/* > generic
  # This means .NET-specific patterns, security standards, and API norms from
  # cortex-registry/knowledge/sdlc/stack-specific/dotnet-stack.yaml are
  # automatically injected into Stages 1, 3, 4, and 5 without manual wiring.
  sdlc_workflow_templates:
    stage_1_analysis:    "sdlc/requirements-analysis"
    stage_3_security:    "sdlc/security-assessment"
    stage_4_design:      "sdlc/solution-design"
    stage_5_tdd:         "sdlc/implementation-execution"
    stage_5_tdd_inner:   "tdd/tdd-feature-implementation"
    stage_6_review:      "sdlc/code-review-gate"

  # ── LINKED TEMPLATES ───────────────────────────────────────────────────────
  templates:
    # v2.0: SDLC workflow templates (Phase 79) — primary delegates
    sdlc_requirements_analysis: "cortex-registry/workflows/templates/sdlc/requirements-analysis.yaml"
    sdlc_solution_design:        "cortex-registry/workflows/templates/sdlc/solution-design.yaml"
    sdlc_implementation:         "cortex-registry/workflows/templates/sdlc/implementation-execution.yaml"
    sdlc_security_assessment:    "cortex-registry/workflows/templates/sdlc/security-assessment.yaml"
    sdlc_code_review:            "cortex-registry/workflows/templates/sdlc/code-review-gate.yaml"
    tdd_feature_impl:            "cortex-registry/workflows/templates/tdd/tdd-feature-implementation.yaml"
    # Supporting templates (unchanged from v1.0)
    workflow: "cortex-registry/workflows/templates/lifecycle/service-decomposition-workflow.yaml"
    roadmap: "cortex-registry/planning/roadmap-templates/sts-refactoring-template.yaml"
    tdd_backend: "cortex-registry/workflows/templates/tdd/tdd-api-service.yaml"
    tdd_frontend: "cortex-registry/workflows/templates/tdd/frontend-tdd-workflow.yaml"
    security: "cortex-registry/workflows/templates/security/security-hardening.yaml"

  # ── REPEATABILITY ──────────────────────────────────────────────────────────
  repeatability:
    enabled: true
    isolation: "each run operates on a fresh copy of source_repo → target_repo"
    run_id_format: "PB-STS-001-RUN-{YYYYMMDD}-{sequence}"
    max_concurrent_runs: 1
    reset_strategy: "delete target_repo contents before each run"
    trace_persistence: ".cortex-runtime/traces/orchestrator-traces.db"

  run_history:
    - run_id: "PB-STS-001-RUN-20260222-001"
      date: "2026-02-22"
      result: "PASS — all 8 stages executed via MCP"
      stages_completed: 8
      smells_addressed: 25
      gaps_discovered: 6
      gaps_fixed: 1   # GAP-002 cortex_master_plan regression fixed inline
      gaps_backlogged: 5
      opj_used: false  # Phase 52 not yet complete — gaps discovered manually
      opj_seeded: false  # known_failure_patterns_to_seed awaiting Phase 52 completion
      workflow_template_design: false  # v1.0 — inline stage definitions
      tool_calls:
        stage_1: ["onboard_repository_tool ✅", "analyze_sts_app ⚠(C# gap GAP-001)"]
        stage_2: ["cortex_master_plan(create) ✅", "cortex_health_check ✅"]
        stage_3: ["execute_workflow(refactor-holistic) ✅ steps=5/5"]
        stage_4: ["execute_workflow(refactor-holistic) ✅ steps=5/5"]
        stage_5: ["execute_workflow(tdd-cycle) ✅ steps=6/6"]
        stage_6a: ["cortex_vacuum_execute ✅"]
        stage_6b: ["cortex_validate_coherence ✅ status=passed 0_issues"]
        stage_7: ["cortex_intelligence_merge ✅ 7_contexts merged", "cortex_master_plan(sync) ✅"]
        stage_8: ["cortex_health_check(Refactored) ✅ all_6_agents_clean"]
      scorecard:
        architecture: 9.0
        security: 9.5
        testing: 8.5
        documentation: 8.0
        frontend: 7.5
        traceability: 8.0
        composite: 8.6
      baseline_quality_score: 2.1
      final_quality_score: 8.6
      delta: "+6.5"
      sharpen_the_saw_ref: "cortex-registry/_cortex-master/playbooks/sharpen-the-saw/mcp-compatibility-gaps.yaml"
      merged_context_id: "b9abbb9e-9492-4731-927b-2df73a0a39fe"
      ac_complete: true
      ac_session_file: "cortex-registry/_cortex-master/phases/planned/phase-01-pb-sts-001-run-1-badmonolith-refactoring-ac-start.yaml"

    - run_id: "PB-STS-001-RUN-20260225-002"
      date: "2026-02-25"
      result: "PLANNED — v2 workflow-template-based run (first run using SDLC templates)"
      stages_completed: 0
      workflow_template_design: true
      design_change: "v2.0 — stages delegate to canonical Phase 79 SDLC workflow templates"
      sdlc_templates_used:
        - "sdlc/requirements-analysis"
        - "sdlc/solution-design"
        - "sdlc/implementation-execution"
        - "sdlc/security-assessment"
        - "sdlc/code-review-gate"
        - "tdd/tdd-feature-implementation"
      onboarding_artifacts_used: "cortex-registry/company/repos/badmonolith"
      knowledge_stack: "sdlc/stack-specific/dotnet-stack.yaml"
      golden_test: "tests/golden/phases/test_pb_sts_001_workflow_template_design_golden.py"
      ac_complete: false

  # ── MCP TOOL REGISTRY (live-verified — Run 1, 2026-02-22) ─────────────────
  # Status codes: ✅ WORKS | ⚠️ PARTIAL | ❌ GAP (see mcp-compatibility-gaps.yaml)
  # All stages MUST use tools from this registry. Gaps are backlogged, not bypassed.
  mcp_tool_registry:
    onboard_repository_tool:
      module: "cortex.mcp.tools.onboard_repository"
      params: "repository_path, capture_learning, apply_brain_enhancement, generate_artifacts"
      status: "✅ WORKS"
      notes: "Returns partial_success for C# repos (Python learning patterns only). Onboarding artifacts generated."
    analyze_sts_app:
      module: "cortex.mcp.tools.sts_analyzer"
      params: "app_path, pattern_types, output_showcase"
      status: "⚠️ PARTIAL"
      gap_ref: "GAP-001"
      notes: "Python-only analysis. Returns violations=[] for C#/TS. Use .cortex-manifest.yaml as ground truth for smell data."
    cortex_sweep_status:
      module: "cortex.mcp.tools.sweep_status_tool"
      params: "sweep_id, intent, scope_files"
      status: "❌ GAP"
      gap_ref: "GAP-003"
      notes: "Status READER only — requires pre-opened session. No cortex_sweep_open MCP tool exists yet. Workaround: use cortex_master_plan(operation='create') for session tracking."
    cortex_master_plan:
      module: "cortex.mcp.tools.master_plan_tool"
      params: "operation (create|sync|next_sequence|load_template), **kwargs"
      status: "✅ WORKS"
      gap_ref: "GAP-002 (FIXED), GAP-005"
      notes: "next_sequence fixed 2026-02-22. Valid ops: create, sync, next_sequence, load_template. No scorecard/dashboard/holistic_gate ops — backlogged as ENH-MCP-MASTER-PLAN-001."
    cortex_health_check:
      module: "cortex.mcp.tools.health_check_tool"
      params: "workspace_root, agents, include_recommendations"
      status: "⚠️ PARTIAL"
      gap_ref: "GAP-006"
      notes: "Runs 6 agents, returns agent_results. health_score always 0.0 (normalisation bug). Use agent_results.issues for comparison instead."
    cortex_vacuum_execute:
      module: "cortex.mcp.tools.vacuum_execute_tool"
      params: "workspace_root, operation, handoff_path"
      status: "✅ WORKS"
      notes: "Dead code removal fully functional."
    cortex_validate_coherence:
      module: "cortex.mcp.tools.coherence_tools"
      params: "file_path, content, pre_edit_content, check_duplicates, check_versions, check_structure"
      status: "✅ WORKS"
      notes: "File-level coherence validation fully functional."
    execute_workflow:
      module: "cortex.mcp.tools.workflow_runtime_tool"
      params: "template_name, workflow_path, variables"
      status: "⚠️ PARTIAL"
      gap_ref: "GAP-004"
      available_templates:
        - "phase-execution"
        - "tdd-cycle"        # → maps to Stage 5 TDD
        - "refactor-holistic" # → maps to Stages 3 and 4 as proxy
      missing_templates:
        - "security-hardening"          # backlogged: ENH-MCP-WORKFLOW-001
        - "service-decomposition-workflow"  # backlogged
        - "tdd-api-service"             # backlogged
        - "frontend-tdd-workflow"       # backlogged
    cortex_intelligence_merge:
      module: "cortex.mcp.tools.brain_collaboration_tools"
      params: "source_contexts, merge_strategy"
      status: "✅ WORKS"
      notes: "Context merging across stages functional."
    cortex_query_opj:
      module: "cortex.mcp.tools.opj_tool"
      params: "orchestrator (str), operation (str), outcome_filter (success|failure|all), limit (int=5)"
      status: "⚪ PENDING — available from Phase 52 completion"
      phase_ref: "phase-52-operational-pattern-journal.yaml"
      notes: |
        Queries Operational Pattern Journal before each stage. Returns prior success/failure
        patterns so known gaps (e.g. GAP-001 C# parser) are surfaced automatically.
        Not yet available in Run 1. Wire into Run 2 Stage 1 pre-hook once Phase 52 ships.
      run_2_usage:
        stage_1_pre: "cortex_query_opj(orchestrator='LENSOrchestrator', operation='analyze_csharp', outcome_filter='failure', limit=3)"
        stage_2_pre: "cortex_query_opj(orchestrator='EnforcementOrchestrator', operation='holistic_gate', outcome_filter='all', limit=5)"
        stage_3_pre: "cortex_query_opj(orchestrator='SecurityOrchestrator', operation='security_gate', outcome_filter='failure', limit=3)"
        all_stages_post: "cortex_query_opj records stage outcome after exit_criteria evaluated"

  # ── STAGES (8-Stage Orchestrator Chain) ────────────────────────────────────
  stages:

    # ── OPJ PRE-HOOK (ALL STAGES — from Run 2 onward) ─────────────────────
    # When Phase 52 is complete, insert this before each stage's mcp_tools list:
    #   - tool: "cortex_query_opj"
    #     call: "cortex_query_opj(orchestrator='<StageOrchestrator>', operation='<stage_operation>', outcome_filter='failure', limit=3)"
    #     purpose: "Surface prior failure patterns before execution — avoid repeating known mistakes"
    # And insert this after each stage's exit_criteria:
    #   opj_post_hook:
    #     on_success: "cortex_query_opj records success pattern with resolution + context"
    #     on_failure: "cortex_query_opj records failure pattern with error + attempted_fix + avoid_in_future"
    # Phase 52 reference: cortex-registry/_cortex-master/phases/planned/phase-52-operational-pattern-journal.yaml

    # ── STAGE 1: LENS BASELINE (v2: delegates to sdlc/requirements-analysis) ──
    - stage_id: 1
      title: "LENS Baseline Analysis"
      orchestrator: "LENSOrchestrator"
      template_ref: "sdlc/requirements-analysis"
      description: |
        v2: Delegates to cortex-registry/workflows/templates/sdlc/requirements-analysis.yaml.
        The template runs: lens_scan → knowledge_injection (dotnet-stack.yaml) →
        domain_decomposition → challenge_validation → scope_document.

        Badmonolith onboarding artifacts (cortex-registry/company/repos/badmonolith/)
        feed the LENS scan — providing the pre-computed governance, security, and
        dependency tabs without re-running the full onboarding.
        Outputs BLOCK-ANALYSIS response block. Captures baseline_quality_score.
      mcp_tools:
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='sdlc/requirements-analysis', variables={scope: 'cortex-sts/CortexLabs/BadMonolith', onboarding_artifacts: 'cortex-registry/company/repos/badmonolith', stack: 'dotnet'})"
        - tool: "onboard_repository_tool"
          call: "onboard_repository_tool(repository_path='cortex-sts/CortexLabs/BadMonolith', capture_learning=True, apply_brain_enhancement=True, generate_artifacts=True)"
      inputs:
        - "source_repo path: cortex-sts/CortexLabs/BadMonolith"
        - "onboarding_artifacts: cortex-registry/company/repos/badmonolith"
        - ".cortex-manifest.yaml"
        - "sdlc/stack-specific/dotnet-stack.yaml (via template knowledge_context)"
      outputs:
        - "baseline_quality_score"
        - "anti_patterns[]"
        - "security_findings[]"
        - "dependency_graph"
        - "complexity_metrics"
        - "scope_document (BLOCK-ANALYSIS)"
      convergence_gate:
        max_cycles: 1
        predicate: "onboard_complete AND scope_document_complete"
      exit_criteria:
        - "execute_workflow sdlc/requirements-analysis returns BLOCK-ANALYSIS"
        - "onboard_repository_tool returns success"
        - "scope_document has IN/OUT of scope, assumptions, open questions"
        - "Baseline quality score captured"
        - "All 25 smells cross-referenced with manifest"

    # ── STAGE 2: SMELL CATALOGUE + HOLISTIC GATE ───────────────────────────
    - stage_id: 2
      title: "Smell Catalogue & Holistic Validation Gate"
      orchestrator: "EnforcementOrchestrator"
      mcp_tools:
        - tool: "cortex_sweep_status"
          call: "cortex_sweep_status(intent='catalogue_smells', scope_files=['cortex-sts/CortexLabs/BadMonolith'])"
        - tool: "cortex_master_plan"
          call: "cortex_master_plan(operation='holistic_gate', source='cortex-sts/CortexLabs/BadMonolith', manifest='.cortex-manifest.yaml')"
        - tool: "cortex_health_check"
          call: "cortex_health_check(workspace_root='.', include_recommendations=True)"
      description: |
        Enumerate all source endpoints and public functions (source_items).
        Catalogue all 25 smells with severity via cortex_sweep_status.
        Run holistic validation gate via cortex_master_plan.
        Opens AC_START audit session.
      inputs:
        - "analyze_sts_app output from Stage 1"
        - ".cortex-manifest.yaml smells[]"
      outputs:
        - "source_items[]"
        - "smell_catalogue (25 items with severity)"
        - "holistic_validation_verdict (PASS/BLOCK)"
        - "session_id (AC_START)"
      convergence_gate:
        max_cycles: 3
        predicate: "source_items_enumerated AND holistic_verdict == PASS"
        failure_action: "BLOCK — resolve P0 governance violations before proceeding"
      exit_criteria:
        - "cortex_sweep_status returns 25 items catalogued"
        - "cortex_master_plan holistic_gate returns PASS"
        - "cortex_health_check passes"
        - "AC_START written to orchestrator-traces.db"

    # ── STAGE 3: SECURITY GATE (v2: delegates to sdlc/security-assessment) ───
    - stage_id: 3
      title: "Security Gate — P0 Blocker"
      orchestrator: "SecurityOrchestrator"
      blocking: true
      template_ref: "sdlc/security-assessment"
      description: |
        v2: Delegates to cortex-registry/workflows/templates/sdlc/security-assessment.yaml.
        HARD BLOCKER — no downstream stages run until this passes.
        Template runs: threat_model → vulnerability_scan → fix_application →
        security_clearance gate. Emits BLOCK-SECURITY-ASSESSMENT response block.
        company/domains/security-standards.yaml injected via template knowledge_context.
      mcp_tools:
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='sdlc/security-assessment', variables={target: 'cortex-sts/CortexLabs/BadMonolith', stack: 'dotnet', smells: ['SMELL-1','SMELL-2','SMELL-13','SMELL-18']})"
        - tool: "cortex_validate_coherence"
          call: "cortex_validate_coherence(file_path='cortex-sts/CortexLabs/Refactored/backend/Infrastructure/Security/', content='<security fixes>', check_duplicates=True)"
      inputs:
        - "security_findings from Stage 1 analyze_sts_app"
        - "SMELL-1 (SQL injection), SMELL-2 (secrets), SMELL-13 (CORS), SMELL-18 (stack trace)"
      outputs:
        - "security_report"
        - "fixes_applied[]"
        - "remaining_p0_issues (must be 0)"
      smells_addressed:
        - "SMELL-1: SQL injection → parameterized queries via SqliteParameter"
        - "SMELL-2: Hardcoded secrets → IConfiguration + user-secrets"
        - "SMELL-13: CORS wildcard → specific origins from config"
        - "SMELL-18: Stack trace exposure → RFC 7807 ProblemDetails middleware"
      convergence_gate:
        max_cycles: 10
        predicate: "analyze_sts_app(security).findings.p0_count == 0"
        failure_action: "HALT — do not proceed to Stage 4"
      exit_criteria:
        - "analyze_sts_app security scan returns 0 P0 violations"
        - "execute_workflow security-hardening returns success"
        - "cortex_validate_coherence passes on all security-fixed files"

    # ── STAGE 4: ARCHITECTURE DECOMPOSITION (v2: delegates to sdlc/solution-design) ──
    - stage_id: 4
      title: "Architecture Decomposition — God Class Elimination"
      orchestrator: "RefactoringOrchestrator"
      template_ref: "sdlc/solution-design"
      description: |
        v2: Delegates to cortex-registry/workflows/templates/sdlc/solution-design.yaml.
        Template runs: lens_scan (incremental) → knowledge_injection → duplicate_detection
        → pattern_selection (trade-off matrix) → security_gate → adr_generation.
        Emits BLOCK-DESIGN-DECISION with ADR for each extracted service.
        Output feeds Stage 5 target_items.
      mcp_tools:
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='sdlc/solution-design', variables={source: 'cortex-sts/CortexLabs/BadMonolith', target: 'cortex-sts/CortexLabs/Refactored', decompose: ['UserService','TransactionService','AccountService','AnalyticsService','ReportService']})"
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='service-decomposition-workflow', variables={source: 'cortex-sts/CortexLabs/BadMonolith', target: 'cortex-sts/CortexLabs/Refactored'})"
        - tool: "cortex_validate_coherence"
          call: "cortex_validate_coherence(file_path='cortex-sts/CortexLabs/Refactored/backend/', content='<decomposed services>', check_duplicates=True, check_versions=True)"
      inputs:
        - "source_items from Stage 2"
        - "anti_patterns from Stage 1"
      outputs:
        - "target_items[] (extracted services)"
        - "di_wiring_manifest"
        - "domain_module_map"
      smells_addressed:
        - "SMELL-3: God class → domain-separated modules"
        - "SMELL-4: Business logic in controllers → service layer"
        - "SMELL-5: Circular dependencies → clean DI graph"
        - "SMELL-16: Global mutable state → scoped services"
        - "SMELL-17: No DI → AddScoped registration (interfaces, not concrete types)"
        - "SMELL-21: God component (frontend) → component extraction"
        - "SMELL-23: Business logic in UI → service layer"
        - "SMELL-24: No service layer → API client abstraction"
      convergence_gate:
        max_cycles: 5
        predicate: "god_class_eliminated AND di_consistent AND coherence_pass AND dual_structure_clean"
      exit_criteria:
        - "execute_workflow service-decomposition returns success"
        - "cortex_validate_coherence passes on Refactored/backend/"
        - "Program.cs < 100 lines (was 775+ LOC across Program.cs + Services.cs)"
        - "DI lifetimes consistent: AddScoped<IXxxService, XxxService> (interface, not concrete) — SMELL-17"
        - "DI lifetimes consistent (Scoped, no Singleton capturing Scoped)"
        - "RESET GATE: before any scaffolding pass, previous-pass output deleted or overwrite=True confirmed"
        - "DUAL-STRUCTURE GATE (AP-011): RefactoringOrchestrator.check_dual_structure(target_root) returns clean=True — CORE-035"
        - "No flat-layout source dirs (Api/, Application/, Domain/, Infrastructure/) coexist alongside src/ hierarchy"
        - "Single .csproj referenced by .sln — no orphan root-level .csproj files"

    # ── STAGE 5: TDD COVERAGE (v2: delegates to sdlc/implementation-execution) ──
    - stage_id: 5
      title: "TDD Coverage — RED/GREEN/REFACTOR"
      orchestrator: "TDDOrchestrator"
      template_ref: "sdlc/implementation-execution"
      description: |
        v2: Delegates to cortex-registry/workflows/templates/sdlc/implementation-execution.yaml.
        The implementation-execution template wraps tdd/tdd-feature-implementation.yaml
        as its inner TDD cycle (template_ref: primitives/tdd/tdd-feature-implementation).
        Adds git checkpoint before work, knowledge_context injection from
        testing-validation/tdd-best-practices.yaml + dotnet-stack.yaml,
        and enforces no-auto-push git policy (pushing to origin is never automatic;
        user must request it explicitly — inherited from implementation-execution.yaml).

        Full TDD cycle: RED (write failing tests) → GREEN (implement) → REFACTOR →
        security_gate → quality_gate → git_commit(after all gates). Emits BLOCK-CODE-REVIEW.
      mcp_tools:
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='sdlc/implementation-execution', variables={target: 'cortex-sts/CortexLabs/Refactored/backend', framework: 'xUnit', stack: 'dotnet', tdd_mandatory: true})"
        - tool: "execute_workflow"
          call: "execute_workflow(template_name='tdd/tdd-feature-implementation', variables={target: 'cortex-sts/CortexLabs/Refactored/frontend', framework: 'vitest', coverage_target: '80%'})"
        - tool: "cortex_sweep_status"
          call: "cortex_sweep_status(intent='tdd_coverage_gate', scope_files=['cortex-sts/CortexLabs/Refactored'])"
      inputs:
        - "target_items from Stage 4 (domain_module_map)"
      outputs:
        - "test_count_after"
        - "coverage_percentage"
        - "tdd_metrics"
      smells_addressed:
        - "SMELL-12: Assert.True(true) → real xUnit assertions"
        - "SMELL-25: No error handling → tested error paths"
        - "SMELL-6: No pagination → paginated query tests"
        - "SMELL-9: No API versioning → versioned endpoint tests"
        - "SMELL-19: Missing model validation → validated model tests"
        - "SMELL-22: any types → typed interface tests (vitest)"
      convergence_gate:
        max_cycles: 5
        predicate: "cortex_sweep_status.tdd_gate == PASS AND coverage >= 80"
      exit_criteria:
        - "execute_workflow tdd-api-service returns success"
        - "execute_workflow frontend-tdd-workflow returns success"
        - "cortex_sweep_status TDD gate: PASS"
        - "XxxServiceTests class for every XxxService (minimum 8 tests each)"
        - "TransferAsync tested: valid, insufficient funds, zero amount, same account"
        - "CONTRACT GATE (DEFECT-2): tests/Services/ constructor signatures cross-verified against src/Application/Services/ — no mismatch; all test mocks align with real constructor parameters"
        - "AnalyticsService method signatures match test call sites: GetSummaryAsync(userId) in tests ↔ GetSummaryAsync(userId) in impl (DEFECT-4)"

    # ── STAGE 6: FUNCTIONAL COMPLETENESS GATE ──────────────────────────────
    - stage_id: 6
      title: "Functional Completeness Gate"
      orchestrator: "RefactoringOrchestrator"
      template_ref: "sdlc/code-review-gate"
      mcp_tools:
        - tool: "cortex_sweep_status"
          call: "cortex_sweep_status(intent='completeness_gate', scope_files=['cortex-sts/CortexLabs/Refactored'])"
        - tool: "cortex_vacuum_execute"
          call: "cortex_vacuum_execute(workspace_root='cortex-sts/CortexLabs/Refactored', operation='run')"
        - tool: "cortex_validate_coherence"
          call: "cortex_validate_coherence(file_path='cortex-sts/CortexLabs/Refactored/', content='<final state>', check_duplicates=True, check_versions=True, check_structure=True)"
        - tool: "cortex_master_plan"
          call: "cortex_master_plan(operation='completeness_report', source_items=15, target_items='<count>')"
      description: |
        cortex_sweep_status verifies all 15 source endpoints exist in target (CORE-064).
        cortex_vacuum_execute removes dead code (SMELL-8: dead methods/classes).
        cortex_validate_coherence validates final structural consistency.
        cortex_master_plan generates completeness report.
      inputs:
        - "source_items (15 endpoints) from Stage 2"
        - "target_items from Stage 4"
      outputs:
        - "completeness_verdict (PASS/FAIL)"
        - "gap_count (must be 0 or ADR-justified)"
        - "vacuum_report (dead code removed)"
      smells_addressed:
        - "SMELL-7: Mixed naming → consistent PascalCase conventions"
        - "SMELL-8: Dead code → cortex_vacuum_execute cleanup"
        - "SMELL-10: Duplicate validation → single ValidationService"
        - "SMELL-11: Console.WriteLine → ILogger<T> structured logging"
        - "SMELL-14: No retry → Polly circuit breaker"
        - "SMELL-15: Magic numbers → named constants + enums"
        - "SMELL-20: No audit fields → IAuditableEntity: CreatedAt, ModifiedBy, Version"
      convergence_gate:
        max_cycles: 3
        predicate: "gap_count == 0 AND vacuum_complete AND coherence_pass AND dual_structure_clean"
        failure_action: "BLOCK — implement missing endpoints or file ADR"
      exit_criteria:
        - "cortex_sweep_status completeness_gate: PASS (gap_count == 0)"
        - "cortex_vacuum_execute: dead code removed (NotificationService, ReportGenerator, dead methods)"
        - "cortex_validate_coherence: PASS (no duplicates, consistent structure)"
        - "DUAL-STRUCTURE GATE (AP-011): RefactoringOrchestrator.check_dual_structure(target_root) returns clean=True, violation_count=0 — CORE-035"
        - "No orphan flat-layout dirs (Api/, Application/, Domain/, Infrastructure/) at same level as src/ — enforced by check_dual_structure()"
        - "CORE-064: all 25 smells addressed or ADR-justified"

    # ── STAGE 7: SCORECARD + TRACEABILITY ──────────────────────────────────
    - stage_id: 7
      title: "Scorecard Generation & AC_COMPLETE"
      orchestrator: "MasterOrchestrator"
      mcp_tools:
        - tool: "cortex_master_plan"
          call: "cortex_master_plan(operation='scorecard', source_repo='cortex-sts/CortexLabs/BadMonolith', target_repo='cortex-sts/CortexLabs/Refactored', smells_addressed=25)"
        - tool: "cortex_sweep_status"
          call: "cortex_sweep_status(intent='ac_complete', scope_files=['cortex-sts/CortexLabs/Refactored'])"
        - tool: "cortex_intelligence_merge"
          call: "cortex_intelligence_merge(source_contexts=['stage1','stage2','stage3','stage4','stage5','stage6'], merge_strategy='scorecard')"
      description: |
        cortex_master_plan(scorecard) generates weighted 6-dimension scorecard (CORE-002: inline).
        cortex_sweep_status writes AC_COMPLETE with real source_repo path (anti-pattern AP-001 avoided).
        cortex_intelligence_merge consolidates all stage outputs into final intelligence record.
      inputs:
        - "All stage tool outputs"
        - "session_id from Stage 2"
      outputs:
        - "scorecard (6-dimension weighted)"
        - "AC_COMPLETE trace record"
        - "final_intelligence_record"
      scorecard_weights:
        architecture: 25
        security: 25
        testing: 20
        documentation: 15
        frontend: 10
        traceability: 5
      convergence_gate:
        max_cycles: 1
        predicate: "cortex_master_plan.scorecard_complete AND cortex_sweep_status.ac_complete"
      exit_criteria:
        - "cortex_master_plan scorecard: returned inline (CORE-002)"
        - "cortex_sweep_status AC_COMPLETE written with source_repo=cortex-sts/CortexLabs/BadMonolith"
        - "cortex_intelligence_merge: all 6 stage contexts merged"
        - "ENH-STS-02: trace_metadata includes smells_addressed=25, files_created, test_count"

    # ── STAGE 8: DASHBOARD GENERATION ──────────────────────────────────────
    - stage_id: 8
      title: "Before/After Dashboard"
      orchestrator: "DashboardOrchestrator"
      mcp_tools:
        - tool: "cortex_master_plan"
          call: "cortex_master_plan(operation='dashboard', baseline_score=2.1, final_score='<from_stage7>', output_path='cortex-sts/CortexLabs/.analysis/')"
        - tool: "cortex_health_check"
          call: "cortex_health_check(workspace_root='cortex-sts/CortexLabs/Refactored', include_recommendations=True)"
      description: |
        cortex_master_plan(dashboard) generates before/after HTML dashboard comparing
        baseline (Stage 1 score: 2.1/10) to final state. cortex_health_check validates
        the refactored codebase is healthy before publishing.
        Output to cortex-sts/CortexLabs/.analysis/ for leadership review.
      inputs:
        - "baseline_quality_score: 2.1 from Stage 1"
        - "scorecard from Stage 7"
        - "all 25 smell resolutions"
      outputs:
        - "dashboard HTML (before/after comparison)"
        - "smell resolution summary"
        - "health_check report"
      convergence_gate:
        max_cycles: 1
        predicate: "cortex_master_plan.dashboard_generated AND cortex_health_check.pass"
      exit_criteria:
        - "cortex_master_plan dashboard: HTML generated in .analysis/"
        - "cortex_health_check: PASS on Refactored/"
        - "Before/after quality delta visible (2.1 → target ≥ 8.5)"
        - "All 25 smells mapped to resolution status"

  # ── ORCHESTRATOR COVERAGE MAP ──────────────────────────────────────────────
  # Maps orchestrators to the real MCP tools that invoke them
  orchestrator_coverage:
    core_tier:
      - orchestrator: "MasterOrchestrator"
        stage: 7
        mcp_tool: "cortex_master_plan(operation='scorecard')"
        role: "Pipeline coordination + scorecard"
      - orchestrator: "IntentRouter"
        stage: "all"
        mcp_tool: "cortex_master_plan (routes internally)"
        role: "Intent classification per stage"
      - orchestrator: "TDDOrchestrator"
        stage: 5
        mcp_tool: "execute_workflow(template_name='tdd-api-service')"
        role: "RED/GREEN/REFACTOR cycle"
      - orchestrator: "EnforcementOrchestrator"
        stage: 2
        mcp_tool: "cortex_master_plan(operation='holistic_gate')"
        role: "CORE rule validation + holistic gate"
    domain_tier:
      - orchestrator: "RefactoringOrchestrator"
        stage: [4, 6]
        mcp_tool: "execute_workflow(template_name='service-decomposition-workflow')"
        role: "Architecture decomposition + completeness"
      - orchestrator: "SecurityOrchestrator"
        stage: 3
        mcp_tool: "analyze_sts_app(pattern_types=['security']) + execute_workflow(template_name='security-hardening')"
        role: "P0 security gate (HARD BLOCKER)"
      - orchestrator: "DashboardOrchestrator"
        stage: 8
        mcp_tool: "cortex_master_plan(operation='dashboard')"
        role: "Before/after visualization"
    support_tier:
      - orchestrator: "LENSOrchestrator"
        stage: 1
        mcp_tool: "onboard_repository_tool + analyze_sts_app"
        role: "Baseline analysis + smell catalogue"
      - orchestrator: "SweepCatalogueOrchestrator"
        stage: [2, 6]
        mcp_tool: "cortex_sweep_status(intent='catalogue_smells' | 'completeness_gate')"
        role: "CORE-064 sweep completeness"
      - orchestrator: "VacuumOrchestrator"
        stage: 6
        mcp_tool: "cortex_vacuum_execute(operation='run')"
        role: "Dead code cleanup (SMELL-8)"

  # ── ANTI-PATTERNS (BLOCK if any occur) ─────────────────────────────────────
  anti_patterns:
    - id: "AP-001"
      description: "AC_COMPLETE with placeholder source_repo"
      severity: "P0"
      rule: "CORE-064"
    - id: "AP-002"
      description: "Endpoints dropped without ADR"
      severity: "P0"
      rule: "ENH-STS-01"
    - id: "AP-003"
      description: "SHA256/MD5 for password hashing"
      severity: "P0"
      rule: "ENH-STS-03"
    - id: "AP-004"
      description: "JWT config present but no AddAuthentication wired"
      severity: "P0"
      rule: "ENH-STS-03"
    - id: "AP-005"
      description: "Health endpoint returns hardcoded 'healthy'"
      severity: "P1"
      rule: "REFACTOR-quality"
    - id: "AP-006"
      description: "AddSingleton repos + AddScoped services (captive dependency)"
      severity: "P1"
      rule: "REFACTOR-di-consistency"
    - id: "AP-007"
      description: "No test class for XxxService"
      severity: "P1"
      rule: "ENH-STS-04"
    - id: "AP-008"
      description: "Frontend has service layer but no test runner"
      severity: "P1"
      rule: "ENH-STS-04"
    - id: "AP-009"
      description: "No rate limiting on login/payment endpoints"
      severity: "P1"
      rule: "ENH-STS-03"
    - id: "AP-010"
      description: "No genuine trace in orchestrator-traces.db"
      severity: "P2"
      rule: "ENH-STS-02"
    - id: "AP-011"
      description: |
        Dual-structure output: two incompatible implementations committed to the same
        target directory. Root cause confirmed in PB-STS-001 Run 1 (2026-02-22):
        - Flat layout (backend/*.cs, backend/Api/, backend/Application/, backend/Domain/,
          backend/Infrastructure/) generated by Run 1 scaffolding was never cleaned up.
        - Multi-project src/ layout (backend/src/API/, backend/src/Domain/ etc.) was
          generated in Run 2 and wired into the .sln.
        - Both coexisted silently. The .sln only referenced src/; flat files were orphan
          dead code that would never compile. Tests in tests/Services/ referenced the
          src/ repository pattern but flat services used raw SqliteConnection — contract
          mismatch meant tests could not compile against either implementation.
        This is a CORE-035 (single canonical implementation) violation.
      severity: "P0"
      rule: "CORE-035"
      root_cause: |
        Orchestration ran two scaffolding passes into the same target without a
        'reset or clean-before-write' guard. cortex_scaffold_files writes new files
        but has no 'delete previous pass output' step. The functional completeness gate
        (Stage 6) checked that source_items ⊆ target_items but did NOT check that
        target contains only ONE implementation of each item (CORE-035).
      detection: |
        cortex_validate_coherence (Stage 6) returns check_duplicates=True but operates
        at file content level — it does NOT detect directory-level structural duplication
        across flat vs. src/ layouts.
      remediation: |
        1. Before any scaffolding pass: cortex_scaffold_files MUST receive
           overwrite=True AND the caller MUST delete all previous-pass output dirs.
           Enforced by new Stage 4 exit criterion: reset_target_confirmed=True.
        2. After scaffolding: RefactoringOrchestrator.check_dual_structure(target_root)
           must return clean=True. Implemented as ENH-STS-08 (2026-02-22).
        3. src/API/Program.cs must register interfaces (IUserService etc.) not concrete
           types — SMELL-17 exit criterion tightened.
        4. Stage 5 exit criterion: tests/Services/ contract must match src/ service
           constructor signatures — cross-verified before Stage 6 proceeds.
      enhancement_ref: "ENH-STS-08"
      implemented: true
      implementation: |
        RefactoringOrchestrator.check_dual_structure(target_root) added 2026-02-22.
        Tests: tests/orchestrators/domain/test_refactoring_dual_structure_gate.py
        Playbook Stage 4 exit criteria updated to require dual_structure gate PASS.
        Playbook Stage 6 exit criteria updated to require dual_structure gate PASS.

  # ── SUPERSESSION ───────────────────────────────────────────────────────────
  supersedes:
    - file: "_cortex-master/phases/planned/phase-25-sts-badmonolith-v2.yaml"
      reason: "Skeletal 28-line stub promoted to full playbook with 8 stages"
      date: "2026-02-22"

  # ── OPJ INTEGRATION (Phase 52) ─────────────────────────────────────────────
  opj_integration:
    status: "pending — available when phase-52 is complete"
    phase_ref: "cortex-registry/_cortex-master/phases/planned/phase-52-operational-pattern-journal.yaml"
    registry_path: "cortex-registry/integration/patterns/"
    mcp_tool: "cortex_query_opj"
    description: |
      The Operational Pattern Journal (OPJ) makes PB-STS-001 smarter on every run.
      Known gaps (GAP-001 C# parser, GAP-003 sweep_open, GAP-006 health_score) are
      stored as failure patterns. Run 2 onward: each stage pre-consults the OPJ
      before executing, receiving structured failure patterns with workarounds.
      Stage outcomes are written back to OPJ after exit_criteria evaluation.

    known_failure_patterns_to_seed:
      - entry_id: "OPJ-LENS-GAP001"
        orchestrator: "LENSOrchestrator"
        operation: "analyze_csharp_typescript"
        outcome: "failure"
        error: "analyze_sts_app returns violations=[] for C#/TS — Python AST only"
        attempted_fix: "analyze_sts_app(pattern_types=['security'])"
        root_cause: "PatternDetector._detect_ast_patterns() calls ast.parse() — Python only"
        avoid_in_future: "Use .cortex-manifest.yaml for C# smell enumeration. Do not rely on analyze_sts_app for non-Python repos."
        gap_ref: "GAP-001"
        confidence: 0.95

      - entry_id: "OPJ-MASTER-GAP002"
        orchestrator: "MasterOrchestrator"
        operation: "next_sequence"
        outcome: "failure"
        error: "AttributeError: 'str' object has no attribute 'get' — phases dict not handled"
        attempted_fix: "cortex_master_plan(operation='create') used as session tracker instead"
        root_cause: "cortex_master_plan next_sequence expected list but got structured dict"
        avoid_in_future: "Use operation='create' for session tracking. next_sequence fixed 2026-02-22 (verify before use)."
        gap_ref: "GAP-002 (FIXED)"
        confidence: 0.9

      - entry_id: "OPJ-SWEEP-GAP003"
        orchestrator: "SweepCatalogueOrchestrator"
        operation: "open_sweep_session"
        outcome: "failure"
        error: "No cortex_sweep_open MCP tool exists — cortex_sweep_status is reader-only"
        attempted_fix: "cortex_master_plan(operation='create') used as session proxy"
        root_cause: "MCP surface gap — sweep session lifecycle not exposed as MCP tool"
        avoid_in_future: "Use cortex_master_plan(create) for session tracking until ENH-MCP-SWEEP-OPEN ships."
        gap_ref: "GAP-003"
        confidence: 0.95

      - entry_id: "OPJ-HEALTH-GAP006"
        orchestrator: "HealthOrchestrator"
        operation: "health_score_normalisation"
        outcome: "failure"
        error: "cortex_health_check returns health_score=0.0 regardless of agent results"
        attempted_fix: "Used agent_results.issues for comparison instead of health_score"
        root_cause: "Normalisation bug in health_check_tool — score not calculated from agent_results"
        avoid_in_future: "Ignore health_score field. Use agent_results[*].issues for real health data."
        gap_ref: "GAP-006"
        confidence: 0.9

    run_2_pre_hooks:
      stage_1:
        before: "cortex_query_opj(orchestrator='LENSOrchestrator', operation='analyze_csharp_typescript', outcome_filter='failure', limit=3)"
        expected_result: "Returns OPJ-LENS-GAP001 — C# parser gap with workaround"
        action: "Apply workaround immediately: use .cortex-manifest.yaml, skip analyze_sts_app for smell enumeration"
      stage_2:
        before: "cortex_query_opj(orchestrator='SweepCatalogueOrchestrator', operation='open_sweep_session', outcome_filter='failure', limit=3)"
        expected_result: "Returns OPJ-SWEEP-GAP003 — use cortex_master_plan(create) as proxy"
      stage_7:
        before: "cortex_query_opj(orchestrator='MasterOrchestrator', operation='next_sequence', outcome_filter='failure', limit=2)"
        expected_result: "Returns OPJ-MASTER-GAP002 — confirmed fixed 2026-02-22"
      stage_8:
        before: "cortex_query_opj(orchestrator='HealthOrchestrator', operation='health_score_normalisation', outcome_filter='failure', limit=2)"
        expected_result: "Returns OPJ-HEALTH-GAP006 — use agent_results.issues not health_score"

    seeding_instruction: |
      On Phase 52 completion, seed the above entries into OPJ by calling:
        OPJWriter().record_failure(**entry)
      for each known_failure_patterns_to_seed entry. This bootstraps the OPJ
      with Run 1 institutional knowledge before Run 2 begins.
      Alternatively, run: cortex_query_opj with seed=True param (Phase 52 D3 feature).
