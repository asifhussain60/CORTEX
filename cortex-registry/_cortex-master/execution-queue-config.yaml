# Silent execution mode
silent_mode:
  enabled: true
  no_user_prompts: true
  no_confirmations: true
  auto_fix_issues: true
  show_progress_bars: true  # ASCII progress bars only
  continuous_heartbeat: false

# Machine continuity enforcement
machine_continuity:
  enabled: true
  enforce_os_arch_match: true
  allow_hostname_variation: true
  heartbeat_interval_seconds: 60
  stale_timeout_seconds: 300

# Monitoring & observability
monitoring:
  enabled: true
  logs_path: "execution/logs"
  checkpoints_path: "execution/checkpoints"
  metrics_path: "execution/metrics"
  
  collect_metrics:
    - test_count_per_stage
    - coverage_per_stage
    - execution_time_per_stage
    - token_usage
    - artifact_size_delta

# Alerts & anomaly detection
alerts:
  enabled: true
  test_pass_rate_drop_threshold: 90  # Alert if <90%
  execution_time_spike_threshold: 2.0  # Alert if 2x slower
  memory_spike_mb: 500

# Summary statistics
