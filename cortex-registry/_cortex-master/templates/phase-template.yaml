# ============================================================================
# CORTEX Phase Template v2.0 (With Enforcement Gates)
# ============================================================================
# Authority: CORE-055 (Pre-Execution Planning Completeness Gate)
# Updated: 2026-02-15 (Added enforcement_gates, security_gates, red_green_refactor)
# Purpose: Standard template for all CORTEX phases with visible governance
# ============================================================================

version: '2.0'
phase_id: phase-NN
title: "Phase Title (60 chars max)"
status: planned  # planned | active | completed | deferred | consolidated
priority: P0     # P0 | P1 | P2
created: '2026-02-15T00:00:00Z'
estimated_effort: "X-Y days"
estimated_tokens: "XXXXX"
roi_score: 85
confidence: 8.5

# ============================================================================
# ENFORCEMENT GATES (Visible Governance)
# ============================================================================
enforcement_gates:
  # Pre-execution validation (before any stage begins)
  pre_execution:
    - gate: "EnforcementOrchestrator"
      agents: 7
      checks:
        - "CORE-008: TDD mandatory (tests before code)"
        - "CORE-011: Type hints on all parameters + returns"
        - "CORE-012: Google-style docstrings"
        - "CORE-013: No bare except blocks"
        - "CORE-026: Git checkpoint before major changes"
        - "CORE-027: AC_START → AC_COMPLETE audit trail"
        - "CORE-028: File naming (kebab-case, no SCREAMING_CASE)"
      blocking: true
      
  # Stage boundary validation (after each stage)
  stage_boundaries:
    - gate: "Phase48HolisticValidation"
      checks:
        - "All tests passing (≥ baseline)"
        - "Lint clean (zero ruff errors)"
        - "Type hints (no new untyped public functions)"
        - "Docstrings (no new undocumented public functions)"
        - "Wiring valid (__wiring_contract__.yaml)"
        - "No CORE-035 violations (duplicates)"
        - "AC markers present (SQLite)"
      blocking: true
      frequency: "per_stage"
      
  # Phase completion validation (before marking complete)
  phase_completion:
    - gate: "ProductionReadinessGate"
      checks:
        - "Full test suite passing (baseline + new tests)"
        - "Coverage ≥ 80% for new code"
        - "No syntax errors (test collection works)"
        - "No import errors (all dependencies resolve)"
        - "Security scan passed (OWASP Top 10)"
        - "Performance benchmarks met"
        - "Documentation complete (inline + architecture)"
      blocking: true

# ============================================================================
# SECURITY GATES (OWASP + Best Practices)
# ============================================================================
security_gates:
  owasp_top_10:
    - check: "injection_prevention"
      scope: "user_inputs"
      enforcement: "blocking"
      validation: "All user inputs validated, sanitized, parameterized"
      
    - check: "authentication"
      scope: "api_endpoints"
      enforcement: "blocking"
      validation: "MCP tools require valid authentication tokens"
      
    - check: "secrets_management"
      scope: "environment_vars_only"
      enforcement: "blocking"
      validation: "No secrets in code, config files, or git history"
      
    - check: "security_logging"
      scope: "sensitive_operations"
      enforcement: "warning"
      validation: "All auth failures, access denials logged"
      
  dependency_security:
    - tool: "safety"
      check: "known_vulnerabilities"
      frequency: "pre_commit"
      enforcement: "blocking"
      
    - tool: "bandit"
      check: "python_security_issues"
      frequency: "ci_pipeline"
      enforcement: "warning"

# ============================================================================
# RED-GREEN-REFACTOR CYCLE (TDD Enforcement)
# ============================================================================
red_green_refactor:
  cycle_1_red:
    action: "Write failing test first (CORE-008)"
    validation: "Test must fail with expected error message"
    forbidden: "Code implementation before test exists"
    example: "pytest test_new_feature.py → AssertionError or ModuleNotFoundError"
    
  cycle_2_green:
    action: "Minimal code to pass test"
    validation: "Test must pass, no --ignore flags allowed"
    forbidden: "Skipping tests, mocking real dependencies without justification"
    example: "pytest test_new_feature.py → 1 passed"
    
  cycle_3_refactor:
    action: "Clean code while keeping tests green"
    validation: "All tests still pass + lint clean"
    forbidden: "Breaking existing tests during refactor"
    checklist:
      - "Extract magic numbers → constants"
      - "Extract complex conditionals → named functions"
      - "Remove duplication (CORE-035)"
      - "Add type hints + docstrings"
      - "Run full test suite → all pass"

# ============================================================================
# VISION & PROBLEM STATEMENT
# ============================================================================
overview:
  vision: |
    [Clear, concise description of what this phase achieves]
    
    Focus on:
    - User-visible value delivered
    - Technical foundation improved
    - Governance/quality/security enhancements
    
  problem_statement: |
    CURRENT STATE:
    - [What's broken/missing/suboptimal]
    - [Impact on users or system]
    - [Specific pain points]
    
    ROOT CAUSE:
    - [Technical debt]
    - [Architectural gap]
    - [Process issue]
    
    IMPACT IF NOT FIXED:
    - ❌ [Business impact]
    - ❌ [Technical debt accumulation]
    - ❌ [User experience degradation]
    
  success_criteria:
    - "✅ [Measurable outcome 1]"
    - "✅ [Measurable outcome 2]"
    - "✅ [Measurable outcome 3]"

# ============================================================================
# DEPENDENCIES
# ============================================================================
dependencies:
  requires_complete:
    - phase_id: "phase-XX"
      reason: "Foundation for this phase"
      
  enables:
    - phase_id: "phase-YY"
      reason: "This phase unblocks YY"
      
  blocks:
    - phase_id: "phase-ZZ"
      reason: "Cannot proceed until this completes"

# ============================================================================
# STAGES (CORE-042: PHASE→STAGE→TASK)
# ============================================================================
stages:
  - id: S1
    name: "Stage 1 Name"
    priority: P0
    estimated_sessions: 2-3
    estimated_tests: 15-20
    
    tasks:
      - id: T1
        name: "Task 1 Name"
        files: ["path/to/file1.py", "path/to/file2.py"]
        estimated_loc: 150-200
        
      - id: T2
        name: "Task 2 Name"
        files: ["path/to/file3.py"]
        estimated_loc: 80-100
        
    acceptance_criteria:
      - "✅ Tests passing: X/X"
      - "✅ Coverage: ≥ 80%"
      - "✅ Lint clean: 0 errors"
      - "✅ Enforcement gate passed"
      
  - id: S2
    name: "Stage 2 Name"
    priority: P0
    estimated_sessions: 1-2
    estimated_tests: 10-15
    
    tasks:
      - id: T1
        name: "Task 1 Name"
        files: ["path/to/file4.py"]
        estimated_loc: 100-120
        
    acceptance_criteria:
      - "✅ Integration tests passing"
      - "✅ Security scan passed"
      - "✅ Documentation complete"

# ============================================================================
# GOVERNANCE COMPLIANCE
# ============================================================================
governance:
  core_rules_applied:
    - CORE-002  # No markdown file generation
    - CORE-008  # TDD mandatory
    - CORE-011  # Type hints
    - CORE-012  # Docstrings
    - CORE-028  # File naming
    - CORE-035  # No duplicates
    - CORE-042  # PHASE→STAGE→TASK hierarchy
    - CORE-048  # Holistic validation gate
    - CORE-055  # Pre-execution planning completeness
    
  audit_trail:
    ac_marker_pattern: "AC-PHASE{NN}-{stage_id}-{task_id}"
    example: "AC-PHASE21-S1-T1"
    
  non_regression_guarantee:
    baseline_tests: "Must not drop below baseline"
    existing_code: "No modifications unless explicitly required"
    wiring_contract: "Must remain valid throughout phase"

# ============================================================================
# RESOURCE ESTIMATES
# ============================================================================
resources:
  total_sessions: "X-Y sessions"
  total_tests: "XX-YY new tests"
  total_loc: "XXX-YYY lines"
  key_deliverables:
    - "Deliverable 1"
    - "Deliverable 2"
    - "Deliverable 3"

# ============================================================================
# RISK ASSESSMENT
# ============================================================================
risks:
  - risk: "Description of risk"
    severity: high  # high | medium | low
    mitigation: "How we'll address this risk"
    
  - risk: "Another risk"
    severity: medium
    mitigation: "Mitigation strategy"

# ============================================================================
# COMPLETION CHECKLIST
# ============================================================================
completion_checklist:
  - "✅ All stages complete (S1-SN)"
  - "✅ All tests passing (≥ baseline + new tests)"
  - "✅ Lint clean (0 errors)"
  - "✅ Type hints complete"
  - "✅ Docstrings complete"
  - "✅ Wiring contract valid"
  - "✅ No CORE-035 violations"
  - "✅ Security scan passed"
  - "✅ AC markers in SQLite"
  - "✅ Documentation updated"
  - "✅ Git commits with meaningful messages"
  - "✅ Phase moved to phases/completed/"
