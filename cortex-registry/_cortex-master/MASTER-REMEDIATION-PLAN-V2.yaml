validation_phase:
  duration: "1 day"
  parallelizable: false
  mcp_orchestrator: "MasterOrchestrator + EnforcementOrchestrator"
  
  steps:
    - stage: "TEST-SUITE"
      mcp_tools:
        - "cortex_process_request (test execution)"
        - "cortex_lens_analyze (coverage)"
      actions:
        - "Run full test suite via cortex_process_request"
        - "Verify 100% pass rate (NO test bypass allowed)"
        - "Check coverage metrics via cortex_lens_analyze"
      
      success_criteria:
        - "803+ tests collected"
        - "0 failures (MANDATORY - CORE-008 enforcement)"
        - "Coverage ≥85%"
        - "No --ignore or _skip_ patterns used"
      
      autonomous_steps:
        - step: "Execute full test suite"
          mcp_tool: "cortex_process_request"
          params:
            operation: "test"
            target: "tests/"
            exclude: ["tests/_legacy_broken"]
            mode: "strict"
            governance: "EnforcementOrchestrator"
        
