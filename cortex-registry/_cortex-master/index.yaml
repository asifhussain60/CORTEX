# Dashboard Integration
dashboard:
  enabled: true
  url: "dashboard/index.html"
  data_source: "dashboard/data/plan-summary.json"
  sync_trigger: "AUDIT_MODE_VARIANCE_GT_10"
  auto_sync: true
  sync_interval_seconds: 300
  debounce_seconds: 60

# Agent Integration
agents:
  - name: "cortex-architect"
    path: ".github/agents/core/cortex-architect.md"
    version: "13.0"
    roles:
      - "plan_registry_access"
      - "phase_tracking"
      - "enhancement_discovery"
  
  - name: "cortex-auditor"
    path: ".github/agents/core/cortex-auditor.md"
    version: "2.0"
    roles:
      - "registry_health_check"
      - "variance_detection"
      - "sync_trigger"

# Governance
governance:
  managed_by: "cortex-architect"
  approval_required: "phase_completion"
  versioning: "semantic"
  file_naming: "kebab-case"
  max_file_name_length: 35

# Tags
