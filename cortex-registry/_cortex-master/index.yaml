      parallel_phases: ["phase-51"]
      
      teardown_hook: |
        # On completion, launch phase-51 in parallel if not already running
        - Execute phase-51 on same machine
    
    - phase_id: "phase-51"
      execution_mode: "parallel"
      approved_for_execution: true
      priority: 5
      estimated_duration: "12 days"
      status: "planned"
      
      machine_started_on: null
      machine_should_continue_on: null
      
      initiated_timestamp: null
      last_heartbeat: null
      current_stage: null
      checkpoint: null
      
      next_phase_on_completion: null
      parallel_phases: []
      
      teardown_hook: |
        # Final phase - generate completion report
        - Generate autonomous execution summary
        - Log total duration, tests passing, coverage
        - Archive execution logs

  # Machine continuity rules
  # Only agents that started a phase on a machine can continue it on that machine
  machine_continuity_rules:
    enabled: true
    description: |
      CRITICAL for incremental TDD execution:
      - Phase-52 starts on MacBook-M3 (Darwin/arm64)
      - Only phase-52 executor on MacBook-M3 can resume phase-52 on MacBook-M3
      - If phase-52 executor crashes on MacBook-M3, another agent on MacBook-M3 can resume
      - Agent on Linux/x86_64 CANNOT resume phase-52 (must wait or restart on orig machine)
    
    enforcement: "MANDATORY"
    storage_path: "execution/machine-registry.yaml"
    heartbeat_interval_seconds: 60
    stale_heartbeat_timeout_seconds: 300  # 5 minutes
    
    # Phase state by machine
    phase_machine_map:
      phase-52:
        started_machine: null  # Set on first execution
        executor_agent: null   # Agent ID that started it
        allow_resume_on_other_machines: false
      phase-56-A:
        started_machine: null
        executor_agent: null
        allow_resume_on_other_machines: false
      phase-49:
        started_machine: null
        executor_agent: null
        allow_resume_on_other_machines: false
      phase-48:
        started_machine: null
        executor_agent: null
        allow_resume_on_other_machines: false
      phase-50:
        started_machine: null
        executor_agent: null
        allow_resume_on_other_machines: false
      phase-51:
        started_machine: null
        executor_agent: null
        allow_resume_on_other_machines: false

  # Silent execution mode (no user interaction, no prompts)
  silent_mode:
    enabled: true
    no_user_prompts: true
    no_progress_bars: false  # ASCII progress bars OK
    no_confirmations: true
    auto_fix_issues: true
    auto_skip_blockers: false  # Still block on critical errors
    continuous_heartbeat_to_logs: false  # Only log at phase boundaries

  # Observability & Monitoring
  monitoring:
    enabled: true
    logs_path: "execution/logs"
    checkpoints_path: "execution/checkpoints"
    metrics_path: "execution/metrics"
    
    # Per-phase metrics collection
    collect_metrics:
      - test_count_per_stage
      - coverage_per_stage
      - execution_time_per_stage
      - token_usage (if available)
      - artifact_size_delta
    
    # Alerts on anomalies
    anomaly_detection:
      test_pass_rate_drop: 90  # Alert if pass rate drops below 90%
      execution_time_spike: 2.0  # Alert if stage takes 2x expected time
      memory_spike_mb: 500  # Alert if memory usage spikes 500MB

# Tags
tags:
  - "cortex-development"
  - "phase-tracking"
  - "enhancement-pipeline"
  - "registry-driven"
  - "autonomous-execution"
  - "machine-continuity"
