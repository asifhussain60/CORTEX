  max_file_name_length: 35
  autonomous_execution:
    enabled: true
    silent_mode: true
    default_behavior: proceed_without_confirmation
    progress_visualization: ascii_bar
    progress_bar:
      format: '[{filled}{empty}] {pct}%'
      width: 10
      filled_char: "\u2588"
      empty_char: "\u2591"
      header_border: "\u2501"
      status_icons:
        complete: "\u2705"
        in_progress: "\U0001F535"
        pending: "\u26AA"
        failed: "\U0001F534"
        blocked: "\U0001F534"
    trigger_words:
    - proceed
    - proceed autonomously
    - proceed silently
    - implement
    - continue
    - 'yes'
    - do it
    - go ahead
    token_budget_per_session: 180000
    token_warning_threshold: 0.75
    continuation_prompt_template: "## \U0001F504 CONTINUE\n```\n/plan continue phase-{ID}\
      \ stage-{NUM}\n```\nGit: {COMMIT_HASH}\n"
    suppress_outputs:
    - shall_i_proceed
    - here_is_what_i_will_do
    - moving_to_next_stage
    - let_me_check
    - multi_paragraph_explanations
    - approval_requests
    allowed_outputs:
    - progress_bar_updates
    - completion_summary
    - error_reports
    - test_failure_details
    report_generation:
      enabled: false
      inline_only: true
      suppress_markdown_files: true
    user_notification:
      final_completion: true
      progress_updates: false
      error_alerts: true
