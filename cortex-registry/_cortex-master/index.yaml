# Dashboard Integration
dashboard:
  enabled: true
  url: "dashboard/index.html"
  data_source: "dashboard/data/plan-summary.json"
  sync_trigger: "AUDIT_MODE_VARIANCE_GT_10"
  auto_sync: true
  sync_interval_seconds: 300
  debounce_seconds: 60

# Agent Integration
agents:
  - name: "cortex-architect"
    path: ".github/agents/core/cortex-architect.md"
    version: "13.0"
    roles:
      - "plan_registry_access"
      - "phase_tracking"
      - "enhancement_discovery"
  
  - name: "cortex-auditor"
    path: ".github/agents/core/cortex-auditor.md"
    version: "2.0"
    roles:
      - "registry_health_check"
      - "variance_detection"
      - "sync_trigger"

# Governance
governance:
  managed_by: "cortex-architect"
  approval_required: "phase_completion"
  versioning: "semantic"
  file_naming: "kebab-case"
  max_file_name_length: 35
  
  # SILENT AUTONOMOUS EXECUTION (CORE-049)
  autonomous_execution:
    enabled: true
    silent_mode: true
    default_behavior: "proceed_without_confirmation"
    progress_visualization: "ascii_bar"
    
    # Visual Progress Settings
    progress_bar:
      format: "[{filled}{empty}] {pct}%"
      width: 10
      filled_char: "█"
      empty_char: "░"
      header_border: "━"
      status_icons:
        complete: "✅"
        in_progress: "🔵"
        pending: "⚪"
        failed: "🔴"
        blocked: "🔴"
    
    # Trigger Words (Auto-Enable Silent Mode)
    trigger_words:
      - "proceed"
      - "proceed autonomously"
      - "proceed silently"
      - "implement"
      - "continue"
      - "yes"
      - "do it"
      - "go ahead"
    
    # Token Management
    token_budget_per_session: 180000
    token_warning_threshold: 0.75
    
    # Continuation Prompt (Minimal)
    continuation_prompt_template: |
      ## 🔄 CONTINUE
      ```
      /plan continue phase-{ID} stage-{NUM}
      ```
      Git: {COMMIT_HASH}
    
    # Suppression Rules (Silent Mode)
    suppress_outputs:
      - "shall_i_proceed"
      - "here_is_what_i_will_do"
      - "moving_to_next_stage"
      - "let_me_check"
      - "multi_paragraph_explanations"
      - "approval_requests"
    
    # Allowed Outputs (Silent Mode)
    allowed_outputs:
      - "progress_bar_updates"
      - "completion_summary"
      - "error_reports"
      - "test_failure_details"
    
    # Report Generation
    report_generation:
      enabled: false
      inline_only: true
      suppress_markdown_files: true
    
    # Notifications
    user_notification:
      final_completion: true  # Show completion summary
      progress_updates: false  # No mid-execution updates
      error_alerts: true  # Always show errors

# Tags
tags:
  - "cortex-development"
  - "phase-tracking"
  - "enhancement-pipeline"
  - "registry-driven"
