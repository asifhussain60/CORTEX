governance_rules:
  created:
    - rule_id: CORE-095
      name: "Folder Structure Governance"
      tier: 0
      severity: P1-HIGH
      enforcement:
        - Pre-commit hook (blocking)
        - Audit scans
      approved_folders:
        - cortex/
        - cortex_brain/
        - cortex_lens/
        - cortex-registry/
        - tests/
        - docs/
        - company/
        - deployment/
        - scripts/
        - _archives/
        - _workspaces/
      violation_action: "Block commit + display approved list"
    
    - rule_id: CORE-096
      name: "Build Artifact Prevention"
      tier: 0
      severity: P1-HIGH
      enforcement:
        - Pre-commit hook (blocking)
        - .gitignore validation
      blocked_patterns:
        - dist/
        - build/
        - .pytest_cache/
        - __pycache__/
        - "*.egg-info/"
        - .eggs/
        - .tox/
        - .coverage
        - htmlcov/
        - .mypy_cache/
        - "*.pyc"
        - "*.pyo"
      violation_action: "Block commit + suggest make clean"
    
    - rule_id: CORE-097
      name: "Duplicate Detection Automation"
      tier: 0
      severity: P2-MEDIUM
      enforcement:
        - Weekly VacuumOrchestrator scans
        - CI/CD pipeline (non-blocking)
        - Manual trigger available
      integration:
        - orchestrator: DuplicationDetectorOrchestrator
        - min_similarity: 0.75
        - include_git_analysis: true
      thresholds:
        low: "1-5 duplicate sets"
        medium: "6-15 duplicate sets"
        high: "16-30 duplicate sets"
        critical: "31+ duplicate sets"
      violation_action: "Log + report + consolidation suggestions"

