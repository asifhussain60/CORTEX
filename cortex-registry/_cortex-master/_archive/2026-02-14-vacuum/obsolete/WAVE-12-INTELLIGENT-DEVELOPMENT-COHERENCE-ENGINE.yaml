# ============================================================================
# INTELLIGENT DEVELOPMENT WORKFLOW
# ============================================================================

workflow:
  name: "IDCE Workflow"
  description: |
    The complete intelligent development loop that runs until production
    readiness is achieved or max cycles reached.
    
  phases:
    - phase: "ANALYZE"
      description: "Scan all layers, identify issues across security/architecture/quality"
      outputs:
        - "Issue inventory with severity scores"
        - "Layer dependency map"
        - "Security threat model"
      documentation: "Analysis findings captured in work journal"
      
    - phase: "PLAN"
      description: "Generate prioritized fix sequence respecting dependencies"
      outputs:
        - "Ordered fix plan (P0→P1→P2)"
        - "Test generation targets"
        - "Estimated cycle count"
      documentation: "Plan rationale captured in work journal"
      
    - phase: "EXECUTE"
      description: "TDD cycles with inline documentation at each step"
      critical_integration: |
        RED phase MUST consume tests generated by T9 IntelligentTestGenerator.
        This is NOT a separate activity - generated tests ARE the RED phase tests.
        This ensures every cycle builds intelligence through execution, not just
        creation integrity through test writing.
      sub_phases:
        - name: "RED"
          action: "Write failing test for current fix target"
          integration: "Consume T9 generated tests as failing tests (harness integration)"
          documentation: "Why this test? What does it prove?"
          
        - name: "GREEN"
          action: "Minimal code to pass test"
          integration: "Fix code to pass GENERATED tests, not just original tests"
          documentation: "Implementation decision rationale"
          
        - name: "REFACTOR"
          action: "Improve design while tests stay green"
          documentation: "Design improvement justification"
          
    - phase: "VERIFY"
      description: "Run affected tests, measure coverage, check DoD"
      outputs:
        - "Test results"
        - "Coverage delta"
        - "DoD checklist status"
      documentation: "Verification results captured in work journal"
      
    - phase: "LOOP_OR_CERTIFY"
      description: "If DoD not met, return to ANALYZE. Otherwise, certify."
      exit_conditions:
        - "DoD score ≥ 85% → CERTIFY as Production Ready"
        - "DoD score 70-84% → CERTIFY as Release Candidate"
        - "DoD score < 70% AND cycles < max → LOOP"
        - "DoD score < 70% AND cycles = max → CERTIFY as Beta with warnings"

# ============================================================================
# DEFINITION OF DONE (DoD) GATE
# ============================================================================

definition_of_done:
  name: "Production Readiness Gate"
  description: |
    Multi-dimensional quality gate that determines when code is ready for
    production deployment. Scored 0-100, with tier thresholds.
    
  dimensions:
    - dimension: "Security"
      weight: 0.25
      checks:
        - "No P0 security vulnerabilities"
        - "No hardcoded secrets"
        - "Input validation on all endpoints"
        - "SQL injection prevention verified"
        - "Authentication/authorization in place"
      
    - dimension: "Testing"
      weight: 0.25
      checks:
        - "All tests passing"
        - "Coverage ≥ 80%"
        - "Blind spot tests generated"
        - "Edge case tests generated"
        - "Security risk tests generated"
        
    - dimension: "Architecture"
      weight: 0.20
      checks:
        - "No SOLID violations"
        - "No god classes/methods"
        - "Layer separation maintained"
        - "Dependency direction correct"
        
    - dimension: "Code Quality"
      weight: 0.15
      checks:
        - "No linting errors"
        - "Type hints present (CORE-011)"
        - "Docstrings present (CORE-012)"
        - "No bare except (CORE-013)"
        
    - dimension: "Documentation"
      weight: 0.15
      checks:
        - "Work journal complete"
        - "Decision rationale captured"
        - "API contracts documented"
        - "Breaking changes noted"
        
  tiers:
    production_ready:
      threshold: 85
      description: "Deploy with confidence"
      allowed_gaps: "None critical, minor only"
      
    release_candidate:
      threshold: 70
      description: "Deploy with monitoring"
      allowed_gaps: "P2/P3 issues acceptable"
      
    beta:
      threshold: 50
      description: "Deploy to staging only"
      allowed_gaps: "P1 issues acceptable with mitigation"
      
    not_ready:
      threshold: 0
      description: "Continue development"
      action: "Loop to ANALYZE phase"

# ============================================================================
# STRUCTURED WORK JOURNAL
# ============================================================================

work_journal:
  name: "Structured Work Journal"
  description: |
    Living documentation created during development, not after. Each phase
    contributes entries that become the permanent record of the work.
    
  format: "SQLite table with hash chain integrity"
  
  schema:
    table_name: "work_journal"
    columns:
      - name: "entry_id"
        type: "TEXT PRIMARY KEY"
        description: "Unique entry identifier"
        
      - name: "wave_id"
        type: "TEXT NOT NULL"
        description: "Wave this entry belongs to (e.g., WAVE-12)"
        
      - name: "cycle_number"
        type: "INTEGER NOT NULL"
        description: "Which TDD cycle (1, 2, 3...)"
        
      - name: "phase"
        type: "TEXT NOT NULL"
        description: "ANALYZE | PLAN | RED | GREEN | REFACTOR | VERIFY | CERTIFY"
        
      - name: "timestamp"
        type: "TEXT NOT NULL"
        description: "ISO 8601 timestamp"
        
      - name: "summary"
        type: "TEXT NOT NULL"
        description: "One-line summary of what happened"
        
      - name: "details"
        type: "TEXT"
        description: "JSON blob with phase-specific details"
        
      - name: "rationale"
        type: "TEXT"
        description: "Why this decision was made"
        
      - name: "files_affected"
        type: "TEXT"
        description: "JSON array of file paths touched"
        
      - name: "tests_affected"
        type: "TEXT"
        description: "JSON array of test files touched"
        
      - name: "dod_score_delta"
        type: "REAL"
        description: "Change in DoD score from this entry"
        
      - name: "previous_hash"
        type: "TEXT NOT NULL"
        description: "Hash of previous entry (chain integrity)"
        
      - name: "entry_hash"
        type: "TEXT NOT NULL"
        description: "SHA-256 hash of this entry"
        
  entry_templates:
    analyze:
      summary: "Analyzed {file_count} files, found {issue_count} issues"
      details:
        issues_by_severity: {}
        layers_scanned: []
        security_threats: []
        
    plan:
      summary: "Generated fix plan: {fix_count} fixes across {cycle_estimate} cycles"
      details:
        fix_sequence: []
        dependencies: []
        test_targets: []
        
    red:
      summary: "Created failing test: {test_name}"
      details:
        test_purpose: ""
        expected_failure: ""
        blind_spot_detected: false
        edge_case_type: ""
        security_risk_addressed: ""
        
    green:
      summary: "Implemented {component_name} to pass {test_name}"
      details:
        implementation_approach: ""
        alternatives_considered: []
        why_this_approach: ""
        
    refactor:
      summary: "Refactored {component_name}: {improvement_type}"
      details:
        before_metrics: {}
        after_metrics: {}
        design_improvement: ""
        
    verify:
      summary: "Verification: {tests_passed}/{tests_total} passing, {coverage}% coverage"
      details:
        test_results: {}
        coverage_delta: 0
        dod_checklist: {}
        
    certify:
      summary: "Certified as {tier}: DoD score {score}%"
      details:
        dimension_scores: {}
        gaps_remaining: []
        deployment_recommendation: ""

# ============================================================================
# INTELLIGENT TEST GENERATION
# ============================================================================

intelligent_tests:
  name: "Intelligent Test Generation Engine"
  description: |
    Generates high-value tests beyond happy path. Uses Test Value Score to
    avoid low-value busywork tests.
    
  test_value_score:
    formula: "(Severity × 0.4) + (Likelihood × 0.3) + (Coverage Gap × 0.3)"
    range: "0-100"
    description: |
      Severity: How bad if this bug reaches production? (0-100)
      Likelihood: How likely is this scenario to occur? (0-100)
      Coverage Gap: Is this code path currently untested? (0-100)
      
  categories:
    - category: "Blind Spots"
      description: "Code paths that exist but are never executed in tests"
      detection_method: "Coverage analysis + mutation testing"
      generation_threshold: 70
      priority: "P1"
      examples:
        - "Error handling branches never triggered"
        - "Fallback logic in catch blocks"
        - "Default case in switch statements"
        - "Short-circuit evaluation paths"
        
    - category: "Edge Cases"
      description: "Boundary values that often cause bugs"
      detection_method: "Boundary value analysis from parameter types"
      generation_threshold: 60
      priority: "P1"
      examples:
        - "Empty collections ([], {}, '')"
        - "Null/None values"
        - "Maximum values (MAX_INT, huge strings)"
        - "Zero and negative numbers"
        - "Unicode and special characters"
        - "Whitespace-only strings"
        
    - category: "Security Risks"
      description: "Tests that verify security controls work"
      detection_method: "Threat model + OWASP patterns"
      generation_threshold: 50  # Lower threshold - security always important
      priority: "P0"
      examples:
        - "SQL injection attempts"
        - "XSS payload handling"
        - "Authentication bypass attempts"
        - "Authorization boundary tests"
        - "Input validation circumvention"
        - "Rate limiting verification"
        
    - category: "Concurrency"
      description: "Race conditions and thread safety"
      detection_method: "Shared state analysis"
      generation_threshold: 80  # Higher threshold - hard to test well
      priority: "P2"
      examples:
        - "Parallel writes to shared state"
        - "Lock contention scenarios"
        - "Async operation ordering"
        
    - category: "Error Recovery"
      description: "System behavior when things go wrong"
      detection_method: "Exception flow analysis"
      generation_threshold: 65
      priority: "P1"
      examples:
        - "Network timeout handling"
        - "Database connection failure"
        - "Disk full scenarios"
        - "External service unavailable"
        
  generation_workflow:
    - step: 1
      name: "Analyze Code"
      action: "Extract functions, parameters, types, and dependencies"
      
    - step: 2
      name: "Identify Candidates"
      action: "Find potential blind spots, edge cases, security risks"
      
    - step: 3
      name: "Score Candidates"
      action: "Calculate Test Value Score for each candidate"
      
    - step: 4
      name: "Filter by Threshold"
      action: "Keep only candidates above category threshold"
      
    - step: 5
      name: "Generate Tests"
      action: "Create test code for filtered candidates"
      
    - step: 6
      name: "Execute Generated Tests (RED State)"
      action: "Run generated tests immediately to establish failing state"
      output: "Failing tests proving blind spot/edge case/security gap exists"
      rationale: |
        Tests MUST execute in the same cycle they are generated.
        This ensures intelligence is built through execution, not just creation.
        The failing state feeds directly into GREEN phase for fixing.
      
    - step: 7
      name: "Return to Intelligence Loop"
      action: "Hand off failing tests to T7 IntelligenceLoopOrchestrator for GREEN phase"
      integration: "T7-D5 Test Harness Integration receives generated tests"
      
    - step: 8
      name: "Document in Journal"
      action: "Record why each test was generated, its execution result, and fix outcome"
      journal_fields:
        - "test_purpose: Why this test was generated"
        - "blind_spot_detected: What code path was uncovered"
        - "fix_applied: How the issue was resolved"
        - "intelligence_gained: What the system learned"

# ============================================================================
# TRACK DEFINITIONS
# ============================================================================

tracks:
