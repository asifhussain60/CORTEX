      tests: 20
      features:
        - "DoR calculator (7 criteria)"
        - "Minimum 80% confidence gate"
        - "Validation report generation"
    
    stage_2:
      name: "Challenge Generation Engine"
      tests: 25
      features:
        - "3 alternative approaches per request"
        - "Disagreement detection (risks, tradeoffs)"
        - "Recommendation scoring (feasibility, impact, risk)"
    
    stage_3:
      name: "Cross-Layer Consistency Validation"
      tests: 15
      features:
        - "Database schema ↔ API contracts"
        - "API ↔ UI components"
        - "Configuration ↔ implementation"
    
    stage_4:
      name: "Integration & Production Validation"
      tests: 5
      features:
        - "End-to-end validation workflow"
        - "CLI integration (/validate command)"
        - "MCP tool exposure (cortex_validate_request)"

  total_tests: 65
  dependencies: ["ENH-063"]
  blockers: "None (all dependencies complete)"

