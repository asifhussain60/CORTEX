# ============================================================================
# INTEGRATION & DEPENDENCIES
# ============================================================================

integration:
  
  existing_orchestrators:
    - orchestrator: "TDDOrchestrator"
      relationship: "ENHANCED"
      integration: |
        TDDOrchestrator can invoke TestGenerationOrchestrator for RED phase scaffolding.
        User writes failing test OR asks TestGenerationOrchestrator to generate skeleton.
        TDDOrchestrator still manages GREEN/REFACTOR phases.
    
    - orchestrator: "SeleniumPlaywrightOrchestrator"
      relationship: "COMPLEMENTARY"
      integration: |
        SeleniumPlaywrightOrchestrator = migration tool (converts existing tests)
        TestGenerationOrchestrator = creation tool (generates new tests)
        No overlap, different purposes.
    
    - orchestrator: "EnforcementOrchestrator"
      relationship: "VALIDATES"
      integration: |
        EnforcementOrchestrator validates generated tests meet CORE rules:
        - CORE-008: TDD compliance (tests exist before code)
        - Testing Pyramid compliance
        - Coverage requirements
  
  existing_systems:
    - system: "TestingDiscovery"
      integration: "TestGenerationOrchestrator USES for framework detection"
    
    - system: "LENS (LENSSynthesis)"
      integration: "TestIntelligenceEngine USES for code analysis"
    
    - system: "UnifiedIntelligenceContext (Phase 53)"
      integration: "TestIntelligenceEngine USES for knowledge synthesis"
    
    - system: "TestQualityAnalyzer"
      integration: "Quality gates ENFORCE FLUFF prevention"
    
    - system: "Knowledge YAMLs (45+ files)"
      integration: "Adapters CONSULT for framework-specific best practices"

  mcp_tools:
    - tool: "cortex_generate_tests"
      signature: |
        cortex_generate_tests(
          target_file: str,
          framework: Optional[str] = None,  # Auto-detect if None
          test_types: Optional[List[str]] = None,  # Auto-infer if None
          preview: bool = True  # User approval gate
        ) -> GeneratedTestsResult
      
      workflow:
        - "1. Detect repository framework (TestingDiscovery)"
        - "2. Analyze target file (LENS)"
        - "3. Infer test types (TestIntelligenceEngine)"
        - "4. Generate tests via adapter"
        - "5. Validate quality (FLUFF detection, Testing Pyramid)"
        - "6. Preview to user (if preview=True)"
        - "7. Write files on approval"

