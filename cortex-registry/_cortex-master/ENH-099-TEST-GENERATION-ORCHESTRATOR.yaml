# ENH-099: Multi-Stack Test Generation Orchestrator
# Wave: 10 (Intelligent Testing Infrastructure)
# Created: 2026-02-12
# Authority: cortex-architect design session - Playwright intelligence layer analysis

metadata:
  wave: 10
  enhancement_id: ENH-099
  title: "Multi-Stack Test Generation Orchestrator with Intelligence Layer"
  category: "testing-infrastructure"
  priority: "P1-HIGH"
  estimated_effort: "13 days"
  target_impact:
    new_orchestrator: 1  # TestGenerationOrchestrator (domain orchestrator)
    framework_adapters: 7  # Playwright, Selenium, pytest, Jest, Mocha, MSTest, Cypress
    intelligence_integration: "LENS + UnifiedIntelligenceContext + TestingDiscovery"
    mcp_tools: 1  # cortex_generate_tests
  roi_score: 9.5  # High-value: enables intelligent test creation for all frameworks
  relationship: "ENHANCES TDDOrchestrator, integrates with TestingDiscovery, leverages LENS"

overview:
  description: |
    Introduces TestGenerationOrchestrator - a domain orchestrator providing framework-agnostic
    intelligent test generation. Uses LENS analysis (git+AST+comments) to infer test types
    (unit/integration/E2E) and generates high-value tests via pluggable framework adapters.
    
    Supports both CORTEX internal testing (pytest+Playwright) and dev repositories
    (auto-detect via TestingDiscovery). Maintains Testing Pyramid compliance and prevents
    FLUFF tests via TestQualityAnalyzer integration.
    
    ARCHITECTURAL PRINCIPLE: Domain orchestrator (not core) - preserves TDDOrchestrator's
    single responsibility while adding intelligent test scaffolding capability.
  
  vision:
    original_request: "Playwright-based test engine with intelligence layer"
    refined_solution: "Framework-agnostic test generation with adapter pattern"
    key_insight: "Test type inference > framework-specific engine = broader applicability"
  
  current_state:
    testing_infrastructure:
      - "TDDOrchestrator: TDD workflow enforcement (RED→GREEN→REFACTOR)"
      - "TestingDiscovery: Framework topology detection (pytest, Jest, Mocha, etc.)"
      - "SeleniumPlaywrightOrchestrator: Migration tool (Selenium → Playwright)"
      - "TestQualityAnalyzer: FLUFF detection, coverage gap analysis"
      - "LENS: Code intelligence (git+AST+comments)"
      - "UnifiedIntelligenceContext (Phase 53): Knowledge synthesis"
    gap:
      - "No intelligent test generation capability"
      - "Manual test scaffolding for new features"
      - "Framework-specific test creation (no unified approach)"
      - "Missing test type inference (unit vs integration vs E2E)"
  
  target_state:
    new_capabilities:
      - "Automatic test scaffolding from LENS analysis"
      - "Framework-aware test generation (7 adapters)"
      - "Test type inference (complexity + dependency analysis)"
      - "Testing Pyramid compliance enforcement"
      - "Quality gates (no FLUFF, coverage gap detection)"
      - "MCP exposure: cortex_generate_tests tool"
    architecture:
      - "TestGenerationOrchestrator (domain orchestrator)"
      - "Framework adapters (Playwright, Selenium, pytest, Jest, Mocha, MSTest, Cypress)"
      - "Intelligence layer integration (LENS + UnifiedIntelligenceContext)"
      - "Quality validation (TestQualityAnalyzer + Testing Pyramid)"

# ============================================================================
# ARCHITECTURE DESIGN
# ============================================================================

architecture:
  
  orchestrator_design:
    name: "TestGenerationOrchestrator"
    type: "domain_orchestrator"  # NOT core orchestrator
    location: "cortex/orchestrators/domain/test_generation_orchestrator.py"
    purpose: "Intelligent test generation with framework-agnostic intelligence + pluggable adapters"
    
    responsibilities:
      - "Detect repository test topology (via TestingDiscovery)"
      - "Analyze code structure via LENS (complexity, dependencies, user flows)"
      - "Infer test types (unit/integration/E2E) from intelligence layer"
      - "Select appropriate framework adapter(s)"
      - "Generate test scaffolding via adapters"
      - "Validate quality (TestQualityAnalyzer + Testing Pyramid compliance)"
      - "Expose via MCP: cortex_generate_tests"
    
    does_not_replace:
      - "TDDOrchestrator: Still manages TDD workflow (RED→GREEN→REFACTOR)"
      - "TestingDiscovery: Still detects framework configurations"
      - "SeleniumPlaywrightOrchestrator: Still handles migration patterns"
  
  adapter_pattern:
    interface: "ITestFrameworkAdapter"
    contract:
      methods:
        - name: "detect_framework"
          signature: "detect_framework(repo_path: Path) -> bool"
          purpose: "Can this adapter handle this repository?"
        
        - name: "infer_test_types"
          signature: "infer_test_types(lens_data: LENSAnalysis) -> List[TestType]"
          purpose: "Determine unit/integration/E2E from code structure"
        
        - name: "generate_tests"
          signature: "generate_tests(test_spec: TestSpecification) -> List[GeneratedTest]"
          purpose: "Create framework-specific test files"
        
        - name: "validate_quality"
          signature: "validate_quality(generated_tests: List[GeneratedTest]) -> QualityReport"
          purpose: "Framework-specific quality gates"
    
    adapters:
      - name: "PlaywrightAdapter"
        frameworks: ["Playwright"]
        test_types: ["E2E", "integration"]
        priority: "HIGH"  # Primary E2E solution
        knowledge_yaml: "selenium-to-playwright-migration.yaml"
        features:
          - "Auto-wait pattern generation"
          - "Page Object Model scaffolding"
          - "Network interception setup"
          - "Trace viewer integration"
      
      - name: "SeleniumAdapter"
        frameworks: ["Selenium WebDriver"]
        test_types: ["E2E"]
        priority: "MEDIUM"  # Legacy support
        knowledge_yaml: "selenium-to-playwright-migration.yaml"
        features:
          - "WebDriverWait patterns"
          - "Explicit wait generation"
          - "Page Object Model support"
      
      - name: "PytestAdapter"
        frameworks: ["pytest"]
        test_types: ["unit", "integration"]
        priority: "HIGH"  # CORTEX primary framework
        knowledge_yaml: "testing-pyramid.yaml, tdd-best-practices.yaml"
        features:
          - "Fixture generation (conftest.py patterns)"
          - "Parametrized test creation"
          - "Mock/stub setup (unittest.mock)"
          - "Coverage configuration"
      
      - name: "JestAdapter"
        frameworks: ["Jest"]
        test_types: ["unit", "integration"]
        priority: "HIGH"  # JavaScript/TypeScript primary
        knowledge_yaml: "testing-pyramid.yaml"
        features:
          - "describe/it structure"
          - "Mock function generation (jest.mock)"
          - "Snapshot testing setup"
          - "Coverage configuration"
      
      - name: "MochaAdapter"
        frameworks: ["Mocha"]
        test_types: ["E2E", "integration"]
        priority: "MEDIUM"  # JavaScript E2E alternative
        features:
          - "describe/it structure"
          - "Async/await patterns"
          - "Chai assertion generation"
      
      - name: "MSTestAdapter"
        frameworks: ["MSTest"]
        test_types: ["unit", "integration"]
        priority: "HIGH"  # C# enterprise standard
        knowledge_yaml: "mstest-framework-patterns.yaml, qa-coding-standards.yaml"
        features:
          - "[TestClass]/[TestMethod] attributes"
          - "[TestInitialize]/[TestCleanup]"
          - "Page Object Model (C#)"
          - "Data-driven testing"
      
      - name: "CypressAdapter"
        frameworks: ["Cypress"]
        test_types: ["E2E"]
        priority: "MEDIUM"  # Modern E2E alternative
        features:
          - "cy.* command chains"
          - "Time-travel debugging setup"
          - "Network stubbing"
  
  intelligence_layer:
    name: "TestIntelligenceEngine"
    location: "cortex/intelligence/test_intelligence_engine.py"
    
    inputs:
      - source: "LENS (LENSSynthesis)"
        data:
          - "git_analysis: Commit patterns, user flows, critical paths"
          - "ast_analysis: Cyclomatic complexity, dependency graph, function signatures"
          - "comment_analysis: Docstrings, TODOs, edge case notes"
      
      - source: "TestingDiscovery"
        data:
          - "framework_topology: Detected test frameworks, configurations"
          - "existing_tests: Current test coverage, patterns, fixtures"
      
      - source: "UnifiedIntelligenceContext (Phase 53)"
        data:
          - "company_knowledge: Domain-specific test patterns"
          - "cortex_knowledge: Best practices (45+ YAMLs)"
    
    processing:
      - stage: "Test Type Inference"
        logic:
          - "Complexity < 5 + No dependencies → Unit test"
          - "Complexity 5-15 + Internal dependencies → Integration test"
          - "Complexity > 15 + External API/UI → E2E test"
          - "git_analysis.user_flows → E2E test scenarios"
      
      - stage: "High-Value Target Identification"
        logic:
          - "Critical path functions (from git frequency)"
          - "Uncovered branches (from coverage gaps)"
          - "High complexity + Low coverage = TOP PRIORITY"
      
      - stage: "Test Scenario Generation"
        logic:
          - "Extract from docstrings (Given/When/Then patterns)"
          - "Infer from function signature (parameter combinations)"
          - "Detect edge cases from comments"
    
    outputs:
      - "TestSpecification: test_type, target_function, scenarios, assertions"
      - "PriorityScore: 0-100 (criticality × complexity × coverage_gap)"

  quality_gates:
    - gate: "FLUFF Detection"
      mechanism: "TestQualityAnalyzer"
      criteria:
        - "No tests with zero assertions"
        - "No tests with only trivial assertions (assert True)"
        - "No tests with 100% mocked dependencies (no real logic tested)"
    
    - gate: "Testing Pyramid Compliance"
      mechanism: "Testing Pyramid YAML validation"
      criteria:
        - "Unit tests: 70% of total"
        - "Integration tests: 20% of total"
        - "E2E tests: 10% of total"
        - "Block generation if pyramid inverted"
    
    - gate: "Coverage Gap Validation"
      mechanism: "LENS AST analysis"
      criteria:
        - "Generated tests target uncovered code paths"
        - "No redundant test generation (already covered)"
    
    - gate: "Framework Best Practices"
      mechanism: "Adapter-specific validation + Knowledge YAMLs"
      criteria:
        - "Playwright: Uses auto-wait, no explicit sleeps"
        - "pytest: Fixtures in conftest.py, not inline"
        - "MSTest: Proper [TestClass] structure"

