# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  
  - risk: "Adapter complexity exceeds estimates"
    probability: "MEDIUM"
    impact: "Schedule delay (2-3 days)"
    mitigation: |
      - Phase P3 adapters are MEDIUM priority (can defer Jest/MSTest/Selenium)
      - Focus P2 on PytestAdapter + PlaywrightAdapter (CORTEX primary needs)
      - Adapter pattern enables incremental delivery
  
  - risk: "LENS analysis too slow for real-time generation"
    probability: "LOW"
    impact: "User experience degradation"
    mitigation: |
      - LENS results cached via UnifiedIntelligenceContext
      - Pre-warm cache during MCP session initialization
      - Async analysis with progress indicators
  
  - risk: "Testing Pyramid enforcement too rigid"
    probability: "MEDIUM"
    impact: "User frustration (legitimate E2E test blocked)"
    mitigation: |
      - Warning + approval gate (not hard block)
      - Allow override with justification
      - Track overrides for pattern analysis
  
  - risk: "Framework detection false positives"
    probability: "LOW"
    impact: "Wrong adapter selected, invalid tests generated"
    mitigation: |
      - TestingDiscovery already proven (Phase 9 Discovery)
      - Multi-signal detection (config files + imports + patterns)
      - User confirmation for ambiguous cases
  
  - risk: "Generated tests too generic (not high-value)"
    probability: "MEDIUM"
    impact: "User rejects generated tests"
    mitigation: |
      - LENS intelligence provides context-specific scenarios
      - Preview + approval gate (user validates before writing)
      - Iterative refinement (user feedback loop)

