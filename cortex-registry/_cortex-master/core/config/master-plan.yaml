        - "Reload: Command Palette → Developer: Reload Window"
        - "Retry: Paste phase trigger in Copilot chat"
    
    tests_failing:
      symptom: "Phase Execution halts on test failure"
      resolution:
        - "Do NOT skip tests (CORE-008 violation)"
        - "Read error completely"
        - "Fix root cause in source code"
        - "Re-run tests to verify"
        - "Resume via /continue in Copilot chat"
    
    token_budget_exceeded:
      symptom: "Response truncated or execution incomplete"
      resolution:
        - "Session automatically commits progress (git commit)"
        - "Copy continuation prompt from AC markers"
        - "Start new Copilot chat session"
        - "Paste: /continue {wave_number} {checkpoint}"
