      - "MCP tools availability (automatic on first chat message)"
      - "Python environment (venv or conda)"
      - "Git hooks configured (.githooks active)"
      - "Branch validation (CORTEX branch only)"
    
    execution_sequence:
      - "Copy Phase Execution trigger from wave_X_* sections above"
      - "Paste into VSCode Copilot Chat"
      - "Copilot auto-starts MCP → TDDOrchestrator → silent execution"
      - "Monitor progress via ASCII bars (no narration)"
      - "On completion: Review AC markers and test results"
    
    silent_mode_defaults:
      progress_bars: "✅ Enabled (inline code blocks)"
      narration: "❌ Disabled"
      mid_execution_prompts: "❌ Disabled"
      completion_report: "✅ Table format with AC markers"
      test_output: "✅ Summary table (full output in AC markers)"
    
  troubleshooting:
    mcp_not_available:
      symptom: "MCP tools not appearing in Copilot chat"
