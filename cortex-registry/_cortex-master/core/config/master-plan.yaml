    manual_startup: "❌ NOT REQUIRED"
    setup_time: "30 seconds (setup-mcp.py)"
    
  preparation_steps:
    - step: 1
      action: "Verify Python 3.9+ installed"
      command: "python --version"
      
    - step: 2
      action: "Run setup script (one-time)"
      command: "python .cortex/setup-mcp.py"
