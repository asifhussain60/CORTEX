          code: |
            # cortex/models/execution_context.py
            from dataclasses import dataclass, field
            from typing import Dict, Any, Optional
            from datetime import datetime
            from cortex.models.canonical_enums import IntentType
            
            @dataclass
            class ExecutionContext:
                """
                Single canonical execution context for all CORTEX operations.
                
                Used by:
                - MCP tools (request processing)
                - Orchestrators (execution state)
                - LENS analyzers (code analysis context)
                - Governance enforcers (validation context)
                
                CORE Compliance:
                - CORE-035: Single canonical implementation
                - CORE-011: Full type hints
                - CORE-012: Google-style docstring
                """
                
                # Required fields
                orchestrator_id: str
                operation_id: str
                intent: IntentType
                
                # Optional fields
                parameters: Dict[str, Any] = field(default_factory=dict)
                metadata: Dict[str, Any] = field(default_factory=dict)
                audit_trail: List[str] = field(default_factory=list)
                
                # Timestamps
                created_at: datetime = field(default_factory=datetime.now)
                updated_at: Optional[datetime] = None
                
                def add_audit_event(self, event: str) -> None:
                    """Add audit event to trail."""
                    self.audit_trail.append(f"[{datetime.now()}] {event}")
                    self.updated_at = datetime.now()
          effort: "1 day"
        
