        # cortex/orchestrators/refactored_architecture.py
        import warnings
        
        class Orchestrator(ABC):
            """
            DEPRECATED: Use cortex.brain.core.orchestrator_base.OrchestratorBase
            
            This experimental base class will be removed on 2026-03-31.
