    priority: "P0-CRITICAL"
    severity: "CORE-035 VIOLATION"
    effort: "3 days"
    
    issue:
      description: "15+ competing registry implementations"
      impact: "Architectural fragmentation, maintenance burden"
      detected_by: "DuplicationDetector + semantic search"
      
    competing_implementations:
      - "cortex/brain/core/interfaces.py::IGovernanceRegistry (interface)"
      - "cortex/core/registry/base_registry.py::BaseRegistry (generic)"
      - "cortex/orchestrators/support/duplication_registry.py::DuplicationRegistry"
      - "cortex/models/dashboard_schema_pydantic.py::Registry (data model)"
      - "cortex/core/orchestrator_dependency_registry.py"
      - "GovernanceRegistry, GitBackedRegistry, PolicyRegistry, PatternRegistry, ..."
    
    consolidation_plan:
      canonical_location: "cortex/core/registry/unified_registry.py"
      base_class: "UnifiedRegistry(BaseRegistry[T], ABC)"
      
      migration_strategy:
        stage_1:
          name: "Create UnifiedRegistry base"
          tasks:
            - "Design UnifiedRegistry API"
            - "Implement core CRUD operations"
            - "Add query builder interface"
            - "Thread-safety guarantees"
            - "Persistence layer abstraction"
          tests: "tests/unit/core/registry/test_unified_registry.py"
          effort: "1 day"
        
        stage_2:
          name: "Migrate specialized registries"
          tasks:
            - "GovernanceRegistry extends UnifiedRegistry"
            - "OrchestratorRegistry extends UnifiedRegistry"
            - "DuplicationRegistry extends UnifiedRegistry"
            - "PolicyRegistry extends UnifiedRegistry"
            - "PatternRegistry extends UnifiedRegistry"
          tests: "Update existing registry tests"
          effort: "1.5 days"
        
        stage_3:
          name: "Deprecate old registries"
          tasks:
            - "Mark old registries @deprecated"
            - "Add migration guides"
            - "Update all callers"
            - "Sunset date: 2026-03-31"
          effort: "0.5 days"
      
      code_template: |
        # cortex/core/registry/unified_registry.py
        from abc import ABC, abstractmethod
        from typing import TypeVar, Generic, Dict, List, Optional
        from dataclasses import dataclass
        from threading import RLock
        
        T = TypeVar('T')
        
        class UnifiedRegistry(Generic[T], ABC):
            """
            Single canonical registry base for all CORTEX registry needs.
            
            Provides:
            - Thread-safe CRUD operations
            - Query builder interface
            - Persistence abstraction
            - Audit logging integration
            - Performance monitoring
            
            Usage:
                class MyRegistry(UnifiedRegistry[MyType]):
                    def __init__(self):
                        super().__init__(entity_type=MyType)
            
            CORE Compliance:
            - CORE-035: Single canonical implementation
            - CORE-008: TDD (tests before implementation)
            - CORE-011: Type hints on all methods
            - CORE-012: Google-style docstrings
            """
            
            def __init__(self, entity_type: type[T]):
                self._lock = RLock()
                self._registry: Dict[str, T] = {}
                self._entity_type = entity_type
            
            def register(self, key: str, entity: T) -> None:
                """Register entity with thread safety."""
                with self._lock:
                    self._registry[key] = entity
            
            def get(self, key: str) -> Optional[T]:
                """Retrieve entity by key."""
                with self._lock:
                    return self._registry.get(key)
            
            def query(self) -> 'RegistryQuery[T]':
                """Start query builder."""
                return RegistryQuery(self)
            
            @abstractmethod
            def validate_entity(self, entity: T) -> bool:
                """Subclass-specific validation."""
                pass
    
    governance:
