## 🔍 Usage Examples

### Find Phase by Old Wave ID

```bash
# Search in this file
grep "WAVE-H" WAVE-TO-PHASE-MAPPING.yaml
# Result: old_id: "WAVE-H" → new_id: "PHASE-17"
```

### Find All Phases in Date Range

```bash
# Search git history
git log --since="2026-02-12" --grep="WAVE-" --oneline
```

### Lookup Test Count

```bash
# Get tests for old wave
grep -A 5 "WAVE-L" WAVE-TO-PHASE-MAPPING.yaml | grep "tests:"
# Result: tests: 25
```

