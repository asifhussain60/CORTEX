## Phase 4: Orchestrator Integration (Days 4-5)

### 4.1 Register Sites Capability with Master Orchestrator
**File:** `cortex/core/orchestrator/sites_capability.py`
**Purpose:** Expose site management as system capability

**Capability Metadata:**
```yaml
capability:
  id: "sites"
  name: "Multi-Site Infrastructure"
  version: "1.0"
  mcp_tools:
    - "cortex_launch_sites"
    - "cortex_list_sites"
    - "cortex_stop_sites"
    - "cortex_site_status"
  event_subscriptions:
    - "system.startup" → auto-launch P0 sites
    - "intent.documentation" → launch docs-main + archive
    - "intent.observability" → launch observability-dashboard
  capabilities:
    - "async-launch" (non-blocking, returns immediately)
    - "health-gating" (blocks upstream until sites healthy)
    - "cascade-failure-isolation" (one site down ≠ system down)
```

### 4.2 Create MCP Tools for Site Management
**File:** `cortex/core/mcp/site_management_tools.py`

**Tool: cortex_launch_sites**
- Params: site_ids: List[str], port_override: Dict[str, int], timeout_seconds: int, async: bool
- Returns: {sites: [{id, url, status, health_percent, error}], total_time_ms}
- Behavior: Async by default (doesn't block orchestrator), polls health before returning

**Tool: cortex_list_sites**
- Params: None
- Returns: {sites: [...], manifest_file, last_updated}
- Behavior: Returns all registered sites + current status

**Tool: cortex_stop_sites**
- Params: site_ids: List[str], force: bool, timeout_seconds: int
- Returns: {stopped: [...], failed: [...], total_time_ms}
- Behavior: SIGTERM first, SIGKILL after timeout if force=true

**Tool: cortex_site_status**
- Params: site_id: str
- Returns: {id, status, pid, port, url, health, build_time, error, logs_tail: string}
- Behavior: Real-time status + last 500 chars of log

### 4.3 Integrate with Intent Router
**File:** `cortex/core/intent/site_intents.py`
**Purpose:** Route documentation-related intents to site launcher

**Intent Mappings:**
```yaml
intent: "show_documentation"
  → routes to: cortex_launch_sites(site_ids: ["docs-main"])
  → behavior: Launch docs, return URL, open in browser

intent: "show_all_documentation"
  → routes to: cortex_launch_sites(site_ids: ["docs-main", "docs-archive-v4", "docs-archive-v5", "docs-archive-v5.5"])
  → behavior: Launch all, aggregate status page

intent: "view_system_health"
  → routes to: cortex_site_status(site_id: "observability-dashboard")
  → behavior: Launch dashboard, show metrics
```

