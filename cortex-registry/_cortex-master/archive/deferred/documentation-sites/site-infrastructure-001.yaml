## Risk Mitigation

| Risk | Probability | Impact | Mitigation |
|------|-------------|--------|------------|
| Port exhaustion during heavy CI | Medium | High | Port pool = 100 (8000-8099), rollback to static if needed |
| Process leaks on crash | Medium | High | Process manifest reconciliation on every launcher startup |
| Health check false negatives | Low | Medium | 3-check confirmation + configurable timeout per site |
| Concurrent build I/O collision | Low | High | Per-site build dirs + atomic swap strategy |
| Orchestrator awareness lag | Low | Medium | Event bus publishes site status in real-time |

