## Phase 1: Site Registry Declaration (Days 1-1)

### 1.1 Create Site Registry
**File:** `cortex-registry/master/sites-registry.yaml`
**Authority:** Master Orchestrator—single source of truth for all sites

**Content Specification:**
- Site ID (kebab-case, unique)
- Type (mkdocs, static-html, flask-app, observability-dashboard)
- Source paths (docs_dir, config_file)
- Build configuration (Python version, dependencies, build command)
- Network (port pool, health endpoint, protocol)
- Lifecycle (startup checks, restart policy, graceful shutdown timeout)
- Resource constraints (memory limit, CPU affinity, file handle quota)
- Dependencies (if site X must start before Y)
- Status tracking (current status, last-updated, error log)

**Sites to Register:**
```
docs-main: MkDocs, docs/ → site/, port 8000, priority P0
docs-archive-v4: MkDocs, cortex-gitpages/_archive/docs-cortex-4.0/, port 8001, priority P1
docs-archive-v5: MkDocs, cortex-gitpages/_archive/docs-cortex-5.0/, port 8002, priority P1
docs-archive-v5.5: MkDocs, cortex-gitpages/_archive/docs-cortex-5.5/, port 8003, priority P1
observability-dashboard: Future placeholder, port 9000, priority P2
```

### 1.2 Create Site Launcher Schema
**File:** `cortex-registry/master/site-launcher-schema.yaml`
**Purpose:** Define valid site configurations and launcher behavior

**Schema Elements:**
- Site object structure (id, type, config, lifecycle, health)
- Port allocation strategy (static vs. dynamic discovery)
- Process manifest format (PID, port, status, started_at, error)
- Health check contract (endpoint, interval, retry logic)
- Restart policy (none, always, on-failure with backoff)
- Failure modes (cascade prevention, logging, alerting)

