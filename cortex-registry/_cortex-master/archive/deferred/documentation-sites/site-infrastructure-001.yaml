## Phase 5: Build Isolation & Log Management (Days 4-5)

### 5.1 Per-Site Build Directory Isolation
**File:** `cortex/core/infrastructure/build_manager.py`

**Strategy:**
- Each site builds to `build/{site_id}/` instead of shared `site/`
- Example: `build/docs-main/site/`, `build/docs-archive-v5/site/`
- MkDocs config override: `site_dir` → dynamic path per site
- Symlink strategy (optional): `site/docs-main → ../build/docs-main/site/` for browser navigation

**Benefits:**
- Zero I/O contention on concurrent builds
- Atomic swap: Build to green, swap on success (blue-green pattern)
- No artifact collision

### 5.2 Log Capture & Rotation
**File:** `cortex/core/infrastructure/log_manager.py`

**Log Storage:**
- Location: `_workspaces/roadmap/logs/sites/`
- Format: `{site_id}.log` (stdout + stderr interleaved)
- Rotation: At 10MB, create `.log.1`, `.log.2`... (keep 5 generations)
- Queryable: SiteHealthChecker can tail logs, return last N lines

**Logging Metadata:**
- Timestamp, level (INFO, ERROR, WARN, DEBUG)
- Process ID, elapsed time
- Event type (LAUNCH, HEALTH_CHECK, SHUTDOWN, ERROR)

