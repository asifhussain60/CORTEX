## Phase 6: Testing & Validation (Day 6)

### 6.1 Unit Tests (TDD First)
**File:** `tests/unit/cortex/core/infrastructure/test_site_launcher.py`
- Launch success (healthy site, logs captured)
- Port conflict detection (all ports occupied)
- Orphan cleanup (stale PID in manifest)
- Health polling (exponential backoff, 3-check confirmation)
- Timeout handling (process hangs, health unreachable)

**File:** `tests/unit/cortex/core/infrastructure/test_multi_site_orchestrator.py`
- Sequential launch (respects dependency order)
- Concurrent launch (thread pool isolation)
- Cascade failure (one site error doesn't break others)
- Manifest reconciliation (cleanup + update)

**File:** `tests/unit/cortex/core/infrastructure/test_port_allocator.py`
- Available port detection (netstat + socket probe)
- Port pool exhaustion (clear error, not silent)
- Manifest tracking (allocated ports reconciled)

### 6.2 Integration Tests
**File:** `tests/integration/cortex/core/infrastructure/test_multisite_e2e.py`
- Launch docs-main → verify health → check logs → stop gracefully
- Launch 5 sites concurrently → all healthy → manifest consistent
- Kill process externally → orchestrator detects → restart on policy
- Build isolation → concurrent builds to separate `build/` dirs, no collision

### 6.3 Manual Validation (Dev Environment)
- Launch: `cortex_launch_sites(site_ids: ["docs-main", "observability-dashboard"])`
- Verify: Browser http://127.0.0.1:8000 (docs), http://127.0.0.1:9000 (dashboard)
- Verify: Process manifest shows both running
- Stop: `cortex_stop_sites(site_ids: ["docs-main"])`
- Verify: Port 8000 released, manifest updated

