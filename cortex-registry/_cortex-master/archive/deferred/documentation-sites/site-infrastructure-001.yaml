## Phase 3: Process Manifest & Port Management (Days 2-3)

### 3.1 Create Process Manifest Manager
**File:** `cortex/core/infrastructure/process_manifest.py`
**Responsibility:** Track running site processes, prevent orphans

**Data Structure** (`_workspaces/roadmap/running-sites.json`):
```json
{
  "docs-main": {
    "pid": 12345,
    "port": 8000,
    "type": "mkdocs",
    "status": "healthy",
    "started_at": "2026-01-21T10:00:00Z",
    "last_health_check": "2026-01-21T10:05:30Z",
    "build_time_ms": 1250,
    "error": null
  },
  "observability-dashboard": {
    "status": "stopped",
    "error": "port 9000 already in use"
  }
}
```

**Core Methods:**
- `ProcessManifest.register(site_id, pid, port, type) → None`
- `ProcessManifest.update_status(site_id, status, error) → None`
- `ProcessManifest.get_manifest() → Dict`
- `ProcessManifest.cleanup_orphans() → List[int]`
- `ProcessManifest.persist() → None` (write to JSON file)

**Cleanup Logic:**
- On launcher startup: Scan manifest, verify all PIDs still running
- If PID dead: Check if port occupied (if so, find new process owner)
- If port free but manifest stale: Remove entry
- If port occupied but not in manifest: Log warning (external process)

### 3.2 Create Port Allocation Strategy
**File:** `cortex/core/infrastructure/port_allocator.py`
**Responsibility:** Dynamic port discovery, conflict detection

**Core Methods:**
- `PortAllocator.allocate(site_id: str, preferred_port: int, pool_size: int) → int`
- `PortAllocator.is_available(port: int) → bool`
- `PortAllocator.release(site_id: str) → None`

**Algorithm:**
1. Try preferred port first (netstat + socket probe)
2. If occupied, scan pool (preferred ± 20 ports)
3. Return first available
4. If none available in pool: Raise PortAllocationError (not silent failure)
5. Update manifest with actual port

**Port Pools:**
- Development: 8000-8099 (local MkDocs)
- CI/CD: 9000-9099 (parallel builds)
- Dashboard: 9100-9199 (observability)

