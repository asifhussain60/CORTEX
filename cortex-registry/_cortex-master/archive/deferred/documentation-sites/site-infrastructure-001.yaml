## Phase 2: Site Launcher Implementation (Days 2-3)

### 2.1 Create Python Site Launcher Module
**File:** `cortex/core/infrastructure/site_launcher.py`
**Responsibility:** Lifecycle management for individual sites

**Core Methods:**
- `SiteLauncher.launch(site_id: str, timeout_seconds: int) → SiteStatus`
- `SiteLauncher.health_check(site_id: str) → HealthStatus`
- `SiteLauncher.stop(site_id: str) → bool`
- `SiteLauncher.restart(site_id: str) → bool`
- `SiteLauncher.get_status(site_id: str) → SiteStatus`

**Key Features:**
- Pre-flight validation (port available, dependencies present, build path exists)
- Subprocess spawning with environment isolation
- Stdout/stderr capture to `_workspaces/roadmap/logs/sites/{site_id}.log`
- Health polling with exponential backoff (10 attempts, max 10s)
- Process manifest reconciliation (cleanup orphans, track PIDs)
- Resource limits (memory, file handles)

### 2.2 Create Multi-Site Orchestrator
**File:** `cortex/core/infrastructure/multi_site_orchestrator.py`
**Responsibility:** Coordinates launches, manages state, routes intents

**Core Methods:**
- `MultiSiteOrchestrator.launch_all(filter_priority: str = None) → Dict[str, SiteStatus]`
- `MultiSiteOrchestrator.launch_site(site_id: str) → SiteStatus`
- `MultiSiteOrchestrator.stop_all() → Dict[str, bool]`
- `MultiSiteOrchestrator.health_report() → SystemHealthStatus`
- `MultiSiteOrchestrator.register_site(site_config: SiteConfig) → bool`

**Key Features:**
- Reads sites-registry.yaml at startup
- Manages dependency order (don't launch dashboard until docs ready)
- Handles concurrent launches (thread pool with configurable concurrency)
- Maintains process manifest in `_workspaces/roadmap/running-sites.json`
- Publishes metrics (build time, startup time, current health)
- Cleanup on shutdown (graceful SIGTERM cascade)

### 2.3 Create Health Check Service
**File:** `cortex/core/infrastructure/site_health_checker.py`
**Responsibility:** Continuous monitoring and status reporting

**Core Methods:**
- `SiteHealthChecker.check_readiness(site_id: str, max_attempts: int) → bool`
- `SiteHealthChecker.continuous_monitor(interval_seconds: int) → None`
- `SiteHealthChecker.publish_status(orchestrator_bus) → None`

**Features:**
- HTTP GET to site health endpoint (/{site_id}/health or just /)
- Exponential backoff: 100ms, 200ms, 400ms... up to 10s
- Requires 3 consecutive 200 OK before declaring ready
- Logs failures (timeout, connection refused, non-200 status)
- Feeds metrics to orchestrator event bus

