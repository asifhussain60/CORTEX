  risk_1:
    description: "Broken links during migration"
    probability: "MEDIUM"
    impact: "HIGH"
    mitigation: "Automated LinkChecker + manual spot-check"
  
  risk_2:
    description: "Performance regression"
    probability: "MEDIUM"
    impact: "MEDIUM"
    mitigation: "Lighthouse testing in each phase"
  
  risk_3:
    description: "Diagram rendering issues"
    probability: "LOW"
    impact: "MEDIUM"
    mitigation: "Test in multiple browsers early"
  
  risk_4:
    description: "Accessibility compliance gaps"
    probability: "MEDIUM"
    impact: "HIGH"
    mitigation: "axe DevTools scanning + manual testing"
  
  risk_5:
    description: "Deployment failures"
    probability: "LOW"
    impact: "HIGH"
    mitigation: "Staging environment + rollback plan"

governance:
  authority: "cortex-registry/planning/ (this file)"
  core_rules_applied:
    - "CORE-026: Checkpoint before major changes"
    - "CORE-027: Audit trail maintained"
