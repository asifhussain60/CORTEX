# ============================================================================
# CONSOLIDATION STRATEGY
# ============================================================================

consolidation_rationale: |
  **Problem:** 6 active phases create:
  - Context switching overhead (token bloat)
  - Unclear prioritization (which phase to work on?)
  - Dependency confusion (what blocks what?)
  - Parallel work conflicts (agent redesign affects everything)
  
  **Solution:** Consolidate into 2 mega-phases based on capability clusters:
  
  1. **MEGA-PHASE A: Intelligence & Learning Core** (Phases 12 + 17 + 19)
     - Knowledge persistence, agent architecture, convergence loop
     - All 3 enhance CORTEX intelligence layer
     - Natural dependencies: Agent redesign → better learning integration
     - Estimated: 7-10 days total (parallel sub-streams possible)
  
  2. **MEGA-PHASE B: Developer Experience & Tooling** (Phases 1 + 16 + 18)
     - UI/UX enhancements, MCP documentation, production hardening
     - All 3 improve developer/user experience
     - Natural dependencies: Agent redesign stabilizes before hardening
     - Estimated: 2-3 weeks total (can start after MEGA-A S1)
  
  **Benefits:**
  - Clear priority: MEGA-A first (intelligence), MEGA-B second (DX)
  - Reduced context switching (1 mega-phase at a time)
  - Dependency chain visible (MEGA-A → MEGA-B)
  - Parallel sub-streams within mega-phases (e.g., S1 + S2 concurrently)

# ============================================================================
# MEGA-PHASE A: Intelligence & Learning Core
# ============================================================================

mega_phase_a:
  id: "MEGA-A"
  title: "Intelligence & Learning Core — CORTEX Brain Evolution"
  priority: P0
  estimated_effort: "7-10 days"
  estimated_tokens: "80000"
  roi_score: 95
  
  consolidates:
    - phase-12: "Knowledge Persistence & Universal Learning Loop"
    - phase-17: "Agent Architecture Holistic Redesign"
    - phase-19: "Convergence Loop Holistic TDD" (mark complete)
  
  vision: |
    Transform CORTEX from stateless executor to learning intelligence system:
    - Every operation persists knowledge (repository onboarding → domain YAMLs)
    - Agent architecture redesigned for capability-based routing (not mode-based)
    - Convergence loop enables autonomous multi-cycle work completion
    - Universal Learning Loop engaged after every operation
    - Brain intelligence layers (perception/reasoning/action) continuously enhanced
  
  stages:
    - id: S1
      name: "Agent Architecture Redesign"
      duration: "3 days"
      scope: |
        - Create 2 new agents: cortex-meta-auditor, cortex-master-plan-auditor
        - Implement capability-based clustering (vs 1-to-1 mode-agent)
        - Machine-readable agent metadata (YAML front-matter)
        - IntentRouter capability matching (vs trigger-word routing)
        - Legacy cleanup: old agent specs, wiring migration
      deliverables:
        - "cortex-meta-auditor.md agent spec"
        - "cortex-master-plan-auditor.md agent spec"
        - "capability_matcher.py enhanced"
        - "metadata_driven_discovery.py"
        - "AGENT-CONSOLIDATION-REPORT.md (inline)"
      tests: "45+ tests (15 per new agent + 15 integration)"
    
    - id: S2
      name: "Knowledge Persistence Layer"
      duration: "3 days"
      scope: |
        - KnowledgePersistenceService: Auto-generate domain YAMLs from onboarding
        - Repository → company/domains/{repo}/ YAML artifacts
        - Brain intelligence layer updates (perception/reasoning/action)
        - KnowledgePersistenceAgent: 8th enforcement agent (blocks non-persistent ops)
        - Integration with cortex_onboard_repository MCP tool
      deliverables:
        - "knowledge_persistence_service.py (~300 LOC)"
        - "knowledge_persistence_agent.py (enforcement)"
        - "company/domains/ generator"
        - "brain/ intelligence updater"
      tests: "50+ tests (20 persistence + 20 enforcement + 10 integration)"
    
    - id: S3
      name: "Universal Learning Loop Integration"
      duration: "2-3 days"
      scope: |
        - UniversalLearningLoop: OBSERVE → ANALYZE → SYNTHESIZE → APPLY
        - Integration with all orchestrators (not just TDD)
        - Pattern extraction after every operation (ONBOARD, ANALYZE, IMPLEMENT)
        - Cross-session learning: Future ops benefit from past learnings
        - Learning dashboard: Metrics, confidence scores, pattern evolution
      deliverables:
        - "universal_learning_loop.py enhanced"
        - "orchestrator_learning_mixin.py"
        - "learning_dashboard.py"
        - "cross_session_pattern_cache.py"
      tests: "40+ tests (15 loop + 15 integration + 10 dashboard)"
    
    - id: S4
      name: "Integration & Verification"
      duration: "1 day"
      scope: |
        - E2E testing: Onboard repo → knowledge persisted → learning engaged
        - Agent collaboration validation (meta-auditor + plan-auditor)
        - Performance validation (<150ms agent coordination overhead)
        - Documentation: Inline response format (CORE-002)
      deliverables:
        - "15 E2E tests (onboarding + learning + agent collaboration)"
        - "Performance benchmarks"
        - "MEGA-A-COMPLETION-REPORT.md (inline)"
      tests: "15 E2E tests"
  
  total_tests: "150+ tests"
  success_criteria:
    - "✅ Repository onboarding generates domain YAML artifacts"
    - "✅ Brain intelligence layers updated after every operation"
    - "✅ Universal Learning Loop engaged (not just TDD operations)"
    - "✅ 2 new agents operational (meta-auditor, plan-auditor)"
    - "✅ Agent collaboration validated (mode coverage 100%)"
    - "✅ Cross-session learning proven (pattern reuse)"
    - "✅ All existing tests remain passing (0 regressions)"
    - "✅ Performance targets met (<150ms coordination overhead)"

