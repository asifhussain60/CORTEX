# CORTEX Audit Checklist Registry v2.0
# Purpose: Machine-readable audit checks for CORTEX codebase health scanning
# Authority: cortex-architect.prompt.md v15.0 + cortex-auditor.md v2.0 + Phase 39
# Created: 2026-02-07
# Version: 2.0
# Phase 39: Added P1.5 (Cohesion & Integrity) + P1.6 (Future-Vision) checks

meta:
  version: "2.0"
  updated: "2026-02-07"
  authority: "Phase 39 + ENH-048 (Prompt Unbloating System)"
  source_files:
    - ".github/prompts/cortex-architect.prompt.md"
    - ".github/agents/core/cortex-auditor.md"
    - "cortex/orchestrators/audit/"
  total_checks: 31
  phase_39_additions:
    - "P1.5-001 through P1.5-006 (Cohesion & Integrity)"
    - "P1.6-001 through P1.6-002 (Future-Vision)"

# Priority-based audit checks
priority_checks:
  P0:
    name: "Security & Critical"
    description: "Immediate security risks and critical system failures"
    mandatory: true
    blocking: true
    checks:
      - id: "P0-001"
        name: "Secrets Scan"
        description: "Detect hardcoded credentials, API keys, passwords"
        tool: "grep_search"
        pattern: "(password|api_key|secret|token|credential)\\s*=\\s*['\"][^'\"]+['\"]"
        evidence_required: true
        auto_fix: false
        severity: "CRITICAL"
        
      - id: "P0-002"
        name: "Injection Vectors"
        description: "SQL injection, command injection, code injection vulnerabilities"
        tool: "cortex_lens_analyze"
        analysis_types: ["security", "injection"]
        evidence_required: true
        auto_fix: false
        severity: "CRITICAL"
        
      - id: "P0-003"
        name: "Broken Code"
        description: "Syntax errors, import failures, undefined variables"
        tool: "cortex_lens_analyze"
        analysis_types: ["syntax", "imports"]
        evidence_required: true
        auto_fix: false
        severity: "CRITICAL"
        
      - id: "P0-004"
        name: "Test Failures"
        description: "Critical test failures blocking deployment"
        tool: "runTests"
        test_pattern: "tests/unit/**/*.py"
        evidence_required: true
        auto_fix: false
        severity: "CRITICAL"

  P1:
    name: "Infrastructure & Governance"
    description: "System health, governance compliance, architectural integrity"
    mandatory: true
    blocking: false
    checks:
      - id: "P1-001"
        name: "Context Governance (ENH-046)"
        description: "Token budget compliance, context synthesis metrics"
        tool: "cortex_audit"
        sql_query: |
          SELECT 
            session_id,
            token_count,
            budget_compliant,
            compression_ratio,
            cache_hit_rate
          FROM context_metrics
          WHERE created_at >= datetime('now', '-24 hours')
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        related_enhancements: ["ENH-046"]
        success_criteria:
          - "token_count <= 20000 (100%)"
          - "cache_hit_rate >= 0.7 (70%)"
          - "compression_ratio >= 0.6 (60%)"
        
      - id: "P1-002"
        name: "Audit Trail Integrity (CORE-027)"
        description: "AC_START ↔ AC_COMPLETE verification"
        tool: "grep_search"
        pattern: "AC_START|AC_COMPLETE"
        validation: "Every AC_START must have matching AC_COMPLETE"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        related_rules: ["CORE-027"]
        
      - id: "P1-003"
        name: "File Naming Compliance (CORE-028)"
        description: "No SCREAMING_CASE, kebab-case enforcement"
        tool: "grep_search"
        pattern: "[A-Z_]{5,}\\.py"
        exclude_patterns:
          - "tests/test_*.py"
          - "CONSTANTS.py"
          - ".ENV"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        related_rules: ["CORE-028"]
        
      - id: "P1-004"
        name: "Component Integration Verification"
        description: "Wiring→Implementation alignment, MCP tool registration"
        tool: "cortex_verify_integration"
        validation_layers:
          - "Wiring YAML vs implementation"
          - "MCP tool registration chain"
          - "Health check execution"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1-005"
        name: "Git History Clean"
        description: "No uncommitted changes for critical files"
        tool: "get_changed_files"
        critical_paths:
          - "cortex/orchestrators/"
          - "cortex/wiring/specifications/wiring.yaml"
          - ".github/prompts/"
        evidence_required: true
        auto_fix: false
        severity: "MEDIUM"

  P1_5:
    name: "Cohesion & Integrity (Phase 39)"
    description: "Cross-layer coherence, system-wide health validation"
    mandatory: true
    blocking: false
    phase: 39
    checks:
      - id: "P1.5-001"
        name: "Prompt Cohesion - Version Drift"
        description: "Validate key prompt files (CORTEX.prompt.md, cortex-architect.prompt.md, response-format-standards.md) have consistent versions and recent updates"
        tool: "PromptCohesionValidator"
        validator_method: "check_version_drift"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        threshold: "7 days maximum version drift"
        
      - id: "P1.5-002"
        name: "Prompt Cohesion - CORE Rules Consistency"
        description: "All key prompt files must reference same CORE rules without conflicts"
        tool: "PromptCohesionValidator"
        validator_method: "check_core_rules_consistency"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-003"
        name: "Prompt Cohesion - MCP Enforcement"
        description: "MCP PRE-FLIGHT CHECK presence in all instruction files"
        tool: "PromptCohesionValidator"
        validator_method: "check_mcp_enforcement"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-004"
        name: "Agent Health - Version Tracking"
        description: "All agents have version headers and recent update dates"
        tool: "AgentHealthValidator"
        validator_method: "check_version_tracking"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-005"
        name: "Agent Health - Capability Coverage"
        description: "Agent capabilities cover 6 CORTEX modes without overlap"
        tool: "AgentHealthValidator"
        validator_method: "check_capability_coverage"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        expected_modes: ["AUDIT", "IMPLEMENT", "DESIGN", "PLAN", "RECALL", "REFACTOR"]
        
      - id: "P1.5-006"
        name: "Agent Health - Cross-References"
        description: "Agent references to prompts/orchestrators are valid"
        tool: "AgentHealthValidator"
        validator_method: "check_cross_references"
        evidence_required: true
        auto_fix: false
        severity: "MEDIUM"
        
      - id: "P1.5-007"
        name: "Agent Health - AGENT-INDEX.md Sync"
        description: "All agents listed in AGENT-INDEX.md exist in agents/core/"
        tool: "AgentHealthValidator"
        validator_method: "check_index_sync"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-008"
        name: "Orchestrator Integrity - Wiring Alignment"
        description: "Orchestrators in wiring.yaml match implemented classes"
        tool: "OrchestratorIntegrityValidator"
        validator_method: "check_wiring_alignment"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-009"
        name: "Orchestrator Integrity - MCP Tool Exposure"
        description: "All orchestrators exposed via MCP tools, no direct imports"
        tool: "OrchestratorIntegrityValidator"
        validator_method: "check_mcp_tool_exposure"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-010"
        name: "Orchestrator Integrity - Dependency Graph"
        description: "Orchestrator dependency graph is acyclic, proper tier ordering"
        tool: "OrchestratorIntegrityValidator"
        validator_method: "check_dependency_graph"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-011"
        name: "Module Cohesion - Import Health"
        description: "All imports resolvable, no broken imports across CORTEX modules"
        tool: "ModuleCohesionValidator"
        validator_method: "check_import_health"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-012"
        name: "Module Cohesion - Circular Dependencies"
        description: "No circular import cycles detected in module graph"
        tool: "ModuleCohesionValidator"
        validator_method: "check_circular_dependencies"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-013"
        name: "Test Validity - Coverage Gaps"
        description: "All critical modules have ≥80% test coverage"
        tool: "TestValidityValidator"
        validator_method: "check_coverage_gaps"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        threshold: "80% coverage minimum"
        
      - id: "P1.5-014"
        name: "Test Validity - Contract Test Health"
        description: "MCP tool contract tests exist and passing for all tools"
        tool: "TestValidityValidator"
        validator_method: "check_contract_test_health"
        evidence_required: true
        auto_fix: false
        severity: "HIGH"
        
      - id: "P1.5-015"
        name: "Team Collaboration - Multi-Team Readiness"
        description: "company/domains/ structure validated for multi-team use"
        tool: "TeamCollaborationValidator"
        validator_method: "validate_all"
        evidence_required: true
        auto_fix: false
        severity: "MEDIUM"
        required_structure:
          - "company/domains/templates/"
          - "company/domains/onboarding/"
          - "company/domains/guidelines.md"

  P1_6:
    name: "Future-Vision (Phase 39)"
    description: "Forward-looking technology adoption and migration planning"
    mandatory: false
    blocking: false
    phase: 39
    checks:
      - id: "P1.6-001"
        name: "Technology Adoption Triggers"
        description: "Detect when current tech stack needs evolution (performance, extensibility, capacity)"
        tool: "TechStackEvolutionPlanner"
        validator_method: "validate_all"
        evidence_required: true
        auto_fix: false
        severity: "LOW"
        triggers:
          - "Performance bottlenecks (response time >5s, throughput <100 req/s)"
          - "Extensibility limitations (>3 monkey patches, missing plugin system)"
          - "Capacity constraints (disk >80%, memory >85%, CPU sustained >70%)"
        
      - id: "P1.6-002"
        name: "Migration Planning"
        description: "Generate 3-phase migration plans when adoption triggers fire"
        tool: "TechStackEvolutionPlanner"
        validator_method: "validate_all"
        evidence_required: true
        auto_fix: false
        severity: "LOW"
        plan_structure:
          - "Phase 1: Assessment (1-2 weeks)"
          - "Phase 2: Pilot (2-4 weeks)"
          - "Phase 3: Rollout (4-8 weeks)"

  P2:
    name: "Quality"
    description: "Code quality, maintainability, technical debt"
    mandatory: true
    blocking: false
    checks:
      - id: "P2-001"
        name: "Duplicates (CORE-035)"
        description: "Single canonical implementation enforcement"
        tool: "cortex_detect_duplicates"
        threshold: "Similarity > 0.7"
        evidence_required: true
        auto_fix: false
        severity: "MEDIUM"
        related_rules: ["CORE-035"]
        
      - id: "P2-002"
        name: "Dead Code"
        description: "Unused functions, classes, variables"
        tool: "cortex_lens_analyze"
        analysis_types: ["dead_code"]
        evidence_required: true
        auto_fix: false
        severity: "LOW"
        
      - id: "P2-003"
        name: "Complexity Hotspots"
        description: "Functions >50 LOC or cyclomatic complexity >15"
        tool: "cortex_lens_analyze"
        analysis_types: ["complexity"]
        thresholds:
          max_loc: 50
          max_cyclomatic: 15
        evidence_required: true
        auto_fix: false
        severity: "LOW"
        
      - id: "P2-004"
        name: "Refactoring Opportunities"
        description: "Code smells (long parameter lists, god classes, etc.)"
        tool: "cortex_lens_analyze"
        analysis_types: ["refactoring"]
        evidence_required: true
        auto_fix: false
        severity: "LOW"

  P3:
    name: "Cleanup"
    description: "Repository cleanliness and maintenance"
    mandatory: true
    blocking: false
    execution_order: "RUN FIRST"
    checks:
      - id: "P3-001"
        name: "Vacuum Cleanup (RUN FIRST)"
        description: "Remove markdown sprawl, orphan files, temporary artifacts"
        tool: "VacuumOrchestrator"
        execution_order: 1
        evidence_required: true
        auto_fix: true
        severity: "LOW"
        targets:
          - "*.md files outside docs/"
          - "*.bak, *_v2.*, *.tmp files"
          - "PHASE-*-SUMMARY.md, MERGE-SUMMARY-*.md"
        
      - id: "P3-002"
        name: "Markdown Sprawl"
        description: "Verify no session summaries or completion reports in root"
        tool: "grep_search"
        pattern: "*-summary.md|*-report.md"
        exclude_patterns: ["docs/"]
        evidence_required: true
        auto_fix: false
        severity: "LOW"
        
      - id: "P3-003"
        name: "Orphan Files"
        description: "Detect backup files, version duplicates, temporary files"
        tool: "file_search"
        patterns:
          - "*.bak"
          - "*_v2.*"
          - "*_old.*"
          - "*.tmp"
        evidence_required: true
        auto_fix: false
        severity: "LOW"

# Execution configuration
execution:
  order:
    - "P3"  # Vacuum FIRST
    - "P0"  # Security & Critical
    - "P1"  # Infrastructure
    - "P1.5"  # Cohesion (Phase 39)
    - "P1.6"  # Future-Vision (Phase 39)
    - "P2"  # Quality
    
  performance:
    max_duration_seconds: 120  # 2 minutes
    parallel_checks: true
    timeout_per_check_seconds: 30
    
  reporting:
    inline_chat_only: true
    no_markdown_files: true
    evidence_format: "table"
    
# Phase 39 metadata
phase_39:
  title: "Cohesion & Future-Vision Audit Checks"
  status: "COMPLETE"
  validators_count: 8
  checks_added: 8
  implementation_date: "2026-02-07"
  mcp_tool: "cortex_audit_cohesion"
  test_coverage: "200/220 tests (90.9%)"
