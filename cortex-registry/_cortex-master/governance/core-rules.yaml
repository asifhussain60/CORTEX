# CORTEX Core Rules Registry
# Purpose: Machine-readable governance rules for CORTEX development
# Authority: cortex-architect.prompt.md v15.3 + copilot-instructions.md v7.6
# Created: 2026-02-06
# Version: 1.1 (CORE-048, CORE-049 added)

meta:
  version: "1.2"
  updated: "2026-02-08"
  authority: "Phase 51: MCP-FIRST Enforcement + CORE-050"
  source_files:
    - ".github/prompts/cortex-architect.prompt.md"
    - ".github/copilot-instructions.md"
  total_rules: 17

core_rules:
  - id: "CORE-002"
    name: "No Markdown File Generation"
    category: "governance"
    priority: "P0"
    description: |
      NO markdown file generation in chat responses. Inline chat ONLY.
      
      FORBIDDEN:
      - cat > *.md patterns
      - create_file tool for *.md reports
      - Terminal file generation
      - Markdown completion/summary/report artifacts
      - docs/*.md files (all findings must be inline or in cortex-registry YAML)
      
      REQUIRED:
      - All findings/results inline in chat
      - Use markdown tables (chat content, not files)
      - State via MCP tools or code files
      - Auto-vacuum after every completion
      
      EXCEPTION: ONLY 3 allowed paths:
      - .github/prompts/*.md (prompt file updates ONLY)
      - .github/agents/*.md (agent specification updates ONLY)
      - README.md (root repository README ONLY)
      ALL other markdown generation FORBIDDEN (including docs/*.md)
      
      DECISION TREE:
      Q: "Should I create docs/ANALYSIS.md?"
      A: NO → Display inline in chat
      
      Q: "Analysis is 500+ lines, too long for chat"
      A: NO → Summarize in chat, store raw data in cortex-registry YAML if reusable
      
      Q: "User wants to save this for later"
      A: NO → User can save chat transcript, not your job to create files
      
      Q: "This is governance documentation, seems legitimate"
      A: NO → Governance rules go in cortex-registry YAML, not docs/*.md
      
      Q: "When IS .md file creation allowed?"
      A: YES → ONLY: .github/prompts/*.md, .github/agents/*.md, README.md
    enforcement: "BLOCKED"
    violation_action: "Halt execution + regenerate response"
    detection_patterns:
      - "cat > .*\\.md"
      - "create_file.*\\.md"
      - "echo.*>.*\\.md"
      - "\\*-summary\\.md"
      - "\\*-report\\.md"
      - "\\*-completion\\.md"
    auto_fix: false
    enforced_by:
      - "EnforcementOrchestrator"
      - "MarkdownSuppressionAgent"
    related_enhancements:
      - "ENH-036"  # Markdown sprawl prevention
  
  - id: "CORE-008"
    name: "TDD Mandatory"
    category: "development"
    priority: "P0"
    description: |
      Tests MUST be written BEFORE code implementation.
      RED→GREEN→REFACTOR cycle enforced.
      
      All IMPLEMENT intents MUST route through TDDOrchestrator.
    enforcement: "PRE-EXECUTION"
    violation_action: "Route through TDDOrchestrator"
    detection_patterns:
      - "New .py files without corresponding test_*.py"
      - "Code changes without test changes"
    auto_fix: false
    enforced_by:
      - "TDDOrchestrator"
      - "GovernanceEnforcementAgent"
    related_rules:
      - "CORE-019"
  
  - id: "CORE-011"
    name: "Type Hints Mandatory"
    category: "code_quality"
    priority: "P1"
    description: |
      All function signatures MUST include type hints for parameters and return values.
      
      Example:
      def process_data(input: str, count: int) -> Dict[str, Any]:
          ...
    enforcement: "WARNING"
    violation_action: "Warn + log"
    detection_patterns:
      - "def \\w+\\([^:)]*\\):"  # Function without type hints
    auto_fix: false
    enforced_by:
      - "GovernanceEnforcementAgent"
  
  - id: "CORE-012"
    name: "Google-Style Docstrings"
    category: "documentation"
    priority: "P1"
    description: |
      All functions, classes, and modules MUST have Google-style docstrings.
      
      Required sections:
      - Summary (one-line)
      - Args (if applicable)
      - Returns (if applicable)
      - Raises (if applicable)
      
      Example:
      '''
      Process user data and return results.
      
      Args:
          user_id: The unique identifier for the user
          options: Optional processing parameters
      
      Returns:
          Dictionary containing processed results
      
      Raises:
          ValueError: If user_id is invalid
      '''
    enforcement: "WARNING"
    violation_action: "Warn + log"
    detection_patterns:
      - "def \\w+.*:\\s*$"  # Function without docstring
      - "class \\w+.*:\\s*$"  # Class without docstring
    auto_fix: false
    enforced_by:
      - "GovernanceEnforcementAgent"
  
  - id: "CORE-013"
    name: "No Bare Except"
    category: "error_handling"
    priority: "P1"
    description: |
      NEVER use bare except clauses (except:).
      Always specify exception types.
      
      FORBIDDEN:
      try:
          ...
      except:  # ❌ Bare except
          ...
      
      REQUIRED:
      try:
          ...
      except (ValueError, TypeError) as e:  # ✅ Specific exceptions
          ...
    enforcement: "WARNING"
    violation_action: "Warn + require fix"
    detection_patterns:
      - "except:\\s*$"
      - "except:\\s*#"
    auto_fix: false
    enforced_by:
      - "GovernanceEnforcementAgent"
  
  - id: "CORE-019"
    name: "IMPLEMENT via TDDOrchestrator"
    category: "workflow"
    priority: "P0"
    description: |
      ALL IMPLEMENT intents MUST route through TDDOrchestrator.
      NO direct file creation for implementation requests.
      
      Use MCP tool: cortex_process_request
    enforcement: "MCP_GATE"
    violation_action: "Block + redirect to MCP"
    detection_patterns:
      - "create_file when intent=IMPLEMENT"
    auto_fix: true
    auto_fix_action: "Redirect to cortex_process_request"
    enforced_by:
      - "IntentRouter"
      - "MCP Gateway"
    related_rules:
      - "CORE-008"
      - "MCP-FIRST"
      - "MCP-GATE"
  
  - id: "CORE-026"
    name: "Git Checkpoint Before Major Changes"
    category: "version_control"
    priority: "P1"
    description: |
      Create git commit checkpoint BEFORE major architectural changes.
      
      Major changes include:
      - Refactoring > 500 LOC
      - Breaking API changes
      - Database schema changes
      - Orchestrator rewiring
    enforcement: "WARNING"
    violation_action: "Warn + suggest checkpoint"
    detection_patterns:
      - "Large diff without recent commit"
    auto_fix: false
    enforced_by:
      - "SecurityCheckpointAgent"
  
  - id: "CORE-027"
    name: "Audit Trail Integrity"
    category: "governance"
    priority: "P1"
    description: |
      Maintain audit trail integrity with AC_START → AC_COMPLETE markers.
      
      Required for:
      - Architectural changes
      - Security modifications
      - Governance updates
    enforcement: "WARNING"
    violation_action: "Warn + log"
    detection_patterns:
      - "AC_START without AC_COMPLETE"
      - "AC_COMPLETE without AC_START"
    auto_fix: false
    enforced_by:
      - "SecurityCheckpointAgent"
  
  - id: "CORE-028"
    name: "Intelligent File Naming"
    category: "conventions"
    priority: "P1"
    description: |
      File naming conventions:
      - kebab-case for most files (my-feature.py)
      - NO SCREAMING_CASE (MY_FEATURE.py) ❌
      - Plan files ≤40 chars
      
      EXCEPTIONS:
      - Test files: test_*.py (snake_case)
      - Constants modules: CONSTANTS.py (acceptable)
      - Environment files: .ENV (acceptable)
    enforcement: "BLOCKED"
    violation_action: "Block + suggest rename"
    detection_patterns:
      - "[A-Z_]{5,}\\.py"  # SCREAMING_CASE Python files
      - "phase-.{40,}\\.md"  # Long plan files
    auto_fix: false
    enforced_by:
      - "FileNamingEnforcementAgent"
  
  - id: "CORE-029"
    name: "Response Header Mandatory"
    category: "formatting"
    priority: "P0"
    description: |
      EVERY response MUST begin with standardized header:
      
      ## 🧠 CORTEX {mode}
      **Author:** Asif Hussain | **Mode:** {mode} | **Scope:** {scope} ✅
      
      Modes: Architect, Audit, Design, Plan, Digest, Interactive, Meta-Audit
    enforcement: "WARNING"
    violation_action: "Warn (not blocking)"
    detection_patterns:
      - "Response without ## 🧠 CORTEX header"
    auto_fix: false
    enforced_by:
      - "GovernanceEnforcementAgent"
    related_files:
      - ".github/prompts/response-format-standards.md"
  
  - id: "CORE-030"
    name: "Implementation Truth"
    category: "validation"
    priority: "P0"
    description: |
      Verify code, not docs. Always validate against actual implementation.
      
      Priority:
      1. Running code (highest truth)
      2. Tests (behavioral truth)
      3. Type signatures (contract truth)
      4. Documentation (lowest truth)
      
      NEVER assume documentation is accurate without verification.
    enforcement: "PRINCIPLE"
    violation_action: "Code review reminder"
    detection_patterns: []
    auto_fix: false
    enforced_by:
      - "GovernanceEnforcementAgent"
  
  - id: "CORE-035"
    name: "Single Canonical Implementation"
    category: "architecture"
    priority: "P0"
    description: |
      NO duplicate implementations. One canonical version only.
      
      FORBIDDEN:
      - feature_v2.py alongside feature.py
      - Duplicate orchestrators
      - Redundant utilities
      
      Use: cortex_detect_duplicates tool to validate
    enforcement: "BLOCKED"
    violation_action: "Block + require consolidation"
    detection_patterns:
      - ".*_v\\d+\\.py"
      - ".*_old\\.py"
      - ".*_backup\\.py"
      - "Duplicate function signatures"
    auto_fix: false
    enforced_by:
      - "ArchitectureIntegrityAgent"
    mcp_tools:
      - "cortex_detect_duplicates"
  
  - id: "CORE-036"
    name: "Industry Standards Compliance"
    category: "standards"
    priority: "P1"
    description: |
      Verify compliance against industry standards at runtime.
      
      Standards sources:
      - 45+ knowledge YAML files
      - company/domains/ standards
      - OWASP Top 10
      - 12-Factor App
      - SOLID principles
      - Clean Code principles
    enforcement: "RUNTIME"
    violation_action: "Warn + cite standard"
    detection_patterns: []
    auto_fix: false
    enforced_by:
      - "ComplianceValidationAgent"
    related_enhancements:
      - "Phase-27"  # Company Domain Integration
  
  - id: "CORE-041"
    name: "Event-Driven Architecture"
    category: "architecture"
    priority: "P2"
    description: |
      Use event-driven, message-based communication patterns.
      
      Preferred:
      - Event bus for orchestrator communication
      - Pub/sub patterns
      - Async message passing
      
      Avoid:
      - Direct function calls across layers
      - Tight coupling
    enforcement: "PRINCIPLE"
    violation_action: "Architecture review"
    detection_patterns: []
    auto_fix: false
    enforced_by:
      - "ArchitectureIntegrityAgent"
  
  - id: "CORE-047"
    name: "Backtick References Only"
    category: "documentation"
    priority: "P1"
    description: |
      Instruction files MUST use backtick references, NOT markdown links.
      
      FORBIDDEN:
      [text](path.md) ❌  # VS Code auto-loads, causes 51k+ token bloat
      
      REQUIRED:
      `path.md` ✅  # Reference only, no auto-load
      
      Applies to: .github/prompts/, .github/agents/, instruction files
    enforcement: "WARNING"
    violation_action: "Warn + suggest fix"
    detection_patterns:
      - "\\[.*\\]\\(.*\\.md\\)"  # Markdown links to .md files
    auto_fix: true
    auto_fix_action: "Replace [text](path.md) with `path.md`"
    enforced_by:
      - "EnforcementOrchestrator"
    related_enhancements:
      - "ENH-048"  # Prompt Unbloating

  - id: "CORE-048"
    name: "Holistic Validation Gate"
    category: "governance"
    priority: "P0"
    description: |
      MANDATORY pre-implementation validation + challenge gate.
      
      Triggered BEFORE any IMPLEMENT/FIX/REFACTOR intent.
      
      Sequence:
      1. Registry holistic check (index.yaml, wiring.yaml)
      2. Dependency graph analysis
      3. Regression risk scoring (0.0 - 1.0)
      4. Architecture drift detection
      5. Mandatory challenge gate with alternatives
      6. cortex_brain context (for CORTEX self-development)
      
      BLOCK if risk score > 0.7 (user override required)
      WARN if risk score > 0.4 (proceed with caution)
    enforcement: "BLOCKING"
    violation_action: "Block + show evidence + require explicit proceed"
    detection_patterns:
      - "IMPLEMENT intent without validation"
      - "FIX intent without risk assessment"
    auto_fix: false
    enforced_by:
      - "HolisticValidationOrchestrator"
      - "cortex-holistic-validator.md"
    related_phases:
      - "phase-48"  # Holistic Validation & Challenge Gate

  - id: "CORE-049"
    name: "Silent Autonomous Execution"
    category: "interaction"
    priority: "P0"
    description: |
      When user triggers execution (proceed, implement, yes, continue):
      
      DO:
      - Execute silently with ASCII progress bars
      - Report ONLY on completion or error
      - Commit progress automatically
      
      DON'T:
      - Ask "shall I proceed?" confirmations
      - Narrate what you're doing
      - Request mid-execution approval
      - Multi-paragraph explanations
      
      Progress Bar Format:
      [████████░░] 80% {stage_name}
      ├─ ✅ S1: {name} ({n} tests)
      └─ 🔵 S2: {name} (in progress)
      
      Override: User says "verbose" for detailed narration
    enforcement: "DEFAULT_BEHAVIOR"
    violation_action: "N/A - behavioral guideline"
    detection_patterns:
      - '"shall I proceed" after user said proceed'
      - '"here''s what I''ll do" during execution'
    auto_fix: false
    enforced_by:
      - "All agents (inherited behavior)"
    related_enhancements:
      - "Phase-35"  # Autonomous Execution Enhancement

  - id: "CORE-050"
    name: "No Quality Degradation"
    category: "governance"
    priority: "P0"
    description: |
      CORTEX MUST NEVER accept degraded execution modes or bypass quality standards.
      
      Policy: Fix infrastructure, don't bypass standards.
      
      FORBIDDEN:
      - "Basic mode" / "simplified analysis" / "quick fix" modes
      - Skipping TDD when dependencies missing
      - Direct file operations when MCP unavailable
      - Accepting incomplete/broken implementations as "done"
      - Degrading from production quality to "good enough"
      
      REQUIRED:
      - Fix missing dependencies properly (with TDD)
      - Start MCP server when unavailable (don't bypass)
      - Maintain 100% CORE compliance at all times
      - Block execution until prerequisites met
      - Single quality level: Production standards
      
      Example scenarios:
      - MCP unavailable → BLOCK + show fix instructions (don't use direct files)
      - Missing module → Implement with TDD (don't create file directly)
      - Tests failing → Fix tests (don't skip or disable)
      - Dependencies missing → Install properly (don't work around)
      
      Rationale: Progressive quality degradation undermines system integrity.
      Short-term workarounds create long-term technical debt and governance violations.
    enforcement: "BLOCKED"
    violation_action: "Block execution + show infrastructure fix instructions"
    detection_patterns:
      - "basic mode"
      - "simplified analysis"
      - "quick fix"
      - "skip tests"
      - "bypass MCP"
      - "work around"
    auto_fix: false
    enforced_by:
      - "EnvironmentIntegrityAgent (8th enforcement agent)"
      - "EnforcementOrchestrator"
    related_rules:
      - "CORE-008"  # TDD (don't skip when infra missing)
      - "CORE-019"  # IMPLEMENT via TDDOrchestrator
      - "MCP-FIRST"  # Don't bypass MCP
      - "MCP-GATE"  # Don't use direct file tools
    related_phases:
      - "phase-51"  # MCP-FIRST Enforcement with Fail-Fast

# Special Rules (Non-CORE)
special_rules:
  - id: "MCP-FIRST"
    name: "MCP-First Architecture"
    category: "architecture"
    priority: "P0"
    description: "ALL functionality MUST be exposed via MCP tools"
    enforcement: "ARCHITECTURAL"
  
  - id: "MCP-GATE"
    name: "MCP Gateway Enforcement"
    category: "workflow"
    priority: "P0"
    description: "IMPLEMENT intents MUST use cortex_process_request tool (NO direct file creation)"
    enforcement: "BLOCKED"
  
  - id: "ARCH-012"
    name: "Standards Gate"
    category: "standards"
    priority: "P0"
    description: "12-Factor + SOLID + Clean Code + OWASP compliance required"
    enforcement: "RUNTIME"

# Enforcement Matrix
enforcement_levels:
  BLOCKED:
    description: "Prevents execution, requires fix"
    severity: "CRITICAL"
    rules: ["CORE-002", "CORE-008", "CORE-019", "CORE-028", "CORE-035", "CORE-050", "MCP-GATE"]
  
  PRE-EXECUTION:
    description: "Validates before execution, can redirect"
    severity: "HIGH"
    rules: ["CORE-008", "CORE-019"]
  
  WARNING:
    description: "Logs warning, execution continues"
    severity: "MEDIUM"
    rules: ["CORE-011", "CORE-012", "CORE-013", "CORE-026", "CORE-027", "CORE-029", "CORE-047"]
  
  RUNTIME:
    description: "Validates during execution"
    severity: "MEDIUM"
    rules: ["CORE-036", "ARCH-012"]
  
  PRINCIPLE:
    description: "Guiding principle, not enforced by automation"
    severity: "LOW"
    rules: ["CORE-030", "CORE-041"]

