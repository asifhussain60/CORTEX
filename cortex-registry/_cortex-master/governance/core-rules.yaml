# Usage Examples
usage_examples:
  load_all_rules:
    description: "Load all CORE rules for validation"
    code: |
      from cortex.brain.core.yaml_loaders import CoreRulesLoader
      
      loader = CoreRulesLoader()
      rules = loader.load_all_rules()
      
      for rule in rules:
          print(f"{rule.id}: {rule.name} [{rule.enforcement}]")
  
  validate_code:
    description: "Validate code against specific rules"
    code: |
      from cortex.brain.core.yaml_loaders import CoreRulesLoader
      
      loader = CoreRulesLoader()
      violations = loader.validate_against_rules(
          code=my_code,
          rule_ids=["CORE-002", "CORE-008", "CORE-035"]
      )
      
      if violations:
          for v in violations:
              print(f"Violation: {v.rule_id} - {v.message}")
  
  get_priority_rules:
    description: "Get all P0 (critical) rules"
    code: |
      from cortex.brain.core.yaml_loaders import CoreRulesLoader
      
      loader = CoreRulesLoader()
      p0_rules = loader.get_rules_by_priority("P0")
      
      print(f"Found {len(p0_rules)} P0 rules")
