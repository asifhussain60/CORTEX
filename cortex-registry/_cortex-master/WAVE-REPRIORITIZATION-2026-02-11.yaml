    priority: "P1-HIGH"
    duration: "10-12 days"
    status: "planned"
    changes: "NONE"
    dependencies: ["Wave 1"]
  
  # --------------------------------------------------------------------------
  # WAVE 8: ARCHITECTURE DOCS (DEFERRED - NEW POSITION)
  # --------------------------------------------------------------------------
  wave_8:
    name: "Architecture Documentation Migration & Consolidation"
    priority: "P2-MEDIUM"  # DOWNGRADED from implicit P1 in Phase 53
    duration: "5-7 days"
    status: "planned"
    changes:
      - "POSITION CHANGE: Moved to end of execution plan (was distributed)"
      - "SCOPE INCLUDES: Phase 53 S7-S9 (LENS Dashboard generation)"
      - "RATIONALE: Document AFTER architecture stabilizes"
    
    scope:
      architecture_migration:
        source: "_workspaces/cortex-architecture/"
        destination: "cortex-registry/architecture/"
        actions:
          - "Migrate existing architecture docs to registry"
          - "Auto-generate diagrams from wiring.yaml"
          - "Detect + resolve documentation contradictions"
          - "Create living architecture (SSOT in registry)"
      
      lens_dashboard_generation:
        source: "Phase 53 S7-S9 (deferred from original plan)"
        deliverables:
          - "Repository onboarding dashboard (HTML + embedded data)"
          - "LENS analysis visualization (complexity, security, dependencies)"
          - "Knowledge graph visualization (technology stack, relationships)"
          - "Dashboard suite landing page (index.html)"
        
        rationale_for_deferral: |
          **ORIGINAL:** Phase 53 S7-S9 in main execution flow (blocks other work)
          **NEW:** Deferred to Wave 8 (after architecture stable)
          
          **JUSTIFICATION:**
          1. **Data Dependency:** Dashboards require validated data layer (Track 5)
          2. **Architecture Stability:** Dashboard structure depends on orchestrator topology
          3. **Low Priority:** Visualization is NICE-TO-HAVE, not production-critical
          4. **Batch Efficiency:** Combine with architecture docs (single wave)
          5. **User Impact:** Developers don't need dashboards for daily work
      
      prompt_updates:
        target: ".github/prompts/cortex-architect.prompt.md"
        actions:
          - "Update orchestrator counts (26→15)"
          - "Update file counts (114→20-25)"
          - "Update test counts (include Track 1-5 results)"
          - "Add architecture diagrams (Mermaid)"
          - "Increment version: v15.3 → v16.0"
      
      deliverables:
        - "cortex-registry/architecture/ (complete migration)"
        - "Auto-generation pipeline (diagrams, metrics, topology)"
        - "LENS dashboards (repository, analysis, knowledge graph)"
        - "Contradiction detection report"
        - "cortex-architect.prompt.md v16.0"
        - "DELETE: _workspaces/cortex-architecture/"
    
    dependencies: ["Wave 7", "Wave 6"]  # After consolidation + cleanup
    blocks: []
    
    rationale_for_deferral: |
      **WHY DEFER TO END:**
      
      1. **Architecture Must Stabilize First:**
         - Wave 7 consolidates 26→15 orchestrators (massive topology change)
         - Documenting topology BEFORE consolidation = outdated immediately
         - Therefore: Complete consolidation, THEN document
      
      2. **Low ROI Until Stable:**
         - Documentation has ROI 8.5 (high for maintenance)
         - But ROI is ZERO if architecture changes before docs complete
         - Deferring to end maximizes ROI (document once, stable state)
      
      3. **Batch Efficiency:**
         - Combining architecture docs + LENS dashboards = single context switch
         - Reduces cognitive load (one "documentation sprint" vs distributed)
         - Estimated savings: 2-3 days (batched vs distributed)
      
      4. **CORE-002 Alignment:**
         - CORE-002 mandates markdown suppression (inline chat only)
         - Architecture docs are EXCEPTION (registry YAML + auto-generation)
         - Handling all documentation at end simplifies CORE-002 compliance
      
      5. **Parallel Execution Window:**
         - Waves 2-6 can execute independently (no docs required)
         - Wave 8 is pure documentation (no code dependencies)
         - Therefore: Defer to end without blocking value delivery
  
  # --------------------------------------------------------------------------
  # WAVE 9: WORKSPACE CLEANUP (DEFERRED - NEW POSITION)
  # --------------------------------------------------------------------------
  wave_9:
    name: "Workspace Cleanup & Structure Optimization"
    priority: "P2-MEDIUM"
    duration: "3-4 days"
    status: "planned"
