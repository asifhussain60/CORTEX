title: "Wave Reprioritization: Production Value First, Documentation Last"
created: '2026-02-11'
authority:
  - chat01.md Copilot Session Digest
  - User directive: "defer documentation to end, prioritize high-value tested capabilities"
  - CORE-002 (markdown suppression)
  - Phase 81 (Agent Architecture Redesign)

# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
summary: |
  REPRIORITIZATION RATIONALE:
  
  **Current Plan Issues:**
  - Wave 8 (Architecture Docs) and Phase 53 S7-S9 (LENS Dashboard) block production value
  - Documentation work is LOW ROI until architecture stabilizes (post-Wave 7)
  - LENS physical file testing (Track 5) has HIGHER ROI than dashboards (prevents data loss)
  - Orchestrator consolidation (Wave 7) should complete BEFORE agent redesign (Wave 2)
  
  **New Execution Order:**
  1. Wave 1: Foundation (security, onboarding, LENS intelligence) - UNCHANGED
  2. Wave 7: Orchestrator Consolidation + LENS Tests - PRIORITY BOOST (P0)
  3. Wave 2: Intelligence (agent redesign after orchestrator stabilization)
  4. Wave 3: Autonomy (execution improvements)
  5. Wave 4: Enhancement (domain improvements)
  6. Wave 5: UX Polish (user experience)
  7. Wave 6: Cleanup (standards enforcement)
  8. Wave 8: Architecture Docs (DEFERRED - after consolidation complete) - NEW
  9. Wave 9: Workspace Cleanup (DEFERRED - final polish) - NEW
  
  **Key Changes:**
  - ✅ Wave 7 Track 5 (LENS Tests) elevated to P0-CRITICAL
  - ✅ Phase 53 S7-S9 (LENS Dashboard) moved to Wave 8 (P2-MEDIUM)
  - ✅ Wave 8/9 (Documentation/Cleanup) deferred to end (after architecture stable)
  - ✅ Parallel execution opportunities maintained (Wave 7 Track 2-5 can run concurrently)
  
  **Timeline Impact:**
  - Original: 62 days (with parallel execution)
  - New: 58 days (documentation deferred, LENS tests prioritized)
  - Savings: 4 days (documentation batched at end vs distributed)

# ============================================================================
# DETAILED WAVE REPRIORITIZATION
# ============================================================================

waves:
  # --------------------------------------------------------------------------
  # WAVE 1: FOUNDATION (UNCHANGED)
  # --------------------------------------------------------------------------
  wave_1:
    name: "Foundation (Production-Critical Infrastructure)"
    priority: "P0-CRITICAL"
    duration: "12-14 days"
    status: "ready"
    changes: "NONE - remains first priority"
    phases:
      - ENH-063: Production Security + Reliability (15 fixes)
      - ENH-066: MCP Onboarding Clarity (10x faster)
      - ENH-064: LENS Intelligence (0% → 90% understanding)
    
    rationale: |
      Security and onboarding are foundational blockers. No changes needed.
  
  # --------------------------------------------------------------------------
  # WAVE 7: ORCHESTRATOR CONSOLIDATION + LENS TESTS (PRIORITY BOOST)
  # --------------------------------------------------------------------------
  wave_7:
    name: "Orchestrator Consolidation + LENS Physical File Testing"
    priority: "P0-CRITICAL"  # UPGRADED from P1-HIGH
    duration: "18-24 days"  # Extended to include Track 5
    status: "in_progress"  # Track 1 COMPLETE (55/55 tests)
    changes:
      - "PRIORITY BOOST: P1-HIGH → P0-CRITICAL"
      - "SCOPE EXPANSION: Added Track 5 (LENS Physical File Testing)"
      - "DURATION INCREASE: 14-22 days → 18-24 days (Track 5 adds 3-4 days)"
      - "ROI INCREASE: 9.2 → 9.5 (LENS tests prevent production data loss)"
    
    tracks:
      track_1_core:
        name: "Core Layer Consolidation"
        status: "COMPLETE ✅"
        completion_date: "2026-02-11"
        tests_passing: "55/55"
        commits:
          - "c64727763: StageExecutionStrategy base (20 tests)"
          - "6e3449f7e: Stage1ComprehensionStrategy (8 tests)"
          - "f5adb57d7: Stage2/3/4 strategies (17 tests)"
          - "601b33371: MasterOrchestrator refactor (10 integration tests)"
        deliverables:
          - "StageExecutionStrategy pattern (base + 4 implementations)"
          - "MasterOrchestrator refactored (600 lines → strategy delegation)"
          - "Behavioral contract tests (100% passing)"
          - "Integration tests (Stage 1→2→3→4 pipeline)"
      
      track_2_domain:
        name: "Domain Layer Consolidation"
        status: "planned"
        duration: "8-12 days"
        consolidations:
          - "EnhancedRefactoringOrchestrator (absorbs 3 orchestrators)"
          - "EnhancedPlanningOrchestrator (absorbs 2 orchestrators)"
          - "EnhancedDocumentationOrchestrator"
          - "AutonomousExecutionEngine (gains multi-step TDD)"
      
      track_3_support:
        name: "Support Layer Elimination"
        status: "planned"
        duration: "6-9 days"
        actions:
          - "15 support orchestrators → 2 consolidated"
          - "ToolDiscoveryOrchestrator + OnboardingOrchestrator preserved"
          - "13 orchestrators eliminated via Strategy Pattern"
      
      track_4_cleanup:
        name: "Orphan Cleanup"
        status: "planned"
        duration: "3-4 days"
        actions:
          - "88 orphaned orchestrators deleted"
          - "File reduction: 114 → 20-25 files"
          - "Class reduction: 201+ → 35-45 classes"
      
      track_5_lens_tests:
        name: "LENS Physical File Testing (NEW - ELEVATED PRIORITY)"
        priority: "P0-CRITICAL"  # HIGHEST within Wave 7
        status: "planned"
        duration: "3-4 days"
        roi: 9.5  # Prevents production data loss
        rationale: |
          **WHY P0-CRITICAL:**
          - LENS creates 15+ YAML/JSON files across 3 directories during onboarding
          - Current tests use mocking/stubbing (no physical validation)
          - Production risk: Silent failures (profiles vanish, corrupt data)
          - Prevents: Repository onboarding failures, knowledge graph gaps, dashboard data loss
          
          **HIGHER VALUE THAN DASHBOARDS:**
          - Dashboards (Phase 53 S7-S9) are VISUALIZATION ONLY (P2)
          - Physical file tests are DATA INTEGRITY (P0)
          - Dashboards can be built on corrupt data without this validation
          
          **BLOCKING RELATIONSHIP:**
          - Wave 8 (Architecture Docs) requires stable architecture (after Wave 7)
          - Phase 53 LENS Dashboard requires validated data layer (Track 5)
          - Therefore: Track 5 MUST complete BEFORE Wave 8 or dashboards
        
        scope:
          - "Physical file lifecycle testing pattern (create → validate → delete)"
          - "RepositoryOnboardingOrchestrator profile validation"
          - "DomainBrainController state file validation"
          - "LENSOrchestrator analysis cache validation"
          - "KnowledgeSynthesisEngine YAML aggregation validation"
          - "AST analyzers tree-sitter binary validation"
        
        test_strategy:
          approach: "Integration-First Testing (reverse pyramid)"
          rationale: "LENS is integration-heavy (AST + Git + Files + Knowledge)"
          new_test_ratio:
            integration_tests: "40% (physical files, real repos)"
            unit_tests: "35% (pure logic)"
            end_to_end_tests: "25% (full onboarding → dashboard)"
          
          test_pattern_template: |
            @pytest.fixture
            def temp_repo_fixture(tmp_path):
                # Create temporary repo with git history
                repo_path = tmp_path / "test_repo"
                repo_path.mkdir()
                init_git_repo(repo_path)
                yield repo_path
                # Cleanup: Verify all YAML/JSON files deleted
                assert not list(repo_path.glob("**/*.yaml"))
            
            def test_onboarding_creates_profile_yaml(temp_repo_fixture):
                orchestrator = RepositoryOnboardingOrchestrator()
                result = orchestrator.onboard_repository(temp_repo_fixture)
                
                # CRITICAL: Validate physical file exists
                profile_path = cortex_brain / "onboarded_repos" / "test_repo.yaml"
                assert profile_path.exists()
                assert profile_path.stat().st_size > 0
                
                # Validate YAML structure
                with open(profile_path) as f:
                    profile = yaml.safe_load(f)
                    assert "repository_name" in profile
                    assert "technologies" in profile
        
        deliverables:
          - "tests/fixtures/temp_repos/ (test isolation framework)"
          - "25 new integration tests (physical file validation)"
          - "12 retrofitted existing tests (add physical checks)"
          - "E2E test: Onboard → Analyze → Dashboard (full stack)"
          - "95% file I/O path coverage (up from 40%)"
        
        blocking_issues_prevented:
          - "Repository profiles vanish after restart (production bug)"
          - "Knowledge graph incomplete (missing YAML aggregations)"
          - "Dashboard displays stale data (cache not validated)"
          - "AST analysis fails silently (tree-sitter binaries missing)"
    
    dependencies: ["Wave 1"]
    blocks: ["Wave 2", "Wave 8"]  # Architecture docs require stable orchestrators
    
    rationale_for_priority_boost: |
      **ORIGINAL PRIORITY:** P1-HIGH (based on ROI 9.2)
      **NEW PRIORITY:** P0-CRITICAL (based on ROI 9.5 + data integrity risk)
      
      **JUSTIFICATION:**
      1. **Data Integrity Risk (P0):**
         - LENS creates production data (repository profiles, knowledge graphs)
         - Without physical validation, silent failures corrupt data layer
         - Dashboards and analytics depend on this data (downstream cascade)
      
      2. **Architectural Stability Requirement:**
         - Wave 8 (Architecture Docs) documents orchestrator topology
         - Cannot document architecture until consolidation complete
         - Therefore: Wave 7 MUST complete before Wave 8
      
      3. **Agent Redesign Dependency (Wave 2):**
         - Agent redesign (Wave 2) depends on orchestrator count
         - Consolidating 26→15 orchestrators changes agent interaction patterns
         - Therefore: Wave 7 MUST complete before Wave 2
      
      4. **ROI Justification:**
         - Original ROI 9.2 (code reduction + EventBus decoupling)
         - Track 5 adds +0.3 ROI (prevents production data loss)
         - New ROI 9.5 (highest of all waves)
  
  # --------------------------------------------------------------------------
  # WAVE 2: INTELLIGENCE (UNCHANGED - But now after Wave 7)
  # --------------------------------------------------------------------------
  wave_2:
    name: "Intelligence (Enhanced Decision Making)"
    priority: "P1-HIGH"
    duration: "10-14 days"
    status: "planned"
    changes:
      - "DEPENDENCY CHANGE: Now depends on Wave 7 (was independent)"
      - "RATIONALE: Agent redesign needs stable orchestrator count"
    
    phases:
      - "phase-81: Agent Architecture Redesign"
      - "ENH-067: Recommendation Gate"
      - "ENH-068: Multi-Agent Orchestration"
    
    dependencies: ["Wave 1", "Wave 7"]  # CHANGED: Added Wave 7 dependency
    blocks: []
    
    rationale_for_dependency_change: |
      **ORIGINAL:** Wave 2 could start after Wave 1 (independent of Wave 7)
      **NEW:** Wave 2 depends on Wave 7 completion
      
      **JUSTIFICATION:**
      - Agent redesign (phase-81) involves agent-orchestrator interaction patterns
      - Consolidating 26→15 orchestrators changes these patterns significantly
      - Redesigning agents BEFORE consolidation = rework when orchestrators change
      - Therefore: Complete orchestrator consolidation FIRST, then redesign agents
  
  # --------------------------------------------------------------------------
  # WAVE 3-6: UNCHANGED (Sequential execution)
  # --------------------------------------------------------------------------
