        new: "cortex-registry/core/cognition/bootstrap-sequence.yaml"
        files_to_scan: ["cortex/bootstrap/**/*.py", "cortex/governance/**/*.py"]
      
      - old: "cortex/brain/tier0/lens-protocol-implementation.yaml"
        new: "cortex-registry/core/cognition/perception-protocol.yaml"
        files_to_scan: ["cortex_lens/**/*.py", "cortex/brain/**/*.py"]
      
      - old: "cortex/brain/tier2/response-templates-index.yaml"
        new: "cortex-registry/memory/response-patterns/response-pattern-registry.yaml"
        files_to_scan: ["cortex/interaction/**/*.py", "cortex/orchestrators/**/*.py"]
      
      - old: "cortex/execution/specs/*.yaml"
        new: "cortex-registry/core/specifications/*.yaml"
        files_to_scan: ["cortex/execution/**/*.py", "cortex/orchestrators/**/*.py"]
      
      - old: "cortex/wiring/specs/*.yaml"
        new: "cortex-registry/core/wiring/*.yaml"
        files_to_scan: ["cortex/wiring/**/*.py", "cortex/orchestrators/**/*.py"]
      
      - old: "cortex/config/*.yaml"
        new: "cortex-registry/core/config/*.yaml"
        files_to_scan: ["cortex/config/**/*.py", "cortex/bootstrap/**/*.py"]
      
      - old: "cortex/templates/planning/*.yaml"
        new: "cortex-registry/planning/roadmap-templates/*.yaml"
        files_to_scan: ["cortex/orchestrators/**/*.py", "cortex/phase_executors/**/*.py"]
    
    validation:
      - "Run grep to find remaining old paths"
      - "No FileNotFoundError in import statements"
      - "All YAML loaders point to new locations"
    
    success_criteria:
      - "All Python imports updated"
      - "0 references to old paths"
      - "No import errors"
  
  - stage_id: "S6"
    name: "Update YAML Cross-References"
    description: "Update YAML files referencing other YAMLs"
    duration_estimate: "30 min"
    dependencies: ["S5"]
    
    files_to_update:
      - file: "cortex-registry/cortex-master.yaml"
        updates:
