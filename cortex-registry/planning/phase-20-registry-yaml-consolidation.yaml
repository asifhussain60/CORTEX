        - from: "cortex/execution/specs/domain-transitions.yaml"
          to: "cortex-registry/core/specifications/domain-transition-rules.yaml"
        - from: "cortex/orchestrators/core/specs/core_wiring.yaml"
          to: "cortex-registry/core/specifications/core-orchestrator-wiring.yaml"
        - from: "cortex/orchestrators/domain/specs/domain_wiring.yaml"
          to: "cortex-registry/core/specifications/domain-orchestrator-wiring.yaml"
        - from: "cortex/orchestrators/support/specs/support_wiring.yaml"
          to: "cortex-registry/core/specifications/support-orchestrator-wiring.yaml"
        - from: "cortex/orchestrators/core/master_wiring.yaml"
          to: "cortex-registry/core/specifications/orchestration-master-wiring.yaml"
      
      wiring:
