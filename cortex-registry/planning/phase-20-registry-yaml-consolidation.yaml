          to: "cortex-registry/core/config/system-configuration.yaml"
        - from: "cortex/config/features.yaml"
          to: "cortex-registry/core/config/feature-flags.yaml"
      
      response_patterns:
        - from: "cortex/brain/tier2/response-templates-index.yaml"
          to: "cortex-registry/memory/response-patterns/response-pattern-registry.yaml"
        - from: "cortex/brain/tier2/base/success-response.yaml"
          to: "cortex-registry/memory/response-patterns/success-response-pattern.yaml"
        - from: "cortex/brain/tier2/base/error-response.yaml"
          to: "cortex-registry/memory/response-patterns/error-response-pattern.yaml"
        - from: "cortex/brain/tier2/base/warning-response.yaml"
          to: "cortex-registry/memory/response-patterns/warning-response-pattern.yaml"
        - from: "cortex/brain/tier2/domains/planning/impact-assessment.yaml"
          to: "cortex-registry/memory/response-patterns/impact-assessment-pattern.yaml"
        - from: "cortex/brain/tier2/domains/planning/recommendations.yaml"
          to: "cortex-registry/memory/response-patterns/recommendation-pattern.yaml"
        - from: "cortex/brain/tier2/domains/governance/evaluation-result.yaml"
          to: "cortex-registry/memory/response-patterns/governance-evaluation-pattern.yaml"
        - from: "cortex/brain/tier2/domains/governance/rule-violation.yaml"
          to: "cortex-registry/memory/response-patterns/rule-violation-pattern.yaml"
        - from: "cortex/brain/tier2/domains/tdd/test-result.yaml"
          to: "cortex-registry/memory/response-patterns/test-result-pattern.yaml"
        - from: "cortex/brain/tier2/domains/tdd/coverage-report.yaml"
          to: "cortex-registry/memory/response-patterns/coverage-report-pattern.yaml"
      
      planning_templates:
        - from: "cortex/templates/planning/simple_wave.yaml"
          to: "cortex-registry/planning/roadmap-templates/linear-execution-template.yaml"
        - from: "cortex/templates/planning/complex_wave.yaml"
          to: "cortex-registry/planning/roadmap-templates/parallel-execution-template.yaml"
        - from: "cortex/templates/planning/simple-roadmap/index.yaml"
          to: "cortex-registry/planning/roadmap-templates/phased-roadmap-template.yaml"
        - from: "cortex/templates/planning/complex-roadmap/index.yaml"
          to: "cortex-registry/planning/roadmap-templates/epic-roadmap-template.yaml"
    
    success_criteria:
      - "33 files moved successfully"
      - "Git history preserved (verify with git log --follow)"
      - "No orphaned files in old locations"
  
  - stage_id: "S4"
    name: "Delete Redundant Files"
    description: "Remove 8 duplicate/sample files"
    duration_estimate: "10 min"
    dependencies: ["S3"]
    
    file_deletions:
      duplicate_governance:
        - "cortex_intelligence/memory/core/governance/CORE-095-folder-structure.yaml"
        - "cortex_intelligence/memory/core/governance/CORE-096-build-artifacts.yaml"
        - "cortex_intelligence/memory/core/governance/CORE-097-duplicate-detection.yaml"
        - "cortex_intelligence/memory/core/governance/core-040-execution-spec-mandate.yaml"
      
      sample_planning:
        - "cortex/templates/planning/cortex_50_wave.yaml"
        - "cortex/templates/planning/simple-roadmap/phases/active/P-001-foundation.yaml"
        - "cortex/templates/planning/simple-roadmap/phases/active/P-002-core-feature.yaml"
        - "cortex/templates/planning/simple-roadmap/phases/active/P-003-stabilization.yaml"
    
