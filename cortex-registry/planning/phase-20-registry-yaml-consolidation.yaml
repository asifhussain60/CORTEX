  - stage_id: "S7"
    name: "Test Suite Validation"
    description: "Verify no regressions from path changes"
    duration_estimate: "30 min"
    dependencies: ["S5", "S6"]
    
    test_suites:
      - name: "Governance Loader Tests"
        command: "pytest tests/cortex/governance/ -v"
        expected: "All tests pass, skull-rules.yaml loads"
      
      - name: "Response Template Tests"
        command: "pytest tests/cortex/interaction/ -v"
        expected: "All templates load from new paths"
      
      - name: "Planning Orchestrator Tests"
        command: "pytest tests/cortex/orchestrators/ -k planning -v"
        expected: "Roadmap templates load successfully"
      
      - name: "Bootstrap Sequence Tests"
        command: "pytest tests/cortex/bootstrap/ -v"
        expected: "Bootstrap loads from cognition layer"
      
      - name: "Golden Test Suite"
        command: "pytest tests/ -k golden -v"
        expected: "191/191 golden tests passing"
      
      - name: "Full Test Suite"
        command: "pytest tests/ -x"
        expected: "No FileNotFoundError exceptions"
    
    success_criteria:
      - "All YAML files load without errors"
      - "0 FileNotFoundError exceptions"
      - "191/191 golden tests passing"
      - "0 import errors"
      - "Test duration within baseline (±10%)"
  
