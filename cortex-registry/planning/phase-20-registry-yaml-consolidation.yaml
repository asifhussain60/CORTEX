          to: "cortex-registry/core/wiring/autonomous-execution-protocol.yaml"
        - from: "cortex/wiring/specs/mcp-first.yaml"
          to: "cortex-registry/core/wiring/mcp-priority-policy.yaml"
        - from: "cortex/wiring/specs/validation-gate.yaml"
