    severity: "High"
    probability: "Medium"
    mitigation: "Stage 5 comprehensive path scan + Stage 7 full test validation"
    rollback: "git revert migration commits, restore from stash"
  
  - risk: "YAML loader failures from path changes"
    severity: "High"
    probability: "Low"
    mitigation: "Stage 7 governance/template loader tests"
    rollback: "Revert path changes in Python files"
  
  - risk: "Lost git history during file moves"
    severity: "Medium"
    probability: "Very Low"
    mitigation: "Use git mv exclusively (not rm + add)"
    validation: "git log --follow for each moved file"
  
  - risk: "CI/CD pipeline failures"
    severity: "Medium"
    probability: "Low"
    mitigation: "Stage 8 workflow file updates"
