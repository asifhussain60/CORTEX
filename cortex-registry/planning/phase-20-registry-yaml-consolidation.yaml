metadata:
  phase_id: "phase-104"
  title: "Registry YAML Consolidation & Cognitive Restructuring"
  version: "1.0"
  created_at: "2026-02-17T14:00:00Z"
  author: "Asif Hussain"
  priority: "P0"
  status: "PLANNED"
  execution_mode: "autonomous"
  
overview:
  vision: |
    Centralize all governance, cognition, and template YAML files into cortex-registry
    with production-ready cognitive naming conventions. Eliminate duplicates and establish
    single source of truth (SSOT) for all CORTEX configuration and policy files.
  
  problem_statement: |
    YAML files are scattered across multiple directories:
    - Governance rules in cortex_intelligence/memory/core/governance/
    - Cognition layer in cortex/brain/tier0/
    - Response patterns in cortex/brain/tier2/
    - Specifications in cortex/execution/specs/, cortex/wiring/specs/, cortex/orchestrators/
    - Config in cortex/config/
    - Planning templates in cortex/templates/planning/
    
    This fragmentation causes:
    - Difficult discovery and maintenance
    - Risk of path conflicts
    - Unclear ownership
    - 8 duplicate/redundant files
    
  expected_outcomes:
    - Single registry location: cortex-registry/
    - Production-ready cognitive naming (skull-rules, perception-protocol, etc.)
    - 3 new folders: core/cognition/, memory/response-patterns/, planning/roadmap-templates/
    - 33 files migrated with git history preserved
    - 8 redundant files removed
    - All Python/YAML references updated
    - Zero test regressions

roi_analysis:
  cost:
    development_hours: 3
    risk_level: "Low"
    reversibility: "High (git history preserved)"
  
  impact:
    maintainability: "+40% (single location)"
    discoverability: "+60% (cognitive naming)"
    onboarding: "+35% (clear structure)"
    technical_debt_reduction: "High (eliminates 8 duplicates)"
  
  risk_mitigation:
    - "Use git mv to preserve history"
    - "Comprehensive path scanning and updates"
    - "Test validation before commit"
    - "Staged execution with rollback points"

# ==============================================================================
# STAGE BREAKDOWN
# ==============================================================================

stages:
  - stage_id: "S1"
    name: "Pre-Flight Validation"
    description: "Verify source files, detect references, create migration script"
    duration_estimate: "15 min"
    dependencies: []
    
    tasks:
      - task_id: "S1T1"
        name: "Verify Source Files"
        description: "Confirm all 33 source files exist and are readable"
        commands:
          - "find cortex_intelligence/memory/core/governance -name '*.yaml'"
          - "find cortex/brain/tier0 -name '*.yaml'"
          - "find cortex/brain/tier2 -name '*.yaml' | grep -E '(base|domains|response-templates-index)'"
          - "find cortex/execution/specs -name '*.yaml'"
          - "find cortex/wiring/specs -name '*.yaml'"
          - "find cortex/orchestrators -name '*wiring*.yaml'"
          - "find cortex/config -name '*.yaml'"
          - "find cortex/templates/planning -name '*.yaml'"
        
      - task_id: "S1T2"
        name: "Detect Active References"
        description: "Scan codebase for references to files-to-delete"
        commands:
          - "grep -r 'CORE-095-folder-structure.yaml' --include='*.py' --include='*.yaml' ."
          - "grep -r 'CORE-096-build-artifacts.yaml' --include='*.py' --include='*.yaml' ."
          - "grep -r 'CORE-097-duplicate-detection.yaml' --include='*.py' --include='*.yaml' ."
          - "grep -r 'core-040-execution-spec-mandate.yaml' --include='*.py' --include='*.yaml' ."
          - "grep -r 'cortex_50_wave.yaml' --include='*.py' --include='*.yaml' ."
        expected: "No active references (confirm safe to delete)"
      
      - task_id: "S1T3"
        name: "Create Migration Script"
        description: "Generate bash script with all git mv commands"
        deliverable: "/tmp/phase-104-migration.sh"
      
      - task_id: "S1T4"
        name: "Backup Registry"
        description: "Create snapshot of current cortex-registry structure"
        commands:
          - "git stash push -m 'phase-104-pre-migration-backup'"
    
    success_criteria:
      - "All 33 source files verified"
      - "No blocking references to files-to-delete"
      - "Migration script generated"
      - "Backup created"
  
  - stage_id: "S2"
    name: "Create New Folder Structure"
    description: "Create cognitive folder hierarchy in cortex-registry"
    duration_estimate: "10 min"
    dependencies: ["S1"]
    
    tasks:
      - task_id: "S2T1"
        name: "Create Cognition Layer"
        commands:
          - "mkdir -p cortex-registry/core/cognition"
        deliverable: "cortex-registry/core/cognition/"
      
      - task_id: "S2T2"
        name: "Create Memory Layer"
        commands:
          - "mkdir -p cortex-registry/memory/response-patterns"
        deliverable: "cortex-registry/memory/response-patterns/"
      
      - task_id: "S2T3"
        name: "Create Planning Layer"
        commands:
          - "mkdir -p cortex-registry/planning/roadmap-templates"
        deliverable: "cortex-registry/planning/roadmap-templates/"
      
      - task_id: "S2T4"
        name: "Verify Folder Permissions"
        commands:
          - "ls -la cortex-registry/core/cognition"
          - "ls -la cortex-registry/memory/response-patterns"
          - "ls -la cortex-registry/planning/roadmap-templates"
    
    success_criteria:
      - "3 new folders created"
      - "Folders writable"
      - "No permission errors"
  
  - stage_id: "S3"
    name: "File Migration (git mv)"
    description: "Move 33 YAML files preserving git history"
    duration_estimate: "30 min"
    dependencies: ["S2"]
    
    file_operations:
      governance:
        - from: "cortex_intelligence/memory/core/governance/core-rules.yaml"
          to: "cortex-registry/core/governance/skull-rules.yaml"
        - from: "cortex_intelligence/memory/core/governance/governance_kernel.yaml"
          to: "cortex-registry/core/governance/governance-kernel.yaml"
      
      cognition:
        - from: "cortex/brain/tier0/intent-to-ac-id-mapping.yaml"
          to: "cortex-registry/core/cognition/intent-classification-schema.yaml"
        - from: "cortex/brain/tier0/governance-loading-sequence.yaml"
          to: "cortex-registry/core/cognition/bootstrap-sequence.yaml"
        - from: "cortex/brain/tier0/lens-protocol-implementation.yaml"
          to: "cortex-registry/core/cognition/perception-protocol.yaml"
      
      specifications:
        - from: "cortex/execution/specs/exec-flow.yaml"
          to: "cortex-registry/core/specifications/execution-flow-specification.yaml"
        - from: "cortex/execution/specs/gov-gates-val-rules.yaml"
          to: "cortex-registry/core/specifications/governance-validation-gates.yaml"
        - from: "cortex/execution/specs/routing-rules-intent.yaml"
