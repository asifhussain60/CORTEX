- id: phase-16
  title: Sweep Completeness Contract — CORE-064 + SweepCatalogueOrchestrator + MasterOrchestrator Gates
  spec_file: cortex-registry/planning/phases/planned/cortex-refactor/phase-16-sweep-completeness-contract.yaml
  status: complete
  priority: P0
  risk: medium
  dependencies:
  - phase-13
  - phase-15
  source: Copilot Chat 2026-02-21 — Partial sweep prevention design session
  description: 'Enforce that every FIX, REFACTOR, and AUDIT-with-fix operation exhausts its complete issue catalogue before
    session close. CORTEX currently fixes the top-N visible items but silently drops the long tail across session boundaries.
    Solution: CORE-064 governance rule + SweepCatalogueOrchestrator (support tier, priority 155) + two surgical gate insertions
    in MasterOrchestrator + one new cortex_sweep_status MCP tool. All backed by 20 E2E golden tests with predefined AC audit
    trace markers (AC_START / AC_COMPLETE). Zero existing orchestrators modified beyond two additive gate call-sites.

    '
  root_cause: "Three structural gaps identified in the current pipeline:\nGAP-1: No durable issue catalogue — EnforcementOrchestrator\
    \ violations are\n       in-memory only. Session ends → catalogue lost. Next session starts cold.\nGAP-2: No sweep scope\
    \ declaration at intent entry — MasterOrchestrator routes\n       FIX/REFACTOR without first asking \"what is the COMPLETE\
    \ set in scope?\"\nGAP-3: HolisticRefactoringSweep is epilogue-only — covers files touched in\n       the current session;\
    \ cannot catch issues in files not yet reached.\n"
  design_decisions:
    why_new_orchestrator_not_existing: 'EnforcementOrchestrator validates NEW operations (pre-flight). It has no

      persistence layer and no concept of a multi-session backlog. Adding catalogue

      state to it would violate CORE-035 (single responsibility). SweepCatalogueOrchestrator

      is the canonical home for catalogue open/track/assert/resume/wont-fix.

      '
    why_sqlite_not_memory: 'Catalogues must survive IDE crashes, multi-day sessions, and developer handoffs.

      SQLite WAL at .cortex-runtime/sweeps/ is the established CORE-058 pattern.

      '
    why_two_gate_insertions_not_new_pipeline: 'Inserting pre-routing and post-execution hooks is additive (no existing code

      deleted or refactored). Keeps MasterOrchestrator routing stable. Zero regression

      risk on the 519 existing golden tests.

      '
    priority_155_rationale: 'Support tier range is 150–199. Priority 155 places SweepCatalogueOrchestrator

      after HealthOrchestrator (160) intentionally — it is consumed early in a session,

      not as a health check companion.

      '
  deliverables:
  - 'CORE-064: ''Sweep Completeness Contract'' rule in skull-rules.yaml — severity: blocked, enforcement: MasterOrchestrator
    pre+post gates'
  - cortex/orchestrators/support/sweep_catalogue_orchestrator.py — SweepCatalogueOrchestrator (priority 155, IOrchestrator,
    OrchestratorProtocolMixin)
  - cortex/mcp/tools/sweep_status_tool.py — cortex_sweep_status MCP tool (read catalogue, surface remaining items)
  - support-orchestrator-wiring.yaml — SweepCatalogueOrchestrator entry at priority 155
  - MasterOrchestrator._pre_routing_gate() — calls open_catalogue() for FIX/REFACTOR/AUDIT intents
  - MasterOrchestrator._finalize_operation() — calls assert_exhausted(); blocks if remaining > 0
  - tests/golden/test_sweep_completeness_contract_truth.py — 20 E2E golden tests with AC audit trace
  - skull-rules.yaml CORE-064 — full spec with enforcement points, forbidden/required patterns, test stubs
  architecture:
    pipeline_position: "User Request (FIX/REFACTOR/AUDIT)\n  → [Stage 0: Governance Audit]\n  → [MasterOrchestrator._pre_routing_gate()]\
      \  ← NEW: open_catalogue()\n  → [IntentRouter.route()]\n  → [TDDOrchestrator / RefactoringOrchestrator / AuditCoordinator]\n\
      \      → Each resolved item → SweepCatalogueOrchestrator.mark_resolved()\n  → [MasterOrchestrator._finalize_operation()]\
      \  ← NEW: assert_exhausted()\n      → remaining == 0 → PASS, close catalogue, allow commit\n      → remaining > 0 →\
      \ BLOCK, surface numbered list of open items\n  → [HolisticRefactoringSweep epilogue — unchanged]\n"
    sweep_catalogue_orchestrator_api: 'open_catalogue(intent: str, scope_files: List[Path]) → SweepManifest

      mark_resolved(sweep_id: str, item_id: str) → None

      assert_exhausted(sweep_id: str) → Ok[SweepManifest] | Err[List[SweepItem]]

      resume_open_catalogue(scope_key: str) → Optional[SweepManifest]

      approve_wont_fix(sweep_id: str, item_id: str, justification: str) → AuditEntry

      health_check() → Dict[str, Any]

      '
    storage: .cortex-runtime/sweeps/{sweep_id}.db  (SQLite WAL — CORE-058 pattern)
    wont_fix_guard: "approve_wont_fix() requires:\n  - Explicit justification string (non-empty)\n  - DoRApprovalGate.approve()\
      \ confirmation (existing gate — no new code)\n  - Audit entry written to EnhancedAuditLogger (AC_WONTFIX marker)\n"
    resume_guard: 'resume_open_catalogue() checks file-hash fingerprint of scope files.

      Catalogue is invalidated (not resumed) if >20% of scope files changed

      since catalogue was opened. User is prompted to open a fresh catalogue.

      '
  golden_tests_target: 20
  golden_tests_file: tests/golden/test_sweep_completeness_contract_truth.py
  golden_test_coverage_matrix: '# P0 — Core contract (blocking)

    test_open_catalogue_creates_sqlite_db_in_cortex_runtime

    test_open_catalogue_runs_full_enforcement_scan_on_scope

    test_mark_resolved_decrements_open_count

    test_assert_exhausted_returns_ok_when_all_resolved

    test_assert_exhausted_returns_err_with_remaining_list_when_open

    test_master_orchestrator_pre_routing_gate_opens_catalogue_for_fix_intent

    test_master_orchestrator_pre_routing_gate_opens_catalogue_for_refactor_intent

    test_master_orchestrator_finalize_blocks_when_remaining_greater_than_zero

    test_master_orchestrator_finalize_passes_when_remaining_zero

    test_core_064_registered_in_skull_rules_yaml

    # P1 — Session persistence & resume

    test_catalogue_persists_across_session_boundary_via_sqlite

    test_resume_open_catalogue_returns_existing_manifest_for_same_scope

    test_resume_open_catalogue_invalidates_on_scope_file_hash_drift

    test_wont_fix_requires_justification_and_writes_audit_entry

    test_wont_fix_without_justification_raises_value_error

    # P2 — MCP tool surface

    test_cortex_sweep_status_tool_returns_open_items_count

    test_cortex_sweep_status_tool_raises_when_no_open_catalogue

    test_sweep_catalogue_orchestrator_health_check_returns_healthy

    test_sweep_catalogue_orchestrator_wired_in_support_wiring_yaml_at_priority_155

    test_end_to_end_fix_session_exhausts_catalogue_and_closes_cleanly

    '
  new_files:
  - cortex/orchestrators/support/sweep_catalogue_orchestrator.py
  - cortex/mcp/tools/sweep_status_tool.py
  - tests/golden/test_sweep_completeness_contract_truth.py
  modified_files:
  - cortex-registry/core/tier0-skull/skull-rules.yaml  (add CORE-064)
  - cortex-registry/core/specifications/support-orchestrator-wiring.yaml  (add SweepCatalogueOrchestrator at priority 155)
  - cortex/orchestrators/core/master_orchestrator.py  (add _pre_routing_gate() + _finalize_operation() hooks)
  acceptance_criteria:
  - 'AC-P16-001: CORE-064 registered in skull-rules.yaml with severity: blocked'
  - 'AC-P16-002: SweepCatalogueOrchestrator importable from cortex.orchestrators.support.sweep_catalogue_orchestrator'
  - 'AC-P16-003: open_catalogue() creates {sweep_id}.db in .cortex-runtime/sweeps/ (SQLite WAL)'
  - 'AC-P16-004: open_catalogue() runs EnforcementOrchestrator across ALL scope files (not just top-N)'
  - 'AC-P16-005: mark_resolved() decrements open_count; assert_exhausted() returns Err when open_count > 0'
  - 'AC-P16-006: assert_exhausted() returns Ok(SweepManifest) when open_count == 0'
  - 'AC-P16-007: MasterOrchestrator calls open_catalogue() for FIX, REFACTOR, AUDIT intents (pre-routing gate)'
  - 'AC-P16-008: MasterOrchestrator calls assert_exhausted() in _finalize_operation() (post-execution gate)'
  - 'AC-P16-009: Finalize gate BLOCKS with numbered remaining-items list when open_count > 0'
  - 'AC-P16-010: resume_open_catalogue() returns existing SweepManifest for same scope key'
  - 'AC-P16-011: resume_open_catalogue() invalidates catalogue when scope file-hash drift > 20%'
  - 'AC-P16-012: approve_wont_fix() writes AC_WONTFIX marker to EnhancedAuditLogger'
  - 'AC-P16-013: approve_wont_fix() raises ValueError when justification is empty string'
