- id: phase-18
  title: LENS Intelligence Wiring — Company Domains, Domain Profiles, ADO Guard, KG Indexing
  spec_file: cortex-registry/planning/phases/planned/cortex-refactor/phase-18-lens-intelligence-wiring.yaml
  status: complete
  priority: P0
  risk: medium
  dependencies:
  - phase-17
  source: Copilot Chat 2026-02-21 — LENS intelligence gap analysis (company domains not synthesized)
  description: |
    UnifiedIntelligenceProvider currently passes CompanyKnowledge(domain_rules={}) — an empty dict —
    in all three tiers. KnowledgeSynthesisEngine has the synthesis pipeline but nothing feeds it.
    This phase wires four missing sources into the established 3-tier model:

      QUICK  + company/domains/*.yaml (3 files, cached, <50ms)
             + knowledge-base/profiles/{detected_domain}.yaml (6 domain profiles)

      TARGETED + above +
               + knowledge-base/repositories/{repo_name}.yaml (per-repo profile)
               + core/cognition/perception-protocol.yaml (intent → scope enrichment)

      FULL   + above +
             + ADOWorkItemProvider.fetch_user_stories() guarded by ADO_ORG_URL env var
             + KnowledgeQuerier.index_entity() from knowledge-base/repositories/
             + patterns/*.yaml (9 canonical patterns for anti-pattern detection)

    Zero new orchestrators. Zero wiring.yaml changes. All new sources gracefully degrade
    when unavailable. ADO call silently skipped when ADO_ORG_URL is absent.

  root_cause: |
    Three structural gaps in cortex/intelligence/provider.py (confirmed via code review 2026-02-21):
    GAP-A: _load_company_knowledge() does not exist — company/domains/*.yaml never read.
    GAP-B: targeted() and full() pass CompanyKnowledge({}, [], "OVERRIDE") hardcoded.
    GAP-C: _synthesize_cross_domain() returns empty dict with architecture/security/testing keys
           always — the SynthesisEngine placeholder was never implemented.
    GAP-D: KnowledgeQuerier is instantiated but empty — no entities indexed from registry YAMLs.
    GAP-E: ADOWorkItemProvider exists with correct Protocol but is never called from the
           intelligence pipeline. Sprint context is invisible to MasterOrchestrator.

  scope:
    files_modified:
    - path: cortex/intelligence/knowledge/knowledge_synthesis_engine.py
      description: >
        Add _load_company_domains() reading company/domains/*.yaml.
        Add _load_domain_profile() selecting from knowledge-base/profiles/.
        Add _load_patterns() reading cortex-registry/patterns/*.yaml.
        Replace cross-domain synthesis stub with real SynthesisEngine call.
    - path: cortex/intelligence/provider.py
      description: >
        Fix targeted() and full() to call _load_company_knowledge() from
        KnowledgeSynthesisEngine instead of hardcoding CompanyKnowledge({}).
        Wire KnowledgeQuerier indexing in full() tier.
        Add conditional ADOWorkItemProvider call in full() behind ADO_ORG_URL guard.
    files_new:
    - path: cortex/intelligence/knowledge/company_domain_loader.py
      description: >
        Standalone loader — reads company/domains/*.yaml, caches 5 min TTL,
        returns CompanyKnowledge with domain_rules + compliance_standards populated.
    - path: tests/unit/intelligence/test_company_domain_loader.py
      description: TDD-first unit tests for CompanyDomainLoader (RED before implementation).
    - path: tests/golden/test_lens_intelligence_wiring_truth.py
      description: >
        15 golden E2E tests verifying that synthesis context is non-empty
        when company/domains YAMLs and domain profiles are present.

  design_decisions:
    company_domain_loader_separation: |
      Separating into company_domain_loader.py follows CORE-035 (single canonical implementation).
      KnowledgeSynthesisEngine delegates to it rather than reading YAMLs inline.
      Loader is reusable by future tools (e.g., cortex_query_governance MCP tool).
    ado_guard_pattern: |
      if os.getenv("ADO_ORG_URL"):
          provider = get_work_item_provider()   # existing Phase-15 factory
          stories = provider.fetch_user_stories(project=repo_name or "default")
          # Enrich company_knowledge.domain_rules with sprint/story context
      else:
          logger.debug("ADO_ORG_URL not set — skipping work-item enrichment")
      This is identical to the circuit-breaker guard in git_circuit_breaker.py.
    kg_indexing_trigger: |
      full() calls KnowledgeQuerier.index_entity() for each entity in
      knowledge-base/repositories/{repo_name}.yaml before running synthesis.
      Idempotent: index_entity() is a dict write — re-indexing safe.
    cross_domain_synthesis_fix: |
      Replace the stub return {'architecture': [], ...} with:
          synthesis_engine = self._ensure_synthesis_engine()
          return synthesis_engine.synthesize_cross_domain_context(intent, context)
      KnowledgeSynthesisEngine already has synthesize_unified_context() — extend it
      with a synthesize_cross_domain_context() variant that queries patterns/*.yaml.

  acceptance_criteria:
  - 'AC-P18-001: CompanyDomainLoader importable from cortex.intelligence.knowledge.company_domain_loader'
  - 'AC-P18-002: CompanyDomainLoader reads all *.yaml files from cortex-registry/company/domains/'
  - 'AC-P18-003: CompanyDomainLoader populates CompanyKnowledge.domain_rules (non-empty dict)'
  - 'AC-P18-004: CompanyDomainLoader populates CompanyKnowledge.compliance_standards (non-empty list)'
  - 'AC-P18-005: targeted() receives non-empty CompanyKnowledge when company/domains/ YAMLs exist'
  - 'AC-P18-006: full() receives non-empty CompanyKnowledge when company/domains/ YAMLs exist'
  - 'AC-P18-007: quick() still returns in <200ms after change (latency SLA maintained)'
  - 'AC-P18-008: full() calls fetch_user_stories() when ADO_ORG_URL env var is set'
  - 'AC-P18-009: full() skips ADO call silently when ADO_ORG_URL is not set'
  - 'AC-P18-010: _synthesize_cross_domain() returns non-empty architecture/security/testing lists'
  - 'AC-P18-011: KnowledgeQuerier is indexed from knowledge-base/repositories/ in full() tier'
  - 'AC-P18-012: domain profiles (auth/finops/devops/ml/healthcare/legal) loaded by tag matching'
  - 'AC-P18-013: 15 golden intelligence wiring tests passing'
  - 'AC-P18-014: 562 existing golden tests remain passing (zero regression)'
  - 'AC-P18-015: All new public APIs have type hints (CORE-011) and docstrings (CORE-012)'
  - 'AC-P18-016: CompanyDomainLoader uses 5-min TTL cache (CORE-035 canonical cache pattern)'
  - 'AC-P18-017: No new orchestrators added (zero wiring.yaml changes)'

  tdd_mandate: CORE-008 — RED phase (25 tests) before any implementation
  regression_gate: 562 golden tests must remain passing after each sub-step

  sub_phases:
    a_company_domain_loader:
      priority: P0
      effort: S
      description: |
        Implement CompanyDomainLoader with TTL cache. Reads company/domains/*.yaml
        (currently: security-standards.yaml, payment-security.yaml, api-design-standards.yaml,
        external-standards.yaml, freshness-test.yaml, export-test.yaml).
        Returns CompanyKnowledge(domain_rules, compliance_standards, precedence="OVERRIDE").
      files:
      - cortex/intelligence/knowledge/company_domain_loader.py (new)
      - tests/unit/intelligence/test_company_domain_loader.py (new, TDD-first)
      tdd_tests: 10

    b_provider_wiring:
      priority: P0
      effort: S
      description: |
        Fix targeted() and full() in UnifiedIntelligenceProvider to call
        CompanyDomainLoader instead of hardcoding CompanyKnowledge({}).
        Add _detect_domain_profile() that matches repo tags against
        knowledge-base/profiles/ filenames (auth, finops, devops, ml, healthcare, legal).
      files:
      - cortex/intelligence/provider.py (modify targeted() + full())
      tdd_tests: 6

    c_cross_domain_synthesis:
      priority: P1
      effort: M
      description: |
        Replace the cross-domain synthesis stub. Add synthesize_cross_domain_context()
        to KnowledgeSynthesisEngine that queries patterns/*.yaml for architecture patterns,
        security/secure-coding-practices.yaml for security rules, and
        testing-validation/tdd-best-practices.yaml for testing standards.
        Returns populated architecture/security/testing lists.
      files:
      - cortex/intelligence/knowledge/knowledge_synthesis_engine.py (extend)
      tdd_tests: 5

    d_ado_conditional_wire:
      priority: P1
      effort: S
      description: |
        Wire ADOWorkItemProvider.fetch_user_stories() into UnifiedIntelligenceProvider.full()
        behind os.getenv("ADO_ORG_URL") guard. Map returned WorkItem list into
        company_knowledge.domain_rules["sprint_context"] as sprint title + story summaries.
        Graceful fallback: timeout=5s, exception caught + logged, synthesis continues.
      files:
      - cortex/intelligence/provider.py (extend full())
      tdd_tests: 4 (with/without ADO_ORG_URL env, timeout, empty stories)

  progress:
    started: '2026-02-21'
    completed: '2026-02-21'
    current_stage: complete
    stages_complete:
    - a_company_domain_loader
    - b_provider_wiring
    - c_cross_domain_synthesis
    - d_ado_conditional_wire
    tests_written: 40
    tests_passing: 40
    coverage_pct: 100
    commits:
    - 'feat(phase-18): CompanyDomainLoader with TTL cache (AC-P18-001..004, AC-P18-016)'
    - 'feat(phase-18): wire targeted()/full() to CompanyDomainLoader (AC-P18-005, AC-P18-006)'
    - 'feat(phase-18): ADO_ORG_URL guard in full() with graceful fallback (AC-P18-008, AC-P18-009)'
    - 'feat(phase-18): synthesize_cross_domain_context() — patterns + security + testing (AC-P18-010)'
    - 'test(phase-18): 17 golden E2E truth tests + 23 unit tests all GREEN'
    issues_found: 1
    issues_resolved: 1
    validation_loop_iterations: 2
    lens_scan_completed: true

