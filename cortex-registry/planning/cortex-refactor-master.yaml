- id: phase-20
  title: ADO + Brain-Tier Synthesis — Full-Tier Sprint Context, Real KG Query, Cross-Domain Completion
  spec_file: cortex-registry/planning/phases/planned/cortex-refactor/phase-20-ado-brain-tier-synthesis.yaml
  status: complete
  priority: P1
  risk: medium
  dependencies:
  - phase-18
  - phase-19
  source: Copilot Chat 2026-02-21 — ADO synthesis and brain-tier KG design session
  description: |
    Phase 18 lays the wiring. Phase 20 makes it production-quality:

    ADO SYNTHESIS: When ADO_ORG_URL is configured, WorkItem sprint context is mapped into
    structured MasterOrchestrator instructions — not just raw story titles. Sprint name,
    story IDs, acceptance criteria fields (if populated in ADO), and area paths are parsed
    and injected as execution_context into the UnifiedIntelligenceContext.

    BRAIN-TIER KG: KnowledgeQuerier (cortex/intelligence/domain_brain/domain_brain/kg_querier.py)
    is an in-memory store that is never populated. This phase indexes entities from:
      - knowledge-base/repositories/*.yaml  (repo entities)
      - knowledge-base/profiles/*.yaml      (domain profile entities)
      - company/domains/*.yaml              (company rule entities)
    KGInference then provides relationship traversal (e.g., "auth domain" → AUTH-001..AUTH-010 rules).

    CROSS-DOMAIN SYNTHESIS: Replace the final stub — _synthesize_cross_domain() in
    UnifiedIntelligenceProvider. After Phase 18 adds the SynthesisEngine call, this phase
    verifies end-to-end that full() tier returns populated architecture/security/testing
    lists and writes a golden test asserting non-empty cross-domain output.

  scope:
    ado_structured_mapping:
      description: |
        ADOWorkItemProvider.fetch_user_stories() returns List[WorkItem]. Each WorkItem
        has raw field containing full ADO API response. This phase adds
        cortex/intelligence/knowledge/ado_context_mapper.py which extracts:
          sprint_name: str (from raw["fields"]["System.IterationPath"])
          stories: List[{id, title, state, area_path}]
          open_count: int
          in_progress_count: int
        Returns structured sprint_context dict injected into company_knowledge.domain_rules.
      files_new:
      - cortex/intelligence/knowledge/ado_context_mapper.py
      - tests/unit/intelligence/test_ado_context_mapper.py

    kg_entity_indexing:
      description: |
        Add KGIndexer.index_registry_yaml(yaml_path: Path, entity_type: str) to
        cortex/intelligence/domain_brain/domain_brain/kg_indexer.py.
        Called from UnifiedIntelligenceProvider.full() for each file in
        knowledge-base/repositories/ and knowledge-base/profiles/.
        KGInference.infer_related_rules(entity_id) then returns applicable rule IDs
        for synthesis (e.g., "finops-v1.0" → [FIN-001..FIN-010]).
      files_modified:
      - cortex/intelligence/domain_brain/domain_brain/kg_indexer.py (add index_registry_yaml())
      - cortex/intelligence/provider.py (call kg_indexer in full() tier)

