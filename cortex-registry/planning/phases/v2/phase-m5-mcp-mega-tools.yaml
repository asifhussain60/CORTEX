        blocker: "Implementation forbidden"
      green:
        action: "Implement both mega-tools. Register in mcp_registry.py."
        gate: "tests/v2/test_mega_tools_code_govern.py — ALL tests PASS"
        blocker: "REFACTOR forbidden"
