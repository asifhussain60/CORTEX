        - "Implement cortex_govern in cortex/mcp/tools/cortex_govern.py"
        - "Register both in mcp_registry.py"
      refactor:
        - "CORE-011, CORE-012, MCP schema validation"

    acceptance_criteria:
      - "cortex_code handles IMPLEMENT/FIX/REFACTOR/REVIEW/TEST/DEBUG via op parameter"
      - "cortex_govern handles AUDIT/HEALTH/ENFORCE/VACUUM via op parameter"
