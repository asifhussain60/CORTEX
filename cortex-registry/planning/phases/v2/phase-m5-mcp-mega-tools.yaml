        - "test_cortex_code_fix — op=fix routes correctly"
        - "test_cortex_code_refactor — op=refactor routes correctly"
        - "test_cortex_code_review — op=review routes correctly"
        - "test_cortex_govern_audit — op=audit routes to AuditCoordinator"
