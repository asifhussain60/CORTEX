id: "phase-m5"
title: "MCP Mega-Tools — 36 Micro-Tools → 6 Unified Tools"
created: "2026-03-15"
status: COMPLETE
priority: P0
governance_authority:
  - CORE-008
  - CORE-035
  - CORE-064
  - CORE-068
sweep_catalogue_id: "SWEEP-M5-MCP-MEGA-TOOLS"

background: |
  Source: CORTEX V2 Architecture Review (2026-03-15)
  CORTEX currently registers 36 MCP tools (55 tool files) with fine-grained
  operations. Modern LLM tool-use works best with fewer, broader tools that
  accept operation discriminators (op parameter). MCP protocol timeout and
  routing overhead is proportional to tool count.
  
  Strategy: consolidate 36 tools into 6 mega-tools, each with an op parameter:
    1. cortex_code   — IMPLEMENT/FIX/REFACTOR/REVIEW (replaces cortex_implement, cortex_fix, cortex_refactor, cortex_review, cortex_test, cortex_debug)
    2. cortex_govern — AUDIT/HEALTH/ENFORCE/VACUUM (replaces cortex_audit, cortex_health, cortex_vacuum, cortex_enforce, cortex_verify)
    3. cortex_analyze — LENS/INVESTIGATE/ARCHITECTURE (replaces legacy lens tool alias, cortex_investigate, cortex_architecture, cortex_complexity)
    4. cortex_plan   — PLAN/PHASE/TRACK/DECOMPOSE (replaces cortex_plan, cortex_phase, cortex_track, cortex_totalrecall, cortex_decompose)
    5. cortex_learn  — RCA/FEEDBACK/DIGEST/DISTILL (replaces cortex_learning, cortex_feedback, cortex_digest, cortex_distill, cortex_onboard)
    6. cortex_ops    — SYNC/UPGRADE/SETUP/STATUS (replaces cortex_sync, cortex_upgrade, cortex_setup, cortex_status)
  
  Backward compatibility: old tool names become aliases in mcp_registry.py.
  
  Baseline measurements:
    - Post-M4 smoke tests: >= 2660
    - MCP tools registered: 36
    - MCP tool files: 55
    - Target: 6 registered tools, ~18 tool files
  Git prerequisite: phase-m4 COMPLETE on CORTEX-V2 branch

sweep_catalogue:
  - id: "GAP-M5-01"
    title: "Create cortex_code mega-tool"
    severity: P0
    source: "Architecture Review — tool consolidation"
    evidence: |
      IMPLEMENT/FIX/REFACTOR/REVIEW/TEST/DEBUG operations share common
      context (files, test runner, convergence gate). Single tool with
      op parameter reduces MCP overhead and simplifies LLM tool selection.
    action_ref: "phase-m5-a"
    status: CLOSED

  - id: "GAP-M5-02"
    title: "Create cortex_govern mega-tool"
    severity: P0
    source: "Architecture Review — governance tool consolidation"
    evidence: |
      AUDIT/HEALTH/ENFORCE/VACUUM all operate on governance rules and
      workspace state. Single governance tool with op parameter.
    action_ref: "phase-m5-a"
    status: CLOSED

  - id: "GAP-M5-03"
    title: "Create cortex_analyze mega-tool"
    severity: P1
    source: "Architecture Review — analysis tool consolidation"
    evidence: |
      LENS/INVESTIGATE/ARCHITECTURE/COMPLEXITY all provide analysis output.
      Single analysis tool with op parameter.
    action_ref: "phase-m5-b"
    status: CLOSED

  - id: "GAP-M5-04"
    title: "Create cortex_plan mega-tool"
    severity: P1
    source: "Architecture Review — planning tool consolidation"
    evidence: |
      PLAN/PHASE/TRACK/DECOMPOSE/TOTALRECALL all operate on cortex-master.yaml
      and phase files. Single planning tool with op parameter.
    action_ref: "phase-m5-b"
    status: CLOSED

  - id: "GAP-M5-05"
    title: "Create cortex_learn mega-tool"
    severity: P1
    source: "Architecture Review — learning tool consolidation"
    evidence: |
      RCA/FEEDBACK/DIGEST/DISTILL/ONBOARD all involve knowledge acquisition
      and learning signals. Single learning tool with op parameter.
    action_ref: "phase-m5-c"
    status: CLOSED

  - id: "GAP-M5-06"
    title: "Create cortex_ops mega-tool"
    severity: P1
    source: "Architecture Review — operations tool consolidation"
    evidence: |
      SYNC/UPGRADE/SETUP/STATUS are operational commands. Single ops tool
      with op parameter.
    action_ref: "phase-m5-c"
    status: CLOSED

  - id: "GAP-M5-07"
    title: "Backward-compat aliases in mcp_registry.py"
    severity: P0
    source: "Migration safety"
    evidence: |
      Old tool names (cortex_implement, cortex_audit, etc.) must continue
      working as aliases routing to the corresponding mega-tool + op.
      This allows gradual migration of prompts and agents.
    action_ref: "phase-m5-d"
    status: CLOSED

  - id: "GAP-M5-08"
    title: "Delete old tool files after alias verification"
    severity: P1
    source: "CORE-035, CORE-064"
    evidence: |
      Once mega-tools are verified and aliases work, delete the ~37 old
      individual tool files. Keep only mega-tool implementations.
    action_ref: "phase-m5-d"
    status: CLOSED

  - id: "GAP-M5-09"
    title: "Preserve MCP-first exposure contract parity before destructive cleanup"
    severity: P0
    source: "origin/CORTEX parity audit — 36-tool contract must be behaviorally preserved"
    evidence: |
      Before deleting old tool files, prove operation parity between origin/CORTEX
      tool contract and mega-tool op routing. Any missing op/intent path is a
      regression even if aliases resolve names.
    action_ref: "phase-m5-d"
    status: CLOSED

  - id: "GAP-M5-10"
    title: "Define and enforce mega-tool trust boundaries"
    severity: P0
    source: "MCP governance hardening"
    evidence: |
      Each mega-tool needs explicit operation allowlists, privileged operation
      boundaries, and deny-by-default behavior. Without this, broad tools can
      blur security and ownership boundaries.
    action_ref: "phase-m5-d"
    status: CLOSED

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

autonomous_execution:
  mode: "SILENT_AUTONOMOUS"
  progress_format: "phase-list+bar"
  convergence_loop_required: true
  max_convergence_cycles: 3
  completion_requires:
    - "all_gap_refs_closed"
    - "completion_gate_passed"
    - "master_index_updated"

phase_continuation:
  next_phase_id: "phase-m6"
  final_response_contract:
    completion_line: "✅ Phase phase-m5 complete."
    next_block: "### 🚀 Next Phase"
    continuation_prompt: "execute phase-m6 on CORTEX-V2 with strict sequential contract and autonomous progress"

phases:
