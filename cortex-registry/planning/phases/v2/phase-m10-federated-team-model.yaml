background: |
  Source: V2 redesign reevaluation (2026-03-15)
  After core technical consolidation (M1-M9), organizational-scale operation
  requires explicit team ownership and collaboration contracts. This phase
  installs the federated model:
  - Platform Kernel Team owns shared orchestration, governance, MCP gateway.
  - Domain Teams own domain capability packs (orchestrators/agents/skills/workflows).
  - Shared Services Team owns reusable templates, evaluation baselines, observability.
  
  Objective: ensure multi-team velocity without tight coupling and without
  duplicate ownership of capabilities.

