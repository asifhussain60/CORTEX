# Phase M13 — Final Refactor & Repo Cleanup
# Authority: CORTEX Architect | 2026-03-16

phase:
  id: phase-m13
  title: "Final Refactor & Repo Cleanup"
  priority: P0
  status: PLANNED
  depends_on: ["phase-m12"]
  sweep_id: SWEEP-M13-REPO-CLEANUP
  gaps: 6
  sub_phases: 3
  description: |
    Sweep all subfolders for non-production files, remove all dev/test/legacy/obsolete artifacts, enforce production-only hygiene, validate with smoke and audit gates, and emit final repo state for release.
  objectives:
    - Catalog all CORTEX v1 orchestration/governance features and classify for migration, retention, or sunsetting.
    - Migrate all business/technical logic to Claude Code agents/skills/subagents.
    - Refactor workflow templates to delegate to Claude agents/skills.
    - Retain Workflow Composer/templates as orchestration/governance layer.
    - Sunset/remove redundant legacy orchestrators/modules after migration.
    - Sweep every subfolder for non-production files and artifacts.
    - Validate repo hygiene with smoke and audit gates.
    - Document final repo state and release readiness.
  deliverables:
    - Migration/retention/sunset matrix (documented in plan)
    - Updated workflow templates and agent/skill registry
    - Cleaned repo with only production files
    - Audit and smoke test results
    - Final release report
  acceptance_criteria:
    - All legacy logic migrated or sunset
    - No non-production files remain in any subfolder
    - All tests and audits pass
    - Documentation and registry are up to date
    - Repo is production-ready and release-certified
