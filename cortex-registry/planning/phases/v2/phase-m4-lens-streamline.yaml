phases:
  - id: "phase-m4-a"
    title: "Retire Python adapters, preserve polyglot"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-M4-01", "GAP-M4-02"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "3 hours"
    depends_on: []
    prerequisite: "phase-m3 COMPLETE, smoke tests green"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write tests: Python adapters deleted, polyglot adapters preserved and functional"
        gate: "tests/v2/test_lens_streamline.py — ALL tests FAIL"
        blocker: "Deletions forbidden"
      green:
        action: "Delete Python-specific adapters. Verify .NET/C#/TS/Java adapters intact."
        gate: "tests/v2/test_lens_streamline.py — ALL tests PASS"
        blocker: "REFACTOR forbidden"
      refactor:
        action: "Update imports, remove corresponding tests"
        gate: "python3 scripts/run_tests.py smoke — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden"

    tdd_sequence:
      red:
        - "test_python_lens_adapters_deleted — Python-specific adapters raise ImportError"
        - "test_dotnet_adapter_preserved — .NET/C# adapter importable and functional"
        - "test_typescript_adapter_preserved — TS adapter importable and functional"
        - "test_java_adapter_preserved — Java/Maven adapter importable (if exists)"
      green:
        - "Delete Python-specific LENS adapters"
        - "Verify polyglot adapters untouched"
      refactor:
        - "Remove dead test files"
        - "Update LENS registry to only register surviving adapters"

    acceptance_criteria:
      - "Python-specific LENS adapters deleted"
      - "Polyglot adapters (.NET, C#, TS, Java) preserved and functional"
      - "~40 files removed from LENS layer"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2670
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-m4-b"
    title: "Consolidate LENS adapter interface + update entry points"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-M4-03", "GAP-M4-04"]
    governance_authority: "CORE-008, CORE-035"
    duration_estimate: "2 hours"
    depends_on: ["phase-m4-a"]
    prerequisite: "phase-m4-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write tests for unified ILensAdapter protocol"
        gate: "tests/v2/test_lens_unified_interface.py — ALL tests FAIL"
        blocker: "Implementation forbidden"
      green:
        action: "Create ILensAdapter protocol. Migrate surviving adapters. Update LENS facade."
        gate: "tests/v2/test_lens_unified_interface.py — ALL tests PASS"
        blocker: "REFACTOR forbidden"
      refactor:
        action: "Type hints, docstrings, confirm single protocol (CORE-035)"
        gate: "python3 scripts/run_tests.py smoke — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden"

    tdd_sequence:
      red:
        - "test_ilens_adapter_protocol — protocol defines analyze, get_context, supports"
        - "test_all_adapters_implement_protocol — every surviving adapter satisfies ILensAdapter"
        - "test_lens_facade_delegates_correctly — facade routes to correct adapter by language"
      green:
        - "Define ILensAdapter protocol"
        - "Migrate surviving adapters to implement protocol"
        - "Update LENS facade to use unified protocol"
      refactor:
        - "CORE-011 type hints, CORE-012 docstrings, CORE-035 single protocol"

    acceptance_criteria:
      - "ILensAdapter protocol defined with analyze(), get_context(), supports()"
      - "All surviving adapters implement ILensAdapter"
      - "LENS facade updated"
      - "LENS layer at ~25 files (from 82)"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2660
