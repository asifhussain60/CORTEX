id: "phase-m4"
title: "LENS Streamline — Keep Polyglot, Retire Python-Specific"
created: "2026-03-15"
status: COMPLETE
priority: P1
governance_authority:
  - CORE-008
  - CORE-035
  - CORE-064
  - CORE-068
sweep_catalogue_id: "SWEEP-M4-LENS-STREAMLINE"

background: |
  Source: CORTEX V2 Architecture Review (2026-03-15)
  The LENS layer (Language → Examination → Navigation → Synthesis) contains
  82 files providing workspace-aware code intelligence. Modern LLMs handle
  Python/JavaScript/TypeScript analysis natively, but enterprise stacks
  (.NET/C#, MSBuild, Java/Maven) still benefit from specialized adapters.
  
  Strategy: keep polyglot LENS adapters for enterprise stacks, retire
  Python-specific analysis, and consolidate the adapter interface.
  
  Baseline measurements:
    - Post-M3 smoke tests: >= 2690
    - LENS files: 82
    - Target: ~25 files
  Git prerequisite: phase-m3 COMPLETE on CORTEX-V2 branch

sweep_catalogue:
  - id: "GAP-M4-01"
    title: "Retire Python-specific LENS adapters"
    severity: P1
    source: "LLM Capability Manifest — code_analysis: LLM handles Python natively"
    evidence: |
      Python-specific adapters (AST analysis, import graph, coverage mapping)
      duplicate what Claude/GPT do natively when given Python files.
    action_ref: "phase-m4-a"
    status: CLOSED

  - id: "GAP-M4-02"
    title: "Preserve and consolidate polyglot adapters (.NET, C#, TS, Java)"
    severity: P0
    source: "LLM Capability Manifest — code_analysis: CORTEX handles enterprise stacks"
    evidence: |
      .NET/C# adapters (MSBuild parsing, centralized package management,
      assembly resolution), TypeScript advanced adapters, Java/Maven adapters
      provide value LLMs don't replicate well for enterprise patterns.
    action_ref: "phase-m4-a"
    status: CLOSED

  - id: "GAP-M4-03"
    title: "Consolidate LENS adapter interface"
    severity: P1
    source: "CORE-035 — single canonical interface"
    evidence: |
      Multiple adapter base classes and protocols exist. Consolidate to
      a single ILensAdapter protocol with standard analyze(), get_context(),
      supports() methods.
    action_ref: "phase-m4-b"
    status: CLOSED

  - id: "GAP-M4-04"
    title: "Update LENS entry points"
    severity: P1
    source: "Migration completeness"
    evidence: |
      cortex/lens/ entry points (facade, registry) must be updated to
      only load surviving adapters and delegate Python analysis to LLM.
    action_ref: "phase-m4-b"
    status: CLOSED

  - id: "GAP-M4-05"
    title: "Sweep close and regression gate"
    severity: P0
    source: "CORE-064, CORE-068"
    evidence: |
      Full sweep completeness verification and convergence gate pass.
    action_ref: "phase-m4-final"
    status: CLOSED

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

autonomous_execution:
  mode: "SILENT_AUTONOMOUS"
  progress_format: "phase-list+bar"
  convergence_loop_required: true
  max_convergence_cycles: 3
  completion_requires:
    - "all_gap_refs_closed"
    - "completion_gate_passed"
    - "master_index_updated"

