id: "phase-m8"
title: "Test Suite Mirror — Delete, Consolidate, Update"
created: "2026-03-15"
status: COMPLETE
priority: P1
governance_authority:
  - CORE-008
  - CORE-035
  - CORE-064
  - CORE-068
sweep_catalogue_id: "SWEEP-M8-TEST-MIRROR"

background: |
  Source: CORTEX V2 Architecture Review (2026-03-15)
  The test suite contains ~1,366 test files mirroring the source structure
  (~21,269 tests collected). After M1-M7 remove ~1,185 source files, the
  test suite must mirror the reduced source tree. Dead test files for deleted
  modules must be removed. Remaining tests must target the consolidated APIs.
  
  Strategy: 
  1. Delete test files for deleted modules (M1-M7)
  2. Consolidate tests for merged modules (M2 merges, M5 mega-tools)
  3. Update remaining tests to use v2 import paths
  4. Verify test coverage meets or exceeds pre-migration baselines
  
  Baseline measurements:
    - Post-M7 smoke tests: >= 2570
    - Test files: ~1,366
    - Target: ~600 test files
    - Total tests post-mirror: ~8,000-10,000 (from ~21,269)
  Git prerequisite: phase-m7 COMPLETE on CORTEX-V2 branch

sweep_catalogue:
  - id: "GAP-M8-01"
    title: "Delete test files for deleted modules"
    severity: P0
    source: "CORE-064 sweep completeness"
    evidence: |
      Test files for: persona/ (M1), strategies/ (M1), synthesis/ (M1),
      tools/ (M1), response/ (M1), old context orchestrators (M2),
      old planning orchestrators (M2), crawler/ (M3), documentation/ (M3),
      perception/ (M3), Python AST wrappers (M3), Python LENS adapters (M4),
      old MCP tool files (M5), old agent/skill test files.
      Estimated ~700 test files to delete.
    action_ref: "phase-m8-a"
    status: CLOSED

  - id: "GAP-M8-02"
    title: "Consolidate tests for merged modules"
    severity: P1
    source: "CORE-035 single canonical test per module"
    evidence: |
      Merged modules (ContextValidator from M2, IntentGateway from M2,
      ExecutionEngine from M2, 6 mega-tools from M5) need consolidated
      test suites that cover the combined functionality.
    action_ref: "phase-m8-b"
    status: CLOSED

  - id: "GAP-M8-03"
    title: "Update remaining tests to v2 import paths"
    severity: P0
    source: "Migration completeness"
    evidence: |
      All surviving test files must use v2 import paths:
      - cortex.core.context_validator (not old context modules)
      - cortex.core.intent_gateway (not old IntentRouter)
      - cortex.core.execution_engine (not old MasterOrchestrator)
      - cortex.mcp.tools.cortex_code (not old individual tools)
    action_ref: "phase-m8-b"
    status: CLOSED

  - id: "GAP-M8-04"
    title: "Verify test coverage meets baselines"
    severity: P0
    source: "CORE-068 convergence"
    evidence: |
      Post-mirror test suite must provide equivalent or better coverage
      of the remaining codebase. Coverage percentage should increase
      since code decreased more than tests.
    action_ref: "phase-m8-final"
    status: CLOSED

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

autonomous_execution:
  mode: "SILENT_AUTONOMOUS"
  progress_format: "phase-list+bar"
  convergence_loop_required: true
  max_convergence_cycles: 3
  completion_requires:
    - "all_gap_refs_closed"
    - "completion_gate_passed"
    - "master_index_updated"

phase_continuation:
