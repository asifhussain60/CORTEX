  # ── SUB-PHASE E: No Versioning Anywhere Guardrail (GAP-126-05) ──────────
  - id: "phase-126-e"
    title: "Global No-Versioning Anywhere Guardrail (Check #34)"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-126-05"]
    governance_authority: "CORE-008, CORE-002"
    duration_estimate: "3 hours"
    depends_on: ["phase-126-d"]
    prerequisite: "phase-126-d COMPLETE"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    detect_command: |
      grep -rn "v[0-9]\+\.[0-9]\+\|\"version\":\|version:\s\|release:\s\|semver\|\bv1\b\|\bv2\b\|\bv3\b" \
        cortex-registry/ .github/ --include="*.yaml" --include="*.md" \
        | grep -v "Python 3\|pytest\|tree-sitter\|requirements\|__version__\|python_requires\
                   \|pyproject\|setup.py\|language_version\|rev:\|tag:\|pip\|conda\
                   \|0\.21\.0\|ruff>=\|>=\|==\|!=\|~=\|#.*intentional\|CHANGELOG\|semver.*library"

    exclusion_list:
      # These patterns are intentionally version-like and must NOT be flagged:
      - "Python 3.x version references in requirements/pyproject"
      - "pytest >= / ruff >= package constraints"
      - "tree-sitter>=0.21.0 in requirements.txt"
      - "__version__ in Python source (package identity)"
      - "CHANGELOG / release-notes files (historical record)"
      - "git tag / rev references in CI config"
      - "pip install pinned versions in requirements.txt"

    tdd_cycle:
      red:
        action: "Write tests/preflight/test_no_versioning_anywhere.py — assert detect_command returns 0 matches after exclusions applied; assert audit-fix blocks merge when versioning language found; assert auto-fix suggestion emitted for each violation"
        gate: "python3 scripts/run_tests.py file tests/preflight/test_no_versioning_anywhere.py — ALL tests FAIL"
        blocker: "No versioning removal until RED gate passes"
      green:
        action: "Remove all version fields/markers from YAML, prompt, governance, and workflow files found by detect_command; add CORTEX_NO_VERSION governance rule to cortex-registry/core/; update audit-fix pipeline to run Check #34 with merge-blocking severity"
        gate: "python3 scripts/run_tests.py file tests/preflight/test_no_versioning_anywhere.py — ALL tests PASS"
        blocker: "REFACTOR forbidden until GREEN gate passes"
      refactor:
        action: "Document exclusion list in check #34 spec; ensure rule CORE-NO-VERSION added to skull-rules.yaml"
        gate: "python3 scripts/run_tests.py dir tests/preflight/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2582
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

    tdd_sequence:
      red:
        - "test_no_version_fields_in_cortex_registry_yamls"
        - "test_no_version_fields_in_github_agents"
