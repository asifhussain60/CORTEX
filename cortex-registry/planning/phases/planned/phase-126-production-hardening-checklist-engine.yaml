        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    convergence_gate:
      detect_step: "grep -rn 'os\\.path\\.' cortex/ --include='*.py' | grep -v 'pathlib\\|test_\\|#.*intentional' | wc -l"
      fix_step: "Replace flagged os.path calls with pathlib.Path equivalents"
      success_predicate: "p0_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Log with WONT-FIX justification — do NOT silently skip"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2582
      zero_new_failures: true
