  injection_check: "python3 -c \"from cortex.intelligence.knowledge.knowledge_synthesis_engine.loaders import load_cortex_best_practices; assert load_cortex_best_practices('IMPLEMENT'); print('OK')\""
  analyzer_check: "python3 -c \"from cortex.lens.analyzers.cortex_framework_analyzer import CortexFrameworkAnalyzer; r=CortexFrameworkAnalyzer().analyze_metadata('.'); print('OK' if isinstance(r, dict) else 'FAIL')\""
