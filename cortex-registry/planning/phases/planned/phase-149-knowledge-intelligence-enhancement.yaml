phases:
  # ── Sub-phase A: Knowledge Injection Exit Gate ────────────────────────────────
  - id: "phase-149-a"
    title: "Wire load_cortex_best_practices() into ContextSynthesisGateway.synthesize() exit gate"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-149-01"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "Phase 148 completion_gate PASSED. smoke tests green."
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    files_to_modify:
      - "cortex/orchestrators/core/context_synthesis_gateway.py"
      - "cortex/intelligence/provider.py"
      - "cortex/intelligence/facade.py"
      - "cortex/intelligence/knowledge/knowledge_synthesis_engine/loaders.py"  # may need load_cortex_best_practices() signature update

    implementation_guide: |
      1. In cortex/orchestrators/core/context_synthesis_gateway.py, add lazy import at module level:
           try:
               from cortex.intelligence.knowledge.knowledge_synthesis_engine.loaders import load_cortex_best_practices
           except Exception:
               load_cortex_best_practices = None  # safe degradation

         _KNOWLEDGE_TOKEN_BUDGET = 800
         _KNOWLEDGE_MAX_PRACTICES = 12

      2. Inside synthesize(), before returning SynthesizedContext, add:
           if load_cortex_best_practices is not None and orchestrator_name:
               try:
                   knowledge = load_cortex_best_practices(intent_type, max_practices=_KNOWLEDGE_MAX_PRACTICES)
                   context["knowledge_injection"] = knowledge
               except Exception:
                   context["knowledge_injection"] = {}  # graceful degradation

      3. In cortex/intelligence/facade.py, add:
           def load_best_practices(self, intent: str) -> dict:
               """Delegate to KnowledgeSynthesisEngine.load_cortex_best_practices()."""

      4. Verify cortex-registry/knowledge/INDEX.yaml domains structure is compatible with loaders.py
         (domains: ai, architecture, security, sdlc, testing-validation)

    tdd_cycle:
      red:
        action: "Write exit gate wiring tests before adding gateway injection code"
        gate: "python3 scripts/run_tests.py file tests/orchestrators/core/test_exit_gate_wiring.py — ALL FAIL"
        blocker: "No gateway modification until RED gate passes"
      green:
        action: "Wire load_cortex_best_practices() into ContextSynthesisGateway.synthesize()"
        gate: "python3 scripts/run_tests.py file tests/orchestrators/core/test_exit_gate_wiring.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Verify lazy import guard, token budget constants, graceful degradation fallback"
        gate: "python3 scripts/run_tests.py dir tests/orchestrators/core/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_exit_gate_injects_knowledge — synthesize() context contains knowledge_injection key"
        - "test_exit_gate_degrades_gracefully — returns empty dict when load_cortex_best_practices is None"
        - "test_exit_gate_missing_index_yaml_degrades — returns empty dict when INDEX.yaml missing"
        - "test_load_best_practices_returns_non_empty_for_implement — load_cortex_best_practices('IMPLEMENT') returns non-empty dict"
        - "test_knowledge_token_budget_respected — returned practices fit within 800 token budget"
      green:
        - "Add lazy import guard to context_synthesis_gateway.py"
        - "Add knowledge injection block inside synthesize() before return"
        - "Add IntelligenceFacade.load_best_practices() delegation method"
      refactor:
        - "Type hints on all modified method signatures"
        - "Docstrings on IntelligenceFacade.load_best_practices() (CORE-012)"

    acceptance_criteria:
      - "load_cortex_best_practices(intent_type='IMPLEMENT') returns non-empty dict without raising"
      - "ContextSynthesisGateway.synthesize() result context['knowledge_injection'] is non-empty for any intent"
      - "Knowledge injection degrades gracefully (empty dict, no exception) on missing INDEX.yaml"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/orchestrators/core/"
      min_tests_pass: 20
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── Sub-phase B: CortexFrameworkAnalyzer Enhancement ─────────────────────────
  - id: "phase-149-b"
    title: "Extend CortexFrameworkAnalyzer with regex metadata extraction from .github/ artifacts"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-149-02"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035"
    duration_estimate: "2 hours"
    depends_on: ["phase-149-a"]
    prerequisite: "phase-149-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    files_to_modify:
      - "cortex/lens/analyzers/cortex_framework_analyzer.py"  # additive — new analyze_metadata() method

    implementation_guide: |
      The Phase 131 CortexFrameworkAnalyzer uses weight-based path detection.
      Issue #18 adds a second extraction pass: regex-based metadata from copilot-instructions.md.
      ADDITIVE: add analyze_metadata(repo_path) method, not replacing analyze(repo_path).

      New class-level constants:
        _ORCHESTRATOR_RE = re.compile(r"(\d+)\s+[Oo]rchestrator\s+files?", re.IGNORECASE)
        _MCP_TOOL_RE = re.compile(r"(\d+)\s+MCP\s+[Tt]ools?\s+registered", re.IGNORECASE)
        _INTENT_TYPE_RE = re.compile(r"(\d+)\s+[Ii]ntent\s+[Tt]ypes?", re.IGNORECASE)
        _CORE_RULE_RE = re.compile(r"CORE-(\d{3})", re.IGNORECASE)
        _MAX_CONTENT_BYTES = 8192  # cap reads to avoid unbounded memory

      New method: analyze_metadata(repo_path: str | Path) -> dict[str, Any]:
        - Reads .github/copilot-instructions.md first 8192 bytes
        - Extracts orchestrator_count, mcp_tool_count, intent_type_count via regex
        - Lists .github/prompts/*.prompt.md (inventory)
        - Lists .github/agents/**/*.md by subdirectory category
        - Returns structured dict with is_cortex_repository: True (gated on .github/copilot-instructions.md existing)
        - Returns {} for repos with no .github/ (graceful non-CORTEX path)

    tdd_cycle:
      red:
        action: "Write analyzer metadata tests before extending the class"
        gate: "python3 scripts/run_tests.py file tests/support/onboarding/test_cortex_framework_analyzer.py — ≥5 FAIL"
        blocker: "No class modification until RED gate passes"
      green:
        action: "Add analyze_metadata() method to CortexFrameworkAnalyzer"
        gate: "python3 scripts/run_tests.py file tests/support/onboarding/test_cortex_framework_analyzer.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Verify _MAX_CONTENT_BYTES enforced; type hints; no unbounded file reads"
        gate: "python3 scripts/run_tests.py dir tests/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_analyze_metadata_returns_empty_for_no_github_dir — returns {} for non-CORTEX repo"
        - "test_analyze_metadata_extracts_orchestrator_count — parses '312 Orchestrator files' from copilot-instructions.md"
        - "test_analyze_metadata_extracts_mcp_tool_count — parses '36 MCP Tools registered'"
        - "test_analyze_metadata_extracts_intent_type_count — parses '32 Intent Types'"
        - "test_analyze_metadata_capped_at_8192_bytes — reads no more than _MAX_CONTENT_BYTES"
        - "test_analyze_metadata_is_cortex_repository_true — set when copilot-instructions.md exists"
        - "test_analyze_metadata_prompt_inventory_lists_prompts — lists .github/prompts/*.prompt.md"
        - "test_analyze_metadata_agent_inventory_by_category — groups agents by subdirectory"
      green:
        - "Add regex constants to CortexFrameworkAnalyzer"
        - "Implement analyze_metadata() method"
      refactor:
        - "Enforce _MAX_CONTENT_BYTES cap via [:_MAX_CONTENT_BYTES]"
        - "Add type hints and docstring"

    acceptance_criteria:
      - "analyze_metadata(non_cortex_path) returns {} when no .github/ directory"
      - "analyze_metadata(cortex_repo) returns is_cortex_repository: True with counts > 0"
      - "File reads capped at _MAX_CONTENT_BYTES = 8192 per file"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/support/onboarding/test_cortex_framework_analyzer.py"
      min_tests_pass: 8
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── Sub-phase C: RegistryMaterializer + framework-context.yaml ───────────────
  - id: "phase-149-c"
    title: "RegistryMaterializer — materialize framework-context.yaml to cortex-registry/knowledge/"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-149-03"]
