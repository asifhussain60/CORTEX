             Creates parent dirs, writes yaml.safe_dump() output.

      2. In LensIntegration (or onboarding orchestrator), after CortexFrameworkAnalyzer.analyze_metadata():
           materializer.write_framework_knowledge_yaml(
               framework_context,
               Path("cortex-registry/knowledge/cortex-frame-context/framework-context.yaml")
           )

      3. In IntelligenceFacade, verify registry_index("cortex-frame-context") loads from
         cortex-registry/knowledge/cortex-frame-context/ and returns the YAML data dict.

