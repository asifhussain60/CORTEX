       already contains load_cortex_best_practices() foundation (Phase 103-g). cortex-registry/knowledge/INDEX.yaml
       already exists. The missing piece: ContextSynthesisGateway.synthesize() does not inject knowledge into
       the synthesis context before GitHub Copilot handoff. This phase wires the exit gate.
    2. Framework Self-Aware Analyzer Enhancement (FB-008): CortexFrameworkAnalyzer (Phase 131) uses path-based
       weight scoring to detect CORTEX repos. Issue #18 extends it with regex-based metadata extraction
