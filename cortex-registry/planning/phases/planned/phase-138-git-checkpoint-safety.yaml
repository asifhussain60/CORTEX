id: phase-138
title: "Git Checkpoint Safety — SubPhaseCheckpointInjector + RollbackManager + WorkflowComposer Integration"
created: "2026-03-08"
status: PLANNED
priority: P1
depends_on: ["phase-137"]
sweep_id: SWEEP-138-GIT-CHECKPOINT-SAFETY
estimated_effort: "1.5 days"
source: "GitHub Issue #14 — CORTEX Feedback 2026-03-08 (FB-2026-03-08-011)"

description: |
  Backport of Git Checkpoint Sub-Phase Enforcement from cortex-sts Phase 139.
  Depends on phase-137 (Deep Intelligence Wiring) — RollbackManager emits URS
  punishment signals which require the wired IntelligenceFacade from phase-137.

  Problem: When CAPE's PlanExecutionLoop runs sub-phases autonomously, a failure
  in sub-phase N can leave the workspace in a partially-modified dirty state. There
  is no automatic rollback mechanism — recovery requires manual git resets.

  Solution — two new components:

  1. RollbackManager — wraps git reset --hard operations: get_head_sha(), rollback_to(),
     restore_stash(). Emits URS MILD_PUNISHMENT on rollback to feed the learning system.
     Includes audit logging to .cortex-runtime/traces/.

  2. SubPhaseCheckpointInjector — decorates any sub-phase callback with a full safety
     envelope: create checkpoint (record HEAD SHA + stash dirty tree) → execute callback
     → commit on success with "[CORTEX] sub-phase {id} COMPLETE" message → rollback on
     failure using RollbackManager. Uses CheckpointState dataclass to carry checkpoint
     context between lifecycle hooks.

  WorkflowComposer gains compose_for_sub_phase() — integrating checkpoint injection
  directly into the workflow engine so every sub-phase executed by CAPE's PlanExecutionLoop
  is automatically checkpoint-wrapped without callers needing to manually instantiate
  the injector.

  Note: primitives/execution/git-checkpoint.yaml already exists as a declarative primitive.
  This phase backs it with real Python implementation.

governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-035   # Single canonical implementation
  - CORE-048   # Holistic validation gate
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate (convergence gate now has rollback safety)

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── GAP-138-01: RollbackManager ───────────────────────────────────────────
  - id: GAP-138-01
    title: "RollbackManager — git reset --hard + URS punishment + audit logging"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-011"
    evidence: |
      No programmatic rollback mechanism exists in CORTEX. When autonomous execution
      fails mid-sub-phase, the workspace is left in a dirty state with no recovery path
      other than manual git intervention. The git-checkpoint.yaml primitive declares
      rollback intent but has no backing Python implementation.
    action_ref: "phase-138-a"
    files_to_create:
      - cortex/core/rollback_manager.py  # RollbackManager: get_head_sha(), rollback_to(), restore_stash()
    test_file: "tests/core/test_sub_phase_checkpoint.py"

  # ── GAP-138-02: SubPhaseCheckpointInjector ────────────────────────────────
  - id: GAP-138-02
    title: "SubPhaseCheckpointInjector — create/commit/rollback checkpoint wrapper"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-011"
    evidence: |
      CAPE's PlanExecutionLoop has no mechanism to wrap sub-phase execution in a
      safety envelope. A failure in any sub-phase leaves changes from that sub-phase
      uncommitted and mixed with clean state, making rollback ambiguous. The checkpoint
      injector provides a clean before/after SHA boundary.
    action_ref: "phase-138-b"
    files_to_create:
      - cortex/core/sub_phase_checkpoint_injector.py  # CheckpointState, SubPhaseCheckpointInjector
    test_file: "tests/core/test_sub_phase_checkpoint.py"

  # ── GAP-138-03: WorkflowComposer.compose_for_sub_phase() ──────────────────
  - id: GAP-138-03
    title: "WorkflowComposer.compose_for_sub_phase() — checkpoint injection into workflow engine"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-011"
    evidence: |
      WorkflowComposer has no method to compose a workflow for a single sub-phase with
      automatic checkpoint injection. Callers of WorkflowComposer must manually wrap
      execution in checkpoints — this is error-prone and breaks the single-responsibility
      principle of the workflow engine.
    action_ref: "phase-138-c"
    files_to_modify:
      - cortex/orchestrators/workflow/workflow_composer.py  # add compose_for_sub_phase()
    test_file: "tests/golden/workflow/test_sub_phase_checkpoint.py"

