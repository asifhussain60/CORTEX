          - "cortex/lens/cache.py vs cortex/infrastructure/storage/cache.py"
          - "cortex/intelligence/capability_matcher.py vs cortex/orchestrators/core/intent_router/capability_matcher.py"
          - "cortex/intelligence/domain_brain/optimistic_lock.py vs cortex/core/common/optimistic_lock.py"
          - "cortex/cli/commands/lens_dashboard.py vs cortex/cli/lens_dashboard.py"

  exit_criteria:
