phase_58:
  id: phase-58
  title: "Simplification Phase 1 — core/core Collapse & Duplicate Filename Elimination"
  priority: P0
  status: IN_PROGRESS
  governance_authority: "CORE-035, CORE-064"
  duration_estimate: "3-4 days"
  prerequisite: "Phase 57 complete, smoke tests green"
  sweep_id: SWEEP-58-CORE-COLLAPSE
  regression_gate: "838 golden tests must pass after every sub-phase"

  sub_phases:
    - id: phase-58-a
      title: "Audit & Map — core/core full dependency graph"
      status: OPEN
      duration: "4 hours"
      description: |
        Build exact import graph for 113 core/core files. Group into:
        Group A: twins at cortex/core/<name>.py (15 files) — delete core/core copy
        Group B: unique to core/core (~35 files) — relocate to canonical
        Group C: knowledge/* (17 files) → cortex/knowledge/
        Group D: intent/* (6 files) → cortex/core/intent/
      deliverables:
        - "Inline audit report: Group A/B/C/D counts"
        - "import_redirect_map.yaml in cortex-registry/planning/ (temp, deleted after phase-58)"
      group_a_twins:
        - "ac_domain_mapper.py → cortex/core/ac_domain_mapper.py"
        - "audit_required_validator.py → cortex/core/audit_required_validator.py"
        - "brain_populator.py → cortex/core/brain_populator.py"
        - "compatibility_layer.py → cortex/core/compatibility_layer.py"
        - "dependency_validator.py → cortex/core/dependency_validator.py"
        - "governance_enforcer.py → cortex/core/governance_enforcer.py"
        - "governance_pregate.py → cortex/core/governance_pregate.py"
        - "health_metrics.py → cortex/core/health_metrics.py"
        - "mode_controller.py → cortex/core/mode_controller.py"
        - "mutation_guard.py → cortex/core/mutation_guard.py"
        - "path_resolver.py → cortex/core/path_resolver.py"
        - "provenance_tracker.py → cortex/core/provenance_tracker.py"
        - "response_header_config.py → cortex/core/response_header_config.py"
        - "resumption_handler.py → cortex/core/resumption_handler.py"
        - "state_machine.py → cortex/core/state_machine.py"

    - id: phase-58-b
      title: "Delete Group A twins — redirect imports to canonical"
      status: OPEN
      duration: "4 hours"
      description: |
        For each Group A twin: canonical already exists at cortex/core/<name>.py.
        1. grep all imports of cortex.core.core.<name> → rewrite to cortex.core.<name>
        2. make test-batch — must pass
        3. delete cortex/core/core/<name>.py
        4. make test-batch — confirm no regression
        Do NOT batch — one file at a time for safety.
      files_to_delete: 15

    - id: phase-58-c
      title: "Relocate Group B unique files to canonical locations"
      status: OPEN
      duration: "6 hours"
      description: |
        Move each Group B file to target path. Add compat shim at old path.
        After all moves: final import sweep. Remove shims. Delete empty dirs.
      files_to_relocate: ~35
      compat_shim_retention: "90 days — removed in phase-61 cleanup"

    - id: phase-58-d
      title: "Relocate Group C (knowledge) + Group D (intent)"
      status: OPEN
      duration: "4 hours"
      files_to_relocate: ~23

    - id: phase-58-e
      title: "Delete cortex/core/core/ directory entirely"
      status: OPEN
      duration: "2 hours"
      description: |
        After 58-b/c/d complete with zero test failures:
        1. Verify only shims and empty inits remain (wc -l = 0 real logic)
        2. Delete cortex/core/core/ directory
        3. make test-batch — final confirmation
        4. Update copilot-instructions.md: remove all core/core references
      files_deleted: 113

    - id: phase-58-f
      title: "Duplicate filename elimination — 90 groups, 96 extra files"
      status: IN_PROGRESS
      started: "2026-02-24"
      duration: "4 hours"
      method: "grep import count determines canonical; lower count = delete candidate"
      files_deleted_estimate: 96
      progress:
        batch_1_complete: "2026-02-24"
        batch_1_deleted: 6
        batch_1_commit: "6970e390a"
        batch_1_files:
          - "cortex/core/coherence_validator.py (shim → orchestrators/validation/)"
          - "cortex/core/registry/status_update_hook.py (shim → infrastructure/automation/)"
          - "cortex/governance/validation/wiring_validator.py (shim → core/wiring/registry/)"
          - "cortex/intelligence/crawler/pipeline.py (shim → orchestrators/health/)"
          - "cortex/lens/ml_patterns/dashboard_generator.py (shim → core/registry/)"
          - "cortex/orchestrators/domain/business/base.py (zero-import abstract base)"
        regression_gate: "1420 smoke PASSED after batch 1"
        remaining_groups: 57
        remaining_extra_files: 63
        deferred_pairs:
          - "context_cache_layer (root vs interaction/) — different APIs, merge in Phase 60"
          - "context_synthesis_gateway (root vs interaction/) — different APIs (create_exit_gate vs get_gateway)"
          - "toolkit_tools.py (mcp/ vs mcp/tools/) — different tools exposed, both needed"
          - "vacuum_orchestrator (health/ vs support/) — support/ is deliberate protocol adapter"
          - "rollback_orchestrator (infrastructure/ vs support/) — support/ is deliberate compat shim"
          - "stage_execution_strategy (core/ vs strategies/) — strategies/ is deliberate re-export"
        next_batch_candidates:
