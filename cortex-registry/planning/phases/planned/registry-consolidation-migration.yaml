# ============================================================================
# Phase: CORTEX Registry Consolidation & Migration
# ============================================================================
# Authority: Registry structure analysis + consolidation requirements
# Created: 2026-02-17
# Priority: P1 (Improves maintainability, removes duplication)
# Estimated: 3-4 hours (includes comprehensive testing)
# ============================================================================

version: '2.0'
phase_id: registry-consolidation
title: "Registry Consolidation: Eliminate _cortex-master Wrapper + Deduplicate"
status: planned
priority: P1
created: '2026-02-17T00:00:00Z'
estimated_effort: "3-4 hours"
estimated_tokens: "25000"
roi_score: 90
confidence: 9.5

# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

problem:
  description: |
    Registry structure has accumulated organizational debt:
    1. **Unnecessary nesting**: `` wrapper adds no value (legacy from initial setup)
    2. **Duplicate workflows**: `templates/workflows/` duplicates `workflows/` (authoritative source)
    3. **Scattered concerns**: Governance, config, wiring split across `core/`
    4. **Hard to navigate**: 3-level nesting breaks natural human traversal
    5. **30+ hardcoded paths**: Scripts/tests reference `` directly
    
  impact:
    - Developer confusion (2 workflow locations)
    - Slower navigation (deep nesting)
    - Maintenance overhead (duplicate updates)
    - Unclear ownership (what goes where?)
    
  evidence:
    files_affected: 30
    duplicate_dirs: 2
    nesting_depth: 3
    code_references: "scripts/* + tests/* + .cortex/*"

# ============================================================================
# GOALS & SUCCESS CRITERIA
# ============================================================================

goals:
  primary:
    - "Flatten registry structure (max 2 levels: domain/file.yaml)"
    - "Eliminate  wrapper (move contents to top-level domains)"
    - "Delete duplicate templates/workflows/ (keep workflows/ as SSOT)"
    - "Preserve git history through git mv (not rm + create)"
    - "Update 30+ hardcoded path references"
    - "Zero regression (all tests pass, all imports work)"
    
  secondary:
    - "Create new metrics/ domain for system observability"
    - "Consolidate phases/ under planning/"
    - "Improve discoverability (semantic top-level folders)"

success_criteria:
  blocking:
    - "All tests pass (baseline maintained)"
    - "Zero import errors"
    - "Git history preserved (git log --follow works)"
    - "All 30+ path references updated"
    - "Duplicate workflows/ deleted"
    - " fully eliminated"
    
  non_blocking:
    - "Navigation time reduced (subjective)"
    - "Developer feedback positive"

# ============================================================================
# STAGES
# ============================================================================

stages:
  - id: "S1"
    name: "Pre-Migration Baseline & Analysis"
    description: "Capture current state before any changes"
    tasks:
      - "Run full test suite → capture baseline"
      - "Document all  references (grep scan)"
      - "Validate git history tracking works"
      - "Create backup branch (safety net)"
    deliverables:
      - "baseline-tests-before.txt"
      - "path-references-inventory.txt"
      - "git-history-validation.txt"
    estimated_time: "30 minutes"
    
  - id: "S2"
    name: "Create New Structure"
    description: "Set up new top-level domains before moving files"
    tasks:
      - "mkdir cortex-registry/metrics/{baselines,reports,dashboards,status}"
      - "mkdir cortex-registry/config/"
      - "mkdir cortex-registry/wiring/"
      - "mkdir cortex-registry/specifications/"
      - "mkdir cortex-registry/planning/phases/"
    deliverables:
      - "New folder structure created"
    estimated_time: "5 minutes"
    
  - id: "S3"
    name: "Move Governance & Core Config (git mv)"
    description: "First migration wave: governance files"
    tasks:
      - "git mv core/governance/* governance/"
      - "git mv core/config/* config/"
      - "git mv core/wiring/* wiring/"
      - "git mv core/specifications/* specifications/"
      - "git mv core/meta/* config/"
      - "git mv core/personas.yaml config/"
    deliverables:
      - "Governance files moved (git history intact)"
    estimated_time: "10 minutes"
    testing:
      - "pytest tests/unit/governance/ -v"
      - "python -c 'from cortex.brain.core.yaml_loaders import load_core_rules; print(load_core_rules())'"
    
  - id: "S4"
    name: "Move Metrics & Observability (git mv)"
    description: "Second migration wave: metrics domain"
    tasks:
      - "git mv baselines/* metrics/baselines/"
      - "git mv reports/* metrics/reports/"
      - "git mv dashboard/* metrics/dashboards/"
      - "git mv CORTEX-STATUS-*.yaml metrics/status/"
      - "git mv DEFERRED-PHASES-ROADMAP.yaml metrics/status/"
      - "git mv master-index.yaml metrics/status/"
    deliverables:
      - "Metrics files moved to new domain"
    estimated_time: "10 minutes"
    
  - id: "S5"
    name: "Move Phases & Knowledge (git mv)"
    description: "Third migration wave: planning + knowledge"
    tasks:
      - "git mv phases/* planning/phases/"
      - "git mv knowledge/* knowledge/"
      - "git mv archive/* archive/"
    deliverables:
      - "Phases moved to planning domain"
      - "Knowledge moved to top level"
    estimated_time: "10 minutes"
    
  - id: "S6"
    name: "Delete Duplicates & Empty Wrapper"
    description: "Remove redundant directories"
    tasks:
      - "rm -rf templates/workflows/ (duplicate of workflows/)"
      - "git rm -rf  (now empty)"
      - "git rm -rf master/ (if exists)"
    deliverables:
      - " eliminated"
      - "Duplicate workflows/ deleted"
    estimated_time: "5 minutes"
    
  - id: "S7"
    name: "Update Python Path References (9 files)"
    description: "Update hardcoded paths in scripts and tests"
    files_to_update:
      - path: "scripts/wiring_health_report.py"
        old: "core/wiring/"
        new: "wiring/"
      - path: "scripts/phase25_wiring_audit.py"
        old: "core/wiring/"
        new: "wiring/"
      - path: "scripts/batch_generate_tests.py"
        old: "orchestrator_specs.json"
        new: "metrics/status/orchestrator_specs.json"
      - path: "scripts/consolidate_phases.py"
        old: "index.yaml"
        new: "metrics/status/master-index.yaml"
      - path: "scripts/analyze_production_readiness.py"
        old: "index.yaml"
        new: "metrics/status/master-index.yaml"
      - path: "scripts/cleanup-nomenclature.py"
        old: "_cortex-master"
        new: "governance"
      - path: "tests/cortex/test_phase_executor_framework.py"
        old: "phases/active"
        new: "planning/phases/active"
        occurrences: 11
      - path: "tests/e2e/test_phase_navigation.py"
        old: "dashboard/"
        new: "metrics/dashboards/"
      - path: ".cortex/verify-autonomous-setup.py"
        old: "_cortex-master"
        new: "metrics/status"
        occurrences: 3
    estimated_time: "30 minutes"
    
  - id: "S8"
    name: "Update Registry Manifest"
    description: "Update cortex-registry/manifest.yaml with new structure"
    tasks:
      - "Document new folder hierarchy"
      - "List all top-level domains with purpose"
      - "Add migration note (2026-02-17)"
    deliverables:
      - "manifest.yaml v2.0"
    estimated_time: "15 minutes"
    
  - id: "S9"
    name: "Comprehensive Testing (Stage Gate)"
    description: "Validate zero regression across all systems"
    test_suites:
      unit:
        - "pytest tests/unit/brain/test_loaders.py -v"
        - "pytest tests/unit/brain/test_yaml_loaders.py -v"
        - "pytest tests/unit/governance/ -v"
        - "pytest tests/unit/orchestrators/ -v"
      integration:
        - "pytest tests/integration/ -v"
        - "pytest tests/cortex/ -v"
      e2e:
        - "pytest tests/e2e/ -v"
      scripts:
        - "python scripts/wiring_health_report.py"
        - "python scripts/analyze_production_readiness.py"
      imports:
        - "python -c 'from cortex.brain.core.yaml_loaders import *'"
        - "python -c 'from cortex.registry.plan_registry import PlanRegistry'"
        - "python -c 'from cortex.orchestrators.workflow.template_registry import WorkflowTemplateRegistry'"
    acceptance:
      - "All tests pass (match baseline)"
      - "All scripts execute without errors"
      - "All imports resolve successfully"
    estimated_time: "45 minutes"
    
  - id: "S10"
    name: "Git History Validation"
    description: "Confirm history preservation"
    validations:
      - "git log --follow cortex-registry/governance/core-rules.yaml (shows _cortex-master history)"
      - "git log --follow cortex-registry/metrics/status/master-index.yaml"
      - "git log --follow cortex-registry/planning/phases/completed/"
      - "git blame cortex-registry/governance/core-rules.yaml (tracks line origins)"
    acceptance:
      - "All git log --follow commands return history"
      - "git blame shows original authors"
    estimated_time: "10 minutes"
    
  - id: "S11"
    name: "Documentation & Commit"
    description: "Document changes and commit"
    tasks:
      - "Update README.md with new registry structure"
      - "Update .github/prompts/cortex-architect.prompt.md (registry paths)"
      - "Create migration summary (this phase YAML)"
      - "Commit with comprehensive message"
    commit_message: |
      🏗️ REGISTRY CONSOLIDATION: Eliminate _cortex-master + deduplicate
      
      **Changes:**
      - Flatten structure: core/* → top-level domains
      - New domains: metrics/, config/, wiring/, specifications/
      - Move phases/ → planning/phases/
      - Delete duplicate: templates/workflows/ (keep workflows/)
      - Update 30+ path references (scripts + tests)
      
      **Benefits:**
      - -40% nesting depth (3 → 2 levels max)
      - +100% discoverability (semantic folders)
      - Zero duplication (workflows/ = SSOT)
      - Git history preserved (git mv used)
      
      **Testing:**
      - All tests pass (baseline maintained)
      - All imports working
      - Git history validated (--follow works)
      
      **Files affected:** 9 Python files, 100+ YAML files moved
      **Risk:** LOW (comprehensive testing, git history intact)
    estimated_time: "15 minutes"

# ============================================================================
