# ============================================================================

risks:
  - risk: "Break imports (Python can't find moved files)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation: "Stage-by-stage testing after each move"
    
  - risk: "Lose git history (files appear new)"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation: "Use git mv (not rm + create), validate with --follow"
    
  - risk: "Break scripts (hardcoded paths)"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation: "Comprehensive grep scan + update all 30+ references"
    
  - risk: "Test failures (stale paths in tests)"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation: "Update tests in S7, validate in S9"
    
  - risk: "Developer confusion (where did files go?)"
    likelihood: "MEDIUM"
    impact: "LOW"
    mitigation: "Update manifest.yaml, document in README"

