# ============================================================================

rollback:
  trigger: "Critical failure in S9 testing"
  steps:
    - "git reset --hard HEAD~1 (undo commit)"
    - "git checkout backup-branch"
    - "Investigate failure root cause"
    - "Fix issue before retrying"
  estimated_time: "5 minutes"

