        - "No broken symlinks"
        - "Files exist at new location"
      blocking: true
      frequency: "after_each_move"
      
  phase_completion:
    - gate: "ComprehensiveTesting"
      checks:
        - "All tests pass (match baseline)"
        - "All imports resolve"
        - "Git history preserved"
