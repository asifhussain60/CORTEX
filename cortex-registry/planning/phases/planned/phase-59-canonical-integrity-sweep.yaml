    gaps_closed: [GAP-59-07]
    sequence: 4
    estimated_duration: "30 minutes"
    approach: |
      cortex/knowledge/ is empty (0 files). Two options:
      A) Give it a purpose: cortex/knowledge/__init__.py that re-exports from
         cortex-registry/knowledge/ via a KnowledgeRegistry loader class.
      B) Delete it and remove from architecture diagrams.

