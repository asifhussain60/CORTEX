  - id: 59-g
    title: "Structured DependencyWarning — Replace Silent ImportError Fallbacks"
    priority: P2
    gaps_closed: [GAP-59-10]
    sequence: 7
    estimated_duration: "90 minutes"
    approach: |
      Phase 57-e targeted 144 ImportError blocks; count rose to 151 in Phase 58.
      Introduce cortex.core.dependency_guard.soft_import(module, fallback, warn=True)
      utility. This gives a single structured entry point for optional imports with
      observable degradation logging. Migrate all cortex.* internal import guards to
      use soft_import(). External library guards (yaml, prometheus_client, etc.)
      remain as-is — they are legitimate optional-dependency patterns.
    tdd_sequence:
      RED:
        - "tests/core/test_dependency_guard.py"
        - "test_soft_import_returns_module_when_available()"
        - "test_soft_import_returns_fallback_when_unavailable()"
