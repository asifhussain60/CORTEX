  - id: 59-e
    title: "Genuine Cross-Cutting Activation — PlanningOrchestrator + Hook Bypass Fix"
    priority: P1
    gaps_closed: [GAP-59-08, GAP-59-08b]
    sequence: 5
    estimated_duration: "2 hours"
    approach: |
      Phase 58 added _activate_cross_cutting_hooks() to OrchestratorProtocolMixin.
      But domain orchestrators override execute_operation WITHOUT calling super(),
      so all Phase 58 hooks are bypassed in practice.

      Fix A: Add @cross_cutting_enforced decorator in OrchestratorProtocolMixin
      that wraps execute_operation overrides — injecting pre/post hook calls
      without requiring per-orchestrator super() calls.

      Fix B: PlanningOrchestrator — add genuine LENSOrchestrator.analyze_directory()
      call in process() before plan generation. Use lazy import + graceful degradation.
      This is additive (10 lines) and does not change plan logic.
    tdd_sequence:
      RED:
        - "tests/core/test_cross_cutting_enforced_decorator.py"
        - "test_decorator_calls_activate_hooks_before_execute()"
        - "test_decorator_calls_activate_hooks_after_execute()"
        - "test_domain_orchestrators_cannot_bypass_hooks()"
        - "tests/orchestrators/domain/test_planning_lens_activation.py"
        - "test_planning_orchestrator_calls_lens_analyze()"
        - "test_planning_orchestrator_enriches_plan_with_lens_findings()"
      GREEN:
        - "Add @cross_cutting_enforced decorator to OrchestratorProtocolMixin"
        - "Decorator: wraps any override of execute_operation with pre/post hook activation"
        - "Apply decorator to all domain orchestrators (additive — no logic change)"
        - "PlanningOrchestrator.process(): add try/except lens_orchestrator.analyze_directory(scope)"
        - "If LENS unavailable: log degradation warning + continue with existing plan logic"
      REFACTOR:
        - "Extract lens enrichment into _enrich_plan_with_lens(plan, lens_ctx) helper"
        - "Ensure all existing planning tests still pass"
    deliverables:
      - "cortex/core/orchestrator_protocol_mixin.py (@cross_cutting_enforced decorator)"
      - "cortex/orchestrators/domain/planning_orchestrator.py (genuine LENS call)"
      - "tests/core/test_cross_cutting_enforced_decorator.py (3 new tests)"
      - "tests/orchestrators/domain/test_planning_lens_activation.py (2 new tests)"
    acceptance_criteria:
      - "@cross_cutting_enforced decorator defined and importable from cortex.core.orchestrator_protocol_mixin"
      - "PlanningOrchestrator.process() invokes LENS (or logs graceful degradation)"
      - "grep -n 'lens_orchestrator\\|LENSOrchestrator' planning_orchestrator.py returns ≥1 hit"
      - "All existing planning + mixin tests pass"

