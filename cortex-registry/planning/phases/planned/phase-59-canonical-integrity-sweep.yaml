      GREEN:
        - "Create cortex/core/dependency_guard.py with soft_import() function"
        - "soft_import(module_path, fallback=None, warn=True, feature_name=None) -> Any"
        - "On ImportError: logger.warning(f'[DEGRADED] {feature_name or module_path} unavailable — using fallback')"
        - "Migrate all cortex.* ImportError blocks in orchestrators/ to soft_import()"
      REFACTOR:
        - "Validate external library guards (yaml, opentelemetry, prometheus) remain unchanged"
        - "Add soft_import to cortex/__init__.py public surface"
        - "Verify smoke tests pass — degradation is now observable, not silent"
    deliverables:
