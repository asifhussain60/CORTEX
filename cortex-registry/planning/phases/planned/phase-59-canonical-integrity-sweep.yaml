sub_phases:

  - id: 59-a
    title: "Canonical AuditEntry — Single Definition (CORE-035 P0)"
    priority: P0
    gaps_closed: [GAP-59-01]
    sequence: 1
    estimated_duration: "90 minutes"
    approach: |
      Create cortex/core/audit_models.py as the single canonical AuditEntry dataclass.
      It must be a superset of all 9 variant definitions (union of all fields).
      Replace each of the 9 duplicate definitions with a re-export pointing to canonical.
      EnforcementOrchestrator pre-commit hook blocks new AuditEntry definitions
      outside cortex/core/audit_models.py (add to violation_patterns.yaml).
    tdd_sequence:
      RED:
        - "tests/core/test_audit_models_canonical.py"
        - "test_audit_entry_is_single_canonical_definition()"
        - "test_audit_entry_superset_of_all_variants()"
        - "test_all_9_files_import_from_canonical()"
        - "test_no_duplicate_audit_entry_class_in_codebase()"
      GREEN:
        - "Create cortex/core/audit_models.py with AuditEntry dataclass"
        - "Fields: session_id, orchestrator, operation, status, timestamp, duration_ms, details, error, phase"
        - "Replace 8 duplicate definitions with: from cortex.core.audit_models import AuditEntry"
        - "Keep cortex/infrastructure/audit_db.py as primary — it re-exports canonical"
      REFACTOR:
        - "Validate all callers still work via re-exports"
        - "Add AuditEntry to cortex/__init__.py public surface"
    deliverables:
      - "cortex/core/audit_models.py (NEW — canonical AuditEntry + re-exports)"
      - "8 files modified to import from canonical"
      - "tests/core/test_audit_models_canonical.py (4 new tests)"
      - "cortex-registry/core/governance/violation_patterns.yaml (new rule: no duplicate AuditEntry)"
    acceptance_criteria:
      - "grep -rn 'class AuditEntry' cortex/ returns exactly 1 result"
      - "All 9 former locations import from cortex.core.audit_models"
      - "All existing tests that use AuditEntry still pass"

  - id: 59-b
    title: "Canonical Result/Ok/Err + Single OperationMode + Unified IOrchestrator Path"
    priority: P0
    gaps_closed: [GAP-59-02, GAP-59-03, GAP-59-04]
    sequence: 2
    estimated_duration: "2 hours"
    approach: |
      These 3 gaps share a root cause: cortex/core/core/ is a legacy double-nesting
      artifact that hosts canonical interfaces alongside cortex/core/*.
      
      Fix strategy (bounded — no structural flattening):
      1. cortex/core/core/result.py → pure re-export of cortex.core.result (3 lines)
      2. cortex/core/interfaces.py → re-export OperationMode from canonical i_orchestrator
         DELETE the duplicate OperationMode enum definition
      3. cortex/core/interfaces/i_orchestrator.py already re-exports from canonical
         Make cortex/core/core/interfaces/__init__.py consistent (already points at cortex.core.interfaces.i_orchestrator)
      4. Fix PlanningOrchestrator to use cortex.core.core.interfaces.i_orchestrator (canonical path A)
      5. Fix RefactoringOrchestrator to remove CoreErr/CoreOk dual-import aliases
    tdd_sequence:
      RED:
        - "tests/core/test_canonical_result_type.py"
        - "test_ok_from_core_result_equals_ok_from_core_core_result()"
        - "test_err_from_core_result_equals_err_from_core_core_result()"
        - "test_result_is_single_class_not_two()"
        - "tests/core/test_canonical_operation_mode.py"
        - "test_operation_mode_has_single_definition()"
        - "test_planning_orchestrator_uses_canonical_operation_mode()"
        - "test_no_duplicate_operation_mode_importable()"
      GREEN:
        - "cortex/core/core/result.py → from cortex.core.result import Result, Ok, Err, __all__"
        - "cortex/core/interfaces.py → delete OperationMode class, import from i_orchestrator"
        - "cortex/orchestrators/domain/planning_orchestrator.py → use cortex.core.core.interfaces.i_orchestrator"
        - "cortex/orchestrators/domain/refactoring_orchestrator.py → remove CoreErr/CoreOk aliases"
        - "Replace all cortex.core.core.result import uses with cortex.core.result (9 files)"
      REFACTOR:
        - "Verify isinstance checks still pass across both former import paths"
        - "Run full test suite — zero new failures permitted"
    deliverables:
      - "cortex/core/core/result.py (re-export wrapper — 5 lines)"
      - "cortex/core/interfaces.py (OperationMode removed, re-exported)"
      - "cortex/orchestrators/domain/refactoring_orchestrator.py (dual-import removed)"
      - "cortex/orchestrators/domain/planning_orchestrator.py (canonical import path)"
      - "9 files updated to cortex.core.result import"
      - "tests/core/test_canonical_result_type.py (3 new tests)"
      - "tests/core/test_canonical_operation_mode.py (3 new tests)"
    acceptance_criteria:
      - "grep -rn 'class Result\\b' cortex/ returns exactly 1 definition"
      - "grep -rn 'class OperationMode' cortex/ returns exactly 1 definition"
      - "from cortex.core.result import Ok; from cortex.core.core.result import Ok as Ok2; assert Ok is Ok2"
      - "RefactoringOrchestrator has zero CoreErr/CoreOk alias imports"

