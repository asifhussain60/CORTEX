        - "Update .github/copilot-instructions.md tier description"
        - "Update .github/prompts/cortex-architect.prompt.md Execution Modes section"
      REFACTOR:
        - "Run cortex-meta-auditor.md 23-point check against updated files"
        - "Verify all SSOT references are consistent"
    deliverables:
