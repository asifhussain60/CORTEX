      RED:
        - "tests/knowledge/test_knowledge_registry_proxy.py"
        - "test_cortex_knowledge_module_importable()"
        - "test_knowledge_registry_proxy_loads_yaml_from_registry()"
        - "test_knowledge_module_not_empty()"
      GREEN:
        - "Create cortex/knowledge/__init__.py with KnowledgeRegistryProxy"
