# ─────────────────────────────────────────────────────────────────────────────
# POST-COMPLETION CLEANUP PROCEDURES (run after all sub-phases COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
post_completion_cleanup:
  description: |
    After ALL 5 sub-phases pass their completion gates, execute these
    holistic cleanup procedures to ensure zero traces of previous
    implementations remain in the codebase (excluding cortex-docs/).

  steps:
    - id: "cleanup-001"
      title: "Full codebase grep sweep for dissolved patterns"
      command: |
        grep -rn "get_intelligence_provider\|UnifiedIntelligenceProvider" cortex/ --include="*.py" | grep -v __pycache__ | grep -v facade.py | grep -v provider.py | grep -v "__init__"
        grep -rn "LENSIntelligenceFacade" cortex/ --include="*.py" | grep -v __pycache__ | grep -v "cortex/lens/facade.py"
        grep -rn "phase97_integration" cortex/ --include="*.py" | grep -v __pycache__
        grep -rn "from cortex.knowledge.registry_proxy import" cortex/orchestrators/ cortex/mcp/ cortex/tools/ --include="*.py" | grep -v __pycache__
      expected_result: "All commands return 0 matches"

    - id: "cleanup-002"
      title: "Empty directory purge"
      command: "find cortex/intelligence -type d -empty -delete"
      expected_result: "No empty directories remain"

    - id: "cleanup-003"
      title: "Stale compat shim review"
      description: |
        Review all compat shims created during migration. Each shim file must:
        1. Be ≤30 lines (re-export only, no logic)
        2. Have a deprecation notice in its docstring
        3. Import from the canonical new location
        4. Be tracked in a future phase for eventual removal

    - id: "cleanup-004"
      title: "Ruff full sweep — F401 + F811"
      command: "python3 -m ruff check cortex/ --select=F401,F811 --output-format=concise"
      expected_result: "All checks passed! (or only intentional __init__.py re-exports flagged)"

    - id: "cleanup-005"
      title: "Test mirror alignment"
      command: |
        Verify tests/intelligence/ mirrors cortex/intelligence/ diamond structure.
        Verify tests/unit/lens/ still works for compat shim tests.
      expected_result: "Test dirs match source dirs"

    - id: "cleanup-006"
      title: "Prompt suite refresh"
      command: "python3 scripts/refresh_prompt_suite.py"
      expected_result: "Zero drift, all counts match live architecture"

    - id: "cleanup-007"
      title: "Git commit with phase tag"
      command: "git add -A && git commit -m 'Phase 109: Diamond Intelligence Completion — facade wiring, flatten, cleanup'"
      expected_result: "Clean commit, no untracked files"

