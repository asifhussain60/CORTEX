      probability: LOW
      impact: MEDIUM

    - factor: "MCP tool rewiring may affect runtime behavior"
      mitigation: "IntelligenceFacade.query() delegates to same KnowledgeRegistryProxy internally — behavior unchanged"
      probability: LOW
      impact: LOW

  rollback_strategy: "git revert to pre-phase-109 commit; all changes are additive compat shims first, deletions last"
