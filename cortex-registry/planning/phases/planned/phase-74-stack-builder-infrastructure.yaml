        description: "Python stack knowledge — pytest patterns, mypy, ruff, coverage targets"
      - path: "tests/orchestrators/strategies/builders/test_python_builder.py"
        description: "Tests for Python builder guidance and scaffolding"

    tdd_sequence:
      red:
        - "test_python_builder_stack_id — returns 'python'"
        - "test_python_builder_supported_frameworks — ['fastapi', 'django', 'flask']"
        - "test_python_builder_test_patterns_red — AAA pattern, pytest fixtures, parametrize"
        - "test_python_builder_test_patterns_green — type hints, minimal implementation idioms"
        - "test_python_builder_test_patterns_refactor — import hygiene, complexity reduction"
        - "test_python_builder_generate_scaffold_module — produces typed module with docstrings"
        - "test_python_builder_generate_scaffold_endpoint — produces FastAPI route + contract test"
        - "test_python_builder_validate_output_type_coverage — flags missing type hints"
        - "test_python_builder_validate_output_import_hygiene — flags circular imports"
        - "test_python_builder_best_practices_loads_yaml — loads from python.yaml"
      green:
        - "Implement PythonStackBuilder"
        - "Create python.yaml with pytest patterns, typing guidance, framework-specific patterns"
      refactor:
        - "Cross-reference with existing backend-python/clean-code.yaml — no duplication"

    acceptance_criteria:
      - "PythonStackBuilder registered in StackBuilderRegistry"
      - "get_test_patterns(RED) returns pytest-specific fixture and assertion patterns"
      - "generate_scaffold('endpoint', {framework: 'fastapi'}) produces typed route + test"
      - "validate_output() checks type hint coverage and import hygiene"
      - "python.yaml complementary to (not duplicating) backend-python/clean-code.yaml"

    python_quality_contract:
      type_system:
        type_hints_required: true
        mypy_strict: true
        no_any_types: true
      testing:
        framework: pytest
        patterns: [AAA, fixtures, parametrize, conftest_hierarchy]
        coverage_target: 95
        mutation_testing: true
      code_quality:
        linter: ruff
        formatter: black
        import_sorter: isort
        max_function_lines: 50
        max_class_lines: 500
      frameworks:
