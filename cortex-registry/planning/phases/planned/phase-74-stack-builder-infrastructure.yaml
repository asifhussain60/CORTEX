phases:
  - id: "phase-70-a"
    title: "StackBuilder ABC + StackBuilderRegistry + Data Models"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-70-01", "GAP-70-02"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-028, CORE-035"
    duration_estimate: "1 day"
    prerequisite: "smoke tests green (1,420 baseline)"
    regression_gate: "python scripts/run_tests.py batch — zero new failures"

    new_files:
      - path: "cortex/orchestrators/strategies/stack_builder.py"
        description: "StackBuilder ABC with 6 abstract methods + data models (StackTestGuidance, StackBestPractices, StackValidationResult, StackContext)"
      - path: "cortex/orchestrators/strategies/stack_builder_registry.py"
        description: "StackBuilderRegistry — singleton registry with resolve(detections), get(stack_id), register(builder), list_builders()"
      - path: "cortex/orchestrators/strategies/builders/__init__.py"
        description: "Package init for concrete builder implementations"
      - path: "tests/orchestrators/strategies/test_stack_builder.py"
        description: "Tests for StackBuilder ABC contract validation"
      - path: "tests/orchestrators/strategies/test_stack_builder_registry.py"
        description: "Tests for registry discovery, dispatch, and fallback behavior"

    tdd_sequence:
      red:
        - "test_stack_builder_abc_contract — verify abstract methods enforced"
        - "test_stack_builder_data_models — StackTestGuidance, StackBestPractices, StackValidationResult dataclasses"
        - "test_registry_register_and_get — register builder, retrieve by stack_id"
        - "test_registry_resolve_from_detections — StackDetection list → best matching builder"
        - "test_registry_unknown_stack_returns_none — graceful fallback"
        - "test_registry_list_builders — enumerate all registered builders"
        - "test_registry_confidence_threshold — only dispatch above 0.6 confidence"
      green:
        - "Implement StackBuilder ABC with abstractmethods"
        - "Implement data models as frozen dataclasses with type hints"
        - "Implement StackBuilderRegistry with dict-based storage"
        - "Implement resolve() with confidence-weighted matching"
      refactor:
        - "Ensure all public APIs have docstrings (CORE-012)"
        - "Verify type hints on all functions (CORE-011)"
        - "Check for duplicate patterns with existing strategies (CORE-035)"

    acceptance_criteria:
      - "StackBuilder ABC has 6 abstract methods matching architecture spec"
      - "StackBuilderRegistry.resolve() maps StackDetection → StackBuilder with confidence threshold"
      - "StackBuilderRegistry.get() returns None for unknown stack_id (no KeyError)"
      - "All data models are frozen dataclasses with full type hints"
      - "All tests passing — zero regression on smoke baseline"

  - id: "phase-70-b"
    title: "HtmlStackBuilder + html5.yaml Stack Knowledge"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-70-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-073"
    duration_estimate: "1 day"
    prerequisite: "phase-70-a complete (StackBuilder ABC available)"
    regression_gate: "python scripts/run_tests.py batch — zero new failures"

    new_files:
      - path: "cortex/orchestrators/strategies/builders/html_builder.py"
        description: "HtmlStackBuilder — semantic HTML5, WCAG 2.1 AA, BEM, zero inline styles"
      - path: "cortex-registry/knowledge/stacks/html5.yaml"
        description: "HTML5 stack knowledge — quality contract, TDD patterns, best practices"
      - path: "tests/orchestrators/strategies/builders/test_html_builder.py"
        description: "Tests for HTML builder quality contract enforcement"

    tdd_sequence:
      red:
        - "test_html_builder_stack_id — returns 'html5'"
        - "test_html_builder_supported_frameworks — ['vanilla', 'bootstrap', 'tailwind']"
        - "test_html_builder_test_patterns_red — DOM assertions, a11y tree, semantic coverage"
        - "test_html_builder_test_patterns_green — semantic elements, ARIA, BEM naming"
        - "test_html_builder_test_patterns_refactor — inline style extraction, dedup, responsive"
        - "test_html_builder_generate_scaffold_page — produces semantic HTML5 with header/main/footer"
        - "test_html_builder_generate_scaffold_component — produces BEM-classed component"
        - "test_html_builder_validate_output_passes — valid semantic HTML5 passes"
        - "test_html_builder_validate_output_fails_inline_styles — flags inline style attr"
        - "test_html_builder_validate_output_fails_missing_alt — flags img without alt"
        - "test_html_builder_validate_output_fails_no_landmarks — flags missing landmark elements"
        - "test_html_builder_best_practices_loads_yaml — loads from html5.yaml"
        - "test_html5_yaml_schema_valid — validates knowledge YAML schema"
      green:
        - "Implement HtmlStackBuilder with semantic HTML5 generation"
        - "Implement validate_output() with BeautifulSoup4 DOM inspection"
        - "Implement generate_scaffold() with Jinja2 templates for page/component"
        - "Create html5.yaml with quality_contract, tdd_patterns, best_practices"
      refactor:
        - "Extract shared validation logic if any overlap with existing frontend workflows"
        - "Ensure BEM naming validation is configurable"

    acceptance_criteria:
      - "HtmlStackBuilder registered in StackBuilderRegistry"
      - "generate_scaffold('page', ...) produces valid semantic HTML5 with landmarks"
      - "validate_output() catches: inline styles, missing alt, missing landmarks, non-BEM classes"
      - "html5.yaml loadable and schema-valid"
      - "All tests passing"

    html5_quality_contract:
      semantic_elements: [header, main, nav, section, article, aside, footer]
      accessibility:
        standard: "WCAG 2.1 AA"
        tooling: [axe-core, lighthouse]
        required_attributes: [alt, aria-label, role, lang]
      css:
        methodology: BEM
        zero_inline_styles: true
        external_stylesheets: true
      validation:
        w3c_validator: true
        lighthouse_score: 95
      tdd_patterns:
        red_assertions: [dom_structure, a11y_tree, semantic_coverage, no_inline_styles]
        green_rules:
          - "Use semantic HTML5 elements over generic divs"
          - "Every img has alt, every form input has label"
          - "BEM class naming: block__element--modifier"
          - "External CSS linked in <head>, never inline style"
        refactor_smells: [SMELL-13, SMELL-18, SMELL-21]
        refactor_workflows: [css-extraction.yaml, dom-deduplication.yaml]
      best_practices:
        performance: [lazy_loading, critical_css, preload_fonts]
        seo: [meta_description, open_graph, canonical_url, structured_data]
        security: [csp_header, sri_hashes, no_inline_scripts]

  - id: "phase-70-c"
    title: "PythonStackBuilder + python.yaml Stack Knowledge"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-70-04"]
    governance_authority: "CORE-008, CORE-011, CORE-012"
    duration_estimate: "1 day"
    prerequisite: "phase-70-a complete"
