          test_client: httpx.AsyncClient
          dependency_injection: Depends
          schema_validation: pydantic
        django:
          test_client: django.test.Client
          orm_patterns: [select_related, prefetch_related]
        flask:
          test_client: flask.testing.FlaskClient

