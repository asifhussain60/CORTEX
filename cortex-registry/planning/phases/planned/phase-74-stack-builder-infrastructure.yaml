id: "phase-74"
renumbers: "phase-70"
title: "Stack-Aware Builder Infrastructure — StackBuilder Protocol + Stack Knowledge Registry"
version: "1.1"
created: "2026-02-25"
updated: "2026-02-25"
status: PLANNED
priority: P0
governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-028   # File naming: snake_case only
  - CORE-035   # Single canonical implementation — no duplicates
  - CORE-064   # Sweep Completeness Contract — no partial sweeps
sweep_catalogue_id: "SWEEP-70-STACK-BUILDER"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: _workspaces/.chats/chat01.md — holistic architecture review session
  Score at entry: N/A (new capability, not remediation)
  Target: Stack-specialized TDD guidance, scaffolding, and validation

  PROBLEM STATEMENT:
  CORTEX has stack-agnostic TDD guidance — the TDDOrchestrator gives identical
  RED/GREEN/REFACTOR guidance regardless of whether the target is HTML5, Python,
  TypeScript, or .NET. The TechStackAnalyzer (LENS) detects 15 languages, 25 config
  files, and 18 import patterns but NOTHING CONSUMES the detection downstream to
  differentiate behavior. Knowledge YAMLs are organized by domain (testing-validation,
  backend-python, security) not by tech stack. The 6 existing HTML generation modules
  (dashboards, security reports) each reinvent ad-hoc f-string/Jinja2 patterns with
  no shared quality contract.

  ARCHITECTURAL FIT:
  - Follows existing RefactoringAdapter pattern (Rope/Roslyn/TypeScript adapters)
  - Extends existing StageExecutionStrategy + Knowledge YAML patterns
  - TechStackAnalyzer already produces StackDetection results at 0.0-1.0 confidence
  - WorkflowTemplate knowledge_context already supports architect_mode vs production_mode
  - OrchestratorProtocolMixin cross-cutting intelligence needs zero changes
  - 100% additive — no existing method signatures change

  DESIGN PILLARS ASSESSMENT:
  - Extensibility: 9/10 — New stacks = 1 YAML + 1 Builder class
  - Scalability: 9/10 — Registry pattern supports unlimited stacks, lazy-loaded
  - Accuracy: 9/10 — Stack detection at confidence thresholds, builder fires only above threshold
  - Collaboration: 8/10 — Each stack is self-contained, teams own their stack
  - Maintainability: 9/10 — Follows 3 existing patterns (Adapter ABC, Strategy dispatch, Knowledge YAML)
  - Regression Risk: 0 — All additions additive, default None fallbacks everywhere

  Baseline measurements:
    - Smoke tests: 1,420 passed
    - Golden tests: 204 passing
    - Existing stack builders: 0
    - Existing stack knowledge YAMLs: 0 (only domain-organized)
    - TechStackAnalyzer detections consumed: 0 (detection exists, dispatch missing)

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE — 3-Layer Stack Intelligence
# ─────────────────────────────────────────────────────────────────────────────
architecture:
  layer_1_existing:
    description: "Existing CORTEX infrastructure — unchanged"
    components:
      - name: TechStackAnalyzer
        path: "cortex/lens/analyzers/tech_stack_analyzer.py"
        role: "Detects 15 languages, 25 configs, 18 imports → StackDetection results"
        change: NONE
      - name: OrchestratorProtocolMixin
        path: "cortex/core/orchestrator_protocol_mixin.py"
        role: "Cross-cutting intelligence for all 27 orchestrators"
        change: NONE
      - name: RefactoringAdapter
        path: "cortex/orchestrators/domain/refactoring/adapters/adapter_base.py"
        role: "Language-specific refactoring (Rope/Roslyn/TS) — pattern to follow"
        change: NONE
      - name: WorkflowTemplate
        path: "cortex-registry/workflows/templates/"
        role: "knowledge_context with architect_mode/production_mode"
        change: ADDITIVE_KEY_ONLY

  layer_2_new_knowledge:
    description: "Stack Knowledge Registry — per-stack best practices in YAML"
    location: "cortex-registry/knowledge/stacks/"
    schema:
      root_keys: [stack, quality_contract, tdd_patterns, best_practices]
      stack_fields: [id, display_name, category, version]
      quality_contract_fields: [semantic_elements, accessibility, css, validation]
      tdd_patterns_fields: [red, green, refactor]
      best_practices_fields: [performance, seo, security]
    files_to_create:
      - "cortex-registry/knowledge/stacks/html5.yaml"
      - "cortex-registry/knowledge/stacks/python.yaml"
      - "cortex-registry/knowledge/stacks/typescript.yaml"
      - "cortex-registry/knowledge/stacks/dotnet.yaml"

  layer_3_new_builders:
    description: "Stack Builders — concrete implementations per tech stack"
    location: "cortex/orchestrators/strategies/builders/"
    base_class: "cortex/orchestrators/strategies/stack_builder.py"
    registry: "cortex/orchestrators/strategies/stack_builder_registry.py"
    abstract_methods:
      - name: get_stack_id
        signature: "def get_stack_id(self) -> str"
        purpose: "Returns stack identifier matching knowledge YAML id"
      - name: get_supported_frameworks
        signature: "def get_supported_frameworks(self) -> List[str]"
        purpose: "Returns list of supported frameworks (e.g. react, vue, angular)"
      - name: get_test_patterns
        signature: "def get_test_patterns(self, phase: TDDPhase) -> StackTestGuidance"
        purpose: "Returns stack-specific TDD patterns for RED/GREEN/REFACTOR phases"
      - name: get_best_practices
        signature: "def get_best_practices(self) -> StackBestPractices"
        purpose: "Loads best practices from cortex-registry/knowledge/stacks/{stack}.yaml"
      - name: generate_scaffold
        signature: "def generate_scaffold(self, artifact_type: str, context: Dict) -> str"
        purpose: "Generates stack-aware file scaffolding (component, page, endpoint, etc.)"
      - name: validate_output
        signature: "def validate_output(self, content: str) -> StackValidationResult"
        purpose: "Validates generated content against stack quality contract"
    concrete_builders:
      - class: HtmlStackBuilder
        file: "cortex/orchestrators/strategies/builders/html_builder.py"
        stack_id: "html5"
        frameworks: ["vanilla", "bootstrap", "tailwind"]
        quality_contract: "semantic HTML5, WCAG 2.1 AA, BEM, zero inline styles"
      - class: PythonStackBuilder
        file: "cortex/orchestrators/strategies/builders/python_builder.py"
        stack_id: "python"
        frameworks: ["fastapi", "django", "flask"]
        quality_contract: "type hints, pytest fixtures, import hygiene"
      - class: TypeScriptStackBuilder
        file: "cortex/orchestrators/strategies/builders/typescript_builder.py"
        stack_id: "typescript"
        frameworks: ["react", "vue", "angular", "nextjs"]
        quality_contract: "strict mode, no any types, vitest/jest patterns"
      - class: DotNetStackBuilder
        file: "cortex/orchestrators/strategies/builders/dotnet_builder.py"
        stack_id: "dotnet"
        frameworks: ["aspnet", "blazor", "maui"]
        quality_contract: "xUnit traits, EF Core patterns, Roslyn analyzers"

  orchestrator_integration:
    description: "How stack builders wire into existing orchestrators — zero breaking changes"
    integrations:
      - orchestrator: TDDOrchestrator
        file: "cortex/orchestrators/core/tdd_orchestrator.py"
        current: "determine_phase() → generic guidance"
        enhanced: "determine_phase() → StackBuilderRegistry.get(stack_id).get_test_patterns() → stack-specific RED/GREEN/REFACTOR"
        mechanism: "Add stack_context parameter to build_guidance() — additive, default None"
        risk: NONE
      - orchestrator: RefactoringOrchestrator
        file: "cortex/orchestrators/domain/refactoring_orchestrator.py"
        current: "RefactoringAdapter per language"
        enhanced: "Adapter delegates to StackBuilder.get_best_practices() for refactoring suggestions"
        mechanism: "Optional delegation — adapter checks registry before executing"
        risk: NONE
      - orchestrator: DomainOrchestrator
        file: "cortex/orchestrators/domain/domain_orchestrator.py"
        current: "DomainHandler.execute() generic"
        enhanced: "Handler queries StackBuilder.generate_scaffold() for stack-aware scaffolding"
        mechanism: "Optional query — handler uses scaffold if builder available"
        risk: NONE
      - orchestrator: LENSOrchestrator
        file: "cortex/lens/lens_orchestrator.py"
        current: "TechStackAnalyzer detects but doesn't dispatch"
        enhanced: "Detection result feeds StackBuilderRegistry.resolve(detections) — automatic"
        mechanism: "Consumer addition — no producer change"
        risk: NONE

  mcp_exposure:
    tool_name: "cortex_stack"
    file: "cortex/mcp/tools/cortex_stack.py"
    category: OPERATIONS
    operations:
      - name: list
        description: "Show all registered stack builders with capabilities"
      - name: guidance
        description: "Get stack-specific TDD guidance for a detected or specified stack"
      - name: scaffold
        description: "Generate stack-aware file scaffold (component, page, endpoint)"
      - name: validate
        description: "Run stack quality contract against output content"
    follows_pattern: "ConsolidatedTool base class from cortex/mcp/mcp_tool_base.py"

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — all must be CLOSED before phase COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-70-01"
    title: "StackBuilder ABC + data models missing"
    severity: P0
    source: "chat01.md holistic review — no stack-specific builder abstraction exists"
    evidence: |
      cortex/orchestrators/strategies/ has StageExecutionStrategy (pipeline stages)
      and ExecutionStrategy (planning) but NO StackBuilder protocol. TDDOrchestrator
      uses ad-hoc conditionals for language switching in determine_phase(). The
      RefactoringAdapter pattern exists but is isolated to refactoring domain.
    action_ref: "phase-70-a"
    status: OPEN

  - id: "GAP-70-02"
    title: "StackBuilderRegistry discovery and dispatch missing"
    severity: P0
    source: "chat01.md — TechStackAnalyzer detects but nothing dispatches"
    evidence: |
      TechStackAnalyzer produces StackDetection results with confidence 0.0-1.0
      for 15 languages. No registry exists to resolve StackDetection → StackBuilder.
      The module_level TDD_KNOWLEDGE_LOADER is a singleton factory but not extensible.
    action_ref: "phase-70-a"
    status: OPEN

  - id: "GAP-70-03"
    title: "HtmlStackBuilder + html5.yaml quality contract missing"
    severity: P0
    source: "chat01.md — primary user ask: HTML builder for high-quality pages"
    evidence: |
      6 HTML generation modules exist (dashboards, security, onboarding) — all use
      ad-hoc f-string or Jinja2. No shared semantic HTML5 quality contract. No a11y
      validation. No BEM enforcement. No W3C validation integration. Frontend workflow
      templates reference CORE-073 (zero inline styles) but no builder enforces it.
    action_ref: "phase-70-b"
    status: OPEN

  - id: "GAP-70-04"
    title: "PythonStackBuilder + python.yaml knowledge missing"
    severity: P1
    source: "chat01.md — extend pattern to Python stack"
    evidence: |
      backend-python/clean-code.yaml exists but is domain-organized (best practices),
      not stack-organized (test patterns, scaffolding, quality contracts). TDDOrchestrator
      loads tdd-best-practices.yaml for discipline rules but these are stack-agnostic.
      No pytest-specific fixture patterns, type narrowing guidance, or import hygiene.
    action_ref: "phase-70-c"
    status: OPEN

  - id: "GAP-70-05"
    title: "TDDOrchestrator not wired to stack builders"
    severity: P0
    source: "chat01.md — determine_phase() is stack-unaware"
    evidence: |
      TDDOrchestrator.build_guidance() assembles TDDGuidance from TDDKnowledgeLoader
      which loads 4 generic YAMLs. No stack_context parameter exists. determine_phase()
      does keyword matching ("test"→RED, else→GREEN). No StackBuilder dispatch.
      Integration is additive: add stack_context: Optional[StackContext] = None.
    action_ref: "phase-70-d"
    status: OPEN

  - id: "GAP-70-06"
    title: "cortex_stack MCP tool missing"
    severity: P1
    source: "chat01.md — MCP-first exposure for stack intelligence"
    evidence: |
      38 MCP tools exist but none provide stack-specific operations. cortex_scaffold_files
      generates file stubs but is stack-agnostic. cortex_lens does stack detection but
      doesn't expose stack-specific guidance through MCP. CORE-050 requires MCP-first
      exposure for IMPLEMENT/FIX/REFACTOR operations.
    action_ref: "phase-70-e"
    status: OPEN

  - id: "GAP-70-07"
    title: "TypeScript + .NET builders + workflow template integration missing"
    severity: P1
    source: "chat01.md — complete stack coverage for RefactoringAdapter parity"
    evidence: |
      RefactoringAdapter already has TypeScript and C# adapters but no StackBuilder
      equivalents. Workflow templates (tdd-feature-implementation.yaml, frontend-tdd-workflow.yaml)
      have knowledge_context but no stack_builder field. typescript-refactor-workflow.yaml
      exists in frontend/ but uses no builder pattern.
    action_ref: "phase-70-f"
    status: OPEN

  - id: "GAP-70-08"
    title: "Stack Knowledge YAML index not wired into knowledge INDEX.yaml"
    severity: P2
    source: "chat01.md — knowledge registry coherence"
    evidence: |
      cortex-registry/knowledge/INDEX.yaml indexes 30 YAMLs across 11 domains. New
      stacks/ directory needs index entries with applicable_intents, search keywords,
      and domain mapping for each stack YAML.
    action_ref: "phase-70-f"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SUB-PHASES — ROI-ordered, TDD-gated
