    deliverables:
      - |
        RENAME: .github/prompts/cortex-architect.prompt.md
             → .github/agents/core/cortex-architect-internal.md

        Content reduction: Strip the full mode detail (already absorbed into unified prompt).
        Retain ONLY the supplemental detail that is LAZILY LOADED for specific intents:
          - DESIGN MODE detail (challenge-first approach, design pillars)
          - INVESTIGATE MODE sequence (scope→evidence→hypothesize→verify→report)
          - RCA MODE detail (4 methodologies, cortex_learning tool)
          - WORKFLOW COMPOSE MODE (convergence mode, toolchain table)
          - Extended PLAN MODE: Sequential Execution Contract schema, sub-phase template

        File header comment: "INTERNAL AGENT — not user-attachable. Loaded by unified
        CORTEX.prompt.md for DESIGN/INVESTIGATE/RCA/WORKFLOW_COMPOSE intents."

    tdd_cycle:
      red:
        action: "Write test_architect_prompt_retired.py — tests FAIL (file still at old path)"
        gate: "python3 scripts/run_tests.py file tests/preflight/test_architect_prompt_retired.py — ALL FAIL"
        blocker: "Do NOT move file until RED gate confirmed"
      green:
        action: |
          1. git mv .github/prompts/cortex-architect.prompt.md .github/agents/core/cortex-architect-internal.md
          2. Trim content to supplemental-only (remove sections now in unified prompt)
          3. Add internal agent header comment
        gate: "python3 scripts/run_tests.py file tests/preflight/test_architect_prompt_retired.py — ALL PASS"
        blocker: "Do NOT proceed to REFACTOR until all tests pass"
      refactor:
        action: "Verify no broken references to old path in any file under .github/"
        gate: |
          grep -rn "cortex-architect.prompt.md" .github/ cortex-registry/ --include="*.md" --include="*.yaml"
          Must return 0 matches (all references updated in sub-phases 129-c and 129-d).
        blocker: "Do NOT mark 129-b COMPLETE until grep returns 0"

    tdd_sequence:
      red:
        - "test_old_architect_prompt_path_gone"
        - "test_internal_agent_exists_at_new_path"
        - "test_internal_agent_has_header_comment"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/preflight/test_architect_prompt_retired.py"
      min_tests_pass: 3
      zero_new_failures: true
      all_gap_refs_closed: false
      blocks_next_sub_phase: true

