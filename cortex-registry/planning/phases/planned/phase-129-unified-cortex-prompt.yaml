# ─────────────────────────────────────────────────────────────────────────────
# RISK REGISTER
# ─────────────────────────────────────────────────────────────────────────────
risks:
  - id: "RISK-129-01"
    title: "Token budget creep — unified prompt exceeds 4,000 tokens"
    probability: MEDIUM
    impact: LOW
    mitigation: |
      Strict token budget gate: unified prompt MUST be ≤4,000 tokens.
      Compress via: remove inline examples (leave in agents), remove redundant
      cross-references, ensure mode detail stays in specialist agents (not unified prompt).
      If >4,000 tokens after REFACTOR: extract EXECUTION MODES detail to
      cortex-architect-internal.md and replace with a mode routing table only.

  - id: "RISK-129-02"
    title: "Check #14 meta-audit breaks during transition (129-a complete, 129-d pending)"
    probability: HIGH
    impact: MEDIUM
    mitigation: |
      Run /audit fix AFTER phase-129-d (all checks updated) — not between sub-phases.
      If Check #14 fires during transition: suppress with explicit override noting
      "Phase 129 in progress — Check #14 transitional state expected".
      Do NOT create a partial fix that satisfies old logic (would need reverting).

  - id: "RISK-129-03"
    title: "Repo-context detection false positive on non-CORTEX repos with similar structure"
    probability: LOW
    impact: LOW
    mitigation: |
      Use 3-signal AND gate (not OR) for primary detection:
        ALL of: cortex-master.yaml + cortex/orchestrators/ + cortex-registry/ must be present.
      Likelihood of false positive with all 3: negligible (CORTEX-specific directory names).
      Add negative signal: if workspace has no Python files under cortex/ → Standard Mode.
