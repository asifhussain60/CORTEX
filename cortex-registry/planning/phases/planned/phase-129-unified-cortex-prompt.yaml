        gate: "python3 scripts/run_tests.py file tests/preflight/test_copilot_instructions_updated.py — ALL PASS"
        blocker: "Do NOT proceed to REFACTOR until all tests pass"
      refactor:
        action: "Verify copilot-instructions.md has no remaining references to cortex-architect.prompt.md"
        gate: |
          grep -n "cortex-architect.prompt.md" .github/copilot-instructions.md — must return 0 lines
