    file: cortex/toolkit/batch/batch_processor.py
    expected_result: "Tests pass (size + timeout + adapters)"

  - step: 6
    phase: REFACTOR
    action: "Deprecate old batch implementations, add migration warnings"
    files:
      - tests/unit/phase4/test_brt027_performance_optimization.py
      - cortex/core/knowledge/bulk_ingestion.py
    expected_result: "Tests pass, deprecation warnings emitted"

  - step: 7
    phase: RED
    action: "Write failing test for FilenameIntelligence"
    file: tests/unit/toolkit/filesystem/test_filename_intelligence.py
    expected_result: "Tests fail (no generic extractor)"

  - step: 8
    phase: GREEN
    action: "Extract FilenameAnalyzer patterns into YAML-driven toolkit component"
