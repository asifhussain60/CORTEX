# ============================================================================
# OVERVIEW
# ============================================================================

description: |
  Extract generic file-based intelligence patterns from domain-specific
  implementations (media tooling) into reusable CORTEX Toolkit components.
  Consolidates 4 duplicate batch processing implementations (CORE-035).

motivation: |
  Project-specific tooling revealed 5 universal patterns:
    1. Hierarchical file scanning with organization detection
    2. Batch processing with adapters/filters/transformers
    3. Content sanitization with transactional safety
    4. Metadata enrichment from external + local sources
    5. Multi-step workflow orchestration

  These patterns should be generic toolkit components, not locked to one domain.

