critical_issues:
  - id: CRIT-001
    title: "IntentRouter aliased to WorkflowComplexityRouter — catastrophic identity collapse"
    severity: P0-BLOCKER
    file: "cortex/orchestrators/core/intent_router/__init__.py"
    description: |
      Line 26: `IntentRouter = WorkflowComplexityRouter` makes every import of
      IntentRouter resolve to the wrong class. The real 2400-line IntentRouter
      in intent_router.py is completely shadowed. This breaks:
      - All 14 execution modes (IMPLEMENT, FIX, AUDIT, etc.)
      - Golden test test_intent_router_differentiation (5 failures)
      - Architecture convergence tests (3 failures)
      - The entire intent routing pipeline
    fix: "Remove the alias. Export the real IntentRouter from the parent module."

  - id: CRIT-002
    title: "OPJ Writer path miscalculation — parents[4] resolves to /PROJECTS not /CORTEX"
    severity: P0-BLOCKER
    file: "cortex/intelligence/learning/opj_writer.py"
    description: |
      Line 26: `_WORKSPACE_ROOT = Path(__file__).resolve().parents[4]` resolves to
      /Users/asifhussain/PROJECTS instead of /Users/asifhussain/PROJECTS/CORTEX.
      parents[3] is the correct index. This causes OPJ to write to wrong directory
      and the _registry.yaml path is /PROJECTS/cortex-registry/ (non-existent).
    fix: "Change parents[4] to parents[3]."

  - id: CRIT-003
    title: "OPJ YAML serialization timeout — non-serializable context objects"
    severity: P0-BLOCKER
    file: "cortex/orchestrators/core/enforcement_orchestrator.py"
    description: |
      Line 1469: `context={"intent": intent, ...}` passes the entire intent object
      (which may contain non-YAML-serializable objects) to OPJWriter.record_success().
      The yaml.safe_dump() at opj_writer.py:244 enters infinite recursion on complex
      nested objects, causing test timeout. Same pattern likely in other orchestrators.
    fix: "Sanitize context dict before passing to OPJ — only pass primitive types."

  - id: CRIT-004
    title: "Intelligence Matrix at 6.9% coverage — 7 P0-CRITICAL cells unwired"
    severity: P0-CRITICAL
    file: "cortex/intelligence/cross_cutting/intelligence_matrix_builder.py"
    description: |
      The intelligence matrix has 29 scored cells but only 2 wired (6.9%).
      7 P0-CRITICAL intersections are unwired:
        IC-001 × CC-001: LENS ↔ HierarchicalScanner
        IC-004 × CC-008: BrainTier-T1 ↔ MCP
        IC-007 × CC-001: IntelligenceOrch ↔ HierarchicalScanner
        IC-008 × CC-008: ResponseTemplate ↔ MCP
        IC-010 × CC-004: KnowledgeIndexer ↔ DocGen
        IC-012 × CC-004: KnowledgeIndexerBridge ↔ DocGen
        IC-014 × CC-008: CortexBrainQuery ↔ MCP
    fix: "Wire all 7 P0-CRITICAL cells with functional integration code."

  - id: CRIT-005
    title: "Missing intelligence matrix dimensions — 5 cross-cutting layers not in matrix"
    severity: P1-HIGH
    file: "cortex/intelligence/cross_cutting/intelligence_matrix_builder.py"
    description: |
      The current matrix has 15×15 but is missing critical cross-cutting dimensions:
        - Company Knowledge (cortex-registry/company/ repos, domain context)
        - Infrastructure Observability (Prometheus, OpenTelemetry, health checks)
        - Governance Rule Enforcement (35 CORE rules live validation)
        - Memory Tier Cross-Pollination (T1↔T2↔T3 knowledge migration)
        - Audit/Fix Pipeline Intelligence (19-point scan → intelligence feedback)
    fix: "Extend both axes with IC-016..IC-020 and CC-016..CC-020."

