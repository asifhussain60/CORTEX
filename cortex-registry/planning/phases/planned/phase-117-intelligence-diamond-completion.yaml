# ─────────────────────────────────────────────────────────────────────────────
# GOLDEN TEST CONTRACT (P0 — every sub-phase)
# ─────────────────────────────────────────────────────────────────────────────
# ALL completion confirmation MUST come from SQLite audit trace queries,
# not from Python assert-only checks.
# Golden tests: tests/golden/intelligence/test_diamond_golden.py
# Pattern: record AC_START/AC_COMPLETE to .cortex-runtime/traces/orchestrator-traces.db
# Verify: SELECT from orchestrator_traces WHERE domain='INTELLIGENCE_DIAMOND'
golden_test_contract:
  location: "tests/golden/intelligence/test_diamond_golden.py"
  sunshine_tests:
    - "test_facade_analyze_returns_real_lens_data_for_existing_file"
    - "test_facade_synthesize_returns_populated_best_practices"
    - "test_facade_query_with_domain_filter_returns_results"
    - "test_targeted_tier_propagates_lens_to_synthesis"
    - "test_full_tier_includes_company_and_lens_data"
    - "test_singleton_facade_returns_same_instance"
    - "test_workflow_gateway_context_includes_facade"
    - "test_diamond_operations_emit_ac_markers_to_sqlite"
    - "test_get_domain_knowledge_returns_real_rules_not_placeholder"
    - "test_orchestrator_context_injector_returns_real_metadata"
  rainy_day_tests:
    - "test_facade_analyze_graceful_on_nonexistent_file"
    - "test_facade_synthesize_degrades_when_yaml_index_missing"
    - "test_facade_query_returns_empty_for_unknown_domain"
    - "test_targeted_tier_degrades_when_lens_unavailable"
    - "test_full_tier_degrades_when_company_loader_fails"
    - "test_singleton_survives_concurrent_access"
    - "test_ac_complete_includes_error_on_failure"
    - "test_provider_key_mismatch_detected_not_silent"
  sqlite_verification:
    database: ".cortex-runtime/traces/orchestrator-traces.db"
    table: "orchestrator_traces"
    required_columns: ["domain", "operation", "status", "timestamp_ms", "ac_marker"]
    verification_pattern: |
      import sqlite3
      db = sqlite3.connect('.cortex-runtime/traces/orchestrator-traces.db')
      rows = db.execute(
          "SELECT operation, status FROM orchestrator_traces "
          "WHERE domain='INTELLIGENCE_DIAMOND' ORDER BY timestamp_ms"
      ).fetchall()
      assert len(rows) > 0, "No audit traces for INTELLIGENCE_DIAMOND"
      # Verify paired AC_START/AC_COMPLETE
      starts = [r for r in rows if r[1] == 'AC_START']
      completes = [r for r in rows if r[1] == 'AC_COMPLETE']
      assert len(starts) == len(completes), "Orphaned AC markers"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
