background: |
  Source: Holistic Intelligence Diamond review, 2026-03-03 (CORTEX Architect).
  Phase 109 wired IntelligenceFacade into 8 orchestrators (synthesize() calls)
  and marked 18/20 GAPs CLOSED. However, live runtime verification reveals
  the diamond architecture is NOT functioning as designed:

  ┌───────────────────────────────────────────────────────────────────────────┐
  │  INTELLIGENCE DIAMOND — DESIGNED vs ACTUAL                               │
  │                                                                          │
  │  DESIGNED:     IntelligenceFacade                                        │
  │                   ┌──────┼──────┐                                        │
  │                analyze  synthesize  query    ← 3 unified entry points    │
  │                   │        │        │                                     │
  │                LENS    Knowledge  Registry                               │
  │                                                                          │
  │  ACTUAL:                                                                 │
  │   - analyze() → provider.analyze() → DOES NOT EXIST → empty dict {}     │
  │   - synthesize() → provider.synthesize() → WORKS (partial — broken bp)  │
  │   - query() → registry.all() → WORKS (53 entries)                        │
  │   - query(domain=X) → registry.query(domain=X) → RETURNS 0 (broken)     │
  │   - MasterOrchestrator._get_intelligence_context() → DEAD CODE           │
  │     (defined, never called from production)                              │
  │   - 7 orchestrators create new IntelligenceFacade() per call (no reuse)  │
  │   - WorkflowGateway: no facade in execution context (GAP-109-10 open)   │
  │   - TDD: uses separate TDDKnowledgeLoader, NOT facade                   │
  └───────────────────────────────────────────────────────────────────────────┘

  CRITICAL BUG: load_cortex_best_practices() signature mismatch.
    engine.py:131 calls: load_cortex_best_practices(intent_type)
    loaders.py:200 sig:  load_cortex_best_practices(intent_type, cache, ...)
    Missing 'cache' arg → TypeError → swallowed by except Exception → empty results.
    This means EVERY synthesize() call returns empty cortex_knowledge/best_practices.

  Score at entry: 4/10 (analyze broken, synthesize partially broken, no reuse, dead paths)
  Target score: 9/10 (all 3 methods work, singleton facade, LENS integration, clean diamond)

  Baseline measurements:
    - IntelligenceFacade.analyze() → empty dict (provider has no analyze())
    - IntelligenceFacade.synthesize() → TypeError swallowed (best_practices empty)
    - IntelligenceFacade.query(domain=X) → 0 results (filter broken)
    - Facade instantiations per request: up to 8 (new instance each time)
    - _get_intelligence_context: defined at line 73, never called
    - intelligence/ subdirectories: 25 (target: ≤6)
    - intelligence/ top-level .py files: 26 (target: ≤5)
    - cortex/lens/ files: 82 (lens_orchestrator.py monolith: 2,045L still alive)
    - memory/ subsystem: 65 files, 16K+ lines
    - WorkflowGateway facade injection: absent (GAP-109-10 was DEFERRED)
    - Smoke: 2,194 passed

