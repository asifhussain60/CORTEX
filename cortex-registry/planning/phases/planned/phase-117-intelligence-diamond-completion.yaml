    depends_on: []
    prerequisite: "smoke tests green (≥2,194 baseline)"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/intelligence/test_diamond_delegation.py (unit tests):
          - test_facade_analyze_returns_nonempty_for_real_file
          - test_facade_synthesize_returns_nonempty_best_practices
