sweep_catalogue:

  # ── Sub-Phase A: Fix broken delegation chains (P0 CRITICAL) ────────────────

  - id: "GAP-117-01"
    title: "facade.analyze() returns empty dict — provider has no analyze() method"
    severity: P0
    source: "Live runtime test: IntelligenceFacade().analyze() → empty dict fallback"
    evidence: |
      python3 -c "
        from cortex.intelligence.facade import IntelligenceFacade
        f = IntelligenceFacade()
        p = f._get_provider()
        print(hasattr(p, 'analyze'))  # False
        result = f.analyze(file_path='cortex/core/engine.py', intent='REFACTOR')
        print(result)  # {'status': 'ok', ..., 'analysis': {}}
      "
      UnifiedIntelligenceProvider has get_lens_analysis(), not analyze().
      Facade should either:
        (a) delegate to provider.get_lens_analysis() in analyze(), OR
        (b) lazy-load LENSOrchestrator directly for analyze() calls
    action_ref: "phase-117-a"
    status: OPEN
    acceptance_criteria: |
      - facade.analyze(file_path=X) returns non-empty analysis for a real file
      - Analysis includes AST data, git history, or LENS-equivalent output
      - Null-object fallback only fires when LENS is genuinely unavailable
      - smoke green

  - id: "GAP-117-02"
    title: "load_cortex_best_practices() signature mismatch — TypeError swallowed silently"
    severity: P0
    source: "Runtime log: 'Intelligence synthesis failed: load_cortex_best_practices() missing 1 required positional argument: cache'"
    evidence: |
      engine.py:131: practices = load_cortex_best_practices(intent_type)
      loaders.py:200: def load_cortex_best_practices(intent_type, cache, index_path_override=""):
      Missing 'cache' argument. TypeError caught by engine's except block.
      Result: EVERY synthesize() call gets empty cortex_knowledge and best_practices.
      This affects ALL 7 orchestrators that call facade.synthesize().
    action_ref: "phase-117-a"
    status: OPEN
    acceptance_criteria: |
      - engine._load_cortex_best_practices() passes self._cortex_knowledge_cache to loader
      - OR loader signature updated to make cache optional with default=None
      - synthesize() returns non-empty cortex_knowledge with real best practices
      - All 7 orchestrator synthesize calls return actionable knowledge
      - smoke green

  - id: "GAP-117-03"
    title: "facade.query(domain=X) returns 0 results — domain filter path broken"
    severity: P1
    source: "Live runtime test: query(domain='governance') → count: 0; query() without domain → count: 53"
    evidence: |
      python3 -c "
        from cortex.intelligence.facade import IntelligenceFacade
        f = IntelligenceFacade()
        print(f.query(query='governance'))  # count: 53
        print(f.query(query='governance', domain='governance'))  # count: 0
      "
      Facade.query() dispatches to registry.query(domain=X) when domain provided,
      but registry.all() when domain is None. The filtered path returns empty.
    action_ref: "phase-117-a"
    status: OPEN
    acceptance_criteria: |
      - facade.query(domain='governance') returns governance rules (count > 0)
      - facade.query() still returns all 53 entries
      - Golden: test_facade_query_with_domain_filter_returns_results (sunshine)
      - Golden: test_facade_query_returns_empty_for_unknown_domain (rainy-day)
      - SQLite: AC_COMPLETE for INTELLIGENCE_DIAMOND:query logged
      - smoke green

  - id: "GAP-117-03a"
    title: "provider.targeted()/full() LENS key mismatch — git_history vs git_analysis"
    severity: P0
    source: "Live runtime test: targeted tier returns empty LENS despite get_lens_analysis() working"
    evidence: |
      provider.targeted() line 478: lens_data.get('git_history', {})
      provider.full() line 525:     lens_data.get('git_history', {})
      But LENSOrchestrator.analyze_file() returns: 'git_analysis' (NOT 'git_history')
      Same for 'comments' vs 'comment_analysis'.

      LENS keys returned:  git_analysis, ast_analysis, comment_analysis
      Provider expects:    git_history,  ast_analysis, comments

      Result: LENSIntelligence always has empty git_analysis={} and comment_analysis={}
      even when real LENS data is available.
    action_ref: "phase-117-a"
    status: OPEN
    acceptance_criteria: |
      - provider.targeted() maps LENS keys correctly: git_analysis→git_analysis, comment_analysis→comment_analysis
      - provider.full() same fix
      - targeted('IMPLEMENT', 'cortex/__init__.py').lens_intelligence.git_analysis is non-empty
