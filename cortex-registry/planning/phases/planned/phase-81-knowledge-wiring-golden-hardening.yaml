# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: rag.md digest (2026-02-26) — user requested RAG evaluation + golden test audit.

  Two problems identified and verified against live codebase:

  PROBLEM 1 — cortex_knowledge MCP tool returns empty stubs:
    cortex/mcp/tools/intelligence.py lines 491 and 277 return hardcoded empty lists.
    Meanwhile, KnowledgeRegistryProxy (cortex/knowledge/registry_proxy.py, 248 lines)
    already loads, caches, and queries 30 YAML knowledge files across 11 domains.
    The MCP tool is simply not wired to the proxy.
    Impact: cortex_knowledge(op="search", query="tdd") returns {"results": [], "total": 0}.
    Fix: Wire the existing MCP tool to the existing proxy. Zero new files. Zero new deps.

  PROBLEM 2 — Golden tests have structural weaknesses:
    a) 12 xfail markers in test_audit_trail_verification.py — entire audit DB wiring
       class is soft-failing (GAP from Phase 64, still open).
    b) AC marker completeness uses 50% threshold (line 78 of test_ac_marker_completeness.py)
       — governance signal diluted.
    c) Golden conftest.py creates tmp in-memory SQLite DBs — never connects to
       .cortex-runtime/traces/orchestrator-traces.db for live handoff verification.
    d) Total xfail across golden suite: 28 instances in 74 test files.
    Fix: Add live_trace_db fixture, harden threshold, reduce xfail count.

  rag.md FACTUAL INACCURACIES (corrected — do NOT propagate):
    CLAIM: "91 golden test files" → ACTUAL: 74 golden test files (excl __init__, conftest)
    CLAIM: "87% are static source-file regex scans" → ACTUAL: 55% (41/74) do source scanning
    CLAIM: "KnowledgeSynthesisEngine.synthesise() is a STUB" → ACTUAL: Two files exist:
      - cortex/intelligence/knowledge_synthesis_engine.py: 18 lines (TRUE stub — returns empty)
      - cortex/intelligence/knowledge/knowledge_synthesis_engine.py: 1362 lines (REAL impl)
      The stub at the top level is a leftover that should be deleted (CORE-035 violation).
    CLAIM: "9+ xfail marks in test_audit_trail_verification.py" → ACTUAL: 12 xfail marks
    CLAIM: "Build a SemanticIndexOrchestrator" → REJECTED: Over-engineers. Wire existing
      cortex_knowledge MCP tool to existing KnowledgeRegistryProxy instead. Zero new
      orchestrators, zero new MCP tools, zero new dependencies.

  Baseline measurements:
    - Smoke tests: 1,211 passed
    - Golden test files: 74
    - xfail count in golden suite: 28
    - cortex_knowledge search results: 0 (stub)
    - KnowledgeRegistryProxy entry count: 30 YAMLs / 11 domains
    - cortex-master.yaml: 495 lines (THIN INDEX CONTRACT compliant)

  Relationship to Phase 80:
    Phase 80 GAP-80-07 consolidates the 5 backend knowledge entry points.
    Phase 81 is complementary — it wires the MCP surface (cortex_knowledge tool)
    to the existing KnowledgeRegistryProxy and hardens golden tests.
    No overlap: 80 = backend consolidation, 81 = MCP wiring + test hardening.

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — all must be CLOSED before phase is COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-81-01"
    title: "cortex_knowledge search operation returns hardcoded empty list"
    severity: P1
    source: "rag.md digest 2026-02-26"
    evidence: |
      cortex/mcp/tools/intelligence.py line 491:
        return ToolResult(success=True, data={"query": query, "results": [], "total": 0, ...})
      KnowledgeRegistryProxy.query(key_contains=) already does substring matching
      over 30 cached YAML files but is never called by the MCP tool.
    action_ref: "phase-81-a"
    status: OPEN

  - id: "GAP-81-02"
    title: "cortex_knowledge domain operation returns hardcoded empty list"
    severity: P1
    source: "rag.md digest 2026-02-26"
    evidence: |
      cortex/mcp/tools/intelligence.py line 499:
        return ToolResult(success=True, data={"domain": domain or query, "knowledge_items": [], ...})
      KnowledgeRegistryProxy.query(domain=) returns filtered entries but is never called.
    action_ref: "phase-81-a"
    status: OPEN

  - id: "GAP-81-03"
    title: "cortex_knowledge gaps operation returns hardcoded 0.85 coverage"
    severity: P2
    source: "rag.md digest 2026-02-26"
    evidence: |
      cortex/mcp/tools/intelligence.py line 519:
        return ToolResult(success=True, data={"coverage_score": 0.85, "gaps": [], ...})
      Real coverage can be computed from KnowledgeRegistryProxy.domains() vs expected list.
    action_ref: "phase-81-a"
    status: OPEN

  - id: "GAP-81-04"
    title: "Top-level knowledge_synthesis_engine.py is a CORE-035 duplicate stub"
    severity: P1
    source: "rag.md digest verification 2026-02-26"
    evidence: |
      cortex/intelligence/knowledge_synthesis_engine.py: 18 lines — stub returning empty
      cortex/intelligence/knowledge/knowledge_synthesis_engine.py: 1362 lines — real impl
      Two files with same class name KnowledgeSynthesisEngine. CORE-035 violation.
    action_ref: "phase-81-a"
    status: OPEN

  - id: "GAP-81-05"
    title: "Golden test AC marker completeness uses 50% threshold — too soft"
    severity: P1
    source: "rag.md digest 2026-02-26"
    evidence: |
      tests/golden/audit_trail/test_ac_marker_completeness.py line 78:
        f"have AC_START markers ({ratio:.0%} < 50% threshold). "
      50% means half of all orchestrators can lack AC markers and tests still pass.
      Should ratchet to current actual ratio (floor, not ceiling).
    action_ref: "phase-81-b"
    status: OPEN

  - id: "GAP-81-06"
    title: "12 xfail tests in test_audit_trail_verification.py mask audit DB wiring gap"
    severity: P1
    source: "rag.md digest 2026-02-26"
    evidence: |
      grep -c "xfail" tests/golden/audit_trail/test_audit_trail_verification.py → 12
      These tests assert that OrchestratorProtocolMixin.execute_operation() writes to
      the audit DB singleton — but the wiring is incomplete, so they're all xfailed.
      Total xfail across golden suite: 28 in 74 files.
    action_ref: "phase-81-b"
    status: OPEN

  - id: "GAP-81-07"
    title: "Golden conftest creates tmp DBs — never validates against live trace DB"
    severity: P2
    source: "rag.md digest 2026-02-26"
    evidence: |
      tests/golden/conftest.py creates tempfile SQLite with custom schema.
      No fixture provides access to .cortex-runtime/traces/orchestrator-traces.db.
      Golden tests cannot verify that real orchestrator handoffs land in the live DB.
      test_holistic_integration_simple.py line 37 explicitly calls this out as GAP-64-08.
    action_ref: "phase-81-b"
    status: OPEN

  - id: "GAP-81-08"
    title: "No GoldenScenario factory — each golden test bootstraps its own DB, fixtures, stubs"
    severity: P1
    source: "rag.md digest 2026-02-26 — golden test creation efficiency"
    evidence: |
      74 golden test files each define their own fixtures, DB setup, and assertion helpers.
      AC marker checks duplicated across 6+ files. Every new orchestrator requires manual
      entry in WIRED_ORCHESTRATOR_FILES. No shared dataclass for scenario definition.
      A GoldenScenario factory would let tests use @pytest.mark.parametrize against a
      shared scenario registry, cutting creation cost by ~60%.
    action_ref: "phase-81-b"
    status: OPEN

