  - id: "phase-81-a"
    title: "Wire cortex_knowledge MCP Tool to KnowledgeRegistryProxy + Delete Stub Duplicate"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-81-01", "GAP-81-02", "GAP-81-03", "GAP-81-04"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥1,211 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: |
          Write failing tests that assert:
          1. cortex_knowledge search returns non-empty results for "tdd" query
          2. cortex_knowledge domain returns entries for "backend-python" domain
          3. cortex_knowledge gaps returns real coverage score (not hardcoded 0.85)
          4. Only ONE KnowledgeSynthesisEngine class exists at canonical path
        gate: "python3 scripts/run_tests.py file tests/mcp/test_knowledge_wiring.py — ALL listed tests must FAIL"
        blocker: "Do NOT wire any code until every listed test fails"
      green:
        action: |
          1. In cortex/mcp/tools/intelligence.py — CortexKnowledge.execute():
             - Import KnowledgeRegistryProxy
             - search operation: proxy.query(key_contains=query) → format as results
             - domain operation: proxy.query(domain=domain) → format as knowledge_items
             - gaps operation: proxy.domains() vs expected → compute real coverage
          2. Delete cortex/intelligence/knowledge_synthesis_engine.py (18-line stub)
             — canonical impl is at cortex/intelligence/knowledge/knowledge_synthesis_engine.py
          3. Update any imports referencing the deleted stub path
        gate: "python3 scripts/run_tests.py file tests/mcp/test_knowledge_wiring.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: |
          1. Add type hints to modified execute() method parameters (CORE-011)
          2. Update docstring on CortexKnowledge.execute() (CORE-012)
          3. Verify no duplicate KnowledgeSynthesisEngine imports remain (CORE-035)
        gate: "python3 scripts/run_tests.py dir tests/mcp/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_cortex_knowledge_search_returns_results — search('tdd') returns ≥1 results from 30 YAMLs"
        - "test_cortex_knowledge_search_filters_by_domain — search('tdd', domain='testing-validation') scopes to domain"
        - "test_cortex_knowledge_domain_returns_entries — domain('backend-python') returns ≥1 knowledge_items"
        - "test_cortex_knowledge_gaps_returns_real_coverage — gaps() coverage_score != 0.85 (computed from proxy.domains())"
        - "test_no_duplicate_knowledge_synthesis_engine — only one KnowledgeSynthesisEngine class at canonical path"
      green:
        - "Wire CortexKnowledge.execute() search → KnowledgeRegistryProxy.query(key_contains=)"
        - "Wire CortexKnowledge.execute() domain → KnowledgeRegistryProxy.query(domain=)"
        - "Wire CortexKnowledge.execute() gaps → KnowledgeRegistryProxy.domains() vs expected list"
        - "Delete cortex/intelligence/knowledge_synthesis_engine.py (stub, 18L)"
      refactor:
        - "Add docstrings to modified methods (CORE-012)"
        - "Verify type hints on all modified signatures (CORE-011)"
        - "grep for stale imports referencing deleted stub path"

    acceptance_criteria:
      - "cortex_knowledge(op='search', query='tdd') returns ≥1 real results"
      - "cortex_knowledge(op='domain', query='security') returns ≥1 knowledge_items"
      - "cortex_knowledge(op='gaps') returns computed coverage_score (not 0.85)"
      - "Only cortex/intelligence/knowledge/knowledge_synthesis_engine.py exists (stub deleted)"
      - "All existing MCP tests pass (zero regressions)"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/mcp/"
      min_tests_pass: 5
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ══════════════════════════════════════════════════════════════════════════
  # SUB-PHASE B — Golden test hardening (threshold + xfail reduction + fixture)
  # GAPs: 81-05, 81-06, 81-07
  # ══════════════════════════════════════════════════════════════════════════
  - id: "phase-81-b"
    title: "Golden Test Hardening — Ratchet Threshold, Reduce xfail, Add live_trace_db Fixture"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-81-05", "GAP-81-06", "GAP-81-07", "GAP-81-08"]
    governance_authority: "CORE-008, CORE-064"
    duration_estimate: "3 hours"
    depends_on: ["phase-81-a"]
    prerequisite: "phase-81-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: |
          Write failing tests that assert:
          1. AC marker completeness threshold is > 50% (ratcheted to current actual ratio)
          2. live_trace_db fixture exists in golden conftest and returns path to real DB
          3. At least 4 of the 12 xfail tests in test_audit_trail_verification.py
             are converted to real passing assertions (target: reduce xfail from 12 to ≤8)
          4. GoldenScenario dataclass exists in tests/golden/_golden_factory.py with
             scenario_id, intent, expected_orchestrator_chain, acceptance_criteria fields
        gate: "python3 scripts/run_tests.py file tests/golden/audit_trail/ — expected failures match new assertions"
        blocker: "Do NOT modify thresholds or fixtures until every listed test validates"
      green:
        action: |
          1. In test_ac_marker_completeness.py — ratchet 50% threshold to current actual ratio
             (measure current ratio first, set threshold to that value minus 5% safety margin)
          2. In tests/golden/conftest.py — add live_trace_db fixture:
             - Points to .cortex-runtime/traces/orchestrator-traces.db
             - Provides assert_handoff_recorded(from_orch, to_orch) helper
             - Falls back to tmp DB if live DB doesn't exist (CI safety)
          3. In test_audit_trail_verification.py — convert xfail tests where the underlying
             wiring now works (OrchestratorProtocolMixin AC emission added in Phase 58).
             Target: reduce from 12 to ≤8 xfail markers. Do NOT force — only convert
             tests whose assertions now pass against live code.
          4. Create tests/golden/_golden_factory.py with GoldenScenario dataclass:
             - Fields: scenario_id, intent, expected_orchestrator_chain, acceptance_criteria, ac_ids
             - GOLDEN_SCENARIOS registry of predefined scenarios for parametrize
             - assert_scenario_trace(scenario, trace_db) helper that validates orchestrator
               chain against live trace DB entries
        gate: "python3 scripts/run_tests.py dir tests/golden/ — ALL golden tests PASS (xfail tests that remain are expected)"
        blocker: "Do NOT begin REFACTOR until golden suite is green"
      refactor:
        action: |
          1. Document threshold ratchet rationale in test docstring
          2. Add type hints to live_trace_db fixture return type (CORE-011)
          3. Add docstring to assert_handoff_recorded helper (CORE-012)
        gate: "python3 scripts/run_tests.py dir tests/golden/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_ac_marker_threshold_ratcheted — threshold is > 0.50 (fails until ratcheted)"
        - "test_live_trace_db_fixture_exists — conftest.py provides live_trace_db fixture"
        - "test_live_trace_db_returns_real_path — fixture path contains 'orchestrator-traces.db'"
        - "test_xfail_count_reduced — test_audit_trail_verification.py has ≤8 xfail markers"
        - "test_golden_scenario_factory_exists — tests/golden/_golden_factory.py defines GoldenScenario dataclass"
        - "test_golden_scenario_has_required_fields — GoldenScenario has scenario_id, intent, expected_orchestrator_chain, acceptance_criteria"
        - "test_golden_scenarios_registry_populated — GOLDEN_SCENARIOS list contains ≥3 predefined scenarios"
      green:
        - "Ratchet threshold in test_ac_marker_completeness.py"
        - "Add live_trace_db fixture to tests/golden/conftest.py"
        - "Convert ≥4 xfail tests in test_audit_trail_verification.py to real assertions"
        - "Create tests/golden/_golden_factory.py with GoldenScenario + GOLDEN_SCENARIOS + assert_scenario_trace()"
      refactor:
        - "Document threshold value and rationale in docstring"
        - "Type hints on fixture (CORE-011)"
        - "Docstrings on helpers (CORE-012)"

    acceptance_criteria:
      - "AC marker completeness threshold is > 50% (ratcheted to current ratio)"
      - "live_trace_db fixture available in golden conftest.py"
      - "xfail count in test_audit_trail_verification.py ≤ 8 (was 12)"
      - "GoldenScenario dataclass exists in tests/golden/_golden_factory.py"
      - "GOLDEN_SCENARIOS registry contains ≥3 predefined E2E scenarios"
      - "assert_scenario_trace() validates orchestrator chain against trace DB"
      - "All golden tests pass (green or expected xfail)"
      - "Zero regressions in smoke suite"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/golden/"
      min_tests_pass: 200
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

