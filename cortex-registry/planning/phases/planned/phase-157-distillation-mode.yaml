      PRODUCTION_TOOLS in cortex/mcp/mcp_registry.py has no 'cortex_distill' entry.
      ALL_TOOLS in cortex/mcp/tools/__init__.py has no CortexDistill entry.
      MCP clients (Copilot Chat) cannot invoke distillation without this registered tool.
    action_ref: "phase-157-c"
    status: OPEN

  - id: "GAP-157-04"
    title: "DISTILL intent not registered in IntentRouter routing tables"
    severity: P1
