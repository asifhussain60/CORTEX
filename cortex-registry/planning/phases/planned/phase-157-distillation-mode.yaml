# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Architectural evaluation 2026-03-05 (originally phase-129-distillation-mode.yaml).
  Renumbered to phase-154 as phase-129 slot was used by Product Owner Intelligence Suite.

  Problem: Long AI chat sessions (100–300+ messages) become entropy engines — repeated
  clarifications, abandoned branches, redundant explanations, debugging chatter. The
  resulting transcript is unusable as an operational prompt for subsequent orchestrators.

  Opportunity: A first-class DISTILL mode that ingests a chat transcript file, performs
  semantic analysis via LENS, reconstructs the original intent graph, reconciles
  completed vs pending work, and synthesises a single token-optimised executable prompt
  that replaces the original file in place.

  Architecture:
    - New intent DISTILL routed via IntentRouter → DistillationOrchestrator
    - Reuses ChatFileDetector (from DigestSessionOrchestrator) — composition not inheritance
    - Reuses RequestRephraseOrchestrator.analyze() for compression — composition only
    - 5-stage pipeline: Detect → Segment → Reconstruct → Reconcile → Synthesise

  Differentiation from DIGEST:
    - DIGEST → produces EnhancementProposal[] for knowledge store ingestion
    - DISTILL → produces a single synthesised executable prompt string; rewrites file in place

  Current gaps:
    - IntentType enum missing DISTILL (currently 33 values)
    - No DistillationOrchestrator in cortex/orchestrators/support/
    - No CortexDistill MCP tool in cortex/mcp/tools/
    - DISTILL not registered in IntentRouter routing tables
    - No distill-workflow.yaml template
    - /distill not documented in copilot-instructions.md

  Smoke baseline: 2791 passed (2026-03-12)
  Preflight baseline: 446 passed

