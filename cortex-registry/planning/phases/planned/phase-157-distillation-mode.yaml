# GAP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-157-01"
    title: "IntentType enum missing DISTILL value"
    severity: P1
    source: "architectural evaluation 2026-03-05"
    evidence: |
      cortex/models/canonical_enums.py — IntentType has 33 values (as of Phase 152).
      DISTILL is not present. IntentRouter cannot classify /distill commands.
      IntentRouter keyword_registry.py has no DISTILL_KEYWORDS list.
    action_ref: "phase-157-a"
    status: OPEN

  - id: "GAP-157-02"
    title: "No DistillationOrchestrator implementation"
    severity: P1
    source: "architectural evaluation 2026-03-05"
    evidence: |
      cortex/orchestrators/support/ — no distillation_orchestrator.py exists.
      Five-stage pipeline required:
        Stage 1: ChatFileDetector (reuse via composition from DigestSessionOrchestrator)
        Stage 2: ConversationSegmenter — 5 block types (intent/exploration/implementation/debug/resolution)
        Stage 3: IntentGraphReconstructor — objective + subtasks + completed + pending + abandoned
        Stage 4: StateReconciler — diff recovered tasks vs detected completions
        Stage 5: PromptSynthesiser — single optimised output via RequestRephraseOrchestrator.analyze()
    action_ref: "phase-157-b"
    status: OPEN

  - id: "GAP-157-03"
    title: "No CortexDistill MCP tool"
    severity: P1
    source: "architectural evaluation 2026-03-05"
