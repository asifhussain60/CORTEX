      cortex/orchestrators/core/intent_router/routing_core_mixin.py — no DISTILL routing rule.
      cortex/core/intelligence_routing_wiring.py — no IntentType.DISTILL mapping.
      WorkflowComposer cannot route DISTILL — no distill-workflow.yaml template.
    action_ref: "phase-157-d"
    status: OPEN

  - id: "GAP-157-05"
    title: "DISTILL intent missing from intelligence routing and copilot-instructions documentation"
