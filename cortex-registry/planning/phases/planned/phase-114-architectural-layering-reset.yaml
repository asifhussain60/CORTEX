# CORTEX Phase Plan — Phase 114: Architectural Layering Reset
# Authority: cortex-architect audit 2026-03-03
# Governance: master-plan-phase-lifecycle.yaml

id: "phase-114"
title: "Architectural Layering Reset — Dependency DAG Enforcement, Circular Reference Elimination, Shared Model Extraction"
version: "1.0"
created: "2026-03-03"
status: COMPLETE
priority: P0
governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-035   # Single canonical implementation
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-114-LAYERING-RESET"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Holistic architecture audit 2026-03-03 (copilot chat session).
  CORTEX has 26 circular import cycles, 424 lazy imports used as workarounds,
  45 upward dependency violations (core/ → orchestrators/), and 11 more from
  infrastructure/ → orchestrators/. The dependency graph is a mesh, not a DAG.
  
  This phase enforces a strict layering contract:
    models/ (L0) → core/ (L1) → intelligence/ + lens/ (L2) → orchestrators/ (L3) → mcp/ (L4)
  
  infrastructure/ is a SUPPORT layer — may import from L0-L2 only (never L3/L4).
  governance/ is a SUPPORT layer — may import from L0-L1 only.
  
  Baseline measurements:
    - Circular import cycles: 26
    - Lazy imports (circular workarounds): 424
    - core/ → orchestrators/ violations: 45
    - infrastructure/ → orchestrators/ violations: 11
    - Smoke tests: 2,194 passed
    - Preflight: 220 passed

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-114-01"
    title: "Extract shared models from duplicate class definitions into cortex/models/"
    severity: P0
    source: "AST scan: 271 duplicate class names. Top offenders: ValidationResult (24), Config (19), HealthCheckResult (9), CacheEntry (9)"
    evidence: |
      python3 -c "import ast,pathlib,collections; ..."  → DUPLICATES=271
      ValidationResult defined in 24 files across cortex/
      Config defined in 19 files (many Pydantic inner classes — exclude those)
    action_ref: "phase-114-a"
    status: OPEN
    acceptance_criteria: |
      - Top 15 duplicate class names consolidated into cortex/models/shared/
      - All 24 ValidationResult usages import from cortex.models.validation_result
      - All 9 HealthCheckResult usages import from cortex.models.health_models
      - All 9 CacheEntry usages import from cortex.models.cache_models
      - Remaining domain-specific duplicates documented with justification
      - DUPLICATES count reduced from 271 to ≤80

  - id: "GAP-114-02"
    title: "Enforce dependency DAG with preflight test — core/ must NOT import from orchestrators/"
    severity: P0
    source: "grep: 45 imports from core/ → orchestrators/"
    evidence: |
      grep -rn 'from cortex.orchestrators' cortex/core/ → 45 hits
      Worst: core/orchestrator_protocol_mixin.py → enforcement_orchestrator (circular)
      core/intent/__init__.py → 6 wildcard re-exports from orchestrators/core/intent_router/
    action_ref: "phase-114-b"
    status: OPEN
    acceptance_criteria: |
      - core/ has ZERO runtime imports from orchestrators/ (TYPE_CHECKING guard allowed)
      - core/intent/ re-exports moved to orchestrators/ or models/
      - core/orchestrator_protocol_mixin.py enforcement import guarded under TYPE_CHECKING
      - Preflight test test_dependency_dag.py enforces layering at CI
      - infrastructure/ → orchestrators/ violations reduced from 11 to 0

  - id: "GAP-114-03"
    title: "Eliminate circular import cycles — target: 0 runtime cycles"
    severity: P0
    source: "DFS cycle detection: 26 cycles found"
    evidence: |
      Key cycles:
      1. core.orchestrator_protocol_mixin → enforcement_orchestrator → core (runtime)
      2. mcp_registry → mcp.tools → intent_router → registry_intelligence_agent → mcp_registry
      3. intent_router/__init__ → intent_router_impl → intent_router (package self-cycle)
      4. exec_gateway_impl → master_orchestrator → exec_gateway_impl
    action_ref: "phase-114-b"
    status: OPEN
    acceptance_criteria: |
      - 0 runtime circular import cycles (TYPE_CHECKING-guarded cycles are acceptable)
      - Lazy imports reduced from 424 to ≤100 (only for genuine optional dependencies)
      - Preflight test test_no_circular_imports.py validates at CI
      - All remaining lazy imports have # LAZY: <reason> annotation

  - id: "GAP-114-04"
    title: "Remove 337 noqa:CORE-035 suppressions — replace with real fixes or shared models"
    severity: P1
    source: "grep: 337 CORE-035 suppressions masking duplicate class names"
    evidence: |
      Phase 111 annotated 185+ files with noqa:CORE-035 instead of resolving duplicates.
      After GAP-114-01 extracts shared models, most suppressions become unnecessary.
    action_ref: "phase-114-c"
    status: OPEN
    acceptance_criteria: |
      - noqa:CORE-035 count reduced from 337 to ≤50
      - Remaining suppressions have specific justification (e.g. interface + impl pattern)
      - Preflight test validates CORE-035 suppression budget ≤50

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# SUB-PHASES
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: "phase-114-a"
    title: "Shared Model Extraction — consolidate top 15 duplicate class names"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-114-01"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥2,194 baseline)"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/preflight/test_shared_models.py:
          - test_validation_result_single_canonical_import
          - test_health_check_result_single_canonical_import
          - test_cache_entry_single_canonical_import
          - test_no_duplicate_class_over_threshold (≤80 duplicates)
      green:
        action: |
          1. Create cortex/models/shared/ package
          2. Extract ValidationResult → cortex/models/shared/validation.py
          3. Extract HealthCheckResult → cortex/models/shared/health.py
          4. Extract CacheEntry → cortex/models/shared/cache.py
          5. Extract ExecutionResult → cortex/models/shared/execution.py
          6. Extract RoutingDecision → cortex/models/shared/routing.py
          7. Update all importers to use canonical locations
          8. Remove duplicate definitions (keep imports for backward compat)
      refactor:
        action: "Remove backward compat imports after all tests green"
    completion_gate: "DUPLICATES ≤ 80, smoke green, preflight green"

  - id: "phase-114-b"
    title: "Dependency DAG Enforcement — eliminate circular cycles + upward violations"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-114-02", "GAP-114-03"]
    governance_authority: "CORE-008, CORE-064, CORE-068"
    duration_estimate: "3 hours"
    depends_on: ["phase-114-a"]
    prerequisite: "phase-114-a completion_gate passed"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/preflight/test_dependency_dag.py:
          - test_core_does_not_import_orchestrators
          - test_infrastructure_does_not_import_orchestrators
          - test_models_does_not_import_above_layer_1
          - test_no_runtime_circular_imports
      green:
        action: |
          1. Move core/intent/__init__.py re-exports to orchestrators/ (6 wildcard imports)
          2. Guard core/orchestrator_protocol_mixin.py enforcement import under TYPE_CHECKING
          3. Guard core/governance_intelligence.py orchestrator import under TYPE_CHECKING
          4. Guard core/rule_evaluator.py governance_registry import under TYPE_CHECKING
          5. Move infrastructure/security/ orchestrator imports to lazy + TYPE_CHECKING
          6. Move infrastructure/pre_commit_validator.py orchestrator import to lazy
          7. Break mcp_registry → tools → intent_router cycle via interface extraction
          8. Break intent_router/__init__ → intent_router_impl cycle via direct import
      refactor:
        action: "Remove any lazy imports that are no longer needed after layer fixes"
    completion_gate: "0 runtime circular cycles, 0 core→orchestrators violations, preflight green"

  - id: "phase-114-c"
    title: "Suppression Cleanup — remove noqa:CORE-035 annotations resolved by shared models"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-114-04"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-114-a", "phase-114-b"]
    prerequisite: "phase-114-a and phase-114-b completion_gates passed"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/preflight/test_noqa_budget.py:
          - test_core035_suppression_count_under_budget (≤50)
          - test_all_remaining_suppressions_have_justification
      green:
        action: |
          1. For each file with noqa:CORE-035 where the duplicate was resolved in 114-a:
             remove the suppression annotation
          2. For remaining suppressions: add specific justification comment
          3. Update test_no_duplicate_classes.py thresholds
      refactor:
        action: "Final grep audit — ensure no orphaned annotations"
    completion_gate: "noqa:CORE-035 count ≤ 50, all remaining justified, smoke green"

# ─────────────────────────────────────────────────────────────────────────────
# VERIFICATION
# ─────────────────────────────────────────────────────────────────────────────
verification:
  final_gate: |
    - make test-preflight: ALL PASS
    - make test-smoke: ≥ 2,194 passed
    - Circular import cycles: 0 runtime
    - DUPLICATES: ≤ 80
    - noqa:CORE-035: ≤ 50
    - core/ → orchestrators/ imports: 0
    - infrastructure/ → orchestrators/ imports: 0
