# ══════════════════════════════════════════════════════════════════════════════
# CORTEX Phase 22 — STS BadMonolith v2
# Full CORTEX SDLC: Onboard → Requirements → Design → Plan → TDD → Workflow-Template Execution
# ══════════════════════════════════════════════════════════════════════════════
# Authority: cortex-registry/planning/cortex-refactor-master.yaml (phase-22)
# Status: planned
# Output target: cortex-sts/CortexLabs/FinTrack-v2/
# Supersedes: previous phase-22 (cortex-sts/CortexLabs/Refactored/ — kept as v1 reference)
# Source: User request 2026-02-22 — treat BadMonolith as production repo, run full SDLC
# ══════════════════════════════════════════════════════════════════════════════

id: phase-22-sts-badmonolith-v2
name: "STS BadMonolith v2 — Full CORTEX SDLC Demonstration"
version: "1.0.0"
created: "2026-02-22"
status: planned
priority: P1
risk: medium

vision: |
  Treat CortexLabs FinTrack (BadMonolith) as a real production codebase with 25 P0/P1/P2 issues.
  Run the complete CORTEX SDLC from zero: onboard it as if new to the team, generate full engineering
  documentation (requirements, domain model, ADRs, diagrams, estimation), produce an explicit plan
  via PlanningOrchestrator, then execute each sub-phase through dedicated workflow templates
  (security-first, TDD-first, quality-gated). This is CORTEX's "sharpen the saw" demo — showing
  the full intelligence pipeline, not just code edits.

target:
  source: "cortex-sts/CortexLabs/BadMonolith/"
  output: "cortex-sts/CortexLabs/FinTrack-v2/"
  preserve_v1: true   # cortex-sts/CortexLabs/Refactored/ remains untouched
  tech_stack_constraint: "No new libraries — same C# ASP.NET Core 8.0 + vanilla TypeScript"
  smells_to_resolve: 25
  smell_source: "cortex-sts/CortexLabs/BadMonolith/.cortex-manifest.yaml"

orchestration_chain:
  entry: MasterOrchestrator
  intent: IMPLEMENT
  pipeline:
    - stage: 0
      name: "Governance Audit"
      orchestrator: EnforcementOrchestrator
      action: "Stage 0 pre-flight — validate CORE-002, CORE-008, CORE-035, CORE-048"
      gate: "0 P0 violations → proceed"

    - stage: 1
      name: "Onboarding — Production Repo Registration"
      orchestrator: OnboardingOrchestrator
      mcp_tool: cortex_onboard_repository_v3
      action: |
        LENS scan BadMonolith as if new production repo:
        - Language detection (C#, TypeScript, HTML, JSON)
        - Dependency graph construction (circular dep map)
        - Security surface scan (SQL injection, hardcoded secrets)
        - Test quality scan (Assert.True(true) detection)
        - Architecture pattern detection (God class, no DI, no repository pattern)
        - Domain boundary detection (Users, Transactions, Accounts, Reports, Auth, Admin, Analytics)
        - Generate cortex-registry/company/repos/cortexlabs-fintrack/ onboarding artifact
      output:
        - "cortex-sts/CortexLabs/FinTrack-v2/onboarding/lens-scan-results.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/onboarding/smell-inventory.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/onboarding/domain-map.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/onboarding/security-surface.yaml"

    - stage: 2
      name: "Requirements Engineering"
      orchestrator: PlanningOrchestrator
      action: |
        Extract business requirements from code (reverse-engineer intent from implementation).
        Classify: functional, non-functional, security, performance, testability.
        Generate structured YAML requirements — no prose docs (CORE-002).
      output:
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/requirements/business-requirements.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/requirements/functional-requirements.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/requirements/non-functional-requirements.yaml"
      sources_analyzed:
        - "BadMonolith/backend/Program.cs (591 lines — 7 domain endpoint groups)"
        - "BadMonolith/backend/Services/Services.cs (184 lines — UserService, TransactionService)"
        - "BadMonolith/backend/Models/Models.cs (59 lines — 4 domain entities)"
        - "BadMonolith/frontend/src/app.ts (466 lines — 8 functional areas)"
        - "BadMonolith/.cortex-manifest.yaml (25 SMELL definitions)"

    - stage: 3
      name: "Architecture Design"
      orchestrator: DesignCoordinator
      action: |
        Design Clean Architecture targeting zero re-work:
        - Domain model with proper entity boundaries
        - Repository pattern with interface segregation
        - CQRS-lite (separate read DTOs from write commands)
        - Layered frontend (ApiService → DomainService → UI)
        Generate Mermaid diagrams (inline YAML — not .md files per CORE-002).
        Produce ADRs as YAML records.
      output:
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/architecture.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/domain-model.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/api-contracts.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/adrs/adr-001-clean-architecture.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/adrs/adr-002-ef-core-parameterized.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/adrs/adr-003-di-container.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/adrs/adr-004-typescript-strict.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/adrs/adr-005-ilogger-structured.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/diagrams/component.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/diagrams/er-model.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/diagrams/sequence-auth.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/design/diagrams/sequence-transaction.yaml"
      architecture_target:
        backend_layers:
          - "Domain/ — Entities, enums, value objects, domain events (no EF, no HTTP)"
          - "Application/ — Use cases, interfaces (IRepository, IService), DTOs, validators"
          - "Infrastructure/ — EF Core DbContext, repository implementations, JWT, health checks"
          - "Api/ — Controllers, DI wiring, middleware (ProblemDetails, CORS), OpenAPI"
          - "Tests/ — xUnit + Moq, one test class per service, TestQualityGate score ≥ 7"
        frontend_layers:
          - "models/ — Typed interfaces (no 'any')"
          - "services/ApiService.ts — fetch abstraction + AbortController timeout"
          - "services/DomainService.ts — pure business logic (analytics, validation, formatting)"
          - "services/ValidationService.ts — shared validation (no duplication with backend)"
          - "main.ts — UI wiring only (tab switching, DOM events)"

    - stage: 4
      name: "Estimation + Sub-Phase Planning"
      orchestrator: PlanningOrchestrator
      action: |
        Generate PERT estimates per sub-phase.
        Produce ordered execution plan with explicit dependencies and gates.
      output:
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/estimation/pert-estimates.yaml"
        - "cortex-sts/CortexLabs/FinTrack-v2/docs/estimation/execution-plan.yaml"

    - stage: 5
      name: "Execution — Workflow-Template-Driven TDD Implementation"
      orchestrator: UnifiedWorkflowTemplateExecutor
      action: "Execute sub-phases sequentially via registered workflow templates"
      sub_phases:
        - sub_phase: "5A"
          name: "Security Gate — P0 Smells First"
          workflow_template: "backend/csharp-security-workflow"
          tdd_cycle: true
          smells: [SMELL-1, SMELL-2, SMELL-13, SMELL-18]
          gate: "0 SQL injection patterns, 0 hardcoded secrets → proceed to 5B"
          test_output: "FinTrack-v2/backend/Tests/SecurityTests.cs"
          red_first: |
            Tests that assert:
            - SQL commands use @param syntax (no string concatenation)
            - JWT secret sourced from env var, not appsettings.json
            - CORS policy uses explicit origins list
            - Error responses contain safe ProblemDetails (no stack trace)

        - sub_phase: "5B"
          name: "Domain Model + Data Layer"
          workflow_template: "backend/csharp-refactor-workflow"
          tdd_cycle: true
          smells: [SMELL-7, SMELL-19, SMELL-20]
          gate: "All entities PascalCase, all models have [Required]/[Range], all entities have audit fields"
          test_output: "FinTrack-v2/backend/Tests/DomainModelTests.cs"
          deliverables:
            - "Domain/Entities/User.cs — PascalCase, [Required], CreatedAt/UpdatedAt/IsDeleted"
            - "Domain/Entities/Transaction.cs — TransactionType enum (not magic string)"
            - "Domain/Entities/Account.cs — AccountType enum, optimistic concurrency"
            - "Domain/Entities/Report.cs — ReportType enum"
            - "Infrastructure/FinTrackDbContext.cs — EF Core, WAL mode, parameterized"

        - sub_phase: "5C"
          name: "Service Decomposition — God Class Elimination"
          workflow_template: "lifecycle/service-decomposition-workflow"
          tdd_cycle: true
          smells: [SMELL-3, SMELL-4, SMELL-5, SMELL-8, SMELL-9, SMELL-10, SMELL-11, SMELL-14, SMELL-15, SMELL-17]
          gate: "0 circular dependencies (LENS dep graph), all services via DI, all dead code removed"
          test_output:
            - "FinTrack-v2/backend/Tests/UserServiceTests.cs"
            - "FinTrack-v2/backend/Tests/TransactionServiceTests.cs"
            - "FinTrack-v2/backend/Tests/AccountServiceTests.cs"
            - "FinTrack-v2/backend/Tests/ValidationServiceTests.cs"
            - "FinTrack-v2/backend/Tests/AnalyticsServiceTests.cs"
          deliverables:
            - "Application/Interfaces/IUserRepository.cs, ITransactionRepository.cs, IAccountRepository.cs"
            - "Application/Interfaces/IUserService.cs, ITransactionService.cs, IAccountService.cs"
            - "Application/Services/UserService.cs — constructor DI, ILogger<T>, IValidationService"
            - "Application/Services/TransactionService.cs — pagination (PageRequest), async"
            - "Application/Services/AccountService.cs — transfer in DB transaction (atomic)"
            - "Application/Services/AnalyticsService.cs — aggregation via EF query (not in-memory)"
            - "Application/Services/ValidationService.cs — single source of truth for all validation"
            - "Infrastructure/Repositories/UserRepository.cs, TransactionRepository.cs, AccountRepository.cs"
            - "Api/Controllers/ — UsersController, TransactionsController, AccountsController, ReportsController, AuthController, AdminController, AnalyticsController, HealthController"
            - "Api/Program.cs — clean DI wiring, CORS from config, ProblemDetails middleware"

        - sub_phase: "5D"
          name: "Frontend Refactoring — TypeScript Strict + Service Layer"
          workflow_template: "frontend/typescript-refactor-workflow"
          tdd_cycle: true
          smells: [SMELL-16, SMELL-21, SMELL-22, SMELL-23, SMELL-24, SMELL-25]
          gate: "strict:true in tsconfig, 0 'any' usages, all fetch() via ApiService, all calls try/caught"
          test_output: "FinTrack-v2/frontend/src/services/domain.service.test.ts"
          deliverables:
            - "frontend/src/models/index.ts — fully typed (User, Transaction, Account, Report, TransactionType enum)"
            - "frontend/src/services/ApiService.ts — typed fetch wrapper, AbortController 10s timeout"
            - "frontend/src/services/DomainService.ts — pure analytics, formatting, validation (no DOM)"
            - "frontend/src/services/ValidationService.ts — typed email/amount validators (mirrors backend)"
            - "frontend/src/main.ts — UI orchestration only (tab switch, event binding, no business logic)"
            - "frontend/src/styles.css — all inline styles extracted"
            - "frontend/tsconfig.json — strict: true, noImplicitAny: true, target: ES2022"

        - sub_phase: "5E"
          name: "Test Quality Gate — Eliminate Zero-Value Tests"
          workflow_template: "testing/test-quality-enforcement"
          tdd_cycle: false
          smells: [SMELL-12]
          gate: "TestQualityGate score ≥ 7 on all test files"
          action: |
            Replace BadMonolith's SomeTests.cs (Assert.True(true) pattern) with
            20+ behavioural tests per service (RED tests already written in 5A–5D).
            Verify TestQualityGate score on every test class.

        - sub_phase: "5F"
          name: "Dead Code Removal + Pagination"
          workflow_template: "quality/dead-code-removal"
          tdd_cycle: false
          smells: [SMELL-6, SMELL-8]
          gate: "0 unreachable methods, all list endpoints accept page/pageSize"
          action: |
            Remove: NotificationService, ReportGenerator, SendWelcomeEmail,
            ArchiveOldTransactions, ExportUserData, calculateCompoundInterest,
            generatePdfReport, exportToExcel, CalculateTax, FormatCurrency, IsWeekend.
            Add PageRequest DTO to all list endpoints (LIMIT/OFFSET via EF Skip/Take).

    - stage: 6
      name: "Holistic Sweep + Scorecard"
      orchestrator: RefactoringOrchestrator
      workflow_template: "quality/refactor-holistic-sweep"
      action: |
        Run cross-phase completeness gate:
        - All 25 smells confirmed resolved (diff against .cortex-manifest.yaml)
        - All ADRs have corresponding implementation evidence
        - Zero CORE rule violations (CORE-011, CORE-012, CORE-028, CORE-035)
        - All public APIs have docstrings/XML docs
        Generate inline scorecard (Architecture 25%, Security 25%, Testing 20%, Docs 15%, Frontend 10%, Traceability 5%).
      gate: "All 25 smells resolved + scorecard total ≥ 85%"

    - stage: 7
      name: "Dashboard Generation"
      orchestrator: OnboardingOrchestrator
      mcp_tool: cortex_generate_repo_dashboard
      action: "Before/after SQLite dashboard for leadership demo"
      output:
        - "cortex-sts/CortexLabs/FinTrack-v2/dashboard/before.html"
        - "cortex-sts/CortexLabs/FinTrack-v2/dashboard/after.html"

workflow_templates_consumed:
  # All templates already exist in cortex-registry/workflows/templates/ — no new templates created
  - "backend/csharp-security-workflow"
  - "backend/csharp-refactor-workflow"
  - "lifecycle/service-decomposition-workflow"
  - "frontend/typescript-refactor-workflow"
  - "frontend/css-extraction-workflow"
  - "quality/dead-code-removal"
  - "quality/duplicate-validation"
  - "quality/refactor-holistic-sweep"
  - "testing/test-quality-enforcement"
  - "lifecycle/onboarding-workflow"

acceptance_criteria:
  - "AC-P22V2-001: cortex-sts/CortexLabs/FinTrack-v2/ created — does NOT overwrite Refactored/"
  - "AC-P22V2-002: All 25 smells from .cortex-manifest.yaml resolved and evidenced"
  - "AC-P22V2-003: Requirements YAML generated before any code written (Stage 2 complete)"
  - "AC-P22V2-004: ADRs exist for every architectural decision (minimum 5)"
  - "AC-P22V2-005: All C# services have xUnit tests, TestQualityGate score ≥ 7"
  - "AC-P22V2-006: TypeScript strict:true, 0 'any' types"
  - "AC-P22V2-007: 0 SQL injection patterns (parameterized queries only)"
  - "AC-P22V2-008: 0 hardcoded secrets (env var or IConfiguration only)"
  - "AC-P22V2-009: Circular dependency SMELL-5 eliminated (LENS dep graph clean)"
  - "AC-P22V2-010: All list endpoints paginated (page + pageSize params)"
  - "AC-P22V2-011: Each workflow template step logged to audit trail"
  - "AC-P22V2-012: Holistic scorecard ≥ 85% across 6 dimensions"
  - "AC-P22V2-013: CORTEX core test suite zero regression (486 golden + phase tests pass)"
  - "AC-P22V2-014: .cortex-manifest.yaml updated to v2 with resolution evidence per smell"
  - "AC-P22V2-015: No CORE-002 violation — zero .md/.txt report files created"

tdd_mandate: |
  CORE-008: Every sub-phase (5A–5F) writes RED tests first.
  Sub-phases 5A, 5B, 5C, 5D each have dedicated test output files listed above.
  No implementation file created before its corresponding test file.

core_rules_enforced:
  - CORE-002: No .md/.txt report files — all output YAML or inline code
  - CORE-008: TDD mandatory — RED before GREEN in every sub-phase
  - CORE-011: Type hints on all C# and TypeScript public APIs
  - CORE-012: XML docs on all C# public APIs; JSDoc on TypeScript services
  - CORE-028: snake_case Python files; PascalCase C# files; camelCase TS files
  - CORE-035: No duplicate implementations — ValidationService is single source
  - CORE-048: Holistic validation gate before execution (Stage 0)
  - CORE-049: Silent autonomous execution with progress bar only
  - CORE-064: Sweep Completeness Contract — all 25 smells in catalogue must be resolved

smell_resolution_map:
  security:
    SMELL-1: "Parameterized queries via EF Core — csharp-security-workflow Step S2"
    SMELL-2: "IConfiguration + env var FINTRACK_JWT_SECRET — csharp-security-workflow Step S1"
    SMELL-13: "CORS allowlist from appsettings — csharp-security-workflow Step S3"
    SMELL-18: "ProblemDetails middleware + global exception handler — csharp-security-workflow Step S4"
  solid:
    SMELL-3: "7 focused controllers, 50-line Program.cs — service-decomposition-workflow Step 5C"
    SMELL-4: "All business logic in Application/Services/ — service-decomposition-workflow"
    SMELL-5: "Constructor DI breaks circular dep — IUserService/ITransactionService interfaces"
    SMELL-16: "Static AppCache deleted — module-local state only"
    SMELL-17: "All services registered in DI container — Program.cs AddScoped()"
    SMELL-21: "466-line app.ts → main.ts (UI) + ApiService + DomainService + ValidationService"
    SMELL-23: "DomainService.computeAnalytics() — pure, no DOM, fully testable"
    SMELL-24: "All fetch() calls routed through ApiService with typed responses"
  quality:
    SMELL-6: "Skip/Take pagination on all EF list queries — dead-code-removal Step 5F"
    SMELL-7: "PascalCase entities, TransactionType/AccountType/ReportType enums"
    SMELL-8: "Dead classes/methods removed — dead-code-removal workflow"
    SMELL-9: "All routes prefixed /api/v1/ — Api/Controllers/"
    SMELL-10: "Single ValidationService (C# + TS) — duplicate-validation workflow"
    SMELL-11: "ILogger<T> throughout — ObservabilityOrchestrator pattern"
    SMELL-12: "TestQualityGate ≥ 7 on all test files — test-quality-enforcement"
    SMELL-14: "AbortController (TS) + Polly retry (C#) — service-decomposition-workflow"
    SMELL-15: "Enums replace magic strings/numbers — Domain/Entities/"
    SMELL-19: "[Required][Range][EmailAddress] on all models + DTOs"
    SMELL-20: "CreatedAt, UpdatedAt, IsDeleted, Version on all entities"
    SMELL-22: "strict: true tsconfig, 0 implicit any — typescript-refactor-workflow"
    SMELL-25: "try/catch on all ApiService calls → showError() — typescript-refactor-workflow"

progress:
  started: null
  completed: null
  issues_found: 0
  issues_resolved: 0
  validation_loop_iterations: 0
  lens_scan_completed: false
