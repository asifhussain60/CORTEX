source: "_workspaces/sts/sample-apps/SampleLegacyApp — 4 C# files, 1 Angular component, 5 broken tests"

# ──────────────────────────────────────────────────────────────────
# CHALLENGE GATE — why this phase exists
# ──────────────────────────────────────────────────────────────────
challenge:
  request: "Refactor tightly-coupled legacy system using CORTEX best practices"
  risk_score: 0.35
  decision: "New workflow template (reusable) over inline orchestrator calls (one-off)"
  rationale: |
    Composing existing templates (security-hardening, tdd-api-service, tdd-frontend-visual,
    migration-modernize, refactor-holistic-sweep) into a single security-gated strangler-fig
    workflow satisfies CORE-035 (no duplication) and is reusable for all _workspaces/sts/
    sample-apps including _Real/account-modernized and _Real/payment-processor-modernized.

# ──────────────────────────────────────────────────────────────────
# TARGET SYSTEM — LENS ANALYSIS SUMMARY
# ──────────────────────────────────────────────────────────────────
target_analysis:
  repo: "_workspaces/sts/sample-apps/SampleLegacyApp"
  languages: [csharp, typescript, angular]
  files_in_scope: 6
  anti_patterns_detected: 26
  security_violations:
    P0:
      - "SQL injection x4 (Program.cs lines 62, 111, 130, 152; TaskDataAccess.cs lines 42, 80, 105, 115)"
      - "Hardcoded credentials: connString in Program.cs line 11"
      - "Stack trace exposed to HTTP clients (ErrorHandlingMiddleware.cs line 53)"
    P1:
      - "God endpoint: single MapMethods handler for GET/POST/PUT/DELETE (Program.cs line 26)"
      - "Global mutable shared state: CachedTasks not thread-safe (Program.cs line 14)"
      - "No repository pattern: raw SqlConnection throughout"
      - "God component: AppComponent handles all HTTP calls (app.component.ts)"
    P2:
      - "No audit fields on Task model (no CreatedAt/UpdatedAt/Version)"
      - "Mixed request/response model (information leakage)"
      - "5 broken xUnit tests: shared state, empty lambdas, aspirational assertions"
      - "No pagination on data access"
      - "Missing async/await patterns"

# ──────────────────────────────────────────────────────────────────
# NEW FILES (FileFactory-validated, CORE-028 compliant names)
# ──────────────────────────────────────────────────────────────────
new_files:
  workflow_template:
    - path: cortex-registry/workflows/templates/lifecycle/service-decomposition-workflow.yaml
      purpose: "Security-first, layer-gated strangler-fig orchestration for any tightly-coupled legacy system"
      composes:
        - cortex-registry/workflows/templates/security/security-hardening.yaml
        - cortex-registry/workflows/templates/tdd/tdd-api-service.yaml
        - cortex-registry/workflows/templates/tdd/tdd-frontend-visual.yaml
        - cortex-registry/workflows/templates/lifecycle/migration-modernize.yaml
        - cortex-registry/workflows/templates/quality/refactor-holistic-sweep.yaml
      reusable_for:
        - "_workspaces/sts/sample-apps/_Real/account-modernized/"
        - "_workspaces/sts/sample-apps/_Real/payment-processor-modernized/"

  orchestrator:
    - path: cortex/orchestrators/domain/legacy_modernization_orchestrator.py
      purpose: "Reads service-decomposition-workflow.yaml; dispatches to language adapters per layer"
      extends: OrchestratorBase
      mcp_exposure: "cortex_process_request (intent=refactor + target=legacy_system)"

  tests:
    - path: tests/unit/orchestrators/domain/test_legacy_modernization_orchestrator.py
      tdd_phase: RED
      golden_candidate: true

    - path: tests/unit/workflows/test_service_decomposition_workflow.py
      tdd_phase: RED

# ──────────────────────────────────────────────────────────────────
# WORKFLOW LAYERS (strangler-fig progression)
# ──────────────────────────────────────────────────────────────────
workflow_layers:
  security_gate:
    blocks_all_subsequent: true
    orchestrator: SecurityOrchestrator
    uses_template: security-hardening.yaml
    exit_criteria:
      - "0 SQL injection vulnerabilities (parameterized queries verified)"
      - "0 hardcoded credentials (secrets scanner clean)"
      - "0 stack traces exposed in HTTP responses"
    csharp_outputs:
      - "Parameterized SqlCommand throughout TaskDataAccess.cs"
      - "Connection string moved to appsettings.json + secrets.json (gitignored)"
      - "ErrorHandlingMiddleware strips exception details from HTTP body"

  layer_1_data_access:
    depends_on: security_gate
    orchestrator: TDDOrchestrator
    uses_template: tdd-api-service.yaml
    language: csharp
    adapter: csharp_refactor_adapter.py
    tdd_cycle: "RED→GREEN→REFACTOR"
    csharp_scaffolds_emitted:
      - "cortex/ITaskRepository.cs — interface contract"
      - "cortex/TaskRepository.cs — EF Core implementation, async, parameterized"
      - "cortex/TaskDbContext.cs — EF Core context with WAL pragmas"
    exit_criteria:
      - "ITaskRepository interface with async GetAll/GetById/Create/Update/Delete"
      - "All direct SQL connection usage removed"
      - "Pagination: GetAll accepts skip/take parameters"

  layer_2_api:
    depends_on: layer_1_data_access
    orchestrator: TDDOrchestrator
    uses_template: tdd-api-service.yaml
    language: csharp
    adapter: csharp_refactor_adapter.py
    csharp_scaffolds_emitted:
      - "cortex/TasksController.cs — proper routing, DI, typed responses"
      - "cortex/TaskDto.cs — request/response separation, [Required], [MaxLength(255)]"
      - "cortex/ApiErrorResponse.cs — typed error with correlation ID, no stack trace"
    exit_criteria:
      - "GET /tasks, POST /tasks, PUT /tasks/{id}, DELETE /tasks/{id} — proper REST"
      - "ModelState validation on all inputs"
      - "CorrelationId header injected on every response"
      - "0 god endpoint methods"

  layer_3_frontend:
    depends_on: layer_2_api
    orchestrator: TDDOrchestrator
    uses_template: tdd-frontend-visual.yaml
    language: typescript
    adapter: typescript_refactor_adapter.py
    typescript_scaffolds_emitted:
      - "cortex/task.service.ts — Angular service, typed Task model, error$ Observable"
      - "cortex/task.model.ts — TypeScript interface (no more any[])"
      - "cortex/tasks.component.ts — lean component delegates to TaskService"
    exit_criteria:
      - "AppComponent has zero HTTP calls (delegates to TaskService)"
      - "No `any` type usage"
      - "Error state handled via Observable error stream"

  layer_4_tests:
    depends_on: layer_3_frontend
    orchestrator: TDDOrchestrator
    uses_template: tdd-api-service.yaml
    language: csharp
    replaces:
      - "LegacyApp.Tests/API/TasksControllerTests.cs (all 5 broken tests)"
    xunit_tests_generated:
      - "GetTasks_ReturnsPagedResults_WithDefaultPageSize"
      - "CreateTask_WithNullTitle_Returns400BadRequest"
      - "CreateTask_WithSqlInjectionPayload_IsRejected"
      - "DeleteTask_WithNonExistentId_Returns404NotFound"
      - "UpdateTask_WithValidId_Returns200AndUpdatedEntity"
    exit_criteria:
      - "No shared static state across tests"
      - "Each test: isolated in-memory EF Core database"
      - "TestQualityGate score ≥ 7 for all 5 tests"

  layer_5_holistic_sweep:
    depends_on: layer_4_tests
    orchestrator: RefactoringOrchestrator
    uses_template: refactor-holistic-sweep.yaml
    language: [csharp, typescript]
    exit_criteria:
      - "Cyclomatic complexity ≤ 10 for all methods"
      - "C# XML documentation on all public APIs"
      - "TypeScript JSDoc on TaskService public methods"
      - "CORTEX security scan: 0 critical, 0 high findings"

# ──────────────────────────────────────────────────────────────────
# DELIVERABLES
