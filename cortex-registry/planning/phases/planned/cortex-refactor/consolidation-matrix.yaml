  # ============================================================================
  concept_consolidation:
    description: "Duplicate directories for the same concept → ONE canonical location"

    items:
      # --- governance (9 source directories → 1 SSOT) ---
      - id: "CON-001"
        concept: "governance"
        severity: "P0 — 9 duplicate directories"
        current_locations:
          - path: "cortex/governance/"
            role: "primary — filename_factory, enforcement, rules"
            keep: true
          - path: "cortex/core/governance/"
            role: "governance engine, validators"
            action: "merge unique logic into cortex/governance/"
          - path: "cortex/knowledge/governance/"
            role: "governance knowledge articles"
            action: "move to cortex-registry/knowledge-base/governance/"
          - path: "cortex/knowledge/best-practices/governance/"
            role: "best practice docs"
            action: "move to cortex-registry/governance/best-practices/"
          - path: "cortex/brain/governance/"
            role: "brain governance layer"
            action: "merge unique logic into cortex/governance/"
          - path: "cortex/brain/tier1/governance/"
            role: "tier1 governance (brain)"
            action: "merge into cortex/governance/"
          - path: "cortex_intelligence/governance/"
            role: "intelligence governance"
            action: "merge into cortex/governance/"
          - path: "cortex_intelligence/memory/adaptive_intelligence/governance/"
            role: "learned governance patterns"
            action: "merge into cortex/intelligence/memory/"
          - path: "cortex_intelligence/memory/learned_patterns/governance/"
            role: "learned governance patterns"
            action: "merge into cortex/intelligence/memory/"
        target: "cortex/governance/ (ONE SSOT)"
        phase: "04-06"
        status: "pending"

      # --- lens (3 source directories → 1 SSOT) ---
      - id: "CON-002"
        concept: "lens"
        severity: "P0 — 3 duplicate directories"
        current_locations:
          - path: "cortex/lens/"
            role: "primary LENS implementation"
            keep: true
          - path: "cortex/brain/lens/"
            role: "brain lens layer"
            action: "merge unique logic into cortex/intelligence/lens/"
          - path: "cortex_lens/"
            role: "standalone package"
            action: "migrate to cortex/intelligence/lens/"
        target: "cortex/intelligence/lens/ (ONE SSOT)"
        phase: "03-04"
        status: "pending"

      # --- domain_brain (3 source directories → 1 SSOT) ---
      - id: "CON-003"
        concept: "domain_brain"
        severity: "P0 — 3 duplicate directories"
        current_locations:
          - path: "cortex/domain_brain/"
            role: "primary domain brain"
            action: "migrate to cortex/intelligence/domain_brain/"
          - path: "cortex/brain/domain_brain/"
            role: "brain domain brain"
            action: "merge unique logic into cortex/intelligence/domain_brain/"
          - path: "cortex_intelligence/domain_brain/"
            role: "intelligence domain brain"
            action: "merge unique logic into cortex/intelligence/domain_brain/"
        target: "cortex/intelligence/domain_brain/ (ONE SSOT)"
        phase: "03-04"
        status: "pending"

      # --- observability (5 source directories → 1 SSOT) ---
      - id: "CON-004"
        concept: "observability"
        severity: "P0 — 5 duplicate directories"
        current_locations:
          - path: "cortex/observability/"
            role: "primary observability"
            keep: true
          - path: "cortex/orchestrators/observability/"
            role: "orchestrator observability"
            action: "merge into cortex/observability/"
          - path: "cortex/brain/core/observability/"
            role: "brain core observability"
            action: "merge into cortex/observability/"
          - path: "cortex/brain/observability/"
            role: "brain observability"
            action: "merge into cortex/observability/"
          - path: "cortex_intelligence/observability/"
            role: "intelligence observability"
            action: "merge into cortex/observability/"
        target: "cortex/observability/ (ONE SSOT)"
        phase: "04-06"
        status: "pending"

      # --- wiring (3 source directories → 1 SSOT) ---
      - id: "CON-005"
        concept: "wiring"
        severity: "P1 — 3 duplicate directories"
        current_locations:
          - path: "cortex/wiring/"
            role: "primary wiring/DI"
            keep: true
          - path: "cortex_intelligence/wiring/"
            role: "intelligence wiring"
            action: "merge into cortex/wiring/"
        target: "cortex/core/ (composition root) or cortex/wiring/"
        phase: "03-04"
        status: "pending"

      # --- domain_orchestrators (2 source directories → 1 SSOT) ---
      - id: "CON-006"
        concept: "domain_orchestrators"
        severity: "P1 — 2 duplicate directories"
        current_locations:
          - path: "cortex/domain_orchestrators/"
            role: "primary domain orchestrators"
            action: "migrate to cortex/orchestrators/domain/"
          - path: "cortex/brain/domain_orchestrators/"
