# ==============================================================================
# CONSOLIDATION MATRIX — ALL DEDUPLICATION TARGETS
# ==============================================================================
# Purpose: Explicit mapping of every duplicated concept, where it lives today,
#          and where it should live after refactoring.
# Source: Holistic digest of gpt-review.txt + chat01.md + live repo audit
# Created: 2026-02-19
# ==============================================================================

consolidation:
  id: "consolidation-matrix"
  version: "1.0.0"
  created: "2026-02-19"
  status: "approved"

  # ============================================================================
  # SECTION 1: PACKAGE-LEVEL CONSOLIDATION (Phase 03)
  # ============================================================================
  package_consolidation:
    description: "3 top-level Python packages → 1 (cortex)"
    items:
      - id: "PKG-001"
        concept: "cortex_intelligence"
        current_locations:
          - path: "cortex_intelligence/"
            files: "~45 files across 11 subdirs"
            subdirs:
              - "action/"
              - "audit/"
              - "domain/"
              - "domain_brain/"
              - "governance/"
              - "intelligence/"
              - "memory/"
              - "observability/"
              - "perception/"
              - "quality/"
              - "reasoning/"
              - "releases/"
              - "state/"
              - "wiring/"
        target: "cortex/intelligence/"
        migration_notes: |
          - governance.db stays in .cortex-runtime/ (data, not code)
          - domain_brain → cortex/intelligence/domain_brain/
          - memory → cortex/intelligence/memory/
          - wiring → cortex/core/ (composition root)
          - governance → cortex/governance/ (SSOT)
          - observability → cortex/observability/ (SSOT)
        phase: "03"
        status: "pending"

      - id: "PKG-002"
        concept: "cortex_lens"
        current_locations:
          - path: "cortex_lens/"
            files: "~20 files across 6 subdirs"
            subdirs:
              - "analyzers/"
              - "domain_inference/"
              - "dotnet/"
              - "knowledge_graph/"
              - "models/"
              - "runtime_correlation/"
        target: "cortex/intelligence/lens/"
        migration_notes: |
          - analyzers → cortex/intelligence/lens/analyzers/
          - domain_inference → cortex/intelligence/domain_brain/
          - knowledge_graph → cortex/intelligence/lens/knowledge_graph/
          - models → cortex/models/ (shared data models)
        phase: "03"
        status: "pending"

      - id: "PKG-003"
        concept: "cortex/cortex_intelligence (inner duplicate)"
        current_locations:
          - path: "cortex/cortex_intelligence/"
        target: "DELETE (exact duplicate of top-level)"
        phase: "03"
        status: "pending"

