# ==============================================================================
# Phase 01 — Foundation Safety Net
# CORTEX Cohesive Brain Refactor — Phase 01 of 10
# ==============================================================================
# Status: planned
# Priority: P0
# Estimated Effort: 2 hours
# CORE-008: Tests validated before implementation
# ==============================================================================

phase:
  id: phase-01-foundation
  title: Foundation Safety Net
  sequence: 1
  of: 10
  plan: cortex-refactor
  status: planned
  priority: P0
  estimated_effort: 2 hours
  created: '2026-02-23'

  description: |
    Establish the safety net before any refactoring begins. This phase:
    1. Documents the current baseline (test count, import health, stale ref inventory)
    2. Deletes the ghost directory cortex/cortex.intelligence/ (empty — zero code)
    3. Verifies all 22/22 orchestrators import cleanly after ghost dir removal
    4. Verifies YAML validity of cortex-master.yaml and phase files

    This is a ZERO-RISK phase — deleting an empty directory cannot break imports.
    The safety net is the test suite itself (838 golden + smoke suite).

  prerequisite_checks:
    before_starting:
    - All 22 orchestrators import cleanly (verified 2026-02-23: 22/22 ✅)
    - Smoke tests pass (verified 2026-02-23: 1237/0 ✅)
    - cortex-master.yaml parses clean (verified 2026-02-23: ✅)
    - No staged uncommitted changes in Python files

  stages:
  - id: A
    name: Baseline Documentation
    type: documentation
    description: |
      Record the pre-refactor baseline so regression can be detected immediately.
    actions:
    - action: run_smoke_tests
      command: python3 scripts/run_tests.py smoke
      record: pass_count, fail_count
    - action: verify_orchestrator_imports
      command: python3 -c "from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator; print('OK')"
      record: all_22_import_status
    - action: inventory_ghost_dirs
      command: find cortex -name '__init__.py' -empty -o -type d -empty 2>/dev/null | head -20
      record: empty_dirs_list
    - action: inventory_stale_refs
      command: grep -r 'cortex_intelligence\|cortex\.brain\|cortex/brain' cortex/ --include='*.py' -l
      record: stale_ref_files_count

  - id: B
    name: Ghost Directory Deletion
    type: cleanup
    description: |
      Delete the empty ghost directory cortex/cortex.intelligence/
      This directory exists because of a historical rename that left an empty shell.
      Confirmed empty: no Python files, no __init__.py, no importable content.
    target: cortex/cortex.intelligence/
    risk: ZERO (empty directory, nothing imports from it)
    actions:
    - action: verify_empty
      command: find cortex/cortex.intelligence -type f | wc -l
      expected: "0"
      gate: must_be_zero
    - action: delete_ghost_dir
      command: rm -rf cortex/cortex.intelligence/
      requires_gate: verify_empty

  - id: C
    name: Post-Deletion Verification
    type: verification
    description: |
      Verify system health after ghost directory deletion.
    actions:
    - action: verify_orchestrator_imports
      command: python3 -c "from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator; print('OK')"
      expected: OK
    - action: run_smoke_tests
      command: python3 scripts/run_tests.py smoke
      gate: zero_failures
    - action: verify_yaml
      command: python3 -c "import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml'))"
      expected: no_exception

  - id: D
    name: Baseline Commit
    type: git
    description: |
      Commit the ghost directory deletion and baseline documentation.
    commit_message: "refactor(foundation): delete empty ghost dir cortex/cortex.intelligence/"
    files_changed:
    - cortex/cortex.intelligence/  # deleted

  success_criteria:
  - cortex/cortex.intelligence/ does not exist
  - All 22 orchestrators import cleanly
  - Smoke tests pass (target: ≥1237 passing, 0 failed)
  - cortex-master.yaml parses without error
  - No new test failures introduced

  known_risks:
  - risk: Import of cortex.cortex_intelligence.* anywhere
    likelihood: very_low
    mitigation: Verified with grep — zero active imports of this path
    evidence: grep -r 'cortex\.cortex_intelligence' cortex/ --include='*.py' returns 0 results

  rollback:
    if_any_test_fails: git restore cortex/cortex.intelligence/
    note: Ghost dir can be recreated with mkdir -p cortex/cortex.intelligence/onboarded_repos/
