# ==============================================================================
# PHASE 07 — TEST CONSOLIDATION: High-value suite only
# ==============================================================================
# Purpose: 1,139 test files → high-value suite mirroring new cortex/ structure
# Gate: Coverage ≥90%, all golden tests pass, zero dead tests
# ==============================================================================

phase:
  id: "phase-07"
  name: "Test Consolidation — High-value suite only"
  status: "pending"
  priority: "P1"
  estimated_effort: "5-7 days"
  risk: "medium"
  depends_on: ["phase-06"]
  description: |
    tests/ currently has 56 subdirectories and 1,139 test files. Many are:
    - Phase-named (phase_23, phase_49, etc.) — tied to historical implementation
    - Duplicate directories (dashboard + dashboards, cortex + cortex/intelligence)
    - Low-value tests (testing stubs, placeholder assertions)

    This phase restructures tests/ to mirror the new cortex/ structure exactly,
    eliminates low-value tests, and ensures every test provides real regression
    protection. Team collaboration requires that any developer can find tests
    by navigating the same structure as the source code.

  # ============================================================================
  # CURRENT TEST DIRECTORY AUDIT
  # ============================================================================
  test_audit:
    total_files: 1139
    total_subdirs: 56
    categories:
      phase_named:
        directories:
          - "tests/phase_23/"
          - "tests/phase_49/"
          - "tests/phase_52/"
          - "tests/phase_53/"
          - "tests/phase_54_a/"
          - "tests/phase_55/"
          - "tests/phase_56/"
          - "tests/phase_56_a/"
          - "tests/phase_71/"
        action: |
          Archive to _archive/tests/phase_*/. Before archiving:
          1. Run each test dir independently
          2. Identify tests that cover ACTIVE code
          3. Move high-value tests to proper structure
          4. Archive the rest

      duplicate_directories:
        - pair: ["tests/dashboard/", "tests/dashboards/"]
          action: "Merge into tests/dashboards/"
        - pair: ["tests/cortex/", "tests/cortex/intelligence/"]
          action: "Merge into tests/core/"
        - pair: ["tests/cortex/intelligence/", "tests/intelligence/"]
          action: "Merge into tests/intelligence/"
        - pair: ["tests/cortex/lens/", "tests/lens/"]
          action: "Merge into tests/intelligence/lens/"

      well_structured:
        directories:
          - "tests/api/"
          - "tests/core/"
          - "tests/governance/"
          - "tests/infrastructure/"
          - "tests/intelligence/"
          - "tests/lens/"
          - "tests/mcp/"
          - "tests/models/"
          - "tests/observability/"
          - "tests/orchestrators/"
          - "tests/golden/"
          - "tests/integration/"
          - "tests/e2e/"
          - "tests/regression/"
          - "tests/unit/"
        action: "Keep, restructure to mirror new cortex/ layout"

      special_purpose:
        - "tests/golden/ — golden tests (KEEP, highest value)"
        - "tests/integration/ — integration tests (KEEP)"
        - "tests/e2e/ — end-to-end tests (KEEP)"
        - "tests/regression/ — regression tests (KEEP)"
        - "tests/contracts/ — contract tests (KEEP)"
        - "tests/chaos/ — chaos tests (KEEP)"
        - "tests/performance/ — perf tests (KEEP)"
        - "tests/fixtures/ — test fixtures (KEEP)"

  # ============================================================================
  # TARGET TEST STRUCTURE
  # ============================================================================
  target_structure:
    tests:
      unit:
        description: "Unit tests mirroring cortex/ structure exactly"
        subdirs:
          - "core/"
          - "governance/"
          - "intelligence/"
          - "orchestrators/"
          - "mcp/"
          - "infrastructure/"
          - "observability/"
          - "models/"
          - "config/"
          - "testing/"
          - "cli/"
          - "api/"
          - "tools/"
          - "dashboards/"

      integration:
        description: "Cross-module integration tests"
        subdirs:
          - "orchestrators/"
          - "mcp/"
          - "intelligence/"

      golden:
        description: "Golden tests — highest value, prove core contracts"
        subdirs:
          - "orchestrators/"
          - "governance/"
          - "regression/"

      e2e:
        description: "End-to-end workflow tests"

      regression:
        description: "Regression-specific tests"

      contracts:
        description: "API/interface contract tests"

      performance:
        description: "Performance benchmarks"

      fixtures:
        description: "Shared test fixtures and factories"

  # ============================================================================
  # EXPLICIT KEEP / ARCHIVE DECISION TABLE
  # ============================================================================
  # Every test directory is explicitly resolved — zero ambiguity for executor
  # ============================================================================
  directory_decisions:
    keep:
      - dir: "tests/api/"
        reason: "API surface tests — keep"
      - dir: "tests/core/"
        reason: "Core kernel tests — keep (absorbs cortex/, cortex/intelligence/, brain/)"
      - dir: "tests/governance/"
        reason: "Governance tests — keep"
      - dir: "tests/infrastructure/"
        reason: "Infrastructure tests — keep"
      - dir: "tests/intelligence/"
        reason: "Intelligence tests — keep (absorbs cortex/intelligence/, cortex/lens/, lens/)"
      - dir: "tests/mcp/"
        reason: "MCP tool tests — keep"
      - dir: "tests/models/"
        reason: "Data model tests — keep"
      - dir: "tests/observability/"
        reason: "Observability tests — keep"
      - dir: "tests/orchestrators/"
        reason: "Orchestrator tests — keep"
      - dir: "tests/dashboards/"
        reason: "Dashboard tests — keep (absorbs dashboard/)"
      - dir: "tests/golden/"
        reason: "Golden tests — HIGHEST VALUE, always keep"
      - dir: "tests/integration/"
        reason: "Integration tests — keep"
      - dir: "tests/e2e/"
        reason: "E2E tests — keep"
      - dir: "tests/regression/"
        reason: "Regression tests — keep"
      - dir: "tests/contracts/"
        reason: "Contract tests — keep"
      - dir: "tests/chaos/"
        reason: "Chaos tests — keep"
      - dir: "tests/performance/"
        reason: "Performance benchmarks — keep"
      - dir: "tests/fixtures/"
        reason: "Shared fixtures — keep"
      - dir: "tests/unit/"
        reason: "Unit test root — keep"
      - dir: "tests/sdlc/"
        reason: "New: SDLC coverage tests (CiCdOrchestrator, DesignOrchestrator)"

    merge_then_keep:
      - from: "tests/dashboard/"
        into: "tests/dashboards/"
      - from: "tests/cortex/intelligence/"
        into: "tests/core/"
      - from: "tests/cortex/"
        into: "tests/core/"
      - from: "tests/brain/"
        into: "tests/core/"
      - from: "tests/cortex/intelligence/"
        into: "tests/intelligence/"
      - from: "tests/cortex/lens/"
        into: "tests/intelligence/lens/"
      - from: "tests/lens/"
        into: "tests/intelligence/lens/"

    archive:
      - dir: "tests/phase_23/"
        reason: "Phase-named — historical, no active code coverage"
      - dir: "tests/phase_49/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_52/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_53/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_54_a/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_55/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_56/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_56_a/"
        reason: "Phase-named — historical"
      - dir: "tests/phase_71/"
        reason: "Phase-named — historical"
    pre_archive_check: |
      Before archiving any phase-named dir: run it in isolation, extract any
      test covering ACTIVE code (score ≥ 0.3), migrate to proper structure.

  # ============================================================================
  # TEST VALUE SCORING
  # ============================================================================
  test_value_scoring:
    method: |
      For each test file, score on 0-1 scale:
      - 0.3: Has assertions (not just setup/teardown)
      - 0.2: Tests active code (not archived/dead code)
      - 0.2: Has been updated in last 6 months
      - 0.15: Tests a public interface (not internal detail)
      - 0.15: Part of golden/regression suite
    threshold: 0.3
    below_threshold: "Archive to _archive/tests/, do not delete"

  # ============================================================================
  # CONSOLIDATION OPPORTUNITIES
  # ============================================================================
  consolidations:
    - type: "test_structure"
      description: "Mirror tests/ to cortex/ structure"
      benefit: "Any developer finds tests by navigating same tree as source"

    - type: "fixture_centralization"
      description: "Move all shared fixtures to tests/fixtures/"
      benefit: "No duplicate fixture code across test dirs"

    - type: "conftest_hierarchy"
      description: |
        Single root conftest.py + domain-specific conftest.py per subdir.
        No conftest.py duplication across phase-named dirs.

    - type: "test_naming"
      description: |
        All test files must follow: test_{module_name}.py
        All test classes must follow: Test{ClassName}
        All test functions must follow: test_{behavior_description}
      enforcement: "File factory validates test file names"

  # ============================================================================
  # EXECUTION SEQUENCE (Step-by-step)
  # ============================================================================
  execution_sequence:
    - step: 1
      name: "Baseline current test count and coverage"
      commands:
        - "find tests/ -name 'test_*.py' | wc -l"
        - "pytest tests/ --co -q | tail -1"
        - "pytest tests/ --cov=cortex --cov-report=term-missing -q 2>/dev/null | tail -5"
      output: "baseline_metrics.txt (tracked in migration tracker)"

    - step: 2
      name: "Archive phase-named test directories"
      commands:
        - "mkdir -p _archive/tests/"
        - "mv tests/phase_23/ _archive/tests/phase_23/"
        - "mv tests/phase_49/ _archive/tests/phase_49/"
        - "mv tests/phase_52/ _archive/tests/phase_52/"
        - "mv tests/phase_53/ _archive/tests/phase_53/"
        - "mv tests/phase_54_a/ _archive/tests/phase_54_a/"
        - "mv tests/phase_55/ _archive/tests/phase_55/"
        - "mv tests/phase_56/ _archive/tests/phase_56/"
        - "mv tests/phase_56_a/ _archive/tests/phase_56_a/"
        - "mv tests/phase_71/ _archive/tests/phase_71/"
      pre_check: "Run each phase test dir independently, identify high-value tests"
      gate: "Any high-value tests moved to proper structure before archiving"

    - step: 3
      name: "Merge duplicate test directories"
      merges:
        - from: "tests/dashboard/"
          into: "tests/dashboards/"
        - from: "tests/cortex/intelligence/"
          into: "tests/core/"
        - from: "tests/cortex/"
          into: "tests/core/"
        - from: "tests/cortex/intelligence/"
          into: "tests/intelligence/"
        - from: "tests/cortex/lens/"
          into: "tests/intelligence/lens/"
        - from: "tests/brain/"
          into: "tests/core/"
      gate: "Zero duplicate test directories"

    - step: 4
      name: "Run test value scoring"
      description: |
        Score every test file 0-1. Archive any below 0.3 threshold.
        Use existing test_value_scorer.py if available, or manual assessment.
      command: "python -c 'from cortex.testing import score_tests; score_tests(\"tests/\")'"
      gate: "Low-value tests archived, high-value preserved"

    - step: 5
      name: "Restructure tests/ to mirror cortex/"
      description: |
        Create test directory structure that exactly mirrors source:
        tests/unit/core/, tests/unit/governance/, tests/unit/intelligence/,
        tests/unit/orchestrators/, tests/unit/mcp/, etc.
      target: "(see target_structure section above)"
      gate: "Every source dir has a corresponding test dir"

    - step: 6
      name: "Centralize fixtures"
      description: "Move all shared fixtures to tests/fixtures/"
      gate: "No duplicate fixture code"

    - step: 7
      name: "Clean conftest hierarchy"
      description: "Root conftest.py + domain-specific conftest.py per subdir"
      gate: "Single conftest.py chain, no duplication"

    - step: 8
      name: "Validate test naming convention"
      description: "All test files: test_{module}.py, classes: Test{Name}, functions: test_{behavior}"
      command: "find tests/ -name '*.py' -not -name 'test_*' -not -name 'conftest*' -not -name '__init__*' -not -path '*/fixtures/*'"
      expected: "Zero non-conforming files"

    - step: 9
      name: "Run full test suite"
      command: "pytest tests/ -v --tb=short -q"
      expected: "ALL tests pass"

    - step: 10
      name: "Verify coverage"
      command: "pytest tests/ --cov=cortex --cov-report=term-missing -q"
      expected: "Coverage ≥90%"

    - step: 11
      name: "Run capability manifest regression gate"
      command: "pytest tests/golden/regression/test_capability_manifest.py -v"
      expected: "PASS"

    - step: 12
      name: "Commit Phase 05"
      command: "git add -A && git commit -m 'refactor(phase-07): test consolidation — high-value suite, mirrors source'"
      tag: "cortex-refactor-phase-07"

  # ============================================================================
  # EXIT GATE
  # ============================================================================
  exit_gate:
    all_tests_passing: true
    capability_manifest_check: true
    coverage_minimum: 90
    no_phase_named_test_dirs: true
    no_duplicate_test_dirs: true
    test_structure_mirrors_source: true
    zero_low_value_tests: true
    description: |
      Phase 07 is complete when:
      1. Zero phase-named test directories
      2. Zero duplicate test directories
      3. tests/ structure mirrors cortex/ structure
      4. All golden tests pass
      5. Coverage ≥90% across active code
      6. Every test file scores ≥0.3 on value scoring
      7. Capability manifest shows zero regressions

  # ============================================================================
  # VALIDATION LOOP — FINAL STAGE (MANDATORY)
  # ============================================================================
  # Authority: cortex-refactor-master.yaml § validation_loops
  # This stage runs AFTER all deliverables are implemented.
  # It loops until every exit gate check passes. Once clean, CORTEX
  # autonomously begins Phase 08 without user intervention.
  # ============================================================================
  validation_loop:
    stage_id: "VL-07"
    phase: "phase-07"
    next_phase: "phase-08"
    next_phase_spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-08-registry-docs.yaml"
    max_iterations: 10
    iteration_timeout_minutes: 60

    checks:
      - id: "VL-07-C1"
        name: "Zero phase-named test directories"
        command: "find tests/ -type d -name 'phase_*' | wc -l"
        pass_condition: "output is 0"
        on_fail: "Archive all phase_* test directories to _archive/tests/ (after salvaging high-value tests)"

      - id: "VL-07-C2"
        name: "No duplicate test directories"
        command: "python -c \"import os; dirs=os.listdir('tests/'); dupes=[d for d in ['dashboard','cortex/intelligence','cortex/intelligence','cortex/lens'] if d in dirs]; print('dupes:',dupes if dupes else 'none')\""
        pass_condition: "prints dupes: none"
        on_fail: "Merge duplicate test directories — tests/dashboard/ + tests/dashboards/ etc."

      - id: "VL-07-C3"
        name: "Test structure mirrors cortex/ source structure"
        command: "python -c \"import os; src_dirs=set(os.listdir('cortex/')); test_dirs=set(os.listdir('tests/unit/')); src_canonical={'core','governance','intelligence','orchestrators','mcp','infrastructure','observability','models','config','testing','cli','api','tools'}; missing=src_canonical-test_dirs; print('missing test dirs:',missing if missing else 'none')\""
        pass_condition: "prints missing test dirs: none"
        on_fail: "Create missing test subdirectories in tests/unit/ mirroring cortex/ structure"

      - id: "VL-07-C4"
        name: "All golden tests pass"
        command: "pytest tests/golden/ -v --tb=short -q"
        pass_condition: "exit code 0, zero failures"
        on_fail: "Fix failing golden tests — these are highest priority regression guards"

      - id: "VL-07-C5"
        name: "Coverage ≥ 90%"
        command: "pytest tests/ --cov=cortex --cov-report=term-missing -q | tail -3"
        pass_condition: "coverage ≥ 90%"
        on_fail: "Add tests for uncovered modules — priority: core, orchestrators, mcp"

      - id: "VL-07-C6"
        name: "Zero low-value tests (score < 0.3)"
        command: "python -m cortex.testing.test_value_scorer --threshold 0.3 --path tests/ --report-only | grep 'LOW VALUE' | wc -l"
        pass_condition: "output is 0"
        on_fail: "Remove or enhance tests scoring below 0.3 — replace stubs with real assertions"

      - id: "VL-07-C7"
        name: "All tests pass"
        command: "pytest tests/ -v --tb=short -q --ignore=tests/performance"
        pass_condition: "exit code 0, zero failures"
        on_fail: "Fix all test failures — no test regressions from consolidation"

      - id: "VL-07-C8"
        name: "Capability manifest regression gate"
        command: "pytest tests/golden/regression/test_capability_manifest.py -v --tb=short"
        pass_condition: "exit code 0"
        on_fail: "Fix capability regressions — test restructuring must not lose coverage"

    loop_behavior:
      strategy: "conditional_retry"
      description: |
        1. Run all checks (VL-07-C1 through VL-07-C8) in sequence.
        2. If ALL checks pass → loop exits CLEAN → proceed to autonomous_advance.
        3. If ANY check fails:
           a. Apply the on_fail remediation for each failing check.
           b. Record iteration result in cortex-refactor-master.yaml validation_loops.history.
           c. Increment iteration counter.
           d. If iteration_count > max_iterations → HALT with P0 alert to user.
           e. Otherwise → restart from check C1.
        4. Never skip a check — all must pass in the same iteration.

    autonomous_advance:
      enabled: true
      trigger: "All VL-07 checks pass in same iteration"
      actions:
        - action: "Update cortex-refactor-master.yaml"
          changes:
            - "phases[phase-07].status → complete"
            - "phases[phase-07].progress.completed → ISO timestamp"
            - "phases[phase-07].progress.validation_loop_iterations → N"
            - "metadata.counters.pending -= 1"
            - "metadata.counters.complete += 1"
        - action: "Move phase spec to completed/"
          command: "cp cortex-registry/planning/phases/planned/cortex-refactor/phase-07-test-consolidation.yaml cortex-registry/planning/phases/completed/cortex-refactor/"
        - action: "Git checkpoint"
          command: "git add -A && git commit -m 'refactor(phase-07): COMPLETE — high-value test suite, mirrors source, advancing to phase-08'"
        - action: "Load and execute next phase"
          spec: "cortex-registry/planning/phases/planned/cortex-refactor/phase-08-registry-docs.yaml"
          orchestrator: "CortexMasterPlanOrchestrator"
          method: "execute_phase(phase_id='phase-08')"
