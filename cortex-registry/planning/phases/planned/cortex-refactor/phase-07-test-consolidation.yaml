# ==============================================================================
# Phase 07 — Test Reference Consolidation
# CORTEX Cohesive Brain Refactor — Phase 07 of 10
# ==============================================================================
# Status: planned
# Priority: P2
# Estimated Effort: 1 hour
# ==============================================================================

phase:
  id: phase-07-test-consolidation
  title: Test Reference Consolidation
  sequence: 7
  of: 10
  plan: cortex-refactor
  status: planned
  priority: P2
  estimated_effort: 1 hour
  depends_on: phase-06-directory-cleanup
  created: '2026-02-23'

  description: |
    Consolidate stale path references in test files that reference deleted paths
    (cortex/brain, cortex_intelligence, etc.). These are test comment history markers
    and docstrings — NOT broken test assertions (all tests pass).

    26 test files were identified in Phase 03 with stale path references.
    Phase 04 swept the cortex/ Python files. This phase sweeps the tests/.

    NOTE: This phase is P2 (lower priority than P0/P1 phases) because the stale
    references are in comments only — no test failures result from them.

  context:
    files_identified: 26 test files
    reference_type: comments, docstrings, historical markers
    test_health: all tests passing (references are non-functional)
    source: Phase 03 Stage B inventory

  stages:
  - id: A
    name: Verify Current Test Health Baseline
    type: verification
    description: |
      Run smoke tests to confirm baseline before any changes.
    actions:
    - action: smoke_test_baseline
      command: python3 scripts/run_tests.py smoke
      record: pass_count

  - id: B
    name: Sweep Test File Comments
    type: implementation
    description: |
      Update the 26 test files — fix comments, docstrings, historical path markers.
      Only non-functional text changes.
    scope:
      file_count: 26
      patterns:
      - cortex/brain  →  cortex/intelligence (in comments)
      - cortex_intelligence  →  intelligence (in docstrings)
    constraint: |
      MUST NOT change any test logic, assertions, or import statements.
      git diff must show ONLY comment/docstring lines changed.

  - id: C
    name: Post-Sweep Test Verification
    type: verification
    description: |
      Run smoke tests after sweep to verify zero regressions.
    actions:
    - action: smoke_test_post_sweep
      command: python3 scripts/run_tests.py smoke
      gate: same_pass_count_as_baseline

  - id: D
    name: Final Stale Ref Count
    type: verification
    description: |
      Verify stale refs reduced to zero in both cortex/ and tests/.
    actions:
    - action: verify_cortex_clean
      command: grep -r 'cortex_intelligence\|cortex\.brain\|cortex/brain' cortex/ --include='*.py' | grep -v __pycache__ | wc -l
      expected: "0"
    - action: verify_tests_clean
      command: grep -r 'cortex_intelligence\|cortex/brain\|cortex\.brain' tests/ --include='*.py' | grep -v __pycache__ | wc -l
      expected: "0"

  - id: E
    name: Test Consolidation Commit
    type: git
    commit_message: "refactor(tests): sweep stale cortex/brain path comments from 26 test files"

  success_criteria:
  - Zero stale cortex_intelligence/cortex.brain/cortex/brain refs in tests/ comments
  - Zero test regressions (same pass count as baseline)
  - git diff shows only comment/docstring changes in test files
