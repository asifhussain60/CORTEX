# ==============================================================================
# PHASE 07B — TEST QUALITY GATE (Canonical Service)
# ==============================================================================
# Purpose: Bake test-quality.txt 7-step algorithm into CORTEX as a production
#          service so every future test — for CORTEX and production repos —
#          is scored, gated, and categorised automatically.
#
# Authority: test-quality.txt | CORE-008 | CORE-035 | CORE-011 | CORE-012
# Depends on: phase-07 (test consolidation complete, 15,245 signal-dense tests)
# AC-ID: AC-PHASE-07B-TEST-QUALITY-GATE-001
# ==============================================================================

phase:
  id: "phase-07b"
  name: "Test Quality Gate — Canonical Service"
  status: "complete"
  priority: "P0"
  estimated_effort: "4-6 hours"
  actual_duration: "2 hours"
  completed: "2026-02-20T18:00:00Z"
  risk: "low"
  depends_on: ["phase-07"]
  description: |
    Implement TestQualityGate as CORTEX's single canonical scoring service that
    replaces the three existing disconnected scorers (Phase 71 TestValueScorer,
    Phase 51 TestQualityValidator, Wave-2 TestValueScorer).

    The gate enforces the 7-step algorithm from test-quality.txt at three
    enforcement points:

      1. TDDOrchestrator — blocks generation of tests scoring < 7 before written
      2. pytest plugin hook — warns/blocks low-value test collection at --collect
      3. MCP tool cortex_score_tests — callable from any onboarded production repo

    Scoring: Impact(0-3) + Likelihood(0-2) + Detection(0-2) + Efficiency(0-2)
             − MaintenancePenalty(0-2) = Score 0–9
    Gate threshold: Score ≥ 7 = KEEP | 4–6 = REVIEW | < 4 = DELETE

    Golden-test detection: auto-identified by cross-orchestrator span +
    audit log assertion presence (sqlite query in test body).

  # ============================================================================
  # EXISTING CAPABILITY AUDIT (what already exists — CORE-035)
  # ============================================================================
  existing_capabilities:
    - path: "cortex/testing/test_value_scorer.py"
      phase: "Phase 71 S4"
      dimensions: [coverage, edge_cases, mutation, regression, brittleness]
      gap: "No production-risk model, no threat-model step, no golden-test detection"
      disposition: "DEPRECATE — backward-compat re-export only"

    - path: "cortex/testing/test_quality_validator.py"
      phase: "Phase 51 S4"
      dimensions: [coverage, realism, maintainability, brittleness]
      gap: "No business invariant scoring, no Score≥7 gate, no category enforcement"
      disposition: "DEPRECATE — backward-compat re-export only"

    - path: "cortex/orchestrators/intelligence/test_value_scorer.py"
      phase: "Wave-2 S1"
      dimensions: [severity, likelihood, coverage_gap]
      gap: "Isolated to generation, not enforced at creation time"
      disposition: "DEPRECATE — backward-compat re-export only"

    - path: "cortex-registry/core/wiring/quality-gate-specification.yaml"
      gap: "Specifies 80% coverage only — does not encode test-quality.txt rubric"
      disposition: "EXTEND — add test_quality_gate section"

    - path: "cortex/testing/framework/test_categorizer.py"
      gap: "Path-based tier only — no quality scoring"
      disposition: "WIRE — call TestQualityGate during categorisation"

    - path: "cortex/mcp/tools/intelligence_generation.py"
      gap: "Generates tests with no quality gate applied before emission"
      disposition: "WIRE — apply gate before returning generated tests"

  # ============================================================================
  # DELIVERABLES
  # ============================================================================
  deliverables:
    - id: "D1"
      name: "cortex-registry/core/test-quality-gate.yaml"
      type: "registry-yaml"
      description: |
        SSOT scoring weights, banned patterns, golden-test detection rules,
        category thresholds, and per-repo override hooks.
        All tuning happens in YAML — zero Python changes required for threshold changes.

    - id: "D2"
      name: "cortex/testing/quality_gate.py"
      type: "python-module"
      description: |
        Canonical TestQualityGate class implementing the 7-step algorithm.
        Replaces all 3 existing scorers (CORE-035 single canonical implementation).
        Loads rules from D1 YAML. Stateless — parallel-safe by design.
        Exposes: score_file(), score_test(), classify(), is_golden(), gate_passes().
        Backward-compat re-exports: TestValueScorer, TestQualityValidator (deprecated aliases).

    - id: "D3"
      name: "cortex/testing/pytest_quality_plugin.py"
      type: "python-module"
      description: |
        Pytest plugin hook: registers pytest_collect_file to score each test file
        at collection time. With --quality-gate flag: WARN for REVIEW-tier files,
        BLOCK (deselect) for DELETE-tier files. Without flag: silent scoring only.
        Integrates with CortexXdistPlugin (phase-08b) — parallel-safe.

    - id: "D4"
      name: "cortex/mcp/tools/test_quality_tool.py"
      type: "mcp-tool"
      description: |
        MCP tool: cortex_score_tests
        Input: target_path (file or directory), min_score (default 7), report_format
        Output: per-file scores, tier classification, DELETE/REVIEW/KEEP breakdown,
                golden test identification, anti-test list (what was refused)
        Callable from any onboarded production repo via MCP.

    - id: "D5"
      name: "TDDOrchestrator wiring"
      type: "wiring"
      description: |
        Wire TestQualityGate into TDDOrchestrator.generate_tests():
        - Score every candidate test before writing it
        - Block tests scoring < 7 with justification message
        - Auto-upgrade borderline tests (score 6) with suggestions
        - Log all decisions to SQLite audit trail (CORE-027)

    - id: "D6"
      name: "conftest.py registration"
      type: "wiring"
      description: |
        Register pytest_quality_plugin in conftest.py alongside CortexXdistPlugin.
        Activated by default in warning mode. CORTEX_QUALITY_GATE=strict env var
        enables blocking mode for CI.

    - id: "D7"
      name: "tests/unit/testing/test_quality_gate.py"
      type: "test-file"
      description: |
        TDD-first test file (RED phase written first per CORE-008).
        Covers: 7-step algorithm correctness, scoring rubric, golden-test detection,
        category thresholds, backward-compat aliases, MCP tool contract,
        pytest plugin hook, TDDOrchestrator gate, parallel safety.
        Target: 45+ test methods, Score ≥ 7 on all tests (self-verifying).

  # ============================================================================
  # IMPLEMENTATION PLAN (RED → GREEN → REFACTOR)
  # ============================================================================
  execution_stages:
    red_phase:
      file: "tests/unit/testing/test_quality_gate.py"
      test_classes:
        - TestQualityGateScoring        # 7-step algorithm unit tests
        - TestGoldenTestDetection       # cross-orchestrator span + audit log
        - TestCategoryThresholds        # KEEP/REVIEW/DELETE boundaries
        - TestBackwardCompatAliases     # deprecated re-exports don't break
        - TestMCPToolContract           # cortex_score_tests input/output schema
        - TestPytestPluginHook          # collection-time behaviour
        - TestTDDOrchestratorGate       # blocks < 7, approves ≥ 7
        - TestParallelSafety            # stateless — no shared state between workers
      target_methods: 45
      core_compliance:
        - "CORE-008: Tests written before any implementation"
        - "CORE-011: Type hints on all scoring functions"
        - "CORE-012: Docstrings on all public APIs"

    green_phase:
      files_created:
        - "cortex-registry/core/test-quality-gate.yaml"
        - "cortex/testing/quality_gate.py"
        - "cortex/testing/pytest_quality_plugin.py"
        - "cortex/mcp/tools/test_quality_tool.py"
      files_modified:
        - "cortex/orchestrators/core/tdd_orchestrator.py"   # wire gate
        - "conftest.py"                                      # register plugin
        - "cortex/testing/__init__.py"                      # re-export aliases
        - "cortex/mcp/tools/__init__.py"                    # register MCP tool
        - "cortex-registry/core/wiring/quality-gate-specification.yaml"  # extend
      deprecations:
        - "cortex/testing/test_value_scorer.py → re-exports TestQualityGate as TestValueScorer"
        - "cortex/testing/test_quality_validator.py → re-exports TestQualityGate as TestQualityValidator"
        - "cortex/orchestrators/intelligence/test_value_scorer.py → re-exports"

    refactor_phase:
      goals:
        - "Verify all 3 deprecated scorer import paths still resolve (zero regression)"
        - "Run full test suite with --quality-gate flag and verify no false positives"
        - "Verify golden suite: 486/486 still passing"
        - "Score cortex's own test suite with the new gate — validate 100% KEEP"

  # ============================================================================
  # SCORING ALGORITHM SPECIFICATION (from test-quality.txt)
  # ============================================================================
  scoring_algorithm:
    dimensions:
      impact:
        max: 3
        rules:
          - "+1 if security/auth/permission signals present"
          - "+1 if reliability/retry/timeout/idempotency signals present"
          - "+1 if business invariant/compliance/governance signals present"

      likelihood:
        max: 2
        rules:
          - "+1 if orchestration/workflow/pipeline signals > 2 occurrences"
          - "+1 if integration seam signals > 1 occurrence"

      detection_gap:
        max: 2
        rules:
          - "+1 if data correctness signals present (schema/migration/transform)"
          - "+1 if operational signals present (observability/audit/metrics)"

      efficiency:
        max: 2
        rules:
          - "+1 if lines_per_test > 15 (substantive tests)"
          - "+1 if average_asserts_per_test > 2 (multiple assertions)"

      maintenance_penalty:
        max: -2
        rules:
          - "-1 if mock_ratio > 3 mocks per test"
          - "-1 if stub_ratio > 50% tests are skipped"
          - "-1 if trivial_assert_ratio > 60% of assertions are trivial"
          - "-1 if single_assert_ratio > 60% tests have only 1 assertion"

    thresholds:
      keep:   "score >= 7"
      review: "score >= 4 and score < 7"
      delete: "score < 4"

    golden_test_detection:
      criteria:
        - "References ≥ 2 distinct orchestrator classes"
        - "Contains sqlite query (assert from db / pd.read_sql / sqlite3.connect)"
        - "Located in tests/golden/ directory"
        - "Has audit_log assertion or correlation_id check"
      classification: "golden — required, never deleted"

    banned_patterns:
      - pattern: "def test_.*_exists"
        reason: "Trivial existence check — zero production risk"
      - pattern: "def test_.*_imports"
        reason: "Framework guarantee — not a business rule"
      - pattern: "assert .* is not None"
        reason: "Trivial null check — not a business invariant"
      - pattern: "assert isinstance("
        reason: "Type check — Python guarantees this"

  # ============================================================================
  # MCP TOOL SPECIFICATION
  # ============================================================================
  mcp_tool:
    name: "cortex_score_tests"
    category: "OPERATIONS"
    parameters:
      - name: "target_path"
        type: "string"
        description: "File or directory to score"
        required: true
      - name: "min_score"
        type: "integer"
        description: "Minimum acceptable score (default: 7)"
        required: false
        default: 7
      - name: "report_format"
        type: "string"
        enum: ["summary", "detailed", "json"]
        required: false
        default: "summary"
      - name: "include_anti_tests"
        type: "boolean"
        description: "Include list of refused (low-value) tests in output"
        required: false
        default: true
    output:
      - per_file_scores: "Score, tier, dimension breakdown for each file"
      - summary_table: "DELETE/REVIEW/KEEP counts and percentages"
      - golden_tests: "Auto-identified golden tests with criteria met"
      - anti_tests: "Tests refused with justification (if include_anti_tests=true)"
      - recommendations: "Specific fixes for REVIEW-tier tests"

  # ============================================================================
  # EXIT GATES (Definition of Done)
  # ============================================================================
  exit_gates:
    - id: "EG1"
      name: "All 45+ RED tests passing GREEN"
      check: "pytest tests/unit/testing/test_quality_gate.py -q | grep '45 passed'"

    - id: "EG2"
      name: "3 deprecated scorers still importable (backward compat)"
      check: |
        python3 -c "
        from cortex.testing.test_value_scorer import TestValueScorer
        from cortex.testing.test_quality_validator import InteractionOrchestratorQualityAnalyzer
        from cortex.orchestrators.intelligence.test_value_scorer import TestValueScorer as TVS2
        print('backward compat OK')
        "

    - id: "EG3"
      name: "Golden suite zero regression: 486/486 passing"
      check: "pytest tests/golden/ -q --tb=short | grep '486 passed'"

    - id: "EG4"
      name: "MCP tool registered and callable"
      check: "python3 -c \"from cortex.mcp.tools.test_quality_tool import CortexScoreTests; print('MCP tool OK')\""

    - id: "EG5"
      name: "TDDOrchestrator blocks test with score < 7"
      check: "Verified by TestTDDOrchestratorGate test class"

    - id: "EG6"
      name: "Pytest plugin registered in conftest.py"
      check: "grep -n 'pytest_quality_plugin' conftest.py"

    - id: "EG7"
      name: "CORE rules compliance"
      checks:
        - "CORE-002: No markdown/txt files generated"
        - "CORE-008: RED tests written before ALL implementation"
        - "CORE-011: Type hints on all public methods"
        - "CORE-012: Docstrings on all public APIs"
        - "CORE-028: snake_case filenames"
        - "CORE-035: Single canonical implementation (3 old scorers deprecated)"

  # ============================================================================
  # VALIDATION STRATEGY
  # ============================================================================
  validation:
    self_referential: |
      The TestQualityGate must score its own tests ≥ 7.
      If any test in test_quality_gate.py scores < 7, the implementation is wrong.
      This is the ultimate correctness check.
    regression_suite: "486 golden tests + full 15,245 test suite"
    ci_enforcement: |
      Add CORTEX_QUALITY_GATE=strict to CI env vars so blocking mode
      activates on all PRs. New tests scoring < 7 are rejected at collect time.

