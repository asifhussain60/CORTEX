# =============================================================================
# Phase 49 — Golden Test Promotion Pipeline
# Test Classification, Parallel Execution & Real-Time VS Code Progress
# =============================================================================
#
# Authority:  cortex-master.yaml v7.7
# Status:     PLANNED
# Created:    2026-02-18
# Author:     Asif Hussain
# Prerequisite: Phase 48 (Health-Vacuum Integrity Pipeline) ✅ COMPLETE
#
# AC-ID: AC-P49-PLAN-001
# =============================================================================

phase:
  id: "phase-49"
  title: "Golden Test Promotion Pipeline"
  version: "1.0.0"
  status: "planned"
  priority: "P0"
  estimated_duration: "8 hours"
  prerequisites:
    - id: "phase-48"
      title: "Health-Vacuum Integrity Pipeline"
      status: "complete"
    - id: "CORE-055"
      title: "Golden Test Tier Contract (governance rule)"
      status: "to-be-created-in-this-phase"

  description: |
    Phase 49 establishes Golden Tests as the enforceable standard for
    high-blast-radius code in CORTEX. It delivers four things:

    1. TestClassifierOrchestrator — deterministic rule-based classifier that
       inspects any module path and returns: tier (GOLDEN|STANDARD),
       required concern markers (SECURITY/QUALITY/CCL/PERF/CONTRACT),
       target folder, and coverage floor.

    2. Test Promotion Manifest (cortex-registry/governance/test-promotion-manifest.yaml)
       — machine-readable catalog of all 250 promotion candidates scored by a
       7-signal algorithm, tiered P0/P1/P2, with source→target mappings and
       required concern annotations.

    3. Parallel Golden Test Workflow Template
       (cortex-registry/workflows/templates/golden-test-promotion.yaml)
       — pytest-xdist parallelized, convergence-gated DoD loop with real-time
       VS Code terminal progress via ProgressReporter + TestProgressMonitor.

    4. CORE-055 governance rule — closes the gap between CORE-008 (TDD) and
       golden test format requirements.

  # ---------------------------------------------------------------------------
  # SCORING ALGORITHM (deterministic, 7 signals)
  # ---------------------------------------------------------------------------
  promotion_scoring_algorithm:
    description: |
      Each non-golden test file is scored out of 160 points.
      Score is computed at plan time from static analysis of file content.
      Re-run at Phase 49 GREEN time to catch any files added since planning.

    signals:
      - id: "S1"
        name: "MASTER_ORCH"
        description: "File imports or references MasterOrchestrator or TDDOrchestrator"
        weight: 40
        detection: "any(['MasterOrchestrator', 'TDDOrchestrator', 'master_orchestrator'] in content)"

      - id: "S2"
        name: "SECURITY"
        description: "File contains secrets, AES, encryption, injection, or path_traversal logic"
        weight: 30
        detection: "any(['secrets', 'AES', 'encryption', 'injection', 'path_traversal', 'SecurityAgent'] in content)"

      - id: "S3"
        name: "GOVERNANCE"
        description: "File references 3+ CORE rules explicitly"
        weight: 20
        detection: "content.count('CORE-') >= 3"

      - id: "S4"
        name: "AC_ID"
        description: "File contains architecture control ID (AC-ID or AC_START)"
        weight: 15
        detection: "'AC-ID' in content or 'AC_START' in content"

      - id: "S5"
        name: "E2E"
        description: "File covers end-to-end or integration pipeline path"
        weight: 10
        detection: "any(['e2e', 'end_to_end', 'pipeline', 'integration'] in content)"

      - id: "S6"
        name: "COVERAGE_MATRIX"
        description: "File already has P0/P1 scenario tiers declared"
        weight: 25
        detection: "'P0' in content and 'P1' in content"

      - id: "S7"
        name: "MCP"
        description: "File tests MCP tool interface or cortex_process_request entry point"
        weight: 20
        detection: "any(['mcp_tool', 'cortex_process_request', 'CortexMCP'] in content)"

    tiers:
      P0:
        threshold: 100
        label: "Promote immediately (this phase)"
        count: 12
        action: "promote_and_restructure"

      P1:
        threshold: 70
        label: "Promote next cycle (Phase 50)"
        count: 64
        action: "flag_for_promotion"

      P2:
        threshold: 40
        label: "Evaluate manually"
        count: 174
        action: "annotate_for_review"

      STANDARD:
        threshold: 0
        label: "Keep as-is"
        count: 727
        action: "no_action"

  # ---------------------------------------------------------------------------
  # WHAT IS NOT IN SCOPE
  # ---------------------------------------------------------------------------
  out_of_scope:
    - "Migration of existing 17,227 non-golden tests (forward-only contract)"
    - "Deletion of any existing test file"
    - "Changes to pytest.ini test discovery patterns"
    - "Changes to existing passing golden tests in tests/golden/"

  # ---------------------------------------------------------------------------
  # STAGE PLAN (5 stages, TDD throughout)
  # ---------------------------------------------------------------------------
  stages:

    - stage: 1
      name: "Pre-flight & Baseline"
      duration_estimate: "30 minutes"
      orchestrator: "BootstrapOrchestrator"
      tasks:
        - id: "S1-T1"
          name: "git status clean check"
          command: "git status --porcelain"
          pass_condition: "output is empty or only untracked files"
          on_fail: "git stash"

        - id: "S1-T2"
          name: "Baseline test count"
          command: "python -m pytest tests/golden/ -q --tb=no --co -q 2>/dev/null | tail -1"
          capture: "baseline_golden_count"
          expected: "355 passed (±5 pre-existing failures)"

        - id: "S1-T3"
          name: "Verify pytest-xdist available"
          command: "python -c 'import xdist; print(xdist.__version__)'"
          pass_condition: "version >= 3.8.0"
          note: "pytest-xdist==3.8.0 already in requirements.txt ✅"

        - id: "S1-T4"
          name: "Verify ProgressReporter importable"
          command: "python -c 'from cortex.common.progress_reporter import ProgressReporter; print(\"ok\")'"
          pass_condition: "output == 'ok'"

        - id: "S1-T5"
          name: "Verify TestProgressMonitor importable"
          command: "python -c 'from cortex.devx.test_progress_monitor import TestProgressMonitor; print(\"ok\")'"
          pass_condition: "output == 'ok'"

    - stage: 2
      name: "TDD RED — Write all golden tests for Phase 49 components"
      duration_estimate: "2 hours"
      orchestrator: "TDDOrchestrator"
      tdd_phase: "RED"
      parallel: true
      parallel_workers: 4
      test_files_to_create:
        - path: "tests/golden/orchestrators/support/test_classifier_golden.py"
          scenarios:
            - "GC-001: orchestrator path → GOLDEN tier, SECURITY+CCL concerns"
            - "GC-002: MCP tool path → GOLDEN tier, SECURITY+CONTRACT concerns"
            - "GC-003: governance path → GOLDEN tier, SECURITY+QUALITY concerns"
            - "GC-004: brain/intelligence path → GOLDEN tier, CCL+QUALITY concerns"
            - "GC-005: common utility path → STANDARD tier, no mandatory concerns"
            - "GC-006: config path → STANDARD tier"
            - "GC-007: unknown path → STANDARD tier (safe default)"
            - "GC-008: TestDecision.concerns list is never empty for GOLDEN tier"
            - "GC-009: TestDecision.target_folder mirrors source structure under tests/golden/"
            - "GC-010: TestDecision.coverage_floor == 95 for GOLDEN, 80 for STANDARD"
            - "GC-011: classifier raises no exceptions for any valid path string"
            - "GC-012: classify() is idempotent (same input = same output)"
            - "GC-013: agents/ path → GOLDEN, SECURITY+CONTRACT"
            - "GC-014: domain_brain/ path → GOLDEN, CCL"
            - "GC-015: TestDecision dataclass has required_markers list"

        - path: "tests/golden/orchestrators/support/test_parallel_runner_golden.py"
          scenarios:
            - "GP-001: parallel runner accepts list of test paths"
            - "GP-002: output includes per-worker progress stream"
            - "GP-003: final summary aggregates across all workers"
            - "GP-004: failed worker does not kill other workers"
            - "GP-005: dry_run=True collects without executing"
            - "GP-006: ProgressReporter.start_step called for each worker"
            - "GP-007: ProgressReporter.complete_step called on worker finish"
            - "GP-008: TestProgressMonitor integration — output streamed in real-time"

        - path: "tests/golden/governance/test_core_055_golden.py"
          scenarios:
            - "GR-001: GOLDEN-tier file in tests/unit/ → CORE-055 violation"
            - "GR-002: GOLDEN-tier file in tests/golden/ → compliant"
            - "GR-003: file missing coverage matrix comment → CORE-055 violation"
            - "GR-004: file missing AC-ID → CORE-055 violation"
            - "GR-005: STANDARD-tier file anywhere → no CORE-055 check applied"
            - "GR-006: protected files exempt from CORE-055"

    - stage: 3
      name: "TDD GREEN — Implement all Phase 49 components"
      duration_estimate: "3 hours"
      orchestrator: "TDDOrchestrator"
      tdd_phase: "GREEN"
      parallel: false
      files_to_create:

        - path: "cortex/orchestrators/support/test_classifier_orchestrator.py"
          type: "orchestrator"
          description: |
            TestClassifierOrchestrator — pure deterministic classifier.
            No ML, no network, no disk I/O. Inspects module path string.
            Returns TestDecision dataclass.
          key_classes:
            - "TestTier(Enum): GOLDEN | STANDARD"
            - "TestConcern(Enum): SECURITY | QUALITY | CCL | PERF | CONTRACT"
            - "TestDecision(dataclass): tier, concerns, target_folder, required_markers, coverage_floor"
            - "TestClassifierOrchestrator: classify(module_path: str) -> TestDecision"
          classification_rules:
            golden_paths:
              - pattern: "cortex/orchestrators/"
                concerns: ["SECURITY", "QUALITY", "CCL"]
              - pattern: "cortex/mcp/tools/"
                concerns: ["SECURITY", "CONTRACT"]
              - pattern: "cortex/governance/"
                concerns: ["SECURITY", "QUALITY"]
              - pattern: "cortex/brain/"
                concerns: ["CCL", "QUALITY"]
              - pattern: "cortex/intelligence/"
                concerns: ["CCL", "SECURITY"]
              - pattern: "cortex/domain_brain/"
                concerns: ["CCL"]
              - pattern: "cortex/agents/"
                concerns: ["SECURITY", "CONTRACT"]
            standard_paths:
              - pattern: "cortex/common/"
                concerns: ["QUALITY"]
              - pattern: "cortex/config/"
                concerns: []
              - pattern: "cortex/models/"
                concerns: []
              - pattern: "cortex/templates/"
                concerns: []
            default: "STANDARD"
          constants:
            GOLDEN_COVERAGE_FLOOR: 95
            STANDARD_COVERAGE_FLOOR: 80
            MAX_TARGET_PATH_LENGTH: 120

        - path: "cortex/orchestrators/support/parallel_golden_runner.py"
          type: "orchestrator"
          description: |
            ParallelGoldenRunner — wraps pytest-xdist with real-time
            VS Code terminal progress via ProgressReporter + TestProgressMonitor.
            Runs test groups in parallel workers, aggregates results, streams
            per-worker progress bars to the terminal.
          key_classes:
            - "WorkerResult(dataclass): worker_id, paths, passed, failed, duration"
            - "ParallelRunResult(dataclass): total_passed, total_failed, workers, duration"
            - "ParallelGoldenRunner: run(test_paths, workers=4, dry_run=False) -> ParallelRunResult"
          integration_points:
            - "cortex.common.progress_reporter.ProgressReporter"
            - "cortex.devx.test_progress_monitor.TestProgressMonitor"
            - "cortex.execution.feedback_loop.FeedbackLoop"
          terminal_output_format: |
            ╔══════════════════════════════════════════════════╗
            ║  CORTEX Golden Test Runner — Parallel Mode       ║
            ╠══════════════════════════════════════════════════╣
            ║  Workers: 4  |  Total: 355 tests                 ║
            ╠══════════════════════════════════════════════════╣
            ║  Worker-1 [orchestrators]  ████████░░  80%  42✓ ║
            ║  Worker-2 [governance]     ██████████ 100%  28✓ ║
            ║  Worker-3 [brain]          █████░░░░░  50%  19✓ ║
            ║  Worker-4 [mcp]            ███████░░░  70%  31✓ ║
            ╠══════════════════════════════════════════════════╣
            ║  Elapsed: 4.2s  |  ETA: 1.8s  |  Pass: 120/145  ║
            ╚══════════════════════════════════════════════════╝
          xdist_command_pattern: |
            python -m pytest {test_paths} -n {workers} -v
              --tb=short
              -p cortex.devx.pytest_progress_plugin
              --timeout=30
          note: "No new deps. pytest-xdist==3.8.0 already in requirements.txt"

        - path: "cortex-registry/core/governance/skull-rules.yaml"
          type: "governance_amendment"
          action: "append_rule"
          rule_id: "CORE-055"
          rule_name: "Golden Test Tier Contract"
          rule_principle: "High-Blast-Radius Code Requires Scenario-Declared Tests"
          rule_severity: "blocked"
          rule_category: "quality_gates"
          rule_description: |
            Any Python module whose path matches GOLDEN_PATHS (as defined in
            TestClassifierOrchestrator) MUST have its tests in tests/golden/,
            not in tests/unit/. Tests MUST include:
              - Coverage matrix comment block (P0/P1/P2 tiers)
              - AC-ID (architecture control identifier)
              - At least one test class per required concern marker
            STANDARD-tier modules are exempt from this rule.
          validation:
            - "Source path in GOLDEN_PATHS → test in tests/golden/ (not tests/unit/)"
            - "Golden test file contains '# P0' and '# P1' coverage matrix"
            - "Golden test file contains 'AC-ID:' or 'AC_START:'"
            - "No golden-tier test in tests/unit/ (wrong folder = violation)"
          enforcement: "pre-commit hook (existing .githooks/pre-commit)"

        - path: "cortex-registry/governance/test-promotion-manifest.yaml"
          type: "manifest"
          description: |
            Machine-readable catalog of all 250 promotion candidates.
            Generated by 7-signal scoring algorithm at plan time.
            Re-generated at GREEN time to catch new files.
            Source of truth for which tests are promoted in which phase.
          structure: "see cortex-registry/governance/test-promotion-manifest.yaml (created in Stage 3)"

    - stage: 4
      name: "REFACTOR — Code quality pass"
      duration_estimate: "45 minutes"
      orchestrator: "RefactoringOrchestrator"
      tdd_phase: "REFACTOR"
      operations:
        - "Add Google-style docstrings to all public methods (CORE-012)"
        - "100% type hints on all functions (CORE-011)"
        - "Ensure TestClassifierOrchestrator has zero external dependencies"
        - "Ensure ParallelGoldenRunner has no hardcoded worker counts"
        - "Verify to_kebab_case used for any filename generation (CORE-028)"
      convergence_gate:
        max_cycles: 3
        predicate: "all_tests_pass and no_type_errors and docstring_coverage == 100"

    - stage: 5
      name: "Verification, DoD Loop & Teardown"
      duration_estimate: "1 hour"
      orchestrator: "EnforcementOrchestrator"
      workflow_template: "cortex-registry/workflows/templates/golden-test-promotion.yaml"
      dod_loop:
        description: |
          The DoD loop runs the Phase 49 golden tests in parallel, then
          applies the REFACTOR convergence gate. Repeats until all conditions
          are simultaneously true.
        conditions:
          - id: "DOD-1"
            name: "All new golden tests passing"
            predicate: "tests_passed == tests_written"
          - id: "DOD-2"
            name: "Zero regressions in existing suite"
            predicate: "golden_suite_failures == baseline_golden_failures"
          - id: "DOD-3"
            name: "CORE-055 rule present in skull-rules.yaml"
            predicate: "grep -c 'CORE-055' cortex-registry/core/governance/skull-rules.yaml >= 1"
          - id: "DOD-4"
            name: "Test promotion manifest exists and is valid YAML"
            predicate: "python -c 'import yaml; yaml.safe_load(open(\"cortex-registry/governance/test-promotion-manifest.yaml\"))'"
          - id: "DOD-5"
            name: "TestClassifierOrchestrator importable"
            predicate: "python -c 'from cortex.orchestrators.support.test_classifier_orchestrator import TestClassifierOrchestrator'"
          - id: "DOD-6"
            name: "ParallelGoldenRunner importable"
            predicate: "python -c 'from cortex.orchestrators.support.parallel_golden_runner import ParallelGoldenRunner'"
          - id: "DOD-7"
            name: "MCP classify operation responds"
            predicate: "cortex_health_orchestrate(operation='classify', module_path='cortex/orchestrators/core/tdd_orchestrator.py') returns tier='GOLDEN'"
        max_iterations: 5
        on_max_exceeded: "HALT_AND_REPORT"

      teardown:
        - "git add all Phase 49 files"
        - "git commit -m 'feat: Phase 49 — Golden Test Promotion Pipeline'"
        - "Update cortex-master.yaml: v7.7, phase-49 planned→complete"
        - "Update cortex-master.yaml: total_phases 49, completion 99%"

  # ---------------------------------------------------------------------------
  # GOLDEN TEST FILES CREATED IN THIS PHASE
  # ---------------------------------------------------------------------------
  golden_tests:
    location: "tests/golden/orchestrators/support/ + tests/golden/governance/"
    count: 29
    categories:
      - "TestClassifierOrchestrator (15 scenarios: GC-001..GC-015)"
      - "ParallelGoldenRunner (8 scenarios: GP-001..GP-008)"
      - "CORE-055 governance (6 scenarios: GR-001..GR-006)"
    coverage_floor: 95
    parallel_execution: true
    progress_integration: "cortex.devx.pytest_progress_plugin"

  # ---------------------------------------------------------------------------
  # P0 PROMOTION CANDIDATES (immediate — this phase)
  # ---------------------------------------------------------------------------
  p0_promotions:
    count: 12
    note: |
      These files score >= 100 on the 7-signal algorithm.
      They are NOT physically moved in this phase (no migration).
      They are annotated in the manifest as 'promote_and_restructure'.
      Physical promotion is deferred to Phase 50 to avoid regression risk.
    files:
      - source: "tests/integration/test_plan_system_integration.py"
        score: 110
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, COVERAGE_MATRIX]
        concerns: [quality, contract]
      - source: "tests/integration/workflows/test_architect_mode.py"
        score: 110
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, COVERAGE_MATRIX]
        concerns: [quality, contract]
      - source: "tests/e2e/test_mega_b_integration.py"
        score: 105
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, MCP]
        concerns: [security, contract]
      - source: "tests/unit/orchestrators/workflow/test_post_phase_dedup.py"
        score: 105
        signals: [MASTER_ORCH, SECURITY, GOVERNANCE, AC_ID]
        concerns: [security, quality]
      - source: "tests/integration/deployment/test_exit_gate_deployment.py"
        score: 105
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, MCP]
        concerns: [quality, contract]
      - source: "tests/unit/orchestrators/workflow/test_holistic_refactoring_sweep.py"
        score: 105
        signals: [MASTER_ORCH, SECURITY, GOVERNANCE, AC_ID]
        concerns: [security, quality]
      - source: "tests/unit/orchestrators/core/test_interaction_orchestrator.py"
        score: 105
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, MCP]
        concerns: [quality, contract]
      - source: "tests/phase_53/test_s7_s9_integration_governance.py"
        score: 105
        signals: [MASTER_ORCH, GOVERNANCE, AC_ID, E2E, MCP]
        concerns: [quality, contract]
      - source: "tests/integration/intent_router/test_mode_routing_integration.py"
        score: 100
        signals: [SECURITY, AC_ID, E2E, COVERAGE_MATRIX, MCP]
        concerns: [security, contract]
      - source: "tests/unit/remediation/test_remediation_verification.py"
        score: 100
        signals: [MASTER_ORCH, SECURITY, GOVERNANCE, E2E]
        concerns: [security, quality]
      - source: "tests/unit/brain/core/test_mandatory_checkpoints.py"
        score: 100
        signals: [MASTER_ORCH, SECURITY, GOVERNANCE, E2E]
        concerns: [security, quality]
      - source: "tests/integration/test_rephrase_mcp_integration.py"
        score: 100
        signals: [MASTER_ORCH, SECURITY, GOVERNANCE, E2E]
        concerns: [security, quality]

  # ---------------------------------------------------------------------------
  # MCP EXPOSURE
  # ---------------------------------------------------------------------------
  mcp_changes:
    - tool: "cortex_health_orchestrate"
      file: "cortex/mcp/tools/health_orchestrator_tool.py"
      change: "Add operation='classify' to existing CortexHealthOrchestrate"
      new_op_spec:
        operation: "classify"
        params:
          module_path:
            type: string
            required: true
            description: "Absolute or relative path to Python module"
        returns:
          tier: "GOLDEN | STANDARD"
          concerns: "list[str]"
          target_folder: "str"
          required_markers: "list[str]"
          coverage_floor: "int"
      note: "Zero new MCP tool files. Extends existing tool (CORE-035)."

  # ---------------------------------------------------------------------------
  # GOVERNANCE
  # ---------------------------------------------------------------------------
  governance:
    rules_enforced:
      - "CORE-008: TDD (RED→GREEN→REFACTOR, 29 golden tests before any implementation)"
      - "CORE-011: 100% type hints"
      - "CORE-012: Google-style docstrings"
      - "CORE-028: kebab-case files, snake_case Python symbols"
      - "CORE-035: single canonical implementation (no duplicate classifiers)"
      - "CORE-049: silent autonomous execution"
      - "CORE-055: Golden Test Tier Contract (NEW — created in this phase)"
    rules_created:
      - "CORE-055: Golden Test Tier Contract"
    pre_commit_checks:
      - "29 golden test files validated (import check)"
      - "MCP environment integrity (16 → 16 tools, classify op added)"

  # ---------------------------------------------------------------------------
  # REGRESSION RISK
  # ---------------------------------------------------------------------------
  regression_risk:
    score: 0.05
    rationale: |
      TestClassifierOrchestrator: pure read-only, no side effects.
      ParallelGoldenRunner: wraps existing pytest-xdist, does not modify tests.
      CORE-055: additive rule, no existing test is retroactively invalidated.
      classify op: additive to CortexHealthOrchestrate, existing ops unchanged.
      No test files are moved, deleted, or renamed in this phase.
    zero_migration_guarantee: true

  # ---------------------------------------------------------------------------
  # SUCCESS CRITERIA (ALL must be simultaneously true to close Phase 49)
  # ---------------------------------------------------------------------------
  success_criteria:
    - "29 new golden tests passing (GC-001..015, GP-001..008, GR-001..006)"
    - "Zero regressions (existing 355 golden tests + 5 pre-existing failures unchanged)"
    - "TestClassifierOrchestrator importable, classify() returns correct TestDecision"
    - "ParallelGoldenRunner runs tests in parallel with real-time terminal progress"
    - "CORE-055 appended to skull-rules.yaml"
    - "test-promotion-manifest.yaml created in cortex-registry/governance/"
    - "golden-test-promotion.yaml workflow template created"
    - "cortex-master.yaml updated to v7.7, 49/49 phases"
    - "git commit with all Phase 49 files"
