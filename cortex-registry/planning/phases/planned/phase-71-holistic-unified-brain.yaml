# ─────────────────────────────────────────────────────────────────────────────
# EXPANDED SCOPE — Areas with the same structural gap pattern
# ─────────────────────────────────────────────────────────────────────────────
# The Phase 70 GAP survey identified 5 additional cross-cutting layers that are
# outside the matrix entirely. The same "wired in docs, not in code" anti-pattern
# was found in ALL of:
#   1. OPJ (Operational Pattern Journal) — not consulted by MasterOrchestrator
#   2. IntentClassifier (new in Phase 70A) — not wired into OPJMixin feedback
#   3. GovernanceRegistry — not consulted at workflow routing time
#   4. CompanyKnowledge loader — not feeding LENS context
#   5. Memory Tier cross-pollination — T1↔T2↔T3 migration not automated

expanded_scope:
  areas_with_same_gap_pattern:

    - id: ES-001
      area: "OPJ ↔ MasterOrchestrator"
      pattern: "OPJMixin exists but MasterOrchestrator never inherits it"
      gap: "MasterOrchestrator designs work without consulting prior success/failure patterns"
      evidence: "grep OPJMixin cortex/orchestrators/core/master_orchestrator.py → 0 results"
      priority: P0
      severity: "CRITICAL — the apex orchestrator is pattern-blind"
      fix_class: "Add OPJMixin to MasterOrchestrator; call _opj_consult() in coordinate_operation()"

    - id: ES-002
      area: "IntentClassifier ↔ OPJ feedback loop"
      pattern: "IntentClassifier (Phase 70A) classifies but never records outcomes to OPJ"
      gap: "Classification decisions never become learned patterns in the journal"
      evidence: "intent_classifier.py has no _opj_record_* calls"
      priority: P1
      fix_class: "Wire IntentRouter._opj_record_success/failure() after each routing decision"

    - id: ES-003
      area: "GovernanceRegistry ↔ IntentRouter routing"
      pattern: "GovernanceRegistry loaded only in _governance_gate(), not consulted for routing"
      gap: "Intent routing ignores live CORE rule violations that should elevate complexity level"
      evidence: "intent_router_impl.py: governance_registry only consulted in _validate_governance()"
      priority: P1
      fix_class: "Wire GovernanceRegistry.get_active_violations() → IntentRouter complexity_score"

    - id: ES-004
      area: "CompanyKnowledgeProvider ↔ LENS analysis"
      pattern: "company_domain_loader.py exists but LENS analyzers never import it"
      gap: "LENS analysis is workspace-generic; company/project context not injected"
      evidence: "cortex/intelligence/knowledge/company_domain_loader.py — 0 LENS imports"
      priority: P1
      fix_class: "CompanyKnowledgeProvider.load() → LENS analyze() context enrichment"

    - id: ES-005
      area: "Memory Tier T1↔T2↔T3 cross-pollination"
      pattern: "Tiers exist as isolated silos; OPJ patterns never auto-promote to T1 learned"
      gap: "Knowledge captured in OPJ (T3 scratch) never graduates to T1 (persistent learned)"
      evidence: "opj_writer.py writes YAML; tier1_learned/ has no OPJ reader"
      priority: P1
      fix_class: "OPJReader high-confidence entries (>0.80) auto-promoted to T1 via knowledge_retention_store"

    - id: ES-006
      area: "MasterOrchestrator ↔ quality-gate-specification.yaml / mcp-priority-policy.yaml"
      pattern: "Governance YAML files written but not loaded at runtime by any orchestrator"
      gap: "Forbidden command patterns (raw pytest, skip-tests) exist in YAML but no runtime enforcement"
      evidence: "grep -r 'quality-gate-specification' cortex/ → 0 Python imports"
      priority: P1
      fix_class: "EnforcementOrchestrator reads forbidden_commands list from YAML at init"

