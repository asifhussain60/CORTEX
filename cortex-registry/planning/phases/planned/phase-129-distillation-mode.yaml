# EXECUTION NOTES
# ─────────────────────────────────────────────────────────────────────────────
execution_notes: |
  Sub-phase parallelism opportunity after 129-a completes:
    - 129-b (core orchestrator) and 129-d (routing wiring) can run in parallel
    - 129-c (MCP tool) depends only on 129-b
    - 129-e (workflow template) depends only on 129-b
    - 129-f (docs) depends on 129-d + 129-e
    - 129-final depends on all others

  Zero regression guarantee:
    DistillationOrchestrator is a new file in support/ — no existing orchestrator is modified.
    CortexDistill is a new MCP tool — no existing tool is modified.
    IntentType.DISTILL is an additive enum value — no existing value is changed.
    Routing additions are additive — no existing route is removed or altered.

  Key disambiguation:
    DIGEST → produces EnhancementProposal[] stored in enhancement-history.yaml
    DISTILL → produces a single synthesised prompt string; rewrites input file in place
    REPHRASE → operates on inline text (Stage -1); DISTILL calls it as a compression sub-pass only
