# Full detail file — thin index pointer lives in cortex-registry/cortex-master.yaml
# Governance: master-plan-phase-lifecycle.yaml checkpoint-create checks this file

id: "phase-129"
title: "Distillation Mode — Conversational Entropy Reduction to Executable Prompt"
created: "2026-03-05"
status: PLANNED
priority: P1
governance_authority:
  - CORE-002   # All output inline — no .md/.txt files
  - CORE-008   # TDD mandatory — RED → GREEN → REFACTOR
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-028   # File naming: snake_case only
  - CORE-035   # Single canonical implementation — no duplicates
  - CORE-049   # Silent autonomous execution
  - CORE-064   # Sweep Completeness Contract — no partial sweeps
  - CORE-068   # Universal Convergence Gate — detect→fix→rescan until 0 P0/P1
sweep_catalogue_id: "SWEEP-129-DISTILLATION-MODE"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: User architectural proposal evaluated 2026-03-05 via CORTEX challenge-first protocol.
  Problem: Long AI chat sessions (100–300+ messages) become entropy engines — repeated
    clarifications, abandoned branches, redundant explanations, debugging chatter. The
    resulting transcript is unusable as an operational prompt for subsequent orchestrators.
  Opportunity: A first-class DISTILL mode that ingests a chat transcript file, performs
    semantic analysis via LENS, reconstructs the original intent graph, reconciles
    completed vs pending work, and synthesises a single token-optimised executable prompt
    that replaces the original file in place.
  Architectural fit: New intent DISTILL routed to DistillationOrchestrator. Reuses
    ChatFileDetector (from DigestSessionOrchestrator) for detection and
    RequestRephraseOrchestrator.analyze() for compression. Does NOT subclass either —
    composition only (CORE-035).
  Baseline measurements:
    - Smoke tests: 2775 passed (2026-03-05 baseline)
    - Preflight: 424 passed
    - IntentType enum: 29 values (DISTILL is the 30th)
    - MCP tools: 36 registered in mcp_registry.py (CortexDistill is the 31st)
  Differentiation from DIGEST:
    - DIGEST → produces EnhancementProposal[] for knowledge store ingestion
    - DISTILL → produces a single synthesised executable prompt string; rewrites file in place

