  # ── 129-d: IntentRouter Wiring ────────────────────────────────────────────
  - id: "phase-129-d"
    title: "Wire DISTILL Intent into IntentRouter, IntentClassifier, and Routing Tables"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-129-04"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "1.5 hours"
    depends_on: ["phase-129-a"]
    prerequisite: "phase-129-a completion_gate PASSED (IntentType.DISTILL exists)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"
    note: "Can run in parallel with 129-b and 129-c after 129-a completes."

    tdd_cycle:
      red:
        action: "Write failing tests asserting DISTILL routes to DistillationOrchestrator in all routing layers"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/core/test_distill_routing.py — ALL tests FAIL"
        blocker: "Do NOT add routing entries until tests are RED"
      green:
        action: "Add DISTILL routing to all 5 files listed in implementation_contract"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/core/test_distill_routing.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until tests are GREEN"
      refactor:
        action: "Verify keyword list does not conflict with DIGEST or REPHRASE keywords; run full routing test suite"
        gate: "python3 scripts/run_tests.py dir tests/unit/orchestrators/core/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until gate passes"

    implementation_contract:
      changes:
        - file: "cortex-registry/core/specifications/intent-routing-rules.yaml"
          change: |
            Add intent_distill block after intent_rephrase:
              id: "intent_distill"
              name: "Distill"
              keywords: ["distill", "distill session", "compress transcript", "summarise chat", "extract prompt", "turn chat into prompt"]
              handler: "DistillationOrchestrator"
              confidence_threshold: 0.80
              fallback_handler: "InteractionOrchestrator"
              governance_rules: ["CORE-002", "CORE-064"]
              description: "Distil a chat transcript into a single optimised executable prompt"
