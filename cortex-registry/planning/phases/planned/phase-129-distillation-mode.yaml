  # ── 129-b: DistillationOrchestrator (5-stage pipeline) ───────────────────
  - id: "phase-129-b"
    title: "Implement DistillationOrchestrator — 5-Stage Transcript-to-Prompt Pipeline"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-129-02"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "3–4 hours"
    depends_on: ["phase-129-a"]
    prerequisite: "phase-129-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write ALL failing tests for DistillationOrchestrator and its 5 internal stages"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/support/test_distillation_orchestrator.py — ALL tests must FAIL"
        blocker: "Do NOT write implementation until every test is RED (import error counts as RED)"
      green:
        action: "Implement cortex/orchestrators/support/distillation_orchestrator.py with all 5 stages"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/support/test_distillation_orchestrator.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until all tests are GREEN"
      refactor:
        action: "Add type hints, docstrings, confirm composition (not inheritance) of ChatFileDetector and RequestRephraseOrchestrator"
        gate: "python3 scripts/run_tests.py dir tests/unit/orchestrators/support/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until gate passes"

    implementation_contract:
      file: "cortex/orchestrators/support/distillation_orchestrator.py"
      class: "DistillationOrchestrator"
      mixins:
        - "OrchestratorProtocolMixin"
        - "WorkflowEnforcementMixin"
      composition_reuse:
        - class: "ChatFileDetector"
          import: "cortex.sensory.chat_file_detector"
          purpose: "Stage 1 — transcript detection and confidence scoring"
        - class: "RequestRephraseOrchestrator"
          import: "cortex.orchestrators.core.request_rephrase_orchestrator"
          purpose: "Stage 5 — compression pass on synthesised output (call .analyze(), not inherit)"
      dataclasses:
        - name: "ConversationSegment"
          fields: ["block_type: SegmentType", "content: str", "turn_index: int", "confidence: float"]
        - name: "IntentGraph"
          fields: ["original_objective: str", "subtasks: List[str]", "completed: List[str]", "pending: List[str]", "abandoned: List[str]", "constraints: List[str]"]
        - name: "DistillationResult"
          fields: ["success: bool", "distilled_prompt: str", "tokens_saved: int", "segments_processed: int", "confidence_score: float", "error_message: Optional[str]"]
      enums:
        - name: "SegmentType"
          values: ["USER_REQUEST", "AI_RESPONSE", "IMPLEMENTATION_ACTION", "CLARIFICATION", "NOISE"]
      pipeline_stages:
        stage_1_detection:
          name: "ChatFileDetector — transcript classification"
          input: "file_path: str"
          output: "ChatFileScore (confidence ≥ 5.0 to proceed)"
          guard: "Raise DistillationError if score < 5.0 with message 'not a chat transcript'"
        stage_2_segmentation:
          name: "ConversationSegmenter — semantic block extraction"
          input: "raw transcript text"
          output: "List[ConversationSegment]"
          rules:
            - "USER_REQUEST: lines following '**User:**' / 'User:' / '> User' patterns"
            - "AI_RESPONSE: lines following '**GitHub Copilot:**' / 'Copilot:' / 'AI:' patterns"
            - "IMPLEMENTATION_ACTION: lines containing ✅ / 'AC_COMPLETE' / 'Ran terminal' / file paths with changes"
            - "CLARIFICATION: AI questions back to user / 'Could you clarify' / 'Did you mean'"
            - "NOISE: repeated explanations / markdown headers / separator lines / duplicate content"
          noise_patterns:
            - "repeated_explanations: same concept stated >2 times across segments"
            - "restated_requirements: user restates a requirement already captured in an earlier USER_REQUEST"
            - "debugging_chatter: intermediate error messages resolved in same session"
            - "duplicate_prompts: structurally identical USER_REQUEST segments"
        stage_3_intent_recovery:
          name: "IntentGraphReconstructor — objective and task graph"
          input: "List[ConversationSegment]"
          output: "IntentGraph"
          rules:
            - "original_objective: first USER_REQUEST with highest complexity score"
            - "subtasks: USER_REQUEST segments after the first that introduce new work items"
            - "completed: subtasks whose corresponding AI_RESPONSE contains ✅ or 'COMPLETE'"
            - "pending: subtasks with no matching IMPLEMENTATION_ACTION or with partial ✅"
            - "abandoned: subtasks followed by a different USER_REQUEST with no resolution"
            - "constraints: segments containing 'must', 'should not', 'never', 'always', CORE-* refs"
        stage_4_reconciliation:
          name: "StateReconciler — completed vs remaining diff"
          input: "IntentGraph"
          output: "IntentGraph (refined — abandoned branches pruned)"
          rules:
            - "Remove abandoned subtasks from pending (do not include in final prompt)"
            - "Promote high-confidence completed items to confirmed_completed list"
            - "Flag any subtask where completed evidence is ambiguous (confidence < 0.7) as 'needs_verification'"
        stage_5_synthesis:
          name: "PromptSynthesiser — single optimised output prompt"
          input: "IntentGraph (reconciled)"
          output: "str (distilled prompt)"
          template: |
            ## Objective
            {original_objective}

            ## Confirmed Completed Work
            {completed items as bulleted list — omit if empty}

            ## Remaining Tasks
            {pending items as numbered list}

            ## Constraints & Requirements
            {constraints as bulleted list}

            ## Execution Instructions
            Follow CORTEX.prompt.md. Execute remaining tasks in order using TDD-first approach (CORE-008). All output inline (CORE-002).
          compression_pass: "Call RequestRephraseOrchestrator.analyze(synthesised_text) to apply token optimisation"
          in_place_rewrite: "overwrite original file_path with distilled_prompt — no new files created (CORE-002)"

    tdd_sequence:
      red:
        - "test_distillation_orchestrator_importable — import succeeds without error"
        - "test_distillation_result_dataclass — DistillationResult has all required fields"
        - "test_conversation_segment_dataclass — ConversationSegment has block_type, content, turn_index, confidence"
        - "test_intent_graph_dataclass — IntentGraph has all 6 fields"
        - "test_segment_type_enum — SegmentType has all 5 values"
        - "test_stage1_rejects_non_chat_file — score < 5.0 → DistillationResult.success=False"
        - "test_stage2_segments_user_requests — '**User:**' lines classified as USER_REQUEST"
        - "test_stage2_segments_ai_responses — '**GitHub Copilot:**' lines classified as AI_RESPONSE"
        - "test_stage2_segments_implementation_actions — lines with ✅ classified as IMPLEMENTATION_ACTION"
        - "test_stage2_filters_noise — duplicate and repeated segments removed"
        - "test_stage3_recovers_original_objective — first complex USER_REQUEST becomes original_objective"
        - "test_stage3_identifies_completed_tasks — ✅ responses map to completed subtasks"
        - "test_stage3_identifies_pending_tasks — unresolved subtasks map to pending"
        - "test_stage3_identifies_abandoned_branches — redirected subtasks excluded"
        - "test_stage4_removes_abandoned_from_pending — abandoned not in final pending list"
        - "test_stage5_produces_5_section_prompt — output has Objective/Completed/Remaining/Constraints/Instructions"
        - "test_stage5_in_place_rewrite — original file content replaced with distilled prompt"
        - "test_distill_end_to_end — full pipeline from file_path to DistillationResult.success=True"
        - "test_distill_tokens_saved_positive — tokens_saved > 0 for any real transcript"
        - "test_distill_confidence_score_range — 0.0 ≤ confidence_score ≤ 10.0"
      green:
        - "Create cortex/orchestrators/support/distillation_orchestrator.py"
        - "Implement SegmentType enum, ConversationSegment, IntentGraph, DistillationResult dataclasses"
        - "Implement ConversationSegmenter._segment() with pattern-matching for all 5 block types"
        - "Implement IntentGraphReconstructor._reconstruct() using segment list"
        - "Implement StateReconciler._reconcile() to prune abandoned branches"
        - "Implement PromptSynthesiser._synthesise() using 5-section template + RequestRephraseOrchestrator.analyze()"
        - "Implement DistillationOrchestrator.distill(file_path, overwrite=True) — main entry point"
        - "Wire OrchestratorProtocolMixin + WorkflowEnforcementMixin"
      refactor:
        - "Add Google-style docstrings to all public methods (CORE-012)"
        - "Verify type hints on all signatures (CORE-011)"
        - "Confirm ChatFileDetector used via composition, not inheritance (CORE-035)"
        - "Confirm RequestRephraseOrchestrator.analyze() called as static method, not subclassed"
        - "Confirm no file is created — in-place rewrite only (CORE-002)"

    acceptance_criteria:
      - "DistillationOrchestrator.distill(file_path) returns DistillationResult.success=True for valid transcripts"
      - "Original file replaced in-place with 5-section distilled prompt"
      - "tokens_saved > 0 for any transcript ≥ 50 lines"
      - "Non-chat files rejected with success=False and descriptive error_message"
      - "All 20 tdd_sequence.red tests GREEN"
      - "REFACTOR gate passes with zero regressions"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke"
      fix_step: "Fix any regressions in existing DigestSessionOrchestrator or RequestRephraseOrchestrator tests"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Log remaining issues — do NOT skip"
      blocks_ac_complete: true
      governance: "CORE-068"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/unit/orchestrators/support/"
      min_tests_pass: 20
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── 129-c: CortexDistill MCP Tool ─────────────────────────────────────────
  - id: "phase-129-c"
    title: "Implement CortexDistill MCP Tool and Register in mcp_registry.py"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-129-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035"
    duration_estimate: "1 hour"
    depends_on: ["phase-129-b"]
    prerequisite: "phase-129-b completion_gate PASSED (DistillationOrchestrator implemented)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write failing tests for CortexDistill tool metadata, registration, and invocation"
        gate: "python3 scripts/run_tests.py file tests/mcp/test_cortex_distill_tool.py — ALL tests must FAIL"
        blocker: "Do NOT create tool file until tests are RED"
      green:
        action: "Create cortex/mcp/tools/cortex_distill_tool.py and register in mcp_registry.py + __init__.py"
        gate: "python3 scripts/run_tests.py file tests/mcp/test_cortex_distill_tool.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until tests are GREEN"
      refactor:
        action: "Confirm ConsolidatedTool subclass pattern matches all other tools; add docstrings"
        gate: "python3 scripts/run_tests.py dir tests/mcp/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until gate passes"

    implementation_contract:
      file: "cortex/mcp/tools/cortex_distill_tool.py"
      class: "CortexDistill"
      base_class: "ConsolidatedTool"
      tool_name: "cortex_distill"
      ops:
        - op: "distill"
          description: "Distil a chat transcript file into a single optimised executable prompt"
          input_schema:
            file_path:
              type: "string"
              required: true
              description: "Absolute path to the chat transcript file to distil"
            overwrite:
              type: "boolean"
              required: false
              default: true
