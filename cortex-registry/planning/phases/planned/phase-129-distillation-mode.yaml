          output_schema:
            success: "bool"
            distilled_prompt: "str — the synthesised prompt (only if overwrite=false)"
            tokens_saved: "int — estimated tokens removed"
            segments_processed: "int — number of conversation segments parsed"
            confidence_score: "float — distillation quality 0.0–10.0"
            error_message: "str | null"
      registration_files:
        - file: "cortex/mcp/mcp_registry.py"
          change: "Add 'cortex_distill': CortexDistill to PRODUCTION_TOOLS"
        - file: "cortex/mcp/tools/__init__.py"
          change: "Import CortexDistill and add to ALL_TOOLS list"

