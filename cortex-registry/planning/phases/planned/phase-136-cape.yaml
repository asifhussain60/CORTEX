id: phase-136
title: "CORTEX Autonomous Planning Engine (CAPE) — Complexity Triage + Auto Plan Generator + 5 Analysis Gates + Golden Test Generator"
created: "2026-03-08"
status: PLANNED
priority: P1
depends_on: ["phase-135"]
sweep_id: SWEEP-136-CAPE
estimated_effort: "3 days"
source: "GitHub Issue #14 — CORTEX Feedback 2026-03-08 (FB-2026-03-08-001 through 005)"

description: |
  Backport of the CORTEX Autonomous Planning Engine (CAPE) from cortex-sts Phase 136.
  Depends on KAL (phase-135) — CAPE uses KnowledgeAcquisitionOrchestrator to fill
  domain knowledge gaps before generating plans.

  CAPE eliminates the manual /plan workflow. Instead of hand-crafting phase YAMLs,
  CAPE computes a Complexity-Driven Routing (CDR) score from 5 weighted dimensions,
  selects a roadmap template, scaffolds a full phase YAML, runs 5 pre-approval
  analysis gates, and auto-injects convergence cleanup into every implementation phase.

  Five components delivered:

  1. ComplexityTriageEngine — 5-dimension CDR scoring (clarity/context/scope/risk/precedent)
     classifies requests into SIMPLE/MODERATE/COMPLEX bands. Drives roadmap selection.

  2. AutoPlanGenerator + PhaseFileScaffolder + RoadmapPatternSelector — template-based
     plan generation producing full phase YAMLs for cortex-registry/planning/phases/planned/.
     5 roadmap templates: linear-execution, phased-roadmap, epic-roadmap,
     parallel-execution, sts-refactoring.

  3. PlanAnalysisGateRunner — 5 gates (3 blocking: Threat/Quality/Security;
     2 informational: RCA/OPJ history with CDR adjustment ±0.3).

  4. PlanExecutionLoop + PlanStabilizationInjector — Kahn topological sort for phase
     ordering, policy-based gate evaluation (HALT/CONTINUE), stabilization injection
     that adds convergence cleanup after every implementation phase + a 9-check holistic
     stabilization final phase.

  5. GoldenTestGenerator + TestPriorityClassifier + RepoFrameworkDetector — balanced
     test plans across 7 categories (≥30% sunshine, ≥20% rainy, ≥2 edge), P0–P3 scoring,
     framework detection from requirements.txt/package.json/.csproj.

governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-035   # Single canonical implementation
  - CORE-048   # Holistic validation gate
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── GAP-136-01: ComplexityTriageEngine (CDR Scoring) ──────────────────────
  - id: GAP-136-01
    title: "ComplexityTriageEngine — 5-dimension CDR scoring + band classification"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-001"
    evidence: |
      No complexity scoring exists in CORTEX. The /plan intent produces generic
      phase YAMLs with no awareness of request complexity, historical failure rate,
      or architectural risk. This causes SIMPLE requests to get overengineered phase
      structures and COMPLEX requests to be underplanned.
    action_ref: "phase-136-a"
    files_to_create:
      - cortex/orchestrators/core/complexity_triage_engine.py  # ComplexityBand, CDRResult, TriageResult, CDRScorer, ComplexityTriageEngine
    test_file: "tests/orchestrators/core/test_complexity_triage_engine.py"

  # ── GAP-136-02: AutoPlanGenerator + PhaseFileScaffolder + RoadmapPatternSelector
  - id: GAP-136-02
    title: "AutoPlanGenerator + PhaseFileScaffolder + RoadmapPatternSelector"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-002"
    evidence: |
      Phase YAML files are currently hand-authored. There is no automated path
      from a request + triage result to a scaffolded phase file. The Thin Index
      Contract requires phase detail in dedicated YAML files — CAPE automates this
      production, removing human error from phase structure.
    action_ref: "phase-136-b"
    files_to_create:
      - cortex/orchestrators/domain/auto_plan_generator.py       # PlanGenerationResult, AutoPlanGenerator
      - cortex/orchestrators/domain/phase_file_scaffolder.py     # PhaseFileScaffolder
      - cortex/orchestrators/domain/roadmap_pattern_selector.py  # RoadmapSelection, RoadmapPatternSelector
    test_file: "tests/orchestrators/domain/test_auto_plan_generator.py"

  # ── GAP-136-03: PlanAnalysisGateRunner (5 gates) ──────────────────────────
  - id: GAP-136-03
    title: "PlanAnalysisGateRunner — 5 pre-approval analysis gates"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-003"
    evidence: |
      Plans generated by AutoPlanGenerator are approved without any risk gating.
      No threat model assessment, quality score check, security scan, RCA history
      consultation, or OPJ pattern check precedes plan execution. P0 threats can
      proceed unchecked into implementation.
    action_ref: "phase-136-c"
    files_to_create:
      - cortex/orchestrators/domain/plan_analysis_gates.py  # ThreatModelGate, QualityAnalysisGate, SecurityAssessmentGate, RCAHistoryGate, OPJConsultationGate, PlanAnalysisGateRunner
      - cortex-registry/workflows/templates/primitives/governance/plan-analysis-gate.yaml
    test_file: "tests/orchestrators/domain/test_plan_analysis_gates.py"

  # ── GAP-136-04: PlanExecutionLoop + PlanStabilizationInjector ─────────────
  - id: GAP-136-04
    title: "PlanExecutionLoop (Kahn topological sort) + PlanStabilizationInjector"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-004"
    evidence: |
      No topological ordering exists for multi-phase plans with depends_on graphs.
      Phases without dependency awareness can execute in wrong order, causing
      cascading failures. No automatic convergence cleanup is injected after
      implementation phases — stabilization is ad-hoc and incomplete.
    action_ref: "phase-136-d"
    files_to_create:
      - cortex/orchestrators/core/plan_execution_loop.py         # PlanExecutionLoop with Kahn's algorithm
      - cortex/orchestrators/domain/plan_stabilization_injector.py  # PlanStabilizationInjector
    test_file: "tests/orchestrators/core/test_plan_execution_engine.py"

  # ── GAP-136-05: GoldenTestGenerator + TestPriorityClassifier + RepoFrameworkDetector
  - id: GAP-136-05
    title: "GoldenTestGenerator + TestPriorityClassifier + RepoFrameworkDetector"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-005"
    evidence: |
      TDD scaffolding (CORE-008) produces test stubs with no coverage distribution
      guidance. No classifier assigns P0–P3 priority to tests, and no framework
      detector identifies the test runner in use. Tests generated without RCA/OPJ
      history miss regression guards for known failure patterns.
    action_ref: "phase-136-e"
    files_to_create:
      - cortex/orchestrators/core/golden_test_generator.py      # GoldenTestGenerator (7 categories)
      - cortex/orchestrators/core/test_priority_classifier.py   # TestPriorityClassifier + PriorityResult
      - cortex/orchestrators/core/repo_framework_detector.py    # RepoFrameworkDetector + FrameworkDetectionResult
    test_file: "tests/orchestrators/core/test_test_priority_engine.py"

