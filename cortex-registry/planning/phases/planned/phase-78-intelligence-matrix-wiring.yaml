# ── RISK REGISTER ─────────────────────────────────────────────────────────────
risks:
  - id: RISK-78-01
    description: "Knowledge injection adds latency to orchestrator dispatch — YAML parsing per request"
    mitigation: "UnifiedIntelligenceProvider is a singleton with in-memory cache. KnowledgeSynthesisEngine loads once, reuses."
    severity: LOW

  - id: RISK-78-02
    description: "OPJMixin write contention — concurrent orchestrator dispatches writing to OPJ simultaneously"
    mitigation: "OPJ uses append-only YAML; file lock via fcntl/msvcrt per platform"
    severity: MEDIUM

  - id: RISK-78-03
    description: "BatchProcessor consolidation — callers in testing/ and tools/ may use different interfaces"
    mitigation: "TDD RED first: write test that imports from single canonical location; verify all callers updated"
    severity: LOW
