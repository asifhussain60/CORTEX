# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  description: |
    Consolidate all health scanning and vacuum cleanup into exactly TWO
    canonical orchestrators with automatic health→vacuum handoff:
    
    1. **HealthOrchestrator** (single canonical):
       - Absorbs Phase-48 filesystem checks (H-001 to H-010)
       - Absorbs Phase-92 agent-based checks (14 agents)
       - Adds 6 NEW check categories (stubs, low-value tests, SQLite, etc.)
       - Writes structured health-issues.yaml for handoff
    
    2. **VacuumOrchestrator** (single canonical):
       - Absorbs Phase-48 VacuumExecutor operations
       - Absorbs cortex_intelligence VacuumOrchestrator cleaner plugins
       - Adds automatic handoff consumption from HealthOrchestrator
       - Provides rollback, dry-run, and reporting
    
    3. **HealthVacuumPipeline** (auto-handoff coordinator):
       - Orchestrates Health → Vacuum → Verify → Teardown
       - Supports autonomous mode (zero human intervention)
       - MCP-first exposure via 2 tools (reduced from 3)

  problem_statement: |
    Current state has 2× HealthOrchestrator classes, 7× vacuum/cleanup
    implementations, and 3× MCP tools for overlapping operations. The
    chat01.md audit identified 30+ consolidation issues. Additionally:
    - Stub implementations are not detected by health checks
    - Low-value golden tests reduce confidence
    - Leftover SQLite databases accumulate
    - No automatic Health→Vacuum handoff exists
    - Tests are misplaced inside cortex/ source tree

  business_value:
    - "Single source of truth for health scanning (CORE-035)"
    - "Automatic remediation pipeline reduces manual maintenance to zero"
    - "New check categories catch issues currently invisible"
    - "Reduced MCP tool count improves discoverability"
    - "~5,600 lines of duplicate code removed"
    - "~30 files/directories deleted or consolidated"

  risk_assessment:
    score: 0.55
    category: "MEDIUM"
    mitigations:
      - "All 16 existing golden tests must pass before and after"
      - "Import compatibility shims for deprecated paths"
      - "Dry-run mode on all vacuum operations"
      - "Rollback manifest for undo"
      - "Incremental migration across 6 stages"

