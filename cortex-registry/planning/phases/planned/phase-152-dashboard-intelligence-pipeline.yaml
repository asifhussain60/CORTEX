    new_files:
      - "cortex/dashboards/intelligence_orchestrator.py"
      - "tests/dashboards/test_dashboard_intelligence_pipeline.py"

    implementation_guide: |
      cortex/dashboards/intelligence_orchestrator.py:

        @dataclass
        class DashboardPipelineResult:
            html_path: str
            dashboard_manifest: DashboardManifest
            knowledge_overlay: dict[str, KnowledgeOverlay]
            narratives: dict[str, str]
            viz_selections: dict[str, list[VisualizationChoice]]
            quality_report: QualityReport
            errors: list[str]

            @property
            def success(self) -> bool:
                return not self.errors and self.quality_report.passed

        class DashboardIntelligenceOrchestrator:
            def __init__(self) -> None:
                self._collector = DashboardDataCollector()
                self._overlay_engine = KnowledgeOverlayEngine()
                self._viz_selector = VisualizationSelector()
                self._narrative_engine = NarrativeEngine()
                self._quality_gate = DashboardQualityGate()

            def generate(self, manifest: "OnboardingManifest") -> DashboardPipelineResult:
                \"""Execute 7-stage intelligence pipeline. Returns DashboardPipelineResult.\"""
                errors: list[str] = []
                try:
                    # Stage 1 — COLLECT
                    dashboard_manifest = self._collector.collect(manifest)
                    # Stage 2 — OVERLAY
                    overlay = self._overlay_engine.overlay(dashboard_manifest)
                    # Stage 3 — SELECT
                    viz = {tab: self._viz_selector.select(tab, data) for tab, data in dashboard_manifest.tabs.items()}
                    # Stage 4 — NARRATE
                    narratives = self._narrative_engine.narrate(dashboard_manifest, overlay)
                    # Stage 5 — RENDER (delegates to DashboardGenerator → TabRenderer → PersonaLayer)
                    html_path = self._render(dashboard_manifest, narratives, viz)
                    # Stage 6 — QUALITY
                    result = DashboardPipelineResult(html_path, dashboard_manifest, overlay, narratives, viz, None, errors)
                    quality_report = self._quality_gate.evaluate(result)
                    result = replace(result, quality_report=quality_report)
                    # Stage 7 — EMIT: log quality_report summary
                    self._emit(result)
                    return result
                except Exception as exc:
                    errors.append(str(exc))
                    return DashboardPipelineResult("", DashboardManifest("", "", {}, "", {}), {}, {}, {}, QualityReport([], False, 0), errors)

      Backward compatibility: existing DashboardOrchestrator (Phase 53) must still function.
      DashboardIntelligenceOrchestrator delegates Stage 5 RENDER to DashboardGenerator (which now
