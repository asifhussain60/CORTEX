background: |
  Source: GitHub Issue #18 (2026-03-12) — FB-20260312-001.
  This is the highest-complexity capability in Issue #18. It depends on ALL prior phases:
    Phase 148: Clean import paths (canonical cortex.intelligence.knowledge paths)
    Phase 149: KnowledgeOverlayEngine, CortexFrameworkAnalyzer enhanced, framework-context.yaml
    Phase 150: DoR gate must pass before dashboard generation begins
    Phase 151: TabRenderer + PersonaLayer pipeline wired into DashboardGenerator

  Current state: cortex/dashboards/ has output_manager.py, renderers.py, spa.py (+more from Phase 53).
  The existing DashboardOrchestrator (Phase 53) generates static HTML.
  FB-001 adds a 7-stage INTELLIGENCE PIPELINE on top:
    Stage 1 — COLLECT:     DashboardDataCollector.collect(manifest) → DashboardManifest
    Stage 2 — OVERLAY:     KnowledgeOverlayEngine.overlay(manifest) → KnowledgeOverlay
    Stage 3 — SELECT:      VisualizationSelector.select(tab_id, data) → list[VisualizationChoice]
    Stage 4 — NARRATE:     NarrativeEngine.narrate(manifest, overlay) → dict[str, str]
    Stage 5 — RENDER:      TabRenderer.render_tab() → PersonaLayer.adapt() (Phase 151 pipeline)
    Stage 6 — QUALITY:     DashboardQualityGate.evaluate(result) → QualityReport
    Stage 7 — EMIT:        DashboardIntelligenceOrchestrator.emit() writes HTML, logs quality report

  DashboardIntelligenceOrchestrator wraps Phase 53 DashboardOrchestrator for backward compatibility.
  All 6 new files go in cortex/dashboards/ — none replace existing files.

  Git prerequisite: Phase 151 final_validation PASSED.

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

