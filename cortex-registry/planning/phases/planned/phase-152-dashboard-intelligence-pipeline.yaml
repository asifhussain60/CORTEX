  # ── Sub-phase E: DashboardQualityGate ────────────────────────────────────────
  - id: "phase-152-e"
    title: "Create DashboardQualityGate — 6 quality rules + QualityReport dataclass"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-152-05"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035"
    duration_estimate: "2 hours"
    depends_on: ["phase-152-d"]
    prerequisite: "phase-152-d completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    new_files:
      - "cortex/dashboards/quality_gate.py"
      - "tests/dashboards/test_dashboard_quality_gate.py"

    implementation_guide: |
      cortex/dashboards/quality_gate.py:

        class QualityRuleId(str, Enum):
            FIVE_SECOND_RULE = "5-second-rule"
            F_PATTERN = "f-pattern"
            PROGRESSIVE_DISCLOSURE = "progressive-disclosure"
            NO_CROSS_TAB_DUPLICATION = "no-cross-tab-duplication"
            NO_DEAD_SECTIONS = "no-dead-sections"
            MIN_NARRATIVE_LENGTH = "min-narrative-length"

        @dataclass
        class QualityIssue:
            rule_id: QualityRuleId
            tab_id: str
            description: str
            severity: str  # "P0" | "P1" | "P2"

        @dataclass
        class QualityReport:
            issues: list[QualityIssue]
            passed: bool            # True if no P0 issues
            score: int              # 0–100 quality score (100 = zero issues)

        class DashboardQualityGate:
            def evaluate(self, result: "DashboardPipelineResult") -> QualityReport:
                \"""Evaluate 6 quality rules against the pipeline result.\"""
                issues: list[QualityIssue] = []
                # Apply each of the 6 rules
                issues.extend(self._check_five_second_rule(result))
                issues.extend(self._check_f_pattern(result))
                issues.extend(self._check_progressive_disclosure(result))
                issues.extend(self._check_no_cross_tab_duplication(result))
                issues.extend(self._check_no_dead_sections(result))
                issues.extend(self._check_min_narrative_length(result))
                p0_count = sum(1 for i in issues if i.severity == "P0")
                score = max(0, 100 - (p0_count * 20 + len(issues) * 5))
                return QualityReport(issues=issues, passed=(p0_count == 0), score=score)

      MIN_NARRATIVE_LENGTH rule: checks NarrativeEngine output ≥ 150 words.
      NO_DEAD_SECTIONS rule: any tab with empty narrative is a P0.

    tdd_cycle:
      red:
        action: "Write quality gate tests before creating file"
        gate: "python3 scripts/run_tests.py file tests/dashboards/test_dashboard_quality_gate.py — ALL FAIL"
        blocker: "No implementation until RED gate passes"
      green:
        action: "Create quality_gate.py with all 6 rule checks"
        gate: "python3 scripts/run_tests.py file tests/dashboards/test_dashboard_quality_gate.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Type hints; score calculation; rule separation"
        gate: "python3 scripts/run_tests.py dir tests/dashboards/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_quality_report_passed_true_no_p0 — passed=True when no P0 issues"
        - "test_quality_report_passed_false_with_p0 — passed=False when P0 issue present"
        - "test_quality_score_100_no_issues — score=100 for zero issues"
        - "test_quality_score_decreases_per_issue — score < 100 when issues exist"
        - "test_five_second_rule_fires_on_no_metric_card — missing METRIC_CARD in overview"
        - "test_min_narrative_rule_fires_on_short_narrative — narrative < 150 words → P0"
        - "test_no_dead_sections_fires_on_empty_narrative — empty narrative string → P0"
        - "test_quality_issue_has_rule_id_tab_severity — QualityIssue fields correct"
      green:
        - "Create QualityIssue + QualityReport dataclasses"
        - "Create DashboardQualityGate with 6 rule methods"
      refactor:
        - "Type hints: evaluate(self, result: DashboardPipelineResult) -> QualityReport"
        - "score ∈ [0, 100]"

    acceptance_criteria:
      - "QualityReport.passed = True only when no P0 issues"
      - "QualityReport.score = 100 for zero issues; decreases per issue"
      - "All 6 quality rules implemented and testable in isolation"
      - "8 quality gate tests PASS"

