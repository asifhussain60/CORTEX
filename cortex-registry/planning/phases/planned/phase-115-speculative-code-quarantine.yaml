# CORTEX Phase Plan — Phase 115: Speculative Code Quarantine + Dead Weight Removal
# Authority: cortex-architect audit 2026-03-03
# Governance: master-plan-phase-lifecycle.yaml

id: "phase-115"
title: "Speculative Code Quarantine — Infrastructure Pruning, Memory Subsystem Audit, Monolith Deletion"
version: "1.0"
created: "2026-03-03"
status: PLANNED
priority: P0
governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-035   # Single canonical implementation
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-115-SPECULATIVE-QUARANTINE"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Holistic architecture audit 2026-03-03 (copilot chat session).
  CORTEX contains ~45K lines of speculative/unreferenced code:
    - cortex/infrastructure/: 65 of 123 modules never imported outside infrastructure/ (~18K lines)
    - cortex/intelligence/memory/: 56 files, 16.5K lines (tier1_learned + tier2_adaptive)
      with hallucination prevention, circuit breakers for a non-ML system
    - cortex/dashboards/: 39 files, 10.7K lines — only 7 external imports
    - cortex/lens/lens_orchestrator.py: 2,045-line monolith still exists alongside
      the decomposed lens_orchestrator/ package (1,884 lines) — Phase 103 left it behind
    - 7 compat shims explicitly marked "will be removed" never removed
    - 14 files where >50% methods are empty stubs
    - 1 broken test collection (test_brain_state_manager.py — shim missing re-exports)
    - 34 remaining F401 unused imports
  
  Industry standard: production code should have ≤5% unreferenced modules.
  CORTEX current: ~51% of infrastructure is unreferenced. Target: ≤10%.
  
  Baseline measurements:
    - Source files: 1,282 (342,813 lines)
    - Unreferenced infrastructure: 65 modules / 17,935 lines
    - Compat shims pending removal: 7
    - Stub-heavy files: 14
    - F401 remaining: 34
    - Collection errors: 1
    - Smoke tests: 2,194 passed

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-115-01"
    title: "Delete cortex/lens/lens_orchestrator.py monolith — package exists"
    severity: P0
    source: "lens_orchestrator.py (2,045L) + lens_orchestrator/ package (1,884L) — both live"
    evidence: |
      wc -l cortex/lens/lens_orchestrator.py → 2045
      ls cortex/lens/lens_orchestrator/ → 8 files, 1884 lines
      Both define LENSOrchestrator class
    action_ref: "phase-115-a"
    status: OPEN
    acceptance_criteria: |
      - cortex/lens/lens_orchestrator.py DELETED
      - All imports updated to use cortex.lens.lens_orchestrator package
      - smoke + preflight green

  - id: "GAP-115-02"
    title: "Quarantine unreferenced infrastructure modules (65 modules, ~18K lines)"
    severity: P0
    source: "Import analysis: 65/123 infrastructure modules never imported outside infrastructure/"
    evidence: |
      Includes: circuit_breaker, bulkhead_manager, crash_recovery, connection_pool,
      graceful_degradation, degradation_manager, rate_limiter, load_test_scenarios,
      production_release, deployment_validator, etc.
      Total: ~17,935 lines of code for enterprise patterns CORTEX doesn't use in production.
    action_ref: "phase-115-b"
    status: OPEN
    acceptance_criteria: |
      - Unreferenced modules moved to cortex/infrastructure/_quarantine/
      - Quarantine directory excluded from lint and import scanning
      - No import breakage in remaining code
      - 30-day retention: if no breakage reported, delete in Phase 117
      - smoke + preflight green

  - id: "GAP-115-03"
    title: "Fix broken test collection — brain_state_manager.py shim incomplete"
    severity: P0
    source: "pytest --collect-only: ERROR tests/unit/brain/test_brain_state_manager.py"
    evidence: |
      ImportError: cannot import name 'StateSnapshot' from 'cortex.core.brain_state_manager'
      Shim only re-exports BrainStateManager, IntelligenceStateManager.
      Canonical file cortex/core/orchestrator_state_manager.py has StateSnapshot at line 28.
    action_ref: "phase-115-a"
    status: OPEN
    acceptance_criteria: |
      - cortex/core/brain_state_manager.py re-exports StateSnapshot, FlushResult
      - pytest --collect-only: 0 errors
      - test_brain_state_manager.py passes

  - id: "GAP-115-04"
    title: "Remove 7 compat shims marked 'will be removed'"
    severity: P1
    source: "grep 'This shim will be removed' cortex/ → 7 files"
    evidence: |
      cortex/core/brain_state_manager.py
      cortex/mcp/tools/brain_collaboration_tools.py
      cortex/mcp/tools/brain.py
      cortex/orchestrators/core/central_brain_orchestrator.py
      cortex/orchestrators/core/brain_health_orchestrator.py
      cortex/infrastructure/brain_health_metrics.py
      cortex/infrastructure/shared_brain_store.py
    action_ref: "phase-115-c"
    status: OPEN
    acceptance_criteria: |
      - All 7 shim files deleted
      - All callers updated to use canonical imports
      - smoke + preflight green

  - id: "GAP-115-05"
    title: "Fix 34 remaining F401 unused imports"
    severity: P1
    source: "ruff check cortex/ --select=F401 → Found 34 errors"
    action_ref: "phase-115-c"
    status: OPEN
    acceptance_criteria: |
      - ruff check cortex/ --select=F401 → All checks passed
      - smoke green

  - id: "GAP-115-06"
    title: "Resolve 14 stub-heavy files (>50% methods are pass/raise)"
    severity: P1
    source: "AST scan: 14 files where >50% of methods are empty stubs"
    evidence: |
      Includes: repository_interface.py, kg_query_interface.py, graph/interface.py,
      adapter_base.py, storage_provider.py, dashboard_data_adapter.py, etc.
      These are interface files with no implementation — verify they have concrete implementations.
    action_ref: "phase-115-c"
    status: OPEN
    acceptance_criteria: |
      - Each stub file verified: either has concrete implementations elsewhere (keep as ABC)
        or is orphaned (delete)
      - Orphaned stubs deleted
      - Remaining stubs documented as intentional interfaces with @abstractmethod

  - id: "GAP-115-07"
    title: "Reduce noqa:F401 + noqa:F403 suppression count"
    severity: P2
    source: "grep: 113 F401 suppressions, 61 F403 suppressions"
    action_ref: "phase-115-c"
    status: OPEN
    acceptance_criteria: |
      - F401 suppressions in non-__init__.py files: 0
      - F403 wildcard suppressions: ≤20 (only __init__.py re-exports)

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# SUB-PHASES
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: "phase-115-a"
    title: "Critical Fixes — lens monolith deletion + broken test fix"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-115-01", "GAP-115-03"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "1 hour"
    depends_on: []
    prerequisite: "smoke tests green (≥2,194 baseline)"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          1. Verify test_brain_state_manager.py currently fails collection
          2. Write test_lens_orchestrator_package_canonical.py:
             - test that cortex.lens.lens_orchestrator imports from package not file
      green:
        action: |
          1. Fix brain_state_manager.py shim: add StateSnapshot, FlushResult re-exports
          2. Update any code importing directly from cortex.lens.lens_orchestrator (module)
             to use cortex.lens.lens_orchestrator (package)
          3. Delete cortex/lens/lens_orchestrator.py
      refactor:
        action: "Verify 0 collection errors, smoke green"
    completion_gate: "0 collection errors, lens tests green, smoke green"

  - id: "phase-115-b"
    title: "Infrastructure Quarantine — move 65 unreferenced modules"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-115-02"]
    governance_authority: "CORE-008, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-115-a"]
    prerequisite: "phase-115-a completion_gate passed"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/preflight/test_infrastructure_health.py:
          - test_no_unreferenced_infrastructure_modules (budget: ≤10)
          - test_quarantine_dir_excluded_from_production_imports
      green:
        action: |
          1. Create cortex/infrastructure/_quarantine/
          2. Move each of the 65 unreferenced modules into _quarantine/
          3. Run smoke after each batch of 10 moves to detect any hidden dependencies
          4. Update any __init__.py that re-exported quarantined modules
      refactor:
        action: "Verify import analysis shows ≤10 unreferenced modules remaining"
    completion_gate: "unreferenced infrastructure ≤ 10, smoke green"

  - id: "phase-115-c"
    title: "Cleanup Sweep — shims, F401, stubs, F403 suppressions"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-115-04", "GAP-115-05", "GAP-115-06", "GAP-115-07"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-115-b"]
    prerequisite: "phase-115-b completion_gate passed"
    regression_gate: "make test-smoke — zero new failures"
    tdd_cycle:
      red:
        action: |
          Write tests/preflight/test_cleanup_budget.py:
          - test_no_pending_removal_shims
          - test_f401_zero
          - test_f403_under_budget (≤20)
          - test_no_orphaned_stub_files
      green:
        action: |
          1. Delete 7 compat shims, update all callers
          2. Run ruff check cortex/ --select=F401 --fix
          3. Audit 14 stub-heavy files: delete orphans, add @abstractmethod to real interfaces
          4. Remove F403 wildcards in non-__init__.py files
      refactor:
        action: "Final audit pass"
    completion_gate: "0 shims, 0 F401, F403 ≤ 20, stub files resolved, smoke green"

