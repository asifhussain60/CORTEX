    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    depends_on: []
    prerequisite: "smoke tests green (≥2791 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

