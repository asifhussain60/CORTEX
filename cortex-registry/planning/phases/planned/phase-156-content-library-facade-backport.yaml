background: |
  Source: _workspaces/.chats/library-upgrade.md — Phase 129 content library work was
  implemented on origin/CORTEX (commit 6e967f0fe, 2026-03-06) but never backported
  to this workspace. Phase 129 in THIS workspace was repurposed to the Product Owner
  Intelligence Suite (COMPLETE 2026-03-12).

  Current state (pre-phase-153):
    - Quote library: 120 items (atom-quote.yaml)
    - Principles library: 90 items (high-value-principles.yaml)
    - No AI Spark library
    - PrincipleSelector is the only selection entry point
    - Ring buffer (n=10–20) insufficient for 500+ item corpus
    - No ContentLibraryFacade — 3 pools have no unified interface

  Target state (post-phase-153):
    - ContentLibraryFacade: cortex/intelligence/analysis/content_library_facade.py
    - EpochShuffler: Fisher-Yates epoch deque, O(1) pop, cross-library ring buffer (maxlen=5)
    - AI Spark library: 150 items, 8 categories (cortex-registry/knowledge/ai/ai-adoption-sparks.yaml)
    - Quote library: expanded to 180 items with category + audience fields
    - Principles library: expanded to 110 items with audience field
    - Rendering atom: atom-ai-spark.yaml in cortex-registry/templates/response/atoms/
    - comp-query.yaml: wired with atom-ai-spark
    - Drift lock fix: test_exactly_90_principles → assert count >= 110
    - MasterOrchestrator Stage 4: ContentLibraryFacade wired for intent-aware pool selection
      (INTRODUCE → ai_spark priority, QUERY/DESIGN → principle, default → quote)

  Performance contract: p95 ≤ 5ms per select() at 650+ total items.
  Backward compatibility: PrincipleSelector API unchanged (shim, not replaced).

  Smoke baseline: 2791 passed (2026-03-12)
  Preflight baseline: 446 passed

