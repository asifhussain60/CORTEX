      red:
        action: "Write all failing tests in tests/intelligence/test_content_library_facade.py before any implementation"
        gate: "python3 scripts/run_tests.py file tests/intelligence/test_content_library_facade.py — ALL tests must FAIL"
        blocker: "Do NOT write implementation until every listed test fails (import errors count as FAIL)"
      green:
        action: "Implement ContentLibraryFacade + EpochShuffler in cortex/intelligence/analysis/content_library_facade.py"
        gate: "python3 scripts/run_tests.py file tests/intelligence/test_content_library_facade.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints (CORE-011), docstrings (CORE-012), confirm CORE-035 — PrincipleSelector unchanged"
        gate: "python3 scripts/run_tests.py dir tests/intelligence/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_content_library_facade_imports — facade importable from cortex.intelligence.analysis.content_library_facade"
        - "test_epoch_shuffler_full_traversal — all items seen before any repeat (Fisher-Yates guarantee)"
        - "test_epoch_shuffler_performance_p95 — p95 ≤ 5ms per select() at 440+ corpus"
        - "test_cross_library_ring_buffer — same library not selected 3+ consecutive times"
        - "test_facade_select_returns_item — ContentLibraryFacade.select(pool='quotes') returns item"
        - "test_principle_selector_backward_compat — PrincipleSelector API unchanged after facade added"
        - "test_facade_pool_isolation — selecting from 'quotes' does not deplete 'principles' epoch"
        - "test_facade_singleton_loading — filesystem I/O only on first pool access"
      green:
