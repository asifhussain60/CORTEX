id: "phase-111a"
title: "Phase 111-A — Critical Enum & Status Type Consolidation (24x, 19x, 9x duplicates)"
version: "1.0"
created: "2026-03-03"
status: PLANNED
priority: P0
parent_phase: "phase-111"
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-011  # Type hints
  - CORE-035  # Single canonical implementation
  - CORE-064  # Sweep Completeness Contract
sweep_catalogue_id: "SWEEP-111A-CRITICAL-ENUMS"

background: |
  Sub-phase A of Phase 111. Targets the highest-count true CORE-035 violations:
  classes that represent shared domain concepts but are re-defined per-file rather
  than imported from a canonical location.

  Key insight: Most 4x+ duplicates are SHARED INFRASTRUCTURE types that belong
  in cortex/models/canonical_enums.py or cortex/core/common/ but were copied into
  each consuming module. The fix is:
    1. Establish one canonical definition
    2. Add re-export from that canonical location
    3. Convert all consumers to import from canonical
    4. Remove the local copies

  Scope: Classes with 4+ definitions (39 class names, ~165 definitions)
  Target after this phase: 0 classes with 4+ definitions

scope:
  focus: "Classes with 4+ duplicate definitions"
  class_count: 39
  total_definitions: 165
  target: "Reduce to 0 classes with 4+ definitions"

sweep_catalogue:
  - id: "GAP-111A-01"
    title: "ValidationResult — 24 definitions → 1 canonical in cortex/models/canonical_enums.py"
    severity: P0
    status: OPEN
    canonical_home: "cortex/models/canonical_enums.py"
    consumers:
      - cortex/tools/template_validator.py
      - cortex/tools/template_parser.py
      - cortex/tools/toolkit/toolkit_validation.py
      - "(21 more locations)"

  - id: "GAP-111A-02"
    title: "Config — 19 definitions (3 in one file!)"
    severity: P0
    status: OPEN
    analysis: |
      cortex/models/dashboard_schema_pydantic.py defines Config 3 times (inner classes).
      Other Config classes are domain-specific configs — NOT true CORE-035 violations
      since they serve different domains (dashboard config vs test config vs model config).
      Action: Fix the 3-in-one-file case; annotate intentional domain-specific ones.

  - id: "GAP-111A-03"
    title: "IntentType — 9 definitions → canonical in cortex/models/canonical_enums.py"
    severity: P0
    status: OPEN
    canonical_home: "cortex/models/canonical_enums.py"
    note: "Already exists in canonical_enums.py — consumers must import from there"

  - id: "GAP-111A-04"
    title: "RiskLevel — 6 definitions → canonical in cortex/models/canonical_enums.py"
    severity: P0
    status: OPEN
    canonical_home: "cortex/models/canonical_enums.py"
    note: "Already exists in canonical_enums.py — consumers must import from there"

  - id: "GAP-111A-05"
    title: "HealthStatus, SeverityLevel, EnforcementLevel, ResponseFormat — 5x each"
    severity: P0
    status: OPEN
    canonical_home: "cortex/models/canonical_enums.py"

  - id: "GAP-111A-06"
    title: "CacheEntry, CacheStats — 9x and 5x"
    severity: P1
    status: OPEN
    canonical_home: "cortex/core/core_context_cache_layer.py or cortex/core/common/cache.py"

  - id: "GAP-111A-07"
    title: "ExecutionResult, ExecutionContext — 6x and 4x"
    severity: P1
    status: OPEN
    canonical_home: "cortex/models/execution_context.py"

  - id: "GAP-111A-08"
    title: "Remaining 4x classes (23 more class names)"
    severity: P1
    status: OPEN
    notes: "Span, ComponentHealth, GenerationResult, ValidationLevel, ValidationError,
      AuditLogEntry, ViolationType, ToolCategory, ToolMetadata, Severity, SynthesisResult,
      MetricType, PatternType, AgentMetadata, Recommendation, ClassInfo, AuditLogger,
      FallbackStrategy, CircuitBreaker, PatternMatch, UseCase, ComplexityLevel,
      OrchestratorLookup, HealthCheckResult"

tdd_sequence:
  red:
    file: "tests/core/test_no_4x_duplicate_classes.py"
    assertion: "AST scan: no class name has 4+ definitions in cortex/"
    expected_result: "FAIL — 39 classes with 4+ definitions"

  green:
    steps:
      - "Identify canonical home for each 4x+ class"
      - "Ensure canonical definition exists with full type hints + docstring"
      - "Add re-export to canonical module's __init__.py"
      - "Convert all consumers to import from canonical"
      - "Remove local duplicate definitions"
      - "Run make test-smoke between each batch"

  refactor:
    steps:
      - "Run ruff check to catch any introduced issues"
      - "Verify canonical_enums.py re-exports are clean"
      - "Update __init__.py exports"

acceptance_criteria:
  - "AST scan returns 0 classes with 4+ definitions"
  - "All imports resolve (no ImportError on smoke run)"
  - "Smoke tests: >= 2172 passed"
  - "ruff check cortex/ returns All checks passed"

estimated_effort: "3-4 hours"
risk: MEDIUM
