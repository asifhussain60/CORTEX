# CORTEX Phase Plan — Phase 119: Class Consolidation (CORE-035)
# Created: 2026-03-03 | Triggered by: v1.0 Production Certification Audit
# Governance: CORE-035 (Single canonical implementation), CORE-008, CORE-064, CORE-068
# THIN INDEX CONTRACT: all detail here — cortex-master.yaml holds thin reference only

id: "phase-119"
title: "Class Consolidation — Resolve 266 CORE-035 Duplicate Class Definitions"
version: "1.0"
created: "2026-03-03"
status: PLANNED
priority: P1
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-035  # Single canonical implementation — no duplicates
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-119-CLASS-CONSOLIDATION"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: v1.0 Production Certification Audit — 2026-03-03 (Check #26)
  Trigger: 266 duplicate class definitions found across cortex/ — P1 non-blocking
  Root cause: Gradual package dissolution (cortex_intelligence → cortex/intelligence,
    cortex_lens → cortex/lens, cortex_brain → cortex/orchestrators) left shadow
    copies of common types scattered across modules. No systematic canonical
    location was enforced during migration.

  Baseline measurements:
    - Smoke tests at entry: 2340 passed (v1.0-certified tag, commit 945faf69e)
    - Preflight tests at entry: 248 passed
    - Duplicate class count: 266 (AST scan — 191 at 2 locs, 39 at 3 locs, 23 at 4 locs+)
    - Top offenders by location count:
        ValidationResult: 24 locations
        Config: 19 locations (mostly pydantic model nesting — see GAP-119-02)
        HealthCheckResult: 10 locations
        CacheEntry: 10 locations
        IntentType: 8 locations (shadows canonical_enums.py)
        ExecutionResult: 7 locations
        Challenge: 7 locations
        DependencyGraph: 7 locations
        CacheStats: 6 locations
        RiskLevel: 6 locations

  Git prerequisite: Branch CORTEX, tag v1.0-certified (commit 945faf69e)
  Target: Reduce CORE-035 duplicate class count from 266 → ≤ 20 (residual shims only)

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — every gap must be CLOSED before COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-119-01"
    title: "Canonicalize shared type classes into cortex/models/shared/"
    severity: P1
    source: "v1.0 certification audit — Check #26"
    evidence: |
      Classes with ≥5 duplicate locations that have a clear canonical home:
        - ValidationResult (24 loc) → canonical: cortex/models/shared/validation.py
        - HealthCheckResult (10 loc) → canonical: cortex/models/shared/health.py
        - CacheEntry (10 loc) → canonical: cortex/models/shared/cache.py
        - CacheStats (6 loc) → canonical: cortex/models/shared/cache.py
        - ExecutionResult (7 loc) → canonical: cortex/models/shared/execution.py
        - RiskLevel (6 loc) → canonical: cortex/models/canonical_enums.py
        - IntentType (8 loc) → canonical: cortex/models/canonical_enums.py
        - Challenge (7 loc) → canonical: cortex/models/shared/challenges.py
        - DependencyGraph (7 loc) → canonical: cortex/models/shared/graph.py
      Canonical files already exist — shadow copies must import from canonical, not redefine.
    action_ref: "phase-119-a"
    status: OPEN

  - id: "GAP-119-02"
    title: "Triage Config class duplications — pydantic nesting vs true duplicates"
    severity: P1
    source: "v1.0 certification audit — Check #26"
    evidence: |
      Config: 19 locations — majority are pydantic nested model classes (e.g.
      dashboard_schema_pydantic.py defines inner Config classes for each model).
      These are legitimate pydantic pattern classes, NOT CORE-035 violations.
      Action: Triage each; retain pydantic-pattern Configs, consolidate any that
      are genuine duplicate top-level config dataclasses.
      Key files: cortex/models/dashboard_schema_pydantic.py (11 instances — all pydantic nested)
                 cortex/models/phase_detail_schema.py (3 instances)
                 cortex/dashboards/api/dashboard_routes.py (4 instances)
    action_ref: "phase-119-b"
    status: OPEN

  - id: "GAP-119-03"
    title: "Consolidate 2-location duplicates (191 classes) — remove shadow imports"
    severity: P2
    source: "v1.0 certification audit — Check #26"
    evidence: |
      191 classes appear in exactly 2 locations. Most are shadow copies where one file
      defines the class and another copies it instead of importing. Pattern:
        grep -rn "class {ClassName}" cortex/ → 2 results, one canonical, one shadow.
      Batch approach: for each, verify canonical location, replace shadow definition
      with import, run make test-smoke after each batch of 20.
    action_ref: "phase-119-c"
    status: OPEN

  - id: "GAP-119-04"
    title: "Update all imports to use canonical locations post-consolidation"
    severity: P1
    source: "phase-119 consolidation consequence"
    evidence: |
      After shadow classes are removed, all files that imported from shadow locations
      must be updated to import from canonical cortex/models/shared/ or
      cortex/models/canonical_enums.py.
      Tool: cortex/tools/toolkit/update_imports.py (already exists)
      Scope: any file that imported from a shadow location identified in GAP-119-01/03
    action_ref: "phase-119-d"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT (MANDATORY)
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# SUB-PHASES
# ─────────────────────────────────────────────────────────────────────────────
phases:

  - id: "phase-119-a"
    title: "Canonicalize high-severity shared types (≥5 duplicate locations)"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-119-01"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "3–4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥2340 baseline, commit 945faf69e)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write failing import tests asserting each canonical class is importable from cortex.models.shared.* and cortex.models.canonical_enums — shadow imports must be removed"
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_canonical_types.py — ALL listed tests must FAIL"
        blocker: "Do NOT move or delete any class definition until every test fails cleanly"
      green:
        action: |
          For each class in GAP-119-01:
          1. Confirm canonical location already has the definition (or add it)
          2. In each shadow file: replace class definition with import from canonical
          3. Verify no circular imports introduced
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_canonical_types.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Add module-level docstrings to canonical model files (CORE-012); verify type hints on all class fields (CORE-011); run ruff check cortex/ --select=F401,F811"
        gate: "python3 scripts/run_tests.py dir tests/models/ — zero regressions, zero new failures"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + python3 -m ruff check cortex/ --select=F811"
      fix_step: "Remove any newly introduced duplicate definitions; fix import errors"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Log remaining issues with WONT-FIX justification — do NOT silently skip"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_validation_result_importable_from_shared — assert from cortex.models.shared.validation import ValidationResult"
        - "test_health_check_result_importable_from_shared — assert from cortex.models.shared.health import HealthCheckResult"
        - "test_cache_entry_importable_from_shared — assert from cortex.models.shared.cache import CacheEntry, CacheStats"
        - "test_execution_result_importable_from_shared — assert from cortex.models.shared.execution import ExecutionResult"
        - "test_intent_type_importable_from_canonical_enums — assert from cortex.models.canonical_enums import IntentType"
        - "test_risk_level_importable_from_canonical_enums — assert from cortex.models.canonical_enums import RiskLevel"
        - "test_challenge_importable_from_shared — assert from cortex.models.shared.challenges import Challenge"
        - "test_dependency_graph_importable_from_shared — assert from cortex.models.shared.graph import DependencyGraph"
        - "test_no_shadow_validation_result_definitions — grep cortex/ for 'class ValidationResult' returns exactly 1 file"
      green:
        - "Verify cortex/models/shared/validation.py has canonical ValidationResult; delete shadow copies; replace with imports"
        - "Verify cortex/models/shared/health.py has canonical HealthCheckResult; delete shadow copies; replace with imports"
        - "Verify cortex/models/shared/cache.py has canonical CacheEntry + CacheStats; delete shadow copies; replace with imports"
        - "Verify cortex/models/shared/execution.py has canonical ExecutionResult; delete shadow copies; replace with imports"
        - "Verify cortex/models/canonical_enums.py has canonical IntentType + RiskLevel; delete shadow copies; replace with imports"
        - "Create cortex/models/shared/challenges.py if absent; move canonical Challenge there; update imports"
        - "Create cortex/models/shared/graph.py if absent; move canonical DependencyGraph there; update imports"
      refactor:
        - "Add docstrings to all public model classes (CORE-012)"
        - "Verify type hints on all class fields (CORE-011)"
        - "Run ruff check cortex/ --select=F401 to confirm no unused imports introduced"
        - "Confirm CORE-035: each class name now appears in exactly 1 source file"

    acceptance_criteria:
      - "All 9 tdd_sequence.red tests GREEN"
      - "Each of the 9 high-severity classes appears in exactly 1 source file (AST scan)"
      - "REFACTOR gate passes with zero regressions"
      - "ruff F811 → All checks passed"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/models/"
      min_tests_pass: 50
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-119-b"
    title: "Triage and resolve Config class duplications"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-119-02"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "1–2 hours"
    depends_on: ["phase-119-a"]
    prerequisite: "phase-119-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write tests asserting pydantic-nested Config classes are preserved and any non-pydantic duplicate Config classes are removed"
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_config_triage.py — ALL listed tests must FAIL"
        blocker: "Do NOT modify Config class definitions until tests fail cleanly"
      green:
        action: |
          1. For each Config class: classify as pydantic-nested (retain) or top-level duplicate (consolidate)
          2. Top-level duplicates: identify canonical, replace shadows with imports
          3. Pydantic nested: leave in place — they are legitimate pydantic pattern classes
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_config_triage.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Add inline comments marking retained pydantic Config classes as intentional (suppress CORE-035 scanner)"
        gate: "python3 scripts/run_tests.py dir tests/models/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke"
      fix_step: "Fix any import errors introduced by Config consolidation"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Log with WONT-FIX justification"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_pydantic_nested_configs_preserved — dashboard_schema_pydantic.py models still importable and functional"
        - "test_no_top_level_config_duplicates — AST scan for top-level Config class returns ≤1 non-pydantic definition"
      green:
        - "Classify all 19 Config instances as pydantic-nested or top-level"
        - "Consolidate any true top-level Config duplicates into canonical location"
      refactor:
        - "Add # noqa: CORE-035 — pydantic nested class comment on retained inner Configs"

    acceptance_criteria:
      - "All tdd_sequence.red tests GREEN"
      - "Pydantic model imports from dashboard_schema_pydantic.py unbroken"
      - "REFACTOR gate passes with zero regressions"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/models/"
      min_tests_pass: 50
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-119-c"
    title: "Batch consolidation — 191 classes at 2 locations (shadow-import pattern)"
    priority: P2
    status: PLANNED
    gap_refs: ["GAP-119-03"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "4–6 hours (batches of 20)"
    depends_on: ["phase-119-b"]
    prerequisite: "phase-119-b completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures after each batch of 20"

    tdd_cycle:
      red:
        action: "Write parametrized test: for each of the 191 class names, assert AST scan finds exactly 1 definition location in cortex/"
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_batch_consolidation.py — ALL parametrized cases FAIL (all 191 currently show 2 locations)"
        blocker: "Do NOT begin batch consolidation until parametrized test is written and failing"
      green:
        action: |
          Process in batches of 20 classes:
          1. For each class: identify canonical file (prefer cortex/models/shared/ or cortex/models/canonical_enums.py)
          2. In shadow file: replace class definition with `from {canonical_module} import {ClassName}`
          3. Run make test-smoke after each batch — abort if any failure
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_batch_consolidation.py — ALL 191 parametrized cases PASS"
        blocker: "Do NOT begin REFACTOR until all 191 parametrized cases pass"
      refactor:
        action: "Run ruff check cortex/ --select=F401,F811 --fix; verify no circular imports; add canonical location comments"
        gate: "python3 scripts/run_tests.py dir tests/ — zero regressions across full test suite dir"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + python3 -m ruff check cortex/ --select=F811"
      fix_step: "Fix any circular imports or broken references per batch"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Remaining classes with genuine semantic differences → document as intentional variants with comment"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_batch_consolidation_parametrized[{ClassName}] × 191 — AST scan finds >1 location (currently failing = expected at RED)"
      green:
        - "Batch 1 (classes 1–20): consolidate + make test-smoke GREEN"
        - "Batch 2 (classes 21–40): consolidate + make test-smoke GREEN"
        - "... repeat for all 191 classes in batches of 20"
      refactor:
        - "ruff check cortex/ --select=F401 --fix — remove unused imports created by replacements"
        - "Verify ruff F811 → All checks passed after all batches complete"

    acceptance_criteria:
      - "Parametrized test passes for all 191 classes (each has exactly 1 definition location)"
      - "make test-smoke GREEN after every batch"
      - "ruff F811 + F401 → All checks passed on final rescan"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2340
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-119-d"
    title: "Import update sweep — redirect all consumers to canonical locations"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-119-04"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "2–3 hours"
    depends_on: ["phase-119-c"]
    prerequisite: "phase-119-c completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write tests asserting no file imports a class from a path that is now a shadow-import redirect (i.e. from a file that only re-exports)"
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_import_hygiene.py — ALL listed tests must FAIL"
        blocker: "Do NOT update imports until tests are written and failing"
      green:
        action: |
          Use cortex/tools/toolkit/update_imports.py to batch-rewrite all imports
          from shadow locations to canonical cortex/models/shared/* or canonical_enums.py.
          Verify with: grep -rn "from cortex.tools.template_validator import ValidationResult" cortex/ → 0 results
        gate: "python3 scripts/run_tests.py file tests/models/test_phase119_import_hygiene.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Run ruff check cortex/ --select=F401 --fix; confirm isort compliant; add __all__ exports to cortex/models/shared/__init__.py"
        gate: "python3 scripts/run_tests.py dir tests/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke"
      fix_step: "Fix any broken import chains"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      on_exhaustion: "Log remaining import issues for manual review"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_no_shadow_path_imports — no file imports ValidationResult from non-canonical path"
        - "test_shared_init_exports_all_canonical — cortex.models.shared.__init__ exports all consolidated types"
      green:
        - "Run update_imports.py with canonical path map for all consolidated types"
        - "Update cortex/models/shared/__init__.py with __all__ listing all canonical exports"
      refactor:
        - "Run ruff --fix; verify isort passes; check __all__ is complete"

    acceptance_criteria:
      - "All tdd_sequence.red tests GREEN"
      - "No file in cortex/ imports any consolidated class from a shadow (non-canonical) path"
      - "cortex/models/shared/__init__.py exports all types via __all__"
      - "REFACTOR gate passes with zero regressions"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2340
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-119-final"
    title: "Smoke Gate + CORE-064 Sweep Close + cortex-master.yaml update"
    priority: P0
    status: PLANNED
    gap_refs: []
    depends_on: ["phase-119-d"]
    prerequisite: "ALL preceding sub-phase completion_gates PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — ≥2340 smoke tests pass"

    tdd_cycle:
      red:
        action: "N/A — verification gate, not an implementation sub-phase"
        gate: "All sweep_catalogue entries verified CLOSED before proceeding"
        blocker: "Do NOT run smoke gate if any GAP remains OPEN"
      green:
        action: "Run full smoke gate — confirm ≥2340 tests pass with zero regressions; run AST duplicate scan — confirm CORE-035 count ≤ 20"
        gate: "python3 scripts/run_tests.py smoke AND python3 -c 'AST scan returns DUPLICATES ≤ 20'"
        blocker: "Do NOT mark phase COMPLETE if smoke gate fails or duplicate count > 20"
      refactor:
        action: "Update phase YAML: move planned/ → completed/; update cortex-master.yaml status → COMPLETE"
        gate: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml')); print('YAML valid')\""
        blocker: "Do NOT close phase without cortex-master.yaml update"

    acceptance_criteria:
      - "ALL sweep_catalogue GAPs (GAP-119-01 through GAP-119-04) have status: CLOSED"
      - "python3 scripts/run_tests.py smoke passes ≥2340 tests"
      - "Zero new test failures vs baseline"
      - "AST duplicate class scan: DUPLICATES ≤ 20 (residual pydantic nested + intentional shims)"
      - "ruff check cortex/ --select=F811,F401 → All checks passed"
      - "phase-119 detail file moved: planned/ → completed/"
      - "cortex-master.yaml entry updated to status: COMPLETE"
      - "cortex-master.yaml remains ≤500 lines (THIN INDEX CONTRACT)"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 2340
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: false

# ─────────────────────────────────────────────────────────────────────────────
# AC MARKERS
# ─────────────────────────────────────────────────────────────────────────────
ac_markers:
  start: "AC_START: AC-P119-CLASS-CONSOLIDATION-{timestamp}"
  complete: "AC_COMPLETE: AC-P119-CLASS-CONSOLIDATION-{timestamp} ✅"
