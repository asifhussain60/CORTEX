id: phase-137
title: "Deep Intelligence Wiring — CCLQueryEngine + CapabilityVerifier + IntelligenceFacade 4-Method Extension"
created: "2026-03-08"
status: PLANNED
priority: P1
depends_on: ["phase-136"]
sweep_id: SWEEP-137-DEEP-INTELLIGENCE-WIRING
estimated_effort: "1.5 days"
source: "GitHub Issue #14 — CORTEX Feedback 2026-03-08 (FB-2026-03-08-009 partial + FB-2026-03-08-010)"

description: |
  Backport of Deep Intelligence Wiring from cortex-sts Phase 141. Depends on phase-136
  (CAPE) — IntelligenceFacade.classify_archetype() consumes CAPE's ComplexityTriageEngine band.

  Two new infrastructure components + four IntelligenceFacade method extensions:

  1. CCLQueryEngine — translates CORE rule IDs (e.g. "CORE-008") into business-language
     impact statements by querying ccl-governance-crystal.yaml. Supports audience-specific
     translations and multi-violation markdown rendering. Makes governance audits readable
     to non-engineers without requiring knowledge of CORE rule numbering.

  2. verify_capabilities_manifest() — reads cortex-registry/config/capabilities-manifest.yaml
     and calls importlib.import_module() for every declared orchestrator. Returns a drift list
     of unimportable modules, enabling init-time architecture drift detection. Empty list =
     all importable (no drift). Wired into MasterOrchestrator initialization.

  3. IntelligenceFacade 4 new lazy-loaded methods (Phase 141 complement to phase-135's
     acquire/invalidate_cache):
     - threat_assessment(file_path) — delegates to ThreatModelEngine
     - quality_baseline(file_paths) — delegates to QualityAnalysisEngine
     - guidance(module_path) — delegates to KnowledgeGuidanceEngine
     - classify_archetype(workspace_path) — delegates to ArchetypeClassifier
     All use null-object fallbacks for graceful degradation.

governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-035   # Single canonical implementation
  - CORE-048   # Holistic validation gate
  - CORE-061   # CCL Integration — runtime business-language governance queries
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── GAP-137-01: CCLQueryEngine ─────────────────────────────────────────────
  - id: GAP-137-01
    title: "CCLQueryEngine — CORE rule ID → business-language translation"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-010"
    evidence: |
      Governance violation reports surface raw CORE rule IDs (e.g. CORE-008, CORE-035)
      with no business-language context. Non-engineers reading audit output cannot
      understand the business impact of violations. The CCL Governance Crystal YAML
      contains this mapping but is never queried at runtime.
    action_ref: "phase-137-a"
    files_to_create:
      - cortex/governance/ccl_query_engine.py  # CCLQueryEngine with translate_violation(), render_business_impact(), get_all_rules()
    test_file: "tests/intelligence/test_phase_141_infrastructure.py"

  # ── GAP-137-02: verify_capabilities_manifest() ────────────────────────────
  - id: GAP-137-02
    title: "verify_capabilities_manifest() — import-time architecture drift detection"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-010"
    evidence: |
      MasterOrchestrator initialisation has no mechanism to detect if declared orchestrators
      in capabilities-manifest.yaml are actually importable. Architecture drift (renamed/moved
      modules) silently breaks routing without any startup warning. Phase 140 audit in
      cortex-sts identified this gap during wiring integrity scan.
    action_ref: "phase-137-b"
    files_to_create:
      - cortex/core/capability_verifier.py  # verify_capabilities_manifest() function
    files_to_modify:
      - cortex/orchestrators/core/master_orchestrator_init.py  # call verify_capabilities_manifest() at init
    test_file: "tests/intelligence/test_phase_141_infrastructure.py"

  # ── GAP-137-03: IntelligenceFacade — 4 new lazy-loaded methods ────────────
  - id: GAP-137-03
    title: "IntelligenceFacade.threat_assessment() + quality_baseline() + guidance() + classify_archetype()"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-009 (Phase 141 complement)"
    evidence: |
      IntelligenceFacade (Phase 107 canonical entry) exposes analyze/synthesize/query plus
      the Phase 135 additions (acquire/invalidate_cache). Four intelligence capabilities
      remain unreachable via the facade: threat model assessment, quality baseline scoring,
      knowledge guidance, and archetype classification. Callers are forced to instantiate
      provider classes directly, bypassing the canonical entry point (CORE-035 violation).
    action_ref: "phase-137-c"
    files_to_modify:
      - cortex/intelligence/facade.py  # add threat_assessment(), quality_baseline(), guidance(), classify_archetype() with null-object fallbacks
    test_file: "tests/intelligence/test_facade_kal_extension.py"

  # ── GAP-137-04: URS emission on low-confidence routing ────────────────────
  - id: GAP-137-04
    title: "IntentRouter URS emission on low-confidence routing"
    severity: P2
    status: OPEN
    source: "Issue #14 — FB-2026-03-08 GAP-141-02"
    evidence: |
      IntentRouter.routing_core_mixin emits no learning signal when routing confidence
      falls below threshold. Low-confidence routes represent valuable training data for the
      URS closed-loop learning system but are currently silently discarded.
    action_ref: "phase-137-d"
    files_to_modify:
      - cortex/orchestrators/core/intent_router/routing_core_mixin.py  # emit MILD_PUNISHMENT on confidence < threshold
    test_file: "tests/intelligence/test_phase_141_infrastructure.py"

