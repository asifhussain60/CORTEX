# ============================================
# VISION & OBJECTIVES
# ============================================

vision: |
  Transform cortex-docs/index.html into an impressive, modern documentation landing page
  that showcases CORTEX capabilities through professional glassmorphism design, Google Fonts
  typography, and visual excellence. Eliminate congested layouts, standardize CSS architecture,
  and create a unified design system across all documentation views.

objectives:
  - Consolidate all inline <style> blocks into external CSS files (zero inline styles)
  - Integrate modern Google Fonts (Inter, Space Grotesk, JetBrains Mono) across all views
  - Redesign congested navigation/path sections with card-based, spacious layouts
  - Standardize header sizes (h1-h6) via CSS variables in glass-design-tokens.css
  - Add impressive icons and visual elements to showcase CORTEX capabilities
  - Apply subtle glass animations professionally (no over-animation)
  - Maintain 3 sections from Vision API (hero, features, governance) - improve typography only
  - Ensure WCAG 2.1 Level AA compliance throughout
  - Validate with comprehensive TDD test suite

