id: "phase-153"
title: "CORTEX Developer CLI — Claude Code Parity: Trust-Tiered Execution + Native CLI REPL + Headless CI Mode + Web Fetch"
created: "2026-03-15"
status: PLANNED
priority: P0
governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-028   # File naming: snake_case only
  - CORE-035   # Single canonical implementation
  - CORE-050   # MCP tiered blocking
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-153-CORTEX-DEVELOPER-CLI"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: CORTEX vs Claude Code comparative analysis (2026-03-15 chat session).
  Comparative score at entry: CORTEX 9.05/10 (governance, TDD, learning) vs
    Claude Code 5.15/10 on same weighted 10-dimension scoring.
  Key gaps where Claude Code outscores CORTEX:
    - Setup/Time-to-value: Claude Code 9/10 vs CORTEX 5/10
    - Raw flexibility: no trust model means mandatory proceed gates even for trivial ops
    - Headless/CI use: no --print entrypoint for GitHub Actions integration
    - No native terminal REPL: requires VS Code + MCP to operate
    - Web fetch absent: cannot retrieve documentation or search for solutions
    - Cold-start context: SQLite audit history not loaded at session start
  Target: Close the developer-experience gap while preserving CORTEX governance superiority.
  Baseline measurements:
    - Smoke tests: 2791 passed
    - Preflight tests: 446 passed
    - Total collected: ~21,269
  Git prerequisite: main branch, all phases 148-152 COMPLETE.

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-153-01"
    title: "No trust-tiered execution — every operation requires explicit `proceed` regardless of risk level"
    severity: P0
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      EnforcementOrchestrator always gates on DoR + proceed regardless of operation complexity.
      A single-line docstring addition routes through the full 4-stage pipeline with DoR display.
      Claude Code executes low-risk ops immediately without proceed confirmation.
      Fix: CORTEX_TRUST_LEVEL env var with strict (default) | auto | interactive tiers.
      auto: proceeds if complexity_score < 0.3 AND no P0 risks (CORE-008/CORE-064 still enforced).
    action_ref: "phase-153-a"
    status: OPEN

  - id: "GAP-153-02"
    title: "Session context cold-start — prior audit history not loaded at InteractionOrchestrator init"
    severity: P1
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      .cortex-runtime/traces/orchestrator-traces.db contains audit history but is never surfaced.
      Every session starts with zero context: no prior P0s, no known flakes, no recurring patterns.
      Claude Code builds context progressively; CORTEX forgets every session start.
      Fix: InteractionOrchestrator.__init__ calls SessionBootstrap.load() — reads last 3 audit
      sessions from SQLite and surfaces open P0s as a session banner.
    action_ref: "phase-153-b"
    status: OPEN

  - id: "GAP-153-03"
    title: "FileFactory lacks direct file operation methods — MCP-bound file ops prevent CLI/headless use"
    severity: P0
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      All file read/write in CORTEX routes through MCP tools, which require VS Code to be active.
      cortex/core/file_factory.py exists but lacks read_file(), write_file(), apply_diff() methods.
      Without these, orchestrators cannot operate in CLI or headless mode (no VS Code).
      Fix: Extend FileFactory with pathlib-only direct ops; orchestrators use FileFactory when
      MCP unavailable (mode detection via CORTEX_CLI_MODE env var or absence of MCP session).
    action_ref: "phase-153-c"
    status: OPEN

  - id: "GAP-153-04"
    title: "No FastPath for low-complexity single-file operations — routing overhead for trivial ops"
    severity: P1
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      IntentRouter routes all requests through full 4-stage pipeline (Interaction→Intent→Intelligence→Execution).
      LENS analysis adds 200ms–2s latency even for trivial ops (add docstring, rename variable).
      Claude Code executes these in <1s with no pipeline overhead.
      Fix: Add complexity_score() to IntentRouter. Score < 0.3 → FastPathExecutor (TDD + AC markers;
      no LENS, no DoR, no proceed gate). CORE-008 and CORE-064 still apply in FastPath.
    action_ref: "phase-153-c"
    status: OPEN

  - id: "GAP-153-05"
    title: "No headless/CI entrypoint — cannot use CORTEX in GitHub Actions or automated pipelines"
    severity: P1
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      Claude Code supports `claude --print "instruction"` for non-interactive execution.
      CORTEX has no equivalent: python -m cortex --help works but there is no --print flag.
      Blocks: GitHub Actions audit jobs, pre-merge checks, Docker-based CI pipelines.
      Fix: cortex/cli/headless.py with --print flag. Implies CORTEX_TRUST_LEVEL=auto.
      Output to stdout, exit 0 on success / 1 on P0. JSON report to .cortex-runtime/.
    action_ref: "phase-153-d"
    status: OPEN

  - id: "GAP-153-06"
    title: "No native developer CLI REPL — CORTEX requires VS Code + MCP for all operations"
    severity: P0
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      Claude Code runs as `claude` in any terminal: iTerm, Windows Terminal, Docker shells.
      CORTEX requires VS Code open + MCP server active + GitHub Copilot Chat.
      Blocks: server SSH sessions, Docker containers, CI environments, vim/nvim users.
      Fix: cortex/cli/dev_repl.py — natural-language REPL routing through IntentRouter +
      MasterOrchestrator from terminal. Uses FileFactory direct ops (GAP-153-03 fix).
      Registered as `cortex` console_scripts entry in pyproject.toml.
    action_ref: "phase-153-e"
    status: OPEN

  - id: "GAP-153-07"
    title: "No web fetch capability — CORTEX cannot retrieve documentation or search for solutions"
    severity: P1
    source: "CORTEX vs Claude Code comparative analysis (2026-03-15)"
    evidence: |
      Claude Code fetches URLs, PyPI pages, GitHub Issues natively during problem-solving.
      CORTEX has no cortex_web MCP tool: cannot look up error docs, package changelogs, or APIs.
      Limits debug quality for external library errors (no stacktrace → docs correlation).
      Fix: cortex/mcp/tools/web_tool.py with ops: fetch/search/pypi/gh_issue.
      Security: URL allowlist + SSRF guard (block private IPs: 10.x/172.16.x/192.168.x/127.x).
      Log all fetches to .cortex-runtime/. Register as tool #37 in mcp_registry.py.
    action_ref: "phase-153-f"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT (CORE-008 + CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# PHASES (ROI-ordered: highest impact first)
# ─────────────────────────────────────────────────────────────────────────────
phases:
  # ────────────────────────────────────────────────────────────────────────────
  # SUB-PHASE A: Trust-Tiered Execution (GAP-153-01)
  # Lowest effort, highest friction removal. Gate on env var before any pipeline.
  # ────────────────────────────────────────────────────────────────────────────
  - id: "phase-153-a"
    title: "Trust-Tiered Execution — CORTEX_TRUST_LEVEL env var + EnforcementOrchestrator guard"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-153-01"]
    governance_authority: "CORE-008, CORE-035, CORE-064, CORE-068"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥2791 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write ALL failing tests in tdd_sequence.red BEFORE any implementation"
        gate: "python3 scripts/run_tests.py file tests/core/test_trust_tiered_execution.py — ALL listed tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails"
      green:
        action: "Implement CORTEX_TRUST_LEVEL check in EnforcementOrchestrator.should_require_proceed()"
        gate: "python3 scripts/run_tests.py file tests/core/test_trust_tiered_execution.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints (CORE-011), docstrings (CORE-012), deduplication (CORE-035)"
        gate: "python3 scripts/run_tests.py dir tests/core/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + cortex_validate op=compliance"
      fix_step: "Apply targeted fixes for each issue found in rescan"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      backoff_strategy: none
      on_exhaustion: "Log remaining issues inline — do NOT silently skip"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_strict_mode_always_requires_proceed — CORTEX_TRUST_LEVEL=strict → should_require_proceed() returns True for all ops"
        - "test_auto_mode_low_complexity_skips_proceed — CORTEX_TRUST_LEVEL=auto + complexity=0.2 → returns False"
        - "test_auto_mode_high_complexity_requires_proceed — CORTEX_TRUST_LEVEL=auto + complexity=0.8 → returns True"
        - "test_auto_mode_p0_risk_requires_proceed — CORTEX_TRUST_LEVEL=auto + p0_risk=True → returns True regardless of complexity"
        - "test_interactive_mode_single_file_skips_proceed — CORTEX_TRUST_LEVEL=interactive + file_count=1 → returns False"
        - "test_interactive_mode_multi_file_requires_proceed — CORTEX_TRUST_LEVEL=interactive + file_count=5 → returns True"
        - "test_tdd_always_enforced_in_auto_mode — CORTEX_TRUST_LEVEL=auto → CORE-008 check still runs (TDD gate not bypassed)"
        - "test_sweep_completeness_always_enforced_in_auto_mode — CORTEX_TRUST_LEVEL=auto → CORE-064 check still runs"
        - "test_invalid_trust_level_falls_back_to_strict — CORTEX_TRUST_LEVEL=invalid → defaults to strict behavior"
        - "test_default_trust_level_is_strict — no env var set → should_require_proceed() returns True"
      green:
        - "Add TrustLevel enum (STRICT, AUTO, INTERACTIVE) to cortex/core/trust_tier.py"
        - "Add should_require_proceed(complexity_score, p0_risk, file_count) to EnforcementOrchestrator"
        - "Read CORTEX_TRUST_LEVEL from os.environ with 'strict' default"
        - "AUTO: return True if complexity_score >= 0.3 OR p0_risk == True"
        - "INTERACTIVE: return True if file_count > 1"
        - "Preserve all CORE-008 and CORE-064 checks regardless of trust level"
      refactor:
        - "Add docstrings to TrustLevel, TrustTierConfig, should_require_proceed() (CORE-012)"
        - "Add type hints to all signatures (CORE-011)"
        - "Verify no duplicate TrustLevel definitions exist (CORE-035)"

    acceptance_criteria:
      - "CORTEX_TRUST_LEVEL env var read by EnforcementOrchestrator on every operation"
      - "strict (default): proceed gate always shown — no change to existing behavior"
      - "auto: proceed gate skipped when complexity_score < 0.3 AND p0_risk == False"
      - "interactive: proceed gate skipped for single-file ops; shown for multi-file"
      - "CORE-008 (TDD) enforced in ALL trust levels — this guard is never bypassed"
      - "CORE-064 (sweep completeness) enforced in ALL trust levels"
      - "All 10 tdd_sequence.red tests GREEN"
      - "Zero regressions in tests/core/ REFACTOR gate"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/core/"
      min_tests_pass: 10
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

