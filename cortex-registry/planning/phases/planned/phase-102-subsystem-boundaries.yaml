# Phase 102: Subsystem Boundary Cleanup — Duplicate Domains and Orphaned Packages
# Authority: Comprehensive Architectural Audit (2026-03-02)
# THIN INDEX CONTRACT: All detail lives HERE, not in cortex-master.yaml

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

metadata:
  id: phase-102
  title: "Subsystem Boundary Cleanup — Duplicate Domains and Orphaned Packages"
  priority: P1
  status: PLANNED
  sweep_id: SWEEP-102-SUBSYSTEM-BOUNDARIES
  created: "2026-03-02"
  estimated_effort: "6-8 hours"
  risk: MEDIUM
  dependencies: [phase-101]

problem_summary: |
  The codebase has grown to 20 top-level directories under cortex/ with significant 
  domain overlap creating architectural confusion:
  
  DUPLICATE DOMAIN BOUNDARIES (same concept in multiple places):
  - governance: cortex/governance/ (28 files) + cortex/core/governance/ (1 file) + 
    cortex/intelligence/governance/ + cortex/intelligence/memory/tier2_adaptive/governance/
    + cortex/intelligence/memory/tier1_learned/governance/ + cortex/knowledge/best_practices/governance/
    → 6 copies of "governance" namespace
  - knowledge: cortex/knowledge/ (2 files) + cortex/core/knowledge/ + 
    cortex/intelligence/knowledge/ + cortex/intelligence/tier3/knowledge/
    → 4 copies of "knowledge" namespace
  - lens: cortex/lens/ (66 files) + cortex/intelligence/lens/ (27 files)
    → Parallel lens implementations (MAJOR overlap)
  - models: cortex/models/ + cortex/core/models/ + cortex/intelligence/lens/models/ + 
    cortex/lens/models/ + cortex/dashboards/models/
    → 5 copies of "models" namespace
  
  THIN/ORPHANED PACKAGES (< 3 files, may be vestigial):
  - cortex/enforcement/ (2 files) — only used by 2 callers
  - cortex/config/ (3 files) — only used by 1 caller
  - cortex/secrets/ (2 files) — proxy to cortex/infrastructure/secrets/ (18 files)
  
  STALE NAMING (legacy "brain" references):
  - cortex/core/brain_state_manager.py
  - cortex/mcp/tools/brain_collaboration_tools.py
  - cortex/mcp/tools/brain.py
  - cortex/orchestrators/core/central_brain_orchestrator.py
  - cortex/orchestrators/core/brain_health_orchestrator.py
  - cortex/infrastructure/brain_health_metrics.py
  - cortex/infrastructure/shared_brain_store.py
  → 7 files using "brain" naming convention from deleted cortex/brain/ package

affected_files:
  # Governance overlap
  - cortex/governance/ (28 files — canonical)
  - cortex/core/governance/__init__.py (1 file — orphan)
  # Knowledge overlap
  - cortex/knowledge/ (2 files — thin)
  - cortex/core/knowledge/ (large — canonical?)
  - cortex/intelligence/knowledge/ (12 files)
  # Lens overlap
  - cortex/lens/ (66 files — canonical)
  - cortex/intelligence/lens/ (27 files — duplicate domain)
  # Brain naming
  - cortex/core/brain_state_manager.py
  - cortex/mcp/tools/brain_collaboration_tools.py
  - cortex/mcp/tools/brain.py
  - cortex/orchestrators/core/central_brain_orchestrator.py
  - cortex/orchestrators/core/brain_health_orchestrator.py
  - cortex/infrastructure/brain_health_metrics.py
  - cortex/infrastructure/shared_brain_store.py
  # Thin packages
  - cortex/enforcement/
  - cortex/config/
  - cortex/secrets/

root_cause: |
  The 94-phase evolution created subsystems at different times. When cortex/brain/ was
  dissolved (Phase 54), content was scattered across intelligence/, core/, and 
  orchestrators/ but file names retained "brain" prefix. Knowledge and governance
  concepts were implemented in multiple subsystems independently without clear 
  boundary ownership. cortex/intelligence/lens/ was the original location before
  cortex/lens/ was promoted to top-level (Phase 58+) but the original was never removed.

refactoring_strategy: |
  1. Establish canonical ownership per domain (SSOT):
     - governance → cortex/governance/ (absorb core/governance/)
     - knowledge → cortex/intelligence/knowledge/ (absorb cortex/knowledge/, core/knowledge/)
     - lens → cortex/lens/ (cortex/intelligence/lens/ is dotnet-specific tooling — rename)
  2. Rename "brain" files to domain-appropriate names
  3. Absorb thin packages into their canonical parent
  4. Update all import paths across the codebase
  5. Update wiring YAML specifications

risks:
  - cortex/intelligence/lens/ contains dotnet Roslyn CLI builds — needs careful handling
  - Brain→intelligence rename may break MCP tool registry names
  - Absorbing cortex/secrets/ into cortex/infrastructure/secrets/ may affect external consumers

