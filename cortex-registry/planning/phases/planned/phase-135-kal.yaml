id: phase-135
title: "Knowledge Acquisition Layer (KAL) — Coverage Assessor + Acquisition Orchestrator + IntelligenceFacade.acquire()"
created: "2026-03-08"
status: PLANNED
priority: P1
depends_on: []
sweep_id: SWEEP-135-KAL
estimated_effort: "2 days"
source: "GitHub Issue #14 — CORTEX Feedback 2026-03-08 (FB-2026-03-08-006, 007, 008, 009 partial)"

description: |
  Standalone foundation backport — no dependencies. Delivers the Knowledge Acquisition
  Layer from cortex-sts Phases 137 and 138 (94 GAPs closed across 6 phases total;
  this phase extracts the KAL-specific subset).

  KAL solves a gap in CORTEX intelligence: when LENS analysis encounters a domain
  not covered by existing knowledge YAMLs, requests degrade silently. KAL adds
  on-demand knowledge synthesis: assess coverage → identify gaps → synthesize YAML
  → validate schema → register in INDEX.yaml → re-verify. This runs automatically
  from Stage 1 comprehension (InteractionOrchestrator._run_kal_coverage_check()) and
  on-demand via IntelligenceFacade.acquire().

  Four new components:
  1. DomainSignalExtractor — converts LENS output to domain signal strings via
     regex patterns in cortex-registry/config/domain-signal-map.yaml
  2. KnowledgeCoverageAssessor — scores coverage (0.0–1.0) against INDEX.yaml,
     triggers acquisition when below threshold (default 0.80)
  3. KnowledgeAcquisitionOrchestrator — 6-step pipeline with OPJMixin + URS signals
  4. Supporting triad: KnowledgeTemplateSynthesizer + KnowledgeSchemaValidator +
     KnowledgeIndexRegistrar

  IntelligenceFacade gains two new methods: acquire() (KAL entry) and
  invalidate_cache() (BUG-1 fix — static cache never invalidated post-acquisition).

governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-035   # Single canonical implementation
  - CORE-048   # Holistic validation gate
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── GAP-135-01: domain-signal-map.yaml + DomainSignalExtractor ─────────────
  - id: GAP-135-01
    title: "domain-signal-map.yaml config + DomainSignalExtractor"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-006"
    evidence: |
      No mechanism exists to convert LENS output (language/files/imports) into
      domain signal strings matchable against INDEX.yaml entries. Without this,
      KnowledgeCoverageAssessor cannot compute coverage — the entire KAL pipeline
      has no input layer.
    action_ref: "phase-135-a"
    files_to_create:
      - cortex-registry/config/domain-signal-map.yaml          # regex patterns: {pattern, domain, knowledge_file}
      - cortex/intelligence/knowledge/domain_signal_extractor.py
    test_file: "tests/intelligence/test_knowledge_coverage_assessor.py"

  # ── GAP-135-02: KnowledgeCoverageAssessor ──────────────────────────────────
  - id: GAP-135-02
    title: "KnowledgeCoverageAssessor — coverage scoring + acquisition trigger"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-006"
    evidence: |
      No component exists to assess what fraction of detected domain signals have
      corresponding knowledge YAML entries in INDEX.yaml. Without a coverage score,
      CORTEX cannot know when knowledge gaps exist, making acquisition triggers
      impossible.
    action_ref: "phase-135-a"
    files_to_create:
      - cortex/intelligence/knowledge/knowledge_coverage_assessor.py  # CoverageResult dataclass + assess()
    test_file: "tests/intelligence/test_knowledge_coverage_assessor.py"

  # ── GAP-135-03: KAL supporting triad ──────────────────────────────────────
  - id: GAP-135-03
    title: "KnowledgeTemplateSynthesizer + KnowledgeSchemaValidator + KnowledgeIndexRegistrar"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-008"
    evidence: |
      The acquisition pipeline needs three atomic components: a synthesizer to
      generate CORTEX-format knowledge YAMLs (5 best-practice categories), a
      validator enforcing a 5-rule schema, and a registrar for idempotent INDEX.yaml
      updates. Without these, KnowledgeAcquisitionOrchestrator has no worker
      components to delegate to.
    action_ref: "phase-135-b"
    files_to_create:
      - cortex/intelligence/knowledge/knowledge_template_synthesizer.py
      - cortex/intelligence/knowledge/knowledge_schema_validator.py
      - cortex/intelligence/knowledge/knowledge_index_registrar.py
    test_file: "tests/intelligence/test_knowledge_acquisition.py"

  # ── GAP-135-04: KnowledgeAcquisitionOrchestrator + IntelligenceFacade extension
  - id: GAP-135-04
    title: "KnowledgeAcquisitionOrchestrator (6-step) + IntelligenceFacade.acquire() + invalidate_cache()"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-007, 009"
    evidence: |
      IntelligenceFacade (Phase 107 canonical entry) has no acquire() method,
      meaning KAL is unreachable from Stage 1 comprehension. The static
      _registry_index_cache is never invalidated post-acquisition — new knowledge
      files are invisible until process restart (BUG-1). KnowledgeAcquisitionOrchestrator
      does not exist; the 6-step pipeline has no coordinator.
    action_ref: "phase-135-c"
    files_to_create:
      - cortex/intelligence/knowledge/knowledge_acquisition_orchestrator.py  # OPJMixin, 6-step, URS signals
      - cortex-registry/workflows/templates/intelligence/knowledge-acquisition-workflow.yaml
      - cortex-registry/patterns/success/knowledge_acquisition_orchestrator.yaml
      - cortex-registry/patterns/failure/knowledge_acquisition_orchestrator.yaml
    files_to_modify:
      - cortex/intelligence/facade.py  # add acquire(), invalidate_cache(), _NullCoverageAssessor, _NullAcquisitionOrchestrator
      - cortex/orchestrators/core/interaction_orchestrator.py  # add _run_kal_coverage_check() to Stage 1
    test_file: "tests/intelligence/test_knowledge_acquisition.py"

