    duration_estimate: "4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥2775 baseline)"
    regression_gate: "make test-smoke — zero new failures"
    
    tdd_cycle:
      red:
        action: "Write failing tests for ProcessGapAnalyzer.analyze(), .compare(), .generate_report()"
        gate: "pytest tests/orchestrators/domain/test_process_gap_analyzer.py — all tests FAIL"
        blocker: "No implementation until tests fail"
      green:
        action: "Implement ProcessGapAnalyzer with LENS integration and template rendering"
