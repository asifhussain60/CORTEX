sweep_catalogue:
  # ── CORE PO CAPABILITIES (P1) ────────────────────────────────────────────────
  - id: "GAP-129-01"
    title: "Process Gap Analysis Engine — Current State vs. Best Practice Comparison"
    severity: P1
    source: "PO enhancement request 2026-03-07"
    evidence: |
      No structured template or engine exists for comparing current application process
      against best practices. LENS analyzes code but doesn't produce process-level
      documentation. Challenge-First shows alternatives but not as a formal process gap report.
      Missing: ProcessGapAnalyzer class, process_gap_template.yaml, MCP tool exposure
    action_ref: "phase-129-a"
    status: OPEN
    deliverables:
      - "cortex/orchestrators/domain/process_gap_analyzer.py"
      - "cortex-registry/templates/reports/process_gap_template.yaml"
      - "cortex/mcp/tools/cortex_process_gap.py"
      - "tests/orchestrators/domain/test_process_gap_analyzer.py"

  - id: "GAP-129-02"
    title: "Requirements Engineering Pipeline — Vague Idea → Testable ACs Workflow"
    severity: P1
    source: "PO enhancement request 2026-03-07"
    evidence: |
      DoR Gate validates ACs but no pipeline exists to DERIVE accurate requirements
      from vague user ideas. Missing: RequirementsEngineer class that uses LENS context
      to suggest specific, testable ACs grounded in existing codebase patterns.
      Should integrate with Challenge-First for alternative requirement framings.
    action_ref: "phase-129-b"
    status: OPEN
    deliverables:
      - "cortex/orchestrators/domain/requirements_engineer.py"
      - "cortex-registry/workflows/templates/sdlc/requirements-engineering-workflow.yaml"
      - "cortex/mcp/tools/cortex_requirements.py"
      - "tests/orchestrators/domain/test_requirements_engineer.py"

