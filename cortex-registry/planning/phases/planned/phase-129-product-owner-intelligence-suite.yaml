sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: true  # Large phase — may split into 129-a through 129-m
  phase_atomic: false          # Sub-phases can be completed in separate sessions
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

