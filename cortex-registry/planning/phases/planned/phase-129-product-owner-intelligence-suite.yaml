# CORTEX Phase Plan — Phase 129: Product Owner Intelligence Suite
# Purpose: Enhance CORTEX capabilities for Product Owners using SAFe/Scrum methodologies
# Governance: master-plan-phase-lifecycle.yaml checkpoint-create

id: "phase-129"
title: "Product Owner Intelligence Suite — SAFe/Scrum Decision Support, ROI Calculator, Change Recommendation Engine"
created: "2026-03-07"
status: PLANNED
priority: P1
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-012  # Docstrings on all public APIs
  - CORE-035  # Single canonical implementation
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-129-PO-INTELLIGENCE-SUITE"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Product Owner HTML view enhancement request (2026-03-07 Copilot Chat session)
  Score at entry: 6.0 / 10 (PO capabilities are partial — LENS/Challenge exist but no structured outputs)
  Target score: 9.5 / 10 (full PO decision support suite with ROI, change impact, training docs)
  
  User requirements identified:
  1. Document current application process vs. best practice changes
  2. Accurate requirements derivation for desired outcomes
  3. Convert changes into training documents
  4. LOE → automated ROI report calculation
  5. Change recommendation report with impact analysis
  
  Expanded scope (adjacent gaps):
  6. SAFe/Scrum vocabulary integration (Epics, Features, PIs, ARTs)
  7. Work item integration foundation (ADO/Jira API contracts)
  8. PO metrics dashboard from live SQLite data
  9. Executive summary generator
  10. Sprint capacity calculator
  11. Feature dependency graph for PO planning
  12. Persistent risk register
  
  Baseline measurements:
    - Smoke tests: 2775 passed
    - Preflight: 425 passed
    - Existing PO-adjacent tools: Challenge-First, DoR Gate, LENS, RCA Engine
  
  Git prerequisite: main branch clean, all phase-128 changes merged

