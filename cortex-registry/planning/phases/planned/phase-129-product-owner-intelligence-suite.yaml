        action: "Add type hints, docstrings, MCP tool registration"
        gate: "make test-smoke — zero regressions"
        blocker: "Sub-phase not complete until refactor passes"
    
    convergence_gate:
      detect_step: "make test-smoke + cortex_validate op=compliance"
      fix_step: "Fix any P0/P1 violations"
      success_predicate: "p0_count == 0 and p1_count == 0"
      max_cycles: 3

