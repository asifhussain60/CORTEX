    title: "Training Document Generator — Session/Change → Structured Training Output"
    severity: P1
    source: "PO enhancement request 2026-03-07"
    evidence: |
      `/distill` converts chat sessions to prompts but no template produces formal
      training documents. Missing: TrainingDocGenerator that takes implementation
      sessions and outputs step-by-step training materials with screenshots placeholders,
      procedures, and validation checklists.
    action_ref: "phase-129-c"
    status: OPEN
    deliverables:
