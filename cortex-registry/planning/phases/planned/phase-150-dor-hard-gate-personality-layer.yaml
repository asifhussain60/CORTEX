phases:
  # ── Sub-phase A: DoRScore + DoRApprovalGate CORE-071 ─────────────────────────
  - id: "phase-150-a"
    title: "DoRScore dataclass (5 weighted dimensions) + DoRApprovalGate.is_ready() for CORE-071"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-150-01"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-071"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "Phase 149 completion_gate PASSED. smoke tests green."
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    files_to_modify:
      - "cortex/core/dor_tracker.py"  # add DoRScore dataclass + DoRTracker.evaluate(request, lens_context) method
      - "cortex/orchestrators/core/dor_approval_gate.py"  # add is_ready(score: DoRScore), missing_dimensions(score)

    implementation_guide: |
      IMPORTANT: Both existing files retain their current public interface.
      New additions are ADDITIVE only — no existing code deleted.

      In cortex/core/dor_tracker.py, add:
        @dataclass
        class DoRScore:
            requirement_completeness: float  # weight 30%
            architecture_clarity: float       # weight 25%
            dependency_resolution: float      # weight 20%
            test_readiness: float             # weight 15%
            risk_assessment: float            # weight 10%

            @property
            def composite(self) -> int:
                return round(
                    self.requirement_completeness * 30 +
                    self.architecture_clarity * 25 +
                    self.dependency_resolution * 20 +
                    self.test_readiness * 15 +
                    self.risk_assessment * 10
                )

        Then add evaluate(request: str, lens_context: dict) -> DoRScore to DoRTracker (or new DoRScoringTracker).

      In cortex/orchestrators/core/dor_approval_gate.py, add:
        def is_ready(self, score: "DoRScore") -> bool:
            return score.composite >= 100

        def missing_dimensions(self, score: "DoRScore") -> list[str]:
            dims = {"requirement_completeness": 30, "architecture_clarity": 25,
                    "dependency_resolution": 20, "test_readiness": 15, "risk_assessment": 10}
            return [k for k, _ in dims.items() if getattr(score, k, 0.0) < 1.0]

    tdd_cycle:
      red:
        action: "Write DoRScore + gate tests before adding any code"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/core/test_plan_gate.py — ALL FAIL"
        blocker: "No implementation until RED gate passes"
      green:
        action: "Add DoRScore dataclass + is_ready() overload to DoRApprovalGate"
        gate: "python3 scripts/run_tests.py file tests/unit/orchestrators/core/test_plan_gate.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Verify type hints; composite property returns int; missing_dimensions correct"
        gate: "python3 scripts/run_tests.py dir tests/unit/orchestrators/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_dor_score_composite_all_ones — composite returns 100 when all dimensions = 1.0"
        - "test_dor_score_composite_all_zeros — composite returns 0 when all dimensions = 0.0"
        - "test_dor_score_composite_partial — composite correctly weights partial scores"
        - "test_dor_score_composite_is_int — composite property is int, not float"
        - "test_is_ready_true_when_composite_100 — is_ready() True when composite == 100"
        - "test_is_ready_false_when_composite_99 — is_ready() False when composite == 99"
        - "test_missing_dimensions_returns_low_dims — returns names of dimensions < 1.0"
        - "test_is_ready_edge_case_float_rounding — composite 99.5 rounds to 100 (is_ready True)"
      green:
        - "Add DoRScore dataclass to dor_tracker.py"
        - "Add is_ready(DoRScore) and missing_dimensions() to DoRApprovalGate"
      refactor:
        - "Ensure DoRScore uses __post_init__ validation that all dimensions in [0.0, 1.0]"
        - "Type hints: is_ready(self, score: DoRScore) -> bool"

    acceptance_criteria:
      - "DoRApprovalGate.is_ready() returns False when any single dimension drops composite below 100"
      - "DoRScore.composite property returns int (not float)"
      - "missing_dimensions() returns correct list of dimension names below threshold"
      - "All gate state machine tests GREEN"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/unit/orchestrators/core/test_plan_gate.py"
      min_tests_pass: 12
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── Sub-phase B: dor-display.yaml Update ─────────────────────────────────────
  - id: "phase-150-b"
    title: "Update dor-display.yaml — 5-dimension state machine + bifurcated response paths + workflow Step 0 injection"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-150-02"]
    governance_authority: "CORE-008, CORE-064"
    duration_estimate: "1.5 hours"
    depends_on: ["phase-150-a"]
    prerequisite: "phase-150-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    files_to_modify:
      - "cortex-registry/workflows/templates/primitives/governance/dor-display.yaml"
      - "cortex-registry/workflows/templates/sdlc/implement-workflow.yaml"
      - "cortex-registry/workflows/templates/sdlc/fix-workflow.yaml"
      - "cortex-registry/workflows/templates/quality/refactor-workflow.yaml"
      # Check all other code-modifying workflows for dor-display Step 0 injection

    implementation_guide: |
      Update dor-display.yaml with:
        scoring_dimensions: [requirement_completeness, architecture_clarity, dependency_resolution, test_readiness, risk_assessment]
        state_machine:
          states: [DRAFT, REFINEMENT, READINESS_VALIDATION, GATE_OPEN, TDD_IMPLEMENTATION]
          transitions:
            - from: DRAFT, to: REFINEMENT, trigger: initial_request_received
            - from: REFINEMENT, to: READINESS_VALIDATION, trigger: dor_dimensions_collected
            - from: READINESS_VALIDATION, to: GATE_OPEN, trigger: composite_ge_100
            - from: READINESS_VALIDATION, to: REFINEMENT, trigger: composite_lt_100
            - from: GATE_OPEN, to: TDD_IMPLEMENTATION, trigger: user_confirms_proceed
        response_paths:
          below_threshold:
            template: block-dor-guidance
            suppress_proceed_gate: true
          at_threshold:
            template: block-dor-gate-open
            render_proceed_gate: true

      Add as Step 0 to all code-modifying workflow YAMLs (before existing Step 1).
      Verify: grep "dor-display" cortex-registry/workflows/templates/**/*.yaml

    tdd_cycle:
      red:
        action: "Write golden assertion that dor-display is Step 0 in implement + fix + refactor workflows"
        gate: "python3 scripts/run_tests.py file tests/golden/test_reflection_before_execution.py — ≥1 FAIL"
        blocker: "No YAML updates until test written"
      green:
        action: "Update dor-display.yaml + add dor-display as Step 0 in all code-modifying workflows"
        gate: "python3 scripts/run_tests.py file tests/golden/test_reflection_before_execution.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Validate all YAML files parse correctly; run yaml.safe_load on each"
        gate: "python3 scripts/run_tests.py smoke — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_dor_display_is_step_0_implement — implement-workflow.yaml has dor-display as step 0"
        - "test_dor_display_is_step_0_fix — fix-workflow.yaml has dor-display as step 0"
        - "test_dor_display_is_step_0_refactor — refactor-workflow.yaml has dor-display as step 0"
        - "test_dor_display_has_state_machine — dor-display.yaml defines 5-state machine"
        - "test_block_dor_guidance_suppresses_proceed — below_threshold.suppress_proceed_gate: true"
      green:
        - "Update dor-display.yaml with state machine and response paths"
        - "Inject dor-display as Step 0 in all code-modifying workflows"
      refactor:
        - "YAML syntax validation on all modified files"

    acceptance_criteria:
      - "All 5 code-modifying workflow YAML files reference dor-display as their first step"
      - "dor-display.yaml defines 5-dimension scoring + 5-state state machine"
      - "block-dor-guidance suppresses ⚡ Proceed Gate (suppress_proceed_gate: true)"
      - "Golden reflection test passes"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/golden/test_reflection_before_execution.py"
      min_tests_pass: 5
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── Sub-phase C: PersonalityLayer ─────────────────────────────────────────────
  - id: "phase-150-c"
    title: "Create PersonalityLayer + wire into InteractionOrchestrator"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-150-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-049"
    duration_estimate: "2 hours"
    depends_on: ["phase-150-b"]
    prerequisite: "phase-150-b completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    new_files:
      - "cortex/orchestrators/core/personality_layer.py"
      - "tests/golden/response/test_phase_150_dor_reflection_golden.py"

    files_to_modify:
      - "cortex/orchestrators/core/interaction_orchestrator.py"  # add self._personality + wiring

    implementation_guide: |
      Create cortex/orchestrators/core/personality_layer.py:

        class PersonalityLayer:
            def __init__(self, persona: str = "cortex") -> None:
                self.persona = persona

            def voiced_summary(self, request_texts: list[Any]) -> str:
                """Convert chronological request list to narrative progress sentence. Returns '' for empty."""
                try:
                    if not request_texts:
                        return ""
                    # Build narrative: "I'm helping you {summarize last request}..." etc.
                    ...
                except Exception:
                    return ""  # CORE-049 silent degradation

            def voiced_dod_items(self, raw_dod: list[str]) -> list[str]:
                """Transform mechanical DoD items to action-oriented narrative bullets."""
                try:
                    ...
                except Exception:
                    return raw_dod  # fallback to mechanical format

            def voiced_context_header(self, context_summary: str) -> str:
                """Transform a mechanical context dump to a voiced CORTEX header line."""
                try:
                    ...
                except Exception:
                    return context_summary  # CORE-049: fallback to mechanical input

      In InteractionOrchestrator.__init__():
        from cortex.orchestrators.core.personality_layer import PersonalityLayer
        self._personality = PersonalityLayer()

      In build_context_summary() call path:
        voiced_header = self._personality.voiced_context_header(raw_summary)

      NOTE: All methods wrap logic in try/except and fall back to mechanical format (CORE-049 silent degradation).

    tdd_cycle:
