      - "PersonalityLayer.voiced_context_header() falls back to mechanical input string on any internal error"
      - "InteractionOrchestrator instantiates PersonalityLayer as self._personality"
      - "All 8 golden response tests pass"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py file tests/golden/response/test_phase_150_dor_reflection_golden.py"
