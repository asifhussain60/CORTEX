        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_voiced_summary_empty_returns_empty_string — voiced_summary([]) returns ''"
        - "test_voiced_summary_single_request — returns non-empty for one request"
        - "test_voiced_dod_items_empty_returns_empty — voiced_dod_items([]) returns []"
        - "test_voiced_context_header_fallback — falls back to mechanical input on internal error"
