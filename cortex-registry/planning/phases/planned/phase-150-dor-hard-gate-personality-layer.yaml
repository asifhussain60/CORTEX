background: |
  Source: GitHub Issue #18 (2026-03-12) — FB-20260312-004 and FB-20260312-005.
  Phase 149 enriched the intelligence context. Phase 150 uses that enrichment in two capabilities:
    1. DoR Hard Gate (CORE-071) (FB-004): The existing dor_tracker.py tracks challenge-based
       DoR using an old Wave 7 design (decision-tracking, not readiness scoring). Issue #18 introduces
       a NEW DoRScore dataclass with 5 weighted dimensions (requirement_completeness 30%,
       architecture_clarity 25%, dependency_resolution 20%, test_readiness 15%, risk_assessment 10%)
       and a DoRApprovalGate.is_ready(score: DoRScore) -> bool that gates implementation workflows.
       dor-display.yaml primitive already exists but needs updating to include the 5-dimension scoring
       state machine (DRAFT → REFINEMENT → READINESS_VALIDATION → GATE_OPEN → TDD_IMPLEMENTATION).
    2. PersonalityLayer + DoR Atoms (FB-005): personality_layer.py is entirely absent.
       atom-intent-reflection.yaml exists (Phase 120 LEGO system). atom-dor-prompt.yaml is absent.
       PersonalityLayer voiced_summary(), voiced_dod_items(), voiced_context_header() must be
       injected as self._personality in InteractionOrchestrator and wired to voiced output paths.
  IMPORTANT: The new DoRScore is ADDITIVE — the existing dor_tracker.py (challenge-based tracking)
  is NOT replaced. Both coexist. DoRScore is a new dataclass, DoRApprovalGate gets an overloaded
  is_ready(score: DoRScore) method alongside the existing interface.
  Git prerequisite: Phase 149 completion_gate PASSED.

