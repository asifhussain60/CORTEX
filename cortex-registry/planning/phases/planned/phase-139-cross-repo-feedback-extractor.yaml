id: phase-139
title: "Cross-Repo Feedback Extractor — 6-Stage Extraction Pipeline + 8-Gate Privacy Sanitization + FEEDBACK IntentType"
created: "2026-03-08"
status: PLANNED
priority: P1
depends_on: ["phase-138"]
sweep_id: SWEEP-139-FEEDBACK-EXTRACTOR
estimated_effort: "2 days"
source: "GitHub Issue #14 — CORTEX Feedback 2026-03-08 (FB-2026-03-08-012)"

description: |
  Backport of the Cross-Repo Feedback Extractor from cortex-sts REQ-008.
  The final phase in the Issue #14 backport chain (depends on phase-138 for
  git integration patterns established by SubPhaseCheckpointInjector).

  Problem: There is no structured way to analyse a parallel CORTEX instance
  (e.g. _workspaces/cortex-sts/) and produce a clean, privacy-safe capability
  summary suitable for backporting. Today this is done manually — prone to
  leaking organisation-internal codenames, credentials, or customer references.
  Issue #14 itself was generated by CrossRepoExtractor — this phase enables
  that capability in this workspace.

  Three components:

  1. SanitizationEngine — 8 privacy gates (G1–G8) with pre-compiled regex patterns:
     G1 personal identifiers, G2 organisation URLs, G3 credentials, G4 codenames,
     G5 customer references, G6 algorithm details, G7 channel references, G8 final
     validation. 40+ CORTEX domain vocabulary terms are preserved through all gates
     (never sanitized). Returns sanitized text + action count per gate.

  2. CrossRepoExtractor — 6-stage pipeline: (1) git commit analysis, (2) relevance
     filter (CORTEX-framework-relevant paths), (3) change classification (8 types via
     ChangeClassification enum), (4) capability record extraction, (5) sanitization via
     SanitizationEngine, (6) markdown output generation. Produces structured
     CapabilityRecord objects consumed by FeedbackOrchestrator.

  3. FeedbackOrchestrator (extension) — gains mode="extract" routing to execute
     CrossRepoExtractor. Output written to _workspaces/_feedback/{date}-feedback.md.
     FEEDBACK registered as a new IntentType in canonical_enums.py with keywords
     /feedback, backport, capability extraction.

governance_authority:
  - CORE-008   # TDD mandatory
  - CORE-011   # Type hints on all functions
  - CORE-012   # Docstrings on all public APIs
  - CORE-028   # snake_case file naming
  - CORE-035   # Single canonical implementation
  - CORE-048   # Holistic validation gate
  - CORE-064   # Sweep Completeness Contract
  - CORE-068   # Universal Convergence Gate

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── GAP-139-01: SanitizationEngine (8 gates) ──────────────────────────────
  - id: GAP-139-01
    title: "SanitizationEngine — 8 privacy gates with pre-compiled regex + CORTEX vocabulary preservation"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-012"
    evidence: |
      Cross-repo feedback generation has no privacy layer. Feedback documents produced
      today could contain organisation-internal codenames, employee names, internal URLs,
      or credentials from git commit messages. Without sanitization gates, backporting
      content from a company CORTEX instance to this workspace risks data leakage.
    action_ref: "phase-139-a"
    files_to_create:
      - cortex/tools/cross_repo_extractor.py  # SanitizationEngine (G1–G8), CrossRepoExtractor (shared file)
    test_file: "tests/unit/tools/test_cross_repo_extractor.py"

  # ── GAP-139-02: CrossRepoExtractor (6-stage pipeline) ─────────────────────
  - id: GAP-139-02
    title: "CrossRepoExtractor — CommitRecord/CapabilityRecord dataclasses + 6-stage pipeline"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-012"
    evidence: |
      No structured mechanism exists for analysing git commit history to identify
      CORTEX-framework-relevant capability changes. The is_cortex_relevant() filter,
      ChangeClassification enum (8 types), and extract_capabilities() pipeline do not
      exist. Feedback is produced by reading git log manually and summarising by hand.
    action_ref: "phase-139-b"
    files_to_create:
      - "cortex/tools/cross_repo_extractor.py (extended — shares file with GAP-139-01)"
    test_file: "tests/unit/tools/test_cross_repo_extractor.py"

  # ── GAP-139-03: FeedbackOrchestrator mode=extract + FEEDBACK IntentType ───
  - id: GAP-139-03
    title: "FeedbackOrchestrator mode=extract + FEEDBACK IntentType registration + IntentRouter keywords"
    severity: P1
    status: OPEN
    source: "Issue #14 — FB-2026-03-08-012"
    evidence: |
      FeedbackOrchestrator exists (cortex/orchestrators/support/feedback_orchestrator.py)
      but has no mode="extract" routing to CrossRepoExtractor. FEEDBACK is not registered
      as an IntentType in canonical_enums.py. IntentRouter has no keywords for /feedback,
      backport, or capability extraction — the entire FEEDBACK intent is unreachable.
    action_ref: "phase-139-c"
    files_to_modify:
      - cortex/orchestrators/support/feedback_orchestrator.py    # add mode="extract" → _execute_extraction()
      - cortex/models/canonical_enums.py                         # add FEEDBACK to IntentType
      - cortex/orchestrators/core/intent_router_impl.py          # register /feedback, backport, capability extraction keywords

