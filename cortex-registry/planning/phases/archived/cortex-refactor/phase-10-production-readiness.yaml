# ==============================================================================
# Phase 10 — Production Readiness Certification
# CORTEX Cohesive Brain Refactor — Phase 10 of 10
# ==============================================================================
# Status: planned
# Priority: P0
# Estimated Effort: 30 minutes
# ==============================================================================

phase:
  id: phase-10-production-readiness
  title: Production Readiness Certification
  sequence: 10
  of: 10
  plan: cortex-refactor
  status: planned
  priority: P0
  estimated_effort: 30 minutes
  depends_on: phase-09-final-verification
  created: '2026-02-23'

  description: |
    Final production readiness certification for the cortex-refactor 10-phase plan.
    This phase updates cortex-master.yaml to mark all 10 cortex-refactor phases
    as completed, updates the summary metrics, and creates a completion record.

    After this phase, the cortex-refactor plan status changes from APPROVED/planned
    to COMPLETE, and the phases move from phase_status.planned to phase_status.completed.

  stages:
  - id: A
    name: Update cortex-master.yaml
    type: registry_update
    description: |
      Update cortex-master.yaml to reflect completion of all 10 cortex-refactor phases:
      1. Move cortex-refactor from phase_status.planned → completed
      2. Update phases.completed with phase-54 through phase-63 (or equivalent IDs)
      3. Update summary: total_phases +10, completed +10
      4. Update production_readiness.latest_phase
      5. Update verification.plan_version and last_verified
      6. Update metadata.version → 10.5 (or next appropriate version)
    fields_to_update:
    - metadata.version
    - metadata.last_updated
    - summary.total_phases
    - summary.completed
    - summary.key_achievements (add cortex-refactor completion entry)
    - production_readiness.latest_phase
    - verification.plan_version
    - verification.last_verified

  - id: B
    name: Move Phase Spec Files
    type: file_operations
    description: |
      Move cortex-refactor phase YAML files from planned/ to completed/ directory.
    actions:
    - action: move_phase_files
      from: cortex-registry/planning/phases/planned/cortex-refactor/
      to: cortex-registry/planning/phases/completed/cortex-refactor/
      files:
      - phase-01-foundation.yaml
      - phase-02-governance-alignment.yaml
      - phase-03-package-consolidation.yaml
      - phase-04-brain-deduplication.yaml
      - phase-05-orchestrator-rationalization.yaml
      - phase-06-directory-cleanup.yaml
      - phase-07-test-consolidation.yaml
      - phase-08-registry-docs.yaml
      - phase-09-final-verification.yaml
      - phase-10-production-readiness.yaml
      - 00-overview.yaml
      - capability-manifest.yaml
      - consolidation-matrix.yaml

  - id: C
    name: Final Test Run
    type: testing
    description: |
      Run smoke tests after all registry updates to confirm clean state.
    actions:
    - action: smoke_tests
      command: python3 scripts/run_tests.py smoke
      gate: zero_failures

  - id: D
    name: Production Readiness Commit & Push
    type: git
    commit_message: "feat: cortex-refactor 10-phase plan COMPLETE — cohesive brain refactor delivered"
    push: true
    tag: v10.5-cortex-refactor-complete

  success_criteria:
  - All 10 cortex-refactor phases marked completed in cortex-master.yaml
  - Phase files moved from planned/ to completed/
  - Smoke tests pass (0 failures)
  - cortex-master.yaml parses cleanly with updated metrics
  - Committed and pushed to origin/CORTEX

  completion_record:
    plan: cortex-refactor
    phases_delivered: 10
    total_cortex_phases: 64  # 54 previous + 10 cortex-refactor
    zero_regressions: true
    ghost_dirs_removed: 1
    stale_refs_swept: 43  # 17 Python files + 26 test files
    production_status: "🟢 PRODUCTION READY — cortex-refactor COMPLETE"
