# ==============================================================================
# Phase 09 — Final Verification
# CORTEX Cohesive Brain Refactor — Phase 09 of 10
# ==============================================================================
# Status: planned
# Priority: P0
# Estimated Effort: 30 minutes
# ==============================================================================

phase:
  id: phase-09-final-verification
  title: Final Verification
  sequence: 9
  of: 10
  plan: cortex-refactor
  status: planned
  priority: P0
  estimated_effort: 30 minutes
  depends_on: phase-08-registry-docs
  created: '2026-02-23'

  description: |
    Full system verification gate before production readiness certification.
    This phase runs the complete test suite (not just smoke), verifies all
    capability-manifest.yaml items, and confirms the refactor is complete.

    CORE-064 Sweep Completeness: all refactor issues catalogued in Phases 01-08
    must be resolved before this phase passes.

  stages:
  - id: A
    name: Full Capability Manifest Verification
    type: verification
    description: |
      Cross-validate all capability-manifest.yaml items against live code:
      - 24 MCP tools registered
      - 22 orchestrators import cleanly
      - Workflow templates present
    actions:
    - action: verify_mcp_tools
      description: Confirm 24 MCP tools registered via tool catalog
      command: python3 scripts/validate_orchestrator_contracts.py --mcp-tools 2>&1 | tail -3
      expected: 24 tools registered
    - action: verify_22_orchestrators
      description: Import all 22 (same as Phase 05 Stage A)
    - action: verify_workflow_templates
      command: ls cortex-registry/workflows/templates/ | wc -l
      record: template_count

  - id: B
    name: Full Test Suite Run
    type: testing
    description: |
      Run the full test batch (not just smoke) to verify zero regressions.
    actions:
    - action: run_full_batch
      command: python3 scripts/run_tests.py batch
      gate: zero_failures_or_same_skip_ratio
      record: pass_count, fail_count, skip_count

  - id: C
    name: Refactor Completeness Checklist
    type: audit
    description: |
      Verify all refactor objectives are met before Phase 10.
    checklist:
    - ghost_dir_deleted: cortex/cortex.intelligence/ does not exist
    - zero_stale_import_refs: grep returns 0 broken imports
    - zero_stale_docstring_refs: cortex/ Python files clean
    - zero_stale_test_comments: tests/ comment refs clean
    - 22_orchestrators_import: verified in Stage A
    - cortex_master_consistent: YAML parses, counts accurate
    - workflow_templates_clean: zero stale MCP names
    gate: all_checklist_items_green

  - id: D
    name: Sign-off
    type: gate
    description: |
      Human sign-off or autonomous sign-off if all gates are green.
    autonomous_approval_condition: |
      All Stage C checklist items green AND
      Stage B full batch: fail_count == 0 AND
      Stage A: 24 MCP tools + 22 orchestrators verified

  success_criteria:
  - All capability-manifest.yaml items verified against live code
  - Full test batch: 0 failures
  - All 9 checklist items green
  - Phase 10 can proceed without risk
