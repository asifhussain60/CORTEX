phase:
  id: phase-05-orchestrator-rationalization
  title: Orchestrator Rationalization
  sequence: 5
  of: 10
  plan: cortex-refactor
  status: planned
  priority: P2
  estimated_effort: 1 hour
  depends_on: phase-04-brain-deduplication
  created: '2026-02-23'

  description: |
    Verify the 22-orchestrator wiring contract is intact after all preceding phases.
    The capability-manifest.yaml lists 22 core orchestrators (ORCH-001..ORCH-022).
    This phase validates all 22 import cleanly, are wired in the registry, and
    the IOrchestrator protocol is satisfied.

    This is a VERIFICATION + REGISTRY phase — no new orchestrators, no deletions.

  context:
    current_wired: 22 orchestrators (confirmed 2026-02-23)
    manifest_ref: cortex-refactor/capability-manifest.yaml
    additional_orch: ORCH-023..ORCH-035 exist but are not in the core 22 wiring contract

  stages:
  - id: A
    name: L1 Wiring Check
    type: verification
    description: |
      Import all 22 core orchestrators and verify no ImportError.
    actions:
    - action: import_all_22
      description: Import all 22 core orchestrators, expect no ImportError
      command: python3 scripts/validate_orchestrator_contracts.py
      expected: 22/22 orchestrators import cleanly

  - id: B
    name: IOrchestrator Protocol Check
    type: verification
    description: |
      Verify all 22 orchestrators satisfy the IOrchestrator protocol
      (execute method, AC markers, type hints).
    actions:
    - action: verify_protocol
      command: python3 scripts/validate_orchestrator_contracts.py 2>&1 | tail -5
      expected: no_protocol_violations

  - id: C
    name: Registry Sync Check
    type: verification
    description: |
      Verify orchestrators in capability-manifest.yaml match live code.
    actions:
    - action: verify_manifest_vs_live
      description: Each ORCH-001..022 entry must import cleanly
      gate: all_22_import_confirmed

  - id: D
    name: Update Registry if Gaps Found
    type: registry_update
    description: |
      If any gaps found in Stages A-C, update capability-manifest.yaml to
      accurately reflect the live state. No code changes — registry only.

  success_criteria:
  - All 22 core orchestrators import without error
  - IOrchestrator protocol satisfied by all 22
  - capability-manifest.yaml accurately reflects live wiring
  - No new orchestrators added or removed (rationalization is registry alignment only)
