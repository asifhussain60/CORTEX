sweep_catalogue:
  - id: "GAP-69-01"
    title: "SIGTERM not handled in MCP server run_stdio()"
    severity: P1
    source: "copilot-review02.md §7 — Signal Handling"
    evidence: |
      cortex/mcp/server.py run_stdio(): only KeyboardInterrupt handled.
      No signal.signal(signal.SIGTERM, ...) registration.
      Process killed by container orchestrators (kubernetes, systemd) would
      drop in-flight JSON-RPC requests without graceful shutdown.
    action_ref: "phase-69-a"
    status: CLOSED
    fix: |
      Added import signal, _shutdown = False flag, _handle_sigterm() handler,
      and changed while True: → while not self._shutdown:
      File: cortex/mcp/server.py

  - id: "GAP-69-02"
    title: "[tool.pytest.ini_options] in pyproject.toml conflicts with pytest.ini"
    severity: P1
    source: "copilot-review02.md §5 — Configuration Conflict"
    evidence: |
      pyproject.toml [tool.pytest.ini_options]: testpaths = ["tests"]
      pytest.ini testpaths: tests cortex/tests cortex/infrastructure/tests
      pytest.ini takes precedence but the conflict causes confusion and
      potential breakage if pyproject.toml is ever parsed first.
    action_ref: "phase-69-b"
    status: CLOSED
    fix: |
      Removed [tool.pytest.ini_options] block from pyproject.toml entirely.
      Added comment: "pytest config canonical in pytest.ini — do NOT duplicate here."
      File: pyproject.toml

  - id: "GAP-69-03"
    title: "scikit-learn declared twice in requirements.txt (CORE-035 violation)"
    severity: P2
    source: "copilot-review02.md §3 — Dependency Hygiene"
    evidence: |
      requirements.txt line 134: scikit-learn>=1.3.0  (open range, Core ML section)
      requirements.txt line 158: scikit-learn==1.3.2  (pinned, Data Science section)
      Two declarations — CORE-035 single canonical implementation violation.
      Flexible range at line 134 could allow version drift in CI environments.
    action_ref: "phase-69-c"
    status: CLOSED
    fix: |
      Replaced line 134 with comment pointing to canonical pin at line 158.
      scikit-learn==1.3.2 (Data Science section) is now the sole declaration.
      File: requirements.txt

  - id: "GAP-69-04"
    title: "cortex-registry/core/governance/skull-rules.yaml is a 1,814-line CORE-035 duplicate"
    severity: P0
    source: "copilot-review02.md §2 — Governance File Duplication"
    evidence: |
      cortex-registry/core/tier0-skull/skull-rules.yaml — canonical SSOT (2,169 lines)
      cortex-registry/core/governance/skull-rules.yaml — near-duplicate (1,814 lines)
      4 consumers of the old path:
        1. cortex/core/yaml_loaders.py line 510 ("core_rules" loader)
        2. cortex-registry/core/ccl-governance-crystal.yaml line 231
        3. cortex-registry/workflows/templates/governance/golden-test-promotion.yaml line 377
        4. cortex-registry/workflows/templates/governance/golden-test-promotion.yaml line 466
    action_ref: "phase-69-d"
    status: CLOSED
    fix: |
      1. Replaced governance/skull-rules.yaml with ~20-line redirect stub (CORE-035 + GAP-69-04 cite)
      2. yaml_loaders.py "core_rules" path → "core/tier0-skull/skull-rules.yaml"
      3. ccl-governance-crystal.yaml line 231 → updated to tier0-skull path
      4. golden-test-promotion.yaml lines 377 + 466 → updated to tier0-skull path

  - id: "GAP-69-05"
    title: "README.md badges stale and all docs/ links broken"
    severity: P2
    source: "copilot-review02.md §1 — Documentation Currency"
    evidence: |
      Badge: Orchestrators-28 (actual: 27 wired per copilot-instructions.md)
      Badge: MCP Tools-24 (actual: 38 per copilot-instructions.md)
      Badge: Tests-15,633 (actual: 1,420 smoke baseline per deployment)
