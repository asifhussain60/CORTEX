problem_summary: |
  BUILD ARTIFACTS (186 files):
  - cortex/intelligence/lens/dotnet/roslyn_cli/bin/ (93 files — .dll, .pdb, localization)
  - cortex/intelligence/lens/dotnet/roslyn_cli/obj/ (43 files — build intermediates)
  - cortex/orchestrators/domain/refactoring/adapters/roslyn-cli/bin/ (84 files)
  While not tracked in git (bin/obj/ in .gitignore), these clutter the workspace,
  inflate IDE indexing, slow file searches, and create noise in audit scans.
  .gitignore should explicitly add *.dll, *.pdb patterns for defense-in-depth.
  
  TEST-SOURCE MIRROR MISALIGNMENT:
  Source dirs without test dirs: ['config', 'enforcement', 'toolkit']
  Test dirs without source dirs: ['api', 'chaos', 'cortex_brain', 'cortex_docs', 
    'domain_orchestrators', 'fixtures', 'golden', 'integration', 'manual', 
    'preflight', 'regression', 'unit', 'visualization']
  
  - 'cortex_brain' test dir references deleted package (stale)
  - 'domain_orchestrators' should align to 'orchestrators/domain/'
  - Missing test dirs for config, enforcement, toolkit
  
  ROOT-LEVEL FILES:
  - .ds-store (case variant of .DS_Store — both present)
  - .pytest-ignore (valid but should be in pytest.ini)

affected_files:
  - cortex/intelligence/lens/dotnet/roslyn_cli/bin/
  - cortex/intelligence/lens/dotnet/roslyn_cli/obj/
  - cortex/orchestrators/domain/refactoring/adapters/roslyn-cli/bin/
  - cortex/orchestrators/domain/refactoring/adapters/roslyn-cli/obj/
  - .gitignore
  - tests/cortex_brain/ (stale — references deleted package)
  - tests/ (mirror alignment)
  - .ds-store

root_cause: |
  Roslyn CLI binaries are produced by `dotnet build` during C# analysis tooling setup
  but were never gitignored at the specific path level. Test directory structure evolved
  independently of source structure. Root-level files accumulated over time.

refactoring_strategy: |
  1. Delete all bin/ and obj/ directories under roslyn_cli paths
  2. Add .gitignore entries for *.dll, *.pdb, roslyn-cli/bin/, roslyn-cli/obj/
  3. Rename tests/cortex_brain/ → archive or delete if tests are obsolete
  4. Create minimal test __init__.py for config, enforcement, toolkit
  5. Clean .ds-store and consolidate .pytest-ignore into pytest.ini

risks:
  - Deleting bin/ may break dotnet LENS analysis until next `dotnet build`
  - tests/cortex_brain/ may contain historically valuable tests → check first

