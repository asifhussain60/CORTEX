# ─────────────────────────────────────────────────────────────────────────────
# SQLITE TRACE VERIFICATION — Hard evidence requirement
# ─────────────────────────────────────────────────────────────────────────────
sqlite_trace_verification:
  description: |
    Every orchestrator run MUST write a structured SQLite event trail proving:
    1. Which registry files were loaded (trace_registry_loads table)
    2. Which workflow template was used (workflow_runs.template_id)
    3. Which response atoms/compositions were selected (trace_response_selection table)
    4. Which policy gates were evaluated (trace_governance_checks table)
    5. What final output hash was produced (trace_output_hashes table)
    
    Golden tests assert these trace events exist and match canonical wiring.
    
  new_tables:
    - name: trace_registry_loads
      columns: [id, timestamp, orchestrator_id, registry_file, parser_type, load_duration_ms]
      
    - name: trace_response_selection
      columns: [id, timestamp, orchestrator_id, composition_id, atoms_selected, output_hash]
      
    - name: trace_governance_checks
      columns: [id, timestamp, orchestrator_id, rule_id, result, evidence]
      
    - name: trace_output_hashes
      columns: [id, timestamp, orchestrator_id, output_type, sha256_hash]
      
  enforcement:
    - golden_test: "tests/golden/sqlite_trace/test_orchestrator_trace_completeness.py"
    - check_item: "Check #42: SQLite trace completeness (no AC_START without full trace chain)"

