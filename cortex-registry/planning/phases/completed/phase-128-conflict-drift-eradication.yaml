# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: 2026-03-05 architectural review — expansion of "Straggler & Wiring Integrity" audit
  Score at entry: 97% production readiness (cortex-master.yaml)
  Target score: 100% cohesion with automated guardrails
  Baseline measurements:
    - Smoke tests: 2,775 passed
    - Preflight: 425 passed
    - Registry models: 336
    - SQLite DBs: 7 in .cortex-runtime/
    - Orchestrator files: 322
    - MCP tools: 30 registered (54 files)
    - YAML files in registry: 338
    - Test files: 2,727
  Git prerequisite: All Phase 126/127 commits merged
  
  Problem Statement:
    Despite 104 completed phases, there remain:
    1. Legacy references to dissolved packages (cortex_brain, cortex_intelligence, cortex_lens)
    2. Competing SSOT claims across documentation vs runtime
    3. Stale workflow templates vs actual orchestrator wiring
    4. Path drift (cortex-master.yaml paths vs actual file locations)
    5. Response template duplication between YAML atoms and markdown SSOT
    6. Inconsistent governance rule citations
    7. Orphaned or duplicate workflow templates
    8. SQLite tables never written to (ghost schemas)
    9. Insufficient trace evidence for audit claims
    
  Mission: Systematically discover and permanently fix ALL inconsistencies, then convert
  every discovered gap into durable automated guardrails (tests) so the same class of
  failure cannot recur.

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL COHESION MAP — Pre-Phase Discovery Artifact
# ─────────────────────────────────────────────────────────────────────────────
global_cohesion_map:
  description: |
    Merge three authority sources to establish "what should exist" vs "what actually runs":
    1. cortex-master.yaml — authoritative intent (phases, status, file pointers)
    2. Git history evolution — partially reverted commits, abandoned refactors, renames, legacy folders
    3. Live runtime wiring graph — actual imports, entrypoints, execution paths
    
    Any mismatch is a governance violation. The Global Cohesion Map is the discovery artifact
    that drives the sweep catalogue below.
  
  sources:
    - id: GCMAP-SRC-01
      name: "cortex-master.yaml phase registry"
      location: "cortex-registry/cortex-master.yaml"
      authority: "PLANNED, ACTIVE, COMPLETE phase intentions"
      
    - id: GCMAP-SRC-02
      name: "Git history evolution"
      commands:
        - "git log --oneline --all --since='2026-01-01' -- cortex/"
        - "git log --diff-filter=D --name-only --since='2026-01-01'"  # deleted files
        - "git log --diff-filter=R --name-only --since='2026-01-01'"  # renamed files
        - "git stash list"  # abandoned WIP
      detect:
        - partially_reverted_commits
        - abandoned_refactors
        - renames_moves
        - legacy_folder_references
        
    - id: GCMAP-SRC-03
      name: "Live runtime wiring graph"
      methods:
        - ast_import_scan: "python3 -c 'from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator; print(\"OK\")'"
        - mcp_registry: "grep -r 'def register_tools' cortex/mcp/"
        - entrypoints: "grep -r 'def execute_operation\\|def coordinate_operation' cortex/orchestrators/"
        - sqlite_tables: "sqlite3 .cortex-runtime/traces/orchestrator-traces.db '.tables'"
        - workflow_refs: "grep -r 'workflow_template:' cortex-registry/"
      detect:
        - described_but_not_called_components
        - imported_but_never_executed
        - registered_but_missing_handler
        - workflow_template_without_caller

# ─────────────────────────────────────────────────────────────────────────────
# SWEEP DOMAINS — 8 targeted domains with deterministic detection methods
# ─────────────────────────────────────────────────────────────────────────────
sweep_domains:
  - id: DOMAIN-A
    name: "Paths & Directory Contracts"
    description: "Verify cortex-master.yaml phase file paths, playbook paths, and Windows edge cases"
    detection_method: |
      1. Parse cortex-master.yaml phase_detail_files[].file
      2. For each path, assert os.path.exists(path)
      3. Detect Windows path separators (backslash) in YAML — must use forward-slash
      4. Detect file:// URI expectations that may fail in VS Code on Windows
    ssot_authority: "cortex-master.yaml file: fields"
    gap_refs: ["GAP-128-A-01", "GAP-128-A-02", "GAP-128-A-03"]
    
  - id: DOMAIN-B
    name: "Registry Contracts"
    description: "YAML Reader type detection, schema parsing, cross-file references, inheritance"
    detection_method: |
      1. Invoke RegistryIndexer.build_index() — collect all 338 YAML files
      2. For each YAML, assert parser type matches content (governance → GovernanceParser, etc.)
      3. Validate cross-file $ref pointers resolve
      4. Check inheritance chains (extends: fields) terminate at a base
      5. Build dependency graph — detect cycles
      6. Verify hot-reload cache invalidation contracts
    ssot_authority: "cortex/intelligence/registry/ + cortex-registry/templates/response/_registry.yaml"
    gap_refs: ["GAP-128-B-01", "GAP-128-B-02", "GAP-128-B-03", "GAP-128-B-04"]
    
  - id: DOMAIN-C
    name: "Response Template Contracts"
    description: "Canonical markdown SSOT vs YAML atoms — no duplicate fragments, consistent icons/block ordering"
    detection_method: |
      1. Parse cortex-response-templates.md for all defined blocks (H2/H3)
      2. Parse cortex-registry/templates/response/**/*.yaml for all atoms/blocks/compositions
      3. Diff: any block defined in BOTH markdown AND YAML = duplication violation
      4. Icon map consistency: verify 🧠 🛠️ ✅ 🔵 🟢 etc. are used identically
      5. Block ordering: compositions must list blocks in canonical order per SSOT
    ssot_authority: ".github/templates/cortex-response-templates.md"
    gap_refs: ["GAP-128-C-01", "GAP-128-C-02", "GAP-128-C-03"]
    
  - id: DOMAIN-D
    name: "Workflow Composer & Template Usage"
    description: "Detect duplicate/competing workflow templates; ensure each orchestrator has exactly one canonical workflow"
    detection_method: |
      1. List all workflow templates: find cortex-registry/workflows/templates -name '*.yaml'
      2. For each operational intent (IMPLEMENT, FIX, REFACTOR, AUDIT, etc.):
         a. Assert exactly ONE template is defined
         b. Assert template is referenced in workflow-composer-spec.yaml
         c. Assert template is invoked by exactly one orchestrator
      3. Detect orphan templates (never referenced)
      4. Detect duplicate templates (same intent, multiple files)
    ssot_authority: "cortex-registry/workflows/workflow-composer-spec.yaml"
    gap_refs: ["GAP-128-D-01", "GAP-128-D-02", "GAP-128-D-03"]
    
  - id: DOMAIN-E
    name: "Orchestrator Runtime Wiring"
    description: "Interaction→LENS→IntelligenceFacade→Registry→Response wiring; no 'described but not called' components"
    detection_method: |
      1. AST scan: for each orchestrator class, extract all method calls
      2. Cross-reference with IntelligenceFacade public methods — detect unused methods
      3. Cross-reference with MCP tool registrations — detect unregistered handlers
      4. Trace InteractionOrchestrator → MasterOrchestrator → domain orchestrator chain
      5. Verify each orchestrator writes AC_START/AC_COMPLETE to SQLite
      6. Detect orchestrators without workflow_template assignment (WorkflowEnforcementMixin)
    ssot_authority: "cortex/orchestrators/core/master_orchestrator.py"
    gap_refs: ["GAP-128-E-01", "GAP-128-E-02", "GAP-128-E-03", "GAP-128-E-04"]
    
  - id: DOMAIN-F
    name: "Governance & Prompts/Agents Consistency"
    description: "copilot-instructions, prompts, agents must not contradict runtime behavior"
    detection_method: |
      1. Extract all CORE-XXX references from copilot-instructions.md
      2. Extract all CORE-XXX definitions from cortex-registry/governance/core-rules.yaml
      3. Diff: references without definitions = stale; definitions without references = undocumented
      4. Verify orchestrator counts in prompts match `find . -name '*.py' -path '*/cortex/orchestrators/*' | wc -l`
      5. Verify MCP tool counts match `grep -c 'def register_tools' cortex/mcp/mcp_registry.py`
      6. Detect alternative instruction paths (duplicate agent files with conflicting rules)
    ssot_authority: ".github/copilot-instructions.md"
    gap_refs: ["GAP-128-F-01", "GAP-128-F-02", "GAP-128-F-03"]
    
  - id: DOMAIN-G
    name: "Sync/Deployment Contracts"
    description: "cortex-sync behavior, allow/deny policies, deterministic non-destructive merges"
    detection_method: |
      1. Parse cortex-registry/config/sync-policy.yaml — extract allow/deny patterns
      2. Verify cortex/tools/cortex_sync.py respects policy
      3. Simulate sync run with --dry-run and verify no unexpected deletions
      4. Verify baseline tracking (three-way merge) preserves destination-only files
    ssot_authority: "cortex-registry/config/sync-policy.yaml"
    gap_refs: ["GAP-128-G-01", "GAP-128-G-02"]
    
  - id: DOMAIN-H
    name: "Production-Readiness Purity"
    description: "No stubs, no TODO placeholders, no mocks returning blanks, no archived/bak/log files, no non-production artifacts"
    detection_method: |
      1. grep -rn 'TODO\|FIXME\|HACK\|XXX' cortex/ --include='*.py' | wc -l → must be ≤ 50
      2. grep -rn 'raise NotImplementedError\|pass  # stub' cortex/ | wc -l → must be 0
      3. find . -name '*.bak' -o -name '*.log' -o -name '*.orig' | wc -l → must be 0
      4. find . -name '_archive' -type d | wc -l → must be 0 (legacy)
      5. Verify no mock returning empty dicts/lists in production code (test mocks OK)
    ssot_authority: "CORE-002 + production-readiness audit"
    gap_refs: ["GAP-128-H-01", "GAP-128-H-02", "GAP-128-H-03"]

