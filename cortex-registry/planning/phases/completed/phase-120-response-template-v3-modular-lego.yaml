      fenced: "```lang\\n...\\n``` — renders with syntax highlighting and copy button"
      inline: "`text` — monospace highlight"
      rule: "Keep code blocks focused — long blocks require scrolling inside the panel"

    tables:
      support: "GFM tables render correctly with column alignment"
      max_columns: "Prefer ≤4 columns — more than 5 become unreadable in narrow chat panel"
      max_rows: "Prefer ≤10 rows in visible tables; use collapsible for longer lists"
      rule: "Always use header row. Never omit the separator line (|---|)"

    collapsible:
      html_details: "<details><summary>Title</summary>content</details> — renders as expandable"
      rule: "USE for: engagement timelines, verbose step logs, long tables (>10 rows)"
      rule2: "NEVER use <details> for primary content — key info must be visible by default"
      tree_chars_warning: "├─ └─ tree characters COLLAPSE in some VS Code themes — FORBIDDEN"

    images: "Not applicable for LLM-generated responses (binary, not text)"
    html_elements: "Only <details>/<summary> are safe. Other HTML tags may not render consistently."

  # ── WHAT DOES NOT RENDER / RENDERS POORLY ────────────────────────────────
  forbidden_or_degraded_elements:
    - element: "Tree branch characters (├─ └─ │)"
      reason: "Collapse in VS Code Copilot Chat dark themes — appear as boxes or missing"
      rule: "FORBIDDEN — use indented bullet lists instead"
    - element: "HTML tags other than <details>/<summary>"
      reason: "VS Code renders in a sandboxed webview — arbitrary HTML may be stripped"
      rule: "FORBIDDEN — use Markdown equivalents only"
    - element: "Multiple H1 headings in one response"
      reason: "Creates visual confusion — H1 is reserved for the single response title"
      rule: "EXACTLY ONE H1 per response"
    - element: "Deeply nested lists (3+ levels)"
      reason: "Indentation collapses to unreadable in narrow 400px chat panel"
      rule: "MAX 1 nesting level"
    - element: "KaTeX math blocks in templates"
      reason: "Renders in chat but is inappropriate for operational templates"
      rule: "OMIT from all response templates (fine in SSOT documentation only)"
    - element: "Raw URLs without markdown link syntax"
      reason: "Renders as long unclickable strings in narrow panels"
      rule: "Always wrap: [text](url)"
    - element: "Tables with more than 5 columns"
      reason: "Overflow horizontally in narrow chat panel — loses right columns"
      rule: "≤4 columns preferred, ≤5 max. Split wide tables into two narrow ones."
    - element: "Continuous text blocks longer than ~150 words without a break"
      reason: "Dense prose is hard to scan in chat; user cannot extract key info"
      rule: "Break at 100 words max with bullet list, table, or heading"

  # ── LAYOUT CONSTRAINTS ────────────────────────────────────────────────────
  layout_constraints:
    panel_width: "VS Code Chat panel is typically 300–500px wide (resizable but narrow by default)"
    scroll_behavior: "Responses are scrollable — long responses are acceptable but key info must appear first"
    response_token_budget: "~800 words (≈3,000 tokens) per visible response segment before user must scroll"
    heading_visual_weight:
      h1: "~24px, bold, blue-tinted in VS Code dark theme — strong landmark"
      h2: "~18px, bold, lighter — section divider"
      h3: "~14px, bold — subsection"
    hr_rendering: "--- renders as a full-width line — ideal for zone separation in header"
    blockquote_rendering: "> renders with left blue accent bar — preserves quote identity visually"

  # ── COPILOT-INSTRUCTIONS.MD CONSTRAINTS ──────────────────────────────────
  copilot_instructions_rendering_rules:
    format: "Plain Markdown (.md) — no YAML frontmatter needed"
    auto_loaded: "true — injected into EVERY chat request automatically"
    max_size_guidance: "Keep concise — very large files consume context window budget"
    content_priority: "Instructions near the top have higher effective weight"
    supports_markdown_links: "true — can reference other files in workspace"
    heading_strategy: "Use ## for sections, ### for sub-rules — H1 is the document title only"
    instruction_style: "Short, self-contained, single-statement rules are most effective"
    example_pattern: "Show preferred vs. avoided patterns with code examples"
    reasoning_behind_rules: "Always explain WHY — AI makes better edge-case decisions"

  # ── PROMPT FILES (.prompt.md) CONSTRAINTS ────────────────────────────────
  prompt_file_rendering_rules:
    format: "YAML frontmatter + Markdown body"
    frontmatter_fields:
      description: "Short description shown on hover in Chat view"
      name: "Display name used after typing / in chat"
      argument-hint: "Hint text shown in chat input to guide users"
      agent: "ask | agent | plan | custom-agent-name"
      model: "Model override (usually omit to use current)"
      tools: "List of tool/MCP names available to this prompt"
    invocation: "User types /prompt-name in chat input"
    body_variables:
      - "${workspaceFolder} — workspace root path"
      - "${selection} — currently selected text in editor"
      - "${file} — current file path"
      - "${input:varName} — prompted input from user at invocation"
    intro_template_requirement: |
      Each prompt must have a corresponding intro-{name}.yaml in
      cortex-registry/templates/response/prompts/ that IntentRouter uses
      when a user asks "what does this prompt do?" or activates the prompt
      for the first time in a session.

  # ── DESIGN PRINCIPLES (derived from rendering research) ──────────────────
  copilot_chat_template_design_principles:
    P1_information_hierarchy: |
      Primary content must appear in the first visible screen (≈300px scroll).
      Identity block (H1 + author) must be the FIRST rendered element.
      Do NOT bury the response action in a long preamble.
    P2_visual_zone_separation: |
      Use --- (HR) to separate distinct zones, not blank lines alone.
      3-zone header: Identity | Quote | Orchestration — each separated by ---
      This creates clear visual anchors in the narrow chat panel.
    P3_scannable_structure: |
      Prefer bullet lists over prose paragraphs for operational content.
      Use bold (**text**) to highlight key values — not for decoration.
      Tables are preferred for comparison/reference data with ≤4 columns.
    P4_collapsible_for_verbose: |
      Wrap in <details> anything that is:
        - More than 10 table rows
        - An engagement timeline (per-orchestrator timing)
        - Step-by-step logs of completed work
        - Verbose gap catalogues during audit
      Key decision content must NEVER be inside <details>.
    P5_terminal_composition_last: |
      Every response MUST end with exactly 1 terminal composition.
      Terminal content must be the LAST visual element (no content after it).
      The status footer (--- + single metric line) is part of the terminal block.
    P6_no_tree_characters: |
      Never use ├─ └─ │ tree characters in any template.
      These collapse in VS Code Copilot Chat dark themes.
      Use indented bullet lists (2-space indent) instead.
    P7_link_all_urls: |
      All URLs must be wrapped in [text](url) format.
      Raw URLs become unclickable long strings in the chat panel.
    P8_max_table_columns_4: |
      Tables with 5+ columns overflow horizontally in the 400px panel.
      Preferred: ≤4 columns. Max: 5 columns.
      For wide data: split into two narrower tables with shared key column.
    P9_code_blocks_for_commands: |
      All shell commands, YAML snippets, and file paths that users copy
      must be in ```lang fenced blocks or `inline code`.
      This provides the copy button and monospace rendering.
    P10_copilot_instructions_conciseness: |
      copilot-instructions.md is injected into every request.
      Every line consumes context window budget.
      Rules should be: short, specific, self-contained.
      Include reasoning ("why") to help AI handle edge cases correctly.

  # ── GOLDEN TEST VALIDATION CHECKLIST ─────────────────────────────────────
  rendering_validation_checklist:
    - "Each atom YAML must have a rendering_rules.copilot_chat_compatible: true field"
    - "Each block YAML must declare max_heading_level (h3 max)"
    - "Each block YAML must declare tree_chars_used: false"
    - "Each block YAML must declare max_table_columns: 4"
    - "Each composition YAML must declare terminal: true and position: LAST"
    - "Status footer YAML must declare single_line: true and max_metrics: 5"
    - "No atom/block/composition may use HTML except <details>/<summary>"
    - "All URL references in templates must use [text](url) format"
    - "Intro YAMLs must have description (≤100 chars) matching prompt hover text"

