stages:
  - stage_id: "S1"
    name: "Governance Tier Foundation"
    description: |
      Fix governance tier structure and precedence. Create missing tier directories,
      implement GovernanceRegistry.get_rule(), fix precedence.yaml contradiction,
      and establish tier precedence enforcement.
    estimated_duration: "3 days"
    test_target: 25
    coverage_target: 95
    status: "not_started"
    
    tasks:
      - task_id: "S1.T1"
        name: "Fix Precedence Contradiction"
        description: |
          Update precedence.yaml to match TierResolver implementation:
          - Change conflict_resolution to "tier0_overrides_tier1_overrides_tier2"
          - Update explanation to clarify SKULL rules (Tier 0) have highest precedence
          - Add validation that precedence.yaml matches code
        ac_ids: ["AC-PHASE105-S1-T1"]
        estimated_duration: "2 hours"
        
      - task_id: "S1.T2"
        name: "Implement GovernanceRegistry.get_rule()"
        description: |
          Add missing get_rule() method to GovernanceRegistry:
          - def get_rule(self, rule_id: str) -> Result[Optional[GovernanceRule]]
          - Search tier0_rules first (highest precedence)
          - Then search tier1/tier2 rules
          - Return None if not found
          - Add comprehensive unit tests
        ac_ids: ["AC-PHASE105-S1-T2"]
        estimated_duration: "4 hours"
        
      - task_id: "S1.T3"
        name: "Create Governance Tier Directories"
        description: |
          Create proper governance tier structure at registry level:
          - cortex-registry/core/tier0-skull/ (immutable SKULL rules)
          - cortex-registry/core/tier1-project/ (project governance)
          - cortex-registry/core/tier2-engineering/ (engineering standards)
          - Move skull-rules.yaml to tier0-skull/
          - Update GovernanceRegistry to load from new paths
        ac_ids: ["AC-PHASE105-S1-T3"]
        estimated_duration: "6 hours"
        
      - task_id: "S1.T4"
        name: "Integrate TierResolver"
        description: |
          Wire TierResolver into GovernanceRegistry:
          - Update get_rule() to use TierResolver for precedence
          - Add tier precedence validation
          - Test tier override scenarios
          - Verify Tier 0 cannot be overridden
        ac_ids: ["AC-PHASE105-S1-T4"]
        estimated_duration: "6 hours"
        
      - task_id: "S1.T5"
        name: "Golden Tests: Governance Tier Precedence"
        description: |
          Create comprehensive golden tests for tier precedence:
          - test_tier0_overrides_tier1.py
          - test_tier1_overrides_tier2.py
          - test_skull_rules_immutable.py
          - test_tier_resolver_integration.py
          - test_governance_registry_get_rule.py
        ac_ids: ["AC-PHASE105-S1-T5"]
        estimated_duration: "1 day"

  - stage_id: "S2"
    name: "Memory Tier Clarification"
    description: |
      Clarify memory tier structure and fix BrainTierPusher paths. Separate memory tiers
      from governance tiers, update documentation, and ensure knowledge files are written
      to correct locations.
    estimated_duration: "3 days"
    test_target: 20
    coverage_target: 95
    status: "not_started"
    
    tasks:
      - task_id: "S2.T1"
        name: "Rename Memory Tiers for Clarity"
        description: |
          Rename memory tier directories to clarify intent:
          - memory/tier1_learned/ → memory/learned_patterns/
          - memory/tier2_adaptive/ → memory/adaptive_intelligence/
          - memory/tier3_scratch/ → memory/scratch_space/
          - Update all imports and references
          - Add migration script for any data
        ac_ids: ["AC-PHASE105-S2-T1"]
        estimated_duration: "6 hours"
        
      - task_id: "S2.T2"
        name: "Fix BrainTierPusher Paths"
        description: |
          Update BrainTierPusher to use correct paths:
          - TIER0 → cortex-registry/core/tier0-skull/
          - TIER1 → cortex_intelligence/memory/learned_patterns/
          - TIER2 → cortex_intelligence/memory/adaptive_intelligence/
          - TIER3 → cortex_intelligence/memory/scratch_space/
          - Add path validation before writes
          - Test all tier push operations
        ac_ids: ["AC-PHASE105-S2-T2"]
        estimated_duration: "4 hours"
        
      - task_id: "S2.T3"
        name: "Memory Tier Documentation"
        description: |
          Document memory tier system clearly:
          - Purpose of each memory tier
          - Difference from governance tiers
          - When to use which tier
          - File naming conventions
          - Cleanup policies per tier
        ac_ids: ["AC-PHASE105-S2-T3"]
        estimated_duration: "4 hours"
        
      - task_id: "S2.T4"
        name: "Golden Tests: Memory Tier Operations"
        description: |
          Create golden tests for memory tier operations:
          - test_brain_tier_pusher_writes.py
          - test_memory_tier_structure.py
          - test_comprehension_to_tier_mapping.py
          - test_tier_cleanup_policies.py
        ac_ids: ["AC-PHASE105-S2-T4"]
        estimated_duration: "1 day"

  - stage_id: "S3"
    name: "Tier System Integration"
    description: |
      Integrate governance and memory tier systems. Update OrchestratorDependencyRegistry,
      implement tier metadata in wiring.yaml, and establish tier validation gates.
    estimated_duration: "2 days"
    test_target: 25
    coverage_target: 95
    status: "not_started"
    
    tasks:
      - task_id: "S3.T1"
        name: "Wire Orchestrator Tiers"
        description: |
          Add tier metadata to orchestrator wiring:
          - Add tier property to wiring.yaml schema
          - Assign tiers to all orchestrators (1=Core, 2=Specialized, 3=Enterprise)
          - Update OrchestratorDependencyRegistry to track tier dependencies
          - Validate tier assignments
        ac_ids: ["AC-PHASE105-S3-T1"]
        estimated_duration: "6 hours"
        
      - task_id: "S3.T2"
        name: "Implement CORE-051 Foundation"
        description: |
          Create foundation for LENS-orchestrator tier coupling:
          - LensOrchestratorTierSelector class
          - Tier mapping: {1: tier_2_quick, 2: tier_3_targeted, 3: tier_4_full}
          - Downgrade prevention logic
          - Integration with MasterOrchestrator
        ac_ids: ["AC-PHASE105-S3-T2", "CORE-051"]
        estimated_duration: "8 hours"
        
      - task_id: "S3.T3"
        name: "Tier Validation Gates"
        description: |
          Add tier validation to CI/CD pipeline:
          - Validate tier directory structure
          - Verify precedence.yaml matches TierResolver
          - Check all orchestrators have tier assignments
          - Validate tier dependency graph
        ac_ids: ["AC-PHASE105-S3-T3"]
        estimated_duration: "4 hours"
        
      - task_id: "S3.T4"
        name: "Golden Tests: Tier Integration"
        description: |
          Create golden tests for tier system integration:
          - test_orchestrator_tier_assignments.py
          - test_lens_tier_coupling.py
          - test_tier_dependency_tracking.py
          - test_tier_validation_gates.py
        ac_ids: ["AC-PHASE105-S3-T4"]
        estimated_duration: "1 day"

  - stage_id: "S4"
    name: "Comprehensive Validation"
    description: |
      Validate entire tier system end-to-end. Run all golden tests, perform integration
      testing, update documentation, and ensure no regressions.
    estimated_duration: "2 days"
    test_target: 15
    coverage_target: 95
    status: "not_started"
    
    tasks:
      - task_id: "S4.T1"
        name: "End-to-End Tier Scenarios"
        description: |
          Test complete tier workflows:
          - Rule lookup with tier precedence
          - Knowledge push to correct tiers
          - Orchestrator tier-based LENS selection
          - Multi-tier conflict resolution
        ac_ids: ["AC-PHASE105-S4-T1"]
        estimated_duration: "6 hours"
        
      - task_id: "S4.T2"
        name: "Golden Tests: Tier Truth Validation"
        description: |
          Create truth validation tests:
          - test_brain_tier_architecture_truth.py (validates all tier systems)
          - test_governance_tier_precedence_truth.py (precedence enforcement)
          - test_memory_tier_operations_truth.py (file operations)
          - test_tier_system_integration_truth.py (end-to-end)
        ac_ids: ["AC-PHASE105-S4-T2"]
        estimated_duration: "1 day"
        
      - task_id: "S4.T3"
        name: "Architecture Documentation Update"
        description: |
          Update all architecture documentation:
          - Brain tier architecture diagrams
          - Tier system decision records
          - Migration guide for tier changes
          - API reference for tier operations
        ac_ids: ["AC-PHASE105-S4-T3"]
        estimated_duration: "6 hours"
        
      - task_id: "S4.T4"
        name: "Regression Prevention"
        description: |
          Add preventive measures:
          - CI/CD tier structure validation
          - Pre-commit hooks for tier files
          - Audit logging for tier operations
          - Monitoring dashboard for tier health
        ac_ids: ["AC-PHASE105-S4-T4"]
        estimated_duration: "6 hours"

acceptance_criteria:
  - id: "AC-PHASE105-001"
    description: "Precedence.yaml matches TierResolver (tier0 > tier1 > tier2)"
    validation: "grep 'tier0_overrides' cortex_intelligence/governance/precedence.yaml"
    
  - id: "AC-PHASE105-002"
    description: "GovernanceRegistry.get_rule() method exists and works"
    validation: "python3 -c 'from cortex.orchestrators.core.governance_registry import GovernanceRegistry; assert hasattr(GovernanceRegistry, \"get_rule\")'"
    
  - id: "AC-PHASE105-003"
    description: "Governance tier directories exist at registry level"
    validation: "test -d cortex-registry/core/tier0-skull && test -d cortex-registry/core/tier1-project && test -d cortex-registry/core/tier2-engineering"
    
  - id: "AC-PHASE105-004"
    description: "TierResolver integrated with GovernanceRegistry"
    validation: "pytest tests/golden/test_tier_resolver_integration.py -v"
    
  - id: "AC-PHASE105-005"
    description: "Memory tiers renamed for clarity"
    validation: "test -d cortex_intelligence/memory/learned_patterns && test -d cortex_intelligence/memory/adaptive_intelligence"
    
  - id: "AC-PHASE105-006"
    description: "BrainTierPusher writes to correct paths"
    validation: "pytest tests/golden/test_brain_tier_pusher_writes.py -v"
    
  - id: "AC-PHASE105-007"
    description: "All orchestrators have tier assignments"
    validation: "python3 -m cortex.cli.validate_tiers --check-wiring"
    
  - id: "AC-PHASE105-008"
    description: "CORE-051 foundation implemented"
    validation: "pytest tests/integration/test_lens_tier_coupling.py -v"
    
  - id: "AC-PHASE105-009"
    description: "85 golden tests passing at 95% coverage"
    validation: "pytest tests/golden/test_brain_tier_*.py --cov=cortex.brain.core --cov=cortex.orchestrators.core --cov-report=term --cov-fail-under=95"
    
  - id: "AC-PHASE105-010"
    description: "CI/CD tier validation gate operational"
    validation: ".githooks/pre-commit runs tier structure validation"

