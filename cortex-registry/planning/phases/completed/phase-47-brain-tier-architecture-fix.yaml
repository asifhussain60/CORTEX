    probability: "medium"
    impact: "medium"
    mitigation: "Comprehensive search/replace, update all imports, run full test suite"
    
  - risk: "Existing code depends on broken tier precedence"
    probability: "low"
    impact: "high"
    mitigation: "Audit all tier precedence usage, add fallback behavior, staged rollout"
    
  - risk: "BrainTierPusher has existing files in wrong locations"
    probability: "medium"
    impact: "low"
    mitigation: "Migration script to move files, validate no data loss, backup before migration"

notes: |
  This phase implements Option C (Hybrid Approach) from the analysis:
  - Keep memory tiers but rename for clarity
  - Create governance tiers at registry level
  - Separate concerns between governance (precedence) and memory (storage)
  - Document two systems clearly
  - Comprehensive golden tests prevent regression
  
  The approach minimizes breaking changes while restoring architectural coherence.
  All existing functionality continues to work, with clear migration paths for any
  code that needs updating.

