overview:
  vision: |
    Restore architectural coherence to the brain tier system by resolving fundamental 
    contradictions between design and implementation. Establish clear separation between 
    governance tiers (rule precedence) and memory tiers (knowledge organization), with 
    comprehensive golden tests validating all tier interactions.

  problem_statement: |
    The brain tier architecture is fundamentally broken:
    
    **Critical Issues:**
    1. **Missing Directory Structure**
       - Code references cortex_intelligence/tier0/, tier1/, tier2/
       - Only memory/tier1_learned/, tier2_adaptive/, tier3_scratch/ exist
       - GovernanceRegistry looks for tier0/governance/core-rules.yaml (doesn't exist)
       - BrainTierPusher writes to non-existent tier0/tier1/tier2 directories
    
    2. **Precedence Contradiction**
       - precedence.yaml: "tier2_overrides_tier1_overrides_tier0"
       - TierResolver.py: "Tier 0 (SKULL) has highest precedence"
       - Completely opposite precedence models
    
    3. **Missing Core APIs**
       - GovernanceRegistry has no get_rule() method
       - TierResolver calls registry.get_rule() which doesn't exist
       - TierResolver is completely unusable
    
    4. **Five Conflicting Tier Systems**
       - Governance tiers: 0=SKULL, 1=Project, 2=Engineering
       - Knowledge tiers: 0=Governance, 1=AC, 2=Templates, 3=Knowledge
       - Memory tiers: 1=Learned, 2=Adaptive, 3=Scratch
       - Orchestrator tiers: 0=Rules, 1=AC, 2=Templates, 3=Orchestration
       - LENS tiers: FAST, SMART, DEEP, CRAWLER
    
    5. **Zero Test Coverage**
       - No golden tests for tier interactions
       - No validation of tier precedence enforcement
       - No tests for tier directory structure
    
    **Impact:**
    - CORE-051 (LENS-Orchestrator coupling) cannot be implemented
    - Tier precedence not enforced (Tier 0 can be overridden)
    - BrainTierPusher writes to void
    - 4 hardcoded fallback rules used instead of full SKULL rules
    - Architecture documentation doesn't match reality

  expected_outcomes:
    - "Clear separation: Governance tiers vs Memory tiers"
    - "Correct tier0/tier1/tier2 precedence: Tier 0 > Tier 1 > Tier 2"
    - "GovernanceRegistry.get_rule() implemented with tier precedence"
    - "TierResolver integrated and tested"
    - "BrainTierPusher writes to correct paths"
    - "85 golden tests covering all tier interactions"
    - "100% tier structure validation in CI/CD"
    - "Documentation matches implementation"

roi_analysis:
  cost: "1-2 weeks (S1: 3 days, S2: 3 days, S3: 2 days, S4: 2 days)"
  impact: |
    Immediate:
    - Unblocks CORE-051 implementation
    - Enables tier-based optimizations
    - Restores architectural integrity
    - Eliminates silent failures in BrainTierPusher
    
    Long-term:
    - Foundation for tiered intelligence
    - Enables governance precedence enforcement
    - Supports multi-tenant tier isolation
    - Allows LENS-orchestrator tier coupling
    
  risk_mitigation: |
    - Hybrid approach minimizes changes to working code
    - Golden tests catch regressions immediately
    - Incremental rollout (governance first, then memory)
    - Clear migration path for existing code
    - Backward compatibility maintained where possible

