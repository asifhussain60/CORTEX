problem_summary: |
  28 file names appear in multiple locations across the codebase, violating CORE-035 
  (single canonical implementation). Key duplicates:
  
  HIGH SEVERITY (logic duplication):
  - orchestrator_lookup.py (3 copies): core/, core/intent_router/, registry/
  - context_cache_layer.py (2 copies): core/, orchestrators/core/
  - coherence_validator.py (2 copies): orchestrators/domain/, orchestrators/validation/
  - business_knowledge_repository.py (2 copies): intelligence/domain_brain/, intelligence/knowledge/
  - intelligence_wiring_bridges.py (2 copies): intelligence/, intelligence/cross_cutting/
  - intent_classifier.py (2 copies): intelligence/, orchestrators/core/
  - health_monitor.py (2 copies): core/registry/, observability/
  - audit_trail.py (2 copies): observability/, infrastructure/secrets/
  
  MEDIUM SEVERITY (proxy/adapter — acceptable but noisy):
  - vacuum_orchestrator.py (2 copies): health/, support/ (support is proxy — OK)
  - master_orchestrator.py (2 copies): core/, persona/ (persona is separate domain — OK)
  
  The non-proxy duplicates create maintenance burden: changes must be applied in
  multiple locations, and logic can drift silently.

affected_files:
  - cortex/orchestrators/core/orchestrator_lookup.py
  - cortex/orchestrators/core/intent_router/orchestrator_lookup.py
  - cortex/orchestrators/registry/orchestrator_lookup.py
  - cortex/core/context_cache_layer.py
  - cortex/orchestrators/core/context_cache_layer.py
  - cortex/orchestrators/domain/coherence_validator.py
  - cortex/orchestrators/validation/coherence_validator.py
  - cortex/intelligence/domain_brain/business_knowledge_repository.py
  - cortex/intelligence/knowledge/business_knowledge_repository.py
  - cortex/intelligence/intelligence_wiring_bridges.py
  - cortex/intelligence/cross_cutting/intelligence_wiring_bridges.py
  - cortex/intelligence/intent_classifier.py
  - cortex/orchestrators/core/intent_classifier.py
  - cortex/core/registry/health_monitor.py
  - cortex/observability/health_monitor.py
  - cortex/observability/audit_trail.py
  - cortex/infrastructure/secrets/audit_trail.py

root_cause: |
  Subsystem boundaries were drawn iteratively across 94 phases. When modules were 
  moved between subsystems (e.g., brain→intelligence, core→orchestrators), proxy files
  were left behind. Some files were independently authored in different locations without
  checking for existing implementations.

refactoring_strategy: |
  For each duplicate pair:
  1. DIFF the two files to determine: identical, proxy, or diverged
  2. Choose canonical location based on domain ownership (SSOT principle)
  3. Convert non-canonical copy to a thin re-export (if external consumers exist)
     or DELETE if no external consumers
  4. Update all imports across the codebase
  5. Run preflight after each consolidation

risks:
  - Moving canonical location may break wiring YAML specs
  - Some proxies exist specifically for wiring contract compliance (support/vacuum_orchestrator.py)
  - Import chain breaks can cascade — test after each individual consolidation

