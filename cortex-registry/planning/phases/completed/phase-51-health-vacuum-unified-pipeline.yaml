# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  description: |
    Complete ground-up redesign of the Health-Vacuum pipeline into exactly
    TWO canonical orchestrators with a single unified purpose:
    
    **HealthOrchestrator** — Diagnose every gap holistically across:
      • Filesystem integrity (naming, empty files, orphans, duplicates)
      • Architecture coherence (CORE-035 single canonical, stub detection)
      • Infrastructure health (MCP registration, registry consistency, SQLite)
      • Wiring correctness (imports, path references, test coverage)
      • Root cleanliness (files that don't belong in project root)
      • Naming compliance (snake_case Python, kebab-case everything else)
    
    **VacuumOrchestrator** — Standalone remediation engine + HealthOrchestrator companion:
      
      STANDALONE MODE (invoked directly without prior health scan):
      • Root cleanup: relocate files not needed in root to subfolders
      • Directory organization: nest files in subfolder roots into proper paths
      • Naming standardization: enforce kebab-case / snake_case protocol
      • File cleanup: delete empty files, orphaned dirs, stale markdown
      • Markdown archival: archive stale .md to .cortex-runtime/archived-docs/
      • Duplicate consolidation: keep canonical, remove duplicates
      • Reference fixing: update stale import paths across codebase
      • Quick scan: runs its own lightweight FileContext for standalone use
      • All operations are atomic with rollback manifest support
      
      COMPANION MODE (consumes HealthOrchestrator handoff):
      • consume(handoff_path) reads health-issues.yaml
      • Executes ALL remediation operations prescribed by the scan
      • Richer context from full agent-based health scan
      • Convergence gated — retries until issues_fixed == issues_found
    
    The pipeline (companion mode) follows: Preflight → Scan → Review → Execute → Verify.
    The standalone mode follows: Quick-Scan → Execute → Verify.

  problem_statement: |
    Prior state had massive fragmentation across 7+ implementations:
    
    DELETED (all instances removed):
    1. cortex/orchestrators/support/health_orchestrator.py (1,154 lines)
       - HealthOrchestrator, VacuumExecutor, HealthVacuumPipeline, FileContext
       - Monolithic file doing too many things
    2. cortex/orchestrators/health/health_orchestrator.py (408 lines)
       - Second HealthOrchestrator class (CORE-035 violation)
       - Agent coordinator that delegated back to #1
    3. cortex/orchestrators/support/vacuum_orchestrator.py (36 lines)
       - Re-export wrapper pointing to cortex_intelligence
    4. cortex_intelligence/memory/tier1_learned/orchestrators/vacuum/ (625 lines)
       - VacuumOrchestrator with cleaner plugin pattern
       - Separate state machine, separate reporting
    5. cortex_intelligence/memory/learned_patterns/orchestrators/vacuum/ (625 lines)
       - Exact duplicate of #4
    6. cortex/toolkit/cleanup/vacuum.py (697 lines)
       - VacuumAutomation — third vacuum implementation
    7. cortex/toolkit/cleanup/vacuum_intelligence.py (520 lines)
       - Intelligence layer for vacuum (pattern learning, safety checks)
    8. cortex/mcp/tools/health_orchestrator_tool.py (386 lines)
       - MCP tool wrapping #1
    9. cortex/mcp/tools/vacuum_orchestrator_tool.py (357 lines)
       - MCP tool wrapping #1's VacuumExecutor
    10. scripts/vacuum-runner.py — standalone script wrapping #4
    11. .github/scripts/vacuum-cli.py — another standalone script
    
    Total deleted: ~4,800+ lines of fragmented, overlapping code.

  design_principles:
    - extensibility: |
        Plugin-based agent architecture. New health checks are added by
        creating a new agent class inheriting BaseHealthAgent and registering
        it. New vacuum operations are added via the CleanerPlugin interface.
        Zero changes to orchestrator code required.
    - scalability: |
        Single filesystem walk via FileContext (one rglob). Content and hash
        caches prevent redundant I/O. Agents receive shared context — no
        additional disk traversal per agent. Supports parallel agent execution.
    - cleanliness: |
        Exactly ONE HealthOrchestrator, ONE VacuumOrchestrator. No re-export
        wrappers, no backward-compatibility shims, no duplicate classes.
        Clear separation: Health diagnoses, Vacuum remediates.
    - efficiency: |
        FileContext builds once, shared everywhere. MD5 and content caches
        prevent redundant reads. Handoff via YAML file — no in-memory coupling.
        Dry-run mode for zero-cost previews.
    - accuracy: |
        Every health check has a specific ID (H-001..H-010, HA-001..HA-012,
        HI-001..HI-003, HW-001..HW-003). Every vacuum operation maps to a
        health finding. Audit log traces every action with timestamp, actor,
        and outcome. Rollback manifest enables undo.

