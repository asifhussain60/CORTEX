# =============================================================================
# TEST STRATEGY
# =============================================================================

test_strategy:
  philosophy: |
    Tests are meaningful, high-value, and intelligently categorized:
    
    **Golden Tests** (end-to-end with audit log trace):
    Used when testing cross-component integration, handoff contracts,
    pipeline stages, and operations with real filesystem effects.
    Each golden test asserts audit log entries with timestamp, actor, outcome.
    
    **Unit Tests** (isolated single-responsibility):
    Used when testing pure functions (naming helpers, FileContext caching),
    individual agent detection logic, and model construction.
    Fast, deterministic, no filesystem side effects.
    
    Decision framework:
    - Does the test cross orchestrator boundaries? → Golden
    - Does the test verify a handoff contract (YAML)? → Golden
    - Does the test check audit trail completeness? → Golden
    - Is it a pure function with defined input/output? → Unit
    - Is it a single agent's detection logic? → Unit

  golden_tests:
    location: "tests/golden/orchestrators/health_vacuum/"
    total_scenarios: 22
    files:
      - "test_health_scan_golden.py — GH-001..GH-010 (10 scenarios)"
      - "test_vacuum_execute_golden.py — GV-001..GV-008 (8 scenarios)"
      - "test_pipeline_golden.py — GP-001..GP-004 (4 scenarios)"

  unit_tests:
    location: "tests/unit/orchestrators/health/"
    total_scenarios: 40
    files:
      - "test_file_context.py (8 scenarios)"
      - "test_naming.py (10 scenarios)"
      - "test_models.py (6 scenarios)"
      - "test_health_orchestrator.py (8 scenarios)"
      - "test_vacuum_orchestrator.py (8 scenarios)"

  total_test_count: 62
  estimated_duration: "< 2 seconds"

