  Git prerequisite: Phase 123 COMPLETE, smoke green

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-125-01"
    title: "No typed model parsers for registry YAML categories"
    severity: P1
    source: "chat01.md design review"
    evidence: "model.js has generic SchemaInference but no GovernanceRuleModel, WorkflowModel, PatternModel, PlanModel — all YAML treated as generic objects"
    action_ref: "phase-125-a"
    status: OPEN

  - id: "GAP-125-02"
    title: "No parser registration mechanism for extensibility"
    severity: P1
    source: "chat01.md design review"
    evidence: "No PARSER_REGISTRY dict or @register_parser decorator — adding new YAML types requires modifying core logic"
    action_ref: "phase-125-a"
    status: OPEN

  - id: "GAP-125-03"
    title: "No cross-file reference resolution"
    severity: P1
    source: "chat01.md design review"
    evidence: "file: pointers, depends_on lists, core_rules refs, and workflow primitives paths are not resolved — graph edges cannot be built from raw YAML"
    action_ref: "phase-125-c"
    status: OPEN

  - id: "GAP-125-04"
    title: "No global dependency graph emitter"
    severity: P1
    source: "chat01.md design review"
    evidence: "model.js buildDependencyGraph works on single-file entities only — no cross-file dependency DAG"
    action_ref: "phase-125-c"
    status: OPEN

  - id: "GAP-125-05"
    title: "No normalized stable JSON view-model per artifact"
    severity: P1
    source: "chat01.md design review"
    evidence: "YAML reader passes raw parsed YAML to renderers — no deterministic JSON with sorted keys, stable hashes, or consistent schema"
    action_ref: "phase-125-e"
    status: OPEN

  - id: "GAP-125-06"
    title: "No integrity/health dashboard"
    severity: P1
    source: "chat01.md design review"
    evidence: "No broken ref detection, no duplicate SSOT check, no schema validation report, no governance breach surfacing"
    action_ref: "phase-125-d"
    status: OPEN

  - id: "GAP-125-07"
    title: "No diff-aware change tracking"
    severity: P2
    source: "chat01.md design review"
    evidence: "No history-index.json, no hash comparison between builds, no gold-border highlights for changed artifacts"
    action_ref: "phase-125-d"
    status: OPEN

  - id: "GAP-125-08"
    title: "No Business Lens layer"
    severity: P2
    source: "chat01.md design review"
    evidence: "No LLM-synthesized executive summaries per artifact — NarrativeGenerator produces only deterministic text, not business-context summaries"
    action_ref: "phase-125-h"
    status: OPEN

  - id: "GAP-125-09"
    title: "No Registry Graph Explorer tab in viewer"
    severity: P1
    source: "chat01.md design review"
    evidence: "diagrams.js has force-directed graph but only for single-file entities — no cross-registry graph explorer with filters by type/tier/severity"
    action_ref: "phase-125-g"
    status: OPEN

  - id: "GAP-125-10"
    title: "No per-type artifact detail renderers in HTML"
    severity: P1
    source: "chat01.md design review"
    evidence: "renderers.js has generic renderEntityCard — no governance-specific, workflow-specific, or pattern-specific detail panels with H2/H3/H4 hierarchy"
    action_ref: "phase-125-f"
    status: OPEN

  - id: "GAP-125-11"
    title: "No context chip UX (LENS/Registry/Domain/DoR status bar)"
    severity: P2
    source: "chat01.md design review"
    evidence: "No always-visible intelligence bar showing registry health, deterministic next-action, or evidence tags"
    action_ref: "phase-125-f"
    status: OPEN

  - id: "GAP-125-12"
    title: "No build script for YAML→JSON pipeline"
    severity: P1
    source: "chat01.md design review"
    evidence: "No scripts/build-registry-docs.py to automate the full indexer→parser→resolver→emitter pipeline"
    action_ref: "phase-125-e"
    status: OPEN

  - id: "GAP-125-13"
    title: "No golden tests for deterministic YAML→model→JSON→HTML rendering"
    severity: P1
    source: "chat01.md design review"
    evidence: "Existing test_yaml_loader.py tests only raw YAML parsing — no model→JSON stability tests, no HTML render tests, no parser registration tests"
    action_ref: "phase-125-a"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT (MANDATORY)
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — 8 sub-phases, TDD-gated, strict sequential
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: "phase-125-a"
    title: "Base models + parser registry + GenericParser"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-125-01", "GAP-125-02", "GAP-125-13"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-028, CORE-035"
    duration_estimate: "1 day"
    depends_on: []
    prerequisite: "smoke tests green (≥2582 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"
    deliverables:
      - "cortex/intelligence/registry/__init__.py"
      - "cortex/intelligence/registry/models/base.py (BaseRegistryModel)"
      - "cortex/intelligence/registry/models/generic.py (GenericModel)"
      - "cortex/intelligence/registry/parsers/__init__.py (PARSER_REGISTRY + @register_parser)"
      - "cortex/intelligence/registry/parsers/generic_parser.py"
      - "tests/intelligence/registry/__init__.py"
      - "tests/intelligence/registry/test_parser_registry.py"
      - "tests/intelligence/registry/test_generic_fallback.py"
    tdd_cycle:
      red:
        action: "Write failing tests for BaseRegistryModel, PARSER_REGISTRY, @register_parser, GenericParser"
        gate: "All listed tests must FAIL (import errors count)"
      green:
        action: "Implement models and parser registry — minimum code to pass"
        gate: "All tests must PASS"
      refactor:
        action: "Add type hints, docstrings, deduplication"
        gate: "Zero regressions in tests/intelligence/"
    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + ruff check"
      fix_step: "Fix any issues found"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3

