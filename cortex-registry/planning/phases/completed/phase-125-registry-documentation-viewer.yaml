background: |
  Source: _workspaces/.chats/chat01.md — user request for end-to-end YAML→HTML pipeline
  Score at entry: 4.0 / 10 (YAML reader exists but has no registry awareness, no typed parsing, no dependency graph, no diff tracking, no integrity dashboard)
  Target score: 9.0 / 10
  Baseline measurements:
    - Smoke tests: 2582 passed
    - Existing YAML reader: 5 JS files (app.js, model.js, renderers.js, diagrams.js, index.html)
    - Phase 123 foundation: IntelligenceFacade with load_governance/load_workflows/load_patterns/load_plans/registry_index + CortexRegistry MCP tool
