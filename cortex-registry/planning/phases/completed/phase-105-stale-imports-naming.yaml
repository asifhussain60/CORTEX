metadata:
  id: phase-105
  title: "Stale Import References + Legacy Naming Remediation"
  priority: P1
  status: COMPLETE
  sweep_id: SWEEP-105-STALE-IMPORTS-NAMING
  created: "2026-03-02"
  estimated_effort: "2-3 hours"
  risk: LOW
  dependencies: [phase-102]

problem_summary: |
  STALE IMPORT REFERENCES (grep scan):
  - cortex/tools/cortex_intelligence_integration.py references "cortex_intelligence" 
    in its module name and content
  - cortex/tools/toolkit/update_imports.py contains mapping "from cortex.brain" 
    (references deleted package)
  - cortex/core/path_resolver.py has cortex_intelligence_path() function
  - cortex/dashboards/renderers/d3_import_graph_renderer.py has "cortex.brain" 
    color mapping
  - cortex/orchestrators/response/engagement_renderer.py has "cortex_lens" 
    tool key mapping
  - cortex/mcp/tools/brain_collaboration_tools.py exports cortex_intelligence_* 
    function names
  
  LEGACY NAMING PATTERNS:
  - Functions named cortex_intelligence_* (7 occurrences)
  - Dashboard color mappings for deleted packages
  - Import update scripts referencing old paths
  - MCP registry comments about deleted tools (informational — keep as history)

affected_files:
  - cortex/tools/cortex_intelligence_integration.py
  - cortex/tools/toolkit/update_imports.py
  - cortex/core/path_resolver.py
  - cortex/dashboards/renderers/d3_import_graph_renderer.py
  - cortex/dashboards/repository_detector.py
  - cortex/orchestrators/response/engagement_renderer.py
  - cortex/mcp/tools/brain_collaboration_tools.py
  - cortex/orchestrators/core/business_wisdom_formatter.py

root_cause: |
  When cortex/brain/ was dissolved in Phase 54 and cortex_intelligence/cortex_lens were
  deleted, the code that referenced these packages was updated in most places but stale
  references survived in secondary files (renderers, integration tools, path resolvers).

refactoring_strategy: |
  1. Search-and-fix all references to deleted packages/paths
  2. Rename cortex_intelligence_* functions to domain-appropriate names
  3. Update dashboard color mappings to current package structure
  4. Update path_resolver to remove dead path functions
  5. Run comprehensive grep to verify zero remaining references

risks:
  - cortex_intelligence_share/merge/sync may be MCP tool names → check registry
  - Dashboard renderers may have tests dependent on color mappings
  - update_imports.py may be used by external tooling

