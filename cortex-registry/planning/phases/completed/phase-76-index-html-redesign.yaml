# ============================================
# HEADER SIZE STANDARDIZATION
# ============================================

header_standardization:
  problem_statement: |
    Header sizes (h1-h6) are defined inconsistently across views with inline styles,
    magic numbers, and no centralized CSS variable system. This causes visual inconsistency
    and makes responsive typography difficult to maintain.

  solution:
    approach: "CSS variables in glass-design-tokens.css with clamp() for fluid typography"
    
    css_variables:
      - name: "--heading-h1-size"
        value: "clamp(2.5rem, 5vw, 4rem)"
        
      - name: "--heading-h2-size"
        value: "clamp(2rem, 4vw, 3rem)"
        
      - name: "--heading-h3-size"
        value: "clamp(1.5rem, 3vw, 2rem)"
        
      - name: "--heading-h4-size"
        value: "clamp(1.25rem, 2.5vw, 1.5rem)"
        
      - name: "--heading-h5-size"
        value: "1.125rem"
        
      - name: "--heading-h6-size"
        value: "1rem"
        
      - name: "--heading-line-height-tight"
        value: "1.1"
        
      - name: "--heading-line-height-normal"
        value: "1.3"
        
      - name: "--heading-letter-spacing-tight"
        value: "-0.02em"
        
      - name: "--heading-letter-spacing-normal"
        value: "-0.01em"

    implementation_pattern: |
      /* In glass-design-tokens.css */
      :root {
        --heading-h1-size: clamp(2.5rem, 5vw, 4rem);
        --heading-h1-weight: 700;
        --heading-h1-line-height: 1.1;
        --heading-h1-letter-spacing: -0.02em;
        /* ... repeat for h2-h6 */
      }
      
      /* In main.css */
      h1, .h1 {
        font-size: var(--heading-h1-size);
        font-weight: var(--heading-h1-weight);
        line-height: var(--heading-h1-line-height);
        letter-spacing: var(--heading-h1-letter-spacing);
        font-family: var(--font-family-heading);
      }

  files_requiring_updates:
    - "cortex-docs/assets/css/glass-design-tokens.css" # Add variables
    - "cortex-docs/assets/css/main.css" # Use variables
    - "cortex-docs/index.html" # Remove inline size declarations
    - "cortex-docs/roles/*.html" # Apply consistent headers
    - "cortex-docs/learning/**/*.html" # Apply consistent headers

