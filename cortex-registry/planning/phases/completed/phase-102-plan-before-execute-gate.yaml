# ============================================================================
# PROBLEM STATEMENT
# ============================================================================
problem:
  summary: >
    CORTEX executed code-modifying operations (IMPLEMENT, FIX, REFACTOR)
    without creating a plan first. The system "shot from the hip" —
    going directly from comprehension (Stage 1) to execution (Stage 4)
    with no intermediate plan artifact for user review or approval.

  root_cause: >
    MasterOrchestrator.process_user_request() had 4 direct paths to
    execute_operation() with zero plan creation steps. The challenge
    system stub (_evaluate_challenge) always returned None, and the
    PlanOrchestrator was only invoked for explicit PLAN intents.

  impact: "HIGH"
  risk_level: "CRITICAL"
  affected_components:
    - "cortex/orchestrators/core/master_orchestrator.py"
    - "cortex/orchestrators/core/interaction_orchestrator.py"
    - "cortex/models/plan_models.py (existing but not wired)"
    - "cortex_intelligence/action/execution_planner.py (existing but not mandatory)"

