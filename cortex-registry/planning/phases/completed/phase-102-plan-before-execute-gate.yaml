# ============================================================================
# ARCHITECTURE DECISIONS
# ============================================================================
architecture_decisions:
  - id: "AD-001"
    decision: "Plan gate only gates code-modifying intents"
    rationale: >
      IMPLEMENT, FIX, REFACTOR require plans because they modify code.
      QUERY, ANALYZE, DIGEST, RECALL, ONBOARD, DESIGN are read-only
      and should execute immediately for UX responsiveness.
    bypass_intents:
      - "QUERY"
      - "ANALYZE"
      - "DIGEST"
      - "RECALL"
      - "ONBOARD"
      - "DESIGN"

  - id: "AD-002"
    decision: "Autonomous continuation bypasses plan gate"
    rationale: >
      Autonomous mode (Phase 35) is continuation of already-approved
      work. Re-prompting for plan approval would break the autonomous
      flow. R4 single decision gate principle applies.

  - id: "AD-003"
    decision: "Plan gate runs BEFORE execute_operation()"
    rationale: >
      The plan must be created and presented to the user BEFORE any
      domain orchestrator executes. This ensures the user can review
      and approve the plan before code changes are made.

  - id: "AD-004"
    decision: "Lightweight InteractionPlan instead of full PlanSpec"
    rationale: >
      PlanSpec (plan_models.py) is a heavyweight Pydantic model designed
      for full project plans. InteractionPlan is a lightweight dataclass
      optimized for per-request plan artifacts. Both can coexist.

