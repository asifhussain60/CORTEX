# CORTEX Phase Plan — Phase 144
# Source: GitHub Issue #17 (FB-2026-03-09-074435-001)
# Backport Order: 5 of 7 (major new capability)

id: "phase-144"
title: "Document Ingest Pipeline — Office/PDF Reading (5 Components)"
created: "2026-03-09"
status: PLANNED
priority: P0  # Major new capability
source_issue: "GitHub Issue #17 — FB-2026-03-09-074435-001"
classification: NEW_CAPABILITY
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-011  # Type hints on all functions
  - CORE-012  # Docstrings on all public APIs
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-144-DOCUMENT-INGEST-PIPELINE"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: GitHub Issue #17 (cortex-sts feedback extraction 2026-03-09)
  A full document ingestion pipeline that classifies, extracts, routes, and
  persists external documents (Word, Excel, PowerPoint, PDF, YAML, Markdown)
  into cortex-registry/ with full teardown support.
  
  Comprises 5 components:
  1. FileClassifier — PII/binary rejection, 9 categories
  2. DocumentReader — Office/PDF text extraction via python-docx/openpyxl/python-pptx/pypdf
  3. KnowledgeExtractor — YAML normalization + text-to-knowledge conversion
  4. ContentRouter — 14-domain routing table + company content segregation
  5. DocumentIngestOrchestrator — pipeline coordinator with OPJ integration and teardown

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURAL CONTEXT
# ─────────────────────────────────────────────────────────────────────────────
architectural_context:
  affected_components:
    - cortex/orchestrators/support/ingest/  # New package
    - cortex/orchestrators/support/ingest/__init__.py
    - cortex/orchestrators/support/ingest/file_classifier.py
    - cortex/orchestrators/support/ingest/document_reader.py
    - cortex/orchestrators/support/ingest/knowledge_extractor.py
    - cortex/orchestrators/support/ingest/content_router.py
    - cortex/orchestrators/support/ingest/document_ingest_orchestrator.py
  design_pattern: |
    Pipeline Composition (classify→extract→route→persist)
    Strategy Pattern (format-specific readers)
    Teardown Pattern (full artifact reversal)
    Multi-Mixin (OPJMixin + OrchestratorProtocolMixin + WorkflowEnforcementMixin)
  integration_points: |
    OPJ (success recording on ingest)
    FileFactory (safe file creation)
    cortex-registry/ (destination)
    Knowledge INDEX.yaml (registration)
  dependencies: |
    python-docx (lazy-loaded with graceful degradation)
    openpyxl (lazy-loaded with graceful degradation)
    python-pptx (lazy-loaded with graceful degradation)
    pypdf (lazy-loaded with graceful degradation)

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-144-01"
    title: "Create IngestFileClassifier"
    severity: P0
    source: "GitHub Issue #17"
    evidence: |
      No file classification exists for ingestion pipeline.
      Need: FileCategory enum (9 categories), ClassifiedFile dataclass,
      binary extension blocklist, PII detection, classify_directory().
    action_ref: "phase-144-a"
    status: OPEN

  - id: "GAP-144-02"
    title: "Create DocumentReader"
    severity: P0
    source: "GitHub Issue #17"
    evidence: |
      No Office/PDF reading capability exists.
      Need: DocumentContent dataclass, lazy imports for Office libraries,
      read_docx(), read_xlsx(), read_pptx(), read_pdf(), unified read() dispatcher.
    action_ref: "phase-144-b"
    status: OPEN

  - id: "GAP-144-03"
    title: "Create IngestKnowledgeExtractor"
    severity: P0
    source: "GitHub Issue #17"
    evidence: |
      No knowledge extraction from documents.
      Need: ExtractedKnowledge dataclass, extract() method,
      YAML normalization, text-to-heading/list extraction.
    action_ref: "phase-144-c"
    status: OPEN

  - id: "GAP-144-04"
    title: "Create IngestContentRouter"
    severity: P0
    source: "GitHub Issue #17"
    evidence: |
      No routing logic for ingested content.
      Need: RoutingDecision dataclass, 14-domain routing table,
      company content segregation (business-rules → company/ folder).
    action_ref: "phase-144-d"
    status: OPEN

  - id: "GAP-144-05"
    title: "Create DocumentIngestOrchestrator"
    severity: P0
    source: "GitHub Issue #17"
    evidence: |
      No pipeline coordinator for document ingestion.
      Need: ingest_directory(), teardown(), OPJ success recording,
      AC marker emission, auto-detect registry root.
    action_ref: "phase-144-e"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

