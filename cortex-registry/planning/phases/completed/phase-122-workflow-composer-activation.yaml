# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — Root Cause Analysis from chat01.md
# ─────────────────────────────────────────────────────────────────────────────
background: |
  **Source:** chat01.md — user observed WorkflowComposer has zero production activity
  **SQLite Evidence:**
    - `workflow_runs` total: 1,540 rows — all from InteractionOrchestrator, none from WorkflowComposer
    - `workflow_cycles` total: 0 rows — CORE-068 convergence loop never ran
    - `audit_sessions` total: 0 rows — AuditCoordinator sessions never logged
  
  **Root Cause Analysis — 3 Independent Blockers:**
  
  1. **Blocker 1 — Empty inputs:** `_check_for_workflow_template()` passes empty
     `target_files=[]` and `dependencies=[]` to `WorkflowComplexityRouter.route()`.
     Stage 1 comprehension output (which DOES contain file lists) is not forwarded.
  
  2. **Blocker 2 — Threshold unreachable:** MODERATE threshold is 0.60, but maximum
     possible score with empty inputs is ~0.25 (op_score + risk_score only).
     Even with fixed inputs, typical 3-file IMPLEMENT scores 0.34 — still SIMPLE.
  
  3. **Blocker 3 — Exception swallowing:** `_check_for_workflow_template()` wraps
     entire logic in try/except that silently returns None on any error.
  
  **ROI Analysis (Option B — Full Activation):**
    - Effort: High (38 test files, end-to-end validation across 29 intents)
    - Risk: Very High (changes routing for 1,417 InteractionOrchestrator runs)
    - ROI: Negative — the convergence loops already work via a different path
  
  **Selected Solution: Option D — MCP-First Surgical Activation**
    - 3 targeted changes instead of 38+ file refactor
    - Zero regression risk — small fixes stay on direct path
    - MCP tool `cortex_workflow` already exposes convergence loop
  
  Score at entry: 0/10 (WorkflowComposer functionality dormant)
  Target score: 10/10 (5+ file operations auto-route to workflow template)
  Baseline measurements:
    - Smoke tests: 2,388 passed
    - workflow_runs with WorkflowComposer: 0

