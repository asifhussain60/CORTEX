sweep_catalogue:
  - id: "GAP-121-01"
    title: "AIContextScanner — multi-vendor AI artifact detection (8 vendors, YAML-driven)"
    severity: P1
    source: "Phase 121 planning session"
    evidence: |
      No scanner existed to detect AI tooling artifacts (copilot-instructions.md,
      .cursorrules, .continue/config.json, etc.) across 8 vendors from a single
      YAML-driven registry.
    action_ref: "phase-121-a"
    status: CLOSED
    closed_by: "cortex/infrastructure/repositories/ai_context_scanner.py"

  - id: "GAP-121-02"
    title: "AIContentClassifier — extract structured data from AI instruction markdown"
    severity: P1
    source: "Phase 121 planning session"
    evidence: |
      Raw AI artifact files had no structured extraction — tool names, permissions,
      governance rules, personas buried in unstructured markdown.
    action_ref: "phase-121-b"
    status: CLOSED
    closed_by: "cortex/infrastructure/repositories/ai_content_classifier.py"

  - id: "GAP-121-03"
    title: "AIPIIGuard — strip PII from extracted AI context before registry storage"
    severity: P0
    source: "Phase 121 planning session"
    evidence: |
      AI context files may contain author names, emails, API keys, or internal
      hostnames that must not be persisted into the registry YAML hierarchy.
    action_ref: "phase-121-b"
    status: CLOSED
    closed_by: "cortex/infrastructure/repositories/ai_pii_guard.py"

