        - "Verify type hints on all signatures including Optional[str] filters (CORE-011)"
        - "Confirm GovernanceRegistry/WorkflowTemplateRegistry/PatternRegistry NOT re-instantiated per call (CORE-035)"

    acceptance_criteria:
