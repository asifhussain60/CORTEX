id: "phase-123"
title: "Registry Intelligence Engine — Unified YAML Registry via IntelligenceFacade + MCP Tool"
version: "1.0"
created: "2026-03-04"
completed: "2026-03-04"
status: COMPLETE
priority: P1
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-011  # Type hints on all functions
  - CORE-012  # Docstrings on all public APIs
  - CORE-028  # snake_case file naming
  - CORE-035  # Single canonical implementation — no duplicates
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-123-REGISTRY-INTELLIGENCE-ENGINE"

background: |
  Source: _workspaces/recommendations/copilot-review.md (2026-03-04 review session)
  Score at entry: Challenge analysis revealed 4 isolated YAML-loading registries with
    zero unification and a standalone browser-only YAML reader with no Python runtime
    integration. The proposal requested a "registry intelligence engine" — audit confirmed
    CORTEX already has all the raw pieces; the gap is unification + MCP exposure.
  Baseline measurements:
    - Smoke tests: 2581 passed, 77 skipped, 23 xfailed at phase entry
    - Existing registries: KnowledgeRegistryProxy, GovernanceRegistry,
      WorkflowTemplateRegistry, PatternRegistry — all isolated, none cross-wired
    - IntelligenceFacade (Phase 107): already consolidates LENS + KnowledgeRegistryProxy;
      GovernanceRegistry, WorkflowTemplateRegistry, PatternRegistry NOT yet wired
    - _workspaces/yaml-reader/: browser-only JS app, zero MCP/Python integration
  Git prerequisite: CORTEX branch, phase-122 COMPLETE
  Architecture decision: Extend IntelligenceFacade (CORE-035 compliant) rather than
    create a 5th parallel YAML reader — delegates to existing validated loaders.

sweep_catalogue:
  - id: "GAP-123-01"
    title: "IntelligenceFacade missing load_governance() delegation to GovernanceRegistry"
    severity: P1
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      cortex/intelligence/facade.py has analyze(), synthesize(), query() only.
      GovernanceRegistry (cortex/orchestrators/core/governance_registry.py) loads
      tier-0 CORE rules from YAML but is unreachable via IntelligenceFacade.
      grep 'load_governance' cortex/intelligence/facade.py → 0 matches
    action_ref: "phase-123-a"
    status: CLOSED

  - id: "GAP-123-02"
    title: "IntelligenceFacade missing load_workflows() delegation to WorkflowTemplateRegistry"
    severity: P1
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      WorkflowTemplateRegistry (cortex/orchestrators/workflow/template_registry.py)
      discovers workflow YAMLs with placeholder resolution but is siloed.
      grep 'load_workflows' cortex/intelligence/facade.py → 0 matches
    action_ref: "phase-123-a"
    status: CLOSED

  - id: "GAP-123-03"
    title: "IntelligenceFacade missing load_patterns() delegation to PatternRegistry"
    severity: P1
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      PatternRegistry (cortex/intelligence/patterns/registry.py) loads YAML/JSON
      custom patterns with jsonschema validation but is unreachable via facade.
      grep 'load_patterns' cortex/intelligence/facade.py → 0 matches
    action_ref: "phase-123-a"
    status: CLOSED

  - id: "GAP-123-04"
    title: "No load_plans() surface for cortex-master.yaml typed access"
    severity: P2
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      cortex-master.yaml has no typed Python reader. Orchestrators that need plan
      data parse raw YAML ad-hoc. No MasterPlanIndex dataclass exists.
      grep -rn 'cortex-master.yaml' cortex/ → only infrastructure/startup_validator.py
    action_ref: "phase-123-b"
    status: CLOSED

  - id: "GAP-123-05"
    title: "No registry_index() cross-domain scan — no startup registry map"
    severity: P2
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      No component scans cortex-registry/ holistically at startup to produce a
      domain-tagged metadata index (type, path, dependencies). VacuumOrchestrator
      detects unused files post-hoc but no proactive registry index exists.
    action_ref: "phase-123-c"
    status: CLOSED

  - id: "GAP-123-06"
    title: "No cortex_registry MCP tool — registry intelligence not MCP-exposed"
    severity: P1
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      30 MCP tools registered in mcp_registry.py. None expose registry queries
      (load_governance, load_workflows, load_patterns, load_plans, registry_index).
      grep 'cortex_registry' cortex/mcp/ → 0 matches
    action_ref: "phase-123-d"
    status: CLOSED

  - id: "GAP-123-07"
    title: "_workspaces/yaml-reader/ has zero Python/MCP integration — browser-only"
    severity: P2
    source: "_workspaces/recommendations/copilot-review.md audit"
    evidence: |
      _workspaces/yaml-reader/app.js uses file:// drag-drop with js-yaml.
      No fetch() to MCP. No calls to cortex_registry tool. Standalone viewer only.
      Should become a thin visualization client over the MCP backend.
    action_ref: "phase-123-e"
    status: CLOSED

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

phases:
