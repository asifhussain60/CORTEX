      fix_step: "Apply targeted fixes for lint or regression issues"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      backoff_strategy: none
      on_exhaustion: "Log remaining issues with WONT-FIX justification"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068"

    tdd_sequence:
      red:
        - "test_load_governance_returns_rules_list — IntelligenceFacade().load_governance() returns non-empty list of governance rule dicts"
        - "test_load_governance_contains_core_008 — result contains a rule with rule_id='CORE-008'"
        - "test_load_workflows_returns_templates — IntelligenceFacade().load_workflows() returns list of workflow template dicts"
        - "test_load_workflows_filters_by_category — load_workflows(category='sdlc') returns only sdlc templates"
        - "test_load_patterns_returns_patterns — IntelligenceFacade().load_patterns() returns list"
