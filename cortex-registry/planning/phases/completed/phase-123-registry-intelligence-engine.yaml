    status: COMPLETE
    gap_refs: ["GAP-123-01", "GAP-123-02", "GAP-123-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "1 day"
    depends_on: []
    prerequisite: "smoke tests green (≥2581 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write ALL failing tests in tests/intelligence/test_registry_intelligence_facade.py BEFORE any implementation"
        gate: "python3 scripts/run_tests.py file tests/intelligence/test_registry_intelligence_facade.py — ALL listed tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails (import errors count as FAIL)"
      green:
        action: "Add load_governance(), load_workflows(), load_patterns() to IntelligenceFacade, delegating to existing registries"
        gate: "python3 scripts/run_tests.py file tests/intelligence/test_registry_intelligence_facade.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Add docstrings (CORE-012), type hints (CORE-011), confirm CORE-035 (no duplicate registry init)"
        gate: "python3 scripts/run_tests.py dir tests/intelligence/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

