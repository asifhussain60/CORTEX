# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: chat01.md holistic digest (2026-02-28) — investigation of IntentRouter keywords,
  workflow template engagement, orchestrator visibility, and linter/Roslyn tooling.
  
  Score at entry: 5.0 / 10 (operational pipeline completeness)
  Target score: 9.5 / 10
  
  PROBLEM STATEMENT:
  CORTEX has 13 dedicated workflow templates across frontend/, backend/, sdlc/
  directories but ZERO are reachable from the IntentRouter → WorkflowComplexityRouter
  pipeline. The _select_template() method maps only 6 generic operations (create,
  test, refactor, migrate, security, deploy) with no technology awareness. The SDLC
  templates are only reachable via SDLCWorkflowOrchestrator which is not wired into
  the primary intent routing path.
  
  Additionally:
  - Phase 85 defined BLOCK-ENGAGEMENT-BREADCRUMB/TIMELINE/ROADMAP as template
    definitions but they are never rendered in MCP tool output
  - No post-refactor lint/format step exists anywhere in the pipeline
  - Roslyn CLI binary has never been compiled — adapter is dead code
  - SQLite trace tables (audit_sessions, workflow_runs, workflow_cycles) have 0 rows
    despite 114+ trace_master entries — tracing is partial, not end-to-end
  - No ExecutionTraceRecorder exists to capture tool/template/orchestrator engagement
    with timestamps for timeline reconstruction
  
  Baseline measurements:
    - Smoke tests: 1,694 passed
    - Workflow templates available: 13 (4 frontend + 2 backend + 7 sdlc)
    - Templates reachable from router: 0 of 13
    - Engagement breadcrumbs rendered: 0
    - Post-refactor lint invocations: 0
    - SQLite workflow trace rows: 0

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE — 18 gaps (CORE-064: ALL must be CLOSED before COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  # ── CLUSTER A: Technology-Aware Intent Routing (3 gaps) ──────────────────
  - id: "GAP-89-01"
    title: "IntentRouter has no technology-specific keywords — html/css/csharp/typescript/dotnet/frontend/backend never trigger dedicated workflow paths"
    severity: P0
    source: "chat01.md — Investigation §1"
    evidence: |
      cortex/orchestrators/core/intent_router_impl.py lines 296-384:
      14 keyword lists (IMPLEMENT, FIX, REFACTOR, ANALYZE, etc.) contain ZERO
      technology terms. 'html refactor', 'css cleanup', 'csharp refactor',
      'typescript fix', 'dotnet migrate' all fall through to generic routing.
    action_ref: "phase-89-a"
    status: OPEN

  - id: "GAP-89-02"
    title: "WorkflowComplexityRouter._select_template() maps only 6 generic operations — no frontend/backend/sdlc template IDs"
    severity: P0
    source: "chat01.md — Investigation §1"
    evidence: |
      cortex/orchestrators/core/intent_router/workflow_gate.py lines 214-222:
      template_map = { "create": "tdd/feature-implementation", "refactor": "quality/refactoring",
      "migrate": "migration/legacy-modernization", "security": "security/audit-remediation",
      "deploy": "deployment/production-release" }
      Missing: frontend/html-refactor-validation, frontend/css-extraction-workflow,
      frontend/typescript-refactor-workflow, backend/csharp-refactor-workflow,
      backend/csharp-security-workflow, and all 7 sdlc/* templates.
    action_ref: "phase-89-a"
    status: OPEN

  - id: "GAP-89-03"
    title: "No technology metadata propagation — IntentRouter detects file extensions but doesn't propagate technology context to WorkflowComplexityRouter for template selection"
    severity: P1
    source: "chat01.md — Investigation §1"
    evidence: |
      Intent dataclass in workflow_gate.py has 'metadata: Dict[str, Any]' but no
      'technology' or 'stack' field. _select_template() ignores metadata entirely.
      SDLCWorkflowOrchestrator has its own _SDLC_INTENT_MAP but is not invoked
      by WorkflowComplexityRouter.
    action_ref: "phase-89-a"
    status: OPEN

  # ── CLUSTER B: Post-Refactor Toolchain Gate (3 gaps) ─────────────────────
  - id: "GAP-89-04"
    title: "No PostRefactorLintGate — files are left unlinted after every refactor cycle"
    severity: P0
    source: "chat01.md — Investigation §4"
    evidence: |
      grep -rn 'post.refactor|lint_gate|PostRefactor|LintGate|format_gate|eslint|prettier|ruff|dotnet.format'
      cortex/orchestrators/ — returned 0 matches in refactoring pipeline.
      ToolchainValidator knew about ruff but was never called post-refactor.
      Fixed in Phase 89-b: ToolchainExecutor created with 8 extension mappings.
    action_ref: "phase-89-b"
    status: CLOSED

  - id: "GAP-89-05"
    title: "Roslyn CLI binary never compiled — RoslynAdapter.is_available() may return True but start() fails because CortexRoslynCli.dll doesn't exist"
    severity: P1
    source: "chat01.md — Investigation §4"
    evidence: |
      cortex/orchestrators/domain/refactoring/adapters/roslyn_process.py _detect_roslyn_cli()
      searches for CortexRoslynCli.dll at two paths, neither exists. The .csproj is present
      but has never been built. C# refactoring is dead code.
      Graceful degradation implemented in Phase 89-b: ToolchainExecutor returns advisory
      warning when dotnet format is not available. Full Roslyn integration deferred to Phase 90+.
    action_ref: "phase-89-b"
    status: CLOSED

  - id: "GAP-89-06"
    title: "No file-extension → linter mapping — RefactoringOrchestrator doesn't know which linter/formatter to invoke per file type (.py→ruff, .cs→dotnet format, .ts→eslint, .html→htmlhint, .css→stylelint)"
    severity: P1
    source: "chat01.md — Recommendation §2"
    evidence: |
      RefactoringOrchestrator delegated to RopeAdapter/RoslynAdapter/TypeScriptAdapter
      for semantic refactoring but had no post-refactor step. ToolchainValidator.validate_ruff()
      existed but was only called for health checks, never as a gate.
      Fixed in Phase 89-b: ToolchainExecutor.EXTENSION_TOOL_MAP with 8 file extensions.
    action_ref: "phase-89-b"
    status: CLOSED

  # ── CLUSTER C: Orchestrator Engagement Visibility (3 gaps) ───────────────
  - id: "GAP-89-07"
    title: "BLOCK-ENGAGEMENT-BREADCRUMB is template-only — never rendered in MCP tool output (Phase 85 gap)"
    severity: P0
    source: "chat01.md — Investigation §2"
    evidence: |
      Phase 85 note in cortex-master.yaml confirms '3 new blocks: BLOCK-PHASE-ROADMAP,
      BLOCK-ENGAGEMENT-BREADCRUMB, BLOCK-ENGAGEMENT-TIMELINE' were added as YAML registry
      entries and response template definitions. But:
      grep -rn 'BLOCK-ENGAGEMENT' cortex/mcp/ — 0 matches
      grep -rn 'BLOCK-ENGAGEMENT' cortex/orchestrators/response/ — 0 matches
      No Python code renders these blocks.
    action_ref: "phase-89-c"
    status: CLOSED

  - id: "GAP-89-08"
    title: "BLOCK-ENGAGEMENT-TIMELINE is template-only — no collapsible orchestrator timing panel in output"
    severity: P1
    source: "chat01.md — Investigation §2"
    evidence: |
      Same as GAP-89-07 — BLOCK-ENGAGEMENT-TIMELINE exists in YAML registry and
      cortex-response-templates.md but no renderer emits it.
    action_ref: "phase-89-c"
    status: CLOSED

  - id: "GAP-89-09"
    title: "MCP tool format_response() has no engagement injection point — tool responses don't include routing chain or orchestrator engagement data"
    severity: P1
    source: "chat01.md — Recommendation §3"
    evidence: |
      cortex/mcp/tools/tool_helpers.py format_response() returns {status, data, error}
      with no engagement_chain or breadcrumb field. cortex/mcp/mcp_tool_base.py
      format_response() is a pass-through with no block injection.
    action_ref: "phase-89-c"
    status: CLOSED

  # ── CLUSTER D: End-to-End SQLite Execution Tracing (3 gaps) ──────────────
  - id: "GAP-89-10"
    title: "Zero rows in audit_sessions/workflow_runs/workflow_cycles tables — tracing schema exists but no orchestrator writes to it"
    severity: P0
    source: "chat01.md — Investigation §2 (trace DB evidence)"
    evidence: |
      sqlite3 .cortex-runtime/traces/orchestrator-traces.db
      "SELECT count(*) FROM audit_sessions;" → 0
      "SELECT count(*) FROM workflow_runs;" → 0
      "SELECT count(*) FROM workflow_cycles;" → 0
      But trace_master has 114 rows — some tracing works, but the workflow/audit
      tables are never populated.
    action_ref: "phase-89-d"
    status: CLOSED

  - id: "GAP-89-11"
    title: "No ExecutionTraceRecorder — no unified mechanism to record orchestrator invocations, tool engagements, template selections, and linter runs with timestamps"
    severity: P0
    source: "chat01.md — Recommendation §4"
    evidence: |
      grep -rn 'ExecutionTrace|TraceRecorder|execution_trace|trace_record' cortex/ — 0 matches.
      Individual orchestrators log via EnhancedAuditLogger but results go to different
      trace_* tables with no unified timeline view.
    action_ref: "phase-89-d"
    status: CLOSED

  - id: "GAP-89-12"
    title: "No tool engagement logging — when ToolchainValidator, RopeAdapter, RoslynAdapter, or external tools (ruff, eslint) run, there's no trace record for timeline reconstruction"
    severity: P1
    source: "chat01.md — Recommendation §4"
    evidence: |
      ToolchainValidator.validate_ruff() runs subprocess.run() but doesn't log the
      result to SQLite. Same for all refactoring adapters — they log to
      EnhancedAuditLogger but not to workflow_runs/workflow_cycles tables.
    action_ref: "phase-89-d"
    status: CLOSED

  # ── CLUSTER E: Template-Orchestrator Wiring (2 gaps) ─────────────────────
  - id: "GAP-89-13"
    title: "SDLCWorkflowOrchestrator is disconnected from primary intent routing — only reachable via direct MCP tool invocation, not through IntentRouter → MasterOrchestrator pipeline"
    severity: P1
    source: "chat01.md — Investigation §1"
    evidence: |
      SDLCWorkflowOrchestrator has _SDLC_INTENT_MAP with 21 entries mapping to 7
      template IDs, but IntentRouter.operation_type_mappings has no SDLC intent type.
      The SDLC orchestrator is wired in domain-orchestrator-wiring.yaml but the
      IntentRouter never routes to it.
    action_ref: "phase-89-e"
    status: OPEN

  - id: "GAP-89-14"
    title: "WorkflowTemplateRegistry auto-discovery from metadata.yaml files doesn't load frontend/backend templates at startup — templates are never registered"
    severity: P1
    source: "chat01.md — Investigation §1"
    evidence: |
      WorkflowTemplateRegistry.__init__ accepts primitives_dir for TemplateComposer
      fallback but doesn't auto-discover templates from frontend/ or backend/
      subdirectories. The docstring claims 'Templates auto-discovered from metadata.yaml'
      but no auto-discovery code exists in __init__ or any called method.
    action_ref: "phase-89-e"
    status: CLOSED

  # ── CLUSTER F: Expanded Scope Gaps (4 gaps) ─────────────────────────────
  - id: "GAP-89-15"
    title: "TemplateComposer fallback uses 'tdd/feature-implementation' for ALL unknown operations — no intelligent fallback based on technology context"
    severity: P2
    source: "Expanded scope analysis"
    evidence: |
      workflow_gate.py _select_template() final return: 'return "tdd/feature-implementation"'.
      This means any complex operation that doesn't match the 6-entry map gets
      TDD feature implementation template regardless of whether it's HTML, C#, or SQL work.
    action_ref: "phase-89-e"
    status: CLOSED

  - id: "GAP-89-16"
    title: "WorkflowOrchestrator (5-stage) has no template selection integration — executes Stage 1-5 pipeline without consulting WorkflowTemplateRegistry or WorkflowComplexityRouter"
    severity: P1
    source: "Expanded scope analysis"
    evidence: |
      cortex/orchestrators/core/workflow_orchestrator.py — WorkflowOrchestrator.__init__
      initialises Stage1/Scanner/Stage3/Stage4 but never imports WorkflowTemplateRegistry
      or WorkflowComplexityRouter. The 5-stage pipeline and the complexity-gated template
      system are completely disconnected.
    action_ref: "phase-89-e"
    status: OPEN

  - id: "GAP-89-17"
    title: "HTML/CSS work bypasses workflow system entirely — manual edits to cortex-docs/ never go through html-refactor-validation.yaml gates (DOM wellformed, no duplicate IDs, visual regression)"
    severity: P1
    source: "chat01.md — Investigation §4"
    evidence: |
      Git log shows ~15 HTML/CSS commits in 72 hours, all manual edits. Template
      frontend/html-refactor-validation.yaml defines gates for dom_wellformed,
      no_duplicate_ids, no_duplicate_sections, visual_regression — none were executed.
    action_ref: "phase-89-a"
    status: OPEN

  - id: "GAP-89-18"
    title: "WorkflowComplexityRouter._select_orchestrator() was missing 10 operation types (vacuum, debug, health, sync, train, totalrecall, rca, golden_test, onboard, rephrase) and fallback was MasterOrchestrator instead of InteractionOrchestrator"
    severity: P0
    source: "Full canvas audit 2026-02-28"
    evidence: |
      WorkflowComplexityRouter._select_orchestrator() mapped only 15 of 25 operation types.
      Fallback was 'MasterOrchestrator' instead of 'InteractionOrchestrator' (LENS comprehension).
      Fixed in Phase 89-a expansion: 25 operations now mapped, fallback = InteractionOrchestrator.
    action_ref: "phase-89-a"
    status: CLOSED

  # ── CLUSTER G: Full Canvas Audit Gaps (5 new gaps) ──────────────────────
  - id: "GAP-89-19"
    title: "IntentType enum missing 7 execution modes — VACUUM, DEBUG, HEALTH, SYNC, TRAIN, TOTALRECALL, RCA are not in canonical_enums.py"
    severity: P0
    source: "Full canvas audit 2026-02-28"
    evidence: |
      canonical_enums.py IntentType had 20 values. Architect prompt defines 27 modes.
      Missing: VACUUM (routed as REFACTOR), DEBUG (falls into INVESTIGATE), HEALTH
      (misroutes to AUDIT), SYNC (no path), TRAIN (no path), TOTALRECALL (no path),
      RCA (falls into INVESTIGATE). These modes have dedicated orchestrators but
      IntentRouter can't classify them correctly.
      Fixed in Phase 89-b: Added all 7 enum values to canonical_enums.py (47 tests GREEN).
    action_ref: "phase-89-b"
    status: CLOSED

  - id: "GAP-89-20"
    title: "_build_routing_rules() only has routing rules for 5 of 27 intents — 22 intent types have no explicit routing rules"
    severity: P0
    source: "Full canvas audit 2026-02-28"
    evidence: |
      intent_router_impl.py lines 622-700: hardcoded routing rules exist only for
      IMPLEMENT, FIX, REFACTOR, DOCUMENT, PLAN. All other 22 intents (ANALYZE, AUDIT,
      DESIGN, DIGEST, REPHRASE, INVESTIGATE, GOLDEN_TEST, ONBOARD, TEST, DEPLOY,
      GOVERNANCE, QUERY, VALIDATE, MIGRATE, plus 7 new enums) fell through to
      OrchestratorLookup which may or may not find a match.
      Fixed in Phase 89-c: Added routing rules for all 27 intents (42 tests GREEN).
    action_ref: "phase-89-c"
    status: CLOSED

  - id: "GAP-89-21"
    title: "SDLCWorkflowOrchestrator 21-entry intent map is unreachable — no IntentType routes SDLC operations and no keyword triggers SDLC routing"
    severity: P1
    source: "Full canvas audit 2026-02-28"
    evidence: |
      sdlc_workflow_orchestrator.py has _SDLC_INTENT_MAP with 21 entries mapping to 7
      SDLC templates. But IntentRouter has no SDLC intent keywords. The orchestrator is
      only reachable via direct MCP tool invocation (cortex_workflow op=execute).
    action_ref: "phase-89-e"
    status: OPEN

  - id: "GAP-89-22"
    title: "64 of 76 workflow templates unreachable — only 12 templates are currently routable (6 generic + 6 technology from Phase 89-a)"
    severity: P1
    source: "Full canvas audit 2026-02-28"
    evidence: |
      find cortex-registry/workflows/templates -name '*.yaml' returns 76 templates.
      _select_template() generic map = 6. TECHNOLOGY_TEMPLATE_MAP = 6. Total = 12.
      The remaining 64 templates (sdlc/*, quality/*, governance/*, deployment/*,
      migration/*, testing/*, debugging/*) are dead YAML config.
    action_ref: "phase-89-e"
    status: OPEN

  - id: "GAP-89-23"
    title: "InteractionOrchestrator LENS analysis runs optionally, not mandatorily — MasterOrchestrator calls it in Stage 1 but skips if unavailable"
    severity: P1
    source: "Full canvas audit 2026-02-28"
    evidence: |
      interaction_orchestrator.py _init_lens_orchestrator() catches all exceptions and
      returns None. execute_operation() checks 'if self.lens_orchestrator:' but silently
      skips LENS if it's None. No enforcement that LENS runs on every request.
    action_ref: "phase-89-c"
    status: OPEN

