  2. EXECUTION ENGINE (operation dispatch, retry, timeout) — ~800 lines
  3. HEALTH MONITORING (endpoint checks, heartbeat) — ~500 lines
  4. KNOWLEDGE ACCESS (domain brain queries, LENS integration) — ~400 lines
  5. WORKFLOW MANAGEMENT (template resolution, convergence gate) — ~400 lines
  6. COORDINATION GLUE (wires 1-5 together) — target <400 lines

  Target: Extract clusters 1-5 into dedicated mixins, leaving cluster 6 as the main file.

