id: "phase-110"
title: "CLI Entry Point — Create cortex/__main__.py so python -m cortex works end-to-end"
version: "1.0"
created: "2026-03-02"
status: COMPLETE
priority: P0
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-011  # Type hints on all functions
  - CORE-012  # Docstrings on all public APIs
  - CORE-028  # snake_case naming
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-110-CLI-ENTRY-POINT"

background: |
  Source: DIGEST chat01.md (2026-03-02) + live verification in proceed execution.
  Finding: `python -m cortex` fails with "No module named cortex.__main__".
  cortex/__main__.py does not exist. The framework's primary documented entry point
  is the MCP server (VS Code Copilot Chat), but the absence of a CLI entry point
  means CORTEX cannot be invoked, status-checked, or health-verified from a terminal
  independent of VS Code. This was cited as a P0 credibility gap in chat01.md:
  `cortex status` prints "✅ All systems operational" via cortex.cli but that
  module itself is not reachable via `python -m cortex`.
  Score at entry: 0/10 (entry point non-functional)
  Target score: 10/10 (python -m cortex --help, status, health all respond correctly)
  Baseline measurements:
    - Smoke tests: 18,085 collected, suite passes (exit 0)
    - python -m cortex: exit code 1, "No module named cortex.__main__"
    - python -m cortex.cli status: resolves but not reachable via top-level entry
  Git prerequisite: branch CORTEX, clean working tree

sweep_catalogue:
  - id: "GAP-110-01"
    title: "cortex/__main__.py does not exist"
    severity: P0
    source: "DIGEST chat01.md + live verification 2026-03-02"
    evidence: |
      python3 -m cortex → "No module named cortex.__main__; 'cortex' is a package
      and cannot be directly executed"
      ls cortex/__main__.py → "No such file or directory"
    action_ref: "phase-110-a"
    status: OPEN

  - id: "GAP-110-02"
    title: "cortex status truthfulness gate — prints OK when tests may be failing"
    severity: P1
    source: "DIGEST chat01.md evidence table"
    evidence: |
      cortex.cli status prints "27 Orchestrators Wired. ✅ All systems operational"
      without running any actual health check or test gate. In chat01.md the test
      suite had failures at the same time cortex status reported healthy.
    action_ref: "phase-110-b"
    status: OPEN

  - id: "GAP-110-03"
    title: "No test coverage for __main__ module or CLI dispatch"
    severity: P1
    source: "CORE-008 requirement — tests before implementation"
    evidence: |
      tests/cli/ exists but has no test for python -m cortex entry point dispatch,
      --help output, or status exit-code truthfulness.
    action_ref: "phase-110-a"
    status: OPEN

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

sub_phases:

  - id: "phase-110-a"
    title: "RED — Write failing tests for __main__ entry point and CLI dispatch"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-110-01", "GAP-110-03"]
    depends_on: []
    tdd_cycle:
      red:
        action: "Write tests/cli/test_main_entry_point.py covering: (1) subprocess call
          to `python3 -m cortex --help` exits 0 and prints usage; (2) `python3 -m cortex
          status` exits 0; (3) `python3 -m cortex health` exits 0; (4) unknown command
          exits non-zero with error message."
        gate: "python3 scripts/run_tests.py file tests/cli/test_main_entry_point.py —
          ALL 4 tests FAIL (ImportError or subprocess non-zero exit)"
        blocker: "Implementation of cortex/__main__.py forbidden until RED gate passes"
      green:
        action: "Create cortex/__main__.py with argparse dispatch: commands = status,
          health, audit. Route `status` to cortex.cli status, `health` to
          HealthOrchestrator.health_check(), `audit` to AuditCoordinator stub. Add
          type hints and module docstring."
        gate: "python3 scripts/run_tests.py file tests/cli/test_main_entry_point.py —
          ALL 4 tests PASS"
        blocker: "REFACTOR forbidden until GREEN gate passes"
      refactor:
        action: "Add CORE-011 type hints, CORE-012 module docstring. Verify no circular
          imports introduced. Run ruff on cortex/__main__.py."
        gate: "python3 scripts/run_tests.py dir tests/cli/ — zero regressions"
        blocker: "sub-phase COMPLETE forbidden until gate passes"
    tdd_sequence:
      red:
        - "test_python_m_cortex_help_exits_zero"
        - "test_python_m_cortex_status_exits_zero"
        - "test_python_m_cortex_health_exits_zero"
        - "test_python_m_cortex_unknown_command_exits_nonzero"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/cli/"
      min_tests_pass: 4
      zero_new_failures: true
      all_gap_refs_closed: false
      blocks_next_sub_phase: true

  - id: "phase-110-b"
    title: "RED/GREEN — Wire cortex status to real preflight health gate"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-110-02"]
    depends_on: ["phase-110-a"]
    tdd_cycle:
      red:
        action: "Write tests/cli/test_status_truthfulness.py: mock a failing preflight
          result and assert `python3 -m cortex status` exits non-zero and prints a
          failure message, NOT '✅ All systems operational'."
        gate: "python3 scripts/run_tests.py file tests/cli/test_status_truthfulness.py
          — test FAILS (status still prints OK regardless)"
        blocker: "Implementation forbidden until RED gate passes"
      green:
        action: "Update cortex/__main__.py status command: run
          `python3 scripts/run_tests.py preflight` as subprocess, capture exit code.
          If exit code != 0 → print '❌ CORTEX status: DEGRADED — preflight gate
          failed' and exit 1. Only print '✅ All systems operational' if preflight
          exits 0."
        gate: "python3 scripts/run_tests.py file tests/cli/test_status_truthfulness.py
          — ALL tests PASS"
        blocker: "REFACTOR forbidden until GREEN gate passes"
      refactor:
        action: "Extract health gate logic into cortex/cli/health_gate.py for reuse.
          Add type hints and docstrings. Verify existing CLI tests still pass."
        gate: "python3 scripts/run_tests.py dir tests/cli/ — zero regressions"
        blocker: "sub-phase COMPLETE forbidden until gate passes"
    tdd_sequence:
      red:
        - "test_status_reports_degraded_when_preflight_fails"
        - "test_status_reports_healthy_only_when_preflight_passes"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/cli/"
      min_tests_pass: 6
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-110-final"
    title: "Smoke Gate + CORE-064 Sweep Close + cortex-master.yaml update"
    priority: P0
    status: PLANNED
    gap_refs: []
    depends_on: ["phase-110-b"]
    prerequisite: "ALL preceding sub-phase completion_gates PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — ≥18085 tests pass"
    tdd_cycle:
      red:
        action: "N/A — verification gate only"
        gate: "All GAP-110-01, GAP-110-02, GAP-110-03 verified CLOSED"
        blocker: "Do NOT run smoke gate if any GAP remains OPEN"
      green:
        action: "Run full smoke gate — confirm ≥18085 tests pass with zero regressions"
        gate: "python3 scripts/run_tests.py smoke"
        blocker: "Do NOT mark phase COMPLETE if smoke gate fails"
      refactor:
        action: "Update phase YAML: move planned/ → completed/. Update cortex-master.yaml
          status → COMPLETE. Verify cortex-master.yaml ≤500 lines and YAML valid."
        gate: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml')); print('YAML valid')\""
        blocker: "Do NOT close phase without cortex-master.yaml update"
    acceptance_criteria:
      - "python3 -m cortex --help exits 0 and prints usage ✅"
      - "python3 -m cortex status exits 0 only when preflight passes ✅"
      - "python3 -m cortex health exits 0 ✅"
      - "ALL GAP-110-* entries status: CLOSED ✅"
      - "python3 scripts/run_tests.py smoke passes ≥18085 tests ✅"
      - "Zero new test failures vs baseline ✅"
      - "phase-110 detail file moved: planned/ → completed/ ✅"
      - "cortex-master.yaml entry updated to status: COMPLETE ✅"
      - "cortex-master.yaml remains ≤500 lines ✅"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 18085
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: false

ac_markers:
  start: "AC_START: AC-110-CLI-ENTRY-{timestamp}"
  complete: "AC_COMPLETE: AC-110-CLI-ENTRY-{timestamp} ✅"
