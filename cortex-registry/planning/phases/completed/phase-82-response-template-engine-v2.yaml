        - cortex-doc.prompt.md — pointer only ✅
        - chat-vs-terminal-guide.md — pointer only ✅
        - .github/agents/README.md — pointer only ✅
    action_ref: "phase-82-e"
    status: OPEN

  - id: "GAP-82-12"
    title: "BLOCK-EXECUTION-SPEC missing — no canonical block to surface a machine-readable per-step execution constraint document"
    severity: P2
    source: "DIGEST Pipeline 3 — usertemplate.md (2026-02-26) — model-tiering advisory"
    evidence: |
      The document 'Once CORTEX develops the plan using x3 model, can it then safely
      be executed via Haiku?' identifies Gate 1 (Execution Spec Compilation) as the
      critical safety mechanism enabling plan-on-capable-model + execute-on-cheap-model.
      Currently, CORTEX sub-phases have tdd_sequence.green (verbatim green steps) but
      no canonical response BLOCK that surfaces this as a human-readable, machine-parseable
      execution constraint document in the Chat interface.
      Without BLOCK-EXECUTION-SPEC, cheaper models (Haiku) have no structured spec to follow —
      they interpret the plan from context, which leads to intent violations.
      BLOCK-EXECUTION-SPEC renders the compiled spec as a scannable inline block
      (step id | action type | target files | command | validation) before execution begins.
      Integration: renders between BLOCK-INTENT-REFLECTION (confirm intent) and first
      implementation step. User can review + approve before cheaper model executes.
      CORTEX policy: x3 compiles spec; Haiku follows spec verbatim; any deviation → BLOCK-DEVIATION-ALERT.
    action_ref: "phase-82-f"
    status: OPEN

  - id: "GAP-82-13"
    title: "BLOCK-DEVIATION-ALERT missing — no canonical block for unexpected divergence from execution spec"
    severity: P2
    source: "DIGEST Pipeline 3 — usertemplate.md (2026-02-26) — model-tiering advisory"
    evidence: |
      Gate 3 (Deviation Detector) in the model-tiering advisory specifies that the executor
      must HALT + escalate when: unexpected test failure, more files changed than allowed,
      output doesn't match expected pattern, conflicting edits, environment mismatch.
      BLOCK-ERROR-RECOVERY (GAP-82-05) exists for known error states (P0 violations,
      blocked gates, failed tests where failure is expected). BLOCK-DEVIATION-ALERT is
      different: it signals unexpected divergence from the execution spec — the executor
      did something outside its allowed step types or produced an output that doesn't match.
      Format:
        ### ⚠️ Deviation Detected — Escalating to Architect
        **Step:** {step_id}
        **Expected:** {expected_output}
        **Actual:** {actual_output}
        **Divergence type:** {more_files | test_unexpected | env_mismatch | output_mismatch}
        **Action required:** Human review or x3 re-plan before continuing
      This block forces an explicit stop, surfaces exactly what deviated, and prevents
      the cheap model from covering up the divergence with a "close enough" patch.
    action_ref: "phase-82-f"
    status: OPEN

  - id: "GAP-82-14"
    title: "Sub-phase specs lack execution_tier field — model-tiering policy unenforceable at phase-spec level"
    severity: P3
    source: "DIGEST Pipeline 3 — usertemplate.md (2026-02-26) — model-tiering advisory"
    evidence: |
      The model-tiering advisory recommends declaring which model tier executes each step.
      CORTEX sub-phase specs currently have: priority, status, gap_refs, depends_on,
      tdd_cycle, tdd_sequence, completion_gate — but no execution_tier field.
      Without this field, the spec is ambiguous about whether a sub-phase is safe to
      delegate to a cheaper model or requires the planning-tier model.
      Proposed schema addition:
        execution_tier:
          plan: x3        # model tier that writes the execution spec
          execute: haiku  # model tier that follows the spec (or x3 if judgment required)
          escalate_to: x3 # model tier that receives BLOCK-DEVIATION-ALERT escalations
          safe_to_delegate: true  # derived: true if all tdd_sequence.green steps are verbatim
      Rules for safe_to_delegate: true:
        - All tdd_sequence.green steps are verbatim (exact file paths, exact commands)
        - completion_gate has explicit, machine-checkable assertions
        - No step in tdd_sequence.green contains abstract language ('refactor cleanly', 'improve design')
      This P3 is a schema enhancement only — no implementation required, just YAML field additions
      to phase-82-f's own spec as a self-demonstrating example.
    action_ref: "phase-82-f"
    status: OPEN

