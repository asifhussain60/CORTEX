# ─────────────────────────────────────────────────────────────────────────────
# STANDARDIZED ASSEMBLY ORDER ("Beautiful in Copilot Chat")
# ─────────────────────────────────────────────────────────────────────────────
# This is the canonical block emission sequence for most execution modes.
# Key principle: Route and Metrics are compact lines near top/bottom so the
# response feels "instrumented" without becoming a report.
#
#   ## 🧠 CORTEX …           ← BLOCK-SESSION-IDENTITY (once per session, H2 — the ONLY H2)
#   ✅ Done — {action} …     ← BLOCK-MICRO-ACK (no header, for trivial confirmations only)
#   **Route:** IR → …        ← BLOCK-HANDOFF (inline, near top when routing is complex)
#   ### 🔴 Error: {cat}      ← BLOCK-ERROR-RECOVERY (H3, near top — only in FIX/DEBUG modes)
#   ### 🔎 What changed      ← BLOCK-DIFF-PREVIEW (short bullets or <details>)
#   ### 🧩 Diff preview      ← BLOCK-DIFF-PREVIEW continued (table ≤5 files, <details> >5)
#   ### 🧪 Metrics           ← BLOCK-METRICS-DASHBOARD (single-line ≤4, table >4)
#   ### ▶ Next               ← BLOCK-NEXT-STEPS (2-5 bullets, no nesting)
#   ⏸️ SESSION PAUSE          ← BLOCK-RESUME-BANNER (only if sweep paused)
#
# Rules:
#   - BLOCK-SESSION-IDENTITY: only on first response in session (never repeated)
#   - BLOCK-MICRO-ACK: standalone (replaces all other blocks for trivial acks)
#   - BLOCK-HANDOFF + BLOCK-METRICS-DASHBOARD: compact "instrumentation" lines
#   - BLOCK-ERROR-RECOVERY: place near top when present (high-signal)
#   - All blocks follow R1-R6 formatting rules
#   - Whitespace normalizer runs as final post-processing step
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# FORMATTING RULES R1-R6 (Copilot Chat Renderer Safety)
# ─────────────────────────────────────────────────────────────────────────────
# These mechanical rules eliminate 80%+ of Copilot Chat markdown rendering
# issues. They are enforced by the Whitespace Normalizer (GAP-82-08) and
# codified in SSOT quality checklist + governance template (GAP-82-10).
#
#   R1: Always insert a blank line after any ## or ### heading
#   R2: Always insert a blank line before any list (-, 1.) and after the list
#   R3: Tables require:
#       - blank line before table
#       - header row + separator row present
#       - no multi-paragraph content inside cells
#   R4: Optional blocks with no content → omit entirely (no empty headers)
#   R5: Never hard-wrap — let the editor wrap naturally
#   R6: One H2 per response max (Session Identity only) — everything else H3 or bold labels
#
# Known stable patterns:
#   ✅ H2/H3 hierarchy + emoji anchors (## 🧠 / ### 🔴)
#   ✅ --- separator (simple, stable in all renderers)
#   ✅ <details> for collapsible content
#   ✅ Bold labels: **What:** / **Why:** / **Files:** (flat, no nesting)
#
# Known risky patterns:
#   ❌ Box-drawing characters (├─ └─) — collapse in Copilot Chat
#   ❌ Tables with cells >80 chars — become blobs
#   ❌ Deep nested lists (>2 levels) — get reflowed
#   ❌ Code fences with indentation or tables inside them
#   ❌ Hard-wrapped sentences — create weird list/table behavior
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# AC MARKERS
# ─────────────────────────────────────────────────────────────────────────────
ac_markers:
  start: "AC_START: AC-82-RESPONSE-TEMPLATE-V2-{timestamp}"
  complete: "AC_COMPLETE: AC-82-RESPONSE-TEMPLATE-V2-{timestamp} ✅"
