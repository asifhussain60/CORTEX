      Renderer note: BLOCK-DIFF-PREVIEW must integrate with the Renderer Safety
      Switch (GAP-82-09) — use table for ≤5 files with short paths, auto-downgrade
      to <details> blocks for >5 files or when any cell exceeds 80 chars.
    action_ref: "phase-82-b"
    status: OPEN

  - id: "GAP-82-04"
