  - id: "GAP-82-05"
    title: "BLOCK-ERROR-RECOVERY missing — error responses are ad-hoc, no severity/recovery structure"
    severity: P1
    source: "DESIGN session 2026-02-26"
    evidence: |
      Error states (blocked gates, failed tests, P0 violations) currently
      use free-form prose. No standard: category / what happened / impact /
      recovery steps. EnforcementOrchestrator and TDDOrchestrator each format
      errors differently — violates CORE-035 (no duplicate implementations).
      Renderer note: Must use bold-label pattern (not nested lists) to avoid
      deep nesting reflow:
        **What happened:** {description}
        **Impact:** {scope}
        **Recovery:** {numbered steps}
      Must follow R6 — render as H3 "### 🔴 Error: {category}" (not H2).
      Place near top of response when present (high-signal positioning).
    action_ref: "phase-82-c"
    status: OPEN

  - id: "GAP-82-06"
    title: "BLOCK-METRICS-DASHBOARD missing — test/coverage/timing metrics buried in prose"
    severity: P2
    source: "DESIGN session 2026-02-26"
    evidence: |
      Completion responses include metrics inline in paragraphs or varied table
      formats. No canonical single-line dashboard format defined.
      YAML registry has metrics field in completion_report but no SSOT block.
      Renderer note: Must follow R6 (H3 or bold label, not H2) and use single-line
      format when ≤4 metrics (e.g. "Tests: 913/913 ✅ | Coverage: 95% | Duration: 3.2s | Commits: 1").
      When >4 metrics, use compact table with Renderer Safety Switch guard.
    action_ref: "phase-82-c"
    status: OPEN

  - id: "GAP-82-07"
    title: "BLOCK-HANDOFF missing — orchestrator routing chain invisible during complex requests"
    severity: P2
    source: "DESIGN session 2026-02-26"
    evidence: |
      When MasterOrchestrator routes through 2+ orchestrators (e.g. AUDIT →
      EnforcementOrchestrator → SweepCatalogueOrchestrator), the chain is
      invisible to the user. No standard inline routing display exists.
    action_ref: "phase-82-c"
    status: OPEN

  - id: "GAP-82-08"
    title: "Whitespace Normalizer missing — no automated blank-line enforcement around markdown structures"
    severity: P1
    source: "Independent review 2026-02-26 — renderer pitfall analysis"
    evidence: |
      VS Code Copilot Chat renderer requires blank lines around headings, lists,
      tables, and <details> blocks. Without enforcement, 80% of markdown
      rendering issues are caused by missing blank lines. Current blocks do not
      enforce this mechanically — each orchestrator and template emits whitespace
      ad-hoc. Examples of failure:
        - Heading immediately followed by a list (no blank line) → list renders inline
        - Table preceded by text (no blank line) → table header merges with paragraph
        - <details> without blank line before → collapsible section fails to render
      The normalizer must run as a post-processing step on all rendered output
      before it reaches the Copilot Chat renderer.
    action_ref: "phase-82-d"
    status: OPEN

  - id: "GAP-82-09"
    title: "Renderer Safety Switch missing — tables with long cells become unreadable blobs"
    severity: P1
    source: "Independent review 2026-02-26 — renderer pitfall analysis"
    evidence: |
      When any table cell exceeds ~80-120 characters (paths, diffs, JSON text),
      Copilot Chat renders the table as a horizontally-scrolling or wrapped blob
      that is impossible to read. No automatic downgrade mechanism exists.
      Current response-templates.yaml defines table schemas (pre_work_manifest,
      post_work_diff, violations_table) but none have cell-length guards.
      The safety switch must auto-downgrade: table → bulleted list (short excess)
      or table → <details> block with code fences (large excess).
      Threshold: configurable, default 80 chars per cell.
    action_ref: "phase-82-d"
    status: OPEN

  - id: "GAP-82-10"
    title: "Formatting Rules R1-R6 not codified — mechanical rendering rules not enforced at template level"
    severity: P1
    source: "Independent review 2026-02-26 — renderer pitfall analysis"
    evidence: |
      Six mechanical formatting rules have been identified that prevent the most
      common Copilot Chat rendering failures. These rules are currently implicit
      (learned through 4 generations of rendering bugs) but not codified in the
      SSOT or governance template for enforcement:
        R1: Always insert a blank line after any ## or ### heading
        R2: Always insert a blank line before any list (-, 1.) and after the list
        R3: Tables require: blank line before, header+separator present, no multi-paragraph cells
        R4: Optional blocks with no content must be omitted entirely (no empty headers)
        R5: Never hard-wrap — let the editor wrap naturally
        R6: One H2 per response max (except Session Identity) — everything else H3 or bold labels
      These rules should be codified in the SSOT quality checklist, the governance
      template validation section, and the YAML registry rendering_rules section.
    action_ref: "phase-82-d"
    status: OPEN

