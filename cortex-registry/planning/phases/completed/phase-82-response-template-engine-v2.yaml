# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: DESIGN session 2026-02-26 — "recreate response template system fresh
  out of the box" request with full audit of 3-file SSOT hierarchy.
  Score at entry: 8.5/10 (current system is mature — 28+ battle-tested commits)
  Target: 9.5/10 (eliminate 10 identified gaps in composable block coverage + renderer safety)
  Baseline measurements:
    - Smoke tests: 1,211 passed
    - Golden response tests: tests/golden/response/test_response_templates_golden.py
    - SSOT file: .github/templates/cortex-response-templates.md (1,853 lines)
    - YAML registry: cortex-registry/artifacts/templates/responses/response-templates.yaml
    - Governance template: cortex-registry/workflows/templates/governance/copilot-chat-response-template.yaml
  Context: All 81 prior phases COMPLETE. This phase extends the composable LEGO
  block system without rebuilding — preserving 4 generations of rendering
  lessons (tree-char collapse, fenced progress bar bugs, template explosion failure).
  Documentation created: cortex-docs/.content/01-capabilities/10-response-template-engine.md

  ENHANCEMENT (v2.0 — Renderer Hardening):
  Independent review identified that the 7 new blocks are architecturally solid
  but will be undermined by VS Code Copilot Chat renderer pitfalls unless
  3 additional hardening mechanisms are added:
    1. Whitespace Normalizer — enforces blank-line rules around headings, lists,
       tables, and <details> blocks (eliminates 80% of Copilot markdown weirdness)
    2. Renderer Safety Switch — auto-downgrades tables to list/<details> when any
       cell exceeds a configurable character threshold (prevents "table blob" failure)
    3. Formatting Rules R1-R6 — mechanical rules baked into the template engine
       that CORTEX can enforce automatically at render time
  These 3 additions increase the gap catalogue from 7 to 10 and add a new
  sub-phase (phase-82-d) for the renderer hardening layer.

  Known Copilot Chat Renderer Pitfalls (evidence from 4 generations of rendering):
    - Missing blank lines around headings/lists/tables cause content to merge
    - Tables with cells >80 chars turn into unreadable blobs
    - Deep nested lists get reflowed by the renderer
    - Code fences with indentation or tables inside them break
    - Box-drawing characters collapse; emoji anchors are stable
    - Hard-wrapping inside sentences creates weird list/table behavior
    - Empty headers with no content underneath create visual noise

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-82-01"
    title: "BLOCK-SESSION-IDENTITY missing — header repeats author/orchestrator on every response"
    severity: P1
    source: "DESIGN session 2026-02-26 — architecture audit"
    evidence: |
      Current: Every response repeats full header including author/orchestrator.
      In a long session (10+ turns), user sees identical header lines 10+ times.
      SSOT: .github/templates/cortex-response-templates.md § Response Header
      No 'session-first render, mode-only on subsequent' mechanism exists.
      Renderer note: BLOCK-SESSION-IDENTITY is the ONLY block allowed to use H2.
      All subsequent blocks must use H3 or bold labels (R6). The H2 emoji
      anchor pattern (## 🧠 CORTEX …) is stable in Copilot Chat renderers.
    action_ref: "phase-82-a"
    status: OPEN

  - id: "GAP-82-02"
    title: "BLOCK-MICRO-ACK missing — sub-10-word confirmations over-formatted with 5-section structure"
    severity: P2
    source: "DESIGN session 2026-02-26"
    evidence: |
      Simple acks ("Done ✅", "Fixed ✅", "Committed.") currently use the full
