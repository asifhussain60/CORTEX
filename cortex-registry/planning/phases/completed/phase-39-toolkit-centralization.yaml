# Phase 90: CORTEX Toolkit Centralization
# Authority: cortex-architect.prompt.md
# Author: Asif Hussain
# Status: PLANNED
# Created: 2026-02-16

metadata:
  phase_id: P-90
  title: "CORTEX Toolkit Centralization & MCP Exposure"
  status: PLANNED
  priority: P1
  estimated_effort: "8-12 hours"
  created_date: "2026-02-16"
  author: "Asif Hussain"
  orchestrator: "TDDOrchestrator"
  tags:
    - infrastructure
    - mcp
    - toolkit
    - automation
    - code-quality

problem_statement: |
  CORTEX has accumulated 20+ scattered Python utility scripts across .cortex-runtime/ and scripts/ 
  directories to fix intermittent issues (MCP diagnostics, setup verification, governance 
  validation, cleanup automation). These tools are:
  
  **Current Pain Points:**
  1. ❌ Scattered across 2+ directories with inconsistent naming
  2. ❌ NOT exposed via MCP (manual execution only)
  3. ❌ Duplicate functionality across scripts
  4. ❌ No unified testing strategy
  5. ❌ Difficult to discover and maintain
  6. ❌ Mix of production-grade and ad-hoc scripts
  
  **Business Impact:**
  - Developer friction (which script to run?)
  - Maintenance burden (duplicate logic)
  - Manual intervention required (should be automated)
  - No integration with CORTEX orchestrators
  
  **Example Duplication:**
  - verify-mcp-setup.py, verify-mcp-tools.py, diagnose-mcp.py (overlapping MCP checks)
  - run_vacuum.py vs vacuum-runner.py (cleanup operations)
  - Multiple validation scripts (validate-production.py, validate_governance_alignment.py)

solution_overview: |
  Consolidate scattered utilities into cortex/toolkit/ package with:
  1. **Unified Toolkit Package** (cortex/toolkit/)
  2. **MCP Exposure** (toolkit_* tools - generic naming)
  3. **Testing Coverage** (tests/toolkit/)
  4. **Documentation** (toolkit usage guide)
  5. **Cleanup Strategy** (deprecate scattered scripts)

acceptance_criteria:
  - AC-P90-001: "Toolkit package structure created (cortex/toolkit/)"
  - AC-P90-002: "MCP diagnostics module consolidated (1 canonical implementation)"
  - AC-P90-003: "Setup verification module consolidated"
  - AC-P90-004: "Cleanup automation module consolidated"
  - AC-P90-005: "Governance validation module consolidated"
  - AC-P90-006: "All toolkit modules exposed via 5 MCP tools (generic naming)"
  - AC-P90-007: "Test coverage ≥85% for toolkit modules"
  - AC-P90-008: "Migration script deprecates old scripts"
  - AC-P90-009: "Documentation guide created (cortex-docs/toolkit/)"
  - AC-P90-010: "Zero regression in existing functionality"

stages:
  - stage_id: S-90-01
    title: "Tool Discovery & Categorization"
    description: |
      Audit all scattered Python scripts and categorize by function
    tasks:
      - id: T-90-01-01
        title: "Scan .cortex-runtime/ directory for Python utilities"
        acceptance: "List of 15+ scripts with function classification"
      
      - id: T-90-01-02
        title: "Scan scripts/ directory for toolkit candidates"
        acceptance: "List of 10+ scripts with function classification"
      
      - id: T-90-01-03
        title: "Create toolkit categorization matrix"
        acceptance: "5 categories: diagnostics, setup, cleanup, validation, automation"
      
      - id: T-90-01-04
        title: "Identify duplicate functionality across scripts"
        acceptance: "Duplication map showing overlapping logic"
    
    tests:
      - "test_toolkit_discovery_completeness.py"
      - "test_categorization_accuracy.py"
  
  - stage_id: S-90-02
    title: "Toolkit Package Structure"
    description: |
      Create cortex/toolkit/ with module organization
    tasks:
      - id: T-90-02-01
        title: "Create cortex/toolkit/ package"
        acceptance: "__init__.py with module registry"
      
      - id: T-90-02-02
        title: "Create diagnostics submodule"
        acceptance: "cortex/toolkit/diagnostics/ with MCP health checks"
      
      - id: T-90-02-03
        title: "Create setup submodule"
        acceptance: "cortex/toolkit/setup/ with environment verification"
      
      - id: T-90-02-04
        title: "Create cleanup submodule"
        acceptance: "cortex/toolkit/cleanup/ with vacuum automation"
      
      - id: T-90-02-05
        title: "Create validation submodule"
        acceptance: "cortex/toolkit/validation/ with governance checks"
    
    tests:
      - "test_toolkit_package_structure.py"
      - "test_module_imports.py"
  
  - stage_id: S-90-03
    title: "MCP Diagnostics Consolidation"
    description: |
      Consolidate MCP diagnostic scripts into single canonical module
    tasks:
      - id: T-90-03-01
        title: "Extract MCP health check logic from 4 scripts"
        acceptance: "MCPHealthChecker class with unified checks"
        source_files:
          - ".cortex-runtime/diagnose-mcp.py"
          - ".cortex-runtime/verify-mcp-setup.py"
          - ".cortex-runtime/verify-mcp-tools.py"
          - ".cortex-runtime/verify-mcp-fix.py"
      
      - id: T-90-03-02
        title: "Implement MCPHealthChecker.run_diagnostics()"
        acceptance: "Single method with 8 diagnostic checks"
      
      - id: T-90-03-03
        title: "Add auto-healing logic from AutoHealingMCPOrchestrator"
        acceptance: "Integration with existing auto-heal system"
      
      - id: T-90-03-04
        title: "Create toolkit_diagnose MCP tool"
        acceptance: "MCP tool exposing diagnostics via JSON-RPC"
    
    tests:
      - "test_mcp_health_checker.py"
      - "test_mcp_diagnostics_consolidation.py"
      - "test_toolkit_diagnose_tool.py"
  
  - stage_id: S-90-04
    title: "Setup Verification Consolidation"
    description: |
      Consolidate setup verification scripts
    tasks:
      - id: T-90-04-01
        title: "Extract setup checks from 3 scripts"
        acceptance: "SetupVerifier class with platform-aware checks"
        source_files:
          - ".cortex-runtime/verify-setup.py"
          - ".cortex-runtime/verify-autonomous-setup.py"
          - ".cortex-runtime/setup-mcp.py (verification functions)"
      
      - id: T-90-04-02
        title: "Implement cross-platform path resolution"
        acceptance: "Windows/macOS/Linux venv path handling"
      
      - id: T-90-04-03
        title: "Create toolkit_verify MCP tool"
        acceptance: "MCP tool for environment verification"
    
    tests:
      - "test_setup_verifier_windows.py"
      - "test_setup_verifier_macos.py"
      - "test_toolkit_verify_tool.py"
  
  - stage_id: S-90-05
    title: "Cleanup Automation Consolidation"
    description: |
      Consolidate cleanup/vacuum scripts
    tasks:
      - id: T-90-05-01
        title: "Merge run_vacuum.py and vacuum-runner.py"
        acceptance: "Single VacuumAutomation class"
        source_files:
          - ".cortex-runtime/run_vacuum.py"
          - "scripts/vacuum-runner.py"
      
      - id: T-90-05-02
        title: "Implement unified cleanup strategies"
        acceptance: "5 cleanup strategies (markdown, pycache, debug markers, etc.)"
      
      - id: T-90-05-03
        title: "Create toolkit_cleanup MCP tool"
        acceptance: "MCP tool for automated cleanup"
    
    tests:
      - "test_vacuum_automation.py"
      - "test_cleanup_strategies.py"
      - "test_toolkit_cleanup_tool.py"
  
  - stage_id: S-90-06
    title: "Governance Validation Consolidation"
    description: |
      Consolidate governance validation scripts
    tasks:
      - id: T-90-06-01
        title: "Extract validation logic from 2 scripts"
        acceptance: "GovernanceValidator class"
        source_files:
          - "scripts/validate-production.py"
          - "scripts/validate_governance_alignment.py"
      
      - id: T-90-06-02
        title: "Implement production readiness checks"
        acceptance: "8 validation categories (infra, deps, MCP, Docker, security)"
      
      - id: T-90-06-03
        title: "Create toolkit_validate MCP tool"
        acceptance: "MCP tool for governance checks"
    
    tests:
      - "test_governance_validator.py"
      - "test_production_readiness.py"
      - "test_toolkit_validate_tool.py"
  
  - stage_id: S-90-07
    title: "MCP Tool Exposure"
    description: |
      Expose all toolkit modules via 5 MCP tools
    tasks:
      - id: T-90-07-01
        title: "Register toolkit_diagnose tool"
        acceptance: "Tool registered in cortex/mcp/tools/toolkit/"
      
      - id: T-90-07-02
        title: "Register toolkit_verify tool"
        acceptance: "Tool registered with schema"
      
      - id: T-90-07-03
        title: "Register toolkit_cleanup tool"
        acceptance: "Tool registered with schema"
      
      - id: T-90-07-04
        title: "Register toolkit_validate tool"
        acceptance: "Tool registered with schema"
      
      - id: T-90-07-05
        title: "Register toolkit_analyze tool (audit_traces.py)"
        acceptance: "Tool registered for trace analysis"
      
      - id: T-90-07-06
        title: "Update MCP server tool count (24 → 29 tools)"
        acceptance: "MCPServer.__init__ shows 29 tools"
    
    tests:
      - "test_toolkit_mcp_registration.py"
      - "test_toolkit_tool_discovery.py"
  
  - stage_id: S-90-08
    title: "Testing & Documentation"
    description: |
      Test coverage and user documentation
    tasks:
      - id: T-90-08-01
        title: "Create test suite (tests/toolkit/)"
        acceptance: "85%+ coverage for all toolkit modules"
      
      - id: T-90-08-02
        title: "Create toolkit usage guide"
        acceptance: "cortex-docs/toolkit/README.md with examples"
      
      - id: T-90-08-03
        title: "Update /check-env command to use toolkit"
        acceptance: "Command uses toolkit_diagnose tool"
      
      - id: T-90-08-04
        title: "Update copilot instructions with toolkit commands"
        acceptance: ".github/copilot-instructions.md references toolkit"
    
    tests:
      - "test_toolkit_integration.py"
      - "test_documentation_completeness.py"
  
  - stage_id: S-90-09
    title: "Migration & Cleanup"
    description: |
      Deprecate old scripts and migrate usage
    tasks:
      - id: T-90-09-01
        title: "Create migration script"
        acceptance: "scripts/migrate-to-toolkit.py"
      
      - id: T-90-09-02
        title: "Add deprecation warnings to old scripts"
        acceptance: "15+ scripts show deprecation notice"
      
      - id: T-90-09-03
        title: "Update .github/workflows to use toolkit"
        acceptance: "CI/CD uses toolkit_* tools"
      
      - id: T-90-09-04
        title: "Archive deprecated scripts to .cortex-runtime/archive/"
        acceptance: "20+ scripts moved with migration complete marker"
    
    tests:
      - "test_migration_completeness.py"
      - "test_no_deprecated_script_usage.py"

toolkit_modules:
  diagnostics:
    description: "MCP health checks, environment diagnostics, auto-healing"
    consolidated_from:
      - ".cortex-runtime/diagnose-mcp.py"
      - ".cortex-runtime/verify-mcp-setup.py"
      - ".cortex-runtime/verify-mcp-tools.py"
      - ".cortex-runtime/verify-mcp-fix.py"
    canonical_location: "cortex/toolkit/diagnostics/mcp_health.py"
    mcp_tool: "toolkit_diagnose"
    key_functions:
      - "check_mcp_availability()"
      - "validate_tool_registry()"
      - "diagnose_connection_issues()"
      - "auto_heal_configuration()"
  
  setup:
    description: "Cross-platform setup verification, dependency checks"
    consolidated_from:
      - ".cortex-runtime/verify-setup.py"
      - ".cortex-runtime/verify-autonomous-setup.py"
      - ".cortex-runtime/setup-mcp.py (verify functions)"
    canonical_location: "cortex/toolkit/setup/verifier.py"
    mcp_tool: "toolkit_verify"
    key_functions:
      - "verify_environment()"
      - "check_dependencies()"
      - "validate_venv()"
      - "test_mcp_integration()"
  
  cleanup:
    description: "Automated cleanup, vacuum operations, markdown suppression"
    consolidated_from:
      - ".cortex-runtime/run_vacuum.py"
      - "scripts/vacuum-runner.py"
    canonical_location: "cortex/toolkit/cleanup/vacuum.py"
    mcp_tool: "toolkit_cleanup"
    key_functions:
      - "cleanup_markdown_sprawl()"
      - "cleanup_debug_markers()"
      - "cleanup_pycache()"
      - "cleanup_session_data()"
  
  validation:
    description: "Governance validation, production readiness, compliance checks"
    consolidated_from:
      - "scripts/validate-production.py"
      - "scripts/validate_governance_alignment.py"
    canonical_location: "cortex/toolkit/validation/governance.py"
    mcp_tool: "toolkit_validate"
    key_functions:
      - "validate_production_readiness()"
      - "check_governance_alignment()"
      - "assess_security_posture()"
      - "generate_readiness_report()"
  
  analysis:
    description: "Trace analysis, orchestrator auditing, performance metrics"
    consolidated_from:
      - ".cortex-runtime/audit_traces.py"
      - ".cortex-runtime/analyze_root_dirs.py"
    canonical_location: "cortex/toolkit/analysis/traces.py"
    mcp_tool: "toolkit_analyze"
    key_functions:
      - "audit_orchestrator_traces()"
      - "analyze_performance_metrics()"
      - "generate_usage_reports()"

mcp_tools:
  - name: "toolkit_diagnose"
    category: "toolkit"
    description: "Diagnose MCP health and environment issues"
    schema:
      operation:
        type: "string"
        enum: ["full", "mcp", "venv", "settings", "tools"]
        default: "full"
    authority: "Phase 90 S-90-07"
  
  - name: "toolkit_verify"
    category: "toolkit"
    description: "Verify development environment setup and dependencies"
    schema:
      platform:
        type: "string"
        enum: ["auto", "windows", "macos", "linux"]
        default: "auto"
    authority: "Phase 90 S-90-07"
  
  - name: "toolkit_cleanup"
    category: "toolkit"
    description: "Run automated cleanup operations"
    schema:
      strategy:
        type: "string"
        enum: ["markdown", "pycache", "debug", "sessions", "all"]
        default: "all"
    authority: "Phase 90 S-90-07"
  
  - name: "toolkit_validate"
    category: "toolkit"
    description: "Validate governance and production readiness"
    schema:
      validation_type:
        type: "string"
        enum: ["governance", "production", "security", "compliance", "all"]
        default: "all"
    authority: "Phase 90 S-90-07"
  
  - name: "toolkit_analyze"
    category: "toolkit"
    description: "Analyze traces and orchestrator usage"
    schema:
      analysis_type:
        type: "string"
        enum: ["traces", "performance", "usage", "health"]
        default: "traces"
    authority: "Phase 90 S-90-07"

migration_strategy:
  approach: "Gradual deprecation with toolkit promotion"
  phases:
    - phase: "S-90-01 to S-90-06"
      action: "Build toolkit modules (no user impact)"
    
    - phase: "S-90-07"
      action: "Expose MCP tools (parallel with old scripts)"
    
    - phase: "S-90-08"
      action: "Update documentation (promote toolkit usage)"
    
    - phase: "S-90-09"
      action: "Deprecate old scripts (warnings added)"
    
    - phase: "Future Phase"
      action: "Remove deprecated scripts (after 2-week grace period)"
  
  user_communication:
    - "Toolkit available via MCP tools (easier than CLI)"
    - "Old scripts deprecated but functional (warnings only)"
    - "Migration guide available (cortex-docs/toolkit/migration.md)"
    - "No breaking changes to existing workflows"

benefits:
  developer_experience:
    - "🔍 Single source of truth for utilities"
    - "⚡ MCP exposure (no manual script execution)"
    - "📚 Unified documentation"
    - "🧪 Better test coverage"
  
  maintainability:
    - "✂️ 60% reduction in scattered scripts (20 → 5 modules)"
    - "🎯 Elimination of duplicate logic"
    - "📦 Package structure (easier to extend)"
    - "🔄 Centralized updates"
  
  automation:
    - "🤖 MCP tool integration"
    - "🔧 Orchestrator hookable"
    - "📊 Telemetry-enabled"
    - "⚙️ CI/CD friendly"

risks_and_mitigations:
  risk_1:
    description: "Existing workflows break during migration"
    severity: "HIGH"
    mitigation: "Parallel operation (old + new) during S-90-09"
  
  risk_2:
    description: "Missing functionality in consolidated modules"
    severity: "MEDIUM"
    mitigation: "TDD approach ensures feature parity"
  
  risk_3:
    description: "MCP tool bloat (24 → 29 tools)"
    severity: "LOW"
    mitigation: "Toolkit tools grouped under single category"

dependencies:
  phases:
    - "Phase 51: EnvironmentIntegrityAgent (MCP health checks)"
    - "Phase 53: Cross-platform architecture (path handling)"
  
  external:
    - "pytest ≥7.0 (test suite)"
    - "pydantic ≥2.0 (schema validation)"

success_metrics:
  code_quality:
    - "Script reduction: 20 → 5 canonical modules (75% reduction)"
    - "Test coverage: ≥85% for toolkit package"
    - "Duplicate elimination: 100% (no logic duplication)"
  
  usability:
    - "MCP tool discovery: 5 new toolkit tools"
    - "Documentation completeness: 100% (all modules documented)"
    - "Migration adoption: ≥80% of workflows using toolkit within 2 weeks"
  
  automation:
    - "MCP invocations: ≥50 daily (toolkit tools usage)"
    - "Manual script execution: <10% of operations"
    - "CI/CD integration: 100% (all pipelines use toolkit)"

deliverables:
  code:
    - "cortex/toolkit/ package (5 submodules)"
    - "cortex/mcp/tools/toolkit/ (5 MCP tools)"
    - "tests/toolkit/ (85%+ coverage)"
  
  documentation:
    - "cortex-docs/toolkit/README.md"
    - "cortex-docs/toolkit/diagnostics.md"
    - "cortex-docs/toolkit/migration.md"
  
  automation:
    - "scripts/migrate-to-toolkit.py"
    - ".github/workflows/toolkit-tests.yml"

notes: |
  **CRITICAL DECISIONS:**
  1. ✅ Keep old scripts functional during migration (deprecation warnings only)
  2. ✅ MCP exposure is PRIMARY interface (CLI secondary)
  3. ✅ TDD approach ensures zero regression
  4. ✅ Toolkit tools grouped under "toolkit" category (VS Code limit: 128 tools)
  
  **IMPLEMENTATION ORDER:**
  1. S-90-01 → S-90-02: Foundation (package structure)
  2. S-90-03 → S-90-06: Consolidation (4 modules in parallel)
  3. S-90-07: MCP exposure (integration layer)
  4. S-90-08: Quality (tests + docs)
  5. S-90-09: Cleanup (deprecation + migration)
  
  **POST-PHASE ACTIONS:**
  - Monitor toolkit adoption metrics
  - Remove deprecated scripts after 2-week grace period
  - Extend toolkit with new utilities as needed
  - Consider adding cortex_toolkit_optimize for performance tuning