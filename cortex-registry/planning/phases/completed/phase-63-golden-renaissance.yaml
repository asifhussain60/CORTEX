  # ── PHASE 63-C ─────────────────────────────────────────────────────────────
  - id: phase-63-c
    title: "Enhance TestQualityGate scorer — 4 new signals for workflow/trace/response"
    priority: P1
    status: PLANNED
    gap_refs: [GAP-63-03]
    governance_authority: "CORE-008, CORE-035"
    duration_estimate: "3 hours"
    prerequisite: "phase-63-b complete"
    regression_gate: "make test-batch — zero new failures; existing KEEP scores do not drop"

    files_to_edit:
      - "cortex-registry/core/test-quality-gate.yaml — add 4 signal blocks, bump version to 2.0"
      - "cortex/testing/quality_gate.py — version bump constant only; no logic change (config-driven)"

    new_signals:
      - dimension: "impact"
        signal_name: "workflow_template_consumption"
        patterns:
          - "WorkflowTemplateRegistry"
          - "load_workflow_template"
          - "template_id"
          - "workflow_template_ref"
          - "PrimitiveScanner"
          - "TemplateComposer"
        points: 1
        rationale: "Tests consuming real workflow templates verify production execution paths."

      - dimension: "impact"
        signal_name: "response_template_rendering"
        patterns:
          - "ResponseHeaderConfig"
          - "response_format_validator"
          - "template_engine"
          - "golden.*format"
          - "five.*section"
          - "cortex-response-templates"
        points: 1
        rationale: "Tests verifying VS Code Copilot Chat rendering validate the user-facing contract."

      - dimension: "detection"
        signal_name: "trace_chain_verification"
        patterns:
          - "AC_START.*AC_COMPLETE"
          - "orchestrator-traces.db"
          - "trace_chain"
          - "assert.*audit_event"
          - "expected_audit_events"
          - "assert_trace_chain"
          - "no.*orphan.*AC_START"
        points: 1
        rationale: "Tests verifying SQLite trace completeness catch silent orchestrator failures."

      - dimension: "likelihood"
        signal_name: "scenario_yaml_driven"
        patterns:
          - "execute_holistic_scenario"
          - "ScenarioDefinition"
          - "scenarios/S\\d+"
          - "HolisticIntegrationHarness"
          - "holistic_scenario"
        points: 1
        rationale: "YAML-driven scenario tests are more likely to catch real regressions."

    tdd_sequence:
      red:
        - "test_scorer_rewards_workflow_template_consumption: file with WorkflowTemplateRegistry scores higher"
        - "test_scorer_rewards_trace_chain_verification: file with assert_trace_chain scores higher"
        - "test_scorer_rewards_response_rendering: file with ResponseHeaderConfig scores higher"
        - "test_existing_keep_scores_unchanged: re-score all current KEEP files, assert no drops"
      green:
        - "Add 4 signal blocks to cortex-registry/core/test-quality-gate.yaml"
        - "Bump version field in test-quality-gate.yaml to 2.0"
      refactor:
