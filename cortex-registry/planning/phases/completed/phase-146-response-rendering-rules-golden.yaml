# ─────────────────────────────────────────────────────────────────────────────
# PHASES
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: "phase-146-a"
    title: "Create response rendering rules golden tests"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-146-01"]
    governance_authority: "CORE-008, CORE-064"
    duration_estimate: "3 hours"
    depends_on: []
    tdd_sequence:
      implementation_steps:
        - "Collect all YAML files from cortex-registry/templates/response/ (atoms, blocks, compositions)"
        - "For each YAML file, extract string values containing markdown"
        - "Validate against 14 rendering rules"
    rules_to_validate:
      - id: R1
        description: "Blank line required after every heading (## / ###)"
        regex: "##[^\\n]*\\n[^\\n]"
        expected: "No matches (blank line must follow)"
      - id: R2
        description: "Blank line before and after every list"
        regex: "[^\\n]\\n[-*]|[-*][^\\n]*\\n[^-*\\n]"
        expected: "No matches (lists need surrounding blank lines)"
      - id: R3
        description: "Tables require blank line before + header row + separator row"
        regex: "[^\\n]\\n\\|"
        expected: "No matches (blank line before table)"
      - id: R4
        description: "No empty headers (H2/H3 with no content below)"
        regex: "##[^#\\n]*\\n\\n##"
        expected: "No matches (content must follow header)"
      - id: R5
        description: "No hard-wrap within paragraphs (newline inside prose)"
        regex: "[a-z,]\\n[a-z]"
        expected: "No matches in prose sections"
      - id: R6
        description: "One H1 only; all content sections use H2+"
        check: "Count # at line start; only 1 single-# heading allowed"
      - id: Rule1
        description: "Use bullet lists (not tree chars ├─ └─)"
        regex: "[├└│]"
        expected: "No matches"
      - id: Rule3
        description: "No long horizontal lines (━━━━)"
        regex: "━{4,}"
        expected: "No matches"
      - id: Rule4
        description: "Max 5 table columns"
        check: "Count | in header rows; must be ≤6 (5 columns = 6 pipes)"
    test_cases:
      - test_r1_blank_line_after_heading
      - test_r2_blank_line_around_lists
      - test_r3_table_formatting
      - test_r4_no_empty_headers
      - test_r5_no_hard_wrap_paragraphs
      - test_r6_single_h1
      - test_no_tree_characters
      - test_no_long_horizontal_lines
      - test_max_5_table_columns
      - test_all_atoms_comply
      - test_all_blocks_comply
      - test_all_compositions_comply
      - test_response_templates_md_complies
    completion_gate: "make test-smoke — zero failures, all 14 rules validated"

