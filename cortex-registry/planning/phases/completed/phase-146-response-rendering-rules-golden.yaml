# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: GitHub Issue #17 (cortex-sts feedback extraction 2026-03-09)
  Establishes golden tests that enforce the 14 Mandatory Rendering Rules for
  CORTEX response templates.
  
  Validates all response composition YAMLs (atoms, blocks, compositions) against:
  - R1: Blank lines after headings
  - R2: Blank lines around lists
  - R3: Table formatting
  - R4: No empty headers
  - R5: No hard-wrap in paragraphs
  - R6: Single H1
  - Rule 1: No tree characters (├─ └─)
  - Rule 3: No long horizontal lines
  - Rule 4: Max 5 table columns
  
  Scans both YAML template files and cortex-response-templates.md.

