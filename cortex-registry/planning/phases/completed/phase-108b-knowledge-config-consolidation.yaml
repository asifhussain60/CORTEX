  Two namespace duplications remain in cortex-registry/:
  
  1. KNOWLEDGE NAMESPACE (2 locations → 1):
     a. cortex-registry/knowledge/ (39 files) — CANDIDATE CANONICAL
     b. cortex-registry/knowledge-base/ (21 files) — OVERLAPPING
     
     Analysis:
     - knowledge/ contains domain knowledge YAMLs (patterns, strategies, templates)
     - knowledge-base/ contains reference docs and governance best practices
     The split is actually meaningful — they serve different purposes.
     Action: Rename knowledge-base/ → knowledge/reference/ to clarify hierarchy.
     Keep knowledge/ as-is (canonical domain knowledge).
  
  2. CONFIG NAMESPACE (2 locations → 1):
     a. cortex-registry/config/ (4 files) — framework configuration
     b. cortex-registry/core/config/ (6 files) — core governance configuration
     
     Analysis: config/ has framework-level settings; core/config/ has governance constants.
     Action: Merge cortex-registry/config/ INTO cortex-registry/core/config/.
     Update ~5 Python references.

