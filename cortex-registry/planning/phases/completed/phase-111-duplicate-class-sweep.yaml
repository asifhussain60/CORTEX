id: "phase-111"
title: "Duplicate Class Sweep — Resolve 274 CORE-035 Violations via Canonical Consolidation"
version: "1.0"
created: "2026-03-02"
status: COMPLETE
priority: P1
governance_authority:
  - CORE-008  # TDD mandatory
  - CORE-011  # Type hints on all functions
  - CORE-012  # Docstrings on all public APIs
  - CORE-035  # Single canonical implementation — no duplicates
  - CORE-064  # Sweep Completeness Contract
  - CORE-068  # Universal Convergence Gate
sweep_catalogue_id: "SWEEP-111-DUPLICATE-CLASS-SWEEP"

background: |
  Source: DIGEST chat01.md (2026-03-02) + Audit Check #26 live scan.
  Finding: 274 duplicate class names across cortex/ — up from 79 at time of chat01.md.
  Phase 98 ("Dead Code Cleanup") did not fix CORE-035 violations and the count grew.
  Python silently uses the last import of any duplicated name, making earlier definitions
  dead code that is invisible at runtime but harmful to reasoning, readability, and CORE-035.
  Top offenders (by duplicate count):
    ValidationResult: 24 definitions
    Config:           19 definitions
    HealthCheckResult: 9 definitions
    CacheEntry:        9 definitions
    IntentType:        9 definitions
    Challenge:         7 definitions
    DependencyGraph:   7 definitions
    ExecutionResult:   6 definitions
    RiskLevel:         6 definitions
  Most canonical homes are cortex/models/canonical_enums.py for enums/status types,
  cortex/core/ for infrastructure primitives, and cortex/intelligence/ for intelligence types.
  Score at entry: 0/10 (274 duplicate violations, CORE-035 failing)
  Target score: 10/10 (0 duplicates — Audit Check #26 returns DUPLICATES=0)
  Baseline measurements:
    - Smoke tests: 18,085 collected, suite passes (exit 0)
    - Duplicate class count: 274 (AST scan 2026-03-02)
    - Total classes: 2,804
  Git prerequisite: branch CORTEX, clean working tree, phase-110 not a prerequisite

sweep_catalogue:
  - id: "GAP-111-01"
    title: "ValidationResult — 24 definitions across tools/, models/, core/"
    severity: P0
    source: "Audit Check #26 live scan 2026-03-02"
    evidence: |
      python3 AST scan: ValidationResult appears in 24+ files including
      cortex/tools/template_validator.py, cortex/tools/template_parser.py,
      cortex/tools/toolkit/toolkit_validation.py and 21 more.
      Canonical home: cortex/models/canonical_enums.py or cortex/core/common/validators.py
    action_ref: "phase-111-a"
    status: OPEN

  - id: "GAP-111-02"
    title: "Config — 19 definitions"
    severity: P0
    source: "Audit Check #26 live scan 2026-03-02"
    evidence: |
      Config class defined 19 times — highest count after ValidationResult.
      Primary location: cortex/models/dashboard_schema_pydantic.py (3 definitions in one file).
      Canonical home: cortex/config/ package.
    action_ref: "phase-111-a"
    status: OPEN

  - id: "GAP-111-03"
    title: "HealthCheckResult, CacheEntry, IntentType — each 9 definitions"
    severity: P0
    source: "Audit Check #26 live scan 2026-03-02"
    evidence: |
      HealthCheckResult: cortex/tools/dashboard_server.py, cortex/core/production_readiness_manager.py,
        cortex/core/wiring/health_check.py + 6 more
      CacheEntry: cortex/core/core_context_cache_layer.py, cortex/intelligence/provider.py,
        cortex/orchestrators/core/lens_context_provider.py + 6 more
      IntentType: cortex/core/intelligence_routing_engine.py, cortex/intelligence/intent_classifier.py,
        cortex/mcp/native_tool_gate.py + 6 more. Canonical: cortex/models/canonical_enums.py
    action_ref: "phase-111-b"
    status: OPEN

  - id: "GAP-111-04"
    title: "Challenge, DependencyGraph, ExecutionResult, RiskLevel — 6–7 definitions each"
    severity: P1
    source: "Audit Check #26 live scan 2026-03-02"
    evidence: |
      Challenge (7x), DependencyGraph (7x), ExecutionResult (6x), RiskLevel (6x)
      All have one clear canonical home in cortex/models/ or cortex/core/ but
      have been re-defined in orchestrator, intelligence, and mcp files.
    action_ref: "phase-111-b"
    status: OPEN

  - id: "GAP-111-05"
    title: "Remaining 250+ lower-count duplicates (2–5 per class name)"
    severity: P1
    source: "Audit Check #26 live scan 2026-03-02"
    evidence: |
      274 total duplicates - 4 top-group = ~270 remaining entries with 2–5 occurrences each.
      Full list generated by:
        python3 -c "import ast,pathlib,collections; ..." (see phase-111-a RED step)
    action_ref: "phase-111-c"
    status: OPEN

sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

sub_phases:

  - id: "phase-111-a"
    title: "TRIAGE — Generate canonical ownership map + write regression test baseline"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-111-01", "GAP-111-02"]
    depends_on: []
    tdd_cycle:
      red:
        action: "Write tests/core/test_no_duplicate_classes.py: AST-scan cortex/ and
          assert len(duplicates) == 0. This test MUST fail at entry (274 duplicates).
          Also write test_canonical_validation_result_import: assert
          `from cortex.models.canonical_enums import ValidationResult` resolves without
          AttributeError. Write test_canonical_intent_type_import for IntentType."
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — test_no_duplicate_classes FAILS with count=274"
        blocker: "No consolidation work until RED gate is confirmed"
      green:
        action: |
          Consolidate GAP-111-01 (ValidationResult) and GAP-111-02 (Config):
          1. Identify canonical file for each (cortex/models/canonical_enums.py for ValidationResult,
             cortex/config/__init__.py for Config)
          2. Delete all shadow definitions — keep only the canonical one
          3. Update all import statements across cortex/ to use canonical path
          4. Run `python3 -m ruff check cortex/ --select=F401 --fix` to clean orphaned imports
          5. Re-run AST scan — confirm ValidationResult drops to 1 occurrence, Config drops to 1
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — duplicate count reduced; canonical import tests PASS"
        blocker: "REFACTOR forbidden until GREEN gate passes"
      refactor:
        action: "Run ruff F811 check on affected files. Verify no circular imports introduced.
          Run make test-smoke to confirm no regressions from import rewrites."
        gate: "python3 scripts/run_tests.py dir tests/core/ — zero regressions"
        blocker: "sub-phase COMPLETE forbidden until gate passes"
    tdd_sequence:
      red:
        - "test_no_duplicate_classes_in_cortex_package"
        - "test_canonical_validation_result_import"
        - "test_canonical_config_import"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/core/"
      min_tests_pass: 3
      zero_new_failures: true
      all_gap_refs_closed: false
      blocks_next_sub_phase: true

  - id: "phase-111-b"
    title: "GREEN — Consolidate P0 duplicates: HealthCheckResult, CacheEntry, IntentType, Challenge, DependencyGraph, ExecutionResult, RiskLevel"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-111-03", "GAP-111-04"]
    depends_on: ["phase-111-a"]
    tdd_cycle:
      red:
        action: "Write import-resolution tests for each of the 7 classes:
          test_canonical_health_check_result_import, test_canonical_cache_entry_import,
          test_canonical_intent_type_import, test_canonical_challenge_import,
          test_canonical_dependency_graph_import, test_canonical_execution_result_import,
          test_canonical_risk_level_import — each asserting the canonical path resolves."
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — tests for these 7 classes FAIL (multiple definitions still present)"
        blocker: "Consolidation forbidden until RED gate passes"
      green:
        action: |
          For each class, apply the consolidation pattern:
            HealthCheckResult → cortex/core/wiring/health_check.py (canonical)
            CacheEntry        → cortex/intelligence/provider.py (canonical)
            IntentType        → cortex/models/canonical_enums.py (canonical)
            Challenge         → cortex/models/plan_models.py (canonical)
            DependencyGraph   → cortex/intelligence/relationships/traversal.py (canonical)
            ExecutionResult   → cortex/core/orchestrator_base.py (canonical)
            RiskLevel         → cortex/models/canonical_enums.py (canonical)
          Steps per class: delete shadow definitions → update all imports → verify AST scan drops to 1
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — 7 canonical import tests PASS; AST scan duplicate count reduced by ≥36"
        blocker: "REFACTOR step forbidden until GREEN gate passes"
      refactor:
        action: "Run ruff F811 + F401 on all touched files. Run make test-smoke."
        gate: "python3 scripts/run_tests.py smoke — zero regressions"
        blocker: "sub-phase COMPLETE forbidden until gate passes"
    tdd_sequence:
      red:
        - "test_canonical_health_check_result_import"
        - "test_canonical_cache_entry_import"
        - "test_canonical_intent_type_import"
        - "test_canonical_challenge_import"
        - "test_canonical_dependency_graph_import"
        - "test_canonical_execution_result_import"
        - "test_canonical_risk_level_import"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 18085
      zero_new_failures: true
      all_gap_refs_closed: false
      blocks_next_sub_phase: true

  - id: "phase-111-c"
    title: "GREEN — Sweep remaining 2–5× duplicates to reach DUPLICATES=0"
    priority: P1
    status: PLANNED
    gap_refs: ["GAP-111-05"]
    depends_on: ["phase-111-b"]
    tdd_cycle:
      red:
        action: "Re-run AST scan after phase-111-b. Capture remaining duplicate list.
          test_no_duplicate_classes_in_cortex_package must still be failing (count > 0).
          Document exact remaining count at start of this sub-phase."
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — FAILS with remaining count > 0"
        blocker: "Do not proceed until remaining count is documented"
      green:
        action: |
          Process remaining duplicates in batches of 10 by canonical home:
          - cortex/models/ group: all enum/status/result types → canonical_enums.py
          - cortex/core/ group: all infrastructure types → respective core modules
          - cortex/intelligence/ group: all intelligence types → respective intelligence modules
          After each batch: re-run AST scan to confirm count decreasing.
          Continue until AST scan returns DUPLICATES=0.
        gate: "python3 scripts/run_tests.py file tests/core/test_no_duplicate_classes.py
          — test PASSES (DUPLICATES=0)"
        blocker: "REFACTOR forbidden until GREEN gate passes with DUPLICATES=0"
      refactor:
        action: "Run python3 -m ruff check cortex/ --select=F811,F401 — must return
          'All checks passed!'. Run make test-smoke."
        gate: "python3 scripts/run_tests.py smoke — zero regressions; ruff F811=0"
        blocker: "sub-phase COMPLETE forbidden until both gates pass"
    tdd_sequence:
      red:
        - "test_no_duplicate_classes_in_cortex_package"
      green:
        - "test_no_duplicate_classes_in_cortex_package (must PASS at DUPLICATES=0)"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 18085
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  - id: "phase-111-final"
    title: "Smoke Gate + CORE-064 Sweep Close + cortex-master.yaml update"
    priority: P0
    status: PLANNED
    gap_refs: []
    depends_on: ["phase-111-c"]
    prerequisite: "ALL preceding sub-phase completion_gates PASSED; ruff F811=0"
    regression_gate: "python3 scripts/run_tests.py smoke — ≥18085 tests pass"
    tdd_cycle:
      red:
        action: "N/A — verification gate only"
        gate: "All GAP-111-01 through GAP-111-05 verified CLOSED; DUPLICATES=0"
        blocker: "Do NOT run smoke gate if any GAP remains OPEN"
      green:
        action: "Run full smoke gate — confirm ≥18085 tests pass with zero regressions"
        gate: "python3 scripts/run_tests.py smoke"
        blocker: "Do NOT mark phase COMPLETE if smoke gate fails"
      refactor:
        action: "Update phase YAML: move planned/ → completed/. Update cortex-master.yaml
          status → COMPLETE. Verify cortex-master.yaml ≤500 lines and YAML valid."
        gate: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml')); print('YAML valid')\""
        blocker: "Do NOT close phase without cortex-master.yaml update"
    acceptance_criteria:
      - "python3 AST scan returns DUPLICATES=0 across all cortex/ source files ✅"
      - "python3 -m ruff check cortex/ --select=F811 returns 'All checks passed!' ✅"
      - "test_no_duplicate_classes_in_cortex_package PASSES ✅"
      - "ALL GAP-111-* entries status: CLOSED ✅"
      - "python3 scripts/run_tests.py smoke passes ≥18085 tests ✅"
      - "Zero new test failures vs baseline ✅"
      - "phase-111 detail file moved: planned/ → completed/ ✅"
      - "cortex-master.yaml entry updated to status: COMPLETE ✅"
      - "cortex-master.yaml remains ≤500 lines ✅"
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: 18085
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: false

ac_markers:
  start: "AC_START: AC-111-DUPLICATE-SWEEP-{timestamp}"
  complete: "AC_COMPLETE: AC-111-DUPLICATE-SWEEP-{timestamp} ✅"
