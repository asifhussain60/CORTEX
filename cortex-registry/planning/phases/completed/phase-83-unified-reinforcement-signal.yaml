id: "phase-83"
title: "Unified Reinforcement Signal (URS) — Closed-Loop Learning Across All Orchestrators"
version: "1.0"
created: "2026-02-26"
status: PLANNED
priority: P0
governance_authority:
  - CORE-008  # TDD mandatory — tests before implementation
  - CORE-011  # Type hints on all functions
  - CORE-012  # Docstrings on all public APIs
  - CORE-028  # File naming: snake_case only
  - CORE-035  # Single canonical implementation — no duplicates
  - CORE-049  # Silent autonomous execution
  - CORE-064  # Sweep Completeness Contract — no partial sweeps
sweep_catalogue_id: "SWEEP-83-UNIFIED-REINFORCEMENT-SIGNAL"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists, what triggered it
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: Chat session 2026-02-26 — user request for reward/punishment scoring
  mechanism in cortex-trainer.prompt.md, expanded to entire CORTEX architecture
  after challenge-first analysis.

  Root problem: CORTEX has all the neural components of a self-improving system
  but operates OPEN-LOOP. The learning infrastructure captures patterns
  (UniversalLearningLoop, OPJMixin, EffectivenessAnalyzer, PatternExtractor,
  KnowledgeMerger) but never receives FEEDBACK about whether those patterns
  actually improved outcomes. The TrainerOrchestrator proposes template changes
  but has no mechanism to score whether those proposals helped or hurt.

  Evidence of the gap:
    1. UniversalLearningLoop.capture_from_operation() stores patterns but
       capture confidence is STATIC — initial assignment, never updated.
    2. EffectivenessAnalyzer tracks applications but has NO decay/promote
       methods — stale patterns persist indefinitely at original confidence.
    3. TrainerOrchestrator.execute_proposal() returns status but never feeds
       execution outcomes back to learning. Open-loop.
    4. OPJMixin records success/failure to YAML but doesn't propagate signals
       to adjust confidence scores in the learning loop.
    5. UniversalLearningLoop has ZERO MCP exposure — the learning brain is
       invisible to users in Copilot Chat.
    6. Governance outcomes (P0 violations fixed, test regressions caused by
       suggestions) are not fed back as reinforcement signals.
    7. IntelligenceMatrixBuilder (Phase 65/66) computes coverage scores but
       doesn't receive reward signals when coverage improves.
    8. KnowledgeSynthesisEngine produces instructions but has no feedback
       channel to learn which instructions were effective vs ignored.
    9. TestValueScorer assigns static severity/likelihood but doesn't learn
       from actual production bug rates to recalibrate weights.
   10. LENS analyzers produce analysis but don't track whether their insights
       led to successful operations (e.g., AST analysis → correct refactor).

  Architecture decision: NOT a new orchestrator. Extend 3 existing components
  and add 1 new MCP tool. The URS is a cross-cutting signal protocol, not a
  new entity — consistent with Phase 58 OrchestratorProtocolMixin patterns.

  Score at entry: 0/10 (capability does not exist)
  Target score: 8/10 (closed-loop learning with MCP visibility)
  Baseline measurements:
    - Smoke tests: 1,443+ passed
    - UniversalLearningLoop: capture-only, no reinforcement
    - EffectivenessAnalyzer: tracking-only, no decay/promote
    - TrainerOrchestrator: open-loop execution
    - MCP exposure for learning: 0 tools
  Git prerequisite: CORTEX branch, all 82 phases COMPLETE

  Landscape integration points (10 domains):
    ┌─────────────────────────────────────────────────────────────────────┐
    │ DOMAIN               │ INTEGRATION SURFACE              │ SIGNAL  │
    ├───────────────────────┼──────────────────────────────────┼─────────┤
    │ 1. TrainerOrchestrator│ score_proposal() post-execution  │ ±1.0    │
    │ 2. TDDOrchestrator    │ RED→GREEN→REFACTOR outcomes      │ ±0.5    │
    │ 3. EnforcementOrch    │ Pre-commit CORE rule pass/fail   │ ±0.3    │
    │ 4. AuditOrchestrator  │ /audit fix P0/P1 counts → signal │ ±0.5    │
    │ 5. RefactoringOrch    │ Scorecard improvement deltas     │ ±0.5    │
    │ 6. OPJ (Phase 52)    │ OPJ pattern success_rate field   │ ±0.3    │
    │ 7. KnowledgeSynthesis │ Instruction effectiveness track  │ ±0.3    │
    │ 8. IntelligenceMatrix │ Coverage improvement signals     │ ±0.3    │
    │ 9. LENS Pipeline      │ Analysis→outcome correlation     │ ±0.2    │
    │ 10. TestValueScorer   │ Predicted vs actual bug severity │ ±0.3    │
    └─────────────────────────────────────────────────────────────────────┘

# ─────────────────────────────────────────────────────────────────────────────
# SCORING MODEL — the core of URS
# ─────────────────────────────────────────────────────────────────────────────
scoring_model:
  description: |
    The Unified Reinforcement Signal (URS) is a 5-level scoring system that
    propagates success/failure signals from execution outcomes back into the
    learning loop to adjust pattern confidence scores.

  signals:
    - name: STRONG_REWARD
      score: +1.0
      trigger: "Proposal executed → all tests pass → zero regressions → quality improvement"
      examples:
        - "Trainer CREATE template → smoke tests green"
        - "TDD cycle completes → coverage increases"
        - "/audit fix → P0 count drops to 0"

    - name: MILD_REWARD
      score: +0.5
      trigger: "Pattern applied → measurable improvement but some caveats"
      examples:
        - "Refactoring scorecard improves but new linting warnings"
        - "Knowledge instruction used but required minor adaptation"
        - "LENS analysis correctly identified root cause"

    - name: NEUTRAL
      score: 0.0
      trigger: "No measurable change from pattern application"
      examples:
        - "Template created but never used in any workflow"
        - "OPJ pattern recorded but no follow-up invocations"

    - name: MILD_PUNISHMENT
      score: -0.5
      trigger: "Pattern applied → partial regression or quality decrease"
      examples:
        - "Learned pattern → 2 test regressions (non-blocking)"
        - "Knowledge instruction produced suboptimal result"
        - "LENS analysis missed relevant files"

    - name: STRONG_PUNISHMENT
      score: -1.0
      trigger: "Pattern application required rollback or caused blocking failure"
      examples:
        - "Trainer CREATE → broke wiring contract → reverted"
        - "TDD cycle → implementation causes P0 governance violation"
        - "Refactoring suggestion → 5+ test regressions"

  confidence_rules:
    promote:
      threshold: 0.9
      min_applications: 3
      action: "Promote to cortex-registry/knowledge/ (permanent knowledge)"
    quarantine:
      threshold: 0.3
      min_punishments: 2
      action: "Flag for human review, stop auto-applying"
    decay:
      period_days: 30
      amount: 0.1
      action: "Reduce confidence by 0.1 per 30-day idle period"
    cross_cutting_boost:
      min_orchestrators: 3
      boost: 0.15
      action: "Boost confidence when pattern validated across 3+ orchestrators"

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — all must be CLOSED before COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-83-01"
    title: "UniversalLearningLoop has no reinforcement_signal() method — confidence is static"
    severity: P0
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/intelligence/learning/universal_learning_loop.py:
        - capture_pattern() sets confidence at capture time (line ~123)
        - capture_from_operation() delegates to PatternExtractor (line ~155)
        - No method to UPDATE confidence post-capture
        - Confidence never changes after initial assignment
      cortex/orchestrators/validation/confidence_scorer.py:
        - score_learnings() exists but only READS confidence, never WRITES back
    action_ref: "phase-83-a"
    status: OPEN

  - id: "GAP-83-02"
    title: "EffectivenessAnalyzer has no decay_stale_patterns() or promote_high_confidence() methods"
    severity: P0
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/intelligence/learning/effectiveness_analyzer.py:
        - PatternApplication tracks success/failure (line ~42)
        - EffectivenessMetrics computes success_rate (line ~65)
        - No method to DECAY patterns with no recent applications
        - No method to PROMOTE patterns above confidence threshold
        - 314 lines but zero write-back capability
    action_ref: "phase-83-a"
    status: OPEN

  - id: "GAP-83-03"
    title: "TrainerOrchestrator.execute_proposal() is open-loop — no outcome feedback"
    severity: P0
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/orchestrators/intelligence/trainer_orchestrator.py:
        - execute_proposal() returns {status, executed, skipped, errors} (line ~445)
        - No call to learning loop after execution
        - No score_proposal() method to evaluate proposal effectiveness
        - Proposals succeed or fail with no learning from the outcome
    action_ref: "phase-83-b"
    status: OPEN

  - id: "GAP-83-04"
    title: "UniversalLearningLoop has zero MCP exposure — brain's learning is invisible"
    severity: P0
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/mcp/tools/__init__.py:
        - ALL_TOOLS list has 36 class-based tools
        - No CortexLearning or cortex_learning tool exists
        - Users cannot query learning metrics via Copilot Chat
        - Users cannot trigger reinforcement signals via MCP
      grep -rn "cortex_learning" cortex/mcp/ → 0 results
    action_ref: "phase-83-c"
    status: OPEN

  - id: "GAP-83-05"
    title: "OPJMixin records success/failure but doesn't propagate signals to learning loop"
    severity: P1
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/intelligence/learning/opj_mixin.py:
        - record_pattern() writes to YAML journal
        - No import of UniversalLearningLoop
        - No call to reinforcement_signal() (doesn't exist yet)
      OPJ operates in isolation from the confidence scoring system.
      3 orchestrators wired (Master, TDD, Enforcement) — none feed back.
    action_ref: "phase-83-d"
    status: OPEN

  - id: "GAP-83-06"
    title: "TDDOrchestrator RED→GREEN→REFACTOR outcomes not fed as reinforcement signals"
    severity: P1
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/orchestrators/core/tdd_orchestrator.py:
        - Inherits OPJMixin (line 283)
        - TDD cycles complete but cycle success/failure not fed to learning loop
        - Green-on-first-try vs multiple-retries is valuable signal data
      Every TDD cycle is a natural reinforcement opportunity (pass=reward, fail=punish).
    action_ref: "phase-83-d"
    status: OPEN

  - id: "GAP-83-07"
    title: "EnforcementOrchestrator governance pass/fail not fed as reinforcement signals"
    severity: P1
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/orchestrators/core/enforcement_orchestrator.py:
        - Inherits OPJMixin (line 1246)
        - Pre-commit validation produces P0/P1/P2 counts
        - These counts are not propagated to learning loop confidence
      Pattern: code change that passes governance = reward; violation = punish.
    action_ref: "phase-83-d"
    status: OPEN

  - id: "GAP-83-08"
    title: "TestValueScorer uses static severity/likelihood — never recalibrates from actuals"
    severity: P2
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/orchestrators/intelligence/orch_test_value_scorer.py:
        - IssueSeverity enum is static (CRITICAL=100, HIGH=75, etc.)
        - ScenarioLikelihood enum is static
        - No feedback loop from actual bug rates to recalibrate weights
      Formula: (Severity × 0.4) + (Likelihood × 0.3) + (Gap × 0.3)
      Weights are hardcoded — could be self-tuning with reinforcement data.
    action_ref: "phase-83-e"
    status: OPEN

  - id: "GAP-83-09"
    title: "KnowledgeSynthesisEngine has no feedback channel for instruction effectiveness"
    severity: P2
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/intelligence/knowledge/knowledge_synthesis_engine.py:
        - 1,363 lines of knowledge composition logic
        - Produces SynthesizedInstruction with synthesis_confidence
        - No callback or signal when instruction is applied successfully/unsuccessfully
        - No method to track which instructions were used vs ignored
    action_ref: "phase-83-e"
    status: OPEN

  - id: "GAP-83-10"
    title: "IntelligenceMatrix coverage scores are static — no reward on coverage improvement"
    severity: P2
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/intelligence/cross_cutting/intelligence_matrix_builder.py:
        - IntelligenceCapability.current_coverage is set once (line ~79)
        - No method to update coverage_score based on actual improvements
        - When a gap is wired and coverage increases, no signal is emitted
    action_ref: "phase-83-e"
    status: OPEN

  - id: "GAP-83-11"
    title: "LENS analysis results not correlated with operation outcomes"
    severity: P2
    source: "Architecture audit 2026-02-26"
    evidence: |
      cortex/lens/ — 12 analyzers produce analysis
      cortex/orchestrators/core/interaction_orchestrator.py — consumes analysis
      No mechanism correlates "LENS said X" with "operation Y succeeded/failed"
      Missing: analysis_id tracking through execution to outcome.
    action_ref: "phase-83-e"
    status: OPEN

  - id: "GAP-83-12"
    title: "cortex-trainer.prompt.md has no documentation for URS scoring model"
    severity: P1
    source: "Architecture audit 2026-02-26"
    evidence: |
      .github/prompts/cortex-trainer.prompt.md:
        - Documents scan/propose/execute operations
        - No mention of scoring, reinforcement, feedback, or effectiveness
        - MCP tool section shows cortex_train ops but no score operation
    action_ref: "phase-83-f"
    status: OPEN

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT (MANDATORY — CORE-008 + CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true
  rationale: |
    URS is a cross-cutting capability. Sub-phases build on each other:
    Phase-83-a (core signal infrastructure) must exist before Phase-83-b
    (trainer wiring) can emit signals, which must exist before Phase-83-c
    (MCP exposure) can surface them to users.

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — 6 sub-phases, TDD-gated, ROI-ordered
# ─────────────────────────────────────────────────────────────────────────────
phases:

  # ── SUB-PHASE A: Core Signal Infrastructure ──────────────────────────────
  - id: "phase-83-a"
    title: "ReinforcementSignal protocol + learning loop integration + effectiveness decay/promote"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-83-01", "GAP-83-02"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥1,443 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    new_files:
      - path: "cortex/intelligence/learning/reinforcement_signal.py"
        description: |
          ReinforcementSignal dataclass (signal_type, score, source_orchestrator,
          pattern_id, context, timestamp). ReinforcementEngine class with
          emit_signal(), apply_to_learning(), get_signal_history().
          SignalType enum: STRONG_REWARD, MILD_REWARD, NEUTRAL, MILD_PUNISHMENT,
          STRONG_PUNISHMENT.
      - path: "tests/intelligence/learning/test_reinforcement_signal.py"
        description: "RED-phase tests for ReinforcementSignal + ReinforcementEngine"

    files_to_edit:
      - path: "cortex/intelligence/learning/universal_learning_loop.py"
        changes: |
          Add reinforcement_signal(pattern_id, signal_type, context) method.
          Updates confidence score on matching cached patterns.
          Delegates to EffectivenessAnalyzer for decay/promote evaluation.
          Add get_reinforcement_history() for MCP querying.
      - path: "cortex/intelligence/learning/effectiveness_analyzer.py"
        changes: |
          Add decay_stale_patterns(max_age_days=30, decay_amount=0.1) method.
          Add promote_high_confidence(threshold=0.9, min_apps=3) method.
          Add quarantine_low_confidence(threshold=0.3, min_punishments=2) method.
          All methods return lists of affected pattern IDs.
      - path: "cortex/intelligence/learning/__init__.py"
        changes: "Export ReinforcementSignal, ReinforcementEngine, SignalType"

    tdd_cycle:
      red:
        action: "Write ALL failing tests for reinforcement signal protocol"
        gate: "python3 scripts/run_tests.py file tests/intelligence/learning/test_reinforcement_signal.py — ALL tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails"
      green:
        action: "Implement ReinforcementSignal, ReinforcementEngine, learning loop integration"
        gate: "python3 scripts/run_tests.py file tests/intelligence/learning/test_reinforcement_signal.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints (CORE-011), docstrings (CORE-012), deduplication (CORE-035)"
        gate: "python3 scripts/run_tests.py dir tests/intelligence/learning/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_reinforcement_signal_dataclass_fields — SignalType enum has 5 values, dataclass has all required fields"
        - "test_reinforcement_engine_emit_signal — emit_signal() stores signal and returns signal_id"
        - "test_reinforcement_engine_apply_to_learning — apply_to_learning() updates confidence in learning loop"
        - "test_strong_reward_increases_confidence — +1.0 signal raises confidence by proportional amount"
        - "test_strong_punishment_decreases_confidence — -1.0 signal lowers confidence by proportional amount"
        - "test_confidence_clamped_0_to_1 — confidence never goes below 0.0 or above 1.0"
        - "test_learning_loop_reinforcement_signal_method — UniversalLearningLoop.reinforcement_signal() exists and delegates to engine"
        - "test_decay_stale_patterns — patterns with no signal for 30 days lose 0.1 confidence"
        - "test_promote_high_confidence — patterns with confidence ≥0.9 after 3+ rewards are flagged for promotion"
        - "test_quarantine_low_confidence — patterns with confidence ≤0.3 after 2+ punishments are quarantined"
        - "test_cross_cutting_boost — pattern validated across 3+ orchestrators gets +0.15 boost"
        - "test_signal_history_queryable — get_signal_history(pattern_id) returns chronological signal list"
      green:
        - "Implement ReinforcementSignal dataclass in reinforcement_signal.py"
        - "Implement ReinforcementEngine with emit_signal() and apply_to_learning()"
        - "Add reinforcement_signal() method to UniversalLearningLoop"
        - "Add decay_stale_patterns() to EffectivenessAnalyzer"
        - "Add promote_high_confidence() to EffectivenessAnalyzer"
        - "Add quarantine_low_confidence() to EffectivenessAnalyzer"
      refactor:
        - "Add docstrings to all public methods (CORE-012)"
        - "Verify type hints on all signatures (CORE-011)"
        - "Confirm no duplicate implementations exist (CORE-035)"
        - "Verify ReinforcementEngine is singleton-accessible like get_learning_loop()"

    acceptance_criteria:
      - "ReinforcementSignal dataclass importable from cortex.intelligence.learning"
      - "ReinforcementEngine.emit_signal() stores and returns signal_id"
      - "UniversalLearningLoop.reinforcement_signal() updates pattern confidence"
      - "EffectivenessAnalyzer.decay_stale_patterns() reduces stale pattern confidence"
      - "EffectivenessAnalyzer.promote_high_confidence() flags patterns for knowledge promotion"
      - "EffectivenessAnalyzer.quarantine_low_confidence() quarantines failing patterns"
      - "All 12 tdd_sequence.red tests GREEN"
      - "Zero regressions in tests/intelligence/learning/"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/intelligence/learning/"
      min_tests_pass: 12
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── SUB-PHASE B: Trainer Closed-Loop Wiring ──────────────────────────────
  - id: "phase-83-b"
    title: "Wire TrainerOrchestrator to emit reinforcement signals post-execution"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-83-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-83-a"]
    prerequisite: "phase-83-a completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    files_to_edit:
      - path: "cortex/orchestrators/intelligence/trainer_orchestrator.py"
        changes: |
          Add score_proposal(proposal, execution_result) method.
          After execute_proposal() completes, call score_proposal() to:
            - Map execution_result.status to SignalType
            - Emit reinforcement_signal for each action in proposal
            - Run smoke tests and emit additional signal based on regression count
          Wire _op_execute() to call score_proposal() after execution.
      - path: "tests/orchestrators/intelligence/test_trainer_reinforcement.py"
        description: "New test file for trainer reinforcement wiring"

    tdd_cycle:
      red:
        action: "Write failing tests for Trainer→URS integration"
        gate: "python3 scripts/run_tests.py file tests/orchestrators/intelligence/test_trainer_reinforcement.py — ALL tests FAIL"
        blocker: "Do NOT write implementation until all tests fail"
      green:
        action: "Implement score_proposal() and wire to _op_execute()"
        gate: "python3 scripts/run_tests.py file tests/orchestrators/intelligence/test_trainer_reinforcement.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints, docstrings, ensure no duplication with EffectivenessAnalyzer"
        gate: "python3 scripts/run_tests.py dir tests/orchestrators/intelligence/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_score_proposal_method_exists — TrainerOrchestrator.score_proposal() callable"
        - "test_score_success_emits_strong_reward — status='success' → STRONG_REWARD signal"
        - "test_score_partial_emits_mild_reward — status='partial' → MILD_REWARD signal"
        - "test_score_failed_emits_strong_punishment — status='failed' → STRONG_PUNISHMENT signal"
        - "test_execute_op_calls_score_proposal — _op_execute() calls score_proposal() after execution"
        - "test_per_action_signal_emission — one signal emitted per action in proposal"
        - "test_scoring_does_not_block_execution — score_proposal exceptions don't break execute flow"
      green:
        - "Add score_proposal() to TrainerOrchestrator"
        - "Map execution status to SignalType"
        - "Wire _op_execute() to call score_proposal()"
        - "Wrap scoring in try/except for resilience"
      refactor:
        - "Add docstrings (CORE-012)"
        - "Type hints (CORE-011)"

    acceptance_criteria:
      - "TrainerOrchestrator.score_proposal() emits reinforcement signals"
      - "Successful proposals increase pattern confidence"
      - "Failed proposals decrease pattern confidence"
      - "Scoring is resilient — exceptions don't break execution flow"
      - "All 7 tdd_sequence.red tests GREEN"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/orchestrators/intelligence/"
      min_tests_pass: 7
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── SUB-PHASE C: MCP Exposure — cortex_learning Tool ────────────────────
  - id: "phase-83-c"
    title: "cortex_learning MCP tool — expose learning brain to Copilot Chat"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-83-04"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-050, CORE-064"
    duration_estimate: "3 hours"
    depends_on: ["phase-83-b"]
    prerequisite: "phase-83-b completion_gate PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    new_files:
      - path: "cortex/mcp/tools/learning_tool.py"
        description: |
          cortex_learning MCP tool with operations:
            - metrics: Return learning metrics (total, by_orchestrator, cache)
            - signals: Return reinforcement signal history (filterable by pattern, orchestrator)
            - reinforce: Manually emit a reinforcement signal (human-in-the-loop)
            - promote: Trigger confidence promotion check
            - decay: Trigger staleness decay sweep
            - health: Return URS health summary (promote/quarantine/decay counts)
      - path: "tests/unit/mcp/tools/test_learning_tool.py"
        description: "RED-phase tests for cortex_learning MCP tool"

    files_to_edit:
      - path: "cortex/mcp/tools/__init__.py"
        changes: |
          Import CortexLearning from learning_tool.py.
          Add to ALL_TOOLS list.
          Add to __all__ exports.
          Update header comment: 36 → 37 tools.
      - path: "cortex/mcp/tools/intelligence.py"
        changes: "Import and re-export CortexLearning if intelligence module aggregates tools"

    tdd_cycle:
      red:
        action: "Write failing tests for cortex_learning MCP tool"
        gate: "python3 scripts/run_tests.py file tests/unit/mcp/tools/test_learning_tool.py — ALL tests FAIL"
        blocker: "Do NOT write implementation until all tests fail"
      green:
        action: "Implement CortexLearning tool class with all 6 operations"
        gate: "python3 scripts/run_tests.py file tests/unit/mcp/tools/test_learning_tool.py — ALL tests PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Type hints, docstrings, tool definition schema, CORE-050 compliance"
        gate: "python3 scripts/run_tests.py dir tests/unit/mcp/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_cortex_learning_importable — CortexLearning importable from cortex.mcp.tools"
        - "test_metrics_operation — op='metrics' returns learning metrics dict"
