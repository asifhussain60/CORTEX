  Three thin/orphaned packages exist alongside their canonical equivalents:
  
  1. cortex/enforcement/ (2 files) — proxy to cortex/governance/enforcement/ (28 files)
     Current: cortex/enforcement/__init__.py just re-exports from cortex/governance/enforcement/
     Fix: Make cortex/enforcement/ a pure shim pointing to cortex/governance/
  
  2. cortex/config/ (3 files) — config utilities used by exactly 1 caller
     Current: cortex/config/ has architecture_constants.py, cortex_config.py, feature_flags.py
     Fix: Merge into cortex/core/config/ or keep as-is with clear purpose statement
  
  3. cortex/secrets/ (2 files) — proxy to cortex/infrastructure/secrets/ (18 files)
     Current: cortex/secrets/__init__.py just re-exports from cortex.infrastructure.secrets
     Fix: Already a clean shim — document this pattern; it's intentional for API ergonomics

