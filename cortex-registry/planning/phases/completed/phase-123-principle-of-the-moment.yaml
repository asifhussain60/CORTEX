# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: _workspaces/recommendations/copilot-review.md — 11-phase proposal digested
  and challenged against live architecture (2026-03-04). Of the 11 proposed phases,
  8 address systems already completed in Phases 85–122. The only genuine gap is:
  the quote/principle selection in atom-quote.yaml is DETERMINISTIC (first-match),
  which means the same quote can repeat across consecutive responses in the same
  intent category. There is no anti-repetition memory, no weighted entropy, and no
  telemetry on selection latency or repetition avoidance.

  Architecture fit: The fix is ADDITIVE to the existing LEGO atom. No orchestrator
  wiring changes. No composition changes. No regression risk to the 2,395 green tests.

  Baseline at entry:
    - Smoke tests: 2,395 passed (Phase 122 baseline)
    - Preflight: 258 passed
    - atom-quote.yaml: 32 quotes, 10 themes, deterministic first-match selection
    - No dedup_key field, no memory ring buffer, no telemetry
    - cortex-master.yaml: 406 lines (well under 800 ceiling)

  Git prerequisite: branch CORTEX, all Phase 122 changes committed.

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064 — all must be CLOSED before COMPLETE)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-123-01"
    title: "Deterministic first-match selection causes quote repetition within a session"
    severity: P2
    source: "DIGEST _workspaces/recommendations/copilot-review.md Phase 3 analysis"
    evidence: |
      atom-quote.yaml line 50–70: theme_map maps intent → theme (correct).
      atom-quote.yaml validation.quote_selection = "deterministic — match theme_map[intent_type]
      then select by session context". No dedup_key, no ring buffer, no weighted random.
      Result: IMPLEMENT intent always resolves to theme 'quality', which has 4 quotes —
      first-match always returns "Quality is not an act, it is a habit." (Aristotle).
      In a session with repeated IMPLEMENT turns, same quote appears every time.
    action_ref: "phase-123-a"
    status: OPEN

  - id: "GAP-123-02"
    title: "No anti-repetition memory — dedup_key and ring buffer absent"
    severity: P2
    source: "DIGEST _workspaces/recommendations/copilot-review.md Phase 3 analysis"
    evidence: |
      PrincipleSelector (does not yet exist) needs:
        - dedup_key per quote (unique string id — e.g. "aristotle-quality-habit")
        - in-memory ring buffer of last N=10 used dedup_keys
        - Selection MUST skip quotes whose dedup_key is in the ring buffer
        - Weighted random within theme-filtered, dedup-filtered candidates
      Currently: no PrincipleSelector class exists. Selection logic is implicit
      (described in YAML validation field only — not enforced in code).
    action_ref: "phase-123-a"
    status: OPEN

  - id: "GAP-123-03"
    title: "No telemetry on quote selection latency or repetition avoidance rate"
    severity: P2
    source: "DIGEST _workspaces/recommendations/copilot-review.md Phase 3 analysis"
    evidence: |
      Proposal requires:
        - quote_selection_latency_ms: p95 ≤ 3ms, p99 ≤ 8ms
        - quote_repeat_avoided_count: monotonic counter per session
      No instrumentation exists. cortex_capture_metrics MCP tool is available as
      the emission target (already registered in mcp_registry.py).
      SSOT for metric emission: cortex/mcp/tools/ (cortex_capture_metrics).
    action_ref: "phase-123-b"
    status: OPEN

