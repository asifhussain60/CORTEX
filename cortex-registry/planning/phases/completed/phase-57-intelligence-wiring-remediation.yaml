  - "57-e: ImportError sweep — independent, run after 57-a to use full synthesis"
  - "57-f: Memory + reasoning — lowest risk, runs last"

dependencies:
  - "57-a must complete before 57-c (synthesis quality needed for LENS integration tests)"
  - "57-b must complete before 57-c (IntelligenceOrchestrator needs OrchestratorProtocolMixin)"
  - "57-d and 57-e are independent — can parallel with 57-c"
  - "57-f is fully independent — parallel with 57-d and 57-e"

