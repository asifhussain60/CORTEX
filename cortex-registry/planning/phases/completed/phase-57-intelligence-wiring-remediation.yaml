  - "57-a: INDEX path (P0) — unblocks synthesis quality for all subsequent phases"
  - "57-b: Protocol compliance — completes the wired-bare sweep started in Phase 13"
  - "57-c: LENS wiring — depends on 57-b (IntelligenceOrchestrator needs mixin first)"
