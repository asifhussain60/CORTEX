            - test_check29_passes_clean_workspace: assert 0 violations on valid setup
            - test_validate_production_no_file_output: assert no .json file written

    tdd_cycle:
      red:
        action: "Write tests/golden/production/test_check29_security_monitoring_golden.py — 4 tests, FAIL"
        gate: "python3 -m pytest tests/golden/production/test_check29_security_monitoring_golden.py -p no:xdist -- ALL FAIL"
        blocker: "Do NOT add Check #29 until all 4 tests fail"
      green:
