# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: CORTEX Architect chat session 2026-03-02 — two-turn analysis.
  Score at entry: architecture completeness 7.5/10.
  Target score: 9.5/10.

  Baseline measurements:
    - Smoke tests: 1,950 passed (Phase 104 baseline)
    - Golden tests: 222 files in tests/golden/
    - Regression tests: 2 files in tests/regression/
    - Audit-fix pipeline: 28-point scan, 9 stages
    - RCA Engine: 4 methodologies, 121 GREEN tests (Phase 87)

  Problem identified (3 disconnected islands):
    1. Audit-fix fixes SYMPTOMS — detect→fix→rescan converges to zero P0/P1,
       but generates no regression guard tests to prevent recurrence.
    2. RCA Engine (Phase 87) sits idle — pattern_detection SQL in audit-fix
       surfaces recurring P0s inline but never dispatches RCAEngine.analyze().
       PreventionRules are never generated from audit violations.
    3. Stage 9 test gate runs PREFLIGHT ONLY (~40 wiring tests) — golden tests
       (222 files) and regression tests are never run during audit-fix. Auto-fixes
       could silently break golden contracts.
    4. Production validator (validate-production.py + GovernanceValidator) is
       ORPHANED — not called by audit-fix pipeline; checks stale packages
       (fastapi, uvicorn for stdio MCP); writes JSON report file (CORE-002
       violation); duplicates 28-point scan logic (CORE-035 violation).
    5. No formal CERTIFICATION GATE — audit exits with exit_status="clean" in
       SQLite but no composite proof tying together: audit result, test results,
       RCA state, git SHA, readiness score. No MCP-queryable certification status.

  Git prerequisite: CORTEX branch, smoke tests GREEN.

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE — CORE-064: every gap must be CLOSED before COMPLETE
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:

  - id: "GAP-106-01"
    title: "No regression guard test generation on audit auto-fix"
    severity: P1
    source: "CORTEX Architect session 2026-03-02 (turn 1)"
    evidence: |
      audit-fix-pipeline.yaml Stage 7-8: fix_step.on_success has no hook.
      tests/regression/guards/ directory does not exist.
      Pattern: fix_step → auto_remediate() → no downstream test generation.
      Result: the same violation (e.g. stale import in cortex/X.py) can recur
      in the next session because no guard test prevents it.
    action_ref: "phase-106-a"
    status: CLOSED

  - id: "GAP-106-02"
    title: "RCA Engine never dispatched from audit-fix pattern_detection"
