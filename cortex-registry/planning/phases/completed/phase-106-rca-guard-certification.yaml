# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT
# ─────────────────────────────────────────────────────────────────────────────
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL
  partial_completion_allowed: false
  decomposition_allowed: false
  phase_atomic: true
  gate_on_failure: HALT
  tdd_cycle_mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — ROI-ordered, TDD-gated
# ─────────────────────────────────────────────────────────────────────────────
phases:

  # ── Sub-phase A: Regression Guard Generator ─────────────────────────────────
  - id: "phase-106-a"
    title: "Regression Guard Generator — primitive + tests/regression/guards/"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-106-01"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-064"
    duration_estimate: "2 hours"
    depends_on: []
    prerequisite: "smoke tests GREEN (≥1,950 baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    description: |
      Create the regression guard generator primitive and the guard test directory.
      After each successful auto-fix in the audit-fix Stage 7-8 convergence loop,
      a thin assertion test is generated at tests/regression/guards/ that
      re-executes the fix's detect command and asserts zero matches.
      This makes the "fix" self-defending: future audit runs catch recurrence
      before Stage 2 even completes its scan.

    deliverables:
      - path: "cortex-registry/workflows/templates/primitives/testing/regression-guard-generator.yaml"
        description: |
          New Tier-1 primitive. Parameters: rule_id, detect_command, fix_description,
          guard_test_path. Generates a Python test file from template. Wired into
          audit-fix-pipeline.yaml Stage 7-8 fix_step.on_success hook.
      - path: "tests/regression/guards/__init__.py"
        description: "Package init for generated guard tests."
      - path: "tests/regression/guards/.gitkeep"
        description: "Preserve directory in git (generated tests are committed)."
      - path: "tests/golden/production/test_regression_guard_generator_golden.py"
        description: "Golden test: guard file is generated with correct assertion structure."

    tdd_cycle:
      red:
        action: |
          Write tests/golden/production/test_regression_guard_generator_golden.py:
            - test_guard_file_generated_for_rule_id: assert guard file created at expected path
            - test_guard_file_contains_detect_command: assert detect command embedded in guard
            - test_guard_file_is_valid_python: assert generated file parses without SyntaxError
            - test_guard_file_has_correct_test_name: assert test function name includes rule_id
        gate: "python3 -m pytest tests/golden/production/test_regression_guard_generator_golden.py -p no:xdist -- ALL must FAIL (ImportError)"
        blocker: "Do NOT write primitive until all 4 tests fail"
      green:
        action: |
          Create regression-guard-generator.yaml primitive.
          Create Python guard template embedded in primitive (inline Jinja2-style).
          Wire into audit-fix-pipeline.yaml Stage 7-8 fix_step.on_success:
            - For each fix_log entry with issues_fixed > 0:
              instantiate regression-guard-generator with {rule_id, detect_command}
              write guard test to tests/regression/guards/test_guard_{rule_id}.py
        gate: "python3 -m pytest tests/golden/production/test_regression_guard_generator_golden.py -p no:xdist -- ALL must PASS"
        blocker: "Do NOT begin REFACTOR until 4/4 pass"
      refactor:
        action: |
          Type hints (CORE-011), docstrings (CORE-012).
          Ensure guard test template is idempotent (overwrite same rule_id safely).
          Add guard test to test-tier-manifest.yaml T1_smoke test_dirs.
        gate: "python3 scripts/run_tests.py smoke — zero regressions"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + cortex_validate op=compliance"
      fix_step: "Apply targeted fixes for each issue found in rescan"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3

    completion_gate:
      - "4/4 golden tests GREEN: test_regression_guard_generator_golden.py"
      - "tests/regression/guards/ directory exists with __init__.py"
      - "regression-guard-generator.yaml primitive committed"
      - "audit-fix-pipeline.yaml Stage 7-8 has fix_step.on_success hook"
      - "GAP-106-01 status: CLOSED"

  # ── Sub-phase B: RCA Dispatch from Pattern Detection ─────────────────────────
  - id: "phase-106-b"
    title: "RCA Dispatch Wiring — pattern_detection → RCAEngine → PreventionRule"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-106-02", "GAP-106-06"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-106-a"]
    prerequisite: "phase-106-a COMPLETE"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    description: |
      Wire the existing RCAEngine (Phase 87, 121 GREEN tests) into the audit-fix
      Stage 9 post_run. When pattern_detection SQL returns rows (recurrence_count
      ≥3), dispatch RCAEngine.analyze() per recurring violation, persist the
      resulting PreventionRule to rca_store.db, then surface the rule inline.
      Wire Stage 2 detect_step to consult prevention_rules: elevate known
      recurring violations from P1 → P0 before the scan begins.

    deliverables:
      - path: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
        description: |
          Stage 9 post_run: add rca_dispatch block after pattern_detection.
          Stage 2 detect_step: add prevention_rules_lookup before scan.
          Both are YAML-only changes — no Python code changes.
      - path: "tests/golden/production/test_rca_audit_wiring_golden.py"
        description: |
          Golden tests for RCA dispatch wiring:
            - test_rca_dispatched_for_recurring_violation: assert analyze() called
            - test_prevention_rule_persisted: assert rule in rca_store.db
            - test_known_violation_elevated_to_p0: assert P1→P0 escalation
            - test_rca_inline_output_not_file: assert no .md/.txt created (CORE-002)

    tdd_cycle:
      red:
        action: "Write tests/golden/production/test_rca_audit_wiring_golden.py — 4 tests, all FAIL"
        gate: "python3 -m pytest tests/golden/production/test_rca_audit_wiring_golden.py -p no:xdist -- ALL FAIL"
        blocker: "Do NOT wire until all 4 tests fail"
      green:
        action: |
          Update audit-fix-pipeline.yaml Stage 9 post_run:
            rca_dispatch:
              trigger: pattern_detection returns recurrence_count >= 3
              for_each_violation:
                action: RCAEngine.analyze(failure_id=rule_id, symptom=description, category=TECHNOLOGY)
                persist: rca_store.persist(rca_analysis)
                emit_inline: "🔬 RCA: {root_cause} → PreventionRule {rule_id} (ADVISORY)"
          Update audit-fix-pipeline.yaml Stage 2 detect_step:
            prevention_rules_lookup:
              query: SELECT rule_id FROM prevention_rules WHERE gate_level >= WARNING
              action: elevate_severity(matched_violations, P0)
        gate: "python3 -m pytest tests/golden/production/test_rca_audit_wiring_golden.py -p no:xdist -- 4/4 PASS"
        blocker: "Do NOT REFACTOR until 4/4 pass"
      refactor:
        action: "Verify RCA category auto-selection (TECHNOLOGY→Five-Whys for code violations). Docstrings."
        gate: "python3 scripts/run_tests.py smoke — zero regressions"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + cortex_validate op=compliance"
      fix_step: "Apply targeted fixes"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3

    completion_gate:
      - "4/4 golden tests GREEN: test_rca_audit_wiring_golden.py"
      - "audit-fix-pipeline.yaml Stage 9 has rca_dispatch block"
      - "audit-fix-pipeline.yaml Stage 2 has prevention_rules_lookup"
      - "GAP-106-02 status: CLOSED"
      - "GAP-106-06 status: CLOSED"

  # ── Sub-phase C: Stage 9 Test Tier Upgrade ────────────────────────────────────
  - id: "phase-106-c"
    title: "Stage 9 Test Tier Upgrade — preflight → smoke (golden + regression coverage)"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-106-03"]
    governance_authority: "CORE-008, CORE-064, CORE-068"
    duration_estimate: "1 hour"
    depends_on: ["phase-106-b"]
    prerequisite: "phase-106-b COMPLETE"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    description: |
      Change audit-fix-pipeline.yaml Stage 9 test command from:
        python3 scripts/run_tests.py preflight  (~40 wiring tests)
      to:
        python3 scripts/run_tests.py smoke      (~150 tests: preflight + golden + core)
      Update test-tier-manifest.yaml to reflect Stage 9 now uses T1_smoke.
      Update cortex-meta-auditor.md references and any agents referencing Stage 9.
      This ensures auto-fixes in Stage 7-8 cannot silently break golden contracts.

    deliverables:
      - path: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
        description: "Stage 9 command: preflight → smoke."
      - path: "cortex-registry/workflows/templates/testing/test-tier-manifest.yaml"
        description: "Stage 9 used_by entry: tier T0_preflight → T1_smoke."
      - path: "tests/golden/workflow/test_audit_stage9_tier_golden.py"
        description: |
          Golden test: assert Stage 9 config uses T1_smoke not T0_preflight.
            - test_stage_9_uses_smoke_tier: parse pipeline YAML, assert command contains "smoke"
            - test_stage_9_includes_golden_dirs: assert test-tier-manifest T1_smoke has tests/golden/

    tdd_cycle:
      red:
        action: "Write tests/golden/workflow/test_audit_stage9_tier_golden.py — 2 tests, FAIL"
        gate: "python3 -m pytest tests/golden/workflow/test_audit_stage9_tier_golden.py -p no:xdist -- FAIL"
        blocker: "Do NOT change pipeline YAML until tests fail"
      green:
        action: |
          Edit audit-fix-pipeline.yaml Stage 9: change "preflight" → "smoke".
          Edit test-tier-manifest.yaml: Stage 9 used_by tier = T1_smoke.
          Edit .github/prompts/cortex-architect.prompt.md Stage 9 reference.
          Edit .github/copilot-instructions.md Stage 9 reference.
        gate: "python3 -m pytest tests/golden/workflow/test_audit_stage9_tier_golden.py -p no:xdist -- 2/2 PASS"
        blocker: "Do NOT REFACTOR until 2/2 pass"
      refactor:
        action: "Grep for any remaining 'Stage 9.*preflight' references and update."
        gate: "python3 scripts/run_tests.py smoke — zero regressions including golden tier"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke"
      fix_step: "Fix any golden test failures introduced by YAML changes"
      success_predicate: "new_failures == 0"
      max_cycles: 3

    completion_gate:
      - "2/2 golden tests GREEN: test_audit_stage9_tier_golden.py"
      - "audit-fix-pipeline.yaml Stage 9 command: smoke"
      - "test-tier-manifest.yaml Stage 9 used_by tier: T1_smoke"
      - "GAP-106-03 status: CLOSED"

  # ── Sub-phase D: Certification Gate ───────────────────────────────────────────
  - id: "phase-106-d"
    title: "Certification Gate — audit_certifications SQLite table + MCP op"
    priority: P1
    status: COMPLETE
    gap_refs: ["GAP-106-04"]
    governance_authority: "CORE-002, CORE-008, CORE-011, CORE-035, CORE-064"
    duration_estimate: "3 hours"
    depends_on: ["phase-106-c"]
    prerequisite: "phase-106-c COMPLETE"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    description: |
      Add a formal CERTIFICATION GATE to the audit-fix pipeline. After Stage 9
      passes clean (p0==0, p1==0, test_fail==0), write a composite certification
      record to a new audit_certifications SQLite table. The record ties together:
      audit result, test results, RCA state, guard test count, git SHA, readiness
      score from GovernanceValidator (inline — no file output, CORE-002).
      Expose certification status via cortex_governance MCP tool (op: certification_status)
      so CI/CD, dashboards, and external tooling can query readiness programmatically.

      Certification predicate: p0==0 AND p1==0 AND test_fail==0 AND readiness_score>=95.0

    deliverables:
      - path: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
        description: |
          Add audit_certifications DDL to sqlite_logging.tables.
          Add certification INSERT in Stage 9 post_run (after pattern_detection + rca_dispatch).
          Certification predicate: p0==0 AND p1==0 AND test_fail==0 AND readiness_score>=95.0.
      - path: "cortex/mcp/tools/governance_tools.py"
        description: |
          Add op: certification_status handler.
          Query: SELECT * FROM audit_certifications ORDER BY certified_at DESC LIMIT 1.
          Returns: {certified: bool, certification_id, git_sha, readiness_score, certified_at}
          or {certified: false, reason: "no clean audit in last 7 days"}.
      - path: "tests/golden/production/test_certification_gate_golden.py"
        description: |
          Golden tests:
            - test_certification_row_written_on_clean_exit: assert row in audit_certifications
            - test_certification_predicate_blocks_partial_audit: assert no cert if p0 > 0
            - test_mcp_certification_status_returns_correct_fields: assert response schema
            - test_certification_includes_git_sha: assert git_sha field populated
            - test_certification_includes_guard_count: assert guard_tests_gen field

    audit_certifications_schema: |
      CREATE TABLE IF NOT EXISTS audit_certifications (
          certification_id   TEXT PRIMARY KEY,    -- "CERT-{session_id[:8]}"
          session_id         TEXT NOT NULL REFERENCES audit_sessions(session_id),
          git_sha            TEXT NOT NULL,
          git_branch         TEXT NOT NULL,
          audit_checks_total INTEGER NOT NULL,    -- 29 after Check #29
          audit_p0_final     INTEGER NOT NULL,    -- must be 0
          audit_p1_final     INTEGER NOT NULL,    -- must be 0
          test_tier          TEXT NOT NULL,       -- "smoke" (T1_smoke)
          test_pass_count    INTEGER NOT NULL,
          test_fail_count    INTEGER NOT NULL,    -- must be 0
          golden_test_pass   INTEGER,             -- from tests/golden/ suite
          guard_tests_gen    INTEGER DEFAULT 0,   -- regression guards generated this run
          rca_analyses_run   INTEGER DEFAULT 0,   -- RCA dispatches this run
          prevention_rules   INTEGER DEFAULT 0,   -- active prevention rules total
          readiness_score    REAL,                -- 0-100.0, from GovernanceValidator
          certified_at       TEXT NOT NULL,       -- ISO-8601 UTC
          certified_by       TEXT DEFAULT 'CORTEX-AUDIT-FIX',
          notes              TEXT                 -- optional inline summary
      );

    tdd_cycle:
      red:
        action: "Write tests/golden/production/test_certification_gate_golden.py — 5 tests, FAIL"
        gate: "python3 -m pytest tests/golden/production/test_certification_gate_golden.py -p no:xdist -- ALL FAIL"
        blocker: "Do NOT add schema or MCP op until all 5 tests fail"
      green:
        action: |
          Add audit_certifications DDL to audit-fix-pipeline.yaml sqlite_logging.tables.
          Add certification INSERT to Stage 9 post_run block.
          Add op: certification_status to cortex/mcp/tools/governance_tools.py.
          Register op in mcp_registry.py cortex_governance tool routing.
        gate: "python3 -m pytest tests/golden/production/test_certification_gate_golden.py -p no:xdist -- 5/5 PASS"
        blocker: "Do NOT REFACTOR until 5/5 pass"
      refactor:
        action: "Type hints, docstrings. Verify CORE-002: GovernanceValidator called inline only (no file output)."
        gate: "python3 scripts/run_tests.py smoke — zero regressions"

    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + cortex_validate op=compliance"
      fix_step: "Apply targeted fixes"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3

    completion_gate:
      - "5/5 golden tests GREEN: test_certification_gate_golden.py"
      - "audit_certifications table DDL in audit-fix-pipeline.yaml"
      - "Stage 9 post_run writes certification row on clean exit"
      - "cortex_governance op: certification_status registered + functional"
      - "GovernanceValidator called inline (no file output — CORE-002)"
      - "GAP-106-04 status: CLOSED"

  # ── Sub-phase E: Check #29 + validate-production.py Deprecation ───────────────
  - id: "phase-106-e"
    title: "Check #29 (Security + Monitoring) + validate-production.py Deprecation"
    priority: P2
    status: COMPLETE
    gap_refs: ["GAP-106-05"]
    governance_authority: "CORE-002, CORE-008, CORE-035, CORE-064"
    duration_estimate: "2 hours"
    depends_on: ["phase-106-d"]
    prerequisite: "phase-106-d COMPLETE"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    description: |
      Migrate UNIQUE checks from validate-production.py / GovernanceValidator
      that are NOT already covered by Checks #1-28 into the audit-fix pipeline
      as Check #29 (Security + Monitoring Posture):
        - OWASP knowledge file exists (cortex-registry/knowledge-base/security/)
        - .env in .gitignore
        - cortex/secrets/ module exists
        - deployment/prometheus.yml exists
        - deployment/health_checks.yaml exists
        - MCP server importable (cortex.mcp imports cleanly)

      Deprecate scripts/validate-production.py:
        - Remove JSON report file output (CORE-002 violation fixed)
        - Replace body with: delegate to cortex_governance(op: certification_status)
        - Keep CLI entrypoint for backward compat (teams may have it in scripts)

      Fix GovernanceValidator CORE-035 violation:
        - Remove validate_production_readiness() duplicate logic
        - Delegate to EnforcementOrchestrator.run_full_audit() checks

    deliverables:
      - path: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
        description: |
          Add Check #29 to Stage 2 checks list:
            num: 29
            label: Security + Monitoring Posture
            severity: P1
            tool: GovernanceValidator.assess_security_posture() (inline output only)
      - path: "scripts/validate-production.py"
        description: |
          Strip JSON report file output.
          Replace assessment logic with: cortex_governance(op: certification_status) call.
          Print result inline. Exit 0 if certified, 1 if not.
      - path: "tests/golden/production/test_check29_security_monitoring_golden.py"
        description: |
          Golden tests:
