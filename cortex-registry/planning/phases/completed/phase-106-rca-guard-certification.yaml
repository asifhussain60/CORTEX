      fix_step: "Apply targeted fixes"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3

    completion_gate:
      - "4/4 golden tests GREEN: test_check29_security_monitoring_golden.py"
      - "Check #29 in audit-fix-pipeline.yaml Stage 2"
      - "validate-production.py: no JSON file output, delegates to MCP"
      - "GovernanceValidator: no duplicate validation logic (CORE-035 clean)"
      - "Audit count references: 29-point in all docs"
