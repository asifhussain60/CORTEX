# ──────────────────────────────────────────────────────────────────────────────
# DECOMPOSITION STRATEGY — 3 extractions, zero import breaks
# ──────────────────────────────────────────────────────────────────────────────
strategy:
  principle: |
    Do NOT move any class or function that is imported by the 72 external files.
    MasterOrchestrator stays in master_orchestrator.py.
    Extract INTO new files; import back via the existing module surface.
    Net result: master_orchestrator.py shrinks, public API is unchanged.

  extraction_1_initialiser:
    target_file: "cortex/orchestrators/core/master_orchestrator_init.py"
    class_name: "MasterOrchestratorInitialiser"
    lines_extracted: ~600   # the 704-line __init__ body, excluding super().__init__()
    pattern: |
      class MasterOrchestratorInitialiser:
          """Encapsulates all subsystem DI wiring for MasterOrchestrator.__init__."""
          def __init__(self, host: MasterOrchestrator) -> None: ...
          def wire_state_manager(self) -> None: ...
          def wire_knowledge(self) -> None: ...
          def wire_enforcement(self) -> None: ...
          def wire_stages(self) -> None: ...
          def wire_health(self) -> None: ...
    result_in_master: |
      def __init__(self) -> None:
          super().__init__()
          self.logger = EnhancedAuditLogger.instance()
          self.domain_orchestrators: Dict[str, OrchestratorMetadata] = {}
          self.operation_history: List[Dict[str, Any]] = []
          MasterOrchestratorInitialiser(self).wire_all()  # ← delegates everything

  extraction_2_knowledge_mixin:
    target_file: "cortex/orchestrators/core/master_orchestrator_knowledge_mixin.py"
    class_name: "MasterOrchestratorKnowledgeMixin"
    methods_extracted:
      - "has_knowledge_repository (L3896)"
      - "get_knowledge_summary (L3904)"
      - "query_knowledge (L3926)"
      - "get_relevant_knowledge_for_operation (L3977)"
      - "_evaluate_knowledge_for_request (L4083)"
      - "has_business_knowledge_repository (L4154)"
      - "get_business_knowledge_summary (L4162)"
      - "query_business_knowledge (L4184)"
      - "get_relevant_business_knowledge_for_operation (L4263)"
      - "_evaluate_business_knowledge_for_request (L4347)"
      - "ask_codebase_question (L4829)"
      - "tech_intelligence_get_readiness (L4928)"
    lines_extracted: ~620
    pattern: "existing mixin pattern (OrchestratorProtocolMixin, OrchestratorAuditMixin, WorkflowTemplateMixin)"
    result_in_master: "MasterOrchestrator inherits MasterOrchestratorKnowledgeMixin — zero callers affected"

  extraction_3_legacy_delete:
    target: "execute_operation_legacy (L2449, 750 lines)"
    action: DELETE
    justification: "0 external callers confirmed via grep. Method pre-dates Stage strategy pattern."
    risk: LOW
    safety_check: "grep -rn execute_operation_legacy cortex tests | grep -v master_orchestrator.py | wc -l == 0"

