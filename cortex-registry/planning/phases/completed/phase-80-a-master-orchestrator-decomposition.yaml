# ──────────────────────────────────────────────────────────────────────────────
# CHALLENGE RECORD — why the original phase-80-a spec was superseded
# ──────────────────────────────────────────────────────────────────────────────
challenge_record:
  original_approach: "File split — reduce master_orchestrator.py to ≤500 lines via new files"
  challenge_raised: "2026-02-25"
  reason_rejected: |
    72 downstream importers of master_orchestrator.py.
    Stage files already exist (stage_1.py, stage234_strategies.py) and are used —
    they did not prevent the file from reaching 5,222 lines.
    A file split alone moves the 704-line __init__ elsewhere without fixing it.
    Risk of circular imports between new split files and existing Stage files is HIGH.
    The 500-line target is cosmetic — the correctness problem is the 704-line __init__
    and the 750-line execute_operation_legacy that has ZERO external callers.
  accepted_approach: "Hybrid B+C — surgical extraction preserving public import surface"

