background: |
  Source: GitHub Issue #18 (2026-03-12) — FB-20260312-006 and FB-20260312-007.
  Phase 141 added PROTECTED_DIRS (9→15 entries), a path-level guard inside VacuumOrchestrator.
  FB-006 adds a HIGHER-LEVEL guard: VACUUM_PROTECTED_ROOTS — a frozenset at the root abstraction
  level that blocks vacuum from even entering protected trees. These are complementary:
    VACUUM_PROTECTED_ROOTS — root/tree-level guard (Phase 151): {"cortex", "cortex-registry", etc.}
    PROTECTED_DIRS         — path-level guard (Phase 141): specific subdirectory patterns
  Both guards must pass before any destructive vacuum operation proceeds.

  FB-007 adds persona-layered dashboard tab renderers.
  cortex/orchestrators/support/onboarding/tab_renderers.py does NOT exist.
  The DashboardGenerator class currently renders tabs with static HTML.
  Tab renderers need a PersonaLayer class within the onboarding package that adapts HTML fragments
  for 3 engineering personas: engineer, architect, manager.

  IMPORTANT: phase-150-c created PersonalityLayer (voiced output for responses).
  PersonaLayer (phase-151-c) is a SEPARATE class for dashboard HTML adaptation — different purpose.
  PersonalityLayer → response text. PersonaLayer → HTML fragment persona adaptation.

  Git prerequisite: Phase 150 final_validation PASSED.

