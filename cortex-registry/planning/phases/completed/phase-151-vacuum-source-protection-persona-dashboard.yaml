        - "test_vacuum_protected_roots_contains_cortex — 'cortex' in VACUUM_PROTECTED_ROOTS"
        - "test_vacuum_protected_roots_contains_tests — 'tests' in VACUUM_PROTECTED_ROOTS"
        - "test_is_protected_returns_true_for_cortex_subpath — Path('cortex/foo') is protected"
        - "test_is_protected_returns_false_for_temp — Path('.cortex-runtime/temp') is not protected"
        - "test_is_protected_unknown_path_returns_true — fail-safe: unknown path returns True"
        - "test_vacuum_skips_cortex_source_directory — vacuum does not modify cortex/ tree"
        - "test_vacuum_skips_tests_directory — vacuum does not modify tests/ tree"
        - "test_vacuum_skips_github_directory — vacuum does not modify .github/ tree"
      green:
