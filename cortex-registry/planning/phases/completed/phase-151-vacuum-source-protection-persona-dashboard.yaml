        gate: "python3 scripts/run_tests.py file tests/golden/orchestrators/health_vacuum/test_vacuum_canonical_protection_golden.py — ALL PASS"
        blocker: "No REFACTOR until GREEN"
      refactor:
        action: "Verify fail-safe semantics; type hints; ensure PROTECTED_DIRS + VACUUM_PROTECTED_ROOTS both active"
        gate: "python3 scripts/run_tests.py dir tests/golden/orchestrators/ — zero regressions"
        blocker: "Sub-phase COMPLETE forbidden until REFACTOR gate passes"

    tdd_sequence:
