  - id: "phase-151-a"
    title: "VACUUM_PROTECTED_ROOTS constant + _is_protected() guard injected into all 8 destructive vacuum stages"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-151-01"]
    governance_authority: "CORE-008, CORE-011, CORE-035, GV-028, GV-029, GV-033"
