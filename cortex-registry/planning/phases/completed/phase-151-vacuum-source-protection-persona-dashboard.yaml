      - "tests/support/onboarding/__init__.py"
      - "tests/support/onboarding/test_tab_renderers.py"
      - "tests/support/onboarding/test_persona_layer.py"

    implementation_guide: |
      cortex/orchestrators/support/onboarding/tab_renderers.py:

        class TabRenderer:
            def render_tab(self, tab_id: str, manifest: "DashboardManifest") -> str:
                \"""Dispatch to per-tab method by tab_id; fallback to generic card if tab unknown.\"""
                method = getattr(self, f"_render_{tab_id.replace('-', '_')}", self._render_generic)
                return method(manifest)

            def _render_01_overview(self, manifest: "DashboardManifest") -> str: ...
            # one method per tab (up to 10); return HTML str

            def _render_generic(self, manifest: "DashboardManifest") -> str:
                return self._no_data_card("Tab content unavailable")

            def _esc(self, value: str) -> str:
                \"""HTML-escape value to prevent XSS.\"""
                import html; return html.escape(str(value))

            def _no_data_card(self, label: str) -> str:
                return f"<div class='no-data'>{self._esc(label)}</div>"

        class PersonaLayer:
            PERSONAS: frozenset[str] = frozenset({"engineer", "architect", "manager"})

            def adapt(self, html_fragment: str, persona: str) -> str:
                \"""Adapt html_fragment for the target persona. Returns plain html_fragment on error.\"""
                try:
                    if persona not in self.PERSONAS:
                        return html_fragment  # unknown persona: passthrough
                    return self._adapt_for(html_fragment, persona)
                except Exception:
                    return html_fragment  # GV-031: never raise; plain HTML fallback

            def _adapt_for(self, html_fragment: str, persona: str) -> str:
                # persona-specific adaptation logic (e.g., inject persona-class, reorder sections)
                ...

      Note: _esc() uses html.escape() — no XSS vectors.
      Note: PersonaLayer.adapt() always returns a str; never raises (GV-031).

