    title: "Create cortex/orchestrators/support/onboarding/ package with TabRenderer + PersonaLayer"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-151-03"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, GV-030, GV-031, GV-034"
    duration_estimate: "3 hours"
    depends_on: ["phase-151-b"]
