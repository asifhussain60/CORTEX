    files_to_modify:
      - "cortex/orchestrators/health/constants.py"  # add VACUUM_PROTECTED_ROOTS frozenset
      - "cortex/orchestrators/health/vacuum_orchestrator.py"  # add _is_protected() + guard all destructive methods

    implementation_guide: |
      In cortex/orchestrators/health/constants.py, add after PROTECTED_DIRS:
        VACUUM_PROTECTED_ROOTS: frozenset[str] = frozenset({
            "cortex",
            "cortex-registry",
            "tests",
            ".github",
            "scripts",
            "cortex-docs",
        })

      In VacuumOrchestrator, add guard method:
        def _is_protected(self, path: Path) -> bool:
            \"""Return True if path falls within any VACUUM_PROTECTED_ROOT tree.\"""
            try:
                rel = path.relative_to(self._workspace_root)
                return rel.parts[0] in VACUUM_PROTECTED_ROOTS
            except (ValueError, IndexError):
                return True  # fail-safe: unknown paths are treated as protected

      Guard ALL 8 destructive stage methods. At top of each:
        if self._is_protected(target_path):
            self._log_skipped(target_path, reason="VACUUM_PROTECTED_ROOTS")
            return

      IMPORTANT: _is_protected uses fail-safe semantics — unknown paths return True (protected).
      This is the OPPOSITE of PROTECTED_DIRS which is an allowlist pattern.

    tdd_cycle:
