background: |
  Source: chat01.md review session 2026-03-09.
  Problem: Video steering prompts in docs/assets/video-prompts/steering-prompts/
  are manually maintained static documents. They drift from the live architecture
  and require manual synchronisation after every phase. Architecture counts, 
  capability descriptions, and diagram references become stale.

  Methodology from chat01.md (canonical, non-negotiable):
    Moving forward, steering prompts are NOT static files that embed capability
    detail. Instead, they are SYNTHESISED documents generated by:
      1. Reading cortex-master.yaml (all PLANNED phases treated as implemented)
      2. Reading all open GitHub issues (git issues {all open})
      3. Reading docs/assets/diagrams/ (21 diagram .md files as reference pool)
      4. Reading cortex-registry/knowledge/best-practices/content/ (VBP YAML)
      5. Synthesising docs/.content/ (14 .md files — the canonical content source)
    Then ENHANCING all steering prompts as if every PLANNED capability already exists.

  Key deliverables:
    A. cortex-doc.prompt.md: remove all standalone video-file maintenance; 
       add intelligent synthesis methodology section for steering prompts.
    B. media-prompt-agent.md: remove Video Prompt Standards section entirely;
       it is superseded by the synthesis approach.
    C. Steering prompts 01-07: expanded from 4 combined-audience files to 7 role-specific
       files with role-slug filenames (01-all-roles-overview, 02-business-leaders,
       03-product-owners, 04-software-engineers, 05-quality-engineers,
       06-security-engineers, 07-sre). Each rewritten to reference .content + diagrams as
       their live source of truth, not hardcoded architecture counts.
    D. Sources 01-07: updated with canonical diagram references already in place
       (decoupled reference system verified and confirmed).

  Architecture facts at phase creation (from video-design-best-practices.yaml):
    Verified: 2026-03-09
    Orchestrators: 350+ | MCP tools: 40+ | Governance YAMLs: 60+
    Intent types: 35+ | RCA methodologies: 4 | Debug strategies: 8
    Document ingest components: 5 | Document ingest formats: 6
    Vacuum protected dirs: 15 | Documentation intelligence subdomains: 10

