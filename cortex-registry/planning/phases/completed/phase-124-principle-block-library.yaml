  file: "tests/golden/test_principle_block_rendering.py"
  description: "Rendering contract enforcement — ensures template fidelity across all compositions"

  test_specifications:
    # Rendering contract tests
    - name: "test_analysis_design_comps_render_exactly_one_principle"
      assertion: "comp-query assembly includes atom-principle exactly once"
      category: rendering_contract

    - name: "test_operational_comps_render_zero_principles"
      assertion: "comp-implement-fix, comp-audit-fix, comp-refactor, comp-debug, comp-vacuum, comp-health do NOT include atom-principle"
      category: rendering_contract

    - name: "test_principle_heading_is_h3"
      assertion: "Rendered output starts with '### 💡 Principle for This Design'"
      category: rendering_contract

    - name: "test_principle_uses_blockquote_format"
      assertion: "Principle text renders as '> **{principle}**' followed by '> {short_explanation}'"
      category: rendering_contract

    - name: "test_principle_brevity_limit_200_chars"
      assertion: "Every principle.principle in high-value-principles.yaml is ≤200 characters"
      category: brevity

    - name: "test_explanation_brevity_limit_200_chars"
      assertion: "Every principle.short_explanation is ≤200 characters"
      category: brevity

    - name: "test_all_principles_have_unique_dedup_key"
      assertion: "No duplicate dedup_keys across the entire principles pool"
      category: data_integrity

    - name: "test_all_principles_have_valid_capability_domain"
      assertion: "Every capability_domain is in the 10-domain enum"
      category: data_integrity

    - name: "test_dedup_keys_do_not_collide_with_quote_dedup_keys"
      assertion: "No dedup_key in high-value-principles.yaml matches any dedup_key in atom-quote.yaml"
      category: data_integrity

    - name: "test_minimum_20_principles_in_library"
      assertion: "high-value-principles.yaml contains ≥20 principle entries"
      category: completeness

    - name: "test_all_10_domains_have_at_least_one_principle"
      assertion: "Every capability_domain enum value has ≥1 principle"
      category: completeness

    - name: "test_template_consistency_no_contradictions"
      assertion: "atom-principle.yaml rendering_rules match comp-query.yaml assembly rules — no conflicting zone/heading/format specs"
      category: consistency

    - name: "test_anti_repetition_across_30_calls"
      assertion: "Across 30 consecutive select(pool='principles') calls with same intent, repetition rate < 20%"
      category: anti_repetition

  drift_locks:
    - lock: "atom-principle.yaml heading must be '### 💡 Principle for This Design'"
      violation: P1
    - lock: "atom-principle.yaml max_per_response must be 1"
      violation: P0
    - lock: "comp-implement-fix.yaml must NOT reference atom-principle"
      violation: P0
    - lock: "comp-audit-fix.yaml must NOT reference atom-principle"
      violation: P0
    - lock: "high-value-principles.yaml minimum_principles must be ≥20"
      violation: P1

