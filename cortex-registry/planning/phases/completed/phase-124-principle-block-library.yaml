# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: GitHub Copilot Chat architecture session 2026-03-04. The user's
  "Principle Block Library and Injection System" proposal was evaluated against
  the live CORTEX architecture (322 orchestrators, 30 MCP tools, 36 governance
  YAMLs, 3-tier Lego response template system with 5 atoms + 5 blocks +
  8 compositions).

  Phase 123 (PLANNED) delivers: PrincipleSelector class with weighted-random
  selection, anti-repetition ring buffer (deque maxlen=10), dedup_key per quote,
  telemetry via cortex_capture_metrics, p95 ≤3ms. Phase 123 explicitly declares
  no_composition_changes: true and no_orchestrator_changes: true.

  This Phase 124 BUILDS ON Phase 123 to deliver:
  1. A curated SDLC principles library (extending atom-quote.yaml's quote pool)
  2. A new atom-principle.yaml (Tier 1 atom in the Lego system)
  3. Composition updates for analysis/design intents
  4. DoR-aware rendering rules (principles render freely in analysis/design;
     suppressed in operational intents unless override flag is set)
  5. Golden tests + drift locks for rendering contract enforcement
  6. SDLC knowledge YAML with best-practice principles (Azure, 12-Factor, SOLID,
     security-by-design) — sourced from external research

  Architecture fit: ADDITIVE to the existing Lego system. No orchestrator wiring
  changes. No workflow template changes. Follows the established atom creation
  pattern (atom-identity, atom-quote, atom-orchestration, atom-intent-reflection,
  atom-status-footer). Reuses PrincipleSelector from Phase 123 as the selection
  engine.

  Anti-sprawl commitment: This phase creates exactly 4 new files:
    1. cortex-registry/templates/response/atoms/atom-principle.yaml (Lego atom)
    2. cortex-registry/knowledge/sdlc/high-value-principles.yaml (content SSOT)
    3. tests/golden/test_principle_block_rendering.py (golden tests)
    4. tests/intelligence/test_principle_injection.py (injection tests)
  Plus MODIFICATIONS to 3 existing files:
    1. cortex-registry/templates/response/_registry.yaml (add atom entry)
    2. cortex-registry/templates/response/compositions/comp-query.yaml (add atom)
    3. cortex/intelligence/principle_selector.py (extend for principles — created by Phase 123)
  Total: 4 new + 3 modified = 7 file touches. Zero sprawl.

  Baseline at entry (post-Phase 123):
    - Smoke tests: ≥2395 passed (Phase 123 baseline, expected to grow)
    - Preflight: ≥258 passed
    - PrincipleSelector: operational with anti-repetition ring buffer
    - atom-quote.yaml: 32 quotes with dedup_key fields (added by Phase 123)
    - cortex-master.yaml: ~425 lines (well under 800 ceiling)

  Git prerequisite: branch CORTEX, Phase 123 COMPLETE, all changes committed.

  External research synthesized:
    - Azure Architecture Design Principles (self-healing, scale-out, design for
      evolution, minimize coordination, design for operations)
    - 12-Factor App Methodology (codebase, dependencies, config, disposability,
      dev/prod parity, logs as event streams)
    - SOLID principles (SRP, OCP, LSP, ISP, DIP)
    - Security-by-design (STRIDE/DREAD, OWASP design gates, zero-trust)
    - Domain-Driven Design (bounded contexts, ubiquitous language, aggregates)

# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURAL DECISIONS
# ─────────────────────────────────────────────────────────────────────────────
architectural_decisions:
  # ADR-124-01: Extend atom-quote vs. create new atom-principle
  - id: ADR-124-01
    decision: "Create a NEW atom-principle.yaml — do NOT merge into atom-quote.yaml"
    rationale: |
      atom-quote.yaml is a curated BOOK QUOTES library (32 entries, literary sources).
      SDLC principles are a different content type (engineering axioms, not literary quotes).
      Mixing them violates CORE-035 (single canonical purpose per artifact).
      A separate atom keeps concerns clean: atom-quote = literary wisdom, atom-principle
      = engineering principles. Both use the same PrincipleSelector engine (Phase 123)
      for anti-repetition, just with different source pools.
    alternatives_rejected:
      - "Merge into atom-quote.yaml — rejected: mixes literary quotes with engineering axioms"
      - "Create a new Block (Tier 2) — rejected: principles are atomic, not composed from sub-atoms"

  # ADR-124-02: Where principles render
  - id: ADR-124-02
    decision: "Render atom-principle in comp-query and a new comp-design composition ONLY"
    rationale: |
      Principles provide value during analysis/design thinking. During operational
      modes (IMPLEMENT, FIX, REFACTOR, AUDIT, DEBUG, VACUUM, HEALTH), they are noise.
      comp-query handles QUERY/ANALYZE/INVESTIGATE/DESIGN/PLAN intents.
      Operational compositions (comp-implement-fix, comp-audit-fix, comp-refactor,
      comp-debug, comp-vacuum, comp-health) do NOT include atom-principle.
      Override: a future feature flag (principle_override: true) could enable injection
      into any composition — but this is OUT OF SCOPE for Phase 124.

  # ADR-124-03: Principles content location
  - id: ADR-124-03
    decision: "Store curated principles in cortex-registry/knowledge/sdlc/high-value-principles.yaml"
    rationale: |
      The knowledge/ directory is the canonical home for SDLC best practices.
      10 SDLC knowledge YAMLs already exist (analysis-design-patterns, security-by-design,
      etc.). A principles YAML fits naturally here. atom-principle.yaml POINTS to this
      file (SSOT pattern) — it does not duplicate the content. This follows the same
      pattern as atom-quote.yaml which contains its quotes inline (because they're
      rendering primitives), but atom-principle.yaml references the knowledge YAML
      because principles have richer metadata (capability_domain, tags, role_hints,
      learn_more_links).

  # ADR-124-04: Rendering position and header
  - id: ADR-124-04
    decision: "Render after the quote blockquote, as a H3 header: ### 💡 Principle for This Design"
    rationale: |
      Zone 2 is reserved for the book quote (atom-quote). The principle renders at
      the TOP of Zone 3 body content, after the orchestration breadcrumb. H3 because
      H1 = identity, H2 = section headers, H3 = subsection content. The 💡 emoji
      provides visual distinction from the quote blockquote. Brevity enforced:
      ≤200 characters for the principle text + ≤1 sentence explanation.

  # ADR-124-05: Selection algorithm integration
  - id: ADR-124-05
    decision: "Extend PrincipleSelector (Phase 123) with a second pool — principles_pool"
    rationale: |
      Phase 123 creates PrincipleSelector with a quotes pool (from atom-quote.yaml).
      Phase 124 adds a principles_pool (from high-value-principles.yaml). Both pools
      share the same ring buffer for anti-repetition. The select() method gains an
      optional pool parameter: select(pool='quotes') or select(pool='principles').
      Default remains 'quotes' for backward compatibility. This is a non-breaking
      extension — Phase 123's tests continue to pass unchanged.

# ─────────────────────────────────────────────────────────────────────────────
# YAML SCHEMA — Curated Principles Library
# ─────────────────────────────────────────────────────────────────────────────
# This schema defines the structure of entries in high-value-principles.yaml.
# Each principle is a self-contained engineering axiom with rich metadata
# for contextual selection, deduplication, and learning.
# ─────────────────────────────────────────────────────────────────────────────
principles_schema:
  description: "Schema for curated SDLC principles in cortex-registry/knowledge/sdlc/high-value-principles.yaml"
  fields:
    - name: id
      type: string
      required: true
      format: "PRINCIPLE-{DOMAIN}-{NNN}"
      example: "PRINCIPLE-ARCH-001"
      description: "Unique identifier. Domain prefix from capability_domain."

    - name: principle
      type: string
      required: true
      max_length: 200
      description: "The principle statement. ≤200 characters. Clear, actionable, no jargon."
      example: "Design for failure — every component must handle the unavailability of its dependencies."

    - name: short_explanation
      type: string
      required: true
      max_length: 200
      description: "≤1 sentence amplification. Provides the 'why' behind the principle."
      example: "Systems that assume happy-path availability cascade failures across boundaries."

    - name: capability_domain
      type: string
      required: true
      enum: [architecture, decomposition, security, testing, performance, quality, maintainability, observability, resilience, data_integrity]
      description: "Primary engineering domain. Used for intent-based selection."

    - name: tags
      type: array
      items: string
      required: true
      min_items: 1
      max_items: 5
      description: "Searchable tags for contextual matching. Used by in-memory tag index."
      example: ["fault-tolerance", "circuit-breaker", "resilience", "microservices"]

    - name: role_hints
      type: array
      items: string
      required: false
      enum: [architect, developer, tester, security_engineer, devops, tech_lead]
      description: "Audience hints. Selection can weight toward active user role."

    - name: dedup_key
      type: string
      required: true
      format: "{domain}-{slug}"
      description: "Unique key for anti-repetition ring buffer. Shared with quote dedup_keys."
      example: "arch-design-for-failure"

    - name: relevance_weight
      type: float
      required: true
      min: 0.1
      max: 1.0
      default: 0.5
      description: "Base selection weight. Higher = more likely to be selected. Contextual signals can boost."

    - name: source_yaml
      type: string
      required: false
      description: "Pointer to the cortex-registry knowledge YAML that elaborates this principle."
      example: "cortex-registry/knowledge/architecture/engineering-design-patterns.yaml"

    - name: learn_more_links
      type: array
      items: string
      required: false
      max_items: 3
      description: "External reference URLs for deeper learning. NOT rendered in responses — metadata only."
      example: ["https://learn.microsoft.com/en-us/azure/architecture/guide/design-principles/"]

  validation_rules:
    - "Every principle.principle must be ≤200 characters (enforced in golden tests)"
    - "Every principle.short_explanation must be ≤200 characters"
    - "Every principle must have a unique dedup_key (no duplicates across the entire pool)"
    - "Every principle must have at least 1 tag"
    - "capability_domain must be from the enum list (10 domains)"
    - "Minimum 20 principles in the library at launch (target: 30-40)"
    - "No principle may duplicate meaning of an existing atom-quote.yaml entry"

# ─────────────────────────────────────────────────────────────────────────────
# CURATED PRINCIPLES — Initial Library (30 principles across 10 domains)
# These will be written to cortex-registry/knowledge/sdlc/high-value-principles.yaml
# during implementation. Listed here for design review and completeness.
# ─────────────────────────────────────────────────────────────────────────────
initial_principles_catalogue:
  architecture:  # 4 principles
    - id: PRINCIPLE-ARCH-001
      principle: "Design for failure — every component must handle the unavailability of its dependencies."
      short_explanation: "Systems that assume happy-path availability cascade failures across boundaries."
      dedup_key: "arch-design-for-failure"
      tags: [fault-tolerance, resilience, microservices]
      source: "Azure Design Principles + 12-Factor (disposability)"
      relevance_weight: 0.8

    - id: PRINCIPLE-ARCH-002
      principle: "Minimize coordination between components to achieve scalability."
      short_explanation: "Tight coupling forces synchronous waiting; loose coupling enables independent scaling."
      dedup_key: "arch-minimize-coordination"
      tags: [scalability, loose-coupling, bounded-context]
      source: "Azure Design Principles"
      relevance_weight: 0.7

    - id: PRINCIPLE-ARCH-003
      principle: "Design for evolution — anticipate change by isolating decisions behind stable interfaces."
      short_explanation: "The only constant is change; encapsulation protects consumers from implementation shifts."
      dedup_key: "arch-design-for-evolution"
      tags: [encapsulation, interfaces, OCP]
      source: "Azure Design Principles + SOLID (OCP)"
      relevance_weight: 0.7

    - id: PRINCIPLE-ARCH-004
      principle: "Scale out, not up — design for horizontal scaling from the start."
      short_explanation: "Vertical scaling hits hard limits; horizontal scaling is elastic and cost-efficient."
      dedup_key: "arch-scale-out"
      tags: [scalability, horizontal-scaling, cloud-native]
      source: "Azure Design Principles + 12-Factor (concurrency)"
      relevance_weight: 0.6

  decomposition:  # 3 principles
    - id: PRINCIPLE-DECOMP-001
      principle: "Identify bounded contexts first — service boundaries follow domain boundaries, not technical layers."
      short_explanation: "Technical layers create coupling; domain boundaries create autonomy."
      dedup_key: "decomp-bounded-contexts"
      tags: [DDD, bounded-context, microservices, domain-modeling]
      source: "DDD (Eric Evans) + analysis-design-patterns.yaml"
      relevance_weight: 0.8

    - id: PRINCIPLE-DECOMP-002
      principle: "Define ubiquitous language before writing code — ambiguous terms become ambiguous systems."
      short_explanation: "Shared vocabulary between domain experts and developers prevents semantic drift."
      dedup_key: "decomp-ubiquitous-language"
      tags: [DDD, ubiquitous-language, requirements]
      source: "DDD (Eric Evans)"
      relevance_weight: 0.7

    - id: PRINCIPLE-DECOMP-003
      principle: "Capture invariants as executable tests — business rules that aren't tested are suggestions."
      short_explanation: "An untested invariant will be violated the moment someone unfamiliar modifies the code."
      dedup_key: "decomp-invariants-as-tests"
      tags: [TDD, invariants, CORE-008, testing]
      source: "CORTEX CORE-008 + analysis-design-patterns.yaml"
      relevance_weight: 0.9

  security:  # 3 principles
    - id: PRINCIPLE-SEC-001
      principle: "Apply security at every layer — never rely on a single perimeter for protection."
      short_explanation: "Defense in depth ensures a breach in one layer doesn't compromise the entire system."
      dedup_key: "sec-defense-in-depth"
      tags: [defense-in-depth, zero-trust, STRIDE]
      source: "security-by-design.yaml + OWASP"
      relevance_weight: 0.8

    - id: PRINCIPLE-SEC-002
      principle: "Treat all input as untrusted — validate, sanitize, and encode at every trust boundary."
      short_explanation: "Injection attacks exploit the gap between trusted and untrusted data flows."
      dedup_key: "sec-untrusted-input"
      tags: [input-validation, injection, OWASP, trust-boundary]
      source: "OWASP Top 10 + security-by-design.yaml"
      relevance_weight: 0.8

    - id: PRINCIPLE-SEC-003
      principle: "Apply least privilege everywhere — processes, users, and services get only what they need."
      short_explanation: "Excessive permissions turn minor vulnerabilities into catastrophic breaches."
      dedup_key: "sec-least-privilege"
      tags: [least-privilege, IAM, zero-trust]
      source: "OWASP + security-by-design.yaml"
      relevance_weight: 0.7

  testing:  # 3 principles
    - id: PRINCIPLE-TEST-001
      principle: "Write the test first — TDD is a design tool, not just a verification tool."
      short_explanation: "Tests written after code verify what was built; tests written before shape what gets built."
      dedup_key: "test-tdd-design-tool"
      tags: [TDD, CORE-008, test-first, design]
      source: "CORTEX CORE-008 + Kent Beck"
      relevance_weight: 0.9

    - id: PRINCIPLE-TEST-002
      principle: "Test behavior, not implementation — tests that mirror code structure break on every refactor."
      short_explanation: "Behavioral tests survive refactoring; structural tests create false failures."
      dedup_key: "test-behavior-not-implementation"
      tags: [behavioral-testing, refactoring, test-design]
      source: "Kent Beck + Martin Fowler"
      relevance_weight: 0.7

    - id: PRINCIPLE-TEST-003
      principle: "Golden tests lock critical rendering contracts — template drift is silent regression."
      short_explanation: "Snapshot-style tests catch rendering changes that unit tests miss."
      dedup_key: "test-golden-drift-lock"
      tags: [golden-tests, drift-detection, rendering-contract]
      source: "CORTEX Phase 120 (Lego architecture)"
      relevance_weight: 0.7

  performance:  # 3 principles
    - id: PRINCIPLE-PERF-001
      principle: "Measure before optimizing — intuition about bottlenecks is wrong more often than right."
      short_explanation: "Profiling reveals the actual hot path; premature optimization wastes effort."
      dedup_key: "perf-measure-first"
      tags: [profiling, bottleneck, premature-optimization]
      source: "Donald Knuth + performance-optimization knowledge"
      relevance_weight: 0.7

    - id: PRINCIPLE-PERF-002
      principle: "Cache at the right layer — caching too early hides bugs, caching too late wastes resources."
      short_explanation: "Effective caching requires understanding the data freshness contract at each boundary."
      dedup_key: "perf-cache-right-layer"
      tags: [caching, TTL, data-freshness, performance]
      source: "Azure Design Principles (design for operations)"
      relevance_weight: 0.6

    - id: PRINCIPLE-PERF-003
      principle: "Design for observability from day one — logs, metrics, and traces are not afterthoughts."
      short_explanation: "A system you can't observe in production is a system you can't debug in production."
      dedup_key: "perf-observability-day-one"
      tags: [observability, logging, metrics, tracing, OpenTelemetry]
      source: "12-Factor (logs) + Azure (design for operations)"
      relevance_weight: 0.8

  quality:  # 3 principles
    - id: PRINCIPLE-QUAL-001
      principle: "Single Responsibility — every module, class, and function should have exactly one reason to change."
      short_explanation: "Multiple responsibilities create coupling that makes changes risky and reviews harder."
      dedup_key: "qual-single-responsibility"
      tags: [SRP, SOLID, cohesion, modularity]
      source: "SOLID (Robert C. Martin)"
      relevance_weight: 0.8

    - id: PRINCIPLE-QUAL-002
      principle: "Depend on abstractions, not concretions — stable interfaces outlive volatile implementations."
      short_explanation: "Dependency Inversion keeps high-level policy independent of low-level mechanism."
      dedup_key: "qual-depend-on-abstractions"
      tags: [DIP, SOLID, interfaces, decoupling]
      source: "SOLID (Robert C. Martin)"
      relevance_weight: 0.7

    - id: PRINCIPLE-QUAL-003
      principle: "Make illegal states unrepresentable — use types and constraints to prevent invalid data at compile time."
      short_explanation: "Runtime validation catches errors late; type systems and enums catch them at definition time."
      dedup_key: "qual-illegal-states"
      tags: [type-safety, enums, constraints, correctness]
      source: "Yaron Minsky + functional programming tradition"
      relevance_weight: 0.7

  maintainability:  # 3 principles
    - id: PRINCIPLE-MAINT-001
      principle: "Optimize for readability — code is read 10x more than it is written."
      short_explanation: "Clear naming, small functions, and consistent structure reduce cognitive load."
      dedup_key: "maint-readability"
      tags: [readability, clean-code, naming, cognitive-load]
      source: "Robert C. Martin (Clean Code)"
      relevance_weight: 0.7

    - id: PRINCIPLE-MAINT-002
      principle: "Keep configuration external — environment-specific values must never live in code."
      short_explanation: "Hardcoded config prevents deployment across environments without code changes."
      dedup_key: "maint-external-config"
      tags: [12-factor, config, environment, deployment]
      source: "12-Factor App (config)"
      relevance_weight: 0.6

    - id: PRINCIPLE-MAINT-003
      principle: "Every dependency is a liability — add dependencies deliberately, not by default."
      short_explanation: "Each dependency brings upgrade burden, security surface, and compatibility risk."
      dedup_key: "maint-deliberate-dependencies"
      tags: [dependencies, 12-factor, supply-chain, minimal]
      source: "12-Factor App (dependencies) + supply chain security"
      relevance_weight: 0.6

  observability:  # 2 principles
    - id: PRINCIPLE-OBS-001
      principle: "Treat logs as event streams — structured, not unstructured; streamed, not written to files."
      short_explanation: "Structured logs enable querying; event streams enable real-time alerting."
      dedup_key: "obs-logs-as-streams"
      tags: [logging, structured-logging, 12-factor, event-streams]
      source: "12-Factor App (logs)"
      relevance_weight: 0.6

    - id: PRINCIPLE-OBS-002
      principle: "Correlate across boundaries — distributed tracing connects the dots that logs alone cannot."
      short_explanation: "A trace ID propagated across services turns isolated log lines into a coherent story."
      dedup_key: "obs-distributed-tracing"
      tags: [tracing, correlation, OpenTelemetry, microservices]
      source: "OpenTelemetry + Azure (design for operations)"
      relevance_weight: 0.6

  resilience:  # 3 principles
    - id: PRINCIPLE-RES-001
      principle: "Design for self-healing — detect anomalies, isolate failures, and recover without human intervention."
      short_explanation: "Manual recovery doesn't scale; automated health checks and restarts do."
      dedup_key: "res-self-healing"
      tags: [self-healing, health-checks, auto-recovery, resilience]
      source: "Azure Design Principles (self-healing)"
      relevance_weight: 0.8

    - id: PRINCIPLE-RES-002
      principle: "Use circuit breakers to prevent cascade failures — fail fast, recover gracefully."
      short_explanation: "A circuit breaker stops repeated calls to a failing dependency, giving it time to recover."
      dedup_key: "res-circuit-breaker"
      tags: [circuit-breaker, resilience, fault-tolerance, patterns]
      source: "Michael Nygard (Release It!) + Azure"
      relevance_weight: 0.7

    - id: PRINCIPLE-RES-003
      principle: "Partition around critical resources — isolation prevents one component's failure from starving others."
      short_explanation: "Bulkhead patterns ensure resource contention in one area doesn't affect unrelated areas."
      dedup_key: "res-bulkhead-partition"
      tags: [bulkhead, isolation, resource-partitioning, resilience]
      source: "Azure Design Principles (partition) + Release It!"
      relevance_weight: 0.6

  data_integrity:  # 3 principles
    - id: PRINCIPLE-DATA-001
      principle: "Define consistency boundaries explicitly — not everything needs strong consistency."
      short_explanation: "Eventual consistency enables availability; strong consistency enables correctness — choose deliberately."
      dedup_key: "data-consistency-boundaries"
      tags: [consistency, CAP-theorem, eventual-consistency, ACID]
      source: "DDD (aggregates) + CAP theorem"
      relevance_weight: 0.7

    - id: PRINCIPLE-DATA-002
      principle: "Schema changes must be backward compatible — breaking changes cascade across all consumers."
      short_explanation: "Additive-only schema evolution prevents downstream breakage during rolling deployments."
      dedup_key: "data-backward-compatible-schema"
      tags: [schema-evolution, backward-compatibility, API, versioning]
      source: "12-Factor + company API standards"
      relevance_weight: 0.7

    - id: PRINCIPLE-DATA-003
      principle: "Validate at the boundary, trust within — data crossing a trust boundary must be verified."
      short_explanation: "Internal components assume validated data; boundaries enforce the contract."
      dedup_key: "data-validate-at-boundary"
      tags: [validation, trust-boundary, contracts, data-integrity]
      source: "security-by-design.yaml + hexagonal architecture"
      relevance_weight: 0.7

# ─────────────────────────────────────────────────────────────────────────────
# RENDERING SPECIFICATION — atom-principle.yaml design
# ─────────────────────────────────────────────────────────────────────────────
atom_principle_spec:
  id: "atom-principle"
  type: atom
  tier: 1
  position: "Zone 3 body — after 🧭 Orchestration: breadcrumb, before work content"
  heading: "### 💡 Principle for This Design"
  heading_level: "H3 (H1=identity, H2=sections, H3=sub-content)"
  max_per_response: 1
  brevity_limit: "≤200 characters for principle text; ≤200 characters for short_explanation"

  rendering_template: |
    ### 💡 Principle for This Design
    > **{principle}**
    > {short_explanation}

  rendering_rules:
    copilot_chat_compatible: true
    element: "H3 heading + blockquote"
    zone: 3
    vs_code_render: "H3 renders as bold subsection; blockquote renders with blue accent bar"
    forbidden_in_content:
      - "raw URLs (learn_more_links are metadata only, never rendered)"
      - "HTML tags"
      - "tree characters"
      - "tables"
    max_chars_principle: 200
    max_chars_explanation: 200

  # Which compositions include atom-principle (WHITELIST — all others excluded)
  included_in_compositions:
    - comp-query        # QUERY, ANALYZE, INVESTIGATE, DESIGN, PLAN intents
  excluded_from_compositions:
    - comp-implement-fix  # IMPLEMENT, FIX — operational
    - comp-audit-fix      # AUDIT — operational
    - comp-refactor       # REFACTOR — operational
    - comp-debug          # DEBUG — operational
    - comp-vacuum         # VACUUM — operational
    - comp-health         # HEALTH — operational
    - comp-introduce      # INTRODUCE — onboarding, not analysis

  # Override mechanism (future — OUT OF SCOPE for Phase 124)
  override_flag:
    name: "principle_override"
    default: false
    description: "When true, renders atom-principle in ANY composition. Reserved for future phases."
    scope: "NOT IMPLEMENTED in Phase 124 — documented for extensibility"

# ─────────────────────────────────────────────────────────────────────────────
# SELECTION ALGORITHM — PrincipleSelector extension
# ─────────────────────────────────────────────────────────────────────────────
selection_algorithm:
  engine: "cortex/intelligence/principle_selector.py (created by Phase 123)"
  extension_method: "Add select(pool='principles') overload to PrincipleSelector"
  pool_loading: "Lazy-load high-value-principles.yaml at first select(pool='principles') call"
  caching: "TTL cache with 300s TTL — invalidates on file modification timestamp check"
  tag_index: "In-memory dict[str, list[int]] — maps tag → principle indices for O(1) lookup"

  intent_to_domain_map:
    DESIGN: [architecture, decomposition, quality, maintainability]
    PLAN: [architecture, decomposition, performance, resilience]
    ANALYZE: [decomposition, testing, data_integrity, quality]
    INVESTIGATE: [observability, resilience, performance, security]
    QUERY: [quality, maintainability, architecture]  # broad — any domain relevant
    SECURITY_AUDIT: [security, data_integrity, resilience]

  selection_steps:
    1: "Resolve intent_type → candidate capability_domains via intent_to_domain_map"
    2: "Filter principles pool to matching capability_domains"
    3: "Exclude principles whose dedup_key is in the shared ring buffer (anti-repetition)"
    4: "Apply relevance_weight as selection probability (weighted random)"
    5: "If all candidates exhausted by ring buffer, evict oldest 5 entries and retry once"
    6: "Return selected principle dict (or None if pool empty — graceful degradation)"
    7: "Append selected dedup_key to ring buffer"

  performance_guarantees:
    p95_max_ms: 3
    p99_max_ms: 8
    implementation_notes: |
      30-40 principle entries = ~4KB in memory. Domain filter is O(n) where n ≤ 40.
      Tag index enables O(1) tag lookup. Ring buffer is O(1) via deque. YAML loaded
      once at first call (lazy singleton), cached with TTL. No filesystem I/O at
      select() time after initial load. Target actual latency: <1ms.

  anti_repetition:
    ring_buffer: "shared deque(maxlen=10) — same buffer as quotes (Phase 123)"
    dedup_key_namespace: "principles and quotes share the ring buffer to prevent BOTH types from repeating"
    eviction_on_exhaustion: "clear oldest 5 entries if all domain candidates are in buffer"

# ─────────────────────────────────────────────────────────────────────────────
# DoR INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────
dor_integration:
  description: |
    The Definition of Ready (DoR) gate fires for IMPLEMENT/FIX/REFACTOR/AUDIT/TDD
    (code-touching intents). It does NOT fire for QUERY/ANALYZE/PLAN/DESIGN
    (non-code-touching intents). This is already the correct behavior.

    Principles render during analysis/design (DoR-exempt intents) — no conflict.
    When a user transitions from DESIGN → IMPLEMENT, the DoR gate activates and
    blocks execution until DoR=100%. The principle from the design phase is NOT
    carried into the implementation response (different composition path).

  principle_reinforces_dor: |
    Selected principles are contextually aligned to DoR readiness dimensions:
    - security domain → reinforces security readiness
    - testing domain → reinforces test coverage readiness
    - quality domain → reinforces code quality readiness
    - architecture domain → reinforces architectural fitness
    The PrincipleSelector.select(pool='principles') call receives the current
    intent_type, which maps to relevant capability_domains. The selected principle
    naturally reinforces the readiness dimension most relevant to the current work.

  no_blocking_behavior: |
    atom-principle NEVER blocks response rendering. If PrincipleSelector returns
    None (empty pool, all exhausted), the atom is simply omitted. Graceful
    degradation — the response renders normally without a principle block.

# ─────────────────────────────────────────────────────────────────────────────
# TELEMETRY — extends Phase 123 telemetry
# ─────────────────────────────────────────────────────────────────────────────
telemetry:
  extends: "Phase 123 telemetry (selection_latency_ms, repeat_avoided_count)"
  new_metrics:
    - name: "principle_selection_latency_ms"
      type: histogram
      description: "Latency of select(pool='principles') calls"
      target: "p95 ≤ 3ms"

    - name: "principle_cache_hit_rate"
      type: gauge
      description: "Ratio of cache hits to total select(pool='principles') calls"
      target: "> 0.95 after warm-up"

    - name: "principle_pool_exhaustion_count"
      type: counter
      description: "Number of times all domain candidates were in ring buffer"
      target: "< 5% of calls"

    - name: "principle_render_count"
      type: counter
      description: "Number of times atom-principle was included in a response"
      labels: [intent_type, capability_domain]

  emission_target: "cortex_capture_metrics MCP tool (fire-and-forget, disabled by default)"
  guard: "metrics_enabled=True parameter on PrincipleSelector (default: False)"

