# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE NOTES — for implementer reference
# ─────────────────────────────────────────────────────────────────────────────
architecture_notes:
  key_files:
    - path: "cortex-registry/knowledge/sdlc/high-value-principles.yaml"
      role: "NEW — curated SDLC principles library (30 entries, schema-validated)"
    - path: "cortex-registry/templates/response/atoms/atom-principle.yaml"
      role: "NEW — Tier 1 Lego atom for principle rendering in Zone 3"
    - path: "tests/golden/test_principle_block_rendering.py"
      role: "NEW — golden tests + drift locks (13 rendering + 7 drift lock assertions)"
    - path: "tests/intelligence/test_principle_injection.py"
      role: "NEW — principle library schema + PrincipleSelector pool extension tests"
    - path: "cortex-registry/templates/response/_registry.yaml"
      role: "MODIFY — add atom-principle entry to atoms list"
    - path: "cortex-registry/templates/response/compositions/comp-query.yaml"
      role: "MODIFY — add atom-principle to atoms assembly (zone: 3, after atom-quote)"
    - path: "cortex/intelligence/principle_selector.py"
      role: "MODIFY — extend with principles pool, tag index, cache TTL (Phase 123 creates this file)"

  no_new_files_except:
    - "cortex-registry/knowledge/sdlc/high-value-principles.yaml"
    - "cortex-registry/templates/response/atoms/atom-principle.yaml"
    - "tests/golden/test_principle_block_rendering.py"
    - "tests/intelligence/test_principle_injection.py"

  no_orchestrator_changes: true
  no_workflow_template_changes: true
  no_wiring_changes: true
  no_governance_yaml_changes: true
  regression_risk: MINIMAL   # Only comp-query.yaml is modified — 7 other compositions untouched

  anti_sprawl_contract: |
    This phase creates exactly 4 new files and modifies 3 existing files.
    No new directories. No new patterns. No new abstractions. Reuses:
    - PrincipleSelector from Phase 123 (extends, doesn't replace)
    - Lego atom pattern from Phase 120 (follows established atom-*.yaml convention)
    - Knowledge YAML pattern from existing cortex-registry/knowledge/sdlc/ directory
    - Golden test pattern from Phase 120 (tests/golden/ directory)
    Any file created outside this list is a GOVERNANCE VIOLATION.

  extensibility_notes: |
    Future phases can:
    - Add more principles to high-value-principles.yaml (append-only)
    - Add new capability_domains to the enum (schema extension)
    - Enable principle_override flag to inject into operational compositions
    - Create comp-design.yaml / comp-plan.yaml compositions (currently comp-query handles all)
    - Add role_hints-based selection weighting
    - Add team-specific principle profiles
    All of these are additive — zero breaking changes to Phase 124 artifacts.

  performance_budget:
    p95_max_ms: 3
    p99_max_ms: 8
    implementation_note: |
      30-40 principles = ~5KB in memory. Domain filter is O(n) where n ≤ 40.
      Tag index enables O(1) tag lookup. Ring buffer is O(1) via deque. YAML loaded
      once at first select(pool='principles') call, cached with 300s TTL. File
      modification timestamp check is a single os.path.getmtime call (~0.01ms).
      No filesystem scan at select() time. Target actual latency: <1ms.
