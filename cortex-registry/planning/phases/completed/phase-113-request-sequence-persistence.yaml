  # ── Sub-phase A: Request Log Table + Pre-API Persistence ──────────────────
  - id: "phase-113-a"
    title: "RequestLogManager — request_log table + pre-API save in MasterOrchestrator"
    priority: P0
    status: COMPLETE
    gap_refs: ["GAP-113-01", "GAP-113-04"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "4 hours"
    depends_on: []
    prerequisite: "smoke tests green (≥2,174 baseline)"
    regression_gate: "python scripts\\run_tests.py smoke — zero new failures"

    description: |
      Create RequestLogManager class that persists every user request to SQLite
      BEFORE the request enters the orchestration pipeline. This ensures:
      - Audit trail even if API call fails/times out
      - Unique request_id for end-to-end correlation
      - Session-level grouping via session_id
      - Timing metadata (received_at, completed_at, duration_ms)
      - Intent classification result (updated post-routing)
      - Response summary (updated post-completion)

      Schema for `request_log` table in conversations.db:
      ```sql
      CREATE TABLE IF NOT EXISTS request_log (
          request_id TEXT PRIMARY KEY,           -- UUID, generated before API dispatch
          session_id TEXT NOT NULL,              -- groups requests in same session
          sequence_number INTEGER NOT NULL,      -- 1-based, auto-incremented per session
          user_request TEXT NOT NULL,            -- full raw request text (no truncation)
          request_hash TEXT NOT NULL,            -- SHA-256 of user_request for dedup
          received_at TEXT NOT NULL,             -- ISO timestamp when request arrived
          completed_at TEXT,                     -- ISO timestamp when processing finished
          duration_ms REAL,                      -- total processing time
          intent_type TEXT,                      -- classified intent (updated post-routing)
          orchestrator_chain TEXT,               -- JSON array of orchestrator display names
          status TEXT NOT NULL DEFAULT 'RECEIVED', -- RECEIVED | PROCESSING | COMPLETED | FAILED
          error_summary TEXT,                    -- error message if FAILED
          context_snapshot TEXT,                 -- JSON blob of context at request time
          parent_request_id TEXT,                -- FK to prior request in sequence (nullable)
          FOREIGN KEY (parent_request_id) REFERENCES request_log(request_id)
      );
      CREATE INDEX IF NOT EXISTS idx_request_log_session ON request_log(session_id, sequence_number);
      CREATE INDEX IF NOT EXISTS idx_request_log_received ON request_log(received_at DESC);
      CREATE INDEX IF NOT EXISTS idx_request_log_status ON request_log(status);
      ```

      File: cortex/interaction/request_log_manager.py (NEW)
      Integration: cortex/orchestrators/core/master_orchestrator.py (EDIT — add pre-API save)

