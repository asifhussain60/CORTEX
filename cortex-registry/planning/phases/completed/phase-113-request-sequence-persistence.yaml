# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE SUMMARY — Data Flow After Phase 113
# ─────────────────────────────────────────────────────────────────────────────
# User Request → MasterOrchestrator.process_user_request()
#   │
#   ├─ [PRE-API] RequestLogManager.log_request()
#   │   └─ INSERT INTO request_log (request_id, session_id, seq, user_request, status=RECEIVED)
#   │   └─ parent_request_id = previous request's request_id (chain linkage)
#   │
#   ├─ [STATUS UPDATE] RequestLogManager.update_status(PROCESSING)
#   │
#   ├─ Stage 1: InteractionOrchestrator.process_comprehension()
#   │   ├─ RequestLogManager.get_prior_requests(session_id, limit=5)
#   │   ├─ build_context_summary(prior_requests) → prior_context string
#   │   ├─ LENS analysis (enriched with prior_context)
#   │   └─ Challenge evaluation (request_id FK in challenge_decisions)
#   │
#   ├─ Stage 2: IntentRouter (intent classified)
#   │   └─ RequestLogManager.update_intent(request_id, intent_type)
#   │
#   ├─ Stage 3: Governance validation
#   │
#   ├─ Stage 4: Domain execution
#   │
#   ├─ [POST-PIPELINE] ConversationStateManager.save_turn(TurnRecord)
#   │   └─ TurnRecord.context_state = {"request_id": "<uuid>", ...}
#   │
#   └─ [STATUS UPDATE] RequestLogManager.update_status(COMPLETED | FAILED)
#
# Database: .cortex-runtime/state/conversations.db
# Tables: conversations, turn_records, request_log (NEW)
# ─────────────────────────────────────────────────────────────────────────────
