  # ── Sub-phase C: InteractionOrchestrator Context Chain ────────────────────
  - id: "phase-113-c"
    title: "InteractionOrchestrator prior-turn context query + challenge_decisions FK linkage"
    priority: P0
    status: COMPLETE
    gap_refs: ["GAP-113-03", "GAP-113-05"]
    governance_authority: "CORE-008, CORE-011, CORE-012, CORE-035, CORE-064"
    duration_estimate: "4 hours"
    depends_on: ["phase-113-b"]
    prerequisite: "phase-113-b completion_gate PASSED"
    regression_gate: "python scripts\\run_tests.py smoke — zero new failures"

    description: |
      Enable InteractionOrchestrator to query the request_log for prior turns,
      building cumulative context for LENS analysis and challenge evaluation.

      Key capabilities:
      1. get_prior_requests(session_id, limit=5) — returns last N requests from
         request_log for the current session, ordered by sequence_number DESC
      2. build_context_summary(prior_requests) — creates a compact context string
         from prior request texts + intent types for inclusion in LENS analysis
      3. process_comprehension() receives prior_context and includes it in the
         enriched context passed to Stage 2 (IntentRouter)
      4. challenge_decisions table gets request_id FK column instead of truncated
         user_request_hint (backward-compatible: hint column retained, FK added)

      Integration points:
      - InteractionOrchestrator.__init__() — receive RequestLogManager reference
      - InteractionOrchestrator.process_comprehension() — query prior requests,
        inject into LENS context
      - InteractionOrchestrator._persist_challenge_decision() — add request_id FK

      Context chain example (what this enables):
        Turn 1: "Create a user authentication module" → saved with seq=1
        Turn 2: "Add password hashing" → InteractionOrchestrator queries seq=1,
                 sees prior context about auth module, enriches LENS analysis
        Turn 3: "Add rate limiting" → queries seq=1,2, sees auth + hashing context

