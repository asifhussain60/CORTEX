# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: User request analysis — 2026-03-03 session review
  Score at entry: 4.0 / 10 (request tracing non-existent)
  Target score: 9.0 / 10 (full request lifecycle tracing)

  PROBLEM STATEMENT:
  ==================
  When a user sends a request to MasterOrchestrator, the raw request text is passed
  through the pipeline as a transient parameter but is NEVER persisted as a
  first-class entity before processing begins. This creates 5 critical gaps:

  1. NO REQUEST TABLE — No dedicated `requests` or `user_requests` table exists
     anywhere in the 7 SQLite databases. The raw user request is ephemeral.

  2. DISCONNECTED ConversationStateManager — `cortex/interaction/conversation_state.py`
     has a fully-built ConversationStateManager with `conversations` and `turn_records`
     tables (including `user_input` column), but it is NOT wired into MasterOrchestrator
     or InteractionOrchestrator. The manager exists but is never called.

  3. TRUNCATED HINTS ONLY — The `challenge_decisions` table in orchestrator-traces.db
     stores `user_request_hint` (first 100 chars) but only when a challenge fires —
     not for every request. This is insufficient for sequence reconstruction.

  4. NO SEQUENCE CHAIN — Consecutive requests have no linkage. There is no mechanism
     for InteractionOrchestrator to query "what did the user ask in the last N turns?"
     to build cumulative context. Each request is processed in isolation.

  5. NO PRE-API PERSISTENCE — The request should be saved to SQLite BEFORE being
     passed to the Copilot API, creating an audit trail and enabling context
     reconstruction if the API call fails or times out.

  EXISTING INFRASTRUCTURE:
  ========================
  - ConversationStateManager (cortex/interaction/conversation_state.py) — 237 lines,
    fully functional SQLite manager with create_conversation(), save_turn(),
    load_conversation(), list_conversations(). Database: .cortex-runtime/state/conversations.db
  - MasterOrchestrator.process_user_request() — entry point at line 1162
  - InteractionOrchestrator.process_comprehension() — Stage 1 comprehension at line 444
  - orchestrator-traces.db — existing trace infrastructure
  - 7 SQLite databases already managed in .cortex-runtime/

  SOLUTION APPROACH:
  ==================
  Wire ConversationStateManager into the MasterOrchestrator → InteractionOrchestrator
  pipeline. Add a dedicated `request_log` table for pre-API persistence. Enable
  InteractionOrchestrator to query prior turns for cumulative context building.

  Baseline measurements:
    - Smoke tests: 2,174 passed
    - SQLite databases: 7 in .cortex-runtime/
    - ConversationStateManager: exists but disconnected
    - Request persistence: 0% (no requests persisted)
  Git prerequisite: main branch clean, phase-110 COMPLETE

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE — all open issues (CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-113-01"
    title: "No request_log table — raw user requests not persisted before API dispatch"
    severity: P0
    source: "2026-03-03 architecture review"
    evidence: |
      grep -r "CREATE TABLE.*request" cortex/ → 0 results.
      MasterOrchestrator.process_user_request() passes `user_request: str` through
      pipeline without any sqlite3.connect() or save() call.
      File: cortex/orchestrators/core/master_orchestrator.py line 1162
    action_ref: "phase-113-a"
    status: CLOSED

  - id: "GAP-113-02"
    title: "ConversationStateManager not wired into MasterOrchestrator"
    severity: P0
    source: "2026-03-03 architecture review"
    evidence: |
      cortex/interaction/conversation_state.py defines ConversationStateManager with
      full SQLite persistence (create_conversation, save_turn, load_conversation).
      But neither MasterOrchestrator.__init__() nor process_user_request() imports
      or instantiates ConversationStateManager.
      grep -r "ConversationStateManager" cortex/orchestrators/ → 0 results
    action_ref: "phase-113-b"
    status: CLOSED

  - id: "GAP-113-03"
    title: "InteractionOrchestrator cannot query prior request sequence for context"
    severity: P0
    source: "2026-03-03 architecture review"
    evidence: |
      InteractionOrchestrator.process_comprehension() (line 444) processes each
      request in isolation. No mechanism to query "last N user requests" from
      conversations.db. The turn_number counter increments in-memory only.
      Result: no cumulative context building across turns.
    action_ref: "phase-113-c"
    status: CLOSED

  - id: "GAP-113-04"
    title: "No request-to-response correlation ID for end-to-end tracing"
    severity: P1
    source: "2026-03-03 architecture review"
    evidence: |
      MasterOrchestrator generates AC markers (AC-MASTER-PROCESS-{timestamp}) but
      these are not linked to a persistent request_id in any database table.
      The AC marker is ephemeral — generated from timestamp, not from a stored
      request record. No foreign key links request → intent → execution → response.
    action_ref: "phase-113-a"
    status: CLOSED

  - id: "GAP-113-05"
    title: "challenge_decisions.user_request_hint truncated to 100 chars"
    severity: P1
    source: "2026-03-03 architecture review"
    evidence: |
      InteractionOrchestrator._persist_challenge_decision() stores
      user_request_hint = user_request[:100]. This truncation loses context
      for long requests. Should reference full request via request_id FK
      instead of duplicating truncated text.
    action_ref: "phase-113-c"
    status: CLOSED
    closed_at: "2026-03-02"
    resolution: |
      Added request_id TEXT nullable column to challenge_decisions table via
      backward-compatible ALTER TABLE (try/except for SQLite). Updated
      _log_challenge_decision() to accept request_id=None. MasterOrchestrator
      injects request_id into RoundContext.metadata; execute_turn_with_challenge()
      extracts and passes to _log_challenge_decision(). 7 GREEN tests in
      tests/orchestrators/core/test_challenge_decisions_request_id.py.

  - id: "GAP-113-06"
    title: "Cross-platform hardening — bare read_text() and relative_to() calls"
    severity: P1
    category: CROSS_PLATFORM
    description: |
      765 bare Path.read_text() calls without encoding= parameter cause
      UnicodeDecodeError on Windows (cp1252 default). 226 bare relative_to()
      calls produce backslash paths that fail frozenset lookups using forward
      slashes. Added safe_read_text() and normalize_rel_path() utilities to
      cortex/core/common/file_utils.py. Hardened all preflight test files.
      Created tests/preflight/test_cross_platform_hardening.py (7 tests)
      as a ratchet guard to prevent regressions.
    action_ref: "phase-113-0"
    status: CLOSED

  - id: "GAP-113-07"
    title: "MCP cortex_context tool — expose request history via MCP"
    severity: P2
    category: MCP_INTEGRATION
    description: |
      Once RequestLogManager and ConversationStateManager are wired (sub-phases
      A-C), expose the request context chain via a new MCP tool cortex_context
      with operations: op=query_prior (last N requests), op=get_session
      (full session history), op=search_history (semantic search across
      prior requests). This enables the host LLM to reference prior user
      requests for cumulative context without InteractionOrchestrator
      needing to embed it in every turn payload.
    action_ref: "phase-113-d"
    status: CLOSED
    closed_at: "2026-03-02"
    resolution: |
      Created cortex/mcp/tools/cortex_context.py (CortexContext Tool ABC).
      Ops: query_prior, get_session, search_history — all backed by
      RequestLogManager. Registered as MCP tool #31 in
      cortex/mcp/tools/__init__.py ALL_TOOLS list.
      17 GREEN tests in tests/mcp/tools/test_cortex_context.py.

