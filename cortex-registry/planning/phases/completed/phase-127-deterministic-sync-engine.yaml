# ──────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────────────────────────────────────────────
background: |
  Source: User review session 2026-03-04 — identified the old 4-gate sync pipeline
  (PULL→DIFF→SANITIZE→MERGE via GitOrchestrator + SanitizationOrchestrator) was
  non-deterministic (SHA-based with no checksum tracking), had no SSOT policy engine,
  no security danger scan, no Windows long-path support, and generated ad-hoc scripts
  instead of using a prebuilt, versionable engine.

  Target outcome: A deterministic, safe, Windows-first sync system that:
  - Uses a prebuilt, parameterised CLI engine (cortex/tools/cortex_sync.py)
  - Applies a single-source-of-truth allow/deny policy
  - Tracks file baselines with checksums for three-way merge
  - Emits proof artifacts (manifest.json, patches/) for auditability
  - Never silently clobbers existing downstream work
  - Runs identically on Windows (long-path, CRLF) and macOS/Linux

  Baseline measurements at phase entry:
    - Smoke tests: 2582 passed
    - Preflight: 258 passed
    - cortex-sync.prompt.md: 274 lines (old 4-gate system)
    - cortex-sync-agent.md: 492 lines (old gate specs)
    - sync-workflow.yaml: 98 lines (old GitOrchestrator wiring)

# ──────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE (CORE-064) — all gaps must be CLOSED before COMPLETE
# ──────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-127-01"
    title: "Prebuilt deterministic sync engine (cortex/tools/cortex_sync.py)"
    severity: P0
    source: "User review 2026-03-04 — ad-hoc script generation must be replaced"
    evidence: |
      Old sync system invoked SanitizationOrchestrator and GitOrchestrator dynamically
      with no stable CLI. Engine was effectively re-generated each session. No baseline
      tracking, no idempotency guarantee, no security scan.
    action_ref: "phase-127-a"
    status: CLOSED
    closed_by: "cortex/tools/cortex_sync.py — stdlib-only CLI with 6-stage engine,
      SYNC_POLICY SSOT, FileDecision enum, SyncManifest, three-way merge, Windows
      long-path support, CRLF normalisation, security danger scan, argparse CLI."

  - id: "GAP-127-02"
    title: "SSOT allow/deny policy engine"
    severity: P0
    source: "User review 2026-03-04 — no single source of truth for sync rules"
    evidence: |
      Old exclusion list was embedded in the prompt and agent separately.
      No programmatic enforcement. Policy drift possible between prompt, agent, workflow.
    action_ref: "phase-127-b"
    status: CLOSED
    closed_by: "SYNC_POLICY dict in cortex/tools/cortex_sync.py is the SSOT.
      sync-workflow.yaml contains a documentation-only policy_mirror block.
      cortex-sync.prompt.md references the engine as authoritative."

  - id: "GAP-127-03"
    title: "Three-way merge with baseline checksum tracking"
    severity: P1
    source: "User review 2026-03-04 — old system overwrote or git-merged only"
    evidence: |
      Old Gate 4 used git merge-file with last_sync_sha as base. If target had
      diverged significantly or git history was unavailable, merge failed silently.
      No checksum-based baseline persistence between sync sessions.
    action_ref: "phase-127-c"
    status: CLOSED
    closed_by: "_three_way_merge() in cortex_sync.py uses difflib.SequenceMatcher
      in-process. Baselines stored as .cortex-sync/baselines/*.baseline.json.
      No git dependency for merge — works on any copy of the target folder."

  - id: "GAP-127-04"
    title: "SYNC Response Template in cortex-response-templates.md"
    severity: P1
    source: "User review 2026-03-04 — no Copilot Chat rendering spec for sync runs"
    evidence: |
      The old SYNC mode entry in ## 🎭 RESPONSE TEMPLATES BY MODE referenced only
      '4-gate pipeline: PULL→DIFF→SANITIZE→MERGE' with no dedicated template section.
      No stage-list+bar format, no summary table, no conflicts section defined.
    action_ref: "phase-127-d"
    status: CLOSED
    closed_by: "## 🔄 SYNC Mode Response Template section added to
      cortex-response-templates.md with stage-list+bar, summary table,
      context chip, exclusions section, conflicts/warnings, next-action line."

  - id: "GAP-127-05"
    title: "Golden tests for sync policy, idempotency, exclusions"
    severity: P1
    source: "User review 2026-03-04 — no test coverage for allow/deny rules"
    evidence: |
      No tests existed for: _workspaces/ exclusion, cortex-registry/company/repos exclusion,
      cortex-docs/ restriction, cortex-docs/.content/ allow_override,
      admin prompt exclusion, idempotency (second run = 0 changes),
      danger pattern detection, manifest written after apply.
    action_ref: "phase-127-e"
    status: CLOSED
    closed_by: "tests/golden/test_sync_policy.py — 23 tests GREEN covering all 8
      scenarios: _workspaces exclusion, company/repos exclusion, cortex-docs root
      denied/.content allowed, admin prompt exclusion, idempotency (second run=0),
      danger pattern detection (AWS key + RSA private key), manifest written after
      apply, SYNC_POLICY SSOT completeness."

  - id: "GAP-127-06"
    title: "Phase documentation in cortex-master.yaml and phase YAML file"
    severity: P2
    source: "THIN INDEX CONTRACT — all phases must have dedicated YAML + master pointer"
    evidence: |
      Phase 127 not yet registered in cortex-master.yaml. No phase detail file existed.
    action_ref: "phase-127-f"
    status: CLOSED
    closed_by: "This file created. cortex-master.yaml updated with thin pointer,
      planned count incremented to 2, planned_next updated."

