      - "Template hydration (YAML → executable steps)"
      - "Context management (workflow variables)"
      - "Step sequencing logic"
    acceptance_criteria:
      - "WorkflowRuntime.load_template() reads YAML"
      - "WorkflowRuntime.hydrate() resolves variables"
      - "WorkflowRuntime.execute() runs steps sequentially"
      - "18/18 unit tests passing"

  - id: "S2"
    title: "ConvergenceLoopExecutor Implementation"
    duration: "45 minutes"
    status: "planned"
    tests: 20
    deliverables:
      - "ConvergenceLoopExecutor class"
      - "Retry logic with exponential backoff"
      - "Convergence detection (success criteria)"
      - "Max retries and timeout enforcement"
    acceptance_criteria:
      - "Retries with backoff: 1s, 2s, 4s, 8s"
      - "Convergence detection on success criteria"
      - "Max retries enforced (default: 5)"
      - "20/20 unit tests passing"

  - id: "S3"
    title: "Ephemeral Storage & Templates"
    duration: "45 minutes"
    status: "planned"
    tests: 15
    deliverables:
      - ".temp/ directory management"
      - "Auto-cleanup on workflow completion"
      - "3 workflow templates (phase-execution, tdd-cycle, refactor-holistic)"
      - ".gitignore update for .temp/"
    acceptance_criteria:
      - ".temp/ created on demand"
      - "Auto-cleanup after 24 hours"
      - "3 templates validated and tested"
      - "15/15 tests passing"

  - id: "S4"
    title: "MCP Tool & Agent Integration"
    duration: "45 minutes"
    status: "planned"
    tests: 20
    deliverables:
      - "cortex_workflow_runtime MCP tool"
      - "Agent integration (complexity heuristic)"
      - "Execution monitoring and status"
      - "Integration tests (E2E)"
    acceptance_criteria:
      - "MCP tool: cortex_workflow_runtime works"
      - "Agent can invoke workflows"
      - "Real-time status monitoring"
      - "20/20 integration tests passing"

