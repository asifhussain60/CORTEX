overview:
  vision: |
    Build a template-based workflow execution system that enables CORTEX phases
    to be executed as structured workflows with retry logic, convergence gates,
    and ephemeral instance storage. Foundation for autonomous phase execution.

  problem_statement: |
    Currently workflow execution is scattered:
    - WorkflowComposer exists but not fully integrated
    - No WorkflowRuntime class for template hydration
    - No ConvergenceLoopExecutor with backoff
    - No ephemeral .temp/ storage management
    - No MCP tool for workflow execution
    - Limited agent integration with complexity heuristics
    
    Need unified runtime foundation for phases 46-47 and beyond.

  expected_outcomes:
    - "WorkflowRuntime class (template hydration + execution)"
    - "ConvergenceLoopExecutor (retry logic with exponential backoff)"
    - ".temp/ ephemeral storage (git-ignored, auto-cleanup)"
    - "3 workflow templates (phase-execution, tdd-cycle, refactor-holistic)"
    - "MCP tool: cortex_workflow_runtime"
    - "Agent integration (cortex-architect.prompt.md complexity heuristic)"
    - "73 tests passing (unit + integration)"

roi_analysis:
  cost: "3 hours (4 stages × 45min each)"
  impact: |
    Immediate:
    - Unblocks Phase 46 (Registry Consolidation)
    - Enables structured phase execution
    - Foundation for autonomous workflows
    
    Long-term:
    - Reusable runtime for all future phases
    - Reduced phase execution complexity
    - Better failure recovery and retry logic
    
  risk_mitigation: |
    - Use existing WorkflowComposer as base
    - Leverage existing cortex_workflow MCP tool
    - Small scope: 73 tests, 3 hours
    - No breaking changes to existing code

stages:
