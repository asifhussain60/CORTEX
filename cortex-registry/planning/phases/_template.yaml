# CORTEX Phase Plan Template
# Copy this file to planning/phases/planned/phase-{N}-{slug}.yaml
# Do NOT leave placeholder text — fill every field before committing
# Governance: master-plan-phase-lifecycle.yaml checkpoint-create checks this file

id: "phase-{N}"
title: "{Full descriptive title}"
created: "{YYYY-MM-DD}"
status: PLANNED  # PLANNED | ACTIVE | COMPLETE | DEFERRED | ARCHIVED
priority: P0     # P0 | P1 | P2
governance_authority:
  - CORE-008  # TDD mandatory — add applicable rules
  - CORE-064  # Sweep Completeness Contract — always include
  - CORE-068  # Universal Convergence Gate — mandatory for code-modifying phases
sweep_catalogue_id: "SWEEP-{N}-{SLUG}"

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND — why this phase exists, what triggered it
# ─────────────────────────────────────────────────────────────────────────────
background: |
  Source: {review file or chat session that identified the need}
  Score at entry: {X.X / 10}
  Target score: {Y.Y / 10}
  Baseline measurements:
    - Smoke tests: {N} passed
    - Relevant metrics: {value}
  Git prerequisite: {branch/merge state}

# ─────────────────────────────────────────────────────────────────────────────
# GAP CATALOGUE — all open issues this phase addresses (CORE-064)
# Every gap here must be CLOSED before this phase can be marked COMPLETE.
# ─────────────────────────────────────────────────────────────────────────────
sweep_catalogue:
  - id: "GAP-{N}-01"
    title: "{gap title}"
    severity: P1  # P0 | P1 | P2
    source: "{review or audit session}"
    evidence: |
      {specific evidence: file paths, line numbers, grep output}
    action_ref: "phase-{N}-a"
    status: OPEN  # OPEN | IN_PROGRESS | CLOSED

# ─────────────────────────────────────────────────────────────────────────────
# SEQUENTIAL EXECUTION CONTRACT (MANDATORY — CORE-008 + CORE-064)
# ─────────────────────────────────────────────────────────────────────────────
# This phase is executed AS A WHOLE, sequentially, sub-phase by sub-phase.
# No sub-phase may start until the preceding sub-phase passes its completion_gate.
# No partial execution. No decomposition into separate sessions without all gates
# passing. The phase is COMPLETE only when every sweep_catalogue gap is CLOSED
# and the final smoke gate passes.
sequential_execution_contract:
  policy: STRICT_SEQUENTIAL          # sub-phases run in order, each gate blocks next
  partial_completion_allowed: false  # a phase may NOT be declared COMPLETE with open GAPs
  decomposition_allowed: false       # do NOT split this phase across separate phases
  phase_atomic: true                 # entire phase must run to completion for max ROI
  gate_on_failure: HALT              # if any completion_gate fails → stop, fix, rerun gate
  tdd_cycle_mandatory: true          # every sub-phase must complete RED→GREEN→REFACTOR

# ─────────────────────────────────────────────────────────────────────────────
# PHASES — ROI-ordered, TDD-gated sub-phases
# Each sub-phase is ATOMIC: RED → GREEN → REFACTOR must all complete before
# the completion_gate is checked and the next sub-phase is unblocked.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: "phase-{N}-a"
    title: "{sub-phase title}"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-{N}-01"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "{N hours | N days}"
    depends_on: []                   # first sub-phase — no prior gate required
    prerequisite: "smoke tests green (≥N baseline)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    # ── TDD Cycle (CORE-008 — all three phases are MANDATORY and ATOMIC) ────
    tdd_cycle:
      red:
        action: "Write ALL failing tests listed in tdd_sequence.red BEFORE any implementation"
        gate: "python3 scripts/run_tests.py file tests/{path}/test_{slug}_a.py — ALL listed tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails (import errors count as FAIL)"
      green:
        action: "Write minimum implementation to turn ALL RED tests GREEN — no gold-plating"
        gate: "python3 scripts/run_tests.py file tests/{path}/test_{slug}_a.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Clean up: type hints (CORE-011), docstrings (CORE-012), deduplication (CORE-035), complexity"
        gate: "python3 scripts/run_tests.py dir tests/{affected_dir}/ — zero regressions, zero new failures"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    # ── Convergence Gate (CORE-068 — MANDATORY for all code-modifying sub-phases) ──
    # After REFACTOR, rescan for issues introduced by the changes themselves.
    # Work is NOT complete in a single pass. Loop until clean or max_cycles hit.
    convergence_gate:
      detect_step: "python3 scripts/run_tests.py smoke + cortex_validate op=compliance"
      fix_step: "Apply targeted fixes for each issue found in rescan"
      success_predicate: "p0_count == 0 and p1_count == 0 and new_failures == 0"
      max_cycles: 3
      backoff_strategy: none
      on_exhaustion: "Log remaining issues with WONT-FIX justification — do NOT silently skip"
      primitive_ref: "primitives/validation/detect-fix-rescan-loop"
      blocks_ac_complete: true
      governance: "CORE-068 (Universal Convergence Gate)"

    tdd_sequence:
      red:
        - "test_{specific_case_1} — {what it asserts}"
        - "test_{specific_case_2} — {what it asserts}"
      green:
        - "Implement {class/function} to satisfy test_{case_1}"
        - "Implement {class/function} to satisfy test_{case_2}"
      refactor:
        - "Add docstrings to all public methods (CORE-012)"
        - "Verify type hints on all signatures (CORE-011)"
        - "Confirm no duplicate implementations exist (CORE-035)"

    acceptance_criteria:
      - "{specific, measurable condition — e.g. 'StackBuilder.resolve() returns None for unknown stack_id'}"
      - "All tdd_sequence.red tests GREEN"
      - "REFACTOR gate passes with zero regressions"

    # ── Completion Gate — blocks next sub-phase if any check fails ──────────
    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/{affected_dir}/"
      min_tests_pass: N              # explicit count — never omit
      zero_new_failures: true
      all_gap_refs_closed: true      # CORE-064: every gap in gap_refs must be CLOSED
      blocks_next_sub_phase: true    # hard block — next sub-phase MUST NOT start if gate fails

  - id: "phase-{N}-b"
    title: "{next sub-phase title}"
    priority: P0
    status: PLANNED
    gap_refs: ["GAP-{N}-02"]
    governance_authority: "CORE-008, CORE-035, CORE-064"
    duration_estimate: "{N hours | N days}"
    depends_on: ["phase-{N}-a"]     # HARD DEPENDENCY — gate from phase-{N}-a must PASS first
    prerequisite: "phase-{N}-a completion_gate PASSED (all_gap_refs_closed: true)"
    regression_gate: "python3 scripts/run_tests.py smoke — zero new failures"

    tdd_cycle:
      red:
        action: "Write ALL failing tests listed in tdd_sequence.red BEFORE any implementation"
        gate: "python3 scripts/run_tests.py file tests/{path}/test_{slug}_b.py — ALL listed tests must FAIL"
        blocker: "Do NOT write implementation code until every listed test fails"
      green:
        action: "Write minimum implementation to turn ALL RED tests GREEN"
        gate: "python3 scripts/run_tests.py file tests/{path}/test_{slug}_b.py — ALL tests must PASS"
        blocker: "Do NOT begin REFACTOR until every test passes"
      refactor:
        action: "Clean up: type hints, docstrings, deduplication, complexity"
        gate: "python3 scripts/run_tests.py dir tests/{affected_dir}/ — zero regressions"
        blocker: "Do NOT mark sub-phase COMPLETE until REFACTOR gate passes"

    tdd_sequence:
      red:
        - "test_{specific_case_3} — {what it asserts}"
      green:
        - "Implement {class/function} to satisfy test_{case_3}"
      refactor:
        - "Add docstrings, type hints, confirm CORE-035"

    acceptance_criteria:
      - "{specific, measurable condition}"
      - "All tdd_sequence.red tests GREEN"
      - "REFACTOR gate passes with zero regressions"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py dir tests/{affected_dir}/"
      min_tests_pass: N
      zero_new_failures: true
      all_gap_refs_closed: true
      blocks_next_sub_phase: true

  # ── FINAL sub-phase: Smoke Gate + CORE-064 Close ─────────────────────────
  - id: "phase-{N}-final"
    title: "Smoke Gate + CORE-064 Sweep Close + cortex-master.yaml update"
    priority: P0
    status: PLANNED
    gap_refs: []                     # all gaps already closed in preceding sub-phases
    depends_on: ["phase-{N}-b"]     # last implementation sub-phase
    prerequisite: "ALL preceding sub-phase completion_gates PASSED"
    regression_gate: "python3 scripts/run_tests.py smoke — ≥N smoke tests pass"

    tdd_cycle:
      red:
        action: "N/A — this sub-phase is a verification gate, not an implementation sub-phase"
        gate: "All sweep_catalogue entries verified CLOSED before proceeding"
        blocker: "Do NOT run smoke gate if any GAP remains OPEN"
      green:
        action: "Run full smoke gate — confirm ≥N tests pass with zero regressions"
        gate: "python3 scripts/run_tests.py smoke"
        blocker: "Do NOT mark phase COMPLETE if smoke gate fails"
      refactor:
        action: "Update phase YAML: move planned/ → completed/, update cortex-master.yaml status → COMPLETE"
        gate: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/cortex-master.yaml'))\" — YAML valid"
        blocker: "Do NOT close phase without cortex-master.yaml update"

    acceptance_criteria:
      - "ALL sweep_catalogue GAPs have status: CLOSED"
      - "python3 scripts/run_tests.py smoke passes ≥N tests"
      - "Zero new test failures vs baseline"
      - "phase-{N} detail file moved: planned/ → completed/"
      - "cortex-master.yaml entry updated to status: COMPLETE"
      - "cortex-master.yaml remains ≤500 lines (THIN INDEX CONTRACT)"

    completion_gate:
      test_runner_command: "python3 scripts/run_tests.py smoke"
      min_tests_pass: N
      zero_new_failures: true
      all_gap_refs_closed: true      # CORE-064: final check — ALL phase GAPs CLOSED
      blocks_next_sub_phase: false   # last sub-phase — no next to block

# ─────────────────────────────────────────────────────────────────────────────
# AC MARKERS
# ─────────────────────────────────────────────────────────────────────────────
ac_markers:
  start: "AC_START: AC-{N}-{SLUG}-{timestamp}"
  complete: "AC_COMPLETE: AC-{N}-{SLUG}-{timestamp} ✅"

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTION TIER (OPTIONAL — model-tiering policy for sub-phases)
# GAP-82-14: enables plan-on-capable-model + execute-on-cheap-model workflow
# ─────────────────────────────────────────────────────────────────────────────
# Uncomment and populate when this phase uses model-tiering (BLOCK-EXECUTION-SPEC).
#
# execution_tier:
#   plan: x3        # model tier that writes the execution spec (claude-3-7-sonnet or equivalent)
#   execute: haiku  # model tier that follows the spec verbatim (cheaper model safe to delegate)
#   escalate_to: x3 # model tier that receives BLOCK-DEVIATION-ALERT escalations
#   safe_to_delegate: true  # derived: true when ALL tdd_sequence.green steps are verbatim
#
# Rules for safe_to_delegate: true:
#   - All green steps have exact file paths and exact commands (no abstract language)
#   - completion_gate has machine-checkable assertions
#   - No step contains abstract language ('refactor cleanly', 'improve design')
#   - BLOCK-DEVIATION-ALERT is wired for any unexpected divergence

