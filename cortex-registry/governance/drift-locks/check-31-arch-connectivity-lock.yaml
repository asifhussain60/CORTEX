  Registry → Workflow.

invariants:
  - id: "INV-31-01"
    title: "InteractionOrchestrator health_check returns healthy"
    description: >
      InteractionOrchestrator must be importable and its health_check() method
      must return a dict with status == "healthy".
    enforcement: "HARD — import + runtime assertion"
    test_method: "test_interaction_orchestrator_health_returns_healthy"

  - id: "INV-31-02"
    title: "ASTAnalyzer.analyze_file(Path) returns success=True"
    description: >
      ASTAnalyzer must be importable and analyze_file(Path) must return an
      ASTAnalysisResult dataclass with success=True and at least one non-empty
      function or class list when analysing a real cortex source file.
    enforcement: "HARD — import + runtime assertion"
    test_method: "test_lens_analyzers_return_non_empty_analysis"

  - id: "INV-31-03"
    title: "IntelligenceFacade.analyze() returns dict with 'status' key"
    description: >
      get_intelligence_facade() must return a singleton and analyze() must
      return a non-None dict containing the 'status' key.
    enforcement: "HARD — import + runtime assertion"
    test_method: "test_intelligence_facade_analyze_returns_live_data"

  - id: "INV-31-04"
    title: "cortex-registry governance YAMLs are parseable"
    description: >
      The primary governance YAML (cortex-registry/governance/core-rules.yaml)
      and audit checklist YAML must exist on disk and be parseable by
      yaml.safe_load without error.
    enforcement: "HARD — file existence + yaml.safe_load"
    test_method: "test_governance_yaml_parseable"

  - id: "INV-31-05"
    title: "IMPLEMENT workflow template exists and is parseable"
    description: >
      cortex-registry/workflows/templates/sdlc/implement-workflow.yaml must
      exist on disk and be parseable by yaml.safe_load.
    enforcement: "HARD — file existence + yaml.safe_load"
    test_method: "test_implement_template_parseable"

  - id: "INV-31-06"
    title: "WorkflowComposer.execute_from_template resolves IMPLEMENT template"
    description: >
      WorkflowComposer must be importable and execute_from_template("sdlc/implement-workflow")
      must return a non-None result without raising ImportError or FileNotFoundError.
    enforcement: "HARD — import + runtime assertion"
    test_method: "test_workflow_composer_resolves_implement_template"

