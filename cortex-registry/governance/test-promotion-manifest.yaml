# =============================================================================
# CORTEX Test Promotion Manifest
# =============================================================================
#
# Authority:  Phase 49 — Golden Test Promotion Pipeline
# Location:   cortex-registry/governance/test-promotion-manifest.yaml
# Status:     PLANNED (re-generated at Phase 49 GREEN time)
# Created:    2026-02-18
# Author:     Asif Hussain
#
# PURPOSE
# -------
# Machine-readable catalog of all 250 non-golden test files that scored
# >= 40 on the 7-signal promotion scoring algorithm.
# Used by:
#   - TestClassifierOrchestrator: classify() reads golden_paths patterns
#   - ParallelGoldenRunner: groups by domain for worker assignment
#   - cortex_health_orchestrate(operation='classify'): MCP-exposed lookup
#   - Pre-commit hook: validates new files against manifest tiers
#   - CI/CD: enforces CORE-055 by checking manifest at push time
#
# SCORING SIGNALS (7 signals, max 160 points)
# --------------------------------------------
# S1 MASTER_ORCH  +40  References MasterOrchestrator or TDDOrchestrator
# S2 SECURITY     +30  Contains secrets/AES/encryption/injection logic
# S3 GOVERNANCE   +20  References 3+ CORE rules explicitly
# S4 AC_ID        +15  Contains AC-ID or AC_START architecture control ID
# S5 E2E          +10  Covers end-to-end/integration/pipeline path
# S6 COVERAGE_MATRIX +25  Already has P0/P1 scenario tiers
# S7 MCP          +20  Tests MCP tool or cortex_process_request entry point
#
# AC-ID: AC-P49-MANIFEST-001
# =============================================================================

manifest:
  version: "1.0.0"
  generated: "2026-02-18"
  phase: "phase-49"
  algorithm_version: "7-signal-v1"
  total_candidates: 250
  promotion_policy:
    p0:
      label: "Promote immediately (Phase 49)"
      threshold: 100
      action: "promote_and_restructure"
      count: 12
    p1:
      label: "Promote next cycle (Phase 50)"
      threshold: 70
      action: "flag_for_promotion"
      count: 64
    p2:
      label: "Evaluate manually (Phase 51+)"
      threshold: 40
      action: "annotate_for_review"
      count: 174
    standard:
      label: "No action"
      threshold: 0
      action: "no_action"
      count: 727

  # ---------------------------------------------------------------------------
  # CLASSIFIER RULES (source of truth for TestClassifierOrchestrator)
  # ---------------------------------------------------------------------------
  classifier_rules:
    golden_paths:
      - pattern: "cortex/orchestrators/"
        required_concerns: [SECURITY, QUALITY, CCL]
        coverage_floor: 95
        target_root: "tests/golden/orchestrators/"

      - pattern: "cortex/mcp/tools/"
        required_concerns: [SECURITY, CONTRACT]
        coverage_floor: 95
        target_root: "tests/golden/mcp/tools/"

      - pattern: "cortex/governance/"
        required_concerns: [SECURITY, QUALITY]
        coverage_floor: 95
        target_root: "tests/golden/governance/"

      - pattern: "cortex/brain/"
        required_concerns: [CCL, QUALITY]
        coverage_floor: 95
        target_root: "tests/golden/brain/"

      - pattern: "cortex/intelligence/"
        required_concerns: [CCL, SECURITY]
        coverage_floor: 95
        target_root: "tests/golden/intelligence/"

      - pattern: "cortex/domain_brain/"
        required_concerns: [CCL]
        coverage_floor: 95
        target_root: "tests/golden/domain_brain/"

      - pattern: "cortex/agents/"
        required_concerns: [SECURITY, CONTRACT]
        coverage_floor: 95
        target_root: "tests/golden/agents/"

    standard_paths:
      - pattern: "cortex/common/"
        required_concerns: [QUALITY]
        coverage_floor: 80
        target_root: "tests/unit/common/"

      - pattern: "cortex/config/"
        required_concerns: []
        coverage_floor: 80
        target_root: "tests/unit/config/"

      - pattern: "cortex/models/"
        required_concerns: []
        coverage_floor: 80
        target_root: "tests/unit/models/"

      - pattern: "cortex/templates/"
        required_concerns: []
        coverage_floor: 80
        target_root: "tests/unit/templates/"

    default:
      tier: "STANDARD"
      required_concerns: []
      coverage_floor: 80

  # ---------------------------------------------------------------------------
  # CONCERN DEFINITIONS
  # ---------------------------------------------------------------------------
  concerns:
    SECURITY:
      pytest_marker: "security"
      description: "Test class MUST cover: auth bypass, injection, path traversal, secret exposure"
      minimum_test_classes: 1

    QUALITY:
      pytest_marker: "quality"
      description: "Coverage matrix header required, P0/P1/P2 tiers declared, coverage_floor asserted"
      minimum_test_classes: 1

    CCL:
      pytest_marker: "ccl"
      description: "At least 1 test validates CCL timeout (<=500ms) and cold-start fallback"
      minimum_test_classes: 1

    PERF:
      pytest_marker: "perf"
      description: "At least 1 test asserts latency SLA (<300ms per documented CCL SLA)"
      minimum_test_classes: 1

    CONTRACT:
      pytest_marker: "contract"
      description: "At least 1 test validates input/output schema (pydantic or YAML schema)"
      minimum_test_classes: 1

  # ---------------------------------------------------------------------------
  # REQUIRED GOLDEN FILE STRUCTURE (enforced by CORE-055)
  # ---------------------------------------------------------------------------
  golden_file_template:
    required_header_elements:
      - "Module docstring with TEST COVERAGE MATRIX"
      - "P0 (Critical Path - Sunshine scenarios)"
      - "P1 (Important - Rainy Day scenarios)"
      - "P2 (Edge Cases - Blind Spots)"
      - "AC-ID: AC-{PHASE}-{DOMAIN}-{NUMBER}"
    required_markers:
      - "@pytest.mark.golden  (always)"
      - "@pytest.mark.{concern}  (one per required concern)"
    coverage_floor_assertion: |
      # Assert in conftest.py or test teardown:
      # assert coverage_percent >= TestDecision.coverage_floor

