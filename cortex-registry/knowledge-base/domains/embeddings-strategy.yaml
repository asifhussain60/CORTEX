# Embeddings Strategy
# CORTEX Knowledge Base - Domain Integration
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "domain-integration"
  subcategory: "embeddings"

# Embedding Models Comparison
models:
  openai_ada_002:
    dimensions: 1536
    max_tokens: 8191
    cost_per_1M_tokens: "$0.10"
    performance: "excellent"
    use_case: "General purpose, production RAG"
    
  openai_text_embedding_3_small:
    dimensions: 1536
    cost_per_1M_tokens: "$0.02"
    performance: "good"
    use_case: "Cost-sensitive applications"
    
  openai_text_embedding_3_large:
    dimensions: 3072
    cost_per_1M_tokens: "$0.13"
    performance: "best"
    use_case: "Maximum accuracy needs"
    
  cohere_embed_v3:
    dimensions: 1024
    cost_per_1M_tokens: "$0.10"
    performance: "excellent"
    features: ["compression", "multilingual"]
    
  sentence_transformers:
    cost: "Free (self-hosted)"
    popular_models:
      - "all-MiniLM-L6-v2 (384 dim, fast)"
      - "all-mpnet-base-v2 (768 dim, accurate)"
    use_case: "Self-hosted, privacy-sensitive"

# Optimization Strategies
optimization:
  dimensionality_reduction:
    techniques:
      - "PCA (Principal Component Analysis)"
      - "Matryoshka embeddings (configurable dimensions)"
    benefit: "Reduce storage by 50-75%"
    
  caching:
    strategy: "Hash-based cache for repeated texts"
    storage: "Redis with TTL or persistent disk"
    
  batch_processing:
    recommendation: "Batch size 32-128 for API calls"
    speedup: "5-10x faster than individual calls"

# Quality Evaluation
evaluation:
  metrics:
    - "Cosine similarity distribution"
    - "Retrieval accuracy (recall@K)"
    - "Speed (embeddings/second)"
  
  testing:
    - "Create test query-document pairs"
    - "Measure retrieval accuracy"
    - "A/B test different models"

related_knowledge:
  - "vector-database-guide.yaml"
  - "retrieval-pipeline.yaml"
