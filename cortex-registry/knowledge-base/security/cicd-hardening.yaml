id: "cicd-hardening"
title: "CI/CD Pipeline Hardening"
owner: "CORTEX Security Governance"
source_of_truth: "Platform Security Baseline"
summary: "Controls for securing build and deployment pipelines."
controls:
  - "Require signed commits and protected main branch"
  - "Pin dependency versions and verify checksums"
  - "Run SAST, secret scanning, and dependency audit on PR"
  - "Use least-privilege CI service accounts"
  - "Enforce artifact provenance and immutable releases"
