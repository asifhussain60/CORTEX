id: "owasp-top10"
title: "OWASP Top 10 Security Guidelines — CORTEX Framework"
version_ref: "OWASP Top 10 2021"
authority: "cortex-registry/knowledge-base/security/owasp-top10.yaml"
status: "active"
maintained_by: "CORTEX Architecture"
last_reviewed: "2026-03-04"

description: |
  CORTEX security posture mapped against the OWASP Top 10 (2021 edition).
  Every item is addressed either architecturally (by design) or operationally
  (via governance rules, preflight checks, or runtime enforcement).

# ── OWASP Top 10 (2021) — CORTEX Mapping ─────────────────────────────────────

items:

  - id: "A01"
    name: "Broken Access Control"
    cortex_status: "MITIGATED"
    controls:
      - "EnforcementOrchestrator validates all orchestrator routing before execution"
      - "IntentRouter rejects unknown/unregistered intent types (29 canonical intents)"
      - "MCP tool registry enforces caller context on every tool invocation"
      - "validate_orchestrator_context() guard on all MCP tool functions"
    governance_rules: ["CORE-048", "CORE-035"]
    notes: "No direct user-facing auth — CORTEX runs as a developer tool inside VS Code."

  - id: "A02"
    name: "Cryptographic Failures"
    cortex_status: "MITIGATED"
    controls:
      - "Secrets never stored in source — .env / .env.* denied by SYNC_POLICY"
      - "No plaintext credentials in cortex_sync.py SYNC_POLICY deny list"
      - "Security danger scan in cortex_sync.py blocks AKIA keys and private key headers"
      - "SQLite databases stored in .cortex-runtime/ — excluded from sync by policy"
    governance_rules: ["CORE-002"]
    notes: "CORTEX does not handle user authentication tokens directly."

  - id: "A03"
    name: "Injection"
    cortex_status: "MITIGATED"
    controls:
      - "No dynamic SQL — SQLite writes use parameterised statements throughout"
      - "No shell=True subprocess calls — drift lock test_drift_lock_no_os_system_calls enforces this"
      - "MCP stdio transport — no HTTP parsing attack surface for prompt injection at transport layer"
      - "LENS analysis sanitises user input before orchestrator dispatch"
    governance_rules: ["CORE-011", "CORE-028"]

  - id: "A04"
    name: "Insecure Design"
    cortex_status: "MITIGATED"
    controls:
      - "TDD-first development (CORE-008) — design validated by tests before implementation"
      - "Workflow Composer architecture — no ad-hoc procedural logic in prompts"
      - "Holistic validation gate (CORE-048) before every IMPLEMENT/FIX/REFACTOR"
      - "Sweep Completeness Contract (CORE-064) — no partial fixes shipped"
    governance_rules: ["CORE-008", "CORE-048", "CORE-064"]

  - id: "A05"
    name: "Security Misconfiguration"
    cortex_status: "MITIGATED"
    controls:
      - ".vscode/settings.json excluded from sync — personal MCP config never propagated"
      - "No debug flags or verbose logging enabled in production MCP server"
      - "36 governance YAMLs enforce configuration standards at pre-commit and CI"
      - "validate-production.py checks 26 production-readiness criteria at every release"
    governance_rules: ["CORE-035"]

  - id: "A06"
    name: "Vulnerable and Outdated Components"
    cortex_status: "MONITORED"
    controls:
      - "requirements.txt pinned versions — validated at session start by UpgradeOrchestrator"
      - "cortex_check_dependency_drift MCP tool detects drift between requirements.txt and installed packages"
      - "CORTEX_SKIP_PREFLIGHT guard for CI; preflight hard-stops on missing critical packages"
    governance_rules: []
    notes: "Automated dependency update workflow is planned (post-Phase 127)."

  - id: "A07"
    name: "Identification and Authentication Failures"
    cortex_status: "N/A"
    controls:
      - "CORTEX is a developer toolchain — no end-user authentication layer"
      - "MCP server runs on stdio transport inside VS Code — process-level isolation is the boundary"
      - "GitHub Copilot handles LLM authentication; CORTEX does not store tokens"
    notes: "Not applicable to the CORTEX architecture category."

  - id: "A08"
    name: "Software and Data Integrity Failures"
    cortex_status: "MITIGATED"
    controls:
      - "cortex_sync.py three-way merge with checksums — never silently overwrites target edits"
      - "AC_START / AC_COMPLETE markers with SQLite audit log — every orchestrator action traced"
      - "Manifest.json written after every sync apply — proof artifact with checksums"
      - "Git checkpoint primitive before every code-modifying workflow"
    governance_rules: ["CORE-064"]

  - id: "A09"
    name: "Security Logging and Monitoring Failures"
    cortex_status: "MITIGATED"
    controls:
      - "7 SQLite databases in .cortex-runtime/ — full audit trail for orchestrator actions"
      - "Prometheus metrics exposed at /metrics — scrape config in deployment/prometheus.yml"
      - "OpenTelemetry tracing in cortex/opentelemetry_tracing.py"
      - "RCA Memory Engine (cortex/intelligence/learning/rca_engine.py) — 4 methodology root cause analysis"
      - "Health orchestrator — 22 health endpoints across all domains"
    governance_rules: []

  - id: "A10"
    name: "Server-Side Request Forgery (SSRF)"
    cortex_status: "N/A"
    controls:
      - "CORTEX does not make outbound HTTP requests on behalf of users"
      - "MCP server is a stdio process — no HTTP server surface in production mode"
      - "LLM calls are made by GitHub Copilot host, not by CORTEX orchestrators"
    notes: "Not applicable — no user-controlled URL-fetch capability in CORTEX."

# ── Additional Security Controls ──────────────────────────────────────────────

additional_controls:
  sync_security:
    description: "cortex_sync.py SYNC_POLICY security guarantees"
    controls:
      - "Danger pattern scan blocks AKIA keys, RSA private key headers, bearer tokens before copy"
      - "Patch proposals staged for human review — never auto-applied"
      - "_workspaces/** and cortex-registry/company/** architecturally excluded from sync"
      - ".env and .env.* always denied — secrets never synced"

  governance_enforcement:
    description: "Runtime governance controls"
    controls:
      - "EnforcementOrchestrator runs at pre-commit and CI — 36 YAML rules"
      - "Drift lock tests (Checks 30–41) enforce invariants across every PR"
      - "No os.system() calls without platform guard — enforced by preflight"
      - "No hardcoded POSIX paths — enforced by test_windows_boot_wiring.py"

references:
  - url: "https://owasp.org/Top10/"
    title: "OWASP Top 10 — 2021"
  - url: "https://owasp.org/www-project-top-ten/"
    title: "OWASP Top Ten Project"
