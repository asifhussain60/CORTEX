id: "secrets-patterns"
title: "Secrets Management Patterns"
owner: "CORTEX Security Governance"
source_of_truth: "Security Operations Standards"
summary: "Operational patterns for safe secret storage, access, and rotation."
patterns:
  - "Store secrets in managed vaults, never in source control"
  - "Use short-lived credentials with automatic rotation"
  - "Scope secrets by environment and service boundary"
  - "Audit secret access and alert on anomalous reads"
  - "Mask secrets in logs, traces, and test fixtures"
