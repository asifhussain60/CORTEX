autonomous_execution_framework:
  execution_mode: "SILENT_AUTONOMOUS"
  progress_contract: "minimal autonomous status deltas only"
  strict_phase_order: true
  test_execution_mode: "PARALLEL_WORKERS"
  test_worker_selection:
    strategy: "min(8, logical_cpu_count)"
    rationale: "scripts/run_tests.py caps xdist workers at 8 on macOS due known scheduler race above ~10 workers; host logical_cpu_count=10 resolves to 8 workers."
    selected_workers: 8
    enforcement: "All phase regression/completion gates MUST run with CORTEX_WORKERS=8 unless a lower stable value is required by environment constraints."
  test_commands:
    smoke: "CORTEX_WORKERS=8 python3 scripts/run_tests.py smoke"
    preflight: "CORTEX_WORKERS=8 python3 scripts/run_tests.py preflight"
  continuation_required: false
  intent_reflection_required: false
  proceed_approval_required: false

  # ── STOP POLICY (hard contract — all stops prohibited) ───────────────────
  stop_policy:
    all_stops_prohibited: true
    proceed_gate_prohibited: true           # ⚡ Proceed Gate block MUST NOT be emitted
    next_phase_prompt_prohibited: true      # 🚀 Next Phase block MUST NOT be emitted
    intent_reflection_prohibited: true      # Intent Reflection block MUST NOT be emitted
    mid_phase_pause_prohibited: true        # No pausing between sub-phases
    auto_chain_next_phase: true             # Immediately begin next dependency-valid phase
    core_resp_001_override: "AUTONOMOUS_PHASE_CHAIN"  # Overrides CORE-RESP-001 end-state contract for this plan
    core_resp_001_suppressed_blocks:
      - "### ⚡ If you say proceed, I will:"
      - "### 🚀 Next Phase"
      - "⚡ Proceed Gate"
    permitted_output_after_phase:
      - "✅ Phase {id} complete. — one line only"
      - "Progress: {completed}/{total} lines — one line only"
      - "Immediate continuation into next phase with no user prompt"
  # ─────────────────────────────────────────────────────────────────────────

  completion_response_contract:
    required_final_line: "✅ Phase {id} complete."
    required_executive_summary_line: "Progress: {completed}/{total} phases ({completion_percentage}%) · Completed {completed_phase_id} · Active {next_phase_id_or_all_complete}"
    required_next_block: "none"
    prohibited_blocks:
      - "### ⚡ If you say proceed, I will:"
      - "### 🚀 Next Phase"
      - "⚡ Proceed Gate"
      - "Intent Reflection"
    next_phase_resolution: "first PLANNED phase in dependency-valid order"
    continuation_behavior: "Upon phase completion emit the required_final_line and required_executive_summary_line only, then immediately begin the next dependency-valid phase — no proceed gate, no user prompt, no next phase block."
  fail_safe:
    max_convergence_cycles: 3
    unresolved_p0_p1_blocks_completion: true
    rollback_required_before_retry: true
  autonomous_end_to_end:
    enabled: true
    description: |
      CORTEX-V2 executes fully autonomously end-to-end across all M phases without any stops, continuation prompts, proceed gates, intent reflection blocks, or 🚀 Next Phase confirmation blocks. Each M phase chains immediately into the next upon completion. User interaction is required only for explicit intervention or error recovery that cannot be self-resolved within max_convergence_cycles.
    workflow:
      - "Read and validate migration plan. Build phase status map."
      - "Begin execution at first PLANNED phase whose depends_on are all COMPLETE."
      - "Execute each phase and sub-phase sequentially. Enforce completion and convergence gates."
      - "On completion: emit ✅ Phase {id} complete. + Progress line. Begin next phase immediately."
      - "Never emit ⚡ Proceed Gate, 🚀 Next Phase, or Intent Reflection blocks — these are prohibited by stop_policy."
      - "Continue until all phases are COMPLETE or an unrecoverable error forces intervention."
      - "At plan completion emit final ✅ All work is complete. state and release readiness report."
    override_contract:
      - "User may intervene or override at any point via explicit command."
      - "Default mode is uninterrupted continuous autonomous execution — no stops, no prompts."

session_resume_protocol:
  trigger_phrase: "AUTO_RESUME_FROM_ACTIVE_PLAN"
  startup_actions:
    - "Read this file first and build phase status map from phase_detail_files"
    - "Identify all COMPLETE phases and verify summary counters"
    - "If counters drift from phase statuses, correct metadata and summary before execution"
    - "Select next executable phase: first PLANNED phase whose depends_on are all COMPLETE"
    - "Mark selected phase status as IN_PROGRESS and update last_updated timestamp"
  execution_rules:
    - "Run selected phase in strict sequential mode (no decomposition, no partial completion)"
    - "Enforce sub-phase completion_gate before advancing"
    - "Enforce convergence loop for P0/P1 until clear or max cycles reached"
    - "On successful phase completion: set phase status COMPLETE and increment completed/decrement planned"
    - "Immediately resolve and set next executable phase to IN_PROGRESS — begin execution without user prompt"
    - "Never request intent reflection or proceed approval while dependency-valid work remains"
    - "PROHIBITED: ⚡ Proceed Gate blocks — do not emit under any circumstance during autonomous execution"
    - "PROHIBITED: 🚀 Next Phase blocks — do not emit under any circumstance during autonomous execution"
    - "CHAIN RULE: Upon phase completion, immediately begin next dependency-valid phase in the same response turn"
  session_end_contract:
    required_final_output: "✅ Phase {id} complete. + Progress line only; full completion state only when all 13 phases are COMPLETE"
    final_output_format:
      - "✅ Phase {completed_phase_id} complete."
      - "Progress: {completed}/{total} phases ({completion_percentage}%)"
      - "Exec Summary: Completed {completed_phase_id} · Active {next_phase_id_or_all_complete}"
    prohibited_output_blocks:
      - "### ⚡ If you say proceed, I will:"
      - "### 🚀 Next Phase"
      - "⚡ Proceed Gate"
  no_next_phase_behavior:
    when_all_complete: "Emit ✅ All work is complete. and final release readiness report only"
    maintenance_prompt: "Run autonomous steady-state checks on #file:cortex-master-v2.yaml and report only deltas"

runtime_state:
