# ============================================================
# PHASE DEPENDENCY CHAIN
# ============================================================
# M1 (Dead Code) → M2 (Core Consolidation) → M3 (Intelligence) → M4 (LENS)
#                                            ↘
#                                             M5 (MCP) → M6 (YAML) → M7 (Prompts/Agents) → M8 (Tests) → M9 (Certification)
#                                                                                               ↓
#                                             M10 (Team Federation) → M11 (Agent/Skill Template Governance) → M12 (Docs IA + Final Cleanup)
#
# M1 is prerequisite for all.
