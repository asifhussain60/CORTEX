# ============================================================
# PHASE DEPENDENCY CHAIN
# ============================================================
# M1 (Dead Code) → M2 (Core Consolidation) → M3 (Intelligence) → M4 (LENS)
#                                            ↘
#                                             M5 (MCP) → M6 (YAML) → M7 (Prompts/Agents) → M8 (Tests) → M9 (Certification)
#                                                                                                               ↓
#                                             M10 (Team Federation) → M11 (Agent/Skill Template Governance) → M12 (Docs IA)
#                                                                              ↓                                    ↘
#                                                                      M14 (ADLC, Issue #19)                         M13 (Cleanup — always last, depends M12+M14+M15)
#                                                                              ↓
#                                                                      M15 (Tutorial Mode, optional mentor layer)
#
# M1 is prerequisite for all.
# M3/M4 can run in parallel with M5 (after M2).
# M7 depends on M5+M6.
# M8 mirrors all prior phases.
# M14 (ADLC) depends on M11; runs in parallel with M12.
# M15 (Tutorial Mode) depends on M11; runs in parallel with M12 and M14.
# M13 is always last — depends on M12 + M14 + M15.
# ============================================================


preservation_contract:
  v1_capability_parity_required: true
  never_regress:
    - "Workflow Composer and dedicated workflow templates remain architectural center (all orchestration/routing via YAML)"
    - "All original CORTEX intent classes and execution modes remain routable"
    - "MCP-first exposure remains mandatory for operations and governance"
    - "Orchestrator integrity and wiring contracts remain fail-close"
    - "SKILLS, agents, and subagents lifecycle remains first-class (Claude Code model is canonical for all business/technical logic)"
    - "VS Code Copilot Chat inline rendering contract remains enforced"
    - "All business/technical logic must be implemented as Claude-style agents, skills, or subagents, referenced via YAML templates"
    - "All workflow execution, migration, and cleanup actions must be routed through YAML-governed templates and phase plans"
  parity_evidence_required_in_m12: "preserved | strategic_replacement | intentional_removal ledger"
  migration_matrix:
    retain:
      - "Workflow Composer (YAML-governed orchestration/routing)"
      - "Dedicated workflow templates (declarative contracts, delegate to Claude agents/skills)"
      - "Governance, audit, compliance wrappers (CORTEX-native)"
      - "User response rendering (VSCode Copilot Chat, response templates)"
      - "Agent/skill registry and discoverability mechanisms"
    migrate:
      - "All business/technical logic from legacy orchestrators/modules to Claude-style agents, skills, subagents"
      - "Workflow template steps to invoke Claude agents/skills, not direct Python logic"
      - "Legacy orchestrators: migrate core logic to agents/skills; retain orchestration shell only for governance/routing if needed"
    sunset:
      - "Monolithic orchestrators/modules after migration is validated"
      - "Direct Python implementations of workflow steps (replace with agent/skill calls)"
      - "Ad hoc/hardcoded workflow logic (remove in favor of template-driven, agent/skill-based execution)"

workflow_template_centrality:
  composer_is_mandatory_gateway: true
  dedicated_templates_required_for:
    - development
    - refactoring
    - debugging
    - documentation_generation
    - architecture_review
    - operations
    - agent_creation
    - skill_creation
    - subagent_creation
    - evaluation_and_validation
  template_categories:
    - primitives
    - mode_workflows
    - lifecycle_workflows
    - governance_workflows
    - agent_skill_workflows
  lifecycle:
    states: ["proposed", "active", "stabilizing", "deprecated", "retired"]
    ownership: "single owning team per template; platform review required for shared primitives"
    governance: "CORE-048 + CORE-064 + CORE-068 enforced for code-modifying and generation workflows"
    composability: "primitives compose mode/lifecycle templates; inheritance allowed only via explicit primitive references"
    dynamic_enhancement_policy: "safe additive metadata and non-breaking primitive injection only"
  execution_contract:
    - "All operational work, migration, and cleanup must be executed via YAML-governed workflow templates and phase plans."
    - "No direct code or ad hoc script execution outside YAML-governed workflows."
    - "All agent/skill/subagent invocations must be referenced in workflow templates."
    - "All migration, retention, and sunsetting actions must be tracked and executed via phase YAML."

tutorial_mode_contract:
  owning_phase: "phase-m15"
  objective: "Introduce an optional teaching layer that explains completed work (what/why/how) without changing operational execution behavior."
  architecture_pattern: "Layered tutorial explanation surface attached after orchestration execution and before final response rendering."
  activation:
    states: ["on", "auto", "off"]
    default_state: "auto"
    state_behavior:
      on: "Always emit concise tutorial explanation blocks aligned to workflow/knowledge YAML references."
      auto: "Emit tutorial explanations for onboarding, learning, and explicit explain/teach intents; otherwise suppress."
      off: "Disable tutorial explanation layer and return operational response only."
    toggle_surfaces:
      - "session setting"
      - "user profile preference"
      - "per-request override flag"
  expert_user_deactivation:
    expert_default: "off"
    persistence: "Sticky profile preference — remains off across sessions until user explicitly re-enables."
    override: "Experts can temporarily enable with per-request tutorial_mode=on."
  guardrails:
    - "Tutorial output is post-execution only and cannot mutate orchestration decisions."
    - "Response token/length budgets apply; tutorial block truncates first under Copilot rendering constraints."
    - "Tutorial rendering failures are non-blocking and never prevent operational completion."

knowledge_yaml_architecture:
  canonical_ownership_model:
    global_knowledge_root: "cortex-registry/knowledge/global"
    domain_knowledge_root: "cortex-registry/knowledge/domains/<domain>"
    workflow_guidance_root: "cortex-registry/knowledge/workflow-guidance"
    skill_agent_guidance_root: "cortex-registry/knowledge/agent-skill-guidance"
  taxonomy:
    - "principles"
    - "patterns"
    - "anti_patterns"
    - "contracts"
    - "runbooks"
    - "decision_records"
  deduplication_strategy:
    canonical_id_required: true
    source_of_truth_pointer_required: true
    duplicate_detection_gate: "hash + semantic key overlap check in preflight"
    publication_rule: "domain YAMLs reference global canonical blocks; no copy-paste of global knowledge"
  support_targets:
    - documentation_rendering
    - workflow_guidance
    - skill_generation
    - agent_generation
    - architecture_reasoning

smoke_test_architecture:
  role: "Permanent platform performance and regression gate"
  hard_requirements:
    registry_isolation: true
    deterministic_test_environment: true
    opj_disk_io_disabled_in_tests: true
    parallel_execution_required: true
    ci_runtime_budget_seconds: 60
  enforcement:
    required_env:
      CORTEX_OPJ_DISABLED: "1"
      CORTEX_WORKERS: "8"
    fail_conditions:
      - "pytest-xdist unavailable"
      - "smoke runtime budget exceeded"
      - "smoke writes to OPJ registry paths"
    telemetry:
      slow_test_threshold_seconds: 2
      regression_alert_threshold_percent: 20
  opj_controls:
    shard_entry_cap: 100
    registry_entry_cap: 200
    write_guard_in_tests: "CORTEX_OPJ_DISABLED"
  ci_design:
    - "smoke lane always parallel"
    - "slow-test regression detector blocks merge on threshold breach"
    - "registry path validation check blocks out-of-repo writes"

