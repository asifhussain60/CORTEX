# ============================================================
# LLM ADAPTABILITY CONTRACT
# ============================================================
# CORTEX v2 is designed to ADAPT to evolving LLM capabilities.
# The LLM Capability Manifest (cortex-registry/core/llm-capabilities.yaml)
# defines the boundary between what the LLM handles natively vs what
# CORTEX must handle. As LLMs improve, the manifest is updated and
# CORTEX surface area shrinks further — no code changes needed.
# ============================================================
llm_adaptability:
  manifest_file: "cortex-registry/core/llm-capabilities.yaml"
  review_cadence: "quarterly"
  adaptation_protocol: |
    1. Update llm-capabilities.yaml with new LLM capabilities
    2. Run cortex_govern op=audit — identifies CORTEX code duplicating LLM native
    3. Create deprecation phase for each retired capability
    4. Execute phase (TDD gated, CORE-068 convergence)
    5. Emit drift lock preventing re-implementation

