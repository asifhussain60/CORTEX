# M8 mirrors all prior phases.
# M12 is always last.
# ============================================================

autonomous_execution_framework:
  execution_mode: "SILENT_AUTONOMOUS"
  progress_contract: "phase-list+bar with stage bullets"
  strict_phase_order: true
  continuation_required: true
  completion_response_contract:
    required_final_line: "✅ Phase {id} complete."
    required_executive_summary_line: "Progress: {completed}/{total} phases ({completion_percentage}%) · Completed {completed_phase_id} · Next {next_phase_id}"
    required_next_block: "### 🚀 Next Phase"
    next_phase_resolution: "first PLANNED phase in dependency-valid order"
    continuation_prompt_template: "execute {next_phase_id} on CORTEX-V2 with strict sequential contract and autonomous progress"
  fail_safe:
    max_convergence_cycles: 3
    unresolved_p0_p1_blocks_completion: true
    rollback_required_before_retry: true

session_resume_protocol:
  trigger_phrase: "Proceed immediately and autonomously with next phase of #file:cortex-master-v2.yaml"
  startup_actions:
    - "Read this file first and build phase status map from phase_detail_files"
    - "Identify all COMPLETE phases and verify summary counters"
    - "If counters drift from phase statuses, correct metadata and summary before execution"
    - "Select next executable phase: first PLANNED phase whose depends_on are all COMPLETE"
    - "Mark selected phase status as IN_PROGRESS and update last_updated timestamp"
  execution_rules:
    - "Run selected phase in strict sequential mode (no decomposition, no partial completion)"
    - "Enforce sub-phase completion_gate before advancing"
    - "Enforce convergence loop for P0/P1 until clear or max cycles reached"
    - "On successful phase completion: set phase status COMPLETE and increment completed/decrement planned"
    - "Immediately resolve and set next executable phase to IN_PROGRESS when safe to continue autonomously"
  session_end_contract:
    required_final_output: "concise executive summary + gated continuation prompt for next VSCode Copilot Chat Session"
    continuation_prompt_template: "Proceed immediately and autonomously with next phase of #file:cortex-master-v2.yaml"
    prompt_generation_gate:
      required_before_prompt:
        - "cortex-master-v2.yaml updated with latest phase completion status"
        - "summary counters and completion_percentage synchronized"
        - "all code changes committed to current branch"
        - "current branch pushed to origin"
      enforcement: "Do not render continuation prompt until all required_before_prompt checks pass"
    final_output_format:
      - "✅ Phase {completed_phase_id} complete."
      - "Progress: {completed}/{total} phases ({completion_percentage}%)"
      - "Exec Summary: Completed {completed_phase_id} · Next {next_phase_id}"
      - "Prompt: Proceed immediately and autonomously with next phase of #file:cortex-master-v2.yaml"
  no_next_phase_behavior:
    when_all_complete: "Emit completion state and maintenance continuation prompt"
    maintenance_prompt: "Run autonomous steady-state checks on #file:cortex-master-v2.yaml and report only deltas"

