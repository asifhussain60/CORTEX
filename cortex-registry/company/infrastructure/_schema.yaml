# Infrastructure Catalog Schema
# Defines structure for platforms, APIs, and applications
# Version: 1.0 | Updated: 2026-02-20
# Authority: Phase 08 — Registry & Docs Alignment

metadata:
  name: infrastructure-catalog-schema
  version: 1.0.0
  created: '2026-02-20'
  description: |
    Canonical schema for company infrastructure catalog.
    Covers platforms, APIs, and applications with complete dependency tracking.

schema:
  platform:
    description: "Cloud or on-prem infrastructure platform"
    required_fields:
      - name
      - type
      - provider
      - environments
      - hosted_applications
      - networking
      - observability
      - owner_team
    optional_fields:
      - description
      - region
      - sla
      - backup_strategy
      - disaster_recovery
      - cost_center
    field_types:
      name: string
      type: enum [kubernetes, ec2, lambda, cloud-run, aks, gke, custom]
      provider: enum [aws, gcp, azure, on-prem, hybrid]
      environments: array[string]
      hosted_applications: array[reference to applications]
      networking:
        type: object
        fields:
          vpc_id: string
          subnets: array[string]
          security_groups: array[string]
          nat_gateway: boolean
      observability:
        type: object
        fields:
          monitoring_tool: string [datadog, prometheus, cloudwatch]
          logging_tool: string [kibana, stackdriver, cloudwatch]
          tracing_enabled: boolean
      owner_team: string
      sla:
        uptime_pct: number
        response_time_ms: number
        incident_response_minutes: number
      created_at: datetime
      last_updated: datetime

  api:
    description: "REST, GraphQL, or gRPC API endpoint"
    required_fields:
      - name
      - type
      - version
      - base_url
      - endpoints
      - owner_repo
      - consumers
      - auth
      - documentation_url
      - sla
      - created_at
    optional_fields:
      - description
      - rate_limits
      - deprecation_status
      - alternative_api
    field_types:
      name: string
      type: enum [rest, graphql, grpc, soap, webhook]
      version: string [semantic versioning]
      base_url: uri
      endpoints: array[string]
      owner_repo: reference [github_repo format]
      consumers: array[string] [application names]
      auth:
        type: enum [oauth2, api-key, jwt, basic, none]
        scopes: array[string]
      documentation_url: uri
      sla:
        uptime_pct: number
        response_time_p95_ms: number
        response_time_p99_ms: number
      rate_limits:
        requests_per_second: number
        requests_per_hour: number
      deprecation_status: enum [active, deprecated, sunset]
      created_at: datetime
      last_updated: datetime

  application:
    description: "Service or application deployed on platform"
    required_fields:
      - name
      - type
      - repository
      - platform
      - tech_stack
      - apis_consumed
      - apis_exposed
      - environments
      - owner_team
      - dependencies
    optional_fields:
      - description
      - deployment_method
      - health_check_url
      - metrics_dashboard
      - runbooks
    field_types:
      name: string
      type: enum [backend-service, frontend-app, worker, scheduler, ml-model, data-pipeline]
      repository: reference [github_repo format]
      platform: reference [platform name]
      tech_stack: array[string] [languages and frameworks]
      apis_consumed: array[reference] [API names]
      apis_exposed: array[reference] [API names]
      environments: array[enum [dev, staging, production]]
      owner_team: string
      dependencies:
        type: object
        fields:
          internal_services: array[reference] [application names]
          external_services: array[string]
          databases: array[string]
          caches: array[string]
          queues: array[string]
      deployment_method: enum [docker, helm, terraform, manual, cicd-pipeline]
      health_check_url: uri
      metrics_dashboard: uri
      runbooks: array[uri]
      created_at: datetime
      last_updated: datetime

validation_rules:
  - rule: "All references must resolve to existing entities"
    level: error
  - rule: "Owner team must be valid team identifier"
    level: error
  - rule: "URLs must use HTTPS"
    level: warning
  - rule: "SLA fields must be reasonable values"
    level: warning
  - rule: "Created/updated dates must be valid ISO 8601"
    level: error

patterns:
  - name: "Service Topology"
    description: "Application consumed by other applications"
    entities: [application, api]
    relationship: "application.apis_exposed referenced in other application.apis_consumed"
  
  - name: "Platform Dependency"
    description: "Applications hosted on platforms"
    entities: [application, platform]
    relationship: "application.platform references platform.name"
  
  - name: "API Consumer"
    description: "Application consuming API"
    entities: [application, api]
    relationship: "application.apis_consumed contains api.name"
