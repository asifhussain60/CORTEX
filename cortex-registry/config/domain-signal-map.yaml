  - pattern: "anti.pattern|god.object|spaghetti|big.ball|coupling|cohesion"
    domain: "architecture"
    knowledge_file: "architecture/engineering-anti-patterns.yaml"

  # ── DevOps / SRE ─────────────────────────────────────────────────────────
  - pattern: "docker|kubernetes|k8s|helm|terraform|ansible|ci.cd|github.actions|jenkins"
    domain: "devops"
    knowledge_file: "devops/deployment-pipeline-patterns.yaml"

  - pattern: "prometheus|grafana|alertmanager|loki|jaeger|opentelemetry|sre|slo|sla|sli"
