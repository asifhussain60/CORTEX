    knowledge_file: "../knowledge-base/security/cicd-hardening.yaml"

  # ── Architecture ──────────────────────────────────────────────────────────
  - pattern: "microservice|monolith|event.driven|cqrs|saga|hexagonal|clean.arch"
    domain: "architecture"
    knowledge_file: "architecture/engineering-design-patterns.yaml"

  - pattern: "solid|single.responsibility|open.closed|liskov|interface.segregation|dependency.inversion"
    domain: "architecture"
