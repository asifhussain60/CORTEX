# domain-signal-map.yaml
# CORTEX Knowledge Acquisition Layer — Domain Signal Map
# Converts LENS output (language / imports / files) into domain signal strings
# matchable against cortex-registry/knowledge/INDEX.yaml entries.
#
# Each entry: { pattern: regex, domain: index-domain-key, knowledge_file: optional }
# DomainSignalExtractor applies these in order; first match per signal wins.
#
# Phase: 135-a (KAL — GAP-135-01)
# CORE: CORE-035 (single canonical)
# Updated: 2026-03-08
# ---

version: "1.0"
updated: "2026-03-08"

# Total signal patterns: 60 across 12 domains
patterns:

  # ── Testing / Validation ──────────────────────────────────────────────────
  - pattern: "pytest|unittest|test_|_test|testing|tdd|coverage|mock|fixture|parametrize"
    domain: "testing-validation"
    knowledge_file: "testing-validation/tdd-best-practices.yaml"

  - pattern: "behave|bdd|cucumber|gherkin|acceptance"
    domain: "testing-validation"
    knowledge_file: "testing-validation/tdd-best-practices.yaml"

  # ── Python Backend ────────────────────────────────────────────────────────
  - pattern: "fastapi|flask|django|uvicorn|starlette|aiohttp|sanic|tornado"
    domain: "backend-python"
    knowledge_file: "backend-python/clean-code.yaml"

  - pattern: "sqlalchemy|alembic|peewee|tortoise|databases|asyncpg|psycopg"
    domain: "backend-python"
    knowledge_file: "backend-python/clean-code.yaml"

  - pattern: "pydantic|dataclass|attrs|marshmallow|cerberus"
    domain: "backend-python"
    knowledge_file: "backend-python/clean-code.yaml"

  - pattern: "refactor|clean.code|code.quality|naming|solid|dry|srp|coupling"
    domain: "backend-python"
    knowledge_file: "backend-python/refactoring.yaml"

  - pattern: "code.review|review|checklist|pull.request|pr.review"
    domain: "backend-python"
    knowledge_file: "backend-python/code-review.yaml"

  # ── Security ──────────────────────────────────────────────────────────────
  - pattern: "owasp|injection|xss|csrf|sqli|auth|jwt|oauth|tls|ssl|encryption"
    domain: "security"
    knowledge_file: "security/secure-coding-practices.yaml"

  - pattern: "secret|vault|rotation|key.management|hsm|kms"
    domain: "security"
    knowledge_file: "../knowledge-base/security/secrets-patterns.yaml"

  - pattern: "cicd|pipeline|supply.chain|sbom|sast|dast|dependency.scan"
