    knowledge_file: "observability/observability-practices.yaml"

  # ── Frontend / UI ─────────────────────────────────────────────────────────
  - pattern: "react|angular|vue|svelte|nextjs|nuxt|gatsby|remix|typescript|javascript|tsx|jsx"
