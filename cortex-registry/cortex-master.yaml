              - "audit_required_validator.py — twin at cortex/core/audit_required_validator.py"
              - "brain_populator.py — twin at cortex/core/brain_populator.py"
              - "compatibility_layer.py — twin at cortex/core/compatibility_layer.py"
              - "dependency_validator.py — twin at cortex/core/dependency_validator.py"
              - "governance_enforcer.py — twin at cortex/core/governance_enforcer.py"
              - "governance_pregate.py — twin at cortex/core/governance_pregate.py"
              - "health_metrics.py — twin at cortex/core/health_metrics.py"
              - "mode_controller.py — twin at cortex/core/mode_controller.py"
              - "mutation_guard.py — twin at cortex/core/mutation_guard.py"
              - "path_resolver.py — twin at cortex/core/path_resolver.py"
              - "provenance_tracker.py — twin at cortex/core/provenance_tracker.py"
              - "response_header_config.py — twin at cortex/core/response_header_config.py"
              - "resumption_handler.py — twin at cortex/core/resumption_handler.py"
              - "state_machine.py — twin at cortex/core/state_machine.py"
            group_b_unique_to_core_core:
