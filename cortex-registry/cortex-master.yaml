              - "conversation_synthesizer.py → move to cortex/core/orchestrator/"
              - "copilot_context_optimizer.py → move to cortex/core/intelligence/"
              - "core_config.py → move to cortex/core/config/"
              - "dor_tracker.py → move to cortex/core/"
              - "governance_audit_logger.py → move to cortex/core/governance/"
              - "governance_database.py → move to cortex/core/governance/"
              - "governance_registry_database_integration.py → move to cortex/core/governance/"
