              - "knowledge/* (17 files) → move to cortex/knowledge/ (merge with existing)"
            group_d_intent:
              - "intent/* (6 files) → move to cortex/core/intent/ (merge with existing)"
        - id: phase-58-b
          title: "Delete Group A twins — redirect imports to existing canonical"
          priority: P0
          status: OPEN
          duration: "4 hours"
          description: |
            For each Group A twin: the canonical already exists at cortex/core/<name>.py.
            Step 1: grep all imports of cortex.core.core.<name> → rewrite to cortex.core.<name>
            Step 2: run `make test-batch` — must pass
            Step 3: delete cortex/core/core/<name>.py
            Step 4: run `make test-batch` — confirm no regression
            Repeat per file. Do NOT batch — one file at a time for safety.
          files_to_delete: 15
          imports_to_rewrite: "~40 (estimated from 98 total, Group A proportion)"
          zero_regression_method: "test-batch after each file deletion"
        - id: phase-58-c
          title: "Relocate Group B unique files to canonical locations"
          priority: P0
          status: OPEN
          duration: "6 hours"
          description: |
            For each Group B file with a designated target:
            Step 1: move file to target path
            Step 2: update __init__.py at target to export
            Step 3: add backward-compat shim at cortex/core/core/<name>.py:
              `from cortex.core.<target_module> import *  # COMPAT — remove phase-58 + 90 days`
            Step 4: run `make test-batch`
            Step 5: after ALL Group B files moved, do a final import sweep
            Step 6: remove shims in batch (single commit)
          files_to_relocate: ~35
          compat_shim_retention: "90 days — removed in phase-61 cleanup"
        - id: phase-58-d
          title: "Relocate Group C (knowledge) + Group D (intent)"
          priority: P1
          status: OPEN
          duration: "4 hours"
          description: |
            knowledge/* → cortex/knowledge/ (merge, deduplicate against existing)
            intent/* → cortex/core/intent/ (merge, deduplicate against existing)
            Same step sequence as phase-58-c.
          files_to_relocate: ~23
        - id: phase-58-e
          title: "Delete cortex/core/core/ directory entirely"
          priority: P0
          status: OPEN
          duration: "2 hours"
          description: |
            After 58-b, 58-c, 58-d complete with zero test failures:
            Step 1: `find cortex/core/core -name "*.py" | xargs grep -v "^#\|^from\|^import\|^$" | wc -l`
              — must be 0 (only shims and empty inits remain)
            Step 2: delete cortex/core/core/ directory
            Step 3: remove stale `from cortex.core.core` from cortex/core/__init__.py if present
            Step 4: `make test-batch` — final confirmation
            Step 5: update copilot-instructions.md: remove all core/core references
          expected_result: "cortex/core/core/ directory no longer exists"
          files_deleted: 113
        - id: phase-58-f
