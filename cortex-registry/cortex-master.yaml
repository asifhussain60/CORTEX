            4. governance_enforcer.py — 2 copies: resolved by phase-58-b
            5. brain_populator.py — 2 copies: resolved by phase-58-b
            6. audit_required_validator.py — 2 copies: resolved by phase-58-b
            7. ac_domain_mapper.py — 2 copies: resolved by phase-58-b
            Remaining non-core/core duplicates (cleanup.py, audit_trail.py, etc.):
              Identify canonical by import count → delete lower-import-count copy
              → rewrite its imports to canonical → `make test-batch`
          files_deleted_estimate: 96
          method: "grep import count determines canonical; lower count = delete candidate"
