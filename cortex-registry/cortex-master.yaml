    # -------------------------------------------------------
    - id: phase-58
      title: "Simplification Phase 1 — core/core Collapse & Duplicate Filename Elimination"
      priority: P0
      governance_authority: "CORE-035, CORE-064"
      duration_estimate: "3-4 days"
      prerequisite: "Phase 57 complete, smoke tests green"
      sweep_id: SWEEP-58-CORE-COLLAPSE
      regression_gate: "838 golden tests must pass after every sub-phase"
      sub_phases:
        - id: phase-58-a
          title: "Audit & Map — core/core full dependency graph"
          priority: P0
          status: OPEN
          duration: "4 hours"
          description: |
            Build exact import graph: for each of 113 core/core files, find every
            file in cortex/ and tests/ that imports from it. Group into:
            Group A: files that have a CANONICAL TWIN at cortex/core/<name>.py
              (e.g. core/core/ac_domain_mapper.py vs core/ac_domain_mapper.py)
            Group B: files unique to core/core with no twin
            Group C: files in core/core/knowledge/ — map to cortex/knowledge/
            Group D: files in core/core/orchestrator/ — map to cortex/core/orchestrator/
          deliverables:
            - "audit report inline: Group A count, Group B count, Group C count, Group D count"
            - "import_redirect_map.yaml in cortex-registry/planning/ (temp, deleted after phase-58)"
          duplicate_groups_detected:
