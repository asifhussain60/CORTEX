              - "intelligence_routing_engine.py → move to cortex/core/intelligence/"
              - "intelligence_routing_wiring.py → move to cortex/core/intelligence/"
              - "knowledge_guidance_engine.py → move to cortex/knowledge/"
              - "learning_extractor.py → move to cortex/intelligence/"
              - "load_stress_manager.py → move to cortex/core/resilience/"
              - "mandatory_checkpoints.py → move to cortex/core/"
              - "master_orchestrator_gateway.py → move to cortex/orchestrators/core/"
