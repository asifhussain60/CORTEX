metadata:
  title: "CORTEX Registry Manifest"
  version: "2.0"
  created: "2026-01-21"
  updated: "2026-02-03"
  authority: "cortex-registry-001-migration"
  cleanup: "cortex-architect-v13.1"

structure:
  master:
    description: "Master orchestrator configurations"
    location: "cortex-registry/master/"
    purpose: "System-wide orchestrator strategic configs"
    content_type: "*.yaml"
    usage: "MasterOrchestrator, site infrastructure"
    
  planning:
    description: "Planning documents and phase tracking"
    location: "cortex-registry/planning/"
    purpose: "Development roadmaps, phase completion docs"
    content_type: "*.yaml, *.md"
    usage: "PlanningOrchestrator, PlanningRegistryLoader"
    
  interaction:
    description: "Communication patterns and protocols"
    location: "cortex-registry/interaction/"
    purpose: "Orchestrator-to-orchestrator communication patterns"
    content_type: "*.yaml"
    usage: "InteractionOrchestrator, PatternEnforcer"
    active_patterns:
      - "request-response.yaml"
      - "event-driven.yaml"
      - "pub-sub.yaml"
      - "orchestrator-coordination.yaml"
    
  domains:
    description: "Domain-specific registries"
    location: "cortex-registry/domains/"
    purpose: "Business domain segregation"
    content_type: "index.yaml"
    usage: "PlanningRegistryLoader, domain orchestrators"

registry_access:
  master_orchestrator:
    paths:
      - "cortex-registry/master/"
    authority: "highest"
    
  planning_orchestrator:
    paths:
      - "cortex-registry/planning/"
    authority: "phase tracking"
    
  interaction_orchestrator:
    paths:
      - "cortex-registry/interaction/"
    authority: "pattern enforcement"
    
  domain_orchestrators:
    paths:
      - "cortex-registry/domains/"
    authority: "domain-specific"

removed_in_v2:
  deployment:
    reason: "Duplicate of /deployment root folder"
    archived_to: "docs/archive/cortex-registry-removed/deployment/"
    date_removed: "2026-02-03"
    files: "canary_config.yaml, health_checks.yaml, grafana/, prometheus/"
