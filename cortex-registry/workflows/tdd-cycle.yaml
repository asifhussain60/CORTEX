# ============================================================================
# TDD Cycle Sub-Workflow
# ============================================================================
# Purpose: RED → GREEN → REFACTOR cycle (nested workflow)
# Authority: Phase 102 - Workflow Runtime Foundation
# Version: 1.0.0
# Created: 2026-02-17
# ============================================================================

id: "tdd-cycle"
workflow:
  id: "cortex/tdd-cycle"
  name: "TDD Cycle (RED → GREEN → REFACTOR)"
  category: "sub-workflow"
  description: "Test-Driven Development cycle for CORTEX phases"

  steps:
    - step_id: "red"
      name: "RED Phase - Write Failing Tests"
      orchestrator: "TDDOrchestrator"
      convergence_gate:
        max_cycles: 3
        success_criteria:
          tests_written: true
          tests_failing: true
        convergence_predicate: "test_count > 0 and all_failing"
      params:
        phase: "RED"
        test_framework: "{{test_framework}}"

    - step_id: "green"
      name: "GREEN Phase - Make Tests Pass"
      orchestrator: "TDDOrchestrator"
      depends_on: ["red"]
      convergence_gate:
        max_cycles: 8
        success_criteria:
          all_tests_pass: true
          no_new_failures: true
        convergence_predicate: "all_tests_pass and regressions == 0"
      params:
        phase: "GREEN"
        test_framework: "{{test_framework}}"

    - step_id: "refactor"
      name: "REFACTOR Phase - Improve Code Quality"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["green"]
      convergence_gate:
        max_cycles: 5
        success_criteria:
          tests_still_pass: true
          code_quality_improved: true
        convergence_predicate: "all_tests_pass and complexity_reduced"
      params:
        refactoring_operations: ["extract_method", "rename_variable", "remove_duplication"]
        preserve_behavior: true
