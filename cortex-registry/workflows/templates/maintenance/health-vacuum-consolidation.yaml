# Health-Vacuum Consolidation Workflow Template
# Phase 50 — CORTEX Orchestrator Consolidation
# Canonical execution guide for GAP-004 through GAP-010 remediation work.
#
# CORE-002: no markdown generation via bash
# CORE-008: TDD — tests written before implementation
# CORE-035: single canonical orchestrator per domain

workflow:
  id: "maintenance/health-vacuum-consolidation"
  name: "Health-Vacuum Orchestrator Consolidation"
  version: "1.0.0"
  category: "maintenance"
  description: |
    Phase 50 consolidation workflow — eliminates dual HealthOrchestrator
    implementations, unifies vacuum routing, fixes CoherenceValidator naming,
    and wires CortexMasterPlanOrchestrator into MasterOrchestrator PLAN intent.

    Canonical state after execution:
      - health/health_orchestrator.py  → unified canonical (scan + run_health_check)
      - support/health_orchestrator.py → filesystem engine (Phase-48 backend)
      - vacuum routing                 → all ops via CortexVacuumOrchestrate
      - CoherenceValidator             → domain/ = CrossLayerCoherenceValidator alias
      - MasterOrchestrator             → routes plan:* to CortexMasterPlanOrchestrator

  metadata:
    author: "CORTEX Architect"
    created: "2026-02-19"
    phase: "50"
    gaps_addressed:
      - GAP-004  # Dual HealthOrchestrator — unify canonical
      - GAP-005  # scan() proxy API missing from health/
      - GAP-007  # CoherenceValidator naming collision
      - GAP-008  # MasterOrchestrator missing PLAN intent routing
      - GAP-009  # Markdown cleanup not absorbed into vacuum tool
      - GAP-010  # Phase 50 workflow template missing
    related_phases:
      - phase-48   # Health-Vacuum Integrity Pipeline (engine)
      - phase-49   # Markdown Classification (vacuum extension)
      - phase-92   # Agent-based coordinator (now unified)

  triggers:
    - type: manual
      description: "Triggered by CORTEX Architect after gap analysis"
    - type: cortex_master_plan
      intent: "plan:create"
      phase_id: "phase-50"

# ---------------------------------------------------------------------------
# Stage 1 — Audit current state
# ---------------------------------------------------------------------------
stages:
  - id: stage-1-audit
    name: "Audit current HealthOrchestrator state"
    description: |
      Verify which consumers import from health/ vs support/ and map
      all VacuumExecutor call sites.
    steps:
      - id: s1-1
        name: "Map health/ consumers"
        tool: "cortex_health_orchestrate"
        operation: "scan"
        outputs: ["health-issues.yaml"]
        governance:
          - CORE-035  # confirm single canonical path
      - id: s1-2
        name: "Run Phase 50 RED tests"
        command: "python3 -m pytest tests/golden/orchestrators/phase_50/ -v --tb=short"
        expected_failures:
          - GP50-004  # scan() not yet on health/
          - GP50-005  # scan() delegation not yet tested
          - GP50-009  # markdown not yet in vacuum enum

# ---------------------------------------------------------------------------
# Stage 2 — Add scan() proxy to health/ HealthOrchestrator
# ---------------------------------------------------------------------------
  - id: stage-2-scan-proxy
    name: "Add scan() unified API to health/ HealthOrchestrator"
    description: |
      Add scan() method that delegates to Phase-48 _Phase48Orchestrator.scan().
      This satisfies GP50-004 and GP50-005 — no business logic duplication.
    file: "cortex/orchestrators/health/health_orchestrator.py"
    change_type: "additive"
    test_ids:
      - GP50-004
      - GP50-005
    governance:
      - CORE-008  # implement only after RED tests exist
      - CORE-011  # type hints required
      - CORE-012  # docstring required
      - CORE-035  # scan() must proxy, not duplicate

# ---------------------------------------------------------------------------
# Stage 3 — Fix VacuumExecutor.execute_from_handoff() YAML guard
# ---------------------------------------------------------------------------
  - id: stage-3-vacuum-yaml-guard
    name: "Fix VacuumExecutor handoff YAML type guard"
    description: |
      execute_from_handoff() crashes when issues: [] (list) instead of issues: {}
      (dict). Add isinstance guard: issues = raw if isinstance(raw, dict) else {}.
    file: "cortex/orchestrators/support/health_orchestrator.py"
    change_type: "bugfix"
    test_ids:
      - GP50-007
    governance:
      - CORE-011  # type safety
      - CORE-012  # document the guard

# ---------------------------------------------------------------------------
# Stage 4 — Add markdown operation to CortexVacuumOrchestrate
# ---------------------------------------------------------------------------
  - id: stage-4-markdown-vacuum
    name: "Absorb markdown cleanup into CortexVacuumOrchestrate"
    description: |
      Add 'markdown' to operation enum and implement _op_markdown_vacuum()
      which archives stale .md files into .cortex-runtime/archived-docs/.
      This absorbs GAP-009 cortex_vacuum markdown tier into the unified tool.
    file: "cortex/mcp/tools/vacuum_orchestrator_tool.py"
    change_type: "feature"
    test_ids:
      - GP50-009
      - GP50-010
    governance:
      - CORE-002  # markdown cleanup via Python, not bash
      - CORE-035  # single canonical vacuum tool

# ---------------------------------------------------------------------------
# Stage 5 — GAP-007: CrossLayerCoherenceValidator alias
# ---------------------------------------------------------------------------
  - id: stage-5-coherence-alias
    name: "Add CrossLayerCoherenceValidator alias to domain/"
    description: |
      domain/coherence_validator.py CoherenceValidator validates Python↔JS
      cross-layer coherence (different scope from coherence/ which validates
      post-edit file structure). Add alias CrossLayerCoherenceValidator so
      callers can be explicit about scope without breaking existing imports.
    file: "cortex/orchestrators/domain/coherence_validator.py"
    change_type: "additive"
    test_ids:
      - GP50-014
    governance:
      - CORE-035  # two distinct classes — alias not merge

# ---------------------------------------------------------------------------
# Stage 6 — GAP-008: Wire CortexMasterPlanOrchestrator into MasterOrchestrator
# ---------------------------------------------------------------------------
  - id: stage-6-plan-routing
    name: "Wire PLAN intent routing to CortexMasterPlanOrchestrator"
    description: |
      Add try/import block for CortexMasterPlanOrchestrator at module level.
      Initialise self.master_plan_orchestrator in __init__.
      Add plan:* fast-path at top of execute_operation() that intercepts
      plan:create | plan:sync | plan:next_sequence | plan:load_template
      and delegates directly, bypassing the 4-stage pipeline.
    file: "cortex/orchestrators/core/master_orchestrator.py"
    change_type: "feature"
    test_ids:
      - GP50-013
    governance:
      - CORE-035  # single canonical CortexMasterPlanOrchestrator
      - CORE-012  # AC tag and docstring

# ---------------------------------------------------------------------------
# Stage 7 — Verify GREEN and commit
# ---------------------------------------------------------------------------
  - id: stage-7-verify
    name: "Verify all 20 Phase 50 golden tests GREEN"
    steps:
      - id: s7-1
        name: "Run Phase 50 suite"
        command: "python3 -m pytest tests/golden/orchestrators/phase_50/ -v"
        expected: "20 passed"
      - id: s7-2
        name: "Run full golden suite (regression gate)"
        command: "python3 -m pytest tests/golden/ -q --tb=line"
        expected: "≥204 passed, 0 new failures"
      - id: s7-3
        name: "Commit with authority tag"
        command: |
          git add <changed-files>
          git commit -m "phase-50: GREEN — 20/20 golden tests pass"
        governance:
          - CORE-028  # snake_case commit file references

# ---------------------------------------------------------------------------
# Post-execution checklist
# ---------------------------------------------------------------------------
definition_of_done:
  - description: "20/20 GP50 golden tests pass"
    test_ids: ["GP50-001..GP50-020"]
  - description: "Full golden suite ≥204 passing, 0 new failures"
  - description: "health/health_orchestrator.py has scan() method"
    file: "cortex/orchestrators/health/health_orchestrator.py"
    symbol: "scan"
  - description: "VacuumExecutor.execute_from_handoff() handles list issues"
    file: "cortex/orchestrators/support/health_orchestrator.py"
    symbol: "execute_from_handoff"
  - description: "CortexVacuumOrchestrate enum includes 'markdown'"
    file: "cortex/mcp/tools/vacuum_orchestrator_tool.py"
  - description: "CrossLayerCoherenceValidator importable from domain/"
    file: "cortex/orchestrators/domain/coherence_validator.py"
    symbol: "CrossLayerCoherenceValidator"
  - description: "MasterOrchestrator imports CortexMasterPlanOrchestrator"
    file: "cortex/orchestrators/core/master_orchestrator.py"
  - description: "cortex-master.yaml phase-50 status updated to 'complete'"
    file: "cortex-registry/cortex-master.yaml"
  - description: "Committed and pushed to origin/CORTEX"

rollback:
  strategy: "git revert"
  risk: "LOW — all changes are additive; no existing behaviour removed"
  affected_files:
    - "cortex/orchestrators/health/health_orchestrator.py"
    - "cortex/orchestrators/support/health_orchestrator.py"
    - "cortex/mcp/tools/vacuum_orchestrator_tool.py"
    - "cortex/orchestrators/domain/coherence_validator.py"
    - "cortex/orchestrators/core/master_orchestrator.py"
