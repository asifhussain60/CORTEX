# Code Deduplication Workflow Template
# Phase 100 Stage 5
# Detect and remove duplicate code using LENS + CORE-035

workflow:
  id: "cleanup/deduplication"
  name: "Code Deduplication Workflow"
  version: "1.0.0"
  category: "cleanup"
  description: "Systematic duplicate code detection and elimination (CORE-035)"

  metadata:
    author: "CORTEX"
    created: "2026-02-16"
    phase: "100"
    stage: "5"

  convergence_loop:
    primitive: 'primitives/validation/detect-fix-rescan-loop'
    max_cycles: 5
    success_criteria:
      duplicate_count: 0
      no_regressions: true
    convergence_predicate: "duplicate_count == 0 and all_tests_pass"
    backoff_strategy: "linear"

  knowledge_context:
    architect_mode:
      scanner: "LENS duplicate detection"
      standard: "CORE-035 (single canonical implementation)"
      refactoring: "Extract shared module pattern"
    production_mode:
      scanner: "LENS (tech-agnostic)"
      standard: "{{dry_standards}}"  # From cortex-registry/company/domains/
      refactoring: "{{architecture_patterns}}"

  steps:
    - step_id: "duplicate_scan"
      name: "Scan for Duplicate Code"
      orchestrator: "LENSSynthesis"
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 2
        success_criteria:
          scan_complete: true
        convergence_predicate: "duplicates_scanned"
      params:
        analysis_type: "duplication"
        core_rule: "CORE-035"

    - step_id: "extract_common_code"
      name: "Extract Shared Modules"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["duplicate_scan"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 5
        success_criteria:
          duplicates_eliminated: true
          tests_pass: true
        convergence_predicate: "duplicate_count == 0 and all_tests_pass"
      params:
        refactoring_operations: ["extract_module", "create_shared_utility"]
        standard: "{{standard}}"

    - step_id: "verification"
      name: "Verify No Regressions"
      orchestrator: "TDDOrchestrator"
      depends_on: ["extract_common_code"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 3
        success_criteria:
          all_tests_pass: true
        convergence_predicate: "test_failures == 0"
      params:
        test_type: "regression"

  epilogues:
    - epilogue_id: "deduplication_report"
      name: "Deduplication Metrics"
      trigger: "workflow_complete"
      description: "Lines saved, modules created, CORE-035 compliance"
