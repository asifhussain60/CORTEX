# Health-Vacuum Pipeline Workflow Template
# Phase 48 Stage 1-5
# Automated CORTEX integrity check and production readiness cleanup

workflow:
  id: "maintenance/health-vacuum-pipeline"
  name: "Health-Vacuum Integrity Pipeline"
  version: "1.0.0"
  category: "maintenance"
  description: |
    Two-phase orchestrator pipeline for CORTEX repository integrity:
    1. HealthOrchestrator: Scans for issues, writes health-issues.yaml
    2. VacuumOrchestrator: Reads issues, executes cleanup, deletes report
    
    Governance: CORE-002 (no markdown sprawl), CORE-028 (naming conventions)

  metadata:
    author: "CORTEX Architect"
    created: "2026-02-18"
    phase: "48"
    stage: "1-5"
    authority: "CORE-002, CORE-028, CORE-035"
    
  # ===========================================================================
  # CONVERGENCE GATE (Pipeline-Level)
  # ===========================================================================
  convergence_gate:
    max_cycles: 3
    success_criteria:
      issues_resolved: true
      no_regressions: true
      root_clean: true
    convergence_predicate: "issues_found == issues_fixed and test_failures == 0"
    backoff_strategy: "linear"
    
  # ===========================================================================
  # KNOWLEDGE CONTEXT
  # ===========================================================================
  knowledge_context:
    architect_mode:
      health_checks:
        - "H-001: Screaming case files (CORE-028 violation)"
        - "H-002: Empty files (stubs/deprecated)"
        - "H-003: Empty directories (orphaned)"
        - "H-004: Orphaned files (no references)"
        - "H-005: Duplicate content (hash collision)"
        - "H-006: Deprecated markers (TODO: remove)"
        - "H-007: Wrong path references (cortex_brain → cortex_intelligence)"
        - "H-008: Stale files (>90 days, no references)"
        - "H-009: Oversized files (>500KB non-binary)"
        - "H-010: Invalid markdown location (CORE-002)"
      vacuum_operations:
        - "V-001: Delete unneeded files (.bak, .tmp, unauthorized .md)"
        - "V-002: Rename screaming → kebab (max 30 chars)"
        - "V-003: Relocate to proper paths"
        - "V-004: Clean root (only valid root files)"
        - "V-005: Delete health-issues.yaml"
      naming_rules:
        python_modules: "snake_case (PEP 8)"
        non_python: "kebab-case (max 30 chars)"
        plan_files: "phase-{N}-*.yaml (max 40 chars)"
    production_mode:
      standards: "{{governance_rules}}"
      protected_files:
        - "pytest.ini"
        - "requirements.txt"
        - "README.md"
        - ".gitignore"
        - "conftest.py"
        - "pyproject.toml"
        - "Makefile"
        - "cortex_intelligence/state/governance.db"
        - "cortex_intelligence/state/governance.db-shm"
        - "cortex_intelligence/state/governance.db-wal"

  # ===========================================================================
  # HANDOFF CONTRACT
  # ===========================================================================
  handoff:
    file: "cortex/brain/vacuum/health-issues.yaml"
    schema:
      metadata:
        generated_at: "ISO 8601 timestamp"
        scan_duration_ms: "integer"
        total_files_scanned: "integer"
        issues_found: "integer"
      issues:
        screaming_case:
          count: "integer"
          files: "list[{path, recommended_name, action}]"
        empty_files:
          count: "integer"
          files: "list[{path, action}]"
        orphaned_directories:
          count: "integer"
          directories: "list[{path, action}]"
        deprecated_code:
          count: "integer"
          files: "list[{path, markers, action}]"
        duplicate_content:
          count: "integer"
          groups: "list[{hash, files, action}]"
        wrong_references:
          count: "integer"
          files: "list[{path, old_ref, new_ref, action}]"
        invalid_markdown:
          count: "integer"
          files: "list[{path, allowed_locations, action}]"
      summary:
        delete_count: "integer"
        rename_count: "integer"
        relocate_count: "integer"
        estimated_bytes_freed: "integer"
    lifecycle: "created by health_scan, consumed by vacuum_execute, deleted by teardown"

  # ===========================================================================
  # PIPELINE STEPS
  # ===========================================================================
  steps:
    # -------------------------------------------------------------------------
    # Stage 1: Pre-flight Safety
    # -------------------------------------------------------------------------
    - step_id: "preflight_safety"
      name: "Pre-flight Safety Checks"
      stage: 1
      orchestrator: "EnforcementOrchestrator"
      convergence_gate:
        max_cycles: 1
        success_criteria:
          git_clean: true
          tests_pass: true
        convergence_predicate: "no_uncommitted_changes and baseline_tests_pass"
      params:
        checks:
          - "git_status_clean"
          - "pytest_baseline"
        actions:
          on_dirty: "stash"
          on_test_failure: "abort"

    # -------------------------------------------------------------------------
    # Stage 2: Health Scan
    # -------------------------------------------------------------------------
    - step_id: "health_scan"
      name: "Repository Health Scan"
      stage: 2
      orchestrator: "HealthOrchestrator"
      depends_on: ["preflight_safety"]
      convergence_gate:
        max_cycles: 1
        success_criteria:
          scan_complete: true
          report_written: true
        convergence_predicate: "health_issues_yaml_exists"
      params:
        scan_targets:
          - "cortex/**"
          - "cortex_intelligence/**"
          - "cortex-registry/**"
          - "cortex-docs/**"
          - "tests/**"
          - ".cortex-runtime/**"
          - ".github/**"
          - "scripts/**"
          - "docs/**"
        exclude_patterns:
          - ".git/**"
          - ".venv/**"
          - "__pycache__/**"
          - "node_modules/**"
          - "_workspaces/**"  # Exception per user request
        checks:
          - id: "H-001"
            name: "screaming_case"
            pattern: "[A-Z]{3,}"
            file_types: ["*"]
          - id: "H-002"
            name: "empty_files"
            condition: "size == 0"
            exclude: [".gitkeep", "__init__.py"]
          - id: "H-003"
            name: "orphaned_directories"
            condition: "no_children"
          - id: "H-004"
            name: "orphaned_files"
            condition: "no_imports_no_config_refs"
            file_types: [".py", ".yaml", ".json"]
          - id: "H-005"
            name: "duplicate_content"
            method: "md5_hash"
            min_size: 100
          - id: "H-006"
            name: "deprecated_markers"
            patterns: ["DEPRECATED", "TODO: remove", "FIXME: delete"]
          - id: "H-007"
            name: "wrong_references"
            replacements:
              - old: "cortex_brain"
                new: "cortex_intelligence"
              - old: "_cortex-master"
                new: "cortex-registry"
          - id: "H-008"
            name: "stale_files"
            days_threshold: 90
            require_no_refs: true
          - id: "H-009"
            name: "oversized_files"
            max_bytes: 512000
            exclude_binary: true
          - id: "H-010"
            name: "invalid_markdown"
            allowed_paths:
              - ".github/prompts/**"
              - ".github/agents/**"
              - "docs/**"
              - "cortex-docs/**"
              - "cortex-registry/**"
              - "_workspaces/**"
              - "**/README.md"
        output: "cortex/brain/vacuum/health-issues.yaml"

    # -------------------------------------------------------------------------
    # Stage 3: Interactive Review (Optional)
    # -------------------------------------------------------------------------
    - step_id: "review_issues"
      name: "Review Detected Issues"
      stage: 3
      mode: "interactive"  # Set to "autonomous" for unattended execution
      depends_on: ["health_scan"]
      convergence_gate:
        max_cycles: 1
        success_criteria:
          review_complete: true
        convergence_predicate: "user_approved or mode == autonomous"
      params:
        input: "cortex/brain/vacuum/health-issues.yaml"
        display_format: "markdown_table"
        approval_required: true
        timeout_minutes: 30
        on_timeout: "abort"

    # -------------------------------------------------------------------------
    # Stage 4: Vacuum Execution
    # -------------------------------------------------------------------------
    - step_id: "vacuum_execute"
      name: "Execute Cleanup Operations"
      stage: 4
      orchestrator: "VacuumOrchestrator"
      depends_on: ["review_issues"]
      convergence_gate:
        max_cycles: 3
        success_criteria:
          all_operations_complete: true
          no_errors: true
        convergence_predicate: "executed == planned and errors == 0"
      params:
        input: "cortex/brain/vacuum/health-issues.yaml"
        dry_run: false  # Set to true for preview mode
        operations:
          - id: "V-001"
            name: "delete_unneeded"
            targets: ["screaming_case", "empty_files", "deprecated_code", "invalid_markdown"]
            protected: "{{protected_files}}"
          - id: "V-002"
            name: "rename_screaming_to_kebab"
            max_length: 30
            preserve_extension: true
          - id: "V-003"
            name: "relocate_files"
            rules:
              - pattern: "^EXECUTIVE.*\\.md$"
                destination: "docs/executive"
              - pattern: "^PHASE.*\\.md$"
                destination: "docs/phases"
              - pattern: ".*[Rr]eport.*\\.md$"
                destination: "reports"
          - id: "V-004"
            name: "clean_root"
            allowed_root_files:
              - "pytest.ini"
              - "requirements.txt"
              - "README.md"
              - ".gitignore"
              - "conftest.py"
              - "pyproject.toml"
              - "Makefile"
              - "health_stubs.json"
            move_others_to: "scripts/"
          - id: "V-005"
            name: "remove_empty_directories"
            exclude: [".git", ".venv", "__pycache__"]
        rollback:
          enabled: true
          manifest: "cortex/brain/vacuum/rollback-manifest.json"

    # -------------------------------------------------------------------------
    # Stage 5: Verification & Teardown
    # -------------------------------------------------------------------------
    - step_id: "verification"
      name: "Post-Cleanup Verification"
      stage: 5
      orchestrator: "TDDOrchestrator"
      depends_on: ["vacuum_execute"]
      convergence_gate:
        max_cycles: 2
        success_criteria:
          all_tests_pass: true
          governance_compliant: true
        convergence_predicate: "test_failures == 0 and violations == 0"
      params:
        test_suites:
          - "tests/golden/**"
          - "tests/unit/**"
        governance_checks:
          - "CORE-002"
          - "CORE-028"

  # ===========================================================================
  # EPILOGUES (Teardown)
  # ===========================================================================
  epilogues:
    - epilogue_id: "cleanup_report"
      name: "Generate Cleanup Report"
      trigger: "verification_complete"
      description: "Summary of all operations performed"
      output_format: "chat_markdown"  # NOT file (CORE-002)
      
    - epilogue_id: "delete_handoff"
      name: "Delete Health Issues File"
      trigger: "verification_complete"
      description: "Remove temporary handoff file"
      action: "delete"
      target: "cortex/brain/vacuum/health-issues.yaml"
      
    - epilogue_id: "delete_rollback_manifest"
      name: "Delete Rollback Manifest"
      trigger: "verification_complete"
      condition: "no_rollback_needed"
      action: "delete"
      target: "cortex/brain/vacuum/rollback-manifest.json"
      
    - epilogue_id: "git_commit"
      name: "Commit Cleanup Changes"
      trigger: "all_epilogues_complete"
      action: "git_commit"
      message: "chore: Health-Vacuum pipeline cleanup (Phase 48)"
      
  # ===========================================================================
  # GOLDEN TEST SCENARIOS
  # ===========================================================================
  golden_tests:
    location: "tests/golden/orchestrators/health_vacuum/"
    scenarios:
      health_orchestrator:
        - id: "GH-001"
          name: "Detect screaming case files"
          input:
            files: ["TEST-FILE.txt", "WAVE-1-CERT.txt"]
          expected:
            issues_found: 2
            category: "screaming_case"
            
        - id: "GH-002"
          name: "Detect empty Python files"
          input:
            files: ["empty_stub.py"]
            content: ""
          expected:
            issues_found: 1
            category: "empty_files"
            
        - id: "GH-003"
          name: "Detect orphaned directories"
          input:
            directories: ["cortex/wiring/specs/"]
            children: 0
          expected:
            issues_found: 1
            category: "orphaned_directories"
            
        - id: "GH-004"
          name: "Detect wrong references"
          input:
            content: "from cortex_brain import something"
          expected:
            issues_found: 1
            category: "wrong_references"
            recommended: "from cortex_intelligence import something"
            
        - id: "GH-005"
          name: "Detect invalid markdown location"
          input:
            file: "cortex/agents/REPORT.md"
          expected:
            issues_found: 1
            category: "invalid_markdown"
            
        - id: "GH-006"
          name: "Respect protected files"
          input:
            files: ["README.md", "pytest.ini"]
          expected:
            issues_found: 0
            
        - id: "GH-007"
          name: "Respect _workspaces exception"
          input:
            files: ["_workspaces/chat.md"]
          expected:
            issues_found: 0
            
      vacuum_orchestrator:
        - id: "GV-001"
          name: "Rename screaming to kebab"
          input:
            file: "WAVE-1-CERTIFICATE.txt"
          expected:
            renamed_to: "wave-1-certificate.txt"
            
        - id: "GV-002"
          name: "Truncate long names"
          input:
            file: "THIS-IS-A-VERY-LONG-FILENAME-THAT-EXCEEDS-LIMIT.txt"
          expected:
            renamed_to: "this-is-a-very-long-f.txt"
            max_length: 30
            
        - id: "GV-003"
          name: "Delete empty directories"
          input:
            directory: "cortex/wiring/specs/"
          expected:
            deleted: true
            
        - id: "GV-004"
          name: "Relocate root scripts"
          input:
            file: "cleanup_script.py"
            location: "/"
          expected:
            moved_to: "scripts/cleanup_script.py"
            
        - id: "GV-005"
          name: "Rollback on test failure"
          input:
            operations: ["delete", "rename"]
            test_result: "FAIL"
          expected:
            rollback_executed: true
            original_state_restored: true
            
        - id: "GV-006"
          name: "Delete handoff file on success"
          input:
            handoff_file: "cortex/brain/vacuum/health-issues.yaml"
            verification_result: "PASS"
          expected:
            handoff_deleted: true
            
      pipeline_integration:
        - id: "GP-001"
          name: "End-to-end happy path"
          stages: ["preflight_safety", "health_scan", "vacuum_execute", "verification"]
          expected:
            all_stages_pass: true
            handoff_deleted: true
            tests_pass: true
            
        - id: "GP-002"
          name: "Abort on dirty git state"
          input:
            git_status: "dirty"
          expected:
            stage: "preflight_safety"
            action: "stash"
            
        - id: "GP-003"
          name: "Dry run mode"
          input:
            dry_run: true
          expected:
            operations_logged: true
            files_unchanged: true
