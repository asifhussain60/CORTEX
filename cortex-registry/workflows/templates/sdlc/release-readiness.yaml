# SDLC Workflow Template: Release Readiness
# Phase: 79 (GAP-79-B-07) | Sweep: SWEEP-79-SDLC-INTELLIGENCE-ENGINE
# Primitive references: cortex-registry/workflows/templates/primitives/
# No version field — append-only YAML standard (CORE-002)

id: sdlc-release-readiness
title: "Release Readiness Workflow"
description: |
  Holistic pre-release verification: audit gate → security gate → documentation
  check → deployment readiness. Composes audit-fix-pipeline as inner composite.
  Convergence gate: all P0/P1 issues resolved before release cleared.
  Outputs BLOCK-ANALYSIS with release go/no-go recommendation.

triggers:
  intents: ["RELEASE", "DEPLOY", "SHIP", "RELEASE_GATE"]
  mode_keywords: ["ready to release", "release gate", "deploy", "production ready"]

knowledge_context:
  primary: "sdlc/documentation-strategy.yaml"
  supplementary:
    - "sdlc/code-review-checklist.yaml"
    - "sdlc/security-by-design.yaml"
    - "sdlc/test-strategy-selection.yaml"
  company_overrides:
    - "company/domains/api-standards.yaml"
    - "company/domains/security-standards.yaml"
    - "company/domains/payment-security.yaml"
  resolution_order: "company > sdlc > domain > generic"

workflow:
  steps:
    - id: knowledge_injection
      name: "Inject Release Knowledge"
      template_ref: "primitives/analysis/intelligence-injection.yaml"
      inputs:
        knowledge_context: "{{knowledge_context.primary}}"
        supplementary: "{{knowledge_context.supplementary}}"
        company_context: "{{knowledge_context.company_overrides}}"
      outputs: ["release_criteria", "doc_requirements", "security_requirements"]

    - id: audit_gate
      name: "Production Readiness Audit"
      template_ref: "audit/audit-fix-pipeline.yaml"
      inputs:
        scope: "{{request.scope | default: 'workspace'}}"
        auto_fix: "{{request.auto_fix | default: true}}"
        convergence: true
      outputs: ["audit_results", "p0_count", "p1_count"]

    - id: security_gate
      name: "Security Gate"
      template_ref: "primitives/governance/security-check.yaml"
      inputs:
        security_requirements: "{{knowledge_injection.security_requirements}}"
        scope: "{{request.scope}}"
      outputs: ["security_clearance", "security_findings"]

    - id: documentation_check
      name: "Documentation Completeness Check"
      action: "inline"
      description: |
        Verify documentation meets release standards from documentation-strategy.yaml:
          - OpenAPI spec current (if endpoints changed)
          - README updated (if behavior changed)
          - ADR exists (if architecture decision made)
          - Runbook updated (if ops behavior changed)
          - CHANGELOG entry present
      outputs: ["doc_clearance", "doc_gaps"]

    - id: deployment_readiness
      name: "Deployment Readiness Verification"
      action: "inline"
      description: |
        Final checks before go/no-go:
          1. All tests GREEN (smoke ≥ 1,211 for CORTEX)
          2. Zero P0/P1 audit violations
          3. Security gate passed
          4. Documentation complete
          5. No uncommitted changes
      outputs: ["go_no_go", "blocking_items"]

  convergence_loop:
    template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
    gate: "p0_count == 0 and p1_count == 0 and security_clearance == PASSED"
    max_iterations: 5

  output:
    response_block: "BLOCK-ANALYSIS"
    format: "go/no-go recommendation + blocking items + audit summary + security summary"
    git_policy: "no_push — release decision requires human approval"

completion_gate:
  required_outputs: ["audit_results", "security_clearance", "doc_clearance", "go_no_go"]
  quality_threshold: "Zero P0/P1 violations; security passed; docs complete; human approved"
