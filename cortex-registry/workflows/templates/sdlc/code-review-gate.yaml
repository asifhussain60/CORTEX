# SDLC Workflow Template: Code Review Gate
# Phase: 79 (GAP-79-B-04) | Sweep: SWEEP-79-SDLC-INTELLIGENCE-ENGINE
# Primitive references: cortex-registry/workflows/templates/primitives/
# No version field — append-only YAML standard (CORE-002)

id: sdlc-code-review-gate
title: "Code Review Gate Workflow"
description: |
  Automated code review: static analysis + findings report + severity
  classification + fix-or-accept decision gate. Uses detect-fix-rescan-loop
  for convergence. Outputs BLOCK-CODE-REVIEW response template.

triggers:
  intents: ["REVIEW", "FIX", "REFACTOR_COMPLETE"]
  mode_keywords: ["review", "check quality", "lint", "what's wrong", "code review"]

knowledge_context:
  primary: "sdlc/code-review-checklist.yaml"
  supplementary:
    - "backend-python/code-review.yaml"
    - "security/secure-coding-practices.yaml"
    - "architecture/engineering-solid-principles.yaml"
  company_overrides:
    - "company/domains/api-standards.yaml"
    - "company/domains/payment-security.yaml"
  resolution_order: "stack-specific > sdlc > domain > generic"

workflow:
  steps:
    - id: knowledge_injection
      name: "Inject Review Knowledge"
      template_ref: "primitives/analysis/intelligence-injection.yaml"
      inputs:
        knowledge_context: "{{knowledge_context.primary}}"
        supplementary: "{{knowledge_context.supplementary}}"
        company_context: "{{knowledge_context.company_overrides}}"
      outputs: ["review_gates", "severity_matrix", "company_constraints"]

    - id: static_analysis
      name: "Static Analysis"
      action: "inline"
      description: |
        Run automated checks from code-review-checklist.yaml review_gates:
          P0: security checks (bandit, secrets scan)
          P1: code quality (ruff, mypy, complexity analysis)
          P2: performance patterns (N+1, blocking I/O)
          P3: documentation (docstring coverage, README)
      outputs: ["findings_by_severity", "total_p0", "total_p1"]

    - id: api_contract_check
      name: "API Contract Verification"
      action: "inline"
      description: |
        Verify API changes conform to company/domains/api-standards.yaml:
          - Versioning policy respected
          - OpenAPI spec updated if endpoints changed
          - No breaking changes without version bump
      outputs: ["api_conformance"]

    - id: convergence
      name: "Fix-or-Accept Decision Gate"
      template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
      inputs:
        findings: "{{static_analysis.findings_by_severity}}"
        blocking_count: "{{static_analysis.total_p0}}"
        required_count: "{{static_analysis.total_p1}}"
        auto_fix: "{{request.auto_fix | default: true}}"
      outputs: ["resolved_findings", "accepted_findings", "quality_clearance"]

    - id: regression_gate
      name: "Regression Test Gate"
      template_ref: "primitives/validation/regression-test.yaml"
      inputs:
        scope: "{{request.changed_files}}"
      outputs: ["regression_result"]

  convergence_loop:
    template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
    gate: "total_p0 == 0 and total_p1 == 0"
    max_iterations: 5

  output:
    response_block: "BLOCK-CODE-REVIEW"
    format: "inline findings table: severity | file | line | issue | status"
    git_policy: "no_commit — review outputs findings only"

completion_gate:
  required_outputs: ["findings_by_severity", "quality_clearance", "regression_result"]
  quality_threshold: "Zero P0 findings; zero P1 findings; regression tests pass"
