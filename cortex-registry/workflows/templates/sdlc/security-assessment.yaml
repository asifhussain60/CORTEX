# SDLC Workflow Template: Security Assessment
# Phase: 79 (GAP-79-B-06) | Sweep: SWEEP-79-SDLC-INTELLIGENCE-ENGINE
# Primitive references: cortex-registry/workflows/templates/primitives/
# No version field — append-only YAML standard (CORE-002)

id: sdlc-security-assessment
title: "Security Assessment Workflow"
description: |
  STRIDE threat model → OWASP check → vulnerability scan → remediation plan.
  Uses security-hardening + threat-model-analysis primitives. Knowledge context
  from security-by-design.yaml + secure-coding-practices.yaml.
  Outputs BLOCK-SECURITY-ASSESSMENT response template.

triggers:
  intents: ["SECURITY_AUDIT", "THREAT_MODEL", "VULNERABILITY_SCAN"]
  mode_keywords: ["security", "threat model", "owasp", "vulnerability", "secure"]

knowledge_context:
  primary: "sdlc/security-by-design.yaml"
  supplementary:
    - "security/secure-coding-practices.yaml"
    - "../knowledge-base/security/owasp-top10.yaml"
    - "../knowledge-base/security/cicd-hardening.yaml"
  company_overrides:
    - "company/domains/security-standards.yaml"
    - "company/domains/payment-security.yaml"
  resolution_order: "company > sdlc > domain > generic"

workflow:
  steps:
    - id: knowledge_injection
      name: "Inject Security Knowledge"
      template_ref: "primitives/analysis/intelligence-injection.yaml"
      inputs:
        knowledge_context: "{{knowledge_context.primary}}"
        supplementary: "{{knowledge_context.supplementary}}"
        company_context: "{{knowledge_context.company_overrides}}"
      outputs: ["threat_patterns", "owasp_mitigations", "company_requirements"]

    - id: lens_scan
      name: "LENS Security Scan"
      template_ref: "primitives/analysis/lens-ast-scan.yaml"
      inputs:
        scope: "{{request.scope | default: 'workspace'}}"
        depth: "full"
        focus: "security"
      outputs: ["security_surface", "external_interfaces", "data_flows"]

    - id: stride_analysis
      name: "STRIDE Threat Modeling"
      action: "inline"
      description: |
        Apply STRIDE framework from security-by-design.yaml:
          For each component in security_surface:
            - Spoofing: auth mechanisms evaluated
            - Tampering: integrity controls checked
            - Repudiation: audit logging verified
            - Information Disclosure: data exposure mapped
            - Denial of Service: resource limits checked
            - Elevation of Privilege: permission boundaries checked
          DREAD score computed per threat (1-3 per dimension, threshold at 12)
      outputs: ["threat_table", "dread_scores", "high_priority_threats"]

    - id: owasp_check
      name: "OWASP Top 10 Verification"
      template_ref: "primitives/governance/security-check.yaml"
      inputs:
        code_surface: "{{lens_scan.security_surface}}"
        owasp_knowledge: "{{knowledge_injection.owasp_mitigations}}"
        company_requirements: "{{knowledge_injection.company_requirements}}"
      outputs: ["owasp_findings", "pci_dss_gaps"]

    - id: remediation_plan
      name: "Remediation Plan Generation"
      action: "inline"
      description: |
        For each threat/finding with DREAD ≥ 8:
          1. Classify severity (P0/P1/P2/P3)
          2. Map to specific OWASP mitigation
          3. Assign timeline (P0: immediate, P1: this sprint, P2: next sprint)
          4. Generate concrete remediation steps
      outputs: ["remediation_plan", "p0_count", "p1_count"]

    - id: convergence
      name: "Security Convergence Gate"
      template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
      inputs:
        p0_count: "{{remediation_plan.p0_count}}"
        p1_count: "{{remediation_plan.p1_count}}"
        auto_remediate: "{{request.auto_remediate | default: false}}"
      outputs: ["security_clearance"]

  convergence_loop:
    template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
    gate: "p0_count == 0"
    max_iterations: 5

  output:
    response_block: "BLOCK-SECURITY-ASSESSMENT"
    format: "threat model (STRIDE) + OWASP mapping + severity classification + remediation timeline"
    git_policy: "no_commit — assessment outputs only"

completion_gate:
  required_outputs: ["threat_table", "owasp_findings", "remediation_plan", "security_clearance"]
  quality_threshold: "Zero P0 threats unmitigated; all OWASP categories evaluated"
