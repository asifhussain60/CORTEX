# SDLC Workflow Template: Integration Verification
# Phase: 79 (GAP-79-B-05) | Sweep: SWEEP-79-SDLC-INTELLIGENCE-ENGINE
# Primitive references: cortex-registry/workflows/templates/primitives/
# No version field — append-only YAML standard (CORE-002)

id: sdlc-integration-verification
title: "Integration Verification Workflow"
description: |
  Integration tests → regression pass → coverage gate → verification report.
  Uses regression-test + test-quality-enforcement primitives. Knowledge context
  from integration-strategy.yaml and test-strategy-selection.yaml.

triggers:
  intents: ["INTEGRATION_TEST", "VERIFY_INTEGRATION", "TEST_INTEGRATION"]
  mode_keywords: ["integration test", "verify", "end-to-end", "contract test"]

knowledge_context:
  primary: "sdlc/integration-strategy.yaml"
  supplementary:
    - "sdlc/test-strategy-selection.yaml"
    - "testing-validation/tdd-best-practices.yaml"
  company_overrides:
    - "company/domains/api-standards.yaml"
    - "company/infrastructure/topology.yaml"
  resolution_order: "stack-specific > sdlc > domain > generic"

workflow:
  steps:
    - id: knowledge_injection
      name: "Inject Integration Knowledge"
      template_ref: "primitives/analysis/intelligence-injection.yaml"
      inputs:
        knowledge_context: "{{knowledge_context.primary}}"
        supplementary: "{{knowledge_context.supplementary}}"
        company_context: "{{knowledge_context.company_overrides}}"
      outputs: ["test_patterns", "isolation_strategy", "company_constraints"]

    - id: contract_verification
      name: "Contract Test Verification"
      action: "inline"
      description: |
        Verify consumer-driven contracts per integration-strategy.yaml:
          1. Load pact files or schema contracts for changed APIs
          2. Verify provider satisfies all consumer contracts
          3. Flag broken contracts as P0
      outputs: ["contract_results", "broken_contracts"]

    - id: integration_tests
      name: "Integration Test Execution"
      template_ref: "primitives/validation/regression-test.yaml"
      inputs:
        test_scope: "integration"
        isolation: "{{knowledge_injection.isolation_strategy}}"
        company_constraints: "{{knowledge_injection.company_constraints}}"
      outputs: ["integration_results", "integration_coverage"]

    - id: regression_gate
      name: "Regression Gate"
      template_ref: "primitives/validation/regression-test.yaml"
      inputs:
        test_scope: "regression"
        baseline: "{{request.baseline_sha}}"
      outputs: ["regression_results", "new_failures"]

    - id: coverage_gate
      name: "Coverage Gate"
      template_ref: "primitives/validation/test-quality-enforcement.yaml"
      inputs:
        coverage_report: "{{integration_tests.integration_coverage}}"
        minimum_threshold: "{{knowledge_injection.test_patterns.integration_coverage_min | default: 70}}"
      outputs: ["coverage_clearance"]

  convergence_loop:
    template_ref: "primitives/validation/detect-fix-rescan-loop.yaml"
    gate: "broken_contracts == 0 and new_failures == 0 and coverage_clearance == PASSED"
    max_iterations: 3

  output:
    response_block: "BLOCK-ANALYSIS"
    format: "integration results table + contract verification + coverage summary"
    git_policy: "no_commit — verification outputs only"

completion_gate:
  required_outputs: ["contract_results", "integration_results", "regression_results", "coverage_clearance"]
  quality_threshold: "Zero contract breaks; zero regression failures; coverage meets threshold"
