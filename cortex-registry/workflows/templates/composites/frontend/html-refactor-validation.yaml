# =====================================================================================
# COMPOSITE: HTML Refactor + Validation Workflow
# =====================================================================================
# Tier: 2 (Composite — combines primitives)
# Purpose: Refactor HTML templates and validate structural/accessibility compliance
# Imports: lens-vision-scan, html-validation, css-zero-inline, audit-trace
# =====================================================================================

version: '1.0.0'
template_id: 'composites/frontend/html-refactor-validation'
name: 'HTML Refactoring + Structural Validation'
tier: 'composite'
category: 'frontend'
status: 'active'

metadata:
  description: |
    Composite workflow for refactoring HTML templates and validating compliance.
    Runs Vision API scan to detect layout issues, validates HTML semantics,
    enforces zero-inline-CSS (CORE-074), and checks accessibility (ARIA roles,
    alt attributes, heading hierarchy). Outputs a structured validation report inline.
  authority: 'Phase 63 — Golden Test Renaissance (SWEEP-63-GOLDEN-RENAISSANCE)'
  created: '2026-02-24'

imports:
  - template: 'composites/frontend/css-extraction.yaml'
    alias: css_extraction
  - template: 'primitives/validation/detect-fix-rescan-loop.yaml'
    alias: convergence_gate

validation_rules:
  - id: zero_inline_css
    rule: 'No inline style attributes — all styles in external CSS'
    severity: P0
    references: 'CORE-074'
  - id: semantic_html
    rule: 'Heading hierarchy (h1→h2→h3), landmark roles present'
    severity: P1
  - id: accessibility
    rule: 'All img tags have alt, all inputs have labels, ARIA roles correct'
    severity: P1
  - id: no_deprecated_tags
    rule: 'No <font>, <center>, <marquee>, or <blink> tags'
    severity: P1

steps:
  - id: css_inline_extraction
    uses: css_extraction
    params:
      enforce_zero_inline: true

  - id: html_structure_validation
    action: validate_html_structure
    input: '${css_inline_extraction.output}'
    rules: '${validation_rules}'

  - id: accessibility_check
    action: validate_accessibility
    input: '${html_structure_validation.output}'

  - id: convergence_check
    uses: convergence_gate
    params:
      max_iterations: 2
      p0_exit_condition: 'p0_count == 0'

outputs:
  - id: html_validation_report
    type: inline
    fields:
      - inline_styles_removed
      - validation_violations
      - accessibility_issues
      - convergence_iterations
      - final_p0_count
