id: composed/legacy-1d63fdeb
template_id: composed/legacy-1d63fdeb
name: "Composed: legacy \u2014 legacy-modernization"
category: composed
tier: composed
status: active
source: composer
steps:
- step_id: AST_PARSE
  name: Parse source files into AST
  action: "For each file in target_files:\n  1. Detect language from extension (.cs,\
    \ .ts, .py, .js)\n  2. Invoke language-specific parser:\n     - C#: Roslyn SyntaxTree.ParseText()\n\
    \     - TypeScript: ts.createSourceFile()\n     - Python: ast.parse()\n  3. Store\
    \ parsed AST in memory cache\n"
  outputs:
  - parsed_ast_cache
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: EXTRACT_SYMBOLS
  name: Extract classes, methods, functions
  action: "Walk AST and extract:\n  - Classes/interfaces/enums with line ranges\n\
    \  - Methods/functions with parameter signatures\n  - Properties/fields with types\n\
    \  - Import/using statements\n"
  outputs:
  - symbol_table.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: COMPUTE_METRICS
  name: Calculate complexity metrics
  condition: '{{include_metrics}} == true'
  action: "For each symbol:\n  - LOC (lines of code, excluding comments/blanks)\n\
    \  - Cyclomatic complexity (branches + 1)\n  - Cognitive complexity (nesting depth\
    \ weighted)\n  - Parameter count per method\n"
  outputs:
  - complexity_metrics.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: BUILD_DEPENDENCY_GRAPH
  name: Construct dependency relationships
  condition: '{{extract_dependencies}} == true'
  action: "From imports/usings:\n  - Internal dependencies (within project)\n  - External\
    \ dependencies (packages/libraries)\n  - Circular dependency detection\n"
  outputs:
  - dependency_graph.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- id: ac_start
  name: Emit AC_START marker
  action: emit_marker
  marker: 'AC_START: AC-{{domain}}-{{session_id}}'
  persist_to: '{{persistence}}'
  table: audit_sessions
  columns:
    session_id: '{{session_id}}'
    domain: '{{domain}}'
    parent_session_id: '{{parent_session_id}}'
    started_at: '{{now_iso}}'
    status: running
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
- id: ac_complete_success
  name: Emit AC_COMPLETE marker (success)
  action: emit_marker
  condition: workflow_succeeded
  marker: "AC_COMPLETE: AC-{{domain}}-{{session_id}} \u2705 ({{duration_ms}}ms)"
  persist_to: '{{persistence}}'
  table: audit_sessions
  update:
    session_id: '{{session_id}}'
    completed_at: '{{now_iso}}'
    duration_ms: '{{duration_ms}}'
    status: complete
    exit_status: clean
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
- id: ac_complete_failure
  name: Emit AC_COMPLETE marker (failure)
  action: emit_marker
  condition: workflow_failed
  marker: "AC_COMPLETE: AC-{{domain}}-{{session_id}} \u274C ({{duration_ms}}ms) \u2014\
    \ {{error_class}}"
  persist_to: '{{persistence}}'
  table: audit_sessions
  update:
    session_id: '{{session_id}}'
    completed_at: '{{now_iso}}'
    duration_ms: '{{duration_ms}}'
    status: failed
    exit_status: '{{error_class}}'
    error_message: '{{error_message}}'
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
- step_id: SCAN_INLINE_STYLES
  name: Detect inline style="" attributes
  action: "For each file in target_files:\n  1. Parse HTML/JSX/TSX content\n  2. Find\
    \ all elements with style=\"\" or style={{...}} attributes\n  3. Extract:\n  \
    \   - Element tag name\n     - Line number\n     - Full style value\n     - Parent\
    \ context (for class name generation)\n  4. Build violation report\n"
  outputs:
  - inline_style_violations.json
  source_category: validation
  source_primitive: primitives/validation/css-zero-inline
- step_id: SCAN_STYLE_BLOCKS
  name: Inventory <style> blocks
  action: "For each file in target_files:\n  1. Find all <style> and <style scoped>\
    \ blocks\n  2. Extract:\n     - Line range (start, end)\n     - CSS content\n\
    \     - Scoped attribute presence\n  3. Flag if allow_style_blocks == false\n"
  outputs:
  - style_block_inventory.json
  source_category: validation
  source_primitive: primitives/validation/css-zero-inline
- step_id: CHECK_EXTERNAL_CSS
  name: Verify external CSS linkage
  action: "For each file in target_files:\n  1. Find all <link rel=\"stylesheet\"\
    > tags\n  2. Verify referenced .css files exist\n  3. Flag missing CSS files\n"
  outputs:
  - external_css_links.json
  source_category: validation
  source_primitive: primitives/validation/css-zero-inline
- step_id: GENERATE_VIOLATIONS
  name: Compile violation report
  action: "Merge findings:\n  - Inline style violations (always blocked)\n  - Style\
    \ block violations (if allow_style_blocks == false)\n  - Missing CSS file warnings\n\
    \nAssign severity per configured level.\n"
  outputs:
  - css_violations.json
  source_category: validation
  source_primitive: primitives/validation/css-zero-inline
- step_id: AUTO_EXTRACT
  name: Extract inline styles to external CSS
  condition: '{{auto_extract}} == true AND violations_found'
  action: "For each inline style violation:\n  1. Generate unique class name (BEM:\
    \ block__element--modifier)\n  2. Extract style rules to extract_target .css file\n\
    \  3. Replace style=\"\" with class=\"\" in source file\n  4. Re-validate after\
    \ extraction\n"
  outputs:
  - extraction_report.json
  - '{{extract_target}}'
  source_category: validation
  source_primitive: primitives/validation/css-zero-inline
convergence_gate:
  max_cycles: 5
  success_predicate: all_steps_passed and validation_clean
  backoff_strategy: linear
metadata:
  operation_type: legacy
  description: legacy-modernization
  primitive_categories:
  - analysis
  - execution
  - validation
  composed: true
  sweep_enforced: false
  core_064_compliant: false
  core_065_compliant: false
