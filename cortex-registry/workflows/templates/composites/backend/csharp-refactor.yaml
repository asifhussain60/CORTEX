# ============================================================================
# COMPOSITE: C# SOLID Refactoring Workflow
# ============================================================================
# Tier: 2 (Composite — combines primitives)
# Purpose: SOLID principle violations detection and refactoring
# Imports: lens-ast-scan, duplicate-detection, regression-test, audit-trace
# ============================================================================

version: '1.0.0'
template_id: 'composites/backend/csharp-refactor'
name: 'C# SOLID Refactoring Workflow'
tier: 'composite'
category: 'backend'
status: 'active'

metadata:
  description: |
    Composite workflow for refactoring C# code to comply with SOLID principles.
    Addresses God classes, circular dependencies, missing DI, and embedded
    business logic in controllers.
  
  tags:
    - composite
    - backend
    - csharp
    - solid
    - refactoring
    - clean-architecture
  
  smells_addressed:
    - SMELL-3: God class (Program.cs handles 6+ domains)
    - SMELL-4: Business logic in controllers
    - SMELL-5: Circular dependencies
    - SMELL-17: No dependency injection
  
  author: 'CORTEX Architecture Team'
  created: '2026-02-22'

# ============================================================================
# IMPORTS — Primitive Templates
# ============================================================================
imports:
  - template_id: 'primitives/analysis/lens-ast-scan'
    alias: 'ast'
    required: true
  
  - template_id: 'primitives/validation/duplicate-detection'
    alias: 'dupe'
    required: true
  
  - template_id: 'primitives/validation/regression-test'
    alias: 'test'
    required: true
  
  - template_id: 'primitives/execution/audit-trace'
    alias: 'audit'
    required: true

# ============================================================================
# REQUIRED CORTEX TOOLING
# ============================================================================
cortex_tooling:
  orchestrators:
    - name: 'RefactoringOrchestrator'
      purpose: 'SOLID refactoring coordination'
      required: true
    
    - name: 'ServiceDecompositionOrchestrator'
      purpose: 'God class decomposition'
      required: true
  
  mcp_tools:
    - name: 'cortex_refactor'
      purpose: 'Semantic refactoring operations'
      required: true
    
    - name: 'cortex_validate_compliance'
      purpose: 'CORE rule validation'
      required: true

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  required:
    - name: 'project_path'
      type: 'Path'
      description: 'Path to C# project'
  
  optional:
    - name: 'max_class_loc'
      type: 'int'
      description: 'Maximum lines of code per class'
      default: 300
    
    - name: 'max_method_loc'
      type: 'int'
      description: 'Maximum lines of code per method'
      default: 50
    
    - name: 'max_dependencies'
      type: 'int'
      description: 'Maximum dependencies per class'
      default: 7
    
    - name: 'auto_decompose'
      type: 'bool'
      description: 'Automatically decompose God classes'
      default: false

# ============================================================================
# SOLID CHECKS
# ============================================================================
solid_checks:
  # --------------------------------------------------------------------------
  # Single Responsibility Principle
  # --------------------------------------------------------------------------
  - check_id: 'SRP_VIOLATION'
    principle: 'Single Responsibility'
    
    detection:
      - condition: 'class.loc > max_class_loc'
        description: 'Class exceeds LOC threshold'
      
      - condition: 'class.method_count > 15'
        description: 'Class has too many methods'
      
      - condition: 'class.domains > 1'
        description: 'Class handles multiple domains'
    
    remediation: 'Extract domain-specific logic into separate services'

  # --------------------------------------------------------------------------
  # Open/Closed Principle
  # --------------------------------------------------------------------------
  - check_id: 'OCP_VIOLATION'
    principle: 'Open/Closed'
    
    detection:
      - condition: 'switch_case_count > 5'
        description: 'Large switch statements indicate OCP violation'
      
      - condition: 'type_checking (is/as) > 3'
        description: 'Excessive type checking'
    
    remediation: 'Replace switch with polymorphism'

  # --------------------------------------------------------------------------
  # Liskov Substitution Principle
  # --------------------------------------------------------------------------
  - check_id: 'LSP_VIOLATION'
    principle: 'Liskov Substitution'
    
    detection:
      - condition: 'throws NotImplementedException in override'
        description: 'Override throws NotImplementedException'
      
      - condition: 'override changes base contract'
        description: 'Override violates base class contract'
    
    remediation: 'Ensure derived classes are substitutable for base'

  # --------------------------------------------------------------------------
  # Interface Segregation Principle
  # --------------------------------------------------------------------------
  - check_id: 'ISP_VIOLATION'
    principle: 'Interface Segregation'
    
    detection:
      - condition: 'interface.method_count > 7'
        description: 'Interface has too many methods'
      
      - condition: 'implementor implements < 50% of interface'
        description: 'Implementor uses fraction of interface'
    
    remediation: 'Split large interfaces into role-specific interfaces'

  # --------------------------------------------------------------------------
  # Dependency Inversion Principle
  # --------------------------------------------------------------------------
  - check_id: 'DIP_VIOLATION'
    principle: 'Dependency Inversion'
    
    detection:
      - condition: 'new ConcreteClass() in constructor'
        description: 'Direct instantiation of concrete class'
      
      - condition: 'no constructor injection'
        description: 'Missing dependency injection'
      
      - condition: 'static method calls to concrete classes'
        description: 'Static coupling to concrete implementations'
    
    remediation: 'Inject interfaces via constructor'

# ============================================================================
# WORKFLOW STAGES
# ============================================================================
stages:
  # --------------------------------------------------------------------------
  # STAGE 1: AST Analysis
  # --------------------------------------------------------------------------
  - stage_id: 'S1_ANALYSIS'
    name: 'Deep AST Analysis'
    
    invoke:
      - primitive: 'audit'
        action: 'on_start'
        params:
          workflow_name: 'csharp-refactor'
      
      - primitive: 'ast'
        params:
          target_files: '{{project_path}}'
          language: 'csharp'
          depth: 'deep'
          include_metrics: true
          extract_dependencies: true
    
    outputs:
      - 'symbol_table.json'
      - 'complexity_metrics.json'
      - 'dependency_graph.json'

  # --------------------------------------------------------------------------
  # STAGE 2: SOLID Violation Detection
  # --------------------------------------------------------------------------
  - stage_id: 'S2_SOLID_CHECK'
    name: 'SOLID Principle Validation'
    
    action: |
      For each class in symbol_table:
        1. Check SRP (LOC, method count, domain count)
        2. Check OCP (switch statements, type checking)
        3. Check LSP (override behavior)
        4. Check ISP (interface size)
        5. Check DIP (constructor dependencies)
    
    outputs:
      - 'solid_violations.json'
    
    success_criteria:
      - 'All classes analyzed'
      - 'Violations categorized by principle'

  # --------------------------------------------------------------------------
  # STAGE 3: Circular Dependency Detection
  # --------------------------------------------------------------------------
  - stage_id: 'S3_CYCLES'
    name: 'Circular Dependency Detection'
    
    action: |
      Analyze dependency_graph:
        1. Find all strongly connected components
        2. Identify circular dependency chains
        3. Calculate breaking points
    
    outputs:
      - 'circular_dependencies.json'

  # --------------------------------------------------------------------------
  # STAGE 4: Duplicate Detection
  # --------------------------------------------------------------------------
  - stage_id: 'S4_DUPLICATES'
    name: 'Duplicate Code Detection'
    
    invoke:
      - primitive: 'dupe'
        params:
          target_files: '{{project_path}}'
          similarity_threshold: 0.85
          detection_scope: 'functions'
    
    outputs:
      - 'duplicate_report.json'

  # --------------------------------------------------------------------------
  # STAGE 5: Decomposition Planning
  # --------------------------------------------------------------------------
  - stage_id: 'S5_PLAN'
    name: 'Generate Decomposition Plan'
    
    action: |
      For God classes (SRP violations):
        1. Identify domain boundaries
        2. Generate service interface stubs
        3. Plan DI registration
        4. Calculate extraction order
    
    outputs:
      - 'decomposition_plan.json'

  # --------------------------------------------------------------------------
  # STAGE 6: Auto-Decompose (Optional)
  # --------------------------------------------------------------------------
  - stage_id: 'S6_DECOMPOSE'
    name: 'Execute Decomposition'
    condition: '{{auto_decompose}} == true'
    
    action: |
      For each decomposition target:
        1. Extract methods to new service class
        2. Create interface
        3. Update DI registration
        4. Replace direct calls with interface calls
    
    outputs:
      - 'decomposition_result.json'

  # --------------------------------------------------------------------------
  # STAGE 7: Regression Test
  # --------------------------------------------------------------------------
  - stage_id: 'S7_TEST'
    name: 'Regression Tests'
    
    invoke:
      - primitive: 'test'
        params:
          test_framework: 'dotnet'
          test_path: '{{project_path}}'
    
    success_criteria:
      - 'All tests pass'
      - 'No new test failures'

  # --------------------------------------------------------------------------
  # STAGE 8: Finalize
  # --------------------------------------------------------------------------
  - stage_id: 'S8_FINALIZE'
    name: 'Generate Refactoring Report'
    
    invoke:
      - primitive: 'audit'
        action: 'on_complete'
    
    outputs:
      - 'refactor_summary.json'

# ============================================================================
# OUTPUTS
# ============================================================================
outputs:
  primary:
    - name: 'refactor_report'
      path: '{{output_dir}}/csharp_refactor_report.json'
      schema: |
        {
          "project": "string",
          "solid_violations": {
            "srp": "int",
            "ocp": "int",
            "lsp": "int",
            "isp": "int",
            "dip": "int"
          },
          "god_classes": ["string"],
          "circular_dependencies": [["string"]],
          "duplicates": "int",
          "decomposition_candidates": [{
            "class": "string",
            "suggested_services": ["string"]
          }],
          "tests_passed": "bool"
        }

# ============================================================================
# GOLDEN TESTS
# ============================================================================
golden_tests:
  test_file: 'tests/golden/test_csharp_refactor_truth.py'
  test_count: 15
  acceptance_criteria:
    - 'AC-CR-001: God classes detected (>300 LOC or >15 methods)'
    - 'AC-CR-002: Circular dependencies identified'
    - 'AC-CR-003: DIP violations flagged (new ConcreteClass())'
    - 'AC-CR-004: SRP violations reported with domain analysis'
    - 'AC-CR-005: Decomposition plan generated for each God class'
    - 'AC-CR-006: Service interfaces created during decomposition'
    - 'AC-CR-007: DI registration updated after decomposition'
    - 'AC-CR-008: Duplicate methods consolidated (CORE-035)'
    - 'AC-CR-009: Regression tests pass after refactoring'
    - 'AC-CR-010: AC_START/AC_COMPLETE markers emitted'
    - 'AC-CR-011: Complexity metrics included in report'
    - 'AC-CR-012: Dependency graph exported'
    - 'AC-CR-013: ISP violations detected for large interfaces'
    - 'AC-CR-014: OCP violations flagged for switch statements'
    - 'AC-CR-015: Audit trail persisted with all stages'

# ============================================================================
# AUDIT TRACE
# ============================================================================
audit_trace:
  emit_markers: true
  markers:
    start: 'AC_START:CSHARP_REFACTOR'
    complete: 'AC_COMPLETE:CSHARP_REFACTOR'
    failure: 'AC_FAILURE:CSHARP_REFACTOR'
  
  log_fields:
    - 'project_path'
    - 'classes_analyzed'
    - 'solid_violations_total'
    - 'god_classes_found'
    - 'circular_deps_found'
    - 'decompositions_applied'
    - 'duration_ms'
