steps:
- id: holistic_file_review_gate_open
  action: HolisticFileReviewGate.open_session
  args:
    operation_type: IMPLEMENT
    scope_files: __resolved_at_runtime__
    intent_description: implement cortex/auth/authenticator.py cortex/auth/token_manager.py
      cortex/auth/session_store.py cortex/auth/middleware.py cortex/auth/validators.py
  blocking: true
  source_category: governance
  source_primitive: holistic-file-review-gate
  governance_rule: CORE-065
  phase: BEFORE
- step_id: AST_PARSE
  name: Parse source files into AST
  action: "For each file in target_files:\n  1. Detect language from extension (.cs,\
    \ .ts, .py, .js)\n  2. Invoke language-specific parser:\n     - C#: Roslyn SyntaxTree.ParseText()\n\
    \     - TypeScript: ts.createSourceFile()\n     - Python: ast.parse()\n  3. Store\
    \ parsed AST in memory cache\n"
  outputs:
  - parsed_ast_cache
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: EXTRACT_SYMBOLS
  name: Extract classes, methods, functions
  action: "Walk AST and extract:\n  - Classes/interfaces/enums with line ranges\n\
    \  - Methods/functions with parameter signatures\n  - Properties/fields with types\n\
    \  - Import/using statements\n"
  outputs:
  - symbol_table.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: COMPUTE_METRICS
  name: Calculate complexity metrics
  condition: '{{include_metrics}} == true'
  action: "For each symbol:\n  - LOC (lines of code, excluding comments/blanks)\n\
    \  - Cyclomatic complexity (branches + 1)\n  - Cognitive complexity (nesting depth\
    \ weighted)\n  - Parameter count per method\n"
  outputs:
  - complexity_metrics.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- step_id: BUILD_DEPENDENCY_GRAPH
  name: Construct dependency relationships
  condition: '{{extract_dependencies}} == true'
  action: "From imports/usings:\n  - Internal dependencies (within project)\n  - External\
    \ dependencies (packages/libraries)\n  - Circular dependency detection\n"
  outputs:
  - dependency_graph.json
  source_category: analysis
  source_primitive: primitives/analysis/lens-ast-scan
- id: ac_start
  name: Emit AC_START marker
  action: emit_marker
  marker: 'AC_START: AC-{{domain}}-{{session_id}}'
  persist_to: '{{persistence}}'
  table: audit_sessions
  columns:
    session_id: '{{session_id}}'
    domain: '{{domain}}'
    parent_session_id: '{{parent_session_id}}'
    started_at: '{{now_iso}}'
    status: running
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
- id: ac_complete_success
  name: Emit AC_COMPLETE marker (success)
  action: emit_marker
  condition: workflow_succeeded
  marker: "AC_COMPLETE: AC-{{domain}}-{{session_id}} \u2705 ({{duration_ms}}ms)"
  persist_to: '{{persistence}}'
  table: audit_sessions
  update:
    session_id: '{{session_id}}'
    completed_at: '{{now_iso}}'
    duration_ms: '{{duration_ms}}'
    status: complete
    exit_status: clean
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
- id: ac_complete_failure
  name: Emit AC_COMPLETE marker (failure)
  action: emit_marker
  condition: workflow_failed
  marker: "AC_COMPLETE: AC-{{domain}}-{{session_id}} \u274C ({{duration_ms}}ms) \u2014\
    \ {{error_class}}"
  persist_to: '{{persistence}}'
  table: audit_sessions
  update:
    session_id: '{{session_id}}'
    completed_at: '{{now_iso}}'
    duration_ms: '{{duration_ms}}'
    status: failed
    exit_status: '{{error_class}}'
    error_message: '{{error_message}}'
  source_category: execution
  source_primitive: primitives/execution/ac-marker-emit
convergence_gate:
