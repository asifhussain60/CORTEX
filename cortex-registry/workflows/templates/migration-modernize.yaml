# Legacy Modernization Workflow Template
# Phase 100 Stage 5
# Incremental migration from legacy to modern patterns

workflow:
  id: "migration/modernize"
  name: "Legacy Modernization Workflow"
  version: "1.0.0"
  category: "migration"
  description: "Incremental migration with rollback safety and validation"

  metadata:
    author: "CORTEX"
    created: "2026-02-16"
    phase: "100"
    stage: "5"

  convergence_gate:
    max_cycles: 12
    success_criteria:
      legacy_tests_still_pass: true
      new_tests_added: true
      migration_chunk_complete: true
    convergence_predicate: "legacy_pass and new_tests > 0 and chunk_migrated"
    backoff_strategy: "exponential"

  knowledge_context:
    architect_mode:
      source_patterns: "Legacy CORTEX patterns"
      target_patterns: "Current CORTEX architecture"
      rollback: "Git checkpoint (CORE-026)"
      verification: "152+ test suite"
    production_mode:
      source_patterns: "{{legacy_patterns}}"  # From onboarded profile
      target_patterns: "{{target_patterns}}"  # From company/domains/
      rollback: "{{rollback_strategy}}"
      verification: "{{test_suite}}"

  steps:
    - step_id: "migration_planning"
      name: "Plan Migration Chunks"
      orchestrator: "PlanningOrchestrator"
      convergence_gate:
        max_cycles: 2
        success_criteria:
          chunks_identified: true
        convergence_predicate: "chunk_count > 0"
      params:
        source_patterns: "{{source_patterns}}"
        target_patterns: "{{target_patterns}}"

    - step_id: "checkpoint_creation"
      name: "Create Git Checkpoint"
      orchestrator: "TDDOrchestrator"
      depends_on: ["migration_planning"]
      convergence_gate:
        max_cycles: 1
        success_criteria:
          checkpoint_created: true
        convergence_predicate: "git_commit_exists"
      params:
        checkpoint_message: "Pre-migration checkpoint"

    - step_id: "legacy_tests_baseline"
      name: "Verify Legacy Tests Pass"
      orchestrator: "TDDOrchestrator"
      depends_on: ["checkpoint_creation"]
      convergence_gate:
        max_cycles: 3
        success_criteria:
          all_legacy_tests_pass: true
        convergence_predicate: "legacy_test_failures == 0"
      params:
        test_type: "legacy_baseline"
        verification: "{{verification}}"

    - step_id: "incremental_migration"
      name: "Migrate One Chunk"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["legacy_tests_baseline"]
      convergence_gate:
        max_cycles: 10
        success_criteria:
          chunk_migrated: true
          legacy_tests_pass: true
          new_tests_pass: true
        convergence_predicate: "migrated and legacy_pass and new_pass"
      params:
        source_patterns: "{{source_patterns}}"
        target_patterns: "{{target_patterns}}"

    - step_id: "dual_verification"
      name: "Verify Both Old and New Code"
      orchestrator: "TDDOrchestrator"
      depends_on: ["incremental_migration"]
      convergence_gate:
        max_cycles: 5
        success_criteria:
          legacy_tests_pass: true
          new_tests_pass: true
        convergence_predicate: "legacy_pass and new_pass"
      params:
        test_type: "dual_verification"

  epilogues:
    - epilogue_id: "migration_report"
      name: "Migration Progress Report"
      trigger: "workflow_complete"
      description: "Track migration progress and rollback points"
