# RCA Fishbone / Ishikawa Workflow Template
# CORTEX Intelligence — Phase 87: RCA Memory Engine
# Authority: CORE-008, CORE-064
# Usage: Categorised root cause analysis using Ishikawa (fishbone) diagram methodology

id: "rca-fishbone-workflow"
version: "1.0"
created: "2026-02-27"
category: intelligence
description: |
  Fishbone (Ishikawa) causal analysis — categorises contributing factors across
  6 standard categories and identifies root causes that may span multiple categories.
  
  Best used for complex failures where the root cause is unclear or may have
  multiple contributing dimensions. Complements Five Whys for multi-factor issues.

  Entry: Triggered manually via cortex_learning(op="rca", template="fishbone"),
         or recommended by DebuggerOrchestrator when Five Whys yields ambiguous results.
  Exit: RCA stored in .cortex-runtime/rca/rca_store.db with per-category prevention rules.

  Integration:
    - RCAEngine.analyze_fishbone() — performs the categorised analysis
    - RCAStore.store_rca() — persists the result
    - OPJMixin._opj_record_rca() — records via orchestrator protocol
    - ReinforcementEngine.emit_signal() — URS feedback

categories:
  - id: "people"
    description: "Developer skill, training, communication, workload"
    examples:
      - "Unfamiliar with OPJ protocol"
      - "No code review on critical path"
      - "Context switching between orchestrators"
  - id: "process"
    description: "Workflow, governance, procedures, approval gates"
    examples:
      - "No pre-commit enforcement for this rule"
      - "TDD skipped due to time pressure"
      - "Missing audit stage for this category"
  - id: "technology"
    description: "Tools, languages, frameworks, infrastructure"
    examples:
      - "SQLite concurrent write limitation"
      - "YAML parser does not validate references"
      - "pytest-xdist load distribution uneven"
  - id: "environment"
    description: "Development environment, CI/CD, deployment target"
    examples:
      - "macOS vs Linux path differences"
      - "CI runner has different Python version"
      - "Missing environment variable in docker"
  - id: "materials"
    description: "Input data, configuration, dependencies, test fixtures"
    examples:
      - "Stale test fixture not regenerated"
      - "Requirements drift between dev and CI"
      - "Governance YAML has circular reference"
  - id: "methods"
    description: "Design patterns, architectural decisions, coding standards"
    examples:
      - "Single responsibility violation in orchestrator"
      - "Hardcoded path instead of canonical resolution"
      - "Missing type hints on internal API"

stages:

  - id: "S1_SYMPTOM_CAPTURE"
    title: "Record Effect / Problem Statement"
    description: |
      The "head" of the fishbone — the observable effect or problem.
      Must be a clear, specific statement (not vague like "tests fail").
    inputs:
      - name: symptom
        type: str
        required: true
        description: "Clear problem statement — the head of the fishbone"
      - name: orchestrator
        type: str
        required: true
      - name: operation
        type: str
        required: true
      - name: context
        type: dict
        required: false
    outputs:
      - name: symptom_record
        type: dict
    validation: "symptom must be specific and actionable"

  - id: "S2_CATEGORY_ANALYSIS"
    title: "Analyze Each Ishikawa Category"
    description: |
      For each of the 6 categories, identify contributing causes.
      Not every category will have causes — that's expected.
      Minimum: at least 1 category must have at least 1 cause.
    inputs:
      - name: symptom_record
        type: dict
        required: true
    outputs:
      - name: categories
        type: dict
        description: "Dict[str, List[str]] — category_id → list of causes"
    validation: "At least 1 category with at least 1 cause"
    handler: "RCAEngine.analyze_fishbone() — validates and structures"
    guidance: |
      Walk through each category systematically:
      1. People: Who was involved? What did they know / not know?
      2. Process: What workflow step failed or was missing?
      3. Technology: What tool limitation or bug contributed?
      4. Environment: What environment difference mattered?
      5. Materials: What input data or config was wrong/missing?
      6. Methods: What design decision led to this outcome?

  - id: "S3_CROSS_CATEGORY_CORRELATION"
    title: "Find Root Causes Spanning Categories"
    description: |
      Look for causes that appear (in different forms) across multiple categories.
      These cross-cutting causes are usually the TRUE root causes.
      
      Example: "No validation gate" might appear as:
        - Process: "Missing pre-commit check"
        - Technology: "No automated linter rule"
        - Methods: "No design-time constraint"
      → Root cause: "Validation was not built into the development lifecycle"
    inputs:
      - name: categories
        type: dict
        required: true
    outputs:
      - name: cross_cutting_causes
        type: list
        description: "Causes that appear across ≥2 categories"
      - name: root_cause_candidates
        type: list
        description: "Candidate root causes ranked by cross-category evidence"
    validation: "Review all cross-cutting causes for true root cause candidates"

  - id: "S4_ROOT_CAUSE_RANKING"
    title: "Rank Root Causes by Impact + Evidence"
    description: |
      Rank candidate root causes by:
        1. Number of categories they span (more = more fundamental)
        2. Severity of the symptom they cause
        3. Actionability (can we actually prevent this?)
      
      Select the top-ranked root cause for prevention rule generation.
    inputs:
      - name: root_cause_candidates
        type: list
        required: true
    outputs:
      - name: root_cause
        type: str
        description: "Top-ranked root cause"
      - name: contributing_factors
        type: list
        description: "All other causes from the fishbone (context for prevention)"
    validation: "root_cause must be actionable and specific"

  - id: "S5_PREVENTION_RULE_GENERATION"
    title: "Create Per-Category Prevention Rules"
    description: |
      For Fishbone analyses, generate prevention rules that address the root cause
      AND the top contributing factors from each affected category.
      This may produce multiple prevention rules (one per major category).
    inputs:
      - name: root_cause
        type: str
        required: true
      - name: categories
        type: dict
        required: true
      - name: contributing_factors
        type: list
        required: true
    outputs:
      - name: prevention_rules
        type: list
        description: "List[PreventionRule] — one per affected category"
      - name: recurrence_signature
        type: str
        description: "Signature for the root cause class"
    handlers:
      - "RCAEngine.generate_prevention_rule()"
      - "RCAEngine.compute_recurrence_signature()"

  - id: "S6_STORE_AND_ACTIVATE"
    title: "Persist + Activate"
    description: |
      Store the Fishbone analysis and activate all prevention rules.
      Same persistence pattern as Five Whys (RCAStore + OPJ + URS).
    inputs:
      - name: rca_analysis
        type: RCAAnalysis
        required: true
      - name: prevention_rules
        type: list
        required: true
    outputs:
      - name: rca_id
        type: str
      - name: rule_ids
        type: list
    handlers:
      - "RCAStore.store_rca(analysis)"
      - "RCAStore.store_prevention_rule(rule) — for each rule"
      - "OPJMixin._opj_record_rca()"
      - "ReinforcementEngine.emit_signal()"
    validation: "All rule_ids must be valid UUIDs"

error_handling:
  on_failure: "Log error, do NOT crash caller"
  resilience: "try/except wrapping — OPJMixin pattern"
  fallback: "Degrade to free-text OPJ entry if RCAStore unavailable"
