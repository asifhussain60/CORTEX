# RCA Prevention Gate Workflow Template
# CORTEX Intelligence — Phase 87: RCA Memory Engine
# Authority: CORE-008, CORE-064
# Usage: Gate integration — checks incoming operations against known RCA patterns

id: "rca-prevention-gate-workflow"
version: "1.0"
created: "2026-02-27"
category: intelligence
description: |
  Prevention Gate integration workflow — defines how the gate checks incoming
  operations against stored RCA patterns and prevents recurrence of known failures.
  
  The gate operates at 4 levels:
    PASS  (0 prior occurrences) — no match, proceed normally
    INFO  (1 prior occurrence) — soft advisory, logged but not displayed
    WARN  (2 prior occurrences) — displayed warning with RCA summary
    BLOCK (3+ prior occurrences) — hard block with full RCA chain + remediation
  
  Advisory by default: only P0 recurrences (3+) actually BLOCK execution.
  All other levels are informational — CORTEX NEVER blocks unnecessarily.

  Entry: Called by OPJMixin._opj_check_prevention() at orchestrator entry point.
  Exit: Returns PreventionWarning (level, rca_chain, remediation) or None.

  Pipeline position:
    MasterOrchestrator → IntentRouter → [PREVENTION GATE] → target orchestrator
    The gate sits BETWEEN routing and execution — like a pre-execution check.

integration_points:
  entry_caller: "OPJMixin._opj_check_prevention(operation, context)"
  data_source: "RCAStore.get_active_prevention_rules() + query_by_signature()"
  signal_emitter: "ReinforcementEngine.emit_signal()"
  logging: ".cortex-runtime/rca/prevention_gate.log"
  activity_db: ".cortex-runtime/traces/orchestrator-traces.db"

stages:

  - id: "S1_OPERATION_CONTEXT"
    title: "Capture Incoming Operation + Context"
    description: |
      Extract operation metadata from the current orchestrator invocation.
      This is called automatically by _opj_check_prevention() — no manual input.
    inputs:
      - name: operation
        type: str
        required: true
        description: "The operation being performed (e.g., 'implement', 'debug', 'refactor')"
      - name: context
        type: dict
        required: true
        description: |
          Operation context including:
            - orchestrator_name: str
            - file_paths: List[str] (if applicable)
            - intent: str (from IntentRouter)
            - previous_failures: List[str] (from OPJReader)
    outputs:
      - name: operation_context
        type: dict
        description: "Normalized operation context for signature matching"
    validation: "operation must be non-empty"
    performance: "< 5ms — in-memory normalization only"

  - id: "S2_SIGNATURE_MATCH"
    title: "Query RCA Store for Matching Signatures"
    description: |
      Compute a candidate recurrence signature from the current operation context
      and query the RCA store for matching active prevention rules.
      
      Matching uses RCAEngine.compute_recurrence_signature() on the current context
      and compares against stored signatures in the prevention_rules table.
    inputs:
      - name: operation_context
        type: dict
        required: true
    outputs:
      - name: matching_rules
        type: list
        description: "List[PreventionRule] — rules whose signature matches"
      - name: matching_rcas
        type: list
        description: "List[RCAAnalysis] — historical RCAs for matching signatures"
    handler: "RCAStore.get_active_prevention_rules() + RCAStore.query_by_signature()"
    performance: "< 50ms — SQLite indexed query"
    on_empty: "Return None from gate (no match = PASS)"

  - id: "S3_RECURRENCE_CHECK"
    title: "Count Occurrences of Matching Signature"
    description: |
      For each matching signature, count how many times it has recurred.
      Uses the recurrence_incidents table in RCA store.
      
      Recurrence count determines gate level:
        0 matches → PASS (no gate action)
        1 match   → INFO (logged, not displayed)
        2 matches → WARN (displayed warning)
        3+ matches → BLOCK (execution paused, RCA chain shown)
    inputs:
      - name: matching_rules
        type: list
        required: true
      - name: matching_rcas
        type: list
        required: true
    outputs:
      - name: recurrence_count
        type: int
        description: "Number of times this signature has recurred"
      - name: gate_level
        type: str
        description: "PASS | INFO | WARN | BLOCK"
    handler: "RCAStore.get_recurrence_report()"

  - id: "S4_GATE_DECISION"
    title: "Apply Gate Decision"
    description: |
      Based on gate_level, take appropriate action:
      
      PASS:  Return None — proceed normally (no overhead)
      INFO:  Log to prevention_gate.log — proceed normally
      WARN:  Return PreventionWarning with level=WARN
             Display: "⚠️ This operation matches a known root cause pattern"
             Include: RCA summary, prevention rule, occurrence count
             Action: CONTINUE (advisory only)
      BLOCK: Return PreventionWarning with level=BLOCK
             Display: "🛑 PREVENTION GATE — This root cause has recurred 3+ times"
             Include: Full RCA chain (all Five Whys / Fishbone), remediation steps
             Action: PAUSE execution, require acknowledgement or different approach
    inputs:
      - name: gate_level
        type: str
        required: true
      - name: matching_rcas
        type: list
        required: true
      - name: recurrence_count
        type: int
        required: true
    outputs:
      - name: prevention_warning
        type: PreventionWarning
        description: "None for PASS/INFO, PreventionWarning for WARN/BLOCK"
    validation: "gate_level must be one of PASS, INFO, WARN, BLOCK"

  - id: "S5_DISPLAY_RCA"
    title: "Show Relevant RCA Chain to Developer"
    description: |
      For WARN and BLOCK levels, display the historical RCA chain:
      
      WARN format:
        ⚠️ Similar root cause detected (2 prior occurrences)
        Root Cause: {root_cause}
        Prevention Rule: {prevention_rule.description}
        Last Seen: {last_seen}
      
      BLOCK format:
        🛑 PREVENTION GATE — Root cause has recurred {count} times
        ━━━ RCA Chain ━━━
        Symptom: {symptom}
        Why 1: {why_1}
        Why 2: {why_2}
        ...
        Root Cause: {root_cause}
        ━━━ Prevention ━━━
        Rule: {prevention_rule.description}
        Remediation: {remediation_steps}
        ━━━ History ━━━
        Occurrences: {count} (first: {first_seen}, last: {last_seen})
    inputs:
      - name: prevention_warning
        type: PreventionWarning
        required: true
    outputs:
      - name: display_rendered
        type: bool
        description: "True if display was shown to developer"
    validation: "Display follows CORE-002 (inline only, no .md file)"

  - id: "S6_RECORD_OUTCOME"
    title: "Log Gate Decision + Emit URS Signal"
    description: |
      Record the gate decision in the activity log and emit appropriate URS signal:
      
      BLOCK → Record as recurrence incident + emit STRONG_PUNISHMENT (-1.0)
              This teaches the learning system that the pattern is still dangerous
      WARN  → Record as near-miss + emit MILD_PUNISHMENT (-0.25)
      INFO  → Record in log only + no URS signal
      PASS  → No action (no overhead for non-matching operations)
      
      If a BLOCK is acknowledged and the developer takes a DIFFERENT approach
      that succeeds, emit STRONG_REWARD (+1.0) — the prevention gate worked!
    inputs:
      - name: gate_level
        type: str
        required: true
      - name: prevention_warning
        type: PreventionWarning
        required: false
      - name: recurrence_count
        type: int
        required: true
    outputs:
      - name: urs_signal_emitted
        type: bool
      - name: incident_recorded
        type: bool
    handlers:
      - "RCAStore.record_recurrence() — for BLOCK/WARN"
      - "ReinforcementEngine.emit_signal() — for BLOCK/WARN"
      - "ActivityLogger.log() — for all levels except PASS"

error_handling:
  on_failure: "Return None (PASS) — gate NEVER blocks due to internal error"
  resilience: |
    The prevention gate follows the OPJMixin resilience contract:
      - All operations wrapped in try/except
      - Internal errors logged but never crash the caller
      - If RCA store is unavailable, gate degrades to PASS
      - Performance budget: < 100ms total (including SQLite query)
  fallback: "Gate failure = PASS — prefer false negatives over false positives"

performance_budget:
  total: "< 100ms"
  s1_context: "< 5ms"
  s2_signature_match: "< 50ms"
  s3_recurrence_check: "< 20ms"
  s4_gate_decision: "< 1ms"
  s5_display: "< 20ms"
  s6_record: "< 10ms"
  note: "Gate adds negligible overhead to orchestrator pipeline"
