# ═══════════════════════════════════════════════════════════════════════════════
# Intelligence Matrix Wiring Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
# Authority: phase-71-holistic-unified-brain.yaml (GAP-71-G3)
# Used by:   /audit fix Stage 1.5 (coverage gate) + standalone MCP invocation
# CORE:      CORE-002 (inline output only), CORE-064 (sweep completeness)
# Version:   1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

id: intelligence-matrix-wiring-pipeline
name: "Intelligence Matrix Wiring Pipeline"
version: "1.0.0"
category: intelligence
created_at: "2026-02-25"
authority: "phase-71-holistic-unified-brain.yaml"

description: |
  Governs the full intelligence matrix wiring lifecycle:
    scan → score → P0 gate → P1 rank → wire → cover-gate → extend → persist

  Invoked automatically by AuditFixPipeline Stage 1.5 (Check #20).
  Can also be run standalone via MCP cortex_intelligence_matrix tool.

  On coverage failure, triggers detect-fix-rescan-loop until coverage_score ≥ 0.50.

# ─────────────────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────────────────

inputs:
  coverage_gate:
    type: float
    default: 0.50
    description: "Minimum acceptable matrix coverage fraction (50% default, 80% target)"
  target_dimensions:
    type: object
    default:
      x: 20
      y: 20
    description: "Target matrix dimensions after extension (20×20 for Phase 71)"
  auto_wire:
    type: boolean
    default: false
    description: "If true, attempt autonomous wiring of P0 cells via bridge functions"
  persist_result:
    type: boolean
    default: true
    description: "Persist matrix JSON to .cortex-runtime/intelligence/intelligence-matrix.json"

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE STAGES
# ─────────────────────────────────────────────────────────────────────────────

stages:

  stage_0:
    name: "Matrix Scan — Live Capability Enumeration"
    description: "Run IntelligenceMatrixBuilder.build() to enumerate all capabilities and score intersections"
    action: "cortex.intelligence.cross_cutting.intelligence_matrix_builder.IntelligenceMatrixBuilder.build"
    inputs: []
    outputs:
      - name: "matrix"
        type: "IntelligenceMatrix"
        description: "Full matrix with all cells scored (wired and unwired)"
    ac_marker: "AC_START: AC-MATRIX-SCAN-{timestamp}"
    on_failure: "HALT — cannot proceed without base matrix"

  stage_1:
    name: "P0 Critical Gap Detection"
    description: "Identify all CRITICAL severity cells that are not yet wired"
    action: "matrix.critical_cells()"
    inputs:
      - "matrix (from stage_0)"
    outputs:
      - name: "critical_gaps"
        type: "List[MatrixCell]"
        description: "P0 cells requiring immediate wiring"
    gate:
      condition: "len(critical_gaps) == 0"
      on_fail: "EMIT_VIOLATIONS — log each unwired P0 cell as P0 audit violation"
      severity: "P0"
      violation_template: |
        Intelligence Matrix P0 violation: {cell.intelligence_id} × {cell.cortex_id}
        ({cell.dimension_pair[0]} × {cell.dimension_pair[1]}) — not wired.
        Required action: {cell.wire_action}
    report_format: |
      ### 🔴 P0-CRITICAL Unwired ({count} cells)
      {for each cell}
      - [{intelligence_id}×{cortex_id}] {rationale}
        → {wire_action}

  stage_2:
    name: "P1 High-Priority Gap Ranking"
    description: "List P1-HIGH unwired cells ranked by cross-cutting impact"
    action: "matrix.high_cells()"
    inputs:
      - "matrix (from stage_0)"
    outputs:
      - name: "high_gaps"
        type: "List[MatrixCell]"
        description: "P1 cells ordered by impact (LENS > Brain > Knowledge > Response)"
    gate:
      condition: "len(high_gaps) <= 5"
      on_fail: "EMIT_WARNINGS — log each as P1 audit warning (not blocking)"
      severity: "P1"
    report_format: |
      ### 🟡 P1-HIGH Unwired ({count} cells)
      {for each cell — top 10}
      - [{intelligence_id}×{cortex_id}] {rationale}
        → {wire_action}

  stage_3:
    name: "Autonomous Bridge Wiring (when auto_wire=true)"
    description: |
      For each unwired P0 cell, attempt to call the pre-implemented bridge function
      from cortex.intelligence.intelligence_wiring_bridges. Marks cell as wired on success.
    action: "cortex.intelligence.intelligence_wiring_bridges.wire_cell(cell)"
    condition: "inputs.auto_wire == true AND len(critical_gaps) > 0"
    inputs:
      - "critical_gaps (from stage_1)"
    outputs:
      - name: "wiring_results"
        type: "List[WiringResult]"
        description: "Success/failure per cell wiring attempt"
    on_bridge_failure: |
      Log failure as P0 violation.
      OPJWriter.record_failure(orchestrator=intelligence_matrix, operation=wire_cell, ...)
      Continue to next cell (do not halt).
    on_bridge_success: |
      OPJWriter.record_success(orchestrator=intelligence_matrix, operation=wire_cell, ...)
      Increment wired_count.
    gate:
      condition: "all(r.success for r in wiring_results)"
      on_fail: "EMIT_VIOLATIONS for each failed wiring"
      severity: "P0"

  stage_4:
    name: "Coverage Gate Validation"
    description: |
      Assert matrix.coverage_score >= coverage_gate.
      If below, trigger detect-fix-rescan-loop primitive.
    action: "IntelligenceMatrixBuilder.check_coverage_gate(matrix, gate=inputs.coverage_gate)"
    inputs:
      - "matrix (from stage_0, updated by stage_3)"
    gate:
      condition: "matrix.coverage_score >= inputs.coverage_gate"
      on_fail: |
        TRIGGER detect-fix-rescan-loop:
          Loop: [wire P0 cells] → [rebuild matrix] → [check coverage] → repeat
          Max iterations: 5
          Success condition: coverage_score >= coverage_gate
          Failure: HALT with MatrixCoverageError
      severity: "P0 — blocking deployment readiness"
    report_format: |
      ### 📊 Coverage Gate
      Current: {coverage_score:.1%} | Required: {coverage_gate:.0%}
      Status: {PASS ✅ / FAIL ❌}
      Wired: {wired_count}/{total_cells} cells

  stage_5:
    name: "Dimension Extension Check"
    description: "Verify matrix has been extended to target 20×20 dimensions"
    action: |
      assert len(INTELLIGENCE_CAPABILITIES) == inputs.target_dimensions.x
      assert len(CORTEX_CAPABILITIES) == inputs.target_dimensions.y
    inputs:
      - "matrix (from stage_0)"
    gate:
      condition: |
        matrix.total_capabilities_x == inputs.target_dimensions.x AND
        matrix.total_capabilities_y == inputs.target_dimensions.y
      on_fail: "EMIT_WARNING (not blocking) — matrix not yet extended to 20×20"
      severity: "P1"
    report_format: |
      ### 📐 Matrix Dimensions
      Current: {total_x}×{total_y} | Target: {target_x}×{target_y}
      Status: {COMPLETE ✅ / EXTENSION NEEDED ⚠️}

  stage_6:
    name: "Golden Test Validation"
    description: "Run intelligence matrix golden tests to confirm functional wiring"
    action: "python3 scripts/run_tests.py golden"
    gate:
      condition: "exit_code == 0 AND 'intelligence/test_intelligence_matrix_golden' in output"
      on_fail: "HALT — golden test failures indicate non-functional wiring (not just structural)"
      severity: "P0"
    report_format: |
      ### 🧪 Golden Test Results
      {test_summary}
      Status: {PASS ✅ / FAIL ❌}

  stage_7:
    name: "Matrix Persist + AC Complete"
    description: "Persist final matrix to runtime storage and emit AC markers"
    action: "IntelligenceMatrixBuilder.persist_matrix(matrix)"
    condition: "inputs.persist_result == true"
    inputs:
      - "matrix (from stage_0, updated by all stages)"
    outputs:
      - name: "output_path"
        type: "Path"
        value: ".cortex-runtime/intelligence/intelligence-matrix.json"
    ac_marker: |
      AC_COMPLETE: AC-MATRIX-SCAN-{timestamp} ✅
      Coverage: {coverage_score:.1%} | Cells: {wired}/{total} wired
      P0: {p0_unwired} unwired | P1: {p1_unwired} unwired

# ─────────────────────────────────────────────────────────────────────────────
# CONVERGENCE LOOP INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────

convergence_loop:
  primitive: "cortex-registry/workflows/templates/primitives/validation/detect-fix-rescan-loop.yaml"
  trigger_condition: "stage_4.gate == FAIL (coverage < gate)"
  detect_phase: "matrix.critical_cells() — identify specific unwired P0 cells"
  fix_phase: "wire_cell(cell) for each P0 cell via bridge functions"
  rescan_phase: "IntelligenceMatrixBuilder.build() — rebuild matrix from scratch"
  success_condition: "matrix.coverage_score >= coverage_gate AND len(matrix.critical_cells()) == 0"
  max_iterations: 5
  on_max_exceeded: "HALT with MatrixCoverageError + inline violation table"

# ─────────────────────────────────────────────────────────────────────────────
# AUDIT FIX PIPELINE INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────

audit_fix_integration:
  stage: "Stage 1.5 — between Stage 1 (Stage-0 Governance) and Stage 2 (19-Point Scan)"
  check_number: 20
  check_name: "Intelligence Matrix Coverage Gate"
  pipeline_file: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
  inputs_from_audit:
    coverage_gate: 0.50
    auto_wire: false   # report-only in audit context; autonomous fix in convergence loop
    persist_result: true
  violation_format: |
    | Check | Severity | Status | Detail |
    |-------|----------|--------|--------|
    | #20 Intelligence Matrix | {severity} | {status} | Coverage: {pct}% ({wired}/{total} wired). P0 unwired: {p0_count}. |

# ─────────────────────────────────────────────────────────────────────────────
# MCP TOOL INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────

mcp_integration:
  tool: "cortex_intelligence_matrix"
  operation: "wire"
  description: "Run full intelligence matrix wiring pipeline via MCP"
  example_invocation: |
    cortex_intelligence_matrix(operation="wire", auto_wire=True, coverage_gate=0.80)

# ─────────────────────────────────────────────────────────────────────────────
# METADATA
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  phase: "Phase 71 — Holistic Unified Brain"
  status: "ACTIVE"
  coverage: "Intelligence matrix full wiring lifecycle (Phase 71 GAP-71-G3)"
  related_files:
    - "cortex/intelligence/cross_cutting/intelligence_matrix_builder.py"
    - "cortex/intelligence/intelligence_wiring_bridges.py"
    - "tests/golden/intelligence/test_intelligence_matrix_golden.py"
    - "tests/golden/intelligence/test_unified_brain_opj_golden.py"
    - "cortex-registry/planning/phases/planned/phase-71-holistic-unified-brain.yaml"
