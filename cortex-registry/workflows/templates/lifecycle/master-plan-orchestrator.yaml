# =============================================================================
# CORTEX Master Plan Orchestrator — Phase Creation Workflow Template
# =============================================================================
# Authority: Phase 50 — CortexMasterPlanOrchestrator
# Version: 1.0.0
# Updated: 2026-02-19
# CORE Rules: CORE-008, CORE-028, CORE-035
#
# Purpose: Standardized workflow for creating a new CORTEX phase entry.
#          Used by CortexMasterPlanOrchestrator.create_phase() as the
#          execution specification. Delegates to the orchestrator — never
#          duplicates logic here.
#
# Usage: CortexMasterPlanOrchestrator.load_workflow_template("master-plan-orchestrator")
# =============================================================================

workflow:
  name: master_plan_orchestrator
  version: "2.0.0"
  description: >
    Standardized end-to-end workflow for creating a new CORTEX phase entry.
    Ensures: registry is SSOT (cortex-refactor-master.yaml), sequence is correct,
    folders are synced, and the phase YAML file contains only execution spec
    (no status authority — all status lives in cortex-refactor-master.yaml).
    Auto-injects: validation_loop as final stage into every new phase execution.

  entry_point: CortexMasterPlanOrchestrator
  orchestrator: CortexMasterPlanOrchestrator
  mcp_tool: cortex_master_plan
  status_authority: "cortex-registry/planning/cortex-refactor-master.yaml"

  # Auto-injection: every phase created gets validation_loop appended as last
  # stage in master-plan-execution.yaml. This ensures deduplication, debloat,
  # regression, brittleness, and governance checks are mandatory on every phase.
  auto_inject:
    validation_loop: true
    lens_discovery: true
    injection_source: "cortex-registry/workflows/templates/lifecycle/master-plan-execution.yaml"

  # ---------------------------------------------------------------------------
  # Input Schema
  # ---------------------------------------------------------------------------
  input:
    required:
      - title: "Human-readable phase title (non-empty string)"
      - description: "Detailed scope description"
      - priority: "P0 | P1 | P2 | P3"
    optional:
      - supersedes: "List of prior phase IDs this phase replaces"
      - governance_rules: "List of CORE rule strings"

  # ---------------------------------------------------------------------------
  # Stages
  # ---------------------------------------------------------------------------
  stages:
    - name: sequence_check
      order: 1
      description: >
        Read cortex-master.yaml and compute the next sequential phase number.
        MUST ignore anomalous out-of-sequence IDs (e.g. phase-100 when only
        49 phases exist). Uses the gapless sequential max, not the absolute max.
      actor: CortexMasterPlanOrchestrator.next_sequence_number
      validation:
        - "sequence > 0"
        - "sequence == max_sequential_phase + 1"
        - "no anomalous phase IDs influence the result"
      output: sequence_number

    - name: sync_folders
      order: 2
      description: >
        Scan planned/ folder and move any files whose status in cortex-master.yaml
        is 'complete' to the completed/ folder. Flag anomalous phase filenames.
        This must run BEFORE sequence_check result is used, so completed phases
        are removed from planned/ before the new file is placed there.
      actor: CortexMasterPlanOrchestrator.sync_phase_folders
      validation:
        - "no complete-status files remain in planned/"
        - "moved_to_completed >= 0"
      output: sync_result

    - name: create_entry
      order: 3
      description: >
        Write the new phase entry to cortex-refactor-master.yaml FIRST (SSOT).
        Status lives ONLY here. The entry must include: id, title,
        status='pending', priority, description, spec_file, created.
        Increment metadata.counters.total_phases and metadata.counters.pending.
        The phase spec YAML must NOT contain authoritative status fields.
      actor: CortexMasterPlanOrchestrator._save_registry
      precondition: "sync_folders completed without error"
      validation:
        - "phase_id appears in cortex-refactor-master.yaml phases list"
        - "metadata.counters.total_phases incremented by 1"
        - "metadata.counters.pending incremented by 1"
        - "progress block initialized with null values"
      output: phase_id

    - name: create_file
      order: 4
      description: >
        Write the phase spec YAML to planned/cortex-refactor/{phase_id}-{slug}.yaml.
        File contains ONLY: metadata (phase_id, title, priority, description,
        status_authority='cortex-refactor-master.yaml'), stages (execution spec),
        tests spec, workflow_template reference.
        File must NOT contain any status fields — status is in cortex-refactor-master.yaml.
      actor: CortexMasterPlanOrchestrator.create_phase (file write step)
      precondition: "create_entry completed — cortex-refactor-master.yaml updated"
      validation:
        - "file exists at planned/cortex-refactor/{phase_id}-{slug}.yaml"
        - "file.metadata.status_authority == 'cortex-refactor-master.yaml'"
        - "file contains NO status, started, completed, or progress fields"
        - "file name is CORE-028 compliant (kebab-case, no spaces)"
      output: file_path

  # ---------------------------------------------------------------------------
  # Post-Creation Checklist
  # ---------------------------------------------------------------------------
  completion_checklist:
    - "✅ cortex-refactor-master.yaml updated (phase entry added — SSOT)"
    - "✅ Phase spec YAML created in planned/cortex-refactor/"
    - "✅ Completed phases moved from planned/ to completed/cortex-refactor/"
    - "✅ Anomalous phase IDs flagged (if any)"
    - "✅ File name is kebab-case (CORE-028)"
    - "✅ status_authority = cortex-refactor-master.yaml in spec file"
    - "✅ Validation loop auto-injected into execution workflow"
    - "✅ LENS discovery auto-injected as Stage 0 into execution workflow"

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    core_rules:
      - "CORE-008: TDD mandatory — tests written before implementation"
      - "CORE-028: File naming snake_case/kebab-case"
      - "CORE-035: Single canonical implementation"
    status_ssot: "cortex-registry/planning/cortex-refactor-master.yaml"
    forbidden:
      - "Do NOT store authoritative status in phase spec YAML files"
      - "Do NOT use absolute max sequence (ignores anomalies)"
      - "Do NOT create phase file before registry entry in cortex-refactor-master.yaml"
      - "Do NOT write status fields into phase spec YAML files"
      - "Do NOT update cortex-master.yaml per-phase — only on full refactor completion"
