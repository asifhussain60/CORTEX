# ============================================================================
# MODE WORKFLOW: SYNC — Deterministic, Safe, Windows-First Cross-Folder Sync
# ============================================================================
# Authority : cortex-sync.prompt.md (Phase 127 redesign)
# Trigger   : "/sync target={path}", "sync to company folder"
# Engine    : cortex/tools/cortex_sync.py (prebuilt, parameterised CLI)
# Agent     : .github/agents/core/cortex-sync-agent.md
# Phase     : 127
#
# Pipeline  : Scan → Plan → Validate → Apply → Verify → Report
# Policy    : SSOT in cortex_sync.py::SYNC_POLICY (mirrored below)
# ============================================================================

id: "lifecycle/sync-workflow"
workflow:
  id: 'lifecycle/sync-workflow'
  name: 'SYNC — Deterministic Safe Cross-Folder Sync'
  category: 'lifecycle'
  status: 'active'
  spec_version: '2.0'

  metadata:
    author: 'CORTEX Architecture'
    created: '2026-03-04'
    modes_served: ['SYNC']
    trigger_keywords:
      - 'sync'
      - 'sync to company'
      - 'privacy-safe copy'
      - 'push to work repo'
    engine: 'cortex/tools/cortex_sync.py'
    response_template: 'SYNC Response Template (cortex-response-templates.md)'
    direction: 'one-way: CORTEX repo root → target folder (never reversed)'
    idempotent: true
    deterministic: true
    non_destructive: true

  # ── SSOT ALLOW/DENY POLICY MIRROR (authoritative copy in cortex_sync.py::SYNC_POLICY)
  policy_mirror:
    spec_version: '2.0'
    default_action: 'allow'
    deny:
      - '_workspaces/**'
      - 'cortex-registry/company/repos/**'
      - 'cortex-registry/company/dashboards/repos/**'
      - 'cortex-docs/**'
      - '.cortex-runtime/**'
      - '.git/**'
      - '**/__pycache__/**'
      - '**/*.pyc'
      - '**/*.pyo'
      - '**/*.pyd'
      - '.env'
      - '.env.*'
      - '.vscode/settings.json'
      - '.vscode/extensions.json'
      - '**/*.db'
      - '**/*.log'
      - '**/.DS_Store'
      - '**/Thumbs.db'
      - '.cortex-sync/**'
    allow_override:
      - 'cortex-docs/.content/**'
    github_allowlist:
      - '.github/prompts/CORTEX.prompt.md'
      - '.github/prompts/cortex-architect.prompt.md'
      - '.github/agents/core/CORTEX.md'
      - '.github/agents/core/cortex-executor.md'
      - '.github/agents/core/cortex-auditor.md'
      - '.github/agents/core/cortex-interactive.md'
      - '.github/agents/core/cortex-debugger.md'
      - '.github/agents/core/cortex-vacuum.md'
      - '.github/copilot-instructions.md'

  steps:
    - id: ac_start
      template_ref: 'primitives/execution/ac-marker-emit'
      inputs: { domain: 'SYNC', session_id: '{{session_id}}' }
      step_filter: 'ac_start'

    - id: preflight
      name: 'Pre-flight: validate inputs and environment'
      depends_on: ['ac_start']
      action: 'validate'
      checks:
        - { id: repo_root_exists, command: 'python3 -c "import os; assert os.path.isdir(\"{{repo_root}}\")"', on_failure: abort }
        - { id: target_exists, command: 'python3 -c "import os; assert os.path.isdir(\"{{target_path}}\")"', on_failure: abort }
        - { id: no_circular_path, command: 'python3 -c "from pathlib import Path; t=Path(\"{{target_path}}\").resolve(); r=Path(\"{{repo_root}}\").resolve(); assert not str(t).startswith(str(r))"', on_failure: abort }
        - { id: engine_importable, command: 'python3 -c "from cortex.tools.cortex_sync import run_sync, SYNC_POLICY"', on_failure: abort }

    - id: stage_scan
      name: 'Stage 1 — Scan: enumerate eligible files'
      depends_on: ['preflight']
      action: 'invoke_engine'
      command: 'python3 -m cortex.tools.cortex_sync --repo-root "{{repo_root}}" --target "{{target_path}}" --dry-run --write-manifest --baseline-dir "{{baseline_dir}}"'
      outputs: [files_scanned, files_planned]

    - id: stage_plan
      name: 'Stage 2 — Plan: display decision log'
      depends_on: ['stage_scan']
      action: 'display'
      display:
        format: 'sync_plan_table'
        fields: ['relative_path', 'decision', 'reason']

    - id: stage_validate
      name: 'Stage 3 — Validate: security danger scan'
      depends_on: ['stage_plan']
      action: 'validate'
      checks:
        - { id: policy_version, command: 'python3 -c "from cortex.tools.cortex_sync import SYNC_POLICY; assert SYNC_POLICY[\"version\"]==\"2.0\""', on_failure: abort }

    - id: user_approval
      name: 'User approval gate'
      depends_on: ['stage_validate']
      action: 'user_approval'
      display:
        prompt: 'Type `proceed` to apply, or `cancel` to abort.'
      skip_if: '{{auto_approve}} == true'

    - id: stage_apply
      name: 'Stage 4 — Apply: write files to target'
      depends_on: ['user_approval']
      action: 'invoke_engine'
      command: 'python3 -m cortex.tools.cortex_sync --repo-root "{{repo_root}}" --target "{{target_path}}" --apply --write-manifest --baseline-dir "{{baseline_dir}}" --safe-merge'
      outputs: [files_copied, files_updated, files_merged, files_skipped, files_conflicted, files_danger, manifest_path]

    - id: stage_verify
      name: 'Stage 5 — Verify: re-checksum and manifest check'
      depends_on: ['stage_apply']
      action: 'validate'
      checks:
        - { id: manifest_written, command: 'python3 -c "import os; assert os.path.exists(\"{{target_path}}/.cortex-sync/manifest.json\")"', on_failure: warn }

    - id: stage_report
      name: 'Stage 6 — Report: render Sync Response Template'
      depends_on: ['stage_verify']
      action: 'render_template'
      template: 'SYNC Response Template'

    - id: ac_complete
      depends_on: ['stage_report']
      template_ref: 'primitives/execution/ac-marker-emit'
      inputs: { domain: 'SYNC', session_id: '{{session_id}}' }
      step_filter: 'ac_complete_success'
