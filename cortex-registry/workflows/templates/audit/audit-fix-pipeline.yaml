      - 'IC-010×CC-004  KnowledgeIndexer × DocGen — CRITICAL'
      - 'IC-009×CC-006  BlindSpotDetector × Enforcement — CRITICAL'
    note: 'Toolkit is the y-axis foundation for intelligence wiring (Phase 63→65)'

