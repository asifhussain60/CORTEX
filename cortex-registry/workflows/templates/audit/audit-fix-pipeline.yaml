# ============================================================================
# WORKFLOW: /audit fix — 9-Stage Production Readiness Pipeline
# ============================================================================
# Authority: CORE-064 (Sweep Completeness Contract)
# Version: 2.0.0
# Created: 2026-02-23
# Supersedes: inline pipeline definition in cortex-auditor.md (1.x)
#
# Key upgrade over 1.x:
#   Stages 7–8 (auto-fix + re-validate) are now driven by the
#   detect-fix-rescan-loop primitive — guaranteeing convergence to zero
#   violations rather than a single-pass attempt.
#   All stage activity is logged to SQLite with per-cycle granularity.
#   SQLite DB is cleaned up on pipeline exit to prevent bloat.
#
# CORE Rules enforced:
#   CORE-002: All output inline — no generated report files
#   CORE-008: TDD — any new code introduced by auto-fix gets a test
#   CORE-035: Single canonical implementation — no duplicate auditors
#   CORE-049: Silent on clean pass — no noise when production-ready
#   CORE-064: Full sweep — pipeline never exits with unresolved P0/P1
# ============================================================================

workflow:
  id: 'audit/audit-fix-pipeline'
  name: '/audit fix — 9-Stage Production Readiness Pipeline (28-Point Audit)'
  category: 'audit'
  status: 'active'

  metadata:
    author: 'CORTEX Architecture'
    created: '2026-02-23'
    updated: '2026-02-24'
    trigger_command: '/audit fix'
    modes_served: ['AUDIT', 'FIX']
    orchestrators_used:
      - AuditCoordinator
      - HealthOrchestrator
      - VacuumOrchestrator
      - EnforcementOrchestrator
      - MetaAuditor
      - IntelligenceOrchestrator    # Phase 65 — cross-cutting intelligence
    mcp_tools_used:
      - cortex_validate (op: compliance)
      - cortex_governance (op: query)
      - cortex_vacuum
      - cortex_load (op: rules)
      - cortex_metrics (op: capture)
      - cortex_intelligence_matrix (op: gaps)  # Phase 65 — ENH-MATRIX-001
      - cortex.lens (op: analyze)              # Phase 65 — LENS wiring

  # Phase 65 intelligence integration
  intelligence_wiring:
    description: |
      Cross-cutting intelligence layer wired across all audit stages.
      IntelligenceMatrixBuilder produces a HIGH VALUE matrix (x×y) that:
        - Surfaces P0-CRITICAL unwired pairs before Stage 2 scan
        - Feeds BlindSpotDetector gaps into Check #19
        - Drives TDDOrchestrator test stub generation for gaps
        - Injects SynthesisEngine results into DocGen playbook discovery
    mcp_tool: 'cortex_intelligence_matrix'
    python_module: 'cortex.intelligence.cross_cutting.intelligence_matrix_builder'
    trigger_stage: 'stage_1_5'
    persist_to: '.cortex-runtime/intelligence/intelligence-matrix.json'

  # ==========================================================================
  # PIPELINE-LEVEL CONVERGENCE GATE
  # Governs Stages 7–8 rescan loop. Exits when zero P0 and zero P1 remain
  # across the full 22-point audit (Checks #1–#22 inclusive).
  # ==========================================================================
  pipeline_convergence:
    primitive: 'primitives/validation/detect-fix-rescan-loop'
    label: 'audit-fix-convergence'
    max_cycles: 5
    backoff_strategy: 'linear'
    base_wait_ms: 1000
    fix_confidence_threshold: 0.90
    success_predicate: 'p0_count == 0 and p1_count == 0'
    sqlite_db_path: '.cortex-runtime/traces/orchestrator-traces.db'
    retention_days: 30
    silent_on_clean: true
    emit_ac_markers: true

  # ==========================================================================
  # SQLITE ACTIVITY LOGGING — pipeline-level schema additions
  # ==========================================================================
  sqlite_logging:
    database: '.cortex-runtime/traces/orchestrator-traces.db'

    tables:
      audit_sessions:
        description: 'One row per /audit fix invocation. Parent of all stage rows.'
        ddl: |
          CREATE TABLE IF NOT EXISTS audit_sessions (
              session_id      TEXT PRIMARY KEY,    -- UUID
              trigger         TEXT NOT NULL,       -- "/audit fix" | "/audit" | "scheduled"
              branch          TEXT,                -- git branch at time of run
              origin_sha      TEXT,                -- git HEAD SHA
              started_at      TEXT NOT NULL,
              completed_at    TEXT,
              exit_status     TEXT,                -- "clean" | "violations_remain" | "error"
              p0_count_final  INTEGER DEFAULT 0,
              p1_count_final  INTEGER DEFAULT 0,
              p2_count_final  INTEGER DEFAULT 0,
              total_fixed     INTEGER DEFAULT 0,
              stages_run      TEXT,                -- JSON array of stage IDs executed
              test_result     TEXT                 -- "pass" | "fail" | "skipped"
          );

      audit_stage_log:
        description: 'One row per stage execution within an audit session.'
        ddl: |
          CREATE TABLE IF NOT EXISTS audit_stage_log (
              id              INTEGER PRIMARY KEY AUTOINCREMENT,
              session_id      TEXT NOT NULL REFERENCES audit_sessions(session_id),
              stage_num       INTEGER NOT NULL,    -- 0 (preflight) through 9
              stage_label     TEXT NOT NULL,
              orchestrator    TEXT,
              started_at      TEXT NOT NULL,
              completed_at    TEXT,
              duration_ms     INTEGER,
              status          TEXT NOT NULL,       -- "pass" | "fail" | "skip" | "error"
              issues_found    INTEGER DEFAULT 0,
              issues_fixed    INTEGER DEFAULT 0,
              violations_json TEXT,                -- JSON array of P0/P1/P2 violations
              ac_marker       TEXT                 -- AC_STAGE_N_COMPLETE marker emitted
          );

      audit_violations:
        description: 'Individual violations found across all sessions — queryable for pattern detection.'
        ddl: |
          CREATE TABLE IF NOT EXISTS audit_violations (
              id              INTEGER PRIMARY KEY AUTOINCREMENT,
              session_id      TEXT NOT NULL REFERENCES audit_sessions(session_id),
              stage_num       INTEGER NOT NULL,
              check_num       INTEGER,             -- 1–28 from extended 28-point audit
              severity        TEXT NOT NULL,       -- "P0" | "P1" | "P2"
              rule_id         TEXT,                -- e.g. "CORE-035"
              file_path       TEXT,
              description     TEXT NOT NULL,
              auto_fixed      INTEGER DEFAULT 0,   -- 1=fixed autonomously, 0=manual
              fix_description TEXT,
              detected_at     TEXT NOT NULL
          );

      # Phase 106-D (GAP-106-04): Formal certification gate — composite proof on clean audit exit
      audit_certifications:
        description: |
          One row per clean audit certification. Ties together: audit result,
          test results, RCA state, guard test count, git SHA, readiness score.
          Written by Stage 9 post_run when: p0==0 AND p1==0 AND test_fail==0 AND
          readiness_score>=95.0. MCP-queryable via cortex_governance(op: certification_status).
        ddl: |
          CREATE TABLE IF NOT EXISTS audit_certifications (
              certification_id   TEXT PRIMARY KEY,    -- "CERT-{session_id[:8]}"
              session_id         TEXT NOT NULL REFERENCES audit_sessions(session_id),
              git_sha            TEXT NOT NULL,
              git_branch         TEXT NOT NULL,
              audit_checks_total INTEGER NOT NULL,    -- 29 after Check #29
              audit_p0_final     INTEGER NOT NULL,    -- must be 0
              audit_p1_final     INTEGER NOT NULL,    -- must be 0
              test_tier          TEXT NOT NULL,       -- "smoke" (T1_smoke)
              test_pass_count    INTEGER NOT NULL,
              test_fail_count    INTEGER NOT NULL,    -- must be 0
              golden_test_pass   INTEGER,             -- from tests/golden/ suite
              guard_tests_gen    INTEGER DEFAULT 0,   -- regression guards generated this run
              rca_analyses_run   INTEGER DEFAULT 0,   -- RCA dispatches this run
              prevention_rules   INTEGER DEFAULT 0,   -- active prevention rules total
              readiness_score    REAL,                -- 0-100.0, from GovernanceValidator (inline)
              certified_at       TEXT NOT NULL,       -- ISO-8601 UTC
              certified_by       TEXT DEFAULT 'CORTEX-AUDIT-FIX',
              notes              TEXT                 -- optional inline summary
          );
        certification_predicate: "p0==0 AND p1==0 AND test_fail==0 AND readiness_score>=95.0"
        mcp_query_op: "cortex_governance(op: certification_status)"

    cleanup_policy:
      description: |
        Runs after every pipeline exit (Stage 9 AC_COMPLETE boundary).
        Retains the most recent audit_sessions regardless of age (max 100 rows).
        Prunes audit_stage_log and audit_violations for sessions older than
        retention_days. Prunes workflow_cycles from the convergence loop.
        VACUUM runs last to compact the database file.
        Guard: CORTEX_DISABLE_DB_CLEANUP != "true"
      statements:
        - |
          DELETE FROM audit_violations
          WHERE session_id NOT IN (
            SELECT session_id FROM audit_sessions
            WHERE started_at >= datetime('now', '-30 days')
          );
        - |
          DELETE FROM audit_stage_log
          WHERE session_id NOT IN (
            SELECT session_id FROM audit_sessions
            WHERE started_at >= datetime('now', '-30 days')
          );
        - |
          DELETE FROM audit_sessions
          WHERE started_at < datetime('now', '-30 days')
          AND session_id NOT IN (
            SELECT session_id FROM audit_sessions
            ORDER BY started_at DESC LIMIT 20
          );
        - 'VACUUM;'
      trigger: 'post_stage_9'
      failure_mode: 'warn_inline_non_fatal'

    pattern_detection:
      description: |
        After cleanup, query for recurring P0 violations that appear in
        ≥3 consecutive audit sessions — these are systemic issues requiring
        architectural fix, not point remediation. Surface inline if found.
      query: |
        SELECT rule_id, file_path, description, COUNT(*) as recurrence_count
        FROM audit_violations
        WHERE severity = 'P0' AND auto_fixed = 0
        GROUP BY rule_id, file_path, description
        HAVING recurrence_count >= 3
        ORDER BY recurrence_count DESC;
      on_result: |
        If rows returned:
          Emit inline: "⚠️ CORTEX detected {count} recurring P0 pattern(s) across
          multiple audit sessions — these require architectural fix, not point
          remediation: {violation_list}"

    # Phase 106-B (GAP-106-02, GAP-106-06): RCA dispatch for recurring violations
    rca_dispatch:
      description: |
        When pattern_detection returns rows (recurrence_count >= 3), dispatch
        RCAEngine.analyze() per recurring violation. Persist the resulting
        PreventionRule to rca_store.db, then surface the rule inline (CORE-002).
        This closes the audit→root-cause→prevention feedback loop.
      trigger: "pattern_detection returns recurrence_count >= 3"
      for_each_violation:
        action: "RCAEngine.analyze(failure_id=rule_id, symptom=description, category=TECHNOLOGY)"
        persist: "rca_store.persist(rca_analysis)"
        generate_prevention_rule: "rca_analysis.generate_prevention_rule(gate_level=ADVISORY)"
        emit_inline: "🔬 RCA: {root_cause} → PreventionRule {rule_id} written to rca_store (ADVISORY)"
      governance:
        - "CORE-002: emit_inline only — no .md/.txt/.json files created"
        - "CORE-035: RCAEngine in cortex/intelligence/learning/rca_engine.py (single canonical)"
      python_ref: "cortex/intelligence/learning/rca_engine.py (Phase 87 — 121 GREEN tests)"
      rca_store_ref: "cortex/intelligence/learning/rca_store.py → .cortex-runtime/rca/rca_store.db"

  # ==========================================================================
  # STAGES
  # ==========================================================================
  stages:

    # -------------------------------------------------------------------------
    # Stage -1: Environment Readiness (Preflight)
    # -------------------------------------------------------------------------
    - stage_id: 'stage_minus_1'
      stage_num: -1
      name: 'Environment Readiness — Requirements Preflight Gate'
      orchestrator: 'UpgradeOrchestrator'
      method: 'validate_requirements()'
      guard: 'CORTEX_SKIP_PREFLIGHT != "true"'
      description: |
        Runs before Stage 0. Validates:
          1. Active interpreter is project .venv (sys.executable contains ".venv")
          2. requirements.txt exists and parses cleanly
          3. All [PREFLIGHT CRITICAL] packages installed and version-satisfied
          4. No duplicate entries in requirements.txt
          5. pip check passes (no broken dependency chains)
        On P0: halt pipeline. Offer autonomous pip install -r requirements.txt
        then rescan. If repair fails: surface exact failures inline and halt.

      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        label: 'requirements-preflight'
        detect_step:
          action: 'check_requirements_txt_against_installed'
          params:
            requirements_file: 'requirements.txt'
            check_preflight_critical: true
            run_pip_check: true
        fix_step:
          action: 'run_pip_install'
          params:
            command: ['pip', 'install', '-r', 'requirements.txt']
        success_predicate: 'missing_count == 0 and pip_check_errors == 0'
        max_cycles: 3
        retention_days: 14
        silent_on_clean: true

      sqlite_logging:
        table: 'audit_stage_log'
        stage_label: 'requirements-preflight'

    # -------------------------------------------------------------------------
    # Stage 0: Inflight Upgrade + Governance Pre-Flight
    # -------------------------------------------------------------------------
    - stage_id: 'stage_0'
      stage_num: 0
      name: 'Stage 0 — Governance Pre-Flight + Inflight Upgrade'
      agent: 'STAGE-0-GOVERNANCE-AUDIT-SPEC.md'
      orchestrator: 'MasterOrchestrator → UpgradeOrchestrator'
      description: |
        Inflight upgrade detection (CORE-049 — silent if no new commits):
          git rev-list --count HEAD..origin/main
          If > 0: fetch → merge (admin folders protected) → continue
        Governance pre-flight:
          Load skull-rules.yaml (37 rules: 35 CORE + 2 AC)
          Verify GovernanceRegistry loads from canonical path
          Verify EnforcementOrchestrator pre-commit hook is wired
      sqlite_logging:
        table: 'audit_stage_log'
        stage_label: 'governance-preflight'

    # -------------------------------------------------------------------------
    # Stage 1: Stage 0 Governance Pre-Flight (canonical spec)
    # -------------------------------------------------------------------------
    - stage_id: 'stage_1'
      stage_num: 1
      name: 'Stage 1 — Stage 0 Governance Pre-Flight (full spec)'
      agent: 'STAGE-0-GOVERNANCE-AUDIT-SPEC.md'
      description: 'Full Stage 0 spec execution including AC marker validation.'
      sqlite_logging:
        table: 'audit_stage_log'
        stage_label: 'stage-0-governance'

    # -------------------------------------------------------------------------
    # Stage 1.5: Intelligence Matrix Gate (Phase 65 — ENH-MATRIX-001)
    # NEW: Cross-cutting intelligence layer — runs between Stage 1 and Stage 2
    # -------------------------------------------------------------------------
    - stage_id: 'stage_1_5'
      stage_num: '1.5'
      name: 'Stage 1.5 — Intelligence Matrix Gate (Cross-Cutting Neural Wiring)'
      orchestrator: 'IntelligenceOrchestrator'
      mcp_tool: 'cortex_intelligence_matrix'
      python_module: 'cortex.intelligence.cross_cutting.intelligence_matrix_builder'
      description: |
        Builds the HIGH VALUE intelligence matrix by crossing every intelligence
        capability (x) against every CORTEX capability (y) across 7 dimensions:
          brain_tier, lens, intelligence, toolkit, workflow, response, governance.

        Outputs:
          (a) Inline P0-CRITICAL gap report in Copilot Chat (ResponseTemplate rendered)
          (b) JSON matrix persisted to .cortex-runtime/intelligence/intelligence-matrix.json
          (c) P0-CRITICAL gap list injected as Check #20 violations into Stage 2 scan
          (d) DocGen playbook (PB-STS-002) stage_1 discovery augmented with KnowledgeIndexer

        On P0-CRITICAL gaps found:
          → Surface inline immediately (never to file — CORE-002)
          → Register as audit_violations entries (stage_num=1.5, severity=P0)
          → Feed into Stage 7–8 auto-fix convergence loop

        DocGen Playbook Integration (PB-STS-002):
          → KnowledgeIndexer.inventory() result → DocGen stage_1.knowledge_yaml_scan
          → SynthesisEngine detects knowledge conflicts → DocGen stage_2 generation input
          → IntelligenceOrchestrator gap report → DocGen stage_3 validation assertions

      steps:
        - id: 'build_matrix'
          action: 'cortex_intelligence_matrix'
          params:
            operation: 'build'
          on_success: 'render_inline_and_continue'

        - id: 'persist_matrix'
          action: 'cortex_intelligence_matrix'
          params:
            operation: 'persist'
          on_success: 'continue'

        - id: 'extract_gaps'
          action: 'cortex_intelligence_matrix'
          params:
            operation: 'gaps'
          on_success: 'inject_into_stage_2'

        - id: 'docgen_sync'
          description: 'Sync KnowledgeIndexer findings into DocGen playbook'
          action: 'cortex.lens'
          params:
            operation: 'analyze'
            scope: 'cortex/intelligence/tier3/knowledge/'
          on_success: |
            Inject result into:
              cortex-registry/workflows/templates/internal/documentation-refresh-pipeline.yaml
              → stage_1.knowledge_yaml_scan params.augmented_by = 'intelligence_matrix'

      ac_markers:
        start: 'AC_STAGE_1_5_START: AC-MATRIX-GATE-{timestamp}'
        complete: 'AC_STAGE_1_5_COMPLETE: Intelligence Matrix Gate ✅'
        failure: 'AC_STAGE_1_5_COMPLETE: Intelligence Matrix Gate ❌'

      sqlite_logging:
        table: 'audit_stage_log'
        violations_table: 'audit_violations'
        stage_label: 'intelligence-matrix-gate'

    # -------------------------------------------------------------------------
    # Stage 2: 28-Point Production Readiness Scan (Checks #1–#28)
    # -------------------------------------------------------------------------
    - stage_id: 'stage_2'
      stage_num: 2
      name: 'Stage 2 — 28-Point Production Readiness Scan (Checks #1–#28)'
      orchestrator: 'EnforcementOrchestrator'
      # Phase 106-B (GAP-106-06): consult prevention_rules before scan
      # Known recurring root causes are elevated from P1 → P0 before checks run.
      prevention_rules_lookup:
        description: |
          Query active prevention_rules in rca_store.db before the scan begins.
          Any rule where gate_level >= WARNING that matches a known violation
          pattern is elevated to P0 severity for this session, ensuring the
          audit catches known recurring root causes with maximum urgency.
        query: |
          SELECT rule_id, category, description, gate_level
          FROM prevention_rules
          WHERE gate_level IN ('WARNING', 'BLOCK')
          ORDER BY gate_level DESC, created_at DESC;
        action: "elevate_severity(matched_violations, P0)"
        emit_inline: "🛡️ {count} active PreventionRule(s) applied — matched violations elevated to P0"
        governance: "CORE-002 (inline only), Phase 106-B (GAP-106-06)"
        rca_store_ref: ".cortex-runtime/rca/rca_store.db"
      checks:
        - num: 1
          label: 'Stale imports'
          scope: 'cortex/'
          tool: 'grep + AST'
          severity: 'P0'
        - num: 2
          label: 'Empty stubs'
          scope: 'cortex/'
          tool: 'AST scan'
          severity: 'P1'
        - num: 3
          label: 'Duplicate orchestrators'
          scope: 'cortex/orchestrators/'
          tool: 'diff analysis'
          severity: 'P0'
        - num: 4
          label: 'Low-value tests'
          scope: 'tests/'
          tool: 'TestQualityGate'
          severity: 'P1'
        - num: 5
          label: 'Broken file references'
          scope: ['cortex-registry/', '.github/']
          tool: 'Path resolution'
          severity: 'P1'
        - num: 6
          label: 'Root-level clutter'
          scope: '.'
          tool: 'find -maxdepth 1'
          severity: 'P2'
        - num: 7
          label: 'CORE rule violations'
          scope: 'cortex/'
          tool: 'cortex_validate op=compliance'
          severity: 'P0'
        - num: 8
          label: 'Scattered .db/.log files outside .cortex-runtime/'
          scope: '.'
          tool: 'find -name "*.db"'
          severity: 'P1'
        - num: 9
          label: 'Deprecated file names'
          scope: '.'
          tool: 'find -name "DEPRECATED*"'
          severity: 'P2'
        - num: 10
          label: 'Test-source mirror divergence'
          scope: ['tests/', 'cortex/']
          tool: 'Dir comparison'
          severity: 'P1'
        - num: 11
          label: 'Orchestrator health — all 22'
          scope: 'cortex/orchestrators/'
          tool: 'HealthOrchestrator.run_health_check()'
          severity: 'P0'
        - num: 12
          label: 'Markdown sprawl'
          scope: '.'
          tool: 'VacuumOrchestrator'
          severity: 'P1'
        - num: 13
          label: 'Prompt/agent coherence'
          scope: ['.github/agents/', '.github/prompts/']
          tool: 'cortex-meta-auditor.md (22 checks)'
          severity: 'P1'
        - num: 14
          label: 'MCP tool name registry alignment'
          scope: ['.github/agents/', '.github/prompts/']
          tool: 'grep stale tool names'
          severity: 'P1'
        - num: 15
          label: 'Governance YAML SSOT enforcement'
          scope: 'cortex-registry/'
          tool: 'skull-rules.yaml vs core-rules.yaml count'
          severity: 'P1'
        - num: 16
          label: 'Knowledge synthesis wiring'
          scope: 'cortex-registry/knowledge/'
          tool: 'Path resolution on YAML source fields'
          severity: 'P1'
        - num: 17
          label: 'LENS pipeline health — 8 analyzers'
          scope: 'cortex/lens/'
          tool: 'python3 -c "from cortex.lens import *" + pytest golden'
          severity: 'P0'
        - num: 18
          label: 'Requirements preflight completeness'
          scope: 'requirements.txt'
          tool: 'duplicate entry scan + pip check'
          severity: 'P1'
        - num: 19
          label: 'SQLite activity log health'
          scope: '.cortex-runtime/traces/orchestrator-traces.db'
          tool: 'sqlite3 integrity_check + bloat scan'
          severity: 'P1'
          description: |
            Verify orchestrator-traces.db:
              (a) File exists and passes sqlite3 integrity_check
              (b) No orphaned AC_START rows without matching AC_COMPLETE
                  in workflow_cycles or audit_stage_log
              (c) DB file size < bloat_threshold_mb (default 50 MB)
              (d) workflow_cycles table has rows for last 24h (proves
                  logging pipeline is active, not silently broken)
            Auto-fix: run detect-fix-rescan-loop with sqlite-health-sweep
            instantiation (see primitive usage_examples). If DB is corrupt,
            backup as orchestrator-traces.db.corrupt.{timestamp} and
            reinitialise schema fresh — data loss is acceptable over
            a broken trace pipeline.

        - num: 20
          label: 'Test fixture singleton DB isolation'
          scope: 'tests/'
          tool: 'AST scan + grep'
          severity: 'P1'
          description: |
            Detect pytest fixtures that use OrchestratorTraceLogger (or any
            class-level singleton with DB path attributes) without fully
            saving and restoring class-level attributes on teardown.
            Detection:
              (a) grep tests/ for fixtures that set CORTEX_TRACE_DB env var
                  AND reset _instance = None but do NOT restore TRACE_DB_PATH,
                  TRACE_ENABLED, or MAX_ROWS_PER_TABLE class attributes.
              (b) grep tests/ for any test method that calls `_instance = None`
                  without the temp_trace_db fixture in its signature.
            Detect command:
              python3 -c "
                import pathlib
                for f in pathlib.Path('tests/').rglob('*.py'):
                    src = f.read_text()
                    if 'CORTEX_TRACE_DB' in src and '_instance = None' in src:
                        if 'TRACE_DB_PATH' not in src:
                            print('MISSING_CLASS_ATTR_RESTORE: ' + str(f))
              "
            Pass criteria: no output (all fixtures restore class-level attrs)
            Auto-fix:
              Apply the canonical temp_trace_db pattern — save all three
              class-level attributes (TRACE_DB_PATH, TRACE_ENABLED,
              MAX_ROWS_PER_TABLE) before yield, restore all three after
              yield, then reset _instance = None. Reference implementation:
              tests/unit/infrastructure/test_orchestrator_trace_logger.py
              (commit 094aae9d8).
            Verification:
              python3 -m pytest tests/unit/infrastructure/test_orchestrator_trace_logger.py
              -p no:xdist — must be 16/16 GREEN.

        - num: 21
          label: 'Synthetic trace row contamination in production DB'
          scope: '.cortex-runtime/traces/orchestrator-traces.db'
          tool: 'sqlite3 pattern scan'
          severity: 'P1'
          description: |
            Detect test-generated sentinel rows that leaked into the production
            trace DB. Sentinel patterns: action = "TEST_ACTION", "ACTION_0",
            "ACTION_1", "ACTION_2"; context LIKE '%"test": "data"%'.
            These action names are reserved for test use only — production
            orchestrators must never emit them (CORE naming convention).
            Detect command:
              python3 -c "
                import sqlite3
                db = sqlite3.connect('.cortex-runtime/traces/orchestrator-traces.db')
                tables = ['trace_master','trace_enforcement','trace_tdd',
                          'trace_interaction','trace_refactoringorchestrator']
                total = 0
                for t in tables:
                    try:
                        n = db.execute(
                            'SELECT count(*) FROM ' + t +
                            ' WHERE action IN (\"TEST_ACTION\",\"ACTION_0\",'
                            '\"ACTION_1\",\"ACTION_2\")'
                        ).fetchone()[0]
                        if n: print(t + ': ' + str(n) + ' sentinel rows')
                        total += n
                    except: pass
                print('TOTAL_SENTINEL_ROWS=' + str(total))
                db.close()
              "
            Pass criteria: TOTAL_SENTINEL_ROWS == 0
            Auto-fix:
              For each of the 5 trace tables, run:
                DELETE FROM {table}
                WHERE action IN ('TEST_ACTION','ACTION_0','ACTION_1','ACTION_2');
              Then: VACUUM;
              Safe because these action names are exclusively test sentinels.

        - num: 22
          label: 'Slow orchestrator operation alerting (>5 s)'
          scope: '.cortex-runtime/traces/orchestrator-traces.db'
          tool: 'sqlite3 duration scan'
          severity: 'P1'
          description: |
            Detect any traced action with duration_ms > 5000. Slow operations
            indicate blocking I/O, unguarded LLM calls, or missing timeouts —
            all P1 per CORE operational envelope.
            Detect command:
              python3 -c "
                import sqlite3
                db = sqlite3.connect('.cortex-runtime/traces/orchestrator-traces.db')
                tables = ['trace_master','trace_enforcement','trace_tdd',
                          'trace_interaction','trace_refactoringorchestrator']
                found = False
                for t in tables:
                    try:
                        rows = db.execute(
                            'SELECT action, timestamp, duration_ms FROM ' + t +
                            ' WHERE duration_ms > 5000 ORDER BY duration_ms DESC LIMIT 5'
                        ).fetchall()
                        for r in rows:
                            print('SLOW_OP: ' + t + ' | ' + str(r[0]) +
                                  ' | ' + str(r[2]) + 'ms | ' + str(r[1]))
                            found = True
                    except: pass
                if not found: print('ALL_CLEAR')
                db.close()
              "
            Pass criteria: no SLOW_OP lines in output (no operation > 5000 ms)
            Auto-fix: NONE — slow operations require human investigation.
              Surface inline advisory:
                ⚠️ SLOW OPERATION detected: {action} took {duration_ms}ms
                at {timestamp}. Investigate: unguarded LLM call, blocking
                I/O, or missing timeout in orchestrator.
            Advisory only — does not block AC_COMPLETE.

        - num: 23
          label: 'Challenge gate drift — AC-PERMANENT-FIX-006 (skull rule)'
          scope: 'cortex/orchestrators/core/interaction_orchestrator.py'
          tool: 'grep + AST'
          severity: 'P0'
          skull_rule: 'AC-PERMANENT-FIX-006'
          description: |
            Verify that InteractionOrchestrator permanently has enable_challenges=True
            as its default and that ChallengeGenerator is imported and wired.
            Skull rule AC-PERMANENT-FIX-006 mandates challenge-driven interaction
            is non-configurable — regressing to False is a blocked P0 violation.

            Detect command:
              python3 -c "
                import ast, pathlib
                src = pathlib.Path(
                    'cortex/orchestrators/core/interaction_orchestrator.py'
                ).read_text()
                tree = ast.parse(src)
                violations = []
                for node in ast.walk(tree):
                    if isinstance(node, ast.FunctionDef) and node.name == '__init__':
                        for arg, default in zip(
                            reversed(node.args.args),
