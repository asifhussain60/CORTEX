# =============================================================================
# Golden Test Promotion Workflow Template
# =============================================================================
#
# Authority:  Phase 49 — Golden Test Promotion Pipeline
# Category:   tdd / golden
# Version:    1.0.0
# Created:    2026-02-18
# Author:     Asif Hussain
#
# WHAT THIS TEMPLATE GOVERNS
# --------------------------
# This template governs Copilot/CORTEX during any golden test promotion or
# golden test creation cycle. It enforces:
#   1. Parallel pytest-xdist execution across worker groups (not sequential)
#   2. Real-time VS Code terminal progress via ProgressReporter + TestProgressMonitor
#   3. DoD convergence loop: refactor + re-test until ALL conditions simultaneously true
#   4. TestClassifierOrchestrator consulted before any test file is written
#   5. CORE-055 compliance check at every convergence cycle
#
# TERMINAL PROGRESS FORMAT
# ------------------------
# The ParallelGoldenRunner streams a live dashboard to the VS Code terminal:
#
#   ╔══════════════════════════════════════════════════════════════╗
#   ║  CORTEX Golden Test Runner  |  Cycle 2/5  |  Workers: 4    ║
#   ╠══════════════════════════════════════════════════════════════╣
#   ║  Worker-1 [orchestrators]   ████████░░  80%   42✓  0✗      ║
#   ║  Worker-2 [governance]      ██████████ 100%   28✓  0✗  ✅  ║
#   ║  Worker-3 [brain/mcp]       █████░░░░░  50%   19✓  1✗      ║
#   ║  Worker-4 [integration]     ███████░░░  70%   31✓  0✗      ║
#   ╠══════════════════════════════════════════════════════════════╣
#   ║  Total: 120/145 passing  |  Elapsed: 4.2s  |  ETA: 1.8s    ║
#   ║  DoD: DOD-1✅ DOD-2✅ DOD-3⏳ DOD-4✅ DOD-5⏳ DOD-6✅ DOD-7⏳║
#   ╚══════════════════════════════════════════════════════════════╝
#
# AC-ID: AC-P49-WORKFLOW-001
# =============================================================================

workflow:
  id: "golden/test-promotion"
  name: "Golden Test Promotion Workflow"
  version: "1.0.0"
  category: "tdd/golden"
  phase: "49"

  description: |
    Full lifecycle for creating or promoting golden tests:
    classify → write failing tests (RED) → implement (GREEN) →
    parallel test run with live terminal progress →
    DoD convergence loop (refactor + re-test until all conditions true) →
    CORE-055 compliance check → git commit.

    Copilot is governed by this template. CORTEX (not Copilot) must
    meet the DoD. If DoD conditions are not met, the loop repeats
    (max_iterations enforced) and Copilot is instructed to refactor
    until conditions converge.

  metadata:
    author: "CORTEX Framework"
    created: "2026-02-18"
    manifest: "cortex-registry/governance/test-promotion-manifest.yaml"
    core_rules: [CORE-008, CORE-011, CORE-012, CORE-028, CORE-035, CORE-055]

  # ---------------------------------------------------------------------------
  # PARALLEL EXECUTION CONFIGURATION
  # ---------------------------------------------------------------------------
  parallel_execution:
    enabled: true
    engine: "pytest-xdist"
    version: "3.8.0"
    default_workers: 4
    worker_assignment_strategy: "domain_grouped"
    description: |
      Tests are grouped by domain folder, one domain per worker.
      This maximises cache locality and minimises fixture contention.
      Worker count is auto-scaled: min(4, cpu_count(), domain_groups).

    worker_groups:
      - id: "worker-orchestrators"
        paths:
          - "tests/golden/orchestrators/"
        marker_filter: "golden"
        timeout_per_test: 30

      - id: "worker-governance-mcp"
        paths:
          - "tests/golden/governance/"
          - "tests/golden/mcp/"
        marker_filter: "golden"
        timeout_per_test: 30

      - id: "worker-brain-intelligence"
        paths:
          - "tests/golden/brain/"
          - "tests/golden/intelligence/"
        marker_filter: "golden"
        timeout_per_test: 30

      - id: "worker-integration-agents"
        paths:
          - "tests/golden/integration/"
          - "tests/golden/agents/"
        marker_filter: "golden"
        timeout_per_test: 30

    xdist_command_template: |
      python -m pytest {paths}
        -n {workers}
        -v
        --tb=short
        --timeout=30
        -p cortex.devx.pytest_progress_plugin
        -m golden
        --no-header
        -q

    fallback_sequential: |
      # If pytest-xdist unavailable (import error), fall back to:
      python -m pytest {paths} -v --tb=short --timeout=30 -p cortex.devx.pytest_progress_plugin -m golden

  # ---------------------------------------------------------------------------
  # VS CODE TERMINAL PROGRESS INTEGRATION
  # ---------------------------------------------------------------------------
  terminal_progress:
    enabled: true
    integrations:
      primary: "cortex.common.progress_reporter.ProgressReporter"
      monitor: "cortex.devx.test_progress_monitor.TestProgressMonitor"
      plugin: "cortex.devx.pytest_progress_plugin"
      aggregator: "cortex.orchestrators.support.parallel_golden_runner.ParallelGoldenRunner"

    output_format: "vscode_terminal_box"
    update_frequency_ms: 500
    show_per_worker_bars: true
    show_dod_status: true
    show_eta: true
    show_elapsed: true

    box_spec: |
      ╔══════════════════════════════════════════════════════════════╗
      ║  CORTEX Golden Test Runner  |  Cycle {n}/{max}  |  Workers: {w} ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  {worker_id:<28} {bar:<10} {pct:>4}%  {passed:>4}✓ {failed:>3}✗ {status} ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  Total: {total_pass}/{total} passing  |  Elapsed: {elapsed}  |  ETA: {eta} ║
      ║  DoD: {dod_status_line}                                      ║
      ╚══════════════════════════════════════════════════════════════╝

    dod_status_symbols:
      passing: "✅"
      failing: "⏳"
      blocked: "❌"
      not_checked: "◯"

    progress_bar_chars:
      filled: "█"
      empty: "░"
      width: 10

  # ---------------------------------------------------------------------------
  # GLOBAL CONVERGENCE GATE
  # ---------------------------------------------------------------------------
  convergence_gate:
    max_cycles: 5
    on_max_exceeded: "HALT_AND_REPORT"
    backoff_strategy: "linear_2s"
    success_criteria:
      all_golden_tests_pass: true
      zero_regressions: true
      core_055_compliant: true
      manifest_valid: true
      classifier_importable: true
    convergence_predicate: |
      all_golden_tests_pass
      and zero_regressions
      and core_055_compliant
      and manifest_valid
      and classifier_importable

  # ---------------------------------------------------------------------------
  # WORKFLOW STEPS
  # ---------------------------------------------------------------------------
  steps:

    # ── STEP 1: Classify ──────────────────────────────────────────────────────
    - step_id: "classify"
      name: "Classify Module Under Test"
      orchestrator: "TestClassifierOrchestrator"
      description: |
        Before writing a single test, classify the target module.
        Returns TestDecision: tier, concerns, target_folder, markers, coverage_floor.
        If tier == STANDARD: use standard TDD, not this template.
        If tier == GOLDEN: continue to step 2.
      convergence_gate:
        max_cycles: 1
        success_criteria:
          classification_returned: true
        convergence_predicate: "decision.tier in ['GOLDEN', 'STANDARD']"
      params:
        module_path: "{{module_path}}"
        manifest_path: "cortex-registry/governance/test-promotion-manifest.yaml"
      outputs:
        - "decision.tier → {tier}"
        - "decision.concerns → {concerns}"
        - "decision.target_folder → {target_folder}"
        - "decision.required_markers → {required_markers}"
        - "decision.coverage_floor → {coverage_floor}"
      on_standard_tier:
        action: "redirect"
        redirect_to: "cortex-registry/workflows/templates/tdd/tdd-feature-implementation.yaml"

    # ── STEP 2: RED Phase ─────────────────────────────────────────────────────
    - step_id: "red_phase"
      name: "RED — Write Failing Golden Tests"
      orchestrator: "TDDOrchestrator"
      depends_on: ["classify"]
      description: |
        Write golden test file in {{decision.target_folder}}.
        File MUST contain:
          - Module docstring with TEST COVERAGE MATRIX (P0/P1/P2 tiers)
          - AC-ID annotation
          - One test class per required concern
          - @pytest.mark.golden on all test classes
          - @pytest.mark.{concern} on concern-specific test classes
        All tests MUST be failing (RED) before proceeding.
      convergence_gate:
        max_cycles: 3
        success_criteria:
          test_file_exists: true
          tests_failing: true
          coverage_matrix_present: true
          ac_id_present: true
          concern_markers_present: true
        convergence_predicate: |
          test_count > 0
          and all_failing
          and coverage_matrix_present
          and ac_id_present
          and concern_markers_present
      params:
        phase: "RED"
        target_folder: "{{decision.target_folder}}"
        required_concerns: "{{decision.concerns}}"
        required_markers: "{{decision.required_markers}}"
        coverage_floor: "{{decision.coverage_floor}}"
        scenario_naming_pattern: "{{CONCERN}}-{NNN}: {scenario_description}"
        test_framework: "pytest"

    # ── STEP 3: GREEN Phase ───────────────────────────────────────────────────
    - step_id: "green_phase"
      name: "GREEN — Implement Until Tests Pass"
      orchestrator: "TDDOrchestrator"
      depends_on: ["red_phase"]
      convergence_gate:
        max_cycles: 8
        success_criteria:
          all_new_tests_pass: true
          no_new_regressions: true
        convergence_predicate: "all_new_tests_pass and regressions == 0"
      params:
        phase: "GREEN"
        patterns: "Orchestrator + Registry pattern"
        coverage_target: "{{decision.coverage_floor}}"

    # ── STEP 4: Parallel Test Run (Real-Time Terminal Progress) ───────────────
    - step_id: "parallel_run"
      name: "Parallel Golden Suite Run — Live Terminal Progress"
      orchestrator: "ParallelGoldenRunner"
      depends_on: ["green_phase"]
      description: |
        Runs ALL golden tests in parallel (domain-grouped workers).
        Streams real-time progress box to VS Code terminal.
        Aggregates results across workers.
        On any worker failure: other workers continue (no early exit).
      convergence_gate:
        max_cycles: 2
        success_criteria:
          all_workers_complete: true
          aggregate_results_available: true
        convergence_predicate: "all_workers_complete and total_failed == 0"
      params:
        worker_groups: "{{parallel_execution.worker_groups}}"
        workers: 4
        progress_style: "vscode_terminal_box"
        fail_fast: false
        timeout_per_test: 30
        xdist_command_template: "{{parallel_execution.xdist_command_template}}"

    # ── STEP 5: REFACTOR Phase ────────────────────────────────────────────────
    - step_id: "refactor_phase"
      name: "REFACTOR — Code Quality Pass"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["parallel_run"]
      convergence_gate:
        max_cycles: 5
        success_criteria:
          all_tests_still_pass: true
          type_hints_complete: true
          docstrings_complete: true
          no_core_violations: true
        convergence_predicate: |
          all_tests_still_pass
          and type_hint_coverage == 100
          and docstring_coverage == 100
          and core_violations == 0
      params:
        refactoring_operations:
          - "add_google_docstrings"
          - "add_type_hints"
          - "remove_duplication"
          - "extract_constants"
        preserve_behavior: true
        core_rules: [CORE-011, CORE-012, CORE-028, CORE-035]

    # ── STEP 6: DoD Convergence Loop ──────────────────────────────────────────
    - step_id: "dod_loop"
      name: "DoD Convergence Loop — Repeat Until All Conditions True"
      orchestrator: "EnforcementOrchestrator"
      depends_on: ["refactor_phase"]
      description: |
        CORTEX (not Copilot) must meet every DoD condition simultaneously.
        If any condition fails: EnforcementOrchestrator identifies the
        failing condition, instructs the relevant orchestrator to fix it,
        re-runs the parallel test suite, and re-checks.
        Loop repeats until convergence_predicate is true or max_iterations exceeded.

        This loop governs Copilot: Copilot receives targeted fix instructions
        per failing condition rather than a full re-run. CORTEX controls the loop.
      convergence_gate:
        max_cycles: 5
        success_criteria:
          dod_1_all_golden_pass: true
          dod_2_zero_regressions: true
          dod_3_core_055_present: true
          dod_4_manifest_valid: true
          dod_5_classifier_importable: true
          dod_6_parallel_runner_importable: true
          dod_7_mcp_classify_responds: true
        convergence_predicate: |
          dod_1_all_golden_pass
          and dod_2_zero_regressions
          and dod_3_core_055_present
          and dod_4_manifest_valid
          and dod_5_classifier_importable
          and dod_6_parallel_runner_importable
          and dod_7_mcp_classify_responds
        on_max_exceeded: "HALT_AND_REPORT"

      dod_conditions:
        - id: "DOD-1"
          name: "All new golden tests passing"
          check: "python -m pytest tests/golden/orchestrators/support/ tests/golden/governance/ -q --tb=no -m golden 2>&1 | grep -E 'passed|failed'"
          pass_pattern: "0 failed"
          on_fail:
            instruction: "Re-run GREEN phase for failing test IDs"
            target_orchestrator: "TDDOrchestrator"

        - id: "DOD-2"
          name: "Zero regressions in existing golden suite"
          check: "python -m pytest tests/golden/ -q --tb=no 2>&1 | tail -1"
          pass_pattern: "355 passed"
          tolerance: "±5 pre-existing failures"
          on_fail:
            instruction: "Identify regression source, revert last change, re-implement"
            target_orchestrator: "TDDOrchestrator"

        - id: "DOD-3"
          name: "CORE-055 rule present in skull-rules.yaml"
          check: "grep -c 'rule_id: CORE-055' cortex-registry/core/governance/skull-rules.yaml"
          pass_pattern: "1"
          on_fail:
            instruction: "Append CORE-055 block to skull-rules.yaml"
            target_orchestrator: "GovernanceOrchestrator"

        - id: "DOD-4"
          name: "Test promotion manifest is valid YAML"
          check: "python -c \"import yaml; yaml.safe_load(open('cortex-registry/governance/test-promotion-manifest.yaml')); print('ok')\""
          pass_pattern: "ok"
          on_fail:
            instruction: "Fix YAML syntax in test-promotion-manifest.yaml"
            target_orchestrator: "HealthOrchestrator"

        - id: "DOD-5"
          name: "TestClassifierOrchestrator importable"
          check: "python -c \"from cortex.orchestrators.support.test_classifier_orchestrator import TestClassifierOrchestrator; print('ok')\""
          pass_pattern: "ok"
          on_fail:
            instruction: "Fix import errors in test_classifier_orchestrator.py"
            target_orchestrator: "TDDOrchestrator"

        - id: "DOD-6"
          name: "ParallelGoldenRunner importable"
          check: "python -c \"from cortex.orchestrators.support.parallel_golden_runner import ParallelGoldenRunner; print('ok')\""
          pass_pattern: "ok"
          on_fail:
            instruction: "Fix import errors in parallel_golden_runner.py"
            target_orchestrator: "TDDOrchestrator"

        - id: "DOD-7"
          name: "MCP classify operation responds correctly"
          check: |
            python -c "
            from cortex.orchestrators.support.test_classifier_orchestrator import TestClassifierOrchestrator
            d = TestClassifierOrchestrator().classify('cortex/orchestrators/core/tdd_orchestrator.py')
            assert d.tier.value == 'GOLDEN', f'Expected GOLDEN got {d.tier}'
            print('ok')
            "
          pass_pattern: "ok"
          on_fail:
            instruction: "Fix classify() logic for orchestrator paths"
            target_orchestrator: "TestClassifierOrchestrator"

    # ── STEP 7: CORE-055 Compliance Check ────────────────────────────────────
    - step_id: "core_055_check"
      name: "CORE-055 Compliance Audit"
      orchestrator: "EnforcementOrchestrator"
      depends_on: ["dod_loop"]
      description: |
        Scan all files created in this cycle against CORE-055:
        - Golden-tier test in wrong folder → violation
        - Missing coverage matrix → violation
        - Missing AC-ID → violation
        - Missing concern markers → violation
        Report violations inline. Fix before proceeding.
      convergence_gate:
        max_cycles: 2
        success_criteria:
          core_055_violations: 0
        convergence_predicate: "core_055_violations == 0"
      params:
        scan_paths:
          - "tests/golden/"
          - "cortex/orchestrators/support/test_classifier_orchestrator.py"
          - "cortex/orchestrators/support/parallel_golden_runner.py"
        manifest: "cortex-registry/governance/test-promotion-manifest.yaml"

    # ── STEP 8: Teardown & Commit ──────────────────────────────────────────────
    - step_id: "teardown"
      name: "Teardown — Git Commit & Registry Update"
      orchestrator: "BootstrapOrchestrator"
      depends_on: ["core_055_check"]
      convergence_gate:
        max_cycles: 1
        success_criteria:
          git_committed: true
          registry_updated: true
        convergence_predicate: "git_committed and registry_updated"
      tasks:
        - id: "T1"
          name: "Git add all Phase 49 files"
          command: |
            git add \
              cortex/orchestrators/support/test_classifier_orchestrator.py \
              cortex/orchestrators/support/parallel_golden_runner.py \
              cortex/mcp/tools/health_orchestrator_tool.py \
              cortex-registry/core/governance/skull-rules.yaml \
              cortex-registry/governance/test-promotion-manifest.yaml \
              cortex-registry/planning/phases/planned/phase-49-golden-test-promotion.yaml \
              cortex-registry/workflows/templates/governance/golden-test-promotion.yaml \
              tests/golden/orchestrators/support/test_classifier_golden.py \
              tests/golden/orchestrators/support/test_parallel_runner_golden.py \
              tests/golden/governance/test_core_055_golden.py

        - id: "T2"
          name: "Git commit"
          command: |
            git commit -m "feat: Phase 49 — Golden Test Promotion Pipeline (29 golden tests, CORE-055, parallel runner)"

        - id: "T3"
          name: "Update cortex-master.yaml to v7.7"
          action: "registry_update"
          changes:
            - "version: 7.6 → 7.7"
            - "total_phases: 48 → 49"
            - "phase-49 status: planned → complete"
            - "completion_percentage: 98 → 99"
            - "summary.planned: 1 → 0"
            - "summary.completed: 47 → 49"

  # ---------------------------------------------------------------------------
  # EPILOGUES (auto-injected after teardown)
  # ---------------------------------------------------------------------------
  epilogues:
    - epilogue_id: "post_phase_dedup"
      name: "PostPhaseDeduplicationReview"
      description: "Auto-detect duplicate logic between TestClassifierOrchestrator and any existing classifier (CORE-035)"
      trigger: "after_teardown"

    - epilogue_id: "holistic_sweep"
      name: "HolisticRefactoringSweep"
      description: "Final holistic quality pass on all Phase 49 files"
      trigger: "workflow_complete"

  # ---------------------------------------------------------------------------
  # KNOWLEDGE CONTEXT
  # ---------------------------------------------------------------------------
  knowledge_context:
    architect_mode:
      test_framework: "pytest + pytest-xdist==3.8.0"
      parallel_workers: 4
      progress_integration: "cortex.common.progress_reporter + cortex.devx.test_progress_monitor"
      coverage_target_golden: "95%"
      coverage_target_standard: "80%"
      core_rules: [CORE-008, CORE-011, CORE-012, CORE-028, CORE-035, CORE-055]
      classifier_location: "cortex/orchestrators/support/test_classifier_orchestrator.py"
      manifest_location: "cortex-registry/governance/test-promotion-manifest.yaml"

    production_mode:
      test_framework: "{{test_framework}}"
      parallel_workers: "{{parallel_workers}}"
      coverage_target: "{{coverage_target}}"
      core_rules: "{{core_rules}}"

  # ---------------------------------------------------------------------------
  # SUCCESS CRITERIA (workflow-level, mirrors phase DoD)
  # ---------------------------------------------------------------------------
  success_criteria:
    - "29 new golden tests passing (GC-001..015, GP-001..008, GR-001..006)"
    - "Zero regressions (existing 355 passing unchanged)"
    - "TestClassifierOrchestrator classify() returns correct TestDecision for all GOLDEN_PATHS"
    - "ParallelGoldenRunner runs 4 workers with live terminal progress box"
    - "CORE-055 appended to skull-rules.yaml"
    - "test-promotion-manifest.yaml valid YAML, parseable by TestClassifierOrchestrator"
    - "cortex-master.yaml updated to v7.7"
    - "git commit signed with all Phase 49 files"
