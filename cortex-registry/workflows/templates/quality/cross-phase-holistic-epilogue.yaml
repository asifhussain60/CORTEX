# ==============================================================================
# Cross-Phase Holistic Epilogue — Declarative Injection Template
# ==============================================================================
# Authority: CORE-008 (TDD) · CORE-035 (no duplication) · CORE-049 (silent execution)
# Purpose: Auto-injected after every phase in a composite pipeline.
#          Performs linting, cleanup, deduplication, security re-verification,
#          and holistic refactoring across ALL files modified during the phase.
# Composable: Declared as epilogue_ref in any pipeline template.
# ==============================================================================

workflow:
  id: "quality/cross-phase-holistic-epilogue"
  name: "Cross-Phase Holistic Epilogue"
  version: "1.0.0"
  category: "quality"
  description: |
    Declarative epilogue auto-injected after every phase in a composite pipeline.
    Ensures holistic coherence: linting, cleanup, deduplication, security
    re-verification, and cross-cutting refactoring across all modified files.
    Prevents local optima by sweeping the full change surface after each phase.

  metadata:
    author: "CORTEX"
    created: "2026-02-21"
    phase: "102"
    epilogue: true
    composable: true
    auto_inject: true

  # ── INJECTION POLICY ─────────────────────────────────────────────
  injection_policy:
    trigger: "after_each_phase"
    scope: "all_modified_files"
    skip_conditions:
      - "phase_type == 'scan_only'"
      - "no_files_modified"
    description: |
      Auto-injected by WorkflowComposer after every code-modifying phase.
      Skipped for read-only phases (LENS scan, planning) or when no files
      were modified during the phase.

  # ── CONVERGENCE GATE ──────────────────────────────────────────────
  convergence_loop:
    primitive: 'primitives/validation/detect-fix-rescan-loop'
    max_cycles: 6
    success_criteria:
      all_tests_pass: true
      lint_clean: true
      no_duplicates: true
      security_clean: true
      complexity_acceptable: true
    convergence_predicate: "all_pass and lint == 0 and dupes == 0 and security_ok and complexity <= target"
    backoff_strategy: "linear"

  # ── KNOWLEDGE CONTEXT ────────────────────────────────────────────
  knowledge_context:
    architect_mode:
      linting_tools: ["pylint", "ruff", "mypy"]
      complexity_target: 10
      coverage_minimum: "90%"
      governance_rules: ["CORE-008", "CORE-011", "CORE-012", "CORE-028", "CORE-035"]
      dedup_threshold: 0.85
      security_scanners: ["bandit", "safety"]
    production_mode:
      linting_tools: "{{linting_tools}}"
      complexity_target: "{{complexity_target}}"
      coverage_minimum: "{{coverage_minimum}}"
      governance_rules: "{{governance_rules}}"
      dedup_threshold: "{{dedup_threshold}}"
      security_scanners: "{{security_scanners}}"

  # ── STEPS ────────────────────────────────────────────────────────
  steps:

    # Step 1 — Lint & Static Analysis
    - step_id: "lint_and_static_analysis"
      name: "Lint & Static Analysis on Modified Files"
      orchestrator: "EnforcementOrchestrator"
      description: |
        Run linting and static analysis on all files modified during the
        preceding phase. Fix auto-fixable issues. Report remaining violations.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 3
        success_criteria:
          lint_errors: 0
          type_check_pass: true
        convergence_predicate: "lint_count == 0 and type_check_pass"
      params:
        scope: "modified_files_only"
        tools: "{{linting_tools}}"
        auto_fix: true
        governance_rules: "{{governance_rules}}"
        output_keys: ["lint_report", "auto_fixes_applied", "remaining_violations"]

    # Step 2 — Deduplication Review
    - step_id: "dedup_review"
      name: "Deduplication Review (CORE-035)"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["lint_and_static_analysis"]
      description: |
        Detect duplicate code introduced during the phase. Flag pairs with
        similarity > threshold for consolidation. Auto-merge where safe.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 3
        success_criteria:
          duplicate_pairs: 0
          tests_pass: true
        convergence_predicate: "dupes == 0 and all_tests_pass"
      params:
        similarity_threshold: "{{dedup_threshold}}"
        core_rule: "CORE-035"
        auto_merge: true
        output_keys: ["duplicate_pairs", "merged_count", "remaining_duplicates"]

    # Step 3 — Cleanup & Dead Code Removal
    - step_id: "cleanup_dead_code"
      name: "Cleanup Dead Code & Unused Imports"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["dedup_review"]
      description: |
        Remove unused imports, dead code, empty stubs, and deprecated
        references from modified files.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 2
        success_criteria:
          dead_code_removed: true
          tests_pass: true
        convergence_predicate: "dead_code_count == 0 and all_tests_pass"
      params:
        operations: ["remove_unused_imports", "remove_dead_code", "remove_empty_stubs"]
        output_keys: ["removed_imports", "removed_functions", "cleanup_count"]

    # Step 4 — Cross-Cutting Refactoring
    - step_id: "refactor_cross_cutting"
      name: "Cross-Cutting Refactoring Sweep"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["cleanup_dead_code"]
      description: |
        Apply cross-cutting refactoring: consistent naming, extract shared
        patterns, reduce coupling between modified modules.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 4
        success_criteria:
          quality_improved: true
          tests_pass: true
          complexity_acceptable: true
        convergence_predicate: "quality_delta >= 0 and all_tests_pass and complexity <= {{complexity_target}}"
      params:
        operations: ["rename_for_consistency", "extract_shared_patterns", "reduce_coupling"]
        complexity_target: "{{complexity_target}}"
        output_keys: ["refactoring_count", "quality_delta", "final_complexity"]

    # Step 5 — Security Re-Verification
    - step_id: "security_reverification"
      name: "Security Re-Verification on Modified Files"
      orchestrator: "SecurityOrchestrator"
      depends_on: ["refactor_cross_cutting"]
      description: |
        Re-scan all modified files to ensure no security regressions were
        introduced by refactoring or cleanup operations.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 3
        success_criteria:
          no_new_vulnerabilities: true
          secrets_clean: true
        convergence_predicate: "new_vuln_count == 0 and secrets_count == 0"
      params:
        scan_scope: "modified_files_only"
        scanners: "{{security_scanners}}"
        output_keys: ["security_delta", "new_vulnerabilities", "secrets_found"]

    # Step 6 — Final Test Verification
    - step_id: "final_test_verification"
      name: "Final Test Suite Verification"
      orchestrator: "TDDOrchestrator"
      depends_on: ["security_reverification"]
      description: |
        Run smoke tests to confirm zero regressions from all epilogue
        operations. This is the final gate before marking the phase complete.
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 2
        success_criteria:
          all_tests_pass: true
          no_regressions: true
        convergence_predicate: "all_tests_pass and regression_count == 0"
      params:
        test_scope: "full_suite"
        parallel: true
        output_keys: ["test_results", "regression_count", "pass_rate"]

  # ── CONVERGENCE GATE ──────────────────────────────────────────────
  convergence_gate:
    max_cycles: 6
    convergence_predicate: "all_pass and lint == 0 and dupes == 0 and security_ok and complexity <= target"
    success_criteria:
      all_tests_pass: true
      lint_violations: "== 0"
      duplicate_pairs: "== 0"
      test_regressions: "== 0"

  # ── SUCCESS CRITERIA ─────────────────────────────────────────────
  success_criteria:
    lint_violations: "== 0"
    duplicate_pairs: "== 0"
    dead_code_count: "== 0"
    new_security_vulnerabilities: "== 0"
    test_regressions: "== 0"
    complexity_score: "<= target"

  # ── EPILOGUES (terminal — no further epilogues) ──────────────────
  epilogues: []
