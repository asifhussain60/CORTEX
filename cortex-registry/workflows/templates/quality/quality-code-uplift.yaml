# Code Quality Uplift Workflow Template
# Phase 100 Stage 5
# Systematic code quality improvement with convergence gates

workflow:
  id: "quality/code-uplift"
  name: "Code Quality Uplift Workflow"
  category: "quality"
  description: "Systematic code quality improvement (complexity, duplication, coverage)"

  metadata:
    author: "CORTEX"
    created: "2026-02-16"
    phase: "100"
    stage: "5"

  convergence_loop:
    primitive: 'primitives/validation/detect-fix-rescan-loop'
    max_cycles: 12
    success_criteria:
      complexity_target_met: true
      duplication_eliminated: true
      coverage_target_met: true
    convergence_predicate: "complexity <= target and duplicates == 0 and coverage >= target"
    backoff_strategy: "linear"

  knowledge_context:
    architect_mode:
      complexity_target: "10"  # Cyclomatic complexity
      coverage_target: "95%"
      quality_tools: ["radon", "pylint", "mypy"]
    production_mode:
      complexity_target: "{{complexity_target}}"  # From cortex-registry/company/domains/
      coverage_target: "{{coverage_target}}"
      quality_tools: "{{quality_tools}}"

  steps:
    - step_id: "complexity_analysis"
      name: "Analyze Code Complexity"
      orchestrator: "LENSSynthesis"
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 2
        success_criteria:
          analysis_complete: true
        convergence_predicate: "hotspots_identified"
      params:
        analysis_type: "complexity"
        tools: ["radon", "mccabe"]

    - step_id: "complexity_reduction"
      name: "Reduce Code Complexity"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["complexity_analysis"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 10
        success_criteria:
          complexity_target_met: true
          tests_pass: true
        convergence_predicate: "complexity <= {{complexity_target}} and all_tests_pass"
      params:
        refactoring_operations: ["extract_method", "simplify_conditionals", "reduce_nesting"]
        complexity_target: "{{complexity_target}}"

    - step_id: "duplication_detection"
      name: "Detect Code Duplication"
      orchestrator: "LENSSynthesis"
      depends_on: ["complexity_reduction"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 2
        success_criteria:
          duplicates_found: true
        convergence_predicate: "duplicate_count >= 0"
      params:
        analysis_type: "duplication"
        core_rule: "CORE-035"

    - step_id: "duplication_elimination"
      name: "Eliminate Code Duplication"
      orchestrator: "RefactoringOrchestrator"
      depends_on: ["duplication_detection"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 8
        success_criteria:
          duplicates_eliminated: true
          tests_pass: true
        convergence_predicate: "duplicate_count == 0 and all_tests_pass"
      params:
        refactoring_operations: ["extract_common_code", "create_shared_module"]

    - step_id: "coverage_uplift"
      name: "Increase Test Coverage"
      orchestrator: "TDDOrchestrator"
      depends_on: ["duplication_elimination"]
      convergence_loop:
        primitive: 'primitives/validation/detect-fix-rescan-loop'
        max_cycles: 6
        success_criteria:
          coverage_target_met: true
        convergence_predicate: "coverage >= {{coverage_target}}"
      params:
        phase: "GREEN"
        coverage_target: "{{coverage_target}}"

  epilogues:
    - epilogue_id: "quality_metrics_report"
      name: "Code Quality Metrics Report"
      trigger: "workflow_complete"
