# ============================================================================
# PRIMITIVE: Sweep Catalogue Open — CORE-064 Sweep Completeness Contract
# ============================================================================
# Tier:      1 (Primitive — atomic, reusable, parameterised)
# Category:  governance
# Authority: CORE-064 (Sweep Completeness Contract)
# Phase:     56 — Structural Sweep Enforcement
#
# Purpose:
#   Opens (or resumes) a durable SweepCatalogue at the START of every
#   FIX / REFACTOR / AUDIT composed workflow.  The catalogue tracks every
#   detected issue for the session.  Paired with sweep-catalogue-close.yaml.
#
# Reused by:
#   - Any composed workflow produced by TemplateComposer for fix/refactor/audit
#   - audit/audit-fix-pipeline (Stages 7–8 via detect-fix-rescan-loop)
#
# Wiring:
#   TemplateComposer injects this step at index 0 of every sweep-required
#   composed template.  SweepCompositionEnforcementAgent (EnforcementOrchestrator
#   agent #11) validates its presence before execution is permitted.
# ============================================================================

version: '1.0.0'
template_id: 'primitives/governance/sweep-catalogue-open'
name: 'Sweep Catalogue Open'
tier: 'primitive'
category: 'governance'
status: 'active'

metadata:
  description: |
    Opens a durable SweepCatalogue via SweepCatalogueOrchestrator.open_catalogue().
    The sweep_id returned is threaded through to sweep-catalogue-close.yaml.
    Persists to .cortex-runtime/sweeps/{sweep_id}.db (SQLite WAL — CORE-058).
  governance_rules:
    - 'CORE-064: Sweep Completeness Contract — every FIX/REFACTOR/AUDIT must open a catalogue'
    - 'CORE-058: SQLite WAL mode mandatory for all audit databases'
  tags:
    - governance
    - sweep-catalogue
    - core-064
    - primitive
  author: 'CORTEX Architecture'
  created: '2026-02-23'
  phase: 56

steps:
  - id: sweep_catalogue_open
    action: 'SweepCatalogueOrchestrator.open_catalogue'
    args:
      intent: '__operation_type_upper__'       # resolved at runtime from composed template metadata
      scope_files: '__resolved_at_runtime__'   # resolved by MasterOrchestrator._pre_routing_gate
    outputs:
      - name: sweep_id
        description: 'Durable sweep catalogue ID — threaded to assert_exhausted step'
    blocking: false
    on_failure: 'abort'
    source_primitive: 'core-064-sweep-open'
    governance_rule: 'CORE-064'

cortex_tooling:
  orchestrators:
    primary: 'SweepCatalogueOrchestrator'
    priority: 155
    method: 'open_catalogue'
  sqlite_db_pattern: '.cortex-runtime/sweeps/{sweep_id}.db'
  ac_markers:
    open: 'AC_START: AC-SWEEP-{sweep_id}'
