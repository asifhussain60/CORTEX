# drift-lock-emit.yaml
# Workflow Primitive — Drift Lock Emission
# Authority: phase-126-production-hardening-checklist-engine.yaml (Check #41)
# Purpose: Every time a gap is CLOSED by audit-fix, this primitive emits:
#   1. A permanent lock YAML in cortex-registry/governance/drift-locks/
#   2. A corresponding preflight test in tests/preflight/
# Both are CI-first — the test fails the build if the regression reappears.
# Wired into: /audit fix Stage 8 (auto-fix convergence), invoked once per GAP closed.

id: "primitives/governance/drift-lock-emit"
primitive_id: "drift-lock-emit"
primitive_type: "governance"
version_free: true  # CORE-NO-VERSION: this primitive carries no version field

metadata:
  description: "Emit a permanent CI drift lock when a production gap is closed"
  severity_on_skip: P0
  mandatory: true
  invocation_context: "audit-fix Stage 8, after each gap remediation"

inputs:
  check_id:
    type: string
    required: true
    description: "Check number, e.g. 'check-30' or 'check-32'"
    format: "check-{N}"
  domain:
    type: string
    required: true
    description: "Domain slug, e.g. 'windows-boot', 'stub-eradication'"
  detect_command:
    type: string
    required: true
    description: "Exact shell/python3 command that returns expected output when the lock holds"
  pass_criteria:
    type: string
    required: true
    description: "Exact expected output or 'exit 0'"
  auto_fix:
    type: string
    required: false
    default: "MANUAL"
    description: "Remediation command or MANUAL"
  source_gap:
    type: string
    required: true
    description: "GAP ID that this lock closes, e.g. GAP-126-01"

outputs:
  lock_yaml_path:
    type: string
    description: "Path to created lock YAML"
  test_file_path:
    type: string
    description: "Path to created preflight test"
  status:
    type: enum
    values: [EMITTED, ALREADY_EXISTS, FAILED]

steps:
  - step_id: "drift-lock-emit-01"
    name: "Resolve output paths"
    action: |
      lock_yaml_path = f"cortex-registry/governance/drift-locks/{check_id}-lock.yaml"
      test_file_path = f"tests/preflight/test_drift_lock_{check_id.replace('-', '_')}.py"
    on_failure: HALT

  - step_id: "drift-lock-emit-02"
    name: "Create drift locks directory if absent"
    action: |
      pathlib.Path("cortex-registry/governance/drift-locks").mkdir(parents=True, exist_ok=True)
    on_failure: HALT

  - step_id: "drift-lock-emit-03"
    name: "Emit lock YAML"
    action: |
      Render the following YAML to {lock_yaml_path}:
        lock_id: "LOCK-{check_id}-{YYYY-MM-DD}"
        check_id: "{check_id}"
        domain: "{domain}"
        detect_command: |
          {detect_command}
        pass_criteria: "{pass_criteria}"
        severity: P0
        ci_gate: true
        auto_fix: "{auto_fix}"
        created: "{YYYY-MM-DD}"
        source_gap: "{source_gap}"
    guard: "File must NOT already exist with different detect_command — if exists with same command, status=ALREADY_EXISTS, skip"
    on_failure: HALT

  - step_id: "drift-lock-emit-04"
    name: "Emit preflight test"
    action: |
      Render the following Python to {test_file_path}:
        """
        Drift lock test for {check_id} — {domain}
        Auto-generated by drift-lock-emit.yaml primitive.
        Source gap: {source_gap}
        This test is P0. If it fails, a previously-closed gap has regressed.
        CI blocks merge on any failure here.
        """
        import subprocess
        import pytest

        @pytest.mark.preflight
        def test_drift_lock_{check_id_underscored}() -> None:
            \"\"\"Drift lock: {domain} — regressed gap = {source_gap}.\"\"\"
            result = subprocess.run(
                {detect_command_as_args},
                capture_output=True,
                text=True,
                timeout=30,
            )
            assert "{pass_criteria}" in result.stdout or result.returncode == 0, (
                f"DRIFT LOCK BROKEN — {check_id} ({domain}) regressed. "
                f"Source gap: {source_gap}. "
                f"Auto-fix: {auto_fix}. "
                f"stdout: {{result.stdout!r}} stderr: {{result.stderr!r}}"
            )
    guard: "If file already exists and content matches, skip silently"
    on_failure: LOG_AND_CONTINUE  # test file failure is P1, not P0 — lock YAML is P0

  - step_id: "drift-lock-emit-05"
    name: "Verify detect_command passes on current clean repo"
    action: |
      Run {detect_command} immediately.
      Assert output matches {pass_criteria}.
    guard: "If this fails, the gap was NOT actually closed — HALT and surface as P0 violation"
    on_failure: HALT

  - step_id: "drift-lock-emit-06"
    name: "Emit AC_COMPLETE marker"
    action: |
      AC_COMPLETE: drift-lock-emit — {check_id} lock emitted ✅
      Log to .cortex-runtime/traces/orchestrator-traces.db
    on_failure: LOG_AND_CONTINUE

completion_criteria:
  - "lock_yaml_path exists and parses as valid YAML"
  - "test_file_path exists and contains @pytest.mark.preflight decorator"
  - "detect_command passes on current clean repo state"
  - "status IN [EMITTED, ALREADY_EXISTS]"

failure_action: |
  If any step fails with HALT:
    Surface violation inline: "DRIFT LOCK EMISSION FAILED — {check_id} — {error}"
    Block audit-fix Stage 8 completion
    Require manual resolution before AC_COMPLETE

integration:
  audit_fix_stage: 8
  wired_via: "detect-fix-rescan-loop.yaml (post-fix hook)"
  invocation: "After each successful gap remediation in CORE-068 convergence loop"
  ordering: "ALWAYS after sweep-catalogue-close.yaml — lock is emitted only when gap is CLOSED"
