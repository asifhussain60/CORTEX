# ============================================================================
# PRIMITIVE: regression-guard-generator
# ============================================================================
# Authority: Phase 106-A (GAP-106-01)
# Tier: 1 (primitive — atomic, reusable)
# Category: testing
# SSOT: cortex-registry/planning/phases/planned/phase-106-rca-guard-certification.yaml
#
# Purpose:
#   After each successful auto-fix in audit-fix Stage 7-8, generate a thin
#   regression guard test at tests/regression/guards/test_guard_{rule_id}.py.
#   The guard re-executes the fix's detect command and asserts zero matches,
#   making the fix self-defending against recurrence.
#
# Wired into: audit-fix-pipeline.yaml Stage 7-8 fix_step.on_success
# ============================================================================

primitive:
  id: "regression-guard-generator"
  name: "Regression Guard Test Generator"
  tier: 1
  category: "testing"
  created: "2026-03-03"
  governance: ["CORE-002", "CORE-008", "CORE-064"]

  description: |
    Generates a Python regression guard test from a template after a successful
    audit auto-fix. The guard asserts that the detect_command returns zero hits,
    preventing silent recurrence of the same violation.

    Generated file: tests/regression/guards/test_guard_{rule_id}.py
    Template: inline Jinja2-style substitution (no external dependency).
    Idempotent: re-generating for the same rule_id overwrites safely.

  parameters:
    - name: rule_id
      type: string
      required: true
      description: "Audit check ID (e.g. 'CORE-035-stale-import'). Used in filename and test name."
    - name: detect_command
      type: string
      required: true
      description: "Shell command that returns 0 matches when clean (e.g. 'grep -r cortex_brain cortex/'). Guard asserts empty output."
    - name: guard_test_path
      type: string
      required: false
      description: "Override output path. Default: tests/regression/guards/test_guard_{rule_id}.py"
    - name: fix_description
      type: string
      required: false
      description: "Human-readable summary of what was fixed. Embedded in guard test docstring."

  guard_test_template: |
    """
    Regression Guard: {rule_id}
    Fix applied: {fix_description}
    Authority: Phase 106-A (GAP-106-01)
    Auto-generated by regression-guard-generator.yaml — DO NOT hand-edit.
    Re-run generation: audit-fix Stage 7-8 on_success hook.
    """
    import subprocess
    from pathlib import Path

    import pytest

    WORKSPACE = Path(__file__).resolve().parents[3]


    class TestGuard_{safe_rule_id}:
        \"\"\"Regression guard: {rule_id} must remain clean after auto-fix.\"\"\"

        def test_{safe_rule_id}_detect_command_returns_zero_matches(self) -> None:
            \"\"\"Assert: detect_command for {rule_id} returns no matches (fix persists).\"\"\"
            result = subprocess.run(
                {detect_command_repr},
                shell=True,
                capture_output=True,
                text=True,
                cwd=str(WORKSPACE),
            )
            output = (result.stdout + result.stderr).strip()
            assert output == "" or result.returncode != 0, (
                f"Regression detected for {rule_id}!\\n"
                f"Detect command returned matches:\\n{{output}}\\n"
                "The auto-fix applied by audit-fix Stage 7-8 has been reversed."
            )

  execution_steps:
    - step: validate_inputs
      action: "Assert rule_id is non-empty and detect_command is non-empty"
    - step: resolve_output_path
      action: |
        If guard_test_path is supplied, use it.
        Else: output_path = tests/regression/guards/test_guard_{safe_rule_id}.py
        where safe_rule_id = re.sub(r'[^a-zA-Z0-9_]', '_', rule_id).lower()
    - step: render_template
      action: "Substitute {rule_id}, {fix_description}, {detect_command_repr}, {safe_rule_id} into guard_test_template"
    - step: write_file
      action: "Write rendered template to output_path (overwrite if exists — idempotent)"
    - step: validate_syntax
      action: "ast.parse(rendered_content) — raises SyntaxError if template rendering is malformed"
    - step: emit_inline
      action: "Print: '✅ Guard generated: {output_path} (rule: {rule_id})' — CORE-002 inline only"

  integration:
    wired_into: "cortex-registry/workflows/templates/audit/audit-fix-pipeline.yaml"
    trigger: "fix_step.on_success — for each fix_log entry with issues_fixed > 0"
    parameters_source: "fix_log entry: {rule_id: check_id, detect_command: check.detect_command, fix_description: fix_log.fix_summary}"
