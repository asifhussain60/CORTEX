# ══════════════════════════════════════════════════════════════════════════════
# DESIGN SYSTEM — IMMUTABLE TOKENS
# ══════════════════════════════════════════════════════════════════════════════
design_system:
  theme: glassmorphism-v4.0
  tokens_file: docs/assets/css/glass-design-tokens.css
  ssot: docs/.content/knowledge/design_system.yaml

  # ── Theme Identity Contract (IMMUTABLE) ────────────────────────────────────
  theme_tokens:
    page_background:
      value: "#030712–#080b14"
      note: deep navy — NEVER light backgrounds
    card_background:
      value: "rgba(10–30, 15–41, 30–59, 0.35–0.7)"
      blur: "backdrop-filter: blur(16–32px)"
      note: NEVER opaque cards
    accent_primary: "#00d4ff"    # electric cyan — ALL pages
    accent_secondary: "#7b61ff"  # indigo violet — ALL pages
    accent_success: "#10b981"    # emerald — positive states, "after" comparisons
    accent_danger: "#f43f5e"     # rose — negative states, "before" comparisons
    border: "rgba(255,255,255,0.06–0.12)"  # glass edge definition
    card_hover: "translateY(-4px–-5px) + border glow + shadow lift"

  # ── Typography (IMMUTABLE) ─────────────────────────────────────────────────
  typography:
    headings:
      font: Inter
      weight: "600–900"
      letter_spacing: "-0.02em"
      word_spacing: "0.04em"
      note: prevents word-fusion at large sizes
    hero_titles:
      font: Space Grotesk
      weight: "700"
      note: geometric, modern, distinctive page identity
    body:
      font: Inter
      weight: "400–500"
    code:
      font: JetBrains Mono
      weight: "400–500"
    forbidden:
      - "Plus Jakarta Sans"   # proven word-fusion at display sizes
      - "any font not in [Inter, Space Grotesk, JetBrains Mono]"

  # ── CDN & Dependency Rules ─────────────────────────────────────────────────
  dependencies:
    tailwind_css:
      cdn: "cdn.tailwindcss.com"
      status: ALLOWED
    d3js:
      version_pin: "7.9.0"
      cdn: "https://d3js.org/d3.v7.min.js"
      status: ALLOWED
      use_case: "interactive charts with tooltips/animations — NOT bar charts"
    lucide_icons:
      status: ALLOWED
    font_awesome:
      status: ALLOWED
      use_case: "index.html landing page only"
    mermaid_js:
      status: BANNED
      reason: "unreadable at role-view scale, no sizing control, poor dark-theme"
    chart_js:
      status: NOT_USED

# ══════════════════════════════════════════════════════════════════════════════
# WCAG FONT SIZE FLOOR RULES — P0 A11Y GATE (IMMUTABLE)
# Authority: WCAG 2.2 Level AA + LearnUI Design accessibility research
# Lesson: LLMs default to compact 8px–12px layouts — enforce floors BEFORE emitting markup
# ══════════════════════════════════════════════════════════════════════════════
wcag_font_floors:
  body_paragraphs:   { min_px: 16, min_rem: "1rem",      recommended: "16–20px",  forbidden: ["text-[12px]","text-[13px]","text-[14px]","0.75rem","0.8rem","0.875rem for body"] }
  card_titles_h3_h4: { min_px: 18, min_rem: "1.125rem",  recommended: "18–24px",  forbidden: ["text-[14px]","text-[16px]","1rem for titles"] }
  section_headings:  { min_px: 24, min_rem: "1.5rem",    recommended: "24–36px",  forbidden: ["text-[18px]","text-[20px] for section heads"] }
  hero_titles_h1:    { min_px: 36, min_rem: "2.25rem",   recommended: "36–56px",  forbidden: ["text-[24px]","text-[28px] for hero"] }
  secondary_muted:   { min_px: 14, min_rem: "0.875rem",  recommended: "14–16px",  forbidden: ["text-[11px]","text-[12px]","0.7rem","0.75rem"] }
  code_blocks:       { min_px: 13, min_rem: "0.8125rem", recommended: "13–15px",  forbidden: ["text-[10px]","text-[11px]","0.65rem","0.7rem"] }
  badge_labels:      { min_px: 11, min_rem: "0.6875rem", recommended: "11–13px",  forbidden: ["text-[8px]","text-[9px]","text-[10px]"] }
  stat_counters:     { min_px: 28, min_rem: "1.75rem",   recommended: "28–48px",  forbidden: ["text-[18px]","text-[20px] for stat numbers"] }
  stat_sub_labels:   { min_px: 11, min_rem: "0.6875rem", recommended: "11–13px",  forbidden: ["text-[8px]","text-[9px]","text-[10px]"] }
  step_numbers:      { min_px: 14, min_rem: "0.875rem",  recommended: "14–18px",  forbidden: ["0.6rem","0.65rem"] }
  list_items:        { min_px: 14, min_rem: "0.875rem",  recommended: "14–16px",  forbidden: ["0.75rem","0.8rem","text-[11px]"] }
  line_height:       { min: 1.5,   note: "WCAG SC 1.4.12 — NEVER leading-none or leading-tight for body" }
  icon_title_ratio:
    rule: "Icons adjacent to card titles MUST be sized proportionally"
    text_lg:  "w-5 h-5 minimum (20px) when title is text-lg (18px)"
    text_xl:  "w-6 h-6 (24px) when title is text-xl (20px+)"
  absolute_floor:
    min_px: 11
    min_rem: "0.6875rem"
    note: "NEVER below this for any visible element"
  use_rem: true   # enables user zoom scaling
  forbidden_always:
    - "text-[8px]"
    - "text-[9px]"
    - "text-[10px]"
    - "text-xs for body copy or descriptions"
    - "font-size below 0.6875rem"

  tailwind_floor_map:
    11px: "text-[11px]"
    13px: "text-[13px]"
    14px: "text-sm"
    16px: "text-base"
    18px: "text-lg"
    20px: "text-xl"
    24px: "text-2xl"
    36px: "text-4xl"

# ══════════════════════════════════════════════════════════════════════════════
# AUTHOR DESIGN PREFERENCES — PERMANENT GOVERNANCE (IMMUTABLE)
# Source: Distilled from design sessions (chat01.md, 2026-03-08)
# These rules are applied automatically — user does not need to re-state them
# ══════════════════════════════════════════════════════════════════════════════
author_preferences:
  # ── Visual Art Style (Immutable) ─────────────────────────────────────────
  art_style:
    aesthetic: "New Yorker cartoon meets Tintin — 2D black & white comic illustration"
    generator: "Gemini Imagen 2"
    aspect_ratio: "16:9 landscape"
    line_work: "Bold confident outlines, cross-hatching for shadows, stipple dots for texture"
    shading: "Ink wash gradients only — no colour fills except wave accent colour"
    photorealism: BANNED
    note: "Every story and architecture image follows this style"

  # ── Character Consistency (P0 — Non-Negotiable) ─────────────────────────
  character_consistency:
    ssot: "docs/awakening-of-cortex/images/story-prompts/CHARACTER-CONSISTENCY-SHEET.md"
    rule: "Every image prompt includes canonical face block. Physical identity is IMMUTABLE."
    characters:
      asif_codenstein:
        identity: "54-year-old eccentric mad scientist, youthful-looking, slightly overweight, funny ADHD hair, bare feet"
        note: "Same face in EVERY prompt"
      miss_g:
        identity: "Indian-Asian beauty, petite curvy, long curly hair, purple glowing hue always"
        outfit_rule: "National dress rotation per chapter — no repeats within same wave"
        outfit_ssot: "CHARACTER-CONSISTENCY-SHEET.md outfit table"
      copilot_bot:
        identity: "Cute robot with transparent brain dome — evolves from infant to adult across 12 chapters"
        evolution: "Ch01-04 empty → Ch05-08 growing → Ch09-10 dense → Ch11 organized → Ch12 full brain"

  # ── Wave-Based Chapter System (Immutable) ─────────────────────────────────
  wave_system:
    wave_0: { name: Origin,     chapters: [1,2,3,4],   hex: "#a78bfa", tailwind: "violet-400" }
    wave_1: { name: Structure,  chapters: [5,6,7,8],   hex: "#67e8f9", tailwind: "cyan-300" }
    wave_2: { name: Resilience, chapters: [9,10],      hex: "#fbbf24", tailwind: "amber-400" }
    wave_3: { name: Autonomy,   chapters: [11],        hex: "#34d399", tailwind: "emerald-400" }
    wave_4: { name: Vision,     chapters: [12],        hex: "#8b5cf6", tailwind: "violet-500" }
    enforcement: "All HTML, CSS, sidebar, story prompts, and image wave accents MUST match"

  # ── Brain Analogy as Master Frame ─────────────────────────────────────────
  brain_analogy:
    rule: "The brain/nervous system is the master metaphor unifying ALL CORTEX content"
    ssot: "docs/awakening-of-cortex/images/story-prompts/BRAIN-REGION-MAPPING.md"
    scope: "Anchor to brain terminology where it adds clarity — do NOT force where unnatural"

  # ── Illustrated Storybook Image Integration ────────────────────────────────
  image_integration:
    figure_class: "ch-arch-img"
    data_attribute: "data-wave"
    alignment: "alternate left/right/center like an illustrated storybook"
    placement_rule: "At contextual narrative moments when concept is being explained — never arbitrary"
    path_convention: "../assets/images/generated/shared/{name}.png relative to chapter render context"
    story_images: "Auto-injected by injectImages() — NEVER add manually"
    alt_text: "Descriptive and accessible — never empty for architecture diagrams"

  # ── Immutable Architecture Concepts ────────────────────────────────────────
  immutable_concepts:
    rule: "All shared architecture image prompts depict concepts that will NOT change with future enhancements"
    mapping:
      - { image: "01-platform-architecture-overview", concept: "5-layer brain anatomy", immutable: true }
      - { image: "02-lens-intelligence-pipeline", concept: "PERCEIVE→REASON→ACT→REMEMBER cycle", immutable: true }
      - { image: "03-principle-selection-system", concept: "Wisdom distillation (90 principles, 10 domains)", immutable: true }
      - { image: "04-brain-architecture-six-domains", concept: "6 brain regions = 6 orchestrator domains", immutable: true }
      - { image: "05-intelligence-diamond-three-tiers", concept: "Skull→Core→Cortex intelligence tiers", immutable: true }
      - { image: "06-governance-shield-defence-in-depth", concept: "Defence-in-depth (3 layers)", immutable: true }
      - { image: "07-tdd-flywheel-cycle", concept: "RED→GREEN→REFACTOR cycle", immutable: true }
      - { image: "08-learning-loop-institutional-memory", concept: "Institutional memory lifecycle", immutable: true }
      - { image: "09-request-journey-intent-to-delivery", concept: "Intent→routing→execution→result", immutable: true }

  # ── Comedy Writing Compliance ──────────────────────────────────────────────
  comedy:
    ssot: "cortex-registry/knowledge/best-practices/content/comedy-writing-principles.yaml"
