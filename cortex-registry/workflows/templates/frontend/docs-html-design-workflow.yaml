    css_files: [same as software-engineer]
  rule: "When working on any page: respect its existing architecture. Inline style= attributes are allowed. Prefer CSS classes for repeating patterns; inline styles for page-specific one-offs."

# ══════════════════════════════════════════════════════════════════════════════
# QUALITY GATES (enforced at every step)
# ══════════════════════════════════════════════════════════════════════════════
gates:
  wcag_font_floor_audit:
    description: "Self-audit all font sizes against wcag_font_floors before emitting HTML"
    severity: P0
    blocking: true
    check: "min(all_font_sizes_px) >= 11"

  card_visual_hierarchy:
    description: "Card titles must be >= 2px larger than card body text"
    severity: P0
    blocking: true

  theme_integrity:
    description: "No light backgrounds, no opaque cards, accent tokens match design_system"
    severity: P0
    blocking: true

  forbidden_typography:
    description: "No Plus Jakarta Sans, no font families outside [Inter, Space Grotesk, JetBrains Mono]"
    severity: P0
    blocking: true

  no_mermaid_in_roles:
    description: "Zero Mermaid.js usage in docs/roles/ views"
    severity: P0
    blocking: true

  no_d3_bar_charts:
    description: "No D3.js horizontal bar charts — use bubble grids or donut charts"
    severity: P1
    blocking: false

  background_clip_pairing:
    description: "-webkit-background-clip: text MUST always be paired with background-clip: text"
    severity: P0
    blocking: true

  css_token_check:
    description: "All new CSS values reference tokens from glass-design-tokens.css"
    severity: P1
    blocking: false
    delegate_to: "design-system-enforcer"

  issa_spacing_gate:
    description: |
      Inter-Section Spacing Algorithm (ISSA) gate. For every pair of adjacent block
      sections in proposed HTML, compute: Visual Gap = pb_A + max(mb_A, mt_B) + pt_B.
      Compare against the target from design_system.yaml § spacing.inter_section_spacing.
      Deviation ±4px → P1 FLAG. Deviation >8px → P0 BLOCK.
    severity: P1
    blocking: false   # P1 default; escalates to P0 when deviation > 8px
    delegate_to: "design-system-enforcer"
    check_id: "Check 9"
    ssot: "docs/.content/knowledge/design_system.yaml § spacing.inter_section_spacing"
    applies_to: ["html_implementation", "design_proposal"]

  a11y_gate:
    description: "WCAG 2.1 AA checklist — block on P0 regressions"
    severity: P0
    blocking: true
    delegate_to: "a11y-perf-guardian"
    source: docs/.content/knowledge/a11y_checklist.yaml

  performance_gate:
    description: "No performance regressions"
    severity: P1
    blocking: false
    delegate_to: "a11y-perf-guardian"
    source: docs/.content/knowledge/performance_checklist.yaml

  regression_guard:
    description: "Diff — no theme drift, no broken links, no removed ARIA landmarks"
    severity: P1
    blocking: true
    delegate_to: "regression-sentinel"

  dom_validation:
    description: "HTML parses without errors; no duplicate IDs or duplicate sections"
    severity: P0
    blocking: true
    delegate_to: "frontend/html-refactor-validation.yaml"

# ══════════════════════════════════════════════════════════════════════════════
# WORKFLOW STEPS — Design + Implement for docs/ HTML/CSS/Web
# ══════════════════════════════════════════════════════════════════════════════
workflow:
  name: CORTEX Docs — HTML/CSS/Web Design + Implement
  description: |
    Unified step chain for building, enhancing, or refactoring any HTML, CSS,
    or static web page under docs/. All design intelligence rules (typography,
    visualisation, layout, WCAG) are encoded in this template — not in the prompt.

  steps:
    # ── Step 0: Role Context Loading (automatic) ──────────────────────────────
    - step_id: role_context_load
      agent: html-view-designer
      description: |
        Auto-detect target role from file path. Load .content/ files per the
        Role → Content Routing Table (SSOT: cortex-doc.prompt.md). Extract
        role-specific propositions, metrics, and value statements. Build a
        structured content brief mapping each section to a .content source.
      triggers:
        - path_matches: "docs/roles/*.html"
        - path_matches: "docs/index.html"
      outputs:
        - content_brief: "structured list of sections → .content source → role angle"
        - target_architecture: "inline_style_block | external_css"
      gate: none  # auto-executes, no user gate

    # ── Step 1: Knowledge Pre-flight ─────────────────────────────────────────
    - step_id: knowledge_preflight
      agent: html-view-designer
      description: |
        Load doc_best_practices.yaml, design_system.yaml, components.yaml.
        Read target HTML file and current CSS files. Validate design_system
        tokens file is reachable. Surface any prior failure patterns via
        cortex_learning op=history scope=documentation (PLIP-001).
      inputs:
        - docs/.content/knowledge/doc_best_practices.yaml
        - docs/.content/knowledge/design_system.yaml
        - docs/.content/knowledge/components.yaml
        - "{{target_html_file}}"
      gates: [theme_integrity, forbidden_typography]

    # ── Step 2: Design Proposal ───────────────────────────────────────────────
    - step_id: design_proposal
      agent: html-view-designer
      description: |
        Propose layout changes, component additions, and structural improvements
        grounded in the content brief (Step 0) and knowledge pre-flight (Step 1).
        Apply all rules from design_system, wcag_font_floors, visualisation,
        and layout sections of THIS workflow before emitting the proposal.
        For every pair of adjacent sections, resolve the ISSA formula (layout §
        inter_section_spacing_algorithm) and confirm the target token is met.
        Present Intent Reflection (🪞) then ⚡ Proceed Gate — wait for proceed.
      gates: [wcag_font_floor_audit, card_visual_hierarchy, issa_spacing_gate]
      outputs: ["design_proposal_doc"]
      proceed_gate: true   # blocks until user says proceed

    # ── Step 3: Token Validation ──────────────────────────────────────────────
    - step_id: token_validation
      agent: design-system-enforcer
      description: |
        Verify all proposed CSS values reference tokens from glass-design-tokens.css.
        Block on any new color/spacing/blur value not in the token file.
      gates: [css_token_check, theme_integrity]

    # ── Step 4: HTML Implementation ───────────────────────────────────────────
    - step_id: html_implementation
      agent: html-view-designer
      description: |
        Implement HTML changes. Use semantic elements, ARIA, and stable DOM hooks.
        Respect page architecture (inline_style_block vs external_css).
        Run WCAG self-audit against wcag_font_floors before emitting any markup.
        Enforce background_clip pairing rule for gradient text.
        Apply ISSA: for every section pair, compute Visual Gap and match to target
        token from design_system.yaml § spacing.inter_section_spacing. Use the
        zero-margin recipe (pb_A + pt_B = Target_px) as default.
      delegate_to: frontend/html-refactor-validation.yaml
      gates: [wcag_font_floor_audit, dom_validation, no_mermaid_in_roles, background_clip_pairing, issa_spacing_gate]

    # ── Step 5: CSS Compliance ────────────────────────────────────────────────
    - step_id: css_compliance
      agent: doc-sync-agent
      description: |
        Enforce CSS architecture for the target page. For external-CSS pages:
        assign styles to the correct CSS layer file. For inline-style pages:
        use inline <style> blocks; extract repeated patterns to CSS classes.
        Run frontend/css-zero-inline-workflow.yaml gate (zero style= attributes).
      delegate_to: frontend/css-zero-inline-workflow.yaml
      gates: [no_d3_bar_charts]

    # ── Step 6: A11y & Performance Gate ──────────────────────────────────────
    - step_id: a11y_perf_gate
      agent: a11y-perf-guardian
      description: |
        Run a11y_checklist.yaml and performance_checklist.yaml. Block on P0
        regressions. Flag P1s as advisory.
      gates: [a11y_gate, performance_gate]

    # ── Step 7: Regression Guard ──────────────────────────────────────────────
    - step_id: regression_guard
      agent: regression-sentinel
      description: |
        Diff HTML/CSS changes. Confirm no theme drift, no broken links, no
        removed ARIA landmarks. Flag P1s for manual review.
      gates: [regression_guard]

    # ── Step 8: Convergence Gate ──────────────────────────────────────────────
    - step_id: convergence_gate
      orchestrator: EnforcementOrchestrator
      description: |
        Rescan all P0/P1 gates. Loop until 0 violations (CORE-068, max 3 cycles).
      delegate_to: primitives/validation/detect-fix-rescan-loop.yaml
      parameters:
        convergence_predicate: "p0_count == 0 AND p1_count == 0"
        max_cycles: 3

    # ── Step 9: Learning Signal ───────────────────────────────────────────────
    - step_id: learning_signal
      description: |
        On success: cortex_learning op=emit signal_type=MILD_REWARD scope=documentation.
        On failure (a11y regression, theme drift, broken links):
          cortex_learning op=emit signal_type=MILD_PUNISHMENT scope=documentation.
      scope_lock: documentation  # PLIP-001 — no cross-domain signal emission

# ══════════════════════════════════════════════════════════════════════════════
# OPERATIONS (entry points)
# ══════════════════════════════════════════════════════════════════════════════
operations:
  build:
    description: "Generate a new HTML view for docs/"
    steps: [knowledge_preflight, design_proposal, token_validation, html_implementation, css_compliance, a11y_perf_gate, convergence_gate, learning_signal]

  enhance:
    description: "Add sections, diagrams, or features to an existing docs/ page"
    steps: [role_context_load, knowledge_preflight, design_proposal, token_validation, html_implementation, css_compliance, a11y_perf_gate, regression_guard, convergence_gate, learning_signal]

  refactor:
    description: "Restructure docs/ HTML/CSS without changing visual output"
    steps: [knowledge_preflight, design_proposal, token_validation, html_implementation, css_compliance, a11y_perf_gate, regression_guard, convergence_gate, learning_signal]

  validate:
    description: "Run all gates against a docs/ HTML file without modification"
    steps: [knowledge_preflight, a11y_perf_gate, regression_guard]

  design_only:
    description: "Propose design with proceed gate — no implementation"
    steps: [role_context_load, knowledge_preflight, design_proposal]

# ══════════════════════════════════════════════════════════════════════════════
# INVOCATION
# ══════════════════════════════════════════════════════════════════════════════
invocation:
  composer: "cortex/orchestrators/workflow/workflow_composer.py"
  intent_routing: FRONTEND
  pre_gate: "primitives/governance/holistic-validation-gate.yaml"
  example: |
    from pathlib import Path
    from cortex.orchestrators.workflow.workflow_composer import WorkflowComposer

    composer = WorkflowComposer(
        template_path=Path(
            "cortex-registry/workflows/templates/frontend/docs-html-design-workflow.yaml"
        )
    )
    result = composer.execute(operation="enhance", context={"target_html_file": "docs/roles/product-owner.html"})

  doc_prompt_delegation: |
    # In cortex-doc.prompt.md — Design + Implement Mode delegates here:
    #
    #   WorkflowComposer → frontend/docs-html-design-workflow.yaml
    #
    # All typography rules, WCAG floors, visualisation strategy, layout patterns,
    # card systems, pipeline steps, feature pills, theme tokens, CDN rules, and
    # page architecture detection live in THIS file — not in the prompt.
    # The prompt references this template; it does not repeat the rules.
