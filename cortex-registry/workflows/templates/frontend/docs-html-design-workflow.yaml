# ══════════════════════════════════════════════════════════════════════════════
# VISUALISATION RULES (MANDATORY)
# ══════════════════════════════════════════════════════════════════════════════
visualisation:
  sdlc_pipeline:
    use: "hand-crafted CSS flexbox phase cards with icons, gate pills, hover-lift"
    never: "Mermaid.js diagrams"
    reason: "Mermaid renders small, no sizing control, poor dark-theme"
  domain_distribution:
    use: "proportional bubble grid (CSS circles, colour-coded, hover-scale)"
    never: "D3.js horizontal bar charts"
    reason: "bar charts are dense; bubbles are intuitive and visually striking"
  before_after:
    use: "split card-pair layout (rose left / emerald right, 2-column)"
    never: "3-column table-row grids with arrow columns"
    reason: "table grids are cramped; card-pairs are readable and mobile-friendly"
  stat_counters:
    use: "animated stat cards with glow borders (count-up animation optional)"
    never: "plain text numbers in paragraphs"
  process_steps:
    use: "numbered glass-card pipeline with connecting CSS line (pseudo-elements)"
    never: "ordered lists <ol>"
  role_perspectives:
    use: "icon + title + description cards in responsive grid"
    never: "bullet lists"
  donut_charts:
    use: "d3.pie() with animated arc entrance via attrTween, center percentage"
    layout: "side-by-side Before (rose/red) | After (emerald/green)"
    legend: "4-column below charts"
    never: "horizontal bar charts for before/after percentage comparisons"

  # ── Responsive Diagram Rules (P0) ─────────────────────────────────────────
  diagram_responsive:
    svg_container:
      width: "100%"
      height: "auto"
      max_width: "1200px"
      margin: "0 auto"
      overflow: "overflow-x: auto — NEVER overflow: hidden"
    breakpoints:
      mobile_max: 480
      tablet_max: 768
      desktop_min: 769
      wide_min: 1280
    mobile_rules:
      - "Horizontal flowcharts rotate to vertical (top-to-bottom)"
      - "Multi-column diagram layouts collapse to single column"
      - "Legends stack below diagram (flex-direction: column)"
      - "SVG font floors increase: node labels 16px, edge labels 14px"
      - "Touch targets minimum 44×44px on all interactive nodes"
      - "Container padding reduces to 1rem"
      - "SVG internal group padding reduces to 12px from viewBox edges"
    tablet_rules:
      - "2-column max layout for side-by-side diagrams"
      - "Font scaling intermediate: node labels 15px, edge labels 13px"
      - "Touch-optimised interactive elements (44×44px min)"
    section_spacing:
      between_diagram_and_text: "2rem (--space-xl), mobile: 1.5rem"
      between_stacked_diagrams: "3rem (--space-2xl), mobile: 2.5rem"
      container_padding: "1.5rem all sides, mobile: 1rem"
      caption_to_next: "1.5rem (--space-lg), mobile: 1rem"
    colour_harmony:
      - "Node fills: rgba() with 0.6–0.8 opacity — never solid"
      - "Edge strokes: 0.3–0.5 opacity — never 1.0"
      - "Glow effects stdDeviation ≤ 4"
      - "Approved triad only: #00d4ff + #7b61ff + #10b981"
      - "Never mix warm/cool accents in same diagram"
      - "Glass borders rgba(255,255,255,0.08–0.15)"

# ══════════════════════════════════════════════════════════════════════════════
# LAYOUT RULES (MANDATORY)
# ══════════════════════════════════════════════════════════════════════════════
layout:
  card_width:          "max-width: 80%; margin: 0 auto"          # NOT 60%
  card_padding:        "padding: 2.5rem 2.25rem"                 # NOT 3rem sides
  section_spacing:     "space-y-16 md:space-y-24"
  icon_size_in_tiles:  "font-size: 2.5rem minimum"              # NOT 1.3rem
  tile_min_max_width:  "min-width: 180px; max-width: 260px"     # NOT 140/180
  body_text_max_width: "max-width: 72ch"
  muted_text_colour:   "#94a3b8"                                  # NOT #64748b (too dim)

  alternating_panels:
    rule: "Alternate sections between transparent and gradient glass panels"
    odd_sections:  "no panel background — content floats on page background"
    even_sections: "gradient glass panel with rounded corners + border"
    implementation:
      wrapper_class: "relative py-12 my-6"
      panel_class: "absolute inset-0 bg-gradient-to-br from-{color}-950/60 via-slate-900/80 to-{color2}-950/60 border border-{color}-500/20 rounded-3xl"
      blur_class: "absolute inset-0 backdrop-blur-sm rounded-3xl"
      content_class: "relative space-y-10 px-4 md:px-8"
    palette:
      panel_a: { gradient: "from-indigo-950/60 via-slate-900/80 to-blue-950/60",   border: "border-indigo-500/20" }
      panel_b: { gradient: "from-purple-950/60 via-slate-900/80 to-violet-950/60", border: "border-purple-500/20" }
      panel_c: { gradient: "from-blue-950/60 via-slate-900/80 to-cyan-950/60",     border: "border-blue-500/20" }
    rules:
      - "rounded-3xl on BOTH background div AND backdrop-blur div"
      - "border (all sides) — NOT border-y (harsh horizontal lines)"
      - "my-6 for vertical spacing between panels"
      - "px-4 md:px-8 inside relative content wrapper"
      - "NEVER -mx-4 md:-mx-6 with rounded corners (breaks soft edge)"
      - "NEVER border-y for panels — always border (all sides)"

  # ── Inter-Section Spacing Algorithm (ISSA) ─────────────────────────────────
  # SSOT: docs/.content/knowledge/design_system.yaml § spacing.inter_section_spacing
  #
  # Visual Gap = padding_bottom_A + max(margin_bottom_A, margin_top_B) + padding_top_B
  #
  # Safe recipe: zero both margins (mb-0, mt-0), then set pb_A = pt_B = Target_px / 2
  # This eliminates CSS margin-collapse ambiguity and produces a deterministic gap.
  #
  inter_section_spacing_algorithm:
    formula: "Visual Gap = pb_A + max(mb_A, mt_B) + pt_B"
    safe_recipe: "mb_A = 0, mt_B = 0 → pb_A + pt_B = Target_px; split evenly"
    non_zero_margin_formula: "required_padding_sum = Target_px - max(mb_A_px, mt_B_px); pb_A = ceil(sum/2), pt_B = floor(sum/2)"
    targets:
      content_to_content:       { token: "--space-2xl", px: 48, tailwind: "pb-6 pt-6" }
      content_to_glass_panel:   { token: "--space-xl",  px: 32, tailwind: "pb-4 pt-4" }
      diagram_to_text:          { token: "--space-xl",  px: 32, tailwind: "mb-8 + pt-8 on next" }
      card_grid_to_section:     { token: "--space-lg",  px: 24, tailwind: "pb-6 pt-0" }
      hero_to_first_section:    { token: "--space-2xl", px: 48, tailwind: "pb-12 + pt-12 on first section" }
      glass_panel_to_glass_panel: { token: "--space-lg", px: 24, tailwind: "my-6 (existing convention)" }
    tailwind_px_map:
      pt-4: 16
      pt-6: 24
      pt-8: 32
      pt-10: 40
      pt-12: 48
      pb-4: 16
      pb-6: 24
      pb-8: 32
      pb-10: 40
      pb-12: 48
      mt-4: 16
      mt-6: 24
      mt-8: 32
      mb-4: 16
      mb-6: 24
      mb-8: 32
      space-y-16: 64
      space-y-24: 96
    enforcement:
      p1_threshold_px: 4   # deviation ±4px → P1 FLAG
      p0_threshold_px: 8   # deviation >8px → P0 BLOCK
      gate: issa_spacing_gate
      delegate_to: design-system-enforcer  # Check 9

  equal_height_cards:
    parent: "flex flex-wrap justify-center items-stretch gap-3 md:gap-6"
    wrapper: "relative group w-[calc(50%-0.5rem)] md:w-56 flex"
    inner:   "glass-card ... w-full flex flex-col justify-center min-h-[120px]"
    rules:
      - "items-stretch forces equal heights"
      - "flex on card wrapper participates in stretch"
      - "NEVER let cards auto-size to content"

  card_border_glow:
    pattern: "Multi-layer: hover glow div + card div with gradient bg and colored border"
    glow_div: "absolute inset-0 bg-gradient-to-br from-{color}-600/20 to-{color2}-600/20 rounded-2xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity"
    card_div: "glass-card p-6 relative border-2 border-{color}-500/30 bg-gradient-to-br from-{color}-950/50 to-slate-900/80 hover:border-{color}-400/50 transition-all"
    semantics:
      primary:   { border: "border-indigo-500/30", bg: "from-indigo-950/50 to-slate-900/80", text: "text-indigo-300" }
      secondary: { border: "border-blue-500/30",   bg: "from-blue-950/50 to-slate-900/80",   text: "text-blue-300" }
      tertiary:  { border: "border-violet-500/30", bg: "from-violet-950/50 to-slate-900/80", text: "text-violet-300" }
      success:   { border: "border-emerald-500/30",bg: "from-emerald-950/50 to-slate-900/80",text: "text-emerald-300" }
      warning:   { border: "border-amber-500/30",  bg: "from-amber-950/50 to-slate-900/80",  text: "text-amber-300" }
      danger:    { border: "border-rose-500/30",   bg: "from-rose-950/50 to-slate-900/80",   text: "text-rose-300" }
    rules:
      - "border-2 (2px) — NOT border (1px too subtle)"
      - "Border opacity /30 at rest, /50 on hover"
      - "Hover glow uses blur-xl with matching color gradient"
      - "transition-all for smooth transitions"
      - "Cards in same section use different colors (visual variety)"

  pipeline_step_cards:
    purpose: "sequential process steps with visual connection and progression"
    badge: "w-12 h-12 rounded-xl gradient fill shadow"
    connector_line: "h-1 gradient matching step colors rounded-full"
    card_accent: "border-t-4 top accent matching step color"
    hover: "-translate-y-2 lift with glow effect"
    color_progression_4step:
      step1: { primary: indigo, secondary: violet }
      step2: { primary: blue,   secondary: cyan }
      step3: { primary: teal,   secondary: emerald }
      step4: { primary: emerald,secondary: green }

  feature_pills:
    purpose: "capability lists — replaces flat bullet lists"
    pattern: "flex items-center gap-2 px-4 py-2 rounded-full bg-gradient-to-r from-{color}-500/10 to-{color2}-500/10 border border-{color}-500/30 text-{color}-300 text-sm font-medium"
    rules:
      - "rounded-full for pill shape"
      - "Gradient background /10 opacity"
      - "Border matching gradient /30 opacity"
      - "icon + text with gap-2"

