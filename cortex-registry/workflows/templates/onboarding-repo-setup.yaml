# Repository Onboarding Workflow Template
# Phase 100 Stage 5
# Onboard new repository with profile generation and security scan

workflow:
  id: "onboarding/repo-setup"
  name: "Repository Onboarding Workflow"
  version: "1.0.0"
  category: "onboarding"
  description: "Full repository onboarding with profile generation and security baseline"

  metadata:
    author: "CORTEX"
    created: "2026-02-16"
    phase: "100"
    stage: "5"

  convergence_gate:
    max_cycles: 3
    success_criteria:
      profile_sections_complete: true
      security_baseline_clean: true
    convergence_predicate: "profile_complete and security_clean"
    backoff_strategy: "none"

  knowledge_context:
    architect_mode:
      onboarding_tool: "cortex_onboard_repository"
      profile_template: "CORTEX profile format"
      security_scan: "P0/P1/P2 issues"
    production_mode:
      onboarding_tool: "cortex_onboard_repository"
      profile_template: "Production profile format"
      security_scan: "{{security_standards}}"

  steps:
    - step_id: "tech_stack_detection"
      name: "Detect Tech Stack"
      orchestrator: "RepositoryOnboardingOrchestrator"
      convergence_gate:
        max_cycles: 2
        success_criteria:
          tech_stack_detected: true
        convergence_predicate: "languages_detected and frameworks_detected"
      params:
        detection_mode: "auto"

    - step_id: "profile_generation"
      name: "Generate Repository Profile"
      orchestrator: "RepositoryOnboardingOrchestrator"
      depends_on: ["tech_stack_detection"]
      convergence_gate:
        max_cycles: 3
        success_criteria:
          profile_sections_complete: true
        convergence_predicate: "all_sections_populated"
      params:
        profile_template: "{{profile_template}}"
        sections: ["tech_stack", "test_frameworks", "architecture_patterns", "deployment"]

    - step_id: "security_baseline_scan"
      name: "Security Baseline Scan"
      orchestrator: "TDDOrchestrator"
      depends_on: ["profile_generation"]
      convergence_gate:
        max_cycles: 5
        success_criteria:
          p0_issues: 0
          p1_issues: 0
        convergence_predicate: "p0_count == 0 and p1_count == 0"
      params:
        scan_type: "security_baseline"
        priorities: ["P0", "P1", "P2"]

    - step_id: "onboarding_verification"
      name: "Verify Onboarding Complete"
      orchestrator: "RepositoryOnboardingOrchestrator"
      depends_on: ["security_baseline_scan"]
      convergence_gate:
        max_cycles: 1
        success_criteria:
          onboarding_complete: true
        convergence_predicate: "profile_saved and baseline_clean"
      params:
        verification_checklist: ["profile", "security", "documentation"]

  epilogues:
    - epilogue_id: "onboarding_report"
      name: "Onboarding Summary Report"
      trigger: "workflow_complete"
      description: "Profile location, security baseline, next steps"
