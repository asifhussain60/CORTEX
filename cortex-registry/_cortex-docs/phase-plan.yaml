---
plan_id: CORTEX-DOCS-001
title: "CORTEX Documentation System Implementation"
version: 1.0
created: 2026-02-15
author: Asif Hussain
authority: PlanOrchestrator + DigestOrchestrator

metadata:
  location: cortex-registry/_cortex-docs
  isolation: standalone (no cortex/ imports)
  tools_used: [cortex_lens_analyze, cortex_git_history, cortex_detect_duplicates]
  deployment: GitHub Pages (static SPA)
  framework: Astro + Tailwind CSS

principles:
  - Build-time extraction (JAMstack pattern)
  - Verbosity preservation (word count enforcement)
  - Multi-role content (Business, PO, Developer)
  - Manual curation gates (baseline + enrichment)
  - Evidence-backed claims (no legal risk)

phases:
  - id: P-001
    name: Foundation & Discovery
    status: planned
    priority: P0
    duration: 4-6 hours
    dependencies: []
    
    stages:
      - id: S-001-001
        name: Discovery Infrastructure
        description: Create discovery pipeline for LENS + git analysis
        effort: 2 hours
        
        tasks:
          - id: T-001-001-001
            name: Create discover.py script
            description: |
              LENS analysis + git history extraction pipeline
              - Scan cortex/ for orchestrators, agents, MCP tools
              - Extract 30-day git timeline with commit clustering
              - Generate YAML baseline with technical inventory
            deliverable: pipeline/discover.py
            validation:
              - Script runs without errors
              - Generates valid YAML output
              - Detects all orchestrators (60+)
              - Detects all MCP tools (86+)
              
          - id: T-001-001-002
            name: Create baseline schema
            description: |
              YAML schema for discovery output
              - Orchestrator catalog (name, purpose, status)
              - MCP tool catalog (signature, intent mapping)
              - Git timeline (phases, key features)
              - Architecture metrics (counts, relationships)
            deliverable: discovery/baseline-schema.yaml
            validation:
              - Schema validates against PyYAML
              - All required fields documented
              
          - id: T-001-001-003
            name: Test discovery cycle
            description: |
              Run discover.py against CORTEX codebase
              - Verify orchestrator detection accuracy
              - Verify MCP tool extraction completeness
              - Confirm git timeline clustering
              - Generate test baseline.yaml
            deliverable: discovery/baseline.yaml (test output)
            validation:
              - All 60+ orchestrators detected
              - All 86+ MCP tools extracted
              - Git timeline covers 30 days
              - No parsing errors

      - id: S-001-002
        name: Multi-Role Templates
        description: Create content templates for 3 audiences
        effort: 3 hours
        
        tasks:
          - id: T-001-002-001
            name: Business Leader template
            description: |
              BLUF (Bottom Line Up Front) template
              - 1200-1500 word structure
              - Decision-focused sections
              - ROI framework required
              - Qualified language enforcement
              - Third-person voice only
            deliverable: templates/business-leader.yaml
            validation:
              - Template includes all BLUF sections
              - Word count guidance clear
              - Qualified language examples provided
              
          - id: T-001-002-002
            name: Product Owner template
            description: |
              Analogy-rich explanatory template
              - 800-1500 word structure
              - Brain/daily life metaphors required
              - Practical scenario examples
              - Value proposition focus
              - Accessible technical language
            deliverable: templates/product-owner.yaml
            validation:
              - Template mandates 2+ analogies
              - Example diversity enforced
              - Technical jargon translation layer
              
          - id: T-001-002-003
            name: Developer template
            description: |
              Technical depth template
              - 800-2000 word structure
              - Architectural context required
              - Implementation patterns included
              - Edge case documentation
              - Best practices with rationale
            deliverable: templates/developer.yaml
            validation:
              - Template covers technical requirements
              - Code example guidelines included
              - Architecture diagram integration
              
          - id: T-001-002-004
            name: Diagram standards
            description: |
              Mermaid-first diagram standards
              - C4 Model hierarchy (Context → Container → Component)
              - Mermaid preferred (text-based, git-friendly)
              - D3.js for complex interactive only
              - YAML frontmatter required
              - Narrative explanation mandatory (200-400 words)
            deliverable: templates/diagram-standards.yaml
            validation:
              - All diagram types documented
              - Metadata requirements clear
              - Narrative guidelines specified

      - id: S-001-003
        name: Verbosity Enforcement Module
        description: Pre-commit hooks for quality validation
        effort: 2 hours
        
        tasks:
          - id: T-001-003-001
            name: Word count validator
            description: |
              Pre-commit hook for word count minimums
              - Business: 1200-1500 words
              - PO: 800-1500 words
              - Developer: 800-2000 words
              - Flag violations, block commit
            deliverable: pipeline/validate-word-count.py
            validation:
              - Correctly parses MD files
              - Calculates word counts accurately
              - Blocks commits below minimums
              
          - id: T-001-003-002
            name: Analogy density checker
            description: |
              Detect analogy presence in content
              - Require 2+ analogies per PO section
              - Keyword detection (brain, hotel, symphony, etc.)
              - Flag thin analogical content
            deliverable: pipeline/validate-analogies.py
            validation:
              - Detects common analogy patterns
              - Reports analogy density per section
              - Suggests improvement when low
              
          - id: T-001-003-003
            name: Example diversity audit
            description: |
              Ensure varied examples across docs
              - Track example domains used
              - Flag repetitive scenarios (e.g., auth 5x)
              - Mandate: e-commerce, DevOps, FinTech, healthcare
            deliverable: pipeline/validate-examples.py
            validation:
              - Tracks examples across all docs
              - Reports domain distribution
              - Flags over-used examples

  - id: P-002
    name: Content Pipeline & Extraction
    status: planned
    priority: P0
    duration: 6-8 hours
    dependencies: [P-001]
    
    stages:
      - id: S-002-001
        name: MD to JSON Extraction
        description: Build-time extraction without content modification
        effort: 3 hours
        
        tasks:
          - id: T-002-001-001
            name: Frontmatter parser
            description: |
              Extract YAML frontmatter from MD files
              - Parse metadata (title, audience, diagrams, etc.)
              - Build content index
              - Generate diagram registry
              - Preserve full prose (read-only)
            deliverable: pipeline/extract-frontmatter.py
            validation:
              - Parses YAML correctly
              - Never modifies source MD
              - Generates valid JSON index
              
          - id: T-002-001-002
            name: Role-based content slicer
            description: |
              Filter content by role tags at build time
              - Extract <!-- role:business --> sections
              - Extract <!-- role:product-owner --> sections
              - Extract <!-- role:developer --> sections
              - Generate role-specific JSON files
            deliverable: pipeline/extract-roles.py
            validation:
              - Correctly identifies role tags
              - Preserves full content per role
              - Generates 3 JSON outputs per doc
              
          - id: T-002-001-003
            name: Diagram registry generator
            description: |
              Auto-generate catalog of all diagrams
              - Collect diagram metadata from frontmatter
              - Link diagrams to content pages
              - Build searchable registry
              - Include diagram type, purpose, audience
            deliverable: pipeline/extract-diagrams.py
            validation:
              - Finds all diagrams across content/
              - Registry includes all metadata fields
              - Links back to source MD files

      - id: S-002-002
        name: Search Index Builder
        description: Full-text search for SPA
        effort: 2 hours
        
        tasks:
          - id: T-002-002-001
            name: Full-text indexer
            description: |
              Generate search index from all content
              - Index headings, paragraphs, code blocks
              - Support role-based filtering
              - Include relevance scoring
            deliverable: pipeline/build-search-index.py
            validation:
              - Indexes all MD content
              - Generates valid search JSON
              - Supports fuzzy matching

      - id: S-002-003
        name: Build Orchestration
        description: Coordinate full extraction pipeline
        effort: 2 hours
        
        tasks:
          - id: T-002-003-001
            name: Build master script
            description: |
              Orchestrate all extraction steps
              - Run discover.py (if baseline stale)
              - Run extract-frontmatter.py
              - Run extract-roles.py
              - Run extract-diagrams.py
              - Run build-search-index.py
              - Output to site/public/data/
            deliverable: pipeline/build.py
            validation:
              - Runs all steps in correct order
              - Handles errors gracefully
              - Outputs to correct location
              - Generates build manifest

  - id: P-003
    name: SPA Architecture (Astro)
    status: planned
    priority: P0
    duration: 8-10 hours
    dependencies: [P-002]
    
    stages:
      - id: S-003-001
        name: Astro Project Setup
        description: Initialize Astro framework with Tailwind
        effort: 2 hours
        
        tasks:
          - id: T-003-001-001
            name: Astro initialization
            description: |
              Create Astro project in site/ directory
              - npm create astro@latest
              - Install Tailwind CSS integration
              - Configure dark glassmorphism theme
              - Set up TypeScript support
            deliverable: site/ (initialized project)
            validation:
              - npm run dev works
              - Tailwind CSS active
              - TypeScript compiles
              
          - id: T-003-001-002
            name: Content collections setup
            description: |
              Configure Astro content collections
              - Define content schemas
              - Map to extracted JSON data
              - Enable type-safe content queries
            deliverable: site/src/content/config.ts
            validation:
              - Collections defined for all content types
              - Schema validation works
              - Content queries type-safe

      - id: S-003-002
        name: Component Development
        description: Build reusable UI components
        effort: 4 hours
        
        tasks:
          - id: T-003-002-001
            name: Diagram renderer component
            description: |
              Universal diagram renderer
              - Detect diagram type (mermaid vs D3)
              - Render mermaid with mermaid.js
              - Render D3 with lazy-loaded library
              - Include diagram metadata display
            deliverable: site/src/components/DiagramRenderer.astro
            validation:
              - Renders mermaid diagrams
              - Renders D3 visualizations
              - Shows metadata (purpose, audience)
              
          - id: T-003-002-002
            name: Role switcher component
            description: |
              Toggle between Business/PO/Developer views
              - Persistent role selection (localStorage)
              - Smooth content transitions
              - Visual indicator of active role
            deliverable: site/src/components/RoleSwitcher.astro
            validation:
              - Role selection persists
              - Content updates correctly
              - Accessible (keyboard nav)
              
          - id: T-003-002-003
            name: Search component
            description: |
              Full-text search interface
              - Query search index JSON
              - Highlight matches
              - Role-filtered results
            deliverable: site/src/components/Search.astro
            validation:
              - Search returns relevant results
              - Highlighting works
              - Role filtering accurate

      - id: S-003-003
        name: Page Templates
        description: Route-based page layouts
        effort: 3 hours
        
        tasks:
          - id: T-003-003-001
            name: Feature page template
            description: |
              Template for feature documentation
              - Load content from JSON
              - Render role-specific sections
              - Include related diagrams
              - Show related content links
            deliverable: site/src/layouts/FeatureLayout.astro
            validation:
              - Loads content correctly
              - Role switching works
              - Diagrams render properly
              
          - id: T-003-003-002
            name: Architecture page template
            description: |
              Template for architecture guides
              - Multi-diagram support
              - C4 Model navigation
              - Technical depth emphasis
            deliverable: site/src/layouts/ArchitectureLayout.astro
            validation:
              - Multiple diagrams render
              - C4 navigation clear
              - Content hierarchy maintained
              
          - id: T-003-003-003
            name: Business guide template
            description: |
              Template for BLUF guides (CTOs)
              - Executive summary prominent
              - ROI framework visible
              - Decision points highlighted
            deliverable: site/src/layouts/BusinessGuideLayout.astro
            validation:
              - BLUF structure clear
              - Executive-focused layout
              - Mobile responsive

  - id: P-004
    name: Quality Assurance & Validation
    status: planned
    priority: P1
    duration: 4-6 hours
    dependencies: [P-003]
    
    stages:
      - id: S-004-001
        name: Automated Testing
        description: CI/CD quality gates
        effort: 3 hours
        
        tasks:
          - id: T-004-001-001
            name: Link validator
            description: |
              Check all internal/external links
              - Verify cross-references work
              - Flag broken external links
              - Validate anchor links
            deliverable: pipeline/validate-links.py
            validation:
              - Finds all links in MD files
              - Reports broken links
              - Checks anchor existence
              
          - id: T-004-001-002
            name: Metric accuracy validator
            description: |
              Verify metrics match implementation
              - Check orchestrator counts vs wiring
              - Check MCP tool counts vs cortex_tools.py
              - Flag stale metrics
            deliverable: pipeline/validate-metrics.py
            validation:
              - Compares docs to source code
              - Reports discrepancies
              - Auto-fixable where possible
              
          - id: T-004-001-003
            name: Rendering validator
            description: |
              Test SPA rendering in CI
              - Build site with test data
              - Verify all routes render
              - Check for console errors
            deliverable: .github/workflows/validate-docs.yml
            validation:
              - Runs on every PR
              - Catches rendering errors
              - Validates build artifacts

      - id: S-004-002
        name: Manual Review Checklist
        description: Human quality gates
        effort: 2 hours
        
        tasks:
          - id: T-004-002-001
            name: Baseline review checklist
            description: |
              Review baseline.yaml for completeness
              - All major features covered?
              - Git timeline accurate?
              - Orchestrator descriptions clear?
            deliverable: discovery/baseline-review-checklist.md
            validation:
              - Checklist comprehensive
              - Decision criteria clear
              
          - id: T-004-002-002
            name: Content enrichment checklist
            description: |
              Review generated content quality
              - Word counts meet targets?
              - Analogies present (2+ per section)?
              - Examples diverse (not all auth)?
              - Narrative flow evident?
            deliverable: content/enrichment-checklist.md
            validation:
              - Checklist covers all quality dimensions
              - Sign-off process defined

  - id: P-005
    name: CORTEX Tool Integration
    status: planned
    priority: P1
    duration: 3-4 hours
    dependencies: [P-004]
    
    stages:
      - id: S-005-001
        name: MCP Tool Wrappers
        description: Optional CORTEX tool integration
        effort: 2 hours
        
        tasks:
          - id: T-005-001-001
            name: cortex_doc_refresh wrapper
            description: |
              MCP tool to trigger discovery + generation
              - Invoke discover.py via subprocess
              - Generate baseline.yaml
              - Optionally trigger content generation
              - Return baseline for review
            deliverable: cortex/mcp/doc_refresh_tool.py (if needed)
            validation:
              - Tool registers with MCP server
              - Invokes discovery correctly
              - Returns structured output
              - Note: Optional integration, not required
              
          - id: T-005-001-002
            name: cortex_doc_validate wrapper
            description: |
              MCP tool to run validation suite
              - Run all validators (links, metrics, rendering)
              - Return quality report
            deliverable: cortex/mcp/doc_validate_tool.py (if needed)
            validation:
              - Runs all validators
              - Generates comprehensive report
              - Note: Optional integration, not required

      - id: S-005-002
        name: Deployment Configuration
        description: GitHub Pages setup
        effort: 1 hour
        
        tasks:
          - id: T-005-002-001
            name: GitHub Actions workflow
            description: |
              CI/CD for automatic deployment
              - Trigger on push to main
              - Run build pipeline
              - Deploy to GitHub Pages
            deliverable: .github/workflows/deploy-docs.yml
            validation:
              - Workflow triggers correctly
              - Build succeeds
              - Site deploys successfully

success_criteria:
  - Discovery pipeline detects 60+ orchestrators
  - Discovery pipeline extracts 86+ MCP tools
  - All content meets word count minimums
  - All diagrams have YAML frontmatter
  - Search functionality works
  - Role switching persists preference
  - Site builds without errors
  - All links validate successfully
  - Manual review checklists completed

risks:
  - risk: Verbosity loss during automation
    mitigation: Pre-commit hooks + manual review gates
    
  - risk: Content drift from implementation
    mitigation: Metric validators + discovery re-runs
    
  - risk: Diagram sprawl (too many diagrams)
    mitigation: Diagram registry + purpose validation
    
  - risk: Example repetition (auth overload)
    mitigation: Example diversity audit

notes:
  - This system is ISOLATED from cortex/ package (no direct imports)
  - May use CORTEX MCP tools for discovery (cortex_lens_analyze, etc.)
  - Content lives in cortex-registry/_cortex-docs/ (not cortex/)
  - SPA deployment is independent of CORTEX runtime
  - Manual curation gates prevent quality loss
  - Build-time extraction preserves verbosity

next_steps:
  - Execute Phase 1: Run discovery cycle
  - Manual review: Baseline approval (5-10 min)
  - Execute Phase 2: Build content pipeline
  - Execute Phase 3: Set up Astro SPA
  - Execute Phase 4: Run validation suite
  - Execute Phase 5: Deploy to GitHub Pages
