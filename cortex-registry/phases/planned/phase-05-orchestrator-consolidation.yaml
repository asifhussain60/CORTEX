---
metadata:
  id: phase-05-orchestrator-consolidation
  name: "CORTEX Phase 05: Orchestrator Consolidation"
  version: 2.0.0  # v2: Includes tolerance bands, pre-flight, efficiency tracking
  created: '2026-02-19'
  updated: '2026-02-19'
  branch: CORTEX-GPT
  status: planned
  owner: asifhussain60
  orchestrator: OrchestratorConsolidationOrchestrator
  
  # Lessons learned from Phase 0-4:
  # 1. Use tolerance bands instead of hardcoded thresholds
  # 2. Implement pre-flight validation to catch config issues early
  # 3. Use character classes in regex patterns
  # 4. Create immutable test fixtures for state transitions
  # 5. Track efficiency metrics (iterations, config loads, threshold misses)

# ============================================================================
# PHASE SPECIFICATION
# ============================================================================

phase:
  id: phase-05
  title: "Orchestrator Consolidation — Reduce 120+ → 44 Canonical Classes"
  description: |
    Consolidate scattered orchestrator implementations (120+ classes across
    orchestrators/, domain_orchestrators/, and legacy brain/) into 44 canonical
    orchestrator classes following OrchestratorBase lifecycle. Eliminate duplicates,
    merge variants, and establish single source-of-truth for each domain.
  
  # Estimates based on Phase 0-4 learning:
  # Phase 0 (FileFactory): 1h 15m actual
  # Phase 1-3: ~1.5h each
  # Phase 4 (Brain Migration): 2.5h actual
  # Phase 5 should follow similar pattern: 3h est, 1-2 iterations likely
  
  timeline:
    estimated_duration_hours: 3.0
    estimated_iterations: 2  # Set to 2 due to high complexity
    estimated_tolerance_iterations: [1, 3]  # Could be 1 or 3
    
  priority: P0
  risk_level: high
  
  # Dependencies from master plan
  dependencies:
    - phase-01  # Status: complete ✓
    - phase-02  # Status: complete ✓
    - phase-03  # Status: complete ✓
    - phase-04  # Status: complete ✓
  
  # ========================================================================
  # PRE-FLIGHT VALIDATION CHECKLIST (NEW in v2)
  # ========================================================================
  
  pre_flight_validation:
    enabled: true
    description: "Validate prerequisites before RED stage execution"
    failure_handling:
      BLOCK: "Do not proceed to RED stage"
      WARN: "Proceed but flag for manual review"
    
    checks:
      PF-001:
        description: "OrchestratorBase class is importable and inheritable"
        command: "python3 -c 'from cortex.core.orchestrator_base import OrchestratorBase'"
        failure_action: BLOCK
        estimated_duration_sec: 2
      
      PF-002:
        description: "All Python files in orchestrators/ compile without syntax errors"
        command: "python3 -m py_compile cortex/orchestrators/**/*.py"
        failure_action: BLOCK
        estimated_duration_sec: 5
      
      PF-003:
        description: "Orchestrator discovery script runs without errors"
        command: "python3 -c 'from cortex.lens.orchestrator_discovery import discover_orchestrators; discover_orchestrators()'"
        failure_action: WARN
        estimated_duration_sec: 10
      
      PF-004:
        description: "Registry YAML for orchestrator taxonomy is valid"
        command: "python3 -c \"import yaml; yaml.safe_load(open('cortex-registry/core/orchestrator-taxonomy.yaml'))\""
        failure_action: BLOCK
        estimated_duration_sec: 2
      
      PF-005:
        description: "No hardcoded thresholds in phase spec (use tolerance bands)"
        check_type: schema_validation
        validator: "tolerance_bands_present"
        failure_action: WARN
        estimated_duration_sec: 1
    
    total_estimated_time_sec: 20
    
    # If all BLOCK checks pass, proceed to RED stage
    completion_criterion: "All BLOCK checks must pass; WARN checks logged"

  # ========================================================================
  # SPECIFICATIONS WITH TOLERANCE BANDS (NEW in v2)
  # ========================================================================
  
  specifications:
    description: "Target metrics with ±tolerance bands to prevent false RED failures"
    
    targets:
      orchestrator_classes:
        description: "Total canonical orchestrator classes (post-consolidation)"
        target: 44
        rationale: |
          Current: 120+ scattered classes
          Goal: 44 canonical classes (unique domain + intent)
          Tolerance: ±13% (35-50) to account for discovery variance
        
        tolerance:
          low: 35    # -20% acceptable (might consolidate more)
          mid: 44    # canonical target
          high: 50   # +13% acceptable (if splitting needed)
        
        validation_rule: "low <= actual <= high"
        warning_if_exceeds: 48  # Warn at 48+ (consolidation not aggressive enough)
        
        measurement_method: |
          python3 << 'EOF'
          from cortex.lens.orchestrator_discovery import discover_orchestrators
          orchestrators = discover_orchestrators()
          canonical_classes = [o for o in orchestrators if o.is_canonical]
          print(len(canonical_classes))
          EOF
      
      duplicate_implementations:
        description: "Number of duplicate orchestrator implementations found"
        target: 0
        tolerance: {low: 0, high: 0}  # ZERO tolerance for duplicates
        validation_rule: "actual == 0"
      
      consolidation_ratio:
        description: "Ratio of consolidated classes to original (44/120)"
        target: 0.367
        tolerance: {low: 0.33, high: 0.42}  # ±10% band
        warning_if_below: 0.35  # Warn if not consolidating enough
      
      import_rewrites:
        description: "Number of import statements rewritten (orchestrator imports)"
        target: 85
        tolerance: {low: 75, high: 100}  # ±15% band
        rationale: "Each canonical class may require ~1-2 import rewrite locations"
      
      lifecycle_compliance:
        description: "Percentage of orchestrators following 5-step lifecycle"
        target: 100
        tolerance: {low: 95, high: 100}
        validation_rule: "actual >= 95"

  # ========================================================================
  # DELIVERABLES
  # ========================================================================
  
  deliverables:
    D1:
      id: D1
      title: "Orchestrator Taxonomy & Consolidation Map"
      description: |
        YAML specification of all 44 canonical orchestrator classes with:
        - Unique domain + intent identifier
        - Source location (pre-consolidation)
        - Target canonical location (post-consolidation)
        - Lifecycle stage (active, dormant, deprecated)
        - Duplicates merged (source classes consolidated)
      
      file_path: "cortex-registry/core/orchestrator-taxonomy.yaml"
      acceptance_criteria:
        - "44 canonical classes defined"
        - "Each class has unique (domain, intent) pair"
        - "Zero duplicate intent values"
        - "All duplicates documented (which classes merged)"
        - "Lifecycle tags: active | dormant | deprecated"
      
      estimated_lines: 300
      estimated_effort_hours: 0.5
    
    D2:
      id: D2
      title: "Orchestrator Consolidation Test Suite"
      description: |
        Comprehensive RED → GREEN test suite validating consolidation:
        - Discovers all 44 canonical classes
        - Verifies 5-step lifecycle implementation
        - Tests import rewriting (legacy → canonical)
        - Validates zero duplicates
        - Checks lifecycle compliance
      
      file_path: "tests/unit/phases/refactor/test_phase_05_orchestrator_consolidation.py"
      acceptance_criteria:
        - "40+ test methods (RED stage)"
        - "All tests PASSING (GREEN stage)"
        - "Tolerance bands integrated into assertions"
        - "Separates pre/post consolidation fixtures"
      
      estimated_lines: 400
      estimated_effort_hours: 1.0
    
    D3:
      id: D3
      title: "OrchestratorConsolidation Executor"
      description: |
        Autonomous orchestrator that consolidates 120+ classes → 44 canonical:
        - Reads orchestrator-taxonomy.yaml
        - Moves files to canonical locations
        - Rewrites imports (legacy → canonical)
        - Archives deprecated classes
        - Updates test imports
      
      file_path: "cortex/orchestrators/domain/orchestrator_consolidation_executor.py"
      acceptance_criteria:
        - "Zero manual errors during consolidation"
        - "All imports rewritten correctly"
        - "No breaking changes to existing code"
        - "Stats dict returned (not logging in executor)"
      
      estimated_lines: 250
      estimated_effort_hours: 1.0
    
    D4:
      id: D4
      title: "Consolidated Orchestrator Modules (44 classes)"
      description: |
        Refactored 44 canonical orchestrator classes in:
        - cortex/orchestrators/domain/
        - cortex/orchestrators/infrastructure/
        - cortex/orchestrators/governance/
        - Each class extends OrchestratorBase
        - Each implements 5-step lifecycle
      
      acceptance_criteria:
        - "44 canonical classes implemented"
        - "Each has setup(), govern(), execute(), validate(), teardown()"
        - "Type hints on all methods"
        - "Docstrings on all public methods"
        - "100% test coverage"
      
      estimated_lines: 2500
      estimated_effort_hours: 1.0
  
  total_estimated_effort: 3.5 hours

  # ========================================================================
  # ANTI-PATTERNS TO AVOID (NEW in v2)
  # ========================================================================
  
  anti_patterns_to_check:
    AP-001:
      pattern: "Hardcoded thresholds without tolerance bands"
      wrong_example: |
        target_classes = 44
        assert discovered_count == 44  # Brittle!
      
      right_example: |
        assert 35 <= discovered_count <= 50  # Tolerance band
      
      check_script: "grep -n 'assert.*==' tests/unit/phases/refactor/test_phase_05*.py"
    
    AP-002:
      pattern: "Orchestrator classes without 5-step lifecycle"
      wrong_example: |
        class MyOrchestrator:
          def execute(self): pass
      
      right_example: |
        class MyOrchestrator(OrchestratorBase):
          def setup(self): pass
          def govern(self): pass
          def execute(self): pass
          def validate(self): pass
          def teardown(self): pass
      
      check_script: "grep -l 'class.*Orchestrator' cortex/orchestrators/**/*.py | xargs grep -L 'def setup\\|def teardown'"
    
    AP-003:
      pattern: "Import rewrites without validation"
      wrong_example: "sed -i 's/from cortex.brain/from cortex/g' *.py"
      right_example: "Executor module with import_map validation + test verification"
      check_script: "grep -c 'import_rewrites.*validated' tests/unit/phases/refactor/test_phase_05*.py"

  # ========================================================================
  # TEST SPECIFICATIONS (RED → GREEN → REFACTOR)
  # ========================================================================
  
  test_specifications:
    
    red_stage:
      description: "Failing tests that define consolidation requirements"
      expected_status: "ALL FAIL (before implementation)"
      test_categories:
        - category: "Discovery & Counting"
          test_count: 5
          examples:
            - "test_discover_all_orchestrators_120_plus"
            - "test_count_canonical_classes_target_44"
            - "test_identify_duplicate_implementations"
            - "test_classify_lifecycle_active_dormant_deprecated"
            - "test_consolidation_ratio_meets_target"
        
        - category: "Lifecycle Compliance"
          test_count: 7
          examples:
            - "test_all_canonical_extend_orchestrator_base"
            - "test_all_classes_implement_setup_method"
            - "test_all_classes_implement_govern_method"
            - "test_all_classes_implement_execute_method"
            - "test_all_classes_implement_validate_method"
            - "test_all_classes_implement_teardown_method"
            - "test_lifecycle_methods_have_type_hints"
        
        - category: "Import Rewriting"
          test_count: 4
          examples:
            - "test_legacy_orchestrator_imports_discovered"
            - "test_import_rewrite_map_generated"
            - "test_all_imports_rewritten_correctly"
            - "test_no_stale_references_to_legacy_locations"
        
        - category: "Taxonomy Validation"
          test_count: 6
          examples:
            - "test_orchestrator_taxonomy_yaml_valid"
            - "test_taxonomy_has_all_44_classes"
            - "test_taxonomy_no_duplicate_intents"
            - "test_taxonomy_domain_field_populated"
            - "test_taxonomy_consolidation_notes_present"
            - "test_taxonomy_lifecycle_tags_valid"
        
        - category: "Pre-Consolidation Inventory"
          test_count: 3
          examples:
            - "test_count_current_orchestrator_files_120_plus"
            - "test_count_current_orchestrator_classes_120_plus"
            - "test_identify_all_duplicates_pre_consolidation"
        
        - category: "Regression & Safety"
          test_count: 5
          examples:
            - "test_no_breaking_changes_to_imports"
            - "test_all_existing_tests_still_pass"
            - "test_no_circular_imports_after_consolidation"
            - "test_orchestrator_discovery_still_works"
            - "test_archive_contains_deprecated_classes"
      
      total_test_count: 30
      
      execution_command: |
        python3 -m pytest tests/unit/phases/refactor/test_phase_05_orchestrator_consolidation.py \
          -v --tb=short -x
      
      expected_result: "30 FAILED, 0 PASSED (all tests RED — this is correct)"
    
    green_stage:
      description: "All tests passing after consolidation implementation"
      expected_status: "ALL PASS (after implementation + integration)"
      test_count: 30
      execution_command: |
        python3 -m pytest tests/unit/phases/refactor/test_phase_05_orchestrator_consolidation.py \
          -v --tb=short
      
      expected_result: "30 PASSED, 0 FAILED"
      
      # New in v2: Tolerance band assertions
      tolerance_assertions:
        - "35 <= discovered_canonical_count <= 50"
        - "75 <= import_rewrites_count <= 100"
        - "duplicate_count == 0"
        - "lifecycle_compliance >= 95%"
    
    refactor_stage:
      description: "Code quality improvements while tests remain green"
      improvements:
        - "Extract common lifecycle patterns into mixins"
        - "Add observability hooks to each orchestrator"
        - "Optimize import resolution performance"
        - "Document consolidation decisions in docstrings"

  # ========================================================================
  # EFFICIENCY TRACKING (NEW in v2)
  # ========================================================================
  
  efficiency_metrics:
    purpose: |
      Track iterations, debug cycles, and threshold misses to improve
      Phase 6-10 execution efficiency.
    
    tracked_metrics:
      red_iterations:
        description: "How many times were RED tests changed?"
        target: 1
        baseline_from_phases_0_4: 1.2
      
      green_iterations:
        description: "How many times was GREEN implementation revised?"
        target: 1
        baseline_from_phases_0_4: 1.4
      
      config_loads_failed:
        description: "How many config auto-load issues encountered?"
        target: 0
        baseline_from_phases_0_4: 1
      
      threshold_misses:
        description: "How many spec thresholds were off?"
        target: 0
        baseline_from_phases_0_4: 1
        improvement_mechanism: "Tolerance bands added in v2"
      
      import_errors:
        description: "How many import rewrites failed?"
        target: 0
        baseline_from_phases_0_4: 0
      
      fixture_state_mutations:
        description: "How many test fixtures broke due to state changes?"
        target: 0
        baseline_from_phases_0_4: 1
        improvement_mechanism: "Immutable fixtures added in v2"
      
      total_debug_time:
        unit: minutes
        target: 0
        baseline_from_phases_0_4: 50
        improvement_target: 0  # Should need no debugging with v2 improvements
    
    # These metrics feed into next phase (Phase 6) planning
    improvement_recommendations:
      - |
        If threshold_misses > 0: Expand tolerance band for Phase 6
      - |
        If config_loads_failed > 0: Check for missing auto-load in base class
      - |
        If fixture_state_mutations > 0: Review test fixture design in Phase 6

# ============================================================================
# EXECUTION TIMELINE
# ============================================================================

execution_timeline:
  
  stage_1_pre_flight:
    name: "Pre-Flight Validation"
    duration_minutes: 2
    steps:
      - "Display Phase 05 Definition of Ready"
      - "Run 5 pre-flight checks (expect 20 sec total)"
      - "Prompt user: 'Proceed to RED stage?'"
    
    user_action_required: "Type 'proceed' to continue"
  
  stage_2_red:
    name: "TDD RED Phase"
    duration_minutes: 20
    steps:
      - "Write 30 failing tests"
      - "Display test results (expect 30 FAILED)"
      - "Show RED tests vs GREEN baseline"
    
    user_action_required: "Type 'implement' to begin GREEN stage"
  
  stage_3_green:
    name: "TDD GREEN Phase"
    duration_minutes: 100
    steps:
      - "Create orchestrator-taxonomy.yaml (500 lines, 30 min)"
      - "Implement OrchestratorConsolidationExecutor (250 lines, 40 min)"
      - "Consolidate 120+ → 44 canonical classes (100 min)"
      - "Rewrite 85 imports (15 min)"
      - "Run all tests (expect 30 PASSED)"
    
    user_action_required: "Type 'refactor' to begin REFACTOR stage"
  
  stage_4_refactor:
    name: "Refactoring & Optimization"
    duration_minutes: 30
    steps:
      - "Extract lifecycle mixins"
      - "Add observability hooks"
      - "Optimize imports"
      - "Document decisions"
      - "Run regression suite (expect 0 new failures)"
    
    user_action_required: "Type 'commit' to finalize Phase 05"
  
  stage_5_validation:
    name: "Validation & Registry Sync"
    duration_minutes: 10
    steps:
      - "Update cortex-refactor-master.yaml with Phase 05 completion"
      - "Record efficiency metrics"
      - "Generate recommendations for Phase 06"
      - "Display session summary"
    
    user_action_required: "Review metrics; approve Phase 06 next"

---

