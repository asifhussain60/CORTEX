# ============================================================================
# DEFINITION OF DONE (DoD) - Universal Criteria
# ============================================================================

dod_universal:
  audit_trail:
    - "AC_START marker present for each operation"
    - "AC_COMPLETE marker present"
    - "Sequence correct (START before COMPLETE)"
    - "No orphaned markers"
  
  tracing:
    - "trace_interaction table populated"
    - "SQLite query returns expected rows"
    - "Timestamp fields in ISO 8601 format"
  
  performance:
    - "Simple scenarios: <2s"
    - "Medium scenarios: <3s"
    - "Complex scenarios: <5s"
    - "No performance regressions vs baseline"
  
  error_handling:
    - "Graceful degradation on component failures"
    - "Error messages user-friendly"
    - "Audit trail logs errors"
  
  idempotency:
    - "Run 3 times → same result"
    - "No side effects in test mode"
    - "Deterministic output"
  
  test_coverage:
    - "≥95% coverage for golden paths"
    - "Coverage report generated"
    - "No untested critical paths"
  
  documentation:
    - "Scenario YAML has description"
    - "Test has docstring"
    - "Inline comments for complex logic"

# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  - id: "RISK-001"
    description: "Test explosion (unmaintainable)"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation: >
      Use YAML scenarios for reusability. Parameterized tests reduce
      duplication. Lock scope to 25 scenarios — Phase 52 for extensions.
  
  - id: "RISK-002"
    description: "Test flakiness"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation: >
      Fixed random seeds, deterministic mocks, retry logic for I/O.
      Golden test framework already handles this.
  
  - id: "RISK-003"
    description: "Performance (tests take >10 min)"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation: >
      Parallel execution via pytest-xdist. Selective runs for CI.
      Categorize tests: smoke (5 tests), integration (10 tests), full (25 tests).
  
  - id: "RISK-004"
    description: "Scope creep (never-ending additions)"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation: >
      Lock to 25 scenarios in Phase 51. Create Phase 52 for additional
      scenarios (domain-specific tests, edge cases).
  
  - id: "RISK-005"
    description: "LLM non-determinism"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation: >
      Fixed prompts, temperature=0, snapshot testing for LLM outputs.
