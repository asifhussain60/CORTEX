# ============================================================================
# PROBLEM STATEMENT
# ============================================================================
problem:
  summary: >
    CORTEX lacks comprehensive end-to-end integration tests that validate
    the FULL request pipeline: MCP → MasterOrchestrator → all subsystems
    (LENS, CCL, governance, company YAMLs, LLM synthesis). Current tests
    are component-level (unit/integration) but don't validate holistic
    system behavior on every turn.

  root_cause: >
    Testing strategy focused on isolated orchestrator testing rather than
    full pipeline validation. InteractionOrchestrator tests exist but don't
    validate:
    - CCL pre-warming integration
    - Company YAML loading and synthesis
    - Multi-domain knowledge integration
    - Governance enforcement across all stages
    - LLM synthesis quality
    - Threat modeling completeness
    - Blind spot detection
    - Security and quality concern identification

  impact: "HIGH"
  risk_level: "CRITICAL"
  affected_components:
    - "MasterOrchestrator (4-stage pipeline)"
    - "InteractionOrchestrator (Stage 1)"
    - "RequestRephraseOrchestrator (Stage -1)"
    - "CCL (Context Crystallization Layer)"
    - "LENSOrchestrator (code intelligence)"
    - "EnforcementOrchestrator (governance)"
    - "HolisticValidationOrchestrator (Phase 48)"
    - "Company domain YAMLs (cortex-registry/company/)"

  business_context: >
    Every user request should benefit from CORTEX's full intelligence:
    LENS analysis, domain best practices, governance rules, security
    scanning, threat modeling, and intelligent synthesis. Without
    holistic testing, we risk:
    - Subsystem integration failures in production
    - Incomplete data synthesis (missing LENS or domain knowledge)
    - Governance bypasses (CCL cache misses)
    - Performance regressions (CCL not pre-warming)
    - Security gaps (threat modeling not triggered)

# ============================================================================
# SOLUTION ARCHITECTURE
# ============================================================================
solution:
  approach: "Golden Test Framework for Full Pipeline Validation"
  
  design_principles:
    - "Test entire MCP → MasterOrchestrator → execution flow"
    - "Validate ALL subsystems engaged on appropriate requests"
    - "Progressive complexity: simple → medium → complex scenarios"
    - "Deterministic: fixed seeds, stable ordering, idempotent"
    - "Audit trail validation: AC_START → AC_COMPLETE markers"
    - "Performance baselines: <2s simple, <5s complex"

  test_structure:
    location: "tests/golden/holistic_integration/"
    files:
      - "scenarios/*.yaml (25 YAML scenario definitions)"
      - "test_holistic_integration_simple.py (S01-S10)"
      - "test_holistic_integration_medium.py (S11-S20)"
      - "test_holistic_integration_complex.py (S21-S25)"
      - "fixtures/holistic_integration_harness.py"

  golden_test_count: 25
  test_tiers:
    - tier: "Simple (S01-S10)"
      description: "Single component validation"
      scenarios: 10
      
    - tier: "Medium (S11-S20)"
      description: "Multi-component integration"
      scenarios: 10
      
    - tier: "Complex (S21-S25)"
      description: "Holistic system validation"
      scenarios: 5

