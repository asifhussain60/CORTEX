# Secure Coding Practices
# Authority: AC-PHASE65-S1-001 | Enhanced: Phase-79 SDLC Intelligence Engine
# Company Context: security-standards.yaml + payment-security.yaml + owasp-top10.yaml

title: "Secure Coding Practices"
category: "security"
updated: "2026-02-25"

# ── OWASP Top 10 Mitigations (mapped to company standards) ───────────────────
owasp_mitigations:
  A01_broken_access_control:
    description: "Enforce RBAC on every request — no client-side-only checks"
    company_standard: "See security-standards.yaml authorization block"
    test: "Write 403 test for each role boundary"
  A02_cryptographic_failures:
    description: "AES-256 at rest, TLS 1.3+ in transit — no SHA1/MD5"
    company_standard: "See security-standards.yaml data-protection block"
  A03_injection:
    description: "Parameterised queries only — no string concatenation in SQL/NoSQL"
    test: "SQLi fuzz test on every user-input endpoint"
  A07_auth_failures:
    description: "OAuth2+PKCE, MFA for sensitive ops, session invalidation on logout"
    company_standard: "See security-standards.yaml authentication block"
  A09_logging_failures:
    description: "Log security events — never log passwords, tokens, PII, card numbers"
    company_standard: "See payment-security.yaml for PCI-DSS log requirements"

# ── Best Practices ────────────────────────────────────────────────────────────
best_practices:
  input_validation:
    validate_all_inputs:
      description: "Validate and sanitise all external inputs — parameters, headers, body"
      apply_to: "API endpoints, CLI inputs, file uploads, webhook payloads"
    whitelist_approach:
      description: "Use whitelist validation; reject anything not explicitly allowed"
    parameterised_queries:
      description: "Always use parameterised queries — never f-strings in SQL"
  authentication:
    strong_passwords:
      description: "Enforce strong password policies — hash with bcrypt/argon2 (NOT SHA256)"
    mfa_required:
      description: "MFA mandatory for privileged operations — company-standard OAuth2+PKCE"
      company_standard: "security-standards.yaml OAuth2 + payment-security.yaml MFA"
    session_management:
      description: "Invalidate sessions on logout — use secure, HttpOnly, SameSite=Strict cookies"
    jwt_config:
      description: "Short-lived JWTs (15min access, 7d refresh) — validate iss/aud/exp claims"
  authorisation:
    least_privilege:
      description: "Grant minimum permissions required for the task"
    check_every_request:
      description: "Authorise every request server-side — never trust client claims"
    rbac:
      description: "RBAC + principle of least privilege — company standard"
      company_standard: "security-standards.yaml authorization block"
    payment_compliance:
      description: "PCI-DSS scope isolation — cardholder data systems in dedicated network zone"
      company_standard: "payment-security.yaml authorization block"
  secrets:
    no_hardcoded_secrets:
      description: "Never hardcode secrets, API keys, DB connection strings, or credentials"
      enforcement: "bandit B105/B106/B107 checks in CI — blocks merge on violation"
    environment_variables:
      description: "Load secrets from environment variables or secrets manager (Vault/AWS SSM)"
    rotate_regularly:
      description: "Rotate credentials quarterly — API keys on revocation events"
    connection_strings:
      description: "DB connection strings never in source — loaded from secrets manager at runtime"
      infrastructure: "See topology.yaml — all environments use connection strings from secrets"
  error_handling:
    no_stack_traces:
      description: "Never expose stack traces or internal errors to end users"
    log_securely:
      description: "Log security events with correlation IDs — never log sensitive data"
    generic_errors:
      description: "Return generic error messages to clients — detail in server logs only"
  api_security:
    rate_limiting:
      description: "Rate limit all public endpoints — 100 req/min per IP for unauthenticated"
      login_endpoints: "10 attempts/min — lockout after 5 failures"
      payment_endpoints: "Strict rate limiting per PCI-DSS"
    cors:
      description: "Strict CORS policy — whitelist only known origins"
    versioning:
      description: "API versioning mandatory — deprecate old versions with 6-month notice"
      company_standard: "api-design-standards.yaml versioning block"

# ── Security Testing Requirements ─────────────────────────────────────────────
security_testing:
  static_analysis:
    tools: ["bandit", "semgrep", "safety"]
    ci_gate: "Block merge on any HIGH severity finding"
  dependency_scanning:
    tools: ["pip-audit", "dependabot"]
    frequency: "Every PR + nightly scheduled scan"
  penetration_testing:
    scope: "All public-facing API endpoints"
    frequency: "Quarterly + on major releases"

# ── Company-Specific Context ──────────────────────────────────────────────────
company_context:
  fintech_compliance: "PCI-DSS — payment endpoints isolated, logs scrubbed of card data"
  oauth_standard: "OAuth2 + PKCE mandatory for all user-facing auth flows"
  encryption: "AES-256 at rest, TLS 1.3+ in transit — no exceptions"
  infrastructure_security: "Network topology from topology.yaml — prod/staging/dev isolation required"
