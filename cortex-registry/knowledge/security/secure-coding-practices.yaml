# Secure Coding Practices
# Authority: AC-PHASE65-S1-001

title: "Secure Coding Practices"
category: "security"
version: "1.0"

best_practices:
  input_validation:
    validate_all_inputs:
      description: "Validate and sanitise all external inputs — parameters, headers, body"
    whitelist_approach:
      description: "Use whitelist validation; reject anything not explicitly allowed"
    parameterised_queries:
      description: "Always use parameterised queries to prevent SQL injection"
  authentication:
    strong_passwords:
      description: "Enforce strong password policies; hash with bcrypt/argon2"
    mfa_required:
      description: "Require multi-factor authentication for privileged operations"
    session_management:
      description: "Invalidate sessions on logout; use secure, HttpOnly cookies"
  authorisation:
    least_privilege:
      description: "Grant minimum permissions required for the task"
    check_every_request:
      description: "Authorise every request, not just at login"
    rbac:
      description: "Use Role-Based Access Control for permission management"
  secrets:
    no_hardcoded_secrets:
      description: "Never hardcode secrets, API keys, or credentials in source code"
    environment_variables:
      description: "Load secrets from environment variables or secrets manager"
    rotate_regularly:
      description: "Rotate credentials and API keys on a regular schedule"
  error_handling:
    no_stack_traces:
      description: "Never expose stack traces or internal errors to end users"
    log_securely:
      description: "Log security events without logging sensitive data"
