# Secrets Detection Patterns
# Knowledge Base for SecurityOrchestrator
# 
# Author: CORTEX Implementation
# Phase: impl-security-orchestrator
# AC-ID: AC-SECURITY-KB-002

domain: "security"
metadata:
  name: "Secrets Detection Patterns"
  source: "Industry best practices (Arnica, TruffleHog, detect-secrets)"
  updated: "2026-02-18"
  description: |
    Comprehensive patterns for detecting hardcoded secrets, API keys,
    tokens, and credentials in source code.

patterns:
  # ========================================================================
  # AWS Credentials
  # ========================================================================
  - id: "aws_access_key"
    name: "AWS Access Key ID"
    pattern: "(?:A3T[A-Z0-9]|AKIA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
    severity: "CRITICAL"
    description: "AWS Access Key IDs start with AKIA, AIDA, AROA, etc."
    remediation: "Use IAM roles, AWS Secrets Manager, or environment variables"
    cwe_id: "CWE-798"
    
  - id: "aws_secret_key"
    name: "AWS Secret Access Key"
    pattern: "(?i)aws.?secret.?access.?key.{1,5}[A-Za-z0-9/+=]{40}"
    severity: "CRITICAL"
    description: "AWS Secret Access Keys are 40 character base64 strings"
    remediation: "Rotate immediately and use AWS Secrets Manager"
    cwe_id: "CWE-798"
    
  - id: "aws_session_token"
    name: "AWS Session Token"
    pattern: "(?i)aws.?session.?token.{1,5}[A-Za-z0-9/+=]{100,}"
    severity: "HIGH"
    description: "AWS Session Tokens for temporary credentials"
    remediation: "Never commit session tokens - they are temporary"
    cwe_id: "CWE-798"

  # ========================================================================
  # GitHub Tokens
  # ========================================================================
  - id: "github_pat"
    name: "GitHub Personal Access Token"
    pattern: "ghp_[A-Za-z0-9]{36}"
    severity: "CRITICAL"
    description: "GitHub Personal Access Tokens (classic)"
    remediation: "Revoke token and use fine-grained PATs with minimal scope"
    cwe_id: "CWE-798"
    
  - id: "github_oauth"
    name: "GitHub OAuth Token"
    pattern: "gho_[A-Za-z0-9]{36}"
    severity: "CRITICAL"
    description: "GitHub OAuth Access Tokens"
    remediation: "Revoke token immediately"
    cwe_id: "CWE-798"
    
  - id: "github_app_token"
    name: "GitHub App Token"
    pattern: "(ghu|ghs)_[A-Za-z0-9]{36}"
    severity: "CRITICAL"
    description: "GitHub App User or Server tokens"
    remediation: "Revoke and regenerate GitHub App tokens"
    cwe_id: "CWE-798"
    
  - id: "github_refresh_token"
    name: "GitHub Refresh Token"
    pattern: "ghr_[A-Za-z0-9]{36}"
    severity: "CRITICAL"
    description: "GitHub Refresh Tokens"
    remediation: "Revoke the associated OAuth token"
    cwe_id: "CWE-798"

  # ========================================================================
  # Google Cloud
  # ========================================================================
  - id: "google_api_key"
    name: "Google API Key"
    pattern: "AIza[0-9A-Za-z\\-_]{35}"
    severity: "HIGH"
    description: "Google API Keys"
    remediation: "Restrict API key to specific APIs and IP addresses"
    cwe_id: "CWE-798"
    
  - id: "google_oauth_id"
    name: "Google OAuth Client ID"
    pattern: "[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
    severity: "MEDIUM"
    description: "Google OAuth Client IDs (public, but track usage)"
    remediation: "Ensure client secret is not also exposed"
    cwe_id: "CWE-200"
    
  - id: "gcp_service_account"
    name: "GCP Service Account Key"
    pattern: "type.*service_account"
    severity: "CRITICAL"
    description: "Google Cloud Platform service account JSON key"
    remediation: "Use Workload Identity Federation instead of service account keys"
    cwe_id: "CWE-798"

  # ========================================================================
  # Azure
  # ========================================================================
  - id: "azure_connection_string"
    name: "Azure Storage Connection String"
    pattern: "DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88};"
    severity: "CRITICAL"
    description: "Azure Storage account connection string"
    remediation: "Use Azure Key Vault or Managed Identity"
    cwe_id: "CWE-798"
    
  - id: "azure_client_secret"
    name: "Azure AD Client Secret"
    pattern: "(?i)azure.?client.?secret.{1,5}[A-Za-z0-9~._-]{34,}"
    severity: "CRITICAL"
    description: "Azure Active Directory application secrets"
    remediation: "Rotate secret and use certificate-based authentication"
    cwe_id: "CWE-798"

  # ========================================================================
  # Database Credentials
  # ========================================================================
  - id: "postgres_uri"
    name: "PostgreSQL Connection URI"
    pattern: "postgres(ql)?://[^:]+:[^@]+@[^/]+/"
    severity: "CRITICAL"
    description: "PostgreSQL connection string with credentials"
    remediation: "Use environment variables or secrets manager"
    cwe_id: "CWE-798"
    
  - id: "mysql_uri"
    name: "MySQL Connection URI"
    pattern: "mysql://[^:]+:[^@]+@[^/]+/"
    severity: "CRITICAL"
    description: "MySQL connection string with credentials"
    remediation: "Use environment variables or secrets manager"
    cwe_id: "CWE-798"
    
  - id: "mongodb_uri"
    name: "MongoDB Connection URI"
    pattern: "mongodb(\\+srv)?://[^:]+:[^@]+@[^/]+/"
    severity: "CRITICAL"
    description: "MongoDB connection string with credentials"
    remediation: "Use environment variables or secrets manager"
    cwe_id: "CWE-798"
    
  - id: "redis_uri"
    name: "Redis Connection URI"
    pattern: "redis://:[^@]+@[^/]+/"
    severity: "CRITICAL"
    description: "Redis connection string with password"
    remediation: "Use environment variables for Redis password"
    cwe_id: "CWE-798"

  # ========================================================================
  # Private Keys
  # ========================================================================
  - id: "rsa_private_key"
    name: "RSA Private Key"
    pattern: "-----BEGIN RSA PRIVATE KEY-----"
    severity: "CRITICAL"
    description: "RSA private key in PEM format"
    remediation: "Store private keys in secure key management system"
    cwe_id: "CWE-321"
    
  - id: "openssh_private_key"
    name: "OpenSSH Private Key"
    pattern: "-----BEGIN OPENSSH PRIVATE KEY-----"
    severity: "CRITICAL"
    description: "OpenSSH private key"
    remediation: "Use SSH agent or secrets manager for key storage"
    cwe_id: "CWE-321"
    
  - id: "ec_private_key"
    name: "EC Private Key"
    pattern: "-----BEGIN EC PRIVATE KEY-----"
    severity: "CRITICAL"
    description: "Elliptic Curve private key"
    remediation: "Store in hardware security module or secrets manager"
    cwe_id: "CWE-321"
    
  - id: "pgp_private_key"
    name: "PGP Private Key"
    pattern: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    severity: "CRITICAL"
    description: "PGP/GPG private key block"
    remediation: "Use GPG keyring with passphrase protection"
    cwe_id: "CWE-321"

  # ========================================================================
  # JWT and Session Tokens
  # ========================================================================
  - id: "jwt_token"
    name: "JSON Web Token"
    pattern: "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    severity: "HIGH"
    description: "JWT token (may contain sensitive claims)"
    remediation: "Never commit JWT tokens - they may grant access"
    cwe_id: "CWE-798"
    
  - id: "bearer_token"
    name: "Bearer Token"
    pattern: "(?i)bearer\\s+[A-Za-z0-9_\\-\\.]+={0,2}"
    severity: "HIGH"
    description: "HTTP Bearer authentication token"
    remediation: "Use environment variables for tokens"
    cwe_id: "CWE-798"

  # ========================================================================
  # Payment Services
  # ========================================================================
  - id: "stripe_live_key"
    name: "Stripe Live Secret Key"
    pattern: "sk_live_[0-9a-zA-Z]{24,}"
    severity: "CRITICAL"
    description: "Stripe live mode secret key"
    remediation: "Rotate key immediately and use Stripe restricted keys"
    cwe_id: "CWE-798"
    
  - id: "stripe_test_key"
    name: "Stripe Test Secret Key"
    pattern: "sk_test_[0-9a-zA-Z]{24,}"
    severity: "MEDIUM"
    description: "Stripe test mode secret key"
    remediation: "Use environment variables even for test keys"
    cwe_id: "CWE-798"
    
  - id: "paypal_token"
    name: "PayPal Access Token"
    pattern: "access_token\\$production\\$[0-9a-z]{16}\\$[0-9a-f]{32}"
    severity: "CRITICAL"
    description: "PayPal production access token"
    remediation: "Revoke token and implement proper OAuth flow"
    cwe_id: "CWE-798"
    
  - id: "square_access_token"
    name: "Square Access Token"
    pattern: "sq0atp-[0-9A-Za-z\\-_]{22}"
    severity: "CRITICAL"
    description: "Square API access token"
    remediation: "Rotate in Square Dashboard immediately"
    cwe_id: "CWE-798"

  # ========================================================================
  # Communication Services
  # ========================================================================
  - id: "slack_bot_token"
    name: "Slack Bot Token"
    pattern: "xoxb-[0-9]{11,13}-[0-9]{11,13}-[a-zA-Z0-9]{24}"
    severity: "CRITICAL"
    description: "Slack bot user OAuth token"
    remediation: "Regenerate token in Slack App settings"
    cwe_id: "CWE-798"
    
  - id: "slack_user_token"
    name: "Slack User Token"
    pattern: "xoxp-[0-9]{11,13}-[0-9]{11,13}-[0-9]{11,13}-[a-f0-9]{32}"
    severity: "CRITICAL"
    description: "Slack user OAuth token"
    remediation: "Revoke user token and re-authenticate"
    cwe_id: "CWE-798"
    
  - id: "slack_webhook"
    name: "Slack Webhook URL"
    pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[a-zA-Z0-9]{24}"
    severity: "HIGH"
    description: "Slack incoming webhook URL"
    remediation: "Regenerate webhook URL if exposed"
    cwe_id: "CWE-798"
    
  - id: "twilio_api_key"
    name: "Twilio API Key"
    pattern: "SK[0-9a-fA-F]{32}"
    severity: "CRITICAL"
    description: "Twilio API Key SID"
    remediation: "Rotate in Twilio Console"
    cwe_id: "CWE-798"
    
  - id: "sendgrid_api_key"
    name: "SendGrid API Key"
    pattern: "SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
    severity: "CRITICAL"
    description: "SendGrid API key"
    remediation: "Revoke and create new API key with minimal permissions"
    cwe_id: "CWE-798"

  # ========================================================================
  # Generic Patterns
  # ========================================================================
  - id: "generic_api_key"
    name: "Generic API Key"
    pattern: "(?i)(api.?key|apikey).{1,5}[A-Za-z0-9_\\-]{20,}"
    severity: "HIGH"
    description: "Generic API key pattern"
    remediation: "Use environment variables or secrets manager"
    cwe_id: "CWE-798"
    
  - id: "generic_secret"
    name: "Generic Secret"
    pattern: "(?i)(secret|token).{1,5}[A-Za-z0-9_\\-]{16,}"
    severity: "HIGH"
    description: "Generic secret or token"
    remediation: "Move to environment variables"
    cwe_id: "CWE-798"
    
  - id: "generic_password"
    name: "Generic Password"
    pattern: "(?i)(password|passwd|pwd).{1,5}.{8,}"
    severity: "CRITICAL"
    description: "Hardcoded password"
    remediation: "Never hardcode passwords - use secrets manager"
    cwe_id: "CWE-259"
    
  - id: "connection_string"
    name: "Generic Connection String"
    pattern: "(?i)(connection.?string|conn.?str).{1,5}.+"
    severity: "HIGH"
    description: "Database or service connection string"
    remediation: "Use environment variables for connection strings"
    cwe_id: "CWE-798"

entropy_detection:
  enabled: true
  min_length: 20
  min_entropy: 4.5
  description: |
    High-entropy string detection for secrets that don't match known patterns.
    Uses Shannon entropy calculation on strings > 20 characters.
  
false_positive_patterns:
  - "(?i)example|sample|placeholder|your.?key|change.?me|xxx+"
  - "(?i)test.?key|fake|dummy|mock"
  - "\\$\\{[^}]+\\}"
  - "<%[^%]+%>"
  - "\\{\\{[^}]+\\}\\}"

pre_commit_hook:
  script: |
    #!/bin/bash
    # CORTEX Secrets Pre-commit Hook
    
    PATTERNS=(
      "AKIA[0-9A-Z]{16}"
      "ghp_[A-Za-z0-9]{36}"
      "sk_live_[0-9a-zA-Z]{24}"
      "-----BEGIN.*PRIVATE KEY-----"
    )
    
    for file in $(git diff --cached --name-only); do
      for pattern in "${PATTERNS[@]}"; do
        if grep -qE "$pattern" "$file" 2>/dev/null; then
          echo "ERROR: Potential secret detected in $file"
          echo "Pattern: $pattern"
          exit 1
        fi
      done
    done
    
    exit 0
