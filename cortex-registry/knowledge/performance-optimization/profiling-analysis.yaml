# Performance Profiling and Analysis
# Authority: AC-PHASE65-S1-001

title: "Performance Profiling and Analysis"
category: "performance-optimization"
version: "1.0"

best_practices:
  profiling:
    measure_first:
      description: "Always profile before optimising; do not guess bottlenecks"
    cpu_profiling:
      description: "Use cProfile/py-spy to identify CPU hotspots"
    memory_profiling:
      description: "Use memory-profiler or tracemalloc for memory leak detection"
    io_profiling:
      description: "Profile I/O wait time separately from CPU time"
  analysis:
    amdahls_law:
      description: "Speedup is limited by the serial fraction; parallelise judiciously"
    big_o_awareness:
      description: "Understand algorithmic complexity before optimising constants"
    database_explain:
      description: "Use EXPLAIN/EXPLAIN ANALYZE on slow queries before adding indexes"
  optimisation:
    caching:
      description: "Cache expensive computations at the appropriate layer"
    connection_pooling:
      description: "Use connection pools for databases and HTTP clients"
    async_io:
      description: "Use async I/O for network-bound operations to improve throughput"
    batch_operations:
      description: "Batch database writes to reduce round-trips"
    lazy_evaluation:
      description: "Defer expensive computations until results are needed"
