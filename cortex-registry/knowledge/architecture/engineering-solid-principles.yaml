# SOLID Principles
# Authority: AC-PHASE65-S1-001

title: "SOLID Engineering Principles"
category: "architecture"
version: "1.0"

best_practices:
  solid:
    single_responsibility:
      description: "Single Responsibility — a class/module should have only one reason to change"
    open_closed:
      description: "Open-Closed — open for extension, closed for modification"
    liskov_substitution:
      description: "Liskov Substitution — subtypes must be substitutable for their base types"
    interface_segregation:
      description: "Interface Segregation — prefer small, specific interfaces over large general ones"
    dependency_inversion:
      description: "Dependency Inversion — depend on abstractions, not concretions"
  cohesion:
    high_cohesion:
      description: "Keep related responsibilities together; separate unrelated ones"
    low_coupling:
      description: "Minimise dependencies between modules"
    encapsulation:
      description: "Hide internal implementation details behind clean interfaces"
  modularity:
    package_by_feature:
      description: "Organise code by feature/domain, not by technical layer"
    stable_dependencies:
      description: "Depend on more stable modules; avoid circular dependencies"
    explicit_contracts:
      description: "Define module contracts with type hints and docstrings"
