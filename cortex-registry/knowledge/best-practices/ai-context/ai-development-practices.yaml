# ─── Universal AI-Augmented Development Standards ─────────────────────────────
# These conventions apply to ALL repositories regardless of which AI vendor is
# detected.  They represent cross-cutting patterns observed across the CORTEX
# ecosystem and should be treated as ADVISORY (not blocking).

standards:
  coding_conventions:
    - "Maintain explicit type annotations on all public functions and methods"
    - "Write docstrings for every public class, method, and module"
    - "Keep functions focused: single responsibility, ≤ 50 lines preferred"
    - "Use snake_case for all identifiers (CORE-028)"
    - "Prefer composition over inheritance; avoid deep class hierarchies"
    - "Avoid magic numbers — use named constants or enums"
    - "Return early to reduce nesting; avoid deeply nested conditionals"

  security_rules:
    - "Never hard-code credentials, tokens, or API keys in source files"
    - "Strip PII (emails, personal URLs, author names) before writing to shared registries"
    - "Validate and sanitise all external inputs at system boundaries"
    - "Use parameterised queries; never interpolate user data into SQL or shell commands"
    - "Apply least-privilege principle to file I/O and network operations"

  architecture_patterns:
    - "Follow CORTEX single-canonical-package rule: all imports use cortex.* (CORE-035)"
    - "Route AI context results through AIContextDisseminator — never write directly to registry"
    - "Respect tier precedence: hand-authored > AI-extracted > CORTEX defaults"
    - "Orchestrators own coordination logic; tools own single-responsibility actions"
    - "All new orchestrators must satisfy IOrchestrator protocol (OrchestratorProtocolMixin)"

  testing_standards:
    - "Write failing tests BEFORE implementation (TDD — CORE-008)"
    - "One test class per behaviour boundary; use descriptive test names"
    - "Use tmp_path (pytest) for file-system tests — never write to real registry in unit tests"
    - "Mock external I/O (file reads, HTTP) to keep unit tests deterministic"
    - "Assert on business semantics, not implementation internals"

