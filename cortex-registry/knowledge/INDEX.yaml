    - path: "docs/.content/knowledge/wcag22_delta_checklist.yaml"
      title: "WCAG 2.2 Delta Checklist (New Criteria vs 2.1)"
      keywords: ["wcag22", "wcag-2.2", "focus-not-obscured", "target-size", "dragging", "consistent-help", "redundant-entry", "accessible-authentication"]
