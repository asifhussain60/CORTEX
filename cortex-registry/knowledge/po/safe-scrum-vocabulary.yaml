id: safe-scrum-vocabulary
version: "1.0"
description: "SAFe/Scrum terminology translation for CORTEX PO suite (GAP-129-06)"
governance_authority: "CORE-012, CORE-028"

# Developer term → SAFe/Scrum equivalent
translations:
  orchestrator: "workflow automation engine"
  orchestrators: "workflow automation engines"
  intent router: "request classifier"
  IntentRouter: "request classifier"
  MCP tool: "AI capability"
  MCP tools: "AI capabilities"
  LENS analysis: "codebase intelligence scan"
  CORTEX: "AI engineering assistant"
  TDD: "Test-Driven Development"
  AC marker: "automation checkpoint"
  AC_START: "automation start marker"
  AC_COMPLETE: "automation completion marker"
  holistic validation: "pre-implementation health check"
  sweep: "comprehensive code scan"
  audit: "governance review"
  vacuum: "workspace cleanup"
  distill: "session summarization"
  PLIP: "AI learning protocol"
  RCA: "Root Cause Analysis"
  WSJF: "Weighted Shortest Job First"
  PI Planning: "Program Increment Planning"
  sprint: "sprint"
  epic: "epic"
  story: "user story"
  task: "task"
  backlog: "product backlog"
  DoD: "Definition of Done"
  DoR: "Definition of Ready"
  velocity: "sprint velocity"
  burndown: "burndown chart"
  retrospective: "retrospective"
  innovation sprint: "innovation sprint"
  hardening sprint: "hardening sprint"
  enabler: "enabler story"
  ART: "Agile Release Train"
  PI: "Program Increment"

# SAFe ceremony guidance
ceremonies:
  pi_planning:
    name: "PI Planning"
    frequency: "Every 8–12 weeks (before each Program Increment)"
    purpose: "Align all Agile teams on mission and objectives for the PI"
    CORTEX_assist: "Generate capacity plans, feature dependency graphs, and risk register before PI Planning"
  sprint_review:
    name: "Sprint Review"
    frequency: "End of each sprint (every 2 weeks)"
    purpose: "Demonstrate completed stories; gather stakeholder feedback"
    CORTEX_assist: "Generate executive summary of completed stories and velocity delta"
  sprint_retrospective:
    name: "Sprint Retrospective"
    frequency: "End of each sprint, after Sprint Review"
    purpose: "Inspect and adapt team process"
    CORTEX_assist: "Surface process gap analysis and recurring anti-patterns"
  sprint_planning:
    name: "Sprint Planning"
    frequency: "Start of each sprint"
    purpose: "Select backlog items and define sprint goal"
    CORTEX_assist: "Calculate sprint capacity, WSJF ranking, and risk-adjusted commitment"
  daily_standup:
    name: "Daily Stand-up (Daily Scrum)"
    frequency: "Daily, 15 minutes"
    purpose: "Synchronise team on progress, plans, and impediments"
    CORTEX_assist: "Flag blocked items and impediments from risk register"
