# TDD Best Practices
# Authority: AC-PHASE65-S1-001 | Enhanced: Phase-79 SDLC Intelligence Engine
# Company Context: cortex-registry/company/domains/ + infrastructure/_schema.yaml

title: "Test-Driven Development Best Practices"
category: "testing-validation"
updated: "2026-02-25"

# ── Three Laws (Kent Beck) ────────────────────────────────────────────────────
three_laws:
  first_law:
    statement: "Do not write production code until you have a failing test"
    rationale: "Ensures all code is covered by tests — CORE-008 enforcement"
  second_law:
    statement: "Write only enough test code to make the test fail"
    rationale: "Keeps tests focused and minimal"
  third_law:
    statement: "Write only enough production code to make the failing test pass"
    rationale: "Prevents gold-plating and over-engineering"

# ── Test Strategy Matrix (by scenario) ────────────────────────────────────────
test_strategy_matrix:
  new_feature:
    unit: "Write unit tests for every public method — min 3 tests per class"
    integration: "Write integration test for each API endpoint + DB interaction"
    golden: "Promote to golden after 2 consecutive green CI runs"
    security: "Include auth boundary test (unauthenticated request → 401)"
  bug_fix:
    unit: "Write failing unit test reproducing the exact bug FIRST"
    regression: "Add regression test to prevent recurrence — never delete"
    sweep: "Scan entire codebase for same bug pattern (CORE-064)"
  refactoring:
    contract: "Freeze all existing tests as contract BEFORE first change"
    property: "Add property-based tests for boundary conditions"
    coverage: "Coverage must not drop below entry baseline"
  api_endpoint:
    contract: "OpenAPI schema test — request/response shape validated"
    auth: "Test unauthenticated (401) + unauthorised (403) + authorised (200)"
    error: "Test all error codes the endpoint can return"
    performance: "P99 latency test — alert if > 200ms for read, 500ms for write"
  database_interaction:
    isolation: "Use transactions rolled back after each test — never mutate shared DB"
    migration: "Test migration forward AND rollback path"
    query: "Assert query plan does not full-scan large tables"
  security:
    injection: "Parameterised queries verified — SQL/NoSQL injection tests mandatory"
    auth_bypass: "Test each endpoint with expired/forged/missing JWT"
    secrets: "Assert no secrets appear in logs, responses, or error messages"

# ── Test Category Definitions ─────────────────────────────────────────────────
test_categories:
  unit:
    scope: "Single function or class in isolation"
    speed: "< 10ms per test"
    mocking: "Mock all I/O, DB, and external services"
    coverage_target: "≥ 90% line coverage"
  integration:
    scope: "Two or more components interacting — including real DB connections"
    speed: "< 500ms per test"
    mocking: "Mock only external third-party APIs"
    coverage_target: "All happy-path + known error paths"
  golden:
    scope: "End-to-end trace from user request → orchestrator → response"
    speed: "< 5s per test (acceptable for E2E)"
    mocking: "No mocking — real orchestrator chain"
    coverage_target: "All 13 intent modes + all wired orchestrators"
    promotion_criteria: "2 consecutive green CI runs + reviewer approval"
  regression:
    scope: "Previously broken behaviour — never delete regression tests"
    speed: "No constraint — correctness over speed"
    tagging: "Tag with @pytest.mark.regression + bug ID"
  performance:
    scope: "Latency, throughput, memory under load"
    tools: ["pytest-benchmark", "locust", "k6"]
    thresholds:
      api_read_p99: "200ms"
      api_write_p99: "500ms"
      batch_job: "< 60s for 10,000 records"
  security:
    scope: "Auth boundaries, injection, secrets exposure, OWASP Top 10"
    tools: ["bandit", "safety", "semgrep"]
    company_standards: "See cortex-registry/company/domains/security-standards.yaml"
    payment_context: "See cortex-registry/company/domains/payment-security.yaml (PCI-DSS)"

# ── TDD Workflow (RGR Loop) ───────────────────────────────────────────────────
workflow:
  red_green_refactor:
    description: "Follow Red-Green-Refactor cycle without skipping steps — enforced by detect-fix-rescan-loop primitive"
    rgr_primitive: "cortex-registry/workflows/templates/primitives/validation/detect-fix-rescan-loop.yaml"
  commit_on_green:
    description: "Commit after each Green phase — git checkpoint created by GitOrchestrator before work begins"
  coverage_gate:
    description: "Maintain minimum 90% line coverage before merging (company standard)"
    company_override: "cortex-registry/company/domains/ — domain-specific coverage targets"
  mutation_testing:
    description: "Use mutmut or cosmic-ray to verify test quality, not just coverage"
  test_pyramid:
    ratio: "70% unit : 20% integration : 8% golden/E2E : 2% performance+security"

# ── Company-Specific Overrides ────────────────────────────────────────────────
company_context:
  payment_security: "Payment endpoints require PCI-DSS compliance tests — see payment-security.yaml"
  api_standards: "All REST APIs must have OpenAPI contract tests — see api-design-standards.yaml"
  security_standards: "OAuth2/PKCE + MFA tests mandatory for auth surfaces — see security-standards.yaml"
  infrastructure: "Integration tests use isolated DB connections from topology.yaml environments"
