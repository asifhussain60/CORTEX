# Canonical Archetype Definitions — CORTEX Knowledge Base
# Authority: GAP-131-01 (Phase 131-a — Intelligence Layer Backport)
# SSOT for ArchetypeClassifier weighted signal scoring.
# Each archetype has a set of file/pattern signals with numeric weights.
# Classifier sums weights of matched signals; highest-scoring archetype wins.
# Score ties resolved alphabetically by archetype id.

created: "2026-03-07"
phase: "131"
gap_ref: "GAP-131-01"

archetypes:
