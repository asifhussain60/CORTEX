      - pattern: "*.sln"
        weight: 5
      - pattern: "*.csproj"
        weight: 3
      - pattern: "*.vbproj"
        weight: 3
      - pattern: "Global.asax"
        weight: 4
      - pattern: "web.config"
        weight: 3
      - pattern: "App.config"
        weight: 2
      - pattern: "*.sln"
        weight: 5
