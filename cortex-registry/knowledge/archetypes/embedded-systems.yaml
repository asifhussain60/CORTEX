# Embedded Systems Archetype — Knowledge Profile
# Authority: GAP-131-01 (Phase 131-a)
id: embedded-systems
archetype: EmbeddedSystems
description: "Embedded / firmware systems — C/C++, RTOS, microcontrollers"
phase: "131"

knowledge_domains:
  - embedded-c
  - real-time
  - safety-critical

best_practices:
  - "Static analysis mandatory (PC-lint, Coverity, or MISRA checks)"
  - "Avoid dynamic memory allocation after boot — use static pools"
  - "Interrupt service routines: minimal, non-blocking, flag-based"
  - "Watchdog timer reset on every main loop iteration"
  - "Unit test HAL layer with hardware simulators"

common_pitfalls:
  - "Stack overflow in deeply recursive ISR chains"
  - "Missing volatile on shared ISR/main variables"
  - "Blocking delays in ISR handlers"

recommended_workflows:
  - "audit/audit-fix-pipeline.yaml"
  - "security/security-compliance-audit.yaml"
