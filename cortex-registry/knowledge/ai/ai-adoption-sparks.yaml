    relevance_weight: 0.9

  - id: ai-spark-083
    title: "Every Tool Was Once Unfamiliar"
    body: >
      You were once unfamiliar with your IDE, your debugger, your version
      control system. Familiarity took time. AI tools are no different.
      The investment pays the same compound return.
    author: "Jessica Kerr"
    source: "SREcon Talk, 2024"
    category: adoption
