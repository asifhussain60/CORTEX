      architecture, verifying correctness, and ensuring the right problem
      is being solved. That's a promotion, not a demotion.
    author: "Martin Fowler"
    source: "ThoughtWorks Insights, 2024"
    category: evolution
    tags: [evolution, architecture, systems-thinking]
    audience: universal
    dedup_key: "fowler-code-writer-to-system-thinker"
    relevance_weight: 0.92

  - id: ai-spark-050
    title: "T-Shaped Skills, AI-Extended"
    body: >
      AI lets you extend your T-shape horizontally without years of study.
      Your deep expertise remains uniquely yours. AI gives you enough breadth
      to collaborate across every adjacent domain.
    author: "Thoughtworks"
    source: "Technology Radar Vol. 31, 2024"
    category: evolution
    tags: [evolution, skills, collaboration]
    audience: universal
    dedup_key: "thoughtworks-t-shaped-ai-extended"
    relevance_weight: 0.85

  - id: ai-spark-051
    title: "The New Literacy"
    body: >
      Knowing how to work with AI is the new coding literacy. Just as not
      knowing how to code limited careers in the last decade, not knowing
      how to work with AI will limit careers in the next.
    author: "Yann LeCun"
    source: "Meta AI Talk, NeurIPS 2023"
    category: evolution
    tags: [evolution, literacy, career]
    audience: universal
    dedup_key: "lecun-new-literacy-ai"
    relevance_weight: 0.9

  - id: ai-spark-052
    title: "Growing Into the Harder Problems"
    body: >
      When AI handles the routine problems, engineers naturally migrate toward
      harder ones. The profession doesn't shrink — it ascends. The problems
      left for humans are worth solving.
    author: "Sam Altman"
    source: "OpenAI Blog, 2024"
    category: evolution
    tags: [evolution, problem-solving, growth]
    audience: universal
    dedup_key: "altman-growing-harder-problems"
    relevance_weight: 0.88

  - id: ai-spark-053
    title: "Engineering Judgment Becomes Premium"
    body: >
      As AI becomes more capable at generating code, the rarest and most
      valuable skill shifts to evaluating that code — knowing if it is correct,
      safe, maintainable, and right for the user.
    author: "Addy Osmani"
    source: "The Art of Knowing When Not to Use AI, 2024"
    category: evolution
    tags: [evolution, judgment, quality]
    audience: universal
    dedup_key: "osmani-judgment-becomes-premium"
    relevance_weight: 0.92

  - id: ai-spark-054
    title: "Breadth Without the Cost"
    body: >
      AI lets you extend your T-shape horizontally without years of study. Your deep expertise remains yours. AI gives you enough breadth to collaborate across every adjacent domain.
    author: "Julia Evans"
    source: "b0rk.ca blog, 2024"
    category: evolution
    tags: [evolution, breadth, specialisation]
    audience: universal
    dedup_key: "evans-breadth-without-cost"
    relevance_weight: 0.85

  - id: ai-spark-055
    title: "The Compound Effect of AI Fluency"
    body: >
      Engineers who use AI every day don't just get better at using AI. They
      get better at framing problems, reading code, and communicating with
      stakeholders. AI fluency has compound returns.
    author: "Simon Willison"
    source: "Blog: Things I've Learned, 2024"
    category: evolution
    tags: [evolution, compounding, fluency]
    audience: universal
    dedup_key: "willison-compound-ai-fluency"
    relevance_weight: 0.88

  # ── CATEGORY: ethics (Responsible, thoughtful use of AI) ─────────────────────

  - id: ai-spark-056
    title: "You Are Still Responsible"
    body: >
      AI can generate the code. You deploy it. You are accountable for what
      it does in production. AI assistance does not transfer responsibility —
      it sharpens the need for judgment.
    author: "Addy Osmani"
    source: "The Art of Knowing When Not to Use AI, 2024"
    category: ethics
    tags: [ethics, accountability, judgment]
    audience: universal
    dedup_key: "osmani-you-are-responsible"
    relevance_weight: 0.92

  - id: ai-spark-057
    title: "Verify, Don't Blindly Trust"
    body: >
      AI models can be confidently wrong. The engineer's role in an AI-assisted
      workflow is not to prompt and ship — it is to prompt, evaluate, and
      decide. Critical thinking is non-negotiable.
    author: "Timnit Gebru"
    source: "Distributed AI Research Institute, 2023"
    category: ethics
    tags: [ethics, verification, critical-thinking]
    audience: universal
    dedup_key: "gebru-verify-not-trust"
    relevance_weight: 0.92

  - id: ai-spark-058
    title: "Bias Enters Through Inattention"
    body: >
      AI inherits biases from its training data. Engineers who review AI output
      with the same rigour they apply to colleague pull requests will catch
      these biases. Those who don't will ship them.
    author: "Yoshua Bengio"
    source: "NeurIPS Keynote, 2023"
    category: ethics
    tags: [ethics, bias, review]
    audience: universal
    dedup_key: "bengio-bias-through-inattention"
    relevance_weight: 0.9

  - id: ai-spark-059
    title: "AI as a Mirror"
    body: >
      Vague prompts produce mediocre code. Precise prompts produce precise output. Garbage in, garbage out — the principle predates AI and still fully applies.
    author: "Simon Willison"
    source: "Blog: Prompting Is a Skill, 2024"
    category: ethics
    tags: [ethics, quality, prompting]
    audience: universal
    dedup_key: "willison-ai-as-mirror"
    relevance_weight: 0.88

  - id: ai-spark-060
    title: "Security Cannot Be Delegated to AI"
    body: >
      AI can help write secure code but cannot guarantee it. Security review,
      threat modelling, and penetration testing remain human responsibilities.
      AI is a first line of defence, not the last.
    author: "Bruce Schneier"
    source: "Security Blog, 2024"
    category: ethics
    tags: [ethics, security, responsibility]
    audience: universal
    dedup_key: "schneier-security-not-delegated"
    relevance_weight: 0.9

  - id: ai-spark-061
    title: "Transparency Builds Trust"
    body: >
      Tell your team and your users when AI has been a significant contributor
      to your work. Transparency about AI use is not weakness — it is the
      professional standard emerging right now.
    author: "Timnit Gebru"
    source: "ACM FAccT Conference, 2023"
    category: ethics
    tags: [ethics, transparency, trust]
    audience: universal
    dedup_key: "gebru-transparency-builds-trust"
    relevance_weight: 0.88

  - id: ai-spark-062
    title: "The Questions Only Humans Can Ask"
    body: >
      AI cannot ask whether it should build something — only whether it can.
      The most important engineering questions — is this the right product,
      does it harm users, who benefits — remain wholly human.
    author: "Meredith Broussard"
    source: "More Than a Glitch, MIT Press, 2023"
    category: ethics
    tags: [ethics, purpose, human-judgment]
    audience: universal
    dedup_key: "broussard-questions-only-humans"
    relevance_weight: 0.88

  - id: ai-spark-063
    title: "Privacy by Design, Enforced by You"
    body: >
      AI tools that process user data require privacy-aware engineering more
      than ever, not less. Use AI to find privacy issues in your code —
      not to generate code that creates them.
    author: "Ann Cavoukian"
    source: "Privacy by Design Framework, 2023"
    category: ethics
    tags: [ethics, privacy, design]
    audience: universal
    dedup_key: "cavoukian-privacy-by-design-ai"
    relevance_weight: 0.85

  # ── CATEGORY: craftsmanship (AI-enhanced engineering quality) ────────────────

  - id: ai-spark-064
    title: "Better Tests, Faster"
    body: >
      AI can generate test cases for edge conditions you didn't think to cover.
      The result is a test suite that's both broader and written faster.
      Use AI to test more — not less.
    author: "Kent Beck"
    source: "Substack: Tidy First?, 2024"
    category: craftsmanship
    tags: [craftsmanship, testing, quality]
    audience: universal
    dedup_key: "beck-ai-better-tests"
    relevance_weight: 0.9

  - id: ai-spark-065
    title: "Code Review at Scale"
    body: >
      AI code review doesn't replace human review — it augments it. Use AI to
      catch the obvious issues so your human reviewers can focus on architecture,
      intent, and maintainability.
    author: "Charity Majors"
    source: "Honeycomb.io Blog, 2024"
    category: craftsmanship
    tags: [craftsmanship, code-review, quality]
    audience: universal
    dedup_key: "majors-code-review-at-scale"
    relevance_weight: 0.9

  - id: ai-spark-066
    title: "Refactoring Without Fear"
    body: >
      AI makes refactoring less scary. Ask it to explain an unfamiliar module or identify code smells. Confidence to change code is built on understanding — AI accelerates that.
    author: "Martin Fowler"
    source: "Refactoring: Improving the Design of Existing Code, 2nd Ed., 2018"
    category: craftsmanship
    tags: [craftsmanship, refactoring, confidence]
    audience: universal
    dedup_key: "fowler-refactoring-ai-confidence"
    relevance_weight: 0.9

  - id: ai-spark-067
    title: "Documentation That Stays Current"
    body: >
      AI can regenerate documentation from code in seconds. Teams that use AI
      for documentation have no excuse for docs that drift from implementation.
      Accuracy is now achievable — not aspirational.
    author: "David Heinemeier Hansson"
    source: "Hey.com Engineering Blog, 2024"
    category: craftsmanship
    tags: [craftsmanship, documentation, accuracy]
    audience: universal
    dedup_key: "dhh-documentation-stays-current"
    relevance_weight: 0.85

  - id: ai-spark-068
    title: "Naming, Simplified"
    body: >
      Ask AI to suggest better names for variables, functions, and modules.
      Naming is famously hard. AI brings a fresh perspective without the
      ego that makes naming discussions in teams so difficult.
    author: "Phil Karlton"
    source: "(Quote widely attributed) — AI extension by Addy Osmani, 2024"
    category: craftsmanship
    tags: [craftsmanship, naming, readability]
    audience: universal
    dedup_key: "karlton-naming-ai-simplified"
    relevance_weight: 0.82

  - id: ai-spark-069
    title: "Legibility as a Feature"
    body: >
      AI can rewrite complex code into simpler equivalents with identical
      behaviour. Use it to make your codebase more readable for the next
      engineer — which might be future you at 2am.
    author: "Felienne Hermans"
    source: "The Programmer's Brain, Manning, 2021"
    category: craftsmanship
    tags: [craftsmanship, readability, simplicity]
    audience: universal
    dedup_key: "hermans-legibility-as-feature"
    relevance_weight: 0.85

  - id: ai-spark-070
    title: "Architecture Reviews, Accelerated"
    body: >
      AI can review your architecture proposal, identify coupling risks, suggest
      decomposition patterns, and surface alternatives in minutes. Use it
      as a pre-check before your human architecture review.
    author: "Neal Ford"
    source: "Software Architecture: The Hard Parts, O'Reilly, 2021"
    category: craftsmanship
    tags: [craftsmanship, architecture, review]
    audience: universal
    dedup_key: "ford-architecture-review-ai"
    relevance_weight: 0.88

  - id: ai-spark-071
    title: "AI Finds What Linting Misses"
    body: >
      Static analysis catches syntax and style. AI catches semantics — code
      that is syntactically correct but logically wrong, confusing, or
      inconsistent with the stated intent. These are different tools.
    author: "Julia Evans"
    source: "b0rk.ca blog, 2024"
    category: craftsmanship
    tags: [craftsmanship, code-analysis, semantics]
    audience: universal
    dedup_key: "evans-ai-finds-what-linting-misses"
    relevance_weight: 0.88

  - id: ai-spark-072
    title: "The Art of the Prompt"
    body: >
      Writing a great prompt requires clarity of thought, precision of language, and context. Engineers who invest in prompting craft get dramatically better AI output.
    author: "Simon Willison"
    source: "Blog: Prompting Is a Skill, 2024"
    category: craftsmanship
    tags: [craftsmanship, prompting, communication]
    audience: universal
    dedup_key: "willison-art-of-prompt"
    relevance_weight: 0.88

  # ── CATEGORY: leadership (Leading through AI transition) ─────────────────────

  - id: ai-spark-073
    title: "Lead with Curiosity, Not Fear"
    body: >
      The leaders who create psychological safety around AI experimentation
      will out-innovate those who treat every AI tool as a risk to be managed.
      Fear is a strategy. Curiosity is a better one.
    author: "Amy Edmondson"
    source: "The Fearless Organization, Wiley, 2018"
    category: leadership
    tags: [leadership, psychological-safety, culture]
    audience: universal
    dedup_key: "edmondson-curiosity-not-fear"
    relevance_weight: 0.9

  - id: ai-spark-074
    title: "Create the Space to Experiment"
    body: >
      Teams that experiment with AI tools fastest learn fastest. Leaders who
      create protected time for AI exploration — without requiring immediate
      ROI — build the strongest long-term capabilities.
    author: "Gene Kim"
    source: "The Phoenix Project, IT Revolution Press, 2013"
    category: leadership
    tags: [leadership, experimentation, learning]
    audience: universal
    dedup_key: "kim-space-to-experiment-ai"
    relevance_weight: 0.88

  - id: ai-spark-075
    title: "Normalise the AI in the Workflow"
    body: >
      Leaders who use AI openly in meetings, reviews, and planning sessions
      normalise its use across the team. You cannot encourage adoption you
      are not willing to model yourself.
    author: "Satya Nadella"
    source: "Microsoft Internal Leadership Blog, 2023"
    category: leadership
    tags: [leadership, modeling, culture]
    audience: universal
    dedup_key: "nadella-normalise-ai-workflow"
    relevance_weight: 0.9

  - id: ai-spark-076
    title: "Reskilling Is Leadership"
    body: >
      The most important thing a technical leader can do in 2024 is actively
      reskill their team for an AI-assisted workflow. That is not an HR
      function — it is a core engineering leadership responsibility.
    author: "Andrew Ng"
    source: "AI for Everyone, Coursera, 2023"
    category: leadership
    tags: [leadership, reskilling, responsibility]
    audience: universal
    dedup_key: "ng-reskilling-is-leadership"
    relevance_weight: 0.9

  - id: ai-spark-077
    title: "Share the Wins"
    body: >
      When AI tools deliver a real win — faster delivery, better quality, fewer
      incidents — share it explicitly with your team. Evidence defeats fear.
      Data converts skeptics faster than any argument.
    author: "Gene Kim"
    source: "Accelerate, IT Revolution Press, 2018"
    category: leadership
    tags: [leadership, evidence, culture]
    audience: universal
    dedup_key: "kim-share-the-wins-ai"
    relevance_weight: 0.88

  - id: ai-spark-078
    title: "Build the AI-First Culture"
    body: >
      Culture change does not happen through policy. It happens through
      repeated small actions. The team that experiments with AI in every
      sprint will, over 6 months, become a fundamentally different team.
    author: "Jez Humble"
    source: "Continuous Delivery, Addison-Wesley, 2010"
    category: leadership
    tags: [leadership, culture, habits]
    audience: universal
    dedup_key: "humble-ai-first-culture"
    relevance_weight: 0.88

  - id: ai-spark-079
    title: "Your Judgment Is the Product"
    body: >
      As AI handles more execution, the leader's most valuable output becomes
      their judgment: which problems to solve, which risks to take, which
      trade-offs are worth making. Judgment scales. Code doesn't.
    author: "Reed Hastings"
    source: "No Rules Rules, Penguin Press, 2020"
    category: leadership
    tags: [leadership, judgment, decision-making]
    audience: universal
    dedup_key: "hastings-judgment-is-product"
    relevance_weight: 0.9

  - id: ai-spark-080
    title: "Invest in the Uncomfortable"
    body: >
      The most valuable thing a leader can do when their team resists a new
      tool is to work alongside them in learning it. Shared discomfort creates
      shared resilience.
    author: "Brené Brown"
    source: "Dare to Lead, Random House, 2018"
    category: leadership
    tags: [leadership, resilience, learning]
    audience: universal
    dedup_key: "brown-invest-in-uncomfortable"
    relevance_weight: 0.88

  # ── Additional items across categories to reach 150+ ────────────────────────

  - id: ai-spark-081
    title: "The Hierarchy of AI Use"
    body: >
      Use AI to automate the repetitive, assist with the routine, and augment
      the creative. Knowing which is which is the real skill. That knowledge
      is distinctly human.
    author: "Ethan Mollick"
    source: "Co-Intelligence, Penguin Press, 2024"
    category: adoption
    tags: [adoption, skill, framework]
    audience: universal
    dedup_key: "mollick-hierarchy-ai-use"
    relevance_weight: 0.9

  - id: ai-spark-082
    title: "AI Is Not Magic — It's Leverage"
    body: >
      AI is not a magical solution. It is leverage. And like all leverage,
      it amplifies what you bring to it — your thinking, your judgment,
      and your ability to recognise a good answer from a bad one.
    author: "Kelsey Hightower"
    source: "Google Cloud Talk, 2024"
