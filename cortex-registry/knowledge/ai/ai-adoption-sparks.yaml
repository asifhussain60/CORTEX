    relevance_weight: 0.85

  - id: ai-spark-084
    title: "The Floor Rises for Everyone"
    body: >
      AI tools raise the capability floor for every engineer. Junior developers
      produce senior-quality output sooner. Senior developers tackle problems
      that used to require teams. Everyone moves up.
    author: "GitHub Research"
    source: "GitHub Octoverse Report, 2023"
    category: evolution
    tags: [evolution, capability, teams]
    audience: universal
    dedup_key: "github-floor-rises-everyone"
    relevance_weight: 0.88

  - id: ai-spark-085
    title: "Learn by Doing, Not by Watching"
    body: >
      The fastest way to understand AI's capabilities and limitations is to
      use it on a real problem in your domain. Reading about AI is no substitute
      for wrestling with it on something that matters to you.
    author: "Andrew Ng"
    source: "Machine Learning Yearning, self-published, 2018"
    category: adoption
    tags: [adoption, learning, experience]
    audience: universal
    dedup_key: "ng-learn-by-doing-ai"
    relevance_weight: 0.9

  - id: ai-spark-086
    title: "AI Makes the Hard Parts Harder"
    body: >
      AI makes the easy parts of engineering trivially easy — shifting attention to system design, trade-off decisions, and user empathy. These remain genuinely difficult and genuinely valuable.
    author: "Sam Altman"
    source: "Lex Fridman Podcast, 2023"
    category: evolution
    tags: [evolution, complexity, value]
    audience: universal
    dedup_key: "altman-hard-parts-harder"
    relevance_weight: 0.88

  - id: ai-spark-087
    title: "The Map Is Not the Territory"
    body: >
      AI output is a model of the answer, not the answer. Engineers who treat
      AI output as a starting point for verification will consistently
      outperform those who treat it as a finished product.
    author: "Addy Osmani"
    source: "Engineering Leadership, Google I/O, 2024"
    category: ethics
    tags: [ethics, verification, critical-thinking]
    audience: universal
    dedup_key: "osmani-map-not-territory"
    relevance_weight: 0.9

  - id: ai-spark-088
    title: "Small Experiments, Large Returns"
    body: >
      You don't need a company-wide AI initiative to start. Pick one task,
      try the tool, measure the outcome. Repeat. Compounding returns from
      small experiments are how AI transformations actually happen.
    author: "Gene Kim"
    source: "The Unicorn Project, IT Revolution Press, 2019"
    category: adoption
    tags: [adoption, experimentation, compounding]
    audience: universal
    dedup_key: "kim-small-experiments-large-returns"
    relevance_weight: 0.88

  - id: ai-spark-089
    title: "Context Is the Prompt"
    body: >
      The quality of AI output scales with the quality of context you provide. Engineers who write richer, more precise prompts with explicit goals get dramatically better results.
    author: "Simon Willison"
    source: "Blog: Prompting Strategies, 2024"
    category: craftsmanship
    tags: [craftsmanship, prompting, context]
    audience: universal
    dedup_key: "willison-context-is-prompt"
    relevance_weight: 0.88

  - id: ai-spark-090
    title: "The Fastest Path to Understanding"
    body: >
      When you encounter unfamiliar code, AI can explain it in plain language
      in seconds. What used to require an hour of reading or finding the right
      colleague now takes thirty seconds of asking.
    author: "Felienne Hermans"
    source: "The Programmer's Brain, Manning, 2021"
    category: productivity
    tags: [productivity, understanding, onboarding]
    audience: universal
    dedup_key: "hermans-fastest-path-understanding"
    relevance_weight: 0.88

  - id: ai-spark-091
    title: "Your Domain Knowledge Is Irreplaceable"
    body: >
      AI knows everything about programming. It knows nothing about your users, your business rules, or your system history. That knowledge lives in your team and makes AI outputs correct.
    author: "Martin Fowler"
    source: "ThoughtWorks Blog, 2024"
    category: evolution
    tags: [evolution, domain-knowledge, value]
    audience: universal
    dedup_key: "fowler-domain-knowledge-irreplaceable"
    relevance_weight: 0.92

  - id: ai-spark-092
    title: "AI as Onboarding Accelerator"
    body: >
      New engineers using AI get productive weeks faster. They can ask AI to
      explain the codebase, generate context, and suggest where to start.
      The onboarding ramp compresses from months to weeks.
    author: "Jessica Kerr"
    source: "Strange Loop Conference, 2023"
    category: collaboration
    tags: [collaboration, onboarding, productivity]
    audience: universal
    dedup_key: "kerr-ai-onboarding-accelerator"
    relevance_weight: 0.88

  - id: ai-spark-093
    title: "The Best Debugger Is Also the Best Teacher"
    body: >
      Ask AI to explain why your code is wrong, not just to fix it. The
      explanation builds understanding that makes you less likely to make
      the same mistake again. Debugging becomes learning.
    author: "Kent Beck"
    source: "Substack: Tidy First?, 2024"
    category: craftsmanship
    tags: [craftsmanship, debugging, learning]
    audience: universal
    dedup_key: "beck-debugger-as-teacher"
    relevance_weight: 0.9

  - id: ai-spark-094
    title: "AI for Cross-Cutting Concerns"
    body: >
      Logging, error handling, input validation — the same patterns repeated
      across hundreds of functions. AI generates these consistently, completely,
      and correctly. Stop writing boilerplate by hand.
    author: "Robert C. Martin"
    source: "Clean Code, Prentice Hall, 2008"
    category: craftsmanship
    tags: [craftsmanship, boilerplate, consistency]
    audience: universal
    dedup_key: "martin-ai-cross-cutting"
    relevance_weight: 0.85

  - id: ai-spark-095
    title: "Migration Without Dread"
    body: >
      Modernising a legacy codebase used to mean months of risky work. AI accelerates understanding, generates migration scaffolding, and produces test coverage for code that had none.
    author: "Michael Feathers"
    source: "Working Effectively with Legacy Code, Prentice Hall, 2004"
    category: craftsmanship
    tags: [craftsmanship, legacy, migration]
    audience: universal
    dedup_key: "feathers-migration-without-dread"
    relevance_weight: 0.88

  - id: ai-spark-096
    title: "Shipping Is the North Star"
    body: >
      Adopting AI tools is not an end in itself. The goal is better software,
      delivered faster, to users who need it. Measure AI adoption by that
      standard — and you'll use it wisely.
    author: "Jez Humble"
    source: "Continuous Delivery, Addison-Wesley, 2010"
    category: adoption
    tags: [adoption, delivery, pragmatism]
    audience: universal
    dedup_key: "humble-shipping-north-star"
    relevance_weight: 0.88

  - id: ai-spark-097
    title: "The Feedback Loop Closes Faster"
    body: >
      AI gives feedback on your code in real time — not at the end of a PR
      cycle or a test run. Faster feedback means faster learning and faster
      correction. Shift left further than you thought possible.
    author: "Gene Kim"
    source: "Accelerate, IT Revolution Press, 2018"
    category: productivity
    tags: [productivity, feedback-loops, speed]
    audience: universal
    dedup_key: "kim-feedback-loop-faster"
    relevance_weight: 0.9

  - id: ai-spark-098
    title: "The Universal Translator"
    body: >
      AI translates between programming languages and frameworks with fluency no single engineer can match. Polyglot projects become tractable. Technology decisions become more reversible.
    author: "Neal Ford"
    source: "Software Architecture: The Hard Parts, O'Reilly, 2021"
    category: productivity
    tags: [productivity, polyglot, flexibility]
    audience: universal
    dedup_key: "ford-universal-translator-ai"
    relevance_weight: 0.85

  - id: ai-spark-099
    title: "The Democratisation of Architecture"
    body: >
      AI gives every developer access to architectural patterns, trade-off
