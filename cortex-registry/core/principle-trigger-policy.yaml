# ─────────────────────────────────────────────────────────────────────────────
# PRINCIPLE TRIGGER POLICY
# ID: CORE-PRINCIPLE-TRIGGER
# Phase: 124 (extended — production hardening)
#
# PURPOSE: Single SSOT declaring which orchestrator intent categories receive
#          atom-principle injection and which are permanently excluded.
#
# This rule is enforced at:
#   1. Template layer  — atom-principle.yaml omit_if + render_only_for lists
#   2. Code layer      — PrincipleSelector._PRINCIPLES_DOMAIN_MAP (operational intents
#                        are mapped but PrincipleSelector is never called from operational
#                        compositions — comp-implement-fix, comp-refactor, comp-debug,
#                        comp-audit-fix, comp-health, comp-vacuum do NOT include atom-principle)
#   3. Audit layer     — audit-checklist.yaml P2-004 checks for operational composition drift
#   4. Test layer      — tests/intelligence/test_principle_drift_locks.py drift-lock suite
#
# SSOT: cortex-registry/templates/response/atoms/atom-principle.yaml
# Author: Asif Hussain | © 2025–2026 CORTEX Framework. All rights reserved.
# ─────────────────────────────────────────────────────────────────────────────

id: CORE-PRINCIPLE-TRIGGER
phase: "125"
last_updated: "2026-03-04"

# ─── Intent Category Taxonomy ─────────────────────────────────────────────────
#
# Every CORTEX intent type is assigned to exactly ONE category.
# PrincipleSelector fires ONLY for intents in the 'analysis' or 'design' category.
# Override with explicit `principle_override: true` in a composition atom entry.

intent_categories:

  analysis:
    description: "Understanding-first intents — user seeks to comprehend, explore, or query"
    principle_injection: true
    intents:
      - QUERY
      - INVESTIGATE
      - ANALYZE

  design:
    description: "Architecture and planning intents — user is shaping a solution"
    principle_injection: true
    intents:
      - DESIGN
      - PLAN
      - ONBOARD
      - INTRODUCE

  operations:
    description: "Execution-focused intents — user is implementing or running something"
    principle_injection: false
    override_allowed: false
    intents:
      - INTERACT
      - IMPLEMENT
      - FIX
      - REFACTOR
      - TDD
      - DEBUG
      - AUDIT
      - HEALTH
      - VACUUM
      - SYNC
      - TOTALRECALL
      - DEPLOY

  meta:
    description: "Framework-internal intents — not user-facing primary flows"
    principle_injection: false
    override_allowed: false
    intents:
      - META_AUDIT
      - RCA
      - TRAIN
      - DIGEST
      - GOLDEN_TEST
      - WORKFLOW_COMPOSE

# ─── Brevity Enforcement ──────────────────────────────────────────────────────
brevity:
  body_max_chars: 200
  body_max_lines: 2
  enforcement: "PrincipleSelector._select_principle() truncates at word boundary before limit"
  governance_check: "P2-004 in audit-checklist.yaml"

# ─── Complexity Gate (Phase 125) ──────────────────────────────────────────────
# Principles are injected ONLY when the request is complex. Simple queries
# (short question, single lookup) suppress the principle block entirely.
# This prevents overwhelming users with unrequested editorial content.
#
# Gate implementation: is_complex_request() in cortex/intelligence/principle_selector.py
# Gate rules (first match wins):
#   1. DESIGN / PLAN / INVESTIGATE / ANALYZE / ONBOARD → always complex → inject
#   2. QUERY / INTRODUCE + request_text ≥ 8 words → complex → inject
#   3. QUERY / INTRODUCE + complexity signal keyword present → complex → inject
#   4. context_hints['is_complex'] == True (caller override) → inject
#   5. All other cases → suppress (return None — caller omits the block)
#
# ─── Render Position (Phase 127 — canonical) ─────────────────────────────────
# The principle block renders INSIDE the ## 🔍 Analysis section of the
# 5-Section Golden Format — NOT in Zone 3 of the response header.
# It is part of analysis feedback, not page furniture.
#
# Render format (blockquote — produces left-accent bar matching the header quote):
#
#   ## 🔍 Analysis
#
#   > 💡 **Principle: {title}**
#   > {body}
#
#   {rest of analysis…}
#
# The previous H3 format (### 💡 Principle: {title}) has been RETIRED.
# H3 headings do not render with a left-accent bar in VS Code Copilot Chat.
# Blockquote (> ) achieves the same visual weight as the Zone 2 book quote.
render_position:
  location: "inside_analysis_section"   # ## 🔍 Analysis — first element
  zone: "analysis_section"             # NOT zone 3 of the response header
  element: "blockquote"               # > prefix — left-accent bar in VS Code
  retired_element: "h3_plus_paragraph" # ### 💡 Principle: — RETIRED Phase 127
  rationale: "Principles are analysis content, not header furniture. Blockquote rendering matches the visual weight of the header quote."


  enabled: true
  implementation: "cortex/intelligence/principle_selector.py::is_complex_request"
  max_principles_per_response: 1
  always_complex_intents: [DESIGN, PLAN, INVESTIGATE, ANALYZE, ONBOARD]
  context_dependent_intents: [QUERY, INTRODUCE]
  complex_query_min_words: 8
  suppress_return_value: null  # select() returns None → caller must check

# ─── Audit Contract ───────────────────────────────────────────────────────────
audit_contract:
  check_id: "P2-004"
  description: "No operational composition (comp-interaction-guided, comp-implement-fix, comp-refactor, comp-debug, comp-audit-fix, comp-health, comp-vacuum) may include atom-principle in its atoms list"
  detection_method: "Parse all cortex-registry/templates/response/compositions/*.yaml; assert atom-principle absent from operational intent compositions"
  drift_lock_test: "tests/intelligence/test_principle_drift_locks.py::TestDriftLockCompQuery"
  severity: "P2"
  blocking: false

# ─── DoR Dimension Alignment ──────────────────────────────────────────────────
# Principles do NOT gate DoR — they reinforce readiness DIMENSIONS contextually.
# DoR gating remains exclusively in atom-intent-reflection.yaml.
# This relationship is intentional: principles provide epistemic context;
# DoR enforcement is a separate governance concern.
dor_alignment:
  coupling: "none"
  rationale: "Atoms must remain independent. Principle renders if analysis/design; DoR blocks execution independently."
  reinforces_dimensions:
    - security
    - quality
    - correctness
    - maintainability
