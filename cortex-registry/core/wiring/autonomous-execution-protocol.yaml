# CORTEX Silent Autonomous Execution Specification
# Authority: cortex-architect.prompt.md v15.3 (CORE-049)
# Purpose: Define silent autonomous mode for long-running operations
# Status: ACTIVE (Phase D - Agent Consolidation)

version: "1.0"
created_at: 2026-02-09
updated_at: 2026-02-09
authority: "CORTEX Execution Team"

# Core Principles
core_principles:
  
  silent_mode:
    description: "No user prompts during execution"
    enabled_by: "User phrase: 'proceed', 'execute', 'yes', 'continue'"
    disabled_by: "User phrases: 'wait', 'hold', 'ask first'"
    
  autonomous_execution:
    description: "Continuous execution without blocking on user interaction"
    behavioral_mode: "Run to completion with progress reporting"
    blocking_conditions: "None (unless critical error)"
    
  progress_reporting:
    description: "Visual feedback via ASCII progress bars"
    format: "STAGE_NAME: [████████░░] 80% SUBTASK"
    frequency: "Every 5% completion"
    
  ac_marker_tracking:
    description: "Audit trail markers embedded in all code"
    pattern: "# AC_START: AC-PHASE-X-YYY ... # AC_COMPLETE: AC-PHASE-X-YYY ✅"
    enforcement: "MANDATORY for all code changes"

# Execution Modes
execution_modes:
  
  silent_mode_enabled:
    trigger: "User approval message + 'proceed' keyword"
    behavior:
      - no_confirmations: "Skip approval requests"
      - no_narration: "Minimal status output"
      - auto_continue: "Proceed through multi-step operations"
      - progress_bars: "Show visual progress"
    
  verbos_mode_enabled:
    trigger: "Default without explicit approval"
    behavior:
      - ask_confirmations: "Request user approval at each phase"
      - narrate_steps: "Explain what being executed"
      - step_by_step: "Wait for user feedback"
      - detailed_output: "Show comprehensive logs"

# Silent Mode Phases
silent_mode_phases:
  
  phase_1_preparation:
    duration_seconds: 60
    tasks:
      - validate_environment
      - load_specifications
      - initialize_orchestrators
      - prepare_workspace
    
  phase_2_execution:
    duration_seconds: 3600  # Varies by operation
    tasks:
      - execute_primary_orchestrator
      - capture_artifacts
      - run_validation_tests
      - log_progress
    checkpoint_interval: 15  # Every 15 minutes
    
  phase_3_validation:
    duration_seconds: 120
    tasks:
      - verify_test_coverage
      - run_lint_checks
      - verify_audit_trail
      - generate_report
    
  phase_4_completion:
    duration_seconds: 30
    tasks:
      - commit_changes
      - sync_registries
      - log_completion
      - prepare_handoff

# Progress Reporting Format
progress_reporting:
  
  visual_format:
    template: |
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      📋 Phase X: DESCRIPTION
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      [████████░░] 80% SUBTASK_NAME
      ├─ ✅ S1: Completed (15 tests)
      ├─ ✅ S2: Completed (10 tests)  
      ├─ 🔵 S3: In Progress (current)
      └─ ⚪ S4: Pending (12 tests)
      
      Progress: 40/50 | Coverage: 89%
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    
    symbols:
      completed: "✅"
      in_progress: "🔵"
      pending: "⚪"
      error: "❌"
      warning: "⚠️"
      info: "ℹ️"

# Token Budget Protocol
token_budget_protocol:
  
  budget_monitoring:
    initial_budget: 200000
    warning_threshold: 0.75  # 75% warning
    critical_threshold: 0.95  # 95% critical
    
  when_budget_75_percent:
    action: "Log checkpoint status"
    include:
      - completed_phases
      - test_results
      - key_files_modified
    
  when_budget_95_percent:
    action: "Generate continuation prompt"
    format: "Summarize progress + next steps (200-400 tokens)"
    handoff: "User copies to new session + /plan command"

# Error Handling in Silent Mode
error_handling:
  
  level_1_warnings:
    description: "Non-blocking issues"
    response: "Log warning + continue execution"
    examples: ["Minor lint violation", "Deprecation notice"]
    
  level_2_errors:
    description: "Potentially blocking issues"
    response: "Log error + provide recovery action"
    examples: ["Test failure", "Missing dependency"]
    recovery: "Attempt remediation automatically"
    
  level_3_critical:
    description: "Must-stop conditions"
    response: "HALT execution + detailed error report"
    examples: ["Security violation", "Governance bypass", "Data corruption"]
    recovery: "No automatic recovery - manual intervention required"

# Checkpoint & Resumption
checkpoints:
  
  checkpoint_frequency:
    interval: 15  # Every 15 minutes of execution
    
  checkpoint_data:
    - current_phase
    - completed_subtasks
    - test_status
    - artifacts_generated
    - last_git_commit
    - estimated_time_remaining
    
  resumption:
    method: "Load checkpoint + continue from last known state"
    validation: "Verify checkpoint integrity before resuming"
    gap_recovery: "Re-run last 3 minutes of work if gap detected"

# Completion Report
completion_report:
  
  sections:
    - phase_timeline: "What phases completed + duration each"
    - test_results: "Pass/fail breakdown by category"
    - artifacts: "Files created/modified + line counts"
    - metrics: "Code coverage, performance, quality metrics"
    - audit_trail: "AC markers + checkpoint history"
    - next_actions: "What needs to be done next"
    
  format: "Inline markdown in chat (no file generation)"
  delivery: "Show in response header + summary section"

# User Communication During Silent Mode
user_communication:
  
  when_to_communicate:
    frequency: "Every 30 minutes of execution"
    type: "Brief progress update (1-2 sentences max)"
    format: "Progress bar + status line"
    
  when_NOT_to_communicate:
    - "During execution (unless checkpoints)"
    - "For every small step"
    - "Seeking approval (it's silent mode!)"
    
  final_communication:
    when: "At completion"
    format: "Completion report with metrics"
    include: "Success status + test results + next steps"

# Silent Mode Activation Checklist
activation_checklist:
  
  pre_activation:
    - "User explicitly said 'proceed' or 'continue'"
    - "User understood implications (no interruptions)"
    - "Environment validation passed"
    - "Git checkpoint ready"
    
  during_execution:
    - "Progress bars updated every 5% OR 5 minutes"
    - "Checkpoint logged every 15 minutes"
    - "AC markers embedded in code"
    - "No user prompts issued"
    
  post_completion:
    - "All tests passing"
    - "Audit trail complete"
    - "Changes committed"
    - "Completion report generated"

metadata:
  phase: "Phase D - Agent Consolidation"
  status: "ACTIVE"
  coverage: "Silent autonomous execution principles"
