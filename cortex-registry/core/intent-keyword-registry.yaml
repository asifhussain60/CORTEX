  - intent: VACUUM
    keywords:
      - "vacuum"
      - "cleanup"
      - "clean workspace"
      - "remove clutter"

  - intent: ONBOARD
    keywords:
      - "onboard"
      - "explore repo"
      - "understand codebase"

  - intent: DISTILL
    keywords:
      - "distill"
      - "summarize chat"
      - "extract prompt"

  - intent: QUERY
    keywords:
      - "what is"
      - "how does"
      - "explain"
      - "describe"
