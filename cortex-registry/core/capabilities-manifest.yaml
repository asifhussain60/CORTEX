# ─────────────────────────────────────────────────
# WORKFLOW TEMPLATES
# ─────────────────────────────────────────────────
workflows:
  template_registry: cortex-registry/workflows/templates/
  pipeline_4stage:
    name: MasterOrchestrator 4-Stage Pipeline
    stages:
      - stage: 1
        name: Interaction
        orchestrator: InteractionOrchestrator
        description: Comprehend request, display Definition of Ready (DoR)
      - stage: 2
        name: Intent
        orchestrator: IntentRouter
        description: Classify via IntentRouter, route to domain orchestrator
      - stage: 3
        name: Intelligence
        orchestrator: UnifiedIntelligenceProvider
        description: LENS analysis (Language → Examination → Navigation → Synthesis)
      - stage: 4
        name: Execution
        orchestrator: domain_orchestrator
        description: Delegate to domain orchestrator, emit AC markers, persist traces
  execution_modes:
    AUDIT:
      orchestrator: AuditCoordinator
      stages: [Stage0, ProductionScan, WiringValidation, HealthCheck, Vacuum, MetaAudit, AutoFix, ReValidate, Tests]
      requires_mcp: true
    IMPLEMENT:
      orchestrator: TDDOrchestrator
      stages: [HolisticValidation, ChallengeGate, RED, GREEN, REFACTOR, Validate, Commit]
      requires_mcp: true
    FIX:
      orchestrator: TDDOrchestrator
      stages: [Reproduce, RootCause, RED, GREEN, REFACTOR, Regression]
      requires_mcp: true
    REFACTOR:
      orchestrator: RefactoringOrchestrator
      stages: [FunctionalBaseline, Baseline, LensScan, Plan, Execute, SecurityGate, Traceability, Scorecard]
      requires_mcp: true
    DIGEST:
      orchestrator: DigestCoordinator
      stages: [MarkerScore, Pipeline, Extract, Persist]
      requires_mcp: false

