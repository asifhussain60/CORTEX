  # --------------------------------------------------------------------------
  # CORE-064: Sweep Completeness Contract (Phase 16 — 2026-02-21)
  # --------------------------------------------------------------------------
  - rule_id: CORE-064
    principle: "No Partial Sweeps — Exhaust the Full Catalogue"
    category: quality_gates
    severity: blocked
    name: Sweep Completeness Contract
    created: "2026-02-21"
    phase_introduced: "phase-16"
    description: |
      AC_START: AC-P16-A-001
      Every FIX, REFACTOR, and AUDIT-with-fix operation MUST open a durable
      SweepCatalogue before routing and MUST NOT close the session (commit /
      "done" signal) until every catalogued item is either RESOLVED or explicitly
      approved as WONT-FIX with a justification and audit entry.

      Root Cause Addressed:
        Current pipeline fixes the top-N visible items per session but silently
        drops the long tail when the session closes. Next session starts cold with
        no memory of the outstanding backlog. CORE-064 closes this gap by making
        the catalogue durable (SQLite WAL at .cortex-runtime/sweeps/{sweep_id}.db)
        and by inserting blocking gates into MasterOrchestrator.

      FORBIDDEN BEHAVIOURS:
        - ❌ Closing a sweep (committing / signalling "done") when remaining > 0
        - ❌ Opening a new sweep on the same scope without checking for an existing
             open catalogue (prevents sweep-reset trick)
        - ❌ Deleting .cortex-runtime/sweeps/*.db files (VacuumOrchestrator guard)
        - ❌ Approving WONT-FIX without explicit justification + audit entry
        - ❌ Partial sweeps where top-N items are fixed and the rest silently dropped

      REQUIRED BEHAVIOURS:
        - ✅ SweepCatalogueOrchestrator.open_catalogue() called at MasterOrchestrator
             pre-routing gate for FIX, REFACTOR, AUDIT intents
        - ✅ Catalogue scans ALL in-scope files (not a sample)
        - ✅ Catalogue persisted to .cortex-runtime/sweeps/{sweep_id}.db (SQLite WAL)
        - ✅ SweepCatalogueOrchestrator.assert_exhausted() called at post-execution gate
        - ✅ BLOCK with numbered remaining-items list when open_count > 0
        - ✅ resume_open_catalogue() checks file-hash fingerprint before resuming
        - ✅ approve_wont_fix() requires non-empty justification + DoRApprovalGate approval
        - ✅ VacuumOrchestrator skips .cortex-runtime/sweeps/ entirely (CORE-064 guard)
        - ✅ HealthOrchestrator.health_check() validates SweepCatalogueOrchestrator L1 wiring
      AC_COMPLETE: AC-P16-A-001 ✅

    scope:
      applies_to:
        - "FIX intents — pre-routing gate opens catalogue, post-execution gate asserts exhausted"
        - "REFACTOR intents — same gates as FIX"
        - "AUDIT intents with fix flag — same gates"
        - "SweepCatalogueOrchestrator — canonical owner of catalogue lifecycle"
        - "MasterOrchestrator._pre_routing_gate() — open_catalogue() call-site"
        - "MasterOrchestrator._finalize_operation() — assert_exhausted() call-site"
        - "VacuumOrchestrator — must never delete .cortex-runtime/sweeps/*.db"

      exempt:
        - "QUERY intents — read-only, no catalogue needed"
        - "DESIGN intents — analysis only, no fix execution"
        - "PLAN intents — planning only"
        - "REPHRASE intents — token optimisation only"
        - "IMPLEMENT intents — TDD creates new items, not fixes existing catalogue"

    enforcement_mechanism:
      pre_routing_gate:
        location: "MasterOrchestrator._pre_routing_gate()"
        action: "Call SweepCatalogueOrchestrator.open_catalogue(intent, scope_files)"
        trigger_intents: ["FIX", "REFACTOR", "AUDIT"]
        on_existing_catalogue: "resume_open_catalogue() — show remaining count before proceeding"
      post_execution_gate:
        location: "MasterOrchestrator._finalize_operation()"
        action: "Call SweepCatalogueOrchestrator.assert_exhausted(sweep_id)"
        on_remaining_gt_zero: "BLOCK — surface numbered remaining-items list, refuse commit signal"
        on_remaining_zero: "PASS — close catalogue, allow commit"
      vacuum_guard:
        location: "VacuumOrchestrator scan exclusions"
        protected_path: ".cortex-runtime/sweeps/"
        action: "Skip entirely — never delete, move, or archive sweep catalogue files"
      health_check:
        location: "HealthOrchestrator.health_check()"
        action: "Import SweepCatalogueOrchestrator, verify health_check() callable"
        key_returned: "sweep_catalogue_wired: bool"

    wont_fix_protocol:
      requires:
        - "Non-empty justification string"
        - "DoRApprovalGate.approve() confirmation"
        - "AC_WONTFIX marker written to EnhancedAuditLogger"
      forbidden:
        - "Empty justification"
        - "Bulk WONT-FIX without per-item justification"

    storage:
      path: ".cortex-runtime/sweeps/{sweep_id}.db"
      format: "SQLite WAL (CORE-058 pattern)"
      resume_guard: "File-hash fingerprint — invalidate if >20% scope files changed"
      vacuum_exempt: true

    mcp_exposure:
      tool: "cortex_sweep_status"
      location: "cortex/mcp/tools/sweep_status_tool.py"
      returns: "open_items_count, sweep_id, next_items[] (top-5)"

    implementation:
      orchestrator: "SweepCatalogueOrchestrator"
      location: "cortex/orchestrators/support/sweep_catalogue_orchestrator.py"
      tier: "support"
      priority: 155
      wiring_file: "cortex-registry/core/specifications/support-orchestrator-wiring.yaml"

    tests:
      golden_test_file: "tests/golden/test_sweep_completeness_contract_truth.py"
      golden_tests_target: 20
      unit_tests:
        - "test_open_catalogue_creates_sqlite_db_in_cortex_runtime"
        - "test_open_catalogue_runs_full_enforcement_scan_on_scope"
        - "test_mark_resolved_decrements_open_count"
        - "test_assert_exhausted_returns_ok_when_all_resolved"
        - "test_assert_exhausted_returns_err_with_remaining_list_when_open"
        - "test_master_orchestrator_pre_routing_gate_opens_catalogue_for_fix_intent"
        - "test_master_orchestrator_pre_routing_gate_opens_catalogue_for_refactor_intent"
        - "test_master_orchestrator_finalize_blocks_when_remaining_greater_than_zero"
        - "test_master_orchestrator_finalize_passes_when_remaining_zero"
        - "test_core_064_registered_in_skull_rules_yaml"
        - "test_catalogue_persists_across_session_boundary_via_sqlite"
        - "test_resume_open_catalogue_returns_existing_manifest_for_same_scope"
        - "test_resume_open_catalogue_invalidates_on_scope_file_hash_drift"
        - "test_wont_fix_requires_justification_and_writes_audit_entry"
        - "test_wont_fix_without_justification_raises_value_error"
        - "test_cortex_sweep_status_tool_returns_open_items_count"
        - "test_cortex_sweep_status_tool_raises_when_no_open_catalogue"
        - "test_sweep_catalogue_orchestrator_health_check_returns_healthy"
        - "test_sweep_catalogue_orchestrator_wired_in_support_wiring_yaml_at_priority_155"
        - "test_end_to_end_fix_session_exhausts_catalogue_and_closes_cleanly"

    governance_dependency:
      requires: "CORE-008 (TDD), CORE-027 (Audit trail), CORE-048 (Holistic validation), CORE-058 (SQLite WAL)"
      enables: "Phase 16 Sweep Completeness — no partial sweeps across session boundaries"
      blocks_until: "SweepCatalogueOrchestrator implemented + MasterOrchestrator gates active"
      remediation_status: "🔵 IN_PROGRESS — Phase 16 implementation pending"

  # CORE-065: Holistic File Review Contract (Phase 64 — 2026-02-24)
  - rule_id: CORE-065
    tier: 0
    status: ACTIVE
    phase: 64
    created: "2026-02-24"
    name: Holistic File Review Contract
    severity: P0
    summary: >
      Every multi-file FIX, REFACTOR, IMPLEMENT, or AUDIT operation MUST
      perform a BEFORE/AFTER holistic file inventory via the
      holistic-file-review-gate workflow template. Prevents partial sweeps at
      the file-inventory level — complements CORE-064 which works at the
      issue-catalogue level. Enables autonomous execution across multiple VS
      Code GitHub Copilot Chat Sessions via SQLite-persisted sweep manifests.

    rationale: |
      Reviews 01–05 unanimously identified partial sweeps as the primary source
      of recurring regressions: CORE-064 catches when a catalogued issue is
      left open, but it cannot catch when a file that SHOULD be in scope was
      never added to the catalogue in the first place.
      Example: a REFACTOR touching orchestrator_base.py without also touching
      the 24 orchestrators that extend it — CORE-064 misses this because those
      24 files were never catalogued. CORE-065 catches it at GATE-2 (high-risk
      files not touched).

      Additionally, every review noted that "aspirational YAML" (S01–S25
      expected_audit_events) was never enforced in Python. CORE-065 mandates
      the BEFORE snapshot as machine-verifiable contract, not aspirational doc.

    applies_to:
      - "FIX intents — when files_affected >= 2"
      - "REFACTOR intents — always"
      - "IMPLEMENT intents — when files_affected >= 2"
      - "AUDIT intents — always"

    exempt:
      - "Single-file FIX with no cross-file references (blast_radius == 0)"
      - "QUERY / DIGEST / VACUUM / DESIGN / PLAN / REPHRASE (read-only or planning)"

    gates:
      GATE-1: "files_skipped_count == 0 (every in-scope file must be analyzed)"
      GATE-2: "high_risk_files_touched == high_risk_files_total (risk_score >= 0.4)"
      GATE-3: "post_lint_errors <= pre_lint_errors (no new lint errors introduced)"
      GATE-4: "test_count_after >= test_count_before (no test regression — CORE-008)"
      GATE-5: "sweep_catalogue.open_items_count == 0 (CORE-064 exhausted)"

    implementation:
      workflow_template: "cortex-registry/workflows/templates/governance/holistic-file-review-gate.yaml"
      pre_work_step: "LENSOrchestrator.scan_file_inventory(scope_files) → SQLite pre_work_snapshot"
      post_work_step: "LENSOrchestrator.scan_file_inventory(scope_files) → gate evaluation"
      persistence: ".cortex-runtime/sweeps/{sweep_id}.db (schema: holistic_review_sessions)"
      auto_injected_by: "TemplateComposer (index 0 of every sweep-required composed template)"
      enforced_by: "EnforcementOrchestrator pre-commit hook"

    multi_session_continuity:
      description: |
        The pre-work snapshot is persisted to SQLite. If a VS Code Copilot Chat
        Session ends mid-work, the next session resumes from step_last_completed.
        Resume trigger: 'resume sweep {sweep_id}'
        Resume protocol: SweepCatalogueOrchestrator.list_open_sweeps() checked at session start.
      session_pause_banner: "Rendered via copilot-chat-response-template.yaml § session_pause_banner"

    tests:
      golden_test_file: "tests/golden/workflow/test_holistic_file_review_golden.py"
      acceptance_criteria:
        - id: "AC-065-A"
          test_name: "test_gate1_blocks_when_files_skipped"
          assertion: "holistic-file-review-gate GATE-1 blocks AC_COMPLETE when any scope file was skipped"
        - id: "AC-065-B"
          test_name: "test_gate2_blocks_when_high_risk_file_untouched"
          assertion: "GATE-2 blocks when a file with risk_score >= 0.4 was not analyzed after the operation"
        - id: "AC-065-C"
          test_name: "test_pre_work_snapshot_persisted_to_sqlite"
          assertion: "pre_work_snapshot written to holistic_review_sessions table in sweep SQLite DB"
        - id: "AC-065-D"
          test_name: "test_session_resume_starts_at_last_completed_step"
          assertion: "new chat session with same sweep_id resumes at step_last_completed + 1"
        - id: "AC-065-E"
          test_name: "test_session_pause_banner_rendered_on_incomplete_exit"
          assertion: "session_pause_banner with sweep_id rendered when open_items_count > 0 at session end"
        - id: "AC-065-F"
          test_name: "test_template_composer_auto_injects_holistic_gate"
          assertion: "TemplateComposer injects holistic-file-review-gate at index 0 for all FIX/REFACTOR/IMPLEMENT/AUDIT composed templates"

    governance_dependency:
      requires: "CORE-064 (Sweep Completeness), CORE-008 (TDD), CORE-027 (Audit trail), CORE-049 (Silent autonomous)"
      enables: "Autonomous multi-session execution — each session resumes cleanly without restart"
      blocks_until: "holistic-file-review-gate.yaml wired into TemplateComposer and MasterOrchestrator._pre_routing_gate()"
      remediation_status: "🔵 PLANNED — Phase 64 implementation"
      AC_COMPLETE: "AC-P64-CORE065-001 (pending)"

  # CORE-066: Response Template Binding (Phase 64 — 2026-02-24)
  - rule_id: CORE-066
    tier: 0
    status: ACTIVE
    phase: 64
    created: "2026-02-24"
    name: Response Template Binding
    severity: P1
    summary: >
      Every user-visible output produced by a CORTEX workflow step in a VS Code
      GitHub Copilot Chat Session MUST be rendered through the canonical
      copilot-chat-response-template workflow template. Raw dict output, ad-hoc
      text, or unstructured markdown from workflow steps is a P1 governance
      violation. SSOT for format: .github/templates/cortex-response-templates.md.

    rationale: |
      Reviews 01–05 found inconsistent response formatting as a cross-cutting
      issue: some orchestrators emitted raw text, some skipped the canonical
      Author/Orchestrator header, pre/post work manifests had no standard schema,
      and session pause banners were ad-hoc. This creates a documentation-reality
      gap (anti-pattern #4 from copilot-reviews-consolidated.md) in the UX layer.
      CORE-066 makes the response format a governed contract, not a convention.

    applies_to:
      - "All workflow template steps that produce user-visible output"
      - "All MCP tool responses (cortex_vacuum, cortex_knowledge, cortex_refactor, etc.)"
      - "All orchestrator responses routed through MasterOrchestrator"
      - "Pre-work manifest, post-work diff, violations table, stage table, session pause banner"

    exempt:
      - "Terminal output (stdout) — unformatted is acceptable"
      - "SQLite writes — internal, not user-visible"
      - "Log lines — internal, not user-visible"

    required_sections:
      always: ["header"]
      for_multi_step: ["progress_bar"]
      for_pre_work: ["pre_work_manifest"]
      for_post_work: ["post_work_diff", "gate_results"]
      for_audit: ["violations_table"]
      for_paused_session: ["session_pause_banner"]

    header_contract:
      format: "**Author:** {author} | **Orchestrator:** {orchestrator_name} ✅ | **Mode:** {execution_mode} | {timestamp}"
      author_ssot: "Asif Hussain"
      auto_fix: "Restore from SSOT when author field is missing or incorrect"

    implementation:
      workflow_template: "cortex-registry/workflows/templates/governance/copilot-chat-response-template.yaml"
      ssot: ".github/templates/cortex-response-templates.md"
      validator: "ResponseTemplateValidator (post-step hook in workflow engine)"
      auto_fix: "Wrap raw output in nearest matching section template"

    tests:
      golden_test_file: "tests/golden/response/test_response_templates_golden.py"
      acceptance_criteria:
        - id: "AC-066-A"
          test_name: "test_implement_mode_response_has_canonical_header"
          assertion: "IMPLEMENT response includes '**Author:** Asif Hussain | **Orchestrator:** TDDOrchestrator ✅'"
        - id: "AC-066-B"
          test_name: "test_all_modes_have_progress_bar"
          assertion: "all 14 execution modes (13 + GOLDEN_TEST) produce response with exactly 10-block progress bar"
        - id: "AC-066-C"
          test_name: "test_audit_mode_response_has_violations_table"
          assertion: "AUDIT response with violations produces inline P0/P1/P2 violations table"
        - id: "AC-066-D"
          test_name: "test_session_pause_banner_present_on_incomplete_sweep"
          assertion: "session_pause_banner rendered as last output when sweep has open_items > 0"
        - id: "AC-066-E"
          test_name: "test_raw_dict_output_is_p1_violation"
          assertion: "ResponseTemplateValidator raises P1 when any workflow step emits raw dict"
        - id: "AC-066-F"
          test_name: "test_mcp_tool_responses_use_response_template"
          assertion: "cortex_vacuum, cortex_knowledge, cortex_refactor responses pass ResponseTemplateValidator"

    governance_dependency:
      requires: "CORE-002 (All output inline), CORE-049 (Silent autonomous)"
      enables: "Consistent user experience across all 14 execution modes and all 26 MCP tools"
      blocks_until: "copilot-chat-response-template.yaml wired into WorkflowEngine post-step hook"
      remediation_status: "🔵 PLANNED — Phase 64 implementation"
      AC_COMPLETE: "AC-P64-CORE066-001 (pending)"

  # --------------------------------------------------------------------------
  # CORE-067: Template & Knowledge Genericness Contract (2026-02-26)
  # --------------------------------------------------------------------------
  - rule_id: CORE-067
    tier: 0
    status: ACTIVE
    phase: 81
    created: "2026-02-26"
    name: Template & Knowledge Genericness Contract
    severity: P0
    principle: "Patterns Are Universal, Examples Are Contextual"
    category: architecture_integrity
    summary: >
      ALL workflow templates, knowledge entries, Python source, and agent
      specifications MUST be app-agnostic. App-specific data (repo names,
      smell IDs, file paths) belongs ONLY in cortex-sts/ and
      cortex-registry/company/repos/. Generic artefacts must use universal
      pattern identifiers, not app-specific taxonomy.

    rationale: |
      Phase 23 introduced 8 workflow templates with direct references to
      "BadMonolith", app-specific smell IDs (SMELL-1..25), and hardcoded
      sample-app paths. These references make templates structurally dependent
      on one training corpus app instead of being universally reusable.
      CORTEX templates must work for ANY codebase, not just the one that
      inspired their creation. This is the difference between a framework
      and a one-off script.

    applies_to:
      - "cortex-registry/workflows/templates/**/*.yaml — ALL workflow templates"
      - "cortex-registry/knowledge/**/*.yaml — ALL knowledge entries"
      - "cortex/**/*.py — ALL Python source code"
      - ".github/agents/**/*.md — ALL agent specifications"
      - ".github/prompts/**/*.md — ALL prompt specifications"

    exempt:
      - "cortex-sts/ — STS training corpus (app-specific data lives here)"
      - "cortex-registry/company/repos/ — registered repo profiles (app-specific by design)"
      - "cortex-registry/knowledge-base/repositories/ — repo-specific knowledge profiles"
      - "cortex-registry/_cortex-master/playbooks/ — playbook instances tied to repos"
      - "tests/ — test fixtures may reference sample apps for assertions"

    forbidden_in_generic_artefacts:
      data_fields:
        - "source: BadMonolith-analysis (or any app name as data value)"
        - "smells_addressed: [SMELL-1, ...] (app-specific smell taxonomy)"
        - "Hardcoded sample-app paths in reusable_for or metadata"
        - "App-specific repo names in workflow step descriptions"
      comments:
        - "App names in header comments are tolerated as provenance markers"
        - "BUT should use: 'Inspired by: training-corpus analysis' not app name"

    required_in_generic_artefacts:
      pattern_identifiers:
        - "sql-injection (not SMELL-1)"
        - "hardcoded-secrets (not SMELL-2)"
        - "god-class (not SMELL-3)"
        - "circular-dependency (not SMELL-5)"
        - "no-pagination (not SMELL-6)"
        - "dead-code (not SMELL-8)"
        - "duplicate-logic (not SMELL-10)"
        - "trivial-tests (not SMELL-12)"
        - "cors-wildcard (not SMELL-13)"
        - "no-retry-pattern (not SMELL-14)"
        - "magic-numbers (not SMELL-15)"
        - "global-mutable-state (not SMELL-16)"
        - "no-dependency-injection (not SMELL-17)"
        - "stack-trace-exposure (not SMELL-18)"
        - "missing-model-validation (not SMELL-19)"
        - "missing-audit-fields (not SMELL-20)"
        - "any-type-abuse (not SMELL-22)"
        - "business-logic-in-ui (not SMELL-23)"
        - "no-service-layer (not SMELL-24)"
        - "no-error-handling (not SMELL-25)"
      metadata_fields:
        - "source: training-corpus (not app name)"
        - "patterns_addressed: [sql-injection, ...] (generic IDs)"
        - "reusable_for: description only, no hardcoded paths"

    boundary_rule:
      app_specific_data_lives_in:
        - "cortex-sts/{vendor}/{app}/ — training corpus"
        - "cortex-registry/company/repos/{name}/ — registered profiles"
        - "cortex-registry/knowledge-base/repositories/{name}.yaml — repo knowledge"
      generic_patterns_live_in:
        - "cortex-registry/workflows/templates/ — reusable workflows"
        - "cortex-registry/knowledge/ — domain knowledge"
        - "cortex/ — Python source"
        - ".github/agents/ — agent specs"

    enforcement:
      pre_commit:
        description: "Scan protected paths for app-specific tokens"
        check_command: |
          grep -rn 'BadMonolith\|FinTrack\|CortexLabs\|SampleLegacyApp' \
            cortex-registry/workflows/templates/ \
            cortex-registry/knowledge/ \
            cortex/ \
            --include='*.yaml' --include='*.py' \
            | grep -v '^.*:#'
        expected_count: 0
      validator: "cortex/governance/validators/template_genericness_validator.py"
      severity_on_bypass: blocked
      audit_event: "TEMPLATE_GENERICNESS_VALIDATED"

    cleanup_protocol:
      description: |
        When CORE-067 is first registered, a one-time cleanup sweep MUST be
        executed to remediate all pre-existing violations. This sweep:
        1. Replaces source: {app-name}-analysis → source: training-corpus
        2. Replaces smells_addressed: [SMELL-*] → patterns_addressed: [generic-id]
        3. Replaces hardcoded sample-app paths → parameterised descriptions
        4. Updates header comments to use generic provenance markers
        5. Sanitises Python docstring examples to use generic paths
      initial_violation_count: 38
      initial_files_affected: 8
      sweep_id: "SWEEP-81-CORE067-GENERICNESS"

    tests:
      golden_test_file: "tests/golden/governance/test_core_067_genericness_golden.py"
      acceptance_criteria:
        - id: "AC-067-A"
          test_name: "test_no_app_names_in_workflow_templates"
          assertion: "Zero matches for app-specific tokens in cortex-registry/workflows/templates/"
        - id: "AC-067-B"
          test_name: "test_no_smell_ids_in_workflow_templates"
          assertion: "Zero SMELL-{N} references in workflow template data fields"
        - id: "AC-067-C"
          test_name: "test_no_app_names_in_python_source"
          assertion: "Zero app-specific tokens in cortex/**/*.py (excluding test fixtures)"
        - id: "AC-067-D"
          test_name: "test_knowledge_entries_use_generic_ids"
          assertion: "Knowledge YAML files use generic pattern IDs, not app-specific smell IDs"

    governance_dependency:
      requires: "CORE-035 (Single Canonical Implementation), CORE-005 (Path Portability)"
      enables: "Universal template reusability across any training corpus"
      blocks_until: "Initial cleanup sweep completed (SWEEP-81-CORE067-GENERICNESS)"
      remediation_status: "🔵 CLEANUP IN PROGRESS — initial 38 violations being remediated"

