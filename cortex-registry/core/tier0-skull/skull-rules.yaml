schema_version: '1.0'
governance_tier: 0
category: CORTEX_CORE
precedence: HIGHEST

metadata:
  rule_count: 36
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."
