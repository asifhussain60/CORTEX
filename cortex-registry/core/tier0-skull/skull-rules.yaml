  version: "1.0"
  consolidation_date: "2026-02-21"
  consolidation_status: "Phase 16 - CORE-064 Sweep Completeness Contract registered (partial sweep prevention)"
  naming_system: "Dual naming - CORE-* (canonical ID) + Business Principle (human-readable alias)"

categories:
