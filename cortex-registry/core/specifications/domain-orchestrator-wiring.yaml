# Domain Orchestrators Wiring Specification
# AC-ID: AC-WIRING-DOMAIN-001
# Purpose: Declarative registration of 5-6 domain orchestrators (CORE-031 compliance)

module_name: domain_orchestrators
version: "1.1.0"
description: "Domain orchestrators: Refactoring, Planning, Domain, Coherence, Upgrade"

dependencies:
  - name: core_orchestrators
    version: ">=1.0.0"
    required: true
    internal: true
    
  - name: governance_registry
    version: ">=1.0.0"
    required: true
    internal: false
    
  - name: business_knowledge_repository
    version: ">=1.0.0"
    required: true
    internal: false

provides:
  - name: RefactoringOrchestrator
    category: DOMAIN
    description: "Manages code refactoring workflows"
    entry_point: "cortex.orchestrators.domain.refactoring_orchestrator:RefactoringOrchestrator"
    features:
      - code_analysis
      - refactoring_patterns
      - quality_metrics
    dependencies:
      - TDDOrchestrator
      - governance_registry
    
  - name: PlanningOrchestrator
    category: DOMAIN
    description: "Manages planning and roadmap orchestration"
    entry_point: "cortex.orchestrators.domain.planning_orchestrator:PlanningOrchestrator"
    features:
      - task_planning
      - resource_allocation
      - timeline_management
    dependencies:
      - WorkflowOrchestrator
      - state_manager
    
  - name: DomainOrchestrator
    category: DOMAIN
    description: "Manages domain-specific logic"
    entry_point: "cortex.orchestrators.domain.domain_orchestrator:DomainOrchestrator"
    features:
      - domain_model_management
      - business_rules_engine
      - domain_events
    dependencies:
      - business_knowledge_repository

  - name: EnhancedPlanningOrchestrator
    category: DOMAIN
    description: "Enhanced planning orchestrator — extends PlanningOrchestrator with LENS + OPJ integration"
    entry_point: "cortex.orchestrators.domain.enhanced_planning_orchestrator:EnhancedPlanningOrchestrator"
    features:
      - lens_enhanced_planning
      - opj_consultation
      - multi_phase_planning
    dependencies:
      - PlanningOrchestrator
    phase_added: "62-G"

  - name: ServiceDecompositionOrchestrator
    category: DOMAIN
    description: "Service decomposition — breaks monolith services into bounded contexts"
    entry_point: "cortex.orchestrators.domain.service_decomposition_orchestrator:ServiceDecompositionOrchestrator"
    features:
      - monolith_decomposition
      - bounded_context_extraction
      - dependency_mapping
    phase_added: "62-G"

  - name: DashboardOrchestrator
    category: DOMAIN
    description: "Dashboard generation orchestrator — HTML/CSS static dashboard pipeline"
    entry_point: "cortex.orchestrators.domain.dashboard_orchestrator:DashboardOrchestrator"
    features:
      - dashboard_generation
      - static_html_pipeline
      - data_embedding
    phase_added: "62-G"

initialization_order: 20

conflict_resolution:
  "DuplicateOrchestrator": "use_latest_version"
  "MissingDependency": "fail_fast"

metadata:
  maintained_by: "CORTEX Domain Team"
  last_updated: "2026-02-24"
  git_commit: "phase-58-61-simplification"
  status: "active"
  change_summary: "Phase 62-G: Added EnhancedPlanningOrchestrator, ServiceDecompositionOrchestrator, DashboardOrchestrator. Phase 58-61: Removed BusinessDomainOrchestrator (source deleted in Phase 58-f — zero callers, abstract base with no concrete subclasses)."
