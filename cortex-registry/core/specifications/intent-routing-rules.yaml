---
# routing-rules-intent: Intent Classification & Routing Rules
# Authority: CORTEX Architecture (AC-PERMANENT-FIX-010 Phase 2)
# Version: 1.0
# Purpose: Machine-readable routing rules for intent classification
#          (CORE-040-001: No hardcoded if/elif logic)

routing_rules:
  created: "2026-01-26"
  authority: "CORTEX Architecture"
  description: |
    Intent classification and routing rules for CORTEX operations.
    Replaces hardcoded IMPLEMENT_KEYWORDS, FIX_KEYWORDS, etc.
    in IntentRouter with declarative YAML specifications.

  intents:
    # IMPLEMENT Intent (Create new functionality)
    - id: "intent_implement"
      name: "Implementation"
      keywords:
        - "create"
        - "add"
        - "new"
        - "implement"
        - "develop"
        - "build"
        - "feature"
        - "functionality"
      handler: "TDDOrchestrator"
      confidence_threshold: 0.75
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-008"  # TDD (tests before code)
        - "CORE-011"  # Type hints
        - "CORE-012"  # Docstrings
      description: |
        Implementation operations create new functionality.
        Requires TDD workflow with test-first approach.
      example_operations:
        - "implement_feature"
        - "create_module"
        - "add_capability"

    # FIX Intent (Resolve bugs/issues)
    - id: "intent_fix"
      name: "Bug Fix"
      keywords:
        - "fix"
        - "bug"
        - "issue"
        - "error"
        - "problem"
        - "crash"
        - "broken"
        - "defect"
      handler: "TDDOrchestrator"
      confidence_threshold: 0.70
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-008"  # TDD
        - "CORE-013"  # No bare except
      description: |
        Fix operations resolve bugs and issues.
        Uses TDD with regression test requirements.
      example_operations:
        - "fix_bug"
        - "fix_issue"
        - "hotfix"

    # REFACTOR Intent (Improve existing code)
    - id: "intent_refactor"
      name: "Code Refactoring"
      keywords:
        - "refactor"
        - "improve"
        - "clean"
        - "optimize"
        - "restructure"
        - "simplify"
        - "consolidate"
      handler: "RefactoringOrchestrator"
      confidence_threshold: 0.72
      fallback_handler: "TDDOrchestrator"
      governance_rules:
        - "CORE-008"  # TDD
        - "CORE-035"  # No duplicates
      description: |
        Refactoring improves code quality without changing behavior.
        Requires equivalence testing.
      example_operations:
        - "refactor_module"
        - "optimize_performance"
        - "cleanup_code"

    # ANALYZE Intent (Investigate/review)
    - id: "intent_analyze"
      name: "Analysis & Review"
      keywords:
        - "analyze"
        - "review"
        - "investigate"
        - "audit"
        - "inspect"
        - "examine"
        - "check"
      handler: "MasterOrchestrator"
      confidence_threshold: 0.68
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-030"  # Implementation truth
      description: |
        Analysis operations review and investigate code/systems.
        Returns analysis results without modifications.
      example_operations:
        - "analyze_codebase"
        - "review_coverage"
        - "audit_compliance"

    # DOCUMENT Intent (Generate documentation)
    - id: "intent_document"
      name: "Documentation"
      keywords:
        - "document"
        - "doc"
        - "guide"
        - "write"
        - "create documentation"
        - "explain"
      handler: "DocumentationOrchestrator"
      confidence_threshold: 0.70
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-012"  # Docstrings
        - "CORE-028"  # Filename conventions
      description: |
        Documentation operations create/update documentation.
        Maintains docs in docs/ directory only (CORE-038).
      example_operations:
        - "generate_docs"
        - "update_documentation"
        - "create_guide"

    # TEST Intent (Create or run tests)
    - id: "intent_test"
      name: "Testing"
      keywords:
        - "test"
        - "testing"
        - "unittest"
        - "pytest"
        - "validate"
        - "verify"
      handler: "TDDOrchestrator"
      confidence_threshold: 0.75
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-008"  # TDD
      description: |
        Test operations create or run test suites.
        Uses TDD orchestrator for test generation.
      example_operations:
        - "generate_tests"
        - "run_tests"
        - "coverage_analysis"

    # DEPLOY Intent (Deployment operations)
    - id: "intent_deploy"
      name: "Deployment"
      keywords:
        - "deploy"
        - "release"
        - "rollout"
        - "publish"
        - "promote"
      handler: "MasterOrchestrator"
      confidence_threshold: 0.80
      fallback_handler: null
      governance_rules:
        - "CORE-026"  # Git checkpoints
        - "CORE-027"  # Audit trail
      description: |
        Deployment operations release code to production.
        Requires governance validation and audit trail.
      example_operations:
        - "deploy_staging"
        - "deploy_production"
        - "rollback"

    # GOVERNANCE Intent (Governance/policy operations)
    - id: "intent_governance"
      name: "Governance"
      keywords:
        - "governance"
        - "rule"
        - "policy"
        - "enforce"
        - "mandate"
        - "compliance"
      handler: "MasterOrchestrator"
      confidence_threshold: 0.85
      fallback_handler: null
      governance_rules:
        - "CORE-026"  # Git checkpoints
        - "CORE-027"  # Audit trail
      description: |
        Governance operations manage policies and rules.
        Requires explicit authorization and audit trail.
      example_operations:
        - "add_governance_rule"
        - "enforce_policy"
        - "compliance_check"

    # QUERY Intent (Information lookup / Q&A)
    - id: "intent_query"
      name: "Query"
      keywords:
        - "query"
        - "ask"
        - "what is"
        - "how does"
        - "explain"
        - "tell me"
        - "lookup"
        - "search"
      handler: "InteractionOrchestrator"
      confidence_threshold: 0.65
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-012"
      description: |
        Query operations answer questions about the codebase.
      example_operations:
        - "query_codebase"
        - "ask_question"

    # VALIDATE Intent (Validate / verify / lint)
    - id: "intent_validate"
      name: "Validation"
      keywords:
        - "validate"
        - "validation"
        - "verify"
        - "lint"
        - "assert"
        - "certify"
        - "schema validation"
      handler: "EnforcementOrchestrator"
      confidence_threshold: 0.72
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-048"
      description: |
        Validation operations verify code quality and compliance.
      example_operations:
        - "validate_schema"
        - "lint_code"
        - "verify_contract"

    # MIGRATE Intent (Data/schema migration)
    - id: "intent_migrate"
      name: "Migration"
      keywords:
        - "migrate"
        - "migration"
        - "port"
        - "convert"
        - "transition"
        - "alembic"
        - "data migration"
      handler: "MasterOrchestrator"
      confidence_threshold: 0.75
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-008"
        - "CORE-026"
      description: |
        Migration operations port data or schemas between environments.
      example_operations:
        - "migrate_schema"
        - "port_module"
        - "convert_format"

    # ONBOARD Intent (Repository onboarding)
    - id: "intent_onboard"
      name: "Repository Onboarding"
      keywords:
        - "onboard"
        - "onboarding"
        - "bootstrap"
        - "initialize"
        - "register"
        - "discover"
        - "inventory"
      handler: "RepositoryOnboardingOrchestrator"
      confidence_threshold: 0.80
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-012"
      description: |
        Onboard a new repository with LENS analysis and SQLite dashboard.
      example_operations:
        - "onboard_repo"
        - "bootstrap_project"

    # PLAN Intent (Planning and roadmap)
    - id: "intent_plan"
      name: "Planning"
      keywords:
        - "plan"
        - "phase"
        - "roadmap"
        - "schedule"
        - "planning"
        - "cortex change"
        - "cortex enhancement"
      handler: "PlanningOrchestrator"
      confidence_threshold: 0.75
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-008"
      description: |
        Planning operations define phases and roadmaps.
      example_operations:
        - "create_phase"
        - "update_roadmap"

    # AUDIT Intent (Production readiness scan)
    - id: "intent_audit"
      name: "Audit"
      keywords:
        - "audit"
        - "production readiness"
        - "repo health"
        - "scan for issues"
        - "/audit"
        - "scan repo"
      handler: "HealthOrchestrator"
      confidence_threshold: 0.80
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-064"
      description: |
        Audit runs the 9-stage production readiness pipeline.
      example_operations:
        - "audit_fix"
        - "production_scan"

    # DESIGN Intent (Architecture / blueprinting)
    - id: "intent_design"
      name: "Design"
      keywords:
        - "design"
        - "architect"
        - "architecture"
        - "blueprint"
        - "system design"
        - "design pattern"
      handler: "ArchitectOrchestrator"
      confidence_threshold: 0.80
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-012"
      description: |
        Design operations produce architectural blueprints.
      example_operations:
        - "design_system"
        - "architect_module"

    # DIGEST Intent (Content ingestion / summarisation)
    - id: "intent_digest"
      name: "Digest"
      keywords:
        - "digest"
        - "summarize"
        - "summarise"
        - "recap"
        - "tl;dr"
        - "synthesize"
        - "what happened"
      handler: "DigestSessionOrchestrator"
      confidence_threshold: 0.78
      fallback_handler: "InteractionOrchestrator"
      governance_rules:
        - "CORE-002"
      description: |
        Digest operations ingest and summarise content.
      example_operations:
        - "digest_file"
        - "summarize_session"

    # REPHRASE Intent (Token optimisation / prompt rewriting)
    - id: "intent_rephrase"
      name: "Rephrase"
      keywords:
        - "rephrase"
        - "reword"
        - "token optimize"
        - "make this concise"
        - "compact this"
      handler: "RequestRephraseOrchestrator"
      confidence_threshold: 0.80
      fallback_handler: "InteractionOrchestrator"
      governance_rules: []
      description: |
        Rephrase operations rewrite requests for token efficiency.
      example_operations:
        - "rephrase_request"
        - "optimize_prompt"

    # INVESTIGATE Intent (Deep investigation / root-cause without RCA methodology)
    - id: "intent_investigate"
      name: "Investigation"
      keywords:
        - "investigate"
        - "why is"
        - "what causes"
        - "deep analysis"
        - "find the cause"
      handler: "InvestigationOrchestrator"
      confidence_threshold: 0.78
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-012"
      description: |
        Investigation operations perform deep dives without full RCA methodology.
      example_operations:
        - "investigate_issue"
        - "deep_dive"

    # GOLDEN_TEST Intent (Golden test lifecycle)
    - id: "intent_golden_test"
      name: "Golden Test"
      keywords:
        - "golden test"
        - "golden tests"
        - "workflow template"
        - "trace assertion"
        - "acceptance criteria"
        - "e2e scenario"
      handler: "TDDOrchestrator"
      confidence_threshold: 0.88
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-008"
      description: |
        Golden test operations manage E2E scenario lifecycle.
      example_operations:
        - "create_golden_test"
        - "validate_golden_scenario"

    # DEBUG Intent (Multi-stack debugging — Phase 86)
    - id: "intent_debug"
      name: "Debug"
      keywords:
        - "debug"
        - "/debug"
        - "/debug-inject"
        - "/debug-cleanup"
        - "diagnose"
        - "debugger"
        - "marker injection"
        - "cortex debug"
      handler: "DebuggerOrchestrator"
      confidence_threshold: 0.88
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-049"
      description: |
        Debug operations inject markers, capture logs, and generate fix plans.
        Uses 8 injection strategies (3 Python + 5 multi-stack).
      example_operations:
        - "debug_file"
        - "inject_markers"
        - "debug_cleanup"

    # HEALTH Intent (Orchestrator health — all 22)
    - id: "intent_health"
      name: "Health Check"
      keywords:
        - "health"
        - "/health"
        - "/healthcheck"
        - "orchestrator health"
        - "orchestrator status"
        - "22 orchestrators"
        - "service health"
      handler: "HealthOrchestrator"
      confidence_threshold: 0.85
      fallback_handler: "MasterOrchestrator"
      governance_rules: []
      description: |
        Health operations check all 22 orchestrator health endpoints.
      example_operations:
        - "health_check"
        - "orchestrator_status"

    # SYNC Intent (Cross-repo privacy-safe sync)
    - id: "intent_sync"
      name: "Sync"
      keywords:
        - "sync"
        - "/sync"
        - "sync to company"
        - "cross-repo sync"
        - "privacy-safe"
        - "one-way sync"
      handler: "GitOrchestrator"
      confidence_threshold: 0.85
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-026"
      description: |
        Sync operations push CORTEX content to company repos with privacy sanitisation.
      example_operations:
        - "sync_to_company"
        - "cross_repo_sync"

    # TRAIN Intent (Gap-driven template evolution)
    - id: "intent_train"
      name: "Train"
      keywords:
        - "train"
        - "/train"
        - "learn from repo"
        - "evolve templates"
        - "gap-driven training"
        - "pattern training"
      handler: "TrainerOrchestrator"
      confidence_threshold: 0.88
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-008"
      description: |
        Train operations evolve CORTEX templates via gap-driven learning.
      example_operations:
        - "train_from_codebase"
        - "evolve_templates"

    # TOTALRECALL Intent (7-phase holistic production readiness refactor)
    - id: "intent_totalrecall"
      name: "Total Recall"
      keywords:
        - "totalrecall"
        - "total recall"
        - "/totalrecall"
        - "holistic refactor"
        - "7-phase protocol"
        - "production readiness refactor"
        - "everything is broken"
      handler: "MasterOrchestrator"
      confidence_threshold: 0.90
      fallback_handler: null
      governance_rules:
        - "CORE-064"
      description: |
        TotalRecall runs the 7-phase holistic production readiness refactor protocol.
      example_operations:
        - "totalrecall"
        - "holistic_refactor"

    # RCA Intent (Root Cause Analysis — Phase 87, 4 methodologies)
    - id: "intent_rca"
      name: "Root Cause Analysis"
      keywords:
        - "rca"
        - "/rca"
        - "root cause analysis"
        - "root cause"
        - "five whys"
        - "fishbone"
        - "ishikawa"
        - "fault tree"
        - "causal chain"
        - "why did it fail"
      handler: "InvestigationOrchestrator"
      confidence_threshold: 0.88
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-012"
      description: |
        RCA operations run structured root cause analysis using 4 methodologies:
        Five-Whys, Fishbone (Ishikawa), Fault-Tree, Causal-Chain.
        Results stored in .cortex-runtime/traces/rca.db.
      example_operations:
        - "rca_analysis"
        - "five_whys"
        - "fishbone_analysis"

    # VACUUM Intent (Markdown sprawl + root clutter cleanup)
    - id: "intent_vacuum"
      name: "Vacuum"
      keywords:
        - "vacuum"
        - "/vacuum"
        - "cortex vacuum"
        - "markdown sprawl"
        - "root clutter"
        - "cleanup"
        - "clean up"
        - "prune"
      handler: "VacuumOrchestrator"
      confidence_threshold: 0.85
      fallback_handler: "MasterOrchestrator"
      governance_rules:
        - "CORE-002"
      description: |
        Vacuum operations clean up markdown sprawl and root-level clutter.
        Managed by VacuumOrchestrator (was incorrectly returning REFACTOR — GAP-90-07 fixed).
      example_operations:
        - "vacuum"
        - "cleanup_repo"
        - "remove_clutter"

  # Fallback strategy when confidence is below threshold
  fallback_strategy:
    description: "Route to InteractionOrchestrator for clarification"
    ask_user: true
    timeout_seconds: 300
    
  # Intent detection algorithm parameters
  detection_algorithm:
    method: "keyword_matching"
    case_sensitive: false
    whole_word_match: true
    fuzzy_match: false
    min_confidence_for_action: 0.65
    
  # Cross-references
  related_specs:
    - "orchestrator-dispatch-table.yaml"
    - "execution-flow-definitions.yaml"
    - "governance-gates-validation.yaml"
