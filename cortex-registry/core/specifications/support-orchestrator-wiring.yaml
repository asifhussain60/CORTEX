# Support Orchestrators Wiring Specification
# AC-ID: AC-WIRING-SUPPORT-001
# Purpose: Declarative registration of 6 support orchestrators (CORE-031 compliance)

module_name: support_orchestrators
version: "1.1.0"
description: "Support orchestrators: Onboarding, Upgrade, Rollback, Setup, Health, Sweep, Vacuum"

dependencies:
  - name: core_orchestrators
    version: ">=1.0.0"
    required: true
    internal: true
    
  - name: governance_registry
    version: ">=1.0.0"
    required: true
    internal: false
    
  - name: documentation_system
    version: ">=1.0.0"
    required: false
    internal: false

provides:
  - name: OnboardingOrchestrator
    category: SUPPORT
    description: "Manages onboarding workflows"
    entry_point: "cortex.orchestrators.support.orchestrator:OnboardingOrchestrator"
    features:
      - setup_guidance
      - tutorial_management
      - configuration_wizards
    dependencies:
      - governance_registry
    
  - name: UpgradeOrchestrator
    category: SUPPORT
    description: "Manages system upgrades"
    entry_point: "cortex.orchestrators.support.upgrade_orchestrator:UpgradeOrchestrator"
    features:
      - version_checking
      - migration_planning
      - upgrade_execution
    dependencies:
      - governance_registry
    
  - name: RollbackOrchestrator
    category: SUPPORT
    description: "Manages system rollbacks"
    entry_point: "cortex.orchestrators.support.rollback_orchestrator:RollbackOrchestrator"
    features:
      - snapshot_management
      - state_recovery
      - rollback_verification
    dependencies:
      - state_manager
    
  - name: SetupOrchestrator
    category: SUPPORT
    description: "Manages system setup and configuration"
    entry_point: "cortex.orchestrators.support.setup_orchestrator:SetupOrchestrator"
    features:
      - environment_setup
      - configuration_management
      - validation_checks
    dependencies:
      - governance_registry
    
  - name: HealthOrchestrator
    category: HEALTH
    description: "Holistic repository health scanner — diagnoses filesystem, naming, duplicates, deprecated markers, markdown location"
    entry_point: "cortex.orchestrators.health.health_orchestrator:HealthOrchestrator"
    features:
      - filesystem_integrity
      - naming_compliance
      - duplicate_detection
      - deprecated_marker_detection
      - markdown_location_check
      - agent_registration
      - handoff_generation
    health_check: true
    health_check_method: "health_check"
    health_check_returns: ["status", "orchestrator", "workspace_root", "agents_registered", "enabled"]
    dependencies:
      - VacuumOrchestrator
    priority: 160

  - name: SweepCatalogueOrchestrator
    category: SUPPORT
    class: SweepCatalogueOrchestrator
    description: "Durable sweep catalogue enforcing CORE-064 Sweep Completeness Contract — no partial sweeps across session boundaries"
    entry_point: "cortex.orchestrators.support.sweep_catalogue_orchestrator:SweepCatalogueOrchestrator"
    module: "cortex.orchestrators.support.sweep_catalogue_orchestrator"
    features:
      - open_catalogue
      - mark_resolved
      - assert_exhausted
      - resume_open_catalogue
      - approve_wont_fix
      - audit_trail
      - sqlite_wal_persistence
    health_check: true
    health_check_method: "health_check"
    health_check_returns: ["healthy", "storage_dir", "note"]
    governance_rule: "CORE-064"
    storage: ".cortex-runtime/sweeps/{sweep_id}.db"
    mcp_tool: "cortex_sweep_status (cortex/mcp/tools/sweep_status_tool.py)"
    dependencies:
      - MasterOrchestrator
    priority: 155

  - name: VacuumOrchestrator
    category: HEALTH
    description: "Standalone + companion remediation engine — dual-mode (standalone scan or handoff consumer) with rollback support"
    entry_point: "cortex.orchestrators.health.vacuum_orchestrator:VacuumOrchestrator"
    features:
      - standalone_remediation
      - companion_handoff_consumption
      - file_rename
      - file_delete
      - file_relocate
      - rollback_support
      - dry_run_mode
    health_check: true
    health_check_method: "health_check"
    health_check_returns: ["status", "orchestrator", "workspace_root"]
    dependencies: []
    priority: 150

initialization_order: 30

conflict_resolution:
  "DuplicateOrchestrator": "use_latest_version"
  "MissingDependency": "fail_fast"

metadata:
  maintained_by: "CORTEX Support Team"
  last_updated: "2026-02-23"
  git_commit: "phase-62-g-wiring-surface-expansion"
  status: "active"
  change_summary: "Phase 62-G: Registered 14 previously undocumented support orchestrators (AutoHealingMCPOrchestrator, BulkDigestOrchestrator, CortexDocsOrchestrator, DebuggerOrchestrator, DigestSessionOrchestrator, PhaseCompletionOrchestrator, RepositoryOnboardingOrchestrator, TestClassifierOrchestrator, UnifiedAnalysisOrchestrator, UnifiedDiscoveryOrchestrator, UnifiedQualityAssuranceOrchestrator, GitPublishOrchestrator, PreCommitEnforcementOrchestrator, SanitizationOrchestrator)"

