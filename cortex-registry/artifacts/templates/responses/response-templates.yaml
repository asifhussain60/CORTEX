# ============================================================================
# CORTEX Response Template Registry v1.0
# ============================================================================
# Authority: CORE-002 (No .md file generation) + CORE-049 (Silent Autonomous)
# Updated: 2026-02-15
# Purpose: YAML-based response templates for consistent UX across all intents
# Format: Machine-readable, customizable, testable
# ============================================================================

created: "2026-02-15T00:00:00Z"
authority: "MasterOrchestrator + InteractionOrchestrator"

# ============================================================================
# TEMPLATE CATEGORIES (Intent-Based)
# ============================================================================

templates:
  
  # --------------------------------------------------------------------------
  # COMPLETION REPORT (After implementation/fix/refactor)
  # --------------------------------------------------------------------------
  completion_report:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    format: "progress_bar + table + metrics"
    separator: "<hr>"
    required_fields:
      - "phase"
      - "stage"
      - "tests_passed"
      - "tests_total"
      - "coverage_percent"
      - "commits"
      - "deliverables"
    
    structure:
      header: "## {icon} CORTEX {mode}\n**Author:** Asif Hussain | **Orchestrator:** {OrchestratorName} ✅\n\n---"
      separator_open: "<hr>\n"
      title: "📋 **{phase_name} {stage_name}: {title}**\n"
      progress_bar: "`{'█' * progress_filled}{'░' * progress_remaining}` {progress_percent}% {status_text}\n"
      table_header: "| # | Status | Component | Detail |\n|---|--------|-----------|--------|\n"
      table_row: "| {num} | {status_icon} | {component} | {detail} |\n"
      metrics: "**Tests:** {passed}/{total} | **Coverage:** {coverage}%\n"
      summary: "**{key_label}:** {key_value}\n"
      separator_close: "\n<hr>"
    
    status_icons:
      completed: "✅"
      in_progress: "🔵"
      pending: "⚪"
      failed: "🔴"
      warning: "🟡"
    
    example: |
      <hr>
      
      📋 **Phase 25 Stage 1: Fix Failing Tests**
      
      `██████████` 100% Complete
      
      | # | Status | Component | Detail |
      |---|--------|-----------|--------|
      | 1 | ✅ | test_no_wave_references | Fixed stale nomenclature |
      | 2 | ✅ | test_invalid_source_rejected | MasterOrchestrator enforcement |
      | 3 | ✅ | test_enh066_documentation | MCP setup validation |
      
      **Tests:** 913/913 | **Coverage:** 95%
      **Fixed:** 5 failing tests, zero duplicates
      
      <hr>

  # --------------------------------------------------------------------------
  # CHALLENGE RESPONSE (Design reviews, disagreements)
  # --------------------------------------------------------------------------
  challenge_response:
    intent: ["DESIGN", "PLAN"]
    format: "digest + agreements + challenges + recommendations"
    separator: "---"
    required_fields:
      - "user_proposal"
      - "agreements"
      - "challenges"
      - "recommendations"
      - "verdict"
    
    structure:
      sections:
        - name: "digest"
          header: "## 📋 SESSION DIGEST SUMMARY"
          content_type: "bullet_list"
          
        - name: "analysis"
          header: "## 🎯 YOUR PROPOSAL ANALYSIS"
          content_type: "table + commentary"
          
        - name: "agreements"
          header: "### ✅ AGREEMENTS"
          content_type: "table"
          
        - name: "challenges"
          header: "### ⚠️ CHALLENGES (Better Approach Within Constraints)"
          content_type: "table_with_alternatives"
          
        - name: "recommendations"
          header: "## 💡 MY RECOMMENDATIONS"
          content_type: "numbered_list_with_details"
          
        - name: "verdict"
          header: "## ✅ MY VERDICT"
          content_type: "assessment + action_plan"
    
    example: |
      ## 🏛️ CORTEX DIGEST
      
      ---
      
      ## 📋 Summary
      
      **Chat Session:** chat01.md
      **Core Activity:** Production readiness validation
      **Outcome:** Phase 0 complete
      
      ---
      
      ## 🎯 YOUR PROPOSAL ANALYSIS
      
      ### ✅ AGREEMENTS
      
      | Point | Reasoning |
      |-------|-----------|
      | **Update registry** | ✅ CORRECT — Should reflect enforcement reality |
      
      ### ⚠️ CHALLENGES
      
      | Your Idea | My Challenge | Better Alternative |
      |-----------|--------------|-------------------|
      | "Add security gates" | ⚠️ VAGUE | Explicit: Update phase templates |

  # --------------------------------------------------------------------------
  # PHASE PROGRESS (During silent autonomous execution)
  # --------------------------------------------------------------------------
  phase_progress:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    ssot: ".github/templates/cortex-response-templates.md § Silent Autonomous Mode — Golden Template"
    note: "Visual template (progress bar + bullet list stages) defined ONLY in the SSOT file. This section defines metadata only."
    update_frequency: "per_stage"
    required_fields:
      - "phase_id"
      - "stage_id"
      - "progress_percent"
      - "stages_completed"
      - "stages_total"
    
    rules:
      - "Show ONLY progress bars with hanging stage trees during execution"
      - "NO text narration of what you're doing"
      - "Update after each stage completes"
      - "Use ━━━ (U+2501) separator lines, exactly 44 characters"
      - "Each ├─ / └─ stage on its OWN line (never concatenated)"

  # --------------------------------------------------------------------------
  # QUERY RESPONSE (Educational, information requests)
  # --------------------------------------------------------------------------
  query_response:
    intent: ["QUERY", "ANALYZE"]
    format: "mirror_questions + answers + evidence + takeaway"
    separator: "---"
    required_fields:
      - "questions"
      - "answers"
      - "evidence"
      - "key_takeaway"
    
    structure:
      header: "## 🏛️ CORTEX QUERY\n\n---"
      questions_section: "### 📋 Your Questions\n"
      answers_section: "### ✅ ANSWERS\n"
      evidence_section: "### 🔍 EVIDENCE\n"
      takeaway_section: "### 🎯 KEY TAKEAWAY\n"
    
    answer_format: "**Q{num}: {question}**\n\n✅ **ANSWER:** {answer}\n\n{evidence}\n"

  # --------------------------------------------------------------------------
  # LIST RESPONSE (Concise tabular/numbered responses)
  # --------------------------------------------------------------------------
  list_response:
    intent: ["LIST", "SUMMARY", "CONCISE"]
    format: "2-section (Summary + Analysis only)"
    icon: "📝"
    mode_label: "CORTEX LIST"
    trigger_words: ["list", "show", "summary", "summarize", "concise", "brief"]
    required_fields:
      - "list_items"
      - "category"
    
    structure:
      header: "## 📝 CORTEX LIST\n**Author:** Asif Hussain | **Orchestrator:** {OrchestratorName} ✅\n\n---"
      section_1: "### Summary\n{1-2 sentence answer}"
      section_2: "### 🔍 Analysis\n{table_or_list_body}"
      footer: "---\n**Confidence:** {confidence} | **Source:** {source}\n\n**Action required:** Type `proceed` to act, or ask a follow-up."
    
    format_selection:
      table: "structured/comparative data with ≥2 attributes"
      numbered: "sequential/ranked items"
      bulleted: "unordered items, no ranking"
      grouped: "items with natural categories"
    
    density_rules:
      inline: "≤20 items — render all inline"
      grouped: "21-50 items — group by category with counts"
      paginated: "50+ items — show top 20 with 'Type next for more'"
    
    omitted_sections:
      - "Recommendation (section 3)"
      - "Benefits & Risks (section 4)"
      - "Next Steps (section 5)"
    
    rules:
      - "Prefer tables for structured data"
      - "Use numbered lists for sequential items"
      - "Keep descriptions concise (≤ 100 chars)"
      - "Include totals at bottom"
      - "Omit sections 3-5 for conciseness"

  # --------------------------------------------------------------------------
  # PHASE 82 LEGO EXPANSION BLOCKS (GAP-82-01 through GAP-82-14)
  # --------------------------------------------------------------------------

  session_identity:
    intent: ["IMPLEMENT", "FIX", "REFACTOR", "AUDIT", "DESIGN", "PLAN", "QUERY"]
    trigger: "FIRST response in session only — never on subsequent turns"
    format: "H2 🧠 CORTEX + author + framework stats + --- separator"
    required_fields: ["orchestrator_name", "session_id"]
    rule: "Render ONCE per session — never on subsequent turns"
    ssot_block: "BLOCK-SESSION-IDENTITY"

  micro_ack:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Sub-10-word confirmations (Done, Fixed, Committed)"
    format: "✅ Done — {action} complete. {optional_metric}"
    required_fields: ["action"]
    rule: "Standalone — no ## header, replaces all other blocks for trivial acks"
    ssot_block: "BLOCK-MICRO-ACK"

  diff_preview:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Post-implementation — show changed files inline"
    format: "table (≤5 files, short paths) or <details> collapse (>5 files or >80 char cells)"
    required_fields: ["changed_files"]
    collapse_threshold: 5
    ssot_block: "BLOCK-DIFF-PREVIEW"

  resume_banner:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "User resumes paused sweep in new session"
    format: "H3 ▶️ Resuming Sweep + sweep_id + last_completed + remaining + P0/P1/P2 counts"
    required_fields: ["sweep_id", "last_completed", "remaining", "open_items"]
    ssot_block: "BLOCK-RESUME-BANNER"

  error_recovery:
    intent: ["FIX", "DEBUG", "IMPLEMENT"]
    trigger: "Known error states: blocked gates, failed tests, P0 violations"
    format: "H3 🔴 Error: {category} + bold-label fields (What happened / Impact / Recovery)"
    required_fields: ["category", "what_happened", "impact", "recovery_steps"]
    severity_icons:
      P0: "🔴"
      P1: "🟡"
      P2: "🔵"
    placement: "near top of response (high-signal)"
    ssot_block: "BLOCK-ERROR-RECOVERY"

  metrics_dashboard:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Completion responses with test/coverage/timing data"
    format_small: "✅ Tests: {passed}/{total} | Coverage: {pct}% | Duration: {t}s | Commits: {n}"
    format_large: "compact table (>4 metrics) with safety switch guard"
    threshold: 4
    ssot_block: "BLOCK-METRICS-DASHBOARD"

  handoff:
    intent: ["AUDIT", "IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Complex requests routed through 2+ orchestrators"
    format: "**Route:** IntentRouter → {orchestrator} → {sub_orchestrator}"
    required_fields: ["routing_chain"]
    placement: "inline near top — not standalone section"
    ssot_block: "BLOCK-HANDOFF"

  execution_spec:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Before cheaper executor model begins execution (model-tiering workflow)"
    format: "table: Step | Action | Target Files | Command | Validation"
    required_fields: ["steps"]
    approval_gate: "proceed"
    placement: "after BLOCK-INTENT-REFLECTION, before first implementation step"
    ssot_block: "BLOCK-EXECUTION-SPEC"

  deviation_alert:
    intent: ["IMPLEMENT", "FIX", "REFACTOR"]
    trigger: "Executor detects unexpected divergence from execution spec"
    format: "H3 ⚠️ Deviation Detected + bold-label fields (Step/Expected/Actual/Divergence type/Action)"
    required_fields: ["step_id", "expected", "actual", "divergence_type"]
    behavior: "HALT — executor must stop before emitting this block"
    distinct_from: "BLOCK-ERROR-RECOVERY (known errors vs unexpected divergence)"
    ssot_block: "BLOCK-DEVIATION-ALERT"

  phase_roadmap:
    intent: ["IMPLEMENT", "FIX", "REFACTOR", "AUDIT", "PLAN", "DIGEST", "ONBOARD"]
    trigger: "Any operation with N≥2 phases — rendered ONCE at operation start"
    format: "📋 Phase Roadmap header + bullet list with ⚪/🔵/✅/🔴 status icons per phase"
    required_fields: ["phases"]
    placement: "before BLOCK-STAGE-PROGRESS, once at operation start"
    updates: "Re-emitted only when a phase transitions (not every stage)"
    distinct_from: "BLOCK-STAGE-PROGRESS (intra-phase stage progress bars)"
    ssot_block: "BLOCK-PHASE-ROADMAP"

  engagement_breadcrumb:
    intent: ["*"]
    trigger: "Every orchestrator invocation with 2+ hop routing — rendered in header region"
    format: "*🧭 {DisplayName} → {DisplayName}* (italic, plain-language display names, 🧭 prefix)"
    required_fields: ["routing_chain"]
    placement: "header region, immediately after Response Header"
    always_rendered: true
    render_tier: "A"
    distinct_from: "BLOCK-HANDOFF (routing chain for complex educational responses)"
    ssot_block: "BLOCK-ENGAGEMENT-BREADCRUMB"

  engagement_timeline:
    intent: ["IMPLEMENT", "FIX", "REFACTOR", "AUDIT"]
    trigger: "Completion of any operation with 5+ hops OR WorkflowComposer in chain"
    format: "<details><summary>⏱️ {N} hops · {duration} — ...</summary> table of Stage | Tool | Duration | Status with Total row </details>"
    required_fields: ["orchestrators", "durations"]
    placement: "after BLOCK-METRICS-DASHBOARD, before BLOCK-NEXT-STEPS"
    always_collapsible: true
    render_tier: "C"
    distinct_from: "BLOCK-METRICS-DASHBOARD (test/coverage metrics vs orchestrator timing)"
    ssot_block: "BLOCK-ENGAGEMENT-TIMELINE"

# ============================================================================
# RENDERING RULES (VS Code Copilot Chat Compatibility)
# ============================================================================

rendering_rules:
  separators:
    preferred: "━━━ (U+2501) — 44 characters"
    reason: "Consistent with golden template visual framing"
    forbidden: "Box-drawing characters that overflow (────)"
  
  progress_bars:
    format: "[██████░░░░] — square brackets, no backticks"
    reason: "Matches golden template visual from SSOT §Silent Autonomous Mode"
    chars:
      filled: "█"
      empty: "░"
      width: 10
  
  headers:
    response_header: "Appears ONCE at top of response"
    section_headers: "Use ### for sections, never ##"
    reason: "## conflicts with response header"
  
  stage_display:
    format: "Bullet list: - {icon} S{n}: {name} ({detail})"
    note: "Each stage on its OWN line as a Markdown bullet. NEVER use ├─ └─ tree characters."
    ssot: ".github/templates/cortex-response-templates.md § Silent Autonomous Mode — Golden Template"
  
  status_icons:
    completed: "✅"
    in_progress: "🔵"
    pending: "⚪"
    critical: "🔴"
    warning: "🟡"
    info: "ℹ️"

  formatting_rules:
    r1_blank_after_heading: "Always insert blank line after any ## or ### heading"
    r2_blank_around_lists: "Always insert blank line before first list item and after last list item"
    r3_table_requirements: "Blank line before table; header row present; separator row present; no multi-paragraph cells"
    r4_omit_empty_headers: "Never emit H2/H3 with no content below it — omit heading entirely"
    r5_no_hard_wrap: "Never insert hard newline (\\n) inside prose paragraphs"
    r6_one_h2_max: "One H2 maximum per response (BLOCK-SESSION-IDENTITY exception only)"

  whitespace_normalizer:
    description: "Post-processing step — runs after all blocks assembled, before final output"
    rules:
      - "Insert blank line after every ## or ### heading (R1)"
      - "Insert blank line before first list item and after last list item (R2)"
      - "Insert blank line before and after every table (R3)"
      - "Insert blank line before and after every <details> block"
      - "Strip trailing whitespace from all lines"
    idempotent: true
    idempotency_note: "Running normalizer twice produces identical output — no double blank lines"

  renderer_safety_switch:
    description: "Auto-downgrades tables with long cells to prevent Copilot Chat blob rendering"
    table_cell_max_chars: 80
    downgrade_large_threshold: 120
    configurable: true
    threshold: "configurable via rendering_rules.table_cell_max_chars (default: 80)"
    downgrade_target:
      ">80": "bulleted list"
      ">120": "details block with code fence"

# ============================================================================
# CUSTOMIZATION (User Preferences)
# ============================================================================

customization:
  progress_bar_style:
    default: "blocks"  # █░
    alternatives:
      - "equals_minus"  # ===---
      - "hash_dot"      # ###...
  
  verbosity:
    silent: "Progress bars only"
    minimal: "Progress bars + completion summary"
    standard: "Progress bars + summary + key details"
    verbose: "Full details (NOT RECOMMENDED for autonomous mode)"
  
  separator_style:
    default: "━━━ (U+2501, 44 chars)"
    note: "Matches golden template. Do not use <hr> or --- for autonomous execution output."

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  required_checks:
    - "Response header present ONCE at top"
    - "Separator: ━━━ (U+2501) lines, 44 chars (for autonomous execution)"
    - "Progress bar: [██████░░░░] format, 10-block width"
    - "Hanging stages: ├─ / └─ each on own line (never concatenated)"
    - "Status icons: ✅ 🔵 ⚪ 🔴 used consistently"
    - "No duplicate headers (## appears once only)"
  
  forbidden_patterns:
    - "Concatenated stage lines (├─ ✅ S1 ├─ ✅ S2 on same line)"
    - "Multiple ## headers in same response"
    - "Markdown tables for stage results during autonomous execution"
    - "Text narration during silent execution"
    - ".md file generation (CORE-002 violation)"
    - "<hr> tags in autonomous execution output (use ━━━ separators)"

# ============================================================================
# TESTING SUPPORT
# ============================================================================

testing:
  test_data_location: "tests/fixtures/response_templates/"
# [STALE-REF] validation_script: "tests/unit/interaction/test_response_templates.py"
  
  test_cases:
    - template: "completion_report"
      input:
        phase: "Phase 25"
        stage: "S1"
        tests_passed: 913
        tests_total: 913
        coverage: 95
      expected_format: "progress_bar + table + metrics"
    
    - template: "challenge_response"
      input:
        agreements: ["Point 1", "Point 2"]
        challenges: [{"your_idea": "X", "challenge": "Y", "alternative": "Z"}]
      expected_format: "agreements_table + challenges_table"

# ============================================================================
# ORCHESTRATOR INTEGRATION
# ============================================================================

orchestrator_metadata:
  injection_points:
    header: "**Orchestrator:** {orchestrator_name} ✅"
    footer: "🏷️ **Applied Principles:** {principles}"
  
  orchestrator_principles:
    TDDOrchestrator: "Test-First | Evidence-Based | Non-Breaking"
    LENSSynthesis: "Language→Examination→Navigation→Synthesis"
    PlanOrchestrator: "PHASE→STAGE→TASK | Checkpoint-Driven"
    EnforcementOrchestrator: "7-Agent Validation | P0 Blocking"
    MasterOrchestrator: "Intelligent Routing | Context-Aware"

