# -------------------------------------------------------------------------
# RISKS & MITIGATIONS
# -------------------------------------------------------------------------
risks_and_mitigations:
  - risk: "Ambiguous requests misclassified (false positives)"
    likelihood: "Medium"
    impact: "Medium"
    mitigation: |
      - Confidence threshold: route to DESIGN if <0.8
      - Fallback prompt: "Did you mean to ask a question or implement a feature?"
      - User can override: "treat as question" or "treat as implementation"
    detection: "Monitor false positive rate via audit trail"
  
  - risk: "INTERACTIVE responses lack depth (too superficial)"
    likelihood: "Low"
    impact: "High"
    mitigation: |
      - Mandatory evidence requirement (CORE-030 compliance)
      - Tradeoff analysis template enforcement
      - Challenge generation when multiple approaches exist
      - Code review: validate cortex-interactive.md agent quality
    detection: "Manual review of sample responses (20 responses/week)"
  
  - risk: "Users expect implementation in INTERACTIVE mode"
    likelihood: "Medium"
    impact: "Low"
    mitigation: |
      - Clear mode header: "## 🎓 CORTEX Interactive (Guidance Only)"
      - Response footer: "Ready to implement? Type '/implement {feature}' to switch to DESIGN mode"
      - Documentation: explain INTERACTIVE vs DESIGN difference
    detection: "Track follow-up '/implement' commands after INTERACTIVE responses"
  
  - risk: "Performance degradation (LENS context expensive)"
    likelihood: "Low"
    impact: "Medium"
    mitigation: |
      - Cache LENS results for 10 minutes (ENH-023 style)
      - Lazy loading: only invoke LENS if evidence required
      - Timeout: halt LENS after 3 seconds, return cached best practices
    detection: "Monitor INTERACTIVE response latency (target <2s)"

