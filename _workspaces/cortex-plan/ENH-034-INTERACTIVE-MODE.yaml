# -------------------------------------------------------------------------
# APPENDIX
# -------------------------------------------------------------------------
appendix:
  user_request_verbatim: |
    "add to the appropriate plan, update #file:cortex-architect.prompt.md and 
    #file:agents to add an INTERACTIVE mode. If user asks a question or asks for 
    recommendation or does not specify design or implementation related requests, 
    engage the interaction orchestrator to work with user to do what hes trying to do."
  
  design_rationale: |
    Why INTERACTIVE mode instead of DESIGN with flag:
    - Mode clarity: DESIGN = implementation-bound, INTERACTIVE = exploration-only
    - Separation of concerns: Different outputs (guidance vs code)
    - User expectations: Clear mode header signals intent
    - Simpler prompts: No conditional logic in DESIGN flow
    
    Why leverage InteractionOrchestrator:
    - Already has LENS integration (527 LOC existing)
    - Challenge system built-in (generates alternatives)
    - ConversationProtocol enforces patterns
    - No new orchestrator needed (reuse existing component)
    
    Why 3-layer validation:
    - Layer 1 (Intent Detection): Prevents misrouting to DESIGN
    - Layer 2 (Response Quality): Ensures recommendations have evidence + tradeoffs
    - Layer 3 (Mode Isolation): Guarantees INTERACTIVE never triggers TDD/DoR
  
  related_work:
    - enhancement: "ENH-013"
      title: "SDLC Governance & Orchestrator Enhancement"
      relevance: "InteractionOrchestrator + PlanningOrchestrator collaboration pattern"
    
    - enhancement: "ENH-014"
      title: "Event-Driven Orchestrator Mesh"
      relevance: "Event bus for orchestrator communication (referenced in examples)"
    
    - enhancement: "ENH-009"
      title: "DIGEST mode for chat session learning"
      relevance: "Similar mode addition pattern (QUAD-MODE → PENTA-MODE)"
  
  question_patterns_examples:
    interrogative:
      - "How should I structure a caching layer?"
      - "What's the best way to implement event-driven communication?"
      - "Why is pattern X better than pattern Y?"
      - "Which approach scales better: A or B?"
    
    recommendation:
      - "Recommend an architecture for feature X"
      - "Suggest the best pattern for scenario Y"
      - "Advise on tradeoffs between approach A and B"
    
    educational:
      - "Explain the benefits of CQRS"
      - "Teach me about event sourcing"
      - "Help me understand microservices tradeoffs"
    
    non_interactive_counter_examples:
      - "Implement feature X using pattern Y" (implementation verb)
      - "Fix bug in module Z" (action verb)
      - "Deploy feature to production" (action verb)
      - "Refactor orchestrator A" (action verb)

