# -------------------------------------------------------------------------
# PROBLEM STATEMENT
# -------------------------------------------------------------------------
problem_statement: |
  Currently, CORTEX has 5 modes (PRE-FLIGHT, AUDIT, DESIGN, DIGEST, META-AUDIT).
  When users ask questions like:
  - "How should I structure this feature?"
  - "What's the best way to implement caching?"
  - "Can you recommend an architecture for X?"
  - "Should I use pattern A or pattern B?"
  
  These requests are routed to DESIGN mode, which triggers:
  - Mandatory challenge generation
  - DoR gate (Definition of Ready)
  - TDD-first implementation flow
  - Incremental task decomposition
  
  This is overkill for exploratory questions. Users want:
  - Quick recommendations without implementation
  - Conversational exploration of options
  - Architecture guidance without code generation
  - Educational responses with tradeoff analysis
  
  INTERACTIVE mode fills this gap by leveraging the existing InteractionOrchestrator
  (527 LOC with LENS integration + challenge system) for exploratory conversations
  without triggering implementation workflows.

user_pain_points:
  - "Simple questions trigger full TDD flow (waste time)"
  - "No way to get recommendations without implementation"
  - "PMs/architects/researchers need guidance, not code"
  - "Exploratory conversations force premature design decisions"

evidence:
  - "InteractionOrchestrator exists (cortex/orchestrators/core/interaction_orchestrator.py, 527 LOC)"
  - "Challenge system integrated (generates alternatives automatically)"
  - "LENS synthesis built-in (Language→Examination→Navigation→Synthesis)"
  - "ConversationProtocol enforces patterns (cortex-registry/interaction/)"
  - "No ASK/INQUIRY/RECOMMEND intent types in intent-routing.yaml"
  - "Mode table in cortex-architect.prompt.md line 55-63 has 5 modes, needs 6th"

impact_if_not_implemented:
  - "Non-engineer roles (PMs, architects, researchers) avoid CORTEX (too implementation-heavy)"
  - "Simple questions waste 10-15 minutes in DESIGN flow"
  - "No dedicated path for 'help me think through this' conversations"
  - "InteractionOrchestrator capabilities underutilized (only used internally in DESIGN)"

# -------------------------------------------------------------------------
# ARCHITECTURE
# -------------------------------------------------------------------------
architecture:
  overview: |
    Add INTERACTIVE mode as 6th mode in CORTEX ecosystem. Routes ASK/INQUIRY/RECOMMEND
    intents through InteractionOrchestrator for conversational guidance without implementation.
    
    Flow: User question → IntentRouter classifies as ASK → INTERACTIVE mode activates →
          InteractionOrchestrator builds LENS context → Generates challenge if needed →
          Provides recommendation with tradeoff analysis → No DoR gate, no TDD
  
  new_components:
    - name: "cortex-interactive.md"
      type: "Agent"
      location: ".github/agents/core/cortex-interactive.md"
      purpose: "Specialist agent for INTERACTIVE mode execution"
      capabilities:
        - "Question classification (architecture, pattern, tradeoff, educational)"
        - "Recommendation generation with evidence"
        - "Tradeoff analysis (extensibility, scalability, accuracy, efficiency)"
        - "Educational responses (how/why, not just what)"
        - "Challenge generation when multiple valid approaches exist"
      dependencies:
        - "InteractionOrchestrator (existing)"
        - "LENSSynthesis (existing)"
        - "KnowledgeRepository (existing)"
      lines_of_code: 350
      test_file: "N/A (agent, not code)"
      documentation: "Inline in agent file"
    
    - name: "InteractiveIntentHandler"
      type: "Python Class"
      location: "cortex/orchestrators/core/intent_router.py"
      purpose: "Detect ASK/INQUIRY/RECOMMEND intent patterns"
      capabilities:
        - "Keyword detection (how, why, should, recommend, best way)"
        - "Question pattern matching (interrogative sentences)"
        - "Confidence scoring (0-1.0)"
        - "Negation detection (questions without implementation verbs)"
      dependencies:
        - "IntentRouter (existing)"
      lines_of_code: 120
      test_file: "tests/unit/orchestrators/core/test_interactive_intent_handler.py"
      test_count: 12
      documentation: "Google-style docstrings + inline comments"
  
  modified_components:
    - name: "cortex-architect.prompt.md"
      location: ".github/prompts/cortex-architect.prompt.md"
      changes:
        - section: "QUAD-MODE OPERATION (line 55-63)"
          modification: "Rename to PENTA-MODE OPERATION, add INTERACTIVE row"
          before: |
            | Trigger | Mode | Behavior |
            |---------|------|----------|
            | **ALWAYS FIRST** | **PRE-FLIGHT** | Environment validation |
            | No request / "audit" keyword | **AUDIT** | Codebase health scan |
            | `/meta-audit` command | **META-AUDIT** | Prompt self-enhancement |
            | **File param = Copilot Chat** | **DIGEST** | Extract learnings |
            | User request provided | **DESIGN** | Enhanced request + TDD |
          after: |
            | Trigger | Mode | Behavior |
            |---------|------|----------|
            | **ALWAYS FIRST** | **PRE-FLIGHT** | Environment validation |
            | No request / "audit" keyword | **AUDIT** | Codebase health scan |
            | `/meta-audit` command | **META-AUDIT** | Prompt self-enhancement |
            | **File param = Copilot Chat** | **DIGEST** | Extract learnings |
            | **Question/recommendation request** | **INTERACTIVE** | Exploratory conversation via InteractionOrchestrator |
            | User request provided | **DESIGN** | Enhanced request + TDD |
        
        - section: "QUICK COMMANDS (line 78-90)"
          modification: "Add /ask, /recommend, /explore commands"
          added_commands:
            - "/ask {question} — INTERACTIVE mode (exploratory conversation)"
            - "/recommend {context} — INTERACTIVE mode (architecture guidance)"
            - "/explore {topic} — INTERACTIVE mode (tradeoff analysis)"
    
    - name: "cortex-architect.md"
      location: ".github/agents/core/cortex-architect.md"
      changes:
        - section: "Master Mode Flow (line 45-80)"
          modification: "Add INTERACTIVE routing between DIGEST and DESIGN"
          added_flow: |
            [QUESTION DETECTED?] → Pattern match for interrogatives/recommendations
                ↓
            [INTERACTIVE Mode] → cortex-interactive (exploratory conversation)
                [Question classification → Recommendation → Tradeoff analysis]
                [Output: Inline guidance with evidence]
        
        - section: "Routing Rules (line 82-90)"
          modification: "Add rule 6: INTERACTIVE detection"
          added_rule: |
            6. **Question Detection** — Identify interrogative patterns, recommendation requests
               - Keywords: "how", "why", "should", "recommend", "best way", "what's better"
               - Negation: No implementation verbs (implement, fix, refactor, deploy)
               - Route to cortex-interactive agent
    
    - name: "IntentRouter"
      location: "cortex/orchestrators/core/intent_router.py"
      changes:
        - section: "Intent Enum"
          modification: "Add ASK, INQUIRY, RECOMMEND intents"
          before: "IMPLEMENT, FIX, REFACTOR, ANALYZE, TEST, DEPLOY, ONBOARD"
          after: "IMPLEMENT, FIX, REFACTOR, ANALYZE, TEST, DEPLOY, ONBOARD, ASK, INQUIRY, RECOMMEND"
        
        - section: "classify_intent() method"
          modification: "Add interactive intent detection logic"
          added_logic: |
            # Interactive intent detection (questions/recommendations)
            if self._is_interactive_request(user_request):
                return IntentClassification(
                    intent=Intent.ASK,
                    confidence=0.85,
                    reasoning="Question pattern detected without implementation verbs",
                    orchestrator_target="InteractionOrchestrator"
                )

# -------------------------------------------------------------------------
# VALIDATION FRAMEWORK
# -------------------------------------------------------------------------
validation_framework:
  overview: |
    3-layer validation approach for INTERACTIVE mode:
    1. Intent Detection: Accurately classify questions vs implementation requests
    2. Response Quality: Recommendations include evidence + tradeoff analysis
    3. Mode Isolation: INTERACTIVE never triggers TDD/DoR/implementation flows
  
  layers:
    - layer: 1
      name: "Intent Detection Validation"
      purpose: "Ensure questions correctly routed to INTERACTIVE, not DESIGN"
      checks:
        - check: "Interrogative pattern detection"
          method: "Regex + keyword matching for how/why/should/recommend/best"
          tool: "InteractiveIntentHandler.detect_question_pattern()"
          success_criteria: "True positives >90% on test set"
          failure_criteria: "False positives >10% (implementation requests misclassified)"
          test_count: 6
        
        - check: "Negation detection"
          method: "Verify absence of implementation verbs (implement, fix, deploy)"
          tool: "InteractiveIntentHandler.has_implementation_intent()"
          success_criteria: "Correctly rejects 'implement X using Y' as non-interactive"
          failure_criteria: "Misses implementation intent in question format"
          test_count: 4
        
        - check: "Confidence scoring"
          method: "Weighted score: interrogative (0.5) + keywords (0.3) + negation (0.2)"
          tool: "InteractiveIntentHandler.calculate_confidence()"
          success_criteria: "Confidence >0.8 for clear questions, <0.5 for ambiguous"
          failure_criteria: "Ambiguous requests score >0.8 (overconfidence)"
          test_count: 2
      
      total_tests: 12
    
    - layer: 2
      name: "Response Quality Validation"
      purpose: "Ensure INTERACTIVE responses include evidence, tradeoffs, alternatives"
      checks:
        - check: "Evidence-based recommendations"
          method: "Verify references to Implementation Truth (code inspection, LENS analysis)"
          tool: "cortex-interactive agent (manual validation)"
          success_criteria: "100% of recommendations cite existing code or best practices YAML"
          failure_criteria: "Recommendations without evidence (cargo-cult advice)"
          test_count: 3
        
        - check: "Tradeoff analysis present"
          method: "Response includes extensibility/scalability/accuracy/efficiency considerations"
          tool: "cortex-interactive agent (template enforcement)"
          success_criteria: "Tradeoff section in 100% of architecture recommendations"
          failure_criteria: "Missing tradeoff analysis"
          test_count: 2
        
        - check: "Challenge generation"
          method: "InteractionOrchestrator generates alternative when multiple approaches valid"
          tool: "ChallengeEngine (existing)"
          success_criteria: "Challenge presented when CORTEX disagrees or sees better path"
          failure_criteria: "No challenge when alternative exists"
          test_count: 3
      
      total_tests: 8
    
    - layer: 3
      name: "Mode Isolation Validation"
      purpose: "Ensure INTERACTIVE never triggers implementation workflows"
      checks:
        - check: "No DoR gate"
          method: "Verify LENSSynthesis.generate_dor() NOT called in INTERACTIVE flow"
          tool: "Code inspection + integration tests"
          success_criteria: "0 DoR gates in INTERACTIVE execution trace"
          failure_criteria: "DoR gate triggered (mode leak)"
          test_count: 2
        
        - check: "No TDD invocation"
          method: "Verify TDDOrchestrator NOT called in INTERACTIVE flow"
          tool: "Code inspection + integration tests"
          success_criteria: "0 TDDOrchestrator invocations in INTERACTIVE trace"
          failure_criteria: "TDDOrchestrator called (mode leak)"
          test_count: 1
        
        - check: "No file creation"
          method: "Verify CORE-002 compliance (inline responses only)"
          tool: "File system monitoring in tests"
          success_criteria: "0 files created during INTERACTIVE mode"
          failure_criteria: "Files generated (CORE-002 violation)"
          test_count: 1
      
      total_tests: 4
  
  total_validation_tests: 24
  coverage_target: "85%"

