# -------------------------------------------------------------------------
# INTERACTIVE MODE INTEGRATION
# -------------------------------------------------------------------------
interactive_mode_integration:
  execution_order: |
    PRE-FLIGHT (if needed) → Mode Detection → INTERACTIVE mode
  
  mode_detection_logic: |
    1. Check for interrogative patterns (how, why, should, what, which)
    2. Check for recommendation keywords (recommend, best way, suggest, advice)
    3. Verify absence of implementation verbs (implement, fix, deploy, refactor)
    4. Calculate confidence score (>0.8 = INTERACTIVE, <0.5 = ambiguous → fallback to DESIGN)
    5. Route to cortex-interactive agent
  
  interactive_flow: |
    User Question
        ↓
    IntentRouter → ASK/INQUIRY/RECOMMEND
        ↓
    cortex-interactive agent
        ↓
    1. Question Classification (architecture/pattern/tradeoff/educational)
        ↓
    2. LENS Context Gathering (Implementation Truth: code, docs, best practices)
        ↓
    3. InteractionOrchestrator (build conversation context)
        ↓
    4. Recommendation Generation (evidence-based)
        ↓
    5. Tradeoff Analysis (extensibility, scalability, accuracy, efficiency)
        ↓
    6. Challenge (if CORTEX disagrees or sees better path)
        ↓
    7. Inline Response (CORE-002 compliance)
  
  output_format: |
    ## 🎓 CORTEX Interactive
    **Author:** Asif Hussain | **Mode:** Interactive | **Question Type:** {type} ✅
    
    ---
    
    ### 🔍 Question Analysis
    **Classification:** {Architecture|Pattern|Tradeoff|Educational}  
    **Confidence:** {High|Medium}
    
    ### 💡 Recommendation
    {Evidence-based recommendation with specific examples}
    
    ### ⚖️ Tradeoff Analysis
    | Factor | Approach A | Approach B | Recommended |
    |--------|-----------|------------|-------------|
    | Extensibility | {analysis} | {analysis} | {choice} |
    | Scalability | {analysis} | {analysis} | {choice} |
    | Accuracy | {analysis} | {analysis} | {choice} |
    | Efficiency | {analysis} | {analysis} | {choice} |
    
    ### 📚 Evidence
    - **Implementation Truth:** {code references from CORTEX codebase}
    - **Best Practices:** {references to cortex/knowledge/best-practices/*.yaml}
    - **Patterns:** {references to docs/patterns/*.md}
    
    ### ⚠️ Challenge (if applicable)
    **CORTEX Disagrees:** {alternative approach}  
    **Why:** {reasoning with evidence}
    
    ---
    
    **Related Topics:** {cross-references}
  
  examples:
    - question: "How should I structure a caching layer for CORTEX?"
      classification: "Architecture"
      response_structure: |
        ### 💡 Recommendation
        Implement a 3-tier caching strategy:
        1. In-memory LRU cache (Redis) for hot data (<1ms latency)
        2. SQLite cache for warm data (cortex_brain/state/cache.db)
        3. Knowledge base as cold storage (cortex_brain/tier3/knowledge/*.yaml)
        
        ### ⚖️ Tradeoff Analysis
        | Factor | Single-Tier | Multi-Tier | Recommended |
        |--------|-------------|------------|-------------|
        | Extensibility | Medium (one layer) | High (pluggable tiers) | Multi-Tier |
        | Scalability | Low (memory bound) | High (distributed) | Multi-Tier |
        | Accuracy | High (always fresh) | Medium (TTL needed) | Multi-Tier |
        | Efficiency | Medium (cold misses) | High (hot path fast) | Multi-Tier |
        
        ### 📚 Evidence
        - **Implementation Truth:** KnowledgeRepository uses SQLite cache (cortex/brain/core/knowledge/knowledge_repository.py:45-67)
        - **Best Practices:** Caching pyramid pattern (cortex/knowledge/best-practices/architecture/caching-strategies.yaml)
        - **Patterns:** Multi-tier caching (docs/patterns/caching-pyramid.md)
    
    - question: "Should I use pattern X or pattern Y for event handling?"
      classification: "Tradeoff"
      response_structure: |
        ### 💡 Recommendation
        Use **Pattern X (Event Bus)** for CORTEX because:
        - Decouples orchestrators (extensibility: can add orchestrators without modifying existing)
        - Enables event replay (debugging: replay production events in test)
        - Supports dead letter queue (reliability: no lost events)
        
        ### ⚖️ Tradeoff Analysis
        | Factor | Pattern X (Event Bus) | Pattern Y (Direct Calls) | Recommended |
        |--------|----------------------|-------------------------|-------------|
        | Extensibility | High (pub/sub) | Low (tight coupling) | Pattern X |
        | Scalability | High (async) | Medium (sync) | Pattern X |
        | Accuracy | High (event history) | Medium (no replay) | Pattern X |
        | Efficiency | Medium (overhead) | High (direct) | Pattern X |
        
        ### 📚 Evidence
        - **Implementation Truth:** ENH-014 implemented event bus (cortex/infrastructure/orchestrator_event_bus.py)
        - **Best Practices:** Event-driven architecture (cortex/knowledge/best-practices/architecture/event-driven.yaml)

