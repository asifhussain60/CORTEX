---
# ============================================================================
# DEPLOYMENT & SERVING
# ============================================================================

deployment:
  serving_options:
    python_dev:
      command: "cd company/dashboards && python -m http.server 8080"
      url: "http://localhost:8080"
      notes: "Development only, not production"
    
    nginx:
      config: |
        server {
            listen 80;
            root /var/www/cortex-dashboards;
            index index.html;
            
            location / {
                try_files $uri $uri/ /index.html;
            }
            
            location /repos/ {
                alias /var/www/cortex-dashboards/repos/;
            }
        }
    
    docker:
      dockerfile: |
        FROM nginx:alpine
        COPY company/dashboards/ /usr/share/nginx/html/
        EXPOSE 80
      command: "docker build -t cortex-dashboards . && docker run -p 8080:80 cortex-dashboards"
  
  production_notes:
    - "Use HTTPS in production"
    - "Add CSP headers for security"
    - "Enable gzip compression"
    - "Set appropriate cache headers for JSON files"
    - "Consider CDN for static assets"

