# ============================================================================
# ARCHITECTURE: LENS → JSON → SPA PIPELINE
# ============================================================================

architecture:
  overview: |
    ┌─────────────────────────────────────────────────────────────────────┐
    │                     MCP GATEWAY                                      │
    │  cortex_onboard_repository_dashboard(repo_path, options)            │
    └─────────────────────────────────────────────────────────────────────┘
                                    │
                                    ▼
    ┌─────────────────────────────────────────────────────────────────────┐
    │              RepositoryOnboardingOrchestrator                        │
    │  - Coordinates all LENS analyzers                                    │
    │  - Generates comprehensive dashboard-data.json                       │
    │  - Updates registry.json with new repo                               │
    └─────────────────────────────────────────────────────────────────────┘
                                    │
                    ┌───────────────┼───────────────┐
                    │               │               │
                    ▼               ▼               ▼
    ┌───────────────────┐ ┌───────────────────┐ ┌───────────────────┐
    │   LENS Analyzers  │ │  Security Tools   │ │  Quality Tools    │
    │   - ASTAnalyzer   │ │  - Bandit         │ │  - CodeSmellDet   │
    │   - GitHistory    │ │  - SafetyCheck    │ │  - Complexity     │
    │   - ConfigAnalyzer│ │  - SecretScan     │ │  - Duplication    │
    │   - DependencyAna │ │  - OWASP Rules    │ │  - PatternDiscov  │
    └───────────────────┘ └───────────────────┘ └───────────────────┘
                    │               │               │
                    └───────────────┼───────────────┘
                                    │
                                    ▼
    ┌─────────────────────────────────────────────────────────────────────┐
    │              DashboardDataAggregator                                 │
    │  - Merges all analyzer outputs                                       │
    │  - Applies schema validation                                         │
    │  - Handles null/empty gracefully                                     │
    │  - Outputs: dashboard-data.json + manifest.json                      │
    └─────────────────────────────────────────────────────────────────────┘
                                    │
                                    ▼
    ┌─────────────────────────────────────────────────────────────────────┐
    │              company/dashboards/repos/{slug}/                        │
    │  - dashboard-data.json (Complete JSON)                               │
    │  - manifest.json (Metadata for registry)                             │
    └─────────────────────────────────────────────────────────────────────┘
                                    │
                                    ▼
    ┌─────────────────────────────────────────────────────────────────────┐
    │              company/dashboards/registry.json                        │
    │  - Auto-updated with new repo entry                                  │
    │  - Used by index.html for tiles                                      │
    └─────────────────────────────────────────────────────────────────────┘

  components:
    lens_data_aggregator:
      location: "cortex/lens/dashboard_data_aggregator.py"
      purpose: "Aggregate all LENS analyzer outputs into dashboard schema"
      methods:
        - "aggregate_overview() → overview section"
        - "aggregate_metrics() → metrics section"
        - "aggregate_security() → security section with vulnerabilities array"
        - "aggregate_dependencies() → packages, licenses, outdated"
        - "aggregate_quality() → code smells, maintainability, complexity"
        - "aggregate_use_cases() → discovered use cases from comments/docs"
        - "aggregate_lens() → patterns, architecture summary"
        - "aggregate_refactoring() → recommendations from code smells"
        - "to_json() → complete dashboard-data.json"
    
    registry_manager:
      location: "cortex/visualization/registry_manager.py"
      purpose: "Manage registry.json updates"
      methods:
        - "add_repository(slug, metadata)"
        - "remove_repository(slug)"
        - "update_repository(slug, metadata)"
        - "list_repositories() → array"
        - "get_repository(slug) → metadata"
    
    mcp_tools:
      cortex_generate_dashboard_data:
        location: "cortex/mcp/tools/dashboard_tools.py"
        purpose: "MCP-exposed full dashboard generation"
        parameters:
          repo_path: "Path to repository"
          repo_name: "Optional display name"
          include_security: "bool (default: true)"
          include_dependencies: "bool (default: true)"
          depth: "'quick' | 'standard' | 'deep'"
        returns: "DashboardDataResult with JSON path"
      
      cortex_refresh_registry:
        location: "cortex/mcp/tools/dashboard_tools.py"
        purpose: "Refresh registry.json from repos folder"
        parameters:
          repos_path: "Path to repos directory"
        returns: "RegistryRefreshResult with count"

---
# ============================================================================
# JSON SCHEMA: COMPLETE DASHBOARD DATA
# ============================================================================

json_schema:
  version: "2.0"
  description: "Complete schema for dashboard-data.json consumed by SPA"
  
  root:
    repo:
      required: true
      fields:
        slug: "string - URL-safe identifier"
        display_name: "string - Human-readable name"
        description: "string - Repository description"
        owner: "string - Team/organization owner"
        primary_language: "string - Main programming language"
        version: "string|null - Current version"
        last_analyzed_at: "ISO8601 datetime"
    
    overview:
      required: true
      fields:
        summary: "string - One-line summary"
        business_summary: "string - Executive paragraph"
        key_findings: "string[] - Bullet points (3-7 items)"
      null_behavior: "Show placeholder text if empty"
    
    metrics:
      required: true
      fields:
        health_score: "number (0-100)"
        risk_score: "number (0-100)"
        loc: "number - Total lines of code"
        code_lines: "number - Actual code lines"
        comment_lines: "number - Comment lines"
        blank_lines: "number - Blank lines"
        files: "number - Total files"
        coverage_pct: "number|null (0-100)"
        languages: "object - {language: line_count}"
      null_behavior: "Show '--' for null numeric values"
    
    security:
      required: true
      fields:
        total_count: "number"
        critical_count: "number"
        high_count: "number"
        medium_count: "number"
        low_count: "number"
        vulnerabilities:
          type: "array"
          items:
            id: "string - Unique identifier"
            title: "string - Issue title"
            severity: "string - critical|high|medium|low"
            cwe_id: "string|null - CWE reference"
            location: "string - File:line"
            status: "string - open|in_progress|accepted|resolved"
            description: "string - Detailed description"
      null_behavior: "Show 'No vulnerabilities detected' banner"
    
    dependencies:
      required: true
      fields:
        direct_count: "number"
        dev_count: "number"
        transitive_count: "number"
        outdated_count: "number"
        packages:
          type: "array"
          items:
            name: "string"
            version: "string"
            latest: "string|null"
            license: "string"
            type: "string - direct|dev|transitive"
        licenses: "object - {license_name: count}"
      null_behavior: "Show 'No dependencies' message"
    
    quality:
      required: true
      fields:
        maintainability: "number (0-100)"
        readability: "number (0-100)"
        documentation: "number (0-100)"
        complexity: "number (0-100, lower is better)"
        code_smells_count: "number"
        code_smells:
          type: "array"
          items:
            name: "string - Smell type"
            description: "string"
            location: "string - File:function or File:class"
            severity: "string - low|medium|high"
      null_behavior: "Show 'No code smells detected' card"
    
    use_cases:
      required: true
      fields:
        type: "array"
        items:
          id: "string - Unique ID"
          title: "string - Use case title"
          description: "string - Detailed description"
          persona: "string - Developer|Manager|QA|Architect|DevOps|Security"
          category: "string - Grouping category"
          business_value: "string - Value proposition"
          implementation_notes: "string|null"
          related_files: "string[] - File paths"
          tags: "string[]"
      null_behavior: "Hide tab or show 'No use cases defined'"
    
    lens:
      required: true
      fields:
        patterns_detected:
          type: "array"
          items:
            name: "string - Pattern name"
            count: "number - Occurrences"
            confidence: "number (0-1)"
        architecture_summary: "string - Paragraph describing architecture"
        recommendations: "string[] - LENS recommendations"
      null_behavior: "Show 'Analysis pending' state"
    
    refactoring:
      required: true
      fields:
        total_recommendations: "number"
        recommendations:
          type: "array"
          items:
            title: "string"
            description: "string"
            priority: "string - low|medium|high|critical"
            impact: "string"
            effort: "string - low|medium|high"
            files: "string[]"
      null_behavior: "Show 'No refactoring needed' celebration"

---
# ============================================================================
# UI ENHANCEMENTS: NULL-SAFE RENDERING
# ============================================================================

ui_enhancements:
  data_binding_patterns:
    show_if:
      syntax: 'data-show-if="path.to.value"'
      behavior: "Element visible only if value is truthy"
      example: '<div data-show-if="overview.business_summary">...</div>'
    
    hide_if:
      syntax: 'data-hide-if="path.to.value"'
      behavior: "Element hidden if value is truthy"
      example: '<div data-hide-if="security.vulnerabilities.length">No issues!</div>'
    
    fallback:
      syntax: 'data-fallback="default text"'
      behavior: "Show fallback when value is null/undefined"
      example: '<span data-bind="metrics.coverage_pct" data-fallback="N/A">--</span>'
  
  chart_null_handling:
    implementation: |
      // In ChartFactory
      static createPieChart(container, data, options) {
        if (!container) return null;
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="chart-empty">No data available</div>';
          return null;
        }
        // ... normal chart creation
      }
    
    empty_states:
      - type: "No Data"
        display: "Elegant 'No data available' card with icon"
      - type: "Analysis Pending"
        display: "Loading spinner with 'Analysis in progress...'"
      - type: "Not Applicable"
        display: "Grayed out 'Not applicable for this repo' message"
  
  tab_visibility:
    strategy: "Hide tabs without meaningful data"
    implementation: |
      // In CortexDashboard.hideEmptyTabs()
      const tabRules = {
        'use-cases-tab': () => (this.data?.use_cases?.length || 0) > 0,
        'lens-tab': () => !!this.data?.lens?.patterns_detected?.length,
        'refactoring-tab': () => (this.data?.refactoring?.recommendations?.length || 0) > 0,
      };

---
# ============================================================================
# LENS ANALYZER INTEGRATION
# ============================================================================

lens_integration:
  overview: |
    The DashboardDataAggregator must invoke ALL available LENS analyzers
    to generate comprehensive dashboard data. Each analyzer contributes
    to specific sections of the JSON schema.
  
  analyzer_mapping:
    ASTAnalyzer:
      contributes_to:
        - "metrics.loc"
        - "metrics.code_lines"
        - "metrics.files"
        - "quality.complexity"
        - "lens.patterns_detected"
      invocation: |
        ast_analyzer = ASTAnalyzer(repo_path)
        ast_result = ast_analyzer.analyze()
    
    GitHistoryAnalyzer:
      contributes_to:
        - "overview.key_findings (recent activity)"
        - "metrics.risk_score (churn calculation)"
        - "refactoring.recommendations (hotspot detection)"
      invocation: |
        git_analyzer = GitHistoryAnalyzer(repo_path)
        git_result = git_analyzer.analyze(days=90)
    
    ConfigAnalyzer:
      contributes_to:
        - "dependencies.packages"
        - "dependencies.licenses"
        - "security.vulnerabilities (config issues)"
      invocation: |
        config_analyzer = ConfigAnalyzer(repo_path)
        config_result = config_analyzer.analyze()
    
    DependencyAnalyzer:
      contributes_to:
        - "dependencies.direct_count"
        - "dependencies.transitive_count"
        - "dependencies.outdated_count"
        - "dependencies.packages"
        - "security.vulnerabilities (CVE checks)"
      invocation: |
        dep_analyzer = DependencyAnalyzer(repo_path)
        dep_result = dep_analyzer.analyze()
    
    SecurityScanner:
      contributes_to:
        - "security.vulnerabilities"
        - "security.total_count"
        - "security.critical_count"
        - "quality.code_smells (security smells)"
      tools:
        - "bandit (Python security)"
        - "safety (dependency CVEs)"
        - "detect-secrets (secret scanning)"
        - "custom OWASP rules"
      invocation: |
        from cortex.security import SecurityScanner
        scanner = SecurityScanner(repo_path)
        security_result = scanner.full_scan()
    
    CodeSmellDetector:
      contributes_to:
        - "quality.code_smells"
        - "quality.code_smells_count"
        - "refactoring.recommendations"
      detection_rules:
        - "God Class (>1000 LOC or >30 methods)"
        - "Long Method (>50 lines)"
        - "Feature Envy"
        - "Data Clump"
        - "Primitive Obsession"
        - "Duplicate Code (>6 lines)"
      invocation: |
        from cortex.quality import CodeSmellDetector
        detector = CodeSmellDetector(repo_path)
        smells = detector.detect_all()
    
    PatternDiscoveryEngine:
      contributes_to:
        - "lens.patterns_detected"
        - "lens.architecture_summary"
      patterns:
        - "Repository Pattern"
        - "Factory Pattern"
        - "Strategy Pattern"
        - "Observer Pattern"
        - "Decorator Pattern"
        - "MVC/MVVM patterns"
      invocation: |
        from cortex.lens.patterns import PatternDiscoveryEngine
        engine = PatternDiscoveryEngine(repo_path)
        patterns = engine.discover()
    
    UseCaseExtractor:
      contributes_to:
        - "use_cases"
      sources:
        - "README.md and documentation"
        - "Docstrings with 'Use Case:' tags"
        - "Test file names (test_*)"
        - "API endpoint descriptions"
      invocation: |
        from cortex.documentation import UseCaseExtractor
        extractor = UseCaseExtractor(repo_path)
        use_cases = extractor.extract()

---
# ============================================================================
# MCP TOOL SPECIFICATION
# ============================================================================

mcp_tool_spec:
  cortex_generate_dashboard_data:
    name: "cortex_generate_dashboard_data"
    description: |
      Generates complete dashboard-data.json for a repository by running
      all LENS analyzers and aggregating results into the dashboard schema.
      Updates registry.json automatically for landing page tiles.
    
    parameters:
      repo_path:
        type: "string"
        required: true
        description: "Absolute path to repository root"
      
      repo_name:
        type: "string"
        required: false
        description: "Display name (defaults to folder name)"
      
      icon:
        type: "string"
        required: false
        default: "📁"
        description: "Emoji icon for landing page tile"
      
      tags:
        type: "array"
        required: false
        description: "Tags for categorization"
      
      analysis_depth:
        type: "string"
        enum: ["quick", "standard", "deep"]
        default: "standard"
        description: |
          quick: Metrics + overview only (30 seconds)
          standard: Full analysis minus security scans (2 minutes)
          deep: Everything including vulnerability scanning (5+ minutes)
      
      include_security:
        type: "boolean"
        default: true
        description: "Run security vulnerability scanning"
      
      include_patterns:
        type: "boolean"
        default: true
        description: "Run pattern discovery analysis"
      
      update_registry:
        type: "boolean"
        default: true
        description: "Auto-update registry.json"
    
    returns:
      success: "boolean"
      dashboard_path: "string - Path to generated dashboard-data.json"
      manifest_path: "string - Path to manifest.json"
      registry_updated: "boolean"
      analysis_summary:
        total_files: "number"
        total_loc: "number"
        health_score: "number"
        vulnerabilities_found: "number"
        analysis_duration_ms: "number"
    
    example_invocation: |
      {
        "tool": "cortex_generate_dashboard_data",
        "parameters": {
          "repo_path": "/projects/my-app",
          "repo_name": "My Application",
          "icon": "🚀",
          "tags": ["production", "api"],
          "analysis_depth": "deep",
          "include_security": true,
          "update_registry": true
        }
      }

