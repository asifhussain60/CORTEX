# ============================================================================
# VISION: MCP-EXPOSED DEEP REPO ANALYSIS → DASHBOARD DATA
# ============================================================================

vision:
  goal: |
    Create an MCP-exposed repository onboarding system that:
    - Uses ALL CORTEX LENS crawlers and analyzers for deep repository scanning
    - Generates complete dashboard-data.json files bound to SPA dashboard
    - Supports multi-repo landing page (index.html) with hero + tiles
    - Handles null/blank data gracefully with UI visibility toggling
    - Runs as HTTP-served SPA (not file://)
    - Integrates with existing company/dashboards/spa infrastructure
    
  key_outcomes:
    - "Complete JSON schema covering ALL 8 dashboard tabs"
    - "MCP tool: cortex_onboard_repository_dashboard"
    - "Deep LENS analysis integration (AST, Git, Config, Security, Dependencies)"
    - "Null-safe UI rendering with data-show-if patterns"
    - "registry.json auto-update for landing page tiles"
    - "HTTP server support (python -m http.server, nginx, etc.)"

