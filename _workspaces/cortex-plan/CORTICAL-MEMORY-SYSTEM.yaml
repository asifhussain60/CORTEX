# ============================================================================
# CMS-4: CORTICAL INTEGRATION LAYER + LENS SMART FACADE
# ============================================================================
# Brain Metaphor: Cortical integration (prefrontal cortex) synthesizing
#                 working memory (LENS) + long-term memory (synaptic networks)
# Function: Intelligent routing between fast local analysis and persistent graphs
# ============================================================================
cms_4:
  layer_name: "Cortical Integration Layer + LENSSmartFacade"
  brain_analogy: "Prefrontal cortex integrating working memory + long-term memory"
  duration: "18-22 hours"  # +8h for LENSSmartFacade
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Create cortical integration layer that intelligently coordinates LENS
    (working memory - fast, local, ephemeral) with Synaptic Networks
    (long-term memory - persistent, distributed, comprehensive).
    
    Like the human prefrontal cortex, this layer decides which memory system
    to query based on operation type:
    - Intent classification → Working memory (LENS) only - fast
    - Compliance validation → Long-term memory (Graphs) only - accurate
    - Refactoring analysis → Both systems integrated - comprehensive
    
    Key Innovation: LENSSmartFacade automatically routes to appropriate
    analyzer(s) without user needing to understand dual-memory architecture.
    
  objectives:
    - Create CorticalIntegrationOrchestrator (federation layer)
    - Implement LENSSmartFacade (intelligent routing)
    - Implement LENSQueryOptimizer (decision logic)
    - Integrate with IntentRouter for enriched intent classification
    - Enhance DoR with synaptic network-backed confidence scoring
    - Add query optimization and caching (both memory systems)
    - Create unified query API for all intelligence sources
    - Extend LENSContext with graph_context field
    
  success_criteria:
    - Single query spans multiple synaptic networks seamlessly
    - DoR confidence boosted by synaptic evidence
    - IntentRouter makes smarter routing decisions with cortical data
    - Query latency < 200ms for federated queries
    - LENS-only queries remain < 200ms (no performance regression)
    - 100% integration with existing orchestrators
    - Automatic analyzer selection (no manual routing needed)
    
  file_structure:
    orchestrators:
      - "cortex/orchestrators/cortical/cortical_integration_orchestrator.py"
      - "cortex/orchestrators/cortical/__init__.py"
    
    smart_facade:
      - "cortex/orchestrators/support/lens_smart_facade.py"  # NEW - Main facade
      - "cortex/orchestrators/support/lens_query_optimizer.py"  # NEW - Decision logic
    
    synaptic_query:
      - "cortex/synaptic/networks/query_engine.py"
      - "cortex/synaptic/networks/query_optimizer.py"
      - "cortex/synaptic/networks/query_cache.py"
    
    integration:
      - "cortex/orchestrators/core/intent_router_cortical_integration.py"
      - "cortex/orchestrators/core/dor_cortical_integration.py"
      - "cortex/orchestrators/support/lens_orchestrator.py"  # MODIFIED - Add analyze_file_with_graph()
    
    tests:
      - "tests/orchestrators/cortical/test_cortical_integration_orchestrator.py"
      - "tests/orchestrators/support/test_lens_smart_facade.py"  # NEW
      - "tests/orchestrators/support/test_lens_query_optimizer.py"  # NEW
      - "tests/synaptic/networks/test_query_engine.py"
      - "tests/integration/test_intent_router_cortical_integration.py"
  
  acceptance_criteria:
    - ac_id: "AC-CMS-004-01"
      description: "CorticalIntegrationOrchestrator queries multiple synaptic networks in one request"
      validation: "Query 'PCI-DSS violations in payment services with CVEs' works"
    
    - ac_id: "AC-CMS-004-02"
      description: "IntentRouter uses synaptic context for classification"
      validation: "Synaptic evidence boosts DoR confidence by 0.0-0.4"
    
    - ac_id: "AC-CMS-004-03"
      description: "DoR approval gate enriched with cortical insights"
      validation: "DoR displays 'Affects 3 services, 2 HIPAA controls, 1 CVE'"
    
    - ac_id: "AC-CMS-004-04"
      description: "Query caching reduces redundant lookups across both memory systems"
      validation: "Second identical query returns from cache in < 10ms"
    
    - ac_id: "AC-CMS-004-05"
      description: "All 23 orchestrators can query cortical integration layer"
      validation: "Integration tests for TDD, Refactoring, Documentation orchestrators"
    
    - ac_id: "AC-CMS-004-06"
      description: "LENSSmartFacade automatically selects analyzers based on operation"
      validation: "classify_intent → LENS only, compliance_check → Graph only, refactor → Both"
    
    - ac_id: "AC-CMS-004-07"
      description: "LENSContext extended with graph_context field"
      validation: "lens_context.graph_context contains compliance, dependencies, services"
    
    - ac_id: "AC-CMS-004-08"
      description: "No performance regression for LENS-only operations"
      validation: "Intent classification remains < 200ms (no graph overhead)"
  
  lens_smart_facade_design:
    decision_matrix: |
      | User Operation          | LENS Git | LENS AST | LENS Comment | Synaptic Query | Crawler | Latency |
      |-------------------------|----------|----------|--------------|----------------|---------|---------|
      | Intent Classification   | ✅       | ✅       | ✅           | ❌             | ❌      | ~200ms  |
      | Compliance Check        | ❌       | ❌       | ❌           | ✅             | ❌      | ~50ms   |
      | Refactor Request        | ✅       | ✅       | ❌           | ✅             | ❌      | ~250ms  |
      | Impact Analysis         | ❌       | ❌       | ❌           | ✅             | ❌      | ~100ms  |
      | CVE Scan                | ❌       | ❌       | ❌           | ✅             | ❌      | ~80ms   |
      | Full Onboarding         | ✅       | ✅       | ✅           | ✅             | ✅      | ~30s    |
      | Drift Detection         | ❌       | ❌       | ❌           | ✅             | ✅      | ~5-10m  |
    
    example_usage: |
      ```python
      # Single entry point for all intelligence
      from cortex.orchestrators.support.lens_smart_facade import LENSSmartFacade
      
      facade = LENSSmartFacade(
          lens_orchestrator=LENSOrchestrator(repo_path=Path("/repo")),
          cortical_integration=CorticalIntegrationOrchestrator()
      )
      
      # Intent classification → LENS only (fast)
      result = facade.analyze("classify_intent", file_path=Path("module.py"))
      # Uses: GitHistoryAnalyzer + ASTAnalyzer + CommentExtractor
      
      # Compliance check → Synaptic networks only (accurate)
      result = facade.analyze("compliance_check", file_path=Path("payment.py"))
      # Uses: ComplianceSynapticNetwork only
      
      # Refactoring → Both systems (comprehensive)
      result = facade.analyze("refactor", file_path=Path("service.py"))
      # Uses: LENS + DependencySynapticNetwork + ServiceSynapticNetwork
      ```
  
  mcp_integration:
    tools:
      - name: "cortical_query"
        description: "Unified query API for all intelligence (LENS + synaptic networks)"
        parameters:
          - "query: str"  # Natural language or structured
          - "operation_type: str"  # classify_intent, compliance_check, refactor, etc.
          - "file_path: Optional[str]"
          - "networks: Optional[List[str]]"  # dependency, compliance, service
        returns: "Unified intelligence result with metadata"
      
      - name: "cortical_status"
        description: "Show cortical integration health (both memory systems)"
        returns: "LENS status + synaptic network status + cache metrics"
  
  health_checks:
    endpoints:
      - path: "/health/cortical-integration"
        checks:
          - "All synaptic networks reachable"
          - "LENS orchestrator healthy"
          - "Query cache hit rate > 30%"
          - "Average query latency < 200ms"
          - "Cortical integration layer healthy"
          - "LENSSmartFacade routing functional"
    
    metrics:
      - "cortex_cortical_queries_total"
      - "cortex_cortical_query_duration_seconds"
      - "cortex_cortical_cache_hit_rate"
      - "cortex_cortical_integration_errors_total"
      - "cortex_lens_only_queries_total"  # Fast path
      - "cortex_synaptic_only_queries_total"  # Graph path
      - "cortex_hybrid_queries_total"  # Both systems

# ============================================================================
# CMS-5: MEMORY CONSOLIDATION PROCESS + DRIFT DETECTION
# ============================================================================
# Brain Metaphor: Sleep memory consolidation (hippocampus → cortex transfer)
# Function: Periodic full-scan reconciliation ensuring long-term accuracy
# ============================================================================
cms_5:
  layer_name: "Memory Consolidation Process + Drift Detection"
  brain_analogy: "Sleep-based memory consolidation (hippocampus → neocortex)"
  duration: "12-16 hours"
  priority: "P1-HIGH"
  status: "PLANNED"
  
  description: |
    Build memory consolidation system that periodically validates synaptic
    network state against full repository scan. Like human sleep, this process
    detects missed sensory input, corrects network corruption, and strengthens
    accurate synaptic connections while weakening incorrect ones.
    
    Runs during "low-activity windows" (analogous to sleep cycles) to avoid
    interfering with real-time sensory processing.
    
  objectives:
    - Create MemoryConsolidationOrchestrator
    - Implement scheduled full-repository scanners (sleep cycles)
    - Add synaptic network validation and integrity checks
    - Create drift detection alerts (memory corruption detection)
    - Build self-healing for minor inconsistencies (synaptic pruning)
    - Add consolidation dashboard (sleep metrics)
    
  success_criteria:
    - Scheduled reconciliation runs during low-activity windows
    - < 1% drift detected between graph and reality
    - Self-healing corrects 80%+ of drift automatically
    - Manual review queue for complex drift
    - Reconciliation audit trail complete
    
  file_structure:
    orchestrators:
      - "cortex/orchestrators/infrastructure/reconciliation_orchestrator.py"
    
    crawlers:
      - "cortex/crawlers/repository_crawler.py"
      - "cortex/crawlers/compliance_crawler.py"
      - "cortex/crawlers/dependency_crawler.py"
      - "cortex/crawlers/__init__.py"
    
    validators:
      - "cortex/validators/graph_integrity_validator.py"
      - "cortex/validators/drift_validator.py"
      - "cortex/validators/__init__.py"
    
    healing:
      - "cortex/healing/auto_healer.py"
      - "cortex/healing/__init__.py"
    
    tests:
      - "tests/orchestrators/infrastructure/test_reconciliation_orchestrator.py"
      - "tests/crawlers/test_repository_crawler.py"
      - "tests/validators/test_graph_integrity_validator.py"
      - "tests/healing/test_auto_healer.py"
  
  acceptance_criteria:
    - ac_id: "AC-CMS-005-01"
      description: "ReconciliationOrchestrator runs on schedule (e.g., 3am daily)"
      validation: "Cron job triggers full reconciliation"
    
    - ac_id: "AC-CMS-005-02"
      description: "Repository crawlers detect missed events"
      validation: "Missed Git push from webhook failure detected"
    
    - ac_id: "AC-CMS-005-03"
      description: "Drift detection alerts on graph vs reality mismatch"
      validation: "Code declares HIPAA but graph missing → alert fired"
    
    - ac_id: "AC-CMS-005-04"
      description: "Auto-healer corrects minor inconsistencies"
      validation: "Missing dependency in graph → auto-added from lockfile"
    
    - ac_id: "AC-CMS-005-05"
      description: "Reconciliation dashboard shows drift metrics"
      validation: "Grafana dashboard displays drift rate, healing stats"
  
  mcp_integration:
    tools:
      - name: "onboard_repo"
        description: "Register new repository for event capture and reconciliation"
        parameters:
          - "repo_url: str"
          - "webhook_url: str"
          - "reconciliation_schedule: str"  # cron expression
        returns: "Onboarding status with webhook setup instructions"
  
  health_checks:
    endpoints:
      - path: "/health/reconciliation"
        checks:
          - "Last reconciliation < 86400s ago (24 hours)"
          - "Drift rate < 1%"
          - "Auto-healer success rate > 80%"
          - "Manual review queue < 50 items"
    
    metrics:
      - "cortex_reconciliation_runs_total"
      - "cortex_reconciliation_duration_seconds"
      - "cortex_drift_detected_total"
      - "cortex_auto_healing_success_rate"

# ============================================================================
# INTEGRATION & DEPLOYMENT
# ============================================================================
integration:
  existing_systems:
    - component: "IntentRouter"
      integration: "Graph context enriches intent classification"
      impact: "DoR confidence boost 0.0-0.4 from graph evidence"
    
    - component: "DoR Approval Gate"
      integration: "Graph queries show compliance, CVE, service impact"
      impact: "User sees 'Affects 3 PCI controls, 2 services, 1 CVE' before approval"
    
    - component: "LENS Orchestrator"
      integration: "ServiceGraph adds topology to code analysis"
      impact: "LENS shows 'This function called by 5 services'"
    
    - component: "OnboardingOrchestrator"
      integration: "Graph provides new developer context"
      impact: "Onboarding shows team ownership, service dependencies"
    
    - component: "TDDOrchestrator"
      integration: "Graph shows which tests cover which compliance controls"
      impact: "TDD prioritizes tests for high-risk compliance changes"
    
    - component: "RefactoringOrchestrator"
      integration: "Blast radius calculator prevents breaking changes"
      impact: "Refactor blocked if breaks downstream services"

deployment:
  docker_compose_changes:
    new_services:
      - name: "cortex-event-ingestion"
        image: "cortex:latest"
        command: "python -m cortex.orchestrators.infrastructure.event_ingestion_orchestrator"
        ports: []
        depends_on: ["cortex-mcp", "redis"]
      
      - name: "cortex-reconciliation"
        image: "cortex:latest"
        command: "python -m cortex.orchestrators.infrastructure.reconciliation_orchestrator"
        ports: []
        depends_on: ["cortex-mcp", "redis"]
      
      - name: "neo4j"
        image: "neo4j:5.15"
        ports: ["7474:7474", "7687:7687"]
        environment:
          NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
        volumes: ["neo4j_data:/data"]
  
  environment_variables:
    - "NEO4J_URI=bolt://neo4j:7687"
    - "NEO4J_PASSWORD=${NEO4J_PASSWORD}"
    - "GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET}"
    - "RECONCILIATION_SCHEDULE=0 3 * * *"  # 3am daily
    - "EVENT_BATCH_SIZE=100"
    - "GRAPH_QUERY_CACHE_TTL=300"  # 5 minutes

  health_endpoint_additions:
    - path: "/health/event-ingestion"
    - path: "/health/compliance-graph"
    - path: "/health/service-graph"
    - path: "/health/graph-federation"
    - path: "/health/reconciliation"

production_readiness:
  checks_added:
    - "Event ingestion pipeline active"
    - "All 3 federated graphs (Dependency, Compliance, Service) healthy"
    - "Graph query latency < 200ms p95"
    - "Drift rate < 1%"
    - "Last reconciliation < 24h ago"
    - "Neo4j connection healthy"
    - "Redis cache hit rate > 30%"
  
  monitoring_dashboards:
    - name: "Knowledge Ingestion Dashboard"
      panels:
        - "Event ingestion rate (events/sec)"
        - "Graph query latency (p50, p95, p99)"
        - "Drift detection alerts"
        - "Auto-healing success rate"
        - "Cache hit rate"
    
    - name: "Compliance Dashboard"
      panels:
        - "Compliance validations total"
        - "Violations detected by regulation"
        - "Drift alerts by domain"
        - "Top violated controls"
    
    - name: "Service Topology Dashboard"
      panels:
        - "Total services discovered"
        - "Service dependency depth"
        - "Blast radius calculations"
        - "API contract changes"

# ============================================================================
# SUCCESS METRICS
# ============================================================================
success_metrics:
  performance:
    - metric: "Time to Knowledge"
      target: "< 5 seconds"
      measurement: "Git push → graph update latency"
    
    - metric: "Query Latency"
      target: "< 200ms p95"
      measurement: "Federated graph query response time"
    
    - metric: "Compute Efficiency"
      target: "90% reduction vs crawlers"
      measurement: "CPU hours for equivalent knowledge freshness"
  
  accuracy:
    - metric: "Drift Rate"
      target: "< 1%"
      measurement: "Graph state vs repository reality mismatch"
    
    - metric: "Compliance Coverage"
      target: "100%"
      measurement: "% of company/domains/*.yaml controls mapped"
    
    - metric: "Auto-Healing Success"
      target: "> 80%"
      measurement: "Drift corrected without manual intervention"
  
  adoption:
    - metric: "DoR Enrichment Usage"
      target: "> 90%"
      measurement: "% of approvals with graph context displayed"
    
    - metric: "Compliance Validations"
      target: "> 1000/day"
      measurement: "Graph queries for compliance checks"
    
    - metric: "Team Onboarding Speed"
      target: "50% faster"
      measurement: "Time to understand service dependencies"

# ============================================================================
# ROLLBACK PLAN
# ============================================================================
rollback_plan:
  scenarios:
    - scenario: "Event ingestion failures causing graph corruption"
      detection: "Drift rate > 5% sustained for > 1 hour"
      action: "Stop event ingestion, restore graph from last checkpoint"
      recovery_time: "< 30 minutes"
    
    - scenario: "Query latency degradation affecting DoR"
      detection: "Graph query p95 > 500ms sustained for > 5 minutes"
      action: "Disable graph enrichment in DoR, fallback to LENS-only"
      recovery_time: "< 5 minutes"
    
    - scenario: "Neo4j database failure"
      detection: "/health/graph-federation returns unhealthy"
      action: "Switch to read-only cached graph, alert on-call"
      recovery_time: "< 1 minute"
  
  feature_flags:
    - "ENABLE_EVENT_INGESTION=true"
    - "ENABLE_GRAPH_ENRICHMENT=true"
    - "ENABLE_COMPLIANCE_VALIDATION=true"
    - "ENABLE_RECONCILIATION=true"

