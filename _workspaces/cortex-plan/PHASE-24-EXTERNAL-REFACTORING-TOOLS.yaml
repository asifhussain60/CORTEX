---
# PHASE OVERVIEW
---

strategic_context: |
  RefactoringOrchestrator currently supports Python-only execution (black, isort, pylint).
  
  Multi-language groundwork exists:
  - CSharpAdapter: Tree-sitter C# AST analysis (ready)
  - JavaAdapter: Foundation implemented
  - TypeScript detection: In capability_discovery.py
  
  Gap: Analysis-only, no execution/refactoring capabilities
  
  This phase bridges the gap by integrating industry-standard refactoring tools:
  - Rope: Python semantic refactoring (extract, rename, inline, encapsulate)
  - Roslyn: C# type-safe refactorings with compiler validation
  - TypeScript Language Service: TS/JS refactorings (extract, organize, convert)
  - Java tools: IntelliJ CLI or Eclipse Language Server
  
  Outcome: CORTEX becomes the refactoring orchestrator for ANY enterprise language

problem_statement: |
  Current RefactoringOrchestrator (1058 lines) lacks semantic refactoring execution.
  
  Limitations:
  1. Python-only: No C#, Java, TypeScript/JavaScript execution
  2. Syntax-level only: Can format/lint but not refactor (extract methods, rename, etc.)
  3. Type-unsafe: No compiler validation
  4. Limited operations: ~15 strategies vs 100+ in mature tools
  5. Enterprise blockers: 30-40% of target market uses polyglot stacks
  
  Impact: Users must manually refactor after CORTEX analysis (friction, errors)

solution_overview: |
  Introduce RefactoringToolAdapter plugin architecture:
  
  1. Base class: RefactoringToolAdapter (language, capabilities, execute_refactoring)
  2. Implementations:
     - RopeAdapter (Python): extract_method, rename_symbol, inline, encapsulate, move, change_signature
     - RoslynAdapter (C#): extract, rename, inline, encapsulate, pull_up, push_down, introduce_parameter
     - TypeScriptLanguageServiceAdapter (TS/JS): extract function/constant/type, arrow conversion, organize imports
     - JavaLanguageServerAdapter (Java): refactoring via LSP or IntelliJ CLI
  
  3. Integration points:
     - RefactoringOrchestrator.execute_refactoring_plan() routes to adapter
     - EnhancedAuditLogger tracks tool invocations (CORE-027)
     - MCP tools expose adapter capabilities
     - Optional dependency: pip install cortex[refactoring-tools]
  
  4. Safety features:
     - Pre-execution validation (type checking, AST verification)
     - Dry-run mode (show changes without applying)
     - Rollback capability (git integration)
     - Error capture + user-friendly messaging

