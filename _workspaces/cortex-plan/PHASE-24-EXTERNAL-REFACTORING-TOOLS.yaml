      ]
  }
  
  Installation:
  pip install cortex  # Minimal install, no refactoring tools
  pip install cortex[refactoring-tools]  # Full install with Rope
  
  Graceful degradation:
  if not RopeAdapter.is_available():
      log.warn("Rope not installed. Python refactoring unavailable.")
      # Use fallback: Python AST analysis only
      return suggest_refactoring_without_execution()

