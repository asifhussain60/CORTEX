# ARCHITECTURE
---

plugin_architecture: |
  Base Class: RefactoringToolAdapter
  
  ```python
  from abc import ABC, abstractmethod
  from dataclasses import dataclass
  from typing import Dict, List, Optional
  
  @dataclass
  class RefactoringCapability:
      """Describes a refactoring operation the tool supports."""
      name: str  # "extract_method", "rename_symbol", etc.
      description: str
      applies_to: str  # "function", "variable", "class", "module"
      parameters: Dict[str, str]  # Parameter name → type
      type_safe: bool  # Compiler-validated?
      languages: List[str]  # ["python"], ["csharp"], ["typescript", "javascript"]
  
  class RefactoringToolAdapter(ABC):
      """Base class for language-specific refactoring tool adapters."""
      
      tool_name: str  # "rope", "roslyn", "typescript-compiler", "jdt"
      languages: List[str]  # ["python"], ["csharp"], ["typescript", "javascript"], ["java"]
      
      @property
      @abstractmethod
      def capabilities(self) -> List[RefactoringCapability]:
          """Return list of supported refactoring operations."""
          pass
      
      @abstractmethod
      def is_available(self) -> bool:
          """Check if tool is installed and ready."""
          pass
      
      @abstractmethod
      async def execute_refactoring(
          self,
          file_path: str,
          refactoring_name: str,
          parameters: Dict[str, str],
          dry_run: bool = True
      ) -> Dict[str, any]:
          """Execute a refactoring operation.
          
          Returns:
              {
                  "status": "success|error",
                  "changes": [...],  # File diffs
                  "errors": [...],   # If any
                  "applied": bool,   # Was refactoring applied?
              }
          """
          pass
  ```
  
  Concrete Implementations:
  1. RopeAdapter: Rope semantic refactoring for Python
  2. RoslynAdapter: Roslyn compiler APIs for C#
  3. TypeScriptLanguageServiceAdapter: TypeScript Compiler API for TS/JS
  4. JavaLanguageServerAdapter: Language Server Protocol for Java

integration_point: |
  EnhancedRefactoringOrchestrator.execute_refactoring_plan()
  
  Current flow:
    Plan → Evaluate strategies → Score confidence → Report
  
  Enhanced flow:
    Plan → Evaluate strategies → Choose best → Route to adapter → Execute → Audit → Report
  
  Router logic:
    - Detect file language (CSharpAdapter, JavaAdapter, etc.)
    - Find matching adapter in plugin registry
    - Check tool availability (is_available())
    - Execute refactoring via adapter.execute_refactoring()
    - Log audit trail (CORE-027)
    - Return results (changes, errors, status)

mcp_exposure: |
  New MCP tool:
  
  Tool: cortex_execute_refactoring_semantic
  Parameters:
    - file_path: str (path to file)
    - refactoring_operation: str ("extract_method", "rename_symbol", etc.)
    - parameters: Dict[str, str] (operation-specific params)
    - dry_run: bool (preview mode)
  
  Returns:
    {
        "status": "success|error",
        "language": str,
        "tool": str,
        "changes": [...],
        "errors": [...],
        "audit_trail_id": str
    }

optional_dependency_model: |
