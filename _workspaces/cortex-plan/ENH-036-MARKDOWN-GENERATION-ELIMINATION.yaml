# ENH-036: Complete Markdown Generation Elimination
# Comprehensive enforcement to stop all Copilot markdown file creation

id: ENH-036
title: "Complete Markdown Generation Elimination"
status: PLANNED
priority: P0
domain: Governance
created: 2026-02-05
estimated_effort: 2 days

## Problem Statement

Despite CORE-002 (NO markdown file generation), Copilot continues creating:
- completion reports (*-completion.md, *-COMPLETION*.md)
- summary files (*-summary.md, *-SUMMARY*.md)
- report files (*-report.md, *-REPORT*.md)
- Other markdown sprawl in _workspaces/

**Recent Evidence (2026-02-05):**
```
_workspaces/cortex-plan/ORGANIZATION-SUMMARY-2026-02-05.md
_workspaces/cortex-plan/ENH-032-SUMMARY.md
_workspaces/PHASE-9-COMPLETION.md
_workspaces/ARCHITECT-v12-REFACTOR-SUMMARY.md
.github/prompts/PROMPT-UPGRADE-COMPLETION.md
```

**Root Cause:**
- VacuumOrchestrator exists but not automatically invoked
- No pre-generation prevention (only post-cleanup)
- No real-time blocking during chat
- Enforcement is reactive, not proactive

## Objectives

1. **Pre-Generation Blocking**: Stop markdown creation BEFORE files are written
2. **Real-Time Enforcement**: Block during chat sessions (not just AUDIT)
3. **Automatic Cleanup**: Auto-run VacuumOrchestrator after every completion
4. **User Education**: Clear messaging when markdown generation is blocked
5. **Metrics Tracking**: Monitor violation rate and cleanup frequency

## Implementation Plan

### Phase 1: Pre-Generation Hook (Day 1, Morning)
**Deliverable:** Markdown generation interceptor

**Files to create:**
- `cortex/orchestrators/core/markdown_generation_blocker.py` (200 LOC)
- `tests/unit/orchestrators/core/test_markdown_generation_blocker.py` (150 LOC)

**Functionality:**
- Detect file creation intent in real-time
- Pattern matching: `*-completion.md`, `*-summary.md`, `*-report.md`
- Block if path outside docs/.github (except README.md)
- Return user-friendly error: "CORE-002 violation: Inline chat only"

**Integration Point:**
- Hook into copilot-instructions.md checklist
- Add to EnforcementOrchestrator pre-execution gate

**Test Coverage:** 12 tests
- test_detect_markdown_generation_intent (6)
- test_block_completion_files (3)
- test_allow_docs_github_markdown (3)

