# ============================================================================
# PHASE 14.5: UNIVERSAL INLINE DASHBOARD GENERATION SYSTEM
# ============================================================================
# Author: Asif Hussain
# Date: 2026-02-01
# Status: ACTIVE
# Priority: P0 - CRITICAL (Production Dashboard Fix)
# Estimated Duration: 4-6 hours
# Dependencies: Phase 14 (LENS Dashboard), CORTEX LENS v2.0
# Parent Plan: migration-phases-plan.yaml
# ============================================================================

metadata:
  phase_id: "PHASE-14.5"
  phase_name: "Universal Inline Dashboard Generation"
  date_created: "2026-02-01"
  author: "Asif Hussain"
  status: "ACTIVE"
  priority: "P0"
  duration: "4-6 hours"
  dependencies:
    - "PHASE-14 (LENS Dashboard baseline)"
    - "CORTEX LENS v2.0 (Analysis engine)"
    - "Approved Orchestrator View (Design reference)"

# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
executive_summary:
  objective: |
    Create universal, self-contained HTML dashboard generator that works
    for ANY repository analyzed by CORTEX. Single-file output with all
    assets inline (CSS, JS, images) using dark glassmorphism theme.
    
  problem_solved: |
    Current dashboard implementation (kashkole/dashboard.html) has critical flaws:
    - Missing 300x300 CORTEX logo (left-justified)
    - Only 4 tabs instead of required 8 tabs
    - Technical jargon instead of business-friendly language
    - Not reusable - hardcoded for KASHKOLE only
    - Inconsistent UI design vs approved-orchestrator-view
    
  solution: |
    Universal template system + CORTEX LENS integration:
    - Single HTML file with all assets inline (base64)
    - 8-tab architecture covering all analysis dimensions
    - Business-friendly language for non-technical users
    - Dark glassmorphism theme from approved-orchestrator-view
    - Zero external dependencies (works offline)
    - Adaptive to any repository via data injection

# ============================================================================
# ARCHITECTURE
# ============================================================================
architecture:
  core_principles:
    - single_file_portability: "All assets inline via base64 encoding"
    - universal_template: "Adapts to any repo via JSON data injection"
    - business_language: "Human-readable descriptions for all sections"
    - dark_glassmorphism: "Consistent with approved-orchestrator-view"
    - zero_dependencies: "No CDN, no external files, works offline"
    - lens_powered: "All data from CORTEX LENS v2.0 analysis"
    
  eight_tab_architecture:
    overview:
      icon: "📊"
      label: "Overview"
      purpose: "Executive summary - health, metrics, use cases"
      audience: "Business stakeholders, executives"
      data_sources:
        - "CORTEX LENS business description"
        - "Use case detection (business-friendly titles)"
        - "Health score calculation"
        - "Key metrics aggregation"
    
    dependencies:
      icon: "🕸️"
      label: "Dependencies"
      purpose: "Dependency graph and package ecosystem"
      audience: "Architects, technical leads"
      data_sources:
        - "Package.json / requirements.txt parsing"
        - "Import graph analysis"
        - "Dependency tree visualization (D3.js)"
    
    classes:
      icon: "📐"
      label: "Classes"
      purpose: "Class hierarchy and OOP structure"
      audience: "Developers, technical architects"
      data_sources:
        - "AST-based class extraction"
        - "Inheritance relationships"
        - "Method signatures"
    
    timeline:
      icon: "📈"
      label: "Timeline"
      purpose: "Git activity and code evolution"
      audience: "Project managers, technical leads"
      data_sources:
        - "Git log analysis (24-hour context)"
        - "Commit frequency patterns"
        - "Contributor activity"
    
    impact:
      icon: "💥"
      label: "Impact"
      purpose: "Change impact analysis and hotspots"
      audience: "Developers, QA teams"
      data_sources:
        - "File change frequency"
        - "Code churn analysis"
        - "Risk hotspot identification"
    
    security:
      icon: "🔒"
      label: "Security"
      purpose: "Security findings and recommendations"
      audience: "Security teams, compliance officers"
      data_sources:
        - "OWASP Top 10 compliance"
        - "Hardcoded secrets detection"
        - "Vulnerability scanning"
    
    tech_stack:
      icon: "💻"
      label: "Tech Stack"
      purpose: "Technologies detected and ecosystem"
      audience: "Architects, hiring managers"
      data_sources:
        - "Tooling crawler results"
        - "Framework detection"
        - "Language analysis"
    
    architecture:
      icon: "🏗️"
      label: "Architecture"
      purpose: "System architecture and design patterns"
      audience: "Architects, senior developers"
      data_sources:
        - "Folder structure analysis"
        - "Design pattern detection"
        - "Architecture style inference"

# ============================================================================
# FOLDER STRUCTURE
# ============================================================================
folder_structure:
  root: "company/dashboards/tooling/"
  
  structure: |
    company/dashboards/tooling/
    ├── universal_generator.py          # Main generator script
    ├── __init__.py                     # Package marker
    │
    ├── templates/
    │   ├── __init__.py
    │   └── universal_dashboard.html.j2 # Jinja2 template
    │
    ├── data_collectors/
    │   ├── __init__.py
    │   ├── lens_collector.py           # CORTEX LENS integration
    │   ├── security_collector.py       # Security scan data
    │   ├── git_collector.py            # Git history analysis
    │   └── business_translator.py      # Tech → Business language
    │
    └── assets/
        ├── cortex_logo_base64.txt      # Inline logo (300x300)
        └── css_templates/
            └── glassmorphism.css       # Dark glass theme

# ============================================================================
# BUSINESS LANGUAGE MAPPING
# ============================================================================
business_language:
  description: |
    Translate technical terms into business-friendly language
    
  use_case_mapping:
    technical: "CRUD Operations"
    business: "📝 Manage organizational data"
    
    technical: "Reporting & Analytics"
    business: "📊 Track key performance indicators"
    
    technical: "Notifications"
    business: "🔔 Stay informed with real-time alerts"
    
    technical: "File Management"
    business: "📁 Organize and share documents"
    
    technical: "Scheduling"
    business: "📅 Plan and coordinate activities"
    
    technical: "Search & Discovery"
    business: "🔍 Find information quickly"
  
  technology_mapping:
    Python: "🐍 Python - Modern data processing"
    Node.js: "🟢 Node.js - Scalable backend"
    React: "⚛️ React - Interactive user interface"
    SQL Server: "🗄️ SQL Server - Enterprise data storage"
    ASP.NET: "🔷 ASP.NET - Robust web framework"

# ============================================================================
# GLASSMORPHISM THEME SPEC
# ============================================================================
glassmorphism_theme:
  colors:
    bg_primary: "#0a0e27"
    bg_secondary: "#1a1f3a"
    glass_bg: "rgba(26, 31, 58, 0.7)"
    glass_border: "rgba(255, 255, 255, 0.1)"
    accent_primary: "#00d4ff"  # Cyan
    accent_secondary: "#7b61ff"  # Purple
    text_primary: "#ffffff"
    text_secondary: "#a0a6c0"
    success: "#00ff88"
    warning: "#ffa500"
    danger: "#ff4444"
  
  blur_values:
    small: "10px"
    medium: "20px"
    large: "30px"
  
  shadows:
    standard: "0 8px 32px rgba(0, 0, 0, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.2)"
    hover: "0 16px 48px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.3)"
  
  border_radius:
    small: "8px"
    medium: "12px"
    large: "16px"
    xlarge: "24px"

# ============================================================================
# DATA SCHEMA
# ============================================================================
data_schema:
  dashboard_data:
    repo_metadata:
      name: "string"
      path: "string"
      generated_at: "ISO8601 datetime"
      cortex_version: "string"
    
    overview:
      health:
        score: "integer (0-100)"
        label: "string (Excellent|Good|Fair|Poor)"
      metrics:
        technologies_detected: "integer"
        use_cases_identified: "integer"
        security_findings: "integer"
        source_files: "integer"
      project:
        name: "string"
        tagline: "string (business-friendly)"
        description: "string (business-friendly, 2-3 sentences)"
        architecture_summary: "string"
        target_users: "array<string>"
      use_cases:
        - title: "string (business-friendly)"
          description: "string"
          icon: "emoji"
          confidence:
            score: "integer (0-100)"
            level: "string (high|medium|low)"
          evidence_files: "array<string>"
    
    dependencies:
      graph_data: "D3.js force-directed graph JSON"
      packages: "array<{name, version, category}>"
    
    classes:
      hierarchy: "array<{name, parent, methods}>"
    
    timeline:
      commits: "array<{date, author, message, files_changed}>"
      activity_chart: "Chart.js data structure"
    
    impact:
      hotspots: "array<{file, change_frequency, risk_score}>"
    
    security:
      findings:
        p0_risks: "array<{title, description, file, line}>"
        p1_risks: "array<{title, description, file, line}>"
        p2_risks: "array<{title, description, file, line}>"
      summary:
        p0_count: "integer"
        p1_count: "integer"
        p2_count: "integer"
    
    tech_stack:
      technologies: "array<{name, icon, category, confidence, evidence_files}>"
      by_category: "dict<category, array<technology>>"
    
    architecture:
      style: "string (monolith|microservices|layered|etc)"
      patterns: "array<string>"
      folder_structure: "tree structure"

# ============================================================================
# IMPLEMENTATION TASKS
# ============================================================================
tasks:
  - id: "DASH-001"
    title: "Extract glassmorphism CSS from approved-orchestrator-view"
    duration: "30 min"
    deliverable: "tooling/assets/css_templates/glassmorphism.css"
  
  - id: "DASH-002"
    title: "Create universal_dashboard.html.j2 template"
    duration: "2 hours"
    deliverable: "tooling/templates/universal_dashboard.html.j2"
    requirements:
      - "300x300 CORTEX logo (top-left, base64 inline)"
      - "8 tabs with smooth transitions"
      - "Dark glassmorphism theme"
      - "All CSS/JS inline"
      - "Responsive design"
  
  - id: "DASH-003"
    title: "Build lens_collector.py (CORTEX LENS integration)"
    duration: "1.5 hours"
    deliverable: "tooling/data_collectors/lens_collector.py"
    requirements:
      - "Call cortex_lens_analyze MCP tool"
      - "Extract business-friendly descriptions"
      - "Map use cases to business language"
      - "Calculate health scores"
  
  - id: "DASH-004"
    title: "Build business_translator.py"
    duration: "1 hour"
    deliverable: "tooling/data_collectors/business_translator.py"
    requirements:
      - "Translate technical terms → business language"
      - "Generate business-friendly use case titles"
      - "Add emoji icons automatically"
  
  - id: "DASH-005"
    title: "Build universal_generator.py (main CLI)"
    duration: "1 hour"
    deliverable: "tooling/universal_generator.py"
    cli_usage: |
      python -m company.dashboards.tooling.universal_generator \
        --repo /path/to/repo \
        --output /path/to/output/dashboard.html
  
  - id: "DASH-006"
    title: "Generate KASHKOLE dashboard"
    duration: "30 min"
    deliverable: "company/dashboards/kashkole/dashboard.html"
    validation:
      - "300x300 logo visible (top-left)"
      - "All 8 tabs functional"
      - "Business-friendly language"
      - "Dark glassmorphism theme"
      - "Works offline (no external deps)"

# ============================================================================
# ACCEPTANCE CRITERIA
# ============================================================================
acceptance_criteria:
  visual:
    - "✅ 300x300 CORTEX logo visible (left-justified, top of page)"
    - "✅ All 8 tabs present and functional"
    - "✅ Dark glassmorphism theme consistent with approved-orchestrator-view"
    - "✅ Smooth tab transitions with hover effects"
    - "✅ Responsive design (mobile, tablet, desktop)"
  
  content:
    - "✅ Business-friendly project description (no technical jargon)"
    - "✅ Use cases with business-friendly titles and emoji icons"
    - "✅ Evidence files shown but collapsible (not overwhelming)"
    - "✅ Security findings with P0/P1/P2 categorization"
    - "✅ Technology stack with confidence levels"
  
  technical:
    - "✅ Single HTML file (all assets inline)"
    - "✅ No external dependencies (works with python -m http.server)"
    - "✅ Generated from universal template (reusable for any repo)"
    - "✅ CORTEX LENS integration for data collection"
    - "✅ File size < 2MB (reasonable for inline assets)"
  
  universal:
    - "✅ Template adapts to any repository name"
    - "✅ No hardcoded references to KASHKOLE"
    - "✅ Works for Python, Node.js, .NET, etc."
    - "✅ Gracefully handles missing data (empty sections)"

# ============================================================================
# ANTI-PATTERNS (LESSONS LEARNED)
# ============================================================================
anti_patterns:
  avoid:
    - pattern: "Hardcoded repository names in template"
      reason: "Not reusable for other repos"
    
    - pattern: "Technical jargon in user-facing text"
      reason: "Confuses non-technical stakeholders"
    
    - pattern: "External CDN dependencies"
      reason: "Fails offline, security concerns"
    
    - pattern: "Separate JSON files for data"
      reason: "Not portable, harder to share"
    
    - pattern: "Missing logo or incorrect size"
      reason: "Brand inconsistency, poor UX"

# ============================================================================
# COMPLETION CRITERIA
# ============================================================================
completion_criteria:
  phase_complete_when:
    - "universal_generator.py CLI working"
    - "KASHKOLE dashboard generated successfully"
    - "All 8 tabs populated with real data"
    - "300x300 logo visible and properly positioned"
    - "Business-friendly language throughout"
    - "Dashboard works offline (no external deps)"
    - "Template proven reusable (test with 2+ repos)"

# ============================================================================
# END OF PHASE 14.5 SPECIFICATION
# ============================================================================
