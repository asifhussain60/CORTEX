  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 1.4: CLI /ask Command
  # ─────────────────────────────────────────────────────────────────────────
  phase_1_4:
    name: "CLI /ask Command Interface"
    duration: "2-3 hours"
    location: "cortex/cli/commands/ask.py"
    
    description: |
      User-friendly CLI command for explicit inquiry mode. Supports category
      hints, conversation history, and Tier3 knowledge suggestions.
    
    features:
      - "Simple: cortex ask \"question\""
      - "Category hint: cortex ask architecture \"question\""
      - "Show evidence: cortex ask --verbose \"question\""
      - "Code example: cortex ask --show-code \"question\""
      - "History: cortex ask --history (last 10 questions)"
    
    tier3_suggestion_logic:
      trigger: "Question asked 3+ times (by any user in local cache)"
      prompt: |
        💡 This question has been asked 3 times:
        "How does enforcement work?"
        
        Would you like to add this to Tier3 knowledge base?
        - ✅ Yes → Create tier3/knowledge/enforcement-qa.yaml
        - ❌ No → Continue answering dynamically
        - ⏭️ Ask later → Remind after 5 more occurrences
      
      yaml_template: |
        # Auto-generated from inquiry system
        category: {category}
        question: {question}
        answer: {answer}
        evidence: {sources}
        confidence: {score}
        validated_by: {user}
        date: {timestamp}
    
    tasks:
