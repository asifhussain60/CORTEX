# ============================================================================
# RISKS & MITIGATION
# ============================================================================
risks:
  risk_1:
    description: "Answer quality varies by handler"
    probability: "MEDIUM"
    impact: "MEDIUM"
    mitigation:
      - "Peer validation catches low-quality answers"
      - "Confidence scoring flags uncertain responses"
      - "User feedback loop for continuous improvement"
  
  risk_2:
    description: "Cache invalidation complexity (Docker)"
    probability: "MEDIUM"
    impact: "LOW"
    mitigation:
      - "Redis pub/sub for cache invalidation signals"
      - "Time-based expiration (24 hours default)"
      - "Manual invalidation API for urgent updates"
  
  risk_3:
    description: "CodeIndexService stale data"
    probability: "LOW"
    impact: "MEDIUM"
    mitigation:
      - "Rebuild CodeIndexService on each deploy"
      - "Webhook trigger on main branch commits"
      - "Stale data warning if index > 24 hours old"
  
  risk_4:
    description: "Team adoption (change management)"
    probability: "MEDIUM"
    impact: "HIGH"
    mitigation:
      - "Onboarding session (30 min demo)"
      - "Weekly success metrics (questions answered, time saved)"
      - "Gamification (expert leaderboard, badges)"
      - "Integrations (Slack bot, VS Code widget)"

# ============================================================================
# ROLLBACK STRATEGY
# ============================================================================
rollback:
  stage_1_rollback:
    trigger: "MVP validation fails (< 4.0/5.0 rating)"
    steps:
      - "Git revert all inquiry system commits"
      - "Remove /ask CLI command"
      - "Delete .cortex/inquiry_cache.db"
      - "Analyze failure reasons (gather feedback)"
      - "Redesign based on feedback, retry in 2 weeks"
  
  stage_2_rollback:
    trigger: "Production issues (error rate > 5%)"
    steps:
      - "docker-compose -f docker-compose.inquiry.yml down"
      - "Fallback to Stage 1 (local SQLite)"
      - "Analyze logs (Redis/PostgreSQL errors)"
      - "Fix issues in staging environment"
      - "Retry deployment after 3 days"
  
  partial_rollback:
    trigger: "Specific handler underperforming"
    steps:
      - "Disable problematic handler (feature flag)"
      - "Route to generic handler temporarily"
      - "Fix handler offline, redeploy individually"
      - "Re-enable after validation"

