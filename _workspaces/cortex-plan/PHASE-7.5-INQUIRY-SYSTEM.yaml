stage_1_mvp:
  name: "Inquiry System MVP - Local Validation with Multi-Repo Support"
  duration: "19-24 hours (3-4 days)"
  scope: "1-3 core developers, local workspace, CORTEX + user repos"
  
  goals:
    - "Validate inquiry workflow effectiveness"
    - "Test handler specialization approach"
    - "Validate auto-detection of CORTEX vs. user repos"
    - "Measure response quality and accuracy (both repo types)"
    - "Gather usage patterns for Stage 2 design"
  
  architecture:
    entry_point: "MasterOrchestrator (new INQUIRY intent)"
    repo_detection: "RepoDetectionOrchestrator (auto-detect CORTEX vs. user)"
    context_assembly: "ContextAssemblyOrchestrator (repo-aware)"
    handlers: "5 specialized InquiryHandlers (CORTEX-optimized)"
    generic_handler: "GenericCodeInquiryHandler (user repos)"
    cache: "SQLite (.cortex/inquiry_cache.db, repo-scoped)"
    interface: "CLI (/ask command)"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 1.0: RepoDetectionOrchestrator (NEW)
  # ─────────────────────────────────────────────────────────────────────────
  phase_1_0:
    name: "RepoDetectionOrchestrator"
    duration: "2-3 hours"
    location: "cortex/orchestrators/support/repo_detection_orchestrator.py"
    
    description: |
      Intelligent detection of whether a question is about CORTEX codebase
      or the user's own repository. Routes to appropriate handlers based
      on detection results.
    
    detection_algorithm:
      step_1_keyword_analysis:
        description: "Scan question text for CORTEX-specific keywords"
        keywords: ["CORTEX", "TDDOrchestrator", "MasterOrchestrator", "LENS", 
                   "DatabaseBackedRegistry", "CORE-", "Tier3", "docker-plan"]
        confidence: "High if 2+ keywords found"
      
      step_2_working_directory:
        description: "Check current working directory path"
        cortex_path: "/path/to/CORTEX"
        detection: "Exact match or parent directory"
        confidence: "Very High (95%)"
      
      step_3_file_paths:
        description: "Analyze file paths in evidence sources"
        cortex_indicators: ["cortex/", "cortex_brain/", "_workspaces/"]
        user_indicators: ["src/", "app/", "lib/", custom paths]
        confidence: "High (85%)"
      
      step_4_git_remote:
        description: "Check git remote URL if available"
        cortex_remote: "github.com/your-org/CORTEX"
        confidence: "Very High (98%)"
      
      step_5_fallback:
        description: "If ambiguous, ask user"
        prompt: "Is this question about CORTEX or your repository? [C/u]"
    
    routing_logic:
      cortex_detected:
        handlers: "5 specialized InquiryHandlers"
        features_enabled:
          - "Tier3 knowledge access"
          - "CORE rule context"
          - "Team cache participation"
          - "Peer validation (Stage 2)"
          - "Tier3 suggestion workflow"
        cache_scope: "cortex_repo"
      
      user_repo_detected:
        handler: "GenericCodeInquiryHandler"
        features_enabled:
          - "LENS analysis only (Git/AST/Comment)"
          - "Generic code patterns"
          - "Basic caching"
        features_disabled:
          - "No Tier3 knowledge"
          - "No CORE rule context"
          - "No peer validation"
          - "No Tier3 suggestions"
        cache_scope: "{repo_name}_repo"
        disclaimer: "Analyzing your repository (generic code analysis, no domain knowledge)"
    
    tasks:
      - id: "INQUIRY-000"
        name: "Create RepoContext data model"
        files:
          - "cortex/models/inquiry_models.py (RepoContext, RepoType enum)"
        tests: 8
        time: "0.5 hours"
      
      - id: "INQUIRY-001-NEW"
        name: "Implement RepoDetectionOrchestrator"
        files:
          - "cortex/orchestrators/support/repo_detection_orchestrator.py"
        tests: 20
        time: "2 hours"
      
      - id: "INQUIRY-002-NEW"
        name: "Add repo-scoped caching"
        files:
          - "cortex/orchestrators/support/inquiry_cache.py (repo-aware keys)"
        tests: 10
        time: "0.5 hours"
    
    validation:
      - "28+ tests passing"
      - "Detection accuracy > 95%"
      - "Cache isolation verified (CORTEX vs. user repos)"
      - "Fallback prompt works for ambiguous cases"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 1.1: ContextAssemblyOrchestrator (UPDATED)
  # ─────────────────────────────────────────────────────────────────────────
  phase_1_1:
    name: "ContextAssemblyOrchestrator (Repo-Aware)"
    duration: "3-4 hours"
    location: "cortex/orchestrators/support/context_assembly_orchestrator.py"
    
    description: |
      Smart context gathering before answering questions. Assembles evidence
      from multiple sources (code, tests, git history, documentation) to
      ensure accurate, verified responses. NOW REPO-AWARE: adjusts context
      sources based on CORTEX vs. user repo detection.
    
    responsibilities:
      - "Accept RepoContext from RepoDetectionOrchestrator"
      - "Route to TotalRecallAgent for feature discovery (any repo)"
      - "Invoke LENS analyzers (Git/AST/Comment) for code intelligence (any repo)"
      - "Query DatabaseBackedRegistry (CORTEX-only)"
      - "Access GovernanceRegistry (CORTEX-only)"
      - "Access Tier3 knowledge (CORTEX-only)"
      - "Filter test contamination (CORE-030 enforcement)"
      - "Build unified context object for handlers"
    
    key_features:
      - "Parallel context gathering (reduce latency)"
      - "Repo-aware source selection (CORTEX vs. user repo)"
      - "Confidence scoring based on evidence quality"
      - "Smart caching (invalidate on file change, repo-scoped)"
      - "Evidence source tracking (file:line references)"
    
    interface:
      input:
        - "question: str (natural language question)"
        - "repo_context: RepoContext (from RepoDetectionOrchestrator)"
        - "category: Optional[InquiryCategory] (hint for optimization)"
        - "user_context: Optional[UserContext] (team context)"
      
      output:
        - "assembled_context: AssembledContext"
        - "confidence: float (0.0-1.0)"
        - "evidence_sources: List[EvidenceSource]"
        - "cache_hit: bool"
        - "repo_type: RepoType (CORTEX or USER_REPO)"
    
    tasks:
      - id: "INQUIRY-003"
        name: "Create AssembledContext data model (repo-aware)"
        files:
          - "cortex/models/inquiry_models.py"
        tests: 12
        time: "0.5 hours"
      
      - id: "INQUIRY-004"
