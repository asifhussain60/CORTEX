# ============================================================================
# STAGE 2: DOCKER-READY (PRODUCTION SCALE)
# ============================================================================
stage_2_docker:
  name: "Inquiry System - Docker Production Deployment"
  duration: "12-17 hours (2-3 days)"
  scope: "5-100+ users, team collaboration, HA deployment"
  
  prerequisites:
    - "Stage 1 MVP validated (1 week usage)"
    - "User feedback incorporated"
    - "Usage patterns analyzed"
  
  architecture_changes:
    from: "Local SQLite, direct filesystem access"
    to: "Redis cache, PostgreSQL history, CodeIndexService API, stateless"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 2.1: Infrastructure Setup
  # ─────────────────────────────────────────────────────────────────────────
  phase_2_1:
    name: "Docker Infrastructure for Inquiry System"
    duration: "4-6 hours"
    
    description: |
      Create Docker Compose services for inquiry system with distributed
      cache (Redis), persistent history (PostgreSQL), and pre-built code
      index service (build-time AST/Git analysis).
    
    services:
      inquiry_service:
        description: "Stateless inquiry orchestrator (3 replicas)"
        image: "cortex-inquiry:latest"
        replicas: 3
        dependencies:
          - "redis (cache)"
          - "postgres (history)"
          - "code-index-service (analysis)"
        environment:
          - "CACHE_BACKEND=redis://redis:6379"
          - "DB_URL=postgresql://postgres:5432/cortex_inquiry"
          - "CODE_INDEX_URL=http://code-index-service:8080"
        volumes:
          - "cortex_brain/tier0:/app/cortex_brain/tier0:ro (CORE rules only)"
      
      code_index_service:
        description: "Pre-built AST/Git analysis (updated on deploy)"
        image: "cortex-code-index:latest"
        build_strategy: "Extract git history + AST at build time"
        volumes:
          - "code-index-data:/app/index (persistent)"
        api_endpoints:
          - "GET /api/ast/analyze?file={path}"
          - "GET /api/git/history?file={path}"
          - "GET /api/git/blame?file={path}&line={num}"
          - "GET /api/features/search?query={q}"
      
      redis:
        description: "Distributed answer cache (team-wide)"
        image: "redis:7-alpine"
        volumes:
          - "redis-data:/data"
        persistence: "AOF (append-only file)"
      
      postgres:
        description: "Question history + analytics"
        image: "postgres:15-alpine"
        volumes:
          - "postgres-data:/var/lib/postgresql/data"
        schema:
          tables:
            - "questions (id, text, category, user_id, timestamp)"
            - "answers (id, question_id, text, confidence, sources, validated)"
            - "validations (answer_id, user_id, vote, comment, timestamp)"
            - "tier3_suggestions (question_id, status, created_at)"
    
    tasks:
      - id: "INQUIRY-012"
        name: "Create docker-compose.inquiry.yml"
        files:
          - "docker-compose.inquiry.yml"
        time: "1 hour"
      
      - id: "INQUIRY-013"
        name: "Create Dockerfile.inquiry"
        files:
          - "Dockerfile.inquiry"
        features:
          - "Multi-stage build (dependencies cached)"
          - "LENS disabled (use CodeIndexService)"
          - "Stateless design (no local cache)"
        time: "1 hour"
      
      - id: "INQUIRY-014"
        name: "Create CodeIndexService"
        files:
          - "services/code-index/Dockerfile"
          - "services/code-index/indexer.py"
          - "services/code-index/api.py"
        description: |
          Build-time service that extracts git history + AST analysis
          and serves it via HTTP API (no runtime .git/ access needed)
        time: "3 hours"
      
      - id: "INQUIRY-015"
        name: "Create PostgreSQL schema"
        files:
          - "deployment/inquiry-schema.sql"
        time: "0.5 hours"
      
      - id: "INQUIRY-016"
        name: "Add health checks + readiness probes"
        files:
          - "cortex/mcp/inquiry_health.py"
        tests: 5
        time: "0.5 hours"
    
    validation:
      - "docker-compose up -d succeeds"
      - "All services healthy (health checks pass)"
      - "CodeIndexService API responds < 100ms"
      - "Redis cache accessible from all replicas"
      - "PostgreSQL schema created successfully"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 2.2: Stateless Context Assembly
  # ─────────────────────────────────────────────────────────────────────────
  phase_2_2:
    name: "Refactor ContextAssemblyOrchestrator (Stateless)"
    duration: "3-4 hours"
    
    description: |
      Modify ContextAssemblyOrchestrator to be stateless and Docker-native.
      Remove direct filesystem/git access, use CodeIndexService API instead.
    
    changes:
      remove:
        - "Direct .git/ folder access (GitHistoryAnalyzer)"
        - "Direct Python module imports (ASTAnalyzer)"
        - "Local SQLite cache (inquiry_cache.py)"
        - "Local file reads for LENS"
      
      add:
        - "CodeIndexService HTTP client"
        - "Redis cache client (distributed)"
        - "PostgreSQL history logger"
        - "Cache invalidation via pub/sub"
    
    tasks:
      - id: "INQUIRY-017"
        name: "Add CodeIndexService client"
        files:
          - "cortex/infrastructure/code_index_client.py"
        tests: 15
        time: "1.5 hours"
      
      - id: "INQUIRY-018"
        name: "Add Redis cache client"
        files:
          - "cortex/infrastructure/redis_cache.py"
        tests: 10
        time: "1 hour"
      
      - id: "INQUIRY-019"
        name: "Refactor ContextAssemblyOrchestrator"
        files:
          - "cortex/orchestrators/support/context_assembly_orchestrator.py"
        changes: "Replace local access with service calls"
        tests: "Update 20 existing tests"
        time: "1.5 hours"
    
    validation:
      - "All context assembly tests pass (updated)"
      - "No filesystem access in container"
      - "Cache hit rate > 90% (team-wide)"
      - "Context assembly < 300ms (cached)"
      - "Context assembly < 1s (uncached, service call)"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 2.3: Team Collaboration Features
  # ─────────────────────────────────────────────────────────────────────────
  phase_2_3:
    name: "Team Collaboration + Peer Validation"
    duration: "4-5 hours"
    
    description: |
      Add team-specific features: shared question history, peer validation
      workflow, answer voting, expert tagging, and team analytics dashboard.
    
    features:
      question_history:
        description: "Team-wide question history with search"
        api_endpoint: "GET /api/inquiry/history?user={id}&days={n}"
        features:
          - "Most asked questions (last 7 days)"
          - "Unanswered questions queue"
          - "Popular searches"
      
      peer_validation:
        description: "Expert validation workflow for answers"
        workflow:
          1: "Answer generated → 'pending validation' state"
          2: "Notify experts (based on file ownership from git blame)"
          3: "Expert reviews: ✅ Approve | ❌ Dispute | 🔄 Improve"
          4: "After 2+ approvals → 'validated answer'"
          5: "Validated answers rank higher in cache"
        
        expert_selection:
          - "Git blame: who owns the files in evidence?"
          - "Question history: who answered similar questions?"
          - "Tier3 contributors: who wrote related knowledge?"
      
      answer_voting:
        description: "Team members vote on answer quality"
        api_endpoint: "POST /api/inquiry/vote"
        votes: "👍 Helpful | 👎 Not helpful | 🔄 Needs improvement"
        impact: "Answer confidence adjusted based on votes"
      
      team_analytics:
        description: "Dashboard for knowledge gaps + learning patterns"
        metrics:
          - "Questions per category (which area needs docs?)"
          - "Unanswered questions (knowledge gaps)"
          - "Most confused files (high question frequency)"
          - "Expert leaderboard (who answers most?)"
          - "Onboarding bottlenecks (new user questions)"
    
    tasks:
      - id: "INQUIRY-020"
        name: "Create peer validation workflow"
        files:
          - "cortex/orchestrators/domain/inquiry/peer_validator.py"
        tests: 20
        time: "2 hours"
      
      - id: "INQUIRY-021"
        name: "Add answer voting API"
        files:
          - "cortex/api/inquiry_api.py"
        tests: 15
        time: "1.5 hours"
      
      - id: "INQUIRY-022"
        name: "Create team analytics dashboard"
        files:
          - "cortex/visualization/inquiry_dashboard.py"
        format: "HTML dashboard (served by MCP server)"
        time: "1.5 hours"
    
    validation:
      - "Peer validation workflow operational"
      - "Expert notifications sent correctly"
      - "Vote tallying accurate"
      - "Dashboard renders metrics correctly"
  
  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 2.4: Production Deployment
  # ─────────────────────────────────────────────────────────────────────────
  phase_2_4:
    name: "Production Deployment + Monitoring"
    duration: "1-2 hours"
    
    description: |
      Deploy to production with monitoring, alerting, and graceful degradation.
    
    deployment_checklist:
      - "Build Docker images: inquiry-service, code-index-service"
      - "Deploy docker-compose.inquiry.yml"
      - "Warm Redis cache (pre-populate common questions)"
      - "Verify health checks passing"
      - "Test load balancer (3 replicas)"
      - "Configure Prometheus metrics"
      - "Set up alerting (PagerDuty/Slack)"
    
    monitoring:
      metrics:
        - "inquiry_requests_total (counter)"
        - "inquiry_response_time_seconds (histogram)"
        - "inquiry_cache_hit_rate (gauge)"
        - "inquiry_confidence_score (histogram)"
        - "inquiry_validation_rate (gauge)"
      
      alerts:
        - "Cache hit rate < 70% (15 min window)"
        - "Response time > 2s (p95, 5 min window)"
        - "Service unhealthy (any replica)"
        - "PostgreSQL connection errors"
    
    graceful_degradation:
      redis_down: "Fall back to PostgreSQL cache (slower)"
      postgres_down: "Disable history logging, continue answering"
      code_index_down: "Fall back to cached responses only"
      all_down: "Return 503 with retry-after header"
    
    tasks:
      - id: "INQUIRY-023"
        name: "Add Prometheus metrics"
        files:
          - "cortex/observability/inquiry_metrics.py"
        time: "0.5 hours"
      
      - id: "INQUIRY-024"
        name: "Create deployment runbook"
        files:
          - "_workspaces/docker-plan/inquiry-deployment-runbook.md"
        time: "0.5 hours"
      
      - id: "INQUIRY-025"
        name: "Production deployment"
        commands:
          - "docker-compose -f docker-compose.inquiry.yml build"
          - "docker-compose -f docker-compose.inquiry.yml up -d"
          - "docker-compose -f docker-compose.inquiry.yml ps"
        time: "0.5 hours"
    
    validation:
      - "3 replicas running and healthy"
      - "Load balancer distributes requests evenly"
      - "Metrics scraped by Prometheus"
      - "Health endpoints respond < 50ms"
      - "End-to-end test passes (ask → answer → validate)"
  
  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 2 SUMMARY
  # ─────────────────────────────────────────────────────────────────────────
  deliverables:
    files_created: 15
    files_modified: 3
    tests_added: 65
    lines_of_code: ~1500
    
    new_files:
      - "docker-compose.inquiry.yml"
      - "Dockerfile.inquiry"
      - "services/code-index/Dockerfile"
      - "services/code-index/indexer.py"
      - "services/code-index/api.py"
      - "deployment/inquiry-schema.sql"
      - "cortex/mcp/inquiry_health.py"
      - "cortex/infrastructure/code_index_client.py"
      - "cortex/infrastructure/redis_cache.py"
      - "cortex/orchestrators/domain/inquiry/peer_validator.py"
      - "cortex/api/inquiry_api.py"
      - "cortex/visualization/inquiry_dashboard.py"
      - "cortex/observability/inquiry_metrics.py"
      - "_workspaces/docker-plan/inquiry-deployment-runbook.md"
      - "tests/infrastructure/test_code_index_client.py"
    
    modified_files:
      - "cortex/orchestrators/support/context_assembly_orchestrator.py"
      - "cortex/orchestrators/domain/inquiry/*.py (all handlers)"
      - "docker-compose.yml (add inquiry overlay)"
  
  validation_criteria:
    - "65+ new tests passing (100%)"
    - "3 replicas deployed and load balanced"
    - "Cache hit rate > 90% (team-wide)"
    - "Response time < 1s (p95, uncached)"
    - "Peer validation workflow operational"
    - "Team analytics dashboard accessible"
    - "Graceful degradation tested"
    - "Production monitoring active"

