# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
executive_summary:
  problem_statement: |
    Developers need a way to ask intelligent questions about:
    
    CORTEX CODEBASE:
    - Architecture and integration patterns
    - Feature capabilities and entry points
    - Best practices for implementation (Tier3 knowledge)
    - Troubleshooting issues
    - Future evolution and extensibility
    
    USER'S OWN REPOSITORIES:
    - Architecture and component relationships
    - Feature discovery and entry points
    - Code patterns and design decisions
    - Issue analysis and debugging
    
    Current state:
    - CORTEX: Scattered documentation (50+ MD files)
    - CORTEX: 6,847+ tests as only source of truth
    - User repos: No analysis tooling
    - No centralized Q&A system for either
    - Knowledge silos (repeated questions)
    - Slow onboarding for new developers

  solution_overview: |
    Create CORTEX Inquiry System with INTELLIGENT REPO DETECTION:
    
    STAGE 1 (MVP - Local):
    - Extend MasterOrchestrator with INQUIRY intent type
    - RepoDetectionOrchestrator (auto-detect CORTEX vs. user repo)
    - ContextAssemblyOrchestrator for smart context gathering
    - 5 specialized InquiryHandlers (Architecture, Feature, BestPractice, 
      Troubleshooting, Evolution)
    - GenericCodeInquiryHandler (fallback for user repos)
    - Local SQLite cache for answer storage (repo-scoped)
    - CLI /ask command interface
    
    STAGE 2 (Production - Docker):
    - Containerized inquiry service (stateless)
    - Redis distributed cache (multi-repo, team-wide answers)
    - PostgreSQL question history + analytics (repo-tagged)
    - CodeIndexService (build-time AST/Git analysis, multi-repo)
    - Peer validation workflow (CORTEX-only, optional for user repos)
    - Team learning dashboard
    - Load-balanced 3-replica deployment

  routing_intelligence: |
    AUTO-DETECTION ALGORITHM:
    1. Check question text for "CORTEX" keyword
    2. Check current working directory path
    3. Check file paths in evidence sources
    4. Check git remote URL (CORTEX repo vs. other)
    5. Route to:
       - CORTEX handlers (full features: Tier3, team cache, peer validation)
       - Generic handler (code analysis only, no CORTEX-specific knowledge)

  user_experience:
    cortex_question: |
      User: "How does TDDOrchestrator integrate with enforcement?"
      CORTEX: [Detects CORTEX context, uses specialized handler]
      Response: [40-60 word answer with Tier3 knowledge, CORE rules, team validation]
    
    user_repo_question: |
      User: "How does authentication work in my app?" (in /Users/john/my-app)
      CORTEX: [Detects non-CORTEX repo, uses generic code analysis]
      Response: [40-60 word answer from AST/Git analysis only]
      Note: "Analyzing your repository code (no domain knowledge available)"
    
    explicit_command: |
      User: /ask architecture "How does wiring registry work?"
      CORTEX: [Routes to ArchitectureInquiryHandler, returns detailed answer]
    
    tier3_suggestion_cortex_only: |
      [After 3+ identical CORTEX questions across team]
      CORTEX: "💡 This CORTEX question asked 3 times. Add to Tier3 knowledge? [Y/n]"
      
      [User repo questions: No Tier3 suggestion, just cached answers]

  key_differentiators:
    - "Auto-detects CORTEX vs. user repo questions (intelligent routing)"
    - "Implementation-first (not docs) - CORE-030 compliance"
    - "LENS-powered verification (Git/AST/Comment analysis, any repo)"
    - "CORTEX-optimized: Tier3 knowledge, team cache, peer validation"
    - "User repo support: Generic code analysis without domain knowledge"
    - "Team collaboration (shared cache, peer validation for CORTEX)"
    - "Docker-native (stateless, scalable, HA, multi-repo)"
    - "Concise responses (40-60 words, no code spam)"
    - "Voluntary knowledge capture (user-controlled Tier3, CORTEX-only)"
    - "Voluntary knowledge capture (user controls Tier3)"

