  # ─────────────────────────────────────────────────────────────────────────
  # PHASE 1.2.5: GenericCodeInquiryHandler (NEW - User Repos)
  # ─────────────────────────────────────────────────────────────────────────
  phase_1_2_5:
    name: "GenericCodeInquiryHandler (User Repository Support)"
    duration: "2-3 hours"
    location: "cortex/orchestrators/domain/inquiry/generic_code_inquiry_handler.py"
    
    description: |
      Fallback handler for user repository questions. Provides code analysis
      without CORTEX-specific domain knowledge. Uses LENS analyzers only
      (Git/AST/Comment) to answer questions about any codebase.
    
    capabilities:
      - "AST-based architecture analysis (imports, dependencies)"
      - "Git history pattern detection (recent changes, authors)"
      - "Comment-based intent detection (TODO/FIXME patterns)"
      - "Generic code pattern recognition"
      - "Function/class discovery"
    
    limitations:
      - "No Tier3 knowledge (domain-agnostic)"
      - "No CORE rule context (CORTEX-specific)"
      - "No peer validation (user repos are private)"
      - "No Tier3 suggestions (no knowledge base)"
      - "Generic answers only (no framework-specific insights)"
    
    response_format:
      disclaimer: |
        "🔍 Analyzing your repository code (generic analysis, no domain knowledge)
        For CORTEX-specific questions, mention 'CORTEX' explicitly."
      
      content: "40-60 word answer from code analysis"
      evidence: "file:line references from LENS"
      confidence: "0.0-1.0 (typically lower than CORTEX answers)"
    
    example_responses:
      architecture_question: |
        Q: "How does authentication work in my app?"
        A: "Your authentication flow uses JWT tokens (src/auth/jwt.py:45).
           The verify_token function validates tokens via middleware
           (src/middleware/auth.py:28). Database user lookup happens in
           UserRepository.find_by_token (src/repos/user.py:102)."
        
        Evidence:
        - src/auth/jwt.py:45 - JWT token generation
        - src/middleware/auth.py:28 - Token verification middleware
        - src/repos/user.py:102 - User lookup
        
        Confidence: 0.78 (code analysis)
      
      feature_question: |
        Q: "Where is the payment gateway in my code?"
        A: "Payment processing found in src/payments/gateway.py:67.
           Stripe integration via StripeAdapter class (src/payments/adapters/stripe.py:12).
           Transaction logging in PaymentLogger (src/payments/logger.py:34).
           Last modified 3 days ago by john@example.com."
        
        Evidence:
        - src/payments/gateway.py:67 - Main payment entry point
        - src/payments/adapters/stripe.py:12 - Stripe adapter
        - Git: Modified 2026-01-24 by john@example.com
        
        Confidence: 0.82 (code + git analysis)
    
