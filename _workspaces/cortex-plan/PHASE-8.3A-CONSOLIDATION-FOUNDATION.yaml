# =========================================================================
# PHASE 8.3A - CONSOLIDATION FOUNDATION LAYER
# =========================================================================
# Authority: CORTEX Consolidation Architecture (3-Phase Sequential)
# Date: 2026-01-31
# Status: PLANNED
# Dependencies: Phase 8.2 (LENS Intelligence)
# Downstream: Phase 8.3B (Migration Layer)
#
# Purpose:
#   Build detection and prevention infrastructure BEFORE consolidating code.
#   This phase establishes governance gates that make duplication impossible.
#   
# Philosophy:
#   "Stop the bleeding before treating the wound"
#   - Detect duplication at commit time (pre-commit hook)
#   - Block new violations from entering codebase
#   - Gather metrics for informed Phase 8.3B/C decisions
#   - Zero code deletions (additive only)
#
# Risk Profile: 🟢 LOW (No deletions, only new infrastructure)
# =========================================================================

phase:
  id: "PHASE-8.3A"
  name: "Consolidation Foundation Layer"
  version: "1.0"
  authority: "CORTEX Consolidation Architecture"
  status: "PLANNED"
  scheduled_start: "2026-02-03"
  scheduled_end: "2026-02-07"
  duration_days: 5
  owner: "Asif Hussain"
  
# =========================================================================
# ACCEPTANCE CRITERIA
# =========================================================================
acceptance_criteria:
  
  AC-8.3A-001: "DuplicationDetector Orchestrator Implemented"
    description: "Orchestrator that detects code duplications using LENS analyzers"
    status: "NOT_MET"
    validation: |
      - Orchestrator exists at cortex/orchestrators/support/duplication_detector_orchestrator.py
      - Implements IOrchestrator interface
      - Uses ASTAnalyzer to detect function/class duplication
      - Uses GitHistoryAnalyzer to detect copy-paste patterns
      - Generates duplication report with severity scores
      - 100% unit test coverage
    test_file: "tests/unit/orchestrators/support/test_duplication_detector_orchestrator.py"
    
  AC-8.3A-002: "Pre-Commit Hook Blocks Duplications"
    description: "Git pre-commit hook that prevents new duplication patterns"
    status: "NOT_MET"
    validation: |
      - Hook file exists at .git/hooks/pre-commit
      - Detects new ExecutionContext definitions
      - Detects new Registry definitions without BaseRegistry inheritance
      - Detects new Orchestrator base classes
      - Detects new wiring system implementations
      - Can be bypassed with --no-verify (documented in CONTRIBUTING.md)
      - Logs all violations to cortex/infrastructure/duplication_audit_log.txt
    test_file: "tests/integration/test_pre_commit_hook_duplication_prevention.py"
    
  AC-8.3A-003: "Duplication Registry Established"
    description: "Catalog of known duplications with severity and migration path"
    status: "NOT_MET"
    validation: |
      - Registry file created at cortex/core/duplication_registry.py
      - Contains 8 known duplication categories
      - Each entry has: name, files, severity, consolidation_path, owner
      - Severity scoring: CRITICAL (P0), HIGH (P1), MEDIUM (P2), LOW (P3)
      - Registry is machine-readable for tooling
      - Can be queried via CLI: `cortex duplication list`
    test_file: "tests/unit/core/test_duplication_registry.py"
    
  AC-8.3A-004: "Duplication Metrics Dashboard Created"
    description: "Real-time visibility into codebase duplication metrics"
    status: "NOT_MET"
    validation: |
      - Dashboard HTML file created at cortex-lens/duplication-dashboard.html
      - Shows 8 duplication categories with trends
      - Displays prevention metrics (violations blocked)
      - Shows migration path status for each category
      - Auto-refreshes metrics weekly
      - Accessible via `cortex lens dashboard duplication`
    test_file: "tests/integration/test_duplication_dashboard.py"
    
  AC-8.3A-005: "Duplication Prevention Tests Comprehensive"
    description: "Test suite that validates duplication prevention works"
    status: "NOT_MET"
    validation: |
      - 45+ tests covering all 8 duplication categories
      - Tests verify pre-commit hook blocks violations
      - Tests verify metrics are recorded correctly
      - Tests verify duplication registry is accurate
      - Tests verify LENS analyzers detect true duplications
      - Integration tests verify end-to-end prevention
      - All tests pass with 95%+ code coverage
    test_file: "tests/unit/consolidation/test_duplication_prevention.py"
    
  AC-8.3A-006: "Documentation and Runbook Complete"
    description: "Team can understand and extend duplication prevention"
    status: "NOT_MET"
    validation: |
      - Runbook created at docs/12-infrastructure/duplication-prevention-runbook.md
      - Explains how pre-commit hook works
      - Provides troubleshooting guide
      - Shows how to add new duplication patterns to registry
      - Shows how to bypass hook (--no-verify) with caution notice
      - CONTRIBUTING.md updated with duplication policy
      - ADR-8.3A created explaining foundation layer rationale
    test_file: "N/A (documentation)"
    
# =========================================================================
# DELIVERABLES
# =========================================================================
deliverables:

  D1: "DuplicationDetector Orchestrator"
    type: "Python Module"
    location: "cortex/orchestrators/support/duplication_detector_orchestrator.py"
    description: "Orchestrator that detects code duplications"
    owner: "Asif Hussain"
    dependencies:
      - "cortex.brain.analysis.ast_analyzer"
      - "cortex.brain.analysis.git_history_analyzer"
      - "cortex.brain.analysis.comment_extractor"
    capabilities:
      - detect_exact_duplications()
      - detect_semantic_duplications()
      - detect_copy_paste_patterns()
      - generate_duplication_report()
      - suggest_consolidation_path()
    test_coverage: "95%+"
    
  D2: "Pre-Commit Hook Implementation"
    type: "Shell Script + Python"
    location: ".git/hooks/pre-commit"
    description: "Git hook that blocks duplication patterns"
    owner: "Asif Hussain"
    blocked_patterns:
      - "class ExecutionContext:" (unless in cortex/brain/core/orchestrator_base.py)
      - "class.*Registry:" (unless inherits from BaseRegistry)
      - "class.*Orchestrator.*BaseOrchestrator:" (except approved list)
      - "def bootstrap.*wiring():" (unless in cortex/wiring/)
      - "class Orchestrator:" (except legacy compatibility layer)
    test_coverage: "100%"
    
  D3: "Duplication Registry"
    type: "Python Module"
    location: "cortex/core/duplication_registry.py"
    description: "Catalog of known duplications with metadata"
    owner: "Asif Hussain"
    categories: 8
    entries_per_category: "1-3"
    fields_per_entry:
      - id (e.g., "DUP-001-BASE-CLASSES")
      - name (e.g., "Competing Base Class Hierarchies")
      - severity (CRITICAL, HIGH, MEDIUM, LOW)
      - affected_files (list of 3+ files)
      - consolidation_status (PENDING, IN_PROGRESS, COMPLETE)
      - consolidation_path (reference to Phase 8.3B/C)
      - notes (why consolidation is needed)
    
  D4: "Duplication Metrics Dashboard"
    type: "HTML + JavaScript"
    location: "cortex-lens/duplication-dashboard.html"
    description: "Real-time visualization of duplication metrics"
    owner: "Asif Hussain"
    metrics_tracked:
      - Total duplications (by severity)
      - Violations blocked by pre-commit hook (weekly)
      - Consolidation progress (per phase)
      - Lines of duplicate code (by category)
      - Team contributions to prevention
    refresh_frequency: "Weekly"
    
  D5: "Test Suite - Duplication Prevention"
    type: "Python Test Files"
    location: "tests/consolidation/test_duplication_prevention.py"
    description: "45+ tests for duplication detection and prevention"
    owner: "Asif Hussain"
    test_categories:
      - "DuplicationDetector functionality (15 tests)"
      - "Pre-commit hook enforcement (15 tests)"
      - "Duplication registry accuracy (10 tests)"
      - "Metrics collection (5 tests)"
    coverage_target: "95%+"
    
  D6: "Documentation and Runbook"
    type: "Markdown Files"
    locations:
      - "docs/12-infrastructure/duplication-prevention-runbook.md"
      - "docs/10-contributing/duplication-policy.md"
      - "CONTRIBUTING.md (updated section)"
      - "docs/architecture/ADR-8.3A-consolidation-foundation.md"
    owner: "Asif Hussain"
    
