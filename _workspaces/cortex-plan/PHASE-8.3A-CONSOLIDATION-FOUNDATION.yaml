# =========================================================================
# TEST STRATEGY
# =========================================================================
test_strategy:
  
  unit_tests:
    target_coverage: "95%+"
    test_files:
      - "tests/unit/orchestrators/support/test_duplication_detector_orchestrator.py"
      - "tests/unit/core/test_duplication_registry.py"
      - "tests/unit/consolidation/test_duplication_prevention.py"
    test_count: 35
    
  integration_tests:
    test_files:
      - "tests/integration/test_pre_commit_hook_duplication_prevention.py"
      - "tests/integration/test_duplication_dashboard.py"
      - "tests/integration/test_end_to_end_prevention.py"
    test_count: 10
    
  regression_tests:
    description: "Ensure Phase 8.3A doesn't break existing functionality"
    test_files:
      - "Run all 172+ existing tests"
      - "Verify orchestrator wiring still works"
      - "Verify LENS analyzers still work"
    acceptance_criteria: "100% pass rate"
    
  false_positive_prevention:
    description: "Validate pre-commit hook doesn't block legitimate code"
    scenarios:
      - "Allowed: ExecutionContext in cortex/brain/core/orchestrator_base.py"
      - "Allowed: Registry classes inheriting from BaseRegistry"
      - "Allowed: Approved orchestrator base classes"
      - "Blocked: New ExecutionContext in orchestrators/"
      - "Blocked: New Registry without BaseRegistry"
      - "Blocked: New wiring system outside cortex/wiring/"
    
