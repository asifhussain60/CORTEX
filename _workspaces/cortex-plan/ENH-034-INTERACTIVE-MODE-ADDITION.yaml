# =========================================================================
# PROBLEM STATEMENT
# =========================================================================
problem_statement: |
  CORTEX currently has 5 modes (PRE-FLIGHT, AUDIT, DESIGN, DIGEST, META-AUDIT) but lacks
  a dedicated mode for exploratory requests (questions, recommendations, open-ended inquiries).
  
  Current Behavior:
  - User asks "How should I structure this?" → Routed to DESIGN mode
  - DESIGN mode is implementation-focused (mandatory challenge → TDD flow)
  - User just wanted advice, not a full implementation flow
  - INTERACTION ORCHESTRATOR exists (527 LOC) with LENS integration + challenge generation,
    but only used internally in DESIGN mode (underutilized)
  
  Problem:
  1. Questions treated as implementation requests (wrong mode)
  2. Users experience overkill (TDD for advice-seeking)
  3. Broader audience (PMs, architects, researchers) excluded (too engineering-focused)
  4. InteractionOrchestrator capabilities not fully leveraged
  
  Impact:
  - 30-40% of potential CORTEX users unable to get recommendations
  - No exploratory conversation capability
  - Narrow use case (implementation-only) excludes emerging roles
  
  Evidence:
  - cortex-architect.prompt.md lines 55-63: 5 modes defined, no INTERACTIVE
  - cortex-architect.md lines 67-80: Master Mode Flow has no INTERACTIVE path
  - interaction_orchestrator.py line 95: enable_challenges=True forced (designed for challenge system)
  - grep_search: 20 references to InteractionOrchestrator across 13 files, only internal usage

user_specification: |
  "If user asks a question or asks for recommendation or does not specify design or 
  implementation related requests, engage the interaction orchestrator to work with user 
  to do what hes trying to do."
  
  Key Requirements:
  1. Auto-detect questions/recommendations (no explicit /interactive command needed)
  2. Engage InteractionOrchestrator as primary handler (existing 527 LOC)
  3. Provide conversational guidance (no code generation unless explicitly requested)
  4. Support multi-turn conversation (follow-up questions)
  5. Allow transition to DESIGN mode when user requests implementation
  6. Provide challenge when CORTEX disagrees (intelligent disagreement, not rubber-stamp)

# =========================================================================
# ARCHITECTURE DESIGN
# =========================================================================
architecture:
  primary_handler: InteractionOrchestrator
  handler_location: cortex/orchestrators/core/interaction_orchestrator.py
  handler_size: 527 LOC
  handler_capabilities:
    - LENS context building (automatic on every turn)
    - Challenge generation (enabled via enable_challenges=True override at line 95)
    - Conversation protocol enforcement
    - Pattern validation from YAML registry
    - Multi-turn conversation support
  
  mode_trigger_patterns:
    - question_keywords:
        - "How should I"
        - "What's the best way to"
        - "Should I use"
        - "Which approach"
        - "What's the difference between"
        - "How do I"
        - "Why should I"
      pattern_regex: "(how|what|which|why|should).*(do|use|structure|approach|way)?"
    
    - recommendation_keywords:
        - "Recommend"
        - "What would you suggest"
        - "Your thoughts on"
        - "Is this a good idea"
      pattern_regex: "(recommend|suggest|thoughts|good idea)"
    
    - exploratory_keywords:
        - "Tell me about"
        - "Explain"
        - "I'm thinking about"
      pattern_regex: "(tell me|explain|thinking about)"
  
  intent_types:
    - name: ASK
      description: Direct question about approach/architecture/pattern
      keywords: ["how", "what", "which", "should I"]
      handler: INTERACTIVE
    
    - name: INQUIRY
      description: Open-ended inquiry without specific question
      keywords: ["tell me", "explain", "thinking about"]
      handler: INTERACTIVE
    
    - name: RECOMMEND
      description: Explicit recommendation request
      keywords: ["recommend", "suggest", "thoughts on"]
      handler: INTERACTIVE
  
  flow_diagram: |
    User Input (Question/Recommendation)
        ↓
    IntentRouter.classify_intent()
        ↓
    [ASK | INQUIRY | RECOMMEND detected]
        ↓
    InteractionOrchestrator.engage_interactive_mode()
        ├─ LENS Stage 0: Load git context + implementation truth
        ├─ LENS Stage 1: Parse user question (Language)
        ├─ LENS Stage 2: Extract implementation facts (Examination)
        ├─ LENS Stage 3: Find precedents (Navigation)
        └─ LENS Stage 4: Generate recommendation (Synthesis)
        ↓
    [CORTEX Disagrees with implicit user approach?]
        ├─ YES → ChallengeEngine generates intelligent challenge + alternatives
        └─ NO → Direct recommendation
        ↓
    Conversational Response (no code unless requested)
        ├─ Recommendation explanation (1-2 paragraphs)
        ├─ Trade-offs (if applicable)
        └─ Next steps (implement vs continue conversation)
        ↓
    [User Response]
        ├─ "implement {feature}" → Switch to DESIGN mode (TDD flow)
        ├─ Follow-up question → Continue INTERACTIVE (multi-turn)
        ├─ Accept challenge → Use challenger's approach
        └─ Reject challenge → Use original recommendation
  
  files_to_modify:
    phase_1:
      - cortex-architect.prompt.md
        location: lines 55-63 (QUAD-MODE OPERATION table)
        changes:
          - Update section header to "SIX-MODE OPERATION"
          - Add INTERACTIVE row to mode table with trigger pattern
          - Add MODE 5: INTERACTIVE section after DIGEST
      
      - cortex-architect.md
        location: lines 67-80 (Master Mode Flow diagram)
        changes:
          - Add INTERACTIVE path in Mode Detection flow
          - Add INTERACTIVE mode description section
    
    phase_2:
      - intent-routing.yaml
        location: Intent type definitions
        changes:
          - Add ASK intent type (direct questions)
          - Add INQUIRY intent type (open-ended)
          - Add RECOMMEND intent type (recommendations)
          - Map to INTERACTIVE mode routing
      
      - cortex/wiring/specifications/wiring.yaml
        location: Orchestrator registration section
        changes:
          - Register cortex_interactive_mode MCP tool
          - Wire InteractionOrchestrator for standalone invocation
          - Define capabilities: [conversational_guidance, recommendation_engine, exploratory_interaction]
      
      - cortex/orchestrators/core/interaction_orchestrator.py
        location: Main class definition
        changes:
          - Add engage_interactive_mode(user_question: str) → str method
          - Currently only used via ConversationProtocol wrapper
          - Standalone method enables direct INTERACTIVE mode invocation
  
  mcp_tool_specification:
    tool_name: cortex_interactive_mode
    module: cortex/mcp/tools/interactive_mode_tool.py
    parameters:
      user_question:
        type: str
        required: true
        description: User's question, recommendation request, or exploratory inquiry
      conversation_context:
        type: Dict[str, Any]
        required: false
        description: Prior conversation history for multi-turn support
    returns:
      type: Dict[str, Any]
      structure:
        status: "success" | "error"
        recommendation: str
        alternatives: List[Dict]
        challenge_generated: bool
        next_steps: List[str]
    
    example_invocation: |
      result = cortex_interactive_mode(
          user_question="How should I structure the authentication module?",
          conversation_context={"prior_context": [...]}
      )
      Returns: {
          "status": "success",
          "recommendation": "Use JWT with refresh tokens...",
          "alternatives": [
              {"name": "OAuth2 flow", "rationale": "..."},
              {"name": "Session-based", "rationale": "..."}
          ],
          "challenge_generated": true,
          "next_steps": ["Implement", "Continue discussion", "Accept challenge"]
      }

