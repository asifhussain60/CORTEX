  example_1: |
    User: "How should I handle authentication in a microservices architecture?"
    
    CORTEX (INTERACTIVE Mode):
    ## 🤝 CORTEX Interactive
    **Question:** How should I handle authentication in microservices?
    **Context:** Analyzed cortex repository, found JWT pattern in 3 services
    
    ### 💡 Recommendation
    Use centralized JWT service with short-lived tokens + refresh token rotation.
    This pattern:
    - Enables service-to-service communication without credential passing
    - Centralizes token validation (single source of truth)
    - Supports standard OAuth2 flows for external integrations
    
    In your codebase: See cortex/auth/jwt_handler.py (established pattern)
    
    ### ⚡ Alternative Approaches
    1. **Distributed JWT (edge validation):** Each service validates independently
       - Pro: Lower latency (no centralized check)
       - Con: Stale token revocation delays
    
    2. **Session-based (API gateway):** API gateway owns sessions
       - Pro: Simple, familiar pattern
       - Con: Doesn't scale to service-to-service (microservices limitation)
    
    3. **mTLS (mutual TLS):** Certificate-based service authentication
       - Pro: Strongest security posture
       - Con: Operational complexity (certificate rotation, management)
    
    ### 🎯 Recommendation Rationale
    JWT with centralized validation balances security, scalability, and operational simplicity.
    Your codebase already uses this pattern successfully (precedent strength: HIGH).
    
    ### 🚀 Next Steps
    - Ready to implement? Type "implement authentication service"
    - Want to discuss alternatives? Ask follow-up question
    - Switch to audit mode? Type "audit"
    
    ---
  
  example_2: |
    User: "Recommend an error handling strategy for async operations."
    
    CORTEX (INTERACTIVE Mode):
    ## 🤝 CORTEX Interactive
    **Question:** Error handling strategy for async operations?
    **Context:** Analyzed cortex/execution/async_handler.py, found 15 async patterns
    
    ### 💡 Recommendation
    Implement 3-tier error handling:
    1. **Try-catch with specific error types** (task level)
    2. **Graceful degradation** (operation level - fallback values)
    3. **User notification** (system level - inform on timeout/failure)
    
    Evidence: cortex/execution/async_handler.py lines 45-80 shows this pattern working
    
    ### ⚡ CORTEX Challenge ⚠️
    Your question hints at task-level error handling, but you may need operation-level
    handling too. Three-tier approach prevents cascade failures.
    
    Consider: What happens if one async task fails in a batch? Current code: ?
    
    ### 🎯 Three-Tier Pattern
    
    Tier 1 - Task Error Handling:
    try:
        result = await task()
    except SpecificError as e:
        log_error(e)
        raise  # Propagate intentionally
    
    Tier 2 - Operation Degradation:
    try:
        results = await gather(*tasks)
    except Exception:
        return partial_results + defaults
    
    Tier 3 - User Notification:
    if operation_failed:
        notify_user("Some data unavailable, showing cached version")
    
    ### 🚀 Next Steps
    - Implement this approach? Type "implement error handling"
    - Discuss trade-offs? Ask follow-up
    - Switch to implementation? Type "implement"

