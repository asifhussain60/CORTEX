# ============================================================================
# DATABASE CRAWLER ARCHITECTURE
# ============================================================================

database_crawler:
  overview: |
    When connection strings detected or provided, LENS can crawl database schemas:
    - Table structures, column definitions, data types
    - Primary keys, foreign keys, indexes
    - Relationships and entity graphs
    - Stored procedures, functions, triggers
    - Database statistics (table sizes, row counts)
  
  detection_strategy:
    config_files:
      - "web.config, app.config (ConnectionStrings section)"
      - "appsettings.json, appsettings.Development.json"
      - ".env files (DATABASE_URL, SQLSERVER_CONNECTION)"
      - "database.yml (Rails), settings.py (Django)"
    
    encrypted_detection:
      - "Detect encryption type (ASP.NET, DPAPI, Azure Key Vault)"
      - "Prompt user for decryption approach"
      - "Suggest environment variable alternatives"
      - "Never store decrypted secrets"
    
    user_prompts:
      - "Connection string detected but encrypted. Provide decrypted value? (y/n)"
      - "Database requires credentials. Provide read-only connection? (y/n)"
      - "No database access available. Infer from ORM models? (y/n)"
  
  plugin_architecture:
    interface: "DatabaseCrawlerPlugin (abstract base)"
    implementations:
      - name: "SQLServerCrawlerPlugin"
        file: "cortex/lens/plugins/database/sqlserver_crawler.py"
        priority: "P0 (most common enterprise)"
      
      - name: "PostgreSQLCrawlerPlugin"
        file: "cortex/lens/plugins/database/postgresql_crawler.py"
        priority: "P0 (most common dev)"
      
      - name: "OracleCrawlerPlugin"
        file: "cortex/lens/plugins/database/oracle_crawler.py"
        priority: "P1 (enterprise)"
      
      - name: "MySQLCrawlerPlugin"
        file: "cortex/lens/plugins/database/mysql_crawler.py"
        priority: "P2"
      
      - name: "MongoDBCrawlerPlugin"
        file: "cortex/lens/plugins/database/mongodb_crawler.py"
        priority: "P2"
  
  schema_inference_engine:
    purpose: "When direct database access unavailable, infer from ORM models"
    sources:
      - "Entity Framework models (.NET)"
      - "Django models (Python)"
      - "SQLAlchemy models (Python)"
      - "Hibernate entities (Java)"
      - "TypeORM entities (TypeScript)"
    
    output:
      - "Inferred schema (not 100% accurate but useful)"
      - "Confidence: 60-75% (lower than direct crawl)"
      - "Warnings: 'Inferred from models, not actual database'"
  
  security_enforcement:
    - "Read-only connections ONLY"
    - "User consent required before any DB query"
    - "No DML operations (INSERT/UPDATE/DELETE)"
    - "Connection strings never logged or persisted"
    - "Secrets redacted in reports"
    - "Dev environments only (never production)"
  
  output_format:
    - "company/domains/{repo}/database-schema.yaml"
    - "company/domains/{repo}/database-erd.json (for visualization)"

---
# ============================================================================
# EXTERNAL RESEARCH WITH SECURITY
# ============================================================================

external_research:
  overview: |
    LENS can research vendor metadata from public sources to enhance detection:
    - Package registries (PyPI, NPM, NuGet, Maven Central)
    - GitHub repositories (READMEs, documentation)
    - Official vendor documentation URLs
    
    SECURITY: Strict allowlist enforcement, no arbitrary URLs
  
  allowlisted_domains:
    package_registries:
      - domain: "pypi.org"
        purpose: "Python package metadata"
        endpoint: "https://pypi.org/pypi/{package}/json"
        timeout: "5s"
        rate_limit: "10 req/min"
      
      - domain: "registry.npmjs.org"
        purpose: "NPM package metadata"
        endpoint: "https://registry.npmjs.org/{package}"
        timeout: "5s"
        rate_limit: "10 req/min"
      
      - domain: "api.nuget.org"
        purpose: "NuGet package metadata"
        endpoint: "https://api.nuget.org/v3/registration5-semver1/{package}/index.json"
        timeout: "5s"
        rate_limit: "10 req/min"
    
    documentation:
      - domain: "github.com"
        purpose: "README.md files from public repos"
        endpoint: "https://raw.githubusercontent.com/{org}/{repo}/main/README.md"
        timeout: "5s"
        rate_limit: "10 req/min"
        ssl_pinning: true
  
  security_enforcement:
    - "Hardcoded allowlist (no dynamic URLs)"
    - "SSL certificate pinning for all domains"
    - "5-second timeout per request"
    - "Circuit breaker: 3 failures → 10-minute cooldown"
    - "Rate limit: 10 requests/minute per domain"
    - "7-day cache (Redis/file-based)"
    - "Content-hash verification for cached responses"
    - "NO repository code sent to external APIs (only package names/versions)"
  
  cache_strategy:
    ttl: "7 days"
    storage: "File-based (company/.cache/external-research/)"
    invalidation: "Manual via MCP tool or auto-expire"
    verification: "Content-hash check on retrieval"

---
# ============================================================================
# DOMAIN KNOWLEDGE MERGER (SNOWBALL EFFECT)
# ============================================================================

domain_knowledge_merger:
  overview: |
    DomainKnowledgeMerger incrementally enhances company/domains/{repo}/*.yaml
    with each LENS scan, creating a "snowball effect" of accumulated knowledge.
  
  yaml_files_managed:
    - file: "entities.yaml"
      content: "Domain entities, data models, DTOs"
      merge_strategy: "Union by entity name, merge fields"
    
    - file: "vendors.yaml"
      content: "Detected vendor integrations"
      merge_strategy: "Union by vendor name, update confidence"
    
    - file: "tech-stack.yaml"
      content: "Languages, frameworks, databases, libraries"
      merge_strategy: "Union by technology name, update version ranges"
    
    - file: "workflows.yaml"
      content: "Business workflows, process patterns"
      merge_strategy: "Union by workflow ID, merge steps"
    
    - file: "glossary.yaml"
      content: "Business terms extracted from code/comments"
      merge_strategy: "Union by term, enrich definitions"
    
    - file: "database-schema.yaml"
      content: "Crawled database schema"
      merge_strategy: "Replace (schema changes require full scan)"
    
    - file: "learned-patterns.yaml"
      content: "Tier 2 patterns (company-specific)"
      merge_strategy: "Union by pattern name, update confidence"
  
  merge_algorithm:
    load_existing: |
      1. Check if company/domains/{repo}/ exists
      2. Load all YAML files into memory
      3. Parse version, last_updated, author metadata
    
    analyze_new: |
      4. Run all LENS analyzers
      5. Extract new entities, vendors, patterns, etc.
      6. Calculate confidence scores
    
    merge_strategy: |
      7. For each entity type:
         - Union: Add new items, preserve existing
         - Update: Enhance existing items with new data
         - Resolve conflicts: Higher confidence wins
         - Mark source: Track which scan added data
    
    persist_enhanced: |
      8. Update version numbers (semantic versioning)
      9. Update last_updated timestamp
      10. Write enhanced YAMLs back to disk
      11. Generate delta report (what changed)
  
  conflict_resolution:
    same_entity_different_definitions:
      strategy: "Confidence-based winner"
      example: |
        Existing: Member entity (confidence: 0.85, source: scan-2024-01-15)
        New:      Member entity (confidence: 0.92, source: scan-2026-02-02)
        Result:   New definition wins, mark with <<UPDATED:2026-02-02>>
    
    contradictory_workflow_steps:
      strategy: "Manual review flagged"
      example: |
        Existing: Checkout workflow (steps: 1→2→3)
        New:      Checkout workflow (steps: 1→2→4→3)
        Result:   Flag as <<CONFLICT:NEEDS_REVIEW>> in dashboard
  
  output_delta_report:
    file: "company/domains/{repo}/.scan-history/{timestamp}-delta.md"
    content: |
      - Entities added: 12
      - Entities updated: 5
      - Vendors detected: 3 new (LaunchDarkly, Stripe, Auth0)
      - Patterns promoted: 2 (Tier 3 → Tier 2)
      - Glossary terms: 45 new
      - Conflicts flagged: 1 (workflow definition mismatch)

