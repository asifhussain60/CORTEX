---
# ============================================================================
# RISKS & MITIGATION
# ============================================================================

risks:
  - risk: "Database connection failures (credentials, network)"
    probability: "HIGH"
    impact: "MEDIUM"
    mitigation: |
      - Graceful fallback to schema inference from ORM models
      - User-friendly error messages with troubleshooting
      - Never crash on DB connection failure
  
  - risk: "External API rate limits exceeded"
    probability: "MEDIUM"
    impact: "LOW"
    mitigation: |
      - Circuit breaker (3 failures → 10-min cooldown)
      - 7-day cache to reduce API calls
      - Queue requests for retry after cooldown
  
  - risk: "False positives in pattern detection"
    probability: "HIGH"
    impact: "MEDIUM"
    mitigation: |
      - 3-Tier system with manual review for Tier 3
      - Confidence thresholds (only show >70% by default)
      - False positive suppression rules
      - Dashboard "Dismiss" button
  
  - risk: "Encrypted connection strings unusable"
    probability: "HIGH"
    impact: "LOW"
    mitigation: |
      - Detect encryption type, prompt user for alternatives
      - Schema inference as fallback (60-75% confidence)
      - Clear documentation on decryption approaches
  
  - risk: "LENS scan too slow (100K+ LOC repos)"
    probability: "MEDIUM"
    impact: "MEDIUM"
    mitigation: |
      - Parallelized analyzers (ThreadPoolExecutor)
      - Cache intermediate results
      - Progress bar + ETA display
      - Skip binary files early

