# ============================================================================
# VISION: MULTI-FACETED LENS INTELLIGENCE WITH SNOWBALL EFFECT
# ============================================================================

vision:
  goal: |
    Transform LENS into a comprehensive multi-faceted intelligence system that:
    - Executes ALL capabilities (AST, Git, Config, Pattern, Vendor, Database) in single scan
    - Builds domain knowledge incrementally (snowball effect)
    - Discovers patterns dynamically with 3-tier confidence classification
    - Detects vendor dependencies intelligently
    - Crawls database schemas when connection strings available
    - Researches external knowledge from allowlisted sources only
    - Updates company/domains/{repo}/*.yaml with each scan
    
  key_principles:
    - "Unified Execution": One LENS call → all analyzers fire
    - "Snowball Effect": Each scan enhances existing domain knowledge
    - "Tiered Confidence": Known (99%) → Learned (70-95%) → Candidate (<70%)
    - "Security First": Dev-only, secrets redacted, user consent gates
    - "External Research": Allowlisted domains only (GitHub, PyPI, NPM, NuGet)
    - "Pluggable Architecture": DatabaseCrawlerPlugin, VendorDetector extensible

