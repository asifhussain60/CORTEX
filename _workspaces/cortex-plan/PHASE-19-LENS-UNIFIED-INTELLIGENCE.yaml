# ============================================================================
# ARCHITECTURE: 3-TIER PATTERN DISCOVERY SYSTEM
# ============================================================================

pattern_discovery:
  overview: |
    LENS dynamically discovers patterns and classifies them into 3 tiers based on confidence:
    
    TIER 1: KNOWN PATTERNS (Hardcoded, 99% confidence)
      - Battle-tested patterns shipped with CORTEX
      - Repository Pattern, Service Layer, Unit of Work, Factory, etc.
      - Vendor patterns: LaunchDarkly, Stripe, Auth0, Twilio, SendGrid
      - Database patterns: SQL Server, PostgreSQL, Oracle, MySQL, MongoDB
      - Framework patterns: .NET, Spring Boot, Django, Flask, Express
      - File: cortex/knowledge/patterns/known_patterns.yaml
    
    TIER 2: LEARNED PATTERNS (Dynamic, 70-95% confidence)
      - Company-specific patterns discovered across 3+ repo scans
      - Promoted from Tier 3 after manual review
      - Example: "Hijri Date Adapter" (Islamic calendar utility)
      - File: company/domains/learned-patterns.yaml (versioned)
    
    TIER 3: CANDIDATE PATTERNS (Quarantine, <70% confidence)
      - First-time detections, unknown vendors/frameworks
      - Requires human review before promotion to Tier 2
      - Dashboard flags: "Review Pattern" button
      - File: company/domains/candidate-patterns.yaml (temporary)
  
  confidence_scoring:
    algorithm: |
      confidence = base_score * multipliers
      
      base_score:
        - Known pattern match: 0.99
        - Learned pattern match: varies (stored per pattern)
        - Unknown pattern: 0.3-0.7 (depends on signal strength)
      
      multipliers:
        - import_count: (actual / 3.0) capped at 1.5
        - config_presence: 1.2 if found in config files
        - documentation_match: 1.1 if README mentions
        - naming_consistency: 1.1 if follows conventions
        - external_verification: 1.3 if PyPI/NPM confirms
      
      final_score = min(confidence, 0.99)  # Cap at 99%
  
  false_positive_suppression:
    - "Common variable names filtered (client, service, manager alone)"
    - "Standard library imports ignored (Python stdlib, .NET BCL)"
    - "Test mocks excluded (Mock, Fake, Stub patterns)"
    - "Minimum frequency threshold (3+ files)"
    - "Context analysis (not just string matching)"

