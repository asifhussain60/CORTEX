# ============================================================================
# MCP TOOLS EXPOSURE
# ============================================================================

mcp_tools:
  - name: "cortex_lens_discover_patterns"
    purpose: "Scan repository for unknown patterns, return Tier 3 candidates"
    parameters:
      - target_path: "Directory or file to analyze"
      - confidence_threshold: "Minimum confidence (default: 0.3)"
    returns:
      - candidate_patterns: "List[Pattern] with confidence scores"
      - known_matches: "List[Pattern] from Tier 1"
      - learned_matches: "List[Pattern] from Tier 2"
  
  - name: "cortex_lens_research_vendor"
    purpose: "Look up vendor metadata from PyPI/NPM (allowlisted APIs only)"
    parameters:
      - vendor_name: "Vendor or package name"
      - ecosystem: "pypi | npm | nuget"
    returns:
      - metadata: "Package description, version, homepage"
      - confidence: "Research confidence (0-100%)"
      - cached: "Boolean (from cache or live API)"
  
  - name: "cortex_lens_promote_pattern"
    purpose: "Promote Tier 3 candidate to Tier 2 learned pattern"
    parameters:
      - pattern_id: "Candidate pattern identifier"
      - approval_reason: "Human review notes"
    returns:
      - promoted: "Boolean success"
      - new_tier: "2 (learned)"
      - confidence: "Updated confidence score"
  
  - name: "cortex_lens_get_learned_patterns"
    purpose: "Retrieve company-specific learned patterns"
    parameters:
      - domain: "Optional domain filter"
    returns:
      - patterns: "List[LearnedPattern] from Tier 2"
      - total_count: "Integer"
  
  - name: "cortex_lens_dismiss_candidate"
    purpose: "Mark Tier 3 pattern as false positive"
    parameters:
      - pattern_id: "Candidate pattern identifier"
      - reason: "Why dismissed (e.g., 'common variable name')"
    returns:
      - dismissed: "Boolean success"
      - suppressed: "Future alerts for this pattern disabled"
  
  - name: "cortex_onboard_repository"
    purpose: "Full repository onboarding with LENS unified scan"
    parameters:
      - repo_path: "Path to repository"
      - domain: "Optional domain assignment"
      - enable_database_crawl: "Boolean (default: false, requires user consent)"
      - connection_string: "Optional database connection (read-only)"
    returns:
      - onboarding_report: "Full scan results"
      - domain_yamls_updated: "List of updated YAML files"
      - vendors_detected: "List[Vendor]"
      - patterns_discovered: "List[Pattern] with tiers"
      - database_schema: "Optional schema if crawled"

