# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
executive_summary:
  objective: |
    Streamlined prompts for autonomous CORTEX development.
    cortex-architect.prompt.md v2.0 executes without confirmation gates.
    
  goals:
    - Delete deprecated prompts/agents (COMPLETE)
    - cortex-architect v2.0 with autonomous execution
    - Concise audit output (action items only)
    - LENS-powered context alignment
    
  outcome: |
    CORTEX.prompt.md - operations (with DoR gates)
    cortex-architect.prompt.md - design (autonomous, no gates)
    Zero clutter files

# ============================================================================
# STAGE 1: PROMPT ECOSYSTEM CLEANUP ✅ COMPLETE
# ============================================================================
stage_1:
  name: "Prompt & Agent Consolidation"
  duration: "1-2 hours"
  ac_id: "PROMPT-001"
  status: "COMPLETE"
  
  description: |
    Deleted all prompts/agents except CORTEX.prompt.md ecosystem.
    Executed on remote via Phase 8.3 consolidation work.
  
  retain_files:
    prompts:
      - path: ".github/prompts/CORTEX.prompt.md"
        reason: "Master orchestrator prompt - SSOT for all operations"
      - path: ".github/prompts/README.md"
        reason: "Documentation for prompts folder"
      - path: ".github/prompts/guides/"
        reason: "Supporting guides for CORTEX prompt"
        
    agents:
      - path: ".github/agents/core/CORTEX.md"
        reason: "Master agent definition"
      - path: ".github/agents/README.md"
        reason: "Documentation for agents folder"
        
  delete_files:
    prompts_to_delete:
      - path: ".github/prompts/cortex-doc.prompt.md"
        reason: "Documentation handled by CORTEX.prompt.md"
      - path: ".github/prompts/cortex-enforcement.prompt.md"
        reason: "Enforcement built into CORTEX.prompt.md governance"
      - path: ".github/prompts/cortex-git-commit.prompt.md"
        reason: "Git operations handled by GitOrchestrator"
      - path: ".github/prompts/cortex-healthcheck.prompt.md"
        reason: "Health checks in cortex/mcp/health_checker.py"
      - path: ".github/prompts/cortex-total-recall-backup-4405lines.prompt.md"
        reason: "Backup file - not needed"
      - path: ".github/prompts/cortex-total-recall.prompt.md"
        reason: "TotalRecallAgent in cortex/tools/"
      - path: ".github/prompts/archived/"
        reason: "Archive folder - historical, not needed"
        
    agents_to_delete:
      - path: ".github/agents/core/cortex-enforcement-agents.md"
        reason: "Enforcement in CORTEX governance tier0"
      - path: ".github/agents/core/cortex-planner.md"
        reason: "Planning handled by PlanningOrchestrator"
      - path: ".github/agents/core/cortex-total-recall.md"
        reason: "TotalRecallAgent in cortex/tools/"
      - path: ".github/agents/archived/"
        reason: "Archive folder - historical, not needed"
        
  commands:
    - id: "PROMPT-001-01"
      description: "Delete deprecated prompts"
      command: |
        rm -f .github/prompts/cortex-doc.prompt.md
        rm -f .github/prompts/cortex-enforcement.prompt.md
        rm -f .github/prompts/cortex-git-commit.prompt.md
        rm -f .github/prompts/cortex-healthcheck.prompt.md
        rm -f .github/prompts/cortex-total-recall-backup-4405lines.prompt.md
        rm -f .github/prompts/cortex-total-recall.prompt.md
        rm -rf .github/prompts/archived/
        
    - id: "PROMPT-001-02"
      description: "Delete deprecated agents"
      command: |
        rm -f .github/agents/core/cortex-enforcement-agents.md
        rm -f .github/agents/core/cortex-planner.md
        rm -f .github/agents/core/cortex-total-recall.md
        rm -rf .github/agents/archived/
        
  validation:
    - check: "Only CORTEX.prompt.md exists"
      command: "ls -la .github/prompts/*.prompt.md | wc -l"
      expected: "1"
    - check: "Only CORTEX.md agent exists"
      command: "ls -la .github/agents/core/*.md | wc -l"
      expected: "2"  # CORTEX.md + README.md

# ============================================================================
# STAGE 2: CREATE CORTEX-ARCHITECT PROMPT
# ============================================================================
stage_2:
  name: "Create cortex-architect.prompt.md"
  duration: "2-3 hours"
  ac_id: "PROMPT-002"
  
  description: |
    Create a new design-phase prompt for architecture analysis and 
    enhancement. This prompt auto-activates advanced analysis on every
    request without requiring explicit user commands.
    
    CRITICAL: This is NOT a production prompt - it's for CORTEX design only.
    No backward compatibility considerations needed.
  
  prompt_specification:
    file_path: ".github/prompts/cortex-architect.prompt.md"
    version: "1.0"
    
    auto_behaviors:
      on_every_request:
        - id: "ARCH-AUTO-001"
          name: "LENS 24-Hour Context Alignment"
          description: |
            Automatically scan git history for past 24 hours to:
            - Understand recent architectural decisions
            - Identify work in progress
            - Align new work with existing momentum
            - Prevent conflicting changes
          implementation: |
            Use GitHistoryAnalyzer from cortex/brain/analysis/
            Filter commits from last 24 hours
            Extract intent patterns and file changes
            
        - id: "ARCH-AUTO-002"
          name: "Request Enhancement"
          description: |
            Enhance every user request by identifying:
            - Scenarios not considered
            - Blind spots in the approach
            - Edge cases that could break design
            - Implications for other components
          implementation: |
            Cross-reference request against:
            - cortex-plan phases
            - cortex/ implementation
            - cortex_brain/ governance
            - src/ domain code
            
        - id: "ARCH-AUTO-003"
          name: "Challenge with Alternatives"
          description: |
            If better alternatives exist, challenge the user's approach:
            - Analyze extensibility implications
            - Assess scalability impact
            - Balance accuracy vs efficiency
            - Consider CORTEX long-term growth trajectory
          implementation: |
            Use ChallengeEngine from IntentRouter
            Apply 5 disagreement types
            Present alternatives with trade-off analysis
            
        - id: "ARCH-AUTO-004"
          name: "Architecture Recommendation"
          description: |
            Provide best recommendation that:
            - Enhances existing architecture
            - Avoids creating duplicates
            - Prevents bloat and complexity
            - Eliminates potential conflicts
            - Aligns with existing patterns
          output_format: |
            Executive summary with bullet points
            NO code snippets
            Concise, actionable guidance
            
        - id: "ARCH-AUTO-005"
          name: "Auto-Cleanup Execution"
          description: |
            Automatically delete clutter files:
            - *.bak files (backup artifacts)
            - Report/summary .md files outside approved locations
            
            Approved locations (EXCLUDED from cleanup):
            - _workspaces/
            - .github/
            - docs/
          implementation: |
            find . -name "*.bak" -delete
            find . -name "*-REPORT.md" -not -path "./_workspaces/*" -not -path "./.github/*" -not -path "./docs/*" -delete
            find . -name "*-SUMMARY.md" -not -path "./_workspaces/*" -not -path "./.github/*" -not -path "./docs/*" -delete
      
      on_no_request:
        name: "Holistic Architecture Audit"
        description: |
          When cortex-architect prompt is invoked without a specific request,
          perform aggressive codebase analysis:
          
          1. DUPLICATE DETECTION:
             - Scan for multiple implementations of same concept
             - Identify redundant orchestrators
             - Find duplicate utility functions
             - Flag copy-pasted code blocks
          
          2. EXECUTION PATH ANALYSIS:
             - Map all entry points to orchestrators
             - Identify orphaned/unreachable code paths
             - Find dead code that's never executed
             - Detect circular dependencies
          
          3. DEBLOATING ASSESSMENT:
             - Calculate code-to-value ratio
             - Identify over-engineered abstractions
             - Find unused imports and dead dependencies
             - Assess configuration sprawl
          
          4. TEST COVERAGE AUDIT:
             - Find deprecated tests (testing removed features)
             - Identify missing tests for critical paths
             - Detect test-only dependencies
             - Assess test isolation quality
          
          5. CONSOLIDATION OPPORTUNITIES:
             - Recommend merge candidates
             - Identify extraction opportunities
             - Suggest architectural simplifications
        
        output_format: |
          Executive summary with:
          - Critical issues (P0)
          - High-priority items (P1)
          - Consolidation roadmap
          - Estimated cleanup effort
          
          NO code snippets - architecture guidance only
  
  agent_specification:
    file_path: ".github/agents/core/cortex-architect.md"
    version: "1.0"
    
    agent_identity: |
      You are the CORTEX Architect Agent - responsible for:
      - Holistic architecture analysis
      - Design-phase decision support
      - Duplicate and bloat detection
      - Long-term scalability planning
      
    response_header: |
      ## 🏗️ CORTEX Architect
      **Author:** Asif Hussain | **Mode:** Design Phase | **Scope:** Architecture ✅
      
      ---
      
    lens_integration:
      - GitHistoryAnalyzer: "24-hour context window"
      - ASTAnalyzer: "Code structure and complexity"
      - CommentExtractor: "TODO/FIXME priority extraction"
      
    analysis_targets:
      - "cortex-plan/migration-phases-plan.yaml"
      - "cortex/**/*.py"
      - "cortex_brain/**/*.py"
      - "src/**/*"
      - "tests/**/*.py"

# ============================================================================
# STAGE 3: ORPHAN FILE CLEANUP
# ============================================================================
stage_3:
  name: "Automated Cleanup Execution"
  duration: "30 minutes"
  ac_id: "PROMPT-003"
  
  description: |
    Execute automated cleanup of orphan files that CORTEX doesn't need.
    These are artifacts from development that add noise without value.
  
  cleanup_targets:
    backup_files:
      pattern: "**/*.bak"
      action: "DELETE"
      reason: "Backup artifacts - Git provides version history"
      
    orphan_reports:
      patterns:
        - "*-REPORT.md"
        - "*-COMPLETION*.md"
        - "*-STATUS*.md"
        - "*-SUMMARY*.md"
      exclude_paths:
        - "_workspaces/**"
        - ".github/**"
        - "docs/**"
      action: "DELETE"
      reason: "Reports should be inline in chat, not files"
      
    stale_analysis:
      patterns:
        - "**/.analysis/**"
        - "**/analysis-*.md"
      exclude_paths:
        - ".github/.analysis/**"  # Keep GitHub analysis
      action: "REVIEW"
      reason: "May contain valuable context - review before delete"
      
  commands:
    - id: "PROMPT-003-01"
      description: "Delete all .bak files"
      command: "find . -name '*.bak' -type f -delete"
      
    - id: "PROMPT-003-02"
      description: "Delete orphan report files (excluding approved paths)"
      command: |
        find . -type f \( \
          -name '*-REPORT.md' -o \
          -name '*-COMPLETION*.md' -o \
          -name '*-STATUS*.md' -o \
          -name '*-SUMMARY*.md' \
        \) \
        -not -path './_workspaces/*' \
        -not -path './.github/*' \
        -not -path './docs/*' \
        -delete
        
    - id: "PROMPT-003-03"
      description: "List remaining .md files for review"
      command: |
        find . -name '*.md' \
          -not -path './_workspaces/*' \
          -not -path './.github/*' \
          -not -path './docs/*' \
          -not -path './node_modules/*' \
          -not -name 'README.md' \
          -type f
          
  validation:
    - check: "No .bak files remain"
      command: "find . -name '*.bak' | wc -l"
      expected: "0"
    - check: "Orphan reports cleaned"
      command: "find . -name '*-REPORT.md' -not -path './_workspaces/*' -not -path './.github/*' -not -path './docs/*' | wc -l"
      expected: "0"

# ============================================================================
# VALIDATION GATE
# ============================================================================
validation_gate:
  name: "Prompt Consolidation Gate"
  
  acceptance_criteria:
    - id: "AC-PROMPT-001"
      description: "Only CORTEX.prompt.md and cortex-architect.prompt.md exist"
      validation: "ls .github/prompts/*.prompt.md | wc -l == 2"
      
    - id: "AC-PROMPT-002"
      description: "Only CORTEX.md and cortex-architect.md agents exist in core/"
      validation: "ls .github/agents/core/CORTEX*.md | wc -l == 2"
      
    - id: "AC-PROMPT-003"
      description: "No .bak files in repository"
      validation: "find . -name '*.bak' | wc -l == 0"
      
    - id: "AC-PROMPT-004"
      description: "No orphan report files outside approved paths"
      validation: "find . -name '*-REPORT.md' -not -path approved_paths == 0"
      
    - id: "AC-PROMPT-005"
      description: "cortex-architect.prompt.md contains all auto-behaviors"
      validation: "grep -c 'ARCH-AUTO' .github/prompts/cortex-architect.prompt.md >= 5"
      
    - id: "AC-PROMPT-006"
      description: "No archived prompts or agents remain"
      validation: "ls .github/prompts/archived 2>/dev/null || echo 'OK'"
      
  on_success: "Proceed to use cortex-architect.prompt.md for design work"
  on_failure: "Review remaining files and cleanup manually"

# ============================================================================
# DELIVERABLES
# ============================================================================
deliverables:
  files_created:
    - path: ".github/prompts/cortex-architect.prompt.md"
      description: "Design-phase architecture analysis prompt"
      
    - path: ".github/agents/core/cortex-architect.md"
      description: "Architect agent definition"
      
  files_deleted:
    prompts: 7
    agents: 4
    backup_files: "variable"
    orphan_reports: "variable"
    
  capabilities_added:
    - "Automatic 24-hour git context on every request"
    - "Request enhancement with blind spot detection"
    - "Alternative challenge engine"
    - "Holistic audit mode (no-request invocation)"
    - "Automated cleanup of .bak and orphan files"

# ============================================================================
# END OF PHASE 14 SPECIFICATION
# ============================================================================
