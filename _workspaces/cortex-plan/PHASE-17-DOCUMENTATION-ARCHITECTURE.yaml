---
# ============================================================================
# DECISION LOG
# ============================================================================

decisions:
  - id: "D17-001"
    question: "Separate advisor vs enhanced orchestrator?"
    decision: "Enhanced orchestrator with advisory mode"
    rationale: "CORE-035 (single canonical implementation), simpler architecture"
  
  - id: "D17-002"
    question: "D3.js vs Mermaid for complex diagrams?"
    decision: "D3.js primary, SVG for static, Mermaid deprecated"
    rationale: "Full control over glassmorphism theming, interactivity"
  
  - id: "D17-003"
    question: "Content source format?"
    decision: "Markdown with YAML frontmatter + JSON diagram data"
    rationale: "Maintainable, version-controlled, familiar to developers"

