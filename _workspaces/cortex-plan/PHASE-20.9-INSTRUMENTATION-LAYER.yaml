---
# ============================================================================
# EXECUTIVE VISION
# ============================================================================

vision:
  mission: |
    Create a lightweight instrumentation layer that captures development metrics
    during dashboard implementation, enabling evidence-driven tool enhancements
    in parallel without blocking workstreams.
    
  key_principles:
    - "Build-Measure-Learn: Data drives enhancement priorities"
    - "No blocking: Dashboard proceeds while tool gaps are measured"
    - "Low overhead: <5ms per instrumented operation"
    - "Actionable: Metrics trigger specific enhancement thresholds"
    - "Non-invasive: Existing code unchanged, metrics added via decorators/hooks"
    
  target_outcomes:
    - "Capture TDD cycle metrics (time, failures, retries)"
    - "Track debugging session patterns (duration, success rate)"
    - "Monitor code generator usage (templates, customizations)"
    - "Identify orchestrator performance bottlenecks"
    - "Generate evidence for tool enhancement prioritization"

---
# ============================================================================
# ARCHITECTURE
# ============================================================================

architecture:
  core_components:
    instrumentation_orchestrator:
      file: "cortex/orchestrators/support/instrumentation_orchestrator.py"
      purpose: "Coordinate metrics capture, aggregation, and threshold monitoring"
      dependencies:
        - "cortex/observability/metrics_collector.py"
        - "cortex/observability/enhancement_trigger.py"
      
    metrics_collector:
      file: "cortex/observability/metrics_collector.py"
      purpose: "Low-level metrics capture with sampling support"
      features:
        - "Time-series storage (in-memory + periodic flush)"
        - "Configurable sampling rate"
        - "Context-aware metrics (operation, orchestrator, phase)"
        
    enhancement_trigger:
      file: "cortex/observability/enhancement_trigger.py"
      purpose: "Threshold-based enhancement PR creation suggestions"
      thresholds:
        tdd_cycle_time_p90: 300  # seconds, triggers if >5min
        debugger_failure_rate: 0.05  # triggers if >5%
        code_gen_customization_rate: 0.10  # triggers if >10%
        orchestrator_latency_p95: 2000  # ms, triggers if >2s
        
  mcp_tools:
    cortex_capture_metrics:
      description: "Record development metrics for analysis"
      parameters:
        - operation_type  # tdd|debug|codegen|orchestrator
        - operation_name
        - duration_ms
        - success (boolean)
        - metadata (dict, optional)
        
    cortex_get_enhancement_recommendations:
      description: "Analyze metrics and return evidence-driven enhancement suggestions"
      returns:
        - recommendations list with priority, evidence, effort
        
  integration_points:
    decorators:
      - "@instrument_tdd_cycle"
      - "@instrument_debug_session"
      - "@instrument_code_gen"
      - "@instrument_orchestrator"
      
    hooks:
      - "pre_test_run / post_test_run"
      - "debug_start / debug_end"
      - "generation_start / generation_complete"

---
# ============================================================================
# METRICS SCHEMA
# ============================================================================

metrics_schema:
  tdd_metrics:
    fields:
      - cycle_id: "uuid"
      - phase: "RED|GREEN|REFACTOR"
      - orchestrator: "string"
      - test_file: "string"
      - duration_ms: "integer"
      - success: "boolean"
      - failure_reason: "string (optional)"
      - retry_count: "integer"
    aggregations:
      - avg_cycle_time
      - p90_cycle_time
      - failure_rate
      - retry_rate
      
  debug_metrics:
    fields:
      - session_id: "uuid"
      - orchestrator: "string"
      - target_file: "string"
      - duration_ms: "integer"
      - resolved: "boolean"
      - resolution_method: "string (optional)"
      - steps_taken: "integer"
    aggregations:
      - avg_resolution_time
      - success_rate
      - steps_per_resolution
      
  codegen_metrics:
    fields:
      - generation_id: "uuid"
      - template_name: "string"
      - target_type: "orchestrator|tool|test|component"
      - duration_ms: "integer"
      - success: "boolean"
      - customizations_applied: "integer"
      - manual_edits_needed: "boolean"
    aggregations:
      - template_usage_count
      - customization_rate
      - manual_edit_rate
      
  orchestrator_metrics:
    fields:
      - invocation_id: "uuid"
      - orchestrator_name: "string"
      - operation: "string"
      - duration_ms: "integer"
      - success: "boolean"
      - error_type: "string (optional)"
    aggregations:
      - avg_latency
      - p95_latency
      - success_rate
      - error_distribution

---
# ============================================================================
# ENHANCEMENT TRIGGER LOGIC
# ============================================================================

enhancement_triggers:
  p0_triggers:
    - condition: "tdd_metrics.p90_cycle_time > 300s AND sample_size > 10"
      enhancement: "TDD Orchestrator Acceleration"
      evidence_template: |
        **Metrics (last 7 days):**
        - P90 cycle time: {p90_cycle_time}s (threshold: 300s)
        - Sample size: {sample_size} cycles
        - Top slow phases: {slow_phases}
        
        **Suggested Fix:** Add test result caching, parallel test execution
        **Effort:** M (3 days)
        **Expected Impact:** 60% cycle time reduction
        
    - condition: "debug_metrics.failure_rate > 0.05 AND sample_size > 20"
      enhancement: "Debugger Reliability Improvement"
      evidence_template: |
        **Metrics (last 7 days):**
        - Failure rate: {failure_rate}% (threshold: 5%)
        - Sample size: {sample_size} sessions
        - Common failure modes: {failure_modes}
        
        **Suggested Fix:** Add fallback strategies, improve error handling
        **Effort:** S (2 days)
        **Expected Impact:** <2% failure rate
        
  p1_triggers:
    - condition: "codegen_metrics.customization_rate > 0.10 AND sample_size > 50"
      enhancement: "Code Generator Template Expansion"
      evidence_template: |
        **Metrics (last 7 days):**
        - Customization rate: {customization_rate}% (threshold: 10%)
        - Missing templates: {missing_templates}
        - Manual edit patterns: {edit_patterns}
        
        **Suggested Fix:** Add templates for common patterns
        **Effort:** M (4 days)
        **Expected Impact:** <5% customization rate
        
    - condition: "orchestrator_metrics.p95_latency > 2000ms AND sample_size > 100"
      enhancement: "Orchestrator Performance Optimization"
      evidence_template: |
        **Metrics (last 7 days):**
        - P95 latency: {p95_latency}ms (threshold: 2000ms)
        - Slow orchestrators: {slow_orchestrators}
        
        **Suggested Fix:** Add caching, optimize hot paths
        **Effort:** M (3 days)
        **Expected Impact:** <500ms P95 latency

