configuration:
  cache_settings:
    default_ttl_language: 300        # 5 minutes
    default_ttl_examination: 1800    # 30 minutes
    default_ttl_navigation: 3600     # 60 minutes
    default_ttl_synthesis: 300       # 5 minutes
    max_entries: 1000
    max_size_mb: 100
    lru_eviction_enabled: true

  environment_variables:
    - "CORTEX_LENS_CACHE_ENABLED=true"
    - "CORTEX_LENS_CACHE_BACKEND=redis|memory"
    - "CORTEX_LENS_CACHE_REDIS_URL=redis://localhost:6379/0"
    - "CORTEX_LENS_CACHE_TTL_LANGUAGE=300"
    - "CORTEX_LENS_CACHE_TTL_EXAMINATION=1800"
    - "CORTEX_LENS_CACHE_TTL_NAVIGATION=3600"
    - "CORTEX_LENS_CACHE_TTL_SYNTHESIS=300"

