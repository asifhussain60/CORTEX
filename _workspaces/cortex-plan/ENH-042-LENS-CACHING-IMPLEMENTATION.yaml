rollback_plan:
  trigger: "Cache corruption detected OR >5% LENS accuracy regression"
  steps:
    1. "Disable CORTEX_LENS_CACHE_ENABLED env var"
    2. "Fall back to uncached LENS orchestrator"
    3. "Flush all cache entries"
    4. "Monitor accuracy metrics for recovery"

risk_mitigation:
  cache_invalidation:
    strategy: "File content hash + repo state = automatic invalidation"
    fallback: "Manual cache flush via CLI command"
  
  redis_failure:
    strategy: "Automatic fallback to in-memory backend"
    logging: "Warning logs on Redis connection failures"
  
  memory_pressure:
    strategy: "LRU eviction + configurable max size"
    monitoring: "Memory usage metrics dashboarded"

