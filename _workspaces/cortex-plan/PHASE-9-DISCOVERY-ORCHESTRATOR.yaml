  - command: "/discover-services {repo_path}"
    description: "Discover microservices topology"
    example: "/discover-services /Users/user/my-app"
  
  - command: "/topology-diagram {repo_path}"
    description: "Generate Mermaid architecture diagram"
    example: "/topology-diagram /Users/user/my-app"

