# ============================================================================
# PHASE 9.3: LENS INTEGRATION & ADVANCED FEATURES
# ============================================================================
phase_9_3:
  name: "LENS Integration + Caching + Watch Mode"
  duration: "4-6 hours"
  priority: "P2-MEDIUM"
  status: "PLANNED"
  
  description: |
    Integrate LENS intelligence for code-based config analysis, add
    distributed caching, and implement watch mode for real-time updates.
  
  objectives:
    - Integrate LENSOrchestrator for code-based config (decorators, annotations)
    - Add Redis-based distributed caching
    - Implement watch mode (file system monitoring)
    - Create topology export formats (diagrams, JSON, YAML)
    - Add topology diff/comparison tools
    - Create DiscoveryMCP tool for GitHub Copilot integration
  
  # Task breakdown
  tasks:
    - id: "DISC-008"
      name: "LENS Integration for Code-Based Config"
      priority: "P2"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/lens_config_analyzer.py"
          purpose: "Use LENS to analyze code-based configuration"
        - path: "tests/unit/brain/discovery/test_lens_config_analyzer.py"
          purpose: "LENS config analyzer tests (10 tests)"
      
      implementation:
        class_name: "LENSConfigAnalyzer"
        integration: "Uses LENSOrchestrator for AST analysis"
        detection_strategies:
          - "Route decorators (Flask @app.route, FastAPI @router.get)"
          - "Configuration attributes (ASP.NET [ApiController])"
          - "DI container registrations (services.AddDbContext)"
          - "Environment variable usage (os.getenv, process.env)"
          - "Connection string builders in code"
        
        methods:
          - "analyze_with_lens(repo_path: Path) -> LENSConfigInfo"
          - "extract_route_decorators(lens_context: LENSContext) -> List[RouteInfo]"
          - "extract_config_attributes(lens_context: LENSContext) -> List[ConfigAttr]"
          - "extract_env_var_usage(lens_context: LENSContext) -> List[EnvVarUsage]"
          - "verify_config_consistency(file_config: Dict, code_config: Dict) -> ConsistencyReport"
      
      test_coverage:
        - "Extract Flask route decorators"
        - "Extract FastAPI route decorators"
        - "Extract ASP.NET attributes"
        - "Extract environment variable usage"
        - "Detect config-code mismatches (CORE-030)"
      
      acceptance_criteria:
        - "✅ 10/10 tests passing"
        - "✅ Integrates with LENSOrchestrator"
        - "✅ Extracts code-based config"
        - "✅ Verifies config consistency (CORE-030)"
    
    - id: "DISC-009"
      name: "Distributed Caching & Watch Mode"
      priority: "P2"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/topology_cache.py"
          purpose: "Multi-tier caching (memory, file, Redis)"
        - path: "cortex/brain/discovery/topology_watcher.py"
          purpose: "File system monitoring for real-time updates"
        - path: "tests/unit/brain/discovery/test_topology_cache.py"
          purpose: "Cache tests (10 tests)"
        - path: "tests/unit/brain/discovery/test_topology_watcher.py"
          purpose: "Watcher tests (8 tests)"
      
      implementation:
        caching:
          class_name: "TopologyCache"
          tiers:
            - "L1: In-memory (LRU, 100 entries)"
            - "L2: File system (.cortex/topology-cache/)"
            - "L3: Redis (team-shared, optional)"
          methods:
            - "get(repo_path: Path) -> Optional[TopologyMap]"
            - "set(repo_path: Path, topology: TopologyMap, ttl: int)"
            - "invalidate(repo_path: Path, file_patterns: List[str])"
            - "get_cache_stats() -> CacheStats"
        
        watch_mode:
          class_name: "TopologyWatcher"
          monitoring: "watchdog library for file system events"
          watched_patterns:
            - "*.config, *.json, *.yaml, *.toml, *.ini"
            - "docker-compose*.yml, Dockerfile"
            - "*.proto, *.graphql"
          methods:
            - "start_watching(repo_path: Path, callback: Callable)"
            - "stop_watching()"
            - "on_config_changed(event: FileSystemEvent)"
      
      test_coverage:
        - "Cache hit/miss scenarios"
        - "L1 → L2 → L3 fallback"
        - "Cache invalidation on file change"
        - "Watch mode detects config changes"
        - "Watch mode triggers re-discovery"
        - "Redis cache sharing (team scenario)"
      
      acceptance_criteria:
        - "✅ 18/18 tests passing"
        - "✅ 3-tier caching implemented"
        - "✅ Watch mode detects changes"
        - "✅ Redis integration (optional)"
    
    - id: "DISC-010"
      name: "Topology Export & Visualization"
      priority: "P2"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/topology_exporter.py"
          purpose: "Export topology to multiple formats"
        - path: "tests/unit/brain/discovery/test_topology_exporter.py"
          purpose: "Exporter tests (12 tests)"
      
      implementation:
        class_name: "TopologyExporter"
        export_formats:
          - "JSON (machine-readable)"
          - "YAML (human-readable)"
          - "Mermaid diagram (architecture diagram)"
          - "PlantUML (UML diagram)"
          - "DOT (Graphviz)"
        
        methods:
          - "export_json(topology: TopologyMap, output_path: Path)"
          - "export_yaml(topology: TopologyMap, output_path: Path)"
          - "export_mermaid_diagram(topology: TopologyMap) -> str"
          - "export_plantuml_diagram(topology: TopologyMap) -> str"
          - "export_service_graph(topology: TopologyMap) -> nx.DiGraph"
          - "create_diff_report(old: TopologyMap, new: TopologyMap) -> DiffReport"
      
      test_coverage:
        - "Export to JSON format"
        - "Export to YAML format"
        - "Generate Mermaid diagram"
        - "Generate PlantUML diagram"
        - "Create topology diff report"
        - "Handle export errors gracefully"
      
      acceptance_criteria:
        - "✅ 12/12 tests passing"
        - "✅ Exports to 5 formats"
        - "✅ Generates architecture diagrams"
        - "✅ Creates diff reports"

  # Acceptance criteria for Phase 9.3
  acceptance_criteria:
    tests:
      total: 30
      passing_required: 30
      coverage_min: "90%"
    
    files_created:
      - "cortex/brain/discovery/lens_config_analyzer.py"
      - "cortex/brain/discovery/topology_cache.py"
      - "cortex/brain/discovery/topology_watcher.py"
      - "cortex/brain/discovery/topology_exporter.py"
      - "tests/unit/brain/discovery/test_lens_config_analyzer.py"
      - "tests/unit/brain/discovery/test_topology_cache.py"
      - "tests/unit/brain/discovery/test_topology_watcher.py"
      - "tests/unit/brain/discovery/test_topology_exporter.py"
    
    governance:
      - "✅ CORE-008: All tests written before implementation"
      - "✅ CORE-030: LENS verification of config consistency"
      - "✅ Watch mode triggers AC logging"

# ============================================================================
# INTEGRATION POINTS
# ============================================================================
integration_points:
  onboarding_orchestrator:
    purpose: "Complexity-based learning path selection"
    integration:
      - "Feed discovered topology complexity into user level assessment"
      - "Advanced track if 3+ databases, 10+ microservices detected"
      - "Beginner track if single database, monolithic app detected"
    example: |
      topology = discovery.discover_topology(repo_path)
      complexity = topology.calculate_complexity_score()  # 0-100
      
      if complexity > 70:
          onboarding.recommend_track(OnboardingLevel.ADVANCED)
      elif complexity > 40:
          onboarding.recommend_track(OnboardingLevel.INTERMEDIATE)
  
  setup_orchestrator:
    purpose: "Environment validation and auto-configuration"
    integration:
      - "Validate discovered configs match setup expectations"
      - "Auto-generate environment variables from discovered secrets"
      - "Warn if discovered database not in setup profile"
    example: |
      topology = discovery.discover_topology(repo_path)
      setup_requirements = setup.get_requirements()
      
      for db in topology.databases:
          if db not in setup_requirements.databases:
              setup.warn(f"Discovered database {db} not in setup profile")
  
  documentation_orchestrator:
    purpose: "Auto-generate architecture documentation"
    integration:
      - "Generate architecture diagrams from discovered topology"
      - "Create API documentation from discovered endpoints"
      - "Build ER diagrams from discovered database schemas"
    example: |
      topology = discovery.discover_topology(repo_path)
      exporter = TopologyExporter()
      
      mermaid_diagram = exporter.export_mermaid_diagram(topology)
      doc_orchestrator.add_section("Architecture", mermaid_diagram)
  
  refactoring_orchestrator:
    purpose: "Coupling detection and refactoring suggestions"
    integration:
      - "Identify tightly coupled services from service dependency graph"
      - "Suggest microservices extraction from monolithic detection"
      - "Detect circular dependencies in service mesh"
    example: |
      topology = discovery.discover_topology(repo_path)
      circular_deps = topology.microservices.detect_circular_dependencies()
      
      if circular_deps:
          refactor.suggest_break_circular_dependency(circular_deps)
  
  tdd_orchestrator:
    purpose: "Test fixture generation from discovered data structures"
    integration:
      - "Generate test fixtures from discovered database models"
      - "Create integration test stubs for discovered APIs"
      - "Generate mock configurations from discovered services"
    example: |
      topology = discovery.discover_topology(repo_path)
      
      for api_endpoint in topology.apis.endpoints:
          tdd.generate_integration_test_stub(api_endpoint)
  
  lens_orchestrator:
    purpose: "Unified code + config intelligence"
    integration:
      - "Combine LENS AST analysis with config file discovery"
      - "Verify config files match code expectations (CORE-030)"
      - "Detect config-code drift"
    example: |
      lens_context = lens.analyze_file(Path("app.py"))
      config_topology = discovery.discover(repo_path, include_lens=True)
      
      consistency = config_topology.verify_consistency(lens_context)
      if not consistency.is_consistent:
          report_violation(consistency.mismatches)

# ============================================================================
# MCP TOOL SPECIFICATION
# ============================================================================
mcp_tool:
  name: "discover_topology"
  description: "Discover infrastructure topology (DBs, APIs, microservices, testing)"
  category: "discovery"
  
  parameters:
    - name: "repo_path"
      type: "string"
      required: true
      description: "Path to repository to analyze"
    
    - name: "discovery_types"
      type: "array"
      required: false
      description: "Types to discover (config, database, api, microservices, testing, security)"
      default: ["all"]
    
    - name: "include_lens"
      type: "boolean"
      required: false
      description: "Include LENS code analysis for config verification"
      default: false
    
    - name: "export_format"
      type: "string"
      required: false
      description: "Export format (json, yaml, mermaid, plantuml, dot)"
      default: "json"
    
    - name: "use_cache"
      type: "boolean"
      required: false
      description: "Use cached topology if available"
      default: true
  
  returns:
    type: "TopologyMap"
    description: "Complete infrastructure topology"
    schema:
      config:
        connection_strings: "List[ConnectionString]"
        environment_variables: "Dict[str, str]"
        feature_flags: "List[FeatureFlag]"
      
      databases:
        - type: "string"  # postgresql, mssql, etc.
          orm: "string"  # sqlalchemy, entity_framework, etc.
          models: "List[ModelInfo]"
          migrations: "MigrationHistory"
      
      apis:
        endpoints: "List[EndpointInfo]"
        graphql_schemas: "List[GraphQLInfo]"
        grpc_services: "List[GRPCService]"
      
      microservices:
        services: "List[ServiceInfo]"
        dependencies: "nx.DiGraph"
        circular_dependencies: "List[ServiceCircle]"
      
      testing:
        framework: "string"
        test_files: "List[TestFileInfo]"
        coverage_thresholds: "CoverageInfo"
      
      security:
        auth_providers: "List[AuthProvider]"
        logging: "LoggingInfo"
        monitoring: "MonitoringInfo"
      
      metadata:
        discovery_time_ms: "int"
        cache_hit: "boolean"
        lens_enhanced: "boolean"

# ============================================================================
# GITHUB COPILOT INTEGRATION
# ============================================================================
copilot_commands:
  - command: "/discover {repo_path}"
    description: "Discover infrastructure topology for repository"
    example: "/discover /Users/user/my-app"
  
  - command: "/discover-db {repo_path}"
    description: "Discover only database topology"
    example: "/discover-db /Users/user/my-app"
  
  - command: "/discover-apis {repo_path}"
    description: "Discover only API endpoints"
