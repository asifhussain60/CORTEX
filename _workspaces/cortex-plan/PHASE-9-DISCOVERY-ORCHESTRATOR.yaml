# ============================================================================
# CORTEX cortex-plan: PHASE 9 - DISCOVERY ORCHESTRATOR
# ============================================================================
# Date: 2026-01-27
# Authority: CORTEX Master Orchestrator
# Status: PLANNED (Approved for immediate implementation)
# Priority: P1-HIGH (foundational infrastructure intelligence)
# 
# Strategic Context:
#   User Request: "Add config file reading to understand DB, APIs, microservices"
#   Analysis: OnboardingOrchestrator inappropriate (wrong responsibility)
#   Solution: New DiscoveryOrchestrator for infrastructure topology intelligence
#
# Key Principles:
#   - Extensibility: 7+ discovery types, plugin architecture for new parsers
#   - Scalability: Parallel parsing, incremental updates, watch mode
#   - Accuracy: LENS-powered verification (CORE-030 Implementation Truth)
#   - Efficiency: Multi-level caching, lazy loading, minimal re-parsing
#   - Collaboration: Shared topology cache for team insights
# ============================================================================

metadata:
  phase_name: "DiscoveryOrchestrator - Infrastructure Intelligence System"
  date_created: "2026-01-27"
  phase_id: "9"
  status: "PLANNED"
  priority: "P1-HIGH"
  blocking: false  # Does not block existing functionality
  foundational: true  # Enables future AI-powered features
  
  # Delivery strategy
  delivery_strategy: "TDD_INCREMENTAL"
  stage_1: "Core discovery engine + 3 parsers (config, database, API)"
  stage_2: "Microservices + testing + security parsers"
  stage_3: "LENS integration + caching + watch mode"
  
  # Estimated effort
  total_hours: "18-24 hours"
  stage_1_hours: "8-10 hours"
  stage_2_hours: "6-8 hours"
  stage_3_hours: "4-6 hours"
  
  # Strategic alignment
  strategic_goals:
    extensibility:
      rating: "★★★★★"
      rationale: "Plugin architecture - add new config types without core changes"
    scalability:
      rating: "★★★★★"
      rationale: "Parallel parsing, incremental updates, multi-repo support"
    accuracy:
      rating: "★★★★★"
      rationale: "LENS-powered verification, code + config unified view"
    efficiency:
      rating: "★★★★★"
      rationale: "3-tier caching (memory/file/distributed), lazy loading"
    team_collaboration:
      rating: "★★★★☆"
      rationale: "Shared topology cache, team-wide insights, Redis backend ready"
  
  # Impact assessment
  impact:
    new_files: "~15 files"
    new_tests: "~80 tests"
    lines_of_code: "~2,800 lines"
    integration_points: 6  # OnboardingOrch, SetupOrch, DocOrch, RefactorOrch, TDDOrch, LENS
    
  # Governance compliance
  core_rules_applied:
    - "CORE-008: TDD (tests before implementation)"
    - "CORE-011: Type hints mandatory"
    - "CORE-012: Google-style docstrings"
    - "CORE-013: Specific exception handling"
    - "CORE-026: Git checkpoints before major changes"
    - "CORE-027: Audit trail logging (AC_START/EXECUTE/COMPLETE)"
    - "CORE-030: Implementation Truth (verify code, not just docs)"
    - "CORE-035: Single Canonical Implementation (no duplicates)"
    - "CORE-038: File Placement Policy (cortex/orchestrators/support/)"

# ============================================================================
# PHASE 9.1: CORE DISCOVERY ENGINE
# ============================================================================
phase_9_1:
  name: "Core Discovery Engine + Configuration Intelligence"
  duration: "8-10 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Build foundational discovery engine with plugin architecture and
    first 3 discovery modules: Configuration Files, Database Topology, API Mapping.
    
  objectives:
    - Create DiscoveryOrchestrator base class with plugin system
    - Implement ConfigurationDiscovery (web.config, appsettings.json, yaml, toml, env)
    - Implement DatabaseDiscovery (connection strings, ORMs, migrations)
    - Implement APIDiscovery (Swagger/OpenAPI, REST endpoints, GraphQL)
    - Create unified topology output format
    - Add memory caching layer
    - Wire to DatabaseBackedRegistry
  
  # Task breakdown
  tasks:
    - id: "DISC-001"
      name: "DiscoveryOrchestrator Base Class"
      priority: "P0"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/orchestrators/support/discovery_orchestrator.py"
          purpose: "Main orchestrator class with plugin architecture"
        - path: "tests/unit/orchestrators/support/test_discovery_orchestrator.py"
          purpose: "Base orchestrator tests (15 tests)"
      
      implementation:
        class_name: "DiscoveryOrchestrator"
        base_class: "BaseOrchestrator"
        methods:
          - "discover_topology() -> TopologyMap"
          - "register_discovery_plugin(plugin: DiscoveryPlugin)"
          - "discover_by_type(discovery_type: DiscoveryType) -> Dict[str, Any]"
          - "get_cached_topology(repo_path: Path) -> Optional[TopologyMap]"
          - "invalidate_cache(repo_path: Path, file_patterns: List[str])"
        
      test_coverage:
        - "Plugin registration and discovery"
        - "Topology aggregation from multiple plugins"
        - "Cache hit/miss scenarios"
        - "Parallel plugin execution"
        - "Error isolation (plugin failure doesn't crash others)"
      
      acceptance_criteria:
        - "✅ 15/15 tests passing"
        - "✅ Type hints on all methods"
        - "✅ Google-style docstrings"
        - "✅ Wired to DatabaseBackedRegistry"
        - "✅ AC_START/COMPLETE logging"
    
    - id: "DISC-002"
      name: "Configuration File Discovery"
      priority: "P0"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/config_discovery.py"
          purpose: "Parse config files (JSON, YAML, TOML, XML, INI, ENV)"
        - path: "tests/unit/brain/discovery/test_config_discovery.py"
          purpose: "Config parser tests (20 tests)"
      
      implementation:
        class_name: "ConfigurationDiscovery"
        implements: "DiscoveryPlugin"
        supported_formats:
          - "web.config (XML)"
          - "appsettings.json (JSON)"
          - "appsettings.{env}.json (environment-specific)"
          - "docker-compose.yml (YAML)"
          - "kubernetes/*.yaml (K8s manifests)"
          - ".env, .env.local (environment variables)"
          - "config.toml (TOML)"
          - "*.ini (INI files)"
        
        extracted_data:
          - "Connection strings"
          - "API endpoints"
          - "Service URLs"
          - "Port configurations"
          - "Environment variables"
          - "Feature flags"
          - "Security settings (CORS, CSP)"
        
        methods:
          - "discover(repo_path: Path) -> ConfigTopology"
          - "parse_xml_config(file_path: Path) -> Dict[str, Any]"
          - "parse_json_config(file_path: Path) -> Dict[str, Any]"
          - "parse_yaml_config(file_path: Path) -> Dict[str, Any]"
          - "parse_toml_config(file_path: Path) -> Dict[str, Any]"
          - "parse_env_file(file_path: Path) -> Dict[str, str]"
          - "extract_connection_strings(config: Dict) -> List[ConnectionString]"
      
      test_coverage:
        - "Parse web.config with connection strings"
        - "Parse appsettings.json with nested sections"
        - "Parse docker-compose.yml with services"
        - "Parse .env files with secrets"
        - "Extract connection strings from multiple formats"
        - "Handle malformed config files gracefully"
        - "Detect config file changes for cache invalidation"
      
      acceptance_criteria:
        - "✅ 20/20 tests passing"
        - "✅ Supports 8 config formats"
        - "✅ Extracts connection strings from all formats"
        - "✅ Graceful error handling (malformed files)"
        - "✅ Secret masking (no plaintext passwords in output)"
    
    - id: "DISC-003"
      name: "Database Topology Discovery"
      priority: "P0"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/database_discovery.py"
          purpose: "Analyze database configurations and ORMs"
        - path: "tests/unit/brain/discovery/test_database_discovery.py"
          purpose: "Database discovery tests (15 tests)"
      
      implementation:
        class_name: "DatabaseDiscovery"
        implements: "DiscoveryPlugin"
        detection_strategies:
          - "Connection string parsing (from config files)"
          - "ORM model scanning (Entity Framework, SQLAlchemy, Sequelize, TypeORM)"
          - "Migration file analysis (Flyway, Liquibase, Alembic, Knex)"
          - "DbContext/SessionFactory detection"
        
        supported_databases:
          - "SQL Server (MSSQL)"
          - "PostgreSQL"
          - "MySQL/MariaDB"
          - "SQLite"
          - "Oracle"
          - "MongoDB (NoSQL)"
          - "Redis (cache)"
        
        supported_orms:
          - "Entity Framework (.NET)"
          - "SQLAlchemy (Python)"
          - "Sequelize (Node.js)"
          - "TypeORM (TypeScript)"
          - "Hibernate (Java)"
          - "Django ORM (Python)"
        
        extracted_data:
          - "Database type and version"
          - "Connection string components (server, database, auth)"
          - "ORM models and relationships"
          - "Migration history"
          - "Schema inference from models"
          - "Table-to-code mapping"
        
        methods:
          - "discover(repo_path: Path) -> DatabaseTopology"
          - "parse_connection_string(conn_str: str) -> ConnectionInfo"
          - "detect_orm_type(repo_path: Path) -> Optional[ORMType]"
          - "scan_orm_models(repo_path: Path, orm: ORMType) -> List[ModelInfo]"
          - "analyze_migrations(repo_path: Path) -> MigrationHistory"
          - "infer_schema_from_models(models: List[ModelInfo]) -> SchemaInfo"
      
      test_coverage:
        - "Parse SQL Server connection strings"
        - "Parse PostgreSQL connection strings"
        - "Detect Entity Framework models"
        - "Detect SQLAlchemy models"
        - "Scan Flyway migrations"
        - "Scan Alembic migrations"
        - "Infer schema from ORM models"
        - "Handle multiple databases in same repo"
      
      acceptance_criteria:
        - "✅ 15/15 tests passing"
        - "✅ Supports 6 database types"
        - "✅ Detects 6 ORM frameworks"
        - "✅ Parses connection strings correctly"
        - "✅ Infers schema from models"
        - "✅ Tracks migration history"
    
    - id: "DISC-004"
      name: "API Topology Discovery"
      priority: "P0"
      estimated_hours: "2 hours"
      files:
        - path: "cortex/brain/discovery/api_discovery.py"
          purpose: "Map REST/GraphQL APIs and endpoints"
        - path: "tests/unit/brain/discovery/test_api_discovery.py"
          purpose: "API discovery tests (15 tests)"
      
      implementation:
        class_name: "APIDiscovery"
        implements: "DiscoveryPlugin"
        detection_strategies:
          - "Swagger/OpenAPI spec parsing (swagger.json, openapi.yaml)"
          - "Route decorator scanning (Flask, Express, ASP.NET, FastAPI)"
          - "GraphQL schema detection (.graphql, schema.js)"
          - "gRPC proto file analysis (.proto)"
          - "API controller class scanning"
        
        supported_frameworks:
          rest:
            - "ASP.NET Core Web API"
            - "Flask (Python)"
            - "FastAPI (Python)"
            - "Express.js (Node.js)"
            - "Spring Boot (Java)"
          graphql:
            - "Apollo Server"
            - "GraphQL.NET"
            - "Graphene (Python)"
          grpc:
            - "gRPC (proto files)"
        
        extracted_data:
          - "Endpoint paths (GET /api/users, POST /api/orders)"
          - "HTTP methods (GET, POST, PUT, DELETE, PATCH)"
          - "Request/response models"
          - "Authentication requirements"
          - "Rate limiting rules"
          - "API versioning scheme"
          - "CORS configuration"
        
        methods:
          - "discover(repo_path: Path) -> APITopology"
          - "parse_openapi_spec(file_path: Path) -> OpenAPIInfo"
          - "scan_route_decorators(repo_path: Path) -> List[EndpointInfo]"
          - "parse_graphql_schema(file_path: Path) -> GraphQLInfo"
          - "parse_proto_files(repo_path: Path) -> List[GRPCService]"
          - "extract_auth_requirements(endpoint: EndpointInfo) -> AuthInfo"
      
      test_coverage:
        - "Parse Swagger 2.0 spec"
        - "Parse OpenAPI 3.0 spec"
        - "Scan Flask route decorators"
        - "Scan FastAPI route decorators"
        - "Scan ASP.NET controller attributes"
        - "Parse GraphQL schema"
        - "Parse gRPC proto files"
        - "Extract authentication requirements"
      
      acceptance_criteria:
        - "✅ 15/15 tests passing"
        - "✅ Parses OpenAPI/Swagger specs"
        - "✅ Scans route decorators from 5 frameworks"
        - "✅ Supports REST + GraphQL + gRPC"
        - "✅ Extracts auth requirements"
        - "✅ Maps request/response models"

  # Acceptance criteria for Phase 9.1
  acceptance_criteria:
    tests:
      total: 65
      passing_required: 65
      coverage_min: "90%"
    
    files_created:
      - "cortex/orchestrators/support/discovery_orchestrator.py"
      - "cortex/brain/discovery/__init__.py"
      - "cortex/brain/discovery/config_discovery.py"
      - "cortex/brain/discovery/database_discovery.py"
      - "cortex/brain/discovery/api_discovery.py"
      - "tests/unit/orchestrators/support/test_discovery_orchestrator.py"
      - "tests/unit/brain/discovery/test_config_discovery.py"
      - "tests/unit/brain/discovery/test_database_discovery.py"
      - "tests/unit/brain/discovery/test_api_discovery.py"
    
    governance:
      - "✅ CORE-008: All tests written before implementation"
      - "✅ CORE-011: Type hints on all functions"
      - "✅ CORE-012: Google-style docstrings"
      - "✅ CORE-026: Git checkpoint before starting phase"
      - "✅ CORE-027: AC_START/COMPLETE logging"
      - "✅ CORE-038: Files in correct locations"
    
    wiring:
      - "✅ DiscoveryOrchestrator registered in DatabaseBackedRegistry"
      - "✅ Health check endpoint responds"
      - "✅ MCP tool 'discover_topology' available"

# ============================================================================
# PHASE 9.2: MICROSERVICES & TESTING DISCOVERY
# ============================================================================
phase_9_2:
  name: "Microservices Topology + Testing Framework Discovery"
  duration: "6-8 hours"
  priority: "P1-HIGH"
  status: "PLANNED"
  
  description: |
    Extend discovery capabilities to microservices architectures and
    testing infrastructure. Enables team collaboration insights.
  
  objectives:
    - Implement MicroservicesDiscovery (service mesh, API gateways, message brokers)
    - Implement TestingDiscovery (frameworks, coverage, fixtures)
    - Implement SecurityDiscovery (auth, logging, monitoring)
    - Add file-based caching layer
    - Create topology export formats (JSON, YAML, diagrams)
  
  # Task breakdown
  tasks:
    - id: "DISC-005"
      name: "Microservices Topology Discovery"
      priority: "P1"
      estimated_hours: "3 hours"
      files:
        - path: "cortex/brain/discovery/microservices_discovery.py"
          purpose: "Analyze microservices architecture"
        - path: "tests/unit/brain/discovery/test_microservices_discovery.py"
          purpose: "Microservices discovery tests (20 tests)"
      
      implementation:
        class_name: "MicroservicesDiscovery"
        implements: "DiscoveryPlugin"
        detection_strategies:
          - "Service mesh configs (Istio, Linkerd, Consul Connect)"
          - "API gateway routes (Kong, NGINX, Traefik, Ambassador)"
          - "Service discovery (Consul, Eureka, etcd)"
          - "Message brokers (RabbitMQ, Kafka, NATS configs)"
          - "Container orchestration (K8s services, Docker Swarm)"
        
        extracted_data:
          - "Service names and versions"
          - "Inter-service communication patterns"
          - "Message queue topics/exchanges"
          - "Service mesh policies (traffic splitting, retries)"
          - "Load balancing strategies"
          - "Circuit breaker configurations"
