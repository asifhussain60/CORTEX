# ============================================================================
# REMOVED LIBRARIES (No Longer Used)
# ============================================================================

removed_libraries:
  rationale: "Consolidated functionality into core stack"
  
  d3js:
    status: "REMOVED"
    reason: "ECharts handles all chart types"
    security_benefit: "Reduced attack surface (~500KB fewer dependencies)"
  
  fusejs:
    status: "REMOVED"
    reason: "SQLite FTS5 provides full-text search"
    security_benefit: "One less client-side library to audit"
  
  gridjs:
    status: "REMOVED"
    reason: "Native HTML tables + CSS + SQL"
    security_benefit: "Eliminated third-party table rendering"
  
  elkjs:
    status: "REMOVED"
    reason: "Cytoscape has built-in layouts"
    security_benefit: "Fewer graph layout dependencies"

---
# ============================================================================
# DEPLOYMENT RECOMMENDATIONS
# ============================================================================

deployment_checklist:
  integrity_checks:
    - action: "Enable Subresource Integrity (SRI) for all vendor libraries"
      example: |
        <script src="vendor/echarts.min.js" 
                integrity="sha384-..." 
                crossorigin="anonymous"></script>
      priority: "HIGH"
  
  content_security_policy:
    - directive: "script-src 'self'"
      notes: "Allow only same-origin scripts (no CDN needed)"
    - directive: "style-src 'self' 'unsafe-inline'"
      notes: "Inline styles for dynamic charts"
    - directive: "default-src 'none'"
      notes: "Deny all by default"
  
  regular_audits:
    frequency: "Monthly"
    automated: "npm audit in CI/CD pipeline"
    manual: "Quarterly deep review with NIST NVD + GitHub Advisories"
  
  update_policy:
    security_patches: "Apply within 7 days"
    major_versions: "Test in staging before production"
    deprecation_watch: "Monitor library maintenance status"

