# RISK MITIGATION

risks:
  - risk: "LLM content generation fails"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation: "Fallback to template-based content + manual review queue"
  
  - risk: "Missing phase data in git history"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation: "Document gaps, use best-effort reconstruction"
  
  - risk: "Diagram generation produces invalid Mermaid"
    likelihood: "LOW"
    impact: "MEDIUM"
    mitigation: "Syntax validation before rendering + error placeholders"
  
  - risk: "Performance degrades with 100+ phases"
    likelihood: "LOW"
    impact: "MEDIUM"
    mitigation: "Pagination, lazy loading, static generation"

