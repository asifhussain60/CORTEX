---
# EXECUTIVE SUMMARY

vision:
  mission: |
    Transform the CORTEX Master Plan Observatory from a summary dashboard into a 
    comprehensive, navigatable Phase Story System where each phase card links to 
    beautifully styled detail pages with LLM-generated content, architecture diagrams, 
    and a consistent development narrative.
  
  key_outcomes:
    - "✅ Clickable phase cards with detail page navigation"
    - "✅ LLM-powered content generation using LENS + onboarding capabilities"
    - "✅ Beautiful glassmorphism detail page template"
    - "✅ Mermaid diagram integration (architecture, workflow, data flow)"
    - "✅ Consistent development story across all 19+ phases"
    - "✅ Automated gap detection and content quality assurance"
    - "✅ Full test coverage (unit + integration + E2E with Playwright)"
    - "✅ MCP-exposed tools for phase content management"

---
# CRITICAL GAPS IDENTIFIED

current_state_analysis:
  missing_phases:
    - phase: "1-6"
      impact: "SDLC foundation phases not in registry"
      files_exist: true
      location: "cortex-registry/_cortex-master/phases/completed/2026/"
      action: "Add to index.yaml and generate detail pages"
    
    - phase: "11-12, 14"
      impact: "Development story has holes"
      files_exist: false
      action: "Create phase YAML files from git history"
  
  no_detail_pages:
    count: 19
    current: "Summary cards only"
    needed: "Full detail pages with content"
  
  no_navigation:
    current: "Static div cards"
    needed: "Clickable links to phase-{id}/index.html"
  
  no_diagrams:
    current: "Zero visual representations"
    needed: "Architecture + workflow + data flow diagrams per phase"
  
  manual_content:
    current: "Hand-written descriptions"
    needed: "LLM-generated comprehensive content"
  
  inconsistent_story:
    current: "Phase descriptions don't connect"
    needed: "Narrative flow showing evolution"

---
# ARCHITECTURE

data_model:
  phase_detail_schema:
    location: "cortex/models/phase_detail_schema.py"
    fields:
      - "phase_id: str"
      - "title: str"
      - "status: Literal['ACTIVE', 'COMPLETED', 'PLANNED']"
      - "completion_date: Optional[str]"
      - "overview: str  # LLM-generated"
      - "objectives: List[str]"
      - "key_features: List[Feature]"
      - "architecture: ArchitectureSection  # With Mermaid diagrams"
      - "implementation_details: ImplementationSection"
      - "testing: TestingSection"
      - "compliance: List[ComplianceRule]"
      - "impact: ImpactMetrics"
      - "story_context: StoryContext  # Links to previous/next phases"
      - "technical_decisions: List[TechnicalDecision]"
      - "lessons_learned: List[Lesson]"

services:
  llm_content_generator:
    location: "cortex/visualization/llm_content_generator.py"
    purpose: "Generate comprehensive phase content using LENS + onboarding"
    methods:
      - "generate_overview(phase_yaml: dict) -> str"
      - "generate_technical_narrative(phase_yaml: dict) -> str"
      - "extract_decisions(phase_yaml: dict, git_history: GitHistory) -> List[Decision]"
      - "create_story_links(current_phase: int, all_phases: List[Phase]) -> StoryContext"
      - "generate_diagram_specs(phase_yaml: dict) -> List[DiagramSpec]"
  
  diagram_generator:
    location: "cortex/visualization/mermaid_diagram_generator.py"
    purpose: "Generate Mermaid diagrams from phase metadata"
    methods:
      - "generate_architecture_diagram(components: List[Component]) -> str"
      - "generate_workflow_diagram(steps: List[Step]) -> str"
      - "generate_data_flow_diagram(data_flow: DataFlow) -> str"
      - "generate_dependency_graph(dependencies: List[Dependency]) -> str"
  
  phase_detail_generator:
    location: "cortex/visualization/phase_detail_generator.py"
    purpose: "Orchestrate detail page generation"
    methods:
      - "generate_detail_page(phase_id: str) -> Result[Path]"
      - "generate_all_detail_pages() -> Result[List[Path]]"
      - "validate_content_quality(content: PhaseDetail) -> QualityReport"
      - "detect_story_gaps(phases: List[Phase]) -> List[Gap]"

navigation:
  master_dashboard_updates:
    file: "cortex-registry/_cortex-master/dashboard/index.html"
    changes:
      - "Convert phase cards from div to <a> links"
      - "Add href='phases/phase-{id}/index.html'"
      - "Add hover effects for clickable indication"
      - "Add breadcrumb navigation"
  
  detail_page_template:
    location: "cortex-registry/_cortex-master/dashboard/templates/phase-detail.html"
    features:
      - "Glassmorphism design matching master dashboard"
      - "Breadcrumb: Home > Phases > Phase {id}"
      - "Tab navigation: Overview | Architecture | Implementation | Testing | Impact"
      - "Embedded Mermaid diagrams"
      - "Code syntax highlighting"
      - "Responsive design (mobile-friendly)"
      - "Previous/Next phase navigation"

---
# IMPLEMENTATION PHASES

phase_1_template_system:
  duration: "2 days"
  deliverables:
    - file: "cortex-registry/_cortex-master/dashboard/templates/phase-detail.html"
      purpose: "Reusable glassmorphism template"
      tests: "tests/unit/visualization/test_phase_detail_template.py"
    
    - file: "cortex/models/phase_detail_schema.py"
      purpose: "Pydantic models for phase detail data"
      tests: "tests/unit/models/test_phase_detail_schema.py"
  
  test_cases:
    - "Template renders with sample data"
    - "All tabs navigate correctly"
    - "Mermaid diagrams embed properly"
    - "Breadcrumb navigation works"
    - "Mobile responsive layout verified"

phase_2_llm_content_generation:
  duration: "2 days"
  deliverables:
    - file: "cortex/visualization/llm_content_generator.py"
      purpose: "LLM-powered content generation service"
      tests: "tests/unit/visualization/test_llm_content_generator.py"
  
  integration_points:
    - "LENS analyzers for code intelligence"
    - "Git history for timeline context"
    - "Phase YAML for metadata"
    - "Enhancement history for decisions"
  
  test_cases:
    - "Generate overview from phase YAML"
    - "Extract technical decisions from git commits"
    - "Create narrative linking to previous phases"
    - "Handle missing data gracefully"
    - "Cache generated content"

phase_3_navigation_system:
  duration: "2 days"
  deliverables:
    - file: "cortex-registry/_cortex-master/dashboard/index.html"
      changes: "Convert cards to clickable links"
      tests: "tests/e2e/test_phase_navigation.py (Playwright)"
  
  features:
    - "Clickable phase cards"
    - "URL routing to phase-{id}/index.html"
    - "Breadcrumb navigation"
    - "Previous/Next phase links"
    - "Back to dashboard link"
  
  test_cases:
    - "Click phase card navigates to detail page"
    - "Breadcrumb home link returns to dashboard"
    - "Previous/Next buttons work correctly"
    - "Deep linking works (direct URL access)"
    - "404 handling for missing phases"

phase_4_diagram_generation:
  duration: "2 days"
  deliverables:
    - file: "cortex/visualization/mermaid_diagram_generator.py"
      purpose: "Generate Mermaid diagrams from phase metadata"
      tests: "tests/unit/visualization/test_mermaid_diagram_generator.py"
  
  diagram_types:
    - type: "Architecture"
      example: "Component diagram showing orchestrators, dependencies"
    
    - type: "Workflow"
      example: "Sequence diagram showing TDD cycle, event flow"
    
    - type: "Data Flow"
      example: "Flow diagram showing data transformations"
    
    - type: "Dependency Graph"
      example: "Graph showing phase dependencies"
  
  test_cases:
    - "Generate valid Mermaid syntax"
    - "Handle complex component relationships"
    - "Render diagrams in detail pages"
    - "Export diagrams as SVG"
    - "Responsive diagram sizing"

phase_5_story_consistency:
  duration: "2 days"
  deliverables:
    - file: "cortex/visualization/story_consistency_engine.py"
      purpose: "Ensure narrative flow across phases"
      tests: "tests/unit/visualization/test_story_consistency_engine.py"
  
  features:
    - "Detect story gaps (missing phases)"
    - "Generate transition narratives"
    - "Link technical decisions across phases"
    - "Create development timeline"
    - "Identify inconsistencies"
  
  test_cases:
    - "Detect missing phases 11-12, 14"
    - "Generate smooth transitions"
    - "Link related enhancements to phases"
    - "Timeline visualization accuracy"
    - "Consistency score calculation"

phase_6_master_dashboard_integration:
  duration: "2 days"
  deliverables:
    - file: "cortex-registry/_cortex-master/dashboard/index.html"
      changes: "Full navigation wiring"
    
    - file: "cortex/visualization/phase_detail_generator.py"
      purpose: "Orchestrate detail page generation"
      tests: "tests/integration/test_phase_detail_generator.py"
  
  features:
    - "Generate all detail pages"
    - "Update master dashboard with links"
    - "Create phase directory structure"
    - "Copy assets (CSS, JS)"
    - "Validate all links"
  
  test_cases:
    - "Generate all 19+ phase detail pages"
    - "All links resolve correctly"
    - "Assets copied to phase directories"
    - "No broken images/styles"
    - "Index.yaml synced with generated pages"

phase_7_lens_quality_assurance:
  duration: "1 day"
  deliverables:
    - file: "cortex/visualization/content_quality_validator.py"
      purpose: "Validate generated content quality"
      tests: "tests/unit/visualization/test_content_quality_validator.py"
  
  validation_checks:
    - "Grammar and spelling (via language tool)"
    - "Technical accuracy (cross-check with code)"
    - "Completeness (all required sections present)"
    - "Diagram validity (Mermaid syntax check)"
    - "Link integrity (all hrefs resolve)"
    - "Consistency score (narrative flow)"
  
  test_cases:
    - "Detect grammar errors"
    - "Flag technical inaccuracies"
    - "Identify missing sections"
    - "Validate diagram syntax"
    - "Check all links"

phase_8_e2e_testing_polish:
  duration: "1 day"
  deliverables:
    - file: "tests/e2e/test_phase_story_system.py"
      purpose: "End-to-end Playwright tests"
    
    - file: "cortex-registry/_cortex-master/dashboard/README.md"
      purpose: "Usage documentation"
  
  e2e_scenarios:
    - "User navigates from dashboard to phase detail"
    - "User explores all tabs in detail page"
    - "User clicks Previous/Next navigation"
    - "User views architecture diagrams"
    - "User returns to dashboard via breadcrumb"
    - "Mobile user has full functionality"
  
  test_cases:
    - "Full user journey test"
    - "Cross-browser compatibility (Chrome, Firefox, Safari)"
    - "Mobile responsive verification"
    - "Performance benchmarks (<2s load time)"
    - "Accessibility audit (WCAG 2.1 AA)"

---
# MCP TOOLS

new_tools:
  - name: "cortex_generate_phase_detail"
    description: "Generate detail page for a specific phase"
    parameters:
      - "phase_id: str"
      - "force_regenerate: bool = False"
    returns: "Result[Path]"
  
  - name: "cortex_generate_all_phase_details"
    description: "Generate detail pages for all phases"
    parameters:
      - "include_active: bool = True"
      - "include_completed: bool = True"
    returns: "Result[List[Path]]"
  
  - name: "cortex_validate_phase_content"
    description: "Validate quality of phase content"
    parameters:
      - "phase_id: str"
    returns: "QualityReport"
  
  - name: "cortex_detect_story_gaps"
    description: "Detect gaps in development story"
    parameters: []
    returns: "List[Gap]"

