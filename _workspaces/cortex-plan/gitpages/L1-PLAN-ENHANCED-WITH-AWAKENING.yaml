  css_additions: |
    /* Awakening Hero Section */
    .awakening-hero-section {
      margin: 4rem 0;
    }
    
    .awakening-hero-panel {
      padding: 4rem;
      background: linear-gradient(135deg, 
        rgba(123, 97, 255, 0.15) 0%, 
        rgba(0, 212, 255, 0.15) 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }
    
    /* Animated background pattern */
    .awakening-hero-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(123, 97, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      animation: pulse-bg 10s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes pulse-bg {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .awakening-content-wrapper {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 3rem;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    
    /* Image Container */
    .awakening-image-container {
      position: relative;
    }
    
    .awakening-image-large {
      width: 400px;
      height: 400px;
      border-radius: 12px;
      filter: drop-shadow(0 0 40px rgba(123, 97, 255, 0.6));
      transition: all 0.3s ease;
    }
    
    .awakening-image-large:hover {
      filter: drop-shadow(0 0 60px rgba(123, 97, 255, 0.9));
      transform: scale(1.02);
    }
    
    /* Text Content */
    .awakening-text-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .awakening-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(123, 97, 255, 0.2);
      border: 1px solid rgba(123, 97, 255, 0.4);
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #7b61ff;
      width: fit-content;
    }
    
    .awakening-title {
      font-size: 2.5rem;
      margin: 0;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.2;
    }
    
    .awakening-description {
      font-size: 1.25rem;
      line-height: 1.6;
      margin: 0;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    /* Character Chips */
    .awakening-characters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 0.5rem 0;
    }
    
    .character-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .character-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }
    
    .character-emoji {
      font-size: 1.5rem;
    }
    
    .character-name {
      font-weight: 600;
      color: #ffffff;
      font-size: 0.9375rem;
    }
    
    .character-trait {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-style: italic;
    }
    
    .awakening-hook {
      font-size: 1rem;
      line-height: 1.7;
      margin: 0.5rem 0 1.5rem 0;
      color: var(--text-muted);
    }
    
    /* CTA Group */
    .awakening-cta-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    
    .btn-awakening-primary {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
      padding: 1.5rem 2.5rem;
      background: linear-gradient(135deg, #7b61ff 0%, #00d4ff 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(123, 97, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .btn-awakening-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .btn-awakening-primary:hover::before {
      opacity: 1;
    }
    
    .btn-awakening-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(123, 97, 255, 0.5);
    }
    
    .btn-main-text {
      font-size: 1.125rem;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    
    .btn-caption {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 400;
      position: relative;
      z-index: 1;
    }
    
    .btn-awakening-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .btn-awakening-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }
    
    .btn-icon {
      font-size: 1.25rem;
    }
    
    .btn-text {
      font-weight: 600;
      font-size: 1rem;
    }
    
    .awakening-disclaimer {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-style: italic;
      margin: 1rem 0 0 0;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .awakening-content-wrapper {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      
      .awakening-image-large {
        width: 100%;
        height: auto;
        max-width: 400px;
        margin: 0 auto;
        display: block;
      }
      
      .awakening-title {
        font-size: 2rem;
      }
      
      .awakening-cta-group {
        flex-direction: column;
        width: 100%;
      }
      
      .btn-awakening-primary,
      .btn-awakening-secondary {
        width: 100%;
        justify-content: center;
        text-align: center;
      }
    }
  
  analytics_tracking:
    events:
      - event_name: "awakening_panel_view"
        trigger: "Intersection Observer (panel enters viewport)"
        data: "timestamp, session_id, referrer"
      
      - event_name: "awakening_cta_click"
