            <img src="assets/images/Awakening-400.png" 
                 alt="The Awakening of CORTEX: One basement. Three misfits. 47 disasters." 
                 class="awakening-image-large">
          </div>
          
          <!-- Right: Story Content -->
          <div class="awakening-text-content">
            
            <!-- Label -->
            <span class="awakening-label">
              <span class="emoji-icon">📖</span> ORIGIN STORY
            </span>
            
            <!-- Title -->
            <h2 class="awakening-title">The Awakening of CORTEX</h2>
            
            <!-- Story Hook -->
            <p class="awakening-description">
              One basement. Three misfits. 47 interconnected disasters. 
              23 days to build the impossible.
            </p>
            
            <!-- Character Intro -->
            <div class="awakening-characters">
              <div class="character-chip">
                <span class="character-emoji">👨‍💻</span>
                <span class="character-name">Asif Codenstein</span>
                <span class="character-trait">ADHD genius</span>
              </div>
              <div class="character-chip">
                <span class="character-emoji">👩‍💼</span>
                <span class="character-name">Miss G</span>
                <span class="character-trait">Imaginary girlfriend → governance</span>
              </div>
              <div class="character-chip">
                <span class="character-emoji">🤖</span>
                <span class="character-name">Copilot Bot</span>
                <span class="character-trait">No brain, max confidence</span>
              </div>
            </div>
            
            <!-- Hook Paragraph -->
            <p class="awakening-hook">
              Follow the hilarious, chaotic, technically accurate journey of how CORTEX 
              was born from the ashes of BadMonolith—a 47-department code nightmare 
