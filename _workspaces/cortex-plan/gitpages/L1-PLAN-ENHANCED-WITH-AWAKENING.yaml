    design: "Immersive hero panel with 400px image + character intro + story hook + dual CTAs"
    visual_impact: "HIGH - gradient background, glowing image, prominent typography"
  
  new_html_structure: |
    <!-- Section 4: The Awakening Story (ENHANCED) -->
    <div class="level0-container awakening-hero-section" id="awakening">
      <div class="glass-bg awakening-hero-panel">
        <div class="awakening-content-wrapper">
          
          <!-- Left: Hero Image (400x400) -->
