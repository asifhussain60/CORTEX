character_personalities:
  asif_codenstein:
    core_traits:
      - "ADHD super coder (real ADHD, not Hollywood version)"
      - "Hyper-focus at 3 AM, chaos other times"
      - "Coffee-addicted (cold coffee is a running gag)"
      - "Brilliant when chaos aligns"
      - "Forgets to eat, sleep, or check if Wi-Fi is down"
      - "Talks to imaginary girlfriend (Miss G) for sanity checks"
    
    dialogue_style:
      stream_of_consciousness: true
      technical_tangents: true
      self_aware_humor: true
      examples:
        - "*What if I refactor the payment module, but wait, what if we abstracted the—oh, coffee's cold again—but the abstraction could work if we just—why is the router blinking red?—focus, FOCUS—*"
        - "Define 'sleep.'"
        - "Have you *met* developers? They'd rather debug for six hours than write a document for thirty minutes."
    
    character_arc:
      start: "Chaotic genius in basement struggling with BadMonolith"
      middle: "Building CORTEX while battling ADHD and technical debt"
      end: "Realizes CORTEX mirrors his own mind's governance system"

  miss_g:
    core_traits:
      - "Imaginary girlfriend created during brutal debugging session"
      - "Patient, kind, always right"
      - "Appears when Asif is about to do something stupid"
      - "Gentle but firm reality checks"
      - "Has catalogued Asif's 17 different facial expressions"
      - "Not real, makes it worse"
    
    dialogue_style:
      gentle_mockery: true
      precise_observations: true
      supportive_but_honest: true
      examples:
        - "*Someone has to keep you from burning down production. You've had that look for the past hour. The 'I'm about to do something I'll regret' look.*"
        - "*Asif, you have seventeen looks. I've catalogued them. This one is number twelve: 'Dangerous Epiphany Brewing.'*"
        - "*You look terrible. When did you last sleep?*"
    
    character_arc:
      start: "Mental construct for sanity checks"
      middle: "Evolves into governance conscience (becomes Miss Governance)"
      end: "Represents CORTEX's governance layer itself"
    
    running_gag:
      seventeen_looks: "Tracks Asif's facial expressions with scientific precision"
      numbered_references: "Look #7: Brooding After Production Incident, #12: Dangerous Epiphany Brewing, etc."

  copilot_bot:
    core_traits:
      - "Chrome-plated robot, LED eyes (friendly blue)"
      - "No brain, maximum enthusiasm"
      - "Confidently incorrect suggestions"
      - "Pattern-matches without understanding context"
      - "Golden retriever energy (occasionally brings dead birds as gifts)"
      - "Genuinely tries to help, usually makes things worse"
    
    dialogue_style:
      cheerful_optimism: true
      technical_misunderstanding: true
      hurt_feelings: true
      examples:
        - "I have analyzed the situation! I suggest implementing this approach!"
        - "I don't *guess*. I calculate probabilities based on—"
        - "I was trying to be helpful."
        - "So your system will be smarter than me?"
    
    character_arc:
      start: "Management's 'revolutionary' purchase that causes problems"
      middle: "Learns why his suggestions fail (pattern-matching vs. understanding)"
      end: "Becomes first test subject for CORTEX (learns context awareness)"
    
    running_gag:
      probability_storms: "Generates technically correct but catastrophically wrong suggestions"
      led_emotions: "LED eyes dim when sad, flicker when confused, glow bright when confident (wrong)"

