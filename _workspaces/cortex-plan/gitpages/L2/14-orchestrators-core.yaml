# ============================================================================
# MERMAID DIAGRAMS
# ============================================================================

mermaid_diagrams:
  core_orchestrator_mindmap:
    type: "mindmap"
    title: "Core Orchestrators Architecture"
    code: |
      mindmap
        root((Core<br/>Orchestrators<br/>7 Total))
          Stage 1: Comprehension
            InteractionOrchestrator
              LENS Protocol
              Challenge Generation
              Pattern Enforcement
              Dependencies: None
          Stage 2: Intent
            IntentRouter
              Intent Classification
              Confidence Scoring
              Domain Routing
              Dependencies: InteractionOrchestrator
          Stage 2.5: Synthesis
            LENSSynthesis
              DoR Generation
              Approval Gate
              Synthesis
              Dependencies: IntentRouter
          Stage 2.7: Governance
            EnforcementOrchestrator
              Tier0 Blocking
              Tier1 Escalation
              Parallel Validation
              Dependencies: LENSSynthesis
          Stage 3: Execution
            TDDOrchestrator
              Test Generation
              TDD Workflow
              Test Execution
              Dependencies: Interaction + Intent
            WorkflowOrchestrator
              Step Orchestration
              Checkpoint Management
              Dependencies: TDDOrchestrator
          Stage 4: Coordination
            MasterOrchestrator
              Orchestrator Routing
              Stage Management
              Coordination
              Dependencies: Interaction + Intent + LENS + TDD

  wiring_sequence:
    type: "sequenceDiagram"
    title: "Core Orchestrator Wiring Lifecycle"
    code: |
      sequenceDiagram
        participant Bootstrap as WiringBootstrap
        participant Registry as OrchestratorRegistry
        participant Factory as Factory
        participant Health as HealthCheck
        
        Bootstrap->>Registry: Load wiring.yaml
        Registry->>Registry: Parse orchestrators.core (7 entries)
        
        loop For each core orchestrator (priority order)
          Registry->>Factory: Create orchestrator instance
          Factory->>Factory: Resolve dependencies
          
          alt Dependencies missing
            Factory-->>Registry: ❌ Dependency error
            Registry->>Registry: Mark as failed
          else Dependencies available
            Factory->>Factory: Inject dependencies
            Factory-->>Registry: ✅ Instance created
            
            Registry->>Health: Run health check
            Health->>Health: Call health_check method
            
            alt Health check passes
              Health-->>Registry: ✅ Healthy
              Registry->>Registry: Mark as available
            else Health check fails
              Health-->>Registry: ❌ Unhealthy
              Registry->>Registry: Use fallback route
            end
          end
        end
        
        Registry-->>Bootstrap: All core orchestrators wired
        Bootstrap->>Bootstrap: Proceed to domain orchestrators

  processing_flow:
    type: "flowchart"
    title: "Core Processing Flow"
    code: |
      flowchart TD
        A[User Request] --> B[InteractionOrchestrator]
        B --> C{LENS Analysis<br/>Complete?}
        
        C -->|Yes| D[IntentRouter]
        C -->|No| E[Challenge User]
        E --> B
        
        D --> F{Intent<br/>Classified?}
        F -->|Yes| G[LENSSynthesis]
        F -->|No| H[Fuzzy Matching]
        H --> D
        
        G --> I[Generate DoR]
        I --> J{User<br/>Approval?}
        
        J -->|No| K[Modify Request]
        K --> B
        J -->|Yes| L[EnforcementOrchestrator]
        
        L --> M{Governance<br/>Pass?}
        M -->|No| N[❌ Block + Report]
        M -->|Yes| O{Intent<br/>Type?}
        
        O -->|TEST/IMPLEMENT| P[TDDOrchestrator]
        O -->|WORKFLOW| Q[WorkflowOrchestrator]
        O -->|COMPLEX| R[MasterOrchestrator]
        
        P --> Q
        Q --> R
        R --> S[Execute via Domain Orchestrators]
        
        style B fill:#3b82f6,color:#fff
        style D fill:#3b82f6,color:#fff
        style G fill:#3b82f6,color:#fff
        style L fill:#ef4444,color:#fff
        style P fill:#10b981,color:#fff
        style R fill:#8b5cf6,color:#fff
        style N fill:#ef4444,color:#fff
        style S fill:#10b981,color:#fff

---
# ============================================================================
# CONTENT SECTIONS
# ============================================================================

sections:
  stage1_comprehension:
    title: "Stage 1: Comprehension (InteractionOrchestrator)"
    icon: "🔍"
    content_blocks:
      - type: "orchestrator_detail"
        name: "InteractionOrchestrator"
        priority: 10
        tier: 1
        dependencies: []
        module: "cortex.orchestrators.core.interaction_orchestrator"
        
        description: |
          First point of contact. Implements LENS Protocol (Language → 
          Examination → Navigation → Synthesis) to comprehend user intent.
        
        capabilities:
          - name: "LENS Protocol"
            description: "4-phase comprehension framework"
          - name: "Challenge Generation"
            description: "Counter-proposals when requirements unclear"
          - name: "Pattern Enforcement"
            description: "Enforce conversation patterns"
          - name: "Turn Management"
            description: "Multi-turn conversation orchestration"
        
        mcp_tools:
          - "cortex_process_request"
          - "cortex_challenge"
          - "cortex_lens_analyze"
        
        health_check:
          method: "execute_turn"
          description: "Verifies conversation protocol can execute a turn"
        
        key_dependencies:
          - type: "ConversationProtocol"
            description: "Manages multi-turn conversations with memoization"
            config:
              max_turns: 10
              token_limit: 20000
              adaptive_turn_limit: true

  stage2_intent:
    title: "Stage 2: Intent Classification (IntentRouter)"
    icon: "🎯"
    content_blocks:
      - type: "orchestrator_detail"
        name: "IntentRouter"
        priority: 20
        tier: 1
        dependencies: ["InteractionOrchestrator"]
        module: "cortex.orchestrators.core.intent_router"
        
        description: |
          Classifies user intent into categories: IMPLEMENT, FIX, REFACTOR, 
          ANALYZE, TEST, DOCUMENT, EXPLAIN. Routes to appropriate domain 
          orchestrator.
        
        capabilities:
          - name: "Intent Classification"
            description: "ML-powered intent detection"
          - name: "Confidence Scoring"
            description: "0.0-1.0 confidence scores per intent"
          - name: "Domain Routing"
            description: "Routes to RefactoringOrchestrator, PlanningOrchestrator, etc."
          - name: "Fuzzy Matching"
            description: "Handles ambiguous intents"
        
        mcp_tools:
          - "cortex_process_request (intent classification mode)"
        
        health_check:
          method: "classify_intent"
          description: "Verifies intent classification pipeline"
        
        routing_table:
          - intent: "IMPLEMENT"
            target: "TDDOrchestrator"
            confidence_threshold: 0.7
          - intent: "FIX"
            target: "TDDOrchestrator + RefactoringOrchestrator"
            confidence_threshold: 0.7
          - intent: "REFACTOR"
            target: "RefactoringOrchestrator"
            confidence_threshold: 0.8
          - intent: "ANALYZE"
            target: "MasterOrchestrator"
            confidence_threshold: 0.6
          - intent: "TEST"
            target: "TDDOrchestrator"
            confidence_threshold: 0.9

  stage2_5_synthesis:
    title: "Stage 2.5: LENS Synthesis (LENSSynthesis)"
    icon: "🔬"
    content_blocks:
      - type: "orchestrator_detail"
        name: "LENSSynthesis"
        priority: 25
        tier: 1
        dependencies: ["IntentRouter"]
        module: "cortex.orchestrators.core.lens_synthesis"
        
        description: |
          Synthesizes LENS analysis into actionable Definition of Ready (DoR). 
          Acts as approval gate before execution.
        
        capabilities:
          - name: "DoR Generation"
            description: "Creates structured Definition of Ready document"
          - name: "Approval Gate"
            description: "Waits for user 'proceed' / 'yes' / 'approve'"
          - name: "Synthesis"
            description: "Combines Language + Examination + Navigation insights"
        
        mcp_tools:
          - "cortex_lens_analyze"
        
        health_check:
          method: "synthesize"
          description: "Verifies DoR generation pipeline"
        
        dor_structure:
          - section: "Intent Classification"
            content: "Primary/secondary intents with confidence"
          - section: "Requirements"
            content: "Extracted from LENS examination"
          - section: "Constraints"
            content: "CORE rules, standards, dependencies"
          - section: "Navigation Plan"
            content: "File paths, orchestrators to invoke"
          - section: "Approval Status"
            content: "Awaiting user confirmation"

  stage2_7_enforcement:
    title: "Stage 2.7: Governance (EnforcementOrchestrator)"
    icon: "🛡️"
    content_blocks:
      - type: "orchestrator_detail"
        name: "EnforcementOrchestrator"
        priority: 27
        tier: 1
        dependencies: ["LENSSynthesis"]
        module: "cortex.orchestrators.core.enforcement_orchestrator"
        phase: "8.1"
        
        description: |
          Enforces Tier 0 immutable rules and Tier 1 governance. Blocks 
          operations violating CORE rules before execution.
        
        capabilities:
          - name: "Tier0 Blocking"
            description: "Hard stops for CORE-002, 029, 030, 035, 036 violations"
          - name: "Tier1 Escalation"
            description: "Warnings for best practice violations"
          - name: "Parallel Validation"
            description: "Runs multiple validators concurrently"
        
        mcp_tools:
          - "cortex_process_request (enforcement mode)"
        
        health_check:
          method: "validate_operation"
          description: "Verifies governance validation pipeline"
        
        enforcement_layers:
          - layer: "Pre-Execution Gate"
            action: "BLOCKS violations before code generation"
            rules: "CORE-002, 008, 011, 012, 013, 029, 030, 035, 036"
          - layer: "Runtime Monitor"
            action: "STOPS at 3+ violations"
            rules: "All Tier 1 + Tier 2 rules"
          - layer: "Post-Execution Audit"
            action: "DETECTS bypasses"
            rules: "Audit log integrity checks"

  stage3_tdd:
    title: "Stage 3: TDD Execution (TDDOrchestrator)"
    icon: "✅"
    content_blocks:
      - type: "orchestrator_detail"
        name: "TDDOrchestrator"
        priority: 30
        tier: 1
        dependencies: ["InteractionOrchestrator", "IntentRouter"]
        module: "cortex.orchestrators.core.tdd_orchestrator"
        
        description: |
          Implements Test-Driven Development. Generates tests BEFORE code 
          (CORE-008). Enforces Red → Green → Refactor cycle.
        
        capabilities:
          - name: "Test Generation"
            description: "Generates pytest tests from requirements"
          - name: "TDD Workflow"
            description: "Enforces Red → Green → Refactor"
          - name: "Test Execution"
            description: "Runs tests via pytest runner"
        
        mcp_tools:
          - "cortex_process_request (TDD mode)"
        
        health_check:
          method: "generate_tests"
          description: "Verifies test generation pipeline"
        
        workflow_steps:
          - step: "RED"
            description: "Generate failing test for new feature"
            verification: "pytest fails with expected error"
          - step: "GREEN"
            description: "Write minimal code to pass test"
            verification: "pytest passes"
          - step: "REFACTOR"
            description: "Improve code quality while maintaining tests"
            verification: "pytest still passes + coverage maintained"

  stage3_5_workflow:
    title: "Stage 3.5: Workflow Orchestration (WorkflowOrchestrator)"
    icon: "⚙️"
    content_blocks:
      - type: "orchestrator_detail"
        name: "WorkflowOrchestrator"
        priority: 35
        tier: 1
        dependencies: ["TDDOrchestrator"]
        module: "cortex.orchestrators.core.workflow_orchestrator"
        
        description: |
          Manages multi-step workflows. Coordinates checkpoint creation, 
          rollback, and step sequencing.
        
        capabilities:
          - name: "Workflow Management"
            description: "Define and execute multi-step workflows"
          - name: "Step Orchestration"
            description: "Execute steps in sequence with error handling"
          - name: "Checkpoint Management"
            description: "Create git checkpoints between steps"
        
        mcp_tools:
          - "cortex_process_request (workflow mode)"
        
        health_check:
          method: "execute_workflow"
          description: "Verifies workflow execution pipeline"

  stage4_master:
    title: "Stage 4: Master Coordination (MasterOrchestrator)"
    icon: "🎼"
    content_blocks:
      - type: "orchestrator_detail"
        name: "MasterOrchestrator"
        priority: 100
        tier: 1
        dependencies: ["InteractionOrchestrator", "IntentRouter", "LENSSynthesis", "TDDOrchestrator"]
        module: "cortex.orchestrators.core.master_orchestrator"
        
        description: |
          Top-level coordinator. Routes complex operations to domain 
          orchestrators. Manages stage transitions.
        
        capabilities:
          - name: "Coordination"
            description: "Coordinates multiple orchestrators for complex operations"
          - name: "Stage Management"
            description: "Manages transitions between stages"
          - name: "Orchestrator Routing"
            description: "Routes to RefactoringOrchestrator, PlanningOrchestrator, etc."
        
        mcp_tools:
          - "cortex_process_request (master mode)"
        
        health_check:
          method: "coordinate_operation"
          description: "Verifies orchestrator coordination"
        
        routing_logic:
          - condition: "intent=REFACTOR + confidence>0.8"
            action: "Route to RefactoringOrchestrator"
          - condition: "intent=IMPLEMENT + complexity=high"
            action: "Route to PlanningOrchestrator → TDDOrchestrator"
          - condition: "intent=ANALYZE + scope=codebase"
            action: "Route to LENSOrchestrator + DuplicationDetector"

  wiring_configuration:
    title: "Wiring Configuration"
    icon: "🔌"
    content_blocks:
      - type: "yaml_reference"
        title: "Core Orchestrators in wiring.yaml"
        file: "cortex/wiring/specifications/wiring.yaml"
        excerpt: |
          orchestrators:
            core:
              # STAGE 1: Comprehension (LENS Protocol)
              - name: "InteractionOrchestrator"
                module: "cortex.orchestrators.core.interaction_orchestrator"
                class: "InteractionOrchestrator"
                tier: 1
                priority: 10
                dependencies: []
                
              # STAGE 2: Intent Classification
              - name: "IntentRouter"
                module: "cortex.orchestrators.core.intent_router"
                class: "IntentRouter"
                tier: 1
                priority: 20
                dependencies: ["InteractionOrchestrator"]
                
              # STAGE 2.5: LENS Synthesis & DoR Gate
              - name: "LENSSynthesis"
                module: "cortex.orchestrators.core.lens_synthesis"
                class: "LENSSynthesis"
                tier: 1
                priority: 25
                dependencies: ["IntentRouter"]
                
              # STAGE 2.7: Governance Enforcement (Phase 8.1)
              - name: "EnforcementOrchestrator"
                module: "cortex.orchestrators.core.enforcement_orchestrator"
                class: "EnforcementOrchestrator"
                tier: 1
                priority: 27
                dependencies: ["LENSSynthesis"]
                
              # STAGE 3: TDD Execution
              - name: "TDDOrchestrator"
                module: "cortex.orchestrators.core.tdd_orchestrator"
                class: "TDDOrchestrator"
                tier: 1
                priority: 30
                dependencies: ["InteractionOrchestrator", "IntentRouter"]
                
              # Workflow Management
              - name: "WorkflowOrchestrator"
                module: "cortex.orchestrators.core.workflow_orchestrator"
                class: "WorkflowOrchestrator"
                tier: 1
                priority: 35
                dependencies: ["TDDOrchestrator"]
                
              # STAGE 4: Master Coordination
              - name: "MasterOrchestrator"
                module: "cortex.orchestrators.core.master_orchestrator"
                class: "MasterOrchestrator"
                tier: 1
                priority: 100
                dependencies: ["InteractionOrchestrator", "IntentRouter", "LENSSynthesis", "TDDOrchestrator"]

