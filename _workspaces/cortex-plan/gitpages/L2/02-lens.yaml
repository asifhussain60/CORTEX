# ============================================================================
# D3.JS VISUALIZATIONS (Minimum 1)
# ============================================================================

d3_visualizations:
  lens_pipeline:
    type: "d3-sankey"
    name: "LENS Analysis Pipeline"
    description: "Data flow showing how code flows through Language → Examination → Navigation → Synthesis"
    data_structure: |
      {
        "nodes": [
          {"id": "source_code", "label": "Source Code", "category": "input"},
          {"id": "language", "label": "Language\nDetection", "category": "L"},
          {"id": "ast", "label": "AST\nParser", "category": "E"},
          {"id": "git", "label": "Git\nAnalyzer", "category": "E"},
          {"id": "comments", "label": "Comment\nExtractor", "category": "E"},
          {"id": "security", "label": "Security\nScanner", "category": "E"},
          {"id": "navigate", "label": "Code\nNavigation", "category": "N"},
          {"id": "graph", "label": "Knowledge\nGraph", "category": "S"},
          {"id": "insights", "label": "Actionable\nInsights", "category": "output"}
        ],
        "links": [
          {"source": "source_code", "target": "language", "value": 100},
          {"source": "language", "target": "ast", "value": 100},
          {"source": "language", "target": "git", "value": 100},
          {"source": "language", "target": "comments", "value": 100},
          {"source": "language", "target": "security", "value": 100},
          {"source": "ast", "target": "navigate", "value": 80},
          {"source": "git", "target": "navigate", "value": 60},
          {"source": "comments", "target": "navigate", "value": 40},
          {"source": "security", "target": "navigate", "value": 90},
          {"source": "navigate", "target": "graph", "value": 100},
          {"source": "graph", "target": "insights", "value": 100}
        ]
      }
    
    interactive_features:
      - "Hover shows analyzer details"
      - "Click node to see example output"
      - "Flow width = data volume"
      - "Animated particles flowing through pipeline"
      - "Category color-coding (L=violet, E=cyan, N=emerald, S=amber)"
  
  ast_tree:
    type: "d3-tree"
    name: "AST Explorer"
    description: "Interactive AST visualization for sample Python function"
    data_structure: |
      {
        "name": "Module",
        "children": [
          {
            "name": "FunctionDef: analyze_code",
            "children": [
              {
                "name": "arguments",
                "children": [
                  {"name": "arg: file_path (str)"},
                  {"name": "arg: options (dict)"}
                ]
              },
              {
                "name": "body",
                "children": [
                  {
                    "name": "Assign",
                    "children": [
                      {"name": "Name: analyzer"},
                      {"name": "Call: ASTAnalyzer()"}
                    ]
                  },
                  {
                    "name": "Call: analyzer.analyze",
                    "children": [
                      {"name": "arg: file_path"},
                      {"name": "keyword: options"}
                    ]
                  },
                  {
                    "name": "Return",
                    "children": [
                      {"name": "Name: result"}
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    
    interactive_features:
      - "Click to expand/collapse nodes"
      - "Hover shows node type + line number"
      - "Zoom and pan"
      - "Highlight path from root to selected node"
      - "Show source code snippet on click"
  
  git_timeline:
    type: "d3-timeline"
    name: "Git Activity Timeline"
    description: "24-hour commit patterns with author, file changes, and impact"
    data_structure: |
      {
        "commits": [
          {
            "hash": "a1b2c3d",
            "author": "dev1",
            "timestamp": "2026-01-31T09:00:00Z",
            "message": "feat: Add LENS orchestrator",
            "files_changed": 5,
            "insertions": 234,
            "deletions": 12,
            "impact": "high"
          },
          {
            "hash": "e4f5g6h",
            "author": "dev2",
            "timestamp": "2026-01-31T11:30:00Z",
            "message": "fix: AST parser edge case",
            "files_changed": 2,
            "insertions": 45,
            "deletions": 8,
            "impact": "medium"
          }
          // ... more commits
        ],
        "time_range": "24h"
      }
    
    interactive_features:
      - "Hover shows commit details"
      - "Click to view full diff"
      - "Zoom to time range"
      - "Filter by author"
      - "Color by impact (high=red, medium=amber, low=green)"

---
# ============================================================================
# MERMAID DIAGRAMS (Minimum 2)
# ============================================================================

mermaid_diagrams:
  lens_components_mindmap:
    type: "mindmap"
    title: "LENS Component Ecosystem"
    description: "Hierarchical view of all LENS capabilities"
    source: |
      mindmap
        root((CORTEX<br/>LENS))
          Language Detection
            Python
            JavaScript/TypeScript
            Go
            Rust
            Java
            C/C++
          Examination
            AST Analysis
              Complexity metrics
              Dead code detection
              Duplication finder
            Git History
              Commit patterns
              Author analytics
              Blame analysis
            Comment Extraction
              TODO/FIXME priorities
              Docstring coverage
              Technical debt markers
            Security Scanning
              CWE-89: SQL Injection
              CWE-94: Code Injection
              CWE-95: Eval Injection
              CWE-22: Path Traversal
              CWE-78: Command Injection
              CWE-327: Weak Crypto
          Navigation
            Symbol finder
            Reference lookup
            Call graph
            Import resolver
          Synthesis
            Knowledge graph
            Insight generation
            Evidence bundles
            Audit trails
  
  lens_analysis_flow:
    type: "flowchart"
    title: "LENS Analysis Execution Flow"
    description: "How LENS processes a code analysis request"
    source: |
      flowchart TD
        Start([🔍 LENS Analysis Request]) --> Validate{Valid<br/>Path?}
        Validate -->|No| Error([❌ Invalid Path])
        Validate -->|Yes| Detect[🔤 Detect Language]
        Detect --> Parse[🌳 Parse AST]
        Parse --> CheckGit{Git<br/>Repo?}
        CheckGit -->|Yes| GitAnalysis[📊 Git History Analysis]
        CheckGit -->|No| SkipGit[⏭️ Skip Git]
        GitAnalysis --> ExtractComments
        SkipGit --> ExtractComments
        ExtractComments[💬 Extract Comments] --> SecurityScan[🛡️ Security Scan]
        SecurityScan --> BuildGraph[🧠 Build Knowledge Graph]
        BuildGraph --> GenerateInsights[💡 Generate Insights]
        GenerateInsights --> CreateBundle[📦 Create Evidence Bundle]
        CreateBundle --> Complete([✅ Analysis Complete])
        
        style Start fill:#8b5cf6
        style Complete fill:#10b981
        style Error fill:#ef4444
        style SecurityScan fill:#f59e0b
  
  cwe_detection_sequence:
    type: "sequenceDiagram"
    title: "CWE Pattern Detection"
    description: "How LENS detects security vulnerabilities"
    source: |
      sequenceDiagram
        actor User
        participant LENS as LENSOrchestrator
        participant AST as ASTAnalyzer
        participant Security as SecurityThreatAnalyzer
        participant Brain as CORTEX Brain
        
        User->>LENS: /lens security src/
        LENS->>AST: Parse all files
        AST-->>LENS: AST trees
        LENS->>Security: Scan for CWE patterns
        Security->>Security: Check CWE-89 (SQL)
        Security->>Security: Check CWE-94 (Code)
        Security->>Security: Check CWE-95 (Eval)
        Security->>Security: Check CWE-22 (Path)
        Security->>Security: Check CWE-78 (Command)
        Security->>Security: Check CWE-327 (Crypto)
        Security-->>LENS: Violations found
        LENS->>Brain: Log audit entry
        Brain-->>LENS: Audit ID
        LENS-->>User: Security report<br/>with evidence

---
# ============================================================================
# CONTENT SECTIONS (Role-Specific)
# ============================================================================

content_sections:
  section_1_overview:
    title: "🔍 What is CORTEX LENS?"
    audience: ["All roles"]
    layout: "glass-card with executive summary + feature grid"
    content:
      executive_summary: |
        CORTEX LENS is a unified code intelligence system that combines AST analysis,
        Git history, security scanning, and Vision API into a single MCP-exposed tool.
        
        **Key Differentiator:** Cross-language, cross-concern analysis with evidence bundles.
        No separate tools for AST, git, security—LENS synthesizes all into actionable insights.
      
      feature_grid:
        - feature: "AST Analysis"
          icon: "🌳"
          description: "Parse 6+ languages into abstract syntax trees. Detect complexity, dead code, duplicates."
          example: "Cyclomatic complexity, unreachable code, CORE-035 violations"
        
        - feature: "Git Intelligence"
          icon: "📊"
          description: "Analyze commit patterns, author contributions, file hotspots, blame history."
          example: "24h commit activity, most-changed files, author analytics"
        
        - feature: "Security Scanning"
          icon: "🛡️"
          description: "Detect 6 CWE patterns: SQL injection, code injection, path traversal, weak crypto."
          example: "CWE-89 in user_repo.py line 45: Unsanitized SQL"
        
        - feature: "Comment Extraction"
          icon: "💬"
          description: "Extract TODO/FIXME, measure docstring coverage, identify technical debt."
          example: "23 TODOs, 12 FIXMEs, 67% docstring coverage"
        
        - feature: "Vision API"
          icon: "�️"
          description: "Analyze screenshots for UI bugs, accessibility issues, design inconsistencies."
          example: "Missing alt text, color contrast < WCAG AA"
        
        - feature: "Knowledge Graph"
          icon: "🧠"
          description: "Synthesize all findings into queryable knowledge graph with evidence."
          example: "File A depends on B, imports from C, modified by D"
  
  section_2_analyzers:
    title: "🧠 The Four Analyzers"
    audience: ["Engineers", "Tech Leads"]
    layout: "glass-card tabs (AST, Git, Comments, Security)"
    content:
      ast_analyzer:
        title: "ASTAnalyzer"
        location: "cortex/brain/analysis/ast_analyzer.py"
        capabilities:
          - "Parse Python, JS/TS, Go, Rust, Java, C/C++"
          - "Cyclomatic complexity calculation"
          - "Dead code detection (unreachable statements)"
          - "Duplicate code finder (CORE-035)"
          - "Function/class extraction"
          - "Import dependency graph"
        example_output: |
          {
            "file": "user_manager.py",
            "complexity": {"cyclomatic": 12, "cognitive": 8},
            "dead_code": ["line 67-72"],
            "duplicates": ["similar to account_manager.py:45-60"],
            "imports": ["bcrypt", "sqlalchemy"],
            "functions": ["create_user", "authenticate", "delete_user"]
          }
      
      git_history_analyzer:
        title: "GitHistoryAnalyzer"
        location: "cortex/brain/analysis/git_history_analyzer.py"
        capabilities:
          - "Commit history analysis (24h, 7d, 30d)"
          - "Author contribution stats"
          - "File churn detection (most-changed files)"
          - "Blame analysis (who last touched line)"
          - "Branch comparison (divergence detection)"
        example_output: |
          {
            "commits_24h": 15,
            "authors": ["dev1 (60%)", "dev2 (40%)"],
            "hotspots": ["user_manager.py (12 changes)", "auth.py (8 changes)"],
            "last_modified": "user_manager.py:45 by dev1 2h ago"
          }
      
      comment_extractor:
        title: "CommentExtractor"
        location: "cortex/brain/analysis/comment_extractor.py"
        capabilities:
          - "TODO/FIXME/HACK extraction"
          - "Docstring coverage measurement"
          - "Technical debt markers"
          - "Priority inference (P0, P1, P2)"
          - "Age tracking (days since created)"
        example_output: |
          {
            "todos": 23,
            "fixmes": 12,
            "docstring_coverage": 67%,
            "p0_issues": ["FIXME: SQL injection risk in line 45"],
            "oldest_todo": "TODO: Refactor auth (186 days old)"
          }
      
      security_threat_analyzer:
        title: "SecurityThreatAnalyzer"
        location: "cortex/brain/analysis/security_threat_analyzer.py"
        capabilities:
          - "CWE-89: SQL Injection detection"
          - "CWE-94/95: Code/Eval Injection"
          - "CWE-22: Path Traversal"
          - "CWE-78: Command Injection"
          - "CWE-327: Weak Cryptography"
          - "STRIDE threat modeling"
        example_output: |
          {
            "vulnerabilities": [
              {
                "cwe": "89",
                "severity": "HIGH",
                "file": "user_repo.py",
                "line": 45,
                "description": "Unsanitized SQL query with user input",
                "recommendation": "Use parameterized queries"
              }
            ],
            "stride_threats": ["Spoofing risk in auth flow"]
          }
  
  section_3_mcp_integration:
    title: "🔌 MCP Tools"
    audience: ["Engineers"]
    layout: "glass-card with tool reference"
    content:
      tools:
        - tool: "cortex_lens_analyze"
          description: "Unified analysis: AST + Git + Comments + Security"
          parameters:
            - "path: str"
            - "scope: 'file' | 'folder' | 'project'"
            - "analyzers: ['ast', 'git', 'comments', 'security']"
          returns: "Evidence bundle with all findings"
          example: |
            /lens analyze src/auth/
        
        - tool: "cortex_git_history"
          description: "Git-specific analysis"
          parameters:
            - "repo_path: Path"
            - "since_hours: int = 24"
            - "include_blame: bool = True"
          returns: "Commit history + blame data"
          example: |
            /lens git 24h
        
        - tool: "cortex_ast_analyze"
          description: "AST-only analysis"
          parameters:
            - "file_path: Path"
            - "detect_duplicates: bool = True"
            - "complexity_threshold: int = 10"
          returns: "AST metrics + violations"
          example: |
            /lens ast user_manager.py
        
        - tool: "cortex_detect_duplicates"
          description: "CORE-035 duplicate detection"
          parameters:
            - "paths: List[Path]"
            - "similarity_threshold: float = 0.85"
          returns: "List of duplicate code blocks"
          example: |
            /lens duplicates src/
  
  section_4_vision_api:
    title: "�️ Vision API (Beta)"
    audience: ["Engineers", "Product Owners"]
    layout: "glass-card with demo + capabilities"
    content:
      description: |
        CORTEX LENS Vision API analyzes screenshots for UI bugs, accessibility issues,
        and design inconsistencies using GPT-4 Vision.
      
      capabilities:
        - "Missing alt text detection"
        - "Color contrast WCAG AA/AAA validation"
        - "Layout shift detection"
        - "Broken image identification"
        - "Typography consistency checks"
        - "Responsive design issues"
      
      example_usage: |
        /lens vision screenshot.png
        
        Output:
        {
          "accessibility": {
            "missing_alt_text": ["button.png", "logo.svg"],
            "contrast_issues": ["text on background: 3.2:1 (WCAG AA requires 4.5:1)"]
          },
          "design": {
            "typography": ["Inconsistent font sizes: 14px, 15px, 16px"],
            "layout": ["Misaligned elements at line 45"]
          }
        }
  
  section_5_use_cases:
    title: "🎯 Real-World Use Cases"
    audience: ["All roles"]
    layout: "glass-card with scenario cards"
    content:
      scenarios:
        - scenario: "Pre-Commit Security Scan"
          icon: "🛡️"
          description: |
            Run LENS security scan before every commit to catch CWE violations early.
            Integrated with git hooks for automatic enforcement.
          command: "/lens security $(git diff --name-only HEAD)"
          outcome: "Zero security vulnerabilities reach production"
        
        - scenario: "Technical Debt Inventory"
          icon: "📊"
          description: |
            Generate comprehensive TODO/FIXME report with priority and age tracking.
            Ideal for sprint planning and backlog grooming.
          command: "/lens comments src/ --priority"
          outcome: "Prioritized tech debt list for sprint planning"
        
        - scenario: "Code Review Preparation"
          icon: "👀"
          description: |
            Analyze changes before code review to identify complexity hotspots,
            duplicates, and missing tests.
          command: "/lens analyze $(git diff --name-only main)"
          outcome: "Focused code reviews on high-risk areas"
        
        - scenario: "Onboarding Documentation"
          icon: "🎓"
          description: |
            Generate knowledge graph of codebase structure, dependencies,
            and key contributors for new team members.
          command: "/lens graph src/ --output onboarding.html"
          outcome: "Interactive codebase map for new hires"

