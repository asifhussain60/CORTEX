# ============================================================================
# MERMAID DIAGRAMS
# ============================================================================

mermaid_diagrams:
  domain_orchestrator_mindmap:
    type: "mindmap"
    title: "Domain Orchestrators Overview"
    code: |
      mindmap
        root((Domain<br/>Orchestrators<br/>6 Total))
          RefactoringOrchestrator
            Smell Detection
              Long Method
              Large Class
              Duplicate Code
            Pattern Application
              Extract Method
              Extract Class
              Strategy Pattern
            Code Cleanup
              Unused Imports
              Dead Code
              Magic Numbers
          PlanningOrchestrator
            Phase Generation
              Analysis Phase
              Design Phase
              Implementation Phase
              Testing Phase
            Milestone Tracking
              Completion %
              Blockers
              Timeline
            PhaseExecutor
              Execute phases sequentially
              Checkpoint management
          DocumentationOrchestrator
            API Documentation
              Docstrings
              Type Hints
              Examples
            Changelog Generation
              Version bumps
              Breaking changes
              Migration guides
            README Updates
              Feature additions
              Setup instructions
          PhaseExecutor
            Phase Execution
              Sequential execution
              Error handling
            Checkpoint Management
              Git commits
              Rollback points
          AutonomousExecutionEngine
            Multi-Step Operations
              Self-planning
              Adaptive execution
            Self-Correction
              Error detection
              Retry logic
            TDD Integration
              Test-first approach
          ConversationOrchestrator
            Context Tracking
              Conversation history
              State management
            Turn Management
              Multi-turn workflows
              Continuation logic

  refactoring_workflow:
    type: "flowchart"
    title: "RefactoringOrchestrator Workflow"
    code: |
      flowchart TD
        A[REFACTOR Intent] --> B[RefactoringOrchestrator]
        B --> C[Smell Detection]
        
        C --> D{Smells<br/>Found?}
        D -->|No| E[✅ Code Clean]
        D -->|Yes| F[Prioritize Smells]
        
        F --> G[Select Refactoring Pattern]
        G --> H{Pattern<br/>Available?}
        
        H -->|No| I[Manual Refactoring Guidance]
        H -->|Yes| J[Apply Pattern]
        
        J --> K[Generate Tests]
        K --> L[Run Tests]
        
        L --> M{Tests<br/>Pass?}
        M -->|No| N[Rollback Changes]
        M -->|Yes| O[Code Quality Check]
        
        O --> P{Quality<br/>Improved?}
        P -->|No| N
        P -->|Yes| Q[✅ Commit Refactoring]
        
        N --> R[Report Failure]
        Q --> S[Update Documentation]
        
        style B fill:#8b5cf6,color:#fff
        style E fill:#10b981,color:#fff
        style Q fill:#10b981,color:#fff
        style N fill:#ef4444,color:#fff
        style R fill:#ef4444,color:#fff

  planning_sequence:
    type: "sequenceDiagram"
    title: "PlanningOrchestrator Phase Breakdown"
    code: |
      sequenceDiagram
        participant Master as MasterOrchestrator
        participant Planning as PlanningOrchestrator
        participant Phase as PhaseExecutor
        participant TDD as TDDOrchestrator
        participant Git as GitCheckpoint
        
        Master->>Planning: IMPLEMENT (complex feature)
        Planning->>Planning: Analyze complexity
        Planning->>Planning: Break into phases
        
        loop For each phase
          Planning->>Phase: Execute phase
          Phase->>TDD: Generate tests
          TDD-->>Phase: Tests ready
          
          Phase->>Git: Create checkpoint
          Git-->>Phase: Checkpoint created
          
          Phase->>Phase: Implement phase
          Phase->>TDD: Run tests
          
          alt Tests pass
            TDD-->>Phase: ✅ Tests pass
            Phase->>Planning: Phase complete
          else Tests fail
            TDD-->>Phase: ❌ Tests fail
            Phase->>Git: Rollback to checkpoint
            Git-->>Phase: Rolled back
            Phase->>Planning: Phase failed - retry?
          end
        end
        
        Planning-->>Master: All phases complete

---
# ============================================================================
# CONTENT SECTIONS
# ============================================================================

sections:
  refactoring_orchestrator:
    title: "RefactoringOrchestrator"
    icon: "🔧"
    content_blocks:
      - type: "orchestrator_detail"
        name: "RefactoringOrchestrator"
        priority: 50
        tier: 2
        dependencies: ["MasterOrchestrator"]
        module: "cortex.orchestrators.domain.enhanced_refactoring_orchestrator"
        class: "EnhancedRefactoringOrchestrator"
        
        description: |
          Specialized orchestrator for code refactoring. Detects code smells 
          (Long Method, Large Class, Duplicate Code), applies refactoring 
          patterns (Extract Method, Strategy, etc.), and validates improvements.
        
        capabilities:
          - name: "Code Refactoring"
            description: "Automated refactoring with pattern application"
          - name: "Pattern Application"
            description: "Extract Method, Extract Class, Strategy, Template Method"
          - name: "Smell Detection"
            description: "Detects 12+ code smells"
        
        mcp_tools:
          - "cortex_process_request (refactoring mode)"
          - "cortex_lens_analyze (smell detection)"
        
        health_check:
          method: "analyze_refactoring"
          description: "Verifies smell detection and pattern suggestion"
        
        supported_smells:
          - "Long Method (>50 lines)"
          - "Large Class (>500 lines)"
          - "Duplicate Code (CORE-035)"
          - "Long Parameter List (>5 params)"
          - "Magic Numbers"
          - "Dead Code"
          - "Unused Imports"

  planning_orchestrator:
    title: "PlanningOrchestrator"
    icon: "📋"
    content_blocks:
      - type: "orchestrator_detail"
        name: "PlanningOrchestrator"
        priority: 51
        tier: 2
        dependencies: ["MasterOrchestrator"]
        module: "cortex.orchestrators.domain.enhanced_planning_orchestrator"
        class: "EnhancedPlanningOrchestrator"
        
        description: |
          Breaks complex implementations into phases. Generates milestones, 
          tracks completion, coordinates with PhaseExecutor for sequential 
          execution.
        
        capabilities:
          - name: "Plan Generation"
            description: "Multi-phase plan creation"
          - name: "Phase Management"
            description: "Analysis → Design → Implementation → Testing"
          - name: "Milestone Tracking"
            description: "Progress tracking with blockers"
        
        mcp_tools:
          - "cortex_process_request (planning mode)"
        
        health_check:
          method: "generate_plan"
          description: "Verifies plan generation pipeline"
        
        phase_structure:
          - phase: "Analysis"
            deliverables: ["Requirements", "Constraints", "Dependencies"]
          - phase: "Design"
            deliverables: ["Architecture", "Data models", "API contracts"]
          - phase: "Implementation"
            deliverables: ["Code", "Tests", "Documentation"]
          - phase: "Testing"
            deliverables: ["Unit tests", "Integration tests", "Coverage report"]

  documentation_orchestrator:
    title: "DocumentationOrchestrator"
    icon: "📚"
    content_blocks:
      - type: "orchestrator_detail"
        name: "DocumentationOrchestrator"
        priority: 52
        tier: 2
        dependencies: ["MasterOrchestrator"]
        module: "cortex.orchestrators.domain.enhanced_documentation_orchestrator"
        class: "EnhancedDocumentationOrchestrator"
        
        description: |
          Generates documentation from code. Creates API docs (Google-style 
          docstrings), changelogs, README updates, and architecture diagrams.
        
        capabilities:
          - name: "Doc Generation"
            description: "Automated documentation from code"
          - name: "API Documentation"
            description: "Google-style docstrings with examples"
          - name: "Changelog Management"
            description: "Version-based changelog generation"
        
        mcp_tools:
          - "cortex_process_request (documentation mode)"
        
        health_check:
          method: "generate_documentation"
          description: "Verifies documentation generation"
        
        output_formats:
          - "Google-style docstrings (CORE-012)"
          - "Markdown README files"
          - "CHANGELOG.md (Keep a Changelog format)"
          - "Mermaid architecture diagrams"
          - "API reference (Sphinx-compatible)"

  phase_executor:
    title: "PhaseExecutor"
    icon: "⚡"
    content_blocks:
      - type: "orchestrator_detail"
        name: "PhaseExecutor"
        priority: 53
        tier: 2
        dependencies: ["PlanningOrchestrator"]
        module: "cortex.orchestrators.domain.phase_executor"
        
        description: |
          Executes phases generated by PlanningOrchestrator. Manages 
          checkpoints, handles errors, supports rollback.
        
        capabilities:
          - name: "Phase Execution"
            description: "Sequential phase execution with error handling"
          - name: "Checkpoint Management"
            description: "Git checkpoints between phases"
        
        health_check:
          method: "execute_phase"
          description: "Verifies phase execution"

  autonomous_execution:
    title: "AutonomousExecutionEngine"
    icon: "🤖"
    content_blocks:
      - type: "orchestrator_detail"
        name: "AutonomousExecutionEngine"
        priority: 54
        tier: 2
        dependencies: ["MasterOrchestrator", "TDDOrchestrator"]
        module: "cortex.orchestrators.domain.autonomous_execution_engine"
        
        description: |
          Self-directed execution for complex operations. Plans steps, 
          executes autonomously, self-corrects on errors.
        
        capabilities:
          - name: "Autonomous Execution"
            description: "Self-directed multi-step operations"
          - name: "Multi-Step Operations"
            description: "Plans and executes complex workflows"
          - name: "Self-Correction"
            description: "Detects and corrects errors automatically"
        
        health_check:
          method: "execute_autonomous"
          description: "Verifies autonomous execution"

  conversation_orchestrator:
    title: "ConversationOrchestrator"
    icon: "💬"
    content_blocks:
      - type: "orchestrator_detail"
        name: "ConversationOrchestrator"
        priority: 55
        tier: 2
        dependencies: ["InteractionOrchestrator"]
        module: "cortex.orchestrators.conversation_orchestrator"
        
        description: |
          Manages multi-turn conversations. Tracks context across turns, 
          handles conversation state, supports continuation.
        
        capabilities:
          - name: "Conversation Management"
            description: "Multi-turn conversation orchestration"
          - name: "Context Tracking"
            description: "Maintains conversation state across turns"
        
        health_check:
          method: "manage_conversation"
          description: "Verifies conversation management"

  wiring_configuration:
    title: "Wiring Configuration"
    icon: "🔌"
    content_blocks:
      - type: "yaml_reference"
        title: "Domain Orchestrators in wiring.yaml"
        file: "cortex/wiring/specifications/wiring.yaml"
        excerpt: |
          orchestrators:
            domain:
              - name: "RefactoringOrchestrator"
                module: "cortex.orchestrators.domain.enhanced_refactoring_orchestrator"
                class: "EnhancedRefactoringOrchestrator"
                tier: 2
                priority: 50
                dependencies: ["MasterOrchestrator"]
                
              - name: "PlanningOrchestrator"
                module: "cortex.orchestrators.domain.enhanced_planning_orchestrator"
                class: "EnhancedPlanningOrchestrator"
                tier: 2
                priority: 51
                dependencies: ["MasterOrchestrator"]
                
              - name: "DocumentationOrchestrator"
                module: "cortex.orchestrators.domain.enhanced_documentation_orchestrator"
                class: "EnhancedDocumentationOrchestrator"
                tier: 2
                priority: 52
                dependencies: ["MasterOrchestrator"]
                
              - name: "PhaseExecutor"
                module: "cortex.orchestrators.domain.phase_executor"
                class: "PhaseExecutor"
                tier: 2
                priority: 53
                dependencies: ["PlanningOrchestrator"]
                
              - name: "AutonomousExecutionEngine"
                module: "cortex.orchestrators.domain.autonomous_execution_engine"
                class: "AutonomousExecutionEngine"
                tier: 2
                priority: 54
                dependencies: ["MasterOrchestrator", "TDDOrchestrator"]
                
              - name: "ConversationOrchestrator"
                module: "cortex.orchestrators.conversation_orchestrator"
                class: "ConversationOrchestrator"
                tier: 2
                priority: 55
                dependencies: ["InteractionOrchestrator"]

