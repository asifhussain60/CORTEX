# ============================================================================
# MERMAID DIAGRAMS
# ============================================================================

mermaid_diagrams:
  stride_methodology:
    type: "mindmap"
    title: "STRIDE Threat Modeling Methodology"
    code: |
      mindmap
        root((STRIDE))
          Spoofing Identity
            Attack: Fake authentication
            Mitigation: Strong auth + MFA
            Example: JWT token forgery
          Tampering with Data
            Attack: Modify data in transit/rest
            Mitigation: Input validation + encryption
            Example: SQL injection
          Repudiation
            Attack: Deny actions taken
            Mitigation: Audit logging + signatures
            Example: No log of admin action
          Information Disclosure
            Attack: Expose sensitive data
            Mitigation: Encryption + access control
            Example: API leaking user data
          Denial of Service
            Attack: Make system unavailable
            Mitigation: Rate limiting + quotas
            Example: Infinite loop exploit
          Elevation of Privilege
            Attack: Gain unauthorized access
            Mitigation: RBAC + least privilege
            Example: User becomes admin

  cwe_detection_flow:
    type: "flowchart"
    title: "CWE Pattern Detection via AST Analysis"
    code: |
      flowchart TD
        A[Source Code] --> B[Parse to AST]
        B --> C[AST Analyzer]
        C --> D{Detect Patterns}
        
        D --> E[CWE-89: SQL Injection]
        D --> F[CWE-94: Code Injection]
        D --> G[CWE-78: Command Injection]
        D --> H[CWE-22: Path Traversal]
        D --> I[CWE-327: Weak Crypto]
        D --> J[CWE-95: Eval Injection]
        
        E --> K{String Concatenation<br/>in SQL?}
        K -->|Yes| L[🚨 VIOLATION]
        K -->|No| M[✅ Safe]
        
        F --> N{exec/eval<br/>with user input?}
        N -->|Yes| L
        N -->|No| M
        
        G --> O{subprocess with<br/>shell=True?}
        O -->|Yes| L
        O -->|No| M
        
        L --> P[Report + Fix Suggestion]
        M --> Q[Continue Scan]
        
        style L fill:#ef4444,color:#fff
        style M fill:#10b981,color:#fff

  ast_analysis_sequence:
    type: "sequenceDiagram"
    title: "AST Security Analysis Sequence"
    code: |
      sequenceDiagram
        participant Dev as Developer
        participant CORTEX
        participant AST as AST Analyzer
        participant CWE as CWE Detector
        participant KB as Knowledge Base
        participant Report
        
        Dev->>CORTEX: Commit code
        CORTEX->>AST: Parse Python files
        AST-->>CORTEX: AST tree
        CORTEX->>CWE: Run pattern detection
        
        loop For each CWE pattern
          CWE->>AST: Check for violation
          AST-->>CWE: Found/Not found
          alt Violation found
            CWE->>KB: Query fix recommendation
            KB-->>CWE: Best practice + example
            CWE->>Report: Add finding
          end
        end
        
        Report->>CORTEX: Vulnerability report
        CORTEX-->>Dev: Report + fix suggestions
        
        alt Developer fixes
          Dev->>CORTEX: Commit fix
          CORTEX->>CWE: Re-scan
          CWE-->>CORTEX: ✅ Clean
        end

