# ============================================================================
# CONTENT SECTIONS
# ============================================================================

sections:
  stride_overview:
    title: "STRIDE Threat Modeling"
    icon: "⚠️"
    content_blocks:
      - type: "methodology_explanation"
        title: "Microsoft STRIDE Framework"
        description: |
          STRIDE is a threat modeling methodology developed by Microsoft to 
          systematically identify security threats across 6 categories.
        
        threats:
          - threat: "Spoofing Identity"
            description: "Pretending to be someone/something you're not"
            examples:
              - "Stealing JWT tokens"
              - "Forging authentication credentials"
              - "Man-in-the-middle attacks"
            mitigations:
              - "Strong authentication (MFA)"
              - "Certificate pinning"
              - "API key rotation"
          
          - threat: "Tampering with Data"
            description: "Malicious modification of data"
            examples:
              - "SQL injection attacks"
              - "Modifying session cookies"
              - "Altering log files"
            mitigations:
              - "Input validation (whitelist)"
              - "Parameterized queries"
              - "Hash verification"
          
          - threat: "Repudiation"
            description: "Claiming you didn't perform an action"
            examples:
              - "Denying admin action without logs"
              - "Disputing transaction"
              - "Claiming account was hacked"
            mitigations:
              - "Hash-chain audit logging"
              - "Digital signatures"
              - "Immutable records"
          
          - threat: "Information Disclosure"
            description: "Exposing information to unauthorized parties"
            examples:
              - "Leaking user data via API"
              - "Stack traces with secrets"
              - "Unencrypted database backups"
            mitigations:
              - "Encryption at rest/transit"
              - "Access control (RBAC)"
              - "Data masking"
          
          - threat: "Denial of Service (DoS)"
            description: "Making system unavailable to legitimate users"
            examples:
              - "Resource exhaustion attacks"
              - "Infinite loop exploits"
              - "Database connection flooding"
            mitigations:
              - "Rate limiting"
              - "Request throttling"
              - "Resource quotas"
          
          - threat: "Elevation of Privilege"
            description: "Gaining access beyond authorized level"
            examples:
              - "User escalating to admin"
              - "Breaking out of sandbox"
              - "Exploiting RBAC bugs"
            mitigations:
              - "RBAC enforcement"
              - "Least privilege principle"
              - "Permission validation"
      
      - type: "cortex_implementation"
        title: "STRIDE in CORTEX"
        description: "How CORTEX addresses each threat"
        
        implementation:
          - threat: "Spoofing"
            coverage: "95%"
            features: ["JWT authentication", "API key management", "MFA support"]
          
          - threat: "Tampering"
            coverage: "92%"
            features: ["Input validation (25+ validators)", "Parameterized queries", "Hash verification"]
          
          - threat: "Repudiation"
            coverage: "98%"
            features: ["Hash-chain audit logs", "Immutable records", "Event sourcing"]
          
          - threat: "Info Disclosure"
            coverage: "88%"
            features: ["RBAC", "Secrets via env vars", "Data encryption"]
          
          - threat: "DoS"
            coverage: "82%"
            features: ["Rate limiting", "Request throttling", "Resource monitoring"]
          
          - threat: "Elevation"
            coverage: "90%"
            features: ["RBAC validation", "Least privilege", "Permission checks"]

  cwe_detection:
    title: "6 CWE Pattern Detection"
    icon: "🔍"
    content_blocks:
      - type: "cwe_patterns"
        title: "Automated Vulnerability Detection"
        description: |
          CORTEX uses AST (Abstract Syntax Tree) analysis to detect 6 critical 
          CWE patterns in Python code before deployment.
        
        patterns:
          - cwe: "CWE-89: SQL Injection"
            severity: "High"
            description: "Improper neutralization of SQL commands"
            detection_method: "AST analysis of string concatenation in database queries"
            example_bad: |
              # ❌ VULNERABLE
              query = f"SELECT * FROM users WHERE id = {user_id}"
              cursor.execute(query)
            example_good: |
              # ✅ SAFE (parameterized)
              query = "SELECT * FROM users WHERE id = ?"
              cursor.execute(query, (user_id,))
          
          - cwe: "CWE-94: Code Injection"
            severity: "Critical"
            description: "Improper control of code generation"
            detection_method: "Detect exec()/eval() with user input"
            example_bad: |
              # ❌ VULNERABLE
              user_code = request.POST.get('code')
              exec(user_code)
            example_good: |
              # ✅ SAFE (AST validation + sandbox)
              parsed = ast.parse(user_code)
              validate_ast(parsed)  # Check for dangerous nodes
              run_in_sandbox(parsed)
          
          - cwe: "CWE-78: OS Command Injection"
            severity: "High"
            description: "Improper neutralization of OS commands"
            detection_method: "Detect subprocess with shell=True + user input"
            example_bad: |
              # ❌ VULNERABLE
              filename = request.GET.get('file')
              os.system(f"cat {filename}")
            example_good: |
              # ✅ SAFE (no shell, whitelist path)
              filename = sanitize_filename(request.GET.get('file'))
              subprocess.run(['cat', filename], shell=False)
          
          - cwe: "CWE-22: Path Traversal"
            severity: "Medium"
            description: "Improper limitation of pathname"
            detection_method: "Detect file operations with unsanitized user paths"
            example_bad: |
              # ❌ VULNERABLE
              user_file = request.GET.get('file')
              with open(f"/uploads/{user_file}", 'r') as f:
                  content = f.read()
            example_good: |
              # ✅ SAFE (path validation)
              user_file = secure_filename(request.GET.get('file'))
              safe_path = os.path.abspath(f"/uploads/{user_file}")
              if not safe_path.startswith("/uploads/"):
                  raise SecurityError("Path traversal detected")
              with open(safe_path, 'r') as f:
                  content = f.read()
          
          - cwe: "CWE-327: Use of Broken Cryptography"
            severity: "Medium"
            description: "Using weak/broken cryptographic algorithms"
            detection_method: "Detect usage of MD5, SHA1, DES, RC4"
            example_bad: |
              # ❌ VULNERABLE
              import md5
              password_hash = md5.new(password).hexdigest()
            example_good: |
              # ✅ SAFE (bcrypt/Argon2)
              import bcrypt
              password_hash = bcrypt.hashpw(password.encode(), bcrypt.gensalt())
          
          - cwe: "CWE-95: Eval Injection"
            severity: "Critical"
            description: "Improper neutralization of directives in evaluated code"
            detection_method: "Detect eval() with any external input"
            example_bad: |
              # ❌ VULNERABLE
              expression = request.POST.get('calc')
              result = eval(expression)
            example_good: |
              # ✅ SAFE (safe evaluation)
              from ast import literal_eval
              expression = request.POST.get('calc')
              result = literal_eval(expression)  # Only literals allowed

  ast_analysis:
    title: "AST-Powered Security Analysis"
    icon: "🌳"
    content_blocks:
      - type: "feature_explanation"
        title: "50+ AST Security Checks"
        description: |
          Abstract Syntax Tree (AST) analysis parses Python code into tree structure, 
          enabling deep pattern detection beyond regex/text search.
        
        ast_checks:
          - category: "Injection Vulnerabilities"
            checks: ["SQL injection", "Code injection", "Command injection", "LDAP injection"]
          
          - category: "Cryptography Issues"
            checks: ["Weak algorithms (MD5, SHA1)", "Hardcoded keys", "Insecure random"]
          
          - category: "Authentication/Authorization"
            checks: ["Missing auth checks", "Hardcoded credentials", "Weak password policies"]
          
          - category: "Data Exposure"
            checks: ["Secrets in logs", "Sensitive data in URLs", "Unencrypted storage"]
          
          - category: "Error Handling"
            checks: ["Bare except clauses", "Information leakage in errors", "Missing validation"]
      
      - type: "code_example"
        title: "AST Analysis Example"
        code: |
          # cortex/brain/analysis/security_ast_analyzer.py
          import ast
          from cortex.brain.analysis.ast_analyzer import ASTAnalyzer
          
          class SecurityASTAnalyzer(ASTAnalyzer):
              def detect_sql_injection(self, tree: ast.AST) -> list[dict]:
                  """Detect potential SQL injection vulnerabilities"""
                  violations = []
                  
                  for node in ast.walk(tree):
                      # Check for string formatting in execute() calls
                      if isinstance(node, ast.Call):
                          if hasattr(node.func, 'attr') and node.func.attr == 'execute':
                              # Check if arg is f-string or string concatenation
                              if len(node.args) > 0:
                                  arg = node.args[0]
                                  if isinstance(arg, ast.JoinedStr):  # f-string
                                      violations.append({
                                          "cwe": "CWE-89",
                                          "line": node.lineno,
                                          "message": "Potential SQL injection via f-string",
                                          "recommendation": "Use parameterized queries"
                                      })
                  
                  return violations

  integration_with_cortex:
    title: "Integration with Development Workflow"
    icon: "🔗"
    content_blocks:
      - type: "workflow_integration"
        title: "Continuous Security Assessment"
        phases:
          - phase: "Pre-Commit"
            tool: "Git Hook"
            action: "Run CWE detection on staged files"
            result: "Block commit if critical vulnerabilities found"
          
          - phase: "Pull Request"
            tool: "CI/CD Pipeline"
            action: "Full AST scan + STRIDE assessment"
            result: "Comment on PR with findings"
          
          - phase: "Pre-Deployment"
            tool: "Deployment Gate"
            action: "Validate no open high/critical vulnerabilities"
            result: "Block deployment if security criteria not met"
          
          - phase: "Production"
            tool: "Runtime Monitoring"
            action: "Detect exploitation attempts"
            result: "Alert + auto-block suspicious requests"

