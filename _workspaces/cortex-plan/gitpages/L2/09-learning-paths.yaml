# ============================================================================
# MERMAID DIAGRAMS (Minimum 2)
# ============================================================================

mermaid_diagrams:
  path_structure:
    type: "flowchart"
    title: "Learning Path Structure"
    code: |
      flowchart TD
        A[Learning Path] --> B[Theory Modules]
        A --> C[Hands-On Challenges]
        A --> D[Real-World Projects]
        A --> E[Assessments]
        
        B --> B1[Video Lessons]
        B --> B2[Reading Materials]
        B --> B3[Interactive Demos]
        
        C --> C1[Guided Challenges]
        C --> C2[Independent Challenges]
        C --> C3[Code Katas]
        
        D --> D1[Refactoring Exercises]
        D --> D2[Feature Implementation]
        D --> D3[Bug Fixes]
        
        E --> E1[Module Quizzes]
        E --> E2[Final Project]
        E --> E3[Peer Review]
        
        B1 --> F[Progress Tracking]
        C2 --> F
        D2 --> F
        E2 --> F
        F --> G{Completion<br/>Criteria Met?}
        G -->|Yes| H[🏆 Badge Awarded]
        G -->|No| I[Continue Learning]
        I --> B
        
        style A fill:#7b61ff,color:#fff
        style H fill:#10b981,color:#fff

  career_tracks:
    type: "mindmap"
    title: "Career Track Learning Paths"
    code: |
      mindmap
        root((Career<br/>Tracks))
          Backend Engineer
            Python Fundamentals
            Clean Code
            SOLID Principles
            Design Patterns
            REST API Design
            Database Optimization
            Microservices
          Frontend Engineer
            JavaScript Fundamentals
            React/Vue/Angular
            State Management
            Performance Optimization
            Accessibility (A11y)
            UI/UX Best Practices
          Full-Stack Engineer
            Backend Foundations
            Frontend Foundations
            API Integration
            DevOps Basics
            System Design
          Security Engineer
            Secure Coding
            OWASP Top 10
            Threat Modeling
            Penetration Testing
            Incident Response
          DevOps Engineer
            Linux Fundamentals
            CI/CD Pipelines
            Docker & Kubernetes
            Infrastructure as Code
            Monitoring & Observability
          Architect
            DDD Fundamentals
            Microservices Architecture
            Cloud Native Patterns
            System Design Interview
            Technical Leadership

  module_sequence:
    type: "sequenceDiagram"
    title: "Module Learning Sequence"
    code: |
      sequenceDiagram
        participant Learner
        participant Platform as Learning Platform
        participant CORTEX
        participant Validator
        
        Learner->>Platform: Enroll in path
        Platform-->>Learner: Module 1: Theory
        Learner->>Platform: Watch videos + read docs
        Platform->>Learner: Module 1 Quiz
        Learner->>Platform: Submit quiz
        Platform->>Validator: Validate answers
        Validator-->>Platform: ✅ Pass (80%+)
        
        Platform-->>Learner: Module 2: Challenge
        Learner->>CORTEX: Implement solution
        CORTEX->>Validator: Run tests
        Validator-->>CORTEX: ✅ All tests pass
        CORTEX-->>Learner: Feedback + next challenge
        
        Platform-->>Learner: Module 3: Project
        Learner->>Platform: Submit project
        Platform->>Validator: Automated review
        Validator->>Platform: Request peer review
        Platform->>Learner: Peer feedback
        Learner->>Platform: Revise + resubmit
        Platform->>Validator: Final validation
        Validator-->>Platform: ✅ Approved
        
        Platform->>Learner: 🏆 Path completed!

