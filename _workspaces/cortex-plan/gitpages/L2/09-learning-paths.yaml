  path_structure_deep_dive:
    title: "Inside a Learning Path"
    icon: "🔬"
    content_blocks:
      - type: "example_path"
        title: "Example: SOLID Principles (6 weeks)"
        structure:
          week_1:
            title: "Week 1: Single Responsibility Principle"
            theory:
              - "Video: What is SRP? (15 min)"
              - "Reading: SRP in real codebases (30 min)"
              - "Interactive demo: Identify SRP violations (20 min)"
            practice:
              - "Challenge: Extract responsibilities from God Object"
              - "Challenge: Refactor UserManager to separate concerns"
            assessment:
              - "Quiz: SRP concepts (10 questions)"
          
          week_2:
            title: "Week 2: Open/Closed Principle"
            theory:
              - "Video: OCP explained (18 min)"
              - "Reading: Strategy Pattern for OCP (40 min)"
            practice:
              - "Challenge: Replace conditionals with polymorphism"
              - "Challenge: Extend behavior without modifying class"
            assessment:
              - "Quiz: OCP scenarios (12 questions)"
          
          weeks_3_5:
            title: "Weeks 3-5: LSP, ISP, DIP"
            description: "Similar structure for each principle"
          
          week_6:
            title: "Week 6: Final Project"
            project:
              - "Refactor real codebase module to follow all 5 SOLID principles"
              - "Write tests to verify adherence"
              - "Document design decisions"
              - "Peer review (2 peers)"
      
      - type: "time_breakdown"
        title: "Time Allocation (Per Week)"
        breakdown:
          - activity: "Video lessons"
            time: "1-2 hours"
            percentage: "20%"
          - activity: "Reading & demos"
            time: "2-3 hours"
            percentage: "30%"
          - activity: "Hands-on challenges"
            time: "3-4 hours"
            percentage: "40%"
          - activity: "Quizzes & reviews"
            time: "1 hour"
            percentage: "10%"

