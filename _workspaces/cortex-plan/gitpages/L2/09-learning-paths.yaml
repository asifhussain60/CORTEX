        title: "Path Completion Requirements"
        criteria:
          - requirement: "Complete all modules"
            weight: "Mandatory"
            description: "Watch videos, read materials, complete demos"
          
          - requirement: "Pass all quizzes"
            weight: "80%+ score"
            description: "Multiple attempts allowed"
          
          - requirement: "Complete 80% of challenges"
            weight: "Minimum"
            description: "At least 12 of 15 challenges"
          
          - requirement: "Final project approved"
            weight: "Mandatory"
            description: "Passes automated + peer review"
          
          - requirement: "Peer review participation"
            weight: "Mandatory"
            description: "Review 2 peers' projects"
      
      - type: "badge_system"
        title: "Earned Credentials"
        badges:
          - name: "Path Completion Badge"
            description: "Displayed on profile, shareable on LinkedIn"
            example: "🏆 SOLID Principles - Completed 2026-01-31"
          
          - name: "Skill Level Increase"
            description: "Automatic skill profile update"
            example: "Architecture: Beginner → Intermediate"
          
          - name: "Leaderboard Recognition"
            description: "Top 10% earners get featured"
          
          - name: "Certificate (PDF)"
            description: "Downloadable certificate with path details"

  personalization:
    title: "Personalized Learning Experience"
    icon: "🎨"
    content_blocks:
      - type: "adaptive_pacing"
        title: "Adaptive Learning Pace"
        description: |
          CORTEX adjusts difficulty and pacing based on your performance:
          - Struggling with concept? Extra examples and hints provided
          - Breezing through? Advanced challenges unlocked early
          - Prefer videos? More video content recommended
          - Prefer hands-on? Challenge-heavy path suggested
      
      - type: "personalization_features"
        features:
          - name: "Learning Style Detection"
            description: "Visual, auditory, kinesthetic — adapt content format"
          
          - name: "Time Commitment Flexibility"
            description: "Intensive (20h/week), Balanced (10h/week), Gradual (5h/week)"
          
          - name: "Skill Gap Focus"
            description: "Prioritize modules addressing biggest gaps"
          
          - name: "Career Goal Alignment"
            description: "Recommend paths matching target role"

  social_learning:
    title: "Learn with Others"
    icon: "👥"
    content_blocks:
      - type: "collaborative_features"
        title: "Social Learning Tools"
        features:
          - name: "Learning Circles"
            description: "Join cohorts of 4-6 learners starting same path"
            benefit: "Accountability, peer support, shared deadlines"
          
          - name: "Discussion Forums"
            description: "Path-specific forums for Q&A and tips"
            moderation: "Peer + CORTEX-assisted moderation"
          
          - name: "Peer Code Review"
            description: "Required for final projects, builds review skills"
            process: "Submit → 2 peers review → revise → approve"
          
          - name: "Study Groups"
            description: "Schedule virtual/in-person sessions"
            tools: "Video chat integration, screen sharing"
      
      - type: "mentorship_integration"
        title: "Mentorship Program"
        description: |
          Connect with experienced engineers who completed the path:
          - 1-on-1 mentorship (optional, paid or volunteer)
          - Office hours (group Q&A sessions)
          - AMA sessions with path creators
          - Guest lectures from industry experts

