# ============================================================================
# MERMAID DIAGRAMS (Minimum 2)
# ============================================================================

mermaid_diagrams:
  optimization_pipeline:
    type: "flowchart"
    title: "Token Optimization Pipeline"
    code: |
      flowchart TD
        A[Raw Request<br/>10K tokens] --> B{Semantic<br/>Chunking}
        B --> C[Relevance Scoring]
        C --> D{Cache Check}
        D -->|Hit 85%| E[Return Cached<br/>500 tokens]
        D -->|Miss 15%| F[RAG Retrieval]
        F --> G[Embedding Search]
        G --> H[Top-K Selection]
        H --> I[Context Assembly<br/>3K tokens]
        I --> J[LLM Processing]
        
        style A fill:#ef4444,color:#fff
        style E fill:#10b981,color:#fff
        style J fill:#10b981,color:#fff
        style D fill:#f59e0b,color:#000

  caching_architecture:
    type: "architecture"
    title: "Multi-Tier Caching Architecture"
    code: |
      graph TB
        subgraph L1[L1: In-Memory Cache]
          L1A[Recent Queries<br/>TTL: 5 min]
          L1B[Hot Embeddings<br/>LRU: 100 items]
        end
        
        subgraph L2[L2: Redis Cache]
          L2A[Session Context<br/>TTL: 1 hour]
          L2B[Vector Results<br/>TTL: 6 hours]
        end
        
        subgraph L3[L3: Vector DB]
          L3A[Knowledge Embeddings]
          L3B[Historical Context]
        end
        
        Request --> L1
        L1 -->|Miss| L2
        L2 -->|Miss| L3
        L3 --> Populate[Populate L2/L1]
        
        style L1 fill:#10b981,color:#fff
        style L2 fill:#06b6d4,color:#fff
        style L3 fill:#8b5cf6,color:#fff

  context_selection_sequence:
    type: "sequenceDiagram"
    title: "Intelligent Context Selection Flow"
    code: |
      sequenceDiagram
        participant User
        participant CORTEX
        participant SemanticChunker
        participant RAG
        participant VectorDB
        participant LLM
        
        User->>CORTEX: Request (10K tokens)
        CORTEX->>SemanticChunker: Chunk by semantic boundaries
        SemanticChunker-->>CORTEX: 20 chunks (avg 500 tokens)
        CORTEX->>RAG: Query relevance
        RAG->>VectorDB: Embedding search
        VectorDB-->>RAG: Top 5 chunks (similarity > 0.8)
        RAG-->>CORTEX: Relevant context (2.5K tokens)
        CORTEX->>LLM: Optimized request (3K tokens)
        LLM-->>CORTEX: Response
        CORTEX-->>User: Result + metadata

---
# ============================================================================
# CONTENT SECTIONS
# ============================================================================

sections:
  overview:
    title: "Why Token Optimization Matters"
    icon: "💡"
    content_blocks:
      - type: "business_case"
        title: "Business Impact"
        points:
          - "**70% Cost Reduction**: From $10K/month to $3K/month at 1M tokens/day"
          - "**3x Faster Responses**: Cache hits return in <100ms vs 2-3s LLM calls"
          - "**Improved Accuracy**: RAG retrieval ensures relevant context, reducing hallucinations"
          - "**Scalability**: Handle 10x traffic with same infrastructure through caching"
      
      - type: "technical_approach"
        title: "How CORTEX Optimizes"
        points:
          - "**Semantic Chunking**: Break input by meaning, not arbitrary limits"
          - "**Relevance Scoring**: ML-powered ranking of context importance"
          - "**Multi-Tier Caching**: L1 (memory) → L2 (Redis) → L3 (Vector DB)"
          - "**RAG Integration**: Vector search retrieves only relevant knowledge"
          - "**Context Compression**: Remove redundant information while preserving meaning"
      
      - type: "metrics"
        title: "Performance Metrics"
        stats:
          - label: "Average Token Reduction"
            value: "70%"
            description: "10K tokens → 3K tokens typical"
          - label: "Cache Hit Rate"
            value: "85%"
            description: "Most queries served from cache"
          - label: "Context Precision"
            value: "92%"
            description: "Relevance score accuracy"
          - label: "P95 Latency"
            value: "1.8s"
            description: "Including cache misses"

  semantic_chunking:
    title: "Semantic Chunking Engine"
    icon: "✂️"
    content_blocks:
      - type: "feature_explanation"
        title: "Intelligent Boundary Detection"
        description: |
          CORTEX chunks text by semantic boundaries (paragraphs, logical sections, 
          code blocks) rather than arbitrary character limits. This preserves context 
          and improves retrieval accuracy.
        
        implementation_highlights:
          - "AST-aware chunking for code files"
          - "Paragraph and section detection for docs"
          - "Overlap strategy: 10% overlap between chunks"
          - "Size limits: 200-800 tokens per chunk"
      
      - type: "code_example"
        language: "python"
        code: |
          # Example: Semantic chunking in action
          from cortex.brain.context.semantic_chunker import SemanticChunker
          
          chunker = SemanticChunker(
              chunk_size_range=(200, 800),
              overlap_pct=0.1,
              boundary_types=["paragraph", "code_block", "function"]
          )
          
          chunks = chunker.chunk_document(large_document)
          # Result: 25 chunks with clean semantic boundaries
          # vs 40 chunks with arbitrary splitting
      
      - type: "comparison_table"
        title: "Semantic vs Fixed Chunking"
        headers: ["Aspect", "Fixed (char count)", "Semantic (CORTEX)"]
        rows:
          - ["Accuracy", "70%", "92%"]
          - ["Context Preservation", "Medium", "High"]
          - ["Chunk Count", "40", "25"]
          - ["Avg Chunk Quality", "0.65", "0.88"]

  caching_strategy:
    title: "Multi-Tier Caching"
    icon: "⚡"
    content_blocks:
      - type: "architecture_explanation"
        title: "L1/L2/L3 Cache Hierarchy"
        description: |
          Three-tier caching strategy optimizes for speed (L1), scale (L2), 
          and long-term knowledge (L3).
        
        tiers:
          - name: "L1: In-Memory Cache"
            tech: "Python LRU Cache"
            ttl: "5 minutes"
            use_case: "Recent queries, hot embeddings"
            hit_rate: "60%"
            latency: "<10ms"
          
          - name: "L2: Redis Cache"
            tech: "Redis 7.x"
            ttl: "1-6 hours"
            use_case: "Session context, vector results"
            hit_rate: "25%"
            latency: "<50ms"
          
          - name: "L3: Vector Database"
            tech: "ChromaDB / Pinecone"
            ttl: "Permanent"
            use_case: "Knowledge base, embeddings"
            hit_rate: "15%"
            latency: "<200ms"
      
      - type: "decision_flowchart"
        title: "Cache Lookup Strategy"
        description: "How CORTEX decides which cache tier to use"

  rag_integration:
    title: "RAG-Powered Context Retrieval"
    icon: "🔍"
    content_blocks:
      - type: "feature_explanation"
        title: "Vector Search for Relevant Context"
        description: |
          RAG (Retrieval-Augmented Generation) finds the most relevant context 
          from knowledge base using embedding similarity search.
        
        workflow:
          - step: "Embed user query"
            description: "Convert query to 1536-dim vector (OpenAI ada-002)"
          - step: "Search vector DB"
            description: "Find top-K chunks with cosine similarity > 0.8"
          - step: "Rank by relevance"
            description: "Rerank using cross-encoder model"
          - step: "Assemble context"
            description: "Concatenate top 5-10 chunks (max 3K tokens)"
      
      - type: "metrics_dashboard"
        title: "RAG Performance Metrics"
        metrics:
          - name: "Retrieval Precision"
            value: "0.89"
            description: "% of retrieved chunks actually relevant"
          - name: "Retrieval Recall"
            value: "0.82"
            description: "% of relevant chunks retrieved"
          - name: "MRR (Mean Reciprocal Rank)"
            value: "0.76"
            description: "Quality of ranking"
          - name: "Avg Retrieval Time"
            value: "120ms"
            description: "Including embedding + search"

  cost_analysis:
    title: "Cost Breakdown & ROI"
    icon: "📊"
    content_blocks:
      - type: "cost_comparison"
        title: "Before vs After CORTEX"
        scenario: "1M tokens/day for 30 days"
        
        before_cortex:
          - item: "Raw LLM API calls"
            tokens: "30M tokens/month"
            cost: "$300"
            notes: "No optimization"
          - item: "Infrastructure"
            cost: "$50"
            notes: "Minimal"
          - total: "$350/month"
        
        after_cortex:
          - item: "Optimized LLM calls"
            tokens: "9M tokens/month"
            cost: "$90"
            notes: "70% reduction"
          - item: "Redis cache"
            cost: "$25"
            notes: "Cache tier"
          - item: "Vector DB"
            cost: "$40"
            notes: "ChromaDB hosted"
          - total: "$155/month"
        
        savings:
          monthly: "$195"
          annual: "$2,340"
          percentage: "56%"
      
      - type: "roi_calculator"
        title: "Interactive ROI Calculator"
        description: "Calculate your savings based on usage"
        inputs:
          - "Daily token volume"
          - "LLM API cost per 1K tokens"
          - "Expected cache hit rate"

  best_practices:
    title: "Optimization Best Practices"
    icon: "📋"
    content_blocks:
      - type: "checklist"
        title: "Implementation Guide"
        items:
          - text: "Enable semantic chunking for all documents"
            priority: "P0"
          - text: "Configure Redis for L2 caching"
            priority: "P0"
          - text: "Set appropriate TTLs per use case"
            priority: "P1"
          - text: "Monitor cache hit rates (target >80%)"
            priority: "P1"
          - text: "Fine-tune embedding model for domain"
            priority: "P2"
          - text: "Implement context compression for long documents"
            priority: "P2"
      
      - type: "troubleshooting"
        title: "Common Issues & Solutions"
        issues:
          - problem: "Low cache hit rate (<60%)"
            solution: "Increase TTL, check query variation, enable fuzzy matching"
          - problem: "High latency (>3s)"
            solution: "Scale Redis, optimize vector DB indexing, reduce chunk size"
          - problem: "Poor retrieval accuracy (<80%)"
            solution: "Retrain embeddings, adjust similarity threshold, use reranking"

