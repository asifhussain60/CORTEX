    name: "Cache Strategy Effectiveness"
    description: "Radar chart comparing L1/L2/L3 cache performance metrics"
    data_structure: |
      {
        "metrics": ["Hit Rate", "Speed", "Size Efficiency", "Cost Reduction", "Freshness", "Accuracy"],
