# ============================================================================
# CALL TO ACTION
# ============================================================================

cta_section:
  title: "Start Optimizing Today"
  description: "Enable token optimization in your CORTEX instance"
  
  quick_start:
    - step: "Configure cache tiers"
      command: "cortex config set cache.enabled=true"
    - step: "Enable semantic chunking"
      command: "cortex config set chunking.strategy=semantic"
    - step: "Set up Redis"
      command: "docker run -d -p 6379:6379 redis:7"
    - step: "Monitor savings"
      command: "cortex metrics tokens --period 7d"
  
  next_steps:
