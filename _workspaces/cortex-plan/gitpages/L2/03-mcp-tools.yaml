  tool_invocation_sequence:
    type: "sequenceDiagram"
    title: "MCP Tool Invocation Flow"
    source: |
      sequenceDiagram
        actor User
        participant Copilot
        participant MCP as MCP Gateway
        participant Auth as Auth Layer
        participant Router as Tool Router
        participant Tool as MCP Tool
        participant Orch as Orchestrator
        
        User->>Copilot: "/lens analyze src/"
        Copilot->>MCP: POST /tools/cortex_lens_analyze
        MCP->>Auth: Validate token
        Auth-->>MCP: ✅ Authorized
        MCP->>Router: Route to tool
        Router->>Tool: Execute with params
        Tool->>Orch: Invoke LENSOrchestrator
        Orch->>Orch: Execute analysis
        Orch-->>Tool: Results + evidence
        Tool-->>Router: Formatted response
        Router-->>MCP: JSON response
        MCP-->>Copilot: Tool output
        Copilot-->>User: Analysis complete 🎉

---
# ============================================================================
# CONTENT SECTIONS
# ============================================================================

content_sections:
  section_1_catalog:
    title: "🔌 Complete Tool Catalog"
    audience: ["Engineers"]
    layout: "glass-card grid with tool cards"
    content:
      tools:
        - name: "cortex_process_request"
          category: "Core"
          description: "Main entry point for challenge-driven request processing"
          orchestrator: "MasterOrchestrator"
          parameters:
            - "request: str"
            - "context: Optional[dict]"
          returns: "Evidence bundle with execution results"
          example: "/process implement user auth"
        
        - name: "cortex_lens_analyze"
          category: "Analysis"
          description: "Unified code intelligence: AST + Git + Security"
          orchestrator: "LENSOrchestrator"
          parameters:
            - "path: str"
            - "analyzers: List[str]"
          returns: "Comprehensive analysis report"
          example: "/lens analyze src/auth/"
        
        - name: "cortex_challenge"
          category: "Planning"
          description: "ARCH-003: Generate counter-proposals"
          orchestrator: "ChallengeEngine"
          parameters:
            - "proposal: str"
            - "context: dict"
          returns: "Counter-proposal with justification"
          example: "/challenge Add caching layer"
        
        - name: "cortex_total_recall"
          category: "Discovery"
          description: "Feature discovery and entry point location"
          orchestrator: "TotalRecallAgent"
          parameters:
            - "feature_name: str"
          returns: "Feature location + usage examples"
          example: "/recall TDD orchestrator"
        
        - name: "cortex_git_history"
          category: "Analysis"
          description: "Git commit analysis with blame tracking"
          orchestrator: "GitHistoryAnalyzer"
          parameters:
            - "repo_path: Path"
            - "since_hours: int"
          returns: "Commit history + hotspots"
          example: "/git history 24h"
        
        - name: "cortex_ast_analyze"
          category: "Analysis"
          description: "AST parsing with complexity metrics"
          orchestrator: "ASTAnalyzer"
          parameters:
            - "file_path: Path"
            - "detect_duplicates: bool"
          returns: "AST metrics + violations"
          example: "/ast analyze user_manager.py"
        
        - name: "cortex_detect_duplicates"
          category: "Quality"
          description: "CORE-035 duplicate code detection"
          orchestrator: "DuplicationDetector"
          parameters:
            - "paths: List[Path]"
            - "threshold: float"
          returns: "Duplicate blocks with similarity scores"
          example: "/duplicates src/"
        
        - name: "cortex_tools_catalog"
          category: "Discovery"
          description: "List all available MCP tools"
          orchestrator: "MCPToolsCatalog"
          parameters: []
          returns: "Tool list with descriptions"
          example: "/tools catalog"
  
  section_2_endpoints:
    title: "🌐 REST Endpoints"
    audience: ["Engineers"]
    layout: "glass-card with API reference"
    content:
      base_url: "http://localhost:8000"
      endpoints:
        - method: "GET"
          path: "/tools"
          description: "List all available MCP tools"
          response: |
            {
              "tools": [
                {
                  "name": "cortex_process_request",
                  "description": "...",
                  "parameters": {...},
                  "schema": {...}
                }
              ]
            }
        
        - method: "POST"
          path: "/tools/{tool_name}"
          description: "Execute specific MCP tool"
          request_body: |
            {
              "parameters": {
                "request": "implement feature",
                "context": {}
              }
            }
          response: |
            {
              "result": {...},
              "evidence": {...},
              "audit_id": "uuid"
            }
        
        - method: "GET"
          path: "/health"
          description: "Health check endpoint"
          response: |
            {
              "status": "healthy",
              "orchestrators": 23,
              "tools": 15,
              "uptime": "99.9%"
            }
        
        - method: "GET"
          path: "/metrics"
          description: "Prometheus metrics"
          response: "Prometheus text format"
  
  section_3_metrics:
    title: "📊 Observability"
    audience: ["Engineers", "Tech Leads"]
    layout: "glass-card with metrics dashboard"
    content:
      prometheus_metrics:
        - metric: "cortex_tool_invocations_total"
          type: "counter"
          description: "Total MCP tool invocations"
          labels: ["tool_name", "status"]
        
        - metric: "cortex_request_duration_seconds"
          type: "histogram"
          description: "Request latency distribution"
          buckets: [0.1, 0.5, 1.0, 2.0, 5.0]
        
        - metric: "cortex_orchestrator_count"
          type: "gauge"
          description: "Number of registered orchestrators"
        
        - metric: "cortex_active_requests"
          type: "gauge"
          description: "Currently executing requests"

---
*MCP Tools view - comprehensive API catalog with dependency visualization and observability metrics.*
