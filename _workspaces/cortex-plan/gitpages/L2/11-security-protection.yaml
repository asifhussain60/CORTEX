# ============================================================================
# MERMAID DIAGRAMS
# ============================================================================

mermaid_diagrams:
  rbac_enforcement:
    type: "flowchart"
    title: "RBAC Enforcement Flow"
    code: |
      flowchart TD
        A[User Request] --> B{Authenticated?}
        B -->|No| C[Return 401]
        B -->|Yes| D{Extract User Roles}
        D --> E{Check Required<br/>Permissions}
        E --> F{User Has<br/>Permission?}
        F -->|No| G[Return 403 Forbidden]
        F -->|Yes| H[Allow Access]
        G --> I[Log Denial Event]
        H --> J[Log Access Event]
        I --> K[Hash-Chain Audit]
        J --> K
        
        style A fill:#7b61ff,color:#fff
        style C fill:#ef4444,color:#fff
        style G fill:#ef4444,color:#fff
        style H fill:#10b981,color:#fff

  secrets_management:
    type: "sequenceDiagram"
    title: "Secrets Management Workflow"
    code: |
      sequenceDiagram
        participant App
        participant EnvLoader
        participant Vault as Secrets Vault
        participant Audit
        
        App->>EnvLoader: Request secret (DB_PASSWORD)
        EnvLoader->>EnvLoader: Check environment variable
        alt Secret in env
          EnvLoader-->>App: Return from env
        else Secret not in env
          EnvLoader->>Vault: Fetch from vault
          Vault-->>EnvLoader: Encrypted secret
          EnvLoader->>EnvLoader: Decrypt
          EnvLoader-->>App: Return secret
        end
        App->>Audit: Log secret access (NOT value)
        Note over Audit: AC_SECRET_ACCESS:<br/>user, secret_name, timestamp

  input_validation_layers:
    type: "mindmap"
    title: "Input Validation Layers"
    code: |
      mindmap
        root((Input<br/>Validation))
          Type Validation
            String length
            Numeric range
            Boolean type
            Array/Object structure
          Format Validation
            Email regex
            URL format
            Phone number
            Date/Time format
          Business Logic
            Unique constraints
            Foreign key checks
            State validation
          Security
            SQL injection patterns
            XSS payload detection
            Command injection
            Path traversal
          Sanitization
            HTML encode
            URL encode
            Strip dangerous chars
            Whitelist approach

