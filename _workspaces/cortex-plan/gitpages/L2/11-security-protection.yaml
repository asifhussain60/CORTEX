sections:
  rbac_overview:
    title: "Role-Based Access Control (RBAC)"
    icon: "👥"
    content_blocks:
      - type: "feature_explanation"
        title: "8 Built-In Roles, Unlimited Custom"
        description: |
          CORTEX RBAC enforces least-privilege access control through hierarchical 
          roles with inherited permissions.
        
        built_in_roles:
          - role: "System Admin"
            permissions: ["*"]
            description: "Full system access, user management, configuration"
          
          - role: "Security Admin"
            permissions: ["security.*", "audit.read", "compliance.*"]
            description: "Security configuration, audit review, compliance management"
          
          - role: "Developer"
            permissions: ["code.*", "test.*", "deploy.staging"]
            description: "Code access, testing, staging deployment"
          
          - role: "Senior Developer"
            permissions: ["...+", "deploy.production", "architecture.*"]
            description: "All developer permissions + production deployment + architecture decisions"
          
          - role: "Auditor"
            permissions: ["audit.read", "logs.read", "compliance.read"]
            description: "Read-only access to audit logs and compliance reports"
          
          - role: "Viewer"
            permissions: ["*.read"]
            description: "Read-only access to all resources"
          
          - role: "API User"
            permissions: ["api.execute"]
            description: "API access for integrations"
          
          - role: "Guest"
            permissions: ["docs.read"]
            description: "Documentation access only"
      
      - type: "implementation"
        title: "RBAC Implementation"
        code: |
          # cortex/security/rbac.py
          from functools import wraps
          from cortex.security.roles import RoleManager
          
          def require_permission(permission: str):
              """Decorator to enforce RBAC on functions"""
              def decorator(func):
                  @wraps(func)
                  def wrapper(*args, **kwargs):
                      user = get_current_user()
                      if not RoleManager.has_permission(user, permission):
                          audit_log.log_denial(user, permission)
                          raise PermissionDenied(f"Missing permission: {permission}")
                      
                      audit_log.log_access(user, permission)
                      return func(*args, **kwargs)
                  return wrapper
              return decorator
          
          # Usage
          @require_permission("deploy.production")
          def deploy_to_production(app_name: str):
              # Only users with deploy.production permission can execute
              ...

  input_validation:
    title: "Comprehensive Input Validation"
    icon: "✅"
    content_blocks:
      - type: "feature_explanation"
        title: "25+ Validators, Whitelist-First Approach"
        description: |
          Every input validated BEFORE processing. Whitelist approach (allow 
          known-good) preferred over blacklist (block known-bad).
        
        validation_categories:
          - category: "Type & Structure"
            validators: ["string_length", "numeric_range", "boolean_check", "array_validation", "object_schema"]
          
          - category: "Format"
            validators: ["email_regex", "url_format", "phone_number", "datetime_format", "uuid_validation"]
          
          - category: "Security"
            validators: ["sql_injection_pattern", "xss_payload_detection", "command_injection", "path_traversal", "ldap_injection"]
          
          - category: "Business Logic"
            validators: ["unique_constraint", "foreign_key_check", "state_validation", "rate_limit_check"]
      
      - type: "code_example"
        title: "Input Validation Example"
        code: |
          # cortex/security/validators.py
          from cortex.security.validation import validate_input, ValidationRule
          
          user_input_rules = [
              ValidationRule("email", type="email", required=True),
              ValidationRule("password", type="string", min_length=12, pattern=r"^(?=.*[A-Z])(?=.*[0-9]).*$"),
              ValidationRule("age", type="int", min=18, max=120),
              ValidationRule("bio", type="string", max_length=500, sanitize=True)
          ]
          
          @validate_input(user_input_rules)
          def create_user(email: str, password: str, age: int, bio: str):
              # All inputs validated before function executes
              # Invalid inputs raise ValidationError with details
              ...

  secrets_management:
    title: "Secrets Management via Environment Variables"
    icon: "🔐"
    content_blocks:
      - type: "feature_explanation"
        title: "Zero Hardcoded Secrets, 100% Encrypted at Rest"
        description: |
          All secrets (API keys, DB passwords, tokens) stored in environment 
          variables or secure vaults. NEVER hardcoded in codebase.
        
        best_practices:
          - "Use `.env` files locally (gitignored)"
          - "Use platform env vars in production (Heroku, AWS, Docker)"
          - "Rotate secrets regularly (30-90 days)"
          - "Encrypt `.env` files if committed (sops, git-crypt)"
          - "Audit secret access (log WHO accessed WHAT, not the value)"
      
      - type: "example"
        title: "Secrets Usage Pattern"
        code: |
          # ❌ BAD: Hardcoded secret
          db_password = "super_secret_123"
          
          # ✅ GOOD: Environment variable
          import os
          db_password = os.environ["DB_PASSWORD"]
          
          # ✅ BETTER: Secrets manager with fallback
          from cortex.security.secrets import get_secret
          db_password = get_secret("DB_PASSWORD", required=True)
          
          # ✅ BEST: Encrypted vault with audit
          from cortex.security.vault import SecureVault
          vault = SecureVault()
          db_password = vault.get("DB_PASSWORD", audit=True)

  audit_logging:
    title: "Hash-Chain Audit Logging"
    icon: "📝"
    content_blocks:
      - type: "feature_explanation"
        title: "Immutable Audit Trail for Governance Compliance"
        description: |
          Every security event logged with hash-chain integrity. Tampering 
          detection via cryptographic hashing of previous log entries.
        
        logged_events:
          - "Authentication attempts (success/failure)"
          - "RBAC permission checks (granted/denied)"
          - "Secret access (who, what, when — NOT the value)"
          - "Input validation failures"
          - "Configuration changes"
          - "Deployment events"
      
      - type: "hash_chain_explanation"
        title: "How Hash-Chain Works"
        steps:
          - step: "Log Entry 1"
            data: '{"event": "login", "user": "admin", "timestamp": "..."}'
            hash: "hash_1 = SHA256(data_1)"
          
          - step: "Log Entry 2"
            data: '{"event": "rbac_check", "result": "granted", "prev_hash": "hash_1"}'
            hash: "hash_2 = SHA256(data_2 + hash_1)"
          
          - step: "Log Entry 3"
            data: '{"event": "secret_access", "secret": "DB_PASSWORD", "prev_hash": "hash_2"}'
            hash: "hash_3 = SHA256(data_3 + hash_2)"
          
          - step: "Validation"
            description: "Recompute all hashes. If any hash doesn't match, chain is broken = tampering detected"
      
      - type: "code_example"
        title: "Audit Logging Implementation"
        code: |
          # cortex/governance/audit_logger.py
          import hashlib
          import json
          from datetime import datetime
          
          class AuditLogger:
              def __init__(self):
                  self.last_hash = "0" * 64  # Genesis hash
              
              def log(self, event_type: str, details: dict):
                  entry = {
                      "timestamp": datetime.utcnow().isoformat(),
                      "event_type": event_type,
                      "details": details,
                      "prev_hash": self.last_hash
                  }
                  
                  # Compute hash of this entry
                  entry_json = json.dumps(entry, sort_keys=True)
                  current_hash = hashlib.sha256(entry_json.encode()).hexdigest()
                  entry["hash"] = current_hash
                  
                  # Store entry (DB, file, etc.)
                  self.store(entry)
                  
                  # Update last hash for next entry
                  self.last_hash = current_hash
                  
                  return current_hash

  integration:
    title: "Integration with CORTEX Orchestrators"
    icon: "🔗"
    content_blocks:
      - type: "orchestrator_integration"
        description: "All orchestrators enforce protection by default"
        
        examples:
          - orchestrator: "TDDOrchestrator"
            protection: "Requires code.write permission to execute"
            audit: "Logs test execution attempts"
          
          - orchestrator: "DeploymentOrchestrator"
            protection: "deploy.production permission for prod deployments"
            audit: "Logs deployment events with hash-chain"
          
          - orchestrator: "SecurityOrchestrator"
            protection: "security.* permission to modify security config"
            audit: "Logs all security changes"

