d3_visualizations:
  tool_dependency_graph:
    type: "d3-force"
    name: "Tool Dependency Network"
    description: "Interactive force-directed graph showing tool relationships and dependencies"
    data_structure: |
      {
        "nodes": [
          {"id": "cortex_process_request", "category": "core", "calls_per_day": 500},
          {"id": "cortex_lens_analyze", "category": "analysis", "calls_per_day": 300},
          {"id": "cortex_git_history", "category": "git", "calls_per_day": 250},
          {"id": "cortex_ast_analyze", "category": "analysis", "calls_per_day": 200},
          {"id": "cortex_challenge", "category": "core", "calls_per_day": 180},
          {"id": "cortex_total_recall", "category": "discovery", "calls_per_day": 150}
        ],
        "links": [
          {"source": "cortex_process_request", "target": "cortex_lens_analyze", "strength": 0.8},
          {"source": "cortex_lens_analyze", "target": "cortex_git_history", "strength": 0.6},
          {"source": "cortex_lens_analyze", "target": "cortex_ast_analyze", "strength": 0.7},
          {"source": "cortex_process_request", "target": "cortex_challenge", "strength": 0.9}
        ],
        "categories": {
          "core": "#7b61ff",
          "analysis": "#06b6d4",
          "git": "#10b981",
          "discovery": "#8b5cf6"
        }
      }
    
    interactive_features:
      - "Drag nodes to reposition"
      - "Hover shows tool details (params, return type, usage)"
      - "Click to filter by category"
      - "Node size = call frequency"
      - "Edge thickness = dependency strength"
      - "Zoom and pan"
    
    unique_aspects:
      - "Real-time usage data from metrics"
      - "Highlight critical path tools"
      - "Show orphaned/unused tools"

  tool_usage_timeline:
    type: "d3-timeline"
    name: "Tool Invocation History (7 Days)"
    description: "Timeline showing tool usage patterns and peak times"
    data_structure: |
      {
        "timeline": [
          {"timestamp": "2026-01-25T09:00", "tool": "cortex_process_request", "count": 45},
          {"timestamp": "2026-01-25T10:00", "tool": "cortex_lens_analyze", "count": 32},
          {"timestamp": "2026-01-25T14:00", "tool": "cortex_git_history", "count": 28},
          {"timestamp": "2026-01-26T09:30", "tool": "cortex_challenge", "count": 25}
        ],
        "peak_hours": ["09:00-11:00", "14:00-16:00"],
        "total_invocations_7d": 8500
      }
    
    interactive_features:
      - "Brush to select time range"
      - "Hover shows tool + count"
      - "Group by hour/day/week"
      - "Overlay peak hours"

  tool_capability_radar:
    type: "d3-radar"
    name: "Tool Category Capabilities"
    description: "Radar chart comparing tool categories across key metrics"
    data_structure: |
      {
        "metrics": ["Speed", "Complexity", "Usage", "Stability", "Integration", "Documentation"],
        "categories": [
          {
            "name": "Core Tools",
            "values": [0.9, 0.8, 1.0, 0.95, 0.9, 1.0],
