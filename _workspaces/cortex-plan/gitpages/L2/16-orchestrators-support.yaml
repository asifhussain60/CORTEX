mermaid_diagrams:
  support_orchestrator_mindmap:
    type: "mindmap"
    title: "Support Orchestrators Categorized"
    code: |
      mindmap
        root((Support<br/>Orchestrators<br/>11 Total))
          User Experience
            OnboardingOrchestrator
              Tutorial Guidance
              Feature Discovery
            ToolDiscoveryOrchestrator
              Capability Enumeration
              Tool Catalog
          Lifecycle Management
            UpgradeOrchestrator
              Version Upgrade
