            RollbackOrchestrator
              Checkpoint Restore
              Error Recovery
            SetupOrchestrator
              Environment Setup
              Dependency Installation
          Governance & Security
            GovernanceRegistry
              Rule Management
              Tier0 Enforcement
            ChallengeEngine
              Hard Security Gates
              Threat Blocking
              Phase 8.3
          Knowledge & Advisory
            KnowledgeRepository
              45+ Knowledge YAMLs
              RAG Integration
              Relationship Mapping
            RecommendationEngine
              Security Recommendations
              SOLID Recommendations
              Phase 8.4
          Quality & Analysis
            DuplicationDetector
              Exact Duplication
              Semantic Duplication
              LENS Integration
              Phase 8.3A
          Session & Intent
            ComprehensionSession
              Session Management
              Comprehension Tracking
            FuzzyIntentMatcher
              Fuzzy Matching
              Intent Disambiguation
            DoRApprovalGate
              Approval Gating
              DoR Validation
          Testing Enhancement
            WrappedTDDOrchestrator
              Enhanced Testing
              TDD Wrapper

  challenge_engine_flow:
    type: "flowchart"
    title: "ChallengeEngine Security Gates (Phase 8.3)"
    code: |
      flowchart TD
        A[Operation Request] --> B[EnforcementOrchestrator]
        B --> C[ChallengeEngine]
        
        C --> D{Security<br/>Threat Level}
        
        D -->|LOW| E[✅ Allow]
        D -->|MEDIUM| F[Warning + Advisory]
        D -->|HIGH| G[❌ BLOCK]
        
        F --> H[RecommendationEngine]
        H --> I[Generate Fix Recommendations]
        I --> J{User<br/>Approves Fix?}
        
        J -->|Yes| K[Apply Fix]
        J -->|No| L[Document Exception]
        
        K --> M[Re-Validate]
        M --> N{Still<br/>High Risk?}
        
        N -->|Yes| G
        N -->|No| E
        
        G --> O[Report to Security Team]
        G --> P[Audit Log Entry]
        
        style C fill:#ef4444,color:#fff
        style E fill:#10b981,color:#fff
        style G fill:#ef4444,color:#fff
        style H fill:#8b5cf6,color:#fff
        style O fill:#f59e0b,color:#fff

  duplication_detection_sequence:
    type: "sequenceDiagram"
    title: "DuplicationDetector Workflow (Phase 8.3A)"
    code: |
      sequenceDiagram
        participant Dev as Developer
        participant CORTEX
        participant Duplication as DuplicationDetector
        participant Git as GitHistoryAnalyzer
        participant AST as ASTAnalyzer
        participant Report as DashboardGenerator
        
        Dev->>CORTEX: "Check for code duplication"
        CORTEX->>Duplication: Analyze codebase
        
        Duplication->>Git: Extract commit history
        Git-->>Duplication: File change patterns
        
        Duplication->>AST: Analyze code structure
        AST-->>Duplication: Function/class fingerprints
        
        Duplication->>Duplication: Exact match detection
        Duplication->>Duplication: Semantic similarity (embeddings)
        Duplication->>Duplication: Copy-paste pattern detection
        
        Duplication->>Duplication: Severity scoring
        
        Duplication->>Report: Generate dashboard
        Report-->>Duplication: HTML dashboard created
        
        Duplication-->>CORTEX: Duplication report
        CORTEX-->>Dev: Show duplications + consolidation suggestions

---
# ============================================================================
# CONTENT SECTIONS
# ============================================================================

sections:
  user_experience:
    title: "User Experience Orchestrators"
    icon: "👥"
    content_blocks:
      - type: "orchestrator_detail"
        name: "OnboardingOrchestrator"
        priority: 60
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.core.onboarding_orchestrator"
        
        description: |
          Guides new users through CORTEX onboarding. Provides tutorials, 
          feature discovery, and interactive walkthroughs.
        
        capabilities:
          - name: "User Onboarding"
            description: "Interactive tutorial system"
          - name: "Tutorial Guidance"
            description: "Step-by-step feature introduction"
        
        health_check:
          method: "start_onboarding"
          description: "Verifies onboarding pipeline"
      
      - type: "orchestrator_detail"
        name: "ToolDiscoveryOrchestrator"
        priority: 61
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.core.tool_discovery_orchestrator"
        
        description: |
          Enumerates available CORTEX tools and capabilities. Powers 
          'Total Recall' feature discovery.
        
        capabilities:
          - name: "Tool Discovery"
            description: "Enumerate 100+ MCP tools"
          - name: "Capability Enumeration"
            description: "Show what CORTEX can do"
        
        mcp_tools:
          - "cortex_total_recall"
          - "cortex_tools_catalog"
        
        health_check:
          method: "discover_tools"
          description: "Verifies tool enumeration"

  lifecycle_management:
    title: "Lifecycle Management Orchestrators"
    icon: "🔄"
    content_blocks:
      - type: "orchestrator_detail"
        name: "UpgradeOrchestrator"
        priority: 62
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.support.upgrade_orchestrator"
        
        description: |
          Handles CORTEX version upgrades and migrations. Checks compatibility, 
          runs migration scripts, validates upgrades.
        
        capabilities:
          - name: "Version Upgrade"
            description: "Seamless version transitions"
          - name: "Migration Assistance"
            description: "Automated migration scripts"
        
        health_check:
          method: "check_upgrade"
          description: "Verifies upgrade readiness"
      
      - type: "orchestrator_detail"
        name: "RollbackOrchestrator"
        priority: 63
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.support.rollback_orchestrator"
        
        description: |
          Rolls back failed operations to last known good state. Uses git 
          checkpoints and state snapshots.
        
        capabilities:
          - name: "Rollback Execution"
            description: "Revert to previous checkpoint"
          - name: "Checkpoint Restore"
            description: "Git-based state recovery"
        
        health_check:
          method: "check_rollback"
          description: "Verifies rollback capability"
      
      - type: "orchestrator_detail"
        name: "SetupOrchestrator"
        priority: 64
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.support.setup_orchestrator"
        
        description: |
          Automates CORTEX environment setup. Installs dependencies, configures 
          environment variables, validates setup.
        
        capabilities:
          - name: "Environment Setup"
            description: "Automated environment configuration"
          - name: "Dependency Installation"
            description: "Python packages + system dependencies"
        
        health_check:
          method: "check_setup"
          description: "Verifies setup completion"

  governance_security:
    title: "Governance & Security Orchestrators"
    icon: "🛡️"
    content_blocks:
      - type: "orchestrator_detail"
        name: "GovernanceRegistry"
        priority: 66
        tier: 3
        dependencies: []
        module: "cortex.brain.core.governance_registry"
        
        description: |
          Central registry for governance rules. Manages Tier 0/1/2/3 rules, 
          enforces CORE rules, provides rule lookup.
        
        capabilities:
          - name: "Governance Enforcement"
            description: "Tier 0-3 rule management"
          - name: "Rule Management"
            description: "CRUD operations on rules"
        
        health_check:
          method: "get_rules"
          description: "Verifies rule registry access"
      
      - type: "orchestrator_detail"
        name: "ChallengeEngine"
        priority: 71
        tier: 3
        dependencies: ["EnforcementOrchestrator"]
        module: "cortex.orchestrators.core.challenge_engine"
        phase: "8.3"
        
        description: |
          Hard security gates preventing critical vulnerabilities. Blocks 
          high-severity threats (CWE-89, 94, 78, etc.) before code generation.
        
        capabilities:
          - name: "Hard Security Gates"
            description: "BLOCKS critical threats"
          - name: "Threat Blocking"
            description: "No bypass - immutable enforcement"
          - name: "Challenge Enforcement"
            description: "Forces user to address threats"
        
        health_check:
          method: "evaluate_threat"
          description: "Verifies threat evaluation"
        
        blocked_threats:
          - "CWE-89: SQL Injection"
          - "CWE-94: Code Injection"
          - "CWE-78: Command Injection"
          - "CWE-327: Weak Cryptography"
          - "CWE-22: Path Traversal"
          - "CWE-95: Eval Injection"

  knowledge_advisory:
    title: "Knowledge & Advisory Orchestrators"
    icon: "📚"
    content_blocks:
      - type: "orchestrator_detail"
        name: "KnowledgeRepository"
        priority: 67
        tier: 3
        dependencies: []
        module: "cortex.brain.core.knowledge.knowledge_repository"
        
        description: |
          Manages 45+ knowledge YAMLs covering industry standards. Provides 
          RAG retrieval, relationship mapping, and compliance evidence.
        
        capabilities:
          - name: "Knowledge Retrieval"
            description: "RAG-powered knowledge lookup"
          - name: "Relationship Mapping"
            description: "Maps dependencies between standards"
        
        health_check:
          method: "query_knowledge"
          description: "Verifies knowledge base access"
        
        knowledge_domains:
          - "Security (OWASP, STRIDE, CWE)"
          - "Architecture (SOLID, Clean Code, 12-Factor)"
          - "Testing (TDD, BDD, Property-Based)"
          - "Deployment (AWS, Azure, GCP best practices)"
          - "Compliance (SOC2, GDPR, HIPAA)"
      
      - type: "orchestrator_detail"
        name: "RecommendationEngine"
        priority: 72
        tier: 3
        dependencies: ["ChallengeEngine"]
        module: "cortex.orchestrators.support.recommendation_engine"
        phase: "8.4"
        
        description: |
          Advisory layer providing contextualized best practice recommendations. 
          Works with ChallengeEngine to suggest fixes for security threats.
        
        capabilities:
          - name: "Security Recommendations"
            description: "Fix suggestions for security issues"
          - name: "SOLID Recommendations"
            description: "Architecture improvement suggestions"
          - name: "Performance Recommendations"
            description: "Optimization suggestions"
          - name: "Compliance Recommendations"
            description: "Standards compliance guidance"
        
        mcp_tools:
          - "cortex_recommend (advisory mode)"
        
        health_check:
          method: "recommend_for_security"
          description: "Verifies recommendation generation"

  quality_analysis:
    title: "Quality & Analysis Orchestrators"
    icon: "🔍"
    content_blocks:
      - type: "orchestrator_detail"
        name: "DuplicationDetector"
        priority: 74
        tier: 3
        dependencies: []
        module: "cortex.orchestrators.support.duplication_detector_orchestrator"
        phase: "8.3A"
        
        description: |
          Detects code duplications using LENS analyzers. Finds exact matches, 
          semantic similarities, and copy-paste patterns. Enforces CORE-035.
        
        capabilities:
          - name: "Exact Duplication Detection"
            description: "Byte-for-byte code matches"
          - name: "Semantic Duplication Detection"
            description: "Similar logic with different syntax"
          - name: "Copy-Paste Pattern Detection"
            description: "Detects developer copy-paste behavior"
          - name: "Severity Scoring"
            description: "Ranks duplications by impact"
          - name: "Consolidation Suggestions"
            description: "Recommends Extract Method/Class refactorings"
        
        health_check:
          method: "generate_duplication_report"
          description: "Verifies duplication detection"
        
        lens_analyzers_used:
          - "GitHistoryAnalyzer (copy-paste patterns)"
          - "ASTAnalyzer (structural similarity)"
          - "CommentExtractor (intent similarity)"

  session_intent:
    title: "Session & Intent Management Orchestrators"
    icon: "💬"
    content_blocks:
      - type: "orchestrator_detail"
        name: "ComprehensionSession"
        priority: 70
        tier: 3
        dependencies: ["InteractionOrchestrator"]
        module: "cortex.orchestrators.core.comprehension_session"
        
        description: |
          Manages comprehension session state across multiple turns. Tracks 
          conversation history and context.
        
        capabilities:
          - name: "Session Management"
            description: "Multi-turn session state"
          - name: "Comprehension Tracking"
            description: "Track understanding progress"
        
        health_check:
          method: "get_session"
          description: "Verifies session retrieval"
      
      - type: "orchestrator_detail"
        name: "FuzzyIntentMatcher"
        priority: 69
        tier: 3
        dependencies: ["IntentRouter"]
        module: "cortex.orchestrators.core.fuzzy_intent_matcher"
        
        description: |
          Handles ambiguous intents with fuzzy matching. Improves intent 
          classification accuracy for unclear requests.
        
        capabilities:
          - name: "Fuzzy Matching"
            description: "Levenshtein distance + semantic similarity"
          - name: "Intent Disambiguation"
            description: "Clarifying questions for ambiguous intents"
        
        health_check:
          method: "match_intent"
          description: "Verifies fuzzy matching"
      
      - type: "orchestrator_detail"
        name: "DoRApprovalGate"
        priority: 73
        tier: 3
        dependencies: ["LENSSynthesis"]
        module: "cortex.orchestrators.core.dor_approval_gate"
        
        description: |
          Approval gate for Definition of Ready. Waits for user confirmation 
          before proceeding with execution.
        
        capabilities:
          - name: "Approval Gating"
            description: "Blocks until 'proceed' / 'yes' / 'approve'"
          - name: "DoR Validation"
            description: "Validates DoR completeness"
        
        health_check:
          method: "validate_dor"
          description: "Verifies DoR validation"

  testing_enhancement:
    title: "Testing Enhancement Orchestrators"
    icon: "✅"
    content_blocks:
      - type: "orchestrator_detail"
        name: "WrappedTDDOrchestrator"
        priority: 68
        tier: 3
        dependencies: ["TDDOrchestrator"]
        module: "cortex.orchestrators.core.wrapped_tdd_orchestrator"
        
        description: |
          Enhanced TDD wrapper providing additional testing capabilities. 
          Wraps core TDDOrchestrator with extra features.
        
        capabilities:
          - name: "Wrapped TDD"
            description: "Enhanced TDD workflow"
          - name: "Enhanced Testing"
            description: "Additional test generation strategies"
        
        health_check:
          method: "generate_wrapped_tests"
          description: "Verifies wrapped test generation"

  wiring_configuration:
    title: "Wiring Configuration"
    icon: "🔌"
    content_blocks:
      - type: "yaml_reference"
        title: "Support Orchestrators in wiring.yaml"
        file: "cortex/wiring/specifications/wiring.yaml"
        excerpt: |
          orchestrators:
            support:
              - name: "OnboardingOrchestrator"
                priority: 60
              - name: "ToolDiscoveryOrchestrator"
                priority: 61
              - name: "UpgradeOrchestrator"
                priority: 62
              - name: "RollbackOrchestrator"
                priority: 63
              - name: "SetupOrchestrator"
                priority: 64
              - name: "GovernanceRegistry"
                priority: 66
              - name: "KnowledgeRepository"
                priority: 67
              - name: "WrappedTDDOrchestrator"
