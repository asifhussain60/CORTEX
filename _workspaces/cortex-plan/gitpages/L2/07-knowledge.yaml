          PERFORMANCE/
            ├── optimization-techniques.yaml    # General optimization
            ├── caching-strategies.yaml         # Cache patterns
            └── profiling-analysis.yaml         # Profiling tools
          
          COMPLIANCE/
            ├── soc2-controls.yaml              # SOC2 Type II
            ├── gdpr-requirements.yaml          # GDPR compliance
            ├── pci-dss-requirements.yaml       # PCI-DSS
            ├── hipaa-safeguards.yaml           # HIPAA
            └── iso27001-controls.yaml          # ISO27001
      
      - type: "yaml_structure"
        title: "Knowledge YAML Schema"
        example: |
          # Example: solid-principles.yaml
          standard:
            name: "SOLID Principles"
            source: "Robert C. Martin (Uncle Bob)"
            version: "2021"
            category: "architecture"
          
          principles:
            - id: "SRP"
              name: "Single Responsibility Principle"
              description: "A class should have one, and only one, reason to change"
              
              rules:
                - "Each class addresses a specific concern"
                - "High cohesion within class"
                - "Low coupling between classes"
              
              violations:
                - pattern: "class.*Manager"
                  reason: "'Manager' suffix often indicates SRP violation"
                  fix: "Split into Repository + Service + Validator"
                
                - pattern: "God Object"
                  reason: "Class with >10 public methods likely violates SRP"
                  fix: "Extract cohesive subsets into separate classes"
              
              examples:
                - good: |
                    class UserRepository:
                        def save(self, user): ...
                        def find_by_id(self, id): ...
                    
                    class UserValidator:
                        def validate(self, user): ...
                
                - bad: |
                    class UserManager:  # SRP violation
                        def save(self, user): ...
                        def validate(self, user): ...
                        def send_email(self, user): ...
                        def log_activity(self, user): ...

  rag_integration:
    title: "RAG-Powered Knowledge Retrieval"
    icon: "🔍"
    content_blocks:
      - type: "feature_explanation"
        title: "Vector Search for Standards"
        description: |
          CORTEX embeds all knowledge YAMLs into vector database. When you ask 
          a question, relevant sections retrieved via semantic search in <150ms.
        
        workflow:
          - step: "Offline Indexing"
            description: "All YAMLs chunked → embedded → stored in ChromaDB"
            frequency: "On YAML change (Git hook)"
          
          - step: "Query Embedding"
            description: "User query → OpenAI ada-002 → 1536-dim vector"
            latency: "<50ms"
          
          - step: "Vector Search"
            description: "Cosine similarity search → Top-K chunks (K=10)"
            latency: "<80ms"
          
          - step: "Reranking"
            description: "Cross-encoder model reranks by relevance"
            latency: "<20ms"
          
          - step: "Context Assembly"
            description: "Extract full sections from Top-5 chunks"
            latency: "<10ms"
      
      - type: "code_example"
        language: "python"
        title: "RAG Retrieval Example"
        code: |
          # cortex/brain/knowledge/rag_retriever.py
          from cortex.brain.knowledge.vector_store import VectorStore
          
          class RAGRetriever:
              def __init__(self):
                  self.vector_store = VectorStore(collection="knowledge_base")
              
              def retrieve(self, query: str, top_k: int = 5) -> list[dict]:
                  """Retrieve relevant knowledge sections"""
                  # 1. Embed query
                  query_vector = self.embed(query)
                  
                  # 2. Vector search
                  results = self.vector_store.search(
                      query_vector=query_vector,
                      top_k=top_k * 2,  # Over-retrieve for reranking
                      similarity_threshold=0.7
                  )
                  
                  # 3. Rerank
                  reranked = self.rerank(query, results)
                  
                  # 4. Return top-K with metadata
                  return [
                      {
                          "yaml_path": r["metadata"]["path"],
                          "section": r["metadata"]["section"],
                          "content": r["text"],
                          "similarity": r["score"],
                          "citation": f"{r['metadata']['path']} lines {r['metadata']['lines']}"
                      }
                      for r in reranked[:top_k]
                  ]

  standards_enforcement:
    title: "Runtime Standards Enforcement"
    icon: "⚖️"
    content_blocks:
      - type: "feature_explanation"
        title: "ARCH-012: Industry Standards Gate"
        description: |
          Every orchestrator checks recommendations against knowledge base 
          BEFORE execution. Non-compliant solutions rejected with fix suggestions.
        
        enforcement_points:
          - stage: "Request Analysis"
            check: "Classify domain (architecture, security, testing, etc.)"
            action: "Load relevant knowledge YAMLs"
          
          - stage: "Solution Generation"
            check: "Query RAG for applicable standards"
            action: "Inject standards context into orchestrator"
          
          - stage: "Validation"
            check: "Compare proposed solution against standards"
            action: "Score compliance (0.0-1.0)"
          
          - stage: "Gate Decision"
            check: "Compliance score >= 0.8?"
            action: "PROCEED if pass, BLOCK + suggest fix if fail"
      
      - type: "example_scenario"
        title: "Standards Enforcement in Action"
        scenario: |
          **User Request:** "Create a password validation function"
          
          **1. Domain Classification:**
          - Primary: Security
          - Secondary: Architecture (function design)
          
          **2. Knowledge Retrieval:**
          - SECURITY/secure-coding-practices.yaml § cryptography
          - SECURITY/owasp-top-10.yaml § A02:2021 Cryptographic Failures
          - SECURITY/cwe_327_weak_crypto.yaml
          
          **3. Standards Check:**
          - ✅ Use bcrypt/Argon2 (not MD5/SHA1)
          - ✅ Parameterized queries (prevent SQLi)
          - ✅ Input validation (whitelist approach)
          - ❌ User proposed plain text storage → BLOCKED
          
          **4. Counter-Proposal:**
          ```python
          # Standards-compliant implementation
          import bcrypt
          
          def validate_and_hash_password(password: str) -> dict:
              # Input validation (OWASP)
              if len(password) < 12:
                  return {"valid": False, "error": "Min 12 chars"}
              
              # Hash with bcrypt (CWE-327 compliant)
              salt = bcrypt.gensalt(rounds=12)
              hashed = bcrypt.hashpw(password.encode(), salt)
              
              return {"valid": True, "hash": hashed}
          ```
          
          **5. Citations:**
          - SECURITY/secure-coding-practices.yaml lines 200-250
          - SECURITY/cwe_327_weak_crypto.yaml lines 45-89
          - SECURITY/owasp-top-10.yaml lines 120-145

  compliance_evidence:
