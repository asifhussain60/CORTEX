  secure_coding_practices:
    title: "Secure Coding Practices Enforcement"
    icon: "🔒"
    content_blocks:
      - type: "feature_explanation"
        title: "45+ Knowledge YAMLs Inform Every Decision"
        description: |
          Every CORTEX recommendation backed by industry standards from 
          45+ knowledge YAMLs. Security standards enforced at runtime via 
          ARCH-012 gate.
        
        enforcement_mechanism:
          - stage: "Design Time"
            action: "CORTEX Architect queries knowledge base"
            result: "Counter-proposals include YAML citations"
          
          - stage: "Implementation"
            action: "TDD Orchestrator validates against secure-coding practices"
            result: "Generated code follows standards"
          
          - stage: "Review"
            action: "RefactoringOrchestrator checks for violations"
            result: "Automated refactoring to comply"
          
          - stage: "Deployment"
            action: "EnforcementOrchestrator runs compliance checks"
            result: "Block deployment if violations detected"
      
      - type: "code_example"
        title: "Secure Coding in Action"
        code: |
          # Example: CORTEX generates authentication code
          # Query knowledge base first
          from cortex.brain.knowledge.rag_retriever import RAGRetriever
          
          rag = RAGRetriever()
          standards = rag.retrieve(
              query="authentication best practices",
              top_k=5
          )
          # Returns:
          # - SECURITY/secure-coding-practices.yaml § authentication
          # - SECURITY/owasp-top-10.yaml § A07
          # - SECURITY/api-security-checklist.yaml § auth
          
          # Generated code follows all standards:
          import bcrypt
          from cortex.security.auth import require_auth, rate_limit
          from cortex.security.validation import validate_input
          
          @require_auth  # OWASP A07: Authentication
          @rate_limit(max_attempts=5, window=900)  # OWASP A07: Rate limiting
          @validate_input([
              ("email", "email", True),
              ("password", "string", True, {"min_length": 12})
          ])  # Input validation
          def login(email: str, password: str) -> dict:
              """
              Secure login implementation following:
              - SECURITY/secure-coding-practices.yaml lines 200-250
              - SECURITY/owasp-top-10.yaml lines 350-400
              """
              user = User.query.filter_by(email=email).first()
              if not user:
                  return {"error": "Invalid credentials"}, 401
              
              # Constant-time comparison (timing attack prevention)
              if not bcrypt.checkpw(password.encode(), user.password_hash):
                  audit_log.log_failed_login(email)
                  return {"error": "Invalid credentials"}, 401
              
              # Generate session token
              token = generate_jwt(user.id, expiry=1800)  # 30 min
              audit_log.log_successful_login(user.id)
              
              return {"token": token}, 200

  parameterized_queries:
    title: "Parameterized Queries (100% Coverage)"
    icon: "🛡️"
    content_blocks:
      - type: "feature_explanation"
        title: "Zero SQL Injection Vulnerabilities"
        description: |
          ALL database queries in CORTEX use parameterized queries. 
          String concatenation in SQL = automatic violation detected via AST.
        
        enforcement:
          - "Pre-commit hook scans for SQL injection patterns"
          - "AST analyzer detects f-strings in execute() calls"
          - "Code review checklist includes parameterized query verification"
          - "Production deployment gate blocks non-parameterized queries"
      
      - type: "code_examples"
        title: "Parameterized Query Patterns"
        examples:
          - database: "SQLite/PostgreSQL (psycopg2)"
            bad: |
              # ❌ VULNERABLE (string formatting)
              user_id = request.GET.get('id')
              query = f"SELECT * FROM users WHERE id = {user_id}"
              cursor.execute(query)
            good: |
              # ✅ SAFE (parameterized)
              user_id = request.GET.get('id')
              query = "SELECT * FROM users WHERE id = ?"
              cursor.execute(query, (user_id,))
          
          - database: "MySQL (mysql-connector)"
            bad: |
              # ❌ VULNERABLE
              name = request.POST.get('name')
              query = f"INSERT INTO users (name) VALUES ('{name}')"
            good: |
              # ✅ SAFE
              name = request.POST.get('name')
              query = "INSERT INTO users (name) VALUES (%s)"
              cursor.execute(query, (name,))
          
          - database: "SQLAlchemy ORM"
            bad: |
              # ❌ VULNERABLE (raw SQL)
              search = request.GET.get('search')
              users = db.session.execute(f"SELECT * FROM users WHERE name LIKE '%{search}%'")
            good: |
              # ✅ SAFE (ORM query)
              search = request.GET.get('search')
              users = User.query.filter(User.name.like(f'%{search}%')).all()
              # ORM handles parameterization automatically

  output_encoding:
    title: "Output Encoding Standards"
    icon: "🔤"
    content_blocks:
      - type: "feature_explanation"
        title: "Context-Aware Output Encoding"
        description: |
          All user-generated content encoded before output. Encoding strategy 
          depends on context: HTML, URL, JavaScript, CSS.
        
        encoding_contexts:
          - context: "HTML Body"
            threat: "XSS via HTML injection"
            encoding: "HTML entity encoding"
            example: '< becomes &lt;, > becomes &gt;'
          
          - context: "HTML Attributes"
            threat: "XSS via attribute injection"
            encoding: "Attribute encoding + quotes"
            example: '" becomes &quot;, \' becomes &#x27;'
          
          - context: "JavaScript"
            threat: "XSS via JS injection"
            encoding: "JavaScript encoding"
            example: "' becomes \\', \n becomes \\n"
          
          - context: "URL Parameters"
            threat: "Open redirect, XSS"
            encoding: "URL encoding"
            example: "space becomes %20, & becomes %26"
          
          - context: "CSS"
            threat: "CSS injection"
            encoding: "CSS encoding"
            example: "< becomes \\3c"
      
      - type: "code_example"
        title: "Output Encoding Implementation"
        code: |
          # cortex/security/encoding.py
          import html
          import urllib.parse
          
          class OutputEncoder:
              @staticmethod
              def html_encode(text: str) -> str:
                  """Encode for HTML body context"""
                  return html.escape(text, quote=True)
              
              @staticmethod
              def attribute_encode(text: str) -> str:
                  """Encode for HTML attribute context"""
                  # More aggressive than html_encode
                  return html.escape(text, quote=True).replace("'", "&#x27;")
              
              @staticmethod
              def url_encode(text: str) -> str:
                  """Encode for URL parameter context"""
                  return urllib.parse.quote_plus(text)
              
              @staticmethod
              def js_encode(text: str) -> str:
                  """Encode for JavaScript string context"""
                  return (text.replace("\\", "\\\\")
                              .replace("'", "\\'")
                              .replace('"', '\\"')
                              .replace("\n", "\\n")
                              .replace("\r", "\\r"))
          
          # Usage in template rendering
          from jinja2 import Environment, select_autoescape
          
          env = Environment(
              autoescape=select_autoescape(['html', 'xml']),
              # Automatically encodes {{ user_input }} in templates
          )

