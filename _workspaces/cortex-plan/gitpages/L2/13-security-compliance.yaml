mermaid_diagrams:
  owasp_top10_overview:
    type: "mindmap"
    title: "OWASP Top 10 2021 Categories"
    code: |
      mindmap
        root((OWASP<br/>Top 10<br/>2021))
          A01 Broken Access Control
            Missing auth checks
            CORS misconfiguration
            Force browsing
            Mitigation: RBAC + ABAC
          A02 Cryptographic Failures
            Weak algorithms
            Hardcoded keys
            No TLS
            Mitigation: TLS 1.3 + Strong algos
          A03 Injection
            SQL injection
            NoSQL injection
            Command injection
            Mitigation: Parameterized queries
          A04 Insecure Design
            Missing security controls
            No threat modeling
            Mitigation: Secure SDLC + STRIDE
          A05 Security Misconfiguration
            Default credentials
            Unnecessary features
            Verbose errors
            Mitigation: Hardening + Least privilege
          A06 Vulnerable Components
            Outdated libraries
            Unpatched dependencies
            Mitigation: Dependency scanning + Updates
          A07 Authentication Failures
            Weak passwords
            No MFA
            Session fixation
            Mitigation: Strong auth + MFA + Rate limiting
          A08 Data Integrity Failures
            Insecure deserialization
            No integrity checks
            Mitigation: Digital signatures + Validation
          A09 Logging Failures
            No audit logs
            Logs not monitored
            Mitigation: Centralized logging + SIEM
          A10 SSRF
            Server-side request forgery
            Unvalidated URLs
            Mitigation: Whitelist + Network segmentation

  compliance_validation_flow:
    type: "flowchart"
    title: "Compliance Validation Pipeline"
    code: |
      flowchart TD
        A[Code Change] --> B[Pre-Commit Hook]
        B --> C{Run Compliance<br/>Checks}
        
        C --> D[OWASP Validation]
        C --> E[Secure Coding Check]
        C --> F[Output Encoding Check]
        C --> G[Parameterized Query Check]
        
        D --> H{All Checks<br/>Pass?}
        E --> H
        F --> H
        G --> H
        
        H -->|Yes| I[✅ Commit Allowed]
        H -->|No| J[❌ Block Commit]
        
        J --> K[Generate Report]
        K --> L[Show Violations<br/>+ Fix Suggestions]
        L --> M[Developer Fixes]
        M --> B
        
        I --> N[CI/CD Pipeline]
        N --> O[Full Security Scan]
        O --> P{Production<br/>Ready?}
        P -->|Yes| Q[Deploy]
        P -->|No| R[Block Deployment]
        
        style I fill:#10b981,color:#fff
        style Q fill:#10b981,color:#fff
        style J fill:#ef4444,color:#fff
        style R fill:#ef4444,color:#fff

  knowledge_yaml_integration:
    type: "sequenceDiagram"
    title: "Knowledge YAML Integration at Runtime"
    code: |
      sequenceDiagram
        participant Dev as Developer
        participant CORTEX
        participant KB as Knowledge Base
        participant RAG
        participant Validator
        
        Dev->>CORTEX: "Implement authentication"
        CORTEX->>KB: Query security domain
        KB-->>CORTEX: Load OWASP, secure-coding YAMLs
        
        CORTEX->>RAG: Retrieve relevant sections
        RAG->>KB: Vector search "authentication"
        KB-->>RAG: Top-K sections (OWASP A07, secure-coding §auth)
        RAG-->>CORTEX: Context with citations
        
        CORTEX->>CORTEX: Generate implementation
        CORTEX->>Validator: Validate against standards
        
        Validator->>KB: Check OWASP A07 compliance
        Validator->>KB: Check secure-coding practices
        Validator->>KB: Check parameterized queries
        
        alt Standards compliant
          Validator-->>CORTEX: ✅ Approved
          CORTEX-->>Dev: Implementation + tests + citations
        else Violations found
          Validator-->>CORTEX: ❌ Violations list
          CORTEX-->>Dev: Fix recommendations + YAML references
        end

