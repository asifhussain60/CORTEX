      - "Test all internal navigation after reorder"
      
  risk_2_role_gateway:
    description: "Users may not self-identify with a single role"
    severity: "MEDIUM"
    likelihood: "HIGH"
    mitigation:
      - "Add 'View All Features' fallback link"
      - "Allow exploration without role selection"
      - "Make role gateway optional (not mandatory)"
