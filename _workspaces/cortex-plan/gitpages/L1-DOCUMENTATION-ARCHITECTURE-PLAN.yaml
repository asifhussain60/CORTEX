# ============================================================================
# LEVEL 4 PROPOSAL: ROLE-SPECIFIC DETAIL PAGES
# ============================================================================

level_4_architecture:
  proposal: "Introduce L4 as role-specific deep-dive pages"
  
  hierarchy_definition:
    level_0: "Landing page (docs/index.html) - All audiences"
    level_1: "Section landing pages (docs/{section}/index.html) - Topic-focused"
    level_2: "Detail pages (docs/{section}/{page}.html) - Deep technical content"
    level_3_proposed: "Role-specific landing pages (docs/for-{role}/index.html) - Audience segmentation"
    level_4_proposed: "Role-specific detail pages (docs/for-{role}/{feature}.html) - Tailored explanations"
    
  rationale:
    - "Current L1/L2 assumes technical audience (developers)"
    - "Leadership needs high-level benefits, not implementation details"
    - "Product Owners need workflow focus, not code examples"
    - "Engineers need deep technical content (current L2 is perfect)"
    
  implementation:
    structure: |
      docs/
      ├── index.html                          # L0: Landing (all audiences)
      ├── for-leadership/                     # L3: Leadership view
      │   ├── index.html                      # Curated tiles for leadership
      │   ├── governance.html                 # L4: How governance reduces risk
      │   ├── velocity-metrics.html           # L4: Delivery acceleration proof
      │   ├── cost-savings.html              # L4: Token optimization ROI
      │   └── compliance.html                # L4: Security & audit compliance
      ├── for-product/                        # L3: Product Owner view
      │   ├── index.html                      # Curated tiles for POs
      │   ├── sprint-planning.html           # L4: Sprint workflow with CORTEX
      │   ├── ado-integration.html           # L4: Azure DevOps sync
      │   ├── evidence-bundles.html          # L4: Proof of completion
      │   └── velocity-tracking.html         # L4: Team metrics
      ├── for-engineers/                      # L3: Engineer view
      │   ├── index.html                      # Curated tiles for devs
      │   ├── tdd-workflow.html              # L4: RED→GREEN→REFACTOR guide
      │   ├── lens-tutorial.html             # L4: Code intelligence usage
      │   ├── vision-api-guide.html          # L4: Screenshot analysis
      │   └── refactoring-patterns.html      # L4: Automated refactoring
      ├── architecture/                       # L1: Technical architecture
      │   ├── index.html                      # 300px logo, D3.js viz
      │   └── four-tier-brain.html           # L2: Deep dive
      └── orchestrators/                      # L1: Orchestrators hub
          ├── index.html                      # 300px logo, constellation viz
          └── master-orchestrator.html       # L2: Implementation details
    
    content_strategy:
      leadership_pages:
        tone: "Executive summary, business value, ROI-focused"
        format: "Metrics, charts, case studies, compliance proof"
        avoid: "Code examples, technical jargon, implementation details"
        
      product_pages:
        tone: "Workflow-oriented, practical, tool-focused"
        format: "Step-by-step guides, integrations, templates"
        avoid: "Deep architecture, code samples (unless workflow-relevant)"
        
      engineer_pages:
        tone: "Technical, implementation-focused, example-driven"
        format: "Code samples, API references, tutorials"
        avoid: "Business justification (already sold on value)"
        
    shared_components:
      reusable_across_l3_l4:
        - "Multi-panel sections (Security, Orchestrators, STS)"
        - "Feature tiles (filtered by role relevance)"
        - "Key Features Grid (subset based on role)"
        - "Quick Links footer"
        - "Glassmorphism design system"
        
  recommendation: "APPROVED - Implement L3 role-specific landing pages FIRST, then add L4 detail pages iteratively"

