# ENH-033: CORTEX Brain Activity Verification in AUDIT Mode
# Version: 1.0
# Created: 2026-02-05
# Status: PLANNED
# Priority: P1 (Infrastructure)
# Effort: M (2 days, 18 tests)

metadata:
  enhancement_id: ENH-033
  title: "Brain Activity Verification in AUDIT Mode"
  created_date: "2026-02-05"
  author: "Asif Hussain"
  status: PLANNED
  priority: P1
  estimated_effort_days: 2
  estimated_test_count: 18
  source: "User challenge validated via chat01.md DIGEST analysis"
  related_enhancements:
    - ENH-027  # Component Integration Verification (CIV)
    - ENH-032  # Response Format Governance

problem_statement:
  summary: |
    AUDIT mode lacks verification that CORTEX brain subsystems (KnowledgeRepository,
    DomainBrain, EnhancedAuditLogger, LENS synthesis) are actively operating and
    persisting data as designed. Brain subsystems could be dormant while orchestrators
    run, degrading system from "intelligent orchestration" to "dumb task execution".
  
  user_hypothesis: |
    "Audit mode should verify persistence is actively engaged and CORTEX is using
    all designed brain functionalities with audit logging utilization as neurons."
  
  validation_result: "✅ HYPOTHESIS VALIDATED"
  
  evidence:
    - "KnowledgeRepository exists (cortex/brain/core/knowledge/knowledge_repository.py:1-671)"
    - "EnhancedAuditLogger exists (cortex/infrastructure/enhanced_audit_logger.py:1-306)"
    - "Sparse cortex_brain references in orchestrators (20 matches, concern identified)"
    - "No P1 AUDIT check verifies brain activity (cortex-architect.prompt.md:360-380)"
    - "Audit trail = neurons metaphor accurate (AC_START→AC_COMPLETE = neural activity)"
  
  impact_if_dormant:
    knowledge_repository:
      issue: "Orchestrators ignore best practices YAMLs"
      consequence: "Decisions lack domain expertise, lower quality recommendations"
    enhanced_audit_logger:
      issue: "No AC_START→AC_COMPLETE logging"
      consequence: "Compliance failure, no governance trace, CORE-027 violation"
    domain_brain:
      issue: "No persistence layer writes"
      consequence: "Knowledge lost across sessions, no learning retention"
    lens_synthesis:
      issue: "Orchestrators skip synthesis phase"
      consequence: "Lower quality analysis, miss integration insights"

architecture:
  new_components:
    - name: "BrainActivityVerifier"
      type: "Orchestrator"
      path: "cortex/orchestrators/support/brain_activity_verifier.py"
      purpose: "Implements 4-layer brain activity validation"
      dependencies:
        - "KnowledgeRepository"
        - "EnhancedAuditLogger"
        - "cortex_brain/state/*.db (file system)"
        - "cortex_brain/domain/*.db (file system)"
    
    - name: "BrainActivityVerifierTests"
      type: "Test Suite"
      path: "tests/unit/orchestrators/support/test_brain_activity_verifier.py"
      coverage_target: "90%"
      test_count: 18

  modified_components:
    - name: "cortex-architect.prompt.md"
      path: ".github/prompts/cortex-architect.prompt.md"
      section: "P1 — Infrastructure"
      change: "Add Brain Activity Verification check (6 sub-checks)"
    
    - name: "cortex-auditor.md"
      path: ".github/agents/core/cortex-auditor.md"
      section: "Audit Checklist → P1 Infrastructure"
      change: "Add brain activity detection logic"
    
    - name: "wiring.yaml"
      path: "cortex/wiring/specifications/wiring.yaml"
      section: "orchestrators.support"
      change: "Wire BrainActivityVerifier orchestrator"

four_layer_validation:
  layer_1_subsystem_existence:
    purpose: "Verify brain subsystem classes are importable and instantiable"
    checks:
      - check: "KnowledgeRepository class import"
        method: "try: from cortex.brain.core.knowledge.knowledge_repository import KnowledgeRepository"
        success: "Class imports without error"
        failure: "ImportError → CRITICAL (brain subsystem missing)"
      
      - check: "EnhancedAuditLogger class import"
        method: "try: from cortex.infrastructure.enhanced_audit_logger import EnhancedAuditLogger"
        success: "Class imports without error"
        failure: "ImportError → CRITICAL (audit logger missing)"
      
      - check: "DomainBrain classes import"
        method: "try: import cortex_brain.domain"
        success: "Module imports without error"
        failure: "ImportError → WARNING (domain brain optional)"
    
    tool: "Python import test + grep_search"
    test_count: 3
  
  layer_2_persistence_health:
    purpose: "Verify brain database files exist and are being written to"
    checks:
      - check: "cortex_brain/state/ databases exist"
        method: "Path('cortex_brain/state').glob('*.db')"
        success: "1+ database files found"
        failure: "No databases → CRITICAL (no persistence)"
      
      - check: "Database write activity <24h"
        method: "Check mtime of cortex_brain/state/*.db files"
        success: "At least 1 file modified within 24 hours"
        failure: "All files stale → WARNING (dormant persistence)"
      
      - check: "Domain brain databases active"
        method: "Check cortex_brain/domain/*.db write timestamps"
        success: "Files modified within 7 days"
        failure: "Stale domain knowledge → WARNING"
    
    tool: "file_search + os.path.getmtime() checks"
    test_count: 3
  
  layer_3_audit_trail_activity:
    purpose: "Verify EnhancedAuditLogger is actively logging AC_START→AC_COMPLETE cycles"
    checks:
      - check: "AC_START pattern detection"
        method: "grep_search for 'AC_START' in orchestrator code"
        success: "Pattern found in 5+ orchestrators"
        failure: "Sparse usage → WARNING (audit trail underutilized)"
      
      - check: "AC_START↔AC_COMPLETE pairing"
        method: "Query governance.db for unpaired AC_START entries"
        success: "95%+ pairing rate in last 7 days"
        failure: "Broken chains → CRITICAL (compliance violation)"
      
      - check: "Hash chain integrity"
        method: "Verify entry_hash references previous_hash correctly"
        success: "No hash chain breaks"
        failure: "Tampering detected → CRITICAL"
    
    tool: "grep_search + SQLite queries + cortex_audit_trail_verify"
    test_count: 4
  
  layer_4_knowledge_repository_usage:
    purpose: "Verify orchestrators are calling KnowledgeRepository methods"
    checks:
      - check: "KnowledgeRepository.get_by_domain() usage"
        method: "grep_search for 'get_by_domain' in cortex/orchestrators/**/*.py"
        success: "Found in 3+ orchestrators"
        failure: "Sparse usage → WARNING (best practices unused)"
      
      - check: "KnowledgeRepository.query() usage"
        method: "grep_search for '.query(' in orchestrator code"
        success: "Found in 2+ orchestrators"
        failure: "Unused → WARNING"
      
      - check: "LENS synthesis invocation"
        method: "grep_search for 'synthesis' or 'Language.*Examination.*Navigation.*Synthesis'"
        success: "Pattern detected in orchestrator flows"
        failure: "Missing → WARNING (synthesis layer dormant)"
    
    tool: "grep_search + pattern detection"
    test_count: 4

  layer_5_synthesis_layer_verification:
    purpose: "Verify LENS synthesis (Language→Examination→Navigation→Synthesis) is invoked"
    checks:
      - check: "LENSSynthesis orchestrator wired"
        method: "Check wiring.yaml for LENSSynthesis entry"
        success: "Orchestrator registered"
        failure: "Missing → CRITICAL (synthesis unavailable)"
      
      - check: "Synthesis method invocations"
        method: "grep_search for '_synthesize' or 'synthesis(' in orchestrators"
        success: "Pattern found in 3+ orchestrators"
        failure: "Sparse usage → WARNING"
    
    tool: "grep_search + wiring.yaml inspection"
    test_count: 2

  layer_6_comprehensive_health_report:
    purpose: "Aggregate all layer results into actionable health report"
    output_format:
      subsystem_status:
        - "KnowledgeRepository: [ACTIVE|DORMANT|MISSING]"
        - "EnhancedAuditLogger: [ACTIVE|DORMANT|MISSING]"
        - "DomainBrain: [ACTIVE|DORMANT|MISSING]"
        - "LENS Synthesis: [ACTIVE|DORMANT|MISSING]"
      
      neuron_activity:
        - "AC_START→AC_COMPLETE cycles/day: {count}"
        - "Audit trail pairing rate: {percentage}%"
        - "Hash chain integrity: [INTACT|BROKEN]"
      
      persistence_health:
        - "State DB writes <24h: {true|false}"
        - "Domain DB writes <7d: {true|false}"
        - "Total persistence size: {MB}"
      
      usage_patterns:
        - "Orchestrators using KnowledgeRepository: {count}/28"
        - "Orchestrators invoking synthesis: {count}/28"
      
      overall_verdict:
        - "HEALTHY: All subsystems active, neurons firing, persistence current"
        - "DEGRADED: Some subsystems dormant, needs attention"
        - "CRITICAL: Core subsystems missing or broken"
    
    test_count: 2

implementation_phases:
  phase_1_detection_logic:
    duration_days: 1
    tasks:
      - task: "Create BrainActivityVerifier orchestrator"
        file: "cortex/orchestrators/support/brain_activity_verifier.py"
        lines_of_code: 450
        components:
          - "Layer 1: Subsystem existence checks"
          - "Layer 2: Persistence health checks"
          - "Layer 3: Audit trail activity checks"
          - "Layer 4: Knowledge repository usage checks"
          - "Layer 5: Synthesis layer verification"
          - "Layer 6: Health report aggregation"
      
      - task: "Implement 4-layer validation methods"
        methods:
          - "check_subsystem_existence() -> Dict[str, bool]"
          - "check_persistence_health() -> Dict[str, Any]"
          - "check_audit_trail_activity() -> Dict[str, Any]"
          - "check_knowledge_usage() -> Dict[str, int]"
          - "check_synthesis_invocation() -> Dict[str, Any]"
          - "generate_health_report() -> BrainHealthReport"
      
      - task: "Write comprehensive tests"
        file: "tests/unit/orchestrators/support/test_brain_activity_verifier.py"
        test_count: 12
        coverage_target: "90%"
    
    deliverables:
      - "BrainActivityVerifier orchestrator (450 LOC)"
      - "12 unit tests passing"
      - "Type hints + docstrings (CORE-011, CORE-012)"
  
  phase_2_audit_integration:
    duration_days: 0.5
    tasks:
      - task: "Add P1 check to cortex-architect.prompt.md"
        file: ".github/prompts/cortex-architect.prompt.md"
        section: "P1 — Infrastructure"
        change_type: "INSERT_AFTER: Orchestrator Badge System check"
        content: |
          | **Brain Activity Verification** | **6-layer validation: subsystem existence, persistence health, audit trail activity, knowledge usage, synthesis invocation, health report** | **BrainActivityVerifier orchestrator (MANDATORY)** |
      
      - task: "Add brain activity detection to cortex-auditor.md"
        file: ".github/agents/core/cortex-auditor.md"
        section: "Audit Checklist → P1 Infrastructure"
        change_type: "APPEND"
        content: |
          ### Brain Activity Verification
          
          **Purpose:** Verify CORTEX brain subsystems (KnowledgeRepository, EnhancedAuditLogger, 
          DomainBrain, LENS synthesis) are actively operating and persisting data.
          
          **Checks:**
          1. Subsystem existence (imports work)
          2. Persistence health (databases written to <24h)
          3. Audit trail activity (AC_START→AC_COMPLETE pairing)
          4. Knowledge repository usage (orchestrators calling methods)
          5. Synthesis invocation (LENS synthesis active)
          6. Health report generation
          
          **Tool:** BrainActivityVerifier orchestrator
          
          **Output:**
          - HEALTHY: All subsystems active ✅
          - DEGRADED: Some dormant ⚠️
          - CRITICAL: Missing/broken 🔴
      
      - task: "Wire BrainActivityVerifier in wiring.yaml"
        file: "cortex/wiring/specifications/wiring.yaml"
        section: "orchestrators.support"
        entry:
          name: "BrainActivityVerifier"
          module: "cortex.orchestrators.support.brain_activity_verifier"
          class: "BrainActivityVerifier"
          tier: 3
          priority: 82
          dependencies: []
          capabilities:
            - brain_activity_monitoring
            - subsystem_health_checks
            - audit_trail_verification
            - persistence_validation
          health_check: "execute_verification"
          description: "Verifies CORTEX brain subsystems are active and persisting data (ENH-033)"
          metadata:
            icon: "🧠"
            stages: 1
            intelligence: []
      
      - task: "Write integration tests"
        file: "tests/unit/orchestrators/support/test_brain_activity_verifier.py"
        test_count: 6
        test_types:
          - "Test AUDIT mode invocation"
          - "Test health report format"
          - "Test threshold detection (DEGRADED vs CRITICAL)"
    
    deliverables:
      - "cortex-architect.prompt.md updated (P1 check added)"
      - "cortex-auditor.md updated (detection logic)"
      - "wiring.yaml updated (orchestrator wired)"
      - "6 integration tests passing"
  
  phase_3_alerting_thresholds:
    duration_days: 0.5
    tasks:
      - task: "Define health thresholds"
        thresholds:
          critical:
            - "KnowledgeRepository import fails"
            - "EnhancedAuditLogger import fails"
            - "No databases in cortex_brain/state/"
            - "Audit trail pairing <80%"
            - "Hash chain broken"
          
          degraded:
            - "Database writes stale (>24h for state, >7d for domain)"
            - "KnowledgeRepository usage <3 orchestrators"
            - "Synthesis invocation sparse (<3 orchestrators)"
            - "Audit trail pairing 80-95%"
          
          healthy:
            - "All imports work"
            - "Databases exist and current (<24h state, <7d domain)"
            - "Audit trail pairing >95%"
            - "Knowledge usage in 3+ orchestrators"
            - "Synthesis active in 3+ orchestrators"
      
      - task: "Implement auto-fix suggestions"
        suggestions:
          knowledge_repository_unused:
            issue: "KnowledgeRepository.get_by_domain() not called"
            suggestion: "Add domain lookup in orchestrator initialization"
            example: |
              # In orchestrator __init__:
              self.knowledge_repo = KnowledgeRepository()
              self.security_knowledge = self.knowledge_repo.get_by_domain("SECURITY")
          
          audit_trail_missing:
            issue: "No AC_START→AC_COMPLETE logging"
            suggestion: "Add audit logger to orchestrator"
            example: |
              # Before operation:
              audit_logger.log_operation_start(ac_id="OP-001", operation="ORCHESTRATE")
              # After operation:
              audit_logger.log_operation_complete(ac_id="OP-001", status="SUCCESS")
          
          synthesis_skipped:
            issue: "LENS synthesis not invoked"
            suggestion: "Add synthesis phase to orchestrator flow"
            example: |
              # After Navigation phase:
              synthesis_result = self._synthesize_recommendations(navigation_data)
      
      - task: "Write alerting tests"
        file: "tests/unit/orchestrators/support/test_brain_activity_verifier.py"
        test_count: 0  # Already covered in previous phases
    
    deliverables:
      - "Threshold definitions documented"
      - "Auto-fix suggestions implemented"
      - "Health report includes actionable recommendations"

testing_strategy:
  test_breakdown:
    layer_1_tests:
      - "test_knowledge_repository_import_success"
      - "test_knowledge_repository_import_failure"
      - "test_enhanced_audit_logger_import_success"
    
    layer_2_tests:
