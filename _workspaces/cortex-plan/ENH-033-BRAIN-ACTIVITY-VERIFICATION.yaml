    - "Mock import system (test failure scenarios)"

audit_mode_integration:
  execution_order:
    - step: 1
      action: "Run VacuumOrchestrator (P3 cleanup)"
    - step: 2
      action: "Run P0 checks (Security, Stubs, Broken Code)"
    - step: 3
      action: "Run P1 checks (Infrastructure)"
    - step: 4
      action: "**NEW: Run BrainActivityVerifier**"
      output: "Brain health report appended to P1 summary"
    - step: 5
      action: "Run P2 checks (Quality)"
  
  output_format:
    location: "After P1 Infrastructure table"
    format: |
      ### 🧠 Brain Activity Verification
      
      | Subsystem | Status | Details |
      |-----------|--------|---------|
      | **KnowledgeRepository** | ✅ ACTIVE | Used by 5/28 orchestrators |
      | **EnhancedAuditLogger** | ✅ ACTIVE | 127 AC cycles/day, 98% pairing |
      | **DomainBrain** | ⚠️ DEGRADED | Last write 4 days ago |
      | **LENS Synthesis** | ✅ ACTIVE | Invoked by 8/28 orchestrators |
      
      **Persistence Health:**
      - State DB: ✅ Written <24h (governance.db: 2h ago)
      - Domain DB: ⚠️ Written 4d ago (cortex_brain/domain/knowledge.db)
      
      **Neuron Activity (Audit Trail):**
      - AC_START→AC_COMPLETE: 98% pairing (127 cycles/day)
      - Hash chain: ✅ INTACT
      
      **Overall Verdict:** ⚠️ DEGRADED (Domain brain stale, needs attention)
      
      **Recommendations:**
      1. Investigate domain brain write stagnation (last activity 4d ago)
      2. Increase KnowledgeRepository usage (5/28 = 18% adoption)
      3. Consider periodic domain knowledge refresh job

