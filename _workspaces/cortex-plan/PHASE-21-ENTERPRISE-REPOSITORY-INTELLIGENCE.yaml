# ============================================================================
# HIGH-VALUE SEQUENCE DIAGRAMS
# ============================================================================

sequence_diagrams:
  description: "Key workflows visualized as Mermaid sequence diagrams"
  purpose: "Shown in Architecture tab, Use Cases tab, and documentation"
  
  diagrams:
    user_onboarding_flow:
      title: "User Discovers Repository via Dashboard"
      participants:
        - "User"
        - "index.html (Landing)"
        - "registry.sqlite"
        - "dashboard.html"
        - "dashboard.sqlite"
      flow: |
        sequenceDiagram
            participant U as User
            participant I as index.html
            participant R as registry.sqlite (sql.js)
            participant D as dashboard.html
            participant DB as dashboard.sqlite (sql.js)
            
            U->>I: Visit http://localhost:8080
            I->>R: Load registry.sqlite
            R-->>I: Repository list
            I->>I: Render tiles (glassmorphism cards)
            U->>I: Click "CORTEX" tile
            I->>D: Navigate to ?repo=cortex
            D->>DB: Fetch /repos/cortex/dashboard.sqlite
            DB-->>D: SQLite file loaded
            D->>DB: SELECT * FROM repo_summary
            DB-->>D: Overview data
            D->>D: Render Overview tab
            U->>D: Click "Use Cases" tab
            D->>DB: SELECT * FROM use_cases LIMIT 20
            DB-->>D: Paginated use cases
            D->>D: Render table with pagination
      
    repository_analysis_pipeline:
      title: "Repository Onboarding via MCP Tool"
      participants:
        - "User (VSCode)"
        - "MCP Gateway"
        - "RepositoryOnboardingOrchestrator"
        - "LENS Crawlers"
        - "LLM (Copilot)"
        - "SQLiteDataGenerator"
      flow: |
        sequenceDiagram
            participant U as User (VSCode)
            participant M as MCP Gateway
            participant O as RepositoryOnboardingOrchestrator
            participant L as LENS Crawlers
            participant LLM as LLM (Copilot)
            participant S as SQLiteDataGenerator
            participant DB as dashboard.sqlite
            
            U->>M: cortex_onboard_repository(path, name)
            M->>O: Orchestrate onboarding
            O->>L: Run all analyzers (AST, Git, Security)
            L-->>O: Raw metrics, patterns, vulnerabilities
            O->>LLM: Generate business language
            LLM-->>O: Overview, use cases, insights
            O->>S: Aggregate data + create SQLite
            S->>DB: CREATE TABLE repo_summary, use_cases, ...
            S->>DB: INSERT INTO ... (raw data)
            S->>DB: CREATE VIEW executive_kpis
            S->>DB: CREATE VIRTUAL TABLE ... USING fts5
            S-->>O: dashboard.sqlite created
            O->>M: Update registry.sqlite
            M-->>U: Onboarding complete (slug: cortex)
            U->>U: Open dashboard in browser
      
    search_query_execution:
      title: "User Searches for 'authentication' in Use Cases"
      participants:
        - "User"
        - "SearchBar.js"
        - "SQLiteDataLayer.js"
        - "dashboard.sqlite"
        - "DataTable.js"
      flow: |
        sequenceDiagram
            participant U as User
            participant S as SearchBar.js
            participant Q as SQLiteDataLayer.js
            participant DB as dashboard.sqlite (sql.js)
            participant T as DataTable.js
            
            U->>S: Type "authentication"
            S->>S: Debounce 300ms
            S->>Q: search('authentication', 'use_cases')
            Q->>DB: SELECT * FROM use_cases_fts WHERE use_cases_fts MATCH 'authentication'
            DB-->>Q: Results (5 rows)
            Q-->>S: Search results
            S->>T: Update table
            T->>T: Render rows with highlight
            U->>T: Click row to expand
            T->>Q: getUseCaseById(42)
            Q->>DB: SELECT * FROM use_cases WHERE id = 42
            DB-->>Q: Full use case data
            Q-->>T: Use case detail
            T->>T: Render expanded row
      
    drill_down_navigation:
      title: "Engineer Explores Code from Overview to File Detail"
      participants:
        - "Engineer"
        - "Overview Tab"
        - "Code Explorer Tab"
        - "SQLiteDataLayer.js"
        - "Modal Dialog"
      flow: |
        sequenceDiagram
            participant E as Engineer
            participant O as Overview Tab
            participant C as Code Explorer Tab
            participant Q as SQLiteDataLayer.js
            participant M as Modal Dialog
            
            E->>O: View file structure tree
            E->>O: Click "src/" folder
            O->>Q: SELECT * FROM files WHERE parent_path = 'src/'
            Q-->>O: Files in src/
            O->>O: Expand tree node
            E->>O: Click "Code Explorer" tab
            O->>C: Switch tab
            C->>Q: SELECT * FROM files WHERE file_type = 'folder' AND parent_path = '/'
            Q-->>C: Root folders
            C->>C: Render tree
            E->>C: Click "src" > "core" > "auth.py"
            C->>Q: SELECT * FROM files WHERE file_path = 'src/core/auth.py'
            Q-->>C: File metadata (LOC, complexity, churn)
            C->>C: Render file card
            E->>C: Click "View Code" button
            C->>Q: SELECT * FROM code_snippets WHERE file_path = 'src/core/auth.py'
            Q-->>C: Code snippet
            C->>M: Open modal with code
            M->>M: Prism.js syntax highlight
            M-->>E: Display highlighted code
      
    pagination_workflow:
      title: "User Navigates 500 Use Cases with Pagination"
      participants:
        - "User"
        - "Pagination.js"
        - "SQLiteDataLayer.js"
        - "dashboard.sqlite"
      flow: |
        sequenceDiagram
            participant U as User
            participant P as Pagination.js
            participant Q as SQLiteDataLayer.js
            participant DB as dashboard.sqlite
            
            U->>P: Load Use Cases tab
            P->>Q: getUseCases(page=1, pageSize=20)
            Q->>DB: SELECT * FROM use_cases LIMIT 20 OFFSET 0
            DB-->>Q: Rows 1-20
            Q->>DB: SELECT COUNT(*) FROM use_cases
            DB-->>Q: Total: 500
            Q-->>P: {rows: [...], total: 500}
            P->>P: Render "Page 1 of 25"
            U->>P: Click "Page 5"
            P->>Q: getUseCases(page=5, pageSize=20)
            Q->>DB: SELECT * FROM use_cases LIMIT 20 OFFSET 80
            DB-->>Q: Rows 81-100
            Q-->>P: {rows: [...], total: 500}
            P->>P: Render "Page 5 of 25"
            P->>P: Highlight active page button
      
    scalability_migration:
      title: "Migrate from Local sql.js to Enterprise PostgreSQL"
      participants:
        - "Admin"
        - "Migration Script"
        - "dashboard.sqlite"
        - "PostgreSQL"
        - "API Server"
      flow: |
        sequenceDiagram
            participant A as Admin
            participant M as Migration Script
            participant S as dashboard.sqlite
            participant P as PostgreSQL
            participant API as API Server (FastAPI)
            
            A->>M: Run migration.py --to-postgres
            M->>S: Load all .sqlite files
            loop For each repository
                M->>S: Read tables
                S-->>M: All data
                M->>P: CREATE SCHEMA {repo_slug}
                M->>P: INSERT INTO {repo_slug}.use_cases ...
                M->>P: CREATE INDEX ...
            end
            M-->>A: Migration complete
            A->>API: Deploy API server
            A->>A: Update dashboard.html config
            Note over API: SQLiteDataLayer.js now calls API
            A->>A: Test dashboard
            A->>API: GET /api/repos/cortex/use_cases?page=1
            API->>P: SELECT * FROM cortex.use_cases LIMIT 20
            P-->>API: Results
            API-->>A: JSON response
            Note over A: Same SQL queries, different backend

