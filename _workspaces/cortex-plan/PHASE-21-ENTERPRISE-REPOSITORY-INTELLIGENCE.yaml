# ============================================================================
# SQLITE DATA LAYER (sql.js WASM Architecture)
# ============================================================================

sqlite_data_layer:
  rationale:
    problem: "JSON files lack native pagination, search, filtering; require external libraries"
    solution: "SQLite via sql.js (WASM) provides all data operations natively"
    benefits:
      - "Single data solution scales from local (sql.js) to enterprise (PostgreSQL)"
      - "Native pagination: LIMIT/OFFSET eliminates custom logic"
      - "Full-text search: FTS5 replaces Fuse.js"
      - "Indexes for performance on large datasets"
      - "Views for computed data (executive summaries, refactoring suggestions)"
      - "Transactions for data integrity"
      - "Browser-compatible (runs in any modern browser via WASM)"
      - "Single file per repo (2-20MB typical, handles GB+ efficiently)"
    
  database_separation:
    principle: "SOLID Separation of Concerns"
    databases:
      cortex_internal:
        file: "cortex/data/cortex.db"
        purpose: "CORTEX internal operations"
        tables:
          - "audit_logs (CORE-027 compliance)"
          - "wiring_registry (orchestrator config)"
          - "governance_violations (enforcement tracking)"
          - "mcp_tool_invocations (usage metrics)"
        access: "Python only (SQLAlchemy ORM)"
        isolation: "Never accessed by dashboard"
        
      dashboard_registry:
        file: "company/dashboards/registry.sqlite"
        purpose: "Repository registry for landing page"
        tables:
          - "repositories (slug, name, description, health_score, last_updated)"
          - "quick_metrics (per-repo summary stats)"
        access: "Browser via sql.js"
        size: "<1MB for 100+ repos"
        
      per_repo_dashboard:
        file: "company/dashboards/repos/{slug}/dashboard.sqlite"
        purpose: "Complete repository intelligence data"
        tables: "See schema below"
        access: "Browser via sql.js"
        size: "2-20MB typical, efficient for GB+ repos"
        
    no_shared_state: "Each database is independent, no foreign keys across boundaries"
    
  schema_v3_sqlite:
    description: "SQLite schema for dashboard.sqlite (per repository)"
    tables:
      repo_summary:
        purpose: "Overview tab — high-level repository metadata"
        columns:
          - "id INTEGER PRIMARY KEY"
          - "repo_name TEXT NOT NULL"
          - "repo_slug TEXT NOT NULL UNIQUE"
          - "description TEXT"
          - "primary_language TEXT"
          - "tech_stack TEXT (JSON array)"
          - "total_loc INTEGER"
          - "file_count INTEGER"
          - "contributor_count INTEGER"
          - "health_score INTEGER (0-100)"
          - "last_commit_date TEXT (ISO8601)"
          - "created_at TEXT (ISO8601)"
          - "llm_overview TEXT (LLM-generated summary)"
        indexes:
          - "CREATE INDEX idx_slug ON repo_summary(repo_slug)"
          
      use_cases:
        purpose: "Use Cases tab — business capabilities (PAGINATED)"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "title TEXT NOT NULL"
          - "category TEXT (e.g., 'Authentication', 'Payment')"
          - "business_value TEXT (LLM-generated)"
          - "user_stories TEXT (JSON array)"
          - "acceptance_criteria TEXT (JSON array)"
          - "priority TEXT (low|medium|high|critical)"
          - "implementation_status TEXT (implemented|partial|planned)"
          - "related_files TEXT (JSON array of file paths)"
          - "created_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_category ON use_cases(category)"
          - "CREATE INDEX idx_priority ON use_cases(priority)"
        fts:
          - "CREATE VIRTUAL TABLE use_cases_fts USING fts5(title, business_value, content=use_cases)"
        note: "Full-text search for 'show me authentication use cases'"
        
      metrics_summary:
        purpose: "Metrics tab — aggregate code metrics"
        columns:
          - "id INTEGER PRIMARY KEY"
          - "total_loc INTEGER"
          - "code_loc INTEGER (excluding comments/blanks)"
          - "comment_loc INTEGER"
          - "avg_complexity REAL"
          - "max_complexity INTEGER"
          - "maintainability_index REAL (0-100)"
          - "technical_debt_hours INTEGER"
          - "calculated_at TEXT (ISO8601)"
          
      metrics_by_file:
        purpose: "Metrics drill-down — per-file metrics"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "file_path TEXT NOT NULL"
          - "language TEXT"
          - "loc INTEGER"
          - "complexity INTEGER"
          - "maintainability REAL"
          - "churn_count INTEGER (commits in last 30d)"
          - "last_modified TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_file_path ON metrics_by_file(file_path)"
          - "CREATE INDEX idx_complexity ON metrics_by_file(complexity DESC)"
          
      vulnerabilities:
        purpose: "Security tab — CVEs and security issues (PAGINATED)"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "cve_id TEXT"
          - "severity TEXT (critical|high|medium|low)"
          - "package_name TEXT"
          - "package_version TEXT"
          - "fixed_version TEXT"
          - "description TEXT"
          - "file_path TEXT"
          - "line_number INTEGER"
          - "remediation TEXT"
          - "detected_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_severity ON vulnerabilities(severity)"
          - "CREATE INDEX idx_package ON vulnerabilities(package_name)"
          
      packages:
        purpose: "Dependencies tab — package tree (PAGINATED)"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "package_name TEXT NOT NULL"
          - "package_version TEXT"
          - "package_type TEXT (direct|transitive)"
          - "license TEXT"
          - "size_kb INTEGER"
          - "vulnerability_count INTEGER"
          - "parent_package_id INTEGER (for tree structure)"
          - "installed_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_package_name ON packages(package_name)"
          - "CREATE INDEX idx_parent ON packages(parent_package_id)"
        fts:
          - "CREATE VIRTUAL TABLE packages_fts USING fts5(package_name, content=packages)"
          
      code_smells:
        purpose: "Code Quality tab — quality issues (PAGINATED)"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "smell_type TEXT (e.g., 'Long Method', 'God Class')"
          - "category TEXT (complexity|duplication|smell|maintainability)"
          - "severity TEXT (low|medium|high|critical)"
          - "file_path TEXT NOT NULL"
          - "line_number INTEGER"
          - "code_snippet TEXT"
          - "explanation TEXT (LLM-generated)"
          - "remediation TEXT (LLM-generated)"
          - "effort_hours INTEGER"
          - "detected_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_smell_type ON code_smells(smell_type)"
          - "CREATE INDEX idx_file_path ON code_smells(file_path)"
          
      entities:
        purpose: "Domain Model tab — domain entities"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "name TEXT NOT NULL UNIQUE"
          - "type TEXT (aggregate_root|entity|value_object|service)"
          - "description TEXT (LLM-generated)"
          - "file_path TEXT"
          - "line_range TEXT (e.g., '45-120')"
          - "attributes TEXT (JSON array)"
          - "methods TEXT (JSON array)"
          - "stereotypes TEXT (JSON array)"
        indexes:
          - "CREATE INDEX idx_entity_name ON entities(name)"
          - "CREATE INDEX idx_entity_type ON entities(type)"
          
      relationships:
        purpose: "Domain Model tab — entity relationships"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "source_entity TEXT NOT NULL"
          - "target_entity TEXT NOT NULL"
          - "relationship_type TEXT (association|aggregation|composition|inheritance)"
          - "cardinality TEXT (e.g., '1..n', '0..1')"
          - "label TEXT"
          - "bidirectional INTEGER (boolean)"
        indexes:
          - "CREATE INDEX idx_source ON relationships(source_entity)"
          - "CREATE INDEX idx_target ON relationships(target_entity)"
          
      components:
        purpose: "Architecture tab — system components"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "name TEXT NOT NULL"
          - "type TEXT (service|module|library|database|external)"
          - "description TEXT (LLM-generated)"
          - "dependencies TEXT (JSON array of component names)"
          - "api_count INTEGER"
          - "loc INTEGER"
          - "layer TEXT (e.g., 'Presentation', 'Business', 'Data')"
        indexes:
          - "CREATE INDEX idx_component_name ON components(name)"
          - "CREATE INDEX idx_layer ON components(layer)"
          
      files:
        purpose: "Code Explorer tab — file tree (PAGINATED)"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "file_path TEXT NOT NULL UNIQUE"
          - "file_name TEXT"
          - "file_type TEXT (file|folder)"
          - "parent_path TEXT"
          - "language TEXT"
          - "loc INTEGER"
          - "complexity INTEGER"
          - "last_modified TEXT (ISO8601)"
          - "churn_count INTEGER"
        indexes:
          - "CREATE INDEX idx_file_path ON files(file_path)"
          - "CREATE INDEX idx_parent ON files(parent_path)"
        fts:
          - "CREATE VIRTUAL TABLE files_fts USING fts5(file_path, file_name, content=files)"
          
      code_snippets:
        purpose: "Code Explorer tab — highlighted code examples"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "title TEXT"
          - "file_path TEXT NOT NULL"
          - "start_line INTEGER"
          - "end_line INTEGER"
          - "language TEXT"
          - "code TEXT"
          - "explanation TEXT (LLM-generated)"
          - "category TEXT (pattern|anti-pattern|example|entry-point)"
        indexes:
          - "CREATE INDEX idx_snippet_file ON code_snippets(file_path)"
          
      test_results:
        purpose: "Testing tab — test execution results"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "test_name TEXT NOT NULL"
          - "test_type TEXT (unit|integration|e2e)"
          - "status TEXT (pass|fail|skip)"
          - "duration_ms INTEGER"
          - "file_path TEXT"
          - "failure_message TEXT"
          - "run_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_test_type ON test_results(test_type)"
          - "CREATE INDEX idx_status ON test_results(status)"
          
      lens_insights:
        purpose: "LENS Analysis tab — CORTEX findings"
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "insight_type TEXT (pattern|anti-pattern|recommendation)"
          - "category TEXT"
          - "description TEXT (LLM-generated)"
          - "evidence TEXT (JSON array of file paths)"
          - "impact TEXT (low|medium|high)"
          - "confidence INTEGER (0-100)"
          - "detected_at TEXT (ISO8601)"
        indexes:
          - "CREATE INDEX idx_insight_type ON lens_insights(insight_type)"
          
    views:
      executive_kpis:
        purpose: "Executive Summary tab — computed KPIs"
        definition: |
          CREATE VIEW executive_kpis AS
          SELECT
            (SELECT health_score FROM repo_summary) AS health_score,
            (SELECT COUNT(*) FROM vulnerabilities WHERE severity IN ('critical', 'high')) AS critical_vulnerabilities,
            (SELECT technical_debt_hours FROM metrics_summary) AS tech_debt_hours,
            (SELECT COUNT(*) FROM test_results WHERE status = 'pass') * 100.0 / 
              NULLIF((SELECT COUNT(*) FROM test_results), 0) AS test_pass_rate,
            (SELECT maintainability_index FROM metrics_summary) AS maintainability
        note: "No data duplication — references source tables"
        
      refactoring_suggestions:
        purpose: "Refactoring tab — prioritized improvements"
        definition: |
          CREATE VIEW refactoring_suggestions AS
          SELECT
            id,
            smell_type AS suggestion,
            file_path,
            severity,
            effort_hours,
            CASE
              WHEN severity = 'critical' AND effort_hours < 4 THEN 'quick_win'
              WHEN severity IN ('high', 'critical') THEN 'high_priority'
              ELSE 'backlog'
            END AS priority_bucket
          FROM code_smells
          ORDER BY 
            CASE severity 
              WHEN 'critical' THEN 1
              WHEN 'high' THEN 2
              WHEN 'medium' THEN 3
              ELSE 4
            END,
            effort_hours ASC
        note: "Computed from code_smells — no duplication"
        
  sql_js_implementation:
    library: "sql.js v1.10.x"
    files:
      - "company/dashboards/spa/vendor/sql-wasm.js (JavaScript loader)"
      - "company/dashboards/spa/vendor/sql-wasm.wasm (SQLite WASM binary)"
    initialization: |
      // In browser (SQLiteDataLayer.js)
      const SQL = await initSqlJs({
        locateFile: file => `/spa/vendor/${file}`
      });
      
      // Load database
      const response = await fetch(`/repos/${slug}/dashboard.sqlite`);
      const buffer = await response.arrayBuffer();
      const db = new SQL.Database(new Uint8Array(buffer));
      
    query_examples:
      pagination:
        query: "SELECT * FROM use_cases ORDER BY priority DESC LIMIT 20 OFFSET 40"
        note: "Page 3 of use cases (20 per page)"
        
      search:
        query: "SELECT * FROM use_cases_fts WHERE use_cases_fts MATCH 'authentication' LIMIT 10"
        note: "Full-text search for 'authentication'"
        
      filter:
        query: "SELECT * FROM vulnerabilities WHERE severity = 'critical' AND package_name LIKE 'django%'"
        note: "Critical Django vulnerabilities"
        
      drill_down:
        query: "SELECT * FROM metrics_by_file WHERE complexity > 20 ORDER BY complexity DESC"
        note: "High-complexity files"
        
  scalability_path:
    phase_1_local:
      database: "sql.js (WASM)"
      deployment: "Static file server (Python, nginx, Node)"
      capacity: "Up to 100MB SQLite files, 1000+ repos"
      performance: "Instant load (<2s), all queries local"
      
    phase_2_hybrid:
      database: "sql.js (local) + optional API for large queries"
      deployment: "Static files + lightweight API (FastAPI)"
      capacity: "Up to 500MB SQLite files"
      performance: "Most queries local, heavy queries offloaded"
      
    phase_3_enterprise:
      database: "PostgreSQL / Azure SQL / AWS RDS"
      deployment: "Full SaaS with authentication"
      capacity: "Unlimited (TB-scale repositories)"
      performance: "<100ms queries with proper indexing"
      migration: "Same SQL queries, swap connection layer only"
      additional:
        - "Vector database for semantic code search (Pinecone, Weaviate)"
        - "Redis cache for hot data"
        - "Elasticsearch for advanced search"
      
    key_principle: "SQL abstraction layer allows swapping backends without frontend changes"
  purpose: |
    Large enterprise repositories can have millions of files and TB of code.
    A single JSON file would be impractical. The sharded approach splits
    data into logical chunks that are loaded on-demand by the dashboard.
    
  strategy: "Lazy Loading with Manifest"
  
  file_structure: |
    repos/{slug}/
    ├── manifest.json           # Metadata + shard map (always loaded first)
    ├── core.json               # Overview, metrics, executive (small, always loaded)
    ├── security.json           # Security vulnerabilities (loaded on tab click)
    ├── dependencies.json       # Package dependencies (loaded on tab click)
    ├── quality.json            # Code smells, technical debt (loaded on tab click)
    ├── use-cases.json          # Business use cases (loaded on tab click)
    ├── domain.json             # Domain entities, UML data (loaded on tab click)
    ├── architecture.json       # Layers, components, data flow (loaded on tab click)
    ├── testing.json            # Test coverage, results (loaded on tab click)
    ├── refactoring.json        # Recommendations (loaded on tab click)
    ├── lens.json               # LENS analysis results (loaded on tab click)
    ├── graphs/                 # Large graph data (loaded on demand)
    │   ├── dependency-graph.json    # D3/Cytoscape format
    │   ├── call-graph.json          # Function call relationships
    │   ├── import-graph.json        # File import relationships
    │   └── coupling-matrix.json     # Module coupling data
    └── diagrams/               # Pre-rendered diagram definitions
        ├── class-diagram.mmd        # Mermaid class diagram
        ├── er-diagram.mmd           # Mermaid ER diagram
        ├── sequence-*.mmd           # Sequence diagrams
        └── c4-context.mmd           # C4 context diagram
        
  manifest_schema:
    version: "3.0"
    fields:
      repo: "Repository metadata (same as before)"
      schema_version: "string"
      generated_at: "ISO8601"
      shards:
        type: "object"
        description: "Map of shard name → file info"
        example:
          core:
            file: "core.json"
            size_kb: 45
            loaded: true
          security:
            file: "security.json"
            size_kb: 120
            count: 47
          dependencies:
            file: "dependencies.json"
            size_kb: 85
            count: 234
          graphs:
            dependency_graph:
              file: "graphs/dependency-graph.json"
              size_kb: 2400
              node_count: 1500
              edge_count: 3200
      total_size_kb: "number - Combined size of all shards"
      diagrams:
        available: "string[] - List of available diagram files"
        
  loading_strategy:
    initial_load:
      - "manifest.json (always, <5KB)"
      - "core.json (always, <50KB)"
    on_tab_click:
      - "Load corresponding shard JSON"
      - "Cache in memory for session"
      - "Show loading spinner during fetch"
    on_graph_view:
      - "Load graph data on demand"
      - "Progressive rendering for large graphs"
      - "Virtualization for >1000 nodes"
      
  dashboard_loader_implementation: |
    class ShardedDataLoader {
      constructor(repoSlug) {
        this.slug = repoSlug;
        this.baseUrl = `repos/${repoSlug}/`;
        this.manifest = null;
        this.cache = new Map();
      }
      
      async init() {
        // Always load manifest first
        this.manifest = await this.fetch('manifest.json');
        // Load core data (overview, metrics, executive)
        this.cache.set('core', await this.fetch('core.json'));
      }
      
      async loadShard(name) {
        if (this.cache.has(name)) return this.cache.get(name);
        
        const shardInfo = this.manifest.shards[name];
        if (!shardInfo) return null;
        
        const data = await this.fetch(shardInfo.file);
        this.cache.set(name, data);
        return data;
      }
      
      async loadGraph(name) {
        const graphPath = this.manifest.shards.graphs?.[name]?.file;
        if (!graphPath) return null;
        return this.fetch(graphPath);
      }
      
      async fetch(path) {
        const response = await fetch(this.baseUrl + path);
        if (!response.ok) throw new Error(`Failed to load ${path}`);
        return response.json();
      }
    }
    
  size_thresholds:
    small_repo: "< 10MB total → Single dashboard-data.json (legacy)"
    medium_repo: "10MB - 100MB → Sharded by tab"
    large_repo: "100MB - 1GB → Sharded with graph separation"
    enterprise_repo: "> 1GB → Full sharding + pagination + virtualization"

---
# ============================================================================
# JSON SCHEMA v3.0 - COMPREHENSIVE DASHBOARD DATA
# ============================================================================

json_schema_v3:
  version: "3.0"
  description: |
    Complete schema for enterprise repository intelligence.
    Supports 13 main sections with extensibility for future additions.
    All sections follow null-safe patterns for graceful UI degradation.
    For large repos, sections are split into separate shard files.
  
  structure:
    repo:
      required: true
      description: "Repository metadata"
      fields:
        slug: "string - URL-safe identifier (e.g., 'my-app')"
        display_name: "string - Human-readable name"
        description: "string - Repository description"
        owner: "string - Team/organization"
        primary_language: "string - Main programming language"
        version: "string|null - Current version/tag"
        icon: "string - Emoji icon for tiles"
        tags: "string[] - Categorization tags"
        last_analyzed_at: "ISO8601 datetime"
        analysis_depth: "string - quick|standard|deep"
        schema_version: "string - '3.0'"
        is_sharded: "boolean - Whether data is split into shards"
    
    executive_summary:
      required: true
      description: "C-suite dashboard with business KPIs"
      llm_generated: true
      shard: "core.json"
      target_role: "Business Leaders, Executives"
      fields:
        headline: "string - One-line status (e.g., 'System Healthy - No Action Required')"
        health_status: "string - healthy|warning|critical"
        key_metrics:
          type: "array"
          items:
            name: "string - Metric name"
            value: "string - Display value"
            trend: "string - up|down|stable"
            trend_value: "string - e.g., '+5% this month'"
            status: "string - good|warning|critical"
        risk_summary: |
          string - LLM-generated 2-3 sentence risk overview in business terms.
          Focus on business impact, not technical details.
          Example: "The system has 2 high-priority security issues that could
          impact customer data. Estimated remediation effort is 3 days."
        investment_recommendations:
          type: "array"
          items:
            area: "string - e.g., 'Security', 'Performance', 'Technical Debt'"
            recommendation: "string - What to invest in"
            effort: "string - hours|days|weeks"
            impact: "string - Business impact description"
            roi: "string - Expected return"
        compliance_status:
          overall: "string - compliant|partial|non-compliant"
          frameworks:
            type: "array"
            items:
              name: "string - e.g., 'SOC2', 'GDPR', 'HIPAA'"
              status: "string - compliant|partial|non-compliant"
              gaps: "number"
              next_audit: "string|null"
      diagrams:
        - "executive_kpi_gauges: ECharts gauge cluster"
        - "risk_heatmap: ECharts heatmap"
        - "investment_roadmap: Mermaid gantt"
        
    overview:
      required: true
      description: "Product and technical leadership dashboard"
      llm_generated: true
      shard: "core.json"
      target_role: "Product Owners, Dev Managers"
      fields:
        summary: "string - One-line summary"
        business_summary: |
          string - 2-3 paragraph executive summary written in business language.
          Generated by LLM from code analysis. Explains:
          - What the system does
          - Key capabilities
          - Business value
          - Technology stack
        key_findings: "string[] - 5-7 bullet points of critical insights"
        key_metrics_summary: |
          object - Quick reference metrics:
          {
            health_score: number,
            total_files: number,
            total_loc: number,
            test_coverage: number,
            security_issues: number,
            technical_debt_hours: number
          }
      null_behavior: "Show placeholder text if empty"
    
    metrics:
      required: true
      description: "Quantitative code metrics"
      fields:
        health_score: "number (0-100)"
        risk_score: "number (0-100)"
        loc:
          total: "number - Total lines"
          code: "number - Code lines"
          comment: "number - Comment lines"
          blank: "number - Blank lines"
        files:
          total: "number"
          by_type: "object - {extension: count}"
        coverage:
          overall: "number|null (0-100)"
          unit: "number|null"
          integration: "number|null"
          e2e: "number|null"
        languages: "object - {language: line_count}"
        complexity:
          average: "number"
          max: "number"
          distribution: "object - {low: count, medium: count, high: count}"
        trends:
          health_30d: "number[] - Daily health scores"
          loc_30d: "number[] - Daily LOC counts"
          coverage_30d: "number[] - Daily coverage"
      null_behavior: "Show '--' for null numeric values"
    
    security:
      required: true
      description: "Security vulnerabilities and compliance"
      fields:
        security_score: "number (0-100)"
        total_count: "number"
        by_severity:
          critical: "number"
          high: "number"
          medium: "number"
          low: "number"
          info: "number"
        vulnerabilities:
          type: "array"
          items:
            id: "string"
            title: "string"
            severity: "string - critical|high|medium|low|info"
            cwe_id: "string|null"
            owasp_category: "string|null"
            location: "string - file:line"
            description: "string"
            recommendation: "string"
            status: "string - open|in_progress|accepted|resolved"
            detected_at: "ISO8601"
        secrets_scan:
          clean: "boolean"
          findings: "array - detected secrets (redacted)"
        dependency_vulnerabilities:
          type: "array"
          items:
            package: "string"
            vulnerability_id: "string"
            severity: "string"
            fixed_in: "string|null"
        owasp_compliance:
          score: "number"
          findings: "object - {category: finding_count}"
      null_behavior: "Show 'No vulnerabilities detected' banner"
    
    dependencies:
      required: true
      description: "Package dependencies analysis"
      fields:
        summary:
          direct: "number"
          dev: "number"
          transitive: "number"
          outdated: "number"
          vulnerable: "number"
        packages:
          type: "array"
          items:
            name: "string"
            version: "string"
            latest: "string|null"
            license: "string"
            type: "string - direct|dev|transitive"
            is_outdated: "boolean"
            is_vulnerable: "boolean"
            vulnerabilities: "string[]"
        licenses:
          distribution: "object - {license: count}"
          risk_assessment: "string - low|medium|high"
          problematic: "string[] - GPL, AGPL, etc."
        dependency_graph:
          nodes: "array - [{id, name, type, level}]"
          edges: "array - [{source, target, type}]"
      null_behavior: "Show 'No dependencies' message"
    
    quality:
      required: true
      description: "Code quality and technical debt"
      fields:
        scores:
          maintainability: "number (0-100)"
          readability: "number (0-100)"
          documentation: "number (0-100)"
          testability: "number (0-100)"
        technical_debt:
          hours: "number"
          rating: "string - A|B|C|D|E"
          breakdown: "object - {category: hours}"
        complexity:
          average_cyclomatic: "number"
          max_cyclomatic: "number"
          cognitive_load: "number"
          hotspots: "array - [{file, function, complexity}]"
        code_smells:
          total_count: "number"
          by_category: "object - {category: count}"
          items:
            type: "array"
            items:
              id: "string"
              name: "string"
              description: "string"
              location: "string"
              severity: "string - low|medium|high"
              effort_to_fix: "string"
        duplication:
          percentage: "number"
          blocks: "number"
          lines: "number"
          files_affected: "string[]"
      null_behavior: "Show 'No code smells detected' card"
    
    use_cases:
      required: true
      description: "Business use cases extracted from code"
      llm_generated: true
      fields:
        type: "array"
        items:
          id: "string"
          title: "string - Human-readable title"
          description: |
            string - LLM-generated business description explaining:
            - What the use case enables
            - Who benefits
            - How it works (non-technical)
          persona: "string - Developer|Manager|QA|Architect|DevOps|Security|Business"
          category: "string - Grouping category"
          business_value: |
            string - LLM-generated value proposition:
            - Quantified benefits where possible
            - Time/cost savings
            - Risk reduction
          implementation_notes: "string|null - Technical details"
          code_references:
            type: "array"
            items:
              file: "string"
              module: "string"
              function: "string|null"
              line_start: "number"
              line_end: "number"
          api_endpoints: "string[] - Related API endpoints"
          database_tables: "string[] - Related tables"
          tags: "string[]"
          priority: "string - low|medium|high|critical"
      null_behavior: "Hide tab or show 'No use cases defined'"
    
    lens:
      required: true
      description: "LENS unified intelligence results"
      fields:
        patterns:
          detected:
            type: "array"
            items:
              name: "string"
              count: "number"
              confidence: "number (0-1)"
              locations: "string[]"
          missing: "string[] - Recommended patterns not found"
        architecture:
          summary: "string - LLM-generated architecture description"
          layers:
            type: "array"
            items:
              name: "string - e.g., 'Presentation', 'Business', 'Data'"
              components: "string[]"
              files: "string[]"
          layer_violations: "array - [{from_layer, to_layer, file, severity}]"
        vendors:
          count: "number"
          by_category: "object - {category: [vendors]}"
          risk_assessment: "array - [{vendor, risk, reason}]"
        capabilities:
          discovered: "string[]"
          coverage: "number (0-100)"
      null_behavior: "Show 'Analysis pending' state"
    
    refactoring:
      required: true
      description: "Refactoring recommendations"
      llm_generated: true
      fields:
        summary:
          total_recommendations: "number"
          by_priority: "object - {critical: n, high: n, medium: n, low: n}"
          estimated_effort_hours: "number"
        recommendations:
          type: "array"
          items:
            id: "string"
            title: "string"
            description: |
              string - LLM-generated explanation:
              - Current problem
              - Proposed solution
              - Expected benefits
            priority: "string - low|medium|high|critical"
            category: "string - complexity|duplication|smell|security|performance"
            impact: "string"
            effort: "string - hours|days|weeks"
            roi_score: "number (0-100)"
            files: "string[]"
            before_code: "string|null - Code snippet before"
            after_code: "string|null - Suggested code after"
      null_behavior: "Show 'No refactoring needed' celebration"
    
    architecture:
      required: false
      description: "Architecture visualization data (NEW)"
      fields:
        overview:
          style: "string - monolith|microservices|serverless|hybrid"
          summary: "string - LLM-generated architecture overview"
        components:
          type: "array"
          items:
            name: "string"
            type: "string - service|module|library|database|external"
            description: "string"
            dependencies: "string[]"
            api_count: "number"
            loc: "number"
        layers:
          type: "array"
          items:
            name: "string"
            order: "number"
            components: "string[]"
            color: "string - hex color"
        data_flow:
          nodes: "array - [{id, name, type}]"
          edges: "array - [{source, target, label, data_type}]"
        database_schema:
          tables: "array - [{name, columns, relationships}]"
          er_diagram_data: "object - For rendering ER diagram"
      null_behavior: "Hide Architecture tab"
    
    domain_model:
      required: false
      description: "Domain model and UML visualization (NEW - reads from company/domains/{repo}/)"
      data_source: "company/domains/{repo}/*.yaml → entities.yaml, patterns.yaml, vendors.yaml"
      llm_generated: true
      fields:
        summary:
          entity_count: "number"
          relationship_count: "number"
          pattern_count: "number"
          bounded_context_count: "number"
          description: "string - LLM-generated domain overview"
        entities:
          type: "array"
          source: "company/domains/{repo}/entities.yaml"
          items:
            name: "string"
            type: "string - aggregate_root|entity|value_object|domain_event|repository|service"
            description: "string - LLM-generated entity purpose"
            attributes:
              type: "array"
              items:
                name: "string"
                type: "string"
                required: "boolean"
            methods:
              type: "array"
              items:
                name: "string"
                visibility: "string - public|private|protected"
                parameters: "string"
                return_type: "string"
            stereotypes: "string[] - e.g., ['<<aggregate>>', '<<entity>>']"
            file_path: "string - Source file location"
            line_range: "[number, number]"
        relationships:
          type: "array"
          description: "Extracted from code analysis + entities.yaml"
          items:
            source: "string - Entity name"
            target: "string - Entity name"
            type: "string - association|aggregation|composition|inheritance|implementation|dependency"
            cardinality: "string - e.g., '1..n', '0..1', '*'"
            label: "string|null - Relationship name"
            bidirectional: "boolean"
        patterns:
          type: "array"
          source: "company/domains/{repo}/patterns.yaml"
          items:
            name: "string - e.g., Repository, Factory, Strategy, Observer"
            category: "string - creational|structural|behavioral|architectural"
            description: "string - LLM-generated pattern usage explanation"
            implementations:
              type: "array"
              items:
                class_name: "string"
                file_path: "string"
                confidence: "number (0-100)"
            benefits: "string[] - Why this pattern is used here"
            related_patterns: "string[] - Other patterns it works with"
        bounded_contexts:
          type: "array"
          description: "DDD bounded contexts (auto-detected or from yaml)"
          items:
            name: "string"
            description: "string - LLM-generated context purpose"
            entities: "string[] - Entities belonging to this context"
            external_interfaces: "string[] - APIs/events exposed"
            dependencies: "string[] - Other bounded contexts it depends on"
            color: "string - Hex color for visualization"
        vendors:
          type: "array"
          source: "company/domains/{repo}/vendors.yaml"
          items:
            name: "string"
            category: "string - framework|library|tool|service"
            version: "string"
            purpose: "string"
            integration_points: "string[] - Where it's used in the codebase"
        uml_diagrams:
          class_diagram:
            mermaid_definition: "string - Mermaid classDiagram syntax"
            entities_included: "string[]"
            max_entities: "number - Limit for readability (default: 20)"
          er_diagram:
            mermaid_definition: "string - Mermaid erDiagram syntax"
            tables_included: "string[]"
          sequence_diagrams:
            type: "array"
            description: "Key workflows as sequence diagrams"
            items:
              name: "string - Workflow name"
              mermaid_definition: "string"
              actors: "string[]"
          component_diagram:
            mermaid_definition: "string - C4 or Mermaid component diagram"
            bounded_contexts_shown: "string[]"
          state_diagrams:
            type: "array"
            description: "Entity lifecycle state machines"
            items:
              entity: "string"
              mermaid_definition: "string"
              states: "string[]"
        cytoscape_graph:
          description: "Interactive graph data for Cytoscape.js"
          nodes:
            type: "array"
            items:
              data:
                id: "string"
                label: "string"
                type: "string"
                parent: "string|null - For compound nodes"
              classes: "string - CSS classes"
          edges:
            type: "array"
            items:
              data:
                id: "string"
                source: "string"
                target: "string"
                type: "string"
                label: "string|null"
        llm_insights:
          architecture_smell: "string[] - Detected domain issues"
          missing_patterns: "string[] - Patterns that could improve the design"
          coupling_concerns: "string[] - High-coupling areas"
          recommendations: "string[] - Domain model improvements"
      null_behavior: "Hide Domain Model tab"
    
    code_explorer:
      required: false
      description: "Interactive code exploration (NEW)"
      fields:
        file_tree:
          type: "object"
          description: "Hierarchical file structure with metadata"
          structure: |
            {
              name: string,
              type: 'folder' | 'file',
              path: string,
              children?: FileNode[],
              metadata?: {
                language: string,
                loc: number,
                complexity: number,
                last_modified: string
              }
            }
        hot_files:
          type: "array"
          description: "Files with most churn or complexity"
          items:
            path: "string"
            churn_count: "number - Changes in last 30 days"
            complexity: "number"
            authors: "string[]"
            risk_score: "number"
        code_snippets:
          type: "array"
          description: "Highlighted code examples"
          items:
            title: "string"
            file_path: "string"
            start_line: "number"
            end_line: "number"
            language: "string"
            code: "string"
            explanation: "string - LLM-generated explanation"
            category: "string - pattern|anti-pattern|example|entry-point"
        dependency_graph:
          description: "Module/file dependency visualization"
          cytoscape_data:
            nodes: "array - Cytoscape node format"
            edges: "array - Cytoscape edge format"
          elk_layout:
            algorithm: "string - layered|force|radial"
            options: "object"
        search_index:
          description: "Pre-built Fuse.js search index"
          documents:
            type: "array"
            items:
              id: "string"
              type: "string - file|function|class|variable"
              name: "string"
              path: "string"
              preview: "string"
              tags: "string[]"
          index_options:
            keys: "string[] - Fields to search"
            threshold: "number"
      null_behavior: "Hide Code Explorer tab"
    
    testing:
      required: false
      description: "Testing analysis (NEW)"
      fields:
        summary:
          total_tests: "number"
          by_type: "object - {unit: n, integration: n, e2e: n}"
          coverage: "number"
          pass_rate: "number"
        pyramid:
          unit: "number - percentage"
          integration: "number - percentage"
          e2e: "number - percentage"
          is_healthy: "boolean"
        coverage_by_module: "object - {module: coverage_pct}"
        uncovered_critical:
          type: "array"
          items:
            file: "string"
            function: "string"
            complexity: "number"
            risk: "string"
        flaky_tests: "array - [{name, failure_rate, last_failed}]"
        test_trends:
          pass_rate_30d: "number[]"
          coverage_30d: "number[]"
      null_behavior: "Hide Testing tab"
    
    executive:
      required: false
      description: "Executive KPIs (NEW)"
      llm_generated: true
      fields:
        headline: "string - One-line status for executives"
        health_status: "string - healthy|warning|critical"
        key_metrics:
          type: "array"
          items:
            name: "string"
            value: "string"
            trend: "string - up|down|stable"
            status: "string - good|warning|critical"
        risk_summary: "string - LLM-generated risk overview"
        investment_recommendations: |
          array - [{
            area: string,
            recommendation: string,
            effort: string,
            impact: string,
            roi: string
          }]
        compliance_status:
          overall: "string - compliant|partial|non-compliant"
          frameworks: "array - [{name, status, gaps}]"
      null_behavior: "Hide Executive tab"

---
# ============================================================================
# USER INTERFACE DESIGN
# ============================================================================

ui_design:
  ux_components:
    design_system:
      theme: "Dark Glassmorphism Professional"
      principles:
        - "Card/tile-based layouts with glass effects"
        - "Subtle animations (glass shimmer, hover glow)"
        - "Progressive disclosure (summary → details)"
        - "Mobile-first responsive design"
        - "WCAG 2.1 AA accessibility"
        - "Zero compromise on visual beauty"
      css_architecture:
        - "BEM methodology for component naming"
        - "CSS custom properties (variables) for theming"
        - "CSS Grid + Flexbox for layouts"
        - "No CSS framework (Tailwind/Bootstrap) — full custom control"
        - "Separate files per component (metric-card.css, data-table.css)"
      
    core_components:
      metric_card:
        description: "Glassmorphism tile showing single KPI"
        html: "<div class='metric-card'>"
        css_features:
          - "background: rgba(255, 255, 255, 0.05)"
          - "backdrop-filter: blur(10px)"
          - "border: 1px solid rgba(255, 255, 255, 0.1)"
          - "box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3)"
          - "transition: all 0.3s ease"
          - "hover: border-color: #00ffff, box-shadow glow"
        layout:
          description: "Intelligent multi-column grid — flows horizontally"
          strategy: "Content-aware column count (NOT standardized)"
          column_logic:
            - "2 columns: Large cards (charts, detailed metrics, >300px width)"
            - "3 columns: Medium cards (KPIs with descriptions, ~250px width)"
            - "4 columns: Small cards (single metrics, icons, ~200px width)"
          css_grid: "display: grid; grid-template-columns: repeat(auto-fit, minmax({min-width}, 1fr))"
          responsive:
            mobile: "1 column (< 768px) — full-width stack"
            tablet: "2-3 columns (768-1024px) — adaptive based on card width"
            desktop: "2-4 columns (> 1024px) — intelligent based on content"
          examples:
            executive_summary:
              cards: "4 KPI cards (Health, Vulnerabilities, Tech Debt, Pass Rate)"
              layout: "4 columns (small cards, icon + number + label)"
              min_width: "200px"
            overview:
              cards: "6 metric cards (LOC, Files, Contributors, Languages, Commits, Health)"
              layout: "3 columns (medium cards with descriptions)"
              min_width: "250px"
            metrics:
              cards: "2 chart cards (LOC Breakdown, Complexity Histogram)"
              layout: "2 columns (large cards with ECharts)"
              min_width: "400px"
        use_cases:
          - "Executive Summary — 4 columns (small KPI cards)"
          - "Overview — 3 columns (medium info cards)"
          - "Metrics — 2 columns (large chart cards)"
        
      data_table:
        description: "Paginated table with search/filter/sort"
        html: "<table class='data-table'>"
        features:
          - "Virtual scrolling for 10,000+ rows (only render visible)"
          - "Column sorting (SQL ORDER BY)"
          - "Search bar (SQL LIKE or FTS5)"
          - "Filter dropdowns (SQL WHERE)"
          - "Pagination controls (SQL LIMIT/OFFSET)"
          - "Export to CSV"
        css_features:
          - "Glass table header (sticky)"
          - "Alternating row colors (rgba transparency)"
          - "Hover row highlight"
          - "Responsive: card layout on mobile"
        sql_integration:
          pagination: "SELECT * FROM use_cases LIMIT 20 OFFSET {page*20}"
          search: "WHERE title LIKE '%{query}%' OR business_value LIKE '%{query}%'"
          filter: "WHERE category = '{category}' AND priority = '{priority}'"
          sort: "ORDER BY {column} {direction}"
        use_cases:
          - "Use Cases tab — 100+ use cases paginated"
          - "Dependencies tab — 1000+ packages"
          - "Code Quality tab — 500+ code smells"
          - "Security tab — 200+ vulnerabilities"
          
      accordion_section:
        description: "Collapsible section for grouped content"
        html: "<details class='accordion'>"
        css_features:
          - "Glass header with expand/collapse icon"
          - "Smooth height transition"
          - "Nested accordions supported"
        use_cases:
          - "Security tab — Vulnerabilities / Secrets / Compliance"
          - "Architecture tab — Layers / Components / Data Flow"
          
      wizard_stepper:
        description: "Multi-step flow with breadcrumb trail"
        html: "<div class='wizard'>"
        css_features:
          - "Breadcrumb with glass pills"
          - "Progress bar (glass gradient)"
          - "Step content with fade transitions"
        use_cases:
          - "Architecture tab — 4-step overview"
          - "Code Explorer — Browse → Select → View → Analyze"
          
      chart_container:
        description: "Wrapper for ECharts/Mermaid/Cytoscape"
        html: "<div class='chart-container'>"
        css_features:
          - "Glass card styling"
          - "Loading spinner (CSS animation)"
          - "Toolbar (export, fullscreen)"
        use_cases:
          - "All tabs with visualizations"
          
      search_bar:
        description: "Global search with autocomplete"
        html: "<input class='search-bar' type='search'>"
        features:
          - "Debounced input (300ms)"
          - "SQLite FTS5 full-text search"
          - "Autocomplete dropdown (glass)"
          - "Keyboard navigation (⌘+K to open)"
        sql: "SELECT * FROM search_index WHERE search_index MATCH '{query}' LIMIT 10"
        
      pagination_controls:
        description: "Page navigation with SQL LIMIT/OFFSET"
        html: "<nav class='pagination'>"
        css_features:
          - "Glass pill buttons"
          - "Active page highlighted"
          - "Ellipsis for large page counts (1 ... 5 6 7 ... 50)"
        logic:
          - "SQL: LIMIT {pageSize} OFFSET {(currentPage-1)*pageSize}"
          - "Show: Prev | 1 2 3 ... 10 | Next"
          
      filter_panel:
        description: "Multi-select filters for data tables"
        html: "<aside class='filter-panel'>"
        css_features:
          - "Glass sidebar (collapsible on mobile)"
          - "Checkbox groups"
          - "Range sliders (complexity, LOC)"
          - "Date pickers (ISO8601)"
        sql: "WHERE category IN ('auth', 'payment') AND severity >= 'medium'"
        
      breadcrumb_trail:
        description: "Navigation history for drill-downs"
        html: "<nav class='breadcrumb'>"
        css_features:
          - "Glass pills with separators"
          - "Clickable ancestors"
          - "Overflow: ... on mobile"
        use_cases:
          - "Code Explorer — Root > src > core > auth.py"
          - "Dependencies — Root > react > react-dom"
          
      modal_dialog:
        description: "Overlay for detail views"
        html: "<dialog class='modal'>"
        css_features:
          - "Glass modal with backdrop blur"
          - "Smooth fade-in animation"
          - "ESC to close, click outside to dismiss"
        use_cases:
          - "Vulnerability detail"
          - "Use case full view"
          - "Code snippet viewer"
          
    animations:
      glass_shimmer:
        effect: "Subtle light reflection moving across glass surfaces"
        css: "@keyframes shimmer { 0% { background-position: -1000px; } 100% { background-position: 1000px; } }"
        usage: "Landing page hero, card hover states"
        
      hover_glow:
        effect: "Border glow on interactive elements"
        css: "box-shadow: 0 0 20px rgba(0, 255, 255, 0.5)"
        usage: "Metric cards, buttons, links"
        
      fade_transition:
        effect: "Smooth content transitions"
        css: "transition: opacity 0.3s ease"
        usage: "Tab switching, wizard steps"
        
      skeleton_loader:
        effect: "Animated placeholder while data loads"
        css: "background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%)"
        usage: "Initial dashboard load, chart rendering"
        
    responsive_breakpoints:
      mobile: "< 768px"
      tablet: "768px - 1024px"
      desktop: "> 1024px"
      
      mobile_adaptations:
        - "Navigation: Hamburger drawer"
        - "Card grids: 1 column (full-width stack)"
        - "Tables: Transform to card layout"
        - "Charts: Full-width, scroll to pan"
        - "Filters: Bottom sheet modal"
        - "Pagination: Simplified (Prev/Next only)"
        
      tablet_adaptations:
        - "Navigation: Vertical sidebar with icons"
        - "Card grids: 2-3 columns (adaptive, content-aware)"
        - "Tables: Show 3-5 columns"
        - "Charts: 2 columns or full-width based on size"
        
      desktop_adaptations:
        - "Navigation: Horizontal tabs"
        - "Card grids: 2-4 columns (intelligent, content-aware)"
        - "Tables: Show all columns"
        - "Charts: Multi-column dashboard grid"
        
      grid_intelligence:
        description: "CSS Grid auto-fit with content-aware min-width"
        principle: "Cards determine columns, not viewport standardization"
        css_pattern: "grid-template-columns: repeat(auto-fit, minmax(var(--card-min-width), 1fr))"
        decision_matrix:
          small_cards:
            min_width: "200px"
            example_content: "Icon + Number + Label (Health Score: 85%)"
            desktop_columns: "4 columns typical"
            tablet_columns: "3 columns"
            mobile_columns: "1 column"
          medium_cards:
            min_width: "250px"
            example_content: "Title + Description + 2-3 metrics"
            desktop_columns: "3 columns typical"
            tablet_columns: "2 columns"
            mobile_columns: "1 column"
          large_cards:
            min_width: "400px"
            example_content: "Chart + Legend + Controls"
            desktop_columns: "2 columns typical"
            tablet_columns: "1-2 columns adaptive"
            mobile_columns: "1 column"
          extra_large_cards:
            min_width: "600px"
            example_content: "Complex diagram + Interactive controls"
            desktop_columns: "1-2 columns (full-width preferred)"
            tablet_columns: "1 column"
            mobile_columns: "1 column"
        
  progressive_disclosure_patterns:
    overview_tab:
      level_1: "Cards: LOC, Files, Contributors, Health Score"
      level_2: "Expand: Tech Stack List"
      level_3: "Drill-down: File Structure Tree"
      level_4: "Modal: Individual File Detail"
      
    use_cases_tab:
      level_1: "Table: Use Case Titles (20 per page)"
      level_2: "Row click: Expand inline for Business Value"
      level_3: "Button: Show User Stories"
      level_4: "Modal: Full Use Case with Acceptance Criteria"
      
    security_tab:
      level_1: "Cards: Critical (12), High (45), Medium (120)"
      level_2: "Accordion: Expand Vulnerabilities section"
      level_3: "Table: CVE List (paginated)"
      level_4: "Modal: CVE Detail with Remediation"
      
    architecture_tab:
      level_1: "Wizard Step 1: Overview Diagram"
      level_2: "Wizard Step 2: Layers (click layer)"
      level_3: "Wizard Step 3: Components in Layer (click component)"
      level_4: "Wizard Step 4: Component Detail + Dependencies"
      
    code_explorer_tab:
      level_1: "File Tree (folders collapsed)"
      level_2: "Expand folder: Show files"
      level_3: "Click file: Show metadata card"
      level_4: "Button: View Code Snippet"
      level_5: "Modal: Full file with syntax highlighting"
    
  visualization_libraries:
    core_stack:
      echarts:
        version: "5.4.x"
        size: "~1MB (minified)"
        purpose: "Primary charting library — beautiful, performant, feature-complete"
        security: "✅ No known vulnerabilities, actively maintained by Apache"
        use_cases:
          - "Gauge charts (health scores, KPIs)"
          - "Pie/doughnut charts (distributions)"
          - "Line charts (trends, timelines)"
          - "Bar charts (comparisons)"
          - "Radar charts (quality metrics)"
          - "Sunburst charts (hierarchy navigation)"
          - "Treemap charts (file sizes, code distribution)"
          - "Heatmap charts (complexity matrix, risk)"
          - "Graph charts (simple relationships)"
        file: "vendor/echarts.min.js"
        justification: "Single library replaces Chart.js + custom viz — dark theme native"
        
      mermaid:
        version: "10.x"
        size: "~800KB"
        purpose: "UML diagrams — class, sequence, ER, C4, flowcharts"
        security: "✅ No known vulnerabilities, 60K+ GitHub stars"
        use_cases:
          - "Class diagrams (Domain Model tab)"
          - "Sequence diagrams (Architecture workflows)"
          - "ER diagrams (database schema)"
          - "Flowcharts (business logic)"
          - "State diagrams (entity lifecycles)"
        file: "vendor/mermaid.min.js"
        justification: "Lightweight, no server required, dark theme support"
        
      cytoscape:
        version: "3.28.x"
        size: "~600KB"
        purpose: "Interactive graph exploration — dependency trees, call graphs"
        security: "✅ No known vulnerabilities, MIT license, active community"
        use_cases:
          - "Module dependency graphs (Code Explorer)"
          - "Call graphs (function relationships)"
          - "Import graphs (file dependencies)"
          - "Architecture component relationships"
        file: "vendor/cytoscape.min.js"
        justification: "Best-in-class for large interactive graphs, mobile-friendly"
        
      prismjs:
        version: "1.29.x"
        size: "~15KB + languages"
        purpose: "Code syntax highlighting"
        security: "✅ No known vulnerabilities, actively maintained"
        file: "vendor/prism.min.js"
        justification: "Tiny, extensible, excellent dark themes"
        
    data_layer:
      sqljs:
        version: "1.10.x"
        size: "~1MB (WASM)"
        purpose: "SQLite in browser — replaces JSON + Fuse.js + GridJS + pagination libs"
        security: "✅ No known vulnerabilities, official SQLite port"
        capabilities:
          - "Full-text search (FTS5)"
          - "Pagination (LIMIT/OFFSET)"
          - "Filtering (WHERE clauses)"
          - "Sorting (ORDER BY)"
          - "Aggregations (COUNT, SUM, AVG)"
          - "Joins (for computed views)"
          - "Indexes (performance)"
        files:
          - "vendor/sql-wasm.js"
          - "vendor/sql-wasm.wasm"
        justification: "Single solution for low/high volume, scales to enterprise"
        
    removed_libraries:
      description: "Consolidated functionality into core stack"
      removed:
        - "D3.js → ECharts handles all chart types"
        - "Fuse.js → SQLite FTS5 full-text search"
        - "GridJS → Native HTML tables + CSS + SQL"
        - "ELK.js → Cytoscape has built-in layouts"
        - "PlantUML encoder → Mermaid sufficient for most UML"
        - "Highlight.js → Prism.js covers all needs"
      savings: "~2MB fewer dependencies, simpler maintenance"
      
    total_footprint:
      vendor_js: "~2.5MB (ECharts + Mermaid + Cytoscape + sql.js + Prism)"
      comparison: "Previous JSON stack: ~4MB (more libs, less capability)"
      load_time: "<1 second on 3G, instant on WiFi"
        file: "vendor/highlight.min.js"
        
      markdownit:
        purpose: "Render markdown content in descriptions"
        file: "vendor/markdown-it.min.js"
        
      splitjs:
        purpose: "Resizable panels for code/diagram views"
        file: "vendor/split.min.js"
        
  tab_structure:
    landing_page:
      file: "index.html"
      components:
        - name: "Hero Section"
          description: "CORTEX branding with animated logo"
        - name: "Search Bar"
          description: "Filter repos by name, tag, language"
        - name: "Repository Tiles Grid"
          description: "Dynamic cards from registry.json"
        - name: "Statistics Bar"
          description: "Total repos, avg health, total LOC"
          
    # ===========================================================================
    # TAB ORDER: Designed to progressively build knowledge
    # Role progression: Executives → Product Owners → Engineers → Specialists
    # ===========================================================================
    
    dashboard_tabs:
      # -------------------------------------------------------------------------
      # TAB 1: EXECUTIVE SUMMARY (Business Leaders, C-Suite)
      # -------------------------------------------------------------------------
      executive_summary:
        order: 1
        icon: "👔"
        target_role: "Business Leaders, Executives, C-Suite"
        description: |
          High-level business intelligence dashboard providing instant situational
          awareness. Shows health status, key risks, investment recommendations,
          and compliance posture. All content in business language - no technical
          jargon. Includes strategic diagrams showing system value and risk.
        llm_instructions: |
          Generate content suitable for executives with 30 seconds to assess:
          - One-line headline status ("System Healthy" or "Action Required")
          - 3-5 key business metrics with trend indicators
          - Risk summary in business impact terms (revenue, reputation, compliance)
          - Top 3 investment recommendations with ROI estimates
          - Compliance status against frameworks (SOC2, GDPR, HIPAA if applicable)
        diagrams:
          - type: "KPI Dashboard"
            library: "ECharts"
            description: "Gauge clusters showing health, risk, compliance scores"
          - type: "Risk Heatmap"
            library: "ECharts"
            description: "Business area vs risk level matrix"
          - type: "Investment Roadmap"
            library: "Mermaid"
            description: "Gantt-style diagram of recommended investments"
        components:
          - "Headline status banner (healthy/warning/critical)"
          - "Executive KPI gauges (4-6 metrics)"
          - "Risk summary card with business impact"
          - "Investment recommendations table with ROI"
          - "Compliance status badges"
          - "30-day trend sparklines"
          
      # -------------------------------------------------------------------------
      # TAB 2: OVERVIEW (Product Owners, Dev Managers)
      # -------------------------------------------------------------------------
      overview:
        order: 2
        icon: "📊"
        target_role: "Product Owners, Development Managers, Tech Leads"
        description: |
          Comprehensive system overview for product and technical leadership.
          Explains what the system does, its capabilities, and current state.
          Provides context needed for sprint planning and roadmap decisions.
          Visual diagrams show system boundaries and key capabilities.
        llm_instructions: |
          Generate content for product owners and dev managers:
          - 2-3 paragraph business summary explaining system purpose and value
          - Key capabilities list (what can users do with this system?)
          - Current state assessment (stability, maintainability, scalability)
          - Key findings that affect product decisions
          - Technology stack summary (frameworks, databases, integrations)
        diagrams:
          - type: "System Context Diagram"
            library: "Mermaid (C4)"
            description: "C4 context diagram showing system and external actors"
          - type: "Capability Map"
            library: "ECharts Treemap"
            description: "Interactive treemap of system capabilities by module"
          - type: "Health Dashboard"
            library: "ECharts"
            description: "Gauges and trends for health, coverage, quality"
        components:
          - "Business summary card (LLM-generated)"
          - "Key metrics grid (health, LOC, files, coverage, risk)"
          - "System context diagram (C4 level 1)"
          - "Capability treemap (clickable modules)"
          - "Key findings list (5-7 bullets)"
          - "Technology stack badges"
          - "Language distribution pie chart"
          
      # -------------------------------------------------------------------------
      # TAB 3: USE CASES (Product Owners, Business Analysts)
      # -------------------------------------------------------------------------
      use_cases:
        order: 3
        icon: "💡"
        target_role: "Product Owners, Business Analysts, New Team Members"
        description: |
          Business-language catalog of what the system enables. Each use case
          explains the feature, who benefits, business value, and links to
          implementation. Searchable and filterable by persona and category.
          Helps POs understand feature inventory and new members learn the system.
        llm_instructions: |
          Generate use case descriptions for non-technical stakeholders:
          - Title: Clear, action-oriented (e.g., "Process Customer Orders")
          - Description: What it enables, who benefits, how it works (no code)
          - Business Value: Quantified benefits, time savings, risk reduction
          - Priority: Critical/High/Medium/Low based on business impact
        diagrams:
          - type: "Use Case Diagram"
            library: "Mermaid"
            description: "UML use case diagram showing actors and features"
          - type: "Feature Journey Map"
            library: "Mermaid Sequence"
            description: "User journey through key features"
          - type: "Category Distribution"
            library: "ECharts"
            description: "Pie/sunburst of use cases by category"
        components:
          - "Search bar with fuzzy search (Fuse.js)"
          - "Persona filter (Developer, Manager, QA, etc.)"
          - "Category filter dropdown"
          - "Use case cards with expandable details"
          - "Business value highlights"
          - "Code reference links (file:line)"
          - "API endpoint references"
          - "Pagination for large lists"
          
      # -------------------------------------------------------------------------
      # TAB 4: DOMAIN MODEL (Architects, Senior Engineers)
      # -------------------------------------------------------------------------
      domain_model:
        order: 4
        icon: "🏛️"
        target_role: "Architects, Senior Engineers, Domain Experts"
        status: "NEW TAB"
        description: |
          UML diagrams visualizing domain entities, relationships, and business
          rules extracted from code. Reads from company/domains/{repo}/*.yaml
          files generated by CORTEX LENS. Shows class diagrams, entity relationships,
          and domain boundaries. Essential for understanding business logic.
        data_source: "company/domains/{repo}/entities.yaml, patterns.yaml, vendors.yaml"
        diagrams:
          - type: "Class Diagram"
            library: "Mermaid"
            description: "UML class diagram of domain entities with relationships"
          - type: "Entity Relationship Diagram"
            library: "Mermaid"
            description: "Database ER diagram from schema analysis"
          - type: "Domain Boundaries"
            library: "Cytoscape"
            description: "Interactive graph of bounded contexts"
          - type: "Aggregate Roots"
            library: "Mermaid"
            description: "DDD aggregate structure visualization"
        sub_tabs:
          - name: "Entities"
            components: ["Class diagram", "Entity table with properties", "Relationship list"]
          - name: "Relationships"
            components: ["ER diagram", "Cardinality matrix", "Foreign key map"]
          - name: "Patterns"
            components: ["Design pattern detection", "Pattern locations", "Usage examples"]
          - name: "Boundaries"
            components: ["Bounded context diagram", "Module coupling matrix"]
          
      # -------------------------------------------------------------------------
      # TAB 5: ARCHITECTURE (Architects, Platform Engineers)
      # -------------------------------------------------------------------------
      architecture:
        order: 5
        icon: "🏗️"
        target_role: "Architects, Platform Engineers, Tech Leads"
        description: |
          System architecture visualization showing components, layers, data flow,
          and integration points. Interactive diagrams allow drilling into modules.
          Identifies architectural violations and technical debt at system level.
        llm_instructions: |
          Generate architecture summary explaining:
          - Architectural style (monolith, microservices, serverless, hybrid)
          - Key components and their responsibilities
          - Data flow between components
          - Integration points with external systems
        diagrams:
          - type: "C4 Container Diagram"
            library: "Mermaid"
            description: "C4 level 2 showing containers and relationships"
          - type: "Layer Diagram"
            library: "ELK.js"
            description: "Layered architecture with dependency arrows"
          - type: "Data Flow Diagram"
            library: "D3 Sankey"
            description: "Sankey diagram showing data movement"
          - type: "Component Graph"
            library: "Cytoscape"
            description: "Interactive component dependency graph"
        sub_tabs:
          - name: "Overview"
            components: ["Architecture style badge", "C4 container diagram", "Component summary"]
          - name: "Layers"
            components: ["Layer visualization", "Layer violation warnings", "Dependency matrix"]
          - name: "Data Flow"
            components: ["Sankey diagram", "API call graph", "Event flow"]
          - name: "Database"
            components: ["ER diagram", "Table details", "Index analysis"]
          
      # -------------------------------------------------------------------------
      # TAB 6: DEPENDENCIES (Engineers, DevOps)
      # -------------------------------------------------------------------------
      dependencies:
        order: 6
        icon: "📦"
        target_role: "Engineers, DevOps, Security"
        description: |
          Package dependency analysis showing direct, dev, and transitive deps.
          Identifies outdated packages, license risks, and security vulnerabilities.
          Interactive dependency graph for impact analysis.
        diagrams:
          - type: "Dependency Tree"
            library: "Cytoscape"
            description: "Interactive tree of all dependencies"
          - type: "License Distribution"
            library: "ECharts"
            description: "Pie chart of license types"
          - type: "Vulnerability Timeline"
            library: "ECharts"
            description: "CVE history over time"
        sub_tabs:
          - name: "Summary"
            components: ["Dependency counts", "Outdated warnings", "License distribution pie"]
          - name: "Packages"
            components: ["Searchable package table", "Version comparison", "Update recommendations"]
          - name: "Graph"
            components: ["Cytoscape dependency graph", "Impact analysis on select"]
          - name: "Licenses"
            components: ["License breakdown", "Risk assessment", "Problematic licenses list"]
            
      # -------------------------------------------------------------------------
      # TAB 7: QUALITY (Engineers, Tech Leads)
      # -------------------------------------------------------------------------
      quality:
        order: 7
        icon: "✨"
        target_role: "Engineers, Tech Leads, QA"
        description: |
          Code quality metrics including maintainability, complexity, duplication,
          and code smells. Identifies hotspots requiring attention. Technical debt
          quantified in hours with breakdown by category.
        diagrams:
          - type: "Quality Radar"
            library: "ECharts"
            description: "Radar chart of quality dimensions"
          - type: "Complexity Heatmap"
            library: "ECharts"
            description: "Heatmap of file complexity"
          - type: "Technical Debt Breakdown"
            library: "ECharts"
            description: "Sunburst of debt by category"
        sub_tabs:
          - name: "Scores"
            components: ["Quality radar chart", "Technical debt card", "Trend lines"]
          - name: "Complexity"
            components: ["Complexity histogram", "Hotspots heatmap", "Top 10 complex files"]
          - name: "Code Smells"
            components: ["Filterable smells table", "Category breakdown", "Severity distribution"]
          - name: "Duplication"
            components: ["Duplication percentage", "Clone map visualization", "Affected files"]
            
      # -------------------------------------------------------------------------
      # TAB 8: METRICS (Engineers, Managers)
      # -------------------------------------------------------------------------
      metrics:
        order: 8
        icon: "📈"
        target_role: "Engineers, Managers, Analysts"
        description: |
          Quantitative code metrics with trends over time. Lines of code, file counts,
          language distribution, complexity trends, and velocity indicators.
          Historical data shows improvement or degradation.
        diagrams:
          - type: "LOC Trend"
            library: "ECharts"
            description: "Line chart of code growth over time"
          - type: "Language Distribution"
            library: "ECharts"
            description: "Stacked bar of languages"
          - type: "Velocity Chart"
            library: "ECharts"
            description: "Commits/changes over time"
        sub_tabs:
          - name: "Summary"
            components: ["Metrics cards grid", "Health trend line", "Key indicators"]
          - name: "Trends"
            components: ["30-day health chart", "LOC growth chart", "Coverage trend"]
          - name: "Breakdown"
            components: ["Language breakdown", "File type distribution", "Complexity histogram"]
            
      # -------------------------------------------------------------------------
      # TAB 9: SECURITY (Security Team, DevOps)
      # -------------------------------------------------------------------------
      security:
        order: 9
        icon: "🔒"
        target_role: "Security Team, DevOps, Compliance"
        description: |
          Security vulnerability dashboard with OWASP compliance, CVE tracking,
          secrets scanning, and dependency vulnerabilities. Severity-based filtering
          and remediation guidance.
        diagrams:
          - type: "Security Score Gauge"
            library: "ECharts"
            description: "Overall security health gauge"
          - type: "OWASP Radar"
            library: "ECharts"
            description: "Radar chart of OWASP Top 10 compliance"
          - type: "Vulnerability Trend"
            library: "ECharts"
            description: "Open vs resolved over time"
        sub_tabs:
          - name: "Overview"
            components: ["Security score gauge", "Severity distribution pie", "OWASP radar"]
          - name: "Vulnerabilities"
            components: ["Sortable table", "Severity filter", "Status filter", "Remediation links"]
          - name: "Dependencies"
            components: ["Vulnerable packages list", "CVE details", "Upgrade paths"]
          - name: "Secrets"
            components: ["Scan status", "Findings (redacted)", "Rotation recommendations"]
            
      # -------------------------------------------------------------------------
      # TAB 10: TESTING (QA, Engineers)
      # -------------------------------------------------------------------------
      testing:
        order: 10
        icon: "🧪"
        target_role: "QA Engineers, Developers"
        description: |
          Test coverage analysis with test pyramid visualization. Identifies
          uncovered critical paths, flaky tests, and coverage gaps. Shows
          test health trends over time.
        diagrams:
          - type: "Test Pyramid"
            library: "ECharts"
            description: "Pyramid showing unit/integration/e2e distribution"
          - type: "Coverage Treemap"
            library: "ECharts"
            description: "Treemap of coverage by module"
          - type: "Flaky Test Chart"
            library: "ECharts"
            description: "Bar chart of flaky test frequency"
        sub_tabs:
          - name: "Coverage"
            components: ["Test pyramid visualization", "Coverage by module treemap", "Uncovered files"]
          - name: "Health"
            components: ["Pass rate trend", "Flaky tests list", "Failure patterns"]
          - name: "Gaps"
            components: ["Uncovered critical paths", "Risk assessment", "Test recommendations"]
            
      # -------------------------------------------------------------------------
      # TAB 11: REFACTORING (Engineers)
      # -------------------------------------------------------------------------
      refactoring:
        order: 11
        icon: "🔧"
        target_role: "Engineers, Tech Leads"
        description: |
          Prioritized refactoring recommendations with effort estimates and ROI.
          Shows before/after code examples and impact analysis. Helps engineers
          plan technical debt reduction.
        llm_instructions: |
          Generate refactoring guidance explaining:
          - Current problem in plain language
          - Proposed solution with approach
          - Expected benefits (maintainability, performance, security)
          - Effort estimate and ROI score
        diagrams:
          - type: "Priority Matrix"
            library: "ECharts"
            description: "Scatter plot of effort vs impact"
          - type: "ROI Chart"
            library: "ECharts"
            description: "Bar chart of recommendations by ROI"
        components:
          - "Priority filter (Critical/High/Medium/Low)"
          - "Category filter (complexity, duplication, smell, security)"
          - "Effort estimation chart"
          - "Recommendation cards with before/after code (Prism.js)"
          - "ROI calculator display"
          - "File impact list"
          
      # -------------------------------------------------------------------------
      # TAB 12: LENS ANALYSIS (Architects, Senior Engineers)
      # -------------------------------------------------------------------------
      lens:
        order: 12
        icon: "🔍"
        target_role: "Architects, Senior Engineers"
        description: |
          CORTEX LENS unified intelligence results including pattern detection,
          capability discovery, vendor analysis, and architectural insights.
          Deep technical analysis for advanced users.
        diagrams:
          - type: "Pattern Radar"
            library: "ECharts"
            description: "Radar of detected design patterns"
          - type: "Capability Coverage"
            library: "ECharts"
            description: "Gauge of capability coverage percentage"
          - type: "Vendor Risk Matrix"
            library: "ECharts"
            description: "Heatmap of vendor dependencies by risk"
        sub_tabs:
          - name: "Patterns"
            components: ["Pattern detection radar", "Pattern locations table", "Confidence scores"]
          - name: "Capabilities"
            components: ["Capability coverage chart", "Discovered features list", "Gap analysis"]
          - name: "Vendors"
            components: ["Vendor breakdown", "Risk matrix", "License compliance"]
          - name: "Insights"
            components: ["Architecture summary", "Recommendations", "Anomaly detection"]
            
      # -------------------------------------------------------------------------
      # TAB 13: CODE EXPLORER (Engineers)
      # -------------------------------------------------------------------------
      code_explorer:
        order: 13
        icon: "🗂️"
        target_role: "Engineers, New Team Members"
        status: "NEW TAB"
        description: |
          Interactive code visualization for engineers to explore the codebase.
          Directory treemap, file browser with metrics overlay, call graphs,
          and import relationships. Helps engineers navigate and understand code.
        diagrams:
          - type: "Directory Treemap"
            library: "ECharts"
            description: "Treemap of directories sized by LOC, colored by complexity"
          - type: "Call Graph"
            library: "Cytoscape"
            description: "Interactive function call graph"
          - type: "Import Graph"
            library: "Cytoscape"
            description: "File import relationships"
          - type: "Module Coupling"
            library: "D3 Chord"
            description: "Chord diagram of module interdependencies"
        sub_tabs:
          - name: "Structure"
            components: ["Directory treemap", "File list with metrics", "Size/complexity filter"]
          - name: "Call Graph"
            components: ["Interactive call graph", "Function search", "Path finder"]
          - name: "Imports"
            components: ["Import graph", "Circular dependency detector", "Unused imports"]
          - name: "Coupling"
            components: ["Module coupling matrix", "Chord diagram", "Decoupling suggestions"]

  null_handling_patterns:
    data_show_if:
      syntax: 'data-show-if="path.to.value"'
      behavior: "Show element only if value is truthy"
      
    data_hide_if:
      syntax: 'data-hide-if="path.to.value"'
      behavior: "Hide element if value is truthy"
      
    data_fallback:
      syntax: 'data-fallback="N/A"'
      behavior: "Show fallback when value is null/undefined"
      
    tab_visibility:
      implementation: |
        // In CortexDashboard.initTabVisibility()
        const tabRules = {
          'architecture-tab': () => !!this.data?.architecture,
          'testing-tab': () => !!this.data?.testing,
          'executive-tab': () => !!this.data?.executive,
        };
        
    chart_empty_state:
      implementation: |
        // In ChartFactory
        static createChart(container, data, options) {
          if (!container) return null;
          if (!data || (Array.isArray(data) && data.length === 0)) {
            container.innerHTML = `
              <div class="chart-empty-state">
                <span class="chart-empty-icon">📭</span>
                <span class="chart-empty-text">No data available</span>
              </div>
            `;
            return null;
          }
          // ... create chart
        }

---
# ============================================================================
# REPO ONBOARDING ORCHESTRATOR
# ============================================================================

repo_onboarding:
  orchestrator_flow: |
    ┌─────────────────────────────────────────────────────────────────┐
    │           RepositoryOnboardingOrchestrator                       │
    │                                                                  │
    │  INPUT: repo_path, options                                       │
    │                                                                  │
    │  STEP 1: Schema Enhancement Detection                            │
    │  ┌─────────────────────────────────────────────────────────┐    │
    │  │ - Scan repo with Copilot (manual GitHub Copilot scan)   │    │
    │  │ - Detect new tab requirements (e.g., GraphQL API found) │    │
    │  │ - If new tabs needed:                                    │    │
    │  │   a. Enhance schema (add to JSON schema v3.x)           │    │
    │  │   b. Enhance dashboard.html (add tab button + panel)    │    │
    │  │   c. Migrate ALL existing repo JSONs to new schema      │    │
    │  └─────────────────────────────────────────────────────────┘    │
    │                              │                                   │
    │                              ▼                                   │
    │  STEP 2: LENS Full Analysis                                      │
    │  ┌─────────────────────────────────────────────────────────┐    │
    │  │ - ASTAnalyzer → functions, classes, imports             │    │
    │  │ - GitHistoryAnalyzer → commits, contributors, hotspots  │    │
    │  │ - ConfigAnalyzer → dependencies, settings               │    │
    │  │ - DependencyAnalyzer → packages, versions, licenses     │    │
    │  │ - SecurityScanner → vulnerabilities, OWASP              │    │
    │  │ - CodeSmellDetector → smells, complexity                │    │
    │  │ - APIAnalyzer → endpoints, parameters                   │    │
    │  │ - DatabaseAnalyzer → schema, tables, relationships      │    │
    │  │ - PatternDiscoveryEngine → design patterns              │    │
    │  │ - UseCaseExtractor → features from docs/tests           │    │
    │  └─────────────────────────────────────────────────────────┘    │
    │                              │                                   │
    │                              ▼                                   │
    │  STEP 3: LLM Business Language Generation                        │
    │  ┌─────────────────────────────────────────────────────────┐    │
    │  │ - Generate prompts for Copilot in VSCode:               │    │
    │  │   • Overview.business_summary                           │    │
    │  │   • Overview.key_findings                               │    │
    │  │   • Use_cases[].description                             │    │
    │  │   • Use_cases[].business_value                          │    │
    │  │   • Refactoring[].description                           │    │
    │  │   • Architecture.summary                                │    │
    │  │   • Executive.risk_summary                              │    │
    │  │ - User reviews/approves LLM-generated content           │    │
    │  └─────────────────────────────────────────────────────────┘    │
    │                              │                                   │
    │                              ▼                                   │
    │  STEP 4: JSON Aggregation                                        │
    │  ┌─────────────────────────────────────────────────────────┐    │
    │  │ - DashboardDataAggregator.aggregate_all()               │    │
    │  │ - Validate against schema v3.0                          │    │
    │  │ - Handle null fields gracefully                         │    │
    │  │ - Output: repos/{slug}/dashboard-data.json              │    │
    │  └─────────────────────────────────────────────────────────┘    │
    │                              │                                   │
    │                              ▼                                   │
    │  STEP 5: Registry Update                                         │
    │  ┌─────────────────────────────────────────────────────────┐    │
    │  │ - Add entry to registry.json                            │    │
    │  │ - Include: slug, display_name, icon, health, LOC, tags  │    │
    │  │ - Backup existing registry before modification          │    │
    │  └─────────────────────────────────────────────────────────┘    │
    │                                                                  │
    │  OUTPUT: DashboardGenerationResult                               │
    │  - dashboard_path: Path to generated JSON                        │
    │  - registry_updated: boolean                                     │
    │  - schema_enhanced: boolean                                      │
    │  - llm_prompts_pending: string[] (if manual review needed)      │
    └─────────────────────────────────────────────────────────────────┘
  
  schema_enhancement_detection:
    triggers:
      - "GraphQL schema detected → Add GraphQL tab"
      - "Kubernetes manifests found → Add Infrastructure tab"
      - "gRPC proto files found → Add gRPC API section"
      - "Machine learning models detected → Add ML/AI tab"
      - "Mobile app structure → Add Platform-specific tabs"
      
    enhancement_workflow: |
      1. Copilot scans new repo (manual in VSCode)
      2. Copilot identifies unique characteristics
      3. If new tab/component needed:
         a. Update json_schema_v3 (add new section)
         b. Update dashboard.html (add tab button + panel)
         c. Update app.js (add rendering logic)
         d. Run migration on ALL existing repos:
            - Read each dashboard-data.json
            - Add new section with null/default values
            - Write updated JSON
         e. Increment schema version (3.0 → 3.1)
      4. Proceed with normal onboarding
      
  llm_integration:
    approach: "Human-in-the-loop via GitHub Copilot in VSCode"
    workflow: |
      1. Orchestrator extracts raw data from LENS analyzers
      2. Orchestrator generates prompts for LLM generation:
         
         PROMPT: business_summary
         ```
         Based on this repository analysis:
         - Primary Language: Python
         - Frameworks: FastAPI, Pydantic, SQLAlchemy
         - Total Files: 850
         - Lines of Code: 125,000
         - Test Coverage: 78%
         - Main Capabilities: API server, Data processing, MCP tools
         
         Write a 2-3 paragraph executive summary in business language
         suitable for executives and product owners. Explain what the
         system does, its key capabilities, and business value.
         Do NOT use technical jargon.
         ```
         
      3. User triggers Copilot completion in VSCode
      4. User reviews and adjusts generated content
      5. Content saved to JSON
      
    prompts_template:
      overview_business_summary: |
        Based on repository analysis:
        {analysis_summary}
        
        Write a 2-3 paragraph executive summary in business language.
        Target audience: Business leaders, Product Owners, new team members.
        Explain: What the system does, key capabilities, business value.
        Avoid technical jargon. Focus on outcomes and benefits.
        
      use_case_description: |
        For use case: {use_case_title}
        Code references: {code_files}
        API endpoints: {endpoints}
        
        Write a business-friendly description (3-5 sentences) explaining:
        - What this feature enables
        - Who benefits from it
        - How it works (non-technical)
        
      use_case_business_value: |
        For use case: {use_case_title}
        Category: {category}
        
        Write a value proposition (2-3 sentences) including:
        - Quantified benefits where possible
        - Time/cost savings
        - Risk reduction
        
      refactoring_description: |
        Refactoring opportunity:
        Type: {smell_type}
        Location: {location}
        Current code issues: {issues}
        
        Write a clear explanation (3-4 sentences) covering:
        - Current problem in plain language
        - Proposed solution
        - Expected benefits

---
# ============================================================================
# MCP TOOLS SPECIFICATION
# ============================================================================

mcp_tools:
  cortex_onboard_repository:
    name: "cortex_onboard_repository"
    description: |
      Onboard a new repository to the CORTEX dashboard system.
      Runs full LENS analysis, generates LLM prompts for business language,
      creates dashboard-data.json, and updates registry.json.
    parameters:
      repo_path:
        type: "string"
        required: true
        description: "Absolute path to repository root"
      repo_name:
        type: "string"
        required: false
        description: "Display name (defaults to folder name)"
      icon:
        type: "string"
        default: "📁"
        description: "Emoji icon for landing page tile"
      tags:
        type: "array"
        items: "string"
        description: "Tags for categorization"
      analysis_depth:
        type: "string"
        enum: ["quick", "standard", "deep"]
        default: "standard"
        description: |
          quick: Metrics only (~30 seconds)
          standard: Full analysis (~2 minutes)
          deep: Including security scans (~5 minutes)
      generate_llm_prompts:
        type: "boolean"
        default: true
        description: "Generate prompts for LLM business language"
      auto_update_registry:
        type: "boolean"
        default: true
        description: "Auto-add to registry.json"
    returns:
      success: "boolean"
      dashboard_path: "string"
      registry_updated: "boolean"
      schema_enhanced: "boolean"
      llm_prompts: "array - Prompts for Copilot if generate_llm_prompts=true"
      analysis_summary:
        total_files: "number"
        total_loc: "number"
        health_score: "number"
        vulnerabilities: "number"
        duration_ms: "number"
        
  cortex_regenerate_dashboard:
    name: "cortex_regenerate_dashboard"
    description: "Re-run analysis for existing repo and update its JSON"
    parameters:
      repo_slug:
        type: "string"
        required: true
        description: "Slug of existing repo in registry"
      analysis_depth:
        type: "string"
        enum: ["quick", "standard", "deep"]
        default: "standard"
      preserve_llm_content:
        type: "boolean"
        default: true
        description: "Keep existing LLM-generated content"
    returns:
      success: "boolean"
      changes_detected: "array - Changed sections"
      
  cortex_enhance_schema:
    name: "cortex_enhance_schema"
    description: "Add new tabs/components to the dashboard schema"
    parameters:
      enhancement_type:
        type: "string"
        enum: ["new_tab", "new_sub_tab", "new_field"]
        required: true
      tab_name:
        type: "string"
        required: true
      schema_definition:
        type: "object"
        required: true
        description: "JSON schema for new section"
      migrate_existing:
        type: "boolean"
        default: true
        description: "Migrate all existing repos to new schema"
    returns:
      success: "boolean"
      repos_migrated: "number"
      new_schema_version: "string"
      
  cortex_migrate_repos:
    name: "cortex_migrate_repos"
    description: "Migrate all repos to a new schema version"
    parameters:
      target_version:
        type: "string"
        required: true
        description: "Target schema version (e.g., '3.1')"
      dry_run:
        type: "boolean"
        default: true
        description: "Preview changes without applying"
    returns:
      success: "boolean"
      repos_migrated: "number"
      changes: "array - [{repo, changes}]"
      
  cortex_validate_dashboard_data:
    name: "cortex_validate_dashboard_data"
    description: "Validate a dashboard-data.json against schema"
    parameters:
      json_path:
        type: "string"
        required: true
    returns:
      valid: "boolean"
      errors: "array - Validation errors"
      warnings: "array - Non-critical issues"

---
# ============================================================================
# IMPLEMENTATION PHASES
# ============================================================================

implementation_phases:
  phase_1:
    name: "Core Infrastructure & Schema v3.0"
    duration: "Week 1"
    deliverables:
      - id: "P21-001"
        title: "JSON Schema v3.0 Definition"
        file: "cortex/models/dashboard_schema_v3.py"
        tests: "tests/unit/models/test_dashboard_schema_v3.py"
        description: "Pydantic models for complete v3.0 schema"
        acceptance_criteria:
          - "All 12 sections defined with validation"
          - "Null-safe field definitions"
          - "JSON serialization/deserialization"
          - "Schema version tracking"
          
      - id: "P21-002"
        title: "Enhanced DashboardDataAggregator"
        file: "cortex/lens/dashboard_data_aggregator_v3.py"
        tests: "tests/unit/lens/test_dashboard_data_aggregator_v3.py"
        description: "Aggregator supporting v3.0 schema"
        acceptance_criteria:
          - "aggregate_*() for all 12 sections"
          - "LENS analyzer integration"
          - "LLM prompt generation"
          - "Null handling"
          
      - id: "P21-003"
        title: "RegistryManager Enhancement"
        file: "cortex/visualization/registry_manager.py"
        tests: "tests/unit/visualization/test_registry_manager.py"
        description: "Registry.json management with backup"
        acceptance_criteria:
          - "CRUD operations"
          - "Atomic writes with backup"
          - "Schema migration support"
          
  phase_2:
    name: "LENS Integration & Analyzers"
    duration: "Week 2"
    deliverables:
      - id: "P21-004"
        title: "Security Scanner Integration"
        file: "cortex/lens/security_scanner.py"
        description: "Unified security scanning"
        acceptance_criteria:
          - "Bandit integration for Python"
          - "npm audit for JavaScript"
          - "OWASP rule matching"
          - "CVE lookup for dependencies"
          
      - id: "P21-005"
        title: "Code Smell Detector"
        file: "cortex/quality/code_smell_detector.py"
        description: "Detect code smells and complexity"
        acceptance_criteria:
          - "God Class detection (>1000 LOC)"
          - "Long Method detection (>50 lines)"
          - "Cyclomatic complexity calculation"
          - "Duplication detection"
          
      - id: "P21-006"
        title: "Pattern Discovery Engine"
        file: "cortex/lens/patterns/pattern_discovery_engine.py"
        description: "Detect design patterns"
        acceptance_criteria:
          - "Repository, Factory, Strategy patterns"
          - "Confidence scoring"
          - "Location references"
          
      - id: "P21-007"
        title: "Use Case Extractor"
        file: "cortex/documentation/use_case_extractor.py"
        description: "Extract use cases from code/docs"
        acceptance_criteria:
          - "README.md parsing"
          - "Docstring extraction"
          - "Test file analysis"
          - "API endpoint discovery"
          
  phase_3:
    name: "UI Enhancement & New Tabs"
    duration: "Week 3"
    deliverables:
      - id: "P21-008"
        title: "Dashboard.html v3.0 Update"
        file: "company/dashboards/spa/dashboard.html"
        description: "Add new tabs (Architecture, Testing, Executive)"
        acceptance_criteria:
          - "12 tabs with sub-tabs"
          - "Conditional tab visibility"
          - "Updated styling for new tabs"
          
      - id: "P21-009"
        title: "D3.js Integration for Graphs"
        files:
          - "company/dashboards/spa/js/charts/D3Charts.js"
          - "company/dashboards/spa/vendor/d3.min.js"
        description: "Add D3 visualizations"
        acceptance_criteria:
          - "Force-directed dependency graph"
          - "Sankey data flow diagram"
          - "Hierarchical tree for architecture"
          
      - id: "P21-010"
        title: "Enhanced ChartFactory"
        file: "company/dashboards/spa/js/charts/ChartFactory.js"
        description: "Support new chart types"
        acceptance_criteria:
          - "Heatmap charts"
          - "Treemap charts"
          - "Sunburst charts"
          - "Empty state handling"
          
      - id: "P21-011"
        title: "Dynamic Data Loading"
        file: "company/dashboards/spa/js/app.js"
        description: "Load JSON from URL parameter"
        acceptance_criteria:
          - "?repo=slug parameter support"
          - "Fetch from repos/{slug}/dashboard-data.json"
          - "Loading states"
          - "Error boundaries"
          
  phase_4:
    name: "Orchestrator & MCP Tools"
