# ============================================================================
# DEPLOYMENT & HTTP SERVING (Environment-Adaptive)
# ============================================================================

deployment:
  http_serving:
    requirement: "MUST serve via HTTP, NOT file://"
    philosophy: |
      The server selection is ENVIRONMENT-ADAPTIVE. The system will detect
      the user's environment and recommend the best serving option automatically.
      All options produce identical results - choose based on your context.
    
    # =========================================================================
    # AUTOMATIC SERVER DETECTION (serve.py script)
    # =========================================================================
    auto_detect:
      script: "company/dashboards/serve.py"
      description: |
        Python script that detects environment and starts best available server.
        Checks in order: Docker → Node.js → Python → PowerShell
      usage: "python serve.py [--port 8080] [--open]"
      detection_logic: |
        1. Check if Docker is available → use nginx:alpine container
        2. Check if Node.js is available → use http-server or live-server
        3. Check if Python 3 is available → use python -m http.server
        4. Windows: use PowerShell HttpListener
        5. Fallback: Print manual instructions
      features:
        - "Auto-opens browser on start"
        - "Graceful shutdown handling"
        - "Port conflict detection"
        - "Live reload support (if available)"
    
    # =========================================================================
    # SERVING OPTIONS (in preference order)
    # =========================================================================
    
    option_1_docker:
      name: "Docker (Recommended for Production)"
      when_to_use: "Production, CI/CD, team environments"
      command: |
        cd company/dashboards
        docker-compose up -d
      url: "http://localhost:8080"
      features:
        - "Nginx with optimized config"
        - "GZIP compression"
        - "Proper caching headers"
        - "Consistent across environments"
      docker_compose: |
        version: '3.8'
        services:
          dashboard:
            image: nginx:alpine
            ports:
              - "8080:80"
            volumes:
              - ./:/usr/share/nginx/html:ro
              - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            restart: unless-stopped
            healthcheck:
              test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
              interval: 30s
              timeout: 10s
              retries: 3
              
    option_2_nodejs:
      name: "Node.js (Best for Development)"
      when_to_use: "Development with live reload, frontend work"
      commands:
        http_server: |
          npx http-server company/dashboards -p 8080 --cors -c-1
        live_server: |
          npx live-server company/dashboards --port=8080 --no-browser
        serve: |
          npx serve company/dashboards -l 8080
      url: "http://localhost:8080"
      features:
        - "No installation required (npx)"
        - "Live reload option"
        - "CORS support"
        - "Cache control"
        
    option_3_python:
      name: "Python (Quick & Universal)"
      when_to_use: "Quick testing, minimal setup, Python environments"
      commands:
        python3: |
          cd company/dashboards
          python -m http.server 8080
        python3_bind: |
          cd company/dashboards
          python -m http.server 8080 --bind 0.0.0.0
      url: "http://localhost:8080"
      features:
        - "Zero dependencies"
        - "Available on most systems"
        - "Simple and reliable"
      note: "Development only - no caching, compression, or SPA routing"
      
    option_4_powershell:
      name: "PowerShell (Windows Native)"
      when_to_use: "Windows without Python/Node/Docker"
      script: |
        # company/dashboards/serve.ps1
        $port = 8080
        $root = $PSScriptRoot
        $listener = New-Object System.Net.HttpListener
        $listener.Prefixes.Add("http://localhost:$port/")
        $listener.Start()
        Write-Host "Serving at http://localhost:$port"
        Start-Process "http://localhost:$port"
        
        while ($listener.IsListening) {
            $context = $listener.GetContext()
            $request = $context.Request
            $response = $context.Response
            
            $localPath = $request.Url.LocalPath
            if ($localPath -eq "/") { $localPath = "/index.html" }
            $filePath = Join-Path $root $localPath
            
            if (Test-Path $filePath -PathType Leaf) {
                $content = [System.IO.File]::ReadAllBytes($filePath)
                $response.ContentType = Get-MimeType $filePath
                $response.OutputStream.Write($content, 0, $content.Length)
            } else {
                $response.StatusCode = 404
            }
            $response.Close()
        }
      url: "http://localhost:8080"
      
    option_5_iis:
      name: "IIS (Windows Server)"
      when_to_use: "Windows Server production environment"
      setup: |
        1. Create IIS site pointing to company/dashboards
        2. Add web.config for SPA routing:
           <configuration>
             <system.webServer>
               <rewrite>
                 <rules>
                   <rule name="SPA" stopProcessing="true">
                     <match url=".*" />
                     <conditions>
                       <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                     </conditions>
                     <action type="Rewrite" url="/index.html" />
                   </rule>
                 </rules>
               </rewrite>
               <staticContent>
                 <mimeMap fileExtension=".json" mimeType="application/json" />
               </staticContent>
             </system.webServer>
           </configuration>
           
    option_6_nginx_standalone:
      name: "Nginx (Linux/Mac Production)"
      when_to_use: "Production on Linux/Mac without Docker"
      config: |
        server {
            listen 80;
            server_name dashboards.cortex.local;
            root /var/www/cortex-dashboards;
            index index.html;
            
            # SPA routing
            location / {
                try_files $uri $uri/ /index.html;
            }
            
            # Sharded repo data with no-cache
            location /repos/ {
                alias /var/www/cortex-dashboards/repos/;
                add_header Cache-Control "no-cache, must-revalidate";
                add_header Access-Control-Allow-Origin "*";
            }
            
            # Static assets with long cache
            location /spa/ {
                alias /var/www/cortex-dashboards/spa/;
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
            
            # GZIP for JSON and assets
            gzip on;
            gzip_types application/json text/css application/javascript text/plain;
            gzip_min_length 1000;
        }
        
  production_checklist:
    - "✅ HTTPS enabled (use reverse proxy or load balancer)"
    - "✅ CSP headers configured"
    - "✅ GZIP compression enabled"
    - "✅ Cache headers: no-cache for JSON, long-cache for static"
    - "✅ CDN for vendor libraries (optional)"
    - "✅ Error logging configured"
    - "✅ Health checks for container/service"
    - "✅ Rate limiting if public-facing"

