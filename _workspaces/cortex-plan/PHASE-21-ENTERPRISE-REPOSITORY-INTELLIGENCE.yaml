# ============================================================================
# EXECUTIVE VISION
# ============================================================================

vision:
  mission: |
    Create an enterprise-grade Repository Intelligence Platform that:
    1. Reverse-engineers ANY codebase using CORTEX LENS crawlers
    2. Generates LLM-enhanced business-language documentation
    3. Provides beautiful, scalable dashboards for hundreds of repositories
    4. Enables business leaders and new team members to understand code instantly
    5. Serves as the single source of truth for all repository metrics and insights
    
  target_personas:
    - name: "Business Leaders & Executives"
      needs: "High-level KPIs, risk assessment, investment priorities"
      solution: "Executive Summary tab with business-language insights"
      
    - name: "Product Owners"
      needs: "Feature inventory, use case documentation, roadmap alignment"
      solution: "Use Cases tab with business value mapping"
      
    - name: "New Team Members"
      needs: "Quick onboarding, codebase understanding, architecture overview"
      solution: "Overview + Architecture tabs with visual diagrams"
      
    - name: "Software Engineers"
      needs: "Code quality metrics, technical debt, refactoring priorities"
      solution: "Quality, Metrics, Refactoring tabs with file-level drill-down"
      
    - name: "Security Teams"
      needs: "Vulnerability tracking, OWASP compliance, risk heatmaps"
      solution: "Security tab with severity-based filtering"
      
    - name: "Architects"
      needs: "Dependency analysis, pattern detection, layer compliance"
      solution: "Architecture + LENS tabs with visual graphs"
  
  key_outcomes:
    - "Single index.html displaying tiles for ALL onboarded repositories"
    - "Single dashboard.html loading ANY repo's data dynamically"
    - "MCP tool: cortex_onboard_repository for complete repo intelligence"
    - "LLM-generated business-language for Executive, Overview, and Use Cases"
    - "Schema v3.0 supporting 13 tabs with role-specific content"
    - "HTTP-served SPA with environment-adaptive server detection"
    - "Auto-hiding components when data unavailable"
    - "SQLite data layer via sql.js (WASM) — single solution for low/high volume"
    - "Native SQL pagination, search, filtering — zero external dependencies"
    - "Domain Model UML diagrams from company/domains YAML files"
    - "Interactive code visualization with Cytoscape"
    - "Separate dashboard.sqlite per repo (SOLID compliance with cortex.db)"
    - "Seamless scalability path: local sql.js → enterprise PostgreSQL/Vector DB"

