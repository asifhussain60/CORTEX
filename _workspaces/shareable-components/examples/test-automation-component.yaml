# Test Automation Component Example
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: Reference implementation for test automation component

metadata:
  component_name: cortex-test-automation
  version: 1.0.0
  description: CORTEX-powered test generation from ADO work items
  author: CORTEX Team
  domain: testing
  inspired_by: Platform.Classic.Tests/ai-test-generator

# =============================================================================
# COMPONENT REGISTRATION
# =============================================================================

registration:
  decorator: |
    @register_component(
        name="test-automation",
        version="1.0.0",
        description="Generate test code from ADO work items using CORTEX patterns",
        author="cortex-team",
        domain="testing",
        dependencies=["cortex-components", "mcp", "aiohttp"],
        governance_rules=["CORE-008", "CORE-011", "CORE-012", "CORE-027"]
    )
    class TestAutomationComponent(CORTEXComponent):
        pass

# =============================================================================
# MCP TOOLS
# =============================================================================

mcp_tools:
  - name: generate_test
    description: Generate test code from an Azure DevOps work item
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: ADO work item ID (e.g., "12345")
        output_format:
          type: string
          enum: [pytest, unittest, nunit]
          default: pytest
          description: Test framework format
        include_fixtures:
          type: boolean
          default: true
          description: Include fixture/setup code
      required: [ticket_id]
    output:
      type: object
      properties:
        test_file:
          type: string
          description: Generated test file content
        test_count:
          type: integer
          description: Number of test cases generated
        framework_detected:
          type: string
          description: Detected test framework
          
  - name: scan_framework
    description: Analyze test framework patterns in repository
    input_schema:
      type: object
      properties:
        repo_path:
          type: string
          description: Path to repository (default: current directory)
        deep_scan:
          type: boolean
          default: false
          description: Perform deep analysis of test patterns
      required: []
    output:
      type: object
      properties:
        framework:
          type: string
        patterns:
          type: array
        recommendations:
          type: array
          
  - name: validate_tests
    description: Validate generated tests for syntax and patterns
    input_schema:
      type: object
      properties:
        test_code:
          type: string
          description: Test code to validate
        framework:
          type: string
          enum: [pytest, unittest, nunit]
      required: [test_code]

# =============================================================================
# INTERNAL TOOLS
# =============================================================================

internal_tools:
  ado_client:
    description: Azure DevOps work item fetcher
    methods:
      - fetch_work_item(ticket_id: str) -> WorkItem
      - get_acceptance_criteria(work_item: WorkItem) -> List[str]
      - get_attachments(work_item: WorkItem) -> List[Attachment]
      
  framework_scanner:
    description: Test framework analyzer
    methods:
      - scan_repository(path: str) -> FrameworkInfo
      - detect_patterns(framework: FrameworkInfo) -> List[Pattern]
      - get_conventions(framework: FrameworkInfo) -> Conventions
      
  test_generator:
    description: Test code generator
    methods:
      - generate_tests(work_item: WorkItem, framework: FrameworkInfo) -> TestCode
      - apply_patterns(code: TestCode, patterns: List[Pattern]) -> TestCode
      - format_output(code: TestCode, format: str) -> str

# =============================================================================
# COMPONENT KNOWLEDGE
# =============================================================================

knowledge:
  domain_file: testing.yaml
  topics:
    - test_patterns
    - tdd_best_practices
    - framework_conventions
    - fixture_patterns
    - assertion_patterns
    
  sample_content: |
    # testing.yaml
    test_patterns:
      arrange_act_assert:
        description: Standard test structure
        template: |
          def test_example():
              # Arrange
              input_data = create_test_data()
              
              # Act
              result = function_under_test(input_data)
              
              # Assert
              assert result == expected_value
              
      given_when_then:
        description: BDD-style test structure
        template: |
          def test_example():
              # Given
              context = setup_context()
              
              # When
              action_performed(context)
              
              # Then
              verify_outcome(context)

# =============================================================================
# GOVERNANCE RULES
# =============================================================================

governance:
  applied_rules:
    CORE-008:
      description: TDD Required
      application: Validate tests exist before implementation guidance
      
    CORE-011:
      description: Type Hints Required
      application: Generated test code includes type hints
      
    CORE-012:
      description: Docstrings Required
      application: Generated tests include docstrings
      
    CORE-027:
      description: Audit Trail
      application: All generation operations logged

# =============================================================================
# PACKAGE STRUCTURE
# =============================================================================

package_structure:
  root: cortex-test-automation/
  files:
    pyproject.toml: |
      [build-system]
      requires = ["hatchling"]
      build-backend = "hatchling.build"
      
      [project]
      name = "cortex-test-automation"
      version = "1.0.0"
      description = "CORTEX-powered test generation"
      authors = [{name = "CORTEX Team"}]
      requires-python = ">=3.10"
      dependencies = [
          "cortex-components>=1.0.0",
          "mcp>=1.0.0",
          "aiohttp>=3.8.0"
      ]
      
      [project.optional-dependencies]
      cortex = ["cortex>=6.0.0"]
      
      [project.scripts]
      cortex-test-automation = "cortex_test_automation.cli:main"
      
      [project.entry-points."cortex.components"]
      test-automation = "cortex_test_automation:TestAutomationComponent"
      
    README.md: |
      # CORTEX Test Automation Component
      
      Generate test code from Azure DevOps work items.
      
      ## Installation
      
      ```bash
      pip install cortex-test-automation
      ```
      
      ## Usage
      
      ### As MCP Server (Standalone)
      
      ```bash
      cortex-test-automation serve
      ```
      
      Add to Copilot MCP config:
      ```json
      {
        "servers": {
          "cortex-test-automation": {
            "command": "cortex-test-automation",
            "args": ["serve"]
          }
        }
      }
      ```
      
      ### Programmatic
      
      ```python
      from cortex_test_automation import TestAutomationComponent
      
      component = TestAutomationComponent()
      result = await component.execute("generate_test", {
          "ticket_id": "12345"
      })
      ```
      
  directories:
    src/cortex_test_automation/:
      __init__.py: Export component class
      component.py: Main component implementation
      cli.py: CLI entry point
      tools/:
        __init__.py: Tool exports
        ado_client.py: ADO integration
        framework_scanner.py: Framework analysis
        test_generator.py: Test generation
      knowledge/:
        testing.yaml: Domain knowledge
      
    tests/:
      test_component.py: Component tests
      test_tools.py: Tool tests

# =============================================================================
# USAGE EXAMPLES
# =============================================================================

usage_examples:
  standalone_mcp:
    description: Use as standalone MCP server
    steps:
      - Install: pip install cortex-test-automation
      - Configure Copilot MCP
      - Use via Copilot: "Generate tests for ADO-12345"
      
  integrated_cortex:
    description: Use within full CORTEX
    code: |
      from cortex.orchestrators.core import MasterOrchestrator
      
      orchestrator = MasterOrchestrator()
      result = await orchestrator.execute_operation(
          "test-automation.generate_test",
          {"ticket_id": "12345"}
      )
      
  programmatic:
    description: Direct programmatic usage
    code: |
      from cortex_test_automation import TestAutomationComponent
      
      # Standalone mode (default)
      component = TestAutomationComponent()
      
      # Or integrated mode
      component = TestAutomationComponent(integrated_mode=True)
      
      # Execute
      result = await component.execute_with_governance(
          "generate_test",
          {"ticket_id": "12345", "output_format": "pytest"}
      )
      
      if result.is_ok:
          print(result.value["test_file"])
