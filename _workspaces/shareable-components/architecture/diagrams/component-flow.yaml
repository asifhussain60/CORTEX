# CORTEX Component Architecture Flow Diagram

# This YAML file describes the component architecture flow
# Can be rendered using Mermaid, PlantUML, or similar tools

metadata:
  title: "CORTEX Component Architecture"
  version: "1.0"
  author: "Asif Hussain"
  date: "2026-01-26"

---

# Diagram 1: Component Mode Selection
mode_selection:
  title: "Component Mode Selection Flow"
  mermaid: |
    flowchart TD
        A[Component Instantiation] --> B{CORTEX Available?}
        B -->|Yes| C{User Override?}
        B -->|No| D[Standalone Mode]
        C -->|Force Standalone| D
        C -->|Default/Force Integrated| E[Integrated Mode]
        
        D --> F[LightweightGovernance]
        D --> G[LightweightAudit]
        D --> H[ComponentKnowledge]
        
        E --> I[Full GovernanceRegistry]
        E --> J[EnhancedAuditLogger]
        E --> K[KnowledgeRepository]
        
        F --> L[Component Ready]
        G --> L
        H --> L
        I --> L
        J --> L
        K --> L

---

# Diagram 2: Operation Execution Flow
execution_flow:
  title: "Component Operation Execution"
  mermaid: |
    sequenceDiagram
        participant User
        participant MCP as MCP Server
        participant Component
        participant Governance
        participant Audit
        participant Operation
        
        User->>MCP: Call tool
        MCP->>Component: execute_with_governance()
        
        Component->>Governance: validate_operation()
        alt Governance Pass
            Governance-->>Component: OK
            Component->>Audit: log_operation_start()
            Audit-->>Component: operation_id
            
            Component->>Operation: execute()
            Operation-->>Component: result
            
            Component->>Audit: log_operation_complete()
            Component-->>MCP: result
            MCP-->>User: response
        else Governance Fail
            Governance-->>Component: Violation
            Component-->>MCP: Error
            MCP-->>User: Governance violation
        end

---

# Diagram 3: Standalone vs Integrated Architecture
architecture_comparison:
  title: "Standalone vs Integrated Mode"
  mermaid: |
    flowchart TB
        subgraph Standalone["Standalone Mode"]
            S1[Component]
            S2[LightweightGovernance]
            S3[LightweightAudit]
            S4[ComponentKnowledge]
            S5[MCP Server]
            
            S1 --> S2
            S1 --> S3
            S1 --> S4
            S1 --> S5
        end
        
        subgraph Integrated["Integrated Mode"]
            I1[Component]
            I2[GovernanceRegistry]
            I3[EnhancedAuditLogger]
            I4[KnowledgeRepository]
            I5[MasterOrchestrator]
            I6[DatabaseBackedRegistry]
            I7[StateManager]
            
            I1 --> I2
            I1 --> I3
            I1 --> I4
            I5 --> I1
            I6 --> I1
            I7 --> I1
        end

---

# Diagram 4: Component Registration Flow
registration_flow:
  title: "Component Registration"
  mermaid: |
    flowchart TD
        A[Developer creates component] --> B[@register_component decorator]
        B --> C[Component class defined]
        C --> D{Mode?}
        
        D -->|Standalone| E[pip package built]
        E --> F[Published to PyPI]
        F --> G[Team installs: pip install cortex-component]
        G --> H[Runs as MCP server]
        
        D -->|Integrated| I[CORTEX imports component]
        I --> J[DatabaseBackedRegistry registers]
        J --> K[MasterOrchestrator discovers]
        K --> L[Routes operations to component]

---

# Diagram 5: Progressive Enhancement Journey
enhancement_journey:
  title: "Team Adoption Journey"
  mermaid: |
    journey
        title Team Adoption of CORTEX Components
        section Discovery
          Find component package: 5: Team
          Install via pip: 5: Team
        section Standalone Usage
          Run as MCP server: 4: Team
          Use with Copilot/Claude: 5: Team
          Experience governance patterns: 4: Team
        section Exploration
          Discover more components: 4: Team
          Understand CORTEX value: 5: Team
        section Integration
          Install full CORTEX: 3: Team
          Components auto-upgrade: 5: CORTEX
          Full capabilities enabled: 5: Team

---

# Diagram 6: MasterOrchestrator Integration
master_integration:
  title: "MasterOrchestrator Component Routing"
  mermaid: |
    flowchart TD
        A[User Request] --> B[MasterOrchestrator]
        B --> C{Operation Type?}
        
        C -->|Complex Workflow| D[Full Orchestrator]
        C -->|Component Tool| E[ComponentIntegration]
        
        D --> F[TDDOrchestrator]
        D --> G[PlanningOrchestrator]
        D --> H[RefactoringOrchestrator]
        
        E --> I[Discover Component]
        I --> J[Route to Component]
        J --> K[Component.execute_with_governance]
        K --> L[Return Result]
        L --> B
        
        F --> B
        G --> B
        H --> B

---

# Diagram 7: Audit Flow Comparison
audit_comparison:
  title: "Audit Trail: Standalone vs Integrated"
  mermaid: |
    flowchart LR
        subgraph Standalone["Standalone Audit"]
            direction TB
            SA1[Operation Start] --> SA2[JSON Log Entry]
            SA2 --> SA3[Local File Storage]
            SA3 --> SA4[Basic Query API]
        end
        
        subgraph Integrated["Integrated Audit"]
            direction TB
            IA1[Operation Start] --> IA2[Hash Chain Entry]
            IA2 --> IA3[SQLite Database]
            IA3 --> IA4[EnhancedAuditLogger]
            IA4 --> IA5[Tamper Detection]
            IA5 --> IA6[Cross-Component Linking]
        end

---

# Diagram 8: Package Distribution
package_distribution:
  title: "Component Package Distribution"
  mermaid: |
    flowchart TD
        A[Component Source] --> B[pyproject.toml]
        B --> C[Build Package]
        C --> D[cortex-component-1.0.0.tar.gz]
        D --> E{Distribution}
        
        E --> F[PyPI Public]
        E --> G[Private Registry]
        E --> H[Direct Install]
        
        F --> I[pip install cortex-component]
        G --> I
        H --> I
        
        I --> J[MCP Server Mode]
        I --> K[CORTEX Integration Mode]
