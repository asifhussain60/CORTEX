# Agents vs Orchestrators Comparison
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: Detailed comparison from chat01.md discussion

metadata:
  document_id: COMP-COMPARE-001
  status: DECISION_DOCUMENT
  authority: MasterOrchestrator
  source: chat01.md architectural discussion
  decision: ORCHESTRATORS_PREFERRED_WITH_COMPONENTS
  
# =============================================================================
# EXECUTIVE SUMMARY
# =============================================================================

executive_summary:
  question: Should CORTEX adopt agent architecture like Platform.Classic.Tests?
  
  answer: NO
  
  rationale: |
    CORTEX already provides agent capabilities through orchestrators.
    The appeal of agents is simplicity, not unique capabilities.
    Solution: Make CORTEX orchestrators simpler (lightweight patterns) 
    AND add shareable components for team distribution.
    
  decision:
    primary: Keep orchestrator architecture
    enhancement_1: Add lightweight orchestrator pattern for simple tasks
    enhancement_2: Add component architecture for team shareability

# =============================================================================
# ARCHITECTURE COMPARISON
# =============================================================================

architecture_comparison:
  agents:
    definition: |
      Autonomous units that perform specific tasks independently,
      coordinated by an MCP server. Each agent handles a bounded domain.
      
    example: Platform.Classic.Tests ai-test-generator
    
    characteristics:
      - Autonomous operation
      - Linear workflows
      - Domain-specific focus
      - Lightweight (100-500 LOC per agent)
      - Easy to share (npm/pip install)
      - Zero infrastructure dependency
      
    coordination: MCP server routes requests to agents
    
    code_pattern: |
      // TypeScript agent example
      class AdoClient {
        async fetchTicket(id: string): Promise<WorkItem> {
          // Autonomous operation
        }
      }
      
      class TestGeneratorServer {
        private adoClient: AdoClient;
        private frameworkScanner: FrameworkScanner;
        
        async handleGenerateTest(params) {
          // Linear workflow
          const workItem = await this.adoClient.fetchTicket(params.id);
          const framework = await this.frameworkScanner.scan();
          return await this.generateTest(workItem, framework);
        }
      }
      
  orchestrators:
    definition: |
      Hierarchical coordination units that manage complex workflows
      with cross-cutting concerns, governed by MasterOrchestrator.
      
    example: CORTEX TDDOrchestrator, RefactoringOrchestrator
    
    characteristics:
      - Hierarchical coordination
      - Complex workflow support
      - Cross-cutting concern integration
      - Enterprise-grade (500-1000+ LOC)
      - Full infrastructure required
      - Governance, audit, knowledge built-in
      
    coordination: MasterOrchestrator routes and coordinates
    
    code_pattern: |
      # Python orchestrator example
      class TDDOrchestrator(IOrchestrator):
          def __init__(self):
              self.governance = GovernanceRegistry.instance()
              self.audit = EnhancedAuditLogger.instance()
              self.knowledge = KnowledgeRepository()
              self.state = StateManager()
              
          async def execute_operation(self, operation: str) -> Result:
              # Complex workflow with governance
              with self.governance.enforce_rules():
                  with self.audit.operation(operation):
                      # Multi-step TDD workflow
                      pass

