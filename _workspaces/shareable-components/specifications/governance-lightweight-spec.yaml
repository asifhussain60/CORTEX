# CORTEX Lightweight Governance Specification
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: Governance system for standalone CORTEX components

metadata:
  spec_id: COMP-GOV-001
  status: READY_FOR_IMPLEMENTATION
  authority: MasterOrchestrator
  
# =============================================================================
# 1. OVERVIEW
# =============================================================================

overview:
  description: |
    LightweightGovernance provides a subset of CORTEX governance rules
    for standalone component operation. It enables components to maintain
    CORTEX patterns without requiring full CORTEX infrastructure.
    
  design_principles:
    - Minimal dependencies (no CORTEX core required)
    - Essential rules only (not full 35+ rule set)
    - Fast validation (optimized for component operations)
    - Self-contained (bundled with component package)
    
  comparison_to_full:
    full_governance:
      rule_count: 35+
      validation: Full tier system
      dependency: CORTEX core
      storage: SQLite/YAML
    lightweight_governance:
      rule_count: 5-10 essential
      validation: Simple rule checks
      dependency: None
      storage: In-memory/YAML

# =============================================================================
# 2. CLASS SPECIFICATION
# =============================================================================

class_specification:
  name: LightweightGovernance
  module: cortex.components.governance
  
  attributes:
    - name: rules
      type: List[str]
      description: List of CORE rule IDs to enforce
    - name: _rule_registry
      type: Dict[str, RuleDefinition]
      description: Internal registry of rule definitions
      
  constructor:
    signature: "def __init__(self, rules: List[str] = None)"
    parameters:
      - name: rules
        type: List[str]
        default: ['CORE-027-AUDIT']
        description: List of rule IDs to enforce
    behavior:
      - Initializes rule list
      - Loads rule definitions from embedded YAML
      - Validates all rule IDs exist

# =============================================================================
# 3. CORE RULES FOR COMPONENTS
# =============================================================================

core_rules:
  # Essential rules for all components
  essential:
    CORE-011:
      id: CORE-011
      name: Type Hints Required
      description: All public functions must have type hints
      severity: warning
      check_type: static_analysis
      applicable_to: [function, method]
      
    CORE-012:
      id: CORE-012
      name: Docstrings Required
      description: All public classes and functions must have docstrings
      severity: warning
      check_type: static_analysis
      applicable_to: [class, function, method]
      
    CORE-013:
      id: CORE-013
      name: No Bare Except
      description: Never use bare except clauses
      severity: error
      check_type: static_analysis
      applicable_to: [except_clause]
      
    CORE-027:
      id: CORE-027
      name: Audit Trail
      description: All operations must be logged
      severity: error
      check_type: runtime
      applicable_to: [operation]
      
  # Optional rules for specific domains
  optional:
    CORE-008:
      id: CORE-008
      name: TDD Required
      description: Tests must be written before implementation
      severity: warning
      check_type: process
      applicable_to: [implementation]
      
    CORE-026:
      id: CORE-026
      name: Git Checkpoint
      description: Create checkpoint before major changes
      severity: info
      check_type: process
      applicable_to: [major_change]

# =============================================================================
# 4. VALIDATION METHODS
# =============================================================================

methods:
  validate_operation:
    signature: "def validate_operation(self, operation: str, context: Dict[str, Any]) -> Result"
    description: Validate operation against governance rules
    parameters:
      - name: operation
        type: str
        description: Operation name being executed
      - name: context
        type: Dict[str, Any]
        description: Operation context and parameters
    returns:
      type: Result[bool, str]
      description: Ok(True) if valid, Err(message) if violation
    behavior:
      - Checks each enabled rule
      - Collects all violations
      - Returns first error or Ok(True)
      
  check_rule:
    signature: "def check_rule(self, rule_id: str, context: Dict[str, Any]) -> Result"
    description: Check single rule against context
    parameters:
      - name: rule_id
        type: str
      - name: context
        type: Dict[str, Any]
    returns:
      type: Result[bool, str]
      
  is_rule_enabled:
    signature: "def is_rule_enabled(self, rule_id: str) -> bool"
    description: Check if rule is in enabled list
    
  get_enabled_rules:
    signature: "def get_enabled_rules(self) -> List[RuleDefinition]"
    description: Get all enabled rule definitions

# =============================================================================
# 5. RULE STORAGE
# =============================================================================

rule_storage:
  format: yaml
  location: bundled with component package
  
  schema:
    rules:
      type: object
      properties:
        id:
          type: string
          pattern: "^CORE-\\d{3}$"
        name:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        check_type:
          type: string
          enum: [static_analysis, runtime, process]
        applicable_to:
          type: array
          items:
            type: string

  example_file: |
    # lightweight_rules.yaml
    rules:
      CORE-011:
        id: CORE-011
        name: Type Hints Required
        severity: warning
        check_type: static_analysis
      CORE-027:
        id: CORE-027
        name: Audit Trail
        severity: error
        check_type: runtime

# =============================================================================
# 6. INTEGRATION WITH COMPONENTS
# =============================================================================

integration:
  initialization:
    standalone_mode: |
      # In CORTEXComponent._init_standalone_mode()
      self.governance = LightweightGovernance(
          rules=self.metadata.governance_rules
      )
      
    integrated_mode: |
      # In CORTEXComponent._init_integrated_mode()
      from cortex.brain.core.governance_registry import GovernanceRegistry
      self.governance = GovernanceRegistry.instance()
      
  usage_pattern: |
    # In execute_with_governance()
    governance_result = self.governance.validate_operation(
        operation=operation,
        context=params
    )
    if not governance_result.is_ok:
        return Err(f"Governance violation: {governance_result.error}")

# =============================================================================
# 7. ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  - id: AC-GOV-001
    description: LightweightGovernance initializes with specified rules
    verification: Unit test shows rules are loaded
    
  - id: AC-GOV-002
    description: validate_operation checks all enabled rules
    verification: Multiple rules validated in single call
    
  - id: AC-GOV-003
    description: Violations are reported with rule ID and message
    verification: Error messages include CORE-XXX reference
    
  - id: AC-GOV-004
    description: Works without CORTEX core dependency
    verification: Imports succeed with only cortex-components installed
    
  - id: AC-GOV-005
    description: Rule definitions bundled with package
    verification: Package includes lightweight_rules.yaml
