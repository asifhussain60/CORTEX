# CORTEX Component Base Specification
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: Complete specification for CORTEXComponent base class

metadata:
  spec_id: COMP-BASE-001
  status: READY_FOR_IMPLEMENTATION
  authority: MasterOrchestrator
  cortex_rules:
    - CORE-008  # TDD
    - CORE-011  # Type hints
    - CORE-012  # Docstrings
    - CORE-027  # Audit trail

# =============================================================================
# 1. CLASS HIERARCHY
# =============================================================================

class_hierarchy:
  base_class:
    name: CORTEXComponent
    module: cortex.components.base
    type: abstract_base_class
    inherits_from: ABC
    
  metadata_class:
    name: ComponentMetadata
    module: cortex.components.base
    type: dataclass
    fields:
      - name: name
        type: str
        required: true
        description: Unique component identifier
      - name: version
        type: str
        required: true
        description: Semantic version (semver)
      - name: description
        type: str
        required: true
        description: Human-readable description
      - name: author
        type: str
        required: true
        description: Author or team name
      - name: domain
        type: str
        required: true
        description: Domain category (testing, deployment, analysis, etc.)
      - name: dependencies
        type: List[str]
        required: false
        default: []
        description: List of dependency package names
      - name: mcp_tools
        type: List[str]
        required: false
        default: []
        description: List of exposed MCP tool names
      - name: governance_rules
        type: List[str]
        required: false
        default: ['CORE-027-AUDIT']
        description: CORTEX governance rules to enforce
      - name: created_at
        type: str
        required: false
        default: datetime.now().isoformat()
        description: ISO timestamp of creation

# =============================================================================
# 2. OPERATING MODES
# =============================================================================

operating_modes:
  standalone:
    description: Component runs as independent MCP server
    cortex_dependency: none
    infrastructure: lightweight
    capabilities:
      governance: LightweightGovernance
      audit: LightweightAudit
      knowledge: ComponentKnowledge
      state: none
    installation: pip install cortex-{component-name}
    use_case: Team sharing without CORTEX adoption
    
  integrated:
    description: Component runs within full CORTEX infrastructure
    cortex_dependency: full
    infrastructure: full_cortex
    capabilities:
      governance: GovernanceRegistry
      audit: EnhancedAuditLogger
      knowledge: KnowledgeRepository
      state: StateManager
    installation: Full CORTEX + component
    use_case: Enterprise CORTEX deployment

# =============================================================================
# 3. ABSTRACT METHODS
# =============================================================================

abstract_methods:
  execute:
    signature: "async def execute(self, operation: str, params: Dict[str, Any]) -> Result"
    description: Execute component operation
    parameters:
      - name: operation
        type: str
        description: Operation name to execute
      - name: params
        type: Dict[str, Any]
        description: Operation parameters
    returns:
      type: Result[T, str]
      description: Result monad with success value or error
    must_implement: true
    
  get_mcp_tools:
    signature: "def get_mcp_tools(self) -> List[Dict[str, Any]]"
    description: Return MCP tool definitions for this component
    returns:
      type: List[Dict[str, Any]]
      description: List of MCP tool schema definitions
    must_implement: true
    example:
      - name: generate_test
        description: Generate test from ticket
        input_schema:
          type: object
          properties:
            ticket_id:
              type: string
              description: ADO ticket ID
          required: [ticket_id]

# =============================================================================
# 4. CONCRETE METHODS
# =============================================================================

concrete_methods:
  __init__:
    signature: "def __init__(self, integrated_mode: bool = False)"
    description: Initialize component in specified mode
    parameters:
      - name: integrated_mode
        type: bool
        default: false
        description: If True, uses full CORTEX; if False, uses lightweight
    behavior:
      - Determines operating mode
      - Calls _init_standalone_mode() or _init_integrated_mode()
      - Sets up governance, audit, knowledge systems
      
  _init_standalone_mode:
    signature: "def _init_standalone_mode(self) -> None"
    description: Initialize lightweight standalone systems
    visibility: protected
    behavior:
      - Creates LightweightGovernance with component rules
      - Creates LightweightAudit with component name
      - Creates ComponentKnowledge with domain focus
      
  _init_integrated_mode:
    signature: "def _init_integrated_mode(self) -> None"
    description: Initialize full CORTEX integration
    visibility: protected
    behavior:
      - Imports and uses GovernanceRegistry.instance()
      - Imports and uses EnhancedAuditLogger.instance()
      - Imports and uses KnowledgeRepository()
      
  execute_with_governance:
    signature: "async def execute_with_governance(self, operation: str, params: Dict[str, Any]) -> Result"
    description: Execute operation with governance and audit wrapper
    behavior:
      - Validates operation against governance rules
      - Logs operation start with audit
      - Executes operation via abstract execute()
      - Logs operation complete with audit
      - Returns Result with success or error
    error_handling:
      - Catches exceptions
      - Logs failures to audit
      - Returns Err() result
      
  as_mcp_server:
    signature: "def as_mcp_server(self) -> ComponentMCPServer"
    description: Create MCP server from this component
    returns:
      type: ComponentMCPServer
      description: MCP server wrapper for standalone operation
      
  is_integrated:
    signature: "@property def is_integrated(self) -> bool"
    description: Check if running in integrated CORTEX mode
    returns:
      type: bool
      description: True if integrated, False if standalone

# =============================================================================
# 5. COMPONENT REGISTRATION
# =============================================================================

registration:
  decorator:
    name: "@register_component"
    module: cortex.components.registry
    parameters:
      - name: name
        type: str
        required: true
      - name: version
        type: str
        required: true
      - name: description
        type: str
        required: true
      - name: author
        type: str
        required: true
      - name: domain
        type: str
        required: true
      - name: dependencies
        type: List[str]
        required: false
      - name: governance_rules
        type: List[str]
        required: false
    behavior:
      - Creates ComponentMetadata
      - Attaches to class as cls.metadata
      - Registers in global _component_registry
      
  registry_functions:
    get_component:
      signature: "def get_component(name: str) -> Optional[Type[CORTEXComponent]]"
      description: Get registered component class by name
    list_components:
      signature: "def list_components() -> List[str]"
      description: List all registered component names

# =============================================================================
# 6. MCP SERVER INTEGRATION
# =============================================================================

mcp_server:
  class: ComponentMCPServer
  module: cortex.components.mcp_server
  
  initialization:
    - Takes CORTEXComponent as constructor parameter
    - Creates MCP Server with component metadata
    - Registers all component tools
    
  tool_registration:
    - Iterates component.get_mcp_tools()
    - Creates handler for each tool
    - Handler calls execute_with_governance()
    - Returns result or raises exception
    
  transports:
    stdio:
      description: Standard input/output (default)
      use_case: Copilot/Claude integration
    http:
      description: HTTP server
      port: 8080 (default)
      use_case: Network access

# =============================================================================
# 7. CLI INTERFACE
# =============================================================================

cli:
  module: cortex.components.cli
  command_group: cortex-component
  
  commands:
    serve:
      usage: cortex-component serve <component_name> [--transport stdio|http]
      description: Run component as MCP server
      arguments:
        - name: component_name
          type: str
          required: true
      options:
        - name: --transport
          default: stdio
          choices: [stdio, http]
          
    list:
      usage: cortex-component list
      description: List available components
      
    info:
      usage: cortex-component info <component_name>
      description: Show component details

# =============================================================================
# 8. PACKAGE STRUCTURE
# =============================================================================

package_structure:
  root: cortex-{component-name}/
  files:
    - pyproject.toml
    - README.md
    - LICENSE
  directories:
    src:
      path: src/cortex_{component_name}/
      files:
        - __init__.py         # Exports component class
        - component.py        # Main component implementation
      subdirs:
        tools:
          description: Domain-specific tool implementations
        knowledge:
          description: Domain knowledge YAML files
        governance:
          description: Domain governance rules
    tests:
      path: tests/
      files:
        - test_component.py
        - test_tools.py
    examples:
      path: examples/
      files:
        - usage.py

# =============================================================================
# 9. DEPENDENCIES
# =============================================================================

dependencies:
  core:
    - cortex-components>=1.0.0  # Base component framework
    - mcp>=1.0.0                # MCP protocol
    
  optional:
    cortex:
      - cortex>=6.0.0           # For integrated mode
      
  development:
    - pytest>=7.0.0
    - pytest-asyncio>=0.21.0

# =============================================================================
# 10. ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  - id: AC-COMP-001
    description: CORTEXComponent base class implemented with all abstract/concrete methods
    verification: Unit tests pass for base class
    
  - id: AC-COMP-002
    description: Standalone mode initializes lightweight systems correctly
    verification: Component works without full CORTEX installed
    
  - id: AC-COMP-003
    description: Integrated mode initializes full CORTEX systems
    verification: Component uses CORTEX singletons when integrated_mode=True
    
  - id: AC-COMP-004
    description: execute_with_governance applies governance and audit
    verification: Audit logs show operation start/complete
    
  - id: AC-COMP-005
    description: as_mcp_server creates functional MCP server
    verification: MCP server responds to tool calls
    
  - id: AC-COMP-006
    description: @register_component decorator registers correctly
    verification: list_components() returns registered components
    
  - id: AC-COMP-007
    description: CLI commands work for serve, list, info
    verification: CLI integration tests pass
