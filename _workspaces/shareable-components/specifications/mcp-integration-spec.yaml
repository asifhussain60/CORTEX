# CORTEX MCP Integration Specification
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: MCP server integration for CORTEX components

metadata:
  spec_id: COMP-MCP-001
  status: READY_FOR_IMPLEMENTATION
  authority: MasterOrchestrator
  
# =============================================================================
# 1. OVERVIEW
# =============================================================================

overview:
  description: |
    ComponentMCPServer wraps CORTEX components as Model Context Protocol (MCP)
    servers, enabling standalone operation with AI assistants like Copilot
    and Claude without requiring full CORTEX infrastructure.
    
  design_principles:
    - Standard MCP protocol compliance
    - Automatic tool registration from component
    - Multiple transport support (stdio, http)
    - Governance and audit applied to all calls
    
  protocol_version: "1.0.0"
  mcp_spec_reference: "https://modelcontextprotocol.io/specification"

# =============================================================================
# 2. CLASS SPECIFICATION
# =============================================================================

class_specification:
  name: ComponentMCPServer
  module: cortex.components.mcp_server
  
  attributes:
    - name: component
      type: CORTEXComponent
      description: Wrapped CORTEX component
    - name: server
      type: mcp.Server
      description: MCP server instance
    - name: transport
      type: str
      description: Active transport type
      
  constructor:
    signature: "def __init__(self, component: CORTEXComponent)"
    parameters:
      - name: component
        type: CORTEXComponent
        required: true
        description: CORTEX component to wrap
    behavior:
      - Stores component reference
      - Creates MCP Server with component metadata
      - Calls _register_tools() to setup handlers

# =============================================================================
# 3. TOOL REGISTRATION
# =============================================================================

tool_registration:
  description: |
    ComponentMCPServer automatically registers all tools defined by the
    component's get_mcp_tools() method with the MCP server.
    
  tool_schema:
    type: object
    required: [name, description, input_schema]
    properties:
      name:
        type: string
        description: Tool name (unique within component)
      description:
        type: string
        description: Tool description for LLM
      input_schema:
        type: object
        description: JSON Schema for tool parameters
        
  registration_flow: |
    def _register_tools(self):
        for tool_def in self.component.get_mcp_tools():
            @self.server.tool(
                name=tool_def['name'],
                description=tool_def['description'],
                input_schema=tool_def['input_schema']
            )
            async def handler(params, tool_name=tool_def['name']):
                result = await self.component.execute_with_governance(
                    tool_name, params
                )
                if result.is_ok:
                    return result.value
                else:
                    raise MCPToolError(result.error)

# =============================================================================
# 4. TRANSPORT SUPPORT
# =============================================================================

transports:
  stdio:
    name: Standard I/O
    description: Communication via stdin/stdout
    use_case: |
      - VS Code Copilot integration
      - Claude Desktop integration
      - CLI tool invocation
    configuration:
      copilot_mcp_json: |
        {
          "servers": {
            "cortex-test-automation": {
              "command": "cortex-test-automation",
              "args": ["serve", "--transport", "stdio"]
            }
          }
        }
        
  http:
    name: HTTP Server
    description: HTTP/JSON-RPC transport
    use_case: |
      - Network-accessible components
      - Browser-based integration
      - Microservice deployment
    default_port: 8080
    configuration:
      endpoint: "http://localhost:8080/mcp"
      methods: POST only

# =============================================================================
# 5. RUN METHODS
# =============================================================================

methods:
  run:
    signature: "def run(self, transport: str = 'stdio') -> None"
    description: Run MCP server with specified transport
    parameters:
      - name: transport
        type: str
        default: "stdio"
        choices: ["stdio", "http"]
    behavior:
      - Validates transport type
      - Creates appropriate transport instance
      - Starts server event loop
      - Blocks until shutdown
      
  run_async:
    signature: "async def run_async(self, transport: str = 'stdio') -> None"
    description: Async version for integration with other async code
    
  stop:
    signature: "def stop(self) -> None"
    description: Gracefully stop the MCP server

# =============================================================================
# 6. ERROR HANDLING
# =============================================================================

error_handling:
  mcp_errors:
    MCPToolError:
      code: -32000
      description: Tool execution error
      
    MCPGovernanceError:
      code: -32001
      description: Governance rule violation
      
    MCPValidationError:
      code: -32602
      description: Invalid parameters
      
  error_response_format: |
    {
      "jsonrpc": "2.0",
      "id": 1,
      "error": {
        "code": -32000,
        "message": "Tool execution failed",
        "data": {
          "operation": "generate_test",
          "error": "ADO ticket not found"
        }
      }
    }

# =============================================================================
# 7. COMPONENT MCP TOOL EXAMPLES
# =============================================================================

example_tools:
  test_automation:
    - name: generate_test
      description: Generate test code from ADO work item
      input_schema:
        type: object
        properties:
          ticket_id:
            type: string
            description: ADO work item ID
          output_format:
            type: string
            enum: [pytest, unittest]
            default: pytest
        required: [ticket_id]
        
    - name: scan_framework
      description: Analyze test framework in repository
      input_schema:
        type: object
        properties:
          repo_path:
            type: string
            description: Repository path to scan
        required: [repo_path]

  deployment:
    - name: deploy_canary
      description: Deploy canary release
      input_schema:
        type: object
        properties:
          service_name:
            type: string
          version:
            type: string
          percentage:
            type: number
            minimum: 0
            maximum: 100
        required: [service_name, version]

# =============================================================================
# 8. CLI INTEGRATION
# =============================================================================

cli_integration:
  command: "cortex-component serve"
  
  usage_examples:
    stdio: |
      # Run as stdio server (default)
      cortex-test-automation serve
      
      # Or explicitly
      cortex-test-automation serve --transport stdio
      
    http: |
      # Run as HTTP server
      cortex-test-automation serve --transport http --port 8080
      
  copilot_integration: |
    # 1. Install component
    pip install cortex-test-automation
    
    # 2. Add to Copilot MCP config
    # .vscode/mcp.json
    {
      "servers": {
        "cortex-test-automation": {
          "command": "python",
          "args": ["-m", "cortex_test_automation", "serve"]
        }
      }
    }
    
    # 3. Use in Copilot
    "Generate a test for ADO-12345"

# =============================================================================
# 9. MASTER ORCHESTRATOR INTEGRATION
# =============================================================================

master_integration:
  description: |
    When components run within full CORTEX, MasterOrchestrator can
    discover and route to component tools via ComponentIntegration.
    
  discovery_flow:
    - MasterOrchestrator initializes ComponentIntegration
    - ComponentIntegration scans component registry
    - Each component's tools are registered with MasterOrchestrator
    - Routing: "component.tool" maps to component execution
    
  routing_pattern: |
    # In MasterOrchestrator
    if '.' in operation:
        component_name, tool_name = operation.split('.', 1)
        return await self._component_integration.route_to_component(
            component_name, tool_name, context
        )

# =============================================================================
# 10. ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  - id: AC-MCP-001
    description: ComponentMCPServer registers all component tools
    verification: All get_mcp_tools() entries appear in server
    
  - id: AC-MCP-002
    description: Tool handlers call execute_with_governance
    verification: Audit logs show governance applied to MCP calls
    
  - id: AC-MCP-003
    description: stdio transport works with Copilot MCP config
    verification: Copilot can invoke component tools
    
  - id: AC-MCP-004
    description: http transport responds on configured port
    verification: HTTP POST to /mcp executes tools
    
  - id: AC-MCP-005
    description: Errors return proper MCP error format
    verification: Error responses include code and message
    
  - id: AC-MCP-006
    description: MasterOrchestrator can route to component tools
    verification: "component.tool" routing works in integrated mode
