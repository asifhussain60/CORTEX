# CORTEX Component Framework Implementation Plan
# Version: 1.0
# Author: Asif Hussain
# Date: 2026-01-26
# Purpose: Phased implementation plan for CORTEX components

metadata:
  plan_id: COMP-IMPL-001
  status: APPROVED_FOR_IMPLEMENTATION
  authority: MasterOrchestrator
  total_phases: 4
  estimated_duration: 6_weeks
  
# =============================================================================
# PHASE 0: FOUNDATION (Week 1)
# =============================================================================

phase_0:
  name: Foundation
  description: Core component framework infrastructure
  duration: 1 week
  priority: CRITICAL
  dependencies: []
  
  tasks:
    - id: T0.1
      name: Create component package structure
      description: Set up cortex/components/ directory structure
      files:
        - cortex/components/__init__.py
        - cortex/components/base.py
        - cortex/components/registry.py
        - cortex/components/exceptions.py
      acceptance_criteria:
        - AC-COMP-001
      effort: 2h
      
    - id: T0.2
      name: Implement ComponentMetadata dataclass
      description: Create metadata structure for components
      files:
        - cortex/components/base.py
      acceptance_criteria:
        - AC-COMP-001
      effort: 1h
      
    - id: T0.3
      name: Implement CORTEXComponent base class
      description: Abstract base class with dual-mode support
      files:
        - cortex/components/base.py
      acceptance_criteria:
        - AC-COMP-001
        - AC-COMP-002
        - AC-COMP-003
      effort: 4h
      
    - id: T0.4
      name: Implement @register_component decorator
      description: Component registration decorator
      files:
        - cortex/components/registry.py
      acceptance_criteria:
        - AC-COMP-006
      effort: 2h
      
    - id: T0.5
      name: Write unit tests for foundation
      description: TDD tests for base classes
      files:
        - tests/unit/components/test_base.py
        - tests/unit/components/test_registry.py
      acceptance_criteria:
        - All AC-COMP-* tests pass
      effort: 4h
      
  deliverables:
    - CORTEXComponent base class
    - ComponentMetadata dataclass
    - @register_component decorator
    - Component registry functions
    - Unit tests (100% coverage)
    
  exit_criteria:
    - All foundation classes implemented
    - All unit tests passing
    - Documentation complete

# =============================================================================
# PHASE 1: LIGHTWEIGHT SUBSYSTEMS (Week 2)
# =============================================================================

phase_1:
  name: Lightweight Subsystems
  description: Standalone mode governance, audit, and knowledge
  duration: 1 week
  priority: HIGH
  dependencies: [phase_0]
  
  tasks:
    - id: T1.1
      name: Implement LightweightGovernance
      description: Standalone governance with essential CORE rules
      files:
        - cortex/components/governance.py
        - cortex/components/rules/lightweight_rules.yaml
      acceptance_criteria:
        - AC-GOV-001
        - AC-GOV-002
        - AC-GOV-003
        - AC-GOV-004
      effort: 4h
      
    - id: T1.2
      name: Implement LightweightAudit
      description: JSON Lines audit logging for standalone
      files:
        - cortex/components/audit.py
      acceptance_criteria:
        - AC-AUDIT-001
        - AC-AUDIT-002
        - AC-AUDIT-003
        - AC-AUDIT-004
        - AC-AUDIT-005
        - AC-AUDIT-006
      effort: 4h
      
    - id: T1.3
      name: Implement ComponentKnowledge
      description: Domain-focused knowledge for standalone
      files:
        - cortex/components/knowledge.py
      effort: 3h
      
    - id: T1.4
      name: Implement execute_with_governance wrapper
      description: Governance + audit wrapper for operations
      files:
        - cortex/components/base.py
      acceptance_criteria:
        - AC-COMP-004
      effort: 2h
      
    - id: T1.5
      name: Write unit tests for subsystems
      description: TDD tests for lightweight subsystems
      files:
        - tests/unit/components/test_governance.py
        - tests/unit/components/test_audit.py
        - tests/unit/components/test_knowledge.py
      effort: 4h
      
  deliverables:
    - LightweightGovernance class
    - LightweightAudit class
    - ComponentKnowledge class
    - Essential CORE rules YAML
    - Unit tests (100% coverage)
    
  exit_criteria:
    - Standalone mode fully functional
    - No CORTEX dependencies required
    - All tests passing

# =============================================================================
# PHASE 2: MCP INTEGRATION (Week 3)
# =============================================================================

phase_2:
  name: MCP Integration
  description: MCP server wrapper and CLI
  duration: 1 week
  priority: HIGH
  dependencies: [phase_1]
  
  tasks:
    - id: T2.1
      name: Implement ComponentMCPServer
      description: MCP server wrapper for components
      files:
        - cortex/components/mcp_server.py
      acceptance_criteria:
        - AC-MCP-001
        - AC-MCP-002
        - AC-MCP-003
        - AC-MCP-004
        - AC-MCP-005
      effort: 6h
      
    - id: T2.2
      name: Implement as_mcp_server method
      description: Add to CORTEXComponent base class
      files:
        - cortex/components/base.py
      acceptance_criteria:
        - AC-COMP-005
      effort: 1h
      
    - id: T2.3
      name: Implement component CLI
      description: CLI commands for serve, list, info
      files:
        - cortex/components/cli.py
      acceptance_criteria:
        - AC-COMP-007
      effort: 3h
      
    - id: T2.4
      name: Implement transport handlers
      description: stdio and HTTP transport support
      files:
        - cortex/components/transports.py
      acceptance_criteria:
        - AC-MCP-003
        - AC-MCP-004
      effort: 4h
      
    - id: T2.5
      name: Write integration tests for MCP
      description: MCP server integration tests
      files:
        - tests/integration/components/test_mcp_server.py
        - tests/integration/components/test_cli.py
      effort: 4h
      
  deliverables:
    - ComponentMCPServer class
    - CLI commands (serve, list, info)
    - Transport handlers (stdio, http)
    - Integration tests
    
  exit_criteria:
    - Components work as standalone MCP servers
    - CLI fully functional
    - Copilot integration tested

# =============================================================================
# PHASE 3: CORTEX INTEGRATION (Week 4)
# =============================================================================

phase_3:
  name: CORTEX Integration
  description: Integrated mode with full CORTEX infrastructure
  duration: 1 week
  priority: MEDIUM
  dependencies: [phase_2]
  
  tasks:
    - id: T3.1
      name: Implement _init_integrated_mode
      description: Connect to full CORTEX subsystems
      files:
        - cortex/components/base.py
      acceptance_criteria:
        - AC-COMP-003
      effort: 3h
      
    - id: T3.2
      name: Implement ComponentIntegration
      description: MasterOrchestrator integration layer
      files:
        - cortex/orchestrators/core/component_integration.py
      acceptance_criteria:
        - AC-MCP-006
      effort: 4h
      
    - id: T3.3
      name: Update MasterOrchestrator
      description: Add component routing capability
      files:
        - cortex/orchestrators/core/master_orchestrator.py
      effort: 3h
      
    - id: T3.4
      name: Implement auto-detection
      description: Automatic mode detection based on CORTEX presence
      files:
        - cortex/components/base.py
      effort: 2h
      
    - id: T3.5
      name: Write integration tests
      description: CORTEX integration tests
      files:
        - tests/integration/components/test_cortex_integration.py
        - tests/integration/components/test_master_routing.py
      effort: 4h
      
  deliverables:
    - Integrated mode support
    - ComponentIntegration class
    - MasterOrchestrator routing
    - Auto-detection logic
    - Integration tests
    
  exit_criteria:
    - Components work in both modes
    - MasterOrchestrator can route to components
    - Progressive enhancement verified

# =============================================================================
# PHASE 4: EXAMPLE COMPONENTS (Weeks 5-6)
# =============================================================================

phase_4:
  name: Example Components
  description: Create reference component implementations
  duration: 2 weeks
  priority: MEDIUM
  dependencies: [phase_3]
  
  tasks:
    - id: T4.1
      name: Create test-automation component
      description: First reference component for test generation
      files:
        - cortex-test-automation/src/cortex_test_automation/component.py
        - cortex-test-automation/src/cortex_test_automation/tools/
        - cortex-test-automation/pyproject.toml
      effort: 16h
      
    - id: T4.2
      name: Create deployment component
      description: Deployment automation component
      files:
        - cortex-deployment/src/cortex_deployment/component.py
        - cortex-deployment/src/cortex_deployment/tools/
        - cortex-deployment/pyproject.toml
      effort: 16h
      
    - id: T4.3
      name: Create code-analysis component
      description: Code analysis component
      files:
        - cortex-code-analysis/src/cortex_code_analysis/component.py
        - cortex-code-analysis/src/cortex_code_analysis/tools/
        - cortex-code-analysis/pyproject.toml
      effort: 16h
      
    - id: T4.4
      name: Write component tests
      description: Full test suites for example components
      effort: 8h
      
    - id: T4.5
      name: Create documentation
      description: README, usage examples for each component
      effort: 8h
      
  deliverables:
    - cortex-test-automation package
    - cortex-deployment package
    - cortex-code-analysis package
    - Full documentation
    - PyPI-ready packages
    
  exit_criteria:
    - All example components functional
    - Both modes tested
    - Documentation complete
    - Ready for PyPI publish

# =============================================================================
# RESOURCE REQUIREMENTS
# =============================================================================

resources:
  developers:
    senior: 1
    mid: 1
  time_allocation:
    coding: 60%
    testing: 25%
    documentation: 15%
    
# =============================================================================
# RISK ASSESSMENT
# =============================================================================

risks:
  - risk: MCP protocol changes
    probability: LOW
    impact: MEDIUM
    mitigation: Abstract transport layer for easy updates
    
  - risk: CORTEX dependency conflicts
    probability: MEDIUM
    impact: HIGH
    mitigation: Careful import structure, lazy loading
    
  - risk: Performance overhead in lightweight mode
    probability: LOW
    impact: LOW
    mitigation: Benchmark testing, optimize critical paths

# =============================================================================
# SUCCESS METRICS
# =============================================================================

success_metrics:
  - metric: All phases complete
    target: 100%
    
  - metric: Test coverage
    target: ">95%"
    
  - metric: Documentation complete
    target: 100%
    
  - metric: Example components functional
    target: 3 components
    
  - metric: Standalone mode works without CORTEX
    target: Verified
