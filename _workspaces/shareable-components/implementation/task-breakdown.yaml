        methods_to_implement:
          - __init__(self, integrated_mode: bool = False)
          - _init_standalone_mode(self)
          - _init_integrated_mode(self)
          - execute(self, operation: str, params: Dict) -> Result  # abstract
          - get_mcp_tools(self) -> List[Dict]  # abstract
          - execute_with_governance(self, operation: str, params: Dict) -> Result
