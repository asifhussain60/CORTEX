      implementation:
        file: cortex/components/base.py
        code_pattern: |
          @dataclass
          class ComponentMetadata:
              name: str
              version: str
              description: str
              author: str
              domain: str
              dependencies: List[str] = field(default_factory=list)
              mcp_tools: List[str] = field(default_factory=list)
