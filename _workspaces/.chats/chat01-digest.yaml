    effort_estimate: 1_day
    affected_components:
      - cortex/repositories/git_operations.py
      - cortex/lens/analyzers/*.py
      - cortex/wiring/registry/git_backed_registry.py
    validation_criteria:
      - Circuit breaker trips after 50% failure rate
      - Operations fail fast after trip
      - Automatic recovery after cooldown period
    references:
      - Release_It_Circuit_Breaker_Pattern
      - Resilience4j_Documentation
  
