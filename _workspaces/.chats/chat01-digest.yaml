    priority: P0
    title: "Command Injection in cortex_refactor"
    category: security
    confidence: 10.0
    description: "Shell commands built from unsanitized input enable arbitrary code execution"
    current_behavior: "subprocess(shell=True) with user-provided input"
    proposed_behavior: "Use subprocess(shell=False) with argument list"
