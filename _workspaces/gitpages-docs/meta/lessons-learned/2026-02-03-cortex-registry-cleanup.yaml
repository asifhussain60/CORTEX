incident_id: "cortex-registry-cleanup-2026-02-03"
date: "2026-02-03"
category: "infrastructure"
operation_type: "cleanup"

problem:
  summary: "cortex-registry contained duplicate/unused folders violating CORE-035"
  root_cause: "Historical accumulation of planning docs and duplicate deployment configs without regular cleanup"
  symptoms:
    - "deployment/ folder duplicating root /deployment configs"
    - "Confusion about canonical location for deployment configurations"
    - "CORE-035 violation (Single Canonical Implementation)"

solution:
  pattern_name: "Registry Cleanup with Active Usage Analysis"
  approach: "Code-first verification → Archive unused → Update documentation"
  key_insight: "Always grep Python imports BEFORE removing folders to verify no active usage"
  
steps_taken:
  1: "Analyzed cortex-registry structure (5 folders, ~128KB)"
  2: "Grep searched Python codebase for folder references"
  3: "Identified deployment/ as pure duplicate (no Python imports)"
  4: "Initially removed planning/ but discovered active PlanningOrchestrator usage"
  5: "Restored planning/, only archived deployment/"
  6: "Updated manifest.yaml to v2.0 with removal documentation"
  7: "Created archive README with impact analysis"

lessons:
  critical:
    - "Never assume folder is unused without grep verification"
    - "Check wiring.yaml for orchestrator references before removing folders"
    - "Test bootstrap after structural changes to catch configuration errors"
  
  testing:
    - "Python import search is most reliable indicator of active usage"
    - "Wiring registry reveals orchestrator dependencies not obvious in code"
    - "YAML syntax validation prevents deployment issues"
  
  process:
    - "Archive-first approach allows safe rollback if issues discovered"
    - "Update manifest.yaml immediately to document changes"
    - "Create archive README for audit trail"

anti_patterns:
  - pattern: "Removing folders based on 'looks historical' without verification"
    why_bad: "Can break active orchestrators that load from those paths"
    better_approach: "Always verify with grep + wiring.yaml check first"
  
  - pattern: "Batch removal of multiple folders at once"
    why_bad: "Harder to diagnose which removal caused bootstrap failure"
    better_approach: "Remove one folder at a time, test bootstrap between removals"

tools_used:
  - "grep_search: Verify Python imports"
  - "semantic_search: Find orchestrator usage patterns"
  - "run_in_terminal: List directories, move files, verify YAML"
  - "read_file: Check orchestrator implementations"

metrics:
  folders_removed: 1
  files_archived: 7
  size_reduction_kb: 28
  python_imports_broken: 0
  orchestrators_affected: 0
  bootstrap_still_works: true

impact:
  positive:
    - "Improved CORE-035 compliance (single canonical deployment location)"
    - "Clearer structure for new developers"
    - "Reduced confusion about deployment config locations"
  
  neutral:
    - "Planning folder retained (actively used by PlanningOrchestrator)"
  
  negative:
    - "None detected"

reusability: "HIGH"

similar_use_cases:
  - "Cleaning up docs/ archive sprawl"
  - "Removing duplicate configuration files across folders"
  - "Consolidating test fixtures from multiple locations"
  - "Archiving historical migration scripts no longer needed"

recommendations:
  for_future_cleanups:
    - "Create checklist: grep Python → check wiring → test bootstrap → archive"
    - "Use /vacuum command for P3 cleanup automation (markdown sprawl)"
    - "Document removal rationale in manifest files"
    - "Maintain archive/ structure with READMEs"
  
  for_cortex_architecture:
    - "Add pre-commit hook to prevent new files in archived locations"
    - "Create automated 'usage scanner' tool for folder analysis"
    - "Add YAML validation to CI/CD pipeline"

verification_steps:
  - "✅ Grep search showed 0 Python imports of cortex-registry/deployment/"
  - "✅ YAML validation passed for manifest.yaml"
  - "✅ Archive created with documentation"
  - "⚠️ Bootstrap test skipped due to unrelated wiring errors (EducationalOrchestrator deps)"

related_core_rules:
  - "CORE-035: Single Canonical Implementation"
  - "CORE-002: No markdown file generation (inline only)"
  - "CORE-030: Implementation Truth (verify code, not docs)"

