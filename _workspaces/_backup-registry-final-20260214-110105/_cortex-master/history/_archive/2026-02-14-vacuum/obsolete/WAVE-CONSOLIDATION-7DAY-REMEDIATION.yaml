# ============================================================================
# SOLUTION DESIGN (OPTION C: HYBRID)
# ============================================================================

solution:
  overview: |
    Three-layer defense against chronic clutter:
    
    LAYER 1: PREVENTION (Stop creating mess)
    - Reduce completion reports: 1 per wave (not 3-5)
    - Update status in-place (not create new files)
    - Archive trigger: Status changes to "complete"
    
    LAYER 2: AUTOMATIC CLEANUP (Self-cleaning during work)
    - MasterOrchestrator lifecycle hooks
    - Auto-vacuum on wave/phase completion
    - Auto-archive on status change
    
    LAYER 3: PROACTIVE MONITORING (Catch problems early)
    - File count threshold: 100 files
    - Alert at 85 files
    - Suggest cleanup before crisis

  architecture:
    components:
      - name: "LifecycleHookSystem"
        purpose: "Trigger cleanup automatically on completions"
        integration: "MasterOrchestrator, PlanOrchestrator"
        
      - name: "EnhancedVacuumOrchestrator"
        purpose: "Intelligent cleanup with prevention + monitoring"
        integration: "Called by lifecycle hooks + manual trigger"
        
      - name: "RegistryHealthMonitor"
        purpose: "Track file count, alert on thresholds"
        integration: "Runs on session start, reports to user"
        
      - name: "WiringVerifier"
        purpose: "Ensure all completed work is production-wired"
        integration: "Part of wave completion validation"

