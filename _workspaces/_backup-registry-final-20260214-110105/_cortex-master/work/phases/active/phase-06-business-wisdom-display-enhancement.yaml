      ```python
      class BusinessWisdomFormatter:
          def __init__(self, loader: Optional[GovernanceRuleLoader] = None):
              self.loader = loader or GovernanceRuleLoader()
          
          def format_governance_with_books(
              self, 
              rule_ids: List[str], 
              max_display: int = 5,
              include_icon: bool = True
          ) -> str:
              """
              Format governance rules with book references.
              
              Args:
                  rule_ids: List of CORE rule IDs
                  max_display: Maximum principles to show (default 5)
                  include_icon: Include 📚 icon in section header
              
              Returns:
                  Markdown string with enriched principles
              """
          
          def _format_single_rule(self, rule: Dict[str, Any]) -> str:
              """Format single rule with arrow notation."""
              principle = rule.get("principle", "")
              rule_id = rule.get("rule_id", "")
              book_ref = rule.get("book_reference", "")
              
              if book_ref:
                  return f"- **{principle}** → {rule_id} ({book_ref})"
              return f"- **{principle}** → {rule_id}"
          
          def get_rules_by_severity(self, rule_ids: List[str]) -> List[Dict[str, Any]]:
              """Sort rules by severity (P0 → P1 → P2)."""
      ```
      
      Integration Points:
      - Uses existing GovernanceRuleLoader (no changes needed)
      - Returns markdown compatible with all response formatters
      - Stateless design (no caching, rules loaded per call)
    
