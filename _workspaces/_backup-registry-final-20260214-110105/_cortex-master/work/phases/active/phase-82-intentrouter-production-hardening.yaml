# ============================================================================
stages:
  - id: S1
    name: "Integration Test Suite"
    duration: "2 days"
    estimated_tokens: "8000"
    description: |
      Build comprehensive integration test suite covering all 8 modes,
      cross-mode flows, and error scenarios.
    
    parts:
      - id: P1
        name: "Mode Routing Integration Tests"
        description: "Test each of 8 modes end-to-end with real agents"
        acceptance_criteria:
          - "✅ PRE-FLIGHT mode routing tested"
          - "✅ AUDIT mode routing tested with P0/P1/P2 findings"
          - "✅ META-AUDIT mode routing tested with recursive validation"
          - "✅ DIGEST mode routing tested with chat markers"
          - "✅ QUERY mode routing tested with knowledge retrieval"
          - "✅ PLAN mode routing tested with phase selection"
          - "✅ DESIGN mode routing tested with TDD workflow"
          - "✅ INTERACTIVE mode routing tested with exploration"
        tests_count: 30+
      
      - id: P2
