        description: "Test mode transitions and multi-step workflows"
        acceptance_criteria:
          - "✅ AUDIT→META-AUDIT recursive flow tested"
          - "✅ PLAN→DESIGN phase-to-implementation flow tested"
          - "✅ DESIGN→AUDIT iterative improvement flow tested"
          - "✅ Session continuity across modes tested"
          - "✅ Context preservation across mode transitions"
        tests_count: 15+
      
      - id: P3
