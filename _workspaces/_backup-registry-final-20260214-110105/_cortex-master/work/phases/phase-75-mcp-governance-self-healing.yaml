risks_and_mitigations:
  risk_1:
    description: "Watchdog conflicts with manual MCP restarts"
    severity: "LOW"
    mitigation: "Watchdog detects manual restarts, logs event, resumes monitoring"
  
  risk_2:
    description: "Pre-commit hook too slow (>5s)"
    severity: "MEDIUM"
    mitigation: "Cache validation results, only re-validate changed files"
  
  risk_3:
    description: "CI/CD gate blocks urgent hotfixes"
    severity: "HIGH"
    mitigation: "Add --skip-mcp-gate flag for emergencies, require 2 approvals"
  
  risk_4:
    description: "Cross-platform watchdog compatibility issues"
    severity: "MEDIUM"
    mitigation: "Test on Windows/Mac/Linux, use platform-agnostic psutil library"

alternatives_considered:
  manual_cleanup:
    description: "Continue fixing tools reactively as issues arise"
    pros: "Simple, no new infrastructure"
    cons: "Brittle, doesn't prevent regression, high ongoing maintenance"
    verdict: "REJECTED"
  
  vs_code_extension_health:
    description: "Build VS Code extension for MCP health monitoring"
    pros: "Tight VS Code integration, native UI"
    cons: "Complex, requires extension marketplace, doesn't help CLI users"
    verdict: "REJECTED"
  
  pre_session_boot_script:
    description: "User runs script before each session"
    pros: "Simpler than watchdog"
    cons: "Manual trigger, doesn't align with CORE-049 autonomous execution"
    verdict: "REJECTED"

