---
enhancement_id: ENH-100
title: Real-Time Feedback Hub - Universal Progress Streaming
status: PLANNED
priority: P1-HIGH
created: 2026-02-13
author: Asif Hussain
orchestrator: LENSSynthesis

# ============================================================================
# ARCHITECTURAL REVIEW FINDINGS
# ============================================================================

current_state:
  discovered_components:
    - pytest_progress_plugin: Terminal progress reporter (isolated)
    - dashboard_service: Manual progress aggregation (isolated)
    - progress_tracker: Phase completion monitoring (isolated)
    - feedback_agent: Post-execution feedback collection (isolated)
    - real_time_dashboard: Live metrics display (isolated)
    - event_bus: Basic pub-sub (feature registry only)
    - orchestrator_event_bus: Extended event bus (orchestrators only)
  
  critical_gaps:
    - no_universal_feedback_channel: Each component has own output mechanism
    - no_test_integration: Pytest plugin writes stdout with no consumers
    - no_process_abstraction: Each long-running process implements own progress
    - isolated_components: Dashboard, tracker, feedback agent don't communicate
    - post_execution_only: Feedback collected after completion, not during
    - single_purpose_buses: EventBus limited to specific domains
  
  architectural_debt:
    - three_progress_systems: Pytest, dashboard, tracker all do similar work
    - five_feedback_mechanisms: Plugin, service, tracker, agent, dashboard
    - tight_coupling: Components know about specific consumers
    - no_replay: Cannot reconstruct progress history
    - no_multiplexing: Single producer can't feed multiple consumers

# ============================================================================
# RECOMMENDED SOLUTION: FEEDBACK HUB ARCHITECTURE
# ============================================================================

architecture:
  name: UniversalFeedbackHub
  pattern: Event-Driven Pub-Sub with Replay
  
  core_responsibilities:
    - accept_events: Any process can emit progress/status/error events
    - route_events: Distribute to all registered consumers simultaneously
    - persist_history: Store event stream for replay and debugging
    - provide_adapters: Simple injection interface for any process type
    - guarantee_delivery: Ensure consumers receive events (with fallback)
    - enable_discovery: Consumers can query hub for available event sources
  
  key_principles:
    - zero_coupling: Producers don't know about consumers
    - pluggable: Any process can inject hub in 1-2 lines
    - optional: Graceful degradation if hub unavailable
    - lightweight: Minimal overhead, async-first
    - testable: Easy to verify events with mock consumers

# ============================================================================
# COMPONENTS BREAKDOWN
# ============================================================================

components:
  
  1_feedback_hub_core:
    file: cortex/infrastructure/feedback_hub.py
    classes:
      - FeedbackHub: Main event coordinator
      - EventStream: Per-source event queue
      - ConsumerRegistry: Manages subscribers
      - EventStore: Persistent event history
    
    features:
      - thread_safe: RLock protection for concurrent access
      - async_dispatch: Non-blocking event delivery
      - backpressure: Queue limits prevent memory overflow
      - health_check: Monitor consumer responsiveness
      - replay: Query past events by time/source/type
  
  2_event_models:
    file: cortex/models/feedback_events.py
    types:
      - ProgressEvent: Percentage, items, ETA
      - StatusEvent: State changes (started, paused, complete)
      - ErrorEvent: Failures with context
      - MetricEvent: Performance data (duration, throughput)
      - AlertEvent: Warnings requiring attention
    
    metadata:
      - source_id: Who generated event
      - timestamp: When event occurred
      - correlation_id: Link related events
      - sequence_number: Order within source
  
  3_process_adapters:
    file: cortex/infrastructure/feedback_adapters.py
    adapters:
      - PytestAdapter: Inject into pytest execution
      - OrchestratorAdapter: Wrap orchestrator methods
      - TestSuiteAdapter: Batch test execution
      - MigrationAdapter: Long-running migrations
      - BuildAdapter: CI/CD pipelines
    
    interface:
      - emit_progress: Report completion percentage
      - emit_status: Report state change
      - emit_error: Report failure
      - emit_metric: Report performance data
  
  4_consumer_implementations:
    file: cortex/infrastructure/feedback_consumers.py
    consumers:
      - TerminalConsumer: ASCII progress bars (like pytest plugin)
      - DashboardConsumer: Feed real-time dashboard
      - MetricsConsumer: Export to Prometheus/OpenTelemetry
      - LogConsumer: Write to structured logs
      - TestReporterConsumer: Generate test reports
      - AlertConsumer: Trigger escalation alerts
    
    capabilities:
      - filtering: Subscribe to specific event types
      - throttling: Limit update frequency
      - buffering: Batch events for efficiency
      - fallback: Handle missing hub gracefully

# ============================================================================
