# Phase DEPLOYMENT-003: MCP Centralization and Expansion
# Expose all CORTEX capabilities via MCP tools
# Date: 2026-01-21
# Priority: P1-HIGH
# Authority: chat01.md requirements analysis

metadata:
  phase_id: "PHASE-DEPLOYMENT-003-mcp-expansion"
  title: "MCP Tool Registry Expansion (14→30+ tools)"
  description: "Centralize MCP tools with registry, add governance/deployment/multi-repo tools"
  priority: "P1-HIGH"
  estimated_effort: "4 days"
  blocks_production: false
  machine: "ah"

executive_summary: |
  Current MCP tools (14) are scattered without registry or governance.
  This phase:
  - Creates MCP tool registry with metadata (category, version, auth)
  - Reorganizes tools by category (governance, orchestration, knowledge, utility, deployment)
  - Adds 16+ new tools (governance, deployment, multi-repo)
  - Implements tool discovery mechanism
  - Enforces MCP-first architecture (all capabilities via MCP)

current_state:
  mcp_tools: 14
  registry: "None (tools hardcoded in server.py)"
  categorization: "None"
  governance_tools: "None"
  deployment_tools: "None"
  multi_repo_tools: "None"
  discovery_mechanism: "None"

acceptance_criteria:
  - id: "AC-DEP-003-01"
    description: "Registry expansion with complete metadata"
    verification: "cortex/mcp/registry.py contains 30+ tool definitions with metadata"
    implementation:
      - "Create cortex/mcp/registry.py with ToolMetadata dataclass"
      - "ToolMetadata fields: name, category, version, auth_required, governance_rule, description"
      - "Reorganize cortex/mcp/tools/ into category subdirs:"
      - "  - tools/governance/ (tier_resolver, rule_evaluator, audit_query, etc.)"
      - "  - tools/orchestration/ (execute_phase, run_tests, etc.)"
      - "  - tools/knowledge/ (query_kb, search_ac, etc.)"
      - "  - tools/utility/ (echo, transform, etc.)"
      - "  - tools/deployment/ (sanitizer, health_checker, release_builder)"
      - "  - tools/multi_repo/ (project_scanner, context_switcher, cross_repo_search)"
      - "Update server.py to auto-discover from registry"
    tests:
      - "test_registry_has_30plus_tools"
      - "test_tool_metadata_complete"
      - "test_category_subdirs_organized"
      - "test_server_auto_discovers_tools"
  
  - id: "AC-DEP-003-02"
    description: "Governance tools expose tier resolution and rule evaluation"
    verification: "5 governance tools callable via MCP"
    implementation:
      - "tools/governance/tier_resolver.py: Resolve rule precedence (tier0 > tier1 > tier2)"
      - "tools/governance/rule_evaluator.py: Evaluate rule against code (CORE-008 check)"
      - "tools/governance/audit_query.py: Search governance.db by AC-ID, timestamp, phase"
      - "tools/governance/policy_enforcer.py: Check code against tier0 policy"
      - "tools/governance/compliance_reporter.py: Generate compliance report"
    tests:
      - "test_tier_resolver_precedence"
      - "test_rule_evaluator_checks_code"
      - "test_audit_query_finds_entries"
      - "test_policy_enforcer_blocks_violations"
      - "test_compliance_reporter_generates_report"
  
  - id: "AC-DEP-003-03"
    description: "Multi-repo tools enable cross-project governance"
    verification: "6 multi-repo tools callable via MCP"
    implementation:
      - "tools/multi_repo/project_scanner.py: Discover D:\\PROJECTS\\* structure"
      - "tools/multi_repo/context_switcher.py: Load tier1 rules per project"
      - "tools/multi_repo/cross_repo_search.py: Find AC-ID references across repos"
      - "tools/multi_repo/shared_audit.py: Query unified governance.db"
      - "tools/multi_repo/dependency_graph.py: Show inter-project dependencies"
      - "tools/multi_repo/profile_manager.py: Apply governance profiles to projects"
    tests:
      - "test_project_scanner_discovers_repos"
      - "test_context_switcher_loads_tier1"
      - "test_cross_repo_search_finds_ac_ids"
      - "test_shared_audit_queries_unified_db"
      - "test_dependency_graph_shows_relationships"
      - "test_profile_manager_applies_profiles"
  
  - id: "AC-DEP-003-04"
    description: "Deployment tools expose sanitization and health checks"
    verification: "5 deployment tools callable via MCP"
    implementation:
      - "tools/deployment/sanitizer.py: Run PHASE-DEPLOYMENT-001 sanitization"
      - "tools/deployment/release_builder.py: Create release tag, trigger CI/CD"
      - "tools/deployment/health_checker.py: Validate CORTEX readiness (all tests pass)"
      - "tools/deployment/rollback.py: Revert to previous release"
      - "tools/deployment/canary_deployer.py: Staged rollout (10% → 50% → 100%)"
    tests:
      - "test_sanitizer_runs_phase_dep_001"
      - "test_release_builder_creates_tag"
      - "test_health_checker_validates_readiness"
      - "test_rollback_reverts_release"
      - "test_canary_deployer_staged_rollout"

deliverables:
  code:
    - "cortex/mcp/registry.py (ToolMetadata, registry logic)"
    - "cortex/mcp/tools/governance/*.py (5 tools)"
    - "cortex/mcp/tools/orchestration/*.py (4 tools)"
    - "cortex/mcp/tools/knowledge/*.py (3 tools)"
    - "cortex/mcp/tools/utility/*.py (2 tools)"
    - "cortex/mcp/tools/deployment/*.py (5 tools)"
    - "cortex/mcp/tools/multi_repo/*.py (6 tools)"
    - "cortex/mcp/server.py (updated for auto-discovery)"
  
  tests:
    - "tests/mcp/test_registry.py (8 tests)"
    - "tests/mcp/tools/governance/test_*.py (15 tests)"
    - "tests/mcp/tools/multi_repo/test_*.py (18 tests)"
    - "tests/mcp/tools/deployment/test_*.py (15 tests)"

dependencies:
  requires: 
    - "PHASE-DEPLOYMENT-002-onboarding (MCP server bootstrapped)"
  blocks: 
    - "PHASE-DEPLOYMENT-004-multi-repo-governance"

completion_verification:
  success_criteria:
    - "All 56 MCP tool tests passing"
    - "cortex/mcp/registry.py contains 30+ tool definitions"
    - "5 governance tools callable via MCP"
    - "6 multi-repo tools callable via MCP"
    - "5 deployment tools callable via MCP"
    - "MCP server auto-discovers tools from registry"
  validation_command: "pytest tests/mcp/ -v"

governance_compliance:
  - "CORE-008: Tests before implementation"
  - "CORE-011: All functions typed"
  - "CORE-012: Google docstrings"
  - "CORE-017: Strict enforcement (no MCP bypass)"
  - "CORE-026: Git checkpoint before registry refactor"

notes: |
  This phase implements the "MCP-first enforcement" requirement from chat01.md.
  All CORTEX capabilities must be exposed via MCP tools for centralization.
  
  Registry pattern enables:
  - Auto-discovery (no hardcoded tool lists)
  - Metadata-driven UI (Claude Desktop shows tool categories)
  - Governance enforcement (auth, rate limiting per tool)
  - Version management (tool compatibility tracking)
  
  Consolidates and replaces:
  - impl-arch-022-mcp-compliance (registry logic absorbed here)
