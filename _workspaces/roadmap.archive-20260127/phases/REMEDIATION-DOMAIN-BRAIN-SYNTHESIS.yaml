# REMEDIATION-DOMAIN-BRAIN-SYNTHESIS Phase
# Part of: REMEDIATION-PRODUCTION-COMPLETENESS
# Sequence: 3
# Priority: P0-CRITICAL
# Blocking: true
# Track: remediation

phase_id: "REMEDIATION-DOMAIN-BRAIN-SYNTHESIS"
parent_phase: "REMEDIATION-PRODUCTION-COMPLETENESS"
sequence: 3
priority: "P0-CRITICAL"
effort: "5-7 days"
blocking: true
status: "NOT_STARTED"
track: "remediation"

description: |
  Implement SynthesisModule for combining query results, patterns, and knowledge
  into actionable recommendations, and DomainIntegration layer for bridging
  domain brain and orchestrators. This phase delivers 151 tests enabling
  complete orchestrator-domain brain integration.

current_state:
  synthesis_module: "STUB - minimal implementation"
  domain_integration: "MISSING - no integration layer"
  orchestrator_bridge: "MISSING - no bridge to domain brain"
  test_gap: "151 tests missing"

target_state:
  synthesis_module: "100% implemented with recommendation generation"
  domain_integration: "Full orchestrator-domain brain bridging"
  orchestrator_bridge: "Seamless communication layer"
  synthesis_tests: "151 tests validating all scenarios"

components:
  - component_id: "AC-BRAIN-001"
    name: "SynthesisModule Full Implementation"
    effort: "5-7 days"
    tests: 95
    acceptance_criteria: 5
    description: "Combine query results + patterns + knowledge, generate recommendations"
    
    ac_items:
      - ac_id: "AC-BRAIN-001-01"
        title: "Result Aggregation Engine"
        description: |
          Implement result_aggregator.py for combining results from multiple sources.
          Features:
          - Result deduplication and merging
          - Confidence scoring across sources
          - Result ranking by relevance
          - Source attribution and traceability
        acceptance_criteria:
          - "Deduplication removes 90%+ redundant results"
          - "Confidence scores properly weighted by source reliability"
          - "Top results ranked by relevance ≥85% accuracy"
          - "Source attribution captures full lineage"
        tests_required: 19
        test_file: "tests/unit/domain_brain/test_synthesis_module.py"
      
      - ac_id: "AC-BRAIN-001-02"
        title: "Pattern Integration"
        description: |
          Implement pattern_synthesizer.py for integrating detected patterns.
          Features:
          - Pattern-to-insight conversion
          - Temporal pattern analysis
          - Pattern combination for complex insights
          - Pattern-based prediction and recommendation
        acceptance_criteria:
          - "Patterns correctly converted to actionable insights"
          - "Temporal patterns identified across time boundaries"
          - "Complex pattern combinations generate accurate insights"
          - "Prediction confidence properly calibrated"
        tests_required: 19
        test_file: "tests/unit/domain_brain/test_synthesis_module.py"
      
      - ac_id: "AC-BRAIN-001-03"
        title: "Knowledge Integration"
        description: |
          Implement knowledge_synthesizer.py for incorporating knowledge graph.
          Features:
          - Knowledge context enrichment
          - Knowledge-guided synthesis
          - Semantic similarity matching
          - Knowledge consistency validation
        acceptance_criteria:
          - "Knowledge context enriches recommendations"
          - "Semantic similarity matching ≥90% accuracy"
          - "Knowledge consistency violations detected and logged"
          - "Context retrieval latency <200ms"
        tests_required: 19
        test_file: "tests/unit/domain_brain/test_synthesis_module.py"
      
      - ac_id: "AC-BRAIN-001-04"
        title: "Recommendation Generation"
        description: |
          Implement recommendation_engine.py for generating final recommendations.
          Features:
          - Recommendation synthesis from aggregated insights
          - Confidence and priority scoring
          - Recommendation deduplication
          - Recommendation formatting for consumption
        acceptance_criteria:
          - "Recommendations logically derived from input insights"
          - "Confidence scores calibrated to accuracy"
          - "Priority ranking meaningful to consumers"
          - "Format supports multiple consumer types"
        tests_required: 19
        test_file: "tests/unit/domain_brain/test_synthesis_module.py"
      
      - ac_id: "AC-BRAIN-001-05"
        title: "SynthesisModule Orchestration"
        description: |
          Implement synthesis_module.py orchestrating all synthesis components.
          Features:
          - Pipeline orchestration (aggregate → pattern → knowledge → recommend)
          - Result caching and invalidation
          - Performance monitoring
          - MCP tool integration
        acceptance_criteria:
          - "Pipeline stages execute in correct sequence"
          - "End-to-end synthesis latency <2.0s"
          - "Cache hit rate ≥70% on repeated queries"
          - "MCP tools exposed: synthesize, get_recommendations, list_insights"
        tests_required: 19
        test_file: "tests/unit/domain_brain/test_synthesis_module.py"
    
    files_to_create_or_enhance:
      - path: "cortex_brain/synthesis/result_aggregator.py"
        type: "new"
        lines_of_code: "300-350"
        description: "Result deduplication, merging, and ranking"
      
      - path: "cortex_brain/synthesis/pattern_synthesizer.py"
        type: "new"
        lines_of_code: "320-370"
        description: "Pattern-to-insight conversion and analysis"
      
      - path: "cortex_brain/synthesis/knowledge_synthesizer.py"
        type: "new"
        lines_of_code: "300-350"
        description: "Knowledge graph integration and enrichment"
      
      - path: "cortex_brain/synthesis/recommendation_engine.py"
        type: "new"
        lines_of_code: "280-320"
        description: "Final recommendation generation and formatting"
      
      - path: "cortex_brain/synthesis/synthesis_module.py"
        type: "enhance"
        lines_of_code: "200-250 (rewrite)"
        description: "SynthesisModule orchestrating pipeline"
  
  - component_id: "AC-BRAIN-002"
    name: "DomainIntegration Layer"
    effort: "3-4 days"
    tests: 56
    acceptance_criteria: 3
    description: "Bridge domain brain ↔ orchestrators, domain configuration"
    
    ac_items:
      - ac_id: "AC-BRAIN-002-01"
        title: "Orchestrator Bridge"
        description: |
          Implement orchestrator_bridge.py for orchestrator-domain brain communication.
          Features:
          - Request translation (orchestrator → domain brain)
          - Response translation (domain brain → orchestrator)
          - Error handling and fallback
          - Request/response serialization
        acceptance_criteria:
          - "All request types translatable between protocols"
          - "Response translation preserves semantics"
          - "Bridge latency <100ms per request"
          - "Serialization handles all data types"
        tests_required: 28
        test_file: "tests/unit/domain_brain/test_domain_integration.py"
      
      - ac_id: "AC-BRAIN-002-02"
        title: "Domain Configuration"
        description: |
          Implement domain_config.py for domain-specific configuration.
          Features:
          - Domain definition and registration
          - Domain-specific knowledge base links
          - Domain capability declaration
          - Domain-specific orchestration rules
        acceptance_criteria:
          - "Multiple domains configurable independently"
          - "Domain capabilities discoverable"
          - "Configuration changes applied without restart"
          - "Domain isolation enforced"
        tests_required: 14
        test_file: "tests/unit/domain_brain/test_domain_integration.py"
      
      - ac_id: "AC-BRAIN-002-03"
        title: "Domain Integration Layer"
        description: |
          Implement domain_integration.py coordinating all integration aspects.
          Features:
          - Unified domain brain interface
          - Multi-domain orchestration
          - Domain-specific request routing
          - Integration health monitoring
        acceptance_criteria:
          - "Multi-domain requests properly routed"
          - "Domain isolation maintained"
          - "Health monitoring detects integration failures"
          - "MCP tools exposed: query_domain, list_domains, get_domain_capabilities"
        tests_required: 14
        test_file: "tests/unit/domain_brain/test_domain_integration.py"
    
    files_to_create_or_enhance:
      - path: "cortex_brain/integration/orchestrator_bridge.py"
        type: "new"
        lines_of_code: "280-320"
        description: "Orchestrator-domain brain protocol translation"
      
      - path: "cortex_brain/integration/domain_config.py"
        type: "new"
        lines_of_code: "250-300"
        description: "Domain definition and configuration"
      
      - path: "cortex_brain/integration/domain_integration.py"
        type: "new"
        lines_of_code: "220-260"
        description: "Domain integration layer orchestration"

depends_on: ["REMEDIATION-ORCHESTRATION-ROUTING"]

gate_criteria:
  - criterion: "Test Pass Rate"
    target: "≥98% (151/151 tests)"
    verification: "pytest tests/unit/domain_brain/test_synthesis_module.py tests/unit/domain_brain/test_domain_integration.py -v"
  
  - criterion: "Synthesis Quality"
    target: "Recommendations actionable and accurate"
    verification: "Expert review of 20+ synthesized recommendations"
  
  - criterion: "Integration Latency"
    target: "<2.0s end-to-end"
    verification: "Load test: 100 concurrent integration requests"
  
  - criterion: "Type Hints & Docstrings"
    target: "100% coverage"
    verification: "pyright + docstring validation on synthesis/ and integration/ modules"

completion_verification:
  success_criteria:
    - "151 tests passing in test_synthesis_module.py and test_domain_integration.py"
    - "Synthesis pipeline produces actionable recommendations"
    - "Orchestrator-domain brain integration latency <2.0s"
    - "Multi-domain queries fully functional"
    - "All type hints present (100% coverage)"
    - "All docstrings Google style (100% coverage)"

  verification_steps:
    - "Run: pytest tests/unit/domain_brain/test_synthesis_module.py -v → 95/95 pass"
    - "Run: pytest tests/unit/domain_brain/test_domain_integration.py -v → 56/56 pass"
    - "Run: pyright cortex_brain/synthesis/ cortex_brain/integration/ → 0 errors"
    - "Load test: 100 concurrent synthesis requests complete <2.0s each"
    - "Integration test: Multi-domain queries produce consistent results"

deliverables:
  - "tests/unit/domain_brain/test_synthesis_module.py (95 tests)"
  - "cortex_brain/synthesis/result_aggregator.py (300-350 LOC)"
  - "cortex_brain/synthesis/pattern_synthesizer.py (320-370 LOC)"
  - "cortex_brain/synthesis/knowledge_synthesizer.py (300-350 LOC)"
  - "cortex_brain/synthesis/recommendation_engine.py (280-320 LOC)"
  - "cortex_brain/synthesis/synthesis_module.py (enhanced, 200-250 LOC)"
  - "tests/unit/domain_brain/test_domain_integration.py (56 tests)"
  - "cortex_brain/integration/orchestrator_bridge.py (280-320 LOC)"
  - "cortex_brain/integration/domain_config.py (250-300 LOC)"
  - "cortex_brain/integration/domain_integration.py (220-260 LOC)"

git_strategy:
  commit_message: "remediation: REMEDIATION-DOMAIN-BRAIN-SYNTHESIS: SynthesisModule + DomainIntegration (151 tests, 95+56)"
  commit_detail: |
    - SynthesisModule: Result aggregation + pattern/knowledge synthesis (95 tests)
      * result_aggregator.py: Deduplication, merging, ranking
      * pattern_synthesizer.py: Pattern-to-insight conversion
      * knowledge_synthesizer.py: Knowledge graph integration
      * recommendation_engine.py: Final recommendation generation
      * synthesis_module.py: Pipeline orchestration
    
    - DomainIntegration: Orchestrator-domain brain bridging (56 tests)
      * orchestrator_bridge.py: Protocol translation
      * domain_config.py: Domain definition and configuration
      * domain_integration.py: Layer orchestration
    
    Total: 151 tests, 2750-3150 LOC, production-ready quality

timeline:
  estimated_days: "5-7"
  critical_path: "SynthesisModule (5-7d) + DomainIntegration (3-4d), integration testing (1d)"
  optimization: "SynthesisModule and DomainIntegration can run in parallel"

next_phase: "REMEDIATION-DOMAIN-BRAIN-QUERIES"
