phase:
  id: transform-002
  name: Architectural Consolidation - Eliminate Redundancy
  priority: 2
  blocking_deployment: false
  created_at: '2026-01-23T18:00:00Z'
  start_date: '2026-02-08'
  target_completion: '2026-02-28'
  total_effort_hours: 60
  
  objective: |
    Consolidate redundant orchestration components, unify scattered domain logic,
    and remove obsolete code. This reduces maintenance burden by 30% and clarifies
    component ownership.
  
  current_state:
    total_files: 388
    redundant_components: 8
    obsolete_scripts: 73
    scattered_domains: 4
    issues:
      - OrchestratorComposite duplicates WorkflowOrchestrator
      - Coordinator overlaps with MasterOrchestrator delegation
      - Conversation state split across continuer/chain
      - Profile management fragmented across 3 files
      - Domain logic scattered across domain/, domains/, domain_*.py
      - scripts-root-archive contains 73 obsolete one-time scripts
  
  target_state:
    total_files: 300
    redundant_components: 0
    obsolete_scripts: 0
    unified_domains: 1
    code_reduction: "23%"
  
  items:
    - id: CONSOL-001
      title: "Merge OrchestratorComposite into WorkflowOrchestrator"
      description: |
        OrchestratorComposite and WorkflowOrchestrator provide overlapping functionality
        for orchestrating multi-step workflows. Consolidate into single component.
      files:
        - cortex/orchestrators/orchestrator_composite.py (REMOVE)
        - cortex/orchestrators/workflow_orchestrator.py (ENHANCE)
        - cortex/orchestrators/core/workflow_orchestrator.py (MIGRATE TO)
      implementation:
        - Analyze usage patterns of OrchestratorComposite
        - Migrate unique logic to WorkflowOrchestrator
        - Update all references to use WorkflowOrchestrator
        - Add composition patterns to WorkflowOrchestrator
        - Deprecate OrchestratorComposite with migration guide
        - Remove file after migration complete
      acceptance_criteria:
        - All OrchestratorComposite functionality in WorkflowOrchestrator
        - Zero references to OrchestratorComposite in codebase
        - All tests migrated and passing
        - orchestrator_composite.py removed
        - Documentation updated with new patterns
      estimated_hours: 8
      priority: HIGH
      dependencies: []
    
    - id: CONSOL-002
      title: "Migrate Coordinator Logic to MasterOrchestrator"
      description: |
        Coordinator.py provides orchestrator delegation logic that duplicates
        MasterOrchestrator's coordination responsibility. Consolidate into MasterOrchestrator.
      files:
        - cortex/orchestrators/coordinator.py (REMOVE)
        - cortex/orchestrators/core/master_orchestrator.py (ENHANCE)
      implementation:
        - Identify unique delegation patterns in Coordinator
        - Integrate delegation logic into MasterOrchestrator
        - Update references to use MasterOrchestrator delegation
        - Add coordinator tests to MasterOrchestrator test suite
        - Remove coordinator.py after migration
      acceptance_criteria:
        - All delegation logic in MasterOrchestrator
        - Zero references to Coordinator class
        - All coordinator tests migrated and passing
        - coordinator.py removed
        - Delegation patterns documented
      estimated_hours: 6
      priority: HIGH
      dependencies: []
    
    - id: CONSOL-003
      title: "Unify Conversation State Management"
      description: |
        Conversation state is split across ConversationOrchestrator, ConversationContinuer,
        and ContinuationChain. Consolidate into single ConversationOrchestrator.
      files:
        - cortex/orchestrators/conversation_orchestrator.py (ENHANCE)
        - cortex/orchestrators/conversation_continuer.py (REMOVE)
        - cortex/orchestrators/continuation_chain.py (REMOVE)
      implementation:
        - Analyze conversation state tracking in all 3 components
        - Design unified state management in ConversationOrchestrator
        - Migrate conversation continuation logic
        - Migrate chain tracking logic
        - Add comprehensive state tests
        - Remove continuer and chain files
      acceptance_criteria:
        - Single conversation state manager in ConversationOrchestrator
        - Continuation and chain logic fully migrated
        - All conversation tests passing
        - continuer.py and chain.py removed
        - State management documented with examples
      estimated_hours: 10
      priority: MEDIUM
      dependencies: []
    
    - id: CONSOL-004
      title: "Consolidate Profile Management"
      description: |
        Profile management split across profile_upgrader, profile_versioner, and
        profile_wizard. Create unified ProfileManager in cortex/config/.
      files:
        - cortex/orchestrators/profile_upgrader.py (MIGRATE)
        - cortex/orchestrators/profile_versioner.py (MIGRATE)
        - cortex/orchestrators/profile_wizard.py (MIGRATE)
        - cortex/config/profile_manager.py (CREATE)
      implementation:
        - Design unified ProfileManager API
        - Migrate upgrade logic to ProfileManager.upgrade()
        - Migrate version logic to ProfileManager.version()
        - Move wizard to cortex/config/profile_wizard.py (configuration, not orchestration)
        - Add comprehensive profile tests
        - Remove old profile files from orchestrators/
      acceptance_criteria:
        - ProfileManager handles all profile operations
        - Wizard moved to config/ directory
        - All profile tests passing
        - Old profile files removed from orchestrators/
        - Profile API documented
      estimated_hours: 8
      priority: MEDIUM
      dependencies: []
    
    - id: CONSOL-005
      title: "Unify Domain Directory Structure"
      description: |
        Domain logic scattered across domain/, domains/, domain_orchestrator.py,
        domain_brain.py. Consolidate into single domain/ directory with clear organization.
      files:
        - cortex/orchestrators/domain/ (TARGET - unified structure)
        - cortex/orchestrators/domains/ (MIGRATE)
        - cortex/orchestrators/domain_orchestrator.py (MIGRATE)
        - cortex/orchestrators/domain_brain.py (MIGRATE)
      target_structure:
        - cortex/orchestrators/domain/__init__.py (exports)
        - cortex/orchestrators/domain/base.py (DomainOrchestrator base)
        - cortex/orchestrators/domain/refactoring.py (RefactoringOrchestrator)
        - cortex/orchestrators/domain/planning.py (PlanningOrchestrator)
        - cortex/orchestrators/domain/traits.py (orchestrator protocols)
        - cortex/orchestrators/domain/classifier.py (domain classification)
        - cortex/orchestrators/domain/brain_integration.py (domain brain wiring)
      implementation:
        - Create new domain/ structure
        - Migrate RefactoringOrchestrator to domain/refactoring.py
        - Migrate PlanningOrchestrator to domain/planning.py
        - Migrate traits from domains/orchestrator_traits.py to domain/traits.py
        - Migrate classifier from domains/domain_classifier.py to domain/classifier.py
        - Move DomainOrchestrator to domain/base.py
        - Move domain brain integration to domain/brain_integration.py
        - Update all imports to use new structure
        - Remove old domain_* files and domains/ directory
      acceptance_criteria:
        - All domain logic in domain/ directory
        - Clear file organization (one orchestrator per file)
        - All imports updated and validated
        - Old scattered files removed
        - Domain structure documented
      estimated_hours: 12
      priority: HIGH
      dependencies: []
    
