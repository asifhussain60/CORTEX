# PHASE: Production Observability and Operations
# ID: impl-ops-004-observability
# Priority: P1-HIGH (Required for Production)
# Date: 2026-01-20

metadata:
  phase_id: "impl-ops-004-observability"
  title: "Production Observability and Operations"
  priority: "P1-HIGH"
  estimated_effort: "4-6 days"
  blocks_production: false  # Can deploy without, but risky
  dependencies: ["impl-infra-001-resilience", "impl-state-002-concurrency", "impl-recovery-003-fault-tolerance"]

executive_summary: |
  Current observability is insufficient for production operations. Missing structured
  logging, incomplete metrics, no distributed tracing, inadequate health checks, and
  lack of operational visibility make troubleshooting and capacity planning impossible.
  
  This phase implements comprehensive observability with structured logging, Prometheus
  metrics, distributed tracing, detailed health endpoints, and operational dashboards
  to enable effective production operations.

problem_analysis:
  root_causes:
    unstructured_logging:
      issue: "Print statements and inconsistent log formats"
      risk: "Cannot parse, aggregate, or alert on logs"
      failure_mode: "Manual log review, slow incident response"
      current: "Mix of print(), logging.info(), no structure"
    
    incomplete_metrics:
      issue: "Only basic counters, missing histograms and gauges"
      location: "Partial metrics in some modules"
      risk: "Cannot diagnose performance issues"
      failure_mode: "Blind to latency, resource usage, errors"
    
    no_distributed_tracing:
      issue: "Cannot trace requests across components"
      risk: "Unknown which component slow/failing"
      failure_mode: "Lengthy incident investigation"
    
    basic_health_checks:
      issue: "/health returns 200 even when degraded"
      risk: "Load balancer routes to unhealthy instances"
      failure_mode: "Requests fail after routing"
    
    missing_operational_dashboards:
      issue: "No real-time visibility into system state"
      risk: "Operators unaware of issues until user reports"
      failure_mode: "Reactive incident management"

  production_impact:
    operability:
      - "Cannot diagnose performance issues without structured logs"
      - "Incident response delayed due to lack of visibility"
      - "Capacity planning impossible without usage metrics"
      - "No proactive alerting, only reactive"
    
    reliability:
      - "Degraded instances remain in service (inadequate health checks)"
      - "Cascading failures not detected early"
      - "Resource exhaustion discovered too late"
    
    security:
      - "Security events not logged consistently"
      - "Audit trail incomplete for compliance"
      - "Cannot detect anomalous behavior patterns"

acceptance_criteria:
  AC-OPS-004-01:
    title: "Structured Logging with Context Propagation"
    description: |
      Implement structured JSON logging with correlation IDs, request context,
      and consistent fields across all components.
    
    requirements:
      - "JSON format: timestamp, level, correlation_id, component, message, context"
      - "Context propagation: correlation ID through call chain"
      - "Log levels: DEBUG, INFO, WARN, ERROR, CRITICAL"
      - "Sampling: DEBUG logs sampled at 1% in production"
      - "PII redaction: automatic removal of sensitive data"
      - "Performance: log buffering, async writes, <1ms overhead"
    
    edge_cases:
      - "Large context objects: truncate, log size limit 4KB"
      - "Circular references in context: detect, serialize as [circular]"
      - "Missing correlation ID: generate, propagate"
      - "Log buffer full: drop DEBUG, preserve ERROR+"
    
    validation:
      - "All logs parseable as JSON"
      - "Correlation ID present in 100% of logs"
      - "PII automatically redacted"
      - "Log overhead <1ms P99"
    
    files:
      implementation: "cortex/infrastructure/structured_logger.py"
      tests: "tests/unit/infrastructure/test_structured_logging.py"

  AC-OPS-004-02:
    title: "Prometheus Metrics with RED Method"
    description: |
      Implement comprehensive Prometheus metrics following RED (Rate, Errors,
      Duration) and USE (Utilization, Saturation, Errors) methods.
    
    requirements:
      - "Request metrics: rate, errors, duration (RED)"
      - "Resource metrics: CPU, memory, connections (USE)"
      - "Business metrics: phases completed, rules evaluated"
      - "Custom metrics: governance decisions, circuit breaker states"
      - "Label cardinality: <100 per metric (prevent cardinality explosion)"
      - "Scrape endpoint: /metrics (Prometheus format)"
    
    metrics_required:
      request_metrics:
        - "http_requests_total (counter: status, method, endpoint)"
        - "http_request_duration_seconds (histogram: endpoint)"
        - "http_requests_in_flight (gauge: endpoint)"
      
      database_metrics:
        - "db_connections_active (gauge)"
        - "db_connections_idle (gauge)"
        - "db_query_duration_seconds (histogram: query_type)"
        - "db_queries_total (counter: query_type, status)"
      
      business_metrics:
        - "phases_total (counter: status)"
        - "ac_completed_total (counter: phase)"
        - "governance_checks_total (counter: rule, decision)"
        - "orchestrator_executions_total (counter: orchestrator, status)"
    
    edge_cases:
      - "Label explosion: limit to predefined values, 'other' bucket"
      - "Histogram buckets: pre-configured for latency (1ms, 10ms, 100ms, 1s, 10s)"
      - "Counter reset on restart: use rate() queries"
      - "Missing labels: default to 'unknown'"
    
    validation:
      - "/metrics endpoint returns valid Prometheus format"
      - "All critical paths instrumented"
      - "Label cardinality <100 per metric"
      - "Scrape time <100ms"
    
    files:
      implementation: "cortex/infrastructure/prometheus_metrics.py"
      tests: "tests/unit/infrastructure/test_prometheus_metrics.py"

  AC-OPS-004-03:
    title: "Distributed Tracing with OpenTelemetry"
    description: |
      Implement distributed tracing to track requests across components
      with span context propagation and trace sampling.
    
    requirements:
      - "Trace context propagation via headers"
      - "Automatic span creation for: HTTP, database, governance checks"
      - "Span attributes: operation, duration, status, error details"
      - "Sampling: 100% errors, 1% success in production"
      - "Export to: Jaeger/Zipkin compatible backend"
      - "Trace retention: 7 days, errors 30 days"
    
    spans_to_instrument:
      - "HTTP request handling"
      - "Database queries"
      - "Governance rule evaluation"
      - "Orchestrator execution"
      - "MCP tool invocation"
      - "Knowledge graph queries"
    
    edge_cases:
      - "Missing trace context: start new trace"
      - "Span export failure: buffer locally, retry"
      - "Trace too large (>1000 spans): sample more aggressively"
      - "Circular span references: detect, break cycle"
    
    validation:
      - "End-to-end trace visible in Jaeger UI"
      - "Span context propagates correctly"
      - "Sampling rates configurable per environment"
      - "Trace export doesn't block requests"
    
    files:
      implementation: "cortex/infrastructure/tracing.py"
      tests: "tests/unit/infrastructure/test_distributed_tracing.py"

  AC-OPS-004-04:
    title: "Comprehensive Health and Readiness Checks"
    description: |
      Implement detailed health checks with component-level status,
      dependency health, and readiness vs liveness distinction.
    
    requirements:
      - "/health: liveness check (is process alive?)"
      - "/ready: readiness check (can serve traffic?)"
      - "/health/deep: detailed component health"
      - "Component checks: database, cache, dependencies"
      - "Status codes: 200 (healthy), 503 (degraded/unhealthy)"
      - "Response time: <100ms for /health, <500ms for /deep"
    
    health_response_format:
      ```json
      {
        "status": "healthy|degraded|unhealthy",
        "timestamp": "ISO-8601",
        "version": "1.2.3",
        "uptime_seconds": 12345,
        "components": {
          "database": {"status": "healthy", "latency_ms": 5},
          "cache": {"status": "degraded", "reason": "high latency"},
          "governance": {"status": "healthy"}
        }
      }
      ```
    
    edge_cases:
      - "Health check fails: retry 3 times before marking unhealthy"
      - "Circular health check dependency: detect, mark as error"
      - "Health check timeout: fail after 5s"
      - "All components failing: system status = unhealthy"
    
    validation:
      - "Liveness check always responds <100ms"
      - "Readiness check accurately reflects service state"
      - "Component failures reflected in health status"
      - "Load balancer correctly removes unhealthy instances"
    
    files:
      implementation: "cortex/api/health_endpoints.py"
      tests: "tests/unit/api/test_health_checks.py"

  AC-OPS-004-05:
    title: "Operational Dashboards and Alerts"
    description: |
      Create Grafana dashboards and Prometheus alerts for critical
      system metrics and operational awareness.
    
    dashboards_required:
      system_overview:
        - "Request rate, error rate, latency (RED)"
        - "Connection pool utilization"
        - "Circuit breaker states"
        - "Error budget remaining"
      
      governance_dashboard:
        - "Rules evaluated per second"
        - "Rule pass/fail rates"
        - "Governance check latency"
        - "Quota enforcement actions"
      
      database_dashboard:
        - "Query latency by type"
        - "Connection pool metrics"
        - "Transaction rollback rate"
        - "Lock contention"
    
    alerts_required:
      critical:
        - "Error rate >5% for 5 minutes"
        - "Latency P95 >1s for 5 minutes"
        - "Connection pool >90% for 10 minutes"
        - "Circuit breaker open for >5 minutes"
      
      warning:
        - "Error rate >1% for 10 minutes"
        - "Latency P95 >500ms for 10 minutes"
        - "Memory usage >80%"
        - "Disk space <20%"
    
    validation:
      - "All dashboards rendering correctly"
      - "Alerts trigger on threshold violation"
      - "Alert notifications delivered within 1 minute"
      - "Dashboards reflect real-time state"
    
    files:
      dashboards: "deployment/grafana/dashboards/*.json"
      alerts: "deployment/prometheus/alerts.yaml"
      tests: "tests/integration/test_monitoring_stack.py"

  AC-OPS-004-06:
    title: "Performance Profiling and Debugging Tools"
    description: |
      Implement on-demand profiling, request debugging, and performance
      analysis tools for production troubleshooting.
    
    requirements:
      - "CPU profiling: enable on-demand via API"
      - "Memory profiling: heap snapshots, leak detection"
      - "Request replay: capture and replay for debugging"
      - "Slow query log: queries >100ms logged"
      - "Transaction tracing: detailed execution path"
      - "Profile data export: downloadable for offline analysis"
    
    endpoints:
      - "POST /debug/profile/cpu?duration=30s → CPU profile"
      - "POST /debug/profile/memory → heap snapshot"
      - "GET /debug/queries/slow → slow query log"
      - "POST /debug/transaction/trace?id=123 → trace transaction"
    
    edge_cases:
      - "Profiling overhead: limit concurrent profiles to 1"
      - "Profile size limit: 100MB, truncate if exceeded"
      - "Profiling in production: require auth token"
      - "Sensitive data in profiles: redact automatically"
    
    validation:
      - "CPU profiler generates valid pprof file"
      - "Memory snapshot captures heap state accurately"
      - "Slow query log contains relevant queries"
      - "Profiling doesn't degrade performance >5%"
    
    files:
      implementation: "cortex/devx/profiling_tools.py"
      tests: "tests/unit/devx/test_profiling.py"

implementation_strategy:
  phase_1_logging_metrics:
    duration: "2 days"
    focus: "Structured logging and Prometheus metrics"
    deliverables:
      - "AC-OPS-004-01: Structured logging"
      - "AC-OPS-004-02: Prometheus metrics"
    validation: "Logs parseable, metrics scrapeable"
  
  phase_2_tracing_health:
    duration: "2 days"
    focus: "Distributed tracing and health checks"
    deliverables:
      - "AC-OPS-004-03: OpenTelemetry tracing"
      - "AC-OPS-004-04: Health endpoints"
    validation: "Traces visible, health checks accurate"
  
  phase_3_operations:
    duration: "2 days"
    focus: "Dashboards, alerts, and profiling tools"
    deliverables:
      - "AC-OPS-004-05: Operational dashboards"
      - "AC-OPS-004-06: Profiling tools"
    validation: "Dashboards deployed, profiling functional"

success_criteria:
  visibility:
    - "100% of critical paths instrumented"
    - "All requests traceable end-to-end"
    - "Component health visible in real-time"
    - "Operational dashboards showing key metrics"
  
  diagnosability:
    - "Mean time to detect (MTTD) <2 minutes"
    - "Mean time to understand (MTTU) <10 minutes"
    - "Structured logs enable rapid RCA"
    - "Profiling tools available on-demand"
  
  performance:
    - "Observability overhead <5% CPU, <10% memory"
    - "Log writes don't block requests"
    - "Metric scraping <100ms"
    - "Health checks <100ms"

monitoring_requirements:
  meta_monitoring:
    - "observability_log_drops_total (counter)"
    - "observability_metric_scrape_duration_seconds (histogram)"
    - "observability_trace_export_failures_total (counter)"
    - "observability_overhead_cpu_percent (gauge)"
