acceptance_criteria:
  - id: "AC-EXPORT-001"
    description: "All 44 missing exports added to respective modules"
    verification: "grep -r 'class ComplexityLevel' cortex/ returns match"
    
  - id: "AC-EXPORT-002"
    description: "pytest --collect-only shows 0 ImportError"
    verification: "pytest --collect-only 2>&1 | grep ImportError | wc -l == 0"
    
  - id: "AC-EXPORT-003"
    description: "Collection errors reduced from 76 to ~15 (RecursionError only)"
    verification: "pytest --collect-only reports ~15 errors (recursion only)"
    
  - id: "AC-EXPORT-004"
    description: "All exports have type hints and docstrings"
    verification: "All new classes have @dataclass or class definition with docstring"
    
  - id: "AC-EXPORT-005"
    description: "Git checkpoint created after completion"
    verification: "git log shows 'checkpoint: Phase F export completion'"

implementation_steps:
  step_1:
    description: "Audit all missing exports from pytest output"
    effort: "30 min"
    command: |
      python3 -m pytest --collect-only 2>&1 | \
        grep "ImportError: cannot import name" | \
        sed "s/.*cannot import name '\([^']*\)' from '\([^']*\)'.*/\2: \1/" | \
        sort -u > missing_exports.txt
    
  step_2:
    description: "For each missing export, add stub class/function"
    effort: "3 hours"
    pattern: |
      # Example for ComplexityLevel
      class ComplexityLevel(Enum):
          """Complexity level enumeration."""
          LOW = "low"
          MEDIUM = "medium"
          HIGH = "high"
          CRITICAL = "critical"
    
  step_3:
    description: "Update __all__ in each modified module"
    effort: "30 min"
    
  step_4:
    description: "Run pytest --collect-only to verify"
    effort: "15 min"
    command: "python3 -m pytest --collect-only -q 2>&1 | tail -20"
    expected: "~15 errors (RecursionError only)"
    
  step_5:
    description: "Git checkpoint"
    effort: "5 min"
    command: "git add -A && git commit -m 'checkpoint: Phase F export completion - 44 missing exports added'"

success_criteria:
  before:
    collection_errors: 76
    import_errors: 44
    tests_collectible: 5653
  
  after:
    collection_errors: "~15 (RecursionError only)"
    import_errors: 0
    tests_collectible: "~5700+"

