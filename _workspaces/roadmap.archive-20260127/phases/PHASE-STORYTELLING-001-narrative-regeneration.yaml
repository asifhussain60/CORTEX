## Technical Specifications

### Story Tone Requirements
- **Target:** Technical accuracy + comedic narrative
- **Balance:** 70% accurate implementation details, 30% humor/metaphor
- **Characters:** Distinct voices (Asif = visionary builder, Miss G = pragmatic enforcer)
- **Humor Style:** Self-aware tech comedy, not slapstick

### Image Prompt Standards
- **Clarity:** Specific enough for consistent generation
- **Length:** 150-250 words per prompt (DALL-E optimal range)
- **Color Coding:** Intentional palette to distinguish technical categories
- **Metaphor:** Consistent visual metaphors across chapters

### Character Consistency
- **Asif Codenstien:** Brilliant architect, perpetually tired, inspired visionary
- **Miss Governance:** Authority figure, governance expert, fair but strict
- **Personality:** Complementary dynamic (builder + auditor)

