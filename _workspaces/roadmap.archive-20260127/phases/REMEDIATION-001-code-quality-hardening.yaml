# Phase REMEDIATION-001: Code Quality Hardening
# Addresses 137 identified code quality issues across CORTEX codebase
# Authority: BRITTLENESS_ANALYSIS.yaml, TECHNICAL_DEBT_ANALYSIS.yaml, CORE_VIOLATIONS_DETAILED.md
# Date: 2026-01-21
# Priority: P0-CRITICAL
# Machine: ah

metadata:
  phase_id: "REMEDIATION-001-code-quality-hardening"
  title: "Code Quality Hardening - Critical Path Stabilization"
  description: |
    Production stabilization phase addressing 137 identified issues:
    - 12 CRITICAL severity: bare except, resource leaks, unhandled exceptions
    - 28 HIGH severity: missing cleanup, type safety, exception suppression
    - 45 MEDIUM severity: validation patterns, configuration parsing, logging
    - 52 LOW severity: documentation, naming, minor refactoring
    
    Focuses on stability, observability, and production readiness.
  
  priority: "P0-CRITICAL"
  estimated_effort: "5-7 days"
  blocks_production: true
  machine: "ah"
  depends_on:
    - "PHASE-DEPLOYMENT-006-profiles"  # After main track complete

executive_summary: |
  Code quality analysis identified 137 defects across CORTEX codebase.
  This phase systematically remediates CRITICAL and HIGH severity issues:
  
  **CRITICAL (12):**
  - Bare except: clauses masking errors (5 files)
  - Database connection leaks (3 files)
  - Broad exception suppression (4 files)
  - Single point of failure without fallback (1 file)
  - Unhandled parse errors in critical paths (2 files)
  
  **HIGH (28):**
  - Missing resource cleanup (6 files)
  - Type safety violations (8 files)
  - Inconsistent error handling (7 files)
  - Logging gaps (4 files)
  - Configuration validation issues (3 files)
  
  **DELIVERY:**
  - All CRITICAL issues resolved (12/12)
  - All HIGH issues resolved (28/28)
  - Enhanced exception handling library
  - Automated violation detection (pre-commit)
  - Production health check framework

current_state:
  critical_count: 12
  high_count: 28
  medium_count: 45
  low_count: 52
  total_issues: 137
  
  affected_files:
    - "tests/test_ac_ar_010_03_imports.py (bare except: x3)"
    - "tests/unit/test_conversation_protocol_transactions.py (bare except: x2)"
    - "cortex/brain/mcp/tools/validate_consolidation.py (bare except: + parse errors)"
    - "cortex/tools/toolkit/ac_fix_001_06_regenerate.py (conn leak)"
    - "cortex/infrastructure/connection_pool.py (suppression + health check)"
    - "cortex/infrastructure/database.py (suppression x3)"
    - "cortex/infrastructure/audit_logger.py (suppression)"
    - "+9 more files with HIGH severity issues"
  
  production_risk: "HIGH - Silent failures hide bugs, resource exhaustion possible"

