phase_definitions:
  - phase_id: "PHASE-KG-001-foundation"
    sequence: 1
    title: "Knowledge Graph Foundation - Entity Models & Schema"
    estimated_effort: "3-4 days"
    estimated_tests: 40
    blocking: false
    
    deliverables:
      - name: "Neo4j/Neptune Setup"
        description: "Configure production-grade graph database (Neo4j Aura or Amazon Neptune)"
        files:
          - "cortex/infrastructure/kg_backend.py"
          - "cortex/infrastructure/kg_config.yaml"
        
      - name: "Entity Relationship Models"
        description: "Define domain entities, relationships, and graph structure"
        files:
          - "cortex/knowledge_graph/entity_models.py"
          - "cortex/knowledge_graph/relationship_types.py"
        
      - name: "Graph Schema Design"
        description: "Node types, relationship types, properties, constraints"
        files:
          - "cortex/knowledge_graph/schema.yaml"
        
      - name: "Ingest Adapter Framework"
        description: "Abstract adapter for entity ingestion from various sources"
        files:
          - "cortex/knowledge_graph/ingest_adapter.py"
    
    acceptance_criteria:
      - "Backend successfully deployed"
      - "Schema documented and validated"
      - "All 40 tests passing"
    
    dependencies: ["PHASE-E-TDD-IMPLEMENTATION"]
  
  - phase_id: "PHASE-KG-002-entity-sync"
    sequence: 2
    title: "Knowledge Graph Entity Synchronization"
    estimated_effort: "2-3 days"
    estimated_tests: 60
    blocking: false
    
    deliverables:
      - name: "Entity Sync Pipeline"
        description: "Sync domain entities from BusinessKnowledgeRepository to KG"
        files:
          - "cortex/knowledge_graph/entity_sync.py"
        
      - name: "Relationship Synchronization"
        description: "Model and sync service-to-service and API relationships"
        files:
          - "cortex/knowledge_graph/relationship_sync.py"
        
      - name: "Conflict Resolution"
        description: "Deduplication and conflict resolution for overlapping entities"
        files:
          - "cortex/knowledge_graph/conflict_resolution.py"
        
      - name: "SQLite Fallback"
        description: "Graceful degradation to SQLite if KG unavailable"
        files:
          - "cortex/knowledge_graph/sqlite_fallback.py"
    
    acceptance_criteria:
      - "Entities successfully ingested"
      - "Relationships accurately modeled"
      - "Governance rules synchronized"
      - "Deduplication working"
      - "SQLite fallback verified"
      - "All 60 tests passing"
    
    dependencies: ["PHASE-KG-001-foundation"]
  
  - phase_id: "PHASE-KG-003-query-layer"
    sequence: 3
    title: "Knowledge Graph Query and Inference Engine"
    estimated_effort: "2-3 days"
    estimated_tests: 50
    blocking: false
    
    deliverables:
      - name: "Query Adapter Interface"
        description: "Abstract query interface with KG and SQLite implementations"
        files:
          - "cortex/knowledge_graph/query_adapter.py"
        
      - name: "Graph Query Engine"
        description: "Traverse graph, 1-3 hop queries, pattern matching"
        files:
          - "cortex/knowledge_graph/graph_queries.py"
        
      - name: "Semantic Queries"
        description: "High-level semantic query syntax for domain reasoning"
        files:
          - "cortex/knowledge_graph/semantic_queries.py"
        
      - name: "Inference Engine"
        description: "Rule inference and deductive reasoning on graph"
        files:
          - "cortex/knowledge_graph/inference.py"
    
    acceptance_criteria:
      - "Query adapter complete"
      - "Multi-hop queries working (1-3 hops)"
      - "Semantic syntax supported"
      - "Inference engine operational"
      - "SQLite fallback on timeout"
      - "All 50 tests passing"
    
    dependencies: ["PHASE-KG-002-entity-sync"]
  
  - phase_id: "PHASE-KG-004-routing-optimization"
    sequence: 4
    title: "Knowledge Graph Routing Decision Optimization"
    estimated_effort: "2-3 days"
    estimated_tests: 40
    blocking: false
    
    deliverables:
      - name: "KG-Based Routing Strategy"
        description: "Use graph insights for orchestrator selection"
        files:
          - "cortex/knowledge_graph/routing_strategy.py"
        
      - name: "Capability Matching"
        description: "Semantic matching of request requirements to orchestrator capabilities"
        files:
          - "cortex/knowledge_graph/capability_matching.py"
        
      - name: "MasterOrchestrator Integration"
        description: "Optional, non-breaking integration with MasterOrchestrator"
        files:
          - "cortex/orchestrators/master_orchestrator_kg_integration.py"
    
    acceptance_criteria:
      - "Semantic capability matching working"
      - "Graph-based routing operational"
      - "Integration non-breaking (can be disabled)"
      - "Performance optimized"
      - "Fallback to current routing working"
      - "All 40 tests passing"
    
    dependencies: ["PHASE-KG-003-query-layer"]
  
  - phase_id: "PHASE-KG-005-validation"
    sequence: 5
