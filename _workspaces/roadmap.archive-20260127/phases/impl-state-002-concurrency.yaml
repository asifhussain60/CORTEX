# PHASE: State Management and Concurrency Safety
# ID: impl-state-002-concurrency
# Priority: P0-CRITICAL (Blocks Production)
# Date: 2026-01-20

metadata:
  phase_id: "impl-state-002-concurrency"
  title: "State Management and Concurrency Safety"
  priority: "P0-CRITICAL"
  estimated_effort: "6-8 days"
  blocks_production: true
  dependencies: ["impl-infra-001-resilience"]

executive_summary: |
  Critical concurrency and state management issues make CORTEX unsafe for production.
  Thread-local state without proper locking, shared mutable state, missing transaction
  isolation, and inadequate conflict resolution create data races, corruption risks,
  and non-deterministic behavior under concurrent load.
  
  This phase implements proper concurrency primitives, transactional state management,
  optimistic locking, and conflict resolution to ensure correctness under concurrent access.

problem_analysis:
  root_causes:
    thread_local_without_locks:
      issue: "Thread-local connections accessed without synchronization"
      location: "cortex/infrastructure/database.py DatabaseManager._local"
      risk: "Race conditions during connection initialization"
      failure_mode: "Duplicate connections, connection leaks, data races"
      test_evidence: "tests/unit/infrastructure/test_connection_lifecycle.py line 58"
    
    shared_mutable_state:
      issue: "Global registry modified without locks"
      location: "cortex/orchestrators/core/orchestrator_registry.py"
      risk: "Lost updates, inconsistent registry state"
      failure_mode: "Orchestrator registration races, missing entries"
    
    missing_transaction_isolation:
      issue: "Database operations not wrapped in transactions"
      risk: "Partial writes visible to other threads"
      failure_mode: "Inconsistent state, integrity violations"
      current: "Auto-commit mode, no explicit transactions"
    
    no_optimistic_locking:
      issue: "No version tracking for concurrent updates"
      risk: "Lost updates in write-write conflicts"
      failure_mode: "Silent data loss, last-write-wins"
      location: "Phase status updates, AC tracking"
    
    audit_log_race_conditions:
      issue: "Hash chain calculation not atomic"
      location: "cortex/infrastructure/database.py _last_audit_hash"
      risk: "Corrupted hash chain under concurrent writes"
      failure_mode: "Integrity verification fails"

  production_impact:
    correctness:
      - "Lost updates when multiple threads modify same phase"
      - "Corrupted hash chain breaks audit integrity"
      - "Race conditions in orchestrator registration"
      - "Non-deterministic test failures under concurrency"
    
    reliability:
      - "Deadlocks during concurrent governance checks"
      - "Transaction isolation failures cause rollback storms"
      - "State inconsistencies require manual intervention"
    
    security:
      - "Audit log corruption undermines compliance"
      - "Race conditions bypass governance checks"
      - "TOCTOU vulnerabilities in permission checks"

acceptance_criteria:
  AC-STATE-002-01:
    title: "Transactional State Management"
    description: |
      Implement ACID transactions for all state mutations with proper
      isolation levels, deadlock detection, and automatic retry.
    
    requirements:
      - "Explicit transaction boundaries for all writes"
      - "Isolation level: SERIALIZABLE for audit, READ COMMITTED for reads"
      - "Automatic retry on deadlock (max 3 attempts)"
      - "Transaction timeout: 5 seconds default"
      - "Nested transaction support via savepoints"
      - "Transaction metrics: commits, rollbacks, deadlocks"
    
    edge_cases:
      - "Deadlock detected: rollback, wait with jitter, retry"
      - "Transaction timeout: rollback, log warning"
      - "Nested transaction failure: rollback to savepoint"
      - "Connection dies mid-transaction: rollback, reconnect"
      - "Write-write conflict: detect via optimistic lock"
    
    validation:
      - "100 concurrent updates, zero lost writes"
      - "Deadlock detected and resolved automatically"
      - "Isolation verified: no dirty reads, phantom reads"
      - "Transaction rollback leaves no partial state"
    
    files:
      implementation: "cortex/infrastructure/transaction_manager.py"
      tests: "tests/unit/infrastructure/test_transaction_acid.py"
      integration: "tests/integration/test_concurrent_transactions.py"

  AC-STATE-002-02:
    title: "Optimistic Locking with Version Vectors"
    description: |
      Implement version-based optimistic locking to detect and resolve
      concurrent update conflicts without blocking readers.
    
    requirements:
      - "Version column on all mutable tables (phases, ac_index)"
      - "Read: capture current version"
      - "Write: UPDATE WHERE version = read_version"
      - "Conflict detection: affected_rows == 0"
      - "Retry strategy: re-read, merge, retry up to 3 times"
      - "Conflict metrics: detection rate, resolution success"
    
    edge_cases:
      - "Write-write conflict: merge if possible, fail if incompatible"
      - "Stale read: force refresh before write"
      - "Version overflow: reset to 0, update all clients"
      - "Concurrent deletes: detect via version, return 410 Gone"
    
    validation:
      - "10 concurrent updates to same row, all succeed or fail cleanly"
      - "Conflict detected correctly 100% of time"
      - "Automatic merge for compatible changes"
      - "Clear error message for incompatible conflicts"
    
    files:
      implementation: "cortex/core/state/optimistic_lock.py"
      tests: "tests/unit/core/state/test_optimistic_locking.py"

  AC-STATE-002-03:
    title: "Concurrent Hash Chain Integrity"
    description: |
      Ensure audit log hash chain remains valid under concurrent writes
      through atomic append-only operations and verification.
    
    requirements:
      - "Hash chain calculation inside transaction"
      - "Atomic read-modify-write for last hash"
      - "Per-thread hash cache invalidation"
      - "Background integrity verification job"
      - "Automatic repair on chain break detection"
    
    edge_cases:
      - "Concurrent hash chain writes: serialize via database lock"
      - "Hash chain broken: identify break point, rebuild from there"
      - "Out-of-order writes: reject, enforce sequential timestamps"
      - "Thread-local cache stale: force refresh from DB"
    
    validation:
      - "100 concurrent audit writes, hash chain valid"
      - "Background verifier detects and repairs breaks"
      - "No race conditions in hash calculation"
      - "Chain integrity verified end-to-end"
    
    files:
      implementation: "cortex/infrastructure/audit_hash_chain.py"
      tests: "tests/unit/infrastructure/test_concurrent_hash_chain.py"

  AC-STATE-002-04:
    title: "Lock-Free Orchestrator Registry"
    description: |
      Implement thread-safe orchestrator registry using copy-on-write
      and atomic reference swaps to avoid lock contention.
    
    requirements:
      - "Immutable registry snapshots"
      - "Atomic swap on registration"
      - "Read path lock-free (uses current snapshot)"
      - "Write path synchronized (creates new snapshot)"
      - "Generation counter for cache invalidation"
    
    edge_cases:
      - "Concurrent registrations: serialize, all complete"
      - "Reader using old snapshot: gradually migrate to new"
      - "Registration during startup: defer until stable"
      - "Duplicate registration: idempotent, last wins with warning"
    
    validation:
      - "1000 concurrent lookups, zero contention"
      - "100 concurrent registrations complete correctly"
      - "Read performance: <1μs P99"
      - "Write performance: <10ms P99"
    
    files:
      implementation: "cortex/orchestrators/registry/lock_free_registry.py"
      tests: "tests/unit/orchestrators/test_registry_concurrency.py"

  AC-STATE-002-05:
    title: "Concurrent Governance Check Coordination"
    description: |
      Implement distributed coordination for governance checks to prevent
      race conditions in rule evaluation and enforcement.
    
    requirements:
      - "Check-then-act operations atomic via transactions"
      - "Quota enforcement with pessimistic locking"
      - "Authorization cache with TTL and invalidation"
      - "Distributed lock for cross-process coordination"
      - "Grace period for quota refresh (avoid false rejections)"
    
    edge_cases:
      - "Quota check race: pessimistic lock, serialize enforcement"
      - "Authorization cache stale: TTL 60s, force refresh on deny"
      - "Lock timeout: fail safe (allow or deny based on rule)"
      - "Concurrent rule updates: version-based, atomic swap"
    
    validation:
      - "Quota enforcement accurate under concurrent load"
      - "No false positives/negatives in authorization"
      - "Rule updates propagate within 100ms"
      - "Lock contention <5% of requests"
    
    files:
      implementation: "cortex/brain/core/governance/concurrent_evaluator.py"
      tests: "tests/unit/governance/test_concurrent_evaluation.py"

  AC-STATE-002-06:
    title: "Phase State Machine with Atomic Transitions"
    description: |
      Implement phase state as explicit state machine with validated
      atomic transitions and conflict resolution.
    
    requirements:
      - "States: PLANNED → IN_PROGRESS → COMPLETED → LOCKED"
      - "Transitions validated via finite state machine"
      - "Atomic CAS (compare-and-swap) for state changes"
      - "Transition audit log with causality tracking"
      - "Conflict resolution: last valid transition wins"
    
    edge_cases:
      - "Invalid transition (LOCKED → IN_PROGRESS): reject with error"
      - "Concurrent completion: both succeed if coming from same state"
      - "Rollback attempt: requires special privilege, logs warning"
      - "State read during transition: wait for completion (<100ms)"
    
    validation:
      - "All invalid transitions rejected"
      - "Concurrent valid transitions complete without conflict"
      - "State changes audited with causality"
      - "No intermediate states visible to readers"
    
    files:
      implementation: "cortex/core/state/phase_state_machine.py"
      tests: "tests/unit/core/state/test_phase_transitions.py"

implementation_strategy:
  phase_1_transactions:
    duration: "2 days"
    focus: "Transaction manager and ACID guarantees"
    deliverables:
      - "AC-STATE-002-01: Transaction management"
      - "AC-STATE-002-03: Hash chain integrity"
    validation: "ACID compliance test suite passes"
  
  phase_2_locking:
    duration: "2 days"
    focus: "Optimistic locking and conflict resolution"
    deliverables:
      - "AC-STATE-002-02: Optimistic locking"
      - "AC-STATE-002-06: Phase state machine"
    validation: "Concurrent update tests pass"
  
  phase_3_coordination:
    duration: "2 days"
    focus: "Distributed coordination and lock-free structures"
    deliverables:
      - "AC-STATE-002-04: Lock-free registry"
      - "AC-STATE-002-05: Governance coordination"
    validation: "High-concurrency benchmarks pass"
  
  phase_4_validation:
    duration: "2 days"
    focus: "Integration testing and chaos engineering"
    deliverables:
      - "Chaos tests: random delays, failures, concurrent access"
      - "Soak test: 24 hours continuous concurrent load"
      - "Documentation: concurrency patterns, troubleshooting"

testing_strategy:
  unit_tests:
    - "Transaction: commit, rollback, savepoints, deadlock retry"
    - "Optimistic locking: conflict detection, merge strategies"
    - "Hash chain: concurrent writes, integrity verification"
    - "Registry: concurrent registration, lookup contention"
    - "State machine: valid/invalid transitions, atomicity"
  
  concurrency_tests:
    - "100 threads updating same record with optimistic locks"
    - "1000 concurrent hash chain appends"
    - "High-contention registry lookups (10K/sec)"
    - "Quota enforcement under concurrent claims"
    - "Phase transition races from multiple threads"
  
  chaos_tests:
    - "Random transaction rollbacks mid-operation"
    - "Introduce artificial delays in critical sections"
    - "Kill threads mid-transaction, verify cleanup"
    - "Corrupt version numbers, verify detection"

success_criteria:
  correctness:
    - "Zero lost updates over 100K concurrent operations"
    - "Hash chain integrity 100% after concurrent writes"
    - "No deadlocks that don't auto-resolve"
    - "All state transitions logged and auditable"
  
  performance:
    - "Transaction overhead <2ms P95"
    - "Lock contention <5% under normal load"
    - "Registry lookup: <1μs P99 (lock-free)"
    - "Conflict resolution: <10ms P95"
  
  reliability:
    - "Automatic deadlock detection and recovery"
    - "Graceful degradation under high contention"
    - "No silent data corruption ever"
    - "State consistency verified continuously"

monitoring_requirements:
  metrics:
    - "transactions_total (counter: commits, rollbacks)"
    - "transaction_duration_ms (histogram)"
    - "deadlocks_detected (counter)"
    - "optimistic_lock_conflicts (counter)"
    - "hash_chain_verifications (counter: pass, fail)"
    - "lock_contention_ratio (gauge)"
    - "state_transition_attempts (counter: allowed, rejected)"
  
  alerts:
    - "Deadlock rate >10/minute"
    - "Optimistic lock conflict rate >20%"
    - "Hash chain integrity check failed"
    - "Lock contention >10% sustained"
    - "Invalid state transition attempted"
