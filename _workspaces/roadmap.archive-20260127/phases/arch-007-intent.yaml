description: |
  Implement a comprehensive Intent Router that:
  - Parses natural language user inputs into structured intents
  - Classifies intents across multiple dimensions (domain, action, urgency)
  - Routes intents to appropriate handlers with confidence scoring
  - Provides fallback chains for uncertain intents
  - Integrates with existing command/query pipelines
  - Maintains intent execution history and learning loop

acceptance_criteria:
  - "IIntentRouter interface with query_intent() method returning IntentResult"
  - "NLPIntentParser extracts intent, entities, confidence (0-1) from text"
  - "IntentClassifier categorizes into: API, Domain, Workflow, Configuration, Diagnostic"
  - "IntentRouter routes to appropriate handler with >85% accuracy"
  - "Fallback chain for intents with <70% confidence"
  - "Intent history persistence (last 100 intents)"
  - "Integration with ConversationProtocol"
  - "≥15 tests covering parser, classifier, router, fallback, integration"
  - "100% type hints, Google docstrings, no bare except"

