phase:
  id: transform-003
  name: Enhanced Discoverability & Documentation
  priority: 3
  blocking_deployment: false
  created_at: '2026-01-23T18:00:00Z'
  start_date: '2026-03-01'
  target_completion: '2026-03-14'
  total_effort_hours: 32
  
  objective: |
    Make CORTEX capabilities obvious and accessible through auto-generated documentation,
    intelligent component discovery, and comprehensive workflow guides. Eliminates the
    "hidden features" problem where capabilities exist but users don't know about them.
  
  current_state:
    documentation: "Manual, often stale"
    orchestrator_docs: "50% coverage"
    discovery: "Manual registry lookup only"
    examples: "Scattered across files"
    issues:
      - Users don't know which orchestrators exist
      - Capabilities not documented systematically
      - No quick-start guide for common workflows
      - Examples hard to find
      - Documentation lags behind code changes
  
  target_state:
    documentation: "Auto-generated from code"
    orchestrator_docs: "100% coverage"
    discovery: "Intelligent semantic search"
    examples: "Organized by workflow"
    quick_start_coverage: "10 common workflows"
  
  items:
    - id: DISC-001
      title: "Design Capability Annotation System"
      description: |
        Create annotation system for documenting orchestrator capabilities directly in code.
        Annotations become source of truth for auto-generated documentation.
      file: cortex/orchestrators/annotations.py
      implementation:
        - Define @capability decorator for methods
        - Define @workflow decorator for multi-step operations
        - Define @example decorator for usage examples
        - Add capability metadata: domain, operation_type, inputs, outputs
        - Support tags for categorization (test, docs, refactor, etc.)
      acceptance_criteria:
        - Decorators capture all capability metadata
        - Metadata accessible via reflection
        - Type hints integrated with capability definitions
        - Examples embedded directly in code
        - Validation ensures all required metadata present
      estimated_hours: 4
      priority: CRITICAL
      dependencies: []
    
    - id: DISC-002
      title: "Annotate All Orchestrators"
      description: |
        Add capability annotations to all 20 wired orchestrators. Provides structured
        data for documentation generation.
      scope: "All orchestrators in cortex/orchestrators/"
      implementation:
        - Add @capability decorators to all public methods
        - Add @workflow decorators to multi-step operations
        - Add @example decorators with usage examples
        - Document inputs, outputs, and error conditions
        - Add domain tags for categorization
      acceptance_criteria:
        - All 20 orchestrators fully annotated
        - Every public method has @capability
        - Complex workflows have @workflow
        - Examples cover common use cases
        - Validation passes for all annotations
      estimated_hours: 8
      priority: HIGH
      dependencies: [DISC-001]
    
    - id: DISC-003
      title: "Build Documentation Generator"
      description: |
        Create system to auto-generate markdown documentation from capability annotations.
        Ensures documentation is always current with code.
      file: cortex/documentation/generator.py
      implementation:
        - Scan all orchestrators for annotations
        - Extract capability metadata via reflection
        - Generate markdown for each orchestrator
        - Group capabilities by domain and operation type
        - Include type signatures, examples, and error handling
        - Auto-generate table of contents
        - Support multiple output formats (markdown, HTML, JSON)
      acceptance_criteria:
        - Generator produces complete orchestrator documentation
        - Output includes all capability metadata
        - Examples rendered with syntax highlighting
        - Cross-references between orchestrators working
        - Generated docs validate against schema
      estimated_hours: 6
      priority: CRITICAL
      dependencies: [DISC-002]
    
    - id: DISC-004
      title: "Generate Orchestrator Capability Catalog"
      description: |
        Use documentation generator to create comprehensive capability catalog
        covering all orchestrators.
      file: docs/capability-catalog.md
      implementation:
        - Run generator on all orchestrators
        - Organize by domain (core, domain, migration, onboarding, support)
        - Add searchable index
        - Include workflow diagrams where relevant
        - Add performance characteristics (latency, resource usage)
        - Link to source code for each capability
      acceptance_criteria:
        - Catalog covers all 20 orchestrators
        - Organized by domain with clear navigation
        - Searchable index enables quick lookup
        - Performance data documented
        - Source links validate
      estimated_hours: 4
      priority: HIGH
      dependencies: [DISC-003]
    
    - id: DISC-005
      title: "Create Common Workflows Quick-Start Guide"
      description: |
        Document 10 most common workflows with step-by-step examples. Provides
        "get started in 5 minutes" experience.
      file: docs/quickstart-workflows.md
      workflows:
        1. Generate test from requirement
        2. Generate documentation for module
        3. Refactor code with specific pattern
        4. Migrate tests between frameworks
        5. Analyze code for technical debt
        6. Create conversation for complex task
        7. Plan multi-step implementation
        8. Set up new development environment
        9. Discover available tools and capabilities
        10. Roll back failed operation
      implementation:
        - Document each workflow with concrete example
        - Include CLI commands, API calls, and expected outputs
        - Add troubleshooting tips for each workflow
        - Provide timing estimates
        - Link to detailed orchestrator documentation
      acceptance_criteria:
        - All 10 workflows documented
        - Each has working example
        - CLI commands validated
        - Troubleshooting tips comprehensive
        - Timing estimates accurate (validated by benchmarks)
      estimated_hours: 6
      priority: HIGH
      dependencies: [DISC-004]
    
    - id: DISC-006
      title: "Implement Intelligent Component Discovery"
      description: |
        Build semantic search system for discovering orchestrators by describing what
        you want to do (vs knowing orchestrator names).
      file: cortex/discovery/semantic_search.py
      implementation:
        - Index all capability annotations
        - Build keyword index (test, refactor, migrate, etc.)
        - Implement semantic similarity matching
        - Support natural language queries
        - Return ranked results with confidence scores
        - Provide usage examples for top matches
      acceptance_criteria:
        - Query "generate test" returns TDDOrchestrator (confidence > 90)
        - Query "improve code structure" returns RefactoringOrchestrator (confidence > 80)
        - Query "move from selenium to playwright" returns SeleniumPlaywrightOrchestrator
        - Natural language queries work (vs keyword matching only)
        - Results ranked by relevance
      estimated_hours: 5
      priority: MEDIUM
      dependencies: [DISC-002]
    
    - id: DISC-007
      title: "Add Discovery CLI Command"
      description: |
        Expose discovery system through CLI for easy exploration of capabilities.
      file: cortex/cli/discover.py
      implementation:
        - Add 'cortex discover' command
        - Support query: 'cortex discover "what I want to do"'
        - Display results with confidence scores
        - Show usage examples for top matches
        - Offer to run discovered orchestrator
        - Support filters: --domain, --capability, --workflow
      acceptance_criteria:
        - 'cortex discover "generate test"' returns TDDOrchestrator with example
        - 'cortex discover "refactor"' returns RefactoringOrchestrator with patterns
        - Results include confidence scores and usage examples
        - Filters work correctly
        - Can launch orchestrator directly from discovery
      estimated_hours: 3
      priority: MEDIUM
      dependencies: [DISC-006]
    
    - id: DISC-008
      title: "Create Routing Patterns Documentation"
      description: |
        Document how MasterOrchestrator routes intents to orchestrators. Helps users
        understand orchestrator selection and troubleshoot routing issues.
      file: docs/routing-patterns.md
      implementation:
        - Document intent keyword mapping
        - Show confidence scoring algorithm
        - Provide routing decision flowchart
        - Include examples of simple and complex routing
        - Document fallback strategies
        - Add troubleshooting guide for common routing issues
      acceptance_criteria:
        - All intent keywords documented
        - Confidence scoring explained clearly
        - Flowchart visualizes decision tree
        - Examples cover edge cases
        - Troubleshooting guide addresses common issues
      estimated_hours: 3
      priority: MEDIUM
      dependencies: [DISC-004]
    
    - id: DISC-009
      title: "Generate API Reference Documentation"
      description: |
        Auto-generate complete API reference for all public orchestrator APIs.
      file: docs/api-reference.md
      implementation:
        - Extract all public methods from orchestrators
        - Generate API documentation with type signatures
        - Include docstrings and parameter descriptions
        - Add usage examples for each method
        - Document return types and exceptions
        - Cross-link related methods
      acceptance_criteria:
        - All public APIs documented
        - Type signatures accurate
        - Examples validate
        - Exception handling documented
        - Cross-links functional
      estimated_hours: 4
      priority: MEDIUM
      dependencies: [DISC-003]
    
    - id: DISC-010
      title: "Create Interactive Examples Repository"
      description: |
        Build repository of runnable examples demonstrating all major capabilities.
      directory: examples/
      implementation:
        - Create examples/ directory structure
        - Add runnable example for each workflow
        - Include sample inputs and expected outputs
        - Add README for each example
        - Ensure examples are self-contained and executable
        - Link examples from documentation
      acceptance_criteria:
        - 10+ runnable examples available
        - Each example has clear README
        - Examples execute successfully
        - Linked from quick-start guide
        - Cover all major workflows
      estimated_hours: 5
      priority: LOW
      dependencies: [DISC-005]
    
    - id: DISC-011
      title: "Integrate Documentation into CI/CD"
      description: |
        Auto-generate documentation on every commit to ensure it stays current.
      file: .github/workflows/docs-generation.yml
      implementation:
        - Add GitHub Action to generate docs
        - Run generator on every push to main
        - Validate generated docs
        - Commit updated docs automatically
        - Fail CI if annotations invalid
        - Deploy docs to GitHub Pages
      acceptance_criteria:
        - Docs auto-generate on every commit
        - Invalid annotations fail CI
        - Generated docs committed to repo
        - Docs deployed to GitHub Pages
        - Build times acceptable (< 2 minutes)
      estimated_hours: 3
      priority: MEDIUM
      dependencies: [DISC-003]
    
    - id: DISC-012
      title: "Create Video Tutorials for Key Workflows"
      description: |
        Record short video tutorials demonstrating 5 most common workflows.
      implementation:
        - Record screen capture for each workflow
        - Add voice narration explaining steps
        - Edit to 2-5 minute length per video
        - Upload to documentation site
        - Add transcripts for accessibility
        - Embed in quick-start guide
      acceptance_criteria:
        - 5 videos covering top workflows
        - Professional quality (clear audio/video)
        - Under 5 minutes each
        - Transcripts available
        - Embedded in documentation
      estimated_hours: 8
      priority: LOW
      dependencies: [DISC-005]
    
    - id: DISC-013
      title: "Validation and User Testing"
      description: |
        Test documentation with new users to validate clarity and completeness.
      implementation:
        - Recruit 5 new users (no CORTEX experience)
        - Have them complete 3 common workflows using only documentation
        - Record time to completion and issues encountered
        - Collect feedback on clarity and completeness
        - Iterate on documentation based on feedback
        - Measure success rate
      acceptance_criteria:
        - ≥ 80% success rate on workflow completion
        - Average time to first success < 30 minutes
        - User satisfaction ≥ 4/5
        - All critical feedback addressed
        - Documentation iterated based on testing
      estimated_hours: 6
      priority: MEDIUM
      dependencies: [DISC-005, DISC-011]
  
  completion_checklist:
    - '[ ] DISC-001: Capability annotation system designed'
    - '[ ] DISC-002: All orchestrators annotated'
    - '[ ] DISC-003: Documentation generator built'
    - '[ ] DISC-004: Capability catalog generated'
    - '[ ] DISC-005: Quick-start guide for 10 workflows'
    - '[ ] DISC-006: Semantic discovery implemented'
    - '[ ] DISC-007: Discovery CLI command added'
    - '[ ] DISC-008: Routing patterns documented'
    - '[ ] DISC-009: API reference generated'
    - '[ ] DISC-010: Example repository created'
    - '[ ] DISC-011: Docs integrated into CI/CD'
    - '[ ] DISC-012: Video tutorials recorded'
    - '[ ] DISC-013: User testing completed'
    - '[ ] Documentation coverage ≥ 90%'
    - '[ ] All tests passing'
  
  success_metrics:
    documentation_coverage: "≥ 90% (all orchestrators documented)"
    discovery_success_rate: "≥ 85% (users find what they need)"
    time_to_first_success: "< 30 minutes (new users)"
    workflow_guide_coverage: "10 common workflows"
    example_count: "≥ 10 runnable examples"
    user_satisfaction: "≥ 4/5"
  
  risk_mitigation:
    - risk: "Documentation becomes stale"
      mitigation: "Auto-generation in CI/CD ensures always current"
    - risk: "Annotations burden on developers"
      mitigation: "Make annotations part of PR requirements, provide templates"
    - risk: "Discovery returns irrelevant results"
      mitigation: "Continuous tuning based on usage metrics"
