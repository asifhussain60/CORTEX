# ============================================================================
# PHASE 7.1: LENS PROTOCOL FORMALIZATION
# ============================================================================
phase_7_1:
  name: "LENS Protocol Formal Integration"
  duration: "4-6 hours"
  priority: "P0 - CRITICAL"
  
  description: |
    Formalize LENS (Language→Examination→Navigation→Synthesis) as the 
    Implementation Truth engine. The analyzers exist (GitHistoryAnalyzer, 
    ASTAnalyzer, CommentExtractor) but are not formally tracked or wired 
    into the orchestration layer.
    
    This phase creates tracking, wiring, and documentation to ensure LENS
    becomes the foundation for CORE-030 (Implementation Truth) enforcement.

  rationale:
    extensibility: "★★★★★ - Code intelligence extensible to any language"
    scalability: "★★★★☆ - AST/Git analysis scales to massive codebases"
    accuracy: "★★★★★ - CORE-030 depends on LENS validation"
    efficiency: "★★★★☆ - Reduces manual code inspection by 80%+"

  evidence:
    existing_implementations:
      - path: "cortex/brain/analysis/git_history_analyzer.py"
        lines: 552
        tests: 15
        status: "IMPLEMENTED"
      - path: "cortex/brain/analysis/ast_analyzer.py"
        lines: 348
        tests: 19
        status: "IMPLEMENTED"
      - path: "cortex/brain/analysis/comment_extractor.py"
        lines: 238
        tests: 19
        status: "IMPLEMENTED"
    
    documentation:
      - "_workspaces/docker-plan/LENS-ENHANCEMENT-IMPLEMENTATION-COMPLETE.md"
    
    git_commits:
      - "bda8298c4 - feat: Implement Week 1 + Week 2-4 LENS enhancements"
      - "45817a780 - docs: Add LENS enhancement implementation completion report"

  tasks:
    - id: "LENS-001"
      name: "Document LENS Implementation Status"
      description: "Create completion report documenting LENS analyzers as production-ready"
      status: "✅ COMPLETE"
      completed_date: "2026-01-27"
      actual_time: "30 minutes"
      deliverables:
        - "PHASE-7.1-LENS-COMPLETION-REPORT.md documenting:"
        - "  - GitHistoryAnalyzer (555 lines, 15 tests passing)"
        - "  - ASTAnalyzer (338 lines, 19 tests passing)"
        - "  - CommentExtractor (254 lines, 19 tests passing)"
        - "  - Implementation Truth foundation for CORE-030"
      estimated_time: "30 minutes"
      
    - id: "LENS-002"
      name: "Wire LENS to IntentRouter Stage 2"
      description: "Connect LENS analyzers to intent classification pipeline"
      implementation:
        file: "cortex/orchestrators/core/intent_router.py"
        changes:
          - "Add LENS context injection"
          - "Enable code analysis before intent classification"
          - "Provide AST/Git/Comment data to confidence scoring"
      estimated_time: "2 hours"
      
    - id: "LENS-003"
      name: "Create LENS Orchestrator Wrapper"
      description: "Create orchestrator that coordinates all three analyzers"
      implementation:
        file: "cortex/orchestrators/support/lens_orchestrator.py"
        capabilities:
          - "Unified code intelligence API"
          - "Caching for repeated analysis"
          - "Batch file analysis"
      estimated_time: "2 hours"
      tests_required: 20
      
    - id: "LENS-004"
      name: "Update CORTEX.prompt.md with LENS status"
      description: "Document LENS as Implementation Truth foundation"
      changes:
        - "Add LENS to Stage 2 description"
        - "Reference analyzer implementations"
        - "Add LENS commands (/lens analyze, /lens history)"
      estimated_time: "1 hour"

  validation:
    tests_required: 53  # Existing 53 + 20 new = 73 total
    acceptance_criteria:
      - "All LENS analyzers accessible via LENSOrchestrator"
      - "IntentRouter uses LENS context for classification"
      - "PHASE-7.1-LENS-COMPLETION-REPORT.md documents implementation status"
      - "CORTEX.prompt.md references LENS implementation"

  gate:
    name: "LENS Integration Gate"
    condition: "73+ tests passing, LENS wired to Stage 2"
    on_failure: "Defer to Phase 7.1.1 for incremental fixes"

# ============================================================================
# PHASE 7.2: OBSERVABILITY DOCUMENTATION
# ============================================================================
phase_7_2:
  name: "MCP Observability Documentation & Tracking"
  duration: "2-3 hours"
  priority: "P1 - HIGH"
  
  description: |
    Phase 5 implemented health endpoints, Prometheus metrics, and tool 
    discovery. However, this isn't tracked in cortex-impl-map.yaml and
    the prompts don't reference the observability capabilities.
    
    This phase documents and tracks the observability layer for production
    monitoring visibility.

  rationale:
    extensibility: "★★★★★ - Enables external monitoring integrations"
    scalability: "★★★★★ - Prometheus = cloud-native standard"
    accuracy: "★★★★☆ - Metrics prevent silent failures"
    efficiency: "★★★★☆ - Tool discovery reduces lookup time"

  evidence:
    existing_implementations:
      - path: "cortex/mcp/health_checker.py"
        status: "IMPLEMENTED"
        endpoints: ["/health", "/health/wiring", "/health/orchestrators"]
      - path: "cortex/mcp/metrics_collector.py"
        status: "IMPLEMENTED"
        endpoints: ["/metrics"]
      - path: "cortex/mcp/startup_banner.py"
        status: "IMPLEMENTED"
      - path: "cortex/mcp/wiring_watcher.py"
        status: "IMPLEMENTED"
    
    git_commits:
      - "a8291b62f - feat(phase5): Complete Task 1 - Health Endpoints"
      - "9bac2ada3 - feat(phase5): Complete Task 2 - Prometheus Metrics"
      - "ac4456dac - feat(phase5): Complete Task 3 - Tool Discovery"

  tasks:
    - id: "OBS-001"
      name: "Create Phase 5 Completion Report"
      description: "Document PHASE-5-MCP-ENHANCEMENT as COMPLETED"
      deliverables:
        - "PHASE-7.2-OBSERVABILITY-COMPLETION-REPORT.md documenting:"
        - "  - MCP-001: Health endpoints (/health, /health/wiring, /health/orchestrators)"
        - "  - MCP-002: Prometheus metrics (/metrics)"
        - "  - MCP-003: Tool discovery (cortex/mcp/tool_discovery.py)"
        - "  - MCP-004: Startup banner (cortex/mcp/startup_banner.py)"
        - "  - MCP-005: Hot-reload watcher (cortex/mcp/wiring_watcher.py)"
      estimated_time: "30 minutes"
      
    - id: "OBS-002"
      name: "Create Observability Runbook"
      description: "Document how to monitor CORTEX in production"
      deliverables:
        file: "_workspaces/docker-plan/observability-runbook.md"
        contents:
          - "Health endpoint usage"
          - "Prometheus scrape configuration"
          - "Grafana dashboard templates"
          - "Alert thresholds"
          - "Troubleshooting guide"
      estimated_time: "1 hour"
      
    - id: "OBS-003"
      name: "Update CORTEX.prompt.md MCP section"
      description: "Add observability endpoints to MCP tools list"
      changes:
        - "Add /health, /metrics to tool categories"
        - "Reference Prometheus integration"
        - "Document startup banner configuration"
      estimated_time: "30 minutes"
      
    - id: "OBS-004"
      name: "Create Prometheus docker-compose overlay"
      description: "Production-ready monitoring stack"
      deliverables:
        file: "docker-compose.monitoring.yml"
        services:
          - "prometheus (metrics collection)"
          - "grafana (visualization)"
          - "alertmanager (optional)"
      estimated_time: "1 hour"

  validation:
    tests_required: 0  # Documentation phase
    acceptance_criteria:
      - "PHASE-7.2-OBSERVABILITY-COMPLETION-REPORT.md created"
      - "Observability runbook created"
      - "Prometheus config available"
      - "CORTEX.prompt.md updated"

  gate:
    name: "Observability Documentation Gate"
    condition: "All documentation created, no code changes required"

# ============================================================================
# PHASE 7.3: CONSOLIDATION TRACKING SYNC
# ============================================================================
phase_7_3:
  name: "TRANSFORM-002 Consolidation Status Sync"
  duration: "1-2 hours"
  priority: "P2 - MEDIUM"
  
  description: |
    TRANSFORM-002 (consolidation roadmap) shows 54.5% progress, but git 
    history shows multiple CONS-00X phases as COMPLETE. This creates
    knowledge debt where future contributors won't know actual status.
    
    This phase audits and syncs tracking to actual completion state.

  rationale:
    extensibility: "★★★☆☆ - Prevents drift, doesn't enable features"
    scalability: "★★★☆☆ - Clean architecture scales better"
    accuracy: "★★★★☆ - Accurate tracking prevents duplicate work"
    efficiency: "★★★★☆ - Reduces cognitive overhead"

  evidence:
    git_commits:
      - "5a9480928 - AC-CONS-002-COMPLETE: Master Orchestrator consolidation"
      - "e39a262e4 - AC-CONS-003-TESTS: UnifiedIntentRouter test suite"
      - "82d25e5ab - AC-CONS-005-MODULE: Domain classification unified"
      - "44d250e69 - AC-CONS-006-COMPLETE: Response formatting consolidation"
      - "37b98f6d1 - AC-CONS-007-FINAL: Onboarding consolidation COMPLETE"
      - "4bdc44c95 - AC-CONS-008-COMPLETE: Response composition (83% savings)"
    
    current_tracking:
      location: "_workspaces/roadmap/transform-002-consolidation.yaml"
      stated_progress: "54.5%"
      actual_progress: "~80% based on git commits"

  tasks:
    - id: "CONS-SYNC-001"
      name: "Audit CONS-002 through CONS-008 status"
      description: "Cross-reference git commits with tracking"
      deliverables:
        - "Create PHASE-7.3-CONSOLIDATION-AUDIT-REPORT.md"
        - "Status matrix: Tracking vs Actual"
        - "List of incorrectly marked items"
      estimated_time: "30 minutes"
      
    - id: "CONS-SYNC-002"
      name: "Update transform-002-consolidation.yaml"
      description: "Sync progress to actual completion state"
      changes:
        - "Mark CONS-002 through CONS-008 as COMPLETED"
        - "Update progress from 54.5% to actual (~80%)"
        - "Document remaining items (if any)"
      estimated_time: "30 minutes"

  validation:
    tests_required: 0  # Audit phase
    acceptance_criteria:
      - "PHASE-7.3-CONSOLIDATION-AUDIT-REPORT.md created"
      - "CONS-002 through CONS-008 status matches git commits"
      - "transform-002 progress reflects reality (~80%)"
      - "No conflicting status claims"

  gate:
    name: "Consolidation Sync Gate"
    condition: "Tracking matches git history evidence"

# ============================================================================
# PHASE 7.4: FILE NAMING ENFORCEMENT AUTOMATION
# ============================================================================
phase_7_4:
  name: "CORE-028 File Naming Enforcement Automation"
  duration: "3-4 hours"
  priority: "P2 - MEDIUM"
  
  description: |
    CORE-028 requires kebab-case naming with 25-char limit, but enforcement
    is incomplete. Legacy files with underscores still exist (e.g., 
    git_history_analyzer.py). This phase automates detection and provides
    migration tooling.

  rationale:
    extensibility: "★★★☆☆ - Consistent naming enables tooling integration"
    scalability: "★★★★☆ - Automated enforcement scales to 1000+ files"
    accuracy: "★★★★☆ - Prevents naming conflicts, import errors"
    efficiency: "★★★☆☆ - One-time migration investment"

  evidence:
    current_violations:
      - "cortex/brain/analysis/git_history_analyzer.py (underscore)"
      - "cortex/orchestrators/core/database_registry.py (deleted but pattern)"
      - "tests/unit/brain/analysis/test_git_history_analyzer.py (underscore)"
    
    policy_documentation:
      - "_workspaces/docker-plan/CORE-038-FILE-PLACEMENT-POLICY.md"
      - "cortex_brain/tier0/governance/core-rules.yaml (CORE-028)"
    
    existing_scripts:
      - "_workspaces/docker-plan/refactor-file-names.sh"

  tasks:
    - id: "NAMING-001"
      name: "Create naming violation detector"
      description: "Script to scan codebase for CORE-028 violations"
      deliverables:
        file: "cortex/tools/naming_violation_detector.py"
        capabilities:
          - "Scan all .py files"
          - "Check kebab-case compliance"
          - "Check 25-char limit"
          - "Report violations with fix suggestions"
      estimated_time: "1 hour"
      tests_required: 10
      
    - id: "NAMING-002"
      name: "Enhance pre-commit hook"
      description: "Add naming check to .git/hooks/pre-commit"
      changes:
        - "Check new files for CORE-028 compliance"
        - "Block commits with underscore naming"
        - "Provide rename suggestions"
      estimated_time: "1 hour"
      
    - id: "NAMING-003"
      name: "Create migration inventory"
      description: "List all files requiring rename with priority"
      deliverables:
        file: "_workspaces/docker-plan/naming-migration-inventory.yaml"
        contents:
          - "File path → suggested new name mapping"
          - "Priority (P0/P1/P2)"
          - "Import dependencies affected"
      estimated_time: "30 minutes"
      
    - id: "NAMING-004"
      name: "Create safe rename script"
      description: "Automated rename with import update"
      deliverables:
        file: "cortex/tools/safe_file_rename.py"
        capabilities:
          - "Rename file"
          - "Update all imports across codebase"
          - "Update test file names"
          - "Create git commit"
      estimated_time: "1.5 hours"
      tests_required: 8

  validation:
    tests_required: 18
    acceptance_criteria:
      - "Naming violation detector identifies all underscore files"
      - "Pre-commit hook blocks new violations"
      - "Migration inventory complete"
      - "Safe rename script tested"

  gate:
    name: "Naming Enforcement Gate"
    condition: "Tools created, legacy files inventoried"
    note: "Actual migration can be deferred to separate phase"

