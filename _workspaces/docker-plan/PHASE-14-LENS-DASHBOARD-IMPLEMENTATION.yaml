# ==============================================================================
# NEW D3.JS VISUALIZATIONS
# ==============================================================================

new_d3_visualizations:
  call_graph_visualization:
    name: "Function Call Graph"
    description: "Interactive network showing function call relationships"
    data_structure:
      nodes:
        - "id: function_name"
        - "label: function_signature"
        - "module: module_path"
        - "complexity: cyclomatic_complexity"
        - "size: lines_of_code"
      edges:
        - "source: caller_function"
        - "target: callee_function"
        - "weight: call_frequency"
    
    interactions:
      - "Click: Show function source code"
      - "Hover: Show call chain"
      - "Right-click: Show callers/callees"
    
    layout: "force-directed with clustering by module"
  
  import_dependency_graph:
    name: "Module Import Graph"
    description: "Visualize import dependencies between modules"
    data_structure:
      nodes:
        - "id: module_path"
        - "label: module_name"
        - "type: internal|external"
        - "size: module_complexity"
      edges:
        - "source: importer_module"
        - "target: imported_module"
        - "type: direct|indirect"
    
    layout: "hierarchical tree with external dependencies at top"
  
  change_frequency_heatmap:
    name: "Code Change Heatmap"
    description: "Show which files/functions change most frequently"
    data_structure:
      - "file_path: string"
      - "function_name: string"
      - "commit_count: integer"
      - "unique_authors: integer"
      - "last_modified: datetime"
    
    visualization: "treemap with color intensity = change frequency"
  
  author_contribution_network:
    name: "Developer Collaboration Network"
    description: "Show which developers work on which parts of codebase"
    data_structure:
      nodes:
        - "id: author_name"
        - "commits: integer"
        - "expertise_areas: list[string]"
      edges:
        - "source: author_1"
        - "target: author_2"
        - "shared_files: integer"
    
    layout: "force-directed with node size = commit count"
  
  complexity_scatter_plot:
    name: "Complexity vs Size Analysis"
    description: "Identify complex functions that may need refactoring"
    axes:
      x: "Lines of Code"
      y: "Cyclomatic Complexity"
    
    data_points:
      - "function_name"
      - "loc: integer"
      - "complexity: integer"
      - "module: string"
    
    thresholds:
      - "High complexity, high LOC → Red (refactor candidate)"
      - "High complexity, low LOC → Yellow (review logic)"
      - "Low complexity → Green (healthy)"

# ==============================================================================
# NEW MERMAID DIAGRAMS
# ==============================================================================

new_mermaid_diagrams:
  entity_relationship_diagram:
    name: "Database ERD"
    description: "Auto-generate ERD from SQLAlchemy/Django models"
    detection:
      - "SQLAlchemy: classes inheriting Base with __tablename__"
      - "Django: classes inheriting models.Model"
      - "Relationships: ForeignKey, ManyToMany"
    
    mermaid_syntax: |
      erDiagram
          USER ||--o{ ORDER : places
          USER {
              int id PK
              string name
              string email
          }
          ORDER {
              int id PK
              int user_id FK
              datetime created_at
          }
  
  state_machine_diagram:
    name: "Workflow State Machines"
    description: "Detect state transitions in workflow code"
    detection:
      - "Enum classes with state values"
      - "State transition functions (state_machine pattern)"
      - "Status field updates in code"
    
    mermaid_syntax: |
      stateDiagram-v2
          [*] --> Draft
          Draft --> Review: submit()
          Review --> Approved: approve()
          Review --> Rejected: reject()
          Approved --> [*]
  
  sequence_diagram:
    name: "API Interaction Sequences"
    description: "Generate sequence diagrams from API routes"
    detection:
      - "FastAPI routes (@app.get, @app.post)"
      - "Function calls within route handlers"
      - "Database queries and external API calls"
    
    mermaid_syntax: |
      sequenceDiagram
          Client->>+API: POST /users
          API->>+Database: INSERT user
          Database-->>-API: user_id
          API->>+EmailService: send_welcome_email()
          EmailService-->>-API: success
          API-->>-Client: 201 Created
  
  architecture_diagram:
    name: "System Architecture"
    description: "High-level component architecture"
    detection:
      - "Top-level packages/directories"
      - "Inter-package dependencies"
      - "External service integrations"
    
    mermaid_syntax: |
      graph TB
          A[Frontend React] -->|REST API| B[FastAPI Backend]
          B -->|SQLAlchemy| C[(PostgreSQL)]
          B -->|Redis| D[Cache Layer]
          B -->|gRPC| E[Orchestrator Service]

# ==============================================================================
# IMPLEMENTATION TASKS
# ==============================================================================

tasks:
  # ============================================================================
  # PHASE 1: Core Infrastructure (Days 1-4)
  # ============================================================================
  
  task_001_visualization_package_structure:
    ac_id: "LENS-DASH-001"
    priority: "P0"
    effort: "0.5 days"
    description: "Create cortex/visualization/ package structure"
    
    deliverables:
      - "cortex/visualization/__init__.py"
      - "cortex/visualization/renderers/__init__.py"
      - "cortex/visualization/formatters/__init__.py"
      - "cortex/visualization/templates/"
      - "cortex/visualization/static/css/"
      - "cortex/visualization/static/js/"
    
    acceptance_criteria:
      - "Package structure follows CORE-038 (all files in subfolders)"
      - "Empty __init__.py files with docstrings"
      - "README.md in visualization/ explaining purpose"
  
  task_002a_repository_detector:
    ac_id: "LENS-DASH-001"
    priority: "P0"
    effort: "0.5 days"
    description: "Implement repository type detection (CORTEX vs external)"
    
    implementation:
      file: "cortex/visualization/repository_detector.py"
      class: "RepositoryDetector"
      methods:
        - "is_cortex_repository(repo_path: Path) -> bool"
        - "detect_cortex_features(repo_path: Path) -> CortexFeatures"
        - "get_cortex_markers() -> List[Path]"
    
    detection_logic:
      markers:
        - "cortex_brain/ directory exists"
        - "cortex/orchestrators/ directory exists"
        - ".github/prompts/CORTEX.prompt.md exists"
        - "cortex/wiring/specifications/wiring.yaml exists"
      
      result:
        - "Return True if ANY marker exists"
        - "Return CortexFeatures dataclass with feature flags"
    
    test_file: "tests/visualization/test_repository_detector.py"
    
    test_cases:
      - "Detect CORTEX repository (all markers present)"
      - "Detect CORTEX repository (partial markers)"
      - "Detect external repository (no markers)"
      - "Detect Flask project (external)"
      - "Detect Django project (external)"
    
    acceptance_criteria:
      - "Accurately detects CORTEX repository"
      - "Returns False for external repositories"
      - "100% test coverage"
      - "CORE-011 (type hints), CORE-012 (docstrings)"
  
  task_002b_dashboard_configuration:
    ac_id: "LENS-DASH-001"
    priority: "P0"
    effort: "0.5 days"
    description: "Implement context-aware dashboard configuration"
    
    implementation:
      file: "cortex/visualization/dashboard_configuration.py"
      class: "DashboardConfiguration"
      methods:
        - "get_tabs_for_repo(repo_path: Path) -> List[DashboardTab]"
        - "get_universal_tabs() -> List[DashboardTab]"
        - "get_cortex_tabs() -> List[DashboardTab]"
        - "is_tab_applicable(tab_name: str, repo_path: Path) -> bool"
    
    dataclass:
      name: "DashboardTab"
      fields:
        - "id: str"
        - "name: str"
        - "template: str"
        - "is_universal: bool"
        - "requires_cortex: bool"
    
    test_file: "tests/visualization/test_dashboard_configuration.py"
    
    test_cases:
      - "Get 5 tabs for external repository"
      - "Get 8 tabs for CORTEX repository"
      - "Verify tab ordering (universal first, then CORTEX-specific)"
      - "Tab applicability check"
    
    acceptance_criteria:
      - "Returns 5 tabs for external repos"
      - "Returns 8 tabs for CORTEX repo"
      - "Tab order consistent"
      - "100% test coverage"
  
  task_002c_output_manager:
    ac_id: "LENS-DASH-001"
