  # ============================================================================
  # ENHANCEMENT 9: Layered Architecture Compliance Checker
  # ============================================================================
  enhancement_009_layered_architecture:
    id: "LENS-ENH-009"
    name: "Layered Architecture Compliance Checker"
    priority: "P0"
    effort: "1.5 days"
    
    description: |
      Detect and validate N-tier/layered architecture compliance. Identifies
      layer violations (e.g., UI layer directly accessing database layer)
      and calculates architecture fitness score.
    
    layer_detection:
      strategies:
        - name: "Solution folder numbers"
          pattern: "1 {Layer}, 2 {Layer}, ..."
          example: "1 Presentation, 2 Application, 3 Domain, 4 Infrastructure"
        
        - name: "Namespace conventions"
          pattern: "{Root}.{Layer}.{Module}"
          example: "Company.Application.Services"
        
        - name: "Directory structure"
          pattern: "src/{layer}/"
          example: "src/presentation/, src/domain/"
        
        - name: "Project suffixes"
          pattern: "*.{Layer}.csproj"
          example: "MyApp.Domain.csproj, MyApp.Infrastructure.csproj"
    
    common_layer_patterns:
      three_tier:
        - "Presentation / UI / Web"
        - "Business / Application / Services"
        - "Data / Persistence / Infrastructure"
      
      clean_architecture:
        - "Presentation / API / UI"
        - "Application (Use Cases)"
        - "Domain (Entities, Value Objects)"
        - "Infrastructure (External Concerns)"
      
      hexagonal:
        - "Adapters (Primary / Secondary)"
        - "Application (Ports)"
        - "Domain (Core)"
    
    violation_detection:
      - "Upward dependency (lower layer references higher)"
      - "Layer skip (UI references Database directly)"
      - "Circular dependency between layers"
      - "Cross-cutting concern in wrong layer"
    
    visualization:
      layer_diagram:
        type: "Mermaid graph TD"
        features:
          - "Layers as horizontal bands"
          - "Allowed dependencies (solid arrows)"
          - "Violations (red dashed arrows)"
          - "Compliance score per layer"
      
      violation_list:
        type: "Table"
        columns:
          - "Source (File:Line)"
          - "Target (Referenced Layer)"
          - "Violation Type"
          - "Severity"
    
    implementation:
      file: "cortex/visualization/analyzers/architecture_analyzer.py"
      class: "LayeredArchitectureAnalyzer"

