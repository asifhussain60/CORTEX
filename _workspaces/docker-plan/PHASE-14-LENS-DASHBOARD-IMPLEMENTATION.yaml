    implementation:
      file: "cortex/visualization/analyzers/job_analyzer.py"
      class: "BackgroundJobAnalyzer"

  # ============================================================================
  # ENHANCEMENT 7: Database Schema Explorer
  # ============================================================================
  enhancement_007_database_explorer:
    id: "LENS-ENH-007"
    name: "Database Schema Explorer"
    priority: "P0"
    effort: "3 days"
    
    description: |
      Reverse-engineer database schemas from code. Parses Entity Framework
      models, SQLAlchemy models, Hibernate entities, and raw SQL migrations.
      Generates ER diagrams and tracks schema evolution.
    
    detection_patterns:
      entity_framework:
        - "DbContext.cs"              # EF context files
        - "*DbContext.cs"             # Named contexts
        - "OnModelCreating"           # Fluent API configuration
        - "[Table()]"                 # Data annotations
      
      ef_core:
        - "Migrations/*.cs"           # EF Core migrations
        - "ModelSnapshot.cs"          # Model snapshots
      
      sqlalchemy:
        - "models.py"                 # SQLAlchemy models
        - "Base = declarative_base()" # Base class detection
        - "alembic/versions/*.py"     # Alembic migrations
      
      hibernate:
        - "@Entity"                   # JPA entities
        - "*.hbm.xml"                 # Hibernate mappings
        - "flyway/migrations/*.sql"   # Flyway migrations
        - "liquibase/*.xml"           # Liquibase changelogs
      
      raw_sql:
        - "*.sql"                     # Raw SQL files
        - "schema/*.sql"              # Schema definitions
        - "migrations/*.sql"          # Migration scripts
    
    analysis_features:
      - "Extract table/entity definitions"
      - "Detect primary keys and foreign keys"
      - "Map relationships (one-to-many, many-to-many)"
      - "Track schema changes over git history"
      - "Detect database per service patterns"
    
    visualization:
      er_diagram:
        type: "Mermaid ER diagram"
        features:
          - "Tables with columns and types"
          - "Relationship lines (PK-FK)"
          - "Cardinality notation"
          - "Color-coding by schema/context"
      
      migration_timeline:
        type: "D3.js timeline"
        features:
          - "Migration history with commit links"
          - "Breaking change indicators"
          - "Author attribution"
    
    implementation:
      file: "cortex/visualization/analyzers/database_analyzer.py"
      class: "DatabaseSchemaAnalyzer"

