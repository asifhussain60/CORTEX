  # ============================================================================
  # ENHANCEMENT 5: Bounded Context / DDD Architecture Map
  # ============================================================================
  enhancement_005_bounded_context_map:
    id: "LENS-ENH-005"
    name: "Bounded Context / DDD Architecture Map"
    priority: "P0"
    effort: "2 days"
    
    description: |
      Automatically detect and visualize Domain-Driven Design (DDD) patterns
      including bounded contexts, aggregates, and context relationships.
      Parses solution folder structures and namespace conventions.
    
    detection_strategies:
      solution_folder_analysis:
        description: "Parse .sln file for solution folder hierarchy"
        patterns:
          - "Bounded Contexts/*"
          - "*Contexts/*"
          - "Domains/*"
          - "Modules/*"
      
      namespace_analysis:
        description: "Extract namespaces from source files"
        patterns:
          - "{Company}.{Domain}.{Subdomain}"
          - "{Product}.{Context}.{Layer}"
      
      directory_structure:
        description: "Analyze folder naming conventions"
        patterns:
          - "src/{context}/"
          - "domains/{context}/"
          - "modules/{context}/"
      
      project_naming:
        description: "Infer context from project names"
        patterns:
          - "{Context}.Endpoint"
          - "{Context}.Domain"
          - "{Context}.Infrastructure"
          - "{Context}.Application"
    
    context_relationship_detection:
      - "Shared kernel (common libraries used by multiple contexts)"
      - "Customer-supplier (one context depends on another)"
      - "Conformist (follows another context's model)"
      - "Anti-corruption layer (adapter between contexts)"
      - "Open host service (published API)"
    
    visualization:
      type: "Mermaid context map"
      elements:
        - "Context boxes with layer breakdown"
        - "Relationship arrows with type labels"
        - "Shared kernel indicators"
        - "Team ownership badges (if detectable)"
    
    output_sections:
      - name: "Strategic Context Map"
        content_type: "mermaid_diagram"
        description: "High-level DDD context relationships"
      
      - name: "Context Detail Cards"
        content_type: "expandable_cards"
        description: "Per-context project listing and metrics"
      
      - name: "Context Coupling Score"
        content_type: "heatmap"
        description: "Cross-context dependency density"
    
    implementation:
      file: "cortex/visualization/analyzers/ddd_analyzer.py"
      class: "BoundedContextAnalyzer"

  # ============================================================================
  # ENHANCEMENT 6: Background Job / Worker Discovery
  # ============================================================================
  enhancement_006_job_discovery:
    id: "LENS-ENH-006"
    name: "Background Job / Worker Discovery"
    priority: "P1"
    effort: "1 day"
    
    description: |
      Discover and catalog all background jobs, service workers, scheduled
      tasks, and async processors. Detects multiple hosting patterns.
    
    detection_patterns:
      dotnet:
        - "*ServiceJob*"              # NServiceBus/generic service jobs
        - "*Worker*"                  # .NET Worker Service
        - "*Jobs*"                    # Job projects
        - "*.HostedService*"          # IHostedService implementations
        - "Hangfire*"                 # Hangfire jobs
        - "Quartz*"                   # Quartz.NET schedulers
      
      java:
        - "@Scheduled"                # Spring scheduled tasks
        - "*Job.java"                 # Quartz jobs
        - "*Processor.java"           # Message processors
        - "@KafkaListener"            # Kafka consumers
      
      python:
        - "celery*"                   # Celery tasks
        - "*_task.py"                 # Task modules
        - "apscheduler*"              # APScheduler jobs
        - "rq*"                       # Redis Queue workers
      
      javascript:
        - "*worker.ts"                # Worker scripts
        - "bull*"                     # Bull queue jobs
        - "agenda*"                   # Agenda jobs
    
    job_metadata_extraction:
      - "Job name and description (from class name / attributes)"
      - "Schedule (CRON expression if available)"
      - "Dependencies (message bus, database, external services)"
      - "Hosting model (self-hosted, NServiceBus host, container)"
      - "Test coverage (corresponding test project exists?)"
    
    visualization:
      type: "Table with expandable rows"
      columns:
        - "Job Name"
        - "Type (ServiceJob, Worker, Scheduled)"
        - "Trigger (CRON, Message, Manual)"
        - "Dependencies"
        - "Test Coverage Badge"
      
      timeline_view:
        description: "CRON schedule visualization"
        features:
          - "24-hour timeline showing when jobs run"
