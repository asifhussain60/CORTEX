# ==============================================================================
# PHASE 14.2: ADVANCED CONFIGURATION INTELLIGENCE
# ==============================================================================
# These enhancements extend the dashboard with deep configuration analysis
# capabilities for enterprise monolith codebases. All patterns are generic
# and applicable to .NET, Java, Python, and multi-language repositories.
# ==============================================================================

phase_14_2_configuration_intelligence:
  metadata:
    name: "Configuration Intelligence Enhancements"
    priority: "P0-P1"
    total_effort: "12-15 days"
    dependencies: ["Phase 14 Core Tasks (001-020)"]
    applicable_to: "Enterprise monoliths, microservices, multi-module repositories"
  
  # ============================================================================
  # ENHANCEMENT 1: Multi-Solution Architecture Analyzer
  # ============================================================================
  enhancement_001_multi_solution_analyzer:
    id: "LENS-ENH-001"
    name: "Multi-Solution Architecture Analyzer"
    priority: "P0"
    effort: "2 days"
    
    description: |
      Visualize complex multi-solution repositories with hierarchical project
      relationships. Detects .sln → .slnf → .csproj hierarchies for .NET,
      multi-module Maven/Gradle for Java, and monorepo structures.
    
    detection_patterns:
      dotnet:
        - "*.sln"                    # Visual Studio solutions
        - "*.slnf"                   # Solution filter files
        - "*.csproj"                 # C# projects
        - "*.fsproj"                 # F# projects
        - "Directory.Build.props"   # Central build properties
        - "Directory.Build.targets" # Central build targets
      
      java:
        - "pom.xml"                  # Maven parent/child POMs
        - "settings.gradle"          # Gradle multi-project
        - "build.gradle"             # Gradle build files
        - "settings.gradle.kts"      # Kotlin DSL
      
      python:
        - "pyproject.toml"           # Modern Python packaging
        - "setup.py"                 # Legacy packaging
        - "requirements*.txt"        # Dependency files
      
      monorepo:
        - "lerna.json"               # JavaScript monorepo
        - "pnpm-workspace.yaml"      # PNPM workspaces
        - "rush.json"                # Rush monorepo
        - "nx.json"                  # Nx workspace
    
    visualization:
      type: "D3.js hierarchical tree"
      features:
        - "Solution → Project hierarchy with collapsible nodes"
        - "Solution filter (.slnf) grouping indicators"
        - "Project type badges (Endpoint, Library, Test, Job)"
        - "Build complexity score per solution"
        - "Cross-solution dependency edges"
    
    output_sections:
      - name: "Solution Topology Map"
        content_type: "interactive_tree"
        description: "Hierarchical view of all solutions and projects"
      
      - name: "Project Type Distribution"
        content_type: "pie_chart"
        description: "Count of Endpoints, Libraries, Tests, Jobs"
      
      - name: "Build Complexity Score"
        content_type: "metric_badge"
        description: "Aggregate complexity based on interdependencies"
    
    implementation:
      file: "cortex/visualization/analyzers/solution_analyzer.py"
      class: "MultiSolutionAnalyzer"
      methods:
        - "discover_solutions(repo_path: Path) -> List[Solution]"
        - "build_hierarchy(solutions: List[Solution]) -> SolutionTree"
        - "detect_project_types(projects: List[Project]) -> Dict[str, int]"
        - "calculate_complexity_score(tree: SolutionTree) -> float"
    
    test_file: "tests/visualization/test_solution_analyzer.py"
    test_cases:
      - "Parse multi-solution .NET repository"
      - "Parse multi-module Maven repository"
      - "Parse Gradle multi-project"
      - "Detect solution filters and project subsets"
      - "Calculate build complexity accurately"

  # ============================================================================
  # ENHANCEMENT 2: Microservices Constellation View
  # ============================================================================
  enhancement_002_microservices_constellation:
    id: "LENS-ENH-002"
    name: "Microservices Constellation View"
    priority: "P0"
    effort: "3 days"
    
    description: |
      Force-directed graph visualization of microservice topology. Automatically
      detects service boundaries, inter-service communication, and shared
      library dependencies. Works for any microservices architecture.
    
    detection_patterns:
      service_indicators:
        dotnet:
          - "*.Endpoint.csproj"       # API endpoint projects
          - "*.Api.csproj"            # REST API projects
          - "*.Service.csproj"        # Service projects
          - "*.WebApi.csproj"         # Web API projects
        
        java:
          - "*-service/src/main"      # Spring Boot services
          - "*-api/src/main"          # API modules
          - "spring-boot-starter-*"   # Spring Boot starters
        
        python:
          - "app/main.py"             # FastAPI/Flask apps
          - "wsgi.py"                 # WSGI entry points
          - "asgi.py"                 # ASGI entry points
        
        go:
          - "cmd/*/main.go"           # Go service entry points
          - "internal/*/service.go"   # Internal services
        
        generic:
          - "Dockerfile"              # Containerized services
          - "docker-compose*.yml"     # Service definitions
          - "kubernetes/*.yaml"       # K8s deployments
    
    relationship_detection:
      - "HTTP client references (RestSharp, HttpClient, axios, requests)"
      - "gRPC proto imports and client stubs"
      - "Message queue publishers/subscribers (NServiceBus, RabbitMQ, Kafka)"
      - "Shared library references (common packages)"
      - "Database connection string patterns"
    
    visualization:
      type: "D3.js force-directed network"
      node_types:
        - name: "service"
          icon: "server"
          color: "blue"
        - name: "job"
          icon: "clock"
          color: "purple"
        - name: "library"
          icon: "book"
          color: "gray"
        - name: "database"
          icon: "database"
          color: "green"
        - name: "queue"
          icon: "layers"
          color: "orange"
      
      edge_types:
        - name: "http"
          style: "solid"
          label: "REST/HTTP"
        - name: "grpc"
          style: "dashed"
          label: "gRPC"
        - name: "message"
          style: "dotted"
          label: "Message Bus"
        - name: "shared_lib"
          style: "thin_solid"
          label: "Library Dependency"
    
    features:
      - "Cluster services by domain/bounded context"
      - "Highlight cross-domain communication (potential coupling)"
      - "Show service health indicators (test coverage badge)"
      - "Filter by communication type (HTTP, gRPC, Messages)"
      - "Zoom to service for detailed view"
    
    implementation:
      file: "cortex/visualization/analyzers/microservices_analyzer.py"
      class: "MicroservicesAnalyzer"
      methods:
        - "discover_services(repo_path: Path) -> List[Service]"
        - "detect_relationships(services: List[Service]) -> List[ServiceEdge]"
        - "cluster_by_domain(services: List[Service]) -> Dict[str, List[Service]]"
        - "generate_constellation_data() -> D3GraphData"

  # ============================================================================
  # ENHANCEMENT 3: Centralized Package Management Viewer
  # ============================================================================
  enhancement_003_package_management:
    id: "LENS-ENH-003"
    name: "Centralized Package Management Viewer"
    priority: "P0"
    effort: "1.5 days"
    
    description: |
      Comprehensive view of package dependencies with version management,
      ownership tracking, and security audit integration. Parses central
      package management files and extracts organizational metadata.
    
    supported_formats:
      dotnet:
        - file: "Directory.Packages.props"
          features:
            - "Central version management (ManagePackageVersionsCentrally)"
            - "Transitive pinning (CentralPackageTransitivePinningEnabled)"
            - "NuGet audit level"
            - "Ownership comments (<!-- Platform.XYZ -->)"
        
        - file: "*.csproj"
          features:
            - "PackageReference elements"
            - "Conditional package inclusion"
      
      java:
        - file: "pom.xml"
          features:
            - "dependencyManagement section"
            - "Property-based version management"
            - "Parent POM inheritance"
        
        - file: "gradle.properties"
          features:
            - "Version catalog"
            - "Dependency constraints"
      
      javascript:
        - file: "package.json"
          features:
            - "dependencies and devDependencies"
            - "peerDependencies"
            - "Workspace dependencies"
        
        - file: "pnpm-lock.yaml / yarn.lock / package-lock.json"
          features:
            - "Resolved versions"
            - "Integrity hashes"
      
      python:
        - file: "requirements.txt / requirements-*.txt"
          features:
            - "Pinned versions"
            - "Environment-specific requirements"
        
        - file: "pyproject.toml"
          features:
            - "Project dependencies"
            - "Optional dependencies"
            - "Dev dependencies"
    
    ownership_extraction:
      description: "Parse comments to extract package ownership"
      patterns:
        - "<!-- {Owner} -->"              # XML comment
        - "# {Owner}"                     # YAML/Python comment
        - "// {Owner}"                    # JSON5/Java comment
      
      output:
        - "Group packages by owner/platform"
        - "Show ownership distribution pie chart"
        - "Highlight orphaned packages (no owner)"
    
    security_integration:
      - "Cross-reference with NVD (National Vulnerability Database)"
      - "Display CVE badges on vulnerable packages"
      - "Show NuGet/npm/PyPI security advisories"
      - "Link to remediation guidance"
    
    visualization:
      table_view:
        columns:
          - "Package Name"
          - "Version"
          - "Owner/Platform"
          - "Usage Count (projects using it)"
          - "Security Status (CVE badge)"
          - "Last Updated (from lock file)"
      
      timeline_view:
        description: "Git history of version changes"
        features:
          - "Version bump timeline"
          - "Major/minor/patch categorization"
          - "Author attribution for updates"
    
    implementation:
      file: "cortex/visualization/analyzers/package_analyzer.py"
      class: "PackageManagementAnalyzer"

