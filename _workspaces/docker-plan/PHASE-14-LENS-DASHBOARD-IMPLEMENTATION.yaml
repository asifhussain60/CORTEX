          - "Project name"
          - "Version"
          - "Source encoding"
        dashboard_link: "Generate link to SonarQube project dashboard"
      
      sonarcloud:
        config_files:
          - ".sonarcloud.properties"
        extracted_info:
          - "Organization"
          - "Project key"
      
      codeclimate:
        config_files:
          - ".codeclimate.yml"
        extracted_info:
          - "Engines configured"
          - "Exclusion patterns"
    
    visualization:
      quality_badge:
        type: "Status badge"
        states:
          - "Passing (green)"
          - "Warning (yellow)"
          - "Failing (red)"
          - "Unknown (gray)"
      
      metrics_summary:
        type: "Metric cards"
        content:
          - "Coverage %"
          - "Duplications %"
          - "Technical Debt (time)"
          - "Issues by severity"
    
    implementation:
      file: "cortex/visualization/analyzers/quality_gate_analyzer.py"
      class: "QualityGateAnalyzer"

  # ============================================================================
  # ENHANCEMENT 14: Multi-Language Repository Support
  # ============================================================================
  enhancement_014_polyglot_analysis:
    id: "LENS-ENH-014"
    name: "Multi-Language Repository Support"
    priority: "P0"
    effort: "2 days"
    
    description: |
      Enhanced analysis for polyglot repositories that mix multiple
      programming languages. Provides language distribution, cross-language
      dependency detection, and unified visualization.
    
    language_detection:
      by_extension:
        - ".cs → C#"
        - ".fs → F#"
        - ".java → Java"
        - ".kt → Kotlin"
        - ".py → Python"
        - ".ts / .tsx → TypeScript"
        - ".js / .jsx → JavaScript"
        - ".go → Go"
        - ".rs → Rust"
        - ".sql → SQL"
        - ".ps1 → PowerShell"
        - ".sh → Shell"
      
      by_config_file:
        - "*.csproj → .NET"
        - "pom.xml → Java (Maven)"
        - "build.gradle → Java/Kotlin (Gradle)"
        - "package.json → JavaScript/TypeScript"
        - "pyproject.toml → Python"
        - "go.mod → Go"
        - "Cargo.toml → Rust"
    
    cross_language_patterns:
      - "FFI (Foreign Function Interface) bindings"
      - "gRPC proto files shared between languages"
      - "OpenAPI/Swagger specs with multi-language clients"
      - "Shared database schemas accessed by multiple languages"
      - "Message contracts (Protobuf, Avro, JSON Schema)"
    
    visualization:
      language_distribution:
        type: "Pie chart + treemap"
        metrics:
          - "Lines of code per language"
          - "File count per language"
          - "Directory distribution"
      
      language_stack_badges:
        type: "Badge grid"
        description: "Technology stack with version badges"
      
      cross_language_map:
        type: "D3.js network"
        description: "Show integration points between languages"
    
    implementation:
      file: "cortex/visualization/analyzers/polyglot_analyzer.py"
      class: "PolyglotRepositoryAnalyzer"

  # ============================================================================
  # ENHANCEMENT 15: Domain Knowledge Overlay System
  # ============================================================================
  enhancement_015_domain_knowledge_overlay:
    id: "LENS-ENH-015"
    name: "Domain Knowledge Overlay System"
    priority: "P0"
    effort: "2.5 days"
    
    description: |
      Integrate company-specific domain knowledge from CORTEX's knowledge
      layer to enrich technical dashboards with business context. Overlays
      business definitions, compliance requirements, and domain terminology
      on code visualizations.
    
    knowledge_sources:
      company_domains:
        location: "company/domains/**/*.yaml"
        content_types:
          - "Business domain definitions"
          - "Compliance requirements (regulatory standards)"
          - "Domain glossary terms"
          - "Coding standards and conventions"
      
      cortex_tier3_knowledge:
        location: "cortex_brain/tier3/knowledge/**/*.yaml"
        content_types:
          - "Best practices"
          - "Design patterns"
          - "Anti-patterns to avoid"
      
      compliance_standards:
        location: "company/domains/compliance-standards/*.yaml"
        content_types:
          - "Regulatory requirements (HIPAA, PCI-DSS, GDPR, etc.)"
          - "Compliance patterns and controls"
    
    overlay_features:
      hover_annotations:
        description: "Show business context when hovering over code elements"
        examples:
          - "Class 'UserAccount' → 'Part of Account Management domain. Subject to SOX compliance.'"
          - "Method 'processPayment' → 'Payment processing. PCI-DSS Level 1 applies.'"
      
      compliance_badges:
        description: "Show applicable compliance standards on components"
        types:
          - "HIPAA (healthcare data)"
          - "PCI-DSS (payment data)"
          - "GDPR (personal data)"
          - "SOX (financial reporting)"
          - "SOC2 (security controls)"
      
      domain_glossary_panel:
        description: "Sidebar with domain terminology definitions"
        features:
          - "Searchable glossary"
          - "Context-aware suggestions based on current view"
      
      standards_compliance_meter:
        description: "Show adherence to coding standards"
        metrics:
          - "Naming convention compliance %"
          - "Documentation coverage %"
          - "Test pattern adherence %"
    
    implementation:
      file: "cortex/visualization/overlays/domain_knowledge_overlay.py"
      class: "DomainKnowledgeOverlayProvider"
      
      integration_points:
        - "Load knowledge YAMLs at dashboard generation time"
        - "Match code elements to domain patterns"
        - "Inject overlay data into dashboard JSON"
        - "Frontend: Show overlays on hover/click"
    
    test_file: "tests/visualization/test_domain_knowledge_overlay.py"
    test_cases:
      - "Load domain knowledge from company/domains/"
      - "Match class names to domain definitions"
      - "Apply compliance badges to matching components"
      - "Generate glossary from domain YAML files"

