      - "Generate overview for Django web app"
      - "Generate overview for CLI tool"
      - "Handle project with no docstrings (low confidence)"
      - "Detect microservices architecture"
      - "Detect monolithic architecture"
    
    acceptance_criteria:
      - "Generates human-readable prose from AST data"
      - "Confidence scores for each statement"
      - "Templates for different project types"
      - "100% test coverage"
