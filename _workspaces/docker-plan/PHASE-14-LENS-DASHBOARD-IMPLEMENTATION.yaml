  task_003_business_language_generator:
    ac_id: "LENS-DASH-002"
    priority: "P0"
    effort: "2 days"
    description: "Implement BusinessLanguageGenerator (AST → Business Language)"
    
    implementation:
      file: "cortex/visualization/business_language_generator.py"
      class: "BusinessLanguageGenerator"
      methods:
