# PHASE 14: CORTEX LENS Dashboard - Comprehensive Implementation Plan
# Version: 1.0
# Created: 2026-01-29
# Authority: CORE-030 (Implementation Truth), CORE-038 (File Placement)
# Dependencies: Phase 7.1 (LENS Intelligence Complete)

metadata:
  phase_id: "PHASE-14"
  name: "LENS Dashboard Visualization System (Self-Contained SPA)"
  status: "IN_PROGRESS"  # Tasks 001-006 completed (7/20 tasks)
  priority: "P1"
  estimated_effort: "15.5-19.5 days"  # Updated: +1.5 days for self-contained SPA
  ac_ids:
    - "LENS-DASH-001"  # LENSVisualizationOrchestrator
    - "LENS-DASH-002"  # Business Language Content Generator
    - "LENS-DASH-003"  # D3.js Visualization Extractors
    - "LENS-DASH-004"  # Dashboard API Routes
    - "LENS-DASH-005"  # Frontend Integration (Self-Contained SPA)
    - "LENS-DASH-006"  # Output Management System
    - "LENS-DASH-007"  # Self-Contained SPA Architecture (NEW)

# ==============================================================================
# EXECUTIVE SUMMARY
# ==============================================================================

executive_summary: |
  The CORTEX LENS Dashboard provides visual intelligence for code repositories through:
  
  **ARCHITECTURE: Self-Contained SPA (Offline-First)**
  - NO external CDN dependencies (all assets bundled locally)
  - Lazy-loaded modular architecture (initial load <200KB, full bundle 1.5MB)
  - Alpine.js framework (15KB reactive SPA vs React 130KB)
  - HTTP static server built-in (cortex lens dashboard serve)
  - Fully functional offline (air-gapped environments supported)
  
  1. **Reverse-Engineered Repository Overview** (NEW TAB 1)
     - Business-language description of what the codebase does
     - Key features extracted from AST + Git + Comments
     - Architecture patterns detected automatically
     - Technology stack identification
  
  2. **Adaptive Multi-Tab Interface** (Context-Aware)
     
     **UNIVERSAL Dashboard (5 tabs - ANY repository):**
     - Tab 1: Repository Overview (NEW - business language)
     - Tab 2: Dependency Graph (D3.js force-directed network)
     - Tab 3: Class Diagrams (Mermaid UML generation)
     - Tab 4: Temporal Analysis (Git commit timeline)
     - Tab 5: Impact Analysis (change propagation)
     
     **CORTEX Extended Dashboard (8 tabs - CORTEX repository only):**
     - Universal tabs 1-5 PLUS:
     - Tab 6: Brain Architecture (CORTEX-specific - 4-tier brain map)
     - Tab 7: Governance Compliance (CORTEX-specific - heatmap visualization)
     - Tab 8: Orchestrator Constellation (CORTEX-specific - relationship map)
  
  3. **Multi-Dimensional Overlay System** (Phase 14.1 - APPROVED)
     - Security Overlay: Highlights P0/P1/P2 vulnerabilities, insecure patterns, dependency risks
     - Performance Overlay: Shows bottlenecks, complexity hotspots, optimization opportunities
     - Compliance Overlay: Displays CORE rule violations, standards compliance, audit status
     - Overlays toggle on/off independently across all tabs (no tab proliferation)
     - Visual markers: Icons, color coding, sidebar annotations
  
  4. **New D3.js Visualizations**
     - Call graph visualization (function relationships)
     - Import dependency graph (module dependencies)
     - Change frequency heatmap (hot spots)
     - Author contribution network (expertise map)
     - Complexity scatter plot (cyclomatic vs LOC)
  
  4. **New Mermaid Diagrams**
     - Entity-relationship diagrams (database models)
     - State machine diagrams (workflow states)
     - Sequence diagrams (interaction flows)
     - Architecture diagrams (system components)
  
  5. **Per-Repository Dashboard Generation**
     - Stored in .cortex/lens-dashboard/ (user repos)
     - Stored in reports/lens-dashboard/ (CORTEX self-analysis)
     - Cached in ~/.cortex/cache/<owner>/<repo>/ (remote repos)
  
  6. **Bundle Strategy** (Self-Contained SPA)
     - Core bundle: Alpine.js (15KB) + app code (160KB) = 175KB initial load
     - D3.js modules: 250KB (lazy-loaded per tab)
     - Mermaid module: 850KB (lazy-loaded per tab)
     - Total full bundle: 1.5MB (vs 3MB monolithic)
     - All assets served from cortex/visualization/static/vendor/
     - Python http.server for instant serving (no npm/node required)

# ==============================================================================
# ARCHITECTURE OVERVIEW
# ==============================================================================

architecture:
  spa_framework:
    choice: "Alpine.js 3.13.3"
    rationale: |
      - 15KB vs React 130KB (8.6x smaller)
      - Perfect for dashboards (reactive data binding, no build step)
      - No JSX/Virtual DOM overhead
      - Direct DOM manipulation (like Vue.js)
      - Lazy-loadable per tab
    bundle_strategy:
      - Core: Alpine.js + app logic (175KB initial)
      - Modules: D3.js (250KB), Mermaid (850KB), loaded on tab activation
      - Total: 1.5MB full bundle vs 3MB monolithic
    dependencies_local:
      - "cortex/visualization/static/vendor/alpine-3.13.3.min.js"
      - "cortex/visualization/static/vendor/d3-7.8.5.min.js"
      - "cortex/visualization/static/vendor/mermaid-10.6.1.min.js"
      - "cortex/visualization/static/vendor/tailwind-3.4.0.min.css"
    
  new_components:
    orchestrator:
      path: "cortex/orchestrators/support/lens_visualization_orchestrator.py"
      purpose: "Coordinate visualization generation, extend LENSOrchestrator"
      dependencies:
        - "cortex.orchestrators.support.lens_orchestrator:LENSOrchestrator"
        - "cortex.visualization.*"
      
    visualization_package:
      path: "cortex/visualization/"
      structure:
        - "__init__.py"
        - "lens_visualization_orchestrator.py"
        - "output_manager.py"
        - "business_language_generator.py"  # NEW - AST to business language
        - "repository_detector.py"          # NEW - Detect CORTEX vs external repos
        - "dashboard_configuration.py"      # NEW - Context-aware tab selection
        - "renderers/"
        - "formatters/"
        - "templates/"
        - "static/"
    
    renderers:
      path: "cortex/visualization/renderers/"
      modules:
        - "d3_renderer.py"           # D3.js config generation
        - "mermaid_renderer.py"      # Mermaid syntax generation
        - "governance_heatmap.py"    # Compliance visualization
        - "dependency_graph.py"      # Call graph + import graph
        - "timeline_renderer.py"     # Temporal visualization
        - "complexity_renderer.py"   # Complexity metrics
        - "author_network.py"        # Contribution analysis
    
    formatters:
      path: "cortex/visualization/formatters/"
      modules:
        - "__init__.py"
        - "graph_formatter.py"       # D3 data format (nodes/edges)
        - "diagram_formatter.py"     # Mermaid syntax
        - "response_formatter.py"    # Multi-mode output
    
    templates:
      path: "cortex/visualization/templates/"
      files:
        # Universal templates (all repos)
        - "dashboard_base.html"      # Jinja2 base template with conditional rendering
        - "repository_overview.html" # Tab 1 - UNIVERSAL
        - "dependency_graph.html"    # Tab 2 - UNIVERSAL
        - "class_diagram.html"       # Tab 3 - UNIVERSAL
        - "temporal_analysis.html"   # Tab 4 - UNIVERSAL
        - "impact_analysis.html"     # Tab 5 - UNIVERSAL
        
        # CORTEX-specific templates (only if is_cortex_repository)
        - "brain_architecture.html"      # Tab 6 - CORTEX ONLY
        - "governance_heatmap.html"      # Tab 7 - CORTEX ONLY
        - "orchestrator_constellation.html" # Tab 8 - CORTEX ONLY
    
    static_assets:
      path: "cortex/visualization/static/"
      structure:
        - "css/"
        - "js/"
        - "assets/"
    
    api_routes:
      path: "cortex/api/dashboard_routes.py"
      purpose: "FastAPI endpoints for dashboard data"

  output_locations:
    per_repo_analysis:
      pattern: "<repo-root>/.cortex/lens-dashboard/"
      gitignore: true
      description: "Generated dashboard for analyzed repository"
    
    cortex_self_analysis:
      pattern: "reports/lens-dashboard/"
      gitignore: false
      description: "CORTEX repository self-analysis dashboard"
    
    remote_repo_cache:
      pattern: "~/.cortex/cache/<owner>/<repo>/lens-dashboard/"
      gitignore: true
      description: "Cached dashboards for remote repository analysis"
    
    ci_artifacts:
      pattern: "$CI_ARTIFACTS_DIR/lens-dashboard/"
      gitignore: true
      description: "Build artifacts in CI/CD pipelines"

# ==============================================================================
# TAB 1: REPOSITORY OVERVIEW (NEW - Business Language Content)
# ==============================================================================

tab_1_repository_overview:
  name: "Repository Overview"
  purpose: "Generate human-readable, business-language description of repository"
  
  algorithm:
    name: "Business Language Content Generator"
    implementation: "cortex/visualization/business_language_generator.py"
    
    steps:
      1_ast_extraction:
        inputs:
          - "AST analysis (functions, classes, modules)"
          - "Docstrings and comments"
          - "Function signatures and parameters"
        outputs:
          - "Core capabilities list"
          - "API endpoints discovered"
          - "Database models identified"
      
      2_git_analysis:
        inputs:
          - "Commit messages (last 100 commits)"
          - "Change frequency patterns"
          - "Author contributions"
        outputs:
          - "Project maturity assessment"
          - "Active development areas"
          - "Key contributors"
      
      3_technology_detection:
        inputs:
          - "Import statements (AST)"
          - "requirements.txt / package.json / pom.xml"
          - "Configuration files"
        outputs:
          - "Technology stack"
          - "Framework identification"
          - "Database technologies"
      
      4_pattern_recognition:
        inputs:
          - "Directory structure"
          - "Class inheritance patterns"
          - "Design patterns in code"
        outputs:
          - "Architecture style (MVC, Microservices, Monolith)"
          - "Design patterns used"
          - "Code organization strategy"
      
      5_business_language_mapping:
        rules:
          - "class User → 'User Management System'"
          - "class Order → 'Order Processing'"
          - "def authenticate → 'User Authentication'"
          - "def send_email → 'Email Notification System'"
          - "API routes → 'RESTful API with X endpoints'"
          - "Database models → 'Persistent data storage for X entities'"
        
        templates:
          what_it_does: |
            This is a {architecture_style} {project_type} that provides {core_capabilities}.
            It uses {technology_stack} and follows {design_patterns} patterns.
          
          key_features: |
            - {feature_1} via {implementation_1}
            - {feature_2} via {implementation_2}
            - {feature_3} via {implementation_3}
          
          architecture: |
            The system is organized as a {architecture_style} with {layer_count} layers:
            {layer_descriptions}
          
          technology_stack: |
            **Backend:** {backend_frameworks}
            **Frontend:** {frontend_frameworks}
            **Database:** {database_systems}
            **Infrastructure:** {deployment_tools}
      
      6_confidence_scoring:
        metrics:
          - "Docstring coverage (higher = more confident descriptions)"
          - "Commit message quality (detailed messages = better intent)"
          - "Pattern detection confidence (explicit patterns = high confidence)"
        
        output_format:
          - "High confidence: Direct statements"
          - "Medium confidence: 'Appears to provide...'"
          - "Low confidence: 'Contains components suggesting...'"
  
  output_sections:
    - section: "What This Repository Does"
      content_type: "prose"
      sources: ["AST", "Git", "Docstrings"]
    
    - section: "Key Features"
      content_type: "bulleted_list"
      sources: ["AST functions", "API routes", "Classes"]
    
    - section: "Technology Stack"
      content_type: "badge_grid"
      sources: ["Imports", "Config files"]
    
    - section: "Architecture Overview"
      content_type: "prose + diagram"
      sources: ["Directory structure", "Pattern detection"]
    
    - section: "Development Activity"
      content_type: "metrics + timeline"
      sources: ["Git commits", "Author contributions"]
    
    - section: "Code Health Metrics"
      content_type: "metrics_grid"
      sources: ["AST complexity", "Test coverage", "Docstring ratio"]

  example_output: |
    # 📦 Repository Overview: CORTEX
    
    ## What This Repository Does
    CORTEX is a microservices-based orchestration system that provides 
    AI-powered development workflow automation. It uses Python FastAPI 
    for backend services, React for frontend dashboards, and PostgreSQL 
    for persistent storage. The system follows Domain-Driven Design (DDD) 
    patterns with 23 orchestrators coordinating development tasks.
    
    ## Key Features
    - **Intent Classification** via NLP-powered IntentRouter analyzing user requests
    - **Test-Driven Development** via TDDOrchestrator enforcing RED-GREEN-REFACTOR cycles
    - **Code Intelligence** via LENS analyzers (AST, Git, Comments)
    - **Governance Enforcement** via 38 immutable CORE rules with real-time validation
    - **Visual Dashboards** via D3.js and Mermaid diagram generation
    
    ## Technology Stack
    **Backend:** Python 3.11, FastAPI, Pydantic
    **Frontend:** React, D3.js, Tailwind CSS
    **Database:** PostgreSQL, SQLite (dev)
    **Infrastructure:** Docker, Kubernetes, Nginx
    **Testing:** pytest, coverage.py
    
    ## Architecture Overview
    The system follows a 4-tier brain architecture:
    - **Tier 0:** Immutable governance rules (28 CORE rules)
    - **Tier 1:** Acceptance criteria and phase validation
    - **Tier 2:** Response templates and behavioral boundaries
    - **Tier 3:** Best practices knowledge repository (35+ YAMLs)
    
    Orchestrators are wired via Git-backed YAML specifications with 
    hot-reload support for zero-downtime updates.
    
    ## Development Activity
    - **Total Commits:** 1,247 (last 90 days: 342)
    - **Active Contributors:** 3 (primary: Asif Hussain)
    - **Recent Focus Areas:** LENS Intelligence (Phase 7.1), Challenge System (Phase 8)
    - **Code Churn:** High activity in cortex/orchestrators/ and cortex/brain/analysis/

