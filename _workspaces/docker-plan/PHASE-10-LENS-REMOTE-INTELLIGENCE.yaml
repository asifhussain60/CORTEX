      license: "LGPL-3.0"
    
    - name: "requests"
      version: ">=2.31.0"
      purpose: "HTTP client for generic git providers"
      license: "Apache-2.0"
    
    - name: "diskcache"
      version: ">=5.6.0"
      purpose: "Disk-based caching with TTL support"
      license: "Apache-2.0"
  
  internal:
