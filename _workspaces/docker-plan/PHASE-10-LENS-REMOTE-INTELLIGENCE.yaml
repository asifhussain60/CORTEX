---
# PHASE 10: LENS Remote Branch Intelligence
# Version: 1.0
# Created: 2026-01-27
# Authority: CORE-038 (File Placement), CORE-040 (Doc Lifecycle)
# Status: PLANNED

metadata:
  phase_id: "PHASE-10"
  title: "LENS Remote Branch Intelligence"
  version: "1.0"
  created: "2026-01-27"
  status: "PLANNED"
  priority: "MEDIUM"
  estimated_effort: "5-7 days"
  dependencies:
    - "PHASE-7.1-COMPLETE (LENS Intelligence System)"
    - "GitHistoryAnalyzer (Production)"
    - "LENSOrchestrator (Production)"
  
objectives:
  primary: "Extend LENS intelligence to support remote git repositories and branches without requiring local clones"
  
  secondary:
    - "Enable analysis of GitHub/GitLab pull requests and branches"
    - "Support cross-branch comparison and drift detection"
    - "Implement efficient remote data caching"
    - "Add API-based metadata enrichment"
  
  business_value:
    - "Analyze code before cloning (security/compliance)"
    - "PR review automation without local checkout"
    - "Multi-branch intelligence comparison"
    - "Reduced disk space requirements"

# ============================================================================
# PHASE 10 TASKS
# ============================================================================

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Remote Git Adapter Design
  # --------------------------------------------------------------------------
  - id: "LENS-010"
    title: "Design Remote Git Adapter Architecture"
    type: "DESIGN"
    status: "PLANNED"
    priority: "HIGH"
    effort: "4 hours"
    
    description: |
      Design abstraction layer for remote git operations supporting:
      - GitHub API v3/v4 (GraphQL)
      - GitLab API v4
      - Generic git protocol (git://, https://)
      - Authentication (tokens, SSH keys)
      - Rate limiting and retry logic
    
    deliverables:
      - "cortex/brain/analysis/remote_git_adapter.py (interface)"
      - "cortex/brain/analysis/providers/github_provider.py"
      - "cortex/brain/analysis/providers/gitlab_provider.py"
      - "cortex/brain/analysis/providers/generic_git_provider.py"
      - "Design document in docs/LENS-REMOTE-ARCHITECTURE.md"
    
    acceptance_criteria:
      - "Provider interface supports: fetch_file, fetch_commits, fetch_blame"
      - "Authentication abstraction (env vars, config files)"
      - "Circuit breaker pattern for API failures"
      - "Rate limiting respects provider limits (GitHub: 5000/hr)"
    
    tests:
      unit: 8
      integration: 3
    
    affected_files:
      new:
        - "cortex/brain/analysis/remote_git_adapter.py"
        - "cortex/brain/analysis/providers/__init__.py"
        - "cortex/brain/analysis/providers/github_provider.py"
        - "cortex/brain/analysis/providers/gitlab_provider.py"
        - "cortex/brain/analysis/providers/generic_git_provider.py"
      tests:
        - "tests/brain/analysis/test_remote_git_adapter.py"
        - "tests/brain/analysis/providers/test_github_provider.py"
        - "tests/brain/analysis/providers/test_gitlab_provider.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-012 (Docstrings)"
      - "CORE-013 (No bare except)"
      - "CORE-038 (File Placement)"

  # --------------------------------------------------------------------------
  # Task 2: Enhance GitHistoryAnalyzer for Remote Support
  # --------------------------------------------------------------------------
  - id: "LENS-011"
    title: "Extend GitHistoryAnalyzer with Remote Capabilities"
    type: "IMPLEMENT"
    status: "PLANNED"
    priority: "HIGH"
    effort: "8 hours"
    dependencies:
      - "LENS-010"
    
    description: |
      Extend GitHistoryAnalyzer to support both local and remote repositories:
      - Add remote URL detection and parsing
      - Integrate RemoteGitAdapter for remote operations
      - Maintain backward compatibility with local-only mode
      - Add temporary clone support for git protocol
    
    deliverables:
      - "Enhanced cortex/brain/analysis/git_history_analyzer.py"
      - "New methods: analyze_remote_file(), analyze_remote_branch()"
      - "URL parsing utility: parse_git_url()"
    
    acceptance_criteria:
      - "Detects remote URLs (https://github.com/..., git@github.com:...)"
      - "Falls back to local analysis if repo_path is Path"
      - "Remote analysis returns same GitHistoryResult format"
      - "Supports branch specification (e.g., origin/main, feature/xyz)"
      - "All existing tests pass (100% backward compatibility)"
    
    tests:
      unit: 12
      integration: 5
    
    affected_files:
      modified:
        - "cortex/brain/analysis/git_history_analyzer.py"
      new:
        - "cortex/brain/analysis/git_url_parser.py"
      tests:
        - "tests/brain/analysis/test_git_history_analyzer.py (enhanced)"
        - "tests/brain/analysis/test_git_url_parser.py"
        - "tests/brain/analysis/test_git_history_analyzer_remote.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-012 (Docstrings)"
      - "CORE-030 (Implementation Truth)"
      - "CORE-035 (Single Canonical Implementation)"

  # --------------------------------------------------------------------------
  # Task 3: Remote Caching System
  # --------------------------------------------------------------------------
  - id: "LENS-012"
    title: "Implement Remote Analysis Caching"
    type: "IMPLEMENT"
    status: "PLANNED"
    priority: "MEDIUM"
    effort: "6 hours"
    dependencies:
      - "LENS-011"
    
    description: |
      Add caching layer for remote git operations to minimize API calls:
      - File content caching (TTL: 1 hour)
      - Commit history caching (TTL: 5 minutes)
      - Blame information caching (TTL: 1 hour)
      - Cache invalidation on branch updates
      - Disk-based cache with size limits (500MB default)
    
    deliverables:
      - "cortex/brain/analysis/remote_cache.py"
      - "Cache configuration in cortex/config/lens_config.yaml"
      - "Cache cleanup utility"
    
    acceptance_criteria:
      - "Cache hit reduces API calls by 80%+ in repeated analysis"
      - "Cache respects TTL and evicts stale entries"
      - "Cache size limit enforced (LRU eviction)"
      - "Cache path configurable via environment variable"
      - "Thread-safe cache operations"
    
    tests:
      unit: 10
      integration: 4
    
    affected_files:
      new:
        - "cortex/brain/analysis/remote_cache.py"
        - "cortex/config/lens_config.yaml"
      tests:
        - "tests/brain/analysis/test_remote_cache.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-013 (No bare except)"
      - "CORE-038 (File Placement)"

  # --------------------------------------------------------------------------
  # Task 4: LENSOrchestrator Remote Integration
  # --------------------------------------------------------------------------
  - id: "LENS-013"
    title: "Update LENSOrchestrator for Remote Analysis"
    type: "IMPLEMENT"
    status: "PLANNED"
    priority: "HIGH"
    effort: "5 hours"
    dependencies:
      - "LENS-011"
      - "LENS-012"
    
    description: |
      Extend LENSOrchestrator to support remote repository analysis:
      - Add analyze_remote_file() method
      - Add analyze_remote_branch() for batch analysis
      - Update cache to support remote URLs as keys
      - Add remote metadata to LENSContext
    
    deliverables:
      - "Enhanced cortex/orchestrators/support/lens_orchestrator.py"
      - "New LENSRemoteContext dataclass"
    
    acceptance_criteria:
      - "analyze_remote_file() accepts URL + branch + file path"
      - "Returns LENSContext compatible with IntentRouter (LENS-002)"
      - "Metadata includes: provider, branch, commit_sha, cache_hit"
      - "All existing functionality preserved (100% backward compat)"
    
    tests:
      unit: 8
      integration: 4
    
    affected_files:
      modified:
        - "cortex/orchestrators/support/lens_orchestrator.py"
      tests:
        - "tests/orchestrators/support/test_lens_orchestrator.py (enhanced)"
        - "tests/orchestrators/support/test_lens_orchestrator_remote.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-012 (Docstrings)"
      - "CORE-030 (Implementation Truth)"
      - "CORE-035 (Single Canonical Implementation)"

  # --------------------------------------------------------------------------
  # Task 5: CLI Commands for Remote Analysis
  # --------------------------------------------------------------------------
  - id: "LENS-014"
    title: "Add CLI Commands for Remote LENS Operations"
    type: "IMPLEMENT"
    status: "PLANNED"
    priority: "MEDIUM"
    effort: "4 hours"
    dependencies:
      - "LENS-013"
    
    description: |
      Add CLI commands to expose remote LENS capabilities:
      - cortex lens remote analyze <url> <branch> <file>
      - cortex lens remote history <url> <branch> <file>
      - cortex lens remote blame <url> <branch> <file>
      - cortex lens remote compare <url1> <branch1> <url2> <branch2> <file>
      - cortex lens cache clear
    
    deliverables:
      - "Enhanced cortex/cli/lens_commands.py"
      - "CLI help documentation"
    
    acceptance_criteria:
      - "All commands accept GitHub/GitLab URLs"
      - "Authentication via GITHUB_TOKEN / GITLAB_TOKEN env vars"
      - "Pretty-printed output with syntax highlighting"
      - "Error handling with actionable messages"
      - "--json flag for machine-readable output"
    
    tests:
      unit: 10
      integration: 5
    
    affected_files:
      modified:
        - "cortex/cli/lens_commands.py"
      tests:
        - "tests/cli/test_lens_commands.py (enhanced)"
        - "tests/cli/test_lens_remote_commands.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-012 (Docstrings)"

  # --------------------------------------------------------------------------
  # Task 6: Branch Comparison & Drift Detection
  # --------------------------------------------------------------------------
  - id: "LENS-015"
    title: "Implement Branch Comparison Intelligence"
    type: "IMPLEMENT"
    status: "PLANNED"
    priority: "LOW"
    effort: "6 hours"
    dependencies:
      - "LENS-013"
    
    description: |
      Add branch comparison capabilities to detect:
      - Commit drift between branches
      - File modifications across branches
      - Author contribution differences
      - Intent pattern changes (via commit messages)
    
    deliverables:
      - "cortex/brain/analysis/branch_comparator.py"
      - "Branch comparison report format"
    
    acceptance_criteria:
      - "Compares two branches (local or remote)"
      - "Identifies diverged commits"
      - "Highlights file changes with line-level diffs"
      - "Detects intent shifts (refactor → bugfix → feature)"
    
    tests:
      unit: 12
      integration: 4
    
    affected_files:
      new:
        - "cortex/brain/analysis/branch_comparator.py"
      tests:
        - "tests/brain/analysis/test_branch_comparator.py"
    
    governance_rules:
      - "CORE-008 (TDD)"
      - "CORE-011 (Type hints)"
      - "CORE-012 (Docstrings)"
      - "CORE-038 (File Placement)"

  # --------------------------------------------------------------------------
  # Task 7: Documentation & Examples
  # --------------------------------------------------------------------------
  - id: "LENS-016"
    title: "Create Remote LENS Documentation"
    type: "DOCUMENT"
    status: "PLANNED"
    priority: "MEDIUM"
    effort: "3 hours"
    dependencies:
      - "LENS-014"
    
    description: |
      Comprehensive documentation for remote LENS features:
      - Architecture overview
      - API provider setup (GitHub/GitLab tokens)
      - CLI usage examples
      - Python API examples
      - Troubleshooting guide
    
    deliverables:
      - "docs/LENS-REMOTE-GUIDE.md"
      - "docs/LENS-ARCHITECTURE.md (updated)"
      - "README.md updates"
    
    acceptance_criteria:
      - "Step-by-step setup for GitHub/GitLab"
      - "10+ CLI examples with expected output"
      - "5+ Python API examples"
      - "Common errors and solutions documented"
    
    affected_files:
      new:
        - "docs/LENS-REMOTE-GUIDE.md"
      modified:
        - "docs/LENS-ARCHITECTURE.md"
        - "README.md"
    
    governance_rules:
      - "CORE-038 (File Placement)"
      - "CORE-039 (MD Generation Prohibition - allowed in docs/)"
      - "CORE-040 (Documentation Lifecycle)"

# ============================================================================
# ACCEPTANCE CRITERIA (Phase Level)
# ============================================================================

acceptance_criteria:
  functional:
    - id: "AC-LENS-REMOTE-001"
      description: "Analyze GitHub repository file without local clone"
      test: "cortex lens remote analyze https://github.com/user/repo main src/main.py"
      expected: "Returns commit history, AST analysis, and comments"
    
    - id: "AC-LENS-REMOTE-002"
      description: "Analyze GitLab repository with authentication"
      test: "GITLAB_TOKEN=xyz cortex lens remote analyze https://gitlab.com/user/repo main file.py"
      expected: "Successful analysis with authenticated API access"
    
    - id: "AC-LENS-REMOTE-003"
      description: "Compare branches across repositories"
      test: "cortex lens remote compare <url1> main <url2> develop file.py"
      expected: "Diff report showing commit and content differences"
    
    - id: "AC-LENS-REMOTE-004"
      description: "Cache reduces API calls"
      test: "Run same analysis twice, measure API calls"
      expected: "Second run uses cache, API calls reduced by 80%+"
    
    - id: "AC-LENS-REMOTE-005"
      description: "Backward compatibility preserved"
      test: "All existing LENS tests pass without modification"
      expected: "100% test pass rate (172+ tests)"
  
  non_functional:
    - id: "AC-LENS-PERF-001"
      description: "Remote analysis completes within 5 seconds"
      metric: "Response time for single file analysis"
      target: "< 5s for cached, < 15s for uncached"
    
    - id: "AC-LENS-SEC-001"
      description: "API tokens never logged or exposed"
      metric: "Audit log review"
      target: "Zero token leaks in logs or error messages"
    
    - id: "AC-LENS-RELIABLE-001"
      description: "Graceful degradation on API failures"
      metric: "Error handling coverage"
      target: "Partial results returned when subset of analyzers fail"

# ============================================================================
# TESTING STRATEGY
# ============================================================================

testing:
  unit_tests:
    total: 60
    new: 60
    coverage_target: "95%"
    
    breakdown:
      - component: "RemoteGitAdapter"
        tests: 8
      - component: "GitHubProvider"
        tests: 10
      - component: "GitLabProvider"
        tests: 10
      - component: "GitHistoryAnalyzer (remote)"
        tests: 12
      - component: "RemoteCache"
        tests: 10
      - component: "LENSOrchestrator (remote)"
        tests: 8
      - component: "CLI Commands"
        tests: 10
      - component: "BranchComparator"
        tests: 12
  
  integration_tests:
    total: 25
    new: 25
    
    scenarios:
      - "GitHub repository analysis (public)"
      - "GitHub repository analysis (private with token)"
      - "GitLab repository analysis"
      - "Branch comparison (same repo)"
      - "Branch comparison (different repos)"
      - "Cache hit/miss scenarios"
      - "API rate limit handling"
      - "Network failure recovery"
      - "Backward compatibility (local analysis)"
  
  manual_tests:
    - "Test with real GitHub repositories (10+ repos)"
    - "Test with real GitLab repositories (5+ repos)"
    - "Performance testing (100 file batch analysis)"
    - "Rate limit handling (exhaust GitHub API limit)"

# ============================================================================
# DEPLOYMENT PLAN
# ============================================================================

deployment:
  pre_deployment:
    - "Run full test suite (172+ existing + 85 new = 257 tests)"
    - "Update CORTEX.prompt.md with Phase 10 status"
    - "Create git checkpoint (CORE-026)"
    - "Document breaking changes (none expected)"
  
  deployment_steps:
    - step: 1
      action: "Merge feature branch to main"
      validation: "CI/CD passes"
    
    - step: 2
      action: "Update production configuration"
      files:
        - "cortex/config/lens_config.yaml"
      validation: "Config schema validation"
    
    - step: 3
      action: "Deploy to staging environment"
      validation: "Integration tests pass"
    
    - step: 4
      action: "Run smoke tests in staging"
      tests:
        - "Analyze 5 public GitHub repos"
        - "Compare 3 branch pairs"
        - "Verify cache behavior"
    
    - step: 5
      action: "Deploy to production"
      validation: "Health checks pass"
    
    - step: 6
      action: "Monitor for 24 hours"
      metrics:
        - "API call success rate > 95%"
        - "Cache hit rate > 70%"
        - "No error spikes in logs"
  
  rollback_plan:
    trigger: "Test failure, API errors > 10%, performance degradation"
    steps:
      - "Revert to previous git commit"
      - "Restore previous configuration"
      - "Clear remote cache"
      - "Run validation tests"

# ============================================================================
# RISKS & MITIGATIONS
# ============================================================================

risks:
  - risk: "GitHub/GitLab API rate limits exhausted"
    severity: "MEDIUM"
    probability: "MEDIUM"
    mitigation: "Implement aggressive caching, respect rate limit headers, add retry with exponential backoff"
  
  - risk: "Large repository analysis timeout"
    severity: "MEDIUM"
    probability: "LOW"
    mitigation: "Add timeout configuration, implement streaming for large results"
  
  - risk: "Authentication token exposure"
    severity: "HIGH"
    probability: "LOW"
    mitigation: "Never log tokens, use secure config storage, audit all error messages"
  
  - risk: "Backward compatibility break"
    severity: "HIGH"
    probability: "LOW"
    mitigation: "Maintain 100% test pass rate, extensive integration testing"
  
  - risk: "Cache corruption or stale data"
    severity: "MEDIUM"
    probability: "MEDIUM"
    mitigation: "Implement cache validation, configurable TTL, manual cache clear command"

