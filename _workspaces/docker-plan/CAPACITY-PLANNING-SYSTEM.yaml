# ============================================================================
# APPENDIX
# ============================================================================

appendix:
  
  estimation_models_comparison:
    pert:
      pros:
        - "Simple formula, easy to understand"
        - "Accounts for uncertainty (3 estimates)"
        - "Industry standard"
      cons:
        - "Relies on human judgment for O/ML/P"
        - "No dependency analysis"
    
    story_points:
      pros:
        - "Velocity-based (grounded in actual performance)"
        - "Fibonacci scale prevents false precision"
        - "Team-specific calibration"
      cons:
        - "Requires historical data"
        - "Abstract units (not directly hours)"
    
    critical_path:
      pros:
        - "Identifies bottlenecks and parallelization"
        - "Realistic elapsed time calculation"
        - "Dependency-aware"
      cons:
        - "Complex to set up"
        - "Requires detailed task breakdown"
  
  brooks_law_analysis:
    summary: "Adding people to a late project makes it later"
    causes:
      - "Onboarding time for new team members"
      - "Communication overhead (n*(n-1)/2 channels)"
      - "Knowledge transfer burden on existing team"
      - "Increased coordination complexity"
    
    mitigation_strategies:
      - "Add people early in project lifecycle"
      - "Create independent workstreams (loose coupling)"
      - "Invest in documentation and tooling"
      - "Limit team size to 5-7 engineers per workstream"
  
  references:
    - title: "The Mythical Man-Month"
      author: "Frederick Brooks"
      year: 1975
      relevance: "Brooks' Law, team scaling limits"
    
    - title: "Software Estimation: Demystifying the Black Art"
      author: "Steve McConnell"
      year: 2006
      relevance: "PERT, confidence intervals, cone of uncertainty"
    
    - title: "Agile Estimating and Planning"
      author: "Mike Cohn"
      year: 2005
      relevance: "Story points, velocity tracking, release planning"
