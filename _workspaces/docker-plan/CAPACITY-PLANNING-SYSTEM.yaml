# ============================================================================
# CORTEX CAPACITY PLANNING & ESTIMATION SYSTEM
# ============================================================================
# Date: 2026-01-28
# Authority: CORTEX Master Orchestrator + ChallengeEngine + InteractionOrchestrator
# Status: APPROVED FOR IMPLEMENTATION
# Priority: P1-HIGH (Strategic capability for project planning and transparency)
#
# Architecture Metaphor: Project Management Intelligence
#   - Evidence Gathering: LENS + Git + Domain knowledge (objective data)
#   - Multi-Model Estimation: PERT + Story Points + Critical Path (consensus)
#   - Skill Stratification: Senior/Mid/Junior allocation (realistic distribution)
#   - Output Formatting: Sprint breakdown + parallel tracks (actionable plans)
#   - Historical Learning: Estimate vs actual tracking (self-improving accuracy)
#
# Strategic Context:
#   User Vision: SwagOrchestrator for time estimates (2-week sprints, senior engineers)
#   Challenge Response: CapacityOrchestrator with multi-model estimation (more accurate)
#   Architecture: Evidence-based, multi-model consensus, skill-stratified, self-learning
#   Impact: 80% confidence intervals, realistic parallelization, continuous accuracy improvement
#
# Key Principles:
#   - Extensibility: Plugin estimation models, custom velocity profiles, new data sources
#   - Scalability: Single feature to 50-engineer initiatives, incremental re-estimation
#   - Accuracy: Multi-model consensus, LENS complexity metrics, historical velocity grounding
#   - Efficiency: Inline chat by default, reuses existing LENS infrastructure, cached data
#   - Transparency: Confidence intervals, assumption documentation, CORTEX self-estimate
# ============================================================================

metadata:
  system_name: "Capacity Planning & Estimation System"
  subsystem: "Project Intelligence & Resource Allocation"
  date_created: "2026-01-28"
  architecture_version: "1.0"
  status: "APPROVED"
  priority: "P1-HIGH"
  blocking: false  # Enhances planning, doesn't block execution
  strategic: true  # Enables data-driven project scoping and resource allocation
  
  # Architectural layers
  capability_layers:
    evidence_collection: "Evidence Collection Layer (LENS, Git, Domain)"
    multi_model_estimation: "Multi-Model Estimation Engine (PERT, Story Points, CPM)"
    skill_stratification: "Skill Stratification & Allocation (Senior/Mid/Junior)"
    output_formatting: "Output Formatter & Visualizer (Sprint breakdown, parallel tracks)"
    historical_learning: "Historical Learning & Accuracy Tracking (Estimate vs actual)"
  
  # Delivery strategy
  delivery_strategy: "TDD_INCREMENTAL"
  stage_1: "Evidence Collection Layer (CAP-1)"
  stage_2: "Multi-Model Estimation Engine (CAP-2)"
  stage_3: "Skill Stratification & Allocation (CAP-3)"
  stage_4: "Output Formatter & Visualizer (CAP-4)"
  stage_5: "Historical Learning & Accuracy Tracking (CAP-5)"
  
  # Estimated effort
  total_hours: "44-60 hours"
  cap_1_hours: "8-12 hours"
  cap_2_hours: "12-16 hours"
  cap_3_hours: "8-10 hours"
  cap_4_hours: "6-8 hours"
  cap_5_hours: "10-14 hours"
  
  # Team capacity estimates (realistic parallelization)
  parallelization:
    min_team_size: 2  # Senior engineers
    max_team_size: 3  # Before negative impacts (Brooks' Law)
    parallel_tracks: 3  # CAP-1+CAP-2, CAP-3, CAP-4+CAP-5
    critical_path: "CAP-1 → CAP-2 (20-28h)"
    elapsed_time: "3-4 weeks"
  
  # CORTEX self-estimate (AI velocity advantage)
  cortex_self_estimate:
    min_hours: 18
    max_hours: 24
    acceleration_factor: "2.5x (LENS-powered complexity analysis)"
    confidence: "85%"
  
  # Strategic alignment (Challenge-validated)
  strategic_goals:
    extensibility:
      rating: "★★★★★"
      rationale: "Plugin estimation models, custom velocity profiles, Jira/GitHub API integration"
    scalability:
      rating: "★★★★★"
      rationale: "1-person to 50-engineer projects, incremental re-estimation, cached historical data"
    accuracy:
      rating: "★★★★★"
      rationale: "Multi-model consensus, LENS objective metrics, historical velocity grounding"
    efficiency:
      rating: "★★★★★"
      rationale: "Reuses existing LENS, inline chat output, incremental updates"
    transparency:
      rating: "★★★★★"
      rationale: "Confidence intervals, assumption docs, CORTEX self-estimate for comparison"

# ============================================================================
# PHASE STRUCTURE
# ============================================================================

phases:
  
  # --------------------------------------------------------------------------
  # CAP-1: Evidence Collection Layer (8-12 hours)
  # --------------------------------------------------------------------------
  cap_1_evidence_collection:
    name: "Evidence Collection Layer"
    priority: "P0-CRITICAL"
    status: "PLANNED"
    estimated_hours: "8-12"
    dependencies: ["LENS-003"]  # Requires LENSOrchestrator from Phase 7.1
    blocking: false
    
    objectives:
      - "Integrate LENS intelligence for complexity scoring"
      - "Analyze Git history for actual velocity patterns"
      - "Query domain knowledge for estimation patterns"
      - "Cache evidence for fast re-estimation"
    
    deliverables:
      - file: "cortex/orchestrators/capacity/evidence_collector.py"
        description: "Evidence collection orchestrator"
        tests: "tests/orchestrators/capacity/test_evidence_collector.py"
        loc: 250
      
      - file: "cortex/brain/analysis/velocity_analyzer.py"
        description: "Git history velocity analyzer"
        tests: "tests/brain/analysis/test_velocity_analyzer.py"
        loc: 180
      
      - file: "cortex/domain_brain/estimation_patterns.py"
        description: "Domain knowledge for estimation patterns"
        tests: "tests/domain_brain/test_estimation_patterns.py"
        loc: 120
      
      - file: "cortex/brain/core/evidence_cache.py"
        description: "Evidence caching for performance"
        tests: "tests/brain/core/test_evidence_cache.py"
        loc: 100
    
    technical_approach:
      lens_integration:
        - "Call LENSOrchestrator.analyze_file() for complexity scores"
        - "AST analysis: Function count, cyclomatic complexity, nesting depth"
        - "Git analysis: Historical velocity, commit frequency, author patterns"
        - "Comment analysis: TODO/FIXME density as complexity indicator"
      
      velocity_analysis:
        - "Parse Git history for completed phases/features"
        - "Calculate actual hours from commit timestamps"
        - "Identify velocity patterns by task type (feature, refactor, fix)"
        - "Build velocity profiles (CORTEX, senior engineer, team)"
      
      domain_patterns:
        - "Query Tier3 knowledge base for estimation rules"
        - "Example: 'API integration = 8-12h senior engineer'"
        - "Example: 'TDD overhead = 1.3-1.5x naive estimate'"
        - "Example: 'Refactoring = 0.6-0.8x greenfield'"
      
      caching_strategy:
        - "Cache LENS results per file (invalidate on file change)"
        - "Cache Git velocity data per repository"
        - "Cache domain patterns per knowledge base version"
        - "TTL: 1 hour for Git data, 24 hours for domain patterns"
    
    acceptance_criteria:
      - id: "AC-CAP-1-01"
        description: "Evidence collector integrates with LENSOrchestrator"
        verification: "Unit test calls analyze_file() and receives complexity scores"
      
      - id: "AC-CAP-1-02"
        description: "Velocity analyzer parses Git history correctly"
        verification: "Integration test calculates velocity from test repository"
      
      - id: "AC-CAP-1-03"
        description: "Domain patterns return estimation rules by task type"
        verification: "Unit test queries 'API integration' and gets 8-12h range"
      
      - id: "AC-CAP-1-04"
        description: "Evidence cache reduces LENS calls by 80%+"
        verification: "Performance test shows <20% cache miss rate"
      
      - id: "AC-CAP-1-05"
        description: "Evidence collector handles missing data gracefully"
        verification: "Unit test with no Git history returns conservative defaults"
    
    governance_compliance:
      - rule: "CORE-008"
        description: "TDD - tests before implementation"
      - rule: "CORE-011"
        description: "Type hints on all functions"
      - rule: "CORE-012"
        description: "Google-style docstrings"
      - rule: "CORE-027"
        description: "Audit trail logging (AC_START → AC_COMPLETE)"
      - rule: "CORE-030"
        description: "Implementation Truth - verify evidence accuracy"
  
  # --------------------------------------------------------------------------
  # CAP-2: Multi-Model Estimation Engine (12-16 hours)
  # --------------------------------------------------------------------------
  cap_2_multi_model_estimation:
    name: "Multi-Model Estimation Engine"
    priority: "P0-CRITICAL"
    status: "PLANNED"
    estimated_hours: "12-16"
    dependencies: ["CAP-1"]
    blocking: false
    
    objectives:
      - "Implement PERT 3-point estimation (Optimistic/Most Likely/Pessimistic)"
      - "Implement Story Points with velocity-based conversion"
      - "Implement Critical Path Method for dependency analysis"
      - "Generate multi-model consensus estimate with confidence interval"
    
    deliverables:
      - file: "cortex/orchestrators/capacity/estimation_engine.py"
        description: "Multi-model estimation orchestrator"
        tests: "tests/orchestrators/capacity/test_estimation_engine.py"
        loc: 300
      
      - file: "cortex/brain/estimation/pert_estimator.py"
        description: "PERT 3-point estimation model"
        tests: "tests/brain/estimation/test_pert_estimator.py"
        loc: 150
      
      - file: "cortex/brain/estimation/story_point_estimator.py"
        description: "Story Points with velocity conversion"
        tests: "tests/brain/estimation/test_story_point_estimator.py"
        loc: 180
      
      - file: "cortex/brain/estimation/critical_path_analyzer.py"
        description: "Critical Path Method (CPM) for dependencies"
        tests: "tests/brain/estimation/test_critical_path_analyzer.py"
        loc: 220
      
      - file: "cortex/brain/estimation/consensus_builder.py"
        description: "Multi-model consensus with confidence intervals"
        tests: "tests/brain/estimation/test_consensus_builder.py"
        loc: 160
    
    technical_approach:
      pert_estimation:
        formula: "(Optimistic + 4*MostLikely + Pessimistic) / 6"
        inputs:
          - "Optimistic: Best-case (no blockers, ideal complexity)"
          - "Most Likely: Historical average for similar tasks"
          - "Pessimistic: Worst-case (blockers, unknown complexity)"
        output: "Expected hours with standard deviation"
      
      story_points:
        complexity_scoring:
          - "1 point: Trivial (config change, typo fix)"
          - "2 points: Simple (small function, straightforward logic)"
          - "3 points: Medium (API endpoint, standard feature)"
          - "5 points: Complex (algorithm, multi-file refactor)"
          - "8 points: Very Complex (architectural change, cross-cutting)"
          - "13 points: Epic (should be split into smaller tasks)"
        velocity_conversion:
          - "Senior engineer: 1 point = 2-3 hours"
          - "Mid-level engineer: 1 point = 4-5 hours"
          - "Junior engineer: 1 point = 6-8 hours"
          - "CORTEX: 1 point = 1-1.5 hours (LENS acceleration)"
      
      critical_path_method:
        dependency_types:
          - "Sequential: Task B requires Task A completion"
          - "Parallel: Task B and C can run simultaneously"
          - "Blocking: Task D waits for external dependency"
        parallelization_logic:
          - "Identify independent task clusters"
          - "Calculate maximum parallelization (Brooks' Law limit)"
          - "Determine critical path (longest dependency chain)"
          - "Compute elapsed time vs cumulative effort"
      
      consensus_building:
        - "Collect estimates from all 3 models"
        - "Calculate weighted average (PERT: 40%, Story Points: 40%, CPM: 20%)"
        - "Generate 80% confidence interval (±20% variance)"
        - "Flag high-variance estimates for review (>30% spread)"
    
    acceptance_criteria:
      - id: "AC-CAP-2-01"
        description: "PERT estimator calculates expected hours correctly"
        verification: "Unit test with O=8, ML=12, P=20 returns ~12.67 hours"
      
      - id: "AC-CAP-2-02"
        description: "Story point estimator converts to hours by skill level"
        verification: "Unit test with 5 points, senior → 10-15 hours"
      
      - id: "AC-CAP-2-03"
        description: "Critical path analyzer identifies parallelization"
        verification: "Unit test with 4 sequential tasks shows critical path"
      
      - id: "AC-CAP-2-04"
        description: "Consensus builder generates confidence intervals"
        verification: "Unit test shows 80% confidence = ±20% variance"
      
      - id: "AC-CAP-2-05"
        description: "Estimation engine flags high-variance estimates"
        verification: "Unit test with >30% spread triggers review flag"
    
    governance_compliance:
      - rule: "CORE-008"
        description: "TDD - tests before implementation"
      - rule: "CORE-011"
        description: "Type hints on all estimation functions"
      - rule: "CORE-012"
        description: "Docstrings explain estimation formulas"
      - rule: "CORE-030"
        description: "Verify estimation model accuracy against historical data"
  
  # --------------------------------------------------------------------------
  # CAP-3: Skill Stratification & Allocation (8-10 hours)
  # --------------------------------------------------------------------------
  cap_3_skill_stratification:
    name: "Skill Stratification & Allocation"
    priority: "P0-CRITICAL"
    status: "PLANNED"
    estimated_hours: "8-10"
    dependencies: ["CAP-2"]
    blocking: false
    
    objectives:
      - "Classify tasks by complexity and required skill level"
      - "Allocate tasks to Senior/Mid/Junior engineers realistically"
      - "Calculate team composition for optimal velocity"
      - "Enforce Brooks' Law limits on parallelization"
    
    deliverables:
      - file: "cortex/orchestrators/capacity/skill_allocator.py"
        description: "Skill stratification orchestrator"
        tests: "tests/orchestrators/capacity/test_skill_allocator.py"
        loc: 200
      
      - file: "cortex/brain/estimation/task_classifier.py"
        description: "Task complexity classifier (Senior/Mid/Junior)"
        tests: "tests/brain/estimation/test_task_classifier.py"
        loc: 180
      
      - file: "cortex/brain/estimation/team_optimizer.py"
        description: "Team composition optimizer"
        tests: "tests/brain/estimation/test_team_optimizer.py"
        loc: 150
      
      - file: "cortex/brain/estimation/brooks_law_limiter.py"
        description: "Parallelization limit enforcer (Brooks' Law)"
        tests: "tests/brain/estimation/test_brooks_law_limiter.py"
        loc: 120
    
    technical_approach:
      task_classification:
        senior_level_tasks:
          - "Architecture design and system design reviews"
          - "Complex algorithms (graph traversal, optimization)"
          - "Security implementation (authentication, encryption)"
          - "Performance tuning and profiling"
          - "Cross-cutting concerns (logging, caching, transactions)"
        
        mid_level_tasks:
          - "Standard feature implementation (CRUD, APIs)"
          - "Integration work (third-party APIs, databases)"
          - "Refactoring (within module boundaries)"
          - "Bug fixes (non-critical path)"
          - "Code reviews and mentoring juniors"
        
        junior_level_tasks:
          - "Test writing (unit, integration)"
          - "Documentation (docstrings, README updates)"
          - "Simple CRUD endpoints"
          - "Configuration changes"
          - "CSS/HTML updates"
      
      team_composition:
        realistic_distribution:
          - "30% Senior engineers (architecture, complex work)"
          - "50% Mid-level engineers (bulk feature work)"
          - "20% Junior engineers (tests, docs, simple features)"
        
        minimum_viable_team:
          - "1 senior (architecture, code reviews)"
          - "2 mid-level (feature implementation)"
          - "1 junior (testing, documentation)"
        
        scaling_limits:
          - "< 5 engineers: Linear velocity scaling"
          - "5-10 engineers: Communication overhead 20%"
          - "10-15 engineers: Communication overhead 40%"
          - "> 15 engineers: Brooks' Law (adding people slows down)"
      
      brooks_law_enforcement:
        - "Flag projects with >15 engineers as 'at risk'"
        - "Recommend splitting into independent workstreams"
        - "Calculate communication overhead (n*(n-1)/2 channels)"
        - "Suggest architectural changes for better parallelization"
    
    acceptance_criteria:
      - id: "AC-CAP-3-01"
        description: "Task classifier categorizes by skill level"
        verification: "Unit test: 'architecture design' → Senior"
      
      - id: "AC-CAP-3-02"
        description: "Team optimizer suggests realistic composition"
        verification: "Unit test: 100h project → 1 senior, 2 mid, 1 junior"
      
      - id: "AC-CAP-3-03"
        description: "Brooks' Law limiter flags large teams"
        verification: "Unit test: 20 engineers → 'at risk' warning"
      
      - id: "AC-CAP-3-04"
        description: "Skill allocator redistributes work when overloaded"
        verification: "Unit test: 80% senior work → suggest hiring"
      
      - id: "AC-CAP-3-05"
        description: "Allocation respects minimum viable team size"
        verification: "Unit test: 40h project → 1-2 engineers, not 0.5"
    
    governance_compliance:
      - rule: "CORE-008"
        description: "TDD - tests before implementation"
      - rule: "CORE-011"
        description: "Type hints on allocation functions"
      - rule: "CORE-012"
        description: "Docstrings explain skill classifications"
      - rule: "CORE-030"
        description: "Verify allocation accuracy against past projects"
  
  # --------------------------------------------------------------------------
  # CAP-4: Output Formatter & Visualizer (6-8 hours)
  # --------------------------------------------------------------------------
  cap_4_output_formatting:
    name: "Output Formatter & Visualizer"
    priority: "P1-HIGH"
    status: "PLANNED"
    estimated_hours: "6-8"
    dependencies: ["CAP-3"]
    blocking: false
    
    objectives:
      - "Format estimates as sprint breakdown (2-week cycles)"
      - "Visualize parallel tracks (Gantt-style markdown)"
      - "Display confidence intervals clearly"
      - "Show CORTEX self-estimate for comparison"
    
    deliverables:
      - file: "cortex/orchestrators/capacity/output_formatter.py"
        description: "Output formatting orchestrator"
        tests: "tests/orchestrators/capacity/test_output_formatter.py"
        loc: 220
      
      - file: "cortex/brain/visualization/sprint_breakdown.py"
        description: "Sprint breakdown renderer"
        tests: "tests/brain/visualization/test_sprint_breakdown.py"
        loc: 150
      
      - file: "cortex/brain/visualization/gantt_visualizer.py"
        description: "Gantt-style markdown visualizer"
        tests: "tests/brain/visualization/test_gantt_visualizer.py"
        loc: 180
      
      - file: "cortex/brain/visualization/confidence_display.py"
        description: "Confidence interval display formatter"
        tests: "tests/brain/visualization/test_confidence_display.py"
        loc: 100
    
    technical_approach:
      sprint_breakdown:
        format: |
          ## 📊 Sprint Breakdown (2-week cycles)
          
          ### Sprint 1 (Weeks 1-2)
          | Track | Task | Engineer Level | Hours | Status |
          |-------|------|----------------|-------|--------|
          | A     | Architecture | Senior | 16h | Critical Path |
          | B     | API Endpoints | Mid | 24h | Parallel |
          | C     | Tests | Junior | 16h | Parallel |
          
          **Sprint 1 Total:** 56h cumulative, 24h elapsed (3 engineers)
          **Confidence:** 🟢 High (±15%)
      
      gantt_visualization:
        format: |
          ## 📅 Parallel Track Timeline
          
          ```
          Track A (Senior):  [████████████████] Architecture (16h)
                              └──→ [████████] Review (8h)
          
          Track B (Mid):     [████████████████████] API Work (24h)
          
          Track C (Junior):  [████████████] Tests (16h)
          ```
          
          **Critical Path:** Track A → Total 24h elapsed
          **Parallelization:** 3 tracks, 2.3x speedup
      
      confidence_display:
        format: |
          ## 🎯 Confidence Analysis
          
          | Model | Estimate | Weight | Contribution |
          |-------|----------|--------|--------------|
          | PERT  | 58h | 40% | 23.2h |
          | Story Points | 60h | 40% | 24.0h |
          | Critical Path | 52h | 20% | 10.4h |
          
          **Consensus Estimate:** 57.6h
          **80% Confidence Interval:** 46-69h (±20%)
          **High Variance Warning:** ❌ None (spread: 15%)
      
      cortex_self_estimate:
        format: |
          ## 🤖 CORTEX Self-Estimate
          
          **Human Estimate:** 57.6h (senior engineer)
          **CORTEX Estimate:** 23h (AI velocity)
          **Acceleration Factor:** 2.5x (LENS-powered analysis)
          **Confidence:** 85%
          
          **Rationale:**
          - LENS provides instant complexity analysis (vs manual review)
          - Pre-existing test patterns reduce TDD overhead
          - Automated refactoring tools accelerate code generation
          - No context switching or meeting overhead
    
    acceptance_criteria:
      - id: "AC-CAP-4-01"
        description: "Sprint breakdown renders 2-week cycles correctly"
        verification: "Unit test: 100h project → 3-4 sprints displayed"
      
      - id: "AC-CAP-4-02"
        description: "Gantt visualizer shows parallel tracks"
        verification: "Unit test: 3 parallel tasks → ASCII timeline"
      
      - id: "AC-CAP-4-03"
        description: "Confidence display shows model contributions"
        verification: "Unit test: 3 models → weighted average table"
      
      - id: "AC-CAP-4-04"
        description: "CORTEX self-estimate shows acceleration factor"
        verification: "Unit test: 60h human → 24h CORTEX (2.5x)"
      
      - id: "AC-CAP-4-05"
        description: "Output is inline chat (no file generation)"
        verification: "Integration test: no .md files created"
    
    governance_compliance:
      - rule: "CORE-002"
        description: "No markdown file generation (inline chat only)"
      - rule: "CORE-008"
        description: "TDD - tests before formatting logic"
      - rule: "CORE-011"
        description: "Type hints on formatting functions"
      - rule: "CORE-012"
        description: "Docstrings explain output formats"
  
  # --------------------------------------------------------------------------
  # CAP-5: Historical Learning & Accuracy Tracking (10-14 hours)
  # --------------------------------------------------------------------------
  cap_5_historical_learning:
    name: "Historical Learning & Accuracy Tracking"
    priority: "P1-HIGH"
    status: "PLANNED"
    estimated_hours: "10-14"
    dependencies: ["CAP-1", "CAP-2", "CAP-3", "CAP-4"]
    blocking: false
    
    objectives:
      - "Track estimate vs actual hours for completed projects"
      - "Adjust velocity profiles based on actual performance"
      - "Improve estimation model weights over time"
      - "Generate accuracy improvement reports"
    
    deliverables:
      - file: "cortex/orchestrators/capacity/learning_orchestrator.py"
        description: "Historical learning orchestrator"
        tests: "tests/orchestrators/capacity/test_learning_orchestrator.py"
        loc: 200
      
      - file: "cortex/brain/estimation/estimate_tracker.py"
        description: "Estimate vs actual tracker"
        tests: "tests/brain/estimation/test_estimate_tracker.py"
        loc: 180
      
      - file: "cortex/brain/estimation/velocity_adjuster.py"
        description: "Velocity profile adjuster"
        tests: "tests/brain/estimation/test_velocity_adjuster.py"
        loc: 150
      
      - file: "cortex/brain/estimation/model_weight_tuner.py"
        description: "Estimation model weight tuner"
        tests: "tests/brain/estimation/test_model_weight_tuner.py"
        loc: 160
      
      - file: "cortex/brain/estimation/accuracy_reporter.py"
        description: "Accuracy improvement reporter"
        tests: "tests/brain/estimation/test_accuracy_reporter.py"
        loc: 120
    
    technical_approach:
      estimate_tracking:
        - "Store estimates in audit trail (AC-ID: CAP-ESTIMATE-{id})"
        - "Capture actual hours from Git commit timestamps"
        - "Calculate variance: (Actual - Estimate) / Estimate"
        - "Flag high-variance projects for retrospective analysis"
      
      velocity_adjustment:
        initial_profiles:
          - "Senior engineer: 40h/week coding (60% focus time)"
          - "Mid-level engineer: 35h/week coding (55% focus time)"
          - "Junior engineer: 30h/week coding (50% focus time)"
          - "CORTEX: 168h/week (100% focus, no meetings)"
        
        adjustment_algorithm:
          - "After 5 projects: Adjust velocity by ±10%"
          - "After 10 projects: Adjust velocity by ±20%"
          - "After 20 projects: Adjust velocity by ±30%"
          - "Example: Senior engineer consistently 20% faster → 48h/week"
      
      model_weight_tuning:
        initial_weights:
          - "PERT: 40% (broad industry standard)"
          - "Story Points: 40% (CORTEX-specific velocity)"
          - "Critical Path: 20% (dependency analysis)"
        
        tuning_strategy:
          - "Measure MAPE (Mean Absolute Percentage Error) per model"
          - "Redistribute weights to favor lower-MAPE models"
          - "Example: PERT consistently high → reduce to 30%, increase Story Points to 50%"
      
      accuracy_reporting:
        metrics:
          - "Overall MAPE: Mean Absolute Percentage Error across all projects"
          - "Confidence calibration: % of actuals within 80% confidence interval"
          - "Bias detection: Systematic over-estimation or under-estimation"
          - "Accuracy trend: Improvement over time (last 5, 10, 20 projects)"
        
        report_format: |
          ## 📈 Capacity Estimation Accuracy Report
          
          **Period:** Last 20 projects (6 months)
          **Overall MAPE:** 18% (Target: <20%)
          **Confidence Calibration:** 82% (Target: 80%)
          **Bias:** -5% (slight under-estimation)
          
          ### Model Performance
          | Model | MAPE | Weight |
          |-------|------|--------|
          | PERT | 22% | 35% ↓ |
          | Story Points | 15% | 45% ↑ |
          | Critical Path | 20% | 20% → |
          
          ### Accuracy Improvement Trend
          - Projects 1-5: 25% MAPE
          - Projects 6-10: 22% MAPE (↑12% improvement)
          - Projects 11-15: 19% MAPE (↑14% improvement)
          - Projects 16-20: 18% MAPE (↑5% improvement)
          
          **Status:** 🟢 Meeting target, continuous improvement
    
    acceptance_criteria:
      - id: "AC-CAP-5-01"
        description: "Estimate tracker captures actual hours from Git"
        verification: "Integration test: completed project → variance calculated"
      
      - id: "AC-CAP-5-02"
        description: "Velocity adjuster updates profiles after 5 projects"
        verification: "Unit test: 5 projects, 20% faster → 48h/week velocity"
      
      - id: "AC-CAP-5-03"
        description: "Model weight tuner redistributes weights based on MAPE"
        verification: "Unit test: Story Points 15% MAPE → weight increases"
      
      - id: "AC-CAP-5-04"
        description: "Accuracy reporter shows improvement trend"
        verification: "Unit test: 20 projects → MAPE decreases over time"
      
      - id: "AC-CAP-5-05"
        description: "Learning system handles missing actual data gracefully"
        verification: "Unit test: incomplete project → skip without error"
    
    governance_compliance:
      - rule: "CORE-008"
        description: "TDD - tests before learning logic"
      - rule: "CORE-011"
        description: "Type hints on tracking functions"
      - rule: "CORE-012"
        description: "Docstrings explain learning algorithms"
      - rule: "CORE-027"
        description: "Audit trail for all estimates (AC-ID: CAP-ESTIMATE-*)"
      - rule: "CORE-030"
        description: "Verify actual hours from Git, not manual entry"

# ============================================================================
# INTEGRATION WITH EXISTING CORTEX SYSTEMS
# ============================================================================

integration:
  
  # IntentRouter enhancement for capacity estimation intent
  intent_router:
    new_intent_type: "CAPACITY_ESTIMATE"
    trigger_keywords:
      - "estimate"
      - "how long"
      - "time required"
      - "sprint planning"
      - "capacity planning"
      - "swag"
      - "effort"
    
    routing_logic: |
      if intent contains ["estimate", "how long", "time required"]:
          if scope is FILE or MODULE:
              return CapacityOrchestrator.estimate_feature()
          elif scope is PHASE:
              return CapacityOrchestrator.estimate_phase()
          elif scope is PROJECT:
              return CapacityOrchestrator.estimate_project()
    
    confidence_boosting:
      - "LENS context available: +0.15 confidence"
      - "Git history available: +0.10 confidence"
      - "Domain patterns available: +0.10 confidence"
  
  # MCP Tools for capacity estimation
  mcp_tools:
    - name: "estimate_feature"
      description: "Estimate effort for a specific feature or module"
      parameters:
        - "feature_name: str"
        - "scope: FILE | MODULE | SYSTEM"
        - "skill_level: SENIOR | MID | JUNIOR | AUTO"
      returns: "Capacity estimate with sprint breakdown"
    
    - name: "estimate_phase"
      description: "Estimate effort for an entire phase (multiple features)"
      parameters:
        - "phase_id: str"
        - "team_size: int (optional)"
        - "parallel_tracks: bool (default: True)"
      returns: "Phase estimate with parallelization analysis"
    
    - name: "compare_estimates"
      description: "Compare human estimate vs CORTEX self-estimate"
      parameters:
        - "task_description: str"
        - "human_estimate: float (hours, optional)"
      returns: "Side-by-side comparison with acceleration factor"
    
    - name: "accuracy_report"
      description: "Generate accuracy improvement report"
      parameters:
        - "period: str (last_5 | last_10 | last_20 | all)"
      returns: "MAPE, confidence calibration, model performance"
  
  # LENS integration (reuse existing infrastructure)
  lens_integration:
    - analyzer: "ASTAnalyzer"
      usage: "Complexity scoring (function count, nesting depth)"
    
    - analyzer: "GitHistoryAnalyzer"
      usage: "Velocity analysis (commit patterns, historical hours)"
    
    - analyzer: "CommentExtractor"
      usage: "TODO/FIXME density as complexity indicator"
  
  # Governance enforcement
  governance_hooks:
    - trigger: "Before estimate generation"
      check: "Verify LENS data available (CORE-030)"
    
    - trigger: "After estimate complete"
      check: "Log estimate to audit trail (CORE-027)"
    
    - trigger: "On estimate variance >30%"
      check: "Escalate for review (TIER-1)"

# ============================================================================
# PRODUCTION READINESS CRITERIA
# ============================================================================

production_readiness:
  
  health_endpoints:
    - path: "/health/capacity-estimation"
      checks:
        - "Evidence collector responsive"
        - "Estimation engine available"
        - "Historical data cache accessible"
      response: "healthy | degraded | unhealthy"
  
  metrics:
    - name: "cortex_capacity_estimate_requests_total"
      type: "counter"
      description: "Total capacity estimation requests"
    
    - name: "cortex_capacity_estimate_duration_seconds"
      type: "histogram"
      description: "Time to generate estimate"
      buckets: [0.5, 1.0, 2.0, 5.0, 10.0]
    
    - name: "cortex_capacity_estimation_accuracy_mape"
      type: "gauge"
      description: "Mean Absolute Percentage Error (last 20 projects)"
    
    - name: "cortex_capacity_confidence_calibration_ratio"
      type: "gauge"
      description: "% of actuals within 80% confidence interval"
  
  documentation:
    user_guide: "docs/11-capacity-planning/user-guide.md"
    api_reference: "docs/06-api-reference/capacity-orchestrator.md"
    estimation_models: "docs/11-capacity-planning/estimation-models.md"
    accuracy_tracking: "docs/11-capacity-planning/accuracy-tracking.md"
  
  test_coverage:
    target: "95%"
    critical_paths:
      - "Evidence collection from LENS"
      - "Multi-model consensus building"
      - "Skill stratification logic"
      - "Historical learning algorithm"
  
  performance_targets:
    estimate_generation: "< 2s for single feature"
    estimate_phase: "< 10s for full phase"
    cache_hit_rate: "> 80% for repeated estimates"
    accuracy_improvement: "> 10% after 10 projects"

# ============================================================================
# DEPLOYMENT STRATEGY
# ============================================================================

deployment:
  
  stage_1_development:
    - "Implement CAP-1 through CAP-5 with TDD"
    - "Wire CapacityOrchestrator to IntentRouter"
    - "Create MCP tools for estimate_feature, estimate_phase"
    - "Test with historical CORTEX phases (7.1, 7.2, 7.5)"
  
  stage_2_alpha:
    - "Deploy to internal CORTEX development (1 team)"
    - "Collect first 5 estimates vs actuals"
    - "Adjust velocity profiles based on feedback"
    - "Refine output formatting for clarity"
  
  stage_3_beta:
    - "Deploy to 2-3 teams (expand usage)"
    - "Monitor accuracy metrics (target MAPE <20%)"
    - "Tune model weights based on performance"
    - "Add documentation and training materials"
  
  stage_4_production:
    - "Deploy to all teams"
    - "Enable accuracy tracking and historical learning"
    - "Generate monthly accuracy reports"
    - "Continuous improvement (model tuning, velocity adjustments)"
  
  rollback_plan:
    - "If MAPE > 30% after 10 projects: Revert to manual estimation"
    - "If performance < 2s for estimates: Investigate cache issues"
    - "If user confusion: Simplify output formatting, add tooltips"

# ============================================================================
# SUCCESS METRICS
# ============================================================================

success_metrics:
  
  accuracy_metrics:
    - metric: "Mean Absolute Percentage Error (MAPE)"
      target: "< 20%"
      rationale: "Industry standard for estimation accuracy"
    
    - metric: "Confidence Calibration"
      target: "> 80%"
      rationale: "Actuals within 80% confidence interval"
    
    - metric: "Bias Detection"
      target: "< ±10%"
      rationale: "No systematic over/under-estimation"
  
  adoption_metrics:
    - metric: "Estimation Requests per Week"
      target: "> 50"
      rationale: "High usage indicates value to teams"
    
    - metric: "User Satisfaction Score"
      target: "> 4.0 / 5.0"
      rationale: "Teams find estimates helpful and accurate"
  
  efficiency_metrics:
    - metric: "Estimate Generation Time"
      target: "< 2s per feature"
      rationale: "Fast enough for interactive planning"
    
    - metric: "Cache Hit Rate"
      target: "> 80%"
      rationale: "Evidence reuse reduces LENS overhead"
  
  improvement_metrics:
    - metric: "Accuracy Improvement (10 projects)"
      target: "> 10%"
      rationale: "Self-learning system improves over time"
    
    - metric: "Model Weight Convergence"
      target: "< ±5% change after 20 projects"
      rationale: "Weights stabilize to optimal distribution"

# ============================================================================
# FUTURE ENHANCEMENTS (Post-MVP)
# ============================================================================

future_enhancements:
  
