# =========================================================================
# PHASE 8.3B - CONSOLIDATION MIGRATION LAYER
# =========================================================================
# Authority: CORTEX Consolidation Architecture (3-Phase Sequential)
# Date: 2026-01-31
# Status: PLANNED
# Dependencies: Phase 8.3A (Foundation Layer COMPLETE)
# Downstream: Phase 8.3C (Cleanup Layer)
#
# Purpose:
#   Build adapters, shims, and migration infrastructure to consolidate
#   duplications WITHOUT breaking existing code. This phase establishes
#   backward compatibility during transition to single canonical implementations.
#   
# Philosophy:
#   "Refactor by adding layers, not by deleting code"
#   - Create adapter pattern wrappers
#   - Build shim layer for deprecated implementations
#   - Run dual-path tests (old vs new side-by-side)
#   - Gradual migration (module by module)
#   - Full rollback capability if issues discovered
#
# Risk Profile: 🟡 MEDIUM (Additive changes, but affects core systems)
# =========================================================================

phase:
  id: "PHASE-8.3B"
  name: "Consolidation Migration Layer"
  version: "1.0"
  authority: "CORTEX Consolidation Architecture"
  status: "PLANNED"
  scheduled_start: "2026-02-10"
  scheduled_end: "2026-02-21"
  duration_days: 10
  owner: "Asif Hussain"
  
# =========================================================================
# ACCEPTANCE CRITERIA
# =========================================================================
acceptance_criteria:
  
  AC-8.3B-001: "BaseRegistry[T] Generic Base Class Implemented"
    description: "Generic registry base class that all 15 registries inherit from"
    status: "NOT_MET"
    validation: |
      - BaseRegistry exists at cortex/core/registry/base_registry.py
      - Implements: __init__, register, get, list, delete, clear
      - Thread-safe singleton pattern (RLock)
      - Generic type T for type safety
      - Health check protocol for registry state
      - 100% unit test coverage (20 tests)
      - All 15 registries migrated to inherit from BaseRegistry
      - Zero behavioral changes from original implementations
    test_file: "tests/unit/core/registry/test_base_registry.py"
    
  AC-8.3B-002: "ExecutionContextAdapter Bridges All 6 Formats"
    description: "Adapter pattern that converts between 6 ExecutionContext variants"
    status: "NOT_MET"
    validation: |
      - ExecutionContextAdapter at cortex/core/adapters/execution_context_adapter.py
      - Converts OrchestrationContext ↔ ExecutionContext (all 6 variants)
      - Preserves all field data during conversion
      - Idempotent conversions (A→B→A = A)
      - Type hints for all conversions
      - 100% unit test coverage (30 tests)
      - Integration tests verify no data loss (15 tests)
      - Zero behavioral changes to existing code
    test_file: "tests/unit/core/adapters/test_execution_context_adapter.py"
    
  AC-8.3B-003: "Wiring Shim Layer for Legacy Systems"
    description: "Compatibility layer for 3 legacy wiring systems"
    status: "NOT_MET"
    validation: |
      - WiringShim at cortex/wiring/legacy_shim.py
      - Detects old wiring system calls
      - Redirects to Git-backed YAML system
      - Logs all legacy usage for migration tracking
      - 100% backward compatible (no breaking changes)
      - All 23 orchestrators loadable via legacy API
      - 20 unit tests verifying shim behavior
      - 10 integration tests with real wiring scenarios
    test_file: "tests/unit/wiring/test_legacy_shim.py"
    
  AC-8.3B-004: "ConsolidatedOrchestratorBase Wrapper"
    description: "Unified base class that accepts OrchestratorBase or experimental BaseOrchestrator"
    status: "NOT_MET"
    validation: |
      - ConsolidatedOrchestratorBase at cortex/orchestrators/consolidated_base.py
      - Wraps canonical OrchestratorBase
      - Accepts legacy BaseOrchestrator subclasses
      - Provides unified lifecycle interface
      - Graceful degradation for experimental orchestrators
      - 100% backward compatible
      - 15 unit tests
      - 10 integration tests with real orchestrators
    test_file: "tests/unit/orchestrators/test_consolidated_base.py"
    
  AC-8.3B-005: "Dual-Path Testing Framework"
    description: "Test infrastructure that runs old vs new implementations side-by-side"
    status: "NOT_MET"
    validation: |
      - DualPathTestBase at tests/framework/dual_path_testing.py
      - Supports @dual_path decorator for test methods
      - Runs test with old implementation (original code)
      - Runs test with new implementation (adapter layer)
      - Compares results for equivalence
      - Reports discrepancies with detailed diffs
      - 50+ tests using dual-path framework
      - All dual-path tests passing with 100% equivalence
    test_file: "tests/framework/test_dual_path_testing.py"
    
  AC-8.3B-006: "Migration Tracking Dashboard"
    description: "Real-time visibility into migration progress per registry"
    status: "NOT_MET"
    validation: |
      - Dashboard at cortex-lens/migration-progress-dashboard.html
      - Shows 15 registries with migration status
      - Tracks percentage of imports via new BaseRegistry
      - Tracks percentage of calls via adapter layers
      - Shows estimated completion date per registry
      - Identifies blockers and rollback risk
      - Updates daily as code is migrated
    test_file: "tests/integration/test_migration_dashboard.py"
    
  AC-8.3B-007: "All Existing Tests Pass"
    description: "No regressions from migration layer changes"
    status: "NOT_MET"
    validation: |
      - All 172+ existing tests pass with migration layer
      - 50+ new dual-path tests pass
      - No performance regression (< 5% slower)
      - No memory overhead (< 2MB additional)
      - All orchestrators loadable and executable
      - All registries functional
      - Zero breaking changes to public APIs
    test_file: "N/A (regression validation)"
    
# =========================================================================
# DELIVERABLES
# =========================================================================
deliverables:

  D1: "BaseRegistry[T] Generic Base Class"
    type: "Python Module"
    location: "cortex/core/registry/base_registry.py"
    description: "Generic registry base class with standard interface"
    owner: "Asif Hussain"
    methods:
      - "__init__(self, name: str)"
      - "register(self, key: str, value: T) -> None"
      - "get(self, key: str) -> Optional[T]"
      - "list(self) -> List[Tuple[str, T]]"
      - "delete(self, key: str) -> bool"
      - "clear(self) -> None"
      - "health_check(self) -> HealthCheckResult"
    test_coverage: "100%"
    
  D2: "ExecutionContextAdapter"
    type: "Python Module"
    location: "cortex/core/adapters/execution_context_adapter.py"
    description: "Adapter pattern for all 6 ExecutionContext formats"
    owner: "Asif Hussain"
    conversions:
      - "OrchestrationContext ↔ cortex/core/interfaces.py:ExecutionContext"
      - "OrchestrationContext ↔ cortex/execution/adaptive_execution_engine.py:ExecutionContext"
      - "OrchestrationContext ↔ cortex/mcp/executor.py:ExecutionContext"
      - "OrchestrationContext ↔ cortex/mcp/orchestrator_mcp_server.py:ExecutionContext"
      - "OrchestrationContext ↔ cortex/orchestrators/adaptive/execution_context_analyzer.py:ExecutionContext"
      - "OrchestrationContext ↔ cortex/orchestrators/refactored_architecture.py:ExecutionContext"
    test_coverage: "100%"
    
  D3: "Wiring Legacy Shim"
    type: "Python Module"
    location: "cortex/wiring/legacy_shim.py"
    description: "Compatibility layer for 3 legacy wiring systems"
    owner: "Asif Hussain"
    shims:
      - "transform_001_implementation compatibility layer"
      - "wiring_harness_integration compatibility layer"
      - "guided_wiring_orchestrator compatibility layer"
    test_coverage: "100%"
    
  D4: "ConsolidatedOrchestratorBase"
    type: "Python Module"
    location: "cortex/orchestrators/consolidated_base.py"
    description: "Unified base class for orchestrators"
    owner: "Asif Hussain"
    inheritance_support:
      - "OrchestratorBase (canonical)"
      - "BaseOrchestrator (experimental, deprecated)"
      - "Orchestrator (from refactored_architecture.py)"
    test_coverage: "100%"
    
  D5: "Dual-Path Testing Framework"
    type: "Python Test Framework"
    location: "tests/framework/dual_path_testing.py"
    description: "Framework for comparing old vs new implementations"
    owner: "Asif Hussain"
    features:
      - "@dual_path decorator"
      - "side_by_side_execution()"
      - "assert_equivalence()"
      - "detailed_diff_on_mismatch()"
    test_count: 50+
    test_coverage: "N/A (framework)"
    
  D6: "Migration Progress Dashboard"
    type: "HTML + JavaScript"
    location: "cortex-lens/migration-progress-dashboard.html"
    description: "Real-time migration progress visualization"
    owner: "Asif Hussain"
    metrics:
      - "Per-registry migration status (%)"
      - "Estimated completion date"
      - "Blockers and rollback risk"
      - "Test pass rate per registry"
    refresh_frequency: "Daily"
    
  D7: "Migration Guide Documentation"
    type: "Markdown Files"
    locations:
      - "docs/12-infrastructure/consolidation-migration-guide.md"
      - "docs/architecture/ADR-8.3B-consolidation-migration.md"
      - "CONTRIBUTING.md (updated with migration policy)"
    owner: "Asif Hussain"
    
