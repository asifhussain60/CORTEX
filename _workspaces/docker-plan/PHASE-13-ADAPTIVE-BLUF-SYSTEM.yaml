# ============================================================================
# APPENDIX
# ============================================================================

appendix:
  
  bluf_origins:
    source: "U.S. Military communication standard"
    purpose: "Enable commanders to make fast decisions in high-pressure situations"
    structure: "Conclusion first, supporting details second"
    adoption: "Used in business, government, and executive communication"
  
  progressive_disclosure_research:
    principle: "Show only essential information initially, provide access to details on demand"
    benefits:
      - "Reduces cognitive load"
      - "Improves scannability"
      - "Maintains depth for interested users"
    risks:
      - "Users may not expand details"
      - "Important context may be hidden"
      - "Requires good information architecture"
  
  risk_classification_frameworks:
    nist_cybersecurity: "Low, Moderate, High based on CIA triad"
    iso_27001: "Risk matrix (likelihood × impact)"
    agile_risk_management: "Risk-adjusted backlog prioritization"
    cortex_approach: "Operation type + scope + impact + dependencies"
  
  references:
    - title: "Bottom Line Up Front: A Guide to Writing for Leaders"
      author: "U.S. Army War College"
      year: 2015
      relevance: "BLUF communication standard"
    
    - title: "Don't Make Me Think"
      author: "Steve Krug"
      year: 2000
      relevance: "Progressive disclosure, information architecture"
    
    - title: "The Pyramid Principle"
      author: "Barbara Minto"
      year: 1987
      relevance: "Conclusion-first communication structure"
