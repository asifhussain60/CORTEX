# ============================================================================
# CORTEX DOCKER-PLAN: PHASE 11 - EVENT-DRIVEN KNOWLEDGE INGESTION ARCHITECTURE
# ============================================================================
# Date: 2026-01-28
# Authority: CORTEX Master Orchestrator + ChallengeEngine
# Status: APPROVED FOR IMPLEMENTATION
# Priority: P0-CRITICAL (Foundational architecture for organizational intelligence)
#
# Strategic Context:
#   User Vision: Crawler-based knowledge ingestion (code, API, DB, compliance)
#   Challenge Response: Event-driven > Crawlers (real-time, efficient, accurate)
#   Architecture: Federated domain graphs + schema-aware extractors + reconciliation
#   Impact: Sub-5s freshness, 90% compute reduction, audit-ready compliance
#
# Key Principles:
#   - Extensibility: Plugin extractors, federated subgraphs, schema evolution
#   - Scalability: Event-driven ingestion, parallel processing, O(change) not O(repo)
#   - Accuracy: Real-time CDC, drift detection, reconciliation safety net
#   - Efficiency: Delta processing, query federation, 3-tier caching
#   - Team Collaboration: Subgraph ownership, cross-team visibility, shared knowledge
# ============================================================================

metadata:
  phase_name: "Event-Driven Knowledge Ingestion - Organizational Nervous System"
  date_created: "2026-01-28"
  phase_id: "11"
  status: "APPROVED"
  priority: "P0-CRITICAL"
  blocking: false  # Enhances existing, doesn't block
  foundational: true  # Enables all future governance intelligence
  
  # Delivery strategy
  delivery_strategy: "TDD_INCREMENTAL"
  stage_1: "Git Event Ingestion + Dependency Graph (Phase 11.1)"
  stage_2: "Compliance Extractor + Compliance Graph (Phase 11.2)"
  stage_3: "API/Service Extractors + Service Graph (Phase 11.3)"
  stage_4: "Federation Layer + DoR Integration (Phase 11.4)"
  stage_5: "Reconciliation Crawlers + Drift Detection (Phase 11.5)"
  
  # Estimated effort
  total_hours: "60-80 hours"
  phase_11_1_hours: "12-16 hours"
  phase_11_2_hours: "14-18 hours"
  phase_11_3_hours: "12-16 hours"
  phase_11_4_hours: "10-14 hours"
  phase_11_5_hours: "12-16 hours"
  
  # Strategic alignment (Challenge-validated)
  strategic_goals:
    extensibility:
      rating: "★★★★★"
      rationale: "Plugin extractors, federated subgraphs, new event sources add without core changes"
    scalability:
      rating: "★★★★★"
      rationale: "Event-driven (O(change)), parallel ingestion, no write bottleneck"
    accuracy:
      rating: "★★★★★"
      rationale: "Real-time CDC, reconciliation safety net, < 1% drift"
    efficiency:
      rating: "★★★★★"
      rationale: "90% compute reduction vs crawlers, delta processing only"
    team_collaboration:
      rating: "★★★★★"
      rationale: "Subgraph ownership, cross-team notifications, shared topology"
  
  # Impact assessment
  impact:
    new_files: "~45 files"
    new_tests: "~180 tests"
    lines_of_code: "~6,500 lines"
    integration_points: 12  # IntentRouter, DoR, LENS, OnboardingOrch, SetupOrch, TDD, etc.
    mcp_tools_added: 6  # knowledge_query, compliance_check, dependency_scan, impact_analysis, drift_report, onboard_repo
    
  # Governance compliance
  core_rules_applied:
    - "CORE-008: TDD (tests before implementation)"
    - "CORE-011: Type hints mandatory"
    - "CORE-012: Google-style docstrings"
    - "CORE-013: Specific exception handling"
    - "CORE-018: YAML-First (graphs stored as queryable YAML/JSON)"
    - "CORE-026: Git checkpoints before major changes"
    - "CORE-027: Audit trail logging (AC_START/EXECUTE/COMPLETE)"
    - "CORE-030: Implementation Truth (LENS-powered verification)"
    - "CORE-035: Single Canonical Implementation (one graph per domain)"
    - "CORE-041: Event Idempotency (NEW - replays produce identical state)"
  
  # New governance rule
  new_core_rule:
    rule_id: "CORE-041"
    name: "Event Idempotency Required"
    description: |
      ALL event handlers MUST be idempotent. Replaying the same event twice
      produces identical graph state. This prevents reconciliation crawlers
      from creating duplicates and enables safe event replay for disaster recovery.
    validation:
      - Event handlers check for existing state before mutation
      - Duplicate events detected via event_id + timestamp
      - Reconciliation produces deterministic results
      - Replay operations logged to audit trail

# ============================================================================
# PHASE 11.1: GIT EVENT INGESTION + DEPENDENCY GRAPH
# ============================================================================
phase_11_1:
  name: "Git Event Ingestion + Dependency Graph"
  duration: "12-16 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Build event ingestion pipeline for Git webhooks (push, PR, merge) and
    create Dependency Graph for real-time CVE awareness. This replaces
    periodic scanning with continuous monitoring.
    
  objectives:
    - Create EventIngestionOrchestrator base class
    - Implement GitEventListener (GitHub/GitLab/Bitbucket webhooks)
    - Implement DependencyExtractor (requirements.txt, package.json, go.mod)
    - Create DependencyGraph (package → version → CVE mappings)
    - Integrate with existing CVE databases (NVD, OSV, GitHub Advisory)
    - Add event buffering and batch processing
    - Wire to MCP as knowledge_base_git_events tool
    
  success_criteria:
    - Git push events processed < 5 seconds
    - Dependency changes update graph automatically
    - CVE alerts fire on vulnerable package detection
    - 100% test coverage on event handlers
    - Audit trail logs all event ingestion
    
  file_structure:
    orchestrators:
      - "cortex/orchestrators/infrastructure/event_ingestion_orchestrator.py"
      - "cortex/orchestrators/infrastructure/__init__.py"
    
    event_listeners:
      - "cortex/event_listeners/git_event_listener.py"
      - "cortex/event_listeners/base_event_listener.py"
      - "cortex/event_listeners/__init__.py"
    
    extractors:
      - "cortex/extractors/dependency_extractor.py"
      - "cortex/extractors/base_extractor.py"
      - "cortex/extractors/__init__.py"
    
    graphs:
      - "cortex/knowledge_graphs/dependency_graph.py"
      - "cortex/knowledge_graphs/base_graph.py"
      - "cortex/knowledge_graphs/__init__.py"
    
    tests:
      - "tests/orchestrators/infrastructure/test_event_ingestion_orchestrator.py"
      - "tests/event_listeners/test_git_event_listener.py"
      - "tests/extractors/test_dependency_extractor.py"
      - "tests/knowledge_graphs/test_dependency_graph.py"
  
  acceptance_criteria:
    - ac_id: "AC-EKI-001-01"
      description: "EventIngestionOrchestrator processes Git webhook events"
      validation: "Unit tests + integration test with mock webhook"
    
    - ac_id: "AC-EKI-001-02"
      description: "DependencyExtractor parses Python, Node.js, Go dependencies"
      validation: "80+ tests covering all package managers"
    
    - ac_id: "AC-EKI-001-03"
      description: "DependencyGraph stores package → version → CVE mappings"
      validation: "Graph queries return accurate vulnerability data"
    
    - ac_id: "AC-EKI-001-04"
      description: "Event ingestion logs to audit trail"
      validation: "AC_START → AC_EXECUTE → AC_COMPLETE for every event"
    
    - ac_id: "AC-EKI-001-05"
      description: "Event handlers are idempotent (CORE-041)"
      validation: "Replaying events produces identical graph state"
  
  mcp_integration:
    tools:
      - name: "knowledge_query_dependencies"
        description: "Query dependency graph for package vulnerabilities"
        parameters:
          - "package_name: str"
          - "version: Optional[str]"
        returns: "List of CVEs with severity, remediation"
      
      - name: "dependency_scan"
        description: "Real-time CVE exposure for a service"
        parameters:
          - "service_name: str"
          - "include_transitive: bool = True"
        returns: "Vulnerability report with risk score"
  
  health_checks:
    endpoints:
      - path: "/health/event-ingestion"
        checks:
          - "Git webhook listener active"
          - "Event queue size < 1000"
          - "DependencyGraph connection healthy"
          - "Last event processed < 60s ago"
    
    metrics:
      - "cortex_event_ingestion_total"
      - "cortex_event_ingestion_duration_seconds"
      - "cortex_dependency_graph_updates_total"
      - "cortex_cve_alerts_fired_total"

# ============================================================================
# PHASE 11.2: COMPLIANCE EXTRACTOR + COMPLIANCE GRAPH
# ============================================================================
phase_11_2:
  name: "Compliance Extractor + Compliance Graph"
  duration: "14-18 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Map code changes to compliance regulations (HIPAA, PCI-DSS, GDPR, SOC2)
    using company/domains/ YAML as source of truth. Automatically validates
    changes against declared compliance controls.
    
  objectives:
    - Create ComplianceExtractor (maps code → company/domains/*.yaml)
    - Implement ComplianceGraph (Regulation → Control → Implementation)
    - Integrate with existing company/domains/compliance-standards/
    - Add compliance drift detection (declared vs actual)
    - Wire to DoR approval gate for compliance-aware approvals
    - Create compliance violation alerts
    
  success_criteria:
    - Code changes auto-mapped to compliance controls
    - DoR shows "Affects 3 HIPAA controls" before approval
    - Drift detection finds undocumented PII handling
    - 100% coverage of company/domains/*.yaml standards
    - Audit trail for compliance validation
    
  file_structure:
    extractors:
      - "cortex/extractors/compliance_extractor.py"
    
    graphs:
      - "cortex/knowledge_graphs/compliance_graph.py"
    
    validators:
      - "cortex/compliance/compliance_validator.py"
      - "cortex/compliance/drift_detector.py"
      - "cortex/compliance/__init__.py"
    
    tests:
      - "tests/extractors/test_compliance_extractor.py"
      - "tests/knowledge_graphs/test_compliance_graph.py"
      - "tests/compliance/test_compliance_validator.py"
      - "tests/compliance/test_drift_detector.py"
  
  acceptance_criteria:
    - ac_id: "AC-EKI-002-01"
      description: "ComplianceExtractor parses company/domains/*.yaml standards"
      validation: "All 12 compliance YAML files loaded into graph"
    
    - ac_id: "AC-EKI-002-02"
      description: "Code changes mapped to affected compliance controls"
      validation: "Modify payment endpoint → graph shows PCI-DSS controls"
    
    - ac_id: "AC-EKI-002-03"
      description: "DoR enriched with compliance context"
      validation: "IntentRouter queries ComplianceGraph before approval"
    
    - ac_id: "AC-EKI-002-04"
      description: "Drift detection finds undocumented compliance violations"
      validation: "Reconciliation crawler flags PII handling without GDPR docs"
    
    - ac_id: "AC-EKI-002-05"
      description: "Compliance validation logs to audit trail"
      validation: "Every compliance check has AC_START/COMPLETE entry"
  
  mcp_integration:
    tools:
      - name: "compliance_check"
        description: "Validate change against regulations"
        parameters:
          - "file_path: str"
          - "change_type: str"  # add, modify, delete
          - "regulations: Optional[List[str]]"  # HIPAA, PCI-DSS, etc.
        returns: "List of affected controls with compliance status"
      
      - name: "drift_report"
        description: "Find compliance drift between declared and actual"
        parameters:
          - "domain: str"  # payment, healthcare, etc.
        returns: "List of violations with remediation steps"
  
  health_checks:
    endpoints:
      - path: "/health/compliance-graph"
        checks:
          - "ComplianceGraph connection healthy"
          - "All company/domains/*.yaml files loaded"
          - "Last compliance validation < 300s ago"
          - "Drift detection active"
    
    metrics:
      - "cortex_compliance_validations_total"
      - "cortex_compliance_violations_detected"
      - "cortex_compliance_graph_queries_total"
      - "cortex_compliance_drift_alerts_total"

# ============================================================================
# PHASE 11.3: API/SERVICE EXTRACTORS + SERVICE GRAPH
# ============================================================================
phase_11_3:
  name: "API/Service Extractors + Service Graph"
  duration: "12-16 hours"
  priority: "P1-HIGH"
  status: "PLANNED"
  
  description: |
    Build service topology map showing API → Microservice → Database relationships.
    Enables impact analysis ("what breaks if this service fails?") and
    cross-team dependency visibility.
    
  objectives:
    - Create APIContractExtractor (OpenAPI, gRPC, GraphQL)
    - Create ServiceTopologyExtractor (traces service calls)
    - Implement ServiceGraph (API → Service → DB → Team ownership)
    - Integrate with API Gateway hooks for real-time contract changes
    - Add blast radius calculator for impact analysis
    - Wire to LENS for enhanced code intelligence
    
  success_criteria:
    - Service topology auto-discovered from code + configs
    - API contract changes trigger downstream notifications
    - "What depends on X?" queries return accurate graph
    - Blast radius calculation < 1 second
    - Integration with existing DiscoveryOrchestrator (Phase 9)
    
  file_structure:
    extractors:
      - "cortex/extractors/api_contract_extractor.py"
      - "cortex/extractors/service_topology_extractor.py"
    
    graphs:
      - "cortex/knowledge_graphs/service_graph.py"
    
    analyzers:
      - "cortex/analyzers/blast_radius_calculator.py"
      - "cortex/analyzers/impact_analyzer.py"
      - "cortex/analyzers/__init__.py"
    
    tests:
      - "tests/extractors/test_api_contract_extractor.py"
      - "tests/extractors/test_service_topology_extractor.py"
      - "tests/knowledge_graphs/test_service_graph.py"
      - "tests/analyzers/test_blast_radius_calculator.py"
  
  acceptance_criteria:
    - ac_id: "AC-EKI-003-01"
      description: "APIContractExtractor parses OpenAPI, gRPC, GraphQL specs"
      validation: "All three spec formats loaded into ServiceGraph"
    
    - ac_id: "AC-EKI-003-02"
      description: "ServiceTopologyExtractor traces service dependencies"
      validation: "Service A calls Service B → graph shows edge"
    
    - ac_id: "AC-EKI-003-03"
      description: "ServiceGraph tracks team ownership metadata"
      validation: "Each service node has owning_team attribute"
    
    - ac_id: "AC-EKI-003-04"
      description: "Blast radius calculator shows impact of changes"
      validation: "Modify UserAPI → shows 5 downstream services affected"
    
    - ac_id: "AC-EKI-003-05"
      description: "LENS integration for code + topology unified view"
      validation: "LENSOrchestrator queries ServiceGraph for context"
  
  mcp_integration:
    tools:
      - name: "impact_analysis"
        description: "Calculate blast radius for changes"
        parameters:
          - "service_name: str"
          - "change_type: str"  # breaking, non-breaking, deprecation
        returns: "List of affected services with impact severity"
      
      - name: "knowledge_query_services"
        description: "Query service topology"
        parameters:
          - "query: str"  # "what depends on UserAPI?"
        returns: "Graph visualization + dependency list"
  
  health_checks:
    endpoints:
      - path: "/health/service-graph"
        checks:
          - "ServiceGraph connection healthy"
          - "API Gateway hooks active"
          - "Last topology update < 600s ago"
          - "Graph nodes > 0 (services discovered)"
    
    metrics:
      - "cortex_service_graph_nodes_total"
      - "cortex_service_graph_edges_total"
      - "cortex_blast_radius_calculations_total"
      - "cortex_service_topology_updates_total"

# ============================================================================
# PHASE 11.4: FEDERATION LAYER + DOR INTEGRATION
# ============================================================================
phase_11_4:
  name: "Query Federation Layer + DoR Integration"
  duration: "10-14 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Create query federation layer that stitches federated subgraphs
    (Dependency, Compliance, Service) at read-time. Integrate with
    IntentRouter and DoR approval gate for governance-aware decisions.
    
  objectives:
    - Create GraphFederationOrchestrator
    - Implement cross-graph query language
    - Integrate with IntentRouter for enriched intent classification
    - Enhance DoR with graph-backed confidence scoring
    - Add query optimization and caching
    - Create unified query API for all graphs
    
  success_criteria:
    - Single query spans multiple graphs seamlessly
    - DoR confidence boosted by graph evidence
    - IntentRouter makes smarter routing decisions
    - Query latency < 200ms for federated queries
    - 100% integration with existing orchestrators
    
  file_structure:
    orchestrators:
      - "cortex/orchestrators/infrastructure/graph_federation_orchestrator.py"
    
    query_engine:
      - "cortex/knowledge_graphs/query_engine.py"
      - "cortex/knowledge_graphs/query_optimizer.py"
      - "cortex/knowledge_graphs/query_cache.py"
    
    integration:
      - "cortex/orchestrators/core/intent_router_graph_integration.py"
      - "cortex/orchestrators/core/dor_graph_integration.py"
    
    tests:
      - "tests/orchestrators/infrastructure/test_graph_federation_orchestrator.py"
      - "tests/knowledge_graphs/test_query_engine.py"
      - "tests/integration/test_intent_router_graph_integration.py"
  
  acceptance_criteria:
    - ac_id: "AC-EKI-004-01"
      description: "GraphFederationOrchestrator queries multiple graphs in one request"
      validation: "Query 'PCI-DSS violations in payment services with CVEs' works"
    
    - ac_id: "AC-EKI-004-02"
      description: "IntentRouter uses graph context for classification"
      validation: "Graph evidence boosts DoR confidence by 0.0-0.4"
    
    - ac_id: "AC-EKI-004-03"
      description: "DoR approval gate enriched with graph insights"
      validation: "DoR displays 'Affects 3 services, 2 HIPAA controls, 1 CVE'"
    
    - ac_id: "AC-EKI-004-04"
      description: "Query caching reduces redundant graph lookups"
      validation: "Second identical query returns from cache in < 10ms"
    
    - ac_id: "AC-EKI-004-05"
      description: "All 23 orchestrators can query federated graphs"
      validation: "Integration tests for TDD, Refactoring, Documentation orchestrators"
  
  mcp_integration:
    tools:
      - name: "knowledge_query"
        description: "Unified query API for all graphs"
        parameters:
          - "query: str"  # Natural language or structured
          - "graphs: Optional[List[str]]"  # dependency, compliance, service
        returns: "Federated query result with metadata"
  
  health_checks:
    endpoints:
      - path: "/health/graph-federation"
        checks:
          - "All subgraphs reachable"
          - "Query cache hit rate > 30%"
          - "Average query latency < 200ms"
          - "Federation layer healthy"
    
    metrics:
      - "cortex_graph_queries_total"
      - "cortex_graph_query_duration_seconds"
      - "cortex_graph_cache_hit_rate"
      - "cortex_graph_federation_errors_total"

# ============================================================================
# PHASE 11.5: RECONCILIATION CRAWLERS + DRIFT DETECTION
# ============================================================================
phase_11_5:
  name: "Reconciliation Crawlers + Drift Detection"
  duration: "12-16 hours"
  priority: "P1-HIGH"
  status: "PLANNED"
  
  description: |
    Build safety net reconciliation system that periodically validates
    graph state against full repository scan. Detects missed events,
    graph corruption, and compliance drift.
    
  objectives:
    - Create ReconciliationOrchestrator
    - Implement scheduled full-repository crawlers
    - Add graph state validation and integrity checks
    - Create drift detection alerts
    - Build self-healing for minor inconsistencies
    - Add reconciliation dashboard
    
  success_criteria:
    - Scheduled reconciliation runs during low-activity windows
    - < 1% drift detected between graph and reality
    - Self-healing corrects 80%+ of drift automatically
    - Manual review queue for complex drift
    - Reconciliation audit trail complete
    
  file_structure:
    orchestrators:
      - "cortex/orchestrators/infrastructure/reconciliation_orchestrator.py"
    
    crawlers:
      - "cortex/crawlers/repository_crawler.py"
      - "cortex/crawlers/compliance_crawler.py"
      - "cortex/crawlers/dependency_crawler.py"
      - "cortex/crawlers/__init__.py"
    
    validators:
      - "cortex/validators/graph_integrity_validator.py"
      - "cortex/validators/drift_validator.py"
      - "cortex/validators/__init__.py"
    
    healing:
      - "cortex/healing/auto_healer.py"
      - "cortex/healing/__init__.py"
    
    tests:
      - "tests/orchestrators/infrastructure/test_reconciliation_orchestrator.py"
      - "tests/crawlers/test_repository_crawler.py"
      - "tests/validators/test_graph_integrity_validator.py"
      - "tests/healing/test_auto_healer.py"
  
  acceptance_criteria:
    - ac_id: "AC-EKI-005-01"
      description: "ReconciliationOrchestrator runs on schedule (e.g., 3am daily)"
      validation: "Cron job triggers full reconciliation"
    
    - ac_id: "AC-EKI-005-02"
      description: "Repository crawlers detect missed events"
      validation: "Missed Git push from webhook failure detected"
    
    - ac_id: "AC-EKI-005-03"
      description: "Drift detection alerts on graph vs reality mismatch"
      validation: "Code declares HIPAA but graph missing → alert fired"
    
    - ac_id: "AC-EKI-005-04"
      description: "Auto-healer corrects minor inconsistencies"
      validation: "Missing dependency in graph → auto-added from lockfile"
    
    - ac_id: "AC-EKI-005-05"
      description: "Reconciliation dashboard shows drift metrics"
      validation: "Grafana dashboard displays drift rate, healing stats"
  
  mcp_integration:
    tools:
      - name: "onboard_repo"
        description: "Register new repository for event capture and reconciliation"
        parameters:
          - "repo_url: str"
          - "webhook_url: str"
          - "reconciliation_schedule: str"  # cron expression
        returns: "Onboarding status with webhook setup instructions"
  
  health_checks:
    endpoints:
      - path: "/health/reconciliation"
        checks:
          - "Last reconciliation < 86400s ago (24 hours)"
          - "Drift rate < 1%"
          - "Auto-healer success rate > 80%"
          - "Manual review queue < 50 items"
    
    metrics:
      - "cortex_reconciliation_runs_total"
      - "cortex_reconciliation_duration_seconds"
      - "cortex_drift_detected_total"
      - "cortex_auto_healing_success_rate"

# ============================================================================
# INTEGRATION & DEPLOYMENT
# ============================================================================
integration:
  existing_systems:
    - component: "IntentRouter"
      integration: "Graph context enriches intent classification"
      impact: "DoR confidence boost 0.0-0.4 from graph evidence"
    
    - component: "DoR Approval Gate"
      integration: "Graph queries show compliance, CVE, service impact"
      impact: "User sees 'Affects 3 PCI controls, 2 services, 1 CVE' before approval"
    
    - component: "LENS Orchestrator"
      integration: "ServiceGraph adds topology to code analysis"
      impact: "LENS shows 'This function called by 5 services'"
    
    - component: "OnboardingOrchestrator"
      integration: "Graph provides new developer context"
      impact: "Onboarding shows team ownership, service dependencies"
    
    - component: "TDDOrchestrator"
      integration: "Graph shows which tests cover which compliance controls"
      impact: "TDD prioritizes tests for high-risk compliance changes"
    
    - component: "RefactoringOrchestrator"
      integration: "Blast radius calculator prevents breaking changes"
      impact: "Refactor blocked if breaks downstream services"

deployment:
  docker_compose_changes:
    new_services:
      - name: "cortex-event-ingestion"
        image: "cortex:latest"
        command: "python -m cortex.orchestrators.infrastructure.event_ingestion_orchestrator"
        ports: []
        depends_on: ["cortex-mcp", "redis"]
      
      - name: "cortex-reconciliation"
        image: "cortex:latest"
        command: "python -m cortex.orchestrators.infrastructure.reconciliation_orchestrator"
        ports: []
        depends_on: ["cortex-mcp", "redis"]
      
      - name: "neo4j"
        image: "neo4j:5.15"
        ports: ["7474:7474", "7687:7687"]
        environment:
          NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
        volumes: ["neo4j_data:/data"]
  
  environment_variables:
    - "NEO4J_URI=bolt://neo4j:7687"
    - "NEO4J_PASSWORD=${NEO4J_PASSWORD}"
    - "GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET}"
    - "RECONCILIATION_SCHEDULE=0 3 * * *"  # 3am daily
    - "EVENT_BATCH_SIZE=100"
    - "GRAPH_QUERY_CACHE_TTL=300"  # 5 minutes

  health_endpoint_additions:
    - path: "/health/event-ingestion"
    - path: "/health/compliance-graph"
    - path: "/health/service-graph"
    - path: "/health/graph-federation"
    - path: "/health/reconciliation"

production_readiness:
  checks_added:
    - "Event ingestion pipeline active"
    - "All 3 federated graphs (Dependency, Compliance, Service) healthy"
    - "Graph query latency < 200ms p95"
    - "Drift rate < 1%"
    - "Last reconciliation < 24h ago"
    - "Neo4j connection healthy"
    - "Redis cache hit rate > 30%"
  
  monitoring_dashboards:
    - name: "Knowledge Ingestion Dashboard"
      panels:
        - "Event ingestion rate (events/sec)"
        - "Graph query latency (p50, p95, p99)"
        - "Drift detection alerts"
        - "Auto-healing success rate"
        - "Cache hit rate"
    
    - name: "Compliance Dashboard"
      panels:
        - "Compliance validations total"
        - "Violations detected by regulation"
