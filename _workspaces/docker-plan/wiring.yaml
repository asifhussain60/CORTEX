# ============================================================================
# CORTEX UNIFIED WIRING SPECIFICATION
# ============================================================================
# Authority: CORE-035 (Single Canonical Implementation)
# 
# This is the SINGLE SOURCE OF TRUTH for ALL orchestrator wiring.
# Changes to this file require review. This file is Git-tracked and diff-able.
#
# IMPORTANT: This replaces ALL previous wiring mechanisms:
#   - DatabaseBackedRegistry (REMOVED)
#   - OrchestratorBootstrap (REMOVED)
#   - OrchestratorRegistry (REMOVED)
#   - permanent_wiring_state (REMOVED)
#   - db_wiring_init (REMOVED)
#   - autowiring_orchestrator (REMOVED)
#   - wiring_contract_manager (REMOVED)
#
# Usage:
#   from cortex.wiring import bootstrap_cortex
#   cortex = bootstrap_cortex()
#   master = cortex.get("MasterOrchestrator")
#
# Version: 2.1
# Created: 2026-01-27
# Updated: 2026-01-27 (v2.1 - Fixed MCP adapter paths)
# Author: Asif Hussain
#
# v2.1 CHANGES:
#   - Fixed mcp_adapter paths to match actual file structure
#   - MCP adapters are in: cortex.mcp.adapters.{core,domain,support}_adapters
#   - Added adapter_class field for class name within adapter module
# ============================================================================

version: "2.0"
specification_date: "2026-01-27"
git_safe: true

# ============================================================================
# GLOBAL CONFIGURATION
# ============================================================================
config:
  # Lazy initialization: orchestrators wire on first access, not at startup
  lazy_initialization: true
  
  # Maximum depth for dependency resolution (prevents infinite loops)
  max_dependency_depth: 5
  
  # Circular dependencies are NEVER allowed
  allow_circular_dependencies: false
  
  # Health check settings
  health_check:
    timeout_seconds: 5
    retry_count: 3
    fail_fast: true
  
  # Logging
  logging:
    level: "INFO"
    format: "structured"
    include_wiring_hash: true
  
  # Container settings
  container:
    wire_on_startup: true
    validate_on_startup: true
    startup_timeout_seconds: 30

# ============================================================================
# CORE ORCHESTRATORS (6)
# These are the foundational orchestrators that handle the LENS protocol,
# intent classification, and master coordination.
# ============================================================================
orchestrators:
  core:
    # -------------------------------------------------------------------------
    # STAGE 1: Comprehension (LENS Protocol Entry Point)
    # -------------------------------------------------------------------------
    - name: "InteractionOrchestrator"
      module: "cortex.orchestrators.core.interaction_orchestrator"
      class: "InteractionOrchestrator"
      description: "Handles user interaction and LENS protocol execution"
      tier: 1
      priority: 10
      singleton: true
      dependencies: []
      capabilities:
        - comprehension
        - lens_protocol
        - challenge_generation
        - pattern_enforcement
        - conversation_management
      health_check:
        method: "execute_turn"
        expected: "returns_dict"
      # v2.1: Fixed adapter paths to match actual structure
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "InteractionOrchestratorAdapter"
      requires_params:
        conversation_protocol:
          type: "ConversationProtocol"
          source: "cortex.brain.core.conversation_protocol"
          lazy_create: true
          optional: true

    # -------------------------------------------------------------------------
    # Challenge Engine (User Disagreement Handling)
    # -------------------------------------------------------------------------
    - name: "ChallengeEngine"
      module: "cortex.orchestrators.core.challenge_engine"
      class: "ChallengeEngine"
      description: "Generates challenges when better alternatives exist"
      tier: 1
      priority: 15
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - challenge_generation
        - disagreement_detection
        - alternative_suggestion
        - solution_comparison
      health_check:
        method: "generate_challenge"
        expected: "returns_challenge_or_none"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "ChallengeEngineAdapter"

    # -------------------------------------------------------------------------
    # STAGE 2: Intent Classification
    # -------------------------------------------------------------------------
    - name: "IntentRouter"
      module: "cortex.orchestrators.core.intent_router"
      class: "IntentRouter"
      description: "Classifies user intent and routes to appropriate handler"
      tier: 1
      priority: 20
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - intent_classification
        - confidence_scoring
        - domain_routing
        - fuzzy_matching
        - intent_disambiguation
      health_check:
        method: "classify_intent"
        expected: "returns_intent_type"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "IntentRouterAdapter"
      config:
        confidence_threshold: 0.7
        fuzzy_match_enabled: true

    # -------------------------------------------------------------------------
    # STAGE 2.5: LENS Synthesis & DoR Approval Gate
    # -------------------------------------------------------------------------
    - name: "LENSSynthesis"
      module: "cortex.orchestrators.core.lens_synthesis"
      class: "LENSSynthesis"
      description: "Synthesizes LENS analysis and generates DoR for approval"
      tier: 1
      priority: 25
      singleton: true
      dependencies:
        - "IntentRouter"
      capabilities:
        - dor_generation
        - approval_gate
        - synthesis
        - intent_reflection
      health_check:
        method: "synthesize"
        expected: "returns_synthesis_result"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "LENSSynthesisAdapter"

    # -------------------------------------------------------------------------
    # STAGE 3: TDD Execution
    # -------------------------------------------------------------------------
    - name: "TDDOrchestrator"
      module: "cortex.orchestrators.core.tdd_orchestrator"
      class: "TDDOrchestrator"
      description: "Manages Test-Driven Development workflow"
      tier: 1
      priority: 30
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
        - "IntentRouter"
      capabilities:
        - test_generation
        - tdd_workflow
        - test_execution
        - coverage_analysis
        - red_green_refactor
      health_check:
        method: "generate_tests"
        expected: "returns_test_code"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "TDDOrchestratorAdapter"
      config:
        test_framework: "pytest"
        coverage_threshold: 80

    # -------------------------------------------------------------------------
    # STAGE 4: Master Coordination (Top-Level Orchestrator)
    # -------------------------------------------------------------------------
    - name: "MasterOrchestrator"
      module: "cortex.orchestrators.core.master_orchestrator"
      class: "MasterOrchestrator"
      description: "Coordinates all orchestrators and manages execution stages"
      tier: 1
      priority: 100
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
        - "IntentRouter"
        - "LENSSynthesis"
        - "TDDOrchestrator"
      capabilities:
        - coordination
        - stage_management
        - orchestrator_routing
        - error_handling
        - audit_logging
      health_check:
        method: "coordinate_operation"
        expected: "returns_coordination_result"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.core_adapters"
        class: "MasterOrchestratorAdapter"
      requires_params:
        orchestrators:
          type: "Dict[str, LazyOrchestrator]"
          source: "wiring_registry"
          inject_all: true
          description: "All wired orchestrators injected at runtime"

  # ============================================================================
  # DOMAIN ORCHESTRATORS (6)
  # These orchestrators handle specific domain operations like refactoring,
  # planning, and documentation.
  # ============================================================================
  domain:
    # -------------------------------------------------------------------------
    # Refactoring Orchestrator
    # -------------------------------------------------------------------------
    - name: "RefactoringOrchestrator"
      module: "cortex.orchestrators.domain.refactoring_orchestrator"
      class: "RefactoringOrchestrator"
      description: "Handles code refactoring operations"
      tier: 2
      priority: 50
      singleton: true
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - code_refactoring
        - pattern_application
        - smell_detection
        - safe_refactoring
      health_check:
        method: "analyze_refactoring"
        expected: "returns_analysis"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.domain_adapters"
        class: "RefactoringOrchestratorAdapter"
      fallback:
        orchestrator: "TDDOrchestrator"
        condition: "health_check_fails"

    # -------------------------------------------------------------------------
    # Planning Orchestrator
    # -------------------------------------------------------------------------
    - name: "PlanningOrchestrator"
      module: "cortex.orchestrators.domain.planning_orchestrator"
      class: "PlanningOrchestrator"
      description: "Generates and manages execution plans"
      tier: 2
      priority: 51
      singleton: true
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - plan_generation
        - phase_management
        - milestone_tracking
        - dependency_analysis
      health_check:
        method: "generate_plan"
        expected: "returns_plan"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.domain_adapters"
        class: "PlanningOrchestratorAdapter"
      fallback:
        orchestrator: "MasterOrchestrator"
        condition: "health_check_fails"

    # -------------------------------------------------------------------------
    # Documentation Orchestrator
    # -------------------------------------------------------------------------
    - name: "DocumentationOrchestrator"
      # v2.1 NOTE: Actual file is enhanced_documentation_orchestrator.py
      # BATCH-003 in migration will rename it to documentation_orchestrator.py
      module: "cortex.orchestrators.domain.documentation_orchestrator"
      class: "DocumentationOrchestrator"
      description: "Generates and manages documentation"
      tier: 2
      priority: 52
      singleton: true
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - doc_generation
        - api_documentation
        - changelog_management
        - docstring_generation
      health_check:
        method: "generate_documentation"
        expected: "returns_documentation"
      # v2.1: Fixed adapter paths
      mcp_adapter:
        module: "cortex.mcp.adapters.domain_adapters"
        class: "DocumentationOrchestratorAdapter"
      fallback:
        orchestrator: "MasterOrchestrator"
        condition: "health_check_fails"

    # -------------------------------------------------------------------------
    # Phase Executor
    # -------------------------------------------------------------------------
    - name: "PhaseExecutor"
      module: "cortex.orchestrators.domain.phase_executor"
      class: "PhaseExecutor"
      description: "Executes plan phases with checkpointing"
      tier: 2
      priority: 53
      singleton: true
      dependencies:
        - "PlanningOrchestrator"
      capabilities:
        - phase_execution
        - checkpoint_management
        - rollback_support
      health_check:
        method: "execute_phase"
        expected: "returns_phase_result"
      # v2.1: Fixed adapter paths (no MCP adapter for this one)
      mcp_adapter: null

    # -------------------------------------------------------------------------
    # Autonomous Execution Engine
    # -------------------------------------------------------------------------
    - name: "AutonomousExecutionEngine"
      module: "cortex.orchestrators.domain.autonomous_execution_engine"
      class: "AutonomousExecutionEngine"
      description: "Executes multi-step operations autonomously"
      tier: 2
      priority: 54
      singleton: true
      dependencies:
        - "MasterOrchestrator"
        - "TDDOrchestrator"
      capabilities:
        - autonomous_execution
        - multi_step_operations
        - self_correction
      health_check:
        method: "execute_autonomous"
        expected: "returns_execution_result"

    # -------------------------------------------------------------------------
    # Conversation Orchestrator
    # -------------------------------------------------------------------------
    - name: "ConversationOrchestrator"
      module: "cortex.orchestrators.domain.conversation_orchestrator"
      class: "ConversationOrchestrator"
      description: "Manages conversation context and history"
      tier: 2
      priority: 55
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - conversation_management
        - context_tracking
        - history_management
      health_check:
        method: "manage_conversation"
        expected: "returns_conversation_state"

  # ============================================================================
  # SUPPORT ORCHESTRATORS (11)
  # These orchestrators provide supporting functionality like onboarding,
  # tool discovery, and workflow management.
  # ============================================================================
  support:
    # -------------------------------------------------------------------------
    # Onboarding Orchestrator
    # -------------------------------------------------------------------------
    - name: "OnboardingOrchestrator"
      module: "cortex.orchestrators.core.onboarding_orchestrator"
      class: "OnboardingOrchestrator"
      description: "Guides new users through CORTEX setup"
      tier: 3
      priority: 60
      singleton: true
      dependencies: []
      capabilities:
        - user_onboarding
        - tutorial_guidance
        - setup_assistance
      health_check:
        method: "start_onboarding"
        expected: "returns_onboarding_state"

    # -------------------------------------------------------------------------
    # Tool Discovery Orchestrator
    # -------------------------------------------------------------------------
    - name: "ToolDiscoveryOrchestrator"
      module: "cortex.orchestrators.core.tool_discovery_orchestrator"
      class: "ToolDiscoveryOrchestrator"
      description: "Discovers and catalogs available tools"
      tier: 3
      priority: 61
      singleton: true
      dependencies: []
      capabilities:
        - tool_discovery
        - capability_enumeration
        - tool_recommendation
      health_check:
        method: "discover_tools"
        expected: "returns_tool_list"

    # -------------------------------------------------------------------------
    # Upgrade Orchestrator
    # -------------------------------------------------------------------------
    - name: "UpgradeOrchestrator"
      module: "cortex.orchestrators.support.upgrade_orchestrator"
      class: "UpgradeOrchestrator"
      description: "Manages version upgrades and migrations"
      tier: 3
      priority: 62
      singleton: true
      dependencies: []
      capabilities:
        - version_upgrade
        - migration_assistance
        - compatibility_check
      health_check:
        method: "check_upgrade"
        expected: "returns_upgrade_status"

    # -------------------------------------------------------------------------
    # Rollback Orchestrator
    # -------------------------------------------------------------------------
    - name: "RollbackOrchestrator"
      module: "cortex.orchestrators.support.rollback_orchestrator"
      class: "RollbackOrchestrator"
      description: "Handles rollback operations"
      tier: 3
      priority: 63
      singleton: true
      dependencies: []
      capabilities:
        - rollback_execution
        - checkpoint_restore
        - state_recovery
      health_check:
        method: "check_rollback"
        expected: "returns_rollback_status"

    # -------------------------------------------------------------------------
    # Setup Orchestrator
    # -------------------------------------------------------------------------
    - name: "SetupOrchestrator"
      module: "cortex.orchestrators.support.setup_orchestrator"
      class: "SetupOrchestrator"
      description: "Manages environment setup and configuration"
      tier: 3
      priority: 64
      singleton: true
      dependencies: []
      capabilities:
        - environment_setup
        - dependency_installation
        - configuration_management
      health_check:
        method: "check_setup"
        expected: "returns_setup_status"

    # -------------------------------------------------------------------------
    # Workflow Orchestrator
    # -------------------------------------------------------------------------
    - name: "WorkflowOrchestrator"
      module: "cortex.orchestrators.core.workflow_orchestrator"
      class: "WorkflowOrchestrator"
      description: "Manages multi-step workflows"
      tier: 3
      priority: 65
      singleton: true
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - workflow_management
        - step_orchestration
        - workflow_persistence
      health_check:
        method: "execute_workflow"
        expected: "returns_workflow_result"

    # -------------------------------------------------------------------------
    # Governance Registry
    # -------------------------------------------------------------------------
    - name: "GovernanceRegistry"
      module: "cortex.orchestrators.core.governance_registry"
      class: "GovernanceRegistry"
      description: "Manages governance rules (CORE-001 through CORE-040)"
      tier: 3
      priority: 66
      singleton: true
      dependencies: []
      capabilities:
        - governance_enforcement
        - rule_management
        - compliance_checking
      health_check:
        method: "get_rules"
        expected: "returns_rule_list"

    # -------------------------------------------------------------------------
    # Knowledge Graph
    # -------------------------------------------------------------------------
    - name: "KnowledgeGraph"
      module: "cortex.orchestrators.core.knowledge_graph"
      class: "KnowledgeGraph"
      description: "Manages knowledge base and relationships"
      tier: 3
      priority: 67
      singleton: true
      dependencies: []
      capabilities:
        - knowledge_retrieval
        - relationship_mapping
        - semantic_search
      health_check:
        method: "query_knowledge"
        expected: "returns_knowledge_result"

    # -------------------------------------------------------------------------
    # Wrapped TDD Orchestrator
    # -------------------------------------------------------------------------
    - name: "WrappedTDDOrchestrator"
      module: "cortex.orchestrators.core.wrapped_tdd_orchestrator"
      class: "WrappedTDDOrchestrator"
      description: "Enhanced TDD with additional governance"
      tier: 3
      priority: 68
      singleton: true
      dependencies:
        - "TDDOrchestrator"
      capabilities:
        - wrapped_tdd
        - enhanced_testing
        - governance_integration
      health_check:
        method: "generate_wrapped_tests"
        expected: "returns_test_code"

    # -------------------------------------------------------------------------
    # Fuzzy Intent Matcher
    # -------------------------------------------------------------------------
    - name: "FuzzyIntentMatcher"
      module: "cortex.orchestrators.core.fuzzy_intent_matcher"
      class: "FuzzyIntentMatcher"
      description: "Handles fuzzy intent matching for unclear requests"
      tier: 3
      priority: 69
      singleton: true
      dependencies:
        - "IntentRouter"
      capabilities:
        - fuzzy_matching
        - intent_disambiguation
        - similarity_scoring
      health_check:
        method: "match_intent"
        expected: "returns_match_result"

    # -------------------------------------------------------------------------
    # Comprehension Session
    # -------------------------------------------------------------------------
    - name: "ComprehensionSession"
      module: "cortex.orchestrators.core.comprehension_session"
      class: "ComprehensionSession"
      description: "Manages comprehension session state"
      tier: 3
      priority: 70
      singleton: true
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - session_management
        - comprehension_tracking
        - context_persistence
      health_check:
        method: "get_session"
        expected: "returns_session_state"

# ============================================================================
# VALIDATION RULES
# ============================================================================
validation:
  rules:
    - name: "no_circular_dependencies"
      description: "Dependency graph must be a DAG"
      check: "dependency_graph_is_dag"
      severity: "ERROR"
      
    - name: "all_dependencies_exist"
      description: "All referenced dependencies must be defined"
      check: "all_dependency_names_in_orchestrator_list"
      severity: "ERROR"
      
    - name: "tier_ordering"
      description: "Lower tier cannot depend on higher tier"
      check: "lower_tier_cannot_depend_on_higher_tier"
      severity: "WARNING"
      
    - name: "health_check_defined"
      description: "All orchestrators must have health check"
      check: "all_orchestrators_have_health_check"
      severity: "WARNING"
      
    - name: "unique_names"
      description: "All orchestrator names must be unique"
      check: "no_duplicate_names"
      severity: "ERROR"
      
    - name: "unique_priorities_per_tier"
      description: "Priorities must be unique within each tier"
      check: "unique_priorities_within_tier"
      severity: "WARNING"
      
    - name: "modules_importable"
      description: "All modules must be importable"
      check: "all_modules_importable"
      severity: "ERROR"
      
    - name: "classes_exist"
      description: "All classes must exist in their modules"
      check: "all_classes_exist"
      severity: "ERROR"

# ============================================================================
# FALLBACK ROUTES (Graceful Degradation)
# ============================================================================
fallback_routes:
  description: |
    When an orchestrator fails health check, route to fallback.
    This ensures CORTEX remains functional even with partial failures.
    
  routes:
    - orchestrator: "RefactoringOrchestrator"
      fallback_to: "TDDOrchestrator"
      condition: "health_check_fails"
      reason: "TDD can handle simpler refactoring tasks"
      
    - orchestrator: "PlanningOrchestrator"
      fallback_to: "MasterOrchestrator"
      condition: "health_check_fails"
      reason: "Master can coordinate without detailed planning"
      
    - orchestrator: "DocumentationOrchestrator"
      fallback_to: "MasterOrchestrator"
      condition: "health_check_fails"
      reason: "Master can provide basic documentation"
      
    - orchestrator: "AutonomousExecutionEngine"
      fallback_to: "MasterOrchestrator"
      condition: "health_check_fails"
      reason: "Master can coordinate manual execution"

# ============================================================================
# MCP ADAPTER MAPPINGS
# ============================================================================
mcp_adapters:
  description: |
    Maps orchestrators to their MCP tool adapters.
    These adapters expose orchestrator capabilities via MCP protocol.
    
  mappings:
    - orchestrator: "MasterOrchestrator"
      adapter: "cortex.mcp.adapters.master_adapter"
      tools:
        - "cortex_execute"
        - "cortex_coordinate"
        
    - orchestrator: "IntentRouter"
      adapter: "cortex.mcp.adapters.intent_router_adapter"
      tools:
        - "cortex_classify_intent"
        
    - orchestrator: "TDDOrchestrator"
      adapter: "cortex.mcp.adapters.tdd_adapter"
      tools:
        - "cortex_generate_tests"
        - "cortex_run_tests"
        
    - orchestrator: "RefactoringOrchestrator"
      adapter: "cortex.mcp.adapters.refactoring_adapter"
      tools:
        - "cortex_refactor"
        - "cortex_analyze_smells"
        
    - orchestrator: "PlanningOrchestrator"
      adapter: "cortex.mcp.adapters.planning_adapter"
      tools:
        - "cortex_generate_plan"
        - "cortex_execute_plan"

# ============================================================================
# METADATA FOR TOOLING
# ============================================================================
metadata:
  total_orchestrators: 23
  core_count: 6
  domain_count: 6
  support_count: 11
  
  tiers:
    - tier: 1
      name: "Core"
      count: 6
      description: "Foundational orchestrators for LENS protocol"
      
    - tier: 2
      name: "Domain"
      count: 6
      description: "Domain-specific orchestrators"
      
    - tier: 3
      name: "Support"
      count: 11
      description: "Supporting functionality"
  
  # Hash will be computed at runtime from this file's content
  # Used to detect wiring drift
  compute_hash: true
  hash_algorithm: "sha256"
  hash_truncate: 16

# ============================================================================
# END OF WIRING SPECIFICATION
# ============================================================================
