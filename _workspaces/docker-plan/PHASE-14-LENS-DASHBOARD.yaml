      - "Detects CORTEX vs external repos"
      - "Only generates tabs 6-8 for CORTEX"
      - "Type hints and docstrings"
      - "Unit tests"
  
  task_010_cli_py:
    ac_id: "LENS-DASH-V2-006"
    priority: "P0"
    effort: "0.5 days"
    status: "NOT_STARTED"
    description: "Create CLI for static site generation"
    
    target_file: "cortex-lens/cli.py"
    
    commands:
      generate:
        usage: "python cli.py generate [--repo PATH] [--output PATH]"
        description: "Generate JSON data for a repository"
        options:
          - "--repo: Path to repository (default: current dir)"
          - "--output: Output path (default: data/<repo-name>/)"
      
      serve:
        usage: "python cli.py serve [--port 8080]"
        description: "Start simple HTTP server for dashboard"
        implementation: "Python http.server module"
      
      open:
        usage: "python cli.py open [cortex]"
        description: "Generate and open dashboard in browser"
        behavior: "Run generate, then serve, then open browser"
    
    acceptance_criteria:
      - "CLI works without FastAPI"
      - "generate command creates JSON files"
      - "serve command starts http.server"
      - "open command launches browser"
  
