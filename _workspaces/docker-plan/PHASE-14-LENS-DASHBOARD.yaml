# ==============================================================================
# EXECUTIVE SUMMARY (REVISED)
# ==============================================================================

executive_summary: |
  **ARCHITECTURE: Static HTML + Pre-generated JSON (NO API)**
  
  The CORTEX LENS Dashboard is rebuilt with a simplified, offline-first architecture:
  
  1. **Static HTML Entry Points** (NO FastAPI dependency for viewing)
     - `lens-dashboard.html` - Main entry with CORTEX logo hero + repo tiles
     - `cortex-dashboard.html` - CORTEX 8-tab analysis dashboard
  
  2. **Pre-generated JSON Data** (NO runtime API calls)
     - JSON files generated by CLI tool: `cortex lens generate`
     - Stored in `data/<repo-name>/` folders
     - Static file serving (Python http.server, Nginx, or any web server)
  
  3. **Dark Glassmorphism Theme** (from _workspaces/dashboard)
     - Uses `cortex-unified.css` as foundation
     - Dark theme by default (`data-theme="dark"`)
     - Glassmorphism cards, tabs, headers
  
  4. **CORTEX Logo Hero Section**
     - 200x200 centered logo on lens-dashboard.html
     - Uses existing `cortex-logo-200.png`
  
  5. **Full 8-Tab Implementation**
     - Tab 1: Repository Overview (📦)
     - Tab 2: Dependency Graph (🕸️)
     - Tab 3: Class Diagrams (📐)
     - Tab 4: Temporal Analysis (📈)
     - Tab 5: Impact Analysis (💥)
     - Tab 6: Brain Architecture (🧠) - CORTEX only
     - Tab 7: Governance Compliance (✅) - CORTEX only
     - Tab 8: Orchestrator Constellation (🎼) - CORTEX only

# ==============================================================================
# ARCHITECTURE (Option A - Flat Entry at Root)
# ==============================================================================

architecture:
  philosophy: |
    KISS Principle - Keep It Simple, Static
    - NO runtime API dependency for dashboard viewing
    - Pre-generate all data at analysis time
    - Pure static file serving
    - Works offline, air-gapped, anywhere
    - Entry points (HTML) at root level for discoverability
    - JSON data in data/ subfolders
  
  folder_structure:
    description: |
      Option A: Flat Entry at Root
      - All HTML entry points at root level
      - Generated JSON data in data/ subfolders
      - CORTEX data separate from user repo data
      - Simple static serving with python -m http.server
    
    structure:
      entry_points:
        - "lens-dashboard.html"           # Main entry: Logo hero + repo tiles
        - "cortex-dashboard.html"         # CORTEX 8-tab dashboard (dedicated)
      
      static_assets:
        - "static/css/cortex-lens.css"    # Dark glassmorphism theme
        - "static/js/dashboard-app.js"    # Alpine.js app logic  
        - "static/js/tab-loader.js"       # Tab content loader
        - "static/assets/cortex-logo-200.png"  # CORTEX logo
        - "static/vendor/"                # Symlink → cortex/visualization/static/vendor/
      
      
      data_folders:
        cortex_data:
          path: "data/cortex/"
          description: "CORTEX-specific JSON (8 files for 8 tabs)"
          files:
            - "overview.json"
            - "dependency-graph.json"
            - "class-diagrams.json"
            - "temporal-analysis.json"
            - "impact-analysis.json"
            - "brain-architecture.json"      # CORTEX-only
            - "governance-heatmap.json"      # CORTEX-only
            - "orchestrator-constellation.json"  # CORTEX-only
        
        repos_data:
          path: "data/repos/"
          description: "User repository JSON data"
          files:
            - "repos.json"                # Tile registry (list of onboarded repos)
            - "<repo-name>/"              # Per-repo subfolder
            -   "overview.json"
            -   "dependency-graph.json"
            -   "class-diagrams.json"
            -   "temporal-analysis.json"
            -   "impact-analysis.json"
      
      backend:
        - "backend/__init__.py"
        - "backend/generator.py"          # JSON data generator
        - "backend/orchestrator.py"       # LENSDashboardOrchestrator delegation
      
      other:
        - "cli.py"                        # Static site generator CLI
        - "README.md"                     # Dashboard documentation
  
  orchestrator_integration:
    description: |
      Dashboard generation is triggered by IntentRouter on "onboard" intent.
      OnboardingOrchestrator delegates to LENSDashboardOrchestrator for generation.
    
    flow:
      - step: "User says 'onboard /path/to/repo'"
      - step: "IntentRouter classifies as ONBOARD intent"
      - step: "OnboardingOrchestrator receives request"
      - step: "OnboardingOrchestrator delegates to LENSDashboardOrchestrator"
      - step: "LENSDashboardOrchestrator runs LENS analyzers"
      - step: "LENSDashboardOrchestrator generates JSON files in data/repos/<name>/"
      - step: "LENSDashboardOrchestrator updates data/repos/repos.json (tile registry)"
      - step: "lens-dashboard.html reads repos.json to render tiles"
    
    new_orchestrator:
      name: "LENSDashboardOrchestrator"
      path: "cortex/orchestrators/support/lens_dashboard_orchestrator.py"
      responsibilities:
        - "Run LENS analyzers (AST, Git, Comments)"
        - "Generate JSON data files for dashboard"
        - "Update repos.json tile registry"
        - "Detect CORTEX vs external repos"
      invoked_by:
        - "OnboardingOrchestrator (on 'onboard' intent)"
        - "CLI: cortex lens generate"
        - "Direct MCP tool call"
  
  removed_components:
    - "cortex_lens/ folder"               # DELETED
    - "cortex-dashboard-v2.html"          # DELETED
    - "index.html"                        # DELETED
    - "repo-dashboards.html"              # RENAMED to lens-dashboard.html
    - "app.py FastAPI server"             # REMOVED
    - "backend/routes.py"                 # REMOVED
    - "backend/cache_manager.py"          # REMOVED
  
  css_source:
    primary: "_workspaces/dashboard/cortex-unified.css"
    description: |
      The authoritative dark glassmorphism CSS from the legacy dashboard.
      Copy and adapt for cortex-lens/static/css/cortex-lens.css.
    key_features:
      - "CSS variables for theming"
      - "data-theme='dark' as default"
      - "Glassmorphism: --glass-bg, --glass-border, --glass-shadow"
      - "Tab styling: .tab-button, .tab-button.active"
      - "Card styling: .glass-card, .kpi-card"
      - "Header styling: .cortex-header"

