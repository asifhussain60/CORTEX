          - "description: string (business language)"
          - "technology_stack: string[]"
          - "architecture_style: string"
          - "key_features: { name: string, description: string }[]"
          - "metrics: { files: int, loc: int, functions: int, classes: int }"
          - "health_score: int (0-100)"
          - "generated_at: ISO datetime"
      
      dependency_graph_json:
        path: "data/<repo>/dependency-graph.json"
        fields:
          - "nodes: { id: string, label: string, type: string, size: int }[]"
          - "edges: { source: string, target: string, weight: int }[]"
          - "clusters: { id: string, nodes: string[] }[]"
      
      class_diagrams_json:
        path: "data/<repo>/class-diagrams.json"
        fields:
          - "diagrams: { name: string, mermaid_code: string }[]"
      
      temporal_analysis_json:
        path: "data/<repo>/temporal-analysis.json"
        fields:
          - "commits: { date: string, author: string, message: string, files: int }[]"
          - "heatmap: { file: string, changes: int, last_modified: string }[]"
          - "authors: { name: string, commits: int, lines_added: int }[]"
      
      impact_analysis_json:
        path: "data/<repo>/impact-analysis.json"
        fields:
          - "high_impact_files: { file: string, dependents: int, risk: string }[]"
          - "change_propagation: { source: string, affected: string[] }[]"
      
      brain_architecture_json:
        path: "data/<repo>/brain-architecture.json"
        fields:
          - "tiers: { tier: int, name: string, rules: string[], status: string }[]"
          - "total_rules: int"
          - "compliant_rules: int"
      
      governance_heatmap_json:
        path: "data/<repo>/governance-heatmap.json"
        fields:
          - "rules: { id: string, name: string, status: string, violations: int }[]"
          - "compliance_percentage: float"
      
      orchestrator_constellation_json:
        path: "data/<repo>/orchestrator-constellation.json"
        fields:
          - "orchestrators: { name: string, domain: string, status: string }[]"
          - "relationships: { from: string, to: string, type: string }[]"
          - "total_wired: int"
    
    acceptance_criteria:
      - "All 8 JSON schemas defined"
      - "TypeScript-like type definitions"
      - "Sample data for each schema"
  
