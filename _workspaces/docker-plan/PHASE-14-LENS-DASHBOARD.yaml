# ==============================================================================
# APPENDIX B: D3.JS VISUALIZATION SPECIFICATIONS (from v1)
# ==============================================================================

d3_visualizations:
  call_graph:
    name: "Function Call Graph"
    description: "Interactive network showing function call relationships"
    data_structure:
      nodes:
        - "id: function_name"
        - "label: function_signature"
        - "module: module_path"
        - "complexity: cyclomatic_complexity"
        - "size: lines_of_code"
      edges:
        - "source: caller_function"
        - "target: callee_function"
        - "weight: call_frequency"
    interactions:
      - "Click: Show function source code"
      - "Hover: Show call chain"
      - "Right-click: Show callers/callees"
    layout: "force-directed with clustering by module"
  
  import_dependency_graph:
    name: "Module Import Graph"
    description: "Visualize import dependencies between modules"
    data_structure:
      nodes:
        - "id: module_path"
        - "label: module_name"
        - "type: internal|external"
        - "size: module_complexity"
      edges:
        - "source: importer_module"
        - "target: imported_module"
        - "type: direct|indirect"
    layout: "hierarchical tree with external dependencies at top"
  
  change_frequency_heatmap:
    name: "Code Change Heatmap"
    description: "Show which files/functions change most frequently"
    data_structure:
      - "file_path: string"
      - "function_name: string"
      - "commit_count: integer"
      - "unique_authors: integer"
      - "last_modified: datetime"
    visualization: "treemap with color intensity = change frequency"
  
  author_contribution_network:
    name: "Developer Collaboration Network"
    description: "Show which developers work on which parts of codebase"
    data_structure:
      nodes:
        - "id: author_name"
        - "commits: integer"
        - "expertise_areas: list[string]"
      edges:
        - "source: author_1"
        - "target: author_2"
        - "shared_files: integer"
    layout: "force-directed with node size = commit count"
  
  complexity_scatter_plot:
    name: "Complexity vs Size Analysis"
    description: "Identify complex functions that may need refactoring"
    axes:
      x: "Lines of Code"
      y: "Cyclomatic Complexity"
    data_points:
      - "function_name"
      - "loc: integer"
      - "complexity: integer"
      - "module: string"
    thresholds:
      - "High complexity, high LOC → Red (refactor candidate)"
      - "High complexity, low LOC → Yellow (review logic)"
      - "Low complexity → Green (healthy)"

# ==============================================================================
# APPENDIX C: MERMAID DIAGRAM SPECIFICATIONS (from v1)
# ==============================================================================

mermaid_diagrams:
  entity_relationship_diagram:
    name: "Database ERD"
    description: "Auto-generate ERD from SQLAlchemy/Django models"
    detection:
      - "SQLAlchemy: classes inheriting Base with __tablename__"
      - "Django: classes inheriting models.Model"
      - "Relationships: ForeignKey, ManyToMany"
    example: |
      erDiagram
          USER ||--o{ ORDER : places
          USER {
              int id PK
              string name
              string email
          }
          ORDER {
              int id PK
              int user_id FK
              datetime created_at
          }
  
  state_machine_diagram:
    name: "Workflow State Machines"
    description: "Detect state transitions in workflow code"
    detection:
      - "Enum classes with state values"
      - "State transition functions (state_machine pattern)"
      - "Status field updates in code"
    example: |
      stateDiagram-v2
          [*] --> Draft
          Draft --> Review: submit()
          Review --> Approved: approve()
          Review --> Rejected: reject()
          Approved --> [*]
  
  sequence_diagram:
    name: "API Interaction Sequences"
    description: "Generate sequence diagrams from API routes"
    detection:
      - "FastAPI routes (@app.get, @app.post)"
      - "Function calls within route handlers"
      - "Database queries and external API calls"
    example: |
      sequenceDiagram
          Client->>+API: POST /users
          API->>+Database: INSERT user
          Database-->>-API: user_id
          API->>+EmailService: send_welcome_email()
          EmailService-->>-API: success
          API-->>-Client: 201 Created
  
  architecture_diagram:
    name: "System Architecture"
    description: "High-level component architecture"
    detection:
      - "Top-level packages/directories"
      - "Inter-package dependencies"
      - "External service integrations"
    example: |
      graph TB
          A[Frontend React] -->|REST API| B[FastAPI Backend]
          B -->|SQLAlchemy| C[(PostgreSQL)]
          B -->|Redis| D[Cache Layer]
          B -->|gRPC| E[Orchestrator Service]

# ==============================================================================
# APPENDIX D: BUSINESS LANGUAGE GENERATOR (from v1)
# ==============================================================================

business_language_generator:
  algorithm:
    name: "Business Language Content Generator"
    implementation: "cortex/visualization/business_language_generator.py"
    
    steps:
      1_ast_extraction:
        inputs:
          - "AST analysis (functions, classes, modules)"
          - "Docstrings and comments"
          - "Function signatures and parameters"
        outputs:
          - "Core capabilities list"
          - "API endpoints discovered"
          - "Database models identified"
      
      2_git_analysis:
        inputs:
          - "Commit messages (last 100 commits)"
          - "Change frequency patterns"
          - "Author contributions"
        outputs:
          - "Project maturity assessment"
          - "Active development areas"
          - "Key contributors"
      
      3_technology_detection:
        inputs:
          - "Import statements (AST)"
          - "requirements.txt / package.json / pom.xml"
          - "Configuration files"
        outputs:
          - "Technology stack"
          - "Framework identification"
          - "Database technologies"
      
      4_pattern_recognition:
        inputs:
          - "Directory structure"
          - "Class inheritance patterns"
          - "Design patterns in code"
        outputs:
          - "Architecture style (MVC, Microservices, Monolith)"
          - "Design patterns used"
          - "Code organization strategy"
      
      5_business_language_mapping:
        rules:
          - "class User → 'User Management System'"
          - "class Order → 'Order Processing'"
          - "def authenticate → 'User Authentication'"
          - "def send_email → 'Email Notification System'"
          - "API routes → 'RESTful API with X endpoints'"
          - "Database models → 'Persistent data storage for X entities'"
        
        templates:
          what_it_does: |
            This is a {architecture_style} {project_type} that provides {core_capabilities}.
            It uses {technology_stack} and follows {design_patterns} patterns.
          
          key_features: |
            - {feature_1} via {implementation_1}
            - {feature_2} via {implementation_2}
            - {feature_3} via {implementation_3}
      
      6_confidence_scoring:
        metrics:
          - "Docstring coverage (higher = more confident descriptions)"
          - "Commit message quality (detailed messages = better intent)"
          - "Pattern detection confidence (explicit patterns = high confidence)"
        output_format:
          - "High confidence: Direct statements"
          - "Medium confidence: 'Appears to provide...'"
          - "Low confidence: 'Contains components suggesting...'"

