# ============================================================================
# RISK MANAGEMENT
# ============================================================================

risks:
  risk_1_track_a_complexity:
    description: "Keyword routing more complex than estimated"
    probability: "MEDIUM"
    impact: "HIGH"
    mitigation:
      - "Start with simplest keyword matching (exact match only)"
      - "Add fuzzy matching in Phase 8.3 if needed"
      - "Maintain 2-week buffer in timeline"
    contingency: "Defer Phase 8.3 semantic ranking to Phase 18 if needed"
  
  risk_2_track_b_d3js:
    description: "D3.js visualizations don't render offline"
    probability: "LOW"
    impact: "HIGH"
    mitigation:
      - "Use Phase 14 lessons learned (Mermaid failed)"
      - "Bundle D3.js locally (no CDN dependencies)"
      - "Test at file:/// URLs early in development"
    contingency: "Fall back to simpler visualizations (charts.js, ASCII art)"
  
  risk_3_track_c_estimation_accuracy:
    description: "Estimation models produce inaccurate results"
    probability: "MEDIUM"
    impact: "MEDIUM"
    mitigation:
      - "Use conservative estimates (prefer pessimistic over optimistic)"
      - "Implement historical learning early for calibration"
      - "Display confidence intervals prominently"
    contingency: "Tune model weights based on initial projects"
  
  risk_4_parallel_track_conflicts:
    description: "Parallel tracks create merge conflicts"
    probability: "MEDIUM"
    impact: "LOW"
    mitigation:
      - "Tracks work in different directories"
      - "Daily sync meetings to coordinate"
      - "Feature branch per track with frequent rebasing"
    contingency: "Serialize tracks if conflicts become blocking"

