# ============================================================================
# TRACK A: PHASE 8.2 - UNIFIED ROUTING SYSTEM (CRITICAL)
# ============================================================================

track_a_routing:
  name: "Phase 8.2 - Unified Routing System"
  priority: "P0-CRITICAL"
  blocking: true
  status: "APPROVED"
  timeline: "4 weeks (Sprints 1-4)"
  estimated_effort: "4 weeks"
  
  problem_statement: |
    Current IntentRouter returns generic handler names (strings) instead of
    orchestrator instances, causing user requests to fail routing.
    
    Example failure: "Use CORTEX LENS to onboard repo: XYZ" → Generic handler
    
    ADDITIONAL ISSUE (NEW):
    Business principles from foundational books (Good to Great, 7 Habits, 
    Begin with Why, etc.) are NOT displayed in DoR Intent Classification,
    despite being implemented in BusinessKnowledgeRepository.py. The DoR 
    uses hardcoded generic mappings instead of the rich book-based principles.
  
  sub_phases:
    phase_8_2:
      name: "Keyword-Based Routing"
      duration: "2 weeks (Sprints 1-2)"
      status: "PLANNED"
      
      tasks:
        - id: "ROUTE-001"
          name: "Extend intent-routing.yaml Schema"
          description: |
            Add orchestrator references and keyword lists to routing config.
            
            Schema additions:
            - orchestrator: Orchestrator class name
            - keywords: List of trigger words
            - fallback_orchestrators: Ranked alternatives
            - confidence_boost: Keyword match weight (0.0-1.0)
            - blocking: Enforcement flag
          
          files:
            - "cortex_brain/tier3/knowledge/intent-routing.yaml"
          
          example_config:
            implement:
              onboarding:
                orchestrator: "OnboardingOrchestrator"
                keywords: ["onboard", "setup", "initialize", "bootstrap", "welcome"]
                fallback_orchestrators: ["LENSOrchestrator", "SetupOrchestrator"]
                confidence_boost: 0.25
                blocking: true
          
          tests:
            - "test_routing_yaml_schema_validation"
            - "test_orchestrator_keyword_parsing"
            - "test_fallback_orchestrator_resolution"
          
          loc: 80
          effort: "1 day"
          ac_ids: ["ROUTE-001-AC01", "ROUTE-001-AC02"]
        
        - id: "ROUTE-002"
          name: "Create OrchestratorLookup Adapter"
          description: |
            Bridge between IntentRouter and Git-backed YAML registry.
            Provides orchestrator instance resolution by name or capabilities.
          
          files:
            - "cortex/orchestrators/registry/orchestrator_lookup.py"
          
          class_structure:
            OrchestratorLookup:
              methods:
                - "get_by_name(name: str) → Optional[IOrchestrator]"
                - "find_by_capabilities(caps: List[str]) → List[IOrchestrator]"
                - "find_by_keywords(keywords: List[str]) → List[Tuple[IOrchestrator, float]]"
                - "validate_orchestrator_exists(name: str) → bool"
          
          tests:
            - "test_orchestrator_lookup_by_name"
            - "test_orchestrator_lookup_by_capabilities"
            - "test_orchestrator_lookup_by_keywords_with_scoring"
            - "test_orchestrator_lookup_missing_orchestrator"
          
          loc: 150
          effort: "2 days"
          ac_ids: ["ROUTE-002-AC01", "ROUTE-002-AC02", "ROUTE-002-AC03"]
        
        - id: "ROUTE-003"
          name: "Enhance IntentRouter with Keyword Extraction"
          description: |
            Extend IntentRouter to extract keywords from user requests and
            match against routing configuration with confidence scoring.
          
          files:
            - "cortex/orchestrators/core/intent_router.py"
          
          enhancements:
            - "extract_keywords(request: str) → List[str]"
            - "match_keywords_to_orchestrators(keywords: List[str]) → List[Tuple[str, float]]"
            - "rank_orchestrators_by_confidence(matches: List) → List[Tuple[IOrchestrator, float]]"
            - "build_routing_decision_with_instance(orchestrator: IOrchestrator) → RoutingDecision"
          
          tests:
            - "test_keyword_extraction_from_request"
            - "test_keyword_matching_with_confidence"
            - "test_orchestrator_ranking"
            - "test_routing_decision_includes_instance"
          
          loc: 200
          effort: "3 days"
          ac_ids: ["ROUTE-003-AC01", "ROUTE-003-AC02", "ROUTE-003-AC03"]
        
        - id: "ROUTE-004"
          name: "Add Enforcement Rules"
          description: |
            Implement Tier 0 enforcement rules for routing violations.
            
            Rules:
            - ROUTING-001: Keywords must map to registered orchestrators
            - ROUTING-002: Confidence must exceed threshold (default: 0.6)
            - ROUTING-003: Fallback orchestrators required for ambiguous requests
            - ROUTING-004: All routing decisions must be auditable
          
          files:
            - "cortex/governance/enforcement/routing_rules.py"
            - "cortex_brain/tier0/governance-rules.yaml"
          
          tests:
            - "test_routing_rule_001_keyword_validation"
            - "test_routing_rule_002_confidence_threshold"
            - "test_routing_rule_003_fallback_requirement"
            - "test_routing_rule_004_audit_trail"
          
          loc: 180
          effort: "2 days"
          ac_ids: ["ROUTE-004-AC01", "ROUTE-004-AC02", "ROUTE-004-AC03", "ROUTE-004-AC04"]
        
        - id: "ROUTE-005"
          name: "Implement Disambiguation UI"
          description: |
            When multiple orchestrators match with similar confidence,
            present top 3 candidates to user for selection.
          
          files:
            - "cortex/orchestrators/core/routing_disambiguator.py"
          
          functionality:
            - "detect_ambiguous_routing(candidates: List[Tuple[IOrchestrator, float]]) → bool"
            - "format_disambiguation_prompt(candidates: List) → str"
            - "apply_user_selection(selection: int, candidates: List) → IOrchestrator"
          
          tests:
            - "test_ambiguity_detection"
            - "test_disambiguation_prompt_formatting"
            - "test_user_selection_application"
          
          loc: 120
          effort: "2 days"
          ac_ids: ["ROUTE-005-AC01", "ROUTE-005-AC02"]
        
        - id: "ROUTE-006"
          name: "Integrate BusinessKnowledgeRepository with DoR"
          description: |
            Connect DoRApprovalGate to BusinessKnowledgeRepository to display
            actual business principles from foundational books (Good to Great,
            7 Habits, Begin with Why, etc.) instead of generic hardcoded mappings.
            
            Current Issue:
            - DoR shows generic: "Quality First → TDD (CORE-008)"
            - Should show rich: "Flywheel Effect (Good to Great) → CORE-001 Progressive Mastery"
            
            Implementation:
            1. Import BusinessKnowledgeRepository in dor_approval_gate.py
            2. Query repository by CORE rule IDs in _build_reflection()
            3. Extract principle_name + source_book for each CORE rule
            4. Format as: "{principle_name} ({source_book}) → {core_rule_id}"
            5. Update to_markdown() to display book names prominently
          
          files:
            - "cortex/orchestrators/core/dor_approval_gate.py"
          
          changes:
            - "Import: from cortex.domain_brain.business_knowledge_repository import BusinessKnowledgeRepository"
            - "Method: _get_business_principles_from_rules(rules: List[str]) → Dict[str, str]"
            - "Integration: Call in _build_reflection() to replace hardcoded mappings"
            - "Format: '{principle} ({book}) → {rule}' instead of '{principle} → {rule}'"
          
          tests:
            - "tests/orchestrators/test_dor_business_principles_integration.py"
            - "test_business_principles_from_knowledge_repository"
            - "test_good_to_great_principles_displayed"
            - "test_7_habits_principles_displayed"
            - "test_multiple_books_in_same_reflection"
            - "test_fallback_when_no_principle_mapping"
          
          loc: 80
          effort: "1 day"
          ac_ids: ["ROUTE-006-AC01", "ROUTE-006-AC02", "ROUTE-006-AC03"]
          priority: "P0-CRITICAL"
          rationale: |
            This is the missing link between CORTEX.prompt.md's promise of
            "16 principles from 6 books" and what users actually see in
            DoR Intent Classification. Without this, the business principles
            remain hidden knowledge that never surfaces to users.
      
      deliverables:
        - "Extended intent-routing.yaml schema with orchestrator references"
        - "OrchestratorLookup adapter for instance resolution"
        - "Enhanced IntentRouter with keyword-based routing"
        - "4 Tier 0 enforcement rules for routing violations"
        - "Disambiguation UI for ambiguous routing scenarios"
        - "BusinessKnowledgeRepository integration with DoR (NEW)"
        - "Rich business principles display (book names + CORE rules)"
        - "25+ tests with 100% coverage"
      
      success_criteria:
        - "User request 'Use CORTEX LENS to onboard repo: XYZ' routes to LENSOrchestrator instance"
        - "Routing latency < 5ms for keyword-based routing"
        - "Disambiguation UI triggers for confidence differences < 0.1"
        - "All routing decisions auditable via CORE-027"
        - "Zero routing failures in integration tests"
        - "DoR displays principles like: 'Flywheel Effect (Good to Great) → CORE-001' (NEW)"
        - "All 6 books represented: Good to Great, 7 Habits, Lean Startup, DevOps, Toyota, Clean Code (NEW)"
    
    phase_8_3:
      name: "Semantic Ranking"
      duration: "2 weeks (Sprints 3-4)"
      status: "PLANNED"
      
      description: |
        Fallback layer for edge cases where keyword matching is ambiguous.
        Uses semantic similarity and confidence scoring to rank candidates.
      
      tasks:
        - id: "ROUTE-006"
          name: "Implement Semantic Similarity Scoring"
          loc: 150
          effort: "3 days"
        
        - id: "ROUTE-007"
          name: "Build Confidence Aggregation"
          loc: 100
          effort: "2 days"
        
        - id: "ROUTE-008"
          name: "Interactive Candidate Selection"
          loc: 120
          effort: "2 days"
      
      deliverables:
        - "Semantic similarity scoring for ambiguous cases"
        - "Multi-factor confidence aggregation"
        - "Interactive top-3 candidate selection"
        - "20+ tests with edge case coverage"
      
      success_criteria:
        - "Edge cases (synonym usage) route correctly"
        - "Confidence scoring accounts for intent + keywords + capabilities"
        - "User can select from top 3 candidates when ambiguous"
  
  total_deliverables:
    code_files: 8
    test_files: 5
    config_updates: 2
    documentation: 3
    total_loc: 1100
    total_tests: 40
  
  business_value:
    before: "User requests fail routing, manual debugging required"
    after: "100% routing success with <5ms latency + smart disambiguation"

