# PHASE 15: Static Repository Visualization & Domain Knowledge System
# Version: 1.0
# Created: 2026-01-29
# Authority: CORE-030 (Implementation Truth), CORE-038 (File Placement), CORE-040 (Doc Lifecycle)
# Dependencies: Phase 14 (LENS Dashboard), Phase 7.1 (LENS Intelligence)
# Status: APPROVED - Ready for Implementation
#
# ⭐ CRITICAL: This phase creates GENERIC, repo-agnostic visualization system
# NO proprietary data in this specification - reference architecture only

metadata:
  phase_id: "PHASE-15"
  name: "Static Repository Visualization & Domain Knowledge System"
  status: "APPROVED"
  priority: "P1"
  estimated_effort: "18-24 days"
  dependencies:
    - "Phase 14 (LENS Dashboard baseline)"
    - "Phase 7.1 (LENS Intelligence - AST, Git, Comment analyzers)"
    - "BusinessLanguageGenerator (cortex/visualization/business_language_generator.py)"
    - "D3.js renderers (4 existing: call graph, import graph, timeline, author network)"
  
  ac_ids:
    - "STATIC-VIZ-001"  # StaticVisualizationOrchestrator
    - "STATIC-VIZ-002"  # Multi-Persona HTML Generator
    - "STATIC-VIZ-003"  # Domain Knowledge Accumulator
    - "STATIC-VIZ-004"  # 3-Tier Dashboard Hierarchy
    - "STATIC-VIZ-005"  # D3.js Visualization System (no Mermaid)
    - "STATIC-VIZ-006"  # Domain Auto-Detection
    - "STATIC-VIZ-007"  # Incremental Knowledge Updates

# ==============================================================================
# EXECUTIVE SUMMARY
# ==============================================================================

executive_summary: |
  Phase 15 transforms CORTEX from a single-repo analysis tool to a comprehensive
  portfolio intelligence system with tabbed entry dashboard and domain-first discovery.
  
  **PROBLEM SOLVED:**
  - Phase 14 created dashboards but lacked scalable navigation
  - No way to aggregate knowledge across multiple repos in a domain
  - CORTEX self-analysis dashboard was redundant (not user-facing need)
  - No cross-repository intelligence or compliance tracking
  
  **SOLUTION: TABBED ENTRY DASHBOARD + 3-TIER VISUALIZATION SYSTEM**
  
  Entry Point: LENS Dashboard (lens-dashboard.html) - TABBED
    Tab 1: 📂 Repositories
      - Repo tiles grid (click → 6-tab repo dashboard)
      - Supports infinite scroll/pagination at scale
      - Shows file count, lines of code, domain membership
    
    Tab 2: 🏢 Domains (DOMAIN-FIRST DISCOVERY)
      - Domain tiles aggregated from onboarded repos
      - Auto-detect domain from git remote or CLI flag
      - Shows repo count, entity count, tech stack per domain
      - Click → domain-dashboard.html?domain=X (6 tabs)
      - SCALES to enterprise (30+ domains manageable)
    
    Tab 3: ⭐ Quick Links (FUTURE-READY)
      - Recently viewed repos/domains
      - Favorite repos/domains
      - Search & filter across portfolio
      - Analytics hooks for future UI improvements
  
  Repository Dashboards (6 tabs each)
    - Individual repo analysis with domain context
    - Static HTML + JSON (file:/// compatible, offline-first)
    - Multi-persona views (developers/, managers/, executives/, regulatory/, product/)
    - D3.js visualizations ONLY (Mermaid removed due to Phase 14 failures)
  
  Domain Dashboards (6 tabs)
    - Aggregated knowledge across all repos in a domain
    - Cross-repo entity catalog, workflow patterns, compliance matrix
    - Technology prevalence heatmaps
    - Incremental knowledge accumulation in company/domains/{domain}/
  
  **ARCHITECTURE PATTERN (Success Model):**
  Phase 15 follows the proven architecture from reference-architecture:
    ✅ Static HTML pages (no build step, no CDN dependencies)
    ✅ Glassmorphism CSS (onedrive-glass.css style)
    ✅ Alpine.js for tab state management (lightweight)
    ✅ D3.js bundled locally (force-directed graphs, heatmaps, timelines)
    ✅ Multi-persona navigation (developers/, managers/, etc.)
    ✅ JSON data files (separation of data from presentation)
    ✅ Offline-first (works at file:/// without server)
    ✅ Tabbed navigation (scales from 1 to 100+ repos/domains)
    ❌ NO Mermaid (failed in Phase 14 - diagrams didn't render)
    ❌ NO CORTEX self-analysis dashboard (removed - not user-facing need)
    ❌ NO CDN dependencies (must work offline/air-gapped)
  
  **DOMAIN KNOWLEDGE ACCUMULATION:**
  - Onboarding populates company/domains/{domain}/*.yaml
  - Entities aggregated across repos (find shared data models)
  - Workflows detected and cataloged (common patterns emerge)
  - Compliance tracking (HIPAA/PCI-DSS/SOX across portfolio)
  - Tech stack analysis (which repos use what technologies)
  - Glossary building (business terms from AST + comments)

# ==============================================================================
# ARCHITECTURE: 3-TIER DASHBOARD HIERARCHY
# ==============================================================================

architecture:
  overview: |
    Phase 15 introduces a three-tier hierarchy for code intelligence with tabbed
    entry point for scalable domain-first navigation.
    
    1. LENS Dashboard (lens-dashboard.html) - Entry Point (TABBED)
       ├─ Tab 1: 📂 Repositories
       │   └─ Repo tiles → data/repos/{slug}/index.html (6 tabs)
       ├─ Tab 2: 🏢 Domains
       │   └─ Domain tiles → domain-dashboard.html?domain=X (6 tabs)
       └─ Tab 3: ⭐ Quick Links
           ├─ Recently viewed
           ├─ Favorites
           └─ Search/filter
    
    2. File Structure (cortex-lens/)
       cortex-lens/
         ├─ lens-dashboard.html           # Main entry (3 tabs: repos, domains, quick links)
         ├─ domain-dashboard.html         # Domain aggregation (6 tabs)
         ├─ static/                       # Bundled assets (D3.js, CSS, JS)
         │   ├─ css/
         │   │   ├─ cortex-lens.css       # Base styles
         │   │   └─ glassmorphism.css     # reference-architecture inspired
         │   ├─ js/
         │   │   ├─ dashboard-core.js     # Shared utilities
         │   │   ├─ d3-visualizations.js  # D3.js wrappers
         │   │   ├─ persona-nav.js        # Multi-persona navigation
         │   │   └─ tab-manager.js        # Tab state management (Alpine.js)
         │   ├─ vendor/
         │   │   └─ d3-7.8.5.min.js       # Bundled locally (250KB)
         │   └─ assets/
         │       └─ cortex-logo-200.png
         └─ data/
             ├─ repos/
             │   ├─ repos.json            # Repository registry
             │   └─ {repo-slug}/
             │       ├─ index.html        # Main repo dashboard (6 tabs)
             │       ├─ data.json         # Aggregated analysis data
             │       ├─ developers/       # Developer-focused pages
             │       │   ├─ index.html
             │       │   ├─ domain-model.html
             │       │   ├─ complexity-heatmap.html
             │       │   └─ integration-architecture.html
             │       ├─ managers/         # Manager-focused pages
             │       │   ├─ index.html
             │       │   ├─ team-metrics.html
             │       │   ├─ technical-debt-register.html
             │       │   └─ performance-metrics.html
             │       ├─ executives/       # Executive-focused pages
             │       │   ├─ index.html
             │       │   └─ executive-summary.html
             │       ├─ regulatory/       # Compliance-focused pages
             │       │   ├─ index.html
             │       │   └─ compliance-gaps.html
             │       └─ product/          # Product manager pages
             │           ├─ index.html
             │           └─ use-cases.html
             └─ domains/
                 ├─ domains.json          # Domain registry
                 └─ {domain-slug}/
                     ├─ index.html        # Domain dashboard (6 tabs)
                     └─ data.json         # Aggregated domain data
    
    3. Knowledge Storage (company/)
       company/
         └─ domains/
             └─ {domain}/
                 ├─ README.md             # Domain documentation
                 ├─ entities.yaml         # Aggregated entities across repos
                 ├─ workflows.yaml        # Common workflow patterns
                 ├─ compliance.yaml       # Compliance tracking
                 ├─ tech-stack.yaml       # Technology prevalence
                 ├─ glossary.yaml         # Business terminology
                 └─ architecture-patterns.yaml  # Recurring patterns

  entry_point_tabbed_dashboard:
    name: "LENS Dashboard Entry Point (Tabbed for Scale)"
    location: "cortex-lens/lens-dashboard.html"
    purpose: "Single entry point with domain-first navigation, scales from 1 to 100+ repos"
    architecture: "Tabbed interface (Alpine.js state management)"
    
    tabs:
      tab_1_repositories:
        id: "repositories"
        name: "📂 Repositories"
        icon: "📂"
        purpose: "Browse onboarded repositories"
        content:
          - "Repository tiles grid (click → 6-tab repo dashboard)"
          - "Tile shows: repo name, icon, description, file count, lines of code"
          - "Links to: data/repos/{repo-slug}/index.html"
          - "Supports: pagination/infinite scroll for scale"
        data_source: "cortex-lens/data/repos/repos.json"
        ui_components:
          - "Repo grid with cards"
          - "Empty state when no repos (with onboarding instructions)"
          - "Stats badges (file count, lines of code)"
      
      tab_2_domains:
        id: "domains"
        name: "🏢 Domains"
        icon: "🏢"
        purpose: "Domain-first portfolio exploration (PHASE 15 GOAL)"
        content:
          - "Domain tiles aggregated from onboarded repos"
          - "Tile shows: domain name, repo count, entity count, tech stack"
          - "Links to: domain-dashboard.html?domain={domain-slug} (6 tabs)"
          - "Auto-detects domain from git remote or CLI flag"
          - "Scales to enterprise (30+ domains manageable via pagination)"
        data_source: "cortex-lens/data/domains/domains.json (generated from repos)"
        auto_detection:
          - "CLI flag: --domain {name} (highest priority)"
          - "Git remote: github.com/mycompany/* → mycompany"
          - "Fallback: 'unknown' domain"
        ui_components:
          - "Domain tiles with entity/repo aggregation"
          - "Tech stack prevalence icons"
          - "Empty state (no domains yet)"
      
      tab_3_quick_links:
        id: "quick-links"
        name: "⭐ Quick Links"
        icon: "⭐"
        purpose: "Bookmarks, history, search (future-ready)"
        content:
          - "Recently viewed repos/domains (localStorage tracking)"
          - "Favorite repos/domains (pin/unpin UI)"
          - "Search & filter across all repos and domains"
          - "Filter by: technology, compliance tags, domain, risk level"
        data_source: "localStorage (browser) + cortex-lens/data/"
        ui_components:
          - "Recently viewed list"
          - "Favorites grid"
          - "Search box with instant filtering"
          - "Filter chips (Python, Node, HIPAA, High Risk, etc.)"
        future_enhancements:
          - "Analytics tracking (which repos most viewed)"
          - "Personalization (save filter preferences)"
          - "Recommendations (repos related to your edits)"

  tier_1_repository_dashboards:
    name: "Repository Dashboards (6 tabs + multi-persona)"
    location: "cortex-lens/data/repos/{repo-slug}/"
    tabs:
      tab_1:
        id: "overview"
        name: "📦 Repository Overview"
        purpose: "Business-language summary of what the code does"
        content:
          - "What is this application? (BusinessLanguageGenerator output)"
          - "Who uses it? (Stakeholder identification)"
          - "Key capabilities (AST-derived features)"
          - "Technology stack (detected from imports)"
          - "Architecture patterns (MVC, microservices, monolith)"
          - "Compliance tags (HIPAA, PCI-DSS, SOX if detected)"
        data_sources:
          - "AST analysis (functions, classes, modules)"
          - "Git commit messages (intent detection)"
          - "Comments and docstrings"
          - "BusinessLanguageGenerator"
      
      tab_2:
        id: "dependencies"
        name: "🕸️ Dependency Graph"
        purpose: "Visualize module dependencies and function calls"
        content:
          - "D3.js force-directed import graph"
          - "Call graph visualization"
          - "Dependency metrics (coupling, cohesion)"
          - "Circular dependency detection"
        visualizations:
          - "D3 force-directed graph (nodes = modules, edges = imports)"
          - "Interactive filtering by module type"
          - "Color coding by module category"
        implementation_reference:
          - "cortex/visualization/renderers/d3_import_graph_renderer.py"
          - "cortex/visualization/renderers/d3_call_graph_renderer.py"
          - "See archive/CORTEX-5.0 for original working implementation"
      
      tab_3:
        id: "classes"
        name: "📊 Class & Entity Model"
        purpose: "Domain model visualization"
        content:
          - "Entity boxes with properties"
          - "Compliance highlighting (HIPAA entities in blue, PCI in red)"
          - "Relationship arrows (foreign keys, inheritance)"
          - "Entity statistics (property count, method count)"
        visualizations:
          - "D3.js entity-relationship graph"
          - "Custom entity box rendering (like reference-architecture)"
          - "Color-coded by compliance requirements"
        note: "NO Mermaid class diagrams (failed in Phase 14)"
      
      tab_4:
        id: "timeline"
        name: "📈 Temporal Analysis"
        purpose: "Git history and change patterns"
        content:
          - "Commit timeline visualization"
          - "Change frequency heatmap (hot files)"
          - "Author contribution network"
          - "Development phases detection"
        visualizations:
          - "D3.js timeline with commit markers"
          - "Heatmap of file changes over time"
          - "Author network (force-directed graph)"
        implementation_reference:
          - "cortex/visualization/renderers/d3_git_timeline_renderer.py"
          - "cortex/visualization/renderers/d3_author_network_renderer.py"
      
      tab_5:
        id: "impact"
        name: "💥 Impact Analysis"
        purpose: "Change ripple effects and risk assessment"
        content:
          - "High-impact modules (many dependents)"
          - "Critical paths (change propagation)"
          - "Dependency matrix"
          - "Risk assessment (test coverage, rollback strategy)"
        visualizations:
          - "D3.js dependency matrix heatmap"
          - "Impact radius visualization"
      
      tab_6:
        id: "domain-context"
        name: "🏢 Domain Context"
        purpose: "How this repo fits into broader company domain"
        content:
          - "Domain membership (which domain this repo belongs to)"
          - "Shared entities with other repos (cross-repo data models)"
          - "Compliance alignment (domain standards vs this repo)"
          - "Technology stack comparison (this repo vs domain average)"
          - "Glossary terms used (business vocabulary)"
        data_sources:
          - "company/domains/{domain}/entities.yaml"
          - "company/domains/{domain}/compliance.yaml"
          - "company/domains/{domain}/tech-stack.yaml"
          - "company/domains/{domain}/glossary.yaml"
        visualizations:
          - "Venn diagram of shared entities"
          - "Compliance checklist (green/red indicators)"
          - "Tech stack radar chart"
    
    multi_persona_views:
      developers:
        location: "developers/"
        pages:
          - "index.html - Developer dashboard with quick links"
          - "domain-model.html - Entity model with properties/methods"
          - "complexity-heatmap.html - Cyclomatic complexity visualization"
          - "integration-architecture.html - API endpoints, message queues"
          - "knowledge-ownership.html - Which devs know which modules"
          - "developer-insights.html - Technical debt, refactoring opportunities"
      
      managers:
        location: "managers/"
        pages:
          - "index.html - Manager dashboard with KPIs"
          - "team-metrics.html - Velocity, commit frequency, PR stats"
          - "technical-debt-register.html - Debt items with ROI estimates"
          - "technical-debt-roi.html - Payoff matrix for debt reduction"
          - "test-coverage-gaps.html - Coverage by module"
          - "test-coverage-roadmap.html - Testing improvement plan"
          - "performance-metrics.html - Performance benchmarks"
          - "weekly-scorecard.html - Weekly progress tracking"
      
      executives:
        location: "executives/"
        pages:
          - "index.html - Executive summary (1-page overview)"
          - "executive-narrative.html - Business language description"
          - "risk-assessment.html - Compliance risks, security gaps"
          - "portfolio-health.html - Overall system health metrics"
      
      regulatory:
        location: "regulatory/"
        pages:
          - "index.html - Compliance dashboard"
          - "compliance-gaps.html - P0/P1/P2 gap analysis"
          - "audit-trail.html - Audit log coverage"
          - "security-controls.html - Security pattern detection"
      
      product:
        location: "product/"
        pages:
          - "index.html - Product manager view"
          - "use-cases.html - Detected business use cases"
          - "feature-catalog.html - Capabilities extracted from code"
          - "workflow-diagrams.html - Business process flows"

  tier_2_domain_dashboards:
    name: "Domain Dashboards (6 tabs, aggregated)"
    location: "cortex-lens/data/domains/{domain-slug}/"
    purpose: "Cross-repository intelligence for a business domain"
    
    tabs:
      tab_1:
        id: "domain-overview"
        name: "🏢 Domain Overview"
        content:
          - "Domain summary (aggregated across all repos)"
          - "Repository count and health"
          - "Technology stack prevalence (% repos using each tech)"
          - "Compliance posture (which repos meet standards)"
          - "Key metrics (total LOC, files, authors)"
      
      tab_2:
        id: "entity-catalog"
        name: "📦 Entity Catalog"
        content:
          - "All entities discovered across repos"
          - "Entity prevalence (how many repos use each entity)"
          - "Property intersection (common properties across repos)"
          - "Compliance tags aggregated"
        data_source: "company/domains/{domain}/entities.yaml"
        visualization:
          - "D3.js entity network (nodes = entities, edges = relationships)"
          - "Color by prevalence (red = 1 repo, green = all repos)"
      
      tab_3:
        id: "workflow-patterns"
        name: "🔄 Workflow Patterns"
        content:
          - "Common workflows detected across repos"
          - "Workflow complexity metrics"
          - "Compliance-critical workflows flagged"
        data_source: "company/domains/{domain}/workflows.yaml"
      
      tab_4:
        id: "compliance-matrix"
        name: "✅ Compliance Matrix"
        content:
          - "Compliance standards by repo (HIPAA, PCI-DSS, SOX, GDPR)"
          - "Gap analysis (which repos missing which controls)"
          - "Risk exposure by repo"
        data_source: "company/domains/{domain}/compliance.yaml"
        visualization:
          - "Heatmap: repos (rows) vs standards (columns)"
          - "Color: green (compliant), yellow (partial), red (missing)"
      
      tab_5:
        id: "tech-stack"
        name: "🛠️ Tech Stack Heatmap"
        content:
          - "Technology prevalence across repos"
          - "Version consistency tracking"
          - "Deprecated technology detection"
        data_source: "company/domains/{domain}/tech-stack.yaml"
        visualization:
          - "D3.js heatmap: repos (rows) vs technologies (columns)"
          - "Bubble chart: size = usage prevalence"
      
      tab_6:
        id: "glossary"
        name: "📖 Business Glossary"
        content:
          - "Business terms extracted from code"
          - "Term definitions (from docstrings/comments)"
          - "Term usage by repo"
        data_source: "company/domains/{domain}/glossary.yaml"

  tier_3_note:
    deprecated: "CORTEX Self-Analysis Dashboard"
    reason: |
      CORTEX self-analysis dashboard (cortex-dashboard.html) was removed in Phase 15.
      
      Rationale:
      - Not a user-facing need (developers don't browse CORTEX's own architecture)
      - CORTEX can be onboarded as a regular repo via "cortex lens onboard /path/to/cortex"
      - Users can view CORTEX dashboard same as any other repo (Tab 1: Repositories)
      - Simplifies implementation (no special-case 9-tab logic)
      - Reduces file count and maintenance burden
      
      If internal CORTEX analysis is needed:
      1. Run: cortex lens onboard /path/to/CORTEX/cortex --domain cortex-internal
      2. View: lens-dashboard.html → Tab 1 Repositories → click CORTEX tile
      3. Result: Standard 6-tab repository dashboard for CORTEX itself

# ==============================================================================
# DOMAIN KNOWLEDGE ACCUMULATION (Incremental Updates)
# ==============================================================================

domain_knowledge_system:
  overview: |
    Every time a repository is onboarded, CORTEX extracts domain knowledge
    and incrementally updates company/domains/{domain}/*.yaml files.
    
    Knowledge compounds over time as more repos are analyzed, creating a
    comprehensive understanding of the business domain.
  
  knowledge_files:
    entities_yaml:
      location: "company/domains/{domain}/entities.yaml"
      purpose: "Aggregate all entities discovered across repos in domain"
      schema: |
        domain: acme-corp-sales
        updated: 2026-01-29T10:30:00Z
        repos_analyzed: 5
        
        entities:
          - name: Order
            sources:
              - repo: OrderManagement.git
                file: Models/Order.cs
                line: 45
              - repo: Billing.git
                file: Entities/OrderEntity.cs
                line: 23
            properties:
              - OrderId (string) - found in 2/5 repos
              - TotalAmount (decimal) - found in 2/5 repos
              - Status (enum) - found in 2/5 repos
            compliance_tags:
              - PCI-DSS (payment data)
              - SOX (financial records)
            prevalence: 2/5 repos (40%)
            confidence: 0.95
          
          - name: Customer
            sources:
              - repo: OrderManagement.git
                file: Models/Customer.cs
              - repo: CRM.git
                file: Domain/Customer.cs
              - repo: Portal.git
                file: Models/User.cs
            properties:
              - CustomerId (string) - found in 3/5 repos
              - TaxId (string) - found in 2/5 repos
              - Email (string) - found in 3/5 repos
            compliance_tags:
              - GDPR (personal data)
              - PII (customer information)
            prevalence: 3/5 repos (60%)
            confidence: 0.92
      
      update_strategy: "Incremental merge with conflict detection"
      conflict_resolution:
        - "If entity exists, merge properties (union)"
        - "If property types conflict, flag for manual review"
        - "Update prevalence counters"
        - "Update confidence scores based on evidence"
    
    workflows_yaml:
      location: "company/domains/{domain}/workflows.yaml"
      purpose: "Catalog common business workflows across repos"
      schema: |
        domain: acme-corp-sales
        
        workflows:
          - id: WF-001
            name: Month-End Order Reconciliation
            detected_in:
              - repo: OrderManagement.git
                service: OrderReconciliationService
                methods: 8
                complexity: high
            steps:
              - Query orders with pending status
              - Apply business rules validation
              - Calculate discrepancies
              - Update order statuses
              - Generate audit trail
              - Publish reconciliation events
            compliance_critical: true
            regulations:
              - SOX Section 404 (Internal Controls)
              - PCI-DSS Requirement 10 (Audit Logging)
            risk_level: P0 (critical)
            performance_metrics:
              - 50000 orders processed in 15-20 minutes
      
      detection_algorithm: |
        1. Scan for service classes with >5 methods
        2. Detect workflow keywords (process, execute, run, handle)
        3. Extract step sequence from method calls
        4. Identify regulatory keywords in comments/docs
        5. Assign risk level based on compliance tags
    
    compliance_yaml:
      location: "company/domains/{domain}/compliance.yaml"
      purpose: "Track compliance standards across repo portfolio"
      schema: |
        domain: acme-corp-sales
        
        standards:
          GDPR:
            applicable: true
            repos_compliant:
              - OrderManagement.git: 95% (1 gap)
              - CRM.git: 100%
              - Portal.git: 90% (2 gaps)
            gaps:
              - repo: OrderManagement.git
                gap_id: P0-001
                description: Missing consent tracking for data processing
                severity: P0
                estimated_exposure: $500k-$2M
                remediation: Implement ConsentAudit entity
            controls_detected:
              - PII encryption at rest (AES-256)
              - Audit trail (7-year retention)
              - Access control (role-based)
          
          PCI-DSS:
            applicable: true
            repos_compliant:
              - OrderManagement.git: 80% (card storage issues)
            gaps:
              - repo: OrderManagement.git
                gap_id: P0-005
                description: CVV stored in database (prohibited)
                severity: P0
                estimated_exposure: $100k-$500k
    
    tech_stack_yaml:
      location: "company/domains/{domain}/tech-stack.yaml"
      purpose: "Track technology prevalence and versions"
      schema: |
        domain: acme-corp-sales
        
        technologies:
          dotnet:
            framework: .NET Framework
            versions:
              - version: 4.8
                repos: [OrderManagement.git, Billing.git]
                prevalence: 2/5 (40%)
              - version: 6.0
                repos: [Portal.git]
                prevalence: 1/5 (20%)
          
          databases:
            - name: SQL Server
              versions:
                - "2019"
              repos: [OrderManagement.git, Billing.git]
              prevalence: 2/5 (40%)
          
          messaging:
            - name: RabbitMQ
              versions:
                - "3.12"
              repos: [OrderManagement.git]
              prevalence: 1/5 (20%)
    
    glossary_yaml:
      location: "company/domains/{domain}/glossary.yaml"
      purpose: "Business terminology extracted from code"
      schema: |
        domain: acme-corp-sales
        
        terms:
          - term: SKU
            full_name: Stock Keeping Unit
            definition: Unique identifier for each distinct product or service
            sources:
              - repo: OrderManagement.git
                occurrences: 142
                context: "Product identification, inventory tracking"
            related_terms: [UPC, GTIN, Product Code]
            regulatory_references: [GS1 Standards]
          
          - term: Backorder
            definition: Order for product not currently in stock, to be fulfilled when available
            sources:
              - repo: OrderManagement.git
                occurrences: 87
            business_constraints:
              - Max 30 days backorder window
              - Customer notification required within 24 hours
    
    architecture_patterns_yaml:
      location: "company/domains/{domain}/architecture-patterns.yaml"
      purpose: "Recurring architectural patterns across repos"
      schema: |
        domain: acme-corp-sales
        
        patterns:
          - pattern: Domain-Driven Design (DDD)
            detected_in:
              - OrderManagement.git
              - Billing.git
            indicators:
              - DomainService suffix (11 services)
              - Entity/ValueObject separation
              - Aggregate roots (Order, Customer)
          
          - pattern: Event-Driven Architecture
            detected_in:
              - OrderManagement.git
            indicators:
              - Message queue publishing
              - Event naming (*Event suffix)
              - Publish/subscribe pattern

  auto_detection:
    domain_from_git_remote:
      enabled: true
      patterns:
        - "github.com/mycompany/* → mycompany"
        - "github.com/acme-corp/* → acme-corp"
        - "gitlab.com/contoso/* → contoso"
      fallback: "unknown"
    
    domain_from_override:
      enabled: true
      cli_flag: "--domain"
      example: "cortex lens onboard /path/to/repo --domain mycompany"
    
    precedence: "CLI override > Git remote detection > 'unknown'"

  incremental_update_algorithm:
    steps:
      1_load_existing:
        description: "Load existing domain YAML files"
        error_handling: "If file missing, create new empty structure"
      
      2_extract_knowledge:
        description: "Extract knowledge from newly onboarded repo"
        extractors:
          - "EntityExtractor (AST analysis)"
          - "WorkflowDetector (service method analysis)"
          - "ComplianceScanner (keyword detection)"
          - "TechStackAnalyzer (import/config analysis)"
          - "GlossaryBuilder (comment/docstring mining)"
      
      3_merge_knowledge:
        description: "Merge new knowledge with existing"
        strategies:
          entities: "Union properties, update prevalence"
          workflows: "Append if new, update if exists"
          compliance: "Merge gaps, update compliance scores"
          tech_stack: "Add versions, update prevalence"
          glossary: "Add terms, merge definitions"
      
      4_conflict_detection:
        description: "Detect conflicts requiring manual review"
        conflicts:
          - "Entity property type mismatch (e.g., string vs int)"
          - "Workflow step order discrepancy"
          - "Compliance gap severity disagreement"
        resolution: "Flag in YAML with CONFLICT marker"
      
      5_persist:
        description: "Write updated YAML files"
        validation: "YAML syntax check, schema validation"
      
      6_regenerate_dashboards:
        description: "Update domain dashboard with new data"
        scope: "Regenerate cortex-lens/data/domains/{domain}/index.html"

# ==============================================================================
# D3.JS VISUALIZATION SYSTEM (No Mermaid)
# ==============================================================================

d3_visualization_system:
  rationale: |
    Phase 14 Mermaid diagrams failed to render properly. Phase 15 uses ONLY
    D3.js for all visualizations, following the proven pattern from
    reference-architecture static pages.
  
  bundled_locally:
    library: "D3.js v7.8.5"
    size: "250KB minified"
    location: "cortex-lens/static/vendor/d3-7.8.5.min.js"
    cdn_fallback: false  # Must work offline
  
  existing_renderers:
    d3_call_graph:
      file: "cortex/visualization/renderers/d3_call_graph_renderer.py"
      output: "Force-directed graph (nodes=functions, edges=calls)"
      used_in: "Tab 2 (Dependencies)"
      reference: "See archive/CORTEX-5.0 commit b6a425a2 for original implementation"
    
    d3_import_graph:
      file: "cortex/visualization/renderers/d3_import_graph_renderer.py"
      output: "Module dependency graph (nodes=modules, edges=imports)"
      used_in: "Tab 2 (Dependencies)"
    
    d3_git_timeline:
      file: "cortex/visualization/renderers/d3_git_timeline_renderer.py"
      output: "Commit timeline with markers"
      used_in: "Tab 4 (Timeline)"
    
    d3_author_network:
      file: "cortex/visualization/renderers/d3_author_network_renderer.py"
      output: "Author collaboration network (force-directed)"
      used_in: "Tab 4 (Timeline)"
  
  new_renderers_phase_15:
    d3_entity_relationship:
      file: "cortex/visualization/renderers/d3_entity_relationship_renderer.py (NEW)"
      purpose: "Entity boxes with compliance color-coding"
      output: |
        <div class="entity-box entity-pci">
          <h3>Order</h3>
          <ul>
            <li>OrderId: string</li>
            <li>TotalAmount: decimal</li>
            <li>Status: enum</li>
          </ul>
          <div class="compliance-tags">
            <span class="tag-pci">PCI-DSS</span>
            <span class="tag-sox">SOX</span>
          </div>
        </div>
      used_in: "Tab 3 (Classes)"
      reference: "reference-architecture developers/domain-model.html pattern"
    
    d3_compliance_heatmap:
      file: "cortex/visualization/renderers/d3_compliance_heatmap_renderer.py (NEW)"
      purpose: "Compliance matrix (repos vs standards)"
      output: "Heatmap with color gradient (green=compliant, red=missing)"
      used_in: "Domain Dashboard Tab 4 (Compliance Matrix)"
      d3_technique: "d3.scaleSequential() with color interpolation"
    
    d3_tech_stack_heatmap:
      file: "cortex/visualization/renderers/d3_tech_stack_heatmap_renderer.py (NEW)"
      purpose: "Technology prevalence across repos"
      output: "Bubble chart (size=usage, color=category)"
      used_in: "Domain Dashboard Tab 5 (Tech Stack)"
    
    d3_workflow_diagram:
      file: "cortex/visualization/renderers/d3_workflow_diagram_renderer.py (NEW)"
      purpose: "Business workflow visualization (step sequence)"
      output: |
        Horizontal flow diagram with:
        - Step boxes (rounded rectangles)
        - Arrows with labels
        - Compliance markers (⚠️ icons)
      used_in: "Tab 1 (Overview), product/workflow-diagrams.html"
      reference: "reference-architecture workflow.html ASCII-art pattern"

  visualization_examples:
    entity_relationship_graph: |
      // D3.js force-directed graph for entities
      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2));
      
      const node = svg.selectAll(".entity")
        .data(nodes)
        .enter().append("g")
        .attr("class", d => `entity entity-${d.compliance_tag}`);
      
      node.append("rect")
        .attr("width", 150)
        .attr("height", 100)
        .attr("fill", d => complianceColor(d.compliance_tag));
    
    compliance_heatmap: |
      // D3.js heatmap for compliance matrix
      const colorScale = d3.scaleSequential()
        .domain([0, 100])
        .interpolator(d3.interpolateRdYlGn);
      
      svg.selectAll("rect")
        .data(matrixData)
        .enter().append("rect")
        .attr("x", d => xScale(d.repo))
        .attr("y", d => yScale(d.standard))
        .attr("width", cellWidth)
        .attr("height", cellHeight)
        .attr("fill", d => colorScale(d.compliance_score));

# ==============================================================================
# ONBOARDING WORKFLOW (Enhanced with Domain Knowledge)
# ==============================================================================

onboarding_workflow:
  command_signature: |
    cortex lens onboard <repo-path> [--domain <domain-name>] [--generate-personas]
  
  options:
    repo_path:
      required: true
      description: "Path to repository to analyze"
      example: "/path/to/OrderManagement"
    
    domain:
      required: false
      description: "Domain name (overrides auto-detection)"
      example: "--domain mycompany"
      auto_detect: "From git remote URL if not provided"
    
    generate_personas:
      required: false
      description: "Generate multi-persona HTML pages"
      default: true
      flag: "--generate-personas / --no-personas"
  
  execution_steps:
    step_1_domain_detection:
      description: "Detect or validate domain"
      algorithm: |
        if --domain provided:
          domain = user_provided_domain
        else:
          git_remote = get_git_remote_url(repo_path)
          domain = extract_domain_from_url(git_remote)
          if domain is None:
            domain = "unknown"
        
        log(f"Domain detected: {domain}")
    
    step_2_ast_analysis:
      description: "Run LENS analyzers (existing Phase 7.1)"
      analyzers:
        - "ASTAnalyzer (functions, classes, imports)"
        - "GitHistoryAnalyzer (commits, authors)"
        - "CommentExtractor (TODOs, docstrings)"
      outputs:
        - "ast_data.json"
        - "git_data.json"
        - "comment_data.json"
    
    step_3_business_language:
      description: "Generate business description (existing Phase 14)"
      orchestrator: "BusinessLanguageGenerator"
      file: "cortex/visualization/business_language_generator.py"
      outputs:
        - "business_description.json"
        - "capabilities.json"
        - "tech_stack.json"
    
    step_4_domain_knowledge_extraction:
      description: "Extract domain knowledge for company/domains/"
      extractors:
        entity_extractor:
          input: "ast_data.json (classes)"
          output: "entities_extracted.json"
          algorithm: |
            for each class in AST:
              if is_entity(class):  # Has ID property, persistence markers
                extract:
                  - name
                  - properties (name, type)
                  - compliance_tags (from comments, attributes)
                  - source (repo, file, line)
        
        workflow_detector:
          input: "ast_data.json (services)"
          output: "workflows_detected.json"
          algorithm: |
            for each service class:
              if method_count > 5:
                extract workflow:
                  - name (from class name)
                  - steps (from method sequence)
                  - compliance_keywords (HIPAA, PCI, IRS in comments)
                  - complexity (cyclomatic complexity sum)
        
        compliance_scanner:
          input: "ast_data.json + comment_data.json"
          output: "compliance_patterns.json"
          algorithm: |
            for each file:
              scan for keywords:
                - HIPAA, PHI, encryption, audit
                - PCI-DSS, CVV, card number, payment
                - SOX, financial, control, segregation
                - GDPR, personal data, consent
              
              detect patterns:
                - Audit trail classes (BalanceChangeAudit)
                - Encryption methods (AES, RSA)
                - Access control attributes ([Authorize])
        
        tech_stack_analyzer:
          input: "ast_data.json (imports)"
          output: "tech_stack.json"
          algorithm: |
            for each import statement:
              map to technology:
                - "using System.Data.SqlClient" → SQL Server
                - "using NServiceBus" → NServiceBus
                - "using FluentValidation" → FluentValidation
              
              extract versions from config files:
                - packages.config
                - *.csproj
        
        glossary_builder:
          input: "comment_data.json + ast_data.json"
          output: "glossary_terms.json"
          algorithm: |
            for each docstring:
              extract business terms (capitalized phrases)
              extract definitions (first sentence)
              extract regulatory references (IRS Pub, IRC Sec)
    
    step_5_domain_knowledge_merge:
      description: "Merge extracted knowledge with company/domains/{domain}/"
      orchestrator: "DomainKnowledgeMerger (NEW)"
      file: "cortex/orchestrators/domain/domain_knowledge_merger.py (NEW)"
      algorithm: |
        for each knowledge file (entities, workflows, etc):
          existing = load_yaml(f"company/domains/{domain}/{file}.yaml")
          new_data = extracted_data[file]
          
          merged = incremental_merge(existing, new_data)
          conflicts = detect_conflicts(existing, new_data)
          
          if conflicts:
            log_conflicts(conflicts)
            add_conflict_markers(merged, conflicts)
          
          save_yaml(f"company/domains/{domain}/{file}.yaml", merged)
    
    step_6_generate_repo_dashboard:
      description: "Generate static HTML dashboard for repo"
      orchestrator: "StaticVisualizationOrchestrator (NEW)"
      file: "cortex/orchestrators/support/static_visualization_orchestrator.py (NEW)"
      outputs:
        location: "cortex-lens/data/repos/{repo-slug}/"
        files:
          - "index.html (6-tab main dashboard)"
          - "data.json (aggregated analysis data)"
          - "developers/ (developer-focused pages)"
          - "managers/ (manager-focused pages)"
          - "executives/ (executive summary)"
          - "regulatory/ (compliance pages)"
          - "product/ (product manager pages)"
      
      generation_algorithm: |
        # Load templates
        templates = load_templates("cortex/visualization/templates/static/")
        
        # Render main dashboard (6 tabs)
        index_html = render_template(
          "repo-dashboard-6-tab.html",
          data={
            "repo_name": repo_name,
            "domain": domain,
            "tabs": [overview, dependencies, classes, timeline, impact, domain_context],
            "data_file": "data.json"
          }
        )
        
        # Render multi-persona pages
        if generate_personas:
          for persona in [developers, managers, executives, regulatory, product]:
            persona_dir = f"{output_dir}/{persona}/"
            os.makedirs(persona_dir, exist_ok=True)
            
            for page in persona_pages[persona]:
              html = render_template(f"{persona}/{page}.html", data=analysis_data)
              save_file(f"{persona_dir}/{page}", html)
    
    step_7_update_domain_dashboard:
      description: "Regenerate domain dashboard with updated knowledge"
      location: "cortex-lens/data/domains/{domain-slug}/"
      trigger: "After domain knowledge merge"
      orchestrator: "DomainDashboardGenerator (NEW)"
      file: "cortex/orchestrators/support/domain_dashboard_generator.py (NEW)"
      algorithm: |
        # Load all domain knowledge
        entities = load_yaml(f"company/domains/{domain}/entities.yaml")
        workflows = load_yaml(f"company/domains/{domain}/workflows.yaml")
        compliance = load_yaml(f"company/domains/{domain}/compliance.yaml")
        tech_stack = load_yaml(f"company/domains/{domain}/tech-stack.yaml")
        glossary = load_yaml(f"company/domains/{domain}/glossary.yaml")
        
        # Render 6-tab domain dashboard
        index_html = render_template(
          "domain-dashboard-6-tab.html",
          data={
            "domain": domain,
            "repos_analyzed": len(entities.get("repos_analyzed", [])),
            "tabs": [overview, entities, workflows, compliance, tech_stack, glossary]
          }
        )
        
        save_file(f"cortex-lens/data/domains/{domain-slug}/index.html", index_html)
    
    step_8_update_registries:
      description: "Update repos.json and domains.json"
      files:
        repos_json:
          location: "cortex-lens/data/repos/repos.json"
          schema: |
            {
              "repos": [
                {
                  "name": "OrderManagement",
                  "slug": "ordermanagement",
                  "domain": "acme-corp-sales",
                  "path": "/path/to/repo",
                  "analyzed": "2026-01-29T10:30:00Z",
                  "files": 256,
                  "lines": 45000,
                  "icon": "📦",
                  "description": "E-commerce order processing and fulfillment system"
                }
              ]
            }
        
        domains_json:
          location: "cortex-lens/data/domains/domains.json"
          schema: |
            {
              "domains": [
                {
                  "name": "acme-corp-sales",
                  "slug": "acme-corp-sales",
                  "repos_count": 5,
                  "last_updated": "2026-01-29T10:30:00Z",
                  "icon": "📊",
                  "description": "E-commerce sales and order management domain"
                }
              ]
            }

# ==============================================================================
# REGENERATION INSTRUCTIONS (For New Machines)
# ==============================================================================

regeneration_guide:
  purpose: |
    Since _workspaces/domain-analysis contains domain-specific data and may not
    be pushed to remote, these instructions allow recreation of the Phase 15
    architecture on a new machine by referencing archive branches.
  
  prerequisites:
    - "CORTEX repository cloned"
    - "Archive branches available (archive/CORTEX-5.0, archive/CORTEX-5.5)"
    - "Python 3.9+"
    - "D3.js bundled in cortex-lens/static/vendor/"
  
  steps:
    step_1_checkout_archives:
      commands: |
        # View archive branch history
        git log remotes/origin/archive/CORTEX-5.0 --oneline --max-count=20
        
        # Find commits related to AST and Business Language
        git log --all --grep="BusinessLanguage\|AST\|Domain-Analysis" --oneline
        
        # Key commits to reference:
        # - b6a425a2: Business language generator implementation
        # - bf847027: Business language generator (TDD)
        # - 2a9afdb6: LENS Visualization Orchestrator
    
    step_2_extract_d3_patterns:
      description: "Extract working D3.js visualization code from archive"
      files_to_reference:
        - "cortex/visualization/renderers/d3_call_graph_renderer.py"
        - "cortex/visualization/renderers/d3_import_graph_renderer.py"
        - "cortex/visualization/renderers/d3_git_timeline_renderer.py"
        - "cortex/visualization/renderers/d3_author_network_renderer.py"
      
      commands: |
        # View D3 renderer implementation from archive
        git show archive/CORTEX-5.0:cortex/visualization/renderers/d3_call_graph_renderer.py
        
        # Extract D3.js usage patterns
        git show archive/CORTEX-5.0:cortex/visualization/renderers/ | grep -A 20 "d3.forceSimulation"
    
    step_3_extract_business_language_logic:
      description: "Extract BusinessLanguageGenerator algorithm"
      files_to_reference:
        - "cortex/visualization/business_language_generator.py (current main branch)"
      
      commands: |
        # View current implementation
        cat cortex/visualization/business_language_generator.py
        
        # This file is already in main branch (419 lines)
        # Key methods:
        # - detect_capabilities() - extracts features from AST
        # - detect_tech_stack() - identifies technologies
        # - detect_architecture_pattern() - finds MVC/microservices/etc
        # - generate_description() - creates business summary
    
    step_4_review_ra_domain_analysis_pattern:
      description: "Reference architecture from reference-architecture"
      reference_structure: |
        _workspaces/reference-architecture (AST reversed)/
          ├─ index.html                  # Executive summary (main entry)
          ├─ use-cases.html              # Business use cases
          ├─ workflow.html               # Workflow diagrams
          ├─ technical.html              # Technical details
          ├─ p0-compliance.html          # Compliance gaps
          ├─ css/
          │   └─ onedrive-glass.css      # Glassmorphism styling
          ├─ js/
          │   └─ main.js                 # Minimal JavaScript
          ├─ assets/
          │   ├─ images/
          │   └─ data/ (JSON files)
          └─ {persona}/
              ├─ developers/
              │   ├─ domain-model.html
              │   ├─ complexity-heatmap.html
              │   └─ integration-architecture.html
              └─ managers/
                  ├─ team-metrics.html
                  └─ technical-debt-register.html
      
      key_patterns:
        css_glassmorphism: |
          /* From onedrive-glass.css */
          .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
          }
        
        entity_box_rendering: |
          <!-- From developers/domain-model.html -->
          <div class="entity-box entity-pci">
            <h3>Order</h3>
            <ul>
              <li>OrderId: string</li>
              <li>TotalAmount: decimal</li>
            </ul>
            <div class="compliance-tags">
              <span class="tag-pci">PCI-DSS</span>
            </div>
          </div>
        
        workflow_diagram: |
          <!-- From workflow.html -->
          <div class="workflow-diagram">
            <pre>
            ┌─────────────────────────────────────────┐
            │ Step 1: Query Orders                    │
            └─────────────────┬───────────────────────┘
                              │
                              ▼
            ┌─────────────────────────────────────────┐
            │ Step 2: Apply Business Rules            │
            │ ⚠️  COMPLIANCE: SOX Section 404         │
            └─────────────────┬───────────────────────┘
            </pre>
          </div>
    
    step_5_implement_phase_15:
      description: "Follow Phase 15 implementation tasks"
      tasks:
        - "STATIC-VIZ-001: StaticVisualizationOrchestrator"
        - "STATIC-VIZ-002: Multi-Persona HTML Generator"
        - "STATIC-VIZ-003: Domain Knowledge Accumulator"
        - "STATIC-VIZ-004: 3-Tier Dashboard Hierarchy"
        - "STATIC-VIZ-005: D3.js Visualization System"
        - "STATIC-VIZ-006: Domain Auto-Detection"
        - "STATIC-VIZ-007: Incremental Knowledge Updates"

