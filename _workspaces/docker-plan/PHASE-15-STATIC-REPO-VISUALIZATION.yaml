# ==============================================================================
# ANTI-PATTERNS (Lessons from Phase 14)
# ==============================================================================

anti_patterns:
  no_mermaid:
    reason: "Phase 14 Mermaid diagrams failed to render"
    alternative: "Use D3.js for ALL visualizations"
    evidence: "cortex-dashboard.html Mermaid blocks show 'Loading...' indefinitely"
  
  no_alpine_js:
    reason: "Over-engineered for static content"
    alternative: "Pure JavaScript or vanilla HTML"
    rationale: "Static pages don't need reactive frameworks"
  
  no_cdn_dependencies:
    reason: "Must work offline and in air-gapped environments"
    alternative: "Bundle all assets in cortex-lens/static/vendor/"
    enforcement: "Test file:/// URLs before deployment"
  
  no_api_routes:
    reason: "Static pages should not require backend server"
    alternative: "Pre-generate all data as JSON files"
    exception: "CORTEX MCP server is optional, not required for dashboards"

