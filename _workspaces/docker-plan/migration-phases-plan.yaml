# ============================================================================
# PHASE 3: NEW WIRING SYSTEM
# ============================================================================
phase_3:
  name: "Git-Backed Wiring System"
  duration: "Days 3-5"
  
  description: |
    Implement the new single-file Git-backed wiring system.
    This replaces ALL 7 previous wiring mechanisms.

  directory_structure:
    create:
      - "cortex/wiring/"
      - "cortex/wiring/registry/"
      - "cortex/wiring/specifications/"

  files_to_create:
    # Main wiring specification (SINGLE FILE)
    - path: "cortex/wiring/specifications/wiring.yaml"
      description: "SSOT for all orchestrator wiring"
      reference: "See wiring.yaml section below"
      
    # Bootstrap module
    - path: "cortex/wiring/__init__.py"
      exports:
        - "bootstrap_cortex"
        - "get_cortex"
        - "is_wired"
        - "get_wiring_hash"
        
    - path: "cortex/wiring/bootstrap.py"
      description: "Single entry point for all wiring"
      
    - path: "cortex/wiring/registry/__init__.py"
      
    - path: "cortex/wiring/registry/git_backed_registry.py"
      description: "Load orchestrators from YAML"
      
    - path: "cortex/wiring/registry/lazy_orchestrator.py"
      description: "Wire orchestrators on first access"
      
    - path: "cortex/wiring/registry/wiring_validator.py"
      description: "Validate wiring integrity"

  update_imports:
    # Update cortex/__init__.py to use new wiring
    - file: "cortex/__init__.py"
      changes:
        - remove: "from cortex.orchestrators import *"
        - add: "from cortex.wiring import bootstrap_cortex, get_cortex, is_wired"

  validation:
    - "python -c 'from cortex.wiring import bootstrap_cortex; c = bootstrap_cortex(); print(f\"Wired: {c.orchestrator_count} orchestrators\")'"

  gate:
    name: "Wiring System Gate"
    condition: "23 orchestrators wire successfully via new system"

# ============================================================================
# WIRING SPECIFICATION (SINGLE FILE)
# ============================================================================
wiring_specification:
  file: "cortex/wiring/specifications/wiring.yaml"
  
  content: |
    # =========================================================================
    # CORTEX UNIFIED WIRING SPECIFICATION
    # =========================================================================
    # Authority: CORE-035 (Single Canonical Implementation)
    # 
    # This is the SINGLE SOURCE OF TRUTH for ALL orchestrator wiring.
    # Changes require review. This file is Git-tracked and diff-able.
    #
    # Structure:
    #   orchestrators:
    #     core: [...]      # 6 core orchestrators
    #     domain: [...]    # 6 domain orchestrators
    #     support: [...]   # 11 support orchestrators
    # =========================================================================
    
    version: "2.0"
    specification_date: "2026-01-27"
    git_safe: true
    
    # -------------------------------------------------------------------------
    # GLOBAL CONFIGURATION
    # -------------------------------------------------------------------------
    config:
      lazy_initialization: true
      max_dependency_depth: 5
      allow_circular_dependencies: false
      health_check_timeout_seconds: 5
      health_check_retry_count: 3
      fail_fast_on_wiring_error: true
    
    # -------------------------------------------------------------------------
    # CORE ORCHESTRATORS (6)
    # -------------------------------------------------------------------------
    orchestrators:
      core:
        # STAGE 1: Comprehension (LENS Protocol)
        - name: "InteractionOrchestrator"
          module: "cortex.orchestrators.core.interaction_orchestrator"
          class: "InteractionOrchestrator"
          tier: 1
          priority: 10
          dependencies: []
          capabilities:
            - comprehension
            - lens_protocol
            - challenge_generation
            - pattern_enforcement
          health_check: "execute_turn"
          mcp_adapter: "cortex.mcp.adapters.interaction_adapter"
          requires_params:
            conversation_protocol:
              type: "ConversationProtocol"
              source: "cortex.brain.core.conversation_protocol"
              lazy_create: true
    
        # STAGE 2: Intent Classification
        - name: "IntentRouter"
          module: "cortex.orchestrators.core.intent_router"
          class: "IntentRouter"
          tier: 1
          priority: 20
          dependencies:
            - "InteractionOrchestrator"
          capabilities:
            - intent_classification
            - confidence_scoring
            - domain_routing
            - fuzzy_matching
          health_check: "classify_intent"
          mcp_adapter: "cortex.mcp.adapters.intent_router_adapter"
    
        # STAGE 2.5: LENS Synthesis & DoR Gate
        - name: "LENSSynthesis"
          module: "cortex.orchestrators.core.lens_synthesis"
          class: "LENSSynthesis"
          tier: 1
          priority: 25
          dependencies:
            - "IntentRouter"
          capabilities:
            - dor_generation
            - approval_gate
            - synthesis
          health_check: "synthesize"
          mcp_adapter: "cortex.mcp.adapters.lens_adapter"
    
        # Challenge Engine
        - name: "ChallengeEngine"
          module: "cortex.orchestrators.core.challenge_engine"
          class: "ChallengeEngine"
          tier: 1
          priority: 15
          dependencies:
            - "InteractionOrchestrator"
          capabilities:
            - challenge_generation
            - disagreement_detection
            - alternative_suggestion
          health_check: "generate_challenge"
          mcp_adapter: "cortex.mcp.adapters.challenge_adapter"
    
        # STAGE 3: TDD Execution
        - name: "TDDOrchestrator"
          module: "cortex.orchestrators.core.tdd_orchestrator"
          class: "TDDOrchestrator"
          tier: 1
          priority: 30
          dependencies:
            - "InteractionOrchestrator"
            - "IntentRouter"
          capabilities:
            - test_generation
            - tdd_workflow
            - test_execution
          health_check: "generate_tests"
          mcp_adapter: "cortex.mcp.adapters.tdd_adapter"
    
        # STAGE 4: Master Coordination
        - name: "MasterOrchestrator"
          module: "cortex.orchestrators.core.master_orchestrator"
          class: "MasterOrchestrator"
          tier: 1
          priority: 100
          dependencies:
            - "InteractionOrchestrator"
            - "IntentRouter"
            - "LENSSynthesis"
            - "TDDOrchestrator"
          capabilities:
            - coordination
            - stage_management
            - orchestrator_routing
          health_check: "coordinate_operation"
          mcp_adapter: "cortex.mcp.adapters.master_adapter"
          requires_params:
            orchestrators:
              type: "Dict[str, LazyOrchestrator]"
              source: "wiring_registry"
              inject_all: true
    
      # -----------------------------------------------------------------------
      # DOMAIN ORCHESTRATORS (6)
      # -----------------------------------------------------------------------
      domain:
        - name: "RefactoringOrchestrator"
          module: "cortex.orchestrators.domain.refactoring_orchestrator"
          class: "RefactoringOrchestrator"
          tier: 2
          priority: 50
          dependencies:
            - "MasterOrchestrator"
          capabilities:
            - code_refactoring
            - pattern_application
            - smell_detection
          health_check: "analyze_refactoring"
          mcp_adapter: "cortex.mcp.adapters.refactoring_adapter"
    
        - name: "PlanningOrchestrator"
          module: "cortex.orchestrators.domain.planning_orchestrator"
          class: "PlanningOrchestrator"
          tier: 2
          priority: 51
          dependencies:
            - "MasterOrchestrator"
          capabilities:
            - plan_generation
            - phase_management
            - milestone_tracking
          health_check: "generate_plan"
          mcp_adapter: "cortex.mcp.adapters.planning_adapter"
    
        - name: "DocumentationOrchestrator"
          module: "cortex.orchestrators.domain.documentation_orchestrator"
          class: "DocumentationOrchestrator"
          tier: 2
          priority: 52
          dependencies:
            - "MasterOrchestrator"
          capabilities:
            - doc_generation
            - api_documentation
            - changelog_management
          health_check: "generate_documentation"
          mcp_adapter: "cortex.mcp.adapters.documentation_adapter"
    
        - name: "PhaseExecutor"
          module: "cortex.orchestrators.domain.phase_executor"
          class: "PhaseExecutor"
          tier: 2
          priority: 53
          dependencies:
            - "PlanningOrchestrator"
          capabilities:
            - phase_execution
            - checkpoint_management
          health_check: "execute_phase"
    
        - name: "AutonomousExecutionEngine"
          module: "cortex.orchestrators.domain.autonomous_execution_engine"
          class: "AutonomousExecutionEngine"
          tier: 2
          priority: 54
          dependencies:
            - "MasterOrchestrator"
            - "TDDOrchestrator"
          capabilities:
            - autonomous_execution
            - multi_step_operations
          health_check: "execute_autonomous"
    
        - name: "ConversationOrchestrator"
          module: "cortex.orchestrators.domain.conversation_orchestrator"
          class: "ConversationOrchestrator"
          tier: 2
          priority: 55
          dependencies:
            - "InteractionOrchestrator"
          capabilities:
            - conversation_management
            - context_tracking
          health_check: "manage_conversation"
    
      # -----------------------------------------------------------------------
      # SUPPORT ORCHESTRATORS (11)
      # -----------------------------------------------------------------------
      support:
        - name: "OnboardingOrchestrator"
          module: "cortex.orchestrators.core.onboarding_orchestrator"
          class: "OnboardingOrchestrator"
          tier: 3
          priority: 60
          dependencies: []
          capabilities:
            - user_onboarding
            - tutorial_guidance
          health_check: "start_onboarding"
    
        - name: "ToolDiscoveryOrchestrator"
          module: "cortex.orchestrators.core.tool_discovery_orchestrator"
          class: "ToolDiscoveryOrchestrator"
          tier: 3
          priority: 61
          dependencies: []
          capabilities:
            - tool_discovery
            - capability_enumeration
          health_check: "discover_tools"
    
        - name: "UpgradeOrchestrator"
          module: "cortex.orchestrators.support.upgrade_orchestrator"
          class: "UpgradeOrchestrator"
          tier: 3
          priority: 62
          dependencies: []
          capabilities:
            - version_upgrade
            - migration_assistance
          health_check: "check_upgrade"
    
        - name: "RollbackOrchestrator"
          module: "cortex.orchestrators.support.rollback_orchestrator"
          class: "RollbackOrchestrator"
          tier: 3
          priority: 63
          dependencies: []
          capabilities:
            - rollback_execution
            - checkpoint_restore
          health_check: "check_rollback"
    
        - name: "SetupOrchestrator"
          module: "cortex.orchestrators.support.setup_orchestrator"
          class: "SetupOrchestrator"
          tier: 3
          priority: 64
          dependencies: []
          capabilities:
            - environment_setup
            - dependency_installation
          health_check: "check_setup"
    
        - name: "WorkflowOrchestrator"
          module: "cortex.orchestrators.core.workflow_orchestrator"
          class: "WorkflowOrchestrator"
          tier: 3
          priority: 65
          dependencies:
            - "MasterOrchestrator"
          capabilities:
            - workflow_management
            - step_orchestration
          health_check: "execute_workflow"
    
        - name: "GovernanceRegistry"
          module: "cortex.orchestrators.core.governance_registry"
          class: "GovernanceRegistry"
          tier: 3
          priority: 66
          dependencies: []
          capabilities:
            - governance_enforcement
            - rule_management
          health_check: "get_rules"
    
        - name: "KnowledgeGraph"
          module: "cortex.orchestrators.core.knowledge_graph"
          class: "KnowledgeGraph"
          tier: 3
          priority: 67
          dependencies: []
          capabilities:
            - knowledge_retrieval
            - relationship_mapping
          health_check: "query_knowledge"
    
        - name: "WrappedTDDOrchestrator"
          module: "cortex.orchestrators.core.wrapped_tdd_orchestrator"
          class: "WrappedTDDOrchestrator"
          tier: 3
          priority: 68
          dependencies:
            - "TDDOrchestrator"
          capabilities:
            - wrapped_tdd
            - enhanced_testing
          health_check: "generate_wrapped_tests"
    
        - name: "FuzzyIntentMatcher"
          module: "cortex.orchestrators.core.fuzzy_intent_matcher"
          class: "FuzzyIntentMatcher"
          tier: 3
          priority: 69
          dependencies:
            - "IntentRouter"
          capabilities:
            - fuzzy_matching
            - intent_disambiguation
          health_check: "match_intent"
    
        - name: "ComprehensionSession"
          module: "cortex.orchestrators.core.comprehension_session"
          class: "ComprehensionSession"
          tier: 3
          priority: 70
          dependencies:
            - "InteractionOrchestrator"
          capabilities:
            - session_management
            - comprehension_tracking
          health_check: "get_session"
    
    # -------------------------------------------------------------------------
    # DEPENDENCY VALIDATION RULES
    # -------------------------------------------------------------------------
    validation:
      rules:
        - name: "no_circular_dependencies"
          check: "dependency_graph_is_dag"
          severity: "ERROR"
          
        - name: "all_dependencies_exist"
          check: "all_dependency_names_in_orchestrator_list"
          severity: "ERROR"
          
        - name: "tier_ordering"
          check: "lower_tier_cannot_depend_on_higher_tier"
          severity: "WARNING"
          
        - name: "health_check_defined"
          check: "all_orchestrators_have_health_check"
          severity: "WARNING"
    
    # -------------------------------------------------------------------------
    # FALLBACK / DEGRADATION ROUTES
    # -------------------------------------------------------------------------
    fallback_routes:
      - orchestrator: "RefactoringOrchestrator"
        fallback_to: "TDDOrchestrator"
        condition: "health_check_fails"
        
      - orchestrator: "PlanningOrchestrator"
        fallback_to: "MasterOrchestrator"
        condition: "health_check_fails"
        
      - orchestrator: "DocumentationOrchestrator"
        fallback_to: "MasterOrchestrator"
        condition: "health_check_fails"

# ============================================================================
# PHASE 4: DOCKER INFRASTRUCTURE
# ============================================================================
phase_4:
  name: "Docker Infrastructure"
  duration: "Days 5-7"
  
  description: |
    Set up complete Docker infrastructure for production deployment.
    v2.1: Added persistent volumes, TLS strategy, security configuration.

  files_to_create:
    - path: "Dockerfile"
      description: "Production container definition"
      
    - path: "docker-compose.yml"
      description: "Development compose file"
      
    - path: "docker-compose.prod.yml"
      description: "Production compose file with replicas and volumes"
      
    - path: ".dockerignore"
      description: "Exclude unnecessary files from image"
      
    - path: "deployment/prometheus.yml"
      description: "Prometheus configuration"
      
    - path: "deployment/nginx.conf"
      description: "Load balancer configuration with TLS termination"
      
    - path: "deployment/tls/README.md"
      description: "TLS certificate setup instructions"

  dockerfile_spec:
    base_image: "python:3.11-slim"
    working_directory: "/app"
    exposed_port: 8443
    health_check:
      endpoint: "/health"
      interval: "30s"
      timeout: "10s"
      retries: 3
    user: "cortex"  # Non-root
    entrypoint: "uvicorn cortex.mcp.server:app --host 0.0.0.0 --port 8443"

  production_config:
    replicas: 3
    cpu_limit: "2"
    memory_limit: "4G"
    
  # v2.1: Persistent Volume Configuration
  persistent_volumes:
    description: |
      Named volumes for data that must survive container restarts.
      CRITICAL: Without these, audit logs and state are lost on restart.
      
    volumes:
      - name: "cortex-audit-logs"
        mount_path: "/app/logs"
        purpose: "Audit trail persistence (CORE-027 compliance)"
        backup_strategy: "Daily sync to object storage"
        
      - name: "cortex-state"
        mount_path: "/app/.cortex/state"
        purpose: "Conversation state, pending operations"
        backup_strategy: "Hourly snapshots"
        
      - name: "cortex-metrics"
        mount_path: "/app/metrics"
        purpose: "Prometheus metrics data"
        backup_strategy: "Optional - regenerated on restart"
        
    docker_compose_addition: |
      volumes:
        cortex-audit-logs:
          driver: local
        cortex-state:
          driver: local
        cortex-metrics:
          driver: local
          
      services:
        cortex-mcp:
          volumes:
            - cortex-audit-logs:/app/logs
            - cortex-state:/app/.cortex/state
            - cortex-metrics:/app/metrics
            
  # v2.1: TLS/Security Strategy
  security_config:
    description: |
      Security configuration for team and enterprise deployments.
      TLS termination happens at nginx reverse proxy level.
      
    tls_strategy:
      approach: "NGINX_TERMINATION"
      rationale: |
        TLS at nginx level because:
        - Simpler certificate management
        - Offloads crypto from Python workers
        - Standard industry pattern
        
      nginx_config_snippet: |
        server {
            listen 443 ssl http2;
            server_name cortex.company.com;
            
            ssl_certificate /etc/nginx/certs/cortex.crt;
            ssl_certificate_key /etc/nginx/certs/cortex.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            
            location / {
                proxy_pass http://cortex-mcp:8443;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        
    api_authentication:
      enabled: true
      method: "API_KEY"
      header: "X-CORTEX-API-KEY"
      validation: "cortex.mcp.auth.validate_api_key"
      
    rate_limiting:
      enabled: true
      per_user_rpm: 60  # Requests per minute
      burst_allowance: 10
      implementation: "nginx + in-memory counter"
    cpu_reservation: "1"
    memory_reservation: "2G"

  validation:
    - "docker build -t cortex/mcp-server:test ."
    - "docker run --rm cortex/mcp-server:test python -c 'from cortex.wiring import bootstrap_cortex; print(\"OK\")'"

  gate:
    name: "Docker Build Gate"
    condition: "Container builds and imports cortex successfully"

# ============================================================================
# PHASE 4.5: DOCKER MCP GATEWAY INTEGRATION (NEW - v2.2)
# ============================================================================
# Added: 2026-01-27
# Rationale: Leverage Docker's open-source MCP ecosystem for:
#   - Centralized routing and authentication
#   - One-click client integrations (VS Code, Claude, Cursor)
#   - Standard MCP protocol compliance
#   - Ecosystem discoverability (Docker MCP Catalog)
# Reference: https://www.docker.com/products/mcp-catalog-and-toolkit/
# ============================================================================
phase_4_5:
  name: "Docker MCP Gateway Integration"
  duration: "Day 6 (4 hours)"
  added_in_version: "2.2"
  
  description: |
    Integrate Docker's open-source MCP Gateway to enhance CORTEX deployment.
    This provides centralized routing, authentication, and client integrations
    without modifying CORTEX's core MCP implementation.
    
    KEY INSIGHT: Docker MCP Gateway sits IN FRONT of CORTEX, not inside it.
    Our cortex/mcp/server.py remains unchanged - Gateway proxies to it.

  benefits:
    - "No custom MCP routing code needed"
    - "Standard protocol compliance verified by Docker"
    - "Built-in authentication and secrets management"
    - "One-click integrations with VS Code, Claude Desktop, Cursor, Windsurf"
    - "CORTEX becomes discoverable in Docker MCP Catalog (220+ servers)"
    - "Multi-client support without custom wiring"

  compatibility_analysis:
    cortex_mcp_server:
      file: "cortex/mcp/server.py"
      status: "COMPATIBLE - No changes needed"
      reason: |
        Our FastAPI MCP server exposes standard endpoints:
        - GET /health (health check)
        - GET /mcp/tools (tool discovery)
        - POST /mcp/execute (tool execution)
        - GET /metrics (Prometheus metrics)
        Gateway proxies to these endpoints unchanged.
        
    cortex_mcp_adapters:
      files:
        - "cortex/mcp/adapters/core_adapters.py"
        - "cortex/mcp/adapters/domain_adapters.py"
        - "cortex/mcp/adapters/support_adapters.py"
      status: "COMPATIBLE - No changes needed"
      reason: |
        Adapters expose orchestrator capabilities via IOrchestratorAdapter.
        Gateway doesn't touch adapter layer - it's a network proxy.
        
    cortex_mcp_protocol:
      file: "cortex/mcp/protocol.py"
      status: "COMPATIBLE - JSON-RPC 2.0 compliant"
      reason: |
        Our MCPRequest/MCPResponse follow JSON-RPC 2.0 spec.
        Docker MCP Gateway speaks same protocol.
        
    wiring_system:
      file: "cortex/wiring/specifications/wiring.yaml"
      status: "COMPATIBLE - Orthogonal systems"
      reason: |
        Git-backed wiring is internal to CORTEX container.
        Gateway operates at network layer, not wiring layer.

  architecture:
    before_gateway: |
      ┌─────────────────────────────────────────────────────┐
      │  Client (VS Code/Claude/Cursor)                     │
      │         │                                           │
      │         ▼                                           │
      │  Manual MCP Config (per-client JSON)                │
      │         │                                           │
      │         ▼                                           │
      │  CORTEX MCP Server (port 8443)                      │
      │         │                                           │
      │         ▼                                           │
      │  23 Orchestrators via Adapters                      │
      └─────────────────────────────────────────────────────┘
      
    after_gateway: |
      ┌─────────────────────────────────────────────────────┐
      │  Clients (VS Code/Claude/Cursor/Windsurf/...)       │
      │         │                                           │
      │         ▼ (one-click integration)                   │
      │  Docker MCP Toolkit (UI in Docker Desktop)          │
      │         │                                           │
      │         ▼                                           │
      │  Docker MCP Gateway (port 6600)                     │
      │    - Centralized authentication                     │
      │    - Secrets management                             │
      │    - Multi-server routing                           │
      │         │                                           │
      │         ▼                                           │
      │  CORTEX MCP Server (port 8443, unchanged)           │
      │         │                                           │
      │         ▼                                           │
      │  23 Orchestrators via Adapters                      │
      └─────────────────────────────────────────────────────┘

  tasks:
    - id: "MCPGW-001"
      name: "Add MCP Gateway to docker-compose"
      description: "Add Docker's open-source MCP Gateway as a service"
      file: "docker-compose.yml"
      changes: |
        services:
          mcp-gateway:
            image: docker/mcp-gateway:latest
            container_name: cortex-mcp-gateway
            ports:
              - "6600:6600"  # Gateway endpoint
            environment:
              - MCP_GATEWAY_LOG_LEVEL=info
              - MCP_GATEWAY_AUTH_ENABLED=true
            volumes:
              - ./deployment/mcp-gateway-config.yaml:/etc/mcp-gateway/config.yaml:ro
            depends_on:
              cortex-mcp:
                condition: service_healthy
            networks:
              - cortex-network
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:6600/health"]
              interval: 30s
              timeout: 10s
              retries: 3

          cortex-mcp:
            # ... existing config unchanged ...
            # Gateway proxies to this service
      validation: "docker-compose config"
      
    - id: "MCPGW-002"
      name: "Create Gateway Configuration"
      description: "Configure Gateway to route to CORTEX MCP server"
      file: "deployment/mcp-gateway-config.yaml"
      content: |
        # Docker MCP Gateway Configuration for CORTEX
        version: "1.0"
        
        servers:
          cortex:
            name: "CORTEX Orchestrator"
            description: "AI-powered development orchestrator with 23 specialized orchestrators"
            url: "http://cortex-mcp:8443"
            health_endpoint: "/health"
            tools_endpoint: "/mcp/tools"
            execute_endpoint: "/mcp/execute"
            
            # Capabilities exposed to clients
            capabilities:
              - intent_classification
              - tdd_workflow
              - code_refactoring
              - documentation_generation
              - governance_enforcement
              - planning
              - deployment
            
            # Authentication (optional - handled by Gateway)
            auth:
              type: "api_key"
              header: "X-CORTEX-API-KEY"
            
            # Rate limiting
            rate_limit:
              requests_per_minute: 60
              burst: 10
        
        # Client integrations (auto-configured by Docker MCP Toolkit)
        clients:
          - name: "vscode"
            enabled: true
          - name: "claude-desktop"
            enabled: true
          - name: "cursor"
            enabled: true
          - name: "windsurf"
            enabled: true
      validation: "yamllint deployment/mcp-gateway-config.yaml"
      
    - id: "MCPGW-003"
      name: "Update docker-compose.prod.yml"
      description: "Add Gateway to production configuration"
      file: "docker-compose.prod.yml"
      changes: |
        services:
          mcp-gateway:
            image: docker/mcp-gateway:latest
            deploy:
              replicas: 2  # HA for gateway
              resources:
                limits:
                  cpus: '0.5'
                  memory: 512M
            # ... same config as dev, different scaling
      validation: "docker-compose -f docker-compose.prod.yml config"
      
    - id: "MCPGW-004"
      name: "Test Client Integrations"
      description: "Verify one-click integrations work"
      tests:
        - name: "VS Code integration"
          steps:
            - "Open Docker Desktop MCP Toolkit"
            - "Select 'CORTEX' from My Servers"
            - "Click 'Connect to VS Code'"
            - "Verify CORTEX tools appear in VS Code"
          validation: "CORTEX tools accessible in VS Code chat"
          
        - name: "Claude Desktop integration"
          steps:
            - "Open Docker Desktop MCP Toolkit"
            - "Select 'CORTEX' from My Servers"
            - "Click 'Connect to Claude Desktop'"
            - "Test: 'Use CORTEX to analyze this code'"
          validation: "Claude can invoke CORTEX orchestrators"
          
        - name: "Multi-client concurrent"
          steps:
            - "Connect VS Code, Claude, and Cursor simultaneously"
            - "Send requests from all three"
            - "Verify no conflicts or race conditions"
          validation: "All clients receive correct responses"

    - id: "MCPGW-005"
      name: "Secrets Migration"
