# ============================================================================
# PHASE 5.5: TEAM COLLABORATION LAYER (v2.1 ADDITION)
# ============================================================================
phase_5_5:
  name: "Team Collaboration Layer"
  duration: "Day 8 (4 hours)"
  version_added: "2.1"
  
  description: |
    Add team collaboration capabilities for multi-user deployments.
    This phase enables 2-10 users to share a single MCP server safely.
    
    CRITICAL: Without this phase, concurrent users may experience:
    - State conflicts (operations overwriting each other)
    - No audit attribution (can't trace who did what)
    - No access control (all users have same permissions)

  components:
    # User Session Management
    - id: "TEAM-001"
      name: "User Session Context"
      description: "Propagate user identity through all operations"
      files_to_create:
        - path: "cortex/collaboration/__init__.py"
          exports:
            - "get_current_user"
            - "set_current_user"
            - "UserContext"
            - "require_user_context"
            
        - path: "cortex/collaboration/user_context.py"
          implementation: |
            """
            User context management using contextvars.
            Thread-safe, async-safe user identity propagation.
            """
            from contextvars import ContextVar
            from dataclasses import dataclass
            from typing import Optional
            import uuid
            
            @dataclass
            class UserContext:
                user_id: str
                username: str
                roles: list[str]
                session_id: str
                
                @classmethod
                def anonymous(cls) -> "UserContext":
                    return cls(
                        user_id="anonymous",
                        username="anonymous",
                        roles=["readonly"],
                        session_id=str(uuid.uuid4())
                    )
            
            _current_user: ContextVar[Optional[UserContext]] = ContextVar(
                "current_user", default=None
            )
            
            def get_current_user() -> UserContext:
                user = _current_user.get()
                if user is None:
                    return UserContext.anonymous()
                return user
            
            def set_current_user(user: UserContext) -> None:
                _current_user.set(user)
            
            def require_user_context(func):
                """Decorator to ensure user context exists."""
                from functools import wraps
                @wraps(func)
                def wrapper(*args, **kwargs):
                    user = get_current_user()
                    if user.user_id == "anonymous":
                        raise PermissionError("User authentication required")
                    return func(*args, **kwargs)
                return wrapper

    # Operation Locking
    - id: "TEAM-002"
      name: "Operation-Level Locking"
      description: "Prevent concurrent modifications to same resources"
      files_to_create:
        - path: "cortex/collaboration/operation_lock.py"
          implementation: |
            """
            File-based operation locking for team collaboration.
            Prevents race conditions when multiple users modify same files.
            """
            import fcntl
            import os
            from contextlib import contextmanager
            from pathlib import Path
            from typing import Optional
            import time
            
            LOCK_DIR = Path("/app/.cortex/locks")
            
            @contextmanager
            def operation_lock(
                resource_id: str,
                timeout_seconds: float = 30.0,
                user_id: Optional[str] = None
            ):
                """
                Acquire exclusive lock on a resource.
                
                Usage:
                    with operation_lock("file:src/main.py"):
                        # Exclusive access to file
                        modify_file()
                """
                LOCK_DIR.mkdir(parents=True, exist_ok=True)
                lock_file = LOCK_DIR / f"{resource_id.replace('/', '_')}.lock"
                
                start = time.time()
                fd = os.open(str(lock_file), os.O_CREAT | os.O_RDWR)
                
                try:
                    while True:
                        try:
                            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                            # Write lock holder info
                            os.write(fd, f"{user_id or 'unknown'}:{time.time()}".encode())
                            break
                        except BlockingIOError:
                            if time.time() - start > timeout_seconds:
                                raise TimeoutError(
                                    f"Could not acquire lock on {resource_id} "
                                    f"after {timeout_seconds}s"
                                )
                            time.sleep(0.1)
                    yield
                finally:
                    fcntl.flock(fd, fcntl.LOCK_UN)
                    os.close(fd)

    # API Key Authentication
    - id: "TEAM-003"
      name: "API Key Authentication"
      description: "Simple API key validation for team access"
      files_to_create:
        - path: "cortex/mcp/auth.py"
          implementation: |
            """
            API Key authentication for CORTEX MCP Server.
            """
            import os
            import hashlib
            import hmac
            from typing import Optional
            from cortex.collaboration.user_context import UserContext, set_current_user
            
            # In production, load from secure vault
            API_KEYS = {
                # key_hash: UserContext
            }
            
            def load_api_keys_from_env():
                """Load API keys from environment variables."""
                # Format: CORTEX_API_KEY_<username>=<key>
                for key, value in os.environ.items():
                    if key.startswith("CORTEX_API_KEY_"):
                        username = key.replace("CORTEX_API_KEY_", "").lower()
                        key_hash = hashlib.sha256(value.encode()).hexdigest()
                        API_KEYS[key_hash] = UserContext(
                            user_id=username,
                            username=username,
                            roles=["user"],
                            session_id=""
                        )
            
            def validate_api_key(api_key: str) -> Optional[UserContext]:
                """
                Validate API key and return user context.
                Returns None if key is invalid.
                """
                if not api_key:
                    return None
                    
                key_hash = hashlib.sha256(api_key.encode()).hexdigest()
                user = API_KEYS.get(key_hash)
                
                if user:
                    import uuid
                    # Create new session for this request
                    return UserContext(
                        user_id=user.user_id,
                        username=user.username,
                        roles=user.roles,
                        session_id=str(uuid.uuid4())
                    )
                return None
            
            async def auth_middleware(request, call_next):
                """FastAPI middleware for API key authentication."""
                api_key = request.headers.get("X-CORTEX-API-KEY")
                
                if api_key:
                    user = validate_api_key(api_key)
                    if user:
                        set_current_user(user)
                
                response = await call_next(request)
                return response

    # Audit Attribution
    - id: "TEAM-004"
      name: "User-Attributed Audit Logging"
      description: "Include user identity in all audit log entries"
      files_to_update:
        - path: "cortex/infrastructure/enhanced_audit_logger.py"
          changes:
            - location: "log_operation method"
              add: |
                from cortex.collaboration.user_context import get_current_user
                user = get_current_user()
                entry["user_id"] = user.user_id
                entry["username"] = user.username
                entry["session_id"] = user.session_id

  integration:
    mcp_server_changes:
      - "Add auth_middleware to FastAPI app"
      - "Call load_api_keys_from_env() on startup"
      - "Add user context to request state"
      
    environment_variables:
      - name: "CORTEX_AUTH_ENABLED"
        default: "false"
        description: "Enable API key authentication"
        
      - name: "CORTEX_API_KEY_<username>"
        description: "API key for user (one per user)"
        example: "CORTEX_API_KEY_ALICE=abc123secret"

  validation:
    - id: "TEAM-VAL-001"
      name: "User context propagation"
      test: "Test user_id appears in audit logs"
      
    - id: "TEAM-VAL-002"
      name: "Operation locking"
      test: "Concurrent operations on same file are serialized"
      
    - id: "TEAM-VAL-003"
      name: "API key validation"
      test: "Invalid API key returns 401"

  gate:
    name: "Team Collaboration Gate"
    condition: "All TEAM-VAL tests pass"

