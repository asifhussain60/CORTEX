    - source: "_workspaces/config/"
      action: "KEEP_ALL"
      reason: "Pre-commit configs are essential"
      target: "_workspaces/config/"
      
    # KEEP: This plan
    - source: "_workspaces/docker-plan/"
      action: "KEEP_ALL"
      reason: "Migration plan documentation"
      target: "_workspaces/migration/"
      rename: true
      
    # PARTIAL: Awakening
    - source: "_workspaces/awakening-of-cortex/"
      action: "PARTIAL"
      reason: "Keep prompts and diagrams, archive chapters"
      keep:
        - "prompts/"
        - "diagrams/"
      archive:
        - "chapters/"
        - "modules/"
      target: "_workspaces/archives/awakening-of-cortex/"
      
    # REMOVE: Binary files
    - source: "_workspaces/ppt/"
      action: "REMOVE"
      reason: "Binary PDFs don't belong in Git long-term"
      archive_to: "_backups/ppt-archive/"
      
    # MERGE: Docs
    - source: "_workspaces/docs/"
      action: "MERGE"
      reason: "Merge into /docs main folder"
      target: "docs/"
      conflict_resolution: "prefer_main_docs"
      
    # PARTIAL: STS
    - source: "_workspaces/sts/"
      action: "PARTIAL"
      reason: "Keep sample-apps, archive rest"
      keep:
        - "sample-apps/"
      archive:
        - "Nathan/"
        - "*.md"
      target: "_workspaces/archives/sts/"
      
    # REMOVE: Chats
    - source: "_workspaces/.chats/"
      action: "REMOVE"
      reason: "Ephemeral, no value"

  final_structure:
    _workspaces:
      roadmap:
        status: "DEPRECATED - See DEPRECATED.md"
        note: "Historical reference only"
        files:
          - "DEPRECATED.md"
          - "cortex-impl-map.yaml (archived)"
          - "cortex-roadmap.yaml (archived)"
          - "phases/ (archived)"
          - "specs/ (archived)"
      docker-plan:
        status: "ACTIVE - CANONICAL TRACKING"
        files:
          - "migration-phases-plan.yaml (SSOT)"
          - "PHASE-7-FUTURE-ENHANCEMENTS.yaml"
          - "PHASE-*-COMPLETION-REPORT.md"
          - "docker-plan-index.md"
      vision:
        - "cortex-vision.yaml"
        - "orchestrators.yaml"
        - "innovations.yaml"
      shareable-components:
        - "README.md"
        - "architecture/"
        - "specifications/"
      config:
        - ".pre-commit-config.yaml"
        - ".pre-commit-hooks.yaml"
      archives:
        awakening-of-cortex:
          - "prompts/"
          - "diagrams/"
        sts:
          - "sample-apps/"

