# ============================================================================
# MIGRATION SCRIPT
# ============================================================================
migration_script:
  description: |
    Automated script to execute the migration.
    Run from project root.
    
  file: "scripts/migrate-to-docker.sh"
  
  content: |
    #!/bin/bash
    # CORTEX Docker-Clean Migration Script
    # Version: 2.0
    # Run: ./scripts/migrate-to-docker.sh
    
    set -e
    
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    PROJECT_ROOT="$(dirname "$SCRIPT_DIR")"
    LOG_FILE="$PROJECT_ROOT/migration-$(date +%Y%m%d_%H%M%S).log"
    
    log() {
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"
    }
    
    error() {
        log "ERROR: $1"
        exit 1
    }
    
    # -------------------------------------------------------------------------
    # PHASE 0: PRE-FLIGHT
    # -------------------------------------------------------------------------
    log "=== PHASE 0: PRE-FLIGHT CHECKS ==="
    
    cd "$PROJECT_ROOT"
    
    # Check git status
    if [[ -n $(git status --porcelain) ]]; then
        error "Uncommitted changes detected. Please commit or stash."
    fi
    
    # Check Python version
    PYTHON_VERSION=$(python --version 2>&1 | cut -d' ' -f2)
    log "Python version: $PYTHON_VERSION"
    
    # Run baseline tests
    log "Running baseline tests..."
    pytest tests/ -q --tb=no 2>&1 | tail -5 | tee -a "$LOG_FILE"
    
    # -------------------------------------------------------------------------
    # PHASE 1: BRANCH CREATION
    # -------------------------------------------------------------------------
    log "=== PHASE 1: BRANCH CREATION ==="
    
    # Create checkpoint tag
    TAG_NAME="pre-docker-migration-$(date +%Y%m%d)"
    git tag -a "$TAG_NAME" -m "Pre-Docker migration checkpoint" 2>/dev/null || true
    log "Created tag: $TAG_NAME"
    
    # Create migration branch
    git checkout -b CORTEX-docker 2>/dev/null || git checkout CORTEX-docker
    log "On branch: CORTEX-docker"
    
    # -------------------------------------------------------------------------
    # PHASE 2: LEGACY REMOVAL
    # -------------------------------------------------------------------------
    log "=== PHASE 2: LEGACY REMOVAL ==="
    
    # Batch 1: Remove legacy wiring
    log "Removing legacy wiring systems..."
    rm -f cortex/orchestrators/core/database_registry.py
    rm -f cortex/orchestrators/core/orchestrator_registry.py
    rm -f cortex/orchestrators/bootstrap.py
    rm -f cortex/orchestrators/core/db_wiring_init.py
    rm -f cortex/orchestrators/core/permanent_wiring_state.py
    rm -f cortex/orchestrators/core/autowiring_orchestrator.py
    rm -f cortex/infrastructure/wiring_contract_manager.py
    rm -f cortex/infrastructure/wiring_drift_detector.py
    git add -A && git commit -m "chore: remove legacy wiring systems" || true
    
    # Batch 2: Remove database files
    log "Removing database files..."
    find . -name "*.db" -delete
    find . -name "*.db-journal" -delete
    rm -rf cortex/migrations/
    rm -f cortex/infrastructure/database.py
    git add -A && git commit -m "chore: remove database files" || true
    
    # Batch 3: Remove cruft documentation
    log "Removing cruft documentation..."
    find . -maxdepth 1 -name "AC-*.md" -delete
    find . -maxdepth 1 -name "*COMPLETION*.md" -delete
    rm -rf _backups/
    git add -A && git commit -m "chore: remove cruft documentation" || true
    
    log "Legacy removal complete."
    
    # -------------------------------------------------------------------------
    # PHASE 3: CREATE WIRING SYSTEM
    # -------------------------------------------------------------------------
    log "=== PHASE 3: CREATE WIRING SYSTEM ==="
    
    mkdir -p cortex/wiring/registry
    mkdir -p cortex/wiring/specifications
    
    log "Wiring directory structure created."
    log "NOTE: Create wiring.yaml and Python files manually from plan."
    
    # -------------------------------------------------------------------------
    # PHASE 4: MIGRATE _WORKSPACES
    # -------------------------------------------------------------------------
    log "=== PHASE 4: MIGRATE _WORKSPACES ==="
    
    # Keep roadmap (as-is)
    log "Keeping _workspaces/roadmap/"
    
    # Rename cortex-vision to vision
    if [[ -d "_workspaces/cortex-vision" ]]; then
        mv _workspaces/cortex-vision _workspaces/vision
        log "Renamed cortex-vision to vision"
    fi
    
    # Rename docker-plan to migration
    if [[ -d "_workspaces/docker-plan" ]]; then
        mv _workspaces/docker-plan _workspaces/migration
        log "Renamed docker-plan to migration"
    fi
    
    # Create archives
    mkdir -p _workspaces/archives
    
    # Archive awakening-of-cortex (keep prompts/diagrams)
    if [[ -d "_workspaces/awakening-of-cortex" ]]; then
        mkdir -p _workspaces/archives/awakening-of-cortex
        mv _workspaces/awakening-of-cortex/prompts _workspaces/archives/awakening-of-cortex/ 2>/dev/null || true
        mv _workspaces/awakening-of-cortex/diagrams _workspaces/archives/awakening-of-cortex/ 2>/dev/null || true
        rm -rf _workspaces/awakening-of-cortex
        log "Archived awakening-of-cortex"
    fi
    
    # Archive sts (keep sample-apps)
    if [[ -d "_workspaces/sts" ]]; then
        mkdir -p _workspaces/archives/sts
        mv _workspaces/sts/sample-apps _workspaces/archives/sts/ 2>/dev/null || true
        rm -rf _workspaces/sts
        log "Archived sts"
    fi
    
    # Remove ppt
    rm -rf _workspaces/ppt
    log "Removed ppt"
    
    # Remove .chats
    rm -rf _workspaces/.chats
    log "Removed .chats"
    
    git add -A && git commit -m "chore: migrate _workspaces structure" || true
    
    # -------------------------------------------------------------------------
    # FINAL SUMMARY
    # -------------------------------------------------------------------------
    log "=== MIGRATION SUMMARY ==="
    log "Python files: $(find . -name '*.py' | wc -l | tr -d ' ')"
    log "Test files: $(find tests/ -name 'test_*.py' | wc -l | tr -d ' ')"
    log "MD files: $(find . -name '*.md' | wc -l | tr -d ' ')"
    
    log ""
    log "Migration script complete!"
    log "Next steps:"
    log "  1. Create cortex/wiring/specifications/wiring.yaml from plan"
    log "  2. Create cortex/wiring/*.py files from plan"
    log "  3. Update cortex/__init__.py imports"
    log "  4. Create Dockerfile and docker-compose.yml"
    log "  5. Run full test suite"
    log ""
    log "Log file: $LOG_FILE"

