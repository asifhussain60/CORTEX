# ============================================================================
# PHASE 1: BRANCH CREATION & BACKUP
# ============================================================================
phase_1:
  name: "Branch Creation & Backup"
  duration: "Day 1 (4 hours)"
  
  description: |
    Create the new clean branch using subtraction approach.
    Start with FULL current state, then remove unwanted files.

  tasks:
    - id: "BC-001"
      name: "Create Git Checkpoint"
      commands:
        - "git tag -a pre-docker-migration-$(date +%Y%m%d) -m 'Pre-Docker migration checkpoint'"
        - "git push origin pre-docker-migration-$(date +%Y%m%d)"
      validation: "Tag created and pushed"
      
    - id: "BC-002"
      name: "Create Migration Branch"
      commands:
        - "git checkout -b CORTEX-docker"
      validation: "On CORTEX-docker branch"
      
    - id: "BC-003"
      name: "Create Backup Archive"
      commands:
        - "mkdir -p _backups/pre-docker-$(date +%Y%m%d)"
        - "cp -r cortex/ _backups/pre-docker-$(date +%Y%m%d)/cortex/"
        - "cp -r tests/ _backups/pre-docker-$(date +%Y%m%d)/tests/"
      validation: "Backup directory created"
      
    - id: "BC-004"
      name: "Initial Commit"
      commands:
        - "git add -A"
        - "git commit -m 'chore: start CORTEX-docker migration from full state'"
      validation: "Commit created"

  gate:
    name: "Branch Creation Gate"
    condition: "On CORTEX-docker branch with backup"
    on_failure: "Restore from tag"

