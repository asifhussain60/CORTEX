# ============================================================================
# PHASE 1: IMMEDIATE NON-VISUAL FIXES (1-2 HOURS)
# ============================================================================

phase_1_immediate:
  name: "Non-Visual Enhancements"
  duration: "1-2 hours"
  priority: "HIGH"
  visual_impact: "ZERO (invisible to users)"
  
  tasks:
    task_1_1:
      name: "WCAG 2.1 AA Accessibility"
      duration: "30 minutes"
      changes:
        - id: "A11Y-001"
          description: "Add skip-to-main-content link"
          location: "After <body> tag"
          code: |
            <a href="#main-content" class="skip-link">Skip to main content</a>
          css: |
            .skip-link {
              position: absolute;
              top: -40px;
              left: 0;
              background: #00d4ff;
              color: #0a0e27;
              padding: 8px;
              text-decoration: none;
              z-index: 100;
            }
            .skip-link:focus {
              top: 0;
            }
        
        - id: "A11Y-002"
          description: "Fix ARIA labels in loading overlay"
          location: "Line ~240"
          before: '<div class="page-loading-overlay" id="pageLoadingOverlay" role="status">'
          after: '<div class="page-loading-overlay" id="pageLoadingOverlay" role="status" aria-live="polite" aria-label="Page loading">'
          additional: |
            <span class="sr-only">Loading page content, please wait</span>
        
        - id: "A11Y-003"
          description: "Add reduced-motion support"
          location: "In <style> section"
          code: |
            @media (prefers-reduced-motion: reduce) {
              *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
              }
            }
        
        - id: "A11Y-004"
          description: "Add keyboard navigation hints to tabs"
          location: "Tab button elements"
          attribute: 'aria-keyshortcuts="ArrowLeft ArrowRight Home End"'
      
      acceptance_criteria:
        - "Lighthouse Accessibility score ≥ 95"
        - "WCAG 2.1 AA compliance validated"
        - "Keyboard navigation fully functional"
        - "Screen reader tested (NVDA/JAWS)"
    
    task_1_2:
      name: "SEO Enhancement - Structured Data"
      duration: "20 minutes"
      changes:
        - id: "SEO-001"
          description: "Add JSON-LD Schema.org markup"
          location: "In <head>, before </head>"
          code: |
            <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@type": "SoftwareApplication",
              "name": "CORTEX",
              "applicationCategory": "DeveloperApplication",
              "operatingSystem": "Cross-platform",
              "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
              },
              "description": "AI-Powered Development Intelligence with MCP orchestration, 4-tier governance, and TDD mastery",
              "author": {
                "@type": "Person",
                "name": "Asif Hussain"
              },
              "featureList": [
                "23 Orchestrators",
                "4-Tier Governance",
                "MCP-First Architecture",
                "TDD Master",
                "CORTEX LENS",
                "Evidence Bundles"
              ]
            }
            </script>
        
        - id: "SEO-002"
          description: "Add canonical URL"
          location: "In <head>"
          code: '<link rel="canonical" href="https://asifhussain60.github.io/CORTEX/" />'
        
        - id: "SEO-003"
          description: "Add robots meta directive"
          location: "In <head>"
          code: '<meta name="robots" content="index, follow, max-image-preview:large" />'
        
        - id: "SEO-004"
          description: "Complete Open Graph tags"
          location: "In <head>"
          additions:
            - '<meta property="og:site_name" content="CORTEX" />'
            - '<meta property="og:locale" content="en_US" />'
            - '<meta name="twitter:card" content="summary_large_image" />'
      
      acceptance_criteria:
        - "Google Rich Results Test passes"
        - "Lighthouse SEO score = 100"
        - "Open Graph Debugger validates"
    
    task_1_3:
      name: "Security Headers - CSP"
      duration: "20 minutes"
      changes:
        - id: "SEC-001"
          description: "Add Content Security Policy"
          location: "In <head>"
          code: |
            <meta http-equiv="Content-Security-Policy" 
                  content="default-src 'self'; 
                           script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; 
                           style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com;
                           font-src 'self' cdnjs.cloudflare.com data:;
                           img-src 'self' data: https:;
                           connect-src 'self';
                           media-src 'self';
                           object-src 'none';
                           frame-ancestors 'none';
                           base-uri 'self';
                           form-action 'self';">
        
        - id: "SEC-002"
          description: "Add SRI to Font Awesome CDN"
          location: "Font Awesome link tag"
          before: '<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous"/>'
          after: |
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
                  rel="stylesheet" 
                  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
                  crossorigin="anonymous"
                  referrerpolicy="no-referrer"/>
        
        - id: "SEC-003"
          description: "Add security meta tags"
          location: "In <head>"
          code: |
            <meta http-equiv="X-Content-Type-Options" content="nosniff">
            <meta http-equiv="X-Frame-Options" content="DENY">
            <meta http-equiv="X-XSS-Protection" content="1; mode=block">
            <meta name="referrer" content="strict-origin-when-cross-origin">
      
      acceptance_criteria:
        - "Security Headers scanner passes"
        - "OWASP compliance validated"
        - "CSP violations monitored (0 errors)"
  
