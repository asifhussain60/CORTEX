      - "ANY functionality broken"
      - "Lighthouse score decrease"

# ============================================================================
# PHASE 2: PERFORMANCE OPTIMIZATION (4-8 HOURS)
# ============================================================================

phase_2_performance:
  name: "Performance Optimization"
  duration: "4-8 hours"
  priority: "MEDIUM"
  visual_impact: "ZERO (faster load, same appearance)"
  
  tasks:
    task_2_1:
      name: "Self-host Font Awesome"
      duration: "1 hour"
      rationale: "Eliminate CDN dependency, improve load time, offline support"
      steps:
        - "Download Font Awesome 6.5.1 (webfonts)"
        - "Copy to docs/assets/fonts/fontawesome/"
        - "Update CSS reference"
        - "Test icon rendering"
      
      changes:
        - id: "PERF-001"
          description: "Replace CDN with self-hosted fonts"
          before: '<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" .../>'
          after: '<link href="assets/fonts/fontawesome/all.min.css" rel="stylesheet">'
          preload: '<link rel="preload" href="assets/fonts/fontawesome/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>'
      
      acceptance_criteria:
        - "All icons render identically"
        - "Font load time < 100ms"
        - "No CDN requests in Network tab"
    
    task_2_2:
      name: "Externalize JavaScript"
      duration: "2 hours"
      rationale: "Enable caching, reduce HTML size, improve maintainability"
      steps:
        - "Extract inline JS to docs/assets/js/index.js"
        - "Maintain execution order"
        - "Add defer attribute"
        - "Test all interactions"
      
      changes:
        - id: "PERF-002"
          description: "Move inline JavaScript to external file"
          location: "Bottom of <body>"
          extract_from: "Line ~1100-1447 (3 script blocks)"
          create_file: "docs/assets/js/index.js"
          html_change: '<script src="assets/js/index.js" defer></script>'
      
      acceptance_criteria:
        - "All features work identically"
        - "No console errors"
        - "First Contentful Paint improves"
        - "JavaScript cached on repeat visits"
    
    task_2_3:
      name: "Implement Lazy Loading"
      duration: "1 hour"
      rationale: "Load below-fold content only when needed"
      changes:
        - id: "PERF-003"
          description: "Add loading='lazy' to images and iframes"
          targets:
            - "Hero logo (above fold - keep eager)"
            - "Panel images (below fold - lazy)"
            - "Video elements (lazy)"
          code: |
            <img src="..." loading="lazy" decoding="async" alt="...">
            <video src="..." loading="lazy" preload="metadata">
      
      acceptance_criteria:
        - "Above-fold content loads immediately"
        - "Below-fold deferred until scroll"
        - "LCP score improves"
    
    task_2_4:
      name: "Resource Preloading"
      duration: "30 minutes"
      changes:
        - id: "PERF-004"
          description: "Preload critical resources"
          location: "In <head>"
          code: |
            <link rel="preload" href="assets/css/main.css" as="style">
            <link rel="preload" href="assets/js/index.js" as="script">
            <link rel="preload" href="assets/images/CORTEX-logo-512.png" as="image">
    
    task_2_5:
      name: "Add Web Vitals Monitoring"
      duration: "1 hour"
      changes:
        - id: "PERF-005"
          description: "Add Web Vitals tracking"
          location: "In <head>"
          code: |
            <script type="module">
              import {onCLS, onFID, onLCP} from 'https://unpkg.com/web-vitals@3?module';
              
              function sendToAnalytics({name, value, id}) {
                console.log('Web Vital:', name, value);
                // TODO: Send to analytics endpoint
              }
              
              onCLS(sendToAnalytics);
              onFID(sendToAnalytics);
              onLCP(sendToAnalytics);
            </script>
  
  target_metrics:
    before:
      lighthouse_performance: "~70"
      lcp: "~3.5s"
      fid: "~150ms"
      cls: "~0.15"
      tti: "~4.0s"
    
    after:
      lighthouse_performance: "≥95"
      lcp: "<2.5s"
      fid: "<100ms"
      cls: "<0.1"
      tti: "<2.0s"
  
  validation:
    tools:
      - "Lighthouse (Performance)"
      - "WebPageTest.org"
      - "Chrome DevTools Performance tab"
      - "Network waterfall analysis"
    
    acceptance:
      - "Core Web Vitals GREEN for all metrics"
      - "Lighthouse Performance ≥ 95"
      - "Time to Interactive < 2s"
      - "Total page size < 100KB (gzipped)"

