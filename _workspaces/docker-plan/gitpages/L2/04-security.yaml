# ============================================================================
# MERMAID DIAGRAMS
# ============================================================================

mermaid_diagrams:
  security_architecture:
    type: "flowchart"
    title: "Security Layer Architecture"
    source: |
      flowchart TD
        Request([Incoming Request]) --> Auth[🔐 Authentication]
        Auth --> RBAC[👥 RBAC Check]
        RBAC --> InputVal[✅ Input Validation]
        InputVal --> RateLimit[⏱️ Rate Limiting]
        RateLimit --> Execute[⚙️ Execute Orchestrator]
        Execute --> AuditLog[📝 Audit Logger]
        AuditLog --> HashChain[🔗 Hash Chain]
        HashChain --> Response([Response])
        
        Auth -.->|Failed| Reject([❌ 401 Unauthorized])
        RBAC -.->|Failed| Reject2([❌ 403 Forbidden])
        InputVal -.->|Failed| Reject3([❌ 400 Bad Request])
        RateLimit -.->|Exceeded| Reject4([❌ 429 Too Many Requests])
        
        style Auth fill:#ef4444
        style RBAC fill:#f59e0b
        style InputVal fill:#10b981
        style AuditLog fill:#7b61ff
  
  cwe_patterns_mindmap:
    type: "mindmap"
    title: "6 CWE Patterns Detected"
    source: |
      mindmap
        root((CWE<br/>Patterns))
          CWE-89
            SQL Injection
            Unsanitized queries
            String concatenation
            Detection: AST analysis
          CWE-94
            Code Injection
            eval() usage
            exec() calls
            Detection: Pattern matching
          CWE-95
            Eval Injection
            Dynamic code execution
            Unsafe deserialization
            Detection: AST nodes
          CWE-22
            Path Traversal
            ../ sequences
            Unvalidated paths
            Detection: String analysis
          CWE-78
            Command Injection
            os.system() calls
            subprocess misuse
            Detection: Function calls
          CWE-327
            Weak Cryptography
            MD5/SHA1 usage
            Hardcoded keys
            Detection: Import analysis

