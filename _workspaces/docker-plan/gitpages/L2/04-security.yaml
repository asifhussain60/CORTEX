        links:
          - label: "OWASP"
            href: "owasp.html"
          - label: "SOC 2"
            href: "soc2.html"
          - label: "Training"
            href: "security-training.html"
  
  section_2_cwe_details:
    title: "🛡️ Six CWE Patterns in Detail"
    audience: ["Engineers", "Security Engineers"]
    layout: "glass-card accordion with CWE details"
    content:
      patterns:
        - cwe_id: "89"
          name: "SQL Injection"
          severity: "HIGH"
          description: "Unsanitized SQL queries allowing attacker-controlled input"
          detection_method: "AST analysis for string concatenation in SQL contexts"
          example_vulnerable: |
            query = f"SELECT * FROM users WHERE name = '{user_input}'"
            cursor.execute(query)
          example_secure: |
            query = "SELECT * FROM users WHERE name = ?"
            cursor.execute(query, (user_input,))
          mitigation:
            - "Use parameterized queries ALWAYS"
            - "ORM frameworks (SQLAlchemy)"
            - "Input validation with whitelist"
        
        - cwe_id: "94"
          name: "Code Injection"
          severity: "CRITICAL"
          description: "Dynamic code execution with untrusted input"
          detection_method: "Pattern matching for eval(), exec(), compile()"
          example_vulnerable: |
            user_code = request.POST['code']
            eval(user_code)
          example_secure: |
            # Avoid eval entirely. Use safe parsing libraries.
            import ast
            tree = ast.parse(user_code, mode='eval')
          mitigation:
            - "Never use eval() with user input"
            - "Sandboxing if dynamic execution required"
            - "Code review for exec() usage"
  
  section_3_audit_trail:
    title: "📝 Hash-Chain Audit Logging"
    audience: ["Compliance Officers", "Security Engineers"]
    layout: "glass-card with audit log viewer"
    content:
      description: |
        Every CORTEX operation logged with cryptographic hash-chain ensuring tamper-proof audit trail.
        Categories: GOVERNANCE, ORCHESTRATOR, VALIDATION, SECURITY.
      
      log_entry_example: |
        {
          "id": "uuid",
          "timestamp": "2026-01-31T10:00:00Z",
          "category": "SECURITY",
          "action": "CWE_89_DETECTED",
          "user": "dev1",
          "file": "user_repo.py",
          "line": 45,
          "severity": "HIGH",
          "previous_hash": "abc123...",
          "current_hash": "def456..."
        }
      
      prometheus_metrics:
        - "audit_entries_total{category='SECURITY'}"
        - "tamper_alerts_total"
        - "audit_chain_integrity"

