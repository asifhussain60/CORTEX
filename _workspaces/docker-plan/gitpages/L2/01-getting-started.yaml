# ============================================================================
# CONTENT SECTIONS (Role-Specific)
# ============================================================================

content_sections:
  section_1_quick_start:
    title: "⚡ Quick Start (15 Minutes)"
    audience: ["All roles"]
    layout: "glass-card with step-by-step guide"
    content:
      executive_summary: |
        Get CORTEX running in 3 commands. No complex configuration—just clone, install, and execute.
      
      steps:
        - step: 1
          title: "Clone the Repository"
          commands:
            - "git clone https://github.com/asifhussain60/CORTEX.git"
            - "cd CORTEX"
          time: "2 minutes"
          verification: "Folder `CORTEX/` exists"
        
        - step: 2
          title: "Setup Virtual Environment"
          commands:
            - "python3 -m venv .venv"
            - "source .venv/bin/activate  # macOS/Linux"
            - ".venv\\Scripts\\activate   # Windows"
            - "pip install -r requirements.txt"
          time: "8 minutes"
          verification: "(.venv) appears in terminal"
        
        - step: 3
          title: "Verify Installation"
          commands:
            - "pytest tests/ -v"
            - "python -m cortex.mcp.server --health"
          time: "3 minutes"
          verification: "All tests pass, health check returns 200 OK"
        
        - step: 4
          title: "Run Your First Orchestrator"
          commands:
            - 'python -c "from cortex.orchestrators import MasterOrchestrator; print(MasterOrchestrator.instance().execute(\\"process_request\\", request=\\"Analyze project\\"))"'
          time: "2 minutes"
          verification: "Response with orchestrator output"
      
      troubleshooting:
        - issue: "Python version < 3.10"
          solution: "Install Python 3.10+ from python.org"
        - issue: "pip install fails"
          solution: "Upgrade pip: `pip install --upgrade pip`"
        - issue: "Import errors"
          solution: "Ensure .venv is activated and in CORTEX folder"
  
  section_2_concepts:
    title: "🧠 Core Concepts (5 Minute Read)"
    audience: ["Product Owners", "Engineers"]
    layout: "glass-card grid with concept cards"
    content:
      concepts:
        - title: "MCP-First Architecture"
          icon: "🔌"
          description: |
            All CORTEX functionality exposed via MCP (Model Context Protocol) tools.
            No direct Python imports in production—everything through MCP gateway.
          example: "`cortex_process_request`, `cortex_lens_analyze`, `cortex_challenge`"
          learn_more: "../11-mcp-tools/index.html"
        
        - title: "23 Orchestrators"
          icon: "🎼"
          description: |
            7 Core + 6 Domain + 11 Support orchestrators handle everything from TDD to planning to security.
            Wired via GitBackedRegistry with health checks and fallback routes.
          example: "MasterOrchestrator → IntentRouter → TDDOrchestrator"
          learn_more: "../orchestrators/index.html"
        
        - title: "4-Tier Governance"
          icon: "🏛️"
          description: |
            Tier 0 SKULL (immutable) → Tier 1 Business → Tier 2 Engineering → Tier 3 Learned.
            EnforcementOrchestrator blocks violations in real-time.
          example: "CORE-008: Tests before code (TDD)"
          learn_more: "../architecture/four-tier-brain.html"
        
        - title: "CORTEX LENS"
          icon: "🔍"
          description: |
            Universal code intelligence: AST analysis + Git history + 6 CWE security patterns + Vision API.
            Language → Examination → Navigation → Synthesis.
          example: "Detect SQL injection, analyze commit patterns, extract TODOs"
          learn_more: "../lens/index.html"
  
  section_3_first_commands:
    title: "🎯 Essential Commands"
    audience: ["Engineers"]
    layout: "glass-card with command reference table"
    content:
      commands:
        - command: "/implement feature"
          orchestrator: "TDDOrchestrator"
          description: "Autonomous TDD implementation: RED → GREEN → REFACTOR"
          example: "/implement user authentication"
        
        - command: "/plan epic"
          orchestrator: "PlanningOrchestrator"
          description: "Break down epic into stories with DoR/DoD validation"
          example: "/plan API rate limiting system"
        
        - command: "/lens analyze"
          orchestrator: "LENSOrchestrator"
          description: "Unified code intelligence across git+AST+comments"
          example: "/lens analyze src/auth/"
        
        - command: "/refactor target"
          orchestrator: "RefactoringOrchestrator"
          description: "Intelligent refactoring with CORE-035 duplicate detection"
          example: "/refactor user_manager.py"
        
        - command: "/challenge proposal"
          orchestrator: "ChallengeEngine"
          description: "ARCH-003: Counter-proposal generation"
          example: "/challenge Add caching layer"
  
  section_4_configuration:
    title: "⚙️ Configuration"
    audience: ["Engineers"]
    layout: "glass-card with tabs (MCP, Environment, VS Code)"
    content:
      mcp_configuration:
        title: "MCP Server Configuration"
        file: ".vscode/settings.json"
        example: |
          {
            "copilot.mcp.servers": {
              "cortex": {
                "command": "python",
                "args": ["-m", "cortex.mcp.server"],
                "env": {
                  "CORTEX_ENV": "development"
                }
              }
            }
          }
      
      environment_variables:
        title: "Environment Variables"
        file: ".env"
        example: |
          # Required
          CORTEX_ENV=development
          CORTEX_LOG_LEVEL=INFO
          
          # Optional
          CORTEX_MCP_PORT=8000
          CORTEX_ENABLE_AUDIT=true
          CORTEX_TOKEN_OPTIMIZATION=true
      
      vscode_integration:
        title: "VS Code + GitHub Copilot"
        description: |
          CORTEX integrates with GitHub Copilot via MCP protocol.
          All commands available in chat interface.
        setup_steps:
          - "Install GitHub Copilot extension"
          - "Configure MCP server (settings.json)"
          - "Reload VS Code window"
          - "Test with `/cortex health` in Copilot chat"
  
  section_5_next_steps:
    title: "🚀 Next Steps"
    audience: ["All roles"]
    layout: "glass-card grid with path cards"
    content:
      paths:
        - path: "Deep Dive: Architecture"
          icon: "🏛️"
          description: "Understand 4-tier brain, orchestrator network, and MCP-first design"
          link: "../architecture/index.html"
          time: "15 minutes"
        
        - path: "Explore: CORTEX LENS"
          icon: "🔍"
          description: "Learn AST analysis, git intelligence, and security scanning"
          link: "../lens/index.html"
          time: "20 minutes"
        
        - path: "Master: TDD Workflow"
          icon: "✅"
          description: "RED → GREEN → REFACTOR with autonomous test generation"
          link: "../orchestrators/tdd-orchestrator.html"
          time: "25 minutes"
        
        - path: "Secure: OWASP Compliance"
          icon: "🛡️"
          description: "6 CWE patterns, STRIDE modeling, hash-chain audit"
          link: "../security/index.html"
          time: "30 minutes"

