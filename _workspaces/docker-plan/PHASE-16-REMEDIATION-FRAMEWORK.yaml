executive_summary:
  problem_statement: |
    During development sessions, issues are identified and fixed, but:
    - Lessons learned are not systematically captured
    - Similar issues recur in different contexts
    - Root causes are fixed but prevention measures are not implemented
    - Documentation and code drift apart over time
    
    Example (AC-PERMANENT-FIX-010):
    - DoR Intent Classification promised "Business Principles" in prompt
    - Actual code in dor_approval_gate.py never implemented this field
    - Issue persisted across multiple sessions until root cause analysis

  solution_overview: |
    Establish a Remediation Framework that:
    1. Captures lessons learned in structured YAML format
    2. Tracks permanent fixes with AC-PERMANENT-FIX-XXX identifiers
    3. Implements prevention measures (pre-commit, CI gates)
    4. Verifies documentation-code sync as part of review process

# ============================================================================
# LESSONS LEARNED REGISTRY
# ============================================================================
lessons_learned:
  
  # -------------------------------------------------------------------------
  # AC-PERMANENT-FIX-010: Business Principles in DoR Display
  # -------------------------------------------------------------------------
  AC-PERMANENT-FIX-010:
    title: "Business Principles Missing from DoR Intent Classification"
    date: "2026-01-30"
    severity: "MEDIUM"
    category: "DOCUMENTATION_CODE_SYNC"
    
    symptoms:
      - "DoR Intent Classification displayed in chat lacked Business Principles row"
      - "Prompt specified Business Principles mapping but output didn't show it"
      - "Users couldn't see how intent mapped to CORTEX governance rules"
    
    root_cause: |
      The IntentReflection dataclass in dor_approval_gate.py was missing:
      1. The `business_principles: Dict[str, str]` field definition
      2. Rendering logic in `to_markdown()` method
      3. Population logic in `_build_reflection()` method
      
      Additionally, the code used HTML `<br/>` tags instead of markdown-friendly
      ` | ` separators for multi-value fields.
    
    files_affected:
      - path: "cortex/orchestrators/core/dor_approval_gate.py"
        changes:
          - "Added business_principles field to IntentReflection dataclass"
          - "Updated to_markdown() to render Business Principles row"
          - "Updated _build_reflection() to populate principles by intent type"
          - "Changed separator from <br/> to | for markdown compatibility"
      - path: "tests/unit/orchestrators/core/test_master_orchestrator_dor_integration.py"
        changes:
          - "Updated test assertions for Business Principles verification"
          - "Fixed obsolete mock patterns (get_intent_router_factory → IntentRouter)"
    
    fix_summary: |
      1. Added `business_principles: Dict[str, str] = field(default_factory=dict)` 
         to IntentReflection dataclass
      2. Added rendering in to_markdown():
         ```python
         if self.business_principles:
             principles_str = " | ".join(
                 f"{k} → {v}" for k, v in self.business_principles.items()
             )
             lines.append(f"| **Business Principles** | {principles_str} |")
         ```
      3. Updated _build_reflection() with intent-specific mappings:
         - IMPLEMENT: Quality First → TDD, Maintainability → Type Safety
         - FIX: Stability → Root Cause Analysis, Quality First → Test Coverage
         - REFACTOR: Maintainability → Clean Code, Efficiency → Performance
    
    prevention_measures:
      - measure: "Documentation-Code Sync Check"
        description: "Pre-commit hook to verify prompt fields exist in code"
        status: "PLANNED"
        implementation: "scripts/verify_prompt_fields.py"
      - measure: "DoR Field Verification Test"
        description: "Unit test that validates all prompt fields are rendered"
        status: "IMPLEMENTED"
        implementation: "tests/unit/orchestrators/core/test_master_orchestrator_dor_integration.py"
    
    verification:
      script: "demo_business_principles.py"
      expected_output: "Business Principles | Quality First → TDD (CORE-008)"
      verified_date: "2026-01-30"

  # -------------------------------------------------------------------------
  # PATTERN: Test Mock Modernization
  # -------------------------------------------------------------------------
  TEST-MOCK-PATTERN-001:
    title: "Obsolete Mock Patterns in Test Suite"
    date: "2026-01-30"
    severity: "LOW"
    category: "TEST_INFRASTRUCTURE"
    
    symptoms:
      - "Tests using get_intent_router_factory pattern failed after refactoring"
      - "Mock patches targeted non-existent factory functions"
      - "Test isolation issues due to incorrect mock targets"
    
    root_cause: |
      Historical refactoring removed factory functions but test mocks still
      referenced them. The pattern evolved:
      - OLD: get_intent_router_factory() → returns IntentRouter
      - NEW: Direct IntentRouter instantiation
    
    fix_summary: |
      Updated mock patterns from:
      ```python
      @patch("cortex.orchestrators.core.intent_router.get_intent_router_factory")
      def test_example(self, mock_factory):
          mock_router = MagicMock()
          mock_factory.return_value = mock_router
      ```
      To:
      ```python
      @patch("cortex.orchestrators.core.intent_router.IntentRouter")
      def test_example(self, mock_router_class):
          mock_router = MagicMock()
          mock_router_class.return_value = mock_router
      ```
    
    prevention_measures:
      - measure: "Mock Target Verification"
        description: "CI check that mock targets exist in codebase"
        status: "PLANNED"
        implementation: "scripts/verify_mock_targets.py"

  # -------------------------------------------------------------------------
  # AC-PERMANENT-FIX-011: DoR Approval Prompt Simplification
  # -------------------------------------------------------------------------
  AC-PERMANENT-FIX-011:
    title: "Emoji Icons in Approval Prompts Reduce Accessibility"
    date: "2026-01-30"
    severity: "LOW"
    category: "USER_EXPERIENCE"
    
    symptoms:
      - "Emoji icons (✅ ❌ 🔄) may not render consistently across terminals"
      - "Visual clutter in approval prompts"
      - "Accessibility concerns for screen readers"
      - "Inconsistent rendering in different chat interfaces"
    
    root_cause: |
      DoR approval prompts used emoji icons to visually distinguish options:
      - ✅ "proceed" → Execute
      - ❌ "cancel" → Abort
      - 🔄 "modify: {changes}" → Adjust scope
      
      While visually appealing, this pattern has compatibility issues:
      - Some terminal emulators don't render emojis correctly
      - Screen readers may not announce emojis meaningfully
      - Adds visual noise in text-heavy chat sessions
    
    files_affected:
      - path: ".github/prompts/CORTEX.prompt.md"
        changes:
          - "Simplified DoR approval prompt format"
          - "Removed emoji icons from approval options"
          - "Use plain text: 'Shall I proceed? Or would you like to adjust the scope?'"
      - path: "cortex/orchestrators/core/dor_approval_gate.py"
        changes:
          - "Update DoRApprovalGate response templates"
          - "Simplified approval prompt rendering"
    
    fix_summary: |
      Replace emoji-based approval prompts with simple text:
      
      OLD FORMAT:
      Reply with:
      ✅ "proceed" → Execute
      ❌ "cancel" → Abort  
      🔄 "modify: {changes}" → Adjust scope
      
      NEW FORMAT:
      Shall I proceed? Or would you like to adjust the scope?
    
    prevention_measures:
      - measure: "Approval Prompt Standards"
        description: "Guidelines for accessibility-friendly approval prompts"
        status: "DOCUMENTED"
        implementation: "Phase 16 remediation patterns"
    
    verification:
      approach: "Manual review of DoR approval prompt outputs"
      verified_date: "2026-01-30"

# ============================================================================
# REMEDIATION PATTERNS
# ============================================================================
remediation_patterns:
  
  documentation_code_sync:
    name: "Documentation-Code Sync Pattern"
    description: |
      Ensures that features described in documentation (prompts, README, etc.)
      are actually implemented in code.
    
    detection:
      - "Grep for field names in prompts/copilot-instructions.md"
      - "Verify corresponding fields exist in relevant dataclasses"
      - "Check rendering methods include all fields"
    
    resolution:
      - "Identify missing fields in dataclass definitions"
      - "Add field with appropriate type and default"
      - "Update rendering/serialization methods"
      - "Add population logic in factory/builder methods"
      - "Create verification test"
    
    applicable_rules:
      - "CORE-030: Implementation Truth"
      - "CORE-029: Response Header Enforcement"

  separator_standardization:
    name: "Markdown Separator Standardization"
    description: |
      Use markdown-friendly separators instead of HTML in text output.
    
    patterns:
      incorrect: "<br/>, <br>, \\n (in table cells)"
      correct: " | "
    
    rationale: |
      HTML tags may not render correctly in all markdown contexts.
      Pipe separators (|) are universally supported and visually clear.
  
  approval_prompt_simplification:
    name: "DoR Approval Prompt Simplification"
    description: |
      Simplify approval prompts by removing emoji icons that may not render
      consistently across all terminal environments and chat interfaces.
    
    patterns:
      incorrect: |
        Reply with:
        ✅ "proceed" → Execute
        ❌ "cancel" → Abort
        🔄 "modify: {changes}" → Adjust
      
      correct: |
        Shall I proceed? Or would you like to adjust the scope?
    
    rationale: |
      - Emoji icons may not render consistently across terminals
      - Simple text is more accessible and universally readable
      - Reduces visual clutter in chat responses
      - Maintains clarity while improving compatibility
    
    applicable_rules:
      - "CORE-029: Response Format"
      - "AC-PERMANENT-FIX-010: User Experience Improvements"

