      deliverables:
        - path: "cortex/orchestrators/core/intent_router.py" (modified)
          changes: "~60 lines"
        - path: "tests/integration/test_intent_router_challenge_evidence.py"
          tests: 12
    
    - id: "PHASE-8.2-004"
      name: "PlanningOrchestrator Feasibility Check"
      priority: "P0"
      estimated_hours: "2 hours"
      
      description: |
        Add optional ChallengeOrchestrator calls for plan feasibility:
        - Check architectural constraints
