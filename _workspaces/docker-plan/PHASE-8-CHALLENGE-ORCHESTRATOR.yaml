# ============================================================================
# PHASE 8.3: RCA SYSTEM & MONITORING
# ============================================================================
phase_8_3:
  name: "RCA System, Threshold Auto-Tuning & Prometheus Monitoring"
  duration: "7-10 hours"
  priority: "P1-HIGH"
  status: "PLANNED"
  
  description: |
    Build Root Cause Analysis system to learn from challenge outcomes,
    auto-tune thresholds based on effectiveness, and expose metrics for monitoring.
  
  objectives:
    - Track challenge effectiveness (true positive vs false positive rates)
    - Auto-adjust thresholds based on RCA patterns (with approval gate)
    - Expose Prometheus metrics for team visibility
    - CLI command for RCA analysis
    - Automated reporting to stakeholders

  # Task breakdown
  tasks:
    - id: "PHASE-8.3-001"
      name: "RCA Pattern Analysis & Threshold Tuning"
      priority: "P1"
      estimated_hours: "3 hours"
      
      description: |
        Analyze challenge RCA patterns and suggest threshold adjustments:
        - Track: false positives (challenge > user proceeded safely)
        - Track: false negatives (no challenge > code broke)
        - Suggest threshold changes: high false positive → lower threshold
        - Require approval for threshold changes > 0.2
      
      deliverables:
        - path: "cortex/brain/core/challenge_rca.py" (enhanced)
          methods: "analyze_patterns(), suggest_threshold_adjustment()"
        - path: "tests/unit/brain/test_challenge_rca_analysis.py"
          tests: 20
      
      acceptance_criteria:
        - "✅ Detects false positive patterns"
        - "✅ Detects false negative patterns"
        - "✅ Suggests threshold changes with confidence"
        - "✅ Approval gate for >0.2 changes"
    
    - id: "PHASE-8.3-002"
      name: "Prometheus Metrics & Monitoring"
      priority: "P1"
      estimated_hours: "2 hours"
      
      description: |
        Expose challenge system metrics to Prometheus:
        - cortex_challenges_offered_total (by violation type)
        - cortex_challenges_accepted_total
        - cortex_challenges_bypassed_total
        - cortex_dor_initial_histogram (confidence before challenge)
        - cortex_dor_final_histogram (confidence after decision)
        - cortex_challenge_effectiveness_ratio (bypass rate by type)
      
      deliverables:
        - path: "cortex/mcp/metrics_collector.py" (modified)
          metrics: "6 new metrics"
        - path: "tests/unit/mcp/test_challenge_metrics.py"
          tests: 10
      
      acceptance_criteria:
        - "✅ All 6 metrics exported correctly"
        - "✅ Grafana dashboard "CORTEX Challenge Effectiveness" created"
        - "✅ Historical data retained (30-day retention)"
    
    - id: "PHASE-8.3-003"
      name: "CLI Commands for RCA Analysis"
      priority: "P1"
      estimated_hours: "2 hours"
      
      description: |
        Add CLI commands for RCA debugging:
        - cortex rca challenge --orchestrator=RefactoringOrchestrator --days=7
        - cortex rca effectiveness --violation-type=SRP
        - cortex rca suggest-threshold-adjustment
      
      deliverables:
        - path: "cortex/cli/commands/rca_command.py"
          lines: "~250"
        - path: "tests/unit/cli/test_rca_command.py"
          tests: 12
      
      acceptance_criteria:
        - "✅ Commands return structured JSON output"
        - "✅ Human-readable reports (markdown)"
        - "✅ Integration with audit logger"

