# ============================================================================
# PHASE 8.0: SOLID ANALYZERS & FOUNDATION
# ============================================================================
phase_8_0:
  name: "SOLID Analyzers & DoRTracker Foundation"
  duration: "18-20 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Build 5 SOLID principle analyzer plugins and DoRTracker system for detecting
    design violations and tracking per-turn confidence/decision quality.
    Foundation for all downstream Tier-3 challenge logic.
  
  objectives:
    - Create 5 pluggable SOLID analyzers (SRP, DIP, DRY, ISP, OCP)
    - Integrate with existing ChallengeEnginePlugins architecture
    - Build DoRTracker for per-turn confidence tracking
    - Add RCA data structures for post-execution analysis
    - Achieve 80%+ code coverage on all detectors
    - Zero false positives on baseline test suite

  # Task breakdown
  tasks:
    - id: "PHASE-8.0-001"
      name: "Single Responsibility Principle (SRP) Analyzer"
      priority: "P0"
      estimated_hours: "4 hours"
      
      description: |
        Detect Single Responsibility violations:
        - Classes with 3+ distinct responsibilities
        - Methods doing unrelated tasks (I/O + calculation + validation)
        - God objects (>500 lines, >20 methods)
        - Cohesion metrics (method clustering analysis)
      
      deliverables:
        - path: "cortex/orchestrators/core/solid_analyzers/srp_analyzer.py"
          lines: "~300"
        - path: "tests/unit/orchestrators/core/test_srp_analyzer.py"
          tests: 20
      
      implementation:
        class_name: "SRPAnalyzer"
        extends: "DisagreementPlugin"
        methods:
          - "analyze(file_path: Path) -> SRPViolation"
          - "detect_responsibilities(ast_tree) -> List[Responsibility]"
          - "calculate_cohesion_score() -> float"
          - "suggest_split_strategy() -> List[str]"
      
      test_coverage:
        - "Large class detection (>500 lines)"
        - "High method count (>20 methods)"
        - "Responsibility clustering"
        - "Cohesion below threshold (< 0.6)"
        - "False positive prevention (utility classes, enums)"
      
      acceptance_criteria:
        - "✅ 20/20 tests passing"
        - "✅ Detects 95%+ of SRP violations in sample codebase"
        - "✅ <2% false positive rate"
        - "✅ Confidence scoring (0.0-1.0)"
        - "✅ Evidence extraction (specific methods/lines)"
    
    - id: "PHASE-8.0-002"
      name: "Dependency Inversion Principle (DIP) Analyzer"
      priority: "P0"
      estimated_hours: "4 hours"
      
      description: |
        Detect Dependency Inversion violations:
        - Direct concrete class dependencies (vs interfaces/abstractions)
        - Circular dependencies
        - Tight coupling indicators
        - Hard-coded service locators
      
      deliverables:
        - path: "cortex/orchestrators/core/solid_analyzers/dip_analyzer.py"
          lines: "~280"
        - path: "tests/unit/orchestrators/core/test_dip_analyzer.py"
          tests: 18
      
      implementation:
        class_name: "DIPAnalyzer"
        extends: "DisagreementPlugin"
        methods:
          - "analyze(file_path: Path) -> DIPViolation"
          - "detect_concrete_dependencies() -> List[str]"
          - "detect_circular_dependencies() -> List[Cycle]"
          - "calculate_coupling_score() -> float"
      
      acceptance_criteria:
        - "✅ 18/18 tests passing"
        - "✅ Detects concrete class instantiation (new ClassName())"
        - "✅ Detects circular imports (A → B → A)"
        - "✅ Coupling score < 0.4 recommended"
    
    - id: "PHASE-8.0-003"
      name: "Don't Repeat Yourself (DRY) Analyzer"
      priority: "P0"
      estimated_hours: "3 hours"
      
      description: |
        Detect code duplication:
        - Exact code duplication (copy-paste detection)
        - Similar logic patterns (parametrized detection)
        - Duplicate error handling
        - Repeated validation logic
      
      deliverables:
        - path: "cortex/orchestrators/core/solid_analyzers/dry_analyzer.py"
          lines: "~250"
        - path: "tests/unit/orchestrators/core/test_dry_analyzer.py"
          tests: 16
      
      implementation:
        class_name: "DRYAnalyzer"
        extends: "DisagreementPlugin"
        methods:
          - "analyze(file_paths: List[Path]) -> DRYViolation"
          - "detect_exact_duplicates() -> List[Duplication]"
          - "detect_similar_patterns() -> List[PatternDuplication]"
          - "similarity_score() -> float"
    
    - id: "PHASE-8.0-004"
      name: "Interface Segregation Principle (ISP) Analyzer"
      priority: "P0"
      estimated_hours: "3 hours"
      
      description: |
        Detect Interface Segregation violations:
        - Large interfaces (>10 methods)
        - Unimplemented interface methods
        - Fat interface implementation
      
      deliverables:
        - path: "cortex/orchestrators/core/solid_analyzers/isp_analyzer.py"
          lines: "~220"
        - path: "tests/unit/orchestrators/core/test_isp_analyzer.py"
          tests: 14
      
      acceptance_criteria:
        - "✅ 14/14 tests passing"
        - "✅ Detects interfaces > 10 methods"
        - "✅ Suggests interface splits"
    
    - id: "PHASE-8.0-005"
      name: "Open/Closed Principle (OCP) Analyzer"
      priority: "P0"
      estimated_hours: "3 hours"
      
      description: |
        Detect Open/Closed violations:
        - Modification of base classes for extensions
        - Large if/else for type handling
        - Strategy pattern anti-patterns
      
      deliverables:
        - path: "cortex/orchestrators/core/solid_analyzers/ocp_analyzer.py"
          lines: "~240"
        - path: "tests/unit/orchestrators/core/test_ocp_analyzer.py"
          tests: 15
    
    - id: "PHASE-8.0-006"
      name: "DoRTracker & RCA Data Structures"
      priority: "P0"
      estimated_hours: "3 hours"
      
      description: |
        Build per-turn DoR tracking and RCA data collection system:
        - DoRTurn dataclass: track initial/final DoR, challenges, user response
        - ChallengeRCRecord: pre/post execution analysis
        - Confidence metadata: how DoR was calculated
        - Pattern learning: aggregate RCA across turns
      
      deliverables:
        - path: "cortex/brain/core/dor_tracker.py"
          lines: "~350"
        - path: "cortex/brain/core/challenge_rca.py"
          lines: "~280"
        - path: "tests/unit/brain/test_dor_tracker.py"
          tests: 25
        - path: "tests/unit/brain/test_challenge_rca.py"
          tests: 20
      
      implementation:
        classes:
          - "DoRTurn: dataclass for per-turn tracking"
          - "ChallengeRCRecord: RCA event record"
          - "DoRTracker: accumulate turns + generate statistics"
          - "RCAnalyzer: analyze patterns + suggest threshold adjustments"
      
      acceptance_criteria:
        - "✅ 45/45 tests passing"
        - "✅ Tracks: initial_dor, challenges_offered, user_response, final_dor"
        - "✅ RCA detects: false positives, false negatives, missed detections"

# ============================================================================
# PHASE 8.1: TIER-3 GATE LOGIC & CHALLENGE ROUTING
# ============================================================================
phase_8_1:
  name: "Tier-3 Gate Logic & Challenge Routing System"
  duration: "15-18 hours"
  priority: "P0-CRITICAL"
  status: "PLANNED"
  
  description: |
    Implement adaptive Tier-3 challenge gates (Hard/Soft/Context) that route
    challenges appropriately based on violation type, confidence, and DoR threshold.
    Replace single 0.7 threshold with violation-type-specific thresholds.
  
  objectives:
    - Refactor ChallengeEngine to support Tier-3 gate logic
    - Define 7 challenge types with rules (thresholds, hard/soft/context gate)
    - Implement confidence boosting from SOLID evidence
    - Add soft gate auto-proceed timing (10s default)
    - Integrate with existing DisagreementType enum
    - Full backward compatibility with existing 5 disagreement types
    - 100% test coverage on gate logic

  # Task breakdown
  tasks:
    - id: "PHASE-8.1-001"
      name: "Refactor ChallengeEngine for Tier-3 Logic"
      priority: "P0"
      estimated_hours: "5 hours"
      
      description: |
        Replace single threshold (0.7) with challenge_rules Dict:
        - Define 7 challenge types (security, harmful, SRP, arch, context, ambiguity, redundant)
        - Each has: gate_type (hard/soft/context), threshold, auto_proceed_ms
        - Implement rule lookup and application
        - Maintain backward compatibility
      
      deliverables:
        - path: "cortex/orchestrators/core/challenge_engine.py" (modified)
          changes: "~400 lines"
        - path: "tests/unit/orchestrators/core/test_challenge_engine_tier3.py"
          tests: 35
      
      implementation:
        changes_to_challenge_engine:
          - "Add challenge_rules: Dict[ViolationType, ChallengeRule]"
          - "Add ChallengeRule dataclass (threshold, gate_type, auto_proceed_ms)"
          - "Implement _apply_tier3_gates() method"
          - "Implement _calculate_soft_gate_timeout() method"
      
      acceptance_criteria:
        - "✅ 35/35 tests passing"
        - "✅ Hard gates (security, harmful) block execution"
        - "✅ Soft gates (SRP, architecture) present challenge + auto-proceed after timeout"
        - "✅ Context gates (ambiguity) ask clarifying questions"
        - "✅ All existing tests still pass (100% backward compatibility)"
    
    - id: "PHASE-8.1-002"
      name: "Confidence Boosting from SOLID Evidence"
      priority: "P0"
      estimated_hours: "4 hours"
      
      description: |
        Integrate SOLID analyzer evidence into DoR scoring:
        - SRP violation detected: boost REFACTOR intent confidence +0.25
        - DIP violation detected: boost ARCHITECTURE intent confidence +0.20
        - DRY violation detected: boost TEST/REFACTOR confidence +0.15
        - Security issue detected: boost SECURITY intent confidence +0.30
        - High complexity: boost REFACTOR/TEST confidence +0.10
      
      deliverables:
        - path: "cortex/orchestrators/core/intent_router.py" (modified)
          changes: "~150 lines"
        - path: "tests/unit/orchestrators/core/test_intent_router_confidence.py"
          tests: 25
      
      acceptance_criteria:
        - "✅ 25/25 tests passing"
        - "✅ Evidence from SOLID analyzers boosts confidence"
        - "✅ Boost amounts are correct (±0.05)"
        - "✅ DoR calculation audit trail logged"
    
    - id: "PHASE-8.1-003"
      name: "Challenge Response Formatting & Options Generation"
      priority: "P0"
      estimated_hours: "3 hours"
      
      description: |
        Format challenge responses with clear options for user:
        - Option 1: Accept CORTEX recommendation
        - Option 2: Modify request and retry
        - Option 3: Acknowledge risk and proceed (audit logged)
        - Option 4: Cancel and review manually
      
      deliverables:
        - path: "cortex/orchestrators/core/challenge_engine.py" (enhanced)
          methods:
            - "format_challenge_response(challenge) -> str"
            - "generate_challenge_options(challenge_type) -> List[str]"
      
      acceptance_criteria:
        - "✅ All challenge types have clear options"
        - "✅ Machine-readable format (JSON) for UI/CLI"
        - "✅ Human-readable format (markdown) for display"

# ============================================================================
