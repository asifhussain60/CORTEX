workflow_composer:
  status: "RETAINED — elevated to MCP bridge"
  rationale: >
    WorkflowComposer is CORTEX's enforcement spine. It contains stateful logic
    that agents cannot replicate: template resolution, governance rule injection,
    convergence tracking. Elevated to MCP tool, not replaced.
  components:
    python_core_files: 5
    template_count: "~80 YAML workflow templates"
    template_hierarchy: [Primitives, "Mode Workflows", Composites]
    mcp_endpoint: cortex_workflow
    mcp_operations: [op=compose, op=validate, op=execute]
    enforced_rules: [CORE-008, CORE-048, CORE-064, CORE-068]

response_contract:
  status: "MIGRATION — Python engine → declarative YAML spec"
  before:
    files: 27
    tokens: "46K"
    ides_supported: 1
  after:
    files: 5
    tokens: "~500"
    ides_supported: "2 primary + 3 bonus"
    spec_file: "cortex-response-spec.yaml (~500 tokens)"
    content_pools: ["300 curated quotes", "200 SDLC principles", "300 AI adoption sparks"]
    golden_format:
      name: "5-Section Golden Format"
      sections: [BLUF, "VP Coffee Test Narrative", "Structured Content", "Evidence/Traceability", Summary]
      status: "Preserved exactly — enforcement mechanism changes, structure unchanged"

architecture:
  note: >
    Key insight: agents handle the CONVERSATIONAL layer. Python MCP tools handle
    the STATEFUL ENGINE layer. This is a complement pattern, not a replacement.
  layers:
    - layer: 1
      name: Source Layer
      description: "Repository file system, git history, AST, dependency graph"

    - layer: 2
      name: Intelligence Layer
      description: "Single repo understanding pipeline — scans once, shares everywhere"
      owner: cortex-intel
      components:
        - "LENS Pipeline (4 phases within cortex-intel agent)"
        - "repo-intelligence-model.yaml (canonical shared contract)"
      fallback: "LENS phases run independently; model.yaml cached; manual override via cortex-interact"

    - layer: 3
      name: Engine Layer
      description: "Python MCP tools providing stateful logic, database access, enforcement"
      components:
        - name: "MCP Tool Server"
          purpose: "35 logical tools via stdio (74 tool files)"
        - name: "WorkflowComposer"
          purpose: "~80 YAML templates, governance rule injection"
        - name: "TDD State Machine"
          purpose: "RED-GREEN-REFACTOR cycle tracking"
        - name: "RCA Engine"
          purpose: "4 methodologies, SQLite persistence"
        - name: "Enforcement Engine"
          purpose: "Pre-commit hooks, SKULL/CORE rule checking"
        - name: "Challenge Engine"
          purpose: "3-alternative generation, blind spot detection"
        - name: "Gate Engine"
          purpose: "4 gate skills, PASS/BLOCK verdicts"
        - name: "Governance Engine"
          purpose: "SKULL rules, drift locks, convergence gates"

    - layer: 4
      name: Agent Layer
      description: "All 32 agents within this single repo, organized by capability area"
      cortex_agents: "10 (engine + governance) — .github/agents/"
      workflow_agents: "22 (workflow-delivery + knowledge-domain) — .github/agents/workflow/ and .github/agents/knowledge/"
      total_agents: 32

  request_flow: >
    User → /cortex → Agent (SKILL.md routes intent)
      → MCP Tools (Python, stateful logic, DB)
      → Governance Engine (SKULL/CORE rules, enforcement)
      → Response Assembly (golden format, content pools)

agents:
  total: 10
  design_principle: >
    Users never see agent names — /cortex routes automatically. Agents handle the
    conversational layer. Python MCP tools handle stateful logic. No agent replaces
    TDD state machine, RCA engine, or WorkflowComposer — they invoke them via MCP.
  reduction: "24 → 10 (58% fewer agents, zero capability loss)"

  roster:
    - name: cortex-code
      purpose: "All code-touching work — TDD implementation, bug fixing, refactoring, test generation"
      absorbs: [cortex-build, cortex-fix, cortex-refactor]
      intents_served: [IMPLEMENT, FIX, REFACTOR, TEST]
      triggers: ["build", "create", "add", "fix", "bug", "refactor", "improve", "test", "tdd"]
      governance: [CORE-008, CORE-048, CORE-064, CORE-068]
      mcp_dependencies: ["cortex_workflow (TDD templates)", "cortex_tdd (state machine)", "cortex_context (session)"]
      lens_required: true
      dor_required: true

    - name: cortex-diagnose
      purpose: "All troubleshooting — multi-stack debugging (8 strategies), root cause analysis (4 methodologies)"
      absorbs: [cortex-debug, cortex-root-cause]
      intents_served: [DEBUG, RCA]
      triggers: ["debug", "trace", "root cause", "rca", "diagnose"]
      mcp_dependencies: ["cortex_rca (4 methodologies, SQLite)", "cortex_context (session)"]
      lens_required: true

    - name: cortex-audit
      purpose: "Governance scanning, health, cleanup, YAML cross-validation, convergence"
      absorbs: [cortex-audit, cortex-cleanup, cortex-knowledge-guardian]
      intents_served: [AUDIT, TOTALRECALL, HEALTH, GOVERNANCE, VALIDATE, VACUUM]
      triggers: ["/audit", "scan", "check", "/totalrecall", "/health", "governance", "/vacuum"]
      mcp_dependencies: ["cortex_governance (rule checking)", "cortex_registry (YAML validation)"]
      lens_required: true

    - name: cortex-orchestrate
      purpose: "Feature delivery lifecycle — delegates to internal workflow capability pipeline, enforces CORTEX gates"
      absorbs: [cortex-feature-orchestrator, cortex-plan, cortex-smart-delegator]
      intents_served: [PLAN, DESIGN, REQUIREMENTS, CHANGE_INTELLIGENCE, WORKFLOW, MIGRATE]
      triggers: ["plan", "roadmap", "architect", "design", "requirements", "/workflow", "migrate"]
      workflow_delegation: >
        Delegates to WORKFLOW smart-delegator, architect, pm-intent-creator, story-implementer.
        CORTEX provides governance enforcement at gate boundaries. Internal workflow
        capability agents provide workflow execution.
      mcp_dependencies: ["cortex_workflow (templates)", "cortex_context (session)"]

    - name: cortex-intel
      purpose: "All repo intelligence — onboarding, LENS 4-phase scan, model.yaml production"
      absorbs: [cortex-onboard, cortex-lens-language, cortex-lens-structure, cortex-lens-mapping, cortex-lens-synthesis]
      intents_served: [ONBOARD, ANALYZE, INVESTIGATE]
      triggers: ["onboard", "bootstrap", "scan repo", "analyze", "investigate"]
      output: "repo-intelligence-model.yaml (canonical shared contract)"
      fallback: "LENS phases run independently; model.yaml cached; manual override"

    - name: cortex-distill
      purpose: "Content ingestion and learning — 3-pipeline digest, session distillation, training"
      absorbs: [cortex-distill]
      intents_served: [DIGEST, DISTILL, TRAIN, FEEDBACK, SYNC]
      triggers: ["digest", "summarize", "ingest", "/distill", "/train", "/feedback", "/sync"]

    - name: cortex-present
      purpose: "All output generation — PR walkthroughs, HTML exhibits, documentation"
      absorbs: [cortex-pr, cortex-html-render, cortex-document]
      intents_served: [REVIEW, CONVERT_TO_HTML, DOCUMENT]
      triggers: ["/review", "review PR", "html", "generate report"]
      design_system: "CORTEX Dark Glassmorphism v2.0 (Inter + cyan #00d4ff)"

    - name: cortex-lint
      purpose: "13-dimension holistic Definition of Done enforcement + AC verification"
      intents_served: ["(quality gate — invoked by other agents, not directly by users)"]
      dimensions: 13

    - name: cortex-interact
      purpose: "Q&A, codebase questions, requirement clarification, onboarding introduction"
      absorbs: [cortex-query, cortex-ask]
      intents_served: [QUERY, INTRODUCE, REPHRASE]
      triggers: ["explain", "how", "what", "why", "hello"]

    - name: cortex-platform
      purpose: "CI/CD deployment, skill catalog management, archetype loading"
      absorbs: [cortex-deploy, cortex-skill-catalog, cortex-archetype-loader]
      intents_served: [DEPLOY, WORKFLOW_COMPOSE]
      triggers: ["deploy", "release", "ship"]

gate_skills:
  total: 4
  note: >
    Reduced from 7 to 4. Removed gate-compliance (SKULL/CORE already enforce),
    gate-traceability (git hooks + PR templates already enforce), gate-evidence
    (premature certification infrastructure). 4 gates at real decision points.
  gates:
    - id: gate-readiness
      stage: "Before work starts"
      purpose: "DoR enforcement — validates ACs, scope, dependencies, security scope"
      criteria:
        - "Acceptance criteria defined (≥3 measurable ACs)"
        - "Scope bounded (≤500 LOC estimated)"
        - "Dependencies identified"
        - "Security scope assessed (auth/PII/external data)"

    - id: gate-security
      stage: "Before code merges"
      purpose: "6-point security checklist"
      criteria:
        - "No untrusted external data sources"
        - "No prompt injection vectors"
        - "No arbitrary code execution"
        - "No hardcoded credentials"
        - "Dependencies pinned to versions"
        - "Permissions match stated scope"

    - id: gate-review
      stage: "Before PR approval"
      purpose: "PR quality readiness — walkthrough + approval"
      criteria:
        - "PR walkthrough generated"
        - "≥1 reviewer approval"
        - "CI green"

    - id: gate-deployment
      stage: "Before ship"
      purpose: "Deployment readiness — CI/CD + health"
      criteria:
        - "All CI checks pass"
        - "Health probe returns 200"
        - "No P0 errors"
        - "MCP server health verified"

feature_delivery_lifecycle:
  name: "CORTEX Feature Delivery Lifecycle (Internal WORKFLOW Capability)"
  note: >
    CORTEX orchestrates the lifecycle. The internal workflow capability area
    executes it within this repository. The Intent→Story→Archetype→Skill→Code
    chain is implemented in-repo, with CORTEX enforcing governance at 4 boundaries.
  stages:
    - stage: 1
      name: Express Intent
      cortex_agent: cortex-orchestrate
      workflow_agent: pm-intent-creator
      gate: gate-readiness
      description: "User describes what they want. DoR validated. Requirements structured."

    - stage: 2
      name: Understand
      cortex_agent: cortex-intel
      workflow_agent: architect
      gate: null
      description: "LENS scans repo. Architecture patterns loaded. Story decomposed."

    - stage: 3
      name: Implement
      cortex_agent: cortex-code
      workflow_agent: dev-story-implementer
      gate: gate-security
      description: "TDD-first implementation. WORKFLOW story-implementer follows Intent→Story→Code chain."
      feedback_loop: "← Stage 5 (needs_refinement) · max 3 cycles"

    - stage: 4
      name: Test + Document
      cortex_agent: cortex-lint + cortex-present
      workflow_agent: test-proposer
      gate: null
      description: "Coverage validation, documentation synthesis, PR walkthrough generation."

    - stage: 5
      name: Review
      cortex_agent: cortex-present
      workflow_agent: test-critic
      gate: gate-review
      description: "PR created with walkthrough. Challenge gate fires. Review feedback."
      feedback_loop: "→ Stage 3 (refine) or → Stage 6"

    - stage: 6
      name: Deploy
      cortex_agent: cortex-platform
      workflow_agent: gate-deployment-readiness
      gate: gate-deployment
      description: "Git publish, CI/CD pipeline, deployment verification."

    - stage: 7
      name: Monitor
      cortex_agent: cortex-audit
      gate: null
      description: "Post-deployment health probe. Degradation triggers Stage 2."
      feedback_loop: "→ Stage 2 (degradation detected)"

python_deprecation_strategy:
  approach: "Incremental 3-Wave Deprecation"
  note: >
    The repo has 381 orchestrator files containing two categories of logic.
    Category A (stateful engine) stays as MCP tools. Category B (routing/delegation)
    is deprecated as agents prove replacement. No big-bang archive.

  category_a_retained:
    name: "Stateful Engine Logic — KEPT as MCP tools"
    components:
      - "MasterOrchestrator with 7 mixins (knowledge, registry, request, response, stages)"
      - "TDDOrchestrator with RED-GREEN-REFACTOR state machine"
      - "RCAEngine with 4 methodologies and SQLite persistence"
      - "EnforcementOrchestrator with pre-commit hooks"
      - "HolisticValidationOrchestrator with 3-alternative challenge engine"
      - "WorkflowComposer with ~80 YAML templates"
      - "IntentRouter with challenge generation (routing logic kept until agents prove parity)"
      - "InteractionOrchestrator with DoR tracking"

  category_b_deprecated:
    name: "Routing/Delegation Logic — DEPRECATED as agents replace"
    waves:
      - wave: 1
        name: "Pure Routing"
        scope: "Orchestrators that only classify intent and delegate"
        estimated_files: "~80-100"
        validation: "Agent routing E2E test covers all 34 intent types"
        rollback: "Restore from _legacy/ if agent routing fails for >3 intents"

      - wave: 2
        name: "Response Formatting"
        scope: "Orchestrators that only format/template responses"
        estimated_files: "~60-80"
        validation: "Response contract test verifies golden format across 2 surfaces"
        rollback: "Restore from _legacy/ if format degradation detected"

      - wave: 3
        name: "Delegation Chains"
        scope: "Orchestrators that chain multiple sub-orchestrators"
        estimated_files: "~80-100"
        validation: "E2E lifecycle test exercises all 7 stages"
        rollback: "Restore from _legacy/ if lifecycle test fails"

  test_preservation:
    note: >
      1,428 test files exist in the repo. These are NOT archived. Tests remain
      active and validate that agent replacements produce identical behavior to
      the orchestrators they replace. Test files are the proof mechanism for
      zero-capability-loss during deprecation.
    strategy:
      - "All existing tests remain active throughout deprecation"
      - "Each deprecation wave adds comparison tests: agent output vs orchestrator output"
      - "Tests that cover deprecated orchestrators are refactored to test the replacement agent + MCP tool combination"
      - "Smoke test suite (26 drift-lock checks) runs before and after each wave"
      - "No orchestrator file moves to _legacy/ until its tests pass against the agent replacement"

testing_strategy:
  name: "3-Layer Pragmatic Testing"
  note: >
    Replaces the 8-layer Release Evidence Mesh. Focuses on tests that actually
    catch bugs, not ceremony that produces signed artifacts.

  existing_test_base:
    test_files: 1428
    test_runner: "python scripts/run_tests.py"
    modes:
      - mode: preflight
        command: "python scripts/run_tests.py preflight"
        duration: "<10s"
        when: "Every audit gate"
      - mode: changed
        command: "python scripts/run_tests.py changed"
        duration: "varies"
        when: "TDD inner loop"
      - mode: smoke
        command: "python scripts/run_tests.py smoke"
        duration: "<60s"
        when: "Pre-commit, pre-merge"
      - mode: unit
        command: "python scripts/run_tests.py unit"
        duration: "varies"
        when: "Default local dev"

  layer_1_smoke:
    name: "Smoke Tests"
    description: "Fast validation that nothing is broken"
    includes:
      - "26 drift-lock checks (governance alignment)"
      - "YAML schema validation (802+ YAMLs parse clean)"
      - "MCP tool server starts and responds to health check"
      - "All agent SKILL.md files have valid YAML frontmatter"
    frequency: "Every commit, every PR, every deprecation wave"
    duration: "<60s"

  layer_2_agent_routing_e2e:
    name: "Agent Routing E2E"
    description: "Validates all 34 intent types route to correct agents and produce valid output"
    includes:
      - "34 intent type → agent routing tests"
      - "Top 10 most-used intents validated with full response"
      - "Agent → MCP tool invocation chain tested"
      - "Comparison tests: agent output vs deprecated orchestrator output"
    frequency: "Before each deprecation wave, every release"
    duration: "<5 min"

  layer_3_self_onboard:
    name: "Self-Onboard"
    description: "CORTEX onboards itself — the ultimate integration test"
    includes:
      - "cortex-intel scans Cortex itself"
      - "Produces valid repo-intelligence-model.yaml"
      - "All downstream agents consume model.yaml successfully"
      - "Single-repo capability discovery finds all 137 planned skills in Cortex"
    frequency: "Every release, P5 certification"
    duration: "<2 min"

  deprecation_wave_test_protocol:
    description: "Protocol executed for each of the 3 deprecation waves"
    steps:
      - "1. Run full smoke suite — establish baseline"
      - "2. Run agent routing E2E for all intents affected by this wave"
      - "3. Run comparison tests: agent output vs orchestrator output for affected intents"
      - "4. If all pass: move orchestrator files to _legacy/"
      - "5. Re-run full smoke suite — confirm no regression"
      - "6. If any failure: restore from _legacy/, investigate, fix, retry"
      - "7. Existing 1428 test files must still pass (refactored to test agent+MCP path)"

gap_closure_matrix:
  intent: "Eliminate partial planning, deferred capability scope, and weak verification seams"
  gaps:
    - id: GAP-001
      name: "Partial capability rollout"
      previous_state: "P3 delivered only minimum workflow subset"
      risk: "Lifecycle appears complete while capability graph is incomplete"
      closure_action: "P3 now requires full 22 workflow agents + 10 knowledge agents + 137 skills"
      validation: "Phase gate enforces full count and discovery checks"

    - id: GAP-002
      name: "Discovery uncertainty"
      previous_state: "Skill discovery noted as uncertain with future validation"
      risk: "Primary surfaces may pass smoke while failing real capability discovery"
      closure_action: "P3 and P4 now require deterministic discovery validation across primary surfaces"
      validation: "Surface B pass criteria require 32 agents and 137 skills discoverable"

    - id: GAP-003
      name: "Inconsistent single-repo narrative"
      previous_state: "Some sections implied external workflow dependency"
      risk: "Operational ownership and onboarding ambiguity"
      closure_action: "Lifecycle and onboarding language normalized to internal capability areas"
      validation: "Single-repo integration tests required in P5"

    - id: GAP-004
      name: "Insufficient robustness proof"
      previous_state: "E2E acceptance centered on one scenario"
      risk: "Blind spots in analyze/document modes"
      closure_action: "P3 lifecycle matrix expanded to develop + analyze + document scenarios"
      validation: "All three scenarios must pass all 7 stages with 4 gates"

    - id: GAP-005
      name: "Certification drift risk"
      previous_state: "Layer-2 testing manual in final phase"
      risk: "Non-repeatable release qualification"
      closure_action: "P5 uses explicit layer-2 command and convergence enforcement"
      validation: "3-layer suite and convergence gate must pass before tagging"

