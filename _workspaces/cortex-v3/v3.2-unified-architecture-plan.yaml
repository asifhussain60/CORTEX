          - "Verify @cortex agent appears in Copilot Chat"
          - "Run @cortex introduce — responds with CORTEX identity"
          - "Run @cortex audit — responds with governance scan"
          - "Verify all 32 agents discoverable and routable"
          - "Verify all 137 skills discoverable by configured paths"
        pass_criteria: "@cortex responds correctly in VS Code Copilot Chat; full discovery validated for 32 agents and 137 skills"

      - step: "Execution Status Sync"
        name: "Update execution dashboard status for P4"
        file: "_workspaces/cortex-v3/v32-plan/execution.html"
        description: "Sync P4 row with wave completion progress and deployment surface validation state"
        pass_criteria: "Dashboard reflects P4 status and readiness for P5"

    gate: "All 3 deprecation waves complete with tests passing, both primary surfaces fully validated, full 32-agent/137-skill discovery verified, 1428 tests all pass, _legacy/ contains deprecated files"
