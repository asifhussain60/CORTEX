      capabilities: "Issues, PRs, branches, repos, search"

    cortex_local:
      standard: "CORTEX Local MCP Server"
      command: "python -m cortex.mcp"
      transport: "stdio"
      logical_tools: 35
      tool_files: 74
      rate_limit: "50 rps steady-state, 100 burst"

  workspace_config:
    path: ".vscode/mcp.json"

deployment_surfaces:
  primary:
    - name: "Claude Code CLI"
      setup: "Copy CLAUDE.md to ~/.claude/CLAUDE.md + /cortex command"
      best_for: "Terminal-based coding, TDD cycles, git workflows"
    - name: "VS Code Copilot"
      setup: "Register skill paths + configure MCP servers"
      best_for: "IDE-integrated coding with Copilot Chat"
  bonus:
    - name: "Claude Desktop (Cowork)"
      setup: "Install cortex.skill"
      best_for: "File automation, doc creation"
    - name: "Cursor"
      setup: "SKILL.md auto-discovered via project context"
    - name: "Gemini CLI"
      setup: "SKILL.md auto-discovered via context"
  note: >
    Primary surfaces get tested and validated. Bonus surfaces work because
    SKILL.md is markdown — they either work or they don't. No surface parity
    testing needed for markdown files.

governance_model:
  approach: "2-Layer Governance (not 3-tier)"
  note: >
    ADRs document decisions for human reference. They are NOT a governance tier.
    Governance enforcement has 2 layers: SKULL/CORE rules (what) and gate skills (how).
  layers:
    - layer: 1
      name: "SKULL + CORE Rules — Enforceable Policies"
      purpose: "Define requirements that must be enforced"
      count: "40+ SKULL + 70+ CORE"
      nature: "Living rules (versioned evolution)"

    - layer: 2
      name: "Gate Skills — Automated Enforcement"
      purpose: "Enforce compliance through PASS/BLOCK verdicts at 4 boundaries"
      count: "4 gate skills"
      nature: "Mutable (update with rules)"

  adrs:
    purpose: "Historical record of WHY decisions were made — documentation, not enforcement"
    count: 13
    nature: "Immutable (append-only via supersede)"

removed_from_v31:
  note: >
    The following v3.1 components were withdrawn as overengineered for the current
    stage of the framework (single developer, 3 known repos, no third-party plugins).
    Each can be reintroduced when the trigger condition is met.
  items:
    - component: "Release Evidence Mesh (ADR-V3-014)"
      reason: "8-layer verification with 7 signed artifacts is NASA-level for markdown skills"
      replacement: "3-layer pragmatic testing (smoke, routing E2E, self-onboard)"
      reintroduce_when: "Multi-team releases require formal audit trails"

    - component: "Plugin Governance (ADR-V3-013)"
      reason: "SHA-256 signing, trust levels, compatibility matrices — no third-party plugins exist"
      replacement: "Simple skill path registration with CORTEX governance override"
      reintroduce_when: "Third-party contributors actually appear"

    - component: "gate-compliance"
      reason: "SKULL/CORE rules already enforce code quality and patterns"
      replacement: "SKULL/CORE enforcement via existing infrastructure"
      reintroduce_when: "Teams bypass SKULL/CORE — unlikely since it's automated"

    - component: "gate-traceability"
      reason: "Git hooks and PR templates already enforce commit→story→feature tracing"
      replacement: "Existing git hooks and PR templates"
      reintroduce_when: "Traceability gaps appear in audit"

    - component: "gate-evidence"
      reason: "Premature certification infrastructure"
      replacement: "3-layer testing validates release readiness"
      reintroduce_when: "Compliance or regulatory requirements demand signed evidence"

    - component: "Surface Parity Testing"
      reason: "SKILL.md files are markdown — they work or they don't across surfaces"
      replacement: "Test 2 primary surfaces. Bonus surfaces work by definition."
      reintroduce_when: "Behavior actually diverges across IDEs (unlikely for markdown)"

    - component: "76 DoD checks across 15 categories"
      reason: "More verification than most production SaaS — ceremony without value"
      replacement: "40 DoD checks across 8 categories — focused on what matters"
      reintroduce_when: "Team size grows beyond single developer"

    - component: "cortex-master-v3.yaml"
      reason: "cortex-master-v2.yaml already serves as architect mode marker"
      replacement: "Continue using cortex-master-v2.yaml"
      reintroduce_when: "v2 schema is genuinely insufficient"

team_adoption:
  onboarding_steps:
    - step: 1
      action: "Clone Cortex monorepo"
      duration: "5 minutes"
    - step: 2
      action: "Register in-repo skill paths and agent paths in VS Code settings"
      duration: "2 minutes"
    - step: 3
      action: "Configure .vscode/mcp.json with GitHub MCP server"
      duration: "1 minute"
    - step: 4
      action: "Run cortex-onboard to generate model.yaml for team's repo"
      duration: "2 minutes"
    - step: 5
      action: "Author first domain skill using SKILL-AUTHORING.md guide"
      duration: "30 minutes"
    - step: 6
      action: "Submit skill PR — gate-security validates before merge"

registry_governance:
  adr: ADR-V3-015
  title: "Registry Taxonomy Freeze — Anti-Sprawl Governance"
  status: ACCEPTED
  date: "2026-03-27"

  problem_statement: >
    The cortex-registry has grown to 802 YAMLs across 23 top-level directories with no
    declared schema for where new files belong. Templates exist in 4 locations, governance
    concepts span 3 directories, phases are duplicated in 3 locations, and 200 planning
    YAMLs have no expiry. Any agent or developer can create a new top-level directory
    without governance — causing the registry to sprawl indefinitely.

  current_state:
    total_yamls: 802
    top_level_directories: 23
    sprawl_symptoms:
      - issue: "Templates in 4 locations"
        locations: ["artifacts/templates/", "metrics/dashboards/templates/", "templates/", "workflows/templates/"]
      - issue: "Governance in 3 locations"
        locations: ["governance/", "rules/", "core/"]
      - issue: "Phases in 3 locations"
        locations: [".archive/cortex-master-v1/phases/", "artifacts/templates/phases/", "planning/phases/"]
      - issue: "Loose files at registry root"
        offenders: ["cortex-master-v2.yaml (exception — it IS the index)", "yaml-reader.html (must move)"]
      - issue: "No schema_version or namespace on most YAMLs"
      - issue: "200 planning YAMLs with no TTL — completed plans never archived"

  solution:
    rules:
      - rule: "REGISTRY-001: Taxonomy Freeze"
        description: >
          No new top-level directories without a new ADR. Attempting to create a directory
          outside the 8 canonical namespaces fails with a governance error from registry_manager.py.

      - rule: "REGISTRY-002: Schema-First YAML Creation"
        description: >
          Every new YAML must declare schema_version and namespace in its front-matter.
          registry_manager.py validates before write. YAMLs missing these fields are flagged
          UNREGISTERED on next convergence gate run.
        required_fields:
          - "schema_version: '1.0'"
          - "namespace: <one of the 8 canonical namespaces>"

      - rule: "REGISTRY-003: No Loose Files at Registry Root"
        description: >
          Registry root may only contain README.md and cortex-master-v2.yaml (the index).
          All other files must live in a canonical namespace directory.

      - rule: "REGISTRY-004: TTL Policy (Time-to-Live)"
        description: >
          Every YAML in planning/ must declare status (ACTIVE|COMPLETED) or expires_after date.
          Convergence gate auto-archives COMPLETED files 30 days after completion_date,
          and ACTIVE files past their expires_after date, moving them to _archive/.
        status_values:
          - "ACTIVE: reviewed quarterly, no TTL"
          - "COMPLETED + completion_date: auto-archived 30 days post-completion"
          - "expires_after: YYYY-MM-DD: auto-archived on date"

      - rule: "REGISTRY-005: Duplicate Detection on Write"
        description: >
          Before any new YAML is written, CORTEX checks for an existing YAML with the same
          (namespace + entity_type + entity_name) combination. If found, the write is rejected
          and the existing file path is returned instead.

    eight_canonical_namespaces:
      - namespace: company
        contains: ["repos/", "domains/", "infrastructure/", "dashboards/"]
        absorbs: ["existing company/ — no change"]

      - namespace: governance
        contains: ["core-rules", "skull-rules", "compliance", "security", "gates", "policies", "audit-checklists"]
        absorbs: ["governance/", "rules/", "core/"]

      - namespace: knowledge
        contains: ["domains", "archetypes", "best-practices", "glossary", "repositories", "sdlc", "security", "testing-validation"]
        absorbs: ["existing knowledge/ — no change"]

      - namespace: planning
        contains: ["decisions/", "phases/", "migration/", "roadmaps/", "repo-specific-plans/"]
        absorbs: ["existing planning/ — add TTL enforcement"]
        ttl_enforced: true

      - namespace: workflows
        contains: ["templates/", "patterns/", "components/"]
        absorbs: ["workflows/", "artifacts/", "templates/", "metrics/dashboards/templates/"]
        note: "Consolidates all 4 template locations into one"

      - namespace: config
        contains: ["system config", "memory", "metrics", "cowork-setup"]
        absorbs: ["config/", "memory/", "metrics/", "cowork-setup/"]

      - namespace: specs
        contains: ["HTML view specs", "theme specs", "formal schema definitions"]
        absorbs: ["specs/", "html-views/"]

      - namespace: _archive
        contains: ["completed plans (auto-moved by TTL)", "versioned history"]
        absorbs: [".archive/ (renamed)"]
        read_only: true

  implementation_phases:
    - phase: "P3 Week 1"
      action: "Tag existing YAMLs"
      command: "python scripts/tag_existing_yamls.py --add-namespace --dry-run"
      commit_message: "chore: add schema_version + namespace to all 802 registry YAMLs"

    - phase: "P3 Week 2"
      action: "Merge duplicate directories"
      steps:
        - "Move governance/ + rules/ + core/ → merged governance/"
        - "Move artifacts/templates/ + metrics/dashboards/templates/ + templates/ → workflows/templates/"
        - "Move .archive/ → _archive/"
        - "Update all references in cortex-master-v2.yaml"

    - phase: "P3 Week 3"
      action: "Enable enforcement"
      steps:
        - "Update registry_manager.py with namespace validation"
        - "Add convergence gate step: run_registry_sweep.py --validate-namespaces"
        - "Enable duplicate detection on write"

    - phase: "Ongoing"
      action: "TTL sweep in every convergence gate run"
      command: "python scripts/run_registry_sweep.py --ttl-archive"
      log_target: "_archive/sweep-log.yaml"

  html_exhibit: "cortex-registry/company/repos/cortex/analysis/v32-plan/registry.html"
