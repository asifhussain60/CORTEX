        failure_action: "Fix agent SKILL.md deficiencies; re-run lint before proceeding"

      - step: 2
        name: "Run 40 DoD checks"
        description: "Execute all 40 DoD checks across 8 categories"
        categories_and_commands:
          S_structural:
            - "ls cortex-registry/cortex-master-v2.yaml  # DOD-S01"
