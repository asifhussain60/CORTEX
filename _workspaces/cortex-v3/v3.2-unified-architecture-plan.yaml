      - step: 5
        name: "Cross-capability integration test (single repo)"
        description: "Verify all 32 agents and 137 skills execute cohesively within Cortex"
        test_scenario: "Run full feature delivery from intent through workflow-delivery agents with knowledge-domain skill consultation"
