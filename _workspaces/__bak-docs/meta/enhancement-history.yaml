  core_rule_ref: null
  context: Audit identifies issues but requires manual "proceed" to execute. Should
    generate remediation plan with [1] Auto-execute [2] Phase-by-phase [3] Review
    only [4] Cancel options.
  code_references:
  - PlanningOrchestrator
  - AuditOrchestrator
  implementation_details:
    output_sections:
    - Issues (existing)
    - Remediation Plan (phases, effort, tests, risk)
    - Execution Options (4 choices)
