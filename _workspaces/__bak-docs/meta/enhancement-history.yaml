- id: ENH-058
  description: Autonomous Remediation Framework - Enable auto-execution of audit remediation
    phases without manual gates
  category: WORKFLOW
  confidence_score: 9.0
  source_file: _workspaces/.chats/chat01.txt
  timestamp: '2026-02-07T15:30:00'
  core_rule_ref: CORE-008
  context: DIGEST analysis revealed 0% autonomous execution during audit remediation.
    All phases (1, 2A, 2B) required manual "proceed" commands despite being systematic
    fix work. Users expect autonomous execution after audit approval.
  code_references:
  - InteractionOrchestrator
  - IntentRouter
  - PlanOrchestrator
  implementation_details:
    trigger: User says "proceed autonomously" or "auto-fix all"
    behavior: Skip DoR gates for remediation, execute all phases, auto-commit with
      tests
    scope_limits: "AUDIT\u2192REMEDIATION only, not DESIGN mode, test-gated stops"
    safety_gates: Emergency stop on P0 failures, security issues, breaking changes
  priority: P1
  roi_estimate: High - Reduces 4+ manual interventions per audit session, enables
    overnight autonomous fixes
  effort_estimate: 3-5 days
- id: ENH-059
