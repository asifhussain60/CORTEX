lessons_learned_integration:
  from_transform_002: |
    Apply consolidation pattern learnings:
    - TDD approach (tests first per CORE-008)
    - Incremental implementation (one phase at a time)
    - Backward compatibility as first-class requirement
    - Documentation written during implementation
    - Comprehensive testing at each step
    - Git checkpoints for rollback safety
  
  from_holistic_review: |
    Address root cause, not symptoms:
    - Factory pattern is architectural (not bolted on)
    - Positive enforcement rules (not just negative)
    - Single source of truth (factory is chokepoint)
    - Permanent fix (not temporary workaround)
    - Applies pattern to all future enforcement gaps

architectural_decision_record:
  title: "ADR-004: Factory Pattern for Intent Classification Enforcement"
  decision: "Implement IntentRouterFactory vs Middleware/Decorator"
  
  alternatives_considered:
    - option: "Middleware Pattern"
      pros: "Easy to retrofit, familiar pattern"
      cons: "Runtime coupling, can be bypassed, 20h effort"
    
    - option: "Decorator Pattern"
      pros: "Pythonic, minimal refactoring"
      cons: "Manual application required, can be forgotten, creates overhead"
    
    - option: "Factory Pattern (CHOSEN)"
      pros: "Zero bypass, single chokepoint, aligns with TRANSFORM-005, 11h effort"
      cons: "Requires refactoring, architectural change"
  
  rationale: |
    Factory pattern chosen because:
    1. Zero bypass possibility (architectural constraint)
    2. Single enforcement point (no distributed decorators)
    3. Aligns with TRANSFORM-005 (declarative autowiring)
    4. 11 hours vs 20 hours (45% time savings)
    5. Permanent fix (not temporary workaround)
    6. Testable (mock factory to verify all paths)
  
  consequences:
    positive:
      - "Permanent solution to enforcement gaps"
      - "Single source of truth for orchestrator creation"
      - "Audit trail completeness (100% coverage)"
      - "DoR validation before all execution"
    
    negative:
      - "Requires refactoring 23 orchestrators"
      - "Architectural change (medium risk)"
      - "Team learning curve (new pattern)"
    
    mitigation:
      - "TDD approach reduces refactoring risk"
      - "Incremental migration reduces blast radius"
      - "Comprehensive documentation reduces learning curve"

notes: |
  This remediation phase addresses the "Implementation Without Enforcement"
  syndrome identified during holistic system review (2026-01-24).
  
  The factory pattern is the permanent architectural fix, not a temporary
  workaround. It establishes the principle that all orchestration entry
  points MUST flow through IntentRouter factory, ensuring:
  
  1. Intent classification on EVERY user turn
  2. DoR validation before execution
  3. Audit trail completeness
  4. Permanent solution to enforcement gaps
  
  This phase is P0-CRITICAL because it blocks production confidence.
  Without mandatory intent validation, the system cannot guarantee that
  all user requests are understood before execution, violating the
  fundamental Definition of Ready (DoR) principle.
