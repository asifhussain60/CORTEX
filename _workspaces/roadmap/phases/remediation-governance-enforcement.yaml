# REMEDIATION-GOVERNANCE-ENFORCEMENT Phase Specification
# ========================================================
# Authority: Identified 2026-01-24 holistic system review
# Root Cause: "Implementation Without Enforcement" syndrome
# Priority: P0-CRITICAL (blocks production confidence)

metadata:
  phase_id: "REMEDIATION-GOVERNANCE-ENFORCEMENT"
  title: "Governance Enforcement Architecture"
  version: "1.0"
  created: "2026-01-24T18:00:00Z"
  updated: "2026-01-24T18:00:00Z"
  status: "NOT_STARTED"
  priority: "P0-CRITICAL"
  category: "GOVERNANCE"
  
phase_overview:
  objective: |
    Remediate "Implementation Without Enforcement" syndrome identified in
    holistic system review (2026-01-24). Add CORE-032-035 rules and implement
    factory pattern to enforce mandatory intent classification on every turn.
  
  estimated_effort: "11 hours"
  start_date: "2026-01-25"
  completion_date: "2026-01-26"
  dependencies:
    - "TRANSFORM-002 ✅ (complete)"
  
  root_cause_analysis: |
    CRITICAL FINDING: Intent validation was skipped because NO TIER 0 
    governance rule mandates it. Architectural disconnect between:
    
    - Design Layer: IntentClassifier exists and works (128/128 tests) ✅
    - Enforcement Layer: Stage 1 optional, no DoR checkpoint ❌
    
    PATTERN IDENTIFIED: "Implementation Without Enforcement" syndrome
    
    Affected Systems:
    1. Intent Classification (LENS) - No CORE rule mandates execution
    2. Response Headers - CORE-030 exists but enforcement unclear
    3. StateManager Usage - No CORE rule mandates state tracking
    4. AuditLogger Invocation - Partial enforcement only
    
    Root Cause: Governance rules focus on "what not to do" (negative rules)
    vs "what MUST be done" (positive rules). Examples:
    - CORE-001: "Don't exceed 500 lines" ❌ (negative)
    - CORE-008: "Must write tests first" ✅ (positive)
    - CORE-019: "Must route through TDD-Master" ✅ (positive)
    - MISSING: "Must classify intent before orchestration" ❌

implementation_phases:
  - id: "GOVE-REM-001"
    title: "Create IntentRouterFactory"
    estimated_effort: "2 hours"
    description: |
      Implement factory pattern for orchestrator creation that enforces
      mandatory intent classification. Zero bypass possibility - orchestrators
      can ONLY be created through this factory after intent validation.
    
    deliverables:
      - file: "cortex/orchestrators/core/intent_router_factory.py"
        description: "Factory class with get_orchestrator() method"
        lines: "~150 lines"
      
      - file: "tests/unit/orchestrators/core/test_intent_router_factory.py"
        description: "Factory behavior validation"
        tests: "15+ tests"
    
    acceptance_criteria:
      - "IntentRouterFactory class implemented"
      - "get_orchestrator() enforces intent classification"
      - "Cannot bypass factory (architectural constraint)"
      - "All 15 tests passing"
      - "Type hints 100% (CORE-011)"
      - "Google docstrings (CORE-012)"
    
    implementation_notes: |
      Factory Pattern Benefits:
      - Single enforcement chokepoint (vs distributed decorators)
      - No runtime overhead (architectural, not per-method)
      - Testable (mock factory to verify all paths)
      - Aligns with TRANSFORM-005 (declarative autowiring planned)
      - 11 hours total vs 20 hours for middleware approach
  
  - id: "GOVE-REM-002"
    title: "Refactor MasterOrchestrator to use Factory"
    estimated_effort: "3 hours"
    description: |
      Update MasterOrchestrator and all orchestrator instantiation code to
      use IntentRouterFactory exclusively. Remove optional Stage 1 intent
      classification - make it mandatory via factory pattern.
    
    deliverables:
      - file: "cortex/orchestrators/core/master_orchestrator_refactored.py"
        description: "Use factory for all orchestrator creation"
        changes: "Remove optional intent classification, enforce via factory"
      
      - file: "tests/integration/orchestrators/test_master_orchestrator_factory.py"
        description: "Integration tests for factory usage"
        tests: "20+ tests"
    
    acceptance_criteria:
      - "MasterOrchestrator uses factory exclusively"
      - "No direct orchestrator instantiation (zero bypass)"
      - "Stage 1 intent classification mandatory (not optional)"
      - "DoR validation checkpoint enforced"
      - "All 20 integration tests passing"
      - "100% backward compatibility maintained"
      - "Zero breaking changes detected"
    
    backward_compatibility_notes: |
      Maintain 100% backward compatibility:
      - Factory returns same orchestrator types as before
      - Public API unchanged (same methods, same signatures)
      - Only internal implementation path changes
      - Existing tests should pass without modification
  
  - id: "GOVE-REM-003"
    title: "Add CORE-032-035 Governance Rules"
    estimated_effort: "2 hours"
    description: |
      Add four new positive enforcement rules to cortex_brain/tier0/governance/core-rules.yaml.
      Implement pytest governance plugin hooks to enforce these rules automatically.
    
    deliverables:
      - file: "cortex_brain/tier0/governance/core-rules.yaml"
        description: "Add CORE-032, CORE-033, CORE-034, CORE-035"
        changes: "4 new rule definitions"
      
      - file: "cortex/testing/pytest_plugin_governance.py"
        description: "Pytest hooks for new rules enforcement"
        changes: "Add validators for CORE-032-035"
      
      - file: "tests/unit/governance/test_core_rules_032_035.py"
        description: "Rule validation tests"
        tests: "20+ tests"
    
    new_rules:
      - rule_id: "CORE-032"
        title: "Mandatory Intent Classification (DoR)"
        category: "orchestration_lifecycle"
        severity: "blocked"
        description: |
          ALL user requests MUST undergo intent classification via LENS protocol
          BEFORE orchestrator selection. NO direct execution without DoR validation.
        
        enforcement_mechanism: "IntentRouterFactory (architectural)"
        validation: "pytest governance plugin"
        
        validation_checks:
          - "IntentClassifier.classify() invoked on EVERY user turn"
          - "Confidence score logged in audit trail (0.0-1.0)"
          - "Orchestrator selection based on classified intent"
          - "Low confidence (<0.5) triggers disambiguation"
        
        audit_trail_requirements:
          - "log_operation('INTENT_CLASSIFIED', intent_type, confidence)"
          - "log_operation('ORCHESTRATOR_SELECTED', orchestrator_name, intent_id)"
          - "trace_id linking request → intent → orchestrator → result"
      
      - rule_id: "CORE-033"
        title: "Mandatory State Persistence"
        category: "orchestration_lifecycle"
        severity: "blocked"
        description: |
          Multi-turn operations MUST persist state via StateManager.
          Stateful conversations require state tracking for continuity.
        
        enforcement_mechanism: "StateManager invocation required"
        validation: "pytest governance plugin"
      
      - rule_id: "CORE-034"
        title: "Mandatory Audit Logging"
        category: "observability"
        severity: "blocked"
        description: |
          ALL orchestrator execution MUST be audited via AuditLogger.
          No execution without audit trail for debugging and compliance.
        
        enforcement_mechanism: "@audit_logged decorator required"
        validation: "pytest governance plugin"
      
      - rule_id: "CORE-035"
        title: "Mandatory Response Header Injection"
        category: "response_formatting"
        severity: "blocked"
        description: |
          ALL responses MUST include standard CORTEX header (CORE-030 clarification).
          Header format is immutable and non-negotiable.
        
        enforcement_mechanism: "ResponseHeaderValidator (pre-return check)"
        validation: "pytest governance plugin"
    
    acceptance_criteria:
      - "All 4 rules added to core-rules.yaml"
      - "Pytest plugin enforces all 4 rules"
      - "20+ rule validation tests passing"
      - "Documentation updated with rule descriptions"
  
  - id: "GOVE-REM-004"
    title: "Migrate 23 Orchestrators to Factory Pattern"
    estimated_effort: "4 hours"
    description: |
      Update all 23 orchestrators from TRANSFORM-001 to use IntentRouterFactory.
      Update wiring harness to use factory instead of direct instantiation.
    
    deliverables:
      - description: "23 orchestrators updated (incremental migration)"
        orchestrators: "All orchestrators from TRANSFORM-001"
      
      - file: "cortex/orchestrators/core/orchestrator_wiring.py"
        description: "Update wiring harness to use factory"
        changes: "Replace direct instantiation with factory calls"
      
      - file: "tests/integration/orchestrators/test_orchestrator_migration.py"
        description: "Migration validation tests"
        tests: "35+ tests"
    
    orchestrators_to_migrate:
      - "MasterOrchestrator"
      - "TDDOrchestrator"
      - "BuilderOrchestrator"
      - "GovernanceOrchestrator"
      - "DomainOrchestrator"
      - "SeleniumPlaywrightOrchestrator"
      - "DocumentationOrchestrator"
      - "TestingOrchestrator"
      - "AnalysisOrchestrator"
      - "ReviewOrchestrator"
      - "RefactoringOrchestrator"
      - "DebuggingOrchestrator"
      - "OptimizationOrchestrator"
      - "ValidationOrchestrator"
      - "PlanningOrchestrator"
      - "KnowledgeOrchestrator"
      - "ObservabilityOrchestrator"
      - "InfrastructureOrchestrator"
      - "DeploymentOrchestrator"
      - "SecurityOrchestrator"
      - "PerformanceOrchestrator"
      - "ScalabilityOrchestrator"
      - "ResilienceOrchestrator"
    
    migration_strategy:
      approach: "Incremental (one orchestrator at a time)"
      validation: "Run tests after each migration"
      rollback: "Git checkpoint before each migration"
      
    acceptance_criteria:
      - "All 23 orchestrators use factory exclusively"
      - "Wiring harness updated (no direct instantiation)"
      - "35+ migration tests passing"
      - "100% backward compatibility maintained"
      - "Zero breaking changes detected"
      - "Performance impact <5% (negligible factory overhead)"

