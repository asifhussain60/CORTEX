metadata:
  phase_id: PHASE-UNIFIED-DEPLOY
  title: CORTEX Unified Deployment - Centralized Service Architecture
  version: "1.0"
  created_at: "2026-01-19T20:30:00Z"
  authority: cortex-builder.prompt.md (v2.1 SSOT)
  status: NOT_STARTED
  locked: false

overview:
  description: |
    CORTEX transforms from embedded deployment model to centralized service architecture.
    
    • cortex-ai/cortex becomes single source of truth (top-level independent repo)
    • All intelligence (orchestrators, tools, governance) consolidated in one place
    • Child repos consume via lightweight reference (.github/prompts/CORTEX.prompt)
    • One version, one audit trail, automatic intelligence distribution
    • Unified telemetry enables real operational feedback loop
    
    This phase replaces fragmented O(N) deployment with scalable O(1) architecture.
  
  business_value: |
    ✓ Zero deployment friction (one-file adoption)
    ✓ Automatic updates (no manual sync per repo)
    ✓ Unified intelligence (all teams use latest)
    ✓ Operational insights (real data drives development)
    ✓ Governance integrity (single source of truth)
  
  timeline: 10 weeks (80 hours estimated)
  dependencies:
    requires_phase:
      - PHASE-22-MCP-PROTOCOL-COMPLIANCE
    prerequisite_locked_phases: "ALL other phases must be locked"
    
section_a:
  title: Infrastructure & Telemetry Foundation
  description: Server-side architecture for centralized telemetry and intelligence management
  ac_count: 3
  estimated_hours: 38

  ac:
    - ac_id: AC-UNIFIED-DEPLOY-001-01
      title: Centralized CORTEX Repository Setup
      description: |
        Consolidate CORTEX into cortex-ai/cortex as definitive source of truth.
        
        Repository structure:
        • /orchestrators - Master, LENS, ResponseComposer, all execution patterns
        • /mcp-tools - All MCP tool implementations with signatures
        • /cortex_brain/tier0, tier1, tier2 - Governance rules + knowledge layers
        • /.github/prompts/CORTEX.prompt - Distribution artifact (versioned)
        • /api/telemetry - Telemetry endpoint
        • /manifest.json - Intelligence versioning (released with each version)
        
        Success criteria:
        ✓ Clean separation of concerns (no mixed concerns per file)
        ✓ Single version numbering system (semantic versioning)
        ✓ VERSION file at repo root (read by all consumers)
        ✓ All Git history preserved (no rewriting)
        ✓ No deployment artifacts left behind
      
      test_count: 20
      estimated_hours: 8
      status: NOT_STARTED
      test_categories:
        - Repository structure validation (5 tests)
        - File placement correctness (5 tests)
        - Version numbering consistency (5 tests)
        - Git history integrity (5 tests)

    - ac_id: AC-UNIFIED-DEPLOY-001-02
      title: Telemetry Endpoint Implementation
      description: |
        Server-side REST endpoint for batch telemetry ingestion.
        
        Endpoint: POST api.cortex-ai.io/v1/telemetry/ingest
        
        Input: Batch JSON (event arrays)
        • execution_events - Timing, tools used, outcomes (no user code)
        • error_events - Error categories, reproducibility scores
        • performance_events - Aggregate metrics (memory, CPU, cache ratios)
        • feedback_events - Optional explicit user feedback (consent-gated)
        
        Processing:
        ✓ Schema validation (reject malformed)
        ✓ PII scrubbing (hashed identifiers, no user code)
        ✓ Secret detection (block transmission if detected)
        ✓ Event deduplication (local window)
        
        Response: { status: "ok", processed: N, rejected: M, errors: [...] }
      
      test_count: 25
      estimated_hours: 12
      status: NOT_STARTED
      test_categories:
        - Schema validation (6 tests)
        - Data scrubbing (8 tests)
        - Error handling (6 tests)
        - Response formatting (5 tests)

    - ac_id: AC-UNIFIED-DEPLOY-001-03
      title: Aggregation Engine & GitHub Issue Auto-Generation
      description: |
        Server-side processing pipeline for telemetry insights and automated issue creation.
        
        Aggregation logic:
        • Deduplicate events within time window (same error_id + environment + 1h = 1 entry)
        • Compute impact score: (frequency × severity × reproducibility)
        • Identify patterns (Top 10 errors this week, performance trends)
        • Group by affected environment signatures
        
        GitHub issue auto-creation:
        ✓ Triggered when impact_score exceeds threshold
        ✓ Issue title: "[TELEMETRY] <Pattern Name> (<Impact Level>)"
        ✓ Issue body includes pattern details, affected count, environments, recommendations
        ✓ Auto-assigned labels: telemetry-generated, p1-critical (based on impact)
        ✓ Links to telemetry data (reproducibility, first seen, trend)
      
      test_count: 30
      estimated_hours: 14
      status: NOT_STARTED
      test_categories:
        - Deduplication logic (8 tests)
        - Impact score computation (8 tests)
        - Pattern identification (7 tests)
        - Issue generation payload (7 tests)

section_b:
  title: Prompt-Based Distribution System
  description: Lightweight client-side integration for any company repo
  ac_count: 3
  estimated_hours: 32

  ac:
    - ac_id: AC-UNIFIED-DEPLOY-002-01
      title: CORTEX.prompt Template & Versioning
      description: |
        Define standard prompt template consumed by all company repos.
        
        Template (.github/prompts/CORTEX.prompt):
        • Loads from cortex-ai/cortex/main/.github/prompts/CORTEX.prompt
        • Contains orchestrator definitions (Master, LENS, ResponseComposer, etc.)
        • Contains MCP tool registry (refs to cortex-ai/cortex tools)
        • Contains governance rules (CORE-001 through CORE-037)
        • Contains response templates (formatting, headers, footers)
        • Version hash in header (for cache busting + transparency)
        
        Size optimization:
        ✓ <5KB gzipped (optimized for Copilot context)
        ✓ Lazy loading where possible (on-demand definitions)
        
        Caching strategy:
        ✓ GitHub raw.githubusercontent.com + 1h TTL
        ✓ Local fallback (cached previous version if fetch fails)
        ✓ Version mismatch detection (warn user)
      
      test_count: 18
      estimated_hours: 10
      status: NOT_STARTED
      test_categories:
        - Schema validation (5 tests)
        - Size checks (3 tests)
        - Version hashing (4 tests)
        - Caching behavior (6 tests)

    - ac_id: AC-UNIFIED-DEPLOY-002-02
      title: Reference Template for Child Repos
      description: |
        One-file adoption guide/script for any company repo.
        
        Adoption process (3 steps):
        1. Copy .github/prompts/CORTEX.prompt to target repo
        2. Add "@cortex" to .github/copilot-instructions.md
        3. Done (no other manual steps required)
        
        Template includes:
        ✓ Setup instructions (clear, testable)
        ✓ Verification script (validate installation)
        ✓ Troubleshooting guide (common issues)
        
        Verification script:
        ✓ Checks file in correct location
        ✓ Verifies CORTEX.prompt loads without syntax error
        ✓ Reports detected CORTEX version
        ✓ Runs basic MCP tool connectivity tests
        ✓ Outputs: "✓ CORTEX v2.6 detected and working"
      
      test_count: 22
      estimated_hours: 8
      status: NOT_STARTED
      test_categories:
        - File placement validation (6 tests)
        - Verification script accuracy (8 tests)
        - Error message clarity (5 tests)
        - Edge cases (3 tests)

    - ac_id: AC-UNIFIED-DEPLOY-002-03
      title: Multi-Repo Context Switching
      description: |
        Copilot operates across multiple repos simultaneously with proper context isolation.
        
        Context detection:
        • Automatically detects current repo (via .git/config)
        • Maintains separate execution state per repo
        • Switches seamlessly between repos (no manual reset)
        
        State isolation:
        ✓ Separate cache per repo (prevents pollution)
        ✓ Shared governance.db reference (read-only from cortex-ai/cortex)
        ✓ Local telemetry batches per repo (source tagged)
        
        Switching behavior:
        ✓ User switches to different repo → Copilot auto-detects
        ✓ No state loss, no context mixing
        ✓ Telemetry includes repo identifier (for aggregation)
      
      test_count: 20
      estimated_hours: 12
      status: NOT_STARTED
      test_categories:
        - Context detection (5 tests)
        - State isolation (8 tests)
        - Switching scenarios (5 tests)
        - Telemetry tagging (2 tests)

section_c:
  title: Intelligence Update Protocol
  description: Manifest-driven versioning and automatic intelligence distribution
  ac_count: 2
  estimated_hours: 20

  ac:
    - ac_id: AC-UNIFIED-DEPLOY-003-01
      title: Manifest System & Version Management
      description: |
        Track CORTEX intelligence versions and enable deterministic upgrades.
        
        Manifest file: cortex-ai/cortex/manifest.json (generated on each release)
        
        Contents:
        • schema_version (e.g., "2.0")
        • released_at (ISO 8601 timestamp)
        • orchestrators: [{ name, version, fingerprint, breaking_changes }]
        • workflows: [{ name, version, dependencies }]
        • mcp_tools: [{ name, version, signature_changes }]
        • brain_tiers: [{ tier, rules_added, rules_modified, rules_removed }]
        • migrations: [{ required_transformations }]
        
        Manifest validation:
        ✓ JSON schema strict (fail fast on invalid)
        ✓ All orchestrators listed must exist in repo
        ✓ All dependencies resolvable (no circular deps)
        ✓ Breaking changes clearly marked
        
        Intelligence diff computation:
        ✓ Compare local vs remote manifest
        ✓ Categorize changes: breaking, major, minor, patch
        ✓ Compute impact scoring (user-visible relevance)
      
      test_count: 28
      estimated_hours: 12
      status: NOT_STARTED
      test_categories:
        - Schema validation (8 tests)
        - Dependency resolution (7 tests)
        - Diff computation (8 tests)
        - Impact scoring (5 tests)

    - ac_id: AC-UNIFIED-DEPLOY-003-02
      title: Copilot Chat Intelligence Display
      description: |
        Show new intelligence to users inline in chat (no markdown files).
        
        Display format (shown once per session):
        
        [CORTEX Intelligence Update]
        ✅ CORTEX v2.5 → v2.6 (3 new orchestrators, +12 rules, no breaking changes)
        
        📦 NEW
        • QueryOptimizer (pattern recognition for query optimization)
        • CacheManager (intelligent caching strategy selection)
        • AsyncComposer (non-blocking async/await composition)
        
        🔄 MODIFIED
        • MasterOrchestrator: complexity accuracy +15%
        • LENS Stage 3: streaming output support added
        
        ✖️ DEPRECATED (5-version backward compat maintained)
        • LegacyRouter (use MasterOrchestrator instead)
        
        Display behavior:
        ✓ Show once per session (not spam)
        ✓ Include version transition, counts, summary
        ✓ Provide link to full changelog (optional)
        
        Categories:
        ✓ NEW - Added features
        ✓ MODIFIED - Changed behavior
        ✓ DEPRECATED - Removed in X versions
      
      test_count: 16
      estimated_hours: 8
      status: NOT_STARTED
      test_categories:
        - Formatting accuracy (5 tests)
        - Category accuracy (5 tests)
        - Deduplication (3 tests)
        - Edge cases (3 tests)

section_d:
  title: Feedback Loop & Continuous Improvement
  description: Operational data collection and team-driven intelligence development
  ac_count: 2
  estimated_hours: 30

  ac:
    - ac_id: AC-UNIFIED-DEPLOY-004-01
      title: Operational Data Collection & Transmission
      description: |
        Capture deterministic telemetry from all repos and transmit aggregates centrally.
        
        Local collection (in CORTEX.prompt / Copilot execution):
        
        • execution_events: timing, tools, outcomes, no user code
        • error_events: category, reproducibility, environment signature
        • performance_events: aggregate metrics (memory, CPU, cache hit ratio)
        • user_feedback: optional, explicit consent, 30-day consent window
        
        Storage:
        ✓ SQLite in user's Copilot cache (expires with cache clear)
        ✓ Local transmission log (success/failure tracking)
        
        Batching logic:
        ✓ Accumulate 100 events OR 24 hours (whichever first)
        ✓ Auto-transmit when batch threshold met
        ✓ User can also manually trigger: "@cortex telemetry --transmit"
        
        Transmission:
        ✓ HTTPS POST to cortex-ai/cortex/api/telemetry/ingest
        ✓ User consent verified (stored locally, expires 30 days)
        ✓ Payload encrypted (TLS only, no plaintext)
        ✓ Transmission logged locally (success/failure, retry count)
        
        Privacy guarantees:
        ✓ No user code extracted
        ✓ No secrets exposed
        ✓ No raw session data
        ✓ Only aggregate statistics
      
      test_count: 32
      estimated_hours: 16
      status: NOT_STARTED
      test_categories:
        - Event collection accuracy (8 tests)
        - Batching logic (6 tests)
        - Transmission protocol (10 tests)
        - Retry behavior (5 tests)
        - Consent handling (3 tests)

    - ac_id: AC-UNIFIED-DEPLOY-004-02
      title: Feedback Analysis & Team Action Loop
      description: |
        Aggregate operational insights and drive CORTEX development prioritization.
        
        Weekly aggregation run (server-side):
        • Deduplicate error patterns (global view across all repos)
        • Compute trend scores (is error increasing/decreasing?)
        • Map to GitHub issues (new issues for top patterns)
        
        Insights dashboard (cortex-ai/cortex GitHub project):
        ✓ Top 10 error patterns this week (with trend direction)
        ✓ Performance degradation alerts (tool X slower by 20%)
        ✓ Capability gaps (user feedback: "need X" mentioned 5 times)
        ✓ Orchestrator effectiveness scores (accuracy per orchestrator)
        
        Integration with development:
        ✓ Auto-create GitHub issues for high-impact patterns
        ✓ Link issues to telemetry data (reproducibility, environments, first seen)
        ✓ Prioritize backlog based on real impact (not opinion)
        ✓ Close issues when telemetry indicates fix worked
        
        Team workflow:
        1. Weekly report generated (Monday 9am)
        2. Issues auto-created for new patterns
        3. Team triages based on impact score
        4. Developer picks high-impact issue
        5. Fix implemented in cortex-ai/cortex
        6. Next manifest release includes fix
        7. All repos automatically get fix (next @cortex call)
        8. Telemetry confirms issue resolved
      
      test_count: 26
      estimated_hours: 14
      status: NOT_STARTED
      test_categories:
        - Aggregation accuracy (8 tests)
        - Deduplication logic (6 tests)
        - Trend scoring (6 tests)
        - Issue generation (6 tests)

governance:
  core_rules:
    - CORE-001: "Response format concise (this phase plan is reference-level)"
    - CORE-008: "TDD - tests defined before implementation"
    - CORE-011: "Type hints mandatory on all functions"
    - CORE-012: "Google docstrings on all public APIs"
    - CORE-013: "No bare except: clauses"
    - CORE-027: "AC lifecycle: AC_START → AC_EXECUTE → AC_COMPLETE"
    - CORE-028: "Kebab-case filenames, ≤25 characters"
  
  test_coverage:
    total_tests: 241
    breakdown:
      infrastructure: 75 tests
      distribution: 60 tests
      intelligence: 44 tests
      feedback: 58 tests
    pass_rate_required: 100%
    code_coverage_required: 95%+
  
  compliance_gates:
    - "ALL ACs must be COMPLETED (status: COMPLETED)"
    - "100% test pass rate (241/241 passing)"
    - "Hash chain integrity verified (unbroken)"
    - "Zero governance violations"
    - "Documentation updated (phase markdown only)"

