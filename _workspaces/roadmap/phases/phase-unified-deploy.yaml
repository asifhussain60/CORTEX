success_metrics:
  quantitative:
    - Deployment friction: <5 min per repo (vs 30+ currently)
    - Adoption rate: 80%+ company repos within 90 days
    - Update latency: <1h cortex-ai/cortex push to user availability
    - Telemetry quality: 95%+ events parseable, <1% data loss
    - Issue latency: <4h pattern detection to GitHub issue creation
  
  qualitative:
    - "CORTEX updates are automatic and invisible"
    - "Development prioritized by real impact, not guesses"
    - "All users run same version, audit trail unified"

risks:
  - risk: CORTEX.prompt becomes too large
    likelihood: Medium
    impact: Copilot context bloat
    mitigation: Size limit enforced (5KB), compression, lazy loading
  
  - risk: GitHub API rate limits on issue auto-creation
    likelihood: Low
    impact: Telemetry processing delays
    mitigation: Queue system, batch window >1h
  
  - risk: Users disable telemetry entirely
    likelihood: Medium
    impact: Feedback loop broken
    mitigation: Transparent value messaging, opt-in from start
  
  - risk: Manifest version skew (local vs remote)
    likelihood: Low
    impact: Orchestrator mismatch
    mitigation: Validation tests, rollback procedure
  
  - risk: Network outage blocks Copilot invocation
    likelihood: Low
    impact: Cascading failures
    mitigation: Local fallback (manifest cached)

