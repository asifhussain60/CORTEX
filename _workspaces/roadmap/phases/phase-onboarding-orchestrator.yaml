# =============================================================================
# PHASE-ONBOARDING-ORCHESTRATOR: User Onboarding & Workflow Engine
# =============================================================================
# Comprehensive user onboarding system with interactive workflow guidance
# Status: DESIGNED
# AC-IDs: 5 (AC-ONBOARD-001-01 through AC-ONBOARD-005-01)
# Estimated Hours: 40
# Priority: P0 (HIGH - Critical for Production Readiness & User Adoption)
# =============================================================================

metadata:
  phase_id: "PHASE-ONBOARDING-ORCHESTRATOR"
  title: "Onboarding Orchestrator: User Workflow Guidance & Production Readiness"
  version: "1.0.0"
  created: "2026-01-19"
  author: "cortex-builder"
  status: "DESIGNED"
  priority: "P0"
  blocking: true
  category: "User Experience & Production Readiness"
  
# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    CORTEX is production-ready functionally but lacks user onboarding infrastructure.
    New users cannot discover available tools, understand workflow patterns, or get
    contextual help. Training materials exist but are not integrated into the system.
    This creates friction, reduces adoption, and increases support burden.
  
  gaps_identified:
    - id: "GAP-ONBOARD-001"
      title: "No Interactive Onboarding Flow"
      impact: "Users cannot learn system through guided workflow"
      current_state: "Documentation exists in static files only"
      severity: "CRITICAL"
    
    - id: "GAP-ONBOARD-002"
      title: "No Tool Discovery System"
      impact: "Users don't know what tools/capabilities exist"
      current_state: "Tool list in README only; no interactive discovery"
      severity: "HIGH"
    
    - id: "GAP-ONBOARD-003"
      title: "No Contextual Help System"
      impact: "No in-workflow help or error guidance"
      current_state: "Generic error messages; no remediation guidance"
      severity: "HIGH"
    
    - id: "GAP-ONBOARD-004"
      title: "No First-Run Experience"
      impact: "New users don't know where to start"
      current_state: "No setup wizard or quickstart flow"
      severity: "HIGH"
    
    - id: "GAP-ONBOARD-005"
      title: "No User Profiling/Personalization"
      impact: "All users get same experience; no path adaptation"
      current_state: "One-size-fits-all approach"
      severity: "MEDIUM"

# =============================================================================
# SOLUTION ARCHITECTURE
# =============================================================================

solution_architecture:
  core_components:
    - name: "Onboarding Flow Engine"
      purpose: "Guide users through interactive onboarding"
      implementation:
        module: "src/orchestration/onboarding_orchestrator.py"
        responsibility: "Orchestrate multi-step onboarding workflow"
        features:
          - "Interactive flow state machine"
          - "Step-by-step guided progression"
          - "Progress tracking & resumption"
          - "Contextual messaging per step"
      pattern: "Orchestrator pattern (like PlanningOrchestrator)"
    
    - name: "Tool Discovery Service"
      purpose: "Enable users to discover available tools"
      implementation:
        module: "src/core/discovery/tool_discovery_service.py"
        responsibility: "Expose tools with filtering & search"
        features:
          - "Tool listing with categories"
          - "Search by name/description/capability"
          - "Filter by user role/experience level"
          - "Usage examples per tool"
          - "Integration with MCP /list-tools endpoint"
    
    - name: "Contextual Help System"
      purpose: "Provide in-workflow help & error guidance"
      implementation:
        module: "src/core/help/contextual_help_provider.py"
        responsibility: "Deliver relevant help based on context"
        features:
          - "Help linked to specific operations"
          - "Error remediation guidance"
          - "Workflow tips & best practices"
          - "Tool-specific documentation"
    
    - name: "User Onboarding Journey"
      purpose: "Define standard user journey through system"
      implementation:
        files:
          - "cortex_brain/tier2/onboarding/standard-journey.yaml"
          - "cortex_brain/tier2/onboarding/role-specific-journeys.yaml"
        responsibility: "Define step sequences per user type"
        features:
          - "Beginner journey (5 steps)"
          - "Advanced journey (10 steps)"
          - "Role-specific journeys (analyst, developer, PM)"
    
    - name: "Onboarding Dashboard"
      purpose: "Visual progress tracking during onboarding"
      implementation:
        module: "src/web/onboarding_dashboard.py" (optional UI)
        responsibility: "Display progress, next steps, resources"
        features:
          - "Progress bar & step indicator"
          - "Resource links & documentation"
          - "Quick-access tool launcher"
          - "Feedback collection"

# =============================================================================
# DESIGN PRINCIPLES - Efficiency & Production Readiness Balance
# =============================================================================

design_principles:
  efficiency:
    "Lean Implementation": |
      - Core: 1 orchestrator + 3 services (not 10 microservices)
      - Reuse existing patterns (PlanningOrchestrator as template)
      - Leverage existing MCP tool discovery
      - Minimize new dependencies
    
    "Fast Development": |
      - TDD for speed (red → green cycles)
      - Parallel testing during development
      - Reuse test patterns from other orchestrators
      - 40-hour timeline achievable (vs 60+ for over-engineered solution)
    
    "Smart Automation": |
      - Auto-generate tool documentation from code
      - Auto-classify tools by capability
      - Auto-map user personas to journeys
      - Reduce manual content creation
  
  production_readiness:
    "Reliability": |
      - 140+ tests (unit + integration)
      - 100% type hints
      - Google-style docstrings
      - Async-safe patterns
    
    "Scalability": |
      - Stateless design (horizontal scalable)
      - Metrics tracking for adoption monitoring
      - Performance: <100ms response time per help query
      - Support 1000+ concurrent users
    
    "Accessibility": |
      - Clear error messages with remediation
      - Structured help (not long docs)
      - Role-based filtering
      - Progressive disclosure (basics first)
    
    "Maintainability": |
      - Journey configs in YAML (no code changes for new journeys)
      - Help content externalized (easy updates)
      - Metrics logged to audit trail
      - Compliance with CORE rules

# =============================================================================
# ACCEPTANCE CRITERIA (5 ACs)
# =============================================================================

acceptance_criteria:
  AC-ONBOARD-001-01:
    title: "Onboarding Orchestrator & Flow Engine"
    description: |
      Implement OnboardingOrchestrator with state machine for guided multi-step
      onboarding. Support step progression, progress tracking, context management,
      and resumption from saved state.
    requirements:
      - "Create OnboardingOrchestrator class extending BaseOrchestrator"
      - "Implement flow state machine (5-10 steps per journey)"
      - "Support async step execution"
      - "Persist progress to onboarding.db (new table)"
      - "Implement resume-from-checkpoint functionality"
      - "API: start_onboarding(user_id, journey_type) → Result[OnboardingState]"
      - "API: advance_step(user_id, step_id) → Result[OnboardingState]"
      - "API: get_progress(user_id) → Result[OnboardingProgress]"
      - "Error handling: recoverable errors trigger help context"
    tests: ~40
    files_to_create:
      - "src/orchestration/onboarding_orchestrator.py"
      - "src/orchestration/onboarding_flow_engine.py"
      - "cortex_brain/tier2/onboarding/standard-journey.yaml"
      - "cortex_brain/tier2/onboarding/beginner-journey.yaml"
      - "cortex_brain/tier2/onboarding/advanced-journey.yaml"
      - "tests/unit/test_onboarding_orchestrator.py"
      - "tests/unit/test_onboarding_flow_engine.py"
    governance:
      - CORE-008: TDD (tests first)
      - CORE-011: 100% type hints
      - CORE-012: Google docstrings
      - CORE-024: Audit logging (log every step transition)
      - CORE-025: Result pattern (all APIs return Result[T])
    validation:
      - "OnboardingOrchestrator inherits from BaseOrchestrator"
      - "All 3 journeys (standard, beginner, advanced) loadable from YAML"
      - "Progress persists to onboarding.db"
      - "Can resume from any checkpoint"
      - "Step transitions logged to audit trail"
    
  AC-ONBOARD-002-01:
    title: "Tool Discovery Service & MCP Integration"
    description: |
      Implement ToolDiscoveryService exposing available tools with filtering,
      search, and categorization. Integrate with MCP /list-tools endpoint and
      provide enhanced discovery API with role-based filtering.
    requirements:
      - "Create ToolDiscoveryService class"
      - "Implement tool listing with metadata"
      - "Support search by name, description, capability"
      - "Implement category-based filtering"
      - "Add role-based filtering (beginner/intermediate/advanced)"
      - "Generate usage examples per tool (auto-generated from docstrings)"
      - "API: list_all_tools() → List[ToolDefinition]"
      - "API: search_tools(query: str) → List[ToolDefinition]"
      - "API: filter_by_category(category: str) → List[ToolDefinition]"
      - "API: filter_by_role(role: UserRole) → List[ToolDefinition]"
      - "Integrate with MCP @list_tools endpoint"
    tests: ~35
    files_to_create:
      - "src/core/discovery/tool_discovery_service.py"
      - "cortex_brain/tier2/onboarding/tool-categories.yaml"
      - "cortex_brain/tier2/onboarding/tool-role-mapping.yaml"
      - "tests/unit/test_tool_discovery.py"
      - "tests/integration/test_discovery_mcp_integration.py"
    governance:
      - CORE-008: TDD
      - CORE-011: 100% type hints
      - CORE-025: Result pattern
      - CORE-027: Audit logging (log search queries)
    validation:
      - "Can discover all registered @mcp_tool decorated functions"
      - "Search case-insensitive and finds partial matches"
      - "Category filtering returns correct subset"
      - "Role-based filtering reduces tool list appropriately"
      - "Usage examples auto-generated from docstrings"
    
  AC-ONBOARD-003-01:
    title: "Contextual Help System & Error Guidance"
    description: |
      Implement ContextualHelpProvider delivering relevant help based on workflow
      context. Integrate with error paths to provide remediation guidance.
      Support help linking, error recovery, and best practices.
    requirements:
      - "Create ContextualHelpProvider class"
      - "Implement help registry (help_id → help_content mapping)"
      - "Support context-aware help lookup (operation → help)"
      - "Implement error remediation guidance"
      - "Add workflow tips & best practices"
      - "API: get_help(context: str) → Result[HelpContent]"
      - "API: get_error_remediation(error_code: str) → Result[RemediationGuide]"
      - "API: get_workflow_tips(step_id: str) → Result[List[Tip]]"
      - "Help content loaded from YAML files (externalized, updatable)"
      - "Support help linking in onboarding flow"
    tests: ~35
    files_to_create:
      - "src/core/help/contextual_help_provider.py"
      - "cortex_brain/tier2/onboarding/help-registry.yaml"
      - "cortex_brain/tier2/onboarding/error-remediation.yaml"
      - "cortex_brain/tier2/onboarding/workflow-tips.yaml"
      - "tests/unit/test_contextual_help.py"
      - "tests/unit/test_error_remediation.py"
    governance:
      - CORE-008: TDD
      - CORE-011: 100% type hints
      - CORE-012: Google docstrings
      - CORE-027: Audit logging (log help queries)
    validation:
      - "All error codes have remediation guidance"
      - "Help content loads from YAML without errors"
      - "Context lookups return relevant help (assessed via manual review)"
      - "Error → help linkage works end-to-end"
    
  AC-ONBOARD-004-01:
    title: "User Journey Definitions & Role-Based Personalization"
    description: |
      Define user journey patterns for different user types (beginner, advanced,
      analyst, developer, PM) in YAML. Implement journey selection logic based on
      user profile. Support journey customization & branching.
    requirements:
      - "Create journey definition schema (YAML format)"
      - "Define 3 primary journeys: beginner, intermediate, advanced"
      - "Define 3 role-specific journeys: analyst, developer, PM"
      - "Implement journey loader & validator"
      - "API: get_recommended_journey(user_profile) → Journey"
      - "API: list_available_journeys() → List[Journey]"
      - "Support journey branching (next_step depends on user choice)"
      - "Journey includes: step_id, description, tools_introduced, help_links"
      - "Auto-generate journey suggestions based on user answers"
    tests: ~30
    files_to_create:
      - "src/core/onboarding/journey_engine.py"
      - "cortex_brain/tier2/onboarding/standard-journey.yaml"
      - "cortex_brain/tier2/onboarding/beginner-journey.yaml"
      - "cortex_brain/tier2/onboarding/advanced-journey.yaml"
      - "cortex_brain/tier2/onboarding/role-analyst-journey.yaml"
      - "cortex_brain/tier2/onboarding/role-developer-journey.yaml"
      - "cortex_brain/tier2/onboarding/role-pm-journey.yaml"
      - "tests/unit/test_journey_engine.py"
      - "tests/unit/test_journey_selection.py"
    governance:
      - CORE-008: TDD
      - CORE-018: YAML-first (journey definitions in YAML)
      - CORE-025: Result pattern
    validation:
      - "All 6 journeys load without errors"
      - "Journey branching logic works correctly"
      - "User profile → journey recommendation produces sensible mapping"
      - "Journey includes all required metadata"
    
  AC-ONBOARD-005-01:
    title: "Onboarding Completion & Adoption Metrics"
    description: |
      Track onboarding completion metrics and user adoption. Generate completion
      certificates, track user progress toward tool mastery, and collect feedback.
      Log metrics to governance.db for leadership reporting.
    requirements:
      - "Create OnboardingMetricsCollector class"
      - "Track: users_started, users_completed, avg_time, drop_off_points"
      - "Track: tools_discovered, tools_used, adoption_rate"
      - "Implement completion certificate generation"
      - "API: get_completion_metrics() → OnboardingMetrics"
      - "API: generate_completion_certificate(user_id) → Result[Certificate]"
      - "Log metrics to governance.db (metrics_log table)"
      - "Track user → tool mapping (which users use which tools)"
      - "Support adoption dashboard generation"
      - "Feedback collection after onboarding completion"
    tests: ~20
    files_to_create:
      - "src/core/metrics/onboarding_metrics_collector.py"
      - "tests/unit/test_onboarding_metrics.py"
      - "tests/unit/test_adoption_tracking.py"
    governance:
      - CORE-008: TDD
      - CORE-024: Audit logging
      - CORE-027: Metrics persisted to governance.db
    validation:
      - "Metrics collected accurately"
      - "Completion certificate generated correctly"
      - "Metrics queryable from governance.db"
      - "Dashboard can display adoption metrics"

# =============================================================================
# DESIGN EFFICIENCY OPTIMIZATIONS
# =============================================================================

efficiency_features:
  reuse_existing_patterns:
    - "OnboardingOrchestrator extends BaseOrchestrator (no new base class)"
    - "Use existing Result pattern (no new error handling)"
    - "Use existing audit logging (no new logging framework)"
    - "Leverage MCP tool discovery (no duplicate implementation)"
  
  minimize_new_code:
    - "Journey definitions in YAML (minimize Python code)"
    - "Help content in YAML (no need to hardcode)"
    - "Tool metadata auto-generated from @mcp_tool (no manual listing)"
    - "Error remediation mappings in YAML (declarative, not imperative)"
  
  parallel_work:
    - "AC-001 and AC-002 can be developed in parallel"
    - "AC-003 and AC-004 can be developed in parallel"
    - "AC-005 developed after core (minimal dependencies)"
    - "Tests can be written in parallel with implementation"
  
  fast_iteration:
    - "YAML-first design allows rapid iteration without recompilation"
    - "Journeys can be tweaked post-deployment (no code changes)"
    - "Help content updated independently (no orchestrator restarts)"
    - "Metrics retroactively added without affecting existing code"

