    - "CORE-012: Docstrings (Google format)"
    - "CORE-018: YAML-first (journey/help configs in YAML)"
    - "CORE-024: Audit logging (all operations logged)"
    - "CORE-025: Result pattern (all APIs return Result[T])"
    - "CORE-027: Audit trail (onboarding steps logged)"
  
