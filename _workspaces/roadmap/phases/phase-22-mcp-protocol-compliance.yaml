  This phase is CRITICAL for CORTEX production usability. Without proper MCP
  protocol compliance, CORTEX cannot be used as an AI tool provider for:
  - Claude Desktop
  - VS Code Copilot
  - Other MCP-compatible clients
  
  The existing @mcp_tool decorator and tool registration infrastructure is
  solid - the gap is primarily in the transport layer (stdio vs HTTP) and
  the breadth of tool coverage.
  
  Reference: https://modelcontextprotocol.io/docs/
  MCP SDK: https://github.com/modelcontextprotocol/python-sdk

