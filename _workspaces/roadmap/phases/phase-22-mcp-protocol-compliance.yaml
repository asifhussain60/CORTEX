# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    CORTEX has a custom MCP-like server implementation that does NOT comply with
    the Model Context Protocol specification. This prevents integration with 
    Claude Desktop, VS Code Copilot, and other MCP clients. Additionally, 60%+ 
    of CORTEX capabilities are not exposed as MCP tools.
  
  gaps_identified:
    - id: "GAP-MCP-001"
      title: "No MCP SDK Integration"
      impact: "Cannot function as MCP server for standard clients"
      current_state: "Custom HTTP-style server in src/mcp/server.py"
      severity: "CRITICAL"
    
    - id: "GAP-MCP-002"
      title: "Missing STDIO Transport"
      impact: "Claude Desktop requires stdio-based JSON-RPC"
      current_state: "TCP/HTTP server only"
      severity: "CRITICAL"
    
    - id: "GAP-MCP-003"
      title: "Incomplete Tool Exposure"
      impact: "17 of 40+ tools have @mcp_tool decorators"
      current_state: "Only governance_tools.py and master_orchestrator.py decorated"
      severity: "HIGH"
    
    - id: "GAP-MCP-004"
      title: "No MCP Configuration Files"
      impact: "Cannot be added to Claude Desktop or VS Code"
      current_state: "No claude_desktop_config.json or similar"
      severity: "HIGH"
    
    - id: "GAP-MCP-005"
      title: "Protocol Compliance Tests Missing"
      impact: "Cannot verify MCP message format compliance"
      current_state: "Tests only check internal state, not protocol"
      severity: "MEDIUM"

# =============================================================================
# SOLUTION ARCHITECTURE
# =============================================================================

solution_architecture:
  components:
    - name: "MCP SDK Server"
      purpose: "Standard MCP server using official Python SDK"
      implementation:
        package: "mcp>=0.9.0"
        transport: "stdio (JSON-RPC 2.0)"
        entrypoint: "python -m src.mcp.server"
      protocol_endpoints:
        - "initialize"
        - "tools/list"
        - "tools/call"
        - "resources/list"
        - "resources/read"
        - "notifications"
    
    - name: "Tool Registry Enhancement"
      purpose: "Auto-discovery and registration of all @mcp_tool functions"
      features:
        - "Decorator-based registration (existing)"
        - "Tool metadata extraction"
        - "Parameter schema generation"
        - "Category-based grouping"
    
    - name: "MCP Configuration Generator"
      purpose: "Generate client configurations"
      outputs:
        - "claude_desktop_config.json"
        - "vscode-mcp-settings.json"
        - "README-MCP-INTEGRATION.md"
    
    - name: "Protocol Compliance Test Suite"
      purpose: "Validate MCP message format compliance"
      coverage:
        - "JSON-RPC 2.0 request format"
        - "Tool listing response schema"
        - "Tool call request/response"
        - "Error response format"

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  # Component 1: MCP SDK Integration (CRITICAL)
  - ac_id: "AC-MCP-001-01"
    title: "MCP SDK Server Implementation"
    description: |
      Replace custom MCPServer with official MCP SDK server implementation.
      Support stdio transport for Claude Desktop compatibility.
      Preserve all existing @mcp_tool decorated functions.
    priority: "CRITICAL"
    estimated_hours: 8
    test_count: 20
    status: "NOT_STARTED"
    deliverables:
      - "requirements.txt (add mcp>=0.9.0)"
      - "src/mcp/server.py (refactored)"
      - "src/mcp/__main__.py (entrypoint)"
      - "tests/unit/test_mcp_protocol.py"
    governance:
      - "CORE-008: TDD"
      - "CORE-011: Type hints"
      - "CORE-024: @mcp_tool Required"
    implementation_guide: |
      from mcp.server import Server, NotificationOptions
      from mcp.server.models import InitializationOptions
      from mcp.server.stdio import stdio_server
      from mcp.types import Tool, TextContent
      
      server = Server("cortex-mcp")
      
      @server.list_tools()
      async def list_tools() -> list[Tool]:
          from src.mcp.decorator import get_registered_tools
          tools = []
          for name, info in get_registered_tools().items():
              tools.append(Tool(
                  name=name,
                  description=info["description"],
                  inputSchema=info["parameters"]
              ))
          return tools
      
      @server.call_tool()
      async def call_tool(name: str, arguments: dict) -> list[TextContent]:
          from src.mcp.decorator import get_tool
          tool = get_tool(name)
          if not tool:
              raise ValueError(f"Unknown tool: {name}")
          result = tool["func"](**arguments)
          return [TextContent(type="text", text=str(result))]
      
      async def main():
          async with stdio_server() as (read_stream, write_stream):
              await server.run(
                  read_stream, write_stream,
                  InitializationOptions(
                      server_name="cortex-mcp",
                      server_version="1.0.0"
                  )
              )

  # Component 2: Critical Tool Exposure
  - ac_id: "AC-MCP-002-01"
    title: "Critical Tool MCP Exposure"
    description: |
      Add @mcp_tool decorator to highest-priority tools:
      - OrchestratorScaffolder.scaffold()
      - TemplateValidator.validate()
      - PhaseReadinessChecker.check_phase()
      - BKIOOrchestrator.ingest_knowledge()
      - AuditLogManager.query_audit_trail()
    priority: "CRITICAL"
    estimated_hours: 4
    test_count: 15
    status: "NOT_STARTED"
    deliverables:
      - "Updated src/tools/orchestrator_scaffolder.py"
      - "Updated src/tools/template_validator.py"
      - "Updated src/tools/phase_readiness_checker.py"
      - "Updated src/domain_brain/bkio_orchestrator.py"
      - "Updated src/domain_brain/audit_log_manager.py"
    tool_definitions:
      - name: "scaffold_orchestrator"
        description: "Generate a new orchestrator from template"
        parameters:
          template_name: { type: "string", required: true }
          orchestrator_name: { type: "string", required: true }
          domain: { type: "string", required: true }
          output_dir: { type: "string", required: false }
      - name: "validate_template"
        description: "Validate an orchestrator template for correctness"
        parameters:
          template_path: { type: "string", required: true }
      - name: "check_phase_readiness"
        description: "Check if a phase is ready to start"
        parameters:
          phase_id: { type: "string", required: true }
      - name: "ingest_business_knowledge"
        description: "Ingest business knowledge document"
        parameters:
          content: { type: "string", required: true }
          domain: { type: "string", required: true }
          metadata: { type: "object", required: false }
      - name: "query_audit_trail"
        description: "Query the governance audit trail"
        parameters:
          ac_id: { type: "string", required: false }
          operation: { type: "string", required: false }
          limit: { type: "integer", required: false }

  # Component 3: MCP Configuration Files
  - ac_id: "AC-MCP-003-01"
    title: "MCP Configuration Files"
    description: |
      Create configuration files for Claude Desktop and VS Code integration.
      Include setup documentation and usage examples.
    priority: "HIGH"
    estimated_hours: 1
    test_count: 5
    status: "NOT_STARTED"
    deliverables:
      - "mcp-config/claude-desktop.json"
      - "mcp-config/vscode-mcp.json"
      - "mcp-config/README.md"
      - "docs/MCP-INTEGRATION-GUIDE.md"
    configuration_template: |
      # Claude Desktop Configuration (~/.config/claude/claude_desktop_config.json)
      {
        "mcpServers": {
          "cortex": {
            "command": "python",
            "args": ["-m", "src.mcp.server"],
            "cwd": "/path/to/CORTEX",
            "env": {
              "CORTEX_DB_PATH": "./cortex-brain/state/governance.db"
            }
