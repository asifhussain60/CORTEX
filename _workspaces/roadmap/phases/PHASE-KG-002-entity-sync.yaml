---
# PHASE KG-002: Knowledge Graph Entity Sync
# Sync Domain Brain Entities to Knowledge Graph
# Version: 1.0
# Date: 2026-01-22

metadata:
  id: "PHASE-KG-002-entity-sync"
  title: "KG Entity Sync - Domain Brain → Knowledge Graph"
  subtitle: "Non-Destructive Entity Ingestion with Deduplication"
  phase_sequence: "KG-002 (after PHASE-KG-001-foundation)"
  priority: "P2-OPTIONAL"
  status: "NOT_STARTED"
  blocks_production: false
  machine: "eval"
  
  execution_metadata:
    machine_track: "eval"
    sequence_position: 2
    next_phase_id: "PHASE-KG-003-query-layer"
    dependencies: ["PHASE-KG-001-foundation"]

scope:
  total_tests: 60
  estimated_effort: "2-3 days"

executive_summary: |
  PHASE KG-002 ingests all Domain Brain entities into KG with conflict detection and deduplication.
  
  **Starting State:**
  - KG infrastructure ready (PHASE-KG-001 complete)
  - Domain Brain populated with entities from BKIO
  - Current: 500-1000 entities in SQLite
  
  **Deliverables:**
  1. BusinessKnowledgeIngestionAdapter for KG ingest
  2. Entity deduplication engine (merge duplicates by ID)
  3. Conflict resolution for entity properties
  4. Bidirectional sync (BKIO → KG updates reflected)
  5. 60+ tests validating sync completeness, correctness
  
  **Key Design:**
  - Non-destructive: original SQLite unchanged
  - Idempotent: repeated ingest produces same KG state
  - Conflict handling: property version vectors, last-write-wins
  - Fallback: if KG sync fails, continue with SQLite
  
  **Ending State:**
  - All domain brain entities in KG with relationships
  - Deduplication complete, conflict-free state
  - 60/60 tests passing
  - Ready for query layer (PHASE-KG-003)

implementation_phases:

  phase_kg2_adapter:
    id: "PHASE-KG2-ADAPTER"
    duration: "0.5 days"
    effort_hours: 4
    goal: "Create entity ingest adapter"
    
    acceptance_criteria:
      - id: "AC-KG2-ADA-001"
        description: "EntityIngestAdapter implements IGraphAdapter with entity conversion logic"
        verification: "Adapter converts Domain → Entity nodes, Relationship → edges"
    
    implementation_tasks:
      - task: "Create EntityIngestAdapter"
        files:
          - "cortex/brain/domain_brain/kg_ingest_adapter.py (NEW - ~200 lines)"
        guidance: |
          Methods:
          - ingest_domain(domain) → KG nodes + edges
          - ingest_service(service) → Service node + relationships
          - ingest_api(api) → API node, belongs-to Service edge
        verification: "Adapter tests passing"

  phase_kg2_deduplication:
    id: "PHASE-KG2-DEDUP"
    duration: "1 day"
    effort_hours: 8
    goal: "Build deduplication engine"
    
    acceptance_criteria:
      - id: "AC-KG2-DED-001"
        description: "Deduplication by ID and name matching"
        verification: "Duplicates detected and merged"
    
    implementation_tasks:
      - task: "Create EntityDeduplicator"
        files:
          - "cortex/brain/domain_brain/kg_deduplicator.py (NEW - ~250 lines)"
        guidance: |
          Algorithm:
          - Group by entity ID (exact match)
          - Fuzzy match by name (entity_name similarity > 95%)
          - Merge properties with conflict resolution
        verification: "Deduplication tests: 100 entities → 95 unique, conflicts resolved"

  phase_kg2_sync:
    id: "PHASE-KG2-SYNC"
    duration: "1 day"
    effort_hours: 8
    goal: "Implement sync orchestration"
    
    acceptance_criteria:
      - id: "AC-KG2-SYNC-001"
        description: "Full sync BKIO → KG with idempotency"
        verification: "2x sync produces identical KG state"
    
    implementation_tasks:
      - task: "Create SyncOrchestrator"
        files:
          - "cortex/brain/domain_brain/kg_sync_orchestrator.py (NEW - ~300 lines)"
        guidance: |
          Logic:
          - Load all entities from BKIO
          - Deduplicate
          - Ingest to KG
          - Log sync audit trail
          - Handle failures gracefully
        verification: "Sync tests: end-to-end scenario with 500 entities"

  phase_kg2_testing:
    id: "PHASE-KG2-TESTING"
    duration: "0.5 days"
    effort_hours: 4
    goal: "Comprehensive sync testing"
    
    acceptance_criteria:
      - id: "AC-KG2-TEST-001"
        description: "60+ tests covering adapter, dedup, sync, fallback"
        verification: "pytest: 60/60 PASSED"
    
    implementation_tasks:
      - task: "Create sync test suite"
        files:
          - "tests/integration/knowledge/test_kg_entity_sync.py (NEW - ~400 lines, 60 tests)"
        guidance: |
          Test coverage:
          - Entity conversion (10 tests)
          - Deduplication logic (15 tests)
          - Conflict resolution (10 tests)
          - Full sync E2E (15 tests)
          - Fallback scenarios (10 tests)
        verification: "60/60 tests passing"

test_files:
  total_tests: 60
  location:
    - "tests/integration/knowledge/test_kg_entity_sync.py (60 tests)"

new_files:
  - "cortex/brain/domain_brain/kg_ingest_adapter.py (~200 lines)"
  - "cortex/brain/domain_brain/kg_deduplicator.py (~250 lines)"
  - "cortex/brain/domain_brain/kg_sync_orchestrator.py (~300 lines)"
  - "tests/integration/knowledge/test_kg_entity_sync.py (~400 lines, 60 tests)"

success_metrics:
  test_pass_rate: "100% (60/60 tests)"
  entities_synced: "All domain brain entities in KG"
  deduplication_accuracy: "100% (all duplicates detected and merged)"
  sync_idempotency: "verified (2x sync = identical state)"
  existing_tests_impact: "0 breakages (7000+ tests still passing)"

next_phase: "PHASE-KG-003-query-layer"
