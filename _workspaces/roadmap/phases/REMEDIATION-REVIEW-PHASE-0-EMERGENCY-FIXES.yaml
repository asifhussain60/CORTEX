phase_id: "REMEDIATION-REVIEW-PHASE-0-EMERGENCY-FIXES"
title: "Production Emergency Fixes (8 hours)"
priority: "P0-IMMEDIATE"
machine: "remediation"
sequence: 1
estimated_effort: "8 hours (1 day)"
blocking: true
production_impact: "CRITICAL - System will fail under production load without these fixes"

acceptance_criteria: 3

ac:
  - ac_id: "AC-EMERGENCY-001"
    title: "Add Timeout to All External API Calls"
    severity: "CRITICAL"
    finding_id: "BRT-003"
    evidence_grade: "B (85%)"
    
    description: |
      External API calls lack timeout specification. Slow or hanging upstream
      services cause CORTEX to hang indefinitely, blocking all downstream requests.
    
    component: "cortex/api/external_service_client.py"
    
    issue_pattern: |
      # BEFORE (NO TIMEOUT)
      response = httpx.post(url, json=payload)  # Can hang forever
      
      # AFTER (WITH TIMEOUT)
      response = httpx.post(url, json=payload, timeout=30.0)  # Explicit timeout
    
    requirements:
      - "Add explicit timeout parameter to all httpx.post() and httpx.get() calls"
      - "Default timeout: 30 seconds (configurable per endpoint)"
      - "Implement exponential backoff for retries (1s, 2s, 4s, 8s max)"
      - "Add circuit breaker for repeated failures"
      - "Log every timeout with context (URL, response time, attempt number)"
    
    implementation_steps:
      1_audit:
        title: "Audit all external service calls"
        tasks:
          - "Find all httpx.post/get calls in cortex/api/"
          - "Find all requests.post/get calls in cortex/brain/"
          - "Find all urllib calls"
          - "Document each call location and current error handling"
      
      2_add_timeout:
        title: "Add timeout parameter to all calls"
        files_to_modify:
          - "cortex/api/external_service_client.py"
          - "cortex/brain/core/intelligence/*.py"
          - "cortex/infrastructure/*.py"
        changes:
          - "Add timeout=30.0 to all API calls"
          - "Use config value: settings.EXTERNAL_CALL_TIMEOUT"
          - "Make timeout configurable per service"
      
      3_implement_backoff:
        title: "Implement exponential backoff retry logic"
        location: "cortex/infrastructure/retry_strategy.py (already exists)"
        enhancement:
          - "Integrate with external service client"
          - "Backoff: 1s, 2s, 4s, 8s, stop after 5 attempts"
          - "Log all retry attempts"
      
      4_circuit_breaker:
        title: "Add circuit breaker for repeated failures"
        location: "cortex/infrastructure/circuit_breaker.py (already exists)"
        enhancement:
          - "Wrap external service calls with circuit breaker"
          - "Failure threshold: 5 consecutive failures"
          - "Timeout on circuit open: 60 seconds"
          - "Auto-retry after timeout"
      
      5_logging:
        title: "Add timeout logging and metrics"
        requirements:
          - "Log timeout with: URL, expected time, actual time, attempt #"
          - "Log to cortex/test_audit_trail.log"
          - "Increment EXTERNAL_CALL_TIMEOUT_COUNT metric"
    
    success_criteria:
      - "All httpx/requests/urllib calls have explicit timeout"
      - "Timeouts logged with full context"
      - "Exponential backoff implemented"
      - "Circuit breaker in place"
      - "Tests pass: 15+ new timeout tests"
    
    tests:
      - "test_timeout_on_slow_service.py: Verify timeout triggers after 30s"
      - "test_exponential_backoff.py: Verify retry delays (1,2,4,8s)"
      - "test_circuit_breaker_integration.py: Verify CB opens after 5 failures"
      - "test_timeout_logging.py: Verify timeout logged with context"
      - "+ 11 more tests covering edge cases"
    
    estimated_effort: "2-3 hours"
    files_to_create:
      - "cortex/api/external_service_timeout_config.py"
      - "tests/unit/api/test_external_call_timeouts.py"
    
    governance_compliance:
      - "CORE-027: Audit trail logging for every timeout"
      - "CORE-013: Specific exception types, no bare except"
      - "CORE-011: Type hints on all functions"
      - "CORE-012: Google docstrings"

  - ac_id: "AC-EMERGENCY-002"
    title: "Implement Fail-Fast on Critical Component Initialization"
    severity: "CRITICAL"
    finding_id: "BRT-002"
    evidence_grade: "A (95%)"
    
    description: |
      MasterOrchestrator silently continues when critical components fail to initialize.
      System appears operational but lacks knowledge-enhanced routing, missing intent
      classification, degraded response quality. No alerting on functional degradation.
    
    component: "cortex/orchestrators/core/master_orchestrator.py"
    
    issue_pattern: |
      # BEFORE (SILENT DEGRADATION)
      try:
          knowledge_repo = KnowledgeRepository.load()
      except Exception as e:
          logger.warning(f"Knowledge repo failed: {e}")  # Continue silently!
          knowledge_repo = None
      
      # AFTER (FAIL-FAST)
      try:
          knowledge_repo = KnowledgeRepository.load()
      except Exception as e:
          logger.critical(f"CRITICAL component failed: {e}")
          raise  # FAIL FAST!
    
    requirements:
      - "Classify each component as CRITICAL or OPTIONAL"
      - "CRITICAL components: raise exception on initialization failure (fail fast)"
      - "OPTIONAL components: log WARN and continue gracefully"
      - "Implement get_initialization_status() API"
      - "Add health check endpoints (/health/ready, /health/live, /health/components)"
      - "Document component criticality"
    
    component_classification:
      critical:
        - "KnowledgeRepository (lines 110-128)"
        - "BusinessKnowledgeRepository (lines 130-148)"
        - "IntelligentKnowledgeRouter (lines 150-206)"
        - "ResponseHeaderInjector (lines 216-237)"
      
      optional:
        - "MasterOrchestrationStage1 (can work without, marked enhancement)"
        - "IntentRouter Stage 2 (DummyRouter fallback acceptable)"
    
    implementation_steps:
      1_classify:
        title: "Classify all components"
        tasks:
          - "Read master_orchestrator.py lines 110-275"
          - "Document current 'log but don't fail' pattern"
          - "Classify each: CRITICAL or OPTIONAL"
      
      2_fail_fast:
        title: "Implement fail-fast for CRITICAL"
        changes:
          - "Update KnowledgeRepository init: raise on failure"
          - "Update BusinessKnowledgeRepository init: raise on failure"
          - "Update IntelligentKnowledgeRouter init: raise on failure"
          - "Update ResponseHeaderInjector init: raise on failure"
      
      3_graceful_optional:
        title: "Graceful degradation for OPTIONAL"
        changes:
          - "OPTIONAL components log WARN only"
          - "Continue with reduced capabilities"
          - "Record degradation in status API"
      
      4_status_api:
        title: "Implement get_initialization_status() API"
        location: "cortex/orchestrators/core/master_orchestrator.py"
        returns:
          - "component_name: str"
          - "initialized: bool"
          - "required: bool"
          - "degraded: bool"
          - "error_message: Optional[str]"
      
      5_health_checks:
        title: "Add health check endpoints"
        endpoints:
          - "GET /health/ready: Only CRITICAL components must succeed"
          - "GET /health/live: System is running (any state)"
          - "GET /health/components: Detailed per-component status"
        location: "cortex/api/health.py"
    
    success_criteria:
      - "All CRITICAL components fail fast on initialization failure"
      - "No silent degradation (zero log-but-don't-fail patterns)"
      - "get_initialization_status() API works correctly"
      - "Health check endpoints return accurate status"
      - "Tests pass: 12+ new health check tests"
    
    estimated_effort: "3-4 hours"
    
    tests:
      - "test_critical_component_failure.py: Verify failure raises exception"
      - "test_optional_component_failure.py: Verify OPTIONAL logs WARN only"
      - "test_initialization_status_api.py: Verify status API accuracy"
      - "test_health_ready_endpoint.py: Verify /health/ready requirement"
      - "test_health_live_endpoint.py: Verify /health/live works in any state"
      - "+ 7 more tests"

  - ac_id: "AC-EMERGENCY-003"
    title: "Add Health Check Endpoints for Production Deployment"
    severity: "CRITICAL"
    finding_id: "INTEG-003"
    evidence_grade: "B (85%)"
    
    description: |
      No health check endpoints. Load balancer cannot detect unhealthy instances.
      Failed containers stay in load balancer rotation, causing cascading failures.
      Required for production deployment.
    
    component: "cortex/api/server.py"
    
    requirements:
      - "GET /health/ready: Liveness probe (ready to serve?)"
      - "GET /health/live: Liveness probe (process running?)"
      - "GET /health/components: Detailed component status"
      - "Return HTTP 200 on success, HTTP 503 on failure"
      - "Support Kubernetes readiness/liveness probes"
      - "Return JSON with component details"
    
    implementation_steps:
      1_endpoint_ready:
        title: "/health/ready endpoint"
        returns:
          status: "ready | not_ready"
          timestamp: "ISO8601"
          components:
            - {name: "database", healthy: true}
            - {name: "governance", healthy: true}
            - {name: "orchestration", healthy: true}
      
      2_endpoint_live:
        title: "/health/live endpoint"
        returns:
          status: "alive"
          timestamp: "ISO8601"
          uptime_seconds: 12345
      
      3_endpoint_components:
        title: "/health/components endpoint"
        returns:
          - {name: "database", status: "ok", latency_ms: 5}
          - {name: "governance", status: "ok", latency_ms: 2}
          - {name: "orchestration", status: "ok", latency_ms: 1}
    
    success_criteria:
      - "/health/ready returns 200 when ready, 503 when not"
      - "/health/live returns 200 (process running)"
      - "/health/components shows detailed status"
      - "Tests pass: 8+ new health endpoint tests"
    
    estimated_effort: "1-2 hours"
    
    tests:
      - "test_health_ready_success.py: Return 200 when ready"
      - "test_health_ready_failure.py: Return 503 when critical component fails"
      - "test_health_live_endpoint.py: Always return 200 (process running)"
      - "test_health_components_endpoint.py: Detailed component status"
      - "+ 4 more edge case tests"

