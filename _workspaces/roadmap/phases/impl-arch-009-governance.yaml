# CORTEX Implementation Phase: Governance Tools
# Phase ID: impl-arch-009-governance
# Priority: P0
# Date: 2026-01-20

metadata:
  phase_id: "impl-arch-009-governance"
  title: "Governance Tools - Rules Engine & Audit"
  description: "Complete governance tooling: rule engine, audit logging, compliance reporting"
  priority: "P0"
  estimated_effort: "6-8 days"
  status: "NOT_STARTED"
  locked: false

objective:
  summary: "Build comprehensive governance framework with all 29 rules implemented and auditable"
  business_value: "Enables compliance verification, audit trails, and governance automation"

acceptance_criteria:
  - id: "GOV-TOOLS-001-01"
    description: "Rule engine evaluates all 29 governance rules"
    verification:
      - "RuleEvaluator processes all 29 SKULL rules"
      - "Context-aware rule application (CORE-008, CORE-022, CORE-030 exemptions)"
      - "Rule violation reporting with remediation hints"
      - "Batch evaluation for multiple files"
    tests:
      - "test_rule_evaluator_all_29_rules()"
      - "test_rule_evaluator_context_aware()"
      - "test_rule_evaluator_batch_processing()"

  - id: "GOV-TOOLS-001-02"
    description: "Audit logging captures all governance events"
    verification:
      - "AuditLogger records rule evaluations with context"
      - "AC lifecycle tracking (AC_START, AC_EXECUTE, AC_COMPLETE)"
      - "Immutable audit trail with timestamps"
      - "Queryable audit database"
    tests:
      - "test_audit_logger_rule_evaluation()"
      - "test_audit_logger_ac_lifecycle()"
      - "test_audit_logger_immutability()"

  - id: "GOV-TOOLS-001-03"
    description: "Compliance dashboard shows governance status"
    verification:
      - "ComplianceDashboard.get_status() returns overview"
      - "Per-rule compliance percentage"
      - "Trend analysis (improving/degrading)"
      - "Exception tracking and approval workflow"
    tests:
      - "test_compliance_dashboard_overview()"
      - "test_compliance_dashboard_per_rule()"
      - "test_compliance_dashboard_trends()"

  - id: "GOV-TOOLS-001-04"
    description: "Rule exemption and exception management"
    verification:
      - "ExceptionManager handles approved exemptions"
      - "Exemption reasons and expiry"
      - "Approval workflow integration"
      - "Audit trail of exemption decisions"
    tests:
      - "test_exception_manager_exemption()"
      - "test_exception_manager_approval_workflow()"
      - "test_exception_manager_expiry()"

  - id: "GOV-TOOLS-001-05"
    description: "Governance report generation"
    verification:
      - "ReportGenerator creates human-readable reports"
      - "HTML, PDF, JSON export formats"
      - "Customizable report templates"
      - "Historical comparison reports"
    tests:
      - "test_report_generator_html()"
      - "test_report_generator_pdf()"
      - "test_report_generator_historical()"

  - id: "GOV-TOOLS-001-06"
    description: "Integration with CI/CD pipeline"
    verification:
      - "GithubActionValidator hook for pre-commit checks"
      - "Pull request gate enforcement"
      - "Automatic report publication"
      - "Webhook notifications on violations"
    tests:
      - "test_ci_cd_hook_pre_commit()"
      - "test_ci_cd_gate_enforcement()"
      - "test_ci_cd_webhook_notification()"

implementation:
  files_to_create:
    - path: "cortex/brain/governance/rule_engine.py"
      loc: 300
      classes:
        - name: "RuleEvaluator"
          methods:
            - "evaluate_all_rules(file_path)"
            - "evaluate_rule_batch(file_paths)"

    - path: "cortex/brain/governance/audit_logger.py"
      loc: 250
      classes:
        - name: "AuditLogger"
          methods:
            - "log_rule_evaluation(rule_id, result)"
            - "log_ac_event(ac_id, event_type)"

    - path: "cortex/brain/governance/compliance_dashboard.py"
      loc: 200
      classes:
        - name: "ComplianceDashboard"
          methods:
            - "get_status()"
            - "get_per_rule_status()"
            - "get_trends()"

    - path: "cortex/brain/governance/exception_manager.py"
      loc: 150
      classes:
        - name: "ExceptionManager"
          methods:
            - "request_exception(rule_id, reason)"
            - "approve_exception(exception_id)"
            - "check_exemption(rule_id, file_path)"

    - path: "cortex/brain/governance/report_generator.py"
      loc: 250
      classes:
        - name: "ReportGenerator"
          methods:
            - "generate_html_report()"
            - "generate_pdf_report()"
            - "generate_historical_report()"

    - path: "cortex/brain/governance/ci_cd_integration.py"
      loc: 200
      classes:
        - name: "GithubActionValidator"
          methods:
            - "validate_pre_commit()"
            - "validate_pull_request()"
            - "notify_webhook()"

    - path: "tests/unit/governance/test_rule_engine.py"
      loc: 200
      test_count: 12

    - path: "tests/unit/governance/test_audit_logger.py"
      loc: 150
      test_count: 10

    - path: "tests/unit/governance/test_compliance_dashboard.py"
      loc: 150
      test_count: 10

    - path: "tests/integration/governance/test_tools_integration.py"
      loc: 200
      test_count: 12

governance:
  compliance:
    - "CORE-008: TDD"
    - "CORE-011: Type hints"
    - "CORE-012: Google docstrings"
    - "CORE-027: Audit logging"

testing_strategy:
  unit_tests:
    count: 32
    coverage_target: "100%"
  
  integration_tests:
    count: 12

dependencies:
  requires:
    - "impl-governance-001-context-aware"

success_metrics:
  - "All 29 rules implemented and tested"
  - "Audit trail 100% complete"
  - "Zero governance gaps"
