critical_issues:
  issue_1:
    id: "CIRCULAR-IMPORTS-001"
    title: "Circular Import in cortex.core Package"
    severity: "P0-CRITICAL"
    impact: "21 integration tests cannot collect; blocks all integration testing"
    root_cause: "Circular dependency pattern in cortex/core/__init__.py or core submodules"
    affected_tests: 21
    example_error: "RecursionError in cortex.core imports"
    remediation_phase: "Phase C - Fix Circular Imports"
    estimated_effort: "2-3 hours"
    unblocks: ["All 21 integration tests", "impl-arch-022-mcp-compliance", "impl-arch-025-governance-comp"]
  
  issue_2:
    id: "ARCH-TIER-DUPLICATION-001"
    title: "Governance Tier Duplication (cortex/brain/core vs cortex_brain)"
    severity: "P0-CRITICAL"
    impact: "BLOCKS 3 phases: impl-arch-011, impl-arch-022, impl-arch-025. Governance split across two locations."
    root_cause: "Historical migration created duplicate tier structures in both cortex/brain/core/ and cortex_brain/"
    affected_files: ["cortex/brain/core/governance/", "cortex/brain/core/hallucination_prevention/", "cortex_brain/tier2/"]
    remediation_phase: "Phase A - Tier Consolidation"
    estimated_effort: "4-6 hours"
    fix_steps:
      1: "Delete cortex/brain/core/governance/"
      2: "Move cortex/brain/core/hallucination_prevention/ → cortex_brain/tier2/governance/safety-rules.yaml"
      3: "Repoint BrainPopulator from cortex/brain/core/ → cortex_brain/"
      4: "Move tier_resolver.py from cortex/brain/core/ → cortex_brain/core/"
      5: "Verify tests pass"
    unblocks: ["impl-arch-011-hallucination", "impl-arch-025-governance-comp"]
  
  issue_3:
    id: "MCP-TOOLS-NO-REGISTRY-001"
    title: "MCP Tools Not Centralized (No Registry, No Discovery Mechanism)"
    severity: "P0-CRITICAL"
    impact: "BLOCKS impl-arch-022-mcp-compliance. 14 MCP tools are scattered with no categorization, governance, or discovery."
    root_cause: "MCP server.py hardcodes tool list; no registry pattern; tools lack metadata"
    affected_files: ["cortex/mcp/server.py", "cortex/mcp/tools/*.py"]
    remediation_phase: "Phase B - MCP Registry Centralization"
    estimated_effort: "8-10 hours"
    fix_steps:
      1: "Create cortex/mcp/registry.py with ToolMetadata dataclass (name, category, version, auth, governance)"
      2: "Reorganize cortex/mcp/tools/ → category subdirs (governance/, orchestration/, knowledge/, utility/)"
      3: "Update cortex/mcp/server.py to auto-discover from registry"
      4: "Move cortex/tools/ metadata as internal (not MCP-exposed)"
      5: "Implement Phase 2 tool logic after registry complete"
    tools_by_category:
      governance: 5
      orchestration: 4
      knowledge: 3
      utility: 2
    unblocks: ["impl-arch-022-mcp-compliance"]
  
  issue_4:
    id: "MISSING-CLASSES-001"
    title: "Missing Core Classes (58 classes needed but not implemented)"
    severity: "P0-CRITICAL"
    impact: "58 test files cannot import their test fixtures; test collection fails for ~50 test modules"
    root_cause: "Classes defined in test imports but not in implementation modules"
    examples:
      - "ChallengeItem in cortex/core/intent/comprehension_yaml.py"
      - "RecommendationSection, RecommendationItem in same module"
      - "EncryptionKey in cortex/core/governance/"
      - "DomainBrainAPI in cortex/domain_brain/"
      - "ApprovalGateLogic in cortex/core/orchestrator/"
    remediation_phase: "Phase D - Create Missing Modules"
    estimated_effort: "6-8 days (create stub classes)"
    note: "High volume but low complexity - mostly stub dataclasses"
  
  issue_5:
    id: "MISSING-MODULES-001"
    title: "Missing Implementation Modules (71 modules referenced but not created)"
    severity: "P0-CRITICAL"
    impact: "71 test modules cannot import implementations; test collection fails"
    root_cause: "TDD approach created tests before implementations; 125 modules have tests but no code"
    affected_modules:
      governance: 9
      domain_brain: 9
      knowledge: 6
      hallucination_prevention: 6
      orchestration: 5
      deployment: 4
      devx: 3
      intent_routing: 3
      infrastructure: 3
      mcp: 2
      other: 11
    remediation_phase: "Phase D - Create Missing Modules (8-12 days) + Phase E - Implement (15-20 days)"
    estimated_effort: "25-30 days total (stubs + implementations)"

phases:
  phase_a:
    id: "Phase A - Tier Consolidation"
    duration: "1 day (4-6 hours)"
    status: "NOT_STARTED"
    priority: "P0-CRITICAL"
    blocks: ["Phase B", "Phase C", "impl-arch-011", "impl-arch-022", "impl-arch-025"]
    depends_on: []
    
    acceptance_criteria:
      - "✅ Delete cortex/brain/core/governance/"
      - "✅ Move cortex/brain/core/hallucination_prevention/ → cortex_brain/tier2/governance/"
      - "✅ Repoint BrainPopulator to cortex_brain/"
      - "✅ All tests pass (should be same as before)"
      - "✅ Single source of truth for governance tier"
    
    detailed_steps:
      step_1:
        description: "Audit cortex/brain/core/governance/ contents"
        effort: "30 min"
        files_to_review:
          - "cortex/brain/core/governance/*.py"
          - "cortex_brain/tier0/governance/"
        action: "Verify what's in cortex/brain/core/ vs cortex_brain/"
      
      step_2:
        description: "Move hallucination_prevention Python to tier2 governance YAML"
        effort: "1 hour"
        action: "Convert cortex/brain/core/hallucination_prevention/*.py to cortex_brain/tier2/governance/safety-rules.yaml"
        files_involved:
          - "cortex/brain/core/hallucination_prevention/*.py"
          - "cortex_brain/tier2/governance/safety-rules.yaml"
      
      step_3:
        description: "Update BrainPopulator tier loading"
        effort: "1 hour"
        files: ["cortex_brain/tier0/tier_resolver.py", "cortex/brain/governance_orchestrator.py"]
        changes: "Point to cortex_brain/ instead of cortex/brain/core/"
      
      step_4:
        description: "Move tier_resolver.py"
        effort: "30 min"
        action: "Move cortex/brain/core/tier_resolver.py → cortex_brain/core/"
      
      step_5:
        description: "Delete duplicate cortex/brain/core/governance"
        effort: "15 min"
        action: "rm -rf cortex/brain/core/governance/"
      
      step_6:
        description: "Verify all tests pass"
        effort: "30 min"
        command: "pytest tests/unit tests/integration -x"
        expected: "Same or better pass rate"
    
    git_checkpoint: "checkpoint: before Phase A tier consolidation"
    readiness_improvement: "36% → 60%"
  
  phase_b:
    id: "Phase B - MCP Registry Centralization"
    duration: "2 days (8-10 hours)"
    status: "NOT_STARTED"
    priority: "P0-CRITICAL"
    depends_on: ["Phase A"]
    blocks: ["Phase C", "impl-arch-022-mcp-compliance"]
    
    acceptance_criteria:
      - "✅ Create cortex/mcp/registry.py with tool metadata"
      - "✅ Reorganize cortex/mcp/tools/ by category"
      - "✅ Update server.py for auto-discovery"
      - "✅ All MCP tests pass"
      - "✅ Tool discovery working"
    
    detailed_steps:
      step_1:
        description: "Create ToolMetadata dataclass and registry"
        effort: "3 hours"
        file: "cortex/mcp/registry.py"
        content_outline:
          - "@dataclass ToolMetadata (name, category, version, auth_required, governance_rules)"
          - "class ToolRegistry (register, discover, get_by_category, validate)"
          - "Load all tools on initialization"
      
      step_2:
        description: "Reorganize cortex/mcp/tools/ folder structure"
        effort: "2 hours"
        action: "Create subdirectories and move tools"
        structure:
          governance: ["query_tool.py", "validate_tool.py", "execute_tool.py", "analyze_tool.py", "report_tool.py"]
          orchestration: ["status_tool.py", "monitor_tool.py", "optimize_tool.py", "diagnose_tool.py"]
          knowledge: ["search_tool.py", "analyze_tool.py", "generate_tool.py"]
          utility: ["echo_tool.py", "sample_tool.py"]
      
      step_3:
        description: "Update cortex/mcp/server.py"
        effort: "2 hours"
        changes:
          old: "tools = [list of tool imports]"
          new: "registry = ToolRegistry.initialize(); tools = registry.discover_all()"
      
      step_4:
        description: "Update cortex/tools/ metadata as internal"
        effort: "1 hour"
        action: "Add __mcp_exposed__ = False to cortex/tools/__init__.py"
      
      step_5:
        description: "Test tool discovery"
        effort: "1 hour"
        command: "pytest cortex/mcp/test_registry.py"
        expected: "All discovery tests pass"
    
    git_checkpoint: "checkpoint: after Phase B MCP registry"
    readiness_improvement: "60% → 95%"
  
  phase_c:
    id: "Phase C - Fix Circular Imports"
    duration: "2 days (8-12 hours)"
    status: "NOT_STARTED"
    priority: "P0-CRITICAL"
    depends_on: ["Phase A", "Phase B"]
    blocks: ["Phase D", "Phase E"]
    
    acceptance_criteria:
      - "✅ Circular import broken (RecursionError eliminated)"
      - "✅ 21 integration tests collect without error"
      - "✅ All other tests collect successfully"
      - "✅ No import-time side effects"
    
    detailed_steps:
      step_1:
        description: "Identify circular import chain"
        effort: "2 hours"
        command: "python -c 'import cortex.core' (trace with verbose import)"
        action: "Find the module causing recursion"
      
      step_2:
        description: "Refactor imports using lazy loading"
        effort: "4 hours"
        pattern: "Use TYPE_CHECKING or import inside functions"
        files_to_check:
          - "cortex/core/__init__.py"
          - "cortex/core/governance/__init__.py"
          - "cortex/core/orchestrators/__init__.py"
      
      step_3:
        description: "Verify import order"
        effort: "2 hours"
        action: "Ensure parent modules don't depend on children at import time"
      
      step_4:
        description: "Test all imports"
        effort: "2 hours"
        command: "pytest --collect-only -q (should show 0 errors)"
        expected: "6097 items / 0 errors"
    
    git_checkpoint: "checkpoint: after Phase C circular import fix"
    readiness_improvement: "95% → 98%"
  
  phase_d:
    id: "Phase D - Create Missing Modules (Stubs)"
    duration: "3-4 days (24-32 hours)"
    status: "NOT_STARTED"
    priority: "P0-HIGH (follows C)"
    depends_on: ["Phase C"]
    blocks: ["Phase E"]
    
    acceptance_criteria:
      - "✅ All 71 missing modules created as stubs"
      - "✅ All 58 missing classes created"
      - "✅ All test imports resolve"
      - "✅ Test collection: 6097 items / 0 errors"
      - "✅ No import errors in any test file"
    
    module_creation_strategy:
      governance: "Create dataclasses for CostTracker, SLATracker, PIIDetector, etc."
      domain_brain: "Create adapter interfaces and factory classes"
      knowledge: "Create KnowledgeGraph extensions, search, analytics classes"
      hallucination: "Create detection, confidence scoring, boundary enforcement classes"
      orchestration: "Create conversation protocol, approval gate logic"
      deployment: "Create deployment, health check, configuration classes"
    
    priority_order:
      p1_blocking: ["conversation_protocol.py", "orchestrator_decorator.py", "mcp_request.py", "mcp_response.py"]
      p2_high: ["all governance modules (9)", "all domain_brain adapters (9)", "hallucination_prevention (6)"]
      p3_medium: ["knowledge extensions (6)", "intent routing (3)", "infrastructure (3)"]
      p4_low: ["devx tools (3)", "deployment (4)", "mcp (2)", "other (11)"]
    
    effort_breakdown:
      p1: "6-8 hours"
      p2: "10-12 hours"
      p3: "6-8 hours"
      p4: "4-6 hours"
    
    total_effort: "24-32 hours (3-4 days)"
    parallel_work: "Can assign to multiple engineers"
    
    git_checkpoints:
      - "checkpoint: before Phase D stub creation"
      - "checkpoint: P1 modules complete"
      - "checkpoint: P2 modules complete"
      - "checkpoint: Phase D all stubs complete"
    
    readiness_improvement: "98% → 99%"
  
  phase_e:
    id: "Phase E - Implement TDD Production Readiness (125 Modules)"
    duration: "2-3 weeks (15-20 days)"
    status: "NOT_STARTED"
    priority: "P2-MEDIUM (follows D)"
    depends_on: ["Phase D"]
    
    acceptance_criteria:
      - "✅ All 125 modules with functional implementations"
      - "✅ All tests passing (90%+ pass rate)"
      - "✅ Zero errors, zero warnings in test output"
      - "✅ All governance rules enforced"
      - "✅ Code quality metrics met (type hints, docstrings, coverage)"
    
    scope: "impl-tdd-prod-ready.yaml"
    file_reference: "_workspaces/roadmap/phases/impl-tdd-prod-ready.yaml"
    
    module_implementation_order:
      phase_1: "P1 critical modules (6-8 days)"
      phase_2: "P2 high-priority modules (5-7 days)"
      phase_3: "P3 medium-priority modules (3-5 days)"
    
    testing_strategy:
      unit: "~300 existing unit tests, implement to green"
      integration: "~80 integration tests, verify compatibility"
      e2e: "~29 E2E tests, validate end-to-end workflows"
    
    governance_compliance:
      core_rules: "All 29 core rules enforced"
      type_hints: "100% coverage"
      docstrings: "Google style on all public APIs"
      no_bare_except: "Zero bare except clauses"
      git_checkpoints: "Frequent commits per AC-ID"
    
    effort_breakdown_by_category:
      core: "87 modules → 8-10 days (highest complexity)"
      orchestrators: "9 modules → 1-2 days"
      domain: "14 modules → 1-2 days"
      infrastructure: "5 modules → 1 day"
      mcp: "1 module → 0.5 days"
      other: "9 modules → 1 day"
    
    total_effort: "15-20 days"
    parallel_work: "Can assign 2-3 engineers per phase"
    
    readiness_improvement: "99% → 100%"

