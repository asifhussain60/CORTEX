# Phase J: Governance Content Population
# Required for 100% Production Readiness Confidence
# Date: 2026-01-20
# Priority: P1-MEDIUM (governance rules must be enforced)

metadata:
  phase_id: "impl-governance-content"
  title: "Governance Tier Content Population"
  description: "Populate tier1 and tier2 governance content for complete rule coverage"
  priority: "P1-MEDIUM"
  estimated_effort: "2-3 days"
  blocks_production: false  # Can run with tier0 only
  recommended_before_production: true

executive_summary: |
  Current state:
  - tier0: core-rules.yaml exists (29 rules) ✅
  - tier1: Empty or minimal ❌
  - tier2: Placeholder files only ❌
  
  Without tier1/tier2:
  - Domain-specific rules not enforced
  - Context-aware governance incomplete
  - Security policies not differentiated by environment

current_state:
  tier0:
    location: "cortex_brain/tier0/governance/core-rules.yaml"
    rules_count: 29
    coverage: "Universal rules (CORE-001 through CORE-029)"
    
  tier1:
    location: "cortex_brain/tier1/"
    rules_count: 0
    expected_coverage: "Domain-specific rules (by business domain)"
    
  tier2:
    location: "cortex_brain/tier2/"
    rules_count: "~0 (files exist but empty/stub)"
    expected_coverage: "Context-specific rules (by environment, user role, sensitivity)"

target_state:
  tier0:
    rules: 29
    
  tier1:
    rules: 15-20
    domains:
      - "security"
      - "compliance"
      - "development"
      - "operations"
      - "data"
    
  tier2:
    rules: 25-30
    contexts:
      - "production_environment"
      - "development_environment"
      - "sensitive_data"
      - "high_risk_operations"
      - "audit_required"

acceptance_criteria:
  - id: "AC-GOV-001"
    description: "tier1 domain rules documented (5+ domains)"
    verification: "cortex_brain/tier1/governance/ contains 5+ domain YAML files"
    domains_required:
      - "security-rules.yaml"
      - "compliance-rules.yaml"
      - "development-rules.yaml"
      - "operations-rules.yaml"
      - "data-rules.yaml"
    
  - id: "AC-GOV-002"
    description: "tier2 context-specific rules documented (10+ scenarios)"
    verification: "cortex_brain/tier2/governance/ contains context rules"
    scenarios_required:
      - "production-rules.yaml"
      - "development-rules.yaml"
      - "sensitive-data-rules.yaml"
      - "high-risk-operations-rules.yaml"
      - "audit-critical-rules.yaml"
    
  - id: "AC-GOV-003"
    description: "BrainPopulator loads all tiers correctly"
    verification: "Unit test verifies tier0, tier1, tier2 loaded"
    
  - id: "AC-GOV-004"
    description: "Governance dashboard shows rule coverage"
    verification: "Dashboard displays tier breakdown and rule counts"
    
  - id: "AC-GOV-005"
    description: "Rule precedence works correctly (tier0 < tier1 < tier2)"
    verification: "Test verifies tier2 overrides tier1 overrides tier0"

tier1_domain_rules:
  security:
    file: "cortex_brain/tier1/governance/security-rules.yaml"
    rules:
      - id: "SEC-001"
        description: "All API endpoints require authentication"
        enforcement: "BLOCK"
        
      - id: "SEC-002"
        description: "Sensitive operations require MFA"
        enforcement: "BLOCK"
        
      - id: "SEC-003"
        description: "Password complexity requirements"
        enforcement: "BLOCK"
        
      - id: "SEC-004"
        description: "Session timeout after inactivity"
        enforcement: "WARN"
        
  compliance:
    file: "cortex_brain/tier1/governance/compliance-rules.yaml"
    rules:
      - id: "COMP-001"
        description: "PII handling requires encryption"
        enforcement: "BLOCK"
        
      - id: "COMP-002"
        description: "Audit logs retained for 7 years"
        enforcement: "BLOCK"
        
      - id: "COMP-003"
        description: "Data access requires justification"
        enforcement: "WARN"
        
  development:
    file: "cortex_brain/tier1/governance/development-rules.yaml"
    rules:
      - id: "DEV-001"
        description: "Code review required before merge"
        enforcement: "BLOCK"
        
      - id: "DEV-002"
        description: "Tests required for new features"
        enforcement: "BLOCK"
        
      - id: "DEV-003"
        description: "Documentation required for APIs"
        enforcement: "WARN"
        
  operations:
    file: "cortex_brain/tier1/governance/operations-rules.yaml"
    rules:
      - id: "OPS-001"
        description: "Deployments require approval"
        enforcement: "BLOCK"
        
      - id: "OPS-002"
        description: "Rollback plan required"
        enforcement: "WARN"
        
      - id: "OPS-003"
        description: "Monitoring configured before deployment"
        enforcement: "BLOCK"
        
  data:
    file: "cortex_brain/tier1/governance/data-rules.yaml"
    rules:
      - id: "DATA-001"
        description: "Data classification required"
        enforcement: "BLOCK"
        
      - id: "DATA-002"
        description: "Data retention policy applied"
        enforcement: "WARN"
        
      - id: "DATA-003"
        description: "Data lineage tracked"
        enforcement: "WARN"

tier2_context_rules:
  production:
    file: "cortex_brain/tier2/governance/production-rules.yaml"
    context: "environment == 'production'"
    rules:
      - id: "PROD-001"
        description: "Debug logging disabled"
        enforcement: "BLOCK"
        
      - id: "PROD-002"
        description: "Performance profiling disabled by default"
        enforcement: "WARN"
        
      - id: "PROD-003"
        description: "Error details not exposed to users"
        enforcement: "BLOCK"
        
  development:
    file: "cortex_brain/tier2/governance/development-rules.yaml"
    context: "environment == 'development'"
    rules:
      - id: "DEV-ENV-001"
        description: "Debug logging allowed"
        enforcement: "ALLOW"
        
      - id: "DEV-ENV-002"
        description: "Mock external services allowed"
        enforcement: "ALLOW"
        
  sensitive_data:
    file: "cortex_brain/tier2/governance/sensitive-data-rules.yaml"
    context: "data_classification == 'sensitive'"
    rules:
      - id: "SENS-001"
        description: "Encryption at rest required"
        enforcement: "BLOCK"
        
      - id: "SENS-002"
        description: "Access logging required"
        enforcement: "BLOCK"
        
      - id: "SENS-003"
        description: "Data masking in logs"
        enforcement: "BLOCK"
        
  high_risk:
    file: "cortex_brain/tier2/governance/high-risk-rules.yaml"
    context: "operation_risk == 'high'"
    rules:
      - id: "RISK-001"
        description: "Dual approval required"
        enforcement: "BLOCK"
        
      - id: "RISK-002"
        description: "Rollback plan mandatory"
        enforcement: "BLOCK"
        
      - id: "RISK-003"
        description: "Post-execution verification required"
        enforcement: "BLOCK"

implementation_plan:
  day_1:
    title: "tier1 Domain Rules"
    tasks:
      - "Create tier1 governance directory structure"
      - "Create security-rules.yaml"
      - "Create compliance-rules.yaml"
      - "Create development-rules.yaml"
      - "Create operations-rules.yaml"
      - "Create data-rules.yaml"
    deliverables:
      - "5 tier1 YAML files with 15-20 rules total"
    
  day_2:
    title: "tier2 Context Rules"
    tasks:
      - "Create tier2 governance directory structure"
      - "Create production-rules.yaml"
      - "Create development-rules.yaml"
      - "Create sensitive-data-rules.yaml"
      - "Create high-risk-rules.yaml"
      - "Create audit-critical-rules.yaml"
    deliverables:
      - "5 tier2 YAML files with 25-30 rules total"
    
  day_3:
    title: "Integration & Validation"
    tasks:
      - "Update BrainPopulator to load new rules"
      - "Create unit tests for tier loading"
      - "Create precedence tests"
      - "Update governance dashboard"
      - "Document governance tiers"
    deliverables:
      - "Tests passing for all tiers"
      - "Dashboard showing rule coverage"
      - "docs/05-reference/governance-tiers.md"

yaml_rule_format:
  example: |
    # cortex_brain/tier1/governance/security-rules.yaml
    ---
    tier: 1
    domain: "security"
    version: "1.0"
    rules:
      - id: "SEC-001"
        name: "Authentication Required"
        description: "All API endpoints require authentication"
        enforcement: "BLOCK"  # BLOCK, WARN, ALLOW
        applies_to:
          - "api_endpoints"
        exceptions:
          - "/health"
          - "/metrics"
        validation:
          type: "header_present"
          header: "Authorization"

success_metrics:
  before:
    tier0_rules: 29
    tier1_rules: 0
    tier2_rules: 0
    total_rules: 29
    domain_coverage: "0%"
    context_coverage: "0%"
  
  after:
    tier0_rules: 29
    tier1_rules: "15-20"
    tier2_rules: "25-30"
    total_rules: "69-79"
    domain_coverage: "5 domains"
    context_coverage: "5+ contexts"

dependencies:
  requires: ["Phase A tier consolidation complete"]
  enables: ["Full governance enforcement in production"]

governance_compliance:
  - "CORE-001: All rules <500 lines per file"
  - "CORE-012: Rules documented with descriptions"
  - "CORE-026: Git checkpoint after each tier"
  - "CORE-027: Governance changes audited"
