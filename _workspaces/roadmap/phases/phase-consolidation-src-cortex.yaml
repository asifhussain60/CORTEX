metadata:
  phase_id: PHASE-CONSOLIDATION-SRC-CORTEX
  phase_number: REMEDIATION-CONSOLIDATION
  title: Source Folder Consolidation - Single Canonical Location
  description: |
    Resolve critical ambiguity created by dual source folders (src/ and cortex/).
    Tests import from src.* but implementations are in cortex.*.
    This consolidation establishes cortex/ as the canonical source location.
    
    CRITICAL BLOCKER: All subsequent phases depend on working test discovery.
    This phase MUST complete before PHASE-ONBOARDING-ORCHESTRATOR.
    
  category: Infrastructure & Quality
  priority: P0 (CRITICAL BLOCKER)
  status: NOT_STARTED
  locked: false
  created_at: '2026-01-20T12:00:00Z'
  
  blockers_before_this_phase: []
  
  blocks_these_phases:
    - PHASE-ONBOARDING-ORCHESTRATOR
    - All production phases (cannot verify without working tests)
    
  depends_on:
    - AC-REM-CROSS-PLATFORM-001-01 (Module inventory complete)
    
  related_issues:
    - 170+ test collection errors (ModuleNotFoundError)
    - Dual folder maintenance creating inconsistency
    - conftest.py sys.path workaround masking root cause
    - Governance blocks: Cannot verify CORE-008 (TDD) or CORE-026 compliance
    
analysis_reference: _workspaces/roadmap/reports/CONSOLIDATION-ANALYSIS-SRC-VS-CORTEX.md

phases:
  AC-CONS-001-01:
    id: AC-CONS-001-01
    title: Audit & Validate src/ vs cortex/ Content
    description: |
      Comprehensive catalog of what exists in each folder, identify duplication,
      and determine what's unique to each location.
      
      Deliverables:
      - Folder structure audit report
      - File inventory by module
      - Overlap analysis (what exists in both)
      - Unique content identification
      
    acceptance_criteria:
      - All 79 src/ files categorized (duplicate vs unique)
      - All 388 cortex/ files reviewed
      - Overlap map created (core, orchestrators, infrastructure, mcp, tools)
      - Decision matrix for each unique file (archive/move/delete)
      - Report in _workspaces/roadmap/reports/
    estimated_hours: 1
    tests_expected: 0 (audit task, no code)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE logged
    
  AC-CONS-002-01:
    id: AC-CONS-002-01
    title: Archive & Migrate Unique src/ Content
    description: |
      Move unique src/ content (deployment, complexity, confirmation, versioning)
      to appropriate cortex/ subdirectories or archive.
      Remove duplicate modules from src/ (core, orchestrators, infrastructure, mcp, tools).
      
      After this step: src/ will be empty or minimal.
      
    acceptance_criteria:
      - src/deployment/* → cortex/deployment/ (or archive)
      - src/complexity/* → cortex/complexity/ (or archive)
      - src/confirmation/* → cortex/confirmation/ (or archive)
      - src/versioning/* → cortex/versioning/ (or archive)
      - Duplicates removed: src/core, src/orchestrators, src/infrastructure, src/mcp, src/tools
      - src/__init__.py removed
      - Git checkpoint created
      
    deliverables:
      - Migrated files in cortex/
      - Updated imports (if any) in moved files
      - Migration log/report
      
    estimated_hours: 1
    tests_expected: 0 (infrastructure task)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with git checkpoint
      
  AC-CONS-003-01:
    id: AC-CONS-003-01
    title: Refactor All Test Imports (src.* → cortex.*)
    description: |
      Update all 409 test files to import from cortex.* instead of src.*.
      
      Pattern:
        from src.core.config import Config
        ↓
        from cortex.core.config import Config
        
      Use automated AST-based refactoring where possible to minimize errors.
      
    acceptance_criteria:
      - All test files updated (409 total)
      - Search: Zero instances of "from src." or "import src." remain
      - No broken imports introduced
      - All tests still have valid syntax
      - Git checkpoint created
      
    deliverables:
      - Updated test files (all 409)
      - Refactoring log (files changed, patterns replaced)
      - No syntax errors introduced
      
    estimated_hours: 3
    tests_expected: 0 (refactoring task, tests run in AC-004)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with git checkpoint
      
  AC-CONS-003-02:
    id: AC-CONS-003-02
    title: Update conftest.py Path Resolution
    description: |
      Remove src/ from conftest.py sys.path entries (no longer needed).
      Verify cortex/ path is correctly added and validated.
      Update comments to reflect canonical location.
      
    acceptance_criteria:
      - sys.path.insert() for src/ removed
      - cortex/ path verified and documented
      - conftest.py reflects single canonical location
      - Comments updated
      - Git checkpoint created
      
    deliverables:
      - Updated conftest.py
      - Minimal, clean sys.path setup
      
    estimated_hours: 0.5
    tests_expected: 0 (configuration task)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with git checkpoint
      
  AC-CONS-004-01:
    id: AC-CONS-004-01
    title: Validate Test Collection & Import Resolution
    description: |
      Run pytest --collect-only to verify:
      - Zero ModuleNotFoundError
      - All 409 tests discoverable
      - No import ambiguity
      - All test files have valid syntax
      
    acceptance_criteria:
      - pytest --collect-only returns 0 errors
      - 409+ tests collected successfully
      - No "ModuleNotFoundError" in output
      - No "ImportError" in output
      - Collection report saved
      - Git checkpoint created
      
    deliverables:
      - pytest collection report (clean output)
      - Verification log
      
    estimated_hours: 1
    tests_expected: 409 (discovery only, not execution)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with git checkpoint
      
  AC-CONS-004-02:
    id: AC-CONS-004-02
    title: Execute Full Test Suite & Verify Execution
    description: |
      Run pytest with full suite to verify:
      - Tests execute (pass/fail/error all acceptable at this stage)
      - No collection errors
      - 100%+ test execution rate
      - Baseline metrics captured
      
      Note: Test FAILURES are acceptable here. We're verifying tests CAN RUN.
      Actual test fixes come in subsequent phases.
      
    acceptance_criteria:
      - pytest runs without collection errors
      - All 409+ tests attempt execution (no collection errors)
      - Test execution report generated
      - Baseline pass/fail/error counts established
      - No import failures at runtime
      - Git checkpoint created
      
    deliverables:
      - pytest execution report
      - Test metrics baseline
      - Coverage report (optional)
      
    estimated_hours: 2
    tests_expected: 409 (full execution)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with git checkpoint
      
  AC-CONS-005-01:
    id: AC-CONS-005-01
    title: Documentation & Status Updates
    description: |
      Update all documentation to reflect single canonical source folder.
      Update cortex-master.yaml status.
      Update prompts and README.
      
    acceptance_criteria:
      - cortex-master.yaml updated with completion status
      - phase_tracker shows locked: true
      - docs/ updated with new structure
      - PHASE-CONSOLIDATION-SRC-CORTEX marked COMPLETED
      - Prompts updated (reference cortex.* only)
      - Git checkpoint & phase lock
      
    deliverables:
      - Updated cortex-master.yaml
      - Updated docs/
      - Completion report
      
    estimated_hours: 1
    tests_expected: 0 (documentation)
    audit_requirements:
      - AC_START logged
      - AC_EXECUTE logged
      - AC_COMPLETE with phase lock
      
success_metrics:
  before_consolidation:
    - 170+ ModuleNotFoundError on pytest collection
    - 409 tests undiscoverable
    - Dual folder maintenance overhead
    - Developer confusion about canonical location
    
  after_consolidation:
    - 0 import errors on pytest collection
    - 409+ tests discoverable
    - Single canonical source: cortex/
    - Clear, unambiguous import paths
    - conftest.py simplified
    - All subsequent phases unblocked
    
total_estimated_hours: 9.5
total_estimated_days: 1.5
actual_hours: null
actual_days: null

