  CRITICAL PHASE for project health.
  
  This consolidation is necessary because:
  1. Tests reference src.* but implementations in cortex.*
  2. conftest.py workaround is masking root cause
  3. Dual maintenance creates technical debt
  4. All downstream phases blocked without working tests
  
  Once complete:
  - Test suite becomes executable baseline
  - Enables CI/CD verification
  - Unblocks all production phases
  - Validates "CORTEX fully active and wired in" claim
