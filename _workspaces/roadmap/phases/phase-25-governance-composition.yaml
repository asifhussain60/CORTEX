architecture:
  layers:
    - layer: Layer 1 - Profile Definition
      components:
        - Profile dataclass
        - ProfileRegistry singleton
        - YAML parser
        - Circular dependency detector
    
    - layer: Layer 2 - Severity Gates
      components:
        - SeverityGate executor
        - BLOCKED gate (fail-fast)
        - WARNING gate (informational)
        - INFO gate (audit-only)
    
    - layer: Layer 3 - Profile Selection
      components:
        - ProfileSelectionMatrix
        - ProfileSelector with caching
        - Intent-context mapping
        - Fallback profiles
    
    - layer: Layer 4 - Constraint Validation
      components:
        - DependencyGraph builder
        - Topological sorter
        - Constraint satisfaction checker
        - CompositeRuleEvaluator

