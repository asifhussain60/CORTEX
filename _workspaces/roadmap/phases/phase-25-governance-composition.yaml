    - "Full dependency chain visible in logs"
  
  reliability:
    - ">95% code coverage for all governance modules"
    - "180+ passing tests (unit + integration)"
    - "Zero regressions to existing phases"

notes: |
  Governance Composite Rules Enhancement - Intent-Driven Rule Profiling
  
  This phase transforms governance from independent rule filtering to composite
  profiling with deterministic selection and severity gating. It addresses:
  
  - Implicit rule dependencies (CORE-008 requires CORE-011 + CORE-012)
  - Late-stage failures from missing transitive dependencies
  - Non-deterministic rule selection causing unpredictable behavior
  - Redundant validation overhead (40% of rule checks unnecessary)
  
  All 8 ACs must be completed sequentially. Integration with Stage 2 routing
  (AC-GC-007-01) is blocking and must be completed before moving to next phase.
  
  Key design decisions:
  1. Pre-validated profiles (not runtime DAG resolution) for determinism
  2. Severity gates for ordered evaluation (not unordered set)
  3. Profile caching for efficiency
  4. Explicit dependencies in profiles (not implicit)
  5. Intent-context matrix for O(1) profile selection
  
  Expected outcomes:
  - 50-60% efficiency gain in governance overhead
  - 100% deterministic rule selection and ordering
  - Complete auditability of all governance decisions
  - Zero impact on currently locked phases
