# TDD Production Readiness Plan
# CORTEX Implementation Gap Remediation
# Date: 2026-01-20

metadata:
  id: "impl-tdd-prod-ready"
  title: "TDD Implementation Gap - Production Readiness"
  priority: "P0-CRITICAL"
  blocks_production: true
  
executive_summary: |
  CORTEX has 125 modules with TDD tests but missing implementations.
  Tests import 'src.*' modules that don't exist in consolidated 'cortex/' structure.
  
  **Root Cause:** Package consolidation (src/ → cortex/) orphaned test imports.
  **Impact:** ~262 tests collected, 170+ errors on import failures.
  **Solution:** Three-phase remediation (stub → implement → validate).

problem_statement:
  discovered: "2026-01-20"
  test_failures: 170
  missing_modules: 125
  test_files_affected: ~200
  
  breakdown_by_category:
    core: 87  # Largest gap - orchestrator, knowledge, governance
    orchestrators: 9
    domain: 14
    infrastructure: 5
    mcp: 1
    other: 9
  
  critical_modules:
    - "src.core.orchestrator.conversation_protocol"  # 35+ test references
    - "src.core.knowledge.knowledge_graph"  # E2E tests blocked
    - "src.core.decorators.orchestrator_decorator"  # 50+ test references
    - "src.core.governance_pregate"  # Governance validation
    - "src.infrastructure.database"  # 15+ test dependencies

remediation_strategy:
  phases:
    - phase: "PHASE-1-STUB-GENERATION"
      duration: "1-2 days"
      description: "Generate stub implementations with correct signatures"
      deliverables:
        - 125 stub .py files in cortex/
        - All imports resolve correctly
        - Tests collect without errors
      
    - phase: "PHASE-2-IMPLEMENTATION"
      duration: "8-12 days"
      description: "Implement functional code for each module"
      deliverables:
        - Working implementations with business logic
        - Type hints (CORE-011 compliant)
        - Google docstrings (CORE-012 compliant)
      
    - phase: "PHASE-3-VALIDATION"
      duration: "3-4 days"
      description: "Test validation and production hardening"
      deliverables:
        - ≥98% test pass rate
        - Integration test validation
        - Production smoke tests

  implementation_order:
    priority_1_critical:  # P0 - Blocks all tests
      - "core.decorators.orchestrator_decorator"
      - "core.orchestrator.conversation_protocol"
      - "core.interfaces.i_orchestrator"
      - "infrastructure.database"
      - "infrastructure.enhanced_audit_logger"
    
    priority_2_high:  # P1 - Blocks major features
      - "core.knowledge.knowledge_graph"
      - "core.knowledge.unified_service"
      - "core.governance_pregate"
      - "core.governance_registry"
      - "orchestrators.core.master_orchestrator"
    
    priority_3_medium:  # P2 - Blocks specific features
      - "core.intent.intent_router"
      - "core.intent.lens_context_builder"
      - "mcp.server_sdk"
      - "domain_brain.*"
      - "orchestrators.response.*"
    
    priority_4_low:  # P3 - Nice to have
      - "devx.*"
      - "templates.*"
      - "versioning.*"
      - "observability.*"

implementation_plan:
  step_1_environment_setup:
    duration: "4 hours"
    actions:
      - Fix conftest.py deprecated hooks
      - Create stub generation script
      - Establish test baseline
      - Document module dependencies
  
  step_2_stub_generation:
    duration: "1-2 days"
    method: "Automated"
    script: "scripts/generate_stubs_from_tests.py"
    output: "125 stub files in cortex/"
    validation:
      - All test imports resolve
      - pytest --collect-only succeeds
      - No ImportError or ModuleNotFoundError
  
  step_3_p0_implementation:
    duration: "3-4 days"
    modules: 5
    focus: "Critical path - orchestrator + database"
    target: "Unblock 70% of test suite"
    deliverables:
      - orchestrator_decorator.py (50+ test refs)
      - conversation_protocol.py (35+ test refs)
      - i_orchestrator.py (protocol definition)
      - database.py (DatabaseManager, DatabaseConfig)
      - enhanced_audit_logger.py (audit trail)
  
  step_4_p1_implementation:
    duration: "3-4 days"
    modules: 5
    focus: "Knowledge graph + governance"
    target: "Unblock 90% of test suite"
    deliverables:
      - knowledge_graph.py (KnowledgeGraph, query methods)
      - unified_service.py (UnifiedKnowledgeService)
      - governance_pregate.py (pre-execution validation)
      - governance_registry.py (rule registration)
      - master_orchestrator.py (4-stage pipeline)
  
  step_5_remaining_implementation:
    duration: "4-6 days"
    modules: 115
    focus: "Complete remaining modules"
    approach: "Batch by category (intent, mcp, domain, etc.)"
  
  step_6_validation:
    duration: "3-4 days"
    activities:
      - Run full test suite
      - Fix failing tests
      - Verify integration tests
      - Production smoke test
    success_criteria:
      - ≥98% test pass rate
      - 0 import errors
      - All P0/P1 modules functional

resource_requirements:
  developers: 2-3
  effort: "20-25 person-days"
  timeline: "2-3 weeks"
  tooling:
    - AST parser for stub generation
    - Test coverage analyzer
    - Import dependency mapper

risks_and_mitigations:
  risk_1:
    description: "Circular dependencies between modules"
    probability: "HIGH"
    impact: "MEDIUM"
    mitigation: "Dependency graph analysis before implementation"
  
  risk_2:
    description: "Tests expect different interfaces than stubs"
    probability: "MEDIUM"
    impact: "HIGH"
    mitigation: "Generate stubs from test expectations (AST analysis)"
  
  risk_3:
    description: "Missing business logic context"
    probability: "MEDIUM"
    impact: "MEDIUM"
    mitigation: "Review existing cortex/ implementations for patterns"
  
  risk_4:
    description: "Tests may be obsolete/wrong"
    probability: "LOW"
    impact: "LOW"
    mitigation: "Mark failing tests with @pytest.mark.skip + issue tracker"

success_metrics:
  test_collection:
    current: "262 items / 170 errors"
    target: "262+ items / 0 errors"
  
  test_pass_rate:
    current: "Unknown (imports fail)"
    target: "≥98%"
  
  import_errors:
    current: 170
    target: 0
  
  production_ready:
    current: false
    target: true
    criteria:
      - All tests collect successfully
      - Test pass rate ≥98%
      - Integration tests pass
      - MCP server starts
      - Master orchestrator functional

deliverables:
  documentation:
    - "docs/tdd-remediation-plan.md"
    - "docs/module-implementation-guide.md"
    - "docs/test-to-impl-mapping.md"
  
  code:
    - "cortex/**/*.py" (125 new modules)
    - "scripts/generate_stubs_from_tests.py"
    - "scripts/validate_imports.py"
  
  reports:
    - "_workspaces/roadmap/reports/tdd-gap-analysis.yaml"
    - "_workspaces/roadmap/reports/implementation-progress.yaml"
    - "_workspaces/roadmap/reports/test-validation-report.yaml"

next_actions:
  immediate:
    - Commit conftest.py fix (pytest deprecation)
    - Create stub generation script
    - Generate P0 module stubs
    - Establish test baseline
  
  week_1:
    - Implement P0 modules (orchestrator + database)
    - Validate 70% test collection
    - Begin P1 implementation
  
  week_2:
    - Complete P1 modules (knowledge + governance)
    - Implement P2/P3 modules (batch by category)
    - Validate 90% test pass rate
  
  week_3:
    - Complete remaining modules
    - Full test suite validation
    - Production hardening
    - Documentation

governance_compliance:
  CORE-008: "TDD - tests already written ✅"
  CORE-011: "Type hints required on all functions"
  CORE-012: "Google docstrings required"
  CORE-017: "Strict enforcement - no shortcuts"
  CORE-028: "Kebab-case file names ≤25 chars"
  
approval_required: true
estimated_completion: "2026-02-10"
