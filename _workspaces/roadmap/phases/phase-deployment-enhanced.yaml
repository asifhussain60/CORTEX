      - extensions/vscode-cortex/src/extension.ts (NEW)
      - extensions/vscode-cortex/src/mcp_client.ts (NEW)
      - extensions/vscode-cortex/src/diagnostics.ts (NEW)
    audit_entry: AC-DEPLOY-ENHANCED-004-01

  AC-DEPLOY-ENHANCED-004-02:
    title: Visual Studio 2019+ LSP Adapter
    description: >
      Create cortex-lsp-adapter as .NET Core app bridging VS ↔ MCP.
      LSP server listens on TCP/IPC for VS requests.
      LSP client calls MCP hub for governance checks.
      Validates local Python environment compatibility.
      Converts MCP results to LSP Diagnostics for VS display.
    acceptance_criteria:
