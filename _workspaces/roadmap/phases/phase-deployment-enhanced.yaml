# PHASE-DEPLOYMENT-ENHANCED: Multi-Repo Production Deployment Architecture
# Reference: Issue #7 - Deployment gaps
# Created: 2026-01-19
# Status: Architecture + Implementation Ready

id: PHASE-DEPLOYMENT-ENHANCED
title: Enhanced Multi-Repo Production Deployment Architecture
description: >
  Comprehensive redesign of CORTEX deployment system to support:
  - Automated multi-repo setup without manual errors
  - Per-repo isolation and governance enforcement
  - Production-grade service discovery and health checks
  - IDE support (VS Code via MCP, Visual Studio 2019+ via LSP adapter)
  - Resilient offline mode with local audit trail syncing
  - Unified knowledge graph across repos

status: NOT_STARTED
locked: false
priority: P0
estimated_hours: 160
estimated_tests: 187

focus:
  - Three-Tier Deployment Architecture
  - Session Context & Repo Isolation
  - Service Discovery & Configuration Management
  - Prompt Version Management
  - IDE Integration (MCP + LSP)
  - Integration Testing (9 edge cases)
  - Production Documentation

requirements:
  - Python 3.9+
  - SQLite WAL mode support
  - VS Code LSP support
  - VS Studio 2019+ LSP support
  - Git 2.20+
  - pytest 7.0+

dependencies:
  - PHASE-22: MCP Protocol Compliance (COMPLETED)
  - PHASE-23: Complexity-Aware Confirmation Gate (COMPLETED)
  - All prior phases must be locked

ac_ids:
  # TIER 1: SESSION & ISOLATION (Days 1-3)
  AC-DEPLOY-ENHANCED-001-01:
    title: Session Context Injection for MCP Server
    description: >
      Extend MCPServer with per-connection session management.
      Each connected repo gets unique session_id with repo_id context.
      All orchestrator calls receive __cortex_session__ with isolation metadata.
      Audit entries automatically tagged with repo_id + session_id.
    acceptance_criteria:
      - Session created with unique session_id on repo connect
      - repo_id extracted and passed to all orchestrators
      - Audit entries include repo_id (non-null)
      - Unit tests: 100% coverage of MCPSession + SessionManager
      - No regression in existing MCP tests
    testing:
      unit_tests_expected: 12
      integration_tests_expected: 3
      edge_cases:
        - Multiple concurrent sessions
        - Session timeout handling
        - Session cleanup on disconnect
    success_criteria:
      - Tests passing: tests/unit/test_mcp_session.py
      - Coverage: ≥95% for session code
      - Audit trail shows repo_id in all entries
    files_to_create:
      - src/mcp/models/session.py (NEW)
      - tests/unit/test_mcp_session.py (NEW)
      - migrations/001_add_session_support.sql (NEW)
    files_to_modify:
      - src/mcp/server.py
      - cortex/api/mcp/server.py
    audit_entry: AC-DEPLOY-ENHANCED-001-01

  AC-DEPLOY-ENHANCED-001-02:
    title: Repository Isolation Rules Enforcement
    description: >
      Implement hard isolation boundaries in orchestrators.
      All file operations scoped to repo_path (matching session.repo_id).
      Cross-repo file access rejected with RepositoryIsolationError.
      Audit log shows isolation violations as AC_EXECUTE_FAILED.
    acceptance_criteria:
      - File operations checked against session.repo_path
      - Cross-repo access blocked immediately
      - Clear error message on violation
      - Audit includes isolation_reason on failure
      - Unit tests: 100% coverage of isolation logic
    testing:
      unit_tests_expected: 15
      integration_tests_expected: 4
      edge_cases:
        - Symlink traversal attempts
        - Relative path attacks
        - Permission elevation attempts
    success_criteria:
      - Tests passing: tests/unit/test_repo_isolation.py
      - Coverage: ≥95% for isolation code
      - Security review approved
    files_to_create:
      - cortex/core/security/isolation.py (NEW)
      - tests/unit/test_repo_isolation.py (NEW)
    files_to_modify:
      - cortex/orchestrators/*.py (all orchestrators respect isolation)
    audit_entry: AC-DEPLOY-ENHANCED-001-02

  AC-DEPLOY-ENHANCED-001-03:
    title: Repository Registry System
    description: >
      Create centralized registry of connected repositories.
      Enables repo lookup by repo_id, type, path validation.
      Registry stored in cortex-brain/tier0/repo-registry.yaml.
      Database table tracks registration, status, metadata.
    acceptance_criteria:
      - Repos registered in cortex-brain/tier0/repo-registry.yaml
      - Registry queried for isolation boundary checks
      - Invalid repo_ids rejected with clear error
      - Unit tests: 100% coverage of registry logic
    testing:
      unit_tests_expected: 10
      integration_tests_expected: 2
      edge_cases:
        - Duplicate repo_ids rejected
        - Invalid repo_type detection
        - Stale registry entries cleanup
    success_criteria:
      - Tests passing: tests/unit/test_repo_registry.py
      - Coverage: ≥95% for registry code
      - Registry schema validates against schema.json
    files_to_create:
      - cortex/core/registry/repo_registry.py (NEW)
      - cortex-brain/tier0/repo-registry.yaml (NEW)
      - tests/unit/test_repo_registry.py (NEW)
    audit_entry: AC-DEPLOY-ENHANCED-001-03

  # TIER 2: DISCOVERY & VERSIONING (Days 4-7)
  AC-DEPLOY-ENHANCED-002-01:
    title: MCP Service Discovery with Health Checks
    description: >
      Implement /health endpoint for MCP hub readiness probes.
      Add /config/prompt-version endpoint for version negotiation.
      Service discovery sequence: CORTEX_MCP_ENDPOINT env var → cortex-config.yaml → 127.0.0.1:8000 default.
      Health check includes: db connection, governance rules loaded, orchestrators registered.
    acceptance_criteria:
      - GET /health returns 200 with valid schema
      - GET /health detects DB connection failure
      - GET /config/prompt-version returns current version
      - Discovery tries env var first, then config, then default
      - Invalid endpoints detected with clear error
      - Health check latency <100ms (cached)
    testing:
      unit_tests_expected: 14
      integration_tests_expected: 4
      edge_cases:
        - DB connection timeout
        - Invalid endpoint format
        - Network unreachable
    success_criteria:
      - Tests passing: tests/unit/test_mcp_health.py
      - Endpoint latency <100ms
      - Coverage: ≥95%
    files_to_create:
      - cortex/core/discovery/mcp_discovery.py (NEW)
      - tests/unit/test_mcp_discovery.py (NEW)
    files_to_modify:
      - src/mcp/server.py
    audit_entry: AC-DEPLOY-ENHANCED-002-01

  AC-DEPLOY-ENHANCED-002-02:
    title: Prompt Version Management System
    description: >
      Create versioned prompt releases in cortex-brain/releases/vX.Y.Z/.
      Implement PromptVersionManager for version negotiation and compatibility checks.
      Maintain prompt-versions.yaml manifest tracking all releases, compatibility matrix.
      Support backward compatibility checks (what versions work with each other).
    acceptance_criteria:
      - cortex-brain/releases/v1.0.0/ contains CORTEX.prompt.md
      - Version negotiation works (repo requests v1.0, hub has v1.0 → compatible)
      - Incompatible version rejected with clear error message
      - Version history auditable in prompt-versions.yaml
      - Unit tests: 100% coverage of version manager
    testing:
      unit_tests_expected: 16
      integration_tests_expected: 3
      edge_cases:
        - Future version requested by old repo
        - Deprecated version requested
        - Major version incompatibility
    success_criteria:
      - Tests passing: tests/unit/test_prompt_version_manager.py
      - Coverage: ≥95%
      - v1.0.0 release created with SHA hash
    files_to_create:
      - src/versioning/prompt_version_manager.py (NEW)
      - cortex-brain/releases/v1.0.0/CORTEX.prompt.md (NEW)
      - cortex-brain/releases/v1.0.0/CORTEX.prompt.schema.yaml (NEW)
      - cortex-brain/tier0/prompt-versions.yaml (NEW)
      - tests/unit/test_prompt_version_manager.py (NEW)
    files_to_modify:
      - src/mcp/server.py (version negotiation on connect)
    audit_entry: AC-DEPLOY-ENHANCED-002-02

  AC-DEPLOY-ENHANCED-002-03:
    title: Hub Setup Automation Script
    description: >
      Create scripts/setup-cortex-hub.py for one-time hub initialization.
      Actions: verify Python, start MCP server, initialize governance.db, create releases,
      generate version manifest, create registry template, output endpoint + status.
      Idempotent (safe to run multiple times).
    acceptance_criteria:
      - Script runs without errors
      - governance.db initialized (all tables present)
      - Prompts in cortex-brain/releases/v1.0.0/
      - Registry template created
      - Health endpoint returns ready
      - Running twice produces same result
      - Clear success output
    testing:
      unit_tests_expected: 10
      integration_tests_expected: 2
    success_criteria:
      - Script runs successfully: bash scripts/setup-cortex-hub.py
      - DB initialized: ls -la cortex_brain/state/governance.db
      - Version released: ls -la cortex-brain/releases/v1.0.0/
      - Health check passes: curl http://127.0.0.1:8000/health
    files_to_create:
      - scripts/setup-cortex-hub.py (NEW)
      - scripts/templates/repo-registry.yaml.jinja2 (NEW)
    audit_entry: AC-DEPLOY-ENHANCED-002-03

  # TIER 3: REPO SETUP & ISOLATION (Days 8-12)
  AC-DEPLOY-ENHANCED-003-01:
    title: Repo Registration Script & Template
    description: >
      Create scripts/register-repo.sh for per-repo registration (run once in each repo).
      Actions: create .github/prompts/, generate cortex-config.yaml, copy/symlink prompts,
      validate MCP connectivity, create .github/tier0/ stub, git commit initial setup.
      Idempotent and cross-platform (Linux/Mac symlinks, Windows copy).
    acceptance_criteria:
      - Script runs without errors in new repo
      - cortex-config.yaml created with correct repo_id, repo_name, repo_type
      - Prompts copied/symlinked correctly
      - MCP connectivity validated
      - Git commit created with AC-REPO-REG-001 audit entry
      - Idempotent (running twice is safe)
      - Works on macOS, Linux, Windows
    testing:
      unit_tests_expected: 12
      integration_tests_expected: 4
      edge_cases:
        - Invalid repo_id format rejected
        - Already registered repo handled
        - MCP hub unavailable handled gracefully
    success_criteria:
      - Script runs: bash scripts/register-repo.sh --repo-id api-service --repo-name "API" --repo-type backend
      - cortex-config.yaml present: ls -la .github/cortex-config.yaml
      - Connectivity check passes
      - Git commit present
    files_to_create:
      - scripts/register-repo.sh (NEW)
      - _workspaces/roadmap/templates/cortex-config.yaml.jinja2 (NEW)
      - docs/DEPLOYMENT-REPO-REGISTRATION.md (NEW)
    audit_entry: AC-DEPLOY-ENHANCED-003-01

  AC-DEPLOY-ENHANCED-003-02:
    title: Multi-Repo Integration Testing Suite
    description: >
      Comprehensive integration tests for all 9 edge cases in multi-repo deployment.
      Tests cover: 5-repo connection, isolation enforcement, offline mode, version mismatch,
      governance conflicts, concurrent operations, health checks, sync on reconnect.
      All tests must pass before deployment phase can be locked.
    acceptance_criteria:
      - All 9 test cases passing
      - No regressions in existing test suite
      - Coverage ≥95% for new code
      - Tests complete in <30 seconds
      - Clear test output (no warnings)
    testing:
      unit_tests_expected: 8
      integration_tests_expected: 9
      edge_cases:
        - SingleRepoConnects
        - FiveReposConnectIsolated
        - IsolationViolationBlocked
        - PromptVersionMismatch
        - OfflineFallback
        - OfflineSyncOnReconnect
        - RepoOverrideConflict
        - ConcurrentReposAtomicity
        - HealthCheckWorks
    success_criteria:
      - All tests passing: pytest tests/integration/test_multi_repo_deployment.py -v
