    files_to_create:
      - tests/integration/test_multi_repo_deployment.py (NEW)
      - tests/fixtures/mock_repos.py (NEW)
      - tests/fixtures/mock_mcp_server.py (NEW)
    audit_entry: AC-DEPLOY-ENHANCED-003-02

  # TIER 4: IDE INTEGRATION (Days 13-18)
  AC-DEPLOY-ENHANCED-004-01:
    title: VS Code MCP Extension - vscode-cortex
    description: >
      Create VS Code extension that consumes MCP server.
      Features: load CORTEX.prompt.md from .github/prompts/, connect to MCP via cortex-config.yaml,
      display governance violations inline, show quick-fixes, audit trail viewer, health indicator.
      Extension discovers MCP endpoint from cortex-config.yaml + validates connectivity on load.
    acceptance_criteria:
      - Extension loads in VS Code without errors
      - Connects to MCP hub via cortex-config.yaml discovery
      - Displays violations inline as squiggly lines
      - Hover shows violation details + remediation
      - Quick-fix suggestions work (test 1 case)
      - Audit panel shows recent changes
      - Health indicator shows connection status
      - Works with all 5 test repos
    testing:
      unit_tests_expected: 14
      integration_tests_expected: 3
      manual_tests:
        - Extension loads in VS Code
        - Violations displayed
        - Quick-fix applied
        - Audit trail shown
    success_criteria:
      - Extension installs: code --install-extension vscode-cortex-*.vsix
      - Test violation appears: create governance violation, see red squiggly
      - Quick-fix works: apply suggestion via Ctrl+.
      - Audit panel shows changes
    files_to_create:
