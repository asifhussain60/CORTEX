## EXECUTION GUIDELINES

execution_guidelines:

  test_driven_discipline:
    rule_1_read_test_first: |
      ALWAYS read the complete test file before writing implementation.
      Understand what the test expects, not what you think it should do.
      
    rule_2_run_red: |
      Run the test and watch it FAIL with clear error message.
      This is the "RED" phase - proves test actually tests something.
      Never implement without seeing test fail first.
      
    rule_3_minimal_green: |
      Write MINIMUM code to make test pass.
      Don't add features, error handling, or optimizations.
      Just enough to make assertions pass.
      
    rule_4_refactor_safely: |
      With test passing, refactor for:
      - Type hints (100% coverage)
      - Docstrings (Google style)
      - Better names
      - Error handling (now that test passes)
      - Performance (if needed)
      
    rule_5_test_isolation: |
      Each test must pass independently.
      Don't rely on test execution order.
      Clean up state between tests.

  anti_patterns_forbidden:
    forbidden_1_empty_stubs: |
      ❌ NO empty stub classes or functions
      ❌ NO "pass" implementations
      ❌ NO "return None" without test validation
      This creates false confidence - looks good but does nothing.
      
    forbidden_2_comment_driven: |
      ❌ NO implementation based on comments alone
      ❌ Comments can lie, tests cannot
      Always derive implementation from test assertions.
      
    forbidden_3_batch_stubbing: |
      ❌ NO creating 20 stub files then implementing
      DO create stub, implement immediately, test passes, move to next.
      
    forbidden_4_guessing_dependencies: |
      ❌ NO "I think this module needs X"
      Always check test imports to know what's actually needed.
      
    forbidden_5_over_engineering: |
      ❌ NO building more than test requires
      ❌ NO adding features "for future use"
      Test defines exact scope. Stay within it.

  implementation_velocity:
    target_modules_per_day: 7-10
    target_lines_per_day: 1500-2000
    checkpoint_frequency: "After each major module or 4-hour work session"
    commit_message_format: "Module: {module_name} - Implement {classes/functions}, {tests_passing} tests passing"

  quality_gates:
    gate_1_all_imports_resolve: "pytest --collect-only succeeds"
    gate_2_all_tests_run: "pytest -v runs all collected tests"
    gate_3_pass_rate_threshold: "≥98% of tests pass"
    gate_4_type_check: "mypy cortex/ --strict (0 errors)"
    gate_5_docs_complete: "All modules have full Google docstrings"
    gate_6_governance_compliant: "All CORE rules verified"

## MODULE DEPENDENCY TRACKING

module_dependency_map:
  critical_path: |
    1. orchestrator_decorator → used by all orchestrators
    2. i_orchestrator → protocol for all orchestrator implementations
    3. database_manager → used by state management
    4. conversation_protocol → used by master_orchestrator
    5. master_orchestrator → depends on all above
    6. knowledge_graph → used by domain_brain and analysis
    7. governance_registry → used by all governance checks
  
  implementation_order_rationale: |
    Implement in order of dependency depth (deepest first):
    - Bottom layer (no dependencies): decorators, interfaces, protocols
    - Middle layer (depends on bottom): managers, registries, engines
    - Top layer (depends on middle): orchestrators, services, APIs

  circular_dependency_prevention: |
    ❌ Never import from module that imports from you
    ✅ Always check for circular dependencies before implementing
    Use: "pytest --co 2>&1 | grep -i 'circular\|recursion'"

