## RISK MITIGATION

risk_mitigation:

  risk_1_stub_creation:
    risk: "AI creates stubs instead of implementing to save time"
    mitigation: |
      - Explicit no-stub rule documented here
      - Each AC requires 'X tests passing' verification
      - Final commit reports must show test pass count
      - Code review gates prevent stub merging
    prevention: "Require test execution proof before commit"
    
  risk_2_incomplete_implementations:
    risk: "Implementations pass tests but miss edge cases"
    mitigation: |
      - Read full test file first (all test methods, not just happy path)
      - Phase E6 validation runs full integration suite
      - Governance compliance check catches incomplete error handling
    prevention: "Phase E6 integration testing phase"
    
  risk_3_circular_dependencies:
    risk: "Implementing modules creates circular imports"
    mitigation: |
      - Dependency map created in Phase E1
      - Implementation order respects dependencies
      - pytest --collect-only catches circular imports immediately
    prevention: "Always check for import cycles"
    
  risk_4_test_modification:
    risk: "Modifying tests to make implementations pass (wrong!)"
    mitigation: |
      - Lock test files during Phase E
      - Any test change requires justification
      - Code review must approve test changes
    prevention: "Test-first: never modify test to fit code"

