phase:
  id: transform-004
  name: Configurable Governance Modes
  priority: 4
  blocking_deployment: false
  created_at: '2026-01-23T18:00:00Z'
  start_date: '2026-03-15'
  target_completion: '2026-03-21'
  total_effort_hours: 16
  
  objective: |
    Make governance configurable across 4 strictness levels (learning, standard, strict,
    compliance) so users can choose appropriate governance for their context. Eliminates
    "all-or-nothing" governance that blocks learning while maintaining compliance options.
  
  current_state:
    governance_model: "All-or-nothing (127 rules always enforced)"
    user_control: "None (no way to adjust strictness)"
    learning_barrier: "High (new users hit governance violations immediately)"
    compliance_support: "Strong (but cannot be opted into)"
    issues:
      - New users frustrated by governance violations while learning
      - No way to gradually adopt governance
      - Compliance mode same as learning mode (no differentiation)
      - Cannot adjust governance per-operation or per-context
  
  target_state:
    governance_model: "4-tier progressive governance"
    user_control: "Full (choose mode per operation or globally)"
    learning_barrier: "Low (learning mode enforces 10 critical rules only)"
    compliance_support: "Explicit (compliance mode adds audit + approval)"
    modes:
      learning: "10 critical rules only"
      standard: "50 essential rules"
      strict: "All 127 rules"
      compliance: "All 127 rules + audit trail + approval workflow"
  
  items:
    - id: GOV-001
      title: "Design Governance Mode System"
      description: |
        Design architecture for configurable governance modes with progressive rule enforcement.
      file: cortex/brain/core/governance_modes.py
      implementation:
        - Define GovernanceMode enum (LEARNING, STANDARD, STRICT, COMPLIANCE)
        - Define rule categorization (CRITICAL, ESSENTIAL, RECOMMENDED, COMPLIANCE)
        - Map modes to rule sets:
          - LEARNING: CRITICAL only (10 rules)
          - STANDARD: CRITICAL + ESSENTIAL (50 rules)
          - STRICT: All rules (127 rules)
          - COMPLIANCE: All rules + audit + approval
        - Support mode configuration via cortex-config.yaml
        - Support per-operation mode override
      acceptance_criteria:
        - 4 modes defined clearly
        - Rule categorization complete
        - Mode mapping to rule sets validated
        - Configuration schema defined
        - Per-operation override supported
      estimated_hours: 3
      priority: CRITICAL
      dependencies: []
    
    - id: GOV-002
      title: "Categorize All 127 Governance Rules"
      description: |
        Categorize all existing rules as CRITICAL, ESSENTIAL, RECOMMENDED, or COMPLIANCE
        to enable progressive enforcement.
      files:
        - cortex_brain/tier0/ (29 SKULL rules)
        - cortex_brain/tier1/ (47 SPINE rules)
        - cortex_brain/tier2/ (38 ORGANS rules)
        - cortex_brain/tier3/ (13 FUNCTIONS rules)
      categorization_criteria:
        CRITICAL:
          - Prevents data corruption (e.g., AC state synchronization)
          - Prevents security vulnerabilities (e.g., input sanitization)
          - Prevents production outages (e.g., timeout enforcement)
          - ~10 rules total
        ESSENTIAL:
          - Enforces code quality (e.g., type hints, docstrings)
          - Prevents common bugs (e.g., bare except)
          - Maintains consistency (e.g., naming conventions)
          - ~40 rules total (in addition to CRITICAL)
        RECOMMENDED:
          - Improves maintainability (e.g., complexity limits)
          - Enhances readability (e.g., line length)
          - Best practices (e.g., DRY principle)
          - ~65 rules total (in addition to ESSENTIAL)
        COMPLIANCE:
          - Audit trail requirements
          - Approval workflows
          - Regulatory compliance (e.g., PII handling)
          - ~12 rules total (additions to STRICT)
      implementation:
        - Review all 127 rules against categorization criteria
        - Add category tag to each rule metadata
        - Validate no rule in multiple categories
        - Document rationale for each categorization
        - Get governance team approval
      acceptance_criteria:
        - All 127 rules categorized
        - ~10 CRITICAL rules identified
        - ~50 ESSENTIAL rules identified (CRITICAL + 40)
        - ~127 rules total for STRICT mode
        - Categorization documented and approved
      estimated_hours: 4
      priority: HIGH
      dependencies: [GOV-001]
    
    - id: GOV-003
      title: "Implement Mode-Based Rule Filtering"
      description: |
        Update GovernanceRegistry to filter rules based on selected governance mode.
      file: cortex/brain/core/governance_registry.py
      implementation:
        - Add get_active_rules(mode: GovernanceMode) method
        - Filter rules based on mode and category
        - Cache filtered rule sets for performance
        - Add rule activation logging
        - Support mode switching at runtime
      acceptance_criteria:
        - LEARNING mode returns 10 CRITICAL rules
        - STANDARD mode returns 50 rules (CRITICAL + ESSENTIAL)
        - STRICT mode returns all 127 rules
        - COMPLIANCE mode returns 127 + compliance metadata
        - Mode switching works without restart
      estimated_hours: 3
      priority: CRITICAL
      dependencies: [GOV-002]
    
    - id: GOV-004
      title: "Add Mode Configuration"
      description: |
        Enable governance mode configuration via cortex-config.yaml and environment variables.
      file: cortex/config/governance_config.py
      implementation:
        - Add governance.mode field to cortex-config.yaml
        - Support CORTEX_GOVERNANCE_MODE environment variable
        - Add mode validation on startup
        - Log selected mode and active rule count
        - Provide CLI command to show current mode
      acceptance_criteria:
        - Mode configurable in cortex-config.yaml
        - Environment variable overrides config file
        - Invalid modes rejected with clear error
        - Current mode logged on startup
        - 'cortex config show-governance' displays active mode
      estimated_hours: 2
      priority: HIGH
      dependencies: [GOV-003]
    
    - id: GOV-005
      title: "Implement Per-Operation Mode Override"
      description: |
        Allow operations to override global governance mode for specific use cases.
      file: cortex/orchestrators/core/master_orchestrator.py
      implementation:
        - Add governance_mode parameter to execute() method
        - Add governance_mode parameter to execute_simple() method
        - Support CLI flag: --governance-mode LEARNING
        - Scope mode override to single operation (don't persist)
        - Log mode overrides to audit trail
      acceptance_criteria:
        - execute(..., governance_mode=GovernanceMode.LEARNING) works
        - CLI: 'cortex generate test --governance-mode learning' works
        - Mode override applies only to single operation
        - Global mode restored after operation
        - Overrides logged to audit trail
      estimated_hours: 2
      priority: MEDIUM
      dependencies: [GOV-004]
    
    - id: GOV-006
      title: "Add Compliance Mode Features"
      description: |
        Implement additional features for COMPLIANCE mode: enhanced audit trail and
        approval workflow.
      file: cortex/brain/core/compliance_mode.py
      implementation:
        - Enable detailed audit logging (all operations, not just AC-IDs)
        - Log user identity, timestamp, inputs, outputs, decisions
        - Add approval workflow: require approval before execution
        - Implement approval storage and retrieval
        - Add approval CLI: 'cortex approve <operation_id>'
        - Generate compliance reports
      acceptance_criteria:
        - COMPLIANCE mode logs all operation details
        - Approval required before execution
        - Unapproved operations blocked with clear message
        - 'cortex approve' grants approval
        - Compliance reports generated on demand
      estimated_hours: 4
      priority: MEDIUM
      dependencies: [GOV-003]
    
    - id: GOV-007
      title: "Update Documentation for Governance Modes"
      description: |
        Document all governance modes, when to use each, and how to configure.
      file: docs/governance-modes.md
      implementation:
        - Document each mode with description and use cases
        - Provide rule count for each mode
        - Show configuration examples (config file, env var, CLI)
        - Add decision guide: "Which mode should I use?"
        - Document per-operation override
        - Add troubleshooting section
      acceptance_criteria:
        - All 4 modes documented clearly
        - Use cases help users choose mode
        - Configuration examples validated
        - Decision guide addresses common scenarios
        - Troubleshooting covers mode issues
      estimated_hours: 2
      priority: HIGH
      dependencies: [GOV-005, GOV-006]
    
    - id: GOV-008
      title: "Add Governance Mode Metrics"
      description: |
        Track governance mode usage and violations to understand user behavior and
        improve mode design.
      file: cortex/observability/governance_metrics.py
      implementation:
        - Track mode usage (which modes used how often)
        - Track violations per mode
        - Track mode switches
        - Track approval requests/grants in COMPLIANCE mode
        - Export metrics to Prometheus
        - Add dashboard visualization
      acceptance_criteria:
        - All mode metrics tracked
        - Metrics exported to Prometheus
        - Dashboard shows mode usage distribution
        - Violation rates by mode visible
        - Approval workflow metrics tracked
      estimated_hours: 3
      priority: LOW
      dependencies: [GOV-006]
    
    - id: GOV-009
      title: "Testing - Governance Mode Validation"
      description: |
        Comprehensive testing of all governance modes and rule filtering logic.
      file: tests/unit/governance/test_governance_modes.py
      implementation:
        - Test each mode returns correct rule count
        - Test rule filtering logic
        - Test mode configuration (file, env var, CLI)
        - Test per-operation override
        - Test mode switching
        - Test compliance mode features (audit, approval)
        - Test invalid mode handling
      acceptance_criteria:
        - LEARNING mode returns 10 rules (validated)
        - STANDARD mode returns 50 rules (validated)
        - STRICT mode returns 127 rules (validated)
        - COMPLIANCE mode features functional
        - All mode configurations tested
        - All edge cases covered
      estimated_hours: 4
      priority: CRITICAL
      dependencies: [GOV-006]
    
    - id: GOV-010
      title: "Migration Guide for Existing Users"
      description: |
        Help existing users transition to new governance mode system.
      file: docs/governance-migration-guide.md
      implementation:
        - Explain changes from old all-or-nothing model
        - Recommend STANDARD mode as new default
        - Show how to maintain old behavior (STRICT mode)
        - Document any breaking changes
        - Provide migration timeline
        - Add FAQ for common questions
      acceptance_criteria:
        - Changes clearly explained
        - Migration path documented
        - Breaking changes identified
        - Timeline for transition provided
        - FAQ addresses common concerns
      estimated_hours: 2
      priority: MEDIUM
      dependencies: [GOV-007]
  
  completion_checklist:
    - '[ ] GOV-001: Governance mode system designed'
    - '[ ] GOV-002: All 127 rules categorized'
    - '[ ] GOV-003: Mode-based rule filtering implemented'
    - '[ ] GOV-004: Mode configuration added'
    - '[ ] GOV-005: Per-operation override working'
    - '[ ] GOV-006: Compliance mode features complete'
    - '[ ] GOV-007: Documentation updated'
    - '[ ] GOV-008: Metrics tracking mode usage'
    - '[ ] GOV-009: All tests passing'
    - '[ ] GOV-010: Migration guide published'
    - '[ ] All existing tests still passing'
    - '[ ] Code review approved'
  
  success_metrics:
    modes_available: "4 (learning, standard, strict, compliance)"
    learning_mode_rules: "10 CRITICAL only"
    standard_mode_rules: "50 (CRITICAL + ESSENTIAL)"
    strict_mode_rules: "127 (all rules)"
    configuration_options: "3 (config file, env var, CLI override)"
    user_control: "Full (per-operation override supported)"
  
  rule_categorization_summary:
    CRITICAL_examples:
      - CORE-001: AC state synchronization (prevents corruption)
      - CORE-002: Input sanitization (prevents injection)
      - CORE-003: Timeout enforcement (prevents hanging)
      - CORE-004: Error logging (enables debugging)
      - CORE-005: Database transactions (prevents data loss)
      - CORE-006: Authentication required (prevents unauthorized access)
      - CORE-007: Resource cleanup (prevents leaks)
      - CORE-008: Output validation (prevents bad data)
      - CORE-009: Rate limiting (prevents abuse)
      - CORE-010: Encryption for sensitive data (prevents exposure)
    
    ESSENTIAL_examples:
      - CORE-011: Type hints required
      - CORE-012: Docstrings required
      - CORE-013: No bare except clauses
      - CORE-014: Consistent naming conventions
      - CORE-015: Single responsibility principle
      - CORE-016: DRY principle
      - Plus 34 more quality and consistency rules
    
    RECOMMENDED_examples:
      - Complexity limits (cyclomatic complexity < 15)
      - Line length limits (< 120 characters)
      - Comment density requirements
      - Test coverage thresholds
      - Plus 61 more maintainability and style rules
    
    COMPLIANCE_additions:
      - PII handling protocols
      - Audit trail completeness
      - Approval workflow enforcement
      - Retention policies
      - Plus 8 more regulatory requirements
  
  risk_mitigation:
    - risk: "Users choose too-permissive mode and hit production issues"
      mitigation: "Default to STANDARD mode, provide clear guidance on mode selection"
    - risk: "Rule categorization disagreements"
      mitigation: "Get governance team approval, document rationale"
    - risk: "Performance impact from mode checking"
      mitigation: "Cache filtered rule sets, optimize hot paths"
