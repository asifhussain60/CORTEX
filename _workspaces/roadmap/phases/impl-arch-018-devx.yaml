# CORTEX Implementation Phase: Developer Experience Tools
# Phase ID: impl-arch-018-devx
# Priority: P2
# Date: 2026-01-20

metadata:
  phase_id: "impl-arch-018-devx"
  title: "Developer Experience - IDE Integration & CLI Tools"
  description: "Comprehensive developer tools including IDE extensions, CLI, and debugging"
  priority: "P2"
  estimated_effort: "6-8 days"
  status: "NOT_STARTED"
  locked: false

objective:
  summary: "Provide seamless developer experience with IDE integration, CLI tooling, and debugging"
  business_value: "Reduces developer friction, accelerates development cycles, improves code quality"

acceptance_criteria:
  - id: "DEVX-TOOLS-001-01"
    description: "CLI tool provides command-line access to CORTEX"
    verification:
      - "cortex command with subcommands (plan, analyze, execute, explain)"
      - "Interactive shell with autocomplete"
      - "Configuration management (cortex.yaml)"
      - "Output formatting (JSON, table, human)"
      - "Progress indication for long operations"
    tests:
      - "test_cli_plan_command()"
      - "test_cli_analyze_command()"
      - "test_cli_interactive_shell()"

  - id: "DEVX-TOOLS-001-02"
    description: "IDE extension integrates with VS Code"
    verification:
      - "cortex-vscode extension installation"
      - "Inline code analysis with real-time feedback"
      - "Quick fixes for common issues"
      - "Integration with VS Code diagnostics"
      - "Hover documentation with examples"
    tests:
      - "test_vscode_extension_analysis()"
      - "test_vscode_extension_quick_fixes()"
      - "test_vscode_extension_hover()"

  - id: "DEVX-TOOLS-001-03"
    description: "Debugging tools enable introspection"
    verification:
      - "DebugSession provides execution breakpoints"
      - "Variable inspection and modification"
      - "Step-through execution"
      - "Call stack visualization"
      - "Execution trace recording"
    tests:
      - "test_debug_breakpoints()"
      - "test_debug_variable_inspection()"
      - "test_debug_step_through()"

  - id: "DEVX-TOOLS-001-04"
    description: "Performance profiler identifies bottlenecks"
    verification:
      - "Profiler.profile() generates performance report"
      - "CPU time per function"
      - "Memory allocation tracking"
      - "I/O operation profiling"
      - "Flamegraph generation"
    tests:
      - "test_profiler_cpu_analysis()"
      - "test_profiler_memory_tracking()"
      - "test_profiler_flamegraph()"

  - id: "DEVX-TOOLS-001-05"
    description: "Test generation creates initial test files"
    verification:
      - "TestGenerator.generate_tests(source_file)"
      - "Test case template generation"
      - "Edge case suggestions"
      - "Mock object creation"
      - "Integration test scaffolding"
    tests:
      - "test_test_generator_template()"
      - "test_test_generator_edge_cases()"

  - id: "DEVX-TOOLS-001-06"
    description: "Documentation generation from code"
    verification:
      - "DocWriter.generate_docs(module)"
      - "Docstring suggestions"
      - "README generation"
      - "API reference creation"
      - "Example extraction"
    tests:
      - "test_doc_writer_docstring_suggestions()"
      - "test_doc_writer_readme_generation()"

implementation:
  files_to_create:
    - path: "cortex/devx/cli.py"
      loc: 300
      classes:
        - name: "CorTexCLI"
          methods:
            - "plan(arguments)"
            - "analyze(arguments)"
            - "execute(arguments)"

    - path: "cortex/devx/ide_extension.py"
      loc: 250
      classes:
        - name: "IDEExtension"
          methods:
            - "analyze(document)"
            - "provide_quick_fixes()"
            - "provide_hover_docs()"

    - path: "cortex/devx/debugger.py"
      loc: 200
      classes:
        - name: "DebugSession"
          methods:
            - "set_breakpoint(location)"
            - "inspect_variable(name)"
            - "step_over()"

    - path: "cortex/devx/profiler.py"
      loc: 200
      classes:
        - name: "Profiler"
          methods:
            - "profile(code)"
            - "generate_report()"
            - "generate_flamegraph()"

    - path: "cortex/devx/test_generator.py"
      loc: 150
      classes:
        - name: "TestGenerator"
          methods:
            - "generate_tests(source_file)"
            - "suggest_edge_cases()"

    - path: "cortex/devx/doc_writer.py"
      loc: 150
      classes:
        - name: "DocWriter"
          methods:
            - "generate_docs(module)"
            - "suggest_docstrings()"

    - path: "tests/unit/devx/test_devx_tools.py"
      loc: 250
      test_count: 20

    - path: "tests/integration/devx/test_devx_integration.py"
      loc: 150
      test_count: 10

governance:
  compliance:
    - "CORE-008: TDD"
    - "CORE-011: Type hints"

testing_strategy:
  unit_tests: 20
  integration_tests: 10

dependencies:
  requires:
    - "impl-arch-008-orchestrators"

success_metrics:
  - "CLI launch time <500ms"
  - "IDE extension analysis latency <1s"
  - "Test generation coverage >80%"
