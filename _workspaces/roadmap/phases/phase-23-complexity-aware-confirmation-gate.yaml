# =============================================================================
# PHASE-23: COMPLEXITY-AWARE CONFIRMATION GATE WITH MASTER ORCHESTRATOR INTELLIGENCE
# =============================================================================
# Stage 2.5 Intelligence Layer for Per-Turn Operation Validation
# Status: NOT_STARTED
# AC-IDs: 4 (AC-CONF-001-01 through AC-CONF-004-01)
# Estimated Hours: 23
# Priority: P1 (HIGH - Enables Intelligent Confirmation Workflow)
# =============================================================================

metadata:
  phase_id: "PHASE-23-COMPLEXITY-AWARE-CONFIRMATION-GATE"
  title: "Complexity-Aware Confirmation Gate: Stage 2.5 Intelligence Layer"
  version: "1.0.0"
  created: "2026-01-18"
  author: "cortex-reviewer"
  status: "NOT_STARTED"
  priority: "P1"
  blocking: false

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    CORTEX Master Orchestrator routes intents with confidence scoring but does 
    NOT gate execution based on operation complexity. This means:
    1. Trivial operations (e.g., add single line to file) require confirmation
    2. Complex operations (e.g., database schema changes) auto-execute 
    3. No alternative recommendations provided to user
    4. No intelligent difficulty assessment to optimize approval flow
    
    SOLUTION: Insert Stage 2.5 complexity assessment layer into ConversationProtocol
    that evaluates operation complexity and provides context-aware confirmation 
    decisions. Auto-approve trivial ops, require confirmation for moderate, 
    escalate complex ops with alternatives.
  
  gaps_identified:
    - id: "GAP-CONF-001"
      title: "No Complexity Assessment"
      impact: "Cannot distinguish trivial vs complex operations"
      current_state: "All ops treated uniformly by governance gate"
      severity: "HIGH"
    
    - id: "GAP-CONF-002"
      title: "No Auto-Approval for Trivial Ops"
      impact: "User experiences friction for simple changes"
      current_state: "All ops require explicit approval"
      severity: "MEDIUM"
    
    - id: "GAP-CONF-003"
      title: "No Alternative Recommendations"
      impact: "User doesn't see better approaches"
      current_state: "Master orchestrator provides single routing"
      severity: "MEDIUM"
    
    - id: "GAP-CONF-004"
      title: "No Approval Audit Trail Enrichment"
      impact: "Cannot trace why confirmation was given/denied"
      current_state: "Approval logged but complexity factors not captured"
      severity: "LOW"

# =============================================================================
# SOLUTION ARCHITECTURE
# =============================================================================

solution_architecture:
  stage_2_5_insertion: |
    ConversationProtocol.execute_turn() Flow:
    Stage 1 (Comprehension) → LENS Phase 1
    Stage 2 (Routing) → Intent Router, produce RoutingDecision + confidence
    **STAGE 2.5 (NEW) → Complexity Assessment Gate** ← INSERT HERE
    Stage 3 (Knowledge) → LENS Phases 2-4, domain knowledge
    Stage 4 (Approval) → Final execution gate
  
  complexity_signals: |
    5-Signal Aggregation (Normalized to 0.0-1.0 scale):
    1. LENS Confidence Score (25% weight)
       - Source: RoutingDecision.confidence from Stage 2
       - Range: [0.0, 1.0]
       - Interpretation: Higher = more confident routing
    
    2. Files Affected (35% weight)
       - Source: CallGraphBuilder.calculate_affected_files()
       - Metrics: Count, max_criticality, dependency_depth
       - Normalization: log(count) / 10, max_criticality as scalar
    
    3. Dependency Depth (25% weight)
       - Source: RelationshipEngine.calculate_impact()
       - Metrics: Circular dependencies, tight coupling, layer crossing
       - Normalization: Sum violations, scaled 0-1
    
    4. Operation Scope (15% weight)
       - Source: AST analysis of target code
       - Metrics: Local modification, cross-function, cross-layer, global
       - Normalization: 0 (local) to 1 (global)
  
  complexity_matrix: |
    Complexity Score → Approval Decision:
    - TRIVIAL (≤0.15): Auto-approve, no user interaction
      * Examples: Add comment, single line change, rename variable
      * Approval: Automatic, logged as "AUTO_TRIVIAL"
      * User Impact: None (seamless execution)
    
    - SIMPLE (0.15-0.35): Auto-approve with summary confirmation
      * Examples: Add new file, single function, basic refactoring
      * Approval: Automatic with brief summary shown
      * User Impact: Low (informational only)
    
    - MODERATE (0.35-0.60): Request user confirmation
      * Examples: Multi-file refactoring, schema migration, API change
      * Approval: Require explicit user confirmation
      * Context: Show affected files, dependencies, impact summary
      * User Impact: Medium (requires interaction)
    
    - COMPLEX (0.60-0.85): Request confirmation + show alternatives
      * Examples: Cross-layer architectural change, database redesign
      * Approval: Require explicit confirmation + review alternatives
      * Context: Show top 3 alternative approaches with tradeoffs
      * Recommendation: Highest-confidence approach highlighted
      * User Impact: High (decision required)
    
    - CRITICAL (≥0.85): Escalate with executive summary + single best recommendation
      * Examples: Breaking changes, security-affecting modifications
      * Approval: Require explicit confirmation + executive summary
      * Context: Impact analysis, rollback plan, governance verification
      * Recommendation: Single best approach with justification
      * User Impact: Very High (strategic decision)
  
  governance_rules:
    - rule_id: "CONF-GATE-001"
      title: "Trivial Operations Auto-Approval"
      description: "Operations with complexity score ≤0.15 are auto-approved"
      enforcement: "STRICT"
      exceptions: "None (security-critical ops bypass)"
      audit_logging: "AUTO_TRIVIAL approval recorded"
    
    - rule_id: "CONF-GATE-002"
      title: "Confidence-Based Approval Matrix"
      description: "Approval thresholds based on complexity level"
      enforcement: "STRICT"
      thresholds:
        trivial: "≤0.15"
        simple: "0.15-0.35"
        moderate: "0.35-0.60"
        complex: "0.60-0.85"
        critical: "≥0.85"
    
    - rule_id: "CONF-GATE-003"
      title: "Alternative Recommendations for Complex Operations"
      description: "COMPLEX/CRITICAL ops include top 3 alternatives"
      enforcement: "STRICT"
      requirement: "Generate 3+ alternatives with confidence scores"
      format: "Include brief explanation of tradeoffs"
    
    - rule_id: "CONF-GATE-004"
      title: "User Goal Enhancement"
      description: "Propose better approach if confidence in alternative > current"
      enforcement: "ADVISORY"
      condition: "When better alternative found (confidence delta > 0.05)"
      action: "Recommend single best option with justification"
    
    - rule_id: "CONF-GATE-005"
      title: "Approval Audit Trail Enrichment"
      description: "Log complexity factors + approval decision"
      enforcement: "STRICT"
      fields:
        - "complexity_score (0.0-1.0)"
        - "complexity_level (TRIVIAL/SIMPLE/MODERATE/COMPLEX/CRITICAL)"
        - "contributing_signals: {confidence: 0.7, files_affected: 0.4, depth: 0.2, scope: 0.3}"
        - "approval_decision: AUTO_TRIVIAL|AUTO_SIMPLE|AWAITING_CONFIRMATION|ESCALATED"
        - "recommendation_rationale: string"

  intelligence_engine_components: |
    Complexity Assessment Engine will leverage existing components:
    
    1. RelationshipEngine (src/core/intelligence/relationship_traversal.py)
       - Method: calculate_impact(file_path) → ImpactAnalysis
       - Returns: affected_files, endpoints, models, impact_level
       - New Requirement: Extend to provide detailed metrics for normalization
    
    2. AST Intelligence Engine (src/core/intelligence/ast_*.py)
       - Current: AST parsing with caching
       - New Requirement: Add scope_level() → LOCAL|FUNCTION|LAYER|GLOBAL
    
    3. CallGraphBuilder (src/core/intelligence/call_graph.py)
       - Current: Layer tracing, dependency analysis
       - New Requirement: Return affected_file_count, max_criticality
    
    4. ExecutionContextAnalyzer (src/orchestrators/adaptive/execution_context_analyzer.py)
       - Current: Complexity scoring patterns
       - New Requirement: Provide scoring formula, normalization approach
    
    5. LENS Synthesis (src/orchestrators/core/lens_synthesis.py)
       - Current: Produces combined_confidence (weighted by phase)
       - Usage: Complexity signal #1 (25% weight)

# =============================================================================
# ACCEPTANCE CRITERIA DETAILS
# =============================================================================

acceptance_criteria:
  
  - ac_id: "AC-CONF-001-01"
    title: "Complexity Assessment Engine"
    description: "Aggregate LENS confidence + relationship analysis into 5-level complexity score"
    estimated_hours: 8
    test_count: 12
    
    requirements:
      - req_id: "REQ-001-1"
        title: "Complexity Score Calculation"
        description: "Implement 4-signal aggregation (LENS confidence 25%, files 35%, depth 25%, scope 15%)"
        acceptance_criteria:
          - "Accepts (RoutingDecision, file_path, operation_type)"
          - "Returns ComplexityScore dataclass with overall_score (0.0-1.0)"
          - "Includes breakdown: {lens_signal, files_signal, depth_signal, scope_signal}"
          - "Normalizes all signals to 0-1 scale before aggregation"
      
      - req_id: "REQ-001-2"
        title: "LENS Signal Extraction"
        description: "Extract confidence from RoutingDecision"
        acceptance_criteria:
          - "Reuses RoutingDecision.confidence (already computed)"
          - "No redundant LENS computation"
          - "Weights at 25% in final score"
      
      - req_id: "REQ-001-3"
        title: "RelationshipEngine Integration"
        description: "Use existing RelationshipEngine for impact analysis"
        acceptance_criteria:
          - "Calls calculate_impact(file_path)"
          - "Extracts: affected_files.count, max_criticality"
          - "Normalizes: log(count) / 10, criticality as 0-1"
          - "Weights at 35% in final score"
      
      - req_id: "REQ-001-4"
        title: "CallGraph Dependency Analysis"
        description: "Analyze dependency depth from CallGraphBuilder"
        acceptance_criteria:
          - "Calls CallGraphBuilder methods"
          - "Detects circular dependencies (penalize heavily)"
          - "Measures coupling strength"
          - "Weights at 25% in final score"
      
      - req_id: "REQ-001-5"
        title: "AST Scope Analysis"
        description: "Determine operation scope (local, function, layer, global)"
        acceptance_criteria:
          - "LOCAL: ≤0.2, FUNCTION: 0.2-0.4, LAYER: 0.4-0.7, GLOBAL: ≥0.7"
          - "Uses AST parsing to determine scope"
          - "Weights at 15% in final score"
      
      - req_id: "REQ-001-6"
        title: "Caching Strategy"
        description: "Cache complexity calculations to avoid redundant analysis"
        acceptance_criteria:
          - "Key: (intent_type, file_path, context_hash)"
          - "TTL: 5 minutes or context change"
          - "Cache hit rate > 70% in typical workflow"
      
      - req_id: "REQ-001-7"
        title: "Edge Case Handling"
        description: "Handle empty relationships, missing signals, single-file ops"
        acceptance_criteria:
          - "Empty relationship graph → defaults to lower complexity"
          - "Missing signal → use default value (0.5)"
          - "Single-file operation → score ≤0.3"
    
    test_cases:
      - test_id: "TEST-001-1"
        name: "test_lens_confidence_aggregation"
        scenario: "Complexity score with varying confidence levels"
        expected: "Score increases monotonically with confidence"
      
      - test_id: "TEST-001-2"
        name: "test_ast_complexity_scoring"
        scenario: "Scope analysis for local vs global operations"
        expected: "LOCAL ≤0.2, GLOBAL ≥0.7"
      
      - test_id: "TEST-001-3"
        name: "test_callgraph_traversal_depth"
        scenario: "Measure dependency depth from call graph"
        expected: "Circular deps detected and penalized"
      
      - test_id: "TEST-001-4"
        name: "test_circular_dependency_detection"
        scenario: "Circular dependencies in relationship graph"
        expected: "Penalizes score by 0.3-0.5"
      
      - test_id: "TEST-001-5"
        name: "test_scope_analysis_local_vs_global"
        scenario: "File modifications at different scopes"
        expected: "Correct scope classification"
      
      - test_id: "TEST-001-6"
        name: "test_criticality_scoring_cached"
        scenario: "Criticality calculation with caching enabled"
        expected: "Cache hit on subsequent calls"
      
      - test_id: "TEST-001-7"
        name: "test_complexity_cache_invalidation"
        scenario: "Cache invalidation on context changes"
        expected: "TTL expiry and context hash mismatch triggers recalc"
      
      - test_id: "TEST-001-8"
        name: "test_edge_case_empty_relationship_graph"
        scenario: "Operation on file with no dependencies"
        expected: "Score defaults to low complexity"
      
      - test_id: "TEST-001-9"
        name: "test_edge_case_single_file_operation"
        scenario: "Single-file modification"
        expected: "Score ≤0.3 (simple)"
      
      - test_id: "TEST-001-10"
        name: "test_edge_case_cross_layer_integration"
        scenario: "Modification crossing architecture layers"
        expected: "Score penalized appropriately"
      
      - test_id: "TEST-001-11"
        name: "test_performance_caching_efficiency"
        scenario: "Cache hit rate over 100 operations"
        expected: "Hit rate > 70%"
      
      - test_id: "TEST-001-12"
        name: "test_complexity_score_normalization"
        scenario: "All signals normalized to 0-1 scale"
        expected: "Final score always in [0.0, 1.0]"

  - ac_id: "AC-CONF-002-01"
    title: "Approval Gate Logic"
    description: "Implement confidence-based approval matrix with auto-approval for trivial ops"
    estimated_hours: 6
    test_count: 8
    
    requirements:
      - req_id: "REQ-002-1"
        title: "Approval Matrix Implementation"
        description: "Implement 5-level approval decision logic"
        acceptance_criteria:
          - "TRIVIAL (≤0.15): AUTO_APPROVE"
          - "SIMPLE (0.15-0.35): AUTO_APPROVE_WITH_SUMMARY"
          - "MODERATE (0.35-0.60): REQUEST_CONFIRMATION"
          - "COMPLEX (0.60-0.85): REQUEST_CONFIRMATION_WITH_ALTERNATIVES"
          - "CRITICAL (≥0.85): ESCALATE_WITH_EXECUTIVE_SUMMARY"
      
      - req_id: "REQ-002-2"
        title: "Auto-Approval for Trivial Operations"
        description: "Skip confirmation for operations with complexity ≤0.15"
        acceptance_criteria:
          - "Returns ApprovalDecision.AUTO_APPROVE"
          - "No user interaction required"
          - "Logs decision with complexity factors"
      
      - req_id: "REQ-002-3"
        title: "Confirmation Request Generation"
        description: "Generate ConfirmationRequest for MODERATE operations"
        acceptance_criteria:
          - "Includes affected_files list"
          - "Shows dependency impact summary"
          - "Provides clear rationale for confirmation need"
      
      - req_id: "REQ-002-4"
        title: "Alternative Recommendations"
        description: "Generate 3+ alternatives for COMPLEX/CRITICAL ops"
        acceptance_criteria:
          - "Top 3 alternatives by confidence score"
          - "Include tradeoff analysis for each"
          - "Highlight recommended approach"
      
      - req_id: "REQ-002-5"
        title: "Fallback Logic"
        description: "Handle missing signals gracefully"
        acceptance_criteria:
          - "Default to MODERATE if signals unavailable"
          - "Log warning with missing signals"
          - "Allow override via configuration"
      
      - req_id: "REQ-002-6"
        title: "Approval Decision Consistency"
        description: "Ensure deterministic decisions for same inputs"
        acceptance_criteria:
          - "Same complexity score always produces same decision"
          - "No randomization in approval logic"
      
      - req_id: "REQ-002-7"
        title: "ConfirmationContext Dataclass"
        description: "Structure for returning approval decision + context"
        acceptance_criteria:
          - "Fields: complexity_score, level, decision, alternatives, rationale"
          - "Immutable (frozen dataclass)"
          - "Includes audit_trail metadata"
    
    test_cases:
      - test_id: "TEST-002-1"
        name: "test_trivial_threshold_auto_approve"
        scenario: "Operation with complexity score 0.10"
        expected: "ApprovalDecision.AUTO_APPROVE returned"
      
      - test_id: "TEST-002-2"
        name: "test_simple_threshold_auto_approve"
        scenario: "Operation with complexity score 0.25"
        expected: "ApprovalDecision.AUTO_APPROVE_WITH_SUMMARY returned"
      
      - test_id: "TEST-002-3"
        name: "test_moderate_threshold_confirmation_request"
        scenario: "Operation with complexity score 0.45"
        expected: "ConfirmationRequest generated with context"
      
      - test_id: "TEST-002-4"
        name: "test_complex_threshold_escalation"
        scenario: "Operation with complexity score 0.70"
        expected: "Alternatives generated, top 3 returned"
      
      - test_id: "TEST-002-5"
        name: "test_critical_threshold_executive_summary"
        scenario: "Operation with complexity score 0.90"
        expected: "Executive summary with governance verification"
      
      - test_id: "TEST-002-6"
        name: "test_threshold_boundary_crossing"
        scenario: "Edge cases: 0.15, 0.35, 0.60, 0.85"
        expected: "Correct decision at each boundary"
      
      - test_id: "TEST-002-7"
        name: "test_approval_decision_consistency"
        scenario: "Same complexity score called 5 times"
        expected: "Identical decision each time"
      
      - test_id: "TEST-002-8"
        name: "test_fallback_logic_missing_signals"
        scenario: "Complexity calculation missing confidence signal"
        expected: "Defaults to MODERATE level"

  - ac_id: "AC-CONF-003-01"
    title: "Master Orchestrator Integration"
    description: "Insert Stage 2.5 gate into ConversationProtocol.execute_turn() execution flow"
    estimated_hours: 5
    test_count: 6
    
    requirements:
      - req_id: "REQ-003-1"
        title: "Stage 2.5 Insertion Point"
        description: "Insert complexity gate after routing, before knowledge synthesis"
        acceptance_criteria:
          - "Location: ConversationProtocol.execute_turn()"
          - "After: Stage 2 routing decision generated"
          - "Before: Stage 3 knowledge synthesis"
          - "Call: gate.evaluate_confirmation(routing_decision, context)"
      
      - req_id: "REQ-003-2"
        title: "ContinuationDecision Extension"
        description: "Extend ContinuationDecision to support confirmation reason"
        acceptance_criteria:
          - "Add ContinuationReason.CONFIRMATION_REQUESTED"
          - "Add confirmation_context field"
          - "Backward compatible (existing reasons unchanged)"
      
      - req_id: "REQ-003-3"
        title: "ConfirmationContext Dataclass"
        description: "Structure for passing confirmation data through orchestration"
        acceptance_criteria:
          - "Fields: complexity_score, complexity_level, alternatives, rationale"
          - "Immutable frozen dataclass"
          - "Serializable to JSON for persistence"
      
      - req_id: "REQ-003-4"
        title: "Per-Turn Gate Isolation"
        description: "Ensure gate doesn't interfere with continuation logic"
        acceptance_criteria:
          - "Gate decision only affects current turn"
          - "Continuation decision still valid (is_safe_to_resume, etc.)"
          - "No global state mutation"
      
      - req_id: "REQ-003-5"
        title: "Auto-Approval Bypass of Subsequent Stages"
        description: "Trivial ops don't enter confirmation flow"
        acceptance_criteria:
          - "Score ≤0.15 bypasses confirmation, proceeds to Stage 3"
          - "No user interaction for trivial ops"
          - "Logged as AUTO_TRIVIAL"
      
      - req_id: "REQ-003-6"
        title: "Integration Tests"
        description: "Verify gate works within full orchestration flow"
        acceptance_criteria:
          - "E2E test from turn start to confirmation or execution"
          - "Test with various complexity levels"
          - "Verify continuation logic preserved"
    
    test_cases:
      - test_id: "TEST-003-1"
        name: "test_stage_2_5_insertion_after_routing"
        scenario: "Verify gate called at correct orchestration point"
        expected: "Gate receives routing_decision from Stage 2"
      
      - test_id: "TEST-003-2"
        name: "test_continuation_decision_confirmation_reason"
        scenario: "ContinuationDecision with CONFIRMATION_REQUESTED reason"
        expected: "Reason properly set and accessible"
      
      - test_id: "TEST-003-3"
        name: "test_confirmation_context_dataclass_structure"
        scenario: "ConfirmationContext has all required fields"
        expected: "Fields correctly populated and immutable"
      
      - test_id: "TEST-003-4"
        name: "test_turn_execution_with_confirmation_gate"
        scenario: "Execute full turn with gate insertion"
        expected: "Turn completes with confirmation context"
      
      - test_id: "TEST-003-5"
        name: "test_per_turn_gate_isolation"
        scenario: "Multiple turns with different complexity"
        expected: "No state leakage between turns"
      
      - test_id: "TEST-003-6"
        name: "test_gate_does_not_block_low_complexity_ops"
        scenario: "Trivial operation (score 0.10)"
        expected: "Bypasses confirmation, proceeds to Stage 3"

  - ac_id: "AC-CONF-004-01"
    title: "Governance Rules + Audit Logging"
    description: "Implement 5 governance rules (CONF-GATE-001 to 005) with audit trail enrichment"
    estimated_hours: 4
    test_count: 4
    
    requirements:
      - req_id: "REQ-004-1"
        title: "Governance Rules Implementation"
        description: "Implement CONF-GATE-001 through CONF-GATE-005"
        acceptance_criteria:
          - "CONF-GATE-001: Trivial auto-approval enforcement"
          - "CONF-GATE-002: Approval matrix thresholds"
          - "CONF-GATE-003: Alternative recommendations for complex ops"
          - "CONF-GATE-004: Goal enhancement proposal"
          - "CONF-GATE-005: Audit trail enrichment"
      
      - req_id: "REQ-004-2"
        title: "Audit Trail Extension"
        description: "Enrich audit entries with complexity factors"
        acceptance_criteria:
          - "Log: complexity_score (0.0-1.0)"
          - "Log: complexity_level (TRIVIAL/SIMPLE/MODERATE/COMPLEX/CRITICAL)"
          - "Log: contributing_signals breakdown"
          - "Log: approval_decision type"
          - "Log: recommendation_rationale"
      
      - req_id: "REQ-004-3"
        title: "STRICT Governance Enforcement"
        description: "No overrides allowed for approval gate"
        acceptance_criteria:
          - "All rules enforced in STRICT mode"
          - "No bypass mechanisms except security authorization"
          - "Violations logged with error context"
      
      - req_id: "REQ-004-4"
        title: "Integration with Existing Governance"
        description: "Integrate with governance.db and audit logging"
        acceptance_criteria:
          - "Uses existing audit_trail table"
          - "Extends entry_metadata JSON with complexity fields"
          - "Maintains hash chain integrity"
          - "Compatible with audit verification tests"
    
    test_cases:
      - test_id: "TEST-004-1"
        name: "test_conf_gate_001_trivial_auto_approval"
        scenario: "CONF-GATE-001 enforcement for score ≤0.15"
        expected: "Auto-approval without override"
      
      - test_id: "TEST-004-2"
        name: "test_conf_gate_002_approval_matrix_enforcement"
        scenario: "CONF-GATE-002 threshold enforcement"
        expected: "Correct decision at each threshold"
      
      - test_id: "TEST-004-3"
        name: "test_conf_gate_003_alternative_recommendations"
        scenario: "CONF-GATE-003 generates alternatives"
        expected: "Top 3 alternatives for COMPLEX/CRITICAL"
      
      - test_id: "TEST-004-4"
        name: "test_conf_gate_004_005_audit_trail_enrichment"
        scenario: "Audit trail contains complexity factors"
        expected: "All fields populated and logged"

