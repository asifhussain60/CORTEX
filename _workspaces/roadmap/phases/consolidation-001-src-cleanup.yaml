  rationale:
    problem: |
      Repository has dual source structure: cortex/ (canonical, 388 files) and src/ (legacy, 135 files).
      30+ active imports still reference src.* even though cortex/ is established as authoritative.
      Maintaining two parallel packages creates:
      - Developer confusion (where to add new code?)
      - Maintenance burden (duplicate implementations)
      - Test fragility (import errors, module discovery issues)
      - Repository clutter
    
    solution: |
      Consolidate all remaining src.* imports to cortex.* imports.
      Delete empty src/ folder after validation.
      Single authoritative source: cortex/ package.
    
    benefits: |
      - Clarity: One canonical package (cortex/)
      - Consistency: All imports follow cortex.* pattern
      - Maintainability: No duplicate code to maintain
      - Tests: Reliable import discovery, no ambiguity
      - Production: Clean codebase for deployment

