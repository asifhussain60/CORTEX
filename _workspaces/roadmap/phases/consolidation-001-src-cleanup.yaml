  governance:
    tier0_rules_applied:
      - "CORE-001: Changes <500 lines per turn"
      - "CORE-005: No hardcoded paths (use pathlib)"
      - "CORE-008: Tests before code (TDD)"
      - "CORE-011: Type hints on all functions"
      - "CORE-012: Google-style docstrings"
