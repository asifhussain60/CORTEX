# Phase DEPLOYMENT-001: Production Sanitizer
# Creates clean production-ready main branch with day-zero data
# Date: 2026-01-21
# Priority: P1-HIGH
# Authority: chat01.md requirements analysis

metadata:
  phase_id: "PHASE-DEPLOYMENT-001-sanitizer"
  title: "Production Sanitizer and Day-Zero State"
  description: "Sanitize development artifacts, reset to day-zero data, gate main branch"
  priority: "P1-HIGH"
  estimated_effort: "2 days"
  status: "NOT_STARTED"
  blocks_production: true
  machine: "ah"  # Deployment track assigned to ah

executive_summary: |
  Production branch must not contain development audit logs, test data, or 
  temporary configurations. This phase creates automated sanitization that:
  - Removes dev-only entries from governance.db
  - Resets YAML files to template state
  - Creates pre-commit hooks to block non-sanitized commits
  - Implements incremental sanitization (not full rebuild)

current_state:
  main_branch: "Contains development audit logs"
  governance_db: "cortex_brain/state/governance.db has dev entries"
  tier1_rules: "Project-specific customizations present"
  tier2_rules: "Contains test-only rules"
  risk: "Development data leakage to production deployments"

acceptance_criteria:
  - id: "AC-DEP-001-01"
    description: "Audit log scrubbing removes dev-only entries"
    verification: "governance.db contains only tier0 seed rules after sanitize"
    implementation:
      - "Create scripts/deployment/sanitize_governance_db.py"
      - "Identify dev-only entries (AC-ID contains 'TEST', 'DEV', etc.)"
      - "Preserve production audit trail (entries from production deployments)"
      - "Generate sanitization report (what removed, retention policy)"
    tests:
      - "test_sanitize_removes_dev_entries"
      - "test_sanitize_preserves_production_audit"
      - "test_sanitize_generates_report"
  
  - id: "AC-DEP-001-02"
    description: "Day-zero YAML generation resets to template state"
    verification: "tier1/ and tier2/ contain only template rules"
    implementation:
      - "Create cortex_brain/tier1/templates/ with domain templates"
      - "Create cortex_brain/tier2/templates/ with context templates"
      - "Reset tier1/*.yaml → tier1/templates/*.yaml.template"
      - "Add .cortex-version marker file (semver: 1.0.0)"
    tests:
      - "test_tier1_reset_to_templates"
      - "test_tier2_reset_to_templates"
      - "test_version_marker_created"
      - "test_no_project_specific_rules"
  
  - id: "AC-DEP-001-03"
    description: "Main branch gating prevents unsanitized commits"
    verification: "Pre-commit hook validates sanitization state"
    implementation:
      - "Create .pre-commit-config.yaml with sanitization check"
      - "Create scripts/deployment/validate_sanitization.py"
      - "Check governance.db for dev entries (block if found)"
      - "Check tier1/tier2 for non-template files (block if found)"
      - "Release tag automation (git tag v1.0.0 triggers sanitization)"
    tests:
      - "test_precommit_blocks_dev_entries"
      - "test_precommit_blocks_non_template_rules"
      - "test_release_tag_triggers_sanitization"
  
  - id: "AC-DEP-001-04"
    description: "Incremental sanitizer tracks dirty state"
    verification: "Sanitization diff shows only changed entries since last sanitize"
    implementation:
      - "Track .cortex-sanitize-state.json (last sanitize timestamp, entries hash)"
      - "Compute delta (governance.db mutations since last sanitize)"
      - "Sanitize only dirty entries (not full rebuild)"
      - "Pre-commit integration blocks if dirty state detected"
    tests:
      - "test_track_dirty_state"
      - "test_incremental_sanitize_delta"
      - "test_precommit_blocks_dirty_state"
      - "test_differential_audit_log_viewer"

deliverables:
  code:
    - "scripts/deployment/sanitize_governance_db.py"
    - "scripts/deployment/validate_sanitization.py"
    - "scripts/deployment/generate_templates.py"
    - "scripts/deployment/track_sanitize_state.py"
  
  config:
    - ".pre-commit-config.yaml (sanitization hooks)"
    - ".cortex-version (semver marker)"
    - ".cortex-sanitize-state.json (dirty state tracker)"
    - "cortex_brain/tier1/templates/*.yaml.template"
    - "cortex_brain/tier2/templates/*.yaml.template"
  
  tests:
    - "tests/deployment/test_sanitize_governance_db.py (8 tests)"
    - "tests/deployment/test_validate_sanitization.py (6 tests)"
    - "tests/deployment/test_incremental_sanitize.py (5 tests)"
    - "tests/deployment/test_precommit_hooks.py (4 tests)"

dependencies:
  requires: []
  blocks: 
    - "PHASE-DEPLOYMENT-002-onboarding"
    - "Production releases"

completion_verification:
  success_criteria:
    - "All 23 deployment/sanitization tests passing"
    - "Pre-commit hook blocks unsanitized commits"
    - "governance.db contains only tier0 seeds"
    - "tier1/ and tier2/ contain only templates"
    - ".cortex-version file exists with v1.0.0"
  validation_command: "pytest tests/deployment/test_sanitize*.py -v"

governance_compliance:
  - "CORE-008: Tests before implementation"
  - "CORE-011: All functions typed"
  - "CORE-012: Google docstrings"
  - "CORE-026: Git checkpoint before sanitization"
  - "CORE-027: Audit trail for sanitization operations"

notes: |
  This phase consolidates and replaces:
  - Partial deployment logic from impl-e2e-validation (AC-E2E-006 CI integration)
  - Partial deployment logic from impl-cicd-validation (AC-CICD-003 rollback)
  
  Clear separation of concerns:
  - PHASE-DEPLOYMENT-001: Data sanitization (this phase)
  - PHASE-DEPLOYMENT-002: Environment onboarding (next phase)
  - impl-e2e-validation: Testing strategy only (no deployment logic)
  - impl-cicd-validation: CI/CD pipeline only (no data sanitization)
