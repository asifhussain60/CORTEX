# =============================================================================
# DOMAIN-SPECIFIC ORCHESTRATORS (4-Phase Implementation)
# =============================================================================

orchestrator_implementations:
  phase_1_tdd:
    name: "TDD Orchestrator"
    purpose: "Test-Driven Development workflow automation"
    tier_dependencies:
      - tier: 0
        rules: "test-naming", "test-coverage", "assertion-patterns"
      - tier: 1
        ac_ids: "AC-FR-*-01, AC-FR-*-02"
      - tier: 2
        templates: "test-result", "coverage-report"
    ac_ids:
      - "AC-ORCH-TDD-01"
      - "AC-ORCH-TDD-02"
      - "AC-ORCH-TDD-03"
    
  phase_2_planning:
    name: "Planning Orchestrator"
    purpose: "Acceptance Criteria planning and scope management"
    tier_dependencies:
      - tier: 0
        rules: "ac-completeness", "dependency-checking", "scope-limits"
      - tier: 1
        ac_ids: "AC-AR-*, AC-FR-*, AC-NFR-*"
      - tier: 2
        templates: "plan-analysis", "dependency-graph"
    ac_ids:
      - "AC-ORCH-PLAN-01"
      - "AC-ORCH-PLAN-02"
      - "AC-ORCH-PLAN-03"
    
  phase_3_ado:
    name: "Azure DevOps Orchestrator"
    purpose: "Work item synchronization and pipeline orchestration"
    tier_dependencies:
      - tier: 0
        rules: "work-item-format", "pipeline-safety"
      - tier: 1
        ac_ids: "AC-AR-*, AC-FR-*"
      - tier: 2
        templates: "ado-sync", "pipeline-status"
    ac_ids:
      - "AC-ORCH-ADO-01"
      - "AC-ORCH-ADO-02"
      - "AC-ORCH-ADO-03"
    
  phase_4_interaction:
    name: "User Interaction Orchestrator"
    purpose: "Multi-turn conversation management and intent classification"
    tier_dependencies:
      - tier: 0
        rules: "conversation-history", "intent-validation"
      - tier: 1
        ac_ids: "AC-VALIDATE-*"
      - tier: 2
        templates: "conversation-summary", "intent-clarification"
    ac_ids:
      - "AC-ORCH-INTERACTION-01"
      - "AC-ORCH-INTERACTION-02"
      - "AC-ORCH-INTERACTION-03"

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  AR-012:
    - ac_id: "AC-AR-012-01"
      title: "Base Orchestrator Abstract Class"
      description: |
        Implement OrchestratorBase abstract class with:
        - execute() method (abstract)
        - validate_context() hook
        - on_start() hook
        - on_complete() hook
        - get_tier_access() method returning accessible tiers
      test_file: "tests/unit/test_orchestrator_base.py"
      test_name: "test_orchestrator_base_interface"
      components_created:
        - "src/core/orchestrator_base.py"
      
    - ac_id: "AC-AR-012-02"
      title: "@orchestrator Decorator Auto-Registration"
      description: |
        Decorator that:
        - Registers orchestrator in OrchestratorRegistry
        - Extracts tier dependencies from class definition
        - Injects governance context on instantiation
        - Exposes execute() method signature to MCP
      test_file: "tests/unit/test_orchestrator_decorator.py"
      test_name: "test_orchestrator_decorator_registration"
      components_created:
        - "src/core/decorators/orchestrator.py"
      
    - ac_id: "AC-AR-012-03"
      title: "Orchestrator Tier Dependency Declaration"
      description: |
        Allow orchestrators to declare:
        - Tier access requirements (0/1/2/3)
        - Required SKULL rules
        - Required AC-ID types
        - Validation: declaration must match actual usage or reject at registration
      test_file: "tests/unit/test_orchestrator_tier_access.py"
      test_name: "test_orchestrator_tier_dependency"
      components_created:
        - "src/core/tier_access_control.py"

  AR-013:
    - ac_id: "AC-AR-013-01"
      title: "Tier 0: Domain-Specific SKULL Rules"
      description: |
        Load domain-specific governance rules into Tier 0:
        - Add rule files: cortex_brain/tier0/domains/*.yaml
        - Domains: tdd, planning, ado, interaction, infrastructure
        - Rules: 5+ rules per domain covering security, performance, compliance
        - Verify: Zero hardcoded rules in orchestrators
      test_file: "tests/unit/test_brain_tier0_domains.py"
      test_name: "test_tier0_domain_rules_loaded"
      components_created:
        - "cortex_brain/tier0/domains/tdd-rules.yaml"
        - "cortex_brain/tier0/domains/planning-rules.yaml"
        - "cortex_brain/tier0/domains/ado-rules.yaml"
        - "cortex_brain/tier0/domains/interaction-rules.yaml"
      
    - ac_id: "AC-AR-013-02"
      title: "Tier 1: AC-to-Domain Mappings"
      description: |
        Create queryable AC-to-domain mappings:
        - Schema: domain → [ac_ids], ac_id → [domains]
        - Populate: All existing AC-IDs categorized
        - Index: SQLite indexes for fast lookup
        - Verify: No orphaned AC-IDs
      test_file: "tests/unit/test_brain_tier1_mappings.py"
      test_name: "test_tier1_ac_domain_mappings"
      components_created:
        - "cortex_brain/tier1/domain-mappings.yaml"
      
    - ac_id: "AC-AR-013-03"
      title: "Tier 2: Response Templates with Inheritance"
      description: |
        Implement template inheritance for response templates:
        - Base templates: cortex_brain/tier2/base/
        - Domain templates: cortex_brain/tier2/domains/
        - Inheritance: domain templates extend base templates
        - Verification: All templates validate against schema
      test_file: "tests/unit/test_brain_tier2_templates.py"
      test_name: "test_tier2_template_inheritance"
      components_created:
        - "cortex_brain/tier2/base/*.yaml"
        - "cortex_brain/tier2/domains/tdd/*.yaml"
        - "cortex_brain/tier2/domains/planning/*.yaml"

  AR-014:
    - ac_id: "AC-AR-014-01"
      title: "Locked Phase Immutability Enforcement"
      description: |
        Prevent modifications to locked phases:
        - Detect: phase_tracker.PHASE-*.locked == true
        - Block: Any modification to AC-IDs in locked phase
        - Audit: Log attempt with AI agent identity
        - Guarantee: locked: true means read-only forever
      test_file: "tests/unit/test_mutation_guard.py"
      test_name: "test_locked_phase_immutable"
      components_created:
        - "src/core/mutation_guard.py"
      
    - ac_id: "AC-AR-014-02"
      title: "AC Completion Audit Requirement"
      description: |
        Enforce minimum audit entries for AC completion:
        - Require: START, EXECUTE, COMPLETE entries in audit_log
        - Validate: Before marking AC-ID status: COMPLETED
        - Reject: Attempt to complete AC-ID without MIN 3 entries
        - Audit: Log all completion attempts (successful and rejected)
      test_file: "tests/unit/test_audit_required_validator.py"
      test_name: "test_ac_completion_audit_requirement"
      components_created:
        - "src/core/audit_required_validator.py"
      
    - ac_id: "AC-AR-014-03"
      title: "Holistic Dependency Validation"
      description: |
        Validate all phase dependencies before allowing changes:
        - Detect: Change to AC-ID dependency
        - Validate: No broken dependencies in downstream phases
        - Check: All requires conditions still met
        - Reject: Change if dependency chain broken
      test_file: "tests/unit/test_dependency_validator.py"
      test_name: "test_holistic_dependency_validation"
      components_created:
        - "src/core/dependency_validator.py"

  AR-015:
    - ac_id: "AC-AR-015-01"
      title: "Vision Mutation Audit Tracking"
      description: |
        Track all cortex-vision.yaml changes:
        - Log: Every mutation with timestamp and agent identity
        - Capture: Impact analysis (orchestrators affected, tiers affected)
        - Validate: Change against phase_tracker consistency
        - Archive: Old versions in .github/evidence/vision-history/
      test_file: "tests/unit/test_vision_mutation_audit.py"
      test_name: "test_vision_mutation_audit"
      components_created:
        - "src/core/vision_mutation_tracker.py"
      
    - ac_id: "AC-AR-015-02"
      title: "Tier-Orchestrator Dependency Registry"
      description: |
        Maintain queryable registry:
        - Schema: tier → [orchestrators], orchestrator → [tiers]
        - Load: From @orchestrator decorator declarations
        - Query: What orchestrators access tier X? What tiers does orchestrator Y access?
        - Verify: No tier 0 modifications by non-core orchestrators
      test_file: "tests/unit/test_tier_orchestrator_registry.py"
      test_name: "test_tier_orchestrator_dependency_registry"
      components_created:
        - "src/core/dependency_registry.py"
      
    - ac_id: "AC-AR-015-03"
      title: "Vision Rollback Capability"
      description: |
        Enable rollback of vision changes:
        - Capture: Before/after state of cortex-vision.yaml
        - Store: In version control with tagged commits
        - Test: Rollback to previous vision version
        - Validate: Rollback doesn't break phase_tracker
      test_file: "tests/unit/test_vision_rollback.py"
      test_name: "test_vision_rollback"
      components_created: []

  FR-008:
    - ac_id: "AC-FR-008-01"
      title: "E2E Orchestrator Plugin Test"
      description: |
        Create and test minimal orchestrator that:
        1. Inherits from OrchestratorBase
        2. Declares tier dependencies
        3. Decorated with @orchestrator
        4. Registered in OrchestratorRegistry
        5. Exposed as MCP tool
        6. Executed via MCP with governance context
        7. Audit trail captures START → EXECUTE → COMPLETE
      test_file: "tests/integration/test_e2e_orchestrator_plugin.py"
      test_name: "test_e2e_orchestrator_plugin"
      components_created:
        - "tests/fixtures/minimal_orchestrator.py"
      
    - ac_id: "AC-FR-008-02"
      title: "Orchestrator Execution Audit Trail"
      description: |
        Verify audit trail captures orchestrator lifecycle:
        - START: Before execute()
        - EXECUTE: During execute() (progress updates)
        - COMPLETE: After execute() with result summary
        - Verify: Timestamp, status, result, error (if any)
      test_file: "tests/integration/test_orchestrator_audit_trail.py"
      test_name: "test_orchestrator_execution_audit"
      components_created: []
      
    - ac_id: "AC-FR-008-03"
      title: "Governance Context Availability"
      description: |
        Verify orchestrator can access all governance tiers:
        - Tier 0: SKULL rules for domain
        - Tier 1: AC-IDs and tracking
        - Tier 2: Response templates
        - Tier 3: Knowledge library
        - Verify: All tiers accessible via get_tier_access()
      test_file: "tests/integration/test_orchestrator_governance_context.py"
      test_name: "test_orchestrator_governance_context"
      components_created: []

  FR-009:
    - ac_id: "AC-FR-009-01"
      title: "Orphaned AC-ID Detection"
      description: |
        Detect AC-IDs not referenced in any tier:
        - Query: SELECT ac_id FROM phase_tracker WHERE ac_id NOT IN (SELECT ac_id FROM tier1_mappings)
        - Validation: All 101 AC-IDs must be in Tier 1
        - Fail: If any orphaned AC-IDs found
      test_file: "tests/unit/test_brain_consistency.py"
      test_name: "test_orphaned_ac_detection"
      components_created:
        - "src/infrastructure/brain_consistency_validator.py"
      
    - ac_id: "AC-FR-009-02"
      title: "Broken Tier References Detection"
      description: |
        Detect tier references to non-existent items:
        - Check: All Tier 1 references to Tier 0 rules exist
        - Check: All Tier 2 templates reference valid AC-ID types
        - Check: All Tier 3 links reference valid domains
        - Fail: If any broken references found
      test_file: "tests/unit/test_tier_reference_verification.py"
      test_name: "test_broken_tier_references"
      components_created: []
      
    - ac_id: "AC-FR-009-03"
      title: "Rule Conflict Detection"
      description: |
        Identify contradictory governance rules:
        - Detect: Two rules with conflicting requirements (e.g., "must use X" and "must not use X")
        - Classify: Conflict severity (CRITICAL, HIGH, MEDIUM)
        - Report: With conflicting rules listed
        - Fail: If CRITICAL conflicts found
      test_file: "tests/unit/test_rule_conflict_detection.py"
      test_name: "test_rule_conflict_detection"
      components_created: []

  NFR-005:
    - ac_id: "AC-NFR-005-01"
      title: "Plugin Registration Performance"
      description: |
        Benchmark plugin registration:
        - Test: Register 100 plugins sequentially
        - Measure: Average time per plugin
        - Requirement: <50ms per plugin
        - Pass: If avg <50ms
      test_file: "tests/performance/test_plugin_performance.py"
      test_name: "test_plugin_registration_performance"
      components_created: []
      
    - ac_id: "AC-NFR-005-02"
      title: "Governance Context Injection Performance"
      description: |
        Benchmark context injection:
        - Test: Inject context for all 4 tiers
        - Measure: Time per tier injection
        - Requirement: <10ms per tier
        - Pass: If all tiers <10ms
      test_file: "tests/performance/test_governance_context_performance.py"
      test_name: "test_governance_context_performance"
      components_created: []
      
    - ac_id: "AC-NFR-005-03"
      title: "Plugin Discovery Performance"
      description: |
        Benchmark plugin discovery scan:
        - Test: Discover 1000 mock plugins
        - Measure: Total discovery time
        - Requirement: <500ms
        - Pass: If discovery <500ms
      test_file: "tests/performance/test_plugin_discovery_performance.py"
      test_name: "test_plugin_discovery_performance"
      components_created: []

  NFR-006:
    - ac_id: "AC-NFR-006-01"
      title: "Dynamic Tier Content Loading"
      description: |
        Verify new tier files auto-loaded:
        - Create: New YAML file in cortex_brain/tier0/domains/
        - Verify: Loaded without restart
        - Measure: Load latency <100ms
        - Pass: If content available in <100ms
      test_file: "tests/unit/test_dynamic_tier_loading.py"
      test_name: "test_tier_dynamic_loading"
      components_created:
        - "src/core/dynamic_tier_loader.py"
      
    - ac_id: "AC-NFR-006-02"
      title: "Tier Content Versioning"
      description: |
        Track tier content evolution:
        - Capture: Version hash for each tier file
        - Store: Version history in SQLite
        - Query: What changed in tier 0 between version X and Y?
        - Verify: No version loss or corruption
      test_file: "tests/unit/test_tier_versioning.py"
      test_name: "test_tier_versioning"
      components_created:
        - "src/infrastructure/tier_versioning.py"
      
    - ac_id: "AC-NFR-006-03"
      title: "Tier Schema Validation on Load"
      description: |
        Reject invalid tier content:
        - Validate: YAML syntax, required fields, type checks
        - On error: Log detailed schema validation error
        - Fail: Don't load invalid tier content
        - Pass: If invalid content rejected with helpful error
      test_file: "tests/unit/test_tier_schema_validation.py"
      test_name: "test_tier_schema_validation"
      components_created: []

# =============================================================================
# DAY-BY-DAY BREAKDOWN
# =============================================================================

days:
