# =============================================================================
# ARCHITECTURE DECISIONS (Continuation from AR-014+)
# =============================================================================

architecture_decisions:
  AR-012:
    id: "AR-012"
    title: "Orchestrator Plugin Framework"
    status: "NOT_STARTED"
    priority: "CRITICAL"
    description: |
      Extensible framework for building and registering domain-specific orchestrators:
      - Base orchestrator interface with standardized lifecycle
      - Auto-discovery and registration via decorators
      - MCP tool exposure with context injection
      - TDD scaffolding for new orchestrators
      - Dependency declaration (tier access, rule sets)
      
      This enables third-party orchestrator development without modifying core.
    acceptance_criteria:
      - ac_id: "AC-AR-012-01"
        description: "Base Orchestrator abstract class with lifecycle hooks"
        test: "test_orchestrator_base_interface"
      - ac_id: "AC-AR-012-02"
        description: "@orchestrator decorator auto-registers with context injection"
        test: "test_orchestrator_decorator_registration"
      - ac_id: "AC-AR-012-03"
        description: "Orchestrator can declare tier dependencies (0/1/2/3)"
        test: "test_orchestrator_tier_dependency"
    components:
      - "OrchestratorBase"
      - "OrchestratorRegistry"
      - "TierAccessControl"
    dependencies:
      - "AR-006"
      - "AR-001"

  AR-013:
    id: "AR-013"
    title: "Brain Tier Activation & Population"
    status: "NOT_STARTED"
    priority: "CRITICAL"
    description: |
      Populate brain tiers with domain-specific governance, acceptance criteria,
      response templates, and knowledge library:
      - Tier 0: Domain-specific SKULL rules (security, performance, compliance)
      - Tier 1: Domain-to-AC mappings, tracking schemas
      - Tier 2: Domain response templates with inheritance
      - Tier 3: Domain knowledge library (patterns, examples, best practices)
      
      Enables orchestrators to access governance rules without hardcoding.
    acceptance_criteria:
      - ac_id: "AC-AR-013-01"
        description: "Tier 0: Domain SKULL rules loaded for 4+ domains"
        test: "test_tier0_domain_rules_loaded"
      - ac_id: "AC-AR-013-02"
        description: "Tier 1: AC-to-domain mappings queryable"
        test: "test_tier1_ac_domain_mappings"
      - ac_id: "AC-AR-013-03"
        description: "Tier 2: Response templates with inheritance working"
        test: "test_tier2_template_inheritance"
    components:
      - "BrainPopulator"
      - "TierContentLoader"
      - "DomainRuleRegistry"
    dependencies:
      - "AR-001"
      - "AR-009"

  AR-014:
    id: "AR-014"
    title: "Hallucination Prevention Enforcement Layer"
    status: "NOT_STARTED"
    priority: "CRITICAL"
    description: |
      Prevent AI agents from modifying locked phases or reimplementing completed work:
      - Phase lock immutability verification (read-only after locked: true)
      - AC-ID completeness validation (cannot mark AC complete without audit entries)
      - Holistic change validation (modification must verify no phase dependencies broken)
      - Governance rule immutability (Tier 0 changes rejected)
      
      Guarantees: If a phase is locked, it CANNOT be reimplemented.
    acceptance_criteria:
      - ac_id: "AC-AR-014-01"
        description: "Locked phase modifications blocked with audit trail"
        test: "test_locked_phase_immutable"
      - ac_id: "AC-AR-014-02"
        description: "AC completion requires MIN 3 audit entries (START/EXECUTE/COMPLETE)"
        test: "test_ac_completion_audit_requirement"
      - ac_id: "AC-AR-014-03"
        description: "Phase dependency modification triggers holistic validation"
        test: "test_holistic_dependency_validation"
    components:
      - "MutationGuard"
      - "AuditRequiredValidator"
      - "DependencyValidator"
    dependencies:
      - "AR-001"
      - "FR-001"

  AR-015:
    id: "AR-015"
    title: "Vision Evolution Protocol"
    status: "NOT_STARTED"
    priority: "HIGH"
    description: |
      Governance protocol for evolving cortex-vision:
      - Vision mutations audited with motivation and impact analysis
      - Tier-to-orchestrator dependency registry
      - Change validation before vision update
      - Rollback capability for vision changes
      
      Prevents vision drift and maintains alignment between vision and implementation.
    acceptance_criteria:
      - ac_id: "AC-AR-015-01"
        description: "Vision mutations logged with orchestrator impact analysis"
        test: "test_vision_mutation_audit"
      - ac_id: "AC-AR-015-02"
        description: "Tier-to-orchestrator dependency registry queryable"
        test: "test_tier_orchestrator_dependency_registry"
      - ac_id: "AC-AR-015-03"
        description: "Vision rollback capability tested"
        test: "test_vision_rollback"
    components:
      - "VisionMutationTracker"
      - "DependencyRegistry"
      - "VisionValidator"
    dependencies:
      - "AR-001"

