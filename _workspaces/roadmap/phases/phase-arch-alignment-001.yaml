      - "All tests pass: pytest tests/ -v"
      - "Git status clean except for documented changes"
    
    testing:
      unit_tests: "N/A (documentation only)"
      integration_tests: "pytest tests/ -v (should pass)"
      validation_script: |
        # PowerShell validation
        $refs = Select-String -Path (Get-ChildItem -Recurse -Include *.py,*.yaml,*.md) -Pattern 'cortex_toolkit'
        $allowed = $refs | Where-Object { 
          $_.Path -match 'archive|ARCH-ALIGNMENT|ARCH-DECISION|GAP-ANALYSIS' 
        }
        $forbidden = $refs | Where-Object { 
          $_.Path -notmatch 'archive|ARCH-ALIGNMENT|ARCH-DECISION|GAP-ANALYSIS' 
        }
        if ($forbidden.Count -gt 0) {
          Write-Host "ERROR: Forbidden cortex_toolkit references found"
          $forbidden
          exit 1
        } else {
          Write-Host "PASS: Only allowed cortex_toolkit references remain"
          exit 0
        }
    
    estimated_hours: 0.25

