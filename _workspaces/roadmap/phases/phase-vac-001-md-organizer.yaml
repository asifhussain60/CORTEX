# =============================================================================
# DESIGN NOTES
# =============================================================================

design_principles:
  solid:
    single_responsibility: |
      Each cleaner handles one domain (MD files, Python cache, etc.).
      MD Organizer focuses ONLY on .md file organization.
    
    open_closed: |
      New cleaners added by implementing CleanerInterface.
      VacuumOrchestrator requires ZERO modification for new cleaners.
    
    liskov_substitution: |
      All cleaners (MD Organizer, Python Cache Cleaner, etc.) implement
      identical interface: analyze() → Analysis, execute() → Report, rollback()
      VacuumOrchestrator works identically with any cleaner.
    
    interface_segregation: |
      CleanerInterface minimal: only essential methods.
      Optional features handled via config, not interface bloat.
    
    dependency_inversion: |
      VacuumOrchestrator depends on CleanerInterface (abstraction),
      NOT on concrete implementations (MD Organizer, etc.).
      Concrete cleaners depend on interface, not vice versa.

plugin_architecture:
  registration: |
    VacuumOrchestrator.register_cleaner(cleaner: CleanerInterface)
    Cleaners registered at startup from cortex-brain/tier1/orchestrators/cleaners/
  
  discovery: |
    Automatic discovery of cleaner modules via Python package structure.
    Each cleaner in: cortex-brain/tier1/orchestrators/cleaners/<domain>/
  
  configuration: |
    Global config: cortex-brain/vacuum/config.yaml
    Per-cleaner overrides: cortex-brain/tier1/orchestrators/cleaners/<domain>/config.yaml
  
  lifecycle: |
    1. Load → register all cleaners
    2. Analyze → collect intelligence without modifications
    3. Plan → generate execution plan based on analysis
    4. Dry-run → show what WILL happen (optional)
    5. Execute → apply changes with rollback enabled
    6. Verify → validate final state
    7. Report → comprehensive audit trail

future_cleaners: |
