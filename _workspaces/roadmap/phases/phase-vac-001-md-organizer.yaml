    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation: |
      - Reference tracking during analysis phase
      - Automated reference updater during execution
      - Validation phase verifies no broken references
      - Snapshot enables rollback if issues detected
    
  - risk: "Incorrect classification of important files as deletable"
    likelihood: "LOW"
    impact: "CRITICAL"
    mitigation: |
      - Protected files list in config
      - Manual review step before execution
      - Dry-run mode shows all planned deletions
      - Classification rules thoroughly tested
  
  - risk: "Naming conflicts when normalizing to kebab-case"
    likelihood: "LOW"
    impact: "MEDIUM"
    mitigation: |
      - Collision detection in file renamer
      - Append sequence number if collision detected
      - Report all renamed files in audit trail
      - Tests verify no naming conflicts
  
  - risk: "Incomplete cross-reference updates"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation: |
      - Scan all Python files for imports/references
      - Scan all .md files for links
      - Scan all YAML files for path references
      - Validation phase confirms all updates
      - Tests include reference verification

# =============================================================================
# AUDIT & COMPLIANCE
# =============================================================================

audit:
  required_entries_per_ac_id: 3
  entries:
    - operation: "AC_START"
      trigger: "Before analyze() begins"
      logged: "timestamp, ac_id, phase, initiator"
    
    - operation: "AC_EXECUTE"
      trigger: "Before execute() begins"
      logged: "timestamp, ac_id, migration_plan_hash, file_count, total_bytes"
    
    - operation: "AC_COMPLETE"
      trigger: "After all operations complete"
      logged: "timestamp, ac_id, files_moved, files_renamed, files_deleted, final_state_hash"

governance:
