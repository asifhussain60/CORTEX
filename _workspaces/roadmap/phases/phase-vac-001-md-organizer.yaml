# =============================================================================
# PHASE-VAC-001-MD-ORGANIZER: Vacuum Orchestrator - MD Document Organizer
# =============================================================================
# Purpose: Implement MD Document Organization as a pluggable cleaner in 
#          the Vacuum Orchestrator, invoked by Housekeeping Orchestrator
# Status: NOT_STARTED
# Requires: PHASE-06-ECOSYSTEM (Orchestrator framework)
# Estimated Duration: 3 days (24 hours)
# =============================================================================
# INNOVATION: SOLID Design Pattern for Pluggable Cleaners
#
# The Vacuum Orchestrator will support multiple specialized "cleaners" through
# a plugin architecture. The MD Organizer is the first implementation, 
# demonstrating the framework pattern for housekeeping operations.
#
# ARCHITECTURE:
# - CleanerInterface (Abstract base for all cleaners)
# - MDOrganizerCleaner (First concrete implementation)
# - VacuumOrchestrator (Plugin coordinator)
# - HousekeepingOrchestrator (Invokes vacuum cleaners on schedule)
#
# SOLID PRINCIPLES:
# ✓ Single Responsibility: Each cleaner handles one domain (MD, Python cache, etc.)
# ✓ Open/Closed: New cleaners added WITHOUT modifying orchestrator
# ✓ Liskov Substitution: All cleaners swap via CleanerInterface
# ✓ Interface Segregation: Minimal cleaner interface
# ✓ Dependency Inversion: VacuumOrchestrator depends on abstractions
# =============================================================================

phase:
  id: "PHASE-VAC-001-MD-ORGANIZER"
  title: "Vacuum Orchestrator - MD Document Organizer"
  description: |
    Implement MD Document Organization (chat01.md requirement) as a pluggable
    cleaner within the Vacuum Orchestrator framework. This phase establishes the
    foundation for pluggable housekeeping operations following SOLID design.
    
    The MD Organizer cleaner handles:
    - Analyzing all *.md files in repository recursively
    - Classifying docs into: essential, consolidatable, deletable
    - Reorganizing into .github/docs with nested structure
    - Renaming to kebab-case (≤25 chars) with meaningful names
    - Moving essential protected files to proper locations
    - Creating audit trail of all operations
  
  order: "VAC-001"
  status: "NOT_STARTED"
  locked: false
  
  # DEPENDENCY: Needs orchestrator framework from PHASE-06
  requires: "PHASE-06-ECOSYSTEM"
  required_for: "PHASE-VAC-002-PYTHON-CACHE-CLEANER"
  blocking: false
  
  estimated_hours: 24
  estimated_days: 3
  
  ac_ids: 5
  completed_ac_ids: 0
  progress_percentage: 0.0
  
  # PARALLEL TRACK: Can be developed independently
  parallel_track: true
  parallel_with: ["PHASE-15-NEURAL-OBSERVATORY", "PHASE-14"]

