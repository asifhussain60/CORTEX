      - "test_extract_context_test_fixture()"
  
  - id: "GOV-CTX-001-02"
    description: "Rule applicability engine determines if rule applies"
    verification:
      - "should_apply_rule() returns (applies: bool, reason: str)"
      - "Checks rule exemptions based on context"
      - "Handles per-rule exemption patterns"
      - "Documents exemption reasoning"
    tests:
      - "test_should_apply_core_008_production()"  # TDD: strict for production
      - "test_should_apply_core_008_exploration()"  # TDD: relaxed for exploration
      - "test_should_apply_core_022_user_facing()"  # Kebab-case: user-facing only
      - "test_should_apply_core_022_internal()"  # Kebab-case: exempt internal
      - "test_should_apply_core_030_interactive()"  # Headers: interactive only
      - "test_should_apply_core_030_json_api()"  # Headers: exempt JSON API
  
  - id: "GOV-CTX-001-03"
    description: "Rule evaluator validates rule conditions"
    verification:
      - "evaluate_rule_condition() checks actual rule constraints"
      - "Implements validation logic per rule type"
      - "Returns RuleViolation with context if failed"
