metadata:
  phase_id: "impl-governance-001-context-aware"
  title: "Situational Governance Rule Engine"
  description: "Context-aware rule application based on file type, operation type, development phase"
  priority: "P0"
  estimated_effort: "4-6 days"
  source_spec: "docs/GOVERNANCE-INTELLIGENCE-BRIEF.md"
  locked: false

objective:
  summary: "Implement situational rule dispatcher to enable intelligent governance - strict for production, flexible for exploration"
  business_value: "Transform governance from uniform enforcement to context-aware intelligence; enable team scaling with quality gates"

gap_analysis:
  current_state:
    - "29 governance rules defined with severity levels"
    - "Tier system implemented (tier0, tier1, tier2)"
    - "Audit trail logging functional"
    - "rule_evaluator._evaluate_single_rule() only checks SKULL-001"
    - "28 out of 29 rules return None (skipped)"
    - "No context awareness (file type, operation, phase)"
    - "No situational dispatch logic"
  
  critical_findings:
    file: "cortex/brain/core/rule_evaluator.py"
    function: "_evaluate_single_rule()"
    lines: "158-193"
    issue: "Only SKULL-001 checked; all other rules return None"
    comment: "This is a simplified version - real implementation would have complex matching"
    severity: "CRITICAL"
  
  missing_capability:
    - "Context extraction (file_type, operation_type, development_phase, code_classification)"
    - "Rule applicability determination (should_apply_rule())"
    - "Situational exemption logic (generated code, internal scripts, exploration phase)"
    - "Rule condition evaluation per rule type"
    - "Intelligent dispatch based on context"

