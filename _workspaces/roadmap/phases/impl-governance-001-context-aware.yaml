      - "test_evaluate_core_011_type_hints_missing()"
      - "test_evaluate_core_012_docstring_missing()"
      - "test_evaluate_core_013_bare_except()"
      - "test_evaluate_core_022_kebab_case_violation()"
      - "test_evaluate_core_028_file_length_violation()"
      - "test_evaluate_core_030_header_missing()"
  
  - id: "GOV-CTX-001-04"
    description: "Situational rule engine orchestrates dispatch"
    verification:
      - "_evaluate_single_rule() refactored to use context-aware logic"
      - "Calls extract_context() → should_apply_rule() → evaluate_rule_condition()"
      - "All 29 rules have dispatch logic"
      - "Exemptions documented in audit trail"
    tests:
      - "test_rule_dispatch_all_29_rules()"
      - "test_exemption_audit_trail()"
      - "test_rule_evaluation_performance()"

implementation:
  files_to_create:
    - path: "cortex/brain/core/governance/context_extractor.py"
      loc: 150
      classes:
        - name: "ContextExtractor"
          methods:
            - "extract_context(file_path, operation_context)"
            - "detect_file_type(file_path)"
            - "detect_code_classification(file_path)"
            - "extract_operation_type(operation_context)"
    
    - path: "cortex/brain/core/governance/rule_applicability.py"
      loc: 200
      classes:
        - name: "RuleApplicabilityEngine"
          methods:
            - "should_apply_rule(rule_id, context)"
            - "get_exemption_patterns(rule_id)"
            - "check_exemption(rule_id, context)"
    
    - path: "cortex/brain/core/governance/rule_validators.py"
      loc: 300
      functions:
        - "validate_core_008_tdd(context)"
        - "validate_core_011_type_hints(context)"
        - "validate_core_012_docstrings(context)"
        - "validate_core_013_bare_except(context)"
        - "validate_core_022_kebab_case(context)"
        - "validate_core_028_file_length(context)"
        - "validate_core_030_response_headers(context)"
        # ... + 22 more validators
    
    - path: "tests/unit/governance/test_context_extractor.py"
      loc: 200
      test_count: 15
    
    - path: "tests/unit/governance/test_rule_applicability.py"
      loc: 250
      test_count: 20
    
    - path: "tests/unit/governance/test_rule_validators.py"
      loc: 400
      test_count: 29  # One per rule
  
  files_to_modify:
    - path: "cortex/brain/core/rule_evaluator.py"
      function: "_evaluate_single_rule()"
      lines: "158-193"
      changes: "Replace hardcoded SKULL-001 check with context-aware dispatch"
      new_logic: |
        1. context = context_extractor.extract_context(file_path, operation_context)
        2. applies, reason = applicability_engine.should_apply_rule(rule.rule_id, context)
        3. if not applies: return None (with audit log: rule exempted)
        4. violation = rule_validators.validate(rule.rule_id, context)
        5. return violation (or None if passed)

api_specification:
  class: "ContextExtractor"
  methods:
    - name: "extract_context"
      params:
        - "file_path: str"
        - "operation_context: Dict[str, Any]"
      returns: "GovernanceContext"
      fields:
        file_type: str  # python, yaml, json, generated, test_fixture
        operation_type: str  # implement, fix, refactor, exploration, validation
        development_phase: str  # production, development, exploration, testing
        code_classification: str  # production, internal, generated, test
        file_path: str
        handler_name: Optional[str]
  
  class: "RuleApplicabilityEngine"
  methods:
    - name: "should_apply_rule"
      params:
        - "rule_id: str"
        - "context: GovernanceContext"
      returns: "Tuple[bool, str]"  # (applies, reason)
      example_output:
        - (True, "Production code - TDD enforced")
        - (False, "Exploration phase - TDD relaxed")
        - (False, "Generated code - exempted from naming rules")
  
  rule_validators:
    - name: "validate_core_008_tdd"
      params:
        - "context: GovernanceContext"
      returns: "Optional[RuleViolation]"
      logic: |
        if test_file_missing and context.development_phase == "production":
          return RuleViolation(rule_id="CORE-008", ...)
        return None

exemption_patterns:
  CORE-008:  # TDD
    exempt_when:
      - "development_phase == exploration"
      - "code_classification == generated"
      - "code_classification == internal AND operation_type == refactor"
    strict_when:
      - "development_phase == production"
      - "code_classification == production"
  
  CORE-022:  # Kebab-case naming
    exempt_when:
      - "file_type == python AND code_classification == internal"
      - "code_classification == generated"
      - "code_classification == test_fixture"
    strict_when:
      - "file_type IN [yaml, json, config]"
      - "code_classification == production AND operation_type != refactor"
  
  CORE-030:  # Response headers
    exempt_when:
      - "response_type == error_response"
      - "response_type == json_api"
      - "response_type == debug_output"
    strict_when:
      - "response_type == interactive_response"
      - "response_type == orchestrator_result"

