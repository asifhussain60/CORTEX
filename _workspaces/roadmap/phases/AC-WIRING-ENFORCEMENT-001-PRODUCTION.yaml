---
phase_id: "AC-WIRING-ENFORCEMENT-001-PRODUCTION"
title: "Production Wiring Enforcement & Validation Task"
description: |
  Add comprehensive wiring enforcement to TotalRecallAgent and cortex-total-recall.prompt.md
  to ensure ALL orchestrators and components are validated, discovered, and auto-fixed on execution.
  
  This task integrates three new modules:
  - wiring_validator.py: Validates all 23 orchestrators and 28+ components
  - wiring_gap_detector.py: Scans codebase for unregistered components
  - wiring_auto_fixer.py: Auto-fixes detected gaps where safe
  
  Execution: On every TotalRecallAgent initialization with enforce_production_wiring=True (default)

metadata:
  phase_id: "AC-WIRING-ENFORCEMENT-001-PRODUCTION"
  priority: "P0-CRITICAL"
  category: "production_hardening"
  blocking_deployment: true
  machine_track: "all"
  estimated_effort: "4-5 hours"
  
  completion_verification:
    success_criteria:
      - "TotalRecallAgent enforces production wiring on all executions"
      - "WiringValidator validates 100% of components (23 orchestrators + 28+ critical)"
      - "WiringGapDetector detects all unregistered components in codebase"
      - "WiringAutoFixer prepares remediation instructions for all gaps"
      - "cortex-total-recall.prompt.md updated with enforcement sections"
      - "All 3 new modules integrated into total_recall_agent.py"
      - "CORE-029 header enforced on all agent outputs"
    on_success: "Production deployment ready with full wiring validation"
    on_failure: "Block deployment until wiring gaps resolved"

scope:
  modules_created:
    - cortex/tools/wiring_validator.py
    - cortex/tools/wiring_gap_detector.py
    - cortex/tools/wiring_auto_fixer.py
  modules_enhanced:
    - cortex/tools/total_recall_agent.py
    - .github/prompts/cortex-total-recall.prompt.md
  tests_required: 12
  integration_points: "TotalRecallAgent initialization + MasterOrchestrator + MCP Registry"

acceptance_criteria:
  - id: "AC-WIRING-ENF-001"
    description: "WiringValidator validates 6 core orchestrators on startup"
    verification: "pytest tests/unit/tools/test_wiring_validator.py::TestCoreOrchestrators -v"
  
  - id: "AC-WIRING-ENF-002"
    description: "WiringValidator validates 5 domain orchestrators"
    verification: "pytest tests/unit/tools/test_wiring_validator.py::TestDomainOrchestrators -v"
  
  - id: "AC-WIRING-ENF-003"
    description: "WiringValidator validates 4-stage pipeline integrity"
    verification: "pytest tests/unit/tools/test_wiring_validator.py::Test4StagePipeline -v"
  
  - id: "AC-WIRING-ENF-004"
    description: "WiringValidator validates MCP registry with 15 tools"
    verification: "pytest tests/unit/tools/test_wiring_validator.py::TestMCPRegistry -v"
  
  - id: "AC-WIRING-ENF-005"
    description: "WiringValidator validates governance and state components"
    verification: "pytest tests/unit/tools/test_wiring_validator.py::TestGovernanceState -v"
  
  - id: "AC-WIRING-ENF-006"
    description: "WiringGapDetector scans for unregistered orchestrators"
    verification: "pytest tests/unit/tools/test_wiring_gap_detector.py::TestUnregisteredOrchestrators -v"
  
  - id: "AC-WIRING-ENF-007"
    description: "WiringGapDetector detects unregistered MCP tools"
    verification: "pytest tests/unit/tools/test_wiring_gap_detector.py::TestUnregisteredMCPTools -v"
  
  - id: "AC-WIRING-ENF-008"
    description: "WiringGapDetector identifies broken imports in critical modules"
    verification: "pytest tests/unit/tools/test_wiring_gap_detector.py::TestBrokenImports -v"
  
  - id: "AC-WIRING-ENF-009"
    description: "WiringAutoFixer prepares remediation instructions"
    verification: "pytest tests/unit/tools/test_wiring_auto_fixer.py::TestAutoFixing -v"
  
  - id: "AC-WIRING-ENF-010"
    description: "TotalRecallAgent.enforce_production_wiring() executes on init"
    verification: "pytest tests/unit/tools/test_total_recall_enforcement.py::TestEnforcement -v"
  
  - id: "AC-WIRING-ENF-011"
    description: "CORE-029 header enforced on all agent outputs"
    verification: "pytest tests/unit/tools/test_core_029_enforcement.py -v"
  
  - id: "AC-WIRING-ENF-012"
    description: "cortex-total-recall.prompt.md includes enforcement sections"
    verification: "grep -c 'AUTO-ENFORCEMENT' .github/prompts/cortex-total-recall.prompt.md"

implementation_plan:
  phase_1_create_modules:
    duration: "1.5 hours"
    tasks:
      - "Create wiring_validator.py with 6 validation methods"
      - "Create wiring_gap_detector.py with 4 gap detection methods"
      - "Create wiring_auto_fixer.py with 3 auto-fix methods"
  
  phase_2_enhance_agent:
    duration: "1 hour"
    tasks:
      - "Add enforce_production_wiring() method to TotalRecallAgent"
      - "Integrate WiringValidator into __init__"
      - "Integrate WiringGapDetector into execution path"
      - "Integrate WiringAutoFixer into remediation flow"
  
  phase_3_update_prompt:
    duration: "0.5 hours"
    tasks:
      - "Add AUTO-ENFORCEMENT section to cortex-total-recall.prompt.md"
      - "Document wiring validation process"
      - "Document auto-fix remediation strategy"
      - "Document enforcement enforcement points"
  
  phase_4_create_tests:
    duration: "1.5 hours"
    tasks:
      - "Create test_wiring_validator.py (5 test classes)"
      - "Create test_wiring_gap_detector.py (3 test classes)"
      - "Create test_wiring_auto_fixer.py (2 test classes)"
      - "Create test_total_recall_enforcement.py (2 test classes)"
      - "Create test_core_029_enforcement.py (1 test class)"
  
  phase_5_integration:
    duration: "0.5 hours"
    tasks:
      - "Verify all 3 modules load without errors"
      - "Test full enforcement pipeline end-to-end"
      - "Validate CORE-029 header on all outputs"
      - "Run full test suite (12 tests)"

dependencies:
  - "cortex.tools.total_recall_agent must be importable"
  - "cortex.orchestrators.core.master_orchestrator must be wired"
  - "cortex.mcp.registry must be operational"
  - "cortex.brain.core.governance_registry must be singleton"

enforcement_rules:
  - "No bare except: clauses (CORE-013)"
  - "100% type hints on all functions (CORE-011)"
  - "Google-style docstrings on all public functions (CORE-012)"
  - "CORE-029 header on all agent responses (CORE-029)"
  - "Tests created BEFORE implementation (CORE-008)"
  - "<500 lines per file for readability (CORE-001)"

implementation_details:
  wiring_validator_architecture:
    purpose: "Validate all components are wired and operational on startup"
    entry_point: "WiringValidator.validate_all_production_wiring()"
    checks:
      - "6 core orchestrators (Stage 1-4 + TDD + Bootstrap)"
      - "5 domain orchestrators (Refactoring, Planning, Domain, Conversation, DomainBrain)"
      - "6 support orchestrators (Onboarding, Discovery, Migration, Upgrade, Rollback, Setup)"
      - "4-stage pipeline integrity (Comprehension, Routing, Knowledge, Execution)"
      - "15 MCP tools registered and operational"
      - "6 governance/state components (Registry, StateManager, TodoManager, Logger, Rules, Knowledge)"
    output: "WiringValidationResult objects with detailed coverage percentages"
  
  wiring_gap_detector_architecture:
    purpose: "Scan codebase for orchestrators and components not in registry"
    entry_point: "WiringGapDetector.detect_all_gaps()"
    detection_methods:
      - "Scan cortex/orchestrators/ for orchestrator classes"
      - "Scan cortex/mcp/tools/ for tool definitions"
      - "Check critical modules for broken imports"
      - "Find classes without docstrings or usage"
    output: "WiringGap objects with component metadata and remediation instructions"
  
  wiring_auto_fixer_architecture:
    purpose: "Prepare and execute fixes for detected gaps"
    entry_point: "WiringAutoFixer.auto_fix_all_gaps(gaps)"
    fix_types:
      - "Register unregistered orchestrators (SKIPPED - requires manual review)"
      - "Register unregistered MCP tools (SKIPPED - requires manual review)"
      - "Fix safe import errors (CONSERVATIVE - only known patterns)"
      - "Add missing exports (PREPARED - instructions generated)"
    output: "FixResult objects with status and remediation instructions"
  
  total_recall_agent_integration:
    method_name: "enforce_production_wiring()"
    execution_point: "TotalRecallAgent.__init__() if enforce_production_wiring=True"
    sequence:
      1. "Call WiringValidator.validate_all_production_wiring()"
      2. "If any gaps detected, call WiringGapDetector.detect_all_gaps()"
      3. "For each gap, attempt WiringAutoFixer.auto_fix_all_gaps()"
      4. "Log all results to EnhancedAuditLogger with AC-ID"
      5. "Return enforcement_status dict with full details"
    error_handling:
      - "Critical gaps (4-stage pipeline): FAIL and block execution"
      - "High-priority gaps (core orchestrators): WARN but continue"
      - "Medium-priority gaps (domain orchestrators): INFO and continue"
      - "Low-priority gaps (support orchestrators): DEBUG and continue"

execution_steps:
  step_1_implement_validator:
    command: "Create cortex/tools/wiring_validator.py"
    deliverables:
      - "WiringValidationResult dataclass"
      - "WiringValidator class with validate_all_production_wiring()"
      - "6 validation methods (core, domain, support, pipeline, MCP, governance)"
  
  step_2_implement_detector:
    command: "Create cortex/tools/wiring_gap_detector.py"
    deliverables:
      - "WiringGap dataclass"
      - "WiringGapDetector class with detect_all_gaps()"
      - "4 gap detection methods (orchestrators, MCP tools, imports, orphaned)"
  
  step_3_implement_fixer:
    command: "Create cortex/tools/wiring_auto_fixer.py"
    deliverables:
      - "FixResult dataclass"
      - "WiringAutoFixer class with auto_fix_all_gaps()"
      - "3 auto-fix methods (orchestrators, MCP tools, imports)"
  
  step_4_enhance_agent:
    command: "Update cortex/tools/total_recall_agent.py"
    changes:
      - "Import three new modules"
      - "Add enforce_production_wiring() method"
      - "Call in __init__() when enforce_production_wiring=True"
      - "Add error handling and logging"
  
  step_5_update_prompt:
    command: "Update .github/prompts/cortex-total-recall.prompt.md"
    additions:
      - "AUTO-ENFORCEMENT section (before Wiring Harness)"
      - "4 enforcement actions (validate, detect, fix, report)"
      - "AC-ID reference: AC-WIRING-ENFORCEMENT-001"
      - "Implementation locations documented"
  
  step_6_create_tests:
    command: "Create test files in tests/unit/tools/"
    test_count: 12
    files:
      - "test_wiring_validator.py (4 test classes, 4 tests each)"
      - "test_wiring_gap_detector.py (3 test classes, 3 tests each)"
      - "test_wiring_auto_fixer.py (2 test classes, 2 tests each)"
      - "test_total_recall_enforcement.py (2 test classes, 1 test each)"
  
  step_7_integration_test:
    command: "Run full enforcement pipeline end-to-end"
    verification:
      - "All 12 tests pass"
      - "Coverage >90% for new modules"
      - "No bare excepts (CORE-013)"
      - "100% type hints (CORE-011)"
      - "CORE-029 headers on outputs (CORE-029)"

deliverables:
  code_files:
    - "cortex/tools/wiring_validator.py (300 LOC)"
    - "cortex/tools/wiring_gap_detector.py (350 LOC)"
    - "cortex/tools/wiring_auto_fixer.py (280 LOC)"
    - "cortex/tools/total_recall_agent.py (ENHANCED)"
  
  documentation:
    - ".github/prompts/cortex-total-recall.prompt.md (AUTO-ENFORCEMENT section)"
  
  tests:
    - "tests/unit/tools/test_wiring_validator.py (100 LOC)"
    - "tests/unit/tools/test_wiring_gap_detector.py (120 LOC)"
    - "tests/unit/tools/test_wiring_auto_fixer.py (90 LOC)"
    - "tests/unit/tools/test_total_recall_enforcement.py (80 LOC)"
  
  metrics:
    - "12 tests (100% pass rate target)"
    - "930 LOC new implementation"
    - "4-5 hours total effort"
    - "0 critical gaps remaining"

result:
  tests_passed: 0  # Will be updated during implementation
  tests_failed: 0
  test_pass_rate: "0%"  # Will be updated after execution
  implementation_status: "NOT_STARTED"
  completion_date: null
  notes: |
    This task adds production-grade wiring enforcement to ensure CORTEX operates
    with 100% component coverage. On every execution, TotalRecallAgent will validate
    that all orchestrators are registered, all MCP tools are discoverable, and the
    4-stage pipeline is functional.
    
    Any gaps detected will trigger remediation suggestions, and the agent will
    maintain a complete audit trail of all enforcement activities per CORE-024
    (audit logging) and CORE-029 (response headers).
    
    This is a critical prerequisite for production deployment as it prevents the
    "hidden functionality" problem where 80% of capabilities remain inaccessible
    due to incomplete wiring.
