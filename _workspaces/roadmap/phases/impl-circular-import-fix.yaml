executive_summary: |
  15 test files fail with RecursionError during collection due to circular imports
  in the cortex.orchestrators.core module hierarchy. This phase identifies and
  breaks the circular dependency to enable full test collection.

problem_statement:
  recursion_errors: 15
  affected_area: "cortex/orchestrators/core/"
  root_cause: "Circular import between master_orchestrator and its dependencies"
  
  affected_tests:
    - "tests/unit/core/orchestrator/test_conversation_protocol.py"
    - "tests/unit/core/orchestrator/test_event_integration.py"
    - "tests/unit/core/orchestrator/test_intent_router.py"
    - "tests/unit/core/orchestrator/test_master_orchestrator.py"
    - "tests/unit/core/orchestrator/test_master_orchestrator_comprehensive.py"
    - "tests/unit/core/orchestrator/test_master_orchestrator_stage_2_integration.py"
    - "tests/unit/core/orchestrator/test_mcp_exposure.py"
    - "tests/unit/core/orchestrator/test_mcp_list_tools.py"
    - "tests/unit/core/orchestrator/test_oc_004_01_integration.py"
    - "tests/unit/core/orchestrator/test_production_validation.py"
    - "tests/unit/core/orchestrator/test_wrapped_orchestrators.py"
    - "tests/unit/infrastructure/test_circuit_breaker_adaptive.py"
    - "tests/unit/infrastructure/test_prometheus_metrics.py"
    
  error_pattern: |
    RecursionError: maximum recursion depth exceeded
    
    Traceback typically shows:
    File "cortex/orchestrators/core/master_orchestrator.py", line X, in <module>
        from cortex.orchestrators.core.planning_orchestrator import ...
    File "cortex/orchestrators/core/planning_orchestrator.py", line Y, in <module>
        from cortex.orchestrators.core.master_orchestrator import ...

diagnosis_steps:
  step_1:
    description: "Identify the circular import chain"
    command: |
      python3 -c "
      import sys
      sys.setrecursionlimit(50)
      try:
          from cortex.orchestrators.core import master_orchestrator
      except RecursionError as e:
          import traceback
          traceback.print_exc()
      "
    expected: "Stack trace showing the import cycle"
    
  step_2:
    description: "Map all imports in orchestrator modules"
    command: |
      grep -r "^from cortex" cortex/orchestrators/core/*.py | sort
      grep -r "^import cortex" cortex/orchestrators/core/*.py | sort
    expected: "Import graph showing cycles"
    
  step_3:
    description: "Identify which module starts the cycle"
    analysis: |
      Common patterns:
      - __init__.py imports all modules (wildcard import)
      - master_orchestrator imports planning_orchestrator
      - planning_orchestrator imports master_orchestrator
      - Type annotations cause runtime imports

resolution_strategies:
  strategy_1:
    name: "TYPE_CHECKING guard"
    description: "Move type-only imports under TYPE_CHECKING block"
    pattern: |
      from typing import TYPE_CHECKING
      
      if TYPE_CHECKING:
          from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator
      
      # Use string annotation for forward reference
      def process(orchestrator: "MasterOrchestrator") -> None:
          pass
    when_to_use: "When import is only for type hints"
    
  strategy_2:
    name: "Lazy import"
    description: "Import inside function rather than at module level"
    pattern: |
      def get_master_orchestrator():
          from cortex.orchestrators.core.master_orchestrator import MasterOrchestrator
          return MasterOrchestrator()
    when_to_use: "When import is rarely used at runtime"
    
  strategy_3:
    name: "Interface extraction"
    description: "Extract common interface to separate module"
    pattern: |
      # cortex/orchestrators/core/interfaces.py
      from abc import ABC, abstractmethod
      
      class IOrchestratorBase(ABC):
          @abstractmethod
          def execute(self, context): pass
      
      # Both master_orchestrator.py and planning_orchestrator.py import from interfaces.py
    when_to_use: "When modules need to reference each other's types"
    
  strategy_4:
    name: "Clean __init__.py"
    description: "Remove wildcard imports from __init__.py"
    pattern: |
      # Instead of:
      # from .master_orchestrator import *
      # from .planning_orchestrator import *
      
      # Use explicit lazy loading:
      def __getattr__(name):
          if name == "MasterOrchestrator":
              from .master_orchestrator import MasterOrchestrator
              return MasterOrchestrator
          raise AttributeError(f"module has no attribute {name}")
    when_to_use: "When __init__.py causes eager import of circular deps"

