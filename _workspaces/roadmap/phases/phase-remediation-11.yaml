        - User Intent processing
        - Stage 1-3 coordination
        - Context carryover
        - Turn execution and continuation
    
    - layer: LENS Pipeline Integration
      components:
        - Language phase
        - Examination phase
        - Synthesis phase
        - Knowledge phase
    
    - layer: MCP Tool Integration
      components:
        - Tool discovery
        - Tool invocation
        - Parameter validation
        - Response formatting
    
    - layer: Governance Runtime
      components:
        - Rule evaluation
        - Violation detection
        - Audit logging
        - Error handling
    
    - layer: State Management
      components:
        - AC state tracking
        - Phase dependencies
        - Hash chain integrity
        - Audit trail

