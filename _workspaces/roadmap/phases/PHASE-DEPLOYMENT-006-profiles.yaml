# Phase DEPLOYMENT-006: Governance Profile System
# Pre-built tier1 templates for quick-start
# Date: 2026-01-21
# Priority: P2-MEDIUM
# Authority: chat01.md requirements analysis

metadata:
  phase_id: "PHASE-DEPLOYMENT-006-profiles"
  title: "Governance Profile Templates and Quick-Start Wizard"
  description: "Pre-built tier1 profiles (FinOps, Auth, ML, DevOps) with versioning and quick-start wizard"
  priority: "P2-MEDIUM"
  estimated_effort: "2 days"
  status: "NOT_STARTED"
  blocks_production: false
  machine: "ah"

executive_summary: |
  Reduce tier1 rule creation from days → hours with pre-built profiles:
  - FinOps profile (15-20 rules for financial domain)
  - Auth profile (12-15 rules for authentication/session management)
  - ML profile (10-12 rules for machine learning projects)
  - DevOps profile (8-10 rules for CI/CD automation)
  - Healthcare profile (12-15 rules for HIPAA compliance)
  - Legal profile (10-12 rules for legal document management)
  
  Quick-start wizard detects project type and applies appropriate profile.

current_state:
  tier1_profiles: "None (manual rule creation)"
  quick_start_wizard: "None"
  profile_versioning: "None"
  profile_inheritance: "None"

acceptance_criteria:
  - id: "AC-DEP-006-01"
    description: "Profile template library with 6 pre-built profiles"
    verification: "cortex_brain/tier1/profiles/ contains 6 profile YAML files"
    implementation:
      - "Create cortex_brain/tier1/profiles/finops-v1.0.yaml (15-20 rules)"
      - "Create cortex_brain/tier1/profiles/auth-v1.0.yaml (12-15 rules)"
      - "Create cortex_brain/tier1/profiles/ml-v1.0.yaml (10-12 rules)"
      - "Create cortex_brain/tier1/profiles/devops-v1.0.yaml (8-10 rules)"
      - "Create cortex_brain/tier1/profiles/healthcare-v1.0.yaml (12-15 rules)"
      - "Create cortex_brain/tier1/profiles/legal-v1.0.yaml (10-12 rules)"
      - "Profile manifest: name, version, description, rule_count, applies_to"
    tests:
      - "test_finops_profile_has_15plus_rules"
      - "test_auth_profile_has_12plus_rules"
      - "test_ml_profile_has_10plus_rules"
      - "test_profile_manifest_complete"
  
  - id: "AC-DEP-006-02"
    description: "Quick-start wizard detects project type and suggests profile"
    verification: "Wizard detects KASHKOLE as financial, suggests finops-v1.0.yaml"
    implementation:
      - "Create cortex/orchestrators/profile_wizard.py"
      - "Detect project type from requirements.txt (pandas → FinOps, tensorflow → ML)"
      - "Detect project type from file structure (auth/ folder → Auth profile)"
      - "Suggest appropriate profile (KASHKOLE → FinOps, KSESSIONS → Auth)"
      - "Customize wizard (add/remove rules interactively)"
      - "Apply profile (copy profile YAML → tier1/domain-rules.yaml)"
    tests:
      - "test_detect_finops_from_requirements"
      - "test_detect_auth_from_structure"
      - "test_suggest_appropriate_profile"
      - "test_customize_profile_rules"
      - "test_apply_profile_to_tier1"
  
  - id: "AC-DEP-006-03"
    description: "Profile versioning tracks evolution and updates"
    verification: "FinOps v1.1 available, KASHKOLE upgrades from v1.0 → v1.1"
    implementation:
      - "Track applied profile (KASHKOLE uses finops-v1.0.yaml)"
      - "Detect profile updates (finops-v1.1.yaml released)"
      - "Show upgrade diff (v1.0 → v1.1: +3 new rules, -1 deprecated rule)"
      - "Apply profile upgrade (merge v1.1 changes, preserve customizations)"
      - "Profile compatibility check (safe to upgrade?)"
    tests:
      - "test_track_applied_profile"
      - "test_detect_profile_updates"
      - "test_show_upgrade_diff"
      - "test_apply_profile_upgrade"
      - "test_profile_compatibility_check"
  
  - id: "AC-DEP-006-04"
    description: "Custom profile editor with VSCode integration"
    verification: "VSCode extension enables tier1 YAML editing with IntelliSense"
    implementation:
      - "VSCode extension: cortex-governance-editor"
      - "YAML schema for tier1 rules (rule_id, severity, condition, action)"
      - "IntelliSense for rule templates (type 'FIN-' → show FinOps rule suggestions)"
      - "Profile validation (check tier0 conflicts, syntax errors)"
      - "Profile inheritance (MyFinOps extends FinOps base, adds custom rules)"
    tests:
      - "test_vscode_extension_installed"
      - "test_intellisense_suggests_rules"
      - "test_profile_validation"
      - "test_profile_inheritance"

deliverables:
  code:
    - "cortex/orchestrators/profile_wizard.py"
    - "cortex/orchestrators/profile_versioner.py"
    - "cortex/orchestrators/profile_upgrader.py"
    - "cortex_brain/tier1/profiles/finops-v1.0.yaml (15-20 rules)"
    - "cortex_brain/tier1/profiles/auth-v1.0.yaml (12-15 rules)"
    - "cortex_brain/tier1/profiles/ml-v1.0.yaml (10-12 rules)"
    - "cortex_brain/tier1/profiles/devops-v1.0.yaml (8-10 rules)"
    - "cortex_brain/tier1/profiles/healthcare-v1.0.yaml (12-15 rules)"
    - "cortex_brain/tier1/profiles/legal-v1.0.yaml (10-12 rules)"
  
  vscode_extension:
    - "extensions/vscode-cortex/src/governance-editor.ts"
    - "extensions/vscode-cortex/schemas/tier1-rule-schema.json"
  
  tests:
    - "tests/orchestrators/test_profile_wizard.py (10 tests)"
    - "tests/orchestrators/test_profile_versioner.py (8 tests)"
    - "tests/orchestrators/test_profile_upgrader.py (7 tests)"
    - "tests/tier1/test_profile_*.py (18 tests, 3 per profile)"

dependencies:
  requires: 
    - "PHASE-DEPLOYMENT-005-migration (versioning system)"
  blocks: []

completion_verification:
  success_criteria:
    - "All 43 profile tests passing"
    - "6 pre-built profiles exist in cortex_brain/tier1/profiles/"
    - "Quick-start wizard detects KASHKOLE as FinOps, KSESSIONS as Auth"
    - "Profile versioning tracks v1.0 → v1.1 upgrades"
    - "VSCode extension enables IntelliSense for tier1 YAML editing"
    - "Profile inheritance functional (MyFinOps extends FinOps)"
  validation_command: "pytest tests/orchestrators/test_profile*.py -v"

governance_compliance:
  - "CORE-008: Tests before implementation"
  - "CORE-011: All functions typed"
  - "CORE-012: Google docstrings"
  - "CORE-017: Profiles must not override tier0 rules"

notes: |
  This phase reduces multi-repo governance setup time from days → hours.
  
  Profile application flow:
  1. python cortex/orchestrators/profile_wizard.py
  2. Wizard detects KASHKOLE structure (pandas, numpy → financial)
  3. Suggests finops-v1.0.yaml
  4. User reviews/customizes rules
  5. Apply → tier1/domain-rules.yaml created
  6. KASHKOLE now governed by FinOps profile + tier0 CORE rules
  
  Profile versioning example:
  - KASHKOLE initially uses finops-v1.0.yaml (15 rules)
  - finops-v1.1.yaml released (+3 new compliance rules)
  - Wizard detects upgrade available
  - User reviews diff, applies upgrade
  - Custom rules preserved (inheritance pattern)
