executive_summary: |
  PHASE KG-001 establishes Knowledge Graph infrastructure as an optional backend for domain brain semantic queries.
  
  **Starting State:**
  - Assessment complete: KG feasibility identified as Tier 2 optional enhancement
  - PHASE-E production TDD implementation in progress or complete
  - Current architecture: YAML + SQLite governance, hierarchical tiers
  
  **Deliverables:**
  1. Neo4j/Amazon Neptune instance provisioned (sandbox/dev tier OK)
  2. KG schema with 4 node types + 5 relationship types
  3. Abstract IGraphAdapter interface in cortex/brain/core/knowledge/graph/
  4. Mock KG implementation for testing (no external dependencies)
  5. Fallback logic ensuring SQLite works if KG unavailable
  6. 40+ unit tests validating all components
  
  **Key Design Principle:** Non-breaking optional layer
  - KG queries wrap existing `BusinessKnowledgeRepository` methods
  - Timeout or error → transparent fallback to SQLite
  - Feature flag disables KG without code changes
  - Existing tests continue to pass unchanged
  
  **Ending State:**
  - KG infrastructure ready for entity sync (PHASE-KG-002)
  - Full test coverage for adapter and schema validation
  - Fallback semantics verified with chaos tests
  - Zero impact to production if KG feature disabled

critical_success_factors:
  - "Design adapter interface BEFORE provisioning actual KG (enables parallel testing)"
  - "Mock KG implementation for local testing (zero external dependencies)"
  - "Explicit timeout/retry handling (KG unavailability must not break system)"
  - "Type hints and docstrings from start (governance CORE-011, CORE-012)"
  - "All tests passing before moving to entity sync phase"

## IMPLEMENTATION PHASES

implementation_phases:

  phase_kg1_infrastructure:
    id: "PHASE-KG1-INFRASTRUCTURE"
    duration: "1 day"
    effort_hours: 8
    goal: "Provision KG infrastructure and configure Neo4j/Neptune"
    
    acceptance_criteria:
      - id: "AC-KG1-INF-001"
        description: "Neo4j or Amazon Neptune instance accessible with credentials configured"
        verification: "Connection test successful; instance responds to health check"
      
      - id: "AC-KG1-INF-002"
        description: "Connection pooling and timeout configuration established"
        verification: "Connection pool created with max_connections=10, timeout=5s"
      
      - id: "AC-KG1-INF-003"
        description: "Fallback to SQLite configured when KG unavailable"
        verification: "Circuit breaker test: KG timeout → SQLite fallback active"
    
    implementation_tasks:
      - task: "Create Neo4j sandbox or Amazon Neptune dev instance"
        guidance: "Use Neo4j Aura (free tier) or AWS Neptune free tier - credentials secured in .env"
        verification: "Instance created, port accessible from localhost"
      
      - task: "Configure CORTEX connection manager for KG"
        files:
          - "cortex/infrastructure/graph_pool_manager.py (NEW)"
        guidance: "Mirror existing DatabaseManager pattern; implement IGraphPool interface"
        verification: "Connection pool tests passing"
      
      - task: "Design schema: Node and relationship types"
        files:
          - "_workspaces/roadmap/designs/kg-schema-v1.yaml (NEW)"
        guidance: "Define: Entity (domain entities), Rule (governance rules), Service, API nodes; relationship constraints"
        verification: "Schema document with 4+ node types, 5+ relationship types, indexes defined"
  
  phase_kg1_schema:
    id: "PHASE-KG1-SCHEMA"
    duration: "1 day"
    effort_hours: 8
    goal: "Create KG schema definitions and Cypher DDL"
    
    acceptance_criteria:
      - id: "AC-KG1-SCHEMA-001"
        description: "Node types defined with properties and constraints"
        verification: "Entity, Rule, Service, API, Domain node types created"
      
      - id: "AC-KG1-SCHEMA-002"
        description: "Relationship types defined with cardinality constraints"
        verification: "CALLS, DEPENDS_ON, IMPLEMENTS, HAS_RULE, BELONGS_TO relationships created"
      
      - id: "AC-KG1-SCHEMA-003"
        description: "Indexes created on frequently queried properties"
        verification: "Index on Entity.id, Rule.id, Service.name; query performance validated"
    
    implementation_tasks:
      - task: "Create Cypher DDL statements for schema"
        files:
          - "cortex/brain/core/knowledge/graph/schema.py (NEW)"
        guidance: "Cypher statements for CONSTRAINT and CREATE INDEX; idempotent (CREATE IF NOT EXISTS)"
        verification: "Schema creation test passing"
      
      - task: "Define ConstraintValidator for schema compliance"
        files:
          - "cortex/brain/core/knowledge/graph/constraint_validator.py (NEW)"
        guidance: "Validate incoming entities match schema; enforce cardinality constraints"
        verification: "Validator tests: valid entities pass, invalid entities raise ConstraintError"
  
  phase_kg1_adapter:
    id: "PHASE-KG1-ADAPTER"
    duration: "1 day"
    effort_hours: 8
    goal: "Design and implement abstract graph adapter interface"
    
    acceptance_criteria:
      - id: "AC-KG1-ADAPTER-001"
        description: "IGraphAdapter interface defined with query/ingest methods"
        verification: "Interface in cortex/brain/core/knowledge/graph/interface.py with 8+ abstract methods"
      
      - id: "AC-KG1-ADAPTER-002"
        description: "Mock KG implementation (no external dependencies)"
        verification: "MockGraphAdapter passing 100% of adapter tests"
      
      - id: "AC-KG1-ADAPTER-003"
        description: "Fallback to SQLite adapter when KG unavailable"
        verification: "SQLiteGraphAdapter returning same results as mock"
    
    implementation_tasks:
      - task: "Define IGraphAdapter interface"
        files:
          - "cortex/brain/core/knowledge/graph/interface.py (NEW)"
        guidance: |
          Methods:
          - create_entity(id, type, properties) → EntityNode
          - create_relationship(source_id, rel_type, target_id) → Relationship
          - query_entities(type, filters) → List[EntityNode]
          - query_paths(source_id, rel_types, max_hops) → List[Path]
          - delete_entity(id) → bool
          - health_check() → HealthStatus (with timeout)
        verification: "All methods typed with full docstrings"
      
      - task: "Create MockGraphAdapter for testing"
        files:
          - "cortex/brain/core/knowledge/graph/mock_adapter.py (NEW)"
        guidance: "In-memory implementation using dicts; no external KG dependency"
        verification: "Mock adapter tests: create, query, delete operations all passing"
      
      - task: "Create SQLiteGraphAdapter fallback"
        files:
          - "cortex/brain/core/knowledge/graph/sqlite_adapter.py (NEW)"
        guidance: "Implement IGraphAdapter using existing SQLite via governance.db"
        verification: "SQLite adapter tests mirror mock adapter tests exactly"
  
  phase_kg1_testing:
    id: "PHASE-KG1-TESTING"
    duration: "0.5-1 day"
    effort_hours: 4-8
    goal: "Comprehensive testing of KG infrastructure"
    
    acceptance_criteria:
      - id: "AC-KG1-TEST-001"
        description: "40+ unit tests covering adapter, schema, connection pool"
        verification: "pytest output: 40+/40+ PASSED"
      
      - id: "AC-KG1-TEST-002"
        description: "Fallback semantics tested: KG timeout triggers SQLite"
        verification: "Chaos test: introduce 5s latency → fallback activates after 5s"
      
      - id: "AC-KG1-TEST-003"
        description: "Type hints and docstrings validated"
        verification: "mypy clean; pydocstyle validation passing"
      
      - id: "AC-KG1-TEST-004"
        description: "No breaking changes to existing code"
        verification: "All 7000+ existing CORTEX tests still passing"
    
    implementation_tasks:
      - task: "Create unit tests for adapter interface"
        files:
          - "tests/unit/knowledge/test_graph_adapter.py (NEW - 15 tests)"
        guidance: "Test: create_entity, create_relationship, query_entities, query_paths, error handling"
        verification: "15/15 tests passing"
      
      - task: "Create integration tests for mock KG"
        files:
          - "tests/integration/knowledge/test_mock_graph.py (NEW - 12 tests)"
        guidance: "Test: entity lifecycle, relationship creation, multi-hop queries, constraint validation"
        verification: "12/12 tests passing"
      
      - task: "Create fallback chaos tests"
        files:
          - "tests/integration/knowledge/test_kg_fallback.py (NEW - 8 tests)"
        guidance: "Test: timeout, connection failure, adapter fallback, result equality"
        verification: "8/8 tests passing"
      
      - task: "Create governance compliance tests"
        files:
          - "tests/unit/knowledge/test_kg_governance.py (NEW - 5 tests)"
        guidance: "Test: type hints coverage, docstring format, exception specificity"
        verification: "5/5 tests passing"

