      ✓ Exit code 0 when no issues found
    
    governance_alignment:
      - "CORE-008: Tests written first"
      - "CORE-011: Type hints"
      - "CORE-012: Docstrings"
  
  AC-ENV-SETUP-004-01:
    id: "AC-ENV-SETUP-004-01"
    title: "MCP Server Bootstrap & Health Check"
    description: |
      Initialize MCP server and verify it starts successfully.
      Perform health check to confirm server is responsive.
      Test that all 23+ MCP tools are discoverable.
      Verify server shutdown gracefully.
    
    requirements:
      - "MCP server starts on default port (8000)"
      - "Server responds to health check endpoint"
      - "All registered tools discoverable via /list-tools"
      - "Server handles graceful shutdown"
      - "Server logs startup/shutdown events"
    
    dependencies:
