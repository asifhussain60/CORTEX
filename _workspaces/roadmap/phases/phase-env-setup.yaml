    test_file: "tests/unit/infrastructure/test_environment_setup.py"
    test_count: 10
    test_cases:
      - "test_mcp_server_starts_successfully"
      - "test_mcp_server_responds_to_health_check"
      - "test_mcp_server_tools_discoverable"
      - "test_mcp_server_tool_count_correct"
      - "test_mcp_server_shutdown_graceful"
      - "test_mcp_server_socket_available"
