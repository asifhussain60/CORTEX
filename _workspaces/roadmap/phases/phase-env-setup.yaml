# =============================================================================
# PHASE-ENV-SETUP: Environment Setup & Toolkit Initialization
# =============================================================================
# Focus: Python environment validation, dependency installation, MCP server
#        initialization, pre-commit hook setup, verification automation
# Status: DESIGNED
# AC-IDs: 5 (AC-ENV-SETUP-001-01 through AC-ENV-SETUP-005-01)
# Estimated Hours: 3
# Estimated Tests: 53
# Priority: P0 (CRITICAL - Prerequisite for all downstream work)
# =============================================================================

metadata:
  phase_id: "PHASE-ENV-SETUP"
  title: "Environment Setup & Toolkit Initialization"
  version: "1.0.0"
  created: "2026-01-19"
  author: "cortex-builder"
  status: "NOT_STARTED"
  priority: "P0"
  blocking: true
  category: "Infrastructure & Deployment"
  description: |
    Formalize Python environment setup and toolkit initialization that was previously
    scattered across deployment docs. Provides single source of truth for:
    - Python version validation (3.9+)
    - Dependency installation (23 packages, 5 categories)
    - MCP server bootstrap and health check
    - Pre-commit hook installation for quality gates
    - Comprehensive verification script with reporting

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    CORTEX deployment process lacked formalized environment setup phase.
    Requirements.txt exists but timing/verification path was undefined.
    Setup responsibilities scattered across 2 documentation files with no:
    - Explicit acceptance criteria
    - Automated verification
    - Pre-commit quality gates
    - AC-ID tracking
  
  impact:
    - Onboarding friction (unclear prerequisites)
    - CI/CD gaps (manual verification steps)
    - Governance violations (0% CORE compliance for this flow)
    - Setup failures on distributed teams
  
  gaps_identified:
    - id: "GAP-ENV-001"
      title: "No Python Version Validation"
      current_state: "Implicit requirement (Python 3.9+)"
      severity: "HIGH"
      solution: "AC-ENV-SETUP-001-01 - Explicit validation with clear error messages"
    
    - id: "GAP-ENV-002"
      title: "No Dependency Verification"
      current_state: "Manual pip install, no verification post-install"
      severity: "HIGH"
      solution: "AC-ENV-SETUP-002-01 - Validate all 23 packages installed correctly"
    
    - id: "GAP-ENV-003"
      title: "No MCP Server Bootstrap"
      current_state: "Server startup untested in deployment"
      severity: "CRITICAL"
      solution: "AC-ENV-SETUP-004-01 - Health check and startup verification"
    
    - id: "GAP-ENV-004"
      title: "No Pre-Commit Quality Gate"
      current_state: "No hook to prevent commits with broken environment"
      severity: "MEDIUM"
      solution: "AC-ENV-SETUP-005-01 - Install and test pre-commit hook"
    
    - id: "GAP-ENV-005"
      title: "Scattered Setup Documentation"
      current_state: "Setup mentioned in 2 docs, no AC-IDs, no phase gate"
      severity: "MEDIUM"
      solution: "PHASE-ENV-SETUP - Consolidated, testable setup phase"

# =============================================================================
# SOLUTION ARCHITECTURE
# =============================================================================

solution_architecture:
  principle: "Infrastructure as Code - Setup is deployable, testable, auditable"
  
  components:
    - name: "Python Environment Validator"
      purpose: "Verify Python 3.9+ installed with required standard library"
      file: "cortex/scripts/verify_environment.py"
      responsibility: "Check Python version, required packages, MCP connectivity"
      features:
        - "Semantic version checking (3.9+ required)"
        - "Detailed error messages with remediation guidance"
        - "JSON output for CI/CD integration"
        - "Exit codes: 0 (pass), 1 (fail), 2 (warn)"
    
    - name: "Pre-Commit Hook"
      purpose: "Gate commits to environments with passing verification"
      file: ".github/hooks/pre-commit"
      responsibility: "Run verification before allowing commits"
      features:
        - "Automatic hook installation during setup"
        - "Graceful failure with helpful error messages"
        - "Can be bypassed with --no-verify (for CI)"
    
    - name: "Dependency Configuration"
      purpose: "Centralized, versioned dependency management"
      file: "requirements.txt"
      responsibility: "Single source of truth for 23 packages (5 categories)"
      structure:
        - "Core: FastAPI, Pydantic, PyYAML (5 packages)"
        - "Data: Pandas, NumPy, scikit-learn (3 packages)"
        - "Testing: pytest, pytest-cov, pytest-asyncio (3 packages)"
        - "Quality: black, isort, mypy, pylint, flake8 (5 packages)"
        - "Development: python-dotenv, click, requests, psutil (4 packages)"
    
    - name: "Test Suite"
      purpose: "Verify all aspects of environment setup"
      file: "tests/unit/infrastructure/test_environment_setup.py"
      responsibility: "53 test cases covering all ACs"
      coverage:
        - "AC-ENV-SETUP-001-01: 8 tests (Python validation)"
        - "AC-ENV-SETUP-002-01: 15 tests (Dependency validation)"
        - "AC-ENV-SETUP-003-01: 12 tests (Dev tools configuration)"
        - "AC-ENV-SETUP-004-01: 10 tests (MCP server bootstrap)"
        - "AC-ENV-SETUP-005-01: 8 tests (Verification & pre-commit)"

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  
  AC-ENV-SETUP-001-01:
    id: "AC-ENV-SETUP-001-01"
    title: "Python 3.9+ Version Validation"
    description: |
      Implement `cortex/scripts/verify_environment.py` with Python version checking.
      Validate sys.version_info >= (3, 9, 0) with clear error messages.
      Support multiple Python installations (via PATH detection).
    
    requirements:
      - "Python 3.9 or higher required"
      - "Detect installed version using sys.version_info"
      - "Provide clear error message if version too old"
      - "Return exit code 0 on success, 1 on failure"
      - "Support JSON output for CI/CD integration"
    
    test_file: "tests/unit/infrastructure/test_environment_setup.py"
    test_count: 8
    test_cases:
      - "test_python_version_valid_39"
      - "test_python_version_valid_310"
      - "test_python_version_valid_311"
      - "test_python_version_check_too_old_38"
      - "test_python_version_check_too_old_27"
      - "test_version_output_json_format"
      - "test_version_output_human_readable"
      - "test_version_exit_code_success"
    
    acceptance_definition: |
      Script validates Python version and:
      ✓ Returns exit code 0 when Python >= 3.9
      ✓ Returns exit code 1 when Python < 3.9
      ✓ Provides actionable error message for old versions
      ✓ Supports both human-readable and JSON output
      ✓ Detects version without external dependencies
    
    governance_alignment:
      - "CORE-008: Tests written first (BEFORE implementation)"
      - "CORE-011: Type hints on all functions (→ str, → int)"
      - "CORE-012: Google docstrings on public functions"
      - "CORE-028: kebab-case filenames (verify-environment.py)"
  
  AC-ENV-SETUP-002-01:
    id: "AC-ENV-SETUP-002-01"
    title: "Dependency Installation & Verification"
    description: |
      Install and verify all 23 dependencies from requirements.txt.
      Validate installation success by importing key packages.
      Check version constraints are satisfied.
      Report on missing or conflicting packages.
    
    requirements:
      - "Install 23 packages from requirements.txt"
      - "Verify import-time availability of key packages"
      - "Check version constraints (requirements.txt format)"
      - "Report version mismatch or import errors"
      - "Provide remediation guidance for each failure"
    
    dependencies:
      - "AC-ENV-SETUP-001-01 (Python 3.9+ already validated)"
    
    test_file: "tests/unit/infrastructure/test_environment_setup.py"
    test_count: 15
    test_cases:
      - "test_all_core_packages_importable"
      - "test_pyyaml_version_gte_6_0_1"
      - "test_pydantic_version_gte_2_5_0"
      - "test_fastapi_version_gte_0_104_0"
      - "test_all_data_packages_importable"
      - "test_pandas_version_gte_2_0_0"
      - "test_numpy_version_gte_1_24_0"
      - "test_all_testing_packages_importable"
      - "test_pytest_version_gte_7_4_0"
      - "test_all_quality_packages_importable"
      - "test_black_version_gte_23_12_0"
      - "test_isort_importable"
      - "test_mypy_importable"
      - "test_missing_package_error_handling"
      - "test_version_mismatch_detection"
    
    acceptance_definition: |
      Dependency verification succeeds when:
      ✓ All 23 packages import successfully
      ✓ All version constraints satisfied (per requirements.txt)
      ✓ Clear error message for any missing/conflicting package
      ✓ Remediation guidance (e.g., "pip install -U pydantic")
      ✓ Exit code 0 on success, 1 on failure
    
    governance_alignment:
      - "CORE-008: Tests written first"
      - "CORE-011: Type hints (→ List[str], → Dict[str, str])"
      - "CORE-012: Google docstrings"
      - "CORE-013: No bare except clauses"
  
  AC-ENV-SETUP-003-01:
    id: "AC-ENV-SETUP-003-01"
    title: "Development Tools Configuration"
    description: |
      Configure black, isort, mypy, pylint, flake8 for project consistency.
      Verify tool configuration files exist (.flake8, mypy.ini, etc).
      Test that tools can be invoked successfully.
    
    requirements:
      - "Configure black (line length 88, target Python 3.9+)"
      - "Configure isort (import sorting, skip venv)"
      - "Configure mypy (strict mode, ignore missing imports)"
      - "Configure pylint (max line length 88)"
      - "Configure flake8 (max line length 88, ignore specific rules)"
      - "Verify all tools can be executed (not just installed)"
    
    test_file: "tests/unit/infrastructure/test_environment_setup.py"
    test_count: 12
    test_cases:
      - "test_black_installed_and_callable"
      - "test_isort_installed_and_callable"
      - "test_mypy_installed_and_callable"
      - "test_pylint_installed_and_callable"
      - "test_flake8_installed_and_callable"
      - "test_black_format_validation"
      - "test_isort_check_validation"
      - "test_mypy_type_check_validation"
