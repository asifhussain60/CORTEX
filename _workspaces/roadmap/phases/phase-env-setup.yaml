      ✓ Server handles shutdown without errors
      ✓ Startup takes < 5 seconds
    
    governance_alignment:
      - "CORE-008: Tests written first"
      - "CORE-011: Type hints (→ bool, → MCP.HealthStatus)"
      - "CORE-012: Docstrings"
  
  AC-ENV-SETUP-005-01:
    id: "AC-ENV-SETUP-005-01"
    title: "Verification Script & Pre-Commit Hook Integration"
    description: |
      Create comprehensive verification script that runs all checks.
      Install pre-commit hook that gates commits to passing environment.
      Generate detailed report with pass/fail status per check.
      Support CI/CD integration via exit codes and JSON output.
    
    requirements:
      - "Comprehensive verification script (verify_environment.py)"
      - "Runs all checks: Python version, dependencies, tools, MCP"
      - "Pre-commit hook invokes verification script"
      - "Commit blocked if environment fails verification"
      - "Clear error reporting for each failed check"
      - "JSON output for CI/CD automation"
      - "Installation script for pre-commit hook"
    
    dependencies:
      - "AC-ENV-SETUP-001-01 through AC-ENV-SETUP-004-01"
    
    test_file: "tests/unit/infrastructure/test_environment_setup.py"
    test_count: 8
    test_cases:
      - "test_verification_script_exists"
      - "test_verification_script_all_checks"
      - "test_verification_script_exit_code_pass"
      - "test_verification_script_exit_code_fail"
      - "test_verification_script_json_output"
      - "test_precommit_hook_installation"
      - "test_precommit_hook_blocks_bad_commits"
      - "test_precommit_hook_allows_good_commits"
    
    acceptance_definition: |
      Verification automation complete when:
      ✓ Single command runs all environment checks
      ✓ Pre-commit hook installed and active
      ✓ Commits blocked if verification fails
