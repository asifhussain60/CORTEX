# REMEDIATION-INTENT-VALIDATION-INTEGRATION Phase Specification
# Version: 1.0
# Date: 2026-01-23
# Authority: cortex-total-recall.prompt.md + cortex-5.5 archive analysis
# Status: NOT_STARTED

metadata:
  phase_id: "REMEDIATION-INTENT-VALIDATION-INTEGRATION"
  title: "Per-Turn Intent Validation Architecture Integration"
  description: |
    Integrate confidence-driven, multi-turn intent validation architecture from CORTEX-5.5
    archive branch into current CORTEX system. Restore per-turn comprehension workflows,
    challenge injection, and governance validation. Wire 8 core components via wiring harness.
  sequence: 7
  priority: "P1-CRITICAL"
  required: true
  track: "all"
  estimated_effort: "40-50 hours (5-6 days)"
  blocking: false
  estimated_start: "2026-02-15"
  estimated_completion: "2026-02-25"

phase_overview:
  problem_statement: |
    Current CORTEX architecture lacks per-turn intent validation. CORTEX-5.5 archive
    contained comprehensive intent validation system:
    - ComprehensionSession for tracking multi-turn approvals
    - ChallengeGenerator for proactive risk identification
    - Confidence-based routing with caution flags
    - Turn-by-turn governance validation
    - Challenge-first response injection
    
    This phase restores that capability by integrating 8 key components into the
    current 4-stage orchestration pipeline, wiring them via the wiring harness inventory,
    and achieving ≥90% confidence accuracy on multi-turn conversations.
  
  success_definition: |
    1. All 8 components integrated into appropriate pipeline stages
    2. Confidence-driven routing gates properly functioning
    3. Challenge injection working end-to-end
    4. Per-turn governance validation active
    5. Wiring harness auto-discovery finding all components
    6. Multi-turn test suite passing (16 integration tests)
    7. Overall governance compliance ≥95%
    8. 100% test pass rate (154/154 tests)
  
  key_metrics:
    - Multi-turn intent validation accuracy: ≥90%
    - Challenge identification precision: ≥95%
    - Confidence scoring accuracy: ±5% of baseline
    - Governance compliance: ≥95% (TIER 0-2)
    - Test pass rate: 100% (154/154)
    - Component discovery rate: 100% (8/8)

components_to_integrate:
  - component_id: 1
    name: "ComprehensionSession"
    category: "State Machine"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/comprehension_loop.py"
    current_location: "cortex/orchestrators/core/comprehension_session.py (to create)"
    integration_point: "Stage 1 - MasterOrchestrationStage1 output"
    priority: "CRITICAL-0"
    hours_estimate: 8
    description: |
      Multi-turn session tracker with approval workflows. Tracks:
      - session_id, created_at
      - knowledge_graph reference
      - current_comprehension (ComprehensionYAML)
      - approval_status (PENDING, APPROVED, REJECTED, NEEDS_CLARIFICATION)
      - revision_count and revision_history
      - target_tier for knowledge storage
      - temp_files list for cleanup
      - approval_timestamp and rejection_reason
    
    key_methods:
      - __init__(): Initialize session with UUID
      - record_revision(): Add comprehension revision
      - set_approval_status(): Update status (PENDING→APPROVED/REJECTED)
      - get_revision_history(): Retrieve iterations
      - cleanup_temp_files(): Cleanup on completion
    
    test_expectations: "24 tests covering state transitions, revisions, approval workflows"
    dependencies: ["ComprehensionYAML", "EnhancedAuditLogger"]
  
  - component_id: 2
    name: "ChallengeGenerator"
    category: "Risk Analyzer"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/challenge_generator.py"
    current_location: "cortex/orchestrators/challenge_generator.py (to create)"
    integration_point: "Stage 3 - Knowledge Integration (before execution)"
    priority: "CRITICAL-1"
    hours_estimate: 6
    description: |
      Proactive risk identification system. Detects:
      - BREAKING_CHANGE: Interface/contract changes
      - TEST_GAP: Missing test coverage
      - GOVERNANCE_RISK: Tier 0-2 rule violations
      - HISTORICAL_ISSUE: Known problematic patterns
      - PERFORMANCE_RISK: O(n²) algorithms, N+1 queries
      - SECURITY_RISK: eval(), pickle.load, etc.
      
      Outputs Challenge objects sorted by severity (CRITICAL>HIGH>MEDIUM>LOW)
    
    key_classes:
      - Challenge: category, severity, description, affected_scope, evidence, mitigation, line_number, confidence
      - ChallengeCategory: Enum for 6 categories
      - Severity: Enum for 4 levels
    
    key_methods:
      - generate_all(): Analyze source and produce challenges (takes source, context, changes, historical_issues)
      - analyze_governance(): Check dangerous patterns, docstrings
      - analyze_performance(): Detect anti-patterns
      - analyze_coverage(): Check test gaps
      - analyze_changes(): Breaking change detection
      - check_historical_issues(): Pattern matching against known issues
    
    test_expectations: "28 tests covering all challenge categories, severity sorting, evidence quality"
    dependencies: ["ast module", "re module", "GovernanceRegistry"]
  
  - component_id: 3
    name: "ConfidenceRouter"
    category: "Routing Enhancement"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/intent_router.py"
    current_location: "cortex/intent_router/confidence_router.py (to create)"
    integration_point: "Stage 2 - IntentRouter enhancement"
    priority: "CRITICAL-2"
    hours_estimate: 10
    description: |
      Confidence-based routing gates. Routes based on thresholds:
      - ≥0.85: High confidence - auto-route to appropriate handler (no caution)
      - 0.70-0.84: Medium confidence - route with caution_flag=True
      - <0.70: Low confidence - reroute to INTERACTION for clarification
      
      Special case: QUERY/ANALYZE always route to DIRECT_RESPONSE (safe operations)
    
    key_thresholds:
      - CONFIDENCE_HIGH: 0.85
      - CONFIDENCE_MEDIUM_LOW: 0.70
    
    key_methods:
      - apply_confidence_rules(): Decision tree for routing based on confidence
      - get_routing_reason(): Human-readable explanation
      - validate_routing_decision(): Post-routing validation
    
    integration_notes: |
      Enhances existing IntentRouter class, not replacement.
      Adds confidence_score parameter to routing decision.
      Adds caution_flag to RoutingDecision.
    
    test_expectations: "35 tests covering all confidence thresholds, caution flag logic, intent types"
    dependencies: ["IntentRouter", "CanonicalizedIntent", "RoutingDecision"]
  
  - component_id: 4
    name: "TurnValidationGate"
    category: "Governance Integration"
    archive_location: "archive/CORTEX-5.5:cortex/orchestrators/core/master_orchestrator.py (_turn_number tracking)"
    current_location: "cortex/orchestrators/turn_validation_gate.py (to create)"
    integration_point: "ConversationProtocol.execute_turn() lifecycle"
    priority: "HIGH-3"
    hours_estimate: 8
    description: |
      Per-turn governance validation middleware. Executes at turn boundaries:
      - Before comprehension: Validate previous turn context
      - After routing: Validate routing decision against governance
      - Before execution: Block on TIER 0 violations, escalate TIER 1-2
      
      Extends GovernanceRegistry with turn context awareness.
    
    key_features:
      - turn_number tracking through entire pipeline
      - TIER 0 rule evaluation per turn
      - Blocking on violations (blocks execution)
      - Escalation of warnings (logs but allows execution)
      - Context pass-through for audit trail
    
    key_methods:
      - validate_turn_pre_comprehension(): Pre-turn checks
      - validate_turn_post_routing(): Routing decision validation
      - validate_turn_pre_execution(): Final gate before execution
      - get_turn_context(): Extract turn-specific context
    
    test_expectations: "18 tests covering validation lifecycle, TIER enforcement, escalation logic"
    dependencies: ["GovernanceRegistry", "ConversationProtocol", "EnhancedAuditLogger"]
  
  - component_id: 5
    name: "ComprehensionYAML"
    category: "Data Structure"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/comprehension_yaml.py"
    current_location: "cortex/orchestrators/comprehension_yaml.py (to create)"
    integration_point: "Stage 1 - Output data structure"
    priority: "HIGH-4"
    hours_estimate: 4
    description: |
      YAML-serializable representation of comprehension output. Structure:
      - metadata: version, generated_at, tool, phase, schema
      - intent: IntentSection (type, scope, confidence, keywords)
      - challenges: ChallengeSection (list of ChallengeItem)
      - recommendations: RecommendationSection (list of RecommendationItem)
    
    key_classes:
      - ComprehensionYAML: Main container
      - IntentSection: intent_type, scope, confidence, keywords
      - ChallengeSection: challenges[], summary
      - ChallengeItem: category, severity, description, mitigation
      - RecommendationSection: recommendations[], confidence
      - RecommendationItem: title, description, priority, evidence
    
    key_methods:
      - to_dict(): Convert to dictionary for YAML serialization
      - to_yaml(): Generate YAML string
      - from_dict(): Deserialize from dictionary
      - validate(): Validate structure
    
    test_expectations: "15 tests covering serialization, deserialization, validation"
    dependencies: ["yaml module", "dataclasses module"]
  
  - component_id: 6
    name: "CautionFlagMechanism"
    category: "Routing Enhancement"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/intent_router.py (confidence gates)"
    current_location: "cortex/intent_router/routing_decision.py (enhancement)"
    integration_point: "Stage 2 - RoutingDecision object"
    priority: "MEDIUM-5"
    hours_estimate: 4
    description: |
      Flags medium-confidence (0.70-0.84) routing decisions for elevated scrutiny.
      Caution flag tells downstream handlers to:
      - Include reasoning in response
      - Request confirmation before proceeding
      - Log for audit trail
      - Enable operator override
    
    key_features:
      - caution_flag: bool attribute on RoutingDecision
      - confidence_score: float (0.0-1.0)
      - routing_reason: Human-readable explanation
    
    test_expectations: "10 tests covering caution flag propagation, operator overrides"
    dependencies: ["RoutingDecision", "ConversationProtocol"]
  
  - component_id: 7
    name: "ResponseChallengeInjector"
    category: "Response Processing"
    archive_location: "archive/CORTEX-5.5:cortex/brain/core/intent/ (comprehension loop pattern)"
    current_location: "cortex/orchestrators/response_challenge_injector.py (to create)"
    integration_point: "Stage 4 - Response formatting (before user output)"
    priority: "HIGH-6"
    hours_estimate: 6
    description: |
      Injects challenges and recommendations into final response. Order:
      1. Header (CORE-029 formatted)
      2. Operation summary
      3. Challenges (sorted by severity, CRITICAL first)
      4. Recommendations (confidence-weighted)
      5. User approval request (if challenges present)
      6. Execution output (if approved)
      7. Copyright footer
      
      Challenges presented BEFORE execution, not after.
    
    key_features:
      - challenges_dismissible: User can acknowledge and proceed
      - challenges_logged: All dismissed challenges logged for governance
      - approval_workflow: Multi-turn context for challenge approval
      - conditional_execution: Block on CRITICAL challenges, warn on HIGH
    
    key_methods:
      - inject_challenges(): Add challenges to response
      - format_challenge_section(): Pretty-print challenges
      - format_recommendation_section(): Pretty-print recommendations
      - get_user_approval(): Interactive approval (for CLI) or logged (for API)
    
    test_expectations: "15 tests covering injection, formatting, approval workflows"
    dependencies: ["ResponseHeaderInjector", "ConversationProtocol", "EnhancedAuditLogger"]
  
  - component_id: 8
    name: "WiringHarnessIntegration"
    category: "Auto-Discovery"
    archive_location: "cortex/testing/wiring_harness_inventory.py (existing)"
    current_location: "cortex/testing/wiring_harness_inventory.py (enhancement)"
    integration_point: "TotalRecallAgent initialization"
    priority: "MEDIUM-7"
    hours_estimate: 4
    description: |
      Register all 8 components in wiring_harness_inventory.py with:
      - Entry point paths for auto-import
      - Initialization code for each component
      - Wiring priority (CRITICAL-0 through MEDIUM-7)
      - Dependencies and hook points
      - Test file references
      
      Components auto-wired when TotalRecallAgent initializes.
    
    key_registrations:
      1. ComprehensionSession: CRITICAL-0, Stage 1
      2. ChallengeGenerator: CRITICAL-1, Stage 3
      3. ConfidenceRouter: CRITICAL-2, Stage 2
      4. TurnValidationGate: HIGH-3, ConversationProtocol
      5. ComprehensionYAML: HIGH-4, Stage 1 output
      6. CautionFlagMechanism: MEDIUM-5, RoutingDecision
      7. ResponseChallengeInjector: HIGH-6, Stage 4
      8. WiringHarnessIntegration: MEDIUM-7, TotalRecallAgent
    
    test_expectations: "12 tests covering discovery, initialization, wiring validation"
    dependencies: ["wiring_harness_inventory", "TotalRecallAgent"]

