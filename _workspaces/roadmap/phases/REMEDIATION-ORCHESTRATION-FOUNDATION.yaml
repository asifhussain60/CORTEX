gate_criteria:
  - criterion: "Test Pass Rate"
    target: "≥98% (201/201 tests)"
    verification: "pytest tests/unit/orchestrators/test_master_orchestrator_spof_fix.py tests/unit/orchestrators/test_analysis_orchestrator.py tests/unit/orchestrators/test_execution_orchestrator.py -v"
  
  - criterion: "Type Hints Coverage"
    target: "100%"
    verification: "pyright cortex/orchestrators/core/master_orchestrator.py cortex/orchestrators/core/backup_orchestrator.py cortex/orchestrators/core/failover_manager.py cortex/orchestrators/analysis/*.py cortex/orchestrators/execution/*.py cortex/orchestrators/domain/{analysis,execution}_orchestrator.py"
  
  - criterion: "Docstring Coverage"
    target: "100% (Google style)"
    verification: "All public functions have complete Google-style docstrings with Args, Returns, Raises sections"
  
  - criterion: "No Bare Except"
    target: "0 occurrences"
    verification: "grep -r 'except:' cortex/orchestrators/"
  
  - criterion: "MasterOrchestrator Resilience"
    target: "Automatic failover on master failure"
    verification: "Test backup orchestrator takeover in <3 seconds"
  
  - criterion: "IOrchestrator Interface"
    target: "All 3 new orchestrators implement interface"
    verification: "Code review: all required methods implemented with correct signatures"

