---
# REMEDIATION-002: Code Refactoring - Phase 2 (Duplication Elimination)
# Removes identified code duplications from AC-REM-001-06 analysis
# Dependencies: REMEDIATION-001-code-quality-hardening
# Sequence: 10 (follows PHASE-DEPLOYMENT-006-profiles)

phase_metadata:
  phase_id: "REMEDIATION-002"
  phase_name: "Code Refactoring - Phase 2 (Duplication Elimination)"
  track: "ah"
  sequence: 10
  version: "1.0.0"
  created_date: "2026-01-21"
  owner: "cortex-governance"
  status: "PLANNED"
  
phase_governance:
  tier: "TIER-0-CRITICAL"
  compliance_rules:
    - "CORE-008: Test-Driven Development"
    - "CORE-011: Type Hints Required"
    - "CORE-012: Docstrings Required"
    - "CORE-013: Specific Exception Handling"
  approval_required: true
  review_checklist:
    - "All refactorings have corresponding tests"
    - "No regression in existing functionality"
    - "Duplication metrics reduced by target percentages"
    - "New shared modules follow cortex patterns"

phase_objectives:
  primary:
    - "Eliminate 5 identified duplication categories (DUP-001 through DUP-005)"
    - "Consolidate 26 affected files into 5 shared utility modules"
    - "Reduce codebase by 450+ lines of duplicated logic"
    - "Establish reusable patterns for future development"
  secondary:
    - "Improve code maintainability and testability"
    - "Establish pattern libraries for common operations"
    - "Reduce cognitive load for developers"
    - "Standardize error handling and validation approaches"

duplications_to_resolve:
  DUP-001:
    title: "Exception Handler Duplications"
    severity: "CRITICAL"
    category: "Error Handling"
    files_affected: 5
    affected_files:
      - "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
      - "cortex/brain/mcp/tools/validate_consolidation.py"
      - "cortex/infrastructure/connection_pool.py"
      - "cortex/infrastructure/database.py"
      - "cortex/infrastructure/audit_logger.py"
    problem: "Multiple files implement try-except blocks with nearly identical patterns"
    duplication_pattern: |
      try:
          operation()
      except SpecificException as e:
          logging.error(f"Operation failed: {e}")
          [raise/return/continue]
    refactoring_strategy:
      target_module: "cortex/common/exceptions.py"
      approach: "Centralized exception handlers with decorator pattern"
      example: |
        @handle_database_error
        def operation_that_fails():
            # Implementation
            pass
    metrics:
      lines_duplicated: 85
      expected_reduction: 60
      refactor_effort_hours: 4
    acceptance_criteria:
      - "All exception handlers moved to cortex/common/exceptions.py"
      - "Decorator-based pattern implemented and tested"
      - "5 affected files refactored to use decorators"
      - "100% test coverage for exception handlers"

  DUP-002:
    title: "Connection Cleanup Patterns"
    severity: "HIGH"
    category: "Resource Management"
    files_affected: 3
    affected_files:
      - "cortex/infrastructure/connection_pool.py"
      - "cortex/infrastructure/database.py"
      - "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
    problem: "Context manager cleanup logic repeated across connection management code"
    duplication_pattern: |
      with sqlite3.connect(path) as conn:
          cursor = conn.cursor()
          [operation]
          conn.commit()
    refactoring_strategy:
      target_module: "cortex/infrastructure/connection_pool.py"
      approach: "Shared connection context manager with automatic cleanup"
      example: |
        @managed_connection(database_path)
        def perform_operation(cursor):
            cursor.execute(query)
            return result
    metrics:
      lines_duplicated: 62
      expected_reduction: 50
      refactor_effort_hours: 3
    acceptance_criteria:
      - "Shared ConnectionContext class created"
      - "Automatic cleanup for all resource types (cursor, conn, transaction)"
      - "3 affected files refactored to use ConnectionContext"
      - "Database tests pass with context manager pattern"

  DUP-003:
    title: "Health Check Logic"
    severity: "MEDIUM"
    category: "Monitoring"
    files_affected: 4
    affected_files:
      - "cortex/infrastructure/health_check.py (base implementation)"
      - "cortex/core/state/governance.py"
      - "cortex/orchestrators/master.py"
      - "cortex/devx/environment_validator.py"
    problem: "Health check implementations follow similar pattern but not unified"
    duplication_pattern: |
      def check_component_health():
          try:
              test_operation()
              return True
          except Exception:
              return False
    refactoring_strategy:
      target_module: "cortex/infrastructure/health_check.py"
      approach: "Generic HealthChecker base class with composable checks"
      example: |
        class ComponentHealthCheck(HealthChecker):
            def validate(self):
                # Implementation
                return self.is_healthy()
    metrics:
      lines_duplicated: 78
      expected_reduction: 45
      refactor_effort_hours: 3
    acceptance_criteria:
      - "HealthChecker base class with standardized interface"
      - "4 health check implementations refactored to inherit from base"
      - "Composable health checks for complex scenarios"
      - "All health check tests passing"

  DUP-004:
    title: "File I/O Operations"
    severity: "MEDIUM"
    category: "File Operations"
    files_affected: 6
    affected_files:
      - "cortex/brain/mcp/tools/validate_consolidation.py"
      - "cortex/config/loader.py"
      - "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
      - "cortex/observability/analytics.py"
      - "cortex/infrastructure/audit_logger.py"
      - "cortex/testing/test_runner.py"
    problem: "File read/write operations repeated without centralization"
    duplication_pattern: |
      with open(file_path, 'r') as f:
          data = f.read()
      # Manual parsing/processing
    refactoring_strategy:
      target_module: "cortex/common/file_utils.py (NEW)"
      approach: "Centralized file utility module with type-safe operations"
      example: |
        class FileOperations:
            @staticmethod
            def read_yaml(path) -> dict:
                # Unified YAML reading with error handling
                pass
    metrics:
      lines_duplicated: 120
      expected_reduction: 65
      refactor_effort_hours: 4
    acceptance_criteria:
      - "cortex/common/file_utils.py created with 8+ utility methods"
      - "Type hints for all file operations"
      - "6 affected files refactored to use FileOperations"
      - "100% coverage for file operation tests"

  DUP-005:
    title: "Validation Patterns"
    severity: "LOW"
    category: "Data Validation"
    files_affected: 8
    affected_files:
      - "cortex/config/validator.py"
      - "cortex/core/state/validator.py"
      - "cortex/brain/mcp/validator.py"
      - "cortex/orchestrators/validator.py"
      - "cortex/testing/validation_runner.py"
      - "cortex/devx/environment_validator.py"
      - "cortex/tools/toolkit/validator.py"
      - "cortex/infrastructure/health_check.py"
    problem: "Validation logic (type checking, format validation, range checks) repeated"
    duplication_pattern: |
      if not value or not isinstance(value, ExpectedType):
          logging.error(f"Invalid {field}: expected {ExpectedType}")
          return False
    refactoring_strategy:
      target_module: "cortex/common/validators.py"
      approach: "Declarative validation schema with composable validators"
      example: |
        @field_validator("database_url", mode="before")
        def validate_db_url(v):
            # Unified validation logic
            return v
    metrics:
      lines_duplicated: 135
      expected_reduction: 40
      refactor_effort_hours: 5
    acceptance_criteria:
      - "cortex/common/validators.py created with validator decorators"
      - "8 affected files refactored to use validators"
      - "Support for custom validation messages"
      - "All validation tests passing"

refactoring_phases:
  REMEDIATION-002-PHASE-A:
    phase_name: "Critical Exception & Connection Refactoring"
    duration_weeks: 2
    duplications_addressed: ["DUP-001", "DUP-002"]
    total_effort_hours: 7
    sequence: 1
    objectives:
      - "Consolidate exception handlers and connection cleanup patterns"
      - "Establish decorator-based patterns for resource management"
    deliverables:
      - "cortex/common/exceptions.py (enhanced with decorators)"
      - "cortex/infrastructure/connection_pool.py (shared context manager)"
      - "tests/test_rem_002_01_exception_consolidation.py"
      - "tests/test_rem_002_02_connection_refactoring.py"
    dependencies:
      - "REMEDIATION-001 completion"
    acceptance_criteria:
      - "All exception decorators implemented and tested"
      - "Connection context managers unified"
      - "0% regression in database tests"
      - "Code coverage > 95%"

  REMEDIATION-002-PHASE-B:
    phase_name: "Health Check & File I/O Consolidation"
    duration_weeks: 2
    duplications_addressed: ["DUP-003", "DUP-004"]
    total_effort_hours: 7
    sequence: 2
    objectives:
      - "Unify health check implementations"
      - "Create centralized file utility module"
    deliverables:
      - "cortex/infrastructure/health_check.py (refactored)"
      - "cortex/common/file_utils.py (NEW)"
      - "tests/test_rem_002_03_health_check_consolidation.py"
      - "tests/test_rem_002_04_file_utils_centralization.py"
    dependencies:
      - "REMEDIATION-002-PHASE-A completion"
    acceptance_criteria:
      - "Health check base class implemented"
      - "File utility module with 8+ functions"
      - "All existing health checks refactored"
      - "Code coverage > 90%"

  REMEDIATION-002-PHASE-C:
    phase_name: "Validation Pattern Consolidation"
    duration_weeks: 2
    duplications_addressed: ["DUP-005"]
    total_effort_hours: 5
    sequence: 3
    objectives:
      - "Consolidate validation patterns into reusable validators"
      - "Establish validation as cross-cutting concern"
    deliverables:
      - "cortex/common/validators.py (NEW)"
      - "tests/test_rem_002_05_validation_consolidation.py"
      - "Documentation: validation patterns guide"
    dependencies:
      - "REMEDIATION-002-PHASE-B completion"
    acceptance_criteria:
      - "Validator module with 10+ decorator patterns"
      - "8 affected files refactored"
      - "Custom validation messages supported"
      - "Code coverage > 90%"

new_shared_modules:
  - path: "cortex/common/file_utils.py"
