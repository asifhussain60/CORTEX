# CORTEX Implementation Phase: Template Content Library
# Phase ID: impl-arch-020-template-content
# Priority: P2
# Date: 2026-01-20

metadata:
  phase_id: "impl-arch-020-template-content"
  title: "Template Content - Pre-built Scaffolds"
  description: "Library of production-ready templates for common patterns"
  priority: "P2"
  estimated_effort: "3-5 days"
  status: "NOT_STARTED"
  locked: false

objective:
  summary: "Provide comprehensive template library for rapid development"
  business_value: "Enables one-command scaffolding, ensures best practices, reduces ramp-up time"

acceptance_criteria:
  - id: "TEMPLATE-CONTENT-001-01"
    description: "Module templates for common patterns"
    verification:
      - "Templates for: pure function, class, orchestrator, analyzer, validator"
      - "Each template follows CORTEX conventions"
      - "Type hints and docstrings included"
      - "Test template included"
      - "Example usage in template"
    tests:
      - "test_template_module_pure_function()"
      - "test_template_module_class()"
      - "test_template_module_orchestrator()"

  - id: "TEMPLATE-CONTENT-001-02"
    description: "Test templates for common scenarios"
    verification:
      - "Unit test template with fixtures"
      - "Integration test template with mocking"
      - "Parametrized test template"
      - "Performance test template"
      - "Security test template"
    tests:
      - "test_template_test_unit()"
      - "test_template_test_integration()"
      - "test_template_test_performance()"

  - id: "TEMPLATE-CONTENT-001-03"
    description: "API templates for common endpoints"
    verification:
      - "REST endpoint template"
      - "GraphQL query template"
      - "MCP tool template"
      - "Error handling template"
      - "Validation template"
    tests:
      - "test_template_api_rest()"
      - "test_template_api_error_handling()"

  - id: "TEMPLATE-CONTENT-001-04"
    description: "Configuration templates"
    verification:
      - "YAML configuration template"
      - "Environment variables template"
      - "Secrets management template"
      - "Feature flags template"
      - "Logging configuration template"
    tests:
      - "test_template_config_yaml()"
      - "test_template_config_secrets()"

  - id: "TEMPLATE-CONTENT-001-05"
    description: "Documentation templates"
    verification:
      - "Module documentation template"
      - "API reference template"
      - "Getting started guide template"
      - "Architecture decision record template"
      - "Troubleshooting guide template"
    tests:
      - "test_template_doc_module()"
      - "test_template_doc_api_reference()"

  - id: "TEMPLATE-CONTENT-001-06"
    description: "Deployment templates"
    verification:
      - "Docker container template"
      - "Kubernetes manifest template"
      - "GitHub Actions workflow template"
      - "Terraform infrastructure template"
      - "Monitoring setup template"
    tests:
      - "test_template_deploy_docker()"
      - "test_template_deploy_kubernetes()"

implementation:
  template_library:
    module_templates:
      - pure_function.py.jinja2
      - class.py.jinja2
      - orchestrator.py.jinja2
      - analyzer.py.jinja2
      - validator.py.jinja2
    
    test_templates:
      - unit_test.py.jinja2
      - integration_test.py.jinja2
      - parametrized_test.py.jinja2
      - performance_test.py.jinja2
      - security_test.py.jinja2
    
    api_templates:
      - rest_endpoint.py.jinja2
      - graphql_query.py.jinja2
      - mcp_tool.py.jinja2
    
    config_templates:
      - cortex.yaml.jinja2
      - .env.jinja2
      - secrets.yaml.jinja2
    
    doc_templates:
      - module_readme.md.jinja2
      - api_reference.md.jinja2
      - adr.md.jinja2
    
    deploy_templates:
      - Dockerfile.jinja2
      - kubernetes.yaml.jinja2
      - github_actions.yaml.jinja2

  files_to_create:
    - path: "cortex/tools/templates/library/__init__.py"
      loc: 50
    
    - path: "cortex/tools/templates/library/module_templates/"
      loc: 500
      files: 5
    
    - path: "cortex/tools/templates/library/test_templates/"
      loc: 400
      files: 5
    
    - path: "cortex/tools/templates/library/api_templates/"
      loc: 300
      files: 3
    
    - path: "cortex/tools/templates/library/config_templates/"
      loc: 200
      files: 3
    
    - path: "cortex/tools/templates/library/doc_templates/"
      loc: 300
      files: 3
    
    - path: "cortex/tools/templates/library/deploy_templates/"
      loc: 300
      files: 3
    
    - path: "tests/unit/tools/templates/test_content.py"
      loc: 150
      test_count: 12

governance:
  compliance:
    - "CORE-008: TDD"
    - "CORE-011: Type hints"

testing_strategy:
  unit_tests: 12
  content_validation: 18

dependencies:
  requires:
    - "impl-arch-019-template-tools"

success_metrics:
  - "All templates follow CORTEX conventions 100%"
  - "Template-generated code passes linting"
  - "Coverage library: 15+ templates"
