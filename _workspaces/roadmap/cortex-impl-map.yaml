  in_progress:
    count: 4
    phases:
      - id: "PHASE-CONV-PROTOCOL-001"
        title: "Conversation Protocol Production Enhancement"
        track: "win"
        priority: "P0-CRITICAL"
        estimated_effort: "6-8 hours"
        status: "NOT_STARTED"
        blocking: true
        dependencies: []
        category: "CORE_ORCHESTRATION"
        rationale: |
          ConversationProtocol exists (cortex/brain/core/orchestrator/conversation_protocol.py, 1211 lines)
          but is incomplete and not production-ready:
          
          **Current State:**
          - Basic single-turn execution ✅
          - ContinuationDecision integration ✅
          - EventRegistry for terminal events ✅
          - Governance validation hooks ⚠️
          
          **Missing/Incomplete:**
          - Multi-turn conversation state management ❌
          - Conversation history persistence ❌
          - Context aggregation across turns ❌
          - Turn timeout/cancellation handling ⚠️
          - Integration with InteractionOrchestrator ❌
          - Communication protocol pattern enforcement ❌
          - Production observability (metrics, tracing) ⚠️
          
          This phase completes ConversationProtocol to production-ready status,
          enabling proper multi-turn orchestration with state persistence,
          history tracking, and full observability.
        
        current_implementation:
          file: "cortex/brain/core/orchestrator/conversation_protocol.py"
          lines: 1211
          classes:
            - "ConversationProtocol (main executor)"
            - "RoundContext (turn context)"
          features_implemented:
            - "execute_turn() - single turn execution"
            - "ContinuationDecision integration"
            - "EventRegistry terminal event handling"
            - "GovernanceRegistry validation hooks"
            - "Token tracking (max_turns, token_limit)"
            - "DatabaseTransactionManager integration"
          gaps:
            - "No conversation state persistence"
            - "No history aggregation"
            - "No context carryover between turns"
            - "No timeout/cancellation handling"
            - "No metrics/tracing for observability"
            - "No integration tests with orchestrators"
        
        acceptance_criteria:
          - ac_id: "AC-CONV-001-01"
            title: "Conversation State Persistence"
            description: |
              ConversationProtocol persists conversation state:
              - conversation_id: UUID per conversation
              - turn_history: List[RoundContext] with all turns
              - context_state: Dict aggregated across turns
              - created_at, updated_at timestamps
              - Stored in cortex_brain/state/conversations.db
            tests: 12
            files:
              - "cortex/brain/core/orchestrator/conversation_state.py (new)"
              - "tests/unit/orchestrator/test_conversation_state.py"
          
          - ac_id: "AC-CONV-001-02"
            title: "Context Aggregation and Carryover"
            description: |
              Aggregate context across turns:
              - Previous outputs feed into next turn's context
              - User corrections/feedback integrated
              - Orchestrator state preserved between turns
              - Supports "remember what I said 3 turns ago" queries
            tests: 10
            files:
              - "cortex/brain/core/orchestrator/context_aggregator.py (new)"
              - "tests/unit/orchestrator/test_context_aggregation.py"
          
          - ac_id: "AC-CONV-001-03"
            title: "Turn Timeout and Cancellation"
            description: |
              Handle turn timeouts and user cancellation:
              - Per-turn timeout (default: 300s)
              - User cancellation via signal/event
              - Graceful cleanup on timeout
              - Audit trail for incomplete turns
            tests: 8
            files:
              - "cortex/brain/core/orchestrator/turn_timeout.py (new)"
              - "tests/unit/orchestrator/test_turn_timeout.py"
          
          - ac_id: "AC-CONV-001-04"
            title: "InteractionOrchestrator Integration"
            description: |
              ConversationProtocol integrates with InteractionOrchestrator:
              - InteractionOrchestrator wraps ConversationProtocol
              - Communication patterns enforced per turn
              - Protocol violations logged and alerted
              - Full round-trip: user input → protocol → orchestrator → response
            tests: 15
            files:
              - "cortex/orchestrators/core/interaction_orchestrator.py (enhanced)"
              - "tests/unit/orchestrators/test_interaction_protocol_integration.py"
          
          - ac_id: "AC-CONV-001-05"
            title: "Communication Pattern Enforcement"
            description: |
              Enforce communication patterns from cortex-registry/interaction/:
              - Load pattern definitions (request-response, event-driven, pub-sub)
              - Validate orchestrator compliance with pattern
              - Reject invalid communication flows
              - Audit all pattern violations
            tests: 12
            files:
              - "cortex/brain/core/orchestrator/pattern_enforcer.py (new)"
              - "tests/unit/orchestrator/test_pattern_enforcement.py"
          
          - ac_id: "AC-CONV-001-06"
            title: "Production Observability"
            description: |
              Full observability for conversation protocol:
              - Metrics: turn_duration, turns_per_conversation, cancellation_rate
              - Tracing: correlation_id per conversation, span per turn
              - Structured logging: conversation_id, turn_number, orchestrator_name
              - Dashboards: conversation health, turn performance, error rates
            tests: 10
            files:
              - "cortex/brain/core/orchestrator/conversation_metrics.py (new)"
              - "tests/unit/orchestrator/test_conversation_observability.py"
          
          - ac_id: "AC-CONV-001-07"
            title: "Integration Testing with Real Orchestrators"
            description: |
              End-to-end integration tests:
              - ConversationProtocol + MasterOrchestrator (5 turns)
              - ConversationProtocol + PlanningOrchestrator (3 turns)
              - ConversationProtocol + InteractionOrchestrator (multi-turn dialogue)
              - Verify state persistence, context carryover, timeout handling
            tests: 18
            files:
              - "tests/integration/test_conversation_protocol_e2e.py"
        
        implementation_plan:
          step_1_state_persistence:
            title: "Implement Conversation State Persistence"
            duration: "2 hours"
            tasks:
              - "Create ConversationState dataclass with DB schema"
              - "Implement save/load to conversations.db"
              - "Add conversation_id UUID generation"
              - "Integrate with ConversationProtocol.execute_turn()"
          
          step_2_context_aggregation:
            title: "Implement Context Aggregation"
            duration: "1.5 hours"
            tasks:
              - "Create ContextAggregator class"
              - "Aggregate previous outputs into next turn context"
              - "Implement context merging strategy"
              - "Test multi-turn context carryover"
          
          step_3_timeout_handling:
            title: "Add Turn Timeout and Cancellation"
            duration: "1 hour"
            tasks:
              - "Implement TurnTimeout wrapper with asyncio.wait_for()"
              - "Add cancellation signal handling"
              - "Graceful cleanup on timeout"
              - "Audit incomplete turns"
          
          step_4_interaction_integration:
            title: "Integrate with InteractionOrchestrator"
            duration: "1.5 hours"
            tasks:
              - "Create InteractionOrchestrator class"
              - "Wrap ConversationProtocol in InteractionOrchestrator"
              - "Implement communication pattern manager"
              - "Test full round-trip flow"
          
          step_5_pattern_enforcement:
            title: "Implement Pattern Enforcement"
            duration: "1 hour"
            tasks:
              - "Create PatternEnforcer class"
              - "Load patterns from cortex-registry/interaction/"
              - "Validate orchestrator compliance"
              - "Audit violations"
          
          step_6_observability:
            title: "Add Production Observability"
            duration: "1 hour"
            tasks:
              - "Add ConversationMetrics class"
              - "Instrument turn_duration, cancellation_rate metrics"
              - "Add correlation_id tracing"
              - "Structured logging with conversation context"
          
          step_7_integration_tests:
            title: "Create E2E Integration Tests"
            duration: "1 hour"
            tasks:
              - "Test ConversationProtocol + MasterOrchestrator"
              - "Test ConversationProtocol + PlanningOrchestrator"
              - "Test ConversationProtocol + InteractionOrchestrator"
              - "Verify all features work end-to-end"
        
        tests_total: 85
        tests_breakdown:
          state_persistence: 12
          context_aggregation: 10
          timeout_handling: 8
          interaction_integration: 15
          pattern_enforcement: 12
          observability: 10
          integration_e2e: 18
        
        verification:
          - "All 85 tests passing"
          - "ConversationProtocol fully production-ready"
          - "State persists across turns"
          - "Context aggregates correctly"
          - "Timeouts and cancellations handled gracefully"
          - "InteractionOrchestrator operational"
          - "Communication patterns enforced"
          - "Full observability (metrics, tracing, logging)"
        
        production_impact:
          before: "Basic single-turn execution, no state persistence, no multi-turn support"
          after: "Full multi-turn conversation management with state, history, timeouts, patterns, observability"
        
        governance_compliance:
          - "CORE-008: TDD - tests written first"
          - "CORE-011: Type hints on all new code"
          - "CORE-012: Google-style docstrings"
          - "CORE-013: Specific exception handling"
          - "CORE-027: Audit trail logging"
      
