          required: true
          machine: "win"
        - phase_id: "impl-e2e-validation"
          sequence: 2
          required: true
          machine: "win"
        - phase_id: "impl-cicd-validation"
          sequence: 3
          required: true
          machine: "win"
        - phase_id: "impl-governance-content"
