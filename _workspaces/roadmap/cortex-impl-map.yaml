  file_naming: "kebab-case, ≤25 chars"
  authority: "Filesystem scan + pytest collection + code analysis"
  update_frequency: "On major implementation changes"
  archive_policy: "Move old versions to _archives/ with timestamp"
  
  rules_documented:
    - "CORE-001: <500 lines per turn"
    - "CORE-008: Tests before code"
    - "CORE-011: All functions typed"
    - "CORE-012: Google docstrings"
    - "CORE-013: No bare except"
    - "CORE-026: Git checkpoints"
    - "CORE-027: Audit trail"
    - "CORE-028: Kebab-case ≤25 chars"
  
  rules_file_missing: true
  rules_file_expected: "cortex_brain/tier0/governance/core-rules.yaml"

