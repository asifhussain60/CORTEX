execution_config:
  autonomous_mode:
    enabled: true
    machine_filtering: true
    silent_execution: true
    no_reports: true
    no_md_files: true
    notification_style: "concise"  # One sentence per phase completion
    auto_advance: true
    
  execution_loop:
    enabled: true
    mode: "continuous"  # Execute ALL phases for machine without pausing
    continue_until: "all_phases_complete_or_blocker"
    max_iterations: 100  # Safety limit to prevent infinite loops
    
  loop_termination:
    - condition: "all_phases_for_machine have status == 'COMPLETED' or 'SKIPPED'"
      action: "output final summary, stop execution"
    - condition: "phase_status == 'BLOCKED' or 'DEPENDENCY_FAILED'"
      action: "output blocker detail, stop execution"
    - condition: "critical_error encountered"
      action: "output error detail, request user intervention"
    
  notification_format: "✓ {phase_id}: {one_sentence_summary} → Next: {next_phase_id}"
  
  forbidden_outputs:
    - "*.md files (except docs/)"
    - "status reports"
    - "completion summaries"
    - "execution logs"
    - "progress reports"
    
  allowed_outputs:
    - "Code files (cortex/, cortex_brain/, tests/)"
    - "YAML updates (cortex-impl-map.yaml status changes)"
    - "Git commits (one per phase)"
    - "Test results (pytest output only)"
    
  machine_tracks:
    mac:
      strategy: "sequential_tdd"
      focus: "Core implementation, test collection fixes, module implementations"
      phases: 
        - phase_id: "impl-export-completion"
          sequence: 1
