metadata:
  title: "CORTEX Implementation Map"
  description: "Truth-based roadmap reflecting actual implementation, tests, MCP exposure + post-review remediation phases (v3.2)"
  project: "CORTEX"
  version: "3.9-machine-autonomous-tracks-synced"
  updated: "2026-01-21T18:50:00Z"
  governance_mode: "STRICT"
  hallucination_remediation: "22 false 'IMPLEMENTED' claims removed per Phase 0 AC-3"
  review_remediation: "Review findings validated: 3 CRITICAL gaps identified, 2 NEW remediation phases created for machine:ah"
  latest_completion: "REMEDIATION-003 Complete: 13/13 tests passing. All machine:ah phases COMPLETED (11/11). Merged with origin/CORTEX."
  sync_date: "2026-01-21T18:50:00Z (after merge from origin)"
  
execution_config:
  autonomous_mode:
    enabled: true
    machine_filtering: true
    silent_execution: true
    no_reports: true
    no_md_files: true
    notification_style: "concise"  # One sentence per phase completion
    auto_advance: true
    
  execution_loop:
    enabled: true
    mode: "continuous"  # Execute ALL phases for machine without pausing
    continue_until: "all_phases_complete_or_blocker"
    max_iterations: 100  # Safety limit to prevent infinite loops
    
  loop_termination:
    - condition: "all_phases_for_machine have status == 'COMPLETED' or 'SKIPPED'"
      action: "output final summary, stop execution"
    - condition: "phase_status == 'BLOCKED' or 'DEPENDENCY_FAILED'"
      action: "output blocker detail, stop execution"
    - condition: "critical_error encountered"
      action: "output error detail, request user intervention"
    
  notification_format: "✓ {phase_id}: {one_sentence_summary} → Next: {next_phase_id}"
  
  eval_track_mode:
    enabled: true
    description: "Silent, autonomous execution for eval track phases"
    machine: "eval"
    execution_style: "silent"
    verbosity: "minimal"  # Only output phase completion lines
    output_per_phase: "single_line_only"
    output_on_error: "error_detail_only"
    no_intermediate_output: true
    no_status_updates: true
    no_progress_reporting: true
    
    implementation_mandate: |
      ✅ REAL IMPLEMENTATIONS REQUIRED - NO MOCKS
      
      ALL eval track phases MUST deliver:
      1. Real code that solves the actual problem (not mock/stub solutions)
      2. Production-ready quality (error handling, logging, type hints, docstrings)
      3. Comprehensive tests that verify real behavior (not just "passes test assertions")
      4. Zero mock implementations - if tests can't be satisfied by real code, redesign tests
      5. Full AC completion - all acceptance criteria truly satisfied
      6. Governance compliance - CORE-001/008/011/012/013/017/026/027 enforced
      
      FORBIDDEN in eval track:
      - Mock objects designed only to pass tests
      - Stub implementations with empty method bodies
      - Hardcoded return values that don't represent real behavior
      - Tests that check for mock presence instead of real functionality
      - Governance rule violations to speed up implementation
      - Incomplete AC implementations
      - Deferred "TODO" work to later phases
    
  forbidden_outputs:
    - "*.md files (except docs/)"
    - "status reports"
    - "completion summaries"
    - "execution logs"
    - "progress reports"
    
  allowed_outputs:
    - "Code files (cortex/, cortex_brain/, tests/)"
    - "YAML updates (cortex-impl-map.yaml status changes)"
    - "Git commits (one per phase)"
    - "Test results (pytest output only)"
    - "Test audit trail (cortex/test_audit_trail.log)"
  
  test_monitoring:
    enabled: true
    audit_plugin: "cortex/testing/pytest_plugin_audit.py"
    audit_log: "cortex/test_audit_trail.log"
    hanging_test_detector: "scripts/detect_hanging_tests.py"
    slow_test_threshold: 3.0  # seconds
    very_slow_threshold: 5.0  # seconds
    usage: "python scripts/detect_hanging_tests.py --threshold 5.0 --top 20"
    note: "Auto-registered via conftest.py - tracks all test performance metrics"
  
  parallel_execution:
    mandatory: true
    command: "pytest -n auto"  # Auto-detect CPU cores
    min_workers: 4
    max_workers: 20  # Cap for stability
    rationale: "ALL tests must support parallel execution for CI/CD efficiency"
    forbidden: "Sequential test execution (-n 0 or no -n flag)"
    exceptions: "None - tests blocking parallel execution must be fixed or removed"

implementation_philosophy:
  core_principle: "COMPLETE PRODUCTION-READY IMPLEMENTATIONS - NOT MINIMAL STUBS"
  authority: "cortex-builder.prompt.md + governance-core-rules"
  
  mandate: |
    ✅ REQUIRED: Complete, production-ready implementations
    ❌ FORBIDDEN: Minimal stubs designed only to pass tests
    
    Every implementation phase MUST deliver:
    1. **Full Feature Completion** - All acceptance criteria fully realized
    2. **Production Quality** - Error handling, logging, metrics, observability
    3. **Type Safety** - 100% type hints (CORE-011)
    4. **Documentation** - Google-style docstrings (CORE-012)
    5. **Safety** - No bare except clauses (CORE-013), secure by default
    6. **Test-Driven** - Tests written BEFORE implementation (CORE-008)
    7. **Governance Compliance** - All CORE-* rules enforced (CORE-017)
    8. **Audit Trail** - AC_START → AC_EXECUTE → AC_COMPLETE logged (CORE-027)
    9. **Git Checkpoints** - Before each major implementation (CORE-026)
    10. **Production Readiness** - Ready for immediate deployment

  anti_pattern_forbidden: |
    ❌ DO NOT CREATE MINIMAL IMPLEMENTATIONS
    
    Example of forbidden approach (PROHIBITED):
    "Now I'll create the ingestion_pipeline module with the minimal implementation 
     needed to pass these tests. Challenge me if you disagree."
    
    This violates:
    - CORE-001: Production quality code only
    - CORE-008: Tests-first approach compromised if implementation is post-hoc stub
    - CORE-017: Strict governance enforcement - minimal implementations bypass safety checks
    - Business requirement: CORTEX is production middleware (not experimental code)
    
  correct_pattern_required: |
    ✅ CREATE COMPLETE IMPLEMENTATIONS
    
    Correct approach (REQUIRED):
    "I will create a complete, production-ready ingestion_pipeline module that:
    - Implements ALL acceptance criteria fully
    - Includes comprehensive error handling and recovery
    - Provides structured logging and observability
    - Has 100% type safety and documentation
    - Passes ≥98% of tests with zero governance violations
    - Is immediately deployable to production"
    
    This satisfies:
    - CORE-001: Maintainable, readable, well-structured code
    - CORE-008: Tests verify actual production behavior
    - CORE-017: All safety and governance rules enforced
    - Business requirement: CORTEX is production-grade software
    
  example_difference:
    minimal_stub_forbidden:
      class_definition: "✗ BulkIngestionPipeline class with empty methods"
      error_handling: "✗ Pass-through, no validation"
      logging: "✗ No logging, no metrics"
      type_hints: "✗ Any types everywhere"
      docstrings: "✗ Minimal or placeholder docs"
      tests: "✗ Mock-based, testing mock behavior not real code"
      production_ready: "✗ Not deployable"
      
    complete_implementation_required:
      class_definition: "✓ Full BulkIngestionPipeline with complete behavior"
      error_handling: "✓ Comprehensive try-catch, validation gates, recovery logic"
      logging: "✓ Structured JSON logs, correlation IDs, PII redaction"
      type_hints: "✓ Explicit types on all params/returns"
      docstrings: "✓ Full Google-style with Args/Returns/Raises"
      tests: "✓ Real integration tests with actual data flows"
      production_ready: "✓ Deployable day 1, handles production edge cases"

  enforcement_mechanism:
    - "All phase files MUST specify complete_implementation: true"
    - "All AC acceptance criteria MUST be fully realized (not stubbed)"
    - "All tests MUST verify production behavior (not mocks)"
    - "Copilot MUST reject minimal stub implementations with this guidance"
    - "Governance audit MUST fail incomplete/stub code on commit"
    
  challenge_protocol:
    enabled: true
    instruction: |
      If an assistant proposes a "minimal implementation to pass tests":
      
      1. **IMMEDIATE CHALLENGE**: "Per cortex-builder.prompt.md, this violates 
         CORE-001 (production quality) and CORE-017 (strict governance). 
         Minimal stubs are forbidden. Implement complete solution instead."
      
      2. **ROOT CAUSE**: Minimal stubs waste time - they require rework after 
         tests fail on real production scenarios
      
      3. **CORRECTION**: Implement full feature with:
         - All AC criteria realized
         - Complete error handling
         - Full observability
         - 100% type safety
         - Production deployment ready
    
  test_validation:
    minimal_implementation_indicator: |
      RED FLAGS for minimal stub implementations:
      - "Pass all tests" but unclear how production will use code
      - Mock-heavy tests that verify mock behavior, not real behavior
      - Missing error handling for production scenarios
      - Empty docstrings or "TODO: implement" comments
      - Type hints with Any or untyped parameters
      - No logging, metrics, or observability
      - No recovery/retry logic
      - Code that only handles happy path
      
    production_ready_indicator: |
      GREEN FLAGS for complete implementations:
      - Tests verify real workflows with actual data flows
      - Error scenarios handled with recovery logic
      - Comprehensive logging with correlation IDs
      - Full type hints with specific types
      - Complete Google-style docstrings
      - Metrics collection for observability
      - Graceful degradation on failures
      - Code handles edge cases and production scenarios
    
  machine_track:
    mac_note: |
      PHASE-E-TDD-IMPLEMENTATION must create COMPLETE modules, not stubs.
      Each module must be production-ready on first commit.
      Tests verify production behavior, not just "passes test assertions".
    
    win_note: |
      All validation phases (E2E, CICD, governance) must test COMPLETE features.
      Stub implementations will fail validation by design.
    
    ah_note: |
      All deployment and governance phases must operate on COMPLETE implementations.
      Stubs will not pass production readiness checks.

  
    machine_tracks:
    mac:
