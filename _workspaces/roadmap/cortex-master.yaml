      \ (governance engine)\n      \u251C\u2500\u2500 .env.example\n      \u2514\u2500\
      \u2500 [CORTEX files]\n\nUSAGE PATTERN:\n  $ cd company-repo\n  $ git clone\
      \ https://github.com/cortex-ai/cortex.git CORTEX\n  $ cd CORTEX\n  $ ./cortex\
      \ init\n  $ cortex dashboard                # Opens dashboard showing parent\
