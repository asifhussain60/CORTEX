  PHASE-21-INTELLIGENT-KNOWLEDGE-PROTOCOL:
    title: "Intelligent Knowledge Protocol: Unified Access, Smart Routing & Bulk Ingestion"
    description: |
      PHASE-21: Implements unified knowledge access layer with intelligent routing,
      change detection, and extensible bulk ingestion pipeline.
      
      PROBLEM STATEMENT:
      - KnowledgeRepository (Technical) and BusinessKnowledgeRepository (Business)
        have similar interfaces but no formal protocol contract
      - MasterOrchestrator queries BOTH backends redundantly (no smart routing)
      - No detection when company knowledge patterns evolve/drift
      - BKIO handles single documents; no bulk ingestion for large datasets
      - Raw data stored without CORTEX-specific optimization
      
      SOLUTION ARCHITECTURE:
      1. KnowledgeProvider Protocol - typing.Protocol for structural subtyping
      2. IntelligentKnowledgeRouter - Query-aware delegation with confidence scoring
      3. ChangeDetectionService - Automatic drift detection and alerting
      4. BulkIngestionPipeline - Scalable data transformation (Intake→Filter→Refine→Store)
      5. RefinementEngine - Optimize data for CORTEX before persistence
      
