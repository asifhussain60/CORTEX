      \ MCP client\n\nSECTION B - Multi-Repo Architecture (3 ACs):\n- AC-DEPLOY-002-01:\
      \ CORTEX operates from isolated folder, reads/modifies parent repo\n- AC-DEPLOY-002-02:\
      \ Context switching between repos\n- AC-DEPLOY-002-03: Shared state management\
      \ (audit trail, cache)\n\nSECTION C - Upgrade & Distribution (2 ACs):\n- AC-DEPLOY-003-01:\
      \ `cortex upgrade` - pull latest from main branch\n- AC-DEPLOY-003-02: Backward-compatible\
      \ versioning & migration\n\nSECTION D - Production Readiness (2 ACs):\n- AC-DEPLOY-004-01:\
      \ Security hardening (no secrets in CORTEX folder)\n- AC-DEPLOY-004-02: Performance\
      \ optimization & resource limits\n\nDEPLOYMENT MODEL:\nParent Repo Structure\
      \ (UNCHANGED except CORTEX/ folder):\n  company-repo/\n  \u251C\u2500\u2500\
