### GAP-IMPORT-AUDIT-001

**Status:** HIGH - Quality & Governance Issue

**Type:** Code Quality Gap

**Description:** Import migration scope unclear; 40+ production modules may need fixing while test threshold is outdated

**Root Cause:**
- test_ac_ar_010_03_imports.py assumes 100% migration required
- Actual design: PARTIAL migration (production only, scripts exempt)
- Test never updated after architecture decision
- Unclear which production modules genuinely need import fixes

**Evidence:**
- 306 old import patterns detected (vs expected <20)
- Distribution: ~140 acceptable (scripts/archives), ~105 concerning (production), ~55 neutral (comments)
- Test failure: False positive from threshold mismatch, not code defect

**Affected Components:**
- Cortex production modules (40+ files)
- Test infrastructure (import test has wrong threshold)

**Remediation:**
- AC-ID: AC-AUDIT-IMPORTS-001
- Title: "Audit Import Patterns in Production Modules"
- Effort: 2-4 hours (categorize, identify fixable)
- Priority: P1-HIGH
- Blocking: MAYBE (depends on audit results)

**Verification Steps:**
1. Categorize 105 concerning production modules:
   - Safe to keep old pattern (architectural decision): ~30 files
   - Should migrate to new pattern: ~40 files
   - Legacy/deprecated code: ~35 files

2. For 40 "should migrate" files:
   - Check if refactoring is required or just import statement change
   - Estimate effort per module
   - Create AC-FIX-IMPORTS-001 if >20 modules need fixing (2-4 hours effort)

3. Update test:
   - Change threshold based on categorization
   - Add file type exclusions (scripts, archives, tests)
   - Update test docstring explaining intentional partial migration

**Integration into cortex-impl-map.yaml:**
```yaml
gaps_addressed:
  - gap_id: "GAP-IMPORT-AUDIT-001"
    severity: "HIGH"
    evidence_grade: "A (95%)"  # Automated scan results
    description: "306 old import patterns detected; unclear which production modules need actual fixing vs. acceptable legacy patterns"
    root_cause: "DESIGN_CLARITY_ISSUE - import strategy changed from total to partial migration"
    affected_ac_ids: ["40+ production modules with old import patterns"]
    affected_tests: ["test_ac_ar_010_03_imports.py - threshold outdated"]
    
    remedy:
      ac_id: "AC-AUDIT-IMPORTS-001"
      title: "Audit and Categorize Import Patterns in Production Modules"
      description: "Analyze 40 concerning modules; identify which need migration vs. acceptable legacy; update test threshold accordingly"
      effort: "2 hours"
      priority: "P1-HIGH"
      blocking_for: ["Production deployment (if critical modules found)", "Import test reliability"]
      depends_on: []
      related_skull_rules: ["CORE-007 (consistent patterns)"]
      issue_id: "ISSUE-IMPORT-MIGRATION"
      secondary_remedies:
        - "AC-MARK-IMPORTS-DEPRECATED: Mark test_ac_ar_010_03_imports.py as @pytest.mark.deprecated (30 min)"
        - "AC-FIX-IMPORTS-CRITICAL: Migrate 20+ critical modules if audit shows needed (4 hours, conditional)"
```

