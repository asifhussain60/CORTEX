metadata:
  investigation_id: "INV-20260121-001"
  investigation_date: "2026-01-21"
  investigation_phase: "PHASE 0.5 - SURGICAL INVESTIGATION"
  
  trigger: "GATE 0B FAILURE (insufficient audit log entries)"
  root_cause_investigation: "Why does test suite not generate audit log entries?"

investigation_findings:

  finding_1_plugin_architecture:
    issue: "Two separate audit logging plugins exist"
    discovery:
      - "cortex/testing/pytest_plugin_audit.py - Test performance auditing (CORTEXTestAuditPlugin)"
      - "cortex/brain/testing/test_audit_logger.py - Governance audit trail (TestAuditLogger)"
      - "Only CORTEXTestAuditPlugin is registered in conftest.py"
    implication: "TestAuditLogger (governance audit) is NOT REGISTERED"
    severity: "HIGH"
    evidence_grade: "A (direct code inspection)"

  finding_2_conftest_registration:
    issue: "conftest.py loads performance auditing plugin, not governance auditing"
    evidence:
      line_28_29: |
        from cortex.testing.pytest_plugin_audit import cortex_test_audit_plugin
        config.pluginmanager.register(cortex_test_audit_plugin, name="cortex_test_audit")
    problem: "cortex_test_audit_plugin is performance metric plugin, not governance audit generator"
    root_cause: "TestAuditLogger from cortex/brain/testing/test_audit_logger.py is never registered"
    severity: "HIGH"
    evidence_grade: "A (direct code inspection)"

  finding_3_governance_audit_disabled:
    issue: "Governance audit trail generation is disabled/not registered"
    evidence:
      - "cortex/brain/testing/test_audit_logger.py has pytest_plugins() function"
      - "But it's NEVER called because plugin not registered"
      - "conftest.py doesn't import or register TestAuditLogger"
    consequence: "AC_START, AC_EXECUTE, AC_COMPLETE entries never generated"
    severity: "CRITICAL"
    evidence_grade: "A (code inspection + test results)"

  finding_4_minimal_audit_entries:
    issue: "Database has only 9 entries instead of expected 2000+"
    evidence:
      - "Database file: cortex_brain/state/governance.db"
      - "Table: audit_log"
      - "Entries: 9 total"
      - "Expected: >= 100 from test execution"
    cause: "TestAuditLogger never registered, tests don't generate audit entries"
    severity: "CRITICAL"
    evidence_grade: "A (SQL query result)"

  finding_5_hash_chain_tests_pass:
    issue: "Hash chain validation tests PASS but audit log empty"
    evidence:
      - "test_hash_chain_validation.py: 7/7 PASSED ✅"
      - "But these tests don't generate entries to audit_log table"
    interpretation: "Hash chain code is CORRECT (no code defect)"
    implication: "Issue is INTEGRATION (plugin not registered), not implementation"
    severity: "LOW (good news - code is sound)"
    evidence_grade: "A (test results + code logic)"

defect_classification:
  defect_type: "INTEGRATION_ISSUE"
  not: "TEST_ARTIFACT (real production code)"
  not: "INCOMPLETE_IMPL (code is implemented correctly)"
  not: "HASH_CALC_BUG (hash chain tests pass)"
  
  root_cause: "TestAuditLogger plugin not registered with pytest"
  affected_component: "tests/conftest.py (plugin registration)"
  severity: "CRITICAL"
  blocking: "YES - Blocks Phase 1 analysis"

remediation_recommendation:
  action: "FIX - Register TestAuditLogger in conftest.py"
  
  fix_steps:
    1: "Update tests/conftest.py to also register TestAuditLogger"
    2: "Add import: from cortex.brain.testing.test_audit_logger import TestAuditLogger"
    3: "Register: config.pluginmanager.register(TestAuditLogger(), name='cortex_audit')"
    4: "Delete governance.db to start fresh"
    5: "Re-run test suite to populate audit_log"
    6: "Verify: sqlite3 ... 'SELECT COUNT(*) FROM audit_log' >= 100"
  
  effort: "15 minutes"
  priority: "P0 - CRITICAL"
  
  ac_fix_id_suggested: "Not needed - configuration issue, not code defect"
  
  timeline: |
    1. Fix conftest.py (2 min)
    2. Delete DB (1 min)
    3. Run tests (10 min)
    4. Verify gates (2 min)

phase_0_decision:
  decision: "FIX AND RETRY"
  rationale: |
    Gate 0B failure is NOT due to:
    - Hash chain code defect (Gate 0C verified PASS)
    - Test isolation issue (Gate 0D verified PASS)
    - Data quality problem (Gate 0A verified PASS)
    
    Gate 0B failure is DUE TO:
    - TestAuditLogger not registered with pytest
    - Integration issue, not code defect
    
    ACTION: Register plugin, regenerate audit log, retry Phase 0
    OUTCOME: All gates will PASS after fix
  
  proceed_to_phase_1: true
  estimated_time_to_completion: "30 minutes (fix + regenerate + verify)"

next_action:
  fix_file: "tests/conftest.py"
  modify_section: "pytest_configure function"
  add_plugin_registration: "TestAuditLogger"
  then: "Retry Phase 0 after regeneration"
