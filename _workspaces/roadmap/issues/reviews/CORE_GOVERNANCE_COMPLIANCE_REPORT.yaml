  CORE-008:
    rule_name: "Test-Driven Development (TDD)"
    rule_description: |
      Tests MUST be written BEFORE implementation.
      Acceptance Criteria:
      - Test files should exist in test directories
      - AC-IDs should be paired with corresponding test files
      - Test file timestamps should precede implementation timestamps
    
    compliance_status: "NON-COMPLIANT"
    severity: "HIGH"
    
    findings:
      total_violations: 19
      compliant_pairs: 11
      implementation_first_patterns: 11
      test_orphans: 8
      
      violation_details:
        - ac_id: "Multiple files across cortex/brain/core"
          issue_type: "Implementation Before Test"
          affected_files: 11
          description: |
            Implementation files were modified after test files were created,
            violating TDD principle. Tests should be created first.
          examples:
            - "cortex/core/orchestrator_base.py"
            - "cortex/infrastructure/audit_hash_chain.py"
            - "cortex/core/governance/audit_immutability.py"
