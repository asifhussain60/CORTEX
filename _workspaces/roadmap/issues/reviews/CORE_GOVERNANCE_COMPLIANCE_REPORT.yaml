  CORE-028:
    rule_name: "No eval/exec on Untrusted Input"
    rule_description: |
      MUST NOT use eval(), exec(), compile(), pickle on untrusted/external input.
      Requirements:
      - eval() calls must have validated/safe inputs only
      - exec() calls must be restricted to trusted templates
      - compile() must not be used with untrusted code
      - pickle must not deserialize untrusted data
      - Dynamic code generation must have input validation
    
    compliance_status: "NON-COMPLIANT"
    severity: "CRITICAL"
    
    findings:
      total_occurrences: 1685
      dangerous_functions_used:
        - eval: 152
        - exec: 1416
        - compile: 97
        - pickle: 5
        - __import__: 14
      
      files_with_dangerous_patterns: 228
      percentage_of_codebase: "34% of source files"
      
      critical_violations:
        - violation_type: "eval() calls"
          count: 152
          severity: "CRITICAL"
          examples:
            - file: "cortex/brain/cli/governance_cli.py"
              line: 221
              context: "eval() used for dynamic rule evaluation"
              risk: "Rule definitions could execute arbitrary code"
            
            - file: "cortex/brain/cli/governance_cli.py"
              line: 364
              context: "eval() for configuration processing"
              risk: "Config files could inject malicious code"
          remediation_examples:
            - "Use ast.literal_eval() for safe data structures"
            - "Use JSON/YAML parsers instead of eval()"
            - "Use yaml.safe_load() instead of yaml.load()"
        
        - violation_type: "exec() calls"
          count: 1416
          severity: "CRITICAL"
          percentage_affected: "~41% of violations"
          examples:
            - file: "cortex/api/endpoints/compliance_metrics.py"
              lines: [46, 50]
              context: "exec() used for dynamic metrics calculation"
              risk: "User-supplied metric expressions could run arbitrary code"
            
            - file: "cortex/api/telemetry/schema.py"
              lines: [110, 112]
              context: "exec() for schema dynamic construction"
              risk: "Schema definitions from untrusted sources execute as code"
            
            - file: "cortex/brain/ci_cd/compliance_gate.py"
              line: 52, 56
              context: "exec() for policy evaluation"
              risk: "Compliance policies could be subverted with injected code"
            
            - file: "cortex/brain/core/audit_required_validator.py"
              lines: [37, 78]
              context: "exec() for validation rule execution"
              risk: "Audit rules could be bypassed with code injection"
          
          remediation_required: "IMMEDIATE"
          remediation_approach: |
            Replace exec() with safer alternatives:
            - Use policy-based approach with allowed operations only
            - Define domain-specific language (DSL) for rules
            - Use AST analysis instead of code execution
            - Implement evaluator with restricted built-ins
        
        - violation_type: "compile() calls"
          count: 97
          severity: "HIGH"
          risk: "Dynamic bytecode compilation allows arbitrary execution"
          remediation: "Use ast.parse() for syntax validation without execution"
        
        - violation_type: "pickle deserialization"
          count: 5
          severity: "CRITICAL"
          examples:
            - "Using pickle.load() on untrusted data"
            - "Deserializing pickled objects from external sources"
          remediation: "Use JSON or protobuf instead of pickle"
        
