  - id: MISSING_FINALLY_BLOCKS_001
    issue_type: "Incomplete Resource Cleanup"
    severity: "HIGH"
    files:
      - path: "cortex/infrastructure/connection_pool.py"
        lines: [340, 350]
        context: |
          Context manager yields connection but cleanup only in finally.
          If yield raises, finally executes but original exception may be lost.
      - path: "tests/unit/test_folder_structure_design.py"
        lines: [85]
        context: "File operation without explicit finally block"
    impact: |
      Connections may not be properly returned to pool.
      File handles may leak under exception conditions.
    suggested_fix: |
      Ensure finally block always executes:
      
      @contextmanager
      def connection(self, timeout: Optional[float] = None):
          conn = self.acquire(timeout=timeout)
          try:
              yield conn
          except Exception:
              # Mark connection as potentially unhealthy
              try:
                  self._health_check(conn)
              except Exception:
                  self.release(conn, unhealthy=True)
              raise
          finally:
              try:
                  self.release(conn)
              except ConnectionHealthCheckFailedError:
                  pass  # Already marked unhealthy

  - id: IMPLICIT_DEPENDENCIES_NO_FALLBACK_001
    issue_type: "Single Point of Failure - Global Dependencies"
    severity: "HIGH"
    files:
      - path: "cortex/infrastructure/audit_logger.py"
        context: |
          Singleton pattern with global _instance.
          If initialization fails, no fallback logger available.
          All operations fail.
      - path: "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
        context: |
          Script depends on hardcoded path:
          /Users/asifhussain/PROJECTS/CORTEX/cortex/core/state/governance.db
          Will fail on any other machine.
    impact: |
      Single initialization failure breaks entire system.
      Hardcoded paths prevent portability.
    suggested_fix: |
      # For singleton, provide fallback:
      class EnhancedAuditLogger:
          _instance = None
          _fallback = None  # Fallback instance
          
          @classmethod
          def get_instance(cls):
              try:
                  if cls._instance is None:
                      cls._instance = cls()
                  return cls._instance
              except Exception as e:
                  logger.error(f"Failed to create audit logger: {e}")
                  if cls._fallback is None:
                      cls._fallback = create_null_logger()
                  return cls._fallback
      
      # For hardcoded paths:
      db_path = Path(os.environ.get(
          'CORTEX_DB_PATH',
          Path(__file__).parent.parent / 'governance.db'
      ))

# =============================================================================
# MEDIUM SEVERITY ISSUES (Moderate Risk)
# =============================================================================
medium_severity_issues:
  - id: WEAK_ERROR_CONTEXT_001
    issue_type: "Exception Handling Without Context"
    severity: "MEDIUM"
    count: 45
    categories:
      - "except Exception: pass" without logging (12 instances)
      - "except Exception:" with minimal logging (15 instances)
      - "except Exception:" without returning error state (18 instances)
    locations:
      - cortex/infrastructure: 8 instances
      - cortex/orchestrators: 12 instances
      - cortex_brain/tier0: 8 instances
      - cortex_brain/tier1: 5 instances
      - cortex_brain/tier2: 12 instances
    impact: |
      Errors silently fail, making production debugging difficult.
      No error metrics collected.
      Difficult to determine why operations failed.
    suggested_fix: |
      Add context logging to all exception handlers:
      
      try:
          result = risky_operation()
      except SpecificError as e:
          self.logger.warning(
              "Operation failed (expected path)",
              extra={
                  "operation": "risky_operation",
                  "error_type": type(e).__name__,
                  "error": str(e),
                  "context": {...relevant state...}
              }
          )
      except Exception as e:
          self.logger.error(
              "Unexpected operation failure",
              exc_info=True,
              extra={"operation": "risky_operation"}
          )
          raise

  - id: PASS_STATEMENT_EMPTY_BLOCKS_001
    issue_type: "Empty Exception Handlers"
    severity: "MEDIUM"
    count: 15
    examples:
      - path: "cortex/brain/tier2/hallucination_prevention/detection_recovery.py"
        lines: [163]
        context: "Exception handler with just pass, no logging or recovery"
      - path: "cortex/brain/tier2/coherence/__init__.py"
        lines: [140]
        context: "Silent exception suppression"
    impact: |
      No indication that an error occurred.
      Error telemetry completely missing.
    suggested_fix: |
      Never use bare 'pass' in exception handlers:
      
      # BEFORE:
      except Exception:
          pass
      
      # AFTER:
      except ExpectedError:
          self.logger.debug("Expected condition occurred")
          self.metrics.increment("expected_error")
      except Exception as e:
          self.logger.error(f"Unexpected error: {e}", exc_info=True)
          self.metrics.increment("unexpected_error")

  - id: GLOBAL_STATE_SINGLETON_RISKS_001
    issue_type: "Unprotected Global State"
    severity: "MEDIUM"
    count: 8
    instances:
      - path: "cortex/infrastructure/audit_logger.py"
        pattern: "global _instance = None"
        risk: "Thread safety depends on lock, but not always held"
      - path: "cortex/brain/mcp/tools/governance_tools.py"
        pattern: "global _db, _enforcer"
        risk: "Multiple globals without consistency guarantees"
    impact: |
      Race conditions in multi-threaded scenarios.
      Globals can be in inconsistent state.
      Testing becomes difficult due to state pollution.
    suggested_fix: |
      Use class-level locks for all global access:
      
      class ConfigManager:
          _instance = None
          _lock = threading.Lock()
          
          @classmethod
          def get_instance(cls):
              if cls._instance is None:
                  with cls._lock:
                      if cls._instance is None:
                          cls._instance = cls()
              return cls._instance
          
          def __init__(self):
              # initialization
              pass
          
          # All methods must hold lock for state changes
          def update_config(self, new_config):
              with self._lock:
                  self._config = new_config

