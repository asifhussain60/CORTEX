    severity: "LOW"
    count: 12
    description: |
      Several functions accept parameters but don't validate types or ranges.
      May lead to downstream errors with unclear origin.
    suggested_fix: |
      Add parameter validation at function entry:
      
      def process_data(self, data: Dict[str, Any], timeout: float = 30.0):
          if not isinstance(data, dict):
              raise TypeError(f"data must be dict, got {type(data)}")
          if not all(isinstance(v, (str, int, float)) for v in data.values()):
              raise ValueError(f"data values must be scalar types")
          if timeout <= 0:
              raise ValueError(f"timeout must be positive, got {timeout}")
          
          # Safe to proceed

  - id: MISSING_DOCSTRINGS_001
    issue_type: "Documentation Gaps"
    severity: "LOW"
    count: 18
