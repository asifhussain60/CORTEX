# =============================================================================
# DETECTION AND MONITORING RECOMMENDATIONS
# =============================================================================
monitoring_recommendations:
  static_analysis:
    - tool: "pylint"
      rule: "bare-except"
      action: "Fail build if found"
    
    - tool: "flake8"
      rule: "E722 do not use bare except"
      action: "Enforce in pre-commit hook"
    
    - tool: "bandit"
      rule: "B001"
      action: "Detect assert statements"
  
  runtime_monitoring:
    - metric: "exception_count"
      threshold: "Alert if > 100/min"
    
    - metric: "silent_failures"
      threshold: "Alert if any found in logs"
    
    - metric: "resource_leaks"
      threshold: "Monitor file handles and connections"
    
    - metric: "circuit_breaker_trips"
      threshold: "Alert on first trip"
  
  code_review_checklist:
    - "All try blocks have except with specific exception types"
    - "All except blocks log or raise"
    - "All resources acquired in try block are released in finally"
    - "No bare except: or except Exception: with pass"
    - "All TODO/FIXME items have AC-ID and owner"
    - "No hardcoded paths or environment-specific values"
    - "All external API calls have timeout"
    - "All long-running operations have cancellation token"
