  - id: UNTESTABLE_GLOBAL_STATE_001
    issue_type: "Global State Prevents Isolation"
    severity: "MEDIUM"
    count: 5
    description: |
      Singleton patterns with global state make tests interdependent.
      Tests must run in specific order or fail.
    suggested_fix: |
      1. Provide reset/cleanup methods:
         
         class Singleton:
             @classmethod
             def _reset_for_testing(cls):
                 """Clear singleton for test isolation."""
