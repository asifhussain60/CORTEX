# =============================================================================
# ARCHITECTURAL BRITTLENESS
# =============================================================================
architectural_issues:
  - id: MISSING_CIRCUIT_BREAKER_PATTERN_001
    issue_type: "No Fault Tolerance for External Dependencies"
    severity: "HIGH"
    description: |
      Database operations don't have circuit breaker.
      If database is slow/down, all operations hang.
      No fallback or graceful degradation.
    suggested_fix: |
      Implement circuit breaker:
      
      from circuitbreaker import CircuitBreaker
      
      db_circuit = CircuitBreaker(
          fail_max=5,
          reset_timeout=60,
          exclude=[ValidationError],  # Don't trip on input errors
      )
      
      @db_circuit
      def query_database(sql):
          return execute_query(sql)

  - id: MISSING_HEALTH_CHECK_ENDPOINTS_001
    issue_type: "No System Health Visibility"
    severity: "MEDIUM"
    description: |
      No standardized way to check if services are healthy.
      Cannot detect degraded state early.
    suggested_fix: |
      Create health check registry:
      
      class HealthCheck:
          def __init__(self, name: str, timeout: float = 5.0):
              self.name = name
              self.timeout = timeout
              self.last_check = None
              self.is_healthy = False
          
          @abstractmethod
          def check(self) -> bool:
              pass
      
      class DatabaseHealthCheck(HealthCheck):
          def check(self) -> bool:
              try:
                  with self.db.connection() as conn:
                      conn.execute("SELECT 1")
                  return True
              except Exception as e:
                  self.logger.error(f"DB health check failed: {e}")
                  return False

  - id: HARDCODED_PATHS_NO_PORTABILITY_001
    issue_type: "Environment-Specific Hardcoded Paths"
    severity: "HIGH"
    files:
      - path: "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
        line: 43
        path_value: "/Users/asifhussain/PROJECTS/CORTEX/cortex/core/state/governance.db"
    impact: |
      Script fails on any other developer machine.
      Cannot run in CI/CD pipeline.
    suggested_fix: |
      Use environment variables with fallback:
      
      db_path = Path(
          os.environ.get(
              'CORTEX_DB_PATH',
              Path(__file__).parent.parent.parent / 'state' / 'governance.db'
          )
      )

