# =============================================================================
# CRITICAL SEVERITY ISSUES (Immediate Risk)
# =============================================================================
critical_issues:
  - id: BARE_EXCEPT_001
    issue_type: "Bare Except Clause"
    severity: "CRITICAL"
    files:
      - path: "tests/test_ac_ar_010_03_imports.py"
        lines: [42, 66, 385]
        context: "Import validation tests with bare except:, silently masking import errors"
      - path: "tests/unit/test_conversation_protocol_transactions.py"
        lines: [136, 195]
        context: "Protocol transaction tests with bare except:, hiding transaction failures"
      - path: "cortex/brain/mcp/tools/validate_consolidation.py"
        lines: [205]
        context: "File hash computation with bare except: returns ERROR_READING_FILE instead of raising"
    impact: "Silent failures hide actual problems. Debugging becomes extremely difficult."
    suggested_fix: |
      Replace bare except: with specific exception handling:
      - except FileNotFoundError: log and re-raise
      - except IOError as e: log with context and return meaningful error
      - Add logging before exception handling to trace the error source
    example_fix: |
      # BEFORE (line 205 in validate_consolidation.py):
      except:
          return "ERROR_READING_FILE"
      
      # AFTER:
      except FileNotFoundError:
          self.logger.error(f"File not found: {file_path}")
          raise
      except IOError as e:
          self.logger.error(f"Cannot read file {file_path}: {e}")
          raise
      except Exception as e:
          self.logger.error(f"Unexpected error reading {file_path}: {e}")
          raise

  - id: MISSING_RESOURCE_CLEANUP_001
    issue_type: "Database Connection Leak"
    severity: "CRITICAL"
    files:
      - path: "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
        lines: [43, 46, 66]
        context: "Script opens sqlite3 connection but no proper cleanup. No try/finally, conn.close() not guaranteed"
    impact: |
      Database connections can leak in production/long-running processes.
      May exhaust connection limits, preventing new operations.
    suggested_fix: |
      Use context managers or explicit try/finally:
      
      # OPTION 1: Context manager (PREFERRED)
      with sqlite3.connect(str(db_path)) as conn:
          cursor = conn.cursor()
          cursor.execute(...)
          conn.commit()
      
      # OPTION 2: Try/finally
      conn = sqlite3.connect(str(db_path))
      try:
          cursor = conn.cursor()
          cursor.execute(...)
          conn.commit()
      finally:
          conn.close()

  - id: EXCEPTION_SUPPRESSION_001
    issue_type: "Broad Exception Suppression"
    severity: "CRITICAL"
    files:
      - path: "cortex/infrastructure/connection_pool.py"
        lines: [300, 383]
        context: "Connection pool error handling: except Exception: pass silently swallows all errors"
      - path: "cortex/infrastructure/database.py"
        lines: [89, 105, 270]
        context: "Database operations with except Exception: pass hide real failures"
      - path: "cortex/infrastructure/audit_logger.py"
        lines: [106]
        context: "Lock release with except Exception: pass can leave file handles open"
    impact: |
      Resource exhaustion bugs become invisible. Dead connections remain in pool.
      File locks can persist, blocking subsequent operations.
    suggested_fix: |
      Log exceptions before suppressing:
      
      # BEFORE:
      except Exception:
          pass
      
      # AFTER:
      except FileNotFoundError:
          self.logger.warning(f"Lock file not found: {path}")
      except OSError as e:
          self.logger.error(f"Failed to release lock: {e}", exc_info=True)
      except Exception as e:
          self.logger.error(f"Unexpected error releasing lock: {e}", exc_info=True)

  - id: NO_FALLBACK_POOL_HEALTH_CHECK_001
    issue_type: "Single Point of Failure - No Fallback"
    severity: "CRITICAL"
    files:
      - path: "cortex/infrastructure/connection_pool.py"
        lines: [150, 200]
        context: "Health check failure causes immediate acquisition failure. No fallback connection creation"
    impact: |
      Single failed health check can cascade to application failure.
      No graceful degradation for transient database issues.
    suggested_fix: |
      Implement health check with fallback:
      - Retry health check with exponential backoff
      - If health check fails N times, attempt fresh connection
      - Log degraded state to monitoring system
      - Implement circuit breaker pattern

  - id: UNHANDLED_PARSE_ERRORS_001
    issue_type: "Unhandled Exception in Critical Path"
    severity: "CRITICAL"
    files:
      - path: "cortex/brain/mcp/tools/validate_consolidation.py"
        lines: [225, 240]
        context: |
          YAML/JSON parsing without specific exception handling.
          Consolidated file loading can raise ValueError, YAMLError without context.
    impact: "Configuration validation silently fails or crashes without diagnostic info"
    suggested_fix: |
      Catch specific exceptions with recovery:
      
      try:
          consolidated_data = self._load_consolidated_file(consolidated_path)
      except yaml.YAMLError as e:
          self.logger.error(f"Invalid YAML in {consolidated_path}: {e.problem_mark}")
          raise ValidationError(f"Invalid config format: {e}")
      except json.JSONDecodeError as e:
          self.logger.error(f"Invalid JSON in {consolidated_path}: line {e.lineno}")
          raise ValidationError(f"Invalid JSON format: {e}")
      except FileNotFoundError:
          self.logger.error(f"Consolidated file missing: {consolidated_path}")
          raise

