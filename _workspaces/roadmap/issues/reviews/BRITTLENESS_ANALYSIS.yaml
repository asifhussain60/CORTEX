# =============================================================================
# RESOURCE MANAGEMENT ISSUES
# =============================================================================
resource_management_issues:
  - id: FILE_HANDLE_LEAKS_001
    issue_type: "File Handle Not Guaranteed Closed"
    severity: "HIGH"
    files:
      - path: "cortex/infrastructure/audit_logger.py"
        lines: [75, 85]
        context: "File lock acquire without context manager in some code paths"
      - path: "cortex/brain/mcp/tools/validate_consolidation.py"
        lines: [205]
        context: "File read without with statement"
    impact: |
      File descriptor exhaustion under high load.
      OS may prevent opening new files.
    suggested_fix: |
      Always use with statement or context managers:
      
      # GOOD:
      with open(file_path, 'rb') as f:
          data = f.read()
      
      # GOOD:
      with self._acquire_lock():
          # Protected operation
          pass
      
      # BAD:
      f = open(file_path, 'rb')
      data = f.read()
      # f.close() may never execute

  - id: DB_CONNECTION_LEAK_PATTERNS_001
    issue_type: "Database Connection Resource Leak"
    severity: "HIGH"
    instances: 3
    files:
      - path: "cortex/tools/toolkit/ac_fix_001_06_regenerate.py"
        issue: "conn = sqlite3.connect(...) without context manager"
        line: 46
      - path: "cortex/infrastructure/connection_pool.py"
        issue: "Health check connection may not be released on exception"
        line: 200
    impact: |
      Database connection pool exhaustion.
      Subsequent connections fail.
      May require service restart.
    suggested_fix: |
      Use context managers exclusively:
      
      # PREFERRED:
      with sqlite3.connect(db_path) as conn:
          cursor = conn.cursor()
          cursor.execute(...)
      
      # FALLBACK:
      conn = sqlite3.connect(db_path)
      try:
          cursor = conn.cursor()
          cursor.execute(...)
      finally:
          conn.close()

  - id: INCOMPLETE_LOCK_RELEASE_001
    issue_type: "Lock Not Released on Error"
    severity: "MEDIUM"
    files:
      - path: "cortex/infrastructure/audit_logger.py"
        lines: [75, 100]
        context: "Lock release silently fails with except Exception: pass"
    impact: |
      Lock remains held, blocking subsequent operations.
      Can cause deadlock or extreme slowness.
    suggested_fix: |
      Always log lock failures:
      
      def release_lock(self):
          if self._file:
              try:
                  if self._lock_type == "windows":
                      msvcrt.locking(self._file.fileno(), msvcrt.LK_UNLCK, 1)
              except OSError as e:
                  self.logger.error(f"Failed to unlock: {e}", exc_info=True)
                  raise
              except Exception as e:
                  self.logger.error(f"Unexpected lock error: {e}", exc_info=True)
                  raise
              finally:
                  try:
                      self._file.close()
                  except IOError:
                      pass
              self._file = None

