duplication:
  
  - id: DUP-001
    title: "Multiple Audit Logger Implementations"
    type: duplication
    severity: HIGH
    files_affected:
      - cortex/infrastructure/audit_logger.py
      - cortex/infrastructure/enhanced_audit_logger.py
      - cortex/infrastructure/structured_logger.py
      - cortex/infrastructure/tiered_logger.py
      - cortex/brain/domain_brain/audit_logger.py
      - cortex/brain/intent_router/audit_logger.py
      - cortex/brain/intent_router/batch_audit_logger.py
      - cortex/brain/governance_tools/batch_audit_logger.py
      - cortex/brain/domain_orchestrators/batch_audit_logger.py
    description: |
      Multiple audit logger classes with overlapping functionality across modules.
      Each implementation has its own hash-chain logic, TTL caching, and operation tracking.
      This creates maintenance burden and inconsistent behavior.
    impact: |
      - Code duplication: ~3,000+ lines across 9 files
      - Inconsistent audit behavior across modules
      - Changes to logging logic must be applied to multiple places
      - Testing overhead multiplied by number of implementations
      - Risk of subtle behavioral differences causing audit inconsistencies
    effort: HIGH (requires careful refactoring)
    suggested_approach: |
      1. Create abstract base class: `AbstractAuditLogger`
      2. Extract common hash-chain logic to `HashChainMixin`
      3. Extract TTL cache logic to `CachedAuditMixin`
      4. Create factory function: `get_audit_logger(component_type, config)`
      5. Update all 9 files to inherit from base class
      6. Add integration tests for cross-module compatibility
      
      Impact:
      - Reduce duplication by 80%
      - Single source of truth for audit behavior
      - Easier to audit and debug
      
