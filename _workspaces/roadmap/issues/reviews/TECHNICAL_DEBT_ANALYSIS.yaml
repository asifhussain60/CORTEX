performance:
  
  - id: PERF-001
    title: "Repository Scanner O(n²) Complexity"
    type: perf
    severity: HIGH
    files_affected:
      - cortex/orchestrators/core/repository_scanner.py
    description: |
      Repository scanning performs full AST parse of every file
      without caching. Complexity: O(n * m) where:
      - n = number of files
      - m = file size
      
      For codebase with 300+ files, scanning takes 5+ seconds.
      No incremental updates possible.
    impact: |
      - Slow analysis
      - API endpoints timeout (queries require scan)
      - Development iteration slow
    effort: MEDIUM
    suggested_approach: |
      1. Add AST parse caching:
         - Cache parsed AST by file hash
         - Invalidate on file change
      2. Add incremental scanning:
         - Only re-scan changed files
         - Merge results with cached results
      3. Add lazy parsing:
         - Parse only what's needed
         - Defer expensive analysis
      4. Benchmark: should scan in <500ms
      
  - id: PERF-002
    title: "Context Building Aggregates All Data (memory intensive)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/brain/core/intent/lens_context_builder.py
    description: |
      LENSContextBuilder aggregates findings from 4 sources:
      - AST findings (all functions, classes)
      - Git findings (all history)
      - Comment findings (all markers)
      - Relationship findings (all imports)
      
      Loads everything into memory (no lazy loading).
      For large codebase: 100MB+ context objects.
    impact: |
      - Memory usage high
      - OOM errors on large codebases
      - Slow serialization
      - Network bandwidth for transmission
    effort: MEDIUM
    suggested_approach: |
      1. Add lazy loading:
         - Load summary first
         - Load details on demand
      2. Add filtering:
         - Load only relevant context
         - Exclude unneeded findings
      3. Add pagination for large results
      4. Add compression for serialization
      
  - id: PERF-003
    title: "Knowledge Queries Sequential (should be parallel)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/knowledge/retriever.py
      - cortex/api/endpoints.py (knowledge queries)
    description: |
      Knowledge queries execute sequentially:
      - Query domain knowledge
      - Query technical knowledge
      - Query patterns
      - Merge results
      
      Could parallelize each query (I/O bound).
    impact: |
      - Slower query response
      - Unnecessary latency
      - CPU underutilization
    effort: LOW
    suggested_approach: |
      1. Use asyncio to parallelize queries
      2. Or use concurrent.futures.ThreadPoolExecutor
      3. Wait for all queries to complete
      4. Merge results
      5. Benchmark: should reduce latency by 50%
      
  - id: PERF-004
    title: "No Connection Pooling (new connection per request)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/infrastructure/database.py
      - cortex/core/database.py
    description: |
      Each database operation creates new connection.
      No connection pooling means:
      - Connection setup overhead per query
      - Database connection limits exceeded
      - Performance degradation under load
    impact: |
      - Slow database operations
      - Cascading failures under load
      - Connection limit exceeded errors
    effort: LOW
    suggested_approach: |
      1. Implement connection pooling:
         - Use sqlalchemy connection pool
         - Or: Custom pool implementation
      2. Configure pool size:
         - min_size = 5
         - max_size = 20
      3. Test pool behavior
      4. Monitor pool stats
      
  - id: PERF-005
    title: "Recursive Graph Traversal (unbounded depth)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/orchestrators/core/repository_scanner.py (dependency graph)
      - cortex/brain/core/intent/lens_context_builder.py (knowledge graph)
    description: |
      Graph traversal methods like get_neighbors() don't limit depth.
      For circular dependency graphs, could traverse infinitely.
      No memoization for visited nodes.
    impact: |
      - Infinite loops possible (with cycles)
      - Stack overflow
      - Exponential time for complex graphs
    effort: LOW
    suggested_approach: |
      1. Add depth limit to traversals
      2. Add visited set to prevent cycles
      3. Add memoization for expensive computations
      4. Add timeout for long traversals
      5. Detect cycles explicitly
      
  - id: PERF-006
    title: "Repeated Regex Compilation"
    type: perf
    severity: LOW
    files_affected:
      - cortex/orchestrators/core/repository_scanner.py (pattern detection)
      - cortex/brain/core/intent/lens_context_builder.py (filtering)
    description: |
      Regular expressions compiled on every use instead of once.
      Example: Same pattern used in loop, compiled each iteration.
    impact: |
      - Repeated regex compilation overhead
      - Minor performance impact
    effort: LOW
    suggested_approach: |
      1. Compile regexes once at module level:
         ```python
         FUNCTION_PATTERN = re.compile(r"def\s+(\w+)")
         ```
      2. Use compiled patterns in functions
      3. Profile to verify improvement
      
  - id: PERF-007
    title: "Unbounded Cache Growth (memory leak)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/brain/domain_brain/audit_logger.py (manual TTL cache, but bounded)
      - cortex/brain/core/intent/lens_context_builder.py (@lru_cache, bounded but no TTL)
      - Custom caches in various files (many unbounded)
    description: |
      Some caches grow unbounded:
      - LRU caches with large size limits
      - Caches without TTL
      - Manual caches without cleanup
      
      Can consume all available memory.
    impact: |
      - Memory leaks
      - OOM crashes
      - Long-running processes fail
    effort: MEDIUM
    suggested_approach: |
      1. Audit all caches for:
         - Size limits
         - TTL policies
         - Eviction strategies
      2. Implement cache management:
         - Clear expired entries
         - Monitor cache size
         - Alert on high usage
      3. Use LRU caches with reasonable size limits
      4. Add cache statistics/monitoring
      
  - id: PERF-008
    title: "N+1 Query Pattern Possible (not confirmed)"
    type: perf
    severity: MEDIUM
    files_affected:
      - cortex/knowledge/retriever.py (unclear if N+1 exists)
      - cortex/brain/domain_brain/deduplication.py (hash computation for each upload)
      - cortex/api/endpoints.py (possible in complex queries)
    description: |
      Potential N+1 query patterns in:
      - Loading domains then loading domain metadata
      - Computing hashes for duplicate detection
      - Loading knowledge then filtering
      
      Not confirmed but possible with current code structure.
    impact: |
      - Possible slow queries
      - Unnecessary database load
      - Performance degrades with data size
    effort: MEDIUM
    suggested_approach: |
      1. Profile queries:
         - Use database query logging
         - Use APM tool to identify slow endpoints
      2. Identify actual N+1 patterns
      3. Optimize:
         - Batch loading
         - Eager loading
         - Query consolidation
      4. Add query tests to prevent regressions
      
