# cortex-registry-001-migration: Establish cortex-registry/ Folder Structure
# Win Track Phase 1
# Status: NOT_STARTED
# Effort: 18-21 hours
# Priority: P0

metadata:
  phase_id: "cortex-registry-001-migration"
  title: "Establish cortex-registry/ Folder Structure"
  machine: "win"
  priority: "P0"
  estimated_effort: "18-21 hours"
  status: "NOT_STARTED"

current_state: |
  - _workspaces/roadmap/ contains ephemeral planning documents
  - No central registry for plans, features, or system manifest
  - Plan-type not segregated (mixing master/planning/ADO/interaction)
  - Multiple domains cannot maintain separate registries

target_state: |
  - cortex-registry/ established as canonical registry
  - Plan-type segregation: master/, planning/, ado/, interaction/
  - Enables master/planning/ADO/interaction orchestrators
  - Scales to multiple domains

acceptance_criteria:
  - id: "AC-REG-001"
    description: "cortex-registry/ directory structure created"
    verification: "All directories exist with correct structure"
    
  - id: "AC-REG-002"
    description: "Plan-type segregation implemented (master/, planning/, ado/, interaction/)"
    verification: "Each subdirectory has proper structure"
    
  - id: "AC-REG-003"
    description: "Migrate existing _workspaces/roadmap → cortex-registry/"
    verification: "Plans correctly organized by type"
    
  - id: "AC-REG-004"
    description: "Registry manifest created"
    verification: "manifest.yaml exists and is valid"
    
  - id: "AC-REG-005"
    description: "Domain segregation support added"
    verification: "domains/ structure allows multiple domains"
    
  - id: "AC-REG-006"
    description: "Integration with orchestrators verified"
    verification: "Master/Planning/ADO orchestrators can read registry"

implementation_details:
  structure:
    cortex-registry/:
      master/: "Master plans (highest authority)"
      planning/: "Planning documents"
      ado/: "Azure DevOps plans"
      interaction/: "Interaction patterns"
      domains/: "Domain-specific registries"
      manifest.yaml: "Registry metadata"
