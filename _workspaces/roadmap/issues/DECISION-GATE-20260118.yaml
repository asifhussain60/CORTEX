def _log_audit_entry(self, ac_id: str, operation: str, metadata: dict = None) -> str:
    """Log an audit entry and calculate hash chain."""
    
    # Get prior entry hash
    prior_entry = self._get_prior_entry(ac_id)
    
    # ❌ BUG: This line hardcodes empty string instead of using prior_entry.entry_hash
    previous_hash = ""  # ← DESIGN DEFECT
    # Comment in code: "for simplicity in tests" ← indicates incomplete implementation
    
    # Calculate current entry hash
    entry_hash = self._calculate_hash(
        prior_hash=previous_hash,  # ← Passes empty string, breaks chain
        operation=operation,
        timestamp=datetime.now(),
        ac_id=ac_id
    )
    
    # Write to database
    self.connection.execute(
        "INSERT INTO audit_log (ac_id, operation, previous_hash, entry_hash, ...)",
        (ac_id, operation, previous_hash, entry_hash, ...)
    )
    
    return entry_hash
```

