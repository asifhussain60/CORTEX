testing_checklist:
  
  pre_implementation:
    - [ ] Review CORTEX Builder prompt.md §Implementation Checklist
    - [ ] Create git checkpoint before starting
    - [ ] Read existing phase specs for patterns
    - [ ] Understand governance compliance (CORE-008 through CORE-027)
  
  during_implementation:
    - [ ] Write tests FIRST (CORE-008 TDD)
    - [ ] 100% type hints on all public APIs (CORE-011)
    - [ ] Google docstrings on all classes/methods (CORE-012)
    - [ ] No bare except clauses (CORE-013)
    - [ ] AC_START logged on phase begin
    - [ ] AC_EXECUTE logged on implementation start
    - [ ] Tests passing before committing
  
  post_implementation:
    - [ ] All unit tests passing (>95%)
    - [ ] All integration tests passing
    - [ ] AC_COMPLETE logged on phase end
    - [ ] Audit trail verified
    - [ ] Git checkpoint committed
    - [ ] Documentation complete
    - [ ] Performance benchmarks verified
    - [ ] Security audit clean
