      - "cortex/infrastructure/security/cors_handler.py"
      - "cortex/infrastructure/security/security_auditor.py"
    quick_start: |
      1. Create SecretsFilter to redact PII in logs
      2. Build InputValidator for SQL injection/XSS prevention
      3. Implement TokenBucketRateLimiter for DDoS protection
