  issue_reference: "MCP-TOOLS-EXPOSURE-GAP-20260118"

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    Not all CORTEX tools are exposed via MCP protocol. Systematic audit identified
    16 tools currently exposed but critical gaps in domain orchestrator operations
    and tool discovery mechanisms.
  
  evidence_grade: "A"
  discovered_date: "2026-01-18"
  discovery_method: "Systematic MCP tool exposure audit"
  
  gaps_identified:
    - gap_id: "EXPOSURE-GAP-001"
      title: "Missing @mcp_tool Decorator"
      description: "get_relevant_business_knowledge_for_operation() method exists but not exposed"
      location: "src/orchestrators/core/master_orchestrator.py:1024"
      severity: "HIGH"
      impact: "Clients cannot discover or call this critical business knowledge method"
      status: "METHOD EXISTS - MISSING @mcp_tool DECORATOR"
      priority: "P1"
    
    - gap_id: "EXPOSURE-GAP-002"
      title: "Domain Orchestrator Operations Not Exposed"
      description: "Systematic gap across domain orchestrators"
      location: "src/orchestrators/domain/*"
      severity: "HIGH"
      impact: "Domain-specific operations unreachable via MCP"
      status: "NOT EXPOSED - Need systematic exposure"
      priority: "P1"
      affected_domains:
        - "planning_orchestrator"
        - "design_orchestrator"
        - "implementation_orchestrator"
        - "testing_orchestrator"
        - "documentation_orchestrator"
    
    - gap_id: "EXPOSURE-GAP-003"
      title: "Tool Discovery Endpoint Missing"
      description: "No MCP endpoint to list all available tools"
      location: "src/mcp/server.py"
      severity: "MEDIUM"
      impact: "Clients must hardcode known tools; no dynamic discovery"
      status: "MISSING - No endpoint to list all available tools"
      priority: "P2"

# =============================================================================
# ROOT CAUSE ANALYSIS
# =============================================================================

root_cause: |
  Incremental development added MCP tools piecemeal (16 tools over multiple phases)
  without comprehensive exposure strategy. Each phase added decorators to specific
  modules but never conducted systematic review of ALL CORTEX capabilities to ensure
  complete MCP exposure.
  
  Pattern: Each developer added @mcp_tool to their own functions but never checked
  other modules for methods that should also be exposed.

# =============================================================================
# ACCEPTANCE CRITERIA (3 AC-IDs)
# =============================================================================

acceptance_criteria:
  ac_001:
    ac_id: "AC-MCP-EXPOSURE-001"
    title: "Add @mcp_tool decorator to get_relevant_business_knowledge_for_operation"
    description: |
      Expose get_relevant_business_knowledge_for_operation() method in MasterOrchestrator
      as MCP tool for programmatic access.
    
    success_criteria:
      - "Method decorated with @mcp_tool"
      - "Tool name: get_relevant_business_knowledge_for_operation"
      - "Tool metadata includes description, parameters, return type"
      - "Tool listed in /tools endpoint"
      - "Tool callable via MCP protocol"
      - "4+ unit tests verifying MCP exposure"
      - "Zero regression in existing MCP tools (16 → 17)"
      - "Audit trail created (AC_START, AC_EXECUTE, AC_COMPLETE)"
    
    files_to_modify:
      - "src/orchestrators/core/master_orchestrator.py (add @mcp_tool decorator + metadata)"
      - "tests/unit/core/orchestrator/test_mcp_exposure.py (add verification tests)"
    
    testing_requirements:
      unit_tests_expected: 4
      integration_tests_expected: 0
      test_categories:
        - "MCP tool registration verification"
        - "Tool metadata completeness"
        - "Tool callable via MCP protocol"
        - "Tool parameters validated"
    
    estimation:
      hours: 1
      days: 0.25
  
  ac_002:
    ac_id: "AC-MCP-EXPOSURE-002"
    title: "Expose domain orchestrator operations as MCP tools"
    description: |
      Systematically add @mcp_tool decorators to key public methods in all domain
      orchestrators (planning, design, implementation, testing, documentation).
      This enables LLM clients to discover and invoke domain-specific operations.
    
    success_criteria:
      - "Planning orchestrator: 3+ key methods exposed"
      - "Design orchestrator: 3+ key methods exposed"
      - "Implementation orchestrator: 3+ key methods exposed"
      - "Testing orchestrator: 2+ key methods exposed"
      - "Documentation orchestrator: 2+ key methods exposed"
      - "All exposed methods have metadata (description, parameters, return type)"
      - "15+ new MCP tools added (16 → 31)"
      - "Tool categories properly organized"
      - "10+ unit tests verifying domain orchestrator exposure"
      - "Backward compatibility verified (zero regressions)"
      - "Audit trail created for all ACs"
    
    domain_operations:
      planning_orchestrator:
        - "create_plan()"
        - "validate_plan()"
        - "decompose_into_tasks()"
      
      design_orchestrator:
        - "design_architecture()"
        - "validate_design()"
        - "create_design_patterns()"
      
      implementation_orchestrator:
        - "implement_feature()"
        - "validate_implementation()"
        - "optimize_code()"
      
      testing_orchestrator:
        - "create_test_plan()"
        - "execute_tests()"
        - "analyze_coverage()"
      
      documentation_orchestrator:
        - "generate_docs()"
        - "validate_documentation()"
        - "update_examples()"
    
    files_to_modify:
      - "src/orchestrators/domain/planning_orchestrator.py (add @mcp_tool decorators)"
      - "src/orchestrators/domain/design_orchestrator.py (add @mcp_tool decorators)"
      - "src/orchestrators/domain/implementation_orchestrator.py (add @mcp_tool decorators)"
      - "src/orchestrators/domain/testing_orchestrator.py (add @mcp_tool decorators)"
      - "src/orchestrators/domain/documentation_orchestrator.py (add @mcp_tool decorators)"
      - "tests/unit/core/orchestrator/test_domain_mcp_exposure.py (NEW - 10+ tests)"
    
    testing_requirements:
      unit_tests_expected: 10
      integration_tests_expected: 0
      test_categories:
        - "Domain orchestrator tool registration"
        - "Tool metadata validation"
        - "Tool invocation via MCP"
        - "Cross-domain tool interaction"
        - "Tool catalog consistency"
    
    estimation:
      hours: 4
      days: 1
  
  ac_003:
    ac_id: "AC-MCP-EXPOSURE-003"
    title: "Add /list-tools MCP endpoint for tool discovery"
    description: |
      Implement comprehensive tool discovery endpoint that lists all available MCP tools
      with their metadata. Enables clients to dynamically discover capabilities without
      hardcoding tool names.
    
    success_criteria:
      - "New MCP endpoint: /list-tools"
      - "Returns list of all exposed MCP tools (31+ tools)"
      - "Each tool includes: name, description, parameters, return_type"
      - "Tool categories/namespaces organized (governance, orchestration, domain)"
      - "Endpoint accessible via standard MCP protocol"
      - "5+ unit tests verifying tool list accuracy"
      - "Integration test: client can discover and call tools dynamically"
      - "Tool count accurate (must reflect all @mcp_tool decorated methods)"
      - "Tool metadata consistent with function signatures"
    
    implementation_details:
      endpoint_name: "/list-tools"
      request_format: "MCP-standard tools/list protocol"
      response_format: |
        {
          "tools": [
            {
              "name": "tool_name",
              "description": "Tool description",
              "inputSchema": {
                "type": "object",
                "properties": {...},
                "required": [...]
              }
            },
            ...
          ]
        }
      
      tool_categories:
        - governance: "Governance and compliance tools"
        - orchestration: "Master orchestrator tools"
        - domain: "Domain-specific orchestrator tools"
        - knowledge: "Knowledge management tools"
    
    files_to_modify:
      - "src/mcp/server.py (add /list-tools endpoint)"
      - "src/mcp/tool_registry.py (enhance registry with listing capability)"
      - "tests/unit/mcp/test_tool_discovery.py (NEW - 5+ tests)"
      - "tests/integration/test_mcp_tool_discovery_e2e.py (NEW - dynamic discovery)"
    
    testing_requirements:
      unit_tests_expected: 5
      integration_tests_expected: 1
      test_categories:
        - "Tool list retrieval"
        - "Tool metadata completeness"
        - "Tool count accuracy"
        - "Tool category organization"
        - "Tool discoverability from client perspective"
        - "E2E tool discovery and invocation"
    
    estimation:
      hours: 3
      days: 1

