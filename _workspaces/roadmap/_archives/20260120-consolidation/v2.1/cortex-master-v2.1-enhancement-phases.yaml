    prompt_maintenance:
      rule: Every feature AC MUST have companion documentation update
      prompts_requiring_sync:
      - path: .github/prompts/CORTEX.prompt.md
        sections_required:
        - Response Header Integration
        - Tier 2 Template Usage
        - Copyright Notice Requirements
      - path: .github/copilot-instruction.md
        sections_required:
        - Response Format Standards
        - Copyright Headers
      - path: .github/prompts/cortex-builder.prompt.md
        sections_required:
        - Response Header Output Format
      enforcement: AC cannot be marked COMPLETED without prompt updates
    prompt_evaluation:
      rule: Each phase MUST trigger holistic reevaluation of CORTEX.prompt.md and
        copilot-instruction.md
      requirement: 'After implementing all ACs in a phase:

        1. Review the phase implementation holistically

        2. Evaluate CORTEX.prompt.md for relevance to new capabilities

        3. Evaluate copilot-instruction.md for documentation updates

        4. Update, enhance, or recreate prompt sections as needed

        5. Ensure prompts reflect latest phase enhancements

        6. Document what changed in prompt maintenance log

        '
      scope: ALL phases (including PHASE-DOC-REMEDIATION)
      frequency: At end of each phase, before phase lock
      enforcement: Phase cannot be locked until prompt evaluation complete
      areas_requiring_updates:
      - New AC-IDs and their capabilities
      - New response template structures
      - New governance rules introduced
      - New orchestrator capabilities
      - New tier0/tier1/tier2 enhancements
      - Response header configurations
    content_validation:
      rule: files_to_create in phase YAML MUST exist before phase lock
      enforce_on_phase_lock: true
      validation_script: scripts/validate_phase_deliverables.py
      required_checks:
      - All files_to_create actually exist on filesystem
      - Template directories not empty (only .gitkeep = FAIL)
      - Prompt sections match implemented features
    documentation:
      output_directory: _workspaces/roadmap/reports
      rule: All markdown reports generated during phase execution MUST go to centralized
        reports directory
      not_in_root: true
      not_in_docs: true
      examples:
      - Phase completion reports → _workspaces/roadmap/reports/PHASE-XX-COMPLETION-REPORT.md
      - AC analysis documents → _workspaces/roadmap/reports/AC-XXX-YY-analysis.md
      - Implementation summaries → _workspaces/roadmap/reports/PHASE-XX-*-SUMMARY.md
      - Gap analysis → _workspaces/roadmap/reports/PHASE-XX-GAP-ANALYSIS.md
      validation:
      - No .md files created in project root
      - No .md files created in _workspaces/roadmap/ root
      - All phase reports indexed in _workspaces/roadmap/reports/INDEX.md
      enforcement: Phase cannot be locked if reports found outside designated directory
    mcp_toolkit:
      status: ACTIVE
      rule: All Python scripts & utilities MUST be organized in MCP-exposed toolkit
        folders, NOT in root
      locations:
        toolkit_root: src/mcp/tools/
        toolkit_utilities: src/mcp/utilities/
        analysis_tools: src/mcp/tools/analysis/
        core_tools: src/mcp/tools/core/
        validation_tools: src/mcp/tools/validation/
      forbidden_locations:
      - Root directory (./*.py)
      - _workspaces/ root
      - _workspaces/roadmap/ root
      - .github/ root
      examples:
      - consolidate.py → src/mcp/tools/consolidate.py
      - validate_consolidation.py → src/mcp/tools/validation/validate_consolidation.py
      - Utility scripts → src/mcp/utilities/
      - Analysis tools → src/mcp/tools/analysis/
      enforcement: Python scripts in forbidden locations MUST be moved before phase
        lock
      cleanup_rule: 'End of session: rm -f *.py (verify none remain in root)'
  documentation_guidelines:
    status: ACTIVE
