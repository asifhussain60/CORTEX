acceptance_criteria:
  
  # -------------------------------------------------------------------------
  # AC-DOC-001: CORTEX.prompt.md Updates (P0 - 75 minutes)
  # -------------------------------------------------------------------------
  
  AC-DOC-001-01:
    id: "AC-DOC-001-01"
    title: "CORTEX.prompt.md Response Header Integration Section"
    description: |
      Add comprehensive Response Header Integration section to CORTEX.prompt.md.
      This section must explain:
      - What response headers are
      - How to use ResponseHeaderInjector
      - Copyright notice requirements
      - Example responses with headers
    priority: "P0"
    status: "COMPLETED"
    completed_at: "2026-01-16T11:30:00Z"
    estimated_minutes: 60
    
    files_to_modify:
      - path: ".github/prompts/CORTEX.prompt.md"
        changes:
          - "Add 'Response Header Integration' section (~150 lines)"
          - "Document ResponseHeaderInjector pattern"
          - "Include copyright header template"
          - "Show example responses with headers"
    
    acceptance_tests:
      - test: "grep -c 'Response Header' .github/prompts/CORTEX.prompt.md"
        expected: ">= 5"
        description: "Section header and references exist"
      - test: "grep 'ResponseHeaderInjector' .github/prompts/CORTEX.prompt.md"
        expected: "match found"
        description: "Injector class documented"
      - test: "grep 'Copyright.*Asif Hussain' .github/prompts/CORTEX.prompt.md"
        expected: "match found"
        description: "Copyright template included"
    
    content_template: |
      ## Response Header Integration
      
      ### Overview
      All responses generated must comply with CORTEX response header standards
      defined in Tier 0: `cortex_brain/tier0/response-headers.yaml`
      
      ### Header Format
      [Document the header structure]
      
      ### Using ResponseHeaderInjector
      [Document the pattern]
      
      ### Example Response
      [Show formatted example with headers]
  
  AC-DOC-001-02:
    id: "AC-DOC-001-02"
    title: "CORTEX.prompt.md References response-headers.yaml"
    description: |
      Ensure CORTEX.prompt.md explicitly references the response headers
      configuration file so agents know where to load config from.
    priority: "P0"
    status: "COMPLETED"
    completed_at: "2026-01-16T11:30:00Z"
    estimated_minutes: 15
    
    files_to_modify:
      - path: ".github/prompts/CORTEX.prompt.md"
        changes:
          - "Add reference to cortex_brain/tier0/response-headers.yaml"
          - "Add reference to cortex_brain/tier2/response-templates/"
    
    acceptance_tests:
      - test: "grep 'response-headers.yaml' .github/prompts/CORTEX.prompt.md"
        expected: "match found"
        description: "Tier 0 headers config referenced"
      - test: "grep 'tier2/response-templates' .github/prompts/CORTEX.prompt.md"
        expected: "match found"
        description: "Tier 2 templates directory referenced"
  
