# =============================================================================
# PHASE-DOC-REMEDIATION: Documentation & Content Remediation
# =============================================================================
# Purpose: Fix systematic gaps where code exists but documentation/content missing
# Gap Analysis: docs/ROADMAP-GAP-ANALYSIS.md (2026-01-16)
# Priority: P0 - CRITICAL (Must complete before production deployment)
# Estimated: 6 hours (1 day)
# =============================================================================

metadata:
  phase_id: "PHASE-DOC-REMEDIATION"
  title: "Documentation & Content Remediation"
  version: "1.0"
  created: "2026-01-16"
  author: "CORTEX Gap Analysis"
  status: "COMPLETED"
  priority: "P0 - CRITICAL"
  completed_at: "2026-01-16T12:00:00Z"
  
  # PROMPT EVALUATION REQUIREMENT (2026-01-16)
  prompt_maintenance_required: true
  prompt_evaluation_instructions: |
    This phase IS the prompt maintenance phase. After completion:
    
    1. **Evaluate CORTEX.prompt.md Completeness**
       - Verify Response Header Integration section comprehensive
       - Check all response examples include headers
       - Confirm governance integration documentation complete
    
    2. **Evaluate copilot-instruction.md Completeness**
       - Verify Response Format Standards detailed
       - Check copyright notice requirements documented
       - Confirm examples follow format
    
    3. **Evaluate Future Phase Prompts**
       - Identify what will change in PHASE-13 enhancements
       - Plan prompt updates needed for PHASE-13 completion
       - Document expected prompt maintenance for future phases
    
    4. **Document in Report**
       - Create .github/roadmap/reports/PHASE-DOC-REMEDIATION-PROMPT-REVIEW.md
       - Verify all prompts cover response headers
       - Verify all prompts document governance integration
       - List future phases' expected prompt enhancements
  
  documentation_output:
    directory: ".github/roadmap/reports"
    rule: "All remediation reports must go to centralized reports directory"
    examples:
      - "PHASE-DOC-REMEDIATION-COMPLETION-REPORT.md"
      - "PHASE-DOC-REMEDIATION-PROMPT-REVIEW.md"
      - "PHASE-DOC-REMEDIATION-VALIDATION-LOG.md"

overview:
  description: |
    This phase addresses 10 systematic gaps identified in the ROADMAP-GAP-ANALYSIS:
    
    CATEGORY A: Prompt/Documentation Maintenance Gaps
    - GAP-3: CORTEX.prompt.md missing Response Header Integration
    - GAP-4: copilot-instruction.md missing Response Format Standards
    - GAP-5: Enhancement phases shipped without prompt updates
    
    CATEGORY B: Content vs. Code Delivery Gaps
    - GAP-1: Template engine exists, templates don't
    - GAP-2: Template inheritance tested, templates empty
    - GAP-6: files_to_create specifications never enforced
    
    CATEGORY C: Documentation Reference Gaps
    - GAP-9: response-headers.yaml not referenced in prompts
    - GAP-10: MasterOrchestrator header integration undocumented
    
    ROOT CAUSE: ACs marked complete based on code delivery, not content/documentation delivery.
    
  root_cause_analysis: |
    The CORTEX roadmap has a systematic pattern:
    1. Code is implemented and tests pass ✅
    2. But prompts are not updated to document new features ❌
    3. And content files (templates) are never created ❌
    
    This results in:
    - AI agents using prompts don't know about implemented features
    - Engines have code but nothing to load
    - Infrastructure ready but unusable
    
  impact:
    agents_affected:
      - "CORTEX.prompt.md users don't know about response headers"
      - "copilot-instruction.md users don't generate compliant code"
      - "cortex-builder.prompt.md users miss output format requirements"
    features_affected:
      - "ResponseHeaderInjector - implemented but undocumented"
      - "Tier 2 Response Templates - engine exists, templates empty"
      - "Copyright headers - configured but not used"
      
  success_criteria:
    - "All 8 AC-IDs completed and verified"
    - "CORTEX.prompt.md contains Response Header Integration section"
    - "copilot-instruction.md contains Response Format Standards section"
    - "Tier 2 directory populated with 10+ template files"
    - "Validation script passes with exit code 0"
    - "No files_to_create specifications remain unimplemented"

dependencies:
  requires:
    - phase: "PHASE-12-KNOWLEDGE-ECOSYSTEM"
      reason: "Tier 3 knowledge must be populated before tier 2 templates reference it"
  required_for:
    - phase: "PHASE-16-ORCHESTRATOR-CONTINUATION"
      reason: "Documentation must be complete for orchestrator implementation"
  can_run_parallel_with:
    - phase: "PHASE-13-OBSERVABILITY-MATURITY"
      reason: "No code dependencies, only documentation"

governance_rules:
  applicable:
    - "CORE-012: Documentation required (this phase IS documentation)"
    - "CORE-027: Audit trail for all AC completions"
    - "CORE-028: Kebab-case file naming"
  enforced:
    - "files_to_create MUST exist before phase lock"
    - "Validation script MUST pass before phase lock"

