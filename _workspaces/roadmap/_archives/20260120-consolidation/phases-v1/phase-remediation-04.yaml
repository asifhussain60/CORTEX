  - ac_id: "AC-FIX-009-01"
    title: "Fix event integration test failures (16 tests)"
    priority: "P0 - CRITICAL"
    category: "Test Suite - Event Integration"
    issue_reference: "ISSUE-003, post-AC-FIX-008-01 failures"
    status: "COMPLETED ✅"
    completed_at: "2026-01-17"
    blocking_tests_before: 18
    blocking_tests_after: 2
    tests_fixed: 16
    
    description: |
      After AC-FIX-008-01, 18 tests still failing:
      - 16 in test_event_integration.py
      - 2 in test_oc_004_01_integration.py
      
      ROOT CAUSE IDENTIFIED:
      1. ❌ Mock orchestrators using bare Mock() without required attributes
      2. ❌ MockDomainOrchestrator missing 'name' attribute
      3. ❌ Events not being captured (fired_events always empty)
      4. ❌ Two instances of unwrap_err() instead of .error attribute
      
      SOLUTION IMPLEMENTED:
      1. ✅ Added MockIOrchestrator dataclass to test_event_integration.py
      2. ✅ Replaced all Mock() calls with MockIOrchestrator()
      3. ✅ Added name attribute to MockDomainOrchestrator
      4. ✅ Fixed conversation_protocol.py unwrap_err() → .error (2 locations)
      
      Files Modified:
      - tests/unit/core/orchestrator/test_event_integration.py
      - tests/unit/core/orchestrator/test_oc_004_01_integration.py  
      - src/core/orchestrator/conversation_protocol.py
      - tests/conftest.py (added reset_governance_singleton fixture)
    
    acceptance_criteria_tests:
