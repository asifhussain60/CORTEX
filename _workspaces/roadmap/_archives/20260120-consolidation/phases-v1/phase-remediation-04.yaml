  - ac_id: "AC-FIX-008-01"
    title: "Fix database connection management in ConversationProtocol (FINDING-002)"
    priority: "P0 - CRITICAL"
    category: "Brittleness - Database Lifecycle"
    issue_reference: "ISSUE-003, FINDING-002"
    status: "COMPLETED ✅"
    completed_at: "2026-01-17"
    blocking_tests_before: 81
    blocking_tests_after: 18
    tests_fixed: 63
    
    description: |
      FINDING-002: ConversationProtocol database retry loops without proper error handling.
      
      ORIGINAL PROBLEM:
      81 orchestrator tests failing with:
      "Turn execution failed (transaction rolled back): unable to open database file"
      
      All failures showed same error pattern:
      - Database connection errors in execute_turn()
      - Tests hardcoded production database path
      - No test database isolation
      - Schema mismatch in DatabaseTransactionManager
      
      ROOT CAUSE IDENTIFIED:
      1. ❌ Tests used production database (cortex_brain/state/governance.db)
      2. ❌ No test database isolation (state leakage between tests)
      3. ❌ DatabaseTransactionManager schema didn't match production
      4. ❌ ConversationProtocol didn't accept db_path parameter
      
      SOLUTION IMPLEMENTED:
      1. ✅ Added test_db_path fixture (isolated temp database per test)
      2. ✅ Added patch_conversation_protocol_db autouse fixture
      3. ✅ Modified ConversationProtocol.__init__ to accept optional db_path
      4. ✅ Fixed DatabaseTransactionManager schema to match production
      5. ✅ Added isolated_transaction_manager fixture
      6. ✅ Added isolated_database_manager fixture
      
      Files Modified:
      - tests/conftest.py (AC-FIX-008-01 fixtures)
      - src/core/orchestrator/conversation_protocol.py (db_path parameter)
      - src/infrastructure/database_transaction_manager.py (schema fix)
    
    acceptance_criteria_tests:
      - "✅ Create test database isolation (tmp_path per test)"
      - "✅ Add autouse fixture for automatic patching"
      - "✅ Fix DatabaseTransactionManager schema"
      - "✅ Add db_path parameter to ConversationProtocol"
      - "✅ 63 tests fixed (from 81 failures)"
      - "✅ 137 tests passing (88% success rate)"
      - "✅ Zero database connection errors in test suite"
    
    estimated_hours: 4
    actual_hours: 2
    effort: "2h"
    
    results: |
      BEFORE FIX:
      $ pytest tests/unit/core/orchestrator/ -q
      ======================== 81 failed, 74 passed =========================
      
      AFTER FIX:
      $ pytest tests/unit/core/orchestrator/ -q
      ======================== 18 failed, 137 passed in 3.59s ==============
      
      ✅ SUCCESS: 63 tests fixed (78% reduction in failures)
      ✅ SUCCESS: 88% test suite passing
      ✅ SUCCESS: Zero database connection errors
      
      Remaining 18 failures: Event integration logic errors (separate AC needed)
    
    evidence:
      completion_report: ".github/roadmap/reports/AC-FIX-008-01-COMPLETION-REPORT.md"
      test_results: |
        $ pytest tests/unit/core/orchestrator/test_conversation_protocol.py -v
