acceptance_criteria:
  
  # ===========================================================================
  # COMPLETED ACs - Race Condition Prevention
  # ===========================================================================
  
  - ac_id: "AC-FIX-007-01"
    title: "Add MAX_ITERATIONS guards to all while True loops in test mocks"
    priority: "P0 - CRITICAL"
    category: "Brittleness - Infinite Loop Prevention"
    issue_reference: "ISSUE-003, FINDING-001"
    status: "COMPLETED ✅"
    completed_at: "2026-01-17"
    
    description: |
      FINDING-001: Test mock orchestrators contain while True loops without safety limits.
      
      SOLUTION IMPLEMENTED:
      1. Added MAX_WORKFLOW_ITERATIONS = 100 to MasterOrchestrator test mock
      2. Added MAX_DOMAIN_ITERATIONS = 50 to MasterOrchestrator test mock
      3. Added MAX_TURN_ITERATIONS = 50 to WrappedOrchestrator test mock
      4. Added iteration counters in all loops
      5. Added explicit error messages when limits exceeded
      
      Files Modified:
      - tests/unit/core/orchestrator/test_master_orchestrator.py
      - tests/unit/core/orchestrator/test_wrapped_orchestrators.py
    
    acceptance_criteria_tests:
      - "✅ MAX_WORKFLOW_ITERATIONS = 100 added to MasterOrchestrator"
      - "✅ MAX_DOMAIN_ITERATIONS = 50 added to MasterOrchestrator"
      - "✅ MAX_TURN_ITERATIONS = 50 added to WrappedOrchestrator"
      - "✅ Iteration counters added in all while loops"
      - "✅ Explicit error messages on iteration limit exceeded"
      - "✅ Tests complete without hanging (0.14s for 155 tests)"
    
    test_results:
      before: "Tests hung indefinitely, required kill -9"
      after: "155 tests complete in 0.14 seconds (74 passed, 81 failed on DB errors)"
      improvement: "Infinite hangs → instant completion with timeout protection"
    
    estimated_hours: 1
    actual_hours: 1
    effort: "1h"
    
    git_checkpoint_after: "AC-FIX-007-01: Add MAX_ITERATIONS guards - COMPLETE"
    
    test_files_modified:
      - "tests/unit/core/orchestrator/test_master_orchestrator.py"
      - "tests/unit/core/orchestrator/test_wrapped_orchestrators.py"
    
    verification: |
      ✅ All iteration guards in place:
      $ grep "MAX_.*_ITERATIONS" tests/unit/core/orchestrator/test_*.py
      test_master_orchestrator.py:    MAX_WORKFLOW_ITERATIONS = 100
      test_master_orchestrator.py:    MAX_DOMAIN_ITERATIONS = 50
      test_wrapped_orchestrators.py:    MAX_TURN_ITERATIONS = 50
      
      ✅ Tests complete without hanging:
      $ python -m pytest tests/unit/core/orchestrator/ -q
      ======================== 81 failed, 74 passed in 0.14s =========================

  - ac_id: "AC-FIX-007-02"
    title: "Fix Result API error handling (result.error vs unwrap_err())"
    priority: "P1 - HIGH"
    category: "API Correctness"
    issue_reference: "ISSUE-003, FINDING-001"
    status: "COMPLETED ✅"
    completed_at: "2026-01-17"
    
    description: |
      PROBLEM: Tests incorrectly used result.unwrap_err() which doesn't exist.
      
      SOLUTION IMPLEMENTED:
      Changed all occurrences from:
        return Err(result.unwrap_err())  # ❌ Wrong
      To:
        return Err(result.error)  # ✅ Correct
      
      Files Modified:
      - tests/unit/core/orchestrator/test_master_orchestrator.py (3 locations)
      - tests/unit/core/orchestrator/test_wrapped_orchestrators.py (1 location)
    
    acceptance_criteria_tests:
      - "✅ All unwrap_err() calls replaced with .error attribute"
      - "✅ Tests using Result.error compile without AttributeError"
      - "✅ Error propagation works correctly"
    
    estimated_hours: 0.5
    actual_hours: 0.5
    effort: "30m"
    
    verification: |
      ✅ No more unwrap_err() calls:
      $ grep "unwrap_err" tests/unit/core/orchestrator/test_*.py
      (no results)
      
      ✅ Correct .error usage:
      $ grep "result.error" tests/unit/core/orchestrator/test_*.py
      (4 correct usages found)

  - ac_id: "AC-FIX-007-03"
    title: "Add pytest-timeout configuration and per-module markers"
    priority: "P0 - CRITICAL"
    category: "Test Infrastructure"
    issue_reference: "ISSUE-003, FINDING-003"
    status: "COMPLETED ✅"
    completed_at: "2026-01-17"
    
    description: |
      FINDING-003: No pytest timeout configuration, tests could hang indefinitely.
      
      SOLUTION IMPLEMENTED:
      1. Added global timeout=30 to pytest.ini
      2. Added timeout_method=thread to pytest.ini
      3. Added per-module timeout markers (10s for orchestrator tests)
      
      Files Modified:
      - pytest.ini
      - tests/unit/core/orchestrator/test_master_orchestrator.py
      - tests/unit/core/orchestrator/test_wrapped_orchestrators.py
    
    acceptance_criteria_tests:
      - "✅ Global timeout=30 added to pytest.ini"
      - "✅ timeout_method=thread configured"
      - "✅ Per-module timeout markers added (10s for orchestrators)"
      - "✅ All tests protected from indefinite hangs"
      - "✅ CI/CD pipelines protected"
    
    test_results:
      protection_level: "Double protection (global 30s + module 10s)"
      orchestrator_tests: "155 tests complete in 0.14s (well under 10s limit)"
      benefit: "CI/CD pipelines no longer blocked by hung tests"
    
    estimated_hours: 0.5
    actual_hours: 0.5
    effort: "30m"
    
    verification: |
      ✅ Global timeout configured:
      $ grep -A2 "Timeout" pytest.ini
      # Timeout settings (prevent hanging tests)
      timeout = 30
      timeout_method = thread
      
      ✅ Module timeout markers:
      $ grep "pytestmark.*timeout" tests/unit/core/orchestrator/test_*.py
      test_master_orchestrator.py:pytestmark = pytest.mark.timeout(10)
      test_wrapped_orchestrators.py:pytestmark = pytest.mark.timeout(10)

  # ===========================================================================
  # PENDING AC - Database Connection Management
