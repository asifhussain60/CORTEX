    - Ambiguous → Back to Interaction for clarification (DEFAULT)\n\nSTAGE 3 - KNOWLEDGE\
    \ INTEGRATION:\n- Load company domain specifications from cortex_brain/\n- Load\
    \ CORTEX rules from tier0/governance/\n- COMPANY OVERRIDES CORTEX (intelligent\
