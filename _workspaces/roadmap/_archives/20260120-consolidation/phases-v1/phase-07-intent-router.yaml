- ac_id: IR-006-02
  title: Additive Merge with Selective Override & Priority Protection
  description: 'ENHANCED MERGE ALGORITHM: Additive merge with selective override.

    - All non-conflicting CORTEX rules are ALWAYS applied

    - Company overrides ONLY where there''s a conflict

    - CRITICAL CORTEX rules cannot be overridden

    - Scope-aware override (partial overrides supported)

    - Merge happens BEFORE comprehension (not after)

    '
  status: NOT_STARTED
  acceptance_tests:
  - CORTEX rules loaded as baseline (Set A)
  - Company rules loaded for overlay (Set B)
  - Non-conflicting CORTEX rules ALWAYS preserved
  - 'Conflicting rules: Company wins UNLESS CORTEX is CRITICAL'
  - CRITICAL CORTEX rules cannot be overridden by Company
  - 'Scope-aware: partial override respects applies_to boundaries'
  - Merge happens at START of Stage 1 (before comprehension)
  - User sees FINAL merged ruleset in comprehension YAML
  - Override audit trail with rationale for each decision
  implementation_details: "ADDITIVE MERGE WITH SELECTIVE OVERRIDE\n======================================\n\
    \nExample:\n```\nCORTEX (Set A): [A1, A2, A3, A4, A5]  (5 rules)\nCOMPANY (Set\
    \ B): [B2, B4]              (2 overrides)\n\nResult: [A1, B2, A3, B4, A5]  ← 5\
    \ rules total!\nNOT:    [B2, B4]              ← WRONG (replacement)\n```\n\nPriority\
    \ Levels:\n```python\nclass RulePriority(Enum):\n    CRITICAL = 100    # CORTEX:\
    \ Cannot be overridden (security, compliance)\n    MANDATORY = 80    # CORTEX:\
    \ Can be overridden with warning\n    STANDARD = 50     # Normal rules, freely\
    \ overridable\n    ADVISORY = 20     # Suggestions, easily overridable\n```\n\n\
    Enhanced Merge Algorithm:\n```python\ndef additive_merge_with_selective_override(\n\
    \    cortex_rules: List[DomainRule],\n    company_rules: List[DomainRule]\n) ->\
    \ MergedRuleset:\n    \"\"\"\n    ADDITIVE merge - keeps ALL non-conflicting rules\
    \ from BOTH sets.\n    SELECTIVE override - Company wins conflicts (except CRITICAL).\n\
    \    SCOPE-AWARE - partial overrides respect applies_to boundaries.\n    \"\"\"\
    \n    merged = MergedRuleset()\n    audit = MergeAuditLog()\n    \n    # Index\
    \ by (rule_category, applies_to_scope)\n    cortex_index = index_by_scope(cortex_rules)\n\
    \    company_index = index_by_scope(company_rules)\n    \n    all_scopes = set(cortex_index.keys())\
    \ | set(company_index.keys())\n    \n    for scope in all_scopes:\n        cortex_rule\
    \ = cortex_index.get(scope)\n        company_rule = company_index.get(scope)\n\
    \        \n        if cortex_rule and company_rule:\n            # CONFLICT detected\n\
    \            if cortex_rule.priority == RulePriority.CRITICAL:\n             \
    \   # CRITICAL cannot be overridden\n                merged.add(cortex_rule)\n\
    \                audit.log(MergeDecision(\n                    scope=scope,\n\
    \                    winner=\"CORTEX\",\n                    reason=\"CRITICAL\
    \ rule - cannot override\",\n                    cortex_rule=cortex_rule,\n  \
    \                  company_rule=company_rule,\n                    company_rule_rejected=True\n\
    \                ))\n            else:\n                # Company wins (selective\
    \ override)\n                merged.add(company_rule)\n                audit.log(MergeDecision(\n\
    \                    scope=scope,\n                    winner=\"COMPANY\",\n \
    \                   reason=\"Company override accepted\",\n                  \
    \  cortex_rule=cortex_rule,\n                    company_rule=company_rule\n \
    \               ))\n        elif cortex_rule:\n            # Only CORTEX has rule\
    \ - ALWAYS include (additive)\n            merged.add(cortex_rule)\n         \
    \   audit.log(MergeDecision(\n                scope=scope,\n                winner=\"\
    CORTEX\",\n                reason=\"No company override - CORTEX preserved\"\n\
    \            ))\n        else:\n            # Only Company has rule - include\
    \ (additive)\n            merged.add(company_rule)\n            audit.log(MergeDecision(\n\
    \                scope=scope,\n                winner=\"COMPANY\",\n         \
    \       reason=\"New company rule - added to merged set\"\n            ))\n  \
    \  \n    merged.audit_log = audit\n    merged.stats = MergeStats(\n        cortex_preserved=audit.count_cortex_preserved(),\n\
    \        company_overrides=audit.count_company_wins(),\n        company_additions=audit.count_company_new(),\n\
    \        critical_protected=audit.count_critical_protected()\n    )\n    return\
    \ merged\n```\n\nScope-Aware Override Example:\n```yaml\n# CORTEX rule (broad\
    \ scope)\n- rule_id: \"CORTEX-TEST-001\"\n  description: \"Test coverage >= 80%\"\
    \n  applies_to: [\"all_code\"]\n  priority: STANDARD\n  \n# Company rule (narrow\
    \ scope override)\n- rule_id: \"COMPANY-TEST-001\"\n  description: \"Test coverage\
    \ >= 95%\"\n  applies_to: [\"production_code\"]  # Narrower!\n  priority: STANDARD\n\
    \n# MERGED RESULT:\n# - production_code: 95% (Company override)\n# - non_production_code:\
    \ 80% (CORTEX still applies!)\n```\n\nMerge Timing (CRITICAL):\n```\n┌─────────────────────────────────────────────────────────┐\n\
    │  ★ MERGE HAPPENS FIRST (Before ANY comprehension)      │\n│                \
    \                                         │\n│  1. Load CORTEX rules from tier0/governance/\
    \            │\n│  2. Load Company rules from cortex_brain/               │\n\
    │  3. Execute additive_merge_with_selective_override()    │\n│  4. MERGED_RULES\
    \ available for entire request lifecycle │\n└─────────────────────────────────────────────────────────┘\n\
    \                        │\n                        ▼\n┌─────────────────────────────────────────────────────────┐\n\
    │  STAGE 1: Comprehension (uses MERGED_RULES)             │\n│  - User sees final\
    \ merged ruleset                       │\n│  - No surprises between comprehension\
    \ and execution     │\n└─────────────────────────────────────────────────────────┘\n\
    ```\n\nFiles to Create:\n- src/core/knowledge/additive_merger.py\n- src/core/knowledge/rule_priority.py\n\
    - src/core/knowledge/scope_matcher.py\n- src/core/knowledge/merge_audit_log.py\n"
  verification_method: 'Tests in tests/unit/core/knowledge/test_additive_merger.py:

    - TestAdditivePreservation: Non-conflicting CORTEX rules kept

    - TestSelectiveOverride: Company wins conflicts

    - TestCriticalProtection: CRITICAL rules cannot be overridden

    - TestScopeAwareOverride: Partial override respects boundaries

    - TestMergeTiming: Merge before comprehension verified

    - TestAuditLogging: All decisions logged with rationale

    '
