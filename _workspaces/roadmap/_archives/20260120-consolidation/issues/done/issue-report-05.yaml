findings:

  # =========================================================================
  # FINDING-001: CRITICAL - Orchestrator State Management Ambiguity
  # =========================================================================
  - id: "FINDING-001"
    agent: "cortex-review-brittleness"
    severity: "CRITICAL"
    category: "brittleness"
    rule_violated: "CORE-027, AC-AR-006-01"
    
    title: "Orchestrator state transitions lack explicit atomicity guarantees"
    description: |
      The MasterOrchestrator and ConversationProtocol coordinate turn execution
      with per-turn governance validation and audit logging, but the transition
      from executing state to completed/errored state is not atomic.
      
      **Problem**: If audit logger fails after operation completes but before
      AC_COMPLETE is logged, the AC appears stuck in EXECUTING state.
      
      **Risk**: Under high load or database contention:
      - Operations appear incomplete when they succeeded
      - Automatic recovery retries may re-execute already-completed actions
      - Audit trail shows false execution failures
      - Governance violations reported for compliant operations
      
      **Historical Precedent**: CORTEX 4.0/5.0 had identical state corruption
      issues that surfaced under load testing in PHASE-14.
    
    evidence:
      source: "code_analysis"
      files_affected:
        - path: "src/orchestrators/core/master_orchestrator.py"
          lines: "95-180"
          issue: "Operation context set but no transactional boundary"
        - path: "src/core/orchestrator/conversation_protocol.py"
          lines: "50-100"
          issue: "Turn execution and audit logging decoupled"
        - path: "src/infrastructure/audit_logger.py"
          lines: "140-200"
          issue: "SQLite writes committed independently, no 2-phase commit"
    
    impact:
      production_risk: |
        CRITICAL - State corruption visible in production would:
        1. Break AC lifecycle tracking
        2. Cause governance violations on resume
        3. Trigger cascading error handling
        4. Lose audit trail continuity for replay
      user_impact: |
        Users would see:
        - "Operation failed" when it actually succeeded
        - Manual retries applied to already-completed actions
        - Inconsistent governance audit reports
      maintenance_burden: "HIGH - root cause analysis difficult due to race conditions"
    
    remediation:
      effort: "1d"
      approach: |
        1. Wrap operation execution + audit logging in single DB transaction
        2. Use SQLite savepoints for nested operations
        3. Implement AC state machine with explicit transitions:
           - PENDING → EXECUTING → (COMPLETE or FAILED)
           - No re-entry from COMPLETE or FAILED states
        4. Add transactional boundary test cases
      blockers: "Requires coordination with ConversationProtocol redesign"
      ac_id_suggested: "AC-FIX-001-01"
    
    traceability:
      related_acs: ["AC-AR-006-01", "AC-REM-002-04"]
      related_phases: ["PHASE-16", "PHASE-REMEDIATION-02"]
      related_rules: ["CORE-027"]

  # =========================================================================
  # FINDING-002: CRITICAL - Governance Validation Timing Window
  # =========================================================================
  - id: "FINDING-002"
    agent: "cortex-review-governance"
    severity: "CRITICAL"
    category: "governance"
    rule_violated: "CORE-027"
    
    title: "Race condition in per-turn governance validation"
    description: |
      AC-REM-002-04 implements per-turn governance validation, but the validation
      occurs AFTER the turn is already executing, not BEFORE.
      
      **Problem**:
      1. ConversationProtocol.execute_turn() executes orchestrator code
      2. THEN calls governance_registry.validate_turn()
      3. If governance violation detected, turn already modified state
      
      **Risk**: Orchestrator could:
      - Query external APIs
      - Modify in-memory state
      - Generate AI responses
      - Then get stopped by governance - but changes are already made
      
      **Observability Gap**: No way to know if violation was caught pre- or post-execution
    
    evidence:
      source: "code_analysis"
      files_affected:
        - path: "src/core/orchestrator/conversation_protocol.py"
          lines: "187-222"
          issue: "execute_turn() runs before governance check"
        - path: "src/core/governance_registry.py"
          lines: "80-150"
          issue: "validate_turn() is post-execution check"
      pattern: |
        # WRONG ORDER:
        result = orchestrator.execute_turn(context)  # ← Already executed
        validation = governance_registry.validate_turn(context)  # ← Now checked
        if not validation.passed:
            # Too late - turn already executed
    
    impact:
      production_risk: |
        CRITICAL - Governance violations would not be prevented, only detected
        after the fact. This violates CORE-027 which requires governance GATES,
        not just governance LOGS.
      user_impact: |
        Users could see:
        - Operations completing before governance approval
        - Unauthorized actions executed then rolled back
        - Audit trail showing violations happened
      maintenance_burden: "HIGH - Must trace through execution to find what was modified"
    
    remediation:
      effort: "4h"
      approach: |
        1. Shift governance validation to PRE-execution phase
        2. Create GovernancePregate interface with pre-execution checks:
           - Resource quota checks
           - Operation authorization
           - Tier access validation
        3. Only call orchestrator.execute_turn() if pregate passes
        4. Add test cases for governance rejection scenarios
      blockers: "Affects ConversationProtocol API contract"
      ac_id_suggested: "AC-FIX-002-01"
    
    traceability:
      related_acs: ["AC-REM-002-04"]
      related_phases: ["PHASE-16", "PHASE-REMEDIATION-02"]
      related_rules: ["CORE-027"]

  # =========================================================================
  # FINDING-003: HIGH - Missing Exception Context in Orchestrators
  # =========================================================================
  - id: "FINDING-003"
    agent: "cortex-review-brittleness"
    severity: "HIGH"
    category: "brittleness"
    rule_violated: "CORE-013"
    
    title: "Orchestrator exception handlers use generic Exception without re-raise"
    description: |
      Multiple orchestrator exception handlers catch Exception broadly and log
      but don't re-raise, causing error information to be lost in logs while
      callers receive Ok(None) instead of Err(...).
      
      **Pattern Found**:
      ```python
      except Exception as e:
          logger.error(f"Error: {e}")
          return Ok("operation completed")  # ← Hides error
      ```
      
      **Risk**:
      - Caller doesn't know operation failed
      - Error handling logic bypassed
      - Audit trail shows success when failed
      - Cascading failures in dependent operations
    
    evidence:
      source: "grep_search"
      query: "except Exception as e:.*logger"
      files_affected:
        - path: "src/core/orchestrator/conversation_protocol.py"
          lines: [187, 222, 368, 802, 826, 847, 878, 962, 1069]
          count: 9
        - path: "src/orchestrators/domain/planning_orchestrator.py"
          lines: [89]
          count: 1
        - path: "src/observability/audit_trail.py"
          lines: [164, 203, 235, 319, 401, 450]
          count: 6
    
    impact:
      production_risk: |
        HIGH - Silent failures would propagate through system:
        - User requests appear to complete
        - Underlying operations failed
        - Dependent operations proceed with invalid state
        - Cascading failures difficult to diagnose
      user_impact: "Users see successful responses for failed operations"
      maintenance_burden: "MEDIUM - Errors must be discovered through side effects"
    
    remediation:
      effort: "4h"
      approach: |
        1. Audit all except Exception handlers
        2. Add check: if error should stop execution, re-raise or return Err()
        3. Only silent-catch if operation is side-effect and retry possible
        4. Add Result[T] pattern consistently
        5. Update 15 identified locations
      test_required: true
      ac_id_suggested: "AC-FIX-003-01"
    
    traceability:
      related_acs: ["AC-AR-006-01"]
      related_phases: ["PHASE-16"]
      related_rules: ["CORE-013"]

  # =========================================================================
  # FINDING-004: HIGH - Hallucination Risk in Prompt Templates
  # =========================================================================
  - id: "FINDING-004"
    agent: "cortex-review-hallucination"
    severity: "HIGH"
    category: "hallucination"
    rule_violated: "CORE-025 (Confidence Thresholds)"
    
    title: "Response templates interpolate user input without sanitization"
    description: |
      Response templates in cortex_brain/tier2/response-templates/ use string
      interpolation for dynamic content (AC-IDs, operation names, etc.) but
      don't validate template structure before injection.
      
      **Risk**: Malicious or malformed input could:
      - Inject YAML structure breaking the response
      - Inject prompt instructions overriding template intent
      - Generate hallucinated guidance by breaking parsing
      
      **Example**:
      ```yaml
      operation: "{operation_name}"  # ← User-controlled, unsanitized
      details: "{user_provided_details}"  # ← Could contain YAML syntax
      ```
    
    evidence:
      source: "code_analysis"
      files_affected:
        - path: "cortex_brain/tier2/response-templates/"
          issue: "Glob pattern shows 8+ template files with interpolation"
        - path: "src/core/response_header_injector.py"
          lines: "40-80"
          issue: "No input validation before template substitution"
    
    impact:
      production_risk: |
        HIGH - Prompt injection vectors could cause:
        - Hallucinated incorrect guidance
        - Override governance validation responses
        - Generate misleading audit logs
        - Manipulate CORTEX decision-making
      user_impact: "Users receive incorrect or misleading responses from CORTEX"
      maintenance_burden: "HIGH - Requires audit log analysis to detect"
    
    remediation:
      effort: "4h"
      approach: |
        1. Add YAML-safe string escaping for all template interpolations
        2. Validate all user-provided input against whitelist
        3. Use safe templating library (Jinja2 with autoescape)
        4. Add integration tests for injection attempts
      blockers: "Requires coordination with ResponseHeaderInjector redesign"
      ac_id_suggested: "AC-FIX-004-01"
    
    traceability:
      related_acs: ["AC-ENH-002-01"]
      related_phases: ["PHASE-16"]
      related_rules: ["CORE-025"]

  # =========================================================================
  # FINDING-005: HIGH - Type Hint Coverage Gap in Core Module
  # =========================================================================
  - id: "FINDING-005"
    agent: "cortex-review-governance"
    severity: "HIGH"
    category: "governance"
    rule_violated: "CORE-011"
    
    title: "Functions missing return type hints in core modules"
    description: |
      CORE-011 requires type hints on all function signatures. Scanning identified
      16+ files with functions missing return type annotations.
      
      **Pattern**:
      ```python
      def query_domain(self, domain_id: str):  # ← Missing -> Type
          # Should be: def query_domain(self, domain_id: str) -> Dict[str, Any]:
      ```
      
      **Risk**:
      - Type checker cannot validate caller assumptions
      - Documentation incomplete for consumers
      - Regression: Similar pattern was flagged in PHASE-14
    
    evidence:
      source: "code_analysis"
      query: "find src -name '*.py' | xargs grep -l 'def.*:$'"
      result: "16 matches in src/ directory"
      severity_threshold: "GOVERNANCE violation if >5% of functions affected"
      current_status: "~0.5% affected = COMPLIANT but trending"
    
    impact:
      production_risk: "MEDIUM - Type errors not caught at development time"
      user_impact: "Internal only - affects developer experience"
      maintenance_burden: "LOW - Quick fix with mypy validation"
    
    remediation:
      effort: "1h"
      approach: |
        1. Run mypy --strict on src/ to identify all missing hints
        2. Add return type to each function
        3. Verify with mypy
        4. Add pre-commit hook to catch future violations
      test_required: false
      ac_id_suggested: "AC-FIX-005-01"
    
    traceability:
      related_acs: []
      related_phases: ["PHASE-16"]
      related_rules: ["CORE-011"]

  # =========================================================================
  # FINDING-006: MEDIUM - Database Connection Pool Exhaustion Risk
  # =========================================================================
  - id: "FINDING-006"
    agent: "cortex-review-brittleness"
    severity: "MEDIUM"
    category: "brittleness"
    rule_violated: "None (Design Pattern)"
    
    title: "SQLite database connections not explicitly closed in error paths"
    description: |
      AuditLogger and DatabaseManager create SQLite connections but don't
      guarantee closure if exceptions occur between open() and close().
      
      **Pattern**:
      ```python
      conn = sqlite3.connect(db_path)
      cursor = conn.cursor()
      cursor.execute(query)  # ← Exception here leaves conn open
      conn.close()           # ← Never reached
      ```
      
      **Risk**: Under sustained load (high audit throughput):
      - SQLite file handle exhaustion
      - "database is locked" errors
      - Memory leak in long-running processes
    
    evidence:
      source: "code_analysis"
      files_affected:
        - path: "src/infrastructure/audit_logger.py"
          lines: "200-250"
          issue: "SQLite connection lifecycle not wrapped"
        - path: "src/infrastructure/database.py"
          lines: "50-120"
          issue: "Some paths use context managers, others don't"
    
    impact:
      production_risk: |
        MEDIUM - Under load testing (high AC throughput), system would:
        - Fail with "database is locked" intermittently
        - Degrade gradually as file handles leak
        - Recover only after restart
      user_impact: "Intermittent governance validation failures"
      maintenance_burden: "MEDIUM - Root cause requires profiling"
    
    remediation:
      effort: "1h"
      approach: |
        1. Wrap all SQLite operations in context managers (with statement)
        2. Verify all except paths have proper cleanup
        3. Add connection pool metrics to observability
        4. Load test with 10x expected throughput
      test_required: true
      ac_id_suggested: "AC-FIX-006-01"
    
    traceability:
      related_acs: []
      related_phases: ["PHASE-16"]
      related_rules: []

  # =========================================================================
