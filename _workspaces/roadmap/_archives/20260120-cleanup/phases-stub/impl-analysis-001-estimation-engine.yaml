    - "cortex/orchestrators/domain/planning_orchestrator.py (exposes estimates)"

rationale:
  
  problem: |
    CORTEX lacks data-driven effort estimation. Current cortex-impl-map.yaml 
    has manual guesses (12h, 4-6 days). No senior-level SWAG methodology.
    Cannot answer: complexity, test gaps, governance impact, team sizing.
  
  solution: |
    Build EstimationEngine consuming CORTEX LENS intelligence (git, AST, 
    comments, relationships) to produce calibrated effort estimates with 
    confidence intervals and component breakdowns.
  
  benefits: |
    - Effort estimates grounded in code metrics, not guesses
    - Identifies hidden complexity (test gaps, governance violations) early
    - Enables data-driven sprint planning and team sizing
    - Feeds into ROI analysis (reliable effort → reliable ROI)
    - Supports MasterOrchestrator routing decisions

