    - "impl-analysis-002-team-optimizer (needs EstimationEngine)"
    - "impl-analysis-003-sprint-planner (needs EstimationEngine)"
  
  requires:
    - "cortex/brain/domain_brain/ (AST processor)"
    - "pytest --cov (test coverage data)"
    - "cortex/core/governance/core-rules.yaml (rule definitions)"
  
  related:
