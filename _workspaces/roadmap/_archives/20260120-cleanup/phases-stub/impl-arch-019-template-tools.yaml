# CORTEX Implementation Phase: Template Tools & Content
# Phase ID: impl-arch-019-template-tools
# Priority: P2
# Date: 2026-01-20

metadata:
  phase_id: "impl-arch-019-template-tools"
  title: "Template Tools - Code & Configuration Generation"
  description: "Template engine for code generation, configuration scaffolding, and boilerplate"
  priority: "P2"
  estimated_effort: "4-6 days"
  status: "NOT_STARTED"
  locked: false

objective:
  summary: "Enable rapid scaffolding and boilerplate generation through templates"
  business_value: "Accelerates development, ensures consistency, reduces manual coding errors"

acceptance_criteria:
  - id: "TEMPLATE-001-01"
    description: "Template engine renders code from templates"
    verification:
      - "TemplateEngine.render(template_id, context) → code"
      - "Jinja2-based template syntax"
      - "Template variables and conditionals"
      - "Template inheritance and composition"
      - "Template validation before render"
    tests:
      - "test_template_engine_render()"
      - "test_template_engine_variables()"
      - "test_template_engine_inheritance()"

  - id: "TEMPLATE-001-02"
    description: "Template registry manages available templates"
    verification:
      - "TemplateRegistry.list_templates(category)"
      - "Template categories (module, class, test, config)"
      - "Template versioning"
      - "Template metadata (description, parameters)"
      - "Custom template registration"
    tests:
      - "test_template_registry_list()"
      - "test_template_registry_versioning()"
      - "test_template_registry_custom()"

  - id: "TEMPLATE-001-03"
    description: "Generator creates scaffolded code"
    verification:
      - "ScaffoldGenerator.generate_module(name, template)"
      - "File structure creation"
      - "Multi-file generation (module + tests + docs)"
      - "Dependency injection setup"
      - "Configuration scaffolding"
    tests:
      - "test_scaffold_module_generation()"
      - "test_scaffold_multi_file()"
      - "test_scaffold_configuration()"

  - id: "TEMPLATE-001-04"
    description: "Template validation ensures correctness"
    verification:
      - "TemplateValidator.validate(template)"
      - "Syntax validation (Python, YAML, JSON)"
      - "Variable placeholder validation"
      - "Type hints validation"
      - "Docstring presence checking"
    tests:
      - "test_template_validation_syntax()"
      - "test_template_validation_variables()"
      - "test_template_validation_hints()"

  - id: "TEMPLATE-001-05"
    description: "Customization allows template adaptation"
    verification:
      - "TemplateCustomizer.customize(template, overrides)"
      - "Parameter override"
      - "Conditional section inclusion"
      - "Style customization"
      - "Save custom templates"
    tests:
      - "test_template_customization_params()"
      - "test_template_customization_conditionals()"
      - "test_template_customization_save()"

  - id: "TEMPLATE-001-06"
    description: "Template marketplace enables sharing"
    verification:
      - "TemplateMarketplace.search(query)"
      - "Community template discovery"
      - "Template ratings and reviews"
      - "Template versioning and updates"
      - "License compliance checking"
    tests:
      - "test_marketplace_search()"
      - "test_marketplace_ratings()"

implementation:
  files_to_create:
    - path: "cortex/tools/templates/engine.py"
      loc: 200
      classes:
        - name: "TemplateEngine"
          methods:
            - "render(template_id, context)"
            - "validate_template(template)"

    - path: "cortex/tools/templates/registry.py"
      loc: 150
      classes:
        - name: "TemplateRegistry"
          methods:
            - "list_templates(category)"
            - "get_template(template_id)"
            - "register_template(template)"

    - path: "cortex/tools/templates/generator.py"
      loc: 200
      classes:
        - name: "ScaffoldGenerator"
          methods:
            - "generate_module(name, template)"
            - "generate_multi_file(name, templates)"

    - path: "cortex/tools/templates/validator.py"
      loc: 150
      classes:
        - name: "TemplateValidator"
          methods:
            - "validate(template)"

    - path: "cortex/tools/templates/customizer.py"
      loc: 120
      classes:
        - name: "TemplateCustomizer"
          methods:
            - "customize(template, overrides)"
            - "save_custom(template)"

    - path: "tests/unit/tools/templates/test_templates.py"
      loc: 200
      test_count: 15

    - path: "tests/integration/tools/test_templates_integration.py"
      loc: 150
      test_count: 10

governance:
  compliance:
    - "CORE-008: TDD"
    - "CORE-011: Type hints"

testing_strategy:
  unit_tests: 15
  integration_tests: 10

dependencies:
  requires:
    - "impl-arch-008-orchestrators"

success_metrics:
  - "Template rendering <500ms"
  - "Generated code passes linting 100%"
  - "Template validation latency <100ms"
