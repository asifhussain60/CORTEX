governance_enforcement:
  CORE_008_TDD:
    requirement: "Tests before implementation"
    action: "Review test expectations before each module implementation"
    verification: "100% of tests reviewed"
  
  CORE_011_TYPE_HINTS:
    requirement: "All function signatures typed"
    action: "Add type hints to every parameter and return type"
    forbidden: "Untyped functions, use of Any"
    verification: "Automated lint check - 100% coverage required"
  
  CORE_012_DOCSTRINGS:
    requirement: "Google-style docstrings"
    format: |
      """One-line summary.
      
      Longer description if needed.
      
      Args:
          param_name: Description.
      
      Returns:
          Description of return value.
      
      Raises:
          ExceptionType: When raised.
      """
    verification: "Public APIs have docstrings, internal APIs have minimal docs"
  
  CORE_013_EXCEPTIONS:
    requirement: "No bare except: or except Exception:"
    action: "Use specific exception types only"
    example: "except (ValueError, TypeError):"
    verification: "Code review - 100% specificity"
  
  CORE_026_GIT_CHECKPOINTS:
    requirement: "Git checkpoint before and after each phase"
    before_phase: "git commit -m 'checkpoint: before phase-X'"
    after_phase: "git commit -m 'complete: phase-X'"
    verification: "Git log shows all checkpoints"

risk_mitigation:
  
  risk_1_dependency_deadlock:
    description: "Module A depends on B, B depends on A"
    probability: "MEDIUM (orchestrator ecosystem)"
    mitigation: "Use Protocol/ABC to break circular dependencies"
    action: "Analyze dependency graph before Phase 1"
  
  risk_2_cascading_failures:
    description: "Implementation of X breaks tests for Y"
    probability: "MEDIUM"
    mitigation: "Run tests after each phase and adjust"
    action: "Maintain failing test list, fix iteratively"
  
  risk_3_governance_violations:
    description: "Missing type hints or docstrings"
    probability: "LOW (strict enforcement)"
    mitigation: "Automated code review before merge"
    action: "Use pylance + custom linting"
  
  risk_4_scope_creep:
    description: "Trying to do all 125 modules at once"
    probability: "LOW (phased approach)"
    mitigation: "Strict adherence to P0→P1→P2→P3→P5 sequence"
    action: "No deviation - block P1 until P0 complete"

