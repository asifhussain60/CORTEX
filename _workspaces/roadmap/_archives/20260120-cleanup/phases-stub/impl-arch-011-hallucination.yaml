# CORTEX Implementation Phase: Hallucination Prevention
# Phase ID: impl-arch-011-hallucination
# Priority: P0
# Date: 2026-01-20

metadata:
  phase_id: "impl-arch-011-hallucination"
  title: "Hallucination Prevention & Fact Validation"
  description: "Multi-layer validation to prevent LLM hallucinations and ensure factual accuracy"
  priority: "P0"
  estimated_effort: "7-9 days"
  status: "NOT_STARTED"
  locked: false

objective:
  summary: "Build comprehensive hallucination detection and prevention system with multiple validation layers"
  business_value: "Increases confidence in AI-generated code, documentation, and analysis"

acceptance_criteria:
  - id: "HALLUC-PREV-001-01"
    description: "Fact checker validates generated claims against codebase"
    verification:
      - "FactChecker.verify_claim(claim) → (valid, evidence)"
      - "Codebase search for supporting evidence"
      - "Historical data validation"
      - "Type system conformance check"
      - "Confidence scoring (0-1)"
    tests:
      - "test_fact_checker_code_validation()"
      - "test_fact_checker_type_conformance()"
      - "test_fact_checker_confidence_scoring()"

  - id: "HALLUC-PREV-001-02"
    description: "Consistency validator checks internal consistency"
    verification:
      - "ConsistencyValidator detects logical contradictions"
      - "Variable scope checking"
      - "Function signature consistency"
      - "Import resolution"
      - "Type compatibility checking"
    tests:
      - "test_consistency_validator_scope()"
      - "test_consistency_validator_types()"
      - "test_consistency_validator_imports()"

  - id: "HALLUC-PREV-001-03"
    description: "Reference checker ensures all citations are valid"
    verification:
      - "ReferenceChecker validates claims reference existing code"
      - "Function existence verification"
      - "API availability checking"
      - "Documentation accuracy"
      - "Dead link detection"
    tests:
      - "test_reference_checker_function_exists()"
      - "test_reference_checker_api_availability()"
      - "test_reference_checker_dead_links()"

  - id: "HALLUC-PREV-001-04"
    description: "Complexity validator detects unrealistic claims"
    verification:
      - "ComplexityValidator flags over-simplified solutions"
      - "Missing edge case detection"
      - "Performance assumption validation"
      - "Security implication checking"
    tests:
      - "test_complexity_validator_edge_cases()"
      - "test_complexity_validator_performance()"
      - "test_complexity_validator_security()"

  - id: "HALLUC-PREV-001-05"
    description: "Pattern matcher detects known hallucination patterns"
    verification:
      - "PatternMatcher recognizes common hallucinations"
      - "Off-by-one error patterns"
      - "Race condition patterns"
      - "Exception handling gaps"
      - "Resource leak patterns"
    tests:
      - "test_pattern_matcher_off_by_one()"
      - "test_pattern_matcher_race_conditions()"
      - "test_pattern_matcher_resource_leaks()"

  - id: "HALLUC-PREV-001-06"
    description: "Hallucination audit trail tracks false claims"
    verification:
      - "HallucinationAudit logs all detected hallucinations"
      - "False claim tracking with evidence"
      - "Pattern analysis of hallucination types"
      - "Trend analysis and reporting"
    tests:
      - "test_hallucination_audit_logging()"
      - "test_hallucination_audit_pattern_analysis()"

implementation:
  files_to_create:
    - path: "cortex/brain/safety/fact_checker.py"
      loc: 250
      classes:
        - name: "FactChecker"
          methods:
            - "verify_claim(claim)"
            - "search_evidence(claim)"
            - "score_confidence(evidence)"

    - path: "cortex/brain/safety/consistency_validator.py"
      loc: 200
      classes:
        - name: "ConsistencyValidator"
          methods:
            - "validate_consistency(artifact)"
            - "check_scope()"
            - "check_types()"

    - path: "cortex/brain/safety/reference_checker.py"
      loc: 200
      classes:
        - name: "ReferenceChecker"
          methods:
            - "verify_references(artifact)"
            - "check_function_exists(name)"
            - "check_api_availability(api)"

    - path: "cortex/brain/safety/complexity_validator.py"
      loc: 150
      classes:
        - name: "ComplexityValidator"
          methods:
            - "detect_oversimplification(solution)"
            - "find_missing_edge_cases()"

    - path: "cortex/brain/safety/pattern_matcher.py"
      loc: 250
      classes:
        - name: "PatternMatcher"
          methods:
            - "match_hallucination_patterns(artifact)"
            - "score_pattern_match(pattern)"

    - path: "cortex/brain/safety/hallucination_audit.py"
      loc: 150
      classes:
        - name: "HallucinationAudit"
          methods:
            - "log_hallucination(claim, evidence)"
            - "get_pattern_analysis()"

    - path: "tests/unit/safety/test_hallucination_prevention.py"
      loc: 300
      test_count: 25

    - path: "tests/integration/safety/test_hallucination_pipeline.py"
      loc: 200
      test_count: 12

governance:
  compliance:
    - "CORE-008: TDD"
    - "CORE-011: Type hints"

testing_strategy:
  unit_tests: 25
  integration_tests: 12

dependencies:
  requires:
    - "impl-arch-008-orchestrators"

success_metrics:
  - "Hallucination detection rate >95%"
  - "False positive rate <2%"
  - "Fact checking latency <500ms"
