    total_missing_modules: 215
    total_test_file_references: 1075
    unique_test_files_affected: 203
    test_files_scanned: 409
    
mapping_decision_tree: |
  For each missing module, determine action:
  
  1. Exists in cortex/ → Update imports to use cortex.*
  2. Exists in cortex_brain/tierX/ → Update imports to use cortex_brain.tierX.*
  3. Doesn't exist → Determine if (a) should create stub or (b) implementation pending
  
  Categories:
  - RELOCATE: Module exists elsewhere, imports need update
  - STUB_CREATE: No implementation, create minimal stub
  - PENDING: Implementation in progress elsewhere
  - DEPRECATED: Module no longer needed, remove imports

