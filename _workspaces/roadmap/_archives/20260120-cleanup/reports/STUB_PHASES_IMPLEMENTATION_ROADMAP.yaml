metadata:
  document_type: "MASTER_PHASE_DESIGN"
  scope: "21 Stub Phases - Design and Implementation Strategy"
  total_phases: 21
  estimated_effort: "120-150 person-days"
  priority_distribution:
    P0: 6  # Critical path
    P1: 11  # High value
    P2: 4   # Nice to have

phase_portfolio:
