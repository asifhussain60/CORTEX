    Replace ephemeral _workspaces/roadmap with persistent, semantically-clear 
    cortex-registry/. Segregate plans by TYPE (core CORTEX, domain-specific, 
    orchestrator-generated, interaction-temporary). Enable master orchestrators 
    and planning/ADO agents to write to correct locations without governance violations.
  
  business_value: |
    • Eliminates _workspaces/roadmap confusion (temp ≠ persistent)
    • Enables proper plan isolation (CORTEX vs. domain vs. orchestrator work)
    • Supports interaction orchestrator temp YAML cleanup
    • Scales to multiple domains/projects without collisions
    • Reduces orchestrator code complexity (clear write targets)
    • Improves discoverability (semantic folder names)
    • Aligns with FeatureRegistry pattern (existing governance)
  
