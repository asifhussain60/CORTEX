  - id: "AC-CORTEX-REG-001-02"
    title: "Migrate _workspaces/roadmap/ → cortex-registry/roadmap/ (Atomic)"
    description: |
      Perform atomic migration with lock-based safety and rollback capability.
      
      CRITICAL: Uses distributed lock to prevent concurrent writes during migration.
      CRITICAL: All operations atomic (POSIX rename) to prevent partial state.
      CRITICAL: Archive uses UUID to prevent clobbering on retry.
      
      Migration Steps:
      1. Acquire lock on cortex-registry/ (5-min timeout, fail if held)
      2. Verify NO orchestrators have write locks on _workspaces/roadmap/ (30-sec grace period)
      3. Atomic move (not cp + rm):
         - Source: _workspaces/roadmap/
         - Dest: cortex-registry/roadmap/ (new location)
         - Mechanism: os.rename() (POSIX atomic)
      4. Archive source in safe location:
         - Target: _workspaces/_roadmap-archive-{UUID}/ (UUID prevents collision)
         - Fail loudly if archive target exists
      5. Verify integrity:
         - File counts match exactly
         - All YAML files valid
         - cortex-master.yaml checksum matches
      6. Persist migration state:
         - Write to cortex-registry/MIGRATION-STATE.yaml
         - Includes: timestamp, operator, steps completed, state
      7. Release lock
      
      FAILURE HANDLING:
      - If any step fails: Rollback entire migration (atomic reverse move)
      - Archive source back to _workspaces/roadmap/ if migration aborts
      - Update MIGRATION-STATE.yaml with failure reason
      - Operator can retry immediately (no manual cleanup needed)
    
    verification:
      - "Pre-check: Verify no active write locks on _workspaces/roadmap/ (grep /proc/locks or equivalent)"
      - "Migration: All files moved atomically (single syscall per directory)"
      - "Archive: UUID suffix (not timestamp), fail if target exists"
      - "Post-migration: All files present and readable in cortex-registry/roadmap/"
      - "Post-migration: Old _workspaces/roadmap/ does not exist (fully moved)"
      - "Checksums: Calculated AFTER move completes and all file handles closed"
      - "File counts: Exactly match (including hidden .gitkeep files)"
      - "Migration state: Persisted to cortex-registry/MIGRATION-STATE.yaml"
      - "Idempotency: Can run again with --force flag (archives previous migration)"
      - "Rollback: Script can fully restore old state from MIGRATION-STATE"
    
    tests:
      - "test_pre_migration_lock_check()"
      - "test_atomic_move_not_lost_on_failure()"
      - "test_archive_uuid_prevents_collision()"
      - "test_rollback_restores_completely()"
      - "test_migration_state_persisted()"
      - "test_idempotent_on_retry_with_force()"
      - "test_checksums_match_post_migration()"
      - "test_no_data_loss_under_concurrent_load()"
    
    deliverables:
      files:
        - "cortex-registry/roadmap/ (all migrated files)"
        - "cortex-registry/MIGRATION-STATE.yaml (state tracking)"
        - "scripts/migration/migrate-to-cortex-registry.py (atomic migration script)"
        - "scripts/migration/rollback-migration.py (full rollback script)"
        - "_workspaces/_roadmap-archive-{UUID}/ (backup, preserved for 30 days)"
    
    dependencies: ["AC-CORTEX-REG-001-01"]
    blocking: ["AC-CORTEX-REG-001-03"]
    estimated_effort: "3.5 hours (atomic ops + rollback + state tracking)"

  - id: "AC-CORTEX-REG-001-03"
    title: "Implement Thread-Safe CortexRegistryPathResolver"
    description: |
      Create thread-safe singleton path resolver with startup validation.
      
      CRITICAL: Singleton initialization must be atomic (prevents race conditions).
      CRITICAL: All paths cached after first call (no filesystem access on hot path).
      CRITICAL: Environment variable overrides validated at startup (fail fast).
      
      Module: cortex/core/path/cortex_registry_path_resolver.py
      
      Features:
      - Thread-safe singleton (using threading.Lock)
      - Lazy initialization (paths computed once, cached)
      - Centralized path calculation for all registry locations
      - Environment variable override support (CORTEX_REGISTRY_ROOT)
      - Startup validation: ensures paths exist or are creatable
      - Startup health check: verifies write permissions
      - Type hints: all methods return pathlib.Path
      - Logging: environment overrides and validation failures logged
      
      API:
        
        class CortexRegistryPathResolver:
          @staticmethod
          def root() -> Path:
            """Return cortex-registry/ root path"""
            # Checks env var CORTEX_REGISTRY_ROOT if set
            # Validates path exists and is writable
            # Falls back to default: {repo_root}/cortex-registry/
            # Raises ValueError if path invalid
          
          @staticmethod
          def roadmap_root() -> Path:
            """cortex-registry/roadmap/"""
          
          @staticmethod
          def cortex_master_yaml() -> Path:
            """cortex-registry/roadmap/cortex-master.yaml (SSOT)"""
          
          @staticmethod
          def phases_dir() -> Path:
            """cortex-registry/roadmap/phases/"""
          
          @staticmethod
          def reports_dir() -> Path:
            """cortex-registry/roadmap/reports/"""
          
          @staticmethod
          def domain_root(domain: str) -> Path:
            """cortex-registry/domains/{domain}/"""
            # Validates domain name (no path traversal)
          
          @staticmethod
          def orchestrator_planning_dir() -> Path:
            """cortex-registry/orchestrators/planning/"""
          
          @staticmethod
          def orchestrator_ado_dir() -> Path:
            """cortex-registry/orchestrators/ado/"""
          
          @staticmethod
          def orchestrator_interaction_temp_dir() -> Path:
            """cortex-registry/orchestrators/interaction/temp/"""
          
          @staticmethod
          def orchestrator_interaction_approved_dir() -> Path:
            """cortex-registry/orchestrators/interaction/approved/"""
          
          @classmethod
          def initialize(cls):
            """
            Called on application startup (master_orchestrator.py).
            Validates all paths, raises ValueError if any invalid.
            Must be called BEFORE any orchestrator writes paths.
            """
          
          @classmethod
          def validate_path(cls, path: Path, writable: bool = False) -> bool:
            """
            Validate path exists and optionally is writable.
            Returns True if valid, raises ValueError if not.
            """
      
      THREAD SAFETY:
      - Singleton initialization protected by threading.Lock
      - First thread to call any method initializes shared state
      - Subsequent threads get cached results (no lock contention)
      - All shared state is immutable after initialization
    
    verification:
      - "Module cortex/core/path/cortex_registry_path_resolver.py created"
      - "Singleton initialized exactly once (test with 100 threads)"
      - "All 10+ path methods implemented with type hints"
      - "All methods return pathlib.Path objects"
      - "Cached paths: Method called 1000x, only 1 filesystem access"
      - "Environment override: CORTEX_REGISTRY_ROOT validated at startup"
      - "Invalid env var: ValueError raised at startup (not on first path call)"
      - "Permission check: Startup verifies write access to root path"
      - "Initialize() must be called on app startup (verified in tests)"
      - "Concurrent access: 100 threads accessing paths simultaneously (no deadlock)"
    
    tests:
      - "test_singleton_thread_safe_initialization(100 threads)"
      - "test_paths_cached_after_first_call()"
      - "test_root_returns_correct_path()"
      - "test_roadmap_root_path_correct()"
      - "test_cortex_master_yaml_path_correct()"
      - "test_phases_dir_path_correct()"
      - "test_domain_path_parameterized(domain='vision')"
      - "test_domain_path_prevents_traversal(domain='../../../etc')"
      - "test_orchestrator_paths_all_correct()"
      - "test_path_validation_passes_for_existing()"
      - "test_path_validation_fails_for_missing()"
      - "test_environment_override_works(CORTEX_REGISTRY_ROOT=/custom/path)"
      - "test_invalid_environment_override_fails_on_startup()"
      - "test_write_permission_check_on_startup()"
      - "test_concurrent_path_resolution_no_race()"
    
    deliverables:
      files:
        - "cortex/core/path/cortex_registry_path_resolver.py"
        - "cortex/core/path/__init__.py (export CortexRegistryPathResolver)"
        - "tests/unit/path/test_cortex_registry_path_resolver.py (15+ tests)"
    
    dependencies: ["AC-CORTEX-REG-001-02"]
    blocking: ["AC-CORTEX-REG-001-04"]
    estimated_effort: "3 hours (thread safety + caching + validation)"

