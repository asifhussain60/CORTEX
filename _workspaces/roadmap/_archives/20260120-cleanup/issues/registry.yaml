rationale:
  
  problem: |
    CORTEX currently relies on static manifest files (cortex-impl-map.yaml, 
    mcp-impl-status.yaml) for feature discovery. Problems:
    - Files become stale within minutes
    - Requires manual git commits to update
    - No real-time awareness of capability changes
    - File polling wastes CPU and introduces race conditions
    - MasterOrchestrator can't ask "is this feature ready?"
    - Multiple sources = potential sync errors
  
  solution: |
    Implement event-driven FeatureRegistry system backed by SQL database.
    - In-memory cache with SQL persistence
    - PubSub event notifications for state changes
    - Query API for MasterOrchestrator feature discovery
    - One-time migration from existing yaml files
    - Full audit trail per CORE-025
  
  benefits: |
    - Real-time feature discovery (0ms vs file I/O latency)
    - O(1) query performance regardless of feature count
    - Event-driven architecture enables adaptive behavior
    - Complete audit compliance (all changes logged)
    - Eliminates manual manifest maintenance
    - Enables intelligent MasterOrchestrator routing

