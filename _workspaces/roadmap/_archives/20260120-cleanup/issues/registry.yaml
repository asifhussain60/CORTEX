# CORTEX Feature Registry Schema & Implementation Phase
# Purpose: Define the FeatureRegistry system (CORTEX Live Manifest solution)
# Phase ID: impl-features-registry-001
# Date: 2026-01-20
# Authority: Enhanced ROI Analysis response to user request

metadata:
  phase_id: "impl-features-registry-001"
  title: "FeatureRegistry Implementation - Live Manifest System"
  description: |
    Implement real-time feature discovery system replacing static manifest files.
    Provides MasterOrchestrator with instant access to live capability inventory
    via EventBus-driven registry with SQL-backed persistence and audit trails.
  priority: "P1"
  estimated_effort: "6-9 hours"
  confidence: "HIGH"
  status: "NOT_STARTED"
  locked: false
  
objective:
  summary: |
    Build queryable FeatureRegistry replacing cortex-impl-map.yaml polling.
    Enable MasterOrchestrator to ask "what features are live?" with O(1) performance
    and complete audit trail per CORE-025.
  
  business_value: |
    • Real-time feature discovery (0ms vs 5-10s file I/O)
    • Adaptive routing based on feature readiness
    • Audit compliance for feature state changes
    • Eliminates manual manifest maintenance
    • Scales to 10K+ features without degradation
  
  roi_year1: "$7000 benefit vs $1000 cost (7x ROI, break-even week 6)"

gap_analysis:
  current_state:
    - "cortex-impl-map.yaml exists (manually maintained)"
    - "mcp-impl-status.yaml tracks stubs (separate source)"
    - "governance.db exists but unused for feature metadata"
    - "MasterOrchestrator reads files (no live updates)"
    - "No event notification system"
    - "No feature readiness API"
    - "No query interface for feature discovery"
  
  problems:
    - "Static files = stale within minutes"
    - "File polling = CPU waste + race conditions"
    - "Multiple manifest sources = sync issues"
    - "No audit trail for feature state changes"
    - "MasterOrchestrator can't ask 'is this ready?'"
  
  solutions:
    - "Implement FeatureRegistry (in-memory + SQL)"
    - "Implement FeatureEventBus (PubSub notifications)"
    - "Implement FeatureQueryAPI (MasterOrchestrator interface)"
    - "Migrate cortex-impl-map.yaml → schema-driven data"
    - "Add feature readiness evaluation"

acceptance_criteria:
  
  - id: "FEAT-REG-001-01"
    title: "FeatureRegistry Schema Design"
    description: |
      Define SQL schema for feature metadata storage in governance.db.
      Schema must support:
      - Feature identity (id, name, version, status)
      - Capability declaration (tags, dependencies)
      - Readiness state (READY, STUB, BLOCKED, DEPRECATED)
      - Implementation metadata (files, test_count, mcp_exposed)
      - Audit metadata (created_at, updated_at, changed_by)
    
    verification:
      - "Schema supports 1000+ features without performance degradation"
      - "Indexes on: feature_id, status, tags (query <5ms)"
      - "Foreign keys for dependencies"
      - "Timestamp tracking (created_at, updated_at)"
      - "Audit log link (to governance.db audit trail)"
    
    tests:
      - "test_schema_supports_feature_metadata()"
      - "test_schema_indexes_performant()"
      - "test_schema_foreign_keys_enforced()"
      - "test_schema_audit_metadata_tracked()"
    
    deliverables:
      files:
        - "cortex/core/feature_registry/schema.py"  # SQLAlchemy models
      tests:
        - "tests/unit/feature_registry/test_schema.py"

  - id: "FEAT-REG-001-02"
    title: "FeatureRegistry Core Implementation"
    description: |
      Implement FeatureRegistry class: in-memory cache with SQL persistence.
      
      Methods:
      - register_feature(feature_id, metadata) → void
      - get_feature(feature_id) → Feature
      - list_features(filters) → List[Feature]
      - update_feature_status(feature_id, status) → void
      - get_readiness(feature_id) → Readiness
      - query(tag, status, version) → List[Feature]
      
      Features:
      - Lazy-load from SQL on first access
      - Thread-safe cache invalidation
      - TTL-based cache (5 minute default)
      - Fallback to SQL if cache miss
    
    verification:
      - "All 6 methods implemented and typed"
      - "Thread-safe with locks where needed"
      - "Cache hits >95% in steady state"
      - "O(1) lookup performance"
      - "Exceptions logged to audit trail"
    
    tests:
      - "test_register_feature_creates_entry()"
      - "test_get_feature_returns_metadata()"
      - "test_list_features_with_filters()"
      - "test_update_status_persists()"
      - "test_cache_invalidation_on_update()"
      - "test_concurrent_access_threadsafe()"
      - "test_query_performance_under_load()"
    
    deliverables:
      files:
        - "cortex/core/feature_registry/registry.py"  # FeatureRegistry class
        - "cortex/core/feature_registry/models.py"  # Feature, Readiness dataclasses
      tests:
        - "tests/unit/feature_registry/test_registry.py"

  - id: "FEAT-REG-001-03"
    title: "FeatureEventBus Implementation"
    description: |
      Implement PubSub event system for feature state changes.
      
      Events:
      - FEATURE_REGISTERED: New feature added
      - FEATURE_UPDATED: Metadata changed
      - STATUS_CHANGED: Readiness state transition
      - ORCHESTRATOR_REGISTERED: New orchestrator capability
      - MCP_TOOL_LOADED: MCP tool exposed
      - PHASE_LOCKED: Phase immutability triggered
      
      Subscribers:
      - FeatureRegistry (updates cache on events)
      - AuditLogger (logs to governance.db)
      - MasterOrchestrator (adapts routing)
      - ResponseHeaderInjector (feature awareness)
    
    verification:
      - "EventBus.publish() notifies all subscribers"
      - "No synchronous blocking on subscribers"
      - "Event order preserved (ordered queue)"
      - "Unhandled exceptions in subscribers logged (not propagated)"
      - "Event payloads include full context"
    
    tests:
      - "test_publish_notifies_all_subscribers()"
      - "test_subscriber_exception_not_propagated()"
      - "test_event_ordering_preserved()"
      - "test_unsubscribe_removes_listener()"
      - "test_concurrent_events_handled()"
    
    deliverables:
      files:
        - "cortex/core/feature_registry/event_bus.py"  # EventBus class
        - "cortex/core/feature_registry/events.py"  # Event dataclasses
      tests:
        - "tests/unit/feature_registry/test_event_bus.py"

  - id: "FEAT-REG-001-04"
    title: "FeatureQueryAPI - MasterOrchestrator Interface"
    description: |
      Implement query interface for MasterOrchestrator feature discovery.
      
      API:
      - list_live_features() → List[Feature]
      - get_feature_by_id(feature_id) → Feature
      - get_readiness(feature_id) → Readiness (READY|STUB|BLOCKED|DEPRECATED)
      - find_features(query) → List[Feature]
      - get_features_by_tag(tag) → List[Feature]
      - get_features_by_status(status) → List[Feature]
      - get_orchestrator_capabilities(orchestrator_id) → List[Capability]
      - get_mcp_tools() → List[MCPTool]
      
      Query DSL:
      - tag:orchestration → all orchestrator features
      - status:ready → production-ready features
      - version:>1.0 → features in v1.0+
      - mcp_exposed:true → MCP-exposed tools
      - blocking:false → non-blocking features
    
    verification:
      - "All 8 methods implemented"
      - "Query DSL parsed and executed correctly"
      - "Result count correct for test data"
      - "Query performance <5ms for typical query"
      - "Results include full metadata"
    
    tests:
      - "test_list_live_features_returns_all()"
      - "test_get_readiness_returns_status()"
      - "test_query_dsl_parses_correctly()"
      - "test_find_by_tag_returns_subset()"
      - "test_query_performance_acceptable()"
    
    deliverables:
      files:
        - "cortex/core/feature_registry/query_api.py"  # FeatureQueryAPI class
      tests:
        - "tests/unit/feature_registry/test_query_api.py"

  - id: "FEAT-REG-001-05"
    title: "MasterOrchestrator Integration"
    description: |
      Integrate FeatureRegistry into MasterOrchestrator for adaptive routing.
      
      Changes:
      - Initialize FeatureRegistry on startup
      - Subscribe to FEATURE_UPDATED events
      - Query feature readiness before delegating operations
      - Log feature-aware routing decisions
      - Adapt behavior based on STUB vs READY status
      
      Example:
        feature_readiness = query_api.get_readiness("mcp_tools.query_tool")
        if feature_readiness == Readiness.STUB:
          log_warning("Delegating to stub implementation")
        elif feature_readiness == Readiness.BLOCKED:
          return Err("Feature temporarily unavailable")
        else:
          delegate(operation)
    
    verification:
      - "MasterOrchestrator queries registry on startup"
      - "Feature status affects routing decisions"
      - "Routing decisions logged with feature context"
      - "Performance impact <10ms per operation"
      - "Graceful degradation if registry unavailable"
    
    tests:
      - "test_orchestrator_queries_registry_on_startup()"
      - "test_routing_adapts_to_feature_status()"
      - "test_feature_aware_logging()"
      - "test_performance_impact_acceptable()"
      - "test_graceful_degradation_if_registry_down()"
    
    dependencies:
      - "FEAT-REG-001-01"
      - "FEAT-REG-001-02"
      - "FEAT-REG-001-03"
      - "FEAT-REG-001-04"
    
    files_to_modify:
      - "cortex/orchestrators/core/master_orchestrator.py"
        location: "__init__()"
        change: "Initialize FeatureRegistry, subscribe to events"
      
      - "cortex/orchestrators/core/master_orchestrator.py"
        location: "_route_operation()"
        change: "Query readiness before delegation"
    
    deliverables:
      files:
        - "cortex/orchestrators/core/master_orchestrator.py"  # Modified
      tests:
        - "tests/unit/orchestrators/test_master_orchestrator_registry_integration.py"

  - id: "FEAT-REG-001-06"
    title: "Data Migration from cortex-impl-map.yaml"
    description: |
      Migrate existing feature data from cortex-impl-map.yaml into FeatureRegistry.
      
      Process:
      1. Parse cortex-impl-map.yaml
      2. Extract feature definitions (mcp_tools, orchestrators, phases)
      3. Create Feature entries in registry
      4. Verify data integrity (count, metadata completeness)
      5. Update imports to use query_api instead of yaml parsing
      6. Archive original yaml (keep for reference, don't delete)
      
      Verification:
      - "All features from yaml migrated"
      - "Zero data loss (counts match)"
      - "Metadata fields populated correctly"
      - "Status assigned correctly (READY|STUB|BLOCKED)"
      - "Dependencies resolved"
    
    tests:
      - "test_migration_preserves_all_features()"
      - "test_migration_assigns_status_correctly()"
      - "test_migration_resolves_dependencies()"
      - "test_no_data_loss()"
    
    dependencies:
      - "FEAT-REG-001-01"
      - "FEAT-REG-001-02"
    
    deliverables:
      files:
        - "scripts/maintenance/migrate_features_to_registry.py"  # Migration script
      tests:
        - "tests/integration/feature_registry/test_migration.py"

  - id: "FEAT-REG-001-07"
    title: "MCP Tool Exposure - FeatureRegistry Query"
    description: |
      Expose FeatureQueryAPI as MCP tool for external clients.
      
      Tool: query_features
      Parameters:
      - query: str (query DSL)
      - limit: int (default 100)
      - offset: int (default 0)
      
      Returns:
      - features: List[Feature] (matching query)
      - total_count: int
      - query_time_ms: float
      
      Example:
        query_features(query="status:ready tag:orchestration", limit=50)
        → Returns all ready orchestration features
    
    verification:
      - "MCP tool schema valid"
      - "Tool registered in MCP server"
      - "Tool responds to queries"
      - "Results match query_api.find_features()"
    
    tests:
      - "test_mcp_tool_registered()"
      - "test_mcp_query_returns_correct_results()"
      - "test_mcp_pagination_works()"
    
    dependencies:
      - "FEAT-REG-001-04"
    
    deliverables:
      files:
        - "cortex/mcp/tools/query_features.py"  # MCP tool implementation
      tests:
        - "tests/unit/mcp/test_query_features_tool.py"

  - id: "FEAT-REG-001-08"
    title: "Comprehensive Test Suite & Documentation"
    description: |
      Create unit, integration, and E2E tests for entire FeatureRegistry system.
      Write ADR and API documentation.
      
      Test Coverage:
      - Unit tests: schema, registry, event_bus, query_api (>90% code coverage)
      - Integration tests: registry + event_bus + master_orchestrator
      - E2E tests: full feature lifecycle (register → update → query → migrate)
      - Performance tests: query throughput, cache efficiency
      
      Documentation:
      - ADR: Why FeatureRegistry (vs file polling, static manifests)
      - API spec: All methods, parameters, return types
      - Query DSL: Full language reference
      - Integration guide: How to use from MasterOrchestrator
    
    verification:
      - "Code coverage >90%"
      - "All tests passing"
      - "ADR written per docs/02-architecture/adrs/ format"
      - "API spec complete"
      - "Query DSL reference complete"
    
    tests:
      - "pytest tests/unit/feature_registry/ -v --cov"
      - "pytest tests/integration/feature_registry/ -v"
      - "pytest tests/e2e/feature_registry/ -v"
      - "pytest tests/performance/feature_registry/ -v"
    
    dependencies:
      - "FEAT-REG-001-01 through FEAT-REG-001-07"
    
    deliverables:
      files:
        - "docs/02-architecture/adrs/ADR-FEATURE-REGISTRY.md"
        - "docs/03-api-reference/feature-registry-api.md"
      tests:
        - "tests/unit/feature_registry/" (all tests pass)
        - "tests/integration/feature_registry/" (all tests pass)
        - "tests/e2e/feature_registry/" (all tests pass)
        - "tests/performance/feature_registry/" (all tests pass)

