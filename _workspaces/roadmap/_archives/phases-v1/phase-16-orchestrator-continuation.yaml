  # OC-001: ContinuationDecision Infrastructure
  # ---------------------------------------------------------------------------
  - ac_id: "OC-001-01"
    title: "ContinuationDecision Dataclass & Event Enums"
    description: |
      Create ContinuationDecision dataclass that explicitly specifies:
      - should_continue: bool (continue or stop)
      - reason: ContinuationReason enum (WHY we're continuing/stopping)
      - next_operation: str (what to do next)
      - next_parameters: dict (parameters for next operation)
      - turn_number: int (which turn produced this decision)
      - token_usage: dict (tokens used: prompt, completion, total)
      - audit_entry_id: str (link to AC_COMPLETE audit entry)
      - governance_violations: list (any governance rule violations)
      
      Create ContinuationReason enum with values:
      - IMPLICIT_NEXT_OPERATION (orchestrator knows what's next)
      - USER_PROVIDED_FOLLOWUP (user gave follow-up input)
      - AUTO_REFINEMENT_LOOP (auto-refining, e.g., hallucination fix)
      - COMPLETION (goal achieved, user satisfied)
      - USER_REJECTION (user explicitly rejected result)
      - TOKEN_LIMIT (approaching token budget)
      - GOVERNANCE_HALT (governance rule violation)
      - MAX_ROUNDS_REACHED (safety limit on iterations)
      - ERROR_UNRECOVERABLE (error that can't be recovered)
      - INTERACTION_REQUIRED (waiting for user approval)
    
