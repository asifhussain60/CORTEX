phase:
  id: "PHASE-16-ORCHESTRATOR-CONTINUATION"
  title: "Event-Driven Orchestrator Lifecycle Management"
  description: |
    Replace imperative loops with declarative ConversationProtocol pattern.
    
    KEY INNOVATION: Each turn is explicit, testable, and auditable.
    
    CURRENT ANTI-PATTERN:
      while True:
          result = orchestrator.execute()
          if should_stop():
              break
    
    BETTER SOLUTION:
      decision = protocol.execute_turn(input)
      if decision.should_continue == False:
          break  # Explicit reason in decision.reason
    
    BENEFITS:
    - Every turn independently testable
    - Clear continuation reasons (COMPLETION, TOKEN_LIMIT, ERROR, USER_REJECTION, etc.)
    - Per-turn audit logging (AC_START/EXECUTE/COMPLETE)
    - Token tracking per turn (CORE-001 incremental execution)
    - Governance validation per turn (CORE-027 audit trail)
    - Full LENS re-execution per turn (CORE-019 routing)
  
