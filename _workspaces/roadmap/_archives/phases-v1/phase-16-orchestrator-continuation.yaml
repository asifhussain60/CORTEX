  - ac_id: "OC-001-02"
    title: "ConversationProtocol Class - Single Turn Executor"
    description: |
      Create ConversationProtocol wrapper that:
      - Wraps any IOrchestrator instance
      - Has one core public method: execute_turn(user_input, previous_context)
      - Returns Result[ContinuationDecision]
      - NOT a loop - caller decides continuation
      
      Key methods:
      - __init__(orchestrator, max_turns=10, token_limit=20000)
      - execute_turn(user_input, previous_context) → Result[ContinuationDecision]
      - _validate_governance_before_turn() → Result
      - _create_turn_context() → dict with LENS phases
      - _log_ac_start() → audit entry
      - _log_ac_execute() → audit entry
      - _evaluate_continuation() → ContinuationDecision (THE KEY LOGIC)
      
      State tracking:
      - turn_number: increments per call
      - total_tokens_used: accumulates across turns
      - decisions_history: stores all decisions for replay/debug
      - conversation_session: optional ConversationSession for state persistence
    
