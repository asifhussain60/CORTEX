      - MasterOrchestrator uses explicit ContinuationDecision
      - Each turn routed to appropriate domain orchestrator (wrapped)
      - Continuation reasons clear and auditable
      - Token budget visible per turn
      - User informed of why orchestrator is stopping
      
      UI Integration:
