# =============================================================================
# ARCHITECTURE OVERVIEW
# =============================================================================
#
# PROBLEM: Orchestrators need to run across multiple user turns, but simple
#          imperative loops violate CORTEX architecture principles.
#
# SOLUTION: ConversationProtocol - a stateless executor that:
#   1. Takes one turn as input (user_input, previous_context)
#   2. Executes that one turn through LENS protocol
#   3. Returns explicit ContinuationDecision (not hidden loop state)
#   4. Caller decides what to do next based on decision
#   5. Each turn is independently auditable and testable
#
# PRINCIPLE: "Explicit > Implicit, Declarative > Imperative"
#
# =============================================================================

