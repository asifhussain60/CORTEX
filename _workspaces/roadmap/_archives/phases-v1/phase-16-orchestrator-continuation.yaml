  # ---------------------------------------------------------------------------
  - ac_id: "OC-002-01"
    title: "Terminal Events & Break Condition Handlers"
    description: |
      Create event registry that orchestrators can subscribe to.
      
      Terminal Events:
      - PhaseCompletedEvent: Operation reached completion state
      - UserCancelledEvent: User explicitly cancelled
      - MaxTurnsReachedEvent: Safety limit on iterations
      - ErrorOccurredEvent: Unrecoverable error during execution
      - TokenLimitEvent: Approaching or exceeding token budget
      - GovernanceViolationEvent: Governance rule violation detected
      - UserApprovalRejectedEvent: User rejected result in approval gate
      
      Handler Pattern:
      - Each event has Listener interface
      - Orchestrators register listeners via register_event_listener()
      - When event occurs, all registered listeners are notified
      - Listeners return "continue" or "break" decision
      - Protocol evaluates all listener decisions, breaks if ANY says break
      
      Audit Trail:
      - Every event logged with timestamp, turn number, reason, hash
      - Event audit linked to AC_COMPLETE entry
    
