# =============================================================================
# PHASE-19: Template-to-Tool Implementation Framework
# =============================================================================
# Purpose: Identify & implement tools where templates exist without implementations
# Status: NEW (Proposed 2026-01-17)
# Scope: 4 major template-to-tool gaps identified in architecture review
# Estimated Duration: 3 weeks (60-80 hours)
# =============================================================================

phase:
  id: "PHASE-19-TEMPLATE-TOOL-IMPLEMENTATION"
  title: "Template-to-Tool Implementation Framework"
  description: |
    CRITICAL GAP: CORTEX has built templates but not the tools that use them.
    
    IDENTIFIED GAPS (from architecture review 2026-01-17):
    1. DomainTemplate exists (5 templates: Planning, Analysis, Integration, Validation, Execution)
       → BUT NO Orchestrator Scaffolder tool to generate code from templates
    
    2. ResponseTemplateEngine + ResponseTemplateRegistry exist
       → BUT NO Template Content Generator to create/manage template YAML
    
    3. DomainTemplateFactory exists
       → BUT NO Orchestrator Factory CLI to expose factory operations
    
    4. Template system infrastructure complete
       → BUT Templates are empty (no content for Response/Domain templates)
    
    SOLUTION: 4 new phases implementing missing tools (PHASE-19-22)
    
    SCOPE:
    - OB-TOOL-001: Orchestrator Scaffolder (generates Python from templates)
    - OB-TOOL-002: Template Content Generator (creates/manages YAML templates)
    - OB-TOOL-003: Template Validator (validates template consistency)
    - OB-TOOL-004: Factory CLI Exposure (exposes factory via CLI)
    - OB-TOOL-005: Content Population (populates tier2 templates with content)
    - OB-TOOL-006: Template Testing Framework (E2E template usage validation)
    
    DEPENDENCIES:
    - Requires PHASE-18 (all templates exist)
    - Enables rapid orchestrator creation (10x faster)
    - Enables tier2 content management (content as code)
    - Enables template-driven development (GitOps-compatible)
  
  order: 19
  status: "NOT_STARTED"
  locked: false
  
  requires: "PHASE-18-ORCHESTRATOR-DEVX"
  required_for: "PRODUCTION_DEPLOYMENT"
  blocking: true
  priority: "P1"
  
  estimated_hours: 72
  estimated_days: 9
  
  ac_ids: 6
  completed_ac_ids: 0
  progress_percentage: 0.0

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  # OB-TOOL-001: Orchestrator Scaffolder
  - ac_id: "OB-TOOL-001-01"
    title: "Orchestrator Scaffolder - Code Generation"
    description: |
      CLI tool generates Python code from DomainTemplate instances.
      
      Usage:
        cortex-scaffolder create-orchestrator \
          --domain planning \
          --name MyPlanningOrchestrator \
          --output src/orchestrators/domain/my_planning_orchestrator.py
      
      Generates:
      - Class definition (inherits appropriate template)
      - Type hints (CORE-011 compliant)
      - Docstrings (CORE-012 compliant, Google style)
      - __init__, execute(), cleanup() stubs
      - Import statements (governance, decorators)
      - @register_with_master decorator
      - TDD test file scaffold
    priority: "CRITICAL"
    estimated_hours: 12
    test_count: 15
    acceptance_criteria_items:
      - "Generates valid Python code that passes linter"
      - "Generated code includes all required methods (execute, cleanup, etc)"
      - "Type hints on all parameters and return values"
      - "Google-style docstrings on all methods"
      - "Generated code is immediately importable (no syntax errors)"
      - "@register_with_master decorator automatically added"
      - "Test file scaffold includes pytest fixtures and basic tests"
      - "All generated code CORE-028 compliant (kebab-case, <25 chars)"
      - "Performance: generation <1 second"
    files_to_create:
      - "src/tools/orchestrator-scaffolder.py"
      - "src/tools/orchestrator_scaffolder.py (package init)"
      - "tests/unit/tools/test-orchestrator-scaffolder.py"
    files_to_modify: []
    git_checkpoint: "OB-TOOL-001-01: Orchestrator Scaffolder"
    
  - ac_id: "OB-TOOL-001-02"
    title: "Orchestrator Scaffolder - Template Selection"
    description: |
      Scaffolder provides interactive template selection:
      - List available domains (planning, analysis, integration, validation, execution)
      - Display domain description and capabilities
      - Allow user to select domain
      - Confirm template before generation
    priority: "HIGH"
    estimated_hours: 6
    test_count: 10
    acceptance_criteria_items:
      - "CLI shows domain list with descriptions"
      - "User can select domain by name or number"
      - "Template preview shown before generation"
      - "Generation confirmed with yes/no prompt"
      - "Cancellation handled gracefully"
    git_checkpoint: "OB-TOOL-001-02: Template Selection"
  
  - ac_id: "OB-TOOL-001-03"
    title: "Orchestrator Scaffolder - Integration Tests"
    description: |
      E2E tests for scaffolder:
      1. Generate orchestrator from each of 5 domain templates
      2. Import generated module (no syntax errors)
      3. Verify class structure matches template
      4. Run generated tests (should pass basic fixtures)
      5. Verify generated orchestrator registers correctly
    priority: "HIGH"
    estimated_hours: 6
    test_count: 15
    acceptance_criteria_items:
      - "Generated code from each domain passes linter"
      - "Generated code imports without errors"
      - "Generated class implements required interface"
      - "Generated tests pass (basic fixtures work)"
      - "Generated orchestrator auto-registers"
      - "MCP tools exposed correctly from generated orchestrator"
    git_checkpoint: "OB-TOOL-001-03: Scaffolder Integration Tests"

  # OB-TOOL-002: Template Content Generator
  - ac_id: "OB-TOOL-002-01"
    title: "Template Content Generator - YAML Creation"
    description: |
      Tool creates and manages template YAML files in cortex-brain/tier2/.
      
      Usage:
        cortex-template create \
          --category base \
          --name success-response \
          --description "Success response template" \
          --variables operation,status,message
      
      Creates:
      - cortex-brain/tier2/base/success-response.yaml
      - With proper structure and comments
      - Ready to be populated with content
    priority: "CRITICAL"
    estimated_hours: 10
    test_count: 12
    acceptance_criteria_items:
      - "Creates valid YAML structure"
      - "Includes all standard template sections (variables, content, description)"
      - "Variables section populated from CLI"
      - "Template ready for user content population"
      - "Validates no duplicate template names"
      - "Supports batch creation from CSV"
    files_to_create:
      - "src/tools/template-content-generator.py"
      - "tests/unit/tools/test-template-generator.py"
    git_checkpoint: "OB-TOOL-002-01: Template Content Generator"
  
  - ac_id: "OB-TOOL-002-02"
    title: "Template Content Generator - Content Population"
    description: |
      Tool helps populate template content with examples and documentation.
      
      Features:
      - Interactive prompts for each template section
      - Template examples from previous implementations
      - Content validation (no placeholder text in final version)
      - Version tracking
    priority: "HIGH"
    estimated_hours: 8
    test_count: 10
    acceptance_criteria_items:
      - "Interactive prompts for all template fields"
      - "Example suggestions from existing templates"
      - "Content validation (length, format)"
      - "Version history tracked (cortex-brain/.git)"
      - "Prevents committing templates with TODO placeholders"
    git_checkpoint: "OB-TOOL-002-02: Content Population"
  
  - ac_id: "OB-TOOL-002-03"
    title: "Template Content Generator - Validation & Testing"
    description: |
      Validates template YAML files and tests generated content.
      
      Tests:
      - YAML schema compliance
      - Variable substitution works correctly
      - Generated responses are valid JSON/YAML
      - Template inheritance chains resolve
    priority: "HIGH"
    estimated_hours: 6
    test_count: 14
    acceptance_criteria_items:
      - "YAML validation passes all templates"
      - "Schema compliance verified"
      - "Variable substitution tested"
      - "Response generation works"
      - "Template inheritance chains verified"
      - "E2E: template → render → output valid"
    git_checkpoint: "OB-TOOL-002-03: Validation & Testing"

  # OB-TOOL-003: Factory CLI Exposure
  - ac_id: "OB-TOOL-003-01"
    title: "Factory CLI - DomainTemplateFactory Exposure"
    description: |
      Expose DomainTemplateFactory via CLI:
      
      Usage:
        cortex-factory list-templates
        cortex-factory get-template --domain planning
        cortex-factory export-templates --format json
        cortex-factory validate-templates
      
      Commands:
      - list-templates: Show all available templates
      - get-template: Get specific template details
      - export-templates: Export all templates to JSON/YAML
      - validate-templates: Check template consistency
    priority: "HIGH"
    estimated_hours: 8
    test_count: 12
    acceptance_criteria_items:
      - "All factory methods exposed via CLI"
      - "JSON output format works"
      - "YAML output format works"
      - "Error handling with helpful messages"
      - "Performance: all commands <1 second"
      - "Help documentation complete"
    files_to_create:
      - "src/tools/factory-cli.py"
      - "tests/unit/tools/test-factory-cli.py"
    git_checkpoint: "OB-TOOL-003-01: Factory CLI"
  
  - ac_id: "OB-TOOL-003-02"
    title: "Factory CLI - Template Comparison"
    description: |
      CLI commands for comparing templates and analyzing differences.
      
      Usage:
        cortex-factory diff planning-v1 planning-v2
        cortex-factory compare-domains planning analysis
        cortex-factory stats
      
      Features:
      - Show differences between template versions
      - Compare across domains
      - Template statistics (count, usage, etc)
    priority: "MEDIUM"
    estimated_hours: 6
    test_count: 10
    acceptance_criteria_items:
      - "Diff output shows changes clearly"
      - "Cross-domain comparison works"
      - "Statistics accurate and meaningful"
      - "Performance reasonable (<2 seconds)"
    git_checkpoint: "OB-TOOL-003-02: Template Comparison"

  # OB-TOOL-004: Template Validator
  - ac_id: "OB-TOOL-004-01"
    title: "Template Validator - Consistency Checking"
    description: |
      Validates template consistency and compliance:
      
      Checks:
      - No duplicate template names across domains
      - All domain templates have required sections
      - Variable names consistent (same variable defined same way)
      - No circular template inheritance
      - All referenced templates exist
      - Template content not empty (no placeholder text)
    priority: "MEDIUM"
    estimated_hours: 10
    test_count: 16
    acceptance_criteria_items:
      - "Duplicate detection working"
      - "Required sections validated"
      - "Variable consistency checked"
      - "Circular inheritance detected"
      - "All errors reported with line numbers"
      - "Exit codes: 0 (valid), 1 (invalid), 2 (error)"
      - "JSON report output"
      - "CI/CD integration ready"
    files_to_create:
      - "src/tools/template-validator.py"
      - "tests/unit/tools/test-template-validator.py"
    git_checkpoint: "OB-TOOL-004-01: Template Validator"
  
  - ac_id: "OB-TOOL-004-02"
    title: "Template Validator - Auto-Fix Capability"
    description: |
      Validator can auto-fix common template issues:
      
      Fixes:
      - Standardize YAML formatting
      - Fix indentation errors
      - Normalize variable names
      - Remove duplicate sections
      - Add missing required sections
    priority: "MEDIUM"
    estimated_hours: 8
    test_count: 12
    acceptance_criteria_items:
      - "Formatting standardized consistently"
      - "Indentation fixed correctly"
      - "Variable names normalized"
      - "Duplicates merged intelligently"
      - "Missing sections added with defaults"
      - "Dry-run mode for preview before applying fixes"
    git_checkpoint: "OB-TOOL-004-02: Auto-Fix"

  # OB-TOOL-005: E2E Template Testing
  - ac_id: "OB-TOOL-005-01"
    title: "E2E Template Testing - Full Workflow"
    description: |
      End-to-end tests verifying complete template workflow:
      
      1. Create orchestrator via scaffolder (uses template)
      2. Apply template content (from cortex-brain/tier2/)
      3. Generate response via template engine
      4. Validate response matches expected structure
      5. Execute orchestrator with template-generated response
      6. Verify audit trail captures template usage
      
      Tests cover all 5 domain templates + custom templates.
    priority: "HIGH"
    estimated_hours: 12
    test_count: 20
    acceptance_criteria_items:
      - "End-to-end workflow tested for each domain"
      - "Template content correctly applied"
      - "Generated responses valid"
      - "Orchestrator executes successfully"
      - "Audit trail captures usage"
      - "Performance: full workflow <1 second"
      - "20+ integration tests passing"
    files_to_create:
      - "tests/integration/test-template-e2e.py"
    git_checkpoint: "OB-TOOL-005-01: E2E Testing"
  
  - ac_id: "OB-TOOL-005-02"
    title: "E2E Template Testing - Custom Template Support"
    description: |
      Test custom template creation and usage:
      1. Create custom template via generator
      2. Add content via population tool
      3. Use custom template in generated orchestrator
      4. Execute with custom content
      5. Verify works identically to built-in templates
    priority: "HIGH"
    estimated_hours: 8
    test_count: 12
    acceptance_criteria_items:
      - "Custom templates work identically to built-in"
      - "Content population successful"
      - "Orchestrator correctly uses custom template"
      - "Response generation works"
      - "Audit trail consistent"
    git_checkpoint: "OB-TOOL-005-02: Custom Template Support"

