# PHASE-REMEDIATION-01: Critical Architecture Issues Remediation
# =============================================================================
# Purpose: Fix 4 critical issues blocking production readiness
# Status: READY_FOR_IMPLEMENTATION
# Requires: PHASE-16-ORCHESTRATOR-CONTINUATION
# Estimated Duration: 4 days (32 hours)
# =============================================================================

phase:
  id: "PHASE-REMEDIATION-01"
  title: "Critical Architecture Issues Remediation"
  description: |
    Fix 4 critical issues identified in post-implementation architecture review (Jan 16, 2026):
    
    ISSUE-001: AST Scanning Not Used - Intent Router bypasses comprehension
    - Root Cause: No ASTIntelligenceEngine, CallGraphBuilder, DependencyMapper integration
    - Impact: Cannot perform deep code analysis per LENS protocol
    - Fix: 6 ACs integrating AST analysis, call graphs, impact analysis
    - Severity: CRITICAL - Blocks PHASE-17 Domain Brain
    
    ISSUE-003: Response Verbosity & Header Injection Gap
    - Root Cause: Chat interface bypasses ResponseHeaderInjector; Copilot ignores guidelines
    - Impact: Responses 300-500% longer than standard; missing copyright headers
    - Fix: 3 ACs enforcing verbosity limits, adding header wrapper
    - Severity: HIGH - Blocks production deployment
    
    ISSUE-004: Bare Except Clauses & Hardcoded Paths
    - Root Cause: CORE-013 violations + platform-specific path hardcoding
    - Impact: Silent exceptions mask errors; tests fail on CI systems
    - Fix: 2 ACs replacing bare except + fixing hardcoded paths
    - Severity: CRITICAL - Blocks CI/CD automation
    
    ISSUE-002 (Business Knowledge) deferred to PHASE-17 as strategic phase requiring design
  
  order: 18
  status: "READY_FOR_IMPLEMENTATION"
  locked: false
  
  requires: "PHASE-16-ORCHESTRATOR-CONTINUATION"
  required_for: "PHASE-17-DOMAIN-BRAIN"
  blocking: true
  
  estimated_hours: 32
  estimated_days: 4
  
  ac_ids: 11
  completed_ac_ids: 0
  progress_percentage: 0.0
  
  # Issue Remediation Mapping
  issue_remediation:
    - issue_id: "ISSUE-001"
      title: "AST Scanning Not Used - Intent Router bypassed"
      severity: "CRITICAL"
      acs: ["AC-REM-001-01", "AC-REM-001-02", "AC-REM-001-03", "AC-REM-001-04", "AC-REM-001-05", "AC-REM-001-06"]
      hours: 15
    - issue_id: "ISSUE-003"
      title: "Response Verbosity & Header Injection"
      severity: "HIGH"
      acs: ["AC-REM-003-01", "AC-REM-003-02", "AC-REM-003-03"]
      hours: 7
    - issue_id: "ISSUE-004"
      title: "Bare Except Clauses & Hardcoded Paths"
      severity: "CRITICAL"
      acs: ["AC-REM-004-01", "AC-REM-004-02"]
      hours: 6

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  
  # =========================================================================
  # ISSUE-001: AST Scanning & Intent Router Comprehension (6 ACs)
  # =========================================================================
  
  - ac_id: "AC-REM-001-01"
    title: "ASTIntelligenceEngine integrated into Interaction Orchestrator LENS comprehension"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 3
    
    description: |
      Integrate ASTIntelligenceEngine into the Interaction Orchestrator's
      LENS comprehension phase. For every user request, the orchestrator
      should parse target files using AST analysis.
    
    acceptance_tests:
      - "ASTIntelligenceEngine instantiated in InteractionOrchestrator.comprehend_request()"
      - "ASTIntelligenceEngine.parse_file() called for each identified target file"
      - "Parse results include function/class definitions, type signatures"
      - "Tests verify AST parsing on 5+ Python files with varying complexity"
    
    implementation_notes: |
      1. Import ASTIntelligenceEngine in interaction_orchestrator.py
      2. Instantiate in comprehend_request() with cache enabled
      3. For each target_file in identified_targets:
         - Call engine.parse_file(target_file)
         - Store result in comprehension_context
      4. Write 8 unit tests validating parse results
      
      Location: src/orchestrators/interaction_orchestrator.py
      Related Files:
      - src/core/intelligence/ast_intelligence.py (engine)
      - src/core/intelligence/knowledge_graph.py (output storage)
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-001-02"
    title: "CallGraphBuilder traces layer-to-layer relationships"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 3
    
    description: |
      Build call graphs from parsed AST to trace how functions/methods
      call each other across layers. This enables layer-to-layer impact
      analysis (UI → Service → Repository → Database).
    
    acceptance_tests:
      - "CallGraphBuilder.build_from_parse_result() creates call graph"
      - "Call graph identifies edges: calls, imports, depends_on"
      - "Graph traversal finds 3+ layer transitions (UI→Service→Repo)"
      - "Tests verify transitive dependency calculation"
    
    implementation_notes: |
      1. After AST parse, call CallGraphBuilder.build_from_parse_result()
      2. Store graph in comprehension_context['call_graph']
      3. Implement layer detection (folder structure → layer)
      4. Trace paths through layers
      5. Write 6 tests validating graph construction and queries
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-001-03"
    title: "DependencyMapper creates import classification"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 2
    
    description: |
      Create dependency map classifying all imports: internal (CORTEX),
      external (third-party), stdlib. This enables identifying what breaks
      if dependencies change.
    
    acceptance_tests:
      - "DependencyMapper.create_from_parse_result() classifies imports"
      - "Classification: internal, external, stdlib"
      - "Transitive dependencies tracked 3+ levels deep"
      - "Tests verify transitive depth calculation"
    
    implementation_notes: |
      1. Call DependencyMapper.create_from_parse_result(parse_result)
      2. Classify each import as internal/external/stdlib
      3. Recursively trace transitive dependencies
      4. Store in comprehension_context['dependencies']
      5. Write 5 tests validating classification and transitive tracing
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-001-04"
    title: "PatternDetector identifies architectural patterns"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 2
    
    description: |
      Detect architectural patterns (singleton, factory, decorator, etc.)
      and structural patterns (MVC, layered, service-based). This provides
      context about architectural intent.
    
    acceptance_tests:
      - "PatternDetector.detect_patterns(parse_result) finds patterns"
      - "Detects ≥5 pattern types (singleton, factory, decorator, adapter, observer)"
      - "For each pattern: name, location, participants"
      - "Tests verify pattern detection on known pattern implementations"
    
    implementation_notes: |
      1. Call PatternDetector.detect_patterns(parse_result)
      2. Store results in comprehension_context['patterns']
      3. Each pattern includes: type, file, line, participants
      4. Handle "no patterns found" case gracefully
      5. Write 5 tests validating pattern detection accuracy
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-001-05"
    title: "Holistic context YAML generated and presented for approval"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 3
    
    description: |
      Generate comprehensive YAML containing parsed files, call graphs,
      dependencies, patterns, and impact map. Present this to user for
      approval before executing any changes.
    
    acceptance_tests:
      - "ComprehensionYAMLBuilder creates valid YAML"
      - "YAML includes sections: parsed_files, call_graphs, dependencies, patterns, impact_map"
      - "Each section populated with comprehension data"
      - "User approval gate: require explicit yes/no before proceeding"
      - "Tests verify YAML structure and completeness"
    
    implementation_notes: |
      1. Create comprehension_to_yaml() method
      2. YAML structure:
         parsed_files:
           - file: path
             functions: [list]
             classes: [list]
         call_graphs:
           - source: function
             targets: [list]
         dependencies:
           - module: name
             type: internal|external|stdlib
             transitive_depth: N
         patterns:
           - type: pattern_name
             location: file:line
         impact_map:
           - if_changed: target
             breaks: [list]
      3. Display YAML to user with "Approve? (yes/no)" prompt
      4. Only proceed if user confirms
      5. Write 6 tests validating YAML structure and approval gate
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-001-06"
    title: "Intent Router executes on EVERY request (continuous pattern)"
    priority: "CRITICAL"
    category: "Intent Router"
    estimated_hours: 2
    
    description: |
      Ensure Intent Router's comprehension loop runs on EVERY user request,
      not just the first. This was failing in issue-report-01: only first
      request had comprehension, subsequent requests skipped it.
    
    acceptance_tests:
      - "4+ sequential requests all show comprehension output"
      - "Each request presents holistic context YAML"
      - "Each request requires user approval before execution"
      - "No bypass even when approval was given on previous request"
      - "Tests verify continuous pattern with mock user inputs"
    
    implementation_notes: |
      1. Move comprehension logic into main loop (not one-time)
      2. In MasterOrchestrator.execute() loop:
         - Call InteractionOrchestrator.comprehend_request()
         - Every iteration, not just first
      3. Store comprehension results for decision making
      4. Don't cache/skip comprehension between turns
      5. Write 5 tests with 4+ sequential requests validating loop execution
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  # =========================================================================
  # ISSUE-003: Response Verbosity & Header Injection (3 ACs)
  # =========================================================================
  
  - ac_id: "AC-REM-003-01"
    title: "Copilot system prompt enforces CORTEX communication guidelines"
    priority: "HIGH"
    category: "Communication"
    estimated_hours: 2
    
    description: |
      Update GitHub Copilot system prompt to enforce CORTEX communication
      style guide: <500 words for simple queries, <1500 for complex.
      Forbid process narration ("Let me...", "I will..."), limit emoji,
      one explanation per concept maximum.
    
    acceptance_tests:
      - "10 sample Copilot responses average <500 words each"
      - "No responses contain 'Let me', 'I will', 'I can', process narration"
      - "No emoji or ASCII art in responses"
      - "No concept explained more than once per response"
      - "All sample responses have clear structure: result first, justification second"
    
    implementation_notes: |
      1. Update GitHub Copilot system prompt (external)
      2. Add sections:
         - COMMUNICATION STYLE (STRICT)
         - VERBOSITY RULES (max 500 words simple, 1500 complex)
         - FORBIDDEN PHRASES (Let me, I will, Perfect, Excellent, etc.)
         - RESPONSE STRUCTURE (result first, justification second)
      3. Test with 10 varied prompts
      4. Measure word count, check for forbidden phrases
      5. Document updated prompt in cortex_brain/tier0/
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-003-02"
    title: "Chat interface wrapper applies response header injection"
    priority: "HIGH"
    category: "Communication"
    estimated_hours: 4
    
    description: |
      Create ChatResponseFormatter wrapper that applies ResponseHeaderInjector
      to all Copilot responses at the chat interface boundary. Ensures headers
      and copyright notices appear in external-facing responses.
    
    acceptance_tests:
      - "ChatResponseFormatter class exists in src/adapters/"
      - "Wrapper instantiates ResponseHeaderInjector on init"
      - "All chat responses wrapped with headers"
      - "Headers include: orchestrator, operation, phase, author, timestamp"
      - "Copyright footer included on all responses"
      - "Unit tests verify wrapper functionality (10 tests)"
      - "Integration tests verify responses through wrapper (5 tests)"
    
    implementation_notes: |
      1. Create src/adapters/chat_response_formatter.py
      2. Class ChatResponseFormatter:
         - __init__: instantiate ResponseHeaderInjector
         - format_response(content: str) -> str:
           * Call injector.inject_headers_and_footers()
           * Add CORTEX header with metadata
           * Include copyright notice
      3. Integration point: wrap all Copilot responses
      4. Write 15 tests (10 unit + 5 integration)
      5. Document in architecture guide
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-003-03"
    title: "Copyright notice appears in all chat responses"
    priority: "HIGH"
    category: "Communication"
    estimated_hours: 1
    
    description: |
      Verify that all Copilot chat responses include copyright notice:
      "Copyright © 2025-2026 Asif Hussain. All rights reserved."
      This completes compliance with CORTEX communication standards.
    
    acceptance_tests:
      - "10 sample responses all contain copyright notice"
      - "Copyright appears in footer section"
      - "Copyright text exactly matches specification"
      - "No responses missing copyright header"
    
    implementation_notes: |
      1. In ChatResponseFormatter, add copyright to footer
      2. Footer structure:
         ---
         **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
      3. Append to every response after content
      4. Test with 10 random queries
      5. Verify grep: grep -c "Copyright © 2025-2026" > 0
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  # =========================================================================
  # ISSUE-004: Code Quality & Portability (2 ACs)
  # =========================================================================
  
  - ac_id: "AC-REM-004-01"
    title: "All bare except clauses replaced with specific exceptions (CORE-013)"
    priority: "CRITICAL"
    category: "Code Quality"
    estimated_hours: 3
    
    description: |
      Replace all bare except: clauses with specific exception types per
      CORE-013 governance rule. This prevents silent exception swallowing
      that masks critical errors.
    
    acceptance_tests:
      - "grep -rn 'except:' src/ returns 0 matches (no bare except)"
      - "All replaced with specific exception types"
      - "3 files identified in ISSUE-004: audit_required_validator.py (2), compliance_gate.py (1)"
      - "Each replaced except logs exception before handling"
      - "Unit tests verify correct exception is caught (3 tests)"
      - "No functionality regression (all existing tests pass)"
    
    implementation_notes: |
      1. Files to fix:
         - src/core/audit_required_validator.py (lines 160, 425)
         - src/ci_cd/compliance_gate.py (line 184)
      2. For each bare except:
         - Identify what exceptions could be raised
         - Replace with specific types: except (ValueError, KeyError, ...):
         - Add logging: logger.exception(f"Caught {type(e).__name__}: {e}")
         - Handle appropriately (re-raise, fallback, etc.)
      3. Verify: grep -rn 'except:' src/ → 0 matches
      4. Write tests validating specific exceptions are caught
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null
  
  - ac_id: "AC-REM-004-02"
    title: "All hardcoded paths replaced with dynamic resolution (CORE-005)"
    priority: "CRITICAL"
    category: "Code Quality"
    estimated_hours: 3
    
    description: |
      Replace all hardcoded /Users/asifhussain/PROJECTS/CORTEX paths with
      dynamic path resolution. This enables cross-platform execution and
      CI/CD automation per CORE-005.
    
    acceptance_tests:
      - "grep -rn '/Users/asifhussain' tests/ returns 0 matches"
      - "All 18 instances replaced with Path(__file__).parent patterns"
      - "2 files identified in ISSUE-004: test_auto_indexing.py (17), test_intent_reflection_protocol.py (1)"
      - "Tests run successfully on any machine with any project root"
      - "CI/CD systems (Linux, Windows) can execute tests without modification"
      - "Integration tests verify paths work on different systems (mocked)"
    
    implementation_notes: |
      1. Files to fix:
         - tests/unit/tier3/test_auto_indexing.py (17 instances)
         - tests/unit/core/intent/test_intent_reflection_protocol.py (1 instance)
      2. For each hardcoded path:
         - Replace with: Path(__file__).parent.parent / "relative/path"
         - Or use: get_project_root() / "relative/path"
         - Store in helper function for reuse
      3. Verify: grep -rn '/Users/asifhussain' tests/ → 0 matches
      4. Run full test suite on multiple path setups
      5. Add CI validation to prevent future hardcoding
    
    status: "NOT_STARTED"
    completed_at: null
    git_checkpoint: null

