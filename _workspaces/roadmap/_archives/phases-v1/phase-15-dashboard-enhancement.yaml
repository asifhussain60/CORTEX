# =============================================================================
# DEPLOYMENT & MULTI-MACHINE SETUP
# =============================================================================

deployment:
  static_files: "Copy src/dashboard/frontend/ to web server"
  backend_server: "Run FastAPI from src/dashboard/api/main.py"
  environment_variables:
    - "DATABASE_PATH: ../../../cortex_brain/state/governance.db"
    - "CORTEX_MASTER_PATH: ../../../.github/roadmap/cortex-master.yaml"
    - "API_PORT: 8000"
    - "CORS_ORIGINS: ['http://localhost:3000', 'http://localhost:8080']"
  
  docker_deployment: |
    # Optional: Dockerfile for containerized deployment
    FROM python:3.11-slim
    WORKDIR /app
    COPY src/dashboard/api requirements.txt ./
    RUN pip install -r requirements.txt
    COPY cortex_brain ../cortex_brain
    COPY .github/roadmap ../.github/roadmap
    EXPOSE 8000
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

multi_machine:
  setup:
    step_1: "Clone repo and checkout CORTEX6"
    step_2: "Copy CORTEX logo files to .github/branding/"
    step_3: "Set up Python venv and install dashboard dependencies"
    step_4: "Run FastAPI backend: python src/dashboard/api/main.py"
    step_5: "Open src/dashboard/frontend/index.html in browser"
  
  sync_protocol:
    before_work: "git pull origin CORTEX6"
    after_work: "git commit -m 'DO-XXX-XX: [description]' && git push"
    conflict_resolution: "Always merge, never force-push"

