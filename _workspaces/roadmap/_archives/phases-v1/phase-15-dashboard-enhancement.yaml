      - "src/dashboard/api/enforcement.py"
    priority: "MEDIUM"
    
  - ac_id: "DO-005-03"
    title: "Phase Lock Management Interface"
    description: |
      Admin interface for phase lifecycle:
      - View all phases and current lock status
      - Display unlock prerequisites
      - Show audit trail for phase locks
      - (Read-only: no actual unlock capability)
    acceptance_tests:
      - "All phases listed with lock status"
      - "Locked phases show lock timestamp"
      - "Locked phases show who locked them"
      - "Prerequisites listed for locked phases"
      - "Audit trail shows locking events"
    components:
      - "src/dashboard/frontend/js/components/admin/phase-management.js"
      - "src/dashboard/api/phase_status.py"
    priority: "MEDIUM"

# =============================================================================
# DIRECTORY STRUCTURE
# =============================================================================

directory_structure:
  src/dashboard:
    api:
      __init__.py
      main.py                    # FastAPI app entry point
      brain_metrics.py           # Tier status, health checks
      audit_stream.py            # Audit log endpoints + WebSocket
      orchestrator_status.py     # Orchestrator registry
      phase_status.py            # Phase tracker endpoints
      metrics.py                 # Performance metrics
      governance.py              # Governance rules, enforcement
      health.py                  # System health status
      reports.py                 # Report generation
      websocket_manager.py       # WebSocket connection manager
    
    frontend:
      index.html                 # Main entry point
      observatory.html           # Brain Observatory view
      temporal.html              # Temporal Cortex view
      constellation.html         # Orchestrator Constellation
      plans.html                 # Plan Hub
      admin.html                 # Admin control panel
      
      assets:
        cortex-logo.png          # Primary logo (200x200px)
        cortex-logo-white.png    # White variant for dark BG
        cortex-logo-icon.png     # Icon variant (32x32px)
        cortex-favicon.ico       # Favicon
      
      js:
        app.js                   # Main initialization
        
        components:
          common:
            header.js            # Navigation header with logo
            sidebar.js           # Sidebar navigation
            tab-switcher.js      # Tab interface
            search-bar.js        # Global search
            notification-center.js  # Notifications
            glass-panel.js       # Reusable glassmorphism container
          
          brain:
            brain-map.js         # 4-tier visualization
            tier-card.js         # Tier card component
            tier-detail.js       # Tier detail panel
          
          neural:
            neural-pulse.js      # Health indicator animation
            status-indicator.js  # Status badge
          
          temporal:
            audit-timeline.js    # Searchable audit log
            audit-entry.js       # Single audit entry
            audit-filters.js     # Filter controls
            hash-chain-viz.js    # Hash chain visualization
            ac-context-card.js   # AC-ID context cards
          
          orchestrator:
            orchestrator-grid.js # Grid view
            orchestrator-card.js # Card component
            dependency-graph.js  # D3.js dependency graph
            health-indicator.js  # Health status
          
          admin:
            performance-dashboard.js  # Performance metrics
            health-panel.js           # System health
            rules-viewer.js           # Governance rules
            enforcement-monitor.js    # Rule enforcement
            phase-management.js       # Phase lifecycle
            report-builder.js         # Custom reports
          
          plan:
            plan-hub.js          # Unified plan viewer
            phase-selector.js    # Phase dropdown
            phase-timeline.js    # Timeline view
            ac-grid.js           # AC status grid
        
        utils:
          api-client.js          # Fetch wrapper for API
          websocket-client.js    # WebSocket manager
          date-formatter.js      # Date/time utilities
          csv-export.js          # CSV export utility
          pdf-export.js          # PDF export utility
      
      css:
        index.css                # Main stylesheet
        header.css               # Header styles
        sidebar.css              # Sidebar styles
        glassmorphism.css        # Glassmorphism utilities
        animations.css           # Animation definitions
        responsive.css           # Responsive breakpoints
        colors.css               # Color system
        tabs.css                 # Tab component styles
        search.css               # Search bar styles
        notifications.css        # Notification styles
        tables.css               # Table styles
        forms.css                # Form styles
        tailwind-custom.css      # Custom Tailwind extensions

  .github/branding:
    cortex-logo.png             # Primary CORTEX logo (200x200px)
    cortex-logo-white.png       # White variant
    cortex-logo-dark.png        # Dark variant
    cortex-logo-icon.png        # Icon version (32x32px)
    cortex-logo-small.png       # Small version (128x128px)
    BRANDING-GUIDELINES.md      # Branding usage guidelines
    LOGO-PLACEMENT-GUIDE.md     # Logo placement recommendations

  tests:
    unit/dashboard:
      test_ui_components.py      # Component unit tests
      test_api_endpoints.py      # API endpoint tests
      test_data_transformations.py  # Data formatting tests
    
    integration/dashboard:
      test_frontend_integration.py   # Frontend integration
      test_websocket_streaming.py    # WebSocket tests
      test_export_functionality.py   # Export features
      test_responsive_design.py      # Responsive design tests

# =============================================================================
# IMPLEMENTATION SEQUENCE
# =============================================================================

implementation_sequence:
  day_1:
    focus: "Branding & Base Infrastructure"
    description: "Set up logo assets, color system, basic component framework"
