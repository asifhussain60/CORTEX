    notes: 'GAP-ANALYSIS-2026-01-16 REMEDIATION PHASE


      Root Cause: CORTEX implements features at code level but incompletely at documentation
      level.

      - Infrastructure 100% ready (ResponseHeaderInjector, templates engine, etc.)

      - But prompts don''t document it → agents don''t know about features

      - And content not created → engines have nothing to load


      Fix Strategy:

      1. P0: Update CORTEX.prompt.md and copilot-instruction.md (2 hours)

      2. P1: Create tier2 response templates (2 hours)

      3. P2: Add validation tooling (1 hour)

      4. VERIFY: Run validation script before phase lock


      Files to Create:

      - cortex_brain/tier2/base/success-response.yaml

      - cortex_brain/tier2/base/error-response.yaml

