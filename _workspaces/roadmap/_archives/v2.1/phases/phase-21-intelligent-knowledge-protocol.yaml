# =============================================================================
# PHASE-21: INTELLIGENT KNOWLEDGE PROTOCOL
# =============================================================================
# Unified Knowledge Access, Smart Routing & Bulk Ingestion Pipeline
# Status: NOT_STARTED
# AC-IDs: 8 (AC-IKP-001-01 through AC-IKP-005-01)
# Estimated Hours: 39
# =============================================================================

metadata:
  phase_id: "PHASE-21-INTELLIGENT-KNOWLEDGE-PROTOCOL"
  title: "Intelligent Knowledge Protocol: Unified Access, Smart Routing & Bulk Ingestion"
  version: "1.0.0"
  created: "2026-01-18"
  author: "cortex-builder"
  status: "NOT_STARTED"
  priority: "P1"

# =============================================================================
# PROBLEM STATEMENT
# =============================================================================

problem_statement:
  summary: |
    CORTEX has two knowledge systems (Technical & Business) with similar but
    not formally unified interfaces. This creates redundant queries, no smart
    routing, no change detection, and no bulk ingestion capability.
  
  gaps_identified:
    - id: "GAP-IKP-001"
      title: "No unified interface"
      impact: "Consumers must know about both repositories"
      current_state: "Dual integration in MasterOrchestrator"
    
    - id: "GAP-IKP-002"
      title: "No intelligent routing"
      impact: "Every query hits both backends"
      current_state: "Parallel evaluation, no optimization"
    
    - id: "GAP-IKP-003"
      title: "No change detection"
      impact: "Company knowledge drift goes unnoticed"
      current_state: "Manual re-ingestion required"
    
    - id: "GAP-IKP-004"
      title: "No bulk ingestion"
      impact: "Large datasets require manual processing"
      current_state: "BKIO handles single documents"
    
    - id: "GAP-IKP-005"
      title: "No optimization pipeline"
      impact: "Raw data stored without CORTEX refinement"
      current_state: "Direct entity mapping"

# =============================================================================
# SOLUTION ARCHITECTURE
# =============================================================================

solution_architecture:
  components:
    - name: "KnowledgeProvider Protocol"
      purpose: "Type-safe structural subtyping for ANY knowledge backend"
      pattern: "typing.Protocol (matches orchestrator_traits.py)"
      interface:
        - "is_loaded: bool"
        - "entry_count: int"
        - "domains: List[str]"
        - "query(domains, keywords) -> QueryResult"
        - "get_by_domain(domain) -> List[Entry]"
        - "get_relevant_knowledge(context) -> List[Entry]"
    
    - name: "IntelligentKnowledgeRouter"
      purpose: "Smart delegation based on query intent and domain signals"
      routing_strategy:
        business_signals: ["payment", "transaction", "compliance", "workflow"]
        technical_signals: ["architecture", "security", "testing", "performance"]
        confidence_threshold: 0.7
        fallback: "PARALLEL_BOTH"
      features:
        - "Query intent analysis"
        - "Historical pattern learning"
        - "Confidence scoring"
        - "Routing decision audit"
    
    - name: "ChangeDetectionService"
      purpose: "Automatic detection when company patterns evolve"
      detection_types:
        - type: "SCHEMA_DRIFT"
          trigger: "New entity types not in existing taxonomy"
          action: "Flag for review, suggest schema update"
        - type: "SEMANTIC_SHIFT"
          trigger: "Same terms, different descriptions"
          action: "Conflict detection → escalation"
        - type: "COVERAGE_GAP"
          trigger: "Queries failing on expected domains"
          action: "Trigger re-ingestion suggestion"
        - type: "STALENESS"
          trigger: "TTL expiration on entities"
          action: "Archive + notify"
        - type: "VOLUME_ANOMALY"
          trigger: "Sudden spike/drop in domain entities"
          action: "Alert for verification"
    
    - name: "BulkIngestionPipeline"
      purpose: "Scalable data transformation for large datasets"
      stages:
        - stage: "INTAKE"
          responsibility: "Accept multiple formats (JSON, CSV, XML, API)"
          extensibility: "IntakeAdapter interface"
        - stage: "FILTER"
          responsibility: "Remove noise, duplicates, irrelevant content"
          extensibility: "FilterStrategy plugins"
        - stage: "REFINE"
          responsibility: "Normalize, deduplicate, merge related entities"
          extensibility: "RefinementRule registry"
        - stage: "TRANSFORM"
          responsibility: "Convert to YAML/JSON (NEVER Markdown)"
          extensibility: "OutputFormatter interface"
        - stage: "VALIDATE"
          responsibility: "Schema compliance, relationship integrity"
          extensibility: "Validator chain"
        - stage: "STORE"
          responsibility: "Persist to Domain Brain / Knowledge Repository"
          extensibility: "StorageBackend abstraction"
      scalability:
        - "Batch processing for large files"
        - "Streaming mode for continuous feeds"
        - "Parallel workers for refinement"
        - "Checkpoint recovery for failed ingestion"
        - "Progress reporting with real-time metrics"
    
    - name: "RefinementEngine"
      purpose: "Optimize raw data for CORTEX consumption before storage"
      operations:
        - operation: "ENTITY_EXTRACTION"
          description: "Identify services, APIs, workflows"
        - operation: "RELATIONSHIP_INFERENCE"
          description: "Detect dependencies, hierarchies"
        - operation: "DEDUPLICATION"
          description: "Hash-based duplicate detection"
        - operation: "NORMALIZATION"
          description: "Standardize naming, casing, format"
        - operation: "QUALITY_SCORING"
          description: "Rate completeness, clarity"
        - operation: "CORTEX_ENRICHMENT"
          description: "Add tags, domains, priority metadata"
    
    - name: "UnifiedKnowledgeService"
      purpose: "Single entry point wrapping router with unified interface"
      features:
        - "Source attribution in results"
        - "Cross-backend aggregation"
        - "Result deduplication"
        - "Audit trail integration"

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  # Component 1: Knowledge Provider Protocol
  - ac_id: "AC-IKP-001-01"
    title: "KnowledgeProvider Protocol Definition"
    description: |
      Define typing.Protocol interface that both KnowledgeRepository and 
      BusinessKnowledgeRepository satisfy. Includes: is_loaded, entry_count,
      domains, query(), get_by_domain(), get_relevant_knowledge().
    priority: "CRITICAL"
    estimated_hours: 2
    test_count: 10
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/protocols.py"
    governance:
      - "CORE-008: TDD"
      - "CORE-011: Type hints"
      - "CORE-012: Docstrings"
    
  - ac_id: "AC-IKP-001-02"
    title: "Protocol Compliance Verification"
    description: |
      Verify both repositories satisfy KnowledgeProvider Protocol.
      Update type hints in MasterOrchestrator to use Protocol.
      Add compliance tests for structural subtyping validation.
    priority: "HIGH"
    estimated_hours: 1
    test_count: 8
    status: "NOT_STARTED"
    deliverables:
      - "tests/unit/core/knowledge/test_protocols.py"
      - "Updated type hints in master_orchestrator.py"
    
  # Component 2: Intelligent Knowledge Router
  - ac_id: "AC-IKP-002-01"
    title: "IntelligentKnowledgeRouter Implementation"
    description: |
      Smart router that analyzes query intent and routes to appropriate backend.
      Signals: keywords, explicit domain, historical patterns.
      Outputs confidence score and routing decision audit entry.
    priority: "CRITICAL"
    estimated_hours: 4
    test_count: 20
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/router.py"
      - "tests/unit/core/knowledge/test_router.py"
    
  - ac_id: "AC-IKP-002-02"
    title: "Router Integration with MasterOrchestrator"
    description: |
      Replace dual parallel evaluation in coordinate_operation() with
      IntelligentKnowledgeRouter. Fallback to parallel mode if confidence < threshold.
      Track routing efficiency metrics.
    priority: "HIGH"
    estimated_hours: 2
    test_count: 12
    status: "NOT_STARTED"
    deliverables:
      - "Updated src/orchestrators/core/master_orchestrator.py"
    
  # Component 3: Change Detection Service
  - ac_id: "AC-IKP-003-01"
    title: "ChangeDetectionService Implementation"
    description: |
      Monitor ingestion events for schema drift, semantic shift, coverage gaps,
      staleness, and volume anomalies. Emit alerts for human review.
      Auto-remediate low-risk additive changes.
    priority: "HIGH"
    estimated_hours: 6
    test_count: 25
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/change_detection.py"
      - "tests/unit/core/knowledge/test_change_detection.py"
    
  - ac_id: "AC-IKP-003-02"
    title: "Alert Pipeline and Notification System"
    description: |
      Configure alert thresholds and notification channels.
      Integrate with audit trail for change tracking.
      Support manual override and acknowledgment workflow.
    priority: "MEDIUM"
    estimated_hours: 2
    test_count: 10
    status: "NOT_STARTED"
    deliverables:
      - "Alert configuration in change_detection.py"
      - "Audit trail integration"
    
  # Component 4: Bulk Ingestion Pipeline
  - ac_id: "AC-IKP-004-01"
    title: "BulkIngestionPipeline Architecture"
    description: |
      Extensible pipeline: IntakeAdapter → FilterStrategy → RefinementRule →
      OutputFormatter → Validator → StorageBackend.
      Registry pattern for plugin discovery. Batch and streaming modes.
    priority: "HIGH"
    estimated_hours: 8
    test_count: 30
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/ingestion/__init__.py"
      - "src/core/knowledge/ingestion/intake.py"
      - "src/core/knowledge/ingestion/filters.py"
      - "src/core/knowledge/ingestion/transformers.py"
      - "src/core/knowledge/ingestion/validators.py"
      - "src/core/knowledge/ingestion/pipeline.py"
      - "tests/unit/core/knowledge/test_ingestion_pipeline.py"
    
  - ac_id: "AC-IKP-004-02"
    title: "RefinementEngine for CORTEX Optimization"
    description: |
      Pre-storage optimization: entity extraction, relationship inference,
      deduplication, normalization, quality scoring, CORTEX metadata enrichment.
      Output: YAML/JSON only (never Markdown).
    priority: "HIGH"
    estimated_hours: 6
    test_count: 20
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/ingestion/refinement.py"
    
  # Component 5: Unified Knowledge Façade
  - ac_id: "AC-IKP-005-01"
    title: "UnifiedKnowledgeService Façade"
    description: |
      Single entry point that wraps IntelligentKnowledgeRouter.
      Provides unified query interface with source attribution.
      Supports cross-backend aggregation and deduplication.
    priority: "MEDIUM"
    estimated_hours: 4
    test_count: 15
    status: "NOT_STARTED"
    deliverables:
      - "src/core/knowledge/unified_service.py"
      - "tests/integration/test_unified_knowledge_service.py"

