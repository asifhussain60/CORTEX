# =============================================================================
# EXTENSIBILITY POINTS
# =============================================================================

extensibility:
  intake_adapters:
    built_in:
      - "JSONIntakeAdapter"
      - "CSVIntakeAdapter"
    optional:
      - "XMLIntakeAdapter"
      - "APIIntakeAdapter"
    custom: "Implement IntakeAdapter interface"
  
  filter_strategies:
    built_in:
      - "DuplicateFilter"
      - "NoiseFilter"
      - "RelevanceFilter"
    custom: "Implement FilterStrategy interface"
  
  refinement_rules:
    built_in:
      - "EntityExtraction"
      - "RelationshipInference"
      - "Normalization"
    custom: "Implement RefinementRule interface"
  
  output_formatters:
    allowed:
      - "YAMLFormatter (default)"
      - "JSONFormatter (alternative)"
    forbidden:
      - "MarkdownFormatter (NEVER)"
  
  storage_backends:
    built_in:
      - "DomainBrainStorage (business knowledge)"
      - "FileSystemStorage (technical knowledge)"
    custom: "Implement StorageBackend interface"

