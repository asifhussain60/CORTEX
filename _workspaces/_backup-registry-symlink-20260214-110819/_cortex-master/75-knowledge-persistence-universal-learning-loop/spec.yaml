# ============================================================================
# VISION & GOALS
# ============================================================================

overview:
  vision: |
    Transform CORTEX from ephemeral operation execution to a continuously learning system that:
    
    1. **Persists Knowledge** — Every repository onboarding creates domain YAML artifacts 
       in company/domains/{repository}/ with architecture, security, tech stack, and best 
       practices extracted from deep analysis.
    
    2. **Enhances Intelligence Layers** — Every operation updates cortex_brain/ perception 
       (pattern recognition), reasoning (strategy selection), and action (execution planning) 
       layers based on observed patterns and outcomes.
    
    3. **Engages Universal Learning Loop** — OBSERVE (extract patterns) → ANALYZE (effectiveness) 
       → SYNTHESIZE (knowledge) → APPLY (enhance CORTEX) after every operation, not just 
       implementation tasks.
    
    4. **Enforces Persistence** — New KnowledgePersistenceAgent blocks ONBOARD operations that 
       don't generate knowledge artifacts and warns on other operations that skip learning loop 
       engagement.
    
    5. **Enables Cross-Session Learning** — Future operations benefit from past learnings, 
       reducing redundant analysis and improving first-time success rates.

  problem_statement: |
    Current State (P0 VIOLATION):
    - Repository onboarding returns inline report → knowledge vanishes after chat session
    - No company/domains/ YAML artifacts created → zero knowledge persistence
    - Brain intelligence layers (perception/reasoning/action) never updated → no learning
    - Universal learning loop not engaged → CORTEX doesn't get smarter over time
    - Next onboarding of similar repository → starts from zero (no pattern reuse)
    - MCP tools exist but underutilized → manual file reading bypasses governance
    
    Impact:
    - ❌ Zero knowledge retention across sessions
    - ❌ Repeated analysis of similar codebases (inefficiency)
    - ❌ No improvement in pattern recognition (static intelligence)
    - ❌ Missing audit trail for onboarding decisions
    - ❌ Cannot answer "What did we learn about X repository?" in future sessions

  success_criteria:
    - "✅ Every ONBOARD operation creates 5+ domain YAML files in company/domains/"
    - "✅ Brain intelligence layers updated with patterns from every operation"
    - "✅ Universal learning loop engaged for ONBOARD, ANALYZE, IMPLEMENT intents"
    - "✅ KnowledgePersistenceAgent blocks ONBOARD without knowledge artifacts"
    - "✅ Future operations demonstrate learning (reuse patterns, faster analysis)"
    - "✅ 90%+ test coverage for new services and agents"
    - "✅ All operations use MCP tools (no direct file reading for implementation)"

# ============================================================================
# STAGES (TDD-FIRST)
# ============================================================================

stages:
  # --------------------------------------------------------------------------
  # S1: Knowledge Persistence Service (Foundation)
  # --------------------------------------------------------------------------
  - id: "S1"
    name: "Knowledge Persistence Service"
    description: |
      Create KnowledgePersistenceService to convert onboarding findings into structured 
      YAML knowledge artifacts in company/domains/{repository}/.
      
      Components:
      - cortex/knowledge/persistence/knowledge_persistence_service.py
      - cortex/knowledge/persistence/domain_yaml_generator.py
      - cortex/knowledge/persistence/schema_validator.py
      
      Capabilities:
      - persist_domain_knowledge() — Create company/domains/{repo}/*.yaml
      - generate_architecture_yaml() — Extract DDD patterns, bounded contexts
      - generate_security_yaml() — Auth, secrets, vulnerabilities, compliance
      - generate_tech_stack_yaml() — Languages, frameworks, dependencies
      - generate_dependencies_yaml() — Package graph, version tracking
      - generate_best_practices_yaml() — Domain-specific patterns, standards
      - validate_yaml_schema() — Ensure consistency across repositories
      
      YAML Schema (Generic):
      ```yaml
      # company/domains/{repository}/architecture.yaml
      repository: "{repository_name}"
      architecture_style: "monolith|microservices|modular|serverless"
      patterns:
        - name: "Domain-Driven Design"
          evidence: ["bounded contexts detected", "aggregate roots"]
        - name: "Layered Architecture"
          evidence: ["clear separation of concerns"]
      bounded_contexts:
        - name: "{context_name}"
          responsibilities: ["{responsibility}"]
          interfaces: ["{interface}"]
      technical_debt:
        - category: "legacy_framework"
          description: "Legacy framework version nearing EOL"
          priority: "medium"
      ```
      
      Tests (25):
      - test_persist_domain_knowledge_creates_yaml_files
      - test_generate_architecture_yaml_extracts_patterns
      - test_generate_security_yaml_identifies_risks
      - test_generate_tech_stack_yaml_maps_dependencies
      - test_validate_yaml_schema_enforces_structure
      - test_yaml_generation_handles_missing_data_gracefully
      - test_multiple_repositories_dont_conflict
    effort: "2 days"
    tests: 25
    status: "planned"
    success_metrics:
      - "5 YAML generators (architecture, security, tech, deps, practices)"
      - "Schema validator with 10+ validation rules"
      - "100% YAML files parseable and schema-compliant"
    dependencies: []

  # --------------------------------------------------------------------------
  # S2: Universal Learning Loop Service
  # --------------------------------------------------------------------------
  - id: "S2"
    name: "Universal Learning Loop Service"
    description: |
      Implement UniversalLearningLoop service to extract patterns from every operation 
      and enhance CORTEX intelligence layers.
      
      Components:
      - cortex/learning/universal_learning_loop.py
      - cortex/learning/pattern_extractor.py
      - cortex/learning/effectiveness_analyzer.py
      - cortex/learning/knowledge_synthesizer.py
      
      Flow:
      1. OBSERVE — Extract patterns from operation results
         - Code patterns (architectural styles, design patterns)
         - Security patterns (auth mechanisms, secret management)
         - Performance patterns (optimization strategies)
         - Error patterns (common pitfalls, anti-patterns)
      
      2. ANALYZE — Evaluate effectiveness
         - Success rate of pattern application
         - Time saved by pattern reuse
         - Quality improvement metrics
      
      3. SYNTHESIZE — Generate knowledge artifacts
         - Update cortex/knowledge/best-practices/
         - Create pattern templates
         - Generate decision trees
      
      4. APPLY — Enhance intelligence layers
         - Perception: Register new pattern signatures
         - Reasoning: Add context-aware strategies
         - Action: Update execution templates
      
      Generic Pattern Schema:
      ```python
      @dataclass
      class ExtractedPattern:
          pattern_type: str  # "architecture", "security", "performance"
          name: str  # "bounded-context-separation"
          indicators: List[str]  # File structures, code markers
          context: Dict[str, Any]  # When to apply pattern
          effectiveness_score: float  # 0.0-1.0
          evidence: List[str]  # Where pattern observed
      ```
      
      Tests (25):
      - test_extract_patterns_from_onboarding_results
      - test_analyze_effectiveness_scores_patterns
      - test_synthesize_knowledge_creates_artifacts
      - test_apply_enhancements_updates_brain_layers
      - test_learning_loop_handles_partial_data
      - test_pattern_deduplication_across_operations
      - test_effectiveness_tracking_over_time
    effort: "2 days"
    tests: 25
    status: "planned"
    success_metrics:
      - "4-stage loop (OBSERVE → ANALYZE → SYNTHESIZE → APPLY)"
      - "Pattern extraction from 5+ operation types"
      - "Intelligence layer enhancement verified via tests"
    dependencies: ["S1"]

  # --------------------------------------------------------------------------
  # S3: Brain Intelligence Layer Enhancement
  # --------------------------------------------------------------------------
  - id: "S3"
    name: "Brain Intelligence Layer Enhancement"
    description: |
      Enhance cortex_brain/ perception, reasoning, and action layers to support 
      pattern-based learning from every operation.
      
      Components:
      - cortex_brain/perception/pattern_registry.py
      - cortex_brain/reasoning/strategy_selector.py
      - cortex_brain/action/execution_planner.py
      
      Perception Layer:
      - Register pattern signatures (e.g., "monolith with segments")
      - Detect patterns in new repositories via similarity matching
      - Confidence scoring for pattern detection
      
      Reasoning Layer:
      - Context-aware strategy selection (e.g., "migrate to microservices")
      - Risk assessment based on historical pattern outcomes
      - Recommendation generation with evidence
      
      Action Layer:
      - Execution plan templates for common operations
      - Step-by-step guidance based on past successes
      - Adaptive planning based on repository characteristics
      
      Generic Pattern Registry Schema:
      ```python
      @dataclass
      class RegisteredPattern:
          id: str
          name: str
          signature: Dict[str, Any]  # Detection rules
          context: Dict[str, str]  # When applicable
          strategies: List[str]  # Recommended approaches
          risk_factors: List[str]  # Known challenges
          success_rate: float  # Historical effectiveness
      ```
      
      Tests (20):
      - test_perception_registers_patterns
      - test_perception_detects_patterns_in_new_repos
      - test_reasoning_selects_strategies_by_context
      - test_reasoning_scores_risk_accurately
      - test_action_generates_execution_plans
      - test_brain_layers_integrate_with_learning_loop
      - test_pattern_matching_handles_partial_signatures
    effort: "2 days"
    tests: 20
    status: "planned"
    success_metrics:
      - "Pattern registry with 10+ initial patterns"
      - "Strategy selector with context-aware scoring"
      - "Execution planner generates actionable steps"
    dependencies: ["S2"]

  # --------------------------------------------------------------------------
  # S4: Repository Onboarding Orchestrator Enhancement
  # --------------------------------------------------------------------------
  - id: "S4"
    name: "Repository Onboarding Orchestrator Enhancement"
    description: |
      Enhance RepositoryOnboardingOrchestrator to integrate knowledge persistence 
      and universal learning loop into every onboarding operation.
      
      Enhanced Flow:
      1. LENS Classification (existing)
      2. Deep Analysis via MCP (cortex_onboard_repository)
      3. Knowledge Persistence (NEW) → company/domains/{repo}/*.yaml
      4. Brain Enhancement (NEW) → cortex_brain/ layer updates
      5. Universal Learning Loop (NEW) → OBSERVE→ANALYZE→SYNTHESIZE→APPLY
      6. Report Generation (existing, enhanced with learning insights)
      
      Components:
      - cortex/orchestrators/repository_onboarding_orchestrator.py (enhance)
      - cortex/orchestrators/mixins/knowledge_persistence_mixin.py (new)
      - cortex/orchestrators/mixins/learning_loop_mixin.py (new)
      
      MCP Tool Integration:
      - Use cortex_onboard_repository for deep analysis (not manual file reading)
      - Use cortex_lens_analyze for code intelligence
      - Use cortex_git_history for recent changes context
      - Use cortex_detect_duplicates for pattern detection
      
      Tests (20):
      - test_onboarding_creates_domain_yaml_artifacts
      - test_onboarding_updates_brain_intelligence_layers
      - test_onboarding_engages_universal_learning_loop
      - test_onboarding_uses_mcp_tools_not_direct_files
      - test_onboarding_handles_large_repositories
      - test_onboarding_detects_and_reuses_known_patterns
      - test_onboarding_generates_audit_trail
    effort: "2 days"
    tests: 20
    status: "planned"
    success_metrics:
      - "Every onboarding creates 5+ YAML files"
      - "Brain intelligence layers updated per operation"
      - "Learning loop engaged and verified via tests"
      - "100% MCP tool usage (zero direct file reading)"
    dependencies: ["S1", "S2", "S3"]

  # --------------------------------------------------------------------------
  # S5: Knowledge Persistence Enforcement Agent
  # --------------------------------------------------------------------------
  - id: "S5"
    name: "Knowledge Persistence Enforcement Agent"
    description: |
      Create KnowledgePersistenceAgent as the 8th enforcement agent to block ONBOARD 
      operations that don't generate knowledge artifacts and warn on other operations 
      that skip learning loop engagement.
      
      Components:
      - cortex/governance/enforcement/agents/knowledge_persistence_agent.py
      - Integration into EnforcementOrchestrator
      
      Validation Rules:
      - ONBOARD intent → BLOCK if no company/domains/ artifacts created
      - ONBOARD intent → BLOCK if brain layers not updated
      - ANALYZE intent → WARN if learning loop not engaged
      - IMPLEMENT intent → WARN if no pattern extraction
      
      Enforcement Levels:
      - CRITICAL (BLOCK) — ONBOARD without knowledge persistence
      - WARNING — Other operations without learning engagement
      - ADVISORY — Encourage pattern reuse when available
      
      Integration:
      - Add to EnforcementOrchestrator.agents list (8th agent)
      - Run in pre-execution validation phase
      - Generate compliance reports
      
      Tests (15):
      - test_blocks_onboard_without_yaml_artifacts
      - test_blocks_onboard_without_brain_updates
      - test_warns_analyze_without_learning_loop
      - test_warns_implement_without_pattern_extraction
      - test_allows_onboard_with_full_persistence
      - test_generates_compliance_report
      - test_integrates_with_enforcement_orchestrator
    effort: "1 day"
    tests: 15
    status: "planned"
    success_metrics:
      - "8th enforcement agent operational"
      - "100% ONBOARD operations validated"
      - "Compliance reporting active"
    dependencies: ["S4"]

  # --------------------------------------------------------------------------
  # S6: MCP Tool Enhancement & Documentation
  # --------------------------------------------------------------------------
  - id: "S6"
    name: "MCP Tool Enhancement & Documentation"
    description: |
      Enhance cortex_onboard_repository MCP tool to support knowledge persistence 
      and learning loop integration via new flags.
      
      Enhanced Tool Signature:
      ```python
      @mcp_tool
      async def cortex_onboard_repository(
          path: str,
          depth: Literal["quick", "standard", "full"] = "standard",
          generate_knowledge: bool = True,      # NEW (default True)
          update_brain: bool = True,            # NEW (default True)
          persist_yamls: bool = True,           # NEW (default True)
          engage_learning_loop: bool = True     # NEW (default True)
      ) -> OnboardingResult:
          """
          Onboard repository with full knowledge persistence and learning.
          
          Args:
              path: Repository path to onboard
              depth: Analysis depth (quick=5min, standard=15min, full=30min)
              generate_knowledge: Create company/domains/ YAML artifacts
              update_brain: Enhance cortex_brain/ intelligence layers
              persist_yamls: Save structured knowledge to disk
              engage_learning_loop: Run OBSERVE→ANALYZE→SYNTHESIZE→APPLY
          
          Returns:
              OnboardingResult with findings, knowledge_artifacts, learning_insights
          """
      ```
      
      Documentation:
      - Update .github/prompts/CORTEX.prompt.md with new flags
      - Update .github/prompts/cortex-architect.prompt.md
      - Create examples in cortex/docs/examples/
      - Add knowledge persistence section to README.md
      
      Tests (15):
      - test_tool_creates_knowledge_artifacts_by_default
      - test_tool_flag_disable_prevents_yaml_generation
      - test_tool_updates_brain_when_enabled
      - test_tool_engages_learning_loop_by_default
      - test_tool_returns_knowledge_artifacts_in_result
      - test_tool_handles_permission_errors_gracefully
    effort: "1 day"
    tests: 15
    status: "planned"
    success_metrics:
      - "4 new flags operational and tested"
      - "Documentation updated in 3 locations"
      - "Example usage patterns provided"
    dependencies: ["S5"]

