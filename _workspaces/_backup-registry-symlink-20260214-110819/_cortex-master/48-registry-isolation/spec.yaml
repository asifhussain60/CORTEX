# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

problem_statement: |
  Current registry is single-tenant (cortex-registry/):
  - Cannot isolate user-specific configurations
  - No support for multi-workspace scenarios
  - Cross-workspace pollution (phases/agents shared globally)
  - No tenant-based access control
  - Enterprise clients need data isolation guarantees
  - Onboarding multiple teams to same CORTEX instance risky

# ============================================================================
# OBJECTIVES
# ============================================================================

objectives:
  primary:
    - "Multi-tenant registry architecture with workspace isolation"
    - "Per-workspace registry paths (cortex-registry/{workspace_id}/)"
    - "Tenant-based access control and security boundaries"
    - "Backward compatibility with single-tenant mode"
    - "Zero cross-workspace pollution guarantees"
  
  secondary:
    - "Registry migration tool (single → multi-tenant)"
    - "Tenant-specific knowledge base support"
    - "Per-tenant audit logs and metrics"
    - "Performance: ≤100ms registry load per tenant"
    - "Caching: ≥70% cache hit rate"

# ============================================================================
# SCOPE
# ============================================================================

scope:
  in_scope:
    - "TenantContext class for workspace identification"
    - "MultiTenantRegistry class with isolation guarantees"
    - "Workspace-based registry loader (cortex-registry/{workspace_id}/)"
    - "Tenant context injection in MCP tools"
    - "Registry migration utility (single → multi-tenant)"
    - "Tenant-aware knowledge loader"
    - "Per-tenant tool registry scoping"
    - "Access control policies per tenant"
  
  out_of_scope:
    - "Cloud-based registry storage (future phase)"
    - "Registry replication across machines (future phase)"
    - "Cross-tenant collaboration features (future phase)"
    - "Tenant billing/metering (future phase)"

# ============================================================================
# STAGE BREAKDOWN
# ============================================================================

stages:
  stage_1:
    name: "Multi-Tenant Architecture"
    estimated_effort: "2 days (1-2 sessions)"
    status: "NOT STARTED"
    tests: 18
    
    deliverables:
      - "TenantContext class (workspace_id, tenant_id, isolation_mode)"
      - "WorkspaceContext dataclass with isolation detection"
      - "RegistryFactory for creating isolated instances"
      - "Workspace ID generation and validation"
      - "Tenant-based path resolution"
      - "Cache key generation (workspace_id:tenant_id)"
    
    files_to_create:
      - "cortex/registry/tenant_context.py"
      - "cortex/registry/workspace_context.py"
      - "cortex/registry/registry_factory.py"
      - "tests/unit/registry/test_tenant_context.py"
      - "tests/unit/registry/test_workspace_context.py"
      - "tests/unit/registry/test_registry_factory.py"
    
    acceptance_criteria:
      - "AC-PHASE48-REG-S1-001: TenantContext identifies unique isolation boundaries"
      - "AC-PHASE48-REG-S1-002: RegistryFactory creates isolated instances per workspace"
      - "AC-PHASE48-REG-S1-003: Default workspace_id='local' for individual devs"
      - "AC-PHASE48-REG-S1-004: Cache keys unique per workspace+tenant"
      - "AC-PHASE48-REG-S1-005: Isolation mode detection (local vs multi-tenant)"
  
  stage_2:
    name: "Registry Loader Refactor"
    estimated_effort: "2 days (1-2 sessions)"
    status: "NOT STARTED"
    tests: 15
    
    deliverables:
      - "Enhanced GitBackedRegistry with tenant support"
      - "Tenant-aware YAML loading (cortex-registry/{workspace_id}/)"
      - "Fallback to global registry for shared resources"
      - "Registry caching per tenant (70% hit rate target)"
      - "Path resolution: workspace → global fallback"
    
    files_to_modify:
      - "cortex/registry/git_backed_registry.py"
    
    files_to_create:
      - "cortex/registry/multi_tenant_registry.py"
      - "tests/unit/registry/test_multi_tenant_registry.py"
      - "tests/integration/registry/test_multi_tenant_integration.py"
    
    acceptance_criteria:
      - "AC-PHASE48-REG-S2-001: Load workspace-specific YAML from cortex-registry/{workspace_id}/"
      - "AC-PHASE48-REG-S2-002: Fallback to global registry if workspace registry empty"
      - "AC-PHASE48-REG-S2-003: Cache per tenant with ≥70% hit rate"
      - "AC-PHASE48-REG-S2-004: No cross-tenant data leakage (validated by tests)"
      - "AC-PHASE48-REG-S2-005: Backward compatibility with single-tenant mode"
  
  stage_3:
    name: "MCP Integration"
    estimated_effort: "1 day (1 session)"
    status: "NOT STARTED"
    tests: 10
    
    deliverables:
      - "Tenant context injection in MCP tools"
      - "Workspace-scoped MCP tool execution"
      - "Per-tenant tool registry (isolated tool instances)"
      - "MCP tools respect workspace boundaries"
    
    files_to_modify:
      - "cortex/mcp/server.py"
      - "cortex/mcp/tools/__init__.py"
    
    files_to_create:
      - "tests/unit/mcp/test_tenant_injection.py"
      - "tests/integration/mcp/test_multi_tenant_mcp.py"
    
    acceptance_criteria:
      - "AC-PHASE48-REG-S3-001: MCP tools receive workspace context automatically"
      - "AC-PHASE48-REG-S3-002: Tool execution isolated per workspace"
      - "AC-PHASE48-REG-S3-003: No cross-workspace tool state leakage"
  
  stage_4:
    name: "Migration & Validation"
    estimated_effort: "2 days (1-2 sessions)"
    status: "NOT STARTED"
    tests: 12
    
    deliverables:
      - "Migration tool: single-tenant → multi-tenant"
      - "Backward compatibility mode for existing users"
      - "Validation: 100% workspace isolation (no cross-contamination)"
      - "Per-tenant audit logs"
      - "Tenant-based metrics collection"
    
    files_to_create:
      - "cortex/registry/migration.py"
      - "tests/unit/registry/test_migration.py"
      - "tests/integration/registry/test_isolation_guarantees.py"
    
    acceptance_criteria:
      - "AC-PHASE48-REG-S4-001: Migration tool successfully converts single → multi-tenant"
      - "AC-PHASE48-REG-S4-002: 100% backward compatibility (no breaking changes)"
      - "AC-PHASE48-REG-S4-003: Zero cross-workspace pollution (validated by stress tests)"
      - "AC-PHASE48-REG-S4-004: Performance: Registry load ≤100ms per tenant"
      - "AC-PHASE48-REG-S4-005: Caching: ≥70% cache hit rate under load"

