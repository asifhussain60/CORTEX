overview:
  vision: |
    Complete CORTEX reverse-engineering capability with runtime validation — 
    confirming "what actually happens" vs. "what code says should happen." 
    Integrate OpenTelemetry traces, DI container runtime inspection, SQL 
    profiling, and test execution correlation to validate static analysis 
    against live system behavior.
    
    Addresses Lens 2 (Runtime Truth) from chat01.md: "Goal: confirm real call 
    paths, object lifetimes, and cross-layer flows that static analysis misses."

  problem_statement: |
    CORTEX static analysis (Phases 66-68) provides strong architectural 
    intelligence but cannot validate runtime behavior:
    
    1. Static DI graphs may include dead registrations (never instantiated)
    2. Call graphs miss dynamic dispatch and reflection-based invocations
    3. Cannot confirm "actual implementations used" vs. "intended architecture"
    4. Missing SQL query profiling (which endpoints trigger which queries)
    5. No test coverage correlation (which tests exercise which code paths)
    6. Cannot detect performance hot paths from live system data
    7. Dependency graphs may show obsolete or unused code paths
    
    Intelligence gap: CORTEX sees code structure but not runtime behavior.
    
    chat01.md insight: "Runtime truth (what actually happens): .NET: 
    OpenTelemetry traces (or APM) to capture request → controller → service 
    → db calls. Log correlation IDs; capture endpoint, service method, SQL 
    text hash, latency. DI container inspection: Export registrations 
    (interfaces → concrete types) at startup."

  expected_outcomes:
    - "OpenTelemetry trace correlation (request → controller → service → DB)"
    - ".NET DI container runtime inspection (startup registration export)"
    - "Python DI container inspection (FastAPI/Flask dependency providers)"
    - "SQL query profiling integration (SQL Server Extended Events, PostgreSQL)"
    - "Test execution correlation (pytest traces → code coverage → call graph)"
    - "Performance hot path detection (latency + frequency analysis)"
    - "Dead code identification (registered but never instantiated)"
    - "Runtime vs. static validation (confirm architectural assumptions)"
    - "Live system analysis mode (production trace ingestion)"
    - "Integration with Phases 66-68 knowledge graph (runtime-enriched)"
    - "MCP tool: cortex_runtime_validate"

roi_analysis:
  cost: "35-42 hours (5-6 weeks part-time)"
  impact: |
    Immediate:
    - Runtime validation: Confirm "actual vs intended" architecture
    - Dead code detection: Identify unused DI registrations
    - Performance analysis: Hot path identification from live data
    
    Medium-term:
    - Test coverage gaps: Which code paths lack test validation
    - Refactoring safety: Runtime-validated dependency changes
    - Production debugging: Live trace analysis
    
    Long-term:
    - Architectural drift detection: Runtime vs. design alignment
    - Capacity planning: Latency/throughput analysis
    - Incident investigation: Trace-driven root cause analysis
    
    Strategic: Completes chat01.md "3-lens triangulation" (static + runtime + data).
    
  risk_mitigation: |
    - OpenTelemetry is industry-standard (proven, well-documented)
    - Runtime inspection is non-invasive (read-only analysis)
    - Incremental delivery: Value every 1-1.5 weeks per stage
    - Optional feature: Core static analysis (Phases 66-68) works without runtime
    - Privacy-safe: No PII collection, only structural data

dependencies:
