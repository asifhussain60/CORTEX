# ============================================================================
# STAGE BREAKDOWN
# ============================================================================

stages:
  # --------------------------------------------------------------------------
  # STAGE 1: OpenTelemetry Trace Correlation (1.5-2 weeks)
  # --------------------------------------------------------------------------
  - id: "S1"
    name: "OpenTelemetry Trace Correlation"
    description: |
      Integrate OpenTelemetry distributed tracing to capture and correlate 
      runtime call paths across application layers.
    
    deliverables:
      - "OpenTelemetry trace ingestion pipeline"
      - "Span correlation engine (parent-child relationship analysis)"
      - "Call path reconstruction (request → controller → service → DB)"
      - "Latency analysis (per-span timing + critical path detection)"
      - "Frequency analysis (most-called endpoints/methods)"
      - "Error trace correlation (exception → span → code location)"
      - "Integration with Phase 66 knowledge graph (runtime edges)"
      
    acceptance_criteria:
      - "Ingest OpenTelemetry traces from .NET/Python applications"
      - "Reconstruct call paths: HTTP request → UserController → UserService → DB"
      - "Calculate span latencies: P50/P95/P99 per operation"
      - "Identify most-called endpoints (frequency ranking)"
      - "Correlate errors to code locations via stack traces"
      - "Add runtime edges to knowledge graph: 'actually_calls' vs. 'can_call'"
      - "25+ tests covering trace ingestion and correlation"
      - "85%+ test coverage"
      - "Integration test: Analyze CORTEX MCP server traces (real-world)"
      
    technical_approach: |
      1. Set up OpenTelemetry collector endpoint (OTLP protocol)
      2. Ingest traces from instrumented applications
      3. Parse span data: trace_id, span_id, parent_span_id, operation_name
      4. Reconstruct call trees via parent-child relationships
      5. Calculate latency: span end_time - start_time
      6. Aggregate frequency: count spans per operation
      7. Add runtime edges to knowledge graph
      8. Output: RuntimeCallGraph with validated call paths
      
    files_to_create:
      - "cortex_lens/runtime/otel_trace_ingestion.py"
      - "cortex_lens/runtime/span_correlator.py"
      - "cortex_lens/runtime/call_path_reconstructor.py"
      - "cortex_lens/runtime/latency_analyzer.py"
      - "cortex_lens/models/runtime_call_graph.py"
      - "tests/unit/cortex_lens/runtime/test_otel_ingestion.py"
      - "tests/unit/cortex_lens/runtime/test_span_correlation.py"
      - "tests/integration/cortex_lens/test_runtime_correlation_e2e.py"
      
    tests:
      - "test_ingest_otel_trace_from_dotnet"
      - "test_parse_span_parent_child_relationship"
      - "test_reconstruct_http_to_db_call_path"
      - "test_calculate_span_latency_p95"
      - "test_identify_most_called_endpoint"
      - "test_correlate_error_to_code_location"
      - "test_add_runtime_edge_to_knowledge_graph"
      - "test_integration_cortex_mcp_traces"
      
    estimated_effort: "12-16 hours"
    depends_on: []

  # --------------------------------------------------------------------------
  # STAGE 2: DI Container Runtime Inspection (1.5-2 weeks)
  # --------------------------------------------------------------------------
  - id: "S2"
    name: "DI Container Runtime Inspection"
    description: |
      Export and analyze DI container registrations at runtime to validate 
      "actual implementations used" vs. static analysis.
    
    deliverables:
      - ".NET Core DI container inspector (startup registration export)"
      - "Ninject/Autofac container inspectors"
      - "Python FastAPI/Flask dependency provider inspector"
      - "Registration vs. usage validator"
      - "Dead registration detector (declared but never resolved)"
      - "Lifetime scope validator (singleton correctness check)"
      - "Integration with Phase 67 static DI graph (runtime validation)"
      
    acceptance_criteria:
      - "Export .NET Core DI registrations: List<(Interface, Implementation, Lifetime)>"
      - "Export Ninject bindings: Bind<I>.To<C>() runtime resolution"
      - "Export Python FastAPI dependencies: Depends() resolution graph"
      - "Compare runtime registrations vs. static analysis: 95%+ match"
      - "Identify dead registrations: 'ILegacyService registered but never resolved'"
      - "Validate singleton lifetime: 'CacheService should be singleton but is transient'"
      - "20+ tests covering DI container inspection"
      - "85%+ test coverage"
      - "Integration test: KSESSIONS Ninject container validation"
      
    technical_approach: |
      1. Hook .NET Core Startup.ConfigureServices() to dump registrations
      2. Use reflection to inspect Ninject container at runtime
      3. Hook FastAPI app dependency injection to export providers
      4. Parse runtime registration data: service type, implementation, lifetime
      5. Compare with Phase 67 static DI graph
      6. Identify mismatches: registered but unused, unexpected implementations
      7. Output: RuntimeDIReport with validation results
      
    files_to_create:
      - "cortex_lens/runtime/dotnet_di_inspector.py"
      - "cortex_lens/runtime/python_di_inspector.py"
      - "cortex_lens/runtime/di_validator.py"
      - "cortex_lens/runtime/dead_registration_detector.py"
      - "cortex_lens/models/runtime_di_report.py"
      - "tests/unit/cortex_lens/runtime/test_dotnet_di_inspection.py"
      - "tests/unit/cortex_lens/runtime/test_di_validation.py"
      - "tests/integration/cortex_lens/test_di_runtime_e2e.py"
      
    tests:
      - "test_export_dotnet_core_registrations"
      - "test_inspect_ninject_container"
      - "test_export_fastapi_dependencies"
      - "test_validate_runtime_vs_static_di"
      - "test_detect_dead_registration"
      - "test_validate_singleton_lifetime"
      - "test_integration_ksessions_di_validation"
      
    estimated_effort: "12-16 hours"
    depends_on: []

  # --------------------------------------------------------------------------
  # STAGE 3: SQL Query Profiling + Test Correlation (1.5-2 weeks)
  # --------------------------------------------------------------------------
  - id: "S3"
    name: "SQL Query Profiling + Test Correlation"
    description: |
      Integrate SQL profiling to capture runtime queries and correlate test 
      execution with code coverage and call graphs.
    
    deliverables:
      - "SQL Server Extended Events integration"
      - "PostgreSQL pg_stat_statements analyzer"
      - "Query-to-endpoint correlation (which APIs trigger which queries)"
      - "Slow query detector (latency threshold alerts)"
      - "Pytest trace correlation (test → code coverage → call graph)"
      - "Test coverage gap identifier (uncovered code paths)"
      - "Integration with Phase 66 knowledge graph (test edges)"
      
    acceptance_criteria:
      - "Capture SQL queries from Extended Events (SQL Server)"
      - "Parse pg_stat_statements for query frequency/latency (PostgreSQL)"
      - "Correlate queries to endpoints: '/api/users GET → SELECT * FROM Users'"
      - "Detect slow queries: queries >100ms with execution plan hints"
      - "Trace pytest execution: test_user_creation → UserService.create() → DB"
      - "Identify coverage gaps: 'UserService.delete() never tested'"
      - "20+ tests covering SQL profiling and test correlation"
      - "85%+ test coverage"
      - "Integration test: KSESSIONS sp_SaveAhadeesNew profiling"
      
    technical_approach: |
      1. Configure SQL Server Extended Events for query capture
      2. Query pg_stat_statements for PostgreSQL metrics
      3. Correlate SQL queries with trace span_ids (OpenTelemetry)
      4. Parse pytest --cov output for coverage data
      5. Instrument pytest with CORTEX_DEBUG markers (existing)
      6. Map test execution → code coverage → call graph
      7. Output: RuntimeQueryReport + TestCoverageReport
      
    files_to_create:
      - "cortex_lens/runtime/sql_profiler.py"
      - "cortex_lens/runtime/query_correlator.py"
      - "cortex_lens/runtime/pytest_tracer.py"
      - "cortex_lens/runtime/coverage_analyzer.py"
      - "cortex_lens/models/runtime_query_report.py"
      - "tests/unit/cortex_lens/runtime/test_sql_profiling.py"
      - "tests/unit/cortex_lens/runtime/test_pytest_correlation.py"
      - "tests/integration/cortex_lens/test_runtime_validation_e2e.py"
      
    tests:
      - "test_capture_sql_query_from_extended_events"
      - "test_parse_pg_stat_statements"
      - "test_correlate_query_to_endpoint"
      - "test_detect_slow_query_100ms"
      - "test_trace_pytest_execution"
      - "test_identify_coverage_gap"
      - "test_integration_ksessions_sql_profiling"
      
    estimated_effort: "12-16 hours"
    depends_on: ["S1"]

  # --------------------------------------------------------------------------
  # STAGE 4: Runtime Validation Dashboard + MCP Tool (1 week)
  # --------------------------------------------------------------------------
  - id: "S4"
    name: "Runtime Validation Dashboard + MCP Tool"
    description: |
      Build runtime validation dashboard and expose runtime analysis via MCP 
      tool for integrated static+runtime intelligence.
    
    deliverables:
      - "Runtime validation dashboard (HTML/JSON reports)"
      - "Static vs. runtime diff analyzer"
      - "Dead code report (unused registrations + unreachable paths)"
      - "Performance hot path visualizer"
      - "MCP tool: cortex_runtime_validate"
      - "Live system analysis mode (production trace ingestion)"
      - "Integration with Phase 66 knowledge graph (runtime-enriched nodes)"
      
    acceptance_criteria:
      - "Generate runtime validation dashboard: static vs. runtime comparison"
      - "Display dead code report: 'ILegacyService: registered but never used'"
      - "Visualize hot paths: 'UserService.getAll() called 1000x, avg 45ms'"
      - "Show coverage gaps: 'UserService.delete() never tested or traced'"
      - "MCP tool returns runtime validation via cortex_runtime_validate"
      - "Support live production trace ingestion (OpenTelemetry collector)"
      - "20+ tests covering dashboard and MCP tool"
      - "85%+ test coverage"
      - "Integration test: CORTEX MCP server runtime validation"
      
    technical_approach: |
      1. Aggregate data from Stages 1-3 (traces, DI, SQL, tests)
      2. Compare static analysis (Phases 66-68) with runtime data
      3. Generate HTML dashboard with visualizations
      4. Identify discrepancies: dead code, unexpected implementations
      5. Build MCP tool wrapper for Copilot Chat
      6. Support live mode: continuous trace ingestion
      7. Output: RuntimeValidationDashboard + MCP tool
      
    files_to_create:
      - "cortex_lens/runtime/validation_dashboard.py"
      - "cortex_lens/runtime/diff_analyzer.py"
      - "cortex_lens/runtime/dead_code_reporter.py"
      - "cortex/mcp/tools/runtime_validate_tool.py"
      - "tests/unit/cortex_lens/runtime/test_validation_dashboard.py"
      - "tests/unit/cortex_lens/runtime/test_diff_analyzer.py"
      - "tests/integration/cortex/mcp/test_runtime_validate_tool.py"
      
    tests:
      - "test_generate_runtime_validation_dashboard"
      - "test_compare_static_vs_runtime_di"
      - "test_identify_dead_code"
      - "test_visualize_performance_hot_paths"
      - "test_mcp_tool_runtime_validation"
      - "test_live_production_trace_ingestion"
      - "test_integration_cortex_mcp_validation"
      
    estimated_effort: "7-10 hours"
    depends_on: ["S1", "S2", "S3"]

