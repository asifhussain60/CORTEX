overview:
  vision: |
    Transform CORTEX Angular/TypeScript analysis from basic module detection 
    to deep architectural intelligence through DI graph extraction, component 
    hierarchy analysis, and API-to-backend traceability. Enable CORTEX to 
    understand frontend-backend relationships as architects do: route → 
    component → service → HTTP client → API endpoint → backend service.
    
    Addresses Angular gap from chat01.md analysis: "Parse TypeScript AST (or 
    use tooling) to extract module boundaries, component/service dependencies, 
    DI graph (providers), routing map → feature areas."

  problem_statement: |
    Current Angular LENS provides basic module detection but lacks architectural 
    depth for modern Angular applications:
    
    1. No DI graph: Cannot export providers/injectables dependency chains
    2. Missing component hierarchy: Parent-child relationships unclear
    3. No route-to-component mapping: Feature area boundaries unknown
    4. Incomplete service usage: Which components inject which services?
    5. No HTTP client analysis: Cannot trace API endpoint calls
    6. Missing state management: NgRx/Akita/RxJS patterns undetected
    7. Token-inefficient: Requires full codebase scan for relationship queries
    
    Intelligence gap: CORTEX sees Angular syntax but not application architecture.
    
    chat01.md insight: "Angular: Parse TypeScript AST to extract module 
    boundaries, component/service dependencies, DI graph (providers), routing 
    map → feature areas (this is often closer to domain than folder names)."

  expected_outcomes:
    - "TypeScript AST parser with Angular decorator analysis"
    - "DI graph extractor (providers, injectables, constructor injection)"
    - "Component hierarchy builder (parent-child, host-embedded)"
    - "Route-to-component mapper with lazy-loaded module detection"
    - "Service usage analyzer (which components inject which services)"
    - "HTTP client call tracer (service → HttpClient → API endpoint)"
    - "State management pattern detector (NgRx, Akita, RxJS)"
    - "Feature area identifier (routing-based domain boundaries)"
    - "Angular-to-Backend lineage (route → API endpoint → .NET service)"
    - "Integration with Phase 66 knowledge graph (unified frontend+backend)"
    - "MCP tool: cortex_angular_analyze"

roi_analysis:
  cost: "28-35 hours (4-5 weeks part-time)"
  impact: |
    Immediate:
    - Angular codebase understanding: 40% → 85% capability
    - Frontend-backend traceability: route → API → database full path
    - DI graph validation: "Which components depend on UserService?"
    
    Medium-term:
    - Refactoring safety (validated component dependencies)
    - Dead code detection (unused components, services)
    - Feature area documentation (routing-based boundaries)
    
    Long-term:
    - Cross-stack knowledge graph (Angular + .NET + Python unified)
    - End-to-end flow visualization (UI → API → DB)
    - Migration planning (AngularJS → Angular with dependency tracking)
    
    Strategic: Closes 45% Angular capability gap identified in chat01.md.
    
  risk_mitigation: |
    - TypeScript AST parsing is well-established (ts-morph library)
    - Angular decorators follow consistent patterns (stable API)
    - Incremental delivery: Value every 1-1.5 weeks per stage
    - Language-neutral patterns: Applicable to React/Vue later
    - Fallback: Basic module detection remains functional

