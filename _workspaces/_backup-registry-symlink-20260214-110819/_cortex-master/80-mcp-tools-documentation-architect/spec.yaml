# ============================================================================
# VISION & GOALS
# ============================================================================

overview:
  vision: |
    Transform MCP Tools documentation from manual audit matrix (32% healthy, 17 broken)
    to automated, git-aware system with:
    
    1. **Dual-Mode Architecture** — MODE: Refresh (git-aware delta detection for incremental 
       updates) + MODE: Generate (GitHub Pages HTML with interactive tool explorer)
    
    2. **Auto-Documentation from Decorators** — Extract metadata from @mcp_tool decorator 
       (parameters, types, docstrings) to generate accurate API docs with zero drift risk
    
    3. **Interactive Tool Explorer** — Live parameter input forms with JSON Schema validation, 
       "Try it" sandbox, request/response preview for all 78 tools
    
    4. **Multi-Persona Views** — Developer (API reference), Architect (tool topology), 
       Security Auditor (AuthLevel + compliance), Manager (health dashboard)
    
    5. **Test Coverage Heat Map** — Visual matrix showing unit/integration/e2e coverage 
       per tool with 🟢🟡🔴 health indicators
    
    6. **Phantom Tool Cleanup** — Auto-detect and generate cleanup PR for 6 phantom tools 
       (exposed via schema but no handler exists)
    
    7. **GitHub Pages Deployment** — Searchable catalog with fuzzy search, category filters, 
       version history, and accessibility (WCAG AA)

  problem_statement: |
    Current State (mcp-tool-audit-matrix.yaml analysis):
    - 78 MCP tools registered, only 25 fully functional (32% health score)
    - 17 broken tools, 6 phantom tools (exposed but no handler)
    - Manual documentation effort (40+ hours for full catalog refresh)
    - No searchable catalog, no interactive explorer
    - No security auditor view (AuthLevel/compliance not visible)
    - No test coverage visualization (hard to identify gaps)
    - Documentation drift risk (manual updates lag code changes)
    
    Impact:
    - ❌ Developers waste time discovering broken tools
    - ❌ Security risks hidden (no AuthLevel visibility)
    - ❌ No prioritization data for fixing broken tools
    - ❌ Manual audit matrix updates (error-prone, time-consuming)
    - ❌ External users cannot browse/search tool catalog

  success_criteria:
    - "MODE: Refresh implemented — git-aware delta detection (update only changed tools)"
    - "MODE: Generate implemented — GitHub Pages HTML site with 78+ tool pages"
    - "@mcp_tool decorator metadata extraction automated (zero manual input)"
    - "Interactive tool explorer functional (parameter forms + 'Try it' sandbox)"
    - "Multi-persona views deployed (developer, architect, security, manager)"
    - "Test coverage heat map generated (unit/integration/e2e per tool)"
    - "Phantom tool cleanup PR auto-generated (6 tools removed)"
    - "mcp-tool-audit-matrix.yaml auto-sync (health scores, counts updated)"
    - "GitHub Pages deployment successful (searchable catalog live)"
    - "145 tests passing (35 refresh + 40 generate + 30 explorer + 20 personas + 20 coverage)"
    - "Health score improved: 32% → 77% (target: 60+ tools fully functional)"
    - "Documentation refresh time: 40+ hours → 2-3 hours (85% reduction)"

# ============================================================================
# DUAL-MODE ARCHITECTURE
# ============================================================================

architecture:
  mode_refresh:
    description: "Git-aware delta detection for incremental tool catalog updates"
    components:
      - name: "Tool Delta Analyzer"
        purpose: "Detect MCP tool changes since last documentation commit"
        inputs:
          - "git log since last docs commit"
          - "cortex/mcp/tools/**/*.py file diffs"
          - "@mcp_tool decorator changes"
        outputs:
          - "List of changed tool IDs"
          - "Category rebalancing recommendations"
        
      - name: "Tool Intelligence Sync"
        purpose: "Update mcp-tool-audit-matrix.yaml with current health status"
        inputs:
          - "cortex/mcp/decorators.py MCP_TOOLS_REGISTRY"
          - "tests/mcp/ coverage reports"
          - "cortex/mcp/server.py tool list"
        outputs:
          - "Updated health scores per tool"
          - "Broken tool detection"
          - "Phantom tool list"
        
      - name: "Coverage Integration"
        purpose: "Map tests to tools and generate heat map"
        inputs:
          - "tests/mcp/ test files"
          - "pytest coverage data"
          - "Integration test discovery"
        outputs:
          - "Coverage matrix (unit/integration/e2e)"
          - "Missing test detection"
          - "Heat map visualization data"
        
      - name: "Validator + Linter"
        purpose: "Validate tool metadata completeness"
        checks:
          - "Required parameters documented"
          - "Docstring completeness"
          - "Type hint validation"
          - "Naming convention (cortex_*)"
        
      - name: "YAML Manifest Sync"
        purpose: "Update mcp-tool-audit-matrix.yaml automatically"
        updates:
          - "summary.total, summary.broken, summary.health_score"
          - "broken_tools list with current status"
          - "working_with_params list"
          - "fully_functional list"
    
    time_estimate: "2-3 hours (incremental update)"
    
  mode_generate:
    description: "GitHub Pages HTML generation with interactive explorer"
    components:
      - name: "Decorator Extractor"
        purpose: "Extract metadata from @mcp_tool decorators"
        sources:
          - "cortex/mcp/decorators.py MCP_TOOLS_REGISTRY"
          - "Function signatures (inspect module)"
          - "Docstrings (Google-style parsing)"
          - "Parameter schemas (JSON Schema)"
        outputs:
          - "Tool metadata JSON"
          - "Parameter type mappings"
          - "Return type documentation"
        
      - name: "Interactive Explorer"
        purpose: "Browser-based tool testing UI"
        features:
          - "Live parameter input forms"
          - "JSON Schema validation (client-side)"
          - "'Try it' button → MCP server invocation"
          - "Request/response preview (syntax highlighting)"
          - "Error handling demonstration"
        
      - name: "Security Auditor View"
        purpose: "Security-focused dashboard"
        displays:
          - "AuthLevel distribution (PUBLIC/AUTHENTICATED/PRIVILEGED)"
          - "Rate limiting configuration"
          - "Compliance mode mapping"
          - "Injection attack surface analysis"
          - "Tool governance policy matrix"
        
      - name: "Multi-Persona Views"
        personas:
          - name: "Developer"
            view: "API reference with code examples"
            sections:
              - "Parameters (types, required, defaults)"
              - "Return values (schemas, examples)"
              - "Error codes (handling patterns)"
              - "Usage examples (Python + REST)"
          
          - name: "Architect"
            view: "Tool topology and orchestrator integration"
            sections:
              - "Tool category taxonomy"
              - "Orchestrator dependency graph"
              - "Data flow diagrams"
              - "Integration patterns"
          
          - name: "Security Auditor"
            view: "AuthLevel + compliance matrix"
            sections:
              - "Privileged tools list"
              - "Command injection risks"
              - "Rate limit enforcement"
              - "Audit trail requirements"
          
          - name: "Manager"
            view: "Health dashboard with metrics"
            sections:
              - "Tool health summary (broken/working)"
              - "Test coverage percentages"
              - "Usage analytics (if available)"
              - "Maintenance recommendations"
        
      - name: "Searchable Catalog"
        purpose: "Fuzzy search with filters"
        features:
          - "Full-text search across tool descriptions"
          - "Category filters (execution, intelligence, management)"
          - "Tag cloud (common patterns)"
          - "Version history (decorator changes over time)"
    
    time_estimate: "8 minutes (automated generation)"

