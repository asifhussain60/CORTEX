project:
  name: CORTEX YAML Reader
  version: 1.0.0
  status: completed
  
features:
  - name: File Loading
    status: working
    methods:
      - File System Access API
      - Drag & Drop
      - Traditional file input
  
  - name: Multiple Views
    status: working
    views:
      - Tree View
      - Cards View
      - Graph View
      - Raw View
  
  - name: Offline Support
    status: working
    details:
      protocol: file://
      dependencies: vendored locally
      network_requests: zero

architecture:
