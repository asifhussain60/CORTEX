# CORTEX Vacuum Manifest System
# Version: 1.0 | Authority: VacuumOrchestrator | Updated: 2026-01-24
# Purpose: Master registry defining what's "keeper", "ephemeral", or "archive"

---

## 🔐 TIER 1: IMMUTABLE SYSTEM FILES (NEVER DELETE)

keeper_patterns:
  system_prompts:
    paths:
      - ".github/prompts/*.prompt.md"
      - ".github/prompts/*-agents.md"
    description: "System prompts and agent definitions"
    reason: "Core infrastructure for CORTEX operation"
    safety_level: "CRITICAL"

  configuration:
    paths:
      - "cortex*.yaml"
      - "pyrightconfig.json"
      - "mkdocs.yml"
      - "requirements.txt"
    description: "Application configuration and environment"
    reason: "Required for system initialization"
    safety_level: "CRITICAL"

  governance:
    paths:
      - "cortex_brain/tier0/**/*.yaml"
      - "cortex_brain/tier1/**/*.yaml"
      - "cortex_brain/tier2/**/*.yaml"
      - "cortex_brain/tier3/**/*.yaml"
    description: "Governance rules and decision frameworks"
    reason: "Immutable system rules (CORE-001 through CORE-029)"
    safety_level: "CRITICAL"

  documentation_entry:
    paths:
      - "docs/0-README.md"
      - "docs/INDEX.md"
    description: "Documentation entry points"
    reason: "User-facing navigation"
    safety_level: "CRITICAL"

  git_system:
    paths:
      - ".gitignore"
      - ".github/**/*"
      - ".git/**/*"
    description: "Git configuration and CI/CD"
    reason: "Version control system"
    safety_level: "CRITICAL"

---

## 🟢 TIER 2: CURATED DOCUMENTATION (ORGANIZED)

curated_docs:
  getting_started:
    paths:
      - "docs/01-getting-started/**/*.md"
    description: "User onboarding and quickstart guides"
    policy: "EVOLVE - Keep recent versions, archive obsolete"
    max_age_days: 365
    keep_count: 1

  architecture:
    paths:
      - "docs/02-architecture/**/*.md"
    description: "System architecture and design"
    policy: "EVOLVE - Keep versions matching current release"
    max_age_days: 180
    keep_count: 2

  api_reference:
    paths:
      - "docs/03-api-reference/**/*.md"
    description: "API documentation"
    policy: "EVOLVE - Keep versions for last 3 releases"
    max_age_days: 365
    keep_count: 3

  guides:
    paths:
      - "docs/04-guides/**/*.md"
    description: "How-to guides and tutorials"
    policy: "EVOLVE - Keep only current guides"
    max_age_days: 180
    keep_count: 1

  operations:
    paths:
      - "docs/05-operations/**/*.md"
    description: "Operational and deployment guides"
    policy: "EVOLVE - Keep current + 1 previous"
    max_age_days: 90
    keep_count: 2

  best_practices:
    paths:
      - "docs/BEST-PRACTICES*.md"
      - "docs/best-practices/**/*.md"
    description: "System best practices"
    policy: "KEEP - Evolves over time"
    max_age_days: null
    keep_count: null

---

## 🟡 TIER 3: EPHEMERAL/ARCHIVED (AUTO-MANAGED)

ephemeral_patterns:
  session_reports:
    paths:
      - "_workspaces/SESSION-*.md"
      - "_workspaces/*-SESSION-*.md"
    pattern_match:
      - "SESSION-SUMMARY-"
      - "SESSION-FINAL-REPORT-"
      - "PHASE-\\d+-COMPLETE"
    description: "Copilot session summary reports"
    policy: "ARCHIVE_AFTER_30_DAYS"
    max_age_days: 30
    archive_to: "_workspaces/_archive/sessions/"
    reason: "Historical record only, not operational"

  completion_reports:
    paths:
      - "_workspaces/*-COMPLETION-*.md"
      - "docs/*-COMPLETION-*.md"
    pattern_match:
      - "COMPLETION-REPORT"
      - "COMPLETION-SUMMARY"
      - "COMPLETION-CHECKLIST"
      - "-COMPLETE.md"
    description: "Task completion notices"
    policy: "ARCHIVE_AFTER_14_DAYS"
    max_age_days: 14
    archive_to: "_workspaces/_archive/completed-tasks/"
    reason: "Reference material, not operational"

  working_documents:
    paths:
      - "_workspaces/*-ACTION-*.md"
      - "_workspaces/*-DRY-RUN-*.md"
      - "_workspaces/*-PLAN.md"
      - "_workspaces/CLEANUP-*.md"
    pattern_match:
      - "ACTION-PLAN"
      - "DRY-RUN"
      - "VALIDATION-REPORT"
      - "CORRECTION-SUMMARY"
    description: "Temporary working documents from cleanup sessions"
    policy: "ARCHIVE_AFTER_7_DAYS"
    max_age_days: 7
    archive_to: "_workspaces/_archive/working-docs/"
    reason: "Operational documents from past sessions"

  index_registries:
    paths:
      - "_workspaces/*-INDEX.md"
      - "_workspaces/*-REGISTRY.md"
      - "_workspaces/*-INVENTORY.md"
    pattern_match:
      - "INDEX"
      - "REGISTRY"
      - "INVENTORY"
      - "OBSOLETE-FILES"
    description: "Indices and registries from analysis runs"
    policy: "ARCHIVE_AFTER_3_DAYS"
    max_age_days: 3
    archive_to: "_workspaces/_archive/analysis-runs/"
    reason: "Outdated as codebase evolves"

  comparison_docs:
    paths:
      - "_workspaces/BEFORE-AFTER-*.md"
      - "_workspaces/*-COMPARISON.md"
    pattern_match:
      - "BEFORE-AFTER"
      - "COMPARISON"
      - "CONTRAST"
    description: "Comparison and before/after analysis"
    policy: "ARCHIVE_AFTER_7_DAYS"
    max_age_days: 7
    archive_to: "_workspaces/_archive/analysis/"
    reason: "Point-in-time analysis, not ongoing"

  executive_summaries:
    paths:
      - "_workspaces/EXECUTIVE*.md"
      - "_workspaces/*SUMMARY*.md"
    pattern_match:
      - "EXECUTIVE"
      - "SUMMARY"
      - "DELIVERABLE"
      - "PACKAGE"
    description: "Executive summaries and high-level overviews"
    policy: "ARCHIVE_AFTER_14_DAYS"
    max_age_days: 14
    archive_to: "_workspaces/_archive/summaries/"
    reason: "Historical summaries for reference"

  generated_reports:
    paths:
      - "_workspaces/reports/**/*.md"
      - "docs/*-REPORT.md"
    pattern_match:
      - "-REPORT"
      - "REPORT-"
    description: "Generated analysis and status reports"
    policy: "ARCHIVE_AFTER_30_DAYS"
    max_age_days: 30
    archive_to: "_workspaces/_archive/reports/"
    reason: "Historical data, not operational"

---

## 🔵 TIER 4: SPECIAL HANDLING

special_cases:
  roadmap_docs:
    paths:
      - "_workspaces/roadmap/**/*.yaml"
      - "_workspaces/roadmap/**/*.md"
    description: "Project roadmap and planning"
    policy: "MIGRATE_TO_DOCS"
    destination: "docs/06-roadmap/"
    reason: "Operational planning should be in docs"

  ppt_presentations:
    paths:
      - "_workspaces/ppt/**/*"
    description: "PowerPoint presentations"
    policy: "ARCHIVE"
    archive_to: "_workspaces/_archive/presentations/"
    reason: "Historical presentations"

  sts_sample_apps:
    paths:
      - "_workspaces/sts/**/*"
    description: "Sample test applications"
    policy: "KEEP"
    reason: "Test and reference material"

  cortex_vision:
    paths:
      - "_workspaces/cortex-vision/**/*"
    description: "Vision and planning documents"
    policy: "KEEP"
    reason: "Strategic planning material"

---

## 🛡️ SAFETY THRESHOLDS

safety_rules:
  minimum_docs_per_category: 1
  cascade_protection: |
    If deletion would reduce category below minimum, abort operation
    and escalate to user for manual review
  
  backup_before_delete: true
  backup_location: "_workspaces/_archive/.backup/"
  
  git_commit_threshold: |
    - ARCHIVE operations: Automatic commit
    - DELETE operations: Require explicit user confirmation
    - MIGRATE operations: Automatic commit
  
  log_all_operations: true
  log_location: "_workspaces/.vacuum-operations.log"

---

## 📋 FILE CLASSIFICATION RULES

classification_engine:
  
  rule_priority:
    - level: CRITICAL
      patterns: [".github/", "cortex_brain/", "pyrightconfig.json"]
      action: "ALWAYS_KEEP"
    
    - level: SYSTEM
      patterns: ["*.prompt.md", "*-agents.md", "requirements.txt"]
      action: "ALWAYS_KEEP"
    
    - level: DOCUMENTATION
      patterns: ["docs/0*-", "docs/01-", "docs/02-", "docs/03-", "docs/04-"]
      action: "EVOLVE"
    
    - level: EPHEMERAL
      patterns: ["SESSION-", "COMPLETION-", "DRY-RUN-", "ACTION-PLAN"]
      action: "ARCHIVE_AFTER_N_DAYS"
    
    - level: ARCHIVE
      patterns: ["_workspaces/_archive/", "old/", "deprecated/"]
      action: "PRESERVE"

  date_patterns:
    - regex: "\\d{4}-\\d{2}-\\d{2}"
      format: "YYYY-MM-DD"
    - regex: "2026-01-24"
      comparison: "Use as reference point"

  keyword_indicators:
    keeper_keywords:
      - "prompt"
      - "agent"
      - "orchestrator"
      - "governance"
      - "best-practice"
    
    ephemeral_keywords:
      - "session"
      - "summary"
      - "report"
      - "completion"
      - "dry-run"
      - "action-plan"
      - "temporary"

---

## 🎯 EXECUTION POLICIES

policies:
  
  ALWAYS_KEEP:
    condition: "File matches TIER 1 patterns"
    action: "No action"
    confirmation: "None required"
  
  EVOLVE:
    condition: "File in docs/ and matches curated patterns"
    action: "Keep current + maintain version history"
    retention: "Based on category max_age_days"
    confirmation: "Automatic for age-based, user-approval for pattern changes"
  
  ARCHIVE_AFTER_N_DAYS:
    condition: "File is ephemeral and older than threshold"
    action: "Move to _workspaces/_archive/{category}/"
    retention: "Keep in archive indefinitely"
    confirmation: "Automatic with audit log"
  
  MIGRATE_TO_DOCS:
    condition: "File in _workspaces and marked for migration"
    action: "Copy to docs/{section}/ and archive original"
    retention: "Keep in both locations for 14 days, then archive"
    confirmation: "User approval before migration"
  
  DELETE:
    condition: "File marked for deletion (use sparingly)"
    action: "Delete permanently (after backup)"
    retention: "Backup kept in _workspaces/_archive/.backup/"
    confirmation: "EXPLICIT user confirmation required"

---

## 🔍 DETECTION ALGORITHMS

algorithms:
  
  age_detection:
    method: "Compare file modification date with today"
    formula: "today - file_modified_date = age_in_days"
    threshold_checks:
      - "age > max_age_days: ARCHIVE"
      - "age > (max_age_days * 2): REVIEW_FOR_DELETION"

  pattern_detection:
    method: "Regex match on filename and path"
    examples:
      - "SESSION-SUMMARY-2026-01-24.md → ARCHIVE"
      - "*-COMPLETION-REPORT.md → ARCHIVE"
      - "DRY-RUN-*.md → ARCHIVE"

  orphan_detection:
    method: "Check for broken internal links"
    action: "Flag for manual review"

  duplicate_detection:
    method: "Hash-based content comparison"
    action: "Keep newest, suggest removal of duplicates"

---

## 📊 METRICS & REPORTING

metrics:
  report_location: "_workspaces/reports/vacuum-operations.log"
  
  tracked_metrics:
    - files_analyzed: "Total files examined"
    - files_kept: "Files retained"
    - files_archived: "Files moved to archive"
    - files_deleted: "Files permanently removed"
    - space_freed: "Storage reclaimed in MB"
    - operations_duration: "Time to complete in seconds"
  
  report_template: |
    ## Vacuum Operation Report
    **Date:** {date}
    **Duration:** {duration}
    
    ### Summary
    - Files Analyzed: {count}
    - Files Kept: {count}
    - Files Archived: {count}
    - Files Deleted: {count}
    - Space Freed: {size} MB
    
    ### Breakdown by Category
    {category_table}
    
    ### Operations Log
    {operations_list}

---

## 🔧 CONFIGURATION OPTIONS

config:
  dry_run: true              # Always do dry-run first
  auto_confirm: false        # Never auto-confirm destructive ops
  verbose_logging: true      # Log everything
  create_backups: true       # Always backup before delete
  git_integration: true      # Auto-commit to git
  notification_email: null   # Set to email for alerts
  slack_webhook: null        # Set for Slack notifications

---

## 📝 USAGE EXAMPLES

examples:

  example_1:
    description: "Archive all SESSION-* files older than 30 days"
    command: "cortex-vacuum --policy ARCHIVE_AFTER_30_DAYS --pattern SESSION-* --dry-run"
    expected_result: "Shows what would be archived, requests confirmation"

  example_2:
    description: "Migrate roadmap docs to docs/ folder"
    command: "cortex-vacuum --policy MIGRATE_TO_DOCS --source _workspaces/roadmap --dry-run"
    expected_result: "Shows migration plan, requests approval"

  example_3:
    description: "Clean up _workspaces after 7-day retention"
    command: "cortex-vacuum --policy ARCHIVE_AFTER_7_DAYS --dry-run"
    expected_result: "Comprehensive report of all archival actions"

  example_4:
    description: "Full system vacuum with all policies"
    command: "cortex-vacuum --full-scan --dry-run"
    expected_result: "Complete analysis across all tiers and categories"

---

## 🚨 EMERGENCY PROCEDURES

emergency:
  
  rollback:
    description: "Restore from backup if something goes wrong"
    command: "cortex-vacuum --rollback {backup_date}"
    backup_retention: "30 days"
  
  restore_archived:
    description: "Restore file from archive"
    command: "cortex-vacuum --restore {file_path} --from-archive"
  
  bypass_safety:
    description: "Override safety thresholds (DANGEROUS)"
    requirement: "Manual git commit of safety bypass decision"
    confirmation: "Typed confirmation required"

