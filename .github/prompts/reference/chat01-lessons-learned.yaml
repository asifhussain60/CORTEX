patterns:

  # Pattern 1: Ghost Directory Detection
  ghost_directory_pattern:
    issue: |
      cortex/cortex.intelligence/ existed as a filesystem artifact — a directory
      with a dot in the name, not a Python package. It was empty but referenced in
      20+ source files as a path for db/state files. Prompts and docs didn't flag
      this as a deleted path.
    lesson: |
      Add ghost directory detection as an explicit audit check (#18). Scan for 
      any directory under cortex/ with dots in the name that isn't a valid package.
      Update all deleted-paths lists in prompts when ghost dirs are discovered.
    improvement:
      audit_check: "Check #18 — Ghost directory detection"
      command: 'find cortex/ -maxdepth 1 -name "*.*" -type d'
      auto_fix: "Delete directory + repoint path references"

  # Pattern 2: Audit Point Count Drift
  audit_count_drift:
    issue: |
      copilot-instructions.md said "19-Point Production Scan" while 
      cortex-architect.prompt.md said "17-Point". Meta-auditor check count
      also drifted (23 vs 22). MCP tool count drifted (37 in 
      MCP-ORCHESTRATOR-MAPPING.md vs 24 everywhere else).
    lesson: |
      SSOT for counts must be enforced via meta-audit. When adding new audit
      checks, ALL prompt files must be updated in the same commit. Add
      specific meta-audit checks for count alignment.
    improvement:
      meta_audit_checks_added:
        - "Audit check count — all prompts say '19-Point'"
        - "Meta-audit check count — all prompts say '23 checks'"
        - "MCP tool count — all prompts say '24 production tools'"

  # Pattern 3: Runtime Data Path Convention
  runtime_data_paths:
    issue: |
      20+ source files referenced cortex.intelligence/state/ or 
      cortex.intelligence/onboarded_repos/ for db and state files.
      The canonical location is .cortex-runtime/ but this was never 
      explicit in prompts or audit checks.
    lesson: |
      Make .cortex-runtime/ the explicit canonical location for ALL
      runtime data in prompt deleted-paths sections. Add explicit
      rule: "all .db, .log, state files → .cortex-runtime/"
    improvement:
      prompt_update: "Added to deleted paths: 'never cortex.intelligence/state/'"
      audit_check: "Check #8 already covers scattered .db files"

  # Pattern 4: Test Fixture Path Coupling
  test_fixture_coupling:
    issue: |
      Test fixtures in 8+ files created tmp_path directories matching 
      the old ghost directory path (cortex.intelligence/). When source
      code paths were updated, tests broke because fixtures didn't match.
    lesson: |
      When changing canonical paths in source, always sweep test fixtures
      in the same commit. Use SweepCatalogueOrchestrator to track the
      full catalogue of path references.
    improvement:
      sweep_contract: "CORE-064 applied — all test fixture paths updated"

  # Pattern 5: Convergence Loop in Audit Pipeline
  convergence_loop:
    issue: |
      The original architect prompt had Stage 7 as "Auto-Fix confidence >90%"
      and Stage 8 as "Re-validate → zero-violation gate" — implying a single
      pass. copilot-instructions.md correctly described a convergence loop
      (detect-fix-rescan until 0 P0/P1).
    lesson: |
      The /audit fix pipeline must use a convergence loop, not a single pass.
      Prompts must describe "Stages 7–8" as a loop, referencing CORE-064.
    improvement:
      prompt_update: "Updated both prompts to say 'Auto-Fix Convergence Loop'"

