# ============================================================================
# SECTION 5: IMPLEMENTATION CHECKLISTS (FOR PHASE EXECUTORS)
# ============================================================================

executor_checklists:
  
  # Use before executing each phase
  pre_phase_execution:
    steps:
      - "✓ Load phase YAML and display Definition of Ready"
      - "✓ Run pre_flight checklist items (fail if BLOCK items fail)"
      - "✓ Display tolerance bands and estimated iterations"
      - "✓ Ask user: 'Proceed?' before RED stage"
    
    user_prompt: |
      Phase 05 Ready for Execution
      ────────────────────────────
      Duration: 3 hours (est)
      Iterations: 2 (likely)
      Pre-Flight: ✅ All checks passed
      
      Type `proceed` to begin RED stage or review specs above.
  
  # After RED stage (before GREEN)
  post_red_checklist:
    steps:
      - "✓ Verify all RED tests fail (expected)"
      - "✓ Display test count vs target (with tolerance band)"
      - "✓ Check efficiency_metrics for config_load failures"
      - "✓ If threshold miss detected: adjust tolerance band"
      - "✓ Ask user: 'Begin GREEN stage?'"
  
  # After GREEN stage (before REFACTOR)
  post_green_checklist:
    steps:
      - "✓ Verify all GREEN tests pass"
      - "✓ Run regression suite (no new failures)"
      - "✓ Tally implementation metrics"
      - "✓ Recommend improvements for next phase"
      - "✓ Ask user: 'Proceed to REFACTOR stage?'"

