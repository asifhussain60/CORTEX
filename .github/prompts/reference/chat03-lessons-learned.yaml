      - cortex-registry/planning/phases/templates/tolerance-bands.yaml
      - cortex-registry/planning/phases/templates/pre-flight-checklist.yaml
      
      This avoids duplicating 500+ lines per phase in prompt.
  
  efficiency_gains:
    phase_0_to_4: "~92 KB of prompt needed (completed)"
    phase_5_to_10_estimated: "~45 KB if using templates (50% reduction)"
    
    strategy: |
      1. Load template YAML once per session
      2. Reference by phase_id (e.g., phase_05)
      3. Only show deltas from template

