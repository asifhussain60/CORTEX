# CORTEX Vacuum Operations Configuration
# Version: 1.0 | Updated: 2026-01-24 | Authority: cortex-vacuum.prompt.md

---

vacuum_metadata:
  version: "1.0"
  created: "2026-01-24"
  last_updated: "2026-01-24"
  authority: "cortex-vacuum.prompt.md"
  status: "PRODUCTION_READY"

---

# ============================================================================
# SECTION 1: SYSTEM FILES (🔒 PRESERVE - NEVER DELETE)
# ============================================================================

system_files:
  description: "Core system infrastructure - PRESERVE with 100% confidence"
  patterns:
    - ".github/prompts/**/*.prompt.md"          # All prompt definitions
    - ".github/agents/**/*.md"                  # All agent definitions
    - ".github/copilot-instructions.md"         # System instructions
    - ".github/workflows/**"                    # CI/CD workflows
    - ".github/hooks/**"                        # Git hooks
    - "cortex_brain/tier0/governance/**"        # Governance rules
    - "cortex_brain/tier1/**"                   # Tier 1 AC specs
    - "cortex_brain/tier2/**"                   # Tier 2 templates
    - "cortex_brain/tier3/knowledge/**"         # Tier 3 knowledge
    - "cortex/**/*.py"                          # Production Python
    - "cortex_brain/**/*.py"                    # Brain system code
    - "requirements.txt"                        # Dependencies
    - "setup.py"                                # Setup configuration
    - "pyrightconfig.json"                      # Type checker config
    - "mkdocs.yml"                              # Documentation config
    - ".gitignore"                              # Git configuration
    - "cortex-config.yaml"                      # System config
    - "cortex-impl-map.yaml"                    # Implementation map
    - "README.md"                               # Root README only
    - "tests/**"                                # Test code

  safeguards:
    - name: "No system file deletion"
      check: "Validate files_to_delete against this pattern list"
      action: "BLOCK if any match"
      severity: "CRITICAL"
    
    - name: "Verify .prompt.md count"
      check: "Count preserved *.prompt.md files"
      expected: ">= 7"  # Current count
      action: "FAIL if < 7"
      severity: "CRITICAL"
    
    - name: "Verify agents/*.md count"
      check: "Count preserved agents/*.md files"
      expected: ">= 7"  # Current count
      action: "FAIL if < 7"
      severity: "CRITICAL"

---

# ============================================================================
# SECTION 2: DOCUMENTATION FILES (✨ VALIDATE & ORGANIZE)
# ============================================================================

documentation_files:
  description: "Official documentation - validate links, organize structure"
  canonical_locations:
    - "docs/0-README.md"
    - "docs/01-getting-started/**"
    - "docs/02-architecture/**"
    - "docs/03-api-reference/**"
    - "docs/04-guides/**"
    - "docs/05-deployment/**"
    - "docs/06-release-notes/**"
    - "docs/07-troubleshooting/**"
    - "docs/08-reference/**"
    - "docs/09-tutorials/**"
    - "docs/_archive/**"

  non_canonical_locations:
    - "docs/*REPORT*.md"                        # Move to reference/
    - "docs/*SUMMARY*.md"                       # Move to guides/ or archive/
    - "docs/GOVERNANCE*.md"                     # Move to reference/governance/
    - "docs/USER_GUIDE*.md"                     # Move to guides/
    - "docs/AC-*.md"                            # Move to reference/
    - "docs/*compliance*.md"                    # Move to reference/

  cleanup_rules:
    - name: "Remove non-canonical docs"
      pattern: "docs/*REPORT*.md|docs/*SUMMARY*.md"
      action: "ANALYZE for relocation value"
    
    - name: "Consolidate API reference"
      pattern: "docs/03-api-reference/"
      rules:
        - High-value files: KEEP and organize
        - Duplicate files: CONSOLIDATE to index
        - Outdated files: ARCHIVE to docs/_archive/
    
    - name: "Clean up reference section"
      pattern: "docs/08-reference/"
      rules:
        - Governance docs: KEEP, organize by category
        - Implementation status: DELETE (regenerated)
        - Remediation status: DELETE (regenerated)
        - Compliance reports: ARCHIVE if age > 30 days
    
    - name: "Archive outdated guides"
      pattern: "docs/04-guides/"
      condition: "File modification date > 90 days old AND no recent references"
      action: "ARCHIVE to docs/_archive/outdated-guides/"

  validations:
    - name: "Link integrity"
      tool: "mkdocs build + link checker"
      severity: "ERROR"
    
    - name: "Markdown syntax"
      tool: "markdown linter"
      severity: "WARNING"
    
    - name: "Cross-references"
      tool: "grep for doc internal links"
      severity: "WARNING"

---

# ============================================================================
# SECTION 3: INFORMATIONAL FILES (📋 ARCHIVE or DELETE)
# ============================================================================

informational_files:
  description: "Session notes, project summaries, progress reports"
  location: "_workspaces/"
  retention_policy: "ARCHIVE by default, DELETE after 90 days in archive"
  
  categories:
    
    session_files:
      pattern:
        - "_workspaces/SESSION-*.md"
        - "_workspaces/SESSION_*.md"
      examples:
        - "SESSION-SUMMARY-2026-01-24-PHASE-2-COMPLETE.md"
        - "SESSION-FINAL-REPORT-2026-01-24.md"
      action: "ARCHIVE to _workspaces/_archive/session-logs/"
      retention: "12 months (historical record)"
    
    project_files:
      pattern:
        - "_workspaces/PROJECT_COMPLETION_REPORT_*.md"
        - "_workspaces/FINAL-DELIVERY-SUMMARY.md"
        - "_workspaces/ENHANCEMENT-COMPLETE.md"
      examples:
        - "PROJECT_COMPLETION_REPORT_2026-01-24.md"
        - "FINAL-DELIVERY-SUMMARY.md"
      action: "ARCHIVE to _workspaces/_archive/project-reports/"
      retention: "Until next major phase completion"
    
    remediation_files:
      pattern:
        - "_workspaces/REMEDIATION-*.md"
        - "_workspaces/CLEANUP-*.md"
      examples:
        - "REMEDIATION-COMPLETION-SUMMARY.md"
        - "CLEANUP-ACTION-PLAN.md"
      action: "EVALUATE for docs migration OR ARCHIVE"
      retention: "Until remediation complete (then archive 30 days)"
    
    analysis_files:
      pattern:
        - "_workspaces/*COMPARISON*.md"
        - "_workspaces/*OBSOLETE*.md"
        - "_workspaces/*INVENTORY*.md"
        - "_workspaces/*INDEX*.md"
      examples:
        - "BEFORE-AFTER-COMPARISON.md"
        - "CORTEX-OBSOLETE-FILES-COMPLETION-REPORT.md"
        - "OBSOLETE-FILES-INVENTORY.md"
      action: "ARCHIVE to _workspaces/_archive/analysis/"
      retention: "6 months (reference value)"
    
    improvement_files:
      pattern:
        - "_workspaces/*IMPROVEMENT*.md"
        - "_workspaces/*ENHANCEMENT*.md"
        - "_workspaces/UX-*.md"
        - "_workspaces/TEST-FIXES-SUMMARY.md"
      examples:
        - "UX-IMPROVEMENTS-SUMMARY.md"
        - "TEST-FIXES-SUMMARY.md"
      action: "EVALUATE for docs migration OR ARCHIVE"
      retention: "6 months then archive"

  migration_strategy:
    high_value:
      - "EXECUTIVE_SUMMARY_*.md with unique architecture insights"
      - "REMEDIATION-* files with reusable processes"
      - "UX-IMPROVEMENTS-SUMMARY.md with user impact"
      destination: "docs/04-guides/ or docs/08-reference/"
      retention: "Permanent in docs/"
    
    medium_value:
      - "SESSION-SUMMARY-*.md with key decisions"
      - "PROJECT_COMPLETION_REPORT_*.md with lessons learned"
      destination: "_workspaces/_archive/session-logs/ or project-reports/"
      retention: "12 months"
    
    low_value:
      - "Temporary analysis files"
      - "Duplicate reports"
      - "Regenerable summaries"
      action: "DELETE"
      retention: "0 (delete immediately)"

  archive_structure:
    _workspaces/_archive/:
      session-logs/:
        description: "Session summaries and final reports"
        retention: "12 months"
        files: "SESSION-*.md, SESSION_*.md"
      
      project-reports/:
        description: "Project completion and delivery summaries"
        retention: "Until phase complete + 30 days"
        files: "PROJECT_COMPLETION_*.md, FINAL-DELIVERY-*.md"
      
      remediation/:
        description: "Remediation and cleanup progress"
        retention: "Until complete + 30 days"
        files: "REMEDIATION-*.md, CLEANUP-*.md"
      
      analysis/:
        description: "Analysis, comparisons, inventories"
        retention: "6 months"
        files: "*COMPARISON*.md, *OBSOLETE*.md, *INVENTORY*.md"
      
      outdated-guides/:
        description: "Documentation guides replaced by newer versions"
        retention: "6 months"
        files: "docs/04-guides/ → archived"
      
      INDEX.md:
        description: "Archive manifest with dates, reasons, search index"
        generated: true
        updated: "On each vacuum operation"

---

# ============================================================================
# SECTION 4: GENERATED FILES (🔧 REGENERATE as NEEDED)
# ============================================================================

generated_files:
  description: "Auto-generated files that can be safely deleted and regenerated"
  
  patterns:
    - "docs/08-reference/implementation-status.md"
    - "docs/08-reference/remediation-status.md"
    - "cortex_brain/state/**/*.json"
    - "**/.pytest_cache/**"
    - "**/__pycache__/**"
    - "*.pyc"
    - ".coverage"
    - "htmlcov/**"
    - "build/**"
    - "dist/**"

  regeneration_trigger:
    - CI/CD pipeline runs (auto-generate)
    - Manual: `/doc-discover`, `/doc-generate`
    - Scheduled: Weekly auto-generation (optional)

  action: "DELETE (will be regenerated)"

---

# ============================================================================
# SECTION 5: DEPRECATED FILES (⚠️ RELOCATE or DELETE)
# ============================================================================

deprecated_files:
  description: "Files in wrong locations or obsolete format"
  
  patterns:
    - "docs_md/**"                              # Forbidden location
    - "cortex/.github/prompts/**"               # Wrong location
    - "root/*.md (except README.md)"            # Wrong location

  action: "DELETE or RELOCATE to canonical location"
  
  examples:
    - "docs_md/old-guide.md" → DELETE (merge to docs/04-guides/)
    - "cortex/.github/prompts/x.md" → RELOCATE to .github/prompts/

---

# ============================================================================
# SECTION 6: CLEANUP POLICIES
# ============================================================================

cleanup_policies:
  default_mode: "BALANCED"
  
  modes:
    aggressive:
      description: "Delete DEPRECATED + GENERATED files only"
      preservation: "INFORMATIONAL files preserved for manual review"
      risk: "LOW"
      use_case: "Quick cleanup, minimal data loss"
      coverage: "~60% of unnecessary files"
    
    balanced:
      description: "Delete DEPRECATED + GENERATED; Archive INFORMATIONAL"
      preservation: "Archives to _workspaces/_archive/ (restorable)"
      risk: "MEDIUM"
      use_case: "Recommended for production (DEFAULT)"
      coverage: "~85% of unnecessary files"
    
    conservative:
      description: "Only delete DEPRECATED; Archive everything else"
      preservation: "Maximum preservation, minimal deletion"
      risk: "LOW"
      use_case: "First-time cleanup, paranoid mode"
      coverage: "~30% of unnecessary files"

  safeguards_by_mode:
    aggressive:
      - No user approval needed for generated files
      - Requires approval for any INFORMATIONAL deletion
      - Git checkpoint mandatory
    
    balanced:
      - User approval for overall plan (dry-run first)
      - No approval needed for individual file archival
      - Git checkpoint mandatory
      - Backup manifest created
    
    conservative:
      - User approval for each file deletion
      - Requires file-by-file review
      - Git checkpoint mandatory
      - Full backup before any deletion

---

# ============================================================================
# SECTION 7: VACUUM OPERATION SEQUENCE
# ============================================================================

operation_sequence:
  phase_1_analysis:
    name: "File Classification & Analysis"
    agent: "FileClassificationAgent"
    input: "Repository root"
    output: "VacuumAnalysisReport"
    duration: "~30 seconds"
    dry_run_capable: true
    steps:
      - "Traverse all directories"
      - "Classify each file by patterns"
      - "Analyze file dependencies"
      - "Calculate preservation scores"
      - "Generate manifest"

  phase_2_preview:
    name: "User Review & Approval"
    agent: "Vacuum Orchestrator (user interaction)"
    input: "VacuumAnalysisReport"
    output: "User approval + optional modifications"
    duration: "~5 minutes (user decision time)"
    steps:
      - "Display analysis summary"
      - "Show deletions preview"
      - "Show relocations preview"
      - "Request approval"
      - "Wait for user response"

  phase_3_migration:
    name: "Content Migration"
    agent: "ContentRelocatorAgent"
    input: "files_to_relocate from analysis"
    output: "MigrationResult list"
    duration: "~30 seconds"
    dry_run_capable: true
    condition: "Only if files_to_relocate > 0"
    steps:
      - "Plan migrations"
      - "Transform content"
      - "Update references"
      - "Update mkdocs.yml"
      - "Generate migration audit trail"

  phase_4_sanitization:
    name: "Repository Sanitization"
    agent: "RepoSanitizerAgent"
    input: "files_to_delete, files_to_archive"
    output: "SanitizationResult"
    duration: "~1-2 minutes"
    dry_run_capable: true
    safeguards:
      - "Validate safeguards (no system files)"
      - "Create backup manifest"
      - "Create feature branch"
      - "Execute deletions (git rm)"
      - "Scan for broken references"
      - "Create git checkpoint"
    steps:
      - "Log AC_START"
      - "Archive files (if configured)"
      - "Delete files (git rm)"
      - "Update .gitignore"
      - "Validate integrity"
      - "Create git checkpoint CORE-026"
      - "Log AC_COMPLETE"

  phase_5_reporting:
    name: "Metrics & Reporting"
    agent: "Vacuum Orchestrator"
    input: "Analysis, Migration, Sanitization results"
    output: "VacuumReport + metrics"
    duration: "~30 seconds"
    steps:
      - "Calculate metrics (files deleted, space freed, etc.)"
      - "Generate PR summary"
      - "Create before/after comparison"
      - "List broken references (if any)"
      - "Generate rollback instructions"

  total_duration: "~2-5 minutes (dry-run 30 sec, execution 2-5 min)"

---

# ============================================================================
# SECTION 8: EXPECTED RESULTS
# ============================================================================

expected_results:
  informational_files_archived: "~19 files"
  informational_files_deleted: "~0 files (default: archive not delete)"
  documentation_reorganized: "~5-10 files"
  generated_files_deleted: "~3-5 files"
  disk_space_freed: "~5-8 MB"
  
  repository_metrics_before:
    total_md_files: "~150"
    _workspaces_md_files: "19"
    docs_md_files: "~80"
    unnecessary_files_ratio: "15%"
  
  repository_metrics_after:
    total_md_files: "~120"
    _workspaces_md_files: "5 (+ 14 archived)"
    docs_md_files: "~85"
    unnecessary_files_ratio: "3%"
    cleanliness_improvement: "12%"

  git_metrics:
    commits_created: "1"
    files_staged_for_deletion: "~15-20"
    files_added_to_archive: "~14-19"
    checkpoints_created: "1 (tag: vacuum-YYYYMMDD-vN)"

---

# ============================================================================
# SECTION 9: SAFEGUARDS & VALIDATION
# ============================================================================

safeguards:
  critical_checks:
    - name: "No system file deletion"
      check_list:
        - "cortex/*.py not in deletion list"
        - "cortex_brain/tier0/** not in deletion list"
        - ".github/prompts/*.prompt.md not in deletion list"
        - ".github/agents/*.md not in deletion list"
      action_on_violation: "BLOCK - refuse to proceed"
      severity: "CRITICAL"
    
    - name: "Preserved file count"
      check_list:
        - "*.prompt.md count >= 7"
        - "agents/*.md count >= 7"
        - "tier0/governance/** files preserved"
      action_on_violation: "BLOCK - refuse to proceed"
      severity: "CRITICAL"
    
    - name: "Git integrity"
      check_list:
        - "Working tree clean before start"
        - "Feature branch created for operation"
        - "Git checkpoint created after deletion"
      action_on_violation: "WARN - proceed with caution"
      severity: "HIGH"

  validation_after_deletion:
    - name: "Broken reference scan"
      scan_targets:
        - "cortex/**/*.py for deleted imports"
        - "docs/**/*.md for dead links"
        - ".github/**/*.yml for missing references"
      action: "Report but don't block (PR review will catch)"
      severity: "MEDIUM"
    
    - name: "Documentation integrity"
      checks:
        - "mkdocs build succeeds"
        - "No dead links in generated HTML"
        - "All navigation entries resolve"
      action: "Report - broken links block PR"
      severity: "HIGH"
    
    - name: "Code integrity"
      checks:
        - "Python syntax valid (pyright/mypy)"
        - "No orphaned imports"
        - "YAML files valid (tier0, tier1, etc.)"
      action: "Report - syntax errors block PR"
      severity: "HIGH"

---

# ============================================================================
# SECTION 10: ROLLBACK PROCEDURE
# ============================================================================

rollback_procedure:
  when: "If vacuum operation causes issues or user requests rollback"
  
  automatic_backup:
    location: "_workspaces/_vacuum-backups/backup-TIMESTAMP.manifest"
    contents:
      - File paths, sizes, checksums
      - Original file contents (for important files)
      - Git information (commit hash, branch)
    retention: "30 days"

  rollback_script:
    location: "_workspaces/_vacuum-backups/rollback-TIMESTAMP.sh"
    capability: "Restore all deleted files from git history"
    execution: "bash rollback-YYYYMMDD-HHMMSS.sh"

  git_rollback:
    method: "git reset --hard {checkpoint_hash_before_vacuum}"
    alternative: "git revert {vacuum_commit_hash}"
    time: "< 30 seconds"

---

# ============================================================================
# SECTION 11: POST-VACUUM MAINTENANCE
# ============================================================================

post_vacuum_maintenance:
  immediate_actions:
    - "Review git diff for confirmation"
    - "Test mkdocs build locally"
    - "Run Python linter/type checker"
    - "Create PR for team review"
    - "Merge after approval"

  ongoing_monitoring:
    frequency: "Monthly"
    checklist:
      - "New informational files accumulated?"
      - "_workspaces/ directory size growing?"
      - "Broken documentation links?"
      - "Outdated guides accumulating?"

  automated_cleanup:
    scheduled: "Monthly or per-phase"
    mode: "DRY_RUN first, BALANCED for execution"
    target: "Archive files > 30 days old from _archive/"

---

# ============================================================================
# SECTION 12: METRICS & REPORTING
# ============================================================================

metrics_captured:
  operation_metrics:
    - Files classified: N
    - Files deleted: M
    - Files archived: K
    - Files relocated: L
    - Disk space freed: X.X GB
    - Operation duration: HH:MM:SS
    - Broken references found: P

  quality_metrics:
    - Classification confidence (avg): %
    - Migration success rate: %
    - Safeguard violations: 0
    - Git checkpoint success: Yes/No
    - Documentation build success: Yes/No

  repository_metrics:
    - Total files before/after
    - Total lines of markdown before/after
    - Documentation coverage score
    - Repository cleanliness score (0-100)
    - Unnecessary files ratio before/after

  report_location: "_workspaces/reports/vacuum-report-YYYYMMDD.md"

---

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
