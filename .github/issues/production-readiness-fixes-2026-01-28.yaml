    category: "syntax_error"
    file: "cortex/brain/core/knowledge/alert_system.py"
    line: 470
    description: "Fixed indentation error in import statements"
    old_code: |
      from typing import Dict, List
          from datetime import datetime
          from pathlib import Path
    new_code: |
      from typing import Dict, List
      from datetime import datetime
      from pathlib import Path
      
  - id: FIX-008
    category: "syntax_error"
    file: "cortex/brain/core/knowledge/change_detection_integration.py"
    line: 29
    description: "Fixed misplaced import statement"
    error_type: "IndentationError"

  # ============================================================
  # CATEGORY 5: PLATFORM COMPATIBILITY (WINDOWS)
  # ============================================================
  - id: FIX-009
    category: "platform_compatibility"
    file: "cortex/collaboration/operation_lock.py"
    description: "Added Windows fallback for fcntl (Unix-only module)"
    change_type: "conditional_import"
    new_code: |
      import sys
      
      # fcntl is Unix-only, provide Windows fallback
      if sys.platform != "win32":
          import fcntl
          HAS_FCNTL = True
      else:
          fcntl = None  # type: ignore
          HAS_FCNTL = False
          
      def _lock_file(fd, exclusive: bool = True) -> None:
          """Cross-platform file locking."""
          if HAS_FCNTL and fcntl is not None:
              lock_type = fcntl.LOCK_EX if exclusive else fcntl.LOCK_SH
              fcntl.flock(fd, lock_type)
          # Windows fallback: no-op (or use msvcrt.locking)
          
      def _unlock_file(fd) -> None:
          """Cross-platform file unlocking."""
          if HAS_FCNTL and fcntl is not None:
              fcntl.flock(fd, fcntl.LOCK_UN)

  # ============================================================
