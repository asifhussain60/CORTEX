validation:
  commands:
    - name: "Verify orchestrator imports"
      command: |
        python -c "
        import yaml
        from pathlib import Path
        
        wiring_path = Path('cortex/wiring/specifications/wiring.yaml')
        with open(wiring_path) as f:
            wiring = yaml.safe_load(f)
        
        orch = wiring.get('orchestrators', {})
        for category in ['core', 'domain', 'support']:
            for o in orch.get(category, []):
                module = o.get('module')
                class_name = o.get('class')
                mod = __import__(module, fromlist=[class_name])
                getattr(mod, class_name)
        print('ALL 23 ORCHESTRATORS VERIFIED')
        "
      expected_output: "ALL 23 ORCHESTRATORS VERIFIED"
      
    - name: "Verify test collection"
      command: "python -m pytest tests/ --collect-only -q 2>&1 | Select-String 'collected|errors'"
      expected_pattern: "\\d+ tests collected, 0 errors"
      
    - name: "Run unit tests"
      command: "python -m pytest tests/unit -v --tb=short"
      expected: "All tests pass or skip gracefully"

replication_instructions:
  pre_requisites:
    - "Python 3.11+"
    - "Git repository cloned"
    - "Virtual environment activated"
    - "Dependencies installed: pip install -r requirements.txt"
    
  steps:
    - step: 1
      description: "Pull latest changes from repository"
      command: "git pull origin main"
      
    - step: 2
      description: "Verify all fixes are present by running validation commands"
      commands:
        - "python -m pytest tests/ --collect-only -q"
        
    - step: 3
      description: "If errors persist, check specific fix categories above"
      
    - step: 4
      description: "Run full test suite"
      command: "python -m pytest tests/ -v --tb=short"

notes:
  - |
    The DatabaseBackedRegistry was documented as SSOT but was deleted in Phase 2.
    Current architecture uses Git-backed YAML wiring at cortex/wiring/specifications/wiring.yaml
    
  - |
    25 tests are intentionally skipped due to modules that were planned but not implemented.
    These should be either implemented or removed in a future cleanup phase.
    
  - |
    Windows compatibility was added for fcntl-dependent code. Linux/Docker environments
    will use native fcntl while Windows falls back to no-op or msvcrt alternatives.
    
  - |
    Test file renames were necessary to resolve pytest's module name collision detection.
    This is a pytest limitation when two test files have the same name in different directories.

