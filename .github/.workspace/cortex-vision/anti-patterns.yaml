# CORTEX Anti-Patterns & Lessons - From Git History
# Source: Failures and corrections observed in commit messages
# Date: 2026-01-15 (Updated)

metadata:
  purpose: "Document what NOT to do based on historical failures"
  last_updated: "2026-01-15"

# ═══════════════════════════════════════════════════════════════════════════
# CRITICAL FAILURES
# ═══════════════════════════════════════════════════════════════════════════

failures:
  ssot_corruption:
    severity: "CRITICAL"
    description: "AI hallucination corrupted single source of truth"
    evidence:
      - "fix(CORTEX): Recover SSOT from chat01.md hallucination - SSOT restoration"
      - "docs: Add comprehensive hallucination root cause analysis"
    cause: "Multiple tracking files diverged, AI got confused"
    solution: "Single phase_tracker property in one YAML file"
    prevention:
      - "Never create redundant tracking files"
      - "Always check phase_tracker before implementing"
      
  ac_count_drift:
    severity: "HIGH"
    description: "AC counts in tracking files didn't match actual YAMLs"
    evidence:
      - "progress.json said 94, actual was 98"
      - "Phase-01 said 29, actual was 33"
    cause: "Multiple sources of truth for same data"
    solution: "Deleted progress.json, counts in phase_tracker only"
    
  brittleness:
    severity: "HIGH"
    description: "Hardcoded paths and version-specific imports"
    evidence:
      - "feat(cortex6): Stage 2 Phase 2.1 - Brittleness Fixes"
      - "feat(cortex6): Stage 2 Phase 2.2 - Version-Agnostic Import System"
    cause: "Quick fixes without considering maintainability"
    solution: "Centralized path resolution, version-agnostic imports"
    
  over_engineering:
    severity: "MEDIUM"
    description: "Solutions more complex than necessary"
    evidence:
      - "User feedback: 'I don't want this complicated structure'"
      - "User feedback: 'your solution is very brittle'"
    examples:
      - "Python lock file CLI tool → simple YAML property"
      - "Multiple tracking files → single phase_tracker"
      - "CORTEX LENS dependency for Observatory → Observatory reads existing data"
    solution: "Simplest viable approach first"
    
  tooling_duplication:
    severity: "MEDIUM"
    description: "Building same capability in multiple places"
    evidence:
      - "Initial Neural Observatory plan included CORTEX LENS integration as dependency"
      - "User correction: Observatory is independent SPA reading existing data"
    examples:
      - "AST scanning in both LENS and Observatory → LENS only"
      - "Knowledge graph in multiple places → LENS only"
    solution: "One implementation per capability, others consume output"

# ═══════════════════════════════════════════════════════════════════════════
# ANTI-PATTERNS DISCOVERED
# ═══════════════════════════════════════════════════════════════════════════

anti_patterns:
  multiple_sources_of_truth:
    description: "Same data tracked in multiple places"
    examples:
      - "progress.json + phase YAMLs + master.yaml"
      - "AC counts in index + phase files + tracker"
    consequence: "Drift, confusion, hallucination"
    correct_pattern: "Single source of truth (SSOT)"
    
  markdown_for_plans:
    description: "Using markdown docs for implementation plans"
    consequence: "Hard to parse, ambiguous, verbose"
    correct_pattern: "YAML-only for structured data"
    
  reimplementation:
    description: "AI redoing completed work"
    cause: "No locking mechanism"
    correct_pattern: "Phase locking with validation before work"
    
  local_validation_only:
    description: "Only checking immediate scope"
    consequence: "Conflicts and contradictions emerge later"
    correct_pattern: "Holistic validation across all phases"
    
  stub_restoration:
    description: "Restoring stubs/mocks after removal"
    evidence:
      - "Admin Governor v2.2.2: Anti-restoration rule for stubs/mocks"
    correct_pattern: "Implement real functionality"

# ═══════════════════════════════════════════════════════════════════════════
# GOVERNANCE VIOLATIONS
# ═══════════════════════════════════════════════════════════════════════════

governance_violations:
  root_folder_policy:
    description: "Files placed in wrong locations"
    evidence:
      - "chore(cortex-4.0): Admin Governor enforcement - CORTEX 4.0 structure alignment"
      - "Phase 0: Enforce root directory policy"
    rule: "Specific file types belong in specific folders"
    
  test_artifacts:
    description: "Test files left in production areas"
    evidence:
      - "Cleanup: Remove 8phase test artifacts from planning system tests"
      - "chore(cleanup): Add remaining untracked files from Week 10 Day 3 work"
    rule: "Test artifacts in tests/ only"
    
  backup_files:
    description: "Backup files committed to repo"
    evidence:
      - "chore(maintenance): Phase 2 complete - deleted all backup files/folders"
      - "Archive 19 backup files before cleanup"
    rule: "Backups are temporary, never commit"

# ═══════════════════════════════════════════════════════════════════════════
# RECOVERY PATTERNS
# ═══════════════════════════════════════════════════════════════════════════

recovery_patterns:
  ssot_restoration:
    trigger: "Detected SSOT corruption"
    steps:
      - "Identify authoritative source (git history, chat logs)"
      - "Document root cause analysis"
      - "Restore from authoritative source"
      - "Add prevention mechanism (phase locking)"
    evidence:
      - "feat: SSOT reconciliation from AC-INDEX authority"
      
  checkpoint_recovery:
    trigger: "Need to rollback to known good state"
    mechanism: "Git checkpoints with tags"
    evidence:
      - "Checkpoint: Test Phase - 50% [tags: stable, pre-migration]"
      
  vacuum_cleanup:
    trigger: "Accumulated cruft and obsolete files"
    mechanism: "Vacuum orchestrator with discovery intelligence"
    evidence:
      - "VACUUM COMPLETE: Operation summary and success report"
      - "cleanup(cx6-plan): remove 137 obsolete files (92% reduction)"

# ═══════════════════════════════════════════════════════════════════════════
# VALIDATION CHECKLIST
# ═══════════════════════════════════════════════════════════════════════════

validation_before_change:
  conflicts:
    - "Does this duplicate existing scope?"
    - "Does this break existing dependencies?"
    
  contradictions:
    - "Does this reverse a prior decision?"
    - "Does this violate tier0 governance?"
    - "Does this invalidate completed work?"
    
  ambiguity:
    - "Is this measurable and testable?"
    - "Are dependencies explicit?"
    - "Is success/failure defined?"
    
  integrity:
    - "Do counts remain accurate?"
    - "Are dependency chains valid?"
    - "Does phase scope stay coherent?"
