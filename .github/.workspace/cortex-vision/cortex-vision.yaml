# ═══════════════════════════════════════════════════════════════════════════
# LESSONS LEARNED
# ═══════════════════════════════════════════════════════════════════════════

lessons_learned:
  ssot_principle:
    problem: "Multiple sources of truth cause drift and hallucination"
    evidence: "progress.json diverged from phase YAML AC counts"
    solution: "Single phase_tracker in cortex-master.yaml"
    
  brittleness:
    problem: "Hardcoded paths, version-specific imports break easily"
    evidence: "CORTEX-5.5 dedicated phases to brittleness fixes"
    solution: "Version-agnostic imports, centralized path resolution"
    
  hallucination_risk:
    problem: "AI agents can reimplement completed work"
    evidence: "SSOT corruption required restoration from chat history"
    solution: "Phase locking mechanism, holistic validation"
    
  complexity_creep:
    problem: "Solutions become over-engineered"
    evidence: "Initial lock file system rejected as 'very brittle'"
    solution: "Simplest viable approach, YAML properties over Python tools"

