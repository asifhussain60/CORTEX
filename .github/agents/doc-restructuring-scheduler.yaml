# CORTEX Documentation Restructuring - Autonomous Scheduler
# Triggers automatic documentation discovery and restructuring

name: "Autonomous Documentation Restructuring"
description: "Automatically scan, analyze, and restructure documentation without user input"

# Trigger configuration
trigger:
  type: "scheduled"
  schedule: "0 2 * * 0"  # Weekly at 2 AM Sunday UTC
  manual: true  # Also allow manual trigger
  
# Conditions to run
conditions:
  - type: "file_change"
    pattern: "**/*.md"
    exclude: ["docs/", ".github/"]
  - type: "file_change"
    pattern: "**/*.txt"
    exclude: ["docs/", ".github/"]
  - type: "path_exists"
    pattern: "_workspaces/**/*.md"

# Autonomous execution phases
phases:
  - id: "phase-0-scan"
    name: "Discover Documentation Files"
    description: "Recursively scan repository for scattered documentation"
    action: "run_agent"
    agent: "doc-restructuring-agent.py"
    args:
      - "--scan"
      - "--root=${CORTEX_ROOT}"
      - "--output=.github/agents/scan-results.json"
    timeout: "15m"
    retry: "3x exponential"
  
  - id: "phase-1-analyze"
    name: "Analyze and Categorize"
    description: "Automatically categorize discovered files"
    action: "run_agent"
    agent: "doc-restructuring-agent.py"
    args:
      - "--analyze"
      - "--input=.github/agents/scan-results.json"
      - "--output=.github/agents/analysis-results.json"
    timeout: "10m"
    depends_on: "phase-0-scan"
  
  - id: "phase-2-execute"
    name: "Execute Restructuring"
    description: "Move and archive files according to categorization"
    action: "run_agent"
    agent: "doc-restructuring-agent.py"
    args:
      - "--execute"
      - "--input=.github/agents/analysis-results.json"
      - "--dry-run=false"
    timeout: "20m"
    depends_on: "phase-1-analyze"
    approval_required: false  # AUTONOMOUS - no approval needed
  
  - id: "phase-3-report"
    name: "Generate Report"
    description: "Create comprehensive restructuring report"
    action: "run_agent"
    agent: "doc-restructuring-agent.py"
    args:
      - "--report"
      - "--input=.github/agents/analysis-results.json"
      - "--output=.github/agents/doc-restructuring-report.md"
    timeout: "5m"
    depends_on: "phase-2-execute"

# Notifications
notifications:
  - type: "log"
    destination: ".github/agents/doc-restructuring.log"
    level: "info"
  
  - type: "slack"
    channel: "#cortex-docs"
    on_completion: true
    include_report: true
    
  - type: "git_commit"
    message: "Autonomous: Documentation restructuring - Phase [PHASE_ID]"
    auto_push: true
    branch: "auto/doc-restructuring-[DATE]"

# Rollback capability
rollback:
  enabled: true
  strategy: "git_revert"
  on_failure: true
  preserve_log: true

# Safety guardrails
safety:
  protected_files: true  # Respect ProtectionFilter
  dry_run_first: true   # Always preview before execution
  backup: true          # Create backup before changes
  confirm_before_commit: false  # Autonomous - no confirmation needed
  max_changes_per_run: 200
  
# Agent configuration
agent_config:
  timeout: "60m"
  max_retries: 3
  log_level: "INFO"
  environment:
    CORTEX_ROOT: "${CORTEX_ROOT}"
    LOG_PATH: ".github/agents/doc-restructuring.log"
    REPORT_PATH: ".github/agents/doc-restructuring-report.json"
