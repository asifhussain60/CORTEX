phase:
  id: "PHASE-18-ORCHESTRATOR-DEVX"
  title: "Orchestrator Development Experience (DevX)"
  description: |
    Interactive development tools for orchestrator testing and integration.
    
    HYBRID APPROACH - Leverages existing infrastructure:
    1. Extends GovernanceCLI (PHASE-09) with REPL mode
    2. Reuses AgentExecutionSandbox (PHASE-11) for isolation
    3. Adds unique features: hot-reload, scenarios, validation
    
    Vision: Zero-friction orchestrator development with instant feedback,
    scenario-based testing, and automated integration validation.
    
    Code Reuse: 75% (9 hours saved by extending existing infrastructure)
  
  order: 18
  status: "NOT_STARTED"
  locked: false
  
  # DEPENDENCIES - Both completed ✅
  requires: "PHASE-17-DOMAIN-BRAIN"
  depends_on:
