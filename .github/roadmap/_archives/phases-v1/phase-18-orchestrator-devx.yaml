# =============================================================================
# ACCEPTANCE CRITERIA (4 ACs - Reduced from 12 due to reuse)
# =============================================================================

acceptance_criteria:
  # =========================================================================
  # AC-ODX-001-01: Interactive DevX Console (EXTENDS PHASE-09)
  # =========================================================================
  - ac_id: "ODX-001-01"
    title: "Interactive DevX Console with REPL Mode"
    description: |
      Extend GovernanceCLI (PHASE-09) with interactive REPL console for
      orchestrator development. Provides persistent session, command history,
      and context-aware orchestrator loading.
      
      REUSE: Extends existing GovernanceCLI infrastructure (35% overlap eliminated)
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Start REPL console: `cortex devx console`"
      - "Load orchestrator: `devx> load PlanningOrchestrator`"
      - "Set tier access: `devx> set-tier-access 0,1,2`"
      - "Execute with params: `devx> execute {\"operation\": \"list_phases\"}`"
      - "Inspect result: `devx> inspect` shows formatted output"
      - "Command history: Up arrow recalls previous commands"
      - "Tab completion: Orchestrator names auto-complete"
      - "Session state persists across commands"
      - "Clean exit: `devx> exit` closes cleanly"
    
    implementation_details: |
      File: src/cli/devx_cli.py
      
      class OrchestratorDevXCLI(GovernanceCLI):  # Extends existing CLI
          """Interactive REPL for orchestrator development."""
          
          def repl_mode(self) -> None:
              """Start interactive console."""
              session = DevXSession()
              while True:
                  command = input("devx> ")
                  self.execute_devx_command(command, session)
      
      Commands:
        - load <orchestrator>: Load orchestrator class
        - set-tier-access <tiers>: Configure tier access
        - execute <params>: Run orchestrator with JSON params
        - inspect: Show detailed result
        - audit-trail: View audit log entries
        - help: Show commands
        - exit: Exit console
    
    test_file: "tests/unit/cli/test_devx_cli.py"
    test_count: 12
    
    git_checkpoint: "ODX-001-01-devx-console"
    estimated_hours: 2
  
  # =========================================================================
  # AC-ODX-001-02: Sandbox Integration (REUSES PHASE-11)
  # =========================================================================
  - ac_id: "ODX-001-02"
    title: "Orchestrator Sandbox Integration"
    description: |
      Wrap AgentExecutionSandbox (HP-002-01) for orchestrator-specific
      testing. Leverages existing sandbox infrastructure (80% reuse).
      
      REUSE: Uses proven AgentExecutionSandbox (26/26 tests passing)
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Load orchestrator in sandbox mode"
      - "Execute in SANDBOX mode (no side effects)"
      - "Execute in DRY_RUN mode (preview only)"
      - "Execute in COMMITTED mode (real execution)"
      - "Snapshot state before execution"
      - "Rollback to snapshot on failure"
      - "Verify sandbox isolation (no database changes)"
      - "Test with PlanningOrchestrator"
      - "Test with MasterOrchestrator"
    
    implementation_details: |
      File: src/cli/devx_sandbox.py
      
      from src.core.hallucination_prevention.execution_sandbox import (
          AgentExecutionSandbox, ExecutionMode
      )
      
      class OrchestratorDevSandbox:
          """Orchestrator-specific sandbox wrapper."""
          
          def __init__(self):
              self.sandbox = AgentExecutionSandbox()  # Reuse existing!
          
          def test_orchestrator(
              self, 
              orch: OrchestratorBase, 
              mode: ExecutionMode
          ) -> SandboxResult:
              """Test orchestrator in specified mode."""
              return self.sandbox.execute(orch.run, mode)
    
    test_file: "tests/unit/cli/test_devx_sandbox.py"
    test_count: 10
    
    git_checkpoint: "ODX-001-02-sandbox-integration"
    estimated_hours: 2
  
  # =========================================================================
  # AC-ODX-002-01: Hot-Reload & Scenario Manager (NEW)
  # =========================================================================
  - ac_id: "ODX-002-01"
    title: "Hot-Reload Development Mode with Scenario Library"
    description: |
      NEW FUNCTIONALITY: Watch orchestrator files for changes, auto-reload,
      and re-run last command. Save/load test scenarios, export to pytest.
      
      This is unique functionality not duplicated in existing phases.
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      # Hot-Reload
      - "Start watch mode: `cortex devx dev PlanningOrchestrator --watch`"
      - "Edit orchestrator file while running"
      - "Auto-detect file change within 1 second"
      - "Auto-reload orchestrator module"
      - "Re-run last command automatically"
      - "Show diff between runs"
      - "Handle reload errors gracefully"
      
      # Scenario Library
      - "Save scenario: `devx> save-scenario happy_path_list_phases`"
      - "Scenario saved to test-scenarios/happy_path_list_phases.yaml"
      - "Load scenario: `cortex devx run-scenario happy_path_list_phases`"
      - "Scenario executes with saved parameters"
      - "Export to pytest: `cortex devx export happy_path_list_phases -o test.py`"
      - "Generated pytest test is valid Python"
      - "Generated test includes AC markers"
      - "Generated test has proper assertions"
    
    implementation_details: |
      Files:
        - src/cli/devx_hot_reload.py (file watcher)
        - src/cli/devx_scenario_manager.py (scenarios + export)
      
      # Hot-Reload
      class HotReloadWatcher:
          """Watch orchestrator source and auto-reload."""
          
          def watch(self, orchestrator_path: Path, console: DevXConsole):
              """Watch for changes, reload on modify."""
              while True:
                  if self.file_modified(orchestrator_path):
                      self.reload_module(orchestrator_path)
                      console.rerun_last_command()
      
      # Scenario Manager
      @dataclass
      class TestScenario:
          name: str
          orchestrator: str
          tier_access: Set[int]
          parameters: Dict[str, Any]
          expected_status: str
      
      class ScenarioManager:
          def save_scenario(self, scenario: TestScenario):
              """Save to YAML."""
          
          def export_pytest(self, scenario: TestScenario) -> str:
              """Generate pytest integration test code."""
              # Returns complete pytest test as string
    
    test_file: "tests/unit/cli/test_devx_scenario_manager.py"
    test_count: 15
    
    git_checkpoint: "ODX-002-01-hot-reload-scenarios"
    estimated_hours: 5
  
  # =========================================================================
  # AC-ODX-002-02: Integration Validator (NEW)
  # =========================================================================
  - ac_id: "ODX-002-02"
    title: "Pre-Integration Validation Checklist"
    description: |
      NEW FUNCTIONALITY: Automated validation that orchestrator is ready
      for CORTEX integration. Provides "Ready for CORTEX" certification.
      
      This is unique functionality not duplicated in existing phases.
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Run validation: `cortex devx validate PlanningOrchestrator`"
      - "Check 1: Inherits from OrchestratorBase ✓"
      - "Check 2: execute() method implemented ✓"
      - "Check 3: get_tier_access() declared ✓"
      - "Check 4: Governance rules validated ✓"
      - "Check 5: Audit trail entries created ✓"
      - "Check 6: Response headers injected ✓"
      - "Check 7: MCP tools registered (if applicable) ✓"
      - "Check 8: All integration tests pass ✓"
      - "Generate validation report"
      - "Report shows READY or NOT_READY with reasons"
      - "Report includes next steps"
    
    implementation_details: |
      File: src/cli/devx_integration_validator.py
      
      @dataclass
      class ValidationCheck:
          name: str
          passed: bool
          message: str
      
      class IntegrationValidator:
          """Validate orchestrator ready for CORTEX."""
          
          def validate(
              self, 
              orchestrator_class: Type[OrchestratorBase]
          ) -> ValidationReport:
              """Run all validation checks."""
              checks = [
                  self._check_inheritance(orchestrator_class),
                  self._check_execute_method(orchestrator_class),
                  self._check_tier_access(orchestrator_class),
                  self._check_governance_rules(orchestrator_class),
                  self._check_audit_logging(orchestrator_class),
                  self._check_response_headers(orchestrator_class),
                  self._check_mcp_tools(orchestrator_class),
                  self._check_integration_tests(orchestrator_class),
              ]
              return ValidationReport(
                  orchestrator=orchestrator_class.__name__,
                  checks=checks,
                  ready=all(c.passed for c in checks)
              )
    
    test_file: "tests/unit/cli/test_devx_integration_validator.py"
    test_count: 10
    
    git_checkpoint: "ODX-002-02-integration-validator"
    estimated_hours: 3

