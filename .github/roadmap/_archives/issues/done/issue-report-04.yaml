# ============================================================================
# VERIFICATION STRATEGY
# ============================================================================

verification:
  test_1:
    name: "Per-Turn Governance Validation"
    test_file: "tests/unit/test_governance_per_turn.py"
    test_cases:
      - |
        def test_governance_validated_every_turn():
            protocol = ConversationProtocol(mock_orchestrator)
            
            # Turn 1: Validate called
            decision1 = protocol.execute_turn("input1", {})
            assert protocol._governance_validated_turn[1] == True
            
            # Turn 2: Validate called AGAIN
            decision2 = protocol.execute_turn("input2", {})
            assert protocol._governance_validated_turn[2] == True
            
            # Turn 3: Validate called AGAIN
            decision3 = protocol.execute_turn("input3", {})
            assert protocol._governance_validated_turn[3] == True
      
      - |
        def test_tier0_immutability_enforced_per_turn():
            protocol = ConversationProtocol(mock_orchestrator)
            
            # Get baseline
            tier0_before = protocol._governance_registry.get_all_tier0_rules()
            
            # Execute Turn 1
            protocol.execute_turn("input", {})
            
            # Attempt mutation on Turn 2
            mock_orchestrator.attempt_mutation("CORE-001", "modified")
            decision = protocol.execute_turn("mutate", {})
            
            # Should halt with GOVERNANCE_HALT
            assert decision.reason == ContinuationReason.GOVERNANCE_HALT
            
            # TIER-0 unchanged
            tier0_after = protocol._governance_registry.get_all_tier0_rules()
            assert tier0_before == tier0_after
  
  test_2:
    name: "Master Orchestrator Per-Turn Validation"
    test_file: "tests/integration/test_master_governance_per_turn.py"
    test_cases:
      - |
        def test_master_orchestrator_validates_governance_per_turn():
            master = MasterOrchestrator()
            
            # Turn 1: Initialize and validate
            decision1 = master.coordinate_operation("plan", context1)
            assert decision1.governance_validated == True
            assert decision1.audit_entry_id.startswith("MO-AC_START-1")
            
            # Turn 2: Validate AGAIN
            decision2 = master.coordinate_operation("design", decision1.next_parameters)
            assert decision2.governance_validated == True
            assert decision2.audit_entry_id.startswith("MO-AC_START-2")
  
  test_3:
    name: "Database Tier Enforcement"
    test_file: "tests/unit/test_tier_enforcement_database.py"
    test_cases:
      - |
        def test_tier0_immutability_enforced_database():
            db = governance_db
            
            # Verify tier_access_log exists
            tables = db.query("SELECT name FROM sqlite_master WHERE type='table'")
            assert any(t['name'] == 'tier_access_log' for t in tables)
            
            # Log a tier access (Turn 1)
            db.execute("""
                INSERT INTO tier_access_log (turn_number, orchestrator_id, 
                    accessed_tier, operation, rule_id, enforcement_action)
                VALUES (1, 'TestOrch', 0, 'read', 'CORE-001', 'ALLOW')
            """)
            
            # Attempt to modify TIER-0 rule (should fail)
            try:
                db.execute("""
                    UPDATE governance_rules 
                    SET description='MODIFIED' 
                    WHERE tier=0 LIMIT 1
                """)
                pytest.fail("Should have raised immutability constraint")
            except sqlite3.IntegrityError as e:
                assert "TIER-0 rule cannot be modified" in str(e)
  
  test_4:
    name: "TierAccessValidator Integration"
    test_file: "tests/integration/test_tier_validator_integration.py"
    test_cases:
      - |
        def test_tier_validator_blocks_undeclared_access():
            protocol = ConversationProtocol(mock_orchestrator)
            
            # Orchestrator declares TIER-0, TIER-1
            mock_orchestrator.declare_tier_access([0, 1])
            
            # Turn 1: Try to access TIER-2 (undeclared)
            mock_orchestrator.attempt_access(tier=2)
            
            decision = protocol.execute_turn("access-tier2", {})
            
            # Should halt
            assert decision.reason == ContinuationReason.GOVERNANCE_HALT
            assert "TIER-2" in str(decision.governance_violations)

  verification_gate: |
    ALL tests must PASS before considering fixes complete:
    - test_per_turn_governance_validation.py: 6+ tests
    - test_master_governance_per_turn.py: 4+ tests
    - test_tier_enforcement_database.py: 5+ tests
    - test_tier_validator_integration.py: 3+ tests
    
    Total: 18+ new tests, all PASSING

