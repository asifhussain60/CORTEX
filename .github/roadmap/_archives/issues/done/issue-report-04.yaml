root_causes:
  - cause_id: "ROOT-001"
    title: "ConversationProtocol Governance Validation is Stub"
    description: |
      File: src/core/orchestrator/conversation_protocol.py
      Method: _validate_governance_before_turn() [lines 200-214]
      
      Current Implementation:
        def _validate_governance_before_turn(self) -> Result[bool]:
            try:
                if self._governance_registry:  # ⚠️ Always None
                    if not self._governance_registry.should_proceed():  # ⚠️ Never called
                        return Err("Governance rule violation detected")
                return Ok(True)  # ⚠️ ALWAYS RETURNS TRUE
            except Exception as e:
                return Err(f"Governance check failed: {str(e)}")
      
      Issues:
      - self._governance_registry initialized to None, never set
      - GovernanceRegistry.should_proceed() method doesn't exist
      - No actual TIER-0 validation happening
      - Framework calls this but receives always-True
      
      Impact: Per-turn governance validation is NO-OP
    
    evidence:
      - File: src/core/orchestrator/conversation_protocol.py:200-214
      - File: src/core/governance_registry.py (no should_proceed method)
      - Pattern: Framework exists but implementation is stub
      - Tests: test_pre_turn_governance_validation_called() patches registry
  
  - cause_id: "ROOT-002"
    title: "Master Orchestrator Doesn't Call Governance Validation"
    description: |
      File: src/orchestrators/master/master_orchestrator.py
      Method: coordinate_operation()
      
      Current Pattern:
        def coordinate_operation(self, operation, context):
            # NO governance validation here
            result = self._delegate_to_domain_orchestrator(operation, context)
            return result
      
      Expected Pattern (from CORTEX.prompt.md):
        def coordinate_operation(self, operation, context):
            # NEW: Validate governance before every delegation
            governance = GovernanceRegistry.instance()
            if not governance.validate_per_turn():
                return Err("Governance violation")
            
            # THEN delegate
            result = self._delegate_to_domain_orchestrator(operation, context)
            return result
      
      Issues:
      - No governance registry initialized in Master
      - No per-turn validation check before delegation
      - No governance violations in ContinuationDecision returned
      
      Impact: Master doesn't enforce CORE-019/CORE-027 governance requirements
    
    evidence:
      - Pattern: Master delegates without governance check
      - Spec: CORTEX.prompt.md § Master Orchestrator 4-Stage Pattern
      - Tests: test_master_orchestrator_validates_governance_per_turn() not implemented
  
  - cause_id: "ROOT-003"
    title: "Database-Level Tier Enforcement Missing"
    description: |
      Database: cortex-brain/state/governance.db (SQLite)
      
      Current Schema:
      - audit_log table: Logs operations (AC_START, AC_EXECUTE, AC_COMPLETE)
      - governance_rules table: Stores TIER-0/1/2 rules
      - Missing: tier_access_log, immutability constraints
      
      Missing Components:
      1. No tier_access_log table:
         CREATE TABLE tier_access_log (
             id INTEGER PRIMARY KEY,
             turn_number INTEGER,
             orchestrator_id TEXT,
             accessed_tier INTEGER,
             operation TEXT,
             rule_id TEXT,
             enforcement_action TEXT,  -- ALLOW, BLOCK, WARN
             timestamp DATETIME,
             UNIQUE(turn_number, orchestrator_id, rule_id)
         );
      
      2. No immutability constraint:
         CREATE TRIGGER tier0_immutability_check
         BEFORE UPDATE ON governance_rules
         WHEN NEW.tier = 0
         BEGIN
             SELECT RAISE(ABORT, 'TIER-0 cannot be modified')
             WHERE (SELECT COUNT(*) FROM tier_access_log 
                    WHERE rule_id=NEW.id) > 0;
         END;
      
      3. No per-turn validation queries
      
      Impact: Tier violations not enforced at database layer
    
    evidence:
      - File: cortex-brain/state/governance.db (no tier_access_log table)
      - Pattern: Audit-only database, no enforcement
      - Missing: Schema definition for tier enforcement
  
  - cause_id: "ROOT-004"
    title: "TierAccessValidator Implemented But Unused"
    description: |
      Implementation Status: ✅ COMPLETE (28/28 tests PASSING)
      File: src/core/tier_validator.py
      
      What EXISTS:
      - TierAccessValidator class: validate_tier_declaration(), validate_access_attempt()
      - TierAccessEnforcer class: enforce_on_orchestrator()
      - TierViolation tracking: with violation types and actions
      - Comprehensive tests: All 28 tests PASSING
      
      What's MISSING:
      - No call from ConversationProtocol.execute_turn()
      - Not wired into per-turn governance validation
      - Never initialized in MasterOrchestrator
      - Dead code: exists but never executed
      
      Expected Integration:
        def _validate_governance_before_turn(self) -> Result[bool]:
            validator = TierAccessValidator()
            enforcer = TierAccessEnforcer(validator)
            
            result = enforcer.enforce_on_orchestrator(
                orchestrator=self.orchestrator,
                mode="strict"
            )
            return result
      
      Impact: Tier boundary enforcement available but not used
    
    evidence:
      - File: src/core/tier_validator.py (TierAccessValidator, TierAccessEnforcer)
      - Tests: tests/unit/test_tier_validator.py (28/28 PASSING)
      - Usage: grep -r "TierAccessValidator" in execute_turn context = 0 matches
      - Status: Complete implementation, zero usage

