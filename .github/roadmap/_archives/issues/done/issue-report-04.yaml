summary: |
  CRITICAL GOVERNANCE GAP: TIER-0 immutability and governance rules are enforced
  at configuration load time but NOT validated on every orchestrator turn. 
  ConversationProtocol has stub implementation, Master Orchestrator doesn't validate, 
  and database-level enforcement is missing. This violates AR-001-03 (Tier 0 immutable),
  CORE-017 (Strict Governance), CORE-019 (TDD-Master routing), and CORE-027 (Audit trail).

problem_type: "Architecture Gap - Governance Enforcement"
affected_components:
  - "ConversationProtocol (src/core/orchestrator/conversation_protocol.py)"
  - "MasterOrchestrator (src/orchestrators/master/master_orchestrator.py)"
  - "GovernanceRegistry (src/core/governance_registry.py)"
  - "governance.db (SQLite database)"
  - "TierAccessValidator (implemented but unused)"

# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

problem:
  title: "TIER-0 Governance Not Enforced Per-Turn"
  
  description: |
    CORTEX.prompt.md § Governance Integration specifies that governance tiers
    (TIER-0 immutable, TIER-1 project, TIER-2 engineering) MUST be enforced on
    ALL turns when interacting with Master Orchestrator.
    
    ACTUAL BEHAVIOR:
    - Turn 1: ✅ TIER-0 immutability enforced at configuration load
    - Turn 2: ⚠️ No re-validation (immutability could be violated)
    - Turn 3: ⚠️ No re-validation (immutability could be violated)
    - Turn N: ⚠️ No re-validation (immutability could be violated)
    
    ROOT CAUSES:
    1. ConversationProtocol._validate_governance_before_turn() is STUB
       - Only returns Ok(True) without checking anything
       - GovernanceRegistry.should_proceed() never implemented
       - self._governance_registry always None
    
    2. Master Orchestrator doesn't validate governance per turn
       - No call to governance registry before delegation
       - CORE-019 (per-turn routing) not enforced
       - CORE-027 (per-turn audit) not validated for governance
    
    3. Database-level tier enforcement missing
       - governance.db audits operations but doesn't enforce tiers
       - No tier_access_log table tracking what tier accessed what
       - No immutability constraints at database layer
       - No per-turn tier boundary validation in queries
    
    4. TierAccessValidator implemented but unused
       - Class exists (28/28 tests PASSING)
       - Never called from ConversationProtocol.execute_turn()
       - Tier boundary validation available but "dead code"
  
  current_state: |
    ✅ TIER-0 rules loaded from cortex-brain/tier0/governance/core-rules.yaml (29 rules)
    ✅ Tier precedence enforced (0 > 1 > 2) via TierResolver
    ✅ Rule registration prevents TIER-0 override (add_tier1/2_rule checks)
    ✅ In-memory tier enforcement framework complete
    
    ❌ Per-turn governance validation MISSING (ConversationProtocol stub)
    ❌ Master Orchestrator governance checks MISSING
    ❌ Database-level tier enforcement MISSING
    ❌ TIER-0 immutability NOT enforced during execution
    ❌ TierAccessValidator NOT wired into execution flow
  
  expected_state: |
    ✅ Turn 1: Governance validated before orchestrator execution
    ✅ Turn 2: Governance re-validated (TIER-0 immutability re-checked)
    ✅ Turn 3: Governance re-validated (TIER-0 immutability re-checked)
    ✅ Turn N: Governance re-validated every single turn
    
    ✅ Master Orchestrator validates before delegating to domain orchestrators
    ✅ Per-turn tier access logged to database with enforcement decision
    ✅ Database constraints prevent TIER-0 modification after Turn 1
    ✅ TierAccessValidator integrated into ConversationProtocol execution
    ✅ Audit trail shows governance_violations for each turn
  
  impact: |
    SEVERITY: CRITICAL
    
    GOVERNANCE VIOLATIONS:
    - AR-001-03: "Tier 0 rules immutable" - NOT enforced per turn
    - CORE-017: "Strict governance enforcement" - Only Turn 1, not subsequent turns
    - CORE-019: "TDD-Master routing" - Not validated per turn
    - CORE-027: "Audit trail per turn" - Logs exist but not validated for governance
    
    OPERATIONAL RISKS:
    - Orchestrator could mutate TIER-0 rules after Turn 1 (undetected)
    - Orchestrator could access undeclared tiers after Turn 1 (undetected)
    - TIER-0 immutability could be violated mid-conversation (undetected)
    - No audit trail of "which tier did this orchestrator access on this turn"
    - Master routing violations go undetected across multi-turn conversations
    
    USER IMPACT:
    - Conversations longer than Turn 1 lose governance protection
    - Complex workflows (5+ turns) vulnerable to governance violations
    - No database record of tier enforcement decisions
    - Regression from CORTEX5.5 where governance worked per-turn
  
  scope: |
    - Master Orchestrator multi-turn conversations (all turns after Turn 1)
    - All domain orchestrators (Planning, Design, Implementation, Interaction)
    - All wrapped orchestrators using ConversationProtocol
    - All master routing decisions requiring CORE-019/CORE-027 compliance

