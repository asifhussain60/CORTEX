proposed_solutions:
  solution_1:
    id: "SOL-GOV-001"
    title: "Implement Per-Turn Governance Validation in ConversationProtocol"
    priority: "P0"
    effort_hours: "4-6"
    files_to_modify:
      - "src/core/orchestrator/conversation_protocol.py"
    implementation: |
      Replace stub _validate_governance_before_turn() with:
      
      def _validate_governance_before_turn(self) -> Result[bool]:
          # Initialize registry if needed
          if not self._governance_registry:
              self._governance_registry = GovernanceRegistry.instance()
              self._governance_registry.initialize()
          
          # Check TIER-0 immutability
          tier0_rules = self._governance_registry.get_all_tier0_rules()
          for rule in tier0_rules:
              # Query database: has this rule been modified?
              if self._has_tier0_been_modified(rule.rule_id):
                  return Err(f"TIER-0 rule {rule.rule_id} immutability violated")
          
          # Check orchestrator tier access (wire TierAccessValidator)
          validator = TierAccessValidator()
          enforcer = TierAccessEnforcer(validator)
          
          result = enforcer.enforce_on_orchestrator(
              orchestrator=self.orchestrator,
              mode="strict"  # Raise exception on violation
          )
          
          return result
    acceptance_tests:
      - "test_governance_validated_per_turn_returns_true_on_turn_1"
      - "test_governance_validated_per_turn_checks_tier0_turn_2"
      - "test_governance_validation_halts_on_tier_violation"
      - "test_tier_access_validator_called_per_turn"
    dependencies: "GovernanceRegistry should_proceed() implementation, TierAccessValidator"
  
  solution_2:
    id: "SOL-GOV-002"
    title: "Add Master Orchestrator Per-Turn Governance Checks"
    priority: "P0"
    effort_hours: "3-4"
    files_to_modify:
      - "src/orchestrators/master/master_orchestrator.py"
    implementation: |
      Update coordinate_operation() to validate governance:
      
      def coordinate_operation(self, operation, context):
          # NEW: Per-turn governance validation
          governance = GovernanceRegistry.instance()
          if not governance.is_initialized():
              governance.initialize()
          
          # Validate CORE-019 compliance
          valid_ops = self._get_core019_valid_operations()
          if operation not in valid_ops:
              return Err(f"CORE-019 violation: {operation} not in valid set")
          
          # Log AC_START with governance context
          audit = EnhancedAuditLogger()
          audit.log_entry(
              operation="AC_START",
              ac_id=f"MASTER-ORCH-TURN-{self.turn_number}",
              governance_context=governance.get_all_rules()
          )
          
          # Delegate to domain orchestrator
          result = self._delegate_to_domain_orchestrator(operation, context)
          
          # Log AC_COMPLETE with governance validation
          audit.log_entry(
              operation="AC_COMPLETE",
              ac_id=f"MASTER-ORCH-TURN-{self.turn_number}",
              governance_validated=True
          )
          
          return result
    acceptance_tests:
      - "test_master_validates_core019_per_turn"
      - "test_master_halts_on_governance_violation"
      - "test_master_logs_governance_context_ac_start"
      - "test_master_validates_governance_ac_complete"
    dependencies: "SOL-GOV-001 (ConversationProtocol validation must work first)"
  
  solution_3:
    id: "SOL-GOV-003"
    title: "Add Database-Level Tier Enforcement Schema"
    priority: "P0"
    effort_hours: "5-6"
    files_to_create:
      - "src/core/database/tier_enforcement_schema.sql"
      - "src/core/database/tier_enforcement_queries.py"
    implementation: |
      Create tier_enforcement_schema.sql:
      
      -- Table: Track per-turn tier access
      CREATE TABLE tier_access_log (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          turn_number INTEGER NOT NULL,
          orchestrator_id TEXT NOT NULL,
          accessed_tier INTEGER NOT NULL,
          operation TEXT NOT NULL,
          rule_id TEXT,
          enforcement_action TEXT,  -- ALLOW, BLOCK, WARN
          timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,
          UNIQUE(turn_number, orchestrator_id, rule_id)
      );
      
      -- Constraint: TIER-0 immutability
      CREATE TRIGGER tier0_immutability_check
      BEFORE UPDATE ON governance_rules
      WHEN NEW.tier = 0
      BEGIN
          SELECT RAISE(ABORT, 'TIER-0 rule cannot be modified after Turn 1')
          WHERE (SELECT COUNT(*) FROM tier_access_log WHERE rule_id=NEW.id) > 0;
      END;
      
      -- Index for performance
      CREATE INDEX idx_tier_access_turn ON tier_access_log(turn_number);
      CREATE INDEX idx_tier_access_orchestrator ON tier_access_log(orchestrator_id);
    acceptance_tests:
      - "test_tier_access_log_created_per_turn"
      - "test_tier0_immutability_enforced_database_level"
      - "test_tier_access_constraint_prevents_override"
      - "test_tier_access_log_indexes_exist"
    dependencies: "ConversationProtocol, MasterOrchestrator must log tier access"
  
  solution_4:
    id: "SOL-GOV-004"
    title: "Wire TierAccessValidator Into Execution Flow"
    priority: "P0"
    effort_hours: "2-3"
    files_to_modify:
      - "src/core/orchestrator/conversation_protocol.py"
    implementation: |
      Update _validate_governance_before_turn() to use TierAccessValidator:
      
      # Add import
      from src.core.tier_validator import TierAccessValidator, TierAccessEnforcer
      
      # Update validation
      def _validate_governance_before_turn(self) -> Result[bool]:
          # ... existing tier-0 checks ...
          
          # NEW: Wire TierAccessValidator
          validator = TierAccessValidator()
          enforcer = TierAccessEnforcer(validator)
          
          # Validate orchestrator tier access
          result = enforcer.enforce_on_orchestrator(
              orchestrator=self.orchestrator,
              mode="strict"  # Raise exception on tier violation
          )
          
          if not result.is_ok():
              # Record violation in tier_access_log
              self._log_tier_violation(result.unwrap_err())
              return result
          
          return Ok(True)
    acceptance_tests:
      - "test_tier_access_validator_called_per_turn"
      - "test_tier_validator_blocks_undeclared_access"
      - "test_tier_violation_logged_database"
    dependencies: "SOL-GOV-001, SOL-GOV-003"

