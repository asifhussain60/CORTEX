# RISKS, MITIGATIONS, BLOCKERS

risks_and_mitigations:
  
  risk_1_domain_brain_becomes_bottleneck:
    severity: "HIGH"
    description: |
      All 5 components now read from/write to Domain Brain.
      If Domain Brain is slow: entire system slowed.
    
    probability: "MEDIUM (only if no caching)"
    impact: "HIGH (blocks all components)"
    
    mitigation: |
      1. Implement read-through cache (Redis, 5min TTL)
      2. Write operations batched (not per-domain)
      3. Lazy loading (don't load all domains at startup)
      4. Performance benchmarks (< 100ms for 99th percentile)
    
    validation: |
      Load test: 5 components querying simultaneously
      Target: All queries complete < 100ms (with cache)
  
  risk_2_inconsistent_domain_definitions:
    severity: "HIGH"
    description: |
      Multiple sources define same domain differently.
      Example: AST says "authenticate" is function; BKIO says it's business process
    
    probability: "HIGH (likely with manual ingestion)"
    impact: "HIGH (breaks downstream dependencies)"
    
    mitigation: |
      1. Consistency validator enforces schema
      2. Conflict detection: highlight contradictions
      3. LENS resolution: synthesize multiple perspectives
      4. Versioning: track who defined what when
    
    validation: |
      Test: Ingest conflicting domain definitions
      Result: Validator detects, prevents write, suggests resolution
  
  risk_3_legacy_code_still_uses_old_scattered_knowledge:
    severity: "MEDIUM"
    description: |
      After Phase 1-5, old code still expects knowledge in 5 places.
      New components use Domain Brain, but old code doesn't.
      Result: Knowledge duplication during transition.
    
    probability: "HIGH (normal during migration)"
    impact: "MEDIUM (temporary, manageable)"
    
    mitigation: |
      1. Compatibility layer: wrap Domain Brain reads as if from old locations
      2. Deprecation warnings: log when old locations accessed
      3. Phase 6: remove old knowledge sources
      4. Timeline: 2 phase deprecation (warn, then remove)
    
    validation: |
      Phase 5: All components working with Domain Brain
      Phase 6: Old knowledge sources deleted (no regression)
  
  risk_4_multi_writer_conflicts:
    severity: "MEDIUM"
    description: |
      If AST and BKIO write to same domain simultaneously,
      who wins? Potential race condition.
    
    probability: "LOW (orchestrators run sequentially in practice)"
    impact: "MEDIUM (data loss risk)"
    
    mitigation: |
      1. Pessimistic locking: write lock on domain during update
      2. Conflict resolution: LENS detects + merges changes
      3. Queuing: orchestrate writes in sequence
      4. Atomic transactions: write succeeds fully or not at all
    
    validation: |
      Test: 2 components write to same domain
      Result: One succeeds, other queued/fails gracefully
  
  risk_5_schema_becomes_too_rigid:
    severity: "LOW"
    description: |
      If JSON Schema is too strict, adding new domain attributes becomes hard.
      
    probability: "LOW (schema can be versioned)"
    impact: "LOW (versioning handles)"
    
    mitigation: |
      1. Versioning: domain-schema-v1.json, domain-schema-v2.json
      2. Coexistence: v1 and v2 domains can exist simultaneously
      3. Upgrade path: gradual migration from v1 → v2
    
    validation: |
      Test: Add new attribute to domain schema
      Result: New domains use v2, old domains still v1 (no breakage)

blockers:
  - "None identified. Architecture is feasible with current CORTEX components."

