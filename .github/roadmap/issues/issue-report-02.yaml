## PROBLEM STATEMENT

problem_analysis:
  
  issue_1_no_single_source:
    severity: "CRITICAL"
    description: |
      Each component maintains its own knowledge representation.
      No unified schema, no cross-component queries.
    
    example: |
      • Want to ask: "What APIs call authenticate()?"
      • AST knows: function signature + calls
      • Relationship Traversal knows: which endpoints call it
      • Git knows: who changed it last
      • Comments know: WHY authenticate() exists
      
      But CORTEX cannot combine all this into single answer because
      knowledge is stored in 5 different places with 5 different schemas.
    
    impact: "Duplicate scanning, stale knowledge, consistency errors"
  
  issue_2_business_knowledge_homeless:
    severity: "HIGH"
    description: |
      Business knowledge has no home. Proposed ingestion orchestrator
      can scan business documents, but WHERE does it write the output?
      
      • Not Tier 0 (governance, immutable)
      • Not Tier 1 (AC mappings)
      • Not Tier 2 (response templates)
      • Tier 3? But Tier 3 is mostly unstructured "knowledge"
    
    current_tier3_contents: |
      • Knowledge domains (17 directories)
      • Expert registry
      • Auto-indexing
      • No structured schema for business domain knowledge
    
    impact: "Business knowledge orphaned; cannot be queried or versioned"
  
  issue_3_five_sources_not_coordinating:
    severity: "HIGH"
    description: |
      Five knowledge sources operate independently. Result:
      • Duplicate effort (each scans similar code)
      • Inconsistent models (different schemas)
      • No discovery (cannot find related knowledge)
      • Manual integration (humans must connect dots)
    
    example_inconsistency: |
      Scenario: Refactoring database schema
      
      • AST knows: Table references in code
      • Relationships knows: Which services query table
      • Git knows: When table was last changed
      • Comments know: Why table exists
      • Business knows: Which revenue stream depends on table
      
      Without coordination: Each acts independently, misses impact.
      With coordination: Unified view of change impact across business+code.
    
    impact: "Missed insights, duplicate work, poor decision-making"

## SOLUTION: CENTRALIZED DOMAIN BRAIN (Tier 3 Enhancement)

solution_architecture:
  
  central_component:
    name: "Domain Brain"
    location: "cortex-brain/tier3/domain-brain/"
    purpose: |
      Single repository for ALL domain knowledge (business + CORTEX).
      All 5 knowledge sources write here. All components read here.
    
    structure: |
      domain-brain/
      ├── domains/                      # Domain definitions
      │   ├── domain-registry.yaml      # Master domain index
      │   ├── business/                 # Business domains
      │   │   ├── customer-lifecycle.yaml
      │   │   ├── revenue-operations.yaml
      │   │   └── risk-management.yaml
      │   ├── cortex/                   # CORTEX technical domains
      │   │   ├── authentication.yaml
      │   │   ├── api-layer.yaml
      │   │   └── database-layer.yaml
      │   └── mappings/                 # Business ↔ Code mappings
      │       ├── customer_to_apis.yaml
      │       ├── revenue_to_services.yaml
      │       └── impact_chains.yaml
      ├── audit-trail/                  # Immutable change log
      │   ├── domain-updates.log        # SHA-256 hash chain
      │   └── sources.log               # Which component changed what
      ├── schema/
      │   ├── domain-schema.json        # JSON Schema validation
      │   ├── mapping-schema.json
      │   └── constraint-schema.json
      └── api/
          ├── domain_brain_api.py       # Query/write interface
          └── consistency_validator.py  # Schema + conflict checking
  
  five_integration_points:
    
    integration_1_ast_intelligence:
      component: "src/core/intelligence/ast_intelligence.py"
      current: "Builds KnowledgeGraph internally"
      changed_to: |
        • Scans workspace AST (unchanged)
        • Publishes to Domain Brain: cortex/code-structure.yaml
        • Reads from Domain Brain: Existing mappings (for context)
      
      benefit: |
        • AST knowledge becomes queryable by other components
        • Relationship Traversal can enhance with Business context
        • Onboarding Orchestrator can use code structure for tutorials
    
    integration_2_git_history:
      component: "src/core/intelligence/git_history_analyzer.py"
      current: "Analyzes git repo, stores internally"
      changed_to: |
        • Analyzes git history (unchanged)
        • Publishes to Domain Brain: cortex/change-history.yaml
        • Reads: Domain Brain mappings (to correlate with business impact)
      
      benefit: |
        • "When was authenticate() changed?" answers include business impact
        • Git expertise can be correlated with domain expertise
        • Change impact extends across business/code boundary
    
    integration_3_comment_analyzer:
      component: "src/core/intelligence/comment_analyzer.py"
      current: "Extracts comments, stores internally"
      changed_to: |
        • Extracts docstrings & comments (unchanged)
        • Publishes to Domain Brain: cortex/intent-markers.yaml
        • Reads: Business domain definitions (to annotate intent)
      
      benefit: |
        • Technical intent captured in business domain knowledge
        • Comments about revenue logic tagged as "business-critical"
        • Intent Markers become discoverable across system
    
    integration_4_cortex_lens_context_builder:
      component: "src/core/intent/lens_context_builder.py"
      current: "Aggregates sources, generates ComprehensionYAML"
      changed_to: |
        • Aggregates all sources (unchanged)
        • Publishes approved knowledge to Domain Brain via BrainTierPusher
        • Reads from Domain Brain (for context enrichment)
      
      benefit: |
        • All discovered knowledge persisted in Domain Brain
        • Future LENS runs reuse previous discoveries
        • Knowledge accumulates (not discarded after session)
    
    integration_5_business_knowledge_orchestrator:
      component: "[NEW] BusinessKnowledgeIngestionOrchestrator"
      current: "Undefined — proposed in earlier analysis"
      changed_to: |
        • Scans business documents (PDF, YAML, Markdown)
        • Publishes to Domain Brain: business/{domain}.yaml
        • Reads from Domain Brain: Existing business/CORTEX mappings
        • Validates against schema before writing
      
      benefit: |
        • Business knowledge integrated with code knowledge
        • Cross-references maintained (business ↔ code)
        • Impact analysis spans business/code boundary
    
    integration_6_onboarding_orchestrator:
      component: "[FUTURE] OnboardingOrchestrator"
      current: "Not yet designed (PHASE-15+)"
      changed_to: |
        • Reads from Domain Brain (primary data source)
        • Queries: "What does domain X mean? Who's expert? What code?"
        • Publishes workflow metadata to Domain Brain: onboarding/
      
      benefit: |
        • Onboarding uses live knowledge (not stale docs)
        • Expertise automatically discoverable
        • New team members get contextualized domain information

## TIER 3 ENHANCEMENT: Domain Brain Schema

tier3_domain_brain_schema:
  
  master_domain_registry:
    file: "cortex-brain/tier3/domain-brain/domains/domain-registry.yaml"
    purpose: "Master index of all domains (business + CORTEX)"
    
    structure: |
      domain_registry:
        metadata:
          version: "1.0"
          tier: 3
          created_date: "2026-01-16"
          ac_id: "BD-002-01"  # (new AC-ID for this enhancement)
        
        business_domains:
          - domain_id: "customer-lifecycle"
            name: "Customer Lifecycle Management"
            owner: "[domain expert name]"
            description: "Covers customer acquisition, retention, lifecycle stages"
            entities:
              - entity: "customer"
                attributes: ["id", "name", "tier", "ltv", "stage"]
              - entity: "lifecycle-stage"
                attributes: ["stage_id", "name", "business_triggers"]
            code_mappings:
              apis: ["/api/v1/customers", "GET /api/v1/customers/:id"]
              services: ["customer_service", "engagement_service"]
              tables: ["users", "customer_profiles", "lifecycle_events"]
            business_impact: "HIGH"  # Revenue impact
            updated: "2026-01-16T10:30:00Z"
            updated_by: "[orchestrator name]"
            source_ac_id: "BD-002-02"  # Which AC created this
          
          - domain_id: "revenue-operations"
            # ... (similar structure)
        
        cortex_domains:
          - domain_id: "authentication"
            name: "Authentication Layer"
            tier: "cortex"
            components:
              - name: "authenticate()"
                file: "src/auth/oauth.py"
                type: "function"
                calls: ["validate_request", "fetch_token", "cache_token"]
              - name: "OAuthProvider"
                file: "src/auth/oauth.py"
                type: "class"
                methods: ["authenticate", "refresh", "revoke"]
            related_business_domains: ["customer-lifecycle", "security"]
            updated: "2026-01-16T10:25:00Z"
            updated_by: "[component name]"
            source_ac_id: "IR-001-01"  # Which AC created this
        
        mappings:
          business_to_code:
            - mapping_id: "customer_to_auth"
              description: "Customers are authenticated via OAuthProvider"
              business_entity: "customer"
              code_entity: "authentication"
              relationship: "customers use authenticate() to login"
              impact_chain: "Customer auth failure → Revenue loss"
          
          code_to_business:
            - mapping_id: "auth_to_customer_impact"
              description: "Auth changes affect customer experience"
              code_entity: "authentication.OAuthProvider"
              business_entity: "customer-lifecycle"
              change_impact: |
                If OAuthProvider.authenticate() changes:
                • Customer login experience affected
                • Lifecycle stage transitions may fail
                • Revenue at risk if customers cannot login
  
  audit_trail_format:
    file: "cortex-brain/tier3/domain-brain/audit-trail/domain-updates.log"
    purpose: "Immutable audit trail (SHA-256 hash chain)"
    
    format: |
      [TIMESTAMP] [SOURCE] [DOMAIN_ID] [OPERATION] [HASH] [AC_ID]
      2026-01-16T10:30:00Z AST customer-lifecycle CREATE a1b2c3d4e5f6... IR-001-01
      2026-01-16T10:30:05Z GIT customer-lifecycle UPDATE f6e5d4c3b2a1... IR-001-02
      2026-01-16T10:30:10Z COMMENT authenticate ANNOTATE 1f2e3d4c5b6a... IR-001-03
      2026-01-16T10:30:15Z BKIO revenue-operations CREATE 6a5b4c3d2e1f... BD-002-02
      
    validation:
      • Each hash includes: timestamp + source + domain + operation + payload
      • Chain hash = SHA256(previous_hash + current_entry)
      • Tampering detected: chain hash breaks (auditable security)
      • Rollback: revert to any previous state via git checkpoint
  
  consistency_validation:
    file: "cortex-brain/tier3/domain-brain/api/consistency_validator.py"
    purpose: "Enforce schema + detect conflicts before any write"
    
    checks: |
      1. JSON Schema validation (domain-schema.json)
         • All required fields present
         • Types correct (string, array, number)
         • Constraints satisfied (min/max lengths, patterns)
      
      2. Referential integrity
         • Business domain references valid code entities
         • Code entities reference known services/tables
         • No orphaned mappings
      
      3. Conflict detection
         • If domain definition changes: detect breaking changes
         • Warn: "This change affects X code entities"
         • Require: Human approval for breaking changes
      
      4. Cardinality checks
         • One customer can have many lifecycle stages ✓
         • One service cannot serve multiple customers? ✗ (business violation)

## OPERATIONAL MODEL: How Components Interact

operational_flow:
  
  scenario_1_ast_ingestion:
    name: "AST Intelligence publishes code structure"
    steps:
      - step: "AST scans workspace (unchanged)"
        action: "Find authenticate() function in src/auth/oauth.py"
      
      - step: "AST publishes to Domain Brain"
        action: |
          domain_brain_api.upsert_domain(
            domain_id="authentication",
            entity_type="function",
            entity_name="authenticate",
            attributes={...},
            source="AST",
            ac_id="IR-001-01"
          )
      
      - step: "Consistency validator checks"
        action: |
          • Validate against cortex-schema.json
          • Check: does "authentication" domain exist? YES
          • Check: are attributes correct type? YES
          • Approve: write to domain-registry.yaml
      
      - step: "Write to audit trail"
        action: |
          [2026-01-16T10:30:00Z] AST authenticate UPDATE a1b2c3d4... IR-001-01
          (chain hash computed)
  
  scenario_2_relationship_enrichment:
    name: "Relationship Traversal reads AST, enriches with business context"
    steps:
      - step: "Relationship Traversal reads from Domain Brain"
        action: |
          domains = domain_brain_api.query_domain("authentication")
          # Gets: authenticate() function definition
      
      - step: "Relationship Traversal scans code"
        action: |
          Find: authenticate() called by /api/v1/auth/login
          Find: API endpoint tied to business domain "customer-lifecycle"
      
      - step: "Relationship Traversal publishes enrichment"
        action: |
          domain_brain_api.add_mapping(
            mapping_id="auth_to_customer_impact",
            from_entity="authentication",
            to_entity="customer-lifecycle",
            relationship="auth enables customer login",
            source="RELATIONSHIPS",
            ac_id="IR-001-04"
          )
      
      - step: "Audit trail updated"
        action: |
          [2026-01-16T10:31:00Z] RELATIONSHIPS customer-lifecycle UPDATE b2c3d4... IR-001-04
  
  scenario_3_business_ingestion:
    name: "Business Knowledge Ingestion Orchestrator ingests business docs"
    steps:
      - step: "BKIO scans business documents"
        action: |
          Find: revenue-operations domain in business spec PDF
          Extract: Product SKU, pricing rules, margin targets
      
      - step: "BKIO validates against schema"
        action: |
          consistency_validator.validate_business_domain({
            domain_id: "revenue-operations",
            entities: [...],
            attributes: [...]
          })
          Result: ✓ VALID or ✗ INVALID (show errors)
      
      - step: "BKIO requests human approval"
        action: |
          Display: "Found revenue-operations domain. Approve? [Y/N]"
          Human reviews extracted knowledge, approves
      
      - step: "BKIO publishes to Domain Brain"
        action: |
          domain_brain_api.upsert_domain(
            domain_id="revenue-operations",
            business_domain=true,
            entities=[...],
            source="BKIO",
            ac_id="BD-002-02",
            approved_by="[human]"
          )
      
      - step: "Audit trail + approval recorded"
        action: |
          [2026-01-16T10:32:00Z] BKIO revenue-operations CREATE c3d4e5... BD-002-02
          approval_trail: approved_by=alice, timestamp=2026-01-16T10:32:00Z
  
  scenario_4_lens_synthesis:
    name: "LENS context builder aggregates all sources + publishes"
    steps:
      - step: "LENS runs (unchanged)"
        action: "Aggregate AST + Git + Comments + Relationships"
      
      - step: "LENS reads Domain Brain for context"
        action: |
          domains = domain_brain_api.query_all()
          mappings = domain_brain_api.query_mappings()
          # Use to enrich synthesis
      
      - step: "LENS generates Comprehension YAML"
        action: |
          Create holistic understanding incorporating:
          • Code structure (from Domain Brain)
          • Business context (from Domain Brain)
          • Change history (from Domain Brain)
          • Intent (from Domain Brain annotations)
      
      - step: "User approves Comprehension YAML"
        action: "User reviews, requests refinements if needed"
      
      - step: "LENS publishes approved knowledge to Domain Brain"
        action: |
          brain_tier_pusher.push_to_tier(
            comprehension=approved_yaml,
            target_domain="[appropriate business or code domain]",
            source="LENS",
            ac_id="IR-004-02"
          )
      
      - step: "Audit trail: LENS contribution recorded"
        action: |
          [2026-01-16T10:33:00Z] LENS customer-lifecycle UPDATE d4e5f6... IR-004-02

