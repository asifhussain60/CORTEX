    impact:
      regression_risk: "Changes may break untested paths"
    
    remediation:
      effort: "8h"
      approach: |
        1. Run pytest --cov
        2. Identify uncovered critical paths
        3. Target 80% for core modules
      ac_id_suggested: "AC-FIX-006-01"

  # ---------------------------------------------------------------------------
  # FINDING-007: MEDIUM - No Database Migration Framework
  # ---------------------------------------------------------------------------
  - id: "FINDING-007"
    agent: "cortex-review-brittleness"
    severity: "LOW"
    category: "database"
    
    title: "Database schema lacks migration strategy"
    description: |
      governance.db has 7 tables but no versioning or migration framework.
      Future schema changes will require manual migration.
    
    evidence:
      source: "schema_analysis"
      tables:
        - ac_index
        - audit_log
        - phase_locks
        - boundary_violations
        - sandbox_executions
        - hallucination_incidents
    
    remediation:
