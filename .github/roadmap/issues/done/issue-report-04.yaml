findings:

  # ---------------------------------------------------------------------------
  # FINDING-001: CRITICAL - Bare Except Clauses
  # ---------------------------------------------------------------------------
  - id: "FINDING-001"
    agent: "cortex-review-brittleness"
    severity: "CRITICAL"
    category: "error_handling"
    rule_violated: "CORE-013"
    
    title: "Bare except clauses in production code"
    description: |
      Three files contain bare 'except:' clauses which violate CORE-013.
      These catch all exceptions including KeyboardInterrupt and SystemExit,
      making debugging difficult and potentially masking critical errors.
    
    evidence:
      source: "grep_search"
      command: "grep -rn 'except:' --include='*.py' src/"
      files_affected:
        - file: "src/core/audit_required_validator.py"
          lines: [160, 425]
        - file: "src/ci_cd/compliance_gate.py"
          lines: [184]
    
    impact:
      production_risk: "Silent exception swallowing masks errors"
      debugging_difficulty: "Stack traces lost, root cause hidden"
      data_integrity: "Potential silent data corruption"
    
    remediation:
      effort: "2h"
      approach: |
        1. Replace bare except with specific exception types
        2. Add logging for caught exceptions
        3. Re-raise or handle appropriately
      test_required: true
      ac_id_suggested: "AC-FIX-001-01"
    
    traceability:
      related_rules: ["CORE-013"]
      phase_affected: "ALL"
      blocking: true

  # ---------------------------------------------------------------------------
  # FINDING-002: CRITICAL - Hardcoded Paths in Tests
  # ---------------------------------------------------------------------------
  - id: "FINDING-002"
    agent: "cortex-review-assumptions"
    severity: "CRITICAL"
    category: "platform"
    rule_violated: "CORE-005"
    
    title: "Hardcoded absolute paths in test files"
    description: |
      18 instances of hardcoded /Users/asifhussain/PROJECTS/CORTEX paths
      found in test files. These will fail on any other machine or CI/CD.
    
    evidence:
      source: "grep_search"
      command: "grep -rn '/Users/' --include='*.py' tests/"
      files_affected:
        - file: "tests/unit/tier3/test_auto_indexing.py"
          lines: [58, 64, 72, 85, 95, 105, 119, 133, 145, 163, 177, 191, 209, 226, 245, 313, 325]
          count: 17
        - file: "tests/unit/core/intent/test_intent_reflection_protocol.py"
          lines: [47]
          count: 1
    
    impact:
      ci_cd_failure: "Tests will fail on CI/CD systems"
      developer_portability: "New developers cannot run tests"
      cross_platform: "Windows/Linux environments broken"
    
    remediation:
      effort: "4h"
      approach: |
        1. Replace hardcoded paths with Path(__file__).parent patterns
        2. Use get_project_root() from path_resolver
        3. Add CI validation to prevent future occurrences
      test_required: true
      ac_id_suggested: "AC-FIX-002-01"
    
    traceability:
      related_rules: ["CORE-005"]
      phase_affected: "ALL"
      blocking: true

  # ---------------------------------------------------------------------------
  # FINDING-003: HIGH - Incomplete Audit Trail
  # ---------------------------------------------------------------------------
  - id: "FINDING-003"
    agent: "cortex-review-governance"
    severity: "HIGH"
    category: "audit_trail"
    rule_violated: "CORE-027"
    
    title: "17 AC executions failed without documented resolution"
    description: |
      The audit log contains 17 AC_EXECUTE_FAILED entries that lack
      corresponding resolution documentation. Per CORE-027, every AC
      should have a complete lifecycle trail.
    
    evidence:
      source: "audit_query"
      query: "SELECT operation, COUNT(*) FROM audit_log WHERE operation = 'AC_EXECUTE_FAILED'"
      result: "17 failed executions"
    
    impact:
      audit_completeness: "Phase validation may be compromised"
      compliance: "Inaccurate completion metrics"
    
    remediation:
      effort: "2h"
      approach: |
        1. Query all AC_EXECUTE_FAILED entries
        2. Investigate each failure
        3. Add AC_RESOLVED or AC_DEFERRED entries
      ac_id_suggested: "AC-FIX-003-01"
    
    traceability:
      related_rules: ["CORE-027"]
      phase_affected: "Multiple"

  # ---------------------------------------------------------------------------
  # FINDING-004: HIGH - Platform Assumptions
  # ---------------------------------------------------------------------------
  - id: "FINDING-004"
    agent: "cortex-review-assumptions"
    severity: "HIGH"
    category: "platform"
    
    title: "Unix-specific code without Windows fallback"
    description: |
      File locking uses fcntl which is Unix-only. While CrossPlatformFileLock
      exists, verification needed that all lock usage goes through it.
    
    evidence:
      source: "code_analysis"
      files_to_verify:
        - "src/infrastructure/audit_logger.py"
        - "src/core/database/state_manager.py"
    
    impact:
      windows_compatibility: "May fail on Windows"
      ci_cd: "Linux CI may have different behavior"
    
    remediation:
      effort: "4h"
      approach: |
        1. Audit all file locking code
        2. Ensure CrossPlatformFileLock is used everywhere
        3. Add Windows test in CI
      ac_id_suggested: "AC-FIX-004-01"

  # ---------------------------------------------------------------------------
  # FINDING-005: MEDIUM - Technical Debt Markers
  # ---------------------------------------------------------------------------
  - id: "FINDING-005"
    agent: "cortex-review-debt"
    severity: "MEDIUM"
    category: "debt"
    
    title: "17 TODO/FIXME/HACK comments in source code"
    description: |
      Source code contains 17 technical debt markers. Most are legitimate
      pattern matching code in comment_analyzer.py, but some may be actual
      deferred work items.
    
    evidence:
      source: "grep_search"
      command: "grep -rn 'TODO|FIXME|HACK|XXX' --include='*.py' src/"
      count: 17
    
    impact:
      maintenance: "Accumulated debt slows development"
      clarity: "Hard to distinguish real TODOs"
    
    remediation:
      effort: "2h"
      approach: |
        1. Audit each marker for validity
        2. Convert actionable items to issues
        3. Remove resolved comments

  # ---------------------------------------------------------------------------
  # FINDING-006: MEDIUM - Test Coverage Unknown
  # ---------------------------------------------------------------------------
  - id: "FINDING-006"
    agent: "cortex-review-debt"
    severity: "MEDIUM"
    category: "test"
    
    title: "Test coverage percentage not measured"
    description: |
      3262 tests exist but actual code coverage is not measured.
      Critical paths may have coverage gaps.
    
    evidence:
      source: "test_analysis"
