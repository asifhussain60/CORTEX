# ============================================================================
# CRITICAL FINDING: INTENT ROUTER NOT EXECUTING
# ============================================================================

critical_finding_intent_router:
  title: "Intent Router Missing User Intent Display & Confirmation Gate"
  severity: CRITICAL
  status: OPEN
  discovered_date: 2026-01-16
  description: |
    Investigation reveals the Intent Router (LENS protocol with Intent Reflection
    Engine) is NOT executing. Components exist in codebase but are not wired into
    chat response flow. This is a REGRESSION from CORTEX5.5 where it worked.
    
    Symptoms:
    1. User intent is NOT canonicalized and displayed
    2. Comprehension YAML is NOT presented
    3. Challenges and recommendations are NOT shown
    4. Clarification questions are NOT asked when confidence < 0.85
    5. User approval gate is BYPASSED
    6. Execution happens WITHOUT user confirmation

  root_causes:
    - cause_1: |
        Chat interface does NOT invoke IntentReflectionEngine.
        Missing code path that should:
        1. Create ReflectionRequest from user message
        2. Call IntentReflectionEngine.reflect()
        3. Get ReflectionResponse with comprehension_yaml
        4. Present via UserApprovalGate.present_comprehension()
        5. Wait for user approval before execution
    
    - cause_2: |
        System prompt doesn't mandate Intent Router invocation.
        CORTEX.prompt.md documents LENS protocol (§ Intent Router section)
        but system prompt doesn't contain execution instruction.
        No "@invoke IntentReflectionEngine" anywhere in flow.
    
    - cause_3: |
        AST intelligence not instantiated during reflection.
        IntentReflectionEngine.reflect() is incomplete:
        - ✓ Language parsing works
        - ✗ Examination (AST analysis) NOT done
        - ✓ Navigation (git history) partially done
        - ✗ Synthesis (relationships) incomplete
        
        Missing instantiations:
        - ASTIntelligenceEngine (exists: 219 lines, unused)
        - CallGraphBuilder (exists: 345 lines, unused)
        - DependencyMapper (exists: 312 lines, unused)
        - PatternDetector (exists: 280+ lines, unused)

  implementation_status:
    components_built_and_tested: |
      ✓ IntentReflectionEngine (src/core/intent/intent_reflection_protocol.py)
      ✓ IntentCanonicalizer (src/core/intent/intent_canonicalizer.py)
      ✓ ComprehensionLoop (src/core/intent/comprehension_loop.py)
      ✓ UserApprovalGate (src/core/intent/comprehension_loop.py lines 299-340)
      ✓ ChallengeGenerator (src/core/intent/challenge_generator.py)
      ✓ ComprehensionYAML (src/core/intent/comprehension_yaml.py)
      
      Tests PASS: tests/unit/core/intent/test_intent_reflection_protocol.py (600+ lines)
      - TestUserConfirmationGate: PASS
      - TestRecommendationGeneration: PASS
      - TestAuditTrail: PASS
      
      Architecture documented: 
      - phase-07-intent-router.yaml (IR-005-01 COMPLETED)
      - INTENT-CLARIFICATION-CONFIRMATION.md (CONFIRMED)
    
    components_not_wired: |
      ✗ No chat interface wrapper calls IntentReflectionEngine
      ✗ No orchestrator invokes reflection during response generation
      ✗ No code path reaches UserApprovalGate.present_comprehension()
      ✗ No mechanism waits for user approval before execution
      ✗ Result: Intent Router exists but is DEAD CODE

  evidence:
    - title: "Functional Tests Prove Intent Router Works"
      location: "tests/unit/core/intent/test_intent_reflection_protocol.py"
      lines: "330-400, 289-330, 500-550"
      excerpt: |
        class TestUserConfirmationGate:
            def test_comprehension_yaml_for_user_approval(self):
                """Response should include comprehension YAML for user approval."""
                response = reflection_engine.reflect(request)
                assert response.comprehension_yaml is not None  # ✓ PASSES
                
            def test_reflection_status_needs_confirmation(self):
                """Status should indicate if confirmation needed."""
                response = reflection_engine.reflect(request)
                assert response.status in [
                    ReflectionStatus.APPROVED,
                    ReflectionStatus.PENDING_CONFIRMATION,  # ✓ PASSES
                    ReflectionStatus.NEEDS_CLARIFICATION,
                ]
    
    - title: "Architecture Designed But Not Invoked"
      location: |
        - phase-07-intent-router.yaml (IR-005-01)
        - INTENT-CLARIFICATION-CONFIRMATION.md (§ Interaction Orchestrator)
      excerpt: |
        STAGE 1: INTENT COMPREHENSION (InteractionOrchestrator)
        ├─ Master orchestrator intercepts ALL user requests ← NOT HAPPENING
        ├─ Master delegates to Interaction orchestrator ← NOT HAPPENING
        ├─ Interaction builds holistic context from LENS protocol ← NOT HAPPENING
        ├─ Interaction generates intent reflection ← NOT HAPPENING
        └─ Reflection PRESENTED TO USER FOR APPROVAL ← NOT HAPPENING
    
    - title: "System Prompt Documents But Doesn't Execute"
      location: "CORTEX.prompt.md"
      lines: "85-350"
      excerpt: |
        ## Master Orchestrator Pattern
        | Stage | What You Do | Tools/Sources |
        | **1. Comprehension** | Build complete understanding of intent + context | LENS protocol |
        | **4. Approval** | Present for user confirmation BEFORE execution | Comprehension YAML |
        
        [Documents full LENS protocol with examples]
        [Shows comprehension YAML format]
        [Explains approval gate pattern]
        
        ← But NO INSTRUCTION to actually invoke IntentReflectionEngine

  comparison_cortex5_5_vs_cortex6:
    cortex5_5_pattern: |
      ✓ User message
      ✓ Master Orchestrator invokes IntentReflectionEngine
      ✓ LENS protocol runs (Language → Examination → Navigation → Synthesis)
      ✓ Comprehension YAML generated with:
        - Canonicalized intent
        - Challenges & risks identified
        - Recommendations provided
        - Clarification questions (if confidence < 0.85)
      ✓ Present to user via UserApprovalGate
      ✓ Wait for: APPROVED | REJECTED | CLARIFICATION_REQUEST
      ✓ If APPROVED → set ready_for_execution = true
      ✓ Only then → proceed to specialized orchestrator (Planning, TDD, etc.)
      
      Result: User sees intent, understands risks, confirms before action ✅
    
    cortex6_actual_pattern: |
      ✗ User message
      ✗ [MISSING] Master Orchestrator should invoke IntentReflectionEngine
      ✗ [MISSING] LENS protocol not run
      ✗ [MISSING] Comprehension YAML never generated
      ✗ [MISSING] Challenges not identified
      ✗ [MISSING] Clarification questions not asked
      ✗ [MISSING] UserApprovalGate never called
      ✗ Jump directly to execution WITHOUT confirmation
      
      Result: User doesn't see intent, can't confirm, no governance ❌

  impact:
    user_experience: |
      - No transparency: User can't see what system understood
      - No control: User can't confirm/reject before execution
      - No safety: High-risk decisions happen silently
      - No governance: CORE rules not visible in decision process
    
    architecture: |
      - Intent Router is DEAD CODE (implemented but unused)
      - Master Orchestrator violates its own design (supposed to use Intent Router)
      - CORTEX.prompt.md is ASPIRATIONAL (documents Intent Router but doesn't use it)
      - System behaves like generic assistant, not governance-aware orchestrator
    
    governance: |
      - CORTEX.prompt.md § Master Orchestrator Pattern: VIOLATED
        (Stage 1 Comprehension never invoked)
      - CORTEX.prompt.md § Stage 4 Approval: VIOLATED
        (User confirmation gate bypassed)
      - phase-07-intent-router.yaml IR-005-01: INCOMPLETE
        (Architecture designed but not wired in)

  required_fixes:
    fix_1: |
      FIX-001 (P0): Wire IntentReflectionEngine into Chat Response Flow
      
      Create ChatWithIntentRouter wrapper that on EVERY message:
      1. Call IntentReflectionEngine.reflect(ReflectionRequest)
      2. Receive ReflectionResponse with comprehension_yaml
      3. If status == PENDING_CONFIRMATION:
         → Present comprehension_yaml to user
         → Show challenges and recommendations
         → Ask clarification questions if needed
         → Return WAITING FOR USER APPROVAL
      4. Store response in session
      5. On next turn, check if user approved
      6. If APPROVED: execute with ready_for_execution = true
      7. If REJECTED/CLARIFY: loop back to step 1
      
      Implementation: Create src/core/chat_intent_router.py (4-6 hours)
    
    fix_2: |
      FIX-002 (P0): Update System Prompt to Mandate Intent Router
      
      Add to CORTEX.prompt.md execution section:
      
      "MANDATORY: On EVERY user request:
      1. Invoke IntentReflectionEngine.reflect()
      2. Present comprehension YAML for user approval
      3. Ask clarification questions if confidence < 0.85
      4. DO NOT execute until user confirms
      5. Only after APPROVED status → route to specialized orchestrator"
      
      Implementation: Update .github/prompts/CORTEX.prompt.md (1-2 hours)
    
    fix_3: |
      FIX-003 (P1): Integrate AST Intelligence into Reflection
      
      Modify IntentReflectionEngine.reflect() to invoke:
      - ASTIntelligenceEngine for code analysis
      - CallGraphBuilder for dependency mapping
      - DependencyMapper for import analysis
      - PatternDetector for architectural patterns
      
      Complete LENS Step 2: Examination (currently missing)
      
      Implementation: Update src/core/intent/intent_reflection_protocol.py (3-4 hours)
    
    fix_4: |
      FIX-004 (P1): Add Multi-Turn Approval Workflow
      
      Implement approval workflow supporting:
      - Turn N: System presents comprehension + questions
      - Turn N+1: User responds with: APPROVE | REJECT | ASK_CLARIFICATION
      - Turn N+2 (if clarify): Loop back to comprehension with new context
      - Turn N+3 (if approve): Execute with ready_for_execution = true
      
      Implementation: Update chat interface integration (6-8 hours)

