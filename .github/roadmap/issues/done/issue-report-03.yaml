# ============================================================================
# PROPOSED SOLUTIONS
# ============================================================================

solutions:
  - solution_id: SOL-001
    title: "P1 - Update Copilot System Prompt (1 hour)"
    priority: P1
    effort_hours: 1
    description: |
      Modify GitHub Copilot system prompt to enforce CORTEX guidelines:
      - Add STRICT communication style rules
      - Forbid process narration ("Let me...", "I will...")
      - Enforce 500-word limit for simple queries
      - Disable emoji/ASCII art
      - One explanation per concept maximum
    
    implementation: |
      Update system prompt sections:
      1. Add "COMMUNICATION STYLE (STRICT)" section with hard limits
      2. Add "VERBOSITY RULES" with word count enforcement
      3. Add "FORBIDDEN PHRASES" (Let me, I will, Perfect, Excellent, etc.)
      4. Add "RESPONSE STRUCTURE" (result first, justification second)
    
    testing: |
      - Run 10 test queries
      - Measure word count (< 500 for simple)
      - Check for forbidden phrases (grep)
      - Verify no repetition
    
    blocking_issues: []
    depends_on: []

  - solution_id: SOL-002
    title: "P2 - Add Chat Response Header Wrapper (2 hours)"
    priority: P2
    effort_hours: 2
    description: |
      Create ChatResponseFormatter wrapper that injects headers into all
      Copilot responses without modifying Copilot itself.
      
      Location: src/core/chat_response_formatter.py
      
      Features:
      - Wraps response before display
      - Injects CORTEX header (## 🧠 CORTEX ...)
      - Injects copyright notice
      - Validates header compliance
      - Logs missing headers for audit
    
    implementation: |
      class ChatResponseFormatter:
          @staticmethod
          def format_response(response: str, operation: str, orchestrator: str) -> str:
              """Add CORTEX headers to response"""
              header = f"## 🧠 CORTEX {operation}\\n..."
              copyright = "**Copyright © 2025-2026 Asif Hussain. All rights reserved.**"
              return f"{header}\\n\\n{copyright}\\n\\n{response}"
    
    testing: |
      - Unit tests for header injection
      - Integration test with Copilot responses
      - Verify copyright appears in all outputs
      - Test variable substitution ({operation}, {orchestrator})
    
    blocking_issues: []
    depends_on: []

  - solution_id: SOL-003
    title: "P3 - Add Governance Rule (1 hour)"
    priority: P3
    effort_hours: 1
    description: |
      Create INTERACTION-VERBOSITY-001 rule in governance framework
      to enforce response length limits and prevent future violations.
      
      Location: cortex-brain/tier0/governance/interaction-rules.yaml
      
      Rules:
      - simple_query_max_lines: 10
      - complex_query_max_lines: 30
      - hide_internal_process: true
      - no_repetitive_explanations: true
      - audit_missing_headers: true
    
    implementation: |
      Add YAML rule with enforcement configuration:
      - enabled: true
      - log_violations: true
      - warn_on_excess: 500 words
      - fail_on_excess: 5000 words
    
    testing: |
      - Verify rule loads correctly
      - Test violation detection
      - Check audit logging
      - Verify compliance matrix
    
    blocking_issues: []
    depends_on: []

  - solution_id: SOL-004
    title: "P4 - Create ChatOrchestrator (Future: 1 day)"
    priority: P4
    effort_hours: 8
    description: |
      Full architectural integration: ChatOrchestrator wraps Copilot
      responses and routes through complete CORTEX processing pipeline.
      
      Features:
      - Extends IOrchestrator interface
      - Routes through ResponseHeaderInjector
      - Stores audit trail of interactions
      - Applies governance validation
      - Enables full compliance checking
    
    implementation: |
      New class: src/orchestrators/adaptive/chat_orchestrator.py
      - Implements IOrchestrator
      - Composition pattern (wraps ChatResponder)
      - Enforces header injection
      - Tracks audit trail
      - Validates governance rules
    
    testing: |
      - Full orchestrator test suite
      - Audit trail verification
      - Header injection validation
      - Governance compliance tests
    
    blocking_issues: []
    depends_on: ["SOL-002"]

