# ============================================================================
# CRITICAL ISSUE 1: AST SCANNING NOT USED
# ============================================================================
critical_issue_1:
  id: "CRIT-001"
  title: "AST Scanning Completely Bypassed - No Deep Context Analysis"
  severity: "CRITICAL"
  category: "architectural"
  
  description: |
    The Intent Router was supposed to use CORTEX LENS Protocol including 
    AST-based code intelligence, but the analysis shows:
    
    - NO usage of ASTIntelligenceEngine
    - NO call graph analysis (CallGraphBuilder)
    - NO dependency mapping (DependencyMapper)
    - NO pattern detection (PatternDetector)
    - NO relationship traversal across layers
    
    Instead, the response relied on file/folder searches without building
    a deep understanding of code relationships and dependencies.
  
  expected_behavior: |
    For EVERY user request, the Interaction Orchestrator should:
    
    1. LENS Protocol - Language Phase:
       - Parse canonicalized intent from natural language
       - Identify target files/modules to analyze
    
    2. LENS Protocol - Examination Phase (AST SCANNING):
       - Parse target files using ASTIntelligenceEngine
       - Extract function/class signatures, parameters, return types
       - Detect patterns (singleton, factory, decorator, etc.)
       - Map class hierarchies and base classes
       - Identify architectural patterns (MVC, layered, service-based)
    
    3. LENS Protocol - Navigation Phase:
       - Build call graph using CallGraphBuilder
       - Trace function calls across layers (UI → Service → Repository)
       - Identify transitive dependencies (3+ levels deep)
       - Map database relationships
       - Track data flow through the system
    
    4. LENS Protocol - Synthesis Phase:
       - Build DependencyMap to classify imports
       - Analyze PatternDetector results
       - Create comprehensive impact map
       - Identify test coverage gaps
       - Present holistic context YAML for approval
  
  actual_behavior: |
    First request (Turn 1):
    - Ran filesystem searches for "vacuum" references
    - Checked file existence and counts
    - Did NOT parse files with AST
    - Did NOT build call graphs
    - Did NOT trace layer-to-layer relationships
    - Did NOT create deep dependency understanding
    
    Subsequent requests (Turns 2-4):
    - Skipped comprehension entirely
    - No AST scanning attempted
    - No context gathering shown
    - Direct execution without approval gates
  
  evidence:
    chat01_search_operations: |
      - grep_search for "vacuum.*orchestrator" ✓
      - file_search for "**/vacuum*.py" ✓
      - read_file on multiple files ✓
      - BUT: No ASTIntelligenceEngine.parse_file() calls
      - BUT: No CallGraphBuilder instantiation
      - BUT: No DependencyMapper usage
      - BUT: No PatternDetector.detect_patterns() calls
    
    available_tools_not_used:
      - src/core/intelligence/ast_intelligence.py (219 lines, 67 usages in tests)
      - src/core/intelligence/call_graph.py (345 lines, 0 usages in orchestrators)
      - src/core/intelligence/dependency_mapper.py (312 lines, 0 usages in orchestrators)
      - src/core/intelligence/pattern_detector.py (280+ lines, 0 usages in orchestrators)
    
    cortex_prompt_reference: |
      CORTEX.prompt.md § Intent Router (LENS Protocol):
      - Step 2: Examination (AST Analysis) - NOT DONE
      - Step 3: Navigation (Git History) - PARTIALLY DONE
      - Step 5: Relationship Traversal - NOT DONE
      - Step 6: Synthesis into Holistic Context - INCOMPLETE
  
  impact: |
    The Intent Router cannot fulfill its core function of building holistic
    context without AST scanning. This means:
    
    1. No deep understanding of code relationships
    2. No impact analysis when changes are made
    3. No test gap detection
    4. No architectural pattern understanding
    5. No layer-to-layer trace capability
    6. Governance rules enforced blindly without context
    
    Result: System behaves like a generic code assistant, not a governance-aware
    orchestrator that understands the codebase deeply.
  
  required_implementation: |
    The Interaction Orchestrator must:
    
    1. Instantiate ASTIntelligenceEngine on every request
    2. Parse target files specified in user request
    3. Build CallGraph from parsed AST
    4. Create DependencyMap for import analysis
    5. Run PatternDetector for architectural patterns
    6. Perform transitive dependency tracing (3+ levels)
    7. Create impact map showing what breaks if changed
    8. Present holistic context YAML before execution
    
    Example pattern (should be on EVERY turn):
    ```python
    # In InteractionOrchestrator.comprehend_request()
    engine = ASTIntelligenceEngine(enable_cache=True)
    
    # Parse target files
    for target_file in identified_targets:
        parse_result = engine.parse_file(target_file)
        if parse_result.success:
            # Build call graph
            call_graph = CallGraphBuilder.build_from_parse_result(parse_result)
            
            # Map dependencies
            dep_map = DependencyMapper.create_from_parse_result(parse_result)
            
            # Detect patterns
            patterns = PatternDetector.detect_patterns(parse_result)
            
            # Trace relationships
            impact = self.calculate_impact(parse_result, call_graph, dep_map)
    
    # Present holistic context
    return self.present_comprehension_for_approval(
        parsed_files=parse_results,
        call_graphs=call_graphs,
        dependencies=dep_maps,
        patterns=patterns,
        impact=impact_map
    )
    ```
  
  enforcement:
    rule_violation: "CORTEX.prompt.md § LENS Protocol (all 6 steps)"
    governance_rule: "CORE-019 (TDD-Master routing should include comprehension)"
    severity_level: "BLOCKED - Cannot proceed without AST scanning"

# ============================================================================
# CRITICAL ISSUE 2: INTENT ROUTER BYPASSED AFTER FIRST REQUEST
# ============================================================================
critical_issue_2:
  id: "CRIT-002"
  title: "Intent Router Only Executed Once - Lost Continuous Pattern"
  severity: "CRITICAL"
  category: "architectural"
  
  description: |
    The Intent Router was designed to analyze EVERY user request through
    the LENS protocol, but in chat01.md it only ran once (Turn 1).
    
    Subsequent requests (Turns 2-4) bypassed the Intent Router entirely
    and jumped directly to execution without user approval.
  
  expected_pattern: |
    Per CORTEX.prompt.md § Master Orchestrator Pattern:
    
    EVERY user request should follow:
    - STAGE 1: INTENT COMPREHENSION (LENS protocol)
    - STAGE 2: INTENT ROUTING (determine which orchestrator)
    - STAGE 3: KNOWLEDGE INTEGRATION (load governance rules)
    - STAGE 4: APPROVAL GATE (present to user for confirmation)
    
    ```
    Turn 1: [LENS] → [Route] → [Integrate] → [Approve] → [Execute]
    Turn 2: [LENS] → [Route] → [Integrate] → [Approve] → [Execute]
    Turn 3: [LENS] → [Route] → [Integrate] → [Approve] → [Execute]
    Turn 4: [LENS] → [Route] → [Integrate] → [Approve] → [Execute]
    ```
  
  actual_pattern: |
    ```
    Turn 1: [LENS] → [Route] → [Integrate] → [Approve] → [Execute] ✓
    Turn 2: ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → [Execute]
    Turn 3: ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → [Execute]
    Turn 4: ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → ✗ SKIPPED → [Execute]
    ```
  
  governance_violations:
    - violation_1: "CORE-017 (Strict Governance Enforcement) - Not enforced on subsequent turns"
    - violation_2: "CORE-019 (TDD-Master routing) - Should include comprehension on every request"
    - violation_3: "CORTEX.prompt.md - 4 stages should execute on every turn"
  
  impact: |
    - Lost holistic context analysis after first request
    - No approval gates for subsequent operations
    - Governance rules not re-evaluated for each request
    - Decisions made without comprehensive understanding
    - Risk of unintended side effects

# ============================================================================
# CRITICAL ISSUE 3: INTERACTION ORCHESTRATOR NOT CONTINUOUS
# ============================================================================
critical_issue_3:
  id: "CRIT-003"
  title: "Interaction Orchestrator Should Be Persistent Middleware"
  severity: "CRITICAL"
  category: "architectural"
  
  description: |
    The Interaction Orchestrator should wrap EVERY orchestrator call,
    providing continuous comprehension and approval workflow. Instead,
    it was treated as a one-time analyzer.
  
  required_pattern: |
    The Interaction Orchestrator should:
    
    1. Intercept EVERY user message (not just initial requests)
    2. Run LENS protocol on the message
    3. Build holistic context
    4. Present comprehension YAML for user approval
    5. Only proceed when user confirms
    6. Maintain state across conversation turns
    7. Be used by Planning, TDD, API, and all other orchestrators
    
    This prevents "wheel reinvention" by ensuring all orchestrators
    use the same comprehension/approval workflow.
  
  current_issue: |
    The Interaction Orchestrator:
    - Was called once at the beginning
    - Never called again for subsequent turns
    - No state maintained between turns
    - Other orchestrators don't delegate to it
    - Each orchestrator invents its own approach
  
  implementation_gap: |
    Missing class: InteractionOrchestrator
    
    This should be created at: src/orchestrators/core/interaction_orchestrator.py
    
    Pattern:
    ```python
    class InteractionOrchestrator(IOrchestrator):
        \"\"\"Provides continuous comprehension and approval workflow.
        
        Wraps all other orchestrators to ensure:
        - LENS protocol runs on every request
        - Holistic context presented before execution
        - User approval obtained before proceeding
        - Governance rules enforced at entry point
        \"\"\"
        
        @staticmethod
        def instance() -> 'InteractionOrchestrator':
            \"\"\"Get singleton instance.\"\"\"
        
        def execute_with_comprehension(
            self,
            orchestrator: IOrchestrator,
            operation: str,
            params: Dict
        ) -> Result:
            \"\"\"Execute operation through comprehension gate.
            
            Steps:
            1. Build holistic context (LENS protocol)
            2. Present comprehension YAML
            3. Get user approval
            4. Execute operation
            5. Return results
            \"\"\"
    ```
  
  who_should_use_it: |
    All orchestrators should call:
    - PlanningOrchestrator
    - TDDOrchestrator
    - APIOrchestrator
    - HousekeepingOrchestrator
    - VacuumOrchestrator
    - All domain orchestrators
    
    Instead of inventing their own comprehension logic.

