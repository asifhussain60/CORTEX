      blocking: true
      issue: "ISSUE-001"
      week: 1
      days: 2
      hours: 10
      
      description: |
        Create IntentRouter class inheriting from OrchestratorBase with:
        - Routing decision logic for IMPLEMENT/FIX/REFACTOR operations
        - Decision enum (IMPLEMENT_HANDLER, FIX_HANDLER, REFACTOR_HANDLER)
        - TDD pattern (tests first, RED → GREEN)
        - Full type hints (CORE-011)
        - Google-style docstrings (CORE-012)
        - 20+ unit tests
      
      files_to_create:
        - "src/orchestrators/core/intent_router.py (~250 lines)"
      
      test_files_to_create:
        - "tests/unit/test_intent_router.py (~400 lines, 20+ tests)"
      
      test_plan:
        total_tests: 20
        categories:
          - "test_intent_router_instantiation (2 tests)"
          - "test_routing_decisions (6 tests: IMPLEMENT, FIX, REFACTOR)"
          - "test_routing_with_governance_context (4 tests)"
          - "test_error_handling (4 tests)"
          - "test_audit_logging (4 tests: AC_START, EXECUTE, COMPLETE)"
      
      acceptance_test:
        name: "test_intent_router_fully_operational"
        verification: "IntentRouter can be instantiated, route operations, and produce decisions"
      
      governance_compliance:
        - "CORE-008: TDD (tests written first, RED → GREEN execution)"
        - "CORE-011: Type hints on all functions and parameters"
        - "CORE-012: Google-style docstrings on all classes/methods"
        - "CORE-027: Audit trail (AC_START → AC_EXECUTE → AC_COMPLETE)"
        - "CORE-028: File naming (intent-router.py, kebab-case)"
      
