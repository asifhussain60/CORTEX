# =============================================================================
# DIRECTORY STRUCTURE
# =============================================================================

directory_structure:
  src/dashboard/:
    api/:
      - "__init__.py"
      - "main.py"              # FastAPI app entry
      - "brain_metrics.py"     # Tier status endpoints
      - "audit_stream.py"      # Audit log endpoints + WebSocket
      - "orchestrator_status.py"  # Orchestrator registry
      - "phase_status.py"      # Phase tracker endpoints
      - "websocket_manager.py" # WebSocket connection manager
    frontend/:
      - "index.html"           # Main entry point
      - "observatory.html"     # Brain Observatory view
      - "temporal.html"        # Temporal Cortex view
      - "constellation.html"   # Orchestrator Constellation
      - "plans.html"           # Plan Hub
      - "governance.html"      # Governance Shield
      js/:
        components/:
          brain/:
            - "brain-map.js"
            - "tier-card.js"
            - "tier-detail.js"
          neural/:
            - "neural-pulse.js"
            - "status-indicator.js"
          temporal/:
            - "audit-timeline.js"
            - "audit-entry.js"
            - "audit-filters.js"
            - "hash-chain-viz.js"
            - "ac-context-card.js"
          orchestrator/:
            - "orchestrator-grid.js"
            - "orchestrator-card.js"
            - "dependency-graph.js"
            - "health-indicator.js"
          plan/:
            - "plan-hub.js"
            - "phase-selector.js"
            - "phase-timeline.js"
            - "ac-grid.js"
          common/:
            - "glass-panel.js"   # Reusable glassmorphism container
            - "navbar.js"
            - "sidebar.js"
        utils/:
          - "api-client.js"      # Fetch wrapper for API calls
          - "websocket-client.js" # WebSocket connection manager
        - "app.js"               # Main app initialization
      css/:
        - "glassmorphism.css"
        - "animations.css"
        - "tailwind-custom.css"
      - "tailwind.config.js"   # Tailwind configuration
  tests/:
    unit/dashboard/:
      - "test_brain_metrics.py"
      - "test_audit_stream.py"
      - "test_orchestrator_status.py"
    integration/dashboard/:
      - "test_websocket_streaming.py"
      - "test_api_endpoints.py"
      - "test_frontend_integration.py"

# =============================================================================
# MULTI-MACHINE DEVELOPMENT GUIDE
# =============================================================================

multi_machine_guide:
  setup_on_new_machine:
    steps:
      - step: 1
        action: "Clone repository"
        command: "git clone <repo-url> && cd CORTEX"
      - step: 2
        action: "Checkout CORTEX6 branch"
        command: "git checkout CORTEX6"
      - step: 3
        action: "Initialize Python environment"
        command: "python -m venv venv && source venv/bin/activate && pip install -r requirements.txt"
      - step: 4
        action: "Sync database from YAML"
        command: "python scripts/init_db.py --sync-only"
      - step: 5
        action: "Verify brain structure exists"
        command: "ls cortex-brain/state/governance.db"
      - step: 6
        action: "Start dashboard development"
        command: "cd src/dashboard/frontend && python -m http.server 8080"
  
  sync_protocol:
    before_work:
      - "git pull origin CORTEX6"
      - "python scripts/init_db.py --sync-only"
    after_work:
      - "git add -A"
      - "git commit -m 'NO-XXX-XX: [description]'"
      - "git push origin CORTEX6"
    conflict_resolution:
      - "Dashboard code (src/dashboard/) should have no conflicts with backend phases"
      - "If cortex-master.yaml conflicts: accept remote, re-add local dashboard progress"
      - "Never force-push; always merge"
  
  communication:
    when_starting_ac: "Post in team channel: 'Starting NO-XXX-XX on [machine-name]'"
    when_completing_ac: "Update cortex-master.yaml phase_tracker immediately"
    blocked_by_backend: "Dashboard can proceed - uses read-only data sources"

