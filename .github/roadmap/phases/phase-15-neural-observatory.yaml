# =============================================================================
# PHASE-15-NEURAL-OBSERVATORY: CORTEX Neural Observatory
# =============================================================================
# Purpose: Unified glassmorphism dashboard for CORTEX brain visualization
# Status: NOT_STARTED
# Requires: PHASE-06-ECOSYSTEM (existing brain structure only)
# Estimated Duration: 6 days (48 hours)
# PARALLEL TRACK: Can be developed on separate machine
#
# FULLY INDEPENDENT SPA:
# - Pure visualization layer over existing SSOT data
# - Reads governance.db, cortex-master.yaml, registry/ (all exist TODAY)
# - Zero dependency on PHASE-07 or CORTEX LENS
# - 100% buildable with current CORTEX6 state
# =============================================================================

phase:
  id: "PHASE-15-NEURAL-OBSERVATORY"
  title: "CORTEX Neural Observatory"
  description: |
    Unified glassmorphism dashboard providing real-time visualization of the
    CORTEX brain architecture. Three-pillar design:
    
    1. Brain Observatory - Tier metrics, neural pulse status, SSOT health
    2. Temporal Cortex - Audit intelligence with hash chain visualization
    3. Orchestrator Constellation - Live orchestrator status and dependencies
    
    Additional features:
    - Plan Hub (replaces static plan-viewer.html files)
    - Governance Shield (Tier-0 rule enforcement status)
    - Rollback Timeline (visual history from rollback-history.json)
    
    DESIGN PRINCIPLE:
    Observatory is a standalone SPA that visualizes EXISTING CORTEX data.
    All data sources already exist in CORTEX6. No external dependencies.
  
  order: 15
  status: "IN_PROGRESS"
  locked: false
  
  # DEPENDENCY: Only needs completed brain structure from PHASE-06
  requires: "PHASE-06-ECOSYSTEM"
  required_for: null  # End-user facing, not blocking other phases
  
  # DATA SOURCES (All exist TODAY - no new infrastructure needed)
  data_sources:
    - source: "governance.db"
      location: "cortex-brain/state/governance.db"
      provides: "Audit logs, hash chain, operation history"
      exists: true
      
    - source: "cortex-master.yaml"
      location: ".github/roadmap/cortex-master.yaml"
      provides: "Phase tracker, AC counts, progress metrics"
      exists: true
      
    - source: "rollback-history.json"
      location: "cortex-brain/audit-logs/rollback-history.json"
      provides: "Rollback events timeline"
      exists: true
      
    - source: "Orchestrator Registry"
      location: "cortex-brain/registry/"
      provides: "Registered orchestrators, dependencies"
      exists: true
      
    - source: "Phase YAMLs"
      location: "docs/phases/*.yaml"
      provides: "Individual phase details, AC descriptions"
      exists: true
  
  # PARALLEL EXECUTION
  blocking: false
  parallel_capable: true
  can_run_parallel_with:
    - "PHASE-07-INTENT-ROUTER"
    - "PHASE-08-CORE-ORCHESTRATORS"
    - "PHASE-09-GOVERNANCE-TOOLS"
    - "PHASE-10-ADAPTIVE-EXECUTION"
    - "PHASE-11-HALLUCINATION-PREVENTION"
    - "PHASE-12-KNOWLEDGE-ECOSYSTEM"
    - "PHASE-13-OBSERVABILITY-MATURITY"
    - "PHASE-14-PRODUCTION-MIGRATION"
  
  # MULTI-MACHINE SUPPORT
  multi_machine:
    enabled: true
    sync_strategy: "git-pull-init-db"
    read_only_sources:
      - "cortex-brain/state/governance.db"
      - ".github/roadmap/cortex-master.yaml"
      - "cortex-brain/audit-logs/rollback-history.json"
      - "cortex-brain/registry/"
      - "docs/phases/"
    write_targets:
      - "src/dashboard/"  # New directory for dashboard code
      - "tests/unit/dashboard/"
      - "tests/integration/dashboard/"
    conflict_risk: "LOW"  # Read-only from brain, write to new dashboard dir
  
  estimated_hours: 48
  estimated_days: 6
  
  ac_ids: 12
  completed_ac_ids: 12
  progress_percentage: 100.0

  # FUTURE ENHANCEMENT (Optional, Post PHASE-07)
  future_enhancements:
    note: "When CORTEX LENS (PHASE-07) is available, Observatory can add optional views"
    optional_features:
      - "Knowledge Graph Visualization"
      - "Code Structure Explorer"
      - "Change Heatmap"
    status: "NOT_IN_SCOPE"
    dependency: "PHASE-07-INTENT-ROUTER"

# =============================================================================
# TECH STACK (Glassmorphism v4.1.0 Compliant - Simplified)
# =============================================================================

tech_stack:
  frontend:
    framework: "HTML5 (vanilla JavaScript)"
    language: "JavaScript ES6+"
    styling: "Tailwind CSS + custom glassmorphism utilities"
    visualization:
      - name: "D3.js"
        purpose: "Brain tier visualization, dependency graphs"
      - name: "Chart.js"
        purpose: "Metrics charts, timeline views"
      - name: "CSS Animations"
        purpose: "Neural pulse effects, transitions"
    build: "None (static HTML + Tailwind CDN)"
    
  backend:
    framework: "FastAPI"
    language: "Python 3.11+"
    database: "SQLite (read existing governance.db)"
    real_time: "WebSocket (audit streaming)"
    
  glassmorphism:
    version: "4.1.0"
    backdrop_blur: "blur(16px)"
    background: "rgba(15, 23, 42, 0.75)"
    border: "1px solid rgba(255, 255, 255, 0.08)"
    gradient_palette:
      - "cyan-500"
      - "emerald-500"
      - "violet-500"
      - "amber-500"
      - "rose-500"
      - "sky-500"
      - "lime-500"
  
  tech_stack:
    frontend:
      html: "HTML5 (semantic structure)"
      css: "Tailwind CSS (CDN - no build process)"
      javascript: "Vanilla JavaScript + jQuery (for DOM manipulation)"
      visualization: "D3.js (CDN), Chart.js (CDN)"
      icons: "Heroicons (CDN)"
      animations: "CSS animations + jQuery for interactions"
    backend_integration: "Direct REST API calls to Python backend"
    build_process: "NONE - pure static files"
    dependencies: "Zero npm dependencies (CDN only)"
  
  rationale: |
    Intentionally simple tech stack for maximum maintainability:
    - NO TypeScript (complexity overhead)
    - NO build process or compilation
    - NO npm/node_modules
    - NO framework abstraction layers (React/Vue/Angular)
    - Pure HTML5 + Tailwind CSS (via CDN)
    - Vanilla JavaScript or jQuery for interactivity
    - All external libraries via CDN (D3, Chart.js, etc.)
    - Zero footprint increase
    - Faster development iteration
    - Easier debugging (pure JavaScript)
    - Glassmorphism UI via Tailwind + custom CSS
    - Static files can be deployed anywhere

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  # ---------------------------------------------------------------------------
  # NO-001: Brain Observatory (Tier Visualization)
  # ---------------------------------------------------------------------------
  - ac_id: "NO-001-01"
    title: "Brain Tier Visualization"
    description: |
      Interactive visualization of the 4-tier brain architecture:
      - Tier 0 (Governance): Immutable rules status
      - Tier 1 (Acceptance): AC tracking and phase progress
      - Tier 2 (Templates): Response template status
      - Tier 3 (Knowledge): Knowledge library index
    status: "COMPLETED"
    priority: "HIGH"
    acceptance_tests:
      - "All 4 tiers rendered with correct labels"
      - "Tier health status displayed (HEALTHY, DEGRADED, CRITICAL)"
      - "Click tier to expand details"
      - "Real-time updates when data changes"
    components:
      - "BrainMap.js"
      - "TierCard.js"
      - "TierDetailPanel.js"
    git_checkpoint: "NO-001-01-brain-tiers"
    
  - ac_id: "NO-001-02"
    title: "Neural Pulse System"
    description: |
      Visual health indicator showing brain operational status:
      - OPTIMAL: All systems healthy, hash chain valid
      - NOMINAL: Minor warnings, non-blocking issues
      - DEGRADED: Performance issues, recoverable errors
      - CRITICAL: System failures, immediate attention needed
      - DORMANT: No recent activity, standby mode
    status: "COMPLETED"
    priority: "HIGH"
    acceptance_tests:
      - "Pulse animation reflects current status"
      - "Color coding matches status (green/yellow/orange/red/gray)"
      - "Tooltip shows status details on hover"
      - "Status derived from actual brain metrics"
    components:
      - "NeuralPulse.js"
      - "StatusIndicator.js"
    git_checkpoint: "NO-001-02-neural-pulse"
    
  - ac_id: "NO-001-03"
    title: "SSOT Metrics Dashboard"
    description: |
      Key metrics from cortex-master.yaml phase_tracker:
      - Total phases: locked vs active vs pending
      - AC-ID counts: completed vs in-progress vs not-started
      - Audit entry counts with hash chain verification status
      - Progress percentage per phase
    status: "COMPLETED"
    priority: "MEDIUM"
    acceptance_tests:
      - "Metrics match cortex-master.yaml exactly"
      - "Auto-refresh when YAML changes (poll or WebSocket)"
      - "Phase breakdown chart rendered"
      - "AC progress bar per phase"
    components:
      - "SSOTMetrics.js"
      - "PhaseProgressChart.js"
      - "ACBreakdownPanel.js"
    git_checkpoint: "NO-001-03-ssot-metrics"

  # ---------------------------------------------------------------------------
  # NO-002: Temporal Cortex (Audit Intelligence)
  # ---------------------------------------------------------------------------
