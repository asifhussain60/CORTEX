    description: |
      Intelligent hover cards for AC-IDs showing full traceability:
      - AC title and description
      - Status badge (COMPLETED, IN_PROGRESS, NOT_STARTED)
      - Parent phase information
      - Related audit entries count
      - Test results (passing/failing)
      - Quick actions: View Tests, View Audit Log, View Phase YAML
