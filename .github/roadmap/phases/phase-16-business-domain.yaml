  - risk: "Domain brain performance impact"
    likelihood: "LOW"
    impact: "MEDIUM"
    mitigation: "2-second timeout ensures dashboard latency unaffected"
  
  - risk: "Domain query complexity overload"
    likelihood: "LOW"
