  - ac_id: "AC-DB-E05"
    description: "Concurrent Write Handling: Optimistic Locking with Version Tracking"
    priority: "MEDIUM"
    severity: "MEDIUM"
    edge_case: "E05 - Race conditions: concurrent adapter writes cause silent data loss"
    estimated_hours: 12
    origin: "Architecture review: Multiple adapters writing simultaneously cause write conflicts"
    
    solution: |
      Optimistic locking prevents silent data loss:
      1. Add version field: domains.version (incremented on write)
      2. Read: domain + version
      3. Modify: update version locally
      4. Write: UPDATE WHERE version = read_version
      5. If UPDATE affects 0 rows: conflict detected, merge strategy applied
    
    components:
      - name: "OptimisticLockingManager"
        description: "Version tracking and conflict detection (~100 lines)"
        methods:
          - "read_with_version(domain_id) -> (Domain, int)"
          - "update_domain(domain, expected_version) -> UpdateResult"
          - "detect_conflict(update_result) -> bool"
          - "apply_merge_strategy(local, remote) -> MergedDomain"
      - name: "MergeStrategy"
        description: "Handles version conflicts"
        strategies:
          - "LAST_WRITE_WINS: Remote version takes precedence"
          - "DEEP_MERGE: Recursively merge non-conflicting fields"
          - "MANUAL_REVIEW: Mark for manual resolution"
    
    test_spec:
      total_tests: 13
      categories:
        - name: "Version Tracking Tests"
          count: 4
          tests:
            - "test_version_incremented_on_write"
            - "test_version_read_with_domain"
            - "test_version_mismatch_detected"
            - "test_version_boundary_conditions"
        - name: "Conflict Detection Tests"
          count: 5
          tests:
            - "test_no_conflict_sequential_writes"
            - "test_conflict_concurrent_writes"
            - "test_conflict_multiple_adapters"
            - "test_conflict_audit_trail"
            - "test_conflict_recovery_options"
        - name: "Merge Strategy Tests"
          count: 4
          tests:
            - "test_last_write_wins_merge"
            - "test_deep_merge_non_conflicts"
            - "test_deep_merge_conflicts_manual"
            - "test_merge_performance"
    
    acceptance_tests:
      - "AC-DB-E05-01: 13/13 tests passing ✓"
      - "AC-DB-E05-02: Concurrent writes detected (no silent loss)"
      - "AC-DB-E05-03: Merge strategies applied correctly"
      - "AC-DB-E05-04: Zero data loss incidents"
    
    success_criteria:
      - "All 13 tests passing"
      - "Optimistic locking operational"
      - "Concurrent write safety verified"
      - "Merge strategies tested"

  - ac_id: "AC-DB-E06"
    description: "Version Tracking & Safe Deletion: Import Versioning to Prevent Accidental Loss"
    priority: "MEDIUM"
    severity: "MEDIUM"
    edge_case: "E06 - Accidental deletion: subset re-upload deletes domains without confirmation"
    estimated_hours: 8
    origin: "Architecture review: Re-uploading subset of domains silently deletes others"
    
    solution: |
      Import versioning with subset detection prevents accidental deletion:
      1. Track import_version per BKIO ingestion event
      2. On upload: detect if subset (fewer domains than previous import)
      3. If subset: require explicit confirmation before deletion
      4. Maintain deletion history for recovery (48-hour window)
      5. Audit trail: all import versions and decisions
    
    components:
      - name: "ImportVersionManager"
        description: "Tracks import versions and detects subsets (~90 lines)"
        methods:
          - "track_import_version(import_id, domains) -> ImportVersion"
          - "detect_subset(previous_domains, new_domains) -> SubsetDetection"
          - "require_confirmation(import_id) -> bool"
          - "record_deletion(domain_id, reason) -> void"
      - name: "DeletionRecovery"
        description: "Maintains deletion history for recovery"
        features:
          - "48-hour deletion recovery window"
          - "Restore deleted domains on request"
          - "Audit trail for all deletions"
    
    test_spec:
      total_tests: 9
      categories:
        - name: "Import Version Tests"
          count: 3
          tests:
            - "test_import_version_tracked"
            - "test_version_increment_on_new_import"
            - "test_version_history_queryable"
        - name: "Subset Detection Tests"
          count: 3
          tests:
            - "test_full_reimport_not_subset"
            - "test_partial_reimport_detected_as_subset"
            - "test_subset_requires_confirmation"
        - name: "Deletion Recovery Tests"
          count: 3
          tests:
            - "test_deletion_recorded_with_48h_window"
            - "test_restore_deleted_domains"
            - "test_recovery_window_expiration"
    
    acceptance_tests:
      - "AC-DB-E06-01: 9/9 tests passing ✓"
      - "AC-DB-E06-02: Subset detection working (no accidental deletion)"
      - "AC-DB-E06-03: Confirmation required for partial uploads"
      - "AC-DB-E06-04: Recovery capability operational (48h window)"
    
    success_criteria:
      - "All 9 tests passing"
      - "Import versioning operational"
      - "Subset detection accurate"
      - "Confirmation workflow functional"
      - "Recovery capability tested"

