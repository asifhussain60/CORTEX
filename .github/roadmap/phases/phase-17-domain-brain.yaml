# ============================================================================
# EDGE CASE REMEDIATION ACs (6 additional acceptance criteria)
# ============================================================================
# From architecture review: 7 edge cases identified, 6 addressed in Phase 17
# See: .github/roadmap/reports/PHASE-17-REMEDIATION-DESIGN.md for full analysis
# ============================================================================

edge_case_acceptance_criteria:
  
  - ac_id: "AC-DB-E01"
    description: "Duplicate Upload Detection: Hash-Based Deduplication"
    priority: "CRITICAL"
    severity: "CRITICAL"
    edge_case: "E01 - Silent audit trail corruption from duplicate uploads"
    estimated_hours: 10
    origin: "Architecture review: duplicate uploads undetected, silently corrupt audit trail"
    
    solution: |
      Hash-based duplicate detection prevents idempotent re-execution:
      1. compute_domain_hash(domain) → SHA-256 of serialized domain object
      2. Store hash with audit entry
      3. On upload: compare hash with existing entries
      4. If identical: skip UPDATE, log as duplicate (preserves audit trail)
      5. If different: proceed with UPSERT
    
    components:
      - name: "DuplicationDetector"
        description: "Hash-based duplicate detection (~80 lines)"
        methods:
          - "compute_domain_hash(domain: Domain) -> str"
          - "check_duplicate(domain_id: str, new_hash: str) -> bool"
          - "log_duplicate(domain_id, hash, timestamp) -> void"
      - name: "DuplicationTests"
        description: "Comprehensive duplicate detection test suite (~50 lines)"
        tests:
          - "test_identical_upload_detected_as_duplicate"
          - "test_modified_upload_not_detected_as_duplicate"
          - "test_duplicate_prevents_audit_corruption"
          - "test_performance_hash_computation"
    
    test_spec:
      total_tests: 12
      categories:
        - name: "Hash Computation Tests"
          count: 4
          tests:
            - "test_hash_consistent_same_domain"
            - "test_hash_differs_modified_domain"
            - "test_hash_collision_unlikely"
            - "test_hash_computation_performance"
        - name: "Duplicate Detection Tests"
          count: 5
          tests:
            - "test_first_upload_not_duplicate"
            - "test_identical_reupload_detected"
            - "test_modified_reupload_not_duplicate"
            - "test_duplicate_audit_trail_preserved"
            - "test_duplicate_metrics_recorded"
        - name: "Edge Case Tests"
          count: 3
          tests:
            - "test_empty_domain_hash"
            - "test_large_domain_performance"
            - "test_concurrent_duplicate_detection"
    
    acceptance_tests:
      - "AC-DB-E01-01: 12/12 tests passing ✓"
      - "AC-DB-E01-02: Duplicate uploads idempotent (no data loss)"
      - "AC-DB-E01-03: Audit trail integrity maintained"
      - "AC-DB-E01-04: Performance: hash computation <1ms per domain"
    
    success_criteria:
      - "All 12 tests passing"
      - "Duplicate detection prevents audit corruption"
      - "Hash computation <1ms for typical domains"
      - "Audit trail accurately reflects duplicates"

  - ac_id: "AC-DB-E02"
    description: "Brain Vacuum Prevention: TTL + Archival Strategy"
    priority: "CRITICAL"
    severity: "CRITICAL"
    edge_case: "E02 - Brain vacuum: unbounded O(n) audit growth, 500ms+ queries by Month 12"
    estimated_hours: 15
    origin: "Architecture review: 10,000+ daily updates × 365 days = 3.6M entries, O(n) degradation"
    
    solution: |
      Time-To-Live (TTL) with archival prevents unbounded growth:
      1. Define TTL: 90 days for recent entries (indexed, hot)
      2. After 90 days: move to archive (separate table, less indexed)
      3. Monthly: archive rolling cutoff (day 90 → archive, new day added)
      4. Queries: primary filter on hot entries, archive only if needed
      5. Result: O(1) queries on recent data, manageable archive
    
    components:
      - name: "AuditLogManager"
        description: "TTL enforcement and archival (~120 lines)"
        methods:
          - "cleanup_old_entries() -> CleanupStats"
          - "archive_entries_before(cutoff_date) -> int"
          - "is_in_hot_range(timestamp) -> bool"
          - "query_hot_entries(domain_id) -> List[Entry]"
          - "query_hot_and_archive(domain_id) -> List[Entry]"
      - name: "AuditLogSchema"
        description: "Dual-table schema for hot/archive separation"
        tables:
          - "audit_log (hot, indexed on domain_id, timestamp)"
          - "audit_log_archive (cold, indexed on domain_id only)"
    
    test_spec:
      total_tests: 16
      categories:
        - name: "TTL Enforcement Tests"
          count: 5
          tests:
            - "test_recent_entries_in_hot_table"
            - "test_old_entries_moved_to_archive"
            - "test_ttl_cutoff_date_correct"
            - "test_rolling_monthly_archival"
            - "test_no_loss_during_archival"
        - name: "Performance Tests"
          count: 6
          tests:
            - "test_hot_query_performance_o1"
            - "test_query_with_archive_acceptable"
            - "test_concurrent_queries_unaffected"
            - "test_cleanup_operation_performance"
            - "test_load_test_10k_entries_daily"
            - "test_month_12_query_performance_maintained"
        - name: "Edge Case Tests"
          count: 5
          tests:
            - "test_query_spanning_hot_and_archive"
            - "test_cleanup_with_active_queries"
            - "test_archive_restore_capability"
            - "test_empty_archive_handling"
            - "test_large_domain_archival"
    
    acceptance_tests:
      - "AC-DB-E02-01: 16/16 tests passing ✓"
      - "AC-DB-E02-02: Hot queries <10ms (consistent O(1) performance)"
      - "AC-DB-E02-03: Month 12 query performance maintained (<100ms)"
      - "AC-DB-E02-04: Archive queries <200ms (manageable for rare cases)"
    
    success_criteria:
      - "All 16 tests passing"
      - "90-day TTL enforced correctly"
      - "Hot/archive separation working"
      - "Performance degradation prevented (maintains <100ms)"
      - "Zero data loss during archival"

  - ac_id: "AC-DB-E03"
    description: "Conflict Escalation Workflow: 3-Tier Resolution + LENS Deferral Handling"
    priority: "CRITICAL"
    severity: "CRITICAL"
    edge_case: "E03 - LENS deferral: conflicts escalate but no handling if LENS refuses"
    estimated_hours: 12
    origin: "Architecture review: ConflictResolver applies hierarchy but no handling when LENS defers"
    
    solution: |
      3-tier resolution ensures all conflicts handled:
      1. Tier 1: Apply hierarchy (BKIO > RELATIONSHIPS > AST > GIT > LENS)
      2. Tier 2: If tie (multiple sources equally confident): Query LENS synthesis
      3. Tier 3: If LENS defers (insufficient data): Mark for manual review (24h SLA)
      
      Workflow:
      - Tier 1 resolves 80% (clear hierarchy winner)
      - Tier 2 resolves 15% (LENS synthesis of tied sources)
      - Tier 3 handles 5% (manual review for ambiguous cases)
    
    components:
      - name: "ConflictResolver"
        description: "3-tier conflict resolution (~180 lines)"
        methods:
          - "resolve_conflict(conflict: Conflict) -> ConflictResolution"
          - "apply_hierarchy(sources: List[Source]) -> Optional[ConflictResolution]"
          - "query_lens_synthesis(conflict) -> Optional[ConflictResolution]"
          - "escalate_to_manual_review(conflict) -> ManualReviewTicket"
      - name: "ManualReviewWorkflow"
        description: "Manages manual review queue with SLA tracking"
        features:
          - "Queue for escalated conflicts (Tier 3)"
          - "24-hour SLA for manual review"
          - "Audit trail for manual decisions"
          - "Override capability for senior reviewers"
    
    test_spec:
      total_tests: 13
      categories:
        - name: "Hierarchy Resolution Tests"
          count: 4
          tests:
            - "test_hierarchy_single_source_wins"
            - "test_hierarchy_confidence_weighted"
            - "test_hierarchy_transitive_trust"
            - "test_hierarchy_performance"
        - name: "LENS Synthesis Tests"
          count: 5
          tests:
            - "test_lens_synthesis_on_tie"
            - "test_lens_synthesis_succeeds"
            - "test_lens_deferral_detected"
            - "test_lens_deferral_escalated"
            - "test_lens_query_timeout_handled"
        - name: "Manual Review Tests"
          count: 4
          tests:
            - "test_manual_review_ticket_created"
            - "test_24h_sla_enforced"
            - "test_manual_resolution_applied"
            - "test_escalation_audit_trail"
    
    acceptance_tests:
      - "AC-DB-E03-01: 13/13 tests passing ✓"
      - "AC-DB-E03-02: 100% of conflicts resolved (Tier 1 + 2 + 3)"
      - "AC-DB-E03-03: Manual review SLA tracked (24h)"
      - "AC-DB-E03-04: Zero unhandled conflict deferrals"
    
    success_criteria:
      - "All 13 tests passing"
      - "All conflicts handled (no indefinite deferrals)"
      - "Manual review queue operational"
      - "SLA tracking and alerts functional"

  - ac_id: "AC-DB-E04"
    description: "Orphan Reference Detection: Stale Link Handling"
    priority: "MEDIUM"
    severity: "MEDIUM"
    edge_case: "E04 - Orphaned references: deprecated entities remain visible as valid"
    estimated_hours: 10
    origin: "Architecture review: When entities deprecated, references not cleaned, remain queryable"
    
    solution: |
      Mark-and-sweep orphan detection prevents stale references:
      1. Validate references: check if referenced entity still exists
      2. If missing: mark reference as deprecated (NOT deleted)
      3. Queries return: {entity, deprecated: true}
      4. Weekly sweep: identify fully-orphaned subtrees
      5. Audit trail: document all orphan events
    
    components:
      - name: "ReferenceValidator"
        description: "Reference validation and deprecation marking (~100 lines)"
        methods:
          - "validate_reference(reference_id) -> ValidationResult"
          - "mark_deprecated(entity_id) -> void"
          - "sweep_orphans() -> OrphanStats"
          - "query_with_orphan_detection(query) -> List[EntityWithStatus]"
      - name: "OrphanWitnessLog"
        description: "Tracks orphan discovery and lifecycle"
        features:
          - "Per-domain orphan statistics"
          - "Audit trail for deprecation events"
          - "Recovery capability (re-link or delete permanently)"
    
    test_spec:
