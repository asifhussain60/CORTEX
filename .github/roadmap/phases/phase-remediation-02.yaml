  - ac_id: "AC-REM-002-01"
    title: "Implement GovernanceRegistry.should_proceed() method"
    priority: "CRITICAL"
    category: "Governance Validation"
    estimated_hours: 2
    
    description: |
      Implement GovernanceRegistry.should_proceed() method to validate that
      orchestrator can proceed with execution based on current governance state.
      This method is called by ConversationProtocol per-turn validation.
    
    acceptance_tests:
      - "GovernanceRegistry.should_proceed() method exists and is not stub"
      - "Method checks TIER-0 immutability status"
      - "Method verifies orchestrator tier access declaration vs actual access"
      - "Returns Ok(True) on valid governance state"
      - "Returns Err(governance_violation) on invalid state"
      - "Test validates governance state with 5+ different tier combinations"
    
    implementation_notes: |
      File: src/core/governance_registry.py
      
      def should_proceed(self, turn_number: int, orchestrator_id: str) -> Result[bool]:
          # 1. Verify TIER-0 immutability
          tier0_rules = self.get_all_tier0_rules()
          for rule in tier0_rules:
              if rule.is_immutable and rule.modified_after_initialization:
                  return Err(GovernanceViolation.tier0_mutated(rule.id))
          
          # 2. Query database for tier access log (when SOL-GOV-003 complete)
          # tier_access = db.query_tier_access_log(turn_number, orchestrator_id)
          # if tier_access violates declared tiers:
          #     return Err(GovernanceViolation.undeclared_tier_access())
          
          # 3. Validate turn count hasn't exceeded limits
          if turn_number > self.max_turns_allowed:
              return Err(GovernanceViolation.turn_limit_exceeded(turn_number))
          
          return Ok(True)
    
    git_checkpoint: "governance-registry-should-proceed-implemented"
    
    governance_alignment:
      - "CORE-017: Strict Governance Enforcement"
      - "CORE-027: Audit Trail Per Turn"
  
  - ac_id: "AC-REM-002-02"
    title: "Implement ConversationProtocol._validate_governance_before_turn()"
    priority: "CRITICAL"
    category: "Governance Validation"
    estimated_hours: 3
    
    description: |
      Replace stub _validate_governance_before_turn() in ConversationProtocol
      with actual implementation that validates governance state before every turn.
    
    acceptance_tests:
      - "_validate_governance_before_turn() is no longer a stub"
      - "Method calls GovernanceRegistry.should_proceed()"
      - "Method passes current turn_number and orchestrator_id"
      - "Returns Err on governance violation"
      - "Halts execution on violation (raises GovernanceViolationError)"
      - "Turn 1: validation passes for fresh orchestrator"
      - "Turn 2+: validation re-checks TIER-0 immutability"
      - "Integration test: 5-turn conversation validates governance each turn"
    
    implementation_notes: |
      File: src/core/orchestrator/conversation_protocol.py
      
      def _validate_governance_before_turn(self) -> Result[bool]:
          # Initialize registry if needed
          if not self._governance_registry:
              self._governance_registry = GovernanceRegistry.instance()
              self._governance_registry.initialize()
          
          # Validate governance state for this turn
          validation_result = self._governance_registry.should_proceed(
              turn_number=self.current_turn,
              orchestrator_id=self.orchestrator_id
          )
          
          match validation_result:
              case Ok(_):
                  return Ok(True)
              case Err(violation):
                  # Log violation to audit trail
                  self._audit_logger.log_governance_violation(
                      turn=self.current_turn,
                      orchestrator_id=self.orchestrator_id,
                      violation=violation
                  )
                  raise GovernanceViolationError(violation)
    
    git_checkpoint: "conversation-protocol-governance-validation-implemented"
    
    governance_alignment:
