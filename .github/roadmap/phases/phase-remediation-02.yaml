# PHASE-REMEDIATION-02: Per-Turn Governance Tier Enforcement
# =============================================================================
# Purpose: Fix critical governance tier enforcement gap in ConversationProtocol
# Status: READY_FOR_IMPLEMENTATION
# Requires: PHASE-16-ORCHESTRATOR-CONTINUATION
# Estimated Duration: 4 days (19 hours)
# Issue: ISSUE-002 (CORTEX-2026-002) - Governance Tier Enforcement Missing on Per-Turn Execution
# =============================================================================

phase:
  id: "PHASE-REMEDIATION-02"
  title: "Per-Turn Governance Tier Enforcement"
  description: |
    Fix critical governance tier enforcement gap in ConversationProtocol execution.
    
    ISSUE-002: Governance Tier Enforcement Missing on Per-Turn Execution
    - Root Cause: TIER-0 immutability enforced only at config load, not per-turn
    - Impact: Multi-turn orchestrator sessions vulnerable to governance violations
    - Violations: AR-001-03, CORE-017, CORE-019, CORE-027
    - Fix: 8 ACs implementing per-turn governance validation at all layers
    - Severity: CRITICAL - Governance regression from CORTEX5.5
    
    Implementation Strategy:
    1. ConversationProtocol per-turn governance validation (SOL-GOV-001)
    2. Master Orchestrator governance enforcement (SOL-GOV-002)
    3. Database-level tier enforcement schema (SOL-GOV-003)
    4. TierAccessValidator integration into execution flow (SOL-GOV-004)
  
  order: 19
  status: "READY_FOR_IMPLEMENTATION"
  locked: false
  
  requires: "PHASE-16-ORCHESTRATOR-CONTINUATION"
  required_for: "PHASE-17-DOMAIN-BRAIN"
  blocking: true
  
  estimated_hours: 19
  estimated_days: 4
  
  ac_ids: 8
  completed_ac_ids: 0
  progress_percentage: 0.0
  
  # Issue Remediation Mapping
  issue_remediation:
    - issue_id: "ISSUE-002"
      issue_code: "CORTEX-2026-002"
      title: "Governance Tier Enforcement Missing on Per-Turn Execution"
      severity: "CRITICAL"
      compliance_violations: ["AR-001-03", "CORE-017", "CORE-019", "CORE-027"]
      acs: ["AC-REM-002-01", "AC-REM-002-02", "AC-REM-002-03", "AC-REM-002-04", "AC-REM-002-05", "AC-REM-002-06", "AC-REM-002-07", "AC-REM-002-08"]
      hours: 19

