metadata:
  phase_id: "PHASE-REMEDIATION-03"
  title: "Critical Architecture Issues Remediation"
  description: |
    Remediation of 8 findings from ISSUE-005: Comprehensive Architecture Review (2026-01-16)
    
    ISSUE-005 identified critical gaps in:
    1. Orchestrator state management (non-atomic transactions)
    2. Governance validation timing (post-execution vs pre-execution)
    3. Exception handling patterns (silent error suppression)
    4. Hallucination prevention (prompt injection vectors)
    5. Type hint coverage (CORE-011 compliance)
    6. Database connection lifecycle (SQLite handle exhaustion)
    7. Documentation maintenance (Tier3 knowledge drift)
    8. Test naming conventions (CORE-028 compliance)
    
    CRITICAL BLOCKERS (must fix before production):
    - FINDING-001: State management atomicity
    - FINDING-002: Governance pre-execution gates
    
    HIGH PRIORITY (prevent cascading failures):
    - FINDING-003: Exception handler error propagation
    - FINDING-004: Prompt injection sanitization
    - FINDING-005: Type hint coverage
    - FINDING-006: Database connection lifecycle
    
    MEDIUM PRIORITY (technical debt):
    - FINDING-007: Documentation drift
    - FINDING-008: Test naming conventions
  
  phase_sequence: 23
  estimated_hours: 14.25  # 1d + 4h + 4h + 4h + 1h + 1h + 1h + 15m = 14.25h
  estimated_days: 2.5
  completion_target: "2026-01-19"
  
  governance_rules_enforced:
    - "CORE-008: Tests MUST exist BEFORE implementation (RED → GREEN)"
    - "CORE-011: ALL functions MUST have type hints"
    - "CORE-012: ALL public APIs MUST have docstrings"
    - "CORE-013: NO bare except, NO generic Exception"
    - "CORE-026: Git checkpoint BEFORE every major action"
    - "CORE-027: AC_START, AC_EXECUTE, AC_COMPLETE audit entries"
    - "CORE-028: Kebab-case, ≤25 chars total"
  
  evidence_location: ".github/roadmap/issues/issue-report-05.yaml"
  review_commit: "1559c1bee"

acceptance_criteria:
  
  # ===========================================================================
  # CRITICAL BLOCKERS - MUST FIX BEFORE PRODUCTION
  # ===========================================================================
  
  - ac_id: "AC-FIX-001-01"
    title: "Fix orchestrator state management atomicity (FINDING-001 CRITICAL)"
    priority: "P0 - CRITICAL"
    category: "Brittleness - State Management"
    issue_reference: "ISSUE-005, FINDING-001"
    blocking_phase: "PHASE-17, PHASE-PRODUCTION"
    
    description: |
      FINDING-001: Orchestrator state transitions are not atomic.
      
      PROBLEM:
      Operation completion and audit logging are decoupled transactions.
      If audit logger fails after operation succeeds, AC appears stuck in EXECUTING state.
      
      RISK:
      Under high load or database contention:
      - Operations appear incomplete when they succeeded
      - Automatic recovery retries may re-execute already-completed actions
      - Audit trail shows false execution failures
      - Governance violations reported for compliant operations
      
      SOLUTION:
      Wrap operation execution + audit logging in single SQLite transaction
      with savepoint boundaries for nested operations.
      
      Files affected:
      - src/orchestrators/core/master_orchestrator.py (lines 95-180)
      - src/core/orchestrator/conversation_protocol.py (lines 50-100)
      - src/infrastructure/audit_logger.py (lines 140-200)
    
    acceptance_criteria_tests:
      - "Wrap MasterOrchestrator execute() + audit in transaction"
      - "Implement SQLite savepoint for nested operations"
      - "Create explicit AC state machine (PENDING → EXECUTING → COMPLETE/FAILED)"
      - "Add unit test: transaction rolls back on audit failure"
      - "Add integration test: state remains consistent under load (1000 operations)"
      - "Verify: no re-entry from COMPLETE or FAILED states"
      - "Load test: 10x production throughput, zero state corruption"
    
    estimated_hours: 8
    estimated_days: 1
    effort: "1d"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-001-01"
    git_checkpoint_after: "AC-FIX-001-01: Fix orchestrator state management atomicity - tests passing"
    
    test_files_to_create:
      - "tests/integration/test_orchestrator_state_atomicity.py"
      - "tests/unit/test_conversation_protocol_transactions.py"
    
    verification: |
      1. All new tests pass: pytest tests/integration/test_orchestrator_state_atomicity.py -v
      2. All existing tests pass: pytest tests/ -q
      3. Load test: python scripts/load_test_orchestrator.py --throughput 10x --duration 5m
      4. Audit trail: SELECT COUNT(*) FROM audit_log WHERE operation='AC_EXECUTE_FAILED'; # should be 0
      5. State machine verified: No AC stuck in EXECUTING state
    
    completion_criteria: "All tests passing, load test clean, audit trail verified"

  - ac_id: "AC-FIX-002-01"
    title: "Implement governance pre-execution gates (FINDING-002 CRITICAL)"
    priority: "P0 - CRITICAL"
    category: "Governance - Validation Timing"
    issue_reference: "ISSUE-005, FINDING-002"
    blocking_phase: "PHASE-17, PHASE-PRODUCTION"
    related_rule: "CORE-027"
    
    description: |
      FINDING-002: Governance validation happens AFTER orchestrator execution.
      
      PROBLEM:
      Current implementation:
      1. ConversationProtocol.execute_turn() executes orchestrator code
      2. THEN calls governance_registry.validate_turn()
      3. If violation detected, turn already modified state
      
      Orchestrator could already:
      - Query external APIs
      - Modify in-memory state
      - Generate AI responses
      - Then get stopped by governance (too late)
      
      RISK:
      Violates CORE-027 which requires governance GATES (prevention), not just LOGS (detection).
      Current implementation provides governance LOGS only.
      
      SOLUTION:
      1. Create GovernancePregate interface with pre-execution checks
      2. Move governance validation to BEFORE execution
      3. Only call orchestrator.execute_turn() if pregate passes
      4. Add audit entries for pregate check results
      
      Files affected:
      - src/core/governance_registry.py (lines 80-150)
      - src/core/orchestrator/conversation_protocol.py (lines 150-200)
      - src/core/orchestrator/continuation_decision.py (new pregate result)
    
    acceptance_criteria_tests:
      - "Create GovernancePregate interface with pre-execution checks"
      - "Implement resource quota checks (pre-execution)"
      - "Implement operation authorization checks (pre-execution)"
      - "Implement tier access validation (pre-execution)"
      - "Move governance validation BEFORE orchestrator.execute_turn()"
      - "Add test: governance rejection prevents execution"
      - "Add test: execution only occurs after pregate passes"
      - "Add audit entries for pregate check results"
    
    estimated_hours: 4
    estimated_days: 0.5
    effort: "4h"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-002-01"
    git_checkpoint_after: "AC-FIX-002-01: Implement governance pre-execution gates - tests passing"
    
    test_files_to_create:
      - "tests/integration/test_governance_pregate.py"
      - "tests/unit/test_governance_pregate_interface.py"
    
    verification: |
      1. All new tests pass: pytest tests/integration/test_governance_pregate.py -v
      2. All existing tests pass: pytest tests/ -q
      3. Verify pregate blocks unauthorized operations
      4. Verify audit entries logged for pregate checks
      5. Verify orchestrator.execute_turn() only called after pregate passes
    
    completion_criteria: "All tests passing, governance gates enforced pre-execution"

  # ===========================================================================
  # HIGH PRIORITY - PREVENT CASCADING FAILURES
  # ===========================================================================

  - ac_id: "AC-FIX-003-01"
    title: "Fix exception handlers to propagate errors (FINDING-003 HIGH)"
    priority: "P1 - HIGH"
    category: "Brittleness - Exception Handling"
    issue_reference: "ISSUE-005, FINDING-003"
    related_rule: "CORE-013"
    
    description: |
      FINDING-003: Orchestrator exception handlers use generic Exception without re-raise.
      
      PROBLEM:
      15+ locations catch Exception broadly, log, but don't re-raise.
      Callers receive Ok(None) instead of Err(...).
      
      PATTERN:
      ```python
      except Exception as e:
          logger.error(f"Error: {e}")
          return Ok("operation completed")  # ← Hides error
      ```
      
      RISK:
      - Caller doesn't know operation failed
      - Error handling logic bypassed
      - Audit trail shows success when failed
      - Cascading failures in dependent operations
      
      SOLUTION:
      Audit all except Exception handlers.
      For errors that should stop execution: re-raise or return Err().
      For side-effects where retry possible: use specific exception type.
      
      Files affected:
      - src/core/orchestrator/conversation_protocol.py (9 handlers)
      - src/orchestrators/domain/planning_orchestrator.py (1 handler)
      - src/observability/audit_trail.py (6 handlers)
    
    acceptance_criteria_tests:
      - "Identify all 15+ generic Exception handlers"
      - "Categorize each: error→stop or side-effect→retry"
      - "For error→stop: add return Err(message)"
      - "For side-effect→retry: change to specific exception type"
      - "Add test: calling code receives Err() on failure"
      - "Add test: error information preserved in Result"
      - "Verify caller can distinguish success from failure"
    
    estimated_hours: 4
    estimated_days: 0.5
    effort: "4h"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-003-01"
    git_checkpoint_after: "AC-FIX-003-01: Fix exception handlers to propagate errors - tests passing"
    
    test_files_to_create:
      - "tests/unit/test_orchestrator_exception_propagation.py"
      - "tests/integration/test_error_cascading.py"
    
    verification: |
      1. All new tests pass: pytest tests/unit/test_orchestrator_exception_propagation.py -v
      2. All existing tests pass: pytest tests/ -q
      3. Verify error information reaches callers
      4. Verify no silent error suppression
      5. Verify audit trail reflects actual operation status
    
    completion_criteria: "All exception handlers reviewed, errors properly propagated"

  - ac_id: "AC-FIX-004-01"
    title: "Add prompt injection sanitization (FINDING-004 HIGH)"
    priority: "P1 - HIGH"
    category: "Hallucination - Prompt Injection"
    issue_reference: "ISSUE-005, FINDING-004"
    
    description: |
      FINDING-004: Response templates interpolate user input without sanitization.
      
      PROBLEM:
      Response templates in cortex-brain/tier2/response-templates/ use string
      interpolation for dynamic content (AC-IDs, operation names, etc.) without
      validating template structure before injection.
      
      RISK:
      Malicious or malformed input could:
      - Inject YAML structure breaking the response
      - Inject prompt instructions overriding template intent
      - Generate hallucinated guidance by breaking parsing
      
      SOLUTION:
      1. Add YAML-safe string escaping for all template interpolations
      2. Validate all user-provided input against whitelist
      3. Use safe templating library (Jinja2 with autoescape)
      4. Add integration tests for injection attempts
      
      Files affected:
      - src/core/response_header_injector.py (lines 40-80)
      - cortex-brain/tier2/response-templates/ (8+ template files)
    
    acceptance_criteria_tests:
      - "Identify all user-input interpolation points in templates"
      - "Add YAML-safe escaping for string interpolation"
      - "Add whitelist validation for operation names"
      - "Add whitelist validation for AC-IDs"
      - "Implement safe templating with autoescape"
      - "Add test: inject YAML syntax → rejected or escaped"
      - "Add test: inject prompt instructions → rejected or escaped"
      - "Add test: legitimate data passes through correctly"
    
    estimated_hours: 4
    estimated_days: 0.5
    effort: "4h"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-004-01"
    git_checkpoint_after: "AC-FIX-004-01: Add prompt injection sanitization - tests passing"
    
    test_files_to_create:
      - "tests/security/test_template_injection.py"
      - "tests/unit/test_response_header_escaping.py"
    
    verification: |
      1. All new tests pass: pytest tests/security/test_template_injection.py -v
      2. All injection attempts blocked or escaped
      3. Legitimate data processed correctly
      4. No YAML parsing errors from user input
      5. Response templates render correctly with safe escaping
    
    completion_criteria: "All injection vectors blocked, templates safe"

  - ac_id: "AC-FIX-005-01"
    title: "Add missing type hints (FINDING-005 HIGH - CORE-011)"
    priority: "P1 - HIGH"
    category: "Governance - Type Hints"
    issue_reference: "ISSUE-005, FINDING-005"
    related_rule: "CORE-011"
    
    description: |
      FINDING-005: Functions missing return type hints in core modules.
      
      PROBLEM:
      CORE-011 requires type hints on all function signatures.
      16 functions identified with missing return type annotations.
      
      Pattern:
      ```python
      def query_domain(self, domain_id: str):  # ← Missing -> Type
          # Should be: def query_domain(self, domain_id: str) -> Dict[str, Any]:
      ```
      
      RISK:
      - Type checker cannot validate caller assumptions
      - Documentation incomplete for consumers
      - Regression: Similar pattern flagged in PHASE-14
      
      SOLUTION:
      1. Run mypy --strict on src/ to identify all missing hints
      2. Add return type to each function
      3. Verify with mypy
      4. Add pre-commit hook to catch future violations
    
    acceptance_criteria_tests:
      - "Run mypy --strict on src/ → collect all missing type hints"
      - "Add return type annotations to 16 identified functions"
      - "Run mypy --strict → all checks pass"
      - "Add pre-commit hook to enforce type hints"
      - "Test hook: reject commit with missing type hints"
      - "Verify no existing tests broken by type narrowing"
    
    estimated_hours: 1
    estimated_days: 0.25
    effort: "1h"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-005-01"
    git_checkpoint_after: "AC-FIX-005-01: Add missing type hints - mypy strict passing"
    
    test_files_to_create:
      - "tests/unit/test_type_hints_coverage.py"
    
    verification: |
      1. mypy --strict src/ passes with zero errors
      2. All 16 functions have return type hints
      3. All existing tests pass: pytest tests/ -q
      4. Pre-commit hook working: reject commits without hints
      5. Coverage report: 100% function type hint coverage
    
    completion_criteria: "All type hints added, mypy --strict passing"

  - ac_id: "AC-FIX-006-01"
    title: "Fix SQLite connection lifecycle (FINDING-006 MEDIUM)"
    priority: "P2 - MEDIUM"
    category: "Brittleness - Database"
    issue_reference: "ISSUE-005, FINDING-006"
    
    description: |
      FINDING-006: SQLite connections not explicitly closed in error paths.
      
      PROBLEM:
      AuditLogger and DatabaseManager create SQLite connections but don't
      guarantee closure if exceptions occur between open() and close().
      
      Pattern:
      ```python
      conn = sqlite3.connect(db_path)
      cursor = conn.cursor()
      cursor.execute(query)  # ← Exception here leaves conn open
      conn.close()           # ← Never reached
      ```
      
      RISK:
      Under sustained load (high audit throughput):
      - SQLite file handle exhaustion
      - "database is locked" errors
      - Memory leak in long-running processes
      
      SOLUTION:
      1. Wrap all SQLite operations in context managers (with statement)
      2. Verify all except paths have proper cleanup
      3. Add connection pool metrics to observability
      4. Load test with 10x expected throughput
    
    acceptance_criteria_tests:
      - "Audit all SQLite connection creation points"
      - "Wrap in context managers (with statement)"
      - "Verify except paths properly cleanup"
      - "Add test: exception doesn't leave connections open"
      - "Add connection pool metrics"
      - "Load test: 10x throughput, zero connection leaks"
      - "Monitor memory usage: stable over 1 hour sustained load"
    
    estimated_hours: 1
    estimated_days: 0.25
    effort: "1h"
    
    git_checkpoint_before: "checkpoint: before AC-FIX-006-01"
    git_checkpoint_after: "AC-FIX-006-01: Fix SQLite connection lifecycle - tests passing"
    
    test_files_to_create:
      - "tests/integration/test_sqlite_connection_lifecycle.py"
      - "tests/performance/test_database_under_load.py"
    
    verification: |
      1. All new tests pass: pytest tests/integration/test_sqlite_connection_lifecycle.py -v
      2. All existing tests pass: pytest tests/ -q
      3. Load test: python scripts/load_test_database.py --throughput 10x --duration 1h
      4. Memory profiling: stable connection count
      5. No "database is locked" errors in logs
    
    completion_criteria: "All connections use context managers, load test clean"

  # ===========================================================================
  # MEDIUM PRIORITY - TECHNICAL DEBT
  # ===========================================================================

  - ac_id: "AC-DOC-007-01"
    title: "Update Tier3 knowledge documentation (FINDING-007 MEDIUM)"
    priority: "P2 - MEDIUM"
    category: "Technical Debt - Documentation"
    issue_reference: "ISSUE-005, FINDING-007"
    related_rule: "CORE-012"
    
    description: |
      FINDING-007: Documentation drift in Tier3 knowledge modules.
      
      PROBLEM:
      Domain Brain adapters were enhanced with new query patterns,
      but README documentation wasn't updated to reflect:
      - New "todo:" query syntax
      - _query_todos() method behavior
      - Supported query types
      
      RISK:
      Users trying to use Domain Brain won't find documentation
      for new features and may assume they don't exist.
    
    acceptance_criteria_tests:
      - "Update cortex-brain/tier3/domain-brain/README.md"
      - "Document all supported query patterns"
      - "Add examples for new 'todo:' syntax"
      - "Document _query_todos() return format"
      - "Add cross-reference to source code"
      - "Verify README matches actual implementation"
    
    estimated_hours: 1
    estimated_days: 0.25
    effort: "1h"
    
    git_checkpoint_before: "checkpoint: before AC-DOC-007-01"
    git_checkpoint_after: "AC-DOC-007-01: Update Tier3 documentation - review complete"
    
    verification: |
      1. README documents all query patterns
      2. Examples for new "todo:" syntax provided
      3. _query_todos() documented completely
      4. Cross-references to source code added
      5. No discrepancies between docs and implementation
    
    completion_criteria: "Documentation comprehensive and current"

  - ac_id: "AC-MINOR-008-01"
    title: "Standardize test file naming (FINDING-008 LOW - CORE-028)"
    priority: "P3 - LOW"
    category: "Technical Debt - Code Quality"
    issue_reference: "ISSUE-005, FINDING-008"
    related_rule: "CORE-028"
    
    description: |
      FINDING-008: Test file naming exceeds kebab-case length limit.
      
      PROBLEM:
      CORE-028 limits file names to ≤25 characters in kebab-case.
      3 test files exceed limit:
      - test_cortex_orchestrator_integration_framework.py (51 chars) ✗
      - test_governance_validator_comprehensive_checks.py (49 chars) ✗
      - test_response_template_injection_sanitization.py (48 chars) ✗
      
      RISK:
      Low - only affects searchability and directory navigation
    
    acceptance_criteria_tests:
      - "Rename to shorter names ≤25 chars"
      - "Update test references in conftest.py"
      - "Verify all tests discoverable by pytest"
      - "Verify all tests still pass"
    
    estimated_hours: 0.25
    estimated_days: 0.25
    effort: "15m"
    
    git_checkpoint_before: "checkpoint: before AC-MINOR-008-01"
    git_checkpoint_after: "AC-MINOR-008-01: Standardize test naming - tests passing"
    
    verification: |
      1. All test files ≤25 characters
      2. pytest collects all tests successfully
      3. All tests pass: pytest tests/ -q
      4. No import errors in conftest.py
    
    completion_criteria: "All test files comply with CORE-028"

testing_strategy:
  red_green_pattern: "Tests MUST be created BEFORE implementation (RED → GREEN)"
  test_pyramid:
    - "Unit tests for individual components (fastest)"
    - "Integration tests for component interaction (medium)"
    - "End-to-end tests for full workflow (slowest)"
    - "Load tests for performance under stress"
    - "Security tests for injection/validation"
  
  test_coverage_minimum: 85%
  audit_trail_validation: "Every AC-ID must have START → EXECUTE → COMPLETE entries"

delivery_criteria:
  - "All 8 ACs implemented and tested"
  - "All critical blockers resolved (AC-FIX-001-01, AC-FIX-002-01)"
  - "All high priority fixes completed (AC-FIX-003-01 through 005-01)"
  - "All medium priority debt addressed (AC-DOC-007-01, AC-MINOR-008-01)"
  - "Load tests passing (10x production throughput)"
  - "All governance rules compliant (CORE-008 through CORE-028)"
  - "Audit trail complete (24 entries minimum per AC: 3 × 8 ACs)"
  - "Git checkpoints created for every AC"

success_criteria:
  production_ready: "All CRITICAL findings resolved"
  governance_compliant: "Zero CORE rule violations"
  audit_trail_verified: "All 24+ entries present with valid hash chain"
  testing_complete: "All new tests pass, regression tests pass"
  documentation_current: "Knowledge base synchronized with implementation"
  performance_validated: "Load tests pass at 10x production throughput"
