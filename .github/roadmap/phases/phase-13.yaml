# =============================================================================
# BUSINESS DOMAIN INTEGRATION ACCEPTANCE CRITERIA (PHASE-16 → PHASE-13)
# =============================================================================
# Integrated per decision: PHASE-16-INTEGRATION-DECISION.md (Jan 15, 2026)
# Rationale: Production launch requires compliance framework. 2h of work fits
# in PHASE-13 window. Eliminates 6-month gap + post-launch rework.
# =============================================================================

  - ac_id: "BD-001-01"
    title: "Domain Registry Schema Creation"
    description: "Create domain-registry.yaml in cortex-brain/tier3/ with proper schema documenting CORTEX domains and business domain availability"
    domain: "BUSINESS_DOMAIN"
    category: "Architecture"
    priority: "CRITICAL"
    status: "NOT_STARTED"
    estimated_hours: 0.5
    acceptance_tests:
      - "Domain registry file exists at cortex-brain/tier3/domain-registry.yaml"
      - "File contains metadata with version, tier, purpose"
      - "Tier designation is '3' (knowledge/reference)"
      - "cortex_domains section lists all 16 CORTEX domains"
      - "business_domains_ready section present and extensible"
      - "Integration endpoint documented"
      - "YAML validates against schema"
    git_checkpoint: "BD-001-01-registry-schema"
    
  - ac_id: "BD-001-02"
    title: "Domain Availability Documentation"
    description: "Document which business domains are available for integration with configuration examples and fallback strategy"
    domain: "BUSINESS_DOMAIN"
    category: "Documentation"
    priority: "CRITICAL"
    status: "NOT_STARTED"
    estimated_hours: 0.5
    acceptance_tests:
      - "All 16 CORTEX domains documented with descriptions"
      - "Business domain schema provided for company configuration"
      - "Integration examples show how to add FINANCIAL, HEALTHCARE, COMPLIANCE"
      - "Fallback guarantee documented (works with endpoint = null)"
      - "Query patterns provided for each tier"
      - "README file created at cortex-brain/tier3/README-DOMAIN-INTEGRATION.md"
    git_checkpoint: "BD-001-02-domain-docs"
    
  - ac_id: "BD-002-01"
    title: "Configurable Domain Brain Endpoint"
    description: "Make domain brain integration point configurable via environment variables with sensible defaults and timeout handling"
    domain: "BUSINESS_DOMAIN"
    category: "Configuration"
    priority: "HIGH"
    status: "NOT_STARTED"
    estimated_hours: 1.0
    acceptance_tests:
      - "DOMAIN_BRAIN_ENDPOINT environment variable supported"
      - "Defaults to null if not set"
      - "Type validation for string (URL or service reference)"
      - "Timeout configurable (default 2 seconds)"
      - "Fallback strategy documented and tested"
      - "No changes to existing CORTEX configuration"
      - "dashboard_extensibility.py module created in src/observability/"
    git_checkpoint: "BD-002-01-endpoint-config"
    
  - ac_id: "BD-003-01"
    title: "Zero Breaking Changes Guarantee"
    description: "No existing CORTEX code modified. Domain integration is pure addition (new files only, no modifications to existing modules)"
    domain: "ZERO_BREAKING_CHANGES"
    category: "Quality"
    priority: "CRITICAL"
    status: "NOT_STARTED"
    estimated_hours: 0.5
    acceptance_tests:
      - "Only NEW files created (no modifications to existing Python files)"
      - "No changes to existing YAML configs"
      - "All existing tests pass unchanged"
      - "Backward compatibility guaranteed"
      - "git diff shows only additions (A flag), no modifications (M flag)"
      - "Existing ACs remain unaffected"
      - "No deprecations or removals"
    git_checkpoint: "BD-003-01-zero-breaking"

