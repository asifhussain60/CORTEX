  AR-009:
    id: "AR-009"
    title: "Custom Response Templates"
    status: "APPROVED"
    priority: "MEDIUM"
    phase: 2
    description: |
      Templated response system:
      - JSON/YAML response templates
      - Domain-specific templates (governance, audit, evidence)
      - Template inheritance for customization
    acceptance_criteria:
      - ac_id: "AC-AR-009-01"
        description: "Response templates loaded from cortex-brain/tier2/"
        test: "test_template_loading"
      - ac_id: "AC-AR-009-02"
        description: "Templates support variable substitution"
        test: "test_template_variables"
      - ac_id: "AC-AR-009-03"
        description: "Template inheritance working"
        test: "test_template_inheritance"
