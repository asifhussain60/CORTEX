# =============================================================================
# FUNCTIONAL REQUIREMENTS (FR-001 through FR-009)
# =============================================================================

functional_requirements:
  FR-001:
    id: "FR-001"
    title: "Audit-First Pattern"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 1
    description: |
      All operations audit-logged BEFORE execution:
      1. Log intent
      2. Execute operation
      3. Log result
      Hash chain ensures tamper evidence.
    acceptance_criteria:
      - ac_id: "AC-FR-001-01"
        description: "Operations logged before execution"
        test: "test_pre_execution_logging"
      - ac_id: "AC-FR-001-02"
        description: "Hash chain integrity maintained"
        test: "test_hash_chain_integrity"
      - ac_id: "AC-FR-001-03"
        description: "Audit logs queryable by AC-ID"
        test: "test_audit_query_by_ac_id"
    components:
      - "EnhancedAuditLogger"
      - "HashChainManager"
    dependencies:
      - "AR-002"
      - "AR-004"

  FR-002:
    id: "FR-002"
    title: "Governance Rule Evaluation"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 2
    description: |
      Evaluate governance rules against operations:
      - Load applicable rules by context
      - Evaluate rules in priority order
      - Return pass/fail with violations
    acceptance_criteria:
      - ac_id: "AC-FR-002-01"
        description: "Rules evaluated in tier priority order"
        test: "test_tier_priority_evaluation"
      - ac_id: "AC-FR-002-02"
        description: "Violations returned with rule ID and message"
        test: "test_violation_details"
      - ac_id: "AC-FR-002-03"
        description: "Evaluation performance <5ms per rule"
        test: "test_evaluation_performance"
    components:
      - "RuleEvaluator"
      - "ViolationReporter"
    dependencies:
      - "AR-001"
      - "AR-003"

  FR-003:
    id: "FR-003"
    title: "State Machine Management"
    status: "APPROVED"
    priority: "HIGH"
    phase: 1
    description: |
      State machine for AC-ID lifecycle:
      - States: PENDING, IN_PROGRESS, BLOCKED, COMPLETED, VERIFIED
      - Transitions validated against governance rules
      - State persisted to governance.db
    acceptance_criteria:
      - ac_id: "AC-FR-003-01"
        description: "State transitions atomic"
