# =============================================================================
# ARCHITECTURE DECISIONS (AR-001 through AR-010)
# =============================================================================

architecture_decisions:
  AR-001:
    id: "AR-001"
    title: "3-Tier Governance Model"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 1
    description: |
      Implement 3-tier governance hierarchy:
      - Tier 0: Immutable SKULL rules (25 rules, YAML-based, cannot be overridden)
      - Tier 1: Project governance (YAML + SQLite, can extend Tier 0)
      - Tier 2: Engineering standards (team conventions, lowest priority)
    acceptance_criteria:
      - ac_id: "AC-AR-001-01"
        description: "Tier 0 rules loaded from cortex-brain/tier0/governance/core-rules.yaml"
        test: "test_tier0_rules_loaded"
      - ac_id: "AC-AR-001-02"
        description: "Tier precedence enforced (0 > 1 > 2)"
        test: "test_tier_precedence"
      - ac_id: "AC-AR-001-03"
        description: "Tier 0 rules immutable (modification attempts rejected)"
        test: "test_tier0_immutable"
    components:
      - "GovernanceRegistry"
      - "TierResolver"
      - "RuleLoader"
    dependencies: []

  AR-002:
    id: "AR-002"
    title: "SQLite-Based AC Index"
    status: "APPROVED"
    priority: "HIGH"
    phase: 1
    description: |
      Single-file SQLite database (governance.db) for:
      - AC-ID tracking and status
      - Audit log storage
      - Progress tracking
      - Evidence bundle references
    acceptance_criteria:
      - ac_id: "AC-AR-002-01"
        description: "governance.db created with correct schema"
        test: "test_governance_db_schema"
      - ac_id: "AC-AR-002-02"
        description: "WAL mode enabled for concurrent access"
        test: "test_wal_mode_enabled"
      - ac_id: "AC-AR-002-03"
        description: "Query performance <1ms"
        test: "test_query_performance"
    components:
      - "DatabaseManager"
      - "ACIndexRepository"
    dependencies:
      - "AR-001"

  AR-003:
    id: "AR-003"
    title: "Auto-Wired Governance Decorators"
    status: "APPROVED"
    priority: "HIGH"
    phase: 1
    description: |
      Python decorators that auto-wire governance evaluation:
      @governance_enforced - Applies all applicable rules
      @audit_logged - Records operation to audit trail
      @evidence_captured - Captures evidence bundle
    acceptance_criteria:
      - ac_id: "AC-AR-003-01"
        description: "@governance_enforced decorator validates all rules"
        test: "test_governance_decorator"
      - ac_id: "AC-AR-003-02"
        description: "@audit_logged decorator records to governance.db"
        test: "test_audit_decorator"
      - ac_id: "AC-AR-003-03"
        description: "Decorators composable (@governance_enforced + @audit_logged)"
        test: "test_decorator_composition"
    components:
      - "GovernanceDecorator"
      - "AuditDecorator"
      - "EvidenceDecorator"
    dependencies:
      - "AR-001"
      - "AR-002"

  AR-004:
    id: "AR-004"
    title: "Tiered Logging Architecture"
    status: "APPROVED"
    priority: "MEDIUM"
    phase: 1
    description: |
      Structured logging with tiers:
      - AUDIT: Immutable audit trail (goes to governance.db)
      - TRACE: Detailed operation tracing (for debugging)
      - STANDARD: Normal application logging
    acceptance_criteria:
      - ac_id: "AC-AR-004-01"
        description: "AUDIT logs written to governance.db"
        test: "test_audit_to_db"
      - ac_id: "AC-AR-004-02"
        description: "Log levels configurable per tier"
        test: "test_log_level_config"
      - ac_id: "AC-AR-004-03"
        description: "Structured JSON format for all logs"
        test: "test_structured_logging"
    components:
      - "TieredLogger"
      - "AuditLogWriter"
    dependencies:
      - "AR-002"

  AR-005:
    id: "AR-005"
    title: "Production Mode Control"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 1
    description: |
      Environment-based mode control:
      - PRODUCTION: All governance enforced, no bypass
      - STAGING: Governance enforced, warnings logged
      - DEVELOPMENT: Governance advisory, can be bypassed with explicit flag
    acceptance_criteria:
      - ac_id: "AC-AR-005-01"
        description: "Mode determined from CORTEX_ENV environment variable"
        test: "test_env_mode_detection"
      - ac_id: "AC-AR-005-02"
        description: "PRODUCTION mode prevents all governance bypass"
        test: "test_production_no_bypass"
      - ac_id: "AC-AR-005-03"
        description: "Mode logged at startup"
        test: "test_mode_logged_startup"
    components:
      - "ModeController"
      - "EnvironmentConfig"
    dependencies: []

  AR-006:
    id: "AR-006"
    title: "Orchestrator Architecture"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 2
    description: |
      Layered orchestrator architecture:
      - MasterOrchestrator: Coordinates all sub-orchestrators
      - DomainOrchestrators: Domain-specific logic (governance, audit, evidence)
      - TaskOrchestrators: Individual task execution
      All orchestrators auto-registered via decorator pattern.
    acceptance_criteria:
      - ac_id: "AC-AR-006-01"
        description: "MasterOrchestrator coordinates domain orchestrators"
        test: "test_master_orchestrator_coordination"
      - ac_id: "AC-AR-006-02"
        description: "Orchestrators auto-registered via @orchestrator decorator"
        test: "test_orchestrator_auto_registration"
      - ac_id: "AC-AR-006-03"
        description: "Orchestrator registry queryable by domain"
        test: "test_registry_query_by_domain"
    components:
      - "MasterOrchestrator"
      - "OrchestratorRegistry"
      - "OrchestratorDecorator"
    dependencies:
      - "AR-003"

  AR-007:
    id: "AR-007"
    title: "MCP Server Integration"
    status: "APPROVED"
    priority: "HIGH"
    phase: 2
    description: |
      Model Context Protocol server for LLM integration:
      - Exposes orchestrators as MCP tools
      - Provides governance context to LLM
      - Enables structured communication
    acceptance_criteria:
      - ac_id: "AC-AR-007-01"
        description: "MCP server starts and accepts connections"
        test: "test_mcp_server_startup"
      - ac_id: "AC-AR-007-02"
        description: "Orchestrators exposed as MCP tools"
        test: "test_orchestrators_as_mcp_tools"
      - ac_id: "AC-AR-007-03"
        description: "Governance context included in MCP responses"
        test: "test_governance_in_mcp_response"
    components:
      - "MCPServer"
      - "ToolRegistry"
      - "ContextProvider"
    dependencies:
      - "AR-006"

  AR-008:
    id: "AR-008"
    title: "Legacy Pattern Adaptation"
    status: "APPROVED"
    priority: "MEDIUM"
    phase: 1
    description: |
      Adapt proven patterns from previous iterations:
      - Evidence bundle structure
      - Audit log format
      - Governance rule schema
      - State machine patterns
    acceptance_criteria:
      - ac_id: "AC-AR-008-01"
        description: "Evidence bundle schema compatible with legacy format"
        test: "test_evidence_schema_compatibility"
      - ac_id: "AC-AR-008-02"
        description: "Audit log format follows established patterns"
        test: "test_audit_format_compatibility"
      - ac_id: "AC-AR-008-03"
