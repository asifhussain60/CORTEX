      Migrate to nested folder structure:
      - src/orchestrators/core/ - Core orchestrators
      - src/orchestrators/domain/ - Domain orchestrators
      - src/orchestrators/custom/ - Custom orchestrators
      - src/infrastructure/ - Infrastructure components
