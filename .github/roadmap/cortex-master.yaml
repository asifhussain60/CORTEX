  AR-011:
    id: "AR-011"
    title: "Reference Orchestrator Validation"
    status: "APPROVED"
    priority: "CRITICAL"
    phase: 1
    description: |
      Scaffold one domain orchestrator (PlanningOrchestrator) end-to-end to validate
      the full chain BEFORE scaling to 20+ orchestrators:
      - Registry registration via @orchestrator decorator
