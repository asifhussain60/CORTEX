<!-- CORTEX Logo - SVG Implementation -->
<!-- This SVG serves as cortex-logo.png, cortex-logo-white.png, etc. -->
<!-- Use CSS classes to swap colors based on theme -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .cortex-logo-bg { fill: #0ea5e9; }
      .cortex-logo-accent { fill: #10b981; }
      .cortex-logo-text { font-family: system-ui, sans-serif; font-weight: bold; fill: #ffffff; }
      
      /* Dark mode variant */
      .dark .cortex-logo-bg { fill: #ffffff; }
      .dark .cortex-logo-text { fill: #0ea5e9; }
    </style>
  </defs>
  
  <!-- Background circle (cyan) -->
  <circle cx="100" cy="100" r="95" class="cortex-logo-bg" opacity="0.1" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Three neural nodes -->
  <circle cx="70" cy="80" r="15" class="cortex-logo-bg" opacity="0.8"/>
  <circle cx="100" cy="60" r="18" class="cortex-logo-bg"/>
  <circle cx="130" cy="80" r="15" class="cortex-logo-accent" opacity="0.9"/>
  
  <!-- Connection lines (neural pathways) -->
  <line x1="70" y1="80" x2="100" y2="60" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="60" x2="130" y2="80" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="80" x2="130" y2="80" stroke="#a78bfa" stroke-width="1" opacity="0.4" stroke-dasharray="4"/>
  
  <!-- Lower nodes (tiers) -->
  <circle cx="60" cy="130" r="12" class="cortex-logo-bg" opacity="0.6"/>
  <circle cx="100" cy="145" r="14" class="cortex-logo-accent" opacity="0.7"/>
  <circle cx="140" cy="130" r="12" class="cortex-logo-bg" opacity="0.6"/>
  
  <!-- Tier connections -->
  <line x1="70" y1="80" x2="60" y2="130" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="60" x2="100" y2="145" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="80" x2="140" y2="130" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Text label -->
  <text x="100" y="175" text-anchor="middle" class="cortex-logo-text" font-size="10" letter-spacing="1">CORTEX</text>
</svg>
