name: Autonomous Documentation Restructuring

on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 2 AM UTC
  
  push:
    branches:
      - main
      - develop
    paths:
      - '**.md'
      - '**.txt'
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  
  workflow_dispatch:

jobs:
  restructure:
    runs-on: ubuntu-latest
    name: Document Restructuring
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run agent
        id: agent
        run: |
          python .github/agents/doc-restructuring-agent.py
          
          if [ -f .github/agents/doc-restructuring-report.json ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "CORTEX Bot"
          git config user.email "bot@cortex.local"
          git add -A
          git commit -m "Autonomous: Documentation restructuring

- Phase 0: File discovery
- Phase 1: Auto-categorization  
- Phase 2: File reorganization
- Phase 3: Report generation

Details in .github/agents/doc-restructuring-report.json"
          git push
      
      - name: Upload log
        if: always() && steps.agent.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: restructuring-log
          path: .github/agents/doc-restructuring.log
          retention-days: 30
      
      - name: Upload report
        if: always() && steps.agent.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: restructuring-report
          path: .github/agents/doc-restructuring-report.json
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          echo "## Documentation Restructuring" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.agent.outputs.success }}" = "true" ]; then
            echo "✓ Restructuring completed" >> $GITHUB_STEP_SUMMARY
            echo "✓ Artifacts generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ Restructuring failed or skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for details." >> $GITHUB_STEP_SUMMARY
