name: CORTEX Production Readiness Verification

on:
  push:
    branches: [CORTEX, main, develop]
    paths:
      - 'cortex/**'
      - 'cortex_brain/**'
      - 'tests/unit/orchestrators/**'
      - '.github/workflows/readiness-verification.yml'
  pull_request:
    branches: [CORTEX, main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  readiness-verification:
    name: CORTEX Readiness Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CORE-035 Enforcement Check
        id: core035
        continue-on-error: true
        run: |
          echo "::group::CORE-035: Single Canonical Implementation"
          python cortex/ci_cd/enforce_core_035.py --verbose || echo "CORE-035 violations detected"
          echo "::endgroup::"

      - name: Run Production Readiness Verification
        id: verify_prod_ready
        continue-on-error: true
        run: |
          echo "::group::Production Readiness Verification"
          PYTHONPATH=. python _workspaces/docker-plan/verify_prod_ready.py --skip-docker --json-output prod-ready-results.json --verbose
          echo "::endgroup::"

      - name: Upload Production Readiness Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-results
          path: prod-ready-results.json
          retention-days: 30

      - name: Run Module Discovery Tests
        id: discovery
        continue-on-error: true
        run: |
          echo "::group::Module Discovery Tests"
          python -m pytest tests/unit/orchestrators/test_orchestrator_discovery.py -v --tb=short
          echo "::endgroup::"

      - name: Run Module Dependency Tests
        id: dependencies
        continue-on-error: true
        run: |
          echo "::group::Module Dependency Tests"
          python -m pytest tests/unit/orchestrators/test_module_dependencies.py -v --tb=short
          echo "::endgroup::"

      - name: Run Production Readiness Tests
        id: readiness
        continue-on-error: true
        run: |
          echo "::group::Production Readiness Tests"
          python -m pytest tests/unit/orchestrators/test_production_readiness.py -v --tb=short
          echo "::endgroup::"

      - name: Run CORE-035 Test Suite
        id: core035_tests
        continue-on-error: true
        run: |
          echo "::group::CORE-035 Enforcement Tests"
          python -m pytest tests/unit/ci_cd/test_core_035_enforcement.py -v --tb=short
          echo "::endgroup::"

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## CORTEX Production Readiness Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Production Readiness Checks" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify_prod_ready.outcome }}" == "success" ]; then
            echo "| Production Readiness | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production Readiness | WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.core035.outcome }}" == "success" ]; then
            echo "| CORE-035 Enforcement | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CORE-035 Enforcement | WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.discovery.outcome }}" == "success" ]; then
            echo "| Module Discovery | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Module Discovery | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.dependencies.outcome }}" == "success" ]; then
            echo "| Module Dependencies | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Module Dependencies | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.readiness.outcome }}" == "success" ]; then
            echo "| Production Readiness Tests | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production Readiness Tests | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.core035_tests.outcome }}" == "success" ]; then
            echo "| CORE-035 Test Suite | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CORE-035 Test Suite | WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const prodReady = '${{ steps.verify_prod_ready.outcome }}' === 'success' ? 'PASSED' : 'WARNINGS';
            const core035 = '${{ steps.core035.outcome }}' === 'success' ? 'PASSED' : 'WARNINGS';
            const discovery = '${{ steps.discovery.outcome }}' === 'success' ? 'PASSED' : 'FAILED';
            const dependencies = '${{ steps.dependencies.outcome }}' === 'success' ? 'PASSED' : 'FAILED';
            const readiness = '${{ steps.readiness.outcome }}' === 'success' ? 'PASSED' : 'FAILED';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CORTEX Production Readiness Verification
            
            ### Production Readiness Checks
            - Production Readiness: ${prodReady}
            - CORE-035 Enforcement: ${core035}
            
            ### Test Suites
            - Module Discovery: ${discovery}
            - Module Dependencies: ${dependencies}
            - Production Readiness Tests: ${readiness}
            
            [View full workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Determine Final Status
        if: always()
        run: |
          PASSED=0
          TOTAL=5
          
          [ "${{ steps.verify_prod_ready.outcome }}" == "success" ] && ((PASSED++))
          [ "${{ steps.core035.outcome }}" == "success" ] && ((PASSED++))
          [ "${{ steps.discovery.outcome }}" == "success" ] && ((PASSED++))
          [ "${{ steps.dependencies.outcome }}" == "success" ] && ((PASSED++))
          [ "${{ steps.readiness.outcome }}" == "success" ] && ((PASSED++))
          
          PERCENTAGE=$((PASSED * 100 / TOTAL))
          
          echo "Final Score: $PASSED/$TOTAL ($PERCENTAGE%)"
          
          if [ $PERCENTAGE -lt 60 ]; then
            echo "::error::Production readiness below threshold"
            exit 1
          fi
