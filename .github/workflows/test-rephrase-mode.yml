name: REPHRASE Mode Enforcement Tests

on:
  push:
    branches: [ main, CORTEX ]
    paths:
      - 'cortex/**/*.py'
      - 'tests/e2e/test_rephrase_mode_golden.py'
      - 'tests/integration/test_rephrase_mcp_integration.py'
      - '.github/prompts/cortex-architect.prompt.md'
      - '.github/agents/core/request-rephrase-orchestrator.md'
  pull_request:
    branches: [ main, CORTEX ]
    paths:
      - 'cortex/**/*.py'
      - 'tests/e2e/test_rephrase_mode_golden.py'
      - 'tests/integration/test_rephrase_mcp_integration.py'

jobs:
  golden-tests:
    name: REPHRASE Golden Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
        
    - name: Run golden tests
      run: |
        pytest tests/e2e/test_rephrase_mode_golden.py \
          -v \
          --tb=short \
          --junitxml=test-results/rephrase-golden-junit.xml \
          --cov=cortex \
          --cov-report=xml:coverage-golden.xml \
          --cov-report=term-missing
          
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rephrase-golden-test-results
        path: test-results/
        
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rephrase-golden-coverage
        path: coverage-golden.xml

  integration-tests:
    name: REPHRASE MCP Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
        
    - name: Run integration tests (MCP disabled)
      run: |
        # Run without MCP for basic validation
        pytest tests/integration/test_rephrase_mcp_integration.py \
          -v \
          --tb=short \
          --junitxml=test-results/rephrase-integration-junit.xml
          
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rephrase-integration-test-results
        path: test-results/

  enforcement-report:
    name: Generate Enforcement Report
    runs-on: ubuntu-latest
    needs: [golden-tests, integration-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download golden test results
      uses: actions/download-artifact@v4
      with:
        name: rephrase-golden-test-results
        path: test-results/golden/
        
    - name: Download integration test results
      uses: actions/download-artifact@v4
      with:
        name: rephrase-integration-test-results
        path: test-results/integration/
        
    - name: Generate enforcement report
      run: |
        echo "# REPHRASE Mode Enforcement Report" > enforcement-report.md
        echo "" >> enforcement-report.md
        echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> enforcement-report.md
        echo "**Commit:** ${{ github.sha }}" >> enforcement-report.md
        echo "**Branch:** ${{ github.ref_name }}" >> enforcement-report.md
        echo "" >> enforcement-report.md
        echo "## Golden Tests" >> enforcement-report.md
        echo "" >> enforcement-report.md
        
        if [ -f test-results/golden/rephrase-golden-junit.xml ]; then
          # Parse JUnit XML for test counts
          tests=$(grep -o 'tests="[0-9]*"' test-results/golden/rephrase-golden-junit.xml | grep -o '[0-9]*' | head -1)
          failures=$(grep -o 'failures="[0-9]*"' test-results/golden/rephrase-golden-junit.xml | grep -o '[0-9]*' | head -1)
          errors=$(grep -o 'errors="[0-9]*"' test-results/golden/rephrase-golden-junit.xml | grep -o '[0-9]*' | head -1)
          
          echo "- **Total Tests:** $tests" >> enforcement-report.md
          echo "- **Failures:** $failures" >> enforcement-report.md
          echo "- **Errors:** $errors" >> enforcement-report.md
          
          if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
            echo "- **Status:** ✅ ALL PASSED" >> enforcement-report.md
          else
            echo "- **Status:** ❌ FAILURES DETECTED" >> enforcement-report.md
          fi
        else
          echo "- **Status:** ⚠️ No results file found" >> enforcement-report.md
        fi
        
        echo "" >> enforcement-report.md
        echo "## Integration Tests" >> enforcement-report.md
        echo "" >> enforcement-report.md
        
        if [ -f test-results/integration/rephrase-integration-junit.xml ]; then
          tests=$(grep -o 'tests="[0-9]*"' test-results/integration/rephrase-integration-junit.xml | grep -o '[0-9]*' | head -1)
          skipped=$(grep -o 'skipped="[0-9]*"' test-results/integration/rephrase-integration-junit.xml | grep -o '[0-9]*' | head -1)
          
          echo "- **Total Tests:** $tests" >> enforcement-report.md
          echo "- **Skipped (MCP not enabled):** $skipped" >> enforcement-report.md
        else
          echo "- **Status:** ⚠️ No results file found" >> enforcement-report.md
        fi
        
        echo "" >> enforcement-report.md
        echo "## Enforcement Rules Validated" >> enforcement-report.md
        echo "" >> enforcement-report.md
        echo "- GT-ENFORCE-001: Single paragraph output" >> enforcement-report.md
        echo "- GT-ENFORCE-002: No markdown formatting" >> enforcement-report.md
        echo "- GT-ENFORCE-003: Filler words removed" >> enforcement-report.md
        echo "- GT-ENFORCE-004: CORTEX context present" >> enforcement-report.md
        echo "- GT-ENFORCE-005: Copy-pasteable format" >> enforcement-report.md
        echo "- GT-ENFORCE-006: No file I/O drift" >> enforcement-report.md
        echo "- GT-ENFORCE-007: Safe fallback (REQUIRES_REPO_CONTEXT)" >> enforcement-report.md
        echo "- GT-ENFORCE-008: Mode isolation" >> enforcement-report.md
        echo "- GT-ENFORCE-009: Idempotency" >> enforcement-report.md
        
        cat enforcement-report.md
        
    - name: Upload enforcement report
      uses: actions/upload-artifact@v4
      with:
        name: rephrase-enforcement-report
        path: enforcement-report.md
        
    - name: Comment PR with results (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('enforcement-report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
