name: CORTEX CI - Mock Detection

on:
  push:
    branches: [ main, develop, CORTEX-3.0 ]
    paths:
      - 'src/**/*.py'
      - 'scripts/verify_no_mocks.py'
      - '.github/workflows/no-mocks.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**/*.py'
      - 'scripts/verify_no_mocks.py'

jobs:
  verify-no-mocks:
    name: Verify No Mock Objects in Production Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run mock detection
        run: |
          python scripts/verify_no_mocks.py --directory .
      
      - name: Report results
        if: failure()
        run: |
          echo "::error::Mock objects detected in production code (src/)"
          echo "::error::Remove unittest.mock imports from production code"
          echo "::error::Tests should use real implementations, not mocks"
