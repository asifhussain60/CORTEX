name: Documentation Auto-Refresh

# ============================================================
# DOC-REFRESH-001 — GitHub Pages Auto-Refresh
# Authority: cortex-registry/workflows/templates/internal/documentation-refresh-pipeline.yaml
# ============================================================

on:
  push:
    branches: [main, CORTEX]
    paths:
      - 'cortex-registry/knowledge/**'
      - 'cortex-registry/cortex-master.yaml'
      - 'cortex/**/*.py'
  schedule:
    # Weekly full refresh — Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - discovery
          - generation
          - validation

# Only one doc-refresh at a time — cancel stale runs
concurrency:
  group: doc-refresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  # ──────────────────────────────────────────────────────────
  # STAGE 0: Pre-Flight Governance Check
  # ──────────────────────────────────────────────────────────
  preflight:
    name: "Stage 0 — Pre-Flight Governance"
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_json.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: CSS zero-inline gate (P0)
        run: |
          violations=$(grep -r 'style=' docs/**/*.html 2>/dev/null | wc -l)
          echo "CSS inline style violations: $violations"
          if [ "$violations" -gt 0 ]; then
            echo "❌ P0 GATE FAIL: $violations inline style= attributes found in HTML"
            grep -rn 'style=' docs/**/*.html 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ CSS zero-inline gate: PASS"

      - name: No deprecated paths in HTML
        run: |
          violations=$(grep -r 'href.*views/' docs/**/*.html 2>/dev/null | wc -l)
          if [ "$violations" -gt 0 ]; then
            echo "⚠️  P1 WARNING: $violations references to deprecated views/ path"
            grep -rn 'href.*views/' docs/**/*.html 2>/dev/null
          else
            echo "✅ No deprecated views/ path references"
          fi

      - name: Check for changes to trigger generation
        id: check_json
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '(cortex-registry/knowledge|cortex-master\.yaml|cortex/.*\.py)'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────
  # STAGE 1+2: Discovery + Generation
  # ──────────────────────────────────────────────────────────
  generate:
    name: "Stage 1+2 — Discovery & Generation"
    runs-on: ubuntu-latest
    needs: preflight
    if: |
      needs.preflight.outputs.has_changes == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Stage 1 — Discovery (git + registry + live code)
        working-directory: docs
        run: |
          echo "🔍 Running discovery scan..."
          python pipeline/discover.py --output ../.cortex-runtime/doc-discovery/ || true
          echo "✅ Discovery complete"

      - name: Stage 2 — Generate JSON catalogs
        working-directory: docs
        run: |
          echo "⚙️  Generating data/*.json catalogs..."
          python pipeline/build.py || true
          python pipeline/extract-json.py || true
          echo "✅ Generation complete"

      - name: Validate orchestrator count
        run: |
          count=$(python -c "import json; d=json.load(open('docs/data/orchestrators.json')); print(len(d))" 2>/dev/null || echo "0")
          echo "Orchestrator count: $count"
          if [ "$count" -lt 1 ]; then
            echo "⚠️  P1 WARNING: orchestrators.json has $count entries (expected 27)"
          else
            echo "✅ orchestrators.json: $count entries"
          fi

      - name: Validate MCP tool count
        run: |
          count=$(python -c "import json; d=json.load(open('docs/data/mcp-tools.json')); print(len(d))" 2>/dev/null || echo "0")
          echo "MCP tool count: $count"
          if [ "$count" -lt 1 ]; then
            echo "⚠️  P1 WARNING: mcp-tools.json has $count entries (expected 26)"
          else
            echo "✅ mcp-tools.json: $count entries"
          fi

      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-discovery-${{ github.run_id }}
          path: .cortex-runtime/doc-discovery/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: doc-data-${{ github.run_id }}
          path: docs/data/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # STAGE 3: Validation
  # ──────────────────────────────────────────────────────────
  validate:
    name: "Stage 3 — Validation"
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: doc-data-${{ github.run_id }}
          path: docs/data/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: CSS zero-inline final gate
        run: |
          violations=$(grep -r 'style=' docs/**/*.html 2>/dev/null | wc -l)
          echo "CSS inline style violations: $violations"
          [ "$violations" -eq 0 ] && echo "✅ PASS" || (echo "❌ FAIL" && exit 1)

      - name: JSON schema validation
        working-directory: docs
        run: |
          python pipeline/validate.py --check json_schemas || true
          echo "✅ JSON validation complete"

      - name: Internal link check (advisory)
        working-directory: docs
        run: |
          python pipeline/validate.py --check internal_links || true
          echo "✅ Link check complete"

  # ──────────────────────────────────────────────────────────
  # STAGE 4: Deployment (Commit + Push)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: "Stage 4 — Deploy JSON Updates"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: doc-data-${{ github.run_id }}
          path: docs/data/

      - name: Check for data changes
        id: check_diff
        run: |
          git diff --name-only docs/data/ | head -20
          if git diff --quiet docs/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No changes to docs/data/ — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit JSON catalog updates
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "CORTEX Doc Refresh Bot"
          git config user.email "cortex-docs@asifhussain60.github.io"
          git add docs/data/*.json
          git commit -m "docs: auto-refresh JSON catalogs [DOC-REFRESH-001] [skip ci]

          Triggered by: ${{ github.event_name }}
          Ref: ${{ github.ref }}
          Run: ${{ github.run_id }}"
          git push origin HEAD
          echo "✅ Deployed: docs/data/*.json updated"
