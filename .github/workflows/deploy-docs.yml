name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - CORTEX-3.0
      - CORTEX-4.0
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'cortex-brain/admin/documentation/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git info plugin
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies
      
      - name: Cache MkDocs build
        uses: actions/cache@v4
        with:
          path: |
            .cache
            site
          key: mkdocs-${{ runner.os }}-${{ hashFiles('mkdocs.yml', 'docs/**') }}
          restore-keys: |
            mkdocs-${{ runner.os }}-
      
      - name: Install MkDocs and dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs
          pip install mkdocs-material
          pip install mkdocs-mermaid2-plugin
          pip install pymdown-extensions
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-minify-plugin
      
      - name: Install CORTEX dependencies (for generators)
        run: |
          pip install -r requirements.txt
      
      - name: Run IntelligentNavigationGenerator
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('cortex-brain/admin')))
          from documentation.generators.intelligent_navigation_generator import IntelligentNavigationGenerator
          
          generator = IntelligentNavigationGenerator(
              docs_path=Path('docs'),
              mkdocs_path=Path('mkdocs.yml')
          )
          generator.update_mkdocs_navigation()
          print('✅ Navigation structure updated')
          "
      
      - name: Run PageTemplateGenerator (API docs)
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('cortex-brain/admin')))
          from documentation.generators.page_template_generator import PageTemplateGenerator
          
          generator = PageTemplateGenerator(workspace_path=Path('.'))
          
          # Generate API reference pages
          modules = generator.discover_python_modules()
          print(f'Found {len(modules)} Python modules')
          
          api_docs_dir = Path('docs/api')
          api_docs_dir.mkdir(exist_ok=True)
          
          for module_path in modules[:5]:  # Limit to 5 for demo
              api_page = generator.generate_api_reference(module_path)
              output_file = api_docs_dir / f'{module_path.stem}.md'
              output_file.write_text(api_page)
              print(f'✅ Generated {output_file}')
          
          print(f'✅ API documentation generated')
          "
      
      - name: Run PageTemplateGenerator (Operation guides)
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('cortex-brain/admin')))
          from documentation.generators.page_template_generator import PageTemplateGenerator
          
          generator = PageTemplateGenerator(workspace_path=Path('.'))
          
          # Generate operation guide pages
          operations_file = Path('cortex-operations.yaml')
          if operations_file.exists():
              guides = generator.generate_operation_guides(operations_file)
              print(f'Found {len(guides)} operations')
              
              ops_docs_dir = Path('docs/operations/guides')
              ops_docs_dir.mkdir(parents=True, exist_ok=True)
              
              for guide in guides[:10]:  # Limit to 10 for demo
                  output_file = ops_docs_dir / f\"{guide['name']}.md\"
                  output_file.write_text(guide['content'])
                  print(f\"✅ Generated {output_file}\")
              
              print(f'✅ Operation guides generated')
          else:
              print('⚠️  No cortex-operations.yaml found')
          "
      
      - name: Build MkDocs site
        run: |
          mkdocs build --verbose --strict
      
      - name: Verify build output
        run: |
          if [ ! -d "site" ]; then
            echo "::error::Build failed - site directory not found"
            exit 1
          fi
          
          file_count=$(find site -type f | wc -l)
          echo "✅ Built $file_count files"
          
          if [ $file_count -lt 10 ]; then
            echo "::error::Build produced too few files ($file_count)"
            exit 1
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy docs from ${{ github.sha }}'
      
      - name: Report deployment
        if: success()
        run: |
          echo "::notice::✅ Documentation deployed successfully!"
          echo "::notice::📝 Site URL: https://asifhussain60.github.io/CORTEX/"
      
      - name: Report failure
        if: failure()
        run: |
          echo "::error::❌ Documentation deployment failed"
          echo "::error::Check the logs above for details"

  # Optional: Lighthouse performance check
  lighthouse:
    name: Lighthouse Performance Check
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/CORTEX-4.0' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Wait for deployment
        run: sleep 30
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://asifhussain60.github.io/CORTEX/
          uploadArtifacts: true
          temporaryPublicStorage: true
