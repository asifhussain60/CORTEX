name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - CORTEX-4.0
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-html:
    name: Deploy HTML Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify docs directory
        run: |
          echo "📁 Checking docs directory..."
          ls -la docs/
          if [ ! -f "docs/index.html" ]; then
            echo "::error::docs/index.html not found"
            exit 1
          fi
          echo "✅ Found index.html"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy CORTEX 4.0 docs from ${{ github.sha }}'
          cname: false
      
      - name: Report success
        if: success()
        run: |
          echo "::notice::✅ Documentation deployed successfully!"
          echo "::notice::📝 Site URL: https://asifhussain60.github.io/CORTEX/"
