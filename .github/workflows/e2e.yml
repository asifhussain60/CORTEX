name: E2E Validation Tests

on:
  push:
    branches: [CORTEX, stable]
  pull_request:
    branches: [CORTEX, stable]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3 - pinned SHA (Arnica artipacked fix)
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4 - pinned SHA (Arnica artipacked fix)
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run smoke tests
        run: pytest tests/e2e/smoke/ -v

  integration-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3 - pinned SHA (Arnica artipacked fix)
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4 - pinned SHA (Arnica artipacked fix)
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run integration tests with coverage
        run: pytest tests/integration/ --cov=cortex --cov-report=term

  chaos-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3 - pinned SHA (Arnica artipacked fix)
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4 - pinned SHA (Arnica artipacked fix)
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run chaos tests
        run: pytest tests/chaos/ -v
