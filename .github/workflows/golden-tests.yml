name: Golden Test Suite

on:
  push:
    branches: [ CORTEX ]
    paths:
      - 'tests/orchestrators/**'
      - 'cortex/orchestrators/**'
  pull_request:
    branches: [ CORTEX ]
    paths:
      - 'tests/orchestrators/**'
      - 'cortex/orchestrators/**'

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check file naming (CORE-028)
        run: |
          python3 scripts/enforce-test-naming.py --check
      
      - name: Run structure validation
        run: |
          pytest tests/orchestrators/test-structure-validation.py -v
      
      - name: Run golden tests
        run: |
          pytest tests/orchestrators/ -v --maxfail=5 --tb=short
      
      - name: Check coverage
        run: |
          pytest tests/orchestrators/ --cov=cortex --cov-report=term --cov-fail-under=85
