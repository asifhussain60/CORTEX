name: Golden Test Suite

on:
  push:
    branches: [ CORTEX ]
    paths:
      - 'tests/orchestrators/**'
      - 'cortex/orchestrators/**'
  pull_request:
    branches: [ CORTEX ]
    paths:
      - 'tests/orchestrators/**'
      - 'cortex/orchestrators/**'

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3 - pinned SHA (Arnica artipacked fix)
      
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4 - pinned SHA (Arnica artipacked fix)
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check file naming (CORE-028)
        run: |
          python3 scripts/enforce-test-naming.py --check
      
      - name: Run structure validation
        run: |
          pytest tests/orchestrators/test-structure-validation.py -v
      
      - name: Run golden tests
        run: |
          pytest tests/orchestrators/ -v --maxfail=5 --tb=short
      
      - name: Check coverage
        run: |
          pytest tests/orchestrators/ --cov=cortex --cov-report=term --cov-fail-under=85
