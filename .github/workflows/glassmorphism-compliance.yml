name: Glassmorphism Compliance CI

on:
  push:
    branches: [ main, CORTEX-5.0 ]
    paths:
      - 'docs/**/*.html'
      - 'docs/assets/css/**/*.css'
  pull_request:
    branches: [ main, CORTEX-5.0 ]
    paths:
      - 'docs/**/*.html'
      - 'docs/assets/css/**/*.css'

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 lxml
        
    - name: Run inline style validator
      id: inline-styles
      run: |
        python << 'EOF'
        import re
        import sys
        from pathlib import Path
        
        docs_dir = Path('docs')
        html_files = list(docs_dir.rglob('*.html'))
        
        violations = []
        for html_file in html_files:
            content = html_file.read_text(encoding='utf-8')
            style_matches = re.findall(r'style\s*=\s*["\'][^"\']+["\']', content)
            
            if style_matches:
                violations.append(f"{html_file}: {len(style_matches)} inline style(s)")
        
        if violations:
            print("❌ Inline style violations found:")
            for v in violations:
                print(f"  {v}")
            sys.exit(1)
        else:
            print("✅ No inline styles detected")
        EOF
      
    - name: Run Font Awesome prefix validator
      id: fa-prefix
      run: |
        python << 'EOF'
        import re
        import sys
        from pathlib import Path
        
        docs_dir = Path('docs')
        html_files = list(docs_dir.rglob('*.html'))
        
        violations = []
        for html_file in html_files:
            content = html_file.read_text(encoding='utf-8')
            
            # Find icons without proper prefix
            bad_icons = re.findall(r'<i[^>]*class="[^"]*\bfa-[a-z\-]+[^"]*"[^>]*>', content)
            
            for match in bad_icons:
                if not re.search(r'\b(fas|far|fab|fal|fad)\b', match):
                    violations.append(f"{html_file.name}: {match[:60]}...")
        
        if violations:
            print("❌ Font Awesome prefix violations:")
            for v in violations[:10]:  # Limit output
                print(f"  {v}")
            if len(violations) > 10:
                print(f"  ... and {len(violations) - 10} more")
            sys.exit(1)
        else:
            print("✅ All Font Awesome icons have proper prefixes")
        EOF
      
    - name: Run CSS duplicate detector
      id: css-duplicates
      run: |
        python << 'EOF'
        import re
        from pathlib import Path
        from collections import defaultdict
        
        css_dir = Path('docs/assets/css')
        css_files = list(css_dir.glob('*.css'))
        
        total_duplicates = 0
        for css_file in css_files:
            content = css_file.read_text(encoding='utf-8')
            classes = re.findall(r'^\.([\w\-_]+)\s*\{', content, re.MULTILINE)
            
            class_counts = defaultdict(int)
            for cls in classes:
                class_counts[cls] += 1
            
            duplicates = {k: v for k, v in class_counts.items() if v > 1}
            
            if duplicates:
                print(f"⚠️  {css_file.name}: {len(duplicates)} duplicate class(es)")
                total_duplicates += len(duplicates)
        
        if total_duplicates > 0:
            print(f"\n⚠️  Total duplicates: {total_duplicates}")
            print("   (Not blocking commit, but consider cleanup)")
        else:
            print("✅ No CSS duplicates found")
        EOF
      continue-on-error: true
      
    - name: Run glassmorphism class validator
      id: glass-classes
      run: |
        python << 'EOF'
        import re
        from pathlib import Path
        
        docs_dir = Path('docs')
        html_files = list(docs_dir.rglob('*.html'))
        
        warnings = []
        for html_file in html_files:
            content = html_file.read_text(encoding='utf-8')
            
            # Check for cards without glassmorphism classes
            if re.search(r'<div[^>]*class="[^"]*card[^"]*"', content):
                if not re.search(r'glass-card-(clickable|display)', content):
                    warnings.append(f"{html_file.name}: Has cards but no glassmorphism classes")
        
        if warnings:
            print("⚠️  Glassmorphism class warnings:")
            for w in warnings[:10]:
                print(f"  {w}")
            if len(warnings) > 10:
                print(f"  ... and {len(warnings) - 10} more")
        else:
            print("✅ All card elements use glassmorphism classes")
        EOF
      continue-on-error: true
      
    - name: Generate compliance report
      if: always()
      run: |
        echo "# 🛡️ Glassmorphism Compliance Report" > compliance-report.md
        echo "" >> compliance-report.md
        echo "**Date:** $(date)" >> compliance-report.md
        echo "**Branch:** ${{ github.ref_name }}" >> compliance-report.md
        echo "**Commit:** ${{ github.sha }}" >> compliance-report.md
        echo "" >> compliance-report.md
        echo "## Validation Results" >> compliance-report.md
        echo "" >> compliance-report.md
        echo "| Check | Status |" >> compliance-report.md
        echo "|-------|--------|" >> compliance-report.md
        echo "| Inline Styles | ${{ steps.inline-styles.outcome }} |" >> compliance-report.md
        echo "| Font Awesome Prefixes | ${{ steps.fa-prefix.outcome }} |" >> compliance-report.md
        echo "| CSS Duplicates | ${{ steps.css-duplicates.outcome }} |" >> compliance-report.md
        echo "| Glassmorphism Classes | ${{ steps.glass-classes.outcome }} |" >> compliance-report.md
        
    - name: Upload compliance report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: compliance-report
        path: compliance-report.md
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('compliance-report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
