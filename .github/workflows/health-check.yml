name: CORTEX Health Check

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      agents:
        description: 'Agents to run (comma-separated, empty=all)'
        required: false
        default: ''

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 - pinned SHA (Arnica artipacked fix)
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 - pinned SHA (Arnica artipacked fix)
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install radon rope
      
      - name: Run CORTEX health check
        id: health
        env:
          # Inputs isolated to env vars to prevent shell injection (Arnica SAST fix)
          HEALTH_CHECK_AGENTS: ${{ github.event.inputs.agents }}
        run: |
          python -c "
          import os
          from pathlib import Path
          from cortex.mcp.tools.health_check_tool import cortex_health_check
          
          workspace = Path.cwd()
          agents_input = os.environ.get('HEALTH_CHECK_AGENTS', '')
          agents = agents_input.split(',') if agents_input else None
          
          result = cortex_health_check(str(workspace), agents=agents)
          
          print(f\"Health Score: {result['health_score']}\")
          print(f\"Total Issues: {result['total_issues']}\")
          print(f\"  Critical: {result['by_severity']['critical']}\")
          print(f\"  High: {result['by_severity']['high']}\")
          print(f\"  Medium: {result['by_severity']['medium']}\")
          print(f\"  Low: {result['by_severity']['low']}\")
          print()
          print('Agent Results:')
          for agent in result['agent_results']:
              print(f\"  - {agent['name']}: {agent['issues']} issues\")
          print()
          print('Recommendations:')
          for rec in result['recommendations']:
              print(f\"  {rec}\")
          
          # Set outputs
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f\"health_score={result['health_score']}\\n\")
              f.write(f\"total_issues={result['total_issues']}\\n\")
              f.write(f\"critical_issues={result['by_severity']['critical']}\\n\")
          "
      
      - name: Save full report
        if: always()
        run: |
          python -c "
          from pathlib import Path
          from cortex.mcp.tools.health_check_tool import cortex_health_check
          
          workspace = Path.cwd()
          result = cortex_health_check(str(workspace))
          
          # Save markdown report
          with open('health_report.md', 'w') as f:
              f.write(result['markdown_report'])
          "
      
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 - pinned SHA (Arnica artipacked fix)
        with:
          name: health-report-${{ github.run_number }}
          path: health_report.md
          retention-days: 30
      
      - name: Check for critical issues
        if: steps.health.outputs.critical_issues > 0
        env:
          # Step outputs isolated to env vars to prevent shell injection (Arnica SAST fix)
          CRITICAL_ISSUES: ${{ steps.health.outputs.critical_issues }}
          HEALTH_SCORE: ${{ steps.health.outputs.health_score }}
        run: |
          echo "::error::❌ Health check failed: $CRITICAL_ISSUES critical issues detected"
          echo "::error::Health Score: $HEALTH_SCORE/100"
          echo "See artifact for full report"
          exit 1
      
      - name: Post summary
        if: always()
        env:
          # Step outputs isolated to env vars to prevent shell injection (Arnica SAST fix)
          HEALTH_SCORE: ${{ steps.health.outputs.health_score }}
          TOTAL_ISSUES: ${{ steps.health.outputs.total_issues }}
          CRITICAL_ISSUES: ${{ steps.health.outputs.critical_issues }}
        run: |
          echo "### CORTEX Health Report 🏥" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health Score:** $HEALTH_SCORE/100" >> $GITHUB_STEP_SUMMARY
          echo "**Total Issues:** $TOTAL_ISSUES" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Issues:** $CRITICAL_ISSUES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for full markdown report." >> $GITHUB_STEP_SUMMARY
