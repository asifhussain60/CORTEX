name: Quality Gates

on:
  pull_request:
    branches: [ main, CORTEX-4.0 ]
  push:
    branches: [ main, CORTEX-4.0 ]

jobs:
  test-quality:
    name: Test Quality Gates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist mutmut
    
    - name: Run tests with coverage
      run: |
        pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=json \
          -n auto \
          --maxfail=0 \
          --tb=short \
          --durations=10
    
    - name: Check coverage thresholds
      run: |
        python scripts/quality-gates/check_coverage.py \
          --unit-threshold 95 \
          --integration-threshold 85 \
          --coverage-file coverage.json
    
    - name: Check test execution time
      run: |
        python scripts/quality-gates/check_test_time.py \
          --max-duration 300 \
          --results-file .pytest_cache/v/cache/lastfailed
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: true

  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install radon flake8 mypy pylint
    
    - name: Check complexity (radon)
      run: |
        radon cc src/ -a -nb -s
        python scripts/quality-gates/check_complexity.py \
          --max-complexity 15 \
          --directory src/
    
    - name: Check maintainability (radon)
      run: |
        radon mi src/ -nb -s
        python scripts/quality-gates/check_maintainability.py \
          --min-index 20 \
          --directory src/
    
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ \
          --config=.flake8 \
          --count \
          --show-source \
          --statistics
    
    - name: Type check with mypy
      run: |
        mypy src/ \
          --config-file=mypy.ini \
          --strict \
          --show-error-codes \
          --pretty
    
    - name: Generate code quality report
      run: |
        python scripts/quality-gates/generate_quality_report.py \
          --output cortex-brain/documents/reports/code-quality-report.md

  security:
    name: Security Quality Gates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit
    
    - name: Check dependencies (safety)
      run: |
        safety check --json --output safety-report.json || true
        python scripts/quality-gates/check_security.py \
          --safety-report safety-report.json \
          --max-severity high
    
    - name: Scan code (bandit)
      run: |
        bandit -r src/ \
          -f json \
          -o bandit-report.json \
          -ll \
          --severity-level medium
        python scripts/quality-gates/check_bandit.py \
          --report bandit-report.json \
          --max-high 0 \
          --max-critical 0
    
    - name: Check for secrets (truffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
    
    - name: SKULL Compliance Check
      run: |
        python scripts/quality-gates/check_skull_compliance.py \
          --rules cortex-brain/brain-protection-rules.yaml \
          --coverage-file coverage.json \
          --test-results .pytest_cache/

  documentation:
    name: Documentation Quality Gates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install mkdocs mkdocs-material interrogate
    
    - name: Check docstring coverage
      run: |
        interrogate src/ \
          -v \
          --fail-under=90 \
          --ignore-init-method \
          --ignore-magic \
          --exclude tests/
    
    - name: Build MkDocs
      run: |
        mkdocs build --strict
    
    - name: Validate PlantUML diagrams
      run: |
        python scripts/quality-gates/validate_diagrams.py \
          --diagrams-dir docs/architecture/
    
    - name: Check README completeness
      run: |
        python scripts/quality-gates/check_readme.py \
          --readme README.md \
          --required-sections "Installation,Usage,Configuration,Testing,Contributing,License"

  quality-dashboard:
    name: Update Quality Dashboard
    runs-on: ubuntu-latest
    needs: [test-quality, code-quality, security, documentation]
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Generate quality metrics
      run: |
        python scripts/quality-gates/generate_dashboard.py \
          --output cortex-brain/dashboards/quality-metrics.json
    
    - name: Commit quality metrics
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add cortex-brain/dashboards/quality-metrics.json
        git commit -m "📊 Update quality metrics dashboard" || echo "No changes to commit"
        git push
