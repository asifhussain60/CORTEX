name: Quality Gates

on:
  pull_request:
    branches: [ main, CORTEX-4.0 ]
  push:
    branches: [ main, CORTEX-4.0 ]

# Cancel in-progress runs for the same workflow
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-quality:
    name: Test Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent hanging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Cache test results
      uses: actions/cache@v4
      with:
        path: |
          .pytest_cache
          .coverage
        key: test-cache-${{ runner.os }}-${{ hashFiles('tests/**/*.py', 'src/**/*.py') }}
        restore-keys: |
          test-cache-${{ runner.os }}-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist pytest-timeout
    
    - name: Run tests with coverage (parallel)
      timeout-minutes: 15
      run: |
        pytest tests/ \
          --cov=src \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml \
          --cov-report=json \
          -n auto \
          --maxfail=3 \
          --tb=short \
          --durations=10 \
          --timeout=300 \
          -v
    
    - name: Check coverage thresholds
      continue-on-error: true
      run: |
        if [ -f scripts/quality-gates/check_coverage.py ]; then
          python scripts/quality-gates/check_coverage.py \
            --unit-threshold 95 \
            --integration-threshold 85 \
            --coverage-file coverage.json || echo "⚠️ Coverage check failed"
        else
          echo "⚠️ Coverage check script not found"
        fi
    
    - name: Upload coverage reports
      if: always()
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install radon flake8 mypy pylint
    
    - name: Lint with flake8 (fast check)
      continue-on-error: true
      run: |
        flake8 src/ tests/ \
          --config=.flake8 \
          --count \
          --statistics \
          --exit-zero
    
    - name: Check complexity (radon - fast)
      continue-on-error: true
      run: |
        radon cc src/ -a -nb -s || echo "⚠️ Complexity check failed"
    
    - name: Type check with mypy (key modules only)
      continue-on-error: true
      timeout-minutes: 5
      run: |
        mypy src/cortex_agents/ src/orchestrators/ \
          --config-file=mypy.ini \
          --show-error-codes \
          --no-strict \
          --ignore-missing-imports \
          2>&1 | head -100 || echo "⚠️ Type check had issues"

  security:
    name: Security Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check dependencies (safety)
      continue-on-error: true
      run: |
        safety check --json --output safety-report.json || echo "⚠️ Safety check found issues"
    
    - name: Scan code (bandit - fast mode)
      continue-on-error: true
      run: |
        bandit -r src/ \
          -f json \
          -o bandit-report.json \
          --severity-level medium \
          --confidence-level medium \
          2>&1 || echo "⚠️ Bandit found potential issues"

  documentation:
    name: Documentation Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'docs:')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material interrogate
    
    - name: Check docstring coverage (sample)
      continue-on-error: true
      run: |
        interrogate src/cortex_agents/ src/orchestrators/ \
          -v \
          --fail-under=70 \
          --ignore-init-method \
          --ignore-magic \
          2>&1 | head -50 || echo "⚠️ Docstring coverage below threshold"
    
    - name: Build MkDocs (validation)
      continue-on-error: true
      run: |
        mkdocs build 2>&1 | head -50 || echo "⚠️ MkDocs build had warnings"

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [test-quality, code-quality]
    if: always() && github.event_name == 'push'
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate summary
      run: |
        echo "## 📊 Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tests: ${{ needs.test-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build completed for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
