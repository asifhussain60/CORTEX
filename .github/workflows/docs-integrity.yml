name: Documentation Integrity

on:
  push:
    branches: [CORTEX, stable]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-integrity.yml'
      - 'scripts/check_docs_*.py'
      - 'cortex/orchestrators/internal/cortex_docs_orchestrator.py'
  pull_request:
    branches: [CORTEX, stable]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-integrity.yml'
      - 'scripts/check_docs_*.py'
      - 'cortex/orchestrators/internal/cortex_docs_orchestrator.py'

jobs:
  link-integrity:
    name: DOC-013 Link Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install result  # For Result[T, E] pattern
          
      - name: Run Documentation Link Audit
        id: link_audit
        run: |
          python3 scripts/check_docs_links.py
        continue-on-error: false
        
      - name: Upload Link Audit Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: reports/link-audit-*.json
          retention-days: 7

  responsive-audit:
    name: DOC-021 Responsive Design Audit  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install result  # For Result[T, E] pattern
          
      - name: Run Responsive Design Audit
        id: responsive_audit
        run: |
          python3 scripts/check_docs_responsive.py
        continue-on-error: false
        
      - name: Upload Responsive Audit Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: reports/responsive-audit-*.json
          retention-days: 7

  security-check:
    name: DOC-020 Link Security Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install result
          
      - name: Check for Security Violations
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from cortex.orchestrators.internal.cortex_docs_orchestrator import CortexDocsOrchestrator
          
          o = CortexDocsOrchestrator()
          result = o.execute('audit_documentation_links', entry_point='docs/index.html', mode='full', skip_external=True)
          
          if result.is_err():
              print(f'❌ Audit failed: {result.error}')
              sys.exit(1)
          
          audit = result.value
          security_violations = audit.get('summary', {}).get('security_violations', 0)
          
          if security_violations > 0:
              print(f'❌ DOC-020 VIOLATION: {security_violations} security issue(s) detected')
              print('   Potential javascript:/data: injection or path traversal attempts')
              sys.exit(1)
          
          print('✅ DOC-020: No security violations in documentation links')
          "

  summary:
    name: Documentation Integrity Summary
    runs-on: ubuntu-latest
    needs: [link-integrity, responsive-audit, security-check]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## Documentation Integrity Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.link-integrity.result }}" == "success" ]; then
            echo "✅ **DOC-013**: Link Integrity - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **DOC-013**: Link Integrity - FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.responsive-audit.result }}" == "success" ]; then
            echo "✅ **DOC-021**: Responsive Design - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **DOC-021**: Responsive Design - FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-check.result }}" == "success" ]; then
            echo "✅ **DOC-020**: Security Validation - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **DOC-020**: Security Validation - FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Fail if any critical job failed
          if [ "${{ needs.link-integrity.result }}" == "failure" ] || \
             [ "${{ needs.security-check.result }}" == "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚨 **Critical documentation issues detected. PR cannot be merged.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
