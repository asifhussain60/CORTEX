name: Oracle Integration Tests

on:
  push:
    branches: [ CORTEX-3.0, main ]
  pull_request:
    branches: [ CORTEX-3.0, main ]
  workflow_dispatch:

jobs:
  test-with-oracle:
    runs-on: ubuntu-latest
    
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: test_password_123
          ORACLE_DATABASE: TESTDB
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Oracle client
        run: |
          pip install oracledb
      
      - name: Wait for Oracle to be ready
        run: |
          echo "Waiting for Oracle to be fully ready..."
          sleep 30
      
      - name: Test Oracle connection
        env:
          ORACLE_HOST: localhost
          ORACLE_PORT: 1521
          ORACLE_SERVICE: XEPDB1
          ORACLE_USER: system
          ORACLE_PASSWORD: test_password_123
        run: |
          python -c "
          import oracledb
          try:
              conn = oracledb.connect(
                  user='system',
                  password='test_password_123',
                  dsn='localhost:1521/XEPDB1'
              )
              print('✅ Oracle connection successful')
              conn.close()
          except Exception as e:
              print(f'❌ Oracle connection failed: {e}')
              exit(1)
          "
      
      - name: Run Oracle integration tests
        env:
          ORACLE_HOST: localhost
          ORACLE_PORT: 1521
          ORACLE_SERVICE: XEPDB1
          ORACLE_USER: system
          ORACLE_PASSWORD: test_password_123
        run: |
          pytest tests/tier2/test_oracle_crawler.py -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-test-results
          path: |
            test_report.json
            .pytest_cache
