name: CORTEX Architecture Audit

on:
  push:
    branches:
      - main
      - CORTEX-5.0
      - develop
  pull_request:
    branches:
      - main
      - CORTEX-5.0
      - develop

jobs:
  architecture-audit:
    name: Architecture Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Run Architecture Audit
        id: audit
        run: |
          echo "Running CORTEX Architecture Audit..."
          python3 scripts/audit_master_orchestrator_architecture.py
          AUDIT_EXIT_CODE=$?
          
          if [ $AUDIT_EXIT_CODE -ne 0 ]; then
            echo "audit_passed=false" >> $GITHUB_OUTPUT
          else
            echo "audit_passed=true" >> $GITHUB_OUTPUT
          fi
          
          exit $AUDIT_EXIT_CODE
      
      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: architecture-audit-report
          path: |
            cortex-brain/documents/reports/master-orchestrator-architecture-audit-*.json
            cortex-brain/documents/reports/master-orchestrator-audit-summary-*.md
          retention-days: 30
      
      - name: Comment PR with Audit Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const auditPassed = '${{ steps.audit.outputs.audit_passed }}' === 'true';
            
            let comment = '## 🔍 CORTEX Architecture Audit Results\n\n';
            
            if (auditPassed) {
              comment += '### ✅ AUDIT PASSED\n\n';
              comment += 'This PR complies with the CORTEX Architecture Contract v5.0.\n\n';
              comment += '**Status:** Architecture is compliant (≥95% score)\n\n';
            } else {
              comment += '### ❌ AUDIT FAILED\n\n';
              comment += 'This PR violates the CORTEX Architecture Contract v5.0.\n\n';
              comment += '**Action Required:** Fix architecture issues before merging.\n\n';
              comment += '📋 **Review the audit report** in the workflow artifacts.\n\n';
            }
            
            comment += '---\n';
            comment += '📚 [CORTEX Architecture Contract](https://github.com/${{ github.repository }}/blob/CORTEX-5.0/cortex-brain/documents/architecture/CORTEX-ARCHITECTURE-CONTRACT.md)\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if audit failed
        if: steps.audit.outputs.audit_passed == 'false'
        run: |
          echo "::error::Architecture audit failed - PR blocked"
          echo ""
          echo "❌ ARCHITECTURE AUDIT FAILED"
          echo ""
          echo "This PR violates the CORTEX Architecture Contract v5.0."
          echo "Review the audit report in the workflow artifacts and fix the issues."
          echo ""
          echo "📋 Architecture Contract:"
          echo "   cortex-brain/documents/architecture/CORTEX-ARCHITECTURE-CONTRACT.md"
          echo ""
          exit 1

  audit-summary:
    name: Generate Audit Summary
    runs-on: ubuntu-latest
    needs: architecture-audit
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download Audit Report
        uses: actions/download-artifact@v3
        with:
          name: architecture-audit-report
          path: audit-reports
      
      - name: Generate Summary
        run: |
          echo "## 🔍 Architecture Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "audit-reports/master-orchestrator-architecture-audit-*.json" ]; then
            echo "✅ Audit report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 See workflow artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Audit report not found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📚 [CORTEX Architecture Contract](https://github.com/${{ github.repository }}/blob/CORTEX-5.0/cortex-brain/documents/architecture/CORTEX-ARCHITECTURE-CONTRACT.md)" >> $GITHUB_STEP_SUMMARY
