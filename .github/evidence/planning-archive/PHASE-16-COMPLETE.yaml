  phase_13_addition:
    title: "Dashboard Extensibility in Observability"
    duration_hours: 1
    impact: "ZERO breaking changes (graceful degradation)"
    files_created:
      - "src/observability/dashboard_extensibility.py"
      - "tests/observability/test_dashboard_extensibility.py"
    implementation_details: |
      Add to PHASE-13 (Observability - before production):
      
      FILE: src/observability/dashboard_extensibility.py
      ───────────────────────────────────────────────────
      class DashboardContext:
          """Prepare dashboard for optional domain context"""
          
          def __init__(self, config):
              self.domain_endpoint = config.get('DOMAIN_BRAIN_ENDPOINT')
              self.logger = logging.getLogger(__name__)
          
          def enrich_alert(self, alert):
              """Add domain context if available (graceful)"""
              
              # Base alert (always)
              enriched = {
                  "timestamp": alert.timestamp,
                  "cortex_context": alert.cortex_data,
                  "error": alert.error,
                  "severity": alert.severity,
              }
              
              # Optional domain enhancement
              if not self.domain_endpoint:
                  self.logger.debug("Domain endpoint not configured")
                  return enriched
              
              try:
                  domain_context = self._query_domain_brain(alert)
                  enriched["domain_context"] = domain_context
                  enriched["compliance"] = domain_context.compliance_check
              except Exception as e:
                  # Graceful: domain unavailable
                  self.logger.warning(f"Domain unavailable: {e}")
                  enriched["domain_context"] = None
              
              return enriched
          
          def _query_domain_brain(self, alert):
              """Query domain brain with timeout"""
              response = requests.get(
                  f"{self.domain_endpoint}/alert/context",
                  json=alert.to_dict(),
                  timeout=2.0
              )
              response.raise_for_status()
              return response.json()
      
      FILE: tests/observability/test_dashboard_extensibility.py
      ──────────────────────────────────────────────────────────
      class TestDashboardExtensibility:
          
          def test_alert_enrichment_without_domain_endpoint(self):
              """Verify graceful degradation when domain unavailable"""
              context = DashboardContext(config={})
              alert = MockAlert(...)
              
              result = context.enrich_alert(alert)
              
              assert "error" in result
              assert result["domain_context"] is None
              # Base alert preserved ✅
          
          def test_alert_enrichment_with_domain_endpoint(self, mocker):
              """Verify enrichment when domain available"""
              context = DashboardContext({
                  "DOMAIN_BRAIN_ENDPOINT": "http://domain-brain:8000"
              })
              
              # Mock successful domain query
              mocker.patch.object(
                  context, '_query_domain_brain',
                  return_value={"compliance_check": "HIPAA"}
              )
              
              result = context.enrich_alert(alert)
              
              assert result["domain_context"] == {"compliance_check": "HIPAA"}
              assert result["compliance"] == "HIPAA"
          
          def test_alert_enrichment_domain_timeout(self, mocker):
              """Verify graceful handling when domain times out"""
              context = DashboardContext({
                  "DOMAIN_BRAIN_ENDPOINT": "http://domain-brain:8000"
              })
              
              # Mock timeout
              mocker.patch.object(
                  context, '_query_domain_brain',
                  side_effect=TimeoutError()
              )
              
              result = context.enrich_alert(alert)
              
              # Still returns valid result ✅
              assert "error" in result
              assert result["domain_context"] is None
          
          def test_backward_compatibility(self):
              """Verify old code works with new module"""
              # Old code expects base alert format
              old_alert_parser = OldAlertParser()
              
              context = DashboardContext(config={})
              alert = MockAlert(...)
              result = context.enrich_alert(alert)
              
              # Old parser ignores new fields ✅
              parsed = old_alert_parser.parse(result)
              assert parsed.timestamp
              assert parsed.error
              assert parsed.severity
    
    acceptance_criteria:
      - "AC-PHASE-16-05: Dashboard enrichment works without domain"
      - "AC-PHASE-16-06: Dashboard enrichment adds context if domain available"
      - "AC-PHASE-16-07: Graceful fallback if domain times out"
