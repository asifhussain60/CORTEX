app:
  name: "CortexLabs FinTrack"
  version: "2.0.0"
  description: |
    Production-quality refactoring of BadMonolith via full CORTEX SDLC:
    Onboard → Requirements → Design → Plan → TDD → Workflow-Template Execution.
    25 P0/P1/P2 smells resolved. Clean Architecture. TypeScript strict mode.
    Zero new libraries. All 9 workflow templates consumed.
  tech_stack:
    backend_language: "C# / ASP.NET Core 8.0"
    backend_architecture: "Clean Architecture (Domain / Application / Infrastructure / Api)"
    frontend: "TypeScript (vanilla, strict mode)"
    database: "SQLite via Entity Framework Core (WAL mode)"
    testing_backend: "xUnit + Moq (TestQualityGate score ≥ 7)"
    testing_frontend: "Jest (ts-jest)"
    no_new_libraries: true

