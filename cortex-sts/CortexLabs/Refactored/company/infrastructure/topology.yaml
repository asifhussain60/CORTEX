topology:
  name: fintrack-application
  type: web-application
  architecture: client-server

  components:
    - id: fintrack-frontend
      type: static-web
      technology: "TypeScript (compiled to ES2022)"
      hosting: "Static files served by ASP.NET Core"
      communicates_with: [fintrack-api]

    - id: fintrack-api
      type: rest-api
      technology: "ASP.NET Core 8.0 (Minimal APIs)"
      framework_version: "net8.0"
      hosting: "Kestrel web server"
      endpoints: 13
      authentication: JWT Bearer
      communicates_with: [fintrack-database]

    - id: fintrack-database
      type: embedded-database
      technology: "SQLite 3"
      driver: "Microsoft.Data.Sqlite 8.0.0"
      storage: "fintrack.db (file-based)"
      tables: [Users, Transactions, Accounts, Reports]

  data_flow:
    - from: fintrack-frontend
      to: fintrack-api
      protocol: HTTPS
      format: JSON
      cors: configured-allowlist

    - from: fintrack-api
      to: fintrack-database
      protocol: SQLite (in-process)
      format: SQL (parameterized queries only)

  security_boundaries:
    - name: "API boundary"
      protections:
        - CORS allowlist
        - JWT authentication
        - Request logging with correlation IDs
        - Error handling middleware (no stack traces)
        - Rate limiting on auth endpoints

    - name: "Database boundary"
      protections:
        - Parameterized queries (no SQL injection)
        - Password hashing (BCrypt)
        - No secrets in database (env vars only)
