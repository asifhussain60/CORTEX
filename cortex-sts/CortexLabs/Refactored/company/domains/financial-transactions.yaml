domain:
  name: financial-transactions
  owner: CortexLabs FinTrack Team
  classification: core-business
  description: |
    Core domain for tracking financial transactions (income and expense).
    Includes transaction categorization, search, pagination, and analytics.

bounded_context:
  aggregates:
    - name: Transaction
      root_entity: Transaction
      value_objects: [TransactionCategory, TransactionType]
      invariants:
        - "Amount must be positive (> 0)"
        - "Description must be non-empty"
        - "Type must be Income or Expense"
        - "Date must not be in the future"

  domain_services:
    - name: TransactionCategorizationService
      responsibility: "Auto-categorize transactions by amount and description"
      rules:
        - "Amount > $10,000 → LargePurchase"
        - "Amount > $1,000 → MediumPurchase"
        - "Description contains 'grocery' → Food"
        - "Description contains 'gas' → Transport"
        - "Default → Other"

  domain_events:
    - TransactionCreated
    - TransactionCategorized

business_rules:
  - id: FIN-001
    rule: "All monetary amounts stored as decimal (not float)"
    rationale: "Floating point causes rounding errors in financial calculations"

  - id: FIN-002
    rule: "Transaction search must use parameterized queries"
    rationale: "SQL injection prevention (SMELL-1 remediation)"

  - id: FIN-003
    rule: "List endpoints must support pagination (max 100 per page)"
    rationale: "Unbounded queries cause memory exhaustion (SMELL-6 remediation)"

quality_standards:
  naming_convention: PascalCase
  test_coverage_target: 80
  security_classification: sensitive  # financial data
