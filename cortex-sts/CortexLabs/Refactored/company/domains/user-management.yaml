domain:
  name: user-management
  owner: CortexLabs FinTrack Team
  classification: core-business
  description: |
    User lifecycle management including registration, authentication,
    authorization (role-based), and administration.

bounded_context:
  aggregates:
    - name: User
      root_entity: User
      value_objects: [UserRole, Email]
      invariants:
        - "Email must be unique across all users"
        - "Email must contain '@' and be 5-100 characters"
        - "Password must be hashed before storage"
        - "UserName must be 3-50 alphanumeric characters"

  domain_services:
    - name: AuthenticationService
      responsibility: "Verify user credentials and issue tokens"
      rules:
        - "Compare password against BCrypt hash (never plaintext)"
        - "Rate limit: 5 failed attempts per minute per IP"
        - "Same error message for wrong username vs wrong password"

    - name: UserAdministrationService
      responsibility: "Admin operations on user accounts"
      rules:
        - "Only admin role can delete users"
        - "Cannot delete own account"
        - "Soft delete preferred (set IsActive = false)"

  domain_events:
    - UserRegistered
    - UserAuthenticated
    - UserDeactivated

business_rules:
  - id: USR-001
    rule: "Single canonical email validation (one implementation, not three)"
    rationale: "CORE-035 — no duplicate implementations"

  - id: USR-002
    rule: "Passwords hashed with BCrypt (cost factor >= 12)"
    rationale: "SMELL-2 remediation — plaintext storage eliminated"

  - id: USR-003
    rule: "Admin endpoints require JWT with admin role claim"
    rationale: "SMELL-18 remediation — no anonymous admin access"

  - id: USR-004
    rule: "API responses never include PasswordHash field"
    rationale: "SMELL-2 remediation — password exposure eliminated"

quality_standards:
  naming_convention: PascalCase
  test_coverage_target: 90
  security_classification: highly-sensitive  # PII + credentials
