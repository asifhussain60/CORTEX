metadata:
  document_type: functional-requirements
  version: 1.0.0
  status: approved
  last_updated: 2026-02-22

api_requirements:
  versioning:
    strategy: URL-based
    format: "/api/v1/{resource}"
    rationale: "ADR-001 — explicit versioning allows backward-compatible evolution"

  endpoints:
    # ── User Management ──────────────────────────────────────────────────────
    - id: FR-001
      method: GET
      path: /api/v1/users
      description: "List users with pagination"
      request_params:
        - name: page
          type: integer
          default: 1
        - name: pageSize
          type: integer
          default: 20
          max: 100
      response: "Paginated list of UserDto (never exposes password_hash)"
      authentication: required (admin only)

    - id: FR-002
      method: GET
      path: /api/v1/users/search
      description: "Search users by username"
      request_params:
        - name: username
          type: string
          required: true
      response: "List of matching UserDto"
      security: "Parameterized query — NEVER string concatenation"
      authentication: required

    - id: FR-003
      method: POST
      path: /api/v1/users
      description: "Create new user"
      request_body: CreateUserDto (validated via DataAnnotations)
      validation:
        - "Email: required, valid format, length 5-100"
        - "Username: required, alphanumeric, length 3-50"
        - "Password: required, minimum 8 chars, hashed before storage"
      response: "201 Created with UserDto (no password_hash)"

    # ── Transactions ──────────────────────────────────────────────────────────
    - id: FR-004
      method: GET
      path: /api/v1/transactions
      description: "List transactions with pagination"
      request_params:
        - name: page
          type: integer
          default: 1
        - name: pageSize
          type: integer
          default: 20
      response: "Paginated list of Transaction"

    - id: FR-005
      method: GET
      path: /api/v1/transactions/search
      description: "Search transactions by category and date range"
      request_params:
        - name: category
          type: string
        - name: dateFrom
          type: string (ISO 8601)
      response: "Filtered list of Transaction"
      security: "Parameterized query"

    - id: FR-006
      method: POST
      path: /api/v1/transactions
      description: "Create new transaction"
      request_body: CreateTransactionDto
      validation:
        - "Description: required, non-empty"
        - "Amount: required, positive decimal"
        - "Type: required, enum (income|expense)"
      auto_categorization: "If category not provided, apply domain rules (BR-008)"

    # ── Accounts ──────────────────────────────────────────────────────────────
    - id: FR-007
      method: GET
      path: /api/v1/accounts
      description: "List user accounts"
      response: "List of Account"

    - id: FR-008
      method: POST
      path: /api/v1/accounts/transfer
      description: "Transfer money between accounts"
      request_body: TransferDto
      validation:
        - "FromAccountId != ToAccountId"
        - "Amount > 0"
        - "Source account balance >= amount (overdraft protection)"
      atomicity: "Database transaction — both debit and credit succeed or both roll back"

    # ── Reports ───────────────────────────────────────────────────────────────
    - id: FR-009
      method: GET
      path: /api/v1/reports
      description: "List generated reports"
      response: "List of Report"

    - id: FR-010
      method: POST
      path: /api/v1/reports/generate
      description: "Generate financial report"
      request_body: "{ reportType: monthly|annual|tax, userId: integer }"
      response: "Generated report content"

    # ── Authentication ────────────────────────────────────────────────────────
    - id: FR-011
      method: POST
      path: /api/v1/auth/login
      description: "Authenticate user"
      request_body: "{ username: string, password: string }"
      response: "JWT token + role"
      security:
        - "Credentials in request body only (never query params)"
        - "Password compared via hash (never plaintext)"
        - "Rate limiting: 5 attempts per minute"
        - "No information disclosure (same error for wrong user vs wrong password)"

    # ── Analytics ─────────────────────────────────────────────────────────────
    - id: FR-012
      method: GET
      path: /api/v1/analytics/summary
      description: "Financial analytics summary"
      response: "{ totalIncome, totalExpenses, netPosition, healthScore, topCategory }"

    # ── Health ────────────────────────────────────────────────────────────────
    - id: FR-013
      method: GET
      path: /api/v1/health
      description: "Application health check"
      response: "{ status, timestamp, dbConnected }"
      security: "Never expose environment details, machine name, or .NET version"

error_handling:
  strategy: RFC 7807 Problem Details
  rules:
    - "Never expose stack traces to clients"
    - "Use ProblemDetails format for all 4xx/5xx responses"
    - "Log full exception details server-side via structured logging"
    - "Correlation IDs in all responses for tracing"

pagination:
  strategy: offset-based
  default_page_size: 20
  max_page_size: 100
  response_format:
    items: "array of resources"
    totalCount: "total matching records"
    page: "current page number"
    pageSize: "items per page"
    totalPages: "calculated total pages"
