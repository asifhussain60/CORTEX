metadata:
  document_type: non-functional-requirements
  version: 1.0.0
  status: approved
  last_updated: 2026-02-22

security:
  - id: NFR-SEC-001
    requirement: "All database queries MUST use parameterized queries"
    rationale: "Eliminates SQL injection (SMELL-1 — 7 instances found in BadMonolith)"
    verification: "Static analysis + code review — zero string concatenation in SQL"

  - id: NFR-SEC-002
    requirement: "No secrets in source code or configuration files"
    rationale: "SMELL-2 — JWT secret, admin password, SMTP password, API keys all hardcoded"
    verification: "Environment variables or secret manager; appsettings.json has placeholders only"

  - id: NFR-SEC-003
    requirement: "CORS policy MUST specify allowed origins explicitly"
    rationale: "SMELL-13 — AllowAnyOrigin() enables cross-site attacks"
    verification: "Allowlist in configuration; no wildcard origins"

  - id: NFR-SEC-004
    requirement: "Error responses MUST NOT expose stack traces or internal details"
    rationale: "SMELL-18 — full exception details sent to client in 5 locations"
    verification: "ProblemDetails format; stack traces logged server-side only"

  - id: NFR-SEC-005
    requirement: "Passwords MUST be hashed using BCrypt or PBKDF2"
    rationale: "BadMonolith stores passwords as plaintext despite field named 'password_hash'"
    verification: "BCrypt.HashPassword on creation; BCrypt.Verify on login"

  - id: NFR-SEC-006
    requirement: "Admin endpoints MUST require authentication and admin role"
    rationale: "BadMonolith admin stats endpoint has no auth — exposes secrets"
    verification: "Authentication middleware + role check on all /admin/* endpoints"

  - id: NFR-SEC-007
    requirement: "Authentication tokens MUST NOT be stored in localStorage"
    rationale: "localStorage is accessible to XSS attacks"
    verification: "HttpOnly secure cookie or in-memory storage"

performance:
  - id: NFR-PERF-001
    requirement: "All list endpoints MUST support pagination"
    rationale: "SMELL-6 — 4 endpoints return unbounded result sets"
    verification: "page/pageSize parameters; max 100 items per page"

  - id: NFR-PERF-002
    requirement: "HTTP clients MUST implement retry with exponential backoff"
    rationale: "SMELL-14 — raw HttpClient with no retry, no timeout"
    verification: "Polly retry policy (3 retries, exponential backoff, circuit breaker)"

  - id: NFR-PERF-003
    requirement: "API response time < 200ms for read operations (p95)"
    rationale: "Baseline performance SLA for financial data queries"
    verification: "Load testing with paginated queries"

reliability:
  - id: NFR-REL-001
    requirement: "Financial transfers MUST be atomic (database transaction)"
    rationale: "BadMonolith executes debit and credit as separate commands — partial failure possible"
    verification: "DbContext transaction wrapping; both succeed or both rollback"

  - id: NFR-REL-002
    requirement: "Application MUST handle graceful degradation"
    rationale: "No error handling on any API call in frontend"
    verification: "Try/catch on all fetch calls; user-visible error messages"

maintainability:
  - id: NFR-MAINT-001
    requirement: "Consistent PascalCase naming for all C# properties"
    rationale: "SMELL-7 — mixed PascalCase, camelCase, snake_case in models"
    verification: "Roslyn analyzer rule; code review"

  - id: NFR-MAINT-002
    requirement: "Zero dead code — all methods must have callers"
    rationale: "SMELL-8 — 6 dead methods, 2 dead classes in BadMonolith"
    verification: "Static analysis; unused code detection in CI"

  - id: NFR-MAINT-003
    requirement: "Single source of truth for validation logic"
    rationale: "SMELL-10 — email validation duplicated in 3 locations"
    verification: "One EmailValidator class; no duplicate validation"

  - id: NFR-MAINT-004
    requirement: "Structured logging via ILogger with correlation IDs"
    rationale: "SMELL-11 — Console.WriteLine in 8 locations"
    verification: "ILogger<T> injection; no Console.Write* in production code"

  - id: NFR-MAINT-005
    requirement: "No magic numbers or strings — use named constants or enums"
    rationale: "SMELL-15 — 15+ magic values scattered across backend and frontend"
    verification: "Constants class or enum for all thresholds"

  - id: NFR-MAINT-006
    requirement: "No global mutable state"
    rationale: "SMELL-16 — static AppCache with mutable fields shared across requests"
    verification: "Scoped/transient DI services; no static mutable state"

  - id: NFR-MAINT-007
    requirement: "Audit fields on all entities (CreatedAt, CreatedBy, ModifiedAt, ModifiedBy)"
    rationale: "SMELL-20 — no audit trail on any model"
    verification: "Base entity with auto-populated audit fields"

observability:
  - id: NFR-OBS-001
    requirement: "Structured logging with log levels (Information, Warning, Error)"
    verification: "ILogger with Serilog sink"

  - id: NFR-OBS-002
    requirement: "Request/response logging middleware with correlation IDs"
    verification: "Custom middleware; X-Correlation-Id header"

  - id: NFR-OBS-003
    requirement: "Health endpoint reports actual subsystem status"
    rationale: "BadMonolith always returns 'healthy' even if DB is down"
    verification: "Health check that verifies DB connectivity"

testing:
  - id: NFR-TEST-001
    requirement: "All tests MUST assert on behavior — no Assert.True(true)"
    rationale: "SMELL-12 — 8 tests that always pass regardless of correctness"
    verification: "Test quality gate score >= 7"

  - id: NFR-TEST-002
    requirement: "Unit test coverage >= 80% on service layer"
    verification: "dotnet test with coverlet"

  - id: NFR-TEST-003
    requirement: "Integration tests for all API endpoints"
    verification: "WebApplicationFactory-based tests"
