metadata:
  document_type: business-requirements
  version: 1.0.0
  status: approved
  stakeholder: CortexLabs Product Team
  last_updated: 2026-02-22

executive_summary: |
  CortexLabs FinTrack is a financial tracking application for personal and small
  business use. It manages user accounts, financial transactions (income/expense),
  bank accounts with transfer capability, and generates financial reports.
  The application requires secure authentication, role-based access control,
  and real-time financial health analytics.

business_objectives:
  - id: BIZ-001
    objective: "Enable users to track income and expenses across multiple accounts"
    priority: P0
    success_criteria: "Users can CRUD transactions with categorization"

  - id: BIZ-002
    objective: "Provide real-time financial health dashboard"
    priority: P0
    success_criteria: "Dashboard shows income/expense/net position/health score"

  - id: BIZ-003
    objective: "Support inter-account money transfers"
    priority: P1
    success_criteria: "Atomic transfers with overdraft protection"

  - id: BIZ-004
    objective: "Generate financial reports (monthly, annual, tax)"
    priority: P1
    success_criteria: "Reports generated on-demand with correct aggregations"

  - id: BIZ-005
    objective: "Secure multi-user system with role-based access"
    priority: P0
    success_criteria: "Admin vs user roles, JWT authentication, audit trail"

business_domains:
  - name: User Management
    description: "User registration, authentication, role management"
    entities: [User]
    capabilities:
      - User registration with email validation
      - JWT-based authentication
      - Role-based access (admin, user)
      - User search and administration

  - name: Financial Transactions
    description: "Income and expense tracking with categorization"
    entities: [Transaction]
    capabilities:
      - Create income/expense transactions
      - Auto-categorization by amount and description
      - Search by category and date range
      - Category breakdown analytics

  - name: Account Management
    description: "Bank account tracking and inter-account transfers"
    entities: [Account]
    capabilities:
      - Multiple account types (checking, savings, investment)
      - Balance tracking
      - Inter-account transfers with atomicity

  - name: Reporting
    description: "Financial report generation"
    entities: [Report]
    capabilities:
      - Monthly summary reports
      - Annual financial reports
      - Tax reports

  - name: Analytics
    description: "Real-time financial health analytics"
    entities: []
    capabilities:
      - Income vs expense aggregation
      - Net position calculation
      - Health score (healthy/warning/critical)
      - Top spending category identification

  - name: Administration
    description: "System administration and monitoring"
    entities: []
    capabilities:
      - System statistics dashboard
      - User management (delete)
      - Health endpoint monitoring

business_rules:
  - id: BR-001
    rule: "Email addresses must be unique and contain '@' with length 5-100"
    domain: User Management
    enforcement: Application layer validation

  - id: BR-002
    rule: "Transactions must have positive amounts and non-empty descriptions"
    domain: Financial Transactions
    enforcement: Model validation + service layer

  - id: BR-003
    rule: "Account transfers must be atomic — both sides succeed or both fail"
    domain: Account Management
    enforcement: Database transaction wrapping

  - id: BR-004
    rule: "Account balance cannot go below zero (overdraft protection)"
    domain: Account Management
    enforcement: Service layer pre-check

  - id: BR-005
    rule: "Health score thresholds: healthy (income > expenses), warning (expenses > income), critical (expenses > 1.5x income)"
    domain: Analytics
    enforcement: Domain service calculation

  - id: BR-006
    rule: "Admin endpoints require admin role — no anonymous access"
    domain: Administration
    enforcement: Authentication middleware

  - id: BR-007
    rule: "Passwords must be hashed — never stored or transmitted in plaintext"
    domain: User Management
    enforcement: Infrastructure layer (BCrypt/PBKDF2)

  - id: BR-008
    rule: "Transaction categorization: >$10,000 = large_purchase, >$1,000 = medium_purchase"
    domain: Financial Transactions
    enforcement: Domain service (configurable thresholds, not magic numbers)
