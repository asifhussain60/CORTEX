metadata:
  document_type: api-design
  version: 1.0.0
  last_updated: 2026-02-22

api_standards:
  versioning: URL-based (/api/v1/)
  naming: kebab-case for multi-word resources
  pagination: offset-based (page, pageSize)
  error_format: RFC 7807 Problem Details
  content_type: application/json
  authentication: JWT Bearer token

endpoint_catalog:
  users:
    base_path: /api/v1/users
    endpoints:
      - { method: GET, path: /, description: "List users (paginated)", auth: admin }
      - { method: GET, path: /search, description: "Search by username", auth: required }
      - { method: POST, path: /, description: "Create user", auth: none }
      - { method: DELETE, path: "/{id}", description: "Delete user", auth: admin }

  transactions:
    base_path: /api/v1/transactions
    endpoints:
      - { method: GET, path: /, description: "List transactions (paginated)", auth: required }
      - { method: GET, path: /search, description: "Search by category/date", auth: required }
      - { method: POST, path: /, description: "Create transaction", auth: required }

  accounts:
    base_path: /api/v1/accounts
    endpoints:
      - { method: GET, path: /, description: "List accounts", auth: required }
      - { method: POST, path: /transfer, description: "Transfer between accounts", auth: required }

  reports:
    base_path: /api/v1/reports
    endpoints:
      - { method: GET, path: /, description: "List reports", auth: required }
      - { method: POST, path: /generate, description: "Generate report", auth: required }

  auth:
    base_path: /api/v1/auth
    endpoints:
      - { method: POST, path: /login, description: "Authenticate user", auth: none }

  analytics:
    base_path: /api/v1/analytics
    endpoints:
      - { method: GET, path: /summary, description: "Financial summary", auth: required }

  health:
    base_path: /api/v1/health
    endpoints:
      - { method: GET, path: /, description: "Health check", auth: none }

error_codes:
  - { code: 400, type: ValidationError, description: "Invalid request body or parameters" }
  - { code: 401, type: Unauthorized, description: "Missing or invalid auth token" }
  - { code: 403, type: Forbidden, description: "Insufficient role for this operation" }
  - { code: 404, type: NotFound, description: "Resource not found" }
  - { code: 409, type: Conflict, description: "Duplicate resource (e.g., email already exists)" }
  - { code: 422, type: UnprocessableEntity, description: "Business rule violation (e.g., overdraft)" }
  - { code: 500, type: InternalError, description: "Unexpected server error (no stack traces exposed)" }

cors_policy:
  allowed_origins: "Configured via environment variable CORS_ORIGINS"
  allowed_methods: [GET, POST, PUT, DELETE]
  allowed_headers: [Content-Type, Authorization, X-Correlation-Id]
  expose_headers: [X-Correlation-Id]
  max_age_seconds: 3600
