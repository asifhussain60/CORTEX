metadata:
  document_type: architecture-overview
  version: 1.0.0
  pattern: Clean Architecture (Robert C. Martin)
  last_updated: 2026-02-22

architecture_style: Clean Architecture with Vertical Slicing

layers:
  - name: Domain
    project: CortexLabs.FinTrack.Domain
    responsibility: |
      Pure business logic with zero external dependencies.
      Contains entities, value objects, enums, and repository interfaces.
    dependencies: none
    contents:
      - Entities/ (User, Transaction, Account, Report — with audit fields)
      - Enums/ (TransactionType, TransactionCategory, AccountType, UserRole)
      - Interfaces/ (IUserRepository, ITransactionRepository, IAccountRepository)

  - name: Application
    project: CortexLabs.FinTrack.Application
    responsibility: |
      Use cases and application services. Orchestrates domain logic.
      Contains DTOs, validators, and service implementations.
    dependencies: [Domain]
    contents:
      - Services/ (UserService, TransactionService, AccountService, AuthService)
      - DTOs/ (CreateUserDto, CreateTransactionDto, TransferDto)
      - Validators/ (EmailValidator — single canonical implementation)

  - name: Infrastructure
    project: CortexLabs.FinTrack.Infrastructure
    responsibility: |
      External concerns — database access, configuration, external APIs.
      Implements repository interfaces defined in Domain.
    dependencies: [Domain, Application]
    contents:
      - Data/ (AppDbContext, DatabaseInitializer)
      - Repositories/ (UserRepository, TransactionRepository, AccountRepository)
      - Configuration/ (AppSettings — strongly typed, no hardcoded secrets)

  - name: API
    project: CortexLabs.FinTrack.Api
    responsibility: |
      Thin API layer — endpoint registration, middleware, DI setup.
      No business logic. Maps HTTP to application services.
    dependencies: [Application, Infrastructure]
    contents:
      - Endpoints/ (UserEndpoints, TransactionEndpoints, AccountEndpoints, etc.)
      - Middleware/ (ErrorHandlingMiddleware, RequestLoggingMiddleware)
      - Program.cs (DI registration + middleware pipeline only)

  - name: Tests
    project: CortexLabs.FinTrack.Tests
    responsibility: |
      Behavioral unit tests + integration tests.
      Every test asserts on actual behavior — zero Assert.True(true).
    dependencies: [Domain, Application, Infrastructure, Api]
    contents:
      - Services/ (UserServiceTests, TransactionServiceTests, AccountServiceTests)
      - Validators/ (EmailValidatorTests)
      - Endpoints/ (UserEndpointsTests — WebApplicationFactory)

dependency_rules:
  - "Domain has ZERO external dependencies"
  - "Application depends ONLY on Domain"
  - "Infrastructure implements Domain interfaces (Dependency Inversion)"
  - "API depends on Application and Infrastructure for DI wiring"
  - "Dependencies point INWARD — never outward"

cross_cutting_concerns:
  logging:
    pattern: "ILogger<T> injection via DI"
    implementation: "Structured logging with correlation IDs"
    replaces: "Console.WriteLine (SMELL-11)"

  error_handling:
    pattern: "Global middleware + ProblemDetails"
    implementation: "ErrorHandlingMiddleware catches unhandled exceptions"
    replaces: "Stack trace exposure (SMELL-18)"

  validation:
    pattern: "DataAnnotations on DTOs + single EmailValidator"
    implementation: "Model binding validation + explicit service checks"
    replaces: "Duplicate validation in 3 locations (SMELL-10)"

  authentication:
    pattern: "JWT middleware (if identity package available) or simple header-based"
    implementation: "Middleware validates token before admin endpoints"
    replaces: "No auth on admin endpoints"

smell_to_layer_mapping:
  domain_layer_resolves:
    - SMELL-7 (naming → PascalCase entities)
    - SMELL-15 (magic numbers → enums and constants)
    - SMELL-16 (global state → eliminated, no static mutable)
    - SMELL-19 (validation → DataAnnotations on entities)
    - SMELL-20 (audit fields → base entity)

  application_layer_resolves:
    - SMELL-4 (business logic in endpoints → services)
    - SMELL-5 (circular dependency → DI with interfaces)
    - SMELL-8 (dead code → removed entirely)
    - SMELL-10 (duplicate validation → single EmailValidator)
    - SMELL-17 (no DI → constructor injection)

  infrastructure_layer_resolves:
    - SMELL-1 (SQL injection → parameterized queries)
    - SMELL-2 (hardcoded secrets → env var references)
    - SMELL-6 (no pagination → OFFSET/LIMIT)
    - SMELL-14 (no retry → HttpClient with retry policy)

  api_layer_resolves:
    - SMELL-3 (God class → separate endpoint files)
    - SMELL-9 (no versioning → /api/v1/)
    - SMELL-11 (Console.WriteLine → ILogger middleware)
    - SMELL-13 (CORS wildcard → allowlist)
    - SMELL-18 (stack traces → ProblemDetails middleware)

  test_layer_resolves:
    - SMELL-12 (Assert.True(true) → behavioral tests)
