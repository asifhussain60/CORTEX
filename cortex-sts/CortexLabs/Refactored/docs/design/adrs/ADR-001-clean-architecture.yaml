# ADR-001: Clean Architecture with Vertical Slicing
# Status: Accepted | Date: 2026-02-22

decision:
  title: "Adopt Clean Architecture with vertical slicing for CortexLabs FinTrack"
  status: accepted
  date: 2026-02-22
  deciders: [CORTEX RefactoringOrchestrator]

context: |
  BadMonolith Program.cs is 591 LOC containing 6 business domains (Users, Transactions,
  Accounts, Reports, Auth, Admin) in a single file. No separation of concerns.
  SMELL-3 (God class), SMELL-4 (business logic in endpoints), SMELL-17 (no DI).

decision_description: |
  Decompose into 4 layers: Domain, Application, Infrastructure, Api.
  Each layer is a separate C# project with explicit dependency rules.
  Dependencies point inward (Dependency Inversion Principle).

alternatives_considered:
  - name: "Vertical Slice Architecture"
    pros: "Feature cohesion, independent deployment"
    cons: "Overkill for a single API; harder to enforce shared domain model"
    rejected_because: "Application is too small for full vertical slicing"

  - name: "Simple MVC with service layer"
    pros: "Familiar, quick to implement"
    cons: "Doesn't enforce dependency inversion; business logic leaks into controllers"
    rejected_because: "Root cause of BadMonolith — no architectural boundaries"

consequences:
  positive:
    - "Clear separation of concerns — each layer has one responsibility"
    - "Domain logic testable without HTTP or database"
    - "New developers understand structure in < 1 hour"
  negative:
    - "More files and projects than a single-file app"
    - "Initial setup overhead for small applications"
  mitigated_by: "CORTEX automation generates the scaffold instantly"
