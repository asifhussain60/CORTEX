# ==============================================================================
# USAGE GUIDE
# ==============================================================================
usage_guide:
  for_developers:
    step_1: "Read EXECUTIVE-SUMMARY.md for high-level overview"
    step_2: "Review cortex-toolkit-architecture.yaml for complete spec"
    step_3: "Use this index to find relevant snippets"
    step_4: "Copy snippet template and adapt for your use case"
    step_5: "Follow TDD pattern (RED → GREEN → REFACTOR)"
  
  for_orchestrators:
    step_1: "Load toolkit-manager-implementation.py as reference"
    step_2: "Implement ToolkitManager in src/orchestrators/toolkit/"
    step_3: "Register existing scripts to migrate them"
    step_4: "Use @toolkit_tool decorator for new tools"
  
  for_reviewers:
    step_1: "Check that snippet follows template patterns"
    step_2: "Verify test coverage (100% tier0, ≥95% tier1+)"
    step_3: "Validate governance compliance (CORE-005, CORE-008, CORE-024)"
    step_4: "Ensure proper error handling and logging"

# ==============================================================================
# GOVERNANCE CHECKLIST
# ==============================================================================
governance_checklist:
  tier0_tools:
    - [ ] Uses pathlib.Path (CORE-005)
    - [ ] Has @toolkit_tool decorator (CORE-024)
    - [ ] Created via TDD (CORE-008)
    - [ ] 100% test coverage
    - [ ] Cross-platform compatible
    - [ ] Stateless (no side effects)
    - [ ] Documented complexity (O(n) notation)
  
  tier1_tools:
    - [ ] Uses tier0 primitives only
    - [ ] Declares dependencies explicitly
    - [ ] Has graceful error handling
    - [ ] ≥95% test coverage
    - [ ] Logs operations to audit trail
  
  tier2_tools:
    - [ ] Integrates with cortex-brain tiers
    - [ ] Enforces governance rules
    - [ ] Updates persistent memory
    - [ ] Generates audit trail entries
    - [ ] Full approval review completed
  
  tier3_tools:
    - [ ] Integrates with MasterOrchestrator
    - [ ] Maintains SSOT integrity
    - [ ] Enforces sequential execution
    - [ ] Validates against governance
    - [ ] Full approval review completed

