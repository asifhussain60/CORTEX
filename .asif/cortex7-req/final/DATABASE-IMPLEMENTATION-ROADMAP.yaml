# ==============================================================================
# PHASE 1-2: IMMEDIATE ACTIONS (FOUNDATION + ORCHESTRATION CORE)
# ==============================================================================

immediate_actions:
  priority: HIGH
  timeline: "Week 1-4 (concurrent with Phase 1-2 AC implementation)"
  
  tasks:
    - id: DB-001
      title: "Keep SQLite as primary storage"
      status: ✅ COMPLETED
      description: "Decision confirmed - SQLite optimal for Phase 1-2"
      rationale:
        - "Stdlib (zero new dependencies)"
        - "Cross-platform (MAC+WIN, CORE-005 compliant)"
        - "ACID guarantees (audit integrity)"
        - "Battle-tested in CORTEX 6"
        - "Good performance (<100k audit entries)"
      dependencies: []
      completion_criteria:
        - "No new database dependencies added"
        - "Existing SQLite implementation continues"
      
    - id: DB-002
      title: "Optimize SQLite: WITHOUT ROWID tables"
      status: ⏳ PENDING
      priority: HIGH
      description: "Convert audit log tables to WITHOUT ROWID for 20% performance boost"
      effort: "2-3 hours"
      
      implementation:
        files_to_modify:
          - src/infrastructure/enhanced_audit_logger.py
          - migrations/002_without_rowid_optimization.py
        
        sql_changes:
          - table: audit_logs_hot
            before: "CREATE TABLE audit_logs_hot (id TEXT PRIMARY KEY, ...)"
            after: "CREATE TABLE audit_logs_hot (id TEXT PRIMARY KEY, ...) WITHOUT ROWID"
            benefit: "20% faster primary key lookups"
          
          - table: knowledge_graph_nodes
            before: "CREATE TABLE knowledge_graph_nodes (id TEXT PRIMARY KEY, ...)"
            after: "CREATE TABLE knowledge_graph_nodes (id TEXT PRIMARY KEY, ...) WITHOUT ROWID"
            benefit: "Faster graph traversal"
          
          - table: vector_index_metadata
            before: "CREATE TABLE vector_index_metadata (id TEXT PRIMARY KEY, ...)"
            after: "CREATE TABLE vector_index_metadata (id TEXT PRIMARY KEY, ...) WITHOUT ROWID"
            benefit: "Faster vector lookups"
      
      dependencies: []
      
      acceptance_criteria:
        - "All primary-key-based tables converted to WITHOUT ROWID"
        - "Migration script creates/updates tables correctly"
        - "Tests verify 20% performance improvement on lookups"
        - "Cross-platform compatibility maintained (MAC+WIN)"
      
      testing:
        - "Benchmark query performance before/after"
        - "Verify no regressions on existing functionality"
        - "Test on both MAC and WIN platforms"
    
    - id: DB-003
      title: "Optimize SQLite: PRAGMA optimize"
      status: ⏳ PENDING
      priority: HIGH
      description: "Enable auto-optimization for query planning"
      effort: "1 hour"
      
      implementation:
        files_to_modify:
          - src/infrastructure/enhanced_audit_logger.py
          - src/infrastructure/repo_audit_isolation.py
        
        code_addition: |
          # Add after database connection
          conn.execute("PRAGMA optimize")
          conn.execute("PRAGMA analysis_limit = 1000")
          
          # Optional: Run ANALYZE on major tables
          conn.execute("ANALYZE audit_logs_hot")
          conn.execute("ANALYZE knowledge_graph_nodes")
      
      dependencies: []
      
      acceptance_criteria:
        - "PRAGMA optimize enabled on all database connections"
        - "Query performance monitored for improvements"
        - "No negative impact on write performance"
      
    - id: DB-004
      title: "Optimize SQLite: Date-based partitioning (hot/warm/cold)"
      status: ⏳ PENDING
      priority: MEDIUM
      description: "Partition audit logs by date for better query performance"
      effort: "4-6 hours"
      
      implementation:
        strategy: "Separate tables for hot/warm/cold zones"
        
        tables:
          hot_zone:
            name: "audit_logs_hot_YYYY_MM"
            age_range: "0-7 days"
            retention: "Current month + 1 previous month"
            index: "CREATE INDEX idx_hot_timestamp ON audit_logs_hot_YYYY_MM(timestamp)"
          
          warm_zone:
            name: "audit_logs_warm_YYYY_MM"
            age_range: "7-30 days"
            retention: "Current year"
            compression: "PRAGMA page_size = 4096 (smaller pages for compression)"
          
          cold_zone:
            name: "audit_logs_cold_YYYY"
            age_range: "30+ days"
            retention: "Unlimited"
            compression: "VACUUM INTO with GZIP compression"
        
        query_router: |
          # Add to audit logger
          def _get_partition_table(self, timestamp: datetime) -> str:
              age_days = (datetime.now() - timestamp).days
              if age_days <= 7:
                  return f"audit_logs_hot_{timestamp.strftime('%Y_%m')}"
              elif age_days <= 30:
                  return f"audit_logs_warm_{timestamp.strftime('%Y_%m')}"
              else:
                  return f"audit_logs_cold_{timestamp.strftime('%Y')}"
        
        migration_script: "scripts/partition_audit_logs.py"
      
      dependencies:
        - DB-002  # WITHOUT ROWID optimization should be applied first
      
      acceptance_criteria:
        - "Audit logs partitioned by date (hot/warm/cold)"
        - "Query router selects correct partition"
        - "95% of queries hit hot zone (<5ms latency)"
        - "Automatic migration between zones (daily cron job)"
        - "Tests verify partition selection logic"
      
      automation:
        - job: "Hot to Warm migration"
          schedule: "Daily at 02:00 UTC"
          script: "scripts/migrate_hot_to_warm.py"
        
        - job: "Warm to Cold migration"
          schedule: "Weekly Sunday 03:00 UTC"
          script: "scripts/migrate_warm_to_cold.py"
    
    - id: DB-005
      title: "Implement JSONB for evidence bundles"
      status: ⏳ PENDING
      priority: MEDIUM
      description: "Use JSONB column type for better compression and query performance"
      effort: "3-4 hours"
      
      prerequisites:
        sqlite_version: "3.45+"
        verification: "SELECT sqlite_version();"
        platforms:
          - "macOS 14+ (Sonoma): SQLite 3.45.0+"
          - "Windows 11: SQLite 3.45.0+ (via Python sqlite3)"
      
      implementation:
        files_to_modify:
          - src/infrastructure/evidence_bundle_manager.py
          - migrations/003_jsonb_evidence_bundles.py
        
        schema_change:
          before: "CREATE TABLE evidence_bundles (id TEXT PRIMARY KEY, data TEXT)"
          after: "CREATE TABLE evidence_bundles (id TEXT PRIMARY KEY, data JSONB)"
          benefits:
            - "20-30% smaller storage (binary JSON format)"
            - "10-20% faster queries (no JSON parsing)"
            - "Built-in JSON validation"
        
        code_changes: |
          # Before (TEXT column)
          cursor.execute(
              "INSERT INTO evidence_bundles (id, data) VALUES (?, ?)",
              (bundle_id, json.dumps(bundle_data))
          )
          
          # After (JSONB column)
          cursor.execute(
              "INSERT INTO evidence_bundles (id, data) VALUES (?, jsonb(?))",
              (bundle_id, json.dumps(bundle_data))
          )
          
          # Query with JSON operators
          cursor.execute(
              "SELECT data->>'ac_id' FROM evidence_bundles WHERE data->>'status' = 'completed'"
          )
      
      dependencies: []
      
      acceptance_criteria:
        - "Evidence bundles stored as JSONB (not TEXT)"
        - "20-30% storage reduction verified"
        - "Query performance improved (benchmark tests)"
        - "Cross-platform compatibility verified (MAC+WIN)"
        - "Migration script handles existing TEXT → JSONB conversion"
      
      testing:
        - "Benchmark storage size before/after"
        - "Verify JSON query operators work correctly"
        - "Test on SQLite 3.45+ on both platforms"
    
    - id: DB-006
      title: "Add CORE-033 to core-rules.yaml"
      status: ⏳ PENDING
      priority: HIGH
      description: "Add governance rule for IDE state gitignored enforcement"
      effort: "1 hour"
      
      implementation:
        file: cortex-brain/tier0/governance/core-rules.yaml
        
        rule_definition: |
          CORE-033:
            name: "IDE State Must Be Gitignored"
            category: WORKSPACE_HYGIENE
            severity: blocked
            tier: 0
            
            description: >
              IDE-specific files (.cortex/, .vscode/settings.json, .idea/, *.swp)
              MUST be in .gitignore. IDE state is personal configuration, not
              project artifact. Pollutes workspace context and Copilot window.
            
            rationale: >
              Chat files (e.g., chat01.md at 4016 lines) consume valuable Copilot
              context window. IDE state files vary per developer and should not be
              version controlled. Session summaries in cortex-brain/tier1/sessions/
              provide structured alternative.
            
            enforcement:
              - "Pre-commit hook checks .gitignore for IDE patterns"
              - "Block commit if .cortex/, .vscode/settings.json, .idea/ not gitignored"
              - "CI/CD pipeline fails if IDE state detected in commits"
            
            failure_action: "Block commit, display remediation steps"
            
            examples:
              violation: "git add .cortex/chats/chat01.md"
              compliant: ".cortex/ listed in .gitignore"
            
            related_rules:
              - CORE-002  # No summary files (related to workspace hygiene)
              - CORE-009  # Plan file organization (related to file placement)
            
            detection_patterns:
              - ".cortex/**/*"
              - ".vscode/settings.json"
              - ".idea/**/*"
              - "*.swp"
              - "*.swo"
              - ".DS_Store"
            
            remediation: |
              # Add to .gitignore
              echo '.cortex/' >> .gitignore
              echo '.vscode/settings.json' >> .gitignore
              echo '.idea/' >> .gitignore
              
              # Remove from git tracking
              git rm -r --cached .cortex/
              
              # Use session summaries instead
              # Location: cortex-brain/tier1/sessions/{date}-{topic}.yaml
      
      dependencies: []
      
      acceptance_criteria:
        - "CORE-033 added to core-rules.yaml"
        - "Rule follows SKULL format (19 core rules → 20 core rules)"
        - "Detection patterns comprehensive"
        - "Remediation steps clear and executable"
    
    - id: DB-007
      title: "Delete old chat files to free context window"
      status: ⏳ PENDING
      priority: HIGH
      description: "Remove .cortex/chats/*.md files (4016+ lines consuming context)"
      effort: "5 minutes"
      
      implementation:
        commands:
          - "rm -rf /Users/asifhussain/PROJECTS/CORTEX/.cortex/chats/chat*.md"
          - "# Verify removal: ls -la .cortex/chats/"
        
        verification:
          before: "148KB total, chat01.md at 4016 lines"
          after: "Directory empty or removed"
      
      dependencies:
        - DB-006  # CORE-033 should be in place first (governance)
      
      acceptance_criteria:
        - "All chat*.md files deleted"
        - ".cortex/ in .gitignore (already done ✅)"
        - "Context window freed (4016+ lines removed)"
        - "Session summaries created as alternative"
      
      alternative:
        location: "cortex-brain/tier1/sessions/"
        format: "Structured YAML (10-20 lines vs 4000+ lines)"
        example: "2026-01-14-database-alternatives.yaml"

