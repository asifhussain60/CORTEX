medium_term_actions:
  phase: 4
  priority: MEDIUM
  timeline: "Week 7-8 (Intelligence Layer implementation)"
  prerequisite: "Phase 1-3 at 100% completion"
  
  tasks:
    - id: DB-101
      title: "Add DuckDB dependency"
      status: 📅 PLANNED
      description: "Add DuckDB to requirements.txt for analytical queries"
      effort: "15 minutes"
      
      implementation:
        file: requirements.txt
        addition: "duckdb>=0.10.0  # Analytical database for audit log analytics"
        
        installation:
          command: "pip install duckdb>=0.10.0"
          verification: "python -c 'import duckdb; print(duckdb.__version__)'"
        
        platforms:
          - "macOS: pip install via Homebrew Python or venv"
          - "Windows: pip install via Python installer or venv"
          - "Cross-platform: Tested on MAC+WIN (CORE-005 compliant)"
      
      dependencies: []
      
      acceptance_criteria:
        - "duckdb>=0.10.0 in requirements.txt"
        - "Installs successfully on MAC and WIN"
        - "No conflicts with existing dependencies"
        - "Import verification passes"
    
    - id: DB-102
      title: "Create nightly replication script (SQLite → DuckDB)"
      status: 📅 PLANNED
      description: "Replicate audit logs from SQLite to DuckDB for analytics"
      effort: "6-8 hours"
      
      implementation:
        file: scripts/replicate_audit_to_duckdb.py
        
        architecture: |
          WRITE PATH (transactional):
          User Operation → @audit_driven → SQLite (ACID guarantees, source of truth)
          
          READ PATH (analytical):
          Dashboard Query → DuckDB (fast aggregations) ← Nightly Replication ← SQLite
        
        pseudocode: |
          import sqlite3
          import duckdb
          from pathlib import Path
          
          def replicate_audit_logs():
              # Connect to SQLite (source of truth)
              sqlite_conn = sqlite3.connect("cortex-brain/database/governance.db")
              
              # Connect to DuckDB (analytical copy)
              duckdb_conn = duckdb.connect("cortex-brain/database/audit_analytics.duckdb")
              
              # Replicate audit logs (incremental)
              last_replicated = get_last_replication_timestamp(duckdb_conn)
              new_entries = sqlite_conn.execute(
                  "SELECT * FROM audit_logs WHERE timestamp > ?",
                  (last_replicated,)
              ).fetchall()
              
              # Bulk insert into DuckDB (columnar storage)
              duckdb_conn.executemany(
                  "INSERT INTO audit_logs VALUES (?, ?, ?, ...)",
                  new_entries
              )
              
              # Update replication timestamp
              update_last_replication_timestamp(duckdb_conn)
              
              # Optimize DuckDB tables
              duckdb_conn.execute("VACUUM")
              duckdb_conn.execute("ANALYZE")
        
        scheduling:
          method: "Cron job (Linux/Mac) or Task Scheduler (Windows)"
          schedule: "Daily at 03:00 UTC"
          cron: "0 3 * * * cd /path/to/CORTEX && python scripts/replicate_audit_to_duckdb.py"
      
      dependencies:
        - DB-101  # DuckDB dependency must be installed
      
      acceptance_criteria:
        - "Replication script creates DuckDB database"
        - "Incremental replication (only new entries)"
        - "Runs nightly without errors"
        - "Verification: row counts match between SQLite and DuckDB"
        - "Performance: 10-100x faster aggregation queries on DuckDB"
      
      testing:
        - "Unit tests for replication logic"
        - "Integration tests with SQLite + DuckDB"
        - "Benchmark query performance (DuckDB vs SQLite)"
    
    - id: DB-103
      title: "Update dashboard queries to use DuckDB for analytics"
      status: 📅 PLANNED
      description: "Modify dashboard to query DuckDB instead of SQLite for analytics"
      effort: "4-6 hours"
      
      implementation:
        files_to_modify:
          - dashboard/api.py
          - src/dashboards/audit_dashboard.py
          - cortex-brain/cx6-plan/viewer/plan-viewer.html
        
        query_routing_logic: |
          def query_audit_logs(query_type: str, filters: dict):
              if query_type in ["aggregation", "time_series", "analytics"]:
                  # Use DuckDB (10-100x faster)
                  return duckdb_conn.execute(query).fetchdf()
              else:
                  # Use SQLite (transactional queries)
                  return sqlite_conn.execute(query).fetchall()
        
        example_queries:
          before_sqlite: |
            # Slow aggregation on SQLite (100ms+)
            SELECT ac_id, COUNT(*), AVG(duration_ms)
            FROM audit_logs
            WHERE timestamp > date('now', '-30 days')
            GROUP BY ac_id
            ORDER BY COUNT(*) DESC
          
          after_duckdb: |
            # Fast aggregation on DuckDB (<10ms)
            SELECT ac_id, COUNT(*), AVG(duration_ms)
            FROM audit_logs
            WHERE timestamp > current_date - INTERVAL '30 days'
            GROUP BY ac_id
            ORDER BY COUNT(*) DESC
      
      dependencies:
        - DB-102  # Replication script must be running
      
      acceptance_criteria:
        - "Dashboard queries use DuckDB for analytics"
        - "10-100x performance improvement measured"
        - "Fallback to SQLite if DuckDB unavailable"
        - "No breaking changes to dashboard API"
      
      performance_targets:
        - "Aggregation queries: <10ms (was 100ms+)"
        - "Time-series queries: <20ms (was 200ms+)"
        - "Dashboard load time: <500ms (was 2-3s)"
    
    - id: DB-104
      title: "Implement Parquet export for cold storage (90% compression)"
      status: 📅 PLANNED
      description: "Export audit logs to Parquet format for long-term archival"
      effort: "4-5 hours"
      
      implementation:
        file: scripts/export_audit_to_parquet.py
        
        export_logic: |
          import duckdb
          import pyarrow.parquet as pq
          
          def export_cold_storage():
              # Connect to DuckDB
              conn = duckdb.connect("cortex-brain/database/audit_analytics.duckdb")
              
              # Export audit logs older than 90 days
              query = """
                  COPY (
                      SELECT * FROM audit_logs
                      WHERE timestamp < current_date - INTERVAL '90 days'
                  ) TO 'cortex-brain/archive/audit_logs_YYYY_MM.parquet'
                  (FORMAT 'parquet', COMPRESSION 'snappy')
              """
              conn.execute(query)
              
              # Delete exported records from DuckDB (keep only recent data)
              conn.execute("""
                  DELETE FROM audit_logs
                  WHERE timestamp < current_date - INTERVAL '90 days'
              """)
        
        compression_ratio:
          before: "1GB SQLite database (uncompressed)"
          after: "100MB Parquet file (snappy compression)"
          savings: "90% disk space reduction"
        
        scheduling:
          method: "Monthly cron job"
          schedule: "First Sunday of each month at 04:00 UTC"
          cron: "0 4 1 * * cd /path/to/CORTEX && python scripts/export_audit_to_parquet.py"
      
      dependencies:
        - DB-102  # DuckDB replication must be active
      
      acceptance_criteria:
        - "Audit logs exported to Parquet (monthly)"
        - "90% compression achieved"
        - "Exported records deleted from DuckDB"
        - "Parquet files queryable via DuckDB (if needed)"
      
      query_cold_storage: |
        # Query archived Parquet files via DuckDB
        import duckdb
        conn = duckdb.connect()
        df = conn.execute("""
            SELECT * FROM read_parquet('cortex-brain/archive/audit_logs_*.parquet')
            WHERE ac_id = 'AC-AUDIT-001'
        """).fetchdf()

# ==============================================================================
# PHASE 7+: LONG-TERM ACTIONS (PRODUCTION OPTIMIZATION)
# ==============================================================================

long_term_actions:
  phase: "7+"
  priority: LOW
  timeline: "Post-Phase 7 (optional, multi-user only)"
  prerequisite: "Multi-user deployment or production performance bottleneck"
  
  tasks:
    - id: DB-201
      title: "Evaluate Redis for hot cache"
      status: 📅 OPTIONAL
      description: "Add Redis for 7-day hot cache (only if justified)"
      effort: "8-12 hours"
      
      decision_criteria:
        evaluate_if:
          - "Multi-user deployment (>5 concurrent users)"
          - "Hot zone queries >50ms latency"
          - "Dashboard real-time updates required"
        
        skip_if:
          - "Single-user development tool"
          - "SQLite hot zone <50ms latency"
          - "No real-time update requirements"
      
      implementation:
        dependency: "redis>=5.0.0"
        cache_strategy: "Cache-aside pattern with TTL"
        
        architecture: |
          QUERY PATH:
          1. Check Redis cache (TTL: 7 days)
          2. If miss, query SQLite
          3. Store in Redis for next query
          4. Return result
        
        cache_invalidation:
          - "Automatic: TTL expiration (7 days)"
          - "Manual: Invalidate on audit log write"
      
      acceptance_criteria:
        - "Redis cache improves hot queries to <1ms"
        - "Cache hit rate >80% for hot zone"
        - "Fallback to SQLite if Redis unavailable"
        - "Operational complexity justified by performance gains"
      
      operational_considerations:
        - "Redis server process (additional maintenance)"
        - "RAM usage (~100MB for 7-day cache)"
        - "Persistence configuration (RDB snapshots)"

