        win_support: true
        notes: "Feature orchestrators (minor platform-specific components, all optional)"
      - phase: 11
        badge: "🟡 PLATFORM-AWARE"
        mac_support: true
        win_support: true
        notes: "CORTEX LENS (minor platform-specific components, all optional)"
  
  protection_mechanisms:
    core_005_enforcement:
      rule: "Path Portability"
      enforcement: "Use pathlib.Path for ALL file operations"
      blocked_patterns:
        - "/Users/ (hardcoded MAC path)"
        - "C:\\ (hardcoded WIN path)"
      pre_commit_hook: "scripts/pre-commit (blocks platform-specific patterns)"
      
    cross_platform_testing:
      markers:
        - "@pytest.mark.cross_platform (must pass on BOTH MAC and WIN)"
        - "@pytest.mark.mac (only runs on MAC, skipped on WIN)"
        - "@pytest.mark.win (only runs on WIN, skipped on MAC)"
      ci_cd_matrix: ["ubuntu-latest", "windows-latest", "macos-latest"]
  
  merge_strategy:
    workflow: "Git-based continuous integration"
    steps:
      - "Feature branch: git checkout -b feat/AC-{ID}"
      - "Implement + test on local platform (MAC or WIN)"
      - "Push to origin: git push origin feat/AC-{ID}"
      - "CI/CD runs tests on BOTH platforms (GitHub Actions)"
      - "Merge after cross-platform validation passes"

