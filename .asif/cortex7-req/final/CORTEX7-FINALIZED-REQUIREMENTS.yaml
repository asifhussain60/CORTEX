success_metrics:
  
  audit_coverage:
    metric: "Percentage of operations with audit entries"
    target: "100%"
    measurement: "SELECT COUNT(DISTINCT correlation_id) FROM audit_logs"
  
  evidence_verification_rate:
    metric: "Percentage of implemented ACs with test evidence"
    target: "≥95%"
    current: "32.7%"
    measurement: "Count evidence_bundles / Count implemented ACs"
  
  hallucination_detection_rate:
    metric: "Percentage of hallucinations caught"
    target: "≥99%"
    measurement: "Count hallucinations detected / Count total claims"
  
  brittleness_score_avg:
    metric: "Average brittleness score across components"
    target: "≤0.30 (robust)"
    measurement: "AVG(brittleness_score) for all components"
  
  challenger_acceptance_rate:
    metric: "Percentage of challenges accepted by users"
    target: "≥70%"
    measurement: "Count accepted / Count total challenges"
  
  rag_query_accuracy:
    metric: "Percentage of RAG queries returning relevant results"
    target: "≥90%"
    measurement: "User feedback on RAG search results"
  
  tiered_memory_performance:
    hot_zone_latency:
      target: "<5ms"
      measurement: "AVG(query_time) for hot zone queries"
    
    warm_zone_latency:
      target: "<50ms"
      measurement: "AVG(query_time) for warm zone queries"
    
    cold_zone_latency:
      target: "<500ms"
      measurement: "AVG(query_time) for cold zone queries"
  
  challenger_pipeline_latency:
    target: "<5s"
    measurement: "AVG(pipeline_execution_time)"

