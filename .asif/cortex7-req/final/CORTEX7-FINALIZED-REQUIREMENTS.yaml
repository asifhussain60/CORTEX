    question_4: "NetworkX (start simple, migrate to Neo4j if needed)"
    question_5: "FAISS vector store"

# ==============================================================================
# APPROVED ARCHITECTURE DECISIONS
# ==============================================================================

approved_decisions:
  
  decision_1_audit_first:
    choice: "A - Audit-First (operations impossible without audit context)"
    rationale: "Guarantees evidence by construction"
    implementation:
      - "All operations use @audit_driven decorator"
      - "Runtime enforcement blocks operations without audit context"
      - "Zero manual logging required"
      - "Automatic evidence collection"
    
    enforcement_rules:
      - "tier0: @audit_driven REQUIRED on all primitives"
      - "tier1+: @audit_driven REQUIRED on all tools"
      - "Orchestrators: @audit_driven REQUIRED on all operations"
      - "Tests: Verify audit entries exist for all operations"
    
    new_skull_rules:
      CORE-032:
        name: "Audit-First Enforcement"
        severity: blocked
        description: "All operations MUST use @audit_driven decorator"
        enforcement: "Runtime check blocks operations without AuditContext"
        
      CORE-033:
        name: "Evidence Verification"
        severity: blocked
        description: "AC-ID marked 'implemented' MUST have audit evidence"
        enforcement: "Query audit.db for evidence before status update"
  
  decision_2_tiered_memory:
    choice: "A - Tiered memory (Hot/Warm/Cold zones)"
    rationale: "10x faster hot queries, 90% disk savings"
    implementation:
      hot_zone:
        technology: "Redis + SQLite"
        retention: "7 days"
        latency_target: "<5ms"
        size_limit: "100MB RAM, 1GB disk"
        
      warm_zone:
        technology: "SQLite only"
        retention: "30 days"
        latency_target: "<50ms"
        size_limit: "10GB disk"
        
      cold_zone:
        technology: "JSONL.gz with index"
        retention: "Unlimited"
        latency_target: "<500ms"
        size_limit: "Unlimited (archival)"
    
    aging_policy:
      hot_to_warm: "After 7 days"
      warm_to_cold: "After 30 days"
      cold_cleanup: "Never (permanent archive)"
    
    query_optimizer:
      - "Parse query for temporal keywords (today, yesterday, last week, etc.)"
      - "Route to appropriate zone based on time range"
      - "Fall back to next zone if not found"
  
  decision_3_challenger_pipeline:
    choice: "A - Full 5-stage pipeline"
    rationale: "Comprehensive analysis catches 95%+ issues"
    implementation:
      stages:
        - stage_1: "AST Analyzer (duplicate detection, SKULL checks)"
        - stage_2: "Knowledge Graph Reasoner (AC-ID relationships)"
        - stage_3: "Historical Pattern Matcher (git history + audit logs)"
        - stage_4: "RAG Semantic Search (FAISS vector search)"
        - stage_5: "Merger & Ranker (confidence-weighted top 3)"
      
      performance:
        target_latency: "<5s for full pipeline"
        parallel_execution: true
        caching: "Cache embeddings and graph queries"
      
      confidence_weights:
        ast_analyzer: 0.25
        knowledge_graph: 0.30
        historical_matcher: 0.25
        rag_search: 0.20
      
      output:
        max_challenges: 3
        min_confidence: 0.30
        format: "title, description, evidence, recommendation, confidence"
  
  decision_4_knowledge_graph:
    choice: "A - NetworkX (start simple)"
    rationale: "Python-native, no server, sufficient for <100k nodes"
    implementation:
      technology: "NetworkX (Python library)"
      migration_path: "Migrate to Neo4j if nodes exceed 100k"
      
      graph_structure:
        nodes:
          - "AC-IDs (110+ nodes)"
          - "Tools (200+ nodes as toolkit grows)"
          - "Patterns (50+ from tier3/)"
          - "Orchestrators (20+ nodes)"
        
        edges:
          - "implements (Tool → AC-ID)"
          - "depends_on (AC-ID → AC-ID)"
          - "uses (Tool → Tool)"
          - "applies_to (Pattern → AC-ID)"
      
      persistence: "Serialize to cortex-brain/database/knowledge-graph.gpickle"
      
      queries:
        - "Find AC-IDs related to capability (semantic similarity)"
        - "Find tools implementing AC-ID"
        - "Find patterns applicable to category"
        - "Detect circular dependencies"
  
  decision_5_vector_store:
    choice: "A - FAISS"
    rationale: "Fast, battle-tested, handles <1M vectors"
    implementation:
      technology: "FAISS (Facebook AI Similarity Search)"
      embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
      dimension: 384
      index_type: "IVF_FLAT (inverted file index)"
      
      indexed_content:
        - "All YAML files in cortex-brain/ (~200 files)"
        - "All AC-ID descriptions from AC-INDEX.yaml (110 entries)"
        - "All domain patterns from tier3/ (50+ patterns)"
        - "All audit log messages (last 30 days, ~10k entries)"
        - "All git commit messages (all branches, ~5k commits)"
      
      persistence: "cortex-brain/database/vector-index.faiss"
      metadata_db: "cortex-brain/database/cortex-unified.db (vector_index table)"
      
      query_process:
        - "Embed user query (384-dim vector)"
        - "FAISS similarity search (top-k=20)"
        - "Re-rank by relevance + recency + success rate"
        - "Return top-3 with source citations"

# ==============================================================================
# COMPLETE ARCHITECTURE SPECIFICATION
# ==============================================================================

architecture:
  name: "CORTEX 7.0 Audit-Driven RAG"
  layers: 6
  
  layer_0_audit_foundation:
    name: "Audit Foundation Layer"
    components:
      - AuditContext (context manager)
      - "@audit_driven decorator"
      - TieredMemoryManager (Redis + SQLite + JSONL.gz)
      - EvidenceCollector (auto-capture test results)
      - IntegrityVerifier (hash chain validation)
    
    responsibilities:
      - "Enforce audit-first pattern (block operations without context)"
      - "Manage tiered memory (hot/warm/cold zones)"
      - "Collect evidence automatically"
      - "Verify hash chain integrity"
      - "Track correlation IDs"
  
  layer_1_toolkit_primitives:
    name: "Toolkit Primitives"
    components:
      - file_ops (pathlib + @audit_driven)
      - db_ops (SQLite + WAL + @audit_driven)
      - git_ops (GitPython + @audit_driven)
      - json_ops (@audit_driven)
      - yaml_ops (@audit_driven)
    
    rules:
      - "All primitives MUST use @audit_driven"
      - "All primitives MUST be cross-platform (CORE-005)"
      - "All primitives MUST have 100% test coverage"
  
  layer_2_intelligence_layer:
    name: "Intelligence & Challenge Layer"
    components:
      - ASTAnalyzer (Python ast module)
      - KnowledgeGraphReasoner (NetworkX)
      - HistoricalPatternMatcher (git history + audit logs)
      - RAGSemanticSearchEngine (FAISS)
      - ChallengerPipeline (5-stage orchestrator)
      - ConfidenceScorer (weighted ranker)
    
    responsibilities:
      - "Analyze code for duplicates and violations"
      - "Query knowledge graph for patterns"
      - "Search git history and audit logs"
      - "Perform semantic search via FAISS"
      - "Challenge user with top 3 recommendations"
  
  layer_3_composed_tools:
    name: "Composed Tools"
    enhancement: "Query intelligence layer before execution"
  
  layer_4_domain_tools:
    name: "Domain Tools"
    enhancement: "Full RAG integration"
  
  layer_5_orchestrators:
    name: "Orchestrator Layer"
    enhancement: "Challenger integration before routing"
  
  layer_6_rag_interface:
    name: "RAG Query Interface"
    components:
      - NaturalLanguageParser
      - ChallengerPipeline
      - IntentRouter (enhanced)
      - QueryExecutor
      - ResponseFormatter

# ==============================================================================
# HARD EVIDENCE FRAMEWORK
# ==============================================================================

evidence_framework:
  
  level_1_operation_evidence:
    requirement: "Every operation has audit entry"
    verification_query: "SELECT COUNT(*) FROM audit_logs WHERE operation=? AND correlation_id=?"
    failure_action: "Block operation as 'not executed'"
  
  level_2_ac_implementation_evidence:
    requirement: "AC-ID marked 'implemented' requires test evidence"
    verification_query: |
      SELECT COUNT(*) FROM audit_logs 
      WHERE ac_id=? 
        AND category='validation' 
        AND operation='test_execution'
        AND json_extract(context, '$.test_result') = 'passed'
    failure_action: "Downgrade status from 'implemented' to 'claimed'"
  
  level_3_workflow_evidence:
    requirement: "End-to-end workflow has complete correlation chain"
    expected_sequence:
      - orchestrator.start
      - validation.pre_check
      - execution.implement
      - validation.test
      - evidence.bundle
      - orchestrator.complete
    failure_action: "Flag workflow as 'incomplete'"
  
  level_4_governance_compliance:
    requirement: "SKULL rule enforcement logged"
    verification_query: |
      SELECT * FROM audit_logs
      WHERE category='governance'
        AND operation='rule_enforcement'
    failure_action: "Flag operation as 'ungoverned'"
  
  level_5_hallucination_detection:
    detection_steps:
      - "Parse orchestrator response for AC-ID claims"
      - "Query audit.db for AC-ID entries"
      - "Check for test execution + evidence bundle"
      - "Verify test results actually passed"
    
    hallucination_indicators:
      - "No audit entries for claimed AC-ID"
      - "Test execution logged but failed"
      - "Evidence bundle missing"
      - "Timestamp mismatch (claimed before implemented)"
    
    automated_action:
      - "Alert user: 'Hallucination detected'"
      - "Show evidence gap"
      - "Downgrade completion status"
      - "Log hallucination event for analysis"
  
  level_6_brittleness_detection:
    brittleness_score_formula: |
      score = (
        0.3 * (fan_in_count / max_fan_in) +
        0.3 * circular_dependency_count +
        0.2 * (1 - test_coverage) +
        0.2 * governance_violation_count
      )
    
    brittleness_indicators:
      - "Tool called by 50+ operations"
      - "Circular dependencies detected"
      - "No error handling"
      - "Hard-coded paths (CORE-005 violation)"
      - "No test coverage"
    
    automated_action:
      - "Alert user if score > 0.7"
      - "Show dependency graph visualization"
      - "Recommend refactoring plan"

# ==============================================================================
# DATABASE SCHEMA (ENHANCED)
# ==============================================================================

database_schema:
  database_file: "cortex-brain/database/cortex-unified.db"
  schema_version: "2.0.0"
  
  tables:
    audit_logs:
      description: "Primary audit trail (hot zone)"
      columns:
        - id (INTEGER PRIMARY KEY)
        - timestamp (TEXT NOT NULL)
        - level (TEXT NOT NULL)
        - category (TEXT NOT NULL)
        - component (TEXT NOT NULL)
        - operation (TEXT NOT NULL)
        - message (TEXT)
        - ac_id (TEXT)
        - correlation_id (TEXT)
        - duration_ms (REAL)
        - context (JSON)
        - metadata (JSON)
        - event_hash (TEXT NOT NULL)
        - prev_event_hash (TEXT)
      indexes:
        - idx_timestamp
        - idx_correlation
        - idx_ac_id
        - idx_category_level
        - idx_event_hash
    
    audit_logs_warm:
      description: "Warm zone (7-30 days)"
      schema: "Same as audit_logs"
    
    evidence_bundles:
      columns:
        - id (INTEGER PRIMARY KEY)
        - ac_id (TEXT NOT NULL)
        - correlation_id (TEXT NOT NULL)
        - timestamp (TEXT NOT NULL)
        - test_framework (TEXT)
        - total_tests (INTEGER)
        - passed_tests (INTEGER)
        - failed_tests (INTEGER)
        - skipped_tests (INTEGER)
        - coverage_percentage (REAL)
        - test_results (JSON)
        - evidence_file (TEXT)
    
    knowledge_graph_nodes:
      columns:
        - id (INTEGER PRIMARY KEY)
        - node_type (TEXT NOT NULL)
        - node_id (TEXT UNIQUE NOT NULL)
        - properties (JSON)
        - embedding (BLOB)
        - created_at (TEXT)
        - updated_at (TEXT)
    
    knowledge_graph_edges:
      columns:
        - id (INTEGER PRIMARY KEY)
        - from_node_id (TEXT NOT NULL)
        - to_node_id (TEXT NOT NULL)
        - edge_type (TEXT NOT NULL)
        - properties (JSON)
        - created_at (TEXT)
    
    vector_index:
      columns:
        - id (INTEGER PRIMARY KEY)
        - content_type (TEXT NOT NULL)
        - content_id (TEXT NOT NULL)
        - content_text (TEXT)
        - embedding (BLOB)
        - timestamp (TEXT)
    
    challenge_history:
      columns:
        - id (INTEGER PRIMARY KEY)
        - timestamp (TEXT NOT NULL)
        - challenge_type (TEXT NOT NULL)
        - challenge_description (TEXT)
        - recommendation (TEXT)
        - confidence (REAL)
        - user_response (TEXT)
        - user_rationale (TEXT)
        - correlation_id (TEXT)

