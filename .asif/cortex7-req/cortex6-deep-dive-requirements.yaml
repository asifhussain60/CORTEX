          - Suggest compression
        file: "token-efficiency-metrics.yaml"

  # --------------------------------------------------------------------------
  # GOVERNANCE MERGER INTEGRATION
  # --------------------------------------------------------------------------
  governance_merger:
    description: "4-tier rule merging with precedence resolution"
    implementation: "src/orchestrators/core/governance_merger.py"
    
    merge_algorithm:
      step_1: "Load Tier 0 (CORTEX_CORE) - immutable"
      step_2: "Load Tier 1 (BUSINESS_TIER_0) - active epic"
      step_3: "Load Tier 2 (COMPANY_PRACTICES) - standards"
      step_4: "Load Tier 3 (KNOWLEDGE_PRACTICES) - learned"
      step_5: "Resolve conflicts - Tier 0 wins all"
      step_6: "Deduplicate rules"
      step_7: "Cache merged result"
      
    requirements:
      - id: REQ-MERGER-001
        title: "Precedence Resolution"
        description: |
          Tier 0 wins all conflicts:
          - If same rule in multiple tiers, use Tier 0 version
          - Lower tiers can extend but not override
          - Conflicts logged for review
        
      - id: REQ-MERGER-002
        title: "Performance <100ms"
        description: |
          Full merge completes in under 100ms:
          - Caching enabled
          - Lazy loading
          - Incremental updates
        acceptance_criteria: "AC-GOV-004"
        
      - id: REQ-MERGER-003
        title: "MasterOrchestrator Context Building"
        description: |
          Provide unified context for execution:
          - Merged rules passed to MasterOrchestrator
          - Context includes all 4 tiers
          - Used for request evaluation

