response_template_integration:
  description: "Custom user response templates with 3-layer architecture"
  current_version: "v4.6.0"
  current_file: "cortex-brain/response-templates-v4.yaml"
  current_lines: 498
  target_architecture: "3-layer composable system"
  
  # --------------------------------------------------------------------------
  # CURRENT SYSTEM (v4.6.0)
  # --------------------------------------------------------------------------
  current_system:
    file: "cortex-brain/response-templates-v4.yaml"
    schema_version: "4.6.0"
    last_updated: "2026-01-13"
    architecture: "cortex_4_0_ascii_progress_with_visual_tracking"
    
    key_features:
      - feature: "Mandatory CORTEX-4.0 Style Header"
        description: |
          Two-line operational header format:
          ## 🧠 CORTEX {operation_type}
          **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator} ✅
        enforced_by: "ResponseRenderer"
        
      - feature: "Mandatory Copyright Section"
        description: |
          Copyright line after header, before all content:
          **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
        enforcement: "Every response MUST include copyright"
        
      - feature: "ASCII Progress Bars (CORTEX-4.0 Style)"
        description: |
          Visual progress tracking with box-drawing characters:
          ┌────────────────────────────────────────────────────────────┐
          │     🧠 CORTEX {operation} - PROGRESS TRACKER               │
          ├────────────────────────────────────────────────────────────┤
          │ Overall Progress: `████████░░` 80% 🔄 In Progress          │
          └────────────────────────────────────────────────────────────┘
        bar_format: "10 blocks (█ filled, ░ empty)"
        
      - feature: "Executive Summary Sections"
        description: |
          Four standard sections:
          ✅ OUTCOMES (max 5 bullets)
          ⚙️ IN PROGRESS (max 3 bullets)
          ⚠️ RISKS (max 3 bullets)
          🎯 IMPACT (max 3 bullets)
        formatting_rule: "Each bullet on separate line with blank line after header"
        
      - feature: "Platform-Aware Continuation (MAC/WIN)"
        description: |
          Numeric selection for parallel development:
          1. Continue MAC track autonomously (Phase 11)
          2. Continue WIN track autonomously (Phase 10)
        platform_detection: "90% cross-platform (Phases 1-2, 4-10)"
        
      - feature: "Capability Translation"
        description: |
          Translate AC-IDs to human-readable names:
          - AC-AUDIT-007 → "Hash chain integrity validation"
          - Uses get_ac_title.sh for lookup
        rule: "NEVER display raw AC-ID codes to end users"
    
    component_structure:
      sections:
        - mandatory_header
        - executive_summary
        - capability_translation
        - progress_indicators
        - continuation
        - tier_routing
        - operation_templates
        - composition_rules
        - quality_gates
        - examples
      
      integration_script: "scripts/integrate_response_templates_lens_toolkit.py"
      renderer: "src/infrastructure/response_renderer.py"
  
  # --------------------------------------------------------------------------
  # REQUIREMENTS FOR CURRENT SYSTEM (v4.6.0)
  # --------------------------------------------------------------------------
  current_system_requirements:
    - id: REQ-RESP-001
      title: "Mandatory Header Enforcement"
      description: |
        Every response MUST start with CORTEX-4.0 header:
        - Line 1: ## 🧠 CORTEX {operation_type}
        - Line 2: **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator} ✅
        - Line 3: --- (separator)
        - Line 4: Copyright © 2025-2026 Asif Hussain. All rights reserved.
        - Line 5: --- (separator)
      enforcement: "ResponseRenderer injects automatically"
      violations_blocked: true
      
    - id: REQ-RESP-002
      title: "Executive Summary Format"
      description: |
        Standard four-section format:
        - ✅ OUTCOMES (required, max 5 bullets)
        - ⚙️ IN PROGRESS (optional, max 3 bullets)
        - ⚠️ RISKS (optional, max 3 bullets)
        - 🎯 IMPACT (optional, max 3 bullets)
        
        Critical formatting:
        - Blank line after section header
        - Each bullet on separate line
        - No nested bullets
      example_file: "response-templates-v4.yaml::executive_summary"
      
    - id: REQ-RESP-003
      title: "ASCII Progress Bar Rendering"
      description: |
        CORTEX-4.0 style visual progress:
        - Box-drawing characters (┌├└│─┐┤┘)
        - 10-block progress bars (█ filled, ░ empty)
        - Status icons (✅🔄⏳❌🚫)
        - Phase and overall metrics
      calculation: "completed_ac_ids / total_ac_ids * 10 blocks"
      
    - id: REQ-RESP-004
      title: "Platform-Aware Continuation"
      description: |
        Multi-machine development support:
        - Numeric selection (1-5 options)
        - MAC track continuation (Phases 3, 11)
        - WIN track continuation (Phases 1-2, 4-10)
        - References cortex-plan-executor.prompt.md
      platform_badges:
        - "🟢 CROSS-PLATFORM (90%)"
        - "🟡 PLATFORM-AWARE (10%)"
      
    - id: REQ-RESP-005
      title: "Capability Translation (No AC-ID Codes)"
      description: |
        User-facing output never shows AC-IDs:
        - Use get_ac_title.sh to translate
        - Display human-readable capability names
        - AC-IDs in internal logs only
      script: "scripts/get_ac_title.sh"
      
    - id: REQ-RESP-006
      title: "Tier-Based Response Routing"
      description: |
        Variable detail levels by complexity:
        - INSTANT: <50 tokens, 0 sections (simple confirmations)
        - QUICK: 50-200 tokens, 2-3 sections (status updates)
        - STANDARD: 200-800 tokens, 4-5 sections (implementation reports)
        - DETAILED: 800+ tokens, full structure (complex analysis)
      selector: "Token count + operation complexity"
  
  # --------------------------------------------------------------------------
  # FUTURE: 3-LAYER ARCHITECTURE (Phase 9.7+)
  # --------------------------------------------------------------------------
  future_3layer_architecture:
    status: "documented"
    target_phase: "Phase 9.7 or CORTEX 7.0"
    design_file: "cortex-brain/documents/architecture/response-template-architecture.md"
    enhancement_id: "ENH-TEMPLATE-001"
    
    problem_statement:
      current_bloat: "2046 lines (before v4.6.0 cleanup → now 498 lines)"
      issues:
        - "Duplication across 40+ orchestrators"
        - "Maintenance burden for common patterns"
        - "CORE-002 violation (max 300 lines target)"
        - "Scalability concerns with 80-160 orchestrators planned"
      root_cause: "Templates defined inline instead of referencing reusable blocks"
    
    proposed_layers:
      layer_1_core_blocks:
        location: "cortex-brain/tier0/response-blocks.yaml"
        max_lines: 50
        content: "15-20 atomic markdown fragments"
        governance: "CORE-002 enforced"
        blocks:
          - "header - Orchestrator branding"
          - "progress - Current state"
          - "next_steps - Actionable items"
          - "error - Error formatting"
          - "warning - Warning formatting"
          - "completion - Success messaging"
          - "understanding - Request summary"
          - "changes - File modifications"
          - "validation - Test results"
        
      layer_2_category_templates:
        location: "cortex-brain/tier2/response-templates/{category}.yaml"
        max_lines_per_file: 50
        categories:
          - name: "core.yaml"
            orchestrators: ["Planning", "TDD", "Investigation"]
            lines: 40
          - name: "integration.yaml"
            orchestrators: ["ADO", "Git", "External APIs"]
            lines: 40
          - name: "maintenance.yaml"
            orchestrators: ["Vacuum", "Cleanup", "Sanitization"]
            lines: 40
          - name: "conversion.yaml"
            orchestrators: ["Data transformers"]
            lines: 40
          - name: "security.yaml"
            orchestrators: ["Security-specific"]
            lines: 40
        
      layer_3_orchestrator_overrides:
        location: "cortex-brain/manifests/orchestrators/{name}.yaml → response_config:"
        max_lines: 15
        content: "Only deviations from category template"
        features:
          - "Inherits category composition"
          - "Falls back to core blocks"
          - "Multi-category support (e.g., ADO = integration + planning)"
    
    precedence_resolution:
      algorithm: "orchestrator > category > core"
      flow:
        step_1: "Load core blocks (tier0/response-blocks.yaml)"
        step_2: "Load category template (tier2/response-templates/{category}.yaml)"
        step_3: "Load orchestrator overrides (manifests/{orch}/response_config)"
        step_4: "Merge with precedence: orchestrator wins conflicts"
        step_5: "Compose blocks per work breakdown structure"
        step_6: "Return markdown"
      
      example: |
        Core:       header: "# {orchestrator_name}"
        Category:   header: "# 🔧 {orchestrator_name} - {category}"
        Orchestrator: header: "# 🎯 Custom Header"
        Result:     "# 🎯 Custom Header" (orchestrator wins)
    
    success_metrics:
      - metric: "Total template lines"
        target: "<300"
        current: 498
        reduction: "85% from original 2046"
      - metric: "Response render time"
        target: "<50ms"
        current: "~45ms"
      - metric: "Consistency score"
        target: "100%"
        current: "~70%"
      - metric: "Maintenance events/month"
        target: "<2"
        current: "~8"
    
    acceptance_criteria:
      - AC-TEMPLATE-001: "Extract Core Blocks"
      - AC-TEMPLATE-002: "Block Schema Validation"
      - AC-TEMPLATE-003: "ResponseRenderer Block Loader"
      - AC-TEMPLATE-004: "Create Category Templates"
      - AC-TEMPLATE-005: "Category Inheritance Resolver"
      - AC-TEMPLATE-006: "Backwards Compatibility Layer"
      - AC-TEMPLATE-007: "Migrate Core Orchestrators"
      - AC-TEMPLATE-008: "Delete v4.yaml After Validation"
  
  # --------------------------------------------------------------------------
  # INTEGRATION REQUIREMENTS
  # --------------------------------------------------------------------------
  integration_requirements:
    - id: REQ-RESP-INT-001
      title: "ResponseRenderer Integration"
      description: |
        Central rendering engine for all responses:
        - Loads response-templates-v4.yaml on startup
        - Caches templates for performance (<50ms render)
        - Injects mandatory header automatically
        - Formats executive summaries
        - Generates ASCII progress bars
      implementation: "src/infrastructure/response_renderer.py"
      
    - id: REQ-RESP-INT-002
      title: "MasterOrchestrator Template Selection"
      description: |
        MasterOrchestrator selects template tier:
        - Analyzes operation complexity
        - Counts estimated tokens
        - Routes to INSTANT/QUICK/STANDARD/DETAILED
        - Passes to ResponseRenderer
      implementation: "src/orchestrators/core/master_orchestrator.py"
      
    - id: REQ-RESP-INT-003
      title: "Get AC Title Integration"
      description: |
        Capability translation via shell script:
        - Script: scripts/get_ac_title.sh
        - Input: AC-ID code
        - Output: Human-readable title
        - Called by ResponseRenderer before output
      script: "scripts/get_ac_title.sh"
      lookup_source: "cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml"
      
    - id: REQ-RESP-INT-004
      title: "Toolkit Centralization Integration"
      description: |
        Response templates exposed via MCP toolkit:
        - Registry: tier0/governance/mcp-tools-registry.yaml
        - Module: response_templates
        - Tools: format_response, get_template, list_templates
        - Accessed via ToolkitOrchestrator → MasterOrchestrator
      integration_script: "scripts/integrate_response_templates_lens_toolkit.py"
      
    - id: REQ-RESP-INT-005
      title: "Multi-Repo MCP Server Support"
      description: |
        Response templates available cross-repo:
        - Single CORTEX installation
        - MCP server exposes templates
        - User repos query via MCP
        - Consistent formatting across projects
      mcp_protocol: "Model Context Protocol"
      
    - id: REQ-RESP-INT-006
      title: "Version Control and Backward Compatibility"
      description: |
        Template versioning for stability:
        - Current: v4.6.0
        - Previous: v4.5.1, v4.2.0, v4.0.0
        - Feature flags for gradual rollout
        - Deprecation warnings for old versions
      migration_path: "v4.6.0 → 3-layer (Phase 9.7+)"
  
  # --------------------------------------------------------------------------
  # QUALITY GATES
  # --------------------------------------------------------------------------
  quality_gates:
    - id: REQ-RESP-GATE-001
      title: "Header Injection Verification"
      description: "Every response includes mandatory header"
      test: "tests/infrastructure/test_response_renderer.py::test_mandatory_header"
      
    - id: REQ-RESP-GATE-002
      title: "Copyright Presence Check"
      description: "Copyright line present after header"
      test: "tests/infrastructure/test_response_renderer.py::test_copyright_present"
      
    - id: REQ-RESP-GATE-003
      title: "Executive Summary Format Validation"
      description: "Bullets on separate lines, max counts enforced"
      test: "tests/infrastructure/test_response_renderer.py::test_executive_format"
      
    - id: REQ-RESP-GATE-004
      title: "ASCII Progress Bar Accuracy"
      description: "Progress bars match actual completion percentages"
      test: "tests/infrastructure/test_response_renderer.py::test_progress_bar_rendering"
      
    - id: REQ-RESP-GATE-005
      title: "Render Performance <50ms"
      description: "Template loading and rendering under 50ms"
      test: "tests/performance/test_response_render_performance.py"

