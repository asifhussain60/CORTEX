  database_infrastructure:
    requirements:
      - id: REQ-DB-001
        title: "SQLite WAL Mode"
        description: |
          Write-Ahead Logging for concurrency:
          - Multiple readers without blocking
          - Single writer with immediate consistency
          - Checkpoint management
        databases:
          - "audit.db"
          - "governance.db"
          - "planning_state.db"
        
      - id: REQ-DB-002
        title: "Per-Repository Database Isolation (AC-AUDIT-005)"
        description: |
          Separate databases per repo:
          - audit.db per repository
          - No cross-repo data leakage
          - Multi-repo manager handles routing
        
      - id: REQ-DB-003
        title: "Database Schema Migrations"
        description: |
          Version-controlled schema changes:
          - migrations/ directory
          - Sequential migration files
          - Rollback capability
        location: "migrations/"
  
  state_management:
    requirements:
      - id: REQ-STATE-001
        title: "Atomic State Manager"
        description: |
          Atomic state transitions:
          - File locking (fcntl/msvcrt)
          - Backup before write
          - Rollback on failure
          - Verification after write
        implementation: "src/infrastructure/atomic_state_manager.py"
        
      - id: REQ-STATE-002
        title: "Progress Tracker Manager"
        description: |
          Specialized manager for progress-tracker.json:
          - Atomic writes only
          - Calculates percentages from AC counts
          - Syncs to dashboard
          - Maintains backups
        implementation: "src/infrastructure/progress_tracker_manager.py"
  
  response_template_architecture:
    requirements:
      - id: REQ-TEMPLATE-001
        title: "3-Layer Template System"
        description: |
          Hierarchical template inheritance:
          - Layer 0: Core templates (tier0/templates/)
          - Layer 1: Orchestrator templates
          - Layer 2: Custom overrides
        
      - id: REQ-TEMPLATE-002
        title: "Template Versioning"
        description: |
          Version control for templates:
          - response-templates-v4.yaml current
          - Backward compatibility maintained
          - Migration path documented
        file: "cortex-brain/response-templates-v4.yaml"
  
  audit_logging:
    requirements:
      - id: REQ-AUDIT-001
        title: "Log Retention Policies"
        description: |
          Tiered retention:
          - CRITICAL/ERROR: 90 days
          - WARNING: 60 days
          - INFO: 30 days
          - DEBUG/TRACE: 7 days
        
      - id: REQ-AUDIT-002
        title: "Correlation ID Tracking"
        description: |
          End-to-end traceability:
          - UUID per request
          - Propagated through all operations
          - Queryable in audit.db
        
      - id: REQ-AUDIT-003
        title: "Hash Chain Integrity (AC-AUDIT-007)"
        description: |
          Tamper detection:
