# ==============================================================================
# TASK-009 to TASK-012: TDD ORCHESTRATOR COMPLETE REQUIREMENTS
# ==============================================================================

tdd_orchestrator_complete:
  description: "Complete TDD-Master orchestrator architecture and requirements"
  implementation: "src/orchestrators/tdd_master/"
  
  architecture:
    orchestrator_file: "tdd_master_orchestrator.py"
    coordination_layer: true
    bridges: "PlanningOrchestrator → TDD workflow"
    
    workflow:
      step_1: "Detect completed plans via config.yaml validation"
      step_2: "Transform Planning data → TDD context JSON"
      step_3: "Invoke TDD Orchestrator with enriched context"
      step_4: "Execute RED → GREEN → REFACTOR cycle"
      step_5: "Collect test evidence"
      step_6: "Update progress tracker"
      
    components:
      - name: "TDDMasterOrchestrator"
        purpose: "Main coordination class"
        
      - name: "TDDMasterConfig"
        purpose: "Configuration management"
        
      - name: "TDDMasterContext"
        purpose: "Execution context"
        
      - name: "TDDMasterResult"
        purpose: "Result structure"
        
      - name: "TDDInvocationResult"
        purpose: "Test invocation results"
  
  core_008_enforcement:
    rule: "CORE-008: Test-Driven Development Mandatory"
    description: |
      ALL code must follow TDD:
      - RED: Write failing test first
      - GREEN: Implement minimum code to pass
      - REFACTOR: Improve code quality
    blocked_operations:
      - "Direct code implementation without tests"
      - "Copilot cannot write implementation directly"
      - "Must route through TDD-Master"
  
  core_019_enforcement:
    rule: "CORE-019: All Development Must Go Through TDD-Master"
    description: |
      No direct coding allowed:
      - GitHub Copilot routes to TDD-Master
      - MasterOrchestrator enforces routing
      - Violations blocked at runtime
    integration: "MasterOrchestrator → TDD-Master routing"
  
  acceptance_criteria:
    - id: AC-TDD-001
      title: "RED Phase - Failing Test Creation"
      description: "Generate failing test before implementation"
      
    - id: AC-TDD-002
      title: "GREEN Phase - Minimal Implementation"
      description: "Implement minimum code to pass test"
      
    - id: AC-TDD-003
      title: "REFACTOR Phase - Code Quality"
      description: "Improve code while maintaining tests"
      
    - id: AC-TDD-004
      title: "Test Evidence Collection"
      description: "Collect pytest results as evidence"
      
    - id: AC-TDD-005
      title: "Coverage Threshold Enforcement"
      description: "Require ≥80% test coverage"
      
    - id: AC-TDD-006
      title: "MasterOrchestrator Integration"
      description: "Seamless routing from MasterOrchestrator"
      
    - id: AC-TDD-007
      title: "Planning Context Transformation"
      description: "Transform plan YAML → TDD JSON context"
      
    - id: AC-TDD-008
      title: "Audit Trail Integration"
      description: "Log all TDD operations to audit trail"
      
    - id: AC-TDD-009
      title: "Evidence Bundle Generation"
      description: "Generate evidence bundle per AC-ID"
      
    - id: AC-TDD-010
      title: "Progress Tracker Update"
      description: "Update tracker after test success"
  
  requirements:
    - id: REQ-TDD-001
      title: "TDD-Master as Coordination Layer"
      description: |
        Bridge between Planning and TDD execution:
        - Receives completed plans
        - Transforms to TDD context
        - Invokes TDD workflow
        - Collects evidence
        - Updates state
      file: "src/orchestrators/tdd_master/tdd_master_orchestrator.py"
      
    - id: REQ-TDD-002
      title: "RED → GREEN → REFACTOR Workflow"
      description: |
        Three-phase TDD cycle:
        - RED: Create failing test (validates requirement understanding)
        - GREEN: Minimal implementation (passes test)
        - REFACTOR: Improve quality (maintain passing tests)
      enforcement: "CORE-008"
      
    - id: REQ-TDD-003
      title: "Test Evidence as Acceptance Proof"
      description: |
        Tests prove AC-ID completion:
        - Pytest results captured
        - Coverage measured
        - Evidence bundle generated
        - Audit trail logged
      validation_gates:
        - "Test coverage ≥80%"
        - "All tests passing"
        - "Evidence bundle complete"
      
    - id: REQ-TDD-004
      title: "No Direct Implementation (CORE-019)"
      description: |
        All code through TDD-Master:
        - GitHub Copilot cannot code directly
        - Must route through MasterOrchestrator
        - MasterOrchestrator routes to TDD-Master
        - Violations blocked
      enforcement: "Runtime blocking via GovernanceMerger"

# ==============================================================================
# TASK-013 to TASK-017: GIT HISTORY PROBLEMATIC PATTERNS
# ==============================================================================

git_history_problematic_patterns:
  description: "Patterns identified from git history analysis"
  total_commits_analyzed: 40
  
  hallucination_patterns:
    description: "False positive implementations and incorrect assumptions"
    commits_found: 20
    
    patterns_identified:
      - pattern: "Hardcoded data in dashboards"
        commits:
          - "b91fffff3: Remove 2 duplicate phase definitions"
          - "41a367364: Remove hardcoding from plan-viewer"
        root_cause: "Static HTML with hardcoded values instead of SSOT"
        prevention: "SSOT architecture with dynamic data loading"
        
      - pattern: "SSOT duplication and drift"
        commits:
          - "5c0ee37a1: Recover SSOT from chat01.md hallucination"
          - "5020c169d: Delete SSOT duplicate files"
          - "a08e3bc30: Reconcile progress-tracker.json"
        root_cause: "Multiple files claiming to be source of truth"
        prevention: "4 primary SSOT files, strict enforcement"
        
      - pattern: "False positive completion claims"
        commits:
          - "56913d93b: Reset tracker to evidence-based counts"
          - "21b7569ae: Evidence-based validation"
        root_cause: "Tracker updated without test evidence"
        prevention: "Evidence-based validation (AC-VALIDATE-001/002/003)"
        
      - pattern: "Hallucinated AC-IDs"
        commits:
          - "331882841: Comprehensive hallucination root cause analysis"
        root_cause: "Created AC-IDs not in AC-INDEX"
        prevention: "AC-ID existence validation before reference"
    
    requirements:
      - id: REQ-HALLUC-001
        title: "Evidence-Based Validation"
        description: |
          All completion claims require evidence:
          - Test results required
          - Audit trail required
          - Evidence bundle required
          - No self-reported completion
        implementation: "AC-VALIDATE-001, AC-VALIDATE-002, AC-VALIDATE-003"
        
      - id: REQ-HALLUC-002
        title: "SSOT Strict Enforcement"
        description: |
          Only 4 files are source of truth:
          - master-plan.yaml (architecture)
          - progress-tracker.json (execution)
          - AC-INDEX.yaml (definitions)
          - core-rules.yaml (governance)
          - All other files derived
        toolkit: "SSOT-INTEGRITY-TOOLKIT.md"
        
      - id: REQ-HALLUC-003
        title: "AC-ID Existence Validation"
        description: |
          Validate AC-IDs before use:
          - Check AC-INDEX.yaml
          - Block if not found
          - Log validation failures
        implementation: "AC-VALIDATE-002"
  
  brittleness_patterns:
    description: "Fragile code and tight coupling issues"
    commits_found: 20
    
    patterns_identified:
      - pattern: "Multiple toolkit instantiation (CORE-026/27/28)"
        commits:
          - "bafb30919: Comprehensive brittleness fix"
        root_cause: "ToolkitOrchestrator instantiated directly in multiple places"
        prevention: "Single path through MasterOrchestrator only"
        fix_doc: "CORTEX-TOOLKIT-SINGLE-PATH-FIX.md"
        
      - pattern: "Hardcoded file paths (CORE-005)"
        commits:
          - "0f2dadbee: Remove all hardcoded paths"
        root_cause: "/Users/asif or C:\\ hardcoded in code"
        prevention: "pathlib.Path + get_project_root()"
        
      - pattern: "Tight orchestrator coupling"
        commits:
          - "3edf24a64: Permanent brittleness elimination"
          - "88badc2b6: Phase 9.4 critical brittleness remediation"
        root_cause: "Direct orchestrator dependencies"
        prevention: "MasterOrchestrator routing layer"
        
      - pattern: "Dashboard data duplication"
        commits:
          - "f98a0a141: Redesign plan-viewer as dynamic dashboard"
        root_cause: "Multiple sync scripts with conflicting logic"
        prevention: "Single regenerate_plan_viewer_data.py script"
    
    requirements:
      - id: REQ-BRITTLE-001
        title: "Single Toolkit Access Path (CORE-026)"
        description: |
          ToolkitOrchestrator accessed ONE way:
          - Only through MasterOrchestrator
          - No direct instantiation
          - Pre-commit hooks enforce
        fix_doc: "CORTEX-TOOLKIT-SINGLE-PATH-FIX.md"
        
      - id: REQ-BRITTLE-002
        title: "Path Portability (CORE-005)"
        description: |
          No hardcoded paths:
          - Use pathlib.Path
          - Use get_project_root()
          - No /Users/ or C:\\ in code
        enforcement: "Pre-commit hooks block violations"
        
      - id: REQ-BRITTLE-003
        title: "Loose Orchestrator Coupling"
        description: |
          Orchestrators communicate via MasterOrchestrator:
          - No direct orchestrator imports
          - Use MasterOrchestrator routing
          - Dependency injection pattern
        
      - id: REQ-BRITTLE-004
        title: "Single Dashboard Sync Script"
        description: |
          One script for dashboard updates:
          - regenerate_plan_viewer_data.py ONLY
          - Reads from SSOT files
          - Writes to plan-viewer-data.json
          - Triggered by MasterOrchestrator
        deprecated:
          - "sync_plan_viewer_data.py"
          - "sync_plan_viewer_holistic.py"
  
  regression_patterns:
    description: "Regressions and broken functionality"
    
    patterns_identified:
      - pattern: "Dashboard data loading broken"
        commits:
          - "ff6dbaa76: Restore data loading after toolkit integration"
        root_cause: "Toolkit changes broke dashboard integration"
        prevention: "Integration tests required"
        
      - pattern: "Test suite failures after refactor"
        root_cause: "No regression test suite"
        prevention: "AC-STS-001: Golden corpus with 100+ test intents"
    
    requirements:
      - id: REQ-REGRESS-001
        title: "Integration Test Suite Required"
        description: |
          Catch regressions before merge:
          - tests/integration/ for cross-component tests
          - Run on every commit
          - Block merge if failing
        
      - id: REQ-REGRESS-002
        title: "Golden Corpus Test Suite (AC-STS-001)"
        description: |
          100+ test intents for validation:
          - Covers all orchestrators
          - Tests all AC-IDs
          - Run before phase gates
        implementation: "AC-STS-001, AC-STS-002"
  
  context_loss_patterns:
    description: "Stale state and context drift"
    
    patterns_identified:
      - pattern: "Stale progress percentages"
        root_cause: "Calculated from wrong file"
        prevention: "Always calculate from progress-tracker.json"
        
      - pattern: "Outdated AC-ID references"
        root_cause: "AC-INDEX.yaml not authoritative"
        prevention: "AC-INDEX as single definition source"
    
    requirements:
      - id: REQ-CONTEXT-001
        title: "Always Load Fresh Context"
        description: |
          Never cache critical state:
          - progress-tracker.json read fresh
          - AC-INDEX.yaml read fresh
          - core-rules.yaml can cache (immutable)
        
      - id: REQ-CONTEXT-002
        title: "Context Verification Protocol"
        description: |
          Verify context before operations:
          - Load working state
          - Verify governance
          - Check AC registry
          - Validate evidence
  
  performance_patterns:
    description: "Performance bottlenecks and optimizations"
    
    patterns_identified:
      - pattern: "Token overflow (HTTP 502)"
        root_cause: "Operations >500 lines"
        prevention: "CORE-001: Small incremental operations"
        
      - pattern: "Governance merge >100ms"
        root_cause: "No caching"
        prevention: "AC-GOV-004: Performance <100ms with caching"
    
    requirements:
      - id: REQ-PERF-001
        title: "Small Incremental Operations (CORE-001)"
        description: |
          Split large operations:
          - <500 lines per execution
          - Prevents token overflow
          - Maintains responsiveness
        
      - id: REQ-PERF-002
        title: "Governance Merge Caching"
        description: |
          Cache merged governance:
          - <100ms merge time
          - Invalidate on tier0 changes
          - Lazy load on demand
        implementation: "AC-GOV-004"

