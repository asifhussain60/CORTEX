# ==============================================================================
# CORTEX 7.0 VISION REQUIREMENTS (Missing from v6 - Carried Forward)
# ==============================================================================
cortex7_vision_requirements:

  # ============================================================================
  # 1. INTENT MANAGEMENT & CLARIFICATION PROTOCOL
  # ============================================================================
  intent_management:
    category: CORE_PROTOCOL
    priority: CRITICAL
    description: "Echo user intent back and get confirmation before execution"
    current_implementation:
      file: ".github/prompts/CORTEX.prompt.md"
      section: "INTENT CLARIFICATION PROTOCOL"
    requirements:
      - id: REQ-INTENT-001
        title: "Intent Echo Protocol"
        description: |
          ALWAYS execute intent clarification protocol before any orchestrator invocation:
          1. Parse user request into structured intent
          2. Echo intent back in executive bullet format
          3. Ask "IS THIS CORRECT? (Yes / No / Clarify)"
          4. Only proceed after user confirms
        acceptance_criteria:
          - User intent echoed in bullets before execution
          - User explicitly confirms with "Yes" before proceeding
          - "No" triggers re-parse and re-clarification
          - "Clarify" triggers follow-up questions
        
      - id: REQ-INTENT-002
        title: "Intent Parse Structure"
        description: |
          Convert natural language to structured intent:
          - Primary action (implement, validate, plan, investigate, etc.)
          - Scope (single AC-ID, phase, epic, etc.)
          - Constraints/context (dependencies, blockers)
          - Expected outcome
        
      - id: REQ-INTENT-003
        title: "Executive Summary Format"
        description: |
          Response format for intent echo:
          🎯 YOU WANT TO:
          • {Primary action in plain English}
          • {Scope description}
          • {Expected outcome}
          
          IS THIS CORRECT? (Yes / No / Clarify)

  # ============================================================================
  # 2. MASTERORCHESTRATOR - CENTRAL CONTROL
  # ============================================================================
  master_orchestrator_central:
    category: CORE_ARCHITECTURE
    priority: CRITICAL
    description: "MasterOrchestrator is IN CHARGE of all orchestration - Single entry point"
    current_implementation:
      file: "src/orchestrators/core/master_orchestrator.py"
      main_entry: "src/main.py"
    requirements:
      - id: REQ-MASTER-001
        title: "Single Entry Point Enforcement"
        description: |
          ALL orchestration MUST go through MasterOrchestrator:
          - GitHub Copilot NEVER executes code directly
          - NEVER instantiate orchestrators directly (use MasterOrchestrator)
          - NEVER manipulate state outside MasterOrchestrator
        invocation: |
          python3 -m src.main "{user_intent}" --orchestrator master --format markdown
        
      - id: REQ-MASTER-002
        title: "MasterOrchestrator Responsibilities"
        description: |
          MasterOrchestrator owns ALL execution:
          - Load governance rules (tier0/tier1/tier2/tier3)
          - Validate against SKULL rules
          - Create TodoManager tasks
          - Execute tasks in dependency order
          - Update progress-tracker.json (atomic writes)
          - Enforce phase gates
          - Route to feature orchestrators
          - Return structured results
        
      - id: REQ-MASTER-003
        title: "Governance Integration"
        description: |
          Default workflow:
          Request → GovernanceMerger → MasterOrchestrator → TodoManager → Execute
                    (merge rules)     (evaluate)          (create tasks)
        
      - id: REQ-MASTER-004
        title: "Orchestrator Routing"
        description: |
          MasterOrchestrator routes to sub-orchestrators based on intent:
          - "plan" → PlanningOrchestratorV5
          - "implement" → TDD-Master
          - "health check" → HealthCheckOrchestratorV1
          - "validate" → ValidationOrchestrator
          - "ado" → ADOOrchestratorV2
          - "vacuum" → VacuumOrchestrator
          - Phase 4 adds LLM Intent Classifier for fuzzy routing

  # ============================================================================
  # 3. COMPREHENSIVE INTELLIGENCE LAYER (Phase 4)
  # ============================================================================
  intelligence_layer:
    category: INTELLIGENCE
    phase: 4
    priority: HIGH
    description: "LLM-based intent classification and intelligent routing"
    current_implementation:
      file: "src/orchestrators/middleware/intelligence_middleware.py"
      classifier: "src/orchestrators/master_orchestrator.py (llm_fallback)"
    requirements:
      - id: REQ-INTEL-001
        title: "LLM Intent Classifier"
        description: |
          Fallback classifier for ambiguous routing:
          - Pattern-based routing fails → LLM classifies intent
          - Returns confidence score + recommended orchestrator
          - Supports multi-intent detection
          - Learning from user feedback (tier3 persistence)
        
      - id: REQ-INTEL-002
        title: "Intelligence Middleware"
        description: |
          Mistake prevention layer:
          - Detects potentially harmful requests
          - Validates against governance rules
          - Provides suggestions for improvement
          - Blocks requests that violate SKULL rules
        
      - id: REQ-INTEL-003
        title: "Knowledge Graph Integration"
        description: |
          Query knowledge graph for context:
          - Find related code patterns
          - Identify similar implementations
          - Suggest reusable components
          - Track learned patterns in tier3
        
      - id: REQ-INTEL-004
        title: "Vision API Integration"
        description: |
          Optional image understanding:
          - Analyze architecture diagrams
          - Parse UI mockups
          - Extract requirements from screenshots
          - Support for multi-modal input

  # ============================================================================
  # 4. CORTEX TOOLKIT VIA MCP - MULTI-REPO SUPPORT
  # ============================================================================
  cortex_toolkit_mcp:
    category: MCP_INTEGRATION
    priority: HIGH
    description: "All CORTEX tools exposed via MCP for cross-repo usage"
    current_implementation:
      mcp_server: "src/mcp/mcp_server.py"
      multi_repo: "src/mcp/multi_repo_manager.py"
      tools_registry: "cortex-brain/tier0/governance/mcp-tools-registry.yaml"
    requirements:
      - id: REQ-MCP-001
        title: "MCP Server Implementation"
        description: |
          Model Context Protocol server exposing CORTEX capabilities:
          - tools/list: Returns all registered MCP tools
          - tools/call: Executes tool with arguments
          - JSON-RPC 2.0 compliant
          - Registry-driven tool discovery
        implementation: "src/mcp/mcp_server.py"
        
      - id: REQ-MCP-002
        title: "Multi-Repository Manager"
        description: |
          Single CORTEX installation works across multiple repositories:
          - Repository Discovery: Find all repos in workspace
          - CORTEX-Enabled Detection: Identify repos with cortex-brain/
          - Cross-Repo Operations: Search, analyze across repos
          - Per-Repo Database Isolation: Separate audit/state DBs
        implementation: "src/mcp/multi_repo_manager.py"
        
      - id: REQ-MCP-003
        title: "MCP Tool Categories"
        description: |
          5 MCP tool categories registered:
          1. governance_tools: Query/validate governance rules
          2. housekeeping_tools: System maintenance, health checks
          3. planning_tools: Create/execute YAML plans
          4. todo_tools: Task management
          5. tdd_tools: Test-driven development
        
      - id: REQ-MCP-004
        title: "@mcp_tool Decorator (CORE-024)"
        description: |
          All MCP tools MUST use @mcp_tool decorator:
          - Prevents registration drift
          - Automatic parameter extraction
          - Consistent tool schema
          - Audit trail integration
        example: |
          @mcp_tool(
              name="cortex_planning_create",
              description="Create a new YAML-based plan",
              category="planning"
          )
          def planning_create(name: str, description: str) -> Dict:
              pass
        
      - id: REQ-MCP-005
        title: "Cross-Repo Search & Analysis"
        description: |
          Search patterns across all repositories:
          - Pattern search with file filters
          - Aggregate statistics across repos
          - Find similar code across projects
          - Knowledge sharing between projects
        
      - id: REQ-MCP-006
        title: "MCP Server Unity (CORE-026)"
        description: |
          Single authoritative MCP tools registry:
          - One registry file: mcp-tools-registry.yaml
          - No duplicate tool registrations
          - ToolkitOrchestrator accessed via MasterOrchestrator only

  # ============================================================================
  # 5. ORCHESTRATOR SCAFFOLDING SYSTEM
  # ============================================================================
  orchestrator_scaffolding:
    category: DEVELOPMENT_INFRASTRUCTURE
    priority: HIGH
    description: "Custom orchestrator creation via scaffolder"
    current_implementation:
      scaffolder: "src/orchestrators/master/scaffolder.py"
      rule: "CORE-021"
      custom_loader: "src/mcp/loader.py (CustomOrchestratorLoader)"
    requirements:
      - id: REQ-SCAFFOLD-001
        title: "Orchestrator Scaffolder CLI"
        description: |
          Create complete orchestrators via CLI:
          - Generates implementation file
          - Creates test file with fixtures
          - Generates documentation
          - Updates __init__.py imports
          - Supports custom templates
          - Dry-run mode available
        invocation: |
          python -m src.tools.orchestrator_scaffolder --name "MyOrchestrator" --category feature
        
      - id: REQ-SCAFFOLD-002
        title: "Scaffolded Orchestrator Structure"
        description: |
          Each scaffolded orchestrator includes:
          - Implementation: src/orchestrators/{category}/{snake_name}.py
