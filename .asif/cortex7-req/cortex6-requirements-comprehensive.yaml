# ==============================================================================
# GOVERNANCE RULES (23 CORE RULES - SKULL)
# ==============================================================================
governance_rules:
  tier: 0
  category: CORTEX_CORE
  precedence: HIGHEST
  total_rules: 23
  
  rules:
    - rule_id: CORE-001
      name: "Small Incremental Autonomous Operations Required"
      category: orchestration_lifecycle
      severity: blocked
      description: "Operations split into <500 line increments per execution"

    - rule_id: CORE-002
      name: "Block Summary/Report/Explanation File Creation"
      category: response_formatting
      severity: blocked
      description: "No *-summary.md, *-report.md, *-explanation.md files"

    - rule_id: CORE-003
      name: "Executive Summary with Visual Progress Bars Required"
      category: response_formatting
      severity: blocked
      description: "Visual progress bars in responses, no code snippets"

    - rule_id: CORE-004
      name: "Minimal Continuation Prompt Token Budget"
      category: response_formatting
      severity: blocked
      description: "CONTINUATION-PROMPT.md under 12 lines, 500 tokens"

    - rule_id: CORE-005
      name: "Portable Path Resolution Required"
      category: portability
      severity: blocked
      description: "No hardcoded paths, use get_project_root()"

    - rule_id: CORE-006
      name: "Phase -2: Setup Verification Mandatory"
      category: orchestration_lifecycle
      severity: blocked
      description: "Verify dependencies before execution"

    - rule_id: CORE-007
      name: "Phase N+1: Teardown + REFACTOR + Commit Mandatory"
      category: orchestration_lifecycle
      severity: blocked
      description: "Cleanup and refactor after execution"

    - rule_id: CORE-008
      name: "Test-Driven Development Mandatory"
      category: development_workflow
      severity: blocked
      description: "RED → GREEN → REFACTOR workflow"

    - rule_id: CORE-009
      name: "Plan Files Must Live Within Plan Folder Structure"
      category: architecture_integrity
      severity: blocked
      description: "No plan files in workspace root"

    - rule_id: CORE-010
      name: "Script Consolidation & Cataloging Required"
      category: architecture_integrity
      severity: blocked
      description: "Scripts managed via Cortex Toolkit Orchestrator"

    - rule_id: CORE-011
      name: "Type Hints Required for All Functions/Methods"
      category: quality_gates
      severity: blocked
      description: "Complete type hints for all Python code"

    - rule_id: CORE-012
      name: "Docstrings Required for All Public APIs"
      category: quality_gates
      severity: blocked
      description: "Google-style docstrings for public APIs"

    - rule_id: CORE-013
      name: "Explicit Error Handling with Custom Exceptions"
      category: quality_gates
      severity: blocked
      description: "No bare except, custom exceptions required"

    - rule_id: CORE-014
      name: "SOLID Principles Enforcement"
      category: architecture_integrity
      severity: blocked
      description: "Single Responsibility, Open/Closed, LSP, ISP, DIP"

    - rule_id: CORE-015
      name: "Import Organization (PEP 8)"
      category: quality_gates
      severity: warning
      description: "3 groups: stdlib, third-party, local"

    - rule_id: CORE-016
      name: "Black Code Formatting"
      category: quality_gates
      severity: warning
      description: "Black with line-length=100"

    - rule_id: CORE-017
      name: "Strict Governance Enforcement"
      category: security_privacy
      severity: blocked
      description: "No overrides, all violations logged"

    - rule_id: CORE-018
      name: "YAML-First Design Mandatory"
      category: architecture_integrity
      severity: blocked
      description: "No *-PLAN.md files, use YAML"

    - rule_id: CORE-019
      name: "All Development Must Go Through TDD-Master Orchestrator"
      category: development_workflow
      severity: blocked
      description: "GitHub Copilot cannot write implementation code directly"

    - rule_id: CORE-020
      name: "Orchestrators Must Not Create Markdown Work Products"
      category: response_formatting
      severity: blocked
      description: "Use YAML/JSON/Python, no markdown in cortex-brain/"

    - rule_id: CORE-021
      name: "New Orchestrators MUST Use Scaffolder"
      category: architecture_integrity
      severity: blocked
      description: "All new orchestrators via orchestrator_scaffolder.py"

    - rule_id: CORE-022
      name: "Kebab-Case File Naming with 20-Character Limit"
      category: architecture_integrity
      severity: blocked
      description: "lowercase, hyphen-separated, max 20 chars"

    - rule_id: CORE-023
      name: "File Type-Specific Validation Before Commit"
      category: quality_gates
      severity: blocked
      description: "HTML5, WCAG AA, YAML schema validation pre-commit"

    - rule_id: CORE-024
      name: "All MCP Tools MUST Use @mcp_tool Decorator"
      category: architecture_integrity
      severity: blocked
      description: "Prevents registration drift"

    - rule_id: CORE-026
      name: "MCP Server Unity - Single Registry Authority"
      category: architecture_integrity
      severity: blocked
      description: "One authoritative MCP tools registry"

