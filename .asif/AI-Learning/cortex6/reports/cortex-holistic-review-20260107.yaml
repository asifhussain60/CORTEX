  # CRITICAL-001: TODO Orchestrator Design Conflict
  # ---------------------------------------------------------------------------
  
  - id: CRITICAL-001
    severity: CRITICAL
    priority: P0
    category: architecture_conflict
    title: "TODO Orchestrator vs. Existing TodoManager Conflict"
    
    description: |
      CR-001 specifies new "TODO Orchestrator (DAG-based work tracker)" at
      src/orchestrators/core/todo_orchestrator.py. However, existing codebase
      has TodoManager at src/orchestrators/master/todo_manager.py with different
      design (simple task list, no DAG, stub implementation).
      
      **Conflict:**
      - New design: Graph-based (DAG), node/edge schema, dependency tracking
      - Existing: Linear task list, no dependencies, basic status enum
      - Location overlap: Both in orchestrators/ namespace
      - Integration unclear: How does MasterOrchestrator choose which to use?
    
    impact:
      user_facing: "Work tracking may fail if both implementations conflict"
      technical: "Namespace collision, ambiguous imports, unclear migration path"
      timeline: "Phase 1 blocked if not resolved"
    
    evidence:
      existing_code:
        - "src/orchestrators/master/todo_manager.py (lines 37-67)"
        - "Simple Task dataclass with status enum"
        - "No DAG structure, no dependencies"
      
      plan_specification:
        - "CR-001 in 01-holistic-requirements-analysis.yaml (lines 91-173)"
        - "Graph-based DAG with dependency edges"
        - "Complex operations: get_ready_tasks(), detect_circular_dependencies()"
    
    root_cause: "Plan did not audit existing codebase before designing new components"
    
    remediation:
      strategy: "Deprecate existing TodoManager, create migration path"
      steps:
        - step: 1
          action: "Rename existing TodoManager → LegacyTodoManager"
          rationale: "Preserve existing functionality during migration"
          
        - step: 2
          action: "Implement new TODO Orchestrator per CR-001 spec"
          location: "src/orchestrators/core/todo_orchestrator.py"
          
        - step: 3
          action: "Create adapter: LegacyTodoManager → TODO Orchestrator"
          purpose: "Migrate existing tasks to DAG format"
          
        - step: 4
          action: "Update MasterOrchestrator to use TODO Orchestrator only"
          validation: "All existing tests pass with new implementation"
          
        - step: 5
          action: "Deprecation notice: LegacyTodoManager removed in v6.1"
          
      effort: "2 days (includes testing)"
      blocking: true
      phase_impact: "Blocks Phase 1 Task 5"
  
  # ---------------------------------------------------------------------------
  # CRITICAL-002: StateManager Race Condition NOT ADDRESSED
  # ---------------------------------------------------------------------------
  
  - id: CRITICAL-002
    severity: CRITICAL
    priority: P0
    category: concurrency_safety
    title: "Existing StateManager Still Uses JSON Files (Race Condition)"
    
    description: |
      CR-004 specifies SQLite with optimistic locking to prevent race conditions.
      However, current StateManager (src/orchestrators/state_manager.py) uses
      in-memory dict with optional JSON file persistence - NO database, NO locking.
      
      **Vulnerability:**
      - Lines 100+: self.states: Dict[str, Dict[str, Any]] = {}
      - JSON file persistence (if state_file provided)
      - No SQLite, no version column, no optimistic locking
      - Concurrent writes → last write wins (data loss)
    
    impact:
      user_facing: "Lost work, corrupted state in concurrent orchestrator execution"
      technical: "EDGE-RACE-002 not mitigated, data corruption risk"
      timeline: "Phase 2 blocked, cannot test concurrency safely"
    
    evidence:
      existing_code:
        - "src/orchestrators/state_manager.py (lines 1-384)"
        - "No database imports (sqlite3, sqlalchemy)"
        - "self.states in-memory dict"
        - "No locking mechanism"
      
      plan_specification:
        - "CR-004 in 01-holistic-requirements-analysis.yaml (lines 330-397)"
        - "SQLite database with WAL mode"
        - "Optimistic locking via version column"
        - "Explicit retry logic on version conflict"
    
    root_cause: "StateManager not yet upgraded to CR-004 spec"
    
    remediation:
      strategy: "Rewrite StateManager with SQLite backend (Phase 2 Task 8)"
      steps:
        - step: 1
          action: "Create new StateManagerV2 with SQLite backend"
          includes: "WAL mode, version column, optimistic locking"
          
        - step: 2
          action: "Migration script: JSON state files → SQLite database"
          path: "cortex-brain/migrations/state_to_db.py"
          
        - step: 3
          action: "Update all orchestrators to use StateManagerV2"
          scope: "MasterOrchestrator, TODO Orchestrator, all child orchestrators"
          
        - step: 4
          action: "Integration tests: 10 concurrent orchestrators"
          validation: "No data loss, version conflicts detected and retried"
          
        - step: 5
          action: "Deprecate old StateManager"
          
      effort: "3 days (as planned in Phase 2 Task 8)"
      blocking: true
      phase_impact: "Must complete before Phase 2 exit"
  
  # ---------------------------------------------------------------------------
  # CRITICAL-003: MCP Integration Conflicts with Existing Registry
  # ---------------------------------------------------------------------------
  
  - id: CRITICAL-003
    severity: CRITICAL
    priority: P0
    category: architecture_conflict
    title: "New MCP Server vs. Existing OrchestratorRegistry Conflict"
    
    description: |
      CR-011 introduces MCP Server (JSON-RPC 2.0 over stdio) for orchestrator
      standardization. However, MasterOrchestrator already uses OrchestratorRegistry
      (src/mcp/registry.py) with different interface.
      
      **Conflict:**
      - New: MCP Server with tools/list, tools/call (JSON-RPC 2.0)
      - Existing: OrchestratorRegistry with Python API (get_orchestrator, list_all)
      - Integration: MasterOrchestrator.__init__ requires 'registry: OrchestratorRegistry'
      - Unclear: Does MCP Server replace or wrap OrchestratorRegistry?
    
    impact:
      user_facing: "GitHub Copilot may fail to discover orchestrators"
      technical: "Dual registration systems, potential desync, unclear handoff"
      timeline: "Phase 0 Task 1 (MCP Server) design incomplete"
    
    evidence:
      existing_code:
        - "src/orchestrators/master_orchestrator.py (line 55): registry: OrchestratorRegistry"
        - "src/mcp/registry.py: OrchestratorRegistry class"
        - "Python-based API, no JSON-RPC"
      
      plan_specification:
        - "CR-011 in 03-enhancement-evaluation-report.yaml (lines 225-289)"
        - "MCP Server with JSON-RPC 2.0"
        - "New registration file: cortex-brain/registry/mcp-orchestrators.json"
        - "Different interface: tools/list, tools/call"
    
    root_cause: "MCP layer added without considering existing registry architecture"
    
    remediation:
      strategy: "MCP Server wraps OrchestratorRegistry (adapter pattern)"
      architecture_decision:
        layer_1: "OrchestratorRegistry (storage, Python API)"
        layer_2: "MCP Server (JSON-RPC adapter over OrchestratorRegistry)"
        layer_3: "GitHub Copilot (MCP client)"
        
      steps:
        - step: 1
          action: "Keep OrchestratorRegistry as-is (internal Python API)"
          rationale: "Existing MasterOrchestrator depends on it"
          
        - step: 2
          action: "Implement MCP Server as adapter"
          pattern: "tools/list → registry.list_all()"
          pattern: "tools/call → registry.get_orchestrator(name).execute()"
          
        - step: 3
          action: "Single source of truth: cortex-brain/registry/orchestrators.json"
          note: "MCP Server reads same file as OrchestratorRegistry"
          
        - step: 4
          action: "Update Phase 0 Task 1 deliverables"
          add: "src/mcp/mcp_adapter.py (wraps OrchestratorRegistry)"
          
        - step: 5
          action: "Integration test: GitHub Copilot → MCP Server → OrchestratorRegistry"
          
      effort: "1 day (design clarification + adapter implementation)"
      blocking: true
      phase_impact: "Blocks Phase 0 Task 1 Day 2"
  
  # ---------------------------------------------------------------------------
  # CRITICAL-004: Audit Logging Bypass Still Possible
  # ---------------------------------------------------------------------------
  
  - id: CRITICAL-004
    severity: CRITICAL
    priority: P0
    category: governance_enforcement
    title: "Audit Logging Enforcement Incomplete (Pre-Commit Bypass)"
    
    description: |
      CR-002 requires mandatory audit logging with NO BYPASS. Plan specifies
      pre-commit hooks to enforce logging. However:
      
      1. Pre-commit hooks can be bypassed: `git commit --no-verify`
      2. No server-side enforcement (pre-receive hook on git server)
      3. brain-protection-rules.yaml shows audit logging rules exist BUT
         enforcement middleware may not block commits without logs
      
      **Gap:**
      - User commits code without audit log → Pre-commit runs → Can skip with --no-verify
      - No verification that audit logs were generated BEFORE allowing commit
    
    impact:
      user_facing: "Governance violations slip through, no audit trail"
      technical: "CR-002 requirement violated, SKULL rules ineffective"
      timeline: "Governance foundation compromised from Phase 0"
    
    evidence:
      plan_specification:
        - "CR-002 in 01-holistic-requirements-analysis.yaml (lines 175-253)"
        - "Enforcement: Pre-commit hooks"
        - "NO mention of --no-verify prevention"
      
      existing_code:
        - "cortex-brain/brain-protection-rules.yaml has audit rules"
        - "No evidence of --no-verify prevention"
        - "No server-side enforcement"
    
    root_cause: "Audit enforcement design assumes developers won't bypass pre-commit"
    
    remediation:
      strategy: "Multi-layer enforcement (cannot bypass all layers)"
      layers:
        - layer: 1
          name: "Pre-commit hooks (client-side)"
          enforcement: "Block commit if no audit log generated"
          bypass: "Can skip with --no-verify"
          
        - layer: 2
          name: "Git pre-push hook (client-side)"
          enforcement: "Scan commits for audit logs before push"
          bypass: "Can skip with --no-verify"
          
        - layer: 3
          name: "Runtime middleware (execution-time)"
          enforcement: "AuditLogger.start() MUST be called, exception if not"
          bypass: "CANNOT BYPASS (code fails without audit context)"
          
        - layer: 4
          name: "Phase completion gate (review-time)"
          enforcement: "Phase N+1 blocked if Phase N audit logs missing"
          bypass: "CANNOT BYPASS (manual review required)"
          
      steps:
        - step: 1
          action: "Implement Layer 3 (Runtime middleware) FIRST"
          priority: "Highest (cannot be bypassed)"
          code: |
            class AuditContextManager:
                def __enter__(self):
                    if not audit_logger.is_active():
                        raise AuditRequiredError("Audit logging must be enabled")
                    return audit_logger
          
        - step: 2
          action: "Update all orchestrators to use AuditContextManager"
          pattern: "with AuditContextManager(): orchestrator.execute()"
          
        - step: 3
          action: "Implement Layer 4 (Phase gate)"
          check: "Phase completion review validates audit logs exist"
          
        - step: 4
          action: "Document bypass limitations in governance docs"
          message: "Pre-commit can be bypassed, but runtime enforcement cannot"
          
      effort: "1 day (runtime enforcement + orchestrator updates)"
      blocking: true
      phase_impact: "Must complete before Phase 1 begins"
  
  # ---------------------------------------------------------------------------
  # CRITICAL-005: Knowledge Merge Conflict Resolution Underspecified
  # ---------------------------------------------------------------------------
  
  - id: CRITICAL-005
    severity: CRITICAL
    priority: P0
    category: implementation_detail
    title: "Knowledge Merge Conflict Resolution Algorithm Incomplete"
    
    description: |
      CR-008 specifies knowledge merge conflict resolution with 4 strategies:
      COMPANY_WINS, CORTEX_WINS, MERGE_COMBINE, USER_PROMPT. However:
      
      1. Algorithm for detecting conflicts underspecified
      2. "MERGE_COMBINE" strategy vague (how to merge lists, dicts?)
      3. USER_PROMPT triggers unclear (when to ask user vs. auto-resolve?)
      4. Conflict log schema missing implementation details
      5. Test scenarios incomplete (only 2 basic tests specified)
    
    impact:
      user_facing: "Unpredictable behavior when company knowledge conflicts with CORTEX"
      technical: "Phase 0 Task 3 (Team Knowledge) may fail due to merge bugs"
      timeline: "Phase 0 completion at risk"
    
    evidence:
      plan_specification:
        - "CR-008 in 01-holistic-requirements-analysis.yaml (lines 555-613)"
        - "4 strategies listed but algorithms not detailed"
        - "Only 2 test cases: 'Conflicting values → Correct strategy' (vague)"
      
      architecture_specification:
        - "02-holistic-master-plan.yaml (lines 537-630)"
        - "Merge strategies listed but implementation pseudocode missing"
    
    root_cause: "Conflict resolution design stopped at high-level strategies"
    
    remediation:
      strategy: "Define precise conflict detection and resolution algorithms"
      
      conflict_detection_algorithm: |
        1. Load CORTEX knowledge (tier 0)
        2. Load Company knowledge (tier 2)
        3. For each key in CORTEX:
           a. If key not in Company → No conflict (use CORTEX)
           b. If key in Company:
              i.   If values equal → No conflict
              ii.  If value types differ (str vs list) → Type conflict
              iii. If both scalars, values differ → Scalar conflict
              iv.  If both lists → List conflict (check MERGE_COMBINE)
              v.   If both dicts → Dict conflict (recurse)
        4. For each key in Company not in CORTEX → No conflict (add to merged)
      
      resolution_algorithms:
        COMPANY_WINS:
          when: "Project-specific preferences (line length, branch naming)"
          algorithm: "merged[key] = company_knowledge[key]"
          
        CORTEX_WINS:
          when: "Universal best practices (type hints, SOLID, security)"
          algorithm: "merged[key] = cortex_knowledge[key]"
          
        MERGE_COMBINE:
          when: "Non-conflicting list additions"
          algorithm: |
            if isinstance(cortex_value, list) and isinstance(company_value, list):
                merged[key] = list(set(cortex_value + company_value))  # Union, deduplicate
            elif isinstance(cortex_value, dict) and isinstance(company_value, dict):
                merged[key] = {**cortex_value, **company_value}  # Company overrides
            else:
                raise ConflictError("Cannot merge incompatible types")
                
        USER_PROMPT:
          when: "Critical architectural conflicts (microservices vs monolith)"
          algorithm: |
            print(f"Conflict detected: {key}")
            print(f"  CORTEX: {cortex_value}")
            print(f"  Company: {company_value}")
            choice = input("Choose: 1) CORTEX, 2) Company, 3) Manual entry: ")
            merged[key] = resolve_user_choice(choice, cortex_value, company_value)
      
      test_scenarios:
        - scenario: "Scalar conflict (line_length: 100 vs 120)"
          expected_strategy: "COMPANY_WINS"
          expected_result: "120"
          
        - scenario: "List conflict (linters: [pylint] vs [pylint, mypy])"
          expected_strategy: "MERGE_COMBINE"
          expected_result: "[pylint, mypy]"
          
        - scenario: "Architectural conflict (pattern: microservices vs monolith)"
          expected_strategy: "USER_PROMPT"
          expected_result: "User chooses microservices"
          
        - scenario: "Type conflict (timeout: 30 vs '30 seconds')"
          expected_strategy: "Raise ConflictError (cannot auto-resolve)"
          expected_result: "Error logged, manual intervention required"
      
      steps:
        - step: 1
          action: "Implement conflict detection algorithm"
          file: "src/knowledge/conflict_detector.py"
          
        - step: 2
          action: "Implement resolution strategies (4 classes)"
          files:
            - "src/knowledge/strategies/company_wins.py"
            - "src/knowledge/strategies/cortex_wins.py"
            - "src/knowledge/strategies/merge_combine.py"
            - "src/knowledge/strategies/user_prompt.py"
          
        - step: 3
          action: "Create comprehensive test suite (12 scenarios)"
          file: "tests/integration/test_knowledge_merge_conflicts.py"
          
        - step: 4
          action: "Update Phase 0 Task 2 deliverables"
          add: "Knowledge conflict resolver implementation"
          
      effort: "2 days (algorithm implementation + testing)"
      blocking: true
      phase_impact: "Blocks Phase 0 Task 2 completion"

