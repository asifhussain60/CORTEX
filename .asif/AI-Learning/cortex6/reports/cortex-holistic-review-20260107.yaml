high_priority_issues:
  
  # ---------------------------------------------------------------------------
  # HIGH-001: Snowball Strategy Timeline Rigidity
  # ---------------------------------------------------------------------------
  
  - id: HIGH-001
    severity: HIGH
    priority: P1
    category: risk_management
    title: "65-Day Sequential Timeline Brittle to Delays (No Buffer)"
    
    description: |
      Epic 1 specifies 8-week (40 work day) timeline with snowball strategy
      (sequential phases, no skipping). However:
      
      1. No buffer for unexpected delays (sick days, blockers, debugging)
      2. Phase 0 (17 days) is 42.5% of timeline - single point of failure
      3. Dependencies: Phase 1 → Phase 2 → Phase 3 (cascading delays)
      4. No contingency plan if critical path slips
      5. Optimistic estimates (e.g., "MCP Server in 5 days" assumes no issues)
    
    impact:
      timeline: "Single 3-day delay in Phase 0 pushes entire epic by 3 days"
      morale: "Team pressure if deadlines unrealistic"
      quality: "Rushed implementation to meet deadlines"
    
    remediation:
      strategy: "Add contingency buffer + parallel work opportunities"
      
      revised_timeline:
        phase_0: "17 days → 20 days (3-day buffer)"
        phase_1: "14 days → 16 days (2-day buffer)"
        phase_2: "9 days → 10 days (1-day buffer)"
        phase_3: "25 days → 28 days (3-day buffer)"
        total: "65 days → 74 days (9-day buffer = 14%)"
        
      parallel_opportunities:
        - "Phase 0 Task 3 (Team Knowledge) + Task 4 (Config Discovery) can overlap"
        - "Phase 2 Task 10 (Trie Router) independent of Task 8/9 (State/Rollback)"
        - "Phase 3 edge case tasks can run in parallel (12-17)"
        
      contingency_plans:
        - "If Phase 0 delayed >5 days: Defer Task 3 (Team Knowledge) to Phase 3"
        - "If Phase 1 TODO Orchestrator complex: Simplify to linear task list v1.0"
        - "If Phase 2 performance issues: Defer optimization to Phase 3"
        
    effort: "1 day (timeline revision + risk planning)"
    blocking: false
    phase_impact: "Update project plan before Phase 0 begins"
  
  # ---------------------------------------------------------------------------
  # HIGH-002: Windows-First Strategy Platform Brittleness
  # ---------------------------------------------------------------------------
  
  - id: HIGH-002
    severity: HIGH
    priority: P1
    category: portability
    title: "Windows-First Implementation May Introduce Platform-Specific Brittleness"
    
    description: |
      Epic 1 targets Windows 11 (slower machine) first, Epic 2 targets Mac later.
      Risk: Windows-specific patterns (file paths, line endings, async behavior)
      may not be caught until Mac implementation.
      
      **Platform Differences:**
      - File paths: Windows `\` vs Unix `/` (pathlib helps but not foolproof)
      - Line endings: CRLF vs LF (git config helps but can break)
      - SQLite WAL: Windows file locking behavior different from Unix
      - Async: Windows ProactorEventLoop vs Unix SelectorEventLoop
      - Case sensitivity: Windows case-insensitive, Mac/Linux case-sensitive
    
    impact:
      portability: "Mac implementation may require major refactoring"
      timeline: "Epic 2 delayed by platform fixes discovered late"
      testing: "Cross-platform bugs only found in integration"
    
    remediation:
      strategy: "Platform-agnostic design patterns + early cross-platform testing"
      
      design_patterns:
        - pattern: "Use pathlib.Path() for ALL file operations"
          rationale: "Handles Windows/Unix path separators automatically"
          
        - pattern: "Explicitly specify newline='\\n' in file opens"
          code: "with open(file, 'w', newline='\\n') as f:"
          
        - pattern: "Use SQLite WAL with timeout parameter"
          code: "conn.execute('PRAGMA busy_timeout = 5000')"
          
        - pattern: "Test asyncio code on both event loops"
          windows: "asyncio.set_event_loop_policy(asyncio.WindowsProactorEventLoopPolicy())"
          unix: "asyncio.set_event_loop_policy(asyncio.DefaultEventLoopPolicy())"
          
      cross_platform_testing:
        - "CI/CD: Run tests on Windows AND Mac/Linux from Phase 0"
        - "Use GitHub Actions matrix: [windows-latest, macos-latest, ubuntu-latest]"
        - "Maintain Mac dev environment for spot-checking"
        
      phase_0_validation:
        - "End of Phase 0: Run full test suite on Mac (smoke test)"
        - "If failures >5: Pause, fix platform issues before Phase 1"
        
    effort: "2 days (CI/CD setup + pathlib refactoring)"
    blocking: false
    phase_impact: "Implement before Phase 0 Task 1 begins"
  
