                metadata: Optional[Dict[str, Any]] = None
            ) -> str:  # Returns task_id
                """Add task to DAG."""
                pass
            
            def get_ready_tasks(self) -> List[TaskNode]:
                """Return tasks ready to execute (dependencies met)."""
                pass
            
            def mark_complete(self, task_id: str, actual_effort_hours: int):
                """Mark task complete, update dependent tasks."""
                pass
            
            def mark_failed(self, task_id: str, error: str, retry: bool = True):
                """Mark task failed, optionally retry or block dependents."""
                pass
            
            def detect_circular_dependencies(self) -> List[List[str]]:
                """Detect cycles in DAG (DFS algorithm). Returns list of cycles."""
                pass
            
            def get_progress(self) -> ProgressReport:
                """Calculate completion percentage, critical path remaining."""
                pass
            
            def checkpoint(self):
                """Persist current graph state to database."""
                pass
            
            def resume() -> List[TaskNode]:
                """Load graph from checkpoint, return ready + in-progress tasks."""
                pass
    
    data_model:
      task_node_schema:
        task_id: "UUID (unique identifier)"
        workflow_id: "UUID (parent workflow)"
        orchestrator_id: "String (which orchestrator executes)"
        status: "Enum: PENDING, READY, IN_PROGRESS, COMPLETED, FAILED, BLOCKED"
        dependencies: "List[task_id] (tasks that must complete first)"
        dependents: "List[task_id] (tasks blocked by this task)"
        estimated_effort_hours: "Integer"
        actual_effort_hours: "Integer (nullable)"
        start_time: "Timestamp (nullable)"
        end_time: "Timestamp (nullable)"
        error_message: "String (nullable)"
        retry_count: "Integer (default 0)"
        max_retries: "Integer (default 3)"
        metadata: "JSON (custom orchestrator data)"
        created_at: "Timestamp"
        updated_at: "Timestamp"
      
      edge_schema:
        from_task: "UUID"
        to_task: "UUID"
        dependency_type: "Enum: HARD (blocking), SOFT (preferred order)"
    
    algorithms:
      detect_circular_dependencies:
        algorithm: "Depth-First Search (DFS) with visited set"
        complexity: "O(V + E) where V=tasks, E=dependencies"
        pseudocode: |
          def detect_cycles(graph):
              visited = set()
              rec_stack = set()
              cycles = []
              
              for node in graph.nodes:
                  if node not in visited:
                      if dfs(node, visited, rec_stack, [], cycles):
                          pass  # Cycle found, added to cycles list
              
              return cycles
          
          def dfs(node, visited, rec_stack, path, cycles):
              visited.add(node)
              rec_stack.add(node)
              path.append(node)
              
              for neighbor in node.dependencies:
                  if neighbor not in visited:
                      if dfs(neighbor, visited, rec_stack, path, cycles):
                          return True
                  elif neighbor in rec_stack:
                      # Cycle detected
                      cycle_start = path.index(neighbor)
                      cycles.append(path[cycle_start:])
                      return True
              
              rec_stack.remove(node)
              path.pop()
              return False
      
      get_ready_tasks:
        algorithm: "Filter tasks where all dependencies COMPLETED"
        complexity: "O(V) where V=tasks"
        pseudocode: |
          def get_ready_tasks(tasks):
              ready = []
              for task in tasks:
                  if task.status == PENDING:
                      dependencies_met = all(
                          dep.status == COMPLETED
                          for dep in task.dependencies
                      )
                      if dependencies_met:
                          task.status = READY
                          ready.append(task)
              return ready
      
      get_progress:
        algorithm: "Count completed vs total, compute critical path"
        complexity: "O(V + E) for critical path"
        pseudocode: |
          def get_progress(tasks):
              completed = sum(1 for t in tasks if t.status == COMPLETED)
              total = len(tasks)
              percentage = (completed / total) * 100
              
              critical_path = compute_longest_path(tasks)
              remaining_hours = sum(
                  t.estimated_effort_hours
                  for t in critical_path
                  if t.status != COMPLETED
              )
              
              return ProgressReport(
                  completed_tasks=completed,
                  total_tasks=total,
                  percentage=percentage,
                  critical_path_remaining_hours=remaining_hours
              )
    
    testing:
      unit_tests:
        - "test_add_task"
        - "test_get_ready_tasks"
        - "test_mark_complete_updates_dependents"
        - "test_detect_circular_dependencies_simple"
        - "test_detect_circular_dependencies_complex"
