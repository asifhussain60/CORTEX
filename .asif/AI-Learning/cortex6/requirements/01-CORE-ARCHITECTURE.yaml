  state_manager:
    name: "StateManager"
    version: "2.0.0"
    location: "src/orchestrators/state_manager.py"
    category: "Concurrency-Safe State Persistence"
    
    purpose: |
      Persist orchestrator state, TODO graphs, workflow metadata to SQLite database
      with WAL mode for concurrent reads/writes and optimistic locking for conflict
      detection.
    
    responsibilities:
      - "Connect to SQLite database with WAL mode"
      - "Create/read/update/delete state records"
      - "Optimistic locking via version column"
      - "Retry logic on version conflicts"
      - "Transaction management"
      - "Database backups (daily)"
      - "Migration execution"
    
    interface:
      class_signature: |
        class StateManager:
            def __init__(self, db_path: str, backup_dir: Optional[str] = None)
            
            def create_state(self, state_id: str, state_type: StateType, data: dict) -> bool:
                """Create new state record (version=1)."""
                pass
            
            def get_state(self, state_id: str) -> Optional[StateRecord]:
