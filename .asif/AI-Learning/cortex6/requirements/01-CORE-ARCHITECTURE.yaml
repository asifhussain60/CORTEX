# =============================================================================
# SYSTEM ARCHITECTURE OVERVIEW
# =============================================================================

system_overview:
  architecture_style: "Layered event-driven microkernel"
  core_principles:
    - "Single entry point (MasterOrchestrator)"
    - "Plugin architecture (orchestrators dynamically loaded)"
    - "State machine-based lifecycle"
    - "Database-backed coordination (SQLite WAL)"
    - "Asynchronous event propagation"
    - "Mandatory audit trail"
    - "Knowledge-driven decisions"
  
  layer_architecture:
    layer_1_interface:
      name: "User Interface Layer"
      components: ["GitHub Copilot Chat", "Terminal CLI", "Vision API"]
      responsibility: "Accept natural language requests + attachments"
      
    layer_2_routing:
      name: "Intent Classification & Routing"
      components: ["CORTEX.prompt.md", "PatternRouter (Trie)", "LLM Intent Classifier"]
      responsibility: "Match request to orchestrator (O(1) performance)"
      
    layer_3_master:
      name: "Master Orchestration Layer"
      components: ["MasterOrchestrator", "TodoOrchestrator", "StateManager", "ExecutionEngine"]
      responsibility: "Coordinate orchestrator execution, manage DAG work tracking"
      
    layer_4_governance:
      name: "Governance & Intelligence Layer"
      components: ["AuditLogger", "KnowledgeMerger", "GovernanceValidator", "MCPServer"]
      responsibility: "Enforce SKULL rules, merge knowledge, standardize interfaces"
      
    layer_5_orchestrators:
      name: "Specialized Orchestrators Layer"
      components: ["PlanningOrchestrator", "TDDOrchestrator", "ReviewOrchestrator", "Custom"]
      responsibility: "Execute domain-specific workflows"
      
    layer_6_data:
      name: "Data Persistence Layer"
      components: ["SQLite Database (WAL)", "OrchestratorRegistry (JSON)", "Knowledge Library (YAML)"]
      responsibility: "Store state, audit logs, knowledge, configuration"

# =============================================================================
# CORE COMPONENT SPECIFICATIONS
# =============================================================================

core_components:
  
  # ---------------------------------------------------------------------------
  # Component 1: MasterOrchestrator
  # ---------------------------------------------------------------------------
  
  master_orchestrator:
    name: "MasterOrchestrator"
    version: "2.0.0"
    location: "src/orchestrators/core/master_orchestrator.py"
    category: "Routing & Lifecycle Management"
    
    purpose: |
      Single entry point for all CORTEX requests. Routes to appropriate orchestrator,
      manages execution lifecycle, coordinates multi-orchestrator workflows.
    
    responsibilities:
      - "Accept requests from CLI (src/main.py)"
      - "Route to orchestrator via PatternRouter"
      - "Initialize TodoOrchestrator for new workflows"
      - "Manage orchestrator lifecycle (load, execute, checkpoint, cleanup)"
      - "Enforce governance rules pre/post execution"
      - "Aggregate results from multi-orchestrator workflows"
    
    interface:
      class_signature: |
        class MasterOrchestrator:
            def __init__(
                self,
                config_path: str,
                registry: OrchestratorRegistry,
                state_manager: StateManager,
                pattern_router: PatternRouter,
                audit_logger: AuditLogger
            )
            
            def handle_request(self, request: str) -> ExecutionResult:
                """Main entry point - route and execute."""
                pass
            
            def continue_workflow(self, workflow_id: str) -> ExecutionResult:
                """Resume from checkpoint."""
                pass
            
            def get_status(self, workflow_id: str) -> WorkflowStatus:
                """Query workflow state."""
                pass
    
    state_machine:
      states:
        - IDLE: "Awaiting request"
        - ROUTING: "Pattern matching in progress"
        - ORCHESTRATOR_FOUND: "Orchestrator identified"
        - LOADING: "Loading orchestrator module"
        - VALIDATING: "Governance pre-checks"
        - EXECUTING: "Orchestrator running"
        - CHECKPOINTING: "Saving state"
        - COMPLETED: "Workflow finished successfully"
        - FAILED: "Workflow failed"
        - RETRYING: "Retrying after transient failure"
        - ROLLBACK: "Rolling back failed changes"
      
      transitions:
        - "IDLE → ROUTING (user request received)"
        - "ROUTING → ORCHESTRATOR_FOUND (pattern match success)"
        - "ROUTING → FAILED (no match, confidence <0.7)"
        - "ORCHESTRATOR_FOUND → LOADING"
        - "LOADING → VALIDATING (orchestrator loaded)"
        - "LOADING → FAILED (import error)"
        - "VALIDATING → EXECUTING (governance checks passed)"
        - "VALIDATING → FAILED (blocked rule violated)"
        - "EXECUTING → CHECKPOINTING (phase complete)"
        - "EXECUTING → FAILED (orchestrator exception)"
        - "CHECKPOINTING → EXECUTING (more work)"
        - "CHECKPOINTING → COMPLETED (no more work)"
        - "FAILED → RETRYING (retry_count < max_retries)"
        - "FAILED → ROLLBACK (retry exhausted)"
        - "RETRYING → EXECUTING"
        - "ROLLBACK → IDLE"
        - "COMPLETED → IDLE"
    
    dependencies:
      required:
        - PatternRouter (for routing)
        - OrchestratorRegistry (for orchestrator discovery)
        - StateManager (for state persistence)
        - AuditLogger (for audit trail)
        - ExecutionEngine (for lifecycle management)
      optional:
        - LLMIntentClassifier (fallback routing)
        - CrossSessionContextMiddleware (continuation detection)
    
    configuration:
      config_file: "cortex-brain/config/master-orchestrator.yaml"
      required_settings:
        - max_retries: "Integer (default 3)"
        - retry_backoff_seconds: "Float (default 1.0)"
        - execution_timeout_seconds: "Integer (default 3600)"
        - audit_enforcement: "Boolean (default true)"
        - llm_fallback_enabled: "Boolean (default true)"
        - llm_confidence_threshold: "Float (default 0.7)"
    
    error_handling:
      exceptions:
        - OrchestratorNotFoundException: "Pattern matched but orchestrator not registered"
        - GovernanceViolationError: "Blocked SKULL rule violated"
        - ExecutionTimeoutError: "Orchestrator exceeded timeout"
        - AuditRequiredError: "Audit context not active"
      
      recovery_strategies:
        - "OrchestratorNotFoundException → Return user-friendly error + suggest alternatives"
        - "GovernanceViolationError → Block execution, log violation, return remediation guidance"
        - "ExecutionTimeoutError → Kill orchestrator process, rollback state"
        - "AuditRequiredError → Block execution (cannot bypass)"
    
    testing:
      unit_tests:
        - "test_handle_request_routing"
        - "test_handle_request_execution"
        - "test_state_machine_transitions"
        - "test_error_handling"
        - "test_governance_enforcement"
      
      integration_tests:
        - "test_end_to_end_planning_workflow"
        - "test_multi_orchestrator_coordination"
        - "test_resume_from_checkpoint"
        - "test_concurrent_workflows"
  
