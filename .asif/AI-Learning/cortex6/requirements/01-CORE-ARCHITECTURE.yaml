                pass
            
            def update_state(self, state_id: str, data: dict) -> bool:
                """Update with optimistic locking. Raises VersionConflictError."""
                pass
            
            def delete_state(self, state_id: str) -> bool:
                """Soft delete (mark as deleted)."""
                pass
            
            def get_states_by_type(self, state_type: StateType) -> List[StateRecord]:
                """Query all states of given type."""
                pass
            
            def backup_database(self) -> str:
                """Create backup, return backup file path."""
                pass
            
            def restore_from_backup(self, backup_path: str):
                """Restore database from backup."""
                pass
    
    database_configuration:
      connection_settings:
        - "PRAGMA journal_mode=WAL"
        - "PRAGMA synchronous=NORMAL"
        - "PRAGMA busy_timeout=5000"
        - "PRAGMA foreign_keys=ON"
        - "PRAGMA cache_size=-64000"  # 64MB cache
      
      wal_benefits:
        - "Concurrent reads during writes"
        - "Better performance for write-heavy workloads"
        - "Atomic commits"
        - "Crash recovery"
      
      backup_strategy:
        frequency: "Daily at 2 AM local time"
        retention: "Keep last 7 backups"
        location: "cortex-brain/database/backups/"
        format: "cortex-state-YYYYMMDD-HHMMSS.db"
    
    optimistic_locking:
      mechanism: "Version column (integer, auto-incremented on update)"
      conflict_detection: |
        UPDATE states
        SET data = ?, version = version + 1, updated_at = ?
        WHERE state_id = ? AND version = ?
        
        -- If rowcount == 0, version conflict detected
      
      retry_logic: |
        for attempt in range(max_retries):
            try:
                current_version = get_version(state_id)
                update_with_version(state_id, data, current_version)
                return True
            except VersionConflictError:
                if attempt == max_retries - 1:
                    raise
                time.sleep(backoff_seconds * (2 ** attempt))
        
        raise VersionConflictError(f"Failed after {max_retries} retries")
    
    error_handling:
      exceptions:
        - VersionConflictError: "State modified concurrently"
        - DatabaseLockedError: "Database busy (timeout exceeded)"
        - DatabaseCorruptionError: "Database file corrupted"
        - MigrationError: "Schema migration failed"
      
      recovery:
        - "VersionConflictError → Retry with exponential backoff"
        - "DatabaseLockedError → Retry with longer timeout"
        - "DatabaseCorruptionError → Restore from latest backup"
        - "MigrationError → Rollback migration, restore backup"
    
    testing:
      unit_tests:
        - "test_create_state"
        - "test_get_state"
        - "test_update_state_success"
        - "test_update_state_version_conflict"
        - "test_delete_state"
        - "test_backup_and_restore"
      
      integration_tests:
