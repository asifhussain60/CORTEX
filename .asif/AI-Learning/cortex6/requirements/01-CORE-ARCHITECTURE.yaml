  todo_orchestrator:
    name: "TodoOrchestrator"
    version: "1.0.0"
    location: "src/orchestrators/core/todo_orchestrator.py"
    category: "Work Tracking & Dependency Management"
    
    purpose: |
      Track all work as directed acyclic graph (DAG). Enable resumable execution,
