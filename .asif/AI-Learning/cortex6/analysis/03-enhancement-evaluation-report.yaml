# =============================================================================
# CORTEX-6 ADVANTAGES OVER MICROSOFT AMPLIFIER
# =============================================================================

cortex6_advantages:
  
  advantage_1_local_first:
    name: "Local-First Execution (No Cloud Dependency)"
    description: |
      CORTEX-6 runs entirely on local machine without cloud services. No network
      latency, no API rate limits, no cloud costs, no data leaving local environment.
    amplifier_limitation: "Azure Amplifier requires Azure subscription, cloud connectivity"
    cortex6_benefit:
      - "Zero cloud costs (no Azure subscription required)"
      - "Offline capability (work without internet)"
      - "Data privacy (code never leaves local machine)"
      - "Instant feedback (<100ms orchestrator routing)"
      - "No rate limits (unlimited local execution)"
    use_cases:
      - "Sensitive codebases (healthcare, finance, government)"
      - "Air-gapped environments (no cloud access)"
      - "Cost-conscious teams (no cloud budget)"
      - "Low-latency requirements (sub-second responses)"
      
  advantage_2_github_copilot_integration:
    name: "Native GitHub Copilot Integration"
    description: |
      CORTEX-6 invoked via natural language in GitHub Copilot Chat. No need to
      write pipeline YAML or learn orchestration DSL. Just ask "plan user auth"
      and CORTEX orchestrates.
    amplifier_limitation: "Azure ML Pipelines require Python DSL, YAML config, portal UI"
    cortex6_benefit:
      - "Natural language interface (no DSL to learn)"
      - "Context-aware (understands current codebase)"
      - "Inline in IDE (no context switching)"
      - "LLM-assisted request transformation (adds context)"
    use_cases:
      - "Rapid prototyping (idea → plan in seconds)"
      - "Developer-friendly (no pipeline expertise needed)"
      - "Ad-hoc orchestration (one-off tasks)"
      
  advantage_3_graph_based_work_tracking:
    name: "DAG-Based Work Tracking with Resume"
    description: |
      TODO Orchestrator maintains dependency graph. On failure, resume from
      checkpoint without re-running completed tasks. No chatty progress updates.
    amplifier_limitation: "Durable Functions replay entire history (slower)"
    cortex6_benefit:
      - "Instant resume (load checkpoint, execute next ready task)"
      - "Silent execution (no narration, just progress bar)"
      - "Parallel execution (independent tasks run concurrently)"
      - "Visual progress (Mermaid DAG diagrams)"
    use_cases:
      - "Long-running plans (hours/days)"
      - "Complex dependencies (50+ tasks)"
      - "Iterative development (frequent interruptions)"
      
  advantage_4_embedded_governance:
    name: "Built-In Governance (SKULL Rules)"
    description: |
      61 brain protection rules enforced automatically. Prevents brittleness
      patterns, enforces TDD, blocks technical debt. Pre-commit hooks block
      violations.
    amplifier_limitation: "Azure Pipelines governance requires manual policy configuration"
    cortex6_benefit:
      - "Automatic enforcement (no config required)"
      - "61 pre-defined rules (TDD, SOLID, security, etc.)"
      - "Pre-commit hooks (block bad code)"
      - "Audit logging (track all violations)"
    use_cases:
      - "Quality-focused teams (zero technical debt)"
      - "Security-sensitive projects (enforce best practices)"
      - "Learning environments (teach good habits)"
      
  advantage_5_knowledge_integration:
    name: "3-Tier Knowledge System (CORTEX + Library + Company)"
    description: |
      Company knowledge overrides CORTEX defaults intelligently. Orchestrators
      query knowledge for best practices. Knowledge evolves with team learning.
    amplifier_limitation: "Azure ML no built-in knowledge management"
    cortex6_benefit:
      - "Company-specific best practices (override defaults)"
      - "Contextual guidance (query knowledge on-demand)"
      - "Learning over time (knowledge library grows)"
      - "Conflict resolution (explicit merge strategies)"
    use_cases:
      - "Enterprise teams (company standards)"
      - "Domain-specific patterns (healthcare, finance)"
      - "Continuous improvement (capture learnings)"
      
  advantage_6_no_vendor_lock_in:
    name: "Open Source, No Vendor Lock-In"
    description: |
      CORTEX-6 is open source, runs anywhere Python runs. No Azure dependency,
      no proprietary APIs, no cloud migration costs.
    amplifier_limitation: "Azure Amplifier locked to Azure ecosystem"
    cortex6_benefit:
      - "Run anywhere (macOS, Windows, Linux)"
      - "No cloud migration (data stays local)"
      - "Full control (modify source code)"
      - "No licensing fees (100% free)"
    use_cases:
      - "Multi-cloud teams (AWS, GCP, Azure)"
      - "Cost-sensitive projects (no Azure budget)"
      - "Open-source projects (community-driven)"

# =============================================================================
# NEW REQUIREMENTS (From chat01.md Enhancements)
# =============================================================================

new_requirements:
  
  # ---------------------------------------------------------------------------
  # CR-011: MCP (Model Context Protocol) Standardization Layer
  # ---------------------------------------------------------------------------
  
  - id: CR-011
    category: tooling_standardization
    priority: P0_CRITICAL
    confidence: 1.0
    name: "Local MCP Standardization for Tools & Orchestrators"
    description: |
      Create local MCP server that standardizes interface for all tools and
      orchestrators. Orchestrators register via MCP, expose capabilities,
      and communicate via standard protocol.
    
    user_requirement: |
      "I want local MCP created to standardize tooling and orchestrators."
    
    technical_specification:
      component: "MCP Server (Model Context Protocol)"
      location: "src/mcp/mcp_server.py"
      
      mcp_architecture:
        purpose: "Standardize orchestrator/tool interfaces for composability"
        protocol: "JSON-RPC 2.0 over stdio (local process communication)"
        
        capabilities:
          - capability: "tools/list"
            description: "List all available tools/orchestrators"
            returns: "List[{name, description, parameters, examples}]"
            
          - capability: "tools/call"
            description: "Invoke tool/orchestrator with parameters"
            parameters: "{tool_name, arguments}"
            returns: "{status, result, error}"
            
          - capability: "prompts/list"
            description: "List available prompt templates"
            returns: "List[{name, description, arguments}]"
            
          - capability: "prompts/get"
            description: "Get prompt template with arguments"
            returns: "{prompt_text, arguments}"
            
          - capability: "resources/list"
            description: "List available resources (knowledge, state)"
            returns: "List[{uri, name, description, mime_type}]"
            
          - capability: "resources/read"
            description: "Read resource content"
            returns: "{contents, mime_type}"
            
        orchestrator_registration:
          registration_file: "cortex-brain/registry/mcp-orchestrators.json"
          schema:
            orchestrator_id: "String (unique ID)"
            mcp_tool_name: "String (MCP tool name)"
            capabilities: "List[tool_name]"
            parameters_schema: "JSON Schema for tool parameters"
            examples: "List[{request, response}]"
            
        benefits_over_azure:
          - "Local execution (no network calls)"
          - "Composable orchestrators (chain via MCP)"
          - "Standard interface (any MCP client can invoke)"
          - "Introspectable (list all capabilities)"
          - "Type-safe (JSON Schema validation)"
          
      implementation_phases:
        phase_1: "MCP server skeleton (stdio communication)"
        phase_2: "Orchestrator registration (manifest → MCP tool)"
        phase_3: "Capability exposure (tools/list, tools/call)"
        phase_4: "GitHub Copilot integration (MCP client)"
        
    validation:
      - "MCP server starts on CORTEX initialization"
      - "All orchestrators registered as MCP tools"
      - "GitHub Copilot can list CORTEX capabilities via MCP"
      - "tools/call invokes orchestrators successfully"
      
    effort_estimate: "5 days (design + implement + test + integrate)"
    warrantability: MANDATORY
    blocking: true
    
  # ---------------------------------------------------------------------------
  # CR-012: Multi-Repo Team Collaboration
  # ---------------------------------------------------------------------------
  
  - id: CR-012
    category: team_collaboration
    priority: P0_CRITICAL
    confidence: 1.0
    name: "Multi-Repo Support with Centralized CORTEX"
    description: |
      CORTEX-6 MUST support orchestration across multiple repositories with
      a single centralized CORTEX installation. Simple config file links
      repos to CORTEX. Plans, reports, knowledge remain repo-specific while
      core orchestration is shared.
    
    user_requirement: |
      "Cortex should work across multiple repos using a simple strategy like a
      config file to that centralizes the cortex repo to work seamlessly with
      all repos while maintaining distinction in terms of plans and reportings,
      knowledge libraries etc."
    
    technical_specification:
      component: "Multi-Repo Manager"
      location: "src/multi_repo/repo_manager.py"
      
      configuration:
        central_config: "~/.cortex/repos.yaml"
        schema:
          repos:
            - repo_id: "String (unique ID, e.g., 'frontend-app')"
              path: "String (absolute path to repo)"
              name: "String (human-readable name)"
              type: "Enum: primary, secondary"
              cortex_enabled: "Boolean (default true)"
              knowledge_library: "String (path to repo-specific knowledge)"
              plan_storage: "String (path to store plans, default '{repo}/.cortex/plans')"
              
        example_config: |
          cortex_installation: "/Users/asif/CORTEX"
          
          repos:
            - repo_id: "frontend-app"
              path: "/Users/asif/projects/frontend-app"
              name: "Frontend Application"
              type: primary
              cortex_enabled: true
              knowledge_library: ".cortex/knowledge"
              plan_storage: ".cortex/plans"
              
            - repo_id: "backend-api"
              path: "/Users/asif/projects/backend-api"
              name: "Backend API"
              type: secondary
              cortex_enabled: true
              knowledge_library: ".cortex/knowledge"
              plan_storage: ".cortex/plans"
              
            - repo_id: "shared-lib"
              path: "/Users/asif/projects/shared-lib"
              name: "Shared Library"
              type: secondary
              cortex_enabled: true
              
      architecture:
        repo_context_detection:
          method: "Detect current working directory, match against repos.yaml"
          fallback: "Prompt user: 'Which repo? (frontend-app, backend-api)'"
          
        plan_isolation:
          storage: "Repo-specific .cortex/plans/{epic-name}/"
          tracking: "Repo-specific .cortex/tracking/progress.db"
          separation: "Each repo has independent plans, no cross-contamination"
          
        knowledge_merging:
          hierarchy:
            tier_1: "CORTEX core knowledge (universal best practices)"
            tier_2: "CORTEX knowledge library (cross-repo patterns)"
            tier_3: "Repo-specific knowledge (.cortex/knowledge/)"
          merge_strategy: "Tier 3 overrides Tier 2 overrides Tier 1"
          
        orchestrator_invocation:
          workflow: |
            1. Detect current repo via cwd
            2. Load repo config from repos.yaml
            3. Set context: {repo_id, repo_path, knowledge_path, plan_path}
            4. Invoke orchestrator with repo context
            5. Orchestrator operates in repo-specific namespace
            6. Store outputs in repo-specific paths
            
      benefits_over_azure:
        - "Single CORTEX installation (no per-repo duplication)"
        - "Repo-specific context (plans isolated)"
        - "Shared orchestration logic (DRY principle)"
        - "Cross-repo patterns (knowledge library)"
        - "Simple config (no complex Azure DevOps pipelines)"
        
    validation:
      - "CORTEX detects repo context automatically"
      - "Plans stored in repo-specific paths"
      - "Knowledge hierarchy respected"
      - "Multiple repos can invoke CORTEX simultaneously"
      
    effort_estimate: "4 days (config parsing + context detection + testing)"
    warrantability: MANDATORY
    blocking: true
    
  # ---------------------------------------------------------------------------
  # CR-013: Team-Wide Knowledge Learning
  # ---------------------------------------------------------------------------
  
  - id: CR-013
    category: knowledge_management
    priority: P0_CRITICAL
    confidence: 1.0
    name: "Team Collaboration & Shared Knowledge Learning"
    description: |
      CORTEX-6 MUST support team collaboration where knowledge tier evolves
      based on ENTIRE TEAM's work, not just single user. Team members contribute
      learnings, patterns, and best practices to shared knowledge base.
    
    user_requirement: |
      "CORTEX should be designed for team work where the tiers keep learning
      and getting intelligent over time learning from team knowledge, not just
      the user working on repo."
    
    technical_specification:
      component: "Team Knowledge Aggregator"
      location: "src/knowledge/team_knowledge_aggregator.py"
      
      architecture:
        team_knowledge_storage:
          location: "cortex-brain/tier2/team-knowledge/{team-id}/"
          structure:
            patterns: "Discovered patterns from all team members"
            learnings: "Lessons learned aggregated"
            best_practices: "Team-validated best practices"
            anti_patterns: "Common mistakes to avoid"
            
        contribution_workflow:
          step_1: "User completes work (plan, review, refactor)"
          step_2: "Orchestrator extracts learnings (patterns, successes, failures)"
          step_3: "Learning proposed to team knowledge base"
          step_4: "Team review + validation (optional manual review)"
          step_5: "Learning promoted to team knowledge if validated"
          step_6: "All team members benefit from learning"
          
        learning_extraction:
          triggers:
            - "Plan completion (extract architectural patterns)"
            - "Review findings (extract anti-patterns)"
            - "TDD cycles (extract testing patterns)"
            - "Refactoring (extract code smells)"
            
          extraction_logic:
            method: "LLM-assisted pattern recognition"
            prompt: "Extract reusable patterns from this work"
            validation: "Compare against existing team knowledge"
            deduplication: "Merge similar patterns"
            
        knowledge_evolution:
          versioning: "Team knowledge versioned (v1.0, v1.1, ...)"
          changelog: "Track what was learned and when"
          contributors: "Track who contributed each learning"
          usage_metrics: "Track which patterns used most"
          
        team_sync:
          mechanism: "Shared Git repository OR shared network drive"
          conflict_resolution: "Latest team knowledge wins (with merge conflicts)"
          notification: "Team notified when new learning added"
          
      benefits_over_azure:
        - "Organic knowledge growth (learn from real work)"
        - "Team-wide sharing (not siloed per user)"
        - "Automatic extraction (no manual documentation)"
        - "Context-aware (patterns tied to real code)"
        - "Free (no Azure ML workspace costs)"
        
    validation:
      - "Learnings extracted after plan completion"
      - "Team knowledge file updated with new patterns"
      - "All team members see new learnings"
      - "Knowledge versioning tracks evolution"
      
    effort_estimate: "6 days (extraction logic + sync + versioning)"
    warrantability: MANDATORY
    blocking: true
    
  # ---------------------------------------------------------------------------
  # CR-014: Config-Based Repo Discovery
  # ---------------------------------------------------------------------------
  
  - id: CR-014
    category: developer_experience
    priority: P1_HIGH
    confidence: 1.0
    name: "Simple Config-Based Repo Discovery"
    description: |
      Developers MUST be able to link repos to CORTEX via simple YAML config.
      No complex setup, no CLI commands, just edit ~/.cortex/repos.yaml and
      CORTEX automatically discovers repos.
    
    user_requirement: |
      "Simple strategy like a config file to that centralizes the cortex repo
      to work seamlessly with all repos."
    
    technical_specification:
      component: "Repo Discovery Service"
      location: "src/multi_repo/discovery_service.py"
      
      config_format:
        file: "~/.cortex/repos.yaml"
        minimal_example: |
          repos:
            - path: "/Users/asif/projects/frontend"
            - path: "/Users/asif/projects/backend"
            
        full_example: |
          cortex_installation: "/Users/asif/CORTEX"
          default_plan_storage: ".cortex/plans"
          
          repos:
            - repo_id: "frontend"
              path: "/Users/asif/projects/frontend"
              name: "Frontend App"
              
            - repo_id: "backend"
              path: "/Users/asif/projects/backend"
              name: "Backend API"
              aliases: ["api", "server"]
              
      discovery_logic:
        auto_detect:
          method: "On CORTEX startup, scan repos.yaml, validate paths exist"
          caching: "Cache discovered repos in memory (reload on config change)"
          
        context_inference:
          cwd_matching: "If cwd in repo path, auto-select that repo"
          prompt_user: "If ambiguous, prompt: 'Which repo? (frontend, backend)'"
          
      setup_flow:
        step_1: "User creates ~/.cortex/repos.yaml"
        step_2: "Add repo entries with paths"
        step_3: "CORTEX auto-discovers on next invocation"
        step_4: "No restart required (hot reload)"
        
    validation:
      - "Config file parsed successfully"
      - "Repos auto-discovered on startup"
      - "Context inference works (cwd → repo)"
      - "Hot reload on config change"
      
    effort_estimate: "2 days (config parsing + validation + hot reload)"
    warrantability: HIGH
    blocking: false

