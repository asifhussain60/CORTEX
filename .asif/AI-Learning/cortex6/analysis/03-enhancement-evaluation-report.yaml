      impact: "Knowledge isolated to single user"
      priority: P0_CRITICAL
      
    - gap: "Distributed Tracing"
      amplifier_approach: "Application Insights distributed tracing"
      cortex6_status: ❌ MISSING
      impact: "Hard to debug cross-orchestrator workflows"
      priority: P1_HIGH
      
    - gap: "MCP Tool Standardization"
      amplifier_approach: "Azure Functions as standardized workers"
      cortex6_status: ❌ MISSING
      impact: "No standard interface for tools/orchestrators"
      priority: P0_CRITICAL
      
    - gap: "Cloud-Native Scaling"
