microsoft_amplifier_patterns:
  what_amplifier_provides:
    - pattern: "Task Scheduling & Fan-Out"
      description: "Orchestrator fans out work to multiple workers"
      azure_implementation: "Azure ML Pipelines, Durable Functions"
      cortex6_equivalent: "TODO Orchestrator with DAG + parallel execution"
      status: ✅ ADDRESSED
      
    - pattern: "State Management"
      description: "Orchestrator tracks workflow state, checkpoints"
      azure_implementation: "Durable Functions (automatic checkpointing)"
      cortex6_equivalent: "SQLite with WAL mode + checkpoint table"
      status: ✅ ADDRESSED
      
    - pattern: "Retry Logic & Error Handling"
      description: "Auto-retry transient failures, exponential backoff"
      azure_implementation: "Durable Functions retry policies"
      cortex6_equivalent: "CR-005 Rollback/Recovery + retry_count"
      status: ✅ ADDRESSED
      
    - pattern: "Result Aggregation"
      description: "Collect results from parallel workers"
      azure_implementation: "Fan-in pattern in orchestration"
      cortex6_equivalent: "TODO Orchestrator aggregates task outputs"
      status: ✅ ADDRESSED
      
    - pattern: "Observability"
      description: "Logging, metrics, tracing"
      azure_implementation: "Azure Monitor, Application Insights"
      cortex6_equivalent: "CR-002 Audit logging + metrics collection"
      status: ⚠️ PARTIAL (no distributed tracing)
      
    - pattern: "Idempotency"
      description: "Re-running same operation produces same result"
      azure_implementation: "Durable Functions replay semantics"
      cortex6_equivalent: "Task status tracking prevents double-execution"
      status: ✅ ADDRESSED
      
    - pattern: "Concurrency Limits"
      description: "Throttle parallel execution"
      azure_implementation: "Azure ML compute quotas"
      cortex6_equivalent: "CR-009 Resource limits (max_concurrent_orchestrators)"
      status: ✅ ADDRESSED
      
    - pattern: "Versioning & Schema Evolution"
      description: "Handle workflow version changes"
      azure_implementation: "Orchestration versioning"
      cortex6_equivalent: "EDGE-DEP-002 Schema versioning"
      status: ✅ ADDRESSED
  
  amplifier_gaps_in_cortex6:
    - gap: "Multi-Repo Orchestration"
      amplifier_approach: "Azure DevOps Pipelines across repos"
      cortex6_status: ❌ MISSING
      impact: "Cannot orchestrate work across multiple codebases"
