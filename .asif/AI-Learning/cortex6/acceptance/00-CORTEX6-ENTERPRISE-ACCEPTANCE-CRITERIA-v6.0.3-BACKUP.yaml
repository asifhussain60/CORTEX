  author: Asif Hussain
  epic_id: CORTEX6-BUILD
  changelog:
    v6.0.3:
      date: '2026-01-09'
      changes:
        - "Enhanced AC-ARCH-005: Added acceptance directory cleanup validation (3-file structure maintained)"
        - "Enhanced AC-F01-006: Added anti-bloat validation (no verbose markdown summaries post-execution)"
        - "Added AC-INT-006: Audit-first validation - all criteria evidenced by audit logs, failures improve logging"
