# ==============================================================================
# SECTION 4: SKULL RULES MIGRATION
# ==============================================================================
# 
# SKULL rules (61) merged into 4-Category Governance
# Legacy brain-protection-rules.yaml becomes read-only reference
# ==============================================================================

skull_migration:
  
  status: "MIGRATED"
  
  migration_strategy: |
    All 61 SKULL rules from brain-protection-rules.yaml are absorbed into
    Category 1 (CORTEX Tier 0) of the 4-Category Governance system.
    
    The legacy file brain-protection-rules.yaml becomes a READ-ONLY reference
    that points to the new governance location.
    
  rule_mapping:
    legacy_location: "cortex-brain/brain-protection-rules.yaml"
    new_location: "cortex-brain/tier0/governance/core-rules.yaml"
    
  renumbering_scheme:
    old_format: "RULE_NAME (e.g., TDD_ENFORCEMENT)"
    new_format: "CORE-NNN (e.g., CORE-001)"
    
  example_mappings:
    - old: "TDD_ENFORCEMENT"
      new: "CORE-001"
      category: "CORTEX Tier 0"
      
    - old: "HOLISTIC_DISCOVERY"
      new: "CORE-002"
      category: "CORTEX Tier 0"
      
    - old: "GIT_ISOLATION"
      new: "CORE-003"
      category: "CORTEX Tier 0"
      
    - old: "PLANNING_ISOLATION"
      new: "CORE-004"
      category: "CORTEX Tier 0"
      
    - old: "INCREMENTAL_AUTONOMOUS_EXECUTION"
      new: "CORE-005"
      category: "CORTEX Tier 0"
      
    - old: "NO_SUMMARY_FILE_GENERATION"
      new: "CORE-006"
      category: "CORTEX Tier 0"
      
    - old: "VISUAL_PROGRESS_RESPONSE_FORMAT"
      new: "CORE-007"
      category: "CORTEX Tier 0"
      
  legacy_file_update:
    action: "Add deprecation header"
    header: |
      # ==============================================================================
      # DEPRECATED: This file is READ-ONLY reference only
      # ==============================================================================
      # 
      # All SKULL rules have been migrated to 4-Category Governance:
      # New location: cortex-brain/tier0/governance/core-rules.yaml
      # 
      # This file preserved for backward compatibility reference only.
      # DO NOT EDIT - changes will not be enforced.
      # ==============================================================================

# ==============================================================================
# SECTION 5: ARCHITECTURAL CONFLICT RESOLUTIONS
# ==============================================================================
# 
# Resolutions for conflicts identified in holistic review
# ==============================================================================

conflict_resolutions:
  
  - conflict_id: "CONFLICT-001"
    description: "TODO Orchestrator Design Conflict (existing TodoManager stub)"
    resolution: |
      Deprecate existing TodoManager in src/orchestrators/master/todo_manager.py
      Rename to LegacyTodoManager with deprecation warning
      Implement new TodoOrchestrator per CR-001 specification
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-002"
    description: "StateManager Race Condition (no database, no locking)"
    resolution: |
      Rewrite StateManager with:
      - SQLite WAL mode for concurrent reads
      - Optimistic locking with version columns
      - Automatic conflict detection and retry
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-003"
    description: "MCP Integration vs Existing Registry"
    resolution: |
      MCP Server wraps OrchestratorRegistry (adapter pattern)
      No dual registration systems
      Single source of truth for orchestrator capabilities
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-004"
    description: "Audit Logging Bypass via --no-verify"
    resolution: |
      Runtime AuditContextManager (cannot bypass)
      Phase gates require audit validation
      Pre-commit hooks are ADDITIONAL enforcement, not sole enforcement
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-005"
    description: "Knowledge Merge Conflict Resolution Underspecified"
    resolution: |
      Fully specified in Section 1: four_category_governance.merge_algorithm
      6-step algorithm with conflict detection and resolution
      Validation step ensures no contradictions
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-006"
    description: "SKULL rules not integrated with 4-Category Governance"
    resolution: |
      All 61 SKULL rules migrated to Category 1 (CORTEX Tier 0)
      New numbering scheme: CORE-001 through CORE-061
      Legacy file becomes read-only reference
    status: "RESOLVED in design"
    
  - conflict_id: "CONFLICT-007"
    description: "Tests spread across folders"
    resolution: |
      Single tests/ folder at repository root
      All existing tests consolidated
      Clear folder structure: unit/, integration/, performance/, governance/
    status: "RESOLVED in design"

