# ==============================================================================
# 
# CRITICAL: Single folder test harness covering ALL of CORTEX design
# Tests are NOT spread across folders
# ==============================================================================

test_harness:
  
  principle: |
    ALL tests live in a SINGLE `tests/` folder at repository root.
    No test files scattered across src/, cortex-brain/, or anywhere else.
    This enables:
    - Single test runner configuration
    - Clear coverage visibility
    - Easy test discovery
    - Consistent test organization
    
  folder_structure:
    root: "tests/"
    layout:
      tests/:
        __init__.py: "Test package marker"
        conftest.py: "Shared fixtures for all tests"
        pytest.ini: "Pytest configuration (moved from repo root)"
        
        unit/:
          __init__.py: ""
          test_master_orchestrator.py: "Master orchestrator unit tests"
          test_todo_orchestrator.py: "TODO orchestrator unit tests"
          test_state_manager.py: "State manager unit tests"
          test_governance_merger.py: "4-category governance merge tests"
          test_pattern_router.py: "Trie pattern router tests"
          test_audit_logger.py: "Audit logging tests"
          test_mcp_server.py: "MCP server tests"
          orchestrators/:
            __init__.py: ""
            test_planning_orchestrator.py: "Planning v5 tests"
            test_tdd_orchestrator.py: "TDD v2 tests"
            test_ado_orchestrator.py: "ADO v2 tests"
            test_vacuum_orchestrator.py: "Vacuum v2 tests"
            test_cleanup_orchestrator.py: "Cleanup v2 tests"
            test_investigation_orchestrator.py: "Investigation tests"
            test_sanitization_orchestrator.py: "Sanitization tests"
            test_debug_orchestrator.py: "Debug v2 tests"
            test_refinement_orchestrator.py: "Refinement v2 tests"
            test_maintenance_orchestrator.py: "Maintenance v2 tests"
            
        integration/:
          __init__.py: ""
          test_end_to_end.py: "Full workflow integration tests"
          test_multi_repo.py: "Multi-repo MCP integration tests"
          test_governance_integration.py: "4-category governance integration"
          test_brain_persistence.py: "Brain tier persistence tests"
          test_checkpoint_recovery.py: "Resume from breakage tests"
          
        performance/:
          __init__.py: ""
          test_routing_performance.py: "O(1) routing benchmarks"
          test_dag_performance.py: "DAG operations benchmarks"
          test_governance_merge_performance.py: "Merge algorithm benchmarks"
          test_mcp_throughput.py: "MCP server throughput tests"
          
        governance/:
          __init__.py: ""
          test_cortex_tier0.py: "CORTEX Tier 0 rule validation"
          test_business_tier0.py: "Business Tier 0 rule validation"
          test_company_best_practices.py: "Company best practices validation"
          test_knowledge_best_practices.py: "Knowledge rules validation"
          test_merge_algorithm.py: "Merge algorithm correctness"
          test_conflict_resolution.py: "Conflict resolution strategies"
          
        fixtures/:
          sample_governance_rules.yaml: "Test fixture: governance rules"
          sample_business_tier0.yaml: "Test fixture: business rules"
          sample_knowledge_patterns.yaml: "Test fixture: learned patterns"
          sample_dag.json: "Test fixture: TODO DAG"
          
  coverage_targets:
    overall: "80% minimum"
    core_components: "90% minimum"
    governance_merger: "95% minimum"
    orchestrators: "80% minimum"
    
  test_commands:
    all_tests: "pytest tests/ -v"
    unit_only: "pytest tests/unit/ -v"
    integration_only: "pytest tests/integration/ -v"
    performance_only: "pytest tests/performance/ -v"
    governance_only: "pytest tests/governance/ -v"
    coverage_report: "pytest tests/ --cov=src --cov-report=html"

