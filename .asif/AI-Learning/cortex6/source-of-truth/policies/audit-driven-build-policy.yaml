# ==============================================================================
# CORTEX 6.0 AUDIT-DRIVEN BUILD POLICY
# ==============================================================================
# Purpose: Define how audit logging drives incremental improvement
# Enforcement: Pre-commit hook rejects commits without audit evidence
# 
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-07
# ==============================================================================

policy:
  name: "Audit-Driven Incremental Build"
  version: "1.0.0"
  enforcement: "STRICT"
  
  # ============================================================================
  # CORE PRINCIPLE
  # ============================================================================
  # Every change to CORTEX must have audit evidence BEFORE commit.
  # The audit trail becomes the source of truth for:
  # - What work was attempted
  # - What succeeded/failed
  # - How to improve next iteration
  # ============================================================================

  principles:
    - id: "ADP-001"
      name: "No Commit Without Trail"
      description: |
        Every git commit MUST have corresponding audit log entries.
        The pre-commit hook validates this and rejects commits without evidence.
      enforcement: "pre-commit hook"
      
    - id: "ADP-002"
      name: "Success Evidence Required"
      description: |
        Audit entries must show evidence of SUCCESS for work categories.
        Middleware-only entries trigger warnings but don't block.
      categories_required:
        - BUILD_EXECUTION
        - VALIDATION
        - TEST_EXECUTION
        - STATE_MANAGEMENT
        
    - id: "ADP-003"
      name: "Correlation Tracking"
      description: |
        All operations within a feature/phase must share a correlation ID.
        Format: {FEATURE_ID}-{PHASE}-{SESSION}
        Example: FEAT01-P2-001
      format: "{feature_id}-P{phase}-{session_number:03d}"
      
    - id: "ADP-004"
      name: "Error-to-Improvement Loop"
      description: |
        Audit errors are opportunities for improvement:
        1. Error logged → Analyze root cause
        2. Root cause → Create fix task
        3. Fix task → Test with TDD
        4. Success logged → Commit allowed
      workflow:
        - step: "Error occurs during execution"
          action: "Log with ERROR level and full context"
        - step: "Analyze audit log"
          action: "Use audit_log_manager.py query --level ERROR"
        - step: "Create improvement task"
          action: "Add to TODO tracker with audit reference"
        - step: "Implement fix with TDD"
          action: "Write failing test, implement, verify"
        - step: "Log success"
          action: "update_session.py --log 'Fixed: {description}'"
        - step: "Commit"
          action: "Pre-commit hook validates audit trail"

  # ============================================================================
  # AUDIT CATEGORIES
  # ============================================================================
  categories:
    # Work categories (must have SUCCESS evidence)
    work:
      - name: "BUILD_EXECUTION"
        description: "Feature/phase/task execution during build"
        required_for_commit: true
        
      - name: "VALIDATION"
        description: "Test execution, schema validation, compliance checks"
        required_for_commit: true
        
      - name: "STATE_MANAGEMENT"
        description: "StateManager operations, checkpoints, migrations"
        required_for_commit: true
        
      - name: "TEST_EXECUTION"
        description: "TDD cycles, test runs, coverage reports"
        required_for_commit: true
        
      - name: "TDD"
        description: "RED/GREEN/REFACTOR phase tracking"
        required_for_commit: true
        
      - name: "DEBUG"
        description: "Debugging sessions, root cause analysis"
        required_for_commit: false
        
      - name: "REFACTOR"
        description: "Code improvement without behavior change"
        required_for_commit: true

    # System categories (informational)
    system:
      - name: "MIDDLEWARE"
        description: "Middleware initialization, routing"
        required_for_commit: false
        
      - name: "CONFIG"
        description: "Configuration changes"
        required_for_commit: false
        
      - name: "PLANNING"
        description: "Plan creation, modification"
        required_for_commit: false

  # ============================================================================
  # FEATURE AUDIT REQUIREMENTS
  # ============================================================================
  feature_requirements:
    # Every feature must define these audit properties
    required_properties:
      - name: "correlation_prefix"
        description: "Prefix for all audit entries in this feature"
        example: "FEAT01"
        
      - name: "categories"
        description: "Categories this feature will log to"
        min_count: 2
        
      - name: "checkpoints"
        description: "Define checkpoint events for each phase"
        per_phase: true
        
    # Phase audit requirements
    phase_requirements:
      entry_log:
        required: true
        format: "{correlation_prefix}-P{phase}-START"
        category: "BUILD_EXECUTION"
        
      exit_log:
        required: true
        format: "{correlation_prefix}-P{phase}-COMPLETE"
        category: "VALIDATION"
        must_include:
          - tests_passed
          - duration
          - tasks_completed
          
      error_handling:
        on_error: "LOG_AND_CHECKPOINT"
        format: "{correlation_prefix}-P{phase}-ERROR-{error_type}"
        must_include:
          - error_message
          - stack_trace
          - recovery_action

  # ============================================================================
  # AUDIT-DRIVEN IMPROVEMENT WORKFLOW
  # ============================================================================
  improvement_workflow:
    name: "Continuous Improvement via Audit Analysis"
    
    daily_analysis:
      trigger: "End of work session"
      actions:
        - name: "Review errors"
          command: "python3 scripts/audit_log_manager.py query --level ERROR --limit 20"
          
        - name: "Check patterns"
          command: "python3 scripts/audit_log_manager.py report"
          
        - name: "Identify improvements"
          action: "Create tasks in TODO tracker for recurring issues"
          
    weekly_analysis:
      trigger: "End of week"
      actions:
        - name: "Performance analysis"
          command: "python3 scripts/audit_log_manager.py query --category STATE_MANAGEMENT | grep duration"
          
        - name: "Success rate"
          action: "Calculate SUCCESS/ERROR ratio by category"
          
        - name: "Trend identification"
          action: "Compare with previous week's metrics"
          
    improvement_targets:
      - metric: "Error rate"
        target: "<5% of total entries"
        action_if_exceeded: "Create debug task"
        
      - metric: "Test execution time"
        target: "<30 seconds for unit tests"
        action_if_exceeded: "Create performance optimization task"
        
      - metric: "Checkpoint frequency"
        target: "Every 5 tasks or 30 minutes"
        action_if_exceeded: "Adjust checkpoint triggers"

  # ============================================================================
  # PRE-COMMIT HOOK REQUIREMENTS
  # ============================================================================
  pre_commit_validation:
    steps:
      - order: 1
        name: "Audit Trail Verification"
        script: "scripts/verify_audit_trail.py"
        blocking: true
        on_error: "REJECT_COMMIT"
        checks:
          - "Entries exist in last 4 hours"
          - "Work categories present"
          - "No script execution errors"
          
      - order: 2
        name: "Architecture Compliance"
        script: "scripts/audit_architecture.py"
        blocking: true
        on_error: "REJECT_COMMIT"
        checks:
          - "Test infrastructure exists"
          - "Core components present"
          - "SKULL rules not violated"
          
      - order: 3
        name: "SKULL Quick Checks"
        inline: true
        blocking: true
        checks:
          - "No test files outside tests/"
          - "No sensitive data in diff"
          - "No direct SQLite outside StateManager"
          
      - order: 4
        name: "Build Progress Verification"
        inline: true
        blocking: false
        checks:
          - "Session audit has recent entries"
          - "Last logged task visible"

  # ============================================================================
  # AUDIT LOG MANAGEMENT
  # ============================================================================
  log_management:
    retention:
      hot_logs: "7 days"
      warm_logs: "30 days (compressed)"
      cold_logs: "1 year (archived)"
      
    rotation:
      trigger: "size > 10MB OR age > 7 days"
      command: "python3 scripts/audit_log_manager.py rotate"
      
    cleanup:
      trigger: "Monthly"
      command: "python3 scripts/audit_log_manager.py cleanup --days 90"
      
    consolidation:
      trigger: "End of feature"
      action: "Consolidate all feature logs into single archive"

  # ============================================================================
  # INTEGRATION WITH TODO TRACKER
  # ============================================================================
  todo_integration:
    on_task_start:
      action: "Log to session audit"
      command: "update_session.py --log 'Starting: {task_id} - {task_name}'"
      
    on_task_complete:
      action: "Log with SUCCESS status"
      command: "update_session.py --task-complete '{task_id}'"
      
    on_phase_complete:
      action: "Create checkpoint and log"
      actions:
        - "StateManager.create_checkpoint(name='{phase_name}')"
        - "update_session.py --log 'Phase {phase_id} complete'"
        
    on_error:
      action: "Log error and create remediation task"
      actions:
        - "Log error with full context"
        - "Create task: 'Fix: {error_description}'"
        - "Set task priority based on severity"
