# ==============================================================================
# SECTION 1: EDGE CASES
# ==============================================================================
edge_cases:
  
  - risk_id: "EC-001"
    category: "edge_case"
    severity: HIGH
    name: "Empty DAG Execution"
    description: "TODO Orchestrator receives empty plan with no tasks"
    trigger: "User creates plan with no actionable items"
    impact: "Infinite loop or crash if not handled"
    probability: MEDIUM
    mitigation:
      strategy: "Validation gate at DAG creation"
      implementation: |
        if dag.is_empty():
            raise EmptyDagError("Plan must contain at least one task")
      validation_test: "test_empty_dag_rejection"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "EC-002"
    category: "edge_case"
    severity: CRITICAL
    name: "Orphaned Tasks After Dependency Removal"
    description: "Tasks become unreachable when parent task is deleted"
    trigger: "User deletes task that other tasks depend on"
    impact: "Tasks stuck in BLOCKED state forever"
    probability: HIGH
    mitigation:
      strategy: "Cascade validation on task deletion"
      implementation: |
        def delete_task(self, task_id):
            dependents = self.dag.get_dependents(task_id)
            if dependents:
                self._reassign_or_block_dependents(dependents)
      validation_test: "test_orphan_prevention"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "EC-003"
    category: "edge_case"
    severity: HIGH
    name: "Unicode in Task Names"
    description: "Task names with emoji or non-ASCII characters cause issues"
    trigger: "User includes emoji in task descriptions"
    impact: "JSON serialization failures, display issues"
    probability: MEDIUM
    mitigation:
      strategy: "UTF-8 normalization at input"
      implementation: "Normalize all strings to UTF-8 NFC form"
      validation_test: "test_unicode_task_names"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "EC-004"
    category: "edge_case"
    severity: MEDIUM
    name: "Extremely Deep DAG (>100 levels)"
    description: "DAG with more than 100 dependency levels causes stack overflow"
    trigger: "Complex enterprise plans with deep hierarchies"
    impact: "Recursion limit exceeded, crash"
    probability: LOW
    mitigation:
      strategy: "Iterative algorithms instead of recursive"
      implementation: "Use iterative DFS with explicit stack"
      validation_test: "test_deep_dag_handling"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "EC-005"
    category: "edge_case"
    severity: HIGH
    name: "Governance Rule Conflict Deadlock"
    description: "Two governance rules conflict with equal priority"
    trigger: "Business rule and CORTEX rule both claim override rights"
    impact: "Merge algorithm cannot decide, hangs"
    probability: MEDIUM
    mitigation:
      strategy: "Explicit priority hierarchy with tie-breaker"
      implementation: |
        Priority order: Business Tier 0 > CORTEX Tier 0 > Company > Knowledge
        Tie-breaker: Rule with earlier creation timestamp wins
      validation_test: "test_governance_deadlock_resolution"
    status: PENDING
    feature_reference: "feat03-governance"

# ==============================================================================
# SECTION 2: FAILURE MODES
# ==============================================================================
failure_modes:
  
  - risk_id: "FM-001"
    category: "failure_mode"
    severity: CRITICAL
    name: "Database Corruption on Crash"
    description: "SQLite database corrupted if process crashes during write"
    trigger: "Power failure, SIGKILL, system crash during transaction"
    impact: "Total state loss, unrecoverable"
    probability: LOW
    mitigation:
      strategy: "WAL mode + atomic transactions"
      implementation: |
        PRAGMA journal_mode=WAL;
        PRAGMA synchronous=NORMAL;
        All writes in transactions with explicit commit
      validation_test: "test_crash_recovery"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "FM-002"
    category: "failure_mode"
    severity: HIGH
    name: "Audit Log Write Failure"
    description: "Audit log cannot write (disk full, permissions)"
    trigger: "Disk exhaustion, permission change, network mount failure"
    impact: "Operations proceed without audit trail (compliance violation)"
    probability: MEDIUM
    mitigation:
      strategy: "Fail-safe audit logging with queue"
      implementation: |
        1. Primary: Write to file
        2. Fallback: In-memory queue (max 1000 entries)
        3. Alert: Raise CRITICAL alert if queue fills
        4. Never block operation (but mark as unaudited)
      validation_test: "test_audit_failsafe"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "FM-003"
    category: "failure_mode"
    severity: HIGH
    name: "Pattern Router Returns No Match"
    description: "User intent doesn't match any registered orchestrator"
    trigger: "Ambiguous or novel user request"
    impact: "No action taken, user confused"
    probability: MEDIUM
    mitigation:
      strategy: "LLM fallback + default orchestrator"
      implementation: |
        1. Try Trie exact match
        2. Try LLM classification
        3. Fallback to MasterOrchestrator.default_handler()
        4. Log unmatched intent for learning
      validation_test: "test_no_match_handling"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "FM-004"
    category: "failure_mode"
    severity: CRITICAL
    name: "Checkpoint Corruption"
    description: "Checkpoint file partially written, unreadable"
    trigger: "Process killed during checkpoint write"
    impact: "Cannot resume from corrupted checkpoint"
    probability: LOW
    mitigation:
      strategy: "Atomic checkpoint with temp file"
      implementation: |
        1. Write to .checkpoint.tmp
        2. fsync() to ensure durability
        3. Atomic rename to .checkpoint
        4. Keep previous checkpoint as .checkpoint.bak
      validation_test: "test_checkpoint_atomicity"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "FM-005"
    category: "failure_mode"
    severity: MEDIUM
    name: "MCP Connection Timeout"
    description: "MCP server doesn't respond within timeout"
    trigger: "Network issues, server overload, firewall"
    impact: "Multi-repo operations fail"
    probability: MEDIUM
    mitigation:
      strategy: "Retry with exponential backoff"
      implementation: |
        max_retries = 3
        base_delay = 1.0
        for attempt in range(max_retries):
            try: return call_mcp(...)
            except Timeout:
                time.sleep(base_delay * (2 ** attempt))
        raise McpUnavailable()
      validation_test: "test_mcp_retry"
    status: PENDING
    feature_reference: "feat06-mcp"

# ==============================================================================
# SECTION 3: RACE CONDITIONS
# ==============================================================================
race_conditions:
  
  - risk_id: "RC-001"
    category: "race_condition"
    severity: CRITICAL
    name: "Concurrent Task Status Update"
    description: "Two processes update same task status simultaneously"
    trigger: "Parallel execution in multi-threaded environment"
    impact: "Lost updates, inconsistent state"
    probability: HIGH
    mitigation:
      strategy: "Optimistic locking with version column"
      implementation: |
        UPDATE tasks SET status = ?, version = version + 1
        WHERE id = ? AND version = ?
        If rows_affected == 0: raise ConcurrencyError()
      validation_test: "test_concurrent_update_conflict"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "RC-002"
    category: "race_condition"
    severity: HIGH
    name: "DAG Modification During Traversal"
    description: "DAG structure changes while being traversed"
    trigger: "User adds/removes task while execution in progress"
    impact: "Invalid iterator, skipped or duplicate tasks"
    probability: MEDIUM
    mitigation:
      strategy: "Copy-on-write DAG snapshot for traversal"
      implementation: |
        def execute_dag(self):
            snapshot = self.dag.snapshot()  # Immutable copy
            for task in snapshot.topological_order():
                self._execute_task(task)
      validation_test: "test_dag_modification_during_execution"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "RC-003"
    category: "race_condition"
    severity: HIGH
    name: "Audit Log Interleaving"
    description: "Audit log entries from parallel operations interleaved"
    trigger: "Multiple orchestrators running simultaneously"
    impact: "Audit trace hard to follow, correlation lost"
    probability: HIGH
    mitigation:
      strategy: "Correlation ID + sequence numbers"
      implementation: |
        Each operation gets: correlation_id + sequence_number
        Entries can be reconstructed in order per correlation_id
      validation_test: "test_audit_log_ordering"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "RC-004"
    category: "race_condition"
    severity: MEDIUM
    name: "Governance Rule Hot Reload Race"
    description: "Governance rules reload while merge in progress"
    trigger: "Admin updates governance rules during operation"
    impact: "Merge uses inconsistent rule set"
    probability: LOW
    mitigation:
      strategy: "Rule versioning with atomic swap"
      implementation: |
        Load new rules to separate memory location
        Atomic pointer swap once fully loaded
        Inflight operations use old version until complete
      validation_test: "test_governance_hot_reload"
    status: PENDING
    feature_reference: "feat03-governance"

# ==============================================================================
# SECTION 4: SECURITY VULNERABILITIES
# ==============================================================================
security_vulnerabilities:
  
  - risk_id: "SEC-001"
    category: "security"
    severity: CRITICAL
    name: "SQL Injection in Task Search"
    description: "User-provided task name used in raw SQL query"
    trigger: "Malicious task name with SQL commands"
    impact: "Database compromise, data exfiltration"
    probability: MEDIUM
    mitigation:
      strategy: "Parameterized queries only"
      implementation: |
        NEVER: f"SELECT * FROM tasks WHERE name = '{user_input}'"
        ALWAYS: cursor.execute("SELECT * FROM tasks WHERE name = ?", (user_input,))
      validation_test: "test_sql_injection_prevention"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "SEC-002"
    category: "security"
    severity: HIGH
    name: "Path Traversal in File Operations"
    description: "User-provided path escapes intended directory"
    trigger: "Malicious path like ../../../etc/passwd"
    impact: "Arbitrary file read/write"
    probability: MEDIUM
    mitigation:
      strategy: "Path canonicalization and jail"
      implementation: |
        canonical = os.path.realpath(user_path)
        if not canonical.startswith(allowed_root):
            raise SecurityError("Path traversal detected")
      validation_test: "test_path_traversal_prevention"
    status: PENDING
    feature_reference: "feat08-cleanup"
    
  - risk_id: "SEC-003"
    category: "security"
    severity: HIGH
    name: "Audit Log Tampering"
    description: "Attacker modifies audit logs to hide actions"
    trigger: "Compromised account with file system access"
    impact: "Compliance failure, undetectable attacks"
    probability: LOW
    mitigation:
      strategy: "Append-only logs with hash chain"
      implementation: |
        Each entry includes: hash(previous_entry + current_entry)
        Any modification breaks the chain
        Optional: External log backup to immutable storage
      validation_test: "test_audit_log_integrity"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "SEC-004"
    category: "security"
    severity: CRITICAL
    name: "Governance Rule Bypass via Direct API"
    description: "Operations bypass governance by calling internal APIs"
    trigger: "Developer or malicious code calls internal methods"
    impact: "Governance rules not enforced"
    probability: MEDIUM
    mitigation:
      strategy: "Runtime enforcement via decorators"
      implementation: |
        @governance_required
        def execute_task(self, task_id):
            # Method cannot run without governance check
            pass
      validation_test: "test_governance_bypass_prevention"
    status: PENDING
    feature_reference: "feat03-governance"
    
  - risk_id: "SEC-005"
    category: "security"
    severity: MEDIUM
    name: "Sensitive Data in Audit Logs"
    description: "PII or secrets accidentally logged"
    trigger: "Logging context dictionary with sensitive fields"
    impact: "Data privacy violation"
    probability: HIGH
    mitigation:
      strategy: "Audit log sanitization filter"
      implementation: |
        SENSITIVE_PATTERNS = ['password', 'secret', 'token', 'ssn', 'credit_card']
        def sanitize_context(ctx):
            return {k: '***REDACTED***' if is_sensitive(k) else v for k, v in ctx.items()}
      validation_test: "test_audit_log_sanitization"
    status: PENDING
    feature_reference: "feat01-foundation"

# ==============================================================================
# SECTION 5: PERFORMANCE BOTTLENECKS
# ==============================================================================
performance_bottlenecks:
  
  - risk_id: "PERF-001"
    category: "performance"
    severity: HIGH
    name: "DAG Traversal O(n²) on Large Graphs"
    description: "Naive DFS becomes slow with >1000 nodes"
    trigger: "Enterprise-scale plans with thousands of tasks"
    impact: "Execution planning takes minutes instead of milliseconds"
    probability: MEDIUM
    mitigation:
      strategy: "Cached topological order"
      implementation: |
        self._cached_order = None
        def invalidate_cache(self): self._cached_order = None
        def topological_order(self):
            if self._cached_order is None:
                self._cached_order = self._compute_order()
            return self._cached_order
      validation_test: "test_large_dag_performance"
      sla: "<100ms for 1000 nodes"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "PERF-002"
    category: "performance"
    severity: HIGH
    name: "Governance Merge on Every Operation"
    description: "Full governance merge runs on every single task"
    trigger: "Thousands of tasks execute sequentially"
    impact: "Cumulative overhead becomes significant"
    probability: HIGH
    mitigation:
      strategy: "Cached unified instruction set"
      implementation: |
        Cache merged governance rules
        Invalidate only when rules change
        TTL: 5 minutes or explicit invalidation
      validation_test: "test_governance_merge_caching"
      sla: "<50ms first merge, <1ms cached"
    status: PENDING
    feature_reference: "feat03-governance"
    
  - risk_id: "PERF-003"
    category: "performance"
    severity: MEDIUM
    name: "Audit Log File Growth"
    description: "Audit log files grow unbounded"
    trigger: "Long-running CORTEX with high activity"
    impact: "Disk full, slow file operations"
    probability: HIGH
    mitigation:
      strategy: "Log rotation with compression"
      implementation: |
        Max file size: 100MB
        Max files: 10 (1GB total)
        Rotation: gzip old files
        Archive: Move to cold storage after 7 days
      validation_test: "test_audit_log_rotation"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "PERF-004"
    category: "performance"
    severity: HIGH
    name: "Pattern Router Regex Compilation"
    description: "Regex patterns compiled on every request"
    trigger: "100+ orchestrators registered"
    impact: "Routing latency increases with orchestrator count"
    probability: MEDIUM
    mitigation:
      strategy: "Pre-compiled pattern cache"
      implementation: |
        Compile all patterns at startup
        Store in Trie structure for O(1) lookup
        Recompile only on orchestrator registration
      validation_test: "test_pattern_compilation_caching"
      sla: "<5ms for 100 orchestrators"
    status: PENDING
    feature_reference: "feat01-foundation"

# ==============================================================================
# SECTION 6: SCALABILITY LIMITS
# ==============================================================================
scalability_limits:
  
  - risk_id: "SCALE-001"
    category: "scalability"
    severity: MEDIUM
    name: "Single SQLite Database Limit"
    description: "SQLite not suitable for high-concurrency multi-user"
    trigger: "CORTEX deployed in multi-user enterprise environment"
    impact: "Lock contention, performance degradation"
    probability: LOW
    current_scope: "Single user, single process"
    mitigation:
      strategy: "PostgreSQL migration path"
      implementation: |
        Abstract database layer via repository pattern
        SQLite for development/single-user
        PostgreSQL for enterprise deployment
      validation_test: "test_database_abstraction"
    future_work: true
    status: PENDING
    feature_reference: "feat05-resilience"
    
  - risk_id: "SCALE-002"
    category: "scalability"
    severity: MEDIUM
    name: "Knowledge Graph Memory Limit"
    description: "In-memory knowledge graph exceeds available RAM"
    trigger: "Years of accumulated knowledge"
    impact: "OOM errors, crashes"
    probability: LOW
    mitigation:
      strategy: "Tiered storage with LRU cache"
      implementation: |
        Hot tier: In-memory (last 30 days)
        Warm tier: SQLite (last year)
        Cold tier: Archive (older)
      validation_test: "test_knowledge_tiered_storage"
    future_work: true
    status: PENDING
    feature_reference: "feat03-governance"

# ==============================================================================
# SECTION 7: ROLLBACK & RECOVERY SCENARIOS
# ==============================================================================
rollback_recovery:
  
  - risk_id: "ROLL-001"
    category: "rollback"
    severity: CRITICAL
    name: "Mid-Execution Failure Recovery"
    description: "CORTEX crashes in middle of multi-task execution"
    trigger: "Process crash, system reboot, network failure"
    impact: "Partial work lost, inconsistent state"
    probability: MEDIUM
    mitigation:
      strategy: "Checkpoint-based recovery"
      implementation: |
        1. Checkpoint every N tasks (configurable, default 5)
        2. On startup, check for incomplete execution
        3. Resume from last valid checkpoint
        4. Re-execute failed task
      validation_test: "test_mid_execution_recovery"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "ROLL-002"
    category: "rollback"
    severity: HIGH
    name: "Rollback Cascade Failure"
    description: "Rollback of one task requires cascading rollback of dependents"
    trigger: "Task failure after dependent tasks already executed"
    impact: "Complex undo chain, potential data inconsistency"
    probability: MEDIUM
    mitigation:
      strategy: "Dependency-aware rollback"
      implementation: |
        1. Mark failed task as ROLLBACK_REQUIRED
        2. Traverse DAG to find all dependent tasks
        3. Rollback in reverse topological order
        4. Mark all as ROLLED_BACK
      validation_test: "test_cascade_rollback"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "ROLL-003"
    category: "rollback"
    severity: MEDIUM
    name: "Partial Git Commit During Failure"
    description: "Git commit started but not completed due to failure"
    trigger: "Network failure during git push"
    impact: "Local commit exists but not pushed, sync issues"
    probability: MEDIUM
    mitigation:
      strategy: "Git operation transaction wrapper"
      implementation: |
        1. Create work branch
        2. All commits on work branch
        3. Only merge to main after all operations complete
        4. Delete work branch on failure
      validation_test: "test_git_transaction_wrapper"
    status: PENDING
    feature_reference: "feat07-integration"

# ==============================================================================
# SECTION 8: DATA INTEGRITY & VALIDATION GAPS
# ==============================================================================
data_integrity:
  
  - risk_id: "DI-001"
    category: "data_integrity"
    severity: CRITICAL
    name: "DAG Integrity After Modification"
    description: "DAG becomes invalid after complex modifications"
    trigger: "Series of add/remove operations leave graph inconsistent"
    impact: "Execution engine crashes or produces wrong results"
    probability: MEDIUM
    mitigation:
      strategy: "Validation after every modification"
      implementation: |
        def modify_dag(self, operation):
            operation()
            if not self._validate_dag():
                self._rollback_modification()
                raise DagIntegrityError()
      validation_test: "test_dag_integrity_invariants"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "DI-002"
    category: "data_integrity"
    severity: HIGH
    name: "State/DAG Desynchronization"
    description: "Persisted state doesn't match in-memory DAG"
    trigger: "Bug in persistence layer, partial writes"
    impact: "Wrong tasks executed, state corruption"
    probability: LOW
    mitigation:
      strategy: "Checksums and validation on load"
      implementation: |
        On save: Store checksum of serialized DAG
        On load: Verify checksum matches
        On mismatch: Rebuild from audit log
      validation_test: "test_state_dag_synchronization"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"
    
  - risk_id: "DI-003"
    category: "data_integrity"
    severity: MEDIUM
    name: "YAML Schema Drift"
    description: "Plan YAML doesn't match expected schema"
    trigger: "Manual editing, old plan format, schema evolution"
    impact: "Parser errors, missing data"
    probability: HIGH
    mitigation:
      strategy: "Schema validation with migration"
      implementation: |
        1. JSON Schema for plan format
        2. Version field in all plans
        3. Automatic migration for old versions
        4. Reject invalid schemas with clear error
      validation_test: "test_yaml_schema_validation"
    status: PENDING
    feature_reference: "feat02-todo-orchestrator"

# ==============================================================================
# SECTION 9: DEPENDENCY RISKS
# ==============================================================================
dependency_risks:
  
  - risk_id: "DEP-001"
    category: "dependency"
    severity: MEDIUM
    name: "Python Version Incompatibility"
    description: "Code uses features not available in older Python"
    trigger: "User has Python 3.8 but code requires 3.10+"
    impact: "Syntax errors, runtime failures"
    probability: MEDIUM
    mitigation:
      strategy: "Explicit version requirements + CI testing"
      implementation: |
        python_requires='>=3.10'
        CI matrix tests 3.10, 3.11, 3.12
      validation_test: "test_python_version_compatibility"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "DEP-002"
    category: "dependency"
    severity: HIGH
    name: "Third-Party Library Breaking Change"
    description: "Dependency update introduces breaking API change"
    trigger: "pip install without version pinning"
    impact: "Runtime errors, functionality loss"
    probability: MEDIUM
    mitigation:
      strategy: "Pinned dependencies with Dependabot"
      implementation: |
        requirements.txt with exact versions
        Dependabot for security updates
        Manual review for major version bumps
      validation_test: "test_dependency_versions"
    status: PENDING
    feature_reference: "feat01-foundation"
    
  - risk_id: "DEP-003"
    category: "dependency"
    severity: MEDIUM
    name: "MCP Protocol Version Mismatch"
    description: "CORTEX MCP client incompatible with server version"
    trigger: "Server updated, client not updated"
    impact: "Communication failures, protocol errors"
    probability: MEDIUM
    mitigation:
      strategy: "Protocol version negotiation"
      implementation: |
        1. Client sends version in handshake
        2. Server responds with supported range
        3. Negotiate common version or fail fast
      validation_test: "test_mcp_version_negotiation"
    status: PENDING
    feature_reference: "feat06-mcp"

# ==============================================================================
# SECTION 10: MAINTAINABILITY ISSUES
# ==============================================================================
maintainability_issues:
  
  - risk_id: "MAINT-001"
    category: "maintainability"
    severity: MEDIUM
    name: "Orchestrator Proliferation"
    description: "Too many single-purpose orchestrators, hard to maintain"
    trigger: "Each new feature adds new orchestrator"
    impact: "Code duplication, inconsistent behavior"
    probability: HIGH
    mitigation:
      strategy: "Orchestrator composition pattern"
      implementation: |
        Base orchestrator with common functionality
        Specialized orchestrators inherit and extend
        Maximum 20 orchestrators (consolidate if exceeded)
      validation_test: "test_orchestrator_count_limit"
    status: PENDING
    feature_reference: "feat04-core-orchestration"
    
  - risk_id: "MAINT-002"
    category: "maintainability"
    severity: MEDIUM
    name: "Documentation Drift"
    description: "Code changes but documentation not updated"
    trigger: "Time pressure, oversight"
    impact: "Misleading docs, developer confusion"
    probability: HIGH
    mitigation:
      strategy: "Doc generation from code + review gate"
      implementation: |
        1. Docstrings in all public methods
        2. Sphinx auto-generation
        3. PR checklist includes doc review
      validation_test: "test_documentation_completeness"
    status: PENDING
    feature_reference: "feat07-integration"
    
  - risk_id: "MAINT-003"
    category: "maintainability"
    severity: LOW
    name: "Test Suite Slow Down"
    description: "Test suite takes too long to run"
    trigger: "Integration tests grow without optimization"
    impact: "Developers skip tests, bugs slip through"
    probability: MEDIUM
    mitigation:
      strategy: "Test categorization and parallel execution"
      implementation: |
        pytest-xdist for parallelization
        Mark slow tests as @pytest.mark.slow
