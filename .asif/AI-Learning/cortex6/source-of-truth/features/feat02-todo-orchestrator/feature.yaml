            test_names: ["test_execution_queue", "test_priority_ordering"]
            
        - id: "4.3"
          name: "Implement progress tracking API"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["4.2"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/core/todo_orchestrator.py"
            implement:
              - "get_progress() -> ProgressReport"
              - "get_feature_progress(feature_id) -> ProgressReport"
              - "get_phase_progress(feature_id, phase_id) -> ProgressReport"
            progress_report:
              fields:
                - "total_tasks"
                - "completed_tasks"
                - "failed_tasks"
                - "blocked_tasks"
                - "percentage"
                - "estimated_remaining_time"
          validation:
            type: "tests_pass"
            test_names: ["test_get_progress", "test_update_progress"]
            
        - id: "4.4"
          name: "Full TODO lifecycle integration test"
          priority: P0_CRITICAL
          estimated_minutes: 90
          tdd_required: true
          dependencies: ["4.3"]
          implementation:
            action: "create_file"
            path: "tests/integration/test_todo_lifecycle.py"
            test_cases:
              - name: "test_full_lifecycle"
                steps:
                  - "Load YAML plan"
                  - "Generate TODOs"
                  - "Execute in order"
                  - "Handle failure"
                  - "Rollback"
                  - "Resume"
                  - "Complete"
              - name: "test_checkpoint_resume_lifecycle"
                steps:
                  - "Execute partial plan"
                  - "Create checkpoint"
                  - "Simulate crash"
                  - "Recover from checkpoint"
                  - "Continue execution"
          validation:
            type: "integration_test_passes"
            path: "tests/integration/test_todo_lifecycle.py"
            
        - id: "4.5"
          name: "HANDOFF VALIDATION"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          is_handoff_gate: true
          dependencies: ["4.4"]
          implementation:
            action: "create_file"
            path: "tests/integration/test_cortex_self_management.py"
            test_cases:
              - name: "test_cortex_can_manage_own_todos"
                description: "CORTEX creates and executes TODOs from this epic"
                steps:
                  - "CORTEX loads feat03-governance feature.yaml"
                  - "CORTEX generates TODOs"
                  - "CORTEX creates DAG"
                  - "CORTEX identifies ready tasks"
                  - "CORTEX can checkpoint"
                  - "CORTEX can resume"
              - name: "test_cortex_audit_trail"
                description: "CORTEX operations are audited"
              - name: "test_cortex_rollback_capability"
                description: "CORTEX can rollback on failure"
          validation:
            type: "handoff_gate"
            requirements:
              - "test_cortex_can_manage_own_todos PASSES"
              - "test_cortex_audit_trail PASSES"
              - "test_cortex_rollback_capability PASSES"
          on_success:
            action: "INITIATE_HANDOFF"
            update_tracker: true
            new_executor: "CORTEX TODO Manager"
          on_failure:
            action: "DEFER_HANDOFF"
            continue_with: "GitHub Copilot"
            retry_at: "Next checkpoint"

  # ============================================================================
  # FEATURE COMPLETION
  # ============================================================================
  completion:
    validation:
      - "All 4 phases complete"
      - "All unit tests pass"
      - "Integration tests pass"
      - "HANDOFF VALIDATION passes"
      - "Coverage >90% for core components"
      
    audit_analysis:
      correlation_id_range: "FEAT02-P1 to FEAT02-P4"
      checks:
        - "Full audit trace available"
        - "Zero unresolved ERROR entries"
        - "HANDOFF validation logged"
        - "Self-management capability verified"
        
    deliverables_checklist:
      - path: "src/orchestrators/core/dag.py"
        status: NOT_DELIVERED
      - path: "src/orchestrators/core/todo_orchestrator.py"
        status: NOT_DELIVERED
      - path: "src/orchestrators/core/checkpoint_manager.py"
        status: NOT_DELIVERED
      - path: "tests/integration/test_cortex_self_management.py"
        status: NOT_DELIVERED
        
    handoff_execution:
      trigger: "All validation passes"
      steps:
        - step: 1
          action: "Update TODO tracker"
          details: "current_executor = 'CORTEX TODO Manager'"
        - step: 2
          action: "CORTEX loads remaining features"
          details: "feat03 through feat08 from tracker"
        - step: 3
          action: "CORTEX generates first work batch"
          details: "TODOs for feat03-governance"
        - step: 4
          action: "GitHub Copilot notification"
          details: "Handoff complete, advisory role only"
          
    next_feature: "feat03-governance"
    next_executor: "CORTEX TODO Manager"
