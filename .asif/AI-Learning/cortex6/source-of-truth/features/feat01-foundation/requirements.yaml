  source:
    phase: 2
    task: '2.4'
    feature_yaml_line: 347
  priority: P0_CRITICAL
  category: database
  type: functional
  acceptance_criteria:
  - _check_version(key, expected_version) validates version before update
  - _increment_version(key) increments version after successful update
  - update_state() raises VersionConflictError on mismatch
  - Concurrent updates to same key fail with clear error
  - Version column never decrements
  implementation:
    files:
    - src/database/state_manager.py
    methods:
    - '_check_version(key: str, expected_version: int) -> bool'
    - '_increment_version(key: str) -> int'
