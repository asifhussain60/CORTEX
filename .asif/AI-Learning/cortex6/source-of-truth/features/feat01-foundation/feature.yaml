# ==============================================================================
# FEATURE: FEAT01-FOUNDATION - Foundation Layer
# ==============================================================================
# Purpose: Establish core infrastructure for CORTEX 6.0
# Executor: GitHub Copilot (pre-handoff)
# Priority: P0_CRITICAL - All other features depend on this
# 
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-07
# ==============================================================================

feature:
  id: feat01-foundation
  name: "Foundation Layer"
  description: |
    Establishes the core infrastructure required by all subsequent features:
    - Test harness with single tests/ folder
    - SQLite-based StateManager with WAL mode and optimistic locking
    - Enhanced AuditLogger with correlation tracking
    - Trie-based PatternRouter with O(1) lookup
    
  epic_id: CORTEX6-BUILD
  priority: P0_CRITICAL
  tier: 1
  status: NOT_STARTED
  progress: 0
  
  # ============================================================================
  # METADATA
  # ============================================================================
  metadata:
    created_date: "2026-01-07"
    last_updated: "2026-01-07"
    estimated_days: 12
    actual_days: 0
    executor: "GitHub Copilot"
    
  # ============================================================================
  # DEPENDENCIES
  # ============================================================================
  dependencies:
    required: []  # No dependencies - this is the foundation
    optional: []
    
  enables:
    - feat02-todo-orchestrator
    - feat03-governance
    
  # ============================================================================
  # AUDIT REQUIREMENTS
  # ============================================================================
  audit:
    mandatory: true
    log_to: "cortex-brain/audit-logs/"
    categories:
      - STATE_MANAGEMENT
      - VALIDATION
      - MIDDLEWARE
      - EXECUTION
    correlation_prefix: "FEAT01"
    
  # ============================================================================
  # DELIVERABLES
  # ============================================================================
  deliverables:
    code:
      - path: "tests/"
        description: "Consolidated test folder structure"
        type: "directory"
        
      - path: "tests/conftest.py"
        description: "Shared pytest fixtures"
        type: "python"
        
      - path: "src/database/state_manager.py"
        description: "SQLite StateManager with WAL and optimistic locking"
        type: "python"
        
      - path: "src/orchestrators/audit_logger.py"
        description: "Enhanced AuditLogger with correlation tracking"
        type: "python"
        
      - path: "src/orchestrators/routing/trie_router.py"
        description: "Trie-based pattern router with O(1) lookup"
        type: "python"
        
    tests:
      - path: "tests/unit/test_state_manager.py"
        coverage_target: "90%"
        
      - path: "tests/unit/test_audit_logger.py"
        coverage_target: "90%"
        
      - path: "tests/unit/test_pattern_router.py"
        coverage_target: "90%"
        
      - path: "tests/performance/test_routing_performance.py"
        sla: "<5ms for 100 orchestrators"
        
    documentation:
      - path: "docs/architecture/foundation-layer.md"
        description: "Foundation layer architecture documentation"
        
  # ============================================================================
  # PHASES
  # ============================================================================
  phases:
    # --------------------------------------------------------------------------
    # Phase 1: Test Infrastructure Setup
    # --------------------------------------------------------------------------
    - id: 1
      name: "Test Infrastructure Setup"
      description: "Create consolidated test folder structure"
      status: NOT_STARTED
      progress: 0
      estimated_hours: 16
      
      objectives:
        - "Create tests/ folder with proper structure"
        - "Setup pytest configuration"
        - "Create shared fixtures"
        - "Migrate existing tests"
        
      entry_criteria:
        - "Access to repository"
        - "Python environment configured"
        
      exit_criteria:
        - "tests/ folder exists with unit/, integration/, performance/, governance/ subdirs"
        - "pytest --collect-only discovers tests"
        - "No test files outside tests/ folder"
        
      audit_checkpoint:
        correlation_id: "FEAT01-P1"
        validation:
          - "All operations logged with VALIDATION category"
          - "Zero ERROR entries"
          - "Folder creation events recorded"
        
      tasks:
        - id: "1.1"
          name: "Create test folder structure"
          priority: P0_CRITICAL
          estimated_minutes: 30
          tdd_required: false  # Infrastructure setup
          dependencies: []
          implementation:
            action: "create_directory"
            paths:
              - "tests/"
              - "tests/__init__.py"
              - "tests/unit/"
              - "tests/unit/__init__.py"
              - "tests/integration/"
              - "tests/integration/__init__.py"
              - "tests/performance/"
              - "tests/performance/__init__.py"
              - "tests/governance/"
              - "tests/governance/__init__.py"
              - "tests/fixtures/"
          validation:
            type: "directory_exists"
            paths: ["tests/", "tests/unit/", "tests/integration/"]
            
        - id: "1.2"
          name: "Create pytest.ini configuration"
          priority: P0_CRITICAL
          estimated_minutes: 20
          dependencies: ["1.1"]
          implementation:
            action: "create_file"
            path: "tests/pytest.ini"
            content_template: |
              [pytest]
              testpaths = tests
              python_files = test_*.py
              python_classes = Test*
              python_functions = test_*
              addopts = -v --tb=short --strict-markers
              markers =
                  slow: marks tests as slow (deselect with '-m "not slow"')
                  integration: marks tests as integration tests
                  performance: marks tests as performance tests
          validation:
            type: "file_contains"
            path: "tests/pytest.ini"
            contains: ["[pytest]", "testpaths", "markers"]
            
        - id: "1.3"
          name: "Create shared fixtures (conftest.py)"
          priority: P0_CRITICAL
          estimated_minutes: 60
          dependencies: ["1.2"]
          implementation:
            action: "create_file"
            path: "tests/conftest.py"
            requires:
              - "audit_logger fixture"
              - "temp_db fixture"
              - "sample_dag fixture"
              - "mock_governance_rules fixture"
          validation:
            type: "file_contains"
            path: "tests/conftest.py"
            contains: ["@pytest.fixture", "audit_logger", "temp_db"]
            
        - id: "1.4"
          name: "Create test fixture data files"
          priority: P1_HIGH
          estimated_minutes: 45
          dependencies: ["1.3"]
          implementation:
            action: "create_files"
            files:
              - path: "tests/fixtures/sample_governance_rules.yaml"
                description: "Sample governance rules for testing"
              - path: "tests/fixtures/sample_dag.json"
                description: "Sample DAG structure for testing"
              - path: "tests/fixtures/sample_business_tier0.yaml"
                description: "Sample business tier 0 rules"
          validation:
            type: "files_exist"
            paths:
              - "tests/fixtures/sample_governance_rules.yaml"
              - "tests/fixtures/sample_dag.json"
              
        - id: "1.5"
          name: "Verify test discovery"
          priority: P1_HIGH
          estimated_minutes: 30
          dependencies: ["1.4"]
          implementation:
            action: "run_command"
            command: "pytest tests/ --collect-only"
            expected: "collected X items"
          validation:
            type: "command_succeeds"
            command: "pytest tests/ --collect-only"
            
    # --------------------------------------------------------------------------
    # Phase 2: Database Layer Foundation
    # --------------------------------------------------------------------------
    - id: 2
      name: "Database Layer Foundation"
      description: "Implement SQLite StateManager with WAL and optimistic locking"
      status: NOT_STARTED
      progress: 0
      estimated_hours: 20
      dependencies: [1]
      
      objectives:
        - "Design SQLite schema for state management"
        - "Implement StateManager with WAL mode"
        - "Implement optimistic locking"
        - "Implement checkpoint/resume functionality"
        
      entry_criteria:
        - "Phase 1 complete"
        - "Test infrastructure ready"
        
      exit_criteria:
        - "StateManager passes all unit tests"
        - "WAL mode verified working"
        - "Optimistic locking prevents concurrent conflicts"
        - "Checkpoint/resume works correctly"
        
      audit_checkpoint:
        correlation_id: "FEAT01-P2"
        validation:
          - "All database operations logged with STATE_MANAGEMENT category"
          - "Performance metrics captured"
          - "No deadlocks detected"
          
      tasks:
        - id: "2.1"
          name: "Design SQLite schema"
          priority: P0_CRITICAL
          estimated_minutes: 45
          tdd_required: false  # Design task
          dependencies: []
          implementation:
            action: "create_file"
            path: "src/database/schema.sql"
            requires:
              - "todo_items table with version column"
              - "execution_state table"
              - "checkpoints table"
              - "Indexes for performance"
          validation:
            type: "file_contains"
            path: "src/database/schema.sql"
            contains: ["CREATE TABLE", "todo_items", "version"]
            
        - id: "2.2"
          name: "Write failing StateManager tests"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "RED"
          dependencies: ["2.1"]
          implementation:
            action: "create_file"
            path: "tests/unit/test_state_manager.py"
            test_cases:
              - "test_create_state"
              - "test_read_state"
              - "test_update_state"
              - "test_delete_state"
              - "test_optimistic_locking"
              - "test_version_conflict"
              - "test_checkpoint"
              - "test_resume_from_checkpoint"
              - "test_wal_mode_enabled"
          validation:
            type: "tests_fail"
            path: "tests/unit/test_state_manager.py"
            expected_failures: 9
            
        - id: "2.3"
          name: "Implement StateManager core"
          priority: P0_CRITICAL
          estimated_minutes: 120
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["2.2"]
          implementation:
            action: "create_file"
            path: "src/database/state_manager.py"
            class: "StateManager"
            methods:
              - "create_state(key, value)"
              - "read_state(key)"
              - "update_state(key, value, expected_version)"
              - "delete_state(key)"
              - "_enable_wal_mode()"
          validation:
            type: "tests_pass"
            path: "tests/unit/test_state_manager.py"
            test_names: ["test_create_state", "test_read_state", "test_update_state", "test_delete_state"]
            
        - id: "2.4"
          name: "Implement optimistic locking"
          priority: P0_CRITICAL
          estimated_minutes: 90
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["2.3"]
          implementation:
            action: "modify_file"
            path: "src/database/state_manager.py"
            add_methods:
              - "_check_version(key, expected_version)"
              - "_increment_version(key)"
            modify_methods:
              - "update_state: Add version check"
          validation:
            type: "tests_pass"
            test_names: ["test_optimistic_locking", "test_version_conflict"]
            
        - id: "2.5"
          name: "Implement checkpoint/resume"
          priority: P0_CRITICAL
          estimated_minutes: 90
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["2.4"]
          implementation:
            action: "modify_file"
            path: "src/database/state_manager.py"
            add_methods:
              - "create_checkpoint()"
              - "restore_checkpoint(checkpoint_id)"
              - "list_checkpoints()"
          validation:
            type: "tests_pass"
            test_names: ["test_checkpoint", "test_resume_from_checkpoint"]
            
        - id: "2.6"
          name: "Refactor and optimize StateManager"
          priority: P1_HIGH
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "REFACTOR"
          dependencies: ["2.5"]
          implementation:
            action: "refactor"
            targets:
              - "Extract connection pooling"
              - "Add context manager support"
              - "Optimize query performance"
          validation:
            type: "tests_pass"
            path: "tests/unit/test_state_manager.py"
            all: true
            
    # --------------------------------------------------------------------------
    # Phase 3: Audit Logger Enhancement
    # --------------------------------------------------------------------------
    - id: 3
      name: "Audit Logger Enhancement"
      description: "Enhance existing AuditLogger with correlation tracking"
      status: NOT_STARTED
      progress: 0
      estimated_hours: 12
      dependencies: [2]
      
      objectives:
        - "Add correlation ID propagation"
        - "Add audit log analysis methods"
        - "Add phase/feature gate integration"
        - "Add log rotation"
        
      entry_criteria:
        - "Phase 2 complete"
        - "Existing AuditLogger functional"
        
      exit_criteria:
        - "Correlation IDs propagate correctly"
        - "Log analysis methods work"
        - "Phase gates log correctly"
        - "Log rotation prevents unbounded growth"
        
      audit_checkpoint:
        correlation_id: "FEAT01-P3"
        validation:
          - "Logger properly logs its own operations"
          - "Correlation ID chain unbroken"
          - "No log file corruption"
          
      tasks:
        - id: "3.1"
          name: "Write failing AuditLogger enhancement tests"
          priority: P0_CRITICAL
          estimated_minutes: 45
          tdd_required: true
          tdd_phase: "RED"
          dependencies: []
          implementation:
            action: "create_file"
            path: "tests/unit/test_audit_logger.py"
            test_cases:
              - "test_correlation_id_propagation"
              - "test_search_by_correlation"
              - "test_get_trace"
              - "test_phase_gate_logging"
              - "test_feature_gate_logging"
              - "test_log_rotation"
          validation:
            type: "tests_fail"
            expected_failures: 6
            
        - id: "3.2"
          name: "Add correlation ID propagation"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["3.1"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/audit_logger.py"
            add_methods:
              - "set_correlation_id(correlation_id)"
              - "get_correlation_id()"
              - "_propagate_correlation()"
          validation:
            type: "tests_pass"
            test_names: ["test_correlation_id_propagation"]
            
        - id: "3.3"
          name: "Add audit log analysis methods"
          priority: P1_HIGH
          estimated_minutes: 90
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["3.2"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/audit_logger.py"
            add_methods:
              - "get_trace(correlation_id)"
              - "analyze_trace(correlation_id)"
              - "find_errors_in_trace(correlation_id)"
          validation:
            type: "tests_pass"
            test_names: ["test_search_by_correlation", "test_get_trace"]
            
        - id: "3.4"
          name: "Add phase/feature gate integration"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["3.3"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/audit_logger.py"
            add_methods:
              - "log_phase_start(phase_id, correlation_id)"
              - "log_phase_end(phase_id, success, correlation_id)"
              - "log_feature_gate(feature_id, gate_name, passed)"
          validation:
            type: "tests_pass"
            test_names: ["test_phase_gate_logging", "test_feature_gate_logging"]
            
        - id: "3.5"
          name: "Add log rotation"
          priority: P1_HIGH
          estimated_minutes: 45
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["3.4"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/audit_logger.py"
            add_methods:
              - "_rotate_logs()"
              - "_compress_old_logs()"
            config:
              max_file_size: "100MB"
              max_files: 10
          validation:
            type: "tests_pass"
            test_names: ["test_log_rotation"]
            
    # --------------------------------------------------------------------------
    # Phase 4: Pattern Router Implementation
    # --------------------------------------------------------------------------
    - id: 4
      name: "Pattern Router Implementation"
      description: "Implement Trie-based pattern router with O(1) lookup"
      status: NOT_STARTED
      progress: 0
      estimated_hours: 16
      dependencies: [3]
      
      objectives:
        - "Design Trie-based router architecture"
        - "Implement Trie router core"
        - "Optimize for O(1) lookup"
        - "Integrate with existing pattern_router.py"
        
      entry_criteria:
        - "Phase 3 complete"
        - "Existing pattern_router.py analyzed"
        
      exit_criteria:
        - "Trie router passes all tests"
        - "O(1) lookup verified (<5ms for 100 orchestrators)"
        - "Backward compatible with existing routing"
        
      audit_checkpoint:
        correlation_id: "FEAT01-P4"
        validation:
          - "Routing decisions logged"
          - "Performance metrics captured"
          - "No regressions in existing routing"
          
      tasks:
        - id: "4.1"
          name: "Design Trie router architecture"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: false  # Design task
          dependencies: []
          implementation:
            action: "create_file"
            path: "src/orchestrators/routing/trie_router.py"
            design:
              - "TrieNode class with children dict"
              - "TrieRouter class with insert/search methods"
              - "Pattern tokenization strategy"
              - "Priority handling for overlapping patterns"
          validation:
            type: "file_exists"
            path: "src/orchestrators/routing/trie_router.py"
            
        - id: "4.2"
          name: "Write failing Trie router tests"
          priority: P0_CRITICAL
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "RED"
          dependencies: ["4.1"]
          implementation:
            action: "create_file"
            path: "tests/unit/test_pattern_router.py"
            test_cases:
              - "test_exact_match"
              - "test_pattern_match"
              - "test_priority_routing"
              - "test_no_match_fallback"
              - "test_wildcard_pattern"
              - "test_register_orchestrator"
              - "test_unregister_orchestrator"
          validation:
            type: "tests_fail"
            expected_failures: 7
            
        - id: "4.3"
          name: "Implement Trie router core"
          priority: P0_CRITICAL
          estimated_minutes: 120
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["4.2"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/routing/trie_router.py"
            implement:
              - "TrieNode class"
              - "TrieRouter.insert(pattern, orchestrator)"
              - "TrieRouter.search(intent)"
              - "TrieRouter.remove(pattern)"
          validation:
            type: "tests_pass"
            test_names: ["test_exact_match", "test_pattern_match", "test_priority_routing"]
            
        - id: "4.4"
          name: "Add performance optimization"
          priority: P0_CRITICAL
          estimated_minutes: 90
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["4.3"]
          implementation:
            action: "create_file"
            path: "tests/performance/test_routing_performance.py"
            test_cases:
              - "test_routing_100_orchestrators"
              - "test_routing_latency_sla"
            optimize:
              - "Pre-compile regex patterns"
              - "Cache compiled patterns"
              - "Use hash-based lookup where possible"
          validation:
            type: "performance_test"
            sla: "<5ms for 100 orchestrators"
            
        - id: "4.5"
          name: "Integrate with existing pattern_router.py"
          priority: P1_HIGH
          estimated_minutes: 60
          tdd_required: true
          tdd_phase: "GREEN"
          dependencies: ["4.4"]
          implementation:
            action: "modify_file"
            path: "src/orchestrators/pattern_router.py"
            changes:
              - "Import TrieRouter"
              - "Use TrieRouter as backend"
              - "Maintain backward compatibility"
          validation:
            type: "integration_test"
            existing_tests_pass: true

  # ============================================================================
  # FEATURE COMPLETION
  # ============================================================================
  completion:
    validation:
      - "All 4 phases complete"
      - "All unit tests pass"
      - "All integration tests pass"
      - "Performance SLAs met"
      - "Coverage >80%"
      
    audit_analysis:
      correlation_id_range: "FEAT01-P1 to FEAT01-P4"
      checks:
        - "Full audit trace available"
        - "Zero unresolved ERROR entries"
        - "Performance metrics within SLA"
        - "No security warnings"
        
    deliverables_checklist:
      - path: "tests/"
        status: NOT_DELIVERED
      - path: "src/database/state_manager.py"
        status: NOT_DELIVERED
      - path: "src/orchestrators/audit_logger.py"
        status: NOT_DELIVERED  # Enhanced
      - path: "src/orchestrators/routing/trie_router.py"
        status: NOT_DELIVERED
        
    handoff:
      next_feature: "feat02-todo-orchestrator"
      handoff_artifacts:
        - "StateManager ready for DAG persistence"
        - "AuditLogger ready for TODO tracking"
        - "PatternRouter ready for orchestrator routing"
