          name: "Create CORE-001 to CORE-061 mapping"
          priority: P0_CRITICAL
          estimated_minutes: 90
          dependencies: ["1.1"]
          
        - id: "1.3"
          name: "Create cortex-brain/tier0/governance/core-rules.yaml"
          priority: P0_CRITICAL
          estimated_minutes: 120
