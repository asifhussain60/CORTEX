feature:
  id: feat03-governance
  name: "4-Category Governance System"
  description: |
    Implements the intelligent 4-category governance merger that combines:
    1. CORTEX Tier 0 (Core brain protection rules)
    2. Business Tier 0 (Company compliance rules)
    3. Company Best Practices (Engineering standards)
    4. Knowledge Best Practices (Learned patterns)
    
    Produces a Unified Instruction Set that drives TODO generation.
    
  epic_id: CORTEX6-BUILD
  priority: P0_CRITICAL
  tier: 1
  status: NOT_STARTED
  progress: 0
  
  metadata:
    created_date: "2026-01-07"
    last_updated: "2026-01-07"
    estimated_days: 10
    actual_days: 0
    executor: "CORTEX (post-handoff)"
    
  dependencies:
