        description: "4-category governance merger"
      - path: "src/orchestrators/core/unified_instruction_set.py"
        description: "Unified instruction set generator"
        
    tests:
      - path: "tests/governance/test_governance_merger.py"
        coverage_target: "95%"
      - path: "tests/governance/test_conflict_resolution.py"
        coverage_target: "95%"
        
  phases:
    - id: 1
      name: "SKULL Rules Migration"
      status: NOT_STARTED
      progress: 0
      estimated_hours: 12
      
