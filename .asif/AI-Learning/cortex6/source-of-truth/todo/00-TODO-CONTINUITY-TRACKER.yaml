self_healing_protocol:
  version: 1.0.0
  applies_to: ALL tasks, phases, and features
  pre_task_execution:
    audit_review:
      action: Check audit logs for previous task errors
      command: tail -50 cortex-brain/audit-logs/*.jsonl | grep -i error
      frequency: Before EVERY task
    validation_check:
      action: Verify previous task exit criteria met
      method: Check validation.result in tracker
      frequency: Before EVERY task
    test_alignment:
      action: Ensure tests match implementation
      method: Run pytest and compare with expected counts
      frequency: Before EVERY task
  during_execution:
    audit_logging:
      requirement: Log ALL operations
      parameters:
      - level
      - category
      - component
      - operation
      - correlation_id
      example: AuditLevel.INFO, AuditCategory.EXECUTION, 'todo_orchestrator', 'create_todo',
        'FEAT02-P2-T2.2.3'
    tdd_enforcement:
      requirement: Follow TDD when tdd_required=true
      sequence: RED (write failing test) → GREEN (implement to pass) → REFACTOR (clean
        up)
      validation: Test must fail first, then pass
    incremental_commits:
      requirement: Keep changes manageable
      limit: 500 lines per commit
      method: Split large changes into logical increments
  post_task_execution:
    exit_criteria:
      action: Verify ALL exit criteria before marking COMPLETED
      method: Check validation section in task definition
      mandatory: true
    tracker_update:
      action: Update task status, add actual_minutes, deliverables
      fields:
      - status
      - completed_at
      - actual_minutes
      - validation.result
      mandatory: true
    continuation_prompt_update:
      action: Update CONTINUATION-PROMPT.md with current position
      fields:
      - current_position
      - completed_count
      - next_task
      mandatory: true
      frequency: EVERY task completion
      automation: python3 .asif/AI-Learning/cortex6/source-of-truth/update_continuation_prompt.py
    checkpoint:
      action: Git commit to preserve state
      frequency: Every 5 tasks OR phase completion
      message_format: 'feat{XX}-p{Y}-t{Z}: {task_name}'
  phase_completion_review:
    audit_trace_analysis:
      action: Review ALL audit entries for phase
      command: grep FEAT{XX}-P{Y} cortex-brain/audit-logs/*.jsonl
      check_for:
      - ERROR
      - CRITICAL
      - incomplete operations
    error_remediation:
      requirement: Fix ALL errors immediately
      exception: May defer if ROI analysis justifies (MUST document reason)
      documentation: Add to risk/00-RISK-REGISTRY.yaml
    test_coverage:
      requirement: Minimum 80% coverage per phase
      command: pytest --cov --cov-report=term-missing
      action_if_below: Add missing tests before proceeding
    balance_check:
      accuracy: Verify implementation matches requirements
      efficiency: Ensure reasonable execution time
      adjustment: Re-plan future phases if needed
  last_session:
    id: session-000
    date: '2026-01-07'
    executor: GitHub Copilot
    ended_at: null
    checkpoint: null
  current_session:
    id: session-001
    started_at: '2026-01-07T14:00:00Z'
    executor: GitHub Copilot
  continuation_prompt: 'Continue CORTEX 6.0 Build Epic execution from the current
    position.


    1. Read .asif/AI-Learning/cortex6/source-of-truth/todo/00-TODO-CONTINUITY-TRACKER.yaml

    2. Find current_position

    3. Resume from the next NOT_STARTED or IN_PROGRESS item

    4. Update status as you work

    5. Commit checkpoints every 5 completed TODOs

    '
