# ==============================================================================
# CORTEX 6.0 BUILD EPIC - MASTER DEFINITION
# ==============================================================================
# Purpose: Build enhanced CORTEX from scratch with gradual capability handoff
# Executor: GitHub Copilot (until CORTEX TODO Manager is functional)
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-07
# 
# CRITICAL DESIGN: Each phase brings CORTEX to life progressively
# Each feature utilizes CORTEX infrastructure as it's built
# Audit logging is MANDATORY throughout (infrastructure exists)
# ==============================================================================

epic:
  id: CORTEX6-BUILD
  name: "CORTEX 6.0 Enhanced Build Epic"
  description: |
    Comprehensive epic to build the enhanced CORTEX from scratch. Designed for
    gradual development where each phase brings CORTEX capabilities to life.
    GitHub Copilot executes until CORTEX TODO Manager becomes functional,
    at which point control is handed off to CORTEX.
    
  owner: "Asif Hussain"
  executor: 
    initial: "GitHub Copilot"
    handoff_to: "CORTEX TODO Manager Orchestrator"
    handoff_trigger: "feat02-todo-orchestrator completion"
    
  version: "1.0.0"
  status: READY_FOR_EXECUTION
  created_date: "2026-01-07"
  target_completion: "2026-03-23"  # 74 days
  
  # ============================================================================
  # EXECUTION CONSTRAINTS
  # ============================================================================
  constraints:
    mandatory_audit_logging:
      enabled: true
      infrastructure: "src/orchestrators/audit_logger.py"
      categories:
        - STATE_MANAGEMENT
        - EXECUTION
        - MIDDLEWARE
        - RESPONSE
        - PERFORMANCE
        - SECURITY
        - VALIDATION
      enforcement: "Every operation MUST log to audit trail"
      
    tdd_enforcement:
      enabled: true
      rule: "Tests must fail before implementation"
      test_location: "tests/"
      
    holistic_review:
      enabled: true
      trigger: "End of each phase and feature"
      method: "Audit log trace analysis"
      failure_action: "IMMEDIATE_REMEDIATION unless ROI justifies deferral"
      
    incremental_execution:
      enabled: true
      max_lines_per_increment: 500
      checkpoint_frequency: 5  # tasks
      
  # ============================================================================
  # PROGRESS TRACKING
  # ============================================================================
  progress:
    overall: 0
    features_total: 8
    features_completed: 0
    phases_total: 32
    phases_completed: 0
    
  # ============================================================================
  # FEATURE SUMMARY (Execution Order)
  # ============================================================================
  features:
    - id: feat01-foundation
      name: "Foundation Layer"
      tier: 1
      priority: P0_CRITICAL
      estimated_days: 12
      dependencies: []
      enables: ["feat02-todo-orchestrator", "feat03-governance"]
      handoff_status: "Copilot executes"
      
    - id: feat02-todo-orchestrator
      name: "TODO Orchestrator (DAG)"
      tier: 1
      priority: P0_CRITICAL
      estimated_days: 14
      dependencies: ["feat01-foundation"]
      enables: ["feat04-core-orchestration", "HANDOFF"]
      handoff_status: "Copilot executes, then hands off to CORTEX"
      handoff_trigger: true  # THIS IS THE HANDOFF POINT
      
    - id: feat03-governance
      name: "4-Category Governance"
      tier: 1
      priority: P0_CRITICAL
      estimated_days: 10
      dependencies: ["feat01-foundation"]
      enables: ["feat04-core-orchestration"]
      handoff_status: "Copilot/CORTEX hybrid (after feat02)"
      
    - id: feat04-core-orchestration
      name: "Core Orchestration Layer"
      tier: 2
      priority: P0_CRITICAL
      estimated_days: 12
      dependencies: ["feat02-todo-orchestrator", "feat03-governance"]
      enables: ["feat05-resilience", "feat06-mcp"]
      handoff_status: "CORTEX executes"
      
    - id: feat05-resilience
      name: "Resilience & Performance"
      tier: 2
      priority: P1_HIGH
      estimated_days: 9
      dependencies: ["feat04-core-orchestration"]
      enables: ["feat07-integration"]
      handoff_status: "CORTEX executes"
      
    - id: feat06-mcp
      name: "MCP & Multi-Repo"
      tier: 2
      priority: P1_HIGH
      estimated_days: 14
      dependencies: ["feat04-core-orchestration"]
      enables: ["feat07-integration"]
      handoff_status: "CORTEX executes"
      
    - id: feat07-integration
      name: "Integration & Polish"
      tier: 3
      priority: P1_HIGH
      estimated_days: 18
      dependencies: ["feat05-resilience", "feat06-mcp"]
      enables: ["feat08-cleanup"]
      handoff_status: "CORTEX executes"
      
    - id: feat08-cleanup
      name: "Vacuum & Repository Cleanup"
      tier: 3
      priority: P2_MEDIUM
      estimated_days: 5
      dependencies: ["feat07-integration"]
      enables: []
      handoff_status: "CORTEX executes (enhanced Vacuum orchestrator)"

  # ============================================================================
  # SNOWBALL EXECUTION ORDER
  # ============================================================================
  snowball_strategy:
    description: |
      Features are designed for maximum snowball effect. Each completed feature
      unlocks capabilities that accelerate subsequent features.
      
    tiers:
      tier_1:
        name: "Foundation & Handoff Preparation"
        features: ["feat01-foundation", "feat02-todo-orchestrator", "feat03-governance"]
        parallel_opportunities:
          - "feat01-foundation THEN (feat02 || feat03) parallel"
        outcome: "CORTEX can self-manage work (handoff achieved)"
        
      tier_2:
        name: "Core Capabilities"
        features: ["feat04-core-orchestration", "feat05-resilience", "feat06-mcp"]
        parallel_opportunities:
          - "feat04 THEN (feat05 || feat06) parallel"
        outcome: "CORTEX has full orchestration, performance, MCP"
        
      tier_3:
        name: "Integration & Cleanup"
        features: ["feat07-integration", "feat08-cleanup"]
        parallel_opportunities: []
        outcome: "Repository clean, fully integrated, production-ready"

  # ============================================================================
  # SUCCESS CRITERIA
  # ============================================================================
  success_criteria:
    architecture:
      - "TODO Orchestrator supports DAG with >1000 nodes"
      - "State Manager handles concurrent writes (optimistic locking)"
      - "MCP Server responds to JSON-RPC 2.0 calls"
      - "Multi-repo operations work across 3+ repositories"
      
    governance:
      - "4-Category Governance Merger produces valid Unified Instruction Set"
      - "All 61 SKULL rules migrated and enforced via new system"
      - "Business Tier 0 override only works for COMPLIANCE rules"
      
    testing:
      - "All tests in single tests/ folder"
      - "80%+ overall coverage"
      - "90%+ core component coverage"
      
    performance:
      - "O(1) routing <5ms for 100 orchestrators"
      - "State persistence <100ms"
      - "Governance merge <50ms"
      
    cleanup:
      - "Repository structure clean and organized"
      - "No orphaned files or folders"
      - "Vacuum orchestrator enhanced for maximum reuse"

  # ============================================================================
  # AUDIT LOG ANALYSIS CHECKPOINTS
  # ============================================================================
  audit_checkpoints:
    phase_completion:
      trigger: "Every phase completion"
      analysis:
        - "Verify all operations logged"
        - "Check for ERROR/CRITICAL entries"
        - "Validate correlation IDs across operations"
        - "Measure performance metrics"
      success_criteria:
        - "Zero ERROR entries unresolved"
        - "All operations traceable via correlation_id"
        - "Performance within SLA"
      failure_action: "IMMEDIATE_REMEDIATION"
      
    feature_completion:
      trigger: "Every feature completion"
      analysis:
        - "Holistic audit trace review"
        - "Cross-component correlation analysis"
        - "Gap identification"
        - "Regression detection"
      success_criteria:
        - "All phase checkpoints passed"
        - "Feature tests green"
        - "No unresolved gaps"
      failure_action: "BLOCK_NEXT_FEATURE until resolved"
      
    handoff_checkpoint:
      trigger: "feat02-todo-orchestrator completion"
      analysis:
        - "TODO Manager operational"
        - "DAG operations functional"
        - "State persistence verified"
        - "Audit logging integrated"
      success_criteria:
        - "CORTEX can create and manage TODOs"
        - "Checkpoint/resume works"
        - "Rollback functional"
      failure_action: "DEFER_HANDOFF until criteria met"

# ==============================================================================
# CROSS-REFERENCES
# ==============================================================================
cross_references:
  source_of_truth: "00-CORTEX6-MASTER-SOURCE-OF-TRUTH.yaml"
  todo_reference: "todo/00-TODO-CONTINUITY-TRACKER.yaml"
  risk_registry: "risk/00-RISK-REGISTRY.yaml"
  features_folder: "features/"
  
# ==============================================================================
# VERSION CONTROL
# ==============================================================================
versioning:
  strategy: "Semantic versioning with feature gates"
  format: "MAJOR.MINOR.PATCH-FEATURE"
  example: "6.0.0-feat02-complete"
