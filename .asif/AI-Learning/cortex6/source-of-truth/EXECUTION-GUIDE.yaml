# ==============================================================================
# CORTEX 6.0 BUILD - EXECUTION GUIDE
# ==============================================================================
# Purpose: Instructions for GitHub Copilot to begin and continue execution
# Target: CORTEX 6.0 Enhanced Build Epic
# 
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-07
# ==============================================================================

# CRITICAL: READ THIS FIRST
# =========================
# This guide provides all instructions for GitHub Copilot to execute the
# CORTEX 6.0 Build Epic autonomously with proper continuity across sessions.

execution_guide:
  
  # ============================================================================
  # QUICK START
  # ============================================================================
  quick_start:
    step_1:
      action: "Read TODO tracker"
      command: "Read .asif/AI-Learning/cortex6/source-of-truth/todo/00-TODO-CONTINUITY-TRACKER.yaml"
      purpose: "Find current position"
      
    step_2:
      action: "Identify next task"
      method: "Find first NOT_STARTED or IN_PROGRESS task in current_position"
      
    step_3:
      action: "Load feature context"
      command: "Read features/{current_feature}/feature.yaml"
      purpose: "Get task implementation details"
      
    step_4:
      action: "Execute task"
      method: "Follow task implementation instructions"
      
    step_5:
      action: "Update tracker"
      method: "Mark task as COMPLETED or FAILED"
      
    step_6:
      action: "Commit checkpoint"
      method: "Every 5 tasks, update tracker and commit"
      
  # ============================================================================
  # MANDATORY RULES
  # ============================================================================
  mandatory_rules:
    
    audit_logging:
      rule: "ALL operations MUST be logged to audit trail"
      infrastructure: "src/orchestrators/audit_logger.py"
      how: |
        from src.orchestrators.audit_logger import get_audit_logger, AuditCategory, AuditLevel
        
        logger = get_audit_logger()
        logger.info(
            category=AuditCategory.EXECUTION,
            component="github_copilot",
            operation="task_execution",
            message="Executing task {task_id}",
            context={"task_id": task_id, "feature_id": feature_id},
            correlation_id="FEAT01-P1-001"
        )
      
    tdd_enforcement:
      rule: "Tests must FAIL before implementation (RED-GREEN-REFACTOR)"
      process:
        red: "Write failing test first"
        green: "Implement minimal code to pass"
        refactor: "Clean up while keeping tests green"
      validation: "Task with tdd_required=true MUST follow this"
      
    holistic_review:
      rule: "Review audit log trace at phase and feature completion"
      method: |
        1. Search audit logs for correlation_id pattern
        2. Check for ERROR or CRITICAL entries
        3. Validate all operations logged
        4. If gaps found: IMMEDIATE REMEDIATION
      exception: "Only defer if ROI justifies (must document reason)"
      
    incremental_execution:
      rule: "No single code change >500 lines"
      process: "Split large changes into multiple increments"
      
    checkpoint_frequency:
      rule: "Checkpoint every 5 completed tasks"
      method: "Update TODO tracker and git commit"
      
  # ============================================================================
  # SESSION CONTINUATION PROTOCOL
  # ============================================================================
  session_continuation:
    
    start_of_session:
      prompt: |
        Continue CORTEX 6.0 Build Epic from last checkpoint.
        
        1. Read: .asif/AI-Learning/cortex6/source-of-truth/todo/00-TODO-CONTINUITY-TRACKER.yaml
        2. Find: current_position
        3. Resume: Next NOT_STARTED or IN_PROGRESS task
        4. Execute with TDD and audit logging
        5. Update tracker as you progress
        
    end_of_session:
      checklist:
        - "Update current_position in TODO tracker"
        - "Mark in-progress task status"
        - "Git commit with message: 'checkpoint: {feature_id} {phase_id} {task_id}'"
        - "Log session end to audit"
        
    recovery_from_crash:
      method: |
        1. Read TODO tracker for last known position
        2. Check audit logs for last successful operation
        3. Resume from task after last success
        4. Re-execute any incomplete operations
        
  # ============================================================================
  # HANDOFF PROTOCOL
  # ============================================================================
  handoff_protocol:
    
    trigger: "feat02-todo-orchestrator Phase 4 Task 4.5 COMPLETED"
    
    validation:
      tests_must_pass:
        - "test_cortex_can_manage_own_todos"
        - "test_cortex_audit_trail"
        - "test_cortex_rollback_capability"
        
    handoff_steps:
      step_1:
        action: "Run handoff validation tests"
        command: "pytest tests/integration/test_cortex_self_management.py -v"
        
      step_2:
        action: "Update TODO tracker"
        changes:
          - field: "tracker.current_executor"
            value: "CORTEX TODO Manager"
          - field: "tracker.session_management.last_session.ended_at"
            value: "{timestamp}"
            
      step_3:
        action: "Log handoff event"
        audit:
          category: "EXECUTION"
          component: "handoff"
          operation: "copilot_to_cortex"
          message: "Handoff complete: GitHub Copilot → CORTEX TODO Manager"
          
      step_4:
        action: "CORTEX takes over"
        method: "CORTEX loads tracker and generates TODOs for feat03"
        
    fallback:
      if_validation_fails: "Continue with GitHub Copilot execution"
      
  # ============================================================================
  # FILE REFERENCE MAP
  # ============================================================================
  file_reference:
    
    source_of_truth:
      master: "00-CORTEX6-MASTER-SOURCE-OF-TRUTH.yaml"
      epic: "epic/00-CORTEX6-BUILD-EPIC.yaml"
      todo_tracker: "todo/00-TODO-CONTINUITY-TRACKER.yaml"
      risk_registry: "risk/00-RISK-REGISTRY.yaml"
      
    features:
      feat01: "features/feat01-foundation/feature.yaml"
      feat02: "features/feat02-todo-orchestrator/feature.yaml"
      feat03_to_08: "features/feat03-to-feat08/features-summary.yaml"
      
    implementation:
      state_manager: "src/database/state_manager.py"
      audit_logger: "src/orchestrators/audit_logger.py"
      trie_router: "src/orchestrators/routing/trie_router.py"
      dag: "src/orchestrators/core/dag.py"
      todo_orchestrator: "src/orchestrators/core/todo_orchestrator.py"
      
    tests:
      all_tests: "tests/"
      unit: "tests/unit/"
      integration: "tests/integration/"
      performance: "tests/performance/"
      governance: "tests/governance/"
      
  # ============================================================================
  # PROGRESS VISUALIZATION
  # ============================================================================
  progress_visualization:
    
    format: |
      ## 🧠 CORTEX 6.0 Build Progress
      
      **Epic:** CORTEX6-BUILD | **Executor:** {executor}
      
      ### Features Progress
      ```
      feat01-foundation        [████████░░░░░░░░░░░░] 40% (P1-P4)
      feat02-todo-orchestrator [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat03-governance        [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat04-core-orchestration[░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat05-resilience        [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat06-mcp               [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat07-integration       [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      feat08-cleanup           [░░░░░░░░░░░░░░░░░░░░]  0% (BLOCKED)
      ```
      
      ### Current Task
      **Feature:** {feature_id} | **Phase:** {phase_id} | **Task:** {task_id}
      
      **Status:** {status}
      
      ### Next Steps
      1. {next_step}
      
    update_frequency: "After each phase completion"
    
  # ============================================================================
  # EXAMPLE EXECUTION FLOW
  # ============================================================================
  example_execution:
    
    scenario: "Execute feat01-foundation Phase 1 Task 1.1"
    
    steps:
      - step: 1
        action: "Read task details"
        source: "features/feat01-foundation/feature.yaml"
        task:
          id: "1.1"
          name: "Create test folder structure"
          
      - step: 2
        action: "Start audit logging"
        code: |
          logger.info(
              category=AuditCategory.VALIDATION,
              component="test_infrastructure",
              operation="create_test_structure",
              message="Creating test folder structure",
              correlation_id="FEAT01-P1-001"
          )
          
      - step: 3
        action: "Execute implementation"
        commands:
          - "mkdir -p tests/unit tests/integration tests/performance tests/governance tests/fixtures"
          - "touch tests/__init__.py tests/unit/__init__.py ..."
          
      - step: 4
        action: "Validate"
        method: "Check all paths exist"
        
      - step: 5
        action: "Log completion"
        code: |
          logger.info(
              category=AuditCategory.VALIDATION,
              component="test_infrastructure",
              operation="create_test_structure",
              message="Test folder structure created successfully",
              correlation_id="FEAT01-P1-001"
          )
          
      - step: 6
        action: "Update tracker"
        changes:
          - "Mark task 1.1 as COMPLETED"
          - "Update current_position to task 1.2"

# ==============================================================================
# CONTINUATION PROMPT (COPY THIS)
# ==============================================================================
continuation_prompt: |
  # CORTEX 6.0 Build - Session Continuation
  
  Continue the CORTEX 6.0 Build Epic execution.
  
  ## Instructions
  1. Read `.asif/AI-Learning/cortex6/source-of-truth/todo/00-TODO-CONTINUITY-TRACKER.yaml`
  2. Find `current_position` to determine where to resume
  3. Load the feature YAML for implementation details
  4. Execute the next task following TDD (if required)
  5. Log ALL operations to audit trail
  6. Update tracker after each task
  7. Checkpoint (commit) every 5 tasks
  
  ## Mandatory
  - Audit logging for ALL operations
  - TDD for tasks with tdd_required=true
  - Holistic review at phase/feature completion
  
  ## If you reach the HANDOFF point (feat02 Phase 4 Task 4.5):
  - Run validation tests
  - Update tracker to switch executor to CORTEX
  - Log handoff completion
  
  Begin execution now.
