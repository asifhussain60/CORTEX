# CORTEX 6.0 Folder Structure Specification
# Machine-readable directory tree for greenfield build
# Version: 6.0.0 | Author: Asif Hussain

metadata:
  document_type: folder_structure_spec
  version: '6.0.0'
  purpose: 'Exact directory tree for empty folder CORTEX build'
  execution: 'GitHub Copilot creates all folders before file creation'

# ==============================================================================
# ROOT DIRECTORY STRUCTURE
# ==============================================================================

root_structure:
  name: 'CORTEX-6'
  type: directory
  children:
    
    # --------------------------------------------------------------------------
    # CORTEX BRAIN (4-Tier Memory System)
    # --------------------------------------------------------------------------
    - name: cortex-brain
      type: directory
      purpose: 'Long-term memory and governance'
      children:
        
        - name: tier0
          type: directory
          purpose: 'Governance rules (read-mostly)'
          children:
            - name: governance
              type: directory
              children:
                - name: core-rules.yaml
                  type: file
                  purpose: '61 SKULL rules migrated here'
                  template: governance_rules
                  
                - name: rule-schema.yaml
                  type: file
                  purpose: 'Rule definition schema'
                  template: rule_schema
                  
        - name: tier1
          type: directory
          purpose: 'Working memory (read-write)'
          children:
            - name: active-instruction-set.yaml
              type: file
              purpose: 'Current merged governance output'
              generated: true
              
            - name: active-context.json
              type: file
              purpose: 'Current execution context'
              generated: true
              
            - name: conversation-state.jsonl
              type: file
              purpose: 'Conversation history'
              generated: true
              
        - name: tier2
          type: directory
          purpose: 'Knowledge graph (learned patterns)'
          children:
            - name: knowledge-graph
              type: directory
              children:
                - name: patterns.yaml
                  type: file
                  purpose: 'Successful patterns from executions'
                  
                - name: lessons-learned.yaml
                  type: file
                  purpose: 'Failures to avoid'
                  
                - name: domain-expertise.yaml
                  type: file
                  purpose: 'Domain-specific knowledge'
                  
        - name: tier3
          type: directory
          purpose: 'Development context'
          children:
            - name: dev-context
              type: directory
              children:
                - name: current-plan.yaml
                  type: file
                  purpose: 'Active plan being executed'
                  generated: true
                  
                - name: execution-history.jsonl
                  type: file
                  purpose: 'Historical executions'
                  generated: true
                  
        - name: database
          type: directory
          purpose: 'SQLite databases'
          children:
            - name: cortex.db
              type: file
              purpose: 'Main SQLite database (WAL mode)'
              generated: true
              
            - name: cortex.db-wal
              type: file
              purpose: 'WAL file (auto-created)'
              generated: true
              
            - name: cortex.db-shm
              type: file
              purpose: 'Shared memory file (auto-created)'
              generated: true
              
        - name: config
          type: directory
          purpose: 'Configuration files'
          children:
            - name: master-orchestrator.yaml
              type: file
              purpose: 'Master orchestrator routing config'
              template: master_orch_config
              
    # --------------------------------------------------------------------------
    # SOURCE CODE
    # --------------------------------------------------------------------------
    - name: src
      type: directory
      purpose: 'All source code'
      children:
        
        - name: __init__.py
          type: file
          content: '"""CORTEX 6.0 - Cognitive Orchestration Runtime."""'
          
        - name: main.py
          type: file
          purpose: 'Entry point for CLI and terminal invocation'
          template: main_entry_point
          
        - name: orchestrators
          type: directory
          purpose: 'All orchestrator implementations'
          children:
            
            - name: __init__.py
              type: file
              content: '"""CORTEX Orchestrators."""'
              
            - name: core
              type: directory
              purpose: 'Core orchestration components'
              children:
                - name: __init__.py
                  type: file
                  
                - name: master_orchestrator.py
                  type: file
                  purpose: 'Entry point, routing, state machine'
                  template: master_orchestrator
                  lines_estimate: 400
                  
                - name: todo_orchestrator.py
                  type: file
                  purpose: 'DAG-based work tracking'
                  template: todo_orchestrator
                  lines_estimate: 350
                  
                - name: state_manager.py
                  type: file
                  purpose: 'SQLite persistence with WAL'
                  template: state_manager
                  lines_estimate: 300
                  
                - name: governance_merger.py
                  type: file
                  purpose: '4-category intelligent merging'
                  template: governance_merger
                  lines_estimate: 400
                  
            - name: workflows
              type: directory
              purpose: 'Workflow orchestrators (10+)'
              children:
                - name: __init__.py
                  type: file
                  
                - name: planning_orchestrator.py
                  type: file
                  purpose: 'Planning v5 workflows'
                  template: planning_orchestrator
                  
                - name: tdd_orchestrator.py
                  type: file
                  purpose: 'RED→GREEN→REFACTOR cycles'
                  template: tdd_orchestrator
                  
                - name: ado_orchestrator.py
                  type: file
                  purpose: 'Azure DevOps work items'
                  template: ado_orchestrator
                  
                - name: vacuum_orchestrator.py
                  type: file
                  purpose: 'Deep filesystem cleanup'
                  template: vacuum_orchestrator
                  
                - name: cleanup_orchestrator.py
                  type: file
                  purpose: 'Selective cleanup modes'
                  template: cleanup_orchestrator
                  
                - name: investigation_orchestrator.py
                  type: file
                  purpose: 'Root cause analysis'
                  template: investigation_orchestrator
                  
                - name: sanitization_orchestrator.py
                  type: file
                  purpose: 'PII/secret removal'
                  template: sanitization_orchestrator
                  
                - name: debug_orchestrator.py
                  type: file
                  purpose: 'Bug fixing workflows'
                  template: debug_orchestrator
                  
                - name: refinement_orchestrator.py
                  type: file
                  purpose: 'Code improvement'
                  template: refinement_orchestrator
                  
                - name: maintenance_orchestrator.py
                  type: file
                  purpose: '12-phase health check'
                  template: maintenance_orchestrator
                  
            - name: middleware
              type: directory
              purpose: 'Cross-cutting concerns'
              children:
                - name: __init__.py
                  type: file
                  
                - name: audit_logger.py
                  type: file
                  purpose: 'Runtime audit enforcement'
                  template: audit_logger
                  
                - name: resource_limiter.py
                  type: file
                  purpose: 'Quotas and limits'
                  template: resource_limiter
                  
                - name: silent_executor.py
                  type: file
                  purpose: 'Silent execution mode'
                  template: silent_executor
                  
            - name: routing
              type: directory
              purpose: 'Pattern routing'
              children:
                - name: __init__.py
                  type: file
                  
                - name: trie_router.py
                  type: file
                  purpose: 'O(1) Trie-based pattern matching'
                  template: trie_router
                  
        - name: mcp
          type: directory
          purpose: 'MCP Server implementation'
          children:
            - name: __init__.py
              type: file
              
            - name: server.py
              type: file
              purpose: 'JSON-RPC 2.0 MCP Server'
              template: mcp_server
              
    # --------------------------------------------------------------------------
    # TESTS (Single Folder)
    # --------------------------------------------------------------------------
    - name: tests
      type: directory
      purpose: 'ALL tests in single location'
      children:
        
        - name: __init__.py
          type: file
          
        - name: conftest.py
          type: file
          purpose: 'Shared fixtures for all tests'
          template: test_conftest
          
        - name: unit
          type: directory
          purpose: 'Unit tests (component isolation)'
          children:
            - name: __init__.py
              type: file
              
            - name: test_master_orchestrator.py
              type: file
              
            - name: test_todo_orchestrator.py
              type: file
              
            - name: test_state_manager.py
              type: file
              
            - name: test_governance_merger.py
              type: file
              
            - name: test_pattern_router.py
              type: file
              
            - name: test_audit_logger.py
              type: file
              
            - name: orchestrators
              type: directory
              children:
                - name: __init__.py
                  type: file
                  
                - name: test_planning_orchestrator.py
                  type: file
                  
                - name: test_tdd_orchestrator.py
                  type: file
                  
        - name: integration
          type: directory
          purpose: 'Integration and E2E tests'
          children:
            - name: __init__.py
              type: file
              
            - name: test_end_to_end.py
              type: file
              
            - name: test_multi_repo.py
              type: file
              
            - name: test_governance_integration.py
              type: file
              
        - name: performance
          type: directory
          purpose: 'Performance benchmarks'
          children:
            - name: __init__.py
              type: file
              
            - name: test_routing_performance.py
              type: file
              
            - name: test_dag_performance.py
              type: file
              
        - name: governance
          type: directory
          purpose: 'Governance rule validation'
          children:
            - name: __init__.py
              type: file
              
            - name: test_merge_algorithm.py
              type: file
              
            - name: test_conflict_resolution.py
              type: file
              
        - name: fixtures
          type: directory
          purpose: 'Test data and fixtures'
          children:
            - name: sample_governance_rules.yaml
              type: file
              
            - name: sample_business_tier0.yaml
              type: file
              
            - name: sample_dag.json
              type: file
              
    # --------------------------------------------------------------------------
    # GITHUB CONFIGURATION
    # --------------------------------------------------------------------------
    - name: .github
      type: directory
      children:
        - name: prompts
          type: directory
          children:
            - name: CORTEX.prompt.md
              type: file
              purpose: 'Entry point for GitHub Copilot'
              template: cortex_prompt
              
    # --------------------------------------------------------------------------
    # ROOT FILES
    # --------------------------------------------------------------------------
    - name: repos.yaml
      type: file
      purpose: 'Multi-repo registry'
      template: repos_config
      
    - name: requirements.txt
      type: file
      purpose: 'Python dependencies'
      template: requirements
      
    - name: pyproject.toml
      type: file
      purpose: 'Project configuration'
      template: pyproject
      
    - name: pytest.ini
      type: file
      purpose: 'Pytest configuration'
      template: pytest_config
      
    - name: README.md
      type: file
      purpose: 'Project documentation'
      template: readme
      
    - name: .gitignore
      type: file
      purpose: 'Git ignore patterns'
      template: gitignore

# ==============================================================================
# FOLDER CREATION ORDER
# ==============================================================================

creation_order:
  description: 'Create folders in this order to satisfy dependencies'
  phases:
    - phase: 1
      name: 'Root directories'
      folders:
        - cortex-brain
        - src
        - tests
        - .github
        
    - phase: 2
      name: 'Second level'
      folders:
        - cortex-brain/tier0
        - cortex-brain/tier1
        - cortex-brain/tier2
        - cortex-brain/tier3
        - cortex-brain/database
        - cortex-brain/config
        - src/orchestrators
        - src/mcp
        - tests/unit
        - tests/integration
        - tests/performance
        - tests/governance
        - tests/fixtures
        - .github/prompts
        
    - phase: 3
      name: 'Third level'
      folders:
        - cortex-brain/tier0/governance
        - cortex-brain/tier2/knowledge-graph
        - cortex-brain/tier3/dev-context
        - src/orchestrators/core
        - src/orchestrators/workflows
        - src/orchestrators/middleware
        - src/orchestrators/routing
        - tests/unit/orchestrators

# ==============================================================================
# TOTAL STATISTICS
# ==============================================================================

statistics:
  total_directories: 32
  total_files: 58
  source_files: 24
  test_files: 18
  config_files: 10
  documentation_files: 6
  estimated_total_lines: 8000
