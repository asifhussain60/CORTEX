# =============================================================================
# APPENDIX: DESIGN DECISIONS
# =============================================================================

design_decisions:
  why_sqlite_not_postgres:
    rationale: "Local-first, zero-configuration, ACID guarantees, WAL mode for concurrency"
    tradeoff: "No distributed deployment, but CORTEX is local-first by design"
    
  why_trie_not_embeddings:
    rationale: "Deterministic, <5ms latency, no model loading overhead, explainable"
    tradeoff: "Less flexible than semantic embeddings, but predictability > flexibility"
    
  why_optimistic_locking:
    rationale: "High concurrency, low contention, simple implementation"
    tradeoff: "Retries on conflict, but 99%+ success rate in practice"
    
  why_jsonl_not_structured_logs:
    rationale: "Append-only, parseable, immutable, standard tooling (jq, grep)"
    tradeoff: "No query optimization, but logs are for audit, not analytics"
    
  why_mcp_not_custom_protocol:
    rationale: "Standard protocol, GitHub Copilot native support, introspectable, type-safe"
    tradeoff: "Limited by MCP spec, but spec covers 99% of use cases"

