# =============================================================================
# CORE COMPONENTS
# =============================================================================

core_components:
  
  # ---------------------------------------------------------------------------
  # Component 1: Master Orchestrator v2
  # ---------------------------------------------------------------------------
  
  master_orchestrator_v2:
    name: "Master Orchestrator v2"
    version: "2.0.0"
    location: "src/orchestrators/core/master_orchestrator_v2.py"
    
    responsibilities:
      - "Accept user requests from GitHub Copilot or CLI"
      - "Route to appropriate child orchestrator via Trie router"
      - "Initialize TODO Orchestrator for new work"
      - "Coordinate multi-orchestrator workflows"
      - "Handle failures and trigger rollbacks"
      - "Enforce governance rules pre-execution"
      
    state_machine:
      diagram: |
        ```mermaid
        stateDiagram-v2
            [*] --> IDLE
            IDLE --> ROUTING: User Request
            ROUTING --> ORCHESTRATOR_FOUND: Pattern Match
            ROUTING --> LLM_CLASSIFY: No Match
            LLM_CLASSIFY --> ORCHESTRATOR_FOUND: Confidence ≥0.7
            LLM_CLASSIFY --> ERROR: Confidence <0.7
            ORCHESTRATOR_FOUND --> LOADING: Load Orchestrator
            LOADING --> EXECUTING: Orchestrator Ready
            LOADING --> ERROR: Load Failed
            EXECUTING --> CHECKPOINTING: Task Complete
            CHECKPOINTING --> EXECUTING: More Work
            CHECKPOINTING --> COMPLETED: All Done
            EXECUTING --> FAILED: Error
            FAILED --> RETRYING: Retry Count < Max
            FAILED --> ROLLBACK: Retry Exhausted
            RETRYING --> EXECUTING
            ROLLBACK --> IDLE
            COMPLETED --> IDLE
            ERROR --> IDLE
        ```
      
      states:
        IDLE:
          description: "Waiting for user request"
          entry_action: "Load registry, check database health"
          
        ROUTING:
          description: "Matching request to orchestrator pattern"
          actions:
            - "Normalize user input"
            - "Check exact match cache (O(1))"
            - "Traverse prefix trie (O(k))"
            - "Fallback to LLM if no match"
            
        ORCHESTRATOR_FOUND:
          description: "Orchestrator identified"
          actions:
            - "Validate orchestrator manifest"
            - "Check dependencies available"
            - "Initialize TODO graph if needed"
            
        LOADING:
          description: "Loading orchestrator module"
          actions:
            - "Lazy load orchestrator Python module"
            - "Catch ImportError gracefully"
            - "Mark orchestrator UNAVAILABLE on failure"
            
        EXECUTING:
          description: "Orchestrator executing work"
          actions:
            - "Execute next ready task from TODO graph"
            - "Monitor resource usage (memory, CPU, time)"
            - "Log progress to audit log"
            
        CHECKPOINTING:
          description: "Saving execution state"
          actions:
            - "Persist TODO graph to database"
            - "Update task status (IN_PROGRESS → COMPLETED)"
            - "Trigger dependent tasks (mark READY)"
            
        FAILED:
          description: "Task failed"
          actions:
            - "Log failure to audit log"
            - "Increment retry count"
            - "Decide: RETRY or ROLLBACK"
            
        RETRYING:
          description: "Retrying failed task"
          actions:
            - "Wait exponential backoff"
            - "Reset task to PENDING"
            - "Re-execute"
            
        ROLLBACK:
          description: "Rolling back to last checkpoint"
          actions:
            - "Load last successful checkpoint"
            - "Mark failed tasks BLOCKED"
            - "Notify user of failure"
            
        COMPLETED:
          description: "All work complete"
          actions:
            - "Generate final summary"
            - "Cleanup resources"
            - "Return to IDLE"
    
    architecture_diagram: |
      ```mermaid
      graph LR
          subgraph "Master Orchestrator v2"
              Router[Trie Pattern Router]
              Loader[Orchestrator Loader]
              Engine[Execution Engine]
              State[State Manager]
          end
          
          Request[User Request] --> Router
          Router --> Loader
          Loader --> Engine
          Engine --> State
          State --> DB[(Database)]
          Engine --> TODO[TODO Orchestrator]
          TODO --> DB
          
          Engine --> Child1[Planning v7]
          Engine --> Child2[Review v2]
          Engine --> ChildN[Custom]
      ```
    
    interfaces:
      input:
        - "User request (natural language string)"
        - "Orchestrator hints (optional, e.g., '@planning')"
        
      output:
        - "Execution result (Dict[status, data, errors])"
        - "Progress updates (via event emitter)"
        
    dependencies:
      - "TODO Orchestrator (graph tracker)"
      - "Trie Pattern Router"
      - "Orchestrator Registry"
      - "State Manager"
      - "Audit Logger"
      
    configuration:
      file: "cortex-brain/config/master-orchestrator-v2.yaml"
      settings:
        routing:
          exact_match_cache_size: 1000
          trie_max_depth: 5
          llm_fallback_timeout: 10
          llm_confidence_threshold: 0.7
          
        execution:
          max_concurrent_orchestrators: 5
          task_timeout: 3600
          checkpoint_frequency: 5
          retry_max: 3
          retry_backoff_base: 2
          
        resources:
          max_memory_mb: 2048
          max_cpu_percent: 80

  # ---------------------------------------------------------------------------
  # Component 2: TODO Orchestrator (DAG Work Tracker)
  # ---------------------------------------------------------------------------
  
  todo_orchestrator:
    name: "TODO Orchestrator"
    version: "1.0.0"
    location: "src/orchestrators/core/todo_orchestrator.py"
    
    purpose: |
      Graph-based work tracker that maintains a directed acyclic graph (DAG)
      of all tasks. Enables resumable execution, dependency tracking, and
      parallel execution opportunities.
    
    dag_structure_diagram: |
      ```mermaid
      graph TD
          subgraph "TODO DAG Example"
              T1[Task 1: Initialize<br/>STATUS: COMPLETED]
              T2[Task 2: Load Config<br/>STATUS: COMPLETED]
              T3[Task 3: Validate Schema<br/>STATUS: COMPLETED]
              T4[Task 4: Process Files<br/>STATUS: IN_PROGRESS]
              T5[Task 5: Run Tests<br/>STATUS: BLOCKED]
              T6[Task 6: Generate Docs<br/>STATUS: READY]
              T7[Task 7: Commit Changes<br/>STATUS: PENDING]
              T8[Task 8: Cleanup<br/>STATUS: PENDING]
          end
          
          T1 --> T2
          T2 --> T3
          T3 --> T4
          T3 --> T6
          T4 --> T5
          T4 --> T7
          T6 --> T7
          T5 --> T8
          T7 --> T8
          
          style T1 fill:#4CAF50
          style T2 fill:#4CAF50
          style T3 fill:#4CAF50
          style T4 fill:#FFC107
          style T5 fill:#9E9E9E
          style T6 fill:#2196F3
          style T7 fill:#E0E0E0
          style T8 fill:#E0E0E0
      ```
      
      Legend:
      - Green (COMPLETED): Task finished successfully
      - Yellow (IN_PROGRESS): Currently executing
      - Blue (READY): Dependencies met, ready to execute
      - Gray (BLOCKED): Dependencies failed or incomplete
      - Light Gray (PENDING): Waiting for dependencies
    
    data_model:
      task_node:
        schema:
          task_id: "UUID (primary key)"
          orchestrator_id: "String (which orchestrator executes)"
          task_name: "String (human-readable name)"
          status: "Enum: PENDING, READY, IN_PROGRESS, COMPLETED, FAILED, BLOCKED, SKIPPED"
          dependencies: "List[task_id] (must complete first)"
          dependents: "List[task_id] (blocked by this task)"
          estimated_effort_hours: "Integer"
          actual_effort_hours: "Integer (nullable)"
          start_time: "Timestamp (nullable)"
          end_time: "Timestamp (nullable)"
          error_message: "String (nullable, for FAILED)"
          retry_count: "Integer (default 0)"
          max_retries: "Integer (default 3)"
          metadata_json: "JSON (orchestrator-specific data)"
          
        table_ddl: |
          CREATE TABLE todo_tasks (
              task_id TEXT PRIMARY KEY,
              orchestrator_id TEXT NOT NULL,
              task_name TEXT NOT NULL,
              status TEXT NOT NULL CHECK(status IN (
                  'PENDING', 'READY', 'IN_PROGRESS', 'COMPLETED', 
                  'FAILED', 'BLOCKED', 'SKIPPED'
              )),
              dependencies_json TEXT NOT NULL DEFAULT '[]',
              dependents_json TEXT NOT NULL DEFAULT '[]',
              estimated_effort_hours INTEGER NOT NULL,
              actual_effort_hours INTEGER,
              start_time TEXT,
              end_time TEXT,
              error_message TEXT,
              retry_count INTEGER NOT NULL DEFAULT 0,
              max_retries INTEGER NOT NULL DEFAULT 3,
              metadata_json TEXT NOT NULL DEFAULT '{}',
              created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              version INTEGER NOT NULL DEFAULT 1
          );
          
          CREATE INDEX idx_status ON todo_tasks(status);
          CREATE INDEX idx_orchestrator ON todo_tasks(orchestrator_id);
          CREATE INDEX idx_start_time ON todo_tasks(start_time);
      
      edge:
        schema:
          from_task: "UUID (source task)"
          to_task: "UUID (destination task)"
          dependency_type: "Enum: HARD (blocking), SOFT (preferred order)"
          
        table_ddl: |
          CREATE TABLE todo_edges (
              from_task TEXT NOT NULL,
              to_task TEXT NOT NULL,
              dependency_type TEXT NOT NULL CHECK(dependency_type IN ('HARD', 'SOFT')),
              created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              PRIMARY KEY (from_task, to_task),
              FOREIGN KEY (from_task) REFERENCES todo_tasks(task_id) ON DELETE CASCADE,
              FOREIGN KEY (to_task) REFERENCES todo_tasks(task_id) ON DELETE CASCADE
          );
          
          CREATE INDEX idx_from_task ON todo_edges(from_task);
          CREATE INDEX idx_to_task ON todo_edges(to_task);
      
      checkpoint:
        schema:
          checkpoint_id: "UUID (primary key)"
          graph_snapshot_json: "JSON (full graph state)"
          completed_task_count: "Integer"
          total_task_count: "Integer"
          completion_percentage: "Float"
          timestamp: "Timestamp"
          
        table_ddl: |
          CREATE TABLE todo_checkpoints (
              checkpoint_id TEXT PRIMARY KEY,
              graph_snapshot_json TEXT NOT NULL,
              completed_task_count INTEGER NOT NULL,
              total_task_count INTEGER NOT NULL,
              completion_percentage REAL NOT NULL,
              created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          
          CREATE INDEX idx_checkpoint_timestamp ON todo_checkpoints(created_at DESC);
    
    operations:
      add_task:
        signature: "add_task(orchestrator_id: str, task_name: str, dependencies: List[str], estimated_hours: int) -> str"
        description: "Add new task to graph with dependencies"
        returns: "task_id (UUID)"
        side_effects:
          - "Validates dependencies exist"
          - "Detects circular dependencies"
          - "Sets status to PENDING or READY (if no dependencies)"
          
      get_ready_tasks:
        signature: "get_ready_tasks() -> List[Dict]"
        description: "Return all tasks with status=READY (dependencies met)"
        returns: "List of task dictionaries"
        algorithm: |
          1. SELECT tasks WHERE status = 'READY'
          2. ORDER BY estimated_effort_hours ASC (shortest first)
          3. LIMIT to max_concurrent_orchestrators setting
          
      mark_complete:
        signature: "mark_complete(task_id: str, actual_hours: int) -> None"
        description: "Mark task complete, update dependents"
        side_effects:
          - "Set status = COMPLETED, end_time = now, actual_effort_hours"
          - "For each dependent: Check if all dependencies COMPLETED"
          - "If all dependencies met: Set dependent status = READY"
          - "Create checkpoint every 5 completions"
          
      mark_failed:
        signature: "mark_failed(task_id: str, error: str, retry: bool = True) -> None"
        description: "Mark task failed, optionally retry"
        side_effects:
          - "Set status = FAILED, error_message"
          - "Increment retry_count"
          - "If retry_count < max_retries AND retry=True: Set status = PENDING"
          - "Else: Set status = BLOCKED, block all dependents"
          
      detect_circular_dependencies:
        signature: "detect_circular_dependencies() -> List[List[str]]"
        description: "Validate graph is acyclic"
        algorithm: "Depth-First Search with cycle detection"
        complexity: "O(V + E) where V=tasks, E=edges"
        returns: "List of cycles (empty if acyclic)"
        
      get_progress:
        signature: "get_progress() -> Dict[str, Any]"
        description: "Calculate completion percentage"
        returns: |
          {
            "completed_tasks": 15,
            "total_tasks": 40,
            "percentage": 37.5,
            "status_breakdown": {
              "COMPLETED": 15,
              "IN_PROGRESS": 2,
              "READY": 5,
              "PENDING": 15,
              "FAILED": 2,
              "BLOCKED": 1
            },
            "critical_path_remaining_hours": 24
          }
          
      resume_from_checkpoint:
        signature: "resume_from_checkpoint() -> List[Dict]"
        description: "Load graph from last checkpoint, return ready tasks"
        algorithm: |
          1. SELECT latest checkpoint from todo_checkpoints
          2. Load graph_snapshot_json
          3. Mark all IN_PROGRESS tasks → PENDING (retry)
          4. Re-run dependency resolution
          5. Return get_ready_tasks()
    
    resume_behavior:
      on_breakage:
        description: "Master Orchestrator resumes execution after failure"
        flow_diagram: |
          ```mermaid
          sequenceDiagram
              participant User
              participant Master
              participant TODO
              participant DB
              participant Executor
              
              Note over Master: Orchestrator crashes mid-execution
              User->>Master: Resume execution
              Master->>TODO: resume_from_checkpoint()
              TODO->>DB: Load latest checkpoint
              DB-->>TODO: Graph snapshot
              TODO->>TODO: Mark IN_PROGRESS → PENDING
              TODO->>TODO: Re-resolve dependencies
              TODO-->>Master: List of READY tasks
              Master->>Executor: Execute next task
              Note over Executor: Silent execution (no history narration)
              Executor->>TODO: mark_complete(task_id)
              TODO->>DB: Update task status
              TODO->>Master: Progress: 16/40 (40%)
              Master->>User: ▓▓▓▓░░░░░░ 40%
          ```
        
        no_chatty_updates:
          rule: "ONLY show progress bar, NO narration"
          example_correct: "▓▓▓▓░░░░░░ 40% | Task 16/40"
          example_incorrect: "Previously I completed tasks 1-15... Now doing task 16..."

  # ---------------------------------------------------------------------------
  # Component 3: Trie Pattern Router (O(1) Routing)
  # ---------------------------------------------------------------------------
  
  trie_pattern_router:
    name: "Trie Pattern Router"
    version: "1.0.0"
    location: "src/orchestrators/routing/trie_pattern_router.py"
    
    purpose: |
      Replace O(n) linear regex scan with O(1) hash lookup + O(k) trie traversal
      for pattern matching. Supports 100+ orchestrators without routing bottleneck.
    
    architecture_diagram: |
      ```mermaid
      graph LR
          Input[User Request] --> Normalize[Normalize<br/>lowercase, trim]
          Normalize --> Cache{Exact Match<br/>Cache?}
          Cache -->|Hit| Return[Return Orchestrator]
          Cache -->|Miss| Trie{Prefix Trie<br/>Match?}
          Trie -->|Found| CacheStore[Cache Result]
          Trie -->|Not Found| Regex[Regex Fallback<br/>O(n)]
          CacheStore --> Return
          Regex -->|Found| CacheStore
          Regex -->|Not Found| LLM[LLM Classifier<br/>Confidence ≥0.7]
          LLM --> CacheStore
          
          style Cache fill:#4CAF50
          style Trie fill:#2196F3
          style Regex fill:#FFC107
          style LLM fill:#FF9800
      ```
    
    data_structures:
      exact_match_cache:
        type: "Dict[str, str]"
        description: "Hash table for exact pattern matches"
        example: "{'plan user auth': 'planning_v5', 'tdd email': 'tdd_v2'}"
        complexity: "O(1) lookup"
        
      prefix_trie:
        type: "TrieNode"
        description: "Trie for prefix patterns"
        structure: |
          class TrieNode:
              children: Dict[str, TrieNode]
              orchestrator_id: Optional[str]
              is_end: bool
              priority: int
        complexity: "O(k) where k = input length"
        
      regex_patterns:
        type: "List[Tuple[Pattern, str, int]]"
        description: "Fallback regex patterns with priority"
        example: "[(r'^(plan|create a plan)', 'planning_v5', 10)]"
        complexity: "O(n) worst case, rare"
    
    routing_algorithm:
      pseudo_code: |
        def route(user_input: str) -> str:
            # Step 1: Normalize
            normalized = user_input.lower().strip()
            
            # Step 2: Check exact match cache (O(1))
            if normalized in exact_match_cache:
                return exact_match_cache[normalized]
            
            # Step 3: Traverse prefix trie (O(k))
            result = trie.search_prefix(normalized)
            if result:
                exact_match_cache[normalized] = result  # Cache for future
                return result
            
            # Step 4: Regex fallback (O(n), rare)
            for pattern, orch_id, priority in regex_patterns:
                if pattern.match(normalized):
                    exact_match_cache[normalized] = orch_id
                    return orch_id
            
            # Step 5: LLM classifier (timeout 10s)
            return llm_classify(user_input, confidence_threshold=0.7)
    
    performance_benchmarks:
      target_100_orchestrators:
        cache_hit: "<1ms (99% of requests)"
        trie_search: "<5ms (0.9% of requests)"
        regex_fallback: "<20ms (0.1% of requests)"
        
      target_1000_orchestrators:
        cache_hit: "<1ms (99% of requests)"
        trie_search: "<10ms (0.9% of requests)"
        regex_fallback: "<50ms (0.1% of requests)"
    
    cache_management:
      size_limit: 10000
      eviction_policy: "LRU (Least Recently Used)"
      invalidation: "On orchestrator registration/deregistration"

  # ---------------------------------------------------------------------------
  # Component 4: Audit Logger (Mandatory Logging)
  # ---------------------------------------------------------------------------
  
  audit_logger:
    name: "Audit Logger"
    version: "2.0.0"
    location: "src/orchestrators/middleware/audit_logger.py"
    
    purpose: |
      Mandatory audit logging for ALL orchestrator operations. Pre-commit hook
      enforcement prevents bypassing. JSONL format for append-only, parseable logs.
    
    log_schema:
      file_format: "JSONL (JSON Lines)"
      file_location: "cortex-brain/audit-logs/{YYYYMMDD}_audit.jsonl"
      rotation: "Daily (new file per day)"
      
      entry_schema:
        timestamp: "ISO8601 (e.g., 2026-01-07T15:30:00.123Z)"
        log_id: "UUID (unique per entry)"
        orchestrator_id: "String (e.g., 'planning_v5')"
        operation: "Enum: FILE_CREATE, FILE_MODIFY, FILE_DELETE, TASK_START, TASK_COMPLETE, RULE_CHECK"
        user: "String (system username)"
        repo_id: "String (multi-repo context)"
        file_path: "String (nullable, for file operations)"
        rule_checks: "List[{rule_id, status, details}]"
        violations: "List[{rule_id, severity, file, line, message}]"
        status: "Enum: PASS, WARN, BLOCKED"
        metadata: "Dict (orchestrator-specific data)"
        
      example_entry: |
        {
          "timestamp": "2026-01-07T15:30:00.123Z",
          "log_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
          "orchestrator_id": "planning_v5",
          "operation": "FILE_CREATE",
          "user": "asifhussain",
          "repo_id": "frontend-app",
          "file_path": "cortex-brain/documents/planning/active/user-auth-epic/00-user-auth-epic.md",
          "rule_checks": [
            {"rule_id": "MARKDOWN_GENERATION_BLOCK", "status": "BLOCKED", "details": "Attempting to create .md file during execution"}
          ],
          "violations": [
            {"rule_id": "MARKDOWN_GENERATION_BLOCK", "severity": "blocked", "file": "00-user-auth-epic.md", "line": null, "message": "Markdown generation not allowed during execution (CR-010)"}
          ],
          "status": "BLOCKED",
          "metadata": {"epic_name": "user-auth-epic", "phase": 1}
        }
    
    enforcement_hooks:
      pre_file_create:
        description: "Log before file creation, validate governance rules"
        actions:
          - "Check MARKDOWN_GENERATION_BLOCK rule"
          - "Check FILE_ORGANIZATION rules"
          - "Log to audit log"
          - "Block if violations with severity=BLOCKED"
          
      pre_file_modify:
        description: "Log before file modification, run static analysis"
        actions:
          - "Run mypy, pylint, pydocstyle if Python file"
          - "Log static analysis results"
          - "Block if critical violations"
          
      pre_git_commit:
        description: "Validate audit log completeness before commit"
        implementation: ".git/hooks/pre-commit"
        logic: |
          #!/usr/bin/env python3
          import json, sys
          from pathlib import Path
          from datetime import datetime
          
          # Get staged files
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          
          # Load today's audit log
          today = datetime.now().strftime('%Y%m%d')
          audit_log = Path(f'cortex-brain/audit-logs/{today}_audit.jsonl')
          
          if not audit_log.exists():
              print(f"❌ COMMIT BLOCKED: No audit log found for today ({today})")
              sys.exit(1)
          
          # Parse audit log
          logged_files = set()
          blocked_violations = []
          
          for line in audit_log.read_text().splitlines():
              entry = json.loads(line)
              if entry.get('file_path'):
                  logged_files.add(entry['file_path'])
              if entry['status'] == 'BLOCKED':
                  blocked_violations.append(entry)
          
          # Check all staged files have audit entries
          for file in staged:
              if file not in logged_files:
                  print(f"❌ COMMIT BLOCKED: File '{file}' not in audit log")
                  sys.exit(1)
          
          # Check no blocked violations
          if blocked_violations:
              print(f"❌ COMMIT BLOCKED: {len(blocked_violations)} blocked violations")
              for v in blocked_violations:
                  print(f"  - {v['rule_checks'][0]['rule_id']}: {v['file_path']}")
              sys.exit(1)
          
          print("✅ Audit log validation passed")
          sys.exit(0)
    
    query_api:
      purpose: "Query audit logs for analysis, debugging, compliance"
      
      operations:
        - operation: "get_violations(severity='blocked', since=datetime)"
          description: "Get all violations with specific severity"
          
        - operation: "get_orchestrator_activity(orchestrator_id, since=datetime)"
          description: "Get all operations for specific orchestrator"
          
        - operation: "get_file_history(file_path)"
          description: "Get all operations on specific file"
          
        - operation: "get_rule_violations(rule_id, since=datetime)"
          description: "Get all violations of specific rule"

  # ---------------------------------------------------------------------------
  # Component 5: State Manager (Concurrent State with Optimistic Locking)
  # ---------------------------------------------------------------------------
  
  state_manager:
    name: "State Manager"
    version: "2.0.0"
    location: "src/orchestrators/state/state_manager.py"
    
    purpose: |
      Manage orchestrator state with concurrent write support via optimistic
      locking. Replaces JSON files with SQLite database for ACID guarantees.
    
    database_schema:
      database_file: "cortex-brain/database/cortex_state.db"
      wal_mode: true
      
      tables:
        orchestrator_state:
          ddl: |
            CREATE TABLE orchestrator_state (
                state_id TEXT PRIMARY KEY,
                orchestrator_id TEXT NOT NULL,
                repo_id TEXT,
                state_key TEXT NOT NULL,
                state_value_json TEXT NOT NULL,
                version INTEGER NOT NULL DEFAULT 1,
                last_modified_by TEXT NOT NULL,
                last_modified_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
                created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
                UNIQUE(orchestrator_id, repo_id, state_key)
            );
            
            CREATE INDEX idx_orchestrator_state ON orchestrator_state(orchestrator_id, repo_id);
            CREATE INDEX idx_state_version ON orchestrator_state(version);
        
        execution_history:
          ddl: |
            CREATE TABLE execution_history (
                execution_id TEXT PRIMARY KEY,
                orchestrator_id TEXT NOT NULL,
                repo_id TEXT,
                start_time TEXT NOT NULL,
                end_time TEXT,
                status TEXT NOT NULL CHECK(status IN ('RUNNING', 'COMPLETED', 'FAILED', 'ABORTED')),
                input_request TEXT NOT NULL,
                output_result_json TEXT,
                error_message TEXT,
                created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
            );
            
            CREATE INDEX idx_execution_orchestrator ON execution_history(orchestrator_id);
            CREATE INDEX idx_execution_status ON execution_history(status);
            CREATE INDEX idx_execution_time ON execution_history(start_time DESC);
    
    optimistic_locking:
      algorithm: |
        def update_state(orchestrator_id: str, state_key: str, new_value: dict) -> None:
            max_retries = 3
            retry_count = 0
            
            while retry_count < max_retries:
                # Read current state + version
                current = db.execute(
                    "SELECT state_value_json, version FROM orchestrator_state WHERE orchestrator_id=? AND state_key=?",
                    (orchestrator_id, state_key)
                ).fetchone()
                
                if not current:
                    # Insert new state (version=1)
                    db.execute(
                        "INSERT INTO orchestrator_state (state_id, orchestrator_id, state_key, state_value_json, version, last_modified_by) VALUES (?, ?, ?, ?, 1, ?)",
                        (uuid.uuid4(), orchestrator_id, state_key, json.dumps(new_value), get_current_user())
                    )
                    db.commit()
                    return
                
                current_value, current_version = current
                
                # Attempt update with version check
                result = db.execute(
                    "UPDATE orchestrator_state SET state_value_json=?, version=version+1, last_modified_by=?, last_modified_at=CURRENT_TIMESTAMP WHERE orchestrator_id=? AND state_key=? AND version=?",
                    (json.dumps(new_value), get_current_user(), orchestrator_id, state_key, current_version)
                )
                
                if result.rowcount == 1:
                    db.commit()
                    return  # Success
                
                # Version conflict - retry
                retry_count += 1
                time.sleep(0.1 * (2 ** retry_count))  # Exponential backoff
            
            raise ConcurrencyError(f"Failed to update state after {max_retries} retries (version conflict)")
      
      benefits:
        - "No data loss (version conflicts detected)"
        - "Automatic retry (exponential backoff)"
        - "ACID guarantees (SQLite transactions)"
        - "Concurrent reads (WAL mode)"

  # ---------------------------------------------------------------------------
  # Component 6: MCP Server (Model Context Protocol) - NEW
  # ---------------------------------------------------------------------------
  
  mcp_server:
    name: "MCP Server"
    version: "1.0.0"
    location: "src/mcp/mcp_server.py"
    
    purpose: |
      Standardize orchestrator interfaces via Model Context Protocol (MCP).
      Enable GitHub Copilot to discover and invoke CORTEX capabilities via
      standard JSON-RPC protocol over stdio.
    
    protocol:
      transport: "stdio (standard input/output)"
      encoding: "JSON-RPC 2.0"
      message_format: "One JSON object per line (JSONL)"
      
    mcp_capabilities:
      tools:
        description: "Orchestrators exposed as MCP tools"
        
        tools_list:
          request: |
            {"jsonrpc": "2.0", "id": 1, "method": "tools/list"}
          
          response: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "result": {
                "tools": [
                  {
                    "name": "cortex_plan",
                    "description": "Create epic/feature plans with governance enforcement",
                    "inputSchema": {
                      "type": "object",
                      "properties": {
                        "request": {"type": "string", "description": "Plan request (e.g., 'user authentication')"}
                      },
                      "required": ["request"]
                    }
                  },
                  {
                    "name": "cortex_tdd",
                    "description": "Test-driven development with RED→GREEN→REFACTOR cycle",
                    "inputSchema": {
                      "type": "object",
                      "properties": {
                        "request": {"type": "string", "description": "TDD request (e.g., 'validate email')"}
                      },
                      "required": ["request"]
                    }
                  }
                ]
              }
            }
        
        tools_call:
          request: |
            {
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/call",
              "params": {
                "name": "cortex_plan",
                "arguments": {"request": "plan user authentication with OAuth2"}
              }
            }
          
          response: |
            {
              "jsonrpc": "2.0",
              "id": 2,
              "result": {
                "content": [
                  {
                    "type": "text",
                    "text": "✅ Planning v5 Complete\n\n▓▓▓▓▓▓▓▓▓▓ 100%\n\nPlan: cortex-brain/documents/planning/active/user-auth-epic/\n- 00-user-auth-epic.yaml\n- features/ (5 features)\n- tracking/progress-tracker.json"
                  }
                ],
                "isError": false
              }
            }
      
      prompts:
        description: "Reusable prompt templates for common tasks"
        
        prompts_list:
          response_example: |
            {
              "prompts": [
                {
                  "name": "create_plan",
                  "description": "Create comprehensive plan with best practices",
                  "arguments": [
                    {"name": "topic", "description": "What to plan", "required": true}
                  ]
                }
              ]
            }
      
      resources:
        description: "Knowledge library and state resources"
        
        resources_list:
          response_example: |
            {
              "resources": [
                {
                  "uri": "cortex://knowledge/python-best-practices",
                  "name": "Python Best Practices",
                  "description": "PEP 8, type hints, docstrings",
                  "mimeType": "text/yaml"
                },
                {
                  "uri": "cortex://state/todo-graph",
                  "name": "TODO Graph",
                  "description": "Current work DAG",
                  "mimeType": "application/json"
                }
              ]
            }
    
    orchestrator_registration:
      manifest_to_mcp_tool:
        input: "cortex-brain/manifests/orchestrators/planning-v5.yaml"
        output: "MCP tool definition"
        
        transformation: |
          # Orchestrator Manifest
          orchestrator_id: planning_v5
          name: Planning Orchestrator v5
          patterns: ["^(plan|create a plan)"]
          capabilities: ["epic_planning", "feature_planning"]
          
          # Transforms to MCP Tool
          {
            "name": "cortex_plan",
            "description": "Create epic/feature plans with governance enforcement",
            "inputSchema": {
              "type": "object",
              "properties": {
                "request": {"type": "string", "description": "Plan request"}
              },
              "required": ["request"]
            }
          }

  # ---------------------------------------------------------------------------
  # Component 7: Multi-Repo Manager - NEW
  # ---------------------------------------------------------------------------
  
  multi_repo_manager:
    name: "Multi-Repo Manager"
    version: "1.0.0"
    location: "src/multi_repo/repo_manager.py"
    
    purpose: |
      Enable single CORTEX installation to orchestrate work across multiple
      repositories. Repo-specific plans, knowledge, tracking while sharing
      core orchestration logic.
    
    configuration:
      config_file: "~/.cortex/repos.yaml"
      
      schema: |
        cortex_installation: "/Users/asif/CORTEX"
        
        repos:
          - repo_id: "frontend-app"
            path: "/Users/asif/projects/frontend-app"
            name: "Frontend Application"
            type: primary
            cortex_enabled: true
            knowledge_library: ".cortex/knowledge"
            plan_storage: ".cortex/plans"
            tracking_db: ".cortex/tracking/progress.db"
            
          - repo_id: "backend-api"
            path: "/Users/asif/projects/backend-api"
            name: "Backend API"
            type: secondary
            cortex_enabled: true
            
          - repo_id: "shared-lib"
            path: "/Users/asif/projects/shared-lib"
            name: "Shared Library"
            type: secondary
            cortex_enabled: false  # Disabled for this repo
    
    repo_context_detection:
      algorithm: |
        def detect_repo_context() -> Optional[RepoConfig]:
            cwd = os.getcwd()
            
            # Load repos.yaml
            repos = load_config("~/.cortex/repos.yaml")
            
            # Find repo containing cwd
            for repo in repos:
                if cwd.startswith(repo['path']):
                    return RepoConfig(**repo)
            
            # Not found - prompt user
            print("Current directory not in any registered repo.")
            print("Available repos:")
            for i, repo in enumerate(repos, 1):
                print(f"  {i}. {repo['name']} ({repo['repo_id']})")
            
            choice = input("Select repo (1-{}): ".format(len(repos)))
            return RepoConfig(**repos[int(choice) - 1])
    
    isolated_storage:
      plans: "{repo_path}/.cortex/plans/{epic-name}/"
      tracking: "{repo_path}/.cortex/tracking/progress.db"
      knowledge: "{repo_path}/.cortex/knowledge/"
      audit_logs: "{repo_path}/.cortex/audit-logs/"
      
    knowledge_hierarchy:
      tier_1: "CORTEX core (cortex-brain/tier0/)"
      tier_2: "CORTEX library (cortex-brain/knowledge-library/)"
      tier_3: "Repo-specific ({repo_path}/.cortex/knowledge/)"
      
      merge_order: "Tier 3 overrides Tier 2 overrides Tier 1"

