# ==============================================================================
# RISK MITIGATION
# ==============================================================================

risk_mitigation:
  
  technical_risks:
    - risk: "SQLite WAL mode compatibility issues on Windows"
      probability: "Medium"
      impact: "High"
      mitigation: "Phase 0 validation on Windows before Phase 1"
      
    - risk: "MCP server stdio transport buffering issues"
      probability: "Medium"
      impact: "High"
      mitigation: "Flush after every JSON-RPC message"
      
    - risk: "Circular dependency undetected (algorithm bug)"
      probability: "Low"
      impact: "Critical"
      mitigation: "Extensive unit tests + property-based testing (hypothesis)"
      
    - risk: "Race conditions in concurrent orchestrator execution"
      probability: "High"
      impact: "Critical"
      mitigation: "Optimistic locking + integration tests for concurrency"
  
  process_risks:
    - risk: "Snowball strategy delays (early phases take longer)"
      probability: "High"
      impact: "Medium"
      mitigation: "Buffer time in estimates (Epic 1: 8 weeks)"
      
    - risk: "Governance audit log enforcement bypassed"
      probability: "Low"
      impact: "Critical"
      mitigation: "Pre-commit hook cannot be bypassed (wrapper script)"
      
    - risk: "Knowledge merge conflicts unresolved"
      probability: "Medium"
      impact: "Medium"
      mitigation: "User prompt for critical conflicts, fallback to CORTEX"
  
  user_adoption_risks:
    - risk: "Multi-repo setup complexity"
