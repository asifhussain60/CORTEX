  checkpoint_frequency: "After each phase completion"
  mechanism: "Git tags + StateManager snapshots"
  recovery_time_objective: "<15 minutes"
  
  checkpoints:
    - checkpoint_id: CP0
      phase: P0
      description: "Pre-remediation baseline"
      status: PENDING
      
    - checkpoint_id: CP1
      phase: P1
      description: "Requirements converted to YAML"
      status: PENDING
      
    - checkpoint_id: CP2
      phase: P2
      description: "Critical gaps implemented"
