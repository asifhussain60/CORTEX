  source_of_truth: ".asif/AI-Learning/cortex6/source-of-truth/"
  requirements_folder: ".asif/AI-Learning/cortex6/requirements/"
  live_implementation: "src/"
  tracker: ".asif/AI-Learning/cortex6/source-of-truth/todo/00-TODO-CONTINUITY-TRACKER.yaml"
  feature_yamls: ".asif/AI-Learning/cortex6/source-of-truth/features/"

