    test_coverage: 0%                  # Target: 95%
    documentation_coverage: 0%         # Target: 100%
    epic_health_score: 0              # Target: 100

  validation_gates:
    - gate_id: G1
      name: "Requirements YAML Conversion Complete"
      phase: P1
