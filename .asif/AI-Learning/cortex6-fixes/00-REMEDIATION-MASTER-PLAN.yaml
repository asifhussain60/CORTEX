      status: PENDING

execution_protocol:
  mode: AUTONOMOUS
  executor: GitHub Copilot (with CORTEX orchestration where applicable)
  
  per_task_checklist:
    pre_execution:
      - Review acceptance criteria
      - Check dependencies satisfied
      - Review audit logs for errors
      - Verify test baseline
    
    during_execution:
      - Follow TDD when applicable
      - Log all operations
      - Keep commits incremental (<500 lines)
      - Update tracker in real-time
    
    post_execution:
      - Run tests
      - Verify acceptance criteria
      - Update tracker status
      - Commit checkpoint if needed
  
  reporting:
    frequency: "After each task completion"
    format: "Concise summary (3-5 lines)"
    detailed_report: "After each phase completion"
    dashboard: "cortex6-fixes/00-PROGRESS-DASHBOARD.yaml"

references:
