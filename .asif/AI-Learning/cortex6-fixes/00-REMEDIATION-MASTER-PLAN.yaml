execution_protocol:
  mode: AUTONOMOUS
  executor: GitHub Copilot (with CORTEX orchestration where applicable)
  
  per_task_checklist:
    pre_execution:
      - Review acceptance criteria
      - Check dependencies satisfied
      - Review audit logs for errors
      - Verify test baseline
    
    during_execution:
      - Follow TDD when applicable
      - Log all operations
      - Keep commits incremental (<500 lines)
      - Update tracker in real-time
    
    post_execution:
      - Run tests
      - Verify acceptance criteria
      - Update tracker status
      - Commit checkpoint if needed
  
  reporting:
    frequency: "After each task completion"
    format: "Concise summary (3-5 lines)"
    detailed_report: "After each phase completion"
    dashboard: "cortex6-fixes/00-PROGRESS-DASHBOARD.yaml"
  
  continuation_management:
    trigger: "Before token budget reaches 70% (700K tokens used)"
    strategy: "Proactive context preservation with strategic handoff"
    
    pre_summary_prompt:
      title: "🔄 CONTEXT PRESERVATION CHECKPOINT"
      timing: "Present when 650K-700K tokens used (before 'Summarizing Conversation History')"
      
      template: |
        ## 🔄 STRATEGIC CONTINUATION CHECKPOINT
        
        **Context Status:** Approaching token limit (~70% budget used)
        **Current Phase:** {current_phase}
        **Tasks Completed:** {tasks_completed}/{tasks_total}
        **Last Task:** {last_task_id} - {last_task_status}
        
        **✅ Completed This Session:**
        {completed_tasks_summary}
        
        **⚡ Active Work:**
        - Current focus: {current_focus}
        - Files modified: {modified_files_count}
        - Tests status: {test_status}
        
        **📋 Next Steps (Post-Summary):**
        1. {next_task_id}: {next_task_name}
        2. Estimated: {next_task_hours} hours
        3. Dependencies: {next_task_deps}
        
        **🎯 Continuation Command:**
        ```
        continue {plan_id} from {last_task_id} - resume {current_phase}
        ```
        
        **📊 Progress Metrics:**
        - Phase completion: {phase_progress}%
        - Overall completion: {overall_progress}%
        - Health score: {health_score}/100
        
        ---
        
        💡 **TIP:** Copy the continuation command above. After GitHub Copilot summarizes 
        the conversation, paste it to resume exactly where we left off.
      
      context_preservation:
        save_to_files:
          - path: "cortex6-fixes/00-CURRENT-STATUS.md"
            content: "Live status dashboard with latest progress"
          
          - path: "cortex6-fixes/session-checkpoints/checkpoint-{timestamp}.yaml"
            content: "Session state snapshot with full context"
          
          - path: "cortex6-fixes/{phase_id}.yaml"
            content: "Phase-specific progress with completed tasks updated"
        
        critical_context:
          - "Last completed task ID and deliverables"
          - "Current working files and uncommitted changes"
          - "Test results and any failures"
          - "Acceptance criteria validation status"
          - "Epic health score and identified gaps"
          - "Next task dependencies and readiness"
        
        handoff_protocol:
          - "Update all tracking files before presenting prompt"
          - "Ensure checkpoint files are written to disk"
          - "Validate continuation command is accurate"
          - "Present prompt BEFORE token summary triggers"
          - "Allow user to copy continuation command"
    
    post_summary_resume:
      recognition_patterns:
        - "continue {plan_id}"
        - "resume {phase_id}"
        - "continue from {task_id}"
        - "pick up where we left off"
        - "resume cortex6-fixes"
      
      resume_protocol:
        - "Load latest checkpoint from session-checkpoints/"
        - "Read 00-CURRENT-STATUS.md for live state"
        - "Verify last completed task in phase YAML"
        - "Check test results and health score"
        - "Present brief summary (5 lines max)"
        - "Execute next task immediately"
      
      resume_response_template: |
        ## 🔄 RESUMING FROM CHECKPOINT
        
        ✅ **Restored Context:** {checkpoint_timestamp}
        📋 **Last Completed:** {last_task_id} - {last_task_name}
        ⚡ **Resuming:** {next_task_id} - {next_task_name}
        
        *Executing next task...*

