  - task_id: P3-T2
    name: "Implement Cleanup Orchestrator v2"
    description: |
      Create cleanup orchestrator with 5 selective modes (cache/logs/artifacts/full/git).
      
      IMPLEMENTATION APPROACH:
      1. Mode-based execution (extract mode from user input)
      2. Space calculation before/after
      3. Atomic operations with rollback support
      4. Dry-run mode (preview without changes)
      5. Safety validation (confirm destructive operations)
      
      MODES (from manifest):
      - cache: Remove .cache/, __pycache__/, node_modules/ (1GB freed, 10s)
      - logs: Archive and delete old logs (250MB freed, 10s)
      - artifacts: Remove build outputs, temp files (2.5GB freed, 60s)
      - full: Execute all modes sequentially (7.5GB freed, 100s)
      - git: Clean untracked files via git clean -fdx (100MB freed, 180s)
      
      LEVERAGE EXISTING PATTERNS:
      - Vacuum v2 progressive hashing and safety validation
      - Maintenance v2 12-phase pipeline structure
      - TDD v2 for test-first implementation (just learned!)
      
      DELIVERABLES:
      - src/orchestrators/cleanup/cleanup_orchestrator_v2.py
      - src/orchestrators/cleanup/__init__.py
      - tests/orchestrators/test_cleanup_orchestrator_v2.py
      - cortex-brain/manifests/orchestrators/cleanup-orchestrator-v2.yaml
      - Entry point registration
      - Documentation update
    
    priority: P0_CRITICAL
    status: NOT_STARTED
    estimated_minutes: 420  # 7 hours
    dependencies:
      - P3-T1  # TDD v2 available for test-first development
    tdd_required: true
    snowball_impact: HIGH
    
    subtasks:
      - subtask_id: P3-T2.1
        name: "RED: Write failing tests for Cleanup orchestrator"
        estimated_minutes: 60
        test_coverage_target: "≥95%"
        test_scenarios:
          - "Test cache mode (removes __pycache__, .cache)"
          - "Test logs mode (archives and deletes logs)"
          - "Test artifacts mode (removes build outputs)"
          - "Test full mode (executes all modes)"
          - "Test git mode (git clean -fdx)"
          - "Test dry-run mode (preview only)"
          - "Test space calculation (before/after)"
          - "Test rollback on failure"
          - "Test safety validation"
      
      - subtask_id: P3-T2.2
        name: "GREEN: Implement Cleanup orchestrator core"
        estimated_minutes: 240
        implementation_checklist:
          - "Extend BaseOrchestratorV4_1"
          - "Mode extraction from user input"
          - "5 cleanup modes implementation"
          - "Space calculation logic"
          - "Atomic operation wrappers"
          - "Rollback mechanism"
          - "Dry-run support"
          - "Safety validation prompts"
          - "Progress reporting"
      
      - subtask_id: P3-T2.3
        name: "REFACTOR: Clean up Cleanup orchestrator code"
        estimated_minutes: 45
        refactoring_targets:
          - "Extract mode handlers to separate methods"
          - "Consolidate space calculation logic"
          - "Improve error messages"
          - "Add comprehensive type hints"
      
      - subtask_id: P3-T2.4
        name: "Register Cleanup orchestrator in entry point"
        estimated_minutes: 30
        files_to_modify:
          - "src/entry_point/cortex_entry.py"
          - "cortex-brain/config/master-orchestrator.yaml (routing pattern already exists)"
      
      - subtask_id: P3-T2.5
        name: "Create Cleanup orchestrator manifest + documentation"
        estimated_minutes: 45
        deliverables:
          - "cortex-brain/manifests/orchestrators/cleanup-orchestrator-v2.yaml"
          - "cortex-brain/documents/orchestrators-quick-ref.md (Cleanup v2 section)"
    
    deliverables:
      - src/orchestrators/cleanup/cleanup_orchestrator_v2.py
      - src/orchestrators/cleanup/__init__.py
      - tests/orchestrators/test_cleanup_orchestrator_v2.py
