  command: |
    Remove-Item -Path "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\10-verify-planning-governance-implementation.md" -Force
    Remove-Item -Path "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\10-verify-planning-governance-implementation.yaml" -Force
    Remove-Item -Path "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\planning-governance-gap-analysis-2026-01-01.md" -Force
    Remove-Item -Path "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\planning-governance-implementation-summary-2026-01-01.md" -Force

execution_notes:
  - "All grep commands are case-insensitive where appropriate"
  - "Use Windows paths (backslashes) for PowerShell execution"
  - "Test commands in order - dependencies exist between steps"
  - "Exit codes: 0 = success, 1 = failure"
  - "For non-compliant plan test, expected exit code is 1 (failure)"
