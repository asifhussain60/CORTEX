---
metadata:
  id: "10-verify-planning-governance-implementation"
  title: "Verify Planning Governance Implementation"
  priority: HIGH
  estimated_effort: "30 min"
  category: Validation
  created: "2026-01-02"
  status: pending
  source_documents:
    - ".asif/backlog/planning-governance-gap-analysis-2026-01-01.md"
    - ".asif/backlog/planning-governance-implementation-summary-2026-01-01.md"

objective:
  description: "Verify that planning governance improvements implemented on January 1, 2026 are functioning correctly across all CORTEX planning workflows"
  verification_points:
    - "Phase -1 (Knowledge Library Consultation) is enforced"
    - "Comprehensive REFACTOR phase (≥15 tasks) is enforced"
    - "Orchestrator engagement validation prevents manual plan bypass"
    - "Validation script correctly detects non-compliant plans"

execution_steps:
  - step: 1
    name: "Verify Response Template Updates"
    commands:
      - description: "Check autonomous_execution_progress template includes governance requirements"
        command: "grep -A 20 'autonomous_execution_progress:' cortex-brain/response-templates-v4.yaml | grep -E '(phase_minus_one|refactor_comprehensiveness|knowledge_library)'"
        expected_output:
          - "phase_minus_one: required: true"
          - "refactor_comprehensiveness: minimum_tasks: 15"
          - "knowledge_library_consultation: true"
      - description: "Check for governance_requirements section"
        command: "grep -n 'governance_requirements:' cortex-brain/response-templates-v4.yaml"
        expected_output: "Section found with line number"
    success_criteria:
      - "Response template includes governance_requirements section"

  - step: 2
    name: "Verify CORTEX.prompt.md Orchestrator Enforcement"
    commands:
      - description: "Check for orchestrator engagement validation checklist"
        command: "grep -A 10 'ORCHESTRATOR ENGAGEMENT ENFORCEMENT' .github/prompts/CORTEX.prompt.md"
        expected_output:
          - "5-step validation checklist"
          - "Manual plan rejection protocol"
          - "## 🛡️🧠 CORTEX Plan Execution header requirement"
      - description: "Check for explicit enforcement text"
        command: "grep -c 'REJECT.*Re-route to orchestrator' .github/prompts/CORTEX.prompt.md"
        expected_output: "At least 1 occurrence"
    success_criteria:
      - "CORTEX.prompt.md has orchestrator enforcement checklist (5 steps)"

  - step: 3
    name: "Verify Recursive Master Plan Updates"
    working_directory: "cortex-brain/documents/planning/repeatable/level-2-glassmorphism-standardization"
    commands:
      - description: "Verify Phase -1 exists"
        command: "grep -n 'Phase -1.*Knowledge Library' 00-RECURSIVE-MASTER-PLAN.md"
        expected_output: "Phase -1 section found at line ~50-100"
      - description: "Count REFACTOR phase tasks"
        command: "grep -E '^\\| 10\\.[0-9]+ \\|' 00-RECURSIVE-MASTER-PLAN.md | wc -l"
        expected_output: "≥18 tasks"
      - description: "Check for 5 REFACTOR categories"
        command: "grep -E '10\\.(4|5|6|7|8)' 00-RECURSIVE-MASTER-PLAN.md | head -5"
        expected_output: "Headers for Orphaned Code, Duplication, Dead Code, Formatting, Documentation"
    success_criteria:
      - "Recursive Master Plan has Phase -1 (5 tasks)"
      - "Recursive Master Plan has comprehensive REFACTOR (≥18 tasks)"

  - step: 4
    name: "Verify copilot-instructions.md SKULL Rules"
    commands:
      - description: "Check MANDATORY Plan Content section"
        command: "grep -A 15 'MANDATORY Plan Content' .github/copilot-instructions.md | grep -E '(Phase -1|REFACTOR|micro-batch)'"
        expected_output:
          - "Phase -1 as requirement #1"
          - "Comprehensive REFACTOR (≥15 tasks) mentioned"
          - "Micro-batch strategy mentioned"
      - description: "Count SKULL rules (should be 8, was 5 before)"
        command: "grep -c '^| `' .github/copilot-instructions.md | tail -1"
        expected_output: "8 rules"
    success_criteria:
      - "copilot-instructions.md documents Phase -1 as requirement #1"
      - "copilot-instructions.md lists 8 SKULL rules (not 5)"

  - step: 5
    name: "Verify Validation Script Exists and Works"
    commands:
      - description: "Check script exists"
        command: "test -f cortex-toolkit/validate_plan_governance.py && echo '✅ Script found' || echo '❌ Script missing'"
        expected_output: "✅ Script found"
      - description: "Test script on compliant plan"
        command: "python cortex-toolkit/validate_plan_governance.py cortex-brain/documents/planning/repeatable/level-2-glassmorphism-standardization/00-RECURSIVE-MASTER-PLAN.md"
        expected_output:
          - "Status: ✅ PASSED"
          - "Compliance Score: ✅ 10.0/10.0 (Threshold: ≥8.0)"
      - description: "Check script has all validation checks"
        command: "grep -c 'def validate_' cortex-toolkit/validate_plan_governance.py"
        expected_output: "6-8 validation methods"
    success_criteria:
      - "Validation script exists and runs successfully"
      - "Validation script correctly detects compliant plans (10.0/10)"

  - step: 6
    name: "Test Validation Script on Non-Compliant Plan"
    commands:
      - description: "Create test plan WITHOUT Phase -1 (should fail)"
        command: |
          cat > /tmp/test-plan-invalid.md << 'EOF'
          # Test Plan

          ## Phase 0: Discovery
          | 0.1 | Task | Status |

          ## Phase 10: REFACTOR
          | 10.1 | Clean animations | ⬜ |
          | 10.2 | Fix typos | ⬜ |
          EOF
      - description: "Run validator (should FAIL)"
        command: "python cortex-toolkit/validate_plan_governance.py /tmp/test-plan-invalid.md"
        expected_output:
          - "❌ CRITICAL: Phase -1 (Knowledge Library Consultation) missing"
          - "❌ CRITICAL: REFACTOR phase incomplete (2 tasks, need ≥15)"
          - "❌ Validation failed: 2 errors"
        expected_exit_code: 1
    success_criteria:
      - "Validation script correctly rejects non-compliant plans"

  - step: 7
    name: "Verify Knowledge Library Integration in Manifest"
    commands:
      - description: "Check planning manifest has Phase -1 configuration"
        command: "grep -A 30 'phase_minus_one_knowledge_library' cortex-brain/manifests/orchestrators/planning-system-4.0-manifest.yaml"
        expected_output:
          - "enabled: true"
          - "mandatory: true"
          - "4-5 query definitions"
          - "output: fields for context files"
      - description: "Check refactor_phase_comprehensive section"
        command: "grep -A 20 'refactor_phase_comprehensive' cortex-brain/manifests/orchestrators/planning-system-4.0-manifest.yaml | grep 'minimum_tasks'"
        expected_output: "minimum_tasks: 15"
    success_criteria:
      - "Planning manifest has phase_minus_one_knowledge_library section"
      - "Planning manifest has refactor_phase_comprehensive with minimum_tasks: 15"

  - step: 8
    name: "Verify Documentation Cross-References"
    commands:
      - description: "Check implementation summary references gap analysis"
        command: "grep -i 'planning-governance-gap-analysis' .asif/backlog/planning-governance-implementation-summary-2026-01-01.md"
        expected_output: "Reference to gap analysis file found"
      - description: "Verify compliance score improvement documented"
        command: "grep -E 'Compliance Score.*10\\.0/10' .asif/backlog/planning-governance-implementation-summary-2026-01-01.md"
        expected_output:
          - "Compliance score 10.0/10 documented"
          - "Before/After comparison present"
    success_criteria:
      - "Implementation summary documents compliance improvement (6.8 → 10.0)"

success_criteria:
  total_criteria: 11
  all_must_pass: true
  criteria_list:
    - id: 1
      description: "Response template includes governance_requirements section"
      status: pending
    - id: 2
      description: "CORTEX.prompt.md has orchestrator enforcement checklist (5 steps)"
      status: pending
    - id: 3
      description: "Recursive Master Plan has Phase -1 (5 tasks)"
      status: pending
    - id: 4
      description: "Recursive Master Plan has comprehensive REFACTOR (≥18 tasks)"
      status: pending
    - id: 5
      description: "copilot-instructions.md documents Phase -1 as requirement #1"
      status: pending
    - id: 6
      description: "copilot-instructions.md lists 8 SKULL rules (not 5)"
      status: pending
    - id: 7
      description: "Validation script exists and runs successfully"
      status: pending
    - id: 8
      description: "Validation script correctly detects compliant plans (10.0/10)"
      status: pending
    - id: 9
      description: "Validation script correctly rejects non-compliant plans"
      status: pending
    - id: 10
      description: "Planning manifest has phase_minus_one_knowledge_library section"
      status: pending
    - id: 11
      description: "Planning manifest has refactor_phase_comprehensive with minimum_tasks: 15"
      status: pending

additional_validation:
  optional: true
  steps:
    - name: "Verify Template Rendering"
      command: "grep -n 'autonomous_execution_progress' src/orchestrators/planning/planning_orchestrator.py"
      description: "Check if planning orchestrator uses new template"
    - name: "Verify Test Coverage"
      command: "grep -i 'phase.*minus.*one\\|knowledge.*library' tests/orchestrators/planning/test_planning_orchestrator_extended.py"
      description: "Check for Phase -1 tests in planning orchestrator tests"
    - name: "Verify Git History"
      command: |
        git log --since="2026-01-01" --until="2026-01-02" --oneline --grep="governance\\|Phase -1\\|REFACTOR" -- \
          cortex-brain/response-templates-v4.yaml \
          .github/prompts/CORTEX.prompt.md \
          .github/copilot-instructions.md
      description: "Check commits on January 1, 2026 for governance changes"

expected_results_summary:
  components:
    - component: "Response Template"
      change: "Added governance_requirements"
      verification_command: "grep governance_requirements cortex-brain/response-templates-v4.yaml"
      expected_output: "Section found"
    - component: "CORTEX.prompt.md"
      change: "Added enforcement checklist"
      verification_command: "grep 'ORCHESTRATOR ENGAGEMENT' .github/prompts/CORTEX.prompt.md"
      expected_output: "5-step checklist"
    - component: "Master Plan"
      change: "Added Phase -1"
      verification_command: "grep 'Phase -1' 00-RECURSIVE-MASTER-PLAN.md"
      expected_output: "Phase -1 section"
    - component: "Master Plan"
      change: "Expanded REFACTOR"
      verification_command: "grep '10\\.[0-9]' 00-RECURSIVE-MASTER-PLAN.md | wc -l"
      expected_output: "≥18 tasks"
    - component: "copilot-instructions"
      change: "Updated SKULL rules"
      verification_command: "grep -c '`.*_ENFORCEMENT`' .github/copilot-instructions.md"
      expected_output: "8 rules"
    - component: "Validation Script"
      change: "Created"
      verification_command: "test -f cortex-toolkit/validate_plan_governance.py"
      expected_output: "File exists"
    - component: "Validation Script"
      change: "Works correctly"
      verification_command: "python cortex-toolkit/validate_plan_governance.py {plan}"
      expected_output: "10.0/10 score"
    - component: "Planning Manifest"
      change: "Phase -1 config"
      verification_command: "grep phase_minus_one cortex-brain/manifests/orchestrators/planning-system-4.0-manifest.yaml"
      expected_output: "Section found"

rollback_instructions:
  enabled: false
  note: "DO NOT ROLLBACK - Instead, create new backlog item to fix specific issue found during verification"
  commands:
    - description: "View governance implementation commits"
      command: "git log --since='2026-01-01' --until='2026-01-02' --oneline --all"
    - description: "If rollback needed (NOT RECOMMENDED)"
      command: "git revert <commit-hash>"

next_actions:
  if_all_checks_pass:
    - "Update governance implementation summary with verification timestamp"
    - "Close gap analysis and implementation summary (delete files)"
    - "Mark planning governance as PRODUCTION READY"
  if_any_checks_fail:
    - "Create specific backlog item for failed check"
    - "Prioritize as CRITICAL (00-09)"
    - "Re-run verification after fix"

auto_delete_instruction:
  enabled: true
  trigger: "After successful verification"
  files_to_delete:
    - "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\10-verify-planning-governance-implementation.md"
    - "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\10-verify-planning-governance-implementation.yaml"
    - "d:\\PROJECTS\\CORTEX\\.asif\\backlog\\planning-governance-gap-analysis-2026-01-01.md"
