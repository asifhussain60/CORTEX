# .pre-commit-config.yaml
#
# Pre-commit hook configuration for CORTEX
# Runs automated checks before commits to maintain governance compliance
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Bypass (use with caution): git commit --no-verify

repos:
  # CORTEX Governance Checks
  - repo: local
    hooks:
      - id: cortex-governance-check
        name: CORTEX Governance Check
        entry: python3 .githooks/pre-commit-governance-check.py
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true
        description: "Validate AC-ID format and governance rule compliance"
      
      # Phase 0 Automation - Stub Detection
      - id: detect-stubs
        name: Detect stub implementations (NO empty functions)
        entry: scripts/validation/detect_stubs.sh
        language: script
        files: ^cortex/.*\.py$
        pass_filenames: false
        stages: [commit]
        description: "Block commits with stub implementations (def ...: pass)"
        
      - id: detect-empty-classes
        name: Detect empty classes (NO class stubs)
        entry: scripts/validation/detect_empty_classes.sh
        language: script
        files: ^cortex/.*\.py$
        pass_filenames: false
        stages: [commit]
        description: "Block commits with empty class definitions"

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
        exclude: ^(tests/|docs/)
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Python linting
  - repo: https://github.com/pylint-dev/pylint
    rev: v3.0.0
    hooks:
      - id: pylint
        name: Lint Python code
        language: system
        types: [python]
        exclude: ^(tests/|docs/|venv/|\.venv/)
        entry: pylint
        stages: [commit]
        verbose: false

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.34.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        types: [markdown]
        exclude: ^(docs/archive/|CHANGELOG.md)

# General configuration
default_language_version:
  python: python3

# Uncomment to only run on modified files (faster):
# files: ^(src/|tests/|scripts/)
