repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-secrets

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-pyyaml]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -x
        language: system
        pass_filenames: false
        always_run: true

      - id: verify-prompt-fields
        name: REM-001 - Verify DoR Fields in Prompts
        entry: python3 scripts/verify_prompt_fields.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^(\.github/prompts/|cortex/orchestrators/core/dor_approval_gate\.py)

      - id: verify-mock-targets
        name: REM-002 - Verify Mock Targets Exist
        entry: python3 scripts/verify_mock_targets.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^tests/.*test_.*\.py$

      - id: cortex-docs-link-check
        name: DOC-013 - Documentation Link Integrity
        entry: python3 scripts/check_docs_links.py

      - id: cortex-tdd-gate
        name: CORE-008 - TDD Gate (Tests Before Implementation)
        entry: python3 scripts/governance/tdd_gate.py
        language: system
        pass_filenames: false
        stages: [commit]
        files: ^cortex/.*\.py$
        language: system
        pass_filenames: false
        always_run: false
        files: ^docs/.*\.(html|md)$

      - id: cortex-docs-responsive-check
        name: DOC-021 - Documentation Responsive Design
        entry: python3 scripts/check_docs_responsive.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^docs/.*\.html$

      - id: no-bare-except
        name: CORE-013 - No Bare Except Blocks
        entry: bash -c 'if grep -rn "except:\s*$" cortex/ scripts/ --include="*.py" | grep -v "tests/"; then echo "❌ CORE-013 violation: Bare except blocks found. Use specific exceptions."; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: false
        files: \.py$

