[pytest]
# Smoke Test Configuration
# Fast validation suite for rapid feedback

# Test discovery
testpaths = tests/smoke
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    smoke: Fast smoke tests for critical paths
    import_validation: Validate module imports
    skull_enforcement: Validate SKULL rule enforcement
    critical_methods: Validate critical methods exist
    performance: Performance benchmarks

# Timeout
timeout = 30

# Disable coverage for smoke tests (speed optimization)
