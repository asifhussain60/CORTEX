# ============================================================================
# SIZE OPTIMIZATION
# ============================================================================

size_optimization:
  current_size: ~150 MB (with bloat)
  target_size: <60 MB (60% reduction)
  
  optimizations:
    - Filter cortex-brain/documents/reports/ (777 files → ~50 user-facing)
    - Exclude 10+ internal document categories
    - Remove archived scripts
    - Remove conversation captures
    - Remove internal investigations
    - Remove learning data
    - Remove pilot project data
    
  expected_results:
    source_code: 15 MB (no change)
    brain_system: 30 MB (from 120 MB, 75% reduction)
    scripts: 5 MB (no change)
    documentation: 10 MB (no change)
    total: 60 MB (60% reduction achieved)

