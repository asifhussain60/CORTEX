# ============================================================================
# CORE INFRASTRUCTURE (MUST DEPLOY)
# ============================================================================

core_infrastructure:
  brain_system:
    - cortex-brain/brain-protection-rules.yaml (SKULL rules)
    - cortex-brain/response-templates.yaml (62 templates)
    - cortex-brain/schema.sql (combined Tier 0-3 schema)
    - cortex-brain/aggressive-cleanup-rules.yaml
    
  orchestrator_manifests:
    - cortex-brain/orchestrator-manifests/code-sanitization-manifest.yaml
    - cortex-brain/orchestrator-manifests/planning-system-2.0-manifest.yaml
    - cortex-brain/orchestrator-manifests/ado-planning-manifest.yaml
    - cortex-brain/orchestrator-manifests/tdd-mastery-manifest.yaml
    
  entry_points:
    - .github/prompts/CORTEX.prompt.md (universal entry point)
    - .github/copilot-instructions.md (baseline context)
    
  configuration:
    - cortex-operations.yaml (operations manifest)
    - cortex.config.template.json (machine config template)
    - requirements.txt (Python dependencies)
    
  legal:
    - README.md
    - LICENSE
    - CHANGELOG.md

# ============================================================================
# SOURCE CODE STRUCTURE
# ============================================================================

source_code:
  include:
    # Tier System
    - src/tier0/ (governance, brain protection)
    - src/tier1/ (working memory)
    - src/tier2/ (knowledge graph)
    - src/tier3/ (development context)
    
    # Agents
    - src/cortex_agents/ (2 specialist agents)
    
    # Operations (ALL utility modules)
    - src/operations/modules/ado/
    - src/operations/modules/admin/
    - src/operations/modules/analysis/
    - src/operations/modules/checkpoints/
    - src/operations/modules/cleanup/
    - src/operations/modules/deploy/
    - src/operations/modules/epm/
    - src/operations/modules/estimation/
    - src/operations/modules/git/
    - src/operations/modules/health/
    - src/operations/modules/incremental/
    - src/operations/modules/lint/
    - src/operations/modules/metrics/
    - src/operations/modules/onboarding/
    - src/operations/modules/phase8/
    - src/operations/modules/planning/
    - src/operations/modules/pr/
    - src/operations/modules/rca/
    - src/operations/modules/realignment/
    - src/operations/modules/reporting/
    - src/operations/modules/review/
    - src/operations/modules/routing/
    - src/operations/modules/setup/
    - src/operations/modules/tdd/
    - src/operations/modules/upgrade/
    - src/operations/modules/ux_enhancement/
    - src/operations/modules/validation/
    
    # Base classes & infrastructure
    - src/operations/base_operation_module.py
    - src/operations/operations_orchestrator.py
    - src/plugins/ (plugin system)
    - src/feedback/ (feedback collector)
    - src/application/validation/ (validator registry)
    
  exclude:
    # Legacy orchestrators (to be archived)
    - src/orchestrators/*.py (EXCEPT git_sync_and_optimize.py and __init__.py)
    
    # Internal/admin modules (keep in repo, exclude from package)
    - src/operations/modules/admin/ (except healthcheck_utility.py, align_utility.py)
    - src/operations/modules/orchestration/ (internal orchestrators)

# ============================================================================
# BRAIN DOCUMENTS (FILTERED FOR USER DEPLOYMENT)
# ============================================================================

brain_documents:
  include_categories:
    - guides/ (user guides)
    - user-guides/ (explicitly user-facing)
    - examples/ (usage examples)
    - templates/ (response templates)
    - reference/ (technical reference)
    - standards/ (coding standards)
    - reports/ (FILTERED - user-facing only, see filters below)
    
  exclude_categories:
    - archived-scripts/ (development artifacts)
    - conversation-captures/ (internal captures)
    - evidence-templates/ (internal validation)
    - investigations/ (bug investigations)
    - learning/ (system learning data)
    - limitations/ (internal constraints)
    - narratives/ (development narratives)
    - onboarded-apps/ (pilot app data)
    - pilot-projects/ (internal pilots)
    - rationales/ (design rationales)
    - reviews/ (internal reviews)
    - scribe/ (development notes)
    
  reports_filters:
    # Only include user-facing reports (health, diagnostics, validation)
    include_patterns:
      - "*health-check*.md"
      - "*validation*.md"
      - "*diagnostic*.md"
      - "*error-report*.md"
      - "*summary*.md"
      - "deployment-validation-dry-run-analysis.md" (this document)
    
    exclude_patterns:
      - "*IMPLEMENTATION*.md"
      - "*MIGRATION*.md"
      - "*PHASE-*-COMPLETION*.md"
      - "*orchestrator*.md"
      - "*CLI-WRAPPER*.md"
      - "*alignment-fixes*.md"
      - "*AGGRESSIVE-CLEANUP*.md"
      - "*MODULE-INTEGRATION*.md"
      - "*CODE-REFACTORING*.md"
      - "*BRAIN-PROTECTION-TEST*.md"

# ============================================================================
# SCRIPTS (USER-FACING ONLY)
# ============================================================================

scripts:
  include:
    - scripts/cli_wrappers/ (7 CLI wrappers for system operations)
    - scripts/cortex/ (auto_capture_daemon.py)
    - scripts/initialize_databases.py
    - scripts/import_conversation.py
    - scripts/import_copilot_conversation.py
    - scripts/cortex_setup.py
    - scripts/cortex_config_wizard.py
    - scripts/build_package.py
    - scripts/verify_deployment_package.py
    
  exclude:
    - scripts/admin/ (admin-only scripts)
    - scripts/test_* (test scripts)
    - scripts/debug_* (debug scripts)
    - scripts/temp/ (temporary files)
    - scripts/maintenance/ (internal maintenance)
    - scripts/architecture/ (internal architecture)
    - scripts/validation/ (internal validation)
    - scripts/misc/ (miscellaneous dev scripts)

# ============================================================================
# PROMPTS & DOCUMENTATION
# ============================================================================

prompts:
  include:
    - prompts/shared/ (story, setup, tracking, technical reference, agents, config, plugin, operations)
    - prompts/user/ (user-facing prompts)
    
  exclude:
    - prompts/internal/ (internal prompts)
    - prompts/admin/ (admin prompts)

documentation:
  include:
    - docs/user/ (user documentation)
    - docs/guides/ (how-to guides)
    - docs/reference/ (API reference)
    
  exclude:
    - docs/architecture/ (internal design)
    - docs/internal/ (internal docs)
    - docs/project/ (project management)
    - docs/implementation-notes/ (dev notes)

# ============================================================================
# TEMPLATES (CRITICAL - CURRENTLY MISSING)
# ============================================================================

templates:
  status: ⚠️ MISSING - BLOCKS DEPLOYMENT
  required_files:
    - templates/dashboard_base.html (D3.js base template)
    - templates/health_chart.html (health trend visualization)
    - templates/integration_heatmap.html (integration heatmap)
    - templates/coverage_gauge.html (coverage gauge)
    - templates/quality_radar.html (quality radar chart)
  action: CREATE BEFORE DEPLOYMENT

# ============================================================================
# FORBIDDEN FILES (MUST NOT DEPLOY)
# ============================================================================

forbidden:
  patterns:
    - tests/ (entire directory)
    - workflow_checkpoints/
    - .github/workflows/
    - "*.db" (database files)
    - "*.db-journal"
    - .coverage
    - __pycache__/
    - "*IMPLEMENTATION*.md"
    - "*STATUS*.md"
    - "*PLAN*.md" (except in planning/active, planning/approved)
    - "*SESSION*.md"
    - "*PROGRESS*.md"
    
  directories:
    - archive/ (development archives)
    - logs/ (log files)
    - metrics/ (internal metrics)
    - .pytest_cache/
    - .mypy_cache/
    - .venv/ (virtual environment)

# ============================================================================
# DEPLOYMENT GATES (MUST ALL PASS)
# ============================================================================

deployment_gates:
  blocking_issues:
    - id: gate_3
      name: Orchestrator Migration Incomplete
      status: ❌ FAILED
      issue: 32 legacy orchestrator files still in src/orchestrators/
      action: Archive to archive/orchestrators/legacy/
      
    - id: gate_15
      name: Templates Directory Missing
      status: ❌ FAILED
      issue: D3.js dashboard templates not found
      action: Create templates/ directory with 5 template files
      
  success_criteria:
    - All 41 gates pass (currently 39/41)
    - Package size < 60 MB (currently ~150 MB due to bloat)
    - All 32 production features functional
    - No forbidden files in package
    - Bootstrap installers present

