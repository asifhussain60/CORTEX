<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Integration Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #0a0e27;
            color: #00ff88;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid #00d4ff;
        }
        .pass { color: #00ff88; }
        .fail { color: #ff4444; }
        .warn { color: #ffa500; }
        pre {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Dashboard Integration Test Harness</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        // Test 1: Load mock data files
        log('🔍 Test 1: Data File Loading', 'info');
        
        const dataFiles = [
            'cortex-brain/dashboards/data/mock/overview.json',
            'cortex-brain/dashboards/data/mock/executive-summary.json',
            'cortex-brain/dashboards/data/mock/health-data.json',
            'cortex-brain/dashboards/data/mock/tech-stack.json',
            'cortex-brain/dashboards/data/mock/security.json',
            'cortex-brain/dashboards/data/mock/architecture.json',
            'cortex-brain/dashboards/data/mock/code-organization.json',
            'cortex-brain/dashboards/data/mock/vendors.json'
        ];

        const loadedData = {};
        
        for (const file of dataFiles) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const fileName = file.split('/').pop();
                loadedData[fileName] = data;
                log(`✅ <strong>${fileName}</strong>: Loaded successfully<br><pre>${JSON.stringify(Object.keys(data), null, 2)}</pre>`, 'pass');
            } catch (error) {
                log(`❌ <strong>${file}</strong>: ${error.message}`, 'fail');
            }
        }

        // Test 2: Data structure validation
        log('🔍 Test 2: Data Structure Validation', 'info');
        
        const techStack = loadedData['tech-stack.json'];
        if (techStack) {
            const hasCategories = ['frontend', 'backend', 'database', 'devops'].every(cat => Array.isArray(techStack[cat]));
            if (hasCategories) {
                const techCount = Object.values(techStack)
                    .filter(v => Array.isArray(v))
                    .reduce((sum, arr) => sum + arr.length, 0);
                log(`✅ Tech Stack: ${techCount} technologies across 4 categories`, 'pass');
            } else {
                log(`⚠️ Tech Stack: Missing expected categories<br><pre>${JSON.stringify(Object.keys(techStack), null, 2)}</pre>`, 'warn');
            }
        }

        // Test 3: Component data access patterns
        log('🔍 Test 3: Component Data Access Patterns', 'info');
        
        // Simulate how app.js loads data
        const appData = {
            source: 'mock',
            techStack: loadedData['tech-stack.json'],
            security: loadedData['security.json'],
            architecture: loadedData['architecture.json']
        };

        // Test tech-stack component pattern
        const techStackData = appData.techStack || appData;
        if (techStackData.frontend) {
            log(`✅ Tech Stack component can access frontend: ${techStackData.frontend.length} items`, 'pass');
        } else {
            log(`❌ Tech Stack component cannot access frontend data`, 'fail');
        }

        // Test security component pattern
        const securityData = appData.security || {};
        if (securityData.overall_score !== undefined) {
            log(`✅ Security component can access overall_score: ${securityData.overall_score}`, 'pass');
        } else {
            log(`⚠️ Security component missing overall_score`, 'warn');
        }

        // Test architecture component pattern
        const archData = appData.architecture || {};
        if (archData.application_type) {
            log(`✅ Architecture component can access application_type: ${archData.application_type}`, 'pass');
        } else {
            log(`⚠️ Architecture component missing application_type`, 'warn');
        }

        // Test 4: Tab rendering simulation
        log('🔍 Test 4: Tab Rendering Simulation', 'info');
        
        const tabs = [
            { id: 'overview', dataKey: 'overview', hasData: !!loadedData['overview.json'] },
            { id: 'executive', dataKey: 'executiveSummary', hasData: !!loadedData['executive-summary.json'] },
            { id: 'tech-stack', dataKey: 'techStack', hasData: !!loadedData['tech-stack.json'] },
            { id: 'security', dataKey: 'security', hasData: !!loadedData['security.json'] },
            { id: 'architecture', dataKey: 'architecture', hasData: !!loadedData['architecture.json'] },
            { id: 'code-org', dataKey: 'codeOrganization', hasData: !!loadedData['code-organization.json'] },
            { id: 'vendors', dataKey: 'vendors', hasData: !!loadedData['vendors.json'] }
        ];

        tabs.forEach(tab => {
            if (tab.hasData) {
                log(`✅ ${tab.id}: Data available (${tab.dataKey})`, 'pass');
            } else {
                log(`❌ ${tab.id}: No data (${tab.dataKey})`, 'fail');
            }
        });

        // Test 5: Check for undefined rendering
        log('🔍 Test 5: Undefined Value Detection', 'info');
        
        const testDiv = document.createElement('div');
        testDiv.innerHTML = String(undefined);
        if (testDiv.textContent === 'undefined') {
            log(`⚠️ Detected: Components rendering literal "undefined" text`, 'warn');
            log(`💡 Fix: Use nullish coalescing: <code>data.field ?? 'fallback'</code> or <code>data.field || 'fallback'</code>`, 'warn');
        }

        // Summary
        log('📊 Test Summary', 'info');
        const passCount = document.querySelectorAll('.pass').length;
        const failCount = document.querySelectorAll('.fail').length;
        const warnCount = document.querySelectorAll('.warn').length;
        log(`<strong>Results:</strong> ${passCount} passed, ${failCount} failed, ${warnCount} warnings`, 
            failCount > 0 ? 'fail' : passCount > 0 ? 'pass' : 'warn');
    </script>
</body>
</html>
