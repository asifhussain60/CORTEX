<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: white; }
        .tab-button { padding: 10px 20px; margin: 5px; background: #333; color: white; border: 1px solid #555; cursor: pointer; }
        .tab-button.active { background: #00d4ff; color: black; }
        .tab-content { display: none; padding: 20px; background: #252540; margin-top: 20px; border-radius: 8px; }
        .tab-content.active { display: block; }
        #status { background: rgba(16, 185, 129, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #10b981; }
    </style>
</head>
<body>
    <div id="status">
        <h3 class="level2-text-success-mt0">JavaScript Initialization Test</h3>
        <p id="init-status" class="level2-text-muted-0">Waiting for JavaScript...</p>
    </div>

    <h1>Tab Switching Test</h1>
    
    <div>
        <button class="tab-button active" data-tab="tab1">Tab 1</button>
        <button class="tab-button" data-tab="tab2">Tab 2</button>
        <button class="tab-button" data-tab="tab3">Tab 3</button>
    </div>
    
    <div id="tab1" class="tab-content active">
        <h2>Tab 1 Content</h2>
        <p>If you can see this and click other tabs, JavaScript is working!</p>
    </div>
    <div id="tab2" class="tab-content">
        <h2>Tab 2 Content</h2>
        <p>JavaScript successfully switched to Tab 2</p>
    </div>
    <div id="tab3" class="tab-content">
        <h2>Tab 3 Content</h2>
        <p>JavaScript successfully switched to Tab 3</p>
    </div>

    <script>
        console.log('🚀 Script loaded, readyState:', document.readyState);
        
        function initialize() {
            console.log('🔧 Initializing tabs...');
            document.getElementById('init-status').textContent = '✅ JavaScript initialized successfully! readyState: ' + document.readyState;
            document.getElementById('init-status').style.color = '#10b981';
            
            const buttons = document.querySelectorAll('.tab-button');
            const contents = document.querySelectorAll('.tab-content');
            
            console.log(`Found ${buttons.length} buttons, ${contents.length} contents`);
            
            buttons.forEach((button, index) => {
                button.addEventListener('click', () => {
                    const targetTab = button.dataset.tab;
                    console.log(`Clicked: ${targetTab}`);
                    
                    buttons.forEach(btn => btn.classList.remove('active'));
                    contents.forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    const target = document.getElementById(targetTab);
                    if (target) {
                        target.classList.add('active');
                        console.log(`✅ Activated: ${targetTab}`);
                    }
                });
            });
            
            console.log('✅ Initialization complete');
        }
        
        // Same fix as cortex-unified.js
        if (document.readyState === 'loading') {
            console.log('⏳ DOM loading, adding event listener');
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            console.log('✅ DOM already loaded, running immediately');
            initialize();
        }
    </script>
</body>
</html>
