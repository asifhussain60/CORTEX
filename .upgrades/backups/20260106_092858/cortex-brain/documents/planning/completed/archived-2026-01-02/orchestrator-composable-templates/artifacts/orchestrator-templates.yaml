# Orchestrator-Specific Template Compositions

**Generated:** 2025-12-31  
**Purpose:** Phase 4 - Tailored template compositions for each orchestrator

---

## 📊 Overview

This file defines how each orchestrator composes responses from composable blocks based on operation type and phase.

---

## 🎯 Planning Orchestrator Templates

### Operation 1: Plan Creation

**Context Signals:**
```yaml
operation_type: planning
response_phase: start
complexity_tier: STRUCTURED
orchestrator_type: planning
orchestrator_engaged: false
```

**Block Composition:**
```yaml
blocks:
  mandatory:
    - cortex_header
    - next_action
  
  conditional:
    - understanding        # If discovery_performed
    - approach            # If has_technical_challenge
    - plan_summary_table  # Always for plan_creation
    - plan_structure_tree # Always for plan_creation
    - plan_file_link      # Always after creation
  
  orchestrator_specific: []
```

**Rendering Order:**
1. `cortex_header` - "Plan Created"
2. `understanding` - Scope analysis
3. `plan_summary_table` - Plan metrics
4. `plan_structure_tree` - Folder structure
5. `plan_file_link` - Clickable link
6. `next_action` - "Review and execute plan"

---

### Operation 2: Plan Execution (In Progress)

**Context Signals:**
```yaml
operation_type: execution
response_phase: in_progress
complexity_tier: COMPREHENSIVE
orchestrator_type: planning
orchestrator_engaged: true
```

**Block Composition:**
```yaml
blocks:
  mandatory:
    - cortex_header_shield  # Shield mode active
    - progress_tracker_standard
    - validation_status_dor_dod
    - plan_file_link
    - next_action
  
  conditional:
    - threat_analysis       # If threat_analysis_enabled
    - changes              # If files_modified
    - deliverables_matrix  # If deliverables_tracked
  
  orchestrator_specific:
    - All planning blocks
```

**Rendering Order:**
1. `cortex_header_shield` - "Plan Execution"
2. `progress_tracker_standard` - Phase progress
3. `threat_analysis` - Security metrics (optional)
4. `deliverables_matrix` - Deliverable status (optional)
5. `validation_status_dor_dod` - DoR/DoD checks
6. `changes` - Files modified (optional)
7. `plan_file_link` - Link to plan
8. `next_action` - Next phase or task

---

### Operation 3: Plan Completion

**Context Signals:**
```yaml
operation_type: planning
response_phase: complete
complexity_tier: STRUCTURED
orchestrator_type: planning
orchestrator_engaged: true
```

**Block Composition:**
```yaml
blocks:
  mandatory:
    - cortex_header_shield
    - progress_tracker_standard
    - validation_status_dor_dod
    - achievements
  
  conditional:
    - changes              # If files_modified
    - deliverables_matrix  # If deliverables_tracked
    - plan_file_link
  
  orchestrator_specific: []
  
  completion_format: "🎉 CONGRATULATIONS"
```

**Rendering Order:**
1. `cortex_header_shield` - "Plan Complete"
2. `progress_tracker_standard` - All phases ✅
3. `achievements` - What was accomplished
4. `changes` - Final file summary
5. `validation_status_dor_dod` - Final checks
6. Completion banner - No next_action

