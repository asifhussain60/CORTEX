# Migration Path Matrix
# Defines upgrade paths for outdated technologies with effort estimates and blockers

migrations:
  # .NET Framework to .NET Core/Modern
  - from: ".NET Framework 4.8"
    to: ".NET 8"
    complexity: HIGH
    effort_per_project: 40
    risk: MEDIUM
    blockers:
      - "WCF (Windows Communication Foundation)"
      - "Remoting"
      - "AppDomains"
      - "Code Access Security"
      - "ASP.NET WebForms"
    steps:
      - "Run .NET Upgrade Assistant to assess compatibility"
      - "Identify and refactor incompatible APIs (WCF, Remoting)"
      - "Migrate to .NET 6 LTS (intermediate step)"
      - "Update NuGet packages to .NET-compatible versions"
      - "Upgrade to .NET 8"
      - "Test thoroughly with existing test suite"
    benefits:
      - "Cross-platform support (Linux, macOS)"
      - "Improved performance (50-300% faster)"
      - "Modern language features (C# 12)"
      - "Long-term support until Nov 2026"
  
  - from: ".NET Framework 4.7.2"
    to: ".NET 8"
    complexity: HIGH
    effort_per_project: 45
    risk: MEDIUM
    blockers:
      - "WCF"
      - "Remoting"
      - "AppDomains"
      - "Legacy ASP.NET dependencies"
    steps:
      - "Audit codebase for .NET Framework-specific APIs"
      - "Migrate to .NET 6 LTS first"
      - "Update all dependencies"
      - "Upgrade to .NET 8"
    benefits:
      - "Modern runtime"
      - "Cross-platform"
      - "Better performance"
  
  # Logging framework migrations
  - from: "log4net"
    to: "Serilog"
    complexity: MEDIUM
    effort_per_project: 8
    risk: LOW
    blockers:
      - "Custom appenders requiring rewrite"
      - "Configuration file format change (XML to code/JSON)"
    steps:
      - "Install Serilog NuGet packages"
      - "Replace log4net configuration with Serilog configuration"
      - "Update logging calls (ILog → ILogger)"
      - "Migrate custom appenders to Serilog sinks"
      - "Test logging output"
    benefits:
      - "Structured logging support"
      - "Better async performance"
      - "Rich ecosystem of sinks"
      - "Modern JSON output"
  
  - from: "NLog"
    to: "Serilog"
    complexity: LOW
    effort_per_project: 6
    risk: LOW
    blockers: []
    steps:
      - "Install Serilog packages"
      - "Replace NLog configuration"
      - "Update DI registration"
      - "Test logging"
    benefits:
      - "Structured logging"
      - "Better serialization"
  
  # ORM migrations
  - from: "Entity Framework 6"
    to: "Entity Framework Core 8"
    complexity: MEDIUM
    effort_per_project: 20
    risk: MEDIUM
    blockers:
      - "Lazy loading behavior changes"
      - "Complex types not supported in EF Core <5"
      - "DbContext API differences"
    steps:
      - "Install EF Core packages"
      - "Migrate DbContext configuration to fluent API"
      - "Update LINQ queries for EF Core compatibility"
      - "Test data access layer thoroughly"
      - "Update migrations"
    benefits:
      - "Cross-platform support"
      - "Better performance"
      - "Async-first design"
      - "Modern features (JSON columns, temporal tables)"
  
  # Dependency Injection
  - from: "Autofac"
    to: "Microsoft.Extensions.DependencyInjection"
    complexity: LOW
    effort_per_project: 4
    risk: LOW
    blockers:
      - "Named registrations require redesign"
      - "Module system different"
    steps:
      - "Replace Autofac container with built-in DI"
      - "Update service registrations"
      - "Remove Autofac-specific features"
      - "Test DI resolution"
    benefits:
      - "Built into .NET"
      - "No external dependency"
      - "Simpler configuration"
  
  # JavaScript/Node.js
  - from: "Node.js 14"
    to: "Node.js 20 LTS"
    complexity: LOW
    effort_per_project: 3
    risk: LOW
    blockers: []
    steps:
      - "Update Node.js runtime"
      - "Update npm packages"
      - "Test application"
    benefits:
      - "Security updates"
      - "Performance improvements"
      - "Modern ECMAScript features"
  
  - from: "Node.js 16"
    to: "Node.js 20 LTS"
    complexity: LOW
    effort_per_project: 2
    risk: LOW
    blockers: []
    steps:
      - "Update Node.js"
      - "Update packages"
      - "Test"
    benefits:
      - "LTS until Apr 2026"
      - "Better performance"
  
  # Database versions
  - from: "SQL Server 2016"
    to: "SQL Server 2022"
    complexity: MEDIUM
    effort_per_project: 15
    risk: LOW
    blockers:
      - "Compatibility level changes"
      - "Deprecated features"
    steps:
      - "Backup all databases"
      - "Test upgrade on non-production"
      - "Upgrade production"
      - "Update compatibility levels"
      - "Reindex and update statistics"
    benefits:
      - "Query performance improvements"
      - "New features (JSON, temporal tables)"
      - "Better security"
  
  # C# version upgrades
  - from: "C# 7.3"
    to: "C# 12"
    complexity: LOW
    effort_per_project: 2
    risk: LOW
    blockers: []
    steps:
      - "Update project file <LangVersion>12</LangVersion>"
      - "Adopt new language features gradually"
      - "Use nullable reference types"
    benefits:
      - "Modern syntax (pattern matching, records)"
      - "Nullable reference types"
      - "Better performance features"
  
  - from: "C# 8"
    to: "C# 12"
    complexity: LOW
    effort_per_project: 1
    risk: LOW
    blockers: []
    steps:
      - "Update language version"
      - "Enable new features"
    benefits:
      - "Latest language features"
      - "Better productivity"

# Priority factors for sorting migrations
priority_weights:
  risk_score: 0.4  # 40% - Higher risk = higher priority
  project_count: 0.3  # 30% - More projects = higher priority
  effort: 0.2  # 20% - Lower effort = higher priority (inverted)
  eol_urgency: 0.1  # 10% - Closer to EOL = higher priority

# Effort estimation factors
effort_multipliers:
  project_size:
    small: 0.7    # < 10K LOC
    medium: 1.0   # 10K-50K LOC
    large: 1.5    # > 50K LOC
  test_coverage:
    high: 0.8     # > 80% coverage
    medium: 1.0   # 40-80% coverage
    low: 1.3      # < 40% coverage
  team_experience:
    expert: 0.7
    intermediate: 1.0
    beginner: 1.5

# Phasing configuration
phasing:
  phase_1:
    duration_months: 6
    focus: "Critical & High Priority"
    criteria:
      - "EOL within 12 months"
      - "High security risk"
      - "Low effort migrations"
  phase_2:
    duration_months: 6
    focus: "Medium Priority"
    criteria:
      - "EOL within 24 months"
      - "Medium effort"
  phase_3:
    duration_months: 6
    focus: "Low Priority & Long-term"
    criteria:
      - "EOL > 24 months"
      - "Nice-to-have improvements"
