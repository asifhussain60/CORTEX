[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================================
# TEST MARKERS (v2.0: Optimized for Parallel + Stratified Execution)
# ============================================================================
markers =
    smoke: Fast baseline health check tests (<30s total)
    unit: Fast isolated unit tests (no I/O, <50ms each)
    integration: Tests requiring external dependencies (50-500ms)
    e2e: End-to-end workflow tests (1-10s)
    slow: Tests that take longer (>5s)
    ac(ac_id): Explicitly tag test with AC-ID for audit logging
    dashboard: Dashboard-related tests
    phase15: PHASE-15 neural observatory tests
    tdd_red: TDD RED phase - tests written, implementation pending
    tdd_green: TDD GREEN phase - tests passing
    brittleness: Brittleness remediation tests
    hallucination: Hallucination prevention tests
    ac_brittle_002: AC-BRITTLE-002 path abstraction tests
    ac_brittle_002_integration: AC-BRITTLE-002 integration tests
    dependency_heavy: Tests with expensive setup/teardown
    concurrent_safe: Safe to run in parallel (no global state)

# ============================================================================
# PARALLEL EXECUTION (pytest-xdist v3.8.0)
# ============================================================================
# Strategy 1 - Default (auto-parallel with load distribution):
#   pytest tests/unit -n auto --dist loadscope
#
# Strategy 2 - Smoke tests only (fast feedback):
#   pytest tests/unit -m smoke -n auto
#
# Strategy 3 - Serial mode (debugging):
#   pytest tests/unit -n 0 (or omit -n)

# ============================================================================
# PERFORMANCE TUNING & OUTPUT MONITORING
# ============================================================================
addopts = 
    -v
    --tb=short
    --maxfail=5

# ============================================================================
# TIMEOUT SETTINGS (prevent hanging tests per CORE-028)
# ============================================================================
timeout = 30
timeout_method = thread
timeout_func_only = false

# ============================================================================
# WARNING FILTERS (suppress known non-critical warnings)
# ============================================================================
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning:cortex.*

# ============================================================================
# COVERAGE SETTINGS (when using pytest-cov)
# ============================================================================
# Run with: pytest --cov=cortex --cov-report=html --cov-report=term-missing

# ============================================================================
# TEST EXECUTION PROFILES (Override with -o option or environment)
# ============================================================================
# 
# FAST (CI gate, ~2-3 minutes on 4 cores):
#   pytest tests/unit -m "not slow and not integration" -n auto --tb=line -q
#
# STANDARD (Default, ~5-8 minutes on 4 cores):
#   pytest tests/unit -n auto --dist loadscope
#
# COMPREHENSIVE (All tests, ~10-15 minutes on 4 cores):
#   pytest tests/ -n auto --dist loadscope
#
# SMOKE (Rapid regression check, <30 seconds):
#   pytest tests/unit -m smoke -n auto --tb=line -q
#
# SERIAL (Debugging/troubleshooting):
#   pytest tests/unit -n 0 -x --tb=short
#
# AC-SPECIFIC (Audit trail verification):
#   pytest tests/ -m ac -v --tb=short
#
# MCP-ONLY (Protocol compliance):
#   pytest tests/unit/mcp -n auto --dist loadscope
#
# GOVERNANCE-ONLY (Compliance checks):
#   pytest tests/unit/domain_brain -m "ac or governance" -n auto --tb=short