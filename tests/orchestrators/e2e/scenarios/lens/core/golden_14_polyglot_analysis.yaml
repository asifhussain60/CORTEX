---
# AC-GOLDEN-LENS-014: Polyglot Codebase Analysis Golden Test
# Authority: CORTEX Test Governance
# Purpose: Validate LENS ability to analyze multi-language codebases with cross-language relationships
# Created: 2026-02-17
# Priority: P1

scenario_id: "golden_14_polyglot_analysis"
name: "Polyglot Analysis - Multi-Language Integration"
description: |
  Tests LENS PolyglotAnalyzer's ability to analyze codebases with Python, TypeScript, C#, and SQL.
  Validates detection of cross-language boundaries, API contracts, and data flow.

authority_code: "AC-GOLDEN-LENS-014"
priority: "P1"
category: "core"
lens_capabilities:
  - "polyglot_analysis"
  - "multi_language_ast"
  - "cross_language_boundaries"
  - "api_contract_detection"

temp_files:
  - path: "backend/api/users.py"
    content: |
      from fastapi import APIRouter, Depends, HTTPException
      from sqlalchemy.orm import Session
      from typing import List
      from . import schemas, database
      
      router = APIRouter(prefix="/api/users", tags=["users"])
      
      @router.get("/", response_model=List[schemas.User])
      async def get_users(db: Session = Depends(database.get_db)):
          """Get all users - consumed by TypeScript frontend"""
          return db.query(database.User).all()
      
      @router.post("/", response_model=schemas.User)
      async def create_user(user: schemas.UserCreate, db: Session = Depends(database.get_db)):
          """Create user - called from React signup form"""
          db_user = database.User(**user.dict())
          db.add(db_user)
          db.commit()
          return db_user

  - path: "frontend/src/services/api.ts"
    content: |
      import axios from 'axios';
      
      const API_BASE = process.env.REACT_APP_API_URL || 'http://localhost:8000';
      
      export interface User {
        id: number;
        username: string;
        email: string;
        created_at: string;
      }
      
      export interface UserCreate {
        username: string;
        email: string;
        password: string;
      }
      
      export class UserService {
        /**
         * Fetch all users from Python FastAPI backend
         * Endpoint: GET /api/users/
         */
        static async getUsers(): Promise<User[]> {
          const response = await axios.get<User[]>(`${API_BASE}/api/users/`);
          return response.data;
        }
        
        /**
         * Create new user via Python backend
         * Endpoint: POST /api/users/
         */
        static async createUser(userData: UserCreate): Promise<User> {
          const response = await axios.post<User>(`${API_BASE}/api/users/`, userData);
          return response.data;
        }
      }

