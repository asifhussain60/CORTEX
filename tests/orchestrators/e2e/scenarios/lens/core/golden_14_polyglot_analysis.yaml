  - path: "database/migrations/001_create_users.sql"
    content: |
      -- Users table for Python backend
      -- Accessed by: backend/api/users.py
      -- Schema must match schemas.User TypeScript interface
      
      CREATE TABLE users (
          id SERIAL PRIMARY KEY,
          username VARCHAR(100) UNIQUE NOT NULL,
          email VARCHAR(255) UNIQUE NOT NULL,
          password_hash VARCHAR(255) NOT NULL,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      
      CREATE INDEX idx_users_email ON users(email);
      CREATE INDEX idx_users_username ON users(username);
      
      -- Trigger for updated_at
      CREATE OR REPLACE FUNCTION update_updated_at_column()
      RETURNS TRIGGER AS $$
      BEGIN
          NEW.updated_at = CURRENT_TIMESTAMP;
          RETURN NEW;
      END;
      $$ language 'plpgsql';
      
      CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON users
          FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

  - path: "docker-compose.yml"
    content: |
      version: '3.8'
      services:
        backend:
          build: ./backend
          ports:
            - "8000:8000"
          depends_on:
            - db
          environment:
            DATABASE_URL: postgresql://user:pass@db:5432/cortex
        
        frontend:
          build: ./frontend
          ports:
            - "3000:3000"
          environment:
            REACT_APP_API_URL: http://localhost:8000
        
        reporting:
          build: ./reporting
          depends_on:
            - backend
        
        db:
          image: postgres:15
          environment:
            POSTGRES_DB: cortex
            POSTGRES_USER: user
            POSTGRES_PASSWORD: pass

expected_outcome:
  validation_type: "polyglot_analysis"
  expected_results:
    languages_detected:
      - "Python"
      - "TypeScript"
      - "C#"
      - "SQL"
      - "YAML"
    
    cross_language_calls:
      min: 4
      description: "TypeScript->Python, C#->Python, Python->SQL"
    
    api_boundaries:
      - source: "TypeScript"
        target: "Python"
        endpoints: ["/api/users/"]
      - source: "C#"
        target: "Python"
        endpoints: ["/api/users/"]
    
    shared_data_models:
      - name: "User"
        languages: ["Python", "TypeScript", "C#", "SQL"]
        schema_alignment: true
    
    integration_points:
      - type: "REST_API"
        provider: "Python FastAPI"
        consumers: ["TypeScript", "C#"]
      - type: "DATABASE"
        provider: "PostgreSQL"
        consumers: ["Python"]
      - type: "CONTAINER_ORCHESTRATION"
        provider: "Docker Compose"
        services: ["backend", "frontend", "reporting", "db"]
    
    technology_stack:
      backend: ["Python", "FastAPI", "SQLAlchemy"]
      frontend: ["TypeScript", "React", "Axios"]
      reporting: ["C#", ".NET", "Newtonsoft.Json"]
      database: ["PostgreSQL"]
      infrastructure: ["Docker"]

