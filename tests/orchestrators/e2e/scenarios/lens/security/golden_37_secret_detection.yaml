      location: "config/production.py:3"
      severity: "CRITICAL"
      pattern: "sk_live_*"
    - type: "AWS_ACCESS_KEY"
      location: ".env.local:2"
      severity: "CRITICAL"
    - type: "PASSWORD"
      location: "config/production.py:2"
