      AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI_EXAMPLE_K7MDENG_bPxRfiCYEXAMPLEKEY
      GITHUB_TOKEN=ghp_EXAMPLE_1234567890abcdefghijklmnopqrstuvwxyz
  
