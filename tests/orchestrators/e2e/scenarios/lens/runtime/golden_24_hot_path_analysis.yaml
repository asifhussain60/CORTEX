temp_files:
  - path: "src/core/authentication.py"
    content: |
      import hashlib
      import time
      from typing import Optional
      
      class AuthService:
          """Authentication service with password verification and token generation."""
          
          def authenticate(self, username: str, password: str) -> Optional[str]:
              """
              Main authentication flow - called by every login request.
              This is a HOT PATH - executed hundreds of times per minute.
              """
              # Step 1: Lookup user (DB query)
              user = self._find_user(username)
              if not user:
                  return None
              
              # Step 2: Verify password (compute-intensive)
              if not self._verify_password(password, user['password_hash']):
                  return None
              
              # Step 3: Generate session token
              token = self._generate_token(user['id'])
              
              # Step 4: Log authentication event
              self._log_auth_event(user['id'], 'success')
              
              return token
          
          def _find_user(self, username: str) -> Optional[dict]:
              """DB lookup - moderate performance impact."""
              time.sleep(0.01)  # Simulate DB query
              return {'id': 123, 'username': username, 'password_hash': 'hash123'}
          
          def _verify_password(self, password: str, stored_hash: str) -> bool:
              """
              Password verification using bcrypt-equivalent hashing.
              PERFORMANCE BOTTLENECK: Takes ~100ms per verification.
              Consider: Password hash caching for repeated failed attempts.
              """
              time.sleep(0.1)  # Simulate bcrypt computation
              computed_hash = hashlib.sha256(password.encode()).hexdigest()
              return computed_hash == stored_hash
          
          def _generate_token(self, user_id: int) -> str:
              """Fast token generation - minimal overhead."""
              return f"token_{user_id}_{int(time.time())}"
          
          def _log_auth_event(self, user_id: int, status: str) -> None:
              """Logging - low priority, could be async."""
              pass  # Placeholder

  - path: "tests/test_authentication.py"
    content: |
      import pytest
      from src.core.authentication import AuthService
      
      class TestAuthService:
          """Authentication tests - executed frequently in CI/CD."""
          
          def test_successful_authentication(self):
              """Most common test path - mirrors production hot path."""
              auth = AuthService()
              token = auth.authenticate("testuser", "password123")
              assert token is not None
              assert token.startswith("token_")
          
          def test_failed_authentication_bad_password(self):
              """Second most common - tests security path."""
              auth = AuthService()
              token = auth.authenticate("testuser", "wrongpassword")
              assert token is None
          
          def test_failed_authentication_user_not_found(self):
              """Less common but still important."""
              auth = AuthService()
              token = auth.authenticate("nonexistent", "password123")
              assert token is None
          
          @pytest.mark.parametrize("username,password", [
              ("user1", "pass1"),
              ("user2", "pass2"),
              ("user3", "pass3"),
              ("user4", "pass4"),
              ("user5", "pass5"),
          ])
          def test_multiple_users(self, username, password):
              """Parameterized test - exercises hot path 5 times."""
              auth = AuthService()
              token = auth.authenticate(username, password)
              # Token generation happens 5 times

