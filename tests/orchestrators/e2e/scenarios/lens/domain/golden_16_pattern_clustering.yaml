---
# AC-GOLDEN-LENS-016: Pattern Clustering Golden Test
# Authority: CORTEX Test Governance
# Purpose: Validate LENS ability to cluster similar code patterns and identify reusable abstractions
# Created: 2026-02-17
# Priority: P1

scenario_id: "golden_16_pattern_clustering"
name: "Pattern Clustering - Duplication & Abstraction Detection"
description: |
  Tests LENS PatternClusterer's ability to identify similar code patterns across files,
  detect near-duplicate logic, and suggest opportunities for abstraction/refactoring.

authority_code: "AC-GOLDEN-LENS-016"
priority: "P1"
category: "domain"
lens_capabilities:
  - "pattern_clustering"
  - "code_similarity"
  - "duplication_detection"
  - "abstraction_opportunities"

temp_files:
  - path: "services/user_service.py"
    content: |
      from typing import Optional
      import logging
      
      logger = logging.getLogger(__name__)
      
      class UserService:
          def __init__(self, db):
              self.db = db
          
          def get_user_by_id(self, user_id: int) -> Optional[dict]:
              try:
                  logger.info(f"Fetching user {user_id}")
                  result = self.db.query("SELECT * FROM users WHERE id = ?", (user_id,))
                  if not result:
                      logger.warning(f"User {user_id} not found")
                      return None
                  logger.info(f"User {user_id} retrieved successfully")
                  return result[0]
              except Exception as e:
                  logger.error(f"Error fetching user {user_id}: {e}")
                  raise
          
          def update_user(self, user_id: int, data: dict) -> bool:
              try:
                  logger.info(f"Updating user {user_id}")
                  self.db.execute("UPDATE users SET name = ?, email = ? WHERE id = ?",
                                  (data['name'], data['email'], user_id))
                  logger.info(f"User {user_id} updated successfully")
                  return True
              except Exception as e:
                  logger.error(f"Error updating user {user_id}: {e}")
                  raise

