expected_outcome:
  validation_type: "capability_gap"
  expected_results:
    not_implemented_methods:
      min: 5
      examples:
        - "PaymentProcessor.process_apple_pay"
        - "PaymentProcessor.process_refund"
        - "NotificationService.send_sms"
        - "NotificationService.send_push_notification"
    
    stub_methods:
      min: 3
      description: "Methods with pass, placeholder, or NotImplementedError"
    
    todo_markers:
      min: 10
      categories:
        - "FEATURE_TODO"
        - "FIXME"
        - "INCOMPLETE"
        - "STUB"
        - "PLACEHOLDER"
    
    missing_capabilities:
