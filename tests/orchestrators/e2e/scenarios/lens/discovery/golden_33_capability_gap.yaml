        status: "NOT_IMPLEMENTED"
        priority: "MEDIUM"
        blocked_by: "SMS provider contract"
        target_date: "Q2 2026"
      - capability: "Fraud Detection"
        status: "PLACEHOLDER"
        priority: "HIGH"
