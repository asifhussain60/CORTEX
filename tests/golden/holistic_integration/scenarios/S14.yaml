# ============================================================================
# Scenario S14: Holistic validation gate
# ============================================================================
# Authority: Phase 51 § Tier 2 Medium Scenarios
# Complexity: Medium
# Validates: Dependency graph + regression risk
# ============================================================================

id: "S14"
name: "Holistic validation gate"
description: "Dependency graph + regression risk"
complexity: "medium"
intent: "REFACTOR"
user_request: "Rename MasterOrchestrator to CoreOrchestrator"

# Expected subsystem engagement
expected_components:
  - "HolisticValidationOrchestrator"
  - "DependencyGraphAnalyzer"

# Expected audit trail
expected_audit_events:
  - orchestrator: "DependencyGraphAnalyzer"
    activity: "BUILD_DEPENDENCY_GRAPH"
    workflow_stage: "VALIDATION"
    expected_fields:
      dependencies_count: ">= 10"
  
  - orchestrator: "HolisticValidationOrchestrator"
    activity: "CALCULATE_REGRESSION_RISK"
    workflow_stage: "VALIDATION"
    expected_fields:
      impact_radius: ">= 0.8"
      regression_risk: ">= 0.9"
  
  - orchestrator: "HolisticValidationOrchestrator"
    activity: "VALIDATION_VERDICT"
    workflow_stage: "VALIDATION"
    expected_fields:
      verdict: "BLOCK"
      recommendation: "not_null"

# DoD
dod:
  - "Dependency graph built from wiring.yaml"
  - "Impact radius calculated (affects 12+ orchestrators)"
  - "Regression risk = 0.9 (HIGH)"
  - "Validation verdict = BLOCK"
  - "Recommendation: Use adapter pattern instead"

performance:
  max_duration_seconds: 3.0
  
expected_outcome:
  validation_verdict: "BLOCK"
  impact_radius: ">= 0.8"
  regression_risk: ">= 0.9"
  recommendation_provided: true
