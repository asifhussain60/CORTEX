# ============================================================================
# Scenario S02: QUERY with LENS analysis
# ============================================================================
# Authority: Phase 51 § Tier 1 Simple Scenarios
# Complexity: Simple
# Validates: LENS context populated for comprehension
# ============================================================================

id: "S02"
name: "QUERY with LENS analysis"
description: "Validate LENS context populated for comprehension"
complexity: "simple"
intent: "QUERY"
user_request: "Show me the structure of cortex/lens/"

# Expected subsystem engagement
expected_components:
  - "MasterOrchestrator"
  - "InteractionOrchestrator"
  - "LENSOrchestrator"

not_expected:
  - "TDDOrchestrator"
  - "EnforcementOrchestrator"

# Expected audit trail sequence
expected_audit_events:
  - orchestrator: "MasterOrchestrator"
    activity: "COORDINATE_OPERATION"
    workflow_stage: "ENTRY"
    expected_fields:
      utterance: "Show me the structure of cortex/lens/"
  
  - orchestrator: "InteractionOrchestrator"
    activity: "EXECUTE_TURN"
    workflow_stage: "INTERACTION"
    expected_fields:
      lens_requested: true
  
  - orchestrator: "LENSOrchestrator"
    activity: "ANALYZE_WORKSPACE"
    workflow_stage: "INTELLIGENCE"
    expected_fields:
      target_path: "cortex/lens/"
      analysis_type: "directory_structure"

# Definition of Done
dod:
  - "InteractionOrchestrator.execute_turn_with_challenge() invoked"
  - "lens_context populated with AST, git, comments"
  - "AST analysis has file count > 0"
  - "Git context includes commit history"
  - "Response time < 2s"
  - "Audit trail shows LENS engagement"

# Performance requirements
performance:
  max_duration_seconds: 2.0
  
# Expected outcome
expected_outcome:
  intent: "QUERY"
  lens_context:
    files: "not_null"
    ast_analysis: "not_null"
    git_context: "not_null"
