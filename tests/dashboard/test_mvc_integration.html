<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVC Integration Test - Dashboard</title>
    <link rel="stylesheet" href="../dashboard.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0a0e27;
            color: #e0e6ff;
        }
        
        .test-report {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .test-section {
            margin-bottom: 25px;
        }
        
        .test-section h3 {
            margin-bottom: 15px;
            color: #60a5fa;
        }
        
        .test-result {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .test-result.pass {
            background: rgba(34, 197, 94, 0.15);
            border-left: 4px solid #22c55e;
        }
        
        .test-result.fail {
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid #ef4444;
        }
        
        .test-result.info {
            background: rgba(96, 165, 250, 0.15);
            border-left: 4px solid #60a5fa;
        }
        
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
        }
        
        .metric-label {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .log-entry {
            font-family: monospace;
            font-size: 13px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin: 4px 0;
        }
        
        .log-trace { color: #94a3b8; }
        .log-success { color: #22c55e; }
        .log-warning { color: #f59e0b; }
        .log-error { color: #ef4444; }
        
        /* Dashboard styles (minimal) */
        .tab-panel {
            display: none;
        }
        
        .tab-panel[aria-hidden="false"] {
            display: block;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 10px;">🧪 MVC Integration Test Suite</h1>
    <p style="text-align: center; opacity: 0.7; margin-bottom: 40px;">
        Phase 21 Dashboard - Model-View-Controller Validation
    </p>
    
    <div class="test-report">
        <h2>📊 Test Summary</h2>
        <div class="metric-grid">
            <div class="metric-card">
                <div class="metric-value" id="total-tests">0</div>
                <div class="metric-label">Total Tests</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="passed-tests" style="color: #22c55e;">0</div>
                <div class="metric-label">Passed</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="failed-tests" style="color: #ef4444;">0</div>
                <div class="metric-label">Failed</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="pass-rate">0%</div>
                <div class="metric-label">Pass Rate</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="deferred-count">0</div>
                <div class="metric-label">Deferred Renders</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="render-time">0ms</div>
                <div class="metric-label">Total Render Time</div>
            </div>
        </div>
    </div>
    
    <div class="test-report">
        <h2>🧬 Test Results</h2>
        <div id="test-results"></div>
    </div>
    
    <div class="test-report">
        <h2>📋 Execution Log</h2>
        <div id="execution-log" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
    
    <!-- Test dashboard structure -->
    <div id="test-dashboard" style="display: none;">
        <div class="tab-panel" id="overview-panel" aria-hidden="false">
            <div id="key-findings-list"></div>
            <div id="tech-stack-list"></div>
        </div>
        
        <div class="tab-panel" id="security-panel" aria-hidden="true">
            <div id="vulnerabilities-list"></div>
            <div id="vuln-types-list"></div>
            <div id="security-score-card"></div>
        </div>
        
        <div class="tab-panel" id="dependencies-panel" aria-hidden="true">
            <div id="license-summary"></div>
            <div id="dependencies-table"></div>
        </div>
        
        <div class="tab-panel" id="quality-panel" aria-hidden="true">
            <div id="code-smells-grid"></div>
            <div id="complexity-metrics"></div>
        </div>
        
        <div class="tab-panel" id="lens-panel" aria-hidden="true">
            <div id="patterns-list"></div>
            <div id="lens-recommendations"></div>
        </div>
    </div>
    
    <script>
        // Mock data generator
        function generateMockData() {
            return {
                overview: {
                    repository_name: "test-repo",
                    scan_date: new Date().toISOString(),
                    key_findings: [
                        "Repository uses Python 3.11+",
                        "85% test coverage detected",
                        "Clean security scan (0 critical issues)"
                    ],
                    tech_stack: [
                        { name: "Python", version: "3.11", confidence: 1.0 },
                        { name: "FastAPI", version: "0.104", confidence: 0.95 }
                    ]
                },
                security: {
                    vulnerabilities: [
                        {
                            title: "SQL Injection Risk",
                            severity: "high",
                            cwe_id: "CWE-89",
                            location: "src/database.py:145",
                            status: "open"
                        },
                        {
                            title: "Insecure Deserialization",
                            severity: "medium",
                            cwe_id: "CWE-502",
                            location: "src/api.py:67",
                            status: "in_progress"
                        }
                    ],
                    vulnerability_types: [
                        { type: "Injection", count: 3, severity_distribution: { high: 1, medium: 2 } },
                        { type: "XSS", count: 1, severity_distribution: { low: 1 } }
                    ]
                },
                dependencies: {
                    summary: { direct: 15, dev: 8, transitive: 42, outdated: 5, vulnerable: 2 },
                    packages: [
                        { name: "requests", version: "2.31.0", latest: "2.31.0", license: "Apache-2.0", type: "direct" },
                        { name: "pydantic", version: "2.4.0", latest: "2.5.0", license: "MIT", type: "direct" }
                    ],
                    licenses: {
                        distribution: { "MIT": 12, "Apache-2.0": 5, "BSD-3-Clause": 3 },
                        risk_assessment: "low",
                        problematic: []
                    }
                },
                quality: {
                    scores: {
                        maintainability: 85,
                        readability: 78,
                        documentation: 72,
                        testability: 88
                    },
                    code_smells: [
                        {
                            id: "CS-001",
                            name: "Long Method",
                            description: "Method exceeds 50 lines",
                            location: "src/processor.py:process_data()",
                            severity: "medium",
                            effort_to_fix: "1h"
                        },
                        {
                            id: "CS-002",
                            name: "Too Many Parameters",
                            description: "Function has 8 parameters",
                            location: "src/utils.py:configure()",
                            severity: "low",
                            effort_to_fix: "30min"
                        }
                    ]
                },
                lens: {
                    patterns_detected: [
                        { name: "Repository Pattern", count: 12, confidence: 0.92 },
                        { name: "Factory Pattern", count: 8, confidence: 0.87 }
                    ],
                    recommendations: [
                        "Consider implementing caching for frequently accessed data",
                        "Add retry logic to external API calls"
                    ]
                }
            };
        }
        
        // Enhanced logger
        class TestLogger {
            constructor() {
                this.logs = [];
                this.logContainer = document.getElementById('execution-log');
            }
            
            log(message, type = 'trace') {
                const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
                const entry = { timestamp, message, type };
                this.logs.push(entry);
                
                const logDiv = document.createElement('div');
                logDiv.className = `log-entry log-${type}`;
                logDiv.textContent = `[${timestamp}] ${message}`;
                this.logContainer.appendChild(logDiv);
                
                // Auto-scroll
                this.logContainer.scrollTop = this.logContainer.scrollHeight;
            }
            
            trace(msg) { this.log(msg, 'trace'); }
            success(msg) { this.log(msg, 'success'); }
            warn(msg) { this.log(msg, 'warning'); }
            error(msg) { this.log(msg, 'error'); }
        }
        
        // Import DeferredRenderer (same as in app.js)
        class LazyTabRenderer {
            constructor() {
                this.renderQueue = new Map();
            }
            
            queueRender(containerId, renderFn) {
                const container = document.getElementById(containerId);
                
                if (!container) {
                    this.renderQueue.set(containerId, renderFn);
                    return false;
                }
                
                const panel = container.closest('.tab-panel');
                if (panel && panel.getAttribute('aria-hidden') === 'true') {
                    this.renderQueue.set(containerId, renderFn);
                    return false;
                }
                
                try {
                    renderFn(container);
                } catch (error) {
                    console.error(`LazyTabRenderer: Render failed for ${containerId}:`, error);
                    // Continue execution - don't propagate error
                }
                return true;
            }
            
            flushQueue() {
                for (const [containerId, renderFn] of this.renderQueue.entries()) {
                    const container = document.getElementById(containerId);
                    
                    if (!container) {
                        continue;
                    }
                    
                    const panel = container.closest('.tab-panel');
                    const isHidden = panel && panel.getAttribute('aria-hidden') === 'true';
                    
                    if (!isHidden) {
                        try {
                            renderFn(container);
                        } catch (error) {
                            console.error(`LazyTabRenderer: Flush failed for ${containerId}:`, error);
                            // Continue processing remaining queue items
                        }
                        this.renderQueue.delete(containerId);
                    }
                }
            }
            
            getPendingCount() {
                return this.renderQueue.size;
            }
        }
        
        // Minimal Dashboard implementation for testing
        class TestDashboard {
            constructor(data) {
                this.data = data;
                this.lazyTabRenderer = new LazyTabRenderer();
            }
            
            renderAll() {
                this.renderKeyFindings();
                this.renderVulnerabilities();
                this.renderVulnerabilityTypes();
                this.renderLicenseSummary();
                this.renderCodeSmells();
                this.renderPatterns();
                
                return this.lazyTabRenderer.getPendingCount();
            }
            
            renderKeyFindings() {
                const container = document.getElementById('key-findings-list');
                const findings = this.data.overview?.key_findings || [];
                
                if (container && findings.length > 0) {
                    container.innerHTML = findings.map(f => `<div>${f}</div>`).join('');
                }
            }
            
            renderVulnerabilities() {
                const vulns = this.data.security?.vulnerabilities || [];
                
                this.lazyTabRenderer.queueRender('vulnerabilities-list', (container) => {
                    container.innerHTML = vulns.map(v => 
                        `<div class="glass-card">${v.title} (${v.severity})</div>`
                    ).join('');
                });
            }
            
            renderVulnerabilityTypes() {
                const types = this.data.security?.vulnerability_types || [];
                
                this.lazyTabRenderer.queueRender('vuln-types-list', (container) => {
                    container.innerHTML = types.map(t => 
                        `<div class="glass-card">${t.type}: ${t.count}</div>`
                    ).join('');
                });
            }
            
            renderLicenseSummary() {
                const licenses = this.data.dependencies?.licenses || {};
                
                this.lazyTabRenderer.queueRender('license-summary', (container) => {
                    const dist = licenses.distribution || {};
                    container.innerHTML = Object.entries(dist).map(([lic, count]) => 
                        `<div class="glass-card">${lic}: ${count}</div>`
                    ).join('');
                });
            }
            
            renderCodeSmells() {
                const smells = this.data.quality?.code_smells || [];
                
                this.lazyTabRenderer.queueRender('code-smells-grid', (container) => {
                    container.innerHTML = smells.map(s => 
                        `<div class="glass-card">${s.name} (${s.severity})</div>`
                    ).join('');
                });
            }
            
            renderPatterns() {
                const patterns = this.data.lens?.patterns_detected || [];
                
                this.lazyTabRenderer.queueRender('patterns-list', (container) => {
                    container.innerHTML = patterns.map(p => 
                        `<div class="glass-card">${p.name}: ${p.count}×</div>`
                    ).join('');
                });
            }
            
            activateTab(tabId) {
                // Hide all panels
                document.querySelectorAll('.tab-panel').forEach(panel => {
                    panel.setAttribute('aria-hidden', 'true');
                });
                
                // Show target panel
                const targetPanel = document.getElementById(`${tabId}-panel`);
                if (targetPanel) {
                    targetPanel.setAttribute('aria-hidden', 'false');
                }
                
                // Flush deferred renders
                this.lazyTabRenderer.flushQueue();
            }
        }
        
        // Test runner
        class MVCTestRunner {
            constructor() {
                this.logger = new TestLogger();
                this.passed = 0;
                this.failed = 0;
                this.totalRenderTime = 0;
            }
            
            async runTests() {
                this.logger.success('🚀 Starting MVC Integration Tests');
                
                await this.testInitialRender();
                await this.testDeferredRendering();
                await this.testTabActivation();
                await this.testDataBinding();
                await this.testPerformance();
                
                this.updateSummary();
                this.logger.success(`✅ Tests complete: ${this.passed} passed, ${this.failed} failed`);
            }
            
            async testInitialRender() {
                this.logger.trace('Test 1: Initial render (visible panel only)');
                
                const data = generateMockData();
                const dashboard = new TestDashboard(data);
                
                const startTime = performance.now();
                const deferredCount = dashboard.renderAll();
                const renderTime = performance.now() - startTime;
                
                this.totalRenderTime += renderTime;
                
                // Verify key findings rendered (visible panel)
                const keyFindings = document.getElementById('key-findings-list');
                const hasContent = keyFindings && keyFindings.innerHTML.length > 0;
                
                if (hasContent && deferredCount === 5) {
                    this.pass('✅ Visible content rendered immediately, 5 renders deferred');
                    document.getElementById('deferred-count').textContent = deferredCount;
                } else {
                    this.fail(`❌ Expected 5 deferred renders, got ${deferredCount}`);
                }
            }
            
            async testDeferredRendering() {
                this.logger.trace('Test 2: Deferred rendering for hidden panels');
                
                // Verify hidden panels have no content yet
                const vulnList = document.getElementById('vulnerabilities-list');
                const smellsGrid = document.getElementById('code-smells-grid');
                
                const vulnEmpty = !vulnList || vulnList.innerHTML.length === 0;
                const smellsEmpty = !smellsGrid || smellsGrid.innerHTML.length === 0;
                
                if (vulnEmpty && smellsEmpty) {
                    this.pass('✅ Hidden panel content not rendered yet (queued)');
                } else {
                    this.fail('❌ Hidden panel content should be queued, not rendered');
                }
            }
            
            async testTabActivation() {
                this.logger.trace('Test 3: Tab activation triggers deferred renders');
                
                const data = generateMockData();
                const dashboard = new TestDashboard(data);
                dashboard.renderAll();
                
                // Activate security tab
                dashboard.activateTab('security');
                
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Verify security content rendered
                const vulnList = document.getElementById('vulnerabilities-list');
                const hasVulnContent = vulnList && vulnList.innerHTML.length > 0;
                
                // Verify other hidden panels still empty
                const smellsGrid = document.getElementById('code-smells-grid');
                const smellsEmpty = !smellsGrid || smellsGrid.innerHTML.length === 0;
                
                if (hasVulnContent && smellsEmpty) {
                    this.pass('✅ Security tab content rendered, other panels still queued');
                    this.logger.success('Security panel rendered 2 components');
                } else {
                    this.fail('❌ Tab activation did not trigger correct renders');
                }
                
                // Activate quality tab
                dashboard.activateTab('quality');
                
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Verify quality content rendered
                const smellsGridAfter = document.getElementById('code-smells-grid');
                const hasSmellsContent = smellsGridAfter && smellsGridAfter.innerHTML.length > 0;
                
                if (hasSmellsContent) {
                    this.pass('✅ Quality tab content rendered on activation');
                    this.logger.success('Quality panel rendered code smells');
                } else {
                    this.fail('❌ Quality tab content not rendered');
                }
            }
            
            async testDataBinding() {
                this.logger.trace('Test 4: Data binding integrity');
                
                const data = generateMockData();
                const dashboard = new TestDashboard(data);
                dashboard.renderAll();
                
                // Activate security tab and check data
                dashboard.activateTab('security');
                await new Promise(resolve => setTimeout(resolve, 100));
                
                const vulnList = document.getElementById('vulnerabilities-list');
                const vulnContent = vulnList ? vulnList.innerHTML : '';
                
                const hasCorrectData = vulnContent.includes('SQL Injection') && 
                                       vulnContent.includes('high');
                
                if (hasCorrectData) {
                    this.pass('✅ Data correctly bound to view');
                    this.logger.success('Vulnerability data rendered correctly');
                } else {
                    this.fail('❌ Data binding failed or incorrect');
                }
            }
            
            async testPerformance() {
                this.logger.trace('Test 5: Performance validation');
                
                const data = generateMockData();
                const dashboard = new TestDashboard(data);
                
                const startTime = performance.now();
                dashboard.renderAll();
                dashboard.activateTab('security');
                dashboard.activateTab('dependencies');
                dashboard.activateTab('quality');
                const totalTime = performance.now() - startTime;
                
                this.totalRenderTime = totalTime;
                
                if (totalTime < 500) { // Should complete in under 500ms
                    this.pass(`✅ Performance good: ${totalTime.toFixed(2)}ms total`);
                    this.logger.success(`All renders completed in ${totalTime.toFixed(2)}ms`);
                } else {
                    this.warn(`⚠️ Performance warning: ${totalTime.toFixed(2)}ms (target: <500ms)`);
                }
            }
            
            pass(message) {
                this.passed++;
                this.addResult(message, 'pass');
            }
            
            fail(message) {
                this.failed++;
                this.addResult(message, 'fail');
                this.logger.error(message);
            }
            
            warn(message) {
                this.addResult(message, 'info');
                this.logger.warn(message);
            }
            
            addResult(message, type) {
                const resultsDiv = document.getElementById('test-results');
                const resultDiv = document.createElement('div');
                resultDiv.className = `test-result ${type}`;
                resultDiv.textContent = message;
                resultsDiv.appendChild(resultDiv);
            }
            
            updateSummary() {
                const total = this.passed + this.failed;
                const passRate = total > 0 ? ((this.passed / total) * 100).toFixed(1) : 0;
                
                document.getElementById('total-tests').textContent = total;
                document.getElementById('passed-tests').textContent = this.passed;
                document.getElementById('failed-tests').textContent = this.failed;
                document.getElementById('pass-rate').textContent = `${passRate}%`;
                document.getElementById('render-time').textContent = `${this.totalRenderTime.toFixed(2)}ms`;
            }
        }
        
        // Run tests on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const runner = new MVCTestRunner();
            await runner.runTests();
        });
    </script>
</body>
</html>
