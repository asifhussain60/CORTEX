# Sample Knowledge Base - Security Policies

metadata:
  domain: "security"
  version: "1.0"
  last_updated: "2026-02-15"

policies:
  - id: "SEC-001"
    title: "Input Validation Required"
    description: "All user inputs must be validated"
    severity: "HIGH"
    enforcement: "BLOCKING"
    
  - id: "SEC-002"
    title: "No Hardcoded Secrets"
    description: "Secrets must use environment variables"
    severity: "CRITICAL"
    enforcement: "BLOCKING"
    
  - id: "SEC-003"
    title: "SQL Injection Prevention"
    description: "Use parameterized queries only"
    severity: "CRITICAL"
    enforcement: "BLOCKING"

scan_patterns:
  - pattern: "eval\\("
    violation: "SEC-004"
    message: "eval() usage forbidden"
  
  - pattern: "exec\\("
    violation: "SEC-005"
    message: "exec() usage forbidden"
