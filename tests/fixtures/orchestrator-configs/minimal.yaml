# Sample Orchestrator Configuration - Minimal

name: "SampleOrchestrator"
type: "core"
tier: 1
priority: 10
capabilities:
  - "request_processing"
  - "event_emission"
dependencies: []
event_subscriptions:
  - event_type: "user_request_received"
    handler: "handle_user_request"
mcp_tools:
  - "sample_tool"
health_check:
  enabled: true
  timeout_seconds: 5
audit_trail:
  enabled: true
  ac_marker_prefix: "AC-SAMPLE"
