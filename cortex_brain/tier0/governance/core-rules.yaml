# ==============================================================================
# CORTEX TIER 0 GOVERNANCE - SKULL RULES
# ==============================================================================
# Purpose: Immutable core rules that define CORTEX's operational boundaries
# Status: ACTIVE
#
# CRITICAL: These rules are IMMUTABLE and take precedence over all other tiers.
# Tier 0 = SKULL rules - cannot be overridden.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
category: CORTEX_CORE
precedence: HIGHEST

metadata:
  rule_count: 35
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."

categories:
  - orchestration_lifecycle
  - response_formatting
  - portability
  - development_workflow
  - architecture_integrity
  - quality_gates
  - security_privacy
  - auditability

# ==============================================================================
# RULE DEFINITIONS
# ==============================================================================
rules:
  # --------------------------------------------------------------------------
  # CORE-001: Incremental Execution
  # --------------------------------------------------------------------------
  - rule_id: CORE-001
    category: orchestration_lifecycle
    severity: blocked
    name: Incremental Autonomous Execution
    description: |
      ALL orchestrators MUST work in small increments (<500 lines per turn)
      to prevent token limit errors. State MUST persist between increments.
    validation:
      - Operations split into <500 line increments
      - State persisted between turns
      - Token usage capped at 80%

  # --------------------------------------------------------------------------
  # CORE-002: Markdown Report Suppression
  # --------------------------------------------------------------------------
  - rule_id: CORE-002
    category: response_formatting
    severity: blocked
    name: Markdown Report Suppression (Workspace-Wide)
    description: |
      SUPPRESS markdown report/status files UNLESS explicitly requested by user.
      
      This rule applies workspace-wide (root + all subdirectories).
      
      BLOCKED patterns (unless explicitly requested):
      - *-summary.md (status summaries)
      - *-report.md (execution reports)
      - *-status.md (status documents)
      - DEPLOYMENT-*.md (deployment docs)
      - ORCHESTRATOR-*.md (orchestrator docs)
      - README.md (non-functional documentation)
      - *-QUICKSTART.md, *-GUIDE.md (unless explicitly requested)
      - Any markdown report/documentation files
      
      APPROVED locations (always allowed, no user request needed):
      - docs/ (primary documentation directory)
      - _workspaces/docs/ (workspace documentation directory)
      
      EXCEPTION: User may explicitly request markdown creation in request text.
      Example: "Create DEPLOYMENT-STATUS.md with..."
      Validation: validate_artifact_creation(path, user_explicit_request=True)
    validation:
      - Block markdown reports unless user explicitly requests in prompt
      - Allow docs/, _workspaces/docs/ unconditionally (structural)
      - Check for explicit user approval in request context
      - Log all suppressed artifacts with reason
    implementation:
      method: governance_registry.validate_artifact_creation(artifact_path, user_explicit_request=False)
      enforcement: master_orchestrator pre-execution gate + intent router

  # --------------------------------------------------------------------------
  # CORE-003: Visual Progress Bars
  # --------------------------------------------------------------------------
  - rule_id: CORE-003
    category: response_formatting
    severity: blocked
    name: Visual Progress Format
    description: |
      Responses MUST use visual progress bars (█████░░░░░) not code blocks.
    validation:
      - Progress bars present
      - No code snippets in summaries
      - Response ≤40 lines

  # --------------------------------------------------------------------------
  # CORE-004: Minimal Continuation
  # --------------------------------------------------------------------------
  - rule_id: CORE-004
    category: response_formatting
    severity: blocked
    name: Minimal Continuation Prompts
    description: |
      CONTINUATION-PROMPT.md MUST be <500 tokens. Use pointer pattern.
    validation:
      - Line count ≤12
      - Token count <500
      - File size <2KB

  # --------------------------------------------------------------------------
  # CORE-005: Path Portability (CRITICAL)
  # --------------------------------------------------------------------------
  - rule_id: CORE-005
    category: portability
    severity: blocked
    name: No Hardcoded Paths
    description: |
      NEVER use hardcoded absolute paths. Use src.core.path_resolver.
      WRONG: /Users/asifhussain/PROJECTS/CORTEX
      RIGHT: get_project_root() / "cortex_brain"
    validation:
      - No /Users/... paths
      - No C:\Users\... paths
      - Use get_project_root()
    implementation:
      utility: src.core.path_resolver

  # --------------------------------------------------------------------------
  # CORE-006: Setup Verification
  # --------------------------------------------------------------------------
  - rule_id: CORE-006
    category: orchestration_lifecycle
    severity: blocked
    name: Phase -2 Setup Verification
    description: |
      ALL orchestrators MUST verify dependencies before execution.
    validation:
      - Dependencies pass tests (not just file exists)
      - VSCode cache checked
      - Governance compliance validated

  # --------------------------------------------------------------------------
  # CORE-007: Teardown Refactor
  # --------------------------------------------------------------------------
  - rule_id: CORE-007
    category: orchestration_lifecycle
    severity: blocked
    name: Phase N+1 Teardown
    description: |
      ALL orchestrators MUST refactor and commit after completion.
    validation:
      - Refactor runs on modified files
      - Git commit follows pattern
      - Unused code removed

  # --------------------------------------------------------------------------
  # CORE-008: TDD Enforcement
  # --------------------------------------------------------------------------
  - rule_id: CORE-008
    category: development_workflow
    severity: blocked
    name: Test-First Development
    description: |
      Tests MUST exist BEFORE implementation (RED → GREEN → REFACTOR).
    validation:
      - Test file exists first
      - Test fails initially (RED)
      - Implementation makes test pass (GREEN)

  # --------------------------------------------------------------------------
  # CORE-009: Plan File Organization
  # --------------------------------------------------------------------------
  - rule_id: CORE-009
    category: architecture_integrity
    severity: blocked
    name: Files in Plan Folders
    description: |
      Plan artifacts MUST live in plan folder structure, not root.
    validation:
      - No plan files in workspace root
      - Artifacts in plan_folder/artifacts/
      - Tracking in plan_folder/tracking/

  # --------------------------------------------------------------------------
  # CORE-010: Script Consolidation
  # --------------------------------------------------------------------------
  - rule_id: CORE-010
    category: architecture_integrity
    severity: blocked
    name: No Duplicate Scripts
    description: |
      Scripts MUST be consolidated. No duplicate functionality.
    validation:
      - Scripts cataloged
      - Duplicate detection runs
      - Similar scripts consolidated

  # --------------------------------------------------------------------------
  # CORE-011: Type Hints
  # --------------------------------------------------------------------------
  - rule_id: CORE-011
    category: quality_gates
    severity: blocked
    name: Python Type Hints Required
    description: |
      ALL Python functions MUST have complete type hints.
    validation:
      - Parameters have type hints
      - Return types specified
      - No bare Any

  # --------------------------------------------------------------------------
  # CORE-012: Docstrings
  # --------------------------------------------------------------------------
  - rule_id: CORE-012
    category: quality_gates
    severity: blocked
    name: Docstrings Required
    description: |
      ALL public functions/classes MUST have Google-style docstrings.
    validation:
      - Public APIs documented
      - Args/Returns/Raises sections
      - Google style format

  # --------------------------------------------------------------------------
  # CORE-013: Error Handling
  # --------------------------------------------------------------------------
  - rule_id: CORE-013
    category: quality_gates
    severity: blocked
    name: Explicit Error Handling
    description: |
      NO bare except. NO catching generic Exception.
    validation:
      - Specific exception types
      - Custom exceptions for domain
      - Error context preserved

  # --------------------------------------------------------------------------
  # CORE-014: SOLID Principles
  # --------------------------------------------------------------------------
  - rule_id: CORE-014
    category: architecture_integrity
    severity: blocked
    name: SOLID Required
    description: |
      Code MUST follow SOLID principles (SRP, OCP, LSP, ISP, DIP).
    validation:
      - Single responsibility
      - Open/closed
      - Liskov substitution
      - Interface segregation
      - Dependency inversion

  # --------------------------------------------------------------------------
  # CORE-015: Import Organization
  # --------------------------------------------------------------------------
  - rule_id: CORE-015
    category: quality_gates
    severity: warning
    name: PEP 8 Imports
    description: |
      Imports grouped: stdlib, third-party, local. Sorted alphabetically.
    validation:
      - 3 import sections
      - Blank line between sections
      - No wildcard imports

  # --------------------------------------------------------------------------
  # CORE-016: Code Formatting
  # --------------------------------------------------------------------------
  - rule_id: CORE-016
    category: quality_gates
    severity: warning
    name: Black Formatting
    description: |
      Python code MUST be Black formatted (line length 100).
    validation:
      - Black --line-length=100
      - Double quotes
      - Trailing commas

  # --------------------------------------------------------------------------
  # CORE-017: Governance Enforcement
  # --------------------------------------------------------------------------
  - rule_id: CORE-017
    category: security_privacy
    severity: blocked
    name: Strict Governance
    description: |
      ALL rules enforced strictly. No overrides. All violations logged.
    validation:
      - Enforcement = strict
      - Override = false
      - Audit logging enabled

  # --------------------------------------------------------------------------
  # CORE-018: YAML-First
  # --------------------------------------------------------------------------
  - rule_id: CORE-018
    category: architecture_integrity
    severity: blocked
    name: YAML-First Design
    description: |
      Plans and configs MUST use YAML, not markdown. Machine-readable.
    validation:
      - No *-PLAN.md files
      - Use YAML for tracking
      - Exception: README.md, docs/

  # --------------------------------------------------------------------------
  # CORE-019: TDD-Master Required
  # --------------------------------------------------------------------------
  - rule_id: CORE-019
    category: development_workflow
    severity: blocked
    name: Route Through TDD-Master
    description: |
      ALL implementation requests route to TDD-Master orchestrator.
    validation:
      - '"implement X" routes to TDD-Master'
      - '"build X" routes to TDD-Master'
      - "Never write code directly"

  # --------------------------------------------------------------------------
  # CORE-020: No Markdown in cortex_brain
  # --------------------------------------------------------------------------
  - rule_id: CORE-020
    category: response_formatting
    severity: blocked
    name: No Markdown in Brain
    description: |
      cortex_brain/ MUST be YAML/JSON only. No .md files.
    validation:
      - cortex_brain/**/*.md blocked
      - Use YAML for all configs
      - Exception: None in brain

  # --------------------------------------------------------------------------
  # CORE-021: Scaffolder Required
  # --------------------------------------------------------------------------
  - rule_id: CORE-021
    category: architecture_integrity
    severity: blocked
    name: Use Orchestrator Scaffolder
    description: |
      NEW orchestrators MUST be created via scaffolder, not manually.
    validation:
      - Extends BaseOrchestratorV4
      - Has @register_with_master
      - Manifest created

  # --------------------------------------------------------------------------
  # CORE-022: Kebab-Case Naming
  # --------------------------------------------------------------------------
  - rule_id: CORE-022
    category: architecture_integrity
    severity: blocked
    name: Kebab-Case Files
    description: |
      File names MUST be kebab-case, ≤20 chars (excl. extension).
    validation:
      - Lowercase with hyphens
      - No underscores (except Python)
      - Max 20 characters

  # --------------------------------------------------------------------------
  # CORE-023: Pre-Commit Validation
  # --------------------------------------------------------------------------
  - rule_id: CORE-023
    category: quality_gates
    severity: blocked
    name: File Type Validation
    description: |
      Modified files MUST pass type-specific validation before commit.
    validation:
      - HTML: html5lib + WCAG AA
      - YAML: schema validation
      - Python: pytest pass

  # --------------------------------------------------------------------------
  # CORE-024: MCP Tool Decorator
  # --------------------------------------------------------------------------
  - rule_id: CORE-024
    category: architecture_integrity
    severity: blocked
    name: "@mcp_tool Required"
    description: |
      ALL MCP tools MUST use @mcp_tool decorator for registration.
    validation:
      - Decorator on all tools
      - Registered in manifest
      - No manual registration

  # --------------------------------------------------------------------------
  # CORE-025: Result Pattern
  # --------------------------------------------------------------------------
  - rule_id: CORE-025
    category: quality_gates
    severity: blocked
    name: Result[T] Pattern Required
    description: |
      Functions MUST return Result[T] for explicit error handling.
      Use Ok(value) for success, Err(message) for failure.
    validation:
      - Return Result, not exceptions
      - Check is_ok() before unwrap()
      - No silent failures
    implementation:
      module: src.core.result

  # --------------------------------------------------------------------------
  # CORE-026: Git Checkpoint Before Modify
  # --------------------------------------------------------------------------
  - rule_id: CORE-026
    category: development_workflow
    severity: blocked
    name: Git Checkpoint Required
    description: |
      Git checkpoint MUST be created before every major action.
      Enables efficient rollback on failures.
    validation:
      - Checkpoint before AC-ID start
      - Checkpoint before file modification
      - Commit after successful test pass
    commit_patterns:
      before_ac_id: "checkpoint: before AC-XXX-XXX"
      pre_modify: "checkpoint: pre-modify"
      tests_pass: "AC-XXX-XXX: [description] - tests passing"
      phase_complete: "phase-XX: COMPLETED - audit verified"

  # --------------------------------------------------------------------------
  # CORE-027: Audit Trail for Phase Completion
  # --------------------------------------------------------------------------
  - rule_id: CORE-027
    category: auditability
    severity: blocked
    name: Audit Verification Required
    description: |
      Phase completion MUST be validated by audit trail verification.
      No phase lock without queryable audit entries.
    validation:
      - Each AC-ID has AC_START, AC_EXECUTE, AC_COMPLETE entries
      - Hash chain integrity verified
      - "audit_verification.verified: true before locked: true"
    required_entries:
      per_ac_id: 3  # Minimum entries per AC-ID
      operations:
        - AC_START
        - AC_EXECUTE
        - AC_COMPLETE

  # --------------------------------------------------------------------------
  # CORE-028: Intelligent Kebab-Case File Naming (25-Char Limit)
  # --------------------------------------------------------------------------
  - rule_id: CORE-028
    category: architecture_integrity
    severity: blocked
    name: Intelligent Kebab-Case Naming with 25-Char Limit
    description: |
      ALL file names MUST follow intelligent kebab-case naming with strategic
      acronyms to keep names meaningful yet concise. Total length including
      extension MUST NOT exceed 25 characters. Names must be self-documenting
      without sacrificing clarity.
    
    naming_principles:
      - Use kebab-case (lowercase with hyphens, no underscores)
      - Employ semantic acronyms for common terms (e.g., cfg=config, mgr=manager)
      - "Order: [domain]-[component]-[purpose].[ext]"
      - "Max 25 chars total (e.g., cortex-vacuum-exec.py = 20 chars)"
      - "Avoid articles (a, the), conjunctions (and), prepositions (in, on, of)"
    
    acronym_dictionary:
      # Infrastructure
      cfg: config
      db: database
      mgr: manager
      svc: service
      util: utility
      
      # Operations
      exec: execution
      impl: implementation
      ver: verification
      sync: synchronization
      gen: generator
      
      # Analysis & Reporting
      rpt: report
      ana: analysis
      audit: audit log
      trc: trace
      diag: diagnostic
      
      # Governance & State
      gov: governance
      state: state machine
      ac: acceptance criteria
      ar: action record
      
      # Naming/Conventions
      conv: convention
      std: standard
      pat: pattern
      fmt: format
      
      # Testing & Quality
      test: test
      chk: check
      val: validation
      
      # Directories
      docs: documentation
      src: source
      lib: library
      etc: etc
    
    examples:
      valid:
        - "cortex-vacuum-exec.py"        # VALID: 20 chars (domain-component-purpose.ext)
        - "cortex-gov-core-rules.yaml"   # VALID: 22 chars (tier 0 rules file)
        - "plan-ac-tracker.db"           # VALID: 16 chars (plan AC tracking database)
        - "audit-hash-chain.py"          # VALID: 18 chars (audit hash chain manager)
        - "phase-completion-rpt.md"      # VALID: 21 chars (phase completion report)
        - "gov-cache-mgr.py"             # VALID: 14 chars (governance cache manager)
        
      invalid:
        - "cortex_vacuum_executor.py"    # INVALID: underscores instead of hyphens
        - "cortex-vacuum-implementation-executor.py"  # INVALID: 41 chars (exceeds 25 limit)
        - "CortexVacuumExecutor.py"      # INVALID: PascalCase instead of kebab-case
        - "cortex vacuum exec.py"        # INVALID: spaces instead of hyphens
    
    validation:
      - Matches regex pattern for kebab-case names
      - "Length check: strlen(filename) <= 25 (including extension)"
      - "No underscores except in Python files for internal/private symbols"
      - "Semantic check: name clearly indicates file purpose"
      - "Acronym check: non-standard acronyms documented in code comments"
    
    regex_pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]+)?$'
    
    enforcement:
      when: pre-commit
      action: reject
      message: |
        File naming violates CORE-028:
        - Must use kebab-case (lowercase-with-hyphens)
        - Must not exceed 25 characters including extension
        - Must use semantic acronyms from CORE-028 dictionary
        - Must be self-documenting of purpose
        
        See core-rules.yaml CORE-028 for examples and acronym dictionary.
    
    exceptions:
      - Python modules using _private naming for internal symbols (allowed)
      - Third-party libraries (not subject to renaming)
      - Generated files (if auto-generated by tools)
    
    implementation:
      check_script: "src/governance/validators/name-validator.py"
      git_hook: "pre-commit"
      audit_logging: true

  # --------------------------------------------------------------------------
  # CORE-029: Documentation Drift Prevention
  # --------------------------------------------------------------------------
  - rule_id: CORE-029
    category: quality_gates
    severity: blocked
    name: Documentation Drift Prevention
    description: |
      User-facing features MUST be documented in prompts BEFORE phase lock.
      Implementation code alone is insufficient - prompts must teach usage.
      
      This rule addresses the systematic gap where features are built but
      never documented, rendering them invisible to users.
    
    affected_prompts:
      - ".github/prompts/CORTEX.prompt.md"
      - ".github/prompts/copilot-instruction.md"
      - ".github/prompts/cortex-builder.prompt.md"
    
    validation:
      - New features have prompt documentation section
      - Response templates referenced in prompts
      - Phase lock blocked if prompt updates missing
      - Pre-lock validation script runs successfully
    
    ac_pattern:
      description: |
        Every feature AC (like FR-*, HP-*, etc.) that ships user-facing
        functionality MUST have a companion documentation AC.
      
      format: "AC-DOC-XXX-XX: Update [prompt file] with [feature] section"
      
      example: |
        # Feature AC
        AC-HP-003-01: Implement response header injection
        
        # Required Companion AC
        AC-DOC-003-01: Update CORTEX.prompt.md with Response Header section
    
    validation_script:
      path: "scripts/validate_phase_deliverables.py"
      required_checks:
        - files_to_create exist
        - files_to_modify exist
        - prompt sections documented
        - tier2 templates populated
    
    implementation:
      pre_lock_check: "python scripts/validate_phase_deliverables.py --phase {PHASE_ID} --strict"
      git_hook: "pre-commit"
      audit_logging: true

  # --------------------------------------------------------------------------
  # CORE-030: Mandatory Response Headers (Explicit)
  # --------------------------------------------------------------------------
  - rule_id: CORE-030
    category: response_formatting
    severity: blocked
    name: Mandatory CORTEX Response Headers
    description: |
      ALL responses generated by CORTEX agents MUST include the standard header.
      This is an explicit, non-negotiable Tier 0 requirement (CORE-REM-003-01).
      
      Every response from every agent in every context MUST start with:
      
      ## 🧠 CORTEX {operation}
      **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator} ✅
      
      ---
      
      [Response content]
      
      No exceptions. No variations. This is immutable.
    
    header_configuration:
      source: "cortex_brain/tier0/response-headers.yaml"
      precedence: "Load at agent startup, not overridable"
      validation: "All responses validated before return"
    
    format_rules:
      - "Emoji must be 🧠 (brain)"
      - "Operation name from operation_type context variable"
      - "Author always 'Asif Hussain'"
      - "Phase from current_phase context variable"
      - "Orchestrator from active_orchestrator context variable"
      - "Checkmark emoji ✅ after orchestrator name"
      - "Separator line (---) between header and copyright"
      - "Copyright line MUST be bold (**...**)"
      - "No variations or shortcuts"
    
    operation_types:
      - "Code Analysis"
      - "Code Review"
      - "Implementation Plan"
      - "AC Execution"
      - "Governance Evaluation"
      - "Debugging"
      - "Response"
      - "Planning"
      - "Testing"
      - "Validation"
    
    validation:
      - Header present on first line
      - Format exactly matches pattern
      - Operation type from allowed list
      - Phase format matches PHASE-NN
      - Orchestrator name matches active orchestrator
      - Copyright notice exact
      - Separator present
    
    implementation:
      module: "src.core.response_header_injector"
      class: "ResponseHeaderValidator"
      method: "validate_response(response: str) -> ValidationResult"
    
    enforcement:
      when: "before_response_return"
      action: "REJECT if header missing or malformed"
      escalation: "Orchestrator halt"
      audit_log: "CRITICAL"
    
    examples:
      valid_1: |
        ## 🧠 CORTEX Code Analysis
        **Author:** Asif Hussain | **Phase:** PHASE-13 | **Orchestrator:** MasterOrchestrator ✅
        
        ---
        
        Analysis results here...
      
      valid_2: |
        ## 🧠 CORTEX Implementation Plan
        **Author:** Asif Hussain | **Phase:** PHASE-DOC-REMEDIATION | **Orchestrator:** PlanningOrchestrator ✅
        
        ---
        
        Implementation plan here...
      
      invalid_1: |
        Analysis results here...
        (INVALID: No header at all)
      
      invalid_2: |
        ## CORTEX Code Analysis
        (INVALID: Missing emoji)
      
      invalid_3: |
        ## 🧠 CORTEX Code Analysis
        **Author:** Asif Hussain | **Phase:** PHASE-13 | **Orchestrator:** MasterOrchestrator
        
        (INVALID: Missing checkmark after orchestrator)

  # --------------------------------------------------------------------------
  # CORE-031: Declarative Autowiring Registry (Wiring Brittleness Fix)
  # --------------------------------------------------------------------------
  - rule_id: CORE-031
    category: architecture_integrity
    severity: blocked
    name: Declarative Autowiring Registry (Git-Safe Wiring)
    description: |
      Orchestrators and modules MUST use declarative YAML-based autowiring,
      NOT imperative Python code registration. This makes wiring Git-safe,
      surviving pulls/merges without manual re-registration.
      
      Problem solved: Wiring breaks after git operations because registration
      is embedded in import sequences and initialization order. Solution:
      Move all wiring to immutable YAML specs that survive git operations.
    
    wiring_requirements:
      - Each orchestrator/module has a {module_name}_wiring.yaml spec
      - Specs declare: dependencies, entry points, initialization order
      - AutowiringOrchestrator discovers and validates wiring at startup
      - YAML specs are Git-safe (merges respect data integrity)
      - Wiring is idempotent (can run discovery multiple times safely)
    
    yaml_spec_structure:
      location: "cortex/orchestrators/{module_name}_wiring.yaml"
      
      required_fields:
        - module_name: Name of orchestrator/module
        - version: Semantic version
        - dependencies: List of required modules with version constraints
        - provides: List of provided interfaces
        - entry_points: Initialization hooks (name, function, phase)
        - conflict_resolution: Rules for handling duplicate registrations
        - initialization_order: Topological sort key
      
      example: |
        module_name: master_orchestrator
        version: "2.0.0"
        
        dependencies:
          - name: intent_router
            version: ">=1.5.0"
            required: true
          - name: domain_orchestrator
            version: ">=2.0.0"
            required: true
          - name: governance_registry
            version: ">=1.0.0"
            required: true
        
        provides:
          - interface: IMasterOrchestrator
            version: "2.0.0"
          - interface: IOrchestrationPipeline
            version: "1.0.0"
        
        entry_points:
          - name: "initialize"
            function: "master_orchestrator.initialize()"
            phase: "startup"
            order: 100
          - name: "register_handlers"
            function: "master_orchestrator.register_handlers()"
            phase: "startup"
            order: 200
        
        initialization_order: 100
        
        conflict_resolution:
          duplicate_registration: "use_latest"
          missing_dependency: "fail_fast"
          circular_dependency: "reject_startup"
    
    autowiring_engine:
      class: "AutowiringOrchestrator"
      location: "cortex/orchestrators/core/autowiring_orchestrator.py"
      
      startup_sequence:
        1_discover: "Discover all *_wiring.yaml files"
        2_validate: "Validate dependency graph, detect cycles"
        3_resolve: "Topological sort, resolve version constraints"
        4_register: "Register modules into OrchestratorRegistry"
        5_verify: "Post-registration validation of wiring"
      
      methods:
        discover_wiring_specs: "Find all *_wiring.yaml files"
        validate_dependency_graph: "Check for cycles and conflicts"
        resolve_dependencies: "Topological sort of initialization order"
        register_modules: "Register into OrchestratorRegistry"
        validate_wiring: "Verify all registrations successful"
        query_wiring_state: "Expose wiring state for inspection"
    
    git_safety_guarantees:
      - "YAML specs are data, not code - merges respect structure"
      - "Pulling new modules auto-wires them (no manual registration)"
      - "Merge conflicts in YAML are explicit and visible"
      - "Wiring can be diffed and version-controlled"
      - "Breaking changes detected at startup, not hidden"
    
    validation_hooks:
      pre_execution:
        - "AutowiringOrchestrator.validate() must pass before any execution"
        - "Dependency resolution must be deterministic and complete"
        - "No circular dependencies allowed"
        - "All declared entry points must be discoverable"
      
      pre_commit:
        - "Check that *_wiring.yaml specs are valid YAML"
        - "Validate against wiring schema"
        - "Detect new modules missing wiring specs"
      
      post_merge:
        - "Run post-merge hook: cortex/scripts/validate-wiring-post-merge.sh"
        - "If wiring is invalid, merge marked with error"
        - "Report which modules are unwired or have conflicts"
    
    post_merge_validation_script: |
      #!/bin/bash
      # Post-merge wiring validation (executes after git merge)
      
      echo "Validating orchestrator wiring post-merge..."
      
      # Discover all orchestrator files
      ORCHESTRATORS=$(find cortex/orchestrators -name "*.py" -type f)
      
      # Check that each orchestrator has a corresponding _wiring.yaml
      MISSING_SPECS=0
      for orch in $ORCHESTRATORS; do
        spec_file="${orch%.*}_wiring.yaml"
        if [[ ! -f "$spec_file" && "$orch" != *"__pycache__"* ]]; then
          echo "❌ Missing wiring spec: $spec_file"
          ((MISSING_SPECS++))
        fi
      done
      
      if [[ $MISSING_SPECS -gt 0 ]]; then
        echo "ERROR: $MISSING_SPECS orchestrators are missing wiring specs"
        exit 1
      fi
      
      # Validate wiring specs can be parsed and dependencies resolved
      python3 -c "
        from cortex.orchestrators.core.autowiring_orchestrator import AutowiringOrchestrator
        engine = AutowiringOrchestrator()
        
        try:
          specs = engine.discover_wiring_specs()
          engine.validate_dependency_graph(specs)
          print(f'✅ All {len(specs)} wiring specs valid')
        except Exception as e:
          print(f'❌ Wiring validation failed: {e}')
          exit(1)
      "
      
      echo "✅ Wiring validation passed - merge is safe"
    
    success_criteria:
      - "No manual orchestrator registration code in __init__.py files"
      - "All wiring happens via AutowiringOrchestrator discovery"
      - "Post-merge: pull origin → all new modules auto-wire"
      - "Post-merge: no wiring re-registration needed"
      - "Merge conflicts in YAML are explicit, not silent"
      - "All orchestrators queryable: cortex-brain query wiring"
      - "Wiring state is version-controlled and diff-able"
    
    implementation_phases:
      phase_1_design:
        effort: "8-12 hours"
        deliverables:
          - "AutowiringOrchestrator class design"
          - "Wiring YAML spec schema definition"
          - "Post-merge validation script"
          - "Wiring state persistence design"
      
      phase_2_implementation:
        effort: "16-20 hours"
        deliverables:
          - "AutowiringOrchestrator implementation"
          - "Dependency graph validator"
          - "OrchestratorRegistry integration"
          - "Post-merge hook integration"
      
      phase_3_migration:
        effort: "12-16 hours"
        deliverables:
          - "Convert 23 existing orchestrators to declarative specs"
          - "Create *_wiring.yaml for each orchestrator"
          - "Remove imperative registration code"
          - "Comprehensive integration tests"
      
      phase_4_validation:
        effort: "4-6 hours"
        deliverables:
          - "Pull/merge brittleness tests"
          - "Multi-branch integration tests"
          - "Performance validation"
          - "Documentation"
    
    related_ac_ids:
      - "transform-001-orchestrator-wiring"
      - "AC-AR-AUTOWIRING-001"
      - "AC-AR-GIT-SAFETY-001"
    
    references:
      - "discovery-autowiring-system.md (docs/)"
      - "transform-001-orchestrator-wiring.yaml (roadmap/phases/)"
      - "orchestrator_registry.py (cortex/orchestrators/registry/)"
    
    enforcement:
      when: "phase-lock"
      action: "REJECT if non-declarative wiring found"
      audit_log: "CRITICAL"
      message: |
        CORE-031 Violation: Imperative orchestrator registration detected.
        
        All wiring MUST be declarative (YAML-based) per CORE-031.
        
        Required fixes:
        1. Create {module_name}_wiring.yaml spec for each orchestrator
        2. Move wiring logic from __init__.py to AutowiringOrchestrator
        3. Pass post-merge validation: scripts/validate-wiring-post-merge.sh
        4. Verify no imperative registration code remains
        
        See core-rules.yaml CORE-031 for complete specification.

  # --------------------------------------------------------------------------
  # CORE-032: Mandatory Intent Classification (DoR - Definition of Ready)
  # --------------------------------------------------------------------------
  - rule_id: CORE-032
    category: orchestration_lifecycle
    severity: blocked
    name: Mandatory Intent Classification (DoR Checkpoint)
    description: |
      EVERY operation MUST have intent classified BEFORE execution starts.
      This is enforced architecturally via IntentRouterFactory pattern.
      
      Problem: Intent classification was optional (Stage 1 skippable).
      Solution: Factory pattern makes classification MANDATORY - factory
      won't create orchestrator until intent is classified.
      
      Enforcement: IntentRouterFactory.create_router() → RouterInstance
      RouterInstance.execute() requires prior RouterInstance.classify_intent()
      Without classification: RuntimeError("Intent must be classified first")
    
    intent_classification_requirements:
      - "Every user operation must classify intent (IMPLEMENT, FIX, REFACTOR)"
      - "Classification MUST happen before orchestrator execution"
      - "Intent classification is DoR checkpoint (Definition of Ready)"
      - "Audit trail MUST log: INTENT_CLASSIFIED → ORCHESTRATOR_SELECTED"
      - "Bypass impossible (architectural enforcement via factory)"
    
    factory_pattern_enforcement:
      factory_class: "cortex.orchestrators.core.intent_router_factory.IntentRouterFactory"
      router_wrapper: "RouterInstance"
      
      enforcement_flow: |
        factory = IntentRouterFactory()
        router = factory.create_router()      # Returns RouterInstance
        
        # MANDATORY BEFORE execute():
        router.classify_intent(text="...", context={...})
        
        # Only NOW is execute allowed:
        result = router.execute_orchestrated(text="...", context={...})
        
        # Without classify_intent(), execute raises:
        # RuntimeError("Intent must be classified first")
    
    success_criteria:
      - "IntentRouterFactory prevents execution without classification"
      - "All 23 orchestrators created via factory"
      - "Intent classification logs to audit trail"
      - "Zero bypass paths (architectural enforcement)"
      - "100% of operations have classified intent"
    
    implementation:
      method: "Factory Pattern (IntentRouterFactory)"
      enforcement_point: "RouterInstance.execute_orchestrated()"
      audit_event: "INTENT_CLASSIFIED"
      severity_on_bypass: "blocked"

  # --------------------------------------------------------------------------
  # CORE-033: Mandatory State Persistence
  # --------------------------------------------------------------------------
  - rule_id: CORE-033
    category: orchestration_lifecycle
    severity: blocked
    name: Mandatory State Persistence (Operation Context Tracking)
    description: |
      ALL operations MUST persist state to StateManager.
      Enables resumption after interruption, cross-system consistency.
      
      State tracking includes:
      - Operation ID (unique per execution)
      - Intent type (IMPLEMENT, FIX, REFACTOR)
      - Current stage (1-4 in orchestration pipeline)
      - Context data (domain, priority, dependencies)
      - Timestamps (start, current, estimated completion)
      - Status (IN_PROGRESS, COMPLETED, FAILED)
    
    state_persistence_requirements:
      - "StateManager.persist_state() called after each stage"
      - "Includes: operation_id, stage, status, context, timestamp"
      - "State retrievable: StateManager.get_state(operation_id)"
      - "Enables: operation resumption after interruption"
      - "Audit trail includes: STATE_PERSISTED events"
    
    success_criteria:
      - "All orchestrators call StateManager.persist_state()"
      - "State persisted after Stage 1, 2, 3, 4"
      - "Operation resumable from last persisted stage"
      - "Audit trail includes STATE_PERSISTED events"

  # --------------------------------------------------------------------------
  # CORE-034: Mandatory Audit Logging
  # --------------------------------------------------------------------------
  - rule_id: CORE-034
    category: auditability
    severity: blocked
    name: Mandatory Audit Logging (Observability)"
    description: |
      ALL operations MUST log to AuditLogger.
      Provides observability, debugging, compliance tracking.
      
      Mandatory log events:
      - INTENT_CLASSIFIED (Stage 1 complete)
      - ORCHESTRATOR_SELECTED (Stage 2 complete)
      - GOVERNANCE_VALIDATED (Stage 3 complete)
      - EXECUTION_STARTED (Stage 4 start)
      - EXECUTION_COMPLETED (Stage 4 complete)
      - ERROR events (any stage failure)
    
    audit_logging_requirements:
      - "EnhancedAuditLogger.instance().log_event()"
      - "All 5+ events logged per operation"
      - "Timestamps ISO format (UTC)"
      - "Audit trail searchable by: operation_id, intent, stage, status"
      - "Retention: 90+ days"
    
    success_criteria:
      - "All orchestrators call AuditLogger.log_event()"
      - "No operations missing audit entries"
      - "Audit trail complete for all 4 stages"
      - "ERROR events captured with context"

  # --------------------------------------------------------------------------
  # CORE-035: Mandatory Response Header Injection
  # --------------------------------------------------------------------------
  - rule_id: CORE-035
    category: response_formatting
    severity: blocked
    name: Mandatory Response Header Injection (Response Metadata)"
    description: |
      ALL responses MUST include CORTEX metadata header.
      Clarifies CORE-030 enforcement (response header is mandatory).
      
      Required header format:
      ## 🧠 CORTEX {operation}
      **Author:** {author} | **Phase:** {phase} | **Orchestrator:** {orch} ✅
      
      Mandatory header fields:
      - {operation}: Task type (Implementation, Code Review, Testing, etc.)
      - {author}: Who performed the operation
      - {phase}: Current phase name
      - {orch}: Active orchestrator name
      - Checkmark: Always include ✅ (indicates operational status)
    
    response_header_requirements:
      - "Every response starts with: ## 🧠 CORTEX {operation}"
      - "Includes all 4 metadata fields (operation, author, phase, orch)"
      - "Includes checkmark: ✅ (operational status indicator)"
      - "Separated by markdown horizontal rule: ---"
      - "Response continues AFTER header and rule"
    
    success_criteria:
      - "All responses include CORTEX header"
      - "Header includes all 4 metadata fields"
      - "Checkmark present (✅) on every response"
      - "Header format consistent across all orchestrators"
      - "Zero responses missing header"

# ==============================================================================
# ENFORCEMENT CONFIGURATION
# ==============================================================================
enforcement:
  mode: strict
  override_allowed: false
  audit_logging: true
  git_hooks:
    pre_commit: true
    pre_push: true
  
  core_rule_precedence:
    highest: "CORE-030 (Response headers), CORE-031 (Declarative autowiring), CORE-032 (Intent classification)"
    high: "CORE-033 (State persistence), CORE-034 (Audit logging), CORE-035 (Response headers)"
    medium: "CORE-005 (Path portability), CORE-011 (Type hints), CORE-012 (Docstrings)"
    loading_sequence: "See cortex_brain/tier0/governance-loading-sequence.yaml"
  
  remediation_status:
    "CORE-032": "✅ COMPLETE - IntentRouterFactory enforces mandatory intent classification"
    "CORE-033": "IN_PROGRESS - StateManager integration in Stage 2"
    "CORE-034": "IN_PROGRESS - Audit logging framework in Stage 3"
    "CORE-035": "IN_PROGRESS - Response header validation in Stage 4"
