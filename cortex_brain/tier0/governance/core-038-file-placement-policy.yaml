# CORE-038: File Placement Policy
**Authority:** AC-FILE-PLACEMENT-ENFORCEMENT-001 | **Version:** 1.0 | **Date:** 2026-01-25 | **Status:** ACTIVE

---

## 📋 Rule Statement

**All files in CORTEX repository MUST be stored in appropriate subfolders following kebab-case naming convention. NO files are permitted in root directories of major folders.**

---

## ✅ What This Means

### Forbidden: Root-Level Files
```
❌ PROHIBITED:
./random-file.md                    (root level)
reports/my-report.md                (reports root)
docs/some-file.md                   (docs root)
cortex/my-module.py                 (cortex root)
cortex_brain/my-file.py             (cortex_brain root)
```

### Required: Subfolder Organization
```
✅ REQUIRED:
docs/{subfolder}/my-file.md         (in docs subfolder)
reports/{subfolder}/my-file.md      (in reports subfolder)
cortex/{module}/my-file.py          (in cortex module)
cortex_brain/{tier}/{domain}/my-file.py (in tier/domain)
```

---

## 📁 Allowed Root Exceptions (Whitelist)

**These files ARE allowed in repository root:**

- `README.md` — Project overview
- `.gitignore` — Git configuration
- `.gitattributes` — Git attributes
- `requirements.txt` — Python dependencies
- `pytest.ini` — Pytest configuration
- `pyproject.toml` — Project configuration
- `cortex-config.yaml` — CORTEX configuration
- `cortex-impl-map.yaml` — Implementation roadmap
- `mkdocs.yml` — Documentation configuration
- `pyrightconfig.json` — Pyright configuration
- `setup.py` — Package setup script
- `setup.cfg` — Setup configuration

**No other files are permitted at root level.**

---

## 📌 Naming Convention Requirements

### Kebab-Case Format
All files MUST use kebab-case (lowercase, hyphens, no spaces):

**✅ CORRECT:**
- `planning-orchestrator-v2-analysis.md`
- `core-038-enforcement-report.md`
- `phase-15-deliverables.yaml`
- `test-runner-integration.py`

**❌ INCORRECT:**
- `Planning Orchestrator Analysis.md` (spaces, capitals)
- `Planning_Orchestrator_Analysis.md` (underscores)
- `PlanningOrchestratorAnalysis.md` (camelCase)
- `planning.orchestrator.analysis.md` (dots)

### File Naming Principles
1. **Descriptive:** Name clearly describes content
2. **Concise:** Abbreviations acceptable (e.g., `orch` for orchestrator)
3. **Meaningful:** Avoid generic names like `file.md`, `document.pdf`
4. **Dated:** Include YYYY-MM-DD when time-sensitive
5. **Lowercase:** Always lowercase for consistency

