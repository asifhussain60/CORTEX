## 🆘 Violations & Remediation

### If Git Hook Blocks Your Commit

```bash
# Error message shows forbidden files
# Solution: Move files to correct subfolder

git mv reports/my-file.md reports/implementation/my-file.md
git add reports/
git commit -m "fix: Move file to correct subfolder (CORE-038)"
```

### If Agent Refuses to Create File

```
Error: File placement policy violation (CORE-038)
Solution: Specify correct subfolder path
  • .md reports → reports/{subfolder}/kebab-case-name.md
  • .py code → cortex/{module}/kebab-case-name.py
```

---

## 📞 Questions?

1. **Which subfolder?** Check the directory structure guide above
2. **Correct naming?** Use kebab-case, be descriptive, include date if time-sensitive
3. **File type match?** .md files in docs/reports, .py files in cortex/cortex_brain
4. **Already exists?** Don't duplicate; consolidate or use different name

