## 🚫 Enforcement Mechanisms

### Layer 1: Git Pre-Commit Hook
**When:** Attempted commit of root-level files  
**Effect:** Blocks commit with clear error message  
**Recovery:** Move files to correct subfolder, retry commit

### Layer 2: CORE-038 Governance Rule
**When:** AI agent tries to create root-level file  
**Effect:** GovernanceEnforcementAgent blocks operation  
**Recovery:** Update file path to subfolder, try again

### Layer 3: Tool Validation
**When:** `create_file` tool receives root-level path  
**Effect:** Tool rejects creation with helpful error  
**Recovery:** Agent uses correct subfolder path

---

## 📋 Checklist: Before Creating Any File

- [ ] File is NOT in repository root?
- [ ] File is in appropriate subfolder?
- [ ] File uses kebab-case name?
- [ ] File follows naming convention (descriptive, concise, dated)?
- [ ] File type matches location (docs/ for .md, cortex/ for .py)?
- [ ] Path is not duplicating existing file structure?
- [ ] File is not in whitelist-only locations?

**If ANY answer is "no," adjust the path before creation.**

---

## 🔍 Examples: Correct vs Incorrect

### Example 1: Analysis Report
```
❌ WRONG:  reports/my-analysis.md
✅ RIGHT:  reports/analysis/code-quality-planning-orch.md

Reason: Reports must be in subfolder, and file is code quality analysis
```

### Example 2: Documentation
```
❌ WRONG:  docs/getting-started.md
✅ RIGHT:  docs/getting-started/quick-start.md

Reason: Docs should be organized by topic in subfolders
```

### Example 3: Implementation
```
❌ WRONG:  cortex/my-new-feature.py
✅ RIGHT:  cortex/modules/my-new-feature.py

Reason: Implementation files go in appropriate module subfolder
```

### Example 4: Governance
```
❌ WRONG:  cortex_brain/core-037.yaml
✅ RIGHT:  cortex_brain/tier0/governance/core-037.yaml

Reason: Governance rules organized by tier and category
```

