## 🧪 Enforcement Mechanisms

### 1. Anti-Pattern Detection
**Location:** `cortex/tests/test_md_generation_blocker.py`

```python
# Test Pattern 1: Phase Event Listeners
def test_phase_complete_event_no_md_generation():
    """Verify phase completion events NEVER generate MD files."""
    assert not phase_executor.generates_md_files
    assert not autonomous_engine.writes_reports_as_md
```

### 2. Monkey-Patch Enforcement (Runtime)
```python
# Block any orchestrator attempt to write MD
original_write_text = Path.write_text
def blocked_write_text(self, data, *args, **kwargs):
    if str(self).endswith('.md'):
        # Check if MD write is user-requested
        if not is_user_requested_documentation():
            raise GovernanceViolation(
                f"CORE-039 VIOLATION: Attempted MD file write at {self}. "
                f"MD generation only allowed if explicitly user-requested."
            )
    return original_write_text(self, data, *args, **kwargs)

Path.write_text = blocked_write_text
```

### 3. Static Analysis Detection
**Grep Pattern:**
```bash
# Find phase-end MD generation patterns
grep -r "phase.*complete" cortex/orchestrators/ | grep "\.md"
grep -r "generate.*report" cortex/orchestrators/ | grep "write_text"
grep -r "reports/.*\.md" cortex/orchestrators/ | grep -v "docs/"
```

