## 🚫 Violation Examples & How They're Blocked

### Violation 1: Phase 14 Completion Report
**File:** `phase_14_completion.py`
```python
# BEFORE (VIOLATES CORE-039):
report_file = reports_dir / "phase-14-completion-report.md"
report_file.write_text(report)  # ❌ BLOCKED

# AFTER (COMPLIANT):
# Remove MD generation entirely
# If user requests: doc_path = docs/phase-14-completion.md
# If analysis needed: data_path = reports/phase-tracking/phase-14-metrics.yaml
```

### Violation 2: Autonomous Execution Report
**File:** `autonomous_execution_engine.py`
```python
# BEFORE (VIOLATES CORE-039):
def on_execution_complete(self):
    report_path = Path("reports/execution-report.md")
    report_path.write_text(self.generate_report())  # ❌ BLOCKED

# AFTER (COMPLIANT):
# Return data to caller, let user decide if documentation needed
# Store metrics in YAML if analysis needed
execution_metrics = {
    'total_phases': total_phases,
    'passed': passed_count,
    'failed': failed_count
}
metrics_path = Path("reports/metrics.yaml")
metrics_path.write_text(yaml.dump(execution_metrics))  # ✅ ALLOWED
```

### Violation 3: Documentation Tool Report
**File:** `cortex-doc.prompt.md` (Phase 6-7)
```python
# BEFORE (VIOLATES CORE-039):
def generate_fresh_documentation():
    # Phase 6: REPORTING
    report = "fresh-documentation-generation-{date}.md"
    report_path.write_text(report)  # ❌ BLOCKED

# AFTER (COMPLIANT):
# If user explicitly requested: /doc fresh-documentation
#   Then: create docs/fresh-documentation-guide.md
# Otherwise: Store results in YAML, return to user via UI
results = {
    'sections_generated': count,
    'diagrams_generated': count,
    'build_status': 'success'
}
results_path = Path("reports/documentation-results.yaml")
results_path.write_text(yaml.dump(results))  # ✅ ALLOWED
```

