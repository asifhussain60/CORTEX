## 📋 Rule Definition

### Purpose
Eliminate automatic MD file generation at phase end and enforce user-driven documentation workflow.
Only MD files explicitly requested by user are permitted.

### Scope
- ✅ APPLIES TO: All orchestrators, phase completion flows, autonomous executors, tools
- ✅ APPLIES TO: Phase end events, completion handlers, report generators
- ✅ APPLIES TO: Documentation pipelines, analysis tools
- ❌ EXCEPTION: MD files explicitly created by user request (via `/doc` command or similar)

---

## ✅ ALLOWED Patterns

### 1. User-Explicit Documentation
```python
# ALLOWED: User explicitly requests documentation
# Command: /doc {component}
# or: "Generate documentation for X"

# Handler checks user_requested=True before creating MD
if user_requested_documentation:
    doc_path = Path("docs/...md")
    doc_path.write_text(content)  # ✅ ALLOWED
```

### 2. MD Files in `docs/` folder (for user-requested content)
```python
# ALLOWED: Pre-existing or user-requested MD files in docs/ folder
docs_path = Path("docs/01-getting-started/README.md")
docs_path.write_text(content)  # ✅ ALLOWED (user-requested)
```

---

## ❌ FORBIDDEN Patterns

### 1. Phase-End MD Generation (AUTO-BLOCKED)
```python
# FORBIDDEN: Phase completion triggers MD file creation
def on_phase_complete(phase_num: int):
    # ❌ VIOLATION: Writing MD at phase end without user request
    report_path = Path("reports/phase-tracking/phase-{phase_num}-completion.md")
    report_path.write_text(f"Phase {phase_num} complete")  # BLOCKED
```

### 2. Autonomous Executor MD Reports (AUTO-BLOCKED)
```python
# FORBIDDEN: Execution engine generates MD reports
async def execute_phase(phase: Phase):
    # ... phase execution ...
    
    # ❌ VIOLATION: Writing MD at execution completion
    report = Path("reports/phase-tracking/phase-report.md")
    report.write_text(completion_report)  # BLOCKED
```

### 3. Tool-Driven Report Generation (AUTO-BLOCKED)
```python
# FORBIDDEN: Analysis tools auto-generating MD reports
class AnalysisTool:
    def generate_report(self):
        # ❌ VIOLATION: Automatic report generation
        report_path = Path("reports/analysis/analysis.md")
        report_path.write_text(self.analysis)  # BLOCKED
```

### 4. End-of-Session MD Output (AUTO-BLOCKED)
```python
# FORBIDDEN: Session completion generates MD summary
def on_session_complete():
    # ❌ VIOLATION: Auto-generating session summary MD
    summary = Path("reports/session-summary-{date}.md")
    summary.write_text(session_report)  # BLOCKED
```

