## 🎯 Remediation Checklist

### For Orchestrators
- [ ] Audit phase-complete event handlers
- [ ] Remove any `Path(...).write_text(...)`  calls with `.md` extension
- [ ] Replace with: YAML data files or return dict to caller
- [ ] Add test verifying no MD generation

### For Phase Completion Scripts
- [ ] Remove MD report generation
- [ ] Return completion metrics via YAML or console
- [ ] If summary needed: provide via CLI tool, not auto-file

### For Tools & Utilities
- [ ] Audit `generate_report()` methods
- [ ] Block MD file writes unless `user_requested=True`
- [ ] Add enforcement test before merge

### For Documentation Pipeline
- [ ] Separate "user-requested docs" from "phase reports"
- [ ] Only create MD in `docs/` if user explicitly requests
- [ ] Store phase metrics in `reports/{category}/{name}.yaml`

