validation_workflow:
  stages:
    - stage_id: "REVIEW-REQUEST"
      description: "Validation request submitted"
      required_experts: 1
      min_expertise_level: "intermediate"
    
    - stage_id: "EXPERT-REVIEW"
      description: "Expert reviews and validates entry"
      required_experts: 1
      min_expertise_level: "advanced"
    
    - stage_id: "QUALITY-CHECK"
      description: "Quality verification"
      required_experts: 1
      min_expertise_level: "advanced"
    
    - stage_id: "APPROVAL"
      description: "Final approval"
      required_experts: 1
      min_expertise_level: "expert"

validation_rules:
  - rule_id: "VW-001"
    description: "Entry must have domain expert assigned"
    severity: "critical"
    
  - rule_id: "VW-002"
    description: "Expert must be active"
    severity: "critical"
    
  - rule_id: "VW-003"
    description: "Expert must have domain expertise"
    severity: "critical"
    
  - rule_id: "VW-004"
    description: "Expert must have minimum expertise level"
    severity: "warning"
    
  - rule_id: "VW-005"
    description: "Validation must complete in required stages"
    severity: "critical"
