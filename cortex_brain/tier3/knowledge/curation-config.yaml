metadata:
  ac_id: "KN-002-01"
  title: "AI-Assisted Knowledge Curation"
  version: 1.0
  created_at: "2024-01-15T00:00:00Z"
  description: "Automated quality assessment, duplicate detection, and categorization"

quality_rules:
  - rule_id: "QR-001"
    name: "Minimum Content Length"
    description: "Entry must have sufficient content"
    weight: 0.15
    threshold: 100

  - rule_id: "QR-002"
    name: "Title Present"
    description: "Entry must have a title"
    weight: 0.10
    threshold: 1

  - rule_id: "QR-003"
    name: "Content Structure"
    description: "Entry should have structured content"
    weight: 0.20
    threshold: 0.5

  - rule_id: "QR-004"
    name: "Domain Assignment"
    description: "Entry must be assigned to a valid domain"
    weight: 0.15
    threshold: 1

  - rule_id: "QR-005"
    name: "References Present"
    description: "Entry should include references"
    weight: 0.10
    threshold: 1

  - rule_id: "QR-006"
    name: "Tags Present"
    description: "Entry should have relevant tags"
    weight: 0.15
    threshold: 2

  - rule_id: "QR-007"
    name: "Content Quality"
    description: "Content should be factually accurate"
    weight: 0.15
    threshold: 0.8

duplicate_detection:
  similarity_threshold: 0.85
  methods:
    - "exact_match"
    - "semantic_similarity"
    - "structural_match"
  
  exact_match_weight: 0.40
  semantic_weight: 0.35
  structural_weight: 0.25

category_suggestions:
  default_confidence_threshold: 0.6
  max_suggestions: 3
  
  keyword_domains:
    GOVERNANCE:
      - "governance"
      - "policy"
      - "compliance"
      - "rules"
      - "regulations"
    
    INTENT-ROUTING:
      - "intent"
      - "routing"
      - "classification"
      - "direction"
    
    HALLUCINATION-PREVENTION:
      - "fact"
      - "verification"
      - "truth"
      - "grounding"
    
    EXECUTION-ORCHESTRATION:
      - "orchestration"
      - "workflow"
      - "execution"
      - "coordination"
    
    DATA-MANAGEMENT:
      - "data"
      - "storage"
      - "database"
      - "query"
    
    OBSERVABILITY:
      - "monitoring"
      - "observability"
      - "metrics"
      - "logging"
    
    SECURITY:
      - "security"
      - "authentication"
      - "authorization"
      - "encryption"
    
    API-DESIGN:
      - "api"
      - "endpoint"
      - "rest"
      - "interface"
    
    ML-MODELS:
      - "model"
      - "machine learning"
      - "training"
      - "inference"
    
    KNOWLEDGE-CURATION:
      - "curation"
      - "quality"
      - "knowledge"
      - "categorization"
    
    TESTING-VALIDATION:
      - "testing"
      - "validation"
      - "test"
      - "verification"
    
    DEPLOYMENT:
      - "deployment"
      - "release"
      - "production"
      - "rollout"
    
    DOCUMENTATION:
      - "documentation"
      - "guide"
      - "tutorial"
      - "reference"
    
    PERFORMANCE:
      - "performance"
      - "optimization"
      - "scalability"
      - "efficiency"
    
    ARCHITECTURE:
      - "architecture"
      - "design"
      - "pattern"
      - "component"
    
    ERROR-HANDLING:
      - "error"
      - "exception"
      - "handling"
      - "recovery"

curation_workflow:
  stages:
    - stage_id: "ANALYSIS"
      description: "Initial quality and duplicate analysis"
      tools:
        - "quality_scorer"
        - "duplicate_detector"
    
    - stage_id: "SUGGESTION"
      description: "Generate improvement suggestions and categories"
      tools:
        - "category_suggester"
        - "recommendation_engine"
    
    - stage_id: "REVIEW"
      description: "Expert review of suggestions"
      required_expert: true
    
    - stage_id: "FINALIZATION"
      description: "Apply curation and update index"
      tools:
        - "indexer"
        - "metadata_updater"

quality_thresholds:
  excellent: 0.9
  good: 0.75
  acceptable: 0.60
  poor: 0.0

recommendation_types:
  - "expand_content"
  - "improve_structure"
  - "add_references"
  - "add_examples"
  - "clarify_title"
  - "add_tags"
  - "merge_duplicate"
  - "recategorize"
