<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex-SDD | Authentication</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Authentication Form Container -->
    <div id="auth-form-container"></div>

    <!-- NoScript Warning -->
    <noscript>
        <div style="padding: 20px; background: #fee; border: 2px solid #c00; margin: 20px; text-align: center;">
            <strong>JavaScript is disabled!</strong>
            <p>This application requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>

    <!-- Auth Form Bootstrap -->
    <script type="module">
        import { AuthForm } from './js/presentation/components/auth-form.js';
        import { MockDatabase } from './js/infrastructure/mock-db.js';
        import { StorageService } from './js/utils/storage.js';
        
        // Initialize database
        const storageService = new StorageService();
        const isSeeded = storageService.getItem('dbSeeded');
        if (!isSeeded) {
            await MockDatabase.seed();
            storageService.setItem('dbSeeded', true);
        }
        
        // Render auth form
        const authForm = new AuthForm();
        const container = document.getElementById('auth-form-container');
        authForm.render(container);
    </script>
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome Back</h2>
                
                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="login-username" class="block text-sm font-medium text-gray-700 mb-2">
                            Username
                        </label>
                        <input 
                            type="text" 
                            id="login-username" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Enter your username"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input 
                            type="password" 
                            id="login-password" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Enter your password"
                        >
                    </div>

                    <!-- Error Message -->
                    <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                        <!-- Error message will be displayed here -->
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
                    >
                        Login
                    </button>
                </div>

                <!-- Demo Credentials -->
                <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="text-xs font-semibold text-gray-600 mb-2">Demo Credentials:</p>
                    <p class="text-xs text-gray-600">
                        <strong>Admin:</strong> admin / Admin@123<br>
                        <strong>User:</strong> user / User@123
                    </p>
                </div>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="register-form" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Create Account</h2>
                
                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="register-username" class="block text-sm font-medium text-gray-700 mb-2">
                            Username
                        </label>
                        <input 
                            type="text" 
                            id="register-username" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Choose a username"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email
                        </label>
                        <input 
                            type="email" 
                            id="register-email" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="your.email@example.com"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input 
                            type="password" 
                            id="register-password" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Minimum 8 characters"
                        >
                        <!-- Password Strength Indicator -->
                        <div id="password-strength" class="mt-2 h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="password-strength-bar" class="h-full bg-gray-300 transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="password-strength-text" class="text-xs text-gray-500 mt-1">Password strength: Weak</p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label for="register-confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                            Confirm Password
                        </label>
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Re-enter your password"
                        >
                    </div>

                    <!-- Error Message -->
                    <div id="register-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                        <!-- Error message will be displayed here -->
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
                    >
                        Create Account
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-white text-sm mt-6">
            &copy; 2025 Cortex-SDD | Zero Dependencies • TDD • Clean Architecture
        </p>
    </div>

    <!-- NoScript Warning -->
    <noscript>
        <div style="padding: 20px; background: #fff; border: 2px solid #c00; margin: 20px; text-align: center;">
            <strong>JavaScript is disabled!</strong>
            <p>This application requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>

    <!-- Core JavaScript Modules (ES6) -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/utils/logger.js"></script>
    <script type="module" src="js/utils/storage.js"></script>
    <script type="module" src="js/domain/enums.js"></script>
    <script type="module" src="js/domain/entities.js"></script>
    <script type="module" src="js/infrastructure/mock-db.js"></script>
    <script type="module" src="js/infrastructure/repositories.js"></script>
    <script type="module" src="js/infrastructure/security.js"></script>
    <script type="module" src="js/application/dtos.js"></script>
    <script type="module" src="js/application/validators.js"></script>
    <script type="module" src="js/application/services.js"></script>
    <script type="module" src="js/presentation/components/auth-form.js"></script>

    <!-- Inline script for tab switching -->
    <script>
        function showLoginForm() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-tab').classList.add('text-blue-600', 'border-blue-600');
            document.getElementById('login-tab').classList.remove('text-gray-500');
            document.getElementById('register-tab').classList.add('text-gray-500');
            document.getElementById('register-tab').classList.remove('text-purple-600', 'border-purple-600');
        }

        function showRegisterForm() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('register-tab').classList.add('text-purple-600', 'border-purple-600');
            document.getElementById('register-tab').classList.remove('text-gray-500');
            document.getElementById('login-tab').classList.add('text-gray-500');
            document.getElementById('login-tab').classList.remove('text-blue-600', 'border-blue-600');
        }
    </script>
</body>
</html>
