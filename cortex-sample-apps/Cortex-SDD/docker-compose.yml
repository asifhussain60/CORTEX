# Docker Compose for Cortex-SDD Development Environment

version: '3.8'

services:
  # SQL Server 2022 for database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cortex-sdd-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CortexDev@2025"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cortex-sdd-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CortexDev@2025" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sqlserver-data:
    driver: local

networks:
  cortex-sdd-network:
    driver: bridge

# Usage:
# Start: docker-compose up -d
# Stop: docker-compose down
# View logs: docker-compose logs -f sqlserver
# Remove volumes: docker-compose down -v

# Connection String (for appsettings.json):
# "Server=localhost,1433;Database=CortexSDD;User Id=sa;Password=CortexDev@2025;TrustServerCertificate=True;"
