[pytest]
# Pytest configuration for documentation tests in docs/_tests/

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add docs/_tests to Python path
pythonpath = .

# Default test markers
markers =
    logo: Logo asset validation tests (dimensions, format, integrity)
    assets: Documentation asset tests
    integration: Integration tests for mkdocs build artifacts
    slow: Slow-running tests
    mkdocs: Tests run as part of mkdocs build process

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Console output
console_output_style = progress

# Timeout for tests (prevent hanging)
timeout = 30

# Minimum Python version
minversion = 3.8

# Logs
log_cli = false
log_cli_level = INFO
log_file = pytest-docs.log
log_file_level = DEBUG
