<body>

<div class="ambient-orb ambient-orb--cyan" aria-hidden="true"></div>

<main id="main-content">

  <!-- ── Split-Panel Reader ────────────────────────────────────────── -->

    <!-- Left Panel: Chapter List -->
    <aside class="chapter-sidebar" id="chapter-sidebar">

      <button class="sidebar-chapter" data-chapter="02" data-wave="0">
        <span class="sidebar-num">02</span>

      <button class="sidebar-chapter" data-chapter="03" data-wave="0">
        <span class="sidebar-num">03</span>

      <button class="sidebar-chapter" data-chapter="04" data-wave="0">
        <span class="sidebar-num">04</span>

      </button>

      <!-- Wave 1 -->
      <div class="sidebar-wave">
        <span class="sidebar-wave-badge sidebar-wave-badge--early">Wave 1 · Structure</span>

      <button class="sidebar-chapter" data-chapter="05" data-wave="1">

        <span class="sidebar-title">The Four Walls</span>

      <button class="sidebar-chapter" data-chapter="07" data-wave="1">
        <span class="sidebar-num">07</span>

      <!-- Wave 2 -->

        <span class="sidebar-wave-badge sidebar-wave-badge--growth">Wave 2 · Resilience</span>

      <button class="sidebar-chapter" data-chapter="09" data-wave="2">

      <button class="sidebar-chapter" data-chapter="10" data-wave="2">

      </button>

      <!-- Wave 3 -->
      <div class="sidebar-wave">

      <button class="sidebar-chapter" data-chapter="11" data-wave="3">
        <span class="sidebar-num">11</span>

      <button class="sidebar-chapter" data-chapter="12" data-wave="3">

    <!-- Right Panel: Chapter Content -->

          <span>Loading chapter…</span>
        </div>
      </div>
      <nav class="chapter-nav" id="chapter-nav" aria-label="Chapter navigation">
        <button class="chapter-nav-btn chapter-nav-prev" id="nav-prev" disabled>
          <i class="fas fa-arrow-left"></i> Previous
        </button>
        <span class="chapter-nav-counter" id="nav-counter">1 / 14</span>
        <button class="chapter-nav-btn chapter-nav-next" id="nav-next">
          The Hotel Receptionist <i class="fas fa-arrow-right"></i>
        </button>
      </nav>

  </div>

</main>

<script>
(function() {
  'use strict';

  const CHAPTERS = [
    { id: '01', file: 'chapters/01-Deep-in-the-Basement.md', title: 'Deep in the Basement', wave: 0, image: 'images/ch-01-prologue.png' },
    { id: '02', file: 'chapters/02-The-Hotel-Receptionist.md', title: 'The Hotel Receptionist', wave: 0, image: 'images/ch-02-hotel-receptionist.png' },
    { id: '03', file: 'chapters/03-The-Sacred-Rules.md', title: 'The Sacred Rules', wave: 0, image: 'images/ch-03-sacred-rules.png' },
    { id: '04', file: 'chapters/04-The-Conductors-Baton.md', title: "The Conductor's Baton", wave: 0, image: 'images/ch-04-conductors-baton.png' },
    { id: '05', file: 'chapters/05-Opening-the-Doors.md', title: 'Opening the Doors', wave: 1, image: 'images/ch-05-opening-doors.png' },
    { id: '06', file: 'chapters/06-The-Four-Walls.md', title: 'The Four Walls', wave: 1, image: 'images/ch-06-four-walls.png' },
    { id: '07', file: 'chapters/07-The-Crystal-Ball.md', title: 'The Crystal Ball', wave: 1, image: 'images/ch-07-crystal-ball.png' },
    { id: '08', file: 'chapters/08-The-Battle-for-Truth.md', title: 'The Battle for Truth', wave: 1, image: 'images/ch-08-battle-for-truth.png' },
    { id: '09', file: 'chapters/09-When-Everything-Broke.md', title: 'When Everything Broke', wave: 2, image: 'images/ch-09-everything-broke.png' },
    { id: '10', file: 'chapters/10-The-Reckoning.md', title: 'The Reckoning', wave: 2, image: 'images/ch-10-reckoning.png' },
    { id: '11', file: 'chapters/11-The-Great-Pruning.md', title: 'The Great Pruning', wave: 3, image: 'images/ch-11-great-pruning.png' },
    { id: '12', file: 'chapters/12-The-Pylance-Epiphany.md', title: 'The Pylance Epiphany', wave: 3, image: 'images/ch-12-pylance-epiphany.png' },
    { id: '13', file: 'chapters/13-The-3AM-Healer.md', title: 'The 3 AM Healer', wave: 3, image: 'images/ch-13-3am-healer.png' },
    { id: '14', file: 'chapters/14-The-Enterprise-Brain.md', title: 'The Enterprise Brain', wave: 4, image: 'images/ch-14-enterprise-brain.png' },
  ];

  const WAVE_LABELS = ['Origin', 'Structure', 'Resilience', 'Autonomy', 'Vision'];

  const contentEl = document.getElementById('chapter-content-inner');
  const sidebarBtns = document.querySelectorAll('.sidebar-chapter');
  const prevBtn = document.getElementById('nav-prev');
  const nextBtn = document.getElementById('nav-next');
  const counterEl = document.getElementById('nav-counter');
  const sidebarEl = document.getElementById('chapter-sidebar');
  const toggleBtn = document.getElementById('sidebar-toggle');
  const backdropEl = document.getElementById('sidebar-backdrop');

  let currentIdx = 0;
  const cache = {};

  /* ── Markdown Processing ─────────────────────────────────── */
  function stripFrontmatter(md) {
    const m = md.match(/^---\s*\n[\s\S]*?\n---\s*\n/);
    return m ? md.slice(m[0].length) : md;
  }

  function renderMd(md) {
    const clean = stripFrontmatter(md);
    // Strip leading h1 (# Title) — the JS header already renders ch.title
    const noH1 = clean.replace(/^#[^#][^\n]*\n+/, '');
    marked.setOptions({ breaks: false, gfm: true });
    return marked.parse(noH1);
  }

  /* ── Chapter Loading ─────────────────────────────────────── */
  async function loadChapter(idx) {
    if (idx < 0 || idx >= CHAPTERS.length) return;
    currentIdx = idx;
    const ch = CHAPTERS[idx];

    // Sidebar active
    sidebarBtns.forEach(b => b.classList.remove('active'));
    const btn = document.querySelector('[data-chapter="' + ch.id + '"]');
    if (btn) { btn.classList.add('active'); btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

    // Nav — update buttons with target chapter titles
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === CHAPTERS.length - 1;
    counterEl.textContent = (idx + 1) + ' / ' + CHAPTERS.length;
    prevBtn.innerHTML = idx > 0
      ? '<i class="fas fa-arrow-left"></i> ' + CHAPTERS[idx - 1].title
      : '<i class="fas fa-arrow-left"></i> Previous';
    nextBtn.innerHTML = idx < CHAPTERS.length - 1
      ? CHAPTERS[idx + 1].title + ' <i class="fas fa-arrow-right"></i>'
      : 'Next <i class="fas fa-arrow-right"></i>';

    // Loading state
    contentEl.innerHTML = '<div class="chapter-loading"><i class="fas fa-spinner fa-spin"></i><span>Loading…</span></div>';

    try {
      if (!cache[ch.id]) {
        const r = await fetch(ch.file);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        cache[ch.id] = await r.text();
      }
      const html = renderMd(cache[ch.id]);
      const label = ch.id === '01' ? 'PROLOGUE' : 'CHAPTER ' + parseInt(ch.id, 10);

      contentEl.innerHTML =
        '<div class="ch-header" data-wave="' + ch.wave + '">' +
          '<div class="ch-wave-tag">' + WAVE_LABELS[ch.wave] + '</div>' +
          '<div class="ch-label">' + label + '</div>' +
          '<h2 class="ch-title">' + ch.title + '</h2>' +
        '</div>' +
        '<div class="ch-body">' + html + '</div>';

      document.getElementById('chapter-content').scrollTop = 0;
      history.replaceState(null, '', '#chapter-' + ch.id);

      // Close sidebar on mobile after selection
      if (window.innerWidth < 900) closeSidebar();

    } catch (e) {
      contentEl.innerHTML = '<div class="chapter-error"><i class="fas fa-exclamation-triangle"></i><p>Could not load chapter.<br/><small>' + e.message + '</small></p></div>';
    }
  }

  /* ── Events ──────────────────────────────────────────────── */
  sidebarBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var chapterId = btn.getAttribute('data-chapter');
      var idx = CHAPTERS.findIndex(function(c) { return c.id === chapterId; });
      if (idx >= 0) loadChapter(idx);
    });
  });
  prevBtn.addEventListener('click', function() { loadChapter(currentIdx - 1); });
  nextBtn.addEventListener('click', function() { loadChapter(currentIdx + 1); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' && currentIdx > 0) loadChapter(currentIdx - 1);
    if (e.key === 'ArrowRight' && currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1);
  });

  // Mobile sidebar toggle
  function openSidebar() {
    sidebarEl.classList.add('open');
    if (backdropEl) backdropEl.classList.add('active');
  }
  function closeSidebar() {
    sidebarEl.classList.remove('open');
    if (backdropEl) backdropEl.classList.remove('active');
  }
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
    });
  }
  if (backdropEl) {
    backdropEl.addEventListener('click', closeSidebar);
  }

  /* ── Init ────────────────────────────────────────────────── */
  var hash = window.location.hash;
  var hm = hash.match(/chapter-(\d+)/);
  if (hm) {
    var hi = CHAPTERS.findIndex(function(c) { return c.id === hm[1].padStart(2, '0'); });
    loadChapter(hi >= 0 ? hi : 0);
  } else {
    loadChapter(0);
  }
})();
</script>
</body>
</html>
