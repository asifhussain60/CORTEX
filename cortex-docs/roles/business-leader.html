<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Documentation | Business Leader View</title>
    <link rel="stylesheet" href="../assets/css/glassmorphism.css">
    <link rel="stylesheet" href="../assets/css/layouts/role-landing.css">
    <script src="../assets/js/content-loader.js"></script>
</head>
<body>
    <div id="content-area">
        <div class="role-hero-header">
            <h1>👔 Business Leader View</h1>
            <div class="subtitle">ROI | Governance | Risk Mitigation</div>
            <a href="../index.html" class="btn-primary">Change Role</a>
        </div>
        <div id="main-content"></div>
    </div>

    <script>
        async function loadContent() {
            try {
                window.cortexLoader = new ContentLoader('../data/content.json');
                await window.cortexLoader.init();
                window.cortexLoader.renderContent('business-leader', '#main-content');
                
                // Update stats
                const categoryCount = window.cortexLoader.getCategoryCount('business-leader');
                const docCount = window.cortexLoader.getDocumentCount('business-leader');
                console.log(`📊 Showing ${docCount} documents across ${categoryCount} categories`);
            } catch (error) {
                document.querySelector('#main-content').innerHTML = `
                    <div class="glass-card glass-card--danger">
                        <h2 class="text-danger">❌ Content Load Error</h2>
                        <p>Failed to load documentation content. Please ensure content.json exists.</p>
                        <pre class="error-trace">${error.message}</pre>
                    </div>
                `;
            }
        }

        loadContent();
    </script>
</body>
</html>
