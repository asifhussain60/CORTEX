<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Documentation | Software Engineer View</title>
    <link rel="stylesheet" href="../assets/css/glassmorphism.css">
    <link rel="stylesheet" href="../assets/css/cortex-grid-system.css">
    <link rel="stylesheet" href="../assets/css/glass-ui-components.css">
    <link rel="stylesheet" href="../assets/css/layouts/role-landing.css">
    <script src="../assets/js/content-loader.js"></script>
</head>
<body>
    <div id="content-area">
        <div class="role-hero-header">
            <h1>💻 Software Engineer View</h1>
            <div class="subtitle">Wiring | LENS Analysis | TDD | Registry Logic</div>
            <a href="../index.html" class="btn-primary">Change Role</a>
        </div>

        <!-- Hero Banner (DALL-E generated — D3/Mermaid retained for all technical diagrams) -->
        <div class="generated-image-panel">
            <img src="../assets/images/generated/software-engineer/01-orchestrator-ecosystem-hero.png"
                 alt="CORTEX orchestrator ecosystem — 282 files across 9 domains visualised as a constellation network"
                 class="generated-diagram"
                 loading="lazy"
            <p class="image-caption">Orchestrator Ecosystem — 282 files across 9 domains, powered by MasterOrchestrator</p>
        </div>

        <div id="main-content"></div>
    </div>

    <script>
        async function loadContent() {
            try {
                window.cortexLoader = new ContentLoader('../data/content.json');
                await window.cortexLoader.init();
                window.cortexLoader.renderContent('software-engineer', '#main-content');
                
                const categoryCount = window.cortexLoader.getCategoryCount('software-engineer');
                const docCount = window.cortexLoader.getDocumentCount('software-engineer');
                console.log(`📊 Showing ${docCount} documents across ${categoryCount} categories`);
            } catch (error) {
                document.querySelector('#main-content').innerHTML = `
                    <div class="glass-card glass-card--danger">
                        <h2 class="text-danger">❌ Content Load Error</h2>
                        <p>Failed to load documentation content. Please ensure content.json exists.</p>
                        <pre class="error-trace">${error.message}</pre>
                    </div>
                `;
            }
        }

        loadContent();
    </script>
</body>
</html>
