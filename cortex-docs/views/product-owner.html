<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Documentation | Product Owner View</title>
    <link rel="stylesheet" href="../assets/css/glassmorphism.css">
    <script src="../assets/js/content-loader.js"></script>
    <style>
        body { padding: 2rem; }
        #content-area { max-width: 1200px; margin: 0 auto; }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 0.5rem;
            animation: electric-aura 5s ease-in-out infinite;
        }
        .subtitle {
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            font-size: 0.9rem;
            margin-bottom: 3rem;
        }
    </style>
</head>
<body>
    <div id="content-area">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1>📋 Product Owner View</h1>
            <div class="subtitle">Use Cases | Feature Flow | Definition of Ready</div>
            <a href="../index.html" class="btn-primary">Change Role</a>
        </div>
        <div id="main-content"></div>
    </div>

    <script>
        async function loadContent() {
            try {
                window.cortexLoader = new ContentLoader('../assets/data/content.json');
                await window.cortexLoader.init();
                window.cortexLoader.renderContent('product-owner', '#main-content');
                
                const categoryCount = window.cortexLoader.getCategoryCount('product-owner');
                const docCount = window.cortexLoader.getDocumentCount('product-owner');
                console.log(`📊 Showing ${docCount} documents across ${categoryCount} categories`);
            } catch (error) {
                document.querySelector('#main-content').innerHTML = `
                    <div class="glass-card" style="background: rgba(239, 68, 68, 0.1); border-color: var(--danger);">
                        <h2 style="color: var(--danger);">❌ Content Load Error</h2>
                        <p>Failed to load documentation content. Please ensure content.json exists.</p>
                        <pre style="margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 8px; overflow-x: auto;">${error.message}</pre>
                    </div>
                `;
            }
        }

        loadContent();
    </script>
</body>
</html>
