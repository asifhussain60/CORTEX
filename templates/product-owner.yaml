---
template_id: product-owner
name: "Product Owner Template"
version: 1.0
audience: Product Owners, Product Managers, Technical Program Managers
read_time: 7-10 minutes
word_count: 800-1500
voice: third-person neutral professional with analogies
authority: ENH-DIGEST-004 + User Requirements (brain analogies, daily life examples)

purpose: |
  Explanatory documentation for product professionals who need to understand
  how capabilities work, why they matter, and how to communicate value to
  stakeholders. Focus: practical understanding through relatable analogies
  and real-world scenarios.

structure:
  frontmatter:
    required_fields:
      - title: "[Feature/Capability Name]"
      - audience: "Product Owners, Product Managers"
      - read_time: "[X] minutes"
      - complexity: "beginner | intermediate | advanced"
      - voice: "Third-person with brain/daily life analogies"
      - last_updated: "[Date]"
    
    optional_disclaimer: |
      > **Notice:** This guide explains capability design and intended use patterns.
      > Actual implementation details may vary. Consult technical documentation
      > for specific integration requirements.

  sections:
    - id: overview
      title: "What It Does"
      word_count: 200-300
      requirements:
        - High-level capability description
        - Value proposition for product teams
        - When organizations use this
        - Key benefits (qualified language)
      
    - id: brain_analogy
      title: "Think of It Like..."
      word_count: 150-250
      mandatory: true
      requirements:
        - Brain analogy (visual cortex, memory formation, pattern recognition)
        - OR daily life analogy (hotel concierge, symphony conductor, GPS navigation)
        - Mapping between analogy and capability (point-by-point)
        - Accessible language (no medical jargon)
        - At least 2 unique analogies per document
      examples:
        brain: "Think of LENS like your brain's visual cortex..."
        daily_life: "Think of the orchestrator like a hotel concierge..."
      
    - id: how_it_works
      title: "How Organizations Use This"
      word_count: 300-400
      requirements:
        - Practical workflow explanation
        - Real-world scenario (NOT authentication)
        - Step-by-step process description
        - Integration with existing tools/processes
        - Expected outcomes (qualified)
      
    - id: diverse_scenarios
      title: "Example Scenarios"
      word_count: 200-300
      requirements:
        - Minimum 3 scenarios from different domains
        - Required domains: e-commerce, DevOps, FinTech, healthcare, OR other diverse areas
        - Each scenario: 60-100 words
        - Show adaptability across contexts
      domain_examples:
        e-commerce: "Online retailer detecting cart abandonment patterns..."
        devops: "Platform team automating deployment validation..."
        fintech: "Payment processor ensuring regulatory compliance..."
        healthcare: "Medical records system maintaining data integrity..."
      
    - id: value_proposition
      title: "Why Product Teams Care"
      word_count: 150-200
      requirements:
        - Connection to product goals (velocity, quality, user satisfaction)
        - Stakeholder communication points
        - Competitive advantages (if applicable)
        - Qualified benefits
      
    - id: considerations
      title: "What to Consider"
      word_count: 150-200
      requirements:
        - Prerequisites or dependencies
        - Potential challenges
        - Team readiness assessment
        - Gradual adoption approach

language_rules:
  voice:
    required: "Third-person with relatable explanations"
    examples:
      correct: "Product teams use this to...", "Organizations report..."
      incorrect: "You use this to...", "You will see..."
  
  analogy_requirements:
    density: "Minimum 2 analogies per document"
    types: ["brain (accessible)", "daily life", "nature", "common technology"]
    forbidden: ["Complex medical terminology", "Niche academic concepts"]
    examples:
      good: "Like a GPS recalculating when you miss a turn..."
      bad: "Like hippocampal neurogenesis during REM sleep..."
  
  technical_language:
    level: "Accessible technical"
    rule: "Translate jargon, provide context, explain 'why' not just 'what'"
    examples:
      avoid: "The AST traversal algorithm..."
      use: "The system reads code structure (like understanding sentence grammar)..."
  
  scenario_diversity:
    requirement: "No repetition of same domain across examples"
    enforcement: "Example diversity audit tool flags violations"
    target: "15+ unique domains across all documentation"

quality_gates:
  - Total word count: 800-1500
  - Minimum 2 unique analogies present
  - At least 3 diverse scenarios (different domains)
  - No authentication examples if auth already used elsewhere
  - Accessible technical language (jargon translated)
  - Third-person voice maintained
  - Practical focus (not academic)

analogy_templates:
  brain_analogy: |
    Think of [capability] like your brain's [brain function]. When you
    [familiar experience], your brain [what brain does]. Similarly, [capability]
    [what system does] to achieve [outcome]. Just as your brain [continues analogy],
    the system [continues parallel].
  
  daily_life_analogy: |
    Think of [capability] like [familiar role/object]. When you encounter
    [common situation], the [role/object] [familiar action]. In the same way,
    [capability] [system action] to [outcome]. The parallel extends further:
    [additional mapping points].

example_scenarios:
  e-commerce: |
    An online retailer uses this capability to analyze shopping cart patterns.
    When customers add items but don't complete checkout, the system identifies
    common friction points—slow payment processing, unclear shipping costs,
    or confusing coupon codes. Product teams use these insights to prioritize
    checkout improvements, potentially reducing abandonment rates.
  
  devops: |
    A platform engineering team uses this capability to validate deployment
    readiness. Before releasing to production, the system checks infrastructure
    compatibility, dependency versions, and configuration consistency. Teams
    receive early warnings about potential issues, allowing time to address
    problems before user impact.
  
  fintech: |
    A payment processing company uses this capability to maintain regulatory
    compliance across jurisdictions. As transaction patterns evolve, the system
    flags activities requiring additional documentation or approval. Compliance
    teams focus efforts on higher-risk transactions, while routine operations
    flow smoothly.

meta:
  created: 2026-02-15
  updated: 2026-02-15
  authority: ENH-DIGEST-004 + User Analogy Requirements
  validation: Pre-commit analogy density checker + example diversity audit
