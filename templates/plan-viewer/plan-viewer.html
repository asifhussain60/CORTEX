<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Plan Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header Section -->
        <header id="plan-header" class="header">
            <div class="header-content">
                <h1 id="plan-title" class="title">Loading...</h1>
                <div id="plan-metadata" class="metadata">
                    <span id="plan-id" class="plan-id"></span>
                    <span id="plan-status" class="status-badge"></span>
                </div>
            </div>
        </header>

        <!-- Progress Section -->
        <section id="progress-section" class="section">
            <h2>Overall Progress</h2>
            <div class="progress-container">
                <div class="progress-bar-container">
                    <pre id="progress-bar" class="progress-bar">░░░░░░░░░░░░░░░░░░░░</pre>
                    <span id="progress-percentage" class="progress-percentage">0%</span>
                    <span id="progress-status" class="progress-status">⏸️ NOT STARTED</span>
                </div>
                <div class="progress-stats">
                    <div class="stat">
                        <span class="stat-label">Completed:</span>
                        <span id="stat-completed" class="stat-value">0 hours</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Remaining:</span>
                        <span id="stat-remaining" class="stat-value">0 hours</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Total:</span>
                        <span id="stat-total" class="stat-value">0 hours</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Phases Section -->
        <section id="phases-section" class="section">
            <h2>Implementation Phases</h2>
            <div id="phases-list" class="phases-list">
                <!-- Populated by viewer.js -->
            </div>
        </section>

        <!-- Artifacts Section -->
        <section id="artifacts-section" class="section">
            <h2>Generated Artifacts</h2>
            <div id="artifacts-list" class="artifacts-list">
                <!-- Populated by viewer.js -->
            </div>
        </section>

        <!-- Footer -->
        <footer id="plan-footer" class="footer">
            <div class="footer-content">
                <span id="last-updated" class="last-updated">Last updated: Never</span>
                <span class="generator">Generated by CORTEX Planning Orchestrator v5</span>
            </div>
        </footer>
    </div>

    <script src="viewer.js"></script>
</body>
</html>
