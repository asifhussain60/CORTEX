<div class="chart-container">
    <div class="chart-title">Test Coverage Gauge</div>
    <svg id="coverage-gauge" width="400" height="300"></svg>
</div>
<script>
// Coverage gauge (donut chart)
const coverageData = [/* Data injected by dashboard_utility.py */];
const width = 400, height = 300;
const radius = Math.min(width, height) / 2 - 20;

const svg = d3.select("#coverage-gauge")
    .append("g")
    .attr("transform", `translate(${width/2},${height/2})`);

const arc = d3.arc()
    .innerRadius(radius * 0.6)
    .outerRadius(radius);

const pie = d3.pie().value(d => d.value);

// Color scale
const color = d3.scaleOrdinal()
    .domain(["covered", "uncovered"])
    .range(["#4caf50", "#e0e0e0"]);

svg.selectAll("path")
    .data(pie(coverageData))
    .enter()
    .append("path")
    .attr("d", arc)
    .attr("fill", d => color(d.data.category));
</script>
