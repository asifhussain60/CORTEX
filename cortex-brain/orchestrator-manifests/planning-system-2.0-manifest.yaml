# ========================================
# Metadata
# ========================================

metadata:
  orchestrator_name: "planning_system_2.0"
  version: "3.0.0"
  description: "Interactive feature planning with DoR/DoD, threat modeling, and TDD integration"
  category: "planning"
  deployment_tier: "user"
  status: "active"
  last_updated: "2025-12-08"
  compliance_baseline: "100% (All 8 requirements: 3 critical + 3 high + 2 medium)"
  maintainer: "CORTEX Planning Team"
  related_orchestrators:
    - "ado_planning_orchestrator"
    - "plan_execution_orchestrator_v2"
