# ========================================
# Compliance Rules
# ========================================

compliance_rules:
  - rule_id: "TDD_ENFORCEMENT"
    source: "cortex-brain/brain-protection-rules.yaml"
    enforcement_level: "mandatory"
    validation_method: "inject_tdd_requirements() must be called"
    applies_to: "all_plans"
    
  - rule_id: "DOCUMENT_ORGANIZATION"
    source: "cortex-brain/brain-protection-rules.yaml"
    enforcement_level: "mandatory"
    validation_method: "document_organizer.organize_document() must be called"
    applies_to: "all_plans"
    
  - rule_id: "GIT_CHECKPOINT_ENFORCEMENT"
    source: "cortex-brain/brain-protection-rules.yaml"
    enforcement_level: "recommended"
    validation_method: "git_checkpoint after each phase"
    applies_to: "all_phases"
    
  - rule_id: "PLANNING_MODE_ISOLATION"
    source: "cortex-brain/brain-protection-rules.yaml"
    enforcement_level: "recommended"
    validation_method: "PlanningSession state management"
    applies_to: "interactive_sessions"

# ========================================
# Metrics & Monitoring
# ========================================

metrics:
  success_criteria:
    - metric: "plan_completion_rate"
      target: ">90%"
      measurement: "Plans that reach execution phase / Total plans started"
    - metric: "dor_approval_time"
      target: "<10 minutes"
      measurement: "Time from plan start to DoR approval"
    - metric: "phase_approval_rate"
      target: ">95%"
      measurement: "Phases approved on first attempt / Total phases"
    - metric: "threat_detection_accuracy"
      target: ">80%"
      measurement: "Relevant threats identified / Total security-related features"
      
  quality_indicators:
    - indicator: "acceptance_criteria_clarity"
      measurement: "User acceptance rate of generated acceptance criteria"
    - indicator: "effort_estimation_accuracy"
      measurement: "Actual vs estimated effort (within 20%)"
    - indicator: "tdd_compliance"
      measurement: "Plans with complete TDD requirements / Total plans"

