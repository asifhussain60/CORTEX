# ========================================
# Requirements (From Gap Analysis)
# ========================================

requirements:
  # ===== Critical Requirements (Phase 1) =====
  
  - requirement_id: "REQ-001"
    name: "Acceptance Criteria Approval Gate"
    description: |
      Dedicated checkpoint after Phase 3 that blocks execution until user explicitly
      approves acceptance criteria. Visual checklist must be shown in response.
    priority: "critical"
    status: "implemented"
    validation_method: "method_exists"
    validation_criteria: "PlanningOrchestrator.approve_acceptance_criteria()"
    implementation_notes: |
      - Add checkpoint after _append_threat_analysis_to_plan()
      - Before autonomous execution starts
      - Visual checklist in response template
      - Block execution if not approved (unless autonomous mode)
    estimated_effort_hours: 4
    
  - requirement_id: "REQ-002"
    name: "Interactive DoR Workflow"
    description: |
      Iterative DoR refinement loop with question-based validation. User must
      approve each DoR item individually. Visual progress shown.
    priority: "critical"
    status: "implemented"
    validation_method: "method_exists"
    validation_criteria: "PlanningOrchestrator.refine_dor_interactive()"
    implementation_notes: |
      - Add DoR questioning loop before skeleton generation
      - Store DoR validation state in PlanningSession
      - Visual checklist rendering in response template
      - Iterate until user approves or requests skip
    estimated_effort_hours: 6
    current_implementation: "Basic DoR validation exists in _validate_definition_of_ready()"
    
  - requirement_id: "REQ-003"
    name: "Contextual Review Orchestrator Integration"
    description: |
      Run context-aware architectural review before planning starts.
      - Scope review to feature request (authentication, API, database, etc.)
      - Classify findings: BLOCKER (prevents feature), CRITICAL (should fix), IMPROVEMENT (optional)
      - Challenge user if blockers detected with auto-fix option
      - Inject Phase 0: Remediation for blocking issues
      - Add critical issues to Phase 1 tasks
    priority: "critical"
    status: "implemented"
    validation_method: "integration_test"
    validation_criteria: "run_contextual_review() called in plan initialization"
    implementation_notes: |
      ENHANCEMENT from original REQ-003 (2025-12-09):
      - Replaced run_architecture_review() with run_contextual_review()
      - Added _extract_scope_keywords() for feature-scoped analysis
      - Added _classify_findings_by_relevance() for blocker detection
      - Added _challenge_blockers() for user interaction
      - Added _generate_remediation_phase() for auto-fix
      - Phase 0 auto-injected when blockers detected
      - User can choose: auto-fix (add remediation), skip (risky), or abort
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_methods:
      - run_contextual_review()
      - _extract_scope_keywords()
      - _extract_findings_from_sections()
      - _classify_findings_by_relevance()
      - _calculate_finding_relevance()
      - _challenge_blockers()
      - _format_blocker_challenge()
      - _generate_remediation_phase()
    estimated_effort_hours: 7
    actual_effort_hours: 7
    
  # ===== Important Requirements (Phase 2) =====
  
  - requirement_id: "REQ-004"
    name: "SWAG Estimation via Swagger"
    description: |
      Parse Swagger/OpenAPI files to estimate API complexity and effort.
      Integrate with existing estimate_timeframe() method.
    priority: "high"
    status: "implemented"
    validation_method: "method_exists"
    validation_criteria: "PlanningOrchestrator.estimate_from_swagger()"
    implementation_notes: |
      - Create swagger_estimator.py utility
      - Parse OpenAPI 3.0/Swagger 2.0 files
      - Endpoint count → complexity mapping
      - Integrate with estimate_timeframe()
      - Store swagger metadata in plan
    estimated_effort_hours: 6
    
  - requirement_id: "REQ-005"
    name: "Visual Progress Rendering (Enhanced)"
    description: |
      Master Planner Visual Tracker with comprehensive metrics including:
      - Start/end timestamps with timezone display (ISO 8601)
      - Per-phase token usage tracking
      - Total token consumption across all phases
      - Phase duration in human-readable format (Xh Ym, Xm Ys, Xs)
      - Files modified count per phase
      - Sub-plan tracker update recording
      Use markdown tables for status visualization with progress bars.
    priority: "high"
    status: "implemented"
    validation_method: "template_validation"
    validation_criteria: "Enhanced progress tracker rendered in work_planner_success template"
    implementation_notes: |
      ENHANCEMENTS (2025-12-13):
      - PlanningSession model extended with:
        * phase_start_times (Dict[str, datetime])
        * phase_end_times (Dict[str, datetime])
        * tokens_used (Dict[str, int]) - per phase
        * total_tokens_used (int)
        * timezone (str) - auto-detected from system
        * sub_plan_updates (List[Dict]) - tracks sub-plan tracker updates
      - New methods added:
        * record_phase_start(phase_name) - records phase start time
        * record_phase_end(phase_name, tokens_used) - records completion with metrics
        * record_sub_plan_update(sub_plan, phase, notes) - tracks sub-plan updates
        * _format_duration(seconds) - human-readable duration (2h 15m, 3m 45s)
        * _get_phase_duration(phase_name) - phase duration with ⏳ for in-progress
      - render_progress_table() enhanced with:
        * Plan name, start/end timestamps, timezone
        * Total duration and tokens
        * Per-phase duration, tokens, progress bars
        * Sub-plan update counter
      - update_phase_status() enhanced with:
        * Auto-records phase start on first 'in_progress' status
        * Auto-records phase end with tokens on 'completed' status
        * Logs timing and token metrics
        * Renders updated progress table after completion
      - Sub-plan template updated with:
        * Master tracker update template at top
        * 🎯 CHECKPOINT after each phase with explicit instructions
        * Master tracker must be updated before proceeding to next phase
    estimated_effort_hours: 6
    actual_effort_hours: 6
    implementation_files:
      - "src/orchestrators/session_model.py (PlanningSession enhanced)"
      - "src/orchestrators/planning_orchestrator.py (update_phase_status enhanced)"
      - "cortex-brain/documents/planning/orchestrators/00-sub-plan-template.md (checkpoint gates)"
    enhancement_date: "2025-12-13"
    
  - requirement_id: "REQ-006"
    name: "Learning Library Auto-Documentation"
    description: |
      Auto-create learning library entries after each phase documenting work
      done for business users, engineers, and product owners.
    priority: "high"
    status: "implemented"
    validation_method: "method_exists"
    validation_criteria: "PlanningOrchestrator.document_phase_to_learning_library()"
    implementation_notes: |
      - Create learning_library_writer.py
      - Template-based doc generation per phase
      - Categorize: planning_strategies/milestones/ado_workflows
      - Auto-commit learning docs after phase completion
    estimated_effort_hours: 5
    current_implementation: "Reminders exist (_generate_documentation_reminder) but no auto-creation"
    
  # ===== Enhancement Requirements (Phase 3) =====
  
  - requirement_id: "REQ-007"
    name: "Interactive Threat Modeling"
    description: |
      Add user review option for threat analysis results. Allow threat dismissal
      with justification and prioritization workflow.
    priority: "medium"
    status: "implemented"
    validation_method: "method_exists"
    validation_criteria: "PlanningOrchestrator.review_threats_interactive()"
    implementation_notes: |
      - Add threat review checkpoint after _run_threat_analysis()
      - Show threat list with risk ratings
      - Allow dismissal with justification
      - Update plan with user decisions
    estimated_effort_hours: 3
    current_implementation: "Threat analysis runs automatically (_run_threat_analysis)"
    
  - requirement_id: "REQ-008"
    name: "TDD Reminders Visibility"
    description: |
      Surface TDD requirements in Copilot Chat response showing what was
      injected into plan with visual checklist.
    priority: "medium"
    status: "implemented"
    validation_method: "template_validation"
    validation_criteria: "TDD section visible in work_planner_success template"
    implementation_notes: |
      - Add TDD requirements section to response template
      - Show injected DoR/DoD items
      - Visual TDD workflow reminder
      - Link to TDD Mastery guide
    estimated_effort_hours: 2
    current_implementation: "TDD injection works (inject_tdd_requirements) but silent"

# ========================================
# Integrations
# ========================================

integrations:
  - integration_id: "INT-001"
    target_component: "review_orchestrator"
    integration_type: "required"
    trigger_condition: "before_planning_starts"
    expected_behavior: |
      Run context-aware architectural review with feature scope filtering.
      - Extract scope keywords from feature request (auth, api, database, etc.)
      - Execute review with scope_filter context
      - Classify findings by relevance (blocker/critical/improvement)
      - Challenge user if blockers detected (auto-fix/skip/abort)
      - Inject Phase 0: Remediation if auto-fix chosen
      - Add critical issues to Phase 1 tasks
    validation_method: "integration_test"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "run_contextual_review() at line ~830 in generate_incremental_plan()"
    enhancement_date: "2025-12-09"
    enhancement_description: |
      Enhanced from basic score-based review to context-aware blocker detection.
      Now actively prevents planning when blocking issues exist.
    
  - integration_id: "INT-002"
    target_component: "threat_modeler_agent"
    integration_type: "conditional"
    trigger_condition: "feature_matches_security_keywords"
    expected_behavior: |
      Run STRIDE-based threat analysis, identify threats with OWASP mapping,
      append threat section to plan, add security DoD items.
    validation_method: "method_exists"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "_run_threat_analysis() and analyze_threats()"
    
  - integration_id: "INT-003"
    target_component: "git_checkpoint_orchestrator"
    integration_type: "required"
    trigger_condition: "after_each_phase_completion"
    expected_behavior: |
      Create git checkpoint after Phase 1, 2, 3 completion with descriptive
      commit message including plan name and phase number.
    validation_method: "method_exists"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "create_plan_incremental() lines 848-943"
    
  - integration_id: "INT-004"
    target_component: "plan_execution_orchestrator_v2"
    integration_type: "optional"
    trigger_condition: "autonomous_execution_mode"
    expected_behavior: |
      Execute plan phases automatically when "execute all phases autonomously"
      command detected. Must respect quality gates and approval workflow.
    validation_method: "method_exists"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "__init__() initializes self.plan_executor"
    
  - integration_id: "INT-005"
    target_component: "test_intelligence"
    integration_type: "required"
    trigger_condition: "always_during_plan_generation"
    expected_behavior: |
      Detect test requirements from feature description, recommend frameworks
      based on user preferences, inject test strategy into DoR/DoD.
    validation_method: "method_exists"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "_inject_test_strategy() called by inject_tdd_requirements()"
    
  - integration_id: "INT-006"
    target_component: "document_organizer"
    integration_type: "required"
    trigger_condition: "after_plan_generation"
    expected_behavior: |
      Organize plan document into correct directory structure, update references,
      ensure compliance with document organization rules.
    validation_method: "method_exists"
    status: "implemented"
    implementation_file: "src/orchestrators/planning_orchestrator.py"
    implementation_method: "create_plan_incremental() calls document_organizer.organize_document()"
    
  - integration_id: "INT-007"
    target_component: "swagger_estimator"
    integration_type: "optional"
    trigger_condition: "swagger_file_detected_in_project"
    expected_behavior: |
      Parse Swagger/OpenAPI file, extract endpoint complexity, generate effort
      estimate, integrate with estimate_timeframe() method.
    validation_method: "method_exists"
    status: "missing"
    implementation_file: "src/utils/swagger_estimator.py (to be created)"
    implementation_method: "estimate_from_swagger()"

# ========================================
# Quality Gates
# ========================================

quality_gates:
  - gate_id: "GATE-001"
    name: "Skeleton Approval"
    gate_type: "approval"
    trigger_point: "after_skeleton_generation"
    blocking: true
    validation_criteria: "User approves plan skeleton structure and sections"
    bypass_conditions: ["autonomous_execution_mode"]
    status: "implemented"
    implementation_method: "create_plan_incremental() Step 1 checkpoint"
    
  - gate_id: "GATE-002"
    name: "Phase 1 Approval"
    gate_type: "approval"
    trigger_point: "after_phase_1_completion"
    blocking: true
    validation_criteria: "User approves Requirements, Dependencies, Architecture sections"
    bypass_conditions: ["autonomous_execution_mode"]
    status: "implemented"
    implementation_method: "create_plan_incremental() Checkpoint 2"
    
  - gate_id: "GATE-003"
    name: "Phase 2 Approval"
    gate_type: "approval"
    trigger_point: "after_phase_2_completion"
    blocking: true
    validation_criteria: "User approves Implementation, Tests, Integration sections"
    bypass_conditions: ["autonomous_execution_mode"]
    status: "implemented"
    implementation_method: "create_plan_incremental() Checkpoint 3"
    
  - gate_id: "GATE-004"
    name: "Phase 3 Approval"
    gate_type: "approval"
    trigger_point: "after_phase_3_completion"
    blocking: true
    validation_criteria: "User approves Acceptance, Security, Deployment sections"
    bypass_conditions: ["autonomous_execution_mode"]
    status: "implemented"
    implementation_method: "create_plan_incremental() Checkpoint 4"
    
  - gate_id: "GATE-005"
    name: "Acceptance Criteria Approval"
    gate_type: "approval"
    trigger_point: "after_phase_3_before_execution"
    blocking: true
    validation_criteria: "User explicitly approves acceptance criteria and DoD items"
    bypass_conditions: ["autonomous_execution_mode"]
    status: "missing"
    implementation_method: "NEW - approve_acceptance_criteria()"
    priority: "critical"
    
  - gate_id: "GATE-006"
    name: "DoR Completeness Validation"
    gate_type: "validation"
    trigger_point: "before_planning_starts"
    blocking: true
    validation_criteria: "All DoR items answered and validated by user"
    bypass_conditions: []
    status: "partial"
    implementation_method: "ENHANCE - refine_dor_interactive()"
    priority: "critical"
    
  - gate_id: "GATE-007"
    name: "Threat Review Gate"
    gate_type: "approval"
    trigger_point: "after_threat_analysis"
    blocking: false
    validation_criteria: "User reviews critical/high threats and approves mitigations"
    bypass_conditions: ["no_threats_found", "autonomous_execution_mode"]
    status: "missing"
    implementation_method: "NEW - review_threats_interactive()"
    priority: "medium"
    
  - gate_id: "GATE-008"
    name: "Architecture Review Gate"
    gate_type: "validation"
    trigger_point: "before_planning_starts"
    blocking: false
    validation_criteria: "Architectural review completed, score captured in metadata"
    bypass_conditions: ["review_score_above_80"]
    status: "missing"
    implementation_method: "NEW - run_architecture_review()"
    priority: "critical"

