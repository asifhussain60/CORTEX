    categories:
      mandatory_header:
        enabled: true
        description: 'All responses from CORTEX orchestrators MUST include this header.

          Establishes authority, copyright, and version context.

          '
        template: "# CORTEX {operation_type} Summary\n**Version:** {version} | **Date:**\
          \ {iso_date}\n**Author:** Asif Hussain\n**Copyright \xA9 2025-2026 Asif\
          \ Hussain. All rights reserved.**\n---\n"
        critical_rules:
        - EVERY response must start with this header
        - Header comes BEFORE any summary, sections, or content
        - Copyright line is non-negotiable (legal + brand)
        - Author is always 'Asif Hussain' (never LLM names)
        - Date reflects when response was generated
      executive_summary:
        enabled: true
        position: after_header
        description: 'Enforces concise, executive-level responses across all orchestrators.

          Eliminates verbose narratives and code blocks.

          '
        format_rules:
          mandatory:
          - Start with 3-5 sentence executive summary
          - Use bullet points for all lists (max 5 per section)
          - NO code snippets unless explicitly requested
          - NO narrative prose - declarative statements only
          - Quantify outcomes (X files, Y AC-IDs, Z% complete)
          - Mandatory header BEFORE all other content
          forbidden:
          - Code blocks (unless user says 'show code')
          - Step-by-step procedures
          - Explanatory paragraphs
          - Verbose status updates
          - Nested sections >2 levels
          - Missing CORTEX header
        structure:
          sections:
          - name: Outcomes
            marker: "\u2705"
            max_bullets: 5
            required: true
          - name: In Progress
            marker: "\u2699\uFE0F"
            max_bullets: 3
            required: false
          - name: Risks
            marker: "\u26A0\uFE0F"
            max_bullets: 3
            required: false
          - name: Impact
            marker: "\U0001F3AF"
            max_bullets: 3
            required: false
