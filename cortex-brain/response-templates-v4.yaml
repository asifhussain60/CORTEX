# ============================================================================
# ANTI-BLOAT MEASURES
# ============================================================================

anti_bloat:
  rules:
    - "Never create unnecessary sections"
    - "Approach section: real challenge OR 'No significant challenges'"
    - "Use concise pseudo-code by default - full code ONLY if explicitly requested"
    - "One separator (---) only after author line"
    - "Sections must add value, not just fill space"
  
  pseudo_code_examples:
    - "**Approach:** Use decorator pattern → validate input → call original function → log result"
    - "**Logic:** Check cache → if miss, query DB → transform data → store in cache → return"
    - "**Flow:** User request → authentication → authorization → business logic → response"
  
  red_flags:
    - "Empty or placeholder sections"
    - "Restating the request"
    - "Unnecessary explanations"
    - "Full code snippets when not explicitly requested"
    - "Multiple separators"

# Examples removed to meet <500 line target. See v3.0 for reference examples.

# ============================================================================
# NAMED TEMPLATES (Specialized Use Cases)
# ============================================================================

named_templates:
  autonomous_execution_progress:
    description: "Progress template for autonomous execution with CONCISE mode (default) for accessibility"
    tier: "TIER 3"
    orchestrator_engaged: true
    default_mode: "concise"  # NEW: Accessibility-first
    
    modes:
      concise:
        description: "Minimal updates for accessibility (WCAG-aligned cognitive load management)"
        use_when: "default for all autonomous execution"
        display_policy:
          phase_start: "Show phase name + overall progress bar only"
          task_completion: "SILENT - no user output"
          phase_completion: "Show completed phase + next phase (3 lines)"
          overall_completion: "Summary table (≤40 lines)"
        format: |
          ## 🛡️🧠 CORTEX: {{phase_name}}
          `{{overall_bar}}` **{{overall_percentage}}%**
          
          {{#if phase_completed}}
          ✅ {{completed_phase}} complete
          **Next:** {{next_phase}}
          {{/if}}
      
      verbose:
        description: "Full progress details (debugging/user-requested)"
        use_when: "user explicitly requests detailed output OR debugging mode enabled"
        display_policy:
          phase_start: "Show complete phase table"
          task_completion: "Show task name + checkmark"
          phase_completion: "Show complete phase table"
          overall_completion: "Full completion report (no limit)"
    
    display_moments:
      - "beginning": "Show phase table (verbose) OR progress bar (concise)"
      - "phase_completion": "Show next phase name (concise) OR full table (verbose)"
      - "overall_completion": "Show summary (both modes, different detail levels)"
    
    # VERBOSE mode format (original)
    format: |
      ## 🛡️🧠 CORTEX Plan Execution
      **Author:** Asif Hussain | **Plan:** {{plan_name}} | **Orchestrator:** Planning System 5.0 ✅
      
      ---
      
      ### 📊 Execution Progress
      
      **Overall Progress:** `{{overall_bar}}` **{{overall_percentage}}%** {{status_emoji}} {{status_text}}
      
      | # | Phase | Progress | Deliverables | Time |
      |---|-------|----------|--------------|------|
      {{#each phases}}
      | {{phase_num}} | {{#if completed}}✅{{else if in_progress}}⏳{{else}}⏸️{{/if}} **{{phase_name}}** | `{{phase_bar}}` {{percentage}}% | {{completed_tasks}}/{{total_tasks}} | {{elapsed_time}} |
      {{/each}}
      
      {{#if threat_analysis_enabled}}
      ### 🔒 Security Analysis
      
      | Metric | Value |
      |--------|-------|
      | **Threats** | {{threat_count}} ({{critical_count}} Critical, {{high_count}} High, {{medium_count}} Medium) |
      | **STRIDE** | {{stride_categories}} |
      | **Mitigations** | [{{mitigation_bar}}] {{mitigations_done}}/{{mitigations_total}} |
      {{/if}}
      
      ### ✅ Validation Status
      
      | Check | Status |
      |-------|--------|
      | **Definition of Ready** | {{#if dor_passed}}✅ Passed{{else}}⚠️ {{dor_violations}} issue(s){{/if}} |
      | **Definition of Done** | {{#if dod_passed}}✅ Passed{{else}}⏳ {{dod_remaining}} remaining{{/if}} |
      
      ### 📄 Plan File
      
      **Open in Editor:** [{{plan_filename}}]({{plan_path}})
      
      **Next:** {{next_action}}
    
    context_needed: true
    metadata:
      category: planning
      operation: autonomous_execution
    response_type: adaptive
    accessibility:
      wcag_level: "AA"
      cognitive_load: "minimized"
      default_verbosity: "low"
    progress_helpers:
      description: "Use TemplateRenderer helper methods for progress bar generation"
      methods:
        - "generate_progress_bar(percentage, width=20, filled='█', empty='░')"
        - "generate_tdd_status(red_done, green_done, refactor_done)"
        - "format_elapsed_time(seconds)"
        - "generate_phase_rows(phases)"
        - "render_autonomous_progress(...) - Full convenience method"
  
  # Maintenance, Sanitization, Refinement templates reference base-components.yaml
  # These orchestrators use visual progress templates defined in:
  # cortex-brain/response-templates/base-components.yaml
  #   - maintenance_execution_progress (6-phase)
  #   - sanitization_execution_progress (5-phase)
  #   - refinement_execution_progress (7-phase)
  
  ado_execution_progress:
    description: "Enhanced ADO work item generation progress with story points and hierarchy tracking"
    tier: "TIER 3"
    orchestrator_engaged: true
    display_moments:
      - "beginning": "Show complete phase table with work item summary"
      - "phase_completion": "Show overall progress and next phase"
      - "overall_completion": "Show complete phase table with work item summary"
    format: |
      ## 🛡️🧠 CORTEX ADO Work Item Generation
      **Author:** Asif Hussain | **Feature:** {{feature_name}} | **Orchestrator:** ADO System ✅
      
      ---
      
      ### 📊 ADO Generation Progress
      
      **Overall Progress:** `{{overall_bar}}` **{{overall_percentage}}%** {{status_emoji}} {{status_text}}
      
      | # | Phase | Progress | Deliverables | Time |
      |---|-------|----------|--------------|------|
      {{#each phases}}
      | {{phase_num}} | {{#if completed}}✅{{else if in_progress}}⏳{{else}}⏸️{{/if}} **{{phase_name}}** | `{{phase_bar}}` {{percentage}}% | {{completed_tasks}}/{{total_tasks}} | {{elapsed_time}} |
      {{/each}}
      
      ### 🎫 Work Item Summary
      
      | Type | Count | Story Points | Status |
      |------|-------|--------------|--------|
      | **Epic** | {{epic_count}} | - | {{epic_status}} |
      | **Feature** | {{feature_count}} | {{feature_sp}} SP | {{feature_status}} |
      | **User Story** | {{story_count}} | {{story_sp}} SP | {{story_status}} |
      | **Task** | {{task_count}} | {{task_sp}} SP | {{task_status}} |
      
      {{#if ado_links}}
      ### 🔗 Azure DevOps Links
      
      {{#each ado_links}}
      - [{{type}}: {{title}}]({{url}})
      {{/each}}
      {{/if}}
      
      ### ✅ Validation Status
      
      | Check | Status |
      |-------|--------|
      | **Definition of Ready** | {{#if dor_passed}}✅ Passed{{else}}⚠️ {{dor_violations}} issue(s){{/if}} |
      | **Definition of Done** | {{#if dod_passed}}✅ Passed{{else}}⏳ {{dod_remaining}} remaining{{/if}} |
      | **ADO Authentication** | {{#if ado_auth_valid}}✅ Connected{{else}}❌ Not authenticated{{/if}} |
      
      ### 📄 Plan File
      
      **Open in Editor:** [{{plan_filename}}]({{plan_path}})
      
      **Next:** {{next_action}}
    context_needed: true
    metadata:
      category: ado
      operation: ado_execution
    response_type: adaptive
    progress_helpers:
      description: "Use TemplateRenderer helper methods for ADO progress rendering"
      methods:
        - "generate_progress_bar(percentage, width=20, filled='█', empty='░')"
        - "generate_ado_phase_rows(phases)"
        - "format_elapsed_time(seconds)"
        - "render_ado_progress(...) - Full convenience method"
  
  plan_created:
    description: "Template for plan creation completion with clickable file link"
    tier: "TIER 2"
    priority: "mandatory"
    format: |
      ## 🛡️🧠 CORTEX Plan Created
      **Author:** Asif Hussain | **Plan:** {{plan_name}}
      
      ---
      
      ### 📊 Plan Summary
      
      | Metric | Value |
      |--------|-------|
      | **Plan ID** | {{plan_id}} |
      | **Phases** | {{phase_count}} |
      | **Estimated Effort** | {{effort}} |
      | **Files to Modify** | {{file_count}} |
      
      ### 📁 Plan Structure
      
      ```
      {{plan_folder}}/
      ├── 00-master-plan.md    # Main plan
      ├── context/             # Context artifacts
      ├── reports/             # Progress reports
      ├── artifacts/           # Supporting files
      └── tracking/            # progress-tracker.json
      ```
      
      ### 📄 Open Plan in Editor
      
      **Click to open:** [00-master-plan.md]({{plan_path}})
      
      ---
      
      **Next:** {{next_action}}
    metadata:
      category: planning
      operation: plan_creation
    post_creation_action: "Always include clickable link to plan file"
  
  progress_bar_simple:
    description: "Simple inline progress bar for quick status updates"
    tier: "TIER 2"
    format: "[{{filled_bar}}{{empty_bar}}] {{percentage}}%"
    example: "[████████████░░░░░░░░] 60%"
    context_needed: true
  
  # Phase 7: Master Orchestrator Integration Templates
  
  orchestrator_execution_summary:
    description: "Standard format for autonomous orchestrator execution summaries"
    tier: "TIER 3"
    format: |
      ### 🛡️ {{orchestrator_name}} Execution Complete
      
      **Orchestrator:** {{orchestrator_id}} ({{orchestrator_type}})  
      **Status:** {{status}} {{status_icon}}  
      **Duration:** {{execution_time}}  
      **Routing:** {{routing_method}} (confidence: {{confidence}})
      
      {{#if artifacts}}
      #### 📦 Artifacts Generated
      {{#each artifacts}}
      - [{{name}}]({{path}}) - {{description}}
      {{/each}}
      {{/if}}
      
      {{#if state_updated}}
      #### 💾 State Updated
      - **Plan ID:** {{plan_id}}
      - **Phase:** {{current_phase}}
      - **Progress:** {{progress_percentage}}%
      {{/if}}
      
      **Next:** {{next_action}}
    context_needed: true
    metadata:
      category: orchestrator
      operation: execution_summary
  
  database_state_query:
    description: "Format for displaying plan status from database queries"
    tier: "TIER 2"
    format: |
      ### 📊 Plan Status: {{plan_id}}
      
      | Field | Value |
      |-------|-------|
      | Status | {{status}} {{status_icon}} |
      | Current Phase | {{current_phase}}/{{total_phases}} |
      | Progress | {{progress_percentage}}% |
      | Last Updated | {{last_updated}} |
      | Artifacts | {{artifact_count}} |
      
      {{#if current_phase_details}}
      #### Current Phase: {{current_phase_name}}
      {{current_phase_details}}
      {{/if}}
      
      **Actions:** {{available_actions}}
    context_needed: true
    metadata:
      category: database
      operation: state_query
  
  migration_complete:
    description: "Celebration template for completed orchestrator migrations"
    tier: "TIER 3"
    format: |
      # 🎉 MIGRATION COMPLETE
      
      ## {{orchestrator_name}} v{{version}} Successfully Migrated
      
      ### ✅ What Changed
      {{#each changes}}
      - {{description}}
      {{/each}}
      
      ### 🚀 New Capabilities
      {{#each capabilities}}
      - **{{name}}:** {{description}}
      {{/each}}
      
      ### 📈 Metrics
      | Metric | Before | After | Improvement |
      |--------|--------|-------|-------------|
      {{#each metrics}}
      | {{name}} | {{before}} | {{after}} | {{improvement}} |
      {{/each}}
      
      ### 🔗 Master Orchestrator Integration
      - **Routing Pattern:** `{{routing_pattern}}`
      - **Confidence:** {{routing_confidence}}
      - **Type:** {{orchestrator_type}}
      
      ### 📝 Next Steps
      {{next_steps}}
    context_needed: true
    metadata:
      category: migration
      operation: completion
  
  master_orchestrator_routing:
    description: "Display routing decision (pattern matched vs LLM fallback)"
    tier: "TIER 2"
    format: |
      ### 🔀 Routing Decision
      
      **Input:** "{{user_input}}"  
      **Matched:** {{orchestrator_id}}  
      **Method:** {{routing_method}} {{method_icon}}  
      **Confidence:** {{confidence}} {{confidence_bar}}  
      **Latency:** {{latency_ms}}ms
      
      {{#if pattern_matched}}
      **Pattern:** `{{matched_pattern}}`
      {{/if}}
      
      {{#if llm_fallback}}
      **LLM Reasoning:** {{llm_reasoning}}
      {{/if}}
      
      {{#if continuation}}
      **Continuation Detected:** Routing to last orchestrator ({{last_orchestrator}})
      {{/if}}
    context_needed: true
    metadata:
      category: routing
      operation: routing_display
    icons:
      pattern_match: "⚡"
      llm_fallback: "🤖"
      continuation: "↩️"

