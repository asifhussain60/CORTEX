schema_version: '4.5.0'
last_updated: '2026-01-13'
architecture: 'cortex_4_0_ascii_progress_with_visual_tracking'
description: |
  CORTEX Response Template System v4.5.0
  CORTEX-4.0 Style Headers + ASCII Visual Progress Bars
  
  Key Features:
  1. Mandatory CORTEX-4.0 style header (2 lines, operational)
  2. ASCII progress bars for visual phase tracking (CORTEX-4.0 style)
  3. Executive summary sections (Outcomes, In Progress, Risks, Impact)
  4. Mandatory "Next Steps:" section with MAC/WIN platform selection
  
  Header format (CORTEX-4.0 style):
  ## 🧠 CORTEX {work_subtitle}
  **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator_name} ✅
  
  Progress Bar format (CORTEX-4.0 style):
  ┌────────────────────────────────────────────────────────────────────┐
  │            🧠 CORTEX {operation} - PROGRESS TRACKER                │
  ├────────────────────────────────────────────────────────────────────┤
  │ Overall Progress: `████████░░` 80% 🔄 In Progress                  │
  ├────────────────────────────────────────────────────────────────────┤
  │ Phase {N} - {Name}  `████████░░` 80% 🔄 In Progress                │
  │ AC-IDs: {X}/{Y} | Tests: {A}/{B}                                   │
  └────────────────────────────────────────────────────────────────────┘

# ============================================================================
# MANDATORY CORTEX HEADER (v4.3.0 - CORTEX-4.0 Style)
# ============================================================================

mandatory_header:
  enabled: true
  description: |
    CORTEX-4.0 style header - operational, concise, context-aware.
    Shows what's being done, who's doing it, and what phase/orchestrator.
    THIS IS THE AUTHORITATIVE HEADER - appears on EVERY response.
  
  template: |
    ## 🧠 CORTEX {operation_type}
    **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator} ✅
  
  critical_rules:
    - "EVERY response must start with this header"
    - "Header comes BEFORE any summary, sections, or content"
    - "Copyright line is non-negotiable (legal + brand)"
    - "Author is always 'Asif Hussain' (never LLM names)"
    - "Date reflects when response was generated"

# ============================================================================
# EXECUTIVE SUMMARY CONFIGURATION (v4.2)
# ============================================================================

executive_summary:
  enabled: true
  position: 'after_header'
  description: |
    Enforces concise, executive-level responses across all orchestrators.
    Eliminates verbose narratives and code blocks.
  
  format_rules:
    mandatory:
      - "Start with 3-5 sentence executive summary"
      - "Use bullet points for all lists (max 5 per section)"
      - "NO code snippets unless explicitly requested"
      - "NO narrative prose - declarative statements only"
      - "Quantify outcomes (X files, Y AC-IDs, Z% complete)"
      - "Mandatory header BEFORE all other content"
    
    forbidden:
      - "Code blocks (unless user says 'show code')"
      - "Step-by-step procedures"
      - "Explanatory paragraphs"
      - "Verbose status updates"
      - "Nested sections >2 levels"
      - "Missing CORTEX header"
  
  structure:
    sections:
      - name: "Outcomes"
        marker: "✅"
        max_bullets: 5
        required: true
        
      - name: "In Progress"
        marker: "⚙️"
        max_bullets: 3
        required: false
        
      - name: "Risks"
        marker: "⚠️"
        max_bullets: 3
        required: false
        
      - name: "Impact"
        marker: "🎯"
        max_bullets: 3
        required: false
      
      - name: "Next Steps"
        marker: "📋"
        max_bullets: 5
        required: true
        description: |
          MANDATORY final section for every response.
          Provides platform-specific continuation options (MAC/WIN) with numeric selection.
          References cortex-plan-executor.prompt.md for autonomous execution.
          Max 5 options (platform selection + common actions).
        
        format: |
          📋 NEXT STEPS
          
          Select continuation option:
          
          1. Continue MAC track autonomously (Phase 11: CORTEX LENS)
             `@workspace /new cortex-plan-executor.prompt.md continue mac track autonomously`
          
          2. Continue WIN track autonomously (Phase 10: Template Migration)
             `@workspace /new cortex-plan-executor.prompt.md continue win track autonomously`
          
          3. Validate Phase 11 tests (MAC)
             `python3 -m pytest tests/ -k "LENS" -v`
          
          4. Sync dashboard with current progress
             `python3 scripts/regenerate_plan_viewer_data.py`
          
          5. Custom action (specify)

# ============================================================================
# CAPABILITY TRANSLATION (v4.2)
# ============================================================================

capability_translation:
  enabled: true
  description: |
    Translates internal AC-IDs to human-readable business capabilities.
    Uses get_ac_title.sh script to look up official titles.
  
  rules:
    - "NEVER display raw AC-ID codes to end users"
    - "ALWAYS translate to plain English capability names"
    - "Use get_ac_title.sh to retrieve canonical titles"
    - "Include AC-ID in internal logs ONLY"

# ============================================================================
# PROGRESS INDICATORS (v4.5 - CORTEX-4.0 ASCII Progress Bars)
# ============================================================================

progress_indicators:
  enabled: true
  ascii_progress_enabled: true
  
  status_icons:
    complete: "✅"
    in_progress: "🔄"
    pending: "⏳"
    failed: "❌"
    blocked: "🚫"
  
  section_markers:
    outcomes: "✅"
    in_progress: "⚙️"
    risks: "⚠️"
    impact: "🎯"
    continuation: "📋"
  
  ascii_progress_bar:
    enabled: true
    description: |
      CORTEX-4.0 style visual ASCII progress bars for phase tracking.
      Shows overall progress and individual phase completion.
    
    template: |
      ```
      ┌────────────────────────────────────────────────────────────────────┐
      │            🧠 CORTEX {operation_type} - PROGRESS TRACKER           │
      ├────────────────────────────────────────────────────────────────────┤
      │ Overall Progress: `{overall_bar}` {overall_percent}% {overall_status} │
      ├────────────────────────────────────────────────────────────────────┤
      │ Phase {phase_num} - {phase_name}  `{phase_bar}` {phase_percent}% {phase_status} │
      │ AC-IDs: {completed_ac_ids}/{total_ac_ids} | Tests: {passing_tests}/{total_tests} │
      └────────────────────────────────────────────────────────────────────┘
      ```
    
    bar_characters:
      filled: "█"
      empty: "░"
      length: 10  # Total bar length (10 blocks = 100%)
    
    status_display:
      complete: "✅ Complete"
      in_progress: "🔄 In Progress"
      pending: "⏳ Pending"
      blocked: "🚫 Blocked"
    
    usage_example: |
      When showing phase progress, always include ASCII progress bar:
      
      ```
      ┌────────────────────────────────────────────────────────────────────┐
      │          🧠 CORTEX Phase 1 Foundation - PROGRESS TRACKER           │
      ├────────────────────────────────────────────────────────────────────┤
      │ Overall Progress: `████████░░` 80% 🔄 In Progress                  │
      ├────────────────────────────────────────────────────────────────────┤
      │ Phase 1 - Foundation  `████████░░` 80% 🔄 In Progress              │
      │ AC-IDs: 26/33 | Tests: 142/178                                     │
      └────────────────────────────────────────────────────────────────────┘
      ```

# ============================================================================
# CONTINUATION PROTOCOL (v4.3 - MAC/WIN Platform Selection)
# ============================================================================

continuation:
  enabled: true
  position: "after_sections"
  format: |
    📋 NEXT STEPS
    
    Select continuation option:
    
    1. Continue MAC track autonomously (Phase {mac_phase})
       `@workspace /new cortex-plan-executor.prompt.md continue mac track autonomously`
    
    2. Continue WIN track autonomously (Phase {win_phase})
       `@workspace /new cortex-plan-executor.prompt.md continue win track autonomously`
    
    3. Validate current phase tests
       `python3 -m pytest tests/ -k "{phase_marker}" -v`
    
    4. Sync dashboard with current progress
       `python3 scripts/regenerate_plan_viewer_data.py`
    
    5. Custom action (specify)
  
  description: |
    Platform-aware continuation with numeric selection.
    References cortex-plan-executor.prompt.md for autonomous execution.
    Supports parallel MAC/WIN development workflows.
  
  platform_detection:
    mac_phases: [4, 5, 6, 7, 11]
    win_phases: [1, 2, 3, 8, 9, 10]
    current_phase_variable: "{current_phase}"

# ============================================================================
# TIER ROUTING (v4.2)
# ============================================================================

tier_routing:
  INSTANT:
    token_limit: 50
    sections: 0
    use_case: "Direct factual answer"
  
  FOCUSED:
    token_limit: 200
    sections: "1-2"
    use_case: "Single concept"
  
  STRUCTURED:
    token_limit: 400
    sections: "2-4"
    use_case: "Multi-faceted analysis"
  
  COMPREHENSIVE:
    token_limit: 500
    sections: "4-6"
    use_case: "Complex system overview"

# ============================================================================
# OPERATION-SPECIFIC TEMPLATES (v4.2)
# ============================================================================

operation_templates:
  
  execution_operation:
    description: "TDD-Master, Planning, Implementation"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - in_progress (required)
      - risks (optional)
      - impact (optional)
      - next_steps (REQUIRED)
  
  analysis_operation:
    description: "Brittleness Review, Risk Analysis"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - risks (required)
      - impact (required)
      - next_steps (REQUIRED)
  
  validation_operation:
    description: "Test execution, evidence validation"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - risks (optional)
      - next_steps (REQUIRED)

# ============================================================================
# COMPOSITION RULES (v4.2)
# ============================================================================

composition_rules:
  mandatory_elements:
    - header: "🧠 CORTEX {operation} with brain icon and copyright"
    - summary: "3-5 sentence executive summary"
    - outcomes: "At least 1 quantified bullet"
    - next_steps: "3-5 action items or sequential path forward (MANDATORY FINAL SECTION)"
  
  conditional_elements:
    - in_progress: "If work ongoing"
    - risks: "If risks exist"
    - impact: "If strategic importance"
  
  forbidden_elements:
    - code_blocks: "Unless requested"
    - explanatory_prose: "Use bullets"
    - nested_sections: "Max 2 levels"
    - ac_id_codes: "Translate first"
    - missing_next_steps: "ALWAYS include Next Steps as final section"

# ============================================================================
# QUALITY GATES (v4.2)
# ============================================================================

quality_gates:
  pre_output:
    - "Header present with 🧠 brain icon"
    - "Copyright includes 2025-2026"
    - "No AC-ID codes visible"
    - "All metrics quantified"
    - "No code blocks unless requested"
    - "No explanatory prose"
    - "Next Steps section present as final section (MANDATORY)"
  
  verification_checklist:
    - "✓ CORTEX header with 🧠 brain icon"
    - "✓ Version and date present"
    - "✓ Copyright © 2025-2026 Asif Hussain"
    - "✓ Executive summary (3-5 sentences)"
    - "✓ Outcomes section with ✅ marker"
    - "✓ All bullets on separate lines"
    - "✓ Quantified metrics"
    - "✓ No AC-ID codes visible"
    - "✓ No code snippets"
    - "✓ Next Steps (📋) section as final section"
    - "✓ Next Steps contains 1-3 sequential actions"
    - "✓ Section headers properly formatted"
    - "✓ Within tier word limit"

# ============================================================================
# EXAMPLES (v4.2)
# ============================================================================

