schema_version: '4.2.1'
last_updated: '2026-01-12'
architecture: 'executive_summary_with_mandatory_header_and_next_steps'
description: |
  CORTEX Response Template System v4.2.1
  Executive Summary Mode with Mandatory CORTEX Header (Brain Icon) and Next Steps
  
  All responses must include:
  1. Mandatory CORTEX header with 🧠 brain icon and copyright info
  2. Executive summary sections (Outcomes, In Progress, Risks, Impact)
  3. Mandatory "Next Steps:" section as final section
  Dynamic composition of reusable components based on operation context.

# ============================================================================
# MANDATORY CORTEX HEADER (v4.2.1)
# ============================================================================

mandatory_header:
  enabled: true
  description: |
    All responses from CORTEX orchestrators MUST include this header.
    Establishes authority, copyright, and version context with 🧠 brain icon.
    THIS IS THE AUTHORITATIVE HEADER - appears on EVERY response.
  
  template: |
    # 🧠 CORTEX {operation_type} Summary
    **Version:** {version} | **Date:** {iso_date}
    **Author:** Asif Hussain
    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
    ---
  
  critical_rules:
    - "EVERY response must start with this header"
    - "Header comes BEFORE any summary, sections, or content"
    - "Copyright line is non-negotiable (legal + brand)"
    - "Author is always 'Asif Hussain' (never LLM names)"
    - "Date reflects when response was generated"

# ============================================================================
# EXECUTIVE SUMMARY CONFIGURATION (v4.2)
# ============================================================================

executive_summary:
  enabled: true
  position: 'after_header'
  description: |
    Enforces concise, executive-level responses across all orchestrators.
    Eliminates verbose narratives and code blocks.
  
  format_rules:
    mandatory:
      - "Start with 3-5 sentence executive summary"
      - "Use bullet points for all lists (max 5 per section)"
      - "NO code snippets unless explicitly requested"
      - "NO narrative prose - declarative statements only"
      - "Quantify outcomes (X files, Y AC-IDs, Z% complete)"
      - "Mandatory header BEFORE all other content"
    
    forbidden:
      - "Code blocks (unless user says 'show code')"
      - "Step-by-step procedures"
      - "Explanatory paragraphs"
      - "Verbose status updates"
      - "Nested sections >2 levels"
      - "Missing CORTEX header"
  
  structure:
    sections:
      - name: "Outcomes"
        marker: "✅"
        max_bullets: 5
        required: true
        
      - name: "In Progress"
        marker: "⚙️"
        max_bullets: 3
        required: false
        
      - name: "Risks"
        marker: "⚠️"
        max_bullets: 3
        required: false
        
      - name: "Impact"
        marker: "🎯"
        max_bullets: 3
        required: false
      
      - name: "Next Steps"
        marker: "📋"
        max_bullets: 3
        required: true
        description: |
          MANDATORY final section for every response.
          Provides single sequential path forward with high-value actions.
          No branching - linear progression only.
          Max 3 steps (conciseness enforced).

# ============================================================================
# CAPABILITY TRANSLATION (v4.2)
# ============================================================================

capability_translation:
  enabled: true
  description: |
    Translates internal AC-IDs to human-readable business capabilities.
    Uses get_ac_title.sh script to look up official titles.
  
  rules:
    - "NEVER display raw AC-ID codes to end users"
    - "ALWAYS translate to plain English capability names"
    - "Use get_ac_title.sh to retrieve canonical titles"
    - "Include AC-ID in internal logs ONLY"

# ============================================================================
# PROGRESS INDICATORS (v4.2)
# ============================================================================

progress_indicators:
  enabled: true
  
  status_icons:
    complete: "✅"
    in_progress: "🔄"
    pending: "⏳"
    failed: "❌"
    blocked: "🚫"
  
  section_markers:
    outcomes: "✅"
    in_progress: "⚙️"
    risks: "⚠️"
    impact: "🎯"
    continuation: "📋"

# ============================================================================
# CONTINUATION PROTOCOL (v4.2)
# ============================================================================

continuation:
  enabled: true
  position: "after_sections"
  format: "📋 Resume Work: `continue {operation}` (see tracking files)"
  description: "Enables cross-session resume with state reference"

# ============================================================================
# TIER ROUTING (v4.2)
# ============================================================================

tier_routing:
  INSTANT:
    token_limit: 50
    sections: 0
    use_case: "Direct factual answer"
  
  FOCUSED:
    token_limit: 200
    sections: "1-2"
    use_case: "Single concept"
  
  STRUCTURED:
    token_limit: 400
    sections: "2-4"
    use_case: "Multi-faceted analysis"
  
  COMPREHENSIVE:
    token_limit: 500
    sections: "4-6"
    use_case: "Complex system overview"

# ============================================================================
# OPERATION-SPECIFIC TEMPLATES (v4.2)
# ============================================================================

operation_templates:
  
  execution_operation:
    description: "TDD-Master, Planning, Implementation"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - in_progress (required)
      - risks (optional)
      - impact (optional)
      - next_steps (REQUIRED)
  
  analysis_operation:
    description: "Brittleness Review, Risk Analysis"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - risks (required)
      - impact (required)
      - next_steps (REQUIRED)
  
  validation_operation:
    description: "Test execution, evidence validation"
    mandatory_header: true
    mandatory_next_steps: true
    sections:
      - outcomes (required)
      - risks (optional)
      - next_steps (REQUIRED)

# ============================================================================
# COMPOSITION RULES (v4.2)
# ============================================================================

composition_rules:
  mandatory_elements:
    - header: "🧠 CORTEX {operation} with brain icon and copyright"
    - summary: "3-5 sentence executive summary"
    - outcomes: "At least 1 quantified bullet"
    - next_steps: "3-5 action items or sequential path forward (MANDATORY FINAL SECTION)"
  
  conditional_elements:
    - in_progress: "If work ongoing"
    - risks: "If risks exist"
    - impact: "If strategic importance"
  
  forbidden_elements:
    - code_blocks: "Unless requested"
    - explanatory_prose: "Use bullets"
    - nested_sections: "Max 2 levels"
    - ac_id_codes: "Translate first"
    - missing_next_steps: "ALWAYS include Next Steps as final section"

# ============================================================================
# QUALITY GATES (v4.2)
# ============================================================================

quality_gates:
  pre_output:
    - "Header present with 🧠 brain icon"
    - "Copyright includes 2025-2026"
    - "No AC-ID codes visible"
    - "All metrics quantified"
    - "No code blocks unless requested"
    - "No explanatory prose"
    - "Next Steps section present as final section (MANDATORY)"
  
  verification_checklist:
    - "✓ CORTEX header with 🧠 brain icon"
    - "✓ Version and date present"
    - "✓ Copyright © 2025-2026 Asif Hussain"
    - "✓ Executive summary (3-5 sentences)"
    - "✓ Outcomes section with ✅ marker"
    - "✓ All bullets on separate lines"
    - "✓ Quantified metrics"
    - "✓ No AC-ID codes visible"
    - "✓ No code snippets"
    - "✓ Next Steps (📋) section as final section"
    - "✓ Next Steps contains 1-3 sequential actions"
    - "✓ Section headers properly formatted"
    - "✓ Within tier word limit"

# ============================================================================
# EXAMPLES (v4.2)
# ============================================================================

examples:
  
  example_comprehensive: |
    # 🧠 CORTEX TDD-Master Execution Summary
    **Version:** 2.1.0 | **Date:** 2026-01-12 14:32:00 UTC
    **Author:** Asif Hussain
    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
    ---
    
    Completed test-driven implementation of toolkit consolidation. Phase 2 at 45% with clear path to 100%.
    
    ✅ OUTCOMES
    
    • Hash chain integrity validation operational (5/5 tests passing)
    • Audit tool consolidation complete (merged duplicate tools)
    • Naming standards audit completed (8 violations identified)
    • @mcp_tool decorator framework applied to 12 public tools
    • Phase 2 toolkit work at 45% completion
    
    ⚙️ IN PROGRESS
    
    • Implementing naming standard fixes
    • Refactoring scripts/ directory into toolkit modules
    
    🎯 IMPACT
    
    • MasterOrchestrator has complete toolkit visibility
    • Governance compliance enforced (CORE-022, CORE-024)
    
    📋 NEXT STEPS
    
    1. Complete naming standard fixes (estimated 2 hours)
    2. Execute integration tests to validate refactored modules
    3. Update progress-tracker.json when all Phase 2 tests pass
  
  example_instant: |
    # 🧠 CORTEX Version Query Summary
    **Version:** 2.1.0 | **Date:** 2026-01-12 14:25:00 UTC
    **Author:** Asif Hussain
    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
    ---
    
    Current CORTEX version is 6.0 (Phase 2 active), brittleness review is v2.1.0.
    
    📋 NEXT STEPS
    
    1. Review the brittleness findings in cortex-brain/cx6-plan/validation/
    2. Prioritize critical/high-risk items for Phase 2 implementation

# END OF RESPONSE TEMPLATES V4.2.1 - WITH BRAIN ICON AND NEXT STEPS
