named_templates:
  autonomous_execution_progress:
    description: "Enhanced progress template for autonomous plan execution with visual Unicode progress bars"
    tier: "TIER 3"
    orchestrator_engaged: true
    display_moments:
      - "beginning": "Show complete phase table"
      - "phase_completion": "Show overall progress and next phase"
      - "overall_completion": "Show complete phase table"
    format: |
      ## 🛡️🧠 CORTEX Plan Execution
      **Author:** Asif Hussain | **Plan:** {{plan_name}} | **Orchestrator:** Planning System 4.0 ✅
      
      ---
      
      ### 📊 Execution Progress
      
      **Overall Progress:** `{{overall_bar}}` **{{overall_percentage}}%** {{status_emoji}} {{status_text}}
      
      | # | Phase | Progress | Deliverables | Time |
      |---|-------|----------|--------------|------|
      {{#each phases}}
      | {{phase_num}} | {{#if completed}}✅{{else if in_progress}}⏳{{else}}⏸️{{/if}} **{{phase_name}}** | `{{phase_bar}}` {{percentage}}% | {{completed_tasks}}/{{total_tasks}} | {{elapsed_time}} |
      {{/each}}
      
      {{#if threat_analysis_enabled}}
      ### 🔒 Security Analysis
      
      | Metric | Value |
      |--------|-------|
      | **Threats** | {{threat_count}} ({{critical_count}} Critical, {{high_count}} High, {{medium_count}} Medium) |
      | **STRIDE** | {{stride_categories}} |
      | **Mitigations** | [{{mitigation_bar}}] {{mitigations_done}}/{{mitigations_total}} |
      {{/if}}
      
      ### ✅ Validation Status
      
      | Check | Status |
      |-------|--------|
      | **Definition of Ready** | {{#if dor_passed}}✅ Passed{{else}}⚠️ {{dor_violations}} issue(s){{/if}} |
      | **Definition of Done** | {{#if dod_passed}}✅ Passed{{else}}⏳ {{dod_remaining}} remaining{{/if}} |
      
      **Next:** {{next_action}}
    context_needed: true
    metadata:
      category: planning
      operation: autonomous_execution
    response_type: adaptive
    progress_helpers:
      description: "Use TemplateRenderer helper methods for progress bar generation"
      methods:
        - "generate_progress_bar(percentage, width=20, filled='█', empty='░')"
        - "generate_tdd_status(red_done, green_done, refactor_done)"
        - "format_elapsed_time(seconds)"
        - "generate_phase_rows(phases)"
        - "render_autonomous_progress(...) - Full convenience method"
  
  # Maintenance, Sanitization, Refinement templates reference base-components.yaml
  # These orchestrators use visual progress templates defined in:
  # cortex-brain/response-templates/base-components.yaml
