# ============================================================================
# ANTI-BLOAT MEASURES
# ============================================================================

anti_bloat:
  rules:
    - "Never create unnecessary sections"
    - "Approach section: real challenge OR 'No significant challenges'"
    - "Use concise pseudo-code by default - full code ONLY if explicitly requested"
    - "One separator (---) only after author line"
    - "Sections must add value, not just fill space"
  
  pseudo_code_examples:
    - "**Approach:** Use decorator pattern → validate input → call original function → log result"
    - "**Logic:** Check cache → if miss, query DB → transform data → store in cache → return"
    - "**Flow:** User request → authentication → authorization → business logic → response"
  
  red_flags:
    - "Empty or placeholder sections"
    - "Restating the request"
    - "Unnecessary explanations"
    - "Full code snippets when not explicitly requested"
    - "Multiple separators"

# Examples removed to meet <500 line target. See v3.0 for reference examples.

# ============================================================================
# NAMED TEMPLATES (Specialized Use Cases)
# ============================================================================

named_templates:
  autonomous_execution_progress:
    description: "Enhanced progress template for autonomous plan execution with visual Unicode progress bars integrated into phase table"
    tier: "TIER 3"
    orchestrator_engaged: true
    display_moments:
      - "beginning": "Show complete phase table"
      - "phase_completion": "Show overall progress and next phase"
      - "overall_completion": "Show complete phase table"
    format: |
      ## 🛡️🧠 CORTEX Plan Execution
      **Author:** Asif Hussain | **Plan:** {{plan_name}} | **Orchestrator:** Planning System 4.0 ✅
      
      ---
      
      ### 📊 Execution Progress
      
      {{#if show_full_table}}
      | # | Phase | Status | Progress | TDD Status | Tasks | Time |
      |---|-------|--------|----------|------------|-------|------|
      | **Overall** | **{{status_emoji}}** | **[{{overall_bar}}] {{overall_percentage}}%** | **Phase {{current_phase}}/{{total_phases}}** | - | {{total_completed_tasks}}/{{total_tasks}} | {{total_elapsed_time}} |
      {{#each phases}}
      | {{phase_num}} | {{#if completed}}✅{{else if in_progress}}⏳{{else}}⏸️{{/if}} **{{phase_name}}** | {{status_text}} | [{{phase_bar}}] {{percentage}}% | {{#if tdd_enabled}}R{{#if red_done}}✅{{else}}⏸️{{/if}} G{{#if green_done}}✅{{else}}⏸️{{/if}} F{{#if refactor_done}}✅{{else}}⏸️{{/if}}{{else}}N/A{{/if}} | {{completed_tasks}}/{{total_tasks}} | {{elapsed_time}} |
      {{/each}}
      {{else}}
      | **Overall Progress** | **[{{overall_bar}}] {{overall_percentage}}%** | **Phase {{current_phase}}/{{total_phases}}** |
      |---------------------|------------------------------------------------|------------------------------------------|
      | **Next Phase** | ⏳ **{{next_phase_name}}** | Starting now |
      {{/if}}
      
      {{#if threat_analysis_enabled}}
      ### 🔒 Security Analysis
      
      | Metric | Value |
      |--------|-------|
      | **Threats** | {{threat_count}} ({{critical_count}} Critical, {{high_count}} High, {{medium_count}} Medium) |
      | **STRIDE** | {{stride_categories}} |
      | **Mitigations** | [{{mitigation_bar}}] {{mitigations_done}}/{{mitigations_total}} |
      {{/if}}
      
      ### ✅ Validation Status
      
      | Check | Status |
      |-------|--------|
      | **Definition of Ready** | {{#if dor_passed}}✅ Passed{{else}}⚠️ {{dor_violations}} issue(s){{/if}} |
      | **Definition of Done** | {{#if dod_passed}}✅ Passed{{else}}⏳ {{dod_remaining}} remaining{{/if}} |
      
      **Next:** {{next_action}}
    context_needed: true
    metadata:
      category: planning
      operation: autonomous_execution
    response_type: adaptive
    progress_helpers:
      description: "Use TemplateRenderer helper methods for progress bar generation"
      methods:
        - "generate_progress_bar(percentage, width=20, filled='█', empty='░')"
        - "generate_tdd_status(red_done, green_done, refactor_done)"
        - "format_elapsed_time(seconds)"
        - "generate_phase_rows(phases)"
        - "render_autonomous_progress(...) - Full convenience method"
  
  # Maintenance, Sanitization, Refinement templates reference base-components.yaml
  # These orchestrators use visual progress templates defined in:
  # cortex-brain/response-templates/base-components.yaml
  #   - maintenance_execution_progress (6-phase)
  #   - sanitization_execution_progress (5-phase)
  #   - refinement_execution_progress (7-phase)
  
  ado_execution_progress:
    description: "Enhanced ADO work item generation progress with story points and hierarchy tracking integrated into phase table"
    tier: "TIER 3"
    orchestrator_engaged: true
    display_moments:
      - "beginning": "Show complete phase table with work item summary"
      - "phase_completion": "Show overall progress and next phase"
      - "overall_completion": "Show complete phase table with work item summary"
    format: |
      ## 🛡️🧠 CORTEX ADO Work Item Generation
      **Author:** Asif Hussain | **Feature:** {{feature_name}} | **Orchestrator:** ADO System ✅
      
      ---
      
      ### 📊 ADO Generation Progress
      
      {{#if show_full_table}}
      | # | Phase | Status | Progress | Items | SP | Time |
      |---|-------|--------|----------|-------|-------|------|
      | **Overall** | **{{status_emoji}}** | **[{{overall_bar}}] {{overall_percentage}}%** | **Phase {{current_phase}}/{{total_phases}}** | {{items_created}}/{{items_planned}} | {{story_points_total}} SP | {{total_elapsed_time}} |
      {{phase_rows}}
      {{else}}
      | **Overall Progress** | **[{{overall_bar}}] {{overall_percentage}}%** | **Phase {{current_phase}}/{{total_phases}}** |
      |---------------------|------------------------------------------------|------------------------------------------|
      | **Next Phase** | ⏳ **{{next_phase_name}}** | Starting now |
      {{/if}}
      
      ### 🎫 Work Item Summary
      
      | Type | Count | Story Points | Status |
      |------|-------|--------------|--------|
      | **Epic** | {{epic_count}} | - | {{epic_status}} |
      | **Feature** | {{feature_count}} | {{feature_sp}} SP | {{feature_status}} |
      | **User Story** | {{story_count}} | {{story_sp}} SP | {{story_status}} |
      | **Task** | {{task_count}} | {{task_sp}} SP | {{task_status}} |
      
      {{#if ado_links}}
      ### 🔗 Azure DevOps Links
      
      {{#each ado_links}}
      - [{{type}}: {{title}}]({{url}})
      {{/each}}
      {{/if}}
      
      ### ✅ Validation Status
      
      | Check | Status |
      |-------|--------|
      | **Definition of Ready** | {{#if dor_passed}}✅ Passed{{else}}⚠️ {{dor_violations}} issue(s){{/if}} |
      | **Definition of Done** | {{#if dod_passed}}✅ Passed{{else}}⏳ {{dod_remaining}} remaining{{/if}} |
      | **ADO Authentication** | {{#if ado_auth_valid}}✅ Connected{{else}}❌ Not authenticated{{/if}} |
      
      **Next:** {{next_action}}
    context_needed: true
    metadata:
      category: ado
      operation: ado_execution
    response_type: adaptive
    progress_helpers:
      description: "Use TemplateRenderer helper methods for ADO progress rendering"
      methods:
        - "generate_progress_bar(percentage, width=20, filled='█', empty='░')"
        - "generate_ado_phase_rows(phases)"
        - "format_elapsed_time(seconds)"
        - "render_ado_progress(...) - Full convenience method"
  
  progress_bar_simple:
    description: "Simple inline progress bar for quick status updates"
    tier: "TIER 2"
    format: "[{{filled_bar}}{{empty_bar}}] {{percentage}}%"
    example: "[████████████░░░░░░░░] 60%"
    context_needed: true

