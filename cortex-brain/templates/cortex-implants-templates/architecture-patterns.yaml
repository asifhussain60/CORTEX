version: '1.0'

required_patterns:
  - name: "Repository Pattern"
    description: "All data access through repository abstraction"
    enforcement: "STRICT"
    validation: "Check for direct DB calls outside repositories/"
    example: "UserRepository.findById() instead of db.query()"
  
  - name: "Dependency Injection"
    description: "Use DI container for all service instantiation"
    enforcement: "STRICT"
    validation: "No 'new' keyword for services"
    example: "constructor(private userService: IUserService)"
  
  - name: "Feature Modules"
    description: "Features encapsulated in modules with barrel exports"
    enforcement: "MODERATE"
    validation: "Check for index.ts in feature folders"
    example: "src/features/auth/index.ts exports all auth-related exports"

anti_patterns:
  - name: "God Object"
    description: "Classes with >500 lines or >20 methods"
    severity: "HIGH"
    action: "BLOCK"
    detection: "Count lines and methods in class files"
  
  - name: "Circular Dependencies"
    description: "Import cycles between modules"
    severity: "CRITICAL"
    action: "BLOCK"
    detection: "Static analysis of import graph"
  
  - name: "Magic Numbers"
    description: "Hardcoded numbers without constants"
    severity: "MEDIUM"
    action: "WARN"
    detection: "Check for numeric literals in code"
  
  - name: "Tight Coupling"
    description: "Direct instantiation of dependencies"
    severity: "HIGH"
    action: "BLOCK"
    detection: "Check for 'new' keyword with services"

layer_boundaries:
  - layer: "presentation"
    description: "UI components, pages, views"
    allowed_dependencies: ["application", "domain"]
    forbidden_dependencies: ["infrastructure"]
    example: "Components can use application services, not database"
  
  - layer: "application"
    description: "Business logic, use cases"
    allowed_dependencies: ["domain"]
    forbidden_dependencies: ["presentation", "infrastructure"]
    example: "Use cases call domain entities, not UI or DB"
  
  - layer: "domain"
    description: "Core business entities and rules"
    allowed_dependencies: []
    forbidden_dependencies: ["*"]
    example: "Domain entities have no external dependencies"
  
  - layer: "infrastructure"
    description: "Database, external APIs, file system"
    allowed_dependencies: ["domain"]
    forbidden_dependencies: ["presentation", "application"]
    example: "Repositories implement domain interfaces"

design_principles:
  - principle: "Single Responsibility"
    description: "Each class/function has one reason to change"
    enforcement: "MODERATE"
  
  - principle: "Open/Closed"
    description: "Open for extension, closed for modification"
    enforcement: "MODERATE"
  
  - principle: "Interface Segregation"
    description: "Many specific interfaces better than one general"
    enforcement: "MODERATE"
  
  - principle: "Dependency Inversion"
    description: "Depend on abstractions, not concretions"
    enforcement: "STRICT"

code_smells:
  - smell: "Long Method"
    threshold: 50
    action: "WARN"
  
  - smell: "Long Parameter List"
    threshold: 4
    action: "WARN"
  
  - smell: "Duplicate Code"
    similarity_threshold: 0.8
    action: "WARN"
  
  - smell: "Dead Code"
    description: "Unused functions, variables, imports"
    action: "BLOCK"
