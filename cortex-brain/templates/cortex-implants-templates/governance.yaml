version: '1.0'

# Company Information
company_name: "Your Company Name"
division: "Engineering"
contact: "dev-standards@company.com"

# Repository Information
repo_name: "your-repo-name"
repo_type: "library"  # Options: library, web-application, api-service, mobile-app, microservice, desktop-app
language: "Python"
framework: "FastAPI"

# Enforcement Settings
enforcement_level: "MODERATE"  # Options: STRICT (block), MODERATE (warn), ADVISORY (log)
block_on_violation: false
require_approval_override: false

# Enabled Rules
rules_enabled:
  - CODING_STANDARDS
  - ARCHITECTURE_PATTERNS
  - BUSINESS_RULES
  - TECH_STACK
  - SECURITY_POLICY

# Integration Flags
integration_flags:
  copilot_instructions: true  # Auto-generate .github/copilot-instructions.md
  planning_system: true        # Inject rules into Planning System
  tdd_workflow: true           # Extend TDD with company-specific tests
  code_review: true            # Pre-commit validation

# Priority Level
priority: "MEDIUM"  # Options: HIGH (company overrides CORTEX), MEDIUM, LOW
