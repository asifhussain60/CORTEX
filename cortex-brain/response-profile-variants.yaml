# Response Profile Variants
# Version: 3.3.0
# Purpose: Profile-based response adaptations (interaction mode + detail level)
# Part of: Response Template System Refactor (Phase 5)

schema_version: '3.3'
last_updated: '2025-12-02'
refactor_phase: 'modular_architecture'

# ============================================================================
# INTERACTION MODES - How user prefers to work with CORTEX
# ============================================================================

interaction_modes:
  # -------------------------------------------------------------------------
  # AUTONOMOUS MODE - Minimal guidance, action-focused
  # -------------------------------------------------------------------------
  autonomous:
    id: mode_autonomous
    description: "Experienced users who want minimal guidance"
    characteristics:
      - "Concise responses by default"
      - "Action-focused, minimal explanations"
      - "No 'challenge' section unless critical"
      - "Compact format preferred"
    
    default_detail_level: concise
    
    section_adaptations:
      section_understanding:
        inclusion: optional  # Can be omitted in autonomous mode
        max_length: 100
      
      section_challenge:
        inclusion: conditional  # Only if actual challenge exists
        exclude_if: "No Challenge"
      
      section_response:
        inclusion: required
        style: "direct"
        max_length: 300
      
      section_request_echo:
        inclusion: optional
        max_length: 50
      
      section_next_steps:
        inclusion: required
        style: "bullet_points"
        max_items: 3
    
    format_preference: compact

  # -------------------------------------------------------------------------
  # GUIDED MODE - Balanced guidance, professional tone
  # -------------------------------------------------------------------------
  guided:
    id: mode_guided
    description: "Users who want balanced guidance and context"
    characteristics:
      - "Standard 5-part format"
      - "Clear explanations without excess"
      - "Professional tone"
      - "All sections included"
    
    default_detail_level: balanced
    
    section_adaptations:
      section_understanding:
        inclusion: required
        max_length: 200
      
      section_challenge:
        inclusion: required
        style: "clear_statement"
      
      section_response:
        inclusion: required
        style: "professional"
        max_length: 500
      
      section_request_echo:
        inclusion: required
        max_length: 100
      
      section_next_steps:
        inclusion: required
        style: "numbered_list"
        max_items: 5
    
    format_preference: standard_5_part

  # -------------------------------------------------------------------------
  # EDUCATIONAL MODE - Detailed explanations, teaching-focused
  # -------------------------------------------------------------------------
  educational:
    id: mode_educational
    description: "Users learning CORTEX or new to domain"
    characteristics:
      - "Detailed explanations"
      - "Teaching-focused tone"
      - "Examples and context provided"
      - "Learning resources included"
    
    default_detail_level: verbose
    
    section_adaptations:
      section_understanding:
        inclusion: required
        max_length: 400
        style: "detailed_with_context"
      
      section_challenge:
        inclusion: required
        style: "educational_explanation"
        include_learning_points: true
      
      section_response:
        inclusion: required
        style: "teaching"
        max_length: 800
        include_examples: true
      
      section_request_echo:
        inclusion: required
        max_length: 200
        style: "interpretation_included"
      
      section_next_steps:
        inclusion: required
        style: "detailed_with_rationale"
        max_items: 7
        include_learning_resources: true
    
    additional_sections:
      - section_learning_objectives
      - section_resources
    
    format_preference: educational

  # -------------------------------------------------------------------------
  # PAIR PROGRAMMING MODE - Collaborative, thinking-out-loud
  # -------------------------------------------------------------------------
  pair:
    id: mode_pair
    description: "Collaborative pair programming style"
    characteristics:
      - "Thinking process shared"
      - "Alternatives discussed"
      - "Collaborative tone"
      - "Trade-offs explained"
    
    default_detail_level: balanced
    
    section_adaptations:
      section_understanding:
        inclusion: required
        max_length: 250
        style: "collaborative_interpretation"
      
      section_challenge:
        inclusion: required
        style: "collaborative_discussion"
        include_alternatives: true
      
      section_response:
        inclusion: required
        style: "thinking_out_loud"
        max_length: 600
        include_trade_offs: true
      
      section_request_echo:
        inclusion: required
        max_length: 150
        style: "collaborative_confirmation"
      
      section_next_steps:
        inclusion: required
        style: "collaborative_planning"
        max_items: 5
        include_decision_points: true
    
    format_preference: standard_5_part

# ============================================================================
# EXPERIENCE LEVELS - User's technical proficiency
# ============================================================================

experience_levels:
  # -------------------------------------------------------------------------
  # JUNIOR - New to domain, needs detailed guidance
  # -------------------------------------------------------------------------
  junior:
    id: experience_junior
    description: "New to domain or technology"
    
    content_adaptations:
      explanation_depth: "detailed"
      terminology: "explained"  # Define technical terms
      examples: "multiple"
      assumptions: "minimal"  # Don't assume prior knowledge
      
    guidance_level:
      step_by_step: true
      include_prerequisites: true
      include_gotchas: true
      include_resources: true

  # -------------------------------------------------------------------------
  # MID-LEVEL - Competent, needs occasional guidance
  # -------------------------------------------------------------------------
  mid:
    id: experience_mid
    description: "Competent developer with some experience"
    
    content_adaptations:
      explanation_depth: "moderate"
      terminology: "standard"  # Use standard terms
      examples: "when_helpful"
      assumptions: "basic_knowledge"  # Assume fundamentals known
      
    guidance_level:
      step_by_step: false
      include_prerequisites: false
      include_gotchas: true
      include_resources: false

  # -------------------------------------------------------------------------
  # SENIOR - Experienced, needs minimal guidance
  # -------------------------------------------------------------------------
  senior:
    id: experience_senior
    description: "Senior developer with deep experience"
    
    content_adaptations:
      explanation_depth: "brief"
      terminology: "advanced"  # Use technical jargon
      examples: "minimal"
      assumptions: "solid_foundation"  # Assume strong knowledge
      
    guidance_level:
      step_by_step: false
      include_prerequisites: false
      include_gotchas: false
      include_resources: false

  # -------------------------------------------------------------------------
  # EXPERT - Domain expert, wants technical depth only
  # -------------------------------------------------------------------------
  expert:
    id: experience_expert
    description: "Domain expert or architect"
    
    content_adaptations:
      explanation_depth: "technical_only"
      terminology: "expert"  # Advanced terminology
      examples: "edge_cases_only"
      assumptions: "expert_knowledge"  # Assume deep expertise
      
    guidance_level:
      step_by_step: false
      include_prerequisites: false
      include_gotchas: false
      include_resources: false

# ============================================================================
# RESPONSE DETAIL PREFERENCE - User's explicit verbosity choice
# ============================================================================

response_detail_preferences:
  # -------------------------------------------------------------------------
  # CONCISE - Minimal content, action-focused
  # -------------------------------------------------------------------------
  concise:
    id: detail_concise
    description: "Brief, action-focused responses"
    priority: "primary"  # Overrides interaction_mode defaults
    
    global_rules:
      max_total_length: 500  # characters for entire response
      sentence_limit: 2  # Max sentences per section
      list_item_limit: 3  # Max items in lists
      code_example_limit: 1  # Max code examples
      
    section_overrides:
      section_understanding:
        max_length: 50
        style: "one_sentence"
      
      section_challenge:
        max_length: 30
        style: "label_only"  # "No Challenge" or brief statement
      
      section_response:
        max_length: 200
        style: "direct_answer"
      
      section_request_echo:
        max_length: 30
        style: "brief_summary"
      
      section_next_steps:
        max_length: 100
        style: "action_items_only"
        max_items: 3

  # -------------------------------------------------------------------------
  # BALANCED - Moderate detail, professional tone (DEFAULT)
  # -------------------------------------------------------------------------
  balanced:
    id: detail_balanced
    description: "Standard response with appropriate detail"
    priority: "secondary"  # Respects interaction_mode defaults
    
    global_rules:
      max_total_length: 1500  # characters for entire response
      sentence_limit: 4  # Max sentences per section
      list_item_limit: 5  # Max items in lists
      code_example_limit: 2  # Max code examples
      
    section_overrides: {}  # Uses default section lengths

  # -------------------------------------------------------------------------
  # VERBOSE - Comprehensive detail, teaching-focused
  # -------------------------------------------------------------------------
  verbose:
    id: detail_verbose
    description: "Detailed, comprehensive responses"
    priority: "primary"  # Overrides interaction_mode defaults
    
    global_rules:
      max_total_length: 3000  # characters for entire response
      sentence_limit: null  # No limit
      list_item_limit: 10  # Max items in lists
      code_example_limit: 5  # Max code examples
      
    section_overrides:
      section_understanding:
        max_length: 400
        style: "detailed_with_context"
        include_background: true
      
      section_challenge:
        max_length: 300
        style: "detailed_explanation"
        include_impact: true
        include_mitigation: true
      
      section_response:
        max_length: 1000
        style: "comprehensive"
        include_examples: true
        include_alternatives: true
      
      section_request_echo:
        max_length: 200
        style: "detailed_interpretation"
      
      section_next_steps:
        max_length: 500
        style: "detailed_with_rationale"
        max_items: 10
        include_estimated_time: true
        include_dependencies: true

# ============================================================================
# PRIORITY RESOLUTION - How to handle conflicting preferences
# ============================================================================

priority_resolution:
  # Rule: response_detail overrides interaction_mode defaults
  # Exception: If response_detail = balanced, use interaction_mode defaults
  
  resolution_order:
    - response_detail_preference  # User's explicit choice (highest priority)
    - interaction_mode  # User's working style
    - experience_level  # User's proficiency
    - template_defaults  # Template-specific defaults
  
  conflict_resolution:
    concise_in_educational_mode:
      strategy: "respect_user_preference"
      result: "Concise format, but keep teaching tone"
      example: "Short explanations that still teach concepts"
    
    verbose_in_autonomous_mode:
      strategy: "respect_user_preference"
      result: "Verbose format, but keep action-focus"
      example: "Detailed explanations, but emphasize actionable items"
    
    balanced_respects_mode:
      strategy: "defer_to_mode"
      result: "Use interaction_mode defaults"
      example: "Balanced in Educational = verbose, Balanced in Autonomous = concise"
