# Retrieval Pipeline
# CORTEX Knowledge Base - Domain Integration
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "domain-integration"
  subcategory: "retrieval"

# RAG Pipeline Architecture
architecture:
  stages:
    - name: "Query Processing"
      steps: ["Query rewriting", "Query expansion", "Entity extraction"]
      
    - name: "Retrieval"
      steps: ["Vector search", "Hybrid search", "Metadata filtering"]
      
    - name: "Reranking"
      steps: ["Cross-encoder scoring", "Relevance scoring"]
      
    - name: "Context Assembly"
      steps: ["Deduplication", "Context ordering", "Prompt construction"]
      
    - name: "Generation"
      steps: ["LLM inference", "Citation linking", "Response validation"]

# Advanced Techniques
techniques:
  query_rewriting:
    description: "Improve query before retrieval"
    methods:
      - "HyDE (Hypothetical Document Embeddings)"
      - "Query expansion with synonyms"
      - "Multi-query generation"
    
  contextual_compression:
    description: "Extract only relevant parts of retrieved docs"
    benefit: "Fit more relevant context in token budget"
    
  recursive_retrieval:
    description: "Retrieve → Generate → Retrieve again"
    use_case: "Complex multi-hop questions"

# Production Patterns
production:
  caching:
    - "Cache frequent queries"
    - "Cache retrieval results (short TTL)"
    - "Cache LLM responses"
    
  monitoring:
    metrics:
      - "Retrieval latency"
      - "LLM latency"
      - "Total pipeline latency"
      - "Cache hit rate"
      - "Retrieval relevance scores"
    
  error_handling:
    - "Fallback to simpler retrieval"
    - "Retry with exponential backoff"
    - "Graceful degradation"

related_knowledge:
  - "vector-database-guide.yaml"
  - "domain-rag-integration.yaml"
