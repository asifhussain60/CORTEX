rules:
  # ==========================================================================
  # CORE-001: Incremental Autonomous Execution
  # ==========================================================================
  - rule_id: CORE-001
    original_id: INCREMENTAL_AUTONOMOUS_EXECUTION
    category: orchestration_lifecycle
    severity: blocked
    name: Small Incremental Autonomous Operations Required
    description: |
      ALL orchestrators MUST work in small, meaningful increments to prevent
      token limit errors and server failures (HTTP 502).
      
      Large monolithic operations that exceed token context windows cause
      catastrophic failures. Orchestrators MUST operate autonomously without
      manual intervention between increments.
    
    enforcement:
      trigger: orchestrator_execution_start
      action: block_if_operation_too_large
    
    validation:
      - Operations split into <500 line increments per execution
      - Each increment is independently executable
      - State persisted between increments (continuation support)
      - Token usage monitored and capped at 80% of limit
      - Autonomous mode enabled by default (no user prompts mid-execution)
    
    implementation:
      middleware: src.orchestrators.middleware.incremental_executor.IncrementalExecutor
      hook: pre_execution
      priority: 8
      token_monitor: src.utils.token_counter.TokenUsageMonitor
    
    examples:
      pass:
        - "Phase 1: Process 50 files → Phase 2: Process next 50 files (incremental)"
        - "Orchestrator completes Phase 1 autonomously → Auto-proceeds to Phase 2"
        - "Token usage 75% → Checkpoint state → Continue in next turn"
      fail:
        - "Process all 1000 files in single execution (causes 502 error)"
        - "Orchestrator pauses mid-execution waiting for user approval"
        - "No state persistence between phases (restart from scratch)"
    
    error_reference: "Server error 502 (request ID: c43bcffb-60ff-4d8c-ae4c-0c56e1c679cd) - Token limit exceeded"
    
    rationale: |
      Incremental execution prevents:
      1. Token limit errors (HTTP 502, context overflow)
      2. Loss of work (operation fails halfway, no state saved)
      3. Manual intervention burden (user must approve every step)
      4. Timeout failures (operation takes too long)
      5. Memory exhaustion (processing too much data at once)

  # ==========================================================================
  # CORE-002: No Summary File Generation
  # ==========================================================================
  - rule_id: CORE-002
    original_id: NO_SUMMARY_FILE_GENERATION
    category: response_formatting
    severity: blocked
    name: Block Summary/Report/Explanation File Creation
    description: |
      Orchestrators MUST NOT create markdown summary files (*-summary.md,
      *-report.md, *-explanation.md) at the end of each turn.
      
      Users explicitly request NOT to create these files as they clutter
      the workspace and provide no value. Executive summaries should be
      provided directly in the GitHub Copilot chat, NOT as files.
    
    enforcement:
      trigger: file_creation_attempt
      action: block_if_summary_file
    
    validation:
      - "No files matching patterns: *-summary.md, *-report.md, *-explanation.md, completion-*.md"
      - "No files in root with 'summary', 'report', 'explanation' in name"
      - "Exception: Required reports in plan_folder/reports/ (validation-report.md, etc.)"
      - "Exception: Required analysis in plan_folder/analysis/ (gap-analysis.md, etc.)"
    
    implementation:
      middleware: src.orchestrators.middleware.file_creation_guard.FileCreationGuard
      hook: pre_file_creation
      priority: 2
      blocklist_patterns:
        - "*-summary.md"
        - "*-report.md"
        - "*-explanation.md"
        - "completion-*.md"
        - "executive-summary.md"
        - "EXECUTIVE-SUMMARY.md"
    
    examples:
      pass:
        - "Executive summary provided in chat response (no file created)"
        - "cortex-brain/documents/planning/active/cortex5-epic/reports/validation-report.md (allowed)"
      fail:
        - "Created cortex-brain/documents/planning/active/cortex5-epic/EXECUTIVE-SUMMARY.md"
        - "Created cortex-brain/documents/planning/active/cortex5-epic/completion-report.md"

  # ==========================================================================
  # CORE-003: Visual Progress Response Format
  # ==========================================================================
  - rule_id: CORE-003
    original_id: VISUAL_PROGRESS_RESPONSE_FORMAT
    category: response_formatting
    severity: blocked
    name: Executive Summary with Visual Progress Bars Required
    description: |
      ALL orchestrator responses MUST provide executive summaries without
      code snippets, using visual progress bars.
      
      Response format MUST follow cortex-maintenance.prompt.md visual
      progress bar style. Code snippets clutter responses and reduce
      readability; users want high-level summaries only.
    
    enforcement:
      trigger: orchestrator_completion
      action: block_if_code_snippets_or_missing_progress
    
    validation:
      - Response contains executive summary section
      - Executive summary has NO code snippets (no ```...``` blocks)
      - Visual progress bars present (█████░░░░░ style)
      - Progress bars show phase completion percentage
      - Response length ≤40 lines (concise format)
    
    implementation:
      middleware: src.orchestrators.middleware.response_formatter.ResponseFormatter
      hook: post_execution
      priority: 5
      template_reference: "cortex-brain/response-templates-v4.yaml:autonomous_execution_progress"

  # ==========================================================================
  # CORE-004: No Continuation Bloat
  # ==========================================================================
  - rule_id: CORE-004
    original_id: NO_CONTINUATION_BLOAT
    category: response_formatting
    severity: blocked
    name: Minimal Continuation Prompt Token Budget
    description: |
      CONTINUATION-PROMPT.md MUST stay under strict token budget for
      efficient session resumption. Historical context and explanatory
      text belong in referenced files, not the prompt itself.
      
      Use POINTER PATTERN: Reference files for context, don't duplicate
      content. Enable LAZY LOADING: Let GitHub Copilot load context files
      on-demand.
    
    enforcement:
      trigger: plan_update_completion
      action: block_if_exceeds_limits
    
    validation:
      - Line count ≤12 lines
      - Token count <500 tokens (estimate: chars ÷ 4.5)
      - File size <2KB
      - No historical change logs (use tracking/history.json)
      - No explanatory context (use phases/phase-XX.md)
      - No multi-step checklists (reference cortex-planner.prompt.md)

  # ==========================================================================
  # CORE-005: Path Portability
  # ==========================================================================
  - rule_id: CORE-005
    original_id: PATH_PORTABILITY
    category: portability
    severity: blocked
    name: Portable Path Resolution Required
    description: |
      NEVER use hardcoded absolute paths. ALWAYS use relative paths or
      dynamic detection.
      
      CORTEX must work across different installations (Windows, macOS,
      Linux) with different install locations.
    
    enforcement:
      trigger: code_change
      action: block_if_hardcoded_path
    
    validation:
      - No hardcoded paths like /Users/username/... or C:\Users\...
      - Use src.utils.project_root.get_project_root() for dynamic detection
      - Use Path(__file__).resolve() for relative resolution
      - Config files use relative paths only
    
    implementation:
      utility: src.utils.project_root
      pattern: get_project_root()

  # ==========================================================================
  # CORE-006: Setup Verification
  # ==========================================================================
  - rule_id: CORE-006
    original_id: SETUP_VERIFICATION
    category: orchestration_lifecycle
    severity: blocked
    name: 'Phase -2: Setup Verification Mandatory'
    description: |
      ALL orchestrators MUST run Phase -2 setup verification before execution.
      This prevents false positives and ensures dependencies are ACTUALLY
      complete.
    
    enforcement:
      trigger: orchestrator_execution_start
      action: block_if_verification_fails
    
    validation:
      - Dependencies must pass implementation tests (not just file existence)
      - False positive detection must run
      - VSCode cache state must be checked
      - Governance compliance must be validated
    
    implementation:
      middleware: src.orchestrators.middleware.setup_verification.SetupVerifier
      hook: pre_execution
      priority: 1

  # ==========================================================================
  # CORE-007: Teardown Refactor
  # ==========================================================================
  - rule_id: CORE-007
    original_id: TEARDOWN_REFACTOR
    category: orchestration_lifecycle
    severity: blocked
    name: 'Phase N+1: Teardown + REFACTOR + Commit Mandatory'
    description: |
      ALL orchestrators MUST run Phase N+1 teardown after execution.
      This ensures code cleanup and atomic git commits follow
      /cortex-git-commit pattern.
    
    enforcement:
      trigger: orchestrator_execution_complete
      action: block_if_refactor_fails
    
    validation:
      - Whole-file REFACTOR must run (remove unused imports, orphaned code)
      - All modified files must be refactored
      - Git commit must follow /cortex-git-commit pattern
      - Commit message must include orchestrator name + phase summary
    
    implementation:
      middleware: src.orchestrators.middleware.teardown_refactor.TeardownRefactor
      hook: post_execution
      priority: 30

  # ==========================================================================
  # CORE-008: TDD Enforcement
  # ==========================================================================
  - rule_id: CORE-008
    original_id: TDD_ENFORCEMENT
    category: development_workflow
    severity: blocked
    name: Test-Driven Development Mandatory
    description: |
      Tests MUST be written BEFORE implementation (RED → GREEN → REFACTOR).
      This prevents untested code from entering the codebase.
    
    enforcement:
      trigger: code_change
      action: block_if_no_test_first
    
    validation:
      - Test file must exist before implementation file
      - Test must fail initially (RED phase)
      - Implementation makes test pass (GREEN phase)
      - REFACTOR phase removes code smells

  # ==========================================================================
  # CORE-009: Plan File Organization
  # ==========================================================================
  - rule_id: CORE-009
    original_id: PLAN_FILE_ORGANIZATION
    category: architecture_integrity
    severity: blocked
    name: Plan Files Must Live Within Plan Folder Structure
    description: |
      ALL files related to epics, plans, features, and implementations MUST
      be housed within the plan folder structure in designated subfolders.
      
      Root-level file creation is DISCOURAGED unless absolutely necessary
      (e.g., core project files like README.md, requirements.txt).
    
    enforcement:
      trigger: file_creation
      action: block_if_root_level_plan_file
    
    validation:
      - Plan artifacts must be in plan_folder/artifacts/
      - Analysis documents must be in plan_folder/analysis/
      - Progress reports must be in plan_folder/reports/
      - Context documents must be in plan_folder/context/
      - Scripts must be in plan_folder/scripts/
      - Tracking data must be in plan_folder/tracking/
      - No plan-related files in workspace root

  # ==========================================================================
  # CORE-010: Script Organization
  # ==========================================================================
  - rule_id: CORE-010
    original_id: SCRIPT_ORGANIZATION_ENFORCEMENT
    category: architecture_integrity
    severity: blocked
    name: Script Consolidation & Cataloging Required
    description: |
      ALL utility scripts MUST be properly organized via Cortex Toolkit
      Orchestrator with child orchestrators for cataloging.
      
      Multiple scripts doing the same functionality MUST be consolidated
      into unified modules.
    
    enforcement:
      trigger: script_creation
      action: block_if_uncataloged_or_duplicate
    
    validation:
      - Scripts must be cataloged by Cortex Toolkit Orchestrator
      - Duplicate functionality detection scanner must run
      - Similar scripts must be consolidated into single module
      - Orphaned scripts (unused) must be archived

  # ==========================================================================
  # CORE-011: Python Type Hints
  # ==========================================================================
  - rule_id: CORE-011
    original_id: PYTHON_TYPE_HINTS_MANDATORY
    category: quality_gates
    severity: blocked
    name: Type Hints Required for All Functions/Methods
    description: |
      ALL Python functions and methods MUST have complete type hints for
      parameters and return values.
      
      Type safety is CRITICAL for CORTEX because it generates and executes
      Python code autonomously.
    
    enforcement:
      trigger: code_change
      action: block_if_missing_type_hints
    
    validation:
      - All function parameters must have type hints (except self, cls)
      - All functions must have return type hints (use None if no return)
      - Complex types must use typing module (List, Dict, Optional, Union, etc.)
      - Class attributes must have type hints
      - No use of Any type without justification comment
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      checker: mypy --strict
      hook: pre_file_save
      priority: 10

  # ==========================================================================
  # CORE-012: Python Docstrings
  # ==========================================================================
  - rule_id: CORE-012
    original_id: PYTHON_DOCSTRINGS_MANDATORY
    category: quality_gates
    severity: blocked
    name: Docstrings Required for All Public APIs
    description: |
      ALL public Python modules, classes, functions, and methods MUST have
      docstrings following Google style.
      
      Docstrings explain WHY code exists and HOW to use it, not WHAT it does
      (code explains that).
    
    enforcement:
      trigger: code_change
      action: block_if_missing_docstrings
    
    validation:
      - All public modules must have module docstrings
      - All public classes must have class docstrings
      - All public functions/methods must have docstrings with Args/Returns/Raises
      - Private functions (starting with _) are exempt but encouraged
      - Docstrings must follow Google style format
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      checker: pydocstyle --convention=google
      hook: pre_file_save
      priority: 11

  # ==========================================================================
  # CORE-013: Python Error Handling
  # ==========================================================================
  - rule_id: CORE-013
    original_id: PYTHON_ERROR_HANDLING_REQUIRED
    category: quality_gates
    severity: blocked
    name: Explicit Error Handling with Custom Exceptions
    description: |
      ALL error conditions MUST be handled explicitly with custom exception
      classes.
      
      Bare except blocks and generic Exception catching are PROHIBITED.
      CORTEX must fail fast with clear error messages, not hide failures.
    
    enforcement:
      trigger: code_change
      action: block_if_bare_except_or_generic_catch
    
    validation:
      - No bare except clauses (must specify exception type)
      - No catching generic Exception without re-raising
      - Custom exception classes for domain-specific errors
      - All exceptions must have descriptive messages
      - Error context must be preserved (use "from" for chaining)
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      checker: pylint --disable=all --enable=bare-except,broad-except
      hook: pre_file_save
      priority: 12

  # ==========================================================================
  # CORE-014: SOLID Principles
  # ==========================================================================
  - rule_id: CORE-014
    original_id: PYTHON_SOLID_PRINCIPLES_REQUIRED
    category: architecture_integrity
    severity: blocked
    name: SOLID Principles Enforcement
    description: |
      ALL Python classes and modules MUST follow SOLID principles.
      
      Single Responsibility, Open/Closed, Liskov Substitution, Interface
      Segregation, Dependency Inversion.
    
    enforcement:
      trigger: code_change
      action: block_if_solid_violation
    
    validation:
      - Single Responsibility - Class has one reason to change
      - Open/Closed - Extend behavior via inheritance/composition, not modification
      - Liskov Substitution - Subclasses must be substitutable for base classes
      - Interface Segregation - Many specific interfaces > one general interface
      - Dependency Inversion - Depend on abstractions (protocols), not concrete classes
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      analyzer: src.orchestrators.middleware.solid_analyzer.SOLIDAnalyzer
      hook: pre_file_save
      priority: 13

  # ==========================================================================
  # CORE-015: Python Import Organization
  # ==========================================================================
  - rule_id: CORE-015
    original_id: PYTHON_IMPORT_ORGANIZATION_REQUIRED
    category: quality_gates
    severity: warning
    name: Import Organization (PEP 8)
    description: |
      ALL Python imports MUST be organized in 3 groups: stdlib, third-party,
      local.
      
      Each group separated by blank line, sorted alphabetically.
    
    enforcement:
      trigger: code_change
      action: auto_fix_with_isort
    
    validation:
      - Imports grouped in 3 sections (stdlib, third-party, local)
      - Each section sorted alphabetically
      - Blank line between sections
      - No wildcard imports (from x import *)
      - Absolute imports preferred over relative
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      formatter: isort --profile=black
      hook: pre_file_save
      priority: 14

  # ==========================================================================
  # CORE-016: Python Code Formatting
  # ==========================================================================
  - rule_id: CORE-016
    original_id: PYTHON_CODE_FORMATTING_REQUIRED
    category: quality_gates
    severity: warning
    name: Black Code Formatting
    description: |
      ALL Python code MUST be formatted with Black (line length 100).
      
      Consistent formatting reduces cognitive load and eliminates style
      debates.
    
    enforcement:
      trigger: code_change
      action: auto_format_with_black
    
    validation:
      - Black formatting with --line-length=100
      - No manual line length violations
      - Consistent string quote style (double quotes)
      - Consistent trailing commas in multi-line structures
    
    implementation:
      middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
      formatter: black --line-length=100
      hook: pre_file_save
      priority: 15

  # ==========================================================================
  # CORE-017: Governance Enforcement
  # ==========================================================================
  - rule_id: CORE-017
    original_id: GOVERNANCE_ENFORCEMENT
    category: security_privacy
    severity: blocked
    name: Strict Governance Enforcement
    description: |
      ALL governance rules MUST be enforced strictly with audit logging.
      
      No overrides allowed. All violations and attempts to override must
      be logged.
    
    enforcement:
      trigger: always
      action: enforce_all_rules
    
    validation:
      - Enforcement level = strict
      - Override allowed = false
      - Audit logging enabled
      - Track violations = true
      - Track overrides = false

  # ==========================================================================
  # CORE-018: YAML-First Enforcement
  # ==========================================================================
  - rule_id: CORE-018
    original_id: YAML_FIRST_REQUIRED
    category: architecture_integrity
    severity: blocked
    name: YAML-First Design Mandatory
    description: |
      ALL orchestrators, plans, and implementations MUST follow YAML-first
      machine-readable design.
      
      Markdown plan files (*-PLAN.md, *-plan.md) are PROHIBITED. All planning
      and tracking must use YAML files (00-TODO-CONTINUITY-TRACKER.yaml,
      features-summary.yaml, etc.).
      
      Exceptions:
      - Architecture documentation in cortex-brain/documents/architecture/ (optional)
      - README.md files for quick-start guides
      - CONTINUATION-PROMPT.md (auto-generated)
      
      VIOLATION EXAMPLES:
      - feat04-core-orchestration-PLAN.md (should be in tracker YAML)
      - intelligence-layer-design.md in docs/planning/ (should be YAML or deleted)
    
    enforcement:
      trigger: file_creation
      action: block_if_markdown_plan_file
    
    validation:
      - No *-PLAN.md or *-plan.md files (use YAML tracker)
      - No *-design.md files in planning/ (use architecture/ or YAML)
      - No implementation-*.md files (should be YAML configs)
      - Exception: architecture/ folder can have .md docs (optional, prefer YAML)
      - Exception: README.md, CONTINUATION-PROMPT.md (auto-generated)
    
    implementation:
      middleware: src.orchestrators.middleware.yaml_first_validator.YAMLFirstValidator
      hook: pre_file_creation
      priority: 3
      audit_category: GOVERNANCE_VIOLATION
      git_hook: pre-commit
    
    blocklist_patterns:
      - "*-PLAN.md"
      - "*-plan.md"
      - "*-implementation-plan.md"
      - "cortex-brain/documents/planning/**/*-design.md"
      - "cortex-brain/documents/planning/**/*-architecture.md"
    
    allowlist_patterns:
      - "README.md"
      - "CONTINUATION-PROMPT.md"
      - "cortex-brain/documents/architecture/**/*.md"
      - "**/reports/*.md"  # Completion reports in plan folders OK
      - "**/analysis/*.md"  # Analysis docs in plan folders OK
    
    examples:
      pass:
        - "Updated 00-TODO-CONTINUITY-TRACKER.yaml with feat04 tasks"
        - "Created cortex-brain/config/intelligence-rules.yaml"
        - "Created cortex-brain/documents/architecture/intelligence-layer.md (optional)"
        - "Created tests/unit/test_intelligence_middleware.py"
      fail:
        - "Created cortex-brain/documents/planning/feat04-core-orchestration-PLAN.md"
        - "Created cortex-brain/documents/architecture/intelligence-layer-design.md (wrong location)"
        - "Created feat04-implementation-plan.md"
    
    audit_logging:
      on_violation: true
      severity: ERROR
      correlation_prefix: "YAML-FIRST-VIOLATION"
      message_template: "Blocked {file_path}: YAML-first violation - use YAML for plans/configs"
    
    git_hook_enforcement:
      enabled: true
      hook_type: "pre-commit"
      reject_commit_if_violated: true
      error_message: |
        ❌ YAML-FIRST VIOLATION DETECTED
        
        The following files violate YAML-first principle:
        {violated_files}
        
        ✅ CORRECT APPROACH:
        - Use 00-TODO-CONTINUITY-TRACKER.yaml for task tracking
        - Use YAML configs for orchestrator rules/settings
        - Architecture docs (optional) go in cortex-brain/documents/architecture/
        
        ❌ Delete these files or move to correct location before committing.
    
    rationale: |
      YAML-first prevents:
      1. Markdown bloat (verbose text files that duplicate tracker data)
      2. Parser ambiguity (Markdown requires LLM parsing, YAML is machine-readable)
      3. Inconsistent planning (some use MD, some use YAML)
      4. Workspace clutter (unnecessary planning documents)
      5. Feature drift (implementation diverges from plan when not YAML-driven)
      
      Benefits of YAML-first:
      1. Machine-readable (no LLM parsing needed)
      2. Validation possible (JSON schema, linters)
      3. Consistent structure (all plans follow same format)
      4. Direct execution (YAML → Python execution without translation)
      5. Token efficiency (compact, no natural language bloat)

  # ==========================================================================
  # CORE-019: TDD-Master Orchestrator Required for All Development
  # ==========================================================================
  - rule_id: CORE-019
    category: development_workflow
    severity: blocked
    name: All Development Must Go Through TDD-Master Orchestrator
    description: |
      ALL code implementation (planned or unplanned) MUST be executed through
      the TDD-Master Orchestrator. GitHub Copilot MUST NEVER write implementation
      code directly.
      
      TDD-Master Orchestrator ensures:
      - RED→GREEN→REFACTOR workflow enforcement
      - 100% test coverage before implementation
      - Governance rule compliance (Tier0-3)
      - Acceptance criteria validation
      - Clean code principles (SOLID/DRY/KISS)
      - Security pattern enforcement
      
      Exception: Documentation, configuration, and non-code files may be
      created directly by Copilot.
    
    enforcement:
      trigger: user_request_contains_implementation_intent
      action: route_to_tdd_master_orchestrator
    
    validation:
      - User requests "implement", "build", "create", "fix" → Route to TDD-Master
      - User requests "plan" → Route to Planning Orchestrator (which may invoke TDD-Master)
      - User provides code snippet → Suggest TDD-Master instead of direct implementation
      - GitHub Copilot NEVER writes Python/TypeScript/JavaScript implementation files
      - Exception: README.md, YAML config, JSON data files can be created directly
    
    implementation:
      middleware: src.orchestrators.middleware.development_router.DevelopmentRouter
      hook: pre_request_processing
      priority: 10  # Highest priority (blocks all implementation attempts)
      router: src.orchestrators.routing.trie_router.TrieRouter
    
    pattern_routing:
      route_to_tdd_master:
        - "implement *"
        - "build *"
        - "create *"
        - "add feature *"
        - "fix bug *"
        - "refactor *"
        - "write code *"
        - "develop *"
        - "code this *"
        - "make this *"
        - "quick implement *"
        - "tdd *"
        - "test and implement *"
      
      route_to_planning:
        - "plan *"
        - "design *"
        - "architect *"
        - "requirements for *"
      
      allow_direct_copilot:
        - "explain *"
        - "document *"
        - "analyze *"
        - "review *"
        - "find *"
        - "search *"
    
    examples:
      pass:
        - "User: 'implement user authentication' → Copilot: Routes to TDD-Master"
        - "User: 'fix login bug' → Copilot: Routes to TDD-Master (unplanned mode)"
        - "User: 'plan OAuth system' → Copilot: Routes to Planning Orchestrator"
        - "User: 'document this function' → Copilot: Creates documentation directly"
      
      fail:
        - "User: 'implement login' → Copilot writes src/auth/login.py directly ❌"
        - "User: 'add validation' → Copilot adds code to existing file ❌"
        - "User: 'quick fix this bug' → Copilot edits code without tests ❌"
    
    copilot_response_template: |
      I can't implement code directly. All development must go through the
      TDD-Master Orchestrator to ensure:
      
      ✅ Tests written first (RED phase)
      ✅ Implementation (GREEN phase)
      ✅ Refactoring (REFACTOR phase)
      ✅ 100% test coverage
      ✅ Governance compliance
      
      Would you like me to route this to TDD-Master Orchestrator?
      
      Options:
      1. **Unplanned Mode** (quick implementation): "tdd implement [feature]"
      2. **Planned Mode** (full planning first): "plan and implement [feature]"
    
    rationale: |
      TDD-Master enforcement prevents:
      1. Untested code (code written without tests)
      2. Governance violations (rules bypassed when Copilot writes directly)
      3. Technical debt (quick fixes without refactoring)
      4. Security vulnerabilities (no security test enforcement)
      5. Inconsistent code quality (SOLID/DRY not enforced)
      
      Benefits of TDD-Master routing:
      1. 100% test coverage guarantee (RED phase enforced)
      2. Consistent quality (all code passes same governance checks)
      3. Security by default (security tests in RED phase)
      4. Maintainable code (REFACTOR phase mandatory)
      5. Audit trail (all development logged with AC validation)
      6. Flexibility (both planned and unplanned modes supported)

  # ==========================================================================
  # CORE-020: No Markdown Files for Orchestrator Work Products
  # ==========================================================================
  - rule_id: CORE-020
    category: response_formatting
    severity: blocked
    name: Orchestrators Must Not Create Markdown Work Products
    description: |
      Orchestrators MUST NOT create markdown (.md) files as work products,
      outputs, or intermediate artifacts. All orchestrator outputs should use:
      
      - YAML (.yaml) for structured data, configs, plans, tracking
      - JSON (.json) for API responses, data interchange
      - Python (.py) for executable scripts and tools
      
      Markdown is ONLY acceptable for:
      - Human-authored documentation (docs/, README.md at project root)
      - System prompts (.github/prompts/*.md)
      
      STRICTLY FORBIDDEN in cortex-brain/:
      - cortex-brain/tier0/ → YAML only (governance rules)
      - cortex-brain/tier1/ → YAML/JSON only (tracking, acceptance criteria)
      - cortex-brain/tier2/ → YAML only (engineering standards)
      - cortex-brain/tier3/ → YAML only (domain patterns)
      - cortex-brain/config/ → YAML only
      - cortex-brain/manifests/ → YAML only
      
      All knowledge files MUST be machine-readable. No markdown in brain.
    
    enforcement:
      trigger: orchestrator_file_creation
      action: block_if_markdown_work_product
    
    validation:
      - Orchestrator outputs use YAML/JSON/Python, not markdown
      - Plans stored in YAML (00-TODO-CONTINUITY-TRACKER.yaml pattern)
      - Reports use YAML structure (not *-report.md)
      - Analysis results use JSON (not *-analysis.md)
      - Progress tracking uses JSON (progress-tracker.json)
      - cortex-brain/**/*.md is BLOCKED (no exceptions)
      - Exception: Human documentation (README.md at root, docs/)
      - Exception: Prompt files (.github/prompts/*.md)
    
    implementation:
      middleware: src.orchestrators.middleware.file_creation_guard.FileCreationGuard
      hook: pre_file_creation
      priority: 2
    
    blocklist_for_orchestrators:
      - "*.md"  # Default block all markdown from orchestrators
      - "cortex-brain/**/*.md"  # STRICT: No markdown in brain (no exceptions)
    
    allowlist_exceptions:
      - "README.md"  # Project root readme only
      - "docs/**/*.md"  # Human documentation folder
      - ".github/prompts/*.md"  # System prompts
      - ".asif/**/*.md"  # Personal notes/chat history
    
    explicitly_blocked:
      - "cortex-brain/tier0/**/*.md"
      - "cortex-brain/tier1/**/*.md"
      - "cortex-brain/tier2/**/*.md"
      - "cortex-brain/tier3/**/*.md"
      - "cortex-brain/config/**/*.md"
      - "cortex-brain/manifests/**/*.md"
      - "cortex-brain/documents/**/*.md"  # Use YAML for all brain documents
    
    alternatives:
      instead_of: "analysis-report.md"
      use: "analysis-report.yaml or analysis-report.json"
      
      instead_of: "implementation-plan.md"
      use: "00-TODO-CONTINUITY-TRACKER.yaml"
      
      instead_of: "progress-summary.md"
      use: "progress-tracker.json"
      
      instead_of: "gap-analysis.md"
      use: "gap-analysis.yaml"
    
    examples:
      pass:
        - "Orchestrator creates cortex-brain/tier1/tracking/progress-tracker.json"
        - "Orchestrator creates cortex-brain/config/audit-config.yaml"
        - "Orchestrator creates src/tools/analyzer.py"
        - "User creates docs/getting-started.md (human-authored documentation)"
      fail:
        - "Orchestrator creates cortex-brain/analysis-report.md"
        - "Orchestrator creates cortex-brain/tier1/epic-summary.md"
        - "Orchestrator creates implementation-notes.md"
        - "Orchestrator creates feature-design.md"
    
    rationale: |
      Markdown-free orchestrator outputs ensure:
      1. Machine-readability (YAML/JSON parse without LLM interpretation)
      2. Efficiency (scripts execute directly, no translation needed)
      3. Validation (schema validation for YAML/JSON)
      4. Token efficiency (structured data vs. verbose prose)
      5. Automation (CI/CD can process YAML/JSON natively)
      6. Consistency (single format per data type)
      
      Markdown is designed for human reading, not machine processing.
      Orchestrators work with machines, so they should output machine formats.

