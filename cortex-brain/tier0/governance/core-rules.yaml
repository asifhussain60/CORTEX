  # ==========================================================================
  # CORE-021: Orchestrator Scaffolder Compliance (Forward-Only)
  # ==========================================================================
  - rule_id: CORE-021
    original_id: ORCHESTRATOR_SCAFFOLDER_COMPLIANCE
    category: architecture_integrity
    severity: blocked
    name: New Orchestrators MUST Use Scaffolder
    description: |
      ALL NEW orchestrators MUST be created via the Orchestrator Scaffolder
      (`src/tools/orchestrator_scaffolder.py`). This ensures:
      1. MasterOrchestrator registration (@register_with_master decorator)
      2. 4-tier governance compliance injection
      3. Manifest contract validation
      4. Test stub generation
      5. Team ownership tracking
      
      EXCEPTION: Legacy orchestrators created before this rule may remain
      non-compliant until formal migration (AC-MIGRATE-001 in Phase 5).
      
      CRITICAL: MasterOrchestrator is IN CHARGE - never bypassed.
    
    enforcement:
      trigger: orchestrator_creation
      action: block_if_not_scaffolded
    
    validation:
      - Orchestrator created via `orchestrator_scaffolder.py` CLI
      - Extends BaseOrchestratorV4
      - Has @register_with_master decorator on class
      - Has @require_master_routing decorator on execute()
      - Manifest exists in cortex-brain/manifests/orchestrators/
      - Tier3 domain patterns file created
      - Test stubs generated
    
    implementation:
      middleware: src.orchestrators.middleware.orchestrator_creation_guard.OrchestratorCreationGuard
      hook: pre_file_creation
      priority: 3
    
    exceptions:
      legacy_orchestrators:
        description: "Orchestrators created before CORE-021 are exempt until AC-MIGRATE-001"
        list:
          - TDDMasterOrchestrator
          - PlanningOrchestratorV5
          - ADOOrchestratorV2
          - VacuumOrchestratorV2
          - InvestigationOrchestratorV2
          - SanitizationOrchestratorV2
          - MaintenanceOrchestratorV2
          - ReviewOrchestratorV2
          - GapFixOrchestrator
          - TDDOrchestrator
          - MasterOrchestrator  # Special: top-level controller
        migration_tracked_by: "AC-MIGRATE-001"
        migration_phase: 5
    
    ac_ids:
      - AC-SCAFFOLD-001  # Scaffolder CLI
      - AC-SCAFFOLD-003  # MasterOrchestrator registration
      - AC-SCAFFOLD-005  # Manifest validation
    
    future_work:
