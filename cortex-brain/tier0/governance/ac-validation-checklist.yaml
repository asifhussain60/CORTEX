# ==============================================================================
# AC-ID GOVERNANCE VALIDATION CHECKLIST
# ==============================================================================
# Purpose: Per-AC-ID validation checklist for governance compliance
# Used by: Cortex Builder, TDD-Master, Orchestrators
# Execution: Before AC-ID starts, during implementation, after completion
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
category: AC_VALIDATION

metadata:
  purpose: "Pre-start, during, and post-completion governance validation"
  audit_logging: true
  required_before_lock: "100% AC-IDs must have VALIDATION_COMPLETE"

# ==============================================================================
# UNIVERSAL AC-ID VALIDATION (ALL AC-IDs)
# ==============================================================================

universal_checks:
  pre_start:
    - name: "Git Checkpoint"
      rule: "CORE-026"
      check: "Create checkpoint: 'checkpoint: before AC-XXX-XXX'"
      audit_event: "AC_GIT_CHECKPOINT"
      blocking: true
    
    - name: "Load Phase Rules"
      rule: "CORE-017"
      check: "Load applicable rules from phase-enforcement-map.yaml"
      audit_event: "AC_RULES_LOADED"
      blocking: true
    
    - name: "Audit Log Start"
      rule: "CORE-027"
      check: "Create audit entry: AC_START with timestamp, rules list"
      audit_event: "AC_START"
      blocking: true
    
    - name: "Verify Predecessor AC"
      rule: "CORE-026"
      check: "If AC has predecessor, verify it's in COMPLETE status"
      audit_event: "AC_PREDECESSOR_CHECK"
      blocking: true
  
  during_implementation:
    - name: "Type Hints Check"
      rule: "CORE-011"
      check: "Each function parameter and return typed (no bare Any)"
      audit_event: "AC_TYPE_HINTS_CHECK"
      blocking: true
      trigger: "On file save"
    
    - name: "Docstring Check"
      rule: "CORE-012"
      check: "All public functions/classes have Google-style docstrings"
      audit_event: "AC_DOCSTRING_CHECK"
      blocking: true
      trigger: "On file save"
    
    - name: "Error Handling Check"
      rule: "CORE-013"
      check: "No bare except, no generic Exception"
      audit_event: "AC_ERROR_HANDLING_CHECK"
      blocking: true
      trigger: "On file save"
    
    - name: "Naming Convention Check"
      rule: "CORE-028"
      check: "Files match kebab-case, ≤25 chars total length"
      audit_event: "AC_NAMING_CHECK"
      blocking: true
      trigger: "On file create/rename"
    
    - name: "Path Hardcoding Check"
      rule: "CORE-005"
      check: "No absolute paths (/Users/..., C:\\Users\\...)"
      audit_event: "AC_PATH_CHECK"
      blocking: true
      trigger: "On code review"
    
    - name: "Test Existence Check"
      rule: "CORE-008"
      check: "Test file exists and test fails (RED) before implementation"
      audit_event: "AC_TEST_EXISTS"
      blocking: true
      trigger: "Before implementation starts"
    
    - name: "SOLID Check"
      rule: "CORE-014"
      check: "Code review: Single responsibility, Open/closed, etc."
      audit_event: "AC_SOLID_CHECK"
      blocking: true
      trigger: "Before commit"
    
    - name: "Audit Log Execute"
      rule: "CORE-027"
      check: "Log progress: AC_EXECUTE with implementation details"
      audit_event: "AC_EXECUTE"
      blocking: false
      frequency: "Hourly or per major step"
  
  post_completion:
    - name: "Tests Passing"
      rule: "CORE-008"
      check: "ALL tests pass (GREEN)"
      audit_event: "AC_TESTS_PASSING"
      blocking: true
    
    - name: "Git Commit"
      rule: "CORE-026"
      check: "Create commit: 'AC-XXX-XXX: [desc] - tests passing'"
      audit_event: "AC_GIT_COMMIT"
      blocking: true
    
    - name: "Audit Log Complete"
      rule: "CORE-027"
      check: "Create audit entry: AC_COMPLETE with final status"
      audit_event: "AC_COMPLETE"
      blocking: true
    
    - name: "Code Review"
      rule: "CORE-011, CORE-012, CORE-013"
      check: "Final code review: types, docs, error handling"
      audit_event: "AC_CODE_REVIEW"
      blocking: true
    
    - name: "Refactoring"
      rule: "CORE-016, CORE-015"
      check: "Black format, PEP 8 imports"
      audit_event: "AC_REFACTORING"
      blocking: false

# ==============================================================================
# PHASE-SPECIFIC AC VALIDATIONS
# ==============================================================================

phase_specific:
  PHASE-01:
    AR-001-01:
      title: "Tier 0 rules loaded"
      pre_checks:
        - "File exists: cortex-brain/tier0/governance/core-rules.yaml"
        - "YAML valid: governance_tier: 0"
        - "Rule count: 28 rules"
      validation:
        - "CORE-018: YAML-First (no markdown)"
        - "CORE-028: Kebab-case naming"
      post_checks:
        - "Parse succeeds without errors"
        - "Audit log entry created"
    
    AR-002-01:
      title: "governance.db created with schema"
      pre_checks:
        - "Database file creatable"
      validation:
        - "CORE-005: No hardcoded paths"
        - "CORE-011: Type hints on DB code"
        - "CORE-008: Tests exist first"
      post_checks:
        - "Schema matches expected tables"
        - "WAL mode enabled (via test)"
        - "Query performance <1ms (via benchmark)"
    
    AR-003-01:
      title: "@governance_enforced decorator validates all rules"
      pre_checks:
        - "core-rules.yaml loaded"
      validation:
        - "CORE-008: Tests for decorator exist"
        - "CORE-011: Type hints on decorator"
        - "CORE-012: Decorator documented"
      post_checks:
        - "Decorator correctly loads rules"
        - "Validates all applicable rules"
  
  PHASE-02:
    AR-006-01:
      title: "Orchestrator Architecture"
      pre_checks:
        - "BaseOrchestrator defined"
      validation:
        - "CORE-008: Tests for orchestrator exist"
        - "CORE-019: Uses TDD-Master pattern"
        - "CORE-021: Uses scaffolder"
        - "CORE-024: @mcp_tool decorators present"
        - "CORE-014: SOLID principles"
      post_checks:
        - "Orchestrator registrable"
        - "MCP tools exported correctly"
    
    AR-007-01:
      title: "MCP Server Integration"
      pre_checks:
        - "MCP tools defined"
      validation:
        - "CORE-024: All tools have @mcp_tool"
        - "CORE-025: Functions return Result[T]"
        - "CORE-011: Type hints present"
      post_checks:
        - "Server startable"
        - "Tools discoverable"

# ==============================================================================
# COMPLIANCE MATRIX TEMPLATE
# ==============================================================================

compliance_matrix:
  ac_id: "AC-XXX-XXX"
  phase_id: "PHASE-XX"
  title: "[AC Title from roadmap]"
  
  checks:
    - rule_id: "CORE-XXX"
      rule_name: "[Rule name from core-rules.yaml]"
      enforcement: "blocked|warning"
      status: "NOT_CHECKED|PASS|FAIL|WARNING"
      evidence: "[Description or file reference]"
      checked_at: "[Timestamp]"
      checked_by: "[AI Agent or Human]"
    
    # Example of filled-in entry:
    - rule_id: "CORE-008"
      rule_name: "Test-First Development"
      enforcement: "blocked"
      status: "PASS"
      evidence: "tests/unit/test_response_headers.py (29/29 passing)"
      checked_at: "2026-01-15T10:30:00Z"
      checked_by: "Cortex Builder"
  
  summary:
    total_checks: 0  # Count above
    passed: 0
    failed: 0
    warnings: 0
    completion_percentage: 0.0
    ready_for_complete: false  # true only if all blocked rules PASS and no FAIL

# ==============================================================================
# AUDIT LOG EVENTS FOR AC-IDS
# ==============================================================================

audit_events:
  AC_GIT_CHECKPOINT:
    event_type: "checkpoint"
    description: "Git checkpoint created before AC-ID implementation"
    required_fields:
      - ac_id
      - checkpoint_message
      - commit_hash
      - timestamp
  
  AC_RULES_LOADED:
    event_type: "governance"
    description: "Applicable governance rules loaded for AC-ID"
    required_fields:
      - ac_id
      - phase_id
      - rule_ids (list)
      - timestamp
  
  AC_START:
    event_type: "lifecycle"
    description: "AC-ID implementation started"
    required_fields:
      - ac_id
      - phase_id
      - rules_to_validate (list of rule_id)
      - timestamp
      - started_by
  
  AC_EXECUTE:
    event_type: "lifecycle"
    description: "AC-ID implementation in progress (periodic updates)"
    required_fields:
      - ac_id
      - progress_status  # "in_progress" | "blocked" | "complete"
      - recent_changes (list of files)
      - timestamp
      - last_test_run  # timestamp of last test
  
  AC_TYPE_HINTS_CHECK:
    event_type: "validation"
    description: "Type hints validated"
    required_fields:
      - ac_id
      - files_checked
      - violations (list)
      - status  # "PASS" | "FAIL"
      - timestamp
  
  AC_DOCSTRING_CHECK:
    event_type: "validation"
    description: "Docstrings validated"
    required_fields:
      - ac_id
      - files_checked
      - violations (list)
      - status
      - timestamp
  
  AC_ERROR_HANDLING_CHECK:
    event_type: "validation"
    description: "Error handling validated"
    required_fields:
      - ac_id
      - files_checked
      - violations (list)
      - status
      - timestamp
  
  AC_NAMING_CHECK:
    event_type: "validation"
    description: "File naming conventions validated (CORE-028)"
    required_fields:
      - ac_id
      - files_checked
      - violations (list)
      - status
      - timestamp
  
  AC_TESTS_PASSING:
    event_type: "validation"
    description: "All tests for AC-ID passing"
    required_fields:
      - ac_id
      - test_file
      - total_tests
      - passed
      - failed
      - timestamp
  
  AC_GIT_COMMIT:
    event_type: "checkpoint"
    description: "Git commit after AC-ID completion"
    required_fields:
      - ac_id
      - commit_message
      - commit_hash
      - timestamp
  
  AC_COMPLETE:
    event_type: "lifecycle"
    description: "AC-ID implementation complete and validated"
    required_fields:
      - ac_id
      - phase_id
      - all_rules_passed  # true | false
      - violations_list (empty if all passed)
      - final_test_results
      - timestamp
      - completed_by
  
  AC_CODE_REVIEW:
    event_type: "validation"
    description: "Final code review completed"
    required_fields:
      - ac_id
      - reviewer
      - passed  # true | false
      - notes
      - timestamp

# ==============================================================================
# VALIDATION QUERY EXAMPLES
# ==============================================================================

validation_queries:
  ac_compliance_status: |
    -- Check if AC-ID is fully compliant before marking COMPLETE
    SELECT ac_id, 
           COUNT(DISTINCT rule_id) as rules_applicable,
           SUM(CASE WHEN status='PASS' THEN 1 ELSE 0 END) as passed,
           SUM(CASE WHEN status='FAIL' THEN 1 ELSE 0 END) as failed,
           SUM(CASE WHEN status='WARNING' THEN 1 ELSE 0 END) as warnings
    FROM ac_compliance_matrix
    WHERE ac_id = ?
    GROUP BY ac_id
    HAVING failed = 0  -- No failures before allowing COMPLETE
  
  ac_ready_for_complete: |
    -- True only if all blocking rules passed
    SELECT CASE 
             WHEN SUM(CASE WHEN enforcement='blocked' AND status='FAIL' THEN 1 ELSE 0 END) = 0
               AND SUM(CASE WHEN enforcement='blocked' AND status='PASS' THEN 1 ELSE 0 END) > 0
             THEN 1 ELSE 0
           END as ready_for_complete
    FROM ac_compliance_matrix
    WHERE ac_id = ?
  
  phase_audit_trail: |
    -- All audit events for a phase (needed for phase lock)
    SELECT ac_id, event_type, timestamp, description
    FROM audit_log
    WHERE phase_id = ?
    ORDER BY timestamp
  
  violations_by_ac: |
    -- All violations in a phase
    SELECT ac_id, rule_id, rule_name, violation_count
    FROM ac_compliance_matrix
    WHERE phase_id = ? AND status='FAIL'
    ORDER BY ac_id, rule_id
