    - INT-RULE-003
    - INT-RULE-004
    - INT-RULE-007
  mcp_tools:
    - log_interaction
    - capture_decision
    - create_feedback_item
    - escalate_issue
    - generate_knowledge_article
  capabilities:
    - context_preservation
    - decision_tracking
    - feedback_management
    - knowledge_base_integration
    - stakeholder_communication
  performance_sla:
    interaction_logging_timeout: 5000  # milliseconds
    decision_capture_timeout: 10000
    feedback_processing_timeout: 3000

