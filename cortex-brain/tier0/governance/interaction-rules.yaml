# ==============================================================================
# TIER 0 GOVERNANCE - INTERACTION ORCHESTRATOR DOMAIN RULES
# ==============================================================================
# Purpose: User interaction and communication orchestrator governance rules
# Domain: interaction
# Status: ACTIVE
#
# These rules apply to Interaction orchestrators and their domain-specific operations.
# They enforce constraints on user feedback, communication protocols, and knowledge capture.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
domain: interaction
category: DOMAIN_ORCHESTRATOR
precedence: HIGH

metadata:
  rule_count: 8
  domain_id: "interaction"
  domain_name: "User Interaction & Communication"
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."
  created_at: "2026-01-15T00:00:00Z"

categories:
  - communication_protocol
  - user_feedback
  - knowledge_capture
  - decision_logging
  - context_sharing
  - stakeholder_management

# ==============================================================================
# RULE DEFINITIONS
# ==============================================================================
rules:
  # --------------------------------------------------------------------------
  # INT-RULE-001: Context Preservation
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-001
    category: context_sharing
    severity: blocked
    name: Interaction Context Preservation
    description: |
      All user interactions MUST preserve and carry forward context:
      - User intent (what they asked/wanted to accomplish)
      - Background information (why they're doing this)
      - Constraints (what cannot be changed, deadlines, budgets)
      - Decisions made (what was decided and why)
      - Assumptions (what we're assuming is true)
      
      Context MUST be accessible in future interactions.
      Loss of context ≥2 times in same topic = escalation required.
    validation:
      - Context documented at interaction start
      - Context carries forward in conversation
      - No repeated questions about same topic
      - Escalation triggered if >2 context losses

  # --------------------------------------------------------------------------
  # INT-RULE-002: Communication Channel Selection
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-002
    category: communication_protocol
    severity: high
    name: Appropriate Communication Channel Usage
    description: |
      Communication channels MUST be used appropriately:
      - Synchronous chat (Slack) for: urgent issues, quick questions, <5min responses
      - Asynchronous (email, tickets) for: decisions, documentation, records
      - Scheduled sync (meetings) for: complex decisions, team alignment, high-stakes
      - Logged artifacts (wiki, ADO) for: permanent records, future reference
      
      Decision rule: If it must be remembered later, log it asynchronously.
    validation:
      - Urgent issues not left in chat only
      - Important decisions logged formally
      - Meetings have documented outcomes
      - No critical info in ephemeral channels only

  # --------------------------------------------------------------------------
  # INT-RULE-003: Decision Documentation
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-003
    category: decision_logging
    severity: blocked
    name: Decision Capture & Rationale
    description: |
      Every significant decision MUST be documented with:
      - Decision statement (what was decided)
      - Rationale (why this was chosen)
      - Alternatives considered (and why rejected)
      - Stakeholders (who made it, who approved it)
      - Date decided (timestamp)
      - Impact (what changes, what stays same)
      - Reversibility (can it be undone? at what cost?)
      
      Decision must be in decision log or formal ticket, not chat.
    validation:
      - Decision logged within 24 hours
      - Rationale ≥50 words
      - ≥2 alternatives documented
      - Stakeholders signed off
      - Impact assessed
      - Reversibility noted

  # --------------------------------------------------------------------------
  # INT-RULE-004: User Feedback Loop
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-004
    category: user_feedback
    severity: high
    name: Structured Feedback Collection
    description: |
      User feedback MUST be:
      - Collected in structured format (not freeform)
      - Tagged with: feedback type (bug, enhancement, question), priority, target AC-ID
      - Acknowledged within 24 hours (receipt confirmation)
      - Categorized and deduplicated
      - Tracked to resolution (when/how addressed)
      - Closed with explanation if not addressed
      
      Feedback source must be logged (who gave it, when, channel).
    validation:
      - Feedback captured in system
      - Classification tags applied
      - Acknowledgment sent to user
      - Deduplication checked
      - Resolution tracked
      - User notified of outcome

  # --------------------------------------------------------------------------
  # INT-RULE-005: Escalation Protocol
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-005
    category: stakeholder_management
    severity: high
    name: Escalation & Issue Management
    description: |
      Issues MUST be escalated following protocol:
      - Level 1: Team member attempts resolution (4 hour window)
      - Level 2: Team lead involved (2 hour window)
      - Level 3: Project manager involved (1 hour window)
      - Level 4: Executive stakeholder involved (immediate)
      
      Escalation must include: issue description, attempts made, current blocker, requested resolution.
      Each escalation level logged with timestamp and owner.
    validation:
      - Level 1 owner assigned immediately
      - Status updated every 2 hours during escalation
      - Escalation logged with reason
      - Owner change tracked
      - Resolution time meets SLA

  # --------------------------------------------------------------------------
  # INT-RULE-006: Knowledge Base Contribution
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-006
    category: knowledge_capture
    severity: high
    name: Knowledge Base Maintenance
    description: |
      Whenever a question is answered, answer MUST be:
      - Documented in knowledge base (if not already exists)
      - Tagged with: topic, audience level (beginner/intermediate/advanced), keywords
      - Linked from ADO work items (if work item related)
      - Reviewed for accuracy within 48 hours
      - Updated when circumstances change
      
      Knowledge base articles must be ≥200 words and include example.
    validation:
      - Article created within 48 hours of answer
      - Article tagged appropriately
      - Linked from relevant work items
      - Minimum 200 words
      - Example or use case included
      - Review completed

  # --------------------------------------------------------------------------
  # INT-RULE-007: Async-First Communication
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-007
    category: communication_protocol
    severity: high
    name: Asynchronous-First Decision Making
    description: |
      All decisions MUST start asynchronous (email, ADO ticket, wiki doc):
      - Decision proposal posted with deadline (48-72 hours)
      - Stakeholders have time to review and comment asynchronously
      - Objections documented (must explain "why" for veto power)
      - Async discussion preferred over sync meetings
      - If sync meeting needed, async discussion precedes it
      
      Synchronous-only decisions (no async period) must be documented as emergencies.
    validation:
      - Decision in writing before finalization
      - Comment period ≥48 hours (except emergencies)
      - All stakeholder objections addressed
      - Objections logged even if overridden
      - Emergency decisions flagged

  # --------------------------------------------------------------------------
  # INT-RULE-008: Response Time SLAs
  # --------------------------------------------------------------------------
  - rule_id: INT-RULE-008
    category: communication_protocol
    severity: high
    name: Response Time Service Level Agreements
    description: |
      Communication responses MUST follow SLAs:
      - CRITICAL severity: Response within 1 hour
      - HIGH severity: Response within 4 hours
      - MEDIUM severity: Response within 24 hours
      - LOW severity: Response within 72 hours
      
      SLA clock starts when ticket created; stopped when acknowledged.
      SLA breaches must be escalated and documented.
    validation:
      - Severity assigned to all issues
      - First response logged with timestamp
      - SLA met or breach documented
      - Breach escalated appropriately
      - Resolution follows severity timeline

