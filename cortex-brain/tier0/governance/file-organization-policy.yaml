# File Organization Policy for CORTEX 6.0

## Purpose

Establish consistent rules for where generated artifacts from orchestrators and prompts should be stored, how they should be named, and how they integrate with governance systems.

## Problem Statement

Current state shows files generated across multiple locations with inconsistent naming:
- Brittleness AC-IDs in separate YAML file instead of AC-INDEX.yaml
- 400+ TDD reports creating workspace clutter
- File names violate kebab-case limit (20 chars)
- Evidence bundles not organized by purpose
- Progress updates not reflected in plan-viewer

## Output Location Standards

### Primary Categories

| Category | Location | Subdirectories | Purpose |
|----------|----------|-----------------|---------|
| **Acceptance Criteria** | `cortex-brain/tier1/acceptance-criteria/` | N/A - single file | AC registry (single source of truth) |
| **Evidence Bundles** | `cortex-brain/tier1/evidence-bundles/` | By AC-ID: `AC-{CATEGORY}-{NNN}/` | Proof of completion (manifest + tests + audit) |
| **Progress Tracking** | `cortex-brain/tier1/tracking/` | See below | Phase state, metrics, completion % |
| **Governance Policies** | `cortex-brain/tier0/governance/` | By policy type | Rules, merger logic, enforcement |
| **Analysis Reports** | `cortex-brain/documents/reports/` | By category: brittleness/, tdd/, validation/ | Non-critical analysis (archived after use) |
| **Plan Documents** | `cortex-brain/documents/planning/` | Organized per cx6-plan structure | Roadmaps, strategies, planning artifacts |
| **Historical Archives** | `cortex-brain/archives/` | By review date: brittleness-2026-01-12/, tdd-2026-01-12/ | Old reports (preserved for audit trail) |

