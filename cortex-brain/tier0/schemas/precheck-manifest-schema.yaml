schema_version: "1.0"
manifest_type: "pre_execution_validation"
description: "Schema for Pre-Execution Validation System (PEVS) compatibility manifests"

# ==============================================================================
# Manifest Structure
# ==============================================================================

manifest:
  # Metadata
  manifest_id:
    type: "string"
    pattern: "precheck-{correlation_id}"
    required: true
    description: "Unique manifest identifier"
  
  timestamp:
    type: "datetime"
    format: "ISO8601"
    required: true
    description: "Manifest generation timestamp"
  
  schema_version:
    type: "string"
    required: true
    description: "Manifest schema version"
  
  # Target Information
  orchestrator:
    type: "object"
    required: true
    properties:
      name:
        type: "string"
        description: "Orchestrator human-readable name"
      
      class_path:
        type: "string"
        pattern: "src.orchestrators.*"
        description: "Python import path to orchestrator class"
      
      registry_id:
        type: "string"
        description: "Orchestrator ID in registry"
      
      version:
        type: "string"
        description: "Orchestrator version"
  
  # Validation Results
  validation_results:
    type: "object"
    required: true
    properties:
      
      # AC-PRECHECK-001: Signature Validation
      signature_validation:
        type: "object"
        required: true
        properties:
          status:
            type: "enum"
            values: ["PASS", "FAIL", "WARNING", "SKIPPED"]
            required: true
          
          score:
            type: "integer"
            min: 0
            max: 100
            description: "Signature compatibility score"
          
          checks_performed:
            type: "array"
            items:
              - "init_signature"
              - "execute_signature"
              - "parameter_types"
              - "return_types"
          
          issues:
            type: "array"
            items:
              type: "object"
              properties:
                severity:
                  type: "enum"
                  values: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
                
                type:
                  type: "enum"
                  values:
                    - "missing_parameter"
                    - "extra_parameter"
                    - "type_mismatch"
                    - "missing_annotation"
                    - "incompatible_default"
                
                parameter:
                  type: "string"
                  description: "Parameter name causing issue"
                
                expected:
                  type: "string"
                  description: "Expected type/value"
                
                provided:
                  type: "string"
                  nullable: true
                  description: "Actual type/value provided"
                
                recommendation:
                  type: "string"
                  description: "Human-readable fix suggestion"
                
                fix_code:
                  type: "string"
                  description: "Executable Python code to fix issue"
                
                affected_method:
                  type: "enum"
                  values: ["__init__", "execute", "validate", "cleanup"]
      
      # AC-PRECHECK-002: Parameter Compatibility
      parameter_compatibility:
        type: "object"
        required: true
        properties:
          status:
            type: "enum"
            values: ["PASS", "FAIL", "WARNING", "SKIPPED"]
          
          score:
            type: "integer"
            min: 0
            max: 100
          
          checks_performed:
            type: "array"
            items:
              - "caller_callee_mapping"
              - "required_params_present"
              - "optional_params_valid"
              - "type_compatibility"
          
          issues:
            type: "array"
            items:
              type: "object"
              properties:
                severity:
                  type: "enum"
                  values: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
                
                type:
                  type: "enum"
                  values:
                    - "parameter_mismatch"
                    - "missing_required_param"
                    - "incompatible_types"
                    - "ambiguous_mapping"
                
                caller_param:
                  type: "string"
                  description: "Parameter name in caller"
                
                callee_param:
                  type: "string"
                  description: "Expected parameter name in callee"
                
                caller_type:
                  type: "string"
                  description: "Type in caller"
                
                callee_type:
                  type: "string"
                  description: "Expected type in callee"
                
                recommendation:
                  type: "string"
                
                fix_code:
                  type: "string"
                
                auto_mappable:
                  type: "boolean"
                  description: "Can PEVS auto-fix this mapping?"
      
      # AC-PRECHECK-003: Test Fixture Validation
      test_validation:
        type: "object"
        required: true
        properties:
          status:
            type: "enum"
            values: ["PASS", "FAIL", "WARNING", "SKIPPED"]
          
          score:
            type: "integer"
            min: 0
            max: 100
          
          checks_performed:
            type: "array"
            items:
              - "mock_signature_match"
              - "fixture_parameter_match"
              - "test_call_validation"
              - "assertion_compatibility"
          
          test_files_analyzed:
            type: "array"
            items:
              type: "string"
              description: "Test file paths analyzed"
          
          issues:
            type: "array"
            items:
              type: "object"
              properties:
                severity:
                  type: "enum"
                  values: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
                
                type:
                  type: "enum"
                  values:
                    - "extra_parameter"
                    - "missing_parameter"
                    - "mock_signature_mismatch"
                    - "fixture_incompatibility"
                
                test_file:
                  type: "string"
                  description: "Path to test file"
                
                line:
                  type: "integer"
                  description: "Line number in test file"
                
                test_function:
                  type: "string"
                  description: "Test function name"
                
                parameter:
                  type: "string"
                  description: "Parameter causing issue"
                
                recommendation:
                  type: "string"
                
                fix_code:
                  type: "string"
  
  # Overall Assessment
  overall:
    type: "object"
    required: true
    properties:
      status:
        type: "enum"
        values: ["PASS", "FAIL", "WARNING"]
        description: "PASS if all checks PASS/WARNING, FAIL if any FAIL"
      
      score:
        type: "integer"
        min: 0
        max: 100
        description: "Weighted average of all validation scores"
      
      gate_result:
        type: "enum"
        values: ["ALLOWED", "BLOCKED"]
        description: "Execution gate decision"
      
      execution_allowed:
        type: "boolean"
        description: "Can execution proceed?"
      
      critical_issues:
        type: "integer"
        description: "Count of CRITICAL severity issues"
      
      high_issues:
        type: "integer"
        description: "Count of HIGH severity issues"
      
      warnings:
        type: "integer"
        description: "Count of WARNING/MEDIUM/LOW issues"
      
      total_checks:
        type: "integer"
        description: "Total validation checks performed"
      
      passed_checks:
        type: "integer"
        description: "Number of checks that passed"
  
  # Recommendations
  recommendations:
    type: "array"
    items:
      type: "string"
      description: "Actionable recommendations in priority order"
  
  # Auto-Fix Support
  auto_fixes:
    type: "object"
    properties:
      available:
        type: "boolean"
        description: "Are auto-fixes available?"
      
      fixes:
        type: "array"
        items:
          type: "object"
          properties:
            issue_id:
              type: "string"
            
            fix_type:
              type: "enum"
              values: ["parameter_mapping", "type_conversion", "default_injection"]
            
            fix_code:
              type: "string"
              description: "Python code to apply fix"
            
            safe_to_auto_apply:
              type: "boolean"
            
            requires_approval:
              type: "boolean"
  
  # Audit Trail
  audit_trail:
    type: "object"
    required: true
    properties:
      correlation_id:
        type: "string"
        format: "uuid"
      
      logged_to:
        type: "string"
        default: "governance.db"
      
      category:
        type: "enum"
        values: ["VALIDATION"]
      
      level:
        type: "enum"
        values: ["INFO", "WARNING", "ERROR", "CRITICAL"]
      
      manifest_hash:
        type: "string"
        description: "SHA-256 hash of manifest for integrity"

# ==============================================================================
# Validation Rules
# ==============================================================================

validation_rules:
  gate_blocking_conditions:
    - "overall.critical_issues > 0"
    - "signature_validation.status == 'FAIL'"
    - "parameter_compatibility.status == 'FAIL'"
  
  gate_warning_conditions:
    - "test_validation.status == 'WARNING'"
    - "overall.warnings > 5"
    - "overall.score < 85"
  
  auto_fix_allowed_when:
    - "auto_fixes.safe_to_auto_apply == true"
    - "overall.critical_issues == 0"
    - "fix_type in ['parameter_mapping', 'default_injection']"

# ==============================================================================
# Scoring Weights
# ==============================================================================

scoring:
  signature_validation_weight: 0.40  # 40% of overall score
  parameter_compatibility_weight: 0.35  # 35% of overall score
  test_validation_weight: 0.25  # 25% of overall score
  
  severity_deductions:
    CRITICAL: 25  # -25 points per critical issue
    HIGH: 10      # -10 points per high issue
    MEDIUM: 5     # -5 points per medium issue
    LOW: 2        # -2 points per low issue

# ==============================================================================
# Example Manifest
# ==============================================================================

example:
  manifest_id: "precheck-abc123-def456"
  timestamp: "2026-01-11T12:00:00Z"
  schema_version: "1.0"
  
  orchestrator:
    name: "investigation_v2"
    class_path: "src.orchestrators.investigation.investigation_orchestrator"
    registry_id: "investigation_v2"
    version: "2.0.0"
  
  validation_results:
    signature_validation:
      status: "FAIL"
      score: 75
      checks_performed:
        - "init_signature"
        - "execute_signature"
      issues:
        - severity: "CRITICAL"
          type: "missing_parameter"
          parameter: "workspace_root"
          expected: "Path"
          provided: null
          recommendation: "Add workspace_root to init_args"
          fix_code: "init_args['workspace_root'] = workspace_root"
          affected_method: "__init__"
    
    parameter_compatibility:
      status: "FAIL"
      score: 50
      issues:
        - severity: "CRITICAL"
          type: "parameter_mismatch"
          caller_param: "user_request"
          callee_param: "context"
          recommendation: "Map user_request to context"
          fix_code: "params['context'] = params.pop('user_request')"
          auto_mappable: true
    
    test_validation:
      status: "WARNING"
      score: 85
      issues:
        - severity: "WARNING"
          type: "extra_parameter"
          test_file: "tests/sts/test_governance_enforcement.py"
          line: 42
          parameter: "intent"
          recommendation: "Remove 'intent' from metadata"
          fix_code: "metadata = {k: v for k, v in metadata.items() if k != 'intent'}"
  
  overall:
    status: "FAIL"
    score: 70
    gate_result: "BLOCKED"
    execution_allowed: false
    critical_issues: 2
    high_issues: 0
    warnings: 1
    total_checks: 10
    passed_checks: 7
  
  recommendations:
    - "Add workspace_root parameter to investigation_v2 orchestrator init"
    - "Map user_request to context in MasterOrchestrator.execute_orchestrator()"
    - "Filter 'intent' key from metadata in STSLogger.log()"
  
  audit_trail:
    correlation_id: "abc123-def456"
    logged_to: "governance.db"
    category: "VALIDATION"
    level: "WARNING"
    manifest_hash: "sha256:abcdef123456..."
