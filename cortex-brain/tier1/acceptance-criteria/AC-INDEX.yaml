github_copilot_bridge:
  description: 'VSCodeCopilotTodoBridge writes CORTEX TodoManager tasks as TODO comments
    that

    VS Code''s GitHub Copilot automatically detects and displays in the TODO panel.

    This improves execution accuracy by making tasks visible in the developer''s

    workspace and leveraging Copilot''s ability to understand and act on TODOs.


    Key Design Principles:

    - Comment-based: Uses // TODO:, # TODO:, <!-- TODO: --> format (language-specific)

    - Centralized file: .cortex/copilot-todos.md for all CORTEX-generated tasks

    - VS Code integration: Tasks appear in GitHub Copilot''s TODO panel automatically

    - Governance injection: Each TODO comment includes relevant SKULL rules

    - AC-ID traceability: TODO descriptions link back to acceptance criteria


    Integration Point: MasterOrchestrator.execute() writes to .cortex/copilot-todos.md

    '
  copilot_bridge_acs:
  - id: AC-COPILOT-001
    name: VSCodeCopilotTodoBridge Core Component
    description: 'Bridge component that converts TodoManager Task objects to TODO
      comments

      that VS Code''s GitHub Copilot can detect and display in the TODO panel.

      Input: Task[] from TodoManager (AC-TODO-001)

      Output: Markdown file (.cortex/copilot-todos.md) with TODO comments


      Key Methods:

      - write_todos_to_file(tasks: List[Task]) → None

      - _format_as_todo_comment(task) → Markdown TODO comment with metadata

      - _generate_title(task) → Clear, action-oriented title (3-7 words)

      - _generate_description(task) → Context, governance, AC-ID, dependencies

      - _get_status_emoji(task_status) → ⏳ | 🔄 | ✅ | ❌ | 🚫

      '
    status: not_started
    priority: P1-HIGH
    phase: 2
    core_workflow: true
    tests:
    - tests/unit/core/test_vscode_copilot_todo_bridge.py
    - tests/integration/core/test_copilot_todo_file_generation.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-TODO-001
    - AC-ORCH-006
    acceptance_criteria:
    - Creates/updates .cortex/copilot-todos.md with TODO comments
    - 'Each TODO: <!-- TODO: {title} --> format for Markdown files'
    - 'Title generation: concise, action-oriented, <80 chars'
    - 'Description includes: context, governance rules (3-5 max), AC-ID, file paths,
      dependencies'
    - 'Status tracking: ⏳ not-started, 🔄 in-progress, ✅ completed, ❌ failed, 🚫 blocked'
    - Handles empty task list gracefully (creates empty file with header)
    - 'Performance: <10ms for 100 tasks'
    - 'File atomicity: Uses temp file + atomic rename to prevent corruption'
  - id: AC-COPILOT-002
    name: Governance Context Injection
    description: 'Each TODO comment includes relevant SKULL rules in the description.

      Uses GovernanceMerger to extract applicable rules per task.


      Example Output:

      <!-- TODO: Implement user authentication with JWT -->

      **Task:** AC-AUTH-001

      **Description:** Implement user authentication with JWT tokens


      **Governance:**

      - CORE-008: TDD required (write tests first)

      - CORE-001: Incremental execution (<500 lines per commit)

      - CORE-005: Use pathlib.Path for all file operations


      **Files:**

      - src/auth/jwt_handler.py

      - tests/auth/test_jwt_handler.py


      **Status:** ⏳ Not Started

      '
    status: not_started
    priority: P1-HIGH
    phase: 2
    core_workflow: true
    tests:
    - tests/unit/core/test_governance_injection.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    - AC-GOV-005
    acceptance_criteria:
    - Extracts relevant SKULL rules from GovernanceMerger unified set
    - Maximum 3-5 most relevant rules per task (avoid overwhelming)
    - 'Rule formatting: CORE-XXX: Brief description (not full text)'
    - Includes AC-ID with link to acceptance criteria
    - Lists affected file paths for context
    - Markdown formatting compatible with VS Code's Copilot TODO panel
  - id: AC-COPILOT-003
    name: Dependency Graph Serialization
    description: "Serialize task dependencies into TODO comment format that Copilot\
      \ understands.\n\nExample:\n<!-- TODO: Implement API endpoint -->\n**Task:**\
      \ AC-API-003\n**Dependencies:** \n- ✅ AC-API-001 (Database schema) - COMPLETED\n\
      - ✅ AC-API-002 (Auth middleware) - COMPLETED\n- ⏳ AC-AUTH-001 (JWT handler)\
      \ - BLOCKED BY\n\n**Status:** \U0001F6AB Blocked\n"
    status: not_started
    priority: P2-MEDIUM
    phase: 2
    tests:
    - tests/unit/core/test_dependency_serialization.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    - AC-TODO-004
    acceptance_criteria:
    - 'Dependency tracking: blocked_by and depends_on fields'
    - Clear dependency status with emojis (✅ done, ⏳ pending, 🔄 in-progress)
    - 'Task ordering: dependencies listed first in file'
    - Circular dependency detection and warning in TODO comment
    - Clickable AC-ID links (VS Code supports file:// URIs)
  - id: AC-COPILOT-004
    name: MasterOrchestrator Integration
    description: 'MasterOrchestrator instantiates VSCodeCopilotTodoBridge and writes

      tasks to .cortex/copilot-todos.md after execution.


      Integration Points:

      1. MasterOrchestrator.__init__: Instantiate bridge

      2. MasterOrchestrator.execute(): Call bridge.write_todos_to_file(todos)

      3. File location: .cortex/copilot-todos.md (workspace root)

      4. VS Code detection: Automatic (Copilot scans for TODO comments)

      '
    status: not_started
    priority: P1-HIGH
    phase: 2
    core_workflow: true
    tests:
    - tests/integration/orchestrators/test_master_copilot_integration.py
    implementation: src/orchestrators/master_orchestrator.py
    dependencies:
    - AC-COPILOT-001
    - AC-ORCH-006
    acceptance_criteria:
    - Bridge instantiated in MasterOrchestrator.__init__ with GovernanceMerger reference
    - execute() method calls bridge.write_todos_to_file() after todo creation
    - .cortex/copilot-todos.md created in workspace root (pathlib.Path for portability)
    - 'File includes header: # CORTEX TodoManager Tasks (managed by CORTEX, do not
      edit manually)'
    - 'Backwards compatible: works if bridge disabled (no file written)'
    - VS Code Copilot automatically detects and displays TODOs in panel
  - id: AC-COPILOT-005
    name: Response Template Enhancement
    description: 'Extend response templates to notify users about TODO file creation.

      Template informs users where to find TODOs in VS Code.


      Template Sections:

      - Todo count and phase summary

      - File location: .cortex/copilot-todos.md

      - VS Code instruction: "Open GitHub Copilot TODO panel to view tasks"

      - Estimated completion time

      - Governance reminders (CORE-001, CORE-008, etc.)

      '
    status: not_started
    priority: P2-MEDIUM
    phase: 2
    tests:
    - tests/response_templates/test_copilot_todo_template.py
    implementation: cortex-brain/tier2/response-templates/core.yaml
    dependencies:
    - AC-COPILOT-004
    - AC-TEMPLATE-004
    acceptance_criteria:
    - 'New section: copilot_todo_notification in core template'
    - 'Clear instructions: ''TODOs written to .cortex/copilot-todos.md'''
    - 'VS Code guidance: ''View in GitHub Copilot panel (Ctrl/Cmd+Shift+P → GitHub
      Copilot: Show TODO Panel)'''
    - Includes task count and estimated completion time
    - 'Reminder: ''TODOs auto-sync with progress-tracker.json'''
    - Link to documentation on TODO-based workflow
  - id: AC-COPILOT-006
    name: Title Generation Algorithm
    description: 'Generate clear, action-oriented titles for TODO comments.

      VS Code Copilot displays titles prominently in the TODO panel.


      Algorithm:

      1. Extract primary action verb (implement, test, refactor, document)

      2. Extract primary entity (feature, component, function)

      3. Format: "{VERB} {ENTITY}" (e.g., "Implement JWT Handler")

      4. Truncate to 80 chars if needed (Markdown TODO comment limit)

      5. Title case formatting

      '
    status: not_started
    priority: P2-MEDIUM
    phase: 2
    tests:
    - tests/unit/core/test_title_generation.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    acceptance_criteria:
    - 'Action verbs: implement, test, refactor, document, fix, investigate, plan,
      create, update, delete'
    - 'Max length: 80 chars (comfortable reading in VS Code TODO panel)'
    - Title case formatting (Implement JWT Handler, not implement jwt handler)
    - 'Handles edge cases: empty task name, very long names, special characters'
    - 'Sanitizes for Markdown: escapes <, >, &, etc.'
  - id: AC-COPILOT-007
    name: Description Generation with Context
    description: 'Generate comprehensive descriptions with maximum context for TODO
      comments.

      More context = better execution accuracy (90% vs 70%).


      Description Sections (Markdown format):

      1. **Task:** AC-ID

      2. **Description:** Task objective (1-2 sentences)

      3. **Governance:** 3-5 SKULL rules

      4. **Files:** Affected file paths (absolute paths)

      5. **Dependencies:** Task IDs and status

      6. **Acceptance Criteria:** Summary of AC

      7. **Tests Required:** Test types (unit, integration, security)

      8. **Status:** Emoji + text (⏳ Not Started, 🔄 In Progress, ✅ Completed)

      '
    status: not_started
    priority: P1-HIGH
    phase: 2
    tests:
    - tests/unit/core/test_description_generation.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    - AC-COPILOT-002
    acceptance_criteria:
    - 'Objective: Clear, 1-2 sentence task summary'
    - 'Governance: Top 3-5 relevant SKULL rules with brief explanation'
    - 'AC-ID: Formatted as **Task:** AC-XXX-001 for easy scanning'
    - 'Files: Relative paths from workspace root'
    - 'Dependencies: Task IDs with status emojis'
    - 'Testing: Required test types (unit, integration, security)'
    - 'Markdown formatting: Bold headers, bullet lists, code formatting'
    - 'Max length: No limit (Markdown file can be long)'
  - id: AC-COPILOT-008
    name: Status Mapping with Emojis
    description: 'Map TodoManager task statuses to emoji + text format for visual
      clarity.

      VS Code''s TODO panel displays emojis prominently.


      Mapping:

      - PENDING → ⏳ Not Started

      - IN_PROGRESS → 🔄 In Progress

      - COMPLETE → ✅ Completed

      - FAILED → ❌ Failed (with failure reason)

      - BLOCKED → 🚫 Blocked (with blocker info)

      - CANCELLED → (excluded from file)

      '
    status: not_started
    priority: P2-MEDIUM
    phase: 2
    tests:
    - tests/unit/core/test_status_mapping.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    acceptance_criteria:
    - 'Simple states: PENDING/IN_PROGRESS/COMPLETE map to emojis + text'
    - 'FAILED: ❌ Failed + append failure reason to description'
    - 'BLOCKED: 🚫 Blocked + prepend blocker info to description'
    - 'CANCELLED: Exclude from TODO file completely'
    - 'Unknown states: Log warning, default to ⏳ Not Started'
    - 'Emoji + text format: ''**Status:** ⏳ Not Started'''
  - id: AC-COPILOT-009
    name: Task Breakdown for Large Implementations
    description: 'Automatically break down large tasks (>500 LOC estimate) into subtasks.

      Aligns with CORE-001 (incremental execution) and improves visibility.


      Breakdown Strategy:

      - Estimate LOC from task complexity

      - If >500 LOC: Create subtasks (design, implement core, tests, refactor, docs)

      - Each subtask <500 LOC

      - Subtasks have dependencies: design → implement → tests → refactor

      - Each subtask becomes separate TODO comment in file

      '
    status: not_started
    priority: P2-MEDIUM
    phase: 2
    tests:
    - tests/unit/core/test_task_breakdown.py
    implementation: src/orchestrators/core/vscode_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    - AC-COPILOT-003
    acceptance_criteria:
    - 'LOC estimation: heuristic based on task type and complexity'
    - 'Breakdown threshold: >500 LOC triggers subtask creation'
    - 'Subtask types: design, implement_core, tests, refactor, documentation'
    - 'Subtask ordering: enforces TDD flow (tests before refactor)'
    - 'Governance preserved: Each subtask includes relevant SKULL rules'
    - 'Parent-child relationship: Subtasks reference parent AC-ID'
  - id: AC-COPILOT-010
    name: Time Estimation for Tasks
    description: 'Estimate completion time per task and total phase time.

      Helps users understand scope and plan work sessions.


      Estimation Factors:

      - Task complexity (simple/medium/complex)

      - LOC estimate

      - Test coverage requirements

      - Dependencies (parallel vs sequential)

      - Historical completion times (learning)

      '
    status: not_started
    priority: P3-LOW
    phase: 3
    tests:
    - tests/unit/core/test_time_estimation.py
    implementation: src/orchestrators/core/github_copilot_todo_bridge.py
    dependencies:
    - AC-COPILOT-001
    acceptance_criteria:
    - 'Complexity classification: simple (<100 LOC), medium (100-500), complex (>500)'
    - 'Time estimates: simple=30min, medium=2hr, complex=4hr (baseline)'
    - 'Adjustments: +50% for high test coverage, +25% for security tests'
