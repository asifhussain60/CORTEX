  # and store knowledge graphs in the company tier (tier1)
  # ============================================================================
  onboarding:
    - id: "AC-ONBOARD-001"
      name: "Onboarding Orchestrator Core"
      description: |
        Central orchestrator for project/user/team onboarding.
        Coordinates AST crawlers, git history analysis, and knowledge graph building.
        Stores all discovered context in cortex-brain/tier1/ (company tier).
      status: "not_started"
      tests: ["tests/orchestrators/test_onboarding_orchestrator.py"]
      implementation: "src/orchestrators/onboarding/onboarding_orchestrator.py"
      priority: "HIGH"
      core_workflow: true
      source_references:
        - "commit:4686dc7a8 - OnboardingOrchestrator (560 LOC)"
        - "commit:c84bf6b3a - Interactive onboarding with 6-phase guide"
      dependencies: ["AC-CRAWLER-001", "AC-GRAPH-004", "AC-STATE-001"]
      
    - id: "AC-ONBOARD-002"
      name: "AST Codebase Analysis"
      description: |
        Run comprehensive AST crawlers on target codebase:
        - Python analyzer (ast module)
        - JavaScript/TypeScript analyzer
        - C# analyzer
        - SQL analyzer
        - Generic fallback analyzer
        Extract: classes, functions, imports, dependencies, complexity metrics.
      status: "not_started"
      tests: ["tests/onboarding/test_ast_analysis.py"]
      implementation: "src/orchestrators/onboarding/ast_analyzer.py"
      dependencies: ["AC-CRAWLER-002", "AC-CRAWLER-003"]
      source_references:
        - "CORTEX-4.0:src/cortex_lens/analyzers/python_analyzer.py"
        - "CORTEX-4.0:src/cortex_lens/analyzers/javascript_analyzer.py"
