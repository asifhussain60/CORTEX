- id: AC-SEC-003
  title: Orchestrator Registration Validation & Decorator Enforcement
  description: 'Validate orchestrator class signatures and enforce CORE-024 @mcp_tool
    decorator on registration.


    Problem: CORE-024 enforces @mcp_tool decorator, but registration not validated.
