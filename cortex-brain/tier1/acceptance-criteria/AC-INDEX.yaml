- id: AC-RISK-012
  title: Harden SQLite Concurrency (WAL + Advisory Locks)
  description: 'Problem: planning.db uses WAL mode but allows multiple simultaneous
    writers.

    Corruption risk: power loss during write, truncated WAL file, race conditions.


    Solution:

    1. Implement advisory locks (SQLite `BEGIN EXCLUSIVE` before writes)

    2. Backup DB before every write operation (copy to .backup file)

    3. Verify WAL integrity on startup (check WAL header + CRC)

    4. Implement write timeout + retry (exponential backoff)


    Acceptance Criteria:

    - Advisory locks prevent concurrent writes

    - DB backups created before writes

    - WAL integrity validated on startup

    - Tests: simulate concurrent writes, verify no corruption

    '
