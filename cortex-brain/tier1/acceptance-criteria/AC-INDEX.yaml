  - src/orchestrators/master/master_orchestrator.py
  - cortex-brain/tier1/tracking/progress-tracker.json
  riskIfUnfixed: high
  estimatedEffort: 3
  owner: Orchestration
- id: AC-RISK-004
  title: Database Backup & WAL Mode for Crash Safety
  description: 'Enable SQLite WAL (Write-Ahead Logging) mode and implement pre-write
    backups to prevent corruption on crash.


    Problem: StateManager writes to planning.db without WAL mode. Crash during write
    → Corrupted database, unrecoverable state.


    Solution:

    1. Enable WAL mode on all database opens (PRAGMA journal_mode=WAL)

    2. Pre-write backup (copy DB to .backup before transaction)

    3. Integrity check on database open (PRAGMA integrity_check)

    4. Database recovery tool (restore from last good backup on startup)

    5. Log backup operations to audit trail (AuditCategory.INFRASTRUCTURE)


    Acceptance Criteria:

    - WAL mode enabled, write performance verified (no regression)

    - Pre-write backup created, verified on recovery

    - Startup detects corrupted database, restores from backup

    - No data loss after crash recovery

    - Tests: corrupt DB file, verify recovery on next startup

    '
  status: planned
  priority: high
  phase: 1
  category: reliability
  tests:
  - tests/infrastructure/test_database_wal_mode.py
  - tests/infrastructure/test_database_recovery.py
  dependencies: []
  evidencePaths:
  - src/orchestrators/state_manager.py
  - cortex-brain/state/planning.db
  - src/infrastructure/enhanced_audit_logger.py
  riskIfUnfixed: high
  estimatedEffort: 3
  owner: Infrastructure
- id: AC-RISK-005
  title: Governance Rule Violation Severity Levels
  description: 'Add severity levels (BLOCKED vs WARNING) to governance rules to allow
    partial work on non-critical violations.


    Problem: Single CORE rule violation (e.g., CORE-019 TDD missing) blocks entire
    phase. No partial work, no warning option.


    Solution:

    1. Add severity field to GovernanceRule (BLOCKED vs WARNING)

    2. MasterOrchestrator continues on WARNING, logs to audit

    3. BLOCKED rules still stop execution

    4. Track rule violations in progress-tracker.json

    5. Audit trail shows which rules triggered stop vs warning


    Acceptance Criteria:

    - CORE rules categorized (some BLOCKED, some WARNING)

    - Phase continues on WARNING violations with audit log

    - BLOCKED violations still stop execution immediately

    - Violations tracked in progress-tracker.json

    - Tests: trigger non-critical rule violation, verify warning logged and execution
    continues

    '
  status: planned
  priority: high
  phase: 2
  category: reliability
  tests:
  - tests/governance/test_rule_severity_levels.py
  dependencies:
