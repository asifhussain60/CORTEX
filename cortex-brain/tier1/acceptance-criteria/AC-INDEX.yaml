# ==============================================================================
# Phase 2: Orchestration Core ACs
# ==============================================================================
orchestration_core:
  master:
    - id: "AC-ORCH-001"
      name: "Pattern-Based Routing"
      description: "Route requests by regex patterns"
      status: "implemented"
      tests: ["tests/orchestrators/test_pattern_router.py"]
      implementation: "src/orchestrators/pattern_router.py"
      
    - id: "AC-ORCH-002"
      name: "LLM Fallback Routing"
      description: "Use LLM for fuzzy pattern matching"
      status: "implemented"
      tests: ["tests/cortex_agents/test_llm_intent.py"]
      implementation: "src/cortex_agents/llm_intent_classifier.py"
      
    - id: "AC-ORCH-003"
      name: "Request Transformation"
      description: "Enrich requests with domain context"
      status: "partial"
      tests: []
      implementation: "src/orchestrators/master_orchestrator.py"
      
    - id: "AC-ORCH-004"
      name: "Correlation ID Propagation"
      description: "Track requests through audit trail"
      status: "partial"
      tests: []
      implementation: "src/orchestrators/master_orchestrator.py"
      
    - id: "AC-ORCH-005"
      name: "Middleware Pipeline"
      description: "Pre/post execution hooks"
      status: "implemented"
      tests: ["tests/orchestrators/test_middleware.py"]
      implementation: "src/orchestrators/middleware/"

  # ============================================================================
  # MASTER ORCHESTRATOR - Central Control (CRITICAL for CORTEX Core Workflow)
  # ============================================================================
  master_control:
    - id: "AC-ORCH-006"
      name: "MasterOrchestrator as Central Controller"
      description: |
        MasterOrchestrator is IN CHARGE of all CORTEX operations. ALL requests 
        route through MasterOrchestrator which: (1) loads governance rules, 
        (2) evaluates against merged best practices, (3) creates todos via TodoManager.
        This is THE DEFAULT WORKING MECHANISM at the core of CORTEX.
      status: "partial"
      tests: ["tests/unit/test_master_orchestrator_governance.py"]
      implementation: "src/orchestrators/master_orchestrator.py"
      priority: "CRITICAL"
      core_workflow: true
      
    - id: "AC-ORCH-007"
      name: "Governance-to-Todo Pipeline"
      description: |
        When request arrives: (1) GovernanceMerger merges CORTEX best practices (tier0/tier2) 
        with company best practices (tier1/tier3), (2) MasterOrchestrator evaluates request 
        against merged ruleset, (3) TodoManager creates actionable tasks based on evaluation.
        This pipeline is the CORE of CORTEX operation.
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-ORCH-006", "AC-GOV-005", "AC-TODO-001"]
      priority: "CRITICAL"
      core_workflow: true
      workflow_steps:
        - step: 1
          action: "GovernanceMerger.merge_all_tiers()"
          output: "unified_instruction_set"
        - step: 2
          action: "MasterOrchestrator.evaluate(request, unified_instruction_set)"
          output: "required_actions[]"
        - step: 3
          action: "TodoManager.create_tasks(required_actions)"
          output: "task_ids[]"
        - step: 4
          action: "MasterOrchestrator.execute(task_ids)"
          output: "results"

    - id: "AC-ORCH-008"
      name: "Best Practices Merge Strategy"
      description: |
        Merge CORTEX best practices (Tier 0 SKULL + Tier 2 engineering standards) 
        with company/project practices (Tier 1 business + Tier 3 learned patterns).
        Tier 0 always wins conflicts. Result is unified instruction set for execution.
      status: "partial"
      tests: ["tests/governance/test_governance_merger.py"]
      implementation: "src/orchestrators/core/governance_merger.py"
      dependencies: ["AC-GOV-001", "AC-GOV-003", "AC-GOV-005"]
      merge_sources:
        cortex_practices:
          - tier: 0
            source: "cortex-brain/tier0/governance/core-rules.yaml"
            type: "SKULL rules (immutable)"
          - tier: 2
            source: "cortex-brain/tier2/engineering-standards.yaml"
            type: "Engineering standards"
        company_practices:
          - tier: 1
            source: "cortex-brain/tier1/"
            type: "Business requirements, compliance"
          - tier: 3
            source: "cortex-brain/tier3/"
            type: "Learned patterns, project-specific"

  # ============================================================================
  # TODO MANAGER - Real-time Task Tracking
  # ============================================================================
  todo_manager:
    - id: "AC-TODO-001"
      name: "TodoManager Core"
      description: "Real-time task tracking with status lifecycle: PENDING → IN_PROGRESS → COMPLETE/FAILED/BLOCKED"
      status: "partial"
      tests: ["tests/integration/test_cortex_self_management.py"]
      implementation: "src/orchestrators/master/todo_manager.py"
      note: "Stub exists, needs full implementation"
      
    - id: "AC-TODO-002"
      name: "Task Creation from Governance Evaluation"
      description: "TodoManager receives required_actions from MasterOrchestrator governance evaluation and creates tracked tasks"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-TODO-001", "AC-ORCH-007"]
      
    - id: "AC-TODO-003"
      name: "Task Progress Persistence"
      description: "Tasks persist to progress-tracker.json for session continuation"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-TODO-001", "AC-STATE-001"]
      
    - id: "AC-TODO-004"
      name: "Task Dependency Resolution"
      description: "Tasks respect dependency order - blocked tasks wait for dependencies"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-TODO-001"]

  # ============================================================================
  # TDD ORCHESTRATOR - Test-Driven Development Workflow
  # ============================================================================
  tdd_orchestrator:
    - id: "AC-TDD-001"
      name: "TDD Orchestrator Core"
      description: |
        TDD Orchestrator executes RED→GREEN→REFACTOR cycle.
        Receives final instruction (F) from MasterOrchestrator after governance merge.
        Phases: DISCOVERY → RED → GREEN → REFACTOR → VALIDATION
      status: "partial"
      tests: ["tests/unit/orchestrators/test_tdd_orchestrator.py"]
      implementation: "src/orchestrators/tdd/tdd_orchestrator.py"
      source_reference: "CORTEX6:src/orchestrators/tdd/tdd_orchestrator.py"
      priority: "CRITICAL"
      core_workflow: true
      
    - id: "AC-TDD-002"
      name: "Final Instruction Generation (F)"
      description: |
        TDD Orchestrator generates Final Instruction (F) by combining:
        1. CORTEX governance rules (tier0 SKULL)
        2. Best practices (tier2 engineering-standards.yaml)
        3. Company best practices (tier1 business rules)
        4. Domain knowledge & constraints (tier3 learned patterns)
        F = SKULL + BestPractices + CompanyRules + DomainKnowledge
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-GOV-005", "AC-ORCH-008", "AC-KNOW-001"]
      formula: |
        F = merge(
          tier0.governance.core_rules,      # SKULL - immutable
          tier2.engineering_standards,       # Best practices
          tier1.company_practices,           # Company rules
          tier3.domain_knowledge             # Learned patterns
        )
      
    - id: "AC-TDD-003"
      name: "RED Phase - Failing Test Generation"
      description: |
        Generate comprehensive failing tests BEFORE implementation:
        - Functional tests (happy path)
        - Edge case tests (empty, invalid, boundary)
        - Security tests (injection, auth, XSS)
        Tests MUST fail initially (validates test correctness)
      status: "partial"
      tests: ["tests/unit/orchestrators/test_tdd_orchestrator.py"]
      implementation: "src/orchestrators/tdd/tdd_orchestrator.py"
      source_reference: "CORTEX6:src/orchestrators/tdd/tdd_orchestrator.py"
      
    - id: "AC-TDD-004"
      name: "GREEN Phase - Minimal Implementation"
      description: |
        Write MINIMAL code to make all tests pass.
        No over-engineering. No premature optimization.
        Iterate until all tests from RED phase pass.
      status: "partial"
      tests: []
      implementation: "src/orchestrators/tdd/tdd_orchestrator.py"
      
    - id: "AC-TDD-005"
      name: "REFACTOR Phase - Clean Code Enforcement"
      description: |
        Apply clean code principles after GREEN:
        - SOLID principles (SRP, OCP, LSP, ISP, DIP)
        - DRY (Don't Repeat Yourself)
        - KISS (Keep It Simple, Stupid)
        - YAGNI (You Ain't Gonna Need It)
        Code metrics: max_function_length=50, max_complexity=10, min_score=80
      status: "partial"
      tests: []
      implementation: "src/orchestrators/tdd/tdd_orchestrator.py"
      clean_code_rules:
        max_function_length: 50
        max_cyclomatic_complexity: 10
        min_clean_code_score: 80
        principles: ["SOLID", "DRY", "KISS", "YAGNI"]
      
    - id: "AC-TDD-006"
      name: "Technology Discovery"
      description: |
        Auto-detect project technology stack:
        - Primary language (Python, JavaScript, C#, etc.)
        - Test framework (pytest, unittest, jest, etc.)
        - Framework version for compatibility
      status: "partial"
      tests: []
      implementation: "src/orchestrators/tdd/tdd_orchestrator.py"
      
    - id: "AC-TDD-007"
      name: "Domain Knowledge Integration"
      description: |
        TDD queries tier2/tier3 brain for domain-specific knowledge:
        - Authentication patterns → JWT, OAuth best practices
        - Database patterns → Transaction handling, connection pooling
        - API patterns → REST conventions, error handling
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-KNOW-001", "AC-KNOW-002"]
      
    - id: "AC-TDD-008"
      name: "Handoff to Implementation Orchestrators"
      description: |
        After generating Final Instruction (F), TDD hands off to specialized
        implementation orchestrators as needed:
        - FileCreator for new files
        - CodeModifier for existing files  
        - TestRunner for validation
        - DocumentationGenerator for docs
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-TDD-002"]

  # ============================================================================
  # KNOWLEDGE PRACTICES - Domain Knowledge & Best Practices
  # ============================================================================
  knowledge:
    - id: "AC-KNOW-001"
      name: "Engineering Best Practices Repository"
      description: |
        tier2/engineering-standards.yaml contains CORTEX engineering best practices:
        - Code style guidelines
        - Testing standards
        - Documentation requirements
        - Security checklist
        Must exist and be loadable by GovernanceMerger.
      status: "not_started"
      tests: []
      implementation: ""
      file_location: "cortex-brain/tier2/engineering-standards.yaml"
      
    - id: "AC-KNOW-002"
      name: "Domain Knowledge Patterns"
      description: |
        tier3/domain-patterns.yaml contains learned patterns:
        - Authentication patterns (JWT, OAuth, sessions)
        - Database patterns (pooling, transactions, migrations)
        - API patterns (REST, GraphQL, error handling)
        - Security patterns (input validation, CSRF, XSS prevention)
      status: "not_started"
      tests: []
      implementation: ""
      file_location: "cortex-brain/tier3/domain-patterns.yaml"
      
    - id: "AC-KNOW-003"
      name: "Company Best Practices"
      description: |
        tier1/company-practices.yaml contains organization-specific rules:
        - Code review requirements
        - Deployment procedures
        - Compliance requirements (GDPR, SOC2, etc.)
      status: "not_started"
      tests: []
      implementation: ""
      file_location: "cortex-brain/tier1/company-practices.yaml"

  # ============================================================================
  # INTERACTIVE CAPABILITIES - Enhanced Interaction Within CORE-001 Compliance
  # ============================================================================
  interactive:
    - id: "AC-INTERACT-001"
      name: "Configuration-Driven Interaction Management"
      description: |
        Enhanced clarification-rules.yaml supporting broader interaction patterns:
        - Ambiguity detection (vague language, missing fields, security concerns)
        - Multi-round clarification with max_rounds and auto_trigger_threshold
        - High-risk operation confirmation (vacuum, sanitize, cleanup)
        - Progress reporting configuration (checkpoint frequency, notifications)
        - Interactive mode selection (autonomous, supervised, human-in-loop)
        System appears centralized to users while maintaining distributed architecture.
      status: "not_started"
      tests: ["tests/config/test_interaction_config.py"]
      implementation: "cortex-brain/config/interaction-config.yaml"
      related_governance: ["CORE-001", "CORE-017"]
      config_sections:
        clarification: "max_rounds, auto_trigger_threshold, ambiguity_detection"
        confirmation: "high_risk_operations, confirmation_patterns"
        progress_reporting: "checkpoint_frequency, notification_levels"
        mode_selection: "autonomous_threshold, escalation_triggers"
      
    - id: "AC-INTERACT-002" 
      name: "InteractionGuard Middleware Integration"
      description: |
        InteractionGuard middleware at priority 7 (before IncrementalExecutor at priority 8):
        - Pre-execution: Check if operation requires confirmation/clarification
        - High-risk operation detection (patterns: vacuum, sanitize, cleanup, migration)
        - Collect confirmations ONCE upfront before autonomous execution begins
        - Integrate with existing middleware pipeline (AC-ORCH-005)
        - Maintain CORE-001 autonomous execution during implementation phases
      status: "not_started"
      tests: ["tests/orchestrators/middleware/test_interaction_guard.py"]
      implementation: "src/orchestrators/middleware/interaction_guard.py"
      middleware_priority: 7
      dependencies: ["AC-ORCH-005", "AC-INTERACT-001"]
      integration_points:
        - "Existing middleware pipeline"
        - "clarification-rules.yaml configuration"
        - "High-risk operation patterns"
      
    - id: "AC-INTERACT-003"
      name: "Front-Loaded Clarification System"
      description: |
        Extend Planning v5 (AC-PLAN-001 to AC-PLAN-008) with upfront clarification:
        - Generate initial plan with ambiguity detection
        - Collect ALL clarifications during planning phase (before execution)
        - Build comprehensive Final Instruction (F) incorporating clarifications
        - Hand off complete plan to autonomous execution (maintains CORE-001)
        - No mid-execution interruptions - all interaction front-loaded
      status: "not_started"
      tests: ["tests/orchestrators/planning/test_interactive_planning.py"]
      implementation: "src/orchestrators/planning/interactive_planning_phase.py"
      dependencies: ["AC-PLAN-001", "AC-PLAN-002", "AC-INTERACT-001"]
      phases:
        detect_ambiguities: "Scan request for vague patterns, missing requirements"
        collect_clarifications: "Multi-round Q&A using clarification-rules.yaml"
        build_final_instruction: "Complete F with all clarifications resolved"
        handoff_autonomous: "Pass to MasterOrchestrator for autonomous execution"

# ==============================================================================
# Phase 3: Feature Orchestrators ACs
# ==============================================================================
features:
  crawlers:
    - id: "AC-CRAWLER-001"
      name: "Multi-Threaded Parallel Processing"
      description: "ThreadPoolExecutor with auto CPU detection (min(100, cpu_count * 4)), progress callbacks, error aggregation"
      status: "not_started"
      tests: []
      implementation: ""
      source_reference: "CORTEX-4.0:src/crawlers/parallel_processor.py"
      recovery_notes: |
        CORTEX-4.0 has ParallelProcessor class with:
        - ThreadPoolExecutor for concurrent file processing
        - Auto worker count: min(100, cpu_count * 4)
        - Progress callback support
        - Error aggregation without stopping
        - Batch processing with configurable batch size
      
    - id: "AC-CRAWLER-002"
      name: "Language-Specific AST Analyzers"
      description: "AST-based code analysis for Python, JavaScript, C#, ColdFusion, Generic fallback"
      status: "not_started"
      tests: []
      implementation: ""
      source_reference: "CORTEX-4.0:src/crawlers/analyzers/"
      recovery_notes: |
        CORTEX-4.0 analyzers directory contains:
        - python_analyzer.py: AST-based Python analysis
        - javascript_analyzer.py: JavaScript/TypeScript analysis
        - csharp_analyzer.py: C# analysis
        - coldfusion_analyzer.py: ColdFusion/CFML analysis
        - generic_analyzer.py: Fallback for unknown languages
        Each analyzer extracts: classes, functions, imports, dependencies, complexity metrics
      
    - id: "AC-CRAWLER-003"
      name: "Progressive Scan Levels"
      description: "3-level scanning: overview (structure only), standard (with analysis), deep (full AST)"
      status: "not_started"
      tests: []
      implementation: ""
      source_reference: "CORTEX-4.0:src/crawlers/crawler_orchestrator.py"
      recovery_notes: |
        CORTEX-4.0 CrawlerOrchestrator has:
        - LEVEL_OVERVIEW: Quick directory structure scan
        - LEVEL_STANDARD: Basic file analysis (imports, exports)
        - LEVEL_DEEP: Full AST parsing with symbol extraction
        Progressive scanning allows early termination when context is sufficient
      
    - id: "AC-CRAWLER-004"
      name: "Crawler Orchestration"
      description: "Coordinate crawlers with ignore patterns, file type detection, and result aggregation"
      status: "not_started"
      tests: []
      implementation: ""
      source_reference: "CORTEX-4.0:src/crawlers/crawler_orchestrator.py"
      recovery_notes: |
        CORTEX-4.0 CrawlerOrchestrator features:
        - Gitignore pattern support
        - Language detection by extension
        - Result merging from multiple analyzers
        - Caching of analysis results
        - Export to JSON/YAML formats
      
    - id: "AC-CRAWLER-005"
      name: "File Discovery and Filtering"
      description: "Discover files with include/exclude patterns, respect .gitignore, size limits"
      status: "not_started"
      tests: []
      implementation: ""
      source_reference: "CORTEX-4.0:src/crawlers/file_discovery.py"
      recovery_notes: |
        Features needed:
        - Glob pattern support for includes/excludes
        - .gitignore parsing and respect
        - File size limits to skip large binaries
        - Symlink handling (follow or skip)
        - Hidden file handling

  knowledge_graph:
    - id: "AC-GRAPH-001"
      name: "Symbol Extraction"
      description: "Extract classes, functions, variables, imports from AST crawl results"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-CRAWLER-002"]
      recovery_notes: |
        Build symbol registry from crawler output:
        - Class definitions with methods and attributes
        - Function signatures with parameters and return types
        - Variable declarations with inferred types
        - Import statements with resolved paths
      
    - id: "AC-GRAPH-002"
      name: "Dependency Graph Building"
      description: "Build import/export dependency graph for cross-file navigation"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-GRAPH-001"]
      recovery_notes: |
        Dependency tracking:
        - Who imports what from where
        - Circular dependency detection
        - Orphan module detection
        - External vs internal dependency classification
      
    - id: "AC-GRAPH-003"
      name: "Call Graph Analysis"
      description: "Track function calls across modules for impact analysis"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-GRAPH-001"]
      recovery_notes: |
        Call tracking enables:
        - "Who calls this function" queries
        - Impact analysis for changes
        - Dead code detection
        - Hotspot identification
      
    - id: "AC-GRAPH-004"
      name: "Knowledge Graph Persistence"
      description: "SQLite-backed graph storage with incremental updates"
      status: "not_started"
      tests: []
      implementation: ""
      dependencies: ["AC-GRAPH-002", "AC-GRAPH-003"]
      recovery_notes: |
        Storage requirements:
        - Efficient graph queries (adjacency lists)
        - Incremental update on file change
        - Version tracking for cache invalidation
        - Export to visualization formats

  # ============================================================================
  # ONBOARDING ORCHESTRATOR - Comprehensive Repo/Project Context Building
  # ============================================================================
