# ==============================================================================
# DEFINITION OF READY (DoR) - RESOLVED SPECIFICATIONS
# ==============================================================================
# STATUS: ✅ ALL AMBIGUITIES RESOLVED (2026-01-10)
# Round 1: 10 specifications (SPEC-001 to SPEC-010)
# Round 2: 8 specifications (SPEC-011 to SPEC-018)
# Total: 18 resolved specifications
# ==============================================================================
definition_of_ready:
  status: "RESOLVED"
  last_review: "2026-01-10"
  resolved_date: "2026-01-10T14:00:00Z"
  reviewer: "Asif Hussain"
  
  # ============================================================================
  # RESOLVED SPECIFICATIONS
  # ============================================================================
  resolved_specifications:
  
    # -------------------------------------------------------------------------
    # SPEC-001: Knowledge File Schemas (was DOR-AMB-001)
    # -------------------------------------------------------------------------
    knowledge_file_schemas:
      id: "SPEC-001"
      status: "RESOLVED"
      affected_acs: ["AC-KNOW-001", "AC-KNOW-002", "AC-KNOW-003"]
      
      schema_structure: "Category-based YAML with nested rules (consistent with core-rules.yaml)"
      recovery_from_git: true
      
      engineering_standards_schema:
        file: "cortex-brain/tier2/engineering-standards.yaml"
        required_sections:
          - code_style
          - testing_requirements
          - documentation_standards
          - security_checklist
          
      domain_patterns_schema:
        file: "cortex-brain/tier3/domain-patterns.yaml"
        required_sections:
          - auth_patterns
          - database_patterns
          - api_patterns
          - security_patterns
          
      company_practices_schema:
        file: "cortex-brain/tier1/company-practices.yaml"
        required_sections:
          - review_requirements
          - deployment_procedures
          - compliance_rules

    # -------------------------------------------------------------------------
    # SPEC-002: BaseOrchestratorV4 Phase Lifecycle (was DOR-AMB-002)
    # -------------------------------------------------------------------------
    phase_lifecycle:
      id: "SPEC-002"
      status: "RESOLVED"
      affected_acs: ["AC-ORCH-003", "AC-MIGRATE-002"]
      
      states:
        - PENDING
        - IN_PROGRESS
        - COMPLETE
        - FAILED
        - BLOCKED
        - SKIPPED
        
      transition_triggers: "Explicit method calls (start_phase, complete_phase, fail_phase, block_phase)"
      hooks: ["pre_phase", "post_phase"]
      persistence: "SQLite via StateManager (not JSON files)"

    # -------------------------------------------------------------------------
    # SPEC-003: TodoManager Task Schema (was DOR-AMB-003)
    # -------------------------------------------------------------------------
    task_schema:
      id: "SPEC-003"
      status: "RESOLVED"
      affected_acs: ["AC-TODO-001", "AC-TODO-002", "AC-TODO-003"]
      
      fields:
        - name: "id"
          type: "string (UUID)"
          required: true
        - name: "name"
          type: "string"
          required: true
        - name: "description"
          type: "string"
          required: false
        - name: "status"
          type: "enum"
          values: ["PENDING", "IN_PROGRESS", "COMPLETE", "FAILED", "BLOCKED"]
          required: true
        - name: "priority"
          type: "int (1-5)"
          required: true
        - name: "dependencies"
          type: "list of task_ids"
          required: false
        - name: "ac_id"
          type: "string"
          required: false
        - name: "created_at"
          type: "timestamp"
          required: true
        - name: "updated_at"
          type: "timestamp"
          required: true
        - name: "metadata"
          type: "dict"
          required: false
          
      dependency_resolution: "Topological sort, circular dependency = validation error"
      persistence: "SQLite primary, JSON export for progress-tracker.json snapshots"
      blocking_mechanism: "Polling with exponential backoff (100ms initial, 1s max)"

    # -------------------------------------------------------------------------
    # SPEC-004: File Locking Strategy (was DOR-AMB-004)
    # -------------------------------------------------------------------------
    file_locking:
      id: "SPEC-004"
      status: "RESOLVED"
      affected_acs: ["AC-STATE-002"]
      
      primary_strategy: "Migrate all state to SQLite, eliminate JSON file locking"
      json_files_become: "Read-only human-readable snapshots"
      fallback_if_json_needed: "filelock library (cross-platform), file-level, 5s timeout"

    # -------------------------------------------------------------------------
    # SPEC-005: MasterOrchestrator Evaluation Output (was DOR-AMB-005)
    # -------------------------------------------------------------------------
    required_action_schema:
      id: "SPEC-005"
      status: "RESOLVED"
      affected_acs: ["AC-ORCH-006", "AC-ORCH-007"]
      
      fields:
        - name: "action_id"
          type: "string (UUID)"
        - name: "action_type"
          type: "enum"
          values: ["CREATE_FILE", "MODIFY_FILE", "RUN_TEST", "GENERATE_DOC", "EXECUTE_COMMAND"]
        - name: "target"
          type: "string (file path or command)"
        - name: "parameters"
          type: "dict"
        - name: "priority"
          type: "int"
        - name: "governance_rules_applied"
          type: "list of rule_ids"
          
      prioritization: "Priority integer + dependency order (lower = higher priority)"
      action_dependencies: true
      action_to_task_mapping: "1:1 (each required_action becomes one Task)"

    # -------------------------------------------------------------------------
    # SPEC-006: Registration Decorator (was DOR-AMB-006)
    # -------------------------------------------------------------------------
    registration_mechanism:
      id: "SPEC-006"
      status: "RESOLVED"
      affected_acs: ["AC-SCAFFOLD-003", "AC-MIGRATE-001"]
      
      timing: "Import time via class decorator"
      discovery: "OrchestratorRegistry singleton with pattern → class mapping"
      duplicate_pattern_handling: "Last registration wins with WARNING log"
      failure_handling: "Log ERROR, mark orchestrator as unavailable, don't crash"

    # -------------------------------------------------------------------------
    # SPEC-007: TDD Security Tests (was DOR-AMB-007)
    # -------------------------------------------------------------------------
    security_test_scope:
      id: "SPEC-007"
      status: "RESOLVED"
      affected_acs: ["AC-TDD-003"]
      
      test_types:
        - input_validation
        - sql_injection
        - xss
        - authentication_bypass
        
      mandatory_when: "Code handles user input (detected via AST)"
      framework: "pytest with pytest-security plugin where available"
      applicability_detection: "AST heuristics on parameters (user_input, request, query, data)"

    # -------------------------------------------------------------------------
    # SPEC-008: Clean Code Score (was DOR-AMB-008)
    # -------------------------------------------------------------------------
    clean_code_calculation:
      id: "SPEC-008"
      status: "RESOLVED"
      affected_acs: ["AC-TDD-005"]
      
      metrics:
        - name: "cyclomatic_complexity"
          weight: 30
          tool: "radon"
        - name: "function_length"
          weight: 25
          tool: "pylint"
        - name: "documentation_coverage"
          weight: 25
          tool: "pydocstyle"
        - name: "type_hint_coverage"
          weight: 20
          tool: "mypy"
          
      default_threshold: 80
      configurable: true
      config_file: "cortex-brain/config/quality-gates.yaml"

    # -------------------------------------------------------------------------
    # SPEC-009: Crawler Recovery Strategy (was DOR-AMB-009)
    # -------------------------------------------------------------------------
    crawler_recovery:
      id: "SPEC-009"
      status: "RESOLVED"
      affected_acs: ["AC-CRAWLER-001", "AC-CRAWLER-002", "AC-CRAWLER-003", "AC-CRAWLER-004", "AC-CRAWLER-005"]
      
      strategy: "Extract from CORTEX-4.0, refactor to current standards"
      source_branch: "CORTEX-4.0"
      source_path: "src/crawlers/"
      compatibility_approach: "Run against Python 3.11, fix issues as encountered"

    # -------------------------------------------------------------------------
    # SPEC-010: Audit Retention (was DOR-AMB-010)
    # -------------------------------------------------------------------------
    audit_retention:
      id: "SPEC-010"
      status: "RESOLVED"
      affected_acs: ["AC-AUDIT-005"]
      
      retention_days:
        CRITICAL: 90
        ERROR: 90
        WARNING: 60
        INFO: 30
        DEBUG: 7
        TRACE: 7
        
      configurable: true
      config_file: "cortex-brain/config/audit-config.yaml"
      vacuum_trigger: "Daily scheduled + on startup"

    # =========================================================================
    # ROUND 2 SPECIFICATIONS (SPEC-011 to SPEC-018)
    # =========================================================================
    
    # -------------------------------------------------------------------------
    # SPEC-011: Custom Exception Hierarchy (was DOR-AMB-011)
    # -------------------------------------------------------------------------
    exception_hierarchy:
      id: "SPEC-011"
      status: "RESOLVED"
      affected_acs: ["AC-ORCH-006", "AC-TDD-001", "AC-STATE-001"]
      
      base_class: "CortexError"
      hierarchy:
        - name: "GovernanceError"
          purpose: "Rule violations, merge failures"
          subclasses: ["RulePrecedenceError", "MergeConflictError"]
        - name: "OrchestrationError"
          purpose: "Routing, lifecycle, timeout"
          subclasses: ["RoutingError", "PhaseTimeoutError", "MasterBypassError"]
        - name: "ValidationError"
          purpose: "AC validation, schema failures"
          subclasses: ["ACValidationError", "SchemaViolationError"]
        - name: "StateError"
          purpose: "Persistence, transaction isolation"
          subclasses: ["TransactionIsolationError", "CheckpointError"]
        - name: "AuditError"
          purpose: "Logging failures, buffer overflow"
          subclasses: ["BufferOverflowError", "AuditWriteError"]
      
      implementation_location: "src/core/exceptions.py"
      
    # -------------------------------------------------------------------------
    # SPEC-012: Test Coverage Threshold (was DOR-AMB-012)
    # -------------------------------------------------------------------------
    test_coverage:
      id: "SPEC-012"
      status: "RESOLVED"
      affected_acs: ["AC-TDD-003", "AC-TDD-004"]
      
      thresholds:
        line_coverage: 90  # percent minimum
        branch_coverage: 80  # percent minimum
        security_tests: 100  # no uncovered security paths
        
      enforcement: "pytest-cov with --cov-fail-under"
      configurable: true
      config_file: "cortex-brain/config/quality-gates.yaml"
      
    # -------------------------------------------------------------------------
    # SPEC-013: Request Transformation Fields (was DOR-AMB-013)
    # -------------------------------------------------------------------------
    request_transformation:
      id: "SPEC-013"
      status: "RESOLVED"
      affected_acs: ["AC-ORCH-003"]
      
      transformed_request_schema:
        original: "string (user raw request)"
        timestamp: "ISO8601"
        correlation_id: "UUID"
        intent_type: "enum (development|planning|investigation|ado|vacuum|crawl)"
        governance_snapshot_id: "string (hash of merged rules - reference, not embedded)"
        domain_hints: "list of strings (extracted keywords)"
        token_budget: "int (remaining tokens, default 80000)"
        
      enrichment_source: "LLM Intent Classifier for domain_hints extraction"
      
    # -------------------------------------------------------------------------
    # SPEC-014: Middleware Execution Order (was DOR-AMB-014)
    # -------------------------------------------------------------------------
    middleware_order:
      id: "SPEC-014"
      status: "RESOLVED"
      affected_acs: ["AC-ORCH-005"]
      
      strategy: "Priority-based (lower number = earlier execution)"
      
      pre_execution_order:
        - priority: 1
          middleware: "SetupVerifier"
          rule: "CORE-006"
        - priority: 2
          middleware: "FileCreationGuard"
          rules: ["CORE-002", "CORE-020"]
        - priority: 3
          middleware: "YAMLFirstValidator"
          rule: "CORE-018"
        - priority: 8
          middleware: "IncrementalExecutor"
          rule: "CORE-001"
        - priority: 10
          middleware: "PythonBestPracticesValidator"
          rules: ["CORE-011", "CORE-012", "CORE-013"]
          
      post_execution_order:
        - priority: 5
          middleware: "ResponseFormatter"
          rule: "CORE-003"
        - priority: 30
          middleware: "TeardownRefactor"
          rule: "CORE-007"
          
    # -------------------------------------------------------------------------
    # SPEC-015: Failure Rollback Strategy (was DOR-AMB-015)
    # -------------------------------------------------------------------------
    rollback_strategy:
      id: "SPEC-015"
      status: "RESOLVED"
      affected_acs: ["AC-STATE-001", "AC-STATE-003", "AC-ORCH-006"]
      
      strategy: "Checkpoint + partial commit"
      behavior:
        - "Each step within a phase creates a checkpoint"
        - "On failure: persist completed steps, mark phase FAILED, record failure point"
        - "Continuation can resume from last checkpoint or retry full phase"
        
      progress_tracker_fields:
        phase_status: "enum (FAILED)"
        failed_at_step: "int"
        completed_steps: "list of ints"
        failure_reason: "string"
        
    # -------------------------------------------------------------------------
    # SPEC-016: Governance Cache Strategy (was DOR-AMB-016)
    # -------------------------------------------------------------------------
    governance_cache:
      id: "SPEC-016"
      status: "RESOLVED"
      affected_acs: ["AC-GOV-004"]
      
      strategy: "Hash-based invalidation"
      storage: "memory (in-process dict)"
      hash_algorithm: "sha256"
      
      monitored_files:
        - "cortex-brain/tier0/governance/core-rules.yaml"
        - "cortex-brain/tier1/company-practices.yaml"
        - "cortex-brain/tier2/engineering-standards.yaml"
        - "cortex-brain/tier3/domain-patterns.yaml"
        
      metrics:
        cache_hits: true
        cache_misses: true
        merge_latency_ms: true
        
    # -------------------------------------------------------------------------
    # SPEC-017: Integration Test Mocking (was DOR-AMB-017)
    # -------------------------------------------------------------------------
    integration_test_mocking:
      id: "SPEC-017"
      status: "RESOLVED"
      affected_acs: ["AC-ADO-001", "AC-CRAWLER-004"]
      
      strategy: "Mock external, real internal"
      
      always_mock:
        - service: "azure_devops_api"
          library: "responses"
        - service: "git_remote_operations"
          library: "gitpython mock"
        - service: "external_http"
          library: "responses"
          
      use_real:
        - service: "sqlite"
          mode: ":memory: database"
        - service: "file_system"
          mode: "tmp directory with cleanup"
        - service: "governance_merger"
          mode: "real with test tier files"
          
      fixture_location: "tests/fixtures/"
      
    # -------------------------------------------------------------------------
    # SPEC-018: Observability Standards (was DOR-AMB-018)
    # -------------------------------------------------------------------------
    observability:
      id: "SPEC-018"
      status: "RESOLVED"
      affected_acs: ["AC-AUDIT-001", "AC-AUDIT-003"]
      
      logging:
        format: "JSON"
        fields: ["timestamp", "level", "correlation_id", "ac_id", "message", "extra"]
        output: ["stderr", "audit_db"]
        
      metrics:
        latency_p99_ms: true
        operation_count: true
        error_rate: true
        storage: "progress-tracker.json metrics section"
        
      health:
        endpoint: "src/health/health_check.py"
        checks:
          - "audit_db_writable"
          - "governance_files_exist"
          - "state_db_writable"

    # =========================================================================
    # ROUND 3 SPECIFICATIONS (SPEC-019 to SPEC-025) - SIMPLIFIED
    # =========================================================================
    # Philosophy: YAGNI - solve problems when they're actually problems
    # =========================================================================
    
    # -------------------------------------------------------------------------
    # SPEC-019: Package Manager (SIMPLIFIED)
    # -------------------------------------------------------------------------
    package_manager:
      id: "SPEC-019"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-012"]
      
      strategy: "requirements.txt + manual CLI"
      install: "pip install -r requirements.txt"
      no_post_install_hooks: true  # Fragile in venvs
      rationale: "Post-install hooks break in virtual environments and add complexity"
      
    # -------------------------------------------------------------------------
    # SPEC-020: CLI Framework (SIMPLIFIED)
    # -------------------------------------------------------------------------
    cli_framework:
      id: "SPEC-020"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-012", "AC-ORCH-001"]
      
      framework: "argparse"  # stdlib, zero dependencies
      entry_point: "python -m src.main {command}"
      commands: ["setup", "onboard", "audit"]
      migrate_to_typer: "Only if CLI exceeds 10+ commands"
      rationale: "Zero dependencies, works everywhere, sufficient for current needs"
      
    # -------------------------------------------------------------------------
    # SPEC-021: VS Code Extension (DEFERRED)
    # -------------------------------------------------------------------------
    vscode_extension:
      id: "SPEC-021"
      status: "DEFERRED"
      deferred_to: "Phase 4+"
      affected_acs: ["AC-ONBOARD-012"]
      
      rationale: "Building an extension is a separate project; core CORTEX works without it"
      current_approach: "Users run 'cortex setup' in terminal"
      future_work: "activationEvents + workspaceContains:cortex-brain/**"
      
    # -------------------------------------------------------------------------
    # SPEC-022: Knowledge Graph Freshness (SIMPLIFIED)
    # -------------------------------------------------------------------------
    knowledge_freshness:
      id: "SPEC-022"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-006", "AC-ONBOARD-012"]
      
      strategy: "Timestamp + manual refresh"
      storage: "last_scanned_timestamp in knowledge-graph.db metadata"
      stale_threshold_days: 7
      on_stale: "Warning message, no auto-rescan"
      refresh_command: "cortex onboard --refresh"
      rationale: "Git commit comparison adds complexity; timestamp is simple and predictable"
      
    # -------------------------------------------------------------------------
    # SPEC-023: Concurrent Onboarding (SIMPLIFIED)
    # -------------------------------------------------------------------------
    concurrent_onboarding:
      id: "SPEC-023"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-001"]
      
      strategy: "Simple lock, fail if exists"
      lock_file: "cortex-brain/.onboarding.lock"
      on_conflict: "Fail with message: 'Onboarding in progress. Delete .onboarding.lock if stuck.'"
      no_timeout_logic: true
      no_stale_detection: true
      rationale: "Team concurrent onboarding is edge case; solve when actually a problem"
      
    # -------------------------------------------------------------------------
    # SPEC-024: Partial Onboarding Failure (SIMPLIFIED)
    # -------------------------------------------------------------------------
    partial_failure:
      id: "SPEC-024"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-002", "AC-ONBOARD-010"]
      
      strategy: "All-or-nothing"
      on_failure: "Log error, exit non-zero, user re-runs from scratch"
      workaround: "--skip-analyzer {name} flag if specific analyzer problematic"
      no_checkpointing: true
      rationale: "Onboarding is fast enough to re-run; checkpointing adds state complexity"
      
    # -------------------------------------------------------------------------
    # SPEC-025: Cross-Platform Paths (SIMPLIFIED)
    # -------------------------------------------------------------------------
    cross_platform_paths:
      id: "SPEC-025"
      status: "RESOLVED"
      affected_acs: ["AC-ONBOARD-006", "AC-ONBOARD-007"]
      
      strategy: "pathlib.Path everywhere, store as-is"
      internal: "pathlib.Path for all operations"
      storage: "Platform-native format (local DB only)"
      no_posix_conversion: true
      rationale: "knowledge-graph.db is local; cross-platform sharing is unlikely (YAGNI)"

  # Summary for quick reference
  summary:
    total_specifications: 25
    round_1_count: 10  # SPEC-001 to SPEC-010
    round_2_count: 8   # SPEC-011 to SPEC-018
    round_3_count: 7   # SPEC-019 to SPEC-025 (simplified)
    high_impact: 8
    medium_impact: 10
    low_impact: 7
    all_resolved: true
    deferred: 1  # SPEC-021 VS Code Extension
    
  # Governance Rules Referenced
  governance_rules_referenced:
    core_rules_count: 21  # Updated with CORE-022
    new_rule: "CORE-022 - Kebab-Case File Naming (max 20 chars)"
    file: "cortex-brain/tier0/governance/core-rules.yaml"
    medium_impact: 4
    low_impact: 1
    blocking_phase_1: ["DOR-AMB-004"]
    blocking_phase_2: ["DOR-AMB-001", "DOR-AMB-002", "DOR-AMB-003", "DOR-AMB-005", "DOR-AMB-006", "DOR-AMB-007", "DOR-AMB-008"]
    blocking_phase_3: ["DOR-AMB-009"]

