  - cortex-brain/documents/logs/unmatched-intents.jsonl
  riskIfUnfixed: medium
  estimatedEffort: 2
  owner: Routing
- id: AC-SEC-001
  title: Audit Log Secret Redaction Filter
  description: 'Implement automatic secret redaction in audit logs to prevent credential
    exposure.


    Problem: Audit entries include context dict (arbitrary key/value). If AC implementation
    logs API keys, passwords, tokens → Exposed in audit logs.


    Solution:

    1. Detect secret patterns in context: password, token, api_key, secret, credential
    (regex patterns)

    2. Redact values (replace with [REDACTED])

    3. Log redaction action (audit entry says "secret_count: 3, redacted")

    4. Require AC implementations to use safe_log() helper (filters before audit)


    Acceptance Criteria:

    - Password/token/api_key patterns detected and redacted

    - Redaction logged (for audit transparency)

    - No credentials appear in audit logs

    - Tests: log context with password, verify redaction

    '
  status: planned
  priority: medium
  phase: 2
  category: security
  tests:
