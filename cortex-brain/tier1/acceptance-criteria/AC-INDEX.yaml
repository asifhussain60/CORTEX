  - src/orchestrators/core/governance_merger.py
  riskIfUnfixed: high
  estimatedEffort: 2
  owner: Governance
- id: AC-RISK-006
  title: Evidence Validation Batch Re-Validation & Accuracy Improvement
  description: 'Improve evidence validator accuracy from current 56% verification
    rate to >95%, and implement batch re-validation.


    Problem: progress-tracker.json shows 85% complete but only 88.24% verified (56%
    verification rate). False positive claims block phases. AC-LIFECYCLE-001 marked
    verified but tests not passing.


    Solution:

    1. Batch re-validate all Phase AC-IDs (run all tests, update tracker atomically)

    2. Test discovery: find all tests with @pytest.mark.ac_id() marker

    3. Improve pytest output parsing (use --json-report if available)

    4. Add evidence source tracking (test file path, execution date)

    5. Log validation results to cortex-brain/documents/logs/evidence-audit.jsonl


    Acceptance Criteria:

    - Batch validation runs on all Phase 1 AC-IDs

    - Verification rate increases to >95%

    - Evidence source tracked (test file, marker, execution date)

    - False positive rate <5%

    - Tests: mark AC-ID "verified" without passing tests, batch validator corrects
    it

    '
