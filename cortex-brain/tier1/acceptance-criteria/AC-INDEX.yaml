- id: AC-SEC-002
  title: Planning Database File Permissions & Access Control
  description: 'Set planning.db file permissions to 0600 (user-only) and add optional
    encryption.


    Problem: planning.db world-readable. Any process can read phase state, AC-ID execution
    order, orchestrator configs.


    Solution:

    1. Set planning.db permissions to 0600 on creation (user-only read/write)

    2. Verify permissions on startup, correct if drifted

    3. Optional: Encrypt DB at-rest using sqlcipher (if sensitive data increases)

    4. Add access control check in StateManager (verify caller identity)


    Acceptance Criteria:

    - File permissions set to 0600 on DB creation

    - Permissions verified on startup (log if drifted)

    - Other processes cannot read DB without user ownership

    - Tests: create DB, verify 0600 permissions, attempt read from other process (denied)

