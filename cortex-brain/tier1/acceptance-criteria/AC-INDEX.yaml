- id: AC-RISK-008
  title: Create Plan-Viewer Canonical Data Source
  description: 'Problem: plan-viewer.html synced from progress-tracker.json via manual

    sync_plan_viewer_data.py script. No atomic writes. If sync forgotten or script
    fails,

    HTML and tracker drift → dashboard shows wrong phase status.


    Solution:

    Create cortex-brain/registry/plan-viewer-data.json as canonical source:

    1. progress-tracker.json writes to plan-viewer-data.json (atomic + backup)

    2. plan-viewer.html reads ONLY from plan-viewer-data.json

    3. Remove hardcoded values from HTML (all from JSON)

    4. Validate sync on startup (file hash check)

    5. Implement drift detection (plan-viewer reads tracker, compares to registry)


    Acceptance Criteria:

    - plan-viewer-data.json created and maintains AC-ID list

    - Atomic writes (backup before write, verify after)

    - plan-viewer.html reads all data from JSON (no hardcoded values)

    - Sync script validates both sources match (hash comparison)

    - On mismatch, log warning and repair (tracker is authoritative)

    - Tests: verify no hardcoded values in HTML, verify atomic writes

    '
  status: planned
  priority: critical
  phase: 2
  category: reliability
  tests:
