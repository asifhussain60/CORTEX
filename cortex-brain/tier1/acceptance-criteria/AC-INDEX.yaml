acceptanceCriteria:
- id: AC-BRITTLE-001
  title: YAML Encoding Corruption Detection & Repair
  description: 'Implement detection and repair for YAML files with encoding corruption
    (bytes 0x8f, 0x9d from Windows-1252 mishandling).


    Problem: AC-INDEX.yaml or core-rules.yaml loaded with encoding mismatch → yaml.safe_load()
    silently misparses → Governance rules incomplete/incorrect.


    Solution:

    1. Add pre-load YAML encoding validator (check BOM, sample bytes, validate UTF-8)

    2. Detect corruption pattern (non-ASCII bytes in specific fields)

    3. Implement 3-level repair: re-encode to UTF-8, strip non-ASCII, or fail with
    clear error

    4. Add file integrity hash (first 50 bytes SHA256) for detection

    5. Log encoding issues to audit trail (AuditCategory.INFRASTRUCTURE)


    Acceptance Criteria:

    - Detects Windows-1252 corruption on AC-INDEX.yaml load

    - Repairs file automatically (re-encodes to UTF-8)

    - Falls back to git recovery if repair fails

    - Logs repair action with file path, bytes corrupted, action taken

    - Tests: corrupt AC-INDEX.yaml intentionally, verify detection and repair

    '
  status: planned
  priority: critical
  phase: 1
  category: brittleness
  tests:
  - tests/quality/test_yaml_encoding_detection.py
  - tests/infrastructure/test_governance_merger_encoding.py
  dependencies:
  - AC-AUDIT-001
  evidencePaths:
  - src/orchestrators/core/governance_merger.py
  - src/utils/yaml_cache.py
  - cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml
  - cortex-brain/tier0/governance/core-rules.yaml
  riskIfUnfixed: critical
  estimatedEffort: 3
  owner: Infrastructure
- id: AC-BRITTLE-002
  title: YAML File Locking & Atomic Writes for Concurrency Safety
  description: 'Implement file locking and atomic write patterns to prevent corruption
    from concurrent writes to YAML files.


    Problem: Multiple orchestrators writing to progress-tracker.json or AC-INDEX.yaml
    simultaneously → Race conditions → Corrupted JSON.


    Solution:

    1. Use filelock library for cross-platform advisory file locking

    2. Implement atomic write pattern: write to temp file, atomic rename on success

    3. Add lock timeout (5s) to prevent deadlock

    4. Log lock contention to audit trail (debug level)


    Acceptance Criteria:

    - Acquires lock before writing progress-tracker.json, AC-INDEX.yaml

    - Writes to temp file, atomically renames on success

    - Times out gracefully after 5s (retries with exponential backoff)

    - No corrupted JSON after concurrent writes

    - Tests: 10 concurrent writers, all complete without corruption

    '
  status: planned
  priority: medium
  phase: 1
  category: brittleness
  tests:
  - tests/quality/test_json_concurrent_writes.py
  - tests/infrastructure/test_file_lock_contention.py
  dependencies:
  - AC-BRITTLE-001
  evidencePaths:
  - cortex-brain/tier1/tracking/progress-tracker.json
  - cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml
  - src/orchestrators/master/todo_manager.py
  riskIfUnfixed: high
  estimatedEffort: 2
  owner: Infrastructure
- id: AC-BRITTLE-003
  title: YAML File Locking - Out-of-Order Concurrent Write Detection
  description: 'Detect and prevent out-of-order updates to progress-tracker.json when
    multiple AC-ID implementations write field values concurrently.


    Problem: AC-ID X marks complete, AC-ID Y updates completion_percentage, both write()
    called simultaneously → Final file has only Y''s updates.


    Solution:

    1. Add version counter to progress-tracker.json (incremented per write)

    2. Compare expected version before writing (detect skipped updates)

    3. Retry with exponential backoff if version mismatch detected

    4. Log version conflicts to audit trail (AuditCategory.ORCHESTRATOR)


    Acceptance Criteria:

    - Detects version mismatch on concurrent writes

    - Retries up to 3 times with backoff (100ms, 200ms, 500ms)

    - No lost updates after retry sequence

    - Tests: 5 concurrent update_tracker() calls, verify all fields updated

    '
  status: planned
  priority: medium
  phase: 1
  category: brittleness
  tests:
  - tests/quality/test_progress_tracker_version_control.py
  dependencies:
  - AC-BRITTLE-002
  evidencePaths:
  - cortex-brain/tier1/tracking/progress-tracker.json
  - src/infrastructure/test_executor.py
  riskIfUnfixed: medium
  estimatedEffort: 2
  owner: Infrastructure
- id: AC-BRITTLE-004
  title: Cross-Platform Path Portability Enforcement
  description: 'Add static analysis to detect and prevent hardcoded paths (e.g., /Users/asifhussain/PROJECTS/CORTEX)
    in scripts and code.


    Problem: Scripts with hardcoded absolute paths fail on Linux/Windows. CORE-005
    already enforces this, but no active detection.


    Solution:

    1. Add CI/CD linter that searches for absolute path patterns

    2. Whitelist: project_root paths (relative/dynamic only)

    3. Scan: scripts/, src/ for hardcoded paths

    4. Fail build if violations found


    Acceptance Criteria:

    - CI linter detects absolute hardcoded paths

    - Whitelist dynamic path usage (Path.home(), project_root, etc.)

    - No hardcoded paths in scripts/

    - Tests: attempt to use hardcoded path, CI fails with clear message

    '
  status: planned
  priority: medium
  phase: 1
  category: brittleness
  tests:
  - tests/quality/test_path_portability.py
  dependencies: []
  evidencePaths:
  - scripts/
  - src/
  riskIfUnfixed: medium
  estimatedEffort: 2
  owner: QA
- id: AC-BRITTLE-005
  title: Environment Variable Validation & Defaults
  description: 'Document all required environment variables and provide safe defaults
    to prevent unset-var failures.


    Problem: Code assumes CORTEX_ROOT, DEBUG, etc. are set. Unset → AttributeError/KeyError
    at runtime.


    Solution:

    1. Add env var schema in src/config/ (required, optional, defaults)

    2. Validate on main.py entry (check required vars, apply defaults)

    3. Fail fast with clear error if required var missing


    Acceptance Criteria:

    - All required env vars documented in README

    - Validation runs on entry_point.py startup

    - Clear error message if required var missing

    - Default values used for optional vars (DEBUG=False, etc.)

    - Tests: run without env vars, verify graceful failure with helpful message

    '
  status: planned
  priority: low
  phase: 1
  category: brittleness
  tests:
  - tests/infrastructure/test_env_var_defaults.py
  dependencies: []
  evidencePaths:
  - src/entry_point/
  - src/main.py
  riskIfUnfixed: low
  estimatedEffort: 2
  owner: Infrastructure
- id: AC-RISK-001
  title: Automatic Progress Tracker → Plan Viewer Sync
  description: 'Implement automatic synchronization of progress-tracker.json to plan-viewer-data.json
    to eliminate dashboard sync drift.


    Problem: progress-tracker.json is source of truth (updated by test execution).
    plan-viewer-data.json manually synced via script. 30+ min drift possible → Stale
    dashboard → Wrong phase gate decisions.


    Solution:

    1. Hook sync_plan_viewer_data.py as post-write callback in progress-tracker.json
    save

    2. Make sync atomic (write to temp, rename)

    3. Add file watcher in MasterOrchestrator (triggers sync on file change)

    4. Add refresh timer to cortex-plan-viewer.html (AJAX poll every 60s)

    5. Log sync operations to cortex-brain/documents/logs/sync-history.jsonl


    Acceptance Criteria:

    - Sync executes within 5s of progress-tracker.json update

    - Plan viewer auto-refreshes (no manual F5 needed)

    - Sync history logged with timestamp, source, status

    - No drift >60s between tracker and viewer

    - Tests: update tracker, verify viewer updates within 5s

    '
  status: planned
  priority: critical
  phase: 1
  category: reliability
  tests:
  - tests/integration/test_progress_tracker_sync.py
  - tests/quality/test_plan_viewer_refresh.py
  dependencies:
  - AC-BRITTLE-002
  evidencePaths:
  - scripts/sync_plan_viewer_data.py
  - cortex-brain/tier1/tracking/progress-tracker.json
  - templates/plan-viewer/plan-viewer-data.json
  - templates/plan-viewer/cortex-plan-viewer.html
  riskIfUnfixed: critical
  estimatedEffort: 3
  owner: Infrastructure
- id: AC-RISK-002
  title: TodoManager SQLite Persistence & Restart Recovery
  description: 'Implement SQLite persistence for TodoManager to survive orchestrator
    restarts and maintain full task context.


    Problem: TodoOrchestrator.todos dict is in-memory only. Orchestrator crash/restart
    → All TODO items lost. Phase recovery requires manual AC-ID list from progress-tracker.json.


    Solution:

    1. Integrate TodoOrchestrator with StateManager for SQLite persistence

    2. Save TODO items on creation/update/delete (not just in memory)

    3. Load TODO items on orchestrator __init__ (recovery on restart)

    4. Enable WAL mode on state.db (concurrency, atomic writes)

    5. Implement checkpoint mechanism (save full state graph before major operations)


    Acceptance Criteria:

    - Create TODO, restart orchestrator, verify TODO still exists

    - Create TODO chain (A→B→C), restart, verify dependency graph intact

    - Parallel task detection works after restart

    - Load test: 1000 TODOs, verify <100ms persistence latency per operation

    - Tests: tests/integration/test_todo_orchestrator_restart.py

    '
  status: planned
  priority: critical
  phase: 2
  category: reliability
  tests:
  - tests/integration/test_todo_orchestrator_restart.py
  - tests/performance/test_todo_persistence_latency.py
  dependencies:
  - AC-STATE-001
  - AC-STATE-002
  - AC-STATE-003
  evidencePaths:
  - src/orchestrators/core/todo_orchestrator.py
  - src/orchestrators/master/todo_manager.py
  - src/orchestrators/state_manager.py
  riskIfUnfixed: critical
  estimatedEffort: 4
  owner: Orchestration
- id: AC-RISK-003
  title: Phase Rollback & Cleanup Mechanism
  description: 'Implement automatic cleanup and rollback for failed phases to prevent
    orphaned artifacts.


    Problem: Phase 2 starts, AC-ORCH-006 fails → TODO items created, tests generated,
    files written, phase marked FAILED. No automatic rollback → Orphaned artifacts,
    manual cleanup required.


    Solution:

    1. Add phase-scoped checkpoint before starting new AC-IDs

    2. Implement rollback orchestrator (deletes files, removes TODO items, restores
    state)

    3. Create rollback trigger on phase FAILED (automatic)

    4. Store rollback actions in state.db (track what was rolled back)

    5. Log rollback events to audit trail (AuditCategory.ORCHESTRATOR)


    Acceptance Criteria:

    - Phase checkpoint created before AC-ID 1 of new phase

    - On phase FAILED, automatic rollback deletes all phase artifacts

    - Rollback actions logged to audit trail with file paths, TODO IDs

    - State restored to pre-phase state

    - Tests: fail an AC-ID mid-implementation, trigger rollback, verify cleanup

    '
  status: planned
  priority: high
  phase: 2
  category: reliability
  tests:
  - tests/orchestrators/test_phase_rollback.py
  dependencies:
  - AC-RISK-002
  - AC-STATE-002
  evidencePaths:
