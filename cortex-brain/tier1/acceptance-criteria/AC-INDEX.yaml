  owner: QA
- id: AC-RISK-007
  title: Pattern Router Unmatched Intent Tracking & Library Expansion
  description: 'Add tracking and auto-expansion for unmatched intents in PatternRouter
    to maintain >90% pattern coverage.


    Problem: PatternRouter depends on regex/keyword patterns covering 90%+ intents.
    No tracking of misses → Pattern library degrades over time.


    Solution:

    1. Log all unmatched intents to cortex-brain/documents/logs/unmatched-intents.jsonl

    2. Analyze unmatched log weekly (pattern expansion candidates)

    3. Add new patterns to pattern_router_config.yaml

    4. Track coverage metric (matched / total intents)

    5. Alert if coverage drops below 85%


    Acceptance Criteria:

    - Unmatched intents logged with intent text, source, timestamp

    - Pattern coverage calculated weekly (from logs)

    - Coverage metric exported to metrics endpoint

    - Recommendation generated for missing patterns

    - Tests: send unmatched intent, verify logging and analysis

    '
  status: planned
  priority: medium
  phase: 3
  category: reliability
  tests:
