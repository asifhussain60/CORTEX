    prefix: "AC-STATE"
    description: "State management acceptance criteria"
    tier: 1
    priority: 1  # Foundation - must complete first
    
  ORCH:
    prefix: "AC-ORCH"
    description: "Orchestration core acceptance criteria"
    tier: 1
