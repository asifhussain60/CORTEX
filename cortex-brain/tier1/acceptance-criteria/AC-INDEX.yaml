  INV:
    prefix: "AC-INV"
    description: "Investigation acceptance criteria"
    tier: 2
    priority: 3  # Feature phase
    
  LLM:
    prefix: "AC-LLM"
    description: "LLM integration acceptance criteria"
    tier: 3
