  VIS:
    prefix: "AC-VIS"
    description: "Vision API acceptance criteria"
    tier: 3
    priority: 4  # Intelligence phase
    
  KNOW:
    prefix: "AC-KNOW"
    description: "Knowledge practices acceptance criteria"
    tier: 3
    priority: 4  # Intelligence phase

  CRAWLER:
    prefix: "AC-CRAWLER"
    description: "AST crawlers and code analysis acceptance criteria"
    tier: 2
    priority: 3  # Feature phase - builds knowledge graphs
    source: "CORTEX-4.0:src/crawlers/"

  GRAPH:
    prefix: "AC-GRAPH"
    description: "Knowledge graph building acceptance criteria"
    tier: 3
    priority: 4  # Intelligence phase - uses crawler output

  SCAFFOLD:
    prefix: "AC-SCAFFOLD"
    description: "Orchestrator Scaffolder - team extensibility for custom domain orchestrators"
    tier: 2
    priority: 3  # Feature phase - enables team autonomy
    core_workflow: true
    team_extensibility: true
    note: "Enables domain teams to build orchestrators using CORTEX governance intelligence"
    related_governance: "CORE-021"
    future_migration: "AC-MIGRATE-001"

  MIGRATE:
    prefix: "AC-MIGRATE"
    description: "Legacy system migration acceptance criteria"
    tier: 2
    priority: 5  # Phase 5 - after feature orchestrators
    note: "Deferred migration work - tracked for future phases"
    blocked_by: ["AC-SCAFFOLD-001", "AC-ORCH-006", "AC-STATE-002"]

  INTERACT:
    prefix: "AC-INTERACT"
    description: "Interactive orchestration capabilities with configuration-driven approach"
    tier: 1
    priority: 2  # After foundation - part of core workflow
    core_workflow: true
    note: "Enhanced interactive capabilities maintaining CORE-001 autonomous execution compliance"
    related_governance: ["CORE-001", "CORE-017"]
    design_approach: "distributed_with_centralized_config"
    
  ONBOARD:
    prefix: "AC-ONBOARD"
    description: "Comprehensive repo/project onboarding with AST crawlers, git history analysis, and knowledge graph building"
    tier: 1
    priority: 2  # After foundation - critical for team environment
    core_workflow: true
    team_extensibility: true
    setup_integration: true  # NEW: Part of installation/setup flow
    note: |
      The Onboarding Orchestrator runs on new repos/projects to:
      1. Run AST crawlers to analyze codebase structure
      2. Analyze git history and commit patterns
      3. Build knowledge graphs stored in company tier (tier1)
      4. Detect tech stack, dependencies, architecture patterns
      5. Create initial CORTEX configuration
      6. Provide interactive guided setup for users/teams
      7. AUTO-RUN during setup/installation (AC-ONBOARD-012)
    source_references:
      onboarding_orchestrator: "commit:4686dc7a8 - src/orchestration_3_0/orchestrators/onboarding/"
      cortex_lens: "CORTEX-4.0:src/cortex_lens/"
      ast_analyzers: "CORTEX-4.0:src/cortex_lens/analyzers/"
      data_pipeline: "CORTEX-4.0:src/cortex_lens/core/pipeline.py"
      collectors: "CORTEX-4.0:src/cortex_lens/collectors/"
    stores_to: "cortex-brain/tier1/  (company tier - project-specific knowledge)"

# ==============================================================================
# Phase 1: Foundation ACs (MUST complete first)
# ==============================================================================
foundation:
  audit:
