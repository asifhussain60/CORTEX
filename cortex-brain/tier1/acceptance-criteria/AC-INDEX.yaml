# ==============================================================================
# CORE WORKFLOW: User → MasterOrchestrator → TDD → Implementation
# ==============================================================================
core_workflow:
  description: |
    This is THE DEFAULT WORKING MECHANISM at the core of CORTEX operations.
    MasterOrchestrator is IN CHARGE. All requests flow through this pipeline.
    
    WORKFLOW SUMMARY:
    1. User enters prompt → Tokenized efficiently → MasterOrchestrator
    2. MasterOrchestrator breaks down work into todos
    3. For software development tasks → Engage TDD Orchestrator
    4. TDD generates Final Instruction (F) from governance merge
    5. TDD hands off to implementation orchestrators

  # ============================================================================
  # PHASE 1: Request Processing
  # ============================================================================
  phase_1_request_processing:
    description: "User prompt → Tokenization → MasterOrchestrator"
    steps:
      - step: 1.1
        name: "User Intent Capture"
        action: "User enters prompt showing intent (e.g., plan creation, implementation)"
        output: "raw_prompt"
        
      - step: 1.2
        name: "Efficient Tokenization"
        action: "Convert prompt to tokens, remove ambiguity, normalize intent"
        output: "tokenized_request"
        purpose: "Prevent misinterpretation, reduce token waste"
        ac_ids: ["AC-ORCH-003"]
        
      - step: 1.3
        name: "MasterOrchestrator Receives Request"
        action: "MasterOrchestrator.receive(tokenized_request)"
        output: "validated_request"
        implementation: "src/orchestrators/master_orchestrator.py"
        ac_ids: ["AC-ORCH-006"]

  # ============================================================================
  # PHASE 2: Task Breakdown
  # ============================================================================
  phase_2_task_breakdown:
    description: "MasterOrchestrator breaks down work into todos"
    steps:
      - step: 2.1
        name: "Intent Classification"
        action: "Classify request type: planning, development, investigation, etc."
        output: "intent_type"
        ac_ids: ["AC-ORCH-001", "AC-ORCH-002"]
        
      - step: 2.2
        name: "Task Decomposition"
        action: "Break down request into atomic tasks based on intent"
        output: "task_list[]"
        ac_ids: ["AC-TODO-001", "AC-TODO-002"]
        
      - step: 2.3
        name: "Orchestrator Selection"
        action: "Select appropriate orchestrator based on task type"
        routing:
          software_development: "TDDOrchestrator"
          planning: "PlanningOrchestrator"
          investigation: "InvestigationOrchestrator"
          ado_work: "ADOOrchestrator"
        ac_ids: ["AC-ORCH-007"]

  # ============================================================================
  # PHASE 3: TDD Orchestrator (Software Development Path)
  # ============================================================================
  phase_3_tdd_orchestrator:
    description: "TDD Orchestrator generates Final Instruction (F) and executes RED→GREEN→REFACTOR"
    condition: "intent_type == 'software_development'"
    
    final_instruction_formula:
      description: "F = CORTEX_Governance + BestPractices + CompanyPractices + DomainKnowledge"
      components:
        - name: "CORTEX Governance (SKULL)"
          source: "cortex-brain/tier0/governance/core-rules.yaml"
          precedence: "HIGHEST"
          content: "19 immutable SKULL rules (TDD_ENFORCEMENT, SOLID_PRINCIPLES, etc.)"
          ac_ids: ["AC-GOV-001", "AC-GOV-003"]
          
        - name: "Best Practices"
          source: "cortex-brain/tier2/engineering-standards.yaml"
          precedence: "MEDIUM"
          content: "Code style, testing standards, documentation requirements"
          ac_ids: ["AC-KNOW-001"]
          
        - name: "Company Practices"
          source: "cortex-brain/tier1/company-practices.yaml"
          precedence: "HIGH"
          content: "Organization-specific rules, compliance requirements"
          ac_ids: ["AC-KNOW-003"]
          
        - name: "Domain Knowledge & Constraints"
          source: "cortex-brain/tier3/domain-patterns.yaml"
          precedence: "LOW"
          content: "Authentication patterns, database patterns, API patterns"
          ac_ids: ["AC-KNOW-002", "AC-TDD-007"]
      
      merge_rule: "Tier 0 always wins → Tier 1 → Tier 2 → Tier 3"
      output: "final_instruction (F)"
      ac_ids: ["AC-TDD-002", "AC-GOV-005"]
    
    steps:
      - step: 3.1
        name: "Load Governance Rules"
        action: "GovernanceMerger.merge_all_tiers()"
        output: "merged_governance"
        ac_ids: ["AC-GOV-001", "AC-GOV-005"]
        
      - step: 3.2
        name: "Generate Final Instruction (F)"
        action: "TDDOrchestrator.generate_final_instruction(merged_governance, request)"
        output: "final_instruction"
        ac_ids: ["AC-TDD-002"]
        
      - step: 3.3
        name: "DISCOVERY Phase"
        action: "Detect language, framework, project structure"
        output: "technology_info"
        ac_ids: ["AC-TDD-006"]
        
      - step: 3.4
        name: "RED Phase"
        action: "Generate failing tests (functional, edge case, security)"
        output: "failing_tests[]"
        validation: "All tests MUST fail initially"
        ac_ids: ["AC-TDD-003"]
        
      - step: 3.5
        name: "GREEN Phase"
        action: "Write minimal implementation until all tests pass"
        output: "implementation_code"
        validation: "All failing_tests now pass"
        ac_ids: ["AC-TDD-004"]
        
      - step: 3.6
        name: "REFACTOR Phase"
        action: "Apply clean code principles (SOLID, DRY, KISS, YAGNI)"
        output: "refactored_code"
        validation: "clean_code_score >= 80, tests still pass"
        ac_ids: ["AC-TDD-005"]

  # ============================================================================
  # PHASE 4: Implementation Handoff
  # ============================================================================
  phase_4_implementation_handoff:
    description: "TDD hands off to specialized implementation orchestrators"
    steps:
      - step: 4.1
        name: "Handoff Decision"
        action: "Determine which implementation orchestrators needed"
        orchestrators:
          - name: "FileCreator"
            purpose: "Create new files"
          - name: "CodeModifier"
            purpose: "Modify existing files"
          - name: "TestRunner"
            purpose: "Execute and validate tests"
          - name: "DocumentationGenerator"
            purpose: "Generate API docs, READMEs"
        ac_ids: ["AC-TDD-008"]
        
      - step: 4.2
        name: "Execute Implementation"
        action: "Implementation orchestrators execute their tasks"
        output: "implementation_results"
        
      - step: 4.3
        name: "Validation"
        action: "Final test run, clean code check, documentation validation"
        output: "validation_report"
        ac_ids: ["AC-TDD-001"]

  # ============================================================================
  # PHASE 5: Progress Persistence
  # ============================================================================
  phase_5_persistence:
    description: "Save progress for session continuation"
    steps:
      - step: 5.1
        name: "Update Progress Tracker"
        action: "TodoManager.persist(results)"
        output: "progress-tracker.json updated"
        ac_ids: ["AC-TODO-003", "AC-STATE-001"]
        
      - step: 5.2
        name: "Audit Trail"
        action: "EnterpriseAuditLogger.log(execution_results)"
        output: "audit entry created"
        ac_ids: ["AC-AUDIT-001", "AC-AUDIT-004"]

  # ============================================================================
  # Best Practices Merge Strategy
  # ============================================================================
  best_practices_merge:
    cortex_practices:
      description: "CORTEX's built-in engineering excellence"
      sources:
        - tier: 0
          name: "SKULL Rules"
          location: "cortex-brain/tier0/governance/core-rules.yaml"
          precedence: "HIGHEST (immutable)"
        - tier: 2
          name: "Engineering Standards"
          location: "cortex-brain/tier2/"
          precedence: "MEDIUM"
    company_practices:
      description: "Organization and project-specific rules"
      sources:
        - tier: 1
          name: "Business Requirements"
          location: "cortex-brain/tier1/"
          precedence: "HIGH"
        - tier: 3
          name: "Learned Patterns"
          location: "cortex-brain/tier3/"
          precedence: "LOW"
    conflict_resolution: "Tier 0 always wins → Tier 1 → Tier 2 → Tier 3"

# ==============================================================================
# Implementation Order (Snowball Strategy)
# ==============================================================================
implementation_order:
  phase_1_foundation:
    description: "These MUST complete before feature work"
    weeks: "1-2"
    categories: ["AC-AUDIT-*", "AC-GOV-*", "AC-STATE-*"]
    dependencies: []
    
  phase_2_orchestration:
    description: "All feature orchestrators route through MasterOrchestrator. CORE WORKFLOW here."
    weeks: "3-4"
    categories: ["AC-ORCH-*", "AC-TDD-*", "AC-PLAN-*", "AC-TODO-*", "AC-SCAFFOLD-*"]
    dependencies: ["phase_1_foundation"]
    critical_path:
      - "AC-ORCH-006: MasterOrchestrator as Central Controller"
      - "AC-ORCH-007: Governance-to-Todo Pipeline"
      - "AC-TODO-001: TodoManager Core"
      - "AC-TODO-002: Task Creation from Governance Evaluation"
      - "AC-SCAFFOLD-001: Orchestrator Scaffolder CLI"
      - "AC-SCAFFOLD-003: MasterOrchestrator Registration (NEVER BYPASSED)"
    note: "This phase establishes the DEFAULT WORKING MECHANISM. Scaffolder enables team extensibility while maintaining MasterOrchestrator control."
    
  phase_3_features:
    description: "Feature orchestrators including crawlers and onboarding"
    weeks: "5-6"
    categories: ["AC-ADO-*", "AC-VAC-*", "AC-INV-*", "AC-CRAWLER-*", "AC-ONBOARD-*"]
    dependencies: ["phase_2_orchestration"]
    notes: |
      - Crawlers recovered from CORTEX-4.0:src/cortex_lens/
      - Onboarding orchestrator builds context from AST crawlers, git history
      - Knowledge stored in tier1 (company tier) for MasterOrchestrator use
    critical_onboarding_acs:
      - "AC-ONBOARD-001: Onboarding Orchestrator Core"
      - "AC-ONBOARD-002: AST Codebase Analysis"
      - "AC-ONBOARD-006: Knowledge Graph Building"
      - "AC-ONBOARD-007: Company Tier Storage"
    
  phase_4_intelligence:
    description: "Knowledge graph and LLM integration"
    weeks: "7-8"
    categories: ["AC-LLM-*", "AC-VIS-*", "AC-KNOW-*", "AC-GRAPH-*"]
    dependencies: ["phase_3_features"]
    notes: "Knowledge graph depends on crawler output and onboarding data"

# ==============================================================================
# Phase 2.5: Orchestrator Scaffolder ACs (Team Extensibility)
# ==============================================================================
orchestrator_scaffolder:
  description: |
    Orchestrator Scaffolder enables domain teams to create custom orchestrators
    that leverage CORTEX governance intelligence. ALL scaffolded orchestrators
    route through MasterOrchestrator - this is NEVER bypassed.
    
    Team Environment Design:
    - Domain teams build orchestrators for their specific needs
    - CORTEX governance (4-tier) automatically applied
    - Company + domain tier knowledge merged into generated code
    - MasterOrchestrator remains central controller
    
  master_orchestrator_enforcement:
    rule: "CRITICAL - NEVER BYPASSED"
    description: |
      MasterOrchestrator is IN CHARGE. All scaffolded orchestrators:
      1. Register with MasterOrchestrator on initialization
      2. Receive requests ONLY through MasterOrchestrator routing
      3. Return results TO MasterOrchestrator for audit/state management
      4. Cannot execute independently without registration
    enforcement_method: "Registration validation at startup + runtime routing check"
    
  scaffolder_acs:
    - id: "AC-SCAFFOLD-001"
      name: "Orchestrator Scaffolder CLI"
      description: |
        CLI tool: `cortex create-orchestrator --name {name} --domain {domain} --category {cat}`
        Generates complete orchestrator structure from manifest template including:
        - Python orchestrator class (extends BaseOrchestratorV4)
        - Manifest YAML (follows manifest-schema.yaml)
        - Test stubs (pytest structure)
        - Domain-specific tier3 knowledge file
      status: "not_started"
      tests: ["tests/tools/test_orchestrator_scaffolder.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-ORCH-006"]
      
    - id: "AC-SCAFFOLD-002"
      name: "4-Tier Governance Injection"
      description: |
        Scaffolder automatically injects governance compliance:
        - Tier 0: SKULL rules enforcement hooks
        - Tier 1: Company compliance templates
        - Tier 2: Engineering standards (TDD, documentation)
        - Tier 3: Domain-specific patterns (user configurable)
        Generated code inherits all governance automatically.
      status: "not_started"
      tests: ["tests/tools/test_scaffolder_governance.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-SCAFFOLD-001", "AC-GOV-005"]
      
    - id: "AC-SCAFFOLD-003"
      name: "MasterOrchestrator Registration"
      description: |
        CRITICAL: All scaffolded orchestrators MUST register with MasterOrchestrator.
        Generated code includes:
        - @register_with_master decorator
        - Routing pattern definition
        - Integration contract validation
        This ensures MasterOrchestrator remains IN CHARGE.
      status: "not_started"
      tests: ["tests/tools/test_scaffolder_registration.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-SCAFFOLD-001", "AC-ORCH-006"]
      enforcement: "MANDATORY - scaffolder fails if registration code missing"
      
    - id: "AC-SCAFFOLD-004"
      name: "Domain Knowledge Integration"
      description: |
        Scaffolder creates domain-specific tier3 knowledge file:
        - cortex-brain/tier3/domains/{domain}-patterns.yaml
        Contains domain terminology, patterns, constraints that
        MasterOrchestrator uses for accurate context in that domain.
      status: "not_started"
      tests: ["tests/tools/test_scaffolder_domain.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-SCAFFOLD-001"]
      
    - id: "AC-SCAFFOLD-005"
      name: "Manifest Contract Validation"
      description: |
        Validate generated manifest against manifest-schema.yaml:
        - All required sections present
        - Integration contracts valid
        - Quality gates defined
        - SKULL compliance rules referenced
        Scaffolder fails if manifest invalid.
      status: "not_started"
      tests: ["tests/tools/test_scaffolder_manifest.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-SCAFFOLD-001"]
      
    - id: "AC-SCAFFOLD-006"
      name: "Orchestrator Relationship Graph"
      description: |
        Build and maintain orchestrator dependency graph:
        - Who depends on whom
        - Integration triggers
        - Circular dependency detection
        - Impact analysis for changes
        MasterOrchestrator uses this for routing decisions.
      status: "not_started"
      tests: ["tests/tools/test_orchestrator_graph.py"]
      implementation: "src/tools/orchestrator_scaffolder.py"
      dependencies: ["AC-SCAFFOLD-001", "AC-SCAFFOLD-003"]
      
    - id: "AC-SCAFFOLD-007"
      name: "Team Ownership Metadata"
      description: |
        Track team ownership of domain orchestrators:
        - Owner team/person
        - Domain responsibility
        - Maintenance contacts
        - Review requirements
        Enables multi-team collaboration on CORTEX.
      status: "not_started"
      tests: ["tests/tools/test_scaffolder_ownership.py"]
