# ==============================================================================
# Sharpening CORTEX - Executable Test Scenarios
# ==============================================================================
# Purpose: Defines executable test scenarios for validating CORTEX orchestrators
# Version: 1.0.0
# Created: 2026-01-10
# Location: cortex-brain/tier1/sharpening-cortex/test-scenarios.yaml
# ==============================================================================

schema_version: "1.0"
total_scenarios: 18
categories: ["tdd", "planning", "crawler", "sanitization", "onboarding", "integration"]

# ==============================================================================
# TDD-MASTER TEST SCENARIOS
# ==============================================================================
tdd_scenarios:
  
  # Scenario 1: Security Test Generation
  - id: "TDD-SEC-001"
    name: "Generate SQL Injection Tests for BadMonolith"
    ac_ids: ["AC-TDD-005", "AC-TDD-008"]
    application: "BadMonolith"
    
    setup:
      - "Reset BadMonolith to baseline"
      - "Ensure TDD-Master orchestrator is active"
    
    input:
      command: "tdd generate security tests for BadMonolith backend/Program.cs"
      context:
        file: "sharpening-cortex/BadMonolith/backend/Program.cs"
        focus: "SQL injection vulnerabilities"
    
    expected_output:
      test_file: "tests/BadMonolith/test_sql_injection.py"
      test_count: 
        min: 3
        categories: ["sql_injection", "input_validation", "parameterized_queries"]
      
      assertions:
        - "Tests detect hardcoded SQL concatenation"
        - "Tests verify parameterized queries prevent injection"
        - "Tests cover DELETE, INSERT, UPDATE operations"
    
    validation:
      - "Generated tests execute successfully"
      - "Tests fail against BadMonolith (RED phase)"
      - "Tests pass after applying parameterized queries (GREEN phase)"
    
    success_criteria:
      - "AC-TDD-005: Security tests generated"
      - "AC-TDD-008: Edge case coverage ≥ 80%"

  # Scenario 2: Unit Test Generation for Clean Architecture
  - id: "TDD-UNIT-001"
    name: "Generate Service Layer Tests for CleanSolidApp"
    ac_ids: ["AC-TDD-004", "AC-TDD-007"]
    application: "CleanSolidApp"
    
    setup:
      - "Reset CleanSolidApp to baseline"
    
    input:
      command: "tdd generate unit tests for CleanSolidApp backend/Application/Services/TaskService.cs"
      context:
        file: "sharpening-cortex/CleanSolidApp/backend/Application/Services/TaskService.cs"
        focus: "Service layer with repository mocking"
    
    expected_output:
      test_file: "tests/CleanSolidApp/test_task_service.py"
      test_count:
        min: 5
        categories: ["happy_path", "null_handling", "repository_mocking"]
      
      mocking:
        - "ITaskRepository mocked"
        - "Dependency injection validated"
    
    validation:
      - "Tests use pytest-mock or unittest.mock"
      - "Repository abstraction properly mocked"
      - "Tests achieve ≥ 90% code coverage"
    
    success_criteria:
      - "AC-TDD-004: RED→GREEN→REFACTOR cycle complete"
      - "AC-TDD-007: Testability via abstractions"

  # Scenario 3: Integration Test Generation
  - id: "TDD-INT-001"
    name: "Generate API Integration Tests"
    ac_ids: ["AC-TDD-006"]
    application: "BadMonolith"
    
    input:
      command: "tdd generate integration tests for BadMonolith API endpoints"
    
    expected_output:
      test_file: "tests/BadMonolith/test_api_integration.py"
      coverage:
        - "GET /api/tasks (list, filter)"
        - "POST /api/tasks (create)"
        - "PUT /api/tasks (update)"
        - "DELETE /api/tasks (delete)"
      
      test_techniques:
        - "HTTP client testing"
        - "Database state validation"
        - "Error response validation"
    
    success_criteria:
      - "AC-TDD-006: End-to-end validation"

# ==============================================================================
# PLANNING V5 TEST SCENARIOS
# ==============================================================================
planning_scenarios:
  
  # Scenario 4: Refactoring Roadmap
  - id: "PLAN-REFACTOR-001"
    name: "Generate BadMonolith → CleanSolidApp Migration Plan"
    ac_ids: ["AC-PLAN-006", "AC-PLAN-008"]
    application: "BadMonolith + CleanSolidApp"
    
    setup:
      - "Ensure both applications at baseline"
      - "Load before/after comparison data"
    
    input:
      command: "plan refactor BadMonolith to CleanSolidApp architecture"
      context:
        source: "sharpening-cortex/BadMonolith/"
        target: "sharpening-cortex/CleanSolidApp/"
        focus: "Layered architecture migration"
    
    expected_output:
      plan_file: "cortex-brain/tier1/plans/badmonolith-refactor-plan.yaml"
      
      phases:
        - name: "Phase 1: Extract Domain Models"
          duration: "2 days"
          tasks: ["Create Domain/Entities/TaskItem.cs", "Define interfaces"]
        
        - name: "Phase 2: Implement Repository Pattern"
          duration: "3 days"
          tasks: ["Create ITaskRepository", "Implement TaskRepository", "Add EF Core"]
        
        - name: "Phase 3: Create Service Layer"
          duration: "2 days"
          tasks: ["Create TaskService", "Move business logic from Program.cs"]
        
        - name: "Phase 4: API Controllers"
          duration: "2 days"
          tasks: ["Create TasksController", "Remove god-endpoint"]
        
        - name: "Phase 5: Dependency Injection"
          duration: "1 day"
          tasks: ["Configure DI container", "Register services"]
      
      metrics:
        estimated_effort: "10 days"
        risk_level: "MEDIUM"
        complexity_score: 7.5
    
    validation:
      - "Plan follows SOLID principles"
      - "Each phase is independently testable"
      - "Plan includes rollback strategy"
    
    success_criteria:
      - "AC-PLAN-006: Execution plan with phases/tasks"
      - "AC-PLAN-008: SOLID compliance roadmap"

  # Scenario 5: Incremental Modernization Plan
  - id: "PLAN-MODERN-001"
    name: "Incremental Modernization for _Real/payment-processor"
    ac_ids: ["AC-PLAN-007"]
    application: "_Real"
    
    input:
      command: "plan incremental modernization for _Real/payment-processor-modernized"
      context:
        file: "sharpening-cortex/_Real/payment-processor-modernized/"
        constraint: "Cannot stop production, must be incremental"
    
    expected_output:
      plan_file: "cortex-brain/tier1/plans/payment-modernization-plan.yaml"
      
      strategy: "Strangler Fig Pattern"
      phases:
        - "Phase 1: API Gateway Layer (new requests → new service)"
        - "Phase 2: Event-Driven Migration (async processing)"
        - "Phase 3: Database Migration (dual-write pattern)"
        - "Phase 4: Cutover and Legacy Removal"
      
      risk_mitigation:
        - "Feature flags for gradual rollout"
        - "Parallel run for 30 days"
        - "Automated rollback triggers"
    
    success_criteria:
      - "AC-PLAN-007: Incremental steps with zero downtime"

# ==============================================================================
# CRAWLER ORCHESTRATOR TEST SCENARIOS
# ==============================================================================
crawler_scenarios:
  
  # Scenario 6: Anti-Pattern Detection
  - id: "CRAWL-ANTI-001"
    name: "Detect All Anti-Patterns in BadMonolith"
    ac_ids: ["AC-CRAWLER-003", "AC-GRAPH-002"]
    application: "BadMonolith"
    
    setup:
      - "Reset BadMonolith to baseline"
      - "Ensure crawler orchestrator active"
    
    input:
      command: "crawl BadMonolith --level deep --detect anti-patterns"
      context:
        path: "sharpening-cortex/BadMonolith/"
        scan_level: "deep"
    
    expected_output:
      knowledge_graph: "cortex-brain/tier1/knowledge-graph.db"
      
      detected_anti_patterns:
        - "God Class (Program.cs)"
        - "SQL Injection (multiple locations)"
        - "Hardcoded Credentials"
        - "Global Mutable State"
        - "No Separation of Concerns"
        - "Magic Strings"
      
      graph_nodes:
        min_count: 50
        types: ["class", "method", "sql_query", "http_endpoint"]
      
      graph_edges:
        types: ["calls", "depends_on", "exposes_vulnerability"]
    
    validation:
      - "All 28 documented anti-patterns detected"
      - "Knowledge graph is queryable"
      - "Severity scores assigned"
    
    success_criteria:
      - "AC-CRAWLER-003: Code smell detection ≥ 95%"
      - "AC-GRAPH-002: Dependency graph built"

  # Scenario 7: Architecture Pattern Recognition
  - id: "CRAWL-ARCH-001"
    name: "Recognize Clean Architecture in CleanSolidApp"
    ac_ids: ["AC-CRAWLER-003", "AC-ONBOARD-005"]
    application: "CleanSolidApp"
    
    input:
      command: "crawl CleanSolidApp --detect architecture-pattern"
      context:
        path: "sharpening-cortex/CleanSolidApp/"
    
    expected_output:
      architecture_report: "cortex-brain/tier1/architecture-analysis.yaml"
      
      detected_patterns:
        - name: "Layered Architecture"
          confidence: 0.95
          layers: ["API", "Application", "Domain", "Infrastructure"]
        
        - name: "Repository Pattern"
          confidence: 0.92
          files: ["ITaskRepository.cs", "TaskRepository.cs"]
        
        - name: "Dependency Injection"
          confidence: 0.98
          container: "Microsoft.Extensions.DependencyInjection"
      
      quality_score: 8.5
    
    success_criteria:
      - "AC-CRAWLER-003: Architecture detection"
      - "AC-ONBOARD-005: Pattern recognition"

# ==============================================================================
# SANITIZATION TEST SCENARIOS
# ==============================================================================
sanitization_scenarios:
  
  # Scenario 8: Domain Sanitization
  - id: "SAN-DOMAIN-001"
    name: "Sanitize Healthcare Domain to Generic Payment"
    ac_ids: ["AC-SAN-001", "AC-SAN-002"]
    application: "_Real"
    
    setup:
      - "Reset _Real to baseline"
      - "Load sanitization-mappings.json"
    
    input:
      command: "sanitize _Real/RA-Domain using sanitization-mappings.json"
      context:
        source: "sharpening-cortex/_Real/RA-Domain/"
        mappings: "sharpening-cortex/sanitization-mappings.json"
    
    expected_output:
      sanitized_files: "cortex-brain/tier1/sanitized/_Real/"
      
      transformations:
        - "PHI → PII (39 occurrences)"
        - "HIPAA → GDPR (12 occurrences)"
        - "Participant → User (28 occurrences)"
        - "Reimbursement → Payment (47 occurrences)"
      
      validation_report:
        total_replacements: 126
        files_modified: 15
        confidence_score: 0.99
    
    validation:
      - "No PHI terms remain in sanitized output"
      - "Code compiles after sanitization"
      - "Business logic unchanged"
    
    success_criteria:
      - "AC-SAN-001: Pattern-based sanitization"
      - "AC-SAN-002: Validation pipeline"

# ==============================================================================
# ONBOARDING TEST SCENARIOS
# ==============================================================================
onboarding_scenarios:
  
  # Scenario 9: Project Onboarding
  - id: "ONBOARD-PROJ-001"
    name: "Onboard BadMonolith and Build Context"
    ac_ids: ["AC-ONBOARD-001", "AC-ONBOARD-003", "AC-ONBOARD-005"]
    application: "BadMonolith"
    
    input:
      command: "onboard --path sharpening-cortex/BadMonolith/"
    
    expected_output:
      knowledge_graph: "cortex-brain/tier1/knowledge-graph.db"
      project_context: "cortex-brain/tier1/project-context.yaml"
      tech_stack: "cortex-brain/tier1/tech-stack.yaml"
      
      tech_stack_detected:
        backend: ".NET 8"
        frontend: "Angular"
        database: "SQL Server"
        patterns: ["Monolithic", "Anti-Pattern Showcase"]
      
      metrics:
        files_analyzed: 14
        lines_of_code: 343
        complexity_score: 9.2
        maintainability_index: 12
    
    success_criteria:
      - "AC-ONBOARD-001: AST analysis complete"
      - "AC-ONBOARD-003: Tech stack detected"
      - "AC-ONBOARD-005: Architecture patterns identified"

# ==============================================================================
# INTEGRATION TEST SCENARIOS
# ==============================================================================
integration_scenarios:
  
  # Scenario 10: Full Pipeline Test
  - id: "INT-PIPELINE-001"
    name: "Onboard → Crawl → Plan → TDD → Validate"
    ac_ids: ["AC-ORCH-006", "AC-ORCH-007", "AC-TODO-002"]
    application: "BadMonolith"
    
    description: "End-to-end pipeline testing full CORTEX workflow"
    
    steps:
      - step: 1
        action: "Onboard BadMonolith"
        orchestrator: "OnboardingOrchestrator"
        output: "Project context built"
      
      - step: 2
        action: "Crawl for anti-patterns"
        orchestrator: "CrawlerOrchestrator"
        output: "Knowledge graph with 28 anti-patterns"
      
      - step: 3
        action: "Generate refactoring plan"
        orchestrator: "PlanningV5"
        output: "5-phase migration plan"
      
      - step: 4
        action: "Generate security tests"
        orchestrator: "TDD-Master"
        output: "SQL injection test suite"
      
      - step: 5
        action: "Validate plan completeness"
        orchestrator: "MasterOrchestrator"
        output: "DoR certification passed"
    
    validation:
      - "All orchestrators execute successfully"
      - "TodoManager tracks 15+ tasks"
      - "Audit trail complete"
      - "State persisted to progress-tracker.json"
    
    success_criteria:
      - "AC-ORCH-006: Request → Orchestrator routing"
      - "AC-ORCH-007: Required actions generated"
      - "AC-TODO-002: Progress tracking"

# ==============================================================================
# PERFORMANCE BENCHMARKS
# ==============================================================================
performance_benchmarks:
  
  - id: "PERF-BASELINE-001"
    name: "Establish Crawler Performance Baseline"
    application: "BadMonolith"
    
    metrics:
      crawl_time:
        target: "< 5 seconds"
        acceptable: "< 10 seconds"
      
      knowledge_graph_build:
        target: "< 3 seconds"
        acceptable: "< 8 seconds"
      
      anti_pattern_detection:
        target: "< 2 seconds"
        acceptable: "< 5 seconds"
    
    validation:
      - "Performance meets SLA targets"
      - "Memory usage < 500MB"
      - "CPU usage < 80%"

# ==============================================================================
# RESET VALIDATION SCENARIOS
# ==============================================================================
reset_scenarios:
  
  - id: "RESET-ALL-001"
    name: "Validate Reset-All Mechanism"
    application: "All"
    
    steps:
      - "Run test scenario (modify application state)"
      - "Execute reset-all.ps1"
      - "Validate all applications return to baseline"
      - "Re-run same test scenario (should produce identical results)"
    
    success_criteria:
      - "All 5 applications reset successfully"
      - "Execution time < 60 seconds"
      - "Test repeatability confirmed"

