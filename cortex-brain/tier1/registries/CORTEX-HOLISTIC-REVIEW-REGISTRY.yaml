    - lesson: "Backup Accumulation"
      description: |
        Created master-plan-v1.6.0-backup.yaml for 'safety'.
        Over time, it became stale and conflicted with current version.
      prevention: "Git is the backup system. No manual backups needed."
    
    - lesson: "Premature File Splitting"
      description: |
        Attempted to split phases into separate YAML files for 'clarity'.
        Instead created confusion about which file was authoritative.
      prevention: "Centralize data in single SSOT file, not spread across."
    
    - lesson: "Alternative Architectures"
      description: |
        Kept hybrid-approach.yaml 'just in case' for future consideration.
        Created ambiguity about which architecture specification was current.
      prevention: "One architecture decision at a time. Delete alternatives."
    
    - lesson: "Report Explosion"
      description: |
        Created new validation report per session over months.
        Ended up with 44 files, no clear indication of current version.
      prevention: "Archive old reports monthly. Keep latest only."
  
  prevention_mechanisms:
    - mechanism: "Pre-commit Hook"
      enforces: "Block creation of *-backup.yaml, phases/*/*, architecture/*"
      status: "TO BE IMPLEMENTED"
    
    - mechanism: "SSOT Registry"
      enforces: "List of protected files, prohibited patterns"
      location: "ssot-enforcement.yaml"
      status: "EXISTS ✅"
    
    - mechanism: "Documentation"
      enforces: "Clear guidance on SSOT authority hierarchy"
      location: "SSOT-ARCHITECTURE.md"
      status: "EXISTS ✅"
    
    - mechanism: "Code Review"
      enforces: "Catch violations before merge"
      status: "MANUAL (human review)"
    
    - mechanism: "Automated Testing"
      enforces: "Verify code reads from correct SSOT source"
      status: "TO BE IMPLEMENTED"

