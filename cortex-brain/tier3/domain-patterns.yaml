schema_version: "1.0"
governance_tier: 3
category: "KNOWLEDGE_PRACTICES"
precedence: "LOW"

# ==============================================================================
# AUTHENTICATION PATTERNS
# ==============================================================================
authentication:
  jwt:
    description: "JSON Web Token authentication pattern"
    use_when:
      - "Stateless authentication required"
      - "API-to-API communication"
      - "Mobile app backends"
    implementation:
      token_structure:
        header: ["alg", "typ"]
        payload: ["sub", "iat", "exp", "roles"]
        signature: "HMAC-SHA256 or RS256"
      best_practices:
        - "Keep tokens short-lived (15-60 minutes)"
        - "Use refresh tokens for extended sessions"
        - "Store in httpOnly cookies (not localStorage)"
        - "Validate signature on every request"
        - "Include minimum necessary claims"
      security_tests:
        - "test_expired_token_rejected"
        - "test_invalid_signature_rejected"
        - "test_missing_claims_rejected"
        - "test_token_not_in_url"
        
  oauth2:
    description: "OAuth 2.0 authorization framework"
    flows:
      authorization_code:
        use_when: "Server-side web apps"
        steps: ["authorize", "token", "refresh"]
      client_credentials:
        use_when: "Machine-to-machine"
        steps: ["token"]
      pkce:
        use_when: "Mobile/SPA apps"
        steps: ["authorize with code_verifier", "token with code_challenge"]
    best_practices:
      - "Always use HTTPS"
      - "Validate redirect URIs exactly"
      - "Use state parameter to prevent CSRF"
      - "Use PKCE for public clients"
      
  session:
    description: "Traditional session-based authentication"
    use_when:
      - "Server-rendered applications"
      - "Need to invalidate sessions server-side"
    implementation:
      storage: ["Redis", "database", "memory"]
      best_practices:
        - "Regenerate session ID after login"
        - "Set secure, httpOnly, sameSite cookies"
        - "Implement session timeout"
        - "Store minimal data in session"

# ==============================================================================
# DATABASE PATTERNS
# ==============================================================================
database:
  connection_pooling:
    description: "Reuse database connections for performance"
    implementation:
      python:
        sqlalchemy: "create_engine(pool_size=5, max_overflow=10)"
        asyncpg: "asyncpg.create_pool(min_size=5, max_size=20)"
      best_practices:
        - "Set pool size based on workload"
        - "Implement connection health checks"
        - "Handle connection timeouts gracefully"
        - "Monitor pool exhaustion"
        
  transactions:
    description: "ACID transaction handling"
    patterns:
      unit_of_work:
        description: "Group operations into single transaction"
        implementation: "Context manager with commit/rollback"
      saga:
        description: "Distributed transactions with compensation"
        use_when: "Microservices with separate databases"
    best_practices:
      - "Keep transactions short"
      - "Avoid long-running transactions"
      - "Use appropriate isolation level"
      - "Handle deadlocks with retry"
      
  migrations:
    description: "Database schema version control"
    tools: ["Alembic", "Django migrations", "Flyway"]
    best_practices:
      - "Never modify existing migrations"
      - "Always include rollback"
      - "Test migrations on copy of production"
      - "Use transactional DDL when available"
      
  query_optimization:
    patterns:
      - name: "N+1 prevention"
        solution: "Use eager loading/joins"
        test: "Assert query count in tests"
      - name: "Index usage"
        solution: "Create indexes for WHERE/JOIN columns"
        test: "EXPLAIN ANALYZE queries"
      - name: "Pagination"
        solution: "Use LIMIT/OFFSET or cursor-based"
        test: "Test with large datasets"

# ==============================================================================
# API PATTERNS
# ==============================================================================
api:
  rest:
    description: "RESTful API design patterns"
    conventions:
      resources:
        - "Use nouns, not verbs (GET /users, not GET /getUsers)"
        - "Use plural names (/users, not /user)"
        - "Nest related resources (/users/{id}/orders)"
      http_methods:
        GET: "Retrieve resource(s)"
        POST: "Create resource"
        PUT: "Replace resource"
        PATCH: "Partial update"
        DELETE: "Remove resource"
      status_codes:
        200: "OK"
        201: "Created"
        204: "No Content"
        400: "Bad Request"
        401: "Unauthorized"
        403: "Forbidden"
        404: "Not Found"
        409: "Conflict"
        422: "Unprocessable Entity"
        500: "Internal Server Error"
    best_practices:
      - "Version APIs (/v1/users)"
      - "Use consistent naming (camelCase or snake_case)"
      - "Return appropriate status codes"
      - "Include pagination for collections"
      - "Support filtering, sorting, field selection"
      
  error_handling:
    description: "Consistent API error responses"
    format:
      error:
        code: "VALIDATION_ERROR"
        message: "Human readable message"
        details: []
        request_id: "correlation_id"
    patterns:
      - "Return problem+json content type"
      - "Include request ID for debugging"
      - "Never expose stack traces"
      - "Log full error server-side"
      
  rate_limiting:
    description: "Protect APIs from abuse"
    algorithms:
      token_bucket: "Smooth rate limiting with bursts"
      sliding_window: "Accurate rate counting"
      fixed_window: "Simple but allows bursts at boundaries"
    headers:
      - "X-RateLimit-Limit"
      - "X-RateLimit-Remaining"
      - "X-RateLimit-Reset"

# ==============================================================================
# SECURITY PATTERNS
# ==============================================================================
security:
  input_validation:
    description: "Validate all untrusted input"
    patterns:
      whitelist:
        description: "Only allow known-good values"
        use_for: ["enums", "options", "IDs"]
      schema_validation:
        description: "Validate against JSON schema"
        use_for: ["complex objects", "API payloads"]
      sanitization:
        description: "Remove/escape dangerous characters"
        use_for: ["HTML output", "SQL queries", "shell commands"]
    security_tests:
      - "test_sql_injection_blocked"
      - "test_xss_escaped"
      - "test_path_traversal_blocked"
      - "test_command_injection_blocked"
      
  csrf_protection:
    description: "Cross-Site Request Forgery prevention"
    methods:
      - "Synchronizer token pattern"
      - "Double submit cookie"
      - "SameSite cookie attribute"
    implementation:
      - "Generate unique token per session"
      - "Validate token on state-changing requests"
      - "Use SameSite=Strict for cookies"
      
  secrets_management:
    description: "Secure handling of sensitive data"
    patterns:
      - "Never commit secrets to git"
      - "Use environment variables"
      - "Use secret managers (Vault, AWS Secrets Manager)"
      - "Rotate secrets regularly"
      - "Audit secret access"

# ==============================================================================
# CACHING PATTERNS
# ==============================================================================
caching:
  strategies:
    cache_aside:
      description: "Application manages cache"
      flow: "Check cache → Miss? → Load from DB → Store in cache"
      use_when: "Read-heavy, can tolerate stale data"
      
    write_through:
      description: "Write to cache and DB synchronously"
      flow: "Write to cache → Write to DB"
      use_when: "Need consistency, tolerate write latency"
      
    write_behind:
      description: "Write to cache, async write to DB"
      flow: "Write to cache → Async write to DB"
      use_when: "Write-heavy, can tolerate potential data loss"
      
  invalidation:
    strategies:
      - "TTL (Time To Live)"
      - "Event-driven invalidation"
      - "Version-based invalidation"
    best_practices:
      - "Prefer TTL for simplicity"
      - "Use short TTLs initially, tune based on data"
      - "Have fallback when cache fails"

# ==============================================================================
# ASYNC PATTERNS
# ==============================================================================
async_patterns:
  message_queues:
    description: "Decouple components with async messaging"
    use_cases:
      - "Background job processing"
      - "Event-driven architectures"
      - "Load leveling"
    implementations:
      - "Redis pub/sub"
      - "RabbitMQ"
      - "AWS SQS"
      - "Kafka"
    patterns:
      - "Idempotent consumers"
      - "Dead letter queues"
      - "Retry with backoff"
      
  async_await:
    description: "Non-blocking I/O operations"
    use_when:
      - "I/O bound operations"
      - "Multiple concurrent external calls"
    best_practices:
      - "Don't block the event loop"
      - "Use asyncio.gather for parallel calls"
      - "Set appropriate timeouts"
      - "Handle cancellation properly"

# ==============================================================================
# END OF DOMAIN PATTERNS
# ==============================================================================
