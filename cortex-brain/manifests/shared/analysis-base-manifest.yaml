# Analysis Base Manifest (Tier 2C)
# Foundation for ALL analysis-category orchestrators
#
# Purpose: Eliminate analysis pattern redundancy (discovery, AST, reporting)
# Usage: Analysis orchestrators inherit from this
# Inheritance Chain: base-orchestrator → analysis-base → specific orchestrator
#
# Version: 1.0.0
# Author: Asif Hussain
# Created: 2025-12-22 (Week 15 Day 2)
# Status: ACTIVE
# Used By: Intelligent Dashboard, CORTEX Lens, Technical Documentation

inherits_from: "base-orchestrator-manifest.yaml"

# ========================================
# Analysis-Specific Metadata
# ========================================

metadata:
  category: "analysis"
  deployment_tier: "user"
  
  analysis_capabilities:
    supports_code_discovery: true
    supports_ast_analysis: true
    supports_dependency_analysis: true
    supports_interactive_reporting: true
    supports_caching: true

# ========================================
# Discovery Framework
# ========================================

discovery:
  enabled: true
  
  scan_patterns:
    - pattern: "repository_structure"
      method: "recursive_file_scan"
      exclude_patterns:
        - "node_modules/"
        - "venv/"
        - "bin/"
        - "obj/"
        - ".git/"
        - "__pycache__/"
    
    - pattern: "programming_languages"
      method: "file_extension_analysis"
      supported_languages:
        - python: [".py"]
        - javascript: [".js", ".jsx", ".ts", ".tsx"]
        - csharp: [".cs"]
        - java: [".java"]
        - go: [".go"]
        - rust: [".rs"]
    
    - pattern: "frameworks_and_libraries"
      method: "package_file_analysis"
      config_files:
        - "package.json"      # JavaScript/Node.js
        - "requirements.txt"  # Python
        - "*.csproj"          # C#
        - "pom.xml"           # Java/Maven
        - "build.gradle"      # Java/Gradle
        - "Cargo.toml"        # Rust
        - "go.mod"            # Go
    
    - pattern: "entry_points"
      method: "pattern_matching"
      patterns:
        - "main.py"
        - "Program.cs"
        - "app.js"
        - "index.js"
        - "Application.java"
        - "main.go"
        - "main.rs"
  
  output:
    format: "structured_json"
    save_to_file: true
    file_path: "cortex-brain/documents/analysis/{orchestrator_name}-discovery-{timestamp}.json"

# ========================================
# AST Analysis Framework
# ========================================

ast_analysis:
  enabled: true
  
  parsers:
    - language: "python"
      parser: "ast"  # Built-in Python AST
      confidence: 0.90
      capabilities:
        - "function_extraction"
        - "class_extraction"
        - "import_analysis"
        - "docstring_extraction"
        - "complexity_calculation"
    
    - language: "javascript"
      parser: "esprima"  # JavaScript parser
      confidence: 0.85
      capabilities:
        - "function_extraction"
        - "class_extraction"
        - "module_dependency_analysis"
        - "jsdoc_extraction"
    
    - language: "typescript"
      parser: "typescript"  # TypeScript compiler API
      confidence: 0.85
      capabilities:
        - "type_inference"
        - "interface_extraction"
        - "decorator_analysis"
    
    - language: "csharp"
      parser: "tree-sitter"  # Tree-sitter for C#
      confidence: 0.80
      capabilities:
        - "class_extraction"
        - "namespace_analysis"
        - "xml_doc_extraction"
  
  caching:
    enabled: true
    strategy: "LRU"
    max_cache_size: 100
    invalidation: "file_hash_change"
    cache_location: "cortex-brain/cache/ast/"
  
  parallelization:
    enabled: true
    method: "ProcessPoolExecutor"
    max_workers: 4
    chunk_size: 10  # Files per worker

# ========================================
# Code Quality Analysis
# ========================================

code_quality:
  enabled: true
  
  metrics:
    - metric: "cyclomatic_complexity"
      threshold_warning: 10
      threshold_critical: 15
    
    - metric: "cognitive_complexity"
      threshold_warning: 15
      threshold_critical: 25
    
    - metric: "function_length"
      threshold_warning: 50
      threshold_critical: 100
      unit: "lines"
    
    - metric: "class_size"
      threshold_warning: 300
      threshold_critical: 500
      unit: "lines"
    
    - metric: "parameter_count"
      threshold_warning: 5
      threshold_critical: 8
    
    - metric: "nesting_depth"
      threshold_warning: 4
      threshold_critical: 6
  
  code_smells:
    detect:
      - "long_methods"
      - "long_parameter_lists"
      - "complex_conditionals"
      - "deep_nesting"
      - "magic_numbers"
      - "god_classes"
      - "duplicate_code"
      - "dead_code"
    
    output_format: "markdown_report"
    include_recommendations: true
    prioritize_by_severity: true

# ========================================
# Dependency Analysis
# ========================================

dependency_analysis:
  enabled: true
  
  graph_types:
    - type: "import_dependencies"
      direction: "forward"  # forward|backward|both
      include_external: true
      max_depth: 10
    
    - type: "class_inheritance"
      direction: "both"
      include_interfaces: true
      max_depth: 5
    
    - type: "method_call_chains"
      direction: "forward"
      max_depth: 3
      include_external: false
  
  analysis:
    detect_circular_dependencies: true
    identify_unused_imports: true
    find_missing_dependencies: true
    calculate_coupling_metrics: true
  
  visualization:
    format: "d3_force_graph"  # d3_force_graph|graphviz|mermaid
    interactive: true
    save_to_file: true
    file_path: "cortex-brain/documents/analysis/{orchestrator_name}-dependency-graph-{timestamp}.html"

# ========================================
# Documentation Extraction
# ========================================

documentation_extraction:
  enabled: true
  
  extract_types:
    - type: "docstrings"
      languages: ["python"]
      format: "google_style|numpy_style|sphinx_style"
      rank_by_quality: true
    
    - type: "jsdoc"
      languages: ["javascript", "typescript"]
      include_type_annotations: true
    
    - type: "xml_doc"
      languages: ["csharp"]
      include_param_descriptions: true
    
    - type: "javadoc"
      languages: ["java"]
      include_examples: true
  
  quality_ranking:
    enabled: true
    criteria:
      - factor: "length"
        weight: 0.20
      - factor: "vocabulary_richness"
        weight: 0.25
      - factor: "technical_keywords"
        weight: 0.20
      - factor: "structure"
        weight: 0.15
      - factor: "code_examples"
        weight: 0.10
      - factor: "type_information"
        weight: 0.10
  
  output:
    format: "structured_json"
    include_rankings: true
    save_to_file: true

# ========================================
# Interactive Reporting
# ========================================

interactive_reporting:
  enabled: true
  
  report_types:
    - type: "code_overview"
      format: "html"
      includes:
        - "language_distribution"
        - "file_structure_tree"
        - "complexity_heatmap"
        - "dependency_graph"
    
    - type: "quality_dashboard"
      format: "html"
      includes:
        - "code_quality_metrics"
        - "code_smell_inventory"
        - "test_coverage_visualization"
        - "trend_analysis"
    
    - type: "documentation_portal"
      format: "html"
      includes:
        - "api_reference"
        - "class_diagrams"
        - "sequence_diagrams"
        - "search_functionality"
  
  visualization_library: "d3.js"  # d3.js|chart.js|plotly
  
  interactivity:
    zoom: true
    pan: true
    filter: true
    search: true
    export: true
    tooltips: true

# ========================================
# Use Case Inference
# ========================================

use_case_inference:
  enabled: true
  
  inference_methods:
    - method: "api_endpoint_extraction"
      patterns:
        python:
          - "@app.route"
          - "@router.get/post/put/delete"
          - "class.*APIView"
        javascript:
          - "app.get/post/put/delete"
          - "router.route"
          - "express.Router"
        csharp:
          - "[HttpGet]"
          - "[HttpPost]"
          - "[Route]"
      confidence: 0.95
    
    - method: "controller_action_analysis"
      patterns:
        - "*Controller"
        - "*Handler"
        - "*Service"
      confidence: 0.90
    
    - method: "service_method_analysis"
      patterns:
        - "class *Service"
        - "class *Manager"
        - "class *Repository"
      confidence: 0.85
  
  output:
    format: "markdown"
    group_by: "feature_area"
    include_confidence_scores: true

# ========================================
# Performance Optimization
# ========================================

performance:
  timeout_default_minutes: 45  # Override base (analysis can be slow)
  
  optimization_strategies:
    - strategy: "incremental_analysis"
      description: "Only analyze changed files"
      enabled: true
    
    - strategy: "caching"
      description: "Cache AST and analysis results"
      enabled: true
    
    - strategy: "parallel_processing"
      description: "Process files in parallel"
      enabled: true
    
    - strategy: "lazy_loading"
      description: "Load analysis results on demand"
      enabled: true
  
  large_codebase_handling:
    threshold_files: 1000
    threshold_loc: 100000
    strategies:
      - "sample_analysis"
      - "incremental_reporting"
      - "streaming_results"

# ========================================
# Integrations (Analysis-Specific)
# ========================================

integrations:
  refactoring_intelligence:
    enabled: true
    trigger: "after_code_smell_detection"
    integration_type: "optional"
  
  dashboard_generator:
    enabled: true
    trigger: "after_analysis_complete"
    integration_type: "required"
  
  documentation_generator:
    enabled: true
    trigger: "after_documentation_extraction"
    integration_type: "optional"

# ========================================
# Output Formats
# ========================================

output_formats:
  supported:
    - format: "json"
      use_case: "programmatic_access"
    
    - format: "markdown"
      use_case: "human_readable_reports"
    
    - format: "html"
      use_case: "interactive_dashboards"
    
    - format: "yaml"
      use_case: "configuration_files"
    
    - format: "csv"
      use_case: "metrics_export"
  
  default: "markdown"

# ========================================
# Changelog
# ========================================

changelog:
  - version: "1.0.0"
    date: "2025-12-22"
    changes:
      - "Initial analysis base manifest"
      - "Discovery and AST frameworks defined"
      - "Code quality analysis patterns"
      - "Dependency analysis support"
      - "Interactive reporting capabilities"
      - "Use case inference methods"
