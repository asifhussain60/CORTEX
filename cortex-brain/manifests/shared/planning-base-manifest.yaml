# Planning Base Manifest (Tier 2A)
# Foundation for ALL planning-category orchestrators
#
# Purpose: Eliminate planning pattern redundancy (DoR/DoD, complexity, quality gates)
# Usage: Planning orchestrators inherit from this
# Inheritance Chain: base-orchestrator → planning-base → specific orchestrator
#
# Version: 1.0.0
# Author: Asif Hussain
# Created: 2025-12-22 (Week 15 Day 2)
# Status: ACTIVE
# Used By: Planning System 4.0, ADO Planning, TDD v4

inherits_from: "base-orchestrator-manifest.yaml"

# ========================================
# Planning-Specific Metadata
# ========================================

metadata:
  category: "planning"
  deployment_tier: "cortex"
  
  planning_capabilities:
    supports_dor_dod: true
    supports_complexity_analysis: true
    supports_quality_gates: true
    supports_autonomous_execution: true
    supports_incremental_planning: true

# ========================================
# Definition of Ready (DoR)
# Standard template for planning orchestrators
# ========================================

definition_of_ready:
  feature_requirements:
    - requirement: "Feature name defined"
      validation: "name is not null and len(name) > 3"
      mandatory: true
    
    - requirement: "Feature description provided"
      validation: "description is not null and len(description) >= 50"
      mandatory: true
    
    - requirement: "Acceptance criteria defined"
      validation: "len(acceptance_criteria) >= 3"
      mandatory: true
    
    - requirement: "Target release or timeline specified"
      validation: "timeline is not null"
      mandatory: false
  
  technical_prerequisites:
    - prerequisite: "No conflicting active plans"
      validation_method: "check_active_plans"
      blocking: true
    
    - prerequisite: "Dependencies identified"
      validation_method: "analyze_dependencies"
      blocking: false
    
    - prerequisite: "Technology stack validated"
      validation_method: "validate_tech_stack"
      blocking: false
  
  stakeholder_approvals:
    - stakeholder: "Technical Lead"
      approval_required: true
      approval_items:
        - "Technical approach"
        - "Architecture decisions"
        - "Resource allocation"
  
  approval_workflow:
    enabled: true
    require_user_confirmation: true
    allow_skip_with_justification: false

# ========================================
# Definition of Done (DoD)
# Standard template for planning orchestrators
# ========================================

definition_of_done:
  code_quality:
    - criterion: "All code written and committed"
      validation: "git_status_clean"
      mandatory: true
    
    - criterion: "Code reviewed and approved"
      validation: "code_review_completed"
      mandatory: true
    
    - criterion: "No code smells introduced"
      validation: "complexity_analysis_passed"
      mandatory: true
  
  testing:
    - criterion: "Unit tests written"
      validation: "test_files_exist"
      mandatory: true
    
    - criterion: "All tests passing"
      validation: "test_pass_rate >= 95"
      mandatory: true
    
    - criterion: "Test coverage acceptable"
      validation: "coverage_percentage >= 80"
      mandatory: true
    
    - criterion: "TDD workflow followed"
      validation: "red_green_refactor_validated"
      mandatory: true
  
  documentation:
    - criterion: "Code documented"
      validation: "docstrings_present"
      mandatory: true
    
    - criterion: "Architecture diagrams updated"
      validation: "diagrams_updated"
      mandatory: false
    
    - criterion: "User guide updated"
      validation: "user_docs_updated"
      mandatory: false
  
  deployment:
    - criterion: "Feature deployed to target environment"
      validation: "deployment_successful"
      mandatory: true
    
    - criterion: "Release notes updated"
      validation: "changelog_updated"
      mandatory: true

# ========================================
# Complexity Analysis
# ========================================

complexity_analysis:
  enabled: true
  
  dimensions:
    - dimension: "code_impact"
      weight: 0.30
      factors:
        - "lines_of_code_changed"
        - "files_affected"
        - "modules_touched"
    
    - dimension: "risk_level"
      weight: 0.25
      factors:
        - "breaking_changes"
        - "dependency_modifications"
        - "database_schema_changes"
    
    - dimension: "domain_complexity"
      weight: 0.25
      factors:
        - "business_logic_complexity"
        - "algorithm_complexity"
        - "integration_points"
    
    - dimension: "integration_scope"
      weight: 0.20
      factors:
        - "external_systems_affected"
        - "api_changes"
        - "cross_service_dependencies"
  
  thresholds:
    low: 0.30      # Score < 0.30 = LOW complexity
    medium: 0.60   # Score 0.30-0.60 = MEDIUM complexity
    high: 0.60     # Score > 0.60 = HIGH complexity
  
  routing:
    low:
      approach: "inline_validation_plan"
      planning_required: true
      plan_type: "inline"
      estimated_duration_minutes: 10
    
    medium:
      approach: "feature_plan_single_md"
      planning_required: true
      plan_type: "markdown"
      estimated_duration_minutes: 60
    
    high:
      approach: "nested_plan_master_plus_subplans"
      planning_required: true
      plan_type: "nested_markdown"
      estimated_duration_hours: 8

# ========================================
# Quality Gates
# ========================================

quality_gates:
  - gate_id: "GATE-DoR"
    name: "Definition of Ready Validation"
    gate_type: "validation"
    trigger_point: "before_planning_starts"
    blocking: true
    validation_criteria:
      - "All DoR items validated"
      - "User approval obtained"
    bypass_conditions: []
  
  - gate_id: "GATE-COMPLEXITY"
    name: "Complexity Analysis"
    gate_type: "validation"
    trigger_point: "after_dor_before_plan_generation"
    blocking: false
    validation_criteria:
      - "Complexity score calculated"
      - "Routing decision made"
  
  - gate_id: "GATE-REVIEW"
    name: "Contextual Review"
    gate_type: "approval"
    trigger_point: "before_planning_starts"
    blocking: false
    validation_criteria:
      - "Review orchestrator executed"
      - "Critical findings addressed"
  
  - gate_id: "GATE-DoD"
    name: "Definition of Done Validation"
    gate_type: "validation"
    trigger_point: "before_plan_completion"
    blocking: true
    validation_criteria:
      - "All DoD items validated"
      - "Tests passing"
      - "Documentation complete"

# ========================================
# Integrations (Planning-Specific)
# ========================================

integrations:
  contextual_review_orchestrator:
    enabled: true
    trigger: "before_planning_starts"
    integration_type: "required"
    expected_behavior: "Run architectural review, use score in plan metadata"
  
  tdd_orchestrator:
    enabled: true
    trigger: "during_implementation_phase"
    integration_type: "required"
    expected_behavior: "Enforce RED→GREEN→REFACTOR workflow"
  
  git_checkpoint_orchestrator:
    enabled: true
    trigger: "after_each_phase"
    integration_type: "required"
    expected_behavior: "Create git checkpoint with standardized commit message"

# ========================================
# Session Management
# ========================================

session_management:
  enabled: true
  persistence_backend: "sqlite"
  session_id_format: "{orchestrator_name}-{timestamp}"
  checkpoint_frequency: "per_phase"
  recovery_enabled: true
  
  state_machine:
    enabled: true
    states:
      - INITIALIZED
      - VALIDATING_DOR
      - ANALYZING_COMPLEXITY
      - GENERATING_PLAN
      - EXECUTING
      - VALIDATING_DOD
      - COMPLETED
      - FAILED
    
    transitions:
      - from: INITIALIZED
        to: VALIDATING_DOR
        trigger: "start_planning"
      
      - from: VALIDATING_DOR
        to: ANALYZING_COMPLEXITY
        trigger: "dor_validated"
      
      - from: ANALYZING_COMPLEXITY
        to: GENERATING_PLAN
        trigger: "complexity_analyzed"
      
      - from: GENERATING_PLAN
        to: EXECUTING
        trigger: "plan_approved"
      
      - from: EXECUTING
        to: VALIDATING_DOD
        trigger: "execution_complete"
      
      - from: VALIDATING_DOD
        to: COMPLETED
        trigger: "dod_validated"
      
      - from: "*"
        to: FAILED
        trigger: "error_occurred"

# ========================================
# Autonomous Execution
# ========================================

autonomous_execution:
  enabled: true
  
  modes:
    supervised:
      description: "User approves each phase transition (default)"
      auto_validate: true
      auto_commit: false
      auto_transition: false
      self_healing: false
      user_approval_required: true
    
    autonomous:
      description: "Full E2E execution with self-healing"
      auto_validate: true
      auto_commit: true
      auto_transition: true
      self_healing: true
      escalation_threshold: 3  # Escalate after 3 failures
      user_approval_required: false
  
  self_healing:
    enabled: true
    max_retry_attempts: 3
    strategies:
      - "regenerate_with_feedback"
      - "simplify_approach"
      - "escalate_to_user"

# ========================================
# Progress Tracking
# ========================================

progress_tracking:
  enabled: true
  visual_rendering: true
  
  metrics:
    - metric: "phase_timing"
      track_start: true
      track_end: true
      format: "human_readable_duration"
    
    - metric: "token_consumption"
      track_per_phase: true
      aggregate_total: true
    
    - metric: "task_completion"
      format: "ratio"  # e.g., "5/10 tasks complete"
    
    - metric: "progress_percentage"
      calculation: "completed_phases / total_phases * 100"
  
  rendering:
    format: "markdown_table"
    include_status_icons: true
    include_duration: true
    include_tokens: true

# ========================================
# Learning Integration
# ========================================

learning:
  enabled: true
  
  capture_patterns:
    - "successful_planning_approaches"
    - "complexity_estimation_accuracy"
    - "common_pitfalls_avoided"
    - "effective_quality_gates"
  
  storage:
    tier2_knowledge_graph: true
    tier1_working_memory: false
  
  apply_learning:
    use_historical_context: true
    adapt_complexity_thresholds: true
    improve_dor_dod_templates: true

# ========================================
# Changelog
# ========================================

changelog:
  - version: "1.0.0"
    date: "2025-12-22"
    changes:
      - "Initial planning base manifest"
      - "DoR/DoD templates defined"
      - "Complexity analysis patterns added"
      - "Quality gates standardized"
      - "Autonomous execution support"
