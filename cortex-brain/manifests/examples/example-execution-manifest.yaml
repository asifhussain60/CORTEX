# Example Execution Orchestrator Manifest
# Demonstrates inheritance from execution-base-manifest.yaml
#
# Purpose: Test manifest inheritance with execution orchestrator
# Inheritance: base-orchestrator → execution-base → this manifest
#
# Version: 1.0.0
# Created: 2025-12-22

inherits_from: "../shared/execution-base-manifest.yaml"

# ========================================
# Override/Extend Metadata
# ========================================

metadata:
  orchestrator_name: "example_execution_orchestrator"
  version: "1.0.0"
  description: "Example execution orchestrator demonstrating inheritance patterns"
  last_updated: "2025-12-22"
  
  # Override deployment tier
  deployment_tier: "admin"  # Override default "user" from base
  
  # Add custom fields
  created_by: "Asif Hussain"
  example_purpose: "Demonstrate execution pattern inheritance"

# ========================================
# Override Error Handling
# ========================================

error_handling:
  strategy: "continue_on_error"  # Override default "fail_fast"
  
  retry_policy:
    enabled: true
    max_retries: 5  # Override default 3
    backoff_strategy: "exponential"

# ========================================
# Custom Phases
# ========================================

phases:
  - id: "exec_phase_1"
    name: "Example Execution Phase"
    description: "Custom execution phase"
    blocking: true
    timeout_minutes: 15
    git_checkpoint: true
    outputs:
      - "execution-report.md"
    validation:
      success_criteria:
        - "Execution completed"
        - "No errors"

# ========================================
# Custom Features
# ========================================

custom_features:
  example_feature: "Specific to this orchestrator"
  example_flag: true
