schema_version: '1.0'
title: 'CORTEX Duplicate Module Detection & Consolidation Manifest'
date: '2026-01-12'
purpose: 'Identify redundant implementations across src/ and scripts/ for consolidation'

# Critical duplicates that block execution
critical_duplicates:
  # BLOCKER: Audit logger split between two locations
  - category: 'audit_infrastructure'
    severity: 'CRITICAL'
    impact: 'Execution failures, import resolution errors'
    modules:
      - name: 'audit_logger'
        primary: 'src/orchestrators/audit_logger.py'
        primary_stats:
          size_bytes: 1132
          lines: 1132
          classes: ['EnterpriseAuditLogger', 'AuditEntry', 'AuditLevel', 'AuditCategory']
          imports: 9
        duplicate: 'src/infrastructure/enhanced_audit_logger.py'
        duplicate_stats:
          size_bytes: 1067
          lines: 1067
          classes: ['EnhancedAuditLogger', 'AuditVacuum', 'ACImplementationTracker']
          imports: 4
        recommendation: 'DELETE src/infrastructure/enhanced_audit_logger.py. Consolidate all needed classes into primary.'
        action_needed:
          - 'Merge AuditVacuum and ACImplementationTracker from enhanced version into primary'
          - 'Update 4 broken imports to use src.orchestrators.audit_logger'
          - 'Delete src/infrastructure/enhanced_audit_logger.py'

