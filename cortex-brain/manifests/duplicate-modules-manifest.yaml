consolidation_strategy:
  phase_1_critical: |
    Fix blocker: Consolidate audit logger split
    1. Merge AuditVacuum + ACImplementationTracker into src/orchestrators/audit_logger.py
    2. Update 4 broken imports (audit_config, audit_vacuum, brittleness_validator, audit_tools)
    3. Delete src/infrastructure/enhanced_audit_logger.py
    4. Verify: python3 -m src.main "implement AC-ORCH-001"

  phase_2_high_impact: |
    Consolidate high-severity duplicates (master, state, todo, scaffolder)
    1. Merge master_orchestrator versions (keep primary from src/orchestrators/)
    2. Consolidate state_manager (keep database layer as primary)
    3. Consolidate todo (TodoOrchestrator + TodoManager merger)
    4. Keep scaffolder in tools/ as primary reference

  phase_3_medium_impact: |
    Consolidate medium-severity (checkpoint, test_executor, detectors, vacuum)
    1. Consolidate checkpoint_manager (feature merge)
    2. Delete infrastructure/test_executor (redundant to tools)
    3. Consolidate detectors (vacuum as primary)
    4. Delete scripts/vacuum_orchestrator (reference src version)

  phase_4_cleanup: |
    Base orchestrator consolidation and final audit
    1. Merge base_orchestrator_v4 into base_orchestrator
    2. Delete all v4 suffixes
    3. Full import audit
    4. Run comprehensive test suite

centralization_mechanism:
  description: 'Unified toolkit registry for tools and orchestrators'
  location: 'cortex-brain/manifests/unified-toolkit-registry.yaml'
  structure:
    - section: 'tools'
      primary_location: 'src/tools/'
      subdirectories:
        - 'orchestration/'
        - 'validation/'
        - 'utilities/'
    - section: 'orchestrators'
      primary_location: 'src/orchestrators/'
      subdirectories:
        - 'core/' (MasterOrchestrator, TodoOrchestrator, TDD-Master)
        - 'domain/' (ADO, Investigation, Sanitization, Crawlers)
        - 'base/' (BaseOrchestrator, interfaces)
        - 'middleware/' (governance, validation)
    - section: 'infrastructure'
      primary_location: 'src/infrastructure/'
      subdirectories:
        - 'persistence/' (state_manager, database)
        - 'audit/' (unified_audit_logger)
        - 'governance/' (rules, merging)

mcp_toolkit_spec:
  title: 'Duplicate Detection & Consolidation Toolkit'
  description: 'Exposed via MCP for autonomous housekeeping orchestrator'
  
  tools:
    - name: 'scan_duplicates'
      description: 'Scan codebase for duplicate/variant module patterns'
      parameters:
        - 'scope: str (default: "src/,scripts/")'
        - 'patterns: List[str] (custom patterns to match)'
        - 'format: str (json|yaml)'
      output: 'Structured manifest with duplicate groups'
    
    - name: 'analyze_duplicates'
      description: 'Deep-dive analysis of duplicate set'
      parameters:
        - 'module_name: str (e.g., "audit_logger")'
        - 'analysis_type: str (feature_diff|import_count|test_coverage|size_comparison)'
      output: 'Detailed comparison with merge recommendations'
    
    - name: 'generate_consolidation_plan'
      description: 'Generate ordered consolidation tasks with dependencies'
      parameters:
        - 'duplicates: List[str] (module names to consolidate)'
        - 'priority: str (critical|high|medium|low)'
        - 'preserve_functionality: bool (default: true)'
      output: 'Ordered task list with merge scripts'
    
    - name: 'consolidate_module'
      description: 'Execute consolidation for a single module'
      parameters:
        - 'module_name: str'
        - 'keep_primary: str (path to primary version)'
        - 'merge_features_from: List[str] (paths to merge from)'
        - 'delete_duplicates: bool (default: true)'
        - 'update_imports: bool (default: true)'
      output: 'Consolidation report with import audit'
    
    - name: 'validate_consolidation'
      description: 'Verify consolidation succeeded'
      parameters:
        - 'module_name: str'
      output: 'Pass/fail with detailed validation report'
    
    - name: 'update_toolkit_registry'
      description: 'Update centralized toolkit manifest'
      parameters:
        - 'action: str (add|remove|update)'
        - 'tool_name: str'
        - 'metadata: Dict'
      output: 'Updated registry'

integration_points:
  housekeeping_orchestrator: |
    New capability: AC-CLEAN-004: Duplicate Module Detection & Consolidation
    - Runs scan_duplicates on scheduled basis
    - Generates consolidation plans
    - Executes phase-by-phase consolidation
    - Updates toolkit registry
    - Runs validation tests after each consolidation

  workflow:
    step_1: 'Invoke: scan_duplicates(scope="src/,scripts/")'
    step_2: 'Compare output to duplicate-modules-manifest.yaml'
    step_3: 'For CRITICAL duplicates: generate_consolidation_plan(priority="critical")'
    step_4: 'For each module: consolidate_module(...) + validate_consolidation(...)'
    step_5: 'Run full test suite to verify no regressions'
    step_6: 'Update toolkit registry with final structure'

migration_order:
  1_critical:
    - 'audit_logger (BLOCKS execution)'
  2_orchestration_core:
    - 'master_orchestrator'
    - 'todo_management'
    - 'state_manager'
  3_execution_support:
    - 'scaffolder'
    - 'checkpoint_manager'
    - 'test_executor'
  4_cleanup_utilities:
    - 'duplicate_detector'
    - 'orphan_detector'
    - 'vacuum_orchestrator'
  5_final_consolidation:
    - 'base_orchestrator'
    - 'mcp_decorator'

expected_impact:
  lines_of_code_reduction: '~15%'
  duplicate_modules_eliminated: '11'
  files_deleted: '11'
  import_consolidation_points: '4'
  execution_blocker_fixed: 'YES (audit logger)'
  test_regression_risk: 'LOW (with comprehensive test suite)'
