# ========================================
# Validation Rules
# ========================================

validation:
  required_fields:
    - "orchestrators.*.version"
    - "orchestrators.*.status"
    - "orchestrators.*.category"
    - "orchestrators.*.description"
    - "orchestrators.*.source_file"
  
  allowed_statuses:
    - "draft"
    - "active"
    - "deprecated"
    - "archived"
  
  allowed_categories:
    - "planning"
    - "tdd"
    - "execution"
    - "analysis"
    - "deployment"
    - "maintenance"
  
  version_format: "semantic"  # x.y.z
  
  naming_conventions:
    orchestrator_id: "^[a-z_]+$"  # lowercase with underscores
    version: "^[0-9]+\\.[0-9]+\\.[0-9]+$"  # semantic versioning
    description_min_length: 50
  
  cross_reference_patterns:
    config_namespace: "^config://.*$"
    integration_reference: "^integration://.*$"

