# CORTEX Core Manifest v2.0
# Single source of truth for orchestrator registry, metadata, and relationships
#
# Purpose: Consolidate 37 manifests (21,594 lines) → 3 manifests (2,500 lines)
# Reduction: -88% lines, -92% files, 100% redundancy elimination
#
# Author: Asif Hussain
# GitHub: github.com/asifhussain60/CORTEX
# Created: 2025-12-22
# Version: 2.0.0
# Status: PRODUCTION

schema_version: "2.0"
manifest_type: "core"
last_updated: "2025-12-22T00:00:00Z"

# ========================================
# Global Defaults
# Inherited by all orchestrators
# ========================================

defaults:
  schema_version: "1.0"
  deployment_tier: "user"  # cortex|user|admin|dual_context
  maintainer: "CORTEX Development Team"
  status: "active"  # draft|active|deprecated|archived
  
  # Logging configuration
  logging:
    level: "INFO"
    format: "structured"
    destinations:
      - type: "console"
        enabled: true
      - type: "file"
        enabled: true
        path: "logs/{orchestrator_name}.log"
  
  # Error handling
  error_handling:
    strategy: "fail_fast"
    retry_enabled: false
    max_retries: 3
    rollback_enabled: true
  
  # Quality gates
  quality_gates:
    min_test_coverage: 80
    max_complexity: 30
    required_reviews: 1
    must_pass_linting: true

# ========================================
# Orchestrator Registry
# All 16 CORTEX orchestrators
# ========================================

orchestrators:
  
  # ──────────────────────────────────
  # PLANNING ORCHESTRATORS
  # ──────────────────────────────────
  
  planning_orchestrator:
    version: "4.0.1"
    status: "active"
    category: "planning"
    description: "Tiered planning system with intelligent routing (HIGH/MEDIUM/LOW complexity) supporting autonomous plan execution with TDD enforcement and adaptive complexity adjustment"
    
    # Implementation
    source_file: "src/orchestrators/planning/planning_orchestrator.py"
    entry_point: "PlanningOrchestrator"
    
    # Documentation
    documentation_path: ".github/prompts/modules/planning-system-guide.md"
    changelog_path: "docs/orchestration/planning-system-changelog.md"
    
    # Relationships
    inherits_from: null
    parent_orchestrator: null
    child_orchestrators:
      - "tdd_orchestrator_v4"
      - "ado_orchestrator"
      - "sanitization_orchestrator"
    related_orchestrators:
      - "maintenance_orchestrator"
      - "git_checkpoint_orchestrator"
    
    # Configuration
    config_overrides:
      namespace: "config://planning"
      sections:
        - "refactoring.planning"
        - "token_optimization.planning"
        - "documentation.planning"
    
    integrations:
      - "integration://github"
      - "integration://file_system"
    
    deployment_tier: "dual_context"
    enabled: true
    auto_start: false
    
    quality_gates:
      min_test_coverage: 85
      max_complexity: 40
      required_reviews: 1
      must_pass_linting: true
    
    created_date: "2024-01-15"
    last_updated: "2025-12-20"
