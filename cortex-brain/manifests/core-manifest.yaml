# ========================================
# Categories
# Orchestrator taxonomy
# ========================================

categories:
  planning:
    description: "Orchestrators that create execution plans, strategies, and roadmaps for feature implementations"
    orchestrators:
      - "planning_orchestrator"
      - "pre_flight_orchestrator"
      - "ado_orchestrator"
    characteristics:
      - "High complexity handling"
      - "Multi-phase workflow generation"
      - "Adaptive routing"
  
  tdd:
    description: "Test-driven development workflow orchestrators enforcing RED→GREEN→REFACTOR cycle with adaptive learning"
    orchestrators:
      - "tdd_orchestrator_v4"
    characteristics:
      - "Test-first development"
      - "Complexity-based test generation"
      - "Parallel test execution"
      - "High coverage requirements (95%+)"
  
  execution:
    description: "Orchestrators that execute predefined workflows, transformations, and automated processes"
    orchestrators:
      - "sanitization_orchestrator"
      - "autonomous_execution_engine"
      - "git_checkpoint_orchestrator"
      - "git_sync_optimize_orchestrator"
    characteristics:
      - "Multi-phase execution"
      - "Checkpoint management"
      - "Rollback capability"
  
  analysis:
    description: "Code analysis, system health, and content discovery orchestrators"
    orchestrators:
      - "system_integrity_orchestrator"
      - "story_enhancement_orchestrator"
    characteristics:
      - "Health checks"
      - "Validation frameworks"
      - "Dependency analysis"
  
  maintenance:
    description: "System health, cleanup, optimization, and housekeeping orchestrators"
    orchestrators:
      - "maintenance_orchestrator"
    characteristics:
      - "Automated cleanup"
      - "Performance optimization"
      - "System health monitoring"
  
  quality:
    description: "Code quality analysis, review automation, and best practices enforcement orchestrators"
    orchestrators:
      - "code_review_orchestrator"
    characteristics:
      - "Automated code review"
      - "Security scanning"
      - "Best practices enforcement"
  
  documentation:
    description: "Documentation generation, maintenance, and consistency orchestrators"
    orchestrators:
      - "documentation_orchestrator"
    characteristics:
      - "API documentation"
      - "User guide generation"
      - "Architecture diagrams"
  
  refactoring:
    description: "Code refactoring, technical debt management, and complexity reduction orchestrators"
    orchestrators:
      - "refactoring_orchestrator"
    characteristics:
      - "Technical debt identification"
      - "Complexity reduction"
      - "Safe refactoring workflows"
  
  deployment:
    description: "CI/CD, infrastructure management, and deployment automation orchestrators"
    orchestrators:
      - "cicd_orchestrator"
      - "devops_orchestrator"
    characteristics:
      - "Pipeline automation"
      - "Infrastructure as code"
      - "Multi-environment support"

