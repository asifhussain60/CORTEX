# CORTEX Plan Execution Schema v1.0
# All plans, sub-plans, and phases are defined in YAML for Python execution
# MD files are generated for user-facing documentation only

schema_version: "1.0"
schema_type: "plan-execution"
created: "2026-01-05"

# Example Plan Structure
example_plan:
  id: "A01"  # 3-char ID (A00-A99, B00-B99, etc.)
  type: "feature"  # Options: feature | epic | phase | sub-plan
  name: "enterprise-audit-logger"  # Kebab-case identifier
  title: "Enterprise Python Audit Logger"  # Human-readable title
  description: "Full-featured audit logging system with self-healing capabilities"
  
  metadata:
    created: "2026-01-05T10:00:00Z"
    updated: "2026-01-05T10:00:00Z"
    author: "CORTEX Planning Orchestrator v5"
    plan_id: "plan-a54b104d-8c9e-4a6f-9a32-efccbb68abaf"  # UUID from database
    complexity_tier: 3  # 1-5 scale
    estimated_hours: 66
    status: "active"  # active | completed | archived | on-hold
    
  # Phase definitions (execution units)
  phases:
    - id: "phase-1"
      number: 1
      name: "Core Logger Implementation"
      description: "Implement AuditLogger, LogBuffer, and LogWriter classes"
      status: "not-started"  # not-started | in-progress | completed | blocked
      estimated_hours: 12
      actual_hours: 0
      
      # Task definitions (atomic work units)
      tasks:
        - id: "task-1-1"
          name: "Create AuditLogger class"
          description: "Main logger class with production toggle"
          status: "not-started"
          estimated_minutes: 60
          actual_minutes: 0
          priority: "high"  # low | medium | high | critical
          dependencies: []  # List of task IDs that must complete first
          assigned_to: null  # Optional: assigned developer
          
          # Implementation specification
          implementation:
            type: "code"  # code | config | documentation | test
            language: "python"
            files:
              - path: "src/audit/logger.py"
                template: "audit-logger-template.py"
                lines_of_code: 150
            
            dependencies:
              packages:
                - "pyyaml>=6.0"
                - "psutil>=5.9.0"
              modules:
                - "pathlib"
                - "json"
                - "threading"
          
          # Validation criteria
          validation:
            type: "test"
            files:
              - "tests/audit/test_logger.py"
            coverage_threshold: 90
            acceptance_criteria:
              - "Logger initializes correctly"
              - "Production toggle works (on/off)"
              - "Logs written to correct location"
              - "Thread-safe operations"
              
        - id: "task-1-2"
          name: "Add LogBuffer for async writes"
          description: "Buffer log entries for batch writing"
          status: "not-started"
          estimated_minutes: 45
          dependencies: ["task-1-1"]
          
          implementation:
            type: "code"
            language: "python"
            files:
              - path: "src/audit/buffer.py"
                template: "log-buffer-template.py"
                
          validation:
            type: "test"
            files:
              - "tests/audit/test_buffer.py"
            coverage_threshold: 85
            
    - id: "phase-2"
      number: 2
      name: "Self-Healing Integration"
      description: "Integrate with CORTEX self-healing system"
      status: "not-started"
      estimated_hours: 18
      
      tasks:
        - id: "task-2-1"
          name: "Create log analyzer"
          description: "Analyze logs for patterns and anomalies"
          status: "not-started"
          estimated_minutes: 120
          dependencies: ["task-1-1", "task-1-2"]
          
    - id: "phase-3"
      number: 3
      name: "Production Deployment"
      description: "Deploy to production with monitoring"
      status: "not-started"
      estimated_hours: 8
      
      tasks:
        - id: "task-3-1"
          name: "Create deployment configuration"
          status: "not-started"
          estimated_minutes: 60
          implementation:
            type: "config"
            files:
              - path: "config/audit-logger.yaml"
                
  # Acceptance criteria for entire plan
  acceptance_criteria:
    - "All tests pass with >90% coverage"
    - "Production toggle works correctly"
    - "Self-healing detects and fixes log issues"
    - "Log rotation prevents bloat"
    - "Performance: <5ms per log entry"
    - "Security: No PII in logs"
    
  # Rollback plan
  rollback:
    trigger_conditions:
      - "Test coverage drops below 80%"
      - "Production errors >5%"
      - "Performance degradation >20%"
    steps:
      - "Disable logger via production toggle"
      - "Revert code changes"
      - "Clear log buffer"
      - "Restore previous version"
      
  # Integration points
  integrations:
    - system: "CORTEX Master Orchestrator"
      type: "handoff"
      trigger: "log analysis complete"
      data_format: "json"
      
    - system: "Brain Protector"
      type: "validation"
      trigger: "on plan creation"
      rules: ["TDD_ENFORCEMENT", "HOLISTIC_DISCOVERY"]

# Field Definitions

field_definitions:
  id:
    type: "string"
    pattern: "^[A-Z0-9]{3}$"
    description: "3-character unique identifier (A00-Z99)"
    
  type:
    type: "enum"
    values: ["feature", "epic", "phase", "sub-plan"]
    description: "Plan classification type"
    
  status:
    type: "enum"
    values: ["not-started", "in-progress", "completed", "blocked", "on-hold", "archived"]
    description: "Current execution status"
    
  complexity_tier:
    type: "integer"
    min: 1
    max: 5
    description: "Complexity rating (1=simple, 5=complex)"
    
  priority:
    type: "enum"
    values: ["low", "medium", "high", "critical"]
    description: "Task priority level"
    
  implementation_type:
    type: "enum"
    values: ["code", "config", "documentation", "test", "deployment"]
    description: "Type of implementation work"

# Validation Rules

validation_rules:
  - rule: "All task IDs must be unique within plan"
    severity: "error"
    
  - rule: "Dependencies must reference existing task IDs"
    severity: "error"
    
  - rule: "Phase numbers must be sequential starting from 1"
    severity: "error"
    
  - rule: "Estimated hours must be positive"
    severity: "error"
    
  - rule: "All phases must have at least one task"
    severity: "warning"
    
  - rule: "Acceptance criteria should have 3-10 items"
    severity: "warning"

# Execution Flow

execution_flow:
  description: "How YAML plans are executed by CORTEX"
  steps:
    1: "Load master-plan.yaml"
    2: "Validate against schema"
    3: "Create plan folder structure"
    4: "Start plan-server.py on port 8150"
    5: "Generate plan-viewer.html"
    6: "Execute phases sequentially"
    7: "Update progress-tracker.json after each task"
    8: "Trigger HTML refresh (WebSocket or polling)"
    9: "Generate completion report (MD)"
    10: "Archive to completed/ folder"

# HTML Viewer Integration

html_viewer:
  port: 8150
  endpoints:
    - path: "/api/plan"
      method: "GET"
      response: "master-plan.yaml as JSON"
      
    - path: "/api/progress"
      method: "GET"
      response: "progress-tracker.json"
      
    - path: "/api/tasks/:task_id/complete"
      method: "POST"
      description: "Mark task complete"
      
  update_frequency: 2000  # milliseconds
  features:
    - "Live progress updates"
    - "Phase/task status visualization"
    - "Glassmorphism UI"
    - "Accessibility compliant (WCAG AA)"

# File Structure

file_structure:
  master_yaml: "[A-Z0-9]{3}-{name}.yaml"  # Execution definition
  master_md: "[A-Z0-9]{3}-{name}.md"      # User documentation
  viewer_html: "plan-viewer.html"          # Interactive UI
  progress_json: "tracking/progress-tracker.json"  # Real-time state
  
  folders:
    - "analysis/"      # Context and research
    - "artifacts/"     # Generated code/configs
    - "context/"       # Background information
    - "reports/"       # Status reports
    - "tracking/"      # Progress and state
    - "features/"      # (Epic plans only) Nested feature plans

# Version History

version_history:
  "1.0":
    date: "2026-01-05"
    changes:
      - "Initial schema definition"
      - "YAML-based execution model"
      - "HTML viewer integration"
      - "Port management (8150)"
      - "Real-time progress updates"
