    - name: "pyyaml"
      version: ">=6.0"
      purpose: "YAML configuration loading"
    
    - name: "markdown"
      version: ">=3.5"
      purpose: "Markdown to HTML conversion"
    
    - name: "pygments"
      version: ">=2.17"
      purpose: "Code syntax highlighting"
  
  script_manifest:
    phase_0_content_discovery:
      - "scan_workspace.py"
      - "analyze_existing_docs.py"
      - "identify_gaps.py"
      - "evaluate_staleness.py"
      - "identify_diagram_opportunities.py"
      - "consult_knowledge_library.py"
    
    phase_1_design_planning:
      - "load_glassmorphism_standards.py"
      - "generate_color_scheme.py"
      - "plan_responsive_design.py"
      - "design_css_effects.py"
      - "consult_best_practices.py"
    
    phase_2_diagram_generation:
      - "generate_d3_architecture.py"
      - "generate_mermaid_diagrams.py"
      - "generate_chartjs_metrics.py"
      - "generate_svg_illustrations.py"
      - "generate_threejs_visualizations.py"
    
    phase_3_content_generation:
      - "generate_api_docs.py"
      - "generate_architecture_docs.py"
      - "generate_tutorials.py"
      - "generate_integration_guides.py"
      - "generate_comprehensive_content.py"
    
    phase_5_view_generation:
      - "generate_level1_views.py"
      - "generate_level2_views.py"
      - "generate_interactive_dashboards.py"
      - "generate_responsive_views.py"
      - "apply_css_effects.py"
    
    phase_6_validation:
      - "validate_all_pages.py"
      - "generate_comprehensive_report.py"
  
  template_structure:
    header: |
      #!/usr/bin/env python3
      \"\"\"
      {script_name}
      {description}
      
      Part of CORTEX Documentation Orchestrator v3.0
      Author: Asif Hussain
      Copyright: © 2026 Asif Hussain. All rights reserved.
      \"\"\"
      
      import sys
      import json
      from pathlib import Path
      from typing import Dict, Any, List
      
      # Add project root to path
      project_root = Path(__file__).parent.parent.parent
      sys.path.insert(0, str(project_root))
    
    argparse_template: |
      import argparse
      
      def parse_args():
          parser = argparse.ArgumentParser(description="{description}")
          {arg_definitions}
          return parser.parse_args()
    
    main_structure: |
      def main():
          args = parse_args()
          
          # Load inputs
          {input_loading}
          
          # Execute core logic
          result = {core_function}(inputs)
          
          # Save outputs
          save_output(result, args.output)
          
          print(f"✅ {script_name} complete")
          return 0
      
      if __name__ == "__main__":
          sys.exit(main())

# ═══════════════════════════════════════════════════════════════
# RESPONSIVE DESIGN SPECIFICATIONS
# ═══════════════════════════════════════════════════════════════

responsive_design:
  breakpoints:
    mobile:
      min_width: 320px
      max_width: 767px
      grid_columns: 1
      font_scale: 0.9
      card_spacing: "var(--space-sm)"
    
    tablet:
      min_width: 768px
      max_width: 1023px
      grid_columns: 2
      font_scale: 1.0
      card_spacing: "var(--space-md)"
    
    desktop:
      min_width: 1024px
      max_width: 1439px
      grid_columns: 3
      font_scale: 1.0
      card_spacing: "var(--space-lg)"
    
    wide:
      min_width: 1440px
      grid_columns: 4
      font_scale: 1.1
      card_spacing: "var(--space-lg)"
  
  orientations:
    portrait:
      aspect_ratio: "9:16"
      optimizations:
        - "Single column layout for mobile"
        - "Vertical scrolling emphasis"
        - "Touch-friendly spacing (min 44px)"
    
    landscape:
      aspect_ratio: "16:9"
      optimizations:
        - "Multi-column layout"
        - "Horizontal navigation"
        - "Reduced vertical spacing"
  
  accessibility:
    wcag_level: "AA"
    requirements:
      - "Color contrast ratio >= 4.5:1"
      - "Touch targets >= 44x44px"
      - "Keyboard navigation support"
      - "Screen reader compatibility"
      - "Focus indicators visible"
      - "No autoplay animations"

# ═══════════════════════════════════════════════════════════════
# CSS EFFECTS LIBRARY
# ═══════════════════════════════════════════════════════════════

css_effects:
  glassmorphism_effects:
    blur:
      property: "backdrop-filter"
      values: ["blur(10px)", "blur(20px)", "blur(30px)"]
      fallback: "background: rgba(26, 31, 58, 0.95)"
    
    glow:
      property: "box-shadow"
      values:
        - "0 0 20px rgba(0, 212, 255, 0.3)"
        - "0 0 40px rgba(0, 212, 255, 0.4)"
        - "0 0 60px rgba(0, 212, 255, 0.5)"
      animation: "pulse 3s ease-in-out infinite"
    
    shimmer:
      property: "background"
      values:
        - "linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%)"
      animation: "shimmer 2s linear infinite"
    
    gradient_shift:
      property: "background"
      values:
        - "linear-gradient(135deg, color1, color2)"
      animation: "gradient-shift 10s ease infinite"
  
  animation_keyframes:
    pulse: |
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    
    shimmer: |
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
    
    gradient_shift: |
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
    
    float: |
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

