schema_version: "5.0"

intelligence_layer:
  name: "OrchestratorManagementIntelligence"
  version: "1.0.0"
  description: "Intelligence layer for managing orchestrator lifecycle and preventing user mistakes"
  implementation: "src/orchestrators/master/orchestrator_intelligence.py"
  
  # Core Principles
  principles:
    - "Only MasterOrchestrator and CORTEX can create/manage orchestrators"
    - "Users cannot directly create/register orchestrators (blocked)"
    - "Master orchestrator validates all orchestrator operations"
    - "Master orchestrator decides child orchestrator invocation strategy"
    - "All orchestrators follow YAML-first machine-readable design"

# User Mistake Prevention Rules
mistake_prevention:
  
  # Rule 1: Block Direct Orchestrator Creation
  block_direct_creation:
    severity: "blocked"
    description: "Users cannot create orchestrators directly - must go through MasterOrchestrator"
    detection:
      - "User creates file matching *orchestrator*.py in src/orchestrators/"
      - "User creates manifest matching *orchestrator*.yaml without master approval"
      - "User modifies orchestrators.json without master approval"
    enforcement:
      trigger: "pre_file_creation"
      action: "block_and_redirect"
      redirect_message: |
        ⛔ Direct orchestrator creation blocked.
        
        Orchestrators must be created through MasterOrchestrator to ensure:
        - Proper registration and validation
        - No pattern conflicts with existing orchestrators
        - Compliance with CORTEX architecture standards
        
        Please request: "create orchestrator for {your_use_case}"
        MasterOrchestrator will analyze and create it correctly.
    
    exceptions:
      - "Modification by MasterOrchestrator itself"
      - "Modification by CORTEX system during upgrade"
  
  # Rule 2: Prevent Duplicate Orchestrators
  prevent_duplicates:
    severity: "blocked"
    description: "Prevent creation of orchestrators with duplicate functionality"
    detection:
      - "Pattern match overlap (regex collision detection)"
      - "Semantic similarity >80% (NLP-based comparison)"
      - "Capability overlap (same capabilities in multiple orchestrators)"
    enforcement:
      trigger: "orchestrator_registration"
      action: "analyze_and_consolidate"
      consolidation_steps:
        1: "Analyze existing orchestrators for similar functionality"
        2: "If ≥80% similar, suggest consolidation instead of creation"
        3: "If consolidation accepted, merge capabilities into existing orchestrator"
        4: "If consolidation rejected, require explicit justification"
        5: "Add to registry ONLY if justified or no collision"
  
  # Rule 3: Validate Orchestrator Hierarchy
  validate_hierarchy:
    severity: "blocked"
    description: "Ensure parent-child relationships are valid"
    validation:
      - "Parent orchestrator must exist before creating child"
      - "Child orchestrator must declare parent_orchestrator_id"
      - "No circular dependencies (A→B→C→A)"
      - "Max hierarchy depth: 3 levels (Master→Parent→Child→GrandChild prohibited)"
    enforcement:
      trigger: "orchestrator_registration"
      action: "validate_and_reject"
  
  # Rule 4: Enforce YAML-First Design
  enforce_yaml_first:
    severity: "blocked"
    description: "All orchestrators must have YAML manifest before Python implementation"
    validation:
      - "Manifest file exists in cortex-brain/manifests/orchestrators/"
      - "Manifest validates against manifest-schema.yaml"
      - "Manifest declares all phases, inputs, outputs"
      - "Python implementation references manifest_path"
    enforcement:
      trigger: "orchestrator_registration"
      action: "block_if_no_manifest"
      message: |
        ⛔ Python implementation without YAML manifest blocked.
        
        CORTEX enforces YAML-first design:
        1. Create manifest: cortex-brain/manifests/orchestrators/{name}.yaml
        2. Validate manifest: python -m src.utils.manifest_validator {manifest}
        3. Implement Python: src/orchestrators/{category}/{name}.py
        4. Register: MasterOrchestrator auto-registers on next invocation
  
  # Rule 5: Prevent Registry Corruption
  prevent_registry_corruption:
    severity: "blocked"
    description: "Prevent manual registry edits that corrupt orchestrator discovery"
    detection:
      - "Direct edit of cortex-brain/registry/orchestrators.json"
      - "Missing required fields (id, name, version, type, module_path)"
      - "Invalid JSON syntax"
      - "Pattern conflicts (duplicate patterns)"
    enforcement:
      trigger: "file_modification"
      action: "block_and_auto_regenerate"
      auto_regeneration:
        - "Scan cortex-brain/manifests/orchestrators/ for all manifests"
        - "Validate each manifest against schema"
        - "Generate orchestrators.json from manifests"
        - "Detect pattern collisions and resolve via priority"
    exceptions:
      - "Modification by OrchestratorRegistry.register() method"
      - "Modification by CORTEX upgrade system"

# Orchestrator Lifecycle Management
lifecycle_management:
  
  # Creation Workflow
  creation:
    workflow:
      1:
        phase: "REQUEST_ANALYSIS"
        description: "Analyze user request for orchestrator need"
        activities:
          - "Extract use case, capabilities, constraints"
          - "Search existing orchestrators for similar functionality"
          - "Determine if new orchestrator needed or existing can be extended"
      
      2:
        phase: "CONSOLIDATION_CHECK"
        description: "Check if new orchestrator can be consolidated"
        activities:
          - "Semantic similarity analysis (NLP)"
          - "Pattern collision detection"
          - "Capability overlap analysis"
          - "Decision: create_new | extend_existing | consolidate_multiple"
      
      3:
        phase: "MANIFEST_GENERATION"
        description: "Generate YAML manifest from request"
        activities:
          - "Generate orchestrator_id (unique)"
          - "Define phases and activities"
          - "Specify inputs, outputs, dependencies"
          - "Validate against manifest-schema.yaml"
      
      4:
        phase: "IMPLEMENTATION"
        description: "Generate Python implementation"
        activities:
          - "Create orchestrator class (extends BaseOrchestratorV4_1)"
          - "Implement execute() method"
          - "Add phase execution logic"
          - "Integrate with state_db and audit_logger"
      
      5:
        phase: "REGISTRATION"
        description: "Register orchestrator in registry"
        activities:
          - "Add entry to orchestrators.json"
          - "Update master-orchestrator.yaml routing rules"
          - "Update CORTEX.prompt.md routing table"
          - "Generate orchestrator documentation"
      
      6:
        phase: "VALIDATION"
        description: "Validate orchestrator works correctly"
        activities:
          - "Run test invocation (dry-run)"
          - "Verify pattern matching works"
          - "Check state persistence"
          - "Validate audit logging"
  
  # Enhancement Workflow
  enhancement:
    workflow:
      1:
        phase: "ANALYSIS"
        description: "Analyze enhancement request"
        activities:
          - "Identify target orchestrator"
          - "Determine enhancement type (new_phase | new_capability | bug_fix)"
          - "Check backward compatibility"
      
      2:
        phase: "MODIFICATION"
        description: "Modify manifest and implementation"
        activities:
          - "Update manifest (version bump, new phases)"
          - "Update Python implementation"
          - "Update tests"
          - "Update documentation"
      
      3:
        phase: "VALIDATION"
        description: "Ensure no regressions"
        activities:
          - "Run existing tests (100% pass required)"
          - "Run new tests (for new functionality)"
          - "Validate orchestrator registry integrity"
  
  # Deprecation Workflow
  deprecation:
    workflow:
      1:
        phase: "USAGE_ANALYSIS"
        description: "Analyze orchestrator usage"
        activities:
          - "Query audit logs for invocation count (30d, 90d)"
          - "Check dependencies (which orchestrators depend on this?)"
          - "Identify replacement orchestrator (if any)"
      
      2:
        phase: "MIGRATION_PLANNING"
        description: "Plan migration if needed"
        activities:
          - "Create migration guide (for users)"
          - "Identify equivalent functionality in new orchestrator"
          - "Update routing rules (redirect to new orchestrator)"
      
      3:
        phase: "DEPRECATION"
        description: "Mark as deprecated"
        activities:
          - "Set enabled: false in orchestrators.json"
          - "Add deprecation_notice in manifest"
          - "Update CORTEX.prompt.md (remove routing rule)"
          - "Move manifest to cortex-brain/archives/orchestrators/"
      
      4:
        phase: "CLEANUP"
        description: "Clean up after deprecation period (90 days)"
        activities:
          - "Verify zero invocations in last 90 days"
          - "Delete Python implementation"
          - "Remove from orchestrators.json"
          - "Update documentation"
  
  # Deletion Workflow
  deletion:
    restrictions:
      - "Only CORTEX or MasterOrchestrator can delete orchestrators"
      - "Deletion requires 90-day deprecation period"
      - "Deletion blocked if dependencies exist"
      - "Deletion requires explicit confirmation"
    
    workflow:
      1:
        phase: "VALIDATION"
        description: "Validate deletion is safe"
        activities:
          - "Check deprecation_date (must be ≥90 days ago)"
          - "Check dependencies (must be zero)"
          - "Check recent invocations (must be zero)"
      
      2:
        phase: "BACKUP"
        description: "Backup before deletion"
        activities:
          - "Copy manifest to cortex-brain/archives/orchestrators/"
          - "Copy Python implementation to archives"
          - "Create deletion audit log entry"
      
      3:
        phase: "DELETION"
        description: "Delete orchestrator files"
        activities:
          - "Delete manifest file"
          - "Delete Python implementation"
          - "Remove from orchestrators.json"
          - "Update master-orchestrator.yaml"
          - "Update CORTEX.prompt.md"

# Child Orchestrator Invocation Strategy
child_invocation_strategy:
  
  # Parent Orchestrator Decides Child Execution
  decision_framework:
    inputs:
      - "User request (parsed and analyzed)"
      - "Parent orchestrator capabilities"
      - "Child orchestrator capabilities"
      - "Request complexity"
      - "Execution context (continuation, new request)"
    
    decision_types:
      sequential:
        description: "Execute children one after another (order matters)"
        use_cases:
          - "Dependencies between children (A must complete before B)"
          - "Progressive refinement (quality → architecture → docs → tests)"
        example: "Refactor orchestrator: code_quality → architecture → documentation → tests"
      
      parallel:
        description: "Execute children concurrently (no dependencies)"
        use_cases:
          - "Independent tasks (no shared state)"
          - "Performance optimization (reduce total time)"
        example: "Analysis orchestrator: code_analysis || test_analysis || doc_analysis"
      
      conditional:
        description: "Execute children based on runtime conditions"
        use_cases:
          - "Optional phases (only if needed)"
          - "Error recovery (fallback orchestrators)"
        example: "Investigation orchestrator: if error_type == 'database' → database_diagnostics"
      
      dynamic:
        description: "Parent decides at runtime which children to invoke"
        use_cases:
          - "LLM-based classification of request"
          - "Adaptive workflows (change based on intermediate results)"
        example: "Refactor orchestrator: LLM classifies refactor_type → routes to appropriate child"
  
  # Intelligence in Parent Orchestrator
  parent_intelligence:
    responsibilities:
      - "Parse and classify user request"
      - "Determine which child orchestrators to invoke"
      - "Decide execution sequence (sequential, parallel, conditional)"
      - "Track execution in todo list (in-memory or state_db)"
      - "Aggregate results from all children"
      - "Generate consolidated report"
    
    child_simplicity:
      - "Child orchestrators focus ONLY on their specific function"
      - "Child orchestrators do NOT decide when to run (parent decides)"
      - "Child orchestrators do NOT coordinate with siblings (parent coordinates)"
      - "Child orchestrators return structured results (parent aggregates)"
  
  # Todo List Management (In-Memory State)
  todo_list:
    structure:
      - orchestrator_id: str
      - orchestrator_name: str
      - status: "pending" | "in_progress" | "completed" | "failed" | "skipped"
      - priority: int
      - dependencies: List[str]  # Must complete before this can start
      - start_time: Optional[datetime]
      - end_time: Optional[datetime]
      - result: Optional[Dict[str, Any]]
      - error: Optional[str]
    
    persistence:
      method: "state_db"
      key_pattern: "{parent_orchestrator_id}_todo_{timestamp}"
      retention: "30_days"
    
    tracking_methods:
      - "Update status on phase start"
      - "Update status on phase completion"
      - "Log errors if phase fails"
      - "Mark skipped if conditional execution skips"

# Master Orchestrator Decision Making
master_decision_making:
  
  # When to Create New Orchestrator
  create_new_criteria:
    - condition: "No existing orchestrator matches functionality"
      action: "create_new"
    
    - condition: "Existing orchestrator too complex (>10 phases)"
      action: "split_into_parent_child"
    
    - condition: "Pattern collision with existing orchestrator"
      action: "consolidate_or_prioritize"
  
  # When to Extend Existing Orchestrator
  extend_existing_criteria:
    - condition: "Semantic similarity ≥80%"
      action: "extend_existing"
    
    - condition: "Capability overlap ≥60%"
      action: "extend_existing"
    
    - condition: "Same category (planning, analysis, maintenance)"
      action: "extend_existing_if_logical"
  
  # When to Consolidate Multiple Orchestrators
  consolidate_criteria:
    - condition: "Multiple orchestrators with similar patterns"
      action: "consolidate_into_parent_with_children"
    
    - condition: "Functionality split across orchestrators illogically"
      action: "consolidate_into_single_orchestrator"
    
    - condition: "Pattern collisions causing routing confusion"
      action: "consolidate_and_unify_patterns"

# Governance Integration
governance:
  enforcement:
    - rule_id: "ORCHESTRATOR_CREATION_RESTRICTED"
      action: "block_direct_creation"
      enforced_by: "FileCreationGuard middleware"
    
    - rule_id: "YAML_FIRST_REQUIRED"
      action: "block_implementation_without_manifest"
      enforced_by: "ManifestValidator middleware"
    
    - rule_id: "REGISTRY_INTEGRITY_PROTECTED"
      action: "block_manual_registry_edits"
      enforced_by: "RegistryGuard middleware"
    
    - rule_id: "PATTERN_COLLISION_PREVENTED"
      action: "detect_and_reject_conflicts"
      enforced_by: "PatternCollisionDetector"

# Implementation Files
implementation:
  middleware:
    - name: "FileCreationGuard"
      path: "src/orchestrators/middleware/file_creation_guard.py"
      hook: "pre_file_creation"
      enforces: ["ORCHESTRATOR_CREATION_RESTRICTED", "YAML_FIRST_REQUIRED"]
    
    - name: "ManifestValidator"
      path: "src/orchestrators/middleware/manifest_validator.py"
      hook: "orchestrator_registration"
      enforces: ["YAML_FIRST_REQUIRED"]
    
    - name: "RegistryGuard"
      path: "src/orchestrators/middleware/registry_guard.py"
      hook: "file_modification"
      enforces: ["REGISTRY_INTEGRITY_PROTECTED"]
    
    - name: "PatternCollisionDetector"
      path: "src/orchestrators/middleware/pattern_collision_detector.py"
      hook: "orchestrator_registration"
      enforces: ["PATTERN_COLLISION_PREVENTED"]
  
  intelligence:
    - name: "OrchestratorIntelligence"
      path: "src/orchestrators/master/orchestrator_intelligence.py"
      methods:
        - "analyze_request(user_request: str) -> OrchestratorDecision"
        - "check_consolidation(new_orchestrator: Dict) -> ConsolidationRecommendation"
        - "validate_hierarchy(parent_id: str, child_id: str) -> bool"
        - "decide_child_invocation(parent: Orchestrator, children: List[Orchestrator]) -> InvocationStrategy"
