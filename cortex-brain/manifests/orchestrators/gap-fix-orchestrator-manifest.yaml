# Gap-Fix Orchestrator Manifest
# 14-Phase Gap Detection and Remediation Pipeline
# Created: 2026-01-11
# Version: 1.0.0

metadata:
  id: gap_fix
  name: Gap-Fix Orchestrator
  version: "1.0.0"
  type: autonomous
  category: analysis
  author: CORTEX TDD-Master
  created: "2026-01-11"
  updated: "2026-01-11"

description: |
  Autonomous 14-phase orchestrator for detecting and remediating gaps
  between implementation state and acceptance criteria specifications.
  
  Phases 0-4 (SEARCH): Discover missing tests, implementations, ACs
  Phase 5 (MCP_VALIDATION): Validate orchestrators via MCP registry
  Phases 6-11 (ALIGN): Synchronize plans, generate fixes, update tracking

ac_coverage:
  - id: AC-GAP-FIX-001
    description: Phase 0-4 SEARCH discovers test gaps, AC gaps, implementation gaps
    verification: tests/orchestrators/test_gap_fix_orchestrator.py::TestGapDetection
  
  - id: AC-GAP-FIX-002
    description: Phase 5 MCP_VALIDATION validates orchestrator registry
    verification: tests/orchestrators/test_gap_fix_orchestrator.py::TestPlanSynchronization
  
  - id: AC-GAP-FIX-003
    description: Phases 6-11 ALIGN synchronize plans and generate fixes
    verification: tests/orchestrators/test_gap_fix_orchestrator.py::TestRemediationPlan
  
  - id: AC-GAP-FIX-004
    description: Full pipeline executes all 14 phases in order
    verification: tests/orchestrators/test_gap_fix_orchestrator.py::TestFullPipeline

phases:
  search:
    - phase: 0
      name: TEST_GAP_SEARCH
      description: Scan test directories for missing test coverage
      outputs: [test_gaps]
    
    - phase: 1
      name: AC_GAP_SEARCH
      description: Identify ACs without corresponding tests
      outputs: [ac_gaps]
    
    - phase: 2
      name: IMPL_GAP_SEARCH
      description: Find implementation code lacking tests
      outputs: [impl_gaps]
    
    - phase: 3
      name: ORCHESTRATOR_GAP_SEARCH
      description: Check orchestrators for missing coverage
      outputs: [orchestrator_gaps]
    
    - phase: 4
      name: GOVERNANCE_GAP_SEARCH
      description: Verify CORE rules enforcement
      outputs: [governance_gaps]

  validation:
    - phase: 5
      name: MCP_VALIDATION
      description: Validate all orchestrators registered in MCP
      outputs: [mcp_validation_result]

  align:
    - phase: 6
      name: SNOWBALL_ANALYSIS
      description: Calculate remediation priority using snowball strategy
      outputs: [snowball_strategy]
    
    - phase: 7
      name: PLAN_SYNC
      description: Synchronize discovered gaps with active plans
      outputs: [sync_result]
    
    - phase: 8
      name: REMEDIATION_PLANNING
      description: Generate fix tasks for each gap
      outputs: [remediation_tasks]
    
    - phase: 9
      name: DEPENDENCY_ORDERING
      description: Order tasks by dependency graph
      outputs: [ordered_tasks]
    
    - phase: 10
      name: EFFORT_ESTIMATION
      description: Calculate effort hours per task
      outputs: [effort_estimates]
    
    - phase: 11
      name: TRACKING_UPDATE
      description: Update tracking files with new tasks
      outputs: [tracking_updated]

invocation:
  patterns:
    - "^(gap-fix|gap fix|find gaps|detect gaps|fix gaps).*$"
    - "^(gap detection|gap analysis|gap remediation).*$"
  
  examples:
    - "gap-fix"
    - "find gaps in implementation"
    - "detect gaps"
    - "gap analysis for CORTEX 6"
    - "fix gaps in orchestrators"

configuration:
  defaults:
    scan_paths:
      - src/orchestrators/
      - src/cortex_agents/
      - tests/
    ac_sources:
      - cortex-brain/documents/planning/active/cortex6/CX6-unified-orchestration-system.yaml
    governance_rules:
      - cortex-brain/tier0/governance/core-rules.yaml
    snowball_strategy_path: cortex-brain/documents/planning/active/cortex6/snowball-strategy-20260110.yaml
    
  gap_severity_weights:
    CRITICAL: 10
    HIGH: 7
    MEDIUM: 4
    LOW: 1

outputs:
  report_format: yaml
  report_location: cortex-brain/analysis/gap-reports/
  dashboard_update: true
  tracking_update: true

dependencies:
  base_class: src.orchestrators.base.base_orchestrator.BaseOrchestrator
  plan_sync: src.cortex_agents.align_plan_sync
  audit_logger: src.orchestrators.audit_logger.EnterpriseAuditLogger

testing:
  test_file: tests/orchestrators/test_gap_fix_orchestrator.py
  test_count: 11
  coverage_target: 90%
