## 🏗️ Architecture

### Entry Points

```python
from src.orchestrators.refinement import RefinementOrchestrator

orchestrator = RefinementOrchestrator(target_path, output_dir)
results = orchestrator.execute()
```

### Core Components

**Main Orchestrator:**
- `src/orchestrators/refinement/refinement_orchestrator.py`
- Manages 7-phase execution workflow
- State management and progress tracking
- Report generation coordination

**Phases:**
1. `phases/quality_assessment.py` - Linting, complexity, code smells
2. `phases/duplicate_detection.py` - AST duplicate finding
3. `phases/performance_analysis.py` - Hotspot identification
4. `phases/security_audit.py` - Vulnerability scanning
5. `phases/refactoring_plan.py` - Task prioritization
6. `phases/apply_refactorings.py` - Automated refactoring
7. `phases/validation_metrics.py` - Metrics comparison

**Utilities:**
- `utils/metrics_reporter.py` - Multi-format report generation
- `analyzers/` - Code analysis tools (planned)

