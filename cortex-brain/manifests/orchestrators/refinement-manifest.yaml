## 🔄 Workflow

### Standard Execution

```mermaid
graph TD
    A[Initialize] --> B[Phase 1: Quality]
    B --> C[Phase 2: Duplicates]
    C --> D[Phase 3: Performance]
    D --> E[Phase 4: Security]
    E --> F[Phase 5: Refactoring Plan]
    F --> G[Phase 6: Apply Refactorings]
    G --> H[Phase 7: Validation]
    H --> I[Generate Reports]
```

### Phase Dependencies

- Phases 1-4: Independent, can run in parallel
- Phase 5: Depends on phases 1-4
- Phase 6: Depends on phase 5
- Phase 7: Depends on phases 1-6

