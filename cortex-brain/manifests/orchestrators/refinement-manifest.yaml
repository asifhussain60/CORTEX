## 📊 Metrics

### Performance

- **Execution Time:** ~0.1s for single file, ~1-5s for directory
- **Memory Usage:** < 100MB for typical projects
- **Scalability:** Handles projects up to 10k LOC efficiently

### Quality Scores

- **Quality Score:** 0-100 (weighted by severity)
- **Security Score:** 0-100 (inversely proportional to vulnerabilities)
- **Performance Score:** 0-100 (based on hotspot count)

