## 🎨 Output Formats

### JSON Report

**File:** `refinement-report-{session_id}.json`

**Structure:**
```json
{
  "session_id": "...",
  "generated_at": "...",
  "target": "...",
  "summary": {...},
  "phase_results": {...},
  "recommendations": [...]
}
```

### HTML Report

**File:** `refinement-report-{session_id}.html`

Interactive dashboard with:
- Metrics overview
- Quality/security scores
- Recommendations
- Phase results

### Markdown Summary

**File:** `refinement-summary-{session_id}.md`

Executive summary with:
- Key metrics
- Improvement suggestions
- Status overview

