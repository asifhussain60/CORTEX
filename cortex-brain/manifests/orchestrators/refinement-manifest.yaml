## 🐛 Troubleshooting

### Common Issues

| Issue | Solution |
|-------|----------|
| No files analyzed | Check target path and exclusion patterns |
| Quality score is 0 | File may not exist or has syntax errors |
| Pylint not found | Install with `pip install pylint` (optional) |
| Permission errors | Ensure write access to output directory |

### Debug Mode

```python
import logging
logging.basicConfig(level=logging.DEBUG)

orchestrator = RefinementOrchestrator(target_path)
results = orchestrator.execute()
```

