## 📝 Usage Examples

### Basic Refinement

```python
from pathlib import Path
from src.orchestrators.refinement import RefinementOrchestrator

# Analyze single file
orchestrator = RefinementOrchestrator(Path("src/module.py"))
results = orchestrator.execute()
print(f"Quality Score: {results['results']['QualityAssessment']['quality_score']}")
```

### Specific Phases

```python
# Run only analysis phases
results = orchestrator.execute(phases=[1, 2, 3, 4])
```

### Auto-Apply Refactorings

```python
# Automatically apply safe refactorings
results = orchestrator.execute(auto_apply=True)
```

