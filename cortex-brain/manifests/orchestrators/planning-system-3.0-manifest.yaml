# ========================================
# Workflow
# ========================================

workflow:
  phases:
    - id: 1
      name: "Classification & Analysis"
      description: "Classify operation tier and analyze complexity"
      duration: "< 5 seconds"
      components:
        - "TieredRouter"
        - "ComplexityAnalyzer"

    - id: 2
      name: "Pre-Planning Discovery"
      description: "Check for existing/recent plans"
      duration: "30-60 seconds"
      components:
        - "pre_planning_discovery()"
      optional: true
      skip_condition: "force_new_plan=true"

    - id: 3
      name: "Execution"
      description: "Execute tier-specific planning workflow"
      duration: "Variable (depends on tier)"
      components:
        - "_execute_instant()" # Tier 1
        - "_execute_lightweight()" # Tier 2
        - "_execute_documented()" # Tier 3
        - "_execute_complex()" # Tier 4

    - id: 3.5
      name: "TDD Integration"
      description: "Automated RED→GREEN→REFACTOR cycle for all plans (Tier 2+)"
      duration: "Variable (depends on implementation complexity)"
      orchestrator: "tdd_orchestrator_v4"
      integration_method: "Automatic inclusion in all plans"
      components:
        - "TDDOrchestratorV4"
        - "RedPhaseStrategy" # Generate failing tests
        - "GreenPhaseStrategy" # Minimal implementation
        - "RefactorPhaseStrategy" # AI-driven refactoring
      triggers:
        - "tier >= 2" # LIGHTWEIGHT and above
        - "skip_tdd=false" # Not explicitly disabled
      quality_gates:
        - "min_test_coverage: 80%"
        - "min_quality_score: 7.0/10.0"
        - "all_tests_passing: true"
      rollback_on_failure: true
      notes: "TDD v4.0 provides adaptive learning (11+ languages), AI code generation, and clean code enforcement"

    - id: 4
      name: "Refactor"
      description: "Run refactor cycle for Tier 3+ operations"
      duration: "Variable"
      components:
        - "_run_refactor_cycle()"
      conditional: "tier >= 3 AND skip_refactor=false"

    - id: 5
      name: "Vacuum"
      description: "Run vacuum cycle for Tier 3+ operations"
      duration: "Variable"
      components:
        - "_run_vacuum_cycle()"
      conditional: "tier >= 3 AND skip_vacuum=false"

    - id: 6
      name: "Documentation"
      description: "Generate planning documentation"
      duration: "< 10 seconds"
      components:
        - "_generate_documentation()"

    - id: 7
      name: "Finalization"
      description: "Finalize planning and render visual tracker"
      duration: "< 5 seconds"
      components:
        - "PlanningSession.render_progress_table()"

# ========================================
# Metrics & Monitoring
# ========================================

metrics:
  tracked_metrics:
    - "operations_processed" # Total operations
    - "tier_breakdown" # Count per tier (1-4)
    - "planning_created" # Plans generated
    - "temporary_plans_created" # Implicit plans
    - "plans_approved" # Temp → active
    - "plans_completed" # Active → completed
    - "knowledge_extractions" # Completed → knowledge graph
    - "refactor_cycles_run" # Refactor invocations
    - "vacuum_cycles_run" # Vacuum invocations
    - "errors" # Error list
    - "warnings" # Warning list

  performance_targets:
    tier_1_execution: "< 2 seconds"
    tier_2_execution: "< 10 seconds"
    tier_3_execution: "< 60 minutes"
    tier_4_execution: "Variable (documented upfront)"
    discovery_overhead: "< 60 seconds"

# ========================================
# Configuration
# ========================================

configuration:
  plan_folder_structure:
    root: "cortex-brain/documents/planning/"
    subfolders:
      - "active/" # Current work
      - "temp-plans/" # Unapproved work
      - "completed/" # Archived work
      - "features/" # Legacy feature plans
  
  universal_subfolders:
    required:
      - "context/" # Context artifacts
      - "reports/" # Progress reports
      - "artifacts/" # Supporting files
      - "tracking/" # Progress tracking JSON

  plan_file_naming:
    master_plan: "00-master-plan.md"
    temp_plan: "11-temp-planning-session.md"
    sub_plans: "01-*.md, 02-*.md, etc."
    tracking: "tracking/progress-tracker.json"

