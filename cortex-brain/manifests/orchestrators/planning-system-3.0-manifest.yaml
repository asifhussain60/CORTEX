# Planning System 3.0 Orchestrator Manifest
# Enhanced planning with tiered routing, pre-planning discovery, and visual progress tracking
#
# Version: 3.1.0
# Author: CORTEX Development Team
# Created: 2025-12-15
# Status: ACTIVE - Latest planning system
# Orchestrator: src/operations/modules/orchestration/planning_orchestrator.py

schema_version: "1.0"

# ========================================
# Metadata
# ========================================

metadata:
  orchestrator_name: "planning_orchestrator"
  version: "3.1.0"
  description: "Tiered planning system with intelligent routing and visual progress tracking"
  category: "planning"
  deployment_tier: "cortex"
  status: "active"
  last_updated: "2025-12-15"
  maintainer: "CORTEX Planning Team"
  related_orchestrators:
    - "maintenance_orchestrator"
    - "contextual_review_orchestrator"
    - "tdd_orchestrator_v4"
  child_orchestrators:
    - name: "tdd_orchestrator_v4"
      manifest: "cortex-brain/manifests/orchestrators/tdd-orchestrator-v4-manifest.yaml"
      relationship: "All planning system plans include TDD phases"
  documentation_path: ".github/prompts/modules/planning-system-guide.md"
  source_file: "src/operations/modules/orchestration/planning_orchestrator.py"

# ========================================
# Core Components
# ========================================

components:
  tiered_routing:
    enabled: true
    source: "src/operations/modules/routing/tiered_router.py"
    description: "4-tier classification system for operation complexity"
    tiers:
      - id: 1
        name: "INSTANT"
        threshold: "< 2 seconds"
        execution_method: "Direct function call"
        planning_required: false
      - id: 2
        name: "LIGHTWEIGHT"
        threshold: "< 10 seconds"
        execution_method: "Inline validation plan"
        planning_required: true
        plan_type: "inline"
      - id: 3
        name: "DOCUMENTED"
        threshold: "10-60 minutes"
        execution_method: "Feature plan (single MD)"
        planning_required: true
        plan_type: "markdown"
      - id: 4
        name: "COMPLEX"
        threshold: "> 1 hour"
        execution_method: "Nested plan (master + sub-plans)"
        planning_required: true
        plan_type: "nested_markdown"

  pre_planning_discovery:
    enabled: true
    source: "src/operations/modules/orchestration/planning_orchestrator.py::pre_planning_discovery()"
    description: "Check for existing/recent plans before creating new ones"
    implementation_task: "Task 1.1 (cortex-rearchitecture-v1)"
    search_folders:
      - folder: "active"
        purpose: "Current work in progress"
        time_range: "all"
      - folder: "temp-plans"
        purpose: "Unapproved/pending work"
        time_range: "last_30_days"
      - folder: "completed"
        purpose: "Recently archived plans (context reuse)"
        time_range: "last_180_days"
    overhead: "30-60 seconds"
    recommendation_types:
      - "active_plan_exists" # Continue existing or create new version
      - "temp_plan_exists" # Approve existing or create new
      - "completed_plan_exists" # Reuse context from completed plan

  visual_progress_tracker:
    enabled: true
    source: "src/orchestrators/session_model.py::PlanningSession"
    description: "Real-time visual progress tracking in responses and plans"
    implementation_tasks:
      - "Task 1.3: PlanningSession integration"
      - "Task 1.4: Phase tracking (record_phase_start/end)"
      - "Task 1.5: Render visual tracker in responses"
      - "Task 1.6: Embed tracker in master plans"
    location: "User responses and master plans (00-master-plan.md)"
    updates: "Real-time during execution"
    metrics_tracked:
      - "phase_timing" # Start/end timestamps per phase
      - "token_consumption" # Tokens used per phase
      - "duration_formatting" # Human-readable durations
      - "progress_percentage" # Completion percentage
      - "tasks_completed" # Task completion ratio
    rendering:
      method: "PlanningSession.render_progress_table()"
      format: "Markdown table"
      includes:
        - "Phase number and name"
        - "Status icons (✅ ⏳ 🔄)"
        - "Progress percentage"
        - "Duration per phase"
        - "Token usage per phase"
        - "Task completion ratio"

  complexity_analyzer:
    enabled: true
    source: "src/operations/modules/routing/complexity_analyzer.py"
    description: "4-dimensional complexity scoring"
    dimensions:
      - "code_impact" # Lines changed, files affected
      - "risk_level" # Dependencies, breaking changes
      - "domain_complexity" # Business logic, algorithms
      - "integration_scope" # External systems, APIs

  temporary_plan_manager:
    enabled: true
    source: "src/operations/modules/orchestration/temporary_plan_manager.py"
    description: "Manage implicit planning workflow"
    lifecycle:
      - "create" # User tasks without "create plan"
      - "feedback" # Optional user refinement
      - "approve" # Move to active/
      - "reject" # Delete from temp-plans/

  autonomous_execution:
    enabled: true
    version: "1.0.0"
    description: "E2E autonomous execution with self-healing and auto-validation"
    implementation_phase: "Phase 0.5 (Week 1)"
    source: "src/orchestrators/autonomous_execution_engine.py"
    modes:
      supervised:
        description: "User approves each phase transition (default)"
        auto_validate: true
        auto_commit: false
        auto_transition: false
        self_healing: false
        user_approval_required: true
      autonomous:
        description: "Full E2E execution with self-healing"
        auto_validate: true
        auto_commit: true
        auto_transition: true
        self_healing: true
        escalation_threshold: 3  # Escalate after 3 failures
        user_approval_required: false
    
    phase_lifecycle:
      on_phase_start:
        - "validate_prerequisites"
        - "create_checkpoint"
        - "update_progress_tracker"
      on_phase_complete:
        - "run_validation_gate"
        - "if_pass: commit_work"
        - "if_pass: update_master_plan"
        - "if_pass: create_checkpoint"
        - "if_pass: transition_to_next_phase"
      on_validation_fail:
        - "attempt_self_heal (max 3 retries)"
        - "rollback_to_checkpoint"
        - "log_failure_reason"
        - "escalate_to_user"
      on_critical_error:
        - "emergency_rollback"
        - "save_error_state"
        - "notify_user_immediately"
    
    self_healing_strategies:
      - name: "retry_with_backoff"
        max_attempts: 3
        backoff: "exponential"
        applicable_to: ["transient_errors", "network_issues"]
      - name: "alternative_approach"
        max_attempts: 2
        applicable_to: ["test_failures", "validation_errors"]
      - name: "rollback_and_retry"
        max_attempts: 1
        applicable_to: ["breaking_changes", "integration_failures"]
    
    git_automation:
      enabled: true
      commit_on_phase_complete: true
      push_on_milestone: true
      commit_message_template: "✅ {phase_name} Complete: {summary}\n\n{deliverables}"
      branch_protection: true  # Require validation before push
    
    progress_monitoring:
      real_time_updates: true
      decision_making: true  # Progress tracker can make phase transition decisions
      metrics_tracked:
        - "phase_completion_percentage"
        - "validation_gate_status"
        - "test_pass_rate"
        - "error_count"
        - "token_consumption"
      thresholds:
        phase_complete: 100  # % completion required
        validation_pass: 100  # % tests passing required
        error_tolerance: 0  # Max errors before escalation
    
    commands:
      execute_autonomous:
        syntax: "cortex execute plan --mode=autonomous [--from=PHASE] [--to=PHASE]"
        description: "Execute plan end-to-end with autonomous mode"
        examples:
          - "cortex execute plan --mode=autonomous"
          - "cortex execute plan --mode=autonomous --from=phase_1 --to=phase_3"
      execute_supervised:
        syntax: "cortex execute plan --mode=supervised"
        description: "Execute plan with user approval at each phase (default)"

