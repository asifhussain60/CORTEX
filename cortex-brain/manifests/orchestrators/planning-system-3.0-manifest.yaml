        status: "⏸️ PENDING"
        tests:
          - "test_visual_tracker_in_response"
          - "test_session_metrics_display"
          - "test_master_plan_with_visual_tracker"

  integration_tests:
    location: "tests/integration/"
    test_suites:
      - name: "Visual Tracker Integration"
        file: "test_visual_tracker_integration.py"
        status: "⏸️ PENDING"
        tests:
          - "test_end_to_end_planning_with_discovery"
          - "test_visual_tracker_visible_in_responses"
          - "test_tracker_embedded_in_master_plans"
          - "test_metrics_accurately_tracked"
