schema_version: "5.0"

orchestrator:
  name: "refactor_tests"
  version: "1.0.0"
  type: "autonomous"
  parent_orchestrator_id: "refactor_orchestrator"
  description: "Test refactoring: coverage improvement, test quality, fixture optimization"
  implementation: "src/orchestrators/refactor/test_refactor.py"
  base_class: "BaseOrchestratorV4_1"
  
  phases:
    - id: 1
      name: "ANALYSIS"
      description: "Analyze test quality"
      activities:
        - "Calculate coverage (unit ≥80%, integration ≥60%)"
        - "Identify coverage gaps"
        - "Find slow tests (>5s)"
        - "Detect duplicate test logic"
        - "Check assertion quality"
    
    - id: 2
      name: "REFACTORING"
      description: "Improve test quality"
      activities:
        - "Add tests for coverage gaps"
        - "Optimize slow tests (mocking, fixtures)"
        - "Remove duplicate test logic"
        - "Improve assertions (specific, descriptive)"
        - "Add edge case tests"
    
    - id: 3
      name: "VALIDATION"
      description: "Verify test improvements"
      activities:
        - "Run pytest (100% pass required)"
        - "Verify coverage targets met"
        - "Check test performance (<5s per test)"

capabilities:
  - "coverage_gap_analysis"
  - "test_quality_improvement"
  - "fixture_optimization"
  - "assertion_enhancement"

metrics:
  - name: "coverage_before"
    type: "float"
  - name: "coverage_after"
    type: "float"
  - name: "tests_added"
    type: "int"
  - name: "tests_optimized"
    type: "int"

governance:
  rules_enforced:
    - "TDD_ENFORCEMENT"
