# Planning System 4.0 Orchestrator Manifest
# Enhanced planning with tiered routing, pre-planning discovery, visual progress tracking,
# Phase 2.5 agentic enhancements (multi-agent collaboration, evaluation, learning),
# and token-optimized hierarchical plan structure
#
# ⚠️ SYNC REQUIREMENT: When this file is updated, plan structure files MUST also be updated
# Linked Documents:
#   - Status: cortex-brain/documents/planning/active/CORTEX-3.0-4.0/CORTEX4-STATUS.md
#   - Master Hub: cortex-brain/documents/planning/active/CORTEX-3.0-4.0/00-MASTER-PLAN.md
#   - Phases: cortex-brain/documents/planning/active/CORTEX-3.0-4.0/phases/
#   - Metadata: cortex-brain/documents/planning/active/CORTEX-3.0-4.0/metadata/plan-metadata.yaml
# Update Policy: Changes to planning features, phases, or capabilities require synchronization
#
# Version: 4.0.1 (Token-Optimized Structure)
# Author: CORTEX Development Team
# Created: 2025-12-15
# Updated: 2025-12-20 (Token-Optimized Hierarchical Structure)
# Status: ACTIVE - Latest planning system with 95% token reduction
# Orchestrator: src/operations/modules/orchestration/planning_orchestrator.py

schema_version: "1.0"

# ========================================
# Metadata
# ========================================

metadata:
  orchestrator_name: "planning_orchestrator"
  version: "4.0.1"
  description: "Tiered planning system with intelligent routing, visual progress tracking, Phase 2.5 agentic enhancements, and token-optimized hierarchical structure (95% reduction)"
  category: "planning"
  deployment_tier: "cortex"
  status: "active"
  last_updated: "2025-12-20"
  maintainer: "CORTEX Planning Team"
  sync_requirements:
    linked_documents:
      status: "cortex-brain/documents/planning/active/CORTEX-3.0-4.0/CORTEX4-STATUS.md"
      master_hub: "cortex-brain/documents/planning/active/CORTEX-3.0-4.0/00-MASTER-PLAN.md"
      phases: "cortex-brain/documents/planning/active/CORTEX-3.0-4.0/phases/"
      metadata: "cortex-brain/documents/planning/active/CORTEX-3.0-4.0/metadata/plan-metadata.yaml"
      smart_loader: "src/utils/smart_plan_loader.py"
    update_policy: "Bidirectional sync required - changes to planning features must be reflected in all structure files"
    last_synced: "2025-12-20"
  token_optimization:
    enabled: true
    status_only_tokens: 400
    master_hub_tokens: 1200
    phase_specific_tokens: 2500
    reduction_percent: 95
    pattern_version: "1.0"
  related_orchestrators:
    - "maintenance_orchestrator"
    - "contextual_review_orchestrator"
    - "tdd_orchestrator"
  child_orchestrators:
    - name: "tdd_orchestrator"
      manifest: "cortex-brain/manifests/orchestrators/tdd-orchestrator-v4-manifest.yaml"
      relationship: "All planning system plans include TDD phases"
  documentation_path: ".github/prompts/modules/planning-system-guide.md"
  source_file: "src/operations/modules/orchestration/planning_orchestrator.py"

# ========================================
# Core Components
# ========================================

components:
  tiered_routing:
    enabled: true
    source: "src/operations/modules/routing/tiered_router.py"
    description: "4-tier classification system for operation complexity"
    tiers:
      - id: 1
        name: "INSTANT"
        threshold: "< 2 seconds"
        execution_method: "Direct function call"
        planning_required: false
      - id: 2
        name: "LIGHTWEIGHT"
        threshold: "< 10 seconds"
        execution_method: "Inline validation plan"
        planning_required: true
        plan_type: "inline"
      - id: 3
        name: "DOCUMENTED"
        threshold: "10-60 minutes"
        execution_method: "Feature plan (single MD)"
        planning_required: true
        plan_type: "markdown"
      - id: 4
        name: "COMPLEX"
        threshold: "> 1 hour"
        execution_method: "Nested plan (master + sub-plans)"
        planning_required: true
        plan_type: "nested_markdown"

  pre_planning_discovery:
    enabled: true
    source: "src/operations/modules/orchestration/planning_orchestrator.py::pre_planning_discovery()"
    description: "Check for existing/recent plans before creating new ones"
    implementation_task: "Task 1.1 (cortex-rearchitecture-v1)"
    search_folders:
      - folder: "active"
        purpose: "Current work in progress"
        time_range: "all"
      - folder: "temp-plans"
        purpose: "Unapproved/pending work"
        time_range: "last_30_days"
      - folder: "completed"
        purpose: "Recently archived plans (context reuse)"
        time_range: "last_180_days"
    overhead: "30-60 seconds"
    recommendation_types:
      - "active_plan_exists" # Continue existing or create new version
      - "temp_plan_exists" # Approve existing or create new
      - "completed_plan_exists" # Reuse context from completed plan

  visual_progress_tracker:
    enabled: true
    source: "src/orchestrators/session_model.py::PlanningSession"
    description: "Real-time visual progress tracking in responses and plans"
    implementation_tasks:
      - "Task 1.3: PlanningSession integration"
      - "Task 1.4: Phase tracking (record_phase_start/end)"
      - "Task 1.5: Render visual tracker in responses"
      - "Task 1.6: Embed tracker in master plans"
    location: "User responses and master plans (00-master-plan.md)"
    updates: "Real-time during execution"
    metrics_tracked:
      - "phase_timing" # Start/end timestamps per phase
      - "token_consumption" # Tokens used per phase
      - "duration_formatting" # Human-readable durations
      - "progress_percentage" # Completion percentage
      - "tasks_completed" # Task completion ratio
    rendering:
      method: "PlanningSession.render_progress_table()"
      format: "Markdown table"
      includes:
        - "Phase number and name"
        - "Status icons (✅ ⏳ 🔄)"
        - "Progress percentage"
        - "Duration per phase"
        - "Token usage per phase"
        - "Task completion ratio"

  complexity_analyzer:
    enabled: true
    source: "src/operations/modules/routing/complexity_analyzer.py"
    description: "4-dimensional complexity scoring"
    dimensions:
      - "code_impact" # Lines changed, files affected
      - "risk_level" # Dependencies, breaking changes
      - "domain_complexity" # Business logic, algorithms
      - "integration_scope" # External systems, APIs

  temporary_plan_manager:
    enabled: true
    source: "src/operations/modules/orchestration/temporary_plan_manager.py"
    description: "Manage implicit planning workflow"
    lifecycle:
      - "create" # User tasks without "create plan"
      - "feedback" # Optional user refinement
      - "approve" # Move to active/
      - "reject" # Delete from temp-plans/

  autonomous_execution:
    enabled: true
    version: "1.0.0"
    description: "E2E autonomous execution with self-healing and auto-validation"
    implementation_phase: "Phase 0.5 (Week 1)"
    source: "src/orchestrators/autonomous_execution_engine.py"
    modes:
      supervised:
        description: "User approves each phase transition (default)"
        auto_validate: true
        auto_commit: false
        auto_transition: false
        self_healing: false
        user_approval_required: true
      autonomous:
        description: "Full E2E execution with self-healing"
        auto_validate: true
        auto_commit: true
        auto_transition: true
        self_healing: true
        escalation_threshold: 3  # Escalate after 3 failures
        user_approval_required: false

  # ========================================
  # Phase 2.5: Agentic Enhancements (NEW)
  # ========================================

  multi_agent_collaboration:
    enabled: true
    version: "1.0.0"
    description: "Multi-agent patterns for complex operations (sequential, group, nested)"
    implementation_phase: "Phase 2.5 (Week 4-5)"
    source: "src/orchestrators/agent_collaboration_orchestrator.py"
    status: "planned"
    patterns:
      sequential_chat:
        description: "Pipeline processing (writer → SEO → publisher)"
        use_cases:
          - "Code review workflow (security → quality → performance → style)"
          - "Content creation pipeline"
          - "Multi-stage validation"
      group_chat:
        description: "Parallel execution with manager coordination"
        use_cases:
          - "Planning System parallel analysis (complexity + risk + domain + integration)"
          - "Simultaneous document generation"
          - "Multi-perspective code analysis"
      nested_chat:
        description: "Hierarchical team structure"
        use_cases:
          - "System maintenance (healthcheck team + optimization team + docs team)"
          - "Complex feature development with sub-teams"
          - "Cross-domain coordination"

  context_validator:
    enabled: true
    version: "1.0.0"
    description: "Validate context sufficiency before agent execution"
    implementation_phase: "Phase 2.5 (Week 5)"
    source: "src/core/context_validator.py"
    status: "planned"
    capabilities:
      - "Validate required context availability"
      - "Assess context quality"
      - "Identify missing items"
      - "Attempt automatic context retrieval"
      - "Prevent hallucinations via early validation"

  agent_evaluation_framework:
    enabled: true
    version: "1.0.0"
    description: "Evaluate agent reasoning, not just output (LLM-as-judge)"
    implementation_phase: "Phase 2.5 (Week 7-8)"
    source: "src/observability/agent_evaluator.py"
    status: "planned"
    metrics:
      - "decision_quality" # Analyze decision-making process
      - "token_efficiency" # Tokens per quality unit
      - "tool_usage_appropriateness" # Validate tool selection
      - "context_relevance" # Measure context usage effectiveness
      - "reasoning_coherence" # LLM-judge evaluation of reasoning chain
    integration_points:
      - "Planning System: Evaluate plan quality reasoning"
      - "TDD Orchestrator: Evaluate test generation reasoning"
      - "Documentation: Evaluate completeness reasoning"

  agent_learning_engine:
    enabled: true
    version: "1.0.0"
    description: "Learn from operation outcomes to improve future performance"
    implementation_phase: "Phase 2.5 (Week 9-10)"
    source: "src/brain/agent_learning_engine.py"
    status: "planned"
    capabilities:
      - "Track operation outcomes (success/failure)"
      - "Measure strategy success rates"
      - "Learn user preferences"
      - "Suggest optimal approaches based on history"
      - "Adapt to individual working styles"

  enhanced_guardrails:
    enabled: true
    version: "1.0.0"
    description: "Multi-layer security and compliance enforcement"
    implementation_phase: "Phase 2.5 (Week 4-5)"
    source: "src/core/guardrail_orchestrator.py"
    status: "planned"
    layers:
      - "relevance_classifier" # Keep agent on-task
      - "prompt_injection_detection" # Detect jailbreak attempts
      - "pii_filtering" # Protect sensitive data
      - "compliance_checking" # OWASP/CWE enforcement
      - "tool_risk_assessment" # Dynamic risk per tool/context

  adaptive_execution_modes:
    enabled: true
    version: "1.0.0"
    description: "Dynamic execution mode switching based on context"
    implementation_phase: "Phase 2.5 (Week 2)"
    source: "src/orchestrators/execution_mode_manager.py"
    status: "planned"
    modes:
      human_in_loop:
        description: "Pause after each step (teaching/debugging)"
        use_cases: ["First-time users", "Learning CORTEX", "High-risk debugging"]
      supervised:
        description: "Auto-validate, manual approval (default)"
        use_cases: ["Experienced users", "Standard operations", "Quality assurance"]
      autonomous:
        description: "Full E2E with self-healing"
        use_cases: ["Routine operations", "Trusted users", "Automated pipelines"]
    selection_logic:
      - "First 10 operations → human_in_loop"
      - "High-risk operations → supervised"
      - "Routine + high trust score → autonomous"
      - "Repeated failures → escalate to more restrictive mode"

  mcp_community_integration:
    enabled: true
    version: "1.0.0"
    description: "Leverage community MCP servers and expose CORTEX as MCP"
    implementation_phase: "Phase 2.5 (Week 6)"
    source: "src/mcp/community_integration.py"
    status: "planned"
    community_servers:
      - "github_mcp" # GitHub integration via community server
      - "postgres_mcp" # Database access
      - "web_search_mcp" # Google Search for RAG
      - "slack_mcp" # Notifications
    cortex_native_servers:
      - "cortex_brain_server" # Expose brain as MCP tool
      - "cortex_analysis_server" # Code analysis as MCP
      - "cortex_planning_server" # Planning operations as MCP

  cicd_orchestrator:
    enabled: true
    version: "1.0.0"
    description: "AI-driven CI/CD pipeline intelligence"
    implementation_phase: "Phase 2.5 (Week 14-15)"
    source: "src/orchestrators/cicd_orchestrator.py"
    status: "planned"
    agents:
      - "code_review_agent" # Automated PR reviews
      - "self_healing_agent" # Auto-fix test failures
      - "test_generation_agent" # Generate missing tests
      - "release_report_agent" # Automated release notes
    
    phase_lifecycle:
      on_phase_start:
        - "validate_prerequisites"
        - "create_checkpoint"
        - "update_progress_tracker"
      on_phase_complete:
        - "run_validation_gate"
        - "if_pass: commit_work"
        - "if_pass: update_master_plan"
        - "if_pass: create_checkpoint"
        - "if_pass: transition_to_next_phase"
      on_validation_fail:
        - "attempt_self_heal (max 3 retries)"
        - "rollback_to_checkpoint"
        - "log_failure_reason"
        - "escalate_to_user"
      on_critical_error:
        - "emergency_rollback"
        - "save_error_state"
        - "notify_user_immediately"
    
    self_healing_strategies:
      - name: "retry_with_backoff"
        max_attempts: 3
        backoff: "exponential"
        applicable_to: ["transient_errors", "network_issues"]
      - name: "alternative_approach"
        max_attempts: 2
        applicable_to: ["test_failures", "validation_errors"]
      - name: "rollback_and_retry"
        max_attempts: 1
        applicable_to: ["breaking_changes", "integration_failures"]
    
    git_automation:
      enabled: true
      commit_on_phase_complete: true
      push_on_milestone: true
      commit_message_template: "✅ {phase_name} Complete: {summary}\n\n{deliverables}"
      branch_protection: true  # Require validation before push
    
    progress_monitoring:
      real_time_updates: true
      decision_making: true  # Progress tracker can make phase transition decisions
      metrics_tracked:
        - "phase_completion_percentage"
        - "validation_gate_status"
        - "test_pass_rate"
        - "error_count"
        - "token_consumption"
      thresholds:
        phase_complete: 100  # % completion required
        validation_pass: 100  # % tests passing required
        error_tolerance: 0  # Max errors before escalation
    
    commands:
      execute_autonomous:
        syntax: "cortex execute plan --mode=autonomous [--from=PHASE] [--to=PHASE]"
        description: "Execute plan end-to-end with autonomous mode"
        examples:
          - "cortex execute plan --mode=autonomous"
          - "cortex execute plan --mode=autonomous --from=phase_1 --to=phase_3"
      execute_supervised:
        syntax: "cortex execute plan --mode=supervised"
        description: "Execute plan with user approval at each phase (default)"

