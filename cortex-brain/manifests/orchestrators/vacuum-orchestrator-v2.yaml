# Vacuum Orchestrator v2 Manifest - Pure Autonomous Filesystem Cleanup
# Author: Asif Hussain
# Copyright © 2025-2026 Asif Hussain. All rights reserved.

schema_version: "5.0"

orchestrator:
  name: "vacuum_orchestrator"
  version: "2.0"
  type: "autonomous"
  description: "Pure autonomous filesystem cleanup with transactional safety"
  implementation: "src/orchestrators/vacuum/vacuum_orchestrator_v2.py"
  base_class: "BaseOrchestratorV4_1"
  
  # Workflow phases (6 total)
  phases:
    - id: 1
      name: "DISCOVERY"
      description: "Filesystem traversal and file categorization"
    - id: 2
      name: "ANALYSIS"
      description: "Duplicate detection, orphan identification, space calculation"
    - id: 3
      name: "PLANNING"
      description: "Safety validation, risk classification, conflict resolution"
    - id: 4
      name: "APPROVAL"
      description: "User preview (dry-run) or confirmation (if not auto-approved)"
    - id: 5
      name: "EXECUTION"
      description: "Atomic filesystem operations with checkpoint backup"
    - id: 6
      name: "COMPLETION"
      description: "Validation, report generation, checkpoint verification"

# Execution instructions for GitHub Copilot (when interpreting this manifest)
execution_instructions:
  progress_reporting:
    mode: "concise"
    policy:
      - "Display progress ONLY at phase boundaries"
      - "DO NOT narrate task completions"
      - "Update progress bar silently"
  accessibility:
    wcag_alignment: "AA"
    display_frequency:
      phase_start: "Show phase name + progress (3 lines)"
      task_completion: "SILENT"
      phase_completion: "Show completed + next (5 lines)"
      overall_completion: "Summary (≤40 lines)"

# Cleanup Categories (10 total)
cleanup_categories:
  
  # 1. Temporary Files (HIGH priority)
  temp_files:
    priority: "HIGH"
    description: "Temporary files, swap files, backup files"
    patterns:
      - "*.tmp"
      - "*.temp"
      - "*.swp"
      - "*.swo"
      - "*.bak"
      - "*.backup"
      - "~*"
      - "*~"
      - ".~*"
    max_age_days: 7  # Only delete if older than 7 days
    
  # 2. Build Artifacts (HIGH priority)
  build_artifacts:
    priority: "HIGH"
    description: "Compiled binaries, build outputs, dependency caches"
    patterns:
      - "bin/"
      - "obj/"
      - "target/"
      - "build/"
      - "dist/"
      - "out/"
      - "__pycache__/"
      - "*.pyc"
      - "*.pyo"
      - "*.class"
      - "*.o"
      - "*.obj"
      - "*.exe"
      - "*.dll"
      - "*.so"
      - "*.dylib"
    exclusions:
      - "bin/KEEP"  # Preserve explicitly kept binaries
  
  # 3. Package Manager Caches (HIGH priority)
  package_caches:
    priority: "HIGH"
    description: "npm, pip, yarn, maven caches"
    patterns:
      - "node_modules/.cache/"
      - ".npm/"
      - ".yarn/cache/"
      - "pip-cache/"
      - ".m2/repository/"
    size_threshold_mb: 100  # Only clean if >100MB
  
  # 4. IDE Metadata (MEDIUM priority)
  ide_metadata:
    priority: "MEDIUM"
    description: "IDE workspace files, settings (non-critical)"
    patterns:
      - ".vs/"
      - ".vscode/settings.json"
      - ".idea/"
      - "*.suo"
      - "*.user"
      - "*.userosscache"
    exclusions:
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".vscode/extensions.json"
  
  # 5. Log Files (MEDIUM priority)
  log_files:
    priority: "MEDIUM"
    description: "Application logs, debug logs"
    patterns:
      - "*.log"
      - "logs/"
      - "*.log.*"
    max_age_days: 30
    max_size_mb: 10
  
  # 6. Cache Files (MEDIUM priority)
  cache_files:
    priority: "MEDIUM"
    description: "Application caches, thumbnail caches"
    patterns:
      - ".cache/"
      - "cache/"
      - "*.cache"
      - "Thumbs.db"
      - ".DS_Store"
    max_age_days: 14
  
  # 7. Test Coverage Reports (MEDIUM priority)
  test_coverage:
    priority: "MEDIUM"
    description: "Test coverage HTML reports, .coverage files"
    patterns:
      - "htmlcov/"
      - ".coverage"
      - "coverage.xml"
      - ".pytest_cache/"
      - ".tox/"
  
  # 8. Duplicates (MEDIUM priority - requires confirmation)
  duplicates:
    priority: "MEDIUM"
    description: "Duplicate files (exact hash matches)"
    algorithm: "hash_based"  # Uses DuplicateDetector
    similarity_threshold: 1.0  # Exact match only
    min_file_size: 1024  # 1KB minimum
    keep_strategy: "newest"  # Keep newest file by default
    require_confirmation: true
  
  # 9. Orphaned Files (LOW priority - requires confirmation)
  orphans:
    priority: "LOW"
    description: "Orphaned test files (missing source files)"
    detection: "ast_analysis"  # Uses OrphanDetector
    require_confirmation: true
  
  # 10. Empty Directories (LOW priority)
  empty_directories:
    priority: "LOW"
    description: "Empty directories (no files inside)"
    patterns:
      - "*/"  # Any directory
    exclude_if_has_git: true  # Keep if contains .git

# Safety Rules (SKULL: Brain Protection)
safety:
  
  # Critical file patterns (NEVER DELETE)
  critical_patterns:
    - ".git/**"
    - ".gitignore"
    - ".gitattributes"
    - ".gitmodules"
    - ".github/**"
    - "*.py"
    - "*.js"
    - "*.ts"
    - "*.jsx"
    - "*.tsx"
    - "*.java"
    - "*.c"
    - "*.cpp"
    - "*.h"
    - "*.cs"
    - "*.go"
    - "*.rs"
    - "*.rb"
    - "*.php"
    - "*.html"
    - "*.css"
    - "*.scss"
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "*.toml"
    - "*.ini"
    - "*.conf"
    - "*.config"
    - "*.md"
    - "*.rst"
    - "*.txt"
    - "requirements.txt"
    - "package.json"
    - "pyproject.toml"
    - "Dockerfile"
    - "README*"
    - "LICENSE*"
    - "CHANGELOG*"
    - "CONTRIBUTING*"
  
  # CORTEX brain critical paths (NEVER DELETE)
  cortex_critical_paths:
    - "cortex-brain/tier0"
    - "cortex-brain/tier1"
    - "cortex-brain/tier2"
    - "cortex-brain/tier3"
    - "cortex-brain/database"
    - "cortex-brain/manifests"
    - "cortex-brain/config"
    - "cortex-brain/knowledge-graph.yaml"
    - "cortex-brain/lessons-learned.yaml"
    - "cortex-brain/development-context.yaml"
  
  # CORTEX brain safe paths (can clean)
  cortex_safe_paths:
    - "cortex-brain/cache"
    - "cortex-brain/logs"
    - "cortex-brain/cleanup-reports"
    - "cortex-brain/archives"
    - "cortex-brain/cleanup-logs"
  
  # Size threshold (warn if total deletion >1GB)
  size_threshold_mb: 1000
  
  # Require user confirmation for:
  require_confirmation:
    - duplicates
    - orphans
    - large_deletions  # >1GB
  
  # Recently modified files (warn if <24h)
  recent_modification_hours: 24
  
  # Git integration (detect uncommitted changes)
  check_git_status: true

# Global Exclusions (NEVER SCAN THESE)
exclusions:
  - ".git"
  - ".github"
  - "node_modules"
  - "venv"
  - "env"
  - ".venv"
  - ".env"
  - "site-packages"
  - "Library"
  - "AppData"
  - "System"
  - "Windows"
  - "Program Files"

# Output Templates (Jinja2)
output_templates:
  dry_run_report: "templates/vacuum/dry-run-report.jinja2"
  completion_report: "templates/vacuum/completion-report.jinja2"
  checkpoint_manifest: "templates/vacuum/checkpoint-manifest.jinja2"

# Execution Options
execution:
  default_mode: "dry_run"  # Always default to dry-run
  checkpoint_enabled: true
  parallel_processing: false  # Single-threaded for safety
  max_workers: 1

# Response Templates
response_templates:
  hand_off: "autonomous_execution_progress"
  completion: "completion_with_next_steps"

# Integration
integration:
  master_orchestrator: true  # Registered with Master Orchestrator v4
  command_patterns:
    - "vacuum [path]"
    - "deep clean [path]"
    - "organize files [path]"
