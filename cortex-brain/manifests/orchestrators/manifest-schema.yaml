# Orchestrator Manifest Schema
# Universal schema for all CORTEX orchestrators to prevent drift and ensure compliance
#
# Version: 1.0
# Author: CORTEX Development Team
# Updated: 2025-12-08

schema_version: "1.0"
description: |
  Universal manifest schema for CORTEX orchestrators. Each orchestrator MUST have a manifest
  that defines its requirements, integrations, quality gates, and expected behavior.
  
  Prevents drift by:
  - Defining expected features in central location
  - Validating orchestrator compliance at runtime
  - Ensuring consistency across similar orchestrators (planning/ADO/TDD)
  - Enabling automated drift detection via healthcheck

# ========================================
# Manifest Structure Definition
# ========================================

manifest_structure:
  metadata:
    description: "Orchestrator identification and versioning"
    required_fields:
      - orchestrator_name          # Unique orchestrator identifier
      - version                    # Semantic version (x.y.z)
      - description                # One-line purpose
      - category                   # planning|execution|analysis|deployment|maintenance
      - deployment_tier            # admin|user|dual_context
      - status                     # draft|active|deprecated
      - last_updated               # ISO 8601 date
      - maintainer                 # Team/person responsible
    optional_fields:
      - related_orchestrators      # List of dependent orchestrators
      - documentation_path         # Link to detailed guide
      - changelog_path             # Link to version history

  requirements:
    description: "Feature requirements that MUST be implemented"
    structure:
      - requirement_id             # Unique ID (REQ-001)
        name                       # Short name
        description                # Detailed requirement
        priority                   # critical|high|medium|low
        status                     # implemented|partial|missing
        validation_method          # How to verify (method_exists|integration_test|manual)
        validation_criteria        # Specific check (e.g., method name, test path)
        implementation_notes       # Where/how it's implemented
        
  integrations:
    description: "Required orchestrator/agent integrations"
    structure:
      - integration_id             # Unique ID (INT-001)
        target_component           # Component to integrate (orchestrator/agent name)
        integration_type           # required|optional|conditional
        trigger_condition          # When integration activates
        expected_behavior          # What should happen
        validation_method          # How to verify
        
  quality_gates:
    description: "Approval gates and validation checkpoints"
    structure:
      - gate_id                    # Unique ID (GATE-001)
        name                       # Gate name
        gate_type                  # approval|validation|security|compliance
        trigger_point              # When gate activates (phase, step)
        blocking                   # true|false (blocks execution if failed)
        validation_criteria        # What must pass
        bypass_conditions          # Conditions allowing bypass (if any)
        
  workflows:
    description: "Expected workflow phases and steps"
    structure:
      - workflow_id                # Unique ID (WF-001)
        name                       # Workflow name
        phases:                    # List of phases
          - phase_id               # Unique phase ID
            name                   # Phase name
            sequence                # Execution order
            required               # true|false
            steps:                 # List of steps
              - step_id            # Unique step ID
                name               # Step name
                required           # true|false
                validation         # How to verify completion
                
  response_templates:
    description: "Required response template features"
    structure:
      - template_id                # Unique ID (TPL-001)
        template_name              # Template name in response-templates.yaml
        required_sections          # List of required sections
        progress_visualization     # true|false (needs progress bars)
        interactive_elements       # List of interactive features needed
        
  compliance_rules:
    description: "SKULL and governance rules that apply"
    structure:
      - rule_id                    # Rule ID from brain-protection-rules.yaml
        enforcement_level          # mandatory|recommended|optional
        validation_method          # How to check compliance
        
# ========================================
# Validation Configuration
# ========================================

validation:
  on_initialization:
    description: "Checks run when orchestrator initializes"
    enabled: true
    actions:
      - load_manifest
      - validate_schema_compliance
      - check_requirement_status
      - verify_integrations
      - log_missing_features
      
  on_execution:
    description: "Runtime compliance checks"
    enabled: true
    actions:
      - validate_quality_gates
      - enforce_workflow_sequence
      - verify_template_rendering
      - check_integration_triggers
      
  on_healthcheck:
    description: "Periodic compliance validation"
    enabled: true
    actions:
      - scan_all_manifests
      - compare_implementation_vs_manifest
      - generate_drift_report
      - flag_missing_requirements
      
# ========================================
# Extensibility Configuration
# ========================================

extensibility:
  custom_sections:
    description: "Orchestrators can add custom sections"
    allowed: true
    naming_convention: "custom_*"
    validation: "warn_if_not_documented"
    
  manifest_inheritance:
    description: "Manifests can inherit from base manifests"
    allowed: true
    inheritance_key: "inherits_from"
    merge_strategy: "child_overrides_parent"
    
  version_compatibility:
    description: "Schema version compatibility rules"
    backward_compatible_versions: ["1.0"]
    breaking_change_policy: "major_version_increment"
    
# ========================================
# Default Values
# ========================================

defaults:
  requirement_priority: "medium"
  integration_type: "optional"
  gate_blocking: true
  validation_method: "manual"
  enforcement_level: "recommended"
  
# ========================================
# Example Usage
# ========================================

example_manifest_snippet: |
  metadata:
    orchestrator_name: "planning_system"
    version: "2.0.0"
    category: "planning"
    status: "active"
    
  requirements:
    - requirement_id: "REQ-001"
      name: "Interactive DoR Workflow"
      description: "User must interactively refine DoR items before plan approval"
      priority: "critical"
      status: "implemented"
      validation_method: "method_exists"
      validation_criteria: "PlanningOrchestrator.refine_dor_interactive()"
      
  integrations:
    - integration_id: "INT-001"
      target_component: "review_orchestrator"
      integration_type: "required"
      trigger_condition: "before_planning_starts"
      expected_behavior: "Run architectural review, use score in plan metadata"
      validation_method: "integration_test"
      
  quality_gates:
    - gate_id: "GATE-001"
      name: "Acceptance Criteria Approval"
      gate_type: "approval"
      trigger_point: "after_phase_3_before_execution"
      blocking: true
      validation_criteria: "User explicitly approves acceptance criteria"
      bypass_conditions: ["autonomous_execution_mode"]
