schema_version: "5.0"

orchestrator:
  name: "refactor_documentation"
  version: "1.0.0"
  type: "autonomous"
  parent_orchestrator_id: "refactor_orchestrator"
  description: "Documentation improvements: docstrings, type hints, comments, README"
  implementation: "src/orchestrators/refactor/documentation_refactor.py"
  base_class: "BaseOrchestratorV4_1"
  
  phases:
    - id: 1
      name: "ANALYSIS"
      description: "Analyze documentation quality"
      activities:
        - "Check docstring coverage (pydocstyle)"
        - "Validate type hints (mypy --strict)"
        - "Find missing Google-style docstrings"
        - "Check README completeness"
    
    - id: 2
      name: "REFACTORING"
      description: "Improve documentation"
      activities:
        - "Add missing docstrings (Google style)"
        - "Add missing type hints"
        - "Update outdated docstrings"
        - "Synchronize README with code"
    
    - id: 3
      name: "VALIDATION"
      description: "Verify documentation quality"
      activities:
        - "Run pydocstyle (100% pass required)"
        - "Run mypy --strict (zero errors)"
        - "Validate Google-style format"

capabilities:
  - "docstring_generation"
  - "google_style_enforcement"
  - "type_hint_validation"
  - "readme_synchronization"

metrics:
  - name: "docstring_coverage_before"
    type: "float"
  - name: "docstring_coverage_after"
    type: "float"
  - name: "type_hint_coverage_before"
    type: "float"
  - name: "type_hint_coverage_after"
    type: "float"

governance:
  rules_enforced:
    - "PYTHON_DOCSTRINGS_MANDATORY"
    - "PYTHON_TYPE_HINTS_MANDATORY"
