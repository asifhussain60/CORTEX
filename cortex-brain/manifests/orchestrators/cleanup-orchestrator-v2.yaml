# Cleanup Orchestrator v2 Configuration Manifest

schema_version: "5.0"

orchestrator:
  name: "cleanup_orchestrator_v2"
  version: "2.0.0"
  type: "autonomous"
  description: "Autonomous cleanup with selective modes (cache/logs/artifacts/full/git)"
  base_orchestrator: "v4.1"
  autonomous: true

# Execution instructions for GitHub Copilot (when interpreting this manifest)
execution_instructions:
  progress_reporting:
    mode: "concise"
    policy:
      - "Display progress ONLY at phase boundaries"
      - "DO NOT narrate task completions"
      - "Update progress bar silently"
  accessibility:
    wcag_alignment: "AA"
    display_frequency:
      phase_start: "Show phase name + progress (3 lines)"
      task_completion: "SILENT"
      phase_completion: "Show completed + next (5 lines)"
      overall_completion: "Summary (≤40 lines)"

# Cleanup modes
modes:
  cache:
    description: "Clean cache directories only (HIGH priority, safe, fast)"
    categories:
      - "python_cache"
      - "cache"
      - "sweeper"
      - "temp_directories"
      - "empty_directories"
    priority: "HIGH"
    confirmation_required: false
    estimated_duration_seconds: 10
    expected_space_freed_mb: 1000
    risk_level: "low"
  
  logs:
    description: "Manage logs (rotation, archiving, deletion)"
    categories:
      - "logs"
      - "build_output"
      - "session_summaries"
      - "system_refactor_reports"
      - "duplicate_cleanup_reports"
    priority: "MEDIUM"
    confirmation_required: true
    log_rotation_threshold_mb: 10
    archive_after_days: 30
    estimated_duration_seconds: 10
    expected_space_freed_mb: 250
    risk_level: "medium"
  
  artifacts:
    description: "Remove build artifacts and backups"
    categories:
      - "backup_archive"
      - "story_backups"
      - "phase_reports"
      - "workflow_checkpoints"
      - "legacy_agent_backups"
      - "docs_awakening_backups"
      - "root_clutter"
      - "copilot_chats_clutter"
      - "temp_historical_docs"
      - "root_phase_documentation"
      - "root_validation_scripts"
      - "root_backup_files"
      - "root_test_outputs"
      - "redundant_alignment_reports"
      - "doc_pattern_cleanup"
    priority: "MEDIUM"
    confirmation_required: true
    retention_days: 30
    estimated_duration_seconds: 60
    expected_space_freed_mb: 2500
    risk_level: "medium"
  
  full:
    description: "Full cleanup (cache + logs + artifacts)"
    includes:
      - "cache"
      - "logs"
      - "artifacts"
    priority: "MEDIUM"
    confirmation_required: true
    estimated_duration_seconds: 80
    expected_space_freed_mb: 3750
    risk_level: "medium"
  
  git:
    description: "Git repository optimization (gc, prune, repack)"
    operations:
      - "gc"
      - "prune"
      - "repack"
    priority: "LOW"
    confirmation_required: false
    estimated_duration_seconds: 180
    expected_space_freed_mb: 100
    risk_level: "low"

# Cleanup rules reference
rules_file: "cortex-brain/cleanup-rules.yaml"

# Protected directories (NEVER deleted)
protected_directories:
  - "cortex-brain/tier1"
  - "cortex-brain/tier2"
  - "cortex-brain/tier3"
  - "cortex-brain/lessons-learned.yaml"
  - "cortex-brain/knowledge-graph.yaml"
  - "cortex-brain/user-dictionary.yaml"
  - "cortex-brain/documents"
  - ".git"
  - "src"
  - "tests"
  - "cortex-brain/manifests"
  - "cortex-brain/config"
  - "cortex-brain/templates"

# Protected patterns (glob patterns)
protected_patterns:
  - "**/copilot_instructions"
  - "**/named_templates/**"
  - "**/*.db"
  - ".git/**"

# Safety settings
safety:
  max_recursion_depth: 15
  require_git_clean: false
  create_rollback_manifest: true
  permission_check: true

# Template configuration
templates:
  base_path: "cortex-brain/templates"
  cleanup_report: "cleanup-report.jinja2"
  log_rotation_report: "log-rotation-report.jinja2"

# Execution settings
execution:
  token_warning_threshold: 80000
  auto_proceed: true
  parallel_execution: false
  dry_run_available: false  # Always live mode

# Integration points
integration:
  master_orchestrator: true
  maintenance_pipeline: true
  cli_invocation: true

# Reporting
reporting:
  generate_manifest: true
  manifest_path: "cortex-brain/cleanup-reports"
  save_session_state: true
  log_level: "INFO"

# Metadata
metadata:
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."
  created: "2026-01-02"
  migrated_from: "src/plugins/cleanup_orchestrator.py"
  maintenance_phase: 2
