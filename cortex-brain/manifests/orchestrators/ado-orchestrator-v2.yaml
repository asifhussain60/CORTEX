# ADO Orchestrator v2 Configuration Manifest
# Pure config-only YAML - NO natural language instructions
# All execution logic in Python code

schema_version: "5.0"
version: "2.0.0"
orchestrator:
  name: "ado_orchestrator_v2"
  version: "2.0.0"
  type: "autonomous"
base_class: BaseOrchestratorV4_1

# ==================================================
# WORK ITEM TYPES
# ==================================================
work_item_types:
  story:
    type_name: "User Story"
    prefix: "US"
    story_points_mapping:
      low: 1
      medium: 3
      high: 8
      very_high: 13
    default_story_points: 3
    fields:
      - title
      - description
      - acceptance_criteria
      - story_points
      - priority
      - state
  
  task:
    type_name: "Task"
    prefix: "T"
    effort_unit: "hours"
    fields:
      - title
      - description
      - estimated_hours
      - assigned_to
      - state
  
  bug:
    type_name: "Bug"
    prefix: "B"
    severity_levels: [critical, high, medium, low]
    fields:
      - title
      - description
      - steps_to_reproduce
      - severity
      - priority

# ==================================================
# COMPLEXITY ANALYSIS
# ==================================================
complexity:
  thresholds:
    low:
      keywords: [simple, basic, minor, small, trivial, quick]
      max_words: 10
      max_criteria: 2
      story_points: 1
    
    medium:
      keywords: [moderate, standard, typical, normal, regular]
      max_words: 25
      max_criteria: 5
      story_points: 3
    
    high:
      keywords: [complex, advanced, significant, major, comprehensive]
      max_words: 50
      max_criteria: 10
      story_points: 8
    
    very_high:
      keywords: [critical, enterprise, large-scale, architectural, multi-system]
      max_words: 100
      max_criteria: 20
      story_points: 13
  
  default_complexity: medium
  
  analysis_factors:
    - word_count
    - keyword_matching
    - acceptance_criteria_count
    - dependencies_count
    - integration_points

# ==================================================
# WORK ITEM HIERARCHY
# ==================================================
hierarchy:
  story_breakdown:
    task_templates:
      - name: "Requirements Analysis"
        condition: "always"
        estimate_hours: 2
        description_template: "Analyze and document requirements for {feature_name}"
      
      - name: "Design & Architecture"
        condition: "complexity >= MEDIUM"
        estimate_hours: 4
        description_template: "Design solution architecture for {feature_name}"
      
      - name: "Implementation"
        condition: "always"
        estimate_hours: 8
        description_template: "Implement core functionality for {feature_name}"
      
      - name: "Unit Testing"
        condition: "always"
        estimate_hours: 4
        description_template: "Write unit tests for {feature_name}"
      
      - name: "Integration Testing"
        condition: "complexity >= MEDIUM"
        estimate_hours: 3
        description_template: "Write integration tests for {feature_name}"
      
      - name: "Code Review"
        condition: "always"
        estimate_hours: 2
        description_template: "Conduct code review for {feature_name}"
      
      - name: "Documentation"
        condition: "always"
        estimate_hours: 2
        description_template: "Document implementation for {feature_name}"
      
      - name: "Performance Testing"
        condition: "complexity == HIGH"
        estimate_hours: 4
        description_template: "Performance test and optimize {feature_name}"
  
  parent_child_linking:
    enabled: true
    link_type: "parent"

# ==================================================
# TDD (TEST-DRIVEN DEVELOPMENT)
# ==================================================
tdd:
  enabled: true
  enforcement_level: "recommended"  # strict, recommended, optional
  
  test_requirements:
    unit_tests:
      required: true
      coverage_target: 80
      template: |
        Unit tests must cover:
        - All public methods
        - Edge cases and error conditions
        - Input validation
        Target coverage: {coverage_target}%
    
    integration_tests:
      required_for_complexity: ["MEDIUM", "HIGH", "VERY_HIGH"]
      template: |
        Integration tests must verify:
        - API endpoints functionality
        - Database interactions
        - External service integrations
    
    acceptance_tests:
      required: true
      template: |
        Acceptance tests must validate:
        - All acceptance criteria met
        - User workflows functional
        - No regression issues
  
  test_first_workflow:
    enabled: true
    phases:
      - "Write failing test"
      - "Implement minimal code"
      - "Refactor with confidence"

# ==================================================
# DEFINITION OF READY (DOR)
# ==================================================
definition_of_ready:
  required_fields:
    - acceptance_criteria
    - assumptions
    - constraints
  
  completeness_calculation:
    weights:
      acceptance_criteria: 0.5
      assumptions: 0.25
      constraints: 0.25
    
    thresholds:
      complete: 0.90
      acceptable: 0.70
      incomplete: 0.50
  
  validation_rules:
    acceptance_criteria:
      min_count: 1
      max_count: 20
      format: "Given-When-Then or User Story format"
    
    assumptions:
      min_count: 0
      recommended_min: 1
      format: "Clear assumption statements"
    
    constraints:
      min_count: 0
      recommended_min: 1
      format: "Technical or business constraints"

# ==================================================
# DEFINITION OF DONE (DOD)
# ==================================================
definition_of_done:
  required_items:
    - "Code complete and reviewed"
    - "Unit tests passing"
    - "Integration tests passing"
    - "Documentation updated"
    - "No critical bugs"
  
  optional_items:
    - "Performance benchmarks met"
    - "Security review completed"
    - "Accessibility standards met"
    - "Deployed to staging"

# ==================================================
# APPROVAL GATE
# ==================================================
approval:
  enabled: true
  skip_if_auto_approve: true
  
  preview_format: "markdown_table"
  
  approval_options:
    - approve
    - reject
    - request_changes
  
  timeout_seconds: 300  # 5 minutes
  default_action: "reject"  # If timeout reached

# ==================================================
# ADO API CONFIGURATION
# ==================================================
ado_specific:
  api_version: "7.0"
  organization_url: "${ADO_ORGANIZATION_URL}"
  project: "${ADO_PROJECT}"
  
  authentication:
    type: "PAT"  # Personal Access Token
    token_env_var: "ADO_PAT"
  
  work_item_creation:
    batch_size: 10
    retry_attempts: 3
    retry_delay_seconds: 2
    timeout_seconds: 30
  
  field_mappings:
    title: "System.Title"
    description: "System.Description"
    state: "System.State"
    assigned_to: "System.AssignedTo"
    story_points: "Microsoft.VSTS.Scheduling.StoryPoints"
    priority: "Microsoft.VSTS.Common.Priority"
    acceptance_criteria: "Microsoft.VSTS.Common.AcceptanceCriteria"
  
  default_values:
    state: "New"
    priority: 2
    area_path: "${ADO_AREA_PATH}"
    iteration_path: "${ADO_ITERATION_PATH}"

# ==================================================
# TEMPLATE PATHS
# ==================================================
templates:
  work_item_preview: "templates/ado/work-item-preview.jinja2"
  approval_gate: "templates/ado/approval-gate.jinja2"
  completion_message: "templates/ado/completion-message.jinja2"
  error_message: "templates/ado/error-message.jinja2"
  
  base_template_dir: "templates/ado"

# ==================================================
# EXECUTION PHASES
# ==================================================
phases:
  discovery:
    enabled: true
    timeout_seconds: 60
    retry_on_failure: true
    
  validation:
    enabled: true
    timeout_seconds: 120
    skip_if_test_mode: false
    
  generation:
    enabled: true
    timeout_seconds: 60
    
  approval:
    enabled: true
    skip_if_auto_approve: true
    timeout_seconds: 300
    
  execution:
    enabled: true
    skip_if_test_mode: true
    timeout_seconds: 180
    
  completion:
    enabled: true
    timeout_seconds: 30

# ==================================================
# ERROR HANDLING
# ==================================================
error_handling:
  retry_policy:
    max_retries: 3
    backoff_multiplier: 2
    initial_delay_seconds: 1
  
  rollback_on_failure: true
  
  error_categories:
    - network_error
    - authentication_error
    - validation_error
    - api_error
    - timeout_error

# ==================================================
# METRICS & LOGGING
# ==================================================
metrics:
  enabled: true
  collection_interval_seconds: 10
  
  tracked_metrics:
    - execution_time_seconds
    - phase_durations
    - work_items_created
    - success_rate
    - error_count
    - retry_count
  
  export_format: "jsonl"
  export_path: "cortex-brain/metrics/ado_orchestrator_metrics.jsonl"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "structured"
  include_timestamps: true
  include_context: true

# ==================================================
# FEATURE FLAGS
# ==================================================
features:
  wizard_mode: true
  vision_api_integration: true
  duplicate_detection: true
  review_orchestrator_integration: true
  database_state_tracking: true
  template_rendering: true
  master_orchestrator_integration: true

# ==================================================
# VALIDATION RULES
# ==================================================
validation:
  feature_name:
    min_length: 3
    max_length: 200
    pattern: "^[a-zA-Z0-9\\s\\-_:]+$"
  
  acceptance_criteria:
    min_count: 1
    max_count: 20
    min_length_per_criterion: 10
  
  story_points:
    allowed_values: [1, 2, 3, 5, 8, 13, 21]
    default: 3

# ==================================================
# MASTER ORCHESTRATOR INTEGRATION
# ==================================================
master_orchestrator:
  enabled: true
  
  routing_patterns:
    auto_mode:
      - "^ado\\s+story\\s+.+$"
      - "^ado\\s+feature\\s+.+$"
      - "^create\\s+ado\\s+.+$"
    
    wizard_mode:
      - "^ado\\s+wizard\\s+.+$"
      - "^ado\\s+interactive\\s+.+$"
  
  priority: 30
  confidence_threshold: 0.9
