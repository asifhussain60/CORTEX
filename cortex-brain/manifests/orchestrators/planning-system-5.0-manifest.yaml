# Planning System v5.0 Manifest
# Pure config-only manifest with zero natural language execution logic

schema_version: "5.0"

orchestrator:
  name: "planning_v5"
  version: "5.0"
  type: "autonomous"
  description: "Structured planning system with context discovery and state tracking"
  class: "PlanningOrchestratorV5"
  module: "src.orchestrators.planning.planning_orchestrator_v5"

# Folder structure template
folder_structure:
  root: "cortex-brain/documents/planning/active/{plan_name}/"
  
  naming_conventions:
    folders: "lowercase-kebab-case"  # Example: epic-structure-cleanup, test-coverage-sprint
    files: "kebab-case-with-prefix"  # Example: 00-epic-structure-cleanup.md, planViewer.html
    reasoning: "Consistency with existing CORTEX structure, filesystem compatibility"
  
  subfolders:
    - name: "analysis"
      description: "Deep analysis, architecture review, and investigation reports"
    - name: "artifacts"
      description: "Generated code, configs, and outputs"
    - name: "context"
      description: "Context discovery and background documents"
    - name: "reports"
      description: "Progress and completion reports"
    - name: "tracking"
      description: "Progress tracker and state snapshots"
  
  required_files:
    - path: "00-{plan-name}.md"
      type: "plan"
      description: "Master plan document with meaningful name (e.g., 00-glassmorphism.md)"
    - path: "README.md"
      type: "documentation"
      description: "Quick start guide"
    - path: "tracking/progress-tracker.json"
      type: "state"
      description: "JSON progress tracker (FEATURE mode) or epic-progress-tracker.json (EPIC mode)"
    - path: "tracking/CONTINUATION-PROMPT.md"
      type: "documentation"
      description: "Session continuation prompt for token limit management"
  
  generated_on_approval:
    - path: "plan-viewer.html"
      type: "viewer"
      description: "Universal HTML viewer - auto-detects EPIC vs FEATURE mode from folder structure"
      generation_phase: "approval"  # Generated when plan approved for execution, NOT during planning
      mode_detection: "automatic"  # Reads epic-progress-tracker.json (EPIC) or progress-tracker.json (FEATURE)

# Execution instructions for GitHub Copilot (when interpreting this manifest)
execution_instructions:
  progress_reporting:
    mode: "concise"  # Options: "concise" (default), "verbose"
    policy:
      - "Display progress ONLY at phase boundaries (start/completion)"
      - "DO NOT narrate individual task completions to user"
      - "DO NOT show 'Now I'll...', 'Perfect!', 'Excellent!' commentary"
      - "Update progress bar silently between phases"
      - "Use verbose mode ONLY if user explicitly requests detailed output"
  
  accessibility:
    wcag_alignment: "AA"
    cognitive_load_management:
      - "Users with reading difficulties: minimize text output"
      - "Autonomous execution is silent except at phase milestones"
      - "Completion summary: ≤40 lines (not 150+)"
      - "No redundant progress tables (show once at beginning, once at end)"
    
    display_frequency:
      phase_start: "Show phase name + overall progress bar (3 lines)"
      task_completion: "SILENT - no user-facing output"
      phase_completion: "Show completed phase + next phase (5 lines)"
      overall_completion: "Summary table with key metrics (≤40 lines)"

# Execution phases (config-only, Python implements logic)
# CORTEX v5 Universal Pattern: Phase -2 (Setup), Phase 0-N (Work), Phase N+1 (Teardown + REFACTOR)
phases:
  - number: -2
    name: "Setup Verification"
    description: "Verify dependencies met, detect false positives, check cache state"
    estimated_duration_hours: 0.1
    required: true
    middleware: "src.orchestrators.middleware.setup_verification.SetupVerifier"
    validation:
      dependency_check:
        enabled: true
        method: "implementation_test"  # Not just file existence
        false_positive_detection: true
        exit_on_failure: true
      cache_check:
        enabled: true
        vscode_cache_clear_threshold: "30_days_inactive"
        force_clear_on_brittleness: true
      governance_check:
        enabled: true
        validate_skull_rules: true
        check_tier0_compliance: true
    outputs:
      - "analysis/setup-verification-report.md"
      - "tracking/dependency-validation.json"
  
  - number: 0
    name: "Context Discovery"
    description: "Search workspace for relevant files and patterns"
    estimated_duration_hours: 0.5
    outputs:
      - "context/discovery.md"
    
  - number: 1
    name: "Architecture Analysis"
    description: "Parse codebase and analyze dependencies"
    estimated_duration_hours: 0.5
    outputs:
      - "context/architecture-analysis.md"
  
  - number: 2
    name: "Plan Generation"
    description: "Generate master plan document from templates"
    estimated_duration_hours: 1.0
    outputs:
      - "00-master-plan.md"
      - "README.md"
  
  - number: 3
    name: "Folder Creation"
    description: "Create directory structure (5 subfolders: analysis, artifacts, context, reports, tracking)"
    estimated_duration_hours: 0.1
    outputs:
      - "analysis/"
      - "artifacts/"
      - "context/"
      - "reports/"
      - "tracking/"
  
  - number: 4
    name: "Validation"
    description: "Validate plan structure and content"
    estimated_duration_hours: 0.2
    outputs:
      - "reports/validation-report.md"
  
  - number: 999
    name: "Teardown + REFACTOR + Commit"
    description: "Whole-file cleanup, remove orphaned code, git commit with /cortex-git-commit"
    estimated_duration_hours: 0.3
    required: true
    middleware: "src.orchestrators.middleware.teardown_refactor.TeardownRefactor"
    phases:
      - name: "REFACTOR"
        description: "Whole-file cleanup of all modified files"
        cleanup_rules:
          - "Remove unused imports"
          - "Remove orphaned code"
          - "Remove duplicate functions"
          - "Consolidate redundant logic"
          - "Update docstrings"
          - "Format code (black/prettier)"
        validation:
          - "All tests still pass after refactor"
          - "No new linting errors introduced"
      
      - name: "Git Commit"
        description: "Automated commit with /cortex-git-commit pattern"
        commit_strategy: "atomic"  # One commit per orchestrator execution
        commit_message_template: |
          {orchestrator_name}: {phase_summary}
          
          {change_summary}
          
          Files modified: {file_count}
          Tests added: {test_count}
          Coverage: {coverage_change}
          
          Co-authored-by: CORTEX v5 <cortex@asifhussain.dev>
        validation:
          - "All files staged successfully"
          - "Commit message follows convention"
          - "No sensitive data in commit"
    outputs:
      - "reports/refactor-report.md"
      - "tracking/git-commit-sha.txt"

# Context discovery configuration
context_discovery:
  enabled: true
  
  search_patterns:
    - pattern: "class.*"
      file_types: ["*.py"]
      scope: "src/"
      description: "Find Python classes"
    
    - pattern: "def test_"
      file_types: ["*.py"]
      scope: "tests/"
      description: "Find test functions"
    
    - pattern: "orchestrator"
      file_types: ["*.py", "*.md"]
      scope: "./"
      description: "Find orchestrator references"
  
  max_results_per_pattern: 100
  include_file_content: false

# Template configuration
templates:
  base_path: "cortex-brain/templates/planning"
  
  files:
    - name: "master-plan.jinja2"
      output: "00-{plan-name}.md"
      description: "Meaningful filename derived from plan folder name (max 22 chars)"
      required_vars:
        - "feature_name"
        - "plan_id"
        - "created_date"
    
    - name: "README.md.jinja2"
      output: "README.md"
      required_vars:
        - "feature_name"
        - "plan_id"
    
    - name: "progress-tracker.json.jinja2"
      output: "tracking/progress-tracker.json"
      required_vars:
        - "plan_id"
        - "feature_name"
        - "total_phases"
    
    - name: "continuation-prompt.jinja2"
      output: "tracking/CONTINUATION-PROMPT.md"
      required_vars:
        - "plan_id"
        - "feature_name"
        - "completed_phases"
        - "total_phases"

# Validation rules
validation:
  required_files:
    - "00-*.md"  # Master plan with meaningful name
    - "README.md"
    - "tracking/progress-tracker.json"
    - "tracking/CONTINUATION-PROMPT.md"
  
  required_folders:
    - "analysis"
    - "artifacts"
    - "context"
    - "reports"
    - "tracking"
  
  required_sections_in_plan:
    - "Visual Progress Tracker"
    - "Executive Summary"
    - "Implementation Phases"
    - "Next Steps"
  
  min_plan_length_lines: 50
  max_plan_length_lines: 5000
  
  # Phase-level acceptance criteria (Gap 1 remediation)
  phase_acceptance_criteria:
    enabled: true
    template_path: "cortex-brain/templates/planning/acceptance-criteria-template.md"
    
    dor_validation:
      enforce_blocking: true  # Block phase start if DoR fails
      required_checks:
        - "dependencies_met"
        - "resources_available"
        - "prerequisites_complete"
        - "false_positive_check"  # NEW: Verify deps are ACTUALLY complete
    
    dod_validation:
      enforce_blocking: true  # Block phase completion if DoD fails
      required_checks:
        - "deliverables_created"
        - "tests_passing"
        - "documentation_updated"
        - "refactor_complete"  # NEW: Phase N+1 REFACTOR completed
  
  # Epic-level acceptance criteria (Gap 3 remediation)
  epic_acceptance_criteria:
    enabled: true
    validator_class: "src.orchestrators.planning.epic_acceptance_validator.EpicAcceptanceValidator"
    
    production_readiness:
      required_criteria_passed: "100%"
      required_test_coverage: "80%"
      required_dod_passed: true
      vscode_cache_validated: true  # Gap 4 remediation
    
    tracker_path: "tracking/epic-acceptance-tracker.json"
    matrix_path: "reports/epic-acceptance-matrix.md"

# Database integration
database:
  track_state: true
  
  plan_metadata:
    - "feature_name"
    - "user_request"
    - "complexity_tier"
    - "estimated_days"
    - "folder_path"
  
  phase_tracking:
    enabled: true
    create_snapshots: true
    snapshot_frequency: "after_each_phase"
  
  artifact_registry:
    enabled: true
    track_checksums: true
    track_file_size: true

# Session management (NEW - v5 feature)
session_management:
  continuation_prompt:
    enabled: true
    update_frequency: "after_each_phase"
    template: "continuation-prompt.jinja2"
    token_warning_threshold: 80000
    display_warning: true
  
  auto_checkpoint:
    enabled: true
    frequency: "after_each_phase"
    commit_message_template: "Phase {phase_number} complete: {phase_name}"

# Master Orchestrator integration
master_orchestrator:
  registration:
    patterns:
      - pattern: "^(plan|create a plan|make a plan).*$"
        match_type: "regex"
        confidence: 1.0
        priority: 10
    
    dependencies:
      - "mcp_tools"
      - "planning_state_db"
      - "jinja2"
    
    lifecycle_hooks:
      # Phase -2: Setup Verification (NEW - Universal CORTEX v5 pattern)
      pre_execution:
        - name: "setup_verification"
          enabled: true
          priority: 1
          middleware: "src.orchestrators.middleware.setup_verification.SetupVerifier"
          checks:
            - "validate_dependencies_implementation"  # Not just file checks
            - "detect_false_positives"
            - "check_vscode_cache_state"
            - "validate_governance_compliance"
        
        - name: "validate_workspace"
          enabled: true
          priority: 5
        
        - name: "check_dependencies"
          enabled: true
          priority: 10
        
        - name: "validate_phase_dor"
          enabled: true
          priority: 15
          description: "Gap 1 remediation: Phase-level DoR validation"
        
        - name: "governance_checkpoint"
          enabled: true
          priority: 20
          description: "Gap 2 remediation: Runtime governance enforcement"
      
      # Phase N+1: Teardown + REFACTOR + Commit (NEW - Universal CORTEX v5 pattern)
      post_execution:
        - name: "validate_phase_dod"
          enabled: true
          priority: 5
          description: "Gap 1 remediation: Phase-level DoD validation"
        
        - name: "save_plan_artifact"
          enabled: true
          priority: 10
        
        - name: "update_continuation_prompt"
          enabled: true
          priority: 15
        
        - name: "governance_checkpoint"
          enabled: true
          priority: 20
          description: "Gap 2 remediation: Runtime governance enforcement"
        
        - name: "validate_epic_acceptance"
          enabled: true
          priority: 25
          condition: "orchestrator_type == 'planning' AND plan_type == 'epic'"
          description: "Gap 3 remediation: Epic acceptance validation"
        
        - name: "teardown_refactor"
          enabled: true
          priority: 30
          middleware: "src.orchestrators.middleware.teardown_refactor.TeardownRefactor"
          phases:
            - "whole_file_refactor"
            - "remove_orphaned_code"
            - "git_commit_atomic"
        
        - name: "create_git_checkpoint"
          enabled: true
          priority: 35
      
      on_error:
        - "log_failure"
        - "cleanup_partial_artifacts"
  
  state_sharing:
    enabled: true
    share_plan_context: true
    share_artifacts: true

# Performance settings
performance:
  max_context_files: 1000
  max_file_size_mb: 10
  parallel_file_search: true
  cache_search_results: true
  cache_ttl_seconds: 3600

# Governance integration (Phase 4 enhancement + Gap 2 remediation)
governance:
  tier0_validation:
    enabled: true
    rules_path: "cortex-brain/brain-protection-rules.yaml"
    enforcement: "automated"
    
    instincts:
      - "TDD_ENFORCEMENT"
      - "INCREMENTAL_PLAN_GENERATION"
      - "DOCUMENT_ORGANIZATION_ENFORCEMENT"
      - "GIT_ISOLATION"
      - "PLANNING_ISOLATION"
      - "SETUP_VERIFICATION"  # NEW: Phase -2 mandatory
      - "TEARDOWN_REFACTOR"   # NEW: Phase N+1 mandatory
  
  # Runtime governance enforcement (Gap 2 remediation)
  runtime_enforcement:
    enabled: true
    middleware: "src.orchestrators.middleware.governance_checkpoint.GovernanceCheckpoint"
    
    checkpoints:
      phase_start: true
      phase_operations: true
      phase_complete: true
    
    audit_trail:
      enabled: true
      log_path: "tracking/governance-audit.jsonl"
      track_violations: true
      track_overrides: false  # No overrides allowed
      
  critical_path_protection:
    enabled: true
    paths:
      - "cortex-brain/tier0/"
      - ".github/prompts/internal/"
      - "cortex-brain/brain-protection-rules.yaml"
      
  skull_rules:
    enforcement: "automated"
    severity_levels:
      - "blocked"
      - "warning"
      - "info"

# Knowledge graph integration (Phase 4 enhancement)
knowledge_graph:
  tier2_integration:
    enabled: true
    graph_path: "cortex-brain/knowledge-graph.yaml"
    
    queries:
      - "related_features"
      - "dependencies"
      - "patterns"
      - "risks"
      - "recommendations"
    
  context_enrichment:
    enabled: true
    max_related_features: 5
    max_dependencies: 10
    
  metadata_collection:
    track_patterns: true
    track_risks: true
    track_recommendations: true

# Logging configuration
logging:
  level: "INFO"
  log_phases: true
  log_artifacts: true
  log_validation: true
  
  output:
    console: true
    file: "logs/planning-v5.log"
    database: true

# Development settings
development:
  debug_mode: false
  validate_templates: true
  dry_run: false
  skip_git_operations: false
