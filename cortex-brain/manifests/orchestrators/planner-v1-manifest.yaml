# Planner Orchestrator v1.0 Manifest
# Intelligent epic/feature plan management with state analysis and realignment

schema_version: "1.0"

orchestrator:
  name: "planner_v1"
  version: "1.0"
  type: "autonomous"
  description: "Intelligent plan management - analyze state, integrate requests, realign execution"
  class: "PlannerOrchestratorV1"
  module: "src.orchestrators.planner.planner_orchestrator_v1"
  prompt_file: ".github/prompts/cortex-planner.prompt.md"

# Parameters
parameters:
  - name: "plan_path"
    type: "string"
    required: true
    description: "Name or path of epic/feature plan folder"
    examples:
      - "cortex5-epic"
      - "active/user-auth-feature"
      - "/full/path/to/plan"
    auto_detection:
      - search_locations:
          - "cortex-brain/documents/planning/active/"
          - "cortex-brain/documents/planning/archives/"
      - resolution_strategy: "fuzzy_match"  # Match partial names
      - disambiguation: "prompt_user"  # If multiple matches
  
  - name: "user_request"
    type: "string"
    required: true
    description: "Natural language request (continue, add, modify, investigate, optimize)"
    examples:
      - "continue from Phase 3"
      - "add security audit before deployment"
      - "optimize for parallel execution"
      - "investigate why tests failing in Phase 2"

# Request classification
request_types:
  continuation:
    patterns: ["^continue", "^resume", "^keep going", "^next phase"]
    action: "resume_execution"
    priority: "immediate"
  
  addition:
    patterns: ["^add", "^insert", "^include", "^append"]
    action: "integrate_requirement"
    priority: "deferred"  # Analyze optimal insertion point
  
  modification:
    patterns: ["^modify", "^change", "^update", "^refactor"]
    action: "realign_plan"
    priority: "immediate"
  
  investigation:
    patterns: ["^investigate", "^debug", "^why", "^what's wrong"]
    action: "analyze_issue"
    priority: "immediate"
  
  optimization:
    patterns: ["^optimize", "^improve", "^speed up", "^parallelize"]
    action: "restructure_execution"
    priority: "deferred"

# Execution phases
phases:
  - number: 0
    name: "Plan Discovery & Validation"
    description: "Resolve path, load manifest/tracker, validate structure"
    estimated_duration_minutes: 2
    tasks:
      - "Resolve plan path (name → full path)"
      - "Load plan manifest (00-{plan-name}.md or YAML)"
      - "Load progress tracker (JSON)"
      - "Detect plan mode (EPIC vs FEATURE)"
      - "Validate folder structure"
      - "Load all context files"
    validation:
      - check: "plan_manifest_exists"
        error: "Plan manifest not found"
      - check: "progress_tracker_valid"
        error: "Progress tracker missing or invalid JSON"
      - check: "plan_viewer_root_only"
        warning: "Multiple files on root (should be plan-viewer.html only)"
    outputs:
      - "analysis/plan-state-snapshot.json"
  
  - number: 1
    name: "Progress Analysis & Gap Detection"
    description: "Parse completed/remaining work, detect gaps, generate recommendations"
    estimated_duration_minutes: 3
    tasks:
      - "Parse completed work (phases, tasks, artifacts)"
      - "Parse remaining work (pending phases, unmet requirements)"
      - "Detect gaps (edge cases, security, performance, scalability)"
      - "Generate recommendations (secure, efficient, future-proof)"
    gap_categories:
      - "edge_cases"
      - "failure_modes"
      - "race_conditions"
      - "integration_risks"
      - "deployment_pitfalls"
      - "security_vulnerabilities"
      - "performance_bottlenecks"
      - "scalability_limits"
      - "rollback_recovery"
      - "data_integrity"
      - "validation_gaps"
      - "dependency_risks"
      - "maintainability_issues"
    outputs:
      - "analysis/progress-analysis.md"
      - "analysis/gap-analysis.yaml"
  
  - number: 2
    name: "Request Integration & Prioritization"
    description: "Parse request, map to plan, prioritize via snowball algorithm"
    estimated_duration_minutes: 5
    tasks:
      - "Classify request intent (continue, add, modify, investigate, optimize)"
      - "Map request to plan structure (affected phases, insertion points)"
      - "Run snowball prioritization algorithm"
      - "Determine execution decision (immediate, deferred, blocked)"
      - "Generate snowball strategy (momentum groups, parallel streams)"
    prioritization:
      algorithm: "snowball_effect"
      formula: "(Impact × Urgency × Dependencies_Satisfied) / (Effort × Risk)"
      factors:
        impact: "1-10 (downstream tasks benefit)"
        urgency: "1-10 (user priority + deadline)"
        dependencies_satisfied: "0-1 (% complete)"
        effort: "1-100 (estimated hours)"
        risk: "1-10 (technical + integration)"
      execution_thresholds:
        immediate: ">= 7.0"
        deferred: "3.0 - 6.9"
        blocked: "< 3.0"
    outputs:
      - "analysis/request-integration-plan.yaml"
  
  - number: 3
    name: "Plan Realignment & Restructuring"
    description: "Update manifest, reorganize folders, update tracker/viewer"
    estimated_duration_minutes: 10
    tasks:
      - "Update plan manifest (insert/modify phases)"
      - "Reorganize folder structure (root cleanup)"
      - "Update progress tracker JSON"
      - "Update plan-viewer.html (if exists)"
      - "Generate CONTINUATION-PROMPT.md"
    folder_organization:
      root_allowed_files: ["plan-viewer.html"]
      categorization:
        analysis: "Research, gap analysis, architectural reviews"
        artifacts: "Generated code, configs, schemas"
        context: "Background docs, discovery reports"
        reports: "Progress reports, completion summaries"
        scripts: "Automation scripts, utilities"
        tracking: "Progress tracker, state snapshots"
        phases: "Phase-specific artifacts (EPIC mode only)"
        architecture: "Architecture diagrams, decision records"
    outputs:
      - "Updated plan manifest"
      - "tracking/progress-tracker.json"
      - "plan-viewer.html"
      - "tracking/CONTINUATION-PROMPT.md"
  
  - number: 4
    name: "Execution Preparation"
    description: "Generate execution script + manifest, configure anti-summary enforcement"
    estimated_duration_minutes: 3
    tasks:
      - "Generate phase execution script (scripts/execute-next-phase.sh)"
      - "Create execution manifest (tracking/execution-manifest.yaml)"
      - "Configure anti-summary enforcement"
    anti_summary_enforcement:
      block_file_types:
        - "*-summary.md"
        - "completion-report.md"
        - "phase-*-report.md"
        - "deliverables-summary.md"
      response_config:
        mode: "concise"
        include_code: false
        include_snippets: false
        create_summary_file: false
        create_report_file: false
        max_summary_lines: 40
        executive_summary_only: true
    outputs:
      - "scripts/execute-next-phase.sh"
      - "tracking/execution-manifest.yaml"
  
  - number: 5
    name: "Autonomous Execution"
    description: "Execute next phase → vacuum cleanup → update viewer"
    estimated_duration_minutes: "variable"
    tasks:
      - "Execute next phase (via master orchestrator)"
      - "Run vacuum cleanup (mandatory)"
      - "Update plan viewer (mandatory)"
      - "Block summary file generation (mandatory)"
    post_phase_actions:
      - action: "vacuum"
        command: "python3 -m src.main 'vacuum {plan_path} --dry-run' --format markdown"
        required: true
      - action: "vacuum_execute"
        command: "python3 -m src.main 'vacuum {plan_path}' --format markdown"
        required: true
      - action: "update_viewer"
        command: "python3 {plan_path}/launch_plan_viewer.py &"
        required: true
        non_blocking: true
    progress_reporting:
      phase_start: "3 lines (phase name + progress bar)"
      task_completion: "SILENT (no narration)"
      phase_completion: "5 lines (completed phase + next phase)"
      overall_completion: "≤40 lines (summary table)"
    outputs:
      - "Phase deliverables (varies)"
      - "Updated tracking/progress-tracker.json"
  
  - number: 6
    name: "Validation & Commit"
    description: "Validate plan state, run final vacuum, commit via cortex-git-commit"
    estimated_duration_minutes: 2
    tasks:
      - "Validate plan state (all checks)"
      - "Run final vacuum (if needed)"
      - "Commit changes (cortex-git-commit pattern)"
      - "Generate validation report"
    validation_checks:
      - "All artifacts in correct folders"
      - "Progress tracker reflects completion"
      - "plan-viewer.html is ONLY root file"
      - "No orphaned files"
      - "No temporary files"
    git_commit:
      pattern: "/cortex-git-commit"
      message_template: |
        feat({plan_name}): Complete Phase {N} - {phase_name}
        
        - Delivered: {artifact_summary}
        - Updated: progress tracker, plan viewer
        - Cleaned: vacuum execution (folder organization)
        
        BREAKING CHANGE: None
        Closes: #{issue_number}
        
        Co-authored-by: CORTEX <cortex@asifhussain.dev>
    outputs:
      - "tracking/validation-report.yaml"
      - "Git commit"

# Brain protection rules
skull_rules:
  - rule: "PLAN_FILE_ORGANIZATION"
    enforcement: "ONLY plan-viewer.html on root; all else in subfolders"
  
  - rule: "NO_SUMMARY_FILES"
    enforcement: "Block *-summary.md, completion-report.md generation"
  
  - rule: "VACUUM_MANDATORY"
    enforcement: "Run vacuum after EVERY phase completion"
  
  - rule: "VIEWER_UPDATE_MANDATORY"
    enforcement: "Update plan-viewer.html after EVERY phase"
  
  - rule: "PROGRESS_TRACKER_SYNC"
    enforcement: "JSON tracker MUST reflect actual state"
  
  - rule: "CONTINUATION_PROMPT"
    enforcement: "Generate CONTINUATION-PROMPT.md after realignment"
  
  - rule: "GIT_COMMIT_ATOMIC"
    enforcement: "One commit per phase (via cortex-git-commit)"
  
  - rule: "SNOWBALL_OPTIMIZATION"
    enforcement: "Prioritize for momentum (foundational → complex)"

# Edge case mitigation strategies
edge_cases:
  race_conditions:
    detection:
      - "Concurrent file access in multi-threaded operations"
      - "Database transaction conflicts"
      - "Shared state mutations"
    mitigation:
      - "File locking mechanisms (fcntl, lockfile)"
      - "Database transaction isolation levels"
      - "Immutable data structures"
  
  integration_failures:
    detection:
      - "API contract mismatches"
      - "Version incompatibilities"
      - "Network timeouts"
    mitigation:
      - "Contract testing (Pact, Spring Cloud Contract)"
      - "Semantic versioning enforcement"
      - "Circuit breakers + retries (exponential backoff)"
  
  deployment_pitfalls:
    detection:
      - "Zero-downtime violations"
      - "Database migration failures"
      - "Rollback procedure gaps"
    mitigation:
      - "Blue-green deployment strategy"
      - "Forward-compatible migrations (additive only)"
      - "Automated rollback scripts + testing"
  
  security_vulnerabilities:
    detection:
      - "Authentication bypass paths"
      - "SQL/NoSQL injection vectors"
      - "Privilege escalation exploits"
    mitigation:
      - "OAuth2 + JWT (short-lived tokens)"
      - "Parameterized queries + input validation"
      - "Principle of least privilege (RBAC)"
  
  performance_bottlenecks:
    detection:
      - "N+1 query patterns"
      - "Memory leaks (unbounded caches)"
      - "Blocking I/O in critical paths"
    mitigation:
      - "Eager loading + batch queries"
      - "LRU caches with size limits"
      - "Async I/O (asyncio, event loops)"
  
  scalability_limits:
    detection:
      - "Single-threaded bottlenecks"
      - "Database connection exhaustion"
      - "Stateful session storage"
    mitigation:
      - "Horizontal scaling (load balancers)"
      - "Connection pooling (pgbouncer, HikariCP)"
      - "Stateless services + distributed caching (Redis)"
  
  data_integrity:
    detection:
      - "Missing transaction boundaries"
      - "Eventual consistency violations"
      - "Orphaned records"
    mitigation:
      - "ACID transactions (database-level)"
      - "Saga pattern (distributed transactions)"
      - "Foreign key constraints + cascade rules"
  
  validation_gaps:
    detection:
      - "Missing input sanitization"
      - "Type coercion vulnerabilities"
      - "Constraint violations"
    mitigation:
      - "Schema validation (JSON Schema, Pydantic)"
      - "Strict type checking (mypy, TypeScript)"
      - "Database constraints (NOT NULL, CHECK, UNIQUE)"
  
  dependency_risks:
    detection:
      - "Circular dependencies"
      - "Version conflicts (dependency hell)"
      - "Supply chain vulnerabilities"
    mitigation:
      - "Dependency injection (inversion of control)"
      - "Lock files (poetry.lock, package-lock.json)"
      - "Vulnerability scanning (Snyk, Dependabot)"
  
  maintainability_issues:
    detection:
      - "Code duplication (DRY violations)"
      - "Complex conditionals (cyclomatic complexity > 10)"
      - "Tight coupling (high fan-in/fan-out)"
    mitigation:
      - "Extract common logic (shared utilities)"
      - "Refactor to polymorphism (strategy pattern)"
      - "Dependency inversion (interfaces/protocols)"

# Response templates
response_templates:
  concise:
    header: "## 🎯 CORTEX Planner: {plan_name}"
    sections:
      - "**Request:** {user_request}"
      - "**Mode:** {immediate|deferred|blocked}"
      - "**Priority:** {score}/10"
      - "### 📋 Integration Plan"
      - "### ✅ Next Steps"
    footer: "📋 **Resume Work:** `continue plan {plan_name}` *(see `CONTINUATION-PROMPT.md`)*"
    max_lines: 20
  
  verbose:
    header: "## 🎯 CORTEX Planner: {plan_name}"
    sections:
      - "### 📊 Progress Analysis"
      - "### 🔍 Gap Analysis"
      - "### 📋 Integration Plan"
      - "### 🏗️ Plan Realignment"
      - "### ✅ Execution Ready"
    footer: "📋 **Resume Work:** `continue plan {plan_name}` *(see `CONTINUATION-PROMPT.md`)*"
    max_lines: 80

# Accessibility
accessibility:
  wcag_alignment: "AA"
  cognitive_load:
    - "Concise mode by default (≤20 lines)"
    - "Verbose mode only if explicitly requested"
    - "No narration of internal tasks"
    - "Progress updates at phase boundaries only"
  
  display_frequency:
    phase_start: "3 lines (phase name + progress)"
    task_completion: "SILENT"
    phase_completion: "5 lines (summary)"
    overall_completion: "≤40 lines (table)"

# Integration
integration:
  master_orchestrator: true
  routing_patterns:
    - "^(cortex-planner|manage plan|planner|continue plan)"
  priority: 8  # Higher than Planning v5 (10), lower than Holistic Review (5)
  
  dependencies:
    - orchestrator: "planning_v5"
      reason: "Creates plans that planner manages"
    - orchestrator: "vacuum_v2"
      reason: "Cleanup after phase execution"
    - utility: "cortex-git-commit"
      reason: "Atomic commits"
  
  state_sharing:
    read:
      - "planning_state_db (plan metadata)"
      - "progress_tracker.json (current state)"
      - "epic-progress-tracker.json (epic state)"
    write:
      - "progress_tracker.json (updates)"
      - "plan manifest (realignment)"
      - "CONTINUATION-PROMPT.md (session resume)"

# Telemetry
telemetry:
  track_events:
    - "plan_discovery"
    - "gap_detection"
    - "request_integration"
    - "plan_realignment"
    - "phase_execution"
    - "validation_complete"
  
  metrics:
    - "phases_completed"
    - "gaps_detected_count"
    - "realignment_frequency"
    - "execution_duration"
    - "validation_failures"
