# CORTEX Upgrade Orchestrator Manifest
# Version: 1.0.0 | Created: January 6, 2026 | Author: Asif Hussain
# Purpose: Automated system for pulling and wiring CORTEX v5.0 enhancements

orchestrator_metadata:
  orchestrator_id: upgrade_cortex
  name: "CORTEX Upgrade Orchestrator"
  version: "1.0.0"
  created: "2026-01-06"
  author: "Asif Hussain"
  status: production
  type: autonomous_python
  execution_mode: terminal_invocation
  
  description: >
    Automatically pull the latest CORTEX v5.0 enhancements from remote branch and wire
    them into the local installation. Handles git sync, dependency updates, orchestrator
    registration, prompt rebuilding, documentation regeneration, and master/child
    orchestrator setup with audit logging integration.

# Routing Configuration
routing:
  patterns:
    - pattern: "^(upgrade cortex|cortex upgrade|pull enhancements|sync enhancements)"
      priority: 15
      confidence: 1.0
      mode: autonomous
    - pattern: "^(upgrade system|system upgrade|cortex sync)"
      priority: 15
      confidence: 0.95
      mode: autonomous
    - pattern: "^(get latest|pull latest|sync latest)"
      priority: 12
      confidence: 0.85
      mode: autonomous
      context_required: ["cortex", "enhancements", "v5"]
  
  fallback_to_llm: false  # Patterns are explicit enough
  master_orchestrator_integration: true

# Capabilities
capabilities:
  primary:
    - "Git pull and merge from remote CORTEX-5.0 branch"
    - "Automated dependency synchronization"
    - "Orchestrator registration and wiring"
    - "Prompt file rebuilding (CORTEX.prompt.md, copilot-instructions.md)"
    - "Documentation site regeneration (Level 0, 1, 2)"
    - "Master/child orchestrator setup"
    - "Audit logger integration across orchestrators"
  
  secondary:
    - "Pre-flight validation and safety checks"
    - "Backup and rollback preparation"
    - "Conflict detection and resolution"
    - "Integration testing"
    - "Feature summary and user guidance generation"
  
  supported_platforms:
    - Windows (PowerShell)
    - macOS (bash/zsh)
    - Linux (bash)

# Execution Phases
phases:
  - phase_id: "P01"
    name: "Pre-Flight Validation"
    duration_estimate: "30 seconds"
    priority: critical
    description: "Validate system readiness for upgrade"
    
    checks:
      - id: "git_status"
        name: "Git Working Directory Clean"
        command: "git status --porcelain"
        expected: ""
        failure_action: "abort"
      
      - id: "git_branch"
        name: "Current Branch = CORTEX-5.0"
        command: "git branch --show-current"
        expected: "CORTEX-5.0"
        failure_action: "warn"
      
      - id: "python_version"
        name: "Python 3.11+"
        command: "python3 --version"
        expected_regex: "Python 3\\.(1[1-9]|[2-9][0-9])\\..*"
        failure_action: "abort"
      
      - id: "disk_space"
        name: "Minimum 500MB Free"
        command: "df -h . | tail -1"
        expected_regex: ".*([5-9][0-9]{2}M|[1-9]G).*"
        failure_action: "warn"
      
      - id: "network"
        name: "Network Connectivity"
        command: "git fetch --dry-run origin CORTEX-5.0 2>&1"
        expected_regex: ".*"
        failure_action: "abort"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/01-pre-flight-report.json"
        type: "json"
        content: "Validation results for all checks"

  - phase_id: "P02"
    name: "Remote Analysis"
    duration_estimate: "1 minute"
    priority: high
    description: "Analyze changes in remote branch"
    
    actions:
      - id: "fetch_remote"
        command: "git fetch origin CORTEX-5.0"
        description: "Fetch latest changes from remote"
      
      - id: "compare_heads"
        command: "git log HEAD..origin/CORTEX-5.0 --oneline --stat"
        description: "Generate commit diff"
      
      - id: "identify_subsystems"
        script: "scripts/upgrade/analyze_remote_changes.py"
        description: "Categorize changes by subsystem"
        subsystems:
          - orchestrators: "src/orchestrators/"
          - prompts: ".github/prompts/"
          - documentation: "cortex-brain/documents/"
          - audit_logging: "src/logging/"
          - architecture: "src/core/, src/entry_point/"
          - tests: "tests/"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/02-remote-analysis.json"
        type: "json"
      - path: "cortex-brain/documents/upgrades/{timestamp}/03-diff-summary.md"
        type: "markdown"

  - phase_id: "P03"
    name: "Backup & Rollback Preparation"
    duration_estimate: "1 minute"
    priority: critical
    description: "Create safety net for rollback"
    
    backup_targets:
      - source: "cortex.config.json"
        destination: "backups/upgrade-{timestamp}/cortex.config.json"
      - source: ".github/prompts/CORTEX.prompt.md"
        destination: "backups/upgrade-{timestamp}/CORTEX.prompt.md"
      - source: ".github/copilot-instructions.md"
        destination: "backups/upgrade-{timestamp}/copilot-instructions.md"
      - source: "cortex-brain/config/master-orchestrator.yaml"
        destination: "backups/upgrade-{timestamp}/master-orchestrator.yaml"
      - source: "cortex-brain/documents/planning/active/"
        destination: "backups/upgrade-{timestamp}/active-plans/"
        recursive: true
    
    rollback_scripts:
      - platform: "windows"
        file: "backups/upgrade-{timestamp}/rollback.ps1"
        template: "templates/upgrade/rollback-template.ps1"
      
      - platform: "unix"
        file: "backups/upgrade-{timestamp}/rollback.sh"
        template: "templates/upgrade/rollback-template.sh"
    
    metadata:
      - path: "backups/upgrade-{timestamp}/manifest.json"
        content:
          timestamp: "{timestamp}"
          commit_sha: "{current_commit}"
          branch: "{current_branch}"
          python_version: "{python_version}"
          files_backed_up: "{file_count}"

  - phase_id: "P04"
    name: "Git Pull & Merge"
    duration_estimate: "1 minute"
    priority: critical
    description: "Pull latest changes from remote"
    
    strategy: "rebase"  # Prefer rebase over merge for clean history
    
    commands:
      - command: "git pull --rebase origin CORTEX-5.0"
        timeout: 60
        retry_on_failure: true
        max_retries: 3
    
    conflict_resolution:
      auto_resolve_patterns:
        - path_pattern: ".github/prompts/*.md"
          strategy: "theirs"  # Prefer remote for prompts
          reason: "Upstream prompt improvements"
        
        - path_pattern: "cortex-brain/documents/**/*.md"
          strategy: "theirs"  # Prefer remote for docs
          reason: "Upstream documentation enhancements"
        
        - path_pattern: "*.yaml"
          strategy: "manual"  # Always manual for config
          reason: "Config files may have local customizations"
        
        - path_pattern: "cortex-brain/documents/planning/active/**"
          strategy: "ours"  # Prefer local for active plans
          reason: "Active plans contain local work in progress"
      
      manual_intervention_required:
        - "cortex.config.json"
        - "cortex-brain/config/*.yaml"
        - "*.py (if conflict in src/)"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/04-git-pull-log.txt"
        type: "text"
      - path: "cortex-brain/documents/upgrades/{timestamp}/05-conflicts.json"
        type: "json"
        conditional: "conflicts_detected"

  - phase_id: "P05"
    name: "Dependency Synchronization"
    duration_estimate: "2 minutes"
    priority: high
    description: "Update Python packages"
    
    actions:
      - id: "compare_requirements"
        script: "scripts/upgrade/compare_requirements.py"
        inputs:
          old: "backups/upgrade-{timestamp}/requirements.txt"
          new: "requirements.txt"
        output: "cortex-brain/documents/upgrades/{timestamp}/06-dependency-changes.json"
      
      - id: "install_dependencies"
        command: "pip install -r requirements.txt --upgrade"
        log: "cortex-brain/documents/upgrades/{timestamp}/07-pip-install-log.txt"
        timeout: 120
      
      - id: "verify_critical_packages"
        script: "scripts/upgrade/verify_packages.py"
        packages:
          - pytest
          - pydantic
          - PyYAML
          - Jinja2
          - watchdog
          - requests
      
      - id: "test_imports"
        script: "scripts/upgrade/test_imports.py"
        modules:
          - "src.logging.audit_logger"
          - "src.orchestrators.master_orchestrator"
          - "src.orchestrators.planning_orchestrator"
          - "src.orchestrators.tdd_orchestrator"

  - phase_id: "P06"
    name: "Orchestrator Wiring Analysis"
    duration_estimate: "2 minutes"
    priority: high
    description: "Detect and register new orchestrators"
    
    scan_directories:
      - path: "src/orchestrators/"
        pattern: "*_orchestrator.py"
        exclude: ["__pycache__", "base", "middleware"]
      
      - path: "cortex-brain/manifests/orchestrators/"
        pattern: "*.yaml"
        exclude: ["deprecated", "archive"]
    
    analysis_tasks:
      - id: "detect_new_orchestrators"
        script: "scripts/upgrade/detect_orchestrators.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/08-orchestrator-changes.json"
      
      - id: "extract_patterns"
        script: "scripts/upgrade/extract_routing_patterns.py"
        input: "cortex-brain/manifests/orchestrators/"
        output: "cortex-brain/config/master-orchestrator-new.yaml"
      
      - id: "merge_routing_tables"
        script: "scripts/upgrade/merge_routing_tables.py"
        inputs:
          old: "cortex-brain/config/master-orchestrator.yaml"
          new: "cortex-brain/config/master-orchestrator-new.yaml"
        output: "cortex-brain/config/master-orchestrator.yaml"
        backup: true
      
      - id: "regenerate_orchestrator_docs"
        script: "scripts/upgrade/regenerate_orchestrator_docs.py"
        output: "cortex-brain/documents/orchestrators-quick-ref.md"

  - phase_id: "P07"
    name: "Prompt Rebuilding"
    duration_estimate: "1 minute"
    priority: high
    description: "Rebuild prompt files with latest patterns"
    
    rebuild_targets:
      - file: ".github/prompts/CORTEX.prompt.md"
        template: "templates/prompts/CORTEX-template.prompt.md"
        data_source: "cortex-brain/config/master-orchestrator.yaml"
        script: "scripts/upgrade/rebuild_cortex_prompt.py"
      
      - file: ".github/copilot-instructions.md"
        template: "templates/prompts/copilot-instructions-template.md"
        data_source: "cortex-brain/config/master-orchestrator.yaml"
        script: "scripts/upgrade/rebuild_copilot_instructions.py"
    
    validation:
      - id: "syntax_check"
        script: "scripts/upgrade/validate_prompts.py"
        checks:
          - "No broken internal links"
          - "All file references exist"
          - "Markdown syntax valid"
          - "No duplicate patterns"
      
      - id: "pattern_coverage"
        script: "scripts/upgrade/check_pattern_coverage.py"
        requirement: "All orchestrators have routing patterns"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/09-prompt-changes.md"
        type: "markdown"

  - phase_id: "P08"
    name: "Documentation Site Regeneration"
    duration_estimate: "3 minutes"
    priority: medium
    description: "Update Level 0, 1, 2 documentation"
    
    change_detection:
      - id: "scan_architecture"
        script: "scripts/upgrade/detect_architecture_changes.py"
        scans:
          - "src/ (new classes, functions, modules)"
          - "src/orchestrators/ (orchestrator additions/modifications)"
          - "src/middleware/ (new middleware components)"
          - "src/logging/ (audit logger changes)"
        output: "cortex-brain/documents/upgrades/{timestamp}/10-architecture-changes.json"
    
    regeneration_targets:
      level_0:
        - file: "cortex-brain/documents/CORTEX-README.md"
          template: "templates/docs/CORTEX-README-template.md"
          script: "scripts/upgrade/regenerate_level0_docs.py"
      
      level_1:
        - file: "cortex-brain/documents/architecture/CORTEX-ARCHITECTURE-CONTRACT.md"
          template: "templates/docs/architecture-contract-template.md"
          script: "scripts/upgrade/regenerate_level1_docs.py"
      
      level_2:
        - file: "cortex-brain/documents/orchestrators-quick-ref.md"
          script: "scripts/upgrade/regenerate_orchestrator_docs.py"
        
        - file: "cortex-brain/documents/cortex-architecture-quick-ref.md"
          script: "scripts/upgrade/regenerate_architecture_docs.py"
        
        - file: "cortex-brain/documents/orchestrators/master-child-pattern.md"
          template: "templates/docs/master-child-pattern-template.md"
          script: "scripts/upgrade/regenerate_master_child_docs.py"
        
        - file: "cortex-brain/documents/orchestrators/audit-logging-integration.md"
          template: "templates/docs/audit-logging-template.md"
          script: "scripts/upgrade/regenerate_audit_logging_docs.py"
    
    diagram_generation:
      - id: "architecture_flow"
        script: "scripts/upgrade/generate_architecture_diagram.py"
        output: "cortex-brain/documents/architecture/architecture-flow.svg"
      
      - id: "orchestrator_hierarchy"
        script: "scripts/upgrade/generate_orchestrator_hierarchy.py"
        output: "cortex-brain/documents/orchestrators/hierarchy-chart.svg"
      
      - id: "master_child_patterns"
        script: "scripts/upgrade/generate_master_child_diagram.py"
        output: "cortex-brain/documents/orchestrators/master-child-patterns.svg"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/11-docs-regeneration-log.txt"
        type: "text"

  - phase_id: "P09"
    name: "Master/Child Orchestrator Setup"
    duration_estimate: "2 minutes"
    priority: high
    description: "Wire child orchestrators to masters"
    
    discovery:
      - id: "identify_masters"
        script: "scripts/upgrade/find_master_orchestrators.py"
        criteria: "manifest contains 'master: true'"
        output: "master_orchestrators.json"
      
      - id: "identify_children"
        script: "scripts/upgrade/find_child_orchestrators.py"
        criteria: "manifest contains 'parent_id: <master_id>'"
        output: "child_orchestrators.json"
    
    hierarchy_building:
      - id: "build_hierarchy_map"
        script: "scripts/upgrade/build_orchestrator_hierarchy.py"
        inputs:
          masters: "master_orchestrators.json"
          children: "child_orchestrators.json"
        output: "cortex-brain/config/orchestrator-hierarchy.json"
    
    plugin_registry:
      - id: "register_children"
        script: "scripts/upgrade/register_child_orchestrators.py"
        registrations:
          - master: "tdd_master"
            children:
              - id: "tdd_html"
                name: "HTML Child Orchestrator"
                manifest: "cortex-brain/manifests/orchestrators/tdd-html-child.yaml"
              
              - id: "tdd_csharp"
                name: "C# Child Orchestrator"
                manifest: "cortex-brain/manifests/orchestrators/tdd-csharp-child.yaml"
              
              - id: "tdd_docs"
                name: "Documentation Child Orchestrator"
                manifest: "cortex-brain/manifests/orchestrators/tdd-docs-child.yaml"
          
          - master: "audit_master"
            children:
              - id: "audit_event"
                name: "Event Logging Child"
                manifest: "cortex-brain/manifests/orchestrators/audit-event-child.yaml"
              
              - id: "audit_security"
                name: "Security Logging Child"
                manifest: "cortex-brain/manifests/orchestrators/audit-security-child.yaml"
              
              - id: "audit_performance"
                name: "Performance Logging Child"
                manifest: "cortex-brain/manifests/orchestrators/audit-performance-child.yaml"
    
    configuration_generation:
      - id: "generate_master_configs"
        script: "scripts/upgrade/generate_master_configs.py"
        output_directory: "cortex-brain/config/orchestrators/masters/"
    
    artifacts:
      - path: "cortex-brain/config/orchestrator-hierarchy.json"
        type: "json"
      - path: "cortex-brain/documents/orchestrators/master-child-pattern.md"
        type: "markdown"
      - path: "cortex-brain/documents/orchestrators/child-orchestrator-registry.json"
        type: "json"

  - phase_id: "P10"
    name: "Audit Logger Integration"
    duration_estimate: "2 minutes"
    priority: high
    description: "Wire audit logging into orchestrators"
    
    orchestrator_scanning:
      - id: "scan_all_orchestrators"
        script: "scripts/upgrade/scan_orchestrator_audit_integration.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/12-audit-logger-wiring.json"
    
    integration_tasks:
      - id: "inject_audit_imports"
        script: "scripts/upgrade/inject_audit_imports.py"
        description: "Add audit logger imports to orchestrators missing them"
        dry_run: false
      
      - id: "add_lifecycle_hooks"
        script: "scripts/upgrade/add_audit_hooks.py"
        hooks:
          - name: "pre_execute"
            code: "self.audit_logger.log_event('orchestrator_start', {'name': self.__class__.__name__})"
          
          - name: "post_execute"
            code: "self.audit_logger.log_event('orchestrator_complete', {'name': self.__class__.__name__, 'duration': elapsed})"
          
          - name: "on_error"
            code: "self.audit_logger.log_event('orchestrator_error', {'name': self.__class__.__name__, 'error': str(e)})"
          
          - name: "on_phase_complete"
            code: "self.audit_logger.log_event('phase_complete', {'orchestrator': self.__class__.__name__, 'phase': phase_id})"
      
      - id: "configure_log_routing"
        script: "scripts/upgrade/configure_audit_routing.py"
        routing:
          master_orchestrator: "logs/cortex-audit/master/"
          child_orchestrators: "logs/cortex-audit/child/{child_name}/"
          tdd_orchestrator: "logs/cortex-audit/tdd/"
          planning_orchestrator: "logs/cortex-audit/planning/"
          cleanup_orchestrator: "logs/cortex-audit/cleanup/"
          vacuum_orchestrator: "logs/cortex-audit/vacuum/"
          ado_orchestrator: "logs/cortex-audit/ado/"
      
      - id: "verify_health_check"
        script: "scripts/upgrade/verify_health_check_server.py"
        config: "cortex.config.json"
        expected_keys:
          - "logging.health_check.enabled"
          - "logging.health_check.port"
    
    documentation:
      - id: "generate_audit_docs"
        template: "templates/docs/audit-logging-template.md"
        output: "cortex-brain/documents/orchestrators/audit-logging-integration.md"

  - phase_id: "P11"
    name: "Integration Testing"
    duration_estimate: "3 minutes"
    priority: critical
    description: "Verify all upgrades work end-to-end"
    
    test_suites:
      - suite: "import_tests"
        description: "Verify all imports work"
        tests:
          - name: "orchestrators_import"
            command: "python3 -c 'from src.orchestrators.master_orchestrator import MasterOrchestrator'"
          
          - name: "audit_logger_import"
            command: "python3 -c 'from src.logging.audit_logger import AuditLogger'"
          
          - name: "no_circular_dependencies"
            script: "scripts/upgrade/test_circular_deps.py"
      
      - suite: "routing_tests"
        description: "Verify pattern matching"
        tests:
          - name: "pattern_matching"
            script: "scripts/upgrade/test_pattern_matching.py"
            patterns:
              - "plan test feature"
              - "cleanup cache"
              - "vacuum organize files"
              - "tdd validate email"
              - "ado story user auth"
          
          - name: "priority_resolution"
            script: "scripts/upgrade/test_priority_resolution.py"
      
      - suite: "orchestrator_tests"
        description: "Verify orchestrator execution"
        tests:
          - name: "help_command"
            command: "timeout 5 python3 -m src.main 'help' --format markdown"
            expected_output_contains: "CORTEX"
          
          - name: "planning_orchestrator"
            command: "timeout 10 python3 -m src.main 'plan test feature' --dry-run"
            expected_output_contains: "Planning"
          
          - name: "cleanup_orchestrator"
            command: "timeout 10 python3 -m src.main 'cleanup cache' --dry-run"
            expected_output_contains: "Cleanup"
          
          - name: "tdd_orchestrator"
            command: "timeout 10 python3 -m src.main 'tdd validate email' --dry-run"
            expected_output_contains: "TDD"
      
      - suite: "audit_logger_tests"
        description: "Verify audit logging"
        tests:
          - name: "logger_writes"
            script: "scripts/upgrade/test_audit_logger_writes.py"
          
          - name: "event_classification"
            script: "scripts/upgrade/test_event_types.py"
          
          - name: "log_rotation"
            script: "scripts/upgrade/test_log_rotation.py"
          
          - name: "health_check_server"
            command: "curl http://localhost:8080/health"
            expected_status: 200
      
      - suite: "master_child_tests"
        description: "Verify master/child orchestrator pattern"
        tests:
          - name: "children_registered"
            script: "scripts/upgrade/test_child_registration.py"
          
          - name: "parent_invokes_children"
            script: "scripts/upgrade/test_parent_child_invocation.py"
          
          - name: "audit_logging_hierarchy"
            script: "scripts/upgrade/test_audit_hierarchy.py"
    
    artifacts:
      - path: "cortex-brain/documents/upgrades/{timestamp}/13-test-results.json"
        type: "json"
      - path: "cortex-brain/documents/upgrades/{timestamp}/14-test-output.log"
        type: "text"

  - phase_id: "P12"
    name: "Feature Summary & User Guidance"
    duration_estimate: "2 minutes"
    priority: medium
    description: "Generate executive summary"
    
    summary_generation:
      - id: "compile_features"
        script: "scripts/upgrade/compile_feature_summary.py"
        inputs:
          orchestrator_changes: "cortex-brain/documents/upgrades/{timestamp}/08-orchestrator-changes.json"
          architecture_changes: "cortex-brain/documents/upgrades/{timestamp}/10-architecture-changes.json"
          audit_wiring: "cortex-brain/documents/upgrades/{timestamp}/12-audit-logger-wiring.json"
        output: "cortex-brain/documents/upgrades/{timestamp}/NEW-FEATURES.md"
      
      - id: "generate_executive_summary"
        script: "scripts/upgrade/generate_executive_summary.py"
        max_words: 500
        sections:
          - "Upgrade Overview"
          - "Key Enhancements"
          - "New Capabilities"
          - "Breaking Changes (if any)"
          - "Next Steps"
        output: "cortex-brain/documents/upgrades/{timestamp}/EXECUTIVE-SUMMARY.md"
      
      - id: "create_migration_guide"
        script: "scripts/upgrade/create_migration_guide.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/MIGRATION-GUIDE.md"
      
      - id: "identify_breaking_changes"
        script: "scripts/upgrade/identify_breaking_changes.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/BREAKING-CHANGES.md"
    
    guidance_documents:
      - id: "quick_start"
        template: "templates/docs/quick-start-template.md"
        output: "cortex-brain/documents/upgrades/{timestamp}/QUICK-START.md"
      
      - id: "master_child_tutorial"
        template: "templates/docs/master-child-tutorial-template.md"
        output: "cortex-brain/documents/upgrades/{timestamp}/MASTER-CHILD-TUTORIAL.md"
      
      - id: "audit_log_viewing"
        template: "templates/docs/audit-log-viewing-template.md"
        output: "cortex-brain/documents/upgrades/{timestamp}/AUDIT-LOG-GUIDE.md"
    
    visualization:
      - id: "before_after_diagram"
        script: "scripts/upgrade/generate_before_after_diagram.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/before-after-architecture.svg"
      
      - id: "feature_comparison_matrix"
        script: "scripts/upgrade/generate_feature_matrix.py"
        output: "cortex-brain/documents/upgrades/{timestamp}/feature-comparison.html"

# Success Criteria
success_criteria:
  functional:
    - "Git pull successful with no unresolved conflicts"
    - "All dependencies installed without errors"
    - "All orchestrators import successfully"
    - "Routing table updated with new patterns"
    - "Documentation regenerated and valid"
    - "Master/child orchestrator wiring complete"
    - "Audit logging integrated across all orchestrators"
    - "Integration tests pass (>95% success rate)"
  
  quality:
    - "Zero breaking changes to user workflows (unless documented)"
    - "Backward compatibility maintained for existing plans"
    - "Performance not degraded (within 10% of baseline)"
    - "Documentation clarity score >90% (readability metrics)"
  
  user_experience:
    - "Executive summary clear and actionable (<500 words)"
    - "Migration guide provides step-by-step instructions"
    - "New features demonstrated with examples"
    - "Rollback instructions clear and tested"

# Audit Logging Configuration
audit_logging:
  enabled: true
  log_directory: "logs/cortex-audit/upgrade/"
  events:
    - "upgrade_start"
    - "phase_start"
    - "phase_complete"
    - "phase_error"
    - "conflict_detected"
    - "rollback_triggered"
    - "upgrade_complete"
  
  retention:
    days: 90
    max_size_mb: 100

# Rollback Configuration
rollback:
  enabled: true
  triggers:
    - "Phase P04 fails (git pull)"
    - "Phase P05 fails (dependency installation)"
    - "Phase P11 test success rate <80%"
    - "User manually invokes rollback"
  
  actions:
    - "git reset --hard {backup_commit}"
    - "Restore backed up config files"
    - "Reinstall old dependencies"
    - "Restore old prompts and documentation"
    - "Run health check"
  
  verification:
    command: "python3 -m src.main 'help' --format markdown"
    expected_exit_code: 0

# User Interaction
user_interaction:
  mode: "interactive"  # or "non_interactive" for CI/CD
  
  prompts:
    - phase: "before_git_pull"
      message: "Ready to pull {commit_count} commits from origin/CORTEX-5.0. Proceed? [y/N]"
      default: "n"
      abort_on_no: true
    
    - phase: "after_conflict_detection"
      message: "{conflict_count} merge conflicts detected. Resolve manually? [y] or rollback [n]"
      default: "y"
      abort_on_no: true
    
    - phase: "after_test_failures"
      message: "{failure_count} tests failed. Continue anyway? [y/N]"
      default: "n"
      abort_on_no: true

# Platform-Specific Configuration
platforms:
  windows:
    shell: "powershell"
    script_extension: ".ps1"
    path_separator: "\\"
  
  unix:
    shell: "bash"
    script_extension: ".sh"
    path_separator: "/"

# Dependencies
dependencies:
  python_version: ">=3.11"
  git_version: ">=2.30"
  
  required_commands:
    - git
    - python3
    - pip

# Output Configuration
output:
  format: "markdown"  # or "json", "yaml"
  verbosity: "normal"  # or "quiet", "verbose"
  
  directories:
    upgrade_docs: "cortex-brain/documents/upgrades/{timestamp}/"
    backups: "backups/upgrade-{timestamp}/"
    logs: "logs/cortex-audit/upgrade/"

