  - phase_id: "PHASE-6"
    name: "Component Library & Optimization"
    sequence: 6
    duration_days: 10
    status: "not_started"
    sub_plans: ["SP-14", "SP-15"]
    dor_validated: false
    dod_validated: false
    deliverables:
