    name: "Planning & Preparation"
    sequence: 0
    duration_days: 5
    status: "in_progress"
    dor_validated: true
    dod_validated: false
    deliverables:
      - "Planning System v3.0 manifest (this file)"
      - "Design extraction strategy document"
      - "Component migration checklist"
      - "Visualization replacement roadmap (Mermaid → D3.js)"
      - "Test strategy expansion plan (12 → 60+ tests)"
    tasks:
      - "Create Planning System v3.0 manifest"
      - "Document admin dashboard CSS architecture (8 layers)"
      - "Catalog glassmorphism patterns (backdrop-filter, transparency, shadows)"
      - "Map component dependencies (admin → lens)"
      - "Define D3.js visualization API contracts"
      - "Expand test plan"
      - "Git checkpoint"
  
  - phase_id: "PHASE-1"
    name: "Foundation - Design System & Typography"
    sequence: 1
    duration_days: 5
    status: "not_started"
    sub_plans: ["SP-1", "SP-2"]
    dor_validated: false
    dod_validated: false
    deliverables:
      - "Admin design extraction document (~1,200 LOC)"
      - "variables.css with 125% typography scale (~300 LOC)"
      - "Glassmorphism pattern library"
      - "3D brain visualization implementation guide"
      - "Loading animation library"
      - "Typography scale documentation"
  
  - phase_id: "PHASE-2"
    name: "Navigation & Visualizations"
    sequence: 2
    duration_days: 8
    status: "not_started"
    sub_plans: ["SP-3", "SP-4"]
    dor_validated: false
    dod_validated: false
    deliverables:
      - "Sidebar navigation system (~700 LOC)"
      - "6 D3.js visualization components (~1,200 LOC)"
      - "Three.js 3D brain component (~200 LOC)"
      - "Chart.js preset library (~300 LOC)"
      - "Export utilities (PNG/SVG)"
  
  - phase_id: "PHASE-3"
    name: "Core Tabs Implementation"
    sequence: 3
    duration_days: 10
    status: "not_started"
    sub_plans: ["SP-5", "SP-6", "SP-7", "SP-8"]
    dor_validated: false
    dod_validated: false
    deliverables:
      - "Executive Summary tab (~800 LOC)"
      - "System Overview tab (~850 LOC)"
      - "Tech Stack tab (~1,000 LOC)"
      - "Security tab (~1,000 LOC)"
  
  - phase_id: "PHASE-4"
    name: "Advanced Tabs Implementation"
    sequence: 4
    duration_days: 9
    status: "not_started"
    sub_plans: ["SP-9", "SP-10", "SP-11", "SP-12"]
    dor_validated: false
    dod_validated: false
    deliverables:
      - "Use Cases tab (~900 LOC)"
      - "Recommendations tab (~1,000 LOC)"
      - "Architecture tab (~1,100 LOC)"
      - "Code Organization tab (~1,050 LOC)"
  
  - phase_id: "PHASE-5"
    name: "Template Unification"
    sequence: 5
    duration_days: 10
    status: "not_started"
    sub_plans: ["SP-13"]
    dor_validated: false
    dod_validated: false
