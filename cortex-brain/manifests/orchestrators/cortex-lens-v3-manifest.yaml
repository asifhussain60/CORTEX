# CORTEX Lens v3.0 Orchestrator Manifest
# Defines requirements, integrations, and quality gates for CORTEX Lens v3.0 development
#
# Version: 3.0.0
# Author: Asif Hussain
# Created: 2025-12-14
# Status: ACTIVE - Phase 0 (Planning & Preparation)
# Planning System: v3.0 (orchestration_3_0)

schema_version: "1.0"

# ========================================
# Metadata
# ========================================

metadata:
  orchestrator_name: "cortex_lens_v3"
  version: "3.0.0"
  description: "Admin dashboard parity for CORTEX Lens with glassmorphism design, 8-tab navigation, D3.js visualization stack, and zero dependencies"
  category: "feature_development"
  deployment_tier: "user"
  status: "active"
  last_updated: "2025-12-14"
  maintainer: "Asif Hussain"
  planning_system: "v3.0"
  orchestrator_location: "src/orchestration_3_0/orchestrators/planning/"
  related_projects:
    - "cortex_lens_v2.5"
    - "cortex_admin_dashboard"
  documentation_path: "cortex-brain/documents/planning/active/cortex-enhancements/CORTEX-LENS-V3.0-MASTER-PLAN.md"
  changelog_path: "CHANGELOG.md"

# ========================================
# Planning System v3.0 Integration
# ========================================

planning_system_v3:
  state_machine:
    enabled: true
    fsm_states:
      - INITIALIZED
      - VALIDATING_DOR
      - EXECUTING
      - VALIDATING_DOD
      - COMPLETED
      - FAILED
    current_state: "VALIDATING_DOR"
  
  session_persistence:
    enabled: true
    backend: "sqlite"
    session_id: "cortex-lens-v3-{timestamp}"
    checkpoint_frequency: "per_phase"
    recovery_enabled: true
  
  dependency_injection:
    enabled: true
    container_location: "src/orchestration_3_0/core/dependency_container.py"
    services_registered:
      - "planning_orchestrator"
      - "tdd_orchestrator"
      - "git_checkpoint_orchestrator"
      - "qa_orchestrator"
  
  multi_tenant:
    enabled: false
    reason: "Single-project development (CORTEX internal)"

# ========================================
# Definition of Ready (DoR)
# ========================================

definition_of_ready:
  feature_requirements:
    - requirement: "Feature name defined"
      status: "complete"
      value: "CORTEX Lens v3.0 Admin Dashboard Parity"
    
    - requirement: "Feature description (min 50 chars)"
      status: "complete"
      value: "Complete migration of admin dashboard glassmorphism design, 8-tab navigation, D3.js visualization stack, and production components to CORTEX Lens with zero external dependencies"
    
    - requirement: "Acceptance criteria (min 3)"
      status: "complete"
      count: 16
      criteria:
        - "All 6 templates have 8-tab structure"
        - "Glassmorphism 125% scale applied uniformly"
        - "Sidebar navigation working across all templates"
        - "All D3.js visualizations rendering with real data"
        - "26 components functional and tested"
        - "Performance targets met (<5min for 100K LOC)"
        - "Selenium test suite: 60+ tests, 95%+ pass rate"
        - "WCAG 2.1 AAA compliance achieved"
        - "Zero dependencies on admin dashboard"
        - "Zero console errors in browser"
        - "All assets loading correctly"
        - "Responsive design validated"
        - "Cross-browser compatibility confirmed"
        - "Documentation complete"
        - "Test coverage ≥85%"
        - "Release tagged: v3.0.0"
    
    - requirement: "Target release or timeline"
      status: "complete"
      value: "January 2026 (Week 15-17)"
  
  technical_prerequisites:
    - prerequisite: "Admin dashboard exists and is stable"
      status: "verified"
      location: "cortex-brain/dashboards/ui/"
    
    - prerequisite: "CORTEX Lens v2.5 baseline exists"
      status: "verified"
      location: "src/cortex_lens/"
    
    - prerequisite: "D3.js/Three.js/Chart.js can be vendored"
      status: "verified"
      approach: "Zero dependencies via vendored libraries"
    
    - prerequisite: "Template system supports extensions"
      status: "verified"
      capability: "HTML/CSS/JS injection supported"
    
    - prerequisite: "Selenium test framework exists"
      status: "verified"
      location: "tests/cortex_lens/"
      current_tests: 12
      target_tests: 60
  
  stakeholder_approvals:
    - stakeholder: "Technical Lead"
      approval_date: "2025-12-14"
      approved_items:
        - "Glassmorphism + 8-tab + D3.js stack approach"
        - "Zero dependencies constraint"
        - "125% typography scale rationale"
  
  dependencies:
    - dependency: "Admin dashboard stability"
      status: "monitoring"
      risk: "medium"
      mitigation: "Freeze admin dashboard changes during migration"
    
    - dependency: "v2.5 templates backward compatibility"
      status: "required"
      risk: "low"
      mitigation: "Maintain console_app and api_service templates"

# ========================================
# Complexity Analysis
# ========================================

complexity_analysis:
  overall_complexity: "HIGH"
  
  justification: |
    - 16 sub-plans spanning 6-7 weeks (13-14 weeks with Phase 0)
    - ~23,000 LOC new/modified code
    - Complex D3.js force graphs, Three.js 3D rendering
    - 6 repository type templates requiring unified redesign
    - 26+ production components with accessibility requirements
    - Performance optimization for 1M LOC repositories
  
  complexity_breakdown:
    foundation:
      sub_plans: ["SP-1", "SP-2"]
      complexity: "HIGH"
      reason: "Design extraction, CSS architecture, complex patterns"
    
    navigation_visualizations:
      sub_plans: ["SP-3", "SP-4"]
      complexity: "HIGH"
      reason: "D3.js force graphs, Three.js 3D brain, interactive visualizations"
    
    core_tabs:
      sub_plans: ["SP-5", "SP-6", "SP-7", "SP-8"]
      complexity: "MEDIUM"
      reason: "Template-based development with new visualizations"
    
    advanced_tabs:
      sub_plans: ["SP-9", "SP-10", "SP-11", "SP-12"]
      complexity: "MEDIUM"
      reason: "Business logic and interactive workflows"
    
    integration:
      sub_plans: ["SP-13", "SP-14"]
      complexity: "HIGH"
      reason: "Unifying 6 templates, 26 components with cross-template concerns"
    
    optimization_validation:
      sub_plans: ["SP-15", "SP-16"]
      complexity: "HIGH"
      reason: "Multi-threading, virtual scrolling, E2E validation across 6 templates"

# ========================================
# Phase Decomposition
# ========================================

phases:
