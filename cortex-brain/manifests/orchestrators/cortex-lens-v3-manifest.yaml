# ========================================
# TDD Requirements
# ========================================

tdd_requirements:
  enforcement_level: "mandatory"
  per_phase: true
  
  workflow:
    - phase: "RED"
      description: "Write failing test first"
      validation: "Test must fail with expected error message"
    
    - phase: "GREEN"
      description: "Implement minimal code to pass test"
      validation: "Test passes with implementation"
    
    - phase: "REFACTOR"
      description: "Clean up code, remove duplication"
      validation: "Tests still pass, coverage maintained"
  
  coverage_targets:
    overall: 85
    per_layer:
      templates: 85
      components: 90
      visualizations: 80
      utilities: 85
  
  test_strategy:
    unit_tests: true
    integration_tests: true
    e2e_tests: true
    test_pyramid:
      unit: 70
      integration: 20
      e2e: 10
  
  empty_test_detection: true
  test_template_library: true

# ========================================
# Integrations
# ========================================

integrations:
  - integration_id: "INT-001"
    target_component: "planning_orchestrator_v3"
    integration_type: "required"
    trigger_condition: "feature_planning"
    location: "src/orchestration_3_0/orchestrators/planning/"
    status: "active"
  
  - integration_id: "INT-002"
    target_component: "tdd_orchestrator"
    integration_type: "required"
    trigger_condition: "per_phase_execution"
    location: "src/orchestration_3_0/orchestrators/tdd/"
    status: "active"
  
  - integration_id: "INT-003"
    target_component: "git_checkpoint_orchestrator"
    integration_type: "required"
    trigger_condition: "after_each_phase"
    status: "active"
  
  - integration_id: "INT-004"
    target_component: "qa_orchestrator"
    integration_type: "required"
    trigger_condition: "before_phase_0_and_after_phase_7"
    status: "active"

