      target: "0"
    
    - indicator: "accessibility_compliance"
      measurement: "WCAG 2.1 AAA compliance"
      target: "100%"

# ========================================
# Risk Assessment
# ========================================

risks:
  - risk_id: "RISK-001"
    category: "technical"
    severity: "high"
    description: "Complex D3.js force graphs may have performance issues with large datasets"
    mitigation: "Implement canvas rendering for >1000 nodes, LOD for zoom, culling offscreen elements"
    status: "monitoring"
  
  - risk_id: "RISK-002"
    category: "timeline"
    severity: "medium"
    description: "13-14 weeks timeline is aggressive for 23,000 LOC"
    mitigation: "Prioritize core features, defer non-critical enhancements"
    status: "monitoring"
  
  - risk_id: "RISK-003"
    category: "integration"
    severity: "medium"
    description: "Admin dashboard changes during migration could break extraction"
    mitigation: "Freeze admin dashboard, create extraction snapshot"
    status: "mitigated"
  
  - risk_id: "RISK-004"
    category: "resource"
    severity: "low"
    description: "Single developer may face context switching overhead"
    mitigation: "Phase-based focus, clear DoR/DoD gates"
    status: "accepted"

# ========================================
# Validation Configuration
# ========================================

validation:
  on_initialization:
    enabled: true
    strict_mode: true
    fail_on_missing_requirements: true
    log_level: "info"
  
  on_execution:
    enabled: true
    validate_gates: true
    validate_integrations: true
    validate_workflow_sequence: true
  
  drift_detection:
    enabled: true
    check_frequency: "per_phase"
    report_missing_features: true
    report_path: "cortex-brain/documents/reports/cortex-lens-v3-drift-report.md"
