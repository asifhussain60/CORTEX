# ========================================
# Metrics & Monitoring
# ========================================

metrics:
  success_criteria:
    - metric: "phase_completion_rate"
      target: "100%"
      current: "0%"
      measurement: "Phases completed / Total phases"
    
    - metric: "test_pass_rate"
      target: "≥95%"
      current: "pending"
      measurement: "Passing tests / Total tests"
    
    - metric: "test_coverage"
      target: "≥85%"
      current: "pending"
      measurement: "Covered LOC / Total LOC"
    
    - metric: "performance_targets_met"
      target: "100%"
      current: "pending"
      measurement: "Benchmarks passed / Total benchmarks"
  
  quality_indicators:
    - indicator: "code_quality_score"
      measurement: "SonarQube rating"
      target: "A"
    
    - indicator: "security_vulnerabilities"
