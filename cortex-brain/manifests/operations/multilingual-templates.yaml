schema_version: '3.2'
last_updated: '2025-12-03'
description: Multilingual template variants for CORTEX responses

supported_languages:
  - en  # English
  - es  # Spanish
  - fr  # French
  - de  # German
  - pt  # Portuguese
  - it  # Italian
  - zh  # Chinese (Simplified)
  - ja  # Japanese
  - ko  # Korean
  - ar  # Arabic
  - ru  # Russian
  - hi  # Hindi

templates:
  help:
    en:
      concise:
        content: |
          **Quick Help:** Type commands naturally. Common: `help`, `plan [feature]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **CORTEX Help**
          
          Interact naturally - no slash commands needed. Common operations:
          - `help` - Show this help
          - `plan [feature]` - Create implementation plan
          - `start tdd` - Begin test-driven development
          - `commit` - Stage, commit, and push changes
          - `align` - Validate system alignment
          
          For detailed guidance, say "tutorial" or "explain [topic]".
      verbose:
        content: |
          **CORTEX Comprehensive Help**
          
          Welcome to CORTEX - your AI assistant with long-term memory and context awareness.
          
          **Core Operations:**
          - `help` - Display this help guide
          - `plan [feature]` - Generate implementation plan with DoR/DoD validation
          - `start tdd` - Begin test-driven development workflow (RED→GREEN→REFACTOR)
          - `commit` - Run commit orchestrator (stage, commit, push, sync)
          - `align` - Perform system alignment with integration checks
          - `tutorial` - Interactive 15-30 minute tutorial
          
          **Planning Commands:**
          - `plan [description]` - Create feature plan
          - `plan ado` - Import from Azure DevOps
          - `approve plan` - Mark plan as DoR-complete
          - `resume plan [name]` - Continue previous plan
          
          **Development Commands:**
          - `discover views in [file]` - Extract UI element IDs
          - `run tests` - Execute test suite
          - `suggest refactorings` - Get optimization suggestions
          
          **System Commands:**
          - `upgrade cortex` - Update to latest version
          - `cortex version` - Show current version
          - `feedback` - Report bugs or suggest features
          
          Say "tutorial" for interactive learning, or ask any question naturally.
    
    es:
      concise:
        content: |
          **Ayuda Rápida:** Escribe comandos naturalmente. Común: `help`, `plan [función]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **Ayuda de CORTEX**
          
          Interactúa naturalmente - no necesitas comandos especiales. Operaciones comunes:
          - `help` - Mostrar esta ayuda
          - `plan [función]` - Crear plan de implementación
          - `start tdd` - Comenzar desarrollo dirigido por pruebas
          - `commit` - Preparar, confirmar y enviar cambios
          - `align` - Validar alineación del sistema
          
          Para orientación detallada, di "tutorial" o "explica [tema]".
      verbose:
        content: |
          **Ayuda Completa de CORTEX**
          
          Bienvenido a CORTEX - tu asistente AI con memoria a largo plazo y conciencia de contexto.
          
          **Operaciones Principales:**
          - `help` - Mostrar esta guía de ayuda
          - `plan [función]` - Generar plan de implementación con validación DoR/DoD
          - `start tdd` - Comenzar flujo de desarrollo dirigido por pruebas (RED→GREEN→REFACTOR)
          - `commit` - Ejecutar orquestador de commits (preparar, confirmar, enviar, sincronizar)
          - `align` - Realizar alineación del sistema con verificaciones de integración
          - `tutorial` - Tutorial interactivo de 15-30 minutos
          
          **Comandos de Planificación:**
          - `plan [descripción]` - Crear plan de función
          - `plan ado` - Importar desde Azure DevOps
          - `approve plan` - Marcar plan como completo DoR
          - `resume plan [nombre]` - Continuar plan anterior
          
          **Comandos de Desarrollo:**
          - `discover views in [archivo]` - Extraer IDs de elementos UI
          - `run tests` - Ejecutar suite de pruebas
          - `suggest refactorings` - Obtener sugerencias de optimización
          
          **Comandos del Sistema:**
          - `upgrade cortex` - Actualizar a última versión
          - `cortex version` - Mostrar versión actual
          - `feedback` - Reportar errores o sugerir funciones
          
          Di "tutorial" para aprendizaje interactivo, o pregunta cualquier cosa naturalmente.
    
    fr:
      concise:
        content: |
          **Aide Rapide:** Tapez les commandes naturellement. Courant: `help`, `plan [fonctionnalité]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **Aide CORTEX**
          
          Interagissez naturellement - pas besoin de commandes spéciales. Opérations courantes:
          - `help` - Afficher cette aide
          - `plan [fonctionnalité]` - Créer un plan d'implémentation
          - `start tdd` - Commencer le développement piloté par les tests
          - `commit` - Préparer, valider et pousser les modifications
          - `align` - Valider l'alignement du système
          
          Pour des conseils détaillés, dites "tutorial" ou "expliquer [sujet]".
      verbose:
        content: |
          **Aide Complète CORTEX**
          
          Bienvenue à CORTEX - votre assistant IA avec mémoire à long terme et conscience du contexte.
          
          **Opérations Principales:**
          - `help` - Afficher ce guide d'aide
          - `plan [fonctionnalité]` - Générer un plan d'implémentation avec validation DoR/DoD
          - `start tdd` - Commencer le flux de développement piloté par les tests (RED→GREEN→REFACTOR)
          - `commit` - Exécuter l'orchestrateur de commits (préparer, valider, pousser, synchroniser)
          - `align` - Effectuer l'alignement du système avec vérifications d'intégration
          - `tutorial` - Tutoriel interactif de 15-30 minutes
          
          Dites "tutorial" pour l'apprentissage interactif, ou posez n'importe quelle question naturellement.
    
    de:
      concise:
        content: |
          **Schnelle Hilfe:** Befehle natürlich eingeben. Häufig: `help`, `plan [Funktion]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **CORTEX Hilfe**
          
          Interagieren Sie natürlich - keine speziellen Befehle erforderlich. Häufige Operationen:
          - `help` - Diese Hilfe anzeigen
          - `plan [Funktion]` - Implementierungsplan erstellen
          - `start tdd` - Testgetriebene Entwicklung starten
          - `commit` - Änderungen vorbereiten, bestätigen und pushen
          - `align` - Systemausrichtung validieren
          
          Für detaillierte Anleitungen sagen Sie "tutorial" oder "erkläre [Thema]".
      verbose:
        content: |
          **CORTEX Umfassende Hilfe**
          
          Willkommen bei CORTEX - Ihrem KI-Assistenten mit Langzeitgedächtnis und Kontextbewusstsein.
          
          **Hauptoperationen:**
          - `help` - Diese Hilfeanleitung anzeigen
          - `plan [Funktion]` - Implementierungsplan mit DoR/DoD-Validierung generieren
          - `start tdd` - Testgetriebenen Entwicklungsworkflow starten (RED→GREEN→REFACTOR)
          - `commit` - Commit-Orchestrator ausführen (vorbereiten, bestätigen, pushen, synchronisieren)
          - `align` - Systemausrichtung mit Integrationsprüfungen durchführen
          - `tutorial` - Interaktives 15-30 Minuten Tutorial
          
          Sagen Sie "tutorial" für interaktives Lernen, oder stellen Sie jede Frage natürlich.
    
    pt:
      concise:
        content: |
          **Ajuda Rápida:** Digite comandos naturalmente. Comum: `help`, `plan [recurso]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **Ajuda CORTEX**
          
