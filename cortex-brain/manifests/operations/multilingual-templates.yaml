    zh:
      concise:
        content: |
          **快速帮助：** 自然输入命令。常用：`help`、`plan [功能]`、`start tdd`、`commit`、`align`。
      balanced:
        content: |
          **CORTEX 帮助**
          
          自然交互 - 无需特殊命令。常见操作：
          - `help` - 显示此帮助
          - `plan [功能]` - 创建实现计划
          - `start tdd` - 开始测试驱动开发
