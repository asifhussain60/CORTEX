      verbose:
        content: |
          **Ajuda Completa CORTEX**
          
          Bem-vindo ao CORTEX - seu assistente IA com memória de longo prazo e consciência de contexto.
          
          **Operações Principais:**
          - `help` - Mostrar este guia de ajuda
          - `plan [recurso]` - Gerar plano de implementação com validação DoR/DoD
