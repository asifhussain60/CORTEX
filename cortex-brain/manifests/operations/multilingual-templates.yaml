      verbose:
        content: |
          **CORTEX 包括的ヘルプ**
          
          CORTEX へようこそ - 長期記憶とコンテキスト認識を備えた AI アシスタントです。
          
          **主要な操作：**
          - `help` - このヘルプガイドを表示
          - `plan [機能]` - DoR/DoD 検証付きの実装計画を生成
          - `start tdd` - テスト駆動開発ワークフローを開始（RED→GREEN→REFACTOR）
          - `commit` - コミットオーケストレーターを実行（ステージ、コミット、プッシュ、同期）
          - `align` - 統合チェック付きのシステム整合性を実行
          - `tutorial` - 15-30分のインタラクティブチュートリアル
          
          「tutorial」と言ってインタラクティブな学習を行うか、自然に質問してください。
    
    ko:
      concise:
        content: |
          **빠른 도움말:** 자연스럽게 명령을 입력하세요. 일반: `help`, `plan [기능]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **CORTEX 도움말**
          
          자연스럽게 상호작용하세요 - 특별한 명령이 필요 없습니다. 일반적인 작업:
          - `help` - 이 도움말 표시
          - `plan [기능]` - 구현 계획 생성
          - `start tdd` - 테스트 주도 개발 시작
          - `commit` - 변경사항 준비, 커밋 및 푸시
          - `align` - 시스템 정렬 검증
          
          자세한 안내는 "tutorial" 또는 "[주제] 설명"이라고 말하세요.
      verbose:
        content: |
          **CORTEX 종합 도움말**
          
          CORTEX에 오신 것을 환영합니다 - 장기 기억과 컨텍스트 인식을 갖춘 AI 어시스턴트입니다.
          
          **핵심 작업:**
          - `help` - 이 도움말 가이드 표시
          - `plan [기능]` - DoR/DoD 검증이 포함된 구현 계획 생성
          - `start tdd` - 테스트 주도 개발 워크플로 시작 (RED→GREEN→REFACTOR)
          - `commit` - 커밋 오케스트레이터 실행 (준비, 커밋, 푸시, 동기화)
          - `align` - 통합 검사를 통한 시스템 정렬 수행
          - `tutorial` - 15-30분 대화형 튜토리얼
          
          대화형 학습을 위해 "tutorial"이라고 말하거나 자연스럽게 질문하세요.
    
    ar:
      concise:
        content: |
          **مساعدة سريعة:** اكتب الأوامر بشكل طبيعي. شائع: `help`، `plan [ميزة]`، `start tdd`، `commit`، `align`.
      balanced:
        content: |
          **مساعدة CORTEX**
          
          تفاعل بشكل طبيعي - لا حاجة لأوامر خاصة. العمليات الشائعة:
          - `help` - عرض هذه المساعدة
          - `plan [ميزة]` - إنشاء خطة تنفيذ
          - `start tdd` - بدء التطوير الموجه بالاختبار
          - `commit` - تجهيز وتأكيد ودفع التغييرات
          - `align` - التحقق من محاذاة النظام
          
          للحصول على إرشادات تفصيلية، قل "tutorial" أو "اشرح [موضوع]".
      verbose:
        content: |
          **مساعدة CORTEX الشاملة**
          
          مرحبًا بك في CORTEX - مساعدك الذكي مع الذاكرة طويلة المدى والوعي بالسياق.
          
          **العمليات الأساسية:**
          - `help` - عرض دليل المساعدة هذا
          - `plan [ميزة]` - إنشاء خطة تنفيذ مع التحقق من DoR/DoD
          - `start tdd` - بدء سير عمل التطوير الموجه بالاختبار (RED→GREEN→REFACTOR)
          - `commit` - تشغيل منسق الالتزامات (تجهيز، تأكيد، دفع، مزامنة)
          - `align` - تنفيذ محاذاة النظام مع فحوصات التكامل
          - `tutorial` - برنامج تعليمي تفاعلي لمدة 15-30 دقيقة
          
          قل "tutorial" للتعلم التفاعلي، أو اطرح أي سؤال بشكل طبيعي.
    
    ru:
      concise:
        content: |
          **Быстрая помощь:** Вводите команды естественно. Часто: `help`, `plan [функция]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **Помощь CORTEX**
          
          Взаимодействуйте естественно - специальные команды не нужны. Распространенные операции:
          - `help` - Показать эту справку
          - `plan [функция]` - Создать план реализации
          - `start tdd` - Начать разработку через тестирование
          - `commit` - Подготовить, зафиксировать и отправить изменения
          - `align` - Проверить выравнивание системы
          
          Для подробного руководства скажите "tutorial" или "объясни [тему]".
      verbose:
        content: |
          **Полная помощь CORTEX**
          
          Добро пожаловать в CORTEX - ваш AI-ассистент с долговременной памятью и контекстной осведомленностью.
          
          **Основные операции:**
          - `help` - Показать это руководство
          - `plan [функция]` - Создать план реализации с проверкой DoR/DoD
          - `start tdd` - Начать рабочий процесс разработки через тестирование (RED→GREEN→REFACTOR)
          - `commit` - Запустить оркестратор коммитов (подготовка, фиксация, отправка, синхронизация)
          - `align` - Выполнить выравнивание системы с проверками интеграции
          - `tutorial` - Интерактивное руководство на 15-30 минут
          
          Скажите "tutorial" для интерактивного обучения или задайте любой вопрос естественно.
    
    hi:
      concise:
        content: |
          **त्वरित सहायता:** स्वाभाविक रूप से कमांड टाइप करें। सामान्य: `help`, `plan [सुविधा]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **CORTEX सहायता**
          
          स्वाभाविक रूप से इंटरैक्ट करें - विशेष कमांड की आवश्यकता नहीं। सामान्य संचालन:
          - `help` - यह सहायता दिखाएं
          - `plan [सुविधा]` - कार्यान्वयन योजना बनाएं
          - `start tdd` - परीक्षण-संचालित विकास शुरू करें
          - `commit` - परिवर्तनों को तैयार, कमिट और पुश करें
          - `align` - सिस्टम संरेखण सत्यापित करें
          
          विस्तृत मार्गदर्शन के लिए, "tutorial" या "समझाएं [विषय]" कहें।
      verbose:
        content: |
          **CORTEX व्यापक सहायता**
          
          CORTEX में आपका स्वागत है - दीर्घकालिक स्मृति और संदर्भ जागरूकता के साथ आपका AI सहायक।
          
          **मुख्य संचालन:**
          - `help` - यह सहायता मार्गदर्शिका दिखाएं
          - `plan [सुविधा]` - DoR/DoD सत्यापन के साथ कार्यान्वयन योजना बनाएं
          - `start tdd` - परीक्षण-संचालित विकास वर्कफ़्लो शुरू करें (RED→GREEN→REFACTOR)
          - `commit` - कमिट ऑर्केस्ट्रेटर चलाएं (तैयारी, कमिट, पुश, सिंक)
          - `align` - एकीकरण जांच के साथ सिस्टम संरेखण करें
          - `tutorial` - 15-30 मिनट का इंटरैक्टिव ट्यूटोरियल
          
          इंटरैक्टिव सीखने के लिए "tutorial" कहें, या स्वाभाविक रूप से कोई भी प्रश्न पूछें।
  
