      verbose:
        content: |
          **Aiuto Completo CORTEX**
          
          Benvenuto in CORTEX - il tuo assistente IA con memoria a lungo termine e consapevolezza del contesto.
          
          **Operazioni Principali:**
          - `help` - Mostra questa guida di aiuto
          - `plan [funzionalità]` - Genera piano di implementazione con validazione DoR/DoD
