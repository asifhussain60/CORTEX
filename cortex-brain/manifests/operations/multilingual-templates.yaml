    it:
      concise:
        content: |
          **Aiuto Rapido:** Digita i comandi naturalmente. Comune: `help`, `plan [funzionalità]`, `start tdd`, `commit`, `align`.
      balanced:
        content: |
          **Aiuto CORTEX**
          
          Interagisci naturalmente - nessun comando speciale necessario. Operazioni comuni:
          - `help` - Mostra questo aiuto
          - `plan [funzionalità]` - Crea piano di implementazione
