      verbose:
        content: |
          **CORTEX 综合帮助**
          
          欢迎使用 CORTEX - 您的具有长期记忆和上下文感知的 AI 助手。
          
          **核心操作：**
          - `help` - 显示此帮助指南
          - `plan [功能]` - 生成带有 DoR/DoD 验证的实现计划
          - `start tdd` - 开始测试驱动开发工作流（RED→GREEN→REFACTOR）
          - `commit` - 运行提交协调器（暂存、提交、推送、同步）
          - `align` - 执行系统对齐与集成检查
          - `tutorial` - 15-30 分钟互动教程
          
          说"tutorial"进行互动学习，或自然地提出任何问题。
    
    ja:
      concise:
        content: |
          **クイックヘルプ：** 自然にコマンドを入力してください。一般的：`help`、`plan [機能]`、`start tdd`、`commit`、`align`。
      balanced:
        content: |
          **CORTEX ヘルプ**
          
          自然に対話してください - 特別なコマンドは不要です。一般的な操作：
          - `help` - このヘルプを表示
          - `plan [機能]` - 実装計画を作成
          - `start tdd` - テスト駆動開発を開始
          - `commit` - 変更をステージ、コミット、プッシュ
          - `align` - システムの整合性を検証
          
