- layer_id: git_isolation
  name: Workspace-Aware Operations & Git Isolation
  description: File operations target active workspace with CORTEX core protection (Phase 11)
  priority: 8
  rules:
  - rule_id: WORKSPACE_AWARE_OPERATIONS
    name: Workspace-Aware File Operations (Phase 11)
    severity: blocked
    description: 'NEW (Phase 11): File operations must target active workspace or CORTEX non-core paths. Prevents cross-workspace contamination and CORTEX core modification.'
    detection:
      path_patterns:
      - writing to inactive workspace
      - modifying CORTEX core (src/tier0-3/)
      - cross-workspace file operations
    alternatives:
    - Operations automatically routed to active workspace
    - Use WorkspaceOperationValidator for validation
    - CORTEX can write to active user workspace
    - CORTEX core paths (tier0-3/) are read-only
    evidence_template: "🎯 Workspace Operation Validation\n\nOperation: {operation}\nTarget: {target_path}\nActive Workspace: {workspace_name}\n\nRules:\n✅ CORTEX can WRITE to active user workspace\n✅ CORTEX can READ from any workspace\n❌ Cannot write to INACTIVE workspaces\n❌ Cannot modify CORTEX core (tier0-3/)\n\nValidator: src/tier0/workspace_operation_validator.py\n"
    rationale: 'Phase 11 Multi-Repo Architecture enables one CORTEX installation to serve multiple user repositories. Workspace-aware validation ensures operations target the correct workspace while protecting CORTEX core integrity.'
  - rule_id: GIT_ISOLATION_ENFORCEMENT
    name: CORTEX Code Isolation (DEPRECATED - See WORKSPACE_AWARE_OPERATIONS)
    severity: info
    description: 'DEPRECATED: Replaced by WORKSPACE_AWARE_OPERATIONS in Phase 11. Old rule blocked all CORTEX writes to user repos. New rule allows writes to ACTIVE workspace.'
    detection:
      path_patterns:
      - '**/src/tier0/**'
      - '**/src/tier1/**'
      - '**/src/tier2/**'
      - '**/src/tier3/**'
      - '**/src/cortex_agents/**'
      - '**/src/plugins/**'
      - '**/src/crawlers/**'
      - '**/cortex-brain/**'
      - '**/prompts/**'
      - '**/scripts/cortex/**'
      - '**/CORTEX/**'
      in_repo: user_application
    alternatives:
    - Keep CORTEX as separate repository/package
    - Install CORTEX via pip/npm (when distributed)
    - Use git submodule if local development required
    - Ensure .gitignore excludes CORTEX directories
    evidence_template: "\U0001F6A8 DEPRECATED RULE - See WORKSPACE_AWARE_OPERATIONS\n\nThis rule is deprecated as of Phase 11 (Multi-Repo Architecture).\n\nOLD BEHAVIOR: CORTEX code never written to user repos\nNEW BEHAVIOR: CORTEX writes to ACTIVE user workspace (orchestrators create files)\n\nMigration: Use WorkspaceOperationValidator for workspace-aware validation.\n"
    rationale: '#file:documents/rationales/GIT_ISOLATION_ENFORCEMENT.md (archived)'
  - rule_id: GIT_HOOKS_INSTALLATION
    name: Git Hooks Must Be Installed During Setup
    severity: blocked
    description: Setup process must install git hooks to prevent accidental CORTEX code commits
    detection:
      keywords:
      - skip git hooks
      - disable hooks
      - bypass hook installation
      scope:
      - intent
      - description
    alternatives:
    - Run 'cortex init' to install hooks automatically
    - Manually run setup script with hooks enabled
    - Never bypass hook installation (critical protection)
    evidence_template: Git hooks are MANDATORY for CORTEX isolation protection
    rationale: 'Git hooks provide automatic enforcement:


      pre-commit hook:

      - Scans staged files for CORTEX paths

      - Blocks commit if any CORTEX code detected

      - Shows clear error message with alternatives


      pre-push hook:

      - Final safety check before push

      - Prevents accidental exposure of CORTEX code


      Installation: Automatic during ''cortex init''

      Location: UserApp/.git/hooks/ (user''s repo, not CORTEX repo)

      '
- layer_id: namespace_protection
  name: Knowledge Namespace Boundaries
  description: Enforce separation between CORTEX framework and workspace knowledge
  priority: 6
  rules:
  - rule_id: NAMESPACE-001
    name: Protected CORTEX Namespace
    severity: blocked
    description: Prevent user code from writing to cortex.* namespace
    detection:
      combined_keywords:
        namespace_write:
        - learn_pattern
        - store_pattern
        - add pattern
        cortex_namespace:
        - cortex.*
        - namespace='cortex.
        - namespace="cortex.
        not_framework:
        - is_cortex_internal=False
        - user code
      scope:
      - code
      - intent
      logic: AND
    alternatives:
    - Use workspace.* namespace for application patterns
    - workspace.myapp.* for your project-specific knowledge
    - Only CORTEX framework code can write to cortex.* namespace
    evidence_template: "NAMESPACE PROTECTION VIOLATION\n\nAttempted write to protected cortex.* namespace from user code!\n\nCode: '{code_snippet}'\n\nCORTEX namespaces are PROTECTED:\n- cortex.* \u2192 Framework knowledge only (read-only for users)\n- workspace.* \u2192 Application knowledge (user read/write)\n\nUse: learn_pattern(..., namespace=\"workspace.myapp.*\", is_cortex_internal=False)\n"
    rationale: '#file:documents/rationales/NAMESPACE-001.md'
  - rule_id: NAMESPACE-002
    name: Workspace Isolation
    severity: warning
    description: Isolate workspace patterns by owner/project
    detection:
      combined_keywords:
        cross_workspace:
        - workspace.projectA
        - workspace.projectB
        shared_pattern:
        - pattern applies to both
        - copy to other project
      scope:
      - intent
      - description
      logic: AND
    alternatives:
    - Store pattern in each workspace separately
    - Use cortex.* for truly generic framework patterns
    - Create explicit cross-workspace link if needed
    evidence_template: "CROSS-WORKSPACE CONTAMINATION RISK\n\nPattern appears to span multiple workspaces: '{description}'\n\nBest Practices:\n- workspace.projectA.* \u2192 Project A only\n- workspace.projectB.* \u2192 Project B only\n- cortex.* \u2192 Framework generic knowledge\n\nIf truly shared, use explicit relationship links, not duplicate storage.\n"
    rationale: '#file:documents/rationales/NAMESPACE-002.md'
  - rule_id: NAMESPACE-003
    name: No Namespace Mixing
    severity: blocked
    description: Prevent patterns from spanning multiple namespaces
    detection:
      combined_keywords:
        multi_namespace:
        - namespaces=['cortex.
        - namespaces=['workspace.a', 'workspace.b']
        pattern_storage:
        - store_pattern
        - learn_pattern
      scope:
      - code
      logic: AND
    alternatives:
    - Store pattern in single primary namespace
    - Use relationship links for cross-namespace references
    - Duplicate pattern if truly applicable to both (rare)
    evidence_template: "NAMESPACE MIXING VIOLATION\n\nPattern assigned to multiple namespaces: '{namespaces}'\n\nA pattern MUST belong to exactly ONE namespace.\n\nIf pattern applies to multiple contexts, use explicit links:\n- Primary: workspace.myapp.auth_pattern\n- Link: cortex.security_patterns \u2192 workspace.myapp.auth_pattern\n\nThis maintains clear ownership and prevents ambiguity.\n"
    rationale: '#file:documents/rationales/NAMESPACE-003.md'
