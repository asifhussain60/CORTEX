  - rule_id: INLINE_CSS_PROHIBITION
    name: Centralized CSS (No Inline Styles)
    severity: blocked
    description: "Inline CSS prohibited - all styles must be centralized to CSS files. REFACTOR phase must migrate inline styles."
    detection:
      combined_keywords:
        inline_css_patterns:
        - style=
        - <style>
        - .style.
        - .setAttribute('style'
        - .css(
        - cssText
        html_ui_context:
        - html
        - template
        - component
        - view
        - frontend
        - ui
      scope:
      - intent
      - file_content
      - code_review
      - refactor_phase
    alternatives:
    - Extract inline styles to external CSS file
    - Use CSS classes instead of inline styles
    - Create component-specific CSS modules (e.g., component.module.css)
    - Use CSS utility frameworks (Tailwind, Bootstrap) with class names
    - Migrate style="" attributes to class="" with CSS definitions
    - Move <style> blocks to .css files with proper imports
    - Replace JavaScript style manipulation with CSS class toggling
    evidence_template: |
      Inline CSS detected - Centralization required!
      
      File: '{file_path}'
      Phase: '{phase}'
      
      ❌ BLOCKED: Inline CSS must be migrated to centralized CSS files
      
      WHY CSS CENTRALIZATION MATTERS:
      
      Without Centralization (Inline CSS):
      - ❌ Styles scattered across HTML/JSX/templates (impossible to maintain)
      - ❌ Duplication: Same color/spacing repeated 50+ times
      - ❌ No reusability: Can't share styles across components
      - ❌ Performance: Inline styles can't be cached by browser
      - ❌ Override hell: !important wars to override inline styles
      - ❌ No theming: Can't swap themes (dark mode impossible)
      - ❌ Accessibility: Can't centrally manage responsive/contrast adjustments
      - ❌ Debugging nightmare: "Where is this blue coming from?"
      
      With Centralization (CSS Files):
      - ✅ Single source of truth for all styles
      - ✅ DRY: Define once, use everywhere (.btn-primary)
      - ✅ Reusability: Share styles across components/pages
      - ✅ Performance: Browser caches CSS files (faster loads)
      - ✅ Maintainability: Change color once, updates everywhere
      - ✅ Theming: Swap CSS file for instant dark mode
      - ✅ Accessibility: Central responsive/contrast rules
      - ✅ Debugging: DevTools show CSS file + line number
      
      DETECTION PATTERNS:
      
      1. **HTML/JSX Inline Styles:**
         ```html
         <!-- ❌ BLOCKED: Inline style attribute -->
         <div style="color: blue; margin: 10px;">Content</div>
         
         <!-- ✅ CORRECT: CSS class -->
         <div class="content-box">Content</div>
         ```
         CSS file (styles.css):
         ```css
         .content-box {
           color: blue;
           margin: 10px;
         }
         ```
      
      2. **Embedded <style> Tags:**
         ```html
         <!-- ❌ BLOCKED: Embedded style block -->
         <style>
           .header { background: red; }
         </style>
         
         <!-- ✅ CORRECT: External CSS -->
         <link rel="stylesheet" href="styles.css">
         ```
      
      3. **JavaScript Style Manipulation:**
         ```javascript
         // ❌ BLOCKED: Direct style manipulation
         element.style.color = 'red';
         element.style.display = 'none';
         element.setAttribute('style', 'color: red');
         element.style.cssText = 'color: red; margin: 10px';
         
         // ✅ CORRECT: CSS class toggling
         element.classList.add('hidden');
         element.classList.toggle('active');
         element.classList.remove('visible');
         ```
         CSS file:
         ```css
         .hidden { display: none; }
         .active { color: red; }
         .visible { display: block; }
         ```
      
      4. **jQuery/Framework Style Methods:**
         ```javascript
         // ❌ BLOCKED: jQuery .css()
         $('.element').css('color', 'red');
         $('.element').css({ color: 'red', margin: '10px' });
         
         // ✅ CORRECT: CSS class toggling
         $('.element').addClass('active');
         $('.element').toggleClass('hidden');
         ```
      
      MIGRATION STRATEGY:
      
      Step 1: Identify Inline Styles
      ```bash
      # Grep for inline style patterns
      grep -r 'style=' src/
      grep -r '.style\.' src/
      grep -r '.css(' src/
      grep -r '<style>' src/
      ```
      
      Step 2: Extract to CSS Files
      ```
      Project Structure:
      src/
      ├── components/
      │   ├── Header/
      │   │   ├── Header.jsx
      │   │   └── Header.module.css    ← Component-specific styles
      │   └── Button/
      │       ├── Button.jsx
      │       └── Button.module.css
      ├── styles/
      │   ├── global.css               ← Global styles
      │   ├── variables.css            ← CSS variables (colors, spacing)
      │   └── utilities.css            ← Utility classes (.flex, .grid)
      └── App.jsx
      ```
      
      Step 3: Convert Inline to Classes
      ```html
      <!-- Before -->
      <button style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px;">
        Click Me
      </button>
      
      <!-- After -->
      <button class="btn btn-primary">
        Click Me
      </button>
      ```
      ```css
      /* Button.module.css */
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      
      .btn-primary {
        background: #007bff;
        color: white;
      }
      ```
      
      Step 4: Replace JS Style Manipulation
      ```javascript
      // Before
      function showModal() {
        modal.style.display = 'block';
        overlay.style.opacity = '1';
        body.style.overflow = 'hidden';
      }
      
      // After
      function showModal() {
        modal.classList.add('modal-visible');
        overlay.classList.add('overlay-active');
        body.classList.add('no-scroll');
      }
      ```
      ```css
      /* styles.css */
      .modal-visible { display: block; }
      .overlay-active { opacity: 1; }
      .no-scroll { overflow: hidden; }
      ```
      
      REFACTOR PHASE INTEGRATION (Planning System 2.0):
      
      This rule MUST be validated during REFACTOR phase:
      
      ```yaml
      # Planning System 2.0 REFACTOR Phase Checklist
      refactor_validations:
        - orphaned_code_removal     # REFACTOR_CODE_CLEANUP_ENFORCEMENT
        - duplicate_detection       # HOLISTIC_CODE_DISCOVERY_ENFORCEMENT
        - inline_css_migration      # INLINE_CSS_PROHIBITION ← NEW
        - test_coverage_check
        - documentation_update
      ```
      
      REFACTOR Phase Workflow:
      1. Detect inline styles (grep patterns)
      2. Extract to CSS file (component-specific or shared)
      3. Replace inline styles with CSS classes
      4. Verify visual parity (SKULL_VISUAL_REGRESSION)
      5. Run tests to validate (SKULL_TEST_BEFORE_CLAIM)
      6. Commit only if zero inline styles remain
      
      CSS ORGANIZATION PATTERNS:
      
      Pattern 1: Component-Scoped CSS (Recommended)
      ```
      components/
      ├── Header/
      │   ├── Header.jsx
      │   └── Header.module.css    ← Scoped to Header component
      └── Card/
          ├── Card.jsx
          └── Card.module.css      ← Scoped to Card component
      ```
      Benefits: Encapsulation, no naming conflicts, clear ownership
      
      Pattern 2: Feature-Based CSS
      ```
      features/
      ├── authentication/
      │   ├── components/
      │   └── styles/
      │       ├── login.css
      │       └── register.css
      └── dashboard/
          ├── components/
          └── styles/
              └── dashboard.css
      ```
      Benefits: Feature cohesion, easy to locate styles
      
      Pattern 3: Atomic/Utility CSS (Tailwind-style)
      ```
      styles/
      ├── utilities.css    ← .flex, .grid, .hidden, .text-center
      ├── components.css   ← .btn, .card, .modal
      └── variables.css    ← :root { --primary-color: #007bff; }
      ```
      Benefits: Highly reusable, minimal CSS duplication
      
      CSS VARIABLES FOR THEMING:
      
      ```css
      /* variables.css */
      :root {
        /* Colors */
        --color-primary: #007bff;
        --color-secondary: #6c757d;
        --color-success: #28a745;
        --color-danger: #dc3545;
        
        /* Spacing */
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        
        /* Typography */
        --font-size-sm: 12px;
        --font-size-md: 16px;
        --font-size-lg: 20px;
      }
      
      /* Dark mode override */
      [data-theme="dark"] {
        --color-primary: #0d6efd;
        --color-background: #1a1a1a;
        --color-text: #ffffff;
      }
      ```
      
      Usage:
      ```css
      .btn-primary {
        background: var(--color-primary);
        padding: var(--spacing-md);
        font-size: var(--font-size-md);
      }
      ```
      
      EXCEPTIONS (Rare Cases):
      
      Only允许 inline styles in these scenarios:
      1. **Dynamic values from backend** (e.g., chart colors from API)
         ```jsx
         <div style={{ backgroundColor: user.themeColor }}>
         ```
         → Still prefer CSS variables: `element.style.setProperty('--user-color', user.themeColor)`
      
      2. **Canvas/SVG animations** (computed positions)
         ```javascript
         canvas.style.transform = `translate(${x}px, ${y}px)`;
         ```
         → Consider CSS animations with CSS variables
      
      3. **Third-party libraries requiring inline styles**
         → Wrap in component, isolate inline styles
      
      Document exceptions with comments:
      ```jsx
      {/* INLINE_CSS_PROHIBITION exception: Dynamic color from API */}
      <div style={{ backgroundColor: apiColor }}>
      ```
      
      ENFORCEMENT IN PLANNING SYSTEM 2.0:
      
      The REFACTOR phase in Planning System 2.0 MUST include CSS centralization check:
      
      ```python
      # src/orchestrators/planning_system_2.py
      def validate_refactor_phase(codebase):
          validations = [
              validate_orphaned_code_removed(),
              validate_duplicates_consolidated(),
              validate_inline_css_migrated(),  # ← NEW
              validate_tests_pass(),
              validate_documentation_updated()
          ]
          return all(validations)
      
      def validate_inline_css_migrated(codebase):
          """Check for inline CSS patterns"""
          patterns = [
              r'style="[^"]+"',           # HTML style attribute
              r'\.style\.[a-zA-Z]+\s*=',  # JS .style.property
              r'\.css\(["\']',            # jQuery .css()
              r'<style>',                 # Embedded style tags
              r'\.setAttribute\(["\']style'
          ]
          
          violations = []
          for file in codebase.files:
              for pattern in patterns:
                  matches = re.findall(pattern, file.content)
                  if matches:
                      violations.append({
                          'file': file.path,
                          'pattern': pattern,
                          'count': len(matches)
                      })
          
          if violations:
              raise RefactorValidationError(
                  "INLINE_CSS_PROHIBITION: Inline styles detected",
                  violations=violations
              )
          
          return True
      ```
      
      REAL-WORLD EXAMPLE:
      
      Scenario: Add user notification component
      
      ❌ Without INLINE_CSS_PROHIBITION:
      ```jsx
      // NotificationBanner.jsx (GREEN phase)
      function NotificationBanner({ message, type }) {
        return (
          <div style={{
            position: 'fixed',
            top: '20px',
            right: '20px',
            padding: '15px 20px',
            backgroundColor: type === 'error' ? '#dc3545' : '#28a745',
            color: 'white',
            borderRadius: '4px',
            boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
            zIndex: 9999
          }}>
            {message}
          </div>
        );
      }
      ```
      Result: Inline styles, no reusability, maintenance nightmare
      
      ✅ With INLINE_CSS_PROHIBITION:
      ```jsx
      // NotificationBanner.jsx (after REFACTOR)
      import './NotificationBanner.module.css';
      
      function NotificationBanner({ message, type }) {
        return (
          <div className={`notification notification-${type}`}>
            {message}
          </div>
        );
      }
      ```
      ```css
      /* NotificationBanner.module.css */
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        color: white;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        z-index: 9999;
      }
      
      .notification-error {
        background-color: var(--color-danger);
      }
      
      .notification-success {
        background-color: var(--color-success);
      }
      ```
      Result: Centralized, reusable, themeable, maintainable
      
      This rule ensures CORTEX generates maintainable, professional frontend code.
    rationale: "INLINE_CSS_PROHIBITION: Professional Frontend Architecture\n\n- Inline CSS creates maintenance nightmares (scattered styles)\n- Centralized CSS enables reusability (define once, use everywhere)\n- Browser caching improves performance (CSS files cached)\n- Theming/accessibility require centralized control (dark mode, responsive)\n- Planning System 2.0 REFACTOR phase validates migration\n\nImplementation: REFACTOR phase grep validation + CSS extraction workflow\n"
