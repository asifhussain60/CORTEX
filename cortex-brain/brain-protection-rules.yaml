  \ user_version = 2;\n        ```\n        \n        Migration location: cortex-brain/migrations/XXX_description.sql\n        \n        Why migrations matter:\n        - Preserves data during schema changes\n        - Provides rollback capability\n        - Documents schema evolution\n        - Enables automated upgrades\n      \n      rationale: |\n        Schema migrations are MANDATORY for:\n        1. Data preservation: No data loss during schema changes\n        2. Upgrade automation: Apply migrations during upgrade workflow\n        3. Rollback safety: Revert schema if upgrade fails\n        4. Version tracking: PRAGMA user_version marks schema state\n        5. Team coordination: All deployments use same schema version\n    \n    - rule_id: \"DEPLOYMENT_TYPE_DETECTION\"\n      name: \"Intelligent Deployment Type Detection\"\n      severity: \"warning\"\n      description: \"Deployment operations should auto-detect setup vs upgrade mode\"\n      \n      detection:\n        keywords:\n\
  \          - \"manual deployment\"\n          - \"copy folder\"\n          - \"replace directory\"\n          - \"user must choose\"\n        scope: [\"operation\", \"workflow\"]\n      \n      alternatives:\n        - \"Auto-detect: No CORTEX/ \u2192 Setup mode\"\n        - \"Auto-detect: CORTEX/ exists \u2192 Upgrade mode\"\n        - \"Check .cortex-version for version comparison\"\n        - \"Provide dry-run mode for preview\"\n      \n      evidence_template: |\n        Manual deployment workflow detected: '{operation}'\n        \n        CORTEX should auto-detect deployment type:\n        \n        Detection Logic:\n        ```python\n        if not cortex_dir.exists():\n            return DeploymentType.INITIAL_SETUP\n        elif not version_file.exists():\n            return DeploymentType.LEGACY_UPGRADE\n        elif current_version < latest_version:\n            return DeploymentType.UPGRADE\n        else:\n            return DeploymentType.UP_TO_DATE\n        ```\n       \
  \ \n        User Experience:\n        - \"setup cortex\" \u2192 Auto-detects mode\n        - \"upgrade cortex\" \u2192 Auto-detects mode\n        - No manual decision needed\n      \n      rationale: |\n        Intelligent detection improves user experience:\n        - No \"am I upgrading or setting up?\" confusion\n        - Automatic brain preservation in upgrade mode\n        - Correct package download (full vs upgrade)\n        - Reduced human error\n    \n    - rule_id: \"CONFIG_MERGE_INTELLIGENCE\"\n      name: \"Config Files Require 3-Way Merge\"\n      severity: \"blocked\"\n      description: \"Config files (YAML) must use 3-way merge during upgrades, not overwrite\"\n      \n      detection:\n        combined_keywords:\n          upgrade_operation:\n            - \"upgrade\"\n            - \"update config\"\n          and_overwrite:\n            - \"overwrite yaml\"\n            - \"replace config\"\n            - \"copy config\"\n        scope: [\"operation\"]\n        logic:\
  \ \"AND\"\n      \n      alternatives:\n        - \"Use 3-way merge: Base + Local + Upgrade \u2192 Merged\"\n        - \"Preserve user customizations (local changes)\"\n        - \"Add new features from upgrade\"\n        - \"Detect conflicts and offer resolution\"\n      \n      evidence_template: |\n        Config overwrite detected during upgrade!\n        \n        File: '{file_path}'\n        Operation: '{operation}'\n        \n        CRITICAL: Config files need intelligent merging!\n        \n        3-Way Merge Process:\n        ```\n        Base Config (v5.1.0 - original)\n            +\n        Local Config (user customizations)\n            +\n        Upgrade Config (v5.2.0 - new features)\n            =\n        Merged Config (customizations + new features)\n        ```\n        \n        Example - response-templates.yaml:\n        Base: triggers: [\"help\"]\n        Local: triggers: [\"help\", \"cortex help\"] \u2190 User added\n        Upgrade: triggers: [\"help\"], new_template:\
  \ admin_help\n        Merged: triggers: [\"help\", \"cortex help\"], new_template: admin_help\n        \n        Preserve:\n        - User-added triggers\n        - Custom templates\n        - Modified capabilities\n        \n        Add:\n        - New templates from upgrade\n        - New capabilities\n        - New operations\n      \n      rationale: |\n        Config merging prevents loss of user customizations:\n        - User spent time configuring CORTEX\n        - Custom triggers, templates, operations\n        - Should be preserved during upgrades\n        - New features added alongside customizations\n    \n    - rule_id: \"PUBLISH_PACKAGE_VALIDATION\"\n      name: \"Publish Package Content Validation\"\n      severity: \"blocked\"\n      description: \"Published packages MUST NOT contain brain data or machine-specific files\"\n      \n      detection:\n        combined_keywords:\n          publish_operation:\n            - \"build package\"\n            - \"create publish\"\
  \n            - \"generate release\"\n          privacy_risk:\n            - \"*.db included\"\n            - \"brain data included\"\n            - \"machine paths included\"\n        scope: [\"operation\", \"validation\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"Exclude all .db files from publish\"\n        - \"Exclude cortex.config.json (machine-specific)\"\n        - \"Exclude .platform_state.json\"\n        - \"Use publish-config.yaml validation rules\"\n      \n      evidence_template: |\n        Privacy/data leak risk in publish package!\n        \n        Package: '{package_path}'\n        Risk: '{risk_type}'\n        \n        CRITICAL: Published packages MUST NOT contain:\n        - *.db files (brain data)\n        - cortex.config.json (machine-specific paths)\n        - .platform_state.json (hostname)\n        - .coverage.* (machine names)\n        - conversation-history.jsonl (private conversations)\n        \n        Validation checklist:\n       \
  \ \u2705 No .db files\n        \u2705 No machine-specific configs\n        \u2705 No hostnames/usernames\n        \u2705 No conversation data\n        \u2705 Only core CORTEX code\n        \n        Use forbidden_patterns from publish-config.yaml\n      \n      rationale: |\n        Privacy protection in published packages:\n        - Brain data is workspace-specific (never shared)\n        - Machine paths reveal private directory structure\n        - Conversation history is confidential\n        - Published packages = clean core only\n\n# Layer 8: Test Location Isolation\n- layer_id: \"test_location_isolation\"\n  name: \"Test Location Isolation\"\n  description: \"Application tests in user repo, CORTEX tests in CORTEX folder - maintain brain knowledge from both\"\n  priority: 8\n  \n  rules:\n    - rule_id: \"TEST_LOCATION_SEPARATION\"\n      name: \"Test Location Separation\"\n      severity: \"blocked\"\n      description: \"When running in development environments, application tests\
  \ MUST be created in user repo (NOT CORTEX folder). Only CORTEX-related tests reside in CORTEX. CORTEX MUST use user's existing test framework and feed brain with knowledge learned from application tests.\"\n      \n      detection:\n        combined_keywords:\n          test_generation:\n            - \"generate test\"\n            - \"create test\"\n            - \"write test\"\n            - \"tdd workflow\"\n          application_code:\n            - \"user application\"\n            - \"user code\"\n            - \"application feature\"\n            - \"business logic\"\n          wrong_location:\n            - \"tests/fixtures\"\n            - \"CORTEX/tests\"\n            - \"cortex-brain/tests\"\n        scope: [\"intent\", \"target_path\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Detect user repository root (outside CORTEX folder)\"\n        - \"STEP 2: Discover user's existing test framework (pytest, jest, xunit, etc.)\"\n        - \"STEP 3: Create\
  \ tests in user repo following their conventions\"\n        - \"STEP 4: Run tests using user's framework\"\n        - \"STEP 5: Capture test patterns, framework usage, and insights\"\n        - \"STEP 6: Store learned patterns in CORTEX brain (Tier 1/Tier 2)\"\n        - \"EXAMPLE: User app at /Users/user/myapp \u2192 Tests at /Users/user/myapp/tests/\"\n        - \"EXAMPLE: CORTEX tests \u2192 Stay in /CORTEX/tests/\"\n      \n      evidence_template: |\n        Test location violation detected!\n        \n        Target: '{target_path}'\n        Test Type: '{test_type}'\n        \n        \u274C WRONG: Application test being created in CORTEX folder\n        - Path: CORTEX/tests/test_user_feature.py\n        - Reason: Application tests don't belong in CORTEX\n        - Impact: Pollutes CORTEX with application-specific code\n        \n        \u2705 CORRECT: Application test in user repository\n        - Path: /Users/user/myapp/tests/test_user_feature.py\n        - Framework: {user's\
  \ framework} (pytest/jest/xunit/etc.)\n        - Conventions: {user's naming patterns}\n        - Brain Learning: Test patterns stored in cortex-brain/tier2/\n        \n        **CORTEX Tests (stay in CORTEX folder):**\n        - Brain protection tests\n        - Agent functionality tests\n        - Workflow orchestration tests\n        - CORTEX infrastructure tests\n        \n        **Application Tests (go in user repo):**\n        - Business logic tests\n        - Feature tests\n        - Integration tests\n        - E2E tests\n        \n        **Knowledge Capture (automatic):**\n        - Test framework detection \u2192 Tier 2\n        - Naming conventions \u2192 Tier 2\n        - Test patterns \u2192 Tier 2\n        - Code coverage insights \u2192 Tier 1\n        - Common failure patterns \u2192 Tier 2\n      \n      rationale: |\n        TEST_LOCATION_SEPARATION: Architectural Clarity & Brain Intelligence\n        \n        Problem Scenario:\n        - User developing \"payment\
  \ processing\" feature\n        - CORTEX generates test_payment.py in CORTEX/tests/\n        - Test contains application-specific logic\n        - CORTEX repo polluted with user's business logic\n        - User can't find tests in their own repo\n        - Tests don't use user's existing framework\n        \n        Correct Approach:\n        1. **Detect Context:**\n           - Working directory: /Users/user/myapp\n           - Test framework: pytest (detected from requirements.txt)\n           - Convention: tests/ folder with test_*.py pattern\n        \n        2. **Generate Tests in User Repo:**\n           - Path: /Users/user/myapp/tests/test_payment.py\n           - Framework: pytest (user's choice)\n           - Style: Matches user's existing tests\n        \n        3. **Capture Knowledge for Brain:**\n           - Pattern: \"Payment tests use mock stripe API\"\n           - Pattern: \"User prefers parametrized fixtures\"\n           - Insight: \"Payment tests fail when DB not\
  \ seeded\"\n           - Store: cortex-brain/tier2/knowledge-graph.yaml\n        \n        4. **Benefits:**\n           - User repo self-contained with its tests\n           - CORTEX stays focused on CORTEX functionality\n           - Brain learns from user patterns (not polluted with user code)\n           - User's test framework honored\n           - Proper separation of concerns\n        \n        Brain Learning Mechanism:\n        - Monitor test execution results\n        - Track framework usage patterns\n        - Identify common anti-patterns\n        - Store generalized insights (not specific code)\n        - Use insights to improve future test generation\n        \n        Exception:\n        Only CORTEX-related tests (brain, agents, workflows) stay in CORTEX folder.\n\n# Layer 9: Git History Context Validation\n- layer_id: \"git_history_context_validation\"\n  name: \"Git History Context Validation\"\n  description: \"Universal rule: All requests MUST check git history to build\
  \ stronger context before analysis\"\n  priority: 9\n  \n  rules:\n    - rule_id: \"GIT_HISTORY_CONTEXT_REQUIRED\"\n      name: \"Git History Context Required\"\n      severity: \"blocked\"\n      description: \"All requests that analyze code files MUST check git history first. This provides critical context: recurring issues, security patterns, subject matter experts, change frequency, and related files.\"\n      \n      detection:\n        combined_keywords:\n          code_analysis:\n            - \"analyze\"\n            - \"review\"\n            - \"plan\"\n            - \"implement\"\n            - \"refactor\"\n            - \"security review\"\n            - \"gap analysis\"\n          file_targets:\n            - \".py\"\n            - \".js\"\n            - \".ts\"\n            - \".cs\"\n            - \".java\"\n            - \".go\"\n            - \".rb\"\n            - \".php\"\n          missing_context:\n            - \"has_git_history_context: false\"\n            - \"\
  git_history_context: null\"\n        scope: [\"intent\", \"target_files\", \"context\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Run git log analysis (6 months lookback)\"\n        - \"STEP 2: Run git grep for security keywords (1 year)\"\n        - \"STEP 3: Run git shortlog for contributor analysis\"\n        - \"STEP 4: Run git blame for line-level history\"\n        - \"STEP 5: Extract PR/issue references from commits\"\n        - \"STEP 6: Identify files that change together\"\n        - \"STEP 7: Build context enrichment dictionary\"\n        - \"STEP 8: Proceed with analysis using enriched context\"\n      \n      evidence_template: |\n        Git history context missing for code analysis!\n        \n        Files: '{target_files}'\n        Operation: '{operation}'\n        \n        \u274C BLOCKED: Cannot proceed without git history context\n        \n        WHY GIT HISTORY MATTERS:\n        \n        Without Git History:\n        - Analyze file\
  \ in isolation\n        - Miss recurring patterns\n        - Don't know who to ask\n        - Treat all code equally\n        - Risk repeating past mistakes\n        \n        With Git History:\n        - Identify high-churn files (23 commits = unstable)\n        - Detect security patterns (4 hotfixes = sensitive)\n        - Find subject matter experts (Dev C wrote 3 hotfixes)\n        - Prioritize based on history (SQL injection fixed 3 times)\n        - Learn from past solutions (related PR references)\n        \n        REQUIRED ACTIONS:\n        \n        1. **Recent Activity Analysis (6 months):**\n           ```bash\n           git log --oneline --since=6.months.ago [file]\n           git log --numstat --since=6.months.ago [file]\n           ```\n           Captures: Commit count, churn rate, change frequency\n        \n        2. **Security Pattern Detection (1 year):**\n           ```bash\n           git log --grep=\"security|vulnerability|CVE|exploit|bypass|injection|XSS|CSRF|authentication|authorization|password|encryption|hotfix|rollback\"\
  \ -i --since=1.year.ago [file]\n           ```\n           Captures: Security commits, hotfixes, rollbacks\n        \n        3. **Contributor Analysis:**\n           ```bash\n           git shortlog -sn [file]\n           git shortlog -sn --since=3.months.ago [file]\n           ```\n           Captures: Top contributors, recent maintainers, SME identification\n        \n        4. **Related Work Discovery:**\n           ```bash\n           git log --grep=\"#[0-9]\" --oneline [file]\n           ```\n           Captures: PR references, issue tracker links\n        \n        5. **Temporal Patterns:**\n           ```bash\n           git log --format=%ad --date=short --since=6.months.ago [file]\n           ```\n           Captures: Change frequency, spike detection, maintenance windows\n        \n        CONTEXT ENRICHMENT EXAMPLE:\n        \n        File: Login.cs\n        \n        \u2705 Git History Context Found:\n        - Recent Commits: 23 (HIGH CHURN - unstable file)\n        - Security\
  \ Hotfixes: 4 in last 6 months\n          \u2022 SQL injection fix (3 months ago)\n          \u2022 Auth bypass fix (6 months ago)\n          \u2022 Password hashing fix (1 month ago)\n          \u2022 Session timeout fix (2 weeks ago)\n        - Top Contributors:\n          \u2022 Dev A: 48% (original author)\n          \u2022 Dev B: 33% (recent features)\n          \u2022 Dev C: 17% (hotfix specialist) \u2190 SME for security\n        - Related Issues: #1234, #1567, #1890 (all security-related)\n        - Change Frequency: Very High (2-3 times per week)\n        \n        ANALYSIS PRIORITIES (based on history):\n        1. Focus on authentication/authorization gaps (history shows bypass)\n        2. Review password handling thoroughly (recent hotfix)\n        3. Validate SQL queries rigorously (injection history)\n        4. Consult Dev C for security concerns (SME)\n        5. Check related files (SessionManager.cs, AuthService.cs)\n        \n        BENEFITS OF GIT HISTORY CONTEXT:\n\
  \        - 40% better gap detection (historical patterns reveal systemic issues)\n        - 25% time savings (prioritize high-risk areas first)\n        - 60% better prioritization (security history drives urgency)\n        - Zero redundant fixes (learn from past solutions)\n        \n        VALIDATOR: GitHistoryValidator\n        CONFIG: cortex-brain/config/git-history-rules.yaml\n      \n      rationale: |\n        GIT_HISTORY_CONTEXT_REQUIRED: Universal Rule for Context Quality\n        \n        Real-World Impact:\n        \n        Scenario 1: SQL Injection Gap\n        - Without History: \"Check for SQL injection in Login.cs\"\n        - With History: \"Login.cs has SQL injection fixed 3 times in past year. This indicates systemic validation problem, not one-off bug. Recommend comprehensive input validation strategy.\"\n        \n        Scenario 2: Authentication Bypass\n        - Without History: \"Auth logic looks okay\"\n        - With History: \"Auth bypass hotfix 6 months\
  \ ago suggests server-side validation was weak. Current client-side checks insufficient. Recent session timeout fix 2 weeks ago indicates session management still problematic.\"\n        \n        Scenario 3: High-Churn File\n        - Without History: \"Implement feature in Login.cs\"\n        - With History: \"Login.cs has 23 commits in 6 months (HIGH CHURN). File is unstable. Consider refactoring before adding features. Risk of introducing bugs is elevated.\"\n        \n        Scenario 4: Subject Matter Expert\n        - Without History: \"Need security review\"\n        - With History: \"Dev C has written 3 of 4 security hotfixes. Suggest including Dev C in security review. They have deep context on vulnerability patterns.\"\n        \n        Scenario 5: Related File Dependencies\n        - Without History: \"Update Login.cs\"\n        - With History: \"Login.cs and SessionManager.cs always change together (10 of 15 commits). Update SessionManager.cs in parallel to avoid integration\
  \ issues.\"\n        \n        Implementation Strategy:\n        \n        1. **Automatic Validation:**\n           - GitHistoryValidator runs before every code analysis\n           - BLOCKING enforcement (cannot proceed without history)\n           - 5-part analysis checklist (activity, security, contributors, related work, temporal)\n        \n        2. **Context Enrichment:**\n           - Git history results stored in request context\n           - Available to all agents via has_git_history_context flag\n           - Quality score (0-100%) indicates context completeness\n        \n        3. **Configuration:**\n           - Security keywords: 14 terms (security, vulnerability, CVE, exploit, bypass, injection, XSS, CSRF, auth, password, encryption, hotfix, rollback)\n           - High-risk thresholds: 15 commits/6mo churn, 3 hotfix count, 30 days recent security fix\n           - Exemptions: *.md, *.txt, *.json, *.yaml files\n        \n        4. **User Experience:**\n           -\
  \ Transparent to users (runs automatically)\n           - No commands to remember\n           - Better results (40% detection improvement)\n           - Faster analysis (25% time savings from prioritization)\n        \n        Metrics & Benefits:\n        \n        Context Quality Score (0-100%):\n        - 90-100%: Excellent (full context, all checks passed)\n        - 70-89%: Good (adequate context, minor gaps)\n        - 50-69%: Adequate (basic context, improvement recommended)\n        - 0-49%: Poor (insufficient context, BLOCKED)\n        \n        Measured Improvements:\n        - Gap Detection: 40% better (recurring issues identified)\n        - Time Efficiency: 25% faster (high-risk areas prioritized)\n        - Prioritization: 60% improvement (history-driven urgency)\n        - Redundant Fixes: Zero (learn from past solutions)\n        \n        This universal rule transforms CORTEX from reactive to proactive analysis.\n\n# Layer 10: Operational Readiness Enforcement\n- layer_id:\
  \ \"operational_readiness_enforcement\"\n  name: \"Operational Readiness Enforcement\"\n  description: \"Block deployment/upgrade if CORTEX is not fully operational in target environment\"\n  priority: 10\n  \n  rules:\n    - rule_id: \"OPERATIONAL_READINESS_ENFORCEMENT\"\n      name: \"Operational Readiness Enforcement\"\n      severity: \"blocked\"\n      description: \"Deployment or upgrade completion MUST be validated with operational readiness checks: dependencies installed, imports work, databases accessible, configs valid. Failure triggers automatic rollback.\"\n      \n      detection:\n        combined_keywords:\n          deployment_actions:\n            - \"deploy cortex\"\n            - \"upgrade cortex\"\n            - \"publish cortex\"\n            - \"release cortex\"\n            - \"upgrade complete\"\n            - \"deployment complete\"\n          missing_validation:\n            - \"operational_validation: false\"\n            - \"dependencies_validated: false\"\n\
  \            - \"imports_validated: false\"\n        scope: [\"intent\", \"operation_status\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Validate environment prerequisites (Python 3.8+, pip, git, disk space)\"\n        - \"STEP 2: Validate core dependencies installed (pytest, PyYAML, watchdog, psutil, send2trash)\"\n        - \"STEP 3: Validate optional dependencies (NumPy, scikit-learn - warn if missing)\"\n        - \"STEP 4: Validate core imports work (tier1, tier2, tier3 modules)\"\n        - \"STEP 5: Validate databases accessible (tier1, tier2, tier3 DBs exist)\"\n        - \"STEP 6: Validate operations config valid (cortex-operations.yaml)\"\n        - \"STEP 7: Validate response templates valid (response-templates.yaml)\"\n        - \"STEP 8: Validate brain protection rules valid (brain-protection-rules.yaml)\"\n        - \"STEP 9: Validate test suite discoverable (pytest --collect-only)\"\n        - \"STEP 10: Run smoke test (test_brain_protector.py\
  \ or similar)\"\n        - \"STEP 11: If ANY critical check fails \u2192 ROLLBACK deployment\"\n        - \"STEP 12: If all checks pass \u2192 Declare 'CORTEX operational'\"\n      \n      evidence_template: |\n        Operational readiness validation required!\n        \n        Operation: '{operation}'\n        Status: '{status}'\n        \n        \u274C BLOCKED: Cannot declare deployment/upgrade complete without operational validation\n        \n        **Real-World Failure (upgrade-issue.md):**\n        - User upgraded CORTEX (files copied successfully)\n        - NumPy failed to install (missing C compiler)\n        - Tests not discoverable (incorrect path)\n        - Manual verification took 45+ minutes\n        - Declared \"success\" but CORTEX was not operational\n        \n        **Required Validation Gates:**\n        \n        Gate 1: Environment Prerequisites\n        - [ ] Python 3.8+ available\n        - [ ] pip functional\n        - [ ] git available\n        - [ ] Disk\
  \ space sufficient (500+ MB)\n        - [ ] Write permissions verified\n        - [ ] C compiler available (optional, warn if missing)\n        \n        Gate 2: Core Dependencies\n        - [ ] pytest installed and importable\n        - [ ] PyYAML installed and importable\n        - [ ] watchdog installed and importable\n        - [ ] psutil installed and importable\n        - [ ] send2trash installed and importable\n        \n        Gate 3: Optional Dependencies (warn only)\n        - [ ] NumPy installed (ML features)\n        - [ ] scikit-learn installed (ML features)\n        - [ ] pandas installed (data analysis)\n        \n        Gate 4: Core Imports\n        - [ ] from tier1.working_memory import WorkingMemory\n        - [ ] from tier3.development_context import DevelopmentContext\n        - [ ] No import errors\n        \n        Gate 5: Database Accessibility\n        - [ ] cortex-brain/tier1/working_memory.db exists\n        - [ ] cortex-brain/tier2/knowledge_graph.db exists\
  \ (or auto-init)\n        - [ ] cortex-brain/tier3/development_context.db exists\n        \n        Gate 6: Configuration Validation\n        - [ ] cortex-operations.yaml exists and valid\n        - [ ] response-templates.yaml exists and valid\n        - [ ] brain-protection-rules.yaml exists and valid\n        \n        Gate 7: Test Suite Validation\n        - [ ] pytest --collect-only succeeds\n        - [ ] At least 10 tests discovered\n        - [ ] Smoke test passes (optional, warn only)\n        \n        **Rollback Triggers (Critical Failures):**\n        - Core dependency import fails\n        - Core module import fails\n        - Tier 1 or Tier 3 database missing\n        - Operations config invalid\n        - Response templates invalid\n        - Brain protection rules invalid\n        \n        **Success Criteria:**\n        \u2705 ALL gates pass (or warnings only)\n        \u2705 Time to operational: <5 minutes\n        \u2705 Zero manual intervention required\n        \u2705\
  \ User sees clear validation summary\n        \n        **Implementation:**\n        - upgrade_orchestrator.py: Call _validate_dependencies(), _validate_operational_readiness(), _validate_test_suite()\n        - validate_deployment.py: Add check_environment_prerequisites()\n        - Bootstrap verification: Enhanced with operational checks\n        - Auto-rollback: If critical checks fail\n      \n      rationale: |\n        OPERATIONAL_READINESS_ENFORCEMENT: User Trust & Time Savings\n        \n        **Problem Scenario (From upgrade-issue.md):**\n        \n        Timeline:\n        - Minute 0-5: Backup & file copy (SUCCESS)\n        - Minute 5-25: NumPy build failure (20 min wasted)\n        - Minute 25-35: Test discovery failure (10 min wasted)\n        - Minute 35-45: Manual verification (15 min wasted)\n        - Total: 45+ minutes to operational state\n        \n        Root Cause:\n        - Deployment validated SOURCE repository health\n        - Did NOT validate TARGET environment\
  \ readiness\n        - Assumed \"files copied = operational\"\n        - No environment prerequisites check\n        - No dependency installation validation\n        - No operational smoke test\n        \n        Impact:\n        - Poor user experience (\"Where are the tests?\")\n        - Wasted time on manual troubleshooting\n        - Eroded trust in upgrade process\n        - Risk of incomplete installation\n        \n        **Correct Approach:**\n        \n        1. **Pre-Flight Environment Check:**\n           - Check Python version (3.8+)\n           - Check pip availability\n           - Check git availability\n           - Check disk space (500+ MB)\n           - Check write permissions\n           - Check C compiler (warn if missing)\n           - BLOCK if critical checks fail\n        \n        2. **Post-Copy Dependency Validation:**\n           - Install core dependencies (pytest, PyYAML, etc.)\n           - Verify all imports successful\n           - Warn if optional deps\
  \ fail (NumPy, scikit-learn)\n           - ROLLBACK if core deps fail\n        \n        3. **Operational Readiness Validation:**\n           - Test core imports (tier1, tier2, tier3)\n           - Verify databases accessible\n           - Validate config files (YAML syntax)\n           - Run pytest --collect-only\n           - ROLLBACK if operational checks fail\n        \n        4. **Success Declaration:**\n           - Only after ALL gates pass\n           - Show validation summary\n           - Display time to operational\n           - List any warnings (optional deps)\n        \n        **Benefits:**\n        - Time to operational: 45 min \u2192 <5 min (90% reduction)\n        - Manual intervention: Required \u2192 None (100% reduction)\n        - User confidence: Low \u2192 High\n        - Rollback safety: Automatic on failure\n        \n        **Metrics:**\n        - Environment validation: <30 seconds\n        - Dependency validation: <2 minutes\n        - Operational validation:\
  \ <1 minute\n        - Total overhead: <5 minutes\n        - User time saved: 40+ minutes\n        \n        **Edge Cases:**\n        - Windows without C compiler: Warn, continue (NumPy skipped)\n        - Tests not found: Warn, continue (non-critical)\n        - Optional deps fail: Warn, continue (graceful degradation)\n        - Core imports fail: ERROR, rollback (critical)\n        \n        This rule ensures CORTEX is ACTUALLY operational, not just \"deployed\".\n    \n    - rule_id: \"DEBUG_MARKER_REMOVAL_ENFORCEMENT\"\n      name: \"Debug Marker Removal Enforcement\"\n      severity: \"blocked\"\n      description: \"Git commits containing debug markers (MARKER, DEBUG, FIXME, TODO, BREAKPOINT) MUST be blocked to prevent debugging artifacts from reaching production\"\n      \n      detection:\n        combined_keywords:\n          commit_attempt:\n            - \"git commit\"\n            - \"commit changes\"\n            - \"stage files\"\n            - \"ready to commit\"\n    \
  \      marker_patterns:\n            - \"# MARKER:\"\n            - \"# DEBUG:\"\n            - \"# FIXME:\"\n            - \"# TODO:\"\n            - \"# BREAKPOINT:\"\n        scope: [\"intent\", \"file_content\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Run debug marker scanner: python src/utils/debug_markers.py scan src/\"\n        - \"STEP 2: Review found markers and determine if they should be removed\"\n        - \"STEP 3: Remove markers: python src/utils/debug_markers.py remove <file>\"\n        - \"STEP 4: Or manually remove marker comments from code\"\n        - \"STEP 5: Verify markers removed: python src/utils/debug_markers.py scan src/\"\n        - \"STEP 6: Stage cleaned files: git add <files>\"\n        - \"STEP 7: Retry commit (pre-commit hook will validate)\"\n      \n      evidence_template: |\n        Debug markers detected in staged files!\n        \n        Operation: '{operation}'\n        Markers found: {marker_count}\n        \n\
  \        \u274C BLOCKED: Cannot commit code with debug markers\n        \n        **Why Debug Markers Must Be Removed:**\n        \n        1. **Production Readiness**\n           - Debug markers indicate incomplete/temporary code\n           - MARKER: Used during development to track execution\n           - DEBUG: Code meant for debugging only\n           - FIXME: Temporary fixes needing proper implementation\n           - TODO: Incomplete implementations\n           - BREAKPOINT: Execution pause points\n        \n        2. **Code Quality**\n           - Markers clutter codebase\n           - Confuse future developers\n           - Indicate lack of review\n           - Suggest rushed implementation\n        \n        3. **Professional Standards**\n           - Clean code ready for review\n           - No debugging artifacts\n           - Proper implementation complete\n           - Ready for production\n        \n        **Marker Types Detected:**\n        \n        {marker_details}\n\
  \        \n        **Automated Removal Available:**\n        \n        ```bash\n        # Scan for all markers\n        python src/utils/debug_markers.py scan src/\n        \n        # Remove from specific file\n        python src/utils/debug_markers.py remove src/orchestrators/example.py\n        \n        # Dry-run to see what would be removed\n        python src/utils/debug_markers.py remove src/orchestrators/example.py --dry-run\n        ```\n        \n        **Git Pre-Commit Hook Protection:**\n        \n        The git pre-commit hook automatically scans staged Python files for markers:\n        - Located: `.git/hooks/pre-commit`\n        - Auto-scans: All staged .py files\n        - Blocks commit: If any markers found\n        - Clear guidance: Shows exact locations\n        \n        **Manual Removal:**\n        \n        1. Open files listed above\n        2. Find lines with markers (MARKER:, DEBUG:, etc.)\n        3. Remove marker comments\n        4. Ensure code still functions\n\
  \        5. Stage cleaned files: git add <files>\n        6. Retry commit\n        \n        **Exceptions:**\n        \n        - If marker is intentional (e.g., TODO in documentation): Convert to proper format\n        - If marker is critical for tracking: Move to issue tracker or planning document\n        - If fixing marker is complex: Create separate task and remove marker\n        \n        **Benefits of Clean Commits:**\n        - Professional code quality\n        - Clear git history\n        - Production-ready code\n        - Easy code review\n        - No confusion for future developers\n        \n        **Pre-Commit Hook Installation:**\n        \n        Copy the hook to your .git/hooks directory:\n        ```bash\n        cp scripts/git-hooks/pre-commit .git/hooks/pre-commit\n        chmod +x .git/hooks/pre-commit  # Unix/Mac only\n        ```\n        \n        The hook will automatically validate all future commits.\n"
logging:
  enabled: true
  path: cortex-brain/corpus-callosum/protection-events.jsonl
  format: jsonl
  include_fields:
  - timestamp
  - event
  - request
  - violations
  - decision
  - severity
  - alternatives_suggested
  - user_decision
  - override_justification
  - override_required
validation:
- check: rules_complete
  scope: protection_layers
  required: true
  params:
    all_layers_have_rules: true
    all_rules_have_detection: true
    all_rules_have_alternatives: true
- check: severity_valid
  scope: rules
  required: true
  params:
    valid_severities:
    - safe
    - warning
    - blocked
- check: templates_valid
  scope: challenge_template
  required: true
  params:
    has_placeholders: true
    has_options: true

# Layer 11: Planning System 3.0 Governance
- layer_id: "planning_system_3_governance"
  name: "Planning System 3.0 Governance"
  description: "Governance rules for Planning System 3.0 - File organization, tiered planning, vacuum cycles, incremental creation"
  priority: 11
  
  rules:
    - rule_id: "FILE_ORGANIZATION_ENFORCEMENT"
      name: "File Organization Enforcement"
      severity: "blocked"
      description: "All documents MUST be created in cortex-brain/documents/{category}/ with filename ≤20 characters. Root-level files in any folder are PROHIBITED."
      
      detection:
        combined_keywords:
          file_creation:
            - "create file"
            - "save to"
            - "write file"
            - "generate document"
          wrong_location:
            - "CORTEX/summary.md"
            - "CORTEX/report.md"
            - "cortex-brain/summary.md"
            - "cortex-brain/analysis.md"
          or_long_filename:
            - "filename length > 20"
        scope: ["intent", "target_path"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Determine document type (report, analysis, summary, investigation, planning, implementation-guide)"
        - "STEP 2: Select category folder: cortex-brain/documents/{category}/"
        - "STEP 3: Create meaningful filename ≤20 characters (excluding extension)"
        - "STEP 4: Construct full path: cortex-brain/documents/{category}/{filename}.md"
        - "EXAMPLE: Report → cortex-brain/documents/reports/test-results.md (17 chars)"
        - "EXAMPLE: Analysis → cortex-brain/documents/analysis/arch-review.md (17 chars)"
      
      evidence_template: |
        File organization violation detected!
        
        Target: '{target_path}'
        Filename Length: {filename_length} chars
        
        ❌ WRONG: Root-level file creation
        - Path: CORTEX/summary.md
        - Reason: Root-level files pollute workspace
        - Impact: Difficult navigation, cluttered filesystem
        
        ✅ CORRECT: Organized in category folder
        - Path: cortex-brain/documents/reports/test-summary.md
        - Category: reports/
        - Filename: test-summary.md (12 chars ≤ 20 char limit)
        
        **Available Categories:**
        - reports/ - Status reports, test results, validation reports
        - analysis/ - Code analysis, architecture analysis
        - summaries/ - Project summaries, progress summaries
        - investigations/ - Bug investigations, root cause analysis
        - planning/ - Feature plans, ADO items, phase plans
        - implementation-guides/ - How-to guides, best practices
        
        **Filename Rules:**
        - Maximum 20 characters (excluding .md extension)
        - Use hyphens for word separation (kebab-case)
        - Meaningful and descriptive
        - Examples: test-results.md, arch-review.md, bug-123-fix.md
      
      rationale: |
        FILE_ORGANIZATION_ENFORCEMENT: Clean, Navigable Workspace
        
        Problem Scenario:
        - 50+ files in CORTEX root
        - 30+ files in cortex-brain root
        - Difficult to find specific documents
        - No logical grouping
        - Long filenames (40+ characters)
        
        Solution:
        - Category-based organization
        - Predictable file locations
        - Short, meaningful filenames
        - Easy navigation
        
        Benefits:
        - Find documents by category
        - Clean root directories
        - Consistent naming conventions
        - Scalable structure
    
    - rule_id: "TIERED_PLANNING_ENFORCEMENT"
      name: "Tiered Planning Enforcement"
      severity: "blocked"
      description: "Operations MUST route through tiered planning system: Tier 1 (instant), Tier 2 (lightweight), Tier 3 (documented), Tier 4 (complex). Automatic routing via complexity analyzer."
      
      detection:
        combined_keywords:
          planning_bypass:
            - "skip planning"
            - "bypass tier check"
            - "direct execution"
          complex_operation:
            - "architecture change"
            - "multi-phase work"
            - "system redesign"
        scope: ["intent", "operation_complexity"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Invoke complexity_analyzer.py to assess operation"
        - "STEP 2: Route to appropriate tier:"
        - "  - Tier 1: CLI operations, <2s deterministic tasks (instant)"
        - "  - Tier 2: Single file changes, inline validation (lightweight)"
        - "  - Tier 3: Feature additions, single MD structure (documented)"
        - "  - Tier 4: Architecture changes, nested MD structure (complex)"
        - "STEP 3: Execute with tier-appropriate tracking"
      
      evidence_template: |
        Tiered planning violation detected!
        
        Operation: '{operation}'
        Complexity: {complexity_score}
        
        ❌ WRONG: Complex operation without tier routing
        - Operation: Major architecture redesign
        - Current Path: Direct execution
        - Risk: No planning, no tracking, no validation
        
        ✅ CORRECT: Tier-routed execution
        - Operation: Major architecture redesign
        - Complexity Score: 85/100 (HIGH)
        - Assigned Tier: Tier 4 (Complex)
        - Plan Structure: Nested MD with 14 phases
        - Tracking: Progress tracker, DoR/DoD gates
        
        **Tier Routing Logic:**
        - Tier 1 (0-25): Instant execution, CLI wrappers
        - Tier 2 (26-50): Lightweight planning, inline validation
        - Tier 3 (51-75): Documented planning, single MD
        - Tier 4 (76-100): Complex planning, nested MD structure
        
        **Complexity Factors:**
        - Scope (files affected, LOC changed)
        - Dependencies (internal/external)
        - Risk (breaking changes, security impact)
        - Uncertainty (unknowns, research required)
      
      rationale: |
        TIERED_PLANNING_ENFORCEMENT: Right-Sized Planning
        
        Problem: One-size-fits-all planning
        - Simple CLI command requires full planning doc
        - Complex architecture change executed directly
        - User friction vs insufficient tracking
        
        Solution: Intelligent tier routing
        - Simple operations: Fast execution
        - Complex operations: Comprehensive planning
        - Automatic classification
        - No manual tier selection needed
        
        Benefits:
        - Sub-2s response for Tier 1 operations
        - Appropriate tracking for complexity
        - 95%+ routing accuracy
        - User experience optimized
    
    - rule_id: "VACUUM_CYCLE_ENFORCEMENT"
      name: "Vacuum Cycle Enforcement"
      severity: "blocked"
      description: "Vacuum cycle MUST run automatically as part of system maintenance. AST-powered duplicate detection, orphaned code removal, with dry-run validation required."
      
      detection:
        combined_keywords:
          maintenance_operation:
            - "system maintenance"
            - "cleanup"
            - "refactor complete"
          missing_vacuum:
            - "vacuum_cycle: false"
            - "skip cleanup"
        scope: ["intent", "operation_config"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Invoke vacuum_orchestrator.py automatically"
        - "STEP 2: Run AST similarity detection for duplicates"
        - "STEP 3: Identify orphaned code (unreferenced functions/classes)"
        - "STEP 4: Generate dry-run report for review"
        - "STEP 5: Execute cleanup after approval"
        - "STEP 6: Update cleanup metrics"
      
      evidence_template: |
        Vacuum cycle enforcement required!
        
        Operation: '{operation}'
        Phase: {phase}
        
        ❌ WRONG: Maintenance without vacuum cycle
        - Operation: System maintenance complete
        - Vacuum Cycle: Skipped
        - Result: Duplicate code remains, orphaned files accumulate
        
        ✅ CORRECT: Automatic vacuum cycle
        - Operation: System maintenance
        - Phase 6: Vacuum cycle (automatic)
        - AST Detection: 12 duplicates found
        - Orphaned Code: 5 unused functions identified
        - Dry-Run Report: Generated for review
        - Cleanup: Executed after approval
        
        **Vacuum Cycle Components:**
        - Duplicate detection (AST-based similarity analysis)
        - Orphaned code identification (unreferenced symbols)
        - Unused imports removal
        - Empty directory cleanup
        - Dry-run validation (safety check)
        
        **Benefits:**
        - 80% reduction in manual cleanup
        - Automatic code hygiene
        - Safe with dry-run validation
      
      rationale: |
        VACUUM_CYCLE_ENFORCEMENT: Automatic Code Hygiene
        
        Problem: Manual cleanup burden
        - Duplicates accumulate over time
        - Orphaned code forgotten
        - Manual detection time-consuming
        - Inconsistent cleanup practices
        
        Solution: Automatic vacuum cycles
        - AST-powered duplicate detection
        - Orphaned code identification
        - Scheduled and on-demand execution
        - Dry-run safety validation
        
        Benefits:
        - 80% less manual cleanup
        - Consistent code hygiene
        - Safe with validation gates
        - Integrated into maintenance workflow
    
    - rule_id: "INCREMENTAL_PLAN_CREATION_ENFORCEMENT"
      name: "Incremental Plan Creation Enforcement"
      severity: "blocked"
      description: "Plans MUST be created incrementally: main → manifest → sub-plans (one at a time). Bulk file creation is PROHIBITED to avoid token usage issues."
      
      detection:
        combined_keywords:
          bulk_creation:
            - "create all files"
            - "generate 14 phases"
            - "bulk create"
          planning_operation:
            - "plan creation"
            - "phase generation"
        scope: ["intent", "file_count"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Create main plan file first (cortex-3.9-master.md)"
        - "STEP 2: Create manifest.yaml second"
        - "STEP 3: Create sub-plans sequentially (phase-00-govern.md, then phase-01-router.md, etc.)"
        - "STEP 4: Update main plan progress after each sub-plan creation"
        - "NEVER: Create all 14 phase files in one operation"
      
      evidence_template: |
        Incremental creation violation detected!
        
        Operation: '{operation}'
        Files: {file_count}
        
        ❌ WRONG: Bulk file creation
        - Operation: Create plan with 14 phases
        - Method: Generate all 14 phase files at once
        - Risk: Token usage exceeded, incomplete generation
        
        ✅ CORRECT: Incremental creation
        - Step 1: Create main plan (cortex-3.9-master.md) ✅
        - Step 2: Create manifest (manifest.yaml) ✅
        - Step 3: Create phase-00-govern.md ⏳
        - Step 4: Create phase-01-router.md (after phase-00)
        - Step 5: Create phase-02-analyzer.md (after phase-01)
        - ... (continue sequentially)
        
        **Protocol:**
        - One file per operation
        - Sequential creation only
        - Update progress after each file
        - User approval between steps
        
        **Benefits:**
        - No token limit issues
        - Quality control per file
        - Easy to resume if interrupted
        - Clear progress tracking
      
      rationale: |
        INCREMENTAL_PLAN_CREATION_ENFORCEMENT: Quality Over Speed
        
        Problem: Bulk file generation
        - 14+ files created at once
        - Token limits exceeded
        - Incomplete generation
        - Poor quality control
        
        Solution: Incremental creation
        - One file at a time
        - Quality review per file
        - Clear dependencies
        - Resume capability
        
        Benefits:
        - No token limit issues
        - Higher quality outputs
        - Easy to track progress
        - Interruptible process
    
    - rule_id: "AUTOMATIC_DOCUMENTATION_GENERATION"
      name: "Automatic Documentation Generation"
      severity: "blocked"
      description: "Planning System 3.0 MUST automatically insert a final documentation phase for all Tier 3/4 plans. Documentation includes: context, design architecture, implementation explanation (learning aid), test coverage, research/analysis work."
      
      detection:
        combined_keywords:
          plan_creation:
            - "create plan"
            - "tier 3"
            - "tier 4"
            - "complex plan"
          missing_doc_phase:
            - "no documentation phase"
            - "missing final phase"
        scope: ["intent", "plan_structure"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Detect plan tier (Tier 3 = single MD, Tier 4 = nested MD)"
        - "STEP 2: After all implementation phases, auto-insert documentation phase"
        - "STEP 3: Documentation phase MUST include:"
        - "  a) Context & Requirements (what problem was solved)"
        - "  b) Design Architecture (system design, component relationships)"
        - "  c) Implementation Explanation (code walkthrough for learning)"
        - "  d) Test Coverage (unit/integration test summary)"
        - "  e) Research & Analysis (design decisions, trade-offs)"
        - "STEP 4: Save documentation to cortex-brain/learning/{category}/{topic}/"
        - "STEP 5: Enforce well-organized folder structure:"
        - "  - cortex-brain/learning/orchestration/ (orchestrator designs)"
        - "  - cortex-brain/learning/routing/ (router/analyzer patterns)"
        - "  - cortex-brain/learning/intelligence/ (AI/ML components)"
        - "  - cortex-brain/learning/analysis/ (AST/code analysis)"
        - "  - cortex-brain/learning/testing/ (TDD patterns, test strategies)"
      
      evidence_template: |
        Automatic documentation generation required!
        
        Plan: '{plan_name}'
        Tier: {plan_tier}
        Phases: {phase_count}
        
        ❌ WRONG: No documentation phase
        - Implementation phases: 1-15 ✓
        - Documentation phase: Missing ✗
        - Result: Knowledge loss, no learning artifacts
        
        ✅ CORRECT: Auto-inserted documentation phase
        - Implementation phases: 1-15 ✓
        - Phase 16: Documentation Generation (auto-inserted)
          * Context & Requirements
          * Design Architecture
          * Implementation Explanation (learning aid)
          * Test Coverage Report
          * Research & Analysis
        - Output: cortex-brain/learning/orchestration/planning-system-3.0/
        
        **Documentation Structure:**
        ```
        cortex-brain/learning/{category}/{topic}/
        ├── README.md                    # Overview & quickstart
        ├── context.md                   # Problem statement, requirements
        ├── architecture.md              # Design diagrams, components
        ├── implementation-guide.md      # Code walkthrough (learning)
        ├── test-strategy.md             # Test coverage, TDD approach
        └── research-notes.md            # Design decisions, trade-offs
        ```
        
        **Benefits:**
        - Zero manual documentation overhead
        - Knowledge captured automatically
        - Learning library grows organically
        - Future developers understand "why" not just "what"
        - Onboarding accelerated with implementation guides
      
      rationale: |
        AUTOMATIC_DOCUMENTATION_GENERATION: Knowledge Preservation
        
        Problem: Documentation neglect
        - Implementation complete, docs forgotten
        - Design decisions lost to time
        - New developers struggle with "why?"
        - Research/analysis not captured
        - Learning opportunities missed
        
        Solution: Automatic final phase
        - Planning System 3.0 auto-inserts documentation phase
        - Tier 3/4 plans always include docs
        - Enforced folder structure in learning library
        - Learning aids (implementation guides)
        - Test coverage documented
        
        Benefits:
        - 100% documentation coverage for complex work
        - Knowledge library grows automatically
        - Implementation guides accelerate learning
        - Design rationale preserved
        - Onboarding time reduced by 50%
    
    - rule_id: "PROGRESS_TRACKER_ENFORCEMENT"
      name: "Progress Tracker Enforcement"
      severity: "blocked"
      description: "Main plan files MUST include visual progress tracker with phase_start, phase_end, actual_time, elapsed_time metrics. Overall counters required."
      
      detection:
        combined_keywords:
          plan_creation:
            - "create plan"
            - "generate master plan"
          missing_tracker:
            - "progress_tracker: false"
            - "no tracker"
        scope: ["intent", "plan_content"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Add visual progress tracker at top of main plan"
        - "STEP 2: Include phase status table with start/end times"
        - "STEP 3: Track actual_time (development time only)"
        - "STEP 4: Track elapsed_time (calendar time)"
        - "STEP 5: Calculate overall_progress percentage"
        - "STEP 6: Update tracker after each phase completion"
      
      evidence_template: |
        Progress tracker enforcement required!
        
        File: '{file_path}'
        Plan: {plan_name}
        
        ❌ WRONG: Plan without progress tracker
        - File: cortex-3.9-master.md
        - Tracker: Missing
        - Metrics: Not tracked
        - Progress: Unknown
        
        ✅ CORRECT: Plan with enhanced progress tracker
        - File: cortex-3.9-master.md
        - Tracker: Visual ASCII art + phase table
        - Metrics: actual_time, elapsed_time, senior_dev_estimate
        - Progress: 12% (2/17 phases)
        - Updates: After each phase completion
        
        **Required Metrics:**
        - phase_start: Timestamp when phase begins
        - phase_end: Timestamp when phase completes
        - actual_time: Development time (hours)
        - elapsed_time: Calendar time (hours)
        - overall_progress: Percentage complete
        - senior_dev_estimate: Industry baseline (40h/week × multipliers)
        
        **Tracker Format:**
        ```
        ┌─────────────────────────────────────────┐
        │ Overall Progress: [███░░░] 12% (2/17)   │
        │ Total Actual Time: 3.5 hours            │
        │ Total Elapsed Time: 8.0 hours           │
        │ Senior Dev Estimate: 52-70 hours        │
        └─────────────────────────────────────────┘
        ```
      
      rationale: |
        PROGRESS_TRACKER_ENFORCEMENT: Transparency & Accountability
        
        Problem: Invisible progress
        - No visibility into work done
        - Can't estimate time remaining
        - Difficult to report status
        - No historical metrics
        
        Solution: Enhanced progress tracking
        - Visual progress indicators
        - Time tracking (actual vs elapsed)
        - Industry-standard estimates
        - Phase-by-phase updates
        
        Benefits:
        - Clear progress visibility
        - Accurate time estimation
        - Easy status reporting
        - Historical data for learning
    
    - rule_id: "SENIOR_DEVELOPER_ESTIMATE_ENFORCEMENT"
      name: "Senior Developer Estimate Enforcement"
      severity: "blocked"
      description: "Time estimates MUST use senior developer baseline: 40h/week × testing(1.30) × docs(1.15) × rework(1.10) = 1.55x multiplier. Complexity buffer +33%."
      
      detection:
        combined_keywords:
          time_estimation:
            - "estimate duration"
            - "time required"
            - "development time"
          missing_methodology:
            - "no multiplier"
            - "arbitrary estimate"
        scope: ["intent", "estimation_method"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Calculate base development time (pure coding)"
        - "STEP 2: Apply testing overhead: base × 1.30"
        - "STEP 3: Apply documentation overhead: × 1.15"
        - "STEP 4: Apply rework/refinement overhead: × 1.10"
        - "STEP 5: Combined multiplier: 1.55x (minimum estimate)"
        - "STEP 6: Add complexity buffer +33% (maximum estimate)"
        - "STEP 7: Display as range: min-max hours (weeks @ 40h/week)"
      
      evidence_template: |
        Senior developer estimate enforcement required!
        
        Task: '{task_name}'
        Base Time: {base_time} hours
        
        ❌ WRONG: Arbitrary estimate
        - Estimate: "About 20 hours"
        - Methodology: None
        - Accuracy: Unreliable
        
        ✅ CORRECT: Industry-standard estimate
        - Base Development: 27 hours (pure coding)
        - Testing Overhead: ×1.30 (unit + integration tests)
        - Documentation: ×1.15 (inline docs, READMEs)
        - Rework/Refinement: ×1.10 (code review, refactoring)
        - Combined Multiplier: 1.55x
        - Minimum Estimate: 27 × 1.55 = 42 hours
        - Complexity Buffer: +33%
        - Maximum Estimate: 42 × 1.33 = 56 hours
        - Range: 42-56 hours (1.0-1.4 weeks @ 40h/week)
        
        **Multiplier Breakdown:**
        - Testing (1.30): TDD, unit tests, integration tests
        - Documentation (1.15): Docstrings, READMEs, API docs
        - Rework (1.10): Code review iterations, refactoring
        - Total: 1.30 × 1.15 × 1.10 = 1.55x
        
        **Complexity Buffer:**
        - LOW: +10% (well-defined, low risk)
        - MEDIUM: +20% (some unknowns, moderate risk)
        - HIGH: +33% (unknowns, high risk, research needed)
      
      rationale: |
        SENIOR_DEVELOPER_ESTIMATE_ENFORCEMENT: Realistic Expectations
        
        Problem: Optimistic estimates
        - "Coding time only" estimates
        - No testing time included
        - No documentation time
        - No rework/refinement
        - Result: 2-3x estimate overrun
        
        Solution: Industry-standard methodology
        - Base development time
        - Testing overhead (30%)
        - Documentation overhead (15%)
        - Rework overhead (10%)
        - Complexity buffer (10-33%)
        
        Benefits:
        - Realistic time estimates
        - Stakeholder trust
        - Better planning
        - Historical accuracy validation
    
    - rule_id: "BIDIRECTIONAL_LINKING_ENFORCEMENT"
      name: "Bidirectional Linking Enforcement"
      severity: "blocked"
      description: "Sub-plans MUST include breadcrumb navigation linking back to main plan. Main plan MUST link to all sub-plans. No orphaned plans allowed."
      
      detection:
        combined_keywords:
          plan_creation:
            - "create sub-plan"
            - "generate phase file"
          missing_links:
            - "no breadcrumb"
            - "no main plan link"
        scope: ["intent", "plan_content"]
        logic: "AND"
      
      alternatives:
        - "STEP 1: Add breadcrumb navigation at top of sub-plan"
        - "STEP 2: Link format: [← Main Plan](../cortex-3.9-master.md)"
        - "STEP 3: Update main plan phase table with sub-plan link"
        - "STEP 4: Verify bidirectional linking"
      
      evidence_template: |
        Bidirectional linking violation detected!
        
        File: '{file_path}'
        Plan: {plan_name}
        
        ❌ WRONG: Orphaned sub-plan
        - File: phase-03-planning.md
        - Main Plan Link: Missing
        - Navigation: Impossible to find main plan
        
        ✅ CORRECT: Bidirectional linking
        - File: phase-03-planning.md
        - Top of file: [← Main Plan](../cortex-3.9-master.md)
        - Main plan table: Links to phase-03-planning.md
        - Navigation: Easy both directions
        
        **Required Links:**
        
        In Sub-Plan (phase-03-planning.md):
        ```markdown
        [← Main Plan](../cortex-3.9-master.md)
        
        # Phase 03: Planning Orchestrator 3.0
        ```
        
        In Main Plan (cortex-3.9-master.md):
        ```markdown
        | 03 | Planning Orchestrator 3.0 | [phase-03-planning.md](phase-03-planning.md) |
        ```
        
        **Benefits:**
        - Easy navigation between plans
        - No orphaned documents
        - Clear parent-child relationships
        - Bidirectional traceability
      
      rationale: |
        BIDIRECTIONAL_LINKING_ENFORCEMENT: Navigation & Discoverability
        
        Problem: Orphaned plans
        - Sub-plans exist but not discoverable
        - No way to return to main plan
        - Broken navigation
        - Difficult to understand context
        
        Solution: Bidirectional linking
        - Breadcrumb navigation in sub-plans
        - Link table in main plan
        - Clear parent-child relationships
        - Easy navigation both directions
        
        Benefits:
        - No orphaned plans
        - Easy discoverability
        - Clear relationships
        - Intuitive navigation
    
    # =========================================================================
    # INTELLIGENT TDD & CLEAN CODE RULES (Added 2025-12-14)
    # Based on authoritative sources: Martin Fowler, Kent Beck, Google, Clean Architecture
    # =========================================================================
    
    - rule_id: "INTELLIGENT_TDD_VALUE_SCORING"
      name: "Intelligent TDD Value Scoring"
      severity: "info"
      description: "TDD value scoring utility determines when tests add value vs overhead. CRITICAL/HIGH code MUST have tests. LOW/TRIVIAL code (getters/setters/DTOs) SHOULD NOT be tested."
      
      detection:
        combined_keywords:
          test_generation:
            - "generate tests"
            - "write unit tests"
            - "create test file"
          code_patterns:
            - "get|set method"
            - "DTO|POCO"
            - "simple property"
            - "configuration class"
        scope: ["intent", "code_content"]
        logic: "AND"
      
      scoring_dimensions:
        criticality: "0-30 points (security, financial, compliance)"
        complexity: "0-20 points (cyclomatic complexity, branching)"
        api_surface: "0-15 points (public methods, external interfaces)"
        business_logic: "0-15 points (calculations, decision trees)"
        mutation_potential: "0-10 points (non-trivial logic)"
        regression_risk: "0-10 points (historical bugs, change frequency)"
      
      value_tiers:
        CRITICAL: "90-100 points → MUST TEST (security/financial/compliance)"
        HIGH: "70-89 points → SHOULD TEST (public APIs, business logic)"
        MEDIUM: "40-69 points → CONSIDER TESTING (private methods with logic)"
        LOW: "20-39 points → SKIP (simple getters/setters)"
        TRIVIAL: "0-19 points → DO NOT TEST (constants, DTOs, config classes)"
      
      alternatives:
        - "STEP 1: Run TestValueScorer on code file"
        - "STEP 2: If score ≥ 70 → Generate comprehensive test suite"
        - "STEP 3: If score 40-69 → Generate targeted tests for public API"
        - "STEP 4: If score < 40 → Skip tests (document rationale)"
        - "STEP 5: Log decision with authoritative source citation"
      
      authoritative_sources:
        - source: "Kent Beck - stackoverflow.com/questions/153234"
          quote: "You don't gain anything from testing simple getters or setters or other trivial implementations."
          application: "Skip tests for TRIVIAL code (score < 20)"
        
        - source: "Martin Fowler - Test Pyramid (2012)"
          quote: "Write lots of small and fast unit tests. Write some more coarse-grained tests and very few high-level tests."
          application: "Focus testing effort on unit level for HIGH value code"
        
        - source: "Martin Fowler - Practical Test Pyramid"
          quote: "Test the public interface. More importantly, don't test trivial code."
          application: "API surface scoring (public methods = higher value)"
        
        - source: "Google Testing Blog - Test Sizes"
          quote: "Small tests are fast, reliable, and isolate failures."
          application: "CRITICAL code needs fast unit tests for security validation"
        
        - source: "Rule of Three (Martin Fowler/refactoring.guru)"
          quote: "When you're doing something for the first time, just get it done. Second time, cringe. Third time, start refactoring."
          application: "Don't test until pattern proven useful (avoid premature testing)"
      
      evidence_template: |
        Test value scoring decision:
        
        File: {file_path}
        Score: {total_score}/100 ({value_tier})
        
        Dimension Breakdown:
        - Criticality: {criticality}/30
        - Complexity: {complexity}/20
        - API Surface: {api_surface}/15
        - Business Logic: {business_logic}/15
        - Mutation Potential: {mutation_potential}/10
        - Regression Risk: {regression_risk}/10
        
        Decision: {recommendation}
        
        Rationale:
        {rationale_list}
        
        Authoritative Source:
        {cited_source}
      
      rationale: |
        INTELLIGENT_TDD_VALUE_SCORING: Maximum Coverage, Zero Waste
        
        Problem: Wasted effort on trivial tests
        - Tests for simple getters/setters provide no value
        - DTOs/POCOs have no logic to test
        - Configuration classes are just data carriers
        - Test maintenance overhead for trivial code
        
        Solution: Value-based test scoring
        - 6-dimensional scoring system
        - Authoritative source citations
        - Tier-based recommendations
        - Skip low-value tests, focus on critical code
        
        Benefits:
        - 100% coverage of CRITICAL code (security/financial)
        - Zero wasted effort on trivial code
        - Faster test suite (fewer useless tests)
        - Team velocity increased
        - Kent Beck-approved approach
    
    - rule_id: "TEST_PYRAMID_ADHERENCE"
      name: "Test Pyramid Adherence"
      severity: "warning"
      description: "Follow Martin Fowler's Test Pyramid: Many unit tests, some integration tests, few E2E tests. Avoid test ice-cream cone (too many slow E2E tests)."
      
      detection:
        combined_keywords:
          pyramid_violation:
            - "E2E test count > integration test count"
            - "UI test heavy"
            - "slow test suite"
        scope: ["test_suite_analysis"]
      
      pyramid_ratios:
        unit_tests: "70% (fast, isolated, many)"
        integration_tests: "20% (moderate speed, focused integration points)"
        e2e_tests: "10% (slow, full stack, critical user journeys only)"
      
      alternatives:
        - "Rewrite E2E test as integration test if possible"
        - "Rewrite integration test as unit test if possible"
        - "Reserve E2E tests for critical user journeys only"
        - "Use subcutaneous tests (just below UI) instead of full E2E"
      
      authoritative_sources:
        - source: "Mike Cohn - Succeeding with Agile (2009)"
          quote: "The Test Pyramid consists of three layers: Unit Tests (bottom), Service Tests (middle), User Interface Tests (top)."
          application: "Foundation of modern testing strategy"
        
        - source: "Martin Fowler - Test Pyramid (2012)"
          quote: "You should have many more low-level UnitTests than high level BroadStackTests running through a GUI."
          application: "Ratio guidance for test distribution"
        
        - source: "Google Testing Blog - Just Say No to More End-to-End Tests (2015)"
          quote: "End-to-end tests are brittle, expensive to write, and time consuming to run."
          application: "Minimize E2E test count, push tests down pyramid"
      
      rationale: |
        TEST_PYRAMID_ADHERENCE: Fast Feedback, High Confidence
        
        Problem: Test ice-cream cone
        - Too many slow E2E tests
        - Long CI/CD pipeline times
        - Flaky tests (timing issues, browser quirks)
        - Low developer confidence
        
        Solution: Follow pyramid shape
        - Many fast unit tests (70%)
        - Some integration tests (20%)
        - Few E2E tests (10%)
        - Push tests down the pyramid
        
        Benefits:
        - Fast feedback loop (<2 min for unit tests)
        - Reliable tests (fewer flakes)
        - Easy debugging (isolated failures)
        - High developer confidence
    
    - rule_id: "SOLID_PRINCIPLES_ENFORCEMENT"
      name: "SOLID Principles Enforcement"
      severity: "warning"
      description: "Enforce SOLID principles from Clean Architecture: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion."
      
      detection:
        combined_keywords:
          srp_violation:
            - "god class"
            - "too many responsibilities"
            - "class doing too much"
          dip_violation:
            - "new keyword in constructor"
            - "concrete dependency"
            - "tight coupling"
        scope: ["code_structure"]
      
      principles:
        - principle: "Single Responsibility Principle (SRP)"
          description: "A class should have only one reason to change"
          violation_example: "UserService handling authentication, validation, database access, email sending"
          fix: "Split into: AuthService, UserValidator, UserRepository, EmailService"
        
        - principle: "Open/Closed Principle (OCP)"
          description: "Open for extension, closed for modification"
          violation_example: "Adding new payment type requires modifying PaymentProcessor class"
          fix: "Use strategy pattern - PaymentProcessor accepts IPaymentStrategy implementations"
        
        - principle: "Liskov Substitution Principle (LSP)"
          description: "Subtypes must be substitutable for their base types"
          violation_example: "Square inheriting from Rectangle but breaking area calculation assumptions"
          fix: "Proper inheritance hierarchy or prefer composition over inheritance"
        
        - principle: "Interface Segregation Principle (ISP)"
          description: "Clients shouldn't depend on interfaces they don't use"
          violation_example: "IRepository<T> with 20 methods but most clients only use 2"
          fix: "Split into smaller interfaces: IReadRepository, IWriteRepository, IQueryRepository"
        
        - principle: "Dependency Inversion Principle (DIP)"
          description: "Depend on abstractions, not concretions"
          violation_example: "OrderService constructor: new SqlOrderRepository() (concrete)"
          fix: "OrderService constructor: IOrderRepository (abstraction)"
      
      authoritative_sources:
        - source: "Robert C. Martin - Clean Architecture (2017)"
          quote: "The SOLID principles tell us how to arrange our functions and data structures into classes, and how those classes should be interconnected."
          application: "Foundation for maintainable architecture"
        
        - source: "Martin Fowler - Refactoring"
          quote: "Any fool can write code that a computer can understand. Good programmers write code that humans can understand."
          application: "SOLID principles improve human readability"
      
      rationale: |
        SOLID_PRINCIPLES_ENFORCEMENT: Maintainable Architecture
        
        Problem: Spaghetti code
        - God classes doing everything
        - Tight coupling (hard to test, hard to change)
        - Violation of separation of concerns
        
        Solution: Apply SOLID principles
        - SRP: One responsibility per class
        - OCP: Extend without modifying
        - LSP: Proper inheritance
        - ISP: Focused interfaces
        - DIP: Depend on abstractions
        
        Benefits:
        - Testable code (dependency injection)
        - Maintainable (single responsibility)
        - Extensible (open/closed)
        - Understandable (focused classes)
    
    - rule_id: "REFACTORING_RULE_OF_THREE"
      name: "Refactoring Rule of Three"
      severity: "info"
      description: "First time: just do it. Second time: cringe but duplicate. Third time: refactor and remove duplication."
      
      detection:
        combined_keywords:
          duplication:
            - "duplicate code"
            - "copy paste"
            - "similar logic"
        scope: ["code_duplication_analysis"]
      
      rule_stages:
        - stage: 1
          action: "Just get it done"
          description: "First implementation, learn the problem"
        
        - stage: 2
          action: "Cringe at duplication but proceed"
          description: "Second implementation, pattern not yet clear"
        
        - stage: 3
          action: "Refactor and remove duplication"
          description: "Third implementation, pattern proven - extract common code"
      
      alternatives:
        - "STEP 1: Identify third occurrence of similar code"
        - "STEP 2: Extract common logic to shared function/class"
        - "STEP 3: Replace all three occurrences with extracted abstraction"
        - "STEP 4: Write tests for extracted code"
      
      authoritative_sources:
        - source: "Martin Fowler / refactoring.guru"
          quote: "When you're doing something for the first time, just get it done. When you're doing something similar for the second time, cringe at having to repeat but do the same thing anyway. When you're doing something for the third time, start refactoring."
          application: "Avoid premature abstraction, wait for pattern to emerge"
        
        - source: "Sandi Metz - Ruby Conf 2014"
          quote: "Duplication is far cheaper than the wrong abstraction."
          application: "Don't refactor until pattern is proven (Rule of Three)"
      
      rationale: |
        REFACTORING_RULE_OF_THREE: Avoid Premature Abstraction
        
        Problem: Wrong abstractions
        - Refactoring too early creates wrong abstractions
        - Changes require modifying abstraction + all callers
        - Harder to understand than simple duplication
        
        Solution: Rule of Three
        - First time: Learn the problem
        - Second time: Confirm pattern similarity
        - Third time: Pattern proven - refactor
        
        Benefits:
        - Right abstractions (pattern-proven)
        - Easier to understand
        - Faster initial development
        - Lower maintenance cost
