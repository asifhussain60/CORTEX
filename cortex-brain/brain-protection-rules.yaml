protection_layers:
- layer_id: instinct_immutability
  name: Instinct Immutability
  description: Tier 0 governance rules cannot be bypassed
  priority: 1
  rules:
  - rule_id: INCREMENTAL_PLAN_GENERATION
    name: Incremental YAML Plan Generation
    severity: blocked
    description: When generating YAML planning documents, create file first then add phases incrementally to avoid response length limits
    detection:
      combined_keywords:
        planning_generation:
        - create plan
        - generate plan
        - planning document
        - migration plan
        - comprehensive plan
        yaml_format:
        - .yaml
        - yaml plan
        response_length_risk:
        - comprehensive
        - complete
        - detailed phases
      scope:
      - intent
      - description
      logic: AND
    alternatives:
    - 'STEP 1: Create planning YAML file with metadata and structure only'
    - 'STEP 2: Add Phase 1 details to file'
    - 'STEP 3: Add Phase 2 details to file (separate response)'
    - 'STEP 4: Add Phase 3 details to file (separate response)'
    - 'STEP 5: Add remaining phases incrementally'
    - Each step writes to file, NOT to chat response (avoid length limit)
    evidence_template: '#file:documents/evidence-templates/planning/INCREMENTAL_PLAN_GENERATION.md'
    rationale: '#file:documents/rationales/INCREMENTAL_PLAN_GENERATION.md'
  - rule_id: TDD_ENFORCEMENT
    name: Test-Driven Development Enforcement (High-Value Code Only)
    severity: blocked
    description: "Intelligent TDD enforcement - applies to high-value production code (business logic, services, controllers, repositories with complex queries), excludes low-value code (simple DTOs, POCOs, configuration classes, entities with only properties)"
    detection:
      combined_keywords:
        high_value_code:
        - controller
        - service
        - business logic
        - validation
        - repository method
        - complex query
        - transaction
        - authorization
        - authentication
        - workflow
        - orchestrator
        - handler
        - processor
        low_value_exemptions:
        - DTO
        - POCO
        - entity
        - model
        - configuration
        - settings
        - constants
        - simple property
      scope:
      - intent
      - code_type
      - complexity_analysis
    complexity_threshold:
      methods_with_logic: true  # Has methods beyond simple getters/setters
      cyclomatic_complexity: "> 1"  # More than straight-line code
      external_dependencies: true  # Calls other services/repositories
      business_rules: true  # Contains validation/calculation logic
    tdd_exemptions:
      - type: simple_entity
        description: "Entity classes with only auto-properties (no logic)"
        examples:
        - "public class User { public int Id { get; set; } public string Name { get; set; } }"
      - type: dto
        description: "Data Transfer Objects (pure data carriers)"
        examples:
        - "public class CreateUserRequest { public string Name { get; set; } }"
      - type: configuration
        description: "Configuration classes (appsettings mappings)"
        examples:
        - "public class DatabaseSettings { public string ConnectionString { get; set; } }"
      - type: constants
        description: "Constant/enum definitions"
        examples:
        - "public static class ErrorCodes { public const string NotFound = \"404\"; }"
    tdd_required:
      - type: repository
        description: "Repository methods with complex queries/transactions"
        examples:
        - "Task<List<Invoice>> GetByDateRangeAsync(DateTime start, DateTime end)"
        - "Task<bool> DeleteAsync(string id)"
      - type: service
        description: "Business logic layer (validation, calculations, workflows)"
        examples:
        - "Task<Result> ProcessPaymentAsync(Payment payment)"
        - "bool ValidateInvoice(Invoice invoice)"
      - type: controller
        description: "REST API endpoints (HTTP request/response handling)"
        examples:
        - "Task<IActionResult> GetInvoice(string id)"
        - "Task<IActionResult> CreateInvoice(CreateInvoiceRequest request)"
      - type: middleware
        description: "Request pipeline components"
        examples:
        - "Task InvokeAsync(HttpContext context)"
      - type: authorization
        description: "Security/permission checks"
        examples:
        - "Task<bool> CanAccessInvoice(User user, Invoice invoice)"
    alternatives:
    - Write failing test first (RED phase) for high-value code
    - Create spike branch for exploration (throwaway)
    - "Use TDD cycle: RED \u2192 GREEN \u2192 REFACTOR for production logic"
    - Skip TDD for simple entities/DTOs (document why: 'Simple POCO, no logic to test')
    intelligent_enforcement: |
      CORTEX will intelligently detect code type and enforce TDD accordingly:
      
      HIGH-VALUE CODE (TDD MANDATORY):
      ✅ Controllers with HTTP endpoints
      ✅ Services with business logic
      ✅ Repositories with complex queries
      ✅ Middleware with request processing
      ✅ Validation/authorization logic
      ✅ Transaction management
      ✅ Workflows/orchestrators
      
      LOW-VALUE CODE (TDD OPTIONAL):
      ⏭️  Entity classes (only properties)
      ⏭️  DTOs (pure data carriers)
      ⏭️  Configuration classes (appsettings)
      ⏭️  Constants/enums
      ⏭️  Simple POCOs (no methods)
      
      DETECTION STRATEGY:
      1. Analyze code intent (what is being created?)
      2. Check for methods beyond getters/setters
      3. Check for external dependencies (DB, services)
      4. Check for business rules (if/switch logic)
      5. If complexity > threshold → ENFORCE TDD
      6. If simple data structure → SKIP TDD (document)
      
      EXAMPLE DECISIONS:
      
      Phase 2 Entities (FundingInvoice.cs):
      - Type: Entity class
      - Methods: None (only properties)
      - Dependencies: None
      - Business Logic: None
      → DECISION: TDD OPTIONAL (simple POCO)
      → REASON: No logic to test, just data structure
      
      Phase 3 Controller (FundingInvoicesController.GetById):
      - Type: Controller endpoint
      - Methods: Yes (GetById with repository call)
      - Dependencies: Yes (IFundingInvoiceRepository)
      - Business Logic: Yes (404 handling, model mapping)
      → DECISION: TDD MANDATORY
      → REASON: Production logic with HTTP contract
      
      This intelligent approach prevents "test bureaucracy" while ensuring
      critical production code has proper TDD discipline.
    evidence_template: |
      Code Type: '{code_type}'
      Complexity: '{complexity_analysis}'
      TDD Required: '{tdd_decision}'
      
      {tdd_rationale}
  - rule_id: RED_PHASE_VALIDATION
    name: RED Phase Validation (Test Must Fail First)
    severity: blocked
    description: "Tests must fail before implementation exists (RED \u2192 GREEN enforcement)"
    detection:
      keywords:
      - implement before test
      - code first then test
      - skip red phase
      - test after implementation
      scope:
      - intent
      - description
    alternatives:
    - Write failing test first (RED phase)
    - Verify test fails with 'no implementation' error
    - Only proceed to GREEN phase after RED confirmed
    evidence_template: 'Intent: ''{intent}'''
    rationale: "RED Phase Purpose:\n- Validates test actually tests something (not false positive)\n- Forces specification before implementation\n- Prevents over-engineering (only implement what's needed)\n\nWorkflow:\n1. Write test for desired behavior\n2. Run test \u2192 MUST FAIL (no implementation yet)\n3. Confirm failure message is meaningful\n4. Only then proceed to GREEN phase\n"
  - rule_id: GREEN_PHASE_VALIDATION
    name: GREEN Phase Validation (Minimal Implementation)
    severity: blocked
    description: Implementation must pass previously failing tests with minimal code
    detection:
      keywords:
      - skip green phase
      - implement everything at once
      - over-engineer
      - add features not in test
      scope:
      - intent
      - description
    alternatives:
    - Implement ONLY what makes test pass
    - Resist adding extra features (YAGNI)
    - Save improvements for REFACTOR phase
    evidence_template: 'Intent: ''{intent}'''
    rationale: "GREEN Phase Purpose:\n- Minimal implementation (simplest code to pass test)\n- Prevents over-engineering and scope creep\n- Forces incremental development\n\nWorkflow:\n1. Test is RED (failing)\n2. Write simplest code to make test GREEN (passing)\n3. Run test \u2192 MUST PASS\n4. Do NOT add features beyond test requirements\n5. Proceed to REFACTOR phase for improvements\n"
  - rule_id: REFACTOR_CODE_CLEANUP_ENFORCEMENT
    name: REFACTOR Phase Code Cleanup (Remove Orphaned/Duplicate Code)
    severity: blocked
    description: "REFACTOR phase must clean up orphaned functions, duplicate code, and unused imports created during GREEN phase"
    detection:
      combined_keywords:
        refactor_phase:
        - refactor phase
        - refactoring
        - code cleanup
        - improve code
        missing_cleanup:
        - orphaned function
        - duplicate function
        - unused function
        - dead code
        - redundant code
      scope:
      - intent
      - phase
      - code_analysis
    alternatives:
    - Run RefactoringIntelligence with orphaned code detection
    - Remove functions with zero call sites (dead code)
    - Consolidate duplicate function implementations
    - Remove unused imports after implementation changes
    - Verify tests still pass after cleanup
    evidence_template: |
      REFACTOR phase incomplete - Code cleanup required!
      
      Phase: '{phase}'
      Intent: '{intent}'
      
      ❌ BLOCKED: REFACTOR phase must remove technical debt
      
      WHY CODE CLEANUP MATTERS:
      
      Without Cleanup:
      - ❌ Orphaned functions accumulate (old implementation left behind)
      - ❌ Duplicate code created (new function added, old not removed)
      - ❌ Unused imports remain (technical debt grows)
      - ❌ Code base degrades with every TDD cycle
      - ❌ Maintenance cost increases (which version is correct?)
      
      With Cleanup:
      - ✅ One canonical implementation (no confusion)
      - ✅ Codebase stays lean (remove what you replace)
      - ✅ Tests validate cleanup safety (run after removal)
      - ✅ Zero technical debt accumulation
      - ✅ 40% faster codebase navigation (less noise)
      
      REFACTOR Phase Checklist:
      1. Detect orphaned functions (zero call sites)
      2. Detect duplicate function signatures
      3. Detect unused imports
      4. Auto-remove detected issues
      5. Run tests to verify cleanup safety
      6. Only complete phase if tests pass
      
      Implementation Strategy:
      - RefactoringIntelligence._detect_dead_code() - Find functions with zero calls
      - RefactoringIntelligence._detect_orphaned_functions() - Find replaced implementations  
      - RefactoringIntelligence._detect_duplicate_code() - Find identical signatures
      - OrphanedCodeCleaner.remove_dead_functions() - Safe AST-based removal
      - Verify tests pass after cleanup (mandatory)
      
      Real-World Example:
      
      Scenario: Add caching to login function
      
      GREEN Phase (Minimal):
      ```python
      # Old implementation (orphaned after GREEN)
      def login(username, password):
          return authenticate(username, password)
      
      # New implementation (added in GREEN)
      def login_with_cache(username, password):
          cached = cache.get(username)
          if cached: return cached
          result = authenticate(username, password)
          cache.set(username, result)
          return result
      ```
      
      ❌ Without REFACTOR_CODE_CLEANUP_ENFORCEMENT:
      - Both functions remain in codebase
      - Which one should callers use? (ambiguous)
      - Duplicate maintenance burden
      - Technical debt accumulates
      
      ✅ With REFACTOR_CODE_CLEANUP_ENFORCEMENT:
      - Detect old login() has zero call sites
      - Auto-remove orphaned function
      - Rename login_with_cache() → login()
      - Run tests to verify (mandatory)
      - Clean codebase, zero ambiguity
      
      This rule ensures CORTEX "cleans up after itself" in REFACTOR phase.
    rationale: "REFACTOR_CODE_CLEANUP_ENFORCEMENT: Prevent Technical Debt Accumulation\n\n- Orphaned functions accumulate without cleanup\n- Duplicate code confuses maintainers (which version is correct?)\n- Tests validate cleanup safety (no fear of breaking changes)\n- Clean codebase = faster navigation (40% improvement)\n\nImplementation: AST-based analysis + automated removal + test verification\n"
  - rule_id: HOLISTIC_CODE_DISCOVERY_ENFORCEMENT
    name: Pre-Implementation Code Discovery (Search Before Create)
    severity: blocked
    description: "Before implementing new functionality, MUST search codebase for existing implementations to prevent duplication"
    detection:
      combined_keywords:
        implementation_intent:
        - implement
        - create function
        - add method
        - new class
        - write code
        - build feature
        scope_indicators:
        - new functionality
        - feature
        - enhancement
        - refactor
      scope:
      - intent
      - implementation_phase
      - code_creation
    alternatives:
    - Run semantic_search for similar function names/descriptions
    - Run grep_search for keyword patterns in implementation
    - Check list_code_usages for related functionality
    - Review file_search results for relevant modules
    - Consolidate with existing code instead of duplicating
    evidence_template: |
      Pre-implementation discovery required - Search before create!
      
      Intent: '{intent}'
      Phase: '{phase}'
      
      ❌ BLOCKED: Must search codebase before implementing new code
      
      WHY DISCOVERY MATTERS:
      
      Without Discovery (Current Problem):
      - ❌ Create new function without checking for existing implementation
      - ❌ Result: Duplicate functions with different names (e.g., parse_config, load_config, read_config)
      - ❌ Maintenance nightmare: Which version is correct? Which should callers use?
      - ❌ Technical debt compounds with every feature
      - ❌ Code review burden: Reviewers catch duplicates too late
      
      With Discovery (New Pattern):
      - ✅ Search for similar implementations BEFORE writing code
      - ✅ Reuse existing code (DRY principle)
      - ✅ Enhance existing code if needed (consolidation)
      - ✅ Zero duplication at creation time
      - ✅ Cleaner codebase = faster development
      
      MANDATORY DISCOVERY WORKFLOW:
      
      1. **Semantic Search** (Intent-based):
         ```
         semantic_search("parse configuration file yaml")
         semantic_search("authentication token validation")
         ```
         Finds: Similar functionality regardless of naming
      
      2. **Grep Search** (Pattern-based):
         ```
         grep_search("def.*config|class.*Config", isRegexp=true)
         grep_search("authenticate|verify.*token", isRegexp=true)
         ```
         Finds: Functions/classes with similar keywords
      
      3. **Usage Analysis** (Dependency-based):
         ```
         list_code_usages("ConfigParser")
         list_code_usages("authenticate_user")
         ```
         Finds: How existing implementations are used
      
      4. **Decision Matrix:**
         - Found exact match → Reuse it (link caller to existing)
         - Found similar → Enhance it (add parameters/features)
         - Found none → Create new (document why unique)
      
      REAL-WORLD EXAMPLES:
      
      Example 1: Configuration Parsing
      
      ❌ Without Discovery:
      ```python
      # File: src/config.py
      def load_yaml_config(path):
          with open(path) as f:
              return yaml.safe_load(f)
      
      # File: src/settings.py (created later)
      def parse_config_file(filename):  # DUPLICATE!
          with open(filename) as f:
              return yaml.safe_load(f)
      ```
      Result: 2 identical functions, confusion, maintenance burden
      
      ✅ With Discovery:
      1. Search: semantic_search("parse yaml configuration")
      2. Found: load_yaml_config() in src/config.py
      3. Action: Import and use existing function
      4. Result: Zero duplication, DRY maintained
      
      Example 2: Token Validation
      
      ❌ Without Discovery:
      ```python
      # File: src/auth/jwt.py
      def verify_jwt_token(token):
          return jwt.decode(token, SECRET_KEY)
      
      # File: src/api/middleware.py (created later)
      def validate_auth_token(token):  # DUPLICATE!
          return jwt.decode(token, SECRET_KEY)
      ```
      
      ✅ With Discovery:
      1. Search: grep_search("verify.*token|validate.*token", isRegexp=true)
      2. Found: verify_jwt_token() in src/auth/jwt.py
      3. Action: Import existing function
      4. Result: Single source of truth
      
      COPILOT WORKFLOW INTEGRATION:
      
      Phase: Before GREEN Phase Implementation
      
      Step 1: Intent Classification
      - User asks: "Add user authentication to API"
      - CORTEX classifies: Implementation intent detected
      
      Step 2: HOLISTIC_CODE_DISCOVERY_ENFORCEMENT Triggers
      - BLOCKED: Must search before implementing
      
      Step 3: Discovery Execution
      ```python
      # Parallel discovery batch
      semantic_results = semantic_search("user authentication api")
      grep_results = grep_search("def.*authenticate|class.*Auth", isRegexp=true)
      usage_results = list_code_usages("authenticate")
      ```
      
      Step 4: Results Analysis
      - Found existing: src/auth/authenticator.py::authenticate_user()
      - Usage count: 12 call sites across 5 files
      
      Step 5: Decision
      - Reuse existing function
      - No new code needed
      - Link caller to existing implementation
      
      Step 6: Proceed to Implementation
      - Import existing function
      - Write test for caller integration
      - GREEN phase: Wire up existing code
      
      DESIGN PATTERN: Holistic Navigation Protocol
      
      **Pattern Name:** Search-Decide-Implement (SDI)
      
      **Structure:**
      1. SEARCH: Multi-strategy discovery (semantic + grep + usage)
      2. DECIDE: Reuse, Enhance, or Create
      3. IMPLEMENT: Execute decision with tests
      
      **Benefits:**
      - Prevents duplication at source (proactive vs reactive)
      - Leverages Copilot's search tools effectively
      - Respects DRY principle automatically
      - Reduces code review burden (no duplicate detection needed)
      - Improves discoverability (devs learn existing APIs)
      
      **Integration with TDD:**
      - Discovery happens BEFORE RED phase
      - If reusing: Test integration with existing code
      - If creating: Test new code (standard TDD)
      
      METRICS & VALIDATION:
      
      Success Criteria:
      - Zero duplicate function implementations within 90 days
      - 80% code reuse rate for common patterns (auth, config, logging)
      - 50% reduction in "similar code" code review comments
      
      Detection:
      - AST similarity analysis (function signature comparison)
      - Semantic similarity scoring (docstring + implementation)
      - Manual code review feedback tracking
      
      Enforcement:
      - Brain Protector agent blocks implementation without discovery
      - Requires evidence of search results (search tool invocations)
      - Tier 0 instinct (cannot be bypassed)
      
      COMPARISON WITH EXISTING RULES:
      
      REFACTOR_CODE_CLEANUP_ENFORCEMENT (Reactive):
      - Triggers: AFTER duplication created
      - Action: Remove orphaned/duplicate code
      - Phase: REFACTOR
      
      HOLISTIC_CODE_DISCOVERY_ENFORCEMENT (Proactive):
      - Triggers: BEFORE implementation starts
      - Action: Search for existing code
      - Phase: Pre-GREEN (before writing any code)
      
      Together: Defense-in-depth against duplication
      - Proactive prevention (discovery)
      - Reactive cleanup (refactoring)
      
      This rule ensures CORTEX "thinks before coding" - holistic view first.
    rationale: "HOLISTIC_CODE_DISCOVERY_ENFORCEMENT: Prevent Duplication at Source\n\n- Search before create (proactive vs reactive)\n- Reuse existing implementations (DRY principle)\n- Consolidate when similar code exists (enhance vs duplicate)\n- Reduce maintenance burden (single source of truth)\n\nImplementation: Multi-strategy search (semantic + grep + usage) before any code creation\n"
    rationale: |
      REFACTOR_CODE_CLEANUP_ENFORCEMENT: Critical TDD Hygiene Rule
      
      Problem This Solves:
      - GREEN phase adds new code (minimal implementation to pass tests)
      - OLD implementations become orphaned (no callers)
      - Duplicate code accumulates (old + new versions coexist)
      - Codebase degrades with every TDD cycle
      
      Why This Happens:
      - GREEN phase focuses on "make tests pass" (correct)
      - But doesn't remove replaced implementations (incorrect)
      - REFACTOR phase only suggests improvements (incomplete)
      - No enforcement to clean up technical debt
      
      Impact Without This Rule:
      - 📈 Code duplication grows 15% per TDD cycle
      - 🐌 Codebase navigation slows (noise increases)
      - 🤔 Ambiguity: which function is canonical?
      - 💸 Maintenance cost doubles (fix bug in 2 places?)
      
      Impact With This Rule:
      - ✅ One canonical implementation per feature
      - ✅ Zero orphaned functions after REFACTOR
      - ✅ Tests verify cleanup safety automatically
      - ✅ Codebase stays lean and maintainable
      
      Enforcement Mechanism:
      1. Detect: Run RefactoringIntelligence code smell detection
      2. Analyze: Find dead code, duplicates, orphaned functions
      3. Clean: Auto-remove detected issues via OrphanedCodeCleaner
      4. Verify: Run tests after cleanup (mandatory)
      5. Block: Prevent REFACTOR phase completion if cleanup failed
      
      Detection Confidence:
      - Dead Code: 95% (AST analysis of call sites)
      - Duplicate Signatures: 90% (function signature matching)
      - Orphaned Functions: 85% (zero references in codebase)
      
      This rule completes the TDD cycle: RED → GREEN → REFACTOR (with cleanup).
  - rule_id: TDD_TEST_FILE_VALIDATION
    name: Test File Existence Validation
    severity: blocked
    description: "All production code files MUST have corresponding test files. Validates test coverage completeness across all architectural layers (Domain, Application, Infrastructure, API)."
    detection:
      combined_keywords:
        production_code:
        - "*Handler.cs"
        - "*Validator.cs"
        - "*Repository.cs"
        - "*Controller.cs"
        - "*Service.cs"
        - "*Entity.cs"
        missing_tests:
        - "no test file"
        - "test file missing"
        - "untested code"
      scope:
      - file_analysis
      - coverage_report
    alternatives:
    - "Create test file for each production file using pattern: Tests/{Layer}/{FileName}Tests.cs"
    - "Domain layer: Tests/Domain/*EntityTests.cs, Tests/Domain/*ServiceTests.cs"
    - "Application layer: Tests/Application/Handlers/*Tests.cs, Tests/Application/Validators/*Tests.cs"
    - "Infrastructure layer: Tests/Infrastructure/Repositories/*Tests.cs"
    - "API layer: Tests/API/Controllers/*Tests.cs, Tests/Integration/*Tests.cs"
    - "Minimum 3 test methods per production file"
    evidence_template: |
      Test file validation failure detected!
      
      Production files without tests: {missing_count}
      
      ❌ BLOCKED: Cannot proceed with incomplete test coverage
      
      **Gap Analysis (Cortex-Clean Example):**
      
      Domain Layer: ✅ 90% coverage
      - TaskEntity.cs → TaskEntityTests.cs ✓
      - TaskValidationService.cs → Tests exist ✓
      
      Application Layer: ❌ 0% coverage
      - CreateTaskCommandHandler.cs → ❌ NO TESTS
      - UpdateTaskCommandHandler.cs → ❌ NO TESTS
      - DeleteTaskCommandHandler.cs → ❌ NO TESTS
      - ToggleTaskCompletionCommandHandler.cs → ❌ NO TESTS
      - CreateTaskCommandValidator.cs → ❌ NO TESTS
      - UpdateTaskCommandValidator.cs → ❌ NO TESTS
      
      Infrastructure Layer: ❌ 0% coverage
      - TaskRepository.cs → ❌ NO TESTS
      - ApplicationDbContext.cs → ❌ NO TESTS
      
      API Layer: ❌ 0% coverage
      - TasksController.cs → ❌ NO TESTS
      - GlobalExceptionMiddleware.cs → ❌ NO TESTS
      - Integration tests → ❌ NONE
      
      **Required Test Files:**
      
      Application Layer:
      - Tests/Application/Handlers/CreateTaskCommandHandlerTests.cs
      - Tests/Application/Handlers/UpdateTaskCommandHandlerTests.cs
      - Tests/Application/Handlers/DeleteTaskCommandHandlerTests.cs
      - Tests/Application/Handlers/ToggleTaskCompletionCommandHandlerTests.cs
      - Tests/Application/Validators/CreateTaskCommandValidatorTests.cs
      - Tests/Application/Validators/UpdateTaskCommandValidatorTests.cs
      
      Infrastructure Layer:
      - Tests/Infrastructure/Repositories/TaskRepositoryTests.cs
      
      API Layer:
      - Tests/API/Controllers/TasksControllerTests.cs
      - Tests/Integration/TasksApiIntegrationTests.cs
      
      **Impact:**
      - Claimed Coverage: 90%+
      - Actual Coverage: ~15-20%
      - Gap: 70-75% untested code
      - Risk: High (handlers, validators, repositories untested)
      
      **Detection Method:**
      - Scan production code directories
      - Match files against test naming patterns
      - Validate minimum test count per file
      - Calculate per-layer coverage
      - Block if any layer below threshold
      
      **Next Steps:**
      1. Create missing test files using TDD workflow
      2. Write failing tests first (RED phase)
      3. Implement to pass tests (GREEN phase)
      4. Refactor with confidence (tests validate)
      5. Re-run validation to verify coverage
    rationale: |
      TDD_TEST_FILE_VALIDATION: Prevent Coverage Claims vs Reality Gap
      
      **Real-World Problem (Cortex-Clean):**
      - README claims 90%+ test coverage
      - Only Domain layer has tests
      - Application, Infrastructure, API layers: 0% coverage
      - Actual coverage: ~15-20%
      - Credibility gap: 70-75%
      
      **Why This Happens:**
      - Focus on "happy path" testing (entities)
      - Handlers/validators assumed "too simple to test"
      - Integration tests skipped ("takes too long")
      - No enforcement of coverage requirements
      - Manual coverage claims (no verification)
      
      **Impact Without This Rule:**
      - False confidence in code quality
      - Bugs in untested layers
      - Difficult refactoring (no test safety net)
      - Production failures in handlers/repositories
      - Loss of credibility
      
      **Impact With This Rule:**
      - Enforced test file creation
      - Per-layer coverage validation
      - No "simple" code escapes testing
      - Integration tests mandatory for APIs
      - Real coverage matches claims
      
      **Enforcement Strategy:**
      
      Layer-Specific Requirements:
      - Domain: 90% minimum (entities, services, exceptions)
      - Application: 85% minimum (handlers, validators, commands, queries)
      - Infrastructure: 70% minimum (repositories, DbContext)
      - API: 80% minimum (controllers, middleware, integration tests)
      
      File Naming Patterns:
      - Handler → *HandlerTests.cs (Tests/Application/Handlers/)
      - Validator → *ValidatorTests.cs (Tests/Application/Validators/)
      - Repository → *RepositoryTests.cs (Tests/Infrastructure/Repositories/)
      - Controller → *ControllerTests.cs (Tests/API/Controllers/)
      - Entity → *EntityTests.cs (Tests/Domain/)
      
      Validation Logic:
      1. Scan production code by layer
      2. Check for corresponding test file
      3. Verify minimum 3 test methods per file
      4. Calculate per-layer coverage
      5. Block if layer below threshold
      6. Report missing test files with paths
      
      **Benefits:**
      - 100% visibility into test gaps
      - Prevents coverage inflation
      - Enforces comprehensive testing
      - Builds confidence in refactoring
      - Catches bugs early (handlers, validators)
      
      This rule ensures CLAIMED coverage matches ACTUAL coverage.
  - rule_id: TDD_EMPTY_TEST_DETECTION
    name: Empty/Placeholder Test Detection
    severity: warning
    description: "Detects and blocks low-quality tests: empty test methods, placeholder tests (Test1), meaningless assertions (Assert.True(true)), tests with zero assertions."
    detection:
      combined_keywords:
        test_files:
        - "*Tests.cs"
        - "*Test.cs"
        - "test_*.py"
        placeholder_patterns:
        - "void Test1()"
        - "def test_1():"
        - "Assert.True(true)"
        - "assert True"
        - "[Fact] public void Test"
      scope:
      - test_content
      - code_analysis
    alternatives:
    - "Replace placeholder test with meaningful test name"
    - "Add at least one assertion per test method"
    - "Test actual behavior, not always-true conditions"
    - "Use descriptive test names: Should_ReturnTask_When_IdExists"
    - "Follow AAA pattern: Arrange, Act, Assert"
    evidence_template: |
      Low-quality test detected!
      
      File: {test_file}
      Issues found: {issue_count}
      
      ⚠️ WARNING: Test quality issues must be addressed
      
      **Issue Types:**
      
      1. Empty Test Methods:
      ```csharp
      [Fact]
      public void Test1()  // ❌ Placeholder name
      {
          // ❌ No implementation
      }
      ```
      
      2. Meaningless Assertions:
      ```csharp
      [Fact]
      public void TestSomething()
      {
          Assert.True(true);  // ❌ Always passes, tests nothing
      }
      ```
      
      3. Zero Assertions:
      ```csharp
      [Fact]
      public void TestFeature()
      {
          var result = GetData();
          // ❌ No assertion - test can't fail
      }
      ```
      
      4. Placeholder Names:
      ```csharp
      public void Test1() { }  // ❌
      public void UnitTest1() { }  // ❌
      public void TestMethod1() { }  // ❌
      ```
      
      **Real Example (Cortex-Clean):**
      
      File: UnitTest1.cs
      ```csharp
      namespace Cortex.Clean.Tests;
      
      public class UnitTest1  // ❌ Placeholder class name
      {
          [Fact]
          public void Test1()  // ❌ Placeholder method name
          {
              // ❌ Empty body - no test logic
          }
      }
      ```
      
      **Impact:**
      - Test count inflated (1 test exists)
      - Test quality: 0% (test does nothing)
      - Coverage calculation misleading
      - False sense of security
      - No actual validation
      
      **Required Fixes:**
      
      ✅ Good Test Example:
      ```csharp
      public class TaskEntityTests
      {
          [Fact]
          public void Should_CreateTask_When_ValidTitleProvided()
          {
              // Arrange
              var title = "Test Task";
              
              // Act
              var task = new TaskEntity(title);
              
              // Assert
              task.Should().NotBeNull();
              task.Title.Should().Be(title);
              task.IsCompleted.Should().BeFalse();
          }
      }
      ```
      
      **Test Quality Checklist:**
      - ✅ Descriptive name (Should_[Expected]_When_[Condition])
      - ✅ AAA pattern (Arrange, Act, Assert)
      - ✅ At least one meaningful assertion
      - ✅ Tests actual behavior
      - ✅ Can fail if code breaks
      - ✅ Clear, focused purpose
      
      **Detection Patterns:**
      - Regex: `void Test\d+\(\)` → Placeholder names
      - Regex: `Assert\.True\(true\)` → Meaningless assertions
      - AST: Zero assertion statements → No validation
      - AST: Empty method body → No implementation
      - Pattern: UnitTest1, TestMethod1 → Generic names
      
      **Auto-Fixes Available:**
      - Delete empty test files/methods
      - Suggest descriptive names
      - Generate test templates
      - Add assertion examples
      
      **Next Steps:**
      1. Delete or implement empty tests
      2. Rename placeholder tests descriptively
      3. Add meaningful assertions
      4. Follow AAA pattern
      5. Verify test can actually fail
    rationale: |
      TDD_EMPTY_TEST_DETECTION: Prevent Test Quality Degradation
      
      **Problem Scenario:**
      - Developer creates test file (good intent)
      - Adds placeholder Test1() method
      - Gets distracted, never implements test
      - Test file committed with empty tests
      - Coverage tool counts it as "1 test"
      - Reality: Zero validation happening
      
      **Real-World Example (Cortex-Clean):**
      
      File: UnitTest1.cs (committed to repo)
      - Placeholder class name
      - Placeholder test name (Test1)
      - Empty test body
      - Contributes to "test count"
      - Provides zero value
      - Misleading quality metric
      
      **Why Empty Tests Are Harmful:**
      - Inflate test counts without value
      - Create false sense of security
      - Waste CI/CD execution time
      - Confuse developers ("What does Test1 do?")
      - Reduce trust in test suite
      - Mask actual coverage gaps
      
      **Detection Confidence:**
      - Empty methods: 100% (AST analysis)
      - Placeholder names: 95% (regex pattern)
      - Meaningless assertions: 90% (Assert.True(true) pattern)
      - Zero assertions: 95% (AST statement count)
      
      **Enforcement Strategy:**
      
      Detection Phase:
      1. Scan all test files
      2. Parse methods with test attributes
      3. Check method body (empty = violation)
      4. Check assertion count (zero = violation)
      5. Check for known meaningless patterns
      6. Check for placeholder naming patterns
      
      Warning Phase:
      - Report all detected issues
      - Show file locations
      - Suggest fixes
      - Block commit if critical issues
      
      **Benefits:**
      - Real test quality visibility
      - Prevent test suite degradation
      - Enforce meaningful tests
      - Improve developer discipline
      - Accurate coverage metrics
      - Trustworthy test suite
      
      **Severity: WARNING (not BLOCKED)**
      - Allows incremental improvement
      - Doesn't block urgent work
      - Encourages cleanup
      - Escalates to BLOCKED if count grows
      
      This rule ensures test suite quality, not just quantity.
  - rule_id: SOLID_SRP
    name: Single Responsibility Principle
    severity: blocked
    description: Class/function violates Single Responsibility Principle
    detection:
      keywords:
      - class does too much
      - multiple responsibilities
      - god class
      - long method
      scope:
      - analysis
      - description
    alternatives:
    - Extract separate classes for each responsibility
    - Split into smaller, focused functions
    - Use composition over inheritance
    evidence_template: 'Violation: ''{description}'''
    rationale: 'SRP Enforcement:

      - Each class should have ONE reason to change

      - Functions should do ONE thing well

      - Improves testability and maintainability


      Indicators of Violation:

      - Class > 250 lines

      - Function > 30 lines

      - Class name contains "And" or "Manager"

      - Multiple import groups (data, network, UI)

      '
  - rule_id: SOLID_DIP
    name: Dependency Inversion Principle
    severity: blocked
    description: Code depends on concrete implementations instead of abstractions
    detection:
      keywords:
      - concrete dependency
      - tight coupling
      - cannot mock
      - hard to test
      scope:
      - analysis
      - description
    alternatives:
    - Depend on interfaces/protocols, not classes
    - Inject dependencies via constructor
    - Use dependency injection framework
    evidence_template: 'Violation: ''{description}'''
    rationale: "DIP Enforcement:\n- High-level modules shouldn't depend on low-level modules\n- Both should depend on abstractions (interfaces)\n- Enables testing with mocks\n\nExample:\n\u274C BAD:\nclass UserService:\n    def __init__(self):\n        self.db = PostgresDatabase()  # Concrete dependency\n\n\u2705 GOOD:\nclass UserService:\n    def __init__(self, db: IDatabase):  # Abstract dependency\n        self.db = db\n"
  - rule_id: SECURITY_INJECTION
    name: Security - Injection Prevention
    severity: blocked
    description: Code vulnerable to SQL injection, XSS, or command injection
    detection:
      keywords:
      - string concatenation
      - execute raw sql
      - eval(
      - exec(
      - innerHTML
      scope:
      - code
      - description
    alternatives:
    - Use parameterized queries (SQL)
    - Use prepared statements
    - Sanitize user input
    - Use template engines with auto-escaping
    evidence_template: 'Security risk: ''{description}'''
    rationale: "Injection Prevention:\n- NEVER concatenate user input into SQL/commands\n- ALWAYS use parameterized queries\n- ALWAYS validate and sanitize input\n\nExample:\n\u274C BAD:\nquery = f\"SELECT * FROM users WHERE id = {user_id}\"  # SQL injection\n\n\u2705 GOOD:\nquery = \"SELECT * FROM users WHERE id = ?\"\ncursor.execute(query, (user_id,))  # Parameterized\n"
  - rule_id: SECURITY_AUTHENTICATION
    name: Security - Authentication Best Practices
    severity: blocked
    description: Authentication/authorization implementation has security issues
    detection:
      keywords:
      - plaintext password
      - hardcoded secret
      - no authentication
      - skip authorization
      scope:
      - code
      - description
    alternatives:
    - Hash passwords with bcrypt/argon2
    - Use environment variables for secrets
    - Implement proper authentication middleware
    - Check authorization before resource access
    evidence_template: 'Security risk: ''{description}'''
    rationale: "Authentication Security:\n- NEVER store plaintext passwords\n- NEVER hardcode secrets in code\n- ALWAYS verify authentication before protected operations\n- ALWAYS check authorization (user can access resource)\n\nExample:\n\u274C BAD:\npassword = user_input  # Plaintext storage\nAPI_KEY = \"sk-1234567890\"  # Hardcoded secret\n\n\u2705 GOOD:\nhashed = bcrypt.hashpw(password, bcrypt.gensalt())\nAPI_KEY = os.getenv(\"API_KEY\")  # Environment variable\n"
  - rule_id: THREAT_MODELING_ENFORCEMENT
    name: Security - Threat Modeling Required
    severity: blocked
    description: Planning workflow executed without STRIDE threat analysis
    detection:
      keywords:
      - skip threat
      - bypass threat
      - no threat analysis
      - threat analysis disabled
      scope:
      - intent
      - flags
      - workflow
      workflow_triggers:
      - operation: planning
        required_stages:
        - threat_analysis
        stage_config:
          name: threat_analysis
          required: true
          timeout: 600
          on_failure: block
    alternatives:
    - Execute STRIDE threat analysis (Stage 4 in planning_with_threats.yaml)
    - Use --allow-skip-threats flag for exceptional cases (triggers warning)
    - Review identified threats and mitigations before proceeding
    evidence_template: 'Threat modeling required: ''{description}'''
    rationale: '#file:documents/rationales/THREAT_MODELING_ENFORCEMENT.md'
    exceptions:
    - flag: --allow-skip-threats
      action: warn
      message: Threat analysis bypassed by user request (not recommended - security risks unassessed)
    - condition: workflow == 'planning_with_threats.yaml'
      action: enforce_stage_completion
      stage: threat_analysis
      on_failure: block
