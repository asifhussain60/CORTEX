schema_version: '5.0'
categories:
- development_workflow
- architecture_integrity
- quality_ga    - "Git commit without /cortex-git-commit pattern"

- rule_id: INCREMENTAL_AUTONOMOUS_EXECUTION
  category: orchestration_lifecycle
  severity: blocked
  name: Small Incremental Autonomous Operations Required
  description: 'ALL orchestrators MUST work in small, meaningful increments to prevent token limit errors and server failures (HTTP 502).

    Large monolithic operations that exceed token context windows cause catastrophic failures.

    Orchestrators MUST operate autonomously without manual intervention between increments.

    '
  enforcement:
    trigger: orchestrator_execution_start
    action: block_if_operation_too_large
  validation:
  - Operations split into <500 line increments per execution
  - Each increment is independently executable
  - State persisted between increments (continuation support)
  - Token usage monitored and capped at 80% of limit
  - Autonomous mode enabled by default (no user prompts mid-execution)
  implementation:
    middleware: src.orchestrators.middleware.incremental_executor.IncrementalExecutor
    hook: pre_execution
    priority: 8
    token_monitor: src.utils.token_counter.TokenUsageMonitor
  examples:
    pass:
    - "Phase 1: Process 50 files → Phase 2: Process next 50 files (incremental)"
    - "Orchestrator completes Phase 1 autonomously → Auto-proceeds to Phase 2"
    - "Token usage 75% → Checkpoint state → Continue in next turn"
    fail:
    - "Process all 1000 files in single execution (causes 502 error)"
    - "Orchestrator pauses mid-execution waiting for user approval"
    - "No state persistence between phases (restart from scratch)"
  error_reference: "Server error 502 (request ID: c43bcffb-60ff-4d8c-ae4c-0c56e1c679cd) - Token limit exceeded"
  rationale: |
    Incremental execution prevents:
    1. Token limit errors (HTTP 502, context overflow)
    2. Loss of work (operation fails halfway, no state saved)
    3. Manual intervention burden (user must approve every step)
    4. Timeout failures (operation takes too long)
    5. Memory exhaustion (processing too much data at once)
    
    Benefits of autonomous incremental execution:
    1. Predictable resource usage (token budgets enforced)
    2. Fault tolerance (state checkpoints enable recovery)
    3. User-friendly (autonomous progress, no babysitting)
    4. Scalable (handles large operations via chunking)
    5. Reliable (small increments less likely to fail)

- rule_id: NO_SUMMARY_FILE_GENERATION
  category: response_formatting
  severity: blocked
  name: Block Summary/Report/Explanation File Creation
  description: 'Orchestrators MUST NOT create markdown summary files (*-summary.md, *-report.md, *-explanation.md) at the end of each turn.

    Users explicitly request NOT to create these files as they clutter the workspace and provide no value.

    Executive summaries should be provided directly in the GitHub Copilot chat, NOT as files.

    '
  enforcement:
    trigger: file_creation_attempt
    action: block_if_summary_file
  validation:
  - No files matching patterns: *-summary.md, *-report.md, *-explanation.md, completion-*.md
  - No files in root with "summary", "report", "explanation" in name
  - Exception: Required reports in plan_folder/reports/ (validation-report.md, etc.)
  - Exception: Required analysis in plan_folder/analysis/ (gap-analysis.md, etc.)
  implementation:
    middleware: src.orchestrators.middleware.file_creation_guard.FileCreationGuard
    hook: pre_file_creation
    priority: 2
    blocklist_patterns:
      - "*-summary.md"
      - "*-report.md"
      - "*-explanation.md"
      - "completion-*.md"
      - "executive-summary.md"
      - "EXECUTIVE-SUMMARY.md"
  examples:
    pass:
    - "Executive summary provided in chat response (no file created)"
    - "cortex-brain/documents/planning/active/cortex5-epic/reports/validation-report.md (allowed)"
    - "cortex-brain/documents/planning/active/cortex5-epic/analysis/gap-analysis.md (allowed)"
    fail:
    - "Created cortex-brain/documents/planning/active/cortex5-epic/EXECUTIVE-SUMMARY.md"
    - "Created cortex-brain/documents/planning/active/cortex5-epic/completion-report.md"
    - "Created cortex-brain/documents/planning/active/cortex5-epic/phase-1-summary.md"
  user_feedback_reference: ".github/copilot/copilot-chats/chat01.md line 15: 'Do not create a summary document at the end. Give me an executive summary without code snippets.'"
  rationale: |
    Blocking summary files prevents:
    1. Workspace clutter (unnecessary markdown files everywhere)
    2. Redundancy (summary already in chat response)
    3. Ignored files (users don't read these files)
    4. Git noise (unnecessary commits for summary files)
    5. Maintenance burden (orphaned summaries never updated)
    
    Benefits of chat-only summaries:
    1. User sees summary immediately (in chat)
    2. No workspace pollution (files stay organized)
    3. Context-appropriate (summary tailored to conversation)
    4. No cleanup needed (chat history is ephemeral)
    5. User-requested behavior (explicit requirement)

- rule_id: VISUAL_PROGRESS_RESPONSE_FORMAT
  category: response_formatting
  severity: blocked
  name: Executive Summary with Visual Progress Bars Required
  description: 'ALL orchestrator responses MUST provide executive summaries without code snippets, using visual progress bars.

    Response format MUST follow cortex-maintenance.prompt.md visual progress bar style.

    Code snippets clutter responses and reduce readability; users want high-level summaries only.

    '
  enforcement:
    trigger: orchestrator_completion
    action: block_if_code_snippets_or_missing_progress
  validation:
  - Response contains executive summary section
  - Executive summary has NO code snippets (no ```...``` blocks)
  - Visual progress bars present (█████░░░░░ style)
  - Progress bars show phase completion percentage
  - Response length ≤40 lines (concise format)
  implementation:
    middleware: src.orchestrators.middleware.response_formatter.ResponseFormatter
    hook: post_execution
    priority: 5
    template_reference: "cortex-brain/response-templates-v4.yaml:autonomous_execution_progress"
  response_template:
    format: |
      ## ✅ {Orchestrator Name} Complete
      
      **Progress:** {completed}/{total} phases ({percentage}%)
      {visual_progress_bar}
      
      **Delivered:**
      - {artifact_1}
      - {artifact_2}
      - {artifact_3}
      
      **Next:** {next_phase_name}
      
      ---
      
      📋 **Resume:** `continue plan {plan_name}` *(see `CONTINUATION-PROMPT.md`)*
    
    visual_progress_bar_format: |
      Phase Progress: [████████░░] 80%
      Overall Progress: [██████████] 100%
  examples:
    pass:
    - |
      ## ✅ Planning v5 Complete
      
      **Progress:** 3/5 phases (60%)
      Phase Progress: [██████░░░░] 60%
      
      **Delivered:**
      - 00-cortex5-epic.md (master plan)
      - tracking/progress-tracker.json
      - plan-viewer.html
      
      **Next:** Phase 4 - Validation
    fail:
    - |
      ## ✅ Planning v5 Complete
      
      Here's the code I created:
      
      ```python
      def execute(self, request: str):
          # Implementation details...
      ```
      
      (Contains code snippet - BLOCKED)
    - |
      ## ✅ Planning v5 Complete
      
      Tasks completed:
      - Task 1
      - Task 2
      ...
      - Task 50
      
      (No visual progress bar - BLOCKED)
  reference_document: ".github/prompts/cortex-maintenance.prompt.md (visual progress bar formats)"
  rationale: |
    Visual progress responses enable:
    1. Quick comprehension (no code to parse)
    2. Progress visibility (bars show completion at a glance)
    3. Cognitive load reduction (concise summaries vs verbose logs)
    4. Accessibility (WCAG AA compliant - progress bars + text percentages)
    5. Consistency (all orchestrators use same format)
    
    Code snippets harm responses because:
    1. Users don't read code in chat (check files instead)
    2. Code clutters response (reduces signal-to-noise ratio)
    3. Code may be incorrect (summarized or simplified)
    4. Code duplicates file content (already accessible)
    5. Users explicitly request no code snippets

- rule_id: TDD_ENFORCEMENTs
- orchestration_lifecycle
- response_formatting
- security_privacy
- portability
rules:
- rule_id: PATH_PORTABILITY
  category: portability
  severity: blocked
  name: Portable Path Resolution Required
  description: 'NEVER use hardcoded absolute paths. ALWAYS use relative paths or dynamic detection.

    CORTEX must work across different installations (Windows, macOS, Linux) with different install locations.

    '
  enforcement:
    trigger: code_change
    action: block_if_hardcoded_path
  validation:
  - No hardcoded paths like /Users/username/... or C:\Users\...
  - Use src.utils.project_root.get_project_root() for dynamic detection
  - Use Path(__file__).resolve() for relative resolution
  - Config files use relative paths only
  implementation:
    utility: src.utils.project_root
    pattern: get_project_root()
  examples:
    pass:
    - from src.utils.project_root import get_project_root; root = get_project_root()
    - Path(__file__).parent.parent / "cortex-brain"
    - project_root / "scripts" / "utilities"
    fail:
    - workspace = "/Users/asifhussain/PROJECTS/CORTEX"
    - docs_dir = Path("/Users/asifhussain/PROJECTS/CORTEX/docs")
    - C:\Users\username\CORTEX\brain
- rule_id: SETUP_VERIFICATION
  category: orchestration_lifecycle
  severity: blocked
  name: 'Phase -2: Setup Verification Mandatory'
  description: 'ALL orchestrators MUST run Phase -2 setup verification before execution.

    This prevents false positives and ensures dependencies are ACTUALLY complete.

    '
  enforcement:
    trigger: orchestrator_execution_start
    action: block_if_verification_fails
  validation:
  - Dependencies must pass implementation tests (not just file existence)
  - False positive detection must run
  - VSCode cache state must be checked
  - Governance compliance must be validated
  implementation:
    middleware: src.orchestrators.middleware.setup_verification.SetupVerifier
    hook: pre_execution
    priority: 1
  examples:
    pass:
    - C50-03 verifies C50-00C tests ACTUALLY pass (pytest execution)
    - Planning v5 detects broken dependency file (import test fails)
    fail:
    - Orchestrator starts without running SetupVerifier
    - Dependency file exists but broken (false positive not detected)
- rule_id: TEARDOWN_REFACTOR
  category: orchestration_lifecycle
  severity: blocked
  name: 'Phase N+1: Teardown + REFACTOR + Commit Mandatory'
  description: 'ALL orchestrators MUST run Phase N+1 teardown after execution.

    This ensures code cleanup and atomic git commits follow /cortex-git-commit pattern.

    '
  enforcement:
    trigger: orchestrator_execution_complete
    action: block_if_refactor_fails
  validation:
  - Whole-file REFACTOR must run (remove unused imports, orphaned code)
  - All modified files must be refactored
  - Git commit must follow /cortex-git-commit pattern
  - Commit message must include orchestrator name + phase summary
  implementation:
    middleware: src.orchestrators.middleware.teardown_refactor.TeardownRefactor
    hook: post_execution
    priority: 30
  examples:
    pass:
    - Orchestrator completes → REFACTOR runs → Git commit with Co-authored-by
    - 5 files modified → All refactored → Atomic commit
    fail:
    - Orchestrator completes but no REFACTOR cycle
    - Git commit without /cortex-git-commit pattern
- rule_id: TDD_ENFORCEMENT
  category: development_workflow
  severity: blocked
  name: Test-Driven Development Mandatory
  description: 'Tests MUST be written BEFORE implementation (RED → GREEN → REFACTOR).

    This prevents untested code from entering the codebase.

    '
  enforcement:
    trigger: code_change
    action: block_if_no_test_first
  validation:
  - Test file must exist before implementation file
  - Test must fail initially (RED phase)
  - Implementation makes test pass (GREEN phase)
  - REFACTOR phase removes code smells
  examples:
    pass:
    - test_feature.py created → RED → feature.py created → GREEN → REFACTOR
    fail:
    - feature.py created without test_feature.py
    - Test never fails (not actually testing anything)

- rule_id: PLAN_FILE_ORGANIZATION
  category: architecture_integrity
  severity: blocked
  name: Plan Files Must Live Within Plan Folder Structure
  description: 'ALL files related to epics, plans, features, and implementations MUST be housed within the plan folder structure in designated subfolders.

    Root-level file creation is DISCOURAGED unless absolutely necessary (e.g., core project files like README.md, requirements.txt).

    This prevents workspace clutter and maintains clear plan boundaries.

    '
  enforcement:
    trigger: file_creation
    action: block_if_root_level_plan_file
  validation:
  - Plan artifacts must be in plan_folder/artifacts/
  - Analysis documents must be in plan_folder/analysis/
  - Progress reports must be in plan_folder/reports/
  - Context documents must be in plan_folder/context/
  - Scripts must be in plan_folder/scripts/
  - Tracking data must be in plan_folder/tracking/
  - No plan-related files in workspace root
  - No plan-related files in cortex-brain root
  implementation:
    detector: src.orchestrators.middleware.governance.plan_file_validator.py
    hook: pre_file_creation
    priority: 5
  folder_structure:
    required_subfolders:
      - analysis/       # Analysis documents, gap reports, risk assessments
      - artifacts/      # Generated code, configs, templates
      - context/        # Discovery docs, architecture analysis, requirements
      - reports/        # Completion reports, progress summaries, metrics
      - scripts/        # Plan-specific utility scripts
      - tracking/       # Progress tracker, task registry, state files
      - phases/         # Phase-specific implementation plans (optional)
      - architecture/   # Architecture documents, specs, designs (optional)
    allowed_root_files:
      - epic-manifest.yaml         # Plan metadata and phase definitions
      - README.md                  # Quick start guide
      - CONTINUATION-PROMPT.md     # Auto-generated continuation instructions
      - plan-viewer.html           # Auto-generated progress viewer
      - launch-plan-viewer.sh      # Viewer launcher script
      - launch-plan-viewer.py      # Viewer launcher script
  examples:
    pass:
      - "cortex-brain/documents/planning/active/cortex5-snowball/analysis/GAP-ANALYSIS.md"
      - "cortex-brain/documents/planning/active/cortex5-snowball/reports/P01-COMPLETION-REPORT.md"
      - "cortex-brain/documents/planning/active/cortex5-snowball/artifacts/database-schema.sql"
      - "cortex-brain/documents/planning/active/cortex5-snowball/tracking/progress-tracker.json"
      - "cortex-brain/documents/planning/active/cortex5-snowball/epic-manifest.yaml"
    fail:
      - "cortex-brain/documents/planning/GAP-ANALYSIS.md (should be in plan_folder/analysis/)"
      - "cortex-brain/P01-COMPLETION-REPORT.md (should be in plan_folder/reports/)"
      - "database-schema.sql (should be in plan_folder/artifacts/)"
      - "cortex-brain/documents/analysis/cortex5-gap-report.md (should be in plan folder)"
  rationale: |
    Plan file organization prevents:
    1. Workspace clutter (root-level files scattered everywhere)
    2. Unclear plan boundaries (which files belong to which plan?)
    3. Merge conflicts (multiple plans creating same-named files)
    4. Cleanup difficulty (can't easily archive a plan)
    5. Discovery failures (can't find plan-related files)
    
    Benefits of plan folder structure:
    1. Self-contained plans (all artifacts in one place)
    2. Easy archival (mv plan_folder to archives/)
    3. Clear ownership (file path shows which plan it belongs to)
    4. Parallel development (multiple plans don't interfere)
    5. Holistic cleanup (delete plan folder = delete all plan files)

- rule_id: SCRIPT_ORGANIZATION_ENFORCEMENT
  category: architecture_integrity
  severity: blocked
  name: Script Consolidation & Cataloging Required
  description: 'ALL utility scripts MUST be properly organized via Cortex Toolkit Orchestrator with child orchestrators for cataloging.

    Multiple scripts doing the same functionality MUST be consolidated into unified modules.

    Script sprawl prevention is critical for maintainability and efficiency.

    '
  enforcement:
    trigger: script_creation
    action: block_if_uncataloged_or_duplicate
  validation:
  - Scripts must be cataloged by Cortex Toolkit Orchestrator
  - Duplicate functionality detection scanner must run
  - Similar scripts must be consolidated into single module
  - Orphaned scripts (unused) must be archived
  - Child orchestrators manage script organization per domain
  implementation:
    orchestrator: cortex_toolkit
    scanner: src.orchestrators.toolkit.duplicate_script_detector
    catalog: cortex-brain/toolkit/script-catalog.yaml
  examples:
    pass:
    - Planning scripts consolidated into planning_orchestrator_v5.py modules
    - Duplicate detectors merged into single duplicate_detector.py
    - Scripts registered in toolkit catalog with clear ownership
    fail:
    - 10+ *.py files in src/orchestrators/planning/ doing similar tasks
    - Multiple duplicate detection scripts (orphan_detector.py, duplicate_detector.py, similarity_checker.py)
    - Uncataloged scripts in random directories
  remediation:
    scan_command: python3 -m src.orchestrators.toolkit.scan_duplicate_scripts
    consolidate_command: python3 -m src.orchestrators.toolkit.consolidate_scripts --domain planning
    report: cortex-brain/documents/reports/script-consolidation-{timestamp}.md
  rationale: |
    Script organization prevents:
    1. Code duplication (multiple scripts doing same thing)
    2. Discovery failures (which script does what?)
    3. Maintenance burden (updating logic in 5 places)
    4. Import confusion (which module to import from?)
    5. Testing gaps (duplicate scripts = duplicate tests needed)
    
    Benefits of script consolidation:
    1. Single source of truth per functionality
    2. Easier maintenance (one place to update)
    3. Clear module boundaries
    4. Better test coverage
    5. Reduced codebase size

- rule_id: PYTHON_TYPE_HINTS_MANDATORY
  category: quality_gates
  severity: blocked
  name: Type Hints Required for All Functions/Methods
  description: 'ALL Python functions and methods MUST have complete type hints for parameters and return values.

    Type safety is CRITICAL for CORTEX because it generates and executes Python code autonomously.

    Missing type hints lead to runtime errors that could have been caught at static analysis time.

    '
  enforcement:
    trigger: code_change
    action: block_if_missing_type_hints
  validation:
  - All function parameters must have type hints (except self, cls)
  - All functions must have return type hints (use None if no return)
  - Complex types must use typing module (List, Dict, Optional, Union, etc.)
  - Class attributes must have type hints
  - No use of Any type without justification comment
  implementation:
    middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
    checker: mypy --strict
    hook: pre_file_save
    priority: 10
  knowledge_base:
    reference: cortex-brain/knowledge-library/standards/python-style-guide.md
    section: "Type Hints (PEP 484, 585, 604)"
  examples:
    pass:
    - "def execute(self, request: str, context: Dict[str, Any]) -> ExecutionResult:"
    - "def get_orchestrators(self) -> List[BaseOrchestrator]:"
    - "name: str  # Class attribute with type hint"
    fail:
    - "def execute(self, request, context):  # Missing type hints"
    - "def get_orchestrators():  # Missing return type"
    - "def process(data: Any) -> Any:  # Overuse of Any without justification"
  rationale: |
    Type hints prevent:
    1. Runtime type errors (wrong type passed to function)
    2. API misuse (calling function with wrong arguments)
    3. Refactoring errors (type changes not propagated)
    4. Integration failures (incompatible type expectations)
    5. Documentation gaps (types self-document the API)

- rule_id: PYTHON_DOCSTRINGS_MANDATORY
  category: quality_gates
  severity: blocked
  name: Docstrings Required for All Public APIs
  description: 'ALL public Python modules, classes, functions, and methods MUST have docstrings following Google style.

    Docstrings explain WHY code exists and HOW to use it, not WHAT it does (code explains that).

    '
  enforcement:
    trigger: code_change
    action: block_if_missing_docstrings
  validation:
  - All public modules must have module docstrings
  - All public classes must have class docstrings
  - All public functions/methods must have docstrings with Args/Returns/Raises
  - Private functions (starting with _) are exempt but encouraged
  - Docstrings must follow Google style format
  implementation:
    middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
    checker: pydocstyle --convention=google
    hook: pre_file_save
    priority: 11
  knowledge_base:
    reference: cortex-brain/knowledge-library/standards/python-style-guide.md
    section: "Docstrings (PEP 257 + Google Style)"
  examples:
    pass:
    - |
      def execute(self, request: str) -> ExecutionResult:
          """Execute orchestrator with given request.
          
          Args:
              request: User request to process
          
          Returns:
              ExecutionResult with status and artifacts
          
          Raises:
              OrchestratorValidationError: If validation fails
          """
    fail:
    - "def execute(self, request: str) -> ExecutionResult:  # No docstring"
    - |
      def execute(self, request: str) -> ExecutionResult:
          """Execute orchestrator"""  # Incomplete docstring (no Args/Returns)
  rationale: |
    Docstrings enable:
    1. Auto-generated API documentation
    2. IDE tooltips and autocomplete
    3. LLM-assisted code understanding
    4. Faster onboarding for new developers
    5. Contract-based development

- rule_id: PYTHON_ERROR_HANDLING_REQUIRED
  category: quality_gates
  severity: blocked
  name: Explicit Error Handling with Custom Exceptions
  description: 'ALL error conditions MUST be handled explicitly with custom exception classes.

    Bare except blocks and generic Exception catching are PROHIBITED.

    CORTEX must fail fast with clear error messages, not hide failures.

    '
  enforcement:
    trigger: code_change
    action: block_if_bare_except_or_generic_catch
  validation:
  - No bare except clauses (must specify exception type)
  - No catching generic Exception without re-raising
  - Custom exception classes for domain-specific errors
  - All exceptions must have descriptive messages
  - Error context must be preserved (use "from" for chaining)
  implementation:
    middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
    checker: pylint --disable=all --enable=bare-except,broad-except
    hook: pre_file_save
    priority: 12
  knowledge_base:
    reference: cortex-brain/knowledge-library/standards/python-style-guide.md
    section: "Error Handling"
  examples:
    pass:
    - |
      try:
          orchestrator = self.registry.get(orchestrator_id)
      except OrchestratorNotFoundError as e:
          raise ExecutionError(f"Cannot execute: {e}") from e
    - |
      class OrchestratorValidationError(CortexError):
          """Raised when orchestrator validation fails."""
    fail:
    - |
      try:
          orchestrator = self.registry.get(orchestrator_id)
      except:  # Bare except - blocks all errors including KeyboardInterrupt
          pass
    - |
      try:
          orchestrator = self.registry.get(orchestrator_id)
      except Exception:  # Too broad, hides specific errors
          return None
  rationale: |
    Explicit error handling:
    1. Fails fast (errors don't propagate silently)
    2. Provides clear error messages (debugging easier)
    3. Preserves error context (full stack trace)
    4. Enables error recovery (catch specific errors only)
    5. Prevents hiding critical errors (KeyboardInterrupt, SystemExit)

- rule_id: PYTHON_SOLID_PRINCIPLES_REQUIRED
  category: architecture_integrity
  severity: blocked
  name: SOLID Principles Enforcement
  description: 'ALL Python classes and modules MUST follow SOLID principles.

    Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion.

    This is CRITICAL for maintainability and extensibility of CORTEX orchestrators.

    '
  enforcement:
    trigger: code_change
    action: block_if_solid_violation
  validation:
  - Single Responsibility - Class has one reason to change
  - Open/Closed - Extend behavior via inheritance/composition, not modification
  - Liskov Substitution - Subclasses must be substitutable for base classes
  - Interface Segregation - Many specific interfaces > one general interface
  - Dependency Inversion - Depend on abstractions (protocols), not concrete classes
  implementation:
    middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
    analyzer: src.orchestrators.middleware.solid_analyzer.SOLIDAnalyzer
    hook: pre_file_save
    priority: 13
  knowledge_base:
    reference: cortex-brain/knowledge-library/design-patterns/solid-principles.md
    sections:
      - "Single Responsibility Principle (SRP)"
      - "Open/Closed Principle (OCP)"
      - "Liskov Substitution Principle (LSP)"
      - "Interface Segregation Principle (ISP)"
      - "Dependency Inversion Principle (DIP)"
  examples:
    pass:
    - "class OrchestratorRegistry:  # Single responsibility - registry only"
    - "class OrchestratorExecutor:  # Single responsibility - execution only"
    - |
      class BaseOrchestrator(Protocol):  # Dependency inversion - depend on protocol
          def execute(self, request: str) -> ExecutionResult: ...
    fail:
    - |
      class OrchestratorManager:  # Multiple responsibilities
          def register(self, orch): ...
          def execute(self, orch_id): ...
          def log_metrics(self, orch_id): ...
          def save_to_db(self, orch_id): ...
    - |
      def execute(self, executor: ConcreteExecutor):  # Depends on concrete class
          executor.run()
  rationale: |
    SOLID principles enable:
    1. Single Responsibility - Easy to understand and maintain
    2. Open/Closed - Extend without modifying existing code
    3. Liskov Substitution - Polymorphism works correctly
    4. Interface Segregation - Clients don't depend on unused methods
    5. Dependency Inversion - Loosely coupled, testable architecture

- rule_id: PYTHON_IMPORT_ORGANIZATION_REQUIRED
  category: quality_gates
  severity: warning
  name: Import Organization (PEP 8)
  description: 'ALL Python imports MUST be organized in 3 groups: stdlib, third-party, local.

    Each group separated by blank line, sorted alphabetically.

    This improves readability and prevents import conflicts.

    '
  enforcement:
    trigger: code_change
    action: auto_fix_with_isort
  validation:
  - Imports grouped in 3 sections (stdlib, third-party, local)
  - Each section sorted alphabetically
  - Blank line between sections
  - No wildcard imports (from x import *)
  - Absolute imports preferred over relative
  implementation:
    middleware: src.orchestrators.middleware.python_best_practices_validator.PythonBestPracticesValidator
    formatter: isort --profile=black
    hook: pre_file_save
    priority: 14
  knowledge_base:
    reference: cortex-brain/knowledge-library/standards/python-style-guide.md
    section: "Import Organization"
  examples:
    pass:
    - |
      import json
      from pathlib import Path
      
      import yaml
      
      from src.orchestrators.base import BaseOrchestrator
    fail:
    - |
      from src.orchestrators.base import BaseOrchestrator
      import json
      import yaml
      from pathlib import Path
  rationale: |
    Import organization:
    1. Easy to find imports (predictable location)
    2. Prevents circular imports (clear dependency hierarchy)
    3. Identifies external dependencies (third-party group)
    4. Improves git diffs (sorted imports = less conflicts)
    5. Standard across all Python projects

