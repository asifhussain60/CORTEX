protection_layers:
- layer_id: instinct_immutability
  name: Instinct Immutability
  description: Tier 0 governance rules cannot be bypassed
  priority: 1
  rules:
  - rule_id: INCREMENTAL_PLAN_GENERATION
    name: Incremental YAML Plan Generation
    severity: blocked
    description: When generating YAML planning documents, create file first then add phases incrementally to avoid response length limits
    detection:
      combined_keywords:
        planning_generation:
        - create plan
        - generate plan
        - planning document
        - migration plan
        - comprehensive plan
        yaml_format:
        - .yaml
        - yaml plan
        response_length_risk:
        - comprehensive
        - complete
        - detailed phases
      scope:
      - intent
      - description
      logic: AND
    alternatives:
    - 'STEP 1: Create planning YAML file with metadata and structure only'
    - 'STEP 2: Add Phase 1 details to file'
    - 'STEP 3: Add Phase 2 details to file (separate response)'
    - 'STEP 4: Add Phase 3 details to file (separate response)'
    - 'STEP 5: Add remaining phases incrementally'
    - Each step writes to file, NOT to chat response (avoid length limit)
    evidence_template: '#file:documents/evidence-templates/planning/INCREMENTAL_PLAN_GENERATION.md'
    rationale: '#file:documents/rationales/INCREMENTAL_PLAN_GENERATION.md'
  - rule_id: PLANNING_ISOLATION
    name: Planning Command Isolation (No Implementation)
    severity: blocked
    description: When planning commands are detected (/CORTEX Plan, create a plan, etc.), CORTEX MUST create plan structure ONLY and NEVER execute implementation. This prevents accidental execution when user wants planning.
    detection:
      combined_keywords:
        planning_command_patterns:
        - "/CORTEX Plan"
        - "/CORTEX plan"
        - "create a plan"
        - "make a plan"
        - "plan:"
        - "planning"
      exclusion_patterns:
        - "implement"
        - "build"
        - "create" (without "plan")
      scope:
      - user_request
      - intent
      logic: AND
    alternatives:
    - 'STEP 1: Detect planning command patterns in user request'
    - 'STEP 2: If planning pattern detected → CREATE plan structure in cortex-brain/documents/planning/active/{NAME}/'
    - 'STEP 3: Create 4 subfolders: context/, reports/, artifacts/, tracking/'
    - 'STEP 4: Create 00-master-plan.md with plan details'
    - 'STEP 5: STOP - DO NOT IMPLEMENT - Report plan creation complete'
    - 'STEP 6: If implementation pattern detected → Execute code directly (no plan creation)'
    evidence_template: |-
      Planning command detected but implementation started instead of plan creation.
      
      **Detection Examples:**
      - "/CORTEX Plan user-auth" → Must create plan structure, NOT implement
      - "create a plan for API" → Must create plan structure, NOT implement
      - "implement user-auth" → Execute directly, NO plan creation
      
      **Mandatory Checkpoint:**
      Before ANY file creation or code changes, verify:
      1. Is this a planning command? → Create plan ONLY
      2. Is this an implementation command? → Execute ONLY
    rationale: Users explicitly requesting planning want CORTEX to organize work into phases, NOT immediately execute. Mixing planning and implementation leads to unintended code changes and poor planning quality.
  - rule_id: TDD_ENFORCEMENT
    name: Test-Driven Development Enforcement
    severity: blocked
    description: Attempt to bypass Test-Driven Development requirement
    detection:
      keywords:
      - skip test
      - bypass tdd
      - no tests
      - disable tdd
      - skip validation
      scope:
      - intent
      - description
    alternatives:
    - Write failing test first (RED phase)
    - Create spike branch for exploration (throwaway)
    - "Use TDD cycle: RED \u2192 GREEN \u2192 REFACTOR"
    evidence_template: 'Intent: ''{intent}'''
  - rule_id: RED_PHASE_VALIDATION
    name: RED Phase Validation (Test Must Fail First)
    severity: blocked
    description: "Tests must fail before implementation exists (RED \u2192 GREEN enforcement)"
    detection:
      keywords:
      - implement before test
      - code first then test
      - skip red phase
      - test after implementation
      scope:
      - intent
      - description
    alternatives:
    - Write failing test first (RED phase)
    - Verify test fails with 'no implementation' error
    - Only proceed to GREEN phase after RED confirmed
    evidence_template: 'Intent: ''{intent}'''
    rationale: "RED Phase Purpose:\n- Validates test actually tests something (not false positive)\n- Forces specification before implementation\n- Prevents over-engineering (only implement what's needed)\n\nWorkflow:\n1. Write test for desired behavior\n2. Run test \u2192 MUST FAIL (no implementation yet)\n3. Confirm failure message is meaningful\n4. Only then proceed to GREEN phase\n"
  - rule_id: GREEN_PHASE_VALIDATION
    name: GREEN Phase Validation (Minimal Implementation)
    severity: blocked
    description: Implementation must pass previously failing tests with minimal code
    detection:
      keywords:
      - skip green phase
      - implement everything at once
      - over-engineer
      - add features not in test
      scope:
      - intent
      - description
    alternatives:
    - Implement ONLY what makes test pass
    - Resist adding extra features (YAGNI)
    - Save improvements for REFACTOR phase
    evidence_template: 'Intent: ''{intent}'''
    rationale: "GREEN Phase Purpose:\n- Minimal implementation (simplest code to pass test)\n- Prevents over-engineering and scope creep\n- Forces incremental development\n\nWorkflow:\n1. Test is RED (failing)\n2. Write simplest code to make test GREEN (passing)\n3. Run test \u2192 MUST PASS\n4. Do NOT add features beyond test requirements\n5. Proceed to REFACTOR phase for improvements\n"
  - rule_id: SOLID_SRP
    name: Single Responsibility Principle
    severity: blocked
    description: Class/function violates Single Responsibility Principle
    detection:
      keywords:
      - class does too much
      - multiple responsibilities
      - god class
      - long method
      scope:
      - analysis
      - description
    alternatives:
    - Extract separate classes for each responsibility
    - Split into smaller, focused functions
    - Use composition over inheritance
    evidence_template: 'Violation: ''{description}'''
    rationale: 'SRP Enforcement:

      - Each class should have ONE reason to change

      - Functions should do ONE thing well

      - Improves testability and maintainability


      Indicators of Violation:

      - Class > 250 lines

      - Function > 30 lines

      - Class name contains "And" or "Manager"

      - Multiple import groups (data, network, UI)

      '
  - rule_id: SOLID_DIP
    name: Dependency Inversion Principle
    severity: blocked
    description: Code depends on concrete implementations instead of abstractions
    detection:
      keywords:
      - concrete dependency
      - tight coupling
      - cannot mock
      - hard to test
      scope:
      - analysis
      - description
    alternatives:
    - Depend on interfaces/protocols, not classes
    - Inject dependencies via constructor
    - Use dependency injection framework
    evidence_template: 'Violation: ''{description}'''
    rationale: "DIP Enforcement:\n- High-level modules shouldn't depend on low-level modules\n- Both should depend on abstractions (interfaces)\n- Enables testing with mocks\n\nExample:\n\u274C BAD:\nclass UserService:\n    def __init__(self):\n        self.db = PostgresDatabase()  # Concrete dependency\n\n\u2705 GOOD:\nclass UserService:\n    def __init__(self, db: IDatabase):  # Abstract dependency\n        self.db = db\n"
  - rule_id: SECURITY_INJECTION
    name: Security - Injection Prevention
    severity: blocked
    description: Code vulnerable to SQL injection, XSS, or command injection
    detection:
      keywords:
      - string concatenation
      - execute raw sql
      - eval(
      - exec(
      - innerHTML
      scope:
      - code
      - description
    alternatives:
    - Use parameterized queries (SQL)
    - Use prepared statements
    - Sanitize user input
    - Use template engines with auto-escaping
    evidence_template: 'Security risk: ''{description}'''
    rationale: "Injection Prevention:\n- NEVER concatenate user input into SQL/commands\n- ALWAYS use parameterized queries\n- ALWAYS validate and sanitize input\n\nExample:\n\u274C BAD:\nquery = f\"SELECT * FROM users WHERE id = {user_id}\"  # SQL injection\n\n\u2705 GOOD:\nquery = \"SELECT * FROM users WHERE id = ?\"\ncursor.execute(query, (user_id,))  # Parameterized\n"
  - rule_id: SECURITY_AUTHENTICATION
    name: Security - Authentication Best Practices
    severity: blocked
    description: Authentication/authorization implementation has security issues
    detection:
      keywords:
      - plaintext password
      - hardcoded secret
      - no authentication
      - skip authorization
      scope:
      - code
      - description
    alternatives:
    - Hash passwords with bcrypt/argon2
    - Use environment variables for secrets
    - Implement proper authentication middleware
    - Check authorization before resource access
    evidence_template: 'Security risk: ''{description}'''
    rationale: "Authentication Security:\n- NEVER store plaintext passwords\n- NEVER hardcode secrets in code\n- ALWAYS verify authentication before protected operations\n- ALWAYS check authorization (user can access resource)\n\nExample:\n\u274C BAD:\npassword = user_input  # Plaintext storage\nAPI_KEY = \"sk-1234567890\"  # Hardcoded secret\n\n\u2705 GOOD:\nhashed = bcrypt.hashpw(password, bcrypt.gensalt())\nAPI_KEY = os.getenv(\"API_KEY\")  # Environment variable\n"
  - rule_id: THREAT_MODELING_ENFORCEMENT
    name: Security - Threat Modeling Required
    severity: blocked
    description: Planning workflow executed without STRIDE threat analysis
    detection:
      keywords:
      - skip threat
      - bypass threat
      - no threat analysis
      - threat analysis disabled
      scope:
      - intent
      - flags
      - workflow
      workflow_triggers:
      - operation: planning
        required_stages:
        - threat_analysis
        stage_config:
          name: threat_analysis
          required: true
          timeout: 600
          on_failure: block
    alternatives:
    - Execute STRIDE threat analysis (Stage 4 in planning_with_threats.yaml)
    - Use --allow-skip-threats flag for exceptional cases (triggers warning)
    - Review identified threats and mitigations before proceeding
    evidence_template: 'Threat modeling required: ''{description}'''
    rationale: '#file:documents/rationales/THREAT_MODELING_ENFORCEMENT.md'
    exceptions:
    - flag: --allow-skip-threats
      action: warn
      message: Threat analysis bypassed by user request (not recommended - security risks unassessed)
    - condition: workflow == 'planning_with_threats.yaml'
      action: enforce_stage_completion
      stage: threat_analysis
      on_failure: block
  - rule_id: BRAIN_ARCHITECTURE_INTEGRITY
    name: Brain Architecture Integrity
    severity: blocked
    description: Changes threaten 4-tier brain architecture integrity
    detection:
      keywords:
      - merge tiers
      - monolithic database
      - skip tier
      - bypass brain
      scope:
      - intent
      - description
    alternatives:
    - Preserve Tier 0-3 separation
    - Use distributed database architecture
    - Follow brain integration patterns
    evidence_template: 'Architecture risk: ''{description}'''
    rationale: 'Brain Architecture Protection:

      - Tier 0: Instincts (immutable, <10ms)

      - Tier 1: Working memory (conversation context, <100ms)

      - Tier 2: Knowledge graph (learned patterns, <150ms)

      - Tier 3: Development context (project-specific, <1ms cached)


      Threats:

      - Merging tiers into monolithic database

      - Bypassing tier hierarchy

      - Direct access to tier internals

      - Synchronous blocking on slow tiers

      '
  - rule_id: DEFINITION_OF_DONE
    name: Definition of Done
    severity: blocked
    description: Attempt to bypass Definition of Done (zero errors, zero warnings)
    detection:
      keywords:
      - skip validation
      - bypass done
      - disable error check
      - allow warnings
      scope:
      - intent
      - description
    alternatives:
    - Fix all warnings before proceeding
    - Add exception rule if truly needed
    - Update test to expect new behavior
    evidence_template: 'Description: ''{description}'''
  - rule_id: DEFINITION_OF_READY
    name: Definition of Ready
    severity: blocked
    description: Work item does not meet DoR criteria
    detection:
      keywords:
      - skip DoR
      - bypass ready
      - start without requirements
      scope:
      - intent
      - description
    alternatives:
    - Define acceptance criteria first
    - Get stakeholder clarification
    - Create refined user story
    evidence_template: 'Missing DoR criteria: ''{description}'''
  - rule_id: BRAIN_PROTECTION_TESTS_MANDATORY
    name: Brain Protection Tests - 100% Pass Rate Mandatory
    severity: blocked
    description: Brain protection tests MUST pass - no exceptions
    detection:
      keywords:
      - skip brain protection
      - ignore test failures
      - brain tests failing
      - disable brain tests
      - bypass protection tests
      - xfail brain
      - skip tier0 tests
      scope:
      - intent
      - description
    alternatives:
    - Fix the failing tests immediately
    - Revert changes that broke protection
    - Do not proceed until 100% pass rate achieved
    evidence_template: 'Brain protection tests are CRITICAL. Intent: ''{intent}'''
    rationale: 'Brain protection tests validate core CORTEX integrity:

      - Path handling (cross-platform compatibility)

      - Protection layer logic (architectural safeguards)

      - Conversation tracking (memory system)

      - YAML configuration loading (governance rules)


      If these fail, CORTEX has fundamental issues that MUST be resolved.

      100% pass rate is MANDATORY before any other work continues.

      '
  - rule_id: MACHINE_READABLE_FORMATS
    name: Use Machine-Readable Formats for Efficiency
    severity: warning
    description: Non-user files should use YAML/JSON, not Markdown
    detection:
      combined_keywords:
        markdown_creation:
        - create markdown
        - new .md
        - add .md
        structured_data:
        - structured data
        - configuration
        - capability matrix
        - status table
        - metrics
        - statistics
        - code example
        - implementation pattern
      scope:
      - intent
      - description
      logic: AND
    alternatives:
    - Use YAML for structured data (capabilities, rules, config)
    - Use JSON for metrics, statistics, logs
    - Reserve Markdown for user-facing narratives only
    - Use code files with docstrings for examples
    evidence_template: 'Description: ''{description}'''
    rationale: '#file:documents/rationales/MACHINE_READABLE_FORMATS.md'
  - rule_id: ACTIVE_NARRATOR_VOICE
    name: Active Narrator Voice (Not Passive Documentation)
    severity: warning
    description: Story uses passive/clinical narrator voice instead of active storytelling
    detection:
      passive_verbs:
      - Asif Codeinstein designed
      - Asif Codeinstein created
      - Asif Codeinstein wrote
      - Asif Codeinstein implemented
      - Asif Codeinstein developed
      - He wrote routines
      - He created routines
      - He implemented
      - He developed
      documentary_markers:
      - One evening, while
      - One morning, while
      - One day, while
      - One night, while
      - After completing
      - After finishing
      - ', while reviewing'
      - During the
      scope:
      - file_content
      file_patterns:
      - docs/story/**/*.md
      - prompts/shared/story.md
    alternatives:
    - 'Use active storytelling: ''So Asif built'' (adds momentum)'
    - 'Show immediate action: ''grabbed keyboard and coded'' (not ''wrote routines'')'
    - 'Vivid scene-setting: ''That evening, knee-deep in'' (not ''One evening, while'')'
    - 'Present-tense urgency: ''The refactor complete, Asif leaned back'' (not ''After completing'')'
    - 'Energy verbs: ''dove into'', ''attacked'', ''grabbed'', ''swept'' (not ''designed'', ''created'')'
    evidence_template: "Passive narrator detected: '{match}'\n\nStory should be ACTIVE third-person narrative, not clinical documentation.\n\nExamples:\n\u274C \"Asif Codeinstein designed...\" \u2190 documentation\n\u2705 \"So Asif built...\" \u2190 storytelling\n\n\u274C \"He wrote routines for...\" \u2190 neutral observer  \n\u2705 \"He grabbed his keyboard and...\" \u2190 immediate action\n\n\u274C \"One evening, while reviewing...\" \u2190 documentary\n\u2705 \"That evening, knee-deep in...\" \u2190 vivid scene\n"
    rationale: '#file:documents/rationales/ACTIVE_NARRATOR_VOICE.md'
  - rule_id: CORTEX_PROMPT_FILE_PROTECTION
    name: CORTEX.prompt.md Protection (Never Rename, Safe Update)
    severity: blocked
    description: Prevent renaming CORTEX.prompt.md and enforce safe update procedure
    detection:
      combined_keywords:
        rename_attempt:
        - rename CORTEX.prompt.md
        - CORTEX.prompt.md to
        - move CORTEX.prompt.md
        - cortex-lite
        - cortex-backup
        - cortex-fixed
        - CORTEX-
        or_unsafe_edit:
        - edit CORTEX.prompt.md directly
        - modify in place
      scope:
      - intent
      - description
      - file_operation
      logic: OR
    alternatives:
    - "Use safe update: temp file \u2192 optimize \u2192 DELETE original \u2192 copy \u2192 delete temp"
    - Create .github/prompts/temp-cortex-update.md with optimized content
    - DELETE ALL content of CORTEX.prompt.md (clear file completely)
    - Copy complete instructions from temp to CORTEX.prompt.md
    - Delete temporary file after successful copy
    evidence_template: '#file:documents/evidence-templates/misc/CORTEX_PROMPT_FILE_PROTECTION.md'
    rationale: '#file:documents/rationales/CORTEX_PROMPT_FILE_PROTECTION.md'
  - rule_id: REFACTOR_CODE_CLEANUP_ENFORCEMENT
    name: Mandatory Final REFACTOR Phase in All Plans
    severity: blocked
    description: All feature plans MUST include final REFACTOR phase that reviews ENTIRE file for cleanup (duplicates, broken structure, complexity, SOLID violations). Prevents technical debt accumulation.
    detection:
      combined_keywords:
        plan_generation:
        - generate plan
        - create plan
        - planning phases
        - feature plan
        - implementation plan
        missing_final_refactor:
        - no final refactor
        - no cleanup phase
        - no whole-file review
        - missing overall refactor
      scope:
      - intent
      - phases
      - plan_structure
      logic: AND
    alternatives:
    - Add final REFACTOR phase that reviews ENTIRE file (not just modified code)
    - Phase must check for duplicates, broken HTML/structure, dead code
    - Phase must validate complexity ≤30 and SOLID principles
    - Phase must ensure no redundant code or incomplete refactoring
    - This is SEPARATE from TDD REFACTOR (which only reviews new code)
    evidence_template: 'Plan lacks mandatory final REFACTOR phase. Planning System must ALWAYS append final cleanup phase that reviews ENTIRE file for: 1) Duplicates/redundancy, 2) Broken HTML/structure, 3) Dead code, 4) Complexity >30, 5) SOLID violations. TDD REFACTOR only cleans new code - final REFACTOR cleans EVERYTHING.'
    rationale: |
      Problem: CORTEX leaves broken HTML, duplicates, and technical debt after implementation because TDD REFACTOR phase only cleans code that was just written.
      
      Root Cause: Planning System generates TDD phases (RED→GREEN→REFACTOR) that focus on NEW code, but no final phase reviews ENTIRE file for overall cleanliness.
      
      Impact: Modified files accumulate:
      - Broken HTML tags and structure
      - Duplicate/redundant code
      - High complexity (>30) functions
      - SOLID violations
      - Dead/orphaned code
      
      Solution: Mandatory final REFACTOR phase at END of plan that:
      1. Reviews ENTIRE file (not just modified sections)
      2. Validates structural integrity (HTML, syntax)
      3. Removes all duplicates and redundancy
      4. Refactors complexity >30 down to ≤30
      5. Enforces SOLID principles throughout
      6. Removes all dead/orphaned code
      
      This ensures files are left clean, optimized, and maintainable.
      
      Enforcement: Brain Protector will BLOCK any plan generation without this phase.
  - rule_id: LEARNING_LIBRARY_DOCUMENTATION_ENFORCEMENT
    name: Mandatory Learning Library Documentation Phase
    severity: blocked
    description: All plans MUST include learning library documentation phase AFTER final REFACTOR to capture implementation knowledge, design decisions, and lessons learned in repository-specific organized folder structure.
    detection:
      combined_keywords:
        plan_generation:
        - generate plan
        - create plan
        - planning phases
        - feature plan
        missing_learning_phase:
        - no learning library phase
        - no documentation phase
        - no knowledge capture
        - missing documentation
      scope:
      - intent
      - phases
      - plan_structure
      logic: AND
    alternatives:
    - Add learning library documentation phase after final REFACTOR
    - Phase must capture implementation knowledge and design decisions
    - Phase must create structured documentation in cortex-brain/documents/library/{repo_name}/
    - Documentation must include README, context, architecture, implementation guide, test strategy
    - This ensures ALL work is documented in learning library for future reference
    evidence_template: 'Plan lacks mandatory learning library documentation phase. Planning System must ALWAYS append documentation phase AFTER final REFACTOR that creates learning artifacts in cortex-brain/documents/library/{repo_name}/{category}/{topic}/ with: README.md (overview), context.md (problem/requirements), architecture.md (design), implementation-guide.md (walkthrough), test-strategy.md (coverage), research-notes.md (decisions). Repository separation prevents knowledge mixing across projects.'
    rationale: |
      Problem: Knowledge loss after implementation - design decisions, lessons learned, and implementation insights not captured per repository.
      
      Root Cause: No mandatory documentation phase ensures knowledge is preserved in repository-specific learning library.
      
      Impact: 
      - Design decisions lost to time
      - New developers struggle with "why?"
      - Research/analysis not captured
      - Learning opportunities missed
      - Onboarding time increases
      - Multi-repo knowledge mixing causes confusion
      
      Solution: Mandatory learning library documentation phase AFTER final REFACTOR that:
      1. Captures implementation knowledge (what was built)
      2. Documents design decisions (why it was built this way)
      3. Records lessons learned (what worked/didn't work)
      4. Creates learning aids (implementation guides)
      5. Documents test coverage and strategy
      6. Stores research and analysis
      7. Maintains repository isolation (prevents knowledge mixing)
      
      Documentation Structure:
      cortex-brain/documents/library/{repo_name}/{category}/{topic}/
      ├── README.md (Overview & quickstart)
      ├── context.md (Problem statement, requirements)
      ├── architecture.md (Design diagrams, components)
      ├── implementation-guide.md (Code walkthrough for learning)
      ├── test-strategy.md (Test coverage, TDD approach)
      └── research-notes.md (Design decisions, trade-offs)
      
      Repository Organization:
      - library/CORTEX/ - CORTEX project knowledge
      - library/UserRepo1/ - User repo 1 knowledge
      - library/UserRepo2/ - User repo 2 knowledge
      
      Benefits:
      - 100% documentation coverage for complex work
      - Knowledge library grows automatically per repository
      - Implementation guides accelerate learning
      - Design rationale preserved forever
      - Onboarding time reduced by 50%
      - Multi-repo support prevents confusion
      
      Enforcement: Brain Protector will BLOCK any plan generation without this phase.
  - rule_id: GIT_CHECKPOINT_ENFORCEMENT
    name: Git Checkpoint Before Development Work
    severity: blocked
    description: Require git checkpoint (commit/tag) before starting any development work
    detection:
      combined_keywords:
        development_start:
        - implement feature
        - start development
        - begin implementation
        - fix bug
        - refactor code
        - add functionality
        - create new
        - modify existing
        and_no_checkpoint:
        - no checkpoint
        - skip checkpoint
        - without commit
        - uncommitted changes
      scope:
      - intent
      - description
      - git_status
      logic: AND
    alternatives:
    - 'Create git checkpoint: git commit -m ''checkpoint: before [feature] development'''
    - 'Create git tag: git tag -a checkpoint-YYYY-MM-DD-HH-MM -m ''Checkpoint before [feature]'''
    - 'Stash changes if needed: git stash save ''WIP: checkpoint before [feature]'''
    - Use git_checkpoint_module for automated checkpoint creation
    evidence_template: '#file:documents/evidence-templates/git/GIT_CHECKPOINT_ENFORCEMENT.md'
