schema_version: '5.0'
categories:
- development_workflow
- architecture_integrity
- quality_gates
- orchestration_lifecycle
- security_privacy
- portability
rules:
- rule_id: PATH_PORTABILITY
  category: portability
  severity: blocked
  name: Portable Path Resolution Required
  description: 'NEVER use hardcoded absolute paths. ALWAYS use relative paths or dynamic detection.

    CORTEX must work across different installations (Windows, macOS, Linux) with different install locations.

    '
  enforcement:
    trigger: code_change
    action: block_if_hardcoded_path
  validation:
  - No hardcoded paths like /Users/username/... or C:\Users\...
  - Use src.utils.project_root.get_project_root() for dynamic detection
  - Use Path(__file__).resolve() for relative resolution
  - Config files use relative paths only
  implementation:
    utility: src.utils.project_root
    pattern: get_project_root()
  examples:
    pass:
    - from src.utils.project_root import get_project_root; root = get_project_root()
    - Path(__file__).parent.parent / "cortex-brain"
    - project_root / "scripts" / "utilities"
    fail:
    - workspace = "/Users/asifhussain/PROJECTS/CORTEX"
    - docs_dir = Path("/Users/asifhussain/PROJECTS/CORTEX/docs")
    - C:\Users\username\CORTEX\brain
- rule_id: SETUP_VERIFICATION
  category: orchestration_lifecycle
  severity: blocked
  name: 'Phase -2: Setup Verification Mandatory'
  description: 'ALL orchestrators MUST run Phase -2 setup verification before execution.

    This prevents false positives and ensures dependencies are ACTUALLY complete.

    '
  enforcement:
    trigger: orchestrator_execution_start
    action: block_if_verification_fails
  validation:
  - Dependencies must pass implementation tests (not just file existence)
  - False positive detection must run
  - VSCode cache state must be checked
  - Governance compliance must be validated
  implementation:
    middleware: src.orchestrators.middleware.setup_verification.SetupVerifier
    hook: pre_execution
    priority: 1
  examples:
    pass:
    - C50-03 verifies C50-00C tests ACTUALLY pass (pytest execution)
    - Planning v5 detects broken dependency file (import test fails)
    fail:
    - Orchestrator starts without running SetupVerifier
    - Dependency file exists but broken (false positive not detected)
- rule_id: TEARDOWN_REFACTOR
  category: orchestration_lifecycle
  severity: blocked
  name: 'Phase N+1: Teardown + REFACTOR + Commit Mandatory'
  description: 'ALL orchestrators MUST run Phase N+1 teardown after execution.

    This ensures code cleanup and atomic git commits follow /cortex-git-commit pattern.

    '
  enforcement:
    trigger: orchestrator_execution_complete
    action: block_if_refactor_fails
  validation:
  - Whole-file REFACTOR must run (remove unused imports, orphaned code)
  - All modified files must be refactored
  - Git commit must follow /cortex-git-commit pattern
  - Commit message must include orchestrator name + phase summary
  implementation:
    middleware: src.orchestrators.middleware.teardown_refactor.TeardownRefactor
    hook: post_execution
    priority: 30
  examples:
    pass:
    - Orchestrator completes → REFACTOR runs → Git commit with Co-authored-by
    - 5 files modified → All refactored → Atomic commit
    fail:
    - Orchestrator completes but no REFACTOR cycle
    - Git commit without /cortex-git-commit pattern
- rule_id: TDD_ENFORCEMENT
  category: development_workflow
  severity: blocked
  name: Test-Driven Development Mandatory
  description: 'Tests MUST be written BEFORE implementation (RED → GREEN → REFACTOR).

    This prevents untested code from entering the codebase.

    '
  enforcement:
    trigger: code_change
    action: block_if_no_test_first
  validation:
  - Test file must exist before implementation file
  - Test must fail initially (RED phase)
  - Implementation makes test pass (GREEN phase)
  - REFACTOR phase removes code smells
  examples:
    pass:
    - test_feature.py created → RED → feature.py created → GREEN → REFACTOR
    fail:
    - feature.py created without test_feature.py
    - Test never fails (not actually testing anything)

- rule_id: PLAN_FILE_ORGANIZATION
  category: architecture_integrity
  severity: blocked
  name: Plan Files Must Live Within Plan Folder Structure
  description: 'ALL files related to epics, plans, features, and implementations MUST be housed within the plan folder structure in designated subfolders.

    Root-level file creation is DISCOURAGED unless absolutely necessary (e.g., core project files like README.md, requirements.txt).

    This prevents workspace clutter and maintains clear plan boundaries.

    '
  enforcement:
    trigger: file_creation
    action: block_if_root_level_plan_file
  validation:
  - Plan artifacts must be in plan_folder/artifacts/
  - Analysis documents must be in plan_folder/analysis/
  - Progress reports must be in plan_folder/reports/
  - Context documents must be in plan_folder/context/
  - Scripts must be in plan_folder/scripts/
  - Tracking data must be in plan_folder/tracking/
  - No plan-related files in workspace root
  - No plan-related files in cortex-brain root
  implementation:
    detector: src.orchestrators.middleware.governance.plan_file_validator.py
    hook: pre_file_creation
    priority: 5
  folder_structure:
    required_subfolders:
      - analysis/       # Analysis documents, gap reports, risk assessments
      - artifacts/      # Generated code, configs, templates
      - context/        # Discovery docs, architecture analysis, requirements
      - reports/        # Completion reports, progress summaries, metrics
      - scripts/        # Plan-specific utility scripts
      - tracking/       # Progress tracker, task registry, state files
      - phases/         # Phase-specific implementation plans (optional)
      - architecture/   # Architecture documents, specs, designs (optional)
    allowed_root_files:
      - epic-manifest.yaml         # Plan metadata and phase definitions
      - README.md                  # Quick start guide
      - CONTINUATION-PROMPT.md     # Auto-generated continuation instructions
      - plan-viewer.html           # Auto-generated progress viewer
      - launch-plan-viewer.sh      # Viewer launcher script
      - launch-plan-viewer.py      # Viewer launcher script
  examples:
    pass:
      - "cortex-brain/documents/planning/active/cortex5-snowball/analysis/GAP-ANALYSIS.md"
      - "cortex-brain/documents/planning/active/cortex5-snowball/reports/P01-COMPLETION-REPORT.md"
      - "cortex-brain/documents/planning/active/cortex5-snowball/artifacts/database-schema.sql"
      - "cortex-brain/documents/planning/active/cortex5-snowball/tracking/progress-tracker.json"
      - "cortex-brain/documents/planning/active/cortex5-snowball/epic-manifest.yaml"
    fail:
      - "cortex-brain/documents/planning/GAP-ANALYSIS.md (should be in plan_folder/analysis/)"
      - "cortex-brain/P01-COMPLETION-REPORT.md (should be in plan_folder/reports/)"
      - "database-schema.sql (should be in plan_folder/artifacts/)"
      - "cortex-brain/documents/analysis/cortex5-gap-report.md (should be in plan folder)"
  rationale: |
    Plan file organization prevents:
    1. Workspace clutter (root-level files scattered everywhere)
    2. Unclear plan boundaries (which files belong to which plan?)
    3. Merge conflicts (multiple plans creating same-named files)
    4. Cleanup difficulty (can't easily archive a plan)
    5. Discovery failures (can't find plan-related files)
    
    Benefits of plan folder structure:
    1. Self-contained plans (all artifacts in one place)
    2. Easy archival (mv plan_folder to archives/)
    3. Clear ownership (file path shows which plan it belongs to)
    4. Parallel development (multiple plans don't interfere)
    5. Holistic cleanup (delete plan folder = delete all plan files)

- rule_id: SCRIPT_ORGANIZATION_ENFORCEMENT
  category: architecture_integrity
  severity: blocked
  name: Script Consolidation & Cataloging Required
  description: 'ALL utility scripts MUST be properly organized via Cortex Toolkit Orchestrator with child orchestrators for cataloging.

    Multiple scripts doing the same functionality MUST be consolidated into unified modules.

    Script sprawl prevention is critical for maintainability and efficiency.

    '
  enforcement:
    trigger: script_creation
    action: block_if_uncataloged_or_duplicate
  validation:
  - Scripts must be cataloged by Cortex Toolkit Orchestrator
  - Duplicate functionality detection scanner must run
  - Similar scripts must be consolidated into single module
  - Orphaned scripts (unused) must be archived
  - Child orchestrators manage script organization per domain
  implementation:
    orchestrator: cortex_toolkit
    scanner: src.orchestrators.toolkit.duplicate_script_detector
    catalog: cortex-brain/toolkit/script-catalog.yaml
  examples:
    pass:
    - Planning scripts consolidated into planning_orchestrator_v5.py modules
    - Duplicate detectors merged into single duplicate_detector.py
    - Scripts registered in toolkit catalog with clear ownership
    fail:
    - 10+ *.py files in src/orchestrators/planning/ doing similar tasks
    - Multiple duplicate detection scripts (orphan_detector.py, duplicate_detector.py, similarity_checker.py)
    - Uncataloged scripts in random directories
  remediation:
    scan_command: python3 -m src.orchestrators.toolkit.scan_duplicate_scripts
    consolidate_command: python3 -m src.orchestrators.toolkit.consolidate_scripts --domain planning
    report: cortex-brain/documents/reports/script-consolidation-{timestamp}.md
  rationale: |
    Script organization prevents:
    1. Code duplication (multiple scripts doing same thing)
    2. Discovery failures (which script does what?)
    3. Maintenance burden (updating logic in 5 places)
    4. Import confusion (which module to import from?)
    5. Testing gaps (duplicate scripts = duplicate tests needed)
    
    Benefits of script consolidation:
    1. Single source of truth per functionality
    2. Easier maintenance (one place to update)
    3. Clear module boundaries
    4. Better test coverage
    5. Reduced codebase size

governance:
  enforcement_level: strict
  override_allowed: false
  audit_logging:
    enabled: true
    log_path: tracking/governance-audit.jsonl
    track_violations: true
    track_overrides: false
