challenge_template: "\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\U0001F9E0 BRAIN PROTECTION CHALLENGE\n\nTimestamp: {timestamp}\nSeverity: {severity}\nDecision: {decision}\n\n{message}\n\nSAFE ALTERNATIVES:\n{alternatives}\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nOptions:\n  1. Accept recommended alternative (SAFE)\n  2. Provide different approach (REVIEW)\n  3. Type 'OVERRIDE' with justification (RISKY)\n\nYour choice:\n\n# Layer 10: Implementation Velocity Protection (Anti-Inefficiency Patterns)\n# Based on\
  \ Phase 0 conversation analysis - prevent time waste patterns that caused 3x development time\nlayer_10_efficiency_protection:\n  layer_name: \"Implementation Velocity Protection\"\n  description: \"Prevent inefficiency patterns that waste development time\"\n  scope: \"implementation_approach\"\n  \n  rules:\n    - rule_id: \"EFFICIENCY_REALITY_CHECK_FIRST\"\n      name: \"Reality Check Before Documentation Trust (Anti-Pattern #1)\"\n      severity: \"warning\"\n      description: \"Prevent trusting status documents without verifying current reality\"\n      \n      detection:\n        keywords:\n          - \"according to documentation\"\n          - \"status document says\" \n          - \"documented as complete\"\n          - \"based on the specs\"\n        scope: [\"intent\", \"description\", \"approach\"]\n      \n      acceleration_pattern: \"Check current reality \u2192 Update understanding \u2192 Take action\"\n      time_saved_per_instance: \"10-15 minutes of incorrect baseline\"\
  \n      \n      alternatives:\n        - \"Check actual current state first\"\n        - \"Verify implementation reality before planning\"\n        - \"Update documentation after reality check\"\n      \n      evidence_template: \"Documentation trust pattern: '{description}'\"\n    \n    - rule_id: \"EFFICIENCY_BATCH_FIXES_OVER_MICRO_CYCLES\"\n      name: \"Batch Operations Over Micro-Cycles (Anti-Pattern #2)\"\n      severity: \"warning\"\n      description: \"Prevent inefficient micro-cycles of fix\u2192test\u2192fix\u2192test\"\n      \n      detection:\n        keywords:\n          - \"fix one test\"\n          - \"run full suite\"\n          - \"individual test fix\"\n          - \"micro-optimization\"\n        scope: [\"intent\", \"description\", \"approach\"]\n      \n      acceleration_pattern: \"Group related operations \u2192 Execute batch \u2192 Verify once\"\n      time_saved_per_instance: \"30-60 seconds per micro-cycle overhead\"\n      \n      alternatives:\n        - \"\
  Fix all integration tests \u2192 Run integration suite\"\n        - \"Fix all template tests \u2192 Run template suite\"\n        - \"Batch related fixes by category\"\n      \n      evidence_template: \"Micro-cycle pattern detected: '{intent}'\"\n    \n    - rule_id: \"EFFICIENCY_ROOT_CAUSE_BEFORE_SYMPTOMS\"\n      name: \"Systematic Debugging (Anti-Pattern #3)\"\n      severity: \"warning\"\n      description: \"Prevent symptom-chasing when root cause analysis would be faster\"\n      \n      detection:\n        keywords:\n          - \"debug individual\"\n          - \"investigate symptoms\"\n          - \"try different approach\"\n          - \"troubleshoot each\"\n        scope: [\"intent\", \"description\", \"approach\"]\n      \n      acceleration_pattern: \"Check fundamental assumptions \u2192 Fix root cause \u2192 Validate fix\"\n      time_saved_per_instance: \"15-45 minutes of symptom investigation\"\n      \n      systematic_checks:\n        - \"UTC vs local time assumptions\"\
  \n        - \"Schema/column name mismatches\"  \n        - \"Relative vs absolute imports\"\n        - \"Test expectations vs implementation reality\"\n      \n      alternatives:\n        - \"Check UTC timestamp handling first\"\n        - \"Verify schema consistency first\"\n        - \"Validate fundamental assumptions first\"\n      \n      evidence_template: \"Symptom debugging pattern: '{description}'\"\n    \n    - rule_id: \"EFFICIENCY_EXISTING_TOOLS_DURING_CRISIS\"\n      name: \"Use Existing Tools During Active Work (Anti-Pattern #4)\"\n      severity: \"warning\"\n      description: \"Prevent creating debug tools during active troubleshooting\"\n      \n      detection:\n        keywords:\n          - \"create debug script\"\n          - \"write tool to\"\n          - \"build utility for\"\n          - \"make script to analyze\"\n        context_indicators:\n          - \"failing tests\"\n          - \"active debugging\"\n          - \"urgent fix\"\n        scope: [\"intent\"\
  , \"description\", \"approach\"]\n      \n      acceleration_pattern: \"Use existing methods \u2192 Create tools for future use only\"\n      time_saved_per_instance: \"5-10 minutes per debug tool creation\"\n      \n      alternatives:\n        - \"Use existing debugging methods for now\"\n        - \"Create optimization tools after crisis resolved\"\n        - \"Focus on immediate problem resolution\"\n      \n      evidence_template: \"Tool creation during crisis: '{intent}'\"\n    \n    - rule_id: \"EFFICIENCY_ACTION_OVER_EXCESSIVE_SEARCH\"\n      name: \"Direct Action Over Search-Driven Development (Anti-Pattern #5)\"\n      severity: \"warning\"\n      description: \"Prevent excessive searching when direct action would be faster\"\n      \n      detection:\n        keywords:\n          - \"search for existing\"\n          - \"look for similar\"\n          - \"find reference implementation\"\n          - \"research how others\"\n        threshold_indicators:\n          - \"simple\
  \ implementation request\"\n          - \"straightforward task\"\n          - \"basic functionality\"\n        scope: [\"intent\", \"description\", \"approach\"]\n      \n      acceleration_pattern: \"Check if X exists \u2192 Create X if not \u2192 No extended search required\"\n      time_saved_per_instance: \"5-10 minutes per search session\"\n      \n      alternatives:\n        - \"Implement directly if task is clear\"\n        - \"Search only for complex architectural decisions\"\n        - \"Use existing patterns for simple tasks\"\n      \n      evidence_template: \"Excessive search pattern: '{intent}'\"\n\n# Layer 7: Deployment Architecture Protection\n- layer_id: \"deployment_architecture\"\n  name: \"Deployment Architecture Protection\"\n  description: \"Enforce upgrade/setup separation and brain preservation during deployments\"\n  priority: 7\n  \n  rules:\n    - rule_id: \"DEPLOYMENT_VERSION_TRACKING\"\n      name: \"Version Tracking File Required\"\n      severity: \"blocked\"\
  \n      description: \".cortex-version file MUST exist in all CORTEX deployments for upgrade detection\"\n      \n      detection:\n        combined_keywords:\n          deployment_operation:\n            - \"deploy cortex\"\n            - \"install cortex\"\n            - \"setup cortex\"\n            - \"build package\"\n          missing_version:\n            - \"no .cortex-version\"\n            - \"version file missing\"\n            - \"cannot detect version\"\n        scope: [\"operation\", \"validation\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"Create .cortex-version file with version metadata\"\n        - \"Include version in all publish packages\"\n        - \"Validate version file presence in setup/upgrade workflows\"\n      \n      evidence_template: |\n        Deployment without version tracking detected!\n        \n        Operation: '{operation}'\n        \n        CRITICAL: .cortex-version file is MANDATORY for:\n        - Upgrade detection (setup\
  \ vs upgrade)\n        - Schema migration tracking\n        - Rollback capability\n        - Version compatibility checks\n        \n        Required file structure:\n        ```json\n        {\n          \"cortex_version\": \"5.2.0\",\n          \"schema_version\": \"1.0\",\n          \"installed_date\": \"2025-11-23T14:30:00Z\",\n          \"last_upgrade\": \"2025-11-23T14:30:00Z\",\n          \"workspace_id\": \"a7b3c4d5e6f7\"\n        }\n        ```\n        \n        File location: CORTEX/.cortex-version\n      \n      rationale: |\n        Version tracking enables intelligent upgrade/setup detection:\n        - NO version file \u2192 Initial setup (create empty brain)\n        - Version file exists \u2192 Upgrade (preserve brain, update core)\n        - Version comparison \u2192 Determine upgrade path & migrations needed\n    \n    - rule_id: \"UPGRADE_BRAIN_PRESERVATION\"\n      name: \"Brain Data Preservation During Upgrades\"\n      severity: \"blocked\"\n      description: \"\
  Upgrade operations MUST NEVER overwrite brain data (conversations, patterns, documents)\"\n      \n      detection:\n        combined_keywords:\n          upgrade_operation:\n            - \"upgrade cortex\"\n            - \"update cortex\"\n            - \"replace cortex\"\n          and_overwrite_risk:\n            - \"overwrite all\"\n            - \"replace cortex-brain\"\n            - \"delete CORTEX\"\n            - \"rm -rf CORTEX\"\n            - \"Remove-Item CORTEX\"\n        scope: [\"operation\", \"command\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"Use selective file replacement (core only, preserve brain)\"\n        - \"Backup brain data before any upgrade\"\n        - \"Use upgrade package (not full package)\"\n        - \"Verify brain preservation in validation gates\"\n      \n      evidence_template: |\n        Brain data overwrite risk detected!\n        \n        Operation: '{operation}'\n        Command: '{command}'\n        \n        CRITICAL:\
  \ NEVER overwrite these directories during upgrades:\n        - cortex-brain/tier1/*.db (conversations)\n        - cortex-brain/tier2/*.db (patterns)\n        - cortex-brain/tier3/*.db (development context)\n        - cortex-brain/documents/ (user documents)\n        - cortex-brain/user-dictionary.yaml (learned terms)\n        - cortex.config.json (workspace configuration)\n        \n        SAFE upgrade procedure:\n        1. Backup brain data first\n        2. Replace ONLY: src/, scripts/, .github/\n        3. Merge configs: response-templates-v4.yaml, capabilities.yaml\n        4. Preserve brain: All .db files, documents/, user-dictionary.yaml\n        5. Apply schema migrations if needed\n        6. Validate brain integrity\n      \n      rationale: |\n        Brain data represents workspace-specific learning that cannot be regenerated:\n        - Conversation history (127+ conversations typical)\n        - Learned patterns (43+ patterns typical)\n        - User documents (89+ files typical)\n\
  \        - Custom configurations\n        \n        Loss of brain data = loss of CORTEX intelligence for that workspace.\n    \n    - rule_id: \"SCHEMA_MIGRATION_ENFORCEMENT\"\n      name: \"Database Schema Migration Required\"\n      severity: \"blocked\"\n      description: \"Database schema changes MUST include migration files, never destructive updates\"\n      \n      detection:\n        combined_keywords:\n          schema_change:\n            - \"alter table\"\n            - \"drop table\"\n            - \"change schema\"\n            - \"modify database\"\n          without_migration:\n            - \"no migration\"\n            - \"skip migration\"\n            - \"direct schema change\"\n        scope: [\"operation\", \"sql\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"Create migration file in cortex-brain/migrations/\"\n        - \"Use migration runner to apply changes\"\n        - \"Write rollback SQL in migration\"\n        - \"Test migration on backup\
  \ database first\"\n      \n      evidence_template: |\n        Database schema change without migration detected!\n        \n        Operation: '{operation}'\n        Schema change: '{schema_change}'\n        \n        CRITICAL: Schema changes MUST use migration files!\n        \n        Required migration structure:\n        ```sql\n        -- Migration: 003_add_deployment_tracking.sql\n        -- Version: 5.3.0\n        -- Date: 2025-11-23\n        -- Description: Add deployment tracking to tier2\n        \n        BEGIN TRANSACTION;\n        \n        -- Forward migration\n        CREATE TABLE IF NOT EXISTS tier2_deployments (\n            deployment_id TEXT PRIMARY KEY,\n            version TEXT NOT NULL,\n            deployed_at TEXT NOT NULL\n        );\n        \n        -- Update schema version\n        PRAGMA user_version = 3;\n        \n        COMMIT;\n        \n        -- Rollback migration (commented)\n        -- DROP TABLE IF EXISTS tier2_deployments;\n        -- PRAGMA\
  \ user_version = 2;\n        ```\n        \n        Migration location: cortex-brain/migrations/XXX_description.sql\n        \n        Why migrations matter:\n        - Preserves data during schema changes\n        - Provides rollback capability\n        - Documents schema evolution\n        - Enables automated upgrades\n      \n      rationale: |\n        Schema migrations are MANDATORY for:\n        1. Data preservation: No data loss during schema changes\n        2. Upgrade automation: Apply migrations during upgrade workflow\n        3. Rollback safety: Revert schema if upgrade fails\n        4. Version tracking: PRAGMA user_version marks schema state\n        5. Team coordination: All deployments use same schema version\n    \n    - rule_id: \"DEPLOYMENT_TYPE_DETECTION\"\n      name: \"Intelligent Deployment Type Detection\"\n      severity: \"warning\"\n      description: \"Deployment operations should auto-detect setup vs upgrade mode\"\n      \n      detection:\n        keywords:\n\
  \          - \"manual deployment\"\n          - \"copy folder\"\n          - \"replace directory\"\n          - \"user must choose\"\n        scope: [\"operation\", \"workflow\"]\n      \n      alternatives:\n        - \"Auto-detect: No CORTEX/ \u2192 Setup mode\"\n        - \"Auto-detect: CORTEX/ exists \u2192 Upgrade mode\"\n        - \"Check .cortex-version for version comparison\"\n        - \"Provide dry-run mode for preview\"\n      \n      evidence_template: |\n        Manual deployment workflow detected: '{operation}'\n        \n        CORTEX should auto-detect deployment type:\n        \n        Detection Logic:\n        ```python\n        if not cortex_dir.exists():\n            return DeploymentType.INITIAL_SETUP\n        elif not version_file.exists():\n            return DeploymentType.LEGACY_UPGRADE\n        elif current_version < latest_version:\n            return DeploymentType.UPGRADE\n        else:\n            return DeploymentType.UP_TO_DATE\n        ```\n       \
  \ \n        User Experience:\n        - \"setup cortex\" \u2192 Auto-detects mode\n        - \"upgrade cortex\" \u2192 Auto-detects mode\n        - No manual decision needed\n      \n      rationale: |\n        Intelligent detection improves user experience:\n        - No \"am I upgrading or setting up?\" confusion\n        - Automatic brain preservation in upgrade mode\n        - Correct package download (full vs upgrade)\n        - Reduced human error\n    \n    - rule_id: \"CONFIG_MERGE_INTELLIGENCE\"\n      name: \"Config Files Require 3-Way Merge\"\n      severity: \"blocked\"\n      description: \"Config files (YAML) must use 3-way merge during upgrades, not overwrite\"\n      \n      detection:\n        combined_keywords:\n          upgrade_operation:\n            - \"upgrade\"\n            - \"update config\"\n          and_overwrite:\n            - \"overwrite yaml\"\n            - \"replace config\"\n            - \"copy config\"\n        scope: [\"operation\"]\n        logic:\
  \ \"AND\"\n      \n      alternatives:\n        - \"Use 3-way merge: Base + Local + Upgrade \u2192 Merged\"\n        - \"Preserve user customizations (local changes)\"\n        - \"Add new features from upgrade\"\n        - \"Detect conflicts and offer resolution\"\n      \n      evidence_template: |\n        Config overwrite detected during upgrade!\n        \n        File: '{file_path}'\n        Operation: '{operation}'\n        \n        CRITICAL: Config files need intelligent merging!\n        \n        3-Way Merge Process:\n        ```\n        Base Config (v5.1.0 - original)\n            +\n        Local Config (user customizations)\n            +\n        Upgrade Config (v5.2.0 - new features)\n            =\n        Merged Config (customizations + new features)\n        ```\n        \n        Example - response-templates-v4.yaml:\n        Base: triggers: [\"help\"]\n        Local: triggers: [\"help\", \"cortex help\"] \u2190 User added\n        Upgrade: triggers: [\"help\"], new_template:\
  \ admin_help\n        Merged: triggers: [\"help\", \"cortex help\"], new_template: admin_help\n        \n        Preserve:\n        - User-added triggers\n        - Custom templates\n        - Modified capabilities\n        \n        Add:\n        - New templates from upgrade\n        - New capabilities\n        - New operations\n      \n      rationale: |\n        Config merging prevents loss of user customizations:\n        - User spent time configuring CORTEX\n        - Custom triggers, templates, operations\n        - Should be preserved during upgrades\n        - New features added alongside customizations\n    \n    - rule_id: \"PUBLISH_PACKAGE_VALIDATION\"\n      name: \"Publish Package Content Validation\"\n      severity: \"blocked\"\n      description: \"Published packages MUST NOT contain brain data or machine-specific files\"\n      \n      detection:\n        combined_keywords:\n          publish_operation:\n            - \"build package\"\n            - \"create publish\"\
  \n            - \"generate release\"\n          privacy_risk:\n            - \"*.db included\"\n            - \"brain data included\"\n            - \"machine paths included\"\n        scope: [\"operation\", \"validation\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"Exclude all .db files from publish\"\n        - \"Exclude cortex.config.json (machine-specific)\"\n        - \"Exclude .platform_state.json\"\n        - \"Use publish-config.yaml validation rules\"\n      \n      evidence_template: |\n        Privacy/data leak risk in publish package!\n        \n        Package: '{package_path}'\n        Risk: '{risk_type}'\n        \n        CRITICAL: Published packages MUST NOT contain:\n        - *.db files (brain data)\n        - cortex.config.json (machine-specific paths)\n        - .platform_state.json (hostname)\n        - .coverage.* (machine names)\n        - conversation-history.jsonl (private conversations)\n        \n        Validation checklist:\n       \
  \ \u2705 No .db files\n        \u2705 No machine-specific configs\n        \u2705 No hostnames/usernames\n        \u2705 No conversation data\n        \u2705 Only core CORTEX code\n        \n        Use forbidden_patterns from publish-config.yaml\n      \n      rationale: |\n        Privacy protection in published packages:\n        - Brain data is workspace-specific (never shared)\n        - Machine paths reveal private directory structure\n        - Conversation history is confidential\n        - Published packages = clean core only\n\n# Layer 8: Test Location Isolation\n- layer_id: \"test_location_isolation\"\n  name: \"Test Location Isolation\"\n  description: \"Application tests in user repo, CORTEX tests in CORTEX folder - maintain brain knowledge from both\"\n  priority: 8\n  \n  rules:\n    - rule_id: \"TEST_LOCATION_SEPARATION\"\n      name: \"Test Location Separation\"\n      severity: \"blocked\"\n      description: \"When running in development environments, application tests\
  \ MUST be created in user repo (NOT CORTEX folder). Only CORTEX-related tests reside in CORTEX. CORTEX MUST use user's existing test framework and feed brain with knowledge learned from application tests.\"\n      \n      detection:\n        combined_keywords:\n          test_generation:\n            - \"generate test\"\n            - \"create test\"\n            - \"write test\"\n            - \"tdd workflow\"\n          application_code:\n            - \"user application\"\n            - \"user code\"\n            - \"application feature\"\n            - \"business logic\"\n          wrong_location:\n            - \"tests/fixtures\"\n            - \"CORTEX/tests\"\n            - \"cortex-brain/tests\"\n        scope: [\"intent\", \"target_path\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Detect user repository root (outside CORTEX folder)\"\n        - \"STEP 2: Discover user's existing test framework (pytest, jest, xunit, etc.)\"\n        - \"STEP 3: Create\
  \ tests in user repo following their conventions\"\n        - \"STEP 4: Run tests using user's framework\"\n        - \"STEP 5: Capture test patterns, framework usage, and insights\"\n        - \"STEP 6: Store learned patterns in CORTEX brain (Tier 1/Tier 2)\"\n        - \"EXAMPLE: User app at /Users/user/myapp \u2192 Tests at /Users/user/myapp/tests/\"\n        - \"EXAMPLE: CORTEX tests \u2192 Stay in /CORTEX/tests/\"\n      \n      evidence_template: |\n        Test location violation detected!\n        \n        Target: '{target_path}'\n        Test Type: '{test_type}'\n        \n        \u274C WRONG: Application test being created in CORTEX folder\n        - Path: CORTEX/tests/test_user_feature.py\n        - Reason: Application tests don't belong in CORTEX\n        - Impact: Pollutes CORTEX with application-specific code\n        \n        \u2705 CORRECT: Application test in user repository\n        - Path: /Users/user/myapp/tests/test_user_feature.py\n        - Framework: {user's\
  \ framework} (pytest/jest/xunit/etc.)\n        - Conventions: {user's naming patterns}\n        - Brain Learning: Test patterns stored in cortex-brain/tier2/\n        \n        **CORTEX Tests (stay in CORTEX folder):**\n        - Brain protection tests\n        - Agent functionality tests\n        - Workflow orchestration tests\n        - CORTEX infrastructure tests\n        \n        **Application Tests (go in user repo):**\n        - Business logic tests\n        - Feature tests\n        - Integration tests\n        - E2E tests\n        \n        **Knowledge Capture (automatic):**\n        - Test framework detection \u2192 Tier 2\n        - Naming conventions \u2192 Tier 2\n        - Test patterns \u2192 Tier 2\n        - Code coverage insights \u2192 Tier 1\n        - Common failure patterns \u2192 Tier 2\n      \n      rationale: |\n        TEST_LOCATION_SEPARATION: Architectural Clarity & Brain Intelligence\n        \n        Problem Scenario:\n        - User developing \"payment\
  \ processing\" feature\n        - CORTEX generates test_payment.py in CORTEX/tests/\n        - Test contains application-specific logic\n        - CORTEX repo polluted with user's business logic\n        - User can't find tests in their own repo\n        - Tests don't use user's existing framework\n        \n        Correct Approach:\n        1. **Detect Context:**\n           - Working directory: /Users/user/myapp\n           - Test framework: pytest (detected from requirements.txt)\n           - Convention: tests/ folder with test_*.py pattern\n        \n        2. **Generate Tests in User Repo:**\n           - Path: /Users/user/myapp/tests/test_payment.py\n           - Framework: pytest (user's choice)\n           - Style: Matches user's existing tests\n        \n        3. **Capture Knowledge for Brain:**\n           - Pattern: \"Payment tests use mock stripe API\"\n           - Pattern: \"User prefers parametrized fixtures\"\n           - Insight: \"Payment tests fail when DB not\
  \ seeded\"\n           - Store: cortex-brain/tier2/knowledge-graph.yaml\n        \n        4. **Benefits:**\n           - User repo self-contained with its tests\n           - CORTEX stays focused on CORTEX functionality\n           - Brain learns from user patterns (not polluted with user code)\n           - User's test framework honored\n           - Proper separation of concerns\n        \n        Brain Learning Mechanism:\n        - Monitor test execution results\n        - Track framework usage patterns\n        - Identify common anti-patterns\n        - Store generalized insights (not specific code)\n        - Use insights to improve future test generation\n        \n        Exception:\n        Only CORTEX-related tests (brain, agents, workflows) stay in CORTEX folder.\n\n# Layer 9: Git History Context Validation\n- layer_id: \"git_history_context_validation\"\n  name: \"Git History Context Validation\"\n  description: \"Universal rule: All requests MUST check git history to build\
  \ stronger context before analysis\"\n  priority: 9\n  \n  rules:\n    - rule_id: \"GIT_HISTORY_CONTEXT_REQUIRED\"\n      name: \"Git History Context Required\"\n      severity: \"blocked\"\n      description: \"All requests that analyze code files MUST check git history first. This provides critical context: recurring issues, security patterns, subject matter experts, change frequency, and related files.\"\n      \n      detection:\n        combined_keywords:\n          code_analysis:\n            - \"analyze\"\n            - \"review\"\n            - \"plan\"\n            - \"implement\"\n            - \"refactor\"\n            - \"security review\"\n            - \"gap analysis\"\n          file_targets:\n            - \".py\"\n            - \".js\"\n            - \".ts\"\n            - \".cs\"\n            - \".java\"\n            - \".go\"\n            - \".rb\"\n            - \".php\"\n          missing_context:\n            - \"has_git_history_context: false\"\n            - \"\
  git_history_context: null\"\n        scope: [\"intent\", \"target_files\", \"context\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Run git log analysis (6 months lookback)\"\n        - \"STEP 2: Run git grep for security keywords (1 year)\"\n        - \"STEP 3: Run git shortlog for contributor analysis\"\n        - \"STEP 4: Run git blame for line-level history\"\n        - \"STEP 5: Extract PR/issue references from commits\"\n        - \"STEP 6: Identify files that change together\"\n        - \"STEP 7: Build context enrichment dictionary\"\n        - \"STEP 8: Proceed with analysis using enriched context\"\n      \n      evidence_template: |\n        Git history context missing for code analysis!\n        \n        Files: '{target_files}'\n        Operation: '{operation}'\n        \n        \u274C BLOCKED: Cannot proceed without git history context\n        \n        WHY GIT HISTORY MATTERS:\n        \n        Without Git History:\n        - Analyze file\
  \ in isolation\n        - Miss recurring patterns\n        - Don't know who to ask\n        - Treat all code equally\n        - Risk repeating past mistakes\n        \n        With Git History:\n        - Identify high-churn files (23 commits = unstable)\n        - Detect security patterns (4 hotfixes = sensitive)\n        - Find subject matter experts (Dev C wrote 3 hotfixes)\n        - Prioritize based on history (SQL injection fixed 3 times)\n        - Learn from past solutions (related PR references)\n        \n        REQUIRED ACTIONS:\n        \n        1. **Recent Activity Analysis (6 months):**\n           ```bash\n           git log --oneline --since=6.months.ago [file]\n           git log --numstat --since=6.months.ago [file]\n           ```\n           Captures: Commit count, churn rate, change frequency\n        \n        2. **Security Pattern Detection (1 year):**\n           ```bash\n           git log --grep=\"security|vulnerability|CVE|exploit|bypass|injection|XSS|CSRF|authentication|authorization|password|encryption|hotfix|rollback\"\
  \ -i --since=1.year.ago [file]\n           ```\n           Captures: Security commits, hotfixes, rollbacks\n        \n        3. **Contributor Analysis:**\n           ```bash\n           git shortlog -sn [file]\n           git shortlog -sn --since=3.months.ago [file]\n           ```\n           Captures: Top contributors, recent maintainers, SME identification\n        \n        4. **Related Work Discovery:**\n           ```bash\n           git log --grep=\"#[0-9]\" --oneline [file]\n           ```\n           Captures: PR references, issue tracker links\n        \n        5. **Temporal Patterns:**\n           ```bash\n           git log --format=%ad --date=short --since=6.months.ago [file]\n           ```\n           Captures: Change frequency, spike detection, maintenance windows\n        \n        CONTEXT ENRICHMENT EXAMPLE:\n        \n        File: Login.cs\n        \n        \u2705 Git History Context Found:\n        - Recent Commits: 23 (HIGH CHURN - unstable file)\n        - Security\
  \ Hotfixes: 4 in last 6 months\n          \u2022 SQL injection fix (3 months ago)\n          \u2022 Auth bypass fix (6 months ago)\n          \u2022 Password hashing fix (1 month ago)\n          \u2022 Session timeout fix (2 weeks ago)\n        - Top Contributors:\n          \u2022 Dev A: 48% (original author)\n          \u2022 Dev B: 33% (recent features)\n          \u2022 Dev C: 17% (hotfix specialist) \u2190 SME for security\n        - Related Issues: #1234, #1567, #1890 (all security-related)\n        - Change Frequency: Very High (2-3 times per week)\n        \n        ANALYSIS PRIORITIES (based on history):\n        1. Focus on authentication/authorization gaps (history shows bypass)\n        2. Review password handling thoroughly (recent hotfix)\n        3. Validate SQL queries rigorously (injection history)\n        4. Consult Dev C for security concerns (SME)\n        5. Check related files (SessionManager.cs, AuthService.cs)\n        \n        BENEFITS OF GIT HISTORY CONTEXT:\n\
  \        - 40% better gap detection (historical patterns reveal systemic issues)\n        - 25% time savings (prioritize high-risk areas first)\n        - 60% better prioritization (security history drives urgency)\n        - Zero redundant fixes (learn from past solutions)\n        \n        VALIDATOR: GitHistoryValidator\n        CONFIG: cortex-brain/config/git-history-rules.yaml\n      \n      rationale: |\n        GIT_HISTORY_CONTEXT_REQUIRED: Universal Rule for Context Quality\n        \n        Real-World Impact:\n        \n        Scenario 1: SQL Injection Gap\n        - Without History: \"Check for SQL injection in Login.cs\"\n        - With History: \"Login.cs has SQL injection fixed 3 times in past year. This indicates systemic validation problem, not one-off bug. Recommend comprehensive input validation strategy.\"\n        \n        Scenario 2: Authentication Bypass\n        - Without History: \"Auth logic looks okay\"\n        - With History: \"Auth bypass hotfix 6 months\
  \ ago suggests server-side validation was weak. Current client-side checks insufficient. Recent session timeout fix 2 weeks ago indicates session management still problematic.\"\n        \n        Scenario 3: High-Churn File\n        - Without History: \"Implement feature in Login.cs\"\n        - With History: \"Login.cs has 23 commits in 6 months (HIGH CHURN). File is unstable. Consider refactoring before adding features. Risk of introducing bugs is elevated.\"\n        \n        Scenario 4: Subject Matter Expert\n        - Without History: \"Need security review\"\n        - With History: \"Dev C has written 3 of 4 security hotfixes. Suggest including Dev C in security review. They have deep context on vulnerability patterns.\"\n        \n        Scenario 5: Related File Dependencies\n        - Without History: \"Update Login.cs\"\n        - With History: \"Login.cs and SessionManager.cs always change together (10 of 15 commits). Update SessionManager.cs in parallel to avoid integration\
  \ issues.\"\n        \n        Implementation Strategy:\n        \n        1. **Automatic Validation:**\n           - GitHistoryValidator runs before every code analysis\n           - BLOCKING enforcement (cannot proceed without history)\n           - 5-part analysis checklist (activity, security, contributors, related work, temporal)\n        \n        2. **Context Enrichment:**\n           - Git history results stored in request context\n           - Available to all agents via has_git_history_context flag\n           - Quality score (0-100%) indicates context completeness\n        \n        3. **Configuration:**\n           - Security keywords: 14 terms (security, vulnerability, CVE, exploit, bypass, injection, XSS, CSRF, auth, password, encryption, hotfix, rollback)\n           - High-risk thresholds: 15 commits/6mo churn, 3 hotfix count, 30 days recent security fix\n           - Exemptions: *.md, *.txt, *.json, *.yaml files\n        \n        4. **User Experience:**\n           -\
  \ Transparent to users (runs automatically)\n           - No commands to remember\n           - Better results (40% detection improvement)\n           - Faster analysis (25% time savings from prioritization)\n        \n        Metrics & Benefits:\n        \n        Context Quality Score (0-100%):\n        - 90-100%: Excellent (full context, all checks passed)\n        - 70-89%: Good (adequate context, minor gaps)\n        - 50-69%: Adequate (basic context, improvement recommended)\n        - 0-49%: Poor (insufficient context, BLOCKED)\n        \n        Measured Improvements:\n        - Gap Detection: 40% better (recurring issues identified)\n        - Time Efficiency: 25% faster (high-risk areas prioritized)\n        - Prioritization: 60% improvement (history-driven urgency)\n        - Redundant Fixes: Zero (learn from past solutions)\n        \n        This universal rule transforms CORTEX from reactive to proactive analysis.\n\n# Layer 10: Operational Readiness Enforcement\n- layer_id:\
  \ \"operational_readiness_enforcement\"\n  name: \"Operational Readiness Enforcement\"\n  description: \"Block deployment/upgrade if CORTEX is not fully operational in target environment\"\n  priority: 10\n  \n  rules:\n    - rule_id: \"OPERATIONAL_READINESS_ENFORCEMENT\"\n      name: \"Operational Readiness Enforcement\"\n      severity: \"blocked\"\n      description: \"Deployment or upgrade completion MUST be validated with operational readiness checks: dependencies installed, imports work, databases accessible, configs valid. Failure triggers automatic rollback.\"\n      \n      detection:\n        combined_keywords:\n          deployment_actions:\n            - \"deploy cortex\"\n            - \"upgrade cortex\"\n            - \"publish cortex\"\n            - \"release cortex\"\n            - \"upgrade complete\"\n            - \"deployment complete\"\n          missing_validation:\n            - \"operational_validation: false\"\n            - \"dependencies_validated: false\"\n\
  \            - \"imports_validated: false\"\n        scope: [\"intent\", \"operation_status\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Validate environment prerequisites (Python 3.8+, pip, git, disk space)\"\n        - \"STEP 2: Validate core dependencies installed (pytest, PyYAML, watchdog, psutil, send2trash)\"\n        - \"STEP 3: Validate optional dependencies (NumPy, scikit-learn - warn if missing)\"\n        - \"STEP 4: Validate core imports work (tier1, tier2, tier3 modules)\"\n        - \"STEP 5: Validate databases accessible (tier1, tier2, tier3 DBs exist)\"\n        - \"STEP 6: Validate operations config valid (cortex-operations.yaml)\"\n        - \"STEP 7: Validate response templates valid (response-templates-v4.yaml)\"\n        - \"STEP 8: Validate brain protection rules valid (brain-protection-rules.yaml)\"\n        - \"STEP 9: Validate test suite discoverable (pytest --collect-only)\"\n        - \"STEP 10: Run smoke test (test_brain_protector.py\
  \ or similar)\"\n        - \"STEP 11: If ANY critical check fails \u2192 ROLLBACK deployment\"\n        - \"STEP 12: If all checks pass \u2192 Declare 'CORTEX operational'\"\n      \n      evidence_template: |\n        Operational readiness validation required!\n        \n        Operation: '{operation}'\n        Status: '{status}'\n        \n        \u274C BLOCKED: Cannot declare deployment/upgrade complete without operational validation\n        \n        **Real-World Failure (upgrade-issue.md):**\n        - User upgraded CORTEX (files copied successfully)\n        - NumPy failed to install (missing C compiler)\n        - Tests not discoverable (incorrect path)\n        - Manual verification took 45+ minutes\n        - Declared \"success\" but CORTEX was not operational\n        \n        **Required Validation Gates:**\n        \n        Gate 1: Environment Prerequisites\n        - [ ] Python 3.8+ available\n        - [ ] pip functional\n        - [ ] git available\n        - [ ] Disk\
  \ space sufficient (500+ MB)\n        - [ ] Write permissions verified\n        - [ ] C compiler available (optional, warn if missing)\n        \n        Gate 2: Core Dependencies\n        - [ ] pytest installed and importable\n        - [ ] PyYAML installed and importable\n        - [ ] watchdog installed and importable\n        - [ ] psutil installed and importable\n        - [ ] send2trash installed and importable\n        \n        Gate 3: Optional Dependencies (warn only)\n        - [ ] NumPy installed (ML features)\n        - [ ] scikit-learn installed (ML features)\n        - [ ] pandas installed (data analysis)\n        \n        Gate 4: Core Imports\n        - [ ] from tier1.working_memory import WorkingMemory\n        - [ ] from tier3.development_context import DevelopmentContext\n        - [ ] No import errors\n        \n        Gate 5: Database Accessibility\n        - [ ] cortex-brain/tier1/working_memory.db exists\n        - [ ] cortex-brain/tier2/knowledge_graph.db exists\
  \ (or auto-init)\n        - [ ] cortex-brain/tier3/development_context.db exists\n        \n        Gate 6: Configuration Validation\n        - [ ] cortex-operations.yaml exists and valid\n        - [ ] response-templates-v4.yaml exists and valid\n        - [ ] brain-protection-rules.yaml exists and valid\n        \n        Gate 7: Test Suite Validation\n        - [ ] pytest --collect-only succeeds\n        - [ ] At least 10 tests discovered\n        - [ ] Smoke test passes (optional, warn only)\n        \n        **Rollback Triggers (Critical Failures):**\n        - Core dependency import fails\n        - Core module import fails\n        - Tier 1 or Tier 3 database missing\n        - Operations config invalid\n        - Response templates invalid\n        - Brain protection rules invalid\n        \n        **Success Criteria:**\n        \u2705 ALL gates pass (or warnings only)\n        \u2705 Time to operational: <5 minutes\n        \u2705 Zero manual intervention required\n        \u2705\
  \ User sees clear validation summary\n        \n        **Implementation:**\n        - upgrade_orchestrator.py: Call _validate_dependencies(), _validate_operational_readiness(), _validate_test_suite()\n        - validate_deployment.py: Add check_environment_prerequisites()\n        - Bootstrap verification: Enhanced with operational checks\n        - Auto-rollback: If critical checks fail\n      \n      rationale: |\n        OPERATIONAL_READINESS_ENFORCEMENT: User Trust & Time Savings\n        \n        **Problem Scenario (From upgrade-issue.md):**\n        \n        Timeline:\n        - Minute 0-5: Backup & file copy (SUCCESS)\n        - Minute 5-25: NumPy build failure (20 min wasted)\n        - Minute 25-35: Test discovery failure (10 min wasted)\n        - Minute 35-45: Manual verification (15 min wasted)\n        - Total: 45+ minutes to operational state\n        \n        Root Cause:\n        - Deployment validated SOURCE repository health\n        - Did NOT validate TARGET environment\
  \ readiness\n        - Assumed \"files copied = operational\"\n        - No environment prerequisites check\n        - No dependency installation validation\n        - No operational smoke test\n        \n        Impact:\n        - Poor user experience (\"Where are the tests?\")\n        - Wasted time on manual troubleshooting\n        - Eroded trust in upgrade process\n        - Risk of incomplete installation\n        \n        **Correct Approach:**\n        \n        1. **Pre-Flight Environment Check:**\n           - Check Python version (3.8+)\n           - Check pip availability\n           - Check git availability\n           - Check disk space (500+ MB)\n           - Check write permissions\n           - Check C compiler (warn if missing)\n           - BLOCK if critical checks fail\n        \n        2. **Post-Copy Dependency Validation:**\n           - Install core dependencies (pytest, PyYAML, etc.)\n           - Verify all imports successful\n           - Warn if optional deps\
  \ fail (NumPy, scikit-learn)\n           - ROLLBACK if core deps fail\n        \n        3. **Operational Readiness Validation:**\n           - Test core imports (tier1, tier2, tier3)\n           - Verify databases accessible\n           - Validate config files (YAML syntax)\n           - Run pytest --collect-only\n           - ROLLBACK if operational checks fail\n        \n        4. **Success Declaration:**\n           - Only after ALL gates pass\n           - Show validation summary\n           - Display time to operational\n           - List any warnings (optional deps)\n        \n        **Benefits:**\n        - Time to operational: 45 min \u2192 <5 min (90% reduction)\n        - Manual intervention: Required \u2192 None (100% reduction)\n        - User confidence: Low \u2192 High\n        - Rollback safety: Automatic on failure\n        \n        **Metrics:**\n        - Environment validation: <30 seconds\n        - Dependency validation: <2 minutes\n        - Operational validation:\
  \ <1 minute\n        - Total overhead: <5 minutes\n        - User time saved: 40+ minutes\n        \n        **Edge Cases:**\n        - Windows without C compiler: Warn, continue (NumPy skipped)\n        - Tests not found: Warn, continue (non-critical)\n        - Optional deps fail: Warn, continue (graceful degradation)\n        - Core imports fail: ERROR, rollback (critical)\n        \n        This rule ensures CORTEX is ACTUALLY operational, not just \"deployed\".\n    \n    - rule_id: \"DEBUG_MARKER_REMOVAL_ENFORCEMENT\"\n      name: \"Debug Marker Removal Enforcement\"\n      severity: \"blocked\"\n      description: \"Git commits containing debug markers (MARKER, DEBUG, FIXME, TODO, BREAKPOINT) MUST be blocked to prevent debugging artifacts from reaching production\"\n      \n      detection:\n        combined_keywords:\n          commit_attempt:\n            - \"git commit\"\n            - \"commit changes\"\n            - \"stage files\"\n            - \"ready to commit\"\n    \
  \      marker_patterns:\n            - \"# MARKER:\"\n            - \"# DEBUG:\"\n            - \"# FIXME:\"\n            - \"# TODO:\"\n            - \"# BREAKPOINT:\"\n        scope: [\"intent\", \"file_content\"]\n        logic: \"AND\"\n      \n      alternatives:\n        - \"STEP 1: Run debug marker scanner: python src/utils/debug_markers.py scan src/\"\n        - \"STEP 2: Review found markers and determine if they should be removed\"\n        - \"STEP 3: Remove markers: python src/utils/debug_markers.py remove <file>\"\n        - \"STEP 4: Or manually remove marker comments from code\"\n        - \"STEP 5: Verify markers removed: python src/utils/debug_markers.py scan src/\"\n        - \"STEP 6: Stage cleaned files: git add <files>\"\n        - \"STEP 7: Retry commit (pre-commit hook will validate)\"\n      \n      evidence_template: |\n        Debug markers detected in staged files!\n        \n        Operation: '{operation}'\n        Markers found: {marker_count}\n        \n\
  \        \u274C BLOCKED: Cannot commit code with debug markers\n        \n        **Why Debug Markers Must Be Removed:**\n        \n        1. **Production Readiness**\n           - Debug markers indicate incomplete/temporary code\n           - MARKER: Used during development to track execution\n           - DEBUG: Code meant for debugging only\n           - FIXME: Temporary fixes needing proper implementation\n           - TODO: Incomplete implementations\n           - BREAKPOINT: Execution pause points\n        \n        2. **Code Quality**\n           - Markers clutter codebase\n           - Confuse future developers\n           - Indicate lack of review\n           - Suggest rushed implementation\n        \n        3. **Professional Standards**\n           - Clean code ready for review\n           - No debugging artifacts\n           - Proper implementation complete\n           - Ready for production\n        \n        **Marker Types Detected:**\n        \n        {marker_details}\n\
  \        \n        **Automated Removal Available:**\n        \n        ```bash\n        # Scan for all markers\n        python src/utils/debug_markers.py scan src/\n        \n        # Remove from specific file\n        python src/utils/debug_markers.py remove src/orchestrators/example.py\n        \n        # Dry-run to see what would be removed\n        python src/utils/debug_markers.py remove src/orchestrators/example.py --dry-run\n        ```\n        \n        **Git Pre-Commit Hook Protection:**\n        \n        The git pre-commit hook automatically scans staged Python files for markers:\n        - Located: `.git/hooks/pre-commit`\n        - Auto-scans: All staged .py files\n        - Blocks commit: If any markers found\n        - Clear guidance: Shows exact locations\n        \n        **Manual Removal:**\n        \n        1. Open files listed above\n        2. Find lines with markers (MARKER:, DEBUG:, etc.)\n        3. Remove marker comments\n        4. Ensure code still functions\n\
  \        5. Stage cleaned files: git add <files>\n        6. Retry commit\n        \n        **Exceptions:**\n        \n        - If marker is intentional (e.g., TODO in documentation): Convert to proper format\n        - If marker is critical for tracking: Move to issue tracker or planning document\n        - If fixing marker is complex: Create separate task and remove marker\n        \n        **Benefits of Clean Commits:**\n        - Professional code quality\n        - Clear git history\n        - Production-ready code\n        - Easy code review\n        - No confusion for future developers\n        \n        **Pre-Commit Hook Installation:**\n        \n        Copy the hook to your .git/hooks directory:\n        ```bash\n        cp scripts/git-hooks/pre-commit .git/hooks/pre-commit\n        chmod +x .git/hooks/pre-commit  # Unix/Mac only\n        ```\n        \n        The hook will automatically validate all future commits.\n"
logging:
  enabled: true
  path: cortex-brain/corpus-callosum/protection-events.jsonl
  format: jsonl
  include_fields:
  - timestamp
  - event
  - request
  - violations
  - decision
  - severity
  - alternatives_suggested
  - user_decision
  - override_justification
  - override_required
validation:
- check: rules_complete
  scope: protection_layers
  required: true
  params:
    all_layers_have_rules: true
    all_rules_have_detection: true
    all_rules_have_alternatives: true
- check: severity_valid
  scope: rules
  required: true
  params:
    valid_severities:
    - safe
    - warning
    - blocked
- check: templates_valid
  scope: challenge_template
  required: true
  params:
    has_placeholders: true
    has_options: true

