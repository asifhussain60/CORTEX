<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTEX Learning Library</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #42b983; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .sidebar { background: #f8f9fa; border-right: 1px solid #e9ecef; }
    .sidebar-nav ul li a { transition: color 0.2s; }
    .sidebar-nav ul li a:hover { color: var(--theme-color); }
    .markdown-section h1 { border-bottom: 2px solid var(--theme-color); }
    .markdown-section h2 { border-left: 4px solid var(--theme-color); padding-left: 0.75rem; }
    .search .input-wrap input { border: 2px solid #e9ecef; border-radius: 8px; }
    .search .input-wrap input:focus { border-color: var(--theme-color); box-shadow: 0 0 0 3px rgba(66,185,131,0.1); }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.\ = {
      name: 'CORTEX Learning Library',
      repo: 'asifhussain60/CORTEX',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      themeColor: '#42b983',
      search: { paths: 'auto', placeholder: 'Search...' },
      pagination: { previousText: '← Previous', nextText: 'Next →' },
      copyCode: { buttonText: 'Copy', successText: 'Copied!' }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.6.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
</body>
</html>
