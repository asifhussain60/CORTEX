<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Module Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }
        .pass { border-left: 4px solid #22c55e; }
        .fail { border-left: 4px solid #ef4444; }
        .pending { border-left: 4px solid #f59e0b; }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Dashboard Module Import Test</h1>
        <p>Testing circular dependency fix...</p>
        <div id="results"></div>
    </div>

    <script type="module">
        const results = document.getElementById('results');
        
        function addResult(name, status, message) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.innerHTML = `
                <strong>${status === 'pass' ? '✓' : status === 'fail' ? '✗' : '⏳'} ${name}</strong><br>
                <small>${message}</small>
            `;
            results.appendChild(div);
        }

        async function runTests() {
            try {
                // Test 1: Import shared-utils
                addResult('shared-utils.js', 'pending', 'Importing shared utilities...');
                const sharedUtils = await import('./shared-utils.js');
                addResult('shared-utils.js', 'pass', `Loaded successfully. Exports: ${Object.keys(sharedUtils).join(', ')}`);

                // Test 2: Import export-utils
                addResult('export-utils.js', 'pending', 'Importing export utilities...');
                const exportUtils = await import('./export-utils.js');
                addResult('export-utils.js', 'pass', `Loaded successfully. Exports: ${Object.keys(exportUtils).join(', ')}`);

                // Test 3: Import keyboard-navigation
                addResult('keyboard-navigation.js', 'pending', 'Importing keyboard navigation...');
                const keyboardNav = await import('./keyboard-navigation.js');
                addResult('keyboard-navigation.js', 'pass', `Loaded successfully. Exports: ${Object.keys(keyboardNav).join(', ')}`);

                // Test 4: Import app.js
                addResult('app.js', 'pending', 'Importing main app...');
                const app = await import('./app.js');
                addResult('app.js', 'pass', `Loaded successfully. Exports: ${Object.keys(app).join(', ')}`);

                // Test 5: Check for circular dependency
                addResult('Circular Dependency Check', 'pass', 'No circular dependencies detected! All modules loaded.');

                // Test 6: Load mock data
                addResult('Mock Data Loading', 'pending', 'Fetching mock data...');
                const response = await fetch('../mock/health-data.json');
                const data = await response.json();
                addResult('Mock Data Loading', 'pass', `Health Score: ${data.health_score}, Files: ${data.total_files}`);

                // Summary
                const summary = document.createElement('div');
                summary.className = 'test-result pass';
                summary.innerHTML = `
                    <h2>✅ All Tests Passed!</h2>
                    <p>Dashboard modules are ready. The circular dependency issue has been resolved.</p>
                    <p><strong>Next:</strong> <a href="index.html?source=mock" style="color: #22c55e;">Load Full Dashboard →</a></p>
                `;
                results.appendChild(summary);

            } catch (error) {
                addResult('Error', 'fail', `<pre>${error.message}\n${error.stack}</pre>`);
                console.error('Test failed:', error);
            }
        }

        runTests();
    </script>
</body>
</html>
