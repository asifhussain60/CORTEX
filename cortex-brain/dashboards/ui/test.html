<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
</head>
<body style="background: #0a0e27; color: white; font-family: sans-serif; padding: 2rem;">
    <h1>🧠 CORTEX Dashboard Test</h1>
    <p>If you see this, the HTTP server is working.</p>
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        // Test 1: Check if we can load mock data
        fetch('../mock/health-data.json')
            .then(response => {
                if (response.ok) {
                    results.innerHTML += '<p>✅ Mock data file accessible</p>';
                    return response.json();
                } else {
                    results.innerHTML += '<p>❌ Mock data file not found (404)</p>';
                    throw new Error('Not found');
                }
            })
            .then(data => {
                results.innerHTML += `<p>✅ Mock data loaded: ${JSON.stringify(data).substring(0, 100)}...</p>`;
            })
            .catch(error => {
                results.innerHTML += `<p>❌ Error loading mock data: ${error.message}</p>`;
            });
        
        // Test 2: Check if ES6 modules work
        results.innerHTML += '<p>✅ JavaScript is executing</p>';
        results.innerHTML += `<p>Current URL: ${window.location.href}</p>`;
    </script>
</body>
</html>
