<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Debug</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
        }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Data Debug</h1>
    <div id="output"></div>
    
    <script type="module">
        import { loadDashboardData } from './data-loader.js';
        
        const output = document.getElementById('output');
        
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = msg;
            output.appendChild(div);
        }
        
        async function testLoad() {
            log('<h2>Testing data load from mock source...</h2>');
            
            try {
                const data = await loadDashboardData('mock');
                
                log('<h3 class="success">✅ Data loaded successfully!</h3>');
                
                log('<h3>Data Structure:</h3>');
                log(`<pre>${JSON.stringify({
                    source: data.source,
                    timestamp: data.timestamp,
                    hasHealthData: !!data.healthData,
                    hasTechStack: !!data.techStack,
                    hasSecurity: !!data.security,
                    hasArchitecture: !!data.architecture,
                    hasCodeOrganization: !!data.codeOrganization,
                    hasTeamMetrics: !!data.teamMetrics,
                    hasVendors: !!data.vendors
                }, null, 2)}</pre>`);
                
                if (data.healthData) {
                    log('<h3>Health Data Sample:</h3>');
                    log(`<pre>${JSON.stringify({
                        overall_health_score: data.healthData.overall_health_score,
                        status: data.healthData.status,
                        summary: data.healthData.summary,
                        metrics: data.healthData.metrics
                    }, null, 2)}</pre>`);
                } else {
                    log('<h3 class="error">❌ healthData is null/undefined!</h3>');
                }
                
                if (data.techStack) {
                    log('<h3>Tech Stack Sample:</h3>');
                    log(`<pre>${JSON.stringify({
                        summary: data.techStack.summary,
                        frontendCount: data.techStack.frontend?.length,
                        backendCount: data.techStack.backend?.length
                    }, null, 2)}</pre>`);
                } else {
                    log('<h3 class="error">❌ techStack is null/undefined!</h3>');
                }
                
                if (data.security) {
                    log('<h3>Security Sample:</h3>');
                    log(`<pre>${JSON.stringify({
                        overall_score: data.security.overall_score,
                        vulnerabilities: data.security.vulnerabilities
                    }, null, 2)}</pre>`);
                } else {
                    log('<h3 class="error">❌ security is null/undefined!</h3>');
                }
                
            } catch (error) {
                log(`<h3 class="error">❌ Error loading data:</h3>`);
                log(`<pre class="error">${error.message}\n${error.stack}</pre>`);
            }
        }
        
        testLoad();
    </script>
</body>
</html>
