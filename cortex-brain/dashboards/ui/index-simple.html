<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Health Dashboard</title>
    
    <!-- External Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="styles/main.css">
    
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 39, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        #loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #dashboard {
            display: none;
            padding: 2rem;
        }
        
        #dashboard.visible {
            display: block;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .card {
            background: rgba(26, 31, 58, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .card h2 {
            color: #00d4ff;
            margin-bottom: 1rem;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .metric {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .metric-label {
            color: #a0a6c0;
            font-size: 0.875rem;
        }
        
        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <div style="margin-top: 1rem; color: #a0a6c0;">Loading dashboard...</div>
        </div>
    </div>
    
    <div id="dashboard">
        <div class="header">
            <h1>🧠 CORTEX Health Dashboard</h1>
            <p style="color: #a0a6c0;">Mock Data Demo</p>
        </div>
        
        <div id="error-container"></div>
        <div id="content"></div>
    </div>
    
    <script>
        // Simple dashboard loader
        async function loadDashboard() {
            try {
                // Load health data
                const response = await fetch('../mock/health-data.json');
                if (!response.ok) {
                    throw new Error(`Failed to load data: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Render dashboard
                renderDashboard(data);
                
                // Hide loading, show dashboard
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.add('visible');
                
            } catch (error) {
                console.error('Dashboard load error:', error);
                document.getElementById('error-container').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.add('visible');
            }
        }
        
        function renderDashboard(data) {
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="card">
                    <h2>📊 System Overview</h2>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value">${data.overall_health_score || 'N/A'}</div>
                            <div class="metric-label">Health Score</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${data.total_files || 'N/A'}</div>
                            <div class="metric-label">Total Files</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${data.total_lines_of_code || 'N/A'}</div>
                            <div class="metric-label">Lines of Code</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${data.test_coverage || 'N/A'}%</div>
                            <div class="metric-label">Test Coverage</div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>✅ What's Working</h2>
                    <p>✅ HTTP server running on port 8080</p>
                    <p>✅ Mock data files accessible</p>
                    <p>✅ Data loaded successfully</p>
                    <p>✅ Basic rendering functional</p>
                </div>
                
                <div class="card">
                    <h2>🔧 Next Steps</h2>
                    <p>1. Fix ES6 module circular dependencies</p>
                    <p>2. Gradually integrate Phase 4 features</p>
                    <p>3. Add component-based rendering</p>
                    <p>4. Test keyboard navigation</p>
                </div>
                
                <div class="card">
                    <h2>📦 Raw Data (First 500 chars)</h2>
                    <pre style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.875rem;">${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
                </div>
            `;
        }
        
        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
