<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Brain Icon -->
  <g transform="translate(10, 15)">
    <path d="M20,5 Q25,0 30,5 Q35,0 40,5 Q45,10 45,20 Q45,30 40,35 Q35,40 30,35 Q25,40 20,35 Q15,30 15,20 Q15,10 20,5 Z" 
          fill="url(#brainGradient)" 
          filter="url(#glow)"
          opacity="0.9"/>
    <circle cx="25" cy="18" r="2" fill="#0a0e1a"/>
    <circle cx="35" cy="18" r="2" fill="#0a0e1a"/>
    <path d="M22,25 Q30,28 38,25" stroke="#0a0e1a" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- CORTEX Text -->
  <text x="65" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#brainGradient)" filter="url(#glow)">CORTEX</text>
  
  <!-- Tagline -->
  <text x="67" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00d4ff" opacity="0.7">Health Dashboard</text>
</svg>
