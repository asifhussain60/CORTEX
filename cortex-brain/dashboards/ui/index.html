<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Health Dashboard</title>
    
    <!-- External Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <!-- Styles -->
    <!-- Base CSS Layer -->
    <link rel="stylesheet" href="styles/base/reset.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/base/typography.css">
    
    <!-- Layouts Layer -->
    <link rel="stylesheet" href="styles/layouts/sidebar.css">
    <link rel="stylesheet" href="styles/layouts/dashboard-container.css">
    <link rel="stylesheet" href="styles/layouts/main-content.css">
    
    <!-- Components Layer -->
    <link rel="stylesheet" href="styles/components/buttons.css">
    <link rel="stylesheet" href="styles/components/cards.css">
    <link rel="stylesheet" href="styles/components/badges.css">
    <link rel="stylesheet" href="styles/components/forms.css">
    <link rel="stylesheet" href="styles/components/tabs.css">
    <link rel="stylesheet" href="styles/components/loading.css">
    
    <!-- Utils Layer -->
    <link rel="stylesheet" href="styles/utils/animations.css">
    <link rel="stylesheet" href="styles/utils/accessibility.css">
    
    <!-- Legacy CSS (Phase 5-7) -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/architecture-panels.css">
    <link rel="stylesheet" href="styles/skeleton-loader.css">
    <link rel="stylesheet" href="styles/overview-tab.css">
    <link rel="stylesheet" href="styles/engineering-onboarding.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="visually-hidden">Skip to main content</a>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div style="text-align: center; color: white;">
                <div class="spinner"></div>
                <div class="loading-message">Loading dashboard...</div>
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-container" id="dashboardContainer">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/images/cortex-logo.svg" alt="CORTEX Logo" class="dashboard-logo">
            </div>

            <!-- Source Selector -->
            <div class="source-selector">
                <label for="sourceSelect">Data Source</label>
                <select id="sourceSelect" onchange="handleSourceChange(this.value)">
                    <option value="mock">Mock Data (Demo)</option>
                    <option value="cortex">CORTEX</option>
                    <option value="noor-canvas">Noor Canvas</option>
                    <option value="alist">Alist</option>
                    <option value="ksessions">K-Sessions</option>
                </select>
            </div>

            <!-- Project Type Badge -->
            <div id="project-type-badge" class="project-type-badge">Analyzing...</div>

            <!-- Navigation Tabs -->
            <nav class="nav-tabs">
                <a class="nav-tab active" data-tab="executive" onclick="switchTab('executive')">
                    <span class="nav-tab-icon">📊</span>
                    <span class="nav-tab-text">Executive Summary</span>
                </a>
                <a class="nav-tab" data-tab="overview" onclick="switchTab('overview')">
                    <span class="nav-tab-icon">🏠</span>
                    <span class="nav-tab-text">System Overview</span>
                </a>
                <a class="nav-tab" data-tab="tech-stack" onclick="switchTab('tech-stack')">
                    <span class="nav-tab-icon">⚙️</span>
                    <span class="nav-tab-text">Tech Stack</span>
                </a>
                <a class="nav-tab" data-tab="security" onclick="switchTab('security')">
                    <span class="nav-tab-icon">🔒</span>
                    <span class="nav-tab-text">Security</span>
                </a>
                <a class="nav-tab" data-tab="use-cases" onclick="switchTab('use-cases')">
                    <span class="nav-tab-icon">🎯</span>
                    <span class="nav-tab-text">Use Cases</span>
                </a>
                <a class="nav-tab" data-tab="recommendations" onclick="switchTab('recommendations')">
                    <span class="nav-tab-icon">💡</span>
                    <span class="nav-tab-text">Recommendations</span>
                </a>
                <a class="nav-tab" data-tab="architecture" onclick="switchTab('architecture')">
                    <span class="nav-tab-icon">🏗️</span>
                    <span class="nav-tab-text">Architecture</span>
                </a>
                <a class="nav-tab" data-tab="code-org" onclick="switchTab('code-org')">
                    <span class="nav-tab-icon">📁</span>
                    <span class="nav-tab-text">Code Organization</span>
                </a>
                <a class="nav-tab" data-tab="vendors" onclick="switchTab('vendors')">
                    <span class="nav-tab-icon">🔌</span>
                    <span class="nav-tab-text">Dependencies</span>
                </a>
                <a class="nav-tab" data-tab="engineering" onclick="switchTab('engineering')">
                    <span class="nav-tab-icon">🎓</span>
                    <span class="nav-tab-text">Onboarding</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Content Header -->
            <div class="content-header">
                <h1 class="content-title" id="contentTitle">Executive Summary</h1>
                <div class="content-actions">
                    <button class="btn" onclick="refreshData()" aria-label="Refresh">🔄 Refresh</button>
                    <button class="btn" onclick="exportData()" aria-label="Export">📥 Export</button>
                    <button class="btn btn-primary" onclick="generateReport()" aria-label="Generate Report">📄 Generate Report</button>
                </div>
            </div>

            <!-- Error Container -->
            <div id="errorContainer"></div>

            <!-- Tab Content: Executive Summary -->
            <div class="tab-content active" id="tab-executive">
                <div id="executive-container"></div>
            </div>

            <!-- Tab Content: Overview -->
            <div class="tab-content" id="tab-overview">
                <div id="overview-container"></div>
            </div>

            <!-- Tab Content: Tech Stack -->
            <div class="tab-content" id="tab-tech-stack">
                <div id="tech-stack-container"></div>
            </div>

            <!-- Tab Content: Security -->
            <div class="tab-content" id="tab-security">
                <div id="security-container"></div>
            </div>

            <!-- Tab Content: Use Cases -->
            <div class="tab-content" id="tab-use-cases">
                <div id="use-cases-container"></div>
            </div>

            <!-- Tab Content: Recommendations -->
            <div class="tab-content" id="tab-recommendations">
                <div id="recommendations-container"></div>
            </div>

            <!-- Tab Content: Architecture -->
            <div class="tab-content" id="tab-architecture">
                <div id="architecture-container"></div>
            </div>

            <!-- Tab Content: Code Organization -->
            <div class="tab-content" id="tab-code-org">
                <div id="code-org-container"></div>
            </div>

            <!-- Tab Content: Dependencies -->
            <div class="tab-content" id="tab-vendors">
                <div id="vendors-container"></div>
            </div>

            <!-- Tab Content: Onboarding -->
            <div class="tab-content" id="tab-engineering">
                <div id="engineering-container"></div>
            </div>
        </main>
    </div>

    <!-- Core Application Script -->
    <script type="module" src="app.js"></script>

    <!-- Tab Component Scripts -->
    <script type="module" src="components/executive-tab.js"></script>
    <script type="module" src="components/overview-tab.js"></script>
    <script type="module" src="components/overview-tab-v3.js"></script>
    <script type="module" src="components/tech-stack-tab.js"></script>
    <script type="module" src="components/security-tab.js"></script>
    <script type="module" src="components/use-cases-tab.js"></script>
    <script type="module" src="components/recommendations-tab.js"></script>
    <script type="module" src="components/architecture-tab.js"></script>
    <script type="module" src="components/code-org-tab.js"></script>
    <script type="module" src="components/vendors-tab.js"></script>
    <script type="module" src="components/engineering-onboarding-tab.js"></script>
    <script type="module" src="components/onboarding-tab.js"></script>

    <!-- Utility Components -->
    <script type="module" src="components/architecture-panels.js"></script>
    <script type="module" src="components/executive-intelligence-panel.js"></script>
    <script type="module" src="components/reconciliation-widget.js"></script>
    <script type="module" src="components/package-health-dashboard.js"></script>

    <!-- Global Functions -->
    <script>
        /**
         * Switch between dashboard tabs
         * @param {string} tabName - The tab to switch to
         */
        function switchTab(tabName) {
            // Note: This function is now deprecated - tab switching handled by setupTabNavigation() in app.js
            // Kept for backwards compatibility but not called by nav tabs
            
            // Update active nav tab
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            const activeNav = document.querySelector(`.nav-tab[data-tab="${tabName}"]`);
            if (activeNav) {
                activeNav.classList.add('active');
            }

            // Update active content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            const activeContent = document.getElementById(`tab-${tabName}`);
            if (activeContent) {
                activeContent.classList.add('active');
            }

            // Update title
            const titles = {
                'executive': 'Executive Summary',
                'overview': 'System Overview',
                'tech-stack': 'Tech Stack',
                'security': 'Security',
                'use-cases': 'Use Cases',
                'recommendations': 'Recommendations',
                'architecture': 'Architecture',
                'code-org': 'Code Organization',
                'vendors': 'Dependencies',
                'engineering': 'Engineering Onboarding'
            };
            const titleElement = document.getElementById('contentTitle');
            if (titleElement && titles[tabName]) {
                titleElement.textContent = titles[tabName];
            }

            // Trigger tab change event for app.js
            window.dispatchEvent(new CustomEvent('tabChange', { detail: { tab: tabName } }));
        }

        /**
         * Handle data source change
         * @param {string} source - The data source to switch to
         */
        function handleSourceChange(source) {
            console.log('Changing data source to:', source);
            window.dispatchEvent(new CustomEvent('sourceChange', { detail: { source } }));
        }

        /**
         * Refresh dashboard data
         */
        function refreshData() {
            console.log('Refreshing dashboard data');
            window.dispatchEvent(new CustomEvent('refreshData'));
        }

        /**
         * Export dashboard data
         */
        function exportData() {
            console.log('Exporting dashboard data');
            window.dispatchEvent(new CustomEvent('exportData'));
        }

        /**
         * Generate full dashboard report
         */
        function generateReport() {
            console.log('Generating dashboard report');
            window.dispatchEvent(new CustomEvent('generateReport'));
        }

        /**
         * Export specific tab data
         */
        function exportExecutive() {
            window.dispatchEvent(new CustomEvent('exportExecutive'));
        }

        function exportSecurity() {
            window.dispatchEvent(new CustomEvent('exportSecurity'));
        }

        function exportRecommendations() {
            window.dispatchEvent(new CustomEvent('exportRecommendations'));
        }

        function exportArchitecture() {
            window.dispatchEvent(new CustomEvent('exportArchitecture'));
        }

        function exportCodeOrg() {
            window.dispatchEvent(new CustomEvent('exportCodeOrg'));
        }

        function exportVendors() {
            window.dispatchEvent(new CustomEvent('exportVendors'));
        }
    </script>
</body>
</html>
