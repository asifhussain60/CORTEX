<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Parameter Diagnostic</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #00ff88;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .section {
            background: #16213e;
            border: 1px solid #00ff88;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
        }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
        .warning { color: #ffa500; }
        h2 { color: #7b61ff; }
        pre {
            background: #0f1419;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 0.5rem;
        }
        button:hover {
            background: #00cc6a;
        }
    </style>
</head>
<body>
    <h1>🔍 Dashboard URL Parameter Diagnostic</h1>
    
    <div class="section">
        <h2>Current URL Analysis</h2>
        <pre id="urlAnalysis"></pre>
    </div>
    
    <div class="section">
        <h2>Source Parameter</h2>
        <pre id="sourceParam"></pre>
    </div>
    
    <div class="section">
        <h2>Expected Data Paths</h2>
        <pre id="dataPaths"></pre>
    </div>
    
    <div class="section">
        <h2>Quick Fixes</h2>
        <button onclick="goToMockDashboard()">Load with source=mock</button>
        <button onclick="goToNoorCanvasDashboard()">Load with source=noor-canvas</button>
        <button onclick="goToDefaultDashboard()">Load with no parameter (default)</button>
    </div>
    
    <div class="section">
        <h2>File Existence Check</h2>
        <pre id="fileCheck"></pre>
        <button onclick="checkFiles()">Check Mock Files</button>
    </div>
    
    <script>
        // Analyze current URL
        function analyzeUrl() {
            const url = window.location.href;
            const urlObj = new URL(url);
            const params = new URLSearchParams(urlObj.search);
            
            const analysis = {
                'Full URL': url,
                'Pathname': urlObj.pathname,
                'Search': urlObj.search,
                'All Parameters': Object.fromEntries(params.entries()),
                'Source Parameter': params.get('source') || 'NOT SET (will default to "mock")',
                'Tab Parameter': params.get('tab') || 'NOT SET (will default to "overview")'
            };
            
            document.getElementById('urlAnalysis').textContent = JSON.stringify(analysis, null, 2);
        }
        
        // Analyze source parameter
        function analyzeSource() {
            const urlParams = new URLSearchParams(window.location.search);
            const source = urlParams.get('source') || 'mock';
            
            const DATA_SOURCES = {
                mock: '/mock/',
                cortex: '/cortex/',
                'noor-canvas': '/noor-canvas/',
                alist: '/alist/',
                ksessions: '/ksessions/'
            };
            
            const basePath = DATA_SOURCES[source];
            
            const sourceInfo = {
                'Detected Source': source,
                'Base Path': basePath || 'UNKNOWN SOURCE',
                'Is Valid': !!basePath,
                'Warning': source === 'noor-canvas' ? 
                    '⚠️  Using noor-canvas source - may have incomplete data' : 
                    source === 'mock' ? 
                    '✅ Using mock source - recommended for testing' : 
                    '❓ Using non-standard source'
            };
            
            document.getElementById('sourceParam').textContent = JSON.stringify(sourceInfo, null, 2);
        }
        
        // Show expected data paths
        function showDataPaths() {
            const urlParams = new URLSearchParams(window.location.search);
            const source = urlParams.get('source') || 'mock';
            
            const DATA_SOURCES = {
                mock: '/mock/',
                cortex: '/cortex/',
                'noor-canvas': '/noor-canvas/',
                alist: '/alist/',
                ksessions: '/ksessions/'
            };
            
            const basePath = DATA_SOURCES[source];
            
            const DATA_FILES = [
                'health-data.json',
                'tech-stack.json',
                'security.json',
                'architecture.json',
                'code-organization.json',
                'team-metrics.json',
                'vendors.json'
            ];
            
            const paths = DATA_FILES.map(file => `${basePath}${file}`);
            
            const pathInfo = {
                'Source': source,
                'Base Path': basePath,
                'Expected File URLs': paths
            };
            
            document.getElementById('dataPaths').textContent = JSON.stringify(pathInfo, null, 2);
        }
        
        // Check if files exist
        async function checkFiles() {
            const output = document.getElementById('fileCheck');
            output.textContent = 'Checking files...\n';
            
            const source = 'mock'; // Check mock files
            const basePath = '/mock/';
            
            const DATA_FILES = [
                'health-data.json',
                'tech-stack.json',
                'security.json',
                'architecture.json',
                'code-organization.json',
                'team-metrics.json',
                'vendors.json'
            ];
            
            const results = [];
            
            for (const file of DATA_FILES) {
                const url = `${basePath}${file}`;
                try {
                    const response = await fetch(url);
                    results.push({
                        file,
                        url,
                        status: response.status,
                        exists: response.ok
                    });
                } catch (error) {
                    results.push({
                        file,
                        url,
                        status: 'ERROR',
                        exists: false,
                        error: error.message
                    });
                }
            }
            
            output.textContent = JSON.stringify(results, null, 2);
        }
        
        // Navigation functions
        function goToMockDashboard() {
            window.location.href = '/ui/index.html?source=mock';
        }
        
        function goToNoorCanvasDashboard() {
            window.location.href = '/ui/index.html?source=noor-canvas';
        }
        
        function goToDefaultDashboard() {
            window.location.href = '/ui/index.html';
        }
        
        // Run diagnostics on load
        analyzeUrl();
        analyzeSource();
        showDataPaths();
    </script>
</body>
</html>
