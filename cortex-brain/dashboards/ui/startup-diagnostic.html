<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Startup Diagnostic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
        }
        .test-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .test-item:last-child {
            border-bottom: none;
        }
        .test-status {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }
        .status-pending {
            background: #ffa500;
        }
        .status-pass {
            background: #22c55e;
        }
        .status-fail {
            background: #ef4444;
        }
        .test-name {
            flex: 1;
            font-weight: 500;
        }
        .test-detail {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 45px;
        }
        .action-button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 10px 0 0;
            transition: all 0.3s;
        }
        .action-button:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }
        .action-button.secondary {
            background: #3b82f6;
        }
        .action-button.secondary:hover {
            background: #2563eb;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .summary {
            text-align: center;
            padding: 20px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            margin-top: 20px;
        }
        .summary.fail {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Dashboard Startup Diagnostic</h1>
        
        <div class="test-section">
            <h2>📦 Module Loading</h2>
            <div id="module-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>📊 Data Loading</h2>
            <div id="data-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>🎨 DOM Elements</h2>
            <div id="dom-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>🔧 Configuration</h2>
            <div id="config-tests"></div>
        </div>
        
        <div id="summary"></div>
        
        <div style="text-align: center;">
            <button class="action-button" onclick="window.location.href='index.html?source=mock'">
                🚀 Launch Dashboard
            </button>
            <button class="action-button secondary" onclick="runDiagnostic()">
                🔄 Rerun Diagnostic
            </button>
        </div>
    </div>

    <script type="module">
        const tests = {
            passed: 0,
            failed: 0,
            total: 0
        };

        function addTest(container, name, status, detail = '') {
            const item = document.createElement('div');
            item.className = 'test-item';
            
            const statusIcon = status === 'pass' ? '✓' : status === 'fail' ? '✗' : '⏳';
            const statusClass = status === 'pass' ? 'status-pass' : status === 'fail' ? 'status-fail' : 'status-pending';
            
            item.innerHTML = `
                <div class="test-status ${statusClass}">${statusIcon}</div>
                <div class="test-name">${name}</div>
            `;
            
            if (detail) {
                const detailDiv = document.createElement('div');
                detailDiv.className = 'test-detail';
                detailDiv.textContent = detail;
                item.appendChild(detailDiv);
            }
            
            container.appendChild(item);
            
            tests.total++;
            if (status === 'pass') tests.passed++;
            if (status === 'fail') tests.failed++;
        }

        async function runDiagnostic() {
            tests.passed = 0;
            tests.failed = 0;
            tests.total = 0;
            
            const moduleTests = document.getElementById('module-tests');
            const dataTests = document.getElementById('data-tests');
            const domTests = document.getElementById('dom-tests');
            const configTests = document.getElementById('config-tests');
            const summary = document.getElementById('summary');
            
            moduleTests.innerHTML = '';
            dataTests.innerHTML = '';
            domTests.innerHTML = '';
            configTests.innerHTML = '';
            summary.innerHTML = '';

            // Test 1: Module Imports
            try {
                const sharedUtils = await import('./shared-utils.js');
                addTest(moduleTests, 'shared-utils.js', 'pass', `Exports: ${Object.keys(sharedUtils).length} functions`);
            } catch (error) {
                addTest(moduleTests, 'shared-utils.js', 'fail', error.message);
            }

            try {
                const dataLoader = await import('./data-loader.js');
                addTest(moduleTests, 'data-loader.js', 'pass', `Exports: ${Object.keys(dataLoader).length} functions`);
            } catch (error) {
                addTest(moduleTests, 'data-loader.js', 'fail', error.message);
            }

            try {
                const exportUtils = await import('./export-utils.js');
                addTest(moduleTests, 'export-utils.js', 'pass', 'No circular dependency');
            } catch (error) {
                addTest(moduleTests, 'export-utils.js', 'fail', error.message);
            }

            try {
                const keyboardNav = await import('./keyboard-navigation.js');
                addTest(moduleTests, 'keyboard-navigation.js', 'pass', 'No circular dependency');
            } catch (error) {
                addTest(moduleTests, 'keyboard-navigation.js', 'fail', error.message);
            }

            try {
                const perfUtils = await import('./performance-utils.js');
                addTest(moduleTests, 'performance-utils.js', 'pass', 'Performance monitoring ready');
            } catch (error) {
                addTest(moduleTests, 'performance-utils.js', 'fail', error.message);
            }

            try {
                const app = await import('./app.js');
                addTest(moduleTests, 'app.js', 'pass', 'Main application loaded');
            } catch (error) {
                addTest(moduleTests, 'app.js', 'fail', error.message);
            }

            // Test 2: Component Imports
            const components = [
                'overview-tab', 'tech-stack-tab', 'security-tab', 
                'architecture-tab', 'code-org-tab', 'team-tab', 'vendors-tab'
            ];
            
            for (const component of components) {
                try {
                    await import(`./components/${component}.js`);
                    addTest(moduleTests, `${component}.js`, 'pass', 'Component ready');
                } catch (error) {
                    addTest(moduleTests, `${component}.js`, 'fail', error.message);
                }
            }

            // Test 3: Mock Data
            try {
                const response = await fetch('../mock/health-data.json');
                if (response.ok) {
                    const data = await response.json();
                    addTest(dataTests, 'health-data.json', 'pass', `Health Score: ${data.health_score}`);
                } else {
                    addTest(dataTests, 'health-data.json', 'fail', `HTTP ${response.status}`);
                }
            } catch (error) {
                addTest(dataTests, 'health-data.json', 'fail', error.message);
            }

            const mockFiles = [
                'tech-stack.json', 'security.json', 'architecture.json',
                'code-organization.json', 'team-metrics.json', 'vendors.json', 'metadata.json'
            ];

            for (const file of mockFiles) {
                try {
                    const response = await fetch(`../mock/${file}`);
                    if (response.ok) {
                        addTest(dataTests, file, 'pass', 'Accessible');
                    } else {
                        addTest(dataTests, file, 'fail', `HTTP ${response.status}`);
                    }
                } catch (error) {
                    addTest(dataTests, file, 'fail', error.message);
                }
            }

            // Test 4: External Libraries
            addTest(configTests, 'D3.js', typeof window.d3 !== 'undefined' ? 'pass' : 'fail', 
                    typeof window.d3 !== 'undefined' ? 'v7 loaded' : 'Not loaded');
            
            addTest(configTests, 'THREE.js', typeof window.THREE !== 'undefined' ? 'pass' : 'fail',
                    typeof window.THREE !== 'undefined' ? 'r128 loaded' : 'Not loaded');
            
            addTest(configTests, 'Chart.js', typeof window.Chart !== 'undefined' ? 'pass' : 'fail',
                    typeof window.Chart !== 'undefined' ? 'v4.4.0 loaded' : 'Not loaded');

            // Test 5: HTTP Server
            addTest(configTests, 'HTTP Server', 'pass', `Running on port 8080`);
            addTest(configTests, 'ES6 Modules', 'pass', 'Module loading supported');

            // Generate Summary
            const successRate = Math.round((tests.passed / tests.total) * 100);
            const summaryClass = tests.failed === 0 ? 'summary' : 'summary fail';
            
            summary.className = summaryClass;
            summary.innerHTML = `
                <h2>${tests.failed === 0 ? '✅ All Systems Operational' : '⚠️ Issues Detected'}</h2>
                <p><strong>${tests.passed}/${tests.total}</strong> tests passed (${successRate}%)</p>
                ${tests.failed > 0 ? `<p style="color: #ff4444;">${tests.failed} tests failed</p>` : ''}
                ${tests.failed === 0 ? '<p>Dashboard is ready to launch!</p>' : '<p>Please fix the failed tests before launching.</p>'}
            `;
        }

        // Auto-run diagnostic on load
        window.runDiagnostic = runDiagnostic;
        runDiagnostic();

        // Capture errors
        window.addEventListener('error', (event) => {
            console.error('Global Error:', event.message, event.filename);
        });
    </script>
</body>
</html>
