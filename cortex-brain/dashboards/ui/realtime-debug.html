<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Debug - Real-time Console</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00d4ff;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }
        .console {
            background: #1a1f3a;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            max-height: 600px;
            overflow-y: auto;
        }
        .log { color: #a0a6c0; padding: 3px 0; }
        .log-info { color: #00d4ff; }
        .log-success { color: #00ff88; font-weight: bold; }
        .log-error { color: #ff4444; font-weight: bold; }
        .log-warn { color: #ffa500; }
        button {
            background: #00d4ff;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00b8e6; }
        .status {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Real-Time Debug Console</h1>
    
    <div class="status">
        <div><strong>Server:</strong> http://localhost:8080</div>
        <div><strong>Dashboard URL:</strong> /ui/index.html?source=mock</div>
        <div><strong>Mock Data Path:</strong> /mock/*.json</div>
    </div>

    <button onclick="testAll()">Run All Tests</button>
    <button onclick="testData()">Test Data Only</button>
    <button onclick="testModules()">Test Modules Only</button>
    <button onclick="loadDashboard()">Load Dashboard in iframe</button>
    <button onclick="clearConsole()">Clear</button>

    <div class="console" id="console"></div>

    <div id="iframe-container" style="margin-top: 20px; display: none;">
        <h2>Dashboard iframe:</h2>
        <iframe id="dashboard" src="" style="width: 100%; height: 600px; border: 2px solid #00d4ff; border-radius: 5px;"></iframe>
    </div>

    <script type="module">
        const consoleEl = document.getElementById('console');
        
        function log(message, type = 'log') {
            const entry = document.createElement('div');
            entry.className = `log log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            consoleEl.appendChild(entry);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(message);
        }

        window.clearConsole = () => {
            consoleEl.innerHTML = '';
            log('Console cleared', 'info');
        };

        window.testData = async () => {
            log('=== TESTING MOCK DATA ===', 'info');
            
            const files = [
                'health-data.json',
                'tech-stack.json',
                'security.json',
                'architecture.json',
                'code-organization.json',
                'team-metrics.json',
                'vendors.json'
            ];

            for (const file of files) {
                try {
                    log(`Fetching /mock/${file}...`, 'info');
                    const response = await fetch(`/mock/${file}`);
                    
                    if (!response.ok) {
                        log(`❌ ${file}: HTTP ${response.status} ${response.statusText}`, 'error');
                        continue;
                    }
                    
                    const data = await response.json();
                    log(`✓ ${file}: ${Object.keys(data).length} keys`, 'success');
                    
                } catch (error) {
                    log(`❌ ${file}: ${error.message}`, 'error');
                }
            }
        };

        window.testModules = async () => {
            log('=== TESTING MODULE IMPORTS ===', 'info');
            
            const modules = [
                { path: '/ui/shared-utils.js', name: 'shared-utils' },
                { path: '/ui/data-loader.js', name: 'data-loader' },
                { path: '/ui/export-utils.js', name: 'export-utils' },
                { path: '/ui/keyboard-navigation.js', name: 'keyboard-navigation' },
                { path: '/ui/performance-utils.js', name: 'performance-utils' },
                { path: '/ui/app.js', name: 'app' },
            ];

            for (const mod of modules) {
                try {
                    log(`Importing ${mod.name}...`, 'info');
                    const module = await import(mod.path);
                    log(`✓ ${mod.name}: ${Object.keys(module).length} exports`, 'success');
                } catch (error) {
                    log(`❌ ${mod.name}: ${error.message}`, 'error');
                    log(`   Stack: ${error.stack.split('\\n')[0]}`, 'error');
                }
            }
        };

        window.testAll = async () => {
            log('=== STARTING COMPREHENSIVE TEST ===', 'info');
            await testData();
            await testModules();
            log('=== TEST COMPLETE ===', 'success');
        };

        window.loadDashboard = () => {
            log('Loading dashboard in iframe...', 'info');
            const container = document.getElementById('iframe-container');
            const iframe = document.getElementById('dashboard');
            iframe.src = '/ui/index.html?source=mock';
            container.style.display = 'block';
            
            iframe.onload = () => {
                log('✓ Dashboard iframe loaded', 'success');
                log('Check iframe above for visual result', 'info');
            };
            
            iframe.onerror = () => {
                log('❌ Dashboard iframe failed to load', 'error');
            };
        };

        // Capture all console messages
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            log(`Console Error: ${args.join(' ')}`, 'error');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            log(`Console Warning: ${args.join(' ')}`, 'warn');
        };

        // Auto-run basic test on load
        log('Debug console ready. Click "Run All Tests" to start.', 'success');
        log('Or click "Load Dashboard" to see it in an iframe.', 'info');
    </script>
</body>
</html>
