<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Debug Console</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1f3a;
            color: #00ff88;
            padding: 20px;
        }
        .log-entry {
            padding: 5px 10px;
            margin: 5px 0;
            border-left: 3px solid #00d4ff;
            background: rgba(255, 255, 255, 0.05);
        }
        .error {
            border-left-color: #ff4444;
            color: #ff4444;
        }
        .success {
            border-left-color: #00ff88;
        }
        .info {
            border-left-color: #ffa500;
        }
        h1 {
            color: #00d4ff;
        }
        button {
            background: #00d4ff;
            color: #1a1f3a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 10px 10px 0;
            font-weight: bold;
        }
        button:hover {
            background: #00b8e6;
        }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Debug Console</h1>
    <p>Testing module imports and data loading...</p>
    
    <button onclick="testModules()">Test Module Imports</button>
    <button onclick="testDataLoading()">Test Data Loading</button>
    <button onclick="testDashboard()">Load Full Dashboard</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script type="module">
        const logs = document.getElementById('logs');
        
        window.log = function(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            console.log(message);
        };
        
        window.clearLogs = function() {
            logs.innerHTML = '';
        };
        
        window.testModules = async function() {
            log('🧪 Testing module imports...', 'info');
            
            try {
                log('→ Importing shared-utils.js...', 'info');
                const sharedUtils = await import('./shared-utils.js');
                log('✓ shared-utils.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(sharedUtils).join(', ')}`, 'info');
                
                log('→ Importing data-loader.js...', 'info');
                const dataLoader = await import('./data-loader.js');
                log('✓ data-loader.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(dataLoader).join(', ')}`, 'info');
                
                log('→ Importing export-utils.js...', 'info');
                const exportUtils = await import('./export-utils.js');
                log('✓ export-utils.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(exportUtils).join(', ')}`, 'info');
                
                log('→ Importing keyboard-navigation.js...', 'info');
                const keyboardNav = await import('./keyboard-navigation.js');
                log('✓ keyboard-navigation.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(keyboardNav).join(', ')}`, 'info');
                
                log('→ Importing performance-utils.js...', 'info');
                const perfUtils = await import('./performance-utils.js');
                log('✓ performance-utils.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(perfUtils).join(', ')}`, 'info');
                
                log('→ Importing app.js...', 'info');
                const app = await import('./app.js');
                log('✓ app.js loaded successfully', 'success');
                log(`  Exports: ${Object.keys(app).join(', ')}`, 'info');
                
                log('✅ All modules loaded successfully! No circular dependencies.', 'success');
                
            } catch (error) {
                log(`❌ Module import failed: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        };
        
        window.testDataLoading = async function() {
            log('🔄 Testing data loading...', 'info');
            
            try {
                log('→ Fetching health-data.json...', 'info');
                const response = await fetch('../mock/health-data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('✓ health-data.json loaded successfully', 'success');
                log(`  Health Score: ${data.health_score}`, 'info');
                log(`  Total Files: ${data.total_files}`, 'info');
                log(`  Test Coverage: ${data.test_coverage}%`, 'info');
                
                log('→ Testing data-loader module...', 'info');
                const { loadDashboardData } = await import('./data-loader.js');
                
                log('→ Loading dashboard data via data-loader...', 'info');
                const dashboardData = await loadDashboardData('mock');
                log('✓ Dashboard data loaded via module', 'success');
                log(`  Sections: ${Object.keys(dashboardData).join(', ')}`, 'info');
                
                log('✅ Data loading working correctly!', 'success');
                
            } catch (error) {
                log(`❌ Data loading failed: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        };
        
        window.testDashboard = async function() {
            log('🚀 Testing full dashboard initialization...', 'info');
            
            try {
                log('→ Checking if dashboard container exists...', 'info');
                
                // Check if we're on index.html
                if (!window.location.pathname.includes('index.html')) {
                    log('⚠ Not on index.html page', 'error');
                    log('→ Redirecting to index.html...', 'info');
                    window.location.href = 'index.html?source=mock';
                    return;
                }
                
                const container = document.querySelector('.dashboard-container');
                if (!container) {
                    log('❌ Dashboard container not found in DOM', 'error');
                    return;
                }
                
                log('✓ Dashboard container found', 'success');
                log(`  Display: ${container.style.display}`, 'info');
                
                log('→ Importing app.js...', 'info');
                const app = await import('./app.js');
                
                if (typeof app.initializeApp !== 'function') {
                    log('❌ initializeApp function not found in app.js', 'error');
                    log(`  Available exports: ${Object.keys(app).join(', ')}`, 'error');
                    return;
                }
                
                log('→ Calling initializeApp()...', 'info');
                await app.initializeApp();
                
                log('✅ Dashboard initialized successfully!', 'success');
                
            } catch (error) {
                log(`❌ Dashboard initialization failed: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        };
        
        // Auto-run module test on load
        log('🔍 Dashboard Debug Console Ready', 'success');
        log('Click "Test Module Imports" to verify no circular dependencies', 'info');
        
        // Capture console errors
        window.addEventListener('error', (event) => {
            log(`❌ Global Error: ${event.message}`, 'error');
            log(`  File: ${event.filename}:${event.lineno}:${event.colno}`, 'error');
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            log(`❌ Unhandled Promise Rejection: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
