# Code Review Agent
# CORTEX Knowledge Base - Learning Agents
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "learning-agents"
  subcategory: "code-review"

# Agent Architecture
architecture:
  type: "Specialist Agent"
  parent: "CORTEX Agent Framework"
  dependencies:
    - "code-review.yaml (knowledge base)"
    - "clean-code.yaml (principles)"
    - "solid-principles.yaml (patterns)"
    - "security.yaml (vulnerabilities)"

# Review Capabilities
capabilities:
  automated_checks:
    - name: "Style and Formatting"
      checks: ["Naming conventions", "Indentation", "Line length", "Comments"]
      severity: "LOW"
      
    - name: "Code Quality"
      checks: ["SOLID violations", "Code smells", "Complexity", "Duplication"]
      severity: "MEDIUM"
      knowledge_sources: ["clean-code.yaml", "refactoring.yaml"]
      
    - name: "Security"
      checks: ["SQL injection", "XSS", "Authentication", "Data exposure"]
      severity: "HIGH"
      knowledge_sources: ["security.yaml", "owasp-top-10.yaml"]
      
    - name: "Performance"
      checks: ["N+1 queries", "Inefficient algorithms", "Resource leaks"]
      severity: "MEDIUM"
      knowledge_sources: ["performance-optimization.yaml"]
      
    - name: "Testing"
      checks: ["Test coverage", "Test quality", "Missing tests"]
      severity: "MEDIUM"
      knowledge_sources: ["testing-strategies.yaml"]

# Review Process
review_process:
  stages:
    - name: "Diff Analysis"
      actions:
        - "Parse git diff"
        - "Identify changed files and lines"
        - "Extract added/modified functions"
      
    - name: "Context Retrieval"
      actions:
        - "Retrieve relevant best practices from knowledge base"
        - "Load similar code patterns from Tier 2"
        - "Get SKULL rules from Tier 0"
      
    - name: "Analysis"
      actions:
        - "Run automated checks"
        - "AST-based analysis"
        - "Pattern matching against anti-patterns"
        - "Security vulnerability scanning"
      
    - name: "Scoring"
      actions:
        - "Calculate quality score (0-10)"
        - "Count violations by severity"
        - "Generate improvement metrics"
      
    - name: "Report Generation"
      actions:
        - "Group findings by file and severity"
        - "Generate actionable recommendations"
        - "Link to relevant knowledge base articles"
        - "Create summary with metrics"

# Integration with CORTEX
cortex_integration:
  triggers:
    - "Manual: `review code` command"
    - "Git hook: pre-commit/pre-push"
    - "CI/CD: automated PR reviews"
    - "ADO: automatic work item reviews"
  
  knowledge_retrieval:
    tier0: "SKULL rules for mandatory checks"
    tier1: "Recent code review patterns"
    tier2: "Best practices and patterns"
    tier3: "Project-specific metrics and hotspots"
  
  learning:
    - "Store review feedback in Tier 1"
    - "Update pattern frequency in Tier 2"
    - "Track common violations for targeted guidance"

# Output Format
output_format:
  structure:
    summary:
      total_files: 5
      total_issues: 23
      critical: 2
      high: 5
      medium: 10
      low: 6
      quality_score: 7.2
    
    findings:
      - file: "src/auth/login.py"
        line: 45
        severity: "CRITICAL"
        category: "Security"
        issue: "SQL injection vulnerability"
        recommendation: "Use parameterized queries"
        knowledge_link: "security.yaml#sql-injection"
        code_snippet: "SELECT * FROM users WHERE username = '\" + username + \"'"
        suggested_fix: "SELECT * FROM users WHERE username = %s"
    
    metrics:
      complexity: "Average: 12, Max: 28 (login_handler)"
      duplication: "15% code duplication detected"
      test_coverage: "68% (target: 80%)"

# Advanced Features
advanced_features:
  contextual_analysis:
    description: "Understand code context beyond syntax"
    techniques:
      - "Call graph analysis"
      - "Data flow tracking"
      - "Semantic understanding via embeddings"
  
  historical_learning:
    description: "Learn from past reviews"
    capabilities:
      - "Remember previously flagged issues"
      - "Track team-specific patterns"
      - "Adjust severity based on context"
  
  comparative_analysis:
    description: "Compare with similar code in codebase"
    benefits:
      - "Consistency recommendations"
      - "Suggest established patterns"
      - "Flag deviations from team style"

# Quality Scoring Model
scoring:
  formula: "weighted_average(category_scores)"
  weights:
    security: 0.30
    code_quality: 0.25
    performance: 0.15
    testing: 0.15
    style: 0.10
    documentation: 0.05
  
  categories:
    security:
      perfect: "No vulnerabilities, all inputs validated"
      good: "Minor security improvements needed"
      poor: "Critical vulnerabilities present"
    
    code_quality:
      perfect: "Follows SOLID, no code smells, complexity < 10"
      good: "Minor refactoring opportunities"
      poor: "SOLID violations, high complexity, duplication"

# Example Usage
examples:
  basic_review: |
    # Command
    cortex review code
    
    # Output
    ## Code Review Report
    **Quality Score:** 7.2/10
    
    ### Critical Issues (2)
    1. **SQL Injection** in `auth/login.py:45`
       - Use parameterized queries
       - See: security.yaml#sql-injection
    
    ### High Priority (5)
    1. **Complexity** in `orders/process.py:120`
       - Cyclomatic complexity: 28 (target: < 10)
       - Extract methods to reduce complexity
  
  continuous_review: |
    # Git hook integration
    git commit
    # → CORTEX agent runs
    # → Blocks commit if critical issues found
    # → Provides inline feedback

related_knowledge:
  - "code-review.yaml"
  - "clean-code.yaml"
  - "security.yaml"
  - "refactoring.yaml"
