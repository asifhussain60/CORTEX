# Architecture Advisor Agent
# CORTEX Knowledge Base - Learning Agents
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "learning-agents"
  subcategory: "architecture"

# Agent Architecture
architecture:
  type: "Specialist Agent"
  parent: "CORTEX Agent Framework"
  dependencies:
    - "design-patterns.yaml"
    - "architecture-patterns.yaml"
    - "anti-patterns.yaml"
    - "domain-driven-design.yaml"

# Advisory Capabilities
capabilities:
  architecture_review:
    - name: "Structure Analysis"
      checks: ["Layer separation", "Dependency direction", "Coupling", "Cohesion"]
      
    - name: "Pattern Detection"
      checks: ["Design patterns used", "Architecture style", "Communication patterns"]
      
    - name: "Anti-pattern Detection"
      checks: ["God objects", "Spaghetti code", "Circular dependencies"]
      
    - name: "Scalability Assessment"
      checks: ["Horizontal scalability", "Stateless design", "Caching strategy"]
      
    - name: "Maintainability"
      checks: ["Module boundaries", "Code organization", "Documentation"]

# Analysis Framework
analysis_framework:
  dimensions:
    - dimension: "Modularity"
      metrics: ["Module count", "Module size", "Inter-module dependencies"]
      score: "0-10"
      
    - dimension: "Scalability"
      metrics: ["Stateless components", "Caching", "Async processing"]
      score: "0-10"
      
    - dimension: "Resilience"
      metrics: ["Error handling", "Circuit breakers", "Retry logic"]
      score: "0-10"
      
    - dimension: "Security"
      metrics: ["Defense in depth", "Least privilege", "Secure by default"]
      score: "0-10"
      
    - dimension: "Maintainability"
      metrics: ["Code organization", "Documentation", "Test coverage"]
      score: "0-10"

# Advisory Process
advisory_process:
  stages:
    - name: "Codebase Analysis"
      actions:
        - "Parse project structure"
        - "Build dependency graph"
        - "Identify architectural layers"
        - "Detect patterns and anti-patterns"
    
    - name: "Knowledge Retrieval"
      actions:
        - "Retrieve relevant patterns from knowledge base"
        - "Load similar architectures from Tier 2"
        - "Get best practices for detected patterns"
    
    - name: "Evaluation"
      actions:
        - "Score each dimension"
        - "Identify architectural smells"
        - "Compare with industry standards"
        - "Assess evolution risks"
    
    - name: "Recommendation"
      actions:
        - "Prioritize improvements"
        - "Suggest refactoring strategies"
        - "Provide migration paths"
        - "Link to pattern documentation"

# Pattern Recognition
pattern_recognition:
  design_patterns:
    detected:
      - "Factory Pattern (4 instances)"
      - "Strategy Pattern (2 instances)"
      - "Repository Pattern (8 instances)"
    missing:
      - "Circuit Breaker (recommended for external APIs)"
      - "Saga Pattern (recommended for distributed transactions)"
  
  architecture_styles:
    identified:
      primary: "Layered Architecture"
      secondary: "Microservices (partial)"
      recommended_evolution: "Event-Driven Architecture for scalability"

# Recommendation Engine
recommendation_engine:
  prioritization:
    factors:
      - "Impact on system quality"
      - "Implementation effort"
      - "Risk of change"
      - "Business value"
    
    algorithm: "Weighted scoring"
  
  output:
    - priority: "HIGH"
      title: "Implement Circuit Breaker for external API calls"
      reason: "Prevent cascading failures"
      effort: "Medium (2-3 days)"
      knowledge_link: "architecture-patterns.yaml#circuit-breaker"
      
    - priority: "MEDIUM"
      title: "Refactor UserService (God Object anti-pattern)"
      reason: "Improve maintainability and testability"
      effort: "High (5-7 days)"
      knowledge_link: "anti-patterns.yaml#god-object"

# Integration with CORTEX
cortex_integration:
  triggers:
    - "Manual: `advise architecture` command"
    - "Planning: during feature planning phase"
    - "Review: post-implementation architectural review"
  
  knowledge_sources:
    tier2:
      - "Proven architectural patterns"
      - "Company architectural standards"
      - "Past architectural decisions"
    tier3:
      - "Codebase metrics"
      - "Hotspot analysis"
      - "Change frequency"
  
  learning:
    - "Store architectural decisions in Tier 2"
    - "Track pattern effectiveness"
    - "Update recommendations based on outcomes"

# Output Format
output_format:
  structure:
    overall_score: 7.5
    dimensions:
      modularity: 8.2
      scalability: 6.5
      resilience: 7.0
      security: 8.5
      maintainability: 7.3
    
    findings:
      strengths:
        - "Well-defined service boundaries"
        - "Good use of Repository pattern"
        - "Strong authentication layer"
      
      concerns:
        - "UserService is a God Object (1,200 lines)"
        - "Missing circuit breaker for external APIs"
        - "Tight coupling between OrderService and PaymentService"
      
      recommendations:
        high_priority: [...]
        medium_priority: [...]
        low_priority: [...]
    
    migration_roadmap:
      - phase: "Phase 1: Resilience (2 weeks)"
        tasks:
          - "Add circuit breaker pattern"
          - "Implement retry logic"
      - phase: "Phase 2: Refactoring (4 weeks)"
        tasks:
          - "Split UserService"
          - "Decouple OrderService and PaymentService"

# Advanced Features
advanced_features:
  evolutionary_architecture:
    description: "Guide incremental architecture improvements"
    approach: "Fitness functions + automated checks"
    
  comparative_analysis:
    description: "Compare with similar successful projects"
    benefits:
      - "Learn from proven patterns"
      - "Avoid known pitfalls"
      - "Industry benchmarking"
  
  decision_tracking:
    description: "ADR (Architecture Decision Records) management"
    capabilities:
      - "Suggest ADRs for significant decisions"
      - "Link recommendations to past decisions"
      - "Track decision rationale"

related_knowledge:
  - "design-patterns.yaml"
  - "architecture-patterns.yaml"
  - "anti-patterns.yaml"
  - "domain-driven-design.yaml"
