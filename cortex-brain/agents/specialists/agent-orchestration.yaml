# Agent Orchestration
# CORTEX Knowledge Base - Learning Agents
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "learning-agents"
  subcategory: "orchestration"

# Orchestration Architecture
architecture:
  coordinator: "CORTEX Master Agent"
  specialist_agents:
    - "Code Review Agent"
    - "Security Scanner Agent"
    - "Architecture Advisor Agent"
    - "TDD Agent"
    - "Planning Agent"
  
  communication: "Event-driven + Direct invocation"

# Orchestration Patterns
patterns:
  sequential:
    description: "Agents execute in order"
    use_case: "TDD workflow (RED → GREEN → REFACTOR)"
    example: |
      1. TDD Agent (RED): Generate failing tests
      2. TDD Agent (GREEN): Implement minimal code
      3. Code Review Agent: Review implementation
      4. TDD Agent (REFACTOR): Apply review suggestions
      5. Security Scanner Agent: Final security check
  
  parallel:
    description: "Agents execute simultaneously"
    use_case: "Comprehensive code review"
    example: |
      1. Code Review Agent (quality) ║
      2. Security Scanner Agent (vulnerabilities) ║ → Aggregate results
      3. Architecture Advisor Agent (structure) ║
  
  hierarchical:
    description: "Coordinator delegates to specialists"
    use_case: "Feature implementation"
    example: |
      1. Planning Agent: Create implementation plan
      2. Coordinator: Distribute tasks to specialists
         - TDD Agent: Implement feature with tests
         - Code Review Agent: Review code
         - Security Scanner Agent: Scan for vulnerabilities
      3. Coordinator: Aggregate results and report
  
  collaborative:
    description: "Agents work together iteratively"
    use_case: "Complex refactoring"
    example: |
      1. Architecture Advisor: Identify refactoring needs
      2. Code Review Agent: Analyze current code quality
      3. TDD Agent: Ensure tests exist before refactoring
      4. Architecture Advisor: Guide refactoring
      5. Code Review Agent: Validate refactored code

# Workflow Definitions
workflows:
  comprehensive_review:
    trigger: "code commit"
    agents:
      - agent: "Code Review Agent"
        parallel: true
      - agent: "Security Scanner Agent"
        parallel: true
      - agent: "Architecture Advisor Agent"
        parallel: true
    aggregation: "Merge findings, prioritize by severity"
    
  feature_implementation:
    trigger: "`plan feature X`"
    phases:
      - phase: "Planning"
        agent: "Planning Agent"
        output: "Implementation plan"
      
      - phase: "TDD Implementation"
        agent: "TDD Agent"
        input: "Implementation plan"
        output: "Code with tests"
      
      - phase: "Review"
        agents:
          - "Code Review Agent"
          - "Security Scanner Agent"
        parallel: true
        output: "Review findings"
      
      - phase: "Refinement"
        agent: "TDD Agent"
        input: "Review findings"
        output: "Improved code"
      
      - phase: "Architecture Validation"
        agent: "Architecture Advisor Agent"
        output: "Architectural assessment"
  
  security_hardening:
    trigger: "`harden security`"
    phases:
      - phase: "Scan"
        agent: "Security Scanner Agent"
      - phase: "Prioritize"
        agent: "Coordinator"
      - phase: "Fix"
        agent: "TDD Agent"
        guidance: "Security Scanner recommendations"
      - phase: "Rescan"
        agent: "Security Scanner Agent"

# Inter-Agent Communication
communication:
  message_types:
    - type: "REQUEST"
      description: "Coordinator requests agent action"
      example: "Review this code for security issues"
    
    - type: "RESPONSE"
      description: "Agent returns results"
      example: "Found 3 critical vulnerabilities"
    
    - type: "NOTIFICATION"
      description: "Agent notifies of significant event"
      example: "Refactoring complete, all tests passing"
    
    - type: "QUERY"
      description: "Agent queries knowledge base or another agent"
      example: "What's the recommended pattern for X?"
  
  protocol:
    format: "JSON"
    fields:
      - "agent_id"
      - "message_type"
      - "payload"
      - "timestamp"
      - "correlation_id"

# Conflict Resolution
conflict_resolution:
  scenarios:
    - scenario: "Agents provide contradictory recommendations"
      strategy: "Prioritize by: Security > Quality > Style"
      example: "Security says 'reject', Code Review says 'minor issues' → Reject"
    
    - scenario: "Resource contention"
      strategy: "Priority-based scheduling"
      priorities: "Critical > High > Medium > Low"
    
    - scenario: "Circular dependencies in recommendations"
      strategy: "Break cycle with coordinator decision"

# Knowledge Sharing
knowledge_sharing:
  shared_knowledge:
    - "Code patterns learned by Code Review Agent"
    - "Vulnerabilities detected by Security Scanner"
    - "Architectural patterns identified by Architecture Advisor"
  
  storage: "CORTEX Tier 2 (Knowledge Graph)"
  
  benefits:
    - "Cross-agent learning"
    - "Consistent recommendations"
    - "Evolving expertise"

# Monitoring & Observability
monitoring:
  metrics:
    - "Agent response time"
    - "Recommendation acceptance rate"
    - "Agent agreement score"
    - "False positive rate"
  
  dashboards:
    - "Agent performance dashboard"
    - "Workflow success rate"
    - "Knowledge utilization"

# Example Orchestrated Workflow
example:
  scenario: "User commits code with potential issues"
  workflow: |
    1. Coordinator detects commit
    2. Invoke agents in parallel:
       - Code Review Agent → Quality score: 6.5
       - Security Scanner → 2 critical vulnerabilities
       - Architecture Advisor → God object detected
    3. Coordinator aggregates:
       - Overall status: REJECT (critical vulnerabilities)
       - Prioritized fixes:
         1. Fix SQL injection (CRITICAL)
         2. Fix authentication bypass (CRITICAL)
         3. Refactor God object (HIGH)
    4. User addresses issues
    5. Re-run workflow
    6. All checks pass → APPROVE

related_knowledge:
  - "code-review-agent.yaml"
  - "security-scanner-agent.yaml"
  - "architecture-advisor-agent.yaml"
  - "../orchestrators/tdd-orchestrator-v4-manifest.yaml"
