# Security Scanner Agent
# CORTEX Knowledge Base - Learning Agents
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  category: "learning-agents"
  subcategory: "security"

# Agent Architecture
architecture:
  type: "Specialist Agent"
  parent: "CORTEX Agent Framework"
  dependencies:
    - "security.yaml (OWASP knowledge)"
    - "cwe-top-25.yaml (CWE patterns)"
    - "owasp-top-10.yaml (vulnerability catalog)"

# Scanning Capabilities
capabilities:
  static_analysis:
    - name: "Injection Attacks"
      types: ["SQL injection", "NoSQL injection", "Command injection", "LDAP injection"]
      detection: "AST analysis + pattern matching"
      
    - name: "Authentication & Authorization"
      checks: ["Weak passwords", "Missing authentication", "Broken access control"]
      
    - name: "Sensitive Data Exposure"
      checks: ["Hardcoded secrets", "Unencrypted data", "Insecure storage"]
      
    - name: "Security Misconfiguration"
      checks: ["Default credentials", "Verbose errors", "Unnecessary features enabled"]
      
    - name: "Cryptography"
      checks: ["Weak algorithms", "Insecure random", "Poor key management"]
  
  dynamic_analysis:
    - "Dependency vulnerability scanning"
    - "Secrets detection in code and config"
    - "API security testing"

# Vulnerability Database
vulnerability_database:
  owasp_top_10_2021:
    - "A01:2021 – Broken Access Control"
    - "A02:2021 – Cryptographic Failures"
    - "A03:2021 – Injection"
    - "A04:2021 – Insecure Design"
    - "A05:2021 – Security Misconfiguration"
    - "A06:2021 – Vulnerable and Outdated Components"
    - "A07:2021 – Identification and Authentication Failures"
    - "A08:2021 – Software and Data Integrity Failures"
    - "A09:2021 – Security Logging and Monitoring Failures"
    - "A10:2021 – Server-Side Request Forgery (SSRF)"
  
  cwe_top_25:
    knowledge_source: "cwe-top-25.yaml"
    auto_detection: true

# Scanning Process
scanning_process:
  stages:
    - name: "Discovery"
      actions:
        - "Identify entry points (APIs, forms, etc.)"
        - "Map data flows"
        - "Locate sensitive operations"
    
    - name: "Analysis"
      actions:
        - "Pattern-based vulnerability detection"
        - "AST-based taint analysis"
        - "Dependency vulnerability lookup"
        - "Secrets scanning (regex + entropy)"
    
    - name: "Validation"
      actions:
        - "Eliminate false positives"
        - "Context-aware severity adjustment"
        - "Exploit feasibility assessment"
    
    - name: "Reporting"
      actions:
        - "Vulnerability summary by severity"
        - "Remediation guidance with code examples"
        - "CVSS scoring"
        - "Compliance mapping (OWASP, CWE, PCI-DSS)"

# Integration with CORTEX
cortex_integration:
  triggers:
    - "Manual: `scan security` command"
    - "Automated: pre-commit hooks"
    - "CI/CD: pipeline integration"
    - "Scheduled: nightly scans"
  
  knowledge_retrieval:
    tier0: "SKULL security enforcement rules"
    tier2: "Security patterns and anti-patterns"
    external: "NVD (National Vulnerability Database)"
  
  remediation:
    - "Retrieve secure coding patterns from knowledge base"
    - "Generate patched code with explanations"
    - "Link to relevant OWASP/CWE articles"

# Output Format
output_format:
  structure:
    summary:
      critical: 3
      high: 8
      medium: 15
      low: 22
      total: 48
      risk_score: 8.2
    
    vulnerabilities:
      - id: "CORTEX-SEC-001"
        severity: "CRITICAL"
        category: "Injection"
        cwe_id: "CWE-89"
        owasp: "A03:2021"
        title: "SQL Injection in login endpoint"
        file: "src/auth/login.py"
        line: 45
        evidence: "username = request.form['username']"
        description: "User input directly concatenated into SQL query"
        impact: "Attacker can execute arbitrary SQL, read/modify database"
        remediation: |
          Use parameterized queries:
          ```python
          cursor.execute("SELECT * FROM users WHERE username = %s", (username,))
          ```
        cvss_score: 9.8
        references:
          - "security.yaml#sql-injection"
          - "https://owasp.org/www-community/attacks/SQL_Injection"

# Advanced Features
advanced_features:
  ml_powered_detection:
    description: "Use ML to detect novel vulnerabilities"
    approach: "Train on known vulnerable code patterns"
    
  context_aware_scanning:
    description: "Understand application context"
    examples:
      - "Public API vs internal API (different threat models)"
      - "User input vs admin input"
      - "Authenticated vs unauthenticated flows"
  
  fix_generation:
    description: "Auto-generate secure code fixes"
    capabilities:
      - "Parameterized query conversion"
      - "Add input validation"
      - "Implement proper error handling"
      - "Add security headers"

# Compliance Mapping
compliance:
  pci_dss:
    requirements:
      - "6.5.1: Injection flaws"
      - "6.5.8: Improper access control"
      - "6.5.10: Broken authentication"
    
  hipaa:
    requirements:
      - "Encryption of data at rest and in transit"
      - "Access controls"
      - "Audit controls"
  
  gdpr:
    requirements:
      - "Data encryption"
      - "Access logging"
      - "Data minimization"

related_knowledge:
  - "security.yaml"
  - "owasp-top-10.yaml"
  - "cwe-top-25.yaml"
