# Response Template Base Components
# Version: 3.0
# Purpose: Shared components, headers, sections, and format variants
# Part of: Response Template System Refactor (Phase 5)

schema_version: '3.0'
last_updated: '2025-12-10'
refactor_phase: 'modular_architecture'

# ============================================================================
# SHARED COMPONENTS - Reusable sections referenced by ID
# ============================================================================

shared_components:
  # Standard CORTEX header with author attribution
  standard_header:
    id: header_standard
    type: header
    content: |
      ## 🧠 CORTEX {{title}}
      **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
      
      ---

  # Compact header format (for autonomous mode)
  compact_header:
    id: header_compact
    type: header
    content: |
      ## 🧠 CORTEX {{title}}
      **{{understanding_brief}}** | *{{challenge_status}}*
      
      **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
      
      ---

  # Understanding & Scope section (v3.0)
  section_understanding:
    id: section_understanding
    type: section
    icon: "🎯"
    title: "Understanding & Scope"
    content: "{{understanding_scope_content}}"
    variants:
      concise: "{{understanding_brief}}"
      balanced: "{{understanding_scope_content}}"
      verbose: "{{understanding_scope_content}}\n\n**Context:** {{context_details}}"

  # Approach & Considerations section (v3.0)
  section_challenge:
    id: section_challenge
    type: section
    icon: "⚡"
    title: "Approach & Considerations"
    content: "{{approach_considerations_content}}"
    variants:
      concise: "{{approach_brief}}"
      balanced: "{{approach_considerations_content}}"
      verbose: "{{approach_considerations_content}}\n\n**Impact:** {{approach_impact}}\n**Mitigation:** {{approach_mitigation}}"

  # Response section (main content)
  section_response:
    id: section_response
    type: section
    icon: "💬"
    title: "Response"
    content: "{{response_content}}"
    variants:
      concise: "{{response_brief}}"
      balanced: "{{response_content}}"
      verbose: "{{response_content}}\n\n**Additional Context:**\n{{additional_context}}"

  # Request echo section (mirror user's request)
  section_request_echo:
    id: section_request_echo
    type: section
    icon: "📝"
    title: "Your Request"
    content: "{{impact_changes_content}}"
    variants:

  # -------------------------------------------------------------------------
  # THREAT ANALYSIS COMPONENTS (Phase 6.3)
  # -------------------------------------------------------------------------
  
  # Risk level badge with color/emoji
  risk_level_badge:
    id: risk_level_badge
    type: component
    content: |
      **Risk Level:** {{risk_emoji}} **{{risk_level}}** ({{threat_count}} threats identified)
    risk_emojis:
      CRITICAL: "🔴"
      HIGH: "🟠"
      MEDIUM: "🟡"
      LOW: "🟢"

  # STRIDE category section
  stride_category:
    id: stride_category
    type: component
    content: |
      ### {{category_icon}} {{category_name}}
      {{#threats}}
      - **{{name}}** ({{risk_rating}})
        - **Impact:** {{description}}
        - **Likelihood:** {{likelihood}}
        {{#mitigation_strategies}}
        - **Mitigation:** {{name}}
        {{/mitigation_strategies}}
      {{/threats}}
    category_icons:
      spoofing: "👤"
      tampering: "🔧"
      repudiation: "📝"
      information_disclosure: "🔓"
      denial_of_service: "⚡"
      elevation_of_privilege: "🔑"

  # OWASP mapping component
  owasp_mapping:
    id: owasp_mapping
    type: component
    content: |
      ### 🛡️ OWASP Top 10 Coverage
      {{#owasp_categories}}
      - **{{code}}:** {{name}} ({{threat_count}} threats)
      {{/owasp_categories}}

  # Mitigation strategy with code example
  mitigation_with_code:
    id: mitigation_with_code
    type: component
    content: |
      #### {{mitigation_name}}
      **Priority:** {{priority}} | **Effort:** {{effort_estimate}}
      
      **Implementation Steps:**
      {{#implementation_steps}}
      {{step_number}}. {{step_description}}
      {{/implementation_steps}}
      
      **Code Example ({{language}}):**
      ```{{language}}
      {{code_example}}
      ```
      
      **Verification:**
      {{verification_method}}

  # Threat details table
  threat_table:
    id: threat_table
    type: component
    content: |
      | Threat | Category | Risk | OWASP | Mitigation Priority |
      |--------|----------|------|-------|---------------------|
      {{#threats}}
      | {{name}} | {{stride_category}} | {{risk_rating}} | {{owasp_code}} | {{mitigation_priority}} |
      {{/threats}}

  # Request echo section (mirror user's request)
      concise: "{{request_brief}}"
      balanced: "{{impact_changes_content}}"
      verbose: "{{impact_changes_content}}\n\n**Interpreted As:** {{request_interpretation}}"

  # Next steps section (actionable items)
  section_next_steps:
    id: section_next_steps
    type: section
    icon: "🔍"
    title: "Next Steps"
    content: "{{next_steps_content}}"
    variants:
      concise: "{{next_steps_brief}}"
      balanced: "{{next_steps_content}}"
      verbose: "{{next_steps_content}}\n\n**Estimated Time:** {{estimated_time}}\n**Dependencies:** {{dependencies}}"

  # Tech-aware solution section (best practice + company-aligned)
  section_tech_solution:
    id: section_tech_solution
    type: section
    icon: "🏆"
    title: "Recommended Solution"
    content: |
      {{recommended_solution}}
      
      {{#if has_tech_stack}}
      **🔧 {{cloud_provider_name}}-Aligned Implementation:**
      {{company_aligned_implementation}}
      
      *Deployment Options:*
      - **Cloud Platform:** {{cloud_deployment}}
      - **Container Orchestration:** {{container_orchestration}}
      - **CI/CD:** {{cicd_pipeline}}
      - **Infrastructure as Code:** {{iac_tool}}
      - **Monitoring:** {{monitoring_platform}}
      {{/if}}

# ============================================================================
# FORMAT VARIANTS - Different response structures
# ============================================================================

format_variants:
  # Standard 5-part format (most common)
  standard_5_part:
    id: format_standard_5_part
    description: "Standard CORTEX 5-part response format"
    sections:
      - header_standard
      - section_understanding
      - section_challenge
      - section_response
      - section_request_echo
      - section_next_steps

  # Tech-aware format (includes solution recommendations)
  tech_aware:
    id: format_tech_aware
    description: "Tech-aware response with solution recommendations"
    sections:
      - header_standard
      - section_understanding
      - section_challenge
      - section_tech_solution
      - section_response
      - section_request_echo
      - section_next_steps

  # Compact format (for autonomous users)
  compact:
    id: format_compact
    description: "Compact response format for autonomous users"
    sections:
      - header_compact
      - section_response
      - section_request_echo
      - section_next_steps

  # Educational format (extended explanations)
  educational:
    id: format_educational
    description: "Educational format with detailed explanations"
    sections:
      - header_standard
      - section_understanding
      - section_challenge
      - section_response
      - section_learning_objectives  # Extra section for educational mode
      - section_request_echo
      - section_next_steps
      - section_resources  # Extra section for educational mode

# ============================================================================
# DETAIL LEVEL VARIANTS - Control content verbosity
# ============================================================================

detail_levels:
  concise:
    id: detail_concise
    description: "Minimal content, action-focused"
    characteristics:
      - "Brief explanations (1-2 sentences)"
      - "Bullet points for lists"
      - "No additional context unless critical"
      - "Direct answers only"
    max_section_length: 200  # characters
    use_variants: true  # Use 'concise' variant of each section

  balanced:
    id: detail_balanced
    description: "Moderate detail, professional tone"
    characteristics:
      - "Clear explanations (2-4 sentences)"
      - "Structured lists with context"
      - "Key context provided"
      - "Examples when helpful"
    max_section_length: 500  # characters
    use_variants: false  # Use default content

  verbose:
    id: detail_verbose
    description: "Comprehensive detail, teaching-focused"
    characteristics:
      - "Detailed explanations (4+ sentences)"
      - "Rich context and background"
      - "Multiple examples"
      - "Learning resources included"
    max_section_length: 1000  # characters
    use_variants: true  # Use 'verbose' variant of each section

# ============================================================================
# RENDERING RULES - How to compose final response
# ============================================================================

rendering_rules:
  # Section ordering (default)
  default_section_order:
    - header
    - understanding
    - challenge
    - response
    - request_echo
    - next_steps

  # Conditional sections (only include if data available)
  conditional_sections:
    - section_tech_solution  # Only if has_tech_stack=true
    - section_learning_objectives  # Only if interaction_mode=educational
    - section_resources  # Only if interaction_mode=educational

  # Required sections (always include)
  required_sections:
    - header
    - response
    - next_steps

  # Separator between sections
  section_separator: "\n\n"

  # Header separator (after header before content)
  header_separator: "---\n\n"
