# ==============================================================================
# CORTEX 6.0 Hybrid Approach Architecture
# ==============================================================================
# Purpose: Merge GPT implementation plan rigor with CORTEX 6.0 pragmatism
# Created: 2026-01-10
# Author: Asif Hussain
# Status: DESIGN_APPROVED
# Copyright © 2025-2026 Asif Hussain. All rights reserved.
#
# PHILOSOPHY: Adopt GPT plan's audit rigor + testing strategy, reject SHADOW/CANARY 
# complexity for developer tool context. Evidence-based activation without traffic splitting.
# ==============================================================================

schema_version: "1.0"
design_score: 96  # Target: 95+ (maintains holistic analysis achievement)
complexity_reduction: "40% fewer artifacts than GPT plan"
implementation_phases: 4

# ==============================================================================
# ARCHITECTURAL DECISIONS
# ==============================================================================
decisions:
  
  adopted_from_gpt_plan:
    - id: "DEC-001"
      name: "STS as Capability 0"
      rationale: "Validate orchestration framework BEFORE building features"
      implementation: "sharpening-cortex/ becomes first Evidence Bundle producer"
      impact: "Proves framework works before snowball begins"
      
    - id: "DEC-002"
      name: "Hash Chain Audit Trail"
      rationale: "Tamper detection + integrity verification for compliance"
      implementation: "Add prev_event_hash, event_hash to EnhancedAuditLogger"
      impact: "Enhances existing AC-AUDIT-001 to AC-AUDIT-006"
      
    - id: "DEC-003"
      name: "Executable Acceptance Criteria"
      rationale: "ACs as pytest assertions, not prose"
      implementation: "Formalize AC-TEST-001 to AC-TEST-004 with STS harness"
      impact: "Automated AC validation in CI/CD"
      
    - id: "DEC-004"
      name: "Evidence Bundle (Lightweight)"
      rationale: "Proof of completion without bureaucratic overhead"
      implementation: "3 files: manifest.yaml, test_results.json, audit_trace.jsonl"
      impact: "Post-implementation evidence, not pre-spec bundles"
      
    - id: "DEC-005"
      name: "Extended Lifecycle States"
      rationale: "Track orchestrator maturity from SPEC → ACTIVE"
      implementation: "7 states (not 9): IDLE → SPEC → IMPLEMENTED → TESTED → VERIFIED → ACTIVE → DEPRECATED"
      impact: "Progressive activation without traffic splitting"
  
  rejected_from_gpt_plan:
    - id: "REJ-001"
      name: "SHADOW/CANARY Rollout"
      rationale: "CORTEX is on-demand developer tool, not production service with traffic"
      alternative: "DRY_RUN mode + Approval gates + Progressive AC validation"
      
    - id: "REJ-002"
      name: "Pre-Spec Spec Bundles (7 files)"
      rationale: "Contradicts CORE-001 incremental philosophy + CORTEX builds through TDD"
      alternative: "Lightweight manifests + post-implementation Evidence Bundles"
      
    - id: "REJ-003"
      name: "Traffic-Based Metrics (sample size, parity gates)"
      rationale: "No traffic to split - orchestrators invoked via terminal"
      alternative: "Test coverage + audit completeness + AC validation"
      
    - id: "REJ-004"
      name: "Capability Model (isolated routing/policy/execution)"
      rationale: "CORTEX orchestrators collaborate (MasterOrch → TodoMgr → TDD-Master)"
      alternative: "Keep existing orchestrator model + deterministic routing (AC-ROUTE-001)"
      
    - id: "REJ-005"
      name: "Excessive Bureaucracy (15 artifacts per capability)"
      rationale: "Violates CORE-001 token budget + incremental development"
      alternative: "3-file Evidence Bundle + lazy loading + AC-INDEX.yaml summaries"

# ==============================================================================
# LIFECYCLE STATE MACHINE (7 States, not 9)
# ==============================================================================
lifecycle:
  name: "Extended Orchestrator Lifecycle"
  ac_id_prefix: "AC-LIFECYCLE"
  total_states: 7
  
  states:
    IDLE:
      description: "Orchestrator exists in code but not registered"
      transitions_to: ["SPEC"]
      entry_criteria: "Code skeleton created"
      exit_criteria: "Spec manifest complete"
      
    SPEC:
      description: "Manifest exists, routes defined, ACs written"
      transitions_to: ["IMPLEMENTED"]
      entry_criteria: "manifest.yaml complete with AC-IDs"
      exit_criteria: "Code implementation merged"
      artifacts_required:
        - "cortex-brain/manifests/orchestrators/{name}.yaml"
        - "AC-IDs defined in AC-INDEX.yaml"
        
    IMPLEMENTED:
      description: "Code exists, not yet fully tested"
      transitions_to: ["TESTED"]
      entry_criteria: "Implementation PR merged"
      exit_criteria: "All tests passing in CI"
      
    TESTED:
      description: "Tests pass but Evidence Bundle not generated"
      transitions_to: ["VERIFIED"]
      entry_criteria: "pytest exit code 0"
      exit_criteria: "Evidence Bundle produced"
      
    VERIFIED:
      description: "Evidence Bundle exists, ready for activation"
      transitions_to: ["ACTIVE"]
      entry_criteria: "Evidence Bundle passes all gates"
      exit_criteria: "Routing table updated with orchestrator"
      artifacts_required:
        - "cortex-brain/evidence-bundles/{name}_evidence.yaml"
        
    ACTIVE:
      description: "Fully operational, in routing table, audit trail logging"
      transitions_to: ["DEPRECATED"]
      entry_criteria: "Routes live in tier0/routing/routing-table.yaml"
      exit_criteria: "Retirement plan approved"
      monitoring:
        - "Error rate < 5%"
        - "Avg execution time < 2x baseline"
        - "AC validation success > 95%"
        
    DEPRECATED:
      description: "Marked for retirement, routes removed"
      transitions_to: []  # Terminal state
      entry_criteria: "Retirement plan executed"
      exit_criteria: "N/A (terminal)"
      cleanup_required:
        - "Remove from routing table"
        - "Archive manifest + Evidence Bundle"
        - "Update AC-INDEX.yaml status"

  quarantine_mechanism:
    trigger_conditions:
      - "Error rate > 10% sustained for 3 consecutive checks"
      - "Missing audit spans detected"
      - "Governance violation logged"
      - "AC validation failure"
    action: "Temporarily move to IDLE state + block routing"
    recovery: "Fix issues → Re-enter at TESTED state → Generate new Evidence Bundle"

# ==============================================================================
# EVIDENCE BUNDLE FORMAT (3 Files, not 15)
# ==============================================================================
evidence_bundle:
  name: "Lightweight Evidence Bundle"
  ac_id_prefix: "AC-EVIDENCE"
  format: "YAML + JSON + JSONL"
  generation: "Post-implementation (not pre-spec)"
  location: "cortex-brain/evidence-bundles/"
  
  structure:
    manifest:
      file: "evidence_manifest.yaml"
      required_fields:
        - orchestrator_id: "Unique identifier"
        - orchestrator_version: "Semantic version (1.0.0)"
        - spec_hash: "SHA256 of manifest.yaml"
        - implementation_date: "ISO timestamp"
        - ac_ids: "List of AC-IDs validated"
        - routes: "List of routing patterns"
        - governance_rules_applied: "List of CORE-* rule IDs"
        - test_coverage_percent: "Minimum 80%"
        - audit_completeness: "Boolean (all required events logged)"
        
    test_results:
      file: "test_results.json"
      required_fields:
        - total_tests: "Integer count"
        - passed: "Integer count"
        - failed: "Integer count"
        - skipped: "Integer count"
        - coverage_percent: "Float (80.0+)"
        - execution_time_ms: "Float"
        - test_categories:
            - unit: "Count of unit tests"
            - integration: "Count of integration tests"
            - security: "Count of security tests"
            - performance: "Count of performance tests"
        - failures: "List of failed test names (empty if all pass)"
        
    audit_trace:
      file: "audit_trace.jsonl"
      description: "Complete audit chain for orchestrator execution"
      required_events:
        - "REQUEST_RECEIVED"
        - "ROUTE_SELECTED"
        - "GOVERNANCE_VALIDATED"
        - "ACTION_EXECUTED"
        - "RESULT_EMITTED"
        - "TESTS_VERIFIED"
      hash_chain: "Each event includes event_hash + prev_event_hash"
      correlation_id: "UUIDv7 linking all events"
      
  validation_gates:
    gate_1_coverage:
      name: "Test Coverage"
      threshold: 80
      blocker: true
      error_message: "Test coverage below 80% - Evidence Bundle rejected"
      
    gate_2_audit:
      name: "Audit Completeness"
      check: "All required events exist in audit_trace.jsonl"
      blocker: true
      error_message: "Missing audit events - Evidence Bundle rejected"
      
    gate_3_governance:
      name: "Governance Compliance"
      check: "All governance_rules_applied have enforcement logs"
      blocker: true
      error_message: "Governance violations detected - Evidence Bundle rejected"

# ==============================================================================
# HASH CHAIN AUDIT ENHANCEMENT
# ==============================================================================
hash_chain_audit:
  name: "Hash Chain Integrity"
  ac_id: "AC-AUDIT-007"
  enhancement_to: ["AC-AUDIT-001", "AC-AUDIT-002", "AC-AUDIT-003"]
  
  implementation:
    location: "src/infrastructure/enhanced_audit_logger.py"
    new_fields:
      - name: "event_hash"
        type: "string (SHA256)"
        calculation: "SHA256(timestamp + correlation_id + component + operation + message)"
        
      - name: "prev_event_hash"
        type: "string (SHA256)"
        description: "Hash of previous event in correlation chain"
        special_case: "Root event: prev_event_hash = '0' * 64"
        
    integrity_verification:
      method: "verify_hash_chain(correlation_id: str) -> bool"
      algorithm: |
        1. Query all events for correlation_id ordered by timestamp
        2. For each event[i]:
           a. Recalculate event_hash from fields
           b. Verify event[i].event_hash == calculated_hash
           c. Verify event[i].prev_event_hash == event[i-1].event_hash
        3. Return False if any verification fails
      
      on_tampering_detected:
        - "Log CRITICAL alert to audit system"
        - "Raise AuditIntegrityError exception"
        - "Quarantine orchestrator if associated"
        - "Notify security team (future: AC-SECURITY-009)"
        
    performance_impact:
      hash_computation: "<1ms per event (SHA256 fast on modern CPUs)"
      verification_query: "<10ms for 100-event chain"
      total_overhead: "<2% latency increase (within AC-AUDIT-001 <5ms budget)"

# ==============================================================================
# STS AS CAPABILITY 0 (Validate Framework First)
# ==============================================================================
sts_capability_zero:
  name: "STS Test Harness (Capability 0)"
  ac_id_prefix: "AC-STS"
  location: "sharpening-cortex/sts-template/"
  purpose: "Prove orchestration framework works BEFORE building features"
  
  golden_corpus:
    file: "sharpening-cortex/sts-template/golden_corpus.yaml"
    total_intents: 100
    categories:
      - name: "Routing Determinism"
        count: 25
        examples:
          - "implement user authentication"
          - "plan epic review system"
          - "vacuum deep clean codebase"
          
      - name: "Unicode Normalization"
        count: 15
        examples:
          - "implement café module"  # NFKC normalization
          - "create user﻿﻿﻿profile"  # Zero-width chars
          - "plan　feature　with　spaces"  # Various whitespace
          
      - name: "Governance Enforcement"
        count: 20
        examples:
          - "create plan.md in root"  # Should block (CORE-009)
          - "implement without TDD"  # Should block (CORE-019)
          - "use C:\\hardcoded\\path"  # Should block (CORE-005)
          
      - name: "Policy Decisions"
        count: 20
        examples:
          - "delete src/ directory"  # Should require approval
          - "read config.yaml"  # Should allow
          - "execute rm -rf /"  # Should block
          
      - name: "Security Tests"
        count: 20
        examples:
          - "create ../../../etc/passwd"  # Path traversal
          - "execute $(malicious)"  # Command injection
          - "read API_KEY from env"  # Secret exposure
          
  expected_outputs:
    file: "sharpening-cortex/sts-template/expected_outputs.yaml"
    structure:
      intent_id: "GOLDEN-001"
      input: "implement user authentication"
      expected_route: "TDD-Master v1"
      expected_normalized: "implement user authentication oauth jwt session database"
      expected_policy: "ALLOW"
      expected_ac_id: "AC-TDD-042"
      expected_audit_events:
        - "REQUEST_RECEIVED"
        - "ROUTE_SELECTED"
        - "GOVERNANCE_VALIDATED"
        - "ACTION_EXECUTED"
        - "RESULT_EMITTED"
        
  validation:
    ci_integration: true
    run_frequency: "Every commit to main branch"
    failure_action: "Block merge if any test fails"
    evidence_bundle: "First Evidence Bundle produced by CORTEX 6.0"
    
  success_criteria:
    - "100% routing determinism (same input → same route every time)"
    - "100% audit completeness (all events logged)"
    - "100% governance enforcement (violations blocked)"
    - "100% security tests pass (no escapes)"
    - "Evidence Bundle generation successful"

# ==============================================================================
# PROGRESSIVE ROLLOUT (WITHOUT SHADOW/CANARY)
# ==============================================================================
progressive_rollout:
  name: "Simplified Progressive Activation"
  ac_id_prefix: "AC-ROLLOUT-SIMPLE"
  philosophy: "Evidence-based activation for developer tools"
  
  dry_run_mode:
    ac_id: "AC-ROLLOUT-SIMPLE-001"
    implementation: "All orchestrators support --dry-run flag"
    behavior:
      - "Log all actions to audit trail with DRY_RUN marker"
      - "Preview operations without executing"
      - "Generate would-be Evidence Bundle"
      - "Show governance violations that would block"
    usage: "python3 -m src.main 'vacuum deep clean' --dry-run"
    
  approval_gates:
    ac_id: "AC-ROLLOUT-SIMPLE-002"
    implementation: "Approval State Machine (AC-SECURITY-005)"
    high_risk_operations:
      - "File deletion (DELETE action type)"
      - "Directory removal (RMDIR action type)"
      - "External API calls (NETWORK action type)"
      - "Database schema changes (DDL operations)"
    behavior:
      - "Block execution until approval received"
      - "Timeout: 300s (5 minutes)"
      - "Retry: 3 attempts with exponential backoff"
      - "Approval context includes: operation, targets, governance rules"
    integration: "ActionPolicyEngine (AC-SECURITY-001)"
    
  progressive_ac_validation:
    ac_id: "AC-ROLLOUT-SIMPLE-003"
    implementation: "Governance auto-blocks unvalidated ACs"
    strategy:
      - "New orchestrator starts with AC-*-001 only"
      - "Evidence Bundle for AC-*-001 unlocks AC-*-002"
      - "Continue incrementally: AC-*-002 → AC-*-003 → ..."
      - "Full activation when all ACs have Evidence Bundles"
    enforcement: "GovernanceMerger checks AC status before routing"
    
  monitoring:
    metrics:
      - name: "Error Rate"
        threshold: "< 5%"
        window: "Last 100 operations"
        action_on_breach: "Quarantine orchestrator"
        
      - name: "Execution Time"
        threshold: "< 2x baseline"
        baseline_source: "Evidence Bundle metrics_baseline"
        action_on_breach: "Performance warning (not blocking)"
        
      - name: "AC Validation Success"
        threshold: "> 95%"
        calculation: "Passing ACs / Total ACs"
        action_on_breach: "Block new features, fix existing ACs"

# ==============================================================================
# COMPARISON: GPT PLAN vs CORTEX HYBRID
# ==============================================================================
comparison:
  
  audit_trail:
    gpt_plan: "Hash chain ledger with immutable events"
    cortex_hybrid: "Hash chain ledger (adopted) + existing AC-ID correlation"
    winner: "TIE (merge both approaches)"
    
  lifecycle_states:
    gpt_plan: "9 states (DRAFT → SPEC_LOCKED → IMPLEMENTED → VERIFIED → SHADOW → CANARY → ACTIVE → QUARANTINED → RETIRED)"
    cortex_hybrid: "7 states (IDLE → SPEC → IMPLEMENTED → TESTED → VERIFIED → ACTIVE → DEPRECATED)"
    winner: "CORTEX (simpler, no traffic splitting)"
    
  evidence_bundle:
    gpt_plan: "8 artifacts (Spec Bundle: 7 files, Evidence Bundle: 8 files = 15 total)"
    cortex_hybrid: "3 artifacts (manifest.yaml, test_results.json, audit_trace.jsonl)"
    winner: "CORTEX (80% less overhead)"
    
  rollout_mechanism:
    gpt_plan: "SHADOW (mirrored traffic) → CANARY (5% traffic) → ACTIVE (100%)"
    cortex_hybrid: "DRY_RUN (preview) → APPROVAL (gates) → PROGRESSIVE_AC (incremental unlock)"
    winner: "CORTEX (no traffic to split)"
    
  routing:
    gpt_plan: "Policy-driven with declarative rules"
    cortex_hybrid: "Intent-based with LLM classification + deterministic fallback"
    winner: "CORTEX (AI-native developer tool)"
    
  test_strategy:
    gpt_plan: "6 categories, 100+ tests minimum"
    cortex_hybrid: "STS golden corpus (100 intents) + TDD RED→GREEN→REFACTOR"
    winner: "GPT (more rigorous, adopt for CORTEX)"
    
  complexity_reduction:
    metric: "Artifacts per orchestrator"
    gpt_plan: 15
    cortex_hybrid: 6
    reduction: "60% fewer artifacts"

# ==============================================================================
# IMPLEMENTATION PHASES (4 Weeks)
# ==============================================================================
implementation:
  
  week_1_2_foundation_enhancement:
    duration: "2 weeks"
    phase: "Phase 1 Extension"
    deliverables:
      
      - name: "AC-AUDIT-007: Hash Chain Audit Trail"
        files:
          - "src/infrastructure/enhanced_audit_logger.py (add event_hash, prev_event_hash)"
          - "tests/infrastructure/test_hash_chain.py"
        validation: "Verify hash chain integrity on 1000-event trace"
        
      - name: "AC-LIFECYCLE-001 to 003: Extended Lifecycle States"
        files:
          - "src/orchestrators/middleware/orchestrator_lifecycle.py (add 7 states)"
          - "tests/unit/test_extended_lifecycle.py"
        validation: "State machine transitions validated"
        
      - name: "AC-EVIDENCE-001 to 003: Evidence Bundle Generation"
        files:
          - "src/infrastructure/evidence_bundler.py"
          - "tests/infrastructure/test_evidence_bundle.py"
        validation: "Generate Evidence Bundle for TodoOrchestrator"
        
    exit_criteria:
      - "All Phase 1 ACs (AC-AUDIT-001 to 006, AC-GOV-001 to 005, AC-STATE-001 to 003) + new ACs implemented"
      - "Hash chain verification passing on all audit traces"
      - "Evidence Bundle auto-generation working"
      - "Zero test failures"
      
  week_3_sts_capability_zero:
    duration: "1 week"
    phase: "STS Test Harness"
    deliverables:
      
      - name: "AC-STS-001: Golden Corpus (100 test intents)"
        files:
          - "sharpening-cortex/sts-template/golden_corpus.yaml"
          - "sharpening-cortex/sts-template/expected_outputs.yaml"
        validation: "100 intents with expected routes/policies/audit chains"
        
      - name: "AC-STS-002: Framework Validation Tests"
        files:
          - "tests/sts/test_routing_determinism.py"
          - "tests/sts/test_unicode_normalization.py"
          - "tests/sts/test_governance_enforcement.py"
          - "tests/sts/test_policy_decisions.py"
          - "tests/sts/test_security_boundaries.py"
        validation: "All 100 golden corpus tests pass"
        
      - name: "AC-STS-003: First Evidence Bundle"
        files:
          - "cortex-brain/evidence-bundles/sts_capability_zero_evidence.yaml"
        validation: "Evidence Bundle proves orchestration framework works"
        
    exit_criteria:
      - "100% routing determinism"
      - "100% audit completeness"
      - "100% governance enforcement"
      - "100% security tests pass"
      - "First Evidence Bundle produced and validated"
      - "CI integration active (STS runs on every commit)"
      
  week_4_progressive_rollout:
    duration: "1 week"
    phase: "Simplified Rollout System"
    deliverables:
      
      - name: "AC-ROLLOUT-SIMPLE-001: DRY_RUN Mode"
        files:
          - "src/orchestrators/core/base_orchestrator_v4.py (add --dry-run support)"
          - "tests/integration/test_dry_run_mode.py"
        validation: "All orchestrators support --dry-run preview"
        
      - name: "AC-ROLLOUT-SIMPLE-002: Approval State Machine"
        files:
          - "src/orchestrators/security/approval_engine.py"
          - "tests/security/test_approval_gates.py"
        validation: "High-risk operations blocked until approval"
        
      - name: "AC-ROLLOUT-SIMPLE-003: Progressive AC Validation"
        files:
          - "src/orchestrators/core/governance_merger.py (AC status checking)"
          - "tests/governance/test_progressive_ac.py"
        validation: "Orchestrator blocked if AC-*-002 attempted without AC-*-001 Evidence Bundle"
        
    exit_criteria:
      - "All orchestrators support DRY_RUN mode"
      - "Approval state machine operational"
      - "Progressive AC unlocking enforced by governance"
      - "TodoOrchestrator has complete Evidence Bundle"
      - "Routing table canonical source enforced (SPEC-019)"
      
  week_5_plus_snowball:
    duration: "Ongoing"
    phase: "Feature Orchestrators"
    strategy: "Each new orchestrator produces Evidence Bundle before ACTIVE state"
    order:
      - "TDD-Master (AC-TDD-001 to 008)"
      - "Planning v5 (AC-PLAN-001 to 008)"
      - "ADO v2 (AC-ADO-001 to 006)"
      - "Crawler (AC-CRAWLER-001 to 005)"
      - "Vacuum/Cleanup (AC-VAC-001 to 006) - AFTER Crawler"
      - "Investigation (AC-INV-001 to 003)"
      - "LLM Intent Classifier (AC-LLM-001 to 004)"
      
    scaffolder_integration:
      - "AC-SCAFFOLD-003 enhanced to generate Evidence Bundle templates"
      - "New orchestrators auto-include Evidence Bundle generation hooks"
      - "CORE-021 enforces scaffolder use for new orchestrators"

