# ==============================================================================
# MIGRATION FROM GPT PLAN CONCEPTS
# ==============================================================================
migration_guide:
  
  spec_bundle_to_manifest:
    gpt_concept: "Spec Bundle (7 files: capability.yaml, acceptance_criteria.yaml, threat_model.md, etc.)"
    cortex_equivalent: "manifest.yaml (single file in cortex-brain/manifests/orchestrators/)"
    rationale: "CORTEX builds through TDD, not BDUF (Big Design Up Front)"
    
  evidence_bundle_simplification:
    gpt_concept: "Evidence Bundle (8 files: manifest, test_results, audit_samples, runtime_artifacts, etc.)"
    cortex_equivalent: "Evidence Bundle (3 files: evidence_manifest.yaml, test_results.json, audit_trace.jsonl)"
    rationale: "80% less overhead, sufficient for compliance"
    
  shadow_canary_to_dry_run:
    gpt_concept: "SHADOW (mirrored traffic, NOOP actions) → CANARY (5% traffic) → ACTIVE (100%)"
    cortex_equivalent: "DRY_RUN (preview) → APPROVAL (gates) → PROGRESSIVE_AC (incremental unlock)"
    rationale: "No traffic to split in developer tool"
    
  policy_engine_to_deterministic_routing:
    gpt_concept: "Policy engine with allowlist/denylist rules"
    cortex_equivalent: "ActionPolicyEngine (AC-SECURITY-001) + Deterministic routing (AC-ROUTE-001)"
    rationale: "CORTEX uses intent-based routing with LLM, not just policy"
    
  capability_to_orchestrator:
    gpt_concept: "Isolated capabilities with routing/policy/execution"
    cortex_equivalent: "Collaborative orchestrators (MasterOrch → TodoMgr → TDD-Master)"
    rationale: "CORTEX orchestrators work together, not in isolation"

# ==============================================================================
# ANTI-PATTERNS (BLOCKED IN HYBRID APPROACH)
# ==============================================================================
blocked_anti_patterns:
  - id: "ANTI-001"
    name: "Pre-Specification Spec Bundles"
    reason: "Violates CORE-001 incremental philosophy"
    enforcement: "Generate Evidence Bundles post-implementation only"
    
  - id: "ANTI-002"
    name: "Traffic Splitting for Developer Tools"
    reason: "CORTEX has no traffic to split"
    enforcement: "Use DRY_RUN + Approval gates instead"
    
  - id: "ANTI-003"
    name: "15-File Artifact Bundles"
    reason: "Token budget violation (CORE-001)"
    enforcement: "Max 3 files per Evidence Bundle"
    
  - id: "ANTI-004"
    name: "SHADOW Mode with Live Traffic"
    reason: "Inapplicable to on-demand orchestrators"
    enforcement: "STS test harness proves safety instead"
    
  - id: "ANTI-005"
    name: "Bypassing MasterOrchestrator"
    reason: "Violates AC-ORCH-006 central control"
    enforcement: "@require_master_routing decorator blocks direct execution"

