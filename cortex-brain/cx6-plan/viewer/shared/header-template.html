<!-- 
CORTEX 6.0 Standardized Header Template
Version: 1.0.0
Author: Asif Hussain
Date: 2026-01-11

Usage: Include this template in all HTML views and replace variables:
- {{PAGE_TITLE}} - Main page title (e.g., "Dashboard", "Phase Detail", "Gap Analysis")
- {{PAGE_DESCRIPTION}} - Brief description of the page
- {{DESIGN_SCORE}} - Current design score (e.g., "97/95")
- {{BREADCRUMB_HTML}} - Optional breadcrumb navigation HTML

The header features:
- Logo on the left (64px height, compact)
- Title and description on the same row (maximizes vertical space)
- Design score badge on the right
- Responsive design (stacks on mobile)
- Glassmorphism style with gradient
- Consistent CORTEX color palette
-->

<div class="cortex-header">
    <div class="container-fluid">
        <div class="row align-items-center g-3">
            <!-- Logo Column (Compact) -->
            <div class="col-auto">
                <img src="assets/images/CORTEX-logo-200.png" 
                     alt="CORTEX Logo" 
                     class="cortex-logo">
            </div>
            
            <!-- Title & Description Column (Flexible) -->
            <div class="col">
                <div class="d-flex flex-column">
                    <h1 class="cortex-title mb-1">
                        <span class="cortex-version">CORTEX 6.0</span>
                        <span class="cortex-separator">|</span>
                        <span class="cortex-page-title">{{PAGE_TITLE}}</span>
                    </h1>
                    <p class="cortex-description mb-0">{{PAGE_DESCRIPTION}}</p>
                </div>
            </div>
            
            <!-- Design Score Badge Column (Fixed Width) -->
            <div class="col-auto">
                <div class="design-score-badge">
                    <i class="bi bi-graph-up"></i>
                    <span class="score-label">Design Score</span>
                    <span class="score-value">{{DESIGN_SCORE}}</span>
                </div>
            </div>
        </div>
        
        <!-- Optional Breadcrumb (Conditional) -->
        <div class="row mt-2" id="breadcrumb-row" style="display: none;">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb cortex-breadcrumb mb-0">
                        {{BREADCRUMB_HTML}}
                    </ol>
                </nav>
            </div>
        </div>
    </div>
</div>

<style>
/* ========================================
   CORTEX Header Styles
   Version: 1.0.0
   ======================================== */

.cortex-header {
    background: linear-gradient(135deg, 
        rgba(0, 212, 255, 0.15) 0%, 
        rgba(123, 44, 191, 0.15) 50%,
        rgba(255, 0, 110, 0.10) 100%);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 1rem 0;
    box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
    position: sticky;
    top: 0;
    z-index: 1000;
}

/* Logo Styling */
.cortex-logo {
    height: 64px;
    width: auto;
    filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
    transition: transform 0.3s ease;
}

.cortex-logo:hover {
    transform: scale(1.05);
}

/* Title Styling */
.cortex-title {
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0;
    line-height: 1.2;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.cortex-version {
    background: linear-gradient(135deg, var(--cortex-cyan), var(--cortex-green));
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}

.cortex-separator {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 300;
}

.cortex-page-title {
    color: rgba(255, 255, 255, 0.95);
    font-weight: 600;
}

/* Description Styling */
.cortex-description {
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.3px;
}

/* Design Score Badge */
.design-score-badge {
    background: rgba(6, 255, 165, 0.15);
    border: 1px solid var(--cortex-green);
    border-radius: 12px;
    padding: 0.75rem 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    min-width: 120px;
    transition: all 0.3s ease;
}

.design-score-badge:hover {
    background: rgba(6, 255, 165, 0.25);
    box-shadow: 0 0 20px rgba(6, 255, 165, 0.3);
}

.design-score-badge i {
    font-size: 1.2rem;
    color: var(--cortex-green);
}

.score-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.6);
}

.score-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--cortex-green);
}

/* Breadcrumb Styling */
.cortex-breadcrumb {
    background: transparent;
    padding: 0.5rem 0;
    margin: 0;
}

.cortex-breadcrumb .breadcrumb-item {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85rem;
}

.cortex-breadcrumb .breadcrumb-item.active {
    color: var(--cortex-cyan);
}

.cortex-breadcrumb .breadcrumb-item + .breadcrumb-item::before {
    color: rgba(255, 255, 255, 0.3);
    content: "›";
}

.cortex-breadcrumb a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: color 0.2s ease;
}

.cortex-breadcrumb a:hover {
    color: var(--cortex-cyan);
}

/* Responsive Design */
@media (max-width: 768px) {
    .cortex-header {
        padding: 0.75rem 0;
    }
    
    .cortex-logo {
        height: 48px;
    }
    
    .cortex-title {
        font-size: 1.25rem;
    }
    
    .cortex-page-title {
        display: block;
        margin-top: 0.25rem;
    }
    
    .cortex-separator {
        display: none;
    }
    
    .cortex-description {
        font-size: 0.85rem;
    }
    
    .design-score-badge {
        min-width: 100px;
        padding: 0.5rem 1rem;
    }
    
    .score-value {
        font-size: 1.25rem;
    }
}

@media (max-width: 576px) {
    .cortex-title {
        font-size: 1.1rem;
    }
    
    .design-score-badge {
        flex-direction: row;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        min-width: auto;
    }
    
    .score-label {
        display: none;
    }
}
</style>

<script>
/**
 * CORTEX Header Template Utilities
 * Version: 1.0.0
 */

// Show/hide breadcrumb based on content
function initBreadcrumb() {
    const breadcrumbRow = document.getElementById('breadcrumb-row');
    const breadcrumbContent = breadcrumbRow?.querySelector('.breadcrumb');
    
    if (breadcrumbContent && breadcrumbContent.children.length > 0) {
        breadcrumbRow.style.display = 'block';
    }
}

// Update design score dynamically
function updateDesignScore(score) {
    const scoreElement = document.querySelector('.score-value');
    if (scoreElement) {
        scoreElement.textContent = score;
        
        // Update badge color based on score
        const badge = document.querySelector('.design-score-badge');
        const [current, target] = score.split('/').map(Number);
        
        if (current >= target) {
            badge.style.borderColor = 'var(--cortex-green)';
            badge.style.background = 'rgba(6, 255, 165, 0.15)';
        } else if (current >= target * 0.9) {
            badge.style.borderColor = 'var(--cortex-yellow)';
            badge.style.background = 'rgba(255, 190, 11, 0.15)';
        } else {
            badge.style.borderColor = 'var(--cortex-pink)';
            badge.style.background = 'rgba(255, 0, 110, 0.15)';
        }
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => {
    initBreadcrumb();
});
</script>
