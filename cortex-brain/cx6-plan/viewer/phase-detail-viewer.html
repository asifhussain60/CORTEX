<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX 6.0 - Phase Detail Viewer</title>
    
    <!-- Mermaid.js for diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <!-- js-yaml for YAML parsing -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #7b2cbf;
            --accent-color: #ff006e;
            --success-color: #06ffa5;
            --warning-color: #ffbe0b;
            --danger-color: #ff006e;
            --bg-dark: #0a0a0f;
            --bg-darker: #050508;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 44, 191, 0.1) 0%, transparent 50%);
            z-index: 0;
            animation: pulse 15s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .phase-header {
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .phase-title-section h1 {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .phase-meta {
            color: var(--text-secondary);
            font-size: 1.1em;
        }
        
        .back-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--primary-color);
        }
        
        /* Progress Bar */
        .progress-section {
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            font-weight: 600;
        }
        
        .progress-stats {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .progress-stat {
            flex: 1;
            min-width: 150px;
        }
        
        .progress-stat-label {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        
        .progress-stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        /* Architecture Diagram */
        .architecture-section {
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .mermaid-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }
        
        /* Components Grid */
        .components-section {
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .components-grid {
            display: grid;
            gap: 20px;
        }
        
        .component-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .component-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }
        
        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .component-name {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .component-status {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .status-pending {
            background: rgba(255, 190, 11, 0.2);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
        }
        
        .status-in-progress {
            background: rgba(0, 212, 255, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        
        .status-completed {
            background: rgba(6, 255, 165, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
        
        .component-description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .ac-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .ac-badge {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid rgba(0, 212, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .ac-badge:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: scale(1.05);
        }
        
        .component-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .detail-label {
            font-size: 0.85em;
            color: var(--text-secondary);
        }
        
        .detail-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* Use Cases Section */
        .use-cases-section {
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .use-case-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--secondary-color);
        }
        
        .use-case-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--secondary-color);
        }
        
        .use-case-description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .use-case-example {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--success-color);
        }
        
        /* Modal for AC-ID Details */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 2em;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: var(--accent-color);
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- CORTEX Standardized Header -->
    <div id="cortex-header-container"></div>
    
    <script>
        // Configure header for this page (will be updated dynamically when phase loads)
        const cortexHeaderConfig = {
            pageTitle: "Phase Detail",
            pageDescription: "Detailed view of phase implementation progress and architecture",
            designScore: "97/95",
            loadScoreFromPlan: true,
            breadcrumbs: [
                { text: "Dashboard", link: "cortex-plan-viewer.html" },
                { text: "Phase Detail", link: null }
            ]
        };
    </script>
    <script src="shared/header-loader.js"></script>
    
    <div class="container">
        <!-- Phase-Specific Header Info -->
        <div class="phase-header glass" style="margin-top: 20px;">
            <div class="phase-title-section">
                <h1 id="phaseTitle">Loading Phase...</h1>
                <div class="phase-meta" id="phaseMeta"></div>
            </div>
            <a href="cortex-plan-viewer.html" class="back-button">
                ← Back to Dashboard
            </a>
        </div>
        
        <!-- Progress Section -->
        <div class="progress-section glass">
            <h2 style="margin-bottom: 20px;">Implementation Progress</h2>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar">0%</div>
            </div>
            <div class="progress-stats" id="progressStats"></div>
        </div>
        
        <!-- Architecture Diagram -->
        <div class="architecture-section glass">
            <h2 class="section-title">🏗️ Architecture Overview</h2>
            <div class="mermaid-container">
                <div class="mermaid" id="architectureDiagram">
                    graph TD
                    Loading[Loading architecture...]
                </div>
            </div>
        </div>
        
        <!-- Components -->
        <div class="components-section glass">
            <h2 class="section-title">🔧 Components & AC-IDs</h2>
            <div class="components-grid" id="componentsGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading components...</p>
                </div>
            </div>
        </div>
        
        <!-- Use Cases -->
        <div class="use-cases-section glass">
            <h2 class="section-title">💡 Real-World Use Cases</h2>
            <div id="useCasesContainer">
                <div class="loading">Loading use cases...</div>
            </div>
        </div>
    </div>
    
    <!-- AC-ID Detail Modal -->
    <div class="modal" id="acModal">
        <div class="modal-content glass">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>
    
    <!-- Dynamic Phase Renderer -->
    <script src="dynamic-phase-renderer.js"></script>
    
    <script>
        // Initialize Mermaid
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#00d4ff',
                primaryTextColor: '#fff',
                primaryBorderColor: '#7b2cbf',
                lineColor: '#00d4ff',
                secondaryColor: '#7b2cbf',
                tertiaryColor: '#ff006e'
            }
        });
        
        // Get phase number from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const phaseNumber = urlParams.get('phase') || '1';
        
        // Initialize renderer
        const renderer = new PhaseDetailRenderer();
        renderer.loadPhaseData(phaseNumber);
        
        // Close modal function
        function closeModal() {
            document.getElementById('acModal').classList.remove('active');
        }
        
        // Close modal on background click
        document.getElementById('acModal').addEventListener('click', (e) => {
            if (e.target.id === 'acModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
