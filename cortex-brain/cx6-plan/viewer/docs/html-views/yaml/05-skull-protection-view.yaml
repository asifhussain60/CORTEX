schema_version: "1.0"
view_id: "skull-protection"
view_name: "SKULL Protection System - Governance Layer"
priority: 5
status: "approved"
last_updated: "2026-01-12"

theme:
  base_reference: "plan-viewer.html"
  inherit_css_variables: true
  enforcement_colors:
    blocked: "#ef4444"
    warning: "#f59e0b"
    info: "#3b82f6"

navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
  breadcrumb: ["CORTEX 6.0", "Governance", "SKULL Protection"]

content:
  
  hero:
    title: "SKULL Protection System v2.4"
    subtitle: "Secure Knowledge Unified Logical Layer"
    tagline: "23 immutable rules across 7 categories ensuring CORTEX integrity"
    
    key_stats:
      - label: "Total Rules"
        value: "23"
        description: "CORE-001 to CORE-023"
      - label: "Enforcement Levels"
        value: "3"
        description: "BLOCKED, WARNING, INFO"
      - label: "Rule Categories"
        value: "7"
        description: "Lifecycle, formatting, security, etc."
      - label: "Violation Latency"
        value: "<10ms"
        description: "In-memory governance checks"
  
  rule_categories:
    section_title: "7 Rule Categories"
    description: "Organized by operational domain"
    
    diagram:
      type: "d3_sunburst"
      center: "SKULL v2.4"
      segments:
        - category: "orchestration_lifecycle"
          rules: ["CORE-001", "CORE-007", "CORE-018", "CORE-019"]
          count: 4
          color: "#ef4444"
          description: "Rules governing orchestrator execution flow"
        
        - category: "response_formatting"
          rules: ["CORE-002", "CORE-004"]
          count: 2
          color: "#f59e0b"
          description: "Rules ensuring consistent output structure"
        
        - category: "portability"
          rules: ["CORE-005", "CORE-013", "CORE-014"]
          count: 3
          color: "#10b981"
          description: "Cross-platform compatibility rules"
        
        - category: "development_workflow"
          rules: ["CORE-008", "CORE-009", "CORE-015", "CORE-019", "CORE-024"]
          count: 5
          color: "#3b82f6"
          description: "TDD, testing, and development practices"
        
        - category: "architecture_integrity"
          rules: ["CORE-010", "CORE-011", "CORE-016", "CORE-020"]
          count: 4
          color: "#8b5cf6"
          description: "Structural and design enforcement"
        
        - category: "quality_gates"
          rules: ["CORE-021", "CORE-022", "CORE-023"]
          count: 3
          color: "#ec4899"
          description: "Code quality and validation checks"
        
        - category: "security_privacy"
          rules: ["CORE-006", "CORE-017"]
          count: 2
          color: "#14b8a6"
          description: "Security and data protection"
  
  enforcement_levels:
    section_title: "Enforcement Levels"
    
    diagram:
      type: "d3_bar_chart"
      data:
        - level: "BLOCKED"
          count: 19
          color: "#ef4444"
          description: "Operation rejected immediately"
          examples:
            - "CORE-019: TDD-Master not invoked"
            - "CORE-008: Tests missing"
            - "CORE-017: Governance bypass attempt"
        
        - level: "WARNING"
          count: 3
          color: "#f59e0b"
          description: "Operation allowed but logged"
          examples:
            - "CORE-004: Response template deviation"
            - "CORE-013: Dependency update needed"
        
        - level: "INFO"
          count: 1
          color: "#3b82f6"
          description: "Informational audit trail"
          examples:
            - "CORE-007: Orchestrator lifecycle event"
    
    behavior_matrix:
      type: "Table"
      columns: ["Level", "Behavior", "Audit", "User Notification"]
      rows:
        - level: "BLOCKED"
          behavior: "Reject operation, return error"
          audit: "CRITICAL log entry"
          notification: "Error message with guidance"
        - level: "WARNING"
          behavior: "Allow operation, log concern"
          audit: "WARNING log entry"
          notification: "Warning banner (optional)"
        - level: "INFO"
          behavior: "Allow operation silently"
          audit: "INFO log entry"
          notification: "None"
  
  critical_rules:
    section_title: "Critical Rules (Highest Impact)"
    
    rules:
      - rule_id: "CORE-001"
        name: "Incremental Autonomous Execution"
        category: "orchestration_lifecycle"
        severity: "BLOCKED"
        description: "Operations must work in <500 line increments to prevent token overflow (HTTP 502)"
        enforcement: "Pre-execution check blocks large operations"
        failure_mode: "Server errors, incomplete execution"
        example_pass: "Process 50 files per phase"
        example_fail: "Process all 1000 files in one execution"
      
      - rule_id: "CORE-008"
        name: "TDD Enforcement"
        category: "development_workflow"
        severity: "BLOCKED"
        description: "All code changes must have corresponding tests"
        enforcement: "Pre-commit hook validates test existence"
        failure_mode: "Untested code in production"
        example_pass: "Feature + test file committed together"
        example_fail: "Feature committed without tests"
      
      - rule_id: "CORE-019"
        name: "TDD-Master Required"
        category: "development_workflow"
        severity: "BLOCKED"
        description: "All development (planned and unplanned) must route through TDD-Master"
        enforcement: "Direct coding attempts redirected to TDD-Master"
        failure_mode: "Bypassed TDD workflow, poor quality"
        example_pass: "Request → TDD-Master → RED-GREEN-REFACTOR"
        example_fail: "Direct code modification without TDD-Master"
      
      - rule_id: "CORE-017"
        name: "Governance Enforcement"
        category: "security_privacy"
        severity: "BLOCKED"
        description: "All operations validated against governance layer, bypasses blocked"
        enforcement: "Pre-execution middleware checks"
        failure_mode: "Security vulnerabilities, integrity loss"
        example_pass: "Operation checked against SKULL rules"
        example_fail: "Attempt to disable governance checks"
      
      - rule_id: "CORE-020"
        name: "No Markdown in Brain"
        category: "architecture_integrity"
        severity: "BLOCKED"
        description: "cortex-brain/ must contain only machine-readable formats (YAML/JSON/DB)"
        enforcement: "File creation blocked for .md in cortex-brain/"
        failure_mode: "Inconsistent knowledge structure"
        example_pass: "Save knowledge as YAML"
        example_fail: "Create summary.md in cortex-brain/"
  
  enforcement_flow:
    section_title: "Enforcement Pipeline"
    
    diagram:
      type: "mermaid_sequence"
      code: |
        sequenceDiagram
          participant O as Orchestrator
          participant M as Middleware
          participant G as SKULL Governance
          participant A as Audit Logger
          participant U as User
          
          O->>M: Execute operation
          M->>G: Check SKULL rules
          G->>G: Lookup applicable rules
          alt Rule BLOCKED
            G->>A: Log CRITICAL violation
            G->>M: Reject operation
            M->>U: Error + guidance
          else Rule WARNING
            G->>A: Log WARNING
            G->>M: Allow with caution
            M->>O: Continue execution
            M->>U: Warning banner
          else Rule INFO or Pass
            G->>A: Log INFO
            G->>M: Allow operation
            M->>O: Continue execution
          end
  
  violation_examples:
    section_title: "Real-World Violation Examples"
    
    scenarios:
      - scenario: "Attempted CORE-001 Violation"
        description: "Developer tries to process 2000 files in single execution"
        detection: "Middleware calculates operation size: 2000 files × 50 lines = 100K tokens"
        enforcement: "Operation BLOCKED with suggestion to use incremental execution"
        resolution: "Break into 4 phases of 500 files each"
      
      - scenario: "Attempted CORE-019 Violation"
        description: "Developer modifies code directly without TDD-Master"
        detection: "Pre-commit hook checks for TDD-Master invocation record"
        enforcement: "Commit REJECTED with guidance to use TDD-Master"
        resolution: "Revert changes, invoke TDD-Master, follow RED-GREEN-REFACTOR"
      
      - scenario: "Attempted CORE-020 Violation"
        description: "Script tries to create summary.md in cortex-brain/tier1/"
        detection: "File creation hook checks path and extension"
        enforcement: "File creation BLOCKED, suggest YAML alternative"
        resolution: "Create summary.yaml instead"
  
  brain_protector_agent:
    section_title: "Brain Protector Agent"
    description: "Autonomous agent that enforces SKULL rules"
    
    responsibilities:
      - "Monitor all file operations in cortex-brain/"
      - "Validate governance rule compliance"
      - "Block violations automatically"
      - "Generate audit trail entries"
      - "Suggest compliant alternatives"
    
    architecture:
      type: "Component diagram"
      components:
        - name: "File System Watcher"
          description: "Monitors cortex-brain/ for changes"
        - name: "Rule Engine"
          description: "Evaluates operations against SKULL rules"
        - name: "Enforcement Layer"
          description: "Blocks/allows operations based on rules"
        - name: "Audit Logger"
          description: "Records all enforcement actions"

external_references:
  - title: "OWASP Top 10 Security Risks"
    url: "https://owasp.org/www-project-top-ten/"
    description: "Security principles behind CORE-017"
    embed: false
    link_text: "Visit OWASP"
  
  - title: "Immutable Infrastructure Best Practices"
    url: "https://www.youtube.com/watch?v=G39cJEo4F4w"
    description: "Why SKULL rules are immutable (14:20)"
    embed: true

interactivity:
  
  rule_explorer:
    enabled: true
    title: "Explore SKULL Rules"
    
    input_form:
      fields:
        - name: "rule_id"
          label: "Rule ID"
          type: "select"
          options: ["CORE-001", "CORE-008", "CORE-019", "CORE-017", "..."]
      
      button:
        text: "Show Details"
    
    output_display:
      type: "Expandable card"
      show_fields:
        - "Rule name"
        - "Category"
        - "Severity"
        - "Description"
        - "Enforcement trigger"
        - "Example pass/fail"

metadata:
  target_audience: "All CORTEX users, contributors, architects"
  reading_time: "8-10 minutes"
  complexity_level: "Intermediate"
  
  implementation_references:
    - path: "cortex-brain/tier0/governance/core-rules.yaml"
    - path: "src/agents/brain_protector.py"

accessibility:
  wcag_level: "AA"

responsive_design:
  mobile: "Stack rule cards vertically"
  desktop: "Grid layout for rule categories"
