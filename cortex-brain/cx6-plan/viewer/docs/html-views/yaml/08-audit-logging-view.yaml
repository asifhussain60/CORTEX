schema_version: "1.0"
view_id: "audit-logging"
view_name: "Audit & Logging System - Enterprise-Grade Traceability"
priority: 8
status: "approved"
last_updated: "2026-01-12"

theme:
  base_reference: "plan-viewer.html"
  inherit_css_variables: true
  log_level_colors:
    critical: "#991b1b"
    error: "#ef4444"
    warning: "#fbbf24"
    info: "#60a5fa"
    debug: "#6b7280"

navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
  breadcrumb: ["CORTEX 6.0", "Infrastructure", "Audit & Logging"]

content:
  
  hero:
    title: "Audit & Logging System"
    subtitle: "Enterprise-Grade Traceability with EnhancedAuditLogger"
    tagline: "Complete audit trail of all CORTEX operations with retention and compliance"
    
    key_stats:
      - label: "Log Categories"
        value: "8"
        description: "Governance, Orchestration, Validation, etc."
      - label: "Retention"
        value: "90 days"
        description: "Critical logs (longest)"
      - label: "Sanitization"
        value: "Automatic"
        description: "Sensitive data redacted"
  
  logging_overview:
    section_title: "Logging Architecture"
    
    core_components:
      - component: "EnhancedAuditLogger"
        description: "Central logging middleware"
        responsibilities:
          - "Log all request/response pairs"
          - "Redact sensitive fields (passwords, tokens)"
          - "Assign correlation IDs"
          - "Track execution timing"
      
      - component: "Pipeline Behaviors"
        description: "Middleware that integrates with orchestrator pipeline"
        behaviors:
          - "LoggingBehavior: Request/response logging"
          - "ValidationBehavior: Governance validation"
          - "RetryBehavior: Automatic retries with backoff"
      
      - component: "Audit Storage"
        description: "Persistent audit trail database"
        storage:
          path: "cortex-brain/audit-logs/"
          format: "JSON + SQLite"
          retention: "Variable by log level"
  
  log_levels:
    section_title: "Log Levels with Retention"
    
    diagram:
      type: "d3_bar_chart"
      data:
        - level: "CRITICAL"
          color: "#991b1b"
          retention: "90 days"
          description: "System failures, security breaches"
          examples:
            - "SKULL rule violation"
            - "Governance enforcement failure"
            - "Corruption detected"
        
        - level: "ERROR"
          color: "#ef4444"
          retention: "90 days"
          description: "Operation failures, exceptions"
          examples:
            - "Orchestrator execution failed"
            - "Test failure"
            - "File operation error"
        
        - level: "WARNING"
          color: "#fbbf24"
          retention: "60 days"
          description: "Unexpected conditions, risks"
          examples:
            - "SKULL rule warning"
            - "Coverage dropped below threshold"
            - "Deprecated API usage"
        
        - level: "INFO"
          color: "#60a5fa"
          retention: "30 days"
          description: "General operational events"
          examples:
            - "Phase completed"
            - "AC-ID implemented"
            - "Test suite passed"
        
        - level: "DEBUG"
          color: "#6b7280"
          retention: "7 days"
          description: "Detailed execution information"
          examples:
            - "Variable values"
            - "Function entry/exit"
            - "Internal state transitions"
        
        - level: "TRACE"
          color: "#d1d5db"
          retention: "7 days"
          description: "Most detailed level"
          examples:
            - "Every line of execution"
            - "All variable assignments"
  
  log_categories:
    section_title: "8 Log Categories"
    description: "Organized by operational domain"
    
    categories:
      - category: "GOVERNANCE"
        description: "SKULL rule enforcement"
        log_entries:
          - "Rule check: CORE-019 on implementation request"
          - "Violation: TDD-Master not invoked"
          - "Action: Blocked operation"
        level: "Usually WARNING or CRITICAL"
      
      - category: "ORCHESTRATION"
        description: "Orchestrator lifecycle events"
        log_entries:
          - "Planning Orchestrator v5 started"
          - "Phase 1: Context Discovery completed"
          - "Error: Plan validation failed"
        level: "Usually INFO or ERROR"
      
      - category: "VALIDATION"
        description: "AC, governance, and quality validation"
        log_entries:
          - "AC-AUDIT-001: Validation passed"
          - "Test coverage: 85.3%"
          - "DoR check: Failed (missing acceptance criteria)"
        level: "Usually INFO or WARNING"
      
      - category: "INFRASTRUCTURE"
        description: "System health and resource monitoring"
        log_entries:
          - "Database connection established"
          - "Token usage: 35K/50K (70%)"
          - "Memory pressure: HIGH"
        level: "Usually INFO or WARNING"
      
      - category: "BRAIN"
        description: "Knowledge graph and memory operations"
        log_entries:
          - "Pattern stored: oauth2_flow (confidence: 0.92)"
          - "Knowledge pruned: 3 low-confidence patterns"
          - "Tier 2 sync completed: 127 patterns"
        level: "Usually INFO"
      
      - category: "INTEGRATION"
        description: "External API calls and integrations"
        log_entries:
          - "Azure DevOps API: Created work item US-001"
          - "GitHub API: Pushed changes to branch feature-auth"
          - "External API timeout: OpenAI"
        level: "Usually INFO, WARNING on failure"
      
      - category: "MCP"
        description: "Model Context Protocol tool invocations"
        log_entries:
          - "MCP tool: run_in_terminal invoked"
          - "Tool result: Exit code 0"
          - "Tool error: Timeout exceeded"
        level: "Usually INFO"
      
      - category: "PERFORMANCE"
        description: "Timing and performance metrics"
        log_entries:
          - "Phase execution: 23.4 seconds"
          - "Test suite duration: 45.2 seconds"
          - "Slow query: Knowledge graph search (234ms)"
        level: "Usually INFO"
  
  pipeline_behaviors:
    section_title: "Pipeline Behavior Integration"
    description: "How logging integrates with orchestrator pipeline"
    
    logging_behavior:
      name: "LoggingBehavior"
      order: "First in pipeline"
      responsibilities:
        - "Log request details (type, parameters)"
        - "Log response (status, data)"
        - "Measure execution time"
        - "Assign correlation ID"
        - "Redact sensitive fields"
      
      sensitive_field_redaction:
        fields_redacted:
          - "password"
          - "api_token"
          - "secret_key"
          - "private_key"
          - "credit_card"
          - "oauth_token"
        redaction_pattern: "***REDACTED***"
        example:
          before: '{"user": "admin", "password": "secret123"}'
          after: '{"user": "admin", "password": "***REDACTED***"}'
    
    diagram:
      type: "mermaid_sequence"
      code: |
        sequenceDiagram
          participant R as Request
          participant L as LoggingBehavior
          participant N as NextBehavior
          participant O as Orchestrator
          participant DB as Audit DB
          
          R->>L: Enter pipeline
          L->>L: Log request
          L->>L: Assign correlation_id
          L->>N: Delegate to next behavior
          N->>O: Execute
          O->>N: Return result
          N->>L: Return response
          L->>L: Redact sensitive data
          L->>L: Log response + timing
          L->>DB: Persist to audit log
          L->>R: Return to caller
  
  correlation_ids:
    section_title: "Correlation IDs for Traceability"
    description: "Track related log entries across multiple services"
    
    example:
      request: "User requests feature planning"
      correlation_id: "CX-2026-01-12-0847-abc123def"
      related_logs:
        - "Request logged: PlanningOrchestrator"
        - "SKULL rules checked: GOVERNANCE"
        - "Context discovery: INFRASTRUCTURE"
        - "Plan generated: ORCHESTRATION"
        - "TodoManager tasks created: ORCHESTRATION"
        - "Response sent: ORCHESTRATION"
      
      query_ability: "Query audit log by correlation_id to see full execution flow"
    
    format:
      pattern: "CX-YYYY-MM-DD-HHMM-random"
      uniqueness: "UUID-based suffix ensures uniqueness"
      lifecycle: "Assigned at request entry, flows through all operations"
  
  audit_queries:
    section_title: "Audit Query Examples"
    
    use_cases:
      - query: "Find all failures for AC-AUDIT-001"
        command: "audit query --ac-id AC-AUDIT-001 --level ERROR"
        output:
          - "2026-01-10 14:32: Test failure (pytest)"
          - "2026-01-09 09:15: Schema validation failed"
      
      - query: "Trace execution of request"
        command: "audit query --correlation-id CX-2026-01-12-0847-abc123def --last 1h"
        output:
          - "14:32:01 - Request received"
          - "14:32:02 - SKULL validation"
          - "14:32:15 - Planning started"
          - "14:33:45 - Planning complete"
      
      - query: "Check governance violations"
        command: "audit query --category GOVERNANCE --level WARNING"
        output:
          - "2026-01-11 16:40: CORE-008 warning (low test coverage)"
          - "2026-01-10 11:23: CORE-019 blocked (TDD-Master bypass)"
      
      - query: "Monitor performance"
        command: "audit query --category PERFORMANCE --last 24h"
        output:
          - "Slow phase: Planning took 45s (>30s threshold)"
          - "Fast phase: TDD RED took 8s"
    
    code_example:
      language: "python"
      code: |
        from src.infrastructure.enhanced_audit_logger import AuditLogger
        
        logger = AuditLogger()
        
        # Query by AC-ID
        failures = logger.query(
            filters={"ac_id": "AC-AUDIT-001", "level": "ERROR"}
        )
        
        # Query by correlation ID
        execution_trace = logger.query(
            filters={"correlation_id": "CX-2026-01-12-0847-abc123def"}
        )
        
        # Query by time range
        recent = logger.query(
            filters={"category": "GOVERNANCE"},
            time_range=("2026-01-10", "2026-01-12")
        )
  
  compliance:
    section_title: "Compliance & Data Protection"
    
    requirements:
      - requirement: "GDPR Compliance"
        implementation: "Personal data redacted, retention limits enforced"
      
      - requirement: "SOC 2 Audit Trail"
        implementation: "Complete immutable log of all operations"
      
      - requirement: "Data Retention Policy"
        implementation: "Auto-purge by log level (7-90 days)"
      
      - requirement: "Access Control"
        implementation: "Audit log access restricted to authorized users"
    
    retention_enforcement:
      type: "Automated cleanup"
      policy:
        critical_error: "90 days"
        warning: "60 days"
        info: "30 days"
        debug_trace: "7 days"
      
      implementation: "Cron job runs daily to remove expired entries"

external_references:
  - title: "Audit Trails in Enterprise Systems"
    url: "https://www.youtube.com/watch?v=WddWUVAYTd0"
    description: "Best practices for audit logging (16:45)"
    embed: true
  
  - title: "Secure Logging and Sensitive Data Redaction"
    url: "https://www.youtube.com/watch?v=FKE1GvTIyEg"
    description: "Techniques for protecting sensitive information in logs (12:30)"
    embed: true

interactivity:
  
  audit_log_viewer:
    enabled: true
    title: "Query Audit Logs"
    
    input_form:
      fields:
        - name: "search_type"
          label: "Search By"
          type: "select"
          options: ["AC-ID", "Correlation ID", "Category", "Date Range"]
        - name: "search_value"
          label: "Search Value"
          type: "text"
        - name: "log_level"
          label: "Minimum Log Level"
          type: "select"
          options: ["CRITICAL", "ERROR", "WARNING", "INFO"]
      
      button:
        text: "Search Logs"
    
    output_display:
      type: "Table with sortable columns"
      columns:
        - "Timestamp"
        - "Level"
        - "Category"
        - "Message"
        - "Correlation ID"

metadata:
  target_audience: "Operators, auditors, compliance teams"
  reading_time: "7-9 minutes"
  complexity_level: "Intermediate"
  
  implementation_references:
    - path: "src/infrastructure/enhanced_audit_logger.py"
    - path: "cortex-brain/audit-logs/"

accessibility:
  wcag_level: "AA"

responsive_design:
  mobile: "Vertical table layout"
  desktop: "Full table with filters"
