schema_version: "1.0"
view_id: "brain-architecture"
view_name: "CORTEX Brain - 4-Tier Memory Architecture"
priority: 4
status: "approved"
last_updated: "2026-01-12"

# =============================================================================
# THEME & DESIGN SYSTEM
# =============================================================================
theme:
  base_reference: "plan-viewer.html"
  inherit_css_variables: true
  tier_colors:
    tier_0: "#ef4444"  # Red - Immutable core
    tier_1: "#f59e0b"  # Orange - Working memory
    tier_2: "#10b981"  # Green - Knowledge graph
    tier_3: "#3b82f6"  # Blue - Dev context

# =============================================================================
# NAVIGATION
# =============================================================================
navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
  breadcrumb:
    - "CORTEX 6.0"
    - "Architecture"
    - "Brain Memory System"

# =============================================================================
# CONTENT STRUCTURE
# =============================================================================
content:
  
  hero:
    title: "CORTEX Brain Architecture"
    subtitle: "4-Tier Hierarchical Memory System"
    tagline: "Local-first distributed intelligence with cross-project learning"
    
    key_stats:
      - label: "Memory Tiers"
        value: "4"
        description: "Instincts → Working → Knowledge → Context"
      - label: "Fastest Tier"
        value: "<10ms"
        description: "Tier 0 governance checks"
      - label: "SKULL Rules"
        value: "23"
        description: "Immutable core protections"
      - label: "Retention"
        value: "90 days"
        description: "Long-term memory (Tier 2)"
  
  tier_overview:
    section_title: "4-Tier Memory Hierarchy"
    description: "From immutable governance to project-specific context"
    
    diagram:
      type: "d3_layered_stack"
      library: "D3.js v7"
      layers:
        
        - tier: 0
          name: "Instincts Layer (SKULL)"
          color: "#ef4444"
          latency: "<10ms"
          storage: "cortex-brain/tier0/governance.db (SQLite)"
          purpose: "Immutable governance rules"
          size: "23 CORE rules across 7 categories"
          retention: "Permanent (immutable)"
          access_pattern: "Read-only, memory-cached"
          
          details:
            - "CORE-001 to CORE-023: Governance rules"
            - "Enforcement levels: BLOCKED, WARNING, INFO"
            - "Sub-10ms validation (in-memory lookup)"
            - "No external dependencies"
            - "Protects brain integrity"
          
          icon: "shield-lock"
          badge: "IMMUTABLE"
        
        - tier: 1
          name: "Working Memory"
          color: "#f59e0b"
          latency: "<100ms"
          storage: "cortex-brain/tier1/ (JSON/YAML files)"
          purpose: "Active session context"
          size: "70 conversations, current epic state"
          retention: "Session duration + 30 days"
          access_pattern: "Read-write, session-scoped"
          
          details:
            - "progress-tracker.json: Active epic state"
            - "AC-INDEX.yaml: Acceptance criteria registry"
            - "company-practices.yaml: Business rules"
            - "tracking/: Real-time task status"
          
          files:
            - "tracking/progress-tracker.json"
            - "acceptance-criteria/AC-INDEX.yaml"
            - "company-practices.yaml"
          
          icon: "cpu"
          badge: "ACTIVE"
        
        - tier: 2
          name: "Knowledge Graph"
          color: "#10b981"
          latency: "<150ms"
          storage: "cortex-brain/tier2/ (Graph DB + YAML)"
          purpose: "Cross-project patterns and learnings"
          size: "54 patterns across 9 categories"
          retention: "90 days (auto-pruned)"
          access_pattern: "Read-heavy, background writes"
          
          details:
            - "engineering-standards.yaml: Coding standards"
            - "domain-patterns.yaml: Learned patterns"
            - "Pattern categories: auth, database, API, security, testing"
            - "Confidence scoring for pattern recommendations"
          
          pattern_categories:
            - "auth_patterns (OAuth, JWT, session management)"
            - "database_patterns (migration, indexing, query optimization)"
            - "api_patterns (REST, GraphQL, versioning)"
            - "security_patterns (OWASP, encryption, validation)"
            - "testing_patterns (TDD, mocking, fixtures)"
            - "refactoring_patterns (code smell removal)"
            - "deployment_patterns (CI/CD, rollback)"
            - "monitoring_patterns (logging, metrics)"
            - "documentation_patterns (API docs, README)"
          
          icon: "diagram-3"
          badge: "LEARNING"
        
        - tier: 3
          name: "Development Context"
          color: "#3b82f6"
          latency: "<1ms"
          storage: "cortex-brain/tier3/ (YAML files)"
          purpose: "Project-specific metrics"
          size: "Build times, test results, deployment history"
          retention: "30 days rolling"
          access_pattern: "Write-heavy, streaming"
          
          details:
            - "Build performance metrics"
            - "Test execution times"
            - "Coverage trends"
            - "Deployment success rates"
            - "Error frequency by module"
          
          metrics_tracked:
            - "Build duration (average, p95, p99)"
            - "Test suite execution time"
            - "Code coverage percentage"
            - "Deployment frequency"
            - "Mean time to recovery (MTTR)"
          
          icon: "graph-up"
          badge: "METRICS"
      
      interactions:
        hover: "Show tier details: latency, storage, retention, file count"
        click: "Expand to reveal file structure and sample data"
        animation: "Data flow arrows between tiers"
    
    data_flow:
      description: "How information flows between tiers"
      arrows:
        - from: "Tier 3"
          to: "Tier 2"
          label: "Pattern extraction (successful builds → patterns)"
        - from: "Tier 2"
          to: "Tier 1"
          label: "Pattern recommendation (suggest similar solutions)"
        - from: "Tier 1"
          to: "Tier 0"
          label: "Governance validation (check against SKULL)"
        - from: "Tier 0"
          to: "Tier 1"
          label: "Enforcement feedback (approve/block)"
  
  tier_0_details:
    section_title: "Tier 0: Instincts Layer (SKULL)"
    description: "Immutable governance enforcing CORTEX operational boundaries"
    
    characteristics:
      - characteristic: "Immutability"
        description: "Rules cannot be modified at runtime"
        icon: "lock"
      
      - characteristic: "Sub-10ms Latency"
        description: "In-memory cached rules for instant validation"
        icon: "lightning"
      
      - characteristic: "24 Rule Layers"
        description: "Spanning orchestration, TDD, security, architecture"
        icon: "layers"
      
      - characteristic: "Precedence: HIGHEST"
        description: "Overrides all other governance tiers"
        icon: "star-fill"
    
    enforcement_mechanism:
      trigger: "All orchestrator operations"
      validation: "Pre-execution hook checks SKULL rules"
      action: "BLOCK (reject), WARNING (log), INFO (audit only)"
      audit: "All violations logged to governance.db"
    
    rule_distribution:
      type: "d3_pie_chart"
      data:
        - category: "orchestration_lifecycle"
          count: 4
          color: "#ef4444"
        - category: "response_formatting"
          count: 2
          color: "#f59e0b"
        - category: "portability"
          count: 3
          color: "#10b981"
        - category: "development_workflow"
          count: 5
          color: "#3b82f6"
        - category: "architecture_integrity"
          count: 4
          color: "#8b5cf6"
        - category: "quality_gates"
          count: 3
          color: "#ec4899"
        - category: "security_privacy"
          count: 2
          color: "#14b8a6"
  
  tier_1_details:
    section_title: "Tier 1: Working Memory"
    description: "Active session context and epic state"
    
    key_files:
      - file: "tracking/progress-tracker.json"
        purpose: "Active epic state, phase progress, completed ACs"
        size: "~50KB"
        update_frequency: "Real-time during execution"
        schema:
          active_epic: "Current epic metadata"
          current_phase: "Phase number, AC-IDs, completion %"
          phases: "All phases with verified/partial/planned status"
      
      - file: "acceptance-criteria/AC-INDEX.yaml"
        purpose: "Registry of all acceptance criteria"
        size: "~200KB"
        update_frequency: "On AC creation/completion"
        schema:
          ac_id: "Unique identifier (AC-AUDIT-001)"
          title: "Human-readable title"
          status: "planned|implemented|verified"
          test_evidence: "Test file paths and pass/fail counts"
      
      - file: "company-practices.yaml"
        purpose: "Business-specific governance rules"
        size: "~30KB"
        update_frequency: "Manual updates by team"
        schema:
          review_requirements: "Code review policies"
          deployment_procedures: "Release gates"
          compliance_rules: "Regulatory requirements"
    
    synchronization:
      description: "Working memory syncs with plan viewer dashboard"
      flow:
        - "progress-tracker.json updated (source of truth)"
        - "sync_plan_viewer_data.py runs"
        - "plan-viewer-data.json generated (dashboard feed)"
        - "plan-viewer.html displays live data"
  
  tier_2_details:
    section_title: "Tier 2: Knowledge Graph"
    description: "Cross-project patterns and engineering standards"
    
    pattern_learning:
      process:
        - step: "Successful implementation detected"
          example: "OAuth integration completed with tests"
        - step: "Pattern extracted"
          example: "Extract OAuth flow structure"
        - step: "Confidence scored"
          example: "Confidence: 0.92 based on test coverage"
        - step: "Stored in domain-patterns.yaml"
          example: "auth_patterns.oauth2_authorization_code_flow"
        - step: "Available for future recommendations"
          example: "Suggest pattern for similar auth requests"
    
    pattern_structure:
      type: "YAML schema"
      example:
        pattern_id: "auth_oauth2_flow"
        category: "auth_patterns"
        confidence: 0.92
        reuse_count: 7
        last_used: "2026-01-10"
        description: "OAuth2 authorization code flow with PKCE"
        code_template: "path/to/template.py"
        test_template: "path/to/test_template.py"
        dependencies:
          - "requests"
          - "oauthlib"
        security_considerations:
          - "Use PKCE for public clients"
          - "Validate redirect URIs"
    
    auto_pruning:
      description: "Low-confidence patterns auto-pruned after 90 days"
      retention_rules:
        - "Confidence ≥0.9: Keep indefinitely"
        - "Confidence 0.7-0.9: Keep 90 days"
        - "Confidence <0.7: Keep 30 days"
        - "Reuse count >10: Keep indefinitely"
  
  tier_3_details:
    section_title: "Tier 3: Development Context"
    description: "Project-specific performance metrics"
    
    metrics_collected:
      - metric: "Build Performance"
        data:
          - "Build duration (seconds)"
          - "Success/failure rate"
          - "Incremental vs full build"
        retention: "30 days"
      
      - metric: "Test Execution"
        data:
          - "Test suite duration"
          - "Test pass/fail counts"
          - "Flaky test detection"
        retention: "30 days"
      
      - metric: "Code Coverage"
        data:
          - "Overall coverage %"
          - "Coverage by module"
          - "Coverage trend (increasing/decreasing)"
        retention: "60 days"
      
      - metric: "Deployment History"
        data:
          - "Deployment frequency"
          - "Rollback rate"
          - "Mean time to recovery"
        retention: "90 days"
    
    visualization:
      type: "d3_multi_line_chart"
      x_axis: "Date"
      y_axis: "Metric value"
      series:
        - "Build duration (seconds)"
        - "Test coverage (%)"
        - "Deployment success rate (%)"
  
  cross_repo_learning:
    section_title: "Cross-Repository Learning"
    description: "Patterns learned in one project available in all projects"
    
    use_case:
      scenario: "Project A implements OAuth2 with PKCE"
      learning_captured:
        - "Pattern extracted and stored in Tier 2"
        - "Test strategy documented"
        - "Common pitfalls recorded"
      
      benefit_to_project_b:
        - "Project B requests OAuth integration"
        - "CORTEX suggests Project A's pattern (confidence: 0.92)"
        - "Implementation time reduced by 40%"
        - "Fewer security issues (pattern includes best practices)"
    
    diagram:
      type: "mermaid_flowchart"
      code: |
        flowchart LR
          PA[Project A: OAuth Implementation] --> T2[Tier 2: Knowledge Graph]
          T2 --> PB[Project B: Suggest OAuth Pattern]
          T2 --> PC[Project C: Suggest OAuth Pattern]
          PB --> T2[Update: Pattern reused +1]
          PC --> T2[Update: Pattern reused +1]

# =============================================================================
# EXTERNAL REFERENCES (MAX 3)
# =============================================================================
external_references:
  - title: "Hierarchical Memory Architectures in AI Systems"
    url: "https://www.youtube.com/watch?v=Rd8aHJ3sPgM"
    description: "Multi-tiered memory design patterns (20:15)"
    embed: true
    caption: "Context: Architectural patterns CORTEX Brain uses"
  
  - title: "Knowledge Graphs for Software Engineering"
    url: "https://www.youtube.com/watch?v=vP6xG3uva04"
    description: "Using graphs to capture development knowledge (15:40)"
    embed: true
    caption: "Context: How Tier 2 stores and queries patterns"
  
  - title: "Immutable Infrastructure Patterns"
    url: "https://martinfowler.com/bliki/ImmutableServer.html"
    description: "Martin Fowler on immutability"
    embed: false
    link_text: "Read on martinfowler.com"
    caption: "Context: Why Tier 0 is immutable"

# =============================================================================
# INTERACTIVE ELEMENTS
# =============================================================================
interactivity:
  
  memory_query_demo:
    enabled: true
    title: "Query Memory Tiers"
    description: "See how CORTEX retrieves information from different tiers"
    
    input_form:
      fields:
        - name: "query"
          label: "Query"
          type: "text"
          placeholder: "e.g., 'OAuth patterns' or 'current epic status'"
      
      button:
        text: "Search"
        action: "Show which tier(s) respond and latency"
    
    output_display:
      type: "Timeline showing tier responses"
      example:
        query: "OAuth patterns"
        responses:
          - tier: 2
            latency: "142ms"
            result: "3 patterns found (OAuth2, OAuth1, OpenID Connect)"
          - tier: 1
            latency: "85ms"
            result: "No active OAuth work in current epic"

# =============================================================================
# METADATA
# =============================================================================
metadata:
  target_audience: "Architects, senior engineers, CORTEX contributors"
  reading_time: "9-11 minutes"
  complexity_level: "Advanced"
  
  implementation_references:
    - path: "cortex-brain/tier0/governance.db"
    - path: "cortex-brain/tier1/tracking/"
    - path: "cortex-brain/tier2/engineering-standards.yaml"
    - path: "cortex-brain/tier3/"

accessibility:
  wcag_level: "AA"

responsive_design:
  mobile: "Stack tier layers vertically"
  tablet: "2-tier layout side-by-side"
  desktop: "Full 4-tier visualization"
