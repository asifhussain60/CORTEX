schema_version: "1.0"
view_id: "response-optimization"
view_name: "Response & Token Optimization System"
priority: 7
status: "approved"
last_updated: "2026-01-12"

theme:
  base_reference: "plan-viewer.html"
  inherit_css_variables: true

navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
  breadcrumb: ["CORTEX 6.0", "System", "Response Optimization"]

content:
  
  hero:
    title: "Response & Token Optimization System"
    subtitle: "Adaptive Minimalism with 97% Content Reduction"
    tagline: "Dynamic response composition based on context signals"
    
    key_stats:
      - label: "Token Reduction"
        value: "97%"
        description: "15,851 → 486 lines"
      - label: "Response Types"
        value: "3"
        description: "Minimal, Standard, Comprehensive"
      - label: "Context Signals"
        value: "5"
        description: "Operation type, phase, complexity, etc."
      - label: "Token Limits"
        value: "40K soft / 50K hard"
        description: "Enforced by middleware"
  
  overview:
    section_title: "Adaptive Response Templates"
    description: "Responses dynamically composed based on execution context"
    
    core_principle:
      title: "Adaptive Minimalism"
      description: "Include only essential information for current phase"
      benefit: "Token consumption ≤ 60% of limit while maintaining clarity"
  
  context_signals:
    section_title: "5 Context Signals"
    description: "Signals that determine response template selection"
    
    signals:
      - signal: "operation_type"
        values: ["planning", "implementation", "testing", "cleanup", "analysis"]
        example: "operation_type: 'implementation'"
        impact: "Determines which sections are mandatory"
      
      - signal: "response_phase"
        values: ["start", "progress", "completion", "error", "summary"]
        example: "response_phase: 'progress'"
        impact: "START phase shows full context; PROGRESS shows delta only"
      
      - signal: "complexity_tier"
        values: ["instant", "lightweight", "documented", "complex"]
        example: "complexity_tier: 'documented'"
        impact: "Higher complexity → more detailed explanations"
      
      - signal: "orchestrator_type"
        values: ["planning", "tdd", "ado", "vacuum", "investigation"]
        example: "orchestrator_type: 'tdd'"
        impact: "TDD shows RED/GREEN/REFACTOR phase breakdown"
      
      - signal: "orchestrator_engaged"
        values: ["true", "false"]
        example: "orchestrator_engaged: true"
        impact: "When true, include orchestrator-specific blocks"
    
    signal_combination_matrix:
      type: "Table"
      rows:
        - operation: "planning"
          phase: "start"
          complexity: "complex"
          orchestrator: "planning"
          template: "comprehensive_with_context"
        
        - operation: "implementation"
          phase: "progress"
          complexity: "documented"
          orchestrator: "tdd"
          template: "minimal_with_phase_breakdown"
        
        - operation: "testing"
          phase: "completion"
          complexity: "instant"
          orchestrator: "tdd"
          template: "status_only"
  
  response_template_blocks:
    section_title: "Response Block Categories"
    
    mandatory_blocks:
      description: "Always included in every response"
      items:
        - block: "cortex_header"
          content: "CORTEX 6.0 branding + session info"
          tokens: "~50"
        
        - block: "next_steps"
          content: "What to do next (user-actionable)"
          tokens: "~100"
    
    conditional_blocks:
      description: "Included based on context signals"
      items:
        - block: "progress_tracker"
          condition: "response_phase == progress OR response_phase == completion"
          content:
            - "Current phase number"
            - "Completion percentage"
            - "AC-IDs implemented"
            - "Estimated time remaining"
          tokens: "~150"
        
        - block: "understanding"
          condition: "complexity_tier == complex"
          content:
            - "Summary of request interpretation"
            - "Assumptions made"
            - "Clarifications needed"
          tokens: "~120"
        
        - block: "validation_status"
          condition: "orchestrator_engaged == true"
          content:
            - "Governance rule checks passed"
            - "Test results (if applicable)"
            - "Coverage metrics"
          tokens: "~100"
        
        - block: "changes"
          condition: "operation_type in implementation or operation_type in cleanup"
          content:
            - "Files modified/created"
            - "Lines added/removed"
            - "Database updates"
          tokens: "~130"
        
        - block: "cautions"
          condition: "response_phase == error OR warnings_detected"
          content:
            - "Warnings and risks"
            - "Governance violations (if any)"
            - "Recovery steps"
          tokens: "~140"
        
        - block: "achievements"
          condition: "response_phase == completion"
          content:
            - "Completed items"
            - "Metrics and scores"
            - "Impact summary"
          tokens: "~120"
    
    orchestrator_specific_blocks:
      description: "Additional blocks for specific orchestrators"
      items:
        - orchestrator: "planning"
          blocks:
            - "plan_structure"
            - "context_discovery_results"
            - "folder_hierarchy"
            - "phase_breakdown"
        
        - orchestrator: "tdd"
          blocks:
            - "red_phase_status"
            - "green_phase_status"
            - "refactor_phase_status"
            - "code_smell_report"
      
      - orchestrator: "ado"
        blocks:
          - "work_item_hierarchy"
          - "story_point_summary"
          - "dor_dod_status"
      
      - orchestrator: "vacuum"
        blocks:
          - "orphaned_files_found"
          - "duplicates_found"
          - "safe_reorganization_plan"
  
  token_management:
    section_title: "Token Monitoring & Limits"
    
    limits:
      soft_limit: "40,000 tokens"
      soft_limit_action: "Stop adding optional blocks"
      hard_limit: "50,000 tokens"
      hard_limit_action: "Truncate response, add continuation link"
    
    monitoring_strategy:
      type: "Real-time token counting"
      steps:
        - "Count tokens as blocks are composed"
        - "Check against soft limit after each block"
        - "Stop adding blocks at 40K (soft limit)"
        - "Enforce hard limit at 50K with truncation"
      
      cache_utilization:
        description: "Reduce token counting overhead by 80%"
        strategy: "Cache token counts for common blocks"
        update_frequency: "Recalculate every 5 operations"
    
    modularization:
      description: "Break large responses into modules"
      rules:
        - "Plans >20KB split into separate files"
        - "Phase documents linked instead of embedded"
        - "Context sections reference external files"
      benefit: "Speeds up loading by 80% + reduces token consumption"
    
    diagram:
      type: "d3_area_chart"
      x_axis: "Response Length (KB)"
      y_axis: "Token Count"
      series:
        - name: "Monolithic (old)"
          color: "#ef4444"
          data: [[0, 0], [20, 5000], [40, 12000], [60, 20000]]
        - name: "Modular (new)"
          color: "#10b981"
          data: [[0, 0], [20, 1200], [40, 2400], [60, 3600]]
      
      annotation: "95% token reduction achieved through modular structure"
  
  composition_flow:
    section_title: "Response Composition Pipeline"
    
    diagram:
      type: "mermaid_flowchart"
      code: |
        flowchart TD
          A[Orchestrator Output] --> B[Extract Context Signals]
          B --> C[Load Mandatory Blocks]
          C --> D[Count Tokens]
          D --> E{Under 40K?}
          E -->|Yes| F[Add Conditional Blocks]
          E -->|No| G[Skip to next_steps]
          F --> H{Under 40K?}
          H -->|Yes| I[Add Orchestrator Blocks]
          H -->|No| G
          I --> J{Under 50K Hard?}
          J -->|No| K[Truncate + Add Continuation Link]
          J -->|Yes| L[Finalize Response]
          G --> L
          K --> L
          L --> M[Return to User]
    
    token_counting:
      type: "Code snippet"
      language: "python"
      code: |
        def count_tokens(text: str) -> int:
            # Approximate: 1 token ≈ 4 characters
            # Actual: Use tiktoken library for accuracy
            return len(text) // 4
        
        response = ResponseBuilder()
        tokens = count_tokens(response.render())
        
        if tokens < SOFT_LIMIT:
            response.add_optional_blocks()
        elif tokens > HARD_LIMIT:
            response.truncate_at_hard_limit()
  
  real_world_example:
    section_title: "Example: TDD Implementation Response"
    
    scenario:
      request: "Implement user authentication using TDD"
      signals:
        operation_type: "implementation"
        response_phase: "progress"
        complexity_tier: "documented"
        orchestrator_type: "tdd"
        orchestrator_engaged: true
    
    response_composition:
      blocks_included:
        - block: "cortex_header"
          size: "~50 tokens"
          included: true
        - block: "red_phase_status"
          size: "~200 tokens"
          included: true
          content:
            - "Tests generated: 15"
            - "Coverage target: 80%"
            - "Security scenarios: 5"
        - block: "green_phase_status"
          size: "~180 tokens"
          included: true
          content:
            - "Implementation progress: 40%"
            - "Tests passing: 6/15"
            - "Code coverage: 45%"
        - block: "changes"
          size: "~120 tokens"
          included: true
          content:
            - "Files created: auth_module.py, test_auth.py"
            - "Lines added: 340"
        - block: "next_steps"
          size: "~100 tokens"
          included: true
          content: "Complete remaining tests in GREEN phase"
      
      total_tokens: "~650 tokens (vs 3,500 for old monolithic response)"
      reduction: "82% smaller response"
      load_time_improvement: "4.2x faster"

external_references:
  - title: "Token Optimization in LLM Systems"
    url: "https://www.youtube.com/watch?v=k7h8XQZN-xY"
    description: "Techniques for reducing token consumption (12:15)"
    embed: true
  
  - title: "Modular Architecture Best Practices"
    url: "https://www.youtube.com/watch?v=Nkdvv93Ml-Q"
    description: "Breaking down monolithic systems (14:30)"
    embed: true

interactivity:
  
  token_calculator:
    enabled: true
    title: "Calculate Response Tokens"
    
    input_form:
      fields:
        - name: "response_text"
          label: "Paste response content"
          type: "textarea"
      
      button:
        text: "Count Tokens"
    
    output_display:
      type: "Card showing token breakdown"
      show:
        - "Total tokens"
        - "Estimated cost"
        - "vs. limits (soft/hard)"
        - "Optimization suggestions"

metadata:
  target_audience: "Developers, system architects"
  reading_time: "7-9 minutes"
  complexity_level: "Intermediate"
  
  implementation_references:
    - path: "cortex-brain/response-templates-v4.yaml"
    - path: "src/utils/token_counter.py"

accessibility:
  wcag_level: "AA"

responsive_design:
  mobile: "Stack token chart vertically"
  desktop: "Side-by-side comparisons"
