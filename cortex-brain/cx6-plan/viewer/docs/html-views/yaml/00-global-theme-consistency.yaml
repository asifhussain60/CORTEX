schema_version: "1.0"
file_id: "global-theme-consistency"
title: "Global Theme & Design System Directive"
status: "approved"
last_updated: "2026-01-12"

# =============================================================================
# PURPOSE
# =============================================================================

purpose: |
  This document establishes the global design system and theme consistency
  requirements for all HTML views in the CORTEX Plan Viewer ecosystem.
  
  All views (01-09) MUST inherit and extend the base theme from plan-viewer.html
  to ensure visual and functional consistency across the entire experience.

# =============================================================================
# BASE REFERENCE
# =============================================================================

base_source: "cortex-brain/cx6-plan/viewer/plan-viewer.html"

base_includes:
  - description: "All CSS variables defined in plan-viewer.html"
    location: "plan-viewer.html:root"
  - description: "Dark glass-morphism visual language"
    location: "plan-viewer.html:body, .panel, .card"
  - description: "Typography system"
    location: "plan-viewer.html:font-family, font-size variables"
  - description: "Animation and transition timing"
    location: "plan-viewer.html:transition variables"

# =============================================================================
# CSS VARIABLE INHERITANCE
# =============================================================================

mandatory_variables:
  
  color_palette:
    primary_colors:
      - "--color-primary-dark: #0a0e27"
      - "--color-primary-darker: #050814"
      - "--color-primary-accent: #00d4ff"
      - "--color-primary-accent-alt: #7b2cbf"
      - "--color-primary-green: #06ffa5"
    
    semantic_colors:
      - "--color-completed: #10b981"
      - "--color-in-progress: #f59e0b"
      - "--color-blocked: #ef4444"
      - "--color-not-started: #6b7280"
    
    audit_colors:
      - "--color-audit-info: #60a5fa"
      - "--color-audit-warning: #fbbf24"
      - "--color-audit-error: #ef4444"
      - "--color-audit-critical: #991b1b"
    
    text_colors:
      - "--color-text-primary: #ffffff"
      - "--color-text-secondary: rgba(255, 255, 255, 0.7)"
      - "--color-text-tertiary: rgba(255, 255, 255, 0.5)"
    
    backgrounds:
      - "--color-bg-elevated: rgba(10, 14, 39, 0.6)"
      - "--color-border: rgba(0, 212, 255, 0.15)"
  
  spacing_system:
    - "--spacing-xs: 0.25rem"
    - "--spacing-sm: 0.5rem"
    - "--spacing-md: 1rem"
    - "--spacing-lg: 1.5rem"
    - "--spacing-xl: 2rem"
    - "--spacing-2xl: 3rem"
  
  typography:
    - "--font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    - "--font-size-xs: 0.75rem"
    - "--font-size-sm: 0.875rem"
    - "--font-size-base: 1rem"
    - "--font-size-lg: 1.125rem"
    - "--font-size-xl: 1.25rem"
    - "--font-size-2xl: 1.5rem"
    - "--font-size-3xl: 2rem"
  
  borders_shadows:
    - "--radius-sm: 8px"
    - "--radius-md: 12px"
    - "--radius-lg: 16px"
    - "--shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.15)"
    - "--shadow-md: 0 8px 32px rgba(0, 212, 255, 0.1)"
    - "--shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.3)"
  
  motion:
    - "--transition-base: 200ms ease-out"
    - "--transition-slow: 400ms ease-out"

# =============================================================================
# VISUAL LANGUAGE
# =============================================================================

visual_system:
  
  glass_morphism:
    definition: "Translucent panels with backdrop-filter blur effect"
    
    implementation:
      background: "rgba(10, 14, 39, 0.6)"
      backdrop_filter: "blur(12px)"
      border: "1px solid rgba(0, 212, 255, 0.15)"
      border_radius: "var(--radius-lg)"
      box_shadow: "var(--shadow-md)"
      transition: "var(--transition-base)"
    
    usage:
      - "All panels and cards"
      - "Modal overlays"
      - "Navigation elements"
      - "Callout boxes"
    
    variations:
      elevated:
        background: "rgba(10, 14, 39, 0.8)"
        box_shadow: "var(--shadow-lg)"
      
      subtle:
        background: "rgba(10, 14, 39, 0.4)"
        box_shadow: "var(--shadow-sm)"
  
  neon_accents:
    definition: "Bright accent colors on dark background"
    primary: "#00d4ff"
    secondary: "#7b2cbf"
    highlights:
      - "Border highlights on hover"
      - "Icon glows"
      - "Link underlines"
      - "Focus indicators"
    
    transitions:
      default: "Smooth fade (200ms)"
      on_interaction: "Quick response (150ms)"
  
  typography:
    hierarchy:
      h1:
        font_size: "2.5rem"
        font_weight: "700"
        letter_spacing: "-0.02em"
        color: "var(--color-text-primary)"
        margin_bottom: "var(--spacing-lg)"
      
      h2:
        font_size: "2rem"
        font_weight: "600"
        letter_spacing: "-0.01em"
        color: "var(--color-text-primary)"
        margin_bottom: "var(--spacing-md)"
      
      h3:
        font_size: "1.5rem"
        font_weight: "600"
        color: "var(--color-text-primary)"
        margin_bottom: "var(--spacing-sm)"
      
      body:
        font_size: "1rem"
        line_height: "1.6"
        color: "var(--color-text-primary)"
      
      caption:
        font_size: "0.875rem"
        color: "var(--color-text-secondary)"
        font_weight: "400"
    
    links:
      color: "var(--color-primary-accent)"
      text_decoration: "none"
      border_bottom: "1px solid var(--color-primary-accent)"
      transition: "all var(--transition-base)"
      
      hover:
        color: "var(--color-primary-accent-alt)"
        border_bottom_color: "var(--color-primary-accent-alt)"
  
  color_coding:
    statuses:
      completed:
        background: "rgba(6, 255, 165, 0.1)"
        border: "1px solid #06ffa5"
        text: "#06ffa5"
        icon: "check-circle (green)"
      
      in_progress:
        background: "rgba(245, 158, 11, 0.1)"
        border: "1px solid #f59e0b"
        text: "#f59e0b"
        icon: "clock (orange)"
      
      blocked:
        background: "rgba(239, 68, 68, 0.1)"
        border: "1px solid #ef4444"
        text: "#ef4444"
        icon: "x-circle (red)"
      
      not_started:
        background: "rgba(107, 114, 128, 0.1)"
        border: "1px solid #6b7280"
        text: "#6b7280"
        icon: "circle (grey)"
    
    phase_colors:
      red_phase: "#ef4444"
      green_phase: "#10b981"
      refactor_phase: "#8b5cf6"
    
    tier_colors:
      tier_0: "#ef4444"
      tier_1: "#f59e0b"
      tier_2: "#10b981"
      tier_3: "#3b82f6"

# =============================================================================
# COMPONENT CONSISTENCY
# =============================================================================

components:
  
  navigation:
    back_link:
      style: "Neon accent color, no underline by default"
      hover: "Underline appears, slight glow"
      icon: "SVG bootstrap-icon (arrow-left)"
      position: "Top-left of view"
    
    breadcrumb:
      separator: "/"
      color: "var(--color-text-secondary)"
      hover_item: "Neon accent color"
      current_item: "Bold, var(--color-primary-accent)"
  
  cards:
    border_radius: "var(--radius-lg)"
    padding: "var(--spacing-lg)"
    background: "var(--color-bg-elevated)"
    border: "1px solid var(--color-border)"
    box_shadow: "var(--shadow-md)"
    transition: "all var(--transition-base)"
    
    hover:
      box_shadow: "var(--shadow-lg)"
      border_color: "rgba(0, 212, 255, 0.3)"
  
  buttons:
    padding: "var(--spacing-sm) var(--spacing-md)"
    border_radius: "var(--radius-md)"
    font_weight: "600"
    border: "none"
    cursor: "pointer"
    transition: "all var(--transition-base)"
    
    primary:
      background: "var(--color-primary-accent)"
      color: "#000"
      
      hover:
        background: "var(--color-primary-accent-alt)"
        box_shadow: "0 0 16px rgba(0, 212, 255, 0.4)"
    
    secondary:
      background: "transparent"
      border: "1px solid var(--color-primary-accent)"
      color: "var(--color-primary-accent)"
      
      hover:
        background: "rgba(0, 212, 255, 0.1)"
  
  diagrams:
    background: "transparent"
    text_color: "var(--color-text-primary)"
    accent_color: "var(--color-primary-accent)"
    
    nodes:
      default_fill: "rgba(10, 14, 39, 0.6)"
      border: "1px solid var(--color-primary-accent)"
      
      hover:
        fill: "rgba(0, 212, 255, 0.2)"
        stroke_width: "2"
    
    text:
      font_family: "var(--font-family-base)"
      font_size: "0.875rem"
      fill: "var(--color-text-primary)"

# =============================================================================
# INTERACTION & ANIMATION
# =============================================================================

interactions:
  
  hover_effects:
    standard_delay: "150ms"
    transition: "all 200ms ease-out"
    
    card_hover:
      - "Subtle lift: transform translateY(-4px)"
      - "Enhanced shadow: var(--shadow-lg)"
      - "Border glow: border-color rgba(0, 212, 255, 0.3)"
    
    link_hover:
      - "Underline appears: border-bottom 1px"
      - "Color change: var(--color-primary-accent-alt)"
      - "Glow: text-shadow 0 0 8px rgba(0, 212, 255, 0.4)"
  
  focus_indicators:
    outline: "2px solid var(--color-primary-accent)"
    outline_offset: "2px"
    border_radius: "var(--radius-md)"
  
  animations:
    fade_in:
      duration: "var(--transition-base)"
      keyframes: "opacity 0→1"
    
    slide_in:
      duration: "var(--transition-slow)"
      keyframes: "translateX or translateY with opacity"
    
    pulse:
      duration: "2s"
      keyframes: "opacity 1→0.5→1"
      used_for: "Loading indicators, attention getters"

# =============================================================================
# DARK MODE CONSISTENCY
# =============================================================================

dark_mode:
  principle: |
    All views operate in dark mode by default (no light mode toggle).
    High contrast ratios ensure readability (≥4.5:1 for text).
  
  contrast_ratios:
    text_on_dark: "≥4.5:1"
    UI_elements: "≥3:1"
    verification: "WCAG AA standard"
  
  color_adjustments:
    no_pure_white: "Use #ffffff only for text, not backgrounds"
    reduce_blue_light: "Night shift friendly temperatures"
    sufficient_separation: "Distinct color boundaries between elements"

# =============================================================================
# RESPONSIVE DESIGN
# =============================================================================

breakpoints:
  mobile:
    max_width: "<768px"
    adjustments:
      - "Single column layouts"
      - "Larger touch targets (min 44px)"
      - "Collapsed navigation"
      - "Vertical diagram arrangements"
  
  tablet:
    min_width: "768px"
    max_width: "<1024px"
    adjustments:
      - "Two-column layouts"
      - "Medium diagram sizes"
      - "Side navigation panel"
  
  desktop:
    min_width: "1024px"
    adjustments:
      - "Multi-column layouts (3+)"
      - "Full-size diagrams"
      - "Persistent navigation"
      - "Sidebar dashboard"

scaling_rules:
  font_sizes: "Scale proportionally but maintain hierarchy"
  spacing: "Reduce by 20% on mobile, 10% on tablet"
  diagrams: "Stack vertically on mobile, horizontal on desktop"

# =============================================================================
# ACCESSIBILITY REQUIREMENTS
# =============================================================================

wcag_compliance:
  target_level: "WCAG 2.1 Level AA"
  
  requirements:
    contrast:
      rule: "Foreground/background color contrast ≥4.5:1 for normal text"
      verification: "WebAIM Contrast Checker"
    
    keyboard_navigation:
      rule: "All interactive elements keyboard accessible"
      tab_order: "Logical, top-to-bottom"
      skip_links: "Provided for navigation"
    
    screen_readers:
      rule: "All images have alt text, diagrams have descriptions"
      semantic_html: "Use <h1>, <button>, <nav> correctly"
      aria_labels: "Where semantic HTML insufficient"
    
    color_not_sole_indicator:
      rule: "Don't rely on color alone to convey information"
      examples:
        - "Status: Use icon + color + text"
        - "Errors: Use icon + color + message"
        - "Charts: Use pattern + color"
    
    focus_indicators:
      rule: "Keyboard focus indicators visible (outline 2px)"
      minimum_contrast: "≥3:1 against adjacent pixels"
    
    timing_and_animation:
      rule: "No content updates >3 times per second (seizure risk)"
      prefers_reduced_motion: "Respect @media (prefers-reduced-motion)"
  
  testing:
    automated_tools:
      - "axe DevTools"
      - "Lighthouse"
      - "WAVE"
    manual_testing:
      - "Keyboard navigation (Tab, Arrow, Enter)"
      - "Screen reader test (NVDA, JAWS)"
      - "Color contrast verification"

# =============================================================================
# IMPLEMENTATION CHECKLIST
# =============================================================================

view_implementation_checklist:
  
  theme_inheritance:
    - "[ ] Linked plan-viewer.html CSS variables"
    - "[ ] No duplicate color definitions"
    - "[ ] Using :root variables, not hardcoded colors"
  
  visual_consistency:
    - "[ ] All panels use glass-morphism (backdrop-blur)"
    - "[ ] Border radius consistent (var(--radius-lg))"
    - "[ ] Shadows match (var(--shadow-md) default)"
    - "[ ] Neon accents used for interactive elements"
  
  typography:
    - "[ ] Font family: var(--font-family-base)"
    - "[ ] Heading hierarchy respected (h1→h3)"
    - "[ ] Line height ≥1.6 for body text"
    - "[ ] Font sizes from CSS variables"
  
  interactions:
    - "[ ] Hover effects smooth (200ms transition)"
    - "[ ] Focus indicators visible (outline 2px)"
    - "[ ] Buttons have hover/active states"
    - "[ ] Links underline on hover"
  
  responsive:
    - "[ ] Mobile layout tested (<768px)"
    - "[ ] Tablet layout tested (768-1024px)"
    - "[ ] Desktop layout tested (>1024px)"
    - "[ ] Touch targets ≥44px on mobile"
  
  accessibility:
    - "[ ] WCAG AA contrast verified"
    - "[ ] Keyboard navigation works"
    - "[ ] Screen reader tested"
    - "[ ] Color not sole indicator"
    - "[ ] Alt text for all images"
    - "[ ] Focus indicators visible"

# =============================================================================
# DIAGRAM STYLING
# =============================================================================

diagram_guidelines:
  
  d3_js:
    background: "transparent"
    text_fill: "var(--color-text-primary)"
    node_default:
      fill: "rgba(10, 14, 39, 0.6)"
      stroke: "var(--color-primary-accent)"
      stroke_width: "1.5"
    node_hover:
      fill: "rgba(0, 212, 255, 0.2)"
      stroke_width: "2"
  
  mermaid:
    theme: "dark"
    primary_color: "rgba(10, 14, 39, 0.6)"
    primary_border_color: "var(--color-primary-accent)"
    text_color: "var(--color-text-primary)"
    line_color: "var(--color-primary-accent)"
    secondary_color: "rgba(0, 212, 255, 0.1)"
  
  svg:
    background: "transparent"
    text_color: "var(--color-text-primary)"
    line_color: "var(--color-primary-accent)"
    stroke_width: "1.5px"

# =============================================================================
# EXAMPLES
# =============================================================================

example_usage:
  
  color_reference:
    correct: "background: var(--color-primary-dark); /* Dark background */"
    incorrect: "background: #0a0e27; /* Hardcoded - breaks consistency */"
  
  card_styling:
    correct: |
      .card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(12px);
      }
    incorrect: |
      .card {
        background: #0a0e27;
        border: 1px solid #00d4ff;
        border-radius: 16px;
        box-shadow: none;
      }
  
  hover_effect:
    correct: |
      .button {
        transition: all var(--transition-base);
      }
      .button:hover {
        box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
      }
    incorrect: |
      .button:hover {
        background: #00d4ff;
        opacity: 0.8;
      }

# =============================================================================
# VALIDATION & QA
# =============================================================================

qa_process:
  
  automated_checks:
    - "CSS variable usage (no hardcoded colors)"
    - "Contrast ratio verification (≥4.5:1)"
    - "Responsive breakpoints"
    - "Focus indicator presence"
  
  manual_testing:
    - "Visual inspection for consistency"
    - "Keyboard navigation (Tab → all interactive elements)"
    - "Screen reader test (at least one section)"
    - "Responsive design (3 breakpoints minimum)"
  
  accessibility_audit:
    - "axe DevTools full scan"
    - "Lighthouse Accessibility score ≥90"
    - "Manual WCAG AA checklist"
  
  sign_off:
    approved_by: "Design lead + Accessibility lead"
    checklist_complete: "All items checked"
    no_blocking_issues: "0 high-severity violations"

# =============================================================================
# MAINTENANCE & UPDATES
# =============================================================================

maintenance:
  
  when_plan_viewer_updates:
    procedure: |
      1. Review plan-viewer.html CSS changes
      2. Test all 9 views for visual breaks
      3. Update view YAML if new variables available
      4. Re-run full accessibility audit
      5. Deploy as atomic unit (all 9 views + viewer)
  
  when_adding_new_view:
    requirements:
      - "Copy this directive"
      - "Review CSS variable inheritance"
      - "Complete implementation checklist"
      - "Full accessibility testing"
  
  documentation:
    update_frequency: "After each major theme change"
    approval_process: "Design lead review + merge to main"

