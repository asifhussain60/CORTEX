<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CORTEX 6.0 Interactive View">
    <title>07 Response Optimization View</title>
    
    <!-- Design System & Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <style>
        
        :root {
            /* Colors */
            --color-primary-dark: #0a0e27;
            --color-primary-accent: #00d4ff;
            --color-primary-accent-alt: #7b2cbf;
            --color-primary-green: #06ffa5;
            --color-text-primary: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.7);
            --color-border: rgba(0, 212, 255, 0.15);
            --color-bg-elevated: rgba(10, 14, 39, 0.6);
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-2xl: 3rem;
            
            /* Radii & Shadows */
            --radius-md: 12px;
            --shadow-md: 0 8px 32px rgba(0, 212, 255, 0.1);
            --transition-base: 200ms ease-out;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #050814 0%, #0a0e27 50%, #050814 100%);
            color: var(--color-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        
        .view-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Navigation */
        .view-nav {
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing-2xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-2xl);
        }
        
        .nav-back {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--color-primary-accent);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all var(--transition-base);
        }
        
        .nav-back:hover {
            gap: var(--spacing-md);
        }
        
        .nav-title {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary-accent), var(--color-primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-actions {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .nav-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--color-border);
            color: var(--color-primary-accent);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
        }
        
        .nav-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: var(--shadow-md);
        }
        
        /* Content */
        .view-content {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: var(--spacing-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-2xl);
        }
        
        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08) 0%, rgba(123, 44, 191, 0.04) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-2xl);
            position: relative;
            overflow: hidden;
        }
        
        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
        }
        
        .hero-content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--color-primary-accent), var(--color-primary-accent-alt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-content p {
            color: var(--color-text-secondary);
            font-size: 1.125rem;
            max-width: 600px;
        }
        
        /* Cards & Sections */
        .section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: linear-gradient(180deg, var(--color-primary-accent), var(--color-primary-accent-alt));
            border-radius: 2px;
        }
        
        .card {
            background: var(--color-bg-elevated);
            backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            transition: all var(--transition-base);
        }
        
        .card:hover {
            border-color: var(--color-primary-accent);
            box-shadow: var(--shadow-md);
        }
        
        /* SVG/Diagram Containers */
        .diagram-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Mermaid Diagram Styling */
        .mermaid {
            display: flex;
            justify-content: center;
        }
        
        /* Footer */
        .view-footer {
            background: rgba(10, 14, 39, 0.6);
            border-top: 1px solid var(--color-border);
            margin-top: auto;
        }
        
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-2xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-xl);
        }
        
        .footer-text {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
        }
        
        .footer-link {
            font-size: 0.875rem;
            color: var(--color-primary-accent);
            text-decoration: none;
            transition: all var(--transition-base);
        }
        
        .footer-link:hover {
            color: var(--color-primary-green);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .view-content {
                padding: var(--spacing-lg);
            }
            
            .nav-content {
                flex-wrap: wrap;
            }
            
            .hero-content h1 {
                font-size: 1.875rem;
            }
            
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }
        
        /* Dark mode (future) */
        @media (prefers-color-scheme: dark) {
            /* Already dark by default */
        }
        
    </style>
</head>
<body>
    <div class="view-wrapper">
        <!-- Navigation -->
        <nav class="view-nav">
            <div class="nav-content">
                <a href="../plan-viewer.html" class="nav-back">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                <h1 class="nav-title">07 Response Optimization View</h1>
                <div class="nav-actions">
                    <button class="nav-btn" onclick="toggleDarkMode()">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="view-content">
            
        <section class="hero-section">
            <div class="hero-content">
                <h1>07 Response Optimization View</h1>
                <p>CORTEX 6.0 Production System View</p>
            </div>
        </section>
        
            
        <section class="section">
            <h2 class="section-title">Overview</h2>
            <div class="card">
                <p>View content loaded from specification</p>
                
            </div>
        </section>
                
        </main>
        
        <!-- Footer -->
        <footer class="view-footer">
            <div class="footer-content">
                <p class="footer-text">
                    CORTEX 6.0 • All Users • 
                    Generated 2026-01-12
                </p>
                <a href="#" class="footer-link">Documentation</a>
                <a href="#" class="footer-link">Feedback</a>
            </div>
        </footer>
    </div>
    
    <script>
        
        // Initialize Mermaid
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
        
        // Dark mode toggle
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
        
        // Initialize D3 diagrams when needed
        document.addEventListener('DOMContentLoaded', () => {
            mermaid.contentLoaded();
        });
        
    </script>
</body>
</html>
