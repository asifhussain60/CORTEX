schema_version: "1.0"
view_id: "tdd-master-orchestrator"
view_name: "TDD-Master 4.0.0 - Automated Test-Driven Development"
priority: 2
status: "approved"
last_updated: "2026-01-12"

# =============================================================================
# THEME & DESIGN SYSTEM
# =============================================================================
theme:
  base_reference: "plan-viewer.html"
  color_scheme:
    primary_dark: "#0a0e27"
    primary_darker: "#050814"
    primary_accent: "#00d4ff"
    accent_alt: "#7b2cbf"
    green_completed: "#06ffa5"
    red_phase: "#ef4444"
    green_phase: "#10b981"
    refactor_phase: "#8b5cf6"
    text_primary: "#ffffff"
    text_secondary: "rgba(255, 255, 255, 0.7)"
    border: "rgba(0, 212, 255, 0.15)"
    bg_elevated: "rgba(10, 14, 39, 0.6)"
  
  css_variables_usage:
    - "Inherit all CSS variables from plan-viewer.html"
    - "Use phase-specific colors for RED/GREEN/REFACTOR visualization"
  
  phase_color_mapping:
    RED: "#ef4444"
    GREEN: "#10b981"
    REFACTOR: "#8b5cf6"

# =============================================================================
# NAVIGATION
# =============================================================================
navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
    style: "Neon accent color, positioned top-left"
    icon: "arrow-left (bootstrap-icons)"
  
  breadcrumb:
    items:
      - text: "CORTEX 6.0"
        href: "../plan-viewer.html"
      - text: "Orchestrators"
        href: "#"
      - text: "TDD-Master 4.0.0"
        current: true

# =============================================================================
# CONTENT STRUCTURE
# =============================================================================
content:
  
  # ---------------------------------------------------------------------------
  # 1. HERO SECTION
  # ---------------------------------------------------------------------------
  hero:
    title: "TDD-Master 4.0.0"
    subtitle: "Automated RED → GREEN → REFACTOR Workflow"
    tagline: "Enforces test-driven development with AI-driven test generation and clean code validation"
    
    orchestrator_mode:
      type: "GUIDED"
      description: "TDD-Master coordinates Planning → TDD workflow with user involvement at phase transitions"
    
    key_stats:
      - label: "Workflow Phases"
        value: "3"
        description: "RED → GREEN → REFACTOR"
        color: "gradient(#ef4444, #10b981, #8b5cf6)"
      - label: "Code Smells Detected"
        value: "11"
        description: "Automated refactoring triggers"
      - label: "AC Coverage Target"
        value: "100%"
        description: "All acceptance criteria must have tests"
      - label: "SKULL Enforcement"
        value: "CORE-019"
        description: "TDD-Master required for all development"
  
  # ---------------------------------------------------------------------------
  # 2. THREE-PHASE TIMELINE
  # ---------------------------------------------------------------------------
  phase_timeline:
    section_title: "RED → GREEN → REFACTOR Workflow"
    description: "Structured approach to test-driven development"
    
    diagram:
      type: "d3_horizontal_timeline"
      library: "D3.js v7"
      phases:
        
        - phase_name: "RED Phase"
          color: "#ef4444"
          icon: "x-circle"
          duration: "Generate failing tests"
          expand_on_interaction: true
          tasks:
            - task: "Generate Failing Tests"
              description: "Create tests that define expected behavior"
            - task: "Edge-Case Analysis"
              description: "Identify boundary conditions and error scenarios"
            - task: "Domain Knowledge Integration"
              description: "Inject context from knowledge graph"
            - task: "AI-Driven Test Generation"
              description: "Use LLM to generate comprehensive test suite"
            - task: "Parametrized Testing"
              description: "Create data-driven tests for multiple scenarios"
            - task: "OWASP Security Tests"
              description: "Generate security-focused test cases"
          
          acceptance_criteria:
            - "All AC-IDs have corresponding test files"
            - "Tests fail with clear, actionable error messages"
            - "Edge cases and security scenarios covered"
            - "Test coverage plan documented"
        
        - phase_name: "GREEN Phase"
          color: "#10b981"
          icon: "check-circle"
          duration: "Minimal implementation to pass"
          expand_on_interaction: true
          tasks:
            - task: "Minimal Implementation"
              description: "Write simplest code that passes tests"
            - task: "AI-Driven Code Generation"
              description: "Leverage LLM for implementation suggestions"
            - task: "Over-Engineering Detection"
              description: "Flag unnecessary complexity"
            - task: "Coverage Tracking"
              description: "Monitor test coverage in real-time"
            - task: "Clean Code Validation"
              description: "Enforce naming, structure standards"
            - task: "Security Pattern Application"
              description: "Apply OWASP secure coding patterns"
          
          acceptance_criteria:
            - "All RED phase tests now pass"
            - "No over-engineered solutions"
            - "Code coverage ≥80%"
            - "SKULL rules satisfied"
        
        - phase_name: "REFACTOR Phase"
          color: "#8b5cf6"
          icon: "arrow-repeat"
          duration: "Optimize and clean"
          expand_on_interaction: true
          tasks:
            - task: "Code Smell Detection"
              description: "Identify 11 types of code smells"
            - task: "AI-Driven Refactoring"
              description: "Suggest automated improvements"
            - task: "Incremental Application"
              description: "Apply changes one at a time"
            - task: "Pattern Learning"
              description: "Store successful refactoring patterns"
            - task: "Orphaned Code Removal"
              description: "Delete unused functions/imports"
            - task: "Duplicate Consolidation"
              description: "Extract shared logic"
          
          acceptance_criteria:
            - "No code smells above threshold"
            - "All tests still pass"
            - "Code readability improved"
            - "Pattern stored in knowledge graph"
      
      interactions:
        hover: "Highlight phase, show progress percentage"
        click: "Expand to reveal detailed task list"
        animation: "Smooth phase transitions with color fade"
  
  # ---------------------------------------------------------------------------
  # 3. CODE SMELL DETECTION
  # ---------------------------------------------------------------------------
  code_smell_detection:
    section_title: "11 Automated Code Smell Detection"
    description: "AI-driven detection with confidence thresholds"
    
    diagram:
      type: "d3_radar_chart"
      library: "D3.js v7"
      axes:
        - smell: "LONG_METHOD"
          threshold: 0.8
          description: "Functions exceeding 50 lines"
        - smell: "COMPLEX_METHOD"
          threshold: 0.85
          description: "Cyclomatic complexity >10"
        - smell: "DUPLICATE_CODE"
          threshold: 0.75
          description: "Similar code blocks (>70% match)"
        - smell: "DEAD_CODE"
          threshold: 0.9
          description: "Unreachable or unused code"
        - smell: "MAGIC_NUMBERS"
          threshold: 0.7
          description: "Hardcoded numbers without constants"
        - smell: "LONG_PARAMETER_LIST"
          threshold: 0.8
          description: "Functions with >5 parameters"
        - smell: "NESTED_IF_ELSE"
          threshold: 0.85
          description: "Nesting depth >3"
        - smell: "POOR_NAMING"
          threshold: 0.75
          description: "Non-descriptive variable names"
        - smell: "SLOW_FUNCTION"
          threshold: 0.8
          description: "Execution time >100ms"
        - smell: "HOT_PATH"
          threshold: 0.85
          description: "Frequently called inefficient code"
        - smell: "PERFORMANCE_BOTTLENECK"
          threshold: 0.9
          description: "Algorithmic complexity issues"
      
      color_scale:
        low_confidence: "#10b981"
        medium_confidence: "#f59e0b"
        high_confidence: "#ef4444"
      
      interactions:
        hover: "Show smell definition, detection threshold, example"
        click: "Display sample refactoring suggestions"
    
    detection_engine:
      type: "Panel with expandable cards"
      cards:
        - smell: "LONG_METHOD"
          detection_method: "AST line count analysis"
          refactoring_strategy: "Extract method pattern"
        - smell: "DUPLICATE_CODE"
          detection_method: "Similarity hashing (SimHash)"
          refactoring_strategy: "Extract common function"
        - smell: "PERFORMANCE_BOTTLENECK"
          detection_method: "Profiling + AST complexity"
          refactoring_strategy: "Algorithm optimization"
  
  # ---------------------------------------------------------------------------
  # 4. STRATEGY PATTERN ARCHITECTURE
  # ---------------------------------------------------------------------------
  strategy_pattern:
    section_title: "Strategy Pattern Architecture"
    description: "Extensible phase-specific implementations"
    
    diagram:
      type: "mermaid_class_diagram"
      code: |
        classDiagram
          class TDDMasterOrchestrator {
            +execute(context)
            +validate_plan(plan_id)
            +transform_planning_to_tdd(plan)
            +invoke_tdd_orchestrator(tdd_context)
            +validate_ac_coverage(results)
            -phase_strategy: PhaseStrategy
          }
          
          class PhaseStrategy {
            <<interface>>
            +execute_phase(context)*
            +validate()*
          }
          
          class REDPhaseStrategy {
            +execute_phase(context)
            +generate_tests()
            +validate_test_failures()
          }
          
          class GREENPhaseStrategy {
            +execute_phase(context)
            +implement_minimal_code()
            +validate_test_passes()
          }
          
          class REFACTORPhaseStrategy {
            +execute_phase(context)
            +detect_code_smells()
            +apply_refactorings()
            +validate_no_regressions()
          }
          
          TDDMasterOrchestrator --> PhaseStrategy
          PhaseStrategy <|.. REDPhaseStrategy
          PhaseStrategy <|.. GREENPhaseStrategy
          PhaseStrategy <|.. REFACTORPhaseStrategy
      
      style: "Dark theme with neon accents"
      annotations:
        - position: "TDDMasterOrchestrator"
          text: "Context class delegates to strategies"
        - position: "PhaseStrategy"
          text: "Interface for phase execution"
        - position: "Strategy implementations"
          text: "Phase-specific logic isolated"
  
  # ---------------------------------------------------------------------------
  # 5. ACCEPTANCE CRITERIA COVERAGE
  # ---------------------------------------------------------------------------
  ac_coverage:
    section_title: "100% Acceptance Criteria Coverage"
    description: "TDD-Master validates that every AC-ID has corresponding tests"
    
    validation_flow:
      type: "mermaid_flowchart"
      code: |
        flowchart TD
          A[Plan Completed] --> B[Extract AC-IDs from config.yaml]
          B --> C[Map AC-IDs to Test Files]
          C --> D{All AC-IDs Covered?}
          D -->|Yes| E[Calculate Coverage %]
          D -->|No| F[Generate Missing Tests]
          F --> G[RED Phase: Generate Failing Tests]
          E --> H{Coverage ≥100%?}
          H -->|Yes| I[Approve for Production]
          H -->|No| J[Block Deployment]
          I --> K[Update Dashboard]
          J --> L[Report Missing Coverage]
    
    coverage_visualization:
      type: "d3_progress_bar"
      data:
        total_acs: 34
        covered_acs: 33
        coverage_percent: 97.06
        missing_acs:
          - "AC-TEST-004"
        target: 100
      
      color_thresholds:
        excellent: ">95%"
        good: "80-95%"
        warning: "50-80%"
        critical: "<50%"
  
  # ---------------------------------------------------------------------------
  # 6. GOVERNANCE ENFORCEMENT
  # ---------------------------------------------------------------------------
  governance:
    section_title: "SKULL Rule Enforcement (CORE-019)"
    description: "TDD-Master required for all development (planned and unplanned)"
    
    rule_details:
      rule_id: "CORE-019"
      name: "TDD-Master Required for All Development"
      severity: "BLOCKED"
      enforcement_trigger: "Any code change attempt"
      
      validation:
        - "All new code must have corresponding tests"
        - "Tests must be written before implementation (RED phase)"
        - "Coverage cannot decrease from baseline"
        - "Unplanned development routed through TDD-Master"
      
      consequences:
        bypass_attempt: "Operation BLOCKED with audit trail entry"
        missing_tests: "Code rejected at commit gate"
        coverage_drop: "CI/CD pipeline failure"
    
    enforcement_diagram:
      type: "mermaid_sequence"
      code: |
        sequenceDiagram
          participant D as Developer
          participant TDD as TDD-Master
          participant G as Governance Layer
          participant DB as Database
          
          D->>TDD: Request code change
          TDD->>G: Check CORE-019 compliance
          G->>G: Validate test existence
          alt Tests Exist
            G->>TDD: Approved
            TDD->>D: Proceed with GREEN phase
          else No Tests
            G->>TDD: BLOCKED
            TDD->>D: Redirect to RED phase
            TDD->>DB: Log governance violation
          end
  
  # ---------------------------------------------------------------------------
  # 7. PLANNED VS UNPLANNED DEVELOPMENT
  # ---------------------------------------------------------------------------
  development_modes:
    section_title: "Planned vs Unplanned Development"
    description: "TDD-Master handles both planned features and ad-hoc requests"
    
    comparison:
      type: "Two-column comparison table"
      columns:
        
        - mode: "Planned Development"
          trigger: "Completed planning phase with config.yaml"
          workflow:
            - "Planning Orchestrator creates plan"
            - "TDD-Master detects completed plan"
            - "Extract AC-IDs from config.yaml"
            - "Transform to TDD context"
            - "Execute RED → GREEN → REFACTOR"
          advantages:
            - "Full context available"
            - "AC coverage guaranteed"
            - "Governance rules pre-loaded"
          icon: "clipboard-check"
          color: "#10b981"
        
        - mode: "Unplanned Development"
          trigger: "Direct development request without plan"
          workflow:
            - "TDD-Master intercepts request"
            - "Generate minimal AC-IDs on-the-fly"
            - "Create lightweight test requirements"
            - "Execute RED → GREEN → REFACTOR"
            - "Update knowledge graph with patterns"
          advantages:
            - "Fast iteration for small changes"
            - "No planning overhead"
            - "Still enforces TDD workflow"
          icon: "lightning"
          color: "#f59e0b"
  
  # ---------------------------------------------------------------------------
  # 8. INTEGRATION WITH PLANNING
  # ---------------------------------------------------------------------------
  planning_integration:
    section_title: "Planning → TDD Workflow"
    description: "Seamless transition from planning to implementation"
    
    data_transformation:
      type: "Card with before/after visualization"
      
      before:
        source: "config.yaml (Planning output)"
        structure:
          plan_id: "PLAN-2026-001"
          feature_name: "User Authentication"
          acceptance_criteria:
            - "AC-AUTH-001: Users can log in with OAuth2"
            - "AC-AUTH-002: Session tokens are secure"
            - "AC-AUTH-003: Logout clears session data"
          governance_rules:
            - "CORE-008: TDD Enforcement"
            - "CORE-012: Security Patterns Required"
      
      after:
        source: "tdd-context.json (TDD-Master input)"
        structure:
          feature_name: "User Authentication"
          plan_id: "PLAN-2026-001"
          test_requirements:
            - ac_id: "AC-AUTH-001"
              test_file: "tests/auth/test_oauth_login.py"
              scenarios:
                - "Valid credentials"
                - "Invalid credentials"
                - "Expired token"
            - ac_id: "AC-AUTH-002"
              test_file: "tests/auth/test_session_security.py"
              scenarios:
                - "Token encryption"
                - "Token rotation"
                - "XSS prevention"
          domain_knowledge:
            auth_patterns:
              - "OAuth2 authorization code flow"
              - "JWT token structure"
              - "Refresh token rotation"
          governance_rules:
            - rule_id: "CORE-008"
              enforcement: "blocked"
              validation: "All code must have tests"
  
  # ---------------------------------------------------------------------------
  # 9. PATTERN LEARNING
  # ---------------------------------------------------------------------------
  pattern_learning:
    section_title: "Pattern Learning & Knowledge Graph"
    description: "Successful refactorings stored for future use"
    
    learning_process:
      steps:
        - step: "Refactoring Applied"
          description: "Code smell detected and refactored"
        - step: "Validation Success"
          description: "Tests pass, code quality improved"
        - step: "Pattern Extraction"
          description: "Generalize refactoring approach"
        - step: "Knowledge Graph Storage"
          description: "Store in cortex-brain/tier3/domain-patterns.yaml"
        - step: "Future Recommendations"
          description: "Suggest pattern for similar smells"
    
    example_pattern:
      type: "Code comparison card"
      before:
        smell: "DUPLICATE_CODE"
        code: |
          def calculate_discount_customer(price):
              tax = price * 0.1
              return price - tax
          
          def calculate_discount_employee(price):
              tax = price * 0.1
              return price - tax
      
      after:
        refactoring: "Extract common function"
        code: |
          def calculate_tax(price, rate=0.1):
              return price * rate
          
          def calculate_discount(price, user_type):
              tax = calculate_tax(price)
              return price - tax
      
      pattern_stored:
        name: "duplicate_extraction_pattern"
        category: "code_smell_removal"
        confidence: 0.92
        reuse_count: 7

# =============================================================================
# EXTERNAL REFERENCES (MAX 3)
# =============================================================================
external_references:
  - title: "Introduction to Test-Driven Development (TDD)"
    url: "https://www.youtube.com/watch?v=Gcqs1tX4VnI"
    description: "Fundamentals of TDD workflow (10:15)"
    embed: true
    caption: "Context: Core philosophy behind TDD-Master's RED-GREEN-REFACTOR cycle"
  
  - title: "Red-Green-Refactor Cycle in Practice"
    url: "https://www.youtube.com/watch?v=EZ05e7EMOLM"
    description: "Hands-on TDD tutorial with live coding (18:42)"
    embed: true
    caption: "Context: See the workflow TDD-Master automates"
  
  - title: "Code Smells and Refactoring Patterns"
    url: "https://refactoring.guru/refactoring/smells"
    description: "Comprehensive guide to code smells"
    embed: false
    link_text: "Visit Refactoring Guru"
    caption: "Context: Reference for all 11 code smells TDD-Master detects"

# =============================================================================
# INTERACTIVE ELEMENTS
# =============================================================================
interactivity:
  
  live_demo:
    enabled: true
    title: "Simulate TDD Workflow"
    description: "See how TDD-Master processes an acceptance criterion"
    
    input_form:
      fields:
        - name: "ac_id"
          label: "Acceptance Criterion"
          type: "select"
          options:
            - "AC-AUTH-001: OAuth login"
            - "AC-PAY-001: Process payment"
            - "AC-NOT-001: Send notification"
        - name: "current_phase"
          label: "Current Phase"
          type: "select"
          options:
            - "RED"
            - "GREEN"
            - "REFACTOR"
      
      button:
        text: "Execute Phase"
        action: "Show simulated phase execution with generated tests/code"
    
    output_display:
      type: "Tabbed panel"
      tabs:
        - tab: "Generated Tests"
          content: "Syntax-highlighted Python test code"
        - tab: "Implementation"
          content: "Minimal code to pass tests"
        - tab: "Refactoring Suggestions"
          content: "Detected code smells and fixes"
  
  code_samples:
    - language: "python"
      title: "Invoke TDD-Master (Planned)"
      code: |
        from src.orchestrators.tdd_master.tdd_master_orchestrator import TDDMasterOrchestrator
        
        orchestrator = TDDMasterOrchestrator(
            workspace_path="d:/PROJECTS/MyApp"
        )
        result = orchestrator.execute(context={
            "mode": "planned",
            "plan_id": "PLAN-2026-001"
        })
    
    - language: "python"
      title: "Invoke TDD-Master (Unplanned)"
      code: |
        orchestrator = TDDMasterOrchestrator(
            workspace_path="d:/PROJECTS/MyApp"
        )
        result = orchestrator.execute(context={
            "mode": "unplanned",
            "feature_name": "Quick Bug Fix",
            "description": "Fix null pointer in login"
        })

