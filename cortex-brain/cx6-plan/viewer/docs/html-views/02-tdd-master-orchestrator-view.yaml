    - "Radar chart has text alternative"
    - "Color not sole indicator (use icons + text)"
    - "Focus indicators on interactive elements"

responsive_design:
  breakpoints:
    mobile: "<768px"
    tablet: "768px-1024px"
    desktop: ">1024px"
  
  adaptations:
    mobile:
      - "Stack phase timeline vertically"
      - "Collapse code smell radar into list"
      - "Single-column comparison table"
