  planning_v5:
    file: "src/orchestrators/planning_v5.py"
    status: "DESIGNED (AC-PLAN-001 to AC-PLAN-008)"
    
    capabilities:
      - "Epic decomposition into phases"
      - "Phase decomposition into AC-IDs"
      - "Dependency graph generation"
      - "Resource estimation"
      - "Risk analysis"
    
    ac_ids:
      - "AC-PLAN-001: Epic decomposition"
      - "AC-PLAN-002: AC-ID generation"
      - "AC-PLAN-003: Dependency resolution"
      - "AC-PLAN-004: DoR validation"
      - "AC-PLAN-005: Output to tier1/planning/"
      - "AC-PLAN-006: Integration with progress tracker"
      - "AC-PLAN-007: Risk analysis"
      - "AC-PLAN-008: Resource estimation"

  ado_v2:
    file: "src/orchestrators/ado_v2.py"
