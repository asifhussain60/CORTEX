# ==============================================================================
# DATA FLOWS
# ==============================================================================
data_flows:

  request_to_execution:
    steps:
      - step: 1
        actor: "GitHub Copilot Agent"
        action: "Load context (progress, governance, AC registry)"
        output: "In-memory context snapshot"
      
      - step: 2
        actor: "GitHub Copilot Agent"
        action: "Match intent to routing pattern"
        output: "Orchestrator selection"
      
      - step: 3
        actor: "GitHub Copilot Agent"
        action: "Transform request with domain context"
        output: "Enhanced request string"
      
      - step: 4
        actor: "GitHub Copilot Agent"
        action: "Invoke: python3 -m src.main \"{request}\" --correlation-id {uuid}"
        output: "Terminal invocation"
      
      - step: 5
        actor: "MasterOrchestrator"
        action: "Receive request, merge governance"
        output: "Merged ruleset"
      
      - step: 6
        actor: "ActionPolicyEngine"
        action: "Evaluate required actions against trust boundaries"
        output: "ALLOW | DENY | REQUIRE_APPROVAL"
      
      - step: 7
        actor: "TodoManager"
        action: "Create trackable tasks"
        output: "Task list in progress-tracker.json"
      
      - step: 8
        actor: "Specialized Orchestrator"
        action: "Execute tasks (e.g., TDD-Master, Planning, ADO)"
        output: "Implementation artifacts"
      
      - step: 9
        actor: "StateManager"
        action: "Persist progress and AC updates"
        output: "Updated progress-tracker.json, AC-INDEX.yaml"
      
      - step: 10
        actor: "EnterpriseAuditLogger"
        action: "Log all decisions and actions"
        output: "Audit trail in governance.db"

  governance_evaluation:
    steps:
      - step: 1
        component: "GovernanceMerger"
        action: "Load Tier 0 (SKULL rules)"
        file: "cortex-brain/tier0/governance/core-rules.yaml"
      
      - step: 2
        component: "GovernanceMerger"
        action: "Load Tier 1 (Business requirements)"
        file: "cortex-brain/tier1/company-practices.yaml"
      
      - step: 3
        component: "GovernanceMerger"
        action: "Load Tier 2 (Engineering standards)"
        file: "cortex-brain/tier2/engineering-standards.yaml"
      
      - step: 4
        component: "GovernanceMerger"
        action: "Load Tier 3 (Knowledge patterns)"
        file: "cortex-brain/tier3/domain-patterns.yaml"
      
      - step: 5
        component: "GovernanceMerger"
        action: "Merge with precedence (Tier 0 > 1 > 2 > 3)"
        output: "Merged ruleset"
      
      - step: 6
        component: "MasterOrchestrator"
        action: "Evaluate request against merged rules"
        output: "required_actions + governance_decisions"

# ==============================================================================
# FAILURE MODES & MITIGATIONS
# ==============================================================================
failure_modes:

  concurrency_hazards:
    issue: "Two orchestrators update progress-tracker.json simultaneously"
    impact: "Race condition, corrupted JSON"
    mitigation:
      - "File locking via fcntl (Unix) / msvcrt (Windows)"
      - "Lock timeout: 5 seconds with exponential backoff"
      - "Atomic rename pattern for writes"
    detection: "Audit logs show interleaved writes"
    ac_id: "AC-STATE-003"

  state_corruption:
    issue: "Power failure during JSON write"
    impact: "Invalid JSON, failed parse on startup"
    mitigation:
      - "Write to temp file, validate, atomic rename"
      - ".backup file retained for rollback"
      - "Schema validation before commit"
    detection: "JSON parse exception, restore from .backup"
    ac_id: "AC-STATE-001"

  token_overflow:
    issue: "Operation generates >500 lines of code"
    impact: "HTTP 502, truncated response"
    mitigation:
      - "CORE-001 enforces <500 line increments"
      - "Planning breaks large operations into phases"
      - "TodoManager creates sub-tasks"
    detection: "Response length check, phase decomposition"
    ac_id: "AC-PLAN-002"

  routing_ambiguity:
    issue: "Multiple patterns match same intent"
    impact: "Non-deterministic orchestrator selection"
    mitigation:
      - "Explicit match order (exact > prefix > contains > regex)"
      - "Priority resolution for ties"
      - "Startup validation detects conflicts"
    detection: "Routing contract tests, conflict detector"
    ac_id: "AC-ROUTE-001"

  action_security_breach:
    issue: "Prompt injection attempts destructive command"
    impact: "Filesystem damage, credential leakage"
    mitigation:
      - "ActionPolicyEngine denies by default"
      - "Path sandboxing blocks dangerous directories"
      - "Command allowlist prevents shell execution"
    detection: "Policy violation logged at CRITICAL level"
    ac_id: "AC-SECURITY-001"

  governance_cache_staleness:
    issue: "Rules file updated but cache not invalidated"
    impact: "Stale governance decisions"
    mitigation:
      - "Cache invalidation on file modification timestamp"
      - "Cache version tracked in governance.db"
      - "Manual cache clear command available"
    detection: "Timestamp mismatch, hash verification"
    ac_id: "AC-GOV-004"

  rollout_regression:
    issue: "New orchestrator breaks production"
    impact: "Incorrect routing, failed operations"
    mitigation:
      - "Staged rollout (SHADOW → CANARY → ACTIVE)"
      - "Automated rollback on error rate >5%"
      - "24h shadow mode before canary"
    detection: "Error rate monitoring, automated alerts"
    ac_id: "AC-ROLLOUT-002"

