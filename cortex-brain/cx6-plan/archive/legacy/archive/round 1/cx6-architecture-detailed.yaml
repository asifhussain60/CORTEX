#
# IMPORTANT FOR REVIEWERS:
# This document explicitly calls out DESIGN vs IMPLEMENTED status.
# Items marked "DESIGNED" are accepted requirements but not yet built.
# Items marked "IMPLEMENTED" have code in place.
# Do NOT flag "DESIGNED" items as missing - they are intentionally future work.
# ==============================================================================

schema_version: "1.0"
last_updated: "2026-01-10T21:00:00Z"

# ==============================================================================
# CLARIFICATIONS FOR GPT REVIEW (READ THIS FIRST)
# ==============================================================================
review_guidance:
  purpose: "Prevent false positive findings on intentional design decisions"
  
  what_to_review:
    - "Logical consistency between components"
    - "Missing specifications in DESIGNED features"
    - "Security gaps in trust boundaries"
    - "Scalability concerns in data flows"
    - "Operational risks in failure modes"
  
  what_NOT_to_flag:
    - "Features marked DESIGNED that lack implementation (they are future work)"
    - "Differences between copilot-instructions.md and CORTEX.prompt.md (explained below)"
    - "SQLite usage for audit/state (intentional, with specified limits)"
    - "Async logging with overflow handling (already specified)"
    - "Import-time registration (being replaced per AC-ROUTE-002)"
  
  known_architectural_decisions:
    routing_table_duality:
      explanation: "CORTEX.prompt.md is SOURCE OF TRUTH (SPEC-019). copilot-instructions.md is STABLE REFERENCE for GitHub Copilot UI. They serve different purposes."
      cortex_prompt_md:
        purpose: "Runtime routing table, updated frequently as orchestrators are added"
        update_frequency: "Per orchestrator completion"
        consumers: ["MasterOrchestrator", "IntentClassifier"]
      copilot_instructions_md:
        purpose: "User-facing instructions for GitHub Copilot agent behavior"
        update_frequency: "Only for major workflow changes"
        consumers: ["GitHub Copilot Agent"]
      resolution: "Both files reference routing, but CORTEX.prompt.md is canonical data source"
    
    sqlite_for_state:
      explanation: "SQLite is INTENTIONAL for single-instance deployments"
      rationale:
        - "Embedded database, no separate process"
        - "WAL mode provides concurrency safety"
        - "Atomic writes via transaction boundaries"
        - "Sufficient for up to 10,000 operations/day"
      scale_limits:
        operations_per_day: 10000
        concurrent_orchestrators: 5
        audit_retention_days: 90
      migration_plan:
        trigger: ">10,000 ops/day or multi-instance deployment"
        target: "PostgreSQL with connection pooling"
        ac_id: "AC-SCALE-001"
    
    import_time_registration:
      status: "BEING REPLACED"
      current_state: "Legacy orchestrators use @orchestrator_registry decorator"
      target_state: "Explicit manifest-based discovery (AC-ROUTE-002)"
      migration_path: "CORE-021 allows legacy to remain until AC-MIGRATE-001"
      do_not_flag: "Import-time registration as broken - it's transitioning"

# ==============================================================================
# SYSTEM OVERVIEW
# ==============================================================================
system_overview:
  name: "CORTEX 6.0"
  tagline: "Production-Grade AI Orchestration with Long-Term Memory"
  
  core_capabilities:
    - "4-Tier Governance with SKULL rules (Tier 0)"
    - "Enterprise-grade audit trail (EnterpriseAuditLogger)"
    - "Test-Driven Development enforcement (TDD-Master)"
    - "Incremental requirements building (AC-ID cycle)"
    - "Git history intelligence (asset recovery)"
    - "Action security layer with sandboxing (AC-SECURITY-001)"
    - "Deterministic routing with conflict detection (AC-ROUTE-001)"
    - "Staged rollout lifecycle (AC-ROLLOUT-001)"
  
  design_principles:
    - "Audit-first: All operations logged before execution"
    - "Governance-enforced: Rules evaluated at runtime"
    - "Test-driven: No untested code in production"
    - "Incremental: Build requirements through implementation"
    - "Fail-safe: Rollback capability for all state changes"
    - "Deterministic: Same input → same output"
    - "Sandboxed: Action execution within trust boundaries"

# ==============================================================================
# ARCHITECTURAL LAYERS
# ==============================================================================
architectural_layers:

  # ----------------------------------------------------------------------------
  # LAYER 1: ENTRY POINT & ROUTING
  # ----------------------------------------------------------------------------
  entry_point:
    name: "GitHub Copilot Agent Proxy"
    file: ".github/prompts/CORTEX.prompt.md"
    status: "IMPLEMENTED"
    
    responsibilities:
      - "Load working state from progress-tracker.json"
      - "Verify governance rules from core-rules.yaml"
      - "Check AC-INDEX.yaml for active ACs"
      - "Search git history before creating new code"
      - "Match user intent to orchestrator pattern"
      - "Transform request with domain context"
      - "Generate correlation ID for audit trail"
      - "Invoke Python orchestrator via terminal"
    
    does_NOT_do:
      - "Execute orchestrator logic (Python does this)"
      - "Make governance decisions (rules decide)"
      - "Maintain history (audit logger records)"
    
    routing_flow: |
      User Request
        → Load Context (progress, governance, AC registry)
        → Pattern Match (routing table in CORTEX.prompt.md)
        → Transform Request (add domain keywords)
        → Generate Correlation ID
        → Invoke: python3 -m src.main "{request}" --correlation-id {uuid}
        → Display Python Output

  # ----------------------------------------------------------------------------
  # LAYER 2: MASTER ORCHESTRATOR (CORE WORKFLOW)
  # ----------------------------------------------------------------------------
  master_orchestrator:
    name: "MasterOrchestrator"
    file: "src/orchestrators/core/master_orchestrator.py"
    status: "DESIGNED (AC-ORCH-001 to AC-ORCH-008)"
    
    responsibilities:
      - "Receive transformed request from entry point"
      - "Merge governance tiers via GovernanceMerger"
      - "Evaluate request against merged ruleset"
      - "Produce required_actions list"
      - "Route to TodoManager for task creation"
      - "Execute tasks via specialized orchestrators"
      - "Persist progress to progress-tracker.json"
      - "Log all decisions to audit trail"
    
    default_workflow: |
      Request → GovernanceMerger → MasterOrchestrator → TodoManager → Execute
                  (merge rules)     (evaluate)          (create tasks)  (track)
    
    governance_integration:
      merger: "GovernanceMerger"
      tiers:
        - tier: 0
          source: "cortex-brain/tier0/governance/core-rules.yaml"
          precedence: "HIGHEST"
          content: "19 SKULL rules (immutable)"
        - tier: 1
          source: "cortex-brain/tier1/company-practices.yaml"
          precedence: "HIGH"
          content: "Active epic, business requirements"
        - tier: 2
          source: "cortex-brain/tier2/engineering-standards.yaml"
          precedence: "MEDIUM"
          content: "Code quality, testing, documentation"
        - tier: 3
          source: "cortex-brain/tier3/domain-patterns.yaml"
          precedence: "LOW"
          content: "Learned patterns, optimizations"
      
      conflict_resolution: "Tier 0 wins all conflicts"
      cache_invalidation: "On YAML file change (AC-GOV-004)"
    
    ac_ids:
      - "AC-ORCH-001: Request reception and validation"
      - "AC-ORCH-002: Governance merge and evaluation"
      - "AC-ORCH-003: Required actions generation"
      - "AC-ORCH-004: Orchestrator routing"
      - "AC-ORCH-005: Execution monitoring"
      - "AC-ORCH-006: Progress persistence"
      - "AC-ORCH-007: Error handling and rollback"
      - "AC-ORCH-008: Audit trail logging"

  # ----------------------------------------------------------------------------
  # LAYER 3: GOVERNANCE SYSTEM (4-TIER HIERARCHY)
  # ----------------------------------------------------------------------------
  governance_system:
    name: "4-Tier Governance with Merger"
    status: "IMPLEMENTED (Tier 0), DESIGNED (Tiers 1-3)"
    
    governance_merger:
      file: "src/orchestrators/core/governance_merger.py"
      status: "DESIGNED (AC-GOV-001 to AC-GOV-005)"
      
      responsibilities:
        - "Load YAML files from all 4 tiers"
        - "Merge rules with precedence (Tier 0 > Tier 1 > Tier 2 > Tier 3)"
        - "Detect conflicts and resolve via tier precedence"
        - "Cache merged ruleset with invalidation on file changes"
        - "Provide query interface for rule lookups"
      
      merge_algorithm: |
        1. Load Tier 0 (CORTEX CORE - SKULL rules)
        2. Load Tier 1 (Business requirements)
        3. Load Tier 2 (Engineering standards)
        4. Load Tier 3 (Knowledge patterns)
        5. For each rule category:
           - Start with Tier 3 rules
           - Overlay Tier 2 (overwrites conflicts)
           - Overlay Tier 1 (overwrites conflicts)
           - Overlay Tier 0 (overwrites conflicts, ALWAYS WINS)
        6. Return merged ruleset
      
      cache_strategy:
        enabled: true
        invalidation_trigger: "File modification timestamp change"
        refresh_interval: "On-demand (no periodic refresh)"
        implementation: "AC-GOV-004"
    
    tier0_core:
      name: "CORTEX CORE (SKULL Rules)"
      file: "cortex-brain/tier0/governance/core-rules.yaml"
      status: "IMPLEMENTED (21 rules)"
      precedence: "HIGHEST"
      
      rule_count: 21
      categories:
        - orchestration_lifecycle
        - response_formatting
        - portability
        - development_workflow
        - architecture_integrity
        - quality_gates
        - security_privacy
        - routing_integrity
        - knowledge_management
        - file_naming
      
      critical_rules:
        CORE-001: "Incremental execution (<500 lines per operation)"
        CORE-002: "No summary files (workspace clutter prevention)"
        CORE-005: "Path portability (cross-platform compatibility)"
        CORE-008: "TDD enforcement (no untested code)"
        CORE-009: "Plan file organization (tier-based)"
        CORE-017: "Governance enforcement (no bypass)"
        CORE-019: "TDD-Master required (all development)"
        CORE-020: "No markdown in cortex-brain/"
        CORE-021: "Forward-only compliance (new = scaffolder)"
        CORE-022: "Kebab-case file naming (max 20 chars)"
      
      enforcement:
        runtime_blocks: true
        pre_commit_hooks: true
        audit_logging: true
    
    tier1_business:
      name: "Business Requirements"
      file: "cortex-brain/tier1/company-practices.yaml"
      status: "DESIGNED (AC-KNOW-002)"
      precedence: "HIGH"
      
      content:
        - "Active epic requirements"
        - "Acceptance criteria for current phase"
        - "Compliance rules"
        - "Business constraints"
    
    tier2_engineering:
      name: "Engineering Standards"
      file: "cortex-brain/tier2/engineering-standards.yaml"
      status: "DESIGNED (AC-KNOW-001)"
      precedence: "MEDIUM"
      
      content:
        - "Code style guidelines"
        - "Testing requirements"
        - "Documentation standards"
        - "Security checklist"
    
    tier3_knowledge:
      name: "Knowledge Patterns"
      file: "cortex-brain/tier3/domain-patterns.yaml"
      status: "DESIGNED (AC-KNOW-003)"
      precedence: "LOW"
      
      content:
        - "Authentication patterns"
        - "Database patterns"
        - "API design patterns"
        - "Performance optimizations"

  # ----------------------------------------------------------------------------
  # LAYER 4: ACTION SECURITY LAYER (GPT RECOMMENDATION #1 - CRITICAL)
  # ----------------------------------------------------------------------------
  action_security:
    name: "ActionPolicyEngine"
    file: "src/security/action_policy_engine.py"
    status: "DESIGNED (AC-SECURITY-001 to AC-SECURITY-004)"
    priority: "CRITICAL"
    
    purpose: "Enforce trust boundaries for all system actions"
    
    trust_boundaries:
      filesystem:
        allowed_paths:
          - "d:/PROJECTS/CORTEX/"
          - "cortex-brain/**"
          - "src/**"
          - "tests/**"
        
        denied_paths:
          - ".git/"
          - ".env"
          - "**/*.key"
          - "**/*.pem"
          - "~/.ssh/"
          - "${HOME}/.ssh/"
          - "C:/Users/*/AppData/"
        
        operations:
          read: "Allowed within allowed_paths"
          write: "Requires ActionPolicy approval"
          delete: "Requires interactive confirmation"
          execute: "Blocked by default"
      
      command_execution:
        default_policy: "DENY"
        
        allowed_commands:
          - "git status"
          - "git log"
          - "git diff"
          - "python -m pytest"
          - "python -m src.main"
        
        denied_commands:
          - "rm -rf"
          - "del /f /s /q"
          - "format"
          - "dd if=/dev/zero"
          - "curl * | bash"
        
        shell_execution: "BLOCKED (no shell=True)"
      
      secret_handling:
        redaction_patterns:
          - "password="
          - "api_key="
          - "token="
          - "secret="
          - "Bearer "
        
        audit_policy: "NEVER log secrets (redact before logging)"
        storage_policy: "Use system keyring, never plaintext"
    
    policy_enforcement_flow: |
      RequiredAction Generated
        → ActionPolicyEngine.evaluate(action)
        → Check action type (read/write/execute/delete)
        → Check path (allowed vs denied)
        → Check command (allowlist vs denylist)
        → Check secret exposure risk
        → Return: ALLOW | DENY | REQUIRE_APPROVAL
        → If ALLOW: Execute and audit
        → If DENY: Block and log violation
        → If REQUIRE_APPROVAL: Prompt user, audit decision
    
    ac_ids:
      - "AC-SECURITY-001: Action type allowlist/denylist"
      - "AC-SECURITY-002: Path sandboxing with deny patterns"
      - "AC-SECURITY-003: Command execution allowlist"
      - "AC-SECURITY-004: Secret redaction and keyring storage"
    
    implementation_priority: "Phase 1 (Foundation) - MUST complete before any execution"

  # ----------------------------------------------------------------------------
  # LAYER 5: DETERMINISTIC ROUTING ENGINE (GPT RECOMMENDATION #2 - HIGH)
  # ----------------------------------------------------------------------------
  routing_engine:
    name: "DeterministicRoutingEngine"
    file: "src/orchestrators/core/routing_engine.py"
    status: "DESIGNED (AC-ROUTE-001 to AC-ROUTE-003)"
    priority: "HIGH"
    
    purpose: "Eliminate non-deterministic routing behavior"
    
    routing_semantics:
      match_order:
        - "1. EXACT: Pattern matches entire intent string"
        - "2. PREFIX: Pattern matches start of intent"
        - "3. CONTAINS: Pattern appears anywhere in intent"
        - "4. REGEX: Pattern is compiled regex match"
      
      priority_resolution:
        rule: "If multiple patterns match at same level, use explicit priority"
        conflict_handling: "Fail-fast at startup if ambiguous"
      
      example_patterns:
        exact:
          pattern: "epic review"
          matches: ["epic review"]
          no_match: ["epic review health", "review epic"]
        
        prefix:
          pattern: "implement"
          matches: ["implement auth", "implement user service"]
          no_match: ["build and implement", "fix implementation"]
        
        contains:
          pattern: "tdd"
          matches: ["use tdd", "tdd for auth", "implement with tdd"]
          no_match: ["test driven"]
        
        regex:
          pattern: "^(plan|create a plan|build plan)"
          matches: ["plan epic", "create a plan for auth"]
          no_match: ["epic planning", "implementation plan"]
    
    conflict_detection:
      startup_validation: true
      
      conflict_types:
        - type: "OVERLAPPING_PATTERNS"
          example: "Pattern 'implement' and 'implement auth' both match 'implement auth module'"
          resolution: "Explicit priority required in routing table"
        
        - type: "REGEX_AMBIGUITY"
          example: "Regex '^(plan|create)' and '^(plan|build)' overlap on 'plan'"
          resolution: "Merge patterns or set priority"
        
        - type: "PRIORITY_COLLISION"
          example: "Two patterns match at priority 10"
          resolution: "Fail-fast at startup, require unique priorities"
      
      validation_suite: "tests/integration/routing_contract_tests.py"
    
    routing_registry:
      source_of_truth: ".github/prompts/CORTEX.prompt.md (SPEC-019)"
      format: "YAML or structured table in markdown"
      
      schema:
        - pattern: "string | regex"
        - orchestrator: "module path"
        - priority: "integer (1-100)"
        - mode: "autonomous | interactive"
        - ac_id_prefix: "string"
        - match_type: "exact | prefix | contains | regex"
      
      update_protocol:
        when: "New orchestrator validated (DoD passed)"
        who: "TDD-Master or Scaffolder"
        validation: "Conflict detection MUST pass"
    
    ac_ids:
      - "AC-ROUTE-001: Formal routing semantics (exact > prefix > contains > regex)"
      - "AC-ROUTE-002: Explicit manifest-based discovery (replace import-time)"
      - "AC-ROUTE-003: Routing contract test suite"
    
    implementation_priority: "Phase 2 (Orchestration Core)"

  # ----------------------------------------------------------------------------
  # LAYER 6: STAGED ROLLOUT SYSTEM (GPT RECOMMENDATION #3 - HIGH)
  # ----------------------------------------------------------------------------
  staged_rollout:
    name: "StagedRolloutManager"
    file: "src/orchestrators/core/rollout_manager.py"
    status: "DESIGNED (AC-ROLLOUT-001 to AC-ROLLOUT-003)"
    priority: "HIGH"
    
    purpose: "Prevent production-wide regressions from new orchestrator releases"
    
    activation_states:
      REGISTERED:
        description: "Orchestrator exists in registry but not routable"
        routing: "Not in routing table"
        testing: "Unit tests only"
      
      SHADOW:
        description: "Orchestrator invoked alongside production, output discarded"
        routing: "Shadow route (logs comparison)"
        testing: "Integration tests with production comparison"
        duration: "24 hours minimum"
      
      CANARY:
        description: "Orchestrator serves 5% of matching traffic"
        routing: "Partial routing via canary_percentage"
        testing: "Error rate monitoring, automated rollback"
        duration: "48 hours minimum"
        rollback_threshold: "Error rate >5% vs. baseline"
      
      ACTIVE:
        description: "Orchestrator serves 100% of matching traffic"
        routing: "Full routing"
        testing: "Continuous monitoring"
      
      DEPRECATED:
        description: "Orchestrator being phased out"
        routing: "Fallback only"
        testing: "No new features"
      
      ARCHIVED:
        description: "Orchestrator removed from routing"
        routing: "Not routable"
        testing: "Historical audit only"
    
    rollout_workflow: |
      1. New Orchestrator Validated (DoD passed)
      2. Set state = REGISTERED
      3. Run unit + integration tests
      4. Promote to SHADOW
      5. Run 24h shadow comparison (log output deltas)
      6. If deltas acceptable, promote to CANARY
      7. Route 5% traffic, monitor error rate
      8. If error rate <5% for 48h, promote to ACTIVE
      9. Route 100% traffic
      10. Continuous monitoring
    
    automated_rollback:
      triggers:
        - "Error rate >5% vs. 7-day baseline"
        - "Response time >2x p95 baseline"
        - "Null/empty responses >1%"
      
      actions:
        - "Demote orchestrator to previous state"
        - "Route traffic to fallback orchestrator"
        - "Create incident in progress-tracker.json"
        - "Alert via audit log (CRITICAL level)"
      
      human_approval_required: false
    
    ac_ids:
      - "AC-ROLLOUT-001: Activation state machine (REGISTERED → SHADOW → CANARY → ACTIVE)"
      - "AC-ROLLOUT-002: Automated rollback on error rate threshold"
      - "AC-ROLLOUT-003: Routing percentage for canary deployments"
    
    implementation_priority: "Phase 2 (Orchestration Core)"

  # ----------------------------------------------------------------------------
  # LAYER 7: AUDIT INFRASTRUCTURE
  # ----------------------------------------------------------------------------
  audit_infrastructure:
    name: "EnterpriseAuditLogger"
    file: "src/infrastructure/enhanced_audit_logger.py"
    status: "IMPLEMENTED"
    
    storage:
      database: "cortex-brain/database/governance.db"
      schema: "SQLite with WAL mode"
      retention:
        CRITICAL: "90 days"
        ERROR: "90 days"
        WARNING: "60 days"
        INFO: "30 days"
        DEBUG: "7 days"
        TRACE: "7 days"
    
    logging_strategy:
      mode: "Async buffered with overflow handling"
      buffer_size: 1000
      flush_interval: "5 seconds"
      overflow_policy: "Drop oldest DEBUG/TRACE, keep ERROR+"
    
    categories:
      - GOVERNANCE: "Rule enforcement decisions"
      - ORCHESTRATOR: "Execution lifecycle"
      - VALIDATION: "AC validation results"
      - INFRASTRUCTURE: "System health"
      - BRAIN: "Knowledge operations"
      - INTEGRATION: "External API calls"
      - MCP: "Tool invocations"
      - SECURITY: "Action policy decisions (NEW)"
      - ROUTING: "Intent classification results (NEW)"
      - ROLLOUT: "State transitions (NEW)"
    
    query_capabilities:
      - "Filter by AC-ID"
      - "Filter by correlation ID"
      - "Filter by category"
      - "Filter by level"
      - "Time range queries"
      - "Full-text search"
    
    ac_ids:
      - "AC-AUDIT-001: Structured logging schema"
      - "AC-AUDIT-002: SQLite WAL configuration"
      - "AC-AUDIT-003: Retention policy enforcement"
      - "AC-AUDIT-004: Query interface"
      - "AC-AUDIT-005: Async buffering"
      - "AC-AUDIT-006: Overflow handling"

  # ----------------------------------------------------------------------------
  # LAYER 8: STATE MANAGEMENT
  # ----------------------------------------------------------------------------
  state_management:
    name: "StateManager"
    file: "src/orchestrators/core/state_manager.py"
    status: "DESIGNED (AC-STATE-001 to AC-STATE-003)"
    
    tracked_state:
      progress_tracker:
        file: "cortex-brain/tier1/tracking/progress-tracker.json"
        schema_version: "1.6"
        contents:
          - active_epic
          - current_phase
          - current_todo
          - completed_todos
          - blockers
      
      ac_registry:
        file: "cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml"
        schema_version: "1.4"
        contents:
          - ac_id
          - status
          - tests
          - implementation_file
          - audit_trail
      
      governance_state:
        file: "cortex-brain/database/governance.db"
        contents:
          - merged_rules_cache
          - rule_evaluation_history
          - conflict_resolutions
    
    concurrency_safety:
      mechanism: "File locking via fcntl (Unix) / msvcrt (Windows)"
      lock_timeout: "5 seconds"
      retry_strategy: "Exponential backoff (3 attempts)"
    
    atomic_updates:
      pattern: "Write to temp file → validate → atomic rename"
      validation: "JSON/YAML parse + schema check"
      rollback: "Keep previous version as .backup"
    
    ac_ids:
      - "AC-STATE-001: Progress tracker persistence"
      - "AC-STATE-002: AC registry synchronization"
      - "AC-STATE-003: Concurrency-safe updates"

  # ----------------------------------------------------------------------------
  # LAYER 9: TDD ENFORCEMENT
  # ----------------------------------------------------------------------------
  tdd_enforcement:
    name: "TDD-Master"
    file: "src/orchestrators/tdd_master.py"
    status: "DESIGNED (AC-TDD-001 to AC-TDD-010)"
    
    workflow:
      - "1. Receive implementation request"
      - "2. Generate failing test (RED)"
      - "3. Implement minimal code (GREEN)"
      - "4. Refactor for quality (REFACTOR)"
      - "5. Validate AC criteria"
      - "6. Update AC-INDEX.yaml"
      - "7. Audit trail logging"
    
    governance_integration:
      rule: "CORE-019: TDD-Master required for all development"
      enforcement: "Direct coding blocked at runtime"
      exemptions: "None (applies to planned and unplanned work)"
    
    ac_ids:
      - "AC-TDD-001: RED phase (failing test generation)"
      - "AC-TDD-002: GREEN phase (minimal implementation)"
      - "AC-TDD-003: REFACTOR phase (quality improvement)"
      - "AC-TDD-004: AC validation"
      - "AC-TDD-005: Test coverage reporting"
      - "AC-TDD-006: Integration with AC-INDEX"
      - "AC-TDD-007: Audit trail integration"
      - "AC-TDD-008: Rollback on validation failure"
      - "AC-TDD-009: STS test strategy integration"
      - "AC-TDD-010: Contract tests for orchestrators"

# ==============================================================================
# SPECIALIZED ORCHESTRATORS
# ==============================================================================
