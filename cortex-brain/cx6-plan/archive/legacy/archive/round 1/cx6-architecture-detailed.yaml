    ac_ids:
      - "AC-ADO-001: Work item creation"
      - "AC-ADO-002: Status synchronization"
      - "AC-ADO-003: Query interface"
      - "AC-ADO-004: Bulk operations"
      - "AC-ADO-005: Attachment handling"
      - "AC-ADO-006: Contract tests"

