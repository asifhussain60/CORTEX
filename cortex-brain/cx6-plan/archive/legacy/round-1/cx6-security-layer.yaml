# Priority: CRITICAL (Phase 1 Foundation)
#
# REVIEWER NOTE:
# This is a DESIGN SPECIFICATION for a component not yet implemented.
# Do NOT flag as "missing implementation" - that is intentional.
# Review for: logical completeness, security gaps, operational feasibility.
#
# ROUND 3 UPDATES:
# - Removed 'dir' command from allowlist (cross-platform wrapper instead)
# - Added EXECUTE placeholder constraints (no unconstrained {args})
# - Added approval protocol race condition semantics (AC-SECURITY-005)
# - Added canonical path resolution with Windows edge cases (AC-SECURITY-006)
# - Added explicit DRY_RUN binding for SHADOW mode
#
# DESIGN PHILOSOPHY:
# CORTEX uses incremental validation via TDD. Security boundary constraints
# (path canonicalization, EXECUTE placeholders, approval gates) are enforced
# upfront. Comprehensive validation rules are discovered incrementally through
# RED→GREEN→REFACTOR cycles, not exhaustively specified before implementation.
