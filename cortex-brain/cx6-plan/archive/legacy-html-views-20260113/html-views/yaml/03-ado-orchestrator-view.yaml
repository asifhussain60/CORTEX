schema_version: "1.0"
view_id: "ado-orchestrator"
view_name: "ADO Operations v2 - Azure DevOps Integration"
priority: 3
status: "approved"
last_updated: "2026-01-12"

# =============================================================================
# THEME & DESIGN SYSTEM
# =============================================================================
theme:
  base_reference: "plan-viewer.html"
  inherit_css_variables: true
  additional_colors:
    ado_epic: "#ff6b6b"
    ado_feature: "#4ecdc4"
    ado_story: "#45b7d1"
    ado_task: "#96ceb4"

# =============================================================================
# NAVIGATION
# =============================================================================
navigation:
  back_link:
    text: "← Back to Plan Viewer"
    href: "../plan-viewer.html"
  breadcrumb:
    - "CORTEX 6.0"
    - "Orchestrators"
    - "ADO Operations v2"

# =============================================================================
# CONTENT STRUCTURE
# =============================================================================
content:
  
  hero:
    title: "ADO Operations v2"
    subtitle: "Autonomous Azure DevOps Work Item Generation"
    orchestrator_mode: "AUTONOMOUS"
    key_stats:
      - label: "Work Item Types"
        value: "4"
        description: "Epic → Feature → User Story → Task"
      - label: "Validation Gates"
        value: "2"
        description: "Definition of Ready & Definition of Done"
      - label: "Story Point Method"
        value: "SWAGGER"
        description: "Calibrated estimation"
  
  work_item_hierarchy:
    section_title: "Work Item Hierarchy"
    description: "Epic → Feature → User Story → Task with automatic linking"
    
    diagram:
      type: "mermaid_flowchart"
      code: |
        flowchart TD
          E[Epic: Authentication System] --> F1[Feature: OAuth Integration]
          E --> F2[Feature: Session Management]
          F1 --> US1[User Story: OAuth Login]
          F1 --> US2[User Story: Token Refresh]
          F2 --> US3[User Story: Session Storage]
          US1 --> T1[Task: Implement OAuth flow]
          US1 --> T2[Task: Write tests]
          US2 --> T3[Task: Token rotation logic]
    
    work_item_details:
      - type: "Epic"
        purpose: "Large business objective (months)"
        fields:
          - "Title"
          - "Description"
          - "Business value"
          - "Acceptance criteria"
        color: "#ff6b6b"
      
      - type: "Feature"
        purpose: "Group of related user stories (weeks)"
        fields:
          - "Title"
          - "Description"
          - "Linked epic"
          - "Story point sum"
        color: "#4ecdc4"
      
      - type: "User Story"
        purpose: "User-facing functionality (days)"
        fields:
          - "Title"
          - "As a [role], I want [feature], so that [benefit]"
          - "Story points (1, 2, 3, 5, 8, 13)"
          - "Acceptance criteria"
          - "DoR/DoD checklist"
        color: "#45b7d1"
      
      - type: "Task"
        purpose: "Implementation step (hours)"
        fields:
          - "Title"
          - "Description"
          - "Estimated hours"
          - "Assigned to"
        color: "#96ceb4"
  
  dor_dod_validation:
    section_title: "Definition of Ready & Definition of Done"
    
    definition_of_ready:
      description: "Criteria before work can start"
      checklist:
        - "User story has clear acceptance criteria"
        - "Story is sized (story points assigned)"
        - "Dependencies identified"
        - "Design mockups attached (if UI work)"
        - "Technical approach documented"
      validation_trigger: "Before moving to 'In Progress'"
    
    definition_of_done:
      description: "Criteria for work completion"
      checklist:
        - "All acceptance criteria met"
        - "Code reviewed and approved"
        - "Tests written and passing (≥80% coverage)"
        - "Documentation updated"
        - "Security scan passed"
        - "Deployed to staging"
      validation_trigger: "Before moving to 'Done'"
    
    enforcement:
      type: "Automated gate"
      behavior: "ADO Orchestrator blocks status transitions if checklist incomplete"
  
  story_point_estimation:
    section_title: "SWAGGER Story Point Calibration"
    description: "Historical data-driven estimation"
    
    swagger_method:
      name: "SWAGGER (Statistical Weight-Adjusted Growth Estimation Regression)"
      steps:
        - "Query knowledge graph for similar features"
        - "Extract actual story points from completed work"
        - "Calculate weighted average (recent work weighted higher)"
        - "Adjust for complexity factors (dependencies, unknowns)"
        - "Round to Fibonacci sequence (1, 2, 3, 5, 8, 13)"
      
      formula:
        display: "SP = round_fibonacci(Σ(w_i × sp_i) × complexity_factor)"
        variables:
          - "w_i: Weight for historical item i (exponential decay)"
          - "sp_i: Story points of historical item i"
          - "complexity_factor: 1.0-2.0 based on unknowns"
    
    diagram:
      type: "d3_scatter_plot"
      x_axis: "Historical Complexity"
      y_axis: "Actual Story Points"
      data_points: "Similar features from knowledge graph"
      regression_line: "Show trend with confidence interval"
  
  kanban_board_simulation:
    section_title: "Work Item Status Flow"
    
    diagram:
      type: "d3_interactive_kanban"
      columns:
        - name: "Backlog"
          description: "Ready to be prioritized"
          color: "#6b7280"
        - name: "To Do"
          description: "Ready for development (DoR passed)"
          color: "#3b82f6"
        - name: "In Progress"
          description: "Active development"
          color: "#f59e0b"
        - name: "Code Review"
          description: "Awaiting review"
          color: "#8b5cf6"
        - name: "Testing"
          description: "QA validation"
          color: "#ec4899"
        - name: "Done"
          description: "DoD passed, deployed"
          color: "#10b981"
      
      sample_cards:
        - title: "OAuth Login"
          type: "User Story"
          story_points: 5
          status: "In Progress"
          assignee: "Developer A"
        - title: "Session Storage"
          type: "User Story"
          story_points: 3
          status: "To Do"
        - title: "Token Rotation"
          type: "Task"
          hours: 4
          status: "Done"
      
      interactions:
        drag_drop: "Move cards between columns"
        click: "Show work item details"
        filter: "By epic, feature, assignee, or sprint"
  
  parent_child_linking:
    section_title: "Automatic Work Item Linking"
    description: "Parent-child relationships maintained automatically"
    
    diagram:
      type: "d3_collapsible_tree"
      root:
        id: "EPIC-001"
        title: "Authentication System"
        type: "Epic"
        children:
          - id: "FEATURE-001"
            title: "OAuth Integration"
            type: "Feature"
            parent: "EPIC-001"
            children:
              - id: "US-001"
                title: "OAuth Login"
                type: "User Story"
                parent: "FEATURE-001"
                story_points: 5
                children:
                  - id: "TASK-001"
                    title: "Implement OAuth flow"
                    type: "Task"
                    hours: 8
                  - id: "TASK-002"
                    title: "Write integration tests"
                    type: "Task"
                    hours: 4
    
    linking_rules:
      - "Tasks must have User Story parent"
      - "User Stories must have Feature parent"
      - "Features must have Epic parent"
      - "Story points roll up: Epic = sum of all child Features"
      - "Status propagates: Epic 'Done' only if all children 'Done'"
  
  storage_integration:
    section_title: "Storage & Database"
    
    storage_locations:
      database:
        path: "cortex-brain/database/ado-work-items.db"
        schema: "SQLite with tables: epics, features, user_stories, tasks"
        retention: "Permanent (historical reference)"
      
      documents:
        path: "cortex-brain/documents/planning/ado"
        format: "Markdown exports for human review"
        retention: "90 days (archival)"
    
    schema_diagram:
      type: "mermaid_entity_relationship"
      code: |
        erDiagram
          EPICS ||--o{ FEATURES : contains
          FEATURES ||--o{ USER_STORIES : contains
          USER_STORIES ||--o{ TASKS : contains
          
          EPICS {
            string id PK
            string title
            string description
            string business_value
            date start_date
            date target_date
          }
          
          FEATURES {
            string id PK
            string epic_id FK
            string title
            int story_point_sum
          }
          
          USER_STORIES {
            string id PK
            string feature_id FK
            string title
            int story_points
            json acceptance_criteria
            boolean dor_passed
            boolean dod_passed
          }
          
          TASKS {
            string id PK
            string user_story_id FK
            string title
            int estimated_hours
            string assignee
          }
  
  historical_context_integration:
    section_title: "Knowledge Graph Integration"
    description: "Leverage past work for better estimation and planning"
    
    integration_points:
      - point: "Similar Feature Detection"
        description: "Query knowledge graph for features with similar keywords"
        benefit: "More accurate story point estimation"
      
      - point: "Blocker Prediction"
        description: "Identify blockers from similar past epics"
        benefit: "Proactive risk mitigation"
      
      - point: "Team Velocity"
        description: "Calculate historical velocity per team/person"
        benefit: "Realistic sprint planning"
      
      - point: "Pattern Reuse"
        description: "Suggest implementation patterns from past successes"
        benefit: "Faster development, fewer errors"

# =============================================================================
# EXTERNAL REFERENCES (MAX 3)
# =============================================================================
external_references:
  - title: "Azure Boards - Creating Epics, Features & User Stories"
    url: "https://www.youtube.com/watch?v=u-YMISz_v2g"
    description: "Tutorial on ADO work item hierarchies (9:15)"
    embed: true
    caption: "Context: How ADO Operations v2 automates this workflow"
  
  - title: "Story Point Estimation Techniques"
    url: "https://www.youtube.com/watch?v=NrHpXvDXVrw"
    description: "Planning poker and estimation methods (12:30)"
    embed: true
    caption: "Context: SWAGGER method compared to manual estimation"
  
  - title: "Definition of Ready vs Definition of Done"
    url: "https://www.scrum.org/resources/blog/walking-through-definition-done"
    description: "Scrum.org article on DoR/DoD"
    embed: false
    link_text: "Read on Scrum.org"
    caption: "Context: Standards ADO Orchestrator enforces"

# =============================================================================
# INTERACTIVE ELEMENTS
# =============================================================================
interactivity:
  
  live_demo:
    enabled: true
    title: "Generate Work Item"
    
    input_form:
      fields:
        - name: "type"
          label: "Work Item Type"
          type: "select"
          options: ["Epic", "Feature", "User Story", "Task"]
        - name: "title"
          label: "Title"
          type: "text"
        - name: "description"
          label: "Description"
          type: "textarea"
      
      button:
        text: "Generate"
        action: "Create simulated work item with auto-generated fields"
    
    output_display:
      type: "Card with ADO-style formatting"
      show_fields:
        - "ID (auto-generated)"
        - "Title"
        - "Description"
        - "Story points (if User Story)"
        - "Acceptance criteria (auto-generated)"
        - "Parent link (if applicable)"

# =============================================================================
# METADATA
# =============================================================================
metadata:
  target_audience: "Product managers, scrum masters, technical leads"
  reading_time: "7-9 minutes"
  complexity_level: "Intermediate"
  
  implementation_references:
    - path: "src/orchestrators/ado/ado_orchestrator.py"
    - path: "cortex-brain/database/ado-work-items.db"

accessibility:
  wcag_level: "AA"

responsive_design:
  mobile: "Stack kanban columns vertically"
  tablet: "2-column kanban"
  desktop: "Full multi-column kanban"
