    response_template_architecture:
      name: 3-Layer Response Template Architecture
      ac_ids:
      - AC-TEMPLATE-001
      - AC-TEMPLATE-002
      - AC-TEMPLATE-003
      - AC-TEMPLATE-004
      - AC-TEMPLATE-005
      - AC-TEMPLATE-006
      - AC-TEMPLATE-007
      - AC-TEMPLATE-008
      priority: HIGH
      duration: 4 weeks (3 phases)
      owner: Infrastructure Team
      rationale: Replace 2046-line response-templates-v4.yaml (CORE-002 violation)
      capabilities:
      - 'Layer 1: Core blocks (tier0/response-blocks.yaml, 50 lines)'
      - 'Layer 2: Category templates (5 files × 50 lines = 250 lines)'
      - 'Layer 3: Orchestrator overrides (15 lines per manifest)'
      - '86% reduction: 2046 lines → <300 lines'
      - Backwards compatibility during migration
      - Multi-category inheritance support
      phases:
        phase_1_foundation:
          name: Foundation
          duration: Week 1
