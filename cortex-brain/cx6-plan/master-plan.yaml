llm_cost_strategy:
  overall_approach: Sonnet 4.5 as default; upgrade to Opus only for critical architectural
    decisions
  philosophy: Users not forced to switch - recommendations are optional optimizations
  phase_breakdown:
    phase_1: 90-100% Sonnet 4.5, 0-10% Opus 4.5 (optional) = ~1.0-1.2x baseline
    phase_2: 85-100% Sonnet 4.5, 0-15% Opus 4.5 (optional) = ~1.0-1.3x baseline
    phase_3: 70-100% Sonnet 4.5, 0-30% GPT-5/Haiku (evaluate) = ~0.8-1.0x baseline
    phase_4: 60-100% Sonnet 4.5, 0-40% Opus 4.5 (optional) = ~1.0-1.8x baseline
  default_project_cost: ~1.0x baseline (100% Sonnet 4.5 across all phases)
  optimized_project_cost: ~1.2x baseline (strategic Opus use + Phase 3 bulk optimization)
  cost_optimization_rationale: 'Sonnet 4.5 handles 95%+ of CORTEX operations effectively.

    Optional Opus upgrades prevent architectural rework (5-10% of critical decisions).

    Phase 3 bulk operations can evaluate GPT-5 (1x) or Haiku (0.33x) for cost savings.

    Snowball effect makes later phases faster, reducing total token consumption.

    '
  switching_guidance:
    stay_with_sonnet: Recommended for 90-100% of operations - best balance for CORTEX
    when_to_upgrade_opus: 🧠 Complex architectural decisions, 🔍 subtle technical debt
      detection, 📊 algorithm optimization
    when_to_evaluate_alternatives: ⚡ Bulk operations (Phase 3), 📝 documentation generation,
      ✅ simple validation
  model_comparison:
    claude_sonnet_4_5:
      cost: 1x (baseline)
      capability: Excellent
      recommendation: PRIMARY - use for 90-100% of CORTEX operations
      strengths: Best balance, extended context, superior code generation, tool use
        expertise
    claude_opus_4_5:
      cost: 3x
      capability: Maximum
      recommendation: OPTIONAL - use sparingly for critical architecture (0-10% of
        operations)
      strengths: Deep reasoning, complex optimization, nuanced semantic understanding
      when: Architectural decisions that impact long-term system behavior
    gpt_5:
      cost: 1x
      capability: Good (evaluate)
      recommendation: EVALUATE - test for Phase 3 bulk operations
      strengths: Cost-effective alternative for simple operations
      concerns: May lack tool use precision for CORTEX audit integration - test first
    claude_haiku_4_5:
      cost: 0.33x
      capability: Good
      recommendation: EVALUATE - test for Phase 3 bulk operations
      strengths: High-throughput, cost-effective for established patterns
      avoid_for: TDD-Master execution, governance logic, investigation, architecture
  anti_patterns:
    avoid_opus_for_bulk: 3x cost wasted on simple operations (use Sonnet/GPT/Haiku)
    avoid_haiku_for_architecture: Cannot handle complex reasoning for foundation design
    avoid_gemini_flash: Insufficient context window for 4-tier governance merging
    test_before_switching: Evaluate GPT-5/Haiku performance on non-critical tasks
      before full adoption
