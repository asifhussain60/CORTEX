# CORTEX Aggressive Cleanup Rules Configuration
# 
# IMPORTANT: This is a STRICT cleanup policy for maintaining CORTEX 3.0/4.0 focus
# Only keeps active development artifacts, archives everything else
#
# SAFETY: Does NOT conflict with:
# - Planning System 2.0 (orchestrator-manifests/, documents/planning/)
# - TDD Workflow (tests/, tier0-3/)
# - System Maintenance (admin/, config/)
# - Core orchestrators (src/orchestrators/)
# - Response templates (response-templates/)
#
# Author: Asif Hussain
# Copyright: © 2025 Asif Hussain. All rights reserved.
# Version: 1.0
# Date: December 14, 2025

version: "1.0"
mode: "aggressive"
workspace_root: "."

# ============================================================================
# PROTECTED RESOURCES (NEVER ARCHIVE)
# ============================================================================
# Critical for CORTEX 3.0/4.0 operations

protected_directories:
  # Core brain infrastructure
  - "tier0"
  - "tier1"
  - "tier2"
  - "tier3"
  - "admin"
  - "config"
  - "documents"
  - "orchestrator-manifests"
  - "response-templates"
  
  # Active development
  - "checkpoints"
  - "dashboards"
  - "discovery-reports"
  - "feedback"
  - "learning"
  - "metadata"
  - "metrics"
  
  # Source code and tests
  - "src"
  - "tests"
  - "scripts"
  - "docs"

protected_files:
  # Brain configuration
  - "brain-protection-rules.yaml"
  - "capabilities.yaml"
  - "cleanup-rules.yaml"
  - "aggressive-cleanup-rules.yaml"  # Self-preservation
  - "development-context.yaml"
  - "file-relationships.yaml"
  - "git-checkpoint-rules.yaml"
  - "knowledge-graph.yaml"
  - "lessons-learned.yaml"
  - "module-definitions.yaml"
  - "multilingual-templates.yaml"
  - "operations-config.yaml"
  - "publish-config.yaml"
  - "reconciliation-config.yaml"
  - "refactoring-rules.yaml"
  - "response-*.yaml"
  - "token-optimization-rules.yaml"
  - "TRUTH-SOURCES.yaml"
  - "user-dictionary.yaml"
  
  # Quick reference guides (active)
  - "*-QUICK-REF.md"
  - "SUCCESS-TEMPLATE-USAGE-GUIDE.md"
  - "README-ORGANIZATION.md"
  
  # Databases
  - "cortex-brain.db"
  - "sessions.db"
  - "*.lock"
  
  # Root configuration
  - "CHANGELOG.md"
  - "LICENSE"
  - "README.md"
  - "requirements.txt"
  - "pytest.ini"
  - "cortex.config.json"
  - "cortex.config.template.json"
  - "cortex-operations.yaml"
  - "CORTEX.code-workspace"

# ============================================================================
# AGGRESSIVE ARCHIVAL RULES
# ============================================================================
# Archive candidates based on age, relevance, and type

archival_categories:
  
  # --------------------------------------------------------------------------
  # Legacy Design Documents (ARCHIVE)
  # --------------------------------------------------------------------------
  legacy_design:
    enabled: true
    priority: high
    risk_level: low
    
    directories:
      cortex_brain:
        - "schemas"           # Legacy database schemas
        - "reference"         # Old reference docs
        - "protection-layers" # Superseded by tier0
        - "cognitive-framework" # Early design docs
        - "components"        # Legacy component system
        - "cortex-3.0-design" # Superseded by 3.8.1
        - "cortex-brain"      # Nested duplicate
        - "protection"        # Superseded by brain-protection-rules.yaml
        - "operations"        # Superseded by operations-config.yaml
        - "templates"         # Superseded by response-templates/
        - "validation"        # Legacy validation system
        - "agents"            # Old agent framework
        - "cleanup-manifests" # Legacy cleanup reports
        - "cache"             # Temporary cache files
        - "narrative-templates" # Superseded by response-templates/
    
    action: archive
    reason: "Legacy design artifacts superseded by CORTEX 3.0/4.0 architecture"
    
    safety:
      require_confirmation: false
      create_manifest: true
      allow_rollback: true
  
  # --------------------------------------------------------------------------
  # Backup Directories (ARCHIVE)
  # --------------------------------------------------------------------------
  backups:
    enabled: true
    priority: high
    risk_level: low
    
    directories:
      cortex_brain:
        - "archives"          # Previous archives
        - "backups"           # Backup files
        - "cleanup-logs"      # Old cleanup logs
        - "cleanup-reports"   # Old cleanup reports
        - "health-reports"    # Old health reports
        - "analytics"         # Historical analytics
        - "artifacts"         # Build artifacts
        - "exports"           # Exported data
        - "inventory-v1"      # Legacy inventory
        - "metrics-history"   # Historical metrics
        - "migrations"        # Database migrations
        - "setup-reports"     # Setup operation reports
        - "sweeper-logs"      # Sweeper operation logs
        - "conversation-captures" # Legacy captures
        - "imported-conversations" # Legacy imports
    
    action: archive
    reason: "Historical backups, logs, and reports not needed for active development"
    
    safety:
      require_confirmation: false
      create_manifest: true
      allow_rollback: true
  
  # --------------------------------------------------------------------------
  # Development Artifacts (ARCHIVE)
  # --------------------------------------------------------------------------
  dev_artifacts:
    enabled: true
    priority: medium
    risk_level: low
    
    directories:
      root:
        - "htmlcov"           # Coverage reports
        - "test_merge"        # Test merge directory
        - "cortex-lens-output" # Lens output files
        - "logs"              # Application logs (old)
        - "cortex-extension"  # Legacy VS Code extension
        - "deploy-packages"   # Old deploy packages
        - "examples"          # Example code (not core)
        - "workflows"         # Legacy workflow files
        - "static"            # Static assets (legacy)
        - "templates"         # Legacy templates
    
    action: archive
    reason: "Development artifacts, logs, and legacy code not part of core CORTEX 3.0/4.0"
    
    safety:
      require_confirmation: false
      create_manifest: true
      allow_rollback: true
  
  # --------------------------------------------------------------------------
  # Temporary Files (ARCHIVE)
  # --------------------------------------------------------------------------
  temp_files:
    enabled: true
    priority: high
    risk_level: low
    
    patterns:
      root:
        - "*.log"              # Log files (except in active dirs)
        - "*_output.txt"       # Test output files
        - "*_summary.txt"      # Summary files
        - "*.tmp"              # Temp files
        - "*.bak"              # Backup files
        - ".DS_Store"          # macOS metadata
        - "Thumbs.db"          # Windows metadata
    
    action: archive
    reason: "Temporary and log files not needed for active development"
    
    safety:
      require_confirmation: false
      create_manifest: true
      allow_rollback: true
  
  # --------------------------------------------------------------------------
  # Age-Based Archival (30+ days old)
  # --------------------------------------------------------------------------
  age_based:
    enabled: true
    priority: low
    risk_level: medium
    
    rules:
      - path: "cortex-brain"
        age_days: 30
        exclude_dirs: 
          - "tier0"
          - "tier1"
          - "tier2"
          - "tier3"
          - "admin"
          - "config"
          - "documents"
          - "orchestrator-manifests"
          - "response-templates"
          - "checkpoints"
          - "dashboards"
          - "discovery-reports"
          - "feedback"
          - "learning"
          - "metadata"
          - "metrics"
        exclude_extensions:
          - ".yaml"
          - ".yml"
          - ".json"
          - ".db"
          - ".md"  # Keep all markdown (documentation)
    
    action: archive
    reason: "Files older than 30 days and not in protected directories"
    
    safety:
      require_confirmation: true  # Age-based needs confirmation
      create_manifest: true
      allow_rollback: true

# ============================================================================
# ARCHIVE CONFIGURATION
# ============================================================================
# How to handle archived items

archive_settings:
  root_folder: "archive_{timestamp}"
  timestamp_format: "%Y%m%d_%H%M%S"
  location: "."  # Root of CORTEX project
  
  structure:
    preserve_paths: true  # Maintain original directory structure
    create_manifest: true # Create ARCHIVE_REPORT.md
    include_metadata: true # Include file metadata (size, date, etc.)
  
  manifest:
    format: "markdown"
    filename: "ARCHIVE_REPORT.md"
    include_recovery_instructions: true
    include_statistics: true

# ============================================================================
# SAFETY CHECKS
# ============================================================================
# Pre-flight validation before archival

safety_checks:
  # Prevent archival of critical infrastructure
  block_critical_paths:
    - "src/orchestrators"
    - "src/tier0"
    - "src/tier1"
    - "src/tier2"
    - "src/tier3"
    - "src/operations/modules/orchestration/planning_orchestrator.py"
    - "src/operations/modules/orchestration/tdd_implementation_orchestrator.py"
    - "src/operations/modules/orchestration/system_maintenance_orchestrator.py"
    - ".git"
    - ".venv"
    - "node_modules"
  
  # Require confirmation for specific patterns
  require_confirmation_patterns:
    - "*.py"   # Never auto-archive Python files
    - "*.js"   # Never auto-archive JavaScript files
    - "*.ts"   # Never auto-archive TypeScript files
    - "*.cs"   # Never auto-archive C# files
  
  # Validate before archival
  pre_archive_validation:
    check_git_status: true    # Ensure no uncommitted changes
    verify_tests_pass: false  # Don't require tests (may be expensive)
    create_checkpoint: true   # Create git checkpoint before archival
  
  # Post-archival validation
  post_archive_validation:
    verify_structure: true    # Verify directory structure intact
    check_imports: false      # Don't check imports (may be expensive)
    run_healthcheck: true     # Run quick healthcheck

# ============================================================================
# EXECUTION POLICIES
# ============================================================================
# Control how aggressive cleanup is executed

execution:
  # Dry run by default
  default_mode: "dry_run"
  
  # Confirmation requirements
  require_user_confirmation:
    - "age_based"  # Age-based archival needs confirmation
  
  # Progress reporting
  progress:
    show_progress_bar: true
    report_interval_seconds: 5
    log_level: "INFO"
  
  # Error handling
  error_handling:
    stop_on_error: false
    max_errors: 10
    rollback_on_critical_error: true
  
  # Performance
  performance:
    parallel_processing: false  # Sequential for safety
    batch_size: 100
    timeout_seconds: 300

# ============================================================================
# INTEGRATION WITH ORCHESTRATION
# ============================================================================
# Ensure no conflicts with core CORTEX operations

orchestration_integration:
  # Respect active operations
  check_before_cleanup:
    - planning_in_progress: "Skip cleanup if planning session active"
    - tdd_in_progress: "Skip cleanup if TDD workflow active"
    - maintenance_in_progress: "Skip cleanup if system maintenance running"
  
  # Notify orchestrators
  notify_on_completion:
    - system_maintenance_orchestrator
    - planning_orchestrator
  
  # Preserve operation artifacts
  preserve_active_artifacts:
    - "cortex-brain/checkpoints/*.json"  # Active checkpoints
    - "cortex-brain/documents/planning/*.md"  # Planning documents
    - "cortex-brain/metrics/*.json"  # Current metrics
    - "cortex-brain/dashboards/*.html"  # Active dashboards

# ============================================================================
# REPORTING
# ============================================================================
# What to include in cleanup reports

reporting:
  generate_report: true
  report_format: "markdown"
  report_location: "cortex-brain/documents/reports"
  
  include_sections:
    - summary_statistics
    - archived_items_list
    - protected_items_list
    - safety_checks_performed
    - errors_and_warnings
    - recovery_instructions
    - next_steps
  
  metrics_to_track:
    - files_archived
    - directories_archived
    - space_freed_mb
    - items_protected
    - errors_encountered
    - duration_seconds

# ============================================================================
# NOTES
# ============================================================================
# Important information for maintainers

notes:
  purpose: "Maintain CORTEX 3.0/4.0 focus by archiving legacy and temporary artifacts"
  
  when_to_use:
    - "Repository feels cluttered with too many directories"
    - "Need to focus only on active CORTEX 3.0/4.0 development"
    - "Preparing for deployment or release"
  
  when_not_to_use:
    - "During active planning or TDD sessions"
    - "When historical context is needed for investigation"
    - "Before thorough testing of CORTEX functionality"
  
  safety_guarantees:
    - "Never archives protected_directories or protected_files"
    - "Never archives source code (*.py, *.js, *.ts, *.cs)"
    - "Always creates manifest with recovery instructions"
    - "Always creates git checkpoint before archival"
    - "Dry run mode by default"
  
  recovery:
    - "All archived items in timestamped archive_* folder"
    - "ARCHIVE_REPORT.md contains full inventory and recovery commands"
    - "Git checkpoint allows full rollback if needed"
