# ==============================================================================
# PRODUCTION MODE CONTROL (USER REQUIREMENT)
# ==============================================================================
production_mode:
  user_requirement: |
    "The audit logger should have the ability to switch off or have controlled 
    logging when released to production. The detailed logging is only for 
    developing CORTEX efficiently."
  
  architecture_principle: |
    Production mode controls LOG VERBOSITY (what gets written to disk),
    NOT audit capture. AuditContext ALWAYS captures metadata (operation,
    AC-ID, correlation_id, timestamp) for every operation regardless of mode.
    This ensures compliance and observability while controlling disk I/O.
  
  modes:
    development:
      description: "Full detailed logging for CORTEX development"
      log_levels: [TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL]
      audit_capture: "ALWAYS (all metadata + detailed logs)"
      use_case: "Internal CORTEX 6.0/7.0 development"
      performance_overhead: "~1-5ms per operation"
      disk_usage: "~10MB per 1000 operations"
      
    production:
      description: "Minimal logging for production deployments"
      log_levels: [WARNING, ERROR, CRITICAL]
      audit_capture: "ALWAYS (metadata only, detailed logs filtered)"
      use_case: "Released CORTEX instances, end-users"
      performance_overhead: "~0.1-0.5ms per operation"
      disk_usage: "~1MB per 1000 operations"
      
    hybrid:
      description: "Selective detailed logging"
      log_levels: [INFO, WARNING, ERROR, CRITICAL]
      audit_capture: "ALWAYS (metadata + INFO+ logs)"
      use_case: "User-facing operations with debugging capability"
      performance_overhead: "~0.5-2ms per operation"
      disk_usage: "~3MB per 1000 operations"
  
  configuration:
    env_variable: "CORTEX_AUDIT_MODE=development|production|hybrid"
    config_file: "cortex-brain/config/audit-config.yaml"
    runtime_override: "AuditContext(mode='production')"
    default: "development (CORTEX development), production (user deployments)"
  
  guarantees:
    - "Audit-First pattern remains enforced (AuditContext still required)"
    - "Critical events ALWAYS logged (errors, violations, security)"
    - "Evidence bundles captured in all modes (compliance requirement)"
    - "Users can override to development mode for troubleshooting"
    - "Hash chain integrity maintained in all modes"

