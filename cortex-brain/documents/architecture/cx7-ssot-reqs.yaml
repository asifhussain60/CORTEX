# MULTI-MACHINE DEVELOPMENT (v1.8.0+)
# ==============================================================================
multi_machine_protocol:
  enabled: true
  version: "1.8.0"
  platform_compatibility: "90% cross-platform (9/11 phases)"
  
  protection_mechanisms:
    core_005_enforcement:
      rule: "Path Portability"
      enforcement: "Use pathlib.Path for ALL file operations"
      blocked_patterns: ["/Users/", "C:\\"]
      pre_commit_hook: "scripts/pre-commit (blocks platform-specific patterns)"
  
  ci_cd_matrix:
    platforms: ["ubuntu-latest", "windows-latest", "macos-latest"]
    python_versions: ["3.10", "3.11", "3.12"]
    test_strategy: "Run full test suite on all platform+python combinations"
    merge_gate: "ALL matrix builds must pass before merge"
  
  platform_testing:
    cross_platform_marker: "@pytest.mark.cross_platform (must pass on all platforms)"
    mac_specific_marker: "@pytest.mark.mac (skipped on WIN/Linux)"
    win_specific_marker: "@pytest.mark.win (skipped on MAC/Linux)"
    coverage_requirement: "≥80% on each platform independently"
  
  merge_validation:
    required_checks:
      - "Tests pass on ubuntu-latest (Python 3.10, 3.11, 3.12)"
      - "Tests pass on windows-latest (Python 3.10, 3.11, 3.12)"
      - "Tests pass on macos-latest (Python 3.10, 3.11, 3.12)"
      - "Pre-commit hooks pass (no hardcoded paths)"
      - "Evidence bundles include platform metadata"
    auto_merge: "Disabled (requires manual review for architecture changes)"
  
  evidence_metadata:
    required_fields:
      platform: "Darwin | Windows | Linux"
      python_version: "3.10.x | 3.11.x | 3.12.x"
      timestamp: "ISO 8601 UTC"
      commit_sha: "Full 40-char SHA"
      test_environment: "local | ci | production"

