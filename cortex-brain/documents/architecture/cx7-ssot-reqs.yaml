# ==============================================================================
# CORTEX 7.0 NEW REQUIREMENTS (AUDIT-DRIVEN RAG)
# ==============================================================================
cortex7_new_features:
  
  audit_first_architecture:
    description: "Operations impossible without audit context"
    implementation: "@audit_driven decorator + AuditContext"
    benefits:
      - "Zero manual logging required"
      - "Automatic evidence collection"
      - "Guarantees traceability by construction"
    new_skull_rules:
      CORE-027:
        name: "Audit-First Enforcement"
        severity: blocked
        description: "All operations MUST use @audit_driven decorator"
        enforcement: "Runtime check blocks operations without AuditContext"
        replaces: "CORE-032 (renumbered for sequence correctness)"
      CORE-028:
        name: "Evidence Verification"
        severity: blocked
        description: "AC-ID marked 'implemented' MUST have audit evidence"
        enforcement: "Query audit.db for evidence before status update"
        replaces: "CORE-033 (renumbered for sequence correctness)"
  
  tiered_memory_architecture:
    boundary_definition: "Exclusive ranges with midnight aging transitions"
    aging_process: |
      Automatic daily job at 00:00 UTC moves data between tiers.
      During 00:00-00:05, data exists in both old and new tier (query checks newest first).
    
    hot_zone:
      technology: "Redis + SQLite"
      retention: "0-6 days (exclusive)"
      age_boundary: "Created/updated within last 6*24 hours"
      latency_target: "<5ms"
      size_limit: "100MB RAM, 1GB disk"
    
    warm_zone:
      technology: "SQLite only"
      retention: "7-29 days (exclusive)"
      age_boundary: "Created/updated 7-29 days ago"
      latency_target: "<50ms"
      size_limit: "10GB disk"
    
    cold_zone:
      technology: "JSONL.gz with index"
      retention: "30+ days (unlimited)"
      age_boundary: "Created/updated ≥30 days ago"
      latency_target: "<500ms"
      size_limit: "Unlimited (archival)"
  
  challenger_pipeline:
    stages:
      stage_1: "AST Analyzer (duplicate detection, SKULL checks)"
      stage_2: "Knowledge Graph Reasoner (AC-ID relationships)"
      stage_3: "Historical Pattern Matcher (git history + audit logs)"
      stage_4: "RAG Semantic Search (FAISS vector search)"
      stage_5: "Merger & Ranker (confidence-weighted top 3)"
    performance:
      hot_path_latency: "<5s (cached embeddings, warm graph)"  # Realistic for cached state
      cold_start_latency: "<30s (first query, embedding generation)"  # Realistic for cold start
      progressive_results: "Stage 1-2 return in <2s, Stages 3-5 stream in"
      parallel_execution: true
      caching:
        embeddings: "Cache for 24 hours (invalidate on document change)"
        graph_queries: "Cache for 1 hour (invalidate on AC-INDEX change)"
        git_history: "Cache for 7 days (expensive operation)"
  
  knowledge_graph:
    technology: "NetworkX (Python library)"
    current_scale: "~500 nodes (110 AC-IDs + 200 tools + 50 patterns + 20 orchestrators)"
    scaling_notes: |
      NetworkX handles <100k nodes efficiently in-memory.
      Current scale is 200x below threshold. Neo4j migration is NOT in scope for CORTEX 7.0.
      Re-evaluate in CORTEX 8.0 if node count exceeds 10k (20x current scale).
    graph_structure:
      nodes: ["AC-IDs (110+)", "Tools (200+)", "Patterns (50+)", "Orchestrators (20+)"]
      edges: ["implements", "depends_on", "uses", "applies_to"]
    persistence: "cortex-brain/database/knowledge-graph.gpickle"
    monitoring:
      node_count_alert: "10000 nodes (trigger architecture review)"
      query_latency_alert: ">100ms for graph traversal (investigate optimization)"
  
  vector_store:
    technology: "FAISS (Facebook AI Similarity Search)"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    dimension: 384
    index_type: "IVF_FLAT (inverted file index)"
    persistence: "cortex-brain/database/vector-index.faiss"

