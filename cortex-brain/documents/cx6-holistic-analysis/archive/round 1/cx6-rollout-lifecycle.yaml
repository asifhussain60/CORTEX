schema_version: "2.0"
last_updated: "2026-01-10T23:45:00Z"

# ==============================================================================
# PROBLEM STATEMENT
# ==============================================================================
problem_statement:
  current_risk:
    "New orchestrator becomes immediately available after DoD validation.
     A single bug or regression affects ALL users instantly.
     Rollback requires manual intervention and code changes."
  
  production_incidents:
    - scenario: "New routing pattern overlaps existing pattern"
      impact: "50% of 'implement' requests route to wrong orchestrator"
      detection_time: "4 hours (user reports)"
      rollback_time: "30 minutes (emergency merge)"
    
    - scenario: "Orchestrator generates invalid RequiredActions"
      impact: "100% failure rate for specific intent"
      detection_time: "Immediate (high error rate)"
      rollback_time: "15 minutes (revert commit)"
    
    - scenario: "Performance regression (2x latency)"
      impact: "User experience degraded"
      detection_time: "2 hours (monitoring alert)"
      rollback_time: "20 minutes (feature flag disable)"
  
  goal:
    "Safe, gradual rollout with automated rollback on anomalies.
     Zero-downtime activation. Minimal blast radius for failures."

# ==============================================================================
# ACTIVATION STATE MACHINE (AC-ROLLOUT-001)
# ==============================================================================
activation_states:
  
  purpose: "Define orchestrator lifecycle from creation to deprecation"
  
  # ----------------------------------------------------------------------------
  # State Definitions
  # ----------------------------------------------------------------------------
  states:
    
    REGISTERED:
      description: "Orchestrator exists in manifest but not routable"
      
      entry_conditions:
        - "Orchestrator completes DoD validation"
        - "AC-IDs validated and marked COMPLETE"
        - "Unit tests pass (100% coverage)"
        - "Integration tests pass"
      
      routing_behavior:
        production: "NOT ROUTABLE (not in routing table)"
        test: "Available via explicit orchestrator_id parameter"
      
      testing:
        unit_tests: "Run continuously"
        integration_tests: "Run on-demand"
        manual_testing: "Recommended"
      
      duration: "Until manual promotion to SHADOW"
      
      operations:
        - "Review test coverage"
        - "Manual smoke testing"
        - "Security review"
        - "Documentation review"
      
      exit_conditions:
        - "Manual approval from maintainer"
        - "Security review passed"
        - "Promote to SHADOW"
    
    SHADOW:
      description: "Orchestrator invoked alongside production, output compared but discarded"
      
      entry_conditions:
        - "Promoted from REGISTERED"
        - "Manual approval"
      
      routing_behavior:
        production: "Production orchestrator handles request"
        shadow: "Shadow orchestrator invoked in parallel (DRY_RUN mode)"
        response: "Production response returned to user"
        comparison: "Log diff between production and shadow outputs"
      
      execution_mode:
        rule: "Shadow MUST execute in DRY_RUN mode to prevent side effects"
        enforcement: "StagedRolloutManager sets ActionPolicyEngine mode=DRY_RUN"
        
        rationale: |
          Without DRY_RUN, shadow execution could:
          - Write duplicate files
          - Execute duplicate commands
          - Send duplicate API requests
          - Corrupt state by parallel mutations
        
        dry_run_binding:
          component: "ActionPolicyEngine"
          mode: "ExecutionMode.DRY_RUN"
          behavior:
            READ: "Execute (read-only, safe)"
            WRITE: "SIMULATE (log intent, don't write)"
            DELETE: "SIMULATE (log intent, don't delete)"
            EXECUTE: "SIMULATE (log command, don't execute)"
            NETWORK: "SIMULATE (log request, don't send)"
          
          audit_marker: "All shadow executions tagged with execution_mode=DRY_RUN"
          
          implementation: |
            class StagedRolloutManager:
                def invoke_shadow(self, orchestrator: Orchestrator, request: str):
                    # Create DRY_RUN policy engine
                    policy_engine = ActionPolicyEngine(mode=ExecutionMode.DRY_RUN)
                    
                    # Inject into orchestrator context
                    with orchestrator_context(policy_engine=policy_engine):
                        shadow_result = orchestrator.execute(request)
                    
                    # Shadow result is discarded (logged only)
                    self.log_shadow_result(shadow_result)
      
      routing_behavior:
        production: "Production orchestrator handles request"
        shadow: "Shadow orchestrator invoked in parallel"
        response: "Production response returned to user"
        comparison: "Log diff between production and shadow outputs"
      
      testing:
        comparison_logging: "All output diffs logged at INFO level"
        error_tracking: "Shadow errors logged at WARNING level"
        latency_monitoring: "Shadow latency measured (no impact on user)"
      
      duration: "24 hours minimum"
      
      success_criteria:
        - "Shadow error rate <5%"
        - "Output diffs acceptable (manual review)"
        - "No critical errors"
        - "Latency within 2x production baseline"
      
      operations:
        - "Review shadow comparison logs"
        - "Investigate output diffs"
        - "Fix bugs discovered in shadow mode"
        - "Re-deploy if fixes needed (restart 24h timer)"
      
      exit_conditions:
        success: "Success criteria met for 24h → Promote to CANARY"
        failure: "Critical errors or unacceptable diffs → Demote to REGISTERED"
    
    CANARY:
      description: "Orchestrator serves small percentage of production traffic"
      
      entry_conditions:
        - "Promoted from SHADOW"
        - "Shadow comparison reviewed and accepted"
      
      routing_behavior:
        canary_percentage: "5% of matching traffic"
        production_percentage: "95% of matching traffic"
        selection: "Random sampling (stable per session)"
      
      testing:
        error_rate_monitoring: "Continuously compare canary vs production error rates"
        latency_monitoring: "p50, p95, p99 latency tracking"
        success_rate_monitoring: "Operation success/failure rates"
      
      duration: "48 hours minimum"
      
      success_criteria:
        - "Error rate within 5% of production baseline"
        - "p95 latency within 2x production baseline"
        - "Success rate ≥95%"
        - "No CRITICAL audit log entries"
      
      automated_rollback_triggers:
        - condition: "Error rate >5% above production baseline"
          action: "Demote to SHADOW"
          notification: "Audit log CRITICAL + alert"
        
        - condition: "p95 latency >2x production baseline"
          action: "Demote to SHADOW"
          notification: "Audit log WARNING + alert"
        
        - condition: "Success rate <95%"
          action: "Demote to SHADOW"
          notification: "Audit log CRITICAL + alert"
        
        - condition: "3+ CRITICAL audit log entries in 1 hour"
          action: "Demote to SHADOW"
          notification: "Audit log CRITICAL + alert"
      
      operations:
        - "Monitor metrics dashboard"
        - "Review canary-specific audit logs"
        - "Compare canary vs production behavior"
        - "Investigate anomalies"
      
      exit_conditions:
        success: "Success criteria met for 48h → Promote to ACTIVE"
        failure: "Rollback trigger hit → Demote to SHADOW"
    
    ACTIVE:
      description: "Orchestrator serves 100% of production traffic"
      
      entry_conditions:
        - "Promoted from CANARY"
        - "Canary success criteria met"
      
      routing_behavior:
        production: "100% of matching traffic"
        fallback: "Previous orchestrator kept as backup (7 days)"
      
      testing:
        continuous_monitoring: "Error rate, latency, success rate"
        alerting: "Anomaly detection on key metrics"
      
      operations:
        - "Monitor for regressions"
        - "Review audit logs weekly"
        - "Update documentation"
      
      exit_conditions:
        deprecation: "New version promoted → Move to DEPRECATED"
        failure: "Severe regression → Emergency rollback to SHADOW"
    
    DEPRECATED:
      description: "Orchestrator being phased out, serves as fallback only"
      
      entry_conditions:
        - "New version promoted to ACTIVE"
      
      routing_behavior:
        production: "0% of normal traffic"
        fallback: "Invoked only if ACTIVE orchestrator fails"
      
      duration: "7 days retention"
      
      operations:
        - "Monitor fallback invocations (should be zero)"
        - "Prepare for archival"
      
      exit_conditions:
        - "7 days elapsed with zero fallback invocations → Move to ARCHIVED"
    
    ARCHIVED:
      description: "Orchestrator removed from routing, retained for audit"
      
      entry_conditions:
        - "Promoted from DEPRECATED after retention period"
      
      routing_behavior:
        production: "NOT ROUTABLE"
        fallback: "NOT AVAILABLE"
      
      storage:
        code: "Tagged git branch (e.g., archive/orchestrator-v1.0)"
        manifest: "Removed from routing-manifest.yaml"
        audit_trail: "Retained in governance.db indefinitely"
      
      operations:
        - "Archive to git branch"
        - "Remove from manifest"
        - "Update documentation"

  # ----------------------------------------------------------------------------
  # State Transition Diagram
  # ----------------------------------------------------------------------------
  state_transitions: |
    
    [REGISTERED] ----manual promotion----> [SHADOW]
         ^                                    |
         |                                    | 24h success
         |                                    v
         |                                 [CANARY]
         |                                    |
         |                                    | 48h success
         |                                    v
         +----automated rollback-------- [ACTIVE]
                                             |
                                             | new version
                                             v
                                         [DEPRECATED] ----7d retention----> [ARCHIVED]
    
    Rollback paths:
    - SHADOW failure → REGISTERED
    - CANARY rollback trigger → SHADOW
    - ACTIVE severe regression → SHADOW (emergency)

# ==============================================================================
# AUTOMATED ROLLBACK SYSTEM (AC-ROLLOUT-002)
# ==============================================================================
automated_rollback:
  
  purpose: "Detect anomalies and demote orchestrator without human intervention"
  
  # ----------------------------------------------------------------------------
  # AC-ROLLOUT-003: Automated Rollback Triggers (UNIFIED POLICY)
  # ----------------------------------------------------------------------------
  rollback_triggers:
    
    purpose: "Detect regressions and automatically rollback without manual intervention"
    
    # --------------------------------------------------------------------------
    # AC-ROLLOUT-004: Statistical Guards
    # --------------------------------------------------------------------------
    statistical_guards:
      
      minimum_sample_size:
        rule: "Rollback triggers DO NOT arm until canary accumulates 100 requests"
        rationale: "Prevent false positives from insufficient data"
        
        implementation: |
          class RollbackTriggerManager:
              def __init__(self):
                  self.min_samples_for_arming = 100
                  self.canary_request_count = 0
              
              def check_triggers(self, metrics: Metrics):
                  if self.canary_request_count < self.min_samples_for_arming:
                      logger.info(f"Triggers not armed: {self.canary_request_count}/100 samples")
                      return  # Skip trigger evaluation
                  
                  # Triggers armed, evaluate normally
                  self.evaluate_all_triggers(metrics)
      
      cold_start_baseline:
        scenario: "New orchestrator has no 7-day baseline yet"
        solution: "Use synthetic baseline from similar orchestrators"
        
        fallback_strategy: |
          def get_baseline_error_rate(orchestrator_id: str) -> float:
              # Try 7-day historical baseline
              baseline = query_baseline(orchestrator_id, days=7)
              if baseline is not None:
                  return baseline
              
              # Cold start: use category average
              category = get_orchestrator_category(orchestrator_id)
              category_baseline = query_category_baseline(category, days=7)
              if category_baseline is not None:
                  logger.info(f"Using category baseline for {orchestrator_id}: {category_baseline}")
                  return category_baseline
              
              # Ultimate fallback: conservative global baseline
              global_baseline = 0.05  # 5% error rate assumed safe
              logger.warning(f"Using global fallback baseline for {orchestrator_id}: {global_baseline}")
              return global_baseline
      
      low_traffic_handling:
        scenario: "Canary receives <20 requests/hour due to low overall traffic"
        problem: "5% canary of 150 req/hour = 7.5 req/hour (insufficient samples)"
        
        solution: "Extend evaluation window to accumulate sufficient samples"
        
        adaptive_window: |
          def calculate_evaluation_window(canary_request_rate: float) -> timedelta:
              # Target: At least 20 requests for statistical significance
              target_samples = 20
              
              if canary_request_rate < 20:
                  # Extend window to get target samples
                  hours_needed = target_samples / max(canary_request_rate, 1)
                  window = timedelta(hours=min(hours_needed, 24))  # Cap at 24h
                  logger.info(f"Low traffic ({canary_request_rate} req/h): using {window} window")
                  return window
              else:
                  # Standard 5-minute window
                  return timedelta(minutes=5)
        
        disable_on_zero_traffic:
          rule: "If canary receives 0 requests in 6 hours, log warning but don't rollback"
          rationale: "Zero traffic indicates routing issue, not orchestrator failure"
    
    # --------------------------------------------------------------------------
    # Unified Trigger Evaluation Policy
    # --------------------------------------------------------------------------
    evaluation_policy:
      
      window_size: "5 minutes (default, adaptive for low traffic)"
      breach_count_threshold: 3
      consecutive_requirement: true
      
      unified_algorithm: |
        Rollback triggers arm after 100 canary requests accumulated.
        
        Every 5 minutes (or adaptive window if low traffic):
        1. Evaluate all trigger conditions
        2. If ANY trigger breached: increment breach_counter
        3. If breach_counter reaches 3 consecutive windows: ROLLBACK
        4. If no breach in window: reset breach_counter to 0
        
        This resolves the "2-window vs 3-breach" ambiguity by unifying into
        a single policy: 3 consecutive breaches of ANY trigger causes rollback.
      
      implementation: |
        class RollbackTriggerManager:
            def __init__(self):
                self.breach_counter = 0
                self.breach_threshold = 3
                self.evaluation_interval = timedelta(minutes=5)
            
            def evaluate_triggers(self, metrics: Metrics) -> bool:
                # Check if ANY trigger is breached
                breached = (
                    self.check_error_rate(metrics) or
                    self.check_latency(metrics) or
                    self.check_success_rate(metrics) or
                    self.check_null_responses(metrics)
                )
                
                if breached:
                    self.breach_counter += 1
                    logger.warning(f"Trigger breached: {self.breach_counter}/{self.breach_threshold}")
                    
                    if self.breach_counter >= self.breach_threshold:
                        logger.critical("3 consecutive breaches detected: ROLLING BACK")
                        return True  # Trigger rollback
                else:
                    # Reset counter on success
                    if self.breach_counter > 0:
                        logger.info(f"Breach counter reset (was {self.breach_counter})")
                    self.breach_counter = 0
                
                return False  # No rollback
    
    # --------------------------------------------------------------------------
    # Individual Trigger Conditions
    # --------------------------------------------------------------------------
    error_rate_spike:
      metric: "Error rate (exceptions per request)"
      baseline: "7-day rolling average (or synthetic for cold start)"
      threshold: ">5% increase vs baseline"
      window: "5-minute sliding window (adaptive)"
      
      calculation: |
        baseline_error_rate = get_baseline_error_rate(orchestrator_id)
        current_error_rate = errors_in_window / requests_in_window
        
        if current_error_rate > (baseline_error_rate * 1.05):
            return True  # Breach detected
      
      action: "Increment breach counter"
      notification: "CRITICAL audit log"
    
    latency_regression:
      metric: "p95 response time"
      baseline: "7-day p95 latency (or synthetic for cold start)"
      threshold: ">2x baseline"
      window: "5-minute sliding window (adaptive)"
      
      calculation: |
        baseline_p95 = get_baseline_p95_latency(orchestrator_id)
        current_p95 = calculate_p95(latencies_in_window)
        
        if current_p95 > (baseline_p95 * 2):
            return True  # Breach detected
      
      action: "Increment breach counter"
      notification: "WARNING audit log"
    
    success_rate_drop:
      metric: "Operation success rate"
      baseline: "Expected ≥95%"
      threshold: "<95%"
      window: "5-minute sliding window (adaptive)"
      
      calculation: |
        success_rate = successful_operations / total_operations
        
        if success_rate < 0.95:
            return True  # Breach detected
      
      action: "Increment breach counter"
      notification: "CRITICAL audit log"
    
    critical_audit_entries:
      metric: "Count of CRITICAL level audit logs"
      threshold: "≥3 in 1 hour"
      window: "1-hour sliding window"
      
      calculation: |
        critical_count = count(audit_logs WHERE level='CRITICAL' AND timestamp > now() - 1h)
        
        if critical_count >= 3:
            return True  # Breach detected
      
      action: "Increment breach counter (override: immediate rollback)"
      notification: "CRITICAL audit log + alert"
    
    null_response_rate:
      metric: "Percentage of null/empty responses"
      threshold: ">1%"
      window: "5-minute sliding window (adaptive)"
      
      calculation: |
        null_rate = null_responses / total_responses
        
        if null_rate > 0.01:
            return True  # Breach detected
      
      action: "Demote CANARY → SHADOW"
      notification: "CRITICAL audit log + alert"
  
  # ----------------------------------------------------------------------------
  # Rollback Execution
  # ----------------------------------------------------------------------------
  rollback_execution:
    
    orchestration: "StagedRolloutManager"
    
    steps:
      - step: 1
        action: "Detect trigger condition"
        component: "MetricsCollector"
      
      - step: 2
        action: "Validate trigger (avoid false positive)"
        component: "RollbackTriggerValidator"
        validation:
          - "Confirm metric exceeds threshold for 2 consecutive windows"
          - "Verify baseline calculation correct"
      
      - step: 3
        action: "Create rollback incident"
        component: "StateManager"
        output: "Incident entry in progress-tracker.json"
      
      - step: 4
        action: "Update orchestrator state"
        component: "StagedRolloutManager"
        change: "CANARY → SHADOW or ACTIVE → SHADOW"
      
      - step: 5
        action: "Update routing manifest"
        component: "RoutingEngine"
        change: "Set rollout_state = SHADOW in routing-manifest.yaml"
      
      - step: 6
        action: "Reload routing table"
        component: "DeterministicRoutingEngine"
        behavior: "Stop routing to demoted orchestrator"
      
      - step: 7
        action: "Route traffic to fallback"
        component: "RoutingEngine"
        fallback: "Previous ACTIVE orchestrator"
      
      - step: 8
        action: "Log rollback to audit trail"
        component: "EnterpriseAuditLogger"
        level: "CRITICAL"
        category: "ROLLOUT"
      
      - step: 9
        action: "Send alert notification"
        component: "AlertManager"
        channels: ["Audit log", "Email (future)", "Slack (future)"]
      
      - step: 10
        action: "Generate rollback report"
        component: "StagedRolloutManager"
        output: "cortex-brain/documents/rollout/rollback-{timestamp}.yaml"
    
    duration: "<30 seconds from detection to routing change"
    
    human_approval_required: false
    
    manual_override:
      command: "python -m src.main 'rollback orchestrator {id} to {state}'"
      use_case: "Emergency rollback for ACTIVE → SHADOW"

  # ----------------------------------------------------------------------------
  # Metrics Collection
  # ----------------------------------------------------------------------------
  metrics_collection:
    
    component: "MetricsCollector"
    file: "src/orchestration/metrics_collector.py"
    status: "DESIGNED"
    
    metrics:
      - name: "request_count"
        type: "counter"
        labels: ["orchestrator_id", "state"]
      
      - name: "error_count"
        type: "counter"
        labels: ["orchestrator_id", "state", "error_type"]
      
      - name: "response_time_ms"
        type: "histogram"
        labels: ["orchestrator_id", "state"]
        buckets: [10, 50, 100, 500, 1000, 5000, 10000]
      
      - name: "success_count"
        type: "counter"
        labels: ["orchestrator_id", "state"]
      
      - name: "null_response_count"
        type: "counter"
        labels: ["orchestrator_id", "state"]
    
    storage:
      backend: "SQLite (short-term), Prometheus (future)"
      retention: "7 days for rollback calculations"
      aggregation: "5-minute windows for anomaly detection"
    
    integration:
      master_orchestrator: "Emit metrics before/after orchestrator invocation"
      audit_logger: "CRITICAL logs increment error_count"

# ==============================================================================
# CANARY ROUTING (AC-ROLLOUT-003)
# ==============================================================================
canary_routing:
  
  purpose: "Route configurable percentage of traffic to canary orchestrator"
  
  # ----------------------------------------------------------------------------
  # Routing Algorithm
  # ----------------------------------------------------------------------------
  routing_algorithm:
    
    canary_percentage: 5  # 5% in CANARY state
    
    implementation: |
      def route_with_canary(intent: str, routing_entry: RoutingEntry) -> Orchestrator:
          if routing_entry.rollout_state == "CANARY":
              # Stable sampling based on session ID (avoids flip-flopping)
              session_id = get_session_id()  # Persistent per user session
              hash_value = hashlib.sha256(session_id.encode()).hexdigest()
              sample = int(hash_value[:8], 16) % 100
              
              if sample < routing_entry.canary_percentage:
                  return routing_entry.canary_orchestrator
              else:
                  return routing_entry.production_orchestrator
          
          elif routing_entry.rollout_state == "ACTIVE":
              return routing_entry.orchestrator
          
          elif routing_entry.rollout_state == "SHADOW":
              # Invoke both, return production, log comparison
              production_result = invoke(routing_entry.production_orchestrator, intent)
              shadow_result = invoke(routing_entry.shadow_orchestrator, intent)
              
              log_comparison(production_result, shadow_result)
              
              return production_result
          
          else:
              return routing_entry.orchestrator
    
    session_management:
      session_id_source: "correlation_id (passed via --correlation-id)"
      stability: "Same user session ALWAYS routes to same variant (canary or production)"
      rationale: "Avoid user confusion from flip-flopping behavior"
  
  # ----------------------------------------------------------------------------
  # Configuration
  # ----------------------------------------------------------------------------
  configuration:
    
    manifest_field: "canary_percentage"
    
    example: |
      orchestrators:
        - id: "tdd-master-v2"
          rollout_state: "CANARY"
          canary_percentage: 5  # 5% of traffic
          fallback_orchestrator_id: "tdd-master-v1"
    
    adjustment:
      gradual_rampup: false  # Fixed 5% for duration of CANARY state
      manual_override: "Update manifest, reload routing table"
  
  # ----------------------------------------------------------------------------
  # Comparison Logging (SHADOW Mode)
  # ----------------------------------------------------------------------------
  comparison_logging:
    
    purpose: "Log differences between production and shadow outputs"
    
    logged_fields:
      - "request"
      - "production_response"
      - "shadow_response"
      - "diff" (computed via difflib)
      - "production_latency_ms"
      - "shadow_latency_ms"
      - "production_errors"
      - "shadow_errors"
    
    log_level: "INFO (if outputs match), WARNING (if outputs differ)"
    
    storage: "cortex-brain/audit-logs/{date}_shadow_comparison.jsonl"
    
    review_process:
      - "Daily review of shadow comparison logs"
      - "Acceptable diffs: formatting, timestamps, UUIDs"
      - "Unacceptable diffs: missing data, incorrect logic, errors"

# ==============================================================================
# STAGED ROLLOUT MANAGER IMPLEMENTATION
# ==============================================================================
staged_rollout_manager:
  
  file: "src/orchestrators/core/rollout_manager.py"
  status: "DESIGNED (AC-ROLLOUT-001 to AC-ROLLOUT-003)"
  
  class_structure: |
    class StagedRolloutManager:
        def __init__(self):
            self.state_machine = ActivationStateMachine()
            self.metrics_collector = MetricsCollector()
            self.rollback_engine = RollbackEngine()
        
        def promote_orchestrator(self, orchestrator_id: str, to_state: str):
            """Promote orchestrator to next state"""
            current_state = self.get_current_state(orchestrator_id)
            
            # Validate transition
            if not self.state_machine.is_valid_transition(current_state, to_state):
                raise InvalidStateTransition(f"Cannot transition {current_state} → {to_state}")
            
            # Update state in manifest
            self.update_manifest(orchestrator_id, rollout_state=to_state)
            
            # Reload routing table
            routing_engine.reload()
            
            # Log promotion
            audit_logger.log(
                f"Promoted {orchestrator_id} from {current_state} to {to_state}",
                level="INFO",
                category="ROLLOUT"
            )
        
        def check_rollback_triggers(self):
            """Continuously monitor for rollback conditions"""
            for orchestrator_id, entry in self.get_canary_orchestrators():
                metrics = self.metrics_collector.get_metrics(orchestrator_id)
                
                for trigger in ROLLBACK_TRIGGERS:
                    if trigger.should_trigger(metrics):
                        self.execute_rollback(orchestrator_id, trigger.reason)
        
        def execute_rollback(self, orchestrator_id: str, reason: str):
            """Demote orchestrator and route to fallback"""
            # Create incident
            incident_id = self.create_incident(orchestrator_id, reason)
            
            # Demote state
            self.promote_orchestrator(orchestrator_id, to_state="SHADOW")
            
            # Log rollback
            audit_logger.log(
                f"Rolled back {orchestrator_id} to SHADOW. Reason: {reason}",
                level="CRITICAL",
                category="ROLLOUT",
                correlation_id=incident_id
            )
            
            # Generate report
            self.generate_rollback_report(orchestrator_id, reason, incident_id)
  
  integration_with_routing_engine: |
    class DeterministicRoutingEngine:
        def route(self, intent: str) -> RoutingResult:
            entry = self.find_matching_entry(intent)
            
            # Check rollout state
            if entry.rollout_state == "CANARY":
                return self.rollout_manager.route_with_canary(intent, entry)
            
            elif entry.rollout_state == "SHADOW":
                return self.rollout_manager.route_with_shadow(intent, entry)
            
            else:
                return RoutingResult(orchestrator=entry.orchestrator)

# ==============================================================================
# OPERATIONAL PROCEDURES
# ==============================================================================
operational_procedures:
  
  new_orchestrator_release:
    steps:
      - step: "Orchestrator completes DoD validation"
        duration: "Varies"
      
      - step: "Add to manifest with state=REGISTERED"
        duration: "5 minutes"
      
      - step: "Manual smoke testing"
        duration: "30 minutes"
      
      - step: "Security review"
        duration: "1 hour"
      
      - step: "Promote to SHADOW"
        command: "python -m src.main 'promote orchestrator {id} to SHADOW'"
        duration: "Immediate"
      
      - step: "Monitor shadow comparison for 24h"
        duration: "24 hours"
      
      - step: "Review shadow logs, promote to CANARY"
        command: "python -m src.main 'promote orchestrator {id} to CANARY'"
        duration: "Immediate"
      
      - step: "Monitor canary metrics for 48h"
        duration: "48 hours"
      
      - step: "Promote to ACTIVE"
        command: "python -m src.main 'promote orchestrator {id} to ACTIVE'"
        duration: "Immediate"
    
    total_duration: "3-4 days from DoD to ACTIVE"
  
  emergency_rollback:
    trigger: "Severe production incident (data loss, security breach)"
    
    steps:
      - step: "Identify affected orchestrator"
        duration: "5 minutes"
      
      - step: "Execute manual rollback"
        command: "python -m src.main 'rollback orchestrator {id} to SHADOW'"
        duration: "Immediate"
      
      - step: "Verify traffic routing to fallback"
        duration: "2 minutes"
      
      - step: "Create incident report"
        duration: "15 minutes"
      
      - step: "Investigate root cause"
        duration: "Varies"
    
    total_duration: "<10 minutes to rollback"

