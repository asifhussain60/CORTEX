  gpt_analysis_integration: true
  design_score_before: 72
  design_score_after: 85  # With security, routing, rollout enhancements
  
# ==============================================================================
# CORE ARCHITECTURE LAYERS
# ==============================================================================

architecture_layers:
  
  # Layer 1: Security & Policy (NEW - GPT Recommendation #1)
  security_layer:
    name: "Action Security & Policy Engine"
    priority: "P0-CRITICAL"
    phase: 1
    components:
      - name: "ActionPolicyEngine"
        description: "Central authorization for all file/command operations"
        location: "src/security/action_policy_engine.py"
        responsibilities:
          - "Intercept file write/delete operations"
          - "Intercept terminal command executions"
          - "Evaluate against allowlist/denylist"
          - "Audit log all denied operations"
        ac_ids: ["AC-SECURITY-001"]
        
      - name: "PathSandbox"
        description: "Restrict file operations to approved paths"
        location: "src/security/path_sandbox.py"
        responsibilities:
          - "Validate all paths against repo root"
          - "Block .git/, secrets/, $HOME access"
          - "Detect path traversal attacks (../)"
          - "Block symlink traversal outside sandbox"
        ac_ids: ["AC-SECURITY-002"]
        
      - name: "CommandAllowlist"
        description: "Whitelist approved commands, block dangerous ops"
        location: "src/security/command_allowlist.py"
        responsibilities:
          - "Maintain allowlist (python, git, pytest, pip)"
          - "Detect shell injection (;, &&, |, $())"
          - "Validate command arguments"
          - "Block destructive commands (rm -rf, dd)"
        ac_ids: ["AC-SECURITY-003"]
        
      - name: "SecretRedactor"
        description: "Automatic secret detection and redaction"
        location: "src/security/secret_redactor.py"
        responsibilities:
          - "Regex patterns for API keys, tokens, passwords"
          - "Redact secrets in audit logs"
          - "Prevent secrets in error messages"
          - "Environment variable protection"
        ac_ids: ["AC-SECURITY-004"]
    
    integration_points:
      - "MasterOrchestrator: All actions pass through ActionPolicyEngine"
      - "TodoManager: Task execution requires security validation"
      - "EnterpriseAuditLogger: Logs all security events"
      - "FileCreator/FileModifier: Path validation before operations"
  
  # Layer 2: Routing & Orchestration (ENHANCED - GPT Recommendation #2, #3)
  routing_layer:
    name: "Deterministic Routing with Staged Rollout"
    priority: "P1-HIGH"
    phase: 2
    components:
      - name: "RoutingEngine"
        description: "Conflict-free pattern matching"
        location: "src/orchestrators/core/routing_engine.py"
        responsibilities:
          - "Load canonical routing table (tier0/routing/routing-table.yaml)"
          - "Detect pattern conflicts at startup"
          - "Explicit matching semantics (exact > prefix > regex)"
          - "Priority-based tie-breaking"
        ac_ids: ["AC-ROUTE-001", "AC-ROUTE-003"]
        
      - name: "RoutingContractTests"
        description: "Corpus of intent → orchestrator mappings"
        location: "tests/integration/routing/test_routing_contracts.py"
        responsibilities:
          - "100+ test cases covering all orchestrators"
          - "Edge cases and ambiguous intents"
          - "Regression tests for routing changes"
          - "Contract validation on routing table updates"
        ac_ids: ["AC-ROUTE-002"]
        
      - name: "ActivationStateMachine"
        description: "Progressive feature rollout"
        location: "src/orchestrators/core/activation_state_machine.py"
        responsibilities:
          - "State management: REGISTERED → SHADOW → CANARY → ACTIVE"
          - "Traffic weight allocation (CANARY: 1-20%)"
          - "Error-rate monitoring with automatic rollback"
          - "State persistence in tier1/tracking/activation-state.json"
        ac_ids: ["AC-ROLLOUT-001", "AC-ROLLOUT-002", "AC-ROLLOUT-003"]
    
    routing_table_schema:
      source_of_truth: "cortex-brain/tier0/routing/routing-table.yaml"
      fields:
        - name: "pattern"
          type: "regex"
          description: "Intent matching pattern"
        - name: "orchestrator"
          type: "string"
          description: "Target orchestrator name"
        - name: "priority"
          type: "integer"
          description: "Conflict resolution priority (higher wins)"
        - name: "activation_state"
          type: "enum"
          values: ["REGISTERED", "SHADOW", "CANARY", "ACTIVE"]
        - name: "traffic_weight"
          type: "float"
          range: [0.0, 1.0]
          description: "Percentage of traffic to route (CANARY mode)"
        - name: "ac_id_prefix"
          type: "string"
          description: "AC-ID category for this orchestrator"
      
      sync_mechanism:
        script: "scripts/sync_routing_table.py"
        triggers:
          - "Manual: python scripts/sync_routing_table.py"
          - "Automatic: pre-commit hook"
        generated_artifacts:
          - ".github/prompts/CORTEX.prompt.md"
          - ".github/copilot-instructions.md"
  
  # Layer 3: Governance & State (EXISTING - Enhanced with Security)
  governance_layer:
    name: "4-Tier Governance with Security Integration"
    priority: "P0-CRITICAL"
    phase: 1
    components:
      - name: "GovernanceMerger"
        description: "Merge SKULL + Business + Engineering + Knowledge rules"
        location: "src/orchestrators/core/governance_merger.py"
        enhancements:
          - "Integrate security policies from ActionPolicyEngine"
          - "Hash-based cache invalidation (not file watching)"
          - "Atomic multi-file tier loads"
        ac_ids: ["AC-GOV-001", "AC-GOV-002", "AC-GOV-003", "AC-GOV-004", "AC-GOV-005"]
        
      - name: "StateManager"
        description: "SQLite-backed state persistence"
        location: "src/orchestrators/core/state_manager.py"
        enhancements:
          - "WAL mode for concurrent writes"
          - "File locking (fcntl/msvcrt) for JSON files"
          - "Transaction isolation for consistency"
        ac_ids: ["AC-STATE-001", "AC-STATE-002", "AC-STATE-003"]
        
      - name: "EnterpriseAuditLogger"
        description: "Buffered async logging with retention"
        location: "src/infrastructure/enhanced_audit_logger.py"
        enhancements:
          - "Security event category (SECURITY)"
          - "Secret redaction integration"
          - "Routing decision logs (ROUTING)"
        ac_ids: ["AC-AUDIT-001", "AC-AUDIT-002", "AC-AUDIT-003", "AC-AUDIT-004", "AC-AUDIT-005", "AC-AUDIT-006"]
  
  # Layer 4: Orchestration Core (EXISTING - MasterOrchestrator IN CHARGE)
  orchestration_layer:
    name: "MasterOrchestrator Central Control"
    priority: "P0-CRITICAL"
    phase: 2
    components:
      - name: "MasterOrchestrator"
        description: "Central controller - ALL requests route through here"
        location: "src/orchestrators/core/master_orchestrator.py"
        responsibilities:
          - "Intent classification via RoutingEngine"
          - "Security validation via ActionPolicyEngine"
          - "Governance evaluation via GovernanceMerger"
          - "Task decomposition via TodoManager"
          - "Orchestrator dispatch with @require_master_routing enforcement"
        ac_ids: ["AC-ORCH-001", "AC-ORCH-002", "AC-ORCH-003", "AC-ORCH-006", "AC-ORCH-007"]
        
      - name: "OrchestratorRegistry"
        description: "Single registry for all orchestrators"
        location: "src/orchestrators/core/master_registration.py"
        responsibilities:
          - "Import-time registration via @register_with_master"
          - "Duplicate detection with WARNING logs"
          - "Pattern → orchestrator mapping"
          - "Strict mode option (fail on duplicate)"
        ac_ids: ["AC-SCAFFOLD-003"]
        
      - name: "TodoManager"
        description: "Task tracking and persistence"
        location: "src/orchestrators/core/todo_manager.py"
        responsibilities:
          - "Task creation from RequiredActions"
          - "Security validation before execution"
          - "Progress persistence to progress-tracker.json"
          - "Interaction points at phase boundaries"
        ac_ids: ["AC-TODO-001", "AC-TODO-002", "AC-TODO-003", "AC-TODO-004"]
  
  # Layer 5: Domain Orchestrators (EXISTING - Team Extensible)
  domain_layer:
    name: "Domain-Specific Orchestrators"
    priority: "P2-MEDIUM"
    phase: 3
    components:
      - "TDD-Master v1"
      - "Planning v5"
      - "ADO v2"
      - "Crawler Orchestrator"
      - "Vacuum v2 (Intelligent)"
      - "Investigation"
      - "Git History Intel"
      - "Onboarding"
    
    extensibility:
      scaffolder: "src/tools/orchestrator_scaffolder.py"
      enforcement:
        - "@register_with_master decorator (automatic registration)"
        - "@require_master_routing decorator (blocks direct execution)"
        - "MasterBypassError raised on bypass attempts"
      team_benefits:
        - "Domain experts create orchestrators for their needs"
        - "CORTEX governance automatically applied"
        - "Company practices (tier1) + learned patterns (tier3) merged"

# ==============================================================================
# SECURITY ARCHITECTURE (NEW)
# ==============================================================================

security_architecture:
  
  trust_boundaries:
    external:
      - "User input (via GitHub Copilot)"
      - "Terminal commands"
      - "File system operations"
      - "External APIs (Azure DevOps, GitHub)"
    
    internal:
      - "MasterOrchestrator → ActionPolicyEngine boundary"
      - "Orchestrators → TodoManager boundary"
      - "TodoManager → File operations boundary"
      - "Audit logger → Log storage boundary"
  
  threat_model:
    T1_prompt_injection:
      threat: "Malicious user input crafts prompt to bypass security"
      mitigation: "ActionPolicyEngine validates ALL operations, not just user intent"
      severity: "HIGH"
      ac_id: "AC-SECURITY-001"
      
    T2_path_traversal:
      threat: "Path manipulation (../../etc/passwd) accesses system files"
      mitigation: "PathSandbox resolves paths, checks against repo root"
      severity: "CRITICAL"
      ac_id: "AC-SECURITY-002"
      
    T3_command_injection:
      threat: "Shell metacharacters (; && |) execute arbitrary commands"
      mitigation: "CommandAllowlist detects injection, blocks dangerous patterns"
      severity: "CRITICAL"
      ac_id: "AC-SECURITY-003"
      
    T4_secret_leakage:
      threat: "API keys, tokens logged in audit trail"
      mitigation: "SecretRedactor redacts secrets before logging"
      severity: "HIGH"
      ac_id: "AC-SECURITY-004"
      
    T5_governance_bypass:
      threat: "Orchestrator bypasses MasterOrchestrator, skips governance"
      mitigation: "@require_master_routing decorator raises MasterBypassError"
      severity: "HIGH"
      ac_id: "AC-ORCH-006"
  
  defense_in_depth:
    layer_1: "Input validation (pattern matching, intent classification)"
    layer_2: "ActionPolicyEngine (allowlist/denylist enforcement)"
    layer_3: "PathSandbox (path resolution and boundary checks)"
    layer_4: "CommandAllowlist (shell injection detection)"
    layer_5: "Audit logging (all security events logged)"
    layer_6: "Secret redaction (prevent credential leakage)"

# ==============================================================================
# ROUTING ARCHITECTURE (ENHANCED)
# ==============================================================================

routing_architecture:
  
  determinism_guarantees:
    - "Startup validation detects pattern conflicts"
    - "Explicit precedence: exact > prefix > regex"
    - "Priority field breaks ties (higher wins)"
    - "Routing contract tests prevent regressions"
    - "Single source of truth: tier0/routing/routing-table.yaml"
  
  staged_rollout_pipeline:
    step_1_registered:
      state: "REGISTERED"
      traffic_weight: 0.0
      behavior: "Code exists, tests pass, NOT in routing table"
      duration: "24-48 hours observation"
      validation: "Shadow logging active (observe pattern matches)"
      
    step_2_shadow:
      state: "SHADOW"
      traffic_weight: 0.0
      behavior: "Logs matches but doesn't execute"
      duration: "1 week shadow mode"
      validation: "Compare 'would have routed to X' vs 'actually routed to Y'"
      
    step_3_canary:
      state: "CANARY"
      traffic_weight: 0.01-0.20  # 1-20% traffic
      behavior: "Routes small percentage of traffic"
      duration: "1 week canary"
      validation: "Error rate <5%, latency <2x baseline"
      rollback_trigger: "error_rate > 5% OR avg_time > 2x baseline"
      
    step_4_active:
      state: "ACTIVE"
      traffic_weight: 1.0  # 100% traffic
      behavior: "Full production traffic"
      validation: "Continuous monitoring"
      rollback_trigger: "Sustained errors (>10 in 5 minutes)"
  
  conflict_resolution:
    overlapping_patterns:
      example: "^(implement|build|create)" vs "^(implement auth)"
      resolution: "Exact match 'implement auth' wins over general pattern"
      enforcement: "AC-ROUTE-001 conflict detection at startup"
      
    priority_ties:
      example: "Two patterns both match with same priority"
      resolution: "FAIL FAST - require explicit priority differentiation"
      enforcement: "Startup validation blocks ambiguous routing"

# ==============================================================================
# SDLC INTEGRATION (NEW)
# ==============================================================================

sdlc_integration:
  
  phase_gates:
    phase_1_to_phase_2:
      name: "Foundation → Orchestration Core"
      checklist:
        - "AC-AUDIT-001 to AC-AUDIT-006: Audit infrastructure complete"
        - "AC-GOV-001 to AC-GOV-005: Governance merger operational"
        - "AC-STATE-001 to AC-STATE-003: State management with WAL"
        - "AC-SECURITY-001 to AC-SECURITY-004: Action security layer active"
        - "All Phase 1 tests passing (unit + integration)"
        - "Zero root-level files created"
        - "Performance: <100ms governance merge"
      validation: "Automatic via AC-SDLC-001 phase gate validation"
      blocked_until: "All checklist items pass"
      
    phase_2_to_phase_3:
      name: "Orchestration Core → Feature Orchestrators"
      checklist:
        - "AC-ORCH-001 to AC-ORCH-008: MasterOrchestrator operational"
        - "AC-TODO-001 to AC-TODO-004: TodoManager persisting state"
        - "AC-TDD-001 to AC-TDD-008: TDD-Master gateway active"
        - "AC-ROUTE-001 to AC-ROUTE-003: Deterministic routing"
        - "AC-ROLLOUT-001 to AC-ROLLOUT-003: Staged activation"
        - "Routing table: tier0/routing/routing-table.yaml canonical"
        - "All Phase 1 + Phase 2 tests passing"
      validation: "Automatic via AC-SDLC-001"
      blocked_until: "All checklist items pass + Phase 1 gate passed"
  
  test_strategy:
    environment: "sharpening-cortex/sts-template/ (Sharpen The Saw)"
    isolation: "Each test gets fresh SQLite, temp dirs, mocked externals"
    teardown: "Automatic cleanup via pytest fixtures (scope='function')"
    coverage:
      unit: ">= 90% code coverage (enforced)"
      integration: "All AC-IDs validated (enforced)"
      performance: "<100ms for critical paths"
      security: "Penetration tests for ActionPolicyEngine"
    
    test_structure:
      - "tests/smoke/ - Fast (<1s) smoke tests"
      - "tests/unit/ - Isolated unit tests (mocked dependencies)"
      - "tests/integration/ - Multi-component tests (real dependencies)"
      - "tests/performance/ - Load tests, profiling"
  
  metrics_dashboard:
    location: "localhost:8000/sdlc"
    metrics:
      - "AC-IDs: completed/in-progress/not-started"
      - "Test coverage: unit/integration/performance"
      - "Phase completion percentages"
      - "Velocity: AC-IDs per week"
      - "Technical debt items by priority"
      - "Activation states: SHADOW/CANARY/ACTIVE counts"

# ==============================================================================
# FOLDER STRUCTURE ENFORCEMENT (NEW)
# ==============================================================================

folder_structure:
  
  cleanliness_rules:
    root_level:
      allowed:
        - "README.md"
        - "LICENSE"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "requirements.txt"
        - "setup.py"
      blocked:
        - "All other .md files"
        - "All other .py files"
        - ".txt files (except requirements.txt)"
      enforcement: "Pre-commit hook + AC-CLEAN-001"
      
    depth_limits:
      max_depth: 5  # levels from repo root
      enforcement: "Linting check + AC-CLEAN-002"
      example_violation: "src/a/b/c/d/e/f/file.py (6 levels)"
      
    file_size_limits:
      soft_limit: 500  # LOC
      hard_limit: 1000  # LOC
      enforcement: "Pre-commit warns at 500, rejects at 1000"
      rationale: "CORE-001 incremental principle"
  
  folder_cleanliness_score:
    formula: "(Structure × 0.3) + (Naming × 0.3) + (Depth × 0.2) + (Size × 0.2)"
    components:
      structure: "Proper tier0/tier1/tier2/tier3 usage"
      naming: "kebab-case consistency for markdown/dirs"
      depth: "Shallow hierarchy (<= 4 levels preferred)"
      size: "Files <= 500 LOC (90%+ compliance)"
    target: ">= 85/100"

# ==============================================================================
# PROACTIVE CHALLENGE SYSTEM (NEW)
# ==============================================================================

challenge_system:
  
  purpose: "Prevent production footguns BEFORE implementation"
  trigger: "AUTOMATIC - every user request"
  
  validation_steps:
    1_architecture_viability:
      questions:
        - "Does this contradict existing CORTEX 6 architecture?"
        - "Will this create brittleness, tight coupling, or technical debt?"
        - "Is there a simpler solution?"
        - "Does this violate SOLID/DRY/KISS/YAGNI?"
        - "Will this scale under production load?"
      
    2_design_pattern_validation:
      red_flags:
        - "Bypassing MasterOrchestrator"
        - "Direct file ops without ActionPolicyEngine"
        - "Hardcoded paths"
        - "Missing TDD workflow"
        - "Root-level file creation"
        - "Token-heavy operations >500 lines"
      
    3_conflict_detection:
      scans:
        - "Contradictory AC-IDs"
        - "Governance rule conflicts"
        - "Dependency cycles"
        - "Duplicate implementations (check git history)"
        - "Overlapping orchestrator patterns"
      
    4_efficiency_accuracy_tradeoff:
      scoring: "AC-SCORE-001 formula"
      thresholds:
        - "Accuracy < 70% → Challenge with better approach"
        - "Efficiency < 60% → Suggest resource-efficient alternative"
        - "Context mismatch → Flag phase incompatibility"
      
    5_folder_structure_impact:
      checks:
        - "Root directory file creation → REJECT"
        - "Tier placement validation"
        - "Duplicate functionality check"
        - "Naming convention compliance"
        - "Incremental file creation limit (max 3)"
      
    6_test_strategy_verification:
      requirements:
        - "Test cases defined BEFORE implementation (RED phase)"
        - "STS environment available"
        - "Reset on teardown specified"
        - "Test isolation guaranteed"
        - "Incremental activation path defined"
      
    7_alternative_generation:
      always_provide:
        - "Simpler approach (trade features for simplicity)"
        - "Existing solution (reuse from git history)"
        - "Deferred approach (is this Phase 1 work?)"
  
  response_templates:
    non_viable: "🚫 DESIGN CHALLENGE + alternatives + risk explanation"
    needs_clarification: "⚠️ AMBIGUITY DETECTED + questions + cannot proceed"
    viable_with_improvements: "✅ VIABLE with ENHANCEMENTS + benefits + confirmation"

