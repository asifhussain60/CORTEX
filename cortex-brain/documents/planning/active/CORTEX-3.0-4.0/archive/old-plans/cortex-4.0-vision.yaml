    - role: "Backend Engineer"
      allocation: "Full-time"
      duration: "12 months"
      skills: ["Python", "FastAPI", "PostgreSQL", "Docker"]
    - role: "DevOps Engineer"
      allocation: "Part-time (50%)"
      duration: "6 months"
      skills: ["Kubernetes", "Cloud platforms", "CI/CD"]
    - role: "Security Engineer"
      allocation: "Part-time (25%)"
      duration: "3 months"
      skills: ["SSO", "RBAC", "Compliance", "Penetration testing"]
  
  infrastructure:
    - service: "LLM API costs (GPT-4, Claude)"
