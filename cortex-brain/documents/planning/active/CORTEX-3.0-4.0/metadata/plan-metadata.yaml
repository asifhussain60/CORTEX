progress:
  # Progress calculation methodology:
  # - linear_percent: Simple phase count (completed ÷ total)
  # - weighted_percent: Effort-based (accounts for phase complexity)
  # - Display: weighted_percent (more accurate representation)
  
  linear_percent: 46        # 6.27 / 13.5 phases
  weighted_percent: 56      # Foundation/orchestrators = 70% of effort
  
  current_phase: "Phase 6.5"
  current_week: "Week 10 Day 5"
  phases_complete: 6.27     # 6 full + 0.27 (Phase 6.5 progress)
  total_phases: 13.5
  
  orchestrators_migrated: 16
  total_orchestrators: 16
  
  # Effort weights by phase group
  effort_distribution:
    foundation_orchestrators: 0.70  # Phases 1-6 (heavy lifting)
    operations_testing_docs: 0.20   # Phases 7-9 (lighter weight)
    enhancements_postga: 0.10       # Phases 10-13 (optional/parallel)
  
  recent_milestone: "Phase 6 Complete - All 16 orchestrators migrated to 4.0 architecture"
  recent_date: "2025-12-22"

# Smart loading queries (for orchestrator intelligence)
query_routing:
  status_only:
    keywords: ["status", "summary", "progress", "overall"]
    load: ["CORTEX4-STATUS.md"]
    estimated_tokens: 400
    
  architecture:
    keywords: ["architecture", "dependencies", "structure", "design"]
    load: ["CORTEX4-STATUS.md", "00-MASTER-PLAN.md"]
    estimated_tokens: 1200
    
  phase_specific:
    pattern: "phase [0-9]+"
    load: ["CORTEX4-STATUS.md", "phases/phase-{id}-*.md"]
    estimated_tokens: ~2500
    
  week_specific:
    pattern: "week [0-9]+"
    load: ["CORTEX4-STATUS.md", "workers/phase-*/week-*.md"]
    estimated_tokens: ~1000
    
  default:
    load: ["CORTEX4-STATUS.md", "00-MASTER-PLAN.md"]
    estimated_tokens: 1200

# Integration points
integration:
  manifest_file: "cortex-brain/manifests/orchestrators/planning-system-4.0-manifest.yaml"
  sync_required: true
  smart_loader: "src/utils/smart_plan_loader.py"
  plan_folder_manager: "src/workflows/plan_folder_manager.py"
  plan_executor: "src/orchestrators/planning/plan_executor.py"

# Template for future complex plans
template:
  standard: true
  reusable: true
  applies_to: ["planning-system", "ado-planning", "migration-plans", "architecture-plans"]
