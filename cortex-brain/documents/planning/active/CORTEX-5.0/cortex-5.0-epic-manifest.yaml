    estimated_hours: 2
    duration_estimate: "2h"
    complexity: simple
    
    dependencies: []  # First sub-plan, no dependencies
    
    description: "Organize and validate CORTEX-5.0 epic folder structure, remove duplicates, establish standard patterns."
    
    exit_criteria:
      - "All 18 child plan folders properly named and organized"
      - "No duplicate or orphaned files"
