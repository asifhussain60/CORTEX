# ========================================
# CORTEX-5.0 EPIC Manifest
# ========================================
# Purpose: Formal EPIC structure definition for plan_orchestrator.py
# Version: 1.0.0
# Created: January 4, 2026
# Author: Asif Hussain
#
# This manifest serves as the source of truth for:
# - Child plan metadata and ordering
# - Inter-plan dependencies and validation rules
# - Execution gates and blocking conditions
# - Progress tracking and status management
#
# The plan_orchestrator.py script detects this file and uses it to:
# 1. Validate EPIC mode (vs feature mode)
# 2. Load child plan definitions
# 3. Enforce dependency rules
# 4. Track progress across 18 coordinated sub-plans
# ========================================

epic_metadata:
  epic_id: cortex-v5-gap-remediation
  epic_name: "CORTEX v5 Gap Remediation & Completion"
  epic_type: strategic_multi_phase
  planner_mode: epic  # Triggers EPIC mode detection
  version: 5.0.1
  created: "2026-01-03"
  last_updated: "2026-01-04"
  author: "Asif Hussain"
  status: active
  
  # Master plan reference
  master_plan_file: "00-MASTER-REMEDIATION-PLAN.md"
  
  # Tracking infrastructure
  tracking:
    epic_progress_tracker: "tracking/epic-progress-tracker.json"
    child_plan_registry: "tracking/child-plan-registry.json"
    dependency_graph: "tracking/dependency-graph.json"
  
  # Epic-level metrics
  metrics:
    total_child_plans: 18
    total_estimated_hours: 400
    critical_path_weeks: 11
    blocking_plans: 3
    parallel_execution_supported: true

# ========================================
# CHILD PLANS (18 Total)
# ========================================
# Order: Sequential execution order (00A-18)
# Type: infrastructure | feature | validation | enhancement | migration | documentation
# Priority: critical | high | medium | low
# Blocking: true = must complete before dependents can start
# ========================================

