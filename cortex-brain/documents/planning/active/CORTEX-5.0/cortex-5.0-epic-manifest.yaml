# ========================================
# VALIDATION RULES
# ========================================
# Enforced by plan_orchestrator.py during execution
# ========================================

validation_rules:
  
  # Dependency validation
  dependency_enforcement:
    enabled: true
    strict_mode: true  # Block execution if dependencies not met
    check_on_start: true
    check_on_update: false
    
  # Gate validation  
  gate_enforcement:
    enabled: true
    gates:
      - gate_id: "GATE-1"
        name: "50% Test Coverage"
        condition: "Sub-Plan 00C progress ≥50%"
        blocks: ["01", "02", "05"]
        
      - gate_id: "GATE-2"
        name: "80% Test Coverage"
        condition: "Sub-Plan 00C progress ≥80%"
        blocks: ["03", "04"]
  
  # Progress validation
  progress_validation:
    min_progress: 0
    max_progress: 100
    allow_regression: false  # Cannot decrease progress
    require_status_update: true
  
  # Completion validation
  completion_validation:
    require_100_percent: true
    require_exit_criteria: true
    require_documentation: true
    require_tests_passing: true

# ========================================
# EXECUTION CONFIGURATION
# ========================================

execution_config:
  
  # Parallel execution
  parallel_execution:
    enabled: true
    max_parallel: 3  # Maximum 3 sub-plans executing simultaneously
    allow_parallel_in_wave: true
    cross_wave_parallel: false  # Must complete wave before starting next
  
  # Brittleness testing
  brittleness_testing:
    enabled: true
    run_before_start: true
    auto_fix: true
    fail_on_critical: true
  
  # Pre-execution analysis
  pre_execution_analysis:
    enabled: true
    generate_analysis_doc: true
    require_review: false  # Auto-proceed
    analysis_folder: "analysis/"
  
  # Git integration
  git_checkpoints:
    enabled: true
    checkpoint_on_start: true
    checkpoint_on_complete: true
    checkpoint_prefix: "feat(sub-plan-{order})"

# ========================================
# CRITICAL PATH
# ========================================
# Longest dependency chain - determines minimum completion time
# ========================================

critical_path:
  total_weeks: 11
  path:
    - "00A"  # Epic Structure Cleanup (2h)
    - "00B"  # Epic & Feature Planner (2-3w)
    - "00C"  # Test Coverage Sprint (2-3w)
    - "01"   # Refinement Orchestrator (1w)
    - "08"   # Orchestrator Migrations (1-2w)
    - "12"   # Production Validation (1w)
    - "09"   # Final Validation (3-4d)

# ========================================
# SUCCESS CRITERIA
# ========================================

epic_success_criteria:
  - "All 18 child plans completed (excluding deferred 16-18)"
  - "Overall test coverage ≥80%"
  - "All deployment gates passed"
  - "Production validation pipeline operational"
  - "Documentation complete"
  - "Onboarding system functional"
  - "Zero critical brittleness issues"
  - "All SKULL rules enforced"

