decision_register:
  
  architectural_decisions:
    AD-001:
      decision: Proceed with manual plan (fix Planning Orchestrator in Stage 3)
      rationale: Stage 1 doesn't depend on Planning Orchestrator functionality
      impact: No delay to Stage 1 execution
      
    AD-002:
      decision: AC-ID tracking only (no schema validation in markers)
      rationale: Separation of concerns (traceability ≠ validation)
      impact: Simpler Phase 1.3, stays 8-10 hours
      
    AD-003:
      decision: No backward compatibility for SKULL → CORE migration
      rationale: Clean architecture, no legacy debt
      impact: Simpler Phase 1.2, delete brain-protection-rules.yaml
      
    AD-004:
      decision: Manual housekeeping only (no automatic triggers)
      rationale: User control over system maintenance
      impact: Phase 1.4 stays 12-16 hours
      
    AD-005:
      decision: Clone + PATH (no global installation)
      rationale: Simplicity over complexity
      impact: Stage 3 reduced from 20-24h to 12-16h for cross-repo
      
    AD-006:
      decision: Size-based audit log rotation (50MB) + daily fallback
      rationale: Standard logging practice, prevents bloat
      impact: Implementation detail in Phase 1.1
      
    AD-007:
      decision: Bootstrap self-audit for AuditLogger validation
      rationale: Breaks circular dependency elegantly
      impact: Phase 1.1.5 validation strategy
      
    AD-008:
