  author: Asif Hussain
  
  clarification_sessions:
    session_1:
      date: 2026-01-09T17:00:00Z
      questions: [Q1, Q2, Q3, Q4, Q5, Q6, Q7]
      decisions: 7
      
    session_2:
      date: 2026-01-09T17:30:00Z
      questions: [Q8, Q9, Q10, Q11]
      decisions: 4
      refinements: [Q3, Q4, Q5, Q7]
      
    session_3:
      date: 2026-01-09T18:00:00Z
      questions: [Q12, Q13, Q14, Q15, Q16]
      decisions: 5
      additions: [Migrate Orchestrator]
      
    session_4:
      date: 2026-01-09T19:00:00Z
      questions: [Q17, Q18, Q19, Q20]
      decisions: 4
      topic: "Plan Viewer Dashboard (plan-viewer.html) DoR"
      
  total_decisions: 18
  ambiguity_level: 0  # Zero ambiguity achieved
  execution_readiness: true

  dor_decisions:
    # Dashboard-specific DoR decisions (Session 4)
    Q17:
      question: "Should plan-viewer.html be generated ONCE at plan creation or REGENERATED on every progress update?"
      answer: "Generate once at plan creation, updates via WebSocket (no regeneration)"
      rationale: "Static HTML + dynamic WebSocket updates = better performance, simpler architecture, no file thrashing"
      impact: "Phase 3.3 (Orchestrator Integration) - dashboard_generator.py generates static HTML once"
      decision: FINALIZED
      
    Q18:
      question: "Should dashboard auto-launch browser on plan creation or require manual launch?"
      answer: "Manual launch by default, optional auto-launch via --dashboard-launch flag"
      rationale: "User control over browser pop-ups, headless CI/CD compatibility, optional convenience"
      impact: "Planning Orchestrator adds --dashboard-launch flag, config: dashboard.auto_launch=false (default)"
      decision: FINALIZED
      
    Q19:
      question: "Should dashboard server run as background daemon or foreground process?"
      answer: "Foreground process with graceful shutdown (Ctrl+C), optional background via --daemon flag"
      rationale: "Development transparency (see logs), easy debugging, production flexibility, standard Unix pattern"
      impact: "serve.py uses uvicorn.run() (foreground), --daemon flag uses subprocess.Popen()"
      decision: FINALIZED
      
    Q20:
      question: "Should dashboard data refresh via polling or WebSocket push?"
      answer: "WebSocket push for real-time updates (no polling)"
      rationale: "Efficient (<100ms latency), modern, scalable, battery-friendly (mobile), standard pattern"
      impact: "Backend implements file watcher → WebSocket broadcast, frontend receives push events"
      decision: FINALIZED

# ==============================================================================
# SECTION 1: STRATEGIC REQUIREMENTS
# ==============================================================================

strategic_requirements:
  
  SR-001:
    id: SR-001
    name: Foundation-First Approach
    priority: P0_CRITICAL
    description: |
      Implement 4 P0_CRITICAL blocking issues FIRST before any feature work.
      These unlock all downstream validation and governance.
    acceptance_criteria:
      - Audit Logger operational (self-audit successful)
      - 61 SKULL rules migrated to CORE-* (no backward compatibility)
      - AC-ID traceability generating coverage reports
      - Housekeeping Orchestrator running (manual on-demand)
    blocking_issues: [AUDIT-001, GOV-001, TRACE-001, HOUSE-001]
    stage: 1
    
  SR-002:
    id: SR-002
    name: Dual Validation Framework
    priority: P0_CRITICAL
    description: |
      Every acceptance criteria requires BOTH test evidence AND audit evidence.
      Tests verify functionality, audit logs prove execution.
    acceptance_criteria:
      - Test evidence: pytest with @pytest.mark.ac_id() markers
      - Audit evidence: JSONL logs with AC-ID tags
      - MCP tools query both sources for validation
      - No duplication (tests = logic, audit = operations)
    rationale: Complementary validation (not duplicate)
    clarification: Q7 response
    stage: 1
    
  SR-003:
    id: SR-003
    name: Simplified Cross-Repo Usage
    priority: HIGH
    description: |
      User clones CORTEX once, adds to PATH, runs from any directory.
      No global installation, no packaging, no complex setup.
    acceptance_criteria:
      - User runs: git clone + add PATH (30 seconds)
      - CLI entry point: bin/cortex (shell script)
      - Workspace detection: Check for cortex-brain/ folder
      - Git isolation enforced (CORE-019)
      - Plans stored in CORTEX by default
    rationale: Simplicity over complexity
    clarification: Q5, Q8, Q12, Q13 responses
    stage: 3
    
  SR-004:
    id: SR-004
    name: On-Demand Plan Migration
    priority: MEDIUM
    description: |
      Plans stored in CORTEX by default. User can migrate to their repo
      on-demand using Migrate Orchestrator.
    acceptance_criteria:
      - Default: cortex-brain/documents/planning/user-repos/{repo}/
      - Migration: cortex migrate plan → .cortex/plans/ in user repo
      - .cortex/ added to .gitignore (optional)
      - Symlink maintained in CORTEX
      - Audit log migration event
    rationale: Git isolation + user control
    clarification: Q14 response
    stage: 3
    
  SR-005:
    id: SR-005
    name: Manual Housekeeping Only
    priority: MEDIUM
    description: |
      Housekeeping Orchestrator runs on-demand by user command.
      No automatic triggers (git hooks, cron jobs, file watchers).
    acceptance_criteria:
      - Command: cortex housekeeping
      - 9 phases execute sequentially
      - Health report generated
      - User decides when to run
    rationale: User control over system maintenance
    clarification: Q4, Q9 responses
    stage: 1
    
  SR-006:
    id: SR-006
    name: Clean Governance Migration
    priority: P0_CRITICAL
    description: |
      Migrate 61 SKULL rules to CORE-* numbering with NO backward compatibility.
      Delete brain-protection-rules.yaml entirely.
    acceptance_criteria:
      - All SKULL-* references removed from codebase
      - core-rules.yaml contains all 61 rules with CORE-* IDs
      - No lookup tables, no legacy support
      - Clean deletion of old governance file
    rationale: No legacy debt, clean architecture
    clarification: Q3 response
    stage: 1
    
  SR-007:
    id: SR-007
    name: Fast Startup via Lazy Loading
    priority: MEDIUM
    description: |
      CORTEX CLI starts in <500ms. Orchestrators load on-demand (import-time).
    acceptance_criteria:
      - CLI help: ~100ms (load router + context detector only)
      - Command execution: +200-300ms (load needed orchestrator)
      - Total startup: <500ms for any command
      - Import-time lazy loading (standard Python pattern)
    rationale: Fast user experience
    clarification: Q10, Q15 responses
    stage: 3
  
  SR-008:
    id: SR-008
    name: Interactive Plan Viewer Dashboard
    priority: HIGH
    description: |
      Real-time, interactive dashboard for plan execution monitoring with
      audit log evidence, test coverage metrics, and live progress updates.
      Served on localhost:8000 with auto-refresh and modern glassmorphism UI.
    acceptance_criteria:
      - FastAPI server serves dashboard on localhost:8000
      - Real-time updates via WebSocket (<500ms latency)
      - Audit log viewer with filtering and pagination
      - Test coverage dashboard with AC-ID traceability
      - Glassmorphism dark theme with Tailwind CSS
      - Integrated with Planning Orchestrator (auto-generation)
      - Performance SLAs met (page load <2s, memory <200MB)
    technical_details:
      frontend: "HTML5 SPA with Tailwind CSS and Vanilla JS"
      backend: "FastAPI with WebSocket support"
      data_sources: "progress-tracker.json, audit-logs/*.jsonl, tests/"
      deployment: "localhost:8000 (development), Docker (production)"
      architecture:
        generation: "Static HTML generated once at plan creation (Q17)"
        launch: "Manual launch by default, --dashboard-launch flag optional (Q18)"
        execution: "Foreground server (Ctrl+C to stop), --daemon flag optional (Q19)"
        updates: "WebSocket push updates (no polling, <100ms latency) (Q20)"
    implementation:
      phases:
        - "Phase 1: Backend API (4-5h)"
        - "Phase 2: Frontend SPA (6-8h)"
        - "Phase 3: Orchestrator Integration (3-4h)"
        - "Phase 4: Polish & Deployment (3-4h)"
      total_effort: "16-20 hours"
    rationale: |
      Developers and stakeholders need visual feedback on plan execution progress,
      audit trail evidence, and test coverage metrics. Dashboard provides
      transparency and real-time visibility into CORTEX 6.0 build progress.
    clarifications:
      - "Q17: Generate HTML once (not on every update) - WebSocket handles live data"
      - "Q18: Manual launch default, --dashboard-launch flag for auto-open browser"
      - "Q19: Foreground server default (see logs), --daemon flag for background"
      - "Q20: WebSocket push (no polling) for <100ms real-time updates"
    plan_reference: "artifacts/PLAN-VIEWER-DASHBOARD-PLAN.yaml"
    stage: 3  # Features stage
    blocking: false

# ==============================================================================
# SECTION 2: FOUNDATION REQUIREMENTS (STAGE 1)
# ==============================================================================

foundation_requirements:
  
  FR-001:
    id: FR-001
    name: Audit Logger Infrastructure
    priority: P0_CRITICAL
    estimated_hours: 16-20
    blocking: true
    
    description: |
      Comprehensive audit logging system enabling evidence-based validation
      for all 390+ acceptance criteria.
      
    components:
      database:
        type: SQLite
        location: cortex-brain/database/audit.db
        schema: cortex-brain/database/audit_schema.sql
        tables: [audit_logs]
        indexes: [ac_id, category, timestamp]
        
      jsonl_backup:
        location: cortex-brain/audit-logs/
        rotation: Size-based (50MB) + daily fallback
        format: JSON Lines (one entry per line)
        naming: audit-YYYY-MM-DD-NNN.jsonl
        
      categories:
        - governance: SKULL/CORE rule enforcement
        - orchestrator: Execution tracking
        - validation: AC checks
        - infrastructure: System health
        - mcp: Tool invocations
        - brain: Tier0-3 operations
        - integration: External systems
        
      performance:
        latency: <5ms per log entry
        throughput: ≥1000 entries/second
        memory_overhead: <10MB baseline
        
      self_audit:
        requirement: AuditLogger logs its own initialization
        bootstrap_file: cortex-brain/audit-logs/bootstrap.jsonl
        validation: Query for operation='audit_logger_init'
        
    deliverables:
      - src/infrastructure/audit_logger.py
      - cortex-brain/database/audit_schema.sql
      - src/mcp/audit_query.py (5 MCP tools)
      - tests/unit/test_audit_logger.py (≥95% coverage)
      - tests/integration/test_audit_mcp.py
      
    acceptance_criteria:
      - AC-F01-005: Audit Logger operational with 7 categories
      - AC-AUDIT-001 to AC-AUDIT-006: All audit framework AC
      - Bootstrap validation: Self-audit successful
      
    clarifications:
      Q6: Size-based rotation (50MB) + daily fallback
      Q7: Audit logs prove execution (not duplicate tests)
      
  FR-002:
    id: FR-002
    name: SKULL to CORE Migration
    priority: P0_CRITICAL
    estimated_hours: 4-6
    blocking: true
    depends_on: [FR-001]
    
    description: |
      Migrate 61 SKULL rules to CORE-* numbering with clean deletion
      of legacy implementation. No backward compatibility.
      
    migration_strategy:
      approach: Direct replacement (SKULL-001 → CORE-001)
      backward_compatibility: NONE
      old_file_action: DELETE brain-protection-rules.yaml
      reference_updates: All .py, .yaml, .md files
      
    deliverables:
      - cortex-brain/tier0/governance/core-rules.yaml (61 rules)
      - DELETE: cortex-brain/brain-protection-rules.yaml
      - scripts/migrate_skull_to_core.py
      - tests/governance/test_skull_migration.py
      
    acceptance_criteria:
      - AC-GOV-001: All 61 SKULL rules migrated to CORE-*
      - AC-GOV-002: 4-Category Governance Merger operational
      - No SKULL-* references remain in codebase
      
    clarifications:
      Q3: No backward compatibility, clean deletion
      
  FR-003:
    id: FR-003
    name: AC-ID Traceability System
    priority: P0_CRITICAL
    estimated_hours: 8-10
    blocking: true
    depends_on: [FR-001]
    
    description: |
      Link tests to acceptance criteria for coverage tracking and gap detection.
      Pytest marker system for AC-ID tracking only (no schema validation).
      
    components:
      pytest_marker:
        name: ac_id
        usage: "@pytest.mark.ac_id('AC-F01-005')"
        purpose: Traceability only (not validation)
        
      coverage_matrix:
        location: cortex-brain/registry/ac-test-coverage.yaml
        format: AC-ID → [test_files]
        generation: Automated scan of all tests
        
      gap_detection:
        algorithm: Find AC without tests, tests without AC
        current_state: 148 tests exist, 0 have AC-ID markers
        target_state: 206+ AC gaps identified
        
    deliverables:
      - src/infrastructure/ac_traceability.py
      - tests/conftest.py (add ac_id marker)
      - pytest.ini (register marker)
      - src/mcp/ac_traceability_query.py (4 MCP tools)
      - cortex-brain/registry/ac-test-coverage.yaml
      
    acceptance_criteria:
      - AC-ARCH-011: Unified CORTEX test suite
      - AC-ARCH-014: Acceptance criteria test harnessing
      - Coverage matrix generated for 148 existing tests
      
    clarifications:
      Q2: AC-ID tracking only (schema validation = separate concern)
      
  FR-004:
    id: FR-004
    name: Housekeeping Orchestrator
    priority: P0_CRITICAL
    estimated_hours: 12-16
    blocking: true
    depends_on: [FR-001, FR-002, FR-003]
    
    description: |
      Autonomous brain health monitoring and maintenance system.
      Manual on-demand execution only (no automatic triggers).
      
    trigger_strategy:
      manual: "cortex housekeeping" or "python3 -m src.main 'housekeeping'"
      automatic: NONE (no git hooks, no cron jobs, no file watchers)
      rationale: User control over system maintenance
      
    phases:
      phase_1: Governance rule validation
      phase_2: Test coverage analysis
      phase_3: Audit log health check
      phase_4: Brain tier synchronization
      phase_5: Cache cleanup
      phase_6: Git isolation verification
      phase_7: Orchestrator manifest validation
      phase_8: AC gap detection
      phase_9: Health report generation
      
    deliverables:
      - src/orchestrators/housekeeping_orchestrator.py
      - cortex-brain/manifests/orchestrators/housekeeping.yaml
      - src/operations/housekeeping/*_phase.py (9 files)
      - tests/orchestrators/test_housekeeping.py (≥95% coverage)
      
    acceptance_criteria:
      - AC-ORC-011: Housekeeping Orchestrator manual execution
      - AC-ORC-HOUSE-001 to AC-ORC-HOUSE-009: All 9 phases
      - Complete in <60 seconds
      - Health report generated
      
    clarifications:
      Q4: Manual on-demand (both trigger and control)
      Q9: No automatic triggers (user decides when to run)

# ==============================================================================
# SECTION 3: CROSS-REPO REQUIREMENTS (STAGE 3)
# ==============================================================================

cross_repo_requirements:
  
  CR-001:
    id: CR-001
    name: CLI Entry Point
    priority: HIGH
    estimated_hours: 3-4
    stage: 3
    
    description: |
      Shell script CLI entry point for simplified cross-repo usage.
      
    architecture:
      location: bin/cortex
      type: Shell script (bash)
      functionality: Wrapper around python3 src/main.py
      
    implementation:
      script_content: |
        #!/bin/bash
        CORTEX_DIR="$(cd "$(dirname "$0")/.." && pwd)"
        export CORTEX_HOME="$CORTEX_DIR"
        python3 "$CORTEX_DIR/src/main.py" "$@"
        
      permissions: chmod +x bin/cortex
      path_addition: export PATH="$PATH:~/PROJECTS/CORTEX/bin"
      
    deliverables:
      - bin/cortex (executable shell script)
      - tests/integration/test_cli_entry.py
      
    clarifications:
      Q12: bin/cortex shell script (standard Unix convention)
      
  CR-002:
    id: CR-002
    name: Workspace Detection
    priority: HIGH
    estimated_hours: 4-6
    stage: 3
    depends_on: [CR-001]
    
    description: |
      Automatic detection of CORTEX repo vs user repo context.
      
    detection_strategy:
      signal: Presence of cortex-brain/ folder
      cortex_repo: os.path.exists('cortex-brain/') → True
      user_repo: os.path.exists('cortex-brain/') → False
      rationale: Simplest, no extra files needed, fast check
      
    implementation:
      location: src/infrastructure/workspace_detector.py
      method: detect_workspace_type() → 'CORTEX_REPO' or 'USER_REPO'
      performance: <10ms (simple filesystem check)
      
    git_isolation:
      enforcement: CORE-019 (CORTEX never commits to user repos)
      validation: Housekeeping Phase 6 (git isolation verification)
      
    deliverables:
      - src/infrastructure/workspace_detector.py
      - tests/integration/test_workspace_detection.py
      
    clarifications:
      Q13: Check for cortex-brain/ folder (simplest)
      
  CR-003:
    id: CR-003
    name: User Repo Plan Storage
    priority: HIGH
    estimated_hours: 3-4
    stage: 3
    depends_on: [CR-002]
    
    description: |
      Default plan storage in CORTEX with on-demand migration capability.
      
    storage_strategy:
      default_location: cortex-brain/documents/planning/user-repos/{repo-name}/
      rationale: Git isolation, centralized planning, no .cortex/ clutter
      repo_name_derivation: Git remote URL or folder name
      
    plan_organization:
      user_repo_plans: cortex-brain/.../user-repos/{repo-name}/
      cortex_plans: cortex-brain/.../active/cortex6/
      archived_plans: cortex-brain/.../archive/
      
    deliverables:
      - src/operations/user_repo_plan_manager.py
      - tests/integration/test_user_repo_storage.py
      
    clarifications:
      Q14: Store in CORTEX only (git isolation + centralized)
      
  CR-004:
    id: CR-004
    name: Lazy Loading System
    priority: MEDIUM
    estimated_hours: 4-6
    stage: 3
    
    description: |
      Import-time lazy loading for <500ms startup performance.
      
    loading_strategy:
      type: Import-time lazy loading
      implementation: importlib.import_module() on-demand
      startup_budget: <500ms total (100ms CLI + 200-300ms orchestrator)
      
    always_loaded:
      - CLI argument parser
      - Intent router (pattern matching)
      - Workspace detector
      - Configuration loader
      
    lazy_loaded:
      - Orchestrators (import only when needed)
      - AuditLogger (import on first log entry)
      - StateManager (import on plan execution)
      - MCP tools (import on mcp command)
      - Heavy dependencies (PyYAML, sqlite3)
      
    deliverables:
      - src/infrastructure/lazy_loader.py
      - tests/performance/test_startup_time.py
      
    clarifications:
      Q10: Lazy loading required for fast startup
      Q15: Import-time lazy loading (standard Python pattern)
      
  CR-005:
    id: CR-005
    name: User Setup Automation
    priority: MEDIUM
    estimated_hours: 2-3
    stage: 3
    
    description: |
      Both manual and automated setup options for user convenience.
      
    setup_options:
      manual:
        steps:
          - git clone https://github.com/asifhussain60/CORTEX.git
          - echo 'export PATH="$PATH:~/PROJECTS/CORTEX/bin"' >> ~/.zshrc
          - source ~/.zshrc
        duration: 30 seconds
        
      automated:
        script: setup.sh
        functionality: Detect CORTEX_DIR, add PATH to shell config
        duration: 10 seconds
        
    deliverables:
      - setup.sh (bash script)
      - README.md (setup instructions)
      - docs/installation/QUICK-START.md
      
    clarifications:
      Q16: Both README + setup.sh (convenience + control)

# ==============================================================================
# SECTION 4: MIGRATE ORCHESTRATOR REQUIREMENTS (STAGE 3)
# ==============================================================================

migrate_orchestrator_requirements:
  
  MR-001:
    id: MR-001
    name: Migrate Orchestrator v1
    priority: MEDIUM
    estimated_hours: 6-8
    stage: 3
    phase: 3.5 (new)
    
    description: |
      On-demand orchestrator to migrate CORTEX-stored plans to user repos.
      
    triggers:
      - "migrate plan"
      - "export plan"
      - "move plan to repo"
      
    capabilities:
      - Detect active plan in cortex-brain/documents/planning/user-repos/
      - Validate user repo has .git/ (is a git repo)
      - Create .cortex/plans/ in user repo
      - Copy plan artifacts (YAML, MD, tracking files)
      - Add .cortex/ to .gitignore (optional, user confirmation)
      - Update plan metadata (location: migrated)
      - Maintain symlink in CORTEX (points to user repo)
      - Audit log migration event
      
    user_experience:
      command: "cortex migrate plan 'feature-X'"
      confirmation_prompts:
        - Confirm migration target: ~/user-repo/.cortex/plans/
        - Add .cortex/ to .gitignore? (Y/n)
        - Keep symlink in CORTEX? (Y/n)
      
      result:
        - ✅ Plan migrated to user repo
        - ✅ .cortex/ in .gitignore (if confirmed)
        - ✅ Symlink maintained (if confirmed)
        - ✅ Audit log entry created
        
    deliverables:
      - src/orchestrators/migrate_orchestrator.py
      - .github/prompts/cortex-migrate.prompt.md
      - cortex-brain/manifests/orchestrators/migrate.yaml
      - tests/orchestrators/test_migrate.py
      
    acceptance_criteria:
      - AC-ORC-MIGRATE-001: Detect and validate source plan
      - AC-ORC-MIGRATE-002: Create .cortex/plans/ in user repo
      - AC-ORC-MIGRATE-003: Copy all plan artifacts
      - AC-ORC-MIGRATE-004: .gitignore management
      - AC-ORC-MIGRATE-005: Symlink creation
      - AC-ORC-MIGRATE-006: Audit log migration event
      
    clarifications:
      Q14: On-demand migration capability (user control)

