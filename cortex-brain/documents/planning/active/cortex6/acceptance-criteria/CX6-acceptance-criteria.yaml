# ==============================================================================
# SECTION 15C: GAP-FIX VALIDATION
# ==============================================================================
# Purpose: Ensure gap-fix pipeline doesn't introduce conflicts, duplicates, or
#          regressions when injecting remediation gaps into existing plans
# Prompt: .github/prompts/cortex-gap-fix.prompt.md (Phase 10B)
# ==============================================================================

gap_fix_validation:

  AC-GAPFIX-001:
    id: AC-GAPFIX-001
    criterion: "Conflict detection scan before plan injection"
    acceptance:
      - "**CONTRADICTORY CHECK:** Scan new gaps vs existing tasks for opposing requirements"
      - "**DETECTION ALGORITHM:** Compare gap.fix against task.implementation for contradictions"
      - "**CONFLICT TYPES:** CONTRADICTORY, DUPLICATE, REGRESSION_RISK, DEPENDENCY_BREAK"
      - "**BLOCKING BEHAVIOR:** CONTRADICTORY conflicts block Phase 11 until resolved"
      - "**RESOLUTION OPTIONS:** Keep task, keep gap, or merge (human decision)"
      - "**CONFLICT REPORT:** Generate conflict-report-{timestamp}.yaml with all conflicts"
      - "**AUDIT TRAIL:** All conflict resolutions logged with rationale"
      - "Test: Inject contradictory gap → conflict detected → Phase 11 blocked"
      - "Test: Resolve conflict → Phase 11 unblocked → audit log shows resolution"
    validation: automated
    test_file: "tests/gap_fix/test_conflict_detection.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Conflict report schema: cortex-brain/schemas/conflict-report-schema.yaml"
      - "Sample conflict: cortex-brain/analysis/sample-conflict-report.yaml"

  AC-GAPFIX-002:
    id: AC-GAPFIX-002
    criterion: "Requirement deduplication check"
    acceptance:
      - "**DUPLICATE DETECTION:** Check if gap criterion already exists with different ID"
      - "**CRITERION MATCHING:** Compare gap.criterion text against existing plan criteria"
      - "**FUZZY MATCHING:** Use semantic similarity for near-duplicate detection (>85% match)"
      - "**AUTO-MERGE:** Duplicate gaps auto-merged, preserving earliest ID"
      - "**MERGE NOTIFICATION:** User notified of auto-merged duplicates"
      - "**ID PRESERVATION:** Original criterion ID preserved (not the new gap ID)"
      - "**EVIDENCE MERGE:** Evidence from both duplicates combined"
      - "Test: Add duplicate gap with new ID → auto-merged → earliest ID preserved"
      - "Test: Near-duplicate (86% match) → flagged for review"
    validation: automated
    test_file: "tests/gap_fix/test_deduplication.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Deduplication log: cortex-brain/audit-logs/deduplication-*.jsonl"
      - "Similarity threshold: configurable in cortex-brain/config/gap-fix.yaml"

  AC-GAPFIX-003:
    id: AC-GAPFIX-003
    criterion: "Regression impact analysis on existing phases"
    acceptance:
      - "**REGRESSION DETECTION:** Verify injected Phase 0 doesn't invalidate completed work"
      - "**COMPLETED PHASE SCAN:** Check all completed phases for affected tasks"
      - "**IMPACT ASSESSMENT:** Calculate which completed tasks would be undone by gap fix"
      - "**SEVERITY LEVELS:** WARNING (review recommended), CRITICAL (blocks injection)"
      - "**AFFECTED TASK LIST:** List all tasks impacted by each gap"
      - "**RECOMMENDATION:** Provide guidance on how to proceed (review, skip, force)"
      - "**FORCE OPTION:** Allow override with explicit acknowledgment (audit logged)"
      - "Test: Gap affects completed phase → WARNING severity → recommendation shown"
      - "Test: Gap would undo critical foundation → CRITICAL → blocks without override"
    validation: automated
    test_file: "tests/gap_fix/test_regression_analysis.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Regression report: cortex-brain/analysis/regression-impact-*.yaml"
      - "Override audit: cortex-brain/audit-logs/regression-overrides.jsonl"

  AC-GAPFIX-004:
    id: AC-GAPFIX-004
    criterion: "TDD enforcement on all remediation tasks"
    acceptance:
      - "**TEST REQUIREMENT:** Every remediation task must have test_file specified"
      - "**VALIDATION CHECK:** Phase 10B blocks if any remediation task lacks test_file"
      - "**TEST FILE FORMAT:** test_file must be valid path in tests/ directory"
      - "**TEST EXISTENCE:** Warn if test file doesn't exist yet (planning phase OK)"
      - "**TDD WORKFLOW:** Gap → test_file specified → RED test → implementation → GREEN"
      - "**BLOCKING BEHAVIOR:** Missing test_file blocks Phase 11"
      - "**EXCEPTION HANDLING:** Documentation-only gaps exempt (marked with tdd_exempt: true)"
      - "Test: Remediation task without test_file → Phase 10B fails"
      - "Test: All tasks have test_file → Phase 10B passes → Phase 11 proceeds"
    validation: automated
    test_file: "tests/gap_fix/test_tdd_enforcement.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "TDD compliance report: cortex-brain/health-reports/tdd-compliance-*.json"
      - "Exemption list: cortex-brain/config/tdd-exemptions.yaml"

  AC-GAPFIX-005:
    id: AC-GAPFIX-005
    criterion: "AC reorganization preserves test execution order stability"
    acceptance:
      - "**DEPENDENCY ORDERING:** AC criteria ordered by dependency graph, not just priority"
      - "**FOUNDATION FIRST:** Foundation/shared components validated BEFORE dependent components"
      - "**TEST ORDER MIRROR:** Test execution order mirrors AC dependency order"
      - "**STABILITY CHECK:** Gap injection validates test stability before proceeding"
      - "**ORPHAN PREVENTION:** No orphaned tests created by gap injection"
      - "**REGRESSION GUARD:** Earlier tests remain valid after later gaps injected"
      - "**EXECUTION MANIFEST:** Generate test-execution-manifest.yaml alongside remediation"
      - "Test: Inject gap affecting foundation → dependent tests not invalidated"
      - "Test: Execution order matches AC dependency topological sort"
    validation: automated
    test_file: "tests/gap_fix/test_ac_reorganization.py"
    status: PENDING
    blocking: true
    priority: P0_CRITICAL
    evidence:
      - "Execution manifest: cortex-brain/analysis/test-execution-manifest.yaml"
      - "Dependency graph: cortex-brain/analysis/ac-dependency-graph.yaml"

  AC-GAPFIX-006:
    id: AC-GAPFIX-006
    criterion: "Dependency graph validation before gap injection"
    acceptance:
      - "**DAG CONSTRUCTION:** Build DAG from AC depends_on relationships"
      - "**CYCLE DETECTION:** Detect and block circular dependencies before injection"
      - "**TOPOLOGICAL SORT:** Generate valid execution order via Kahn's algorithm"
      - "**LAYER IDENTIFICATION:** Group criteria into dependency layers (foundation → dependent)"
      - "**CROSS-REFERENCE:** Validate test_file references exist for all dependencies"
      - "**VISUALIZATION:** Generate dependency graph visualization (Mermaid format)"
      - "**BLOCKING:** Invalid dependency graph blocks Phase 11"
      - "Test: Create circular dependency → detected → injection blocked"
      - "Test: Valid DAG → topological sort → correct execution order"
    validation: automated
    test_file: "tests/gap_fix/test_dependency_graph.py"
    status: PENDING
    blocking: true
    priority: P0_CRITICAL
