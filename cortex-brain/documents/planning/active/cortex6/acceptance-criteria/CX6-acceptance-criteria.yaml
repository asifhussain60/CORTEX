# ==============================================================================
# Purpose: Learning library with per-repo segregation, MkDocs/fxdocs hosting,
#          and lazy-loaded tooling for minimal installation footprint
# Critical: Repo distinction maintained, documentation rendered via static site generators
# ==============================================================================

learning_library:
  category: knowledge_management
  priority: P1_HIGH
  description: "Learning library with repo segregation, MkDocs/fxdocs hosting, lazy-loaded tools"

  AC-LEARN-001:
    id: AC-LEARN-001
    criterion: "Learning library maintains strict repo distinction with MkDocs/fxdocs rendering"
    acceptance:
      - "**REPO SEGREGATION:** cortex-brain/learning-library/{repo_namespace}/ per repository"
      - "**NAMESPACE STRUCTURE:** Each repo has isolated docs/, guides/, patterns/, lessons/"
      - "**MKDOCS SUPPORT:** MkDocs configuration per repo (mkdocs.yml in repo namespace)"
      - "**FXDOCS SUPPORT:** fxdocs configuration supported as alternative (fxdocs.yaml)"
      - "**AUTO-DETECTION:** CORTEX detects preferred doc generator from config"
      - "**STATIC RENDERING:** Documentation renders to static HTML (no server required)"
      - "**CROSS-REPO INDEX:** Global index links to all repo-specific documentation"
      - "**SEARCH ISOLATION:** Search scoped to active repo (no cross-repo results)"
      - "**THEME CONSISTENCY:** Unified CORTEX theme across all rendered docs"
      - "**VERSIONED DOCS:** Documentation versioned alongside CORTEX version"
      - "Test: Create learning for Repo A → verify NOT visible in Repo B search"
      - "Test: Render docs → static HTML works offline (file:// protocol)"
    validation: automated
    test_file: "tests/learning/test_repo_segregation.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Learning library structure: cortex-brain/learning-library/"
      - "MkDocs config template: cortex-brain/templates/mkdocs-template.yml"

  AC-LEARN-002:
    id: AC-LEARN-002
    criterion: "Documentation tools (MkDocs/fxdocs) are lazy-loaded for minimal footprint"
    acceptance:
      - "**LAZY LOAD:** MkDocs/fxdocs packages NOT installed by default"
      - "**ON-DEMAND INSTALL:** First doc generation prompts: 'Install docs tools? [Y/n]'"
      - "**OPTIONAL GROUP:** pip install cortex[docs] for explicit installation"
      - "**GRACEFUL FALLBACK:** Without tools, raw markdown displayed with install prompt"
      - "**CACHED BUILDS:** Rendered HTML cached (rebuild only on source change)"
      - "**ZERO BASE IMPACT:** Base CORTEX install has NO doc generator dependencies"
      - "**TOOL DETECTION:** cortex docs status shows installed vs available tools"
      - "**VERSION PINNING:** Docs tools version pinned for reproducible builds"
      - "**PLUGIN LAZY-LOAD:** MkDocs plugins also lazy-loaded (material, search, etc.)"
      - "Test: Fresh install → no mkdocs in pip list"
      - "Test: cortex docs build → prompted to install → works after install"
    validation: automated
    test_file: "tests/deployment/test_lazy_docs_tools.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Optional deps: requirements-docs.txt"
      - "Lazy load log: cortex-brain/audit-logs/lazy-load-*.json"

  AC-LEARN-003:
    id: AC-LEARN-003
    criterion: "Learning library content isolated per-repo in CORTEX brain"
    acceptance:
      - "**CONTENT TYPES:** Patterns, anti-patterns, lessons-learned, best-practices per repo"
      - "**PATTERN LIBRARY:** cortex-brain/learning-library/{repo}/patterns/*.yaml"
      - "**ANTI-PATTERNS:** cortex-brain/learning-library/{repo}/anti-patterns/*.yaml"
      - "**LESSONS LEARNED:** cortex-brain/learning-library/{repo}/lessons/*.yaml"
      - "**BEST PRACTICES:** cortex-brain/learning-library/{repo}/best-practices/*.yaml"
      - "**INDEXING:** Each repo has searchable index (learning-index.json)"
      - "**TAGGING:** Content tagged for discoverability (language, framework, domain)"
