      - "Sample rendered: cortex-brain/learning-library/sample-rendered/"

  AC-LEARN-005:
    id: AC-LEARN-005
    criterion: "Learning library supports CORTEX-wide knowledge vs repo-specific knowledge"
    acceptance:
      - "**GLOBAL KNOWLEDGE:** cortex-brain/learning-library/global/ for CORTEX-wide patterns"
      - "**REPO KNOWLEDGE:** cortex-brain/learning-library/{repo}/ for repo-specific"
      - "**INHERITANCE:** Repos can inherit from global patterns (extend, don't duplicate)"
      - "**OVERRIDE:** Repo patterns can override global patterns (with audit trail)"
