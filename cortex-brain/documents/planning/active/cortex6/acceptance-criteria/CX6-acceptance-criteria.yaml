# ==============================================================================
# SECTION 2B: VERSION-AGNOSTIC DESIGN & UNIFIED TEST SUITE
# ==============================================================================
# Purpose: Eliminate version numbering inconsistencies across modules and establish
#          single universal test suite for ALL CORTEX functionalities
# Critical: Removes confusion from "v2", "v5", "v6" suffixes - branch determines version
# ==============================================================================

version_agnostic_design:
  category: architecture
  priority: P0_CRITICAL
  description: "Version-agnostic module design and unified test suite requirements"
  
  AC-ARCH-010:
    id: AC-ARCH-010
    criterion: "Version-agnostic design - NO version numbers in orchestrator/module names"
    acceptance:
      - "**FORBIDDEN:** Version suffixes in names (e.g., planning_v2, cleanup_v5, todo_v6)"
      - "**FORBIDDEN:** Version numbers in filenames (e.g., orchestrator_v3.py, utils_v2.py)"
      - "**FORBIDDEN:** Mixed version references in imports (from orchestrators_v2 import ...)"
      - "**REQUIRED:** Single canonical module name (e.g., planning_orchestrator.py, NOT planning_v5_orchestrator.py)"
      - "**BRANCH-DRIVEN:** Version tied to git branch only (CORTEX-5.5, CORTEX-6.0, etc.)"
      - "**MIGRATION:** Existing versioned modules renamed to version-agnostic form"
      - "**REGISTRY:** All modules registered in single manifest without version suffixes"
      - "**VALIDATION:** Static analysis detects version suffixes → blocking error"
      - "Test: Scan all Python files → 0 files with _v[0-9]+ pattern in name"
      - "Test: Scan all import statements → 0 versioned imports"
      - "Governance rule: CORE-VERSION-AGNOSTIC enforced"
