      - "Test: Add pattern to Repo A → search in Repo B → not found"
      - "Test: Learning content searchable by tag"
    validation: automated
    test_file: "tests/learning/test_content_isolation.py"
    status: PENDING
    blocking: true
    priority: P1_HIGH
    evidence:
      - "Learning schema: cortex-brain/schemas/learning-content-schema.yaml"
      - "Index example: cortex-brain/learning-library/example/learning-index.json"

  AC-LEARN-004:
    id: AC-LEARN-004
    criterion: "Documentation hosting via MkDocs Material or fxdocs with CORTEX branding"
    acceptance:
      - "**MKDOCS MATERIAL:** Primary recommendation for rich feature set"
      - "**FXDOCS FALLBACK:** Lightweight alternative for minimal setups"
      - "**CORTEX BRANDING:** Custom theme with CORTEX logo, colors, typography"
      - "**DARK MODE:** Dark mode support matching CORTEX UI"
      - "**RESPONSIVE:** Mobile-friendly responsive layout"
