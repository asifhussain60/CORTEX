# ==============================================================================
# AUDIT-001: AUDITLOGGER INFRASTRUCTURE MIGRATION
# ==============================================================================

audit_logger_migration:
  task_id: "AUDIT-001"
  priority: P0_CRITICAL
  blocking: true
  estimated_effort: "16-20 hours"
  investigation_findings: "85% code reuse from src/orchestrators/audit_logger.py"
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-MIGRATE-001: File Migration Success
  # --------------------------------------------------------------------------
  AC-AUDIT-MIGRATE-001:
    id: "AC-AUDIT-MIGRATE-001"
    description: "AuditLogger successfully migrated from orchestrators to infrastructure"
    category: "migration"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "Source file exists at src/orchestrators/audit_logger.py before migration"
        validation: "test -f src/orchestrators/audit_logger.py"
        
      - criteria: "File moved to src/infrastructure/audit_logger.py"
        validation: "test -f src/infrastructure/audit_logger.py && test ! -f src/orchestrators/audit_logger.py"
        
      - criteria: "EnterpriseAuditLogger class present in new location"
        validation: "grep -q 'class EnterpriseAuditLogger' src/infrastructure/audit_logger.py"
        
      - criteria: "All 7 AuditCategory values preserved (STATE_MANAGEMENT, EXECUTION, MIDDLEWARE, RESPONSE, PERFORMANCE, SECURITY, VALIDATION)"
        validation: "grep -A7 'class AuditCategory' src/infrastructure/audit_logger.py | grep -c '=' | test $(cat) -eq 7"
    
    test_evidence:
      test_file: "tests/unit/test_audit_logger_migration.py"
      test_functions:
        - "test_audit_logger_moved_to_infrastructure"
        - "test_enterprise_audit_logger_class_exists"
        - "test_seven_audit_categories_present"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-MIGRATE-001')"
        - "@pytest.mark.acceptance"
    
    audit_evidence:
      ac_id: "AC-AUDIT-MIGRATE-001"
      operations_logged:
        - "file_move: src/orchestrators/audit_logger.py → src/infrastructure/audit_logger.py"
        - "validation: EnterpriseAuditLogger class verification"
        - "validation: AuditCategory enum verification"
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-MIGRATE-002: Import Chain Updates
  # --------------------------------------------------------------------------
  AC-AUDIT-MIGRATE-002:
    id: "AC-AUDIT-MIGRATE-002"
    description: "All imports updated across codebase after AuditLogger migration"
    category: "migration"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "No references to 'from src.orchestrators.audit_logger' remain"
        validation: "! grep -r 'from src\\.orchestrators\\.audit_logger' src/ tests/"
        
      - criteria: "All imports updated to 'from src.infrastructure.audit_logger'"
        validation: "grep -r 'from src\\.infrastructure\\.audit_logger' src/ tests/ | wc -l | test $(cat) -ge 4"
        affected_files:
          - "src/orchestrators/master_orchestrator.py"
          - "src/orchestrators/planning/planning_orchestrator_v5.py"
          - "src/orchestrators/epic_review_orchestrator.py"
          - "tests/conftest.py"
        
      - criteria: "AuditLogger imports without errors"
        validation: "python3 -c 'from src.infrastructure.audit_logger import EnterpriseAuditLogger; print(\"✅ Import successful\")'"
    
    test_evidence:
      test_file: "tests/integration/test_audit_logger_imports.py"
      test_functions:
        - "test_no_old_imports_remain"
        - "test_new_imports_work"
        - "test_import_from_infrastructure"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-MIGRATE-002')"
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-ENHANCE-001: AC-ID Tagging Support
  # --------------------------------------------------------------------------
  AC-AUDIT-ENHANCE-001:
    id: "AC-AUDIT-ENHANCE-001"
    description: "AuditEntry dataclass enhanced with ac_id field for traceability"
    category: "enhancement"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "AuditEntry dataclass has ac_id field"
        validation: "grep -q 'ac_id.*Optional\\[str\\]' src/infrastructure/audit_logger.py"
        
      - criteria: "log() method accepts ac_id parameter"
        validation: "grep -A10 'def log' src/infrastructure/audit_logger.py | grep -q 'ac_id.*Optional'"
        
      - criteria: "search() method supports ac_id filtering"
        validation: "grep -A20 'def search' src/infrastructure/audit_logger.py | grep -q 'ac_id.*Optional'"
        
      - criteria: "Entries logged with ac_id are queryable"
        validation: "Test queries by ac_id return correct results"
    
    test_evidence:
      test_file: "tests/unit/test_audit_logger.py"
      test_functions:
        - "test_audit_entry_has_ac_id_field"
        - "test_log_with_ac_id"
        - "test_search_by_ac_id"
        - "test_ac_id_filtering_accuracy"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-ENHANCE-001')"
        - "@pytest.mark.ac_id('AC-F01-005')"  # Original AC for audit logger
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-SQLITE-001: SQLite Backend Implementation
  # --------------------------------------------------------------------------
  AC-AUDIT-SQLITE-001:
    id: "AC-AUDIT-SQLITE-001"
    description: "SQLite backend replaces JSONL file writes for audit persistence"
    category: "enhancement"
    priority: P0_CRITICAL
    blocking: false  # Can use JSONL temporarily
    
    acceptance_criteria:
      - criteria: "SQLite database created at cortex-brain/database/audit.db"
        validation: "test -f cortex-brain/database/audit.db"
        
      - criteria: "audit_logs table exists with all required columns"
        validation: "sqlite3 cortex-brain/database/audit.db '.schema audit_logs' | grep -q 'ac_id TEXT'"
        required_columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "timestamp TEXT NOT NULL"
          - "level TEXT NOT NULL"
          - "category TEXT NOT NULL"
          - "component TEXT NOT NULL"
          - "operation TEXT NOT NULL"
          - "message TEXT NOT NULL"
          - "context_json TEXT"
          - "metadata_json TEXT"
          - "correlation_id TEXT"
          - "ac_id TEXT"
          - "duration_ms REAL"
        
      - criteria: "Indexes created for ac_id, timestamp, category, correlation_id"
        validation: "sqlite3 cortex-brain/database/audit.db '.indexes audit_logs' | grep -c 'idx_audit' | test $(cat) -ge 4"
        
      - criteria: "Retention policy table exists with default values"
        validation: "sqlite3 cortex-brain/database/audit.db 'SELECT COUNT(*) FROM audit_retention_policy' | test $(cat) -eq 6"
        default_policies:
          - "ERROR: 90 days"
          - "CRITICAL: 90 days"
          - "INFO: 30 days"
          - "WARNING: 30 days"
          - "TRACE: 7 days"
          - "DEBUG: 7 days"
    
    test_evidence:
      test_file: "tests/unit/test_audit_sqlite_backend.py"
      test_functions:
        - "test_sqlite_database_created"
        - "test_audit_logs_table_schema"
        - "test_indexes_created"
        - "test_retention_policy_defaults"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-SQLITE-001')"
        - "@pytest.mark.ac_id('AC-AUDIT-003')"  # Per-repo SQLite isolation
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-BUFFER-001: Memory Buffer Implementation
  # --------------------------------------------------------------------------
  AC-AUDIT-BUFFER-001:
    id: "AC-AUDIT-BUFFER-001"
    description: "Memory buffer with configurable flush triggers implemented"
    category: "enhancement"
    priority: P0_CRITICAL
    blocking: false
    
    acceptance_criteria:
      - criteria: "AuditMemoryBuffer class exists"
        validation: "grep -q 'class AuditMemoryBuffer' src/infrastructure/audit_logger.py"
        
      - criteria: "Buffer has configurable max_size (default: 100 entries)"
        validation: "grep -q 'max_size.*int.*=.*100' src/infrastructure/audit_logger.py"
        
      - criteria: "Buffer has configurable max_age_seconds (default: 300)"
        validation: "grep -q 'max_age_seconds.*int.*=.*300' src/infrastructure/audit_logger.py"
        
      - criteria: "Flush triggers: size, time, CRITICAL/ERROR level, manual"
        validation: "Test all 4 flush triggers work correctly"
        flush_triggers:
          - "Buffer size >= max_size"
          - "Time since last flush >= max_age_seconds"
          - "CRITICAL or ERROR level entry (immediate flush)"
          - "Manual flush() call"
        
      - criteria: "Batch INSERT using executemany() for performance"
        validation: "grep -q 'executemany' src/infrastructure/audit_logger.py"
    
    test_evidence:
      test_file: "tests/unit/test_audit_memory_buffer.py"
      test_functions:
        - "test_buffer_initialization"
        - "test_flush_on_size_trigger"
        - "test_flush_on_time_trigger"
        - "test_flush_on_critical_error"
        - "test_manual_flush"
        - "test_batch_insert_performance"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-BUFFER-001')"
        - "@pytest.mark.ac_id('AC-AUDIT-002')"  # Memory buffer with configurable flush
  
  # --------------------------------------------------------------------------
  # AC-AUDIT-MCP-001: MCP Tools Implementation
  # --------------------------------------------------------------------------
  AC-AUDIT-MCP-001:
    id: "AC-AUDIT-MCP-001"
    description: "MCP tools for audit log querying, listing, exporting, and validation"
    category: "mcp_tools"
    priority: P0_CRITICAL
    blocking: false
    
    acceptance_criteria:
      - criteria: "AuditQueryTool class exists in src/mcp/audit_query.py"
        validation: "test -f src/mcp/audit_query.py && grep -q 'class AuditQueryTool' src/mcp/audit_query.py"
        
      - criteria: "mcp_audit_query supports filters: ac_id, category, level, date_range, correlation_id"
        validation: "Tool accepts all required filter parameters"
        
      - criteria: "mcp_audit_list lists logs by orchestrator and date_range"
        validation: "Tool returns logs grouped by orchestrator"
        
      - criteria: "mcp_audit_export supports formats: json, csv, yaml"
        validation: "Tool exports to all 3 formats"
        
      - criteria: "mcp_audit_validate returns dual validation (test + audit evidence)"
        validation: "Tool returns {test_evidence: bool, audit_evidence: bool, status: str}"
        
      - criteria: "All MCP tools registered in CapabilityRegistry"
        validation: "grep -q 'audit_query\\|audit_list\\|audit_export\\|audit_validate' src/mcp/capability_registry.py"
    
    test_evidence:
      test_file: "tests/mcp/test_audit_tools.py"
      test_functions:
        - "test_audit_query_tool"
        - "test_audit_list_tool"
        - "test_audit_export_tool"
        - "test_audit_validate_tool"
        - "test_mcp_tools_registered"
      markers:
        - "@pytest.mark.ac_id('AC-AUDIT-MCP-001')"
        - "@pytest.mark.ac_id('AC-AUDIT-004')"  # MCP tools

