# ==============================================================================
# TRACE-001: AC-ID TRACEABILITY SYSTEM
# ==============================================================================

ac_traceability_system:
  task_id: "TRACE-001"
  priority: P0_CRITICAL
  blocking: true
  estimated_effort: "8-10 hours"
  investigation_findings: "pytest marker pattern identified at conftest.py:130"
  
  # --------------------------------------------------------------------------
  # AC-TRACE-REGISTRY-001: Traceability Registry Implementation
  # --------------------------------------------------------------------------
  AC-TRACE-REGISTRY-001:
    id: "AC-TRACE-REGISTRY-001"
    description: "ACTraceabilityRegistry class implemented for bidirectional AC-test linkage"
    category: "traceability"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "ACTraceabilityRegistry class exists in src/infrastructure/ac_traceability.py"
        validation: "test -f src/infrastructure/ac_traceability.py && grep -q 'class ACTraceabilityRegistry' src/infrastructure/ac_traceability.py"
        
      - criteria: "register_ac_test(ac_id, test_file, test_function) method implemented"
        validation: "grep -q 'def register_ac_test' src/infrastructure/ac_traceability.py"
        
      - criteria: "query_ac_coverage(ac_id) returns tests + audit logs"
        validation: "Method returns {ac_id, tests[], test_count, audit_logs_count, last_validated, coverage_percentage}"
        
      - criteria: "generate_ac_coverage_matrix() generates YAML structure"
        validation: "Method outputs cortex-brain/registry/ac-test-coverage.yaml"
        
      - criteria: "detect_ac_gaps() identifies AC without tests"
        validation: "Method returns List[str] of AC IDs with zero test coverage"
        
      - criteria: "detect_test_orphans() identifies tests without AC linkage"
        validation: "Method returns List[str] of test file paths without markers"
    
    test_evidence:
      test_file: "tests/architecture/test_ac_traceability.py"
      test_functions:
        - "test_registry_initialization"
        - "test_register_ac_test"
        - "test_query_ac_coverage"
        - "test_generate_coverage_matrix"
        - "test_detect_ac_gaps"
        - "test_detect_test_orphans"
      markers:
        - "@pytest.mark.ac_id('AC-TRACE-REGISTRY-001')"
        - "@pytest.mark.ac_id('AC-ARCH-014')"  # Acceptance criteria test harnessing
  
  # --------------------------------------------------------------------------
  # AC-TRACE-PYTEST-001: Pytest Integration
  # --------------------------------------------------------------------------
  AC-TRACE-PYTEST-001:
    id: "AC-TRACE-PYTEST-001"
    description: "Pytest marker configuration and collection hooks implemented"
    category: "traceability"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "pytest_configure adds ac_id marker to tests/conftest.py"
        validation: "grep -q 'pytest_configure' tests/conftest.py && grep -q 'ac_id.*Mark test as validating' tests/conftest.py"
        
      - criteria: "pytest_configure adds acceptance marker"
        validation: "grep -q 'acceptance.*Mark test as acceptance test' tests/conftest.py"
        
      - criteria: "pytest_collection_modifyitems hook auto-registers markers"
        validation: "grep -q 'pytest_collection_modifyitems' tests/conftest.py"
        
      - criteria: "Markers visible in pytest --markers output"
        validation: "pytest --markers | grep -q 'ac_id'"
        
      - criteria: "Registry updated during test collection phase"
        validation: "ACTraceabilityRegistry.save() called in collection hook"
    
    test_evidence:
      test_file: "tests/architecture/test_pytest_integration.py"
      test_functions:
        - "test_markers_registered"
        - "test_collection_hook_executes"
        - "test_registry_updated_on_collection"
        - "test_markers_visible"
      markers:
        - "@pytest.mark.ac_id('AC-TRACE-PYTEST-001')"
  
  # --------------------------------------------------------------------------
  # AC-TRACE-COVERAGE-001: Coverage Matrix Generation
  # --------------------------------------------------------------------------
  AC-TRACE-COVERAGE-001:
    id: "AC-TRACE-COVERAGE-001"
    description: "AC coverage matrix generated with test-to-AC mapping"
    category: "traceability"
    priority: P0_CRITICAL
    blocking: false
    
    acceptance_criteria:
      - criteria: "Coverage matrix file generated at cortex-brain/registry/ac-test-coverage.yaml"
        validation: "test -f cortex-brain/registry/ac-test-coverage.yaml"
        
      - criteria: "Matrix structure includes: ac_id, description, tests[], coverage_percentage, last_validated, status"
        validation: "YAML contains all required fields for each AC"
        
      - criteria: "Existing 148 test files scanned for markers"
        validation: "Coverage matrix includes entries from existing tests"
        
      - criteria: "Gap detection identifies AC with zero test coverage"
        validation: "Matrix flags AC with coverage_percentage=0 as gap=true"
        
      - criteria: "Coverage percentage calculated correctly"
        validation: "(tests_with_markers / total_tests) * 100 = coverage_percentage"
    
    test_evidence:
      test_file: "tests/architecture/test_coverage_matrix.py"
      test_functions:
        - "test_matrix_file_generated"
        - "test_matrix_structure_valid"
        - "test_existing_tests_scanned"
        - "test_gap_detection"
        - "test_coverage_calculation"
      markers:
        - "@pytest.mark.ac_id('AC-TRACE-COVERAGE-001')"

