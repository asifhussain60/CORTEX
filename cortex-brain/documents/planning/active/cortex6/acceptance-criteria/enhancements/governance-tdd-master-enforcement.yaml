# ==============================================================================
# EXECUTIVE SUMMARY
# ==============================================================================

executive_summary:
  objective: "Enforce TDD-Master Orchestrator as mandatory gateway for ALL code implementation"
  
  problem_statement: |
    Previous architecture allowed GitHub Copilot to write implementation code directly,
    bypassing governance rules, test coverage requirements, and security patterns.
    This created technical debt and inconsistent code quality.
  
  solution: |
    TDD-Master Orchestrator becomes the ONLY path for code implementation (planned
    or unplanned). GitHub Copilot routes all implementation requests to TDD-Master,
    ensuring RED→GREEN→REFACTOR workflow, 100% test coverage, and governance compliance.
  
  impact:
    - "Zero untested code (all implementation requires failing tests first)"
    - "Consistent quality (SOLID/DRY/KISS enforced for all code)"
    - "Security by default (security tests mandatory in RED phase)"
    - "Flexible development (supports both planned and unplanned modes)"
    - "Audit trail (all development logged with AC validation)"

# ==============================================================================
# GOVERNANCE RULE: CORE-019
# ==============================================================================

core_rule_019:
  rule_id: CORE-019
  category: development_workflow
  severity: blocked
  name: "All Development Must Go Through TDD-Master Orchestrator"
  
  description: |
    ALL code implementation (planned or unplanned) MUST be executed through
    the TDD-Master Orchestrator. GitHub Copilot MUST NEVER write implementation
    code directly.
  
  enforcement:
    trigger: "user_request_contains_implementation_intent"
    action: "route_to_tdd_master_orchestrator"
    priority: 10  # Highest priority (blocks all direct implementation)
    middleware: "src.orchestrators.middleware.development_router.DevelopmentRouter"
  
  pattern_routing:
    route_to_tdd_master:
      - "implement *"
      - "build *"
      - "create *"
      - "add feature *"
      - "fix bug *"
      - "refactor *"
      - "write code *"
      - "develop *"
      - "code this *"
      - "make this *"
      - "quick implement *"
      - "tdd *"
      - "test and implement *"
    
    allow_direct_copilot:
      - "explain *"
      - "document *"
      - "analyze *"
      - "review *"
      - "find *"
      - "search *"
      - "README.md, YAML configs, JSON data files (non-code)"
  
  copilot_response_template: |
    I can't implement code directly. All development must go through the
    TDD-Master Orchestrator to ensure:
    
    ✅ Tests written first (RED phase)
    ✅ Implementation (GREEN phase)
    ✅ Refactoring (REFACTOR phase)
    ✅ 100% test coverage
    ✅ Governance compliance
    
    Would you like me to route this to TDD-Master Orchestrator?
    
    Options:
    1. **Unplanned Mode** (quick implementation): "tdd implement [feature]"
    2. **Planned Mode** (full planning first): "plan and implement [feature]"
  
  rationale:
    prevents:
      - "Untested code (code written without tests)"
      - "Governance violations (rules bypassed when Copilot writes directly)"
      - "Technical debt (quick fixes without refactoring)"
      - "Security vulnerabilities (no security test enforcement)"
      - "Inconsistent code quality (SOLID/DRY not enforced)"
    
    benefits:
      - "100% test coverage guarantee (RED phase enforced)"
      - "Consistent quality (all code passes same governance checks)"
      - "Security by default (security tests in RED phase)"
      - "Maintainable code (REFACTOR phase mandatory)"
      - "Audit trail (all development logged with AC validation)"
      - "Flexibility (both planned and unplanned modes supported)"

# ==============================================================================
# TDD-MASTER ORCHESTRATOR DUAL MODES
# ==============================================================================

tdd_master_modes:
  planned_mode:
    description: "Execute after Planning Orchestrator completion"
    trigger: "Planning Phase 4 completion with implementation_required=true"
    input_source: "tdd-context.json from Planning"
    workflow: "Planning → TDD-Master → TDD"
    use_cases:
      - "Large features requiring upfront planning"
      - "Complex systems with multiple dependencies"
      - "Features requiring architecture design"
      - "Epics with multiple user stories"
    
    advantages:
      - "Zero-ambiguity requirements (Planning gathers all details)"
      - "Complete AC validation (100% coverage guaranteed)"
      - "Toolkit analysis (8 tools provide context)"
      - "Dependency mapping (full dependency graph)"
      - "Risk assessment (Planning identifies risks)"
  
  unplanned_mode:
    description: "Execute independently without Planning (standalone)"
    trigger: "Direct user invocation via Master Orchestrator"
    input_source: "Interactive requirements gathering (lightweight)"
    workflow: "TDD-Master (unplanned) → TDD"
    use_cases:
      - "Quick bug fixes"
      - "Small feature additions"
      - "Refactoring existing code"
      - "Prototyping/experiments"
      - "Emergency hotfixes"
    
    advantages:
      - "Fast startup (no full Planning workflow)"
      - "Lightweight requirements (2-5 AC from user)"
      - "Toolkit analysis (4 tools: SemanticSearch, ASTParser, GitAnalyzer, PatternDetector)"
      - "Still enforces TDD (RED→GREEN→REFACTOR)"
      - "Governance compliant (Tier0-3 rules loaded)"
    
    lightweight_prompts:
      - "What feature/fix are you implementing?"
      - "What are the acceptance criteria? (2-5 AC)"
      - "Any dependencies or constraints?"
    
    toolkit_invocation:
      - SemanticSearch  # Find similar implementations
      - ASTParser       # Analyze existing code structure
      - GitAnalyzer     # Check recent changes
      - PatternDetector # Identify applicable patterns
    
    output:
      - file: "tracking/tdd-context-unplanned.json"
        schema: "schemas/tdd-context-schema.json"
        content:
          mode: "UNPLANNED"
          features: "array (from user input)"
          test_requirements: "array (AC from user)"
          domain_knowledge: "object (from toolkit analysis)"
          dependencies: "array (minimal, from user + toolkit)"
          governance_rules: "object (Tier0-3, always loaded)"

