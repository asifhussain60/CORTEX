# ==============================================================================
# CORTEX 6.0 AUTONOMOUS EXECUTION SAFEGUARDS - ACCEPTANCE CRITERIA
# ==============================================================================
# Purpose: Acceptance criteria for autonomous execution safeguards framework
#          that prevents blind execution and enables intelligent decision-making
# 
# Author: Asif Hussain  
# Version: 1.0.0
# Created: 2026-01-09
# Status: ACTIVE
#
# Source: CX6-comprehensive-remediation-plan.yaml v2.0.0 (Safeguards section)
# Dependencies: CX6-acceptance-criteria.yaml, CX6-foundation-tasks-AC.yaml
# ==============================================================================

metadata:
  document_type: autonomous_safeguards_acceptance_criteria
  version: '1.0.0'
  status: ACTIVE
  created: '2026-01-09'
  author: Asif Hussain
  parent_document: 'CX6-acceptance-criteria.yaml'
  plan_source: 'CX6-comprehensive-remediation-plan.yaml v2.0.0'
  
  scope: |
    Acceptance criteria for autonomous execution safeguards framework that enables:
    - Pre-execution intelligence checks before starting tasks
    - Decision matrices for skip/proceed/modify decisions
    - Rollback procedures for failed operations
    - Validation checkpoints throughout execution
    - Anti-pattern detection to prevent wasted effort
    
    These safeguards eliminate the delays observed in chat01.md where 30+ tool
    calls were wasted on navigation before starting implementation.

# ==============================================================================
# PRE-EXECUTION INTELLIGENCE CHECKS
# ==============================================================================

pre_execution_checks:
  category: "autonomous_safeguards"
  priority: P0_CRITICAL
  description: "Intelligence checks run before executing any task to prevent wasted effort"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-PRECHECK-001: Existence Checks
  # --------------------------------------------------------------------------
  AC-SAFE-PRECHECK-001:
    id: "AC-SAFE-PRECHECK-001"
    description: "Pre-execution existence checks validate required files/directories exist"
    category: "intelligence_check"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "PreExecutionChecker class exists in src/infrastructure/pre_execution_checker.py"
        validation: "test -f src/infrastructure/pre_execution_checker.py && grep -q 'class PreExecutionChecker' src/infrastructure/pre_execution_checker.py"
        
      - criteria: "check_file_exists(path) returns existence status + metadata"
        validation: "Method returns {exists: bool, path: str, size: int, modified: str}"
        
      - criteria: "check_directory_exists(path) returns directory status + file count"
        validation: "Method returns {exists: bool, path: str, file_count: int, subdirs: List[str]}"
        
      - criteria: "check_pattern_exists(pattern) searches codebase for code patterns"
        validation: "Method returns {found: bool, files: List[str], line_numbers: List[int]}"
        
      - criteria: "Existence checks integrated into all orchestrators"
        validation: "All orchestrators call pre_execution_checker before starting phases"
    
    test_evidence:
      test_file: "tests/infrastructure/test_pre_execution_checker.py"
      test_functions:
        - "test_checker_initialization"
        - "test_check_file_exists"
        - "test_check_directory_exists"
        - "test_check_pattern_exists"
        - "test_orchestrator_integration"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-PRECHECK-001')"
    
    audit_evidence:
      ac_id: "AC-SAFE-PRECHECK-001"
      operations_logged:
        - "pre_execution_check: file existence validation"
        - "pre_execution_check: directory existence validation"
        - "pre_execution_check: pattern search validation"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-PRECHECK-002: Completeness Checks
  # --------------------------------------------------------------------------
  AC-SAFE-PRECHECK-002:
    id: "AC-SAFE-PRECHECK-002"
    description: "Pre-execution completeness checks identify already-complete tasks"
    category: "intelligence_check"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "check_task_complete(task_id) queries completion evidence"
        validation: "Method searches for completion markers in git history, files, audit logs"
        
      - criteria: "Completeness check identifies GOV-001 as already complete"
        validation: "check_task_complete('GOV-001') returns {complete: true, evidence: 'core-rules.yaml from 2026-01-08'}"
        
      - criteria: "Completion evidence includes: file existence, git commits, audit logs, timestamps"
        validation: "Method returns structured evidence object with all sources"
        
      - criteria: "Decision matrix recommends SKIP for complete tasks"
        validation: "Complete tasks trigger skip_reason in decision matrix"
    
    test_evidence:
      test_file: "tests/infrastructure/test_pre_execution_checker.py"
      test_functions:
        - "test_check_task_complete"
        - "test_gov001_detected_as_complete"
        - "test_completion_evidence_structure"
        - "test_skip_recommendation"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-PRECHECK-002')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-PRECHECK-003: Dependency Checks
  # --------------------------------------------------------------------------
  AC-SAFE-PRECHECK-003:
    id: "AC-SAFE-PRECHECK-003"
    description: "Pre-execution dependency checks validate all prerequisites met"
    category: "intelligence_check"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "check_dependencies(task_id) validates all prerequisite tasks complete"
        validation: "Method returns {dependencies_met: bool, missing: List[str], blockers: List[str]}"
        
      - criteria: "HOUSE-001 dependency check validates AUDIT-001 and GOV-001 complete"
        validation: "check_dependencies('HOUSE-001') verifies foundation tasks"
        
      - criteria: "Blocked tasks return clear error message with missing dependencies"
        validation: "Method includes actionable guidance on which tasks to complete first"
        
      - criteria: "Decision matrix prevents execution if dependencies unmet"
        validation: "Unmet dependencies trigger BLOCK decision"
    
    test_evidence:
      test_file: "tests/infrastructure/test_pre_execution_checker.py"
      test_functions:
        - "test_check_dependencies"
        - "test_house001_dependency_validation"
        - "test_blocked_task_error_message"
        - "test_block_decision_on_unmet_deps"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-PRECHECK-003')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-PRECHECK-004: Reuse Analysis
  # --------------------------------------------------------------------------
  AC-SAFE-PRECHECK-004:
    id: "AC-SAFE-PRECHECK-004"
    description: "Pre-execution reuse analysis identifies existing code to leverage"
    category: "intelligence_check"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "analyze_code_reuse(task_id) searches for similar implementations"
        validation: "Method returns {reusable_files: List[str], similarity_score: float, reuse_strategy: str}"
        
      - criteria: "AUDIT-001 reuse analysis identifies src/orchestrators/audit_logger.py (85% reusable)"
        validation: "analyze_code_reuse('AUDIT-001') returns audit_logger.py with high similarity"
        
      - criteria: "Reuse strategy recommendations: MIGRATE, EXTEND, ADAPT, CREATE_NEW"
        validation: "Method suggests appropriate strategy based on similarity score"
        
      - criteria: "Decision matrix includes reuse analysis in implementation guidance"
        validation: "PROCEED decision includes reuse_files and reuse_strategy"
    
    test_evidence:
      test_file: "tests/infrastructure/test_pre_execution_checker.py"
      test_functions:
        - "test_analyze_code_reuse"
        - "test_audit001_reuse_detection"
        - "test_reuse_strategy_recommendations"
        - "test_decision_matrix_includes_reuse"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-PRECHECK-004')"

# ==============================================================================
# DECISION MATRIX
# ==============================================================================

decision_matrix:
  category: "autonomous_safeguards"
  priority: P0_CRITICAL
  description: "Decision matrix determines SKIP/PROCEED/MODIFY/BLOCK actions based on checks"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-DECISION-001: Decision Matrix Implementation
  # --------------------------------------------------------------------------
  AC-SAFE-DECISION-001:
    id: "AC-SAFE-DECISION-001"
    description: "Decision matrix implemented with 4 action types"
    category: "decision_logic"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "DecisionMatrix class exists in src/infrastructure/decision_matrix.py"
        validation: "test -f src/infrastructure/decision_matrix.py && grep -q 'class DecisionMatrix' src/infrastructure/decision_matrix.py"
        
      - criteria: "evaluate(task_id, checks) returns decision object"
        validation: "Method returns {action: str, reason: str, guidance: str, confidence: float}"
        
      - criteria: "4 action types supported: SKIP, PROCEED, MODIFY, BLOCK"
        validation: "DecisionAction enum has all 4 values"
        
      - criteria: "SKIP decision includes skip_reason and completion_evidence"
        validation: "SKIP returns evidence showing why task already complete"
        
      - criteria: "PROCEED decision includes implementation_guidance and reuse_files"
        validation: "PROCEED returns actionable steps and files to leverage"
        
      - criteria: "MODIFY decision includes modifications and adjusted_steps"
        validation: "MODIFY returns what to change and updated plan"
        
      - criteria: "BLOCK decision includes blockers and resolution_steps"
        validation: "BLOCK returns clear blockers and how to unblock"
    
    test_evidence:
      test_file: "tests/infrastructure/test_decision_matrix.py"
      test_functions:
        - "test_decision_matrix_initialization"
        - "test_evaluate_returns_decision"
        - "test_four_action_types"
        - "test_skip_decision_structure"
        - "test_proceed_decision_structure"
        - "test_modify_decision_structure"
        - "test_block_decision_structure"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-DECISION-001')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-DECISION-002: Decision Logic Rules
  # --------------------------------------------------------------------------
  AC-SAFE-DECISION-002:
    id: "AC-SAFE-DECISION-002"
    description: "Decision logic rules correctly evaluate check results"
    category: "decision_logic"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "SKIP rule: Task complete + evidence exists → SKIP"
        validation: "check_task_complete=True triggers SKIP decision"
        
      - criteria: "BLOCK rule: Dependencies unmet → BLOCK"
        validation: "check_dependencies=False triggers BLOCK decision"
        
      - criteria: "PROCEED rule: All checks pass + no reuse → PROCEED with CREATE_NEW"
        validation: "All checks OK + no existing code triggers PROCEED"
        
      - criteria: "PROCEED+REUSE rule: All checks pass + high reuse → PROCEED with MIGRATE/EXTEND"
        validation: "All checks OK + reusable code triggers PROCEED with reuse strategy"
        
      - criteria: "MODIFY rule: Partial completion detected → MODIFY with delta"
        validation: "Partial progress triggers MODIFY decision"
    
    test_evidence:
      test_file: "tests/infrastructure/test_decision_matrix.py"
      test_functions:
        - "test_skip_rule"
        - "test_block_rule"
        - "test_proceed_create_new_rule"
        - "test_proceed_reuse_rule"
        - "test_modify_rule"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-DECISION-002')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-DECISION-003: Orchestrator Integration
  # --------------------------------------------------------------------------
  AC-SAFE-DECISION-003:
    id: "AC-SAFE-DECISION-003"
    description: "All orchestrators integrate decision matrix before execution"
    category: "decision_logic"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "BaseOrchestratorV4_1 integrates decision matrix in execute() method"
        validation: "Base orchestrator calls decision_matrix.evaluate() before phase execution"
        
      - criteria: "SKIP action halts execution and logs skip reason"
        validation: "Orchestrator returns early with SKIPPED status"
        
      - criteria: "PROCEED action continues with implementation guidance"
        validation: "Orchestrator uses guidance to inform implementation steps"
        
      - criteria: "MODIFY action updates plan and continues"
        validation: "Orchestrator adjusts steps based on modifications"
        
      - criteria: "BLOCK action halts execution and reports blockers"
        validation: "Orchestrator returns early with BLOCKED status and resolution steps"
    
    test_evidence:
      test_file: "tests/orchestrators/test_decision_matrix_integration.py"
      test_functions:
        - "test_base_orchestrator_integration"
        - "test_skip_action_handling"
        - "test_proceed_action_handling"
        - "test_modify_action_handling"
        - "test_block_action_handling"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-DECISION-003')"

# ==============================================================================
# ROLLBACK PROCEDURES
# ==============================================================================

rollback_procedures:
  category: "autonomous_safeguards"
  priority: P0_CRITICAL
  description: "Rollback mechanisms to safely undo failed operations"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ROLLBACK-001: Rollback Manager Implementation
  # --------------------------------------------------------------------------
  AC-SAFE-ROLLBACK-001:
    id: "AC-SAFE-ROLLBACK-001"
    description: "RollbackManager class implemented for safe operation reversal"
    category: "rollback"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "RollbackManager class exists in src/infrastructure/rollback_manager.py"
        validation: "test -f src/infrastructure/rollback_manager.py && grep -q 'class RollbackManager' src/infrastructure/rollback_manager.py"
        
      - criteria: "register_operation(operation_id, rollback_fn) registers reversible operations"
        validation: "Method stores operation and rollback function"
        
      - criteria: "rollback(operation_id) executes rollback function"
        validation: "Method calls stored rollback_fn and logs result"
        
      - criteria: "rollback_all() reverses all operations in reverse order"
        validation: "Method executes rollbacks from most recent to oldest (LIFO)"
        
      - criteria: "Rollback history logged to audit system with ac_id"
        validation: "All rollback operations logged with category=ROLLBACK"
    
    test_evidence:
      test_file: "tests/infrastructure/test_rollback_manager.py"
      test_functions:
        - "test_rollback_manager_initialization"
        - "test_register_operation"
        - "test_rollback_single_operation"
        - "test_rollback_all_lifo_order"
        - "test_rollback_audit_logging"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ROLLBACK-001')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ROLLBACK-002: File Operation Rollbacks
  # --------------------------------------------------------------------------
  AC-SAFE-ROLLBACK-002:
    id: "AC-SAFE-ROLLBACK-002"
    description: "File operations (create, move, delete) are rollback-safe"
    category: "rollback"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "File creation rollback deletes created file"
        validation: "Rollback of file_create operation removes file"
        
      - criteria: "File move rollback restores original location"
        validation: "Rollback of file_move operation moves file back"
        
      - criteria: "File delete rollback restores from backup"
        validation: "Deleted files backed up before deletion, restored on rollback"
        
      - criteria: "Directory operations are rollback-safe"
        validation: "Directory creation/deletion/move operations can be rolled back"
        
      - criteria: "Rollback verification ensures operation fully reversed"
        validation: "Rollback checks post-state matches pre-state"
    
    test_evidence:
      test_file: "tests/infrastructure/test_rollback_file_operations.py"
      test_functions:
        - "test_rollback_file_creation"
        - "test_rollback_file_move"
        - "test_rollback_file_delete"
        - "test_rollback_directory_operations"
        - "test_rollback_verification"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ROLLBACK-002')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ROLLBACK-003: Database Operation Rollbacks
  # --------------------------------------------------------------------------
  AC-SAFE-ROLLBACK-003:
    id: "AC-SAFE-ROLLBACK-003"
    description: "Database operations use transactions with automatic rollback on failure"
    category: "rollback"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "All database operations wrapped in transactions"
        validation: "DB operations use 'with conn: ...' context manager"
        
      - criteria: "Failed operations automatically trigger ROLLBACK"
        validation: "Exception in transaction context triggers rollback"
        
      - criteria: "Successful operations COMMIT changes"
        validation: "Normal exit from transaction context commits"
        
      - criteria: "Multi-table operations are atomic"
        validation: "All tables updated or none updated (no partial commits)"
    
    test_evidence:
      test_file: "tests/infrastructure/test_rollback_database.py"
      test_functions:
        - "test_transaction_wrapper"
        - "test_automatic_rollback_on_error"
        - "test_commit_on_success"
        - "test_multi_table_atomicity"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ROLLBACK-003')"

# ==============================================================================
# VALIDATION CHECKPOINTS
# ==============================================================================

validation_checkpoints:
  category: "autonomous_safeguards"
  priority: P0_CRITICAL
  description: "Validation checkpoints throughout execution to detect failures early"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-VALIDATE-001: Checkpoint Manager Implementation
  # --------------------------------------------------------------------------
  AC-SAFE-VALIDATE-001:
    id: "AC-SAFE-VALIDATE-001"
    description: "CheckpointManager class for validation points throughout execution"
    category: "validation"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "CheckpointManager class exists in src/infrastructure/checkpoint_manager.py"
        validation: "test -f src/infrastructure/checkpoint_manager.py && grep -q 'class CheckpointManager' src/infrastructure/checkpoint_manager.py"
        
      - criteria: "register_checkpoint(name, validation_fn) registers validation points"
        validation: "Method stores checkpoint and validation function"
        
      - criteria: "validate_checkpoint(name) executes validation and returns status"
        validation: "Method returns {passed: bool, checkpoint: str, errors: List[str]}"
        
      - criteria: "Failed checkpoints halt execution and trigger rollback"
        validation: "Validation failure returns early and calls rollback_manager"
        
      - criteria: "Checkpoint results logged to audit system"
        validation: "All checkpoints logged with category=VALIDATION"
    
    test_evidence:
      test_file: "tests/infrastructure/test_checkpoint_manager.py"
      test_functions:
        - "test_checkpoint_manager_initialization"
        - "test_register_checkpoint"
        - "test_validate_checkpoint_success"
        - "test_validate_checkpoint_failure"
        - "test_checkpoint_audit_logging"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-VALIDATE-001')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-VALIDATE-002: Post-Migration Validation
  # --------------------------------------------------------------------------
  AC-SAFE-VALIDATE-002:
    id: "AC-SAFE-VALIDATE-002"
    description: "Post-migration validation ensures file moves and import updates correct"
    category: "validation"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "File existence validation after migration"
        validation: "New file exists, old file removed"
        
      - criteria: "Import chain validation after migration"
        validation: "All imports updated, no broken references"
        
      - criteria: "Syntax validation after migration"
        validation: "python3 -m py_compile verifies no syntax errors"
        
      - criteria: "Import test validation after migration"
        validation: "python3 -c 'import module' succeeds"
        
      - criteria: "Failed validation triggers automatic rollback"
        validation: "Validation failure restores original file locations"
    
    test_evidence:
      test_file: "tests/infrastructure/test_post_migration_validation.py"
      test_functions:
        - "test_file_existence_validation"
        - "test_import_chain_validation"
        - "test_syntax_validation"
        - "test_import_test_validation"
        - "test_automatic_rollback_on_failure"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-VALIDATE-002')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-VALIDATE-003: Continuous Validation
  # --------------------------------------------------------------------------
  AC-SAFE-VALIDATE-003:
    id: "AC-SAFE-VALIDATE-003"
    description: "Continuous validation runs after each phase to detect regressions"
    category: "validation"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "Phase completion triggers validation checkpoint"
        validation: "Orchestrator validates after each phase"
        
      - criteria: "Test suite runs after implementation phases"
        validation: "pytest executes relevant tests after code changes"
        
      - criteria: "Audit log analysis detects error spikes"
        validation: "Housekeeping analyzer flags increased error rates"
        
      - criteria: "Regression detected halts pipeline"
        validation: "Failed validation prevents next phase execution"
    
    test_evidence:
      test_file: "tests/infrastructure/test_continuous_validation.py"
      test_functions:
        - "test_phase_completion_checkpoint"
        - "test_test_suite_execution"
        - "test_audit_log_analysis"
        - "test_regression_detection"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-VALIDATE-003')"

# ==============================================================================
# ANTI-PATTERN DETECTION
# ==============================================================================

anti_pattern_detection:
  category: "autonomous_safeguards"
  priority: P0_CRITICAL
  description: "Detect and prevent common anti-patterns that waste time"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ANTIPATTERN-001: Navigation Anti-Pattern Detection
  # --------------------------------------------------------------------------
  AC-SAFE-ANTIPATTERN-001:
    id: "AC-SAFE-ANTIPATTERN-001"
    description: "Detect excessive navigation/research before implementation (chat01.md issue)"
    category: "anti_pattern"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "AntiPatternDetector class exists in src/infrastructure/anti_pattern_detector.py"
        validation: "test -f src/infrastructure/anti_pattern_detector.py && grep -q 'class AntiPatternDetector' src/infrastructure/anti_pattern_detector.py"
        
      - criteria: "detect_excessive_navigation() counts tool calls before implementation"
        validation: "Method returns {navigation_calls: int, threshold: int, exceeded: bool}"
        
      - criteria: "Navigation threshold: ≤5 tool calls before first implementation"
        validation: "More than 5 navigation calls triggers warning"
        
      - criteria: "Alternative approach suggested when threshold exceeded"
        validation: "Warning includes guidance: 'Front-load research into investigation report'"
        
      - criteria: "Anti-pattern detection logged to audit system"
        validation: "Detected patterns logged with category=ANTI_PATTERN"
    
    test_evidence:
      test_file: "tests/infrastructure/test_anti_pattern_detector.py"
      test_functions:
        - "test_anti_pattern_detector_initialization"
        - "test_detect_excessive_navigation"
        - "test_navigation_threshold"
        - "test_alternative_approach_guidance"
        - "test_anti_pattern_audit_logging"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ANTIPATTERN-001')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ANTIPATTERN-002: Blind Execution Anti-Pattern Detection
  # --------------------------------------------------------------------------
  AC-SAFE-ANTIPATTERN-002:
    id: "AC-SAFE-ANTIPATTERN-002"
    description: "Detect execution without pre-checks (blindly following plan)"
    category: "anti_pattern"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "detect_blind_execution() checks if pre-execution checks were run"
        validation: "Method verifies PreExecutionChecker called before implementation"
        
      - criteria: "Execution without checks triggers error"
        validation: "Missing pre-checks prevents execution start"
        
      - criteria: "Enforcement integrated into BaseOrchestratorV4_1"
        validation: "Base orchestrator requires pre-checks before phase execution"
    
    test_evidence:
      test_file: "tests/infrastructure/test_anti_pattern_detector.py"
      test_functions:
        - "test_detect_blind_execution"
        - "test_execution_blocked_without_checks"
        - "test_base_orchestrator_enforcement"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ANTIPATTERN-002')"
  
  # --------------------------------------------------------------------------
  # AC-SAFE-ANTIPATTERN-003: Duplicate Work Anti-Pattern Detection
  # --------------------------------------------------------------------------
  AC-SAFE-ANTIPATTERN-003:
    id: "AC-SAFE-ANTIPATTERN-003"
    description: "Detect attempts to recreate existing functionality"
    category: "anti_pattern"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "detect_duplicate_work() searches for similar implementations"
        validation: "Method uses semantic search to find existing code"
        
      - criteria: "High similarity triggers reuse recommendation"
        validation: "Similarity >85% suggests MIGRATE or EXTEND strategy"
        
      - criteria: "Low similarity allows CREATE_NEW"
        validation: "Similarity <50% allows new implementation"
        
      - criteria: "Duplicate detection integrated into decision matrix"
        validation: "Decision matrix considers duplicate analysis"
    
    test_evidence:
      test_file: "tests/infrastructure/test_anti_pattern_detector.py"
      test_functions:
        - "test_detect_duplicate_work"
        - "test_high_similarity_reuse_recommendation"
        - "test_low_similarity_create_new"
        - "test_decision_matrix_integration"
      markers:
        - "@pytest.mark.ac_id('AC-SAFE-ANTIPATTERN-003')"

# ==============================================================================
# INTEGRATION WITH FOUNDATION TASKS
# ==============================================================================

foundation_integration:
  category: "integration"
  priority: P0_CRITICAL
  
  # --------------------------------------------------------------------------
  # AC-SAFE-INTEGRATION-001: Safeguards Applied to Foundation Tasks
  # --------------------------------------------------------------------------
  AC-SAFE-INTEGRATION-001:
    id: "AC-SAFE-INTEGRATION-001"
    description: "Autonomous safeguards applied to all foundation tasks (AUDIT-001, TRACE-001, HOUSE-001)"
    category: "integration"
    priority: P0_CRITICAL
    blocking: true
    
    acceptance_criteria:
      - criteria: "AUDIT-001 pre-execution checks run before migration"
        validation: "Audit logger migration runs all 4 pre-checks (existence, completeness, dependencies, reuse)"
        
      - criteria: "GOV-001 detected as complete via completeness check"
        validation: "Completeness check finds core-rules.yaml and skips GOV-001"
        
