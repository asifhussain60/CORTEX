# ==============================================================================
# USAGE COMMANDS
# ==============================================================================

usage_commands:
  search_gap_detection:
    command: '/CORTEX gap-fix'
    description: 'Run search pipeline (14 phases)'
    
  align_remediation:
    command: '/CORTEX align'
    description: 'Run alignment/remediation planning'
    
  epic_review:
    command: '/CORTEX epic review'
    description: 'Health check and progress analysis'

# ==============================================================================
# VALIDATION RULES
# ==============================================================================

validation_rules:
  pre_execution:
    - check: 'CX6-acceptance-criteria.yaml exists at canonical location'
      required: true
      
    - check: 'No CX6-* files exist outside canonical location'
      required: true
      
    - check: 'Archive old CX6-requirements.yaml before regenerating'
      required: true
      
  file_naming:
    prefix: 'CX6-'
    pattern: '^CX6-[a-z-]+\.yaml$'
    exceptions:
      - 'snowball-strategy.yaml'
      - 'plan-viewer-dashboard-requirements.yaml'
      - '00-CORTEX6-MASTER-SOURCE-OF-TRUTH.yaml'
      
  archival:
    pattern: '{original-name}-{YYYY-MM-DD}.yaml'
    location: 'archive/'
    before_action: 'regenerate'

# ==============================================================================
# INTEGRATION POINTS
# ==============================================================================

integration_points:
  gap_fix_orchestrator:
    file: '.github/prompts/cortex-gap-fix.prompt.md'
    validates:
      - 'File locations before execution'
      - 'Archives old files before regenerating'
      - 'Rejects operations on files in wrong location'
      
  master_orchestrator:
    file: 'src/orchestrators/master_orchestrator.py'
    responsibilities:
      - 'Route CORTEX 6 operations to correct location'
      - 'Enforce canonical location rules'
      
  copilot_instructions:
    file: '.github/copilot-instructions.md'
    responsibilities:
      - 'Guide GitHub Copilot to correct location'
      - 'Prevent file creation in wrong locations'
      
  brain_protection:
    file: 'cortex-brain/brain-protection-rules.yaml'
    rule: 'PLAN_FILE_ORGANIZATION'
    enforcement: 'SKULL-level protection'

# ==============================================================================
# END OF GOVERNANCE
# ==============================================================================
