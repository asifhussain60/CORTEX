# ==============================================================================
# CORTEX 6 FILE LOCATION GOVERNANCE (MANDATORY)
# ==============================================================================

governance:
  scope:
    description: 'These rules apply ONLY to CORTEX 6.0 planning/acceptance files'
    does_not_affect:
      - 'Global CORTEX architecture (src/, cortex-brain/, etc.)'
      - 'User repository operations'
      - 'Other planning initiatives (future CORTEX versions)'
      - 'General CORTEX operations and orchestrators'
  
  skull_rule_enforcement: true
  enforcement_rule: 'PLAN_FILE_ORGANIZATION'
  
  required_location:
    path: 'cortex-brain/documents/planning/active/cortex6/acceptance-criteria/'
    mandatory: true
    description: 'ALL CORTEX 6 planning files MUST be created here'
  
  # --------------------------------------------------------------------------
  # FORBIDDEN ACTIONS (CORTEX 6 Planning ONLY)
  # --------------------------------------------------------------------------
  
  forbidden_actions:
    - action: 'Creating CX6-* files outside canonical location'
      severity: 'CRITICAL'
      enforcement: 'Pre-commit validation + orchestrator rejection'
      
    - action: 'Creating remediation-plan*.yaml anywhere else (for CORTEX 6 plan)'
      severity: 'CRITICAL'
      enforcement: 'Pre-commit validation + orchestrator rejection'
      
    - action: 'Creating cortex-ac*.yaml files (renamed to CX6-acceptance-criteria.yaml)'
      severity: 'CRITICAL'
      enforcement: 'Pre-commit validation + orchestrator rejection'
      
    - action: 'Creating CORTEX 6 acceptance criteria in .asif/, cortex6-fixes/, or root'
      severity: 'CRITICAL'
      enforcement: 'Pre-commit validation + orchestrator rejection'
      
    - action: 'Creating CORTEX 6 TODO files outside proper organization'
      severity: 'HIGH'
      enforcement: 'Orchestrator rejection'
      note: 'todos/ folder deleted - all AC captured in CX6-acceptance-criteria.yaml v14.0.0'
      
    - action: 'Verbose responses during plan execution (code snippets, excessive detail)'
      severity: 'HIGH'
      enforcement: 'Master Orchestrator response template control'
      note: 'Plan execution requires concise executive summaries only'
      
    - action: 'Flushing CORTEX core knowledge (governance, build info, CORTEX best practices)'
      severity: 'CRITICAL'
      enforcement: 'Memory flush safety barriers + SQLite database protection'
      note: 'Business domain knowledge can be reset, but CORTEX infrastructure knowledge is IMMUTABLE'
  
  # --------------------------------------------------------------------------
  # ALLOWED LOCATIONS
  # --------------------------------------------------------------------------
  
  allowed_locations:
    cortex6_root: 'cortex-brain/documents/planning/active/cortex6/'
    
    structure:
      - path: 'acceptance-criteria/'
        description: 'AC, Requirements, Strategy (ONLY LOCATION)'
        mandatory_files:
          - 'CX6-acceptance-criteria.yaml'
          - 'CX6-requirements.yaml'
          - 'snowball-strategy.yaml'
        subfolders:
          - 'archive/'
          
      - path: '00-CORTEX6-MASTER-SOURCE-OF-TRUTH.yaml'
        description: 'Master spec (cortex6 root level)'
  
  # --------------------------------------------------------------------------
  # ENFORCEMENT MECHANISMS
  # --------------------------------------------------------------------------
  
  enforcement_mechanisms:
    - mechanism: 'Pre-commit validation'
      description: 'Reject commits with files in wrong location'
      status: 'PLANNED'
      
    - mechanism: 'GitHub Copilot instruction'
      file: '.github/copilot-instructions.md'
      description: 'Routing enforcement'
      status: 'ACTIVE'
      
    - mechanism: 'SKULL Rule'
      rule: 'PLAN_FILE_ORGANIZATION'
      file: 'cortex-brain/brain-protection-rules.yaml'
      description: 'Brain protection layer'
      status: 'ACTIVE'
      
    - mechanism: 'Gap-Fix Orchestrator'
      file: '.github/prompts/cortex-gap-fix.prompt.md'
      description: 'Pre-execution validation + file location checks'
      status: 'ACTIVE'
      
    - mechanism: 'Response Template Control'
      description: 'Master Orchestrator enforces concise executive summaries'
      status: 'ACTIVE'
      rule: 'CONCISE_PLAN_RESPONSES'
      
  # --------------------------------------------------------------------------
  # RESPONSE TEMPLATE GOVERNANCE (Plan Execution)
  # --------------------------------------------------------------------------
  
  response_template_rules:
    description: 'Master Orchestrator controls response verbosity during plan execution'
    
    plan_execution_mode:
      default_template: 'INSTANT'
      max_lines: 40
      forbidden:
        - 'Code snippets or implementation details'
        - 'Verbose file content dumps'
        - 'Step-by-step narration'
        - 'Excessive progress updates (use phase-level only)'
      
      required:
        - 'Executive summary (3-5 lines)'
        - 'Phase completion status'
        - 'Key deliverables created'
        - 'Next action (if applicable)'
        
    verbosity_control:
      user_override: true
      override_keywords:
        - 'verbose'
        - 'detailed'
        - 'explain'
        - 'show code'
      default_behavior: 'concise'
      
    template_selection:
      planning: 'INSTANT (concise)'
      gap_fix: 'FOCUSED (phase summaries)'
      epic_review: 'STRUCTURED (metrics + summary)'
      investigation: 'COMPREHENSIVE (full analysis)'
      
    enforcement:
      layer: 'Master Orchestrator'
      file: 'src/orchestrators/master_orchestrator.py'
      method: 'select_response_template(request_type, user_preferences)'

# ==============================================================================
# MEMORY FLUSHING GOVERNANCE (CRITICAL)
# ==============================================================================

memory_flushing:
  description: 'Selective memory reset for business domain knowledge while protecting CORTEX core'
  criticality: 'CRITICAL'
  
  # --------------------------------------------------------------------------
  # PROTECTED TIERS (IMMUTABLE - NEVER FLUSH)
  # --------------------------------------------------------------------------
  
  protected_tiers:
    - tier: 'tier0'
      path: 'cortex-brain/tier0/'
      description: 'CORTEX governance rules (SKULL rules, core rules)'
      immutable: true
      reason: 'Core governance - flushing would break CORTEX integrity'
      protection_level: 'ABSOLUTE'
      
    - tier: 'CORTEX Build Database'
      path: 'cortex-brain/database/*.db'
      description: 'SQLite databases (build info, audit logs, metrics)'
      immutable: true
      reason: 'Historical build data - required for continuity'
      protection_level: 'ABSOLUTE'
      
    - tier: 'CORTEX Best Practices'
      path: 'cortex-brain/tier0/best-practices/'
      description: 'TDD, security, architectural patterns'
      immutable: true
      reason: 'Engineering excellence foundation'
      protection_level: 'ABSOLUTE'
      
    - tier: 'CORTEX Infrastructure'
      path: 'src/'
      description: 'Python source code, orchestrators, agents'
      immutable: true
      reason: 'Application logic - flushing would destroy CORTEX'
      protection_level: 'ABSOLUTE'
      
    - tier: 'tier1_cortex_plans'
      path: 'cortex-brain/tier1/active-plans/cortex*'
      description: 'CORTEX own build plans and progress'
      immutable: true
      reason: 'Self-build tracking - required for CORTEX development'
      protection_level: 'ABSOLUTE'
  
  # --------------------------------------------------------------------------
  # FLUSHABLE TIERS (Business Domain Knowledge)
  # --------------------------------------------------------------------------
  
  flushable_tiers:
    - tier: 'tier2_business_domain'
      path: 'cortex-brain/tier2/domain-knowledge/'
      description: 'User business requirements, domain models'
      flushable: true
      flush_scope: 'Business domain knowledge only'
      protection: 'Exclude CORTEX-specific domain knowledge'
      
    - tier: 'tier2_company_practices'
      path: 'cortex-brain/tier2/company-practices/'
      description: 'Company-specific workflows, conventions'
      flushable: true
      flush_scope: 'Company conventions and practices'
      protection: 'Exclude CORTEX development practices'
      
    - tier: 'tier1_user_plans'
      path: 'cortex-brain/tier1/active-plans/*'
      description: 'User project plans (non-CORTEX)'
      flushable: true
      flush_scope: 'User-created plans only'
      protection: 'Exclude cortex* prefixed plans'
      
    - tier: 'tier3_user_repos'
      path: 'cortex-brain/tier3/user-repos/'
      description: 'User repository context (non-CORTEX)'
      flushable: true
      flush_scope: 'User repo analysis and context'
      protection: 'Exclude CORTEX repo context'
  
  # --------------------------------------------------------------------------
  # FLUSH SAFETY BARRIERS
  # --------------------------------------------------------------------------
  
  safety_barriers:
    pre_flush_validation:
      - check: 'Confirm target tier is in flushable_tiers list'
        enforcement: 'Reject flush if tier is protected'
        
      - check: 'Pattern match against protected paths'
        enforcement: 'Block flush if path matches protected pattern (cortex*, src/, tier0/)'
        
      - check: 'SQLite database file detection'
        enforcement: 'Abort flush if any .db files in flush scope'
        
      - check: 'User confirmation (double-check for destructive operation)'
        enforcement: 'Require explicit "yes, flush business domain" confirmation'
        
    during_flush:
      - mechanism: 'Path whitelist validation'
        description: 'Only delete files in explicitly allowed paths'
        
      - mechanism: 'Extension blacklist'
        description: 'Never delete .db, .sql, governance.yaml, brain-protection-rules.yaml'
        
      - mechanism: 'Backup before flush'
        description: 'Auto-backup flushed content to cortex-brain/archives/flush-backup-{timestamp}/'
        
    post_flush_validation:
      - check: 'Verify protected tiers untouched'
        enforcement: 'File count check on tier0/, src/, database/'
        
      - check: 'Verify SQLite databases intact'
        enforcement: 'Database integrity check (SELECT 1 FROM sqlite_master)'
        
      - check: 'Verify governance rules unchanged'
        enforcement: 'Hash check on brain-protection-rules.yaml'
  
  # --------------------------------------------------------------------------
  # FLUSH COMMANDS
  # --------------------------------------------------------------------------
  
  flush_commands:
    business_domain:
      command: '/CORTEX flush business-domain'
      scope: 'tier2/domain-knowledge/ + tier2/company-practices/'
      confirmation_required: true
      backup_created: true
      
    user_plans:
      command: '/CORTEX flush user-plans'
      scope: 'tier1/active-plans/* (excluding cortex*)'
      confirmation_required: true
      backup_created: true
      
    user_repos:
      command: '/CORTEX flush user-repos'
      scope: 'tier3/user-repos/'
      confirmation_required: true
      backup_created: true
      
    all_business:
      command: '/CORTEX flush all-business'
      scope: 'All flushable tiers combined'
      confirmation_required: true
      confirmation_phrase: 'yes, flush all business knowledge'
      backup_created: true
  
  # --------------------------------------------------------------------------
  # ENFORCEMENT
  # --------------------------------------------------------------------------
  
  enforcement:
    orchestrator: 'Memory Flush Orchestrator'
    file: 'src/orchestrators/memory_flush_orchestrator.py'
    validation_file: 'src/orchestrators/flush_safety_validator.py'
    
    validation_steps:
      1: 'Load protected_tiers list from CX6-GOVERNANCE.yaml'
      2: 'Validate flush target against protected paths'
      3: 'Pattern match for CORTEX-specific files (.db, governance, tier0/)'
      4: 'Create backup in archives/flush-backup-{timestamp}/'
      5: 'Execute flush with path whitelist'
      6: 'Post-flush integrity check'
      7: 'Audit log flush operation with scope and results'
      
    audit_logging:
      required: true
      log_level: 'WARNING'
      fields:
        - 'flush_scope (tier and path)'
        - 'files_deleted_count'
        - 'backup_location'
        - 'protected_tiers_verified (boolean)'
        - 'database_integrity_verified (boolean)'
        - 'user_confirmation_timestamp'

