# ==============================================================================
# PHASE 1: BACKEND API INFRASTRUCTURE (4-5 hours)
# ==============================================================================

phase_1:
  name: "Backend API Infrastructure"
  priority: "P0_CRITICAL"
  estimated_hours: "4-5"
  dependencies: []
  
  deliverables:
    - "FastAPI server (src/dashboard/api.py)"
    - "WebSocket endpoint (/ws)"
    - "REST API endpoints (5)"
    - "File watcher for auto-refresh"
    - "Static file serving"
    
  tasks:
    task_1_1:
      name: "FastAPI Server Setup"
      estimated_hours: "1.0"
      description: "Create FastAPI application with CORS, static files, and basic routing"
      
      files_to_create:
        - path: "src/dashboard/__init__.py"
          content: "Dashboard module initialization"
        - path: "src/dashboard/api.py"
          content: "FastAPI application with routes"
        - path: "src/dashboard/config.py"
          content: "Dashboard configuration (port, paths, refresh intervals)"
      
      endpoints:
        - "GET / → Serve index.html"
        - "GET /api/plan → Get current plan details"
        - "GET /api/progress → Get progress tracker data"
        - "GET /api/audit-logs → Get recent audit logs (paginated)"
        - "GET /api/tests → Get test coverage metrics"
        - "WS /ws → WebSocket for live updates"
      
      implementation:
        imports: |
          from fastapi import FastAPI, WebSocket, WebSocketDisconnect
          from fastapi.staticfiles import StaticFiles
          from fastapi.responses import HTMLResponse, JSONResponse
          from fastapi.middleware.cors import CORSMiddleware
          import json
          from pathlib import Path
          from typing import List, Dict, Any
          import asyncio
        
        app_initialization: |
          app = FastAPI(title="CORTEX Plan Viewer", version="1.0.0")
          
          # CORS middleware
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )
          
          # Mount static files
          dashboard_path = Path(__file__).parent / "static"
          app.mount("/static", StaticFiles(directory=str(dashboard_path)), name="static")
      
      validation:
        - "Server starts on localhost:8000"
        - "All endpoints return 200 OK"
        - "CORS headers present"
        - "Static files accessible"
    
    task_1_2:
      name: "Data Loaders Implementation"
      estimated_hours: "1.5"
      description: "Create data loader functions for plan, progress, audit logs, tests"
      
      files_to_create:
        - path: "src/dashboard/loaders.py"
          content: "Data loading functions"
      
      functions:
        load_plan_data:
          signature: "def load_plan_data(plan_path: Path) -> Dict[str, Any]"
          returns: "Plan YAML parsed to dict"
          
        load_progress_data:
          signature: "def load_progress_data(tracker_path: Path) -> Dict[str, Any]"
          returns: "Progress tracker JSON"
          
        load_audit_logs:
          signature: "def load_audit_logs(audit_dir: Path, limit: int = 100, offset: int = 0) -> List[Dict]"
          returns: "Paginated audit log entries"
          
        load_test_metrics:
          signature: "def load_test_metrics(tests_dir: Path) -> Dict[str, Any]"
          returns: "Test coverage metrics (total tests, AC coverage, pass/fail)"
      
      validation:
        - "Loads CORTEX6 plan YAML successfully"
        - "Parses progress-tracker.json"
        - "Reads JSONL audit logs (handles 10K+ entries)"
        - "Calculates test metrics (pytest markers)"
    
    task_1_3:
      name: "WebSocket Live Updates"
      estimated_hours: "1.5"
      description: "Implement WebSocket for real-time progress updates"
      
      implementation:
        connection_manager: |
          class ConnectionManager:
              def __init__(self):
                  self.active_connections: List[WebSocket] = []
              
              async def connect(self, websocket: WebSocket):
                  await websocket.accept()
                  self.active_connections.append(websocket)
              
              def disconnect(self, websocket: WebSocket):
                  self.active_connections.remove(websocket)
              
              async def broadcast(self, message: dict):
                  for connection in self.active_connections:
                      try:
                          await connection.send_json(message)
                      except Exception:
                          pass
          
          manager = ConnectionManager()
        
        websocket_endpoint: |
          @app.websocket("/ws")
          async def websocket_endpoint(websocket: WebSocket):
              await manager.connect(websocket)
              try:
                  while True:
                      await websocket.receive_text()  # Keep connection alive
              except WebSocketDisconnect:
                  manager.disconnect(websocket)
        
        file_watcher: |
          async def watch_files():
              """Watch progress-tracker.json and audit logs for changes"""
              last_modified = {}
              
              while True:
                  files_to_watch = [
                      Path("cortex-brain/documents/planning/active/cortex6/tracking/progress-tracker.json"),
                      Path("cortex-brain/audit-logs/")
                  ]
                  
                  for file_path in files_to_watch:
                      if file_path.exists():
                          mtime = file_path.stat().st_mtime
                          if file_path not in last_modified or last_modified[file_path] != mtime:
                              last_modified[file_path] = mtime
                              await manager.broadcast({
                                  "type": "file_changed",
                                  "file": str(file_path),
                                  "timestamp": mtime
                              })
                  
                  await asyncio.sleep(1)  # Check every second
      
      validation:
        - "WebSocket connection established"
        - "File changes trigger broadcast within 1 second"
        - "Multiple clients supported"
        - "Graceful disconnect handling"
    
    task_1_4:
      name: "REST API Endpoints"
      estimated_hours: "1.0"
      description: "Implement 5 REST API endpoints for data retrieval"
      
      endpoints_implementation:
        get_plan:
          route: "/api/plan"
          method: "GET"
          response: "Plan details (phases, tasks, metadata)"
          
        get_progress:
          route: "/api/progress"
          method: "GET"
          response: "Progress tracker data (completion %, phase status)"
          
        get_audit_logs:
          route: "/api/audit-logs"
          method: "GET"
          params: "?limit=100&offset=0&category=all"
          response: "Audit log entries (paginated, filtered)"
          
        get_tests:
          route: "/api/tests"
          method: "GET"
          response: "Test coverage metrics (total, AC coverage, pass/fail)"
          
        get_summary:
          route: "/api/summary"
          method: "GET"
          response: "Dashboard summary (overall progress, recent logs, test health)"
      
      validation:
        - "All endpoints return JSON"
        - "Pagination works (limit/offset)"
        - "Filtering works (category, status)"
        - "Response time <500ms"

