phase_3:
  name: "Planning Orchestrator Integration"
  priority: "HIGH"
  estimated_hours: "3-4"
  dependencies: ["phase_1", "phase_2"]
  
  deliverables:
    - "Dashboard generator module"
    - "Auto-launch configuration"
    - "Plan folder dashboard/ directory"
    - "Integration tests"
    
  tasks:
    task_3_1:
      name: "Dashboard Generator Module"
      estimated_hours: "1.5"
      description: "Create module to generate dashboard for any plan"
      
      files_to_create:
        - path: "src/orchestrators/planning/dashboard_generator.py"
          content: "Dashboard generation logic"
      
      class_definition:
        DashboardGenerator:
          methods:
            generate:
              signature: "def generate(self, plan_path: Path, output_dir: Path) -> Path"
              description: "Generate dashboard files in plan folder"
              returns: "Path to generated index.html"
              
            copy_static_assets:
              signature: "def copy_static_assets(self, output_dir: Path) -> None"
              description: "Copy CSS, JS, images to output directory"
              
            configure_paths:
              signature: "def configure_paths(self, plan_path: Path) -> Dict[str, Path]"
              description: "Configure API paths for plan-specific data"
              returns: "Dict of configured paths"
      
      implementation:
        generation_workflow: |
          def generate(self, plan_path: Path, output_dir: Path) -> Path:
              # 1. Create dashboard/ directory in plan folder
              dashboard_dir = output_dir / "dashboard"
              dashboard_dir.mkdir(exist_ok=True)
              
              # 2. Copy static assets (HTML, CSS, JS)
              self.copy_static_assets(dashboard_dir)
              
              # 3. Configure API paths (relative to plan folder)
              paths_config = self.configure_paths(plan_path)
              
              # 4. Inject configuration into index.html
              self.inject_config(dashboard_dir / "index.html", paths_config)
              
              # 5. Generate launch script (serve.py)
              self.generate_launch_script(dashboard_dir)
              
              return dashboard_dir / "index.html"
      
      validation:
        - "Generates dashboard in plan folder"
        - "Static assets copied correctly"
        - "Paths configured correctly"
        - "Launch script works"
    
    task_3_2:
      name: "Auto-Launch Configuration"
      estimated_hours: "1.0"
      description: "Add dashboard auto-launch option to Planning Orchestrator"
      
      configuration:
        planning_orchestrator_config:
          dashboard:
            auto_generate: true
            auto_launch: false  # User must manually launch
            port: 8000
            host: "localhost"
            open_browser: true
      
      command_line_args:
        - "--dashboard-launch: Launch dashboard after plan creation"
        - "--dashboard-port <PORT>: Custom port (default: 8000)"
        - "--dashboard-no-browser: Don't open browser automatically"
      
      implementation:
        post_plan_hook: |
          def on_plan_created(self, plan_path: Path):
              if self.config.dashboard.auto_generate:
                  generator = DashboardGenerator()
                  dashboard_path = generator.generate(plan_path, plan_path.parent)
                  
                  if self.config.dashboard.auto_launch:
                      self.launch_dashboard(dashboard_path)
          
          def launch_dashboard(self, dashboard_path: Path):
              import subprocess
              import webbrowser
              
              # Start FastAPI server
              server_script = dashboard_path.parent / "serve.py"
              subprocess.Popen([sys.executable, str(server_script)])
              
              # Open browser
              if self.config.dashboard.open_browser:
                  webbrowser.open(f"http://localhost:{self.config.dashboard.port}")
      
      validation:
        - "Dashboard generates automatically"
        - "Server starts on configured port"
        - "Browser opens to dashboard"
        - "Graceful shutdown on Ctrl+C"
    
    task_3_3:
      name: "Integration Tests"
      estimated_hours: "1.5"
      description: "Create tests for dashboard generation and API"
      
      test_files:
        - path: "tests/unit/test_dashboard_generator.py"
          tests: "Dashboard generation, path configuration, asset copying"
        - path: "tests/integration/test_dashboard_api.py"
          tests: "API endpoints, WebSocket, data loading"
        - path: "tests/integration/test_dashboard_e2e.py"
          tests: "End-to-end dashboard workflow"
      
      test_cases:
        test_dashboard_generation:
          - "Generates dashboard in plan folder"
          - "Creates dashboard/ directory"
          - "Copies all static assets"
          - "Configures paths correctly"
          
        test_api_endpoints:
          - "GET /api/plan returns plan data"
          - "GET /api/progress returns progress data"
          - "GET /api/audit-logs returns logs (paginated)"
          - "GET /api/tests returns test metrics"
          - "WebSocket connects successfully"
          
        test_end_to_end:
          - "Plan creation → Dashboard generation → Server launch → Browser open"
          - "Real-time updates work (modify progress-tracker.json)"
          - "Audit logs display correctly"
          - "Export functionality works"
      
      validation:
        - "All tests pass (100% success rate)"
        - "Coverage ≥85%"
        - "Integration tests run in <30 seconds"

