    task_2_3:
      name: "Real-Time Data Integration"
      estimated_hours: "2.0"
      description: "Connect components to WebSocket + REST API"
      
      implementation:
        websocket_client: |
          class DashboardClient {
              constructor() {
                  this.ws = null;
                  this.reconnectInterval = 3000;
              }
              
              connect() {
                  this.ws = new WebSocket('ws://localhost:8000/ws');
                  
                  this.ws.onopen = () => {
                      console.log('WebSocket connected');
                      updateConnectionStatus(true);
                  };
                  
                  this.ws.onmessage = (event) => {
                      const data = JSON.parse(event.data);
                      this.handleUpdate(data);
                  };
                  
                  this.ws.onclose = () => {
                      console.log('WebSocket disconnected');
                      updateConnectionStatus(false);
                      setTimeout(() => this.connect(), this.reconnectInterval);
                  };
              }
              
              handleUpdate(data) {
                  if (data.type === 'file_changed') {
                      this.refreshData();
                  }
              }
              
              async refreshData() {
                  const [plan, progress, logs, tests] = await Promise.all([
                      fetch('/api/plan').then(r => r.json()),
                      fetch('/api/progress').then(r => r.json()),
                      fetch('/api/audit-logs?limit=100').then(r => r.json()),
                      fetch('/api/tests').then(r => r.json())
                  ]);
                  
                  updateDashboard({ plan, progress, logs, tests });
              }
          }
        
        auto_refresh: |
          const client = new DashboardClient();
          client.connect();
          
          // Initial load
          client.refreshData();
          
          // Fallback polling (if WebSocket fails)
          setInterval(() => {
              if (!client.ws || client.ws.readyState !== WebSocket.OPEN) {
                  client.refreshData();
              }
          }, 5000);
      
      validation:
        - "WebSocket reconnects automatically"
        - "Data updates within 500ms of file change"
        - "Fallback polling works"
        - "No memory leaks (disconnect cleanup)"
    
