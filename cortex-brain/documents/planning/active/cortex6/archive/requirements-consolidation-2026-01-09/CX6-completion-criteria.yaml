# ==============================================================================
# CORTEX 6.0 EPIC COMPLETION CRITERIA
# ==============================================================================
# Purpose: Define "done" state for CORTEX 6.0 Epic with go/no-go decision gates
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-09
# Status: AUTHORITATIVE
#
# This document provides the DEFINITION OF DONE for CORTEX 6.0. Epic Executor
# uses this to determine when the epic is complete and ready for deployment.
# NO AMBIGUITY - these criteria are BINARY (pass/fail).
# ==============================================================================

metadata:
  document_type: completion_criteria
  version: 1.0.0
  status: AUTHORITATIVE
  created: '2026-01-09'
  author: Asif Hussain
  epic_id: CORTEX6-BUILD
  epic_name: "CORTEX 6.0 Autonomous Orchestration Platform"
  
# ==============================================================================
# DEFINITION OF DONE (Binary Gates)
# ==============================================================================

definition_of_done:
  description: |
    ALL criteria in this section MUST be TRUE for epic to be marked COMPLETE.
    Epic Executor validates each criterion and generates completion report.
    
  criteria:
    
    # ==========================================================================
    # GATE 1: ACCEPTANCE CRITERIA VALIDATION (P0 Required)
    # ==========================================================================
    - gate_id: DOD-001
      gate_name: "P0_CRITICAL Acceptance Criteria 100% Complete"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.orchestrators.epic_review \
          --check-p0-completion \
          --plan cortex6 \
          --output-format json
      pass_criteria: "all_p0_criteria_validated: true"
      failure_action: "Block deployment, generate gap report"
      estimated_validation_time: "5 minutes"
      
    - gate_id: DOD-002
      gate_name: "P1_HIGH Acceptance Criteria 95%+ Complete"
      type: NON_BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.orchestrators.epic_review \
          --check-p1-completion \
          --plan cortex6 \
          --threshold 95
      pass_criteria: "p1_completion_percentage >= 95.0"
      failure_action: "Log warning, allow deployment with review"
      estimated_validation_time: "5 minutes"
      
    # ==========================================================================
    # GATE 2: TEST COVERAGE & QUALITY
    # ==========================================================================
    - gate_id: DOD-003
      gate_name: "Test Coverage 95%+ on Orchestrators"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        pytest tests/orchestrators/ \
          --cov=src/orchestrators \
          --cov-report=json \
          --cov-fail-under=95
      pass_criteria: "coverage_percentage >= 95.0"
      failure_action: "Block deployment, identify untested code"
      estimated_validation_time: "10 minutes"
      
    - gate_id: DOD-004
      gate_name: "All Integration Tests Passing"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        pytest tests/integration/ \
          --tb=short \
          --strict-markers \
          -v
      pass_criteria: "exit_code == 0 AND failures == 0"
      failure_action: "Block deployment, fix failing tests"
      estimated_validation_time: "15 minutes"
      
    - gate_id: DOD-005
      gate_name: "Zero HIGH/CRITICAL Severity Errors in Audit Logs"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.infrastructure.audit_logger \
          --query "SELECT COUNT(*) FROM audit_logs WHERE severity IN ('HIGH', 'CRITICAL') AND created_at > date('now', '-7 days')" \
          --database cortex-brain/database/audit-cortex.db
      pass_criteria: "count == 0"
      failure_action: "Block deployment, review critical errors"
      estimated_validation_time: "2 minutes"
      
    # ==========================================================================
    # GATE 3: GOVERNANCE & COMPLIANCE
    # ==========================================================================
    - gate_id: DOD-006
      gate_name: "SKULL Rules Compliance 100%"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.infrastructure.governance_validator \
          --validate-skull-rules \
          --config cortex-brain/brain-protection-rules.yaml
      pass_criteria: "violations == 0"
      failure_action: "Block deployment, fix SKULL violations"
      estimated_validation_time: "3 minutes"
      
    - gate_id: DOD-007
      gate_name: "Git Isolation Verified (Zero User Repo Commits)"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.infrastructure.git_isolation_checker \
          --scan-user-repos \
          --check-cortex-commits
      pass_criteria: "cortex_commits_in_user_repos == 0"
      failure_action: "Block deployment, investigate isolation breach"
      estimated_validation_time: "5 minutes"
      
    - gate_id: DOD-008
      gate_name: "4-Category Governance Functional"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.orchestrators.master_orchestrator \
          --test-governance-merge \
          --validate-categories
      pass_criteria: "merge_successful: true AND conflicts_resolved: 0"
      failure_action: "Block deployment, fix governance merge logic"
      estimated_validation_time: "3 minutes"
      
    # ==========================================================================
    # GATE 4: ORCHESTRATOR FUNCTIONALITY
    # ==========================================================================
    - gate_id: DOD-009
      gate_name: "All 10+ Orchestrators Functional"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.integration.test_orchestrator_smoke \
          --run-all-orchestrators \
          --timeout 300
      pass_criteria: "all_orchestrators_passed: true"
      failure_action: "Block deployment, debug failing orchestrators"
      estimated_validation_time: "5 minutes"
      orchestrators_tested:
        - master_orchestrator
        - planning_orchestrator
        - epic_executor
        - tdd_orchestrator
        - epic_review_orchestrator
        - ado_orchestrator
        - investigation_orchestrator
        - sanitization_orchestrator
        - vacuum_orchestrator
        - cleanup_orchestrator
        - maintenance_orchestrator
        - refinement_orchestrator
      
    - gate_id: DOD-010
      gate_name: "Planning Orchestrator End-to-End Test"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m src.main "plan sample user authentication system" \
          --validate-output \
          --cleanup-after
      pass_criteria: "plan_generated: true AND plan_valid: true"
      failure_action: "Block deployment, fix planning orchestrator"
      estimated_validation_time: "2 minutes"
      
    - gate_id: DOD-011
      gate_name: "Epic Executor Continuation Test"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.integration.test_epic_continuation \
          --create-sample-epic \
          --execute-phase-1 \
          --checkpoint \
          --resume \
          --validate-state
      pass_criteria: "continuation_successful: true"
      failure_action: "Block deployment, fix continuation context"
      estimated_validation_time: "3 minutes"
      
    # ==========================================================================
    # GATE 5: PERFORMANCE & SCALABILITY
    # ==========================================================================
    - gate_id: DOD-012
      gate_name: "Performance Benchmarks Met"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.performance.run_benchmarks \
          --suite orchestrator-performance \
          --compare-baseline
      pass_criteria: "all_benchmarks_within_sla: true"
      failure_action: "Block deployment, optimize slow operations"
      estimated_validation_time: "10 minutes"
      sla_thresholds:
        plan_generation: "<5 seconds for standard plan"
        ac_validation: "<2 seconds per criterion"
        audit_log_query: "<500ms for 10k records"
        dag_execution: "<10 seconds for 50-node DAG"
        
    - gate_id: DOD-013
      gate_name: "Memory Footprint Under 500MB"
      type: NON_BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.performance.measure_memory \
          --orchestrator all \
          --duration 60
      pass_criteria: "peak_memory_mb <= 500"
      failure_action: "Log warning, optimize if possible"
      estimated_validation_time: "2 minutes"
      
    # ==========================================================================
    # GATE 6: DOCUMENTATION & USABILITY
    # ==========================================================================
    - gate_id: DOD-014
      gate_name: "Plan Viewer Dashboard Functional"
      type: BLOCKING
      validation_method: MANUAL
      validation_steps:
        - "Generate sample plan with Planning Orchestrator"
        - "Open plan-viewer-dashboard.html in browser (file:// protocol)"
        - "Verify Material Design styling renders correctly"
        - "Verify glassmorphism effects visible"
        - "Verify progress bars update dynamically"
        - "Verify AC fulfillment section displays correctly"
      pass_criteria: "All visual elements render and function correctly"
      failure_action: "Block deployment, fix dashboard rendering"
      estimated_validation_time: "5 minutes"
      
    - gate_id: DOD-015
      gate_name: "README.md and Documentation Complete"
      type: NON_BLOCKING
      validation_method: MANUAL
      validation_steps:
        - "Review cortex-brain/documents/planning/active/cortex6/README.md"
        - "Verify all orchestrators documented"
        - "Verify quick start examples present"
        - "Verify troubleshooting section complete"
      pass_criteria: "Documentation covers all major features"
      failure_action: "Log warning, update post-deployment"
      estimated_validation_time: "10 minutes"
      
    # ==========================================================================
    # GATE 7: SECURITY & SAFETY
    # ==========================================================================
    - gate_id: DOD-016
      gate_name: "Security Audit Passed"
      type: BLOCKING
      validation_method: MANUAL
      validation_steps:
        - "Run bandit security scanner on src/"
        - "Review sanitization orchestrator for PII leakage"
        - "Verify no hardcoded secrets in codebase"
        - "Test git isolation with malicious inputs"
      pass_criteria: "Zero HIGH/CRITICAL security findings"
      failure_action: "Block deployment, fix security issues"
      estimated_validation_time: "20 minutes"
      
    - gate_id: DOD-017
      gate_name: "Selective Memory Flushing Safety Test"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.integration.test_memory_flush_safety \
          --test-protected-tiers \
          --validate-no-core-deletion
      pass_criteria: "no_protected_files_deleted: true"
      failure_action: "Block deployment, fix memory flush logic"
      estimated_validation_time: "3 minutes"
      
    # ==========================================================================
    # GATE 8: REGRESSION PREVENTION
    # ==========================================================================
    - gate_id: DOD-018
      gate_name: "Zero Regressions from CORTEX 5.5"
      type: BLOCKING
      validation_method: AUTOMATED
      validation_command: |
        python3 -m tests.regression.run_v5_compatibility_tests \
          --baseline CORTEX-5.5 \
          --current CORTEX-6.0
      pass_criteria: "all_v5_features_working: true"
      failure_action: "Block deployment, fix regressions"
      estimated_validation_time: "15 minutes"
      
    # ==========================================================================
    # GATE 9: SNOWBALL MOMENTUM
    # ==========================================================================
    - gate_id: DOD-019
      gate_name: "Snowball Strategy MAXIMUM Momentum Achieved"
      type: NON_BLOCKING
      validation_method: MANUAL
      validation_steps:
        - "Review cortex6-build-sequence.yaml execution history"
        - "Verify Phase 12 (Integration) completed"
        - "Verify parallel execution occurred in Weeks 5-8"
        - "Verify velocity increased from SMALL to MAXIMUM"
      pass_criteria: "All 12 phases complete, momentum progression validated"
      failure_action: "Log warning, document velocity issues"
      estimated_validation_time: "5 minutes"
      
    # ==========================================================================
    # GATE 10: DEPLOYMENT READINESS
    # ==========================================================================
    - gate_id: DOD-020
      gate_name: "Deployment Checklist 100% Complete"
      type: BLOCKING
      validation_method: MANUAL
      checklist:
        - label: "All P0 AC validated"
          status: PENDING
        - label: "Tests passing (95%+ coverage)"
          status: PENDING
        - label: "Documentation complete"
          status: PENDING
        - label: "Security audit passed"
          status: PENDING
        - label: "Performance benchmarks met"
          status: PENDING
        - label: "Regression tests passed"
          status: PENDING
        - label: "Rollback procedure tested"
          status: PENDING
        - label: "User acceptance testing complete"
          status: PENDING
      pass_criteria: "All checklist items marked COMPLETE"
      failure_action: "Block deployment, complete checklist"
      estimated_validation_time: "30 minutes"

# ==============================================================================
# RELEASE CHECKLIST (Manual Steps)
# ==============================================================================

release_checklist:
  description: "Manual steps required before marking epic COMPLETE"
  
  pre_deployment:
    - step: "Create release branch (CORTEX-6.0)"
      responsible: "Release Manager"
      estimated_time: "5 minutes"
      
    - step: "Tag release commit (v6.0.0)"
      responsible: "Release Manager"
      estimated_time: "2 minutes"
      
    - step: "Generate release notes"
      responsible: "Documentation Team"
      estimated_time: "30 minutes"
      
    - step: "Run deployment dry-run"
      responsible: "DevOps"
      estimated_time: "15 minutes"
      
  deployment:
    - step: "Deploy to staging environment"
      responsible: "DevOps"
      estimated_time: "20 minutes"
      
    - step: "Run smoke tests on staging"
      responsible: "QA Team"
      estimated_time: "30 minutes"
      
    - step: "Deploy to production"
      responsible: "DevOps"
      estimated_time: "20 minutes"
      
    - step: "Verify production health metrics"
      responsible: "DevOps"
      estimated_time: "15 minutes"
      
  post_deployment:
    - step: "Update documentation site"
      responsible: "Documentation Team"
      estimated_time: "30 minutes"
      
    - step: "Send release announcement"
      responsible: "Product Manager"
      estimated_time: "15 minutes"
      
    - step: "Archive CORTEX 5.5 artifacts"
      responsible: "Release Manager"
      estimated_time: "10 minutes"

# ==============================================================================
# GO/NO-GO DECISION CRITERIA
# ==============================================================================

go_no_go_decision:
  description: |
    Final decision gate before marking epic COMPLETE. All BLOCKING gates
    must PASS. NON_BLOCKING gates generate warnings but don't prevent deployment.
    
  blocking_gates_count: 16
  non_blocking_gates_count: 4
  
  go_decision:
    criteria:
      - "All 16 BLOCKING gates PASS"
      - "Release checklist 100% complete"
      - "Sign-off from Product Manager"
      - "Sign-off from Lead Engineer"
    action: "Mark epic COMPLETE, proceed with deployment"
    
  no_go_decision:
    criteria:
      - "ANY BLOCKING gate FAILS"
      - "Security audit finds HIGH/CRITICAL issues"
      - "Regression tests fail"
    action: "Block deployment, generate detailed gap report, resume remediation"
    
  conditional_go:
    criteria:
      - "All BLOCKING gates PASS"
      - "1-2 NON_BLOCKING gates FAIL with acceptable risk"
    action: "Deploy with documented exceptions, track post-deployment fixes"

# ==============================================================================
# COMPLETION REPORT TEMPLATE
# ==============================================================================

completion_report_template:
  description: "Generated by Epic Executor when all DoD criteria met"
  
  sections:
    - section: "Executive Summary"
      content:
        - "Epic completion date"
        - "Total phases executed"
        - "Total effort hours"
        - "Snowball momentum progression"
        
    - section: "Acceptance Criteria Fulfillment"
      content:
        - "P0_CRITICAL: X/Y validated (100%)"
        - "P1_HIGH: X/Y validated (95%+)"
        - "P2_MEDIUM: X/Y validated"
        - "P3_LOW: X/Y validated"
        
    - section: "Test Coverage & Quality"
      content:
        - "Orchestrator coverage: X%"
        - "Integration tests: PASS"
        - "Regression tests: PASS"
        - "Performance benchmarks: PASS"
        
    - section: "Governance Compliance"
      content:
        - "SKULL rules violations: 0"
        - "Git isolation verified: YES"
        - "4-category governance: FUNCTIONAL"
        
    - section: "Known Issues & Technical Debt"
      content:
        - "List of NON_BLOCKING gates that failed"
        - "Post-deployment improvement backlog"
        - "Future enhancement roadmap"
        
    - section: "Deployment Readiness"
      content:
        - "Go/No-Go decision: GO"
        - "Release checklist: 100% complete"
        - "Stakeholder sign-offs: COMPLETE"

# ==============================================================================
# POST-COMPLETION MAINTENANCE
# ==============================================================================

post_completion_maintenance:
  description: "Activities after epic marked COMPLETE"
  
  immediate_actions:
    - "Archive cortex6 plan to cortex-brain/archives/"
    - "Update tier1 state to mark epic COMPLETE"
    - "Generate final completion report"
    - "Publish release notes"
    
  ongoing_monitoring:
    - "Daily health checks for 2 weeks"
    - "Weekly performance benchmarks for 1 month"
    - "Monthly regression test runs"
    
  enhancement_tracking:
    - "Track ENH-001 through ENH-008 from Section 17"
    - "Prioritize post-v6.0 enhancements based on user feedback"
    - "Maintain enhancement backlog in tier1/"

# ==============================================================================
# ROLLBACK CRITERIA (If Deployment Fails)
# ==============================================================================

rollback_criteria:
  description: "Conditions that trigger automatic rollback to CORTEX 5.5"
  
  triggers:
    - trigger: "Critical production errors (>10 errors/hour)"
      action: "Immediate rollback"
      recovery_time: "15 minutes"
      
    - trigger: "Performance degradation (>50% slower than v5.5)"
      action: "Rollback within 1 hour"
      recovery_time: "20 minutes"
      
    - trigger: "Data corruption detected"
      action: "Immediate rollback + investigation"
      recovery_time: "30 minutes"
      
    - trigger: "Security vulnerability exploited"
      action: "Immediate rollback + patch"
      recovery_time: "45 minutes"
      
  rollback_procedure:
    - "Stop CORTEX 6.0 processes"
    - "Restore CORTEX 5.5 from backup"
    - "Verify 5.5 functionality"
    - "Notify stakeholders"
    - "Conduct post-mortem"
    - "Fix issues before re-deploying 6.0"

# ==============================================================================
# EPIC EXECUTOR INTEGRATION
# ==============================================================================

epic_executor_usage:
  description: |
    Epic Executor validates completion criteria automatically during Phase 12
    (Integration & Validation). All AUTOMATED gates run in sequence, MANUAL
    gates require human confirmation.
    
  command: "epic review cortex6 --validate-completion"
  
  output: |
    Completion Criteria Validation Report
    =====================================
    BLOCKING Gates: 16/16 PASS ✅
    NON_BLOCKING Gates: 3/4 PASS ⚠️
    
    Go/No-Go Decision: GO 🚀
    
    Epic Status: READY FOR DEPLOYMENT
    Estimated Deployment Time: 2-3 hours
    
    Next Steps:
    1. Review release checklist
    2. Obtain stakeholder sign-offs
    3. Execute deployment procedure
    
  autonomous_validation: true
  human_approval_required: true

