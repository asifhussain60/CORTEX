# ==============================================================================
# SECTION 1: FOUR-CATEGORY GOVERNANCE ARCHITECTURE
# ==============================================================================
# 
# CRITICAL DESIGN: Intelligent merging of 4 governance sources into unified
# instruction set for TODO generation and orchestrator execution.
#
# This replaces the legacy SKULL rules with a more sophisticated model.
# ==============================================================================

four_category_governance:
  
  purpose: |
    CORTEX must intelligently combine multiple governance sources to generate
    contextually-appropriate TODOs and orchestrate work. The 4 categories are
    NOT a simple priority list - they form a MERGE STRATEGY that produces
    an intelligent, unified instruction set.
    
    The output is NOT just rules - it's actionable intelligence:
    - What TODOs to create
    - What order to execute them
    - What constraints to enforce
    - What patterns to apply
    
  categories:
    
    # --------------------------------------------------------------------------
    # CATEGORY 1: CORTEX Tier 0 (Core Governance)
    # --------------------------------------------------------------------------
    category_1:
      name: "CORTEX Tier 0"
      alias: "Core Brain Protection"
      description: |
        Universal CORTEX governance rules that apply to ALL orchestrations
        regardless of company, domain, or repository context.
        
        THESE RULES NEVER CHANGE based on context. They are immutable.
        
      storage_location: "cortex-brain/tier0/governance/"
      
      rule_types:
        - type: "TDD_ENFORCEMENT"
          description: "Tests must fail before implementation"
          immutable: true
          override_allowed: false
          
        - type: "HOLISTIC_DISCOVERY"
          description: "Search before create (prevent duplicates)"
          immutable: true
          override_allowed: false
          
        - type: "PLANNING_ISOLATION"
          description: "Plans create structure only, never implement"
          immutable: true
          override_allowed: false
          
        - type: "AUDIT_LOGGING"
          description: "All operations must be logged"
          immutable: true
          override_allowed: false
          
        - type: "GIT_ISOLATION"
          description: "CORTEX code never commits to user repos"
          immutable: true
          override_allowed: false
          
        - type: "INCREMENTAL_EXECUTION"
          description: "Operations split into <500 line increments"
          immutable: true
          override_allowed: false
          
      legacy_skull_rules_absorbed:
        - "All 61 SKULL rules from brain-protection-rules.yaml"
        - "Rules renumbered as CORE-001 through CORE-061"
        - "Severity levels preserved (BLOCKED, HIGH, MEDIUM)"
        
      merge_behavior:
        priority: 2  # Second highest (Business wins for compliance)
        conflict_resolution: "CORTEX rules yield to Business Tier 0 for compliance-related conflicts ONLY"
        merge_strategy: "STRICT_UNION"
        
    # --------------------------------------------------------------------------
    # CATEGORY 2: Business Tier 0 (Company Governance)
    # --------------------------------------------------------------------------
    category_2:
      name: "Business Tier 0"
      alias: "Company Governance"
      description: |
        Company-specific governance rules that enforce business compliance,
        industry regulations, and organizational policies.
        
        These rules can OVERRIDE CORTEX Tier 0 ONLY for compliance-related
        conflicts (e.g., HIPAA, PCI-DSS, SOX requirements).
        
      storage_location: "{repo}/.cortex/governance/business-tier0.yaml"
      
      rule_types:
        - type: "COMPLIANCE_RULES"
          description: "HIPAA, PCI-DSS, SOX, GDPR requirements"
          override_cortex: true
          rationale: "Legal compliance always wins"
          
        - type: "SECURITY_POLICIES"
          description: "Company security standards"
          override_cortex: false
          rationale: "Augments CORTEX security, doesn't replace"
          
        - type: "DOMAIN_RULES"
          description: "Industry-specific requirements"
          override_cortex: true
          rationale: "Finance, Healthcare, Retail have unique constraints"
          
        - type: "APPROVAL_WORKFLOWS"
          description: "Required approvals for certain operations"
          override_cortex: false
          rationale: "Adds gates, doesn't bypass CORTEX gates"
          
      company_isolation:
        principle: "Business knowledge NEVER contaminates CORTEX core"
        implementation:
          - "Company ABC rules stored in Company ABC brain partition"
          - "Company XYZ rules stored in Company XYZ brain partition"
          - "Cross-company learning disabled by default"
          
      domain_plugin_system:
        description: |
          Each company can have multiple domain plugins (Finance, HSA/FSA,
          Commuter, etc.) that provide domain-specific governance.
          
        example_company_abc:
          domains:
            - name: "Finance"
              governance: "SOX compliance, audit trails, GL patterns"
            - name: "HSA/FSA"
              governance: "HIPAA compliance, claim validation"
            - name: "Commuter"
              governance: "Transit benefit regulations"
              
      merge_behavior:
        priority: 1  # Highest priority (compliance wins)
        conflict_resolution: "Business Tier 0 wins for COMPLIANCE_RULES and DOMAIN_RULES"
        merge_strategy: "PRIORITY_OVERRIDE"
        
    # --------------------------------------------------------------------------
    # CATEGORY 3: Company Best Practices
    # --------------------------------------------------------------------------
    category_3:
      name: "Company Best Practices"
      alias: "Engineering Standards"
      description: |
        Company-specific engineering standards, coding conventions, and
        architectural patterns. These AUGMENT (not replace) CORTEX patterns.
        
      storage_location: "{repo}/.cortex/best-practices/"
      
      rule_types:
        - type: "CODING_STANDARDS"
          description: "Line length, naming conventions, formatting"
          override_cortex: false
          rationale: "Company preferences layer on CORTEX defaults"
          
        - type: "ARCHITECTURE_PATTERNS"
          description: "Microservices, monolith, hybrid decisions"
          override_cortex: false
          rationale: "Company architecture preferences"
          
        - type: "TESTING_STANDARDS"
          description: "Coverage thresholds, test naming"
          override_cortex: false
          rationale: "Can tighten (but not loosen) CORTEX TDD"
          
        - type: "DOCUMENTATION_STANDARDS"
          description: "Comment style, README requirements"
          override_cortex: false
          rationale: "Company documentation preferences"
          
      merge_behavior:
        priority: 3  # Third priority
        conflict_resolution: "Company Best Practices EXTEND CORTEX, never contradict"
        merge_strategy: "ADDITIVE_UNION"
        
    # --------------------------------------------------------------------------
    # CATEGORY 4: Knowledge Best Practices
    # --------------------------------------------------------------------------
    category_4:
      name: "Knowledge Best Practices"
      alias: "Learned Intelligence"
      description: |
        Patterns learned from execution history, lessons learned, and
        knowledge library. This is CORTEX's adaptive intelligence.
        
      storage_location: "cortex-brain/tier2/knowledge-graph/"
      
      rule_types:
        - type: "LEARNED_PATTERNS"
          description: "Successful patterns from past executions"
          override_cortex: false
          rationale: "Suggestions, not mandates"
          
        - type: "LESSONS_LEARNED"
          description: "Failures to avoid, optimizations discovered"
          override_cortex: false
          rationale: "Advisory intelligence"
          
        - type: "DOMAIN_EXPERTISE"
          description: "Accumulated knowledge per domain"
          override_cortex: false
          rationale: "Contextual recommendations"
          
        - type: "PERFORMANCE_INSIGHTS"
          description: "Optimization recommendations"
          override_cortex: false
          rationale: "Performance suggestions"
          
      merge_behavior:
        priority: 4  # Lowest priority (advisory)
        conflict_resolution: "Knowledge Best Practices are SUGGESTIONS only"
        merge_strategy: "ADVISORY_APPEND"

  # ----------------------------------------------------------------------------
  # GOVERNANCE MERGE ALGORITHM
  # ----------------------------------------------------------------------------
  merge_algorithm:
    
    name: "4-Category Intelligent Governance Merger"
    version: "1.0.0"
    
    description: |
      The merge algorithm produces a UNIFIED INSTRUCTION SET from 4 governance
      sources. The output drives TODO generation and orchestrator behavior.
      
      This is NOT a simple "highest priority wins" - it's intelligent merging
      that considers rule types, conflict nature, and context.
      
    input_sources:
      1: "CORTEX Tier 0 governance rules"
      2: "Business Tier 0 governance rules (if company context active)"
      3: "Company Best Practices (if company context active)"
      4: "Knowledge Best Practices (always consulted)"
      
    output_format:
      name: "Unified Instruction Set"
      location: "cortex-brain/tier1/active-instruction-set.yaml"
      structure:
        mandatory_rules: []      # MUST enforce (violations = BLOCKED)
        recommended_rules: []    # SHOULD enforce (violations = WARNING)
        advisory_patterns: []    # MAY apply (suggestions only)
        todo_generation_rules: [] # How to create TODOs from instructions
        
    algorithm_steps:
      
      step_1:
        name: "Load All Governance Sources"
        action: |
          1. Load CORTEX Tier 0 rules (always)
          2. Detect company context (repo analysis or user specification)
          3. If company context: Load Business Tier 0 + Company Best Practices
          4. Load Knowledge Best Practices (always)
        output: "4 rule sets loaded into memory"
        
      step_2:
        name: "Categorize Rules by Type"
        action: |
          For each rule in all 4 sources:
            - Identify rule type (COMPLIANCE, SECURITY, ENGINEERING, ADVISORY)
            - Tag rule with source (CORTEX, BUSINESS, COMPANY, KNOWLEDGE)
            - Identify potential conflicts
        output: "Categorized rule list with conflict flags"
        
      step_3:
        name: "Detect Conflicts"
        action: |
          For each rule in categorized list:
            - Check if rule contradicts another rule from different source
            - Conflict types:
              a. OVERRIDE_CONFLICT: Business rule contradicts CORTEX rule
              b. EXTENSION_CONFLICT: Company practice conflicts with CORTEX default
              c. ADVICE_CONFLICT: Knowledge suggestion conflicts with active rule
        output: "Conflict matrix"
        
      step_4:
        name: "Resolve Conflicts"
        action: |
          For each conflict in matrix:
            - Apply resolution strategy based on rule types:
            
            OVERRIDE_CONFLICT (Business vs CORTEX):
              - If Business rule is COMPLIANCE_RULES or DOMAIN_RULES: Business wins
              - Else: CORTEX wins (Business cannot override non-compliance rules)
              
            EXTENSION_CONFLICT (Company vs CORTEX):
              - Company practice EXTENDS CORTEX, cannot contradict
              - If contradiction detected: CORTEX wins, log warning
              
            ADVICE_CONFLICT (Knowledge vs any):
              - Knowledge rules are advisory only
              - Active rule always wins, knowledge demoted to suggestion
        output: "Resolved rule set"
        
      step_5:
        name: "Generate Unified Instruction Set"
        action: |
          Transform resolved rules into actionable instructions:
          
          mandatory_rules:
            - All CORTEX Tier 0 rules (unless overridden by Business compliance)
            - All Business Tier 0 COMPLIANCE_RULES
            - All Business Tier 0 SECURITY_POLICIES
            
          recommended_rules:
            - Business Tier 0 non-compliance rules
            - Company Best Practices (all categories)
            
          advisory_patterns:
            - All Knowledge Best Practices
            - Learned patterns (success rate > 80%)
            
          todo_generation_rules:
            - Dependency ordering (DAG construction)
            - Parallel execution opportunities
            - Checkpoint intervals
            - Rollback triggers
        output: "active-instruction-set.yaml written to Tier 1"
        
      step_6:
        name: "Validate Instruction Set"
        action: |
          Sanity checks:
          - No circular dependencies in mandatory rules
          - All mandatory rules have enforcement mechanism
          - No BLOCKED severity rules contradict each other
          - Instruction set parseable by TODO Orchestrator
        output: "Validation report (pass/fail)"

  # ----------------------------------------------------------------------------
  # TODO GENERATION FROM UNIFIED INSTRUCTIONS
  # ----------------------------------------------------------------------------
  todo_generation:
    
    description: |
      The Master Orchestrator uses the Unified Instruction Set to generate
      intelligent TODOs via the TODO Orchestrator (DAG-based work tracking).
      
    process:
      
      step_1:
        name: "Parse User Request"
        action: "Extract intent, target repo, domain context"
        
      step_2:
        name: "Load Unified Instruction Set"
        action: "Read active-instruction-set.yaml from Tier 1"
        
      step_3:
        name: "Apply Mandatory Rules"
        action: |
          For each mandatory rule:
            - Check if rule applies to user request
            - If applies: Create enforcement TODO
            - If violated: Create remediation TODO (blocking)
            
      step_4:
        name: "Apply Recommended Rules"
        action: |
          For each recommended rule:
            - Check if rule applies to user request
            - If applies: Create advisory TODO (non-blocking)
            
      step_5:
        name: "Apply Advisory Patterns"
        action: |
          For each advisory pattern:
            - Check if pattern improves execution
            - If applicable: Inject pattern into TODO metadata
            
      step_6:
        name: "Build DAG"
        action: |
          Construct Directed Acyclic Graph:
          - Nodes: All TODOs generated
          - Edges: Dependencies (mandatory rules → implementation tasks)
          - Validate: No circular dependencies (DFS cycle detection)
          - Optimize: Identify parallel execution opportunities
          
      step_7:
        name: "Persist and Execute"
        action: |
          - Save DAG to state database
          - Begin execution from root nodes
          - Silent progress updates (phase boundaries only)
          - Checkpoint every 5 tasks

# ==============================================================================
