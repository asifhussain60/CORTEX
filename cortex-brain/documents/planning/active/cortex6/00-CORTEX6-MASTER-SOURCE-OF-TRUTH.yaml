# ==============================================================================
# 
# CRITICAL: Single folder test harness covering ALL of CORTEX design
# Tests are NOT spread across folders
# ==============================================================================

test_harness:
  
  principle: |
    ALL tests live in a SINGLE `tests/` folder at repository root.
    No test files scattered across src/, cortex-brain/, or anywhere else.
    This enables:
    - Single test runner configuration
    - Clear coverage visibility
    - Easy test discovery
    - Consistent test organization
    
  folder_structure:
    root: "tests/"
    layout:
      tests/:
        __init__.py: "Test package marker"
        conftest.py: "Shared fixtures for all tests"
        pytest.ini: "Pytest configuration (moved from repo root)"
        
        unit/:
          __init__.py: ""
          test_master_orchestrator.py: "Master orchestrator unit tests"
          test_todo_orchestrator.py: "TODO orchestrator unit tests"
          test_state_manager.py: "State manager unit tests"
          test_governance_merger.py: "4-category governance merge tests"
          test_pattern_router.py: "Trie pattern router tests"
          test_audit_logger.py: "Audit logging tests"
          test_mcp_server.py: "MCP server tests"
          orchestrators/:
            __init__.py: ""
            test_planning_orchestrator.py: "Planning v5 tests"
            test_tdd_orchestrator.py: "TDD v2 tests"
            test_ado_orchestrator.py: "ADO v2 tests"
            test_vacuum_orchestrator.py: "Vacuum v2 tests"
            test_cleanup_orchestrator.py: "Cleanup v2 tests"
            test_investigation_orchestrator.py: "Investigation tests"
            test_sanitization_orchestrator.py: "Sanitization tests"
            test_debug_orchestrator.py: "Debug v2 tests"
            test_refinement_orchestrator.py: "Refinement v2 tests"
            test_maintenance_orchestrator.py: "Maintenance v2 tests"
            
        integration/:
