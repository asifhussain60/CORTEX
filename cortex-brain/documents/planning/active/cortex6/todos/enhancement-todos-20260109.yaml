# TODO-003: Enhanced Audit Logging Framework
# ==============================================================================

TODO-003:
  id: TODO-003
  title: "Enhanced Audit Logging Framework with MCP Access"
  status: AC_COMPLETE
  priority: P1_HIGH
  blocking: false
  created: '2026-01-09'
  completed: '2026-01-09'
  completion_notes: |
    - AC-AUDIT-001 to AC-AUDIT-006 added to AC document (Section 15E)
    - Enhanced audit logging category created
    - Implementation pending (SQLite backend, MCP tools, vacuum)
  
  description: |
    Enhance the audit logging framework to be:
    - Queryable (search by AC-ID, date range, severity, orchestrator)
    - Listable (paginated views, filtering)
    - Accessible via MCP for the respective REPO
    - Intelligent memory vs file logging
    - Efficient organization and vacuuming
    
  problem_statement: |
    Current audit logging (audit-trail.jsonl) has limitations:
    - Append-only with no query capability
    - No repo segregation for multi-repo
    - No memory vs file optimization
    - No automatic cleanup/vacuum
    - Not exposed via MCP for orchestrator access
    
  requirements:
    - SQLite-backed audit storage (queryable)
    - Memory buffer for high-frequency operations
    - File flush on thresholds (count, time, memory)
    - Per-repo database isolation
    - MCP tools for query/list/export
    - Automatic vacuum strategy
    - Retention policies per log level
    
  acceptance_criteria:
    - AC-AUDIT-001: "Audit logs queryable by AC-ID, orchestrator, date range"
    - AC-AUDIT-002: "Memory buffer with configurable flush thresholds"
    - AC-AUDIT-003: "Per-repo SQLite audit database isolation"
    - AC-AUDIT-004: "MCP tools: audit_query, audit_list, audit_export"
    - AC-AUDIT-005: "Automatic vacuum removes logs older than retention period"
    - AC-AUDIT-006: "Log level-based retention (ERROR: 90d, INFO: 30d, DEBUG: 7d)"
    
  files_to_create:
    - path: "src/infrastructure/audit_storage.py"
      purpose: "SQLite-backed audit storage with query interface"
      
    - path: "src/infrastructure/audit_memory_buffer.py"
      purpose: "In-memory buffer with flush strategies"
      
    - path: "src/mcp/audit_tools.py"
      purpose: "MCP tools for audit access"
      
    - path: "cortex-brain/config/audit-config.yaml"
      purpose: "Audit configuration (thresholds, retention, vacuum)"
      
  files_to_modify:
    - path: "src/infrastructure/audit_logger.py"
      changes:
        - "Replace jsonl with SQLite backend"
        - "Add memory buffer layer"
        - "Implement repo context"
        
    - path: "src/mcp/__init__.py"
      changes:
        - "Export audit MCP tools"
        
    - path: "cortex-brain/documents/planning/active/cortex6/acceptance-criteria/00-CORTEX6-ENTERPRISE-ACCEPTANCE-CRITERIA.yaml"
      changes:
        - "Add SECTION: AUDIT LOGGING FRAMEWORK (AC-AUDIT-001 to AC-AUDIT-006)"
        
  implementation_approach:
    phase_1:
      name: "SQLite Backend"
      tasks:
        - "Design audit schema (entries, indexes, views)"
        - "Implement AuditStorage class"
        - "Add query methods (by AC-ID, date, orchestrator)"
        - "Add list methods (pagination, filtering)"
      effort: "4h"
      
    phase_2:
      name: "Memory Buffer"
      tasks:
        - "Implement MemoryBuffer with flush strategies"
        - "Add threshold configs (count: 1000, time: 60s, memory: 10MB)"
        - "Add graceful shutdown flush"
      effort: "2h"
      
    phase_3:
      name: "MCP Integration"
      tasks:
        - "Create audit_query MCP tool"
        - "Create audit_list MCP tool"
        - "Create audit_export MCP tool"
        - "Register in capability registry"
      effort: "2h"
      
    phase_4:
      name: "Vacuum & Retention"
      tasks:
        - "Implement vacuum strategy (Housekeeping Orchestrator)"
        - "Add retention policies per log level"
        - "Add automatic scheduled cleanup"
      effort: "2h"
      
    phase_5:
      name: "Multi-Repo Isolation"
      tasks:
        - "Per-repo database paths"
        - "Context-aware database selection"
        - "Cross-repo audit queries (admin only)"
      effort: "2h"
      
  audit_schema:
    tables:
      audit_entries:
        columns:
          - "id INTEGER PRIMARY KEY AUTOINCREMENT"
          - "timestamp TEXT NOT NULL"
          - "level TEXT NOT NULL"  # DEBUG, INFO, WARNING, ERROR
          - "ac_id TEXT"  # e.g., AC-GOV-001
          - "orchestrator TEXT"
          - "operation TEXT NOT NULL"
          - "message TEXT NOT NULL"
          - "context JSON"  # Additional metadata
          - "trace_id TEXT"  # Cross-correlation
          - "repo_id TEXT"  # Multi-repo support
          - "session_id TEXT"
        indexes:
          - "idx_timestamp ON audit_entries(timestamp)"
          - "idx_ac_id ON audit_entries(ac_id)"
          - "idx_orchestrator ON audit_entries(orchestrator)"
          - "idx_level ON audit_entries(level)"
          - "idx_trace_id ON audit_entries(trace_id)"
          
    retention_policy:
      ERROR: "90 days"
      WARNING: "60 days"
      INFO: "30 days"
      DEBUG: "7 days"
      
    vacuum_strategy:
      frequency: "daily"
      trigger: "Housekeeping Orchestrator"
      method: "DELETE + VACUUM"
      
  memory_buffer_config:
    max_entries: 1000
    max_memory_mb: 10
    flush_interval_seconds: 60
    flush_on_shutdown: true
    flush_on_error: true  # Immediate flush on ERROR level
    
  mcp_tools:
    audit_query:
      description: "Query audit logs by criteria"
      parameters:
        - "ac_id: Optional[str]"
        - "orchestrator: Optional[str]"
        - "level: Optional[str]"
        - "start_date: Optional[str]"
        - "end_date: Optional[str]"
        - "limit: int = 100"
      returns: "List[AuditEntry]"
      
    audit_list:
      description: "List audit logs with pagination"
      parameters:
        - "page: int = 1"
        - "page_size: int = 50"
        - "filters: Optional[Dict]"
      returns: "PaginatedAuditResult"
      
    audit_export:
      description: "Export audit logs to file"
      parameters:
        - "format: str = 'jsonl'"  # jsonl, csv, json
        - "filters: Optional[Dict]"
        - "output_path: str"
      returns: "ExportResult"
      
  estimated_effort: "12h"
  depends_on: []
  unlocks:
    - "TODO-002"  # AC + Test + Audit validation
    - "Queryable audit trail"
    - "MCP-accessible audit tools"
    - "Multi-repo audit isolation"
    - "Efficient storage management"

