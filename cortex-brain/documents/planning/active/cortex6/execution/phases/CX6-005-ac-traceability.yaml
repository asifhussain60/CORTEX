# ==============================================================================
# PHASE CX6-005: AC-ID Traceability
# ==============================================================================
# Layer: 4 | Priority: 🟢 HIGH | Status: 🔄 IN_PROGRESS
# Estimated Effort: 4h | Blocking: No | Snowball Impact: Unlocks 6 downstream criteria
# ==============================================================================

metadata:
  phase_id: "CX6-005"
  phase_name: "AC-ID Traceability Mapping"
  layer: 4
  layer_name: "AC-ID Traceability"
  status: "IN_PROGRESS"
  priority: "HIGH"
  blocking: false
  estimated_hours: 4
  actual_hours: 0
  started_at: null
  completed_at: null
  
strategic_requirement:
  sr_id: "SR-002"
  sr_name: "Dual Validation Framework"
  description: "Every AC requires BOTH test evidence AND audit evidence"
  
acceptance_criteria:
  - id: "AC-TRACE-001"
    description: "Generate AC → test file mapping"
    priority: "CRITICAL"
    
  - id: "AC-TRACE-002"
    description: "Identify ACs without test coverage"
    priority: "CRITICAL"
    
  - id: "AC-TRACE-003"
    description: "Support coverage gap reporting"
    priority: "HIGH"

objective:
  summary: |
    Create automated traceability system that maps all 361 acceptance criteria
    to their corresponding test files, identifies gaps, and generates coverage reports.
  
  deliverables:
    - "tests/infrastructure/test_ac_traceability.py (traceability tests)"
    - "cortex-brain/registry/ac-test-coverage.yaml (coverage mapping)"
    - "Coverage gap report (270+ ACs identified)"
    - "MCP tools for coverage queries"
  
  success_criteria:
    - "All 361 ACs mapped to test files (or marked as gaps)"
    - "Coverage percentage calculated per section"
    - "Gap report generated with prioritization"
    - "Tests passing for traceability system"

definition_of_ready:
  checklist:
    - "✅ CX6-acceptance-criteria.yaml available (361 ACs)"
    - "✅ Test files use @pytest.mark.ac_id() markers"
    - "✅ AC-ID format standardized (AC-XXX-NNN)"
    - "✅ Test discovery mechanism available"

definition_of_done:
  required:
    - "[ ] ac-test-coverage.yaml generated with all 361 ACs"
    - "[ ] Coverage percentage ≥30% (target: 40%+)"
    - "[ ] Gap report identifies missing tests by section"
    - "[ ] Tests passing: test_ac_traceability.py"
    - "[ ] MCP tools implemented for coverage queries"
    - "[ ] Documentation: AC-TRACE-IMPLEMENTATION-GUIDE.md"
  
  optional:
    - "[ ] Coverage dashboard visualization"
    - "[ ] Auto-update on test file changes"
    - "[ ] Integration with Gap-Fix orchestrator"

implementation_steps:
  
  step_1:
    name: "Scan Test Files for AC Markers"
    duration: "1h"
    description: |
      Traverse tests/ directory, parse @pytest.mark.ac_id() markers,
      build AC → test file mapping.
    tasks:
      - "Implement test file scanner (recursive glob)"
      - "Parse pytest markers using AST"
      - "Extract AC-IDs from markers"
      - "Build dictionary: {ac_id: [test_files]}"
    outputs:
      - "Python module: src/infrastructure/ac_scanner.py"
    acceptance:
      - "Scanner finds all test files with AC markers"
      - "Handles multiple AC-IDs per test file"
      - "Performance: <5s for full scan"
  
  step_2:
    name: "Load Acceptance Criteria Registry"
    duration: "0.5h"
    description: |
      Parse CX6-acceptance-criteria.yaml, extract all 361 AC-IDs,
      build reference registry.
    tasks:
      - "Load YAML with safe_load()"
      - "Extract AC-IDs from all 26 sections"
      - "Build AC metadata (section, priority, status)"
      - "Validate AC-ID format"
    outputs:
      - "Python module: src/infrastructure/ac_registry.py"
    acceptance:
      - "All 361 ACs loaded successfully"
      - "AC metadata accessible"
      - "Performance: <1s for load"
  
  step_3:
    name: "Generate Coverage Mapping"
    duration: "1h"
    description: |
      Cross-reference AC registry with test file mappings,
      calculate coverage percentage, identify gaps.
    tasks:
      - "Match AC-IDs: registry vs test markers"
      - "Calculate coverage: (covered / total) * 100"
      - "Identify gaps: ACs without tests"
      - "Group by section for analysis"
    outputs:
      - "cortex-brain/registry/ac-test-coverage.yaml"
    acceptance:
      - "Coverage mapping generated"
      - "Gap list identified"
      - "Coverage percentage calculated"
  
  step_4:
    name: "Implement Traceability Tests"
    duration: "1h"
    description: |
      Create pytest tests to validate traceability system,
      ensure coverage mapping is accurate.
    tasks:
      - "Test: AC scanner finds all markers"
      - "Test: Registry loads all 361 ACs"
      - "Test: Coverage calculation correct"
      - "Test: Gap identification accurate"
    outputs:
      - "tests/infrastructure/test_ac_traceability.py"
    acceptance:
      - "All traceability tests passing"
      - "Test coverage for traceability ≥80%"
  
  step_5:
    name: "Generate Gap Report"
    duration: "0.5h"
    description: |
      Create prioritized gap report showing ACs without test coverage,
      grouped by section and priority.
    tasks:
      - "Generate gap report YAML"
      - "Prioritize by AC priority level"
      - "Group by section for context"
      - "Add recommendations"
    outputs:
      - "../evidence/ac-coverage-gap-report.yaml"
    acceptance:
      - "Gap report generated"
      - "Prioritization applied"
      - "Actionable recommendations included"

dependencies:
  required:
    - "CX6-acceptance-criteria.yaml (exists)"
    - "Test files with @pytest.mark.ac_id() markers (exists)"
    - "Python YAML library (exists)"
  
  optional:
    - "Gap-Fix orchestrator (for auto-remediation)"
    - "Dashboard integration (for visualization)"

risks:
  risk_1:
    description: "Low test coverage (<30%) may reveal significant gaps"
    mitigation: "Expected outcome - gap report drives future test creation"
    likelihood: "HIGH"
    impact: "MEDIUM"
  
  risk_2:
    description: "Inconsistent AC-ID marker format in old tests"
    mitigation: "Scanner handles multiple formats, report ambiguities"
    likelihood: "MEDIUM"
    impact: "LOW"

validation:
  automated:
    - "pytest tests/infrastructure/test_ac_traceability.py"
    - "Coverage mapping file exists and is valid YAML"
    - "Gap report generated with expected structure"
  
  manual:
    - "Review gap report for accuracy"
    - "Spot-check 10 random AC-IDs for correct mapping"
    - "Verify coverage percentage aligns with intuition"

evidence_location:
  tests: "tests/infrastructure/test_ac_traceability.py"
  coverage_map: "cortex-brain/registry/ac-test-coverage.yaml"
  gap_report: "../evidence/ac-coverage-gap-report.yaml"
  implementation: "src/infrastructure/ac_scanner.py, ac_registry.py"

next_phase:
  phase_id: "CX6-006"
  phase_name: "Plan Viewer Dashboard"
  unlocks: "Dashboard can visualize AC coverage metrics"
  handoff: "Coverage data available for dashboard integration"
