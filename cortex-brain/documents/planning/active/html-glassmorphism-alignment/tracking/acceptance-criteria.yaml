# Measurement Methods

measurement_methods:
  compliance_rate:
    method: "Run check-glassmorphism-compliance.ps1"
    target: "100% (with documented exemptions)"
    tool: "cortex-toolkit/check-glassmorphism-compliance.ps1"
    
  inline_styles:
    method: "Grep search for 'style=' attribute"
    target: "0 instances (except documented exemptions)"
    tool: "grep -r 'style=' docs/*.html"
    
  git_verification:
    method: "Run verify-html-transformation.ps1 after each phase"
    target: "PASS for all phases"
    tool: "cortex-toolkit/verify-html-transformation.ps1"
    
  performance:
    method: "Chrome DevTools Network tab + Lighthouse"
    target: "CSS <100ms, Lighthouse >90/95"
    tool: "Lighthouse CLI or Chrome DevTools"
    
  accessibility:
    method: "Lighthouse Accessibility audit + WAVE tool"
    target: "WCAG 2.1 AA 100% compliant"
    tool: "Lighthouse + WAVE browser extension"
    
  html_validation:
    method: "W3C HTML Validator"
    target: "0 errors, <5 warnings per file"
    tool: "https://validator.w3.org/"
    
  link_checker:
    method: "Link checker tool (e.g., broken-link-checker)"
    target: "0 broken links"
    tool: "npm broken-link-checker or similar"
