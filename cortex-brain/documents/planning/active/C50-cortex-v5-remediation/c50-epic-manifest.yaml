validation_rules:
  dependency_enforcement:
    enabled: true
    strict_mode: true
    check_on_start: true
    check_on_update: false
  gate_enforcement:
    enabled: true
    gates:
    - gate_id: GATE-1
      name: 50% Test Coverage
      condition: Sub-Plan 00C progress ≥50%
      blocks:
      - '01'
      - '02'
      - '05'
    - gate_id: GATE-2
      name: 80% Test Coverage
      condition: Sub-Plan 00C progress ≥80%
      blocks:
      - '03'
      - '04'
  progress_validation:
    min_progress: 0
    max_progress: 100
    allow_regression: false
    require_status_update: true
  completion_validation:
    require_100_percent: true
    require_exit_criteria: true
    require_documentation: true
    require_tests_passing: true
execution_config:
  parallel_execution:
    enabled: true
    max_parallel: 3
    allow_parallel_in_wave: true
    cross_wave_parallel: false
  brittleness_testing:
    enabled: true
    run_before_start: true
    auto_fix: true
    fail_on_critical: true
  pre_execution_analysis:
    enabled: true
    generate_analysis_doc: true
    require_review: false
    analysis_folder: analysis/
  git_checkpoints:
    enabled: true
    checkpoint_on_start: true
    checkpoint_on_complete: true
    checkpoint_prefix: feat(sub-plan-{order})
critical_path:
  total_weeks: 11
  path:
  - 00A
  - 00B
  - 00C
  - '01'
  - 08
  - '12'
  - 09
epic_success_criteria:
- All 22 child plans completed (excluding deferred 16-18)
- Overall test coverage ≥80%
- All deployment gates passed
- Production validation pipeline operational
- Documentation complete
- Onboarding system functional
- Zero critical brittleness issues
- All SKULL rules enforced
