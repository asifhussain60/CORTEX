# =============================================================================
# ARCHITECTURE SUMMARY (5-Layer System)
# =============================================================================

architecture_summary:
  layer_1_presentation:
    name: "User Interface & Intent Classification"
    components:
      - "GitHub Copilot Chat (user interaction)"
      - "CORTEX.prompt.md (intent router with 90%+ pattern matching)"
      - "LLMIntentClassifier (fallback for ambiguous requests)"
    flow: "User request → Pattern matching → Python terminal invocation"
  
  layer_2_orchestration:
    name: "Master Orchestrator & Execution Engine"
    components:
      - "MasterOrchestrator (single entry point, 5 intelligence rules)"
      - "PatternRouter (deterministic routing <20ms)"
      - "ExecutionEngine (phase sequencing, state tracking)"
      - "StateManager (SQLite WAL mode for concurrency)"
      - "OrchestratorRegistry (JSON catalog, 15+ orchestrators)"
    intelligence_rules:
      - "BLOCK_DIRECT_CREATION: Prevent direct file creation"
      - "YAML_FIRST_ORCHESTRATOR: Require manifests before implementation"
      - "PATTERN_COLLISION_DETECTION: Detect regex conflicts"
      - "HIERARCHY_VALIDATION: Prevent circular dependencies"
      - "DEPRECATION_ENFORCEMENT: Warn about deprecated orchestrators"
  
  layer_3_specialized_orchestrators:
    name: "Domain-Specific Workflow Execution"
    categories:
      - planning: "Planning v5/v6 → v7, Plan Migration"
      - quality_assurance: "Review v2, Refactor v2, TDD v2"
      - maintenance: "Vacuum v2, Housekeeping, Cleanup v2"
      - extraction: "MD-to-YAML, Git-to-YAML (NEW)"
      - utility: "KnowledgeLibraryUpdater (NEW)"
    count: 18
    new_orchestrators: 3
  
  layer_4_knowledge_governance:
    name: "Intelligence & Enforcement Layer"
    subsystems:
      - knowledge:
          - "KnowledgeLibraryProvider (tier2 YAML files)"
          - "CompanyKnowledgeProvider (company overrides)"
          - "KnowledgeMerger (intelligent conflict resolution)"
          - "Query performance: <50ms"
      - governance:
          - "CORTEXGovernanceEnforcer (12 SKULL rules from tier0)"
          - "Pre-execution validation (blocking)"
          - "Mid-execution checkpoints"
          - "Post-execution cleanup enforcement"
    tier_system:
      - tier0: "Immutable governance (brain-protection-rules.yaml)"
      - tier1: "Working memory (active plans, state)"
      - tier2: "Knowledge graph (library + company knowledge)"
      - tier3: "Development context (codebase analysis)"
  
  layer_5_data_persistence:
    name: "State & Audit Storage"
    components:
      - "SQLite (brain-state.db) - Orchestrator state"
      - "PostgreSQL (optional) - Enterprise scale"
      - "JSON (progress trackers, registry, audit logs)"
      - "YAML (plans, manifests, knowledge files)"
    no_markdown_execution: true
    markdown_usage: "Knowledge library updates at END of planning cycle only"

# =============================================================================
# DESIGN PRINCIPLES (8 Core Principles)
# =============================================================================

design_principles:
  - principle: "Autonomous RAG/DAG Execution"
    description: "LLM transforms → invokes Python → orchestrators execute independently"
    rationale: "Eliminates inline LLM execution; pure Python post-handoff"
  
  - principle: "YAML-First Design"
    description: "All orchestrators defined in YAML manifests before implementation"
    rationale: "Machine-readable specs enable dynamic loading, validation, lifecycle management"
  
  - principle: "Master-Child Orchestrator Hierarchy"
    description: "Single master routes to specialized children"
    rationale: "Separation of concerns; domain-specific intelligence"
  
  - principle: "Governance-Driven Development"
    description: "SKULL rules enforced via automated middleware + CI/CD"
    rationale: "Prevents brittleness; ensures quality; blocks technical debt"
  
  - principle: "Knowledge-Integrated Intelligence"
    description: "3-tier knowledge (CORTEX → Library → Company)"
    rationale: "Company best practices override defaults; domain optimization"
  
  - principle: "Snowball Optimization"
    description: "Foundation-first sequencing with parallel execution"
    rationale: "Maximizes velocity; unblocks dependent work early"
  
  - principle: "Production-Grade Quality"
    description: "Zero-tolerance validation; 80% coverage; comprehensive docs"
    rationale: "Autonomous orchestrators must be reliable without human supervision"
  
  - principle: "Strict Markdown Usage Policy (REQ-048)"
    description: "Markdown ONLY for knowledge library updates at END of cycle"
    rationale: |
      User clarification: "The only time markdown should happen is when learning
      libraries are updated which should happen at the end of each planning cycle."
      Orchestrators execute via Python/YAML only; no .md during runtime.
    implementation:
      - "Planning Orchestrator v7: Eliminate all .md generation"
      - "KnowledgeLibraryUpdater: Separate utility for post-cycle knowledge capture"
      - "Timing: END of planning cycle, not during orchestrator execution"

