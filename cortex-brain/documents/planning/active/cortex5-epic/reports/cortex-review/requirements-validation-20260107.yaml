requirement_4_master_orchestrator_control:
  requirement_name: "Master Orchestrator Control via Python/YAML Only"
  user_expectation: |
    Master orchestrator is in control. All work downstream executed via Python
    scripts and YAML files. No markdown files should be involved.
  status: PARTIALLY_VIOLATED
  confidence_score: 0.70
  
  findings:
    in_current_documents:
      - document: architecture-document.yaml
        execution_flow_analysis:
          llm_phase:
            component: "GitHub Copilot Chat + CORTEX.prompt.md"
            responsibility: "Intent classification and transformation"
            output: "Terminal invocation command"
            format: "python3 -m src.main '{request}'"
          
          python_execution_phase:
            component: "Master Orchestrator (src/orchestrators/master_orchestrator.py)"
            responsibility: "Route to child orchestrators via registry"
            execution: "Python scripts only (autonomous mode)"
            state_management: "SQLite database (brain-state.db)"
          
          child_orchestrator_phase:
            components:
              - planning_orchestrator_v5
              - review_orchestrator_v2
              - refactor_orchestrator_v2
              - debug_orchestrator_v2
            execution: "Python scripts with YAML manifests"
            no_markdown_execution: true
        
        validation: GOOD
        notes: |
          Autonomous orchestrators execute via Python scripts. State persisted
          to SQLite, not Markdown. Manifests in YAML format.
        
        markdown_usage_documented:
          allowed_contexts:
            - context: documentation_generation
              location: "cortex-brain/documents/"
              purpose: "Human-readable reports and summaries"
              execution_involvement: false
              note: "Generated AFTER execution completes, not during"
            
            - context: plan_viewer_html
              location: "plan-viewer.html"
              purpose: "Render YAML plans for human viewing"
              execution_involvement: false
              note: "Reads YAML, displays as HTML (Markdown rendering for descriptions)"
            
            - context: continuation_prompts
              location: "CONTINUATION-PROMPT.md"
              purpose: "Human handoff instructions"
              execution_involvement: false
              note: "NOT read by orchestrators during execution"
          
          forbidden_contexts:
            - "❌ Orchestrator execution logic"
            - "❌ State persistence"
            - "❌ Configuration"
            - "❌ Inter-orchestrator communication"
        
        concerns:
          - concern_1:
              issue: "Planning System v5/v6 generates .md files during execution"
              files_generated:
                - "00-{plan-name}.md (master plan)"
                - "CONTINUATION-PROMPT.md"
                - "README.md (if epic mode)"
              severity: MEDIUM
              justification: |
                These .md files are for HUMAN consumption, not orchestrator
                execution. However, they ARE generated during orchestrator
                runtime, which violates strict "no markdown in execution" rule.
          
          - concern_2:
              issue: "feature.yaml files contain markdown-formatted descriptions"
              example: "description: '# Phase 1\\n\\nImplement feature...'"
              severity: LOW
              justification: |
                YAML is execution format. Markdown is EMBEDDED as string content
                for human readability. Orchestrators read YAML structure, not
                Markdown semantics.
      
      - document: design-document.yaml
        found_references:
          - section: execution_architecture
            line: 120-145
            key_points:
              - "Master orchestrator invoked via terminal (Python entry point)"
              - "Child orchestrators loaded dynamically from registry (YAML)"
              - "Execution state persisted to SQLite (NOT files)"
              - "Progress updates via response templates (YAML → rendered)"
          
          - section: file_formats_by_layer
            line: 710-730
            layer_breakdown:
              presentation_layer:
                - "YAML: Configuration and templates"
                - "JSON: Data interchange (registry, progress tracking)"
              orchestration_layer:
                - "Python: All orchestrator implementations"
                - "YAML: Orchestrator manifests"
                - "SQLite: State persistence"
              knowledge_governance_layer:
                - "YAML: Governance rules, knowledge files"
                - "JSON: Metrics, audit logs"
              documentation_layer:
                - "Markdown: Human-readable documentation"
                - "HTML: plan-viewer.html, dashboards"
        
        validation: GOOD
        notes: |
          Clear separation: Python/YAML for execution, Markdown for documentation.
          However, planning orchestrator DOES generate .md files during execution.
      
      - document: user-requirements-48h.yaml
        found_requirements:
          - requirement_id: REQ-041
            line: 405-412
            description: "Master orchestrator controls all downstream execution"
            confidence: 1.0
            source: chat01.md
            timestamp: "2026-01-07T08:15:22Z"
          
          - requirement_id: REQ-042
            line: 413-420
            description: "Python scripts + YAML files only (no markdown in execution)"
            confidence: 0.95
            source: chat01.md (inferred from context)
            timestamp: "2026-01-07T08:20:15Z"
            note: "User explicitly stated 'No markdown files should be involved'"
  
  gap_analysis:
    severity: MEDIUM
    impact: |
      Planning Orchestrator v5/v6 generates .md files (master plan, continuation
      prompt, README) DURING execution. While these files are for human consumption
      and NOT read by orchestrators, their generation violates strict interpretation
      of "no markdown files should be involved in execution."
    
    violation_details:
      violating_component: "Planning Orchestrator v5/v6"
      violation_type: "Generates Markdown files during orchestrator execution"
      files_generated:
        - file: "00-{plan-name}.md"
          purpose: "Human-readable master plan summary"
          read_by_orchestrators: false
          justification: "Redundant with feature.yaml (authoritative source)"
        
        - file: "CONTINUATION-PROMPT.md"
          purpose: "Human handoff instructions for next execution"
          read_by_orchestrators: false
          justification: "Helpful for humans, not needed for orchestrator continuity"
        
        - file: "README.md"
          purpose: "Epic-level overview (only in epic mode)"
          read_by_orchestrators: false
          justification: "Convenience file, not authoritative"
      
      technical_alignment:
        - "✅ Orchestrators DO execute via Python scripts"
        - "✅ Configuration IS in YAML (manifests, feature.yaml)"
        - "✅ State persisted to SQLite, NOT Markdown files"
        - "✅ Inter-orchestrator communication via registry (JSON)"
        - "❌ .md files generated during execution (human-facing only)"
      
      philosophical_question: |
        Does "no markdown files should be involved" mean:
          A) No markdown files generated at any point during execution?
          B) No markdown files used AS EXECUTION ARTIFACTS (state, config, etc.)?
        
        Current design satisfies (B) but violates (A).
    
    remediation_required: true
    remediation_options:
      option_1:
        approach: "Eliminate all .md generation from Planning Orchestrator"
        changes_required:
          - "Remove 00-{plan-name}.md generation"
          - "Remove CONTINUATION-PROMPT.md generation"
          - "Remove README.md generation"
          - "Rely solely on feature.yaml + plan-viewer.html"
        effort: "4 hours (code changes + testing)"
        pros:
          - "Strict compliance with 'no markdown' requirement"
          - "Reduces file duplication (feature.yaml is authoritative)"
        cons:
          - "Loss of human-readable summary files"
          - "plan-viewer.html becomes ONLY way to view plans"
          - "Git diffs less readable (YAML vs Markdown)"
      
      option_2:
        approach: "Clarify requirement: 'No markdown in EXECUTION LOGIC'"
        changes_required:
          - "Update architecture-document.yaml to document .md generation"
          - "Clarify .md files are OUTPUTS, not execution dependencies"
          - "Confirm with user that documentation .md files acceptable"
        effort: "1 hour (documentation update)"
        pros:
          - "Preserves human-readable documentation"
          - "Technical execution remains Python/YAML only"
          - "Git history remains readable"
        cons:
          - "May not satisfy strict interpretation of user requirement"
      
      option_3:
        approach: "Post-execution .md generation (separate utility)"
        changes_required:
          - "Remove .md generation from Planning Orchestrator runtime"
          - "Create separate utility: 'generate-plan-docs' (post-execution)"
          - "Users run utility AFTER plan creation if .md files desired"
        effort: "6 hours (refactor + new utility + testing)"
        pros:
          - "Strict separation: execution = Python/YAML, docs = optional .md"
          - "User choice: generate .md summaries or not"
        cons:
          - "Extra step for users who want .md files"
          - "CONTINUATION-PROMPT.md may be needed immediately (not post-execution)"
  
  user_clarification_received:
    timestamp: '2026-01-07T12:15:00Z'
    user_response: |
      "The only time markdown should happen is when learning libraries are updated
      which should happen at the end of each planning cycle."
    
    interpretation:
      - "✅ Markdown allowed for knowledge library documentation updates"
      - "✅ Timing: End of planning cycle (not during orchestrator execution)"
      - "❌ Planning Orchestrator should NOT generate .md files during runtime"
      - "❌ No summary reports in Markdown at end of orchestrator cycles"
    
    design_impact:
      violation_confirmed: true
      severity: HIGH
      components_affected:
        - "Planning Orchestrator v5/v6 (generates 00-plan.md, CONTINUATION-PROMPT.md, README.md)"
      refactor_required: true
  
  recommended_action:
    action: "Execute Option 1 (Eliminate ALL .md Generation from Planning Orchestrator)"
    rationale: |
      User clarification confirms strict interpretation: NO .md files during
      orchestrator execution. Only exception is knowledge library updates at
      END of planning cycle (separate from orchestrator execution).
      
      Planning Orchestrator must be refactored to:
        1. Remove 00-{plan-name}.md generation
        2. Remove CONTINUATION-PROMPT.md generation
        3. Remove README.md generation
        4. Rely solely on feature.yaml + plan-viewer.html
      
      Knowledge library updates (Markdown) should be separate utility invoked
      at end of planning cycle, not during orchestrator runtime.
    
    deliverables:
      - "Refactored Planning Orchestrator v7 (no .md generation)"
      - "Knowledge library update utility (separate from orchestrator)"
      - "Updated architecture-document.yaml (document changes)"
      - "Migration guide for existing plans"
    
    estimated_effort: "6 hours (refactor + testing + documentation)"
    priority: P0
    blocking: true
    user_confirmation_received: true

