# CORTEX5 Epic - Design Document
# Holistic Design Plan with Snowball Optimization
# Generated: 2026-01-07T11:10:00Z

metadata:
  document_type: design_specification
  epic_id: cortex5-epic
  epic_version: '4.0.0'
  planning_system: v6
  generated_timestamp: '2026-01-07T11:10:00Z'
  author: CORTEX Analysis System
  review_status: DRAFT
  
design_philosophy:
  core_principles:
    - principle: "Autonomous RAG/DAG Execution"
      description: "LLM transforms user requests → invokes Python orchestrators → orchestrators execute independently"
      rationale: "Eliminates inline LLM execution; enables pure Python orchestration post-handoff"
      
    - principle: "YAML-First Design"
      description: "All orchestrators defined in YAML manifests before implementation"
      rationale: "Machine-readable specifications enable dynamic loading, validation, and lifecycle management"
      
    - principle: "Master-Child Orchestrator Hierarchy"
      description: "Single master orchestrator routes to specialized child orchestrators"
      rationale: "Separation of concerns; enables specialized intelligence per domain"
      
    - principle: "Governance-Driven Development"
      description: "SKULL rules enforced via automated middleware and CI/CD integration"
      rationale: "Prevents brittleness patterns; ensures code quality; blocks technical debt"
      
    - principle: "Knowledge-Integrated Intelligence"
      description: "3-tier knowledge system (CORTEX → knowledge library → company knowledge)"
      rationale: "Company best practices override defaults; enables domain-specific optimization"
      
    - principle: "Snowball Optimization"
      description: "Foundation-first dependency sequencing with parallel execution opportunities"
      rationale: "Maximizes value delivery velocity; unblocks dependent work early"
      
    - principle: "Production-Grade Quality"
      description: "Zero-tolerance validation; 80% test coverage; comprehensive documentation"
      rationale: "Autonomous orchestrators must be reliable in production without human supervision"
    
    - principle: "Strict Markdown Usage Policy (REQ-048)"
      description: "Markdown ONLY for knowledge library updates at END of planning cycle"
      rationale: |
        User clarification: "The only time markdown should happen is when learning
        libraries are updated which should happen at the end of each planning cycle."
        Orchestrators execute via Python/YAML only; no .md generation during runtime.
      implementation:
        - "Planning Orchestrator v7: Eliminate all .md generation"
        - "KnowledgeLibraryUpdater utility: Separate tool for knowledge updates"
        - "Timing: End of planning cycle (not during orchestrator execution)"
        - "Files removed: 00-{plan-name}.md, CONTINUATION-PROMPT.md, README.md"
        - "Authoritative source: feature.yaml files only"
      
system_architecture:
  layers:
    - layer: 1_user_interface
      name: "User Interface Layer"
      components:
        - GitHub Copilot Chat
        - CORTEX.prompt.md (intent router)
        - LLM Intent Classifier
      responsibilities:
        - Accept natural language requests
        - Classify intent with confidence scoring
        - Route to appropriate orchestrator
      
    - layer: 2_orchestration
      name: "Orchestration Layer"
      components:
        - Master Orchestrator
        - Pattern Router
        - Execution Engine
        - State Manager
      responsibilities:
        - Route requests to child orchestrators
        - Manage orchestrator lifecycle
        - Track execution state
        - Handle failures and rollbacks
      
    - layer: 3_specialized_orchestrators
      name: "Specialized Orchestrators"
      components:
        - Planning Orchestrator v5
        - Review Orchestrator v2
        - Vacuum Orchestrator v2
        - Plan Migration Orchestrator
        - MD-to-YAML Orchestrator (planned)
        - Git-to-YAML Orchestrator (planned)
        - Refactor Orchestrator v2 (planned)
        - Housekeeping Orchestrator (planned)
      responsibilities:
        - Execute domain-specific workflows
        - Generate deliverables
        - Report progress
        - Enforce governance rules
      
    - layer: 4_intelligence
      name: "Intelligence Layer"
      components:
        - Governance Middleware
        - Knowledge Integration Service
        - Audit Logging System
        - Static Analysis Integration
      responsibilities:
        - Enforce SKULL rules
        - Merge knowledge hierarchies
        - Track violations
        - Validate code quality
      
    - layer: 5_data
      name: "Data Layer"
      components:
        - Orchestrator Registry (JSON)
        - Brain State DB (SQLite)
        - Knowledge Library (YAML/MD)
        - Audit Logs (JSONL)
      responsibilities:
        - Persist orchestrator metadata
        - Store execution state
        - Provide best practices
        - Log all operations
      
orchestrator_hierarchy:
  master_orchestrator:
    name: "Master Orchestrator"
    version: "1.0.0"
    type: master
    responsibilities:
      - "Route user requests to child orchestrators"
      - "Manage orchestrator registry"
      - "Enforce user mistake prevention rules"
      - "Coordinate multi-orchestrator workflows"
      - "Provide orchestrator lifecycle management"
    intelligence_rules:
      - rule: "BLOCK_DIRECT_CREATION"
        description: "Prevent users from creating files directly; route to orchestrators"
        enforcement: pre_execution_check
        
      - rule: "YAML_FIRST_ORCHESTRATOR"
        description: "Require YAML manifest before orchestrator implementation"
        enforcement: lifecycle_validation
        
      - rule: "PATTERN_COLLISION_DETECTION"
        description: "Detect regex pattern conflicts between orchestrators"
        enforcement: registration_validation
        
      - rule: "HIERARCHY_VALIDATION"
        description: "Ensure child orchestrators don't route to themselves"
        enforcement: registration_validation
        
      - rule: "DEPRECATION_ENFORCEMENT"
        description: "Warn users when invoking deprecated orchestrators"
        enforcement: pre_execution_check
    
  child_orchestrators:
    planning_orchestrators:
      - name: "Planning Orchestrator v5"
        purpose: "Create epic and feature plans with governance enforcement"
        maturity: production
        
      - name: "Plan Migration Orchestrator"
        purpose: "Migrate plans between planning system versions"
        maturity: production
        
    quality_assurance_orchestrators:
      - name: "Review Orchestrator v2"
        purpose: "7-phase holistic validation (strategic alignment → best practices)"
        maturity: production
        
      - name: "Refactor Orchestrator v2"
        purpose: "Parent orchestrator routing to 4 refactoring children"
        maturity: planned
        children:
          - "Code Quality Child"
          - "Architecture Child"
          - "Documentation Child"
          - "Testing Child"
        
    maintenance_orchestrators:
      - name: "Vacuum Orchestrator v2"
        purpose: "Deep filesystem cleanup with duplicate detection"
        maturity: production
        
      - name: "Housekeeping Orchestrator"
        purpose: "7-phase autonomous maintenance (audit logs → tier promotion)"
        maturity: planned
        phases:
          - "Audit log analysis"
          - "Knowledge absorption"
          - "Redundancy elimination"
          - "Performance optimization"
          - "Bug detection"
          - "Tier promotion"
          - "Duplicate removal"
        
    extraction_orchestrators:
      - name: "MD-to-YAML Orchestrator"
        purpose: "Convert chat transcripts to structured requirements YAML"
        maturity: required
        warrantability: HIGH
        
      - name: "Git-to-YAML Orchestrator"
        purpose: "Extract team instructions from git commit messages"
        maturity: required
        warrantability: HIGH
    
    utility_orchestrators:
      - name: "KnowledgeLibraryUpdater"
        purpose: "Update knowledge library Markdown files at END of planning cycle"
        maturity: required
        warrantability: HIGH
        rationale: |
          Per REQ-048: Separate utility for knowledge library updates (Markdown).
          Invoked at END of planning cycle, not during orchestrator execution.
          Ensures strict separation: Python/YAML during execution, Markdown for
          post-cycle knowledge capture.
        capabilities:
          - "Extract learnings from completed plans"
          - "Update domain knowledge files"
          - "Generate best practices documentation"
          - "Update troubleshooting guides"
        timing: "Post-planning-cycle only"
        input: "Completed plan YAML files + execution logs"
        output: "Updated .md files in cortex-brain/knowledge-library/"
        
