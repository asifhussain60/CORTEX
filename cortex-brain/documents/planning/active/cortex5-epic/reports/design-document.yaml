orchestrator_design:
  md_to_yaml_orchestrator:
    name: "MD-to-YAML Orchestrator"
    version: "1.0.0"
    type: extraction
    purpose: "Convert chat transcripts to structured requirements YAML"
    
    input:
      - Chat transcript files (.md)
      - Number of files to analyze
      - Conflict resolution policy (latest timestamp wins)
      
    output:
      - requirements YAML file
      - Confidence scores (0.0-1.0)
      - Conflict detection
      - Category classification
      
    pipeline:
      - phase: 1_parsing
        name: "Parse Markdown"
        tasks:
          - "Extract user messages"
          - "Extract Copilot responses"
          - "Identify timestamps"
          - "Detect action items"
          
      - phase: 2_extraction
        name: "Extract Requirements"
        tasks:
          - "Identify explicit requirements (confidence 1.0)"
          - "Identify implicit requirements (confidence 0.5-0.9)"
          - "Classify by category (structure, governance, testing, etc.)"
          - "Assign priority (P0-P3)"
          
      - phase: 3_conflict_detection
        name: "Detect Conflicts"
        tasks:
          - "Compare requirements across files"
          - "Identify contradictions"
          - "Apply resolution policy (latest wins)"
          - "Document resolution rationale"
          
      - phase: 4_validation
        name: "Validate Output"
        tasks:
          - "Check YAML schema"
          - "Verify confidence scores"
          - "Ensure unique IDs"
          - "Validate timestamps"
          
      - phase: 5_generation
        name: "Generate YAML"
        tasks:
          - "Format as machine-readable YAML"
          - "Include metadata"
          - "Add summary statistics"
          - "Generate gap analysis"
          
    warrantability: HIGH
    production_readiness:
      - "Manifest creation"
      - "Core implementation"
      - "Unit tests (80% coverage)"
      - "Integration tests"
      - "Documentation (docstrings + README)"
      - "Registration in orchestrators.json"
      - "E2E validation"
      
  git_to_yaml_orchestrator:
    name: "Git-to-YAML Orchestrator"
    version: "1.0.0"
    type: extraction
    purpose: "Extract team instructions from git commit messages"
    
    input:
      - Git repository path
      - Number of commits to analyze (default 50)
      - Time window (e.g., "48 hours")
      - Branch name (default: current)
      
    output:
      - git-instructions YAML file
      - Instruction count
      - Implied requirements
      - Pattern analysis
      
    pipeline:
      - phase: 1_git_log
        name: "Fetch Git Log"
        tasks:
          - "Run git log command"
          - "Parse commit SHA, timestamp, author"
          - "Extract full commit messages (title + body)"
          - "Identify co-authored-by tags"
          
      - phase: 2_parsing
        name: "Parse Commit Messages"
        tasks:
          - "Identify instruction patterns (Create, Implement, Add, Document, etc.)"
          - "Extract bullet points from commit bodies"
          - "Classify by category (architecture, governance, testing, etc.)"
          - "Assign confidence based on verb strength"
          
      - phase: 3_implication_analysis
        name: "Analyze Implications"
        tasks:
          - "Infer requirements from instructions"
          - "Identify design patterns"
          - "Detect architectural decisions"
          - "Extract best practices"
          
      - phase: 4_pattern_detection
        name: "Detect Patterns"
        tasks:
          - "Identify recurring themes"
          - "Calculate pattern frequency"
          - "Classify pattern types"
          - "Generate pattern summary"
          
      - phase: 5_generation
        name: "Generate YAML"
        tasks:
          - "Format as machine-readable YAML"
          - "Include metadata"
          - "Add summary statistics"
          - "Document key patterns"
          
    warrantability: HIGH
    production_readiness:
      - "Manifest creation"
      - "Core implementation"
      - "Unit tests (80% coverage)"
      - "Integration tests"
      - "Documentation (docstrings + README)"
      - "Registration in orchestrators.json"
      - "E2E validation"
      
knowledge_integration_design:
  three_tier_hierarchy:
    tier_1_cortex_core:
      location: "cortex-brain/knowledge-library/standards/"
      contents:
        - Python best practices (PEP 8, PEP 484, PEP 257)
        - SOLID principles
        - Design patterns
        - Testing strategies
        - Security guidelines
      override_policy: "Lowest priority; overridden by tier 2 and tier 3"
      
    tier_2_knowledge_library:
      location: "cortex-brain/knowledge-library/"
      contents:
        - CORTEX-specific patterns
        - Orchestrator design guidelines
        - Brain protection rules (SKULL)
        - Planning system specifications
        - Response templates
      override_policy: "Medium priority; overrides tier 1; overridden by tier 3"
      
    tier_3_company_knowledge:
      location: "cortex-brain/tier2/company-knowledge/"
      contents:
        - Company-specific best practices
        - Domain-specific patterns
        - Internal coding standards
        - Custom governance rules
      override_policy: "Highest priority; overrides tier 1 and tier 2"
      
  merge_algorithm:
    step_1: "Load tier 1 (CORTEX core)"
    step_2: "Load tier 2 (knowledge library); merge conflicts → tier 2 wins"
    step_3: "Load tier 3 (company knowledge); merge conflicts → tier 3 wins"
    step_4: "Log merge conflicts for review"
    step_5: "Validate merged knowledge schema"
    performance_target: "<50ms for knowledge queries"
    
governance_enforcement_design:
  skull_rules:
    - rule_id: TDD_ENFORCEMENT
      description: "Tests must fail before implementation"
      enforcement_point: pre_commit_hook
      severity: CRITICAL
      
    - rule_id: HOLISTIC_DISCOVERY
      description: "Search before create (prevent duplication)"
      enforcement_point: orchestrator_execution
      severity: HIGH
      
    - rule_id: GIT_ISOLATION
      description: "CORTEX code never commits to user repos"
      enforcement_point: git_operations
      severity: CRITICAL
      
    - rule_id: PLANNING_ISOLATION
      description: "Planning commands create plans ONLY, never implement"
      enforcement_point: orchestrator_routing
      severity: HIGH
      
    - rule_id: PLAN_FILE_ORGANIZATION
      description: "All plan files MUST live in subfolders"
      enforcement_point: file_creation
      severity: MEDIUM
      
  middleware_pipeline:
    - middleware: GovernanceValidator
      position: 1
      responsibility: "Check SKULL rule compliance"
      
    - middleware: KnowledgeEnforcer
      position: 2
      responsibility: "Apply knowledge library best practices"
      
    - middleware: AuditLogger
      position: 3
      responsibility: "Log all violations to audit-logs/"
      
    - middleware: StaticAnalyzer
      position: 4
      responsibility: "Run mypy, pylint, pydocstyle, black"
      
    - middleware: TestValidator
      position: 5
      responsibility: "Verify test existence and coverage"
      
  ci_cd_integration:
    pre_commit_hooks:
      - "black --check (formatting)"
      - "isort --check (import sorting)"
      - "mypy --strict (type checking)"
      - "pydocstyle (docstring coverage)"
      
    pre_push_hooks:
      - "pytest (unit tests)"
      - "pylint --rcfile=.pylintrc (code quality)"
      - "coverage report --fail-under=80 (coverage threshold)"
      
    pr_checks:
      - "All pre-commit hooks must pass"
      - "All pre-push hooks must pass"
      - "SKULL rule violations must be zero"
      - "Audit log reviewed for critical violations"
      
