        current_implementation: |
          # Current: Minimal phase metadata
          phases.append({
              "number": phase_num,
              "name": phase_name,
              "status": "not_started",
              "estimated_hours": estimated_hours,
              "outputs": []
          })
        
        required_implementation: |
          # Enhanced: Complete modal-ready metadata
          phases.append({
              "number": phase_num,
              "name": phase_name,
              "description": phase.get("description", "No description provided"),
              "status": "not_started",
              "estimated_hours": estimated_hours,
              "actual_hours": None,
              "start_time": None,
              "end_time": None,
              "outputs": [],
              "validation_criteria": phase.get("validation", []),
              "dependencies": phase.get("dependencies", []),
              "python_executor": phase.get("python_executor", "N/A"),
              "trigger": phase.get("trigger", "N/A"),
              "root_cause": phase.get("root_cause", "N/A")
          })
        
