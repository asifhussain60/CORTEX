execution:
  mode: "sequential"  # Run phases in order
  parallelizable_phases: []  # All phases have dependencies
  
  python_scripts:
    base_path: "scripts/orchestration/"
    naming_convention: "{phase_name}.py"
    template: "scripts/templates/orchestration_script_template.py"
    
    common_imports:
      - "import os"
      - "import sys"
      - "import yaml"
      - "import json"
      - "from pathlib import Path"
      - "from typing import Dict, List, Any"
      - "from src.tier1.state_manager import StateManager"
      - "from src.tier0.brain_protector import validate_skull_rules"
    
    common_structure: |
      class {PhaseName}Executor:
          def __init__(self, plan_path: str, state_db: StateManager):
              self.plan_path = Path(plan_path)
              self.state_db = state_db
              self.config = self._load_plan_config()
          
          def _load_plan_config(self) -> Dict:
              with open(self.plan_path / "00-c150-remediation-plan.yaml") as f:
                  return yaml.safe_load(f)
          
          def execute(self) -> Dict[str, Any]:
              # Phase-specific implementation
              pass
          
          def validate(self) -> bool:
              # Phase-specific validation
              pass
      
      if __name__ == "__main__":
          executor = {PhaseName}Executor(
              plan_path="cortex-brain/documents/planning/active/c150-remediation-plan",
              state_db=StateManager()
          )
          result = executor.execute()
          if executor.validate():
              print("✅ Phase {number} complete")
          else:
              print("❌ Phase {number} validation failed")
              sys.exit(1)
  
