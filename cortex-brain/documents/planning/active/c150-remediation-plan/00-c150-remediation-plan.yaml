# Lessons learned (for future plans)
lessons_learned:
  from_c150_gaps:
    - "Never mark plan 'complete' before acceptance criteria validation"
    - "Run brittleness tests BEFORE generating completion certificate"
    - "Test orchestrator instantiation before documenting"
    - "Deployment validation is mandatory, not optional"
    - "Document what EXISTS, not what's PLANNED"
    - "Separate gap analysis from gap remediation"
    - "Automate acceptance criteria validation"
    - "Cross-reference completion claims with artifacts"
  
  for_future_plans:
    - "Create validate_acceptance_criteria.py FIRST"
    - "Run brittleness tests at Phase N-1 (before completion)"
    - "Require deployment validation for infrastructure plans"
    - "Test ALL documented features instantiate/function"
    - "Use Python execution orchestration for complex plans"
    - "YAML-based plans enable better automation"
    - "Progress tracking via JSON state files"
    - "Phase -2 setup verification catches false positives early"
    - "Phase N+1 teardown ensures no orphaned code"
