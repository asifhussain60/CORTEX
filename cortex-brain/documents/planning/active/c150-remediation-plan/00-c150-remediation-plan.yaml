            rationale: "Phase 15 changes are cosmetic, must not break execution"
          
          - name: "test_manifest_loading_unchanged"
            validates: "Manifest YAML files load and parse correctly"
            rationale: "Terminology changes don't affect manifest structure"
          
          - name: "test_skull_rules_still_enforced"
            validates: "Brain protection rules still apply after documentation updates"
