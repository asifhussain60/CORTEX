  - number: 15
    name: "Fix CORTEX.prompt.md Architectural Misrepresentation (GAP-ARCH-1)"
    description: "Correct prompt file to accurately describe Copilot-as-executor architecture"
    estimated_hours: 4.0
    python_executor: "scripts/orchestration/fix_cortex_prompt_architecture.py"
    trigger: "chat02.md analysis - User reported 'handoff still not working'"
    root_cause: "CORTEX.prompt.md v5.1.0 claims Python orchestrators execute autonomously, but GitHub Copilot IS the executor"
    file_to_update: ".github/prompts/CORTEX.prompt.md"
    changes_required:
      terminology_updates:
        - old: "🛡️ AUTONOMOUS Orchestrators (ALL Orchestrators Self-Execute)"
          new: "🎯 MANIFEST-GUIDED Orchestrators (GitHub Copilot Executes)"
        
        - old: "GitHub Copilot routes and stops. Python orchestrators execute."
          new: "GitHub Copilot routes and executes using manifest guidance."
        
        - old: "⚠️ **HAND-OFF PROTOCOL ENGAGED** - Orchestrator executing autonomously..."
          new: "⚠️ **ROUTING COMPLETE** - GitHub Copilot will now execute the orchestrator workflow."
        
        - old: "**DO NOT proceed.** Python orchestrator has taken over."
          new: "**Proceeding with execution** using manifest guidance from {manifest_file}."
        
        - old: "YOU MUST NOT: Execute tasks yourself"
          new: "YOU MUST: Execute tasks using manifest instructions as guidance"
        
        - old: "Visual Confirmation: User sees 🛡️ = Correct protocol"
          new: "Visual Confirmation: User sees 🎯 = Routing complete, Copilot executing"
      
      architecture_clarification:
        - section: "Execution Protocol"
          add: |
            **CRITICAL ARCHITECTURE CLARIFICATION:**
            
            CORTEX is an **AI assistant pattern**, NOT a CLI tool with background processes.
            
            **Execution Flow:**
            1. GitHub Copilot routes request to orchestrator manifest
            2. GitHub Copilot reads manifest YAML
            3. GitHub Copilot executes workflow using manifest as guidance
            4. GitHub Copilot creates files, updates state, generates reports
            5. Result: Work completed by GitHub Copilot
            
            **NO separate Python processes. NO autonomous execution. NO external hand-off.**
            
            **Manifests provide:**
            - Phase definitions (what to do)
            - Validation rules (how to verify)
            - Output specifications (what to create)
            - Python script paths (for FUTURE CLI implementation, currently guidance only)
        
        - section: "Hand-Off Protocol"
          replace: "Hand-off means: Stop and let Python execute"
          with: "Routing means: Load manifest and execute workflow yourself"
      
      icon_changes:
        - old_icon: "🛡️ (Shield = Autonomous protection)"
          new_icon: "🎯 (Target = Routing to correct workflow)"
          rationale: "Shield implies external protection/execution, Target implies routing destination"
      
      examples_to_update:
        - example: "Planning Request (AUTONOMOUS)"
          change: "Step 4: Display routing message with 🛡️ + STOP (Python Planning v5 executes autonomously)"
          to: "Step 4: Display routing message with 🎯 + Load planning-system-5.0-manifest.yaml + Execute phases 0-N"
        
        - example: "TDD Request (AUTONOMOUS)"
          change: "Step 4: Display routing message with 🛡️ + STOP (Python TDD v2 executes autonomously)"
          to: "Step 4: Display routing message with 🎯 + Load tdd-orchestrator-v4-manifest.yaml + Execute RED→GREEN→REFACTOR"
      
      related_files_to_update:
        - file: "cortex-brain/documents/orchestrators-quick-ref.md"
          changes:
            - "Replace all '🛡️ AUTONOMOUS' with '🎯 MANIFEST-GUIDED'"
            - "Update 'Python is executing' to 'GitHub Copilot executing using manifest'"
            - "Clarify progress bars are rendered BY Copilot, not by Python"
        
        - file: "cortex-brain/response-templates-v4.yaml"
          changes:
            - "Rename 'autonomous_execution_progress' to 'manifest_guided_execution_progress'"
            - "Update template description to clarify Copilot renders, not Python"
        
        - file: "cortex-brain/documents/cortex-architecture-quick-ref.md"
          changes:
            - "Update execution flow diagrams to show Copilot as executor"
            - "Remove references to 'autonomous Python processes'"
    
    validation:
      - "CORTEX.prompt.md no longer claims 'DO NOT proceed'"
      - "All references to 'autonomous execution' replaced with 'manifest-guided execution'"
      - "Architecture section clearly states Copilot IS the executor"
      - "No misleading claims about background Python processes"
      - "Icon changed from 🛡️ to 🎯"
      - "orchestrators-quick-ref.md updated consistently"
      - "response-templates-v4.yaml template renamed"
    
    skull_tests_required:
      - test_file: "tests/tier0/test_skull_orchestrator_architecture.py"
        description: "P0 SKULL tests protecting against architectural misrepresentation"
        test_cases:
          - name: "test_cortex_prompt_no_do_not_proceed"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "CORTEX.prompt.md does not claim 'DO NOT proceed' after routing"
            rationale: "Prevents user confusion about hand-off mechanism"
          
          - name: "test_no_autonomous_execution_claims"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "No references to 'autonomous execution' or 'Python orchestrators execute'"
            rationale: "Prevents false expectations of background Python processes"
          
          - name: "test_copilot_as_executor_documented"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "Documentation clearly states GitHub Copilot IS the executor"
            rationale: "Ensures accurate architecture representation"
          
          - name: "test_manifest_guided_terminology"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "Uses 'manifest-guided' terminology instead of 'autonomous'"
            rationale: "Accurate terminology prevents misconceptions"
          
          - name: "test_routing_icon_consistency"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "warning"
            validates: "Uses 🎯 (target) icon consistently, not 🛡️ (shield)"
            rationale: "Visual consistency reinforces correct mental model"
          
          - name: "test_orchestrator_quick_ref_consistency"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "orchestrators-quick-ref.md matches CORTEX.prompt.md architecture"
            rationale: "Prevents documentation drift"
          
          - name: "test_response_template_renamed"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "response-templates-v4.yaml uses 'manifest_guided_execution_progress'"
            rationale: "Template names reflect actual execution model"
          
          - name: "test_no_cli_tool_claims"
            rule: "SKULL_ARCHITECTURE_ACCURACY"
            severity: "blocked"
            validates: "Documentation does not claim CORTEX is a CLI tool with background processes"
            rationale: "Prevents expectations of non-existent CLI functionality"
      
      - test_file: "tests/integration/test_phase15_no_regression.py"
        description: "Integration tests ensuring Phase 15 changes don't break existing functionality"
        test_cases:
          - name: "test_planning_orchestrator_still_works"
