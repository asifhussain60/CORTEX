        - field: "validation_criteria"
          purpose: "List of acceptance tests for modal checklist display"
          example: ["Planning orchestrator instantiates without errors", "Can create FEATURE-mode plans"]
        
        - field: "dependencies"
          purpose: "Show phase dependencies in modal (prerequisite phases)"
          example: [0, 15]  # Phase 1 depends on Phase 0 (setup) and Phase 15 (architecture fix)
        
        - field: "python_executor"
          purpose: "Display automation script path for transparency"
          example: "scripts/orchestration/fix_planning_v5_syntax.py"
        
        - field: "trigger"
          purpose: "Explain why phase was created (root cause context)"
          example: "SyntaxError prevents planning orchestrator instantiation"
        
        - field: "root_cause"
