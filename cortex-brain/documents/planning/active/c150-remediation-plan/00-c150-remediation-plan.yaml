      example_current_yaml: |
        phases:
          - number: 1
            name: "Fix Planning Orchestrator v5"
            status: "complete"
            estimated_hours: 4.0
            actual_hours: 3.8
            outputs: ["artifacts/planning_v5_fix.patch"]
      
      missing_fields:
        - field: "description"
