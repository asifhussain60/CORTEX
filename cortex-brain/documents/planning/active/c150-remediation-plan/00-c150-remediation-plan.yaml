    description: "Implement missing log_execution() method, standardize constructor signature"
    estimated_hours: 4.0
    python_executor: "scripts/orchestration/fix_state_manager.py"
    affected_orchestrators:
      - "tdd_orchestrator"
      - "ado_orchestrator_v2"
      - "sanitization"
      - "cleanup_v2"
      - "vacuum_v2"
    fixes:
      - action: "Add StateManager.log_execution() method"
        signature: "def log_execution(self, orchestrator: str, phase: str, status: str, metrics: Dict) -> None"
        implementation: "Log to state_db.executions table"
      
      - action: "Standardize constructor parameters"
        before: "__init__(self, config_path: str, state_db: str)"
        after: "__init__(self, state_db: StateManager, config: Dict)"
        reasoning: "Consistent with BaseOrchestratorV4_1 interface"
      
      - action: "Remove 'config_path' parameter"
        orchestrators: ["tdd_orchestrator", "sanitization"]
        replacement: "Pass config dict directly"
      
      - action: "Fix 'state_db' positional arg"
        orchestrators: ["ado_orchestrator_v2", "cleanup_v2"]
        fix: "Change to keyword arg with default"
    validation:
      - "All 6 orchestrators instantiate successfully"
      - "15 cleanup unit tests pass"
      - "67 vacuum unit tests unblocked (Python 3.9/3.10 compatibility fix separate)"
    outputs:
      - "artifacts/state_manager_interface.py"
      - "artifacts/orchestrator_fixes.patch"
      - "reports/orchestrator_instantiation_tests.md"
  
  - number: 4
    name: "Fix Python 3.9/3.10 Compatibility"
    description: "Remove walrus operators, replace match statements with if/elif"
    estimated_hours: 3.0
    python_executor: "scripts/orchestration/python_compatibility_fixer.py"
    targets:
      - "src/orchestrators/vacuum/vacuum_orchestrator_v2.py"
      - "tests/test_vacuum_v2.py"
    fixes:
      - action: "Remove walrus operators (:=)"
        pattern: "if (match := re.search(...)):"
        replacement: "match = re.search(...)\nif match:"
      
      - action: "Replace match statements"
        pattern: "match value:\n    case 'a': ...\n    case 'b': ..."
        replacement: "if value == 'a': ...\nelif value == 'b': ..."
      
      - action: "Update type hints"
        pattern: "list[str]"
        replacement: "List[str]"
    validation:
      - "Run 67 vacuum tests on Python 3.9"
      - "Run 67 vacuum tests on Python 3.10"
      - "All tests pass"
    outputs:
      - "artifacts/python39_compatibility.patch"
      - "reports/vacuum_tests_validation.md"
  
  - number: 5
    name: "Implement Runtime Governance Middleware"
    description: "Create 3 middleware files for SKULL rule enforcement (C50-20)"
    estimated_hours: 10.0
    python_executor: "scripts/orchestration/create_governance_middleware.py"
    governance_note: |
      ⚠️ SQLITE GOVERNANCE: Brain governance migrated from YAML to SQLite.
      Use GovernanceDB API (src/cortex_core/governance_db.py) to query rules from cortex-brain/tier0/governance.db
      Target: <10ms query performance
    files_to_create:
      - path: "src/orchestrators/middleware/governance_checkpoint.py"
        description: "Runtime SKULL rule enforcement using SQLite governance database"
        methods:
          - "validate_tdd_enforcement()"
          - "validate_holistic_discovery()"
          - "validate_git_isolation()"
          - "validate_hand_off_protocol()"
        implementation: |
          from src.cortex_core.governance_db import GovernanceDB
          
          class GovernanceCheckpoint:
              def __init__(self):
                  self.gov_db = GovernanceDB()
              
              def validate_tdd_enforcement(self, orchestrator: str, phase: str) -> bool:
                  """Enforce SKULL-001: TDD_ENFORCEMENT using SQLite governance DB"""
                  rule = self.gov_db.get_rule_by_id("TDD_ENFORCEMENT")
                  
                  # Check tests exist before implementation
                  if phase == "implementation":
                      test_file = self._find_test_file(orchestrator)
                      if not test_file or not self._tests_fail():
                          raise TDDViolation(f"{rule['name']}: {rule['description']}")
                  return True
              
              def validate_holistic_discovery(self, operation: str) -> bool:
                  """Enforce SKULL-002: HOLISTIC_DISCOVERY using SQLite governance DB"""
                  rule = self.gov_db.get_rule_by_id("HOLISTIC_DISCOVERY")
                  
                  if operation == "create":
                      existing = self._search_workspace()
                      if existing:
                          raise DuplicationViolation(f"{rule['name']}: {existing}")
                  return True
      
      - path: "src/orchestrators/middleware/setup_verification.py"
        description: "Phase -2 setup verification using SQLite governance DB"
        methods:
          - "verify_dependencies()"
          - "detect_false_positives()"
          - "check_cache_state()"
        implementation: |
          from src.cortex_core.governance_db import GovernanceDB
          
          class SetupVerifier:
              def __init__(self):
                  self.gov_db = GovernanceDB()
              
              def verify_dependencies(self, orchestrator: str) -> Dict[str, bool]:
                  """Test actual implementation, not just file existence (SETUP_VERIFICATION rule)"""
                  rule = self.gov_db.get_rule_by_id("SETUP_VERIFICATION")
                  results = {}
                  
                  if orchestrator == "planning_v5":
                      try:
                          from src.orchestrators.planning.planning_orchestrator_v5 import PlanningOrchestratorV5
                          orch = PlanningOrchestratorV5(state_db=None)
                          results["planning_v5"] = True
                      except Exception as e:
                          results["planning_v5"] = False
                          results["error"] = str(e)
                          results["rule_violated"] = rule["id"]
                  return results
      
      - path: "src/orchestrators/middleware/teardown_refactor.py"
        description: "Phase N+1 teardown + REFACTOR using SQLite governance DB"
        methods:
          - "whole_file_cleanup()"
          - "remove_orphaned_code()"
          - "git_commit()"
        implementation: |
          from src.cortex_core.governance_db import GovernanceDB
          
          class TeardownRefactor:
              def __init__(self):
                  self.gov_db = GovernanceDB()
              
              def whole_file_cleanup(self, modified_files: List[str]) -> Dict:
                  """Enforce FINAL_REFACTOR rule using SQLite governance DB"""
                  rule = self.gov_db.get_rule_by_id("FINAL_REFACTOR")
                  results = {}
                  
                  for file in modified_files:
                      results[file] = {
                          "unused_imports_removed": self._remove_unused_imports(file),
                          "orphaned_code_removed": self._remove_orphaned_code(file),
                          "formatted": self._format_code(file),
                          "rule_applied": rule["id"]
                      }
                  return results
    validation:
      - "All 3 files created"
      - "Unit tests for each middleware class"
      - "Integration test with planning_v5 orchestrator"
      - "Verify cortex-brain/tier0/governance.db exists and is readable"
      - "Verify GovernanceDB().get_rule_by_id() returns valid rule data"
      - "Verify query performance <10ms"
    outputs:
      - "artifacts/governance_middleware/"
      - "reports/governance_middleware_tests.md"
  
