  phase_7:
    name: "Integration Tests & End-to-End Validation"
    description: "Comprehensive integration tests validating entire flow with real git repos"
    estimated_hours: 4
    dependencies: ["phase_6"]
    
    user_stories:
      - story: "As a developer, I want integration tests so I know the full pipeline works"
        acceptance: "Tests cover: trigger → git scan → filter → capture → dedupe → write → docsify"
      
      - story: "As a developer, I want edge case coverage so production issues are minimized"
        acceptance: "Tests handle: no commits, no candidates, all skipped, duplicates, write errors"
    
    test_scenarios:
      scenario_1_happy_path:
        name: "Complete flow with valid commit"
        setup:
          - "Create temp git repo"
          - "Make commit with >100 lines (triggers heuristic)"
          - "Mock user prompts with valid responses"
        
        execution:
          - "Trigger 'update learning library'"
          - "System scans git, finds 1 candidate"
          - "User provides lesson details via prompts"
          - "No duplicates found"
          - "Lesson appended to YAML"
        
        assertions:
          - "lessons-learned.yaml contains new lesson"
          - "total_lessons incremented"
          - "last_updated timestamp updated"
          - "Backup file created"
          - "Docsify dashboard shows new lesson (HTTP check)"
      
      scenario_2_no_commits:
        name: "No commits in timeframe"
        setup:
          - "Create temp git repo"
          - "No commits in last 24h"
        
        execution:
          - "Trigger 'update learning library'"
        
        assertions:
          - "Returns friendly message: 'No commits found in last 24h'"
          - "No YAML modifications"
      
      scenario_3_no_candidates:
        name: "Commits exist but none match heuristics"
        setup:
          - "Create commit with 5 lines (below threshold)"
        
        execution:
          - "Trigger 'update learning library'"
        
        assertions:
          - "Returns: 'No learning-worthy commits found'"
          - "Explains heuristics: line count, test changes, keywords"
      
      scenario_4_all_skipped:
        name: "User skips all candidates"
        setup:
          - "Create 3 commits matching heuristics"
          - "Mock user input: 'skip' for all"
        
        execution:
          - "System presents 3 candidates"
          - "User skips all"
        
        assertions:
          - "Returns: 'All candidates skipped'"
          - "No YAML modifications"
      
      scenario_5_duplicate_found:
        name: "New lesson matches existing (>70% similarity)"
        setup:
          - "Existing lesson: 'File validation bug'"
          - "New commit: 'Fix validation issue in FileProcessor'"
          - "Mock user chooses 'merge'"
        
        execution:
          - "Duplication detector finds match (score 0.82)"
          - "Shows existing lesson"
          - "User chooses merge"
        
        assertions:
          - "Existing lesson updated, not duplicated"
          - "total_lessons unchanged"
      
      scenario_6_yaml_write_failure:
        name: "Rollback on write error"
        setup:
          - "Make lessons-learned.yaml read-only"
          - "Valid lesson captured"
        
        execution:
          - "Attempt to write"
          - "Permission denied error"
        
        assertions:
          - "Error message shown to user"
          - "Backup restored (if created)"
          - "No partial corruption"
      
      scenario_7_invalid_timeframe:
        name: "Handle invalid timeframe parameter"
        setup:
          - "User: 'update learning library last -5 hours'"
        
        execution:
          - "Parse timeframe"
        
        assertions:
          - "Returns error: 'Invalid timeframe: must be positive'"
      
      scenario_8_docsify_reflection:
        name: "Verify Docsify dashboard reflects changes"
        setup:
          - "Launch learning dashboard"
          - "Append new lesson"
        
        execution:
          - "Refresh browser"
          - "Search for new lesson title"
        
        assertions:
          - "HTTP GET returns 200"
          - "HTML contains new lesson title"
          - "Sidebar shows updated count"
    
    tdd_requirements:
      integration_tests:
        - test: "test_e2e_happy_path_complete_flow"
          description: "End-to-end: trigger → append → docsify verification"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_no_commits_found"
          description: "Graceful handling when git history empty"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_no_candidates_match_heuristics"
          description: "No commits meet learning-worthy criteria"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_all_candidates_skipped"
          description: "User skips all presented candidates"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_duplicate_detected_and_merged"
          description: "Duplication detector finds match, user merges"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_yaml_write_failure_rollback"
          description: "Rollback when write fails (permission, disk full)"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_invalid_timeframe_parameter"
          description: "Handle negative/zero/invalid timeframe"
          file: "tests/integration/test_learning_library_update_e2e.py"
        
        - test: "test_e2e_docsify_dashboard_reflection"
          description: "Verify dashboard HTTP endpoint serves new lesson"
          file: "tests/integration/test_learning_library_update_e2e.py"
      
      test_infrastructure:
        - "Temp git repo fixture with commit helpers"
        - "YAML file fixture with backup/restore"
        - "Mock prompt fixture (avoids blocking on input)"
        - "HTTP client for Docsify verification"
        - "Cleanup: remove temp files, reset state"
    
    definition_of_done:
      - "All 8 integration tests written and passing"
      - "Code coverage >85% across all learning modules"
      - "Edge cases handled gracefully"
      - "Error messages actionable and user-friendly"
      - "Performance acceptable (<5 seconds for 100 commits)"
      - "Docsify integration verified (HTTP check)"
      - "Git checkpoint created"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "Integration tests cover real-world scenarios"
      
