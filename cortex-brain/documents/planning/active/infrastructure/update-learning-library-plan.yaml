# Update Learning Library - Implementation Plan
# Feature: Git-based learning capture with interactive refinement
# Version: 1.0.0
# Created: 2025-12-07
# Author: Asif Hussain

metadata:
  feature_name: "Update Learning Library"
  feature_id: "update-learning-library-001"
  version: "1.0.0"
  target_release: "CORTEX 3.9"
  status: "approved"
  priority: "high"
  estimated_effort_hours: 24
  created_date: "2025-12-07"
  approved_date: "2025-12-07"

overview:
  description: |
    Create "Update Learning Library" orchestrator that scans git history for a timeframe,
    identifies learning-worthy commits using heuristics, guides user through interactive
    lesson capture, checks for duplicates, and appends to lessons-learned.yaml.
    
    Docsify dashboard auto-reflects changes (no generation needed - it's a viewer).
  
  business_value:
    - "Systematic capture of debugging insights and solutions"
    - "Prevent repeated mistakes through documented prevention rules"
    - "Build institutional knowledge from daily development work"
    - "Reduce time spent re-solving known problems"
  
  technical_approach:
    - "Hybrid: Git automation + human insight"
    - "Reuse existing GitMetricsCollector (Tier 3)"
    - "Leverage KnowledgeGraph FTS5 for duplication detection"
    - "Interactive prompts ensure quality over automation"
    - "YAML validation prevents schema corruption"
  
  key_components:
    - component: "LearningLibrarianAgent"
      path: "src/cortex_agents/learning_librarian_agent.py"
      purpose: "Specialist agent for learning operations"
    
    - component: "UpdateLearningLibraryModule"
      path: "src/operations/modules/learning/update_learning_library_module.py"
      purpose: "Core orchestrator - git scan, filter, capture, validate, write"
    
    - component: "Intent Registration"
      path: "cortex-operations.yaml"
      purpose: "Entry point with natural language triggers"
    
    - component: "Response Template"
      path: "cortex-brain/response-templates-v4.yaml"
      purpose: "Formatted responses for learning operations"

definition_of_ready:
  requirements:
    - requirement: "Git history scanning capability exists (GitMetricsCollector)"
      status: "✅ READY"
      evidence: "src/tier3/metrics/git_metrics.py"
    
    - requirement: "YAML file structure documented (lessons-learned.yaml schema)"
      status: "✅ READY"
      evidence: "cortex-brain/learning/lessons-learned.yaml (1188 lines, 20 lessons)"
    
    - requirement: "FTS5 search available for duplication detection"
      status: "✅ READY"
      evidence: "src/tier2/knowledge_graph.py has FTS5 virtual table"
    
    - requirement: "Docsify dashboard exists and serves YAML-based content"
      status: "✅ READY"
      evidence: "cortex-brain/dashboards/learning/ + learning_dashboard_launcher.py"
    
    - requirement: "Agent framework supports new specialist agents"
      status: "✅ READY"
      evidence: "src/cortex_agents/base_agent.py + agent registration pattern"
    
    - requirement: "TDD infrastructure ready (pytest, coverage, test isolation)"
      status: "✅ READY"
      evidence: "pytest.ini enforces CORTEX-only test discovery"

definition_of_done:
  acceptance_criteria:
    - criterion: "User can trigger 'update learning library' from natural language"
      validation: "cortex-operations.yaml has triggers + intent routing works"
    
    - criterion: "System scans git history for configurable timeframe (default 24h)"
      validation: "Subprocess calls git log with --since parameter"
    
    - criterion: "Heuristics identify learning-worthy commits (>100 lines, test changes, errors)"
      validation: "Filter returns candidates with confidence scores"
    
    - criterion: "Interactive prompts guide user through structured capture"
      validation: "5 prompts: problem, root_cause, solution, prevention_rules, time_cost"
    
    - criterion: "FTS5 search detects potential duplicates with >70% keyword overlap"
      validation: "Shows existing lessons before appending new ones"
    
    - criterion: "YAML writer validates schema before appending"
      validation: "PyYAML loads, validates structure, appends, writes safely"
    
    - criterion: "Docsify dashboard reflects changes without manual action"
      validation: "Refresh browser shows new lessons (file-based, no generation)"
    
    - criterion: "All phases follow RED→GREEN→REFACTOR with tests first"
      validation: "Git history shows test commits before implementation commits"
    
    - criterion: "Integration tests validate end-to-end flow"
      validation: "tests/integration/test_learning_library_update_e2e.py passes"
    
    - criterion: "Brain Protector validates against SKULL rules"
      validation: "No TDD violations, no root-level docs, proper test isolation"

phases:
  # Phases added incrementally following INCREMENTAL_PLAN_GENERATION instinct
  
  phase_1:
    name: "Git History Scanner"
    description: "Scan git history for specified timeframe and extract commit metadata"
    estimated_hours: 3
    dependencies: []
    
    user_stories:
      - story: "As a user, I want to scan last 24 hours of git commits so I can review recent work"
        acceptance: "System extracts commits with timestamps, messages, files changed, line counts"
      
      - story: "As a user, I want to configure timeframe so I can scan different periods"
        acceptance: "Accepts hours/days parameter, defaults to 24h"
    
    tdd_requirements:
      red_phase:
        - test: "test_scan_git_history_default_24h"
          description: "Verify default 24h scan returns commits from last day"
          file: "tests/operations/learning/test_git_history_scanner.py"
        
        - test: "test_scan_git_history_custom_timeframe"
          description: "Verify custom timeframe (48h, 7d) works correctly"
          file: "tests/operations/learning/test_git_history_scanner.py"
        
        - test: "test_extract_commit_metadata"
          description: "Verify extracted metadata includes: sha, message, author, timestamp, files, lines"
          file: "tests/operations/learning/test_git_history_scanner.py"
        
        - test: "test_handle_non_git_directory"
          description: "Verify graceful failure when not in git repo"
          file: "tests/operations/learning/test_git_history_scanner.py"
      
      green_phase:
        implementation_file: "src/operations/modules/learning/git_history_scanner.py"
        key_functions:
          - "scan_commits(repo_path, since_hours=24)"
          - "extract_commit_metadata(commit_sha)"
          - "parse_git_log_output(log_text)"
        
        integration_points:
          - "Reuse subprocess.run() pattern from GitMetricsCollector"
          - "Parse git log --numstat output for line counts"
          - "Handle git errors (not a repo, no commits)"
      
      refactor_phase:
        - "Extract timeframe parsing to utility function"
        - "Cache git log output to avoid repeated subprocess calls"
        - "Add logging for debugging (commits found, timeframe, errors)"
    
    definition_of_done:
      - "All 4 RED tests written and failing"
      - "Implementation passes all tests"
      - "Code coverage >90% for git_history_scanner.py"
      - "Refactored with no duplication"
      - "Git checkpoint created: 'CORTEX-TDD: phase-RED' → 'phase-GREEN' → 'phase-REFACTOR'"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "Git history shows test commits before implementation"
      
      - rule: "TEST_LOCATION_SEPARATION"
        validation: "Tests in tests/operations/learning/ (CORTEX tests in CORTEX repo)"
      
      - rule: "GIT_CHECKPOINT_ENFORCEMENT"
        validation: "3 commits for RED/GREEN/REFACTOR phases"
  
  phase_2:
    name: "Heuristic Commit Filter"
    description: "Identify learning-worthy commits using heuristics (line count, test changes, error patterns)"
    estimated_hours: 4
    dependencies: ["phase_1"]
    
    user_stories:
      - story: "As a user, I want system to identify significant commits so I don't review trivial changes"
        acceptance: "Filter returns commits with >100 lines changed OR test file modifications OR error-related keywords"
      
      - story: "As a user, I want confidence scores so I can prioritize which commits to review"
        acceptance: "Each candidate has score 0.0-1.0 based on heuristic strength"
    
    heuristics:
      line_count:
        threshold: 100
        weight: 0.3
        description: "Large commits likely involve significant work"
      
      test_changes:
        patterns: ["test_*.py", "*_test.py", "tests/"]
        weight: 0.4
        description: "Test changes indicate problem-solving"
      
      error_keywords:
        patterns: ["fix", "bug", "error", "crash", "fail", "debug", "issue"]
        weight: 0.5
        description: "Error-related commits capture lessons learned"
      
      refactor_keywords:
        patterns: ["refactor", "cleanup", "optimize", "improve"]
        weight: 0.3
        description: "Refactorings document better approaches"
    
    tdd_requirements:
      red_phase:
        - test: "test_filter_by_line_count"
          description: "Verify commits >100 lines marked as candidates"
          file: "tests/operations/learning/test_commit_filter.py"
        
        - test: "test_filter_by_test_changes"
          description: "Verify commits touching test files marked as candidates"
          file: "tests/operations/learning/test_commit_filter.py"
        
        - test: "test_filter_by_error_keywords"
          description: "Verify commits with 'fix', 'bug', etc. marked as candidates"
          file: "tests/operations/learning/test_commit_filter.py"
        
        - test: "test_calculate_confidence_score"
          description: "Verify weighted scoring: test_changes=0.4, error=0.5, lines=0.3"
          file: "tests/operations/learning/test_commit_filter.py"
        
        - test: "test_rank_candidates_by_score"
          description: "Verify candidates sorted by confidence descending"
          file: "tests/operations/learning/test_commit_filter.py"
      
      green_phase:
        implementation_file: "src/operations/modules/learning/commit_filter.py"
        key_functions:
          - "filter_learning_candidates(commits: List[CommitMetadata]) -> List[Candidate]"
          - "calculate_confidence_score(commit: CommitMetadata) -> float"
          - "match_heuristics(commit: CommitMetadata) -> Dict[str, bool]"
        
        integration_points:
          - "Receives commits from GitHistoryScanner"
          - "Returns ranked candidates with scores"
          - "Configurable heuristics via YAML config"
      
      refactor_phase:
        - "Extract heuristic definitions to config file"
        - "Make weights configurable per-user"
        - "Add explanation field: why this commit is a candidate"
    
    definition_of_done:
      - "All 5 RED tests written and failing"
      - "Implementation passes all tests"
      - "Code coverage >90% for commit_filter.py"
      - "Heuristics extracted to config YAML"
      - "Git checkpoint created for RED/GREEN/REFACTOR"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "Tests written before filter implementation"
      
      - rule: "MACHINE_READABLE_FORMATS"
        validation: "Heuristics stored in YAML, not hardcoded"
  
  phase_3:
    name: "Interactive Lesson Capture"
    description: "Guide user through structured prompts to capture high-quality lessons"
    estimated_hours: 5
    dependencies: ["phase_2"]
    
    user_stories:
      - story: "As a user, I want guided prompts so I capture complete lessons"
        acceptance: "System prompts for: problem, root_cause, solution, prevention_rules, time_cost"
      
      - story: "As a user, I want to see commit context so I remember what happened"
        acceptance: "Shows commit message, files changed, line counts before prompting"
      
      - story: "As a user, I want to skip candidates so I don't document everything"
        acceptance: "Can type 'skip' to move to next candidate"
    
    prompt_flow:
      - step: 1
        prompt: "Show commit context (message, files, lines)"
        purpose: "Refresh user's memory"
      
      - step: 2
        prompt: "What problem were you solving?"
        field: "problem"
        validation: "min_length: 20 chars"
      
      - step: 3
        prompt: "What was the root cause?"
        field: "root_cause"
        validation: "min_length: 20 chars"
      
      - step: 4
        prompt: "How did you solve it?"
        field: "solution"
        validation: "min_length: 20 chars"
      
      - step: 5
        prompt: "What prevention rules apply? (comma-separated)"
        field: "prevention_rules"
        validation: "min_items: 1"
      
      - step: 6
        prompt: "How long did debugging/implementation take? (minutes)"
        field: "time_cost.total_cost_minutes"
        validation: "numeric, min: 1"
      
      - step: 7
        prompt: "Add tags for categorization? (comma-separated)"
        field: "tags"
        validation: "optional"
    
    tdd_requirements:
      red_phase:
        - test: "test_prompt_for_problem_description"
          description: "Verify problem prompt shown and input captured"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_prompt_for_root_cause"
          description: "Verify root_cause prompt and validation (min 20 chars)"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_prompt_for_solution"
          description: "Verify solution prompt captures implementation details"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_prompt_for_prevention_rules"
          description: "Verify prevention_rules accepts comma-separated list"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_prompt_for_time_cost"
          description: "Verify time_cost validation (numeric, positive)"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_skip_candidate"
          description: "Verify 'skip' command moves to next candidate"
          file: "tests/operations/learning/test_lesson_capture.py"
        
        - test: "test_show_commit_context"
          description: "Verify commit message, files, lines displayed before prompts"
          file: "tests/operations/learning/test_lesson_capture.py"
      
      green_phase:
        implementation_file: "src/operations/modules/learning/lesson_capture.py"
        key_functions:
          - "capture_lesson(candidate: Candidate) -> Optional[LessonData]"
          - "prompt_user(question: str, validation: Dict) -> str"
          - "show_commit_context(candidate: Candidate)"
          - "validate_input(value: str, rules: Dict) -> bool"
        
        integration_points:
          - "Receives candidates from CommitFilter"
          - "Returns structured lesson data"
          - "Uses response templates for formatted prompts"
      
      refactor_phase:
        - "Extract prompt definitions to YAML template"
        - "Add retry logic for validation failures"
        - "Support multi-line input for long descriptions"
        - "Add preview: show captured lesson before confirming"
    
    definition_of_done:
      - "All 7 RED tests written and failing"
      - "Implementation passes all tests"
      - "Code coverage >90% for lesson_capture.py"
      - "Prompts extracted to response template"
      - "User can skip, retry, or confirm lessons"
      - "Git checkpoint created for RED/GREEN/REFACTOR"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "Prompt tests before implementation"
      
      - rule: "MACHINE_READABLE_FORMATS"
        validation: "Prompt templates in YAML, not hardcoded strings"
  
  phase_4:
    name: "Duplication Detection (FTS5)"
    description: "Search existing lessons-learned.yaml for duplicates using FTS5 full-text search"
    estimated_hours: 4
    dependencies: ["phase_3"]
    
    user_stories:
      - story: "As a user, I want duplicate detection so I don't add redundant lessons"
        acceptance: "System searches existing lessons for similar content"
      
      - story: "As a user, I want to see potential duplicates so I can decide whether to add lesson"
        acceptance: "Shows matching lessons with similarity scores"
      
      - story: "As a user, I want to merge with existing lesson so I can enhance rather than duplicate"
        acceptance: "Option to append to existing lesson instead of creating new one"
    
    duplication_algorithm:
      method: "FTS5 keyword search with TF-IDF scoring"
      
      steps:
        - step: 1
          action: "Extract keywords from new lesson (problem + solution + tags)"
          implementation: "Use stopword removal, stemming"
        
        - step: 2
          action: "Query Tier 2 KnowledgeGraph FTS5 patterns table"
          implementation: "Search against existing lesson titles + problems"
        
        - step: 3
          action: "Calculate similarity score (0.0-1.0)"
          implementation: "Keyword overlap / total unique keywords"
        
        - step: 4
          action: "Show matches with score >0.7 (70% similarity)"
          implementation: "Present to user with merge/skip/continue options"
      
      thresholds:
        high_similarity: 0.85  # Very likely duplicate
        medium_similarity: 0.70  # Possible duplicate
        low_similarity: 0.50  # Loosely related
    
    tdd_requirements:
      red_phase:
        - test: "test_extract_keywords_from_lesson"
          description: "Verify keyword extraction removes stopwords, stems words"
          file: "tests/operations/learning/test_duplication_detector.py"
        
        - test: "test_search_existing_lessons_fts5"
          description: "Verify FTS5 query returns matching lessons"
          file: "tests/operations/learning/test_duplication_detector.py"
        
        - test: "test_calculate_similarity_score"
          description: "Verify score = overlapping_keywords / total_unique_keywords"
          file: "tests/operations/learning/test_duplication_detector.py"
        
        - test: "test_filter_by_similarity_threshold"
          description: "Verify only matches >0.7 returned"
          file: "tests/operations/learning/test_duplication_detector.py"
        
        - test: "test_no_duplicates_found"
          description: "Verify returns empty list when no matches"
          file: "tests/operations/learning/test_duplication_detector.py"
        
        - test: "test_rank_duplicates_by_score"
          description: "Verify results sorted by similarity descending"
          file: "tests/operations/learning/test_duplication_detector.py"
      
      green_phase:
        implementation_file: "src/operations/modules/learning/duplication_detector.py"
        key_functions:
          - "detect_duplicates(lesson: LessonData) -> List[DuplicateMatch]"
          - "extract_keywords(text: str) -> List[str]"
          - "search_fts5(keywords: List[str]) -> List[ExistingLesson]"
          - "calculate_similarity(new_keywords: Set, existing_keywords: Set) -> float"
        
        integration_points:
          - "Receives lesson from LessonCapture"
          - "Queries Tier 2 KnowledgeGraph"
          - "Returns ranked duplicate candidates"
          - "Supports merge/skip/continue decision"
      
      refactor_phase:
        - "Extract keyword extraction to shared utility"
        - "Cache FTS5 queries to avoid repeated searches"
        - "Add explanation: which keywords caused the match"
        - "Support configurable similarity thresholds"
    
    definition_of_done:
      - "All 6 RED tests written and failing"
      - "Implementation passes all tests"
      - "Code coverage >90% for duplication_detector.py"
      - "Integration with Tier 2 KnowledgeGraph verified"
      - "User workflow supports merge/skip/continue"
      - "Git checkpoint created for RED/GREEN/REFACTOR"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "Duplication tests before implementation"
      
      - rule: "DISTRIBUTED_DATABASE_ARCHITECTURE"
        validation: "Uses Tier 2 KnowledgeGraph, not monolithic DB"
  
  phase_5:
    name: "YAML Writer & Validator"
    description: "Safely append new lessons to lessons-learned.yaml with schema validation"
    estimated_hours: 4
    dependencies: ["phase_4"]
    
    user_stories:
      - story: "As a user, I want lessons appended safely so existing data isn't corrupted"
        acceptance: "Backup created, YAML validated before write, atomic operation"
      
      - story: "As a user, I want schema validation so malformed lessons are rejected"
        acceptance: "Validates required fields, data types, structure before append"
      
      - story: "As a user, I want automatic ID generation so lessons have unique identifiers"
        acceptance: "Generates IDs like 'git-learning-001', 'git-learning-002'"
    
    yaml_schema:
      required_fields:
        - "id"  # Format: {category}-{sequence}
        - "title"
        - "category"
        - "severity"
        - "date"
        - "problem"
        - "root_cause"
        - "solution"
        - "prevention_rules"
        - "time_cost"
      
      optional_fields:
        - "subcategory"
        - "symptoms"
        - "code_example"
        - "related_files"
        - "related_operations"
        - "tags"
        - "pattern_id"
        - "confidence"
        - "reusability"
      
      validation_rules:
        id:
          pattern: "^[a-z0-9-]+$"
          unique: true
        
        severity:
          allowed: ["critical", "high", "medium", "low", "info"]
        
        date:
          format: "YYYY-MM-DD"
        
        time_cost:
          type: "object"
          required: ["total_cost_minutes"]
    
    safety_protocol:
      - step: 1
        action: "Create backup: lessons-learned.yaml.backup"
        rollback: "Restore from backup on failure"
      
      - step: 2
        action: "Load existing YAML, validate structure"
        rollback: "Abort if existing YAML corrupted"
      
      - step: 3
        action: "Generate unique ID (check for collisions)"
        rollback: "Increment sequence until unique"
      
      - step: 4
        action: "Validate new lesson against schema"
        rollback: "Reject if validation fails, show errors"
      
      - step: 5
        action: "Append to lessons array"
        rollback: "Don't modify original on validation failure"
      
      - step: 6
        action: "Update metadata (total_lessons, last_updated)"
        rollback: "Increment count, set timestamp"
      
      - step: 7
        action: "Write atomically (temp file + rename)"
        rollback: "Restore backup if write fails"
    
    tdd_requirements:
      red_phase:
        - test: "test_validate_lesson_schema_valid"
          description: "Verify valid lesson passes schema validation"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_validate_lesson_schema_missing_required"
          description: "Verify missing required field rejected"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_validate_lesson_schema_invalid_severity"
          description: "Verify invalid severity value rejected"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_generate_unique_id"
          description: "Verify ID generation: git-learning-001, git-learning-002"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_create_backup_before_write"
          description: "Verify .backup file created before modification"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_append_lesson_to_yaml"
          description: "Verify lesson appended to lessons array"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_update_metadata_counts"
          description: "Verify total_lessons incremented, last_updated set"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_atomic_write_with_temp_file"
          description: "Verify writes to .tmp then renames (atomic operation)"
          file: "tests/operations/learning/test_yaml_writer.py"
        
        - test: "test_rollback_on_validation_failure"
          description: "Verify backup restored if validation fails"
          file: "tests/operations/learning/test_yaml_writer.py"
      
      green_phase:
        implementation_file: "src/operations/modules/learning/yaml_writer.py"
        key_functions:
          - "append_lesson(lesson: LessonData, yaml_path: Path) -> bool"
          - "validate_lesson_schema(lesson: Dict) -> Tuple[bool, List[str]]"
          - "generate_unique_id(category: str, existing_ids: Set[str]) -> str"
          - "create_backup(yaml_path: Path) -> Path"
          - "atomic_write(yaml_path: Path, data: Dict)"
        
        integration_points:
          - "Receives validated lesson from DuplicationDetector"
          - "Writes to cortex-brain/learning/lessons-learned.yaml"
          - "Returns success/failure with error messages"
      
      refactor_phase:
        - "Extract schema definition to separate YAML file"
        - "Add schema versioning support"
        - "Improve error messages (which field failed, why)"
        - "Add dry-run mode for testing without writing"
    
    definition_of_done:
      - "All 9 RED tests written and failing"
      - "Implementation passes all tests"
      - "Code coverage >95% for yaml_writer.py (critical code)"
      - "Backup/rollback protocol verified with error injection"
      - "Atomic write prevents partial corruption"
      - "Schema validation catches all malformed data"
      - "Git checkpoint created for RED/GREEN/REFACTOR"
    
    skull_compliance:
      - rule: "TDD_ENFORCEMENT"
        validation: "YAML writer tests before implementation"
      
      - rule: "BRAIN_ARCHITECTURE_INTEGRITY"
        validation: "Protects lessons-learned.yaml from corruption"
      
      - rule: "MACHINE_READABLE_FORMATS"
        validation: "Schema defined in YAML, validated programmatically"
  
  phase_6:
    name: "Agent Integration & Entry Point"
    description: "Create LearningLibrarianAgent, register in IntentRouter, add cortex-operations.yaml entry"
    estimated_hours: 3
    dependencies: ["phase_5"]
    
    user_stories:
      - story: "As a user, I want to say 'update learning library' and have system understand"
        acceptance: "IntentRouter recognizes learning library commands"
      
      - story: "As a user, I want natural language triggers so I don't memorize commands"
        acceptance: "Supports: 'update learning library', 'capture lessons', 'document learnings'"
    
    components:
      learning_librarian_agent:
        file: "src/cortex_agents/learning_librarian_agent.py"
        extends: "BaseAgent"
        
        responsibilities:
          - "Route learning library requests"
          - "Orchestrate git scan → filter → capture → dedupe → write"
          - "Handle errors and provide feedback"
          - "Track learning capture events in Tier 1"
        
        key_methods:
          - "can_handle(request: AgentRequest) -> bool"
          - "execute(request: AgentRequest) -> AgentResponse"
      
      cortex_operations_entry:
        file: "cortex-operations.yaml"
        operation_name: "update_learning_library"
        
        natural_language_triggers:
          - "update learning library"
          - "capture lessons"
          - "document learnings"
          - "capture what I learned"
          - "add to learning library"
          - "update lessons learned"
        
        parameters:
          timeframe_hours:
            type: "integer"
