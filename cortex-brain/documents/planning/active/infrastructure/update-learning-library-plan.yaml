risk_mitigation:
  risks:
    - risk: "Git history doesn't capture enough context for quality lessons"
      likelihood: "medium"
      impact: "medium"
      mitigation: "Interactive prompts ensure user provides context. Git is just trigger."
    
    - risk: "Duplication detection misses similar lessons (FTS5 limitations)"
      likelihood: "medium"
      impact: "low"
      mitigation: "Manual review step, user confirms duplicates. Defer semantic engine to 4.0."
    
    - risk: "YAML corruption from concurrent writes"
      likelihood: "low"
      impact: "high"
      mitigation: "Atomic write (temp + rename), backup before modify, file locking"
    
    - risk: "Large git histories (1000+ commits) cause timeout"
      likelihood: "low"
      impact: "medium"
      mitigation: "Default 24h timeframe, progress monitoring, configurable timeout"
    
    - risk: "User skips all prompts (no lessons captured)"
      likelihood: "medium"
      impact: "low"
      mitigation: "Friendly message, suggest better timeframe or heuristic tuning"

success_metrics:
  quantitative:
    - metric: "Lessons captured per week"
      target: ">5 lessons/week"
      measurement: "Count lessons with date in last 7 days"
    
    - metric: "Time to capture lesson"
      target: "<3 minutes"
      measurement: "Timestamp start to YAML append"
    
    - metric: "Duplication prevention rate"
      target: ">90% duplicates caught"
      measurement: "FTS5 true positives / total duplicates"
    
    - metric: "User satisfaction"
      target: ">4.0/5.0"
      measurement: "Feedback system ratings"
  
  qualitative:
    - metric: "Lesson quality improvement"
      target: "Richer context vs manual entry"
      measurement: "Compare problem/solution depth"
    
    - metric: "Adoption rate"
      target: "Used weekly by CORTEX developers"
      measurement: "Git commit frequency with feature"

deployment_plan:
  pre_deployment:
    - "All 9 phases complete"
    - "SKULL validation passes"
    - "Integration tests pass"
    - "Documentation complete"
    - "User guide reviewed"
  
  deployment_steps:
    - step: 1
      action: "Merge to CORTEX-3.0 branch"
      validation: "CI/CD tests pass"
    
    - step: 2
      action: "Update VERSION to 3.9.0"
      validation: "File committed"
    
    - step: 3
      action: "Deploy to development environment"
      validation: "End-to-end smoke test"
    
    - step: 4
      action: "Internal dogfooding (1 week)"
      validation: "No critical bugs"
    
    - step: 5
      action: "Merge to main branch"
      validation: "Production deployment"
  
  rollback_plan:
    - "Revert VERSION to 3.8.3"
    - "Remove cortex-operations.yaml entry"
    - "Restore lessons-learned.yaml from backup"
    - "Notify users via feedback system"

notes:
  - "This feature bridges automation and human insight - git finds candidates, humans provide wisdom"
  - "Docsify is passive viewer - no generation needed, just append to YAML"
  - "FTS5 duplication detection is 'good enough' for 3.9, semantic embeddings deferred to 4.0"
  - "Incremental capture better than perfect capture - ship and iterate"
  - "TDD mandatory for all phases - tests are specification, not afterthought"

