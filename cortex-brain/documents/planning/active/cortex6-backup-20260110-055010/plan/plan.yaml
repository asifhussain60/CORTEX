    Implement 4 P0_CRITICAL blocking issues that enable all downstream validation,
    governance enforcement, and test traceability. Without these, NO acceptance
    criteria can be validated and NO orchestrators can prove correctness.
    
  success_criteria:
    - "All 4 blocking issues resolved with dual evidence (test + audit)"
    - "AuditLogger operational and logging to audit.db"
    - "61 SKULL rules migrated to core-rules.yaml"
    - "AC-ID traceability system generating coverage reports"
    - "Housekeeping Orchestrator running autonomous health checks"
    - "All Stage 1 tests passing with ≥95% coverage"
    
