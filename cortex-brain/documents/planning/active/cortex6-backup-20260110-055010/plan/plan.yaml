      name: "Implement AuditLogger Infrastructure"
      priority: "P0_CRITICAL"
      estimated_hours: "16-20"
      dor_clarifications:
        - "Q6: Size-based rotation (50MB) + daily fallback for disk space efficiency"
        - "Q7: Bootstrap self-audit validation to break circular dependency"
      
      rationale: |
        BLOCKS: All 354+ AC validation (no evidence trails possible)
        This is THE foundation - every other component needs audit logging
        to prove correctness and track execution.
        
      acceptance_criteria_blocked:
        - "AC-F01-005: Audit Logger operational with 7 categories"
        - "AC-AUDIT-007: Size-based rotation (50MB) + daily fallback (NEW)"
        - "AC-VAL-005: Bootstrap self-audit validation (NEW)"
        - "AC-INT-006: Audit-first validation"
        - "AC-VAL-001 to AC-VAL-004: All validation framework AC"
        - "AC-AUDIT-001 to AC-AUDIT-006: All audit framework AC"
        - "354+ AC require audit evidence for validation"
        
      tasks:
        
        task_1_1_1:
          name: "Design audit.db SQLite schema"
          estimated_hours: 2
          deliverables:
            - "cortex-brain/database/audit_schema.sql"
          acceptance_criteria:
            - "Schema supports 7 audit categories (governance, orchestrator, validation, etc)"
            - "Includes ac_id, operation_type, status, timestamp, metadata columns"
            - "Supports efficient querying by ac_id, timestamp, category"
            
        task_1_1_2:
          name: "Implement AuditLogger class with size-based rotation"
          estimated_hours: 7
          deliverables:
            - "src/infrastructure/audit_logger.py"
          acceptance_criteria:
            - "Thread-safe singleton pattern"
            - "7 category methods: log_governance(), log_orchestrator(), etc"
            - "Dual storage: SQLite (audit.db) + JSONL (50MB rotation + daily fallback)"
            - "Automatic ac_id tagging when available"
            - "Performance: <5ms per log entry, ≥1000 entries/sec"
            - "Bootstrap mode: Self-audit initialization without circular dependency (AC-VAL-005)"
            
        task_1_1_3:
          name: "Implement MCP audit query tools"
          estimated_hours: 4
          deliverables:
            - "src/mcp/audit_query.py"
          acceptance_criteria:
            - "mcp_audit_validate(ac_id): Validate AC with audit evidence"
            - "mcp_audit_search(category, operation): Search audit logs"
            - "mcp_audit_coverage(): Generate AC coverage report"
            - "mcp_audit_timeline(ac_id): Show execution timeline"
            
        task_1_1_4:
          name: "Write comprehensive tests"
          estimated_hours: 4
          deliverables:
            - "tests/unit/test_audit_logger.py"
            - "tests/integration/test_audit_mcp.py"
          acceptance_criteria:
            - "≥95% code coverage"
            - "@pytest.mark.ac_id('AC-F01-005') markers (traceability only per Q2)"
            - "Test all 7 audit categories"
            - "Test thread safety (concurrent logging)"
            - "Test size-based rotation (50MB threshold)"
            - "Test daily fallback rotation"
            - "Test bootstrap self-audit (AC-VAL-005)"
            
        task_1_1_5:
          name: "Integration and validation"
          estimated_hours: 3
          deliverables:
            - "cortex-brain/audit-logs/bootstrap.jsonl"
          acceptance_criteria:
            - "All tests pass"
            - "AuditLogger successfully logs its own initialization (bootstrap)"
            - "MCP tools return valid audit evidence"
            - "Coverage report shows AC-F01-005, AC-AUDIT-007, AC-VAL-005 validated"
            
      validation:
        test_evidence: "All audit logger tests pass with ≥95% coverage"
        audit_evidence: "AuditLogger logs its own initialization (bootstrap self-audit)"
        command: "pytest tests/unit/test_audit_logger.py -v --cov"
        mcp_validation: "mcp_audit_validate(ac_id='AC-F01-005'); mcp_audit_validate(ac_id='AC-AUDIT-007'); mcp_audit_validate(ac_id='AC-VAL-005')"
        
