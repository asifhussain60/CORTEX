# ==============================================================================
# AUDIT LOGGING REQUIREMENTS
# ==============================================================================

audit_logging_comprehensive:
  
  philosophy: |
    Every operation in CORTEX must be auditable for success verification,
    compliance tracking, and root cause analysis. Audit logging is NOT
    optional - it's foundational infrastructure.
    
  requirements:
    
    format:
      type: "JSONL (JSON Lines)"
      rationale: "Human-readable, machine-parseable, streaming-friendly"
      schema: |
        {
          "timestamp": "ISO8601",
          "ac_id": "AC-XXX-NNN",
          "category": "governance|orchestrator|validation|...",
          "operation": "descriptive_name",
          "status": "success|failure|warning",
          "duration_ms": 123,
          "metadata": {...}
        }
        
    categories:
      - name: "governance"
        description: "SKULL/CORE rule enforcement, policy violations"
      - name: "orchestrator"
        description: "Orchestrator execution, phase/task completion"
      - name: "validation"
        description: "AC validation, test execution, evidence collection"
      - name: "infrastructure"
        description: "System initialization, shutdown, health checks"
      - name: "mcp"
        description: "MCP tool invocations, parameter validation"
      - name: "brain"
        description: "Tier0-3 operations, knowledge graph updates"
      - name: "integration"
        description: "External system integrations (Azure DevOps, Git)"
        
    storage:
      primary: "cortex-brain/database/audit.db (SQLite)"
      secondary: "cortex-brain/audit-logs/*.jsonl (daily rotation)"
      retention: "90 days (configurable)"
      
    performance:
      latency: "<5ms per log entry"
      throughput: "≥1000 entries/second"
      memory_overhead: "<10MB baseline"
      
    querying:
      mcp_tools:
        - "mcp_audit_validate(ac_id): Validate AC with audit evidence"
        - "mcp_audit_search(category, operation): Search audit logs"
        - "mcp_audit_coverage(): Generate AC coverage report"
        - "mcp_audit_timeline(ac_id): Show execution timeline"
        - "mcp_audit_health(): System health report"
        
    dual_validation:
      description: "Every AC requires BOTH test evidence AND audit evidence"
      test_evidence: |
        - Test file exists
        - Test has @pytest.mark.ac_id() marker
        - Test passes
        - Coverage ≥ threshold
      audit_evidence: |
        - Audit log entry exists with ac_id
        - Operation traced from start to completion
        - Status = success
        - Timestamp within validation window
        
    self_audit:
      requirement: "AuditLogger must log its own initialization and operations"
      bootstrap: "First audit entry must be AuditLogger.initialize()"
      
  integration_points:
    - "All orchestrators log phase/task execution"
    - "All MCP tools log invocations"
    - "All validators log AC checks"
    - "All governance checks log rule enforcement"
    - "All brain operations log tier updates"

