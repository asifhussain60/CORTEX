# ==============================================================================
# IMPLEMENTATION ROADMAP
# ==============================================================================

implementation:
  phase_1_cortex_toolkit:
    name: "CORTEX Toolkit Foundation"
    estimated_hours: 24-32
    tasks:
      - "Create src/toolkit/ package structure"
      - "Implement BaseTool abstract class"
      - "Implement 8 toolkit tools (SemanticSearch, ASTParser, etc.)"
      - "Add JSON schema validation"
      - "Add audit logging integration"
      - "Create MCP server (src/mcp/toolkit_server.py)"
      - "Unit tests (85%+ coverage)"
    
    deliverables:
      - "src/toolkit/*.py (9 files)"
      - "tests/toolkit/*.py (8 test files)"
      - "src/mcp/toolkit_server.py"
      - "cortex-brain/schemas/toolkit-*.json (8 schemas)"
  
  phase_2_planning_integration:
    name: "Planning Orchestrator Toolkit Integration"
    estimated_hours: 16-20
    tasks:
      - "Refactor Planning Orchestrator to use toolkit"
      - "Replace direct implementations with tool invocations"
      - "Update Phase 1 to invoke all 8 tools"
      - "Change output from MD to YAML/JSON"
      - "Add tdd-context.json generation"
      - "Integration tests"
    
    deliverables:
      - "src/orchestrators/planning/planning_orchestrator_v5.py (updated)"
      - "tests/orchestrators/planning/*.py (updated)"
      - "cortex-brain/schemas/requirements-schema.json"
      - "cortex-brain/schemas/plan-schema.json"
  
  phase_3_tdd_master_orchestrator:
    name: "TDD-Master Orchestrator Implementation"
    estimated_hours: 20-28
    tasks:
      - "Create src/orchestrators/tdd_master/ package"
      - "Implement TDDMasterOrchestrator class"
      - "Add plan detection and validation"
      - "Implement context transfer (Planning → TDD)"
      - "Add AC validation logic"
      - "Add dashboard integration"
      - "Create manifest file"
      - "Unit and integration tests"
    
    deliverables:
      - "src/orchestrators/tdd_master/tdd_master_orchestrator.py"
      - "tests/orchestrators/tdd_master/*.py"
      - "cortex-brain/manifests/orchestrators/tdd-master-orchestrator-manifest.yaml"
      - "cortex-brain/schemas/tdd-context-schema.json"
  
  phase_4_tdd_context_consumption:
    name: "TDD Orchestrator Context Consumption"
    estimated_hours: 12-16
    tasks:
      - "Update TDD Orchestrator to check for tdd-context.json"
      - "Replace interactive prompts with context consumption"
      - "Update RED phase to use test_requirements"
      - "Update GREEN phase to use domain_knowledge"
      - "Update REFACTOR phase to use governance_rules"
      - "Change output from MD to JSON"
      - "Integration tests"
    
    deliverables:
      - "src/orchestrators/tdd/tdd_orchestrator.py (updated)"
      - "tests/orchestrators/tdd/*.py (updated)"
      - "cortex-brain/schemas/tdd-report-schema.json"
  
  phase_5_master_orchestrator_routing:
    name: "Master Orchestrator Integration"
    estimated_hours: 8-12
    tasks:
      - "Add TDD-Master to TrieRouter"
      - "Register routing patterns"
      - "Update MCP registry"
      - "Add governance middleware validation"
      - "Integration tests"
    
    deliverables:
      - "src/orchestrators/routing/trie_router.py (updated)"
      - "src/mcp/registry.py (updated)"
      - "cortex-brain/config/master-orchestrator.yaml (updated)"
      - "tests/orchestrators/test_master_orchestrator.py (updated)"

