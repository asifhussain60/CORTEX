# ==============================================================================
# CORTEX 6.0 UNIFIED ORCHESTRATION SYSTEM DESIGN
# ==============================================================================
# Purpose: Complete system design for Planning → TDD-Master → TDD workflow
#          using CORTEX Toolkit + MCP with YAML/JSON data interchange
# 
# Author: Asif Hussain
# Version: 1.0.0
# Created: 2026-01-09
# Status: DESIGN SPECIFICATION
#
# Architecture: NO MARKDOWN FILES - Pure YAML/JSON data interchange
# Integration: CORTEX Toolkit (8 tools) + MCP exposure + 4-tier governance
# ==============================================================================

metadata:
  document_type: orchestration_system_design
  version: 1.0.0
  status: DESIGN_SPECIFICATION
  created: '2026-01-09'
  author: Asif Hussain
  related_documents:
    - CX6-planning-orchestrator-workflow.md  # Legacy reference only
    - CX6-tdd-master-orchestrator-integration.md  # Legacy reference only
    - CX6-acceptance-criteria.yaml  # Authoritative AC
    - CX6-requirements.yaml  # Active remediation
  governance_compliance:
    - AC-DOC-001  # NO MD files during execution
    - AC-EXEC-001  # Autonomous execution
    - AC-ORC-MCP-001  # MCP-only tool access

# ==============================================================================
# SYSTEM OVERVIEW
# ==============================================================================

system_overview:
  name: "CORTEX Unified Orchestration System"
  purpose: "Seamless Planning → TDD-Master → TDD workflow with toolkit integration"
  
  components:
    - name: "Planning Orchestrator v5"
      role: "Interactive requirements gathering + plan generation"
      output_format: YAML
      mcp_exposed: true
      
    - name: "TDD-Master Orchestrator v1"
      role: "Coordination layer (Planning → TDD handoff)"
      output_format: JSON
      mcp_exposed: true
      
    - name: "TDD Orchestrator v4"
      role: "RED→GREEN→REFACTOR implementation"
      output_format: JSON
      mcp_exposed: true
      
    - name: "CORTEX Toolkit"
      role: "8 modular analysis tools (MCP-exposed)"
      output_format: JSON
      mcp_exposed: true
      
    - name: "Master Orchestrator"
      role: "Pattern routing + middleware coordination"
      output_format: JSON
      mcp_exposed: false
  
  data_interchange:
    format: "YAML/JSON only"
    no_markdown: true
    validation: JSON_SCHEMA_VALIDATION
    
  governance:
    tier0_rules: "61 SKULL rules (immutable)"
    tier1_state: "Active plans + TODO tasks"
    tier2_knowledge: "Patterns + domain knowledge"
    tier3_context: "Repository analysis + tech stack"

# ==============================================================================
# CORTEX TOOLKIT - MCP-EXPOSED TOOLS
# ==============================================================================

cortex_toolkit:
  description: "8 modular tools following SOLID/DRY, all MCP-exposed"
  base_class: "src/toolkit/base_tool.py::BaseTool"
  mcp_server: "src/mcp/toolkit_server.py"
  audit_integration: "src/infrastructure/audit_logger.py::EnterpriseAuditLogger"
  
  tools:
    - tool_id: "semantic_search"
      class_name: "SemanticSearch"
      file: "src/toolkit/semantic_search.py"
      mcp_method: "cortex_semantic_search"
      purpose: "Search workspace for relevant code/docs"
      input_schema:
        type: object
        required: [query]
        properties:
          query:
            type: string
            description: "Search query (natural language)"
          workspace:
            type: string
            default: "."
            description: "Workspace root directory"
          file_types:
            type: array
            items: {type: string}
            default: [".py", ".yaml", ".json"]
            description: "File extensions to search"
          max_results:
            type: integer
            default: 50
            description: "Maximum results to return"
      output_schema:
        type: object
        properties:
          query: {type: string}
          results:
            type: array
            items:
              type: object
              properties:
                file_path: {type: string}
                relevance_score: {type: number}
                snippet: {type: string}
                line_number: {type: integer}
          count: {type: integer}
          execution_time_ms: {type: number}
      audit_ac_id: "AC-PLAN-SEARCH-001"
      
    - tool_id: "ast_parser"
      class_name: "ASTParser"
      file: "src/toolkit/ast_parser.py"
      mcp_method: "cortex_ast_parse"
      purpose: "Parse Python files to extract structure"
      input_schema:
        type: object
        required: [file_path]
        properties:
          file_path:
            type: string
            description: "Path to Python file"
          parse_depth:
            type: string
            enum: [shallow, deep]
            default: shallow
            description: "shallow=classes/functions, deep=full AST"
      output_schema:
        type: object
        properties:
          file_path: {type: string}
          classes:
            type: array
            items:
              type: object
              properties:
                name: {type: string}
                methods: {type: array, items: {type: string}}
                line_number: {type: integer}
          functions:
            type: array
            items:
              type: object
              properties:
                name: {type: string}
                parameters: {type: array}
                line_number: {type: integer}
          imports: {type: array, items: {type: string}}
          complexity_score: {type: integer}
      audit_ac_id: "AC-PLAN-AST-001"
      
    - tool_id: "git_analyzer"
      class_name: "GitAnalyzer"
      file: "src/toolkit/git_analyzer.py"
      mcp_method: "cortex_git_analyze"
      purpose: "Review git commits for context"
      input_schema:
        type: object
        required: [path]
        properties:
          path:
            type: string
            description: "File or directory path"
          days_back:
            type: integer
            default: 30
            description: "Analyze commits from last N days"
          include_authors:
            type: boolean
            default: true
            description: "Include author attribution"
      output_schema:
        type: object
        properties:
          path: {type: string}
          commit_count: {type: integer}
          authors: {type: array, items: {type: string}}
          change_frequency: {type: string, enum: [low, medium, high]}
          recent_patterns: {type: array, items: {type: string}}
          last_modified: {type: string, format: date-time}
      audit_ac_id: "AC-PLAN-GIT-001"
      
    - tool_id: "knowledge_graph"
      class_name: "KnowledgeGraph"
      file: "src/toolkit/knowledge_graph.py"
      mcp_method: "cortex_knowledge_query"
      purpose: "Build/query entity-relationship graph"
      input_schema:
        type: object
        required: [operation]
        properties:
          operation:
            type: string
            enum: [query, build, update]
            description: "Operation type"
          entities:
            type: array
            items: {type: string}
            description: "Entity names to query/build"
          depth:
            type: integer
            default: 2
            description: "Relationship depth (hops)"
      output_schema:
        type: object
        properties:
          entities: {type: array}
          relationships: {type: array}
          graph_json: {type: string}
          output_file: {type: string}
      audit_ac_id: "AC-PLAN-GRAPH-001"
      
    - tool_id: "pattern_detector"
      class_name: "PatternDetector"
      file: "src/toolkit/pattern_detector.py"
      mcp_method: "cortex_detect_patterns"
      purpose: "Identify reusable code patterns"
      input_schema:
        type: object
        required: [scope]
        properties:
          scope:
            type: string
            description: "Feature/domain to analyze"
          pattern_types:
            type: array
            items: {type: string}
            default: ["singleton", "factory", "strategy", "observer"]
            description: "Pattern types to detect"
      output_schema:
        type: object
        properties:
          scope: {type: string}
          patterns_found:
            type: array
            items:
              type: object
              properties:
                pattern_name: {type: string}
                file_path: {type: string}
                confidence: {type: number}
                usage_count: {type: integer}
          recommendations: {type: array}
      audit_ac_id: "AC-PLAN-PATTERN-001"
      
    - tool_id: "dependency_mapper"
      class_name: "DependencyMapper"
      file: "src/toolkit/dependency_mapper.py"
      mcp_method: "cortex_map_dependencies"
      purpose: "Map internal/external dependencies"
      input_schema:
        type: object
        required: [feature]
        properties:
          feature:
            type: string
            description: "Feature name to analyze"
          include_external:
            type: boolean
            default: true
            description: "Include external packages"
      output_schema:
        type: object
        properties:
          feature: {type: string}
          internal_dependencies:
            type: array
            items: {type: string}
          external_dependencies:
            type: array
            items:
              type: object
              properties:
                package: {type: string}
                version: {type: string}
                usage_count: {type: integer}
          dependency_graph: {type: string}
          output_file: {type: string}
      audit_ac_id: "AC-PLAN-DEP-001"
      
    - tool_id: "duplicate_detector"
      class_name: "DuplicateDetector"
      file: "src/toolkit/duplicate_detector.py"
      mcp_method: "cortex_detect_duplicates"
      purpose: "Find duplicate/similar code"
      input_schema:
        type: object
        properties:
          threshold:
            type: number
            default: 0.85
            description: "Similarity threshold (0-1)"
          min_lines:
            type: integer
            default: 10
            description: "Minimum lines for duplicate detection"
      output_schema:
        type: object
        properties:
          duplicates_found: {type: integer}
          duplicate_groups:
            type: array
            items:
              type: object
              properties:
                similarity: {type: number}
                files: {type: array}
                line_ranges: {type: array}
          recommendations: {type: array}
      audit_ac_id: "AC-PLAN-DUP-001"
      
    - tool_id: "orphan_detector"
      class_name: "OrphanDetector"
      file: "src/toolkit/orphan_detector.py"
      mcp_method: "cortex_detect_orphans"
      purpose: "Find orphaned/unused files"
      input_schema:
        type: object
        properties:
          scope:
            type: string
            default: "."
            description: "Directory to analyze"
          exclude_patterns:
            type: array
            items: {type: string}
            default: ["__pycache__", ".git", "node_modules"]
            description: "Patterns to exclude"
      output_schema:
        type: object
        properties:
          orphans_found: {type: integer}
          orphan_files:
            type: array
            items:
              type: object
              properties:
                file_path: {type: string}
                last_accessed: {type: string}
                size_kb: {type: number}
                reason: {type: string}
          recommendations: {type: array}
      audit_ac_id: "AC-PLAN-ORPHAN-001"

# ==============================================================================
# PLANNING ORCHESTRATOR v5 - DATA INTERCHANGE
# ==============================================================================

planning_orchestrator:
  version: "5.0.0"
  file: "src/orchestrators/planning/planning_orchestrator_v5.py"
  manifest: "cortex-brain/manifests/orchestrators/planning-orchestrator-v5-manifest.yaml"
  
  phases:
    phase_1_requirements:
      name: "Interactive Requirements Gathering"
      duration_percent: "30-50%"
      mode: INTERACTIVE
      toolkit_usage:
        - semantic_search  # Find existing implementations
        - ast_parser  # Analyze structure
        - git_analyzer  # Review history
        - knowledge_graph  # Load domain knowledge
        - pattern_detector  # Identify reusable patterns
        - dependency_mapper  # Map dependencies
      
      output_files:
        - file: "requirements/requirements.yaml"
          schema: "schemas/requirements-schema.json"
          content:
            user_stories: "array of user story objects"
            acceptance_criteria: "array of AC objects"
            dependencies: "array of dependency strings"
            constraints: "array of constraint strings"
            domain_knowledge: "object with key-value pairs"
          
        - file: "tracking/requirements-conversation.jsonl"
          schema: "schemas/conversation-schema.json"
          format: "JSONL (one JSON object per line)"
          content:
            timestamp: "ISO 8601 datetime"
            speaker: "user|assistant"
            message: "string"
            context: "object"
          
        - file: "tracking/requirements-audit.jsonl"
          schema: "schemas/audit-schema.json"
          format: "JSONL"
          content:
            timestamp: "ISO 8601 datetime"
            ac_id: "AC identifier"
            event_type: "toolkit_execution|validation|approval"
            details: "object"
      
      dor_criteria:
        - "All user stories defined"
        - "Acceptance criteria specified for ALL stories"
        - "Dependencies identified via DependencyMapper"
        - "Constraints documented"
        - "Assumptions validated (zero remaining)"
        - "Technical approach agreed upon"
        - "Risks identified and mitigated"
        - "Toolkit analysis complete (8 tools)"
    
    phase_2_plan_generation:
      name: "Zero-Ambiguity Plan Generation"
      duration_percent: "15-25%"
      mode: AUTONOMOUS
      
      output_files:
        - file: "{plan-id}.yaml"
          schema: "schemas/plan-schema.json"
          content:
            plan_id: "UUID"
            name: "string"
            description: "string"
            phases: "array of phase objects"
            tasks: "array of task objects"
            dependencies: "object (task_id → [prerequisite_ids])"
            acceptance_criteria: "array of AC IDs"
            estimated_hours: "number"
          
        - file: "analysis/domain-knowledge-final.json"
          schema: "schemas/knowledge-graph-schema.json"
          source: "KnowledgeGraph.execute()"
          
        - file: "analysis/dependencies-discovered.yaml"
          schema: "schemas/dependencies-schema.json"
          source: "DependencyMapper.execute()"
          
        - file: "plan-viewer.html"
          type: "dashboard"
          purpose: "Live progress visualization"
          update_mechanism: "JavaScript refresh every 5s"
    
    phase_3_approval:
      name: "Plan Approval & Config Creation"
      duration_percent: "Variable"
      mode: INTERACTIVE
      
      output_files:
        - file: "config.yaml"
          schema: "schemas/plan-config-schema.json"
          content:
            approval_granted: "boolean"
            approved_by: "string (user identifier)"
            approved_at: "ISO 8601 datetime"
            governance_validated: "boolean"
            ac_validated: "boolean"
      
      validation_gates:
        - "Plan completeness check"
        - "AC coverage validation (100%)"
        - "Governance compliance (Tier0-3)"
        - "User approval confirmation"
    
    phase_4_execution:
      name: "Autonomous Plan Execution"
      duration_percent: "50-70%"
      mode: AUTONOMOUS
      
      actions:
        - "Persist plan to planning.db (StateManager)"
        - "Create TODO tasks (TodoManager)"
        - "Generate plan-viewer.html"
        - "Register plan in MCP registry"
        - "Update audit logs with AC-IDs"
      
      output_validation:
        - "Database INSERT verified (SELECT query)"
        - "Transaction commit confirmed"
        - "Plan files exist on filesystem"
        - "MCP registration successful"
      
      handoff_trigger:
        condition: "If plan has implementation_required=true"
        action: "Invoke TDD-Master Orchestrator"
        context_transfer: "requirements.yaml + config.yaml + AC"

# ==============================================================================
# TDD-MASTER ORCHESTRATOR v1 - COORDINATION LAYER
# ==============================================================================

tdd_master_orchestrator:
  version: "1.0.0"
  file: "src/orchestrators/tdd_master/tdd_master_orchestrator.py"  # NEW
  manifest: "cortex-brain/manifests/orchestrators/tdd-master-orchestrator-manifest.yaml"  # NEW
  purpose: "Coordination layer bridging Planning → TDD with governance continuity OR standalone unplanned development"
  
  execution_modes:
    planned_mode:
      description: "Execute after Planning Orchestrator completion"
      trigger: "Planning Phase 4 completion with implementation_required=true"
      input_source: "tdd-context.json from Planning"
      
    unplanned_mode:
      description: "Execute independently without Planning (unplanned development)"
      trigger: "Direct user invocation via Master Orchestrator"
      input_source: "Interactive requirements gathering (lightweight)"
      use_cases:
        - "Quick bug fixes"
        - "Small feature additions"
        - "Refactoring existing code"
        - "Prototyping/experiments"
        - "Emergency hotfixes"
  
  registration:
    orchestrator_id: "tdd_master_orchestrator"
    mcp_method: "cortex_tdd_master_execute"
    pattern_routes:
      # Planned development patterns
      - "plan and implement"
      - "full tdd workflow"
      - "build feature"
      - "implement with tests"
      
      # Unplanned development patterns (DIRECT TDD-MASTER INVOCATION)
      - "implement"
      - "build"
      - "create"
      - "add feature"
      - "fix bug"
      - "refactor"
      - "write code"
      - "develop"
      - "code this"
      - "make this"
      - "quick implement"
      - "tdd"
      - "test and implement"
  
  phases:
    phase_0_mode_detection:
      name: "Mode Detection & Context Loading"
      purpose: "Determine if planned or unplanned development"
      
      detection_logic:
        check_for_plan_context:
          - "Look for tdd-context.json in tracking/"
          - "If exists: PLANNED_MODE (from Planning Orchestrator)"
          - "If not exists: UNPLANNED_MODE (standalone execution)"
      
      planned_mode_validation:
        - "Validate tdd-context.json schema"
        - "Verify config.yaml approval_granted=true"
        - "Load all context data"
        - "Skip to Phase 2 (context already prepared)"
      
      unplanned_mode_requirements:
        name: "Lightweight Requirements Gathering"
        interactive: true
        prompts:
          - "What feature/fix are you implementing?"
          - "What are the acceptance criteria? (user provides 2-5 AC)"
          - "Any dependencies or constraints?"
        
        toolkit_invocation:
          - semantic_search  # Find similar implementations
          - ast_parser  # Analyze existing code structure
          - git_analyzer  # Check recent changes
          - pattern_detector  # Identify applicable patterns
          
        output:
          - file: "tracking/tdd-context-unplanned.json"
            schema: "schemas/tdd-context-schema.json"
            content:
              mode: "UNPLANNED"
              features: "array (from user input)"
              test_requirements: "array (AC from user)"
              domain_knowledge: "object (from toolkit analysis)"
              dependencies: "array (minimal, from user + toolkit)"
              governance_rules: "object (Tier0-3, always loaded)"
    
    phase_1_plan_detection:
      name: "Plan Detection & Validation"
      input:
        - file: "{plan-id}/config.yaml"
          validate: "approval_granted == true"
        - file: "{plan-id}/requirements.yaml"
          validate: "user_stories.length > 0"
        - file: "{plan-id}/analysis/domain-knowledge-final.json"
          validate: "entities.length > 0"
      
      validation:
        - "Plan completion status (Phase 4 complete)"
        - "Config approval confirmation"
        - "Requirements file exists and valid"
        - "AC coverage 100%"
        - "No PENDING governance violations"
      
      output:
        - file: "tracking/plan-validation-report.json"
          schema: "schemas/plan-validation-schema.json"
          content:
            plan_id: "string"
            validation_timestamp: "ISO 8601"
            checks_passed: "integer"
            checks_failed: "integer"
            details: "array of validation results"
    
    phase_2_context_transfer:
      name: "Context Transfer (Planning → TDD)"
      purpose: "Transform plan data into TDD-compatible context"
      
      data_mapping:
        from_planning:
          - source: "requirements.yaml::user_stories"
            target: "tdd_context.features"
            transform: "Map user story → feature specification"
            
          - source: "requirements.yaml::acceptance_criteria"
            target: "tdd_context.test_requirements"
            transform: "Map AC → test case specification"
            
          - source: "analysis/domain-knowledge-final.json"
            target: "tdd_context.domain_knowledge"
            transform: "Direct copy (JSON → JSON)"
            
          - source: "analysis/dependencies-discovered.yaml"
            target: "tdd_context.dependencies"
            transform: "YAML → JSON, extract external packages"
            
          - source: "config.yaml::governance_validated"
            target: "tdd_context.governance_rules"
            transform: "Load Tier0-3 rules from cortex-brain/"
      
      output:
        - file: "tracking/tdd-context.json"
          schema: "schemas/tdd-context-schema.json"
          content:
            plan_id: "string"
            features: "array of feature objects"
            test_requirements: "array of test objects"
            domain_knowledge: "object"
            dependencies: "object"
            governance_rules: "object (tier0-3)"
            technology_hints: "object (frameworks, versions)"
    
    phase_3_tdd_invocation:
      name: "TDD Execution with Enriched Context"
      
      invocation:
        orchestrator: "TDD Orchestrator v4"
        method: "execute()"
        context_injection: "tdd-context.json"
        monitoring: "Real-time phase tracking"
      
      progress_tracking:
        - event: "TDD Discovery Phase Start"
          action: "Update plan-viewer.html (JavaScript)"
          
        - event: "TDD RED Phase Complete"
          action: "Validate AC coverage, update dashboard"
          
        - event: "TDD GREEN Phase Complete"
          action: "Run tests, verify passing, update dashboard"
          
        - event: "TDD REFACTOR Phase Complete"
          action: "Run clean code checks, update dashboard"
      
      dashboard_integration:
        file: "{plan-id}/plan-viewer.html"
        update_mechanism: "WebSocket or file write"
        update_frequency: "Real-time per phase"
        data_source: "tracking/tdd-progress.json"
    
    phase_4_validation_reporting:
      name: "Validation & Unified Reporting"
      
      validations:
        ac_coverage:
          method: "Compare AC → test cases"
          threshold: "100% coverage"
          output: "tracking/ac-coverage-report.json"
          
        governance_compliance:
          tiers: ["tier0", "tier1", "tier2", "tier3"]
          checks:
            - "TDD_ENFORCEMENT: RED phase executed first"
            - "CLEAN_CODE: SOLID/DRY/KISS validated"
            - "SECURITY_PATTERNS: Security tests generated"
          output: "tracking/governance-audit.json"
          
        test_health:
          checks:
            - "All tests passing"
            - "Coverage ≥ 80%"
            - "No skipped tests"
          output: "tracking/test-health-report.json"
      
      unified_report:
        - file: "tracking/completion-report.json"
          schema: "schemas/completion-report-schema.json"
          content:
            plan_summary:
              plan_id: "string"
              name: "string"
              phases_completed: "integer"
              estimated_hours: "number"
              actual_hours: "number"
            
            tdd_summary:
              phases_executed: "array [DISCOVERY, RED, GREEN, REFACTOR, VALIDATION]"
              tests_generated: "integer"
              tests_passing: "integer"
              clean_code_score: "integer (0-100)"
              security_tests_count: "integer"
            
            ac_coverage:
              total_criteria: "integer"
              criteria_validated: "integer"
              coverage_percentage: "number"
              gaps: "array of AC IDs"
            
            governance_audit:
              tier0_compliant: "boolean"
              tier1_compliant: "boolean"
              tier2_compliant: "boolean"
              tier3_compliant: "boolean"
              violations: "array of violation objects"
            
            artifacts:
              plan_files: "array of file paths"
              test_files: "array of file paths"
              implementation_files: "array of file paths"
              reports: "array of report file paths"

# ==============================================================================
# TDD ORCHESTRATOR v4 - CONTEXT CONSUMPTION
# ==============================================================================

tdd_orchestrator:
  version: "4.0.0"
  file: "src/orchestrators/tdd/tdd_orchestrator.py"
  manifest: "cortex-brain/manifests/orchestrators/tdd-orchestrator-v4-manifest.yaml"
  
  enhancements:
    context_consumption:
      purpose: "Consume TDD-Master context instead of regenerating requirements"
      
      input:
        - file: "tracking/tdd-context.json"
          usage: "Load features, test requirements, domain knowledge"
          
      changes_required:
        - location: "execute() method"
          change: "Check for tdd-context.json before interactive mode"
          
        - location: "Phase 1: RED"
          change: "Use test_requirements from context instead of generating"
          
        - location: "Phase 2: GREEN"
          change: "Use domain_knowledge from context for implementation hints"
          
        - location: "Phase 3: REFACTOR"
          change: "Use governance_rules from context for validation"
  
  output_format:
    progress_updates:
      format: "JSON"
      file: "tracking/tdd-progress.json"
      schema: "schemas/tdd-progress-schema.json"
      update_frequency: "Per phase completion"
    
    test_artifacts:
      location: "tests/"
      naming: "test_{feature_name}.py"
      format: "Python source code"
    
    implementation_artifacts:
      location: "src/"
      naming: "{feature_name}.py"
      format: "Python source code"
    
    reports:
      - file: "tracking/tdd-execution-report.json"
        schema: "schemas/tdd-report-schema.json"
        content:
          phases: "array of phase results"
          tests: "array of test objects"
          clean_code_violations: "array"
          security_tests: "array"

# ==============================================================================
# DATA SCHEMAS (JSON SCHEMA v7)
# ==============================================================================

schemas:
  requirements_schema:
    file: "cortex-brain/schemas/requirements-schema.json"
    json_schema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      required: [user_stories, acceptance_criteria, dependencies]
      properties:
        user_stories:
          type: array
          items:
            type: object
            required: [id, title, description]
            properties:
              id: {type: string}
              title: {type: string}
              description: {type: string}
              acceptance_criteria: {type: array, items: {type: string}}
        
        acceptance_criteria:
          type: array
          items:
            type: object
            required: [ac_id, criterion, status]
            properties:
              ac_id: {type: string, pattern: "^AC-[A-Z]+-\\d+$"}
              criterion: {type: string}
              status: {type: string, enum: [PENDING, COMPLETE]}
              test_case_ids: {type: array, items: {type: string}}
        
        dependencies:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [internal, external]}
              name: {type: string}
              version: {type: string}
  
  tdd_context_schema:
    file: "cortex-brain/schemas/tdd-context-schema.json"
    json_schema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      required: [plan_id, features, test_requirements]
      properties:
        plan_id: {type: string, format: uuid}
        features:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name: {type: string}
              description: {type: string}
              user_story_id: {type: string}
        
        test_requirements:
          type: array
          items:
            type: object
            required: [ac_id, test_description]
            properties:
              ac_id: {type: string}
              test_description: {type: string}
              test_type: {type: string, enum: [unit, integration, security]}
        
        domain_knowledge:
          type: object
          description: "Free-form domain knowledge JSON"
        
        governance_rules:
          type: object
          required: [tier0, tier1, tier2, tier3]
          properties:
            tier0: {type: object}
            tier1: {type: object}
            tier2: {type: object}
            tier3: {type: object}

# ==============================================================================
# MCP INTEGRATION - UNIFIED TOOL REGISTRY
# ==============================================================================

mcp_integration:
  description: "All CORTEX tools exposed via Model Context Protocol"
  server: "src/mcp/cortex_unified_server.py"
  port: 8765
  protocol: "JSON-RPC 2.0"
  
  tool_categories:
    toolkit:
      tools:
        - cortex_semantic_search
        - cortex_ast_parse
        - cortex_git_analyze
        - cortex_knowledge_query
        - cortex_detect_patterns
        - cortex_map_dependencies
        - cortex_detect_duplicates
        - cortex_detect_orphans
    
    orchestrators:
      tools:
        - cortex_planning_execute
        - cortex_tdd_master_execute
        - cortex_tdd_execute
        - cortex_ado_execute
        - cortex_vacuum_execute
    
    utilities:
      tools:
        - cortex_audit_query
        - cortex_audit_list
        - cortex_audit_export
        - cortex_align_plan_sync
        - cortex_digest
  
  registration:
    registry_file: "src/mcp/registry.py::OrchestratorRegistry"
    capability_file: "src/mcp/capability_registry.py::CapabilityRegistry"
    auto_discovery: true
    validation: "Startup integrity check"

# ==============================================================================
# GOVERNANCE ENFORCEMENT (4-TIER ARCHITECTURE)
# ==============================================================================

governance:
  architecture: "4-tier brain (Tier0-3)"
  enforcement_points:
    - "GovernanceCheckpointMiddleware (Master Orchestrator)"
    - "BaseOrchestratorV4_1 (all orchestrators)"
    - "CORTEX Toolkit tools (audit logging)"
  
  tier0_skull_rules:
    file: "cortex-brain/tier0/governance/core-rules.yaml"
    count: 61
    enforcement: IMMUTABLE
    key_rules:
      - TDD_ENFORCEMENT
      - HOLISTIC_DISCOVERY
      - GIT_ISOLATION
      - PLANNING_ISOLATION
      - REFACTOR_MANDATORY
      - NO_MD_FILES_DURING_EXECUTION
  
  tier1_working_memory:
    location: "cortex-brain/tier1/"
    purpose: "Active plans, TODO tasks, current phase state"
    files:
      - "active-plans/{plan-id}/"
      - "todos/{plan-id}.yaml"
  
  tier2_knowledge:
    location: "cortex-brain/tier2/"
    purpose: "Learned patterns, domain knowledge, refactoring history"
    files:
      - "patterns/tdd-patterns.yaml"
      - "patterns/security-patterns.yaml"
      - "domain-knowledge/*.json"
  
  tier3_dev_context:
    location: "cortex-brain/tier3/"
    purpose: "Repository analysis, tech stack, dependencies"
    files:
      - "repositories/{repo-name}/"
      - "technology-profiles/*.yaml"

