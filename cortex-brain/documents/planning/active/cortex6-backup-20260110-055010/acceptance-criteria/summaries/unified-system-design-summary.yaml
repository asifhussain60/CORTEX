# ==============================================================================
# GOVERNANCE COMPLIANCE
# ==============================================================================

governance_compliance:
  no_markdown_rule:
    ac_id: AC-DATA-001
    priority: P0_CRITICAL
    enforcement: "Master Orchestrator middleware blocks Markdown generation"
    validation: "Pre-commit hook rejects .md commits from orchestrators"
    
  schema_validation:
    ac_id: AC-DATA-002
    priority: P1_HIGH
    enforcement: "All orchestrators validate output before writing"
    library: "jsonschema (Python)"
    
  mcp_only_access:
    ac_id: AC-ORC-MCP-001
    priority: P1_HIGH
    enforcement: "Toolkit tools ONLY accessible via MCP (no direct invocation)"
    
  ac_coverage:
    ac_id: AC-TDD-MASTER-004
    priority: P1_HIGH
    enforcement: "TDD-Master validates 100% AC → test case mapping"
    
  governance_continuity:
    ac_id: AC-TDD-MASTER-005
    priority: P1_HIGH
    enforcement: "Tier0-3 rules enforced across Planning → TDD boundary"
    tiers:
      - tier0: "61 SKULL rules (immutable)"
      - tier1: "Working memory (active plans, TODO tasks)"
      - tier2: "Knowledge graph (patterns, domain knowledge)"
      - tier3: "Dev context (repos, tech stack)"

