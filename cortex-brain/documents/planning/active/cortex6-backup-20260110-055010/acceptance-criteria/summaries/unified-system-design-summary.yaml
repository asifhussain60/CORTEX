# ==============================================================================
# SYSTEM ARCHITECTURE OVERVIEW
# ==============================================================================

system_architecture:
  components:
    - name: "CORTEX Toolkit (8 Tools)"
      description: "Modular analysis tools following SOLID/DRY"
      tools:
        - SemanticSearch  # Workspace code/doc search
        - ASTParser  # Python structure parsing
        - GitAnalyzer  # Commit history analysis
        - KnowledgeGraph  # Entity-relationship graph
        - PatternDetector  # Design pattern detection
        - DependencyMapper  # Dependency analysis
        - DuplicateDetector  # Code similarity detection
        - OrphanDetector  # Unused file detection
      
    - name: "Planning Orchestrator v5"
      description: "4-phase interactive planning workflow"
      data_outputs:
        - requirements.yaml
        - "{plan-id}.yaml"
        - config.yaml
        - analysis/domain-knowledge-final.json
        - analysis/dependencies-discovered.yaml
        - tracking/requirements-conversation.jsonl
        - tracking/requirements-audit.jsonl
      toolkit_integration: "Uses all 8 tools via MCP in Phase 1"
      
    - name: "TDD-Master Orchestrator v1 (NEW)"
      description: "Coordination layer bridging Planning → TDD"
      phases:
        - phase_1: "Plan Detection & Validation"
        - phase_2: "Context Transfer (Planning → TDD)"
        - phase_3: "TDD Invocation with Enriched Context"
        - phase_4: "Validation & Unified Reporting"
      data_outputs:
        - tracking/tdd-context.json
        - tracking/plan-validation-report.json
        - tracking/ac-coverage-report.json
        - tracking/governance-audit.json
        - tracking/completion-report.json
      
    - name: "TDD Orchestrator v4 (Enhanced)"
      description: "RED→GREEN→REFACTOR with context consumption"
      enhancements:
        - "Context detection (check for tdd-context.json)"
        - "Skip interactive prompts if context exists"
        - "Use test_requirements from context (RED phase)"
        - "Use domain_knowledge from context (GREEN phase)"
        - "Use governance_rules from context (REFACTOR phase)"
      data_outputs:
        - tracking/tdd-progress.json
        - tracking/tdd-execution-report.json
        - tests/*.py  # Generated test files
        - src/*.py  # Generated implementation files
  
  data_interchange:
    format: "YAML/JSON only"
    markdown_prohibition: "AC-DATA-001 (P0_CRITICAL)"
    schema_validation: "All files validated against JSON Schema v7"
    handoff_artifact: "tdd-context.json (Planning → TDD-Master → TDD)"
  
  mcp_integration:
    server: "src/mcp/cortex_unified_server.py"
    protocol: "JSON-RPC 2.0"
    exposed_tools:
      toolkit:
        - cortex_semantic_search
        - cortex_ast_parse
        - cortex_git_analyze
        - cortex_knowledge_query
        - cortex_detect_patterns
        - cortex_map_dependencies
        - cortex_detect_duplicates
        - cortex_detect_orphans
      orchestrators:
        - cortex_planning_execute
        - cortex_tdd_master_execute  # NEW
        - cortex_tdd_execute
      utilities:
        - cortex_audit_query
        - cortex_audit_list
        - cortex_audit_export

