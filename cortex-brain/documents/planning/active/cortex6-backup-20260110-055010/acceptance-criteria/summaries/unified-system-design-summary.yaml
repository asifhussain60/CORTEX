# ==============================================================================
# RISK ASSESSMENT & MITIGATION
# ==============================================================================

risks:
  technical_risks:
    - risk: "JSON Schema validation performance overhead"
      impact: MEDIUM
      likelihood: LOW
      mitigation: "Cache schemas, lazy validation, async validation for non-blocking operations"
      
    - risk: "MCP server reliability (single point of failure)"
      impact: HIGH
      likelihood: LOW
      mitigation: "Add health checks, auto-restart, fallback to direct invocation (with audit logging)"
      
    - risk: "Context file size growth (tdd-context.json)"
      impact: MEDIUM
      likelihood: MEDIUM
      mitigation: "Compress context, paginate large arrays, lazy-load domain knowledge"
  
  integration_risks:
    - risk: "Planning → TDD-Master → TDD data loss during handoff"
      impact: HIGH
      likelihood: LOW
      mitigation: "Schema validation at each boundary, rollback on validation failure, backup context files"
      
    - risk: "AC coverage calculation errors (false 100%)"
      impact: HIGH
      likelihood: MEDIUM
      mitigation: "Manual spot-checks, audit log review, independent validation tool"
  
  schedule_risks:
    - risk: "80-108h estimate exceeds available capacity"
      impact: MEDIUM
      likelihood: MEDIUM
      mitigation: "Parallel execution (Phases 2-6 + Phase 7), MVP approach (defer non-blocking AC)"

