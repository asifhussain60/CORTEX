# ==============================================================================

usage:
  
  when_to_use_epic_snowball:
    - "Multi-week initiatives (4+ weeks)"
    - "Multiple dependent phases (5+ phases)"
    - "Opportunity for parallel execution"
    - "Foundation phase unlocks exponential value"
    - "Example: Platform transformation, new capability deployment"
  
  when_to_use_feature_snowball:
    - "Single feature development (hours to days)"
    - "Iterative refinement needed"
    - "Live feedback loop available"
    - "Pattern learning expected"
    - "Example: UI refinement, bug fixing, script development"
  
  customization_guidance:
    - "Adjust momentum levels to match team size and complexity"
    - "Define amplifiers specific to your domain"
    - "Identify critical path dependencies early"
    - "Set quality thresholds based on business risk"
    - "Track metrics that matter to stakeholders"
  
  integration_with_cortex:
    planning_orchestrator: "Generate snowball-structured plans automatically"
    epic_review_orchestrator: "Track momentum metrics and identify blockers"
    maintenance_orchestrator: "Validate no regression as momentum builds"
    todo_orchestrator: "Manage DAG with snowball dependencies"

