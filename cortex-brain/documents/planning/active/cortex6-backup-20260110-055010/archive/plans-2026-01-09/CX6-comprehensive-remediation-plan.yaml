# ==============================================================================
# AUTONOMOUS EXECUTION SAFEGUARDS
# ==============================================================================
# Added: 2026-01-09 | Purpose: Prevent blindly following wrong path
# Source: chat01.md analysis (30+ navigation tool calls wasted)
# ==============================================================================

autonomous_execution_safeguards:
  
  philosophy: |
    INTELLIGENCE CHECKS prevent autonomous execution from blindly following
    outdated or incorrect plans. Before executing any task, VERIFY current
    state matches plan assumptions.
  
  # --------------------------------------------------------------------------
  # PRE-EXECUTION VALIDATION PROTOCOL
  # --------------------------------------------------------------------------
  
  pre_execution_protocol:
    step_1:
      name: "READ INVESTIGATION REPORT"
      action: "Load INVESTIGATION-REPORT-20260109.yaml"
      purpose: "Get all file paths, patterns, dependencies upfront"
      benefit: "Eliminates 30+ navigation tool calls per task"
      
    step_2:
      name: "RUN PRE-EXECUTION CHECKS"
      action: "Execute all checks defined in task.pre_execution_checks[]"
      decision_tree:
        - "IF all checks PASS → Proceed with implementation"
        - "IF any check FAILS with on_failure='ABORT' → STOP, investigate"
        - "IF check result unexpected → LOG warning, request guidance"
      
    step_3:
      name: "VERIFY DEPENDENCIES"
      action: "Check all imports, files, directories exist"
      validation: "No missing dependencies before starting"
      
    step_4:
      name: "CONFIRM TASK NOT ALREADY COMPLETE"
      action: "Check for completion evidence (files, tests, logs)"
      example: "GOV-001 already complete, skip entire task"
  
  # --------------------------------------------------------------------------
  # EXECUTION DECISION MATRIX
  # --------------------------------------------------------------------------
  
  execution_decisions:
    scenario_1:
      condition: "Pre-execution checks all PASS"
      decision: "EXECUTE task as planned"
      confidence: "HIGH"
      
    scenario_2:
      condition: "Task already complete (evidence found)"
      decision: "SKIP task, mark as COMPLETE, proceed to next"
      example: "GOV-001 (core-rules.yaml exists)"
      
    scenario_3:
      condition: "Source files missing or different"
      decision: "ABORT, investigate discrepancy, update plan"
      example: "audit_logger.py not at expected location"
      
    scenario_4:
      condition: "Dependencies missing"
      decision: "ABORT, install/create dependencies first"
      example: "BaseOrchestratorV4_1 not found"
      
    scenario_5:
      condition: "Partial implementation found"
      decision: "ANALYZE what's done, complete remaining work"
      example: "AuditEntry has ac_id, but log() doesn't"
  
  # --------------------------------------------------------------------------
  # ROLLBACK PROCEDURES
  # --------------------------------------------------------------------------
  
  rollback_procedures:
    when_to_rollback:
      - "Tests fail after implementation"
      - "Imports break across codebase"
      - "Critical functionality regresses"
      - "User requests rollback"
    
    rollback_steps:
      step_1:
        action: "Revert file moves"
        command: "Use rollback commands from task.migration_steps"
        example: "mv src/infrastructure/audit_logger.py src/orchestrators/audit_logger.py"
        
      step_2:
        action: "Revert import changes"
        command: "Use rollback sed commands"
        example: "find src -name '*.py' -exec sed -i '' 's/from src\\.infrastructure\\.audit_logger/from src.orchestrators.audit_logger/g' {} +"
        
      step_3:
        action: "Revert code changes"
        command: "git checkout -- <files>"
        note: "Only if changes committed"
        
      step_4:
        action: "Verify rollback successful"
        command: "pytest tests/ -v"
        expected: "All tests pass (baseline restored)"
  
  # --------------------------------------------------------------------------
  # VALIDATION CHECKPOINTS
  # --------------------------------------------------------------------------
  
  validation_checkpoints:
    checkpoint_1:
      when: "After file migration (AUDIT-001)"
      validate: "All imports updated successfully"
      command: "python3 -c 'from src.infrastructure.audit_logger import EnterpriseAuditLogger'"
      on_failure: "Rollback migration, fix imports"
      
    checkpoint_2:
      when: "After adding ac_id to AuditEntry"
      validate: "Tests still pass"
      command: "pytest tests/conftest.py -v"
      on_failure: "Revert dataclass change"
      
    checkpoint_3:
      when: "After pytest marker registration"
      validate: "Marker appears in pytest --markers"
      command: "pytest --markers | grep ac_id"
      on_failure: "Fix conftest.py registration"
      
    checkpoint_4:
      when: "After orchestrator registration"
      validate: "Pattern routing works"
      command: "python3 -m src.main 'housekeeping' --dry-run"
      on_failure: "Fix pattern registration"
  
  # --------------------------------------------------------------------------
  # ANTI-PATTERNS (What NOT to do)
  # --------------------------------------------------------------------------
  
  anti_patterns:
    - pattern: "Blindly execute without pre-checks"
      consequence: "Implement task that's already done (GOV-001)"
      prevention: "ALWAYS run pre_execution_checks first"
      
    - pattern: "Assume file locations unchanged"
      consequence: "File moves break imports, cause errors"
      prevention: "Verify file exists before moving/reading"
      
    - pattern: "Skip investigation report"
      consequence: "Waste 30+ tool calls navigating codebase"
      prevention: "Load investigation report at task start"
      
    - pattern: "Implement without TDD"
      consequence: "No test evidence, AC validation fails"
      prevention: "RED→GREEN→REFACTOR cycle mandatory"
      
    - pattern: "No rollback plan"
      consequence: "Stuck with broken implementation"
      prevention: "Define rollback commands BEFORE executing"
  
  # --------------------------------------------------------------------------
  # CONTINUOUS VALIDATION
  # --------------------------------------------------------------------------
  
  continuous_validation:
    frequency: "After every significant change"
    
    quick_checks:
      - "pytest tests/ --tb=short (run affected tests)"
      - "python3 -c 'import <module>' (verify imports)"
      - "grep -r 'from src.orchestrators.audit_logger' src/ (find old imports)"
    
    full_validation:
      - "pytest tests/ -v --cov=src (full test suite + coverage)"
      - "python3 -m src.main 'test request' (integration test)"
      - "Review audit logs for errors"
  
  # --------------------------------------------------------------------------
  # SUCCESS CRITERIA
  # --------------------------------------------------------------------------
  
  success_criteria:
    task_level:
      - "All pre-execution checks passed"
      - "All implementation steps completed"
      - "All validation checkpoints passed"
      - "Test evidence: Tests pass with ≥80% coverage"
      - "Audit evidence: AC-tagged logs present"
      - "No rollbacks needed"
      
    stage_level:
      - "All tasks in stage complete"
      - "Snowball impact realized (downstream tasks unblocked)"
      - "No regressions in existing functionality"
      - "Documentation updated"
      
    plan_level:
      - "All 5 stages complete"
      - "354+ AC validated (dual evidence)"
      - "Zero blocking issues remaining"
      - "CORTEX 6.0 foundation operational"

