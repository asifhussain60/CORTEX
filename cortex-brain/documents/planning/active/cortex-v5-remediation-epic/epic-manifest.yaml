# CORTEX v5.0 Remediation Epic - Python-Based Autonomous Orchestrator Manifest
# Version: 6.0.0 | Created: January 5, 2026 | Author: Asif Hussain
# Architecture: 100% Python autonomous execution via terminal invocation

epic_metadata:
  epic_id: cortex-v5-remediation-epic
  epic_name: "CORTEX 5.0 Architecture Enhancement & Remediation"
  version: "6.0.0"
  created: "2026-01-05"
  author: "Asif Hussain"
  status: planning
  execution_mode: autonomous_python
  
  # Epic Objectives
  objectives:
    primary: "Complete CORTEX 5.0 transition to Python-based autonomous orchestrators"
    secondary:
      - "Eliminate all markdown-based workflow execution"
      - "Implement Master Orchestrator task tracking system"
      - "Create auto-refreshing HTML plan viewers"
      - "Establish terminal-based Python invocation as standard"
  
  # Success Criteria
  success_criteria:
    - "All orchestrators execute via python3 -m src.main invocation"
    - "Master Orchestrator manages todo/task lists"
    - "Zero markdown files used for workflow execution"
    - "Plan viewers auto-refresh with progress updates"
    - "All phases tracked in JSON with real-time updates"

# Python Orchestrator Architecture
orchestrator_architecture:
  entry_point: "src/main.py"
  invocation_pattern: "python3 -m src.main \"{request}\" --format markdown"
  execution_mode: terminal_based
  routing: master_orchestrator
  
  # Task Management System
  task_tracking:
    enabled: true
    storage: "tracking/task-registry.json"
    todo_manager: "src/orchestrators/master/todo_manager.py"
    features:
      - "Create, update, complete tasks"
      - "Priority-based sorting"
      - "Dependency tracking"
      - "Progress percentage calculation"
      - "Real-time JSON updates"
  
  # Progress Tracking
  progress_tracking:
    storage: "tracking/progress-tracker.json"
    update_frequency: "per_phase_completion"
    fields:
      - "epic_id"
      - "overall_progress"
      - "phases_complete"
      - "total_phases"
      - "current_phase"
      - "status"
      - "last_updated"
  
  # Plan Viewer Configuration
  plan_viewer:
    file: "plan-viewer.html"
    template: "templates/plan-viewer/plan-viewer-template.html"
    css_theme: "templates/plan-viewer/glassmorphism-theme.css"
    generator: "templates/plan-viewer/generate-plan-viewer.py"
    auto_refresh: true
    refresh_interval: 5  # seconds
    features:
      - "Real-time progress tracking"
      - "Phase status visualization"
      - "Task list display"
      - "Dependency graph"
      - "Glassmorphism design standard v4.2.9"
    regeneration:
      command: "python3 -m templates.plan-viewer.generate-plan-viewer --plan-dir {plan_dir}"
      trigger: "After CSS theme updates or metadata changes"
      applies_to: "All active plans when using --regenerate-all"

# Epic Phases (Python Orchestrator-Based)
phases:
