    - "Performance degradation >100ms per orchestrator operation"
    - "Marker cleanup fails validation (false negatives detected)"
    - "Integration breaks existing TDD or Planning workflows"
  
  steps:
    1: "Disable LearningObserver via feature flag"
    2: "Remove DebugOrchestrator from orchestrator factory"
    3: "Revert integration changes to Planning/TDD orchestrators"
    4: "Git revert to last stable checkpoint"
    5: "Document issues in CHANGELOG.md"
  
  recovery_time: "< 1 hour"

