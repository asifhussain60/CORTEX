# ========================================
# Business Value & Success Criteria
# ========================================

business_value:
  problem_statement: |
    Current TDD workflow lacks:
    1. Automated pattern learning from planning and TDD cycles
    2. Systematic debug orchestration when bugs are reported
    3. Integration between Review, TDD, and Debug workflows
    4. Efficient debug marker injection and cleanup
  
  value_proposition:
    - "15-20% more patterns captured in Knowledge Graph (auto-learning)"
    - "40-50% reduction in debug time (automated instrumentation + event tracing)"
    - "Orchestrated bug resolution workflow (eliminates manual steps)"
    - "Zero debug markers left in code (one-shot cleanup)"
    - "Full user interaction trace for efficient problem identification"
    - "100% orchestrator parity with Planning/TDD patterns (quality gates, git checkpoints, autonomous execution)"
  
  success_criteria:
    - "LearningObserver captures planning patterns with <50ms overhead per phase"
    - "Debug orchestrator auto-engages on bug report within 2 seconds"
    - "Template injection completes in <5 seconds for typical codebase"
    - "Marker cleanup removes 100% of debug code (zero false negatives)"
    - "Review-TDD-Debug integration works end-to-end with passing tests"
    - "Event trace captures all UI interactions with timestamp correlation"

# ========================================
# Technical Architecture
# ========================================

architecture:
  design_principles:
    - "Observer pattern for cross-cutting concerns (learning)"
    - "Template-based injection (safe, predictable, reversible)"
    - "Orchestrator composition (reuse existing Review/TDD logic)"
    - "Marker-based tracking (explicit, detectable, cleanable)"
  
  components:
    learning_observer:
      location: "src/tier0/learning_observer.py"
      purpose: "Decoupled pattern capture from orchestrators"
      responsibilities:
        - "Subscribe to orchestrator phase completion events"
        - "Extract learnable patterns from phase data"
        - "Store patterns in Tier 2 Knowledge Graph"
        - "Maintain <50ms update latency"
      
    debug_orchestrator:
      location: "src/orchestrators/debug_orchestrator.py"
      purpose: "Coordinate bug resolution workflow"
      responsibilities:
        - "Parse bug reports (natural language + test failures)"
        - "Trigger contextual architectural review"
        - "Inject debug templates at strategic locations"
        - "Aggregate debug logs for analysis"
        - "Coordinate fix verification loop"
        - "Clean up all debug markers post-resolution"
      
    debug_template_injector:
      location: "src/workflows/debug_template_injector.py"
      purpose: "Insert debug code using pre-defined templates"
      responsibilities:
        - "Function entry/exit logging"
        - "Variable state capture"
        - "Exception boundary wrapping"
        - "Browser console.log generation (JavaScript)"
        - "Marker-based tracking (CORTEX_DEBUG_ prefix)"
      
    debug_marker_cleanup:
      location: "src/workflows/debug_marker_cleanup.py"
      purpose: "Remove all debug markers in one operation"
      responsibilities:
        - "Scan codebase for CORTEX_DEBUG_ markers"
        - "Remove marker blocks (Python and JavaScript)"
        - "Verify zero markers remain"
        - "Generate cleanup report"
      
    event_trace_injector:
      location: "src/workflows/event_trace_injector.py"
      purpose: "Template-based user interaction tracing"
      responsibilities:
        - "Inject global event listeners (click, input, change)"
        - "Capture state snapshots before/after actions"
        - "Intercept API calls (fetch/XMLHttpRequest)"
        - "Generate structured console logs with timestamps"
        - "Backend execution tracing with args/returns"
      
    bug_resolution_workflow:
      location: "src/workflows/bug_resolution_workflow.py"
      purpose: "Orchestrated fix-verify loop"
      responsibilities:
        - "Combine review findings + debug logs"
        - "Generate root cause hypothesis"
        - "Apply fix → run tests → re-debug on failure"
        - "Cleanup markers on success"

  integration_points:
    planning_orchestrator:
      - "Add phase completion event emission"
      - "Register LearningObserver in __init__"
      - "Capture DoR/DoD decisions, threat model outcomes, estimation accuracy"
    
    tdd_workflow_orchestrator:
      - "Add bug report handler (on_bug_reported method)"
      - "Integrate DebugOrchestrator on test failure"
      - "Pass failing test context to debug session"
    
    review_orchestrator:
      - "Add TDD-scoped review method"
      - "Return structured findings (BLOCKER/CRITICAL/INFO)"
      - "Accept bug context for focused analysis"

