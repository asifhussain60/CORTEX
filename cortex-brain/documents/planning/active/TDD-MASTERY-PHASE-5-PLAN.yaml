  test_layers:
    unit_tests:
      - "LearningObserver pattern extraction"
      - "DebugTemplateInjector template generation"
      - "DebugMarkerCleanup marker detection and removal"
      - "Bug report parsing"
    
    integration_tests:
      - "Planning orchestrator → LearningObserver → Tier 2"
      - "Bug report → Review + Debug orchestrators"
      - "Template injection → Execution → Cleanup"
      - "Fix verification loop (full cycle)"
    
    performance_tests:
      - "LearningObserver overhead <50ms per phase"
      - "Template injection <5 seconds for 100+ files"
      - "Marker cleanup <10 seconds for 1000+ files"
    
    validation_tests:
      - "Zero debug markers after cleanup (100% removal)"
      - "Injected code is syntactically valid"
      - "No false positives in marker detection"

# ========================================
# Risk Management
# ========================================

risks:
  - risk_id: R5.1
    description: "Template injection may conflict with existing code structure"
    probability: medium
    impact: medium
    mitigation: "AST parsing to find safe injection points, validation before injection"
    
  - risk_id: R5.2
    description: "Marker cleanup may miss edge cases (multiline, nested)"
    probability: low
    impact: high
    mitigation: "Comprehensive regex patterns, validation tests, manual review option"
    
  - risk_id: R5.3
    description: "Performance overhead from LearningObserver events"
    probability: low
    impact: low
    mitigation: "Async pattern capture, <50ms SLA, performance benchmarks"
    
  - risk_id: R5.4
    description: "Debug logs may contain sensitive data"
    probability: medium
    impact: high
    mitigation: "PII detection, sanitization, SKULL_PRIVACY_PROTECTION compliance"

# ========================================
# Deferred to CORTEX 4.0
# ========================================

deferred_to_4_0:
  - feature: "Full AST-based dynamic instrumentation"
    reason: "Requires new AST transformation subsystem (3-4 weeks effort)"
    benefit: "Surgical debug injection without template limitations"
    
  - feature: "Real-time log aggregation & ML analysis"
    reason: "Needs log streaming infrastructure + ML models (4-5 weeks)"
    benefit: "AI-powered pattern detection in debug output"
    
  - feature: "Browser DevTools Protocol integration"
    reason: "WebSocket server + CDP protocol = new subsystem (2-3 weeks)"
    benefit: "Live browser console monitoring and control"
    note: "CORTEX 3.0 provides template-based event tracing as interim solution"
    
  - feature: "Distributed debug session coordination"
    reason: "Multi-service debugging requires tracing infrastructure"
    benefit: "Debug across microservices with correlation"
  
  - feature: "Real-time event streaming"
    reason: "Requires WebSocket infrastructure + event buffering (2-3 weeks)"
    benefit: "Live event monitoring during debug sessions"
    note: "CORTEX 3.0 provides console-based post-mortem analysis"
  
  - feature: "Automatic state diff engine"
    reason: "Requires deep object comparison + change detection (1-2 weeks)"
    benefit: "Automatic identification of state changes causing bugs"
    note: "CORTEX 3.0 provides before/after state snapshots"
  
  - feature: "Structured event storage and query"
    reason: "Requires event database schema + query API (2 weeks)"
    benefit: "Complex event correlation and pattern analysis"
    note: "CORTEX 3.0 provides console log aggregation"

