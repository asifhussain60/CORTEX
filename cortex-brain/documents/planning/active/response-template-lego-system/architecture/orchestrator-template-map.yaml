# ==============================================================================
# REUSABILITY METRICS
# ==============================================================================

metrics:
  total_orchestrators: 9
  total_components: 16
  
  core_components: 3
  core_reuse_rate: 100  # All orchestrators use all core components
  
  display_moment_components: 4
  display_moment_reuse_rate: 100  # All orchestrators use all display moment components
  
  optional_components: 6
  optional_reuse_rate: 22  # Average: (22+11+22+22+11+11)/6 = 16.5%
  
  average_components_per_orchestrator: 10  # (9+10+9+9+9+8+9+9+9)/9
  
  duplication_eliminated: true
  dry_compliance: 100

# ==============================================================================
# TEMPLATE GENERATION INSTRUCTIONS
# ==============================================================================

template_generation:
  base_template: |
    # Each orchestrator template follows this structure:
    
    orchestrator_name:
      description: "Brief purpose"
      orchestrator: "orchestrator_class_name"
      
      display_moments:
        start:
          components:
            - component1: {param1: value1}
            - component2: {param2: value2}
        
        interim:
          components:
            - component3: {param3: value3}
        
        end:
          components:
            - component1: {param1: value1}  # Can reuse components
            - component4: {param4: value4}
  
  customization_points:
    - orchestrator_name: "Unique identifier"
    - phase_names: "Custom phase names per orchestrator"
    - optional_components: "Add orchestrator-specific components"
    - custom_parameters: "Override component default parameters"
  
  validation:
    - "All orchestrators MUST use core components (header, overall_progress_bar, next_action)"
    - "START display MUST include phase_table_full"
    - "INTERIM display MUST include phase_update_interim"
    - "END display MUST include summary_section"
    - "Single Action Rule enforced via next_action component"
