feature_name: "Orchestrator CLI Wrapper Migration"
feature_id: "ARCH-001"
category: architecture
priority: critical
status: planned
created_at: "2025-12-09T20:00:00Z"

overview:
  description: "Migrate system operations to CLI wrapper pattern and complete orchestrator registry"
  business_value: "Proper separation between interactive (chat) and automated (CLI) workflows"
  complexity: high
  estimated_hours: 16

problem_statement:
  current_state: |
    - 7 system operations incorrectly use Copilot Chat instead of CLI wrappers
    - align, optimize, healthcheck, review, cleanup, deploy, regenerate_prompts lack CLI implementation
    - cortex-operations.yaml missing Phase 5.1/5.2 orchestrators
    - No clear execution_method classification in operations registry
  
  pain_points:
    - File I/O operations running through chat (slow, unreliable)
    - System diagnostics lack programmatic access
    - Observer pattern orchestrators not documented in registry
    - Inconsistent command execution patterns
  
  desired_state: |
    - All system operations use CLI wrappers
    - Complete orchestrator registry in cortex-operations.yaml
    - Clear execution_method field (cli_wrapper | copilot_chat | internal)
    - Phase 5 orchestrators properly documented

solution_design:
  architecture:
    pattern: "CLI Wrapper with Template-based Response"
    components:
      - cli_wrapper: "Python script in scripts/ directory"
      - orchestrator: "Existing orchestrator class"
      - response_template: "Template in cortex-brain/response-templates-v4.yaml"
      - operations_registry: "Entry in cortex-operations.yaml"
  
  execution_methods:
    cli_wrapper:
      description: "System operations, file I/O, automated workflows"
      characteristics:
        - Programmatic access required
        - File system operations
        - Database operations
        - External tool integration
        - Deterministic output
      examples:
        - align
        - optimize
        - healthcheck
        - review
        - cleanup
        - deploy
        - regenerate_prompts
        - load_dashboard
        - system_maintenance
    
    copilot_chat:
      description: "Interactive workflows, context-dependent decisions"
      characteristics:
        - User interaction required
        - Context-dependent logic
        - Code generation
        - Planning/design decisions
        - Conversational flow
      examples:
        - plan [feature]
        - plan ado
        - execute all phases autonomously
        - start tdd
        - feedback
        - help
    
    internal:
      description: "Infrastructure orchestrators, not directly invoked"
      characteristics:
        - Called by other orchestrators
        - Event-driven (observer pattern)
        - No direct user invocation
      examples:
        - learning_observer
        - debug_workflow_orchestrator
        - tdd_workflow_orchestrator
        - planning_orchestrator (internal state)
        - plan_execution_orchestrator_v2
        - git_checkpoint_orchestrator

implementation_plan:
  phases:
    - phase: "1. CLI Wrapper Creation"
      duration_hours: 8
      tasks:
        - id: "1.1"
          task: "Create scripts/cli_wrappers/ directory structure"
          files:
            - scripts/cli_wrappers/__init__.py
            - scripts/cli_wrappers/align_wrapper.py
            - scripts/cli_wrappers/optimize_wrapper.py
            - scripts/cli_wrappers/healthcheck_wrapper.py
            - scripts/cli_wrappers/review_wrapper.py
            - scripts/cli_wrappers/cleanup_wrapper.py
            - scripts/cli_wrappers/deploy_wrapper.py
            - scripts/cli_wrappers/regenerate_prompts_wrapper.py
        
        - id: "1.2"
          task: "Implement base CLI wrapper pattern"
          pattern: |
            # Standard CLI wrapper structure:
            1. Parse command-line arguments
            2. Initialize orchestrator
            3. Execute operation
            4. Format output using response template
            5. Return exit code
        
        - id: "1.3"
          task: "Add progress indicators (with_progress decorator)"
          notes: "Reuse existing @with_progress decorator from src.utils.progress_decorator"
    
    - phase: "2. Operations Registry Update"
      duration_hours: 4
      tasks:
        - id: "2.1"
          task: "Add execution_method field to cortex-operations.yaml"
          schema_change:
            field: execution_method
            type: enum
            values: [cli_wrapper, copilot_chat, internal]
            required: true
        
        - id: "2.2"
          task: "Add Phase 5.1/5.2 orchestrators to registry"
          new_entries:
            - learning_observer
            - debug_workflow_orchestrator
            - tdd_workflow_orchestrator (updated)
            - planning_orchestrator (observer support)
        
        - id: "2.3"
          task: "Classify all existing operations"
          count: "~150 operations to classify"
    
    - phase: "3. Entry Point Routing"
      duration_hours: 2
      tasks:
        - id: "3.1"
          task: "Update intent router to check execution_method"
          logic: |
            if operation.execution_method == 'cli_wrapper':
                invoke_cli_wrapper(operation.cli_script)
            elif operation.execution_method == 'copilot_chat':
                route_to_chat_handler(operation)
            else:  # internal
                log_error("Operation not directly invokable")
        
        - id: "3.2"
          task: "Add CLI wrapper discovery mechanism"
          pattern: "scripts/cli_wrappers/{operation_id}_wrapper.py"
    
    - phase: "4. Testing & Validation"
      duration_hours: 2
      tasks:
        - id: "4.1"
          task: "Test all CLI wrappers in CORTEX repo"
          coverage: "7 new CLI wrappers + 2 existing"
        
        - id: "4.2"
          task: "Test chat operations still work"
          coverage: "plan, plan ado, start tdd, feedback, help"
        
        - id: "4.3"
          task: "Validate Phase 5 orchestrators"
          tests: "86/86 tests must still pass"

acceptance_criteria:
  - criterion: "All 7 system operations have working CLI wrappers"
    validation: "Manual invocation of each wrapper returns expected output"
  
  - criterion: "cortex-operations.yaml includes all orchestrators"
    validation: "Phase 5.1/5.2 orchestrators documented with execution_method=internal"
  
  - criterion: "execution_method field present on all operations"
    validation: "YAML schema validation passes"
  
  - criterion: "Chat operations unchanged"
    validation: "plan, plan ado, start tdd work identically"
  
  - criterion: "No regressions in Phase 5 tests"
    validation: "pytest tests/orchestrators/ tests/tier2/ tests/integration/ → 86/86 passing"

files_to_create:
  - scripts/cli_wrappers/__init__.py
  - scripts/cli_wrappers/align_wrapper.py
  - scripts/cli_wrappers/optimize_wrapper.py
  - scripts/cli_wrappers/healthcheck_wrapper.py
  - scripts/cli_wrappers/review_wrapper.py
  - scripts/cli_wrappers/cleanup_wrapper.py
  - scripts/cli_wrappers/deploy_wrapper.py
  - scripts/cli_wrappers/regenerate_prompts_wrapper.py

files_to_modify:
  - cortex-operations.yaml (add execution_method, add Phase 5 entries)
  - src/operations/modules/routing/unified_entry_point_utility.py (routing logic)
  - .github/prompts/CORTEX.prompt.md (document execution methods)

dependencies:
  internal:
    - src.utils.progress_decorator (for CLI progress bars)
    - src.response_templates.response_template_manager (for output formatting)
    - Existing orchestrators (align, optimize, healthcheck, review, cleanup)
  
  external: []

risks:
  - risk: "Breaking existing chat-based invocations"
    mitigation: "Backward compatibility layer during transition"
    severity: medium
  
  - risk: "CLI wrappers not found by routing logic"
    mitigation: "Fallback to chat if CLI wrapper missing"
    severity: low
  
  - risk: "Performance regression in system operations"
    mitigation: "CLI wrappers should be faster (direct execution)"
    severity: low

migration_strategy:
  approach: "Parallel implementation with graceful fallback"
  steps:
    - step: 1
      description: "Create CLI wrappers alongside existing chat handlers"
    
    - step: 2
      description: "Update operations registry with execution_method"
    
    - step: 3
      description: "Route based on execution_method, fallback to chat if CLI missing"
    
    - step: 4
      description: "Validate both paths work for 1 sprint"
    
    - step: 5
      description: "Remove chat handlers for CLI-wrapped operations"

testing_strategy:
  unit_tests:
    - Test each CLI wrapper independently
    - Mock orchestrator calls
    - Validate exit codes and output format
  
  integration_tests:
    - Test routing logic (execution_method → correct handler)
    - Test CLI wrapper discovery
    - Test Phase 5 observer pattern still works
  
  regression_tests:
    - Run all Phase 5 tests (86 tests)
    - Validate system maintenance still works end-to-end
    - Test plan/tdd workflows unchanged

success_metrics:
  - metric: "CLI wrapper execution time"
    target: "<3 seconds for align, optimize, healthcheck"
    current: "N/A (not implemented)"
  
  - metric: "Operations registry completeness"
    target: "100% of orchestrators documented"
    current: "~70% (missing Phase 5)"
  
  - metric: "Test pass rate"
    target: "100% (86/86 tests passing)"
    current: "100% (maintained)"

notes:
  - CLI wrappers should use template-based response format
  - System maintenance already uses CLI wrapper pattern (reference implementation)
  - Phase 5 orchestrators are internal (not directly invoked by users)
  - Observer pattern should remain unchanged (no CLI wrapper needed)
  - Dashboard launcher already uses CLI wrapper (good pattern)

related_documentation:
  - cortex-brain/documents/reports/TDD-MASTERY-PHASE-5.2-COMPLETION.md
  - cortex-brain/documents/reference/event-schema-definitions.md
  - cortex-brain/documents/implementation-guides/system-maintenance-orchestrator.md
  - src/operations/modules/orchestration/system_maintenance_orchestrator.py (reference)
