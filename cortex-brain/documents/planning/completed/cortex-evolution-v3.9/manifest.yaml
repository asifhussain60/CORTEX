tdd_compliance:
  red_phase:
    requirements:
      - "Write failing tests before implementation"
      - "Tests must fail for the right reason"
      - "Minimal test code to demonstrate requirement"
    
    validation:
      - "pytest shows test failures"
      - "Failure messages clear and actionable"
  
  green_phase:
    requirements:
      - "Implement minimal code to pass tests"
      - "All tests must pass"
      - "No skipped tests"
    
    validation:
      - "pytest shows all tests passing"
      - "Coverage report meets phase target"
  
  refactor_phase:
    requirements:
      - "Improve code quality without changing behavior"
      - "Tests continue to pass"
      - "Remove duplication, improve clarity"
    
    validation:
      - "pytest still passing after refactor"
      - "Code review identifies no code smells"
      - "Refactor cycle orchestrator validates cleanup"

