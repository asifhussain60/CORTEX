success_criteria:
  performance:
    - metric: "Tier 1 operation latency"
      target: "<2 seconds"
      measurement: "Average over 100 operations"
    
    - metric: "Tier 2 operation latency"
      target: "<10 seconds"
      measurement: "Average over 50 operations"
    
    - metric: "Routing accuracy"
      target: "≥95%"
      measurement: "Correct tier assignment over 100 operations"
    
    - metric: "Refactor cycle completion time"
      target: "<30 seconds"
      measurement: "Typical phase refactor (5-10 files)"
    
    - metric: "Document hygiene file reduction"
      target: "≥30%"
      measurement: "Before/after MD file count"
    
    - metric: "Vacuum cycle manual cleanup reduction"
      target: "≥80%"
      measurement: "Comparison to manual cleanup effort"
  
  quality:
    - metric: "CORTEX Lens integration"
      target: "Zero breaking changes"
      measurement: "Lens tests still passing, independent operation verified"
    
    - metric: "Test coverage"
      target: "≥80%"
      measurement: "pytest --cov coverage report"
    
    - metric: "Brain protection rules enforcement"
      target: "100%"
      measurement: "All 7 new rules actively enforced"
    
    - metric: "Backward compatibility"
      target: "All existing CLI wrappers functional"
      measurement: "Integration tests for existing workflows"
  
  integration:
    - metric: "AST engine CORTEX Lens wrapper"
      target: "100% API coverage"
      measurement: "All Lens orchestrator methods accessible"
    
    - metric: "Deduplication detection accuracy"
      target: "≥90%"
      measurement: "True positives / (true positives + false negatives)"
    
    - metric: "Learning subsystem improvement"
      target: "+5% routing accuracy over 1000 operations"
      measurement: "Before/after routing accuracy comparison"
    
    - metric: "Version consistency"
      target: "100% across all orchestrators"
      measurement: "All orchestrators report correct version from config"
    
    - metric: "Refactor cycle effectiveness"
      target: "100% debug statement removal"
      measurement: "No console.log, print, etc. in production code"
    
    - metric: "Document hygiene reference accuracy"
      target: "100%"
      measurement: "No broken file/path references after renames"

