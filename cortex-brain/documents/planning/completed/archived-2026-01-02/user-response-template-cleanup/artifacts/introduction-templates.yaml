category: operations/introduction
schema_version: '4.0.0'

templates:
  # ============================================================================
  # INTRODUCTION - SOFTWARE ENGINEERS
  # ============================================================================
  introduction_engineering:
    name: "CORTEX Introduction - Software Engineers"
    audience: ["Software Engineer", "Developer", "Technical Lead"]
    triggers:
      - "introduce yourself"
      - "introduce cortex"
      - "what is cortex"
      - "tell me about cortex"
      - "introduce yourself to engineers"
      - "intro"
      - "introduction"
    response_type: informational
    format: |
      ## 🧠 CORTEX - AI-Powered Development Intelligence
      **Author:** Asif Hussain | **Website:** https://asifhussain60.github.io/CORTEX/
      
      ---
      
      ### 🎯 What is CORTEX?
      
      **CORTEX** (**C**ontext-aware **O**rchestration **R**easoning **T**esting **E**xecution e**X**pert) is a multi-agent AI system that enhances GitHub Copilot with:
      
      - **4-Tier Brain Architecture** - Long-term memory, knowledge graphs, context awareness
      - **8 Autonomous Orchestrators** - Planning, TDD, Debug, ADO, Sanitization, Refinement, Lens, Upgrade
      - **SKULL Protection Rules** - 22 governance rules ensuring code quality
      - **97% Token Optimization** - Adaptive response sizing for cost efficiency
      
      ### 🏗️ Architecture Overview
      
      ```
      ┌─────────────────────────────────────────────────┐
      │                  CORTEX BRAIN                    │
      ├──────────┬──────────┬──────────┬────────────────┤
      │  Tier 0  │  Tier 1  │  Tier 2  │    Tier 3      │
      │Governance│ Working  │Knowledge │ Development    │
      │ (SKULL)  │ Memory   │  Graph   │   Context      │
      └──────────┴──────────┴──────────┴────────────────┘
      ```
      
      ### ⚡ Key Capabilities for Engineers
      
      | Feature | What It Does | Command |
      |---------|--------------|---------|
      | **TDD Mastery** | RED→GREEN→REFACTOR enforcement | `start tdd` |
      | **Planning System** | 4-tier complexity routing | `create a plan for [x]` |
      | **Debug Orchestrator** | Auto-instrumented debugging | `debug [target]` |
      | **CORTEX Lens** | AST analysis & code health | `open lens` |
      | **ADO Integration** | Work item creation | `ado story [feature]` |
      | **Sanitization** | Safe code sharing | `sanitize` |
      
      ### 📚 Learn More
      
      - [Architecture Deep Dive →](https://asifhussain60.github.io/CORTEX/architecture/)
      - [TDD Orchestrator Guide →](https://asifhussain60.github.io/CORTEX/orchestrators/tdd-orchestrator.html)
      - [SKULL Rulebook →](https://asifhussain60.github.io/CORTEX/governance/skull-rulebook.html)
      - [API Documentation →](https://asifhussain60.github.io/CORTEX/api/)
      
      ---
      
      ### 🔍 Try These Commands
      
      1. `help` - See all available operations
      2. `start tdd` - Begin test-driven development
      3. `create a plan for [feature]` - Strategic planning
      4. `open lens` - View codebase analytics
      5. `system maintenance` - Run health checks

  # ============================================================================
  # INTRODUCTION - PRODUCT OWNERS
  # ============================================================================
  introduction_product:
    name: "CORTEX Introduction - Product Owners"
    audience: ["Product Owner", "Product Manager", "Business Analyst"]
    triggers:
      - "introduce yourself to product"
      - "introduce cortex to product owners"
      - "cortex for product"
      - "what can cortex do for product"
    response_type: informational
    format: |
      ## 🧠 CORTEX - From Backlog to Done
      **Author:** Asif Hussain | **Website:** https://asifhussain60.github.io/CORTEX/
      
      ---
      
      ### 📋 What is CORTEX?
      
      **CORTEX** is an AI-powered development intelligence system that helps product teams:
      
      ✅ **Track feature progress** in real-time  
      ✅ **Integrate with Azure DevOps** for work items  
      ✅ **Assist with sprint planning** using DoR/DoD validation  
      ✅ **Provide story-to-code traceability**  
      ✅ **Reduce planning overhead** by 95%  
      
      ### 🎯 Key Benefits for Product Owners
      
      | Capability | Value to Product | Impact |
      |-----------|------------------|--------|
      | **Planning System** | Structured feature breakdown | 60% faster planning |
      | **ADO Integration** | Automatic work item creation | Zero manual entry |
      | **Progress Tracking** | Real-time completion status | Full visibility |
      | **DoR/DoD Validation** | Quality gates enforcement | Predictable delivery |
      | **Complexity Routing** | Right-sized effort estimates | Accurate forecasting |
      
      ### 📊 Planning Intelligence
      
      CORTEX routes features through 4 complexity tiers:
      
      ```
      INSTANT (1-4 hrs)     → Direct implementation
      LIGHTWEIGHT (1-3 days) → Basic planning
      DOCUMENTED (3-10 days) → Full documentation
      COMPLEX (10+ days)    → Multi-phase planning
      ```
      
      ### 🔗 ADO Integration Features
      
      - **User Stories** with acceptance criteria
      - **Features** with epic breakdown
      - **Tasks** with implementation steps
      - **Sprint planning** assistance
      - **Velocity tracking** support
      
      ### 📚 Learn More
      
      - [Planning System Guide →](https://asifhussain60.github.io/CORTEX/orchestrators/planning-system.html)
      - [ADO Integration →](https://asifhussain60.github.io/CORTEX/orchestrators/ado-operations.html)
      - [Feature Tracking →](https://asifhussain60.github.io/CORTEX/features/)
      
      ---
      
      ### 🔍 Try These Commands
      
      1. `create a plan for [feature]` - Start structured planning
      2. `ado story [feature name]` - Create ADO user story
      3. `help` - See all available operations

