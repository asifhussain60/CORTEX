  # ============================================================================
  # SECURITY POSTURE
  # ============================================================================
  security_posture:
    name: "CORTEX Security Posture"
    audience: ["Security", "Compliance", "Leadership"]
    triggers:
      - "security concerns"
      - "how does cortex address security"
      - "cortex security"
      - "is cortex secure"
      - "security posture"
    response_type: informational
    format: |
      ## 🧠 CORTEX - Security Posture
      **Author:** Asif Hussain | **Website:** https://asifhussain60.github.io/CORTEX/
      
      ---
      
      ### 🛡️ Security Overview
      
      CORTEX implements security at multiple layers:
      
      ### 1. SKULL Governance Rules (22 Rules)
      
      | Rule Category | Protection |
      |--------------|------------|
      | **TDD Enforcement** | No production code without tests |
      | **Git Isolation** | CORTEX code never in user repos |
      | **Code Boundaries** | Strict separation of concerns |
      | **PII Protection** | Automatic stripping in feedback |
      | **Test Separation** | No mixing test/production code |
      
      ### 2. Data Protection
      
      - **No Code Exfiltration** - All processing local
      - **Feedback Sanitization** - PII stripped before storage
      - **Git Isolation** - CORTEX brain separate from project
      - **Audit Logging** - All operations tracked
      
      ### 3. Quality Assurance
      
      - **Mandatory TDD** - RED→GREEN→REFACTOR enforced
      - **Threat Modeling** - OWASP integration available
      - **Convention Validation** - Automated style checks
      - **Code Smell Detection** - 11 types, 0.95 confidence
      
      ### 📚 Security Documentation
      
      - [SKULL Rulebook →](https://asifhussain60.github.io/CORTEX/governance/skull-rulebook.html)
      - [Security Guidelines →](https://asifhussain60.github.io/CORTEX/security/)
      - [Threat Modeling →](https://asifhussain60.github.io/CORTEX/orchestrators/threat-modeling.html)
      
      ---
      
      ### ✅ Security Certifications
      
      - Browser-native architecture (no server dependencies)
      - Zero external data transmission
      - Git-based version control for all changes
      - Rollback capability for all operations

# ============================================================================
# ROUTING CONFIGURATION
# ============================================================================

routing:
  audience_detection:
    explicit_patterns:
      leadership: ["to leadership", "for leadership", "to executives", "for executives"]
      product: ["to product", "for product", "to product owners", "for PO"]
      engineering: ["to engineers", "for engineers", "to developers", "for devs"]
    
    implicit_keywords:
      leadership: ["ROI", "cost", "velocity", "metrics", "business value", "budget"]
      product: ["features", "delivery", "sprint", "backlog", "roadmap", "user story"]
      engineering: ["architecture", "code", "implementation", "technical", "API", "TDD"]
    
    default: "introduction_professional"
  
  priority: 1  # Highest priority in intent detection
