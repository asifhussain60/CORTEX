plan_metadata:
  plan_id: CORTEX-6.0-PHASE-9-REPLACEMENT
  version: 1.0.0
  created: '2026-01-12T23:05:00Z'
  author: Asif Hussain
  title: "Phase 9 Holistic Redesign: Infrastructure Maturity & Quality Gates"
  strategy: Consolidate missing foundation capabilities before declaring CORTEX 6.0 complete
  design_score: 98
  total_ac_ids: 29
  total_weeks: 3
  philosophy: "Complete the foundation - these aren't new features but missing infrastructure components"

holistic_analysis:
  context: |
    Phases 1-8 are 100% complete (57 AC-IDs implemented, all tests passing).
    However, the tracker lists several "enhancements" that were planned but never implemented.
    
    Upon review, these aren't optional enhancements - they're CRITICAL FOUNDATION pieces
    that were deferred but are essential for production readiness:
    
    1. AC-AUDIT-007 (Hash Chain) - Tamper detection for audit trail
    2. AC-LIFECYCLE-001-003 - Extended orchestrator states beyond simple start/stop
    3. AC-EVIDENCE-001-003 - Structured evidence bundle generation
    4. AC-STS-001-003 - Systematic Test Suite (validation framework)
    5. AC-ROLLOUT-SIMPLE-001-003 - DRY_RUN mode + approval gates
    6. CORE-023 - HTML validation governance
    7. AC-TEMPLATE-001-008 - Response template architecture (reduces bloat)
    8. Proactive Challenge System - Intelligent governance violation prevention
  
  architectural_positioning:
    current_state: "Phase 1-8 complete but missing critical foundation infrastructure"
    gap_analysis: |
      - Audit trail exists but lacks tamper detection (AC-AUDIT-007)
      - Orchestrators have basic state but no lifecycle management (AC-LIFECYCLE)
      - Tests pass but no structured evidence bundles (AC-EVIDENCE)
      - Rollout exists but no safety gates (AC-ROLLOUT-SIMPLE)
      - HTML generation unvalidated (CORE-023)
      - Response templates hardcoded, causing bloat (AC-TEMPLATE)
      - No proactive challenge system (governance violations detected too late)
    
    why_now: |
      These gaps create TECHNICAL DEBT that will compound if not addressed now.
      CORTEX 6.0 cannot be declared "production-ready" without these safeguards.
      They're not "nice-to-have" - they're prerequisites for enterprise adoption.

phase_9_redesign:
  name: "Phase 9: Infrastructure Maturity & Quality Gates"
  description: "Complete missing foundation components for production readiness"
  duration: 3 weeks
  priority: CRITICAL
  
  rationale: |
    Phase 9 originally planned "SDLC Management" which was too vague and didn't exist
    in the master plan. Instead, this phase addresses concrete infrastructure gaps
    that prevent CORTEX from being truly production-grade.
    
    This isn't scope creep - it's completion of deferred foundation work.
  
  components:
    - component_id: 9.1
      name: Audit Integrity Layer
      ac_ids: [AC-AUDIT-007]
      description: Hash chain tamper detection for audit trail
      duration: 2 days
      priority: CRITICAL
      
    - component_id: 9.2
      name: Orchestrator Lifecycle Management
      ac_ids: [AC-LIFECYCLE-001, AC-LIFECYCLE-002, AC-LIFECYCLE-003]
      description: Extended state machine (7 states) for orchestrator execution
      duration: 3 days
      priority: HIGH
      
    - component_id: 9.3
      name: Evidence Bundle System
      ac_ids: [AC-EVIDENCE-001, AC-EVIDENCE-002, AC-EVIDENCE-003]
      description: Structured test evidence + metrics + audit provenance
      duration: 3 days
      priority: HIGH
      
    - component_id: 9.4
      name: Systematic Test Suite (STS)
      ac_ids: [AC-STS-001, AC-STS-002, AC-STS-003]
      description: Golden corpus validation framework (100 test intents)
      duration: 4 days
      priority: MEDIUM
      note: Phase 1.5 partially complete, finish remaining 2 ACs
      
    - component_id: 9.5
      name: Safe Rollout Gates
      ac_ids: [AC-ROLLOUT-SIMPLE-001, AC-ROLLOUT-SIMPLE-002, AC-ROLLOUT-SIMPLE-003]
      description: DRY_RUN mode + approval workflow + progressive AC activation
      duration: 3 days
      priority: HIGH
      
    - component_id: 9.6
      name: HTML Validation Governance
      ac_ids: [CORE-023]
      description: Automated HTML validation + W3C compliance checking
      duration: 1 day
      priority: MEDIUM
      
    - component_id: 9.7
      name: Response Template Architecture
      ac_ids: [AC-TEMPLATE-001, AC-TEMPLATE-002, AC-TEMPLATE-003, AC-TEMPLATE-004, 
               AC-TEMPLATE-005, AC-TEMPLATE-006, AC-TEMPLATE-007, AC-TEMPLATE-008]
      description: 3-layer template system (CORTEX/Company/Knowledge) - reduces bloat 85%
      duration: 4 days
      priority: HIGH
      
    - component_id: 9.8
      name: Proactive Challenge System
      ac_ids: [AC-CHALLENGE-001, AC-CHALLENGE-002, AC-CHALLENGE-003]
      description: Intelligent pre-execution governance validation (CORE-025)
      duration: 3 days
      priority: MEDIUM

ac_id_breakdown:
  total_count: 29
  by_component:
    audit_integrity: 1
    lifecycle_management: 3
    evidence_bundles: 3
    systematic_test_suite: 3
    safe_rollout: 3
    html_validation: 1
    response_templates: 8
    proactive_challenge: 3
    new_governance_rule: 1  # CORE-025
  
  by_priority:
    CRITICAL: 1   # AC-AUDIT-007
    HIGH: 17      # AC-LIFECYCLE (3) + AC-EVIDENCE (3) + AC-ROLLOUT-SIMPLE (3) + AC-TEMPLATE (8)
    MEDIUM: 11    # AC-STS (3) + CORE-023 (1) + AC-CHALLENGE (3) + existing STS partial (1)

implementation_strategy:
  approach: Sequential sub-phases with strict dependencies
  
  sub_phases:
    - sub_phase: 9.1
      name: "Audit & Lifecycle Foundation"
      week: 1
      components: [9.1, 9.2]
      ac_ids: [AC-AUDIT-007, AC-LIFECYCLE-001, AC-LIFECYCLE-002, AC-LIFECYCLE-003]
      rationale: "Audit integrity must exist before Evidence Bundles can reference it"
      exit_criteria:
        - Hash chain operational with tamper detection
        - 7-state lifecycle state machine implemented
        - All 4 ACs have passing tests
        - Evidence bundles can reference hash chain
    
    - sub_phase: 9.2
      name: "Evidence & Validation Infrastructure"
      week: 2
      components: [9.3, 9.4, 9.6]
      ac_ids: [AC-EVIDENCE-001, AC-EVIDENCE-002, AC-EVIDENCE-003, 
               AC-STS-001, AC-STS-002, AC-STS-003, CORE-023]
      rationale: "Evidence system needs lifecycle states; STS validates evidence quality"
      exit_criteria:
        - Evidence bundles generate with test metrics + audit trail
        - STS golden corpus validation passing
        - HTML validation governance enforcing W3C compliance
        - All 7 ACs have passing tests
    
    - sub_phase: 9.3
      name: "Safety Gates & Quality Systems"
      week: 3
      components: [9.5, 9.7, 9.8]
      ac_ids: [AC-ROLLOUT-SIMPLE-001, AC-ROLLOUT-SIMPLE-002, AC-ROLLOUT-SIMPLE-003,
               AC-TEMPLATE-001, AC-TEMPLATE-002, AC-TEMPLATE-003, AC-TEMPLATE-004,
               AC-TEMPLATE-005, AC-TEMPLATE-006, AC-TEMPLATE-007, AC-TEMPLATE-008,
               AC-CHALLENGE-001, AC-CHALLENGE-002, AC-CHALLENGE-003]
      rationale: "Final safety layer - rollout gates + lean templates + proactive prevention"
      exit_criteria:
        - DRY_RUN mode operational across all orchestrators
        - Approval workflow integrated with TodoManager
        - Response templates reduced from 2046 lines to <300 lines
        - Proactive challenge system preventing governance violations
        - All 14 ACs have passing tests

dependency_graph:
  critical_path:
    - AC-AUDIT-007 (hash chain) → AC-EVIDENCE-001 (evidence needs audit provenance)
    - AC-LIFECYCLE-001-003 (states) → AC-EVIDENCE-002 (evidence captures state transitions)
    - AC-EVIDENCE-001-003 (bundles) → AC-STS-001-003 (STS validates evidence quality)
    - AC-STS-001-003 (validation) → AC-CHALLENGE-001-003 (challenge uses STS patterns)
    - AC-TEMPLATE-001-008 (templates) → AC-CHALLENGE-003 (challenge uses templates)
  
  parallel_opportunities:
    week_1:
      - AC-AUDIT-007 and AC-LIFECYCLE-001-003 can be implemented in parallel
    week_2:
      - AC-EVIDENCE-001-003 and AC-STS-001-003 can be implemented in parallel
      - CORE-023 (HTML validation) independent, can run anytime in week 2
    week_3:
      - AC-ROLLOUT-SIMPLE and AC-TEMPLATE can be implemented in parallel
      - AC-CHALLENGE depends on both, must come last

test_strategy:
  total_new_tests: ~180
  by_component:
    AC-AUDIT-007: 8 tests (hash chain integrity, tamper detection)
    AC-LIFECYCLE: 15 tests (5 tests per AC × 3)
    AC-EVIDENCE: 18 tests (6 tests per AC × 3)
    AC-STS: 30 tests (10 tests per AC × 3, plus golden corpus validation)
    AC-ROLLOUT-SIMPLE: 15 tests (5 tests per AC × 3)
    CORE-023: 5 tests (HTML validation)
    AC-TEMPLATE: 64 tests (8 tests per AC × 8)
    AC-CHALLENGE: 18 tests (6 tests per AC × 3)
  
  pass_rate_target: ">95%"
  coverage_target: ">80%"

risk_mitigation:
  technical_risks:
    - risk: "Hash chain implementation complexity"
      mitigation: "Use proven SHA-256 chaining pattern from security literature"
      impact: LOW
    
    - risk: "Evidence bundle schema too rigid"
      mitigation: "Use flexible YAML schema with optional fields"
      impact: LOW
    
    - risk: "STS golden corpus maintenance burden"
      mitigation: "Start with 20 high-value test intents, expand incrementally"
      impact: MEDIUM
    
    - risk: "Template architecture breaking existing responses"
      mitigation: "Implement with backward compatibility layer, migrate gradually"
      impact: MEDIUM
    
    - risk: "Proactive challenge false positives"
      mitigation: "Tune detection thresholds based on audit trail analysis"
      impact: MEDIUM
  
  schedule_risks:
    - risk: "3 weeks aggressive for 29 ACs"
      mitigation: "AC-IDs already scoped in hybrid-approach documents, not starting from scratch"
      impact: LOW
    
    - risk: "Dependencies between components could cause delays"
      mitigation: "Use stubs/mocks to unblock parallel work"
      impact: MEDIUM

