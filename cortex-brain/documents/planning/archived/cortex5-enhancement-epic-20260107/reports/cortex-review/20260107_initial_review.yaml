    4. Script consolidation rule exists but not enforced (duplicates possible)
    
    SMARTER ALTERNATIVES RECOMMENDED:
    1. Plugin-based orchestrator architecture (vs monolithic)
    2. Event sourcing for state management (vs JSON + SQLite mix)
    3. ML-based intent classification (vs sequential regex)
