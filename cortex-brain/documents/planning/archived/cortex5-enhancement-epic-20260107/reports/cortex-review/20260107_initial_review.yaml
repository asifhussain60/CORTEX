smarter_alternatives:
  orchestrator_architecture:
    current_approach:
      description: "Monolithic orchestrators with tight coupling to Master Orchestrator"
      issues:
        - "Hard to test in isolation"
        - "Orchestrator interface inconsistent (INT-001, MAINT-001)"
        - "No orchestrator composition or chaining"
    
    recommended_alternative:
      title: "Plugin-Based Orchestrator Architecture"
      description: |
        Implement orchestrators as plugins with strict interface contracts
      benefits:
        - "Hot-swappable orchestrators without restart"
        - "Third-party orchestrators loadable from external packages"
        - "Enforced interface via OrchestratorInterface ABC"
        - "Isolated testing with mock dependencies"
      implementation:
        - "Define OrchestratorPlugin base class with lifecycle hooks"
        - "Use entry points (setuptools) for discovery"
        - "Validation on load (schema, signature, dependencies)"
        - "Orchestrator marketplace (community plugins)"
      effort: "2 weeks (Phase P02 - new phase)"
      risk: "LOW - Well-established pattern (VS Code extensions, pytest plugins)"
      references:
        - "https://pluggy.readthedocs.io/ (pytest's plugin system)"
        - "VS Code Extension API"
  
  state_management:
    current_approach:
      description: "JSON files + SQLite database (mixed persistence)"
      issues:
        - "Race conditions (RACE-001)"
        - "No transaction support across file + DB"
        - "Inconsistent state on partial failures"
    
    recommended_alternative:
      title: "Single Source of Truth: SQLite with Event Sourcing"
      description: |
        Store ALL state in SQLite using event sourcing pattern.
        Every state change = immutable event. Reconstruct state by replaying events.
      benefits:
        - "Full audit trail (all state changes logged)"
        - "Time travel debugging (replay events to any point)"
        - "Atomic transactions (all-or-nothing state updates)"
        - "No file locking issues (SQLite handles concurrency)"
        - "Rollback to any previous state (just replay up to timestamp)"
      implementation:
        - "Events table: (id, timestamp, orchestrator, event_type, payload)"
        - "State materialized views for fast queries"
        - "Snapshotting for performance (avoid replaying 10k+ events)"
        - "Example: OrchestorExecutedEvent, PlanCreatedEvent, PhaseCompletedEvent"
      effort: "1 week (Phase P03 - new phase)"
      risk: "MEDIUM - Requires careful event schema design"
      references:
        - "https://martinfowler.com/eaaDev/EventSourcing.html"
        - "Django EventStore, SQLAlchemy event sourcing"
  
  pattern_matching:
    current_approach:
      description: "Sequential regex matching with priorities"
      issues:
        - "O(n) linear scan (PERF-002)"
        - "Pattern collision undetected (INT-004)"
        - "Hard to debug which pattern matched"
    
    recommended_alternative:
      title: "Intent Classification with ML + Rule Fallback"
      description: |
        Use lightweight NLP model (sentence-transformers) for intent classification.
        Fall back to regex for exact matches.
      benefits:
        - "Handles fuzzy matches: 'planing' → 'planning'"
        - "Understands synonyms: 'build plan' → 'create plan'"
        - "Confidence scores help disambiguate"
        - "Learns from user feedback (active learning)"
      implementation:
        - "Train on user requests → orchestrator mappings"
        - "Lightweight model: distilbert-base (40MB, <50ms inference)"
        - "Hybrid: Try ML first, fallback to regex if confidence <0.8"
        - "Incremental learning: Update model weekly from usage data"
      effort: "2 weeks (Phase P04 - new phase)"
      risk: "LOW - Many proven libraries (sentence-transformers, spaCy)"
      references:
        - "https://www.sbert.net/ (sentence-transformers)"
        - "Rasa NLU (intent classification framework)"
  
  orchestrator_execution:
    current_approach:
      description: "Synchronous single-threaded execution"
      issues:
        - "No parallelism (SCALE-001)"
        - "No resource limits (SEC-003)"
        - "No execution timeout"
    
    recommended_alternative:
      title: "Async Task Queue with Celery/Redis"
      description: |
        Orchestrators execute as async tasks with worker pool.
        Resource limits, timeouts, retry logic built-in.
      benefits:
        - "Parallel execution: 10 concurrent orchestrators"
        - "Resource limits: Memory, CPU, time per task"
        - "Retry logic: Auto-retry failed tasks 3 times"
        - "Monitoring: Celery Flower dashboard (task status, metrics)"
        - "Distributed: Workers on multiple machines (scalability)"
      implementation:
        - "Celery workers process orchestrator tasks"
        - "Redis as message broker + result backend"
        - "Task routing: Heavy tasks → dedicated workers"
        - "Priority queues: P0 tasks execute first"
      effort: "1 week (Phase P05 - new phase)"
      risk: "MEDIUM - Adds operational complexity (Redis dependency)"
      references:
        - "https://docs.celeryq.dev/"
        - "Flower monitoring: https://flower.readthedocs.io/"
  
  python_validation:
    current_approach:
      description: "Proposed PythonBestPracticesValidator with static checks"
      issues:
        - "Static analysis limited (doesn't catch runtime issues)"
        - "False positives possible (valid code flagged as bad)"
        - "Manual rule maintenance"
    
    recommended_alternative:
      title: "Integrated Linting + Type Checking Pipeline"
      description: |
        Use industry-standard tools in pre-commit pipeline:
        black (formatting), mypy (type checking), pylint (linting), bandit (security)
      benefits:
        - "Zero maintenance (tools maintained by community)"
        - "Higher accuracy (mature, battle-tested tools)"
        - "IDE integration (VS Code, PyCharm auto-fix)"
        - "Gradual adoption (opt-in per orchestrator)"
        - "Security scanning built-in (bandit detects vulnerabilities)"
      implementation:
        - "Pre-commit hooks: Run black, mypy, pylint, bandit"
        - "CI/CD: Block PRs if linting fails"
        - "Auto-fix: black reformats code automatically"
        - "Type stubs: Generate .pyi files for better type checking"
        - "Configuration: pyproject.toml (single config for all tools)"
      effort: "2 days (Phase P01.4 - replace PythonBestPracticesValidator)"
      risk: "VERY LOW - Industry standard, minimal maintenance"
      references:
        - "https://black.readthedocs.io/ (code formatter)"
        - "https://mypy.readthedocs.io/ (type checker)"
        - "https://pylint.pycqa.org/ (linter)"
        - "https://bandit.readthedocs.io/ (security linter)"
      migration_path:
        - "Phase 1: Add pre-commit config (5 minutes)"
        - "Phase 2: Fix existing violations incrementally (per orchestrator)"
        - "Phase 3: Enable strict mode after all orchestrators compliant"
  
  orchestrator_catalog:
    current_approach:
      description: "Manual orchestrators.json registry"
      issues:
        - "No automatic script discovery (INT-003)"
        - "Registry easily gets out of sync with code"
        - "No metadata validation"
    
    recommended_alternative:
      title: "Auto-Discovery via Decorators + Metadata"
      description: |
        Orchestrators register themselves using @orchestrator decorator.
        Master Orchestrator auto-discovers via module scanning.
      benefits:
        - "Zero-config registration (just add decorator)"
        - "Impossible for registry to be out of sync"
        - "Metadata validation at import time (fail fast)"
        - "Hot reload: New orchestrators loaded without restart"
      implementation:
        ```python
        @orchestrator(
            name="Planning v5",
            patterns=["^(plan|create a plan)"],
            priority=10,
            version="5.0.0"
        )
        class PlanningOrchestratorV5(OrchestratorInterface):
            def execute(self, request: str) -> Result:
                ...
        ```
        Master Orchestrator scans src/orchestrators/ for @orchestrator decorators.
      effort: "3 days (Phase P06 - new phase)"
      risk: "LOW - Common pattern (Flask routes, pytest fixtures)"
      references:
        - "Flask @app.route() decorator pattern"
        - "Python importlib for dynamic module loading"

