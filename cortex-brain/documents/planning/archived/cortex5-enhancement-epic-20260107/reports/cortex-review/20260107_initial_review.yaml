edge_cases:
  race_conditions:
    - id: "RACE-001"
      severity: "CRITICAL"
      title: "StateManager concurrent write corruption"
      likelihood: "HIGH"
      impact: "CRITICAL"
      test_exists: false
      recommended_mitigation: "SQLite with WAL mode + transactions"
    
    - id: "RACE-002"
      severity: "HIGH"
      title: "Orchestrator registry concurrent modification"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: "Two orchestrators registering patterns simultaneously"
      test_exists: false
      recommended_mitigation: "Thread-safe registry with locks or atomic operations"
    
    - id: "RACE-003"
      severity: "MEDIUM"
      title: "Knowledge cache invalidation race"
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      scenario: "Cache update during concurrent read operations"
      test_exists: false
      recommended_mitigation: "Read-write locks with copy-on-write pattern"
  
  integration_failures:
    - id: "INT-001"
      severity: "CRITICAL"
      title: "6 orchestrators cannot instantiate"
      likelihood: "CONFIRMED"
      impact: "CRITICAL"
      failures:
        - "planning_v5: SyntaxError (f-string backslash)"
        - "tdd_orchestrator: Unexpected kwarg 'config_path'"
        - "ado_orchestrator_v2: Missing 'state_db' parameter"
        - "sanitization: Unexpected kwarg 'config_path'"
        - "cleanup_v2: Missing 'state_db' parameter"
        - "vacuum_v2: StateManager.log_execution() missing"
      status: "BLOCKING - Must fix immediately"
    
    - id: "INT-002"
      severity: "HIGH"
      title: "Master Orchestrator → Child orchestrator contract violations"
      likelihood: "HIGH"
      impact: "HIGH"
      scenario: |
        MasterOrchestrator expects all child orchestrators to accept:
        (config_path, state_db, logger) but actual signatures vary wildly
      test_exists: false
      recommended_mitigation: |
        Define OrchestratorInterface (ABC) with mandatory __init__ signature:
        def __init__(self, config: OrchestratorConfig, state_db: StateDB, logger: Logger)
        All orchestrators MUST implement this interface (enforced via ABC)
    
    - id: "INT-003"
      severity: "HIGH"
      title: "Python script duplication not prevented"
      likelihood: "HIGH"
      impact: "MEDIUM"
      scenario: |
        SKULL rule SCRIPT_CONSOLIDATION exists but NOT enforced in Master
        Orchestrator. Orchestrators can create duplicate Python scripts without
        detection or blocking.
      test_exists: false
      recommended_mitigation: |
        Add ScriptDeduplicationValidator middleware:
        1. Before orchestrator creates Python file, scan for similar files
        2. Use AST parsing to detect functional equivalence
        3. Block creation if duplicate found, suggest consolidation
        4. Reference: brain-protection-rules.yaml (SCRIPT_CONSOLIDATION)
    
    - id: "INT-004"
      severity: "MEDIUM"
      title: "Orchestrator pattern collision detection missing"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: |
        Two orchestrators register overlapping regex patterns:
        ^(vacuum|clean) and ^(clean|cleanup) → Which executes?
      test_exists: false
      recommended_mitigation: |
        Add PatternCollisionDetector:
        1. Validate all patterns in orchestrators.json on startup
        2. Detect regex overlaps using test inputs
        3. Fail fast with actionable error: "Pattern collision: vacuum vs cleanup"
        4. Require explicit priority disambiguation
  
  deployment_pitfalls:
    - id: "DEPLOY-001"
      severity: "CRITICAL"
      title: "No rollback strategy for CORTEX-5.5 migration"
      likelihood: "MEDIUM"
      impact: "CRITICAL"
      status: "BLOCKING Phase 0"
    
    - id: "DEPLOY-002"
      severity: "HIGH"
      title: "No orchestrator versioning or rollback"
      likelihood: "HIGH"
      impact: "HIGH"
      scenario: |
        Planning v5 update breaks existing plans. No way to rollback to v4.
      test_exists: false
      recommended_mitigation: |
        Implement orchestrator versioning:
        1. Each orchestrator manifest includes semantic version
        2. Plans track which orchestrator version created them
        3. Rollback mechanism: git revert + orchestrator registry update
        4. Backward compatibility tests for major version changes
    
    - id: "DEPLOY-003"
      severity: "MEDIUM"
      title: "No database migration rollback"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: |
        Phase 0 migrates database schema. If Phase P00B fails, database
        schema is incompatible with CORTEX-5.0 code (cannot revert).
      test_exists: false
      recommended_mitigation: |
        Implement database migration system:
        1. Alembic or custom migration framework
        2. Each migration has forward + backward scripts
        3. Rollback script runs backward migrations in reverse order
        4. Validation: Apply forward, rollback, verify original state
    
    - id: "DEPLOY-004"
      severity: "HIGH"
      title: "No canary deployment or gradual rollout"
      likelihood: "LOW"
      impact: "CRITICAL"
      scenario: |
        CORTEX-5.5 deployed to all users immediately. If critical bug found,
        all users affected (no way to limit blast radius).
      test_exists: false
      recommended_mitigation: |
        Implement feature flags:
        1. Environment variable: CORTEX_USE_V5_ORCHESTRATORS=true/false
        2. Gradual rollout: 10% users → 50% → 100%
        3. Quick rollback: Toggle feature flag without code deployment
  
  security_vulnerabilities:
    - id: "SEC-001"
      severity: "MEDIUM"
      title: "Company knowledge path traversal risk"
      likelihood: "LOW"
      impact: "HIGH"
      recommended_mitigation: "Validate company_id: ^[a-zA-Z0-9_-]+$"
    
    - id: "SEC-002"
      severity: "MEDIUM"
      title: "No validation of orchestrator code quality"
      likelihood: "HIGH"
      impact: "MEDIUM"
      recommended_mitigation: |
        Add PythonBestPracticesValidator to enforce:
        - No hardcoded credentials (security best practices)
        - Input validation patterns (OWASP Top 10)
        - Type safety via type hints
        - Docstring security notes for sensitive functions
    
    - id: "SEC-003"
      severity: "HIGH"
      title: "No orchestrator sandboxing or resource limits"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: |
        Malicious or buggy orchestrator executes infinite loop, consumes 100%
        CPU/memory, crashes CORTEX or host system.
      test_exists: false
      recommended_mitigation: |
        Implement orchestrator sandboxing:
        1. CPU time limit: 60 seconds per orchestrator execution
        2. Memory limit: 500MB per orchestrator process
        3. File system access control: Read-only except approved directories
        4. Network access control: Disable unless explicitly allowed
        5. Use multiprocessing with resource.setrlimit() or Docker containers
    
    - id: "SEC-004"
      severity: "HIGH"
      title: "No audit logging for orchestrator actions"
      likelihood: "HIGH"
      impact: "MEDIUM"
      scenario: |
        Orchestrator modifies critical files. No audit trail to determine:
        - Which orchestrator made change
        - When change occurred
        - What was changed (diff)
        - Why change was made (user request context)
      test_exists: false
      recommended_mitigation: |
        Implement comprehensive audit logging:
        1. All file modifications logged to cortex-brain/audit-logs/
        2. Log format: JSON with timestamp, orchestrator, user_request, file_path, diff
        3. Tamper-proof: Append-only with checksums
        4. Retention: 90 days minimum
        5. Query interface: Search by orchestrator, date, file, user
    
    - id: "SEC-005"
      severity: "MEDIUM"
      title: "Orchestrator code injection vulnerability"
      likelihood: "LOW"
      impact: "CRITICAL"
      scenario: |
        User request contains Python code injection:
        "plan system with user input: '; import os; os.system('rm -rf /')"
        If orchestrator naively executes this, system compromised.
      test_exists: false
      recommended_mitigation: |
        Implement input sanitization:
        1. Validate all user input before passing to orchestrators
        2. Escape special characters in templates
        3. Use parameterized queries for database operations
        4. Never eval() or exec() user input
        5. Static analysis: Detect dangerous patterns (eval, exec, __import__)
  
  performance_bottlenecks:
    - id: "PERF-001"
      severity: "MEDIUM"
      title: "Knowledge merge not cached"
      likelihood: "HIGH"
      impact: "MEDIUM"
      recommended_mitigation: "In-memory cache with 5-minute TTL"
    
    - id: "PERF-002"
      severity: "HIGH"
      title: "Master Orchestrator pattern matching O(n) linear scan"
      likelihood: "CONFIRMED"
      impact: "MEDIUM"
      scenario: |
        With 10+ orchestrators, each user request scans all patterns
        sequentially. As orchestrators grow to 50+, latency increases.
      test_exists: false
      recommended_mitigation: |
        Optimize pattern matching:
        1. Pre-compile all regex patterns on startup
        2. Use trie or prefix tree for keyword-based routing
        3. Implement pattern priority sorting (highest priority first)
        4. Cache recent pattern matches with LRU eviction
        5. Target: <10ms pattern matching for 50+ orchestrators
    
    - id: "PERF-003"
      severity: "MEDIUM"
      title: "Orchestrator registry loaded on every request"
      likelihood: "HIGH"
      impact: "LOW"
      scenario: |
        orchestrators.json (10KB+) loaded from disk on every user request.
        As registry grows, I/O overhead increases.
      test_exists: false
      recommended_mitigation: |
        Implement registry caching:
        1. Load orchestrators.json once on startup
        2. Watch file for changes using file system monitoring
        3. Reload only if file modified (hot reload)
        4. In-memory cache with refresh on demand
    
    - id: "PERF-004"
      severity: "LOW"
      title: "No orchestrator execution metrics"
      likelihood: "HIGH"
      impact: "LOW"
      scenario: |
        Cannot identify slow orchestrators or performance regressions.
        No data to optimize.
      test_exists: false
      recommended_mitigation: |
        Implement performance metrics:
        1. Track execution time per orchestrator per request
        2. Log to cortex-brain/metrics/orchestrator-metrics.jsonl
        3. Aggregate: P50, P95, P99 latency by orchestrator
        4. Alert if execution time exceeds threshold (e.g., >30s)
        5. Dashboard: Visualize slowest orchestrators over time
  
  scalability_limits:
    - id: "SCALE-001"
      severity: "HIGH"
      title: "Single-threaded orchestrator execution"
      likelihood: "CONFIRMED"
      impact: "HIGH"
      scenario: |
        User requests processed sequentially. If 10 users submit requests,
        9 wait for orchestrator to finish (no parallelism).
      test_exists: false
      recommended_mitigation: |
        Implement concurrent orchestrator execution:
        1. Use asyncio or multiprocessing for parallel orchestrators
        2. Queue system: User requests → Queue → Worker pool
        3. Worker pool size: Configurable (default: CPU cores)
        4. State isolation: Each worker has independent state_db connection
        5. Graceful degradation: If queue full, reject with 429 error
    
    - id: "SCALE-002"
      severity: "MEDIUM"
      title: "No orchestrator result caching"
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      scenario: |
        User asks "plan user auth" twice. Orchestrator re-executes full
        analysis both times (duplicate work).
      test_exists: false
      recommended_mitigation: |
        Implement result caching:
        1. Hash user request (normalized form)
        2. Cache orchestrator output with TTL (30 minutes)
        3. Return cached result for identical requests
        4. Invalidate cache on relevant file changes
        5. Cache storage: Redis or in-memory with LRU
    
    - id: "SCALE-003"
      severity: "MEDIUM"
      title: "File system limitations for large plan folders"
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      scenario: |
        Plan with 1000+ files (large codebase). File system becomes slow.
        Plan viewer HTML rendering crashes browser (>50MB HTML).
      test_exists: false
      recommended_mitigation: |
        Implement plan storage optimization:
        1. Compress large artifacts (>1MB) with gzip
        2. Lazy-load plan viewer sections (virtualization)
        3. Database storage for plan metadata (faster queries)
        4. Archive old plans to S3 or external storage
        5. Limit: Warn if plan exceeds 500 files or 100MB
  
  data_integrity_gaps:
    - id: "DATA-001"
      severity: "CRITICAL"
      title: "No database backup strategy"
      likelihood: "HIGH"
      impact: "CRITICAL"
      scenario: |
        planning_state.db corrupted (disk failure, bug). All plan state lost.
      test_exists: false
      recommended_mitigation: |
        Implement database backup:
        1. Daily automated backups to cortex-brain/backups/
        2. Retention: 7 daily + 4 weekly + 3 monthly backups
        3. Backup validation: Restore test on separate database
        4. Recovery procedure documented in docs/
        5. Backup size limit: Rotate to external storage if >1GB
    
    - id: "DATA-002"
      severity: "HIGH"
      title: "No plan state validation"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: |
        progress-tracker.json manually edited, contains invalid JSON or
        invalid phase numbers. Plan continuation crashes.
      test_exists: false
      recommended_mitigation: |
        Implement state validation:
        1. JSON schema validation on all state files
        2. Pre-load validation before orchestrator execution
        3. Checksum verification (detect tampering)
        4. Auto-repair: Fix common issues (missing fields, wrong types)
        5. Fail gracefully: Clear error message if irrecoverable
    
    - id: "DATA-003"
      severity: "MEDIUM"
      title: "No orchestrator output sanitization"
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      scenario: |
        Orchestrator generates Markdown with malicious JavaScript:
        <script>alert('XSS')</script>
        Plan viewer HTML renders script (XSS attack).
      test_exists: false
      recommended_mitigation: |
        Implement output sanitization:
        1. Strip all <script> tags from orchestrator output
        2. Escape HTML entities in code blocks
        3. Use Content Security Policy (CSP) in plan viewer
        4. Validate Markdown before rendering (no inline JS)
  
  dependency_risks:
    - id: "DEP-001"
      severity: "HIGH"
      title: "No dependency pinning in requirements.txt"
      likelihood: "HIGH"
      impact: "HIGH"
      scenario: |
        requirements.txt uses unpinned versions: pyyaml>=6.0
        New major version released with breaking changes, CORTEX breaks.
      test_exists: false
      recommended_mitigation: |
        Implement dependency pinning:
        1. Pin all dependencies: pyyaml==6.0.1 (exact version)
        2. Use pip-compile (pip-tools) to generate lock file
        3. Automated tests on dependency updates (Dependabot)
        4. Document upgrade process in docs/dependency-upgrades.md
    
    - id: "DEP-002"
      severity: "MEDIUM"
      title: "No dependency vulnerability scanning"
      likelihood: "MEDIUM"
      impact: "HIGH"
      scenario: |
        Using pyyaml 6.0 with CVE-2020-1234 (arbitrary code execution).
        CORTEX vulnerable but unaware.
      test_exists: false
      recommended_mitigation: |
        Implement vulnerability scanning:
        1. Run pip-audit or safety check on every commit (CI/CD)
        2. Block deployment if critical vulnerabilities found
        3. Automated PR creation for security patches (Dependabot)
        4. Security policy: Patch critical within 24 hours
    
    - id: "DEP-003"
      severity: "LOW"
      title: "No license compliance verification"
      likelihood: "LOW"
      impact: "MEDIUM"
      scenario: |
        Using library with GPL license (copyleft). CORTEX must be open-sourced.
      test_exists: false
      recommended_mitigation: |
        Implement license scanning:
        1. Run pip-licenses on every dependency
        2. Whitelist: MIT, Apache 2.0, BSD
        3. Block: GPL, AGPL (unless explicitly approved)
        4. Generate license report: docs/third-party-licenses.md
  
  maintainability_issues:
    - id: "MAINT-001"
      severity: "HIGH"
      title: "No orchestrator interface contract"
      likelihood: "CONFIRMED"
      impact: "HIGH"
      scenario: |
        6 orchestrators have incompatible __init__ signatures (INT-001).
        No enforced contract causes integration failures.
      test_exists: false
      recommended_mitigation: |
        Define OrchestratorInterface (Abstract Base Class):
        ```python
        from abc import ABC, abstractmethod
        
        class OrchestratorInterface(ABC):
            @abstractmethod
            def __init__(self, config: OrchestratorConfig, state_db: StateDB):
                pass
            
            @abstractmethod
            def execute(self, user_request: str) -> OrchestratorResult:
                pass
        ```
        All orchestrators MUST inherit and implement this interface.
    
    - id: "MAINT-002"
      severity: "MEDIUM"
      title: "No orchestrator deprecation strategy"
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      scenario: |
        Planning v4 deprecated in favor of v5. Existing plans reference v4.
        No migration path or deprecation warnings.
      test_exists: false
      recommended_mitigation: |
        Implement deprecation lifecycle:
        1. Phase 1: Mark deprecated in orchestrators.json (metadata)
        2. Phase 2: Emit warning on execution (3 months)
        3. Phase 3: Disable by default, require explicit enable (6 months)
        4. Phase 4: Remove from codebase (12 months)
        5. Migration guide: Auto-upgrade plans to new version
    
    - id: "MAINT-003"
      severity: "HIGH"
      title: "No integration test coverage for orchestrator workflows"
      likelihood: "CONFIRMED"
      impact: "HIGH"
      scenario: |
        Test coverage 19% (10 tests for 52 files). Orchestrator integration
        tests missing (e.g., Planning v5 → TDD v2 → Git commit workflow).
      test_exists: false
      recommended_mitigation: |
        Implement integration test suite:
        1. End-to-end workflow tests (plan → implement → test → commit)
        2. Orchestrator interaction tests (master → child communication)
        3. State persistence tests (plan continuation across sessions)
        4. Target: 80%+ coverage across all orchestrators
        5. CI/CD: Block merges if tests fail

