---
# CORTEX Epic Restructuring Requirements
# Date: 2026-01-07
# Purpose: Define requirements for planning orchestrator to implement strict design

restructuring_analysis:
  current_violations:
    - violation: "Epic has phases directly (phases/phase-*.md)"
      severity: "CRITICAL"
      rule_violated: "Epic → Feature → Phase hierarchy"
      
    - violation: "Features are .md files, not executable plan folders"
      severity: "CRITICAL"
      rule_violated: "Machine-readable plans only"
      
    - violation: "Tracker named progress-tracker.json not epic-progress-tracker.json"
      severity: "HIGH"
      rule_violated: "Auto-detection naming convention"
      
    - violation: "Master plan in phases/master-plan.md not root"
      severity: "MEDIUM"
      rule_violated: "Epic master plan location"
      
    - violation: "Multiple files on root (intermittent-thoughts.txt)"
      severity: "MEDIUM"
      rule_violated: "Root file organization (only plan-viewer.html + CONTINUATION-PROMPT.md)"

target_structure:
  epic_root:
    allowed_files:
      - "plan-viewer.html"  # Generated by planning orchestrator
      - "CONTINUATION-PROMPT.md"  # Generated by planning orchestrator
      - "master-plan.md"  # Moved from phases/
    
    required_folders:
      - "features/"  # Full feature plan folders (NOT .md files)
      - "tracking/"  # Contains epic-progress-tracker.json
      - "analysis/"
      - "artifacts/"
      - "context/"
      - "reports/"
      - "phases/"  # Can contain epic coordination docs, but NO executable phases
  
  feature_structure:
    naming: "{feature-name-suffix}"  # e.g., "planning-system-core" not "feat-planning-system-core"
    max_length: 25
    
    required_folders:
      - "phases/"  # Executable phase files (ph1-*, ph2-*, etc.)
      - "tracking/"  # Contains progress-tracker.json
      - "analysis/"
      - "artifacts/"
      - "context/"
      - "reports/"
    
    required_files:
      - "tracking/progress-tracker.json"  # Machine-readable feature progress
      - "plan-viewer.html"  # Generated by planning orchestrator (feature-level view)

feature_mapping:
  # Current .md files → Target feature folders
  features_to_create:
    - current: "features/planning-system.md"
      target: "features/planning-system-core/"
      priority: "P0_FOUNDATION"
      snowball_tier: 1
      phases:
        - "ph1-epic-feature-hierarchy"
        - "ph2-machine-readable-format"
        - "ph3-auto-detection-logic"
        - "ph4-snowball-orchestrator"
    
    - current: "features/governance-rules.md"
      target: "features/governance-rules/"
      priority: "P0_FOUNDATION"
      snowball_tier: 1
      phases:
        - "ph1-brain-protection-v2"
        - "ph2-runtime-enforcement"
        - "ph3-governance-checkpoints"
    
    - current: "features/testing-framework.md"
      target: "features/testing-framework/"
      priority: "P0_FOUNDATION"
      snowball_tier: 1
      phases:
        - "ph1-tdd-harness"
        - "ph2-orchestrator-tests"
        - "ph3-integration-suite"
    
    - current: "features/goal-detection.md"
      target: "features/goal-detection/"
      priority: "P1_INTELLIGENCE"
      snowball_tier: 2
      phases:
        - "ph1-nlp-extraction"
        - "ph2-pattern-matching"
        - "ph3-validation-logic"
    
    - current: "features/goal-inheritance.md"
      target: "features/goal-inheritance/"
      priority: "P1_INTELLIGENCE"
      snowball_tier: 2
      phases:
        - "ph1-hierarchy-propagation"
        - "ph2-conflict-resolution"
    
    - current: "features/knowledge-integration.md"
      target: "features/knowledge-integration/"
      priority: "P2_INTELLIGENCE"
      snowball_tier: 2
      phases:
        - "ph1-tier2-queries"
        - "ph2-cross-plan-analytics"
    
    - current: "features/response-templates.md"
      target: "features/response-templates/"
      priority: "P1_USER_EXPERIENCE"
      snowball_tier: 3
      phases:
        - "ph1-accessibility-rules"
        - "ph2-cognitive-load"
        - "ph3-concise-mode"
    
    - current: "features/continuation-system.md"
      target: "features/continuation-system/"
      priority: "P1_USER_EXPERIENCE"
      snowball_tier: 3
      phases:
        - "ph1-session-management"
        - "ph2-token-limits"
    
    - current: "features/plan-viewer.md"
      target: "features/plan-viewer-enhancements/"
      priority: "P1_USER_EXPERIENCE"
      snowball_tier: 3
      phases:
        - "ph1-universal-viewer"
        - "ph2-auto-detection"
        - "ph3-progress-viz"
    
    - current: "features/toolkit-orchestration.md"
      target: "features/toolkit-orchestration/"
      priority: "P2_USER_EXPERIENCE"
      snowball_tier: 3
      phases:
        - "ph1-script-generation"
        - "ph2-execution-automation"

implementation_by_orchestrator:
  python_script_location: "src/orchestrators/planning_orchestrator.py"
  
  required_methods:
    - method: "create_epic_structure()"
      generates:
        - "tracking/epic-progress-tracker.json"
        - "plan-viewer.html"
        - "CONTINUATION-PROMPT.md"
        - "features/{feature}/ folders"
    
    - method: "create_feature_structure()"
      generates:
        - "phases/ folder with ph1-*, ph2-* files"
        - "tracking/progress-tracker.json"
        - "plan-viewer.html (feature-level)"
        - "All standard subfolders"
    
    - method: "generate_plan_viewer_html()"
      inputs:
        - "tracking/epic-progress-tracker.json OR progress-tracker.json"
      outputs:
        - "plan-viewer.html with auto-detection logic"
      technology: "Pure HTML/CSS/JavaScript (file:// protocol compatible)"
    
    - method: "generate_continuation_prompt()"
      inputs:
        - "tracking/progress-tracker.json"
      outputs:
        - "CONTINUATION-PROMPT.md (concise, action-oriented)"
      max_lines: 20
    
    - method: "migrate_epic_structure()"
      actions:
        - "Backup current epic"
        - "Create new feature folders from .md files"
        - "Distribute phases to features"
        - "Move master-plan.md to root"
        - "Rename tracker to epic-progress-tracker.json"
        - "Clean root (delete intermittent-thoughts.txt, etc.)"
        - "Generate plan-viewer.html"
        - "Generate CONTINUATION-PROMPT.md"

validation_rules:
  post_restructuring:
    - check: "Root has EXACTLY 3 files (plan-viewer.html, CONTINUATION-PROMPT.md, master-plan.md)"
      severity: "CRITICAL"
    
    - check: "tracking/epic-progress-tracker.json exists and is valid JSON"
      severity: "CRITICAL"
    
    - check: "All features/ subfolders have tracking/progress-tracker.json"
      severity: "CRITICAL"
    
    - check: "Zero .md files in features/ root (only in subfolders)"
      severity: "CRITICAL"
    
    - check: "All feature folders have phases/ subfolder"
      severity: "HIGH"
    
    - check: "plan-viewer.html can be opened with file:// protocol"
      severity: "HIGH"

copilot_role:
  what_copilot_does:
    - "Route user request to planning orchestrator"
    - "Monitor Python execution via terminal"
    - "Report completion status"
  
  what_copilot_never_does:
    - "Manually create plan structures"
    - "Manually write plan-viewer.html"
    - "Manually create tracking JSON files"
    - "Manually organize folders"
  
  invocation_command: "python3 -m src.main 'restructure cortex5-epic to strict design' --format markdown"

next_steps:
  immediate:
    - "Update planning orchestrator with methods above"
    - "Implement generate_plan_viewer_html() with auto-detection"
    - "Implement migrate_epic_structure() method"
    - "Add validation checks"
  
  execution:
    - "Invoke: python3 -m src.main 'restructure cortex5-epic'"
    - "Orchestrator backs up current epic"
    - "Orchestrator creates proper structure"
    - "Orchestrator validates result"
    - "Orchestrator commits changes"
  
  user_verification:
    - "Open plan-viewer.html in browser"
    - "Verify epic shows 10 features in 3 tiers"
    - "Verify features/ has 10 folders (no .md files)"
    - "Verify root has only 3 files"
