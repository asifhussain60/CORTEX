        • No atomic write operations
        • No transaction support
        
        Failure sequence:
        1. Orchestrator A reads state.json
        2. Orchestrator B reads state.json (same content)
        3. Orchestrator A modifies state, writes state.json
        4. Orchestrator B modifies state, writes state.json
