      rationale: "Isolate breaking changes"
  
  during_refactor:
    - check: "Remove all .md generation methods"
      validation: "grep -r 'def _generate.*_md' src/orchestrators/planning/ returns zero results"
    
    - check: "Update tests to verify NO .md creation"
      validation: "test_no_markdown_generation_during_execution() passes"
    
    - check: "Update orchestrator registry (version 7.0.0)"
      validation: "orchestrators.json shows planning_v7 with correct manifest path"
  
  post_refactor:
