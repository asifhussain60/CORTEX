        ### BREAKING CHANGES
        - Planning Orchestrator no longer generates .md files during execution
        - Removed: 00-{plan-name}.md, CONTINUATION-PROMPT.md, README.md
        - Use plan-viewer.html for human-readable plan viewing
        
        ### Rationale
        - REQ-048: Markdown only for knowledge library updates at end of cycle
        - Strict Python/YAML execution policy
        - Single source of truth: feature.yaml files
    
    - check: "Create migration guide"
      location: "docs/migrations/planning-orchestrator-v6-to-v7.md"
    
    - check: "Update documentation"
      files:
        - "README.md (mention v7 changes)"
        - "docs/orchestrators/planning-system.md"
        - "cortex-brain/manifests/orchestrators/planning-system-7.0-manifest.yaml"

