# Planning Orchestrator v7 Refactoring Requirements
# Eliminate Markdown Generation During Execution (REQ-048)
# Generated: 2026-01-07T12:30:00Z

metadata:
  document_type: refactoring_requirements
  target_component: Planning Orchestrator v5/v6
  new_version: v7
  epic_id: cortex5-epic
  requirement_id: REQ-048
  generated_timestamp: '2026-01-07T12:30:00Z'
  author: CORTEX Analysis System
  priority: P0_CRITICAL
  estimated_effort: "6 hours"
  blocking: true

# =============================================================================
# USER REQUIREMENT
# =============================================================================

user_requirement:
  requirement_id: REQ-048
  user_statement: |
    "The only time markdown should happen is when learning libraries are updated
    which should happen at the end of each planning cycle."
  
  interpretation:
    - "✅ Markdown allowed for knowledge library documentation updates"
    - "✅ Timing: END of planning cycle (separate utility, not orchestrator)"
    - "❌ Planning Orchestrator should NOT generate .md files during execution"
    - "❌ No summary reports in Markdown at end of orchestrator cycles"
  
  current_violation:
    component: "Planning Orchestrator v5/v6"
    files_generated:
      - file: "00-{plan-name}.md"
        purpose: "Human-readable master plan summary"
        justification: "Redundant with feature.yaml (authoritative source)"
        remove: true
      
      - file: "CONTINUATION-PROMPT.md"
        purpose: "Human handoff instructions for next execution"
        justification: "State tracked in SQLite; plan-viewer.html provides context"
        remove: true
      
      - file: "README.md"
        purpose: "Epic-level overview (only in epic mode)"
        justification: "plan-viewer.html provides better visualization"
        remove: true
    
    severity: HIGH
    impact: "Violates strict Python/YAML execution policy"

# =============================================================================
# REFACTORING STRATEGY
# =============================================================================

refactoring_strategy:
  approach: "Surgical removal of Markdown generation logic"
  
  phases:
    - phase: 1
      name: "Code Analysis"
      tasks:
        - "Identify all .md generation call sites in Planning Orchestrator"
        - "Map dependencies (which methods call Markdown generators)"
        - "Identify tests that verify .md file creation"
        - "Document current behavior for migration guide"
      estimated_time: "1 hour"
    
    - phase: 2
      name: "Remove Markdown Generation"
      tasks:
        - "Remove _generate_master_plan_md() method"
        - "Remove _generate_continuation_prompt_md() method"
        - "Remove _generate_readme_md() method (epic mode)"
        - "Remove all calls to these methods from execute_phase_*() methods"
        - "Update PlanningResult to remove .md file references"
      estimated_time: "2 hours"
    
    - phase: 3
      name: "Update Tests"
      tasks:
        - "Remove tests verifying .md file creation"
        - "Add tests verifying NO .md files created"
        - "Update integration tests (plan creation workflows)"
        - "Add regression test: 'test_no_markdown_generation_during_execution()'"
      estimated_time: "1.5 hours"
    
    - phase: 4
      name: "Update Documentation"
      tasks:
        - "Update Planning Orchestrator manifest (remove .md from deliverables)"
        - "Update CHANGELOG.md (breaking change)"
        - "Create migration guide for users expecting .md files"
        - "Update plan-viewer.html documentation (now PRIMARY plan viewer)"
      estimated_time: "1 hour"
    
    - phase: 5
      name: "Validation & Deployment"
      tasks:
        - "Run full test suite (unit + integration)"
        - "Execute Planning Orchestrator in test environment"
        - "Verify feature.yaml created, NO .md files"
        - "Verify plan-viewer.html renders correctly"
        - "Update orchestrator registry (version bump to v7)"
      estimated_time: "0.5 hours"

# =============================================================================
# IMPLEMENTATION DETAILS
# =============================================================================

implementation_details:
  files_to_modify:
    - file: "src/orchestrators/planning/planning_orchestrator_v5.py"
      changes:
        - action: REMOVE
          method: "_generate_master_plan_md"
          lines: "~450-550"
          rationale: "Generates 00-{plan-name}.md (redundant)"
        
        - action: REMOVE
          method: "_generate_continuation_prompt_md"
          lines: "~550-650"
          rationale: "Generates CONTINUATION-PROMPT.md (state in SQLite)"
        
        - action: REMOVE
          method: "_generate_readme_md"
          lines: "~650-700"
          rationale: "Generates README.md in epic mode"
        
        - action: MODIFY
          method: "execute_phase_4"
          lines: "~850-900"
          change: "Remove calls to _generate_master_plan_md() and _generate_continuation_prompt_md()"
        
        - action: MODIFY
          class_attribute: "DELIVERABLES"
          change: |
            Before: ["feature.yaml", "00-plan.md", "CONTINUATION-PROMPT.md", "plan-viewer.html"]
            After: ["feature.yaml", "plan-viewer.html"]
    
    - file: "tests/orchestrators/planning/test_planning_orchestrator_v5.py"
      changes:
        - action: REMOVE
          test: "test_generates_master_plan_md"
          rationale: "No longer applicable"
        
        - action: REMOVE
          test: "test_generates_continuation_prompt"
          rationale: "No longer applicable"
        
        - action: ADD
          test: "test_no_markdown_generation_during_execution"
          code: |
            def test_no_markdown_generation_during_execution(self):
                """Verify Planning Orchestrator does NOT generate .md files."""
                result = orchestrator.execute(request={"type": "epic", "name": "test-epic"})
                
                plan_dir = Path(result['plan_directory'])
                md_files = list(plan_dir.rglob("*.md"))
                
                # CRITICAL: NO .md files should exist after orchestrator execution
                assert len(md_files) == 0, f"Found .md files: {md_files}. Violates REQ-048."
    
    - file: "cortex-brain/manifests/orchestrators/planning-system-5.0-manifest.yaml"
      changes:
        - action: UPDATE
          field: "version"
          value: "7.0.0"
        
        - action: UPDATE
          field: "deliverables"
          before:
            - "00-{plan-name}.md"
            - "feature.yaml files"
            - "CONTINUATION-PROMPT.md"
            - "plan-viewer.html"
          after:
            - "feature.yaml files (authoritative source)"
            - "plan-viewer.html (human viewing)"
        
        - action: ADD
          field: "breaking_changes"
          value:
            - change: "No longer generates .md files during execution"
              version: "7.0.0"
              rationale: "REQ-048: Markdown only for knowledge library updates at END of cycle"
              migration: "Use plan-viewer.html for human-readable plan viewing"

# =============================================================================
# ALTERNATIVE APPROACH: FEATURE.YAML ENHANCEMENTS
# =============================================================================

alternative_approach:
  name: "Enhance feature.yaml Descriptions"
  rationale: |
    Users may lose human-readable context without 00-plan.md. Enhance
    feature.yaml to include richer descriptions that plan-viewer.html
    can render beautifully.
  
  enhancements:
    - enhancement: "Add 'description' field to feature.yaml (Markdown-formatted string)"
      example: |
        feature:
          id: feat01
          name: "User Authentication"
          description: |
            # Feature Overview
            Implement OAuth2 authentication with JWT tokens.
            
            ## Success Criteria
            - 99.9% uptime
            - <100ms token validation
      notes: "Markdown EMBEDDED as string in YAML (not separate .md file)"
    
    - enhancement: "plan-viewer.html renders 'description' field with Markdown parser"
      implementation: "Use marked.js or similar client-side Markdown renderer"
    
    - enhancement: "Add 'rationale' field for architectural decisions"
      example: |
        architecture_decision:
          id: AD-001
          decision: "Use PostgreSQL instead of MongoDB"
          rationale: "ACID compliance required for financial transactions"
  
  benefits:
    - "Preserves human-readable context"
    - "Single source of truth (feature.yaml)"
    - "No .md files generated during execution"
    - "plan-viewer.html provides rich rendering"

# =============================================================================
# KNOWLEDGE LIBRARY UPDATER (COMPANION UTILITY)
# =============================================================================

knowledge_library_updater:
  name: "KnowledgeLibraryUpdater"
  purpose: "Update knowledge library Markdown files at END of planning cycle"
  timing: "Post-planning-cycle (separate invocation)"
  
  workflow:
    - step: 1
      action: "User completes planning cycle (all phases executed)"
      output: "feature.yaml files + execution logs"
    
    - step: 2
      action: "User invokes: 'update knowledge library from cortex5-epic'"
      orchestrator: "KnowledgeLibraryUpdater"
    
    - step: 3
      action: "Utility extracts learnings from plan execution"
      analysis:
        - "Identify patterns (e.g., 'Always use X for Y scenario')"
        - "Extract architectural decisions"
        - "Capture troubleshooting resolutions"
        - "Identify best practices"
    
    - step: 4
      action: "Generate Markdown documentation"
      output_location: "cortex-brain/knowledge-library/planning/"
      files_created:
        - "planning-patterns-{timestamp}.md"
        - "architectural-decisions-{timestamp}.md"
        - "troubleshooting-guide-{timestamp}.md"
    
    - step: 5
      action: "Commit knowledge library updates to git"
      message: "docs(knowledge): Add learnings from cortex5-epic planning cycle"
  
  implementation:
    location: "src/orchestrators/knowledge/knowledge_library_updater.py"
    manifest: "cortex-brain/manifests/orchestrators/knowledge-library-updater.yaml"
    estimated_effort: "4 hours"
    trigger_patterns:
      - "update knowledge library from {plan_name}"
      - "extract learnings from {plan_name}"
      - "document patterns from {plan_name}"

# =============================================================================
# MIGRATION GUIDE FOR USERS
# =============================================================================

migration_guide:
  title: "Migrating from Planning Orchestrator v5/v6 to v7"
  
  breaking_changes:
    - change: "No more 00-{plan-name}.md file"
      impact: "Users relying on .md summary for reading plans"
      solution: "Use plan-viewer.html instead (richer visualization)"
    
    - change: "No more CONTINUATION-PROMPT.md file"
      impact: "Users relying on prompt for next execution"
      solution: "State tracked in SQLite; plan-viewer.html shows progress"
    
    - change: "No more README.md in epic mode"
      impact: "Users expecting GitHub-friendly epic overview"
      solution: "plan-viewer.html serves as primary plan documentation"
  
  new_workflow:
    before_v7:
      - step: 1
        action: "User: 'create epic plan for cortex5-enhancement'"
      - step: 2
        action: "Planning Orchestrator creates:"
        files:
          - "00-cortex5-enhancement.md (human summary)"
          - "feature.yaml files (authoritative)"
          - "CONTINUATION-PROMPT.md (next steps)"
          - "plan-viewer.html (visualization)"
      - step: 3
        action: "User reads 00-cortex5-enhancement.md for overview"
    
    after_v7:
      - step: 1
        action: "User: 'create epic plan for cortex5-enhancement'"
      - step: 2
        action: "Planning Orchestrator creates:"
        files:
          - "feature.yaml files (authoritative + rich descriptions)"
          - "plan-viewer.html (primary visualization)"
      - step: 3
        action: "User opens plan-viewer.html for interactive plan viewing"
      - step: 4
        action: "End of cycle: User invokes 'update knowledge library'"
      - step: 5
        action: "KnowledgeLibraryUpdater creates .md files in knowledge-library/"
  
  benefits_of_v7:
    - "Strict Python/YAML execution (per REQ-048)"
    - "Single source of truth (feature.yaml)"
    - "No file duplication"
    - "Better separation: execution (Python/YAML) vs. documentation (Markdown)"
    - "Knowledge library updates are explicit, intentional actions"

