# CORTEX5 Epic - Architecture Document
# System Architecture with Orchestrator Hierarchy & Knowledge Integration
# Generated: 2026-01-07T11:20:00Z

metadata:
  document_type: architecture_specification
  epic_id: cortex5-epic
  epic_version: '4.0.0'
  planning_system: v6
  generated_timestamp: '2026-01-07T11:20:00Z'
  author: CORTEX Analysis System
  review_status: DRAFT
  
architectural_overview:
  system_name: "CORTEX Intelligent Orchestration Platform"
  version: "5.5.0"
  architecture_style: "Microservices with Master-Child Orchestrator Pattern"
  core_technologies:
    - Python 3.11+
    - SQLite (state management)
    - YAML (configuration)
    - JSON (data interchange)
    - Markdown (documentation)
  
  key_characteristics:
    - "Event-driven orchestration"
    - "Plugin-based extensibility"
    - "Governance-driven development"
    - "Knowledge-integrated intelligence"
    - "Autonomous execution post-LLM handoff"
    
system_layers:
  layer_1_presentation:
    name: "Presentation Layer"
    responsibility: "User interaction and intent classification"
    components:
      - component: github_copilot_chat
        type: external
        description: "Natural language interface for user requests"
        interactions:
          - "Accepts user prompts"
          - "Displays orchestrator responses"
          - "Renders progress updates"
          
      - component: cortex_prompt_router
        type: internal
        location: ".github/prompts/CORTEX.prompt.md"
        description: "Intent router mapping patterns to orchestrators"
        responsibilities:
          - "Pattern matching (regex)"
          - "LLM fallback for ambiguous requests"
          - "Confidence scoring"
          - "Orchestrator selection"
        
      - component: llm_intent_classifier
        type: internal
        location: "src/cortex_agents/llm_intent_classifier.py"
        description: "LLM-based intent classification for ambiguous requests"
        responsibilities:
          - "Classify user intent when patterns don't match"
          - "Confidence threshold ≥0.7"
          - "Fallback to human clarification if <0.7"
        
  layer_2_orchestration:
    name: "Orchestration Layer"
    responsibility: "Orchestrator management and execution coordination"
    components:
      - component: master_orchestrator
        type: core
        location: "src/orchestrators/master_orchestrator.py"
        description: "Single entry point routing to child orchestrators"
        responsibilities:
          - "Route requests to child orchestrators"
          - "Manage orchestrator registry"
          - "Enforce user mistake prevention rules (5 rules)"
          - "Coordinate multi-orchestrator workflows"
          - "Provide orchestrator lifecycle management"
        intelligence_rules:
          - "BLOCK_DIRECT_CREATION: Prevent direct file creation"
          - "YAML_FIRST_ORCHESTRATOR: Require manifests before implementation"
          - "PATTERN_COLLISION_DETECTION: Detect regex conflicts"
          - "HIERARCHY_VALIDATION: Prevent circular dependencies"
          - "DEPRECATION_ENFORCEMENT: Warn about deprecated orchestrators"
        
      - component: pattern_router
        type: core
        location: "src/orchestrators/pattern_router.py"
        description: "Pattern matching engine for orchestrator selection"
        responsibilities:
          - "Load orchestrator registry"
          - "Match user requests against patterns"
          - "Handle pattern collisions"
          - "Fallback to LLM classification"
        performance_target: "<20ms pattern matching"
        
      - component: execution_engine
        type: core
        location: "src/orchestrators/execution_engine.py"
        description: "Orchestrator execution coordinator"
        responsibilities:
          - "Load orchestrator manifest"
          - "Validate dependencies"
          - "Execute phases sequentially"
          - "Track execution state"
          - "Handle failures and rollbacks"
        
      - component: state_manager
        type: core
        location: "src/orchestrators/state_manager.py"
        description: "Orchestrator state persistence"
        responsibilities:
          - "Persist execution state to SQLite"
          - "Support state recovery after interruption"
          - "Track orchestrator history"
          - "Enable rollback capability"
        storage: "cortex-brain/database/brain-state.db"
        
      - component: orchestrator_registry
        type: data
        location: "cortex-brain/registry/orchestrators.json"
        description: "Catalog of all registered orchestrators"
        schema:
          - "id: unique_identifier"
          - "name: human_readable_name"
          - "version: semver_version"
          - "type: autonomous|guided|interactive"
          - "category: planning|qa|maintenance|extraction"
          - "class_name: PythonClassName"
          - "module_path: src.orchestrators.module"
          - "manifest_path: path_to_yaml_manifest"
          - "patterns: [regex_patterns]"
          - "dependencies: [orchestrator_ids]"
          - "capabilities: [capability_list]"
          - "enabled: true|false"
        
  layer_3_specialized_orchestrators:
    name: "Specialized Orchestrators Layer"
    responsibility: "Domain-specific workflow execution"
    
    planning_orchestrators:
      - orchestrator: planning_orchestrator_v5
        id: planning_v5
        location: "src/orchestrators/planning/planning_orchestrator_v5.py"
        manifest: "cortex-brain/manifests/orchestrators/planning-system-5.0-manifest.yaml"
        type: autonomous
        status: PRODUCTION
        description: "Create epic and feature plans with governance enforcement"
        phases:
          - "Phase 0: Discovery"
          - "Phase 1: Architecture"
          - "Phase 2: Implementation Planning"
          - "Phase 3: Validation Planning"
        deliverables:
          - "00-{plan-name}.md (master plan)"
          - "feature.yaml files (logical phase definitions)"
          - "CONTINUATION-PROMPT.md"
          - "plan-viewer.html"
        governance_integration: true
        knowledge_integration: true
        
      - orchestrator: plan_migration_orchestrator
        id: plan_migration
        location: "src/orchestrators/plan_migration/plan_migration_orchestrator.py"
        manifest: "cortex-brain/manifests/orchestrators/plan-migration-orchestrator.yaml"
        type: autonomous
        status: PRODUCTION
        description: "Migrate plans between planning system versions"
        capabilities:
          - "v5 → v6 migration (physical folders → logical YAML)"
          - "Root folder cleanup"
          - "Backup retention"
          - "Zero data loss verification"
      
      - orchestrator: knowledge_library_updater
        id: knowledge_updater
        location: "src/orchestrators/knowledge/knowledge_library_updater.py"
        manifest: "cortex-brain/manifests/orchestrators/knowledge-library-updater.yaml"
        type: utility
        status: PLANNED
        description: "Update knowledge library with Markdown documentation"
        capabilities:
          - "Update knowledge library .md files at END of planning cycle"
          - "Extract learnings from completed plans"
          - "Generate best practices documentation"
          - "Update domain knowledge files"
        timing: "Invoked at END of planning cycle (not during orchestrator execution)"
        rationale: |
          Per REQ-048: Markdown files ONLY for knowledge library updates,
          which happen at end of planning cycle. This utility is SEPARATE
          from Planning Orchestrator to enforce strict separation.
        estimated_effort: "4 hours"
        
    quality_assurance_orchestrators:
      - orchestrator: review_orchestrator_v2
        id: review_v2
        location: "src/orchestrators/review/review_orchestrator_v2.py"
        manifest: "cortex-brain/manifests/orchestrators/review-orchestrator-v2.yaml"
        type: autonomous
        status: PRODUCTION
        description: "7-phase holistic validation"
        phases:
          - "Phase 1: Epic Structure Analysis"
          - "Phase 2: Architecture Coherence Review"
          - "Phase 3: Knowledge Integration Analysis"
          - "Phase 4: Orchestrator Registry Audit"
          - "Phase 5: Edge Case & Failure Mode Analysis"
          - "Phase 6: Implementation Fidelity Check"
          - "Phase 7: Best Practices Enforcement"
        capabilities:
          - "Strategic alignment verification"
          - "Governance rule validation"
          - "Phase progression blocking on critical violations"
          - "Static analysis integration (mypy, pylint, pydocstyle)"
        
      - orchestrator: refactor_orchestrator_v2
        id: refactor_v2
        location: "src/orchestrators/refactor/refactor_orchestrator_v2.py"
        manifest: "cortex-brain/manifests/orchestrators/refactor-orchestrator-v2.yaml"
        type: autonomous
        status: PLANNED
        description: "Parent orchestrator routing to 4 refactoring children"
        children:
          - id: code_quality_child
            manifest: "cortex-brain/manifests/orchestrators/refactor-code-quality-child.yaml"
            responsibilities:
              - "Complexity reduction (cyclomatic complexity ≤10)"
              - "Duplicate elimination (DRY enforcement)"
              - "Naming improvements (PEP 8 compliance)"
              
          - id: architecture_child
            manifest: "cortex-brain/manifests/orchestrators/refactor-architecture-child.yaml"
            responsibilities:
              - "SOLID principles enforcement"
              - "Design pattern application"
              - "Modularity improvements"
              
          - id: documentation_child
            manifest: "cortex-brain/manifests/orchestrators/refactor-documentation-child.yaml"
            responsibilities:
              - "Docstring generation (Google style)"
              - "Type hint addition (PEP 484)"
              - "README synchronization"
              
          - id: testing_child
            manifest: "cortex-brain/manifests/orchestrators/refactor-testing-child.yaml"
            responsibilities:
              - "Coverage gap identification"
              - "Test quality improvement"
              - "Fixture optimization"
        
    maintenance_orchestrators:
      - orchestrator: vacuum_orchestrator_v2
        id: vacuum
        location: "src/orchestrators/vacuum/vacuum_orchestrator_v2.py"
        manifest: "cortex-brain/manifests/orchestrators/vacuum-orchestrator-v2.yaml"
        type: autonomous
        status: PRODUCTION
        description: "Deep filesystem cleanup with duplicate detection"
        capabilities:
          - "Duplicate file detection (SHA256 hashing)"
          - "Safe deletion (dry-run mode)"
          - "Backup creation before deletion"
          - "Empty folder removal"
        
      - orchestrator: housekeeping_orchestrator
        id: housekeeping
        location: "src/orchestrators/housekeeping/housekeeping_orchestrator.py"
        manifest: "cortex-brain/manifests/orchestrators/housekeeping-orchestrator.yaml"
        type: autonomous
        status: PLANNED
        description: "7-phase autonomous maintenance"
        phases:
          - phase: 1
            name: "Audit Log Analysis"
            tasks:
              - "Parse tracking/governance-audit.jsonl"
              - "Identify unfixed violations"
              - "Detect bug patterns"
              
          - phase: 2
            name: "Knowledge Absorption"
            tasks:
              - "Extract lessons learned from audit logs"
              - "Update knowledge library"
              - "Promote best practices to higher tiers"
              
          - phase: 3
            name: "Redundancy Elimination"
            tasks:
              - "Detect duplicate code"
              - "Find unused imports"
              - "Identify dead code"
              
          - phase: 4
            name: "Performance Optimization"
            tasks:
              - "Profile slow operations"
              - "Identify memory leaks"
              - "Optimize database queries"
              
          - phase: 5
            name: "Bug Detection"
            tasks:
              - "Analyze audit logs for recurring errors"
              - "Predict failure patterns"
              - "Generate bug reports"
              
          - phase: 6
            name: "Tier Promotion"
            tasks:
              - "Promote temporary fixes to permanent solutions"
              - "Move knowledge from tier 1 → tier 2 → tier 3"
              - "Archive obsolete patterns"
              
          - phase: 7
            name: "Duplicate Removal"
            tasks:
              - "Remove duplicate files"
              - "Consolidate redundant documentation"
              - "Clean temporary artifacts"
        schedule:
          daily: [phase_1, phase_3, phase_7]
          weekly: [phase_2, phase_4]
          monthly: [phase_5, phase_6]
          on_demand: [all_phases]
        
    extraction_orchestrators:
      - orchestrator: md_to_yaml_orchestrator
        id: md_to_yaml
        location: "src/orchestrators/extraction/md_to_yaml_orchestrator.py"
        manifest: "cortex-brain/manifests/orchestrators/md-to-yaml-orchestrator.yaml"
        type: autonomous
        status: REQUIRED
        warrantability: HIGH
        description: "Convert chat transcripts to structured requirements YAML"
        input:
          - "Chat transcript files (.md)"
          - "Number of files to analyze"
          - "Conflict resolution policy"
        output:
          - "requirements-{timestamp}.yaml"
          - "Confidence scores (0.0-1.0)"
          - "Conflict detection report"
        capabilities:
          - "Explicit requirement extraction (confidence 1.0)"
          - "Implicit requirement inference (confidence 0.5-0.9)"
          - "Category classification"
          - "Priority assignment (P0-P3)"
          - "Conflict resolution (timestamp precedence)"
        
      - orchestrator: git_to_yaml_orchestrator
        id: git_to_yaml
        location: "src/orchestrators/extraction/git_to_yaml_orchestrator.py"
        manifest: "cortex-brain/manifests/orchestrators/git-to-yaml-orchestrator.yaml"
        type: autonomous
        status: REQUIRED
        warrantability: HIGH
        description: "Extract team instructions from git commit messages"
        input:
          - "Git repository path"
          - "Number of commits (default 50)"
          - "Time window (e.g., 48 hours)"
          - "Branch name"
        output:
          - "git-instructions-{branch}-{timestamp}.yaml"
          - "Instruction count"
          - "Implied requirements"
          - "Pattern analysis"
        capabilities:
          - "Instruction pattern detection"
          - "Implication analysis"
          - "Pattern frequency calculation"
          - "Architectural decision extraction"
        
  layer_4_intelligence:
    name: "Intelligence Layer"
    responsibility: "Governance, knowledge integration, and quality enforcement"
    
    governance_subsystem:
      component: governance_middleware
      location: "src/intelligence/governance/governance_middleware.py"
      description: "SKULL rule enforcement pipeline"
      responsibilities:
        - "Validate requests against brain-protection-rules.yaml"
        - "Block critical violations"
        - "Log all violations to audit logs"
        - "Generate governance reports"
      rules_enforced:
        - "TDD_ENFORCEMENT: Tests before implementation"
        - "HOLISTIC_DISCOVERY: Search before create"
        - "GIT_ISOLATION: CORTEX never commits to user repos"
        - "PLANNING_ISOLATION: Planning commands create plans only"
        - "PLAN_FILE_ORGANIZATION: Files in subfolders only"
        - "PYTHON_TYPE_HINTS_MANDATORY: Type hints required"
        - "PYTHON_DOCSTRINGS_MANDATORY: Docstrings required"
        - "PYTHON_CODE_FORMATTING_REQUIRED: black formatting"
        - "PYTHON_IMPORT_ORGANIZATION_REQUIRED: isort sorting"
      
      component: audit_logging_system
      location: "src/intelligence/audit/audit_logger.py"
      description: "Enterprise audit logging for all operations"
      log_format: JSONL
      log_location: "cortex-brain/audit-logs/"
      schema:
        - "timestamp: ISO 8601"
        - "orchestrator_id: orchestrator identifier"
        - "rule_id: governance rule ID"
        - "violation_type: error|warning|info"
        - "severity: critical|high|medium|low"
        - "status: active|fixed|false_positive"
        - "file_path: affected file"
        - "line_number: violation location"
        - "message: human-readable description"
        - "fix_commit: commit SHA if fixed"
      
      component: static_analysis_integration
      location: "src/intelligence/static_analysis/analyzer.py"
      description: "Static analysis tool orchestration"
      tools:
        - tool: mypy
          purpose: "Type checking"
          command: "mypy src/ --strict --show-error-codes"
          enforcement: blocking
          
        - tool: pylint
          purpose: "Code quality"
          command: "pylint src/ --rcfile=.pylintrc"
          threshold: 8.0
          enforcement: blocking
          
        - tool: pydocstyle
          purpose: "Docstring coverage"
          command: "pydocstyle src/ --convention=google"
          enforcement: blocking
          
        - tool: black
          purpose: "Code formatting"
          command: "black src/ --check --line-length=100"
          enforcement: blocking
          
        - tool: isort
          purpose: "Import sorting"
          command: "isort src/ --check-only --profile=black"
          enforcement: blocking
    
    knowledge_subsystem:
      component: knowledge_integration_service
      location: "src/intelligence/knowledge/knowledge_integration.py"
      description: "3-tier knowledge hierarchy with intelligent merge"
      
      tier_1_cortex_core:
        location: "cortex-brain/knowledge-library/standards/"
        priority: LOW
        contents:
          - "python-style-guide.md (PEP 8, PEP 484, PEP 257)"
          - "solid-principles.md"
          - "design-patterns.md"
          - "testing-strategies.md"
          - "security-guidelines.md"
        
      tier_2_knowledge_library:
        location: "cortex-brain/knowledge-library/"
        priority: MEDIUM
        contents:
          - "orchestrator-design-guidelines.md"
          - "brain-protection-rules.yaml (SKULL)"
          - "planning-system-specifications.md"
          - "response-templates-v4.yaml"
        
      tier_3_company_knowledge:
        location: "cortex-brain/tier2/company-knowledge/"
        priority: HIGH
        contents:
          - "company-best-practices.md"
          - "domain-specific-patterns.md"
          - "internal-coding-standards.md"
          - "custom-governance-rules.yaml"
        
      merge_algorithm:
        step_1: "Load tier 1 (CORTEX core)"
        step_2: "Load tier 2 (knowledge library); tier 2 overrides tier 1"
        step_3: "Load tier 3 (company knowledge); tier 3 overrides tier 1 & 2"
        step_4: "Log merge conflicts for review"
        step_5: "Validate merged knowledge schema"
        performance_target: "<50ms"
        
      component: knowledge_query_engine
      location: "src/intelligence/knowledge/query_engine.py"
      description: "Semantic search across knowledge hierarchy"
      capabilities:
        - "Keyword search"
        - "Semantic search (vector embeddings)"
        - "Context-aware retrieval"
        - "Best practice recommendations"
      performance_target: "<50ms per query"
    
  layer_5_data:
    name: "Data Layer"
    responsibility: "State persistence and data storage"
    
    databases:
      - database: brain_state_db
        type: SQLite
        location: "cortex-brain/database/brain-state.db"
        schema_location: "cortex-brain/schema.sql"
        tables:
          - "orchestrators (id, name, version, status)"
          - "executions (id, orchestrator_id, start_time, end_time, status)"
          - "execution_phases (id, execution_id, phase, status, progress)"
          - "state_snapshots (id, execution_id, snapshot_data, timestamp)"
        performance_target: "<10ms read, <20ms write"
        
      - database: governance_audit_db
        type: SQLite
        location: "cortex-brain/database/governance-audit.db"
        schema_location: "cortex-brain/compliance-tracking-schema.sql"
        tables:
          - "violations (id, rule_id, file_path, severity, status)"
          - "audit_trail (id, timestamp, orchestrator_id, action, result)"
          - "compliance_reports (id, report_date, pass_rate, violations_count)"
        
    file_storage:
      - storage: orchestrator_registry
        location: "cortex-brain/registry/orchestrators.json"
        format: JSON
        schema: "orchestrator_registry_schema.json"
        
      - storage: manifests
        location: "cortex-brain/manifests/orchestrators/"
        format: YAML
        naming: "{orchestrator-id}-manifest.yaml"
        
      - storage: knowledge_library
        location: "cortex-brain/knowledge-library/"
        format: YAML + Markdown
        structure: hierarchical
        
      - storage: audit_logs
        location: "cortex-brain/audit-logs/"
        format: JSONL
        naming: "governance-audit-{date}.jsonl"
        rotation: daily
        retention: 90 days
        
data_flow:
  user_request_flow:
    step_1:
      actor: User
      action: "Submit natural language request to GitHub Copilot Chat"
      output: "User request string"
      
    step_2:
      actor: CORTEX Prompt Router
      action: "Match request against orchestrator patterns"
      output: "Orchestrator ID + confidence score"
      
    step_3:
      actor: LLM Intent Classifier
      condition: "Confidence < 0.7 or pattern mismatch"
      action: "Classify intent using LLM"
      output: "Orchestrator ID + confidence score"
      
    step_4:
      actor: Master Orchestrator
      action: "Validate user mistake prevention rules"
      output: "Validation pass/fail"
      
    step_5:
      actor: Execution Engine
      action: "Load orchestrator manifest + execute phases"
      output: "Phase execution results"
      
    step_6:
      actor: Governance Middleware
      action: "Validate SKULL rule compliance"
      output: "Compliance pass/fail + audit logs"
      
    step_7:
      actor: Orchestrator
      action: "Generate deliverables + report progress"
      output: "Deliverable files + status updates"
      
    step_8:
      actor: State Manager
      action: "Persist execution state to database"
      output: "State snapshot"
      
    step_9:
      actor: GitHub Copilot Chat
      action: "Display results to user"
      output: "Response formatted per response-templates-v4.yaml"
      
  knowledge_integration_flow:
    step_1:
      action: "Orchestrator requests best practice"
      input: "Query string"
      
    step_2:
      action: "Knowledge Query Engine searches tier 1 (CORTEX core)"
      output: "Tier 1 results"
      
    step_3:
      action: "Search tier 2 (knowledge library)"
      output: "Tier 2 results"
      
    step_4:
      action: "Search tier 3 (company knowledge)"
      output: "Tier 3 results"
      
    step_5:
      action: "Merge results (tier 3 > tier 2 > tier 1)"
      output: "Merged knowledge"
      
    step_6:
      action: "Return to orchestrator"
      output: "Best practice recommendation"
      
  governance_enforcement_flow:
    step_1:
      action: "Orchestrator generates/modifies file"
      input: "File path + content"
      
    step_2:
      action: "Governance Middleware validates against SKULL rules"
      output: "Violation list"
      
    step_3:
      action: "Static Analysis Integration runs tools (mypy, pylint, etc.)"
      output: "Tool violation list"
      
    step_4:
      action: "Audit Logger writes violations to governance-audit.jsonl"
      output: "Audit log entry"
      
    step_5:
      condition: "Critical violations found"
      action: "Block phase progression"
      output: "Execution halted"
      
    step_6:
      condition: "No critical violations"
      action: "Allow phase progression"
      output: "Execution continues"
      
security_architecture:
  authentication:
    method: "GitHub authentication via Copilot Chat"
    user_identification: "GitHub username"
    
  authorization:
    model: "Role-based access control (RBAC)"
    roles:
      - role: user
        permissions:
          - "Invoke orchestrators"
          - "View plans"
          - "Read documentation"
          
      - role: admin
        permissions:
          - "All user permissions"
          - "Register/deregister orchestrators"
          - "Modify governance rules"
          - "Access audit logs"
          
  data_protection:
    - "No secrets in code (environment variables only)"
    - "Path validation (prevent path traversal)"
    - "Input sanitization (SQL injection prevention)"
    - "Parameterized queries (no string concatenation)"
    
  audit_trail:
    - "All operations logged to governance-audit.jsonl"
    - "Logs include: timestamp, user, action, result"
    - "90-day retention policy"
    - "Daily log rotation"
    
scalability_architecture:
  horizontal_scaling:
    - "Orchestrators are stateless (state in database)"
    - "Multiple orchestrators can run concurrently"
    - "Database connection pooling"
    
  vertical_scaling:
    - "SQLite sufficient for single-user workloads"
    - "PostgreSQL migration path for multi-user"
    - "Knowledge library caching"
    
  performance_targets:
    - "Pattern matching: <20ms"
    - "Knowledge query: <50ms"
    - "State persistence: <20ms write"
    - "Orchestrator startup: <100ms"
    
deployment_architecture:
  development_environment:
    - "Local VS Code + GitHub Copilot"
    - "Python 3.11+ virtual environment"
    - "SQLite databases"
    - "File-based storage"
    
  ci_cd_pipeline:
    pre_commit:
      - "black --check (formatting)"
      - "isort --check (import sorting)"
      - "mypy --strict (type checking)"
      - "pydocstyle (docstring coverage)"
      
    pre_push:
      - "pytest (unit tests)"
      - "pylint (code quality ≥8.0)"
      - "coverage (≥80%)"
      
    pr_checks:
      - "All pre-commit + pre-push hooks"
      - "SKULL rule validation"
      - "Audit log review"
      - "Integration tests"
      
  production_deployment:
    - "Packaged as Python module"
    - "Distributed via pip/conda"
    - "Configuration via environment variables"
    - "Database migration scripts included"
    
technology_stack:
  languages:
    - Python: "3.11+"
    - YAML: "Configuration and manifests"
    - JSON: "Data interchange and registry"
    - Markdown: "Documentation"
    - SQL: "Database schemas"
    
  frameworks_libraries:
    - pytest: "Testing framework"
    - mypy: "Static type checking"
    - pylint: "Code quality analysis"
    - pydocstyle: "Docstring validation"
    - black: "Code formatting"
    - isort: "Import sorting"
    - SQLite: "State management"
    - PyYAML: "YAML parsing"
    
  tools:
    - GitHub Copilot: "LLM interface"
    - VS Code: "Development environment"
    - Git: "Version control"
    - Sphinx: "Documentation generation (planned)"
    
  external_services:
    - GitHub: "Code hosting and authentication"
    - OpenAI API: "LLM intent classification (future)"
    
design_patterns:
  - pattern: Master-Child Orchestrator
    description: "Single master routes to specialized children"
    benefits: "Separation of concerns, extensibility"
    
  - pattern: Plugin Architecture
    description: "Dynamic orchestrator loading via registry"
    benefits: "Extensibility without code changes"
    
  - pattern: Strategy Pattern
    description: "Execution modes (autonomous, guided, interactive)"
    benefits: "Flexibility in execution style"
    
  - pattern: Repository Pattern
    description: "Abstract state persistence (SQLite ↔ PostgreSQL swappable)"
    benefits: "Database independence"
    
  - pattern: Chain of Responsibility
    description: "Middleware pipeline (governance → knowledge → audit → static analysis)"
    benefits: "Modular validation"
    
  - pattern: Command Pattern
    description: "Orchestrator requests as commands"
    benefits: "Undo/redo capability, history tracking"
    
  - pattern: Observer Pattern
    description: "Progress tracking with event listeners"
    benefits: "Real-time UI updates"
    
quality_attributes:
  performance:
    - "Pattern matching: <20ms"
    - "Knowledge query: <50ms"
    - "Orchestrator startup: <100ms"
    - "State persistence: <20ms"
    
  reliability:
    - "State recovery after interruption"
    - "Rollback capability on failure"
    - "Backup retention for destructive operations"
    - "Zero data loss guarantee"
    
  maintainability:
    - "YAML-first design (configuration external to code)"
    - "Comprehensive documentation (docstrings + README)"
    - "Type hints (100% coverage for public APIs)"
    - "Test coverage (≥80%)"
    
  extensibility:
    - "Plugin architecture (add orchestrators without core changes)"
    - "Dynamic orchestrator loading"
    - "Lifecycle management (create, enhance, deprecate, delete)"
    
  usability:
    - "Natural language interface (GitHub Copilot)"
    - "Clear progress reporting (response templates)"
    - "Comprehensive error messages"
    - "Auto-generated documentation (Sphinx)"
    
  security:
    - "No secrets in code"
    - "Path validation"
    - "Input sanitization"
    - "Audit logging"
    
migration_strategy:
  planning_system_v5_to_v6:
    tool: "Plan Migration Orchestrator"
    transformation: "Physical phase folders → Logical feature.yaml"
    complexity_reduction: "70% (260 → 78 folders)"
    data_loss: "Zero (all deleted folders empty)"
    backup: "Retained in cortex-brain/archives/"
    
  sqlite_to_postgresql:
    trigger: "Multi-user workload"
    migration_path: "Repository pattern enables swappable backends"
    effort_estimate: "2 days (schema + connection pooling)"
    
  future_enhancements:
    - "Web UI for plan visualization"
    - "REST API for orchestrator invocation"
    - "Multi-tenant support"
    - "Cloud deployment (AWS/Azure/GCP)"
    
architectural_decisions:
  adr_001_master_child_orchestrator:
    date: '2026-01-07'
    decision: "Single master orchestrator routes to specialized children"
    rationale: "Separation of concerns; prevents pattern collisions; enables lifecycle management"
    consequences: "Master orchestrator is single point of failure (mitigated by state recovery)"
    
  adr_002_yaml_first_design:
    date: '2026-01-07'
    decision: "All orchestrators defined in YAML manifests before implementation"
    rationale: "Machine-readable; enables validation; supports dynamic loading"
    consequences: "Manifest-code synchronization required (mitigated by validation)"
    
  adr_003_three_tier_knowledge:
    date: '2026-01-07'
    decision: "3-tier knowledge hierarchy (CORTEX → library → company)"
    rationale: "Company knowledge overrides defaults; domain-specific optimization"
    consequences: "Merge conflicts possible (mitigated by logging + review)"
    
  adr_004_skull_governance:
    date: '2026-01-07'
    decision: "SKULL rules enforced via middleware pipeline"
    rationale: "Automated governance prevents brittleness"
    consequences: "May block legitimate edge cases (mitigated by override mechanism)"
    
  adr_005_sqlite_state_management:
    date: '2026-01-07'
    decision: "SQLite for state persistence (single-user workloads)"
    rationale: "Zero-configuration; file-based; sufficient for dev environment"
    consequences: "PostgreSQL migration needed for multi-user (planned)"
    
conclusion:
  summary: "CORTEX follows a 5-layer architecture with master-child orchestrator pattern. Layer 1 (Presentation) handles user interaction via GitHub Copilot. Layer 2 (Orchestration) routes requests and manages execution. Layer 3 (Specialized Orchestrators) implements domain workflows. Layer 4 (Intelligence) enforces governance and integrates knowledge. Layer 5 (Data) persists state and stores configuration. Key design patterns: Plugin Architecture, Strategy Pattern, Repository Pattern, Chain of Responsibility. Quality attributes: Performance (<20ms routing), Reliability (state recovery), Maintainability (YAML-first), Extensibility (plugin system), Security (audit logging)."
  
  critical_components:
    - "Master Orchestrator (entry point)"
    - "Pattern Router (intent classification)"
    - "Governance Middleware (SKULL enforcement)"
    - "Knowledge Integration Service (3-tier merge)"
    - "State Manager (execution persistence)"
    
  next_steps:
    - "Implement MD-to-YAML + Git-to-YAML orchestrators"
    - "Complete master orchestrator intelligence layer"
    - "Integrate governance middleware with CI/CD"
    - "Generate Sphinx documentation"
