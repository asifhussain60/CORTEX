**Status:** approved

metadata:
  plan_id: PLAN-2025-12-06-AUTO-DOC-GEN
  title: "Phase 2: Auto-Documentation Generation for Learning Library"
  created_date: "2025-12-06T00:00:00Z"
  created_by: "Asif Hussain"
  status: "proposed"
  priority: "high"
  estimated_hours: 40
  complexity: "medium"
  tags:
    - "documentation"
    - "learning-library"
    - "automation"
    - "docsify"
    - "phase-2"

vision:
  problem: |
    Currently, documentation reminders are shown but CORTEX must manually create markdown files.
    This creates friction and may result in incomplete knowledge capture.
  
  solution: |
    Automatically generate structured markdown documentation files when workflows complete.
    Extract context from plans, git history, and execution data to populate content.
    Use templates for consistent structure across all documentation categories.
  
  value: |
    - Zero-effort documentation (automatic generation)
    - Guaranteed consistency (template-based)
    - Complete knowledge capture (nothing gets missed)
    - Time savings (~10 minutes per completion)
    - Improved searchability (structured data)

phases:
  - phase_number: 1
    phase_name: "Template System & Context Extraction"
    estimated_hours: 12
    description: "Create documentation templates and context extraction utilities"
    tasks:
      - task_id: "1.1"
        task_name: "Design documentation templates for all categories"
        description: |
          Create markdown templates for:
          - planning_strategies (plan approval)
          - milestones (plan completion)
          - ado_workflows (ADO completion)
          - Other 12 learning categories (future expansion)
          
          Each template includes:
          - Metadata section (date, duration, complexity)
          - Challenge section
          - Approach section
          - Outcome section (files, tests, metrics)
          - Key Learnings section (AI-assisted)
        estimated_hours: 4
        dependencies: []
        acceptance_criteria:
          - "Templates created for 3 primary categories"
          - "Templates follow consistent markdown structure"
          - "Placeholder variables identified for dynamic content"
          - "Template validation function created"
      
      - task_id: "1.2"
        task_name: "Build context extraction utilities"
        description: |
          Create utilities to extract:
          - Plan data (phases, tasks, estimates, status)
          - Git history (commits since plan start, files changed)
          - Execution metrics (hours spent, completion time)
          - Test results (coverage, pass/fail counts)
          - ADO work item data (title, description, acceptance criteria)
        estimated_hours: 5
        dependencies: []
        acceptance_criteria:
          - "PlanContextExtractor class extracts all plan fields"
          - "GitHistoryExtractor pulls commits with date range filter"
          - "MetricsExtractor calculates duration and complexity"
          - "All extractors handle missing data gracefully"
      
      - task_id: "1.3"
        task_name: "Create template rendering engine"
        description: |
          Build engine that:
          - Loads template from .github/prompts/templates/learning/
          - Injects context variables
          - Handles conditional sections
          - Generates proper markdown formatting
          - Validates output structure
        estimated_hours: 3
        dependencies: ["1.1", "1.2"]
        acceptance_criteria:
          - "TemplateRenderer class loads and renders templates"
          - "Variable substitution works correctly"
          - "Conditional sections evaluated properly"
          - "Output validated against markdown linting"
  
  - phase_number: 2
    phase_name: "Integration with Completion Workflows"
    estimated_hours: 10
    description: "Replace reminders with automatic generation in PlanningOrchestrator and ADO utility"
    tasks:
      - task_id: "2.1"
        task_name: "Integrate with PlanningOrchestrator.approve_plan()"
        description: |
          Modify approve_plan() to:
          1. Extract plan context
          2. Load planning_strategies template
          3. Render documentation
          4. Save to cortex-brain/documents/learning/planning_strategies/
          5. Return file path in result dict
          6. Log success message
        estimated_hours: 3
        dependencies: ["1.3"]
        acceptance_criteria:
          - "Approval generates planning_strategies documentation"
          - "File named: plan_approved_{plan_id}_{timestamp}.md"
          - "Content includes requirements, scope, approach, decisions"
          - "File path returned in result['documentation_path']"
      
      - task_id: "2.2"
        task_name: "Integrate with PlanningOrchestrator.complete_plan()"
        description: |
          Modify complete_plan() to:
          1. Extract plan context + git history
          2. Load milestones template
          3. Render documentation with metrics
          4. Save to cortex-brain/documents/learning/milestones/
          5. Emit learning event (MILESTONE_DOCUMENTED)
        estimated_hours: 4
        dependencies: ["1.3"]
        acceptance_criteria:
          - "Completion generates milestones documentation"
          - "File named: plan_completed_{plan_id}_{timestamp}.md"
          - "Content includes challenge, approach, outcome, learnings"
          - "Git commits and file changes included"
          - "Learning event emitted successfully"
      
      - task_id: "2.3"
        task_name: "Integrate with ADO utility update_work_item()"
        description: |
          Modify update_work_item() to:
          1. Detect status change to COMPLETED
          2. Extract work item context
          3. Load ado_workflows template
          4. Render documentation
          5. Save to cortex-brain/documents/learning/ado_workflows/
        estimated_hours: 3
        dependencies: ["1.3"]
        acceptance_criteria:
          - "ADO completion generates ado_workflows documentation"
          - "File named: ado_{work_item_id}_{timestamp}.md"
          - "Content includes implementation details, decisions, outcomes"
          - "Replaces current reminder with generation"
  
  - phase_number: 3
    phase_name: "AI-Assisted Content Generation (Optional Enhancement)"
    estimated_hours: 8
    description: "Use AI to generate key learnings and insights from context"
    tasks:
      - task_id: "3.1"
        task_name: "Create LearningInsightsGenerator"
        description: |
          Build utility that:
          - Analyzes git commit messages for patterns
          - Identifies challenges from problem description
          - Extracts decisions from approach/phases
          - Generates key learnings bullet points
          - Uses Tier 2 Knowledge Graph for pattern matching
        estimated_hours: 4
        dependencies: ["1.2"]
        acceptance_criteria:
          - "Generator analyzes commits and extracts insights"
          - "Pattern matching identifies similar past work"
          - "Key learnings formatted as bullet points"
          - "Quality threshold ensures useful output"
      
      - task_id: "3.2"
        task_name: "Integrate AI insights into templates"
        description: |
          Modify templates to include:
          - "Key Learnings" section with AI-generated insights
          - "Related Work" section with pattern matches
          - "Recommendations" section with suggestions
        estimated_hours: 2
        dependencies: ["3.1"]
        acceptance_criteria:
          - "Templates include AI-assisted sections"
          - "Insights contextually relevant"
          - "Quality check prevents generic content"
      
      - task_id: "3.3"
        task_name: "Add feedback loop for learning quality"
        description: |
          Create mechanism to:
          - Track which generated docs are viewed in dashboard
          - Collect implicit feedback (view duration, searches)
          - Store quality scores in Tier 2
          - Improve generation over time
        estimated_hours: 2
        dependencies: ["3.2"]
        acceptance_criteria:
          - "View tracking integrated with dashboard"
          - "Quality scores stored in Tier 2"
          - "Generation algorithm adapts based on feedback"
  
  - phase_number: 4
    phase_name: "Testing, Documentation, and Dashboard Integration"
    estimated_hours: 10
    description: "Comprehensive testing and user-facing documentation"
    tasks:
      - task_id: "4.1"
        task_name: "Create comprehensive test suite"
        description: |
          Tests for:
          - Template loading and rendering
          - Context extraction (plan, git, metrics)
          - File generation (naming, location, content)
          - Integration with orchestrators
          - Error handling (missing data, invalid templates)
        estimated_hours: 4
        dependencies: ["2.1", "2.2", "2.3"]
        acceptance_criteria:
          - "20+ tests covering all components"
          - "All tests passing"
          - "Coverage >90% for new code"
          - "Edge cases handled"
      
      - task_id: "4.2"
        task_name: "Create user documentation"
        description: |
          Document:
          - How auto-documentation works
          - Template structure and customization
          - Generated file locations and naming
          - Dashboard access and search
          - Troubleshooting common issues
        estimated_hours: 3
        dependencies: ["4.1"]
        acceptance_criteria:
          - "Documentation in cortex-brain/documents/implementation-guides/"
          - "Includes examples and screenshots"
          - "Troubleshooting section comprehensive"
          - "Cross-machine compatibility explained"
      
      - task_id: "4.3"
        task_name: "Enhance dashboard for auto-generated docs"
        description: |
          Add dashboard features:
          - Badge/icon for auto-generated docs
          - Metadata display (generation time, source)
          - Quick preview without opening file
          - "Related Documents" based on plan/work item IDs
        estimated_hours: 3
        dependencies: ["4.2"]
        acceptance_criteria:
          - "Dashboard displays auto-generated badge"
          - "Metadata visible in preview"
          - "Related docs linked correctly"
          - "UI responsive and accessible"

