risks:
  - risk: Template rendering fails silently
    mitigation: Add debug logging and fallback to basic output
    impact: medium
  - risk: Progress percentages incorrect
    mitigation: Unit test progress calculation logic
    impact: low

success_criteria:
  - All 4 phases execute without errors
  - Progress templates visible in chat output
  - Progress bar advances correctly (25% → 50% → 75% → 100%)
  - Git checkpoint templates display after each phase
  - Completion template shows all metrics accurately

test_validation:
  - Visual inspection of chat output
  - Verification of progress bar rendering
  - Confirmation of phase status updates
  - Git history shows checkpoint commits
