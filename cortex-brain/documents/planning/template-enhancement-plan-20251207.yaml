# CORTEX Planning System 2.0 - Feature Plan
# Plan ID: template-enhancement-20251207
# Status: APPROVED
# Created: 2025-12-07
# Author: Asif Hussain

plan_metadata:
  plan_id: "template-enhancement-20251207"
  feature_name: "Professional Introduction Templates & Business Value Templates"
  status: "APPROVED"
  created_date: "2025-12-07"
  approved_date: "2025-12-07"
  author: "Asif Hussain"
  planning_version: "2.0"
  execution_mode: "available"  # Can be executed autonomously or phase-by-phase

feature_overview:
  description: |
    A comprehensive template enhancement system with two major components:
    1. Professional Introduction Templates - Audience-specific CORTEX introductions (leadership, product owners, engineers, general)
    2. Business Value Templates - Organized capability presentations and security posture documentation
  
  problem_statement: |
    The current 5-part format excels at operational transparency but fails at:
    - Professional stakeholder presentations
    - Business value articulation
    - Security posture documentation
    - Organized capability demonstrations
  
  success_criteria:
    - Users can present CORTEX professionally to any audience
    - Audience-appropriate messaging with clear value propositions
    - Progressive disclosure (high-level → deep dive)
    - Security confidence for business and technical stakeholders

definition_of_ready:
  status: "COMPLETE"
  completed_date: "2025-12-07"
  
  requirements_clarity:
    user_stories:
      - id: "US-1"
        role: "CORTEX user presenting to leadership"
        need: "introduction that emphasizes ROI, development velocity, and quality metrics"
        benefit: "they understand business value"
      
      - id: "US-2"
        role: "product owner evaluating CORTEX"
        need: "organized capabilities by functional area"
        benefit: "I can assess fit for my team's needs"
      
      - id: "US-3"
        role: "security engineer"
        need: "unified security documentation covering both CORTEX's security posture and how it builds secure applications"
        benefit: "I can validate security compliance"
      
      - id: "US-4"
        role: "engineer evaluating CORTEX"
        need: "technical depth on architecture, TDD automation, and governance rules"
        benefit: "I understand implementation quality"
    
    acceptance_criteria:
      - "All 4 introduction templates follow 5-section structure (What/Why/Tech/How/Explore)"
      - "Audience detection works for explicit ('to leadership') and implicit contexts"
      - "Business value template organizes capabilities by functional area"
      - "Security template provides unified narrative (CORTEX + app security)"
      - "All templates use direct address format (NO 5-part operational format)"
      - "Progressive disclosure: High-level → invitation to dive deeper"
      - "Governance/SKULL rules elegantly presented in 'Why built?' section"
      - "Token reduction metric (97.2%) included in leadership variant only"
      - "4-5 exploration questions per introduction template"
      - "Professional tone (NO enthusiasm markers, evidence-based claims)"
    
    edge_cases:
      ambiguous_audience: "Default to introduction_professional"
      multiple_audiences: "Default to most senior audience (leadership)"
      no_audience: "Default to introduction_professional"
      casual_greeting: "Keep existing greeting template, don't trigger introduction"
  
  technical_specifications:
    templates:
      introduction_professional:
        sections: ["What is CORTEX?", "Why Was It Built?", "Tech Stack & Architecture", "How CORTEX Can Help", "Explore Further"]
        length: "15-20 lines"
        audience: "general/default"
        format: "narrative"
      
      introduction_leadership:
        sections: ["What is CORTEX?", "Why Was It Built?", "Tech Stack & Architecture", "How CORTEX Can Help", "Explore Further"]
        length: "18-22 lines"
        audience: "leadership"
        emphasis: "ROI, velocity, quality metrics, 97.2% token reduction"
        format: "narrative"
      
      introduction_product:
        sections: ["What is CORTEX?", "Why Was It Built?", "Tech Stack & Architecture", "How CORTEX Can Help", "Explore Further"]
        length: "15-20 lines"
        audience: "product owners"
        emphasis: "feature delivery, planning accuracy, DoR/DoD"
        format: "narrative"
      
      introduction_engineering:
        sections: ["What is CORTEX?", "Why Was It Built?", "Tech Stack & Architecture", "How CORTEX Can Help", "Explore Further"]
        length: "20-25 lines"
        audience: "engineers"
        emphasis: "architecture, TDD automation, governance rules"
        format: "narrative"
      
      business_value:
        organization: "capability_based"
        categories:
          - "Planning & Requirements (Planning System 2.0, Vision API, ADO)"
          - "Development Automation (TDD Mastery, auto-debug, refactoring)"
          - "Quality Assurance (Convention validation, test isolation)"
          - "Operations & Maintenance (Upgrade system, dashboard, feedback)"
        format: "organized_showcase"
      
      security_posture:
        structure: "unified_narrative"
        coverage:
          - "CORTEX's own security (git isolation, privacy protection, code boundaries)"
          - "Application security (TDD enforcement, threat modeling, OWASP)"
        format: "integrated_approach"
    
    routing_logic:
      priority_level: "priority_1_exact_match"
      audience_detection:
        explicit: ["to leadership", "to product", "to engineers", "for {audience}"]
        implicit_keywords:
          leadership: ["ROI", "cost", "velocity", "metrics", "business value"]
          product: ["features", "delivery", "sprint", "backlog", "roadmap"]
          engineering: ["architecture", "code", "implementation", "technical"]
        default: "introduction_professional"
      
      conflict_resolution:
        - "introduce yourself" overrides "hi/hello" greeting
        - Priority 1 templates fire before Priority 2/3/4
    
    content_requirements:
      token_reduction_metric: "Leadership variant only (97.2%)"
      governance_mention: "2-3 sentences in 'Why built?' - frame as quality assurance"
      brain_mimicry_depth: "1-2 sentences, light neuroscience analogy"
      evidence_requirement: "All claims backed by metrics, test results, or implementation facts"
      exploration_questions: "4-5 actionable prompts users can copy/paste"
  
  dependencies_constraints:
    template_count:
      current: 18
      adding: 6
      new_total: 24
      increase_percentage: "+33%"
      approval_status: "APPROVED"
    
    routing_priority:
      new_templates: "Priority 1 (exact match)"
      rationale: "Introduction/business/security are high-intent, specific queries"
      conflict_resolution: "'introduce yourself' overrides 'hi/hello' greeting"
    
    format_exception:
      rule: "Introduction/business/security templates BYPASS 5-part format"
      format: "Direct narrative format (audience-facing presentation)"
      documentation: "Must document in CORTEX.prompt.md"
    
    security_content_sources:
      - "cortex-brain/brain-protection-rules.yaml (Git isolation, test separation)"
      - "Feedback system implementation (Privacy protection, PII stripping)"
      - "TDD Mastery (Security through test coverage)"
      - "Planning orchestrator (Threat modeling integration)"
    
    efficiency_design:
      - "Template consolidation: Single base structure with dynamic sections"
      - "Shared components: Common sections referenced, not duplicated"
      - "Routing optimization: Audience detection in single pass"
      - "Content reuse: Exploration questions shared across variants"
  
  tdd_requirements:
    test_strategy:
      template_selection_tests:
        - "Test trigger matching ('introduce yourself' → routes correctly)"
        - "Test audience detection (explicit: 'to leadership' → introduction_leadership)"
        - "Test audience detection (implicit: keywords → correct variant)"
        - "Test default fallback (ambiguous → introduction_professional)"
        - "Test override behavior ('introduce yourself' vs 'hi cortex')"
      
      format_validation_tests:
        - "Verify 5-section structure in introduction templates"
        - "Verify direct address format (NO 5-part operational format)"
        - "Verify professional tone (NO enthusiasm markers)"
        - "Verify evidence-based claims (metrics present)"
      
      content_completeness_tests:
        - "Verify governance/SKULL mention in 'Why built?'"
        - "Verify 4-5 exploration questions present"
        - "Verify audience-appropriate emphasis (leadership = ROI, engineering = architecture)"
        - "Verify token reduction metric only in leadership variant"
      
      integration_tests:
        - "Test routing rules file syntax validity"
        - "Test template rendering with variable substitution"
        - "Test conflict resolution (introduction vs greeting)"
        - "Test priority ordering (Priority 1 templates fire first)"
    
    test_files:
      - "tests/test_introduction_templates.py (template selection, audience detection)"
      - "tests/test_template_format_validation.py (format compliance)"
      - "tests/test_business_security_templates.py (business value, security templates)"
      - "tests/test_routing_priority.py (priority ordering, conflict resolution)"

