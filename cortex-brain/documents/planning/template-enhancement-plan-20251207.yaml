implementation_plan:
  total_phases: 7
  estimated_time: "5-7 hours"
  
  phase_0:
    name: "Template Visual Audit & Fix"
    duration: "15 min"
    tasks:
      - "Audit all templates for hardcoded progress bars with filled squares"
      - "Fix any visual elements that imply completion when status is pending"
      - "Ensure checkbox formatting uses ☐ (empty) not ☑ (checked) for pending items"
      - "Validate planning/ADO templates show correct pending state visuals"
      - "Document visual standards for future template creation"
    files:
      - "cortex-brain/response-templates.yaml (visual audit)"
    validation:
      - "No hardcoded filled progress bars for 0% states"
      - "Checkboxes correctly show pending state"
      - "Visual elements accurately represent status"
    rationale: "User reported progress bars giving false impression of completion"
    status: "PENDING"
  
  phase_1:
    name: "Template Creation"
    duration: "1-2 hours"
    tasks:
      - "Create 4 introduction templates with 5-section structure"
      - "Create business_value template with capability organization"
      - "Create security_posture template with unified narrative"
      - "Add shared components for efficiency (common sections)"
    files:
      - "cortex-brain/response-templates.yaml (~300 lines added)"
    validation:
      - "YAML syntax valid"
      - "All sections present"
      - "Professional tone verified"
    status: "PENDING"
  
  phase_2:
    name: "Routing Implementation"
    duration: "30 min"
    tasks:
      - "Add 6 new routes to Priority 1 in routing rules"
      - "Implement audience detection logic (explicit + implicit)"
      - "Configure conflict resolution (introduction vs greeting)"
      - "Update priority ordering"
    files:
      - "cortex-brain/response-routing-rules.yaml (~50 lines added)"
    validation:
      - "Routing logic correct"
      - "Audience detection works"
      - "Priority ordering preserved"
    status: "PENDING"
  
  phase_3:
    name: "Documentation Updates"
    duration: "20 min"
    tasks:
      - "Update CORTEX.prompt.md with format exception"
      - "Add new commands to Quick Command Reference"
      - "Document audience detection examples"
      - "Add template extensibility notes"
    files:
      - ".github/prompts/CORTEX.prompt.md (~30 lines added)"
    validation:
      - "Documentation accurate"
      - "Examples clear"
      - "Extensibility documented"
    status: "PENDING"
  
  phase_4:
    name: "Testing"
    duration: "45 min"
    tasks:
      - "Write template selection tests (trigger + audience detection)"
      - "Write format validation tests (structure + tone)"
      - "Write integration tests (routing + rendering)"
      - "Manual validation in Copilot Chat"
    files:
      - "tests/test_introduction_templates.py (new, ~150 lines)"
      - "tests/test_template_format_validation.py (new, ~100 lines)"
      - "tests/test_business_security_templates.py (new, ~80 lines)"
    validation:
      - "All tests pass"
      - "Manual validation successful"
      - "Edge cases covered"
    status: "PENDING"
  
  phase_5:
    name: "Quality & Deployment"
    duration: "30 min"
    tasks:
      - "Run SKULL compliance checks"
      - "Verify token efficiency"
      - "Update VERSION and CHANGELOG"
      - "Run align to verify system integrity"
      - "Commit and deploy"
    files:
      - "VERSION (3.8.1 → 3.8.2)"
      - "CHANGELOG.md (new entry)"
    validation:
      - "SKULL compliance verified"
      - "Alignment successful"
      - "Templates accessible"
    status: "PENDING"
  
  phase_6:
    name: "Response Template Format Standardization"
    duration: "2-3 hours"
    tasks:
      - "Audit all 68 templates (62 existing + 6 new) for format inconsistencies"
      - "Define standard format hierarchy (H1 for title, H2 for major sections, H3 for subsections)"
      - "Standardize header font sizes across all templates"
      - "Ensure consistent emoji usage in headers"
      - "Optimize header vs content ratio (match planning template style)"
      - "Update operational templates (5-part format) to use consistent header levels"
      - "Update narrative templates (introduction, business, security) for consistency"
      - "Validate token efficiency after standardization"
    files:
      - "cortex-brain/response-templates.yaml (68 templates updated)"
      - "cortex-brain/documents/planning/template-format-standard.md (new format guide)"
    validation:
      - "All 68 templates follow standard hierarchy"
      - "Header levels consistent (H1 title, H2 sections, H3 subsections)"
      - "Emoji usage standardized"
      - "Content ratio matches planning template style"
      - "No token bloat introduced"
      - "YAML syntax remains valid"
    acceptance_criteria:
      - "H1 (#) reserved for template title only"
      - "H2 (##) for major section headers (Understanding, Approach, Response, etc.)"
      - "H3 (###) for subsections within major sections"
      - "Consistent emoji placement (section headers only, not inline)"
      - "Content-to-header ratio optimized (more content, less header noise)"
      - "Planning template style replicated across all templates"
    dependencies:
      - "Phases 0-5 must complete first (visual audit + new templates created and deployed)"
      - "Format guide created before bulk updates"
      - "Version bump to 3.8.3 after completion"
    status: "PENDING"

success_metrics:
  quantitative:
    template_count: "18 → 24 (Phase 5) → 68 standardized (Phase 6)"
    test_coverage: "100% for new templates"
    token_efficiency: "Each template < 500 tokens"
    routing_accuracy: "100% trigger match rate"
    format_consistency: "100% templates follow standard hierarchy"
  
  qualitative:
    - "Professional tone maintained (NO enthusiasm)"
    - "Evidence-based claims (all metrics verified)"
    - "Progressive disclosure (high-level → deep dive)"
    - "Extensible design (new audiences easy to add)"
    - "Consistent visual hierarchy across all templates"
    - "Planning template format replicated system-wide"

execution_options:
  autonomous:
    available: true
    description: "Execute all 5 phases without user intervention"
    command: "execute all phases autonomously"
  
  phase_by_phase:
    available: true
    description: "Execute one phase at a time with approval"
    command: "execute phase 1" (then phase 2, 3, 4, 5)
  
  manual:
    available: true
    description: "User implements based on plan"
    guidance: "Follow implementation_plan phases sequentially"

plan_file_location: "cortex-brain/documents/planning/template-enhancement-plan-20251207.yaml"
resumption_instructions: |
  To resume this plan in a new chat session:
  1. Open new Copilot Chat
  2. Reference this plan file
  3. Say "Continue with template enhancement plan"
  4. CORTEX will load plan state and resume execution
