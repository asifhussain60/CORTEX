metadata:
  plan_id: "exec-summary-enhance-001"
  title: "Executive Summary Intelligence Enhancement"
  created: "2025-12-07T00:00:00Z"
  status: "active"
  priority: "high"
  estimated_effort: "40-50 hours"
  owner: "CORTEX Development Team"
  tags: ["dashboard", "narrative-generation", "ast-analysis", "intelligence", "v3.9"]

summary:
  problem: |
    Current executive summaries for repository analysis are generic and template-based.
    For luum-fresh (240K LOC C# SOAP service), the narrative says "enterprise legacy service"
    with basic file count bullet points. No business domain inference, no docstring mining,
    no commit pattern analysis, and no understanding of what the application actually does.
    
  goal: |
    Transform executive summaries from template-based to intelligence-based by:
    1. Mining code structure (AST) for docstrings, class names, and API patterns
    2. Analyzing git commit messages for feature evolution narratives
    3. Inferring business domains from controller/service/entity names
    4. Deep-parsing README files for purpose statements and feature lists
    5. Generating project-specific narratives that answer "What does this do?" clearly

  success_criteria:
    - Executive summary reads like human-written analysis, not template output
    - Business domain clearly identified (e.g., "Employee benefits management platform")
    - 5-8 specific business capabilities listed from code structure analysis
    - Narrative includes feature evolution insights from commit history
    - Works across Python, C#, TypeScript, and JavaScript repositories
    - Processing time <30 seconds for 240K LOC codebases

definition_of_ready:
  - TDD Mastery workflow MUST be followed (RED→GREEN→REFACTOR)
  - Tests MUST fail before implementation (RED phase validation)
  - All CORTEX brain protection rules apply (SKULL enforcement)
  - Reference cortex-brain/brain-protection-rules.yaml for complete ruleset
  - Current executive_summary_aggregator.py reviewed and understood
  - AST parsing tools (ast.parse, ast.get_docstring) verified available in Python 3.8+
  - Sample repositories identified for testing (luum-fresh, mock, tcbulk)
  - Baseline performance metrics captured (current generation time, narrative quality score)
  - Success metrics defined (narrative richness score, domain inference accuracy)

definition_of_done:
  - All code follows TDD workflow with git checkpoints at phase boundaries
  - No SKULL rule violations detected (brain protection compliance verified)
  - Test coverage meets CORTEX standards (RED→GREEN→REFACTOR documented)
  - Git history shows test-first commits (RED phase before GREEN phase)
  - Executive summaries for 3 test repos show 80%+ improvement in specificity
  - All 5 intelligence sources successfully integrated (AST, git, README, naming, patterns)
  - Performance <30s for 240K LOC repositories
  - Documentation updated with architecture decision records
  - Dashboard displays enhanced summaries with no visual regressions

phases:
  - phase: 1
    name: "AST-Based Code Intelligence"
    description: "Extract business insights from code structure using Abstract Syntax Trees"
    estimated_duration: "12-16 hours"
    dependencies: []
    
    tasks:
      - id: "1.1"
        title: "Create AST Docstring Extractor"
        description: |
          Build module to extract docstrings from top-level classes and functions.
          - Scan top 20 controller/service files by LOC
          - Extract class and function docstrings using ast.get_docstring()
          - Parse first paragraph of each docstring
          - Return structured data: {file, class, docstring_summary, line_count}
        acceptance_criteria:
          - Extracts docstrings from Python (.py) files accurately
          - Handles syntax errors gracefully (skip file, log warning)
          - Returns top 10 most informative docstrings ranked by length/detail
          - Unit tests with sample Python files containing various docstring formats
        estimated_hours: 4
        
      - id: "1.2"
        title: "Multi-Language Docstring Support"
        description: |
          Extend docstring extraction to C#, TypeScript, and JavaScript.
          - C#: XML documentation comments (///)
          - TypeScript/JavaScript: JSDoc comments (/**)
          - Use regex parsing for non-Python languages
          - Normalize output format across all languages
        acceptance_criteria:
          - Extracts C# XML doc comments from classes and methods
          - Extracts JSDoc comments from TypeScript/JavaScript
          - Consistent output schema across all 4 languages
          - Test coverage with multi-language sample files
        estimated_hours: 6
        
      - id: "1.3"
        title: "Business Domain Inference Engine"
        description: |
          Analyze class/service/controller names to infer business domains.
          - Pattern matching: {Domain}Controller, {Domain}Service, I{Domain}Repository
          - Extract domain nouns: Parking, Engagement, Commute, Reward, Payroll
          - Build domain frequency map
          - Generate capability list: "Manages {domain1}, {domain2}, {domain3} operations"
        acceptance_criteria:
          - Identifies 5-10 business domains from luum-fresh (240K LOC)
          - Generates human-readable capability list
          - Handles edge cases (generic names like "Base", "Helper", "Utility")
          - 85%+ accuracy on hand-labeled test set of 50 classes
        estimated_hours: 6

  - phase: 2
    name: "Git Intelligence & Commit Analysis"
    description: "Extract feature evolution narratives from git commit history"
    estimated_duration: "8-10 hours"
    dependencies: ["1"]
    
    tasks:
      - id: "2.1"
        title: "Commit Pattern Analyzer"
        description: |
          Analyze commit messages to identify feature themes and trends.
          - Extract verbs and nouns from commit messages (NLP-lite)
          - Group commits by theme (feature, bugfix, refactor, docs)
          - Identify active development areas from recent commits
          - Generate evolution narrative: "Recent work focuses on X, Y, Z"
        acceptance_criteria:
          - Processes 100 commits in <2 seconds
          - Identifies 3-5 development themes from commit history
          - Generates 2-3 sentence evolution narrative
          - Test with luum-fresh git history (Swedish T&C, Engagement charts, etc.)
        estimated_hours: 5
        
      - id: "2.2"
        title: "Contributor & Activity Analysis"
        description: |
          Extract team dynamics and activity patterns from git data.
          - Identify top 3-5 active contributors
          - Calculate commit frequency trends (increasing, stable, declining)
          - Detect recent activity spikes (deployments, sprints)
          - Surface in "Team & Activity" section of summary
        acceptance_criteria:
          - Correctly identifies top contributors with email/name
          - Calculates activity trend over last 90 days
          - Detects activity spikes (>2x average commits in 7-day window)
          - Integrates into executive summary JSON structure
        estimated_hours: 5

  - phase: 3
    name: "README Deep Parsing & Synthesis"
    description: "Extract structured information from README and documentation files"
    estimated_duration: "6-8 hours"
    dependencies: ["1"]
    
    tasks:
      - id: "3.1"
        title: "README Section Extractor"
        description: |
          Parse README.md to extract all meaningful sections.
          - Identify H2/H3 sections: "Features", "Overview", "Purpose", "What is"
          - Extract content under each heading
          - Prioritize sections by informativeness (Features > Installation)
          - Fall back to first 3 paragraphs if no structured headings
        acceptance_criteria:
          - Extracts all H2/H3 sections from markdown
          - Returns prioritized list of sections with content
          - Handles malformed markdown gracefully
          - Test with 10 diverse README files (short, long, unstructured)
        estimated_hours: 4
        
      - id: "3.2"
        title: "Documentation Synthesizer"
        description: |
          Combine README, docstrings, and architecture data into coherent summary.
          - Merge README "Overview" with top docstrings
          - Prioritize README content if detailed (>200 chars)
          - Use docstrings as fallback if README is minimal
          - Generate 150-300 word summary synthesizing all sources
        acceptance_criteria:
          - Produces coherent 150-300 word summaries
          - Avoids redundancy (deduplicate similar phrases)
          - Maintains factual accuracy (no hallucination)
          - Human evaluation: 8/10 quality score from 3 reviewers
        estimated_hours: 4

  - phase: 4
    name: "Integration & Performance Optimization"
    description: "Integrate all intelligence modules into executive_summary_aggregator.py"
    estimated_duration: "10-12 hours"
    dependencies: ["1", "2", "3"]
    
    tasks:
      - id: "4.1"
        title: "Orchestrate Intelligence Pipeline"
        description: |
          Refactor executive_summary_aggregator.py to use all 5 intelligence sources.
          - Call AST docstring extractor (Phase 1)
          - Call domain inference engine (Phase 1)
          - Call commit pattern analyzer (Phase 2)
          - Call README deep parser (Phase 3)
          - Synthesize results into final narrative
        acceptance_criteria:
          - All 5 modules integrated successfully
          - Graceful degradation if any module fails (log warning, continue)
          - Outputs enhanced executive-summary.json with new fields
          - Backward compatible with existing dashboard renderer
        estimated_hours: 6
        
      - id: "4.2"
        title: "Performance Optimization & Caching"
        description: |
          Optimize for <30s processing on 240K LOC codebases.
          - Parallelize file scanning (ThreadPoolExecutor)
          - Cache AST parse trees (reuse for multiple extractors)
          - Limit file scanning to top 50 files by LOC or relevance
          - Add progress indicators for long operations (with_progress decorator)
        acceptance_criteria:
          - luum-fresh (240K LOC) processes in <30 seconds
          - Memory usage <500MB for large repositories
          - Progress updates every 2 seconds during processing
          - Benchmark report: processing time for 5 test repos
        estimated_hours: 6

  - phase: 5
    name: "Tooling Evaluation & Future Enhancements"
    description: "Research and recommend external tools for deeper code intelligence"
    estimated_duration: "4-6 hours"
    dependencies: ["4"]
    
    tasks:
      - id: "5.1"
        title: "Evaluate Code Intelligence Tools"
        description: |
          Research GitHub/open-source tools for automated code understanding:
          - **Sourcegraph** - Code search and navigation API
          - **OpenAI Codex** - Natural language code explanation
          - **GitHub CodeQL** - Semantic code analysis queries
          - **Tree-sitter** - Multi-language AST parsing library
          - **Lizard** - Code complexity analysis with comment extraction
          - **Doxygen** - Documentation generation (XML output parsable)
          
          For each tool:
          - Assess integration complexity (API, CLI, library)
          - Evaluate cost (free tier, paid, self-hosted)
          - Measure value-add (what insights CORTEX can't do natively)
          - Prototype 1-2 most promising tools with sample repos
        acceptance_criteria:
          - Evaluation matrix created (5 tools × 6 criteria)
          - Top 2 tools prototyped with luum-fresh
          - Decision documented: integrate, defer, or reject each tool
          - ADR (Architecture Decision Record) created in cortex-brain/documents/
        estimated_hours: 4
        
      - id: "5.2"
        title: "Database Schema Intelligence (Future)"
        description: |
          Design approach for extracting business intelligence from database schemas.
          - Parse SQL DDL files or Entity Framework models (C#)
          - Extract table names, relationships, and column comments
          - Infer business entities from schema structure
          - Add "Data Model" section to executive summary
          
          This is planning-only (not implemented in this sprint).
        acceptance_criteria:
          - Design document created with implementation approach
          - SQL parsing libraries evaluated (sqlparse, pglast, etc.)
          - Sample output format defined (entities, relationships, complexity)
          - Estimated effort: 12-16 hours for full implementation
        estimated_hours: 2

risks:
  - description: "AST parsing fails on codebases with syntax errors"
    mitigation: "Graceful error handling - skip files with parse errors, log warnings"
    impact: "medium"
    
  - description: "Commit message quality varies widely across repos"
    mitigation: "Fall back to commit count trends if message parsing yields low-quality themes"
    impact: "low"
    
  - description: "Multi-language support complexity (C#, TypeScript, JavaScript)"
    mitigation: "Phase 1 focuses on Python only, Phase 1.2 adds other languages iteratively"
    impact: "medium"
    
  - description: "Performance <30s target may be challenging for 500K+ LOC repos"
    mitigation: "File sampling (top N files by relevance), parallel processing, caching"
    impact: "medium"

dependencies:
  internal:
    - "src/dashboard/aggregators/executive_summary_aggregator.py (refactor target)"
    - "src/use_cases/render_uml_diagrams.py (AST extraction example)"
    - "src/tier2/relationship_mapper.py (AST parsing patterns)"
    - "src/utils/progress_decorator.py (progress monitoring)"
  
  external:
    - "Python ast module (stdlib, no install needed)"
    - "gitpython library (already in requirements.txt)"
    - "Optional: tree-sitter for multi-language AST parsing (evaluate in Phase 5)"

notes:
  - "Current executive summaries scored 3/10 by user - 'very basic'"
  - "Target quality score: 8/10 (specific, insightful, project-aware)"
  - "Success measured by user feedback after implementation"
  - "Consider A/B testing: show old vs new summaries side-by-side"
