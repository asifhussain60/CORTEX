        description: "Group templates by response_type (interactive, detailed, compact, etc.)"
        estimated_hours: 1.0
        acceptance_criteria:
          - "Templates grouped: interactive/, detailed/, compact/, tech-aware/, confidence/"
          - "Index file lists template groups with file references"
          - "Template loader updated to handle modular structure"
          - "Backward compatible (falls back to monolithic if no templates/ dir)"
      
      - task_id: "10.3.2"
        name: "Split operations-config.yaml by category"
        description: "Group operations by category (admin, user, git, etc.)"
        estimated_hours: 1.0
        acceptance_criteria:
          - "Operations grouped by category in operations/ subdirectory"
          - "Index file lists operation groups"
          - "Operation loader updated to handle modular structure"
          - "Backward compatible"
      
      - task_id: "10.3.3"
        name: "Update loaders to handle both formats"
        description: "Make all YAML loaders detect and handle modular vs monolithic"
        estimated_hours: 0.5
        acceptance_criteria:
          - "Check for index file + subdirectory"
          - "If modular: Load with FileStructureOptimizer"
          - "If monolithic: Load directly (existing behavior)"
          - "No breaking changes"
    
    technical_approach: |
      For response-templates.yaml:
      1. Group templates by response_type field
      2. Create templates/ subdirectory
      3. Write each group: templates/interactive.yaml, templates/detailed.yaml, etc.
      4. Update ResponseTemplateSystem.load_templates() to check for templates/ dir
      
      For operations-config.yaml:
      1. Group operations by category field
      2. Create operations/ subdirectory
      3. Write each group: operations/admin.yaml, operations/user.yaml, etc.
      4. Update operation loaders

