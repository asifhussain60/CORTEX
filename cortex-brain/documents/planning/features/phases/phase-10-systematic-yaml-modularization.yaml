  - existing_code: "src/orchestrators/planning_orchestrator.py"

deliverables:
  - deliverable_id: "10.1"
    name: "PlanningOrchestrator Modular Output"
    description: "Modify generate_incremental_plan() to write phase-based structure automatically"
    tasks:
      - task_id: "10.1.1"
        name: "Add file size threshold check (20KB)"
        description: "Check if plan exceeds 20KB, trigger modular output if so"
        estimated_hours: 0.5
        acceptance_criteria:
          - "Threshold configurable in cortex.config.json"
          - "Default 20KB (20,480 bytes)"
          - "Logs decision (monolithic vs modular)"
      
      - task_id: "10.1.2"
        name: "Implement phase file writer"
        description: "Write each phase to phases/phase-N-name.yaml"
        estimated_hours: 1.0
        acceptance_criteria:
          - "Creates phases/ subdirectory if missing"
          - "Sanitizes phase names for filenames"
          - "Adds header comment with origin info"
          - "Preserves all phase data (deliverables, dependencies, acceptance criteria)"
      
      - task_id: "10.1.3"
        name: "Generate lightweight index file"
        description: "Create index with metadata + phase references only"
        estimated_hours: 0.5
        acceptance_criteria:
          - "Index includes: metadata, phase list (with file references), summary"
          - "Phase entries: phase_id, name, file path, status, priority, estimated_effort"
          - "No inline phase data (references only)"
          - "File size <10KB typical"
    
    technical_approach: |
      Modify PlanningOrchestrator.generate_incremental_plan():
      1. Generate plan as usual (in-memory dict)
      2. Calculate total size (yaml.dump to string, measure length)
      3. If size > threshold:
         - Extract phases list
         - Write each phase to phases/phase-{id}-{name}.yaml
         - Replace phases in index with references
         - Write lightweight index
      4. Else: Write monolithic file (existing behavior)

  - deliverable_id: "10.2"
    name: "FileStructureOptimizer Utility"
    description: "Generic utility for splitting/merging large YAML files"
    tasks:
      - task_id: "10.2.1"
        name: "Create FileStructureOptimizer class"
        description: "Core optimizer with split/merge logic"
        estimated_hours: 1.5
        acceptance_criteria:
          - "Module: src/utils/file_structure_optimizer.py"
          - "Methods: should_split(), split_into_modules(), load_with_modules()"
          - "Configurable threshold, subdirectory name, key field"
          - "Generic (works for any YAML with list of modules)"
      
      - task_id: "10.2.2"
        name: "Add lazy-loading helper"
        description: "Load index fast, load modules on-demand"
        estimated_hours: 1.0
        acceptance_criteria:
          - "Returns proxy object with __getitem__ override"
          - "Loads module files only when accessed"
          - "Caches loaded modules in memory"
          - "Compatible with existing code expecting dict"
    
    technical_approach: |
      FileStructureOptimizer class:
      
      ```python
      class FileStructureOptimizer:
          def __init__(self, threshold_bytes=20480, module_key='phases'):
              self.threshold = threshold_bytes
              self.module_key = module_key
          
          def should_split(self, file_path: Path) -> bool:
              return file_path.stat().st_size > self.threshold
          
          def split_into_modules(self, yaml_data: dict, output_dir: Path,
                                 module_key: str = 'phases') -> Path:
              # Extract modules (e.g., phases, templates)
              modules = yaml_data[module_key]
              module_dir = output_dir / module_key
              module_dir.mkdir(exist_ok=True)
              
              # Write each module to separate file
              for module in modules:
                  module_id = module['phase_id']  # or template_id, etc.
                  filename = f"{module_key[:-1]}-{module_id}.yaml"
                  with open(module_dir / filename, 'w') as f:
                      yaml.dump(module, f)
              
              # Create lightweight index with references
              index_data = yaml_data.copy()
              index_data[module_key] = [
                  {k: v for k, v in m.items() if k in ['phase_id', 'name', 'status']}
                  for m in modules
              ]
              # Add 'file' key with path
              for i, module in enumerate(index_data[module_key]):
                  module['file'] = f"{module_key}/{module_key[:-1]}-{module['phase_id']}.yaml"
              
              return output_dir / 'index.yaml'
          
          def load_with_modules(self, index_path: Path) -> dict:
              # Load index
              index = yaml.safe_load(index_path.read_text())
              
              # Return lazy-loading proxy
              return ModuleProxy(index, index_path.parent)
      
      class ModuleProxy:
          def __init__(self, index_data: dict, base_dir: Path):
              self._index = index_data
              self._base_dir = base_dir
              self._module_cache = {}
          
          def __getitem__(self, key):
              if key in self._index:
                  return self._index[key]
              # Load module on-demand
              # ...
      ```

  - deliverable_id: "10.3"
    name: "Apply to Other Large YAMLs"
    description: "Split response-templates.yaml, operations-config.yaml by logical groups"
    tasks:
