# CORTEX Implementation Plan - Phase 10
# Systematic YAML Modularization System
# 
# Purpose: Make phase breakdown optimization system-wide for all large YAML files
# Origin: User request to make CONSOLIDATED-IMPLEMENTATION-PLAN.yaml optimization
#         apply automatically to all future planning operations and other large YAMLs
# Date: 2025-12-01

phase_id: "phase_10"
phase_name: "Systematic YAML Modularization"
phase_status: "not-started"
priority: 11
estimated_effort: "6.5 hours"

description: |
  Implement automatic YAML file modularization for planning documents and other large YAML files.
  Currently, the phase breakdown optimization was applied manually to CONSOLIDATED-IMPLEMENTATION-PLAN.yaml
  (83% faster load, 87% token reduction). This phase makes that pattern systematic and automatic.

dependencies:
