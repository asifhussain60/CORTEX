  - "Original optimization: 83% faster load, 87% token reduction, 5.9x VS Code speedup"
  - "Pattern applies to: Planning files, response templates, operations config, any large YAML"
  - "Threshold 20KB chosen based on: <10KB instant, 10-30KB consider split, >30KB always split"
  - "Lazy loading enables on-demand phase access (load only Phase 0, not all 10 phases)"
