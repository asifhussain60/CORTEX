# Phase 7: Brain Health & Learning Systems
# Part of CONSOLIDATED-IMPLEMENTATION-PLAN v1.0.0
# Created: 2025-12-01

phase_id: phase_7
name: Brain Health & Learning Systems
priority: 8
status: not-started
description: Complete Tier 1/2 implementation for conversation learning and pattern
  recognition
rationale: RCA revealed incomplete Tier 1/2 implementation; brain learning capability
  exists but not activated
objectives:
- Implement full Tier 1 schema (conversations, user profiles, entities)
- Activate Tier 2 pattern learning and relationship graphs
- Add schema migration system for future evolution
- Enable brain-assisted responses with context injection
- Improve Overall Quality Score from 6.0/10 to 8.5/10
deliverables:
- id: '7.1'
  name: Tier 1 Schema Completion
  description: Implement missing Tier 1 tables for conversation history and user profiles
  files_affected:
  - cortex-brain/tier1/working_memory.db
  - src/tier1/working_memory.py
  - src/tier1/schema_migrations.py (new)
  - cortex-brain/schemas/tier1-schema.sql
  acceptance_criteria:
  - 'conversations table: Store all chat history with timestamps'
  - 'user_profile table: Preferences, interaction mode, experience level'
  - 'working_memory table: Temporary context storage with TTL'
  - 'entities table: Named entity tracking (files, functions, projects)'
  - Migration system supports zero-downtime schema evolution
  estimated_effort: 10 hours
- id: '7.2'
  name: Tier 2 Pattern Learning Activation
  description: Implement pattern storage and relationship graph functionality
  files_affected:
  - cortex-brain/tier2/knowledge_graph.db
  - src/tier2/pattern_storage.py
  - src/tier2/relationship_mapper.py (new)
  - src/tier2/semantic_search.py
  acceptance_criteria:
  - 'patterns table: Store learned workflows and code patterns'
  - 'relationships table: Graph edges between entities (file→function, feature→file)'
  - FTS5 semantic search operational
  - Pattern matching with relevance scoring
  - Auto-learn from completed TDD cycles (integrates with Phase 3)
  estimated_effort: 12 hours
- id: '7.3'
  name: Brain Initialization System
  description: Add brain setup on first run with health monitoring
  files_affected:
  - src/orchestrators/brain_init_orchestrator.py (new)
  - cortex.config.json
  - src/utils/brain_health_monitor.py (new)
  acceptance_criteria:
  - First-run wizard initializes all 3 tiers
  - 'Health monitoring dashboard: ''cortex brain health'''
  - Schema version tracking for each tier
  - Automated repair for missing tables/indexes
  - 'Health metrics: query latency, storage usage, pattern count'
  estimated_effort: 8 hours
- id: '7.4'
  name: Context Injection for Responses
  description: Enable brain-assisted responses using learned context
  files_affected:
  - src/response_templates/context_injector.py (new)
  - src/cortex_agents/intent_router.py
  - src/tier1/working_memory.py
  - src/tier2/pattern_storage.py
  acceptance_criteria:
  - Intent router queries Tier 1 for recent conversation context
  - Pattern matcher suggests relevant workflows from Tier 2
  - Context injected into response templates before rendering
  - 'Example: User asks about feature, CORTEX recalls past discussion'
  - 'Performance: Context retrieval <100ms (Tier 1 FIFO)'
  estimated_effort: 9 hours
- id: '7.5'
  name: FIFO Conversation Management
  description: Implement 70-conversation FIFO as designed (Tier 1 governance)
  files_affected:
  - src/tier1/working_memory.py
  - src/tier1/fifo_manager.py (new)
  - cortex-brain/tier1/working_memory.db
  acceptance_criteria:
  - Auto-archive conversations older than 70th most recent
  - Archived conversations moved to Tier 2 (knowledge graph)
  - FIFO maintains <100ms query performance
  - 'Manual override: ''cortex brain keep conversation <id>'''
  estimated_effort: 6 hours
dependencies:
- phase_0 (Need clean foundation)
- phase_3 (TDD tier feeding integrates with pattern learning)
testing_requirements:
- Test full conversation lifecycle (create → store → retrieve → archive)
- Test pattern learning from 3 completed TDD cycles
- Test context injection improves response relevance (manual validation)
- 'Load test: 1000 conversations, verify <100ms query latency'
- Test FIFO archival at 70-conversation threshold
- Health monitoring detects missing tables/indexes
total_estimated_effort: 45 hours
