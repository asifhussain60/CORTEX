# Phase 3: TDD Workflow Enhancement - Tier Feeding
# Part of CONSOLIDATED-IMPLEMENTATION-PLAN v1.0.0
# Created: 2025-12-01

phase_id: phase_3
name: TDD Workflow Enhancement - Tier Feeding
priority: 4
status: not-started
description: Extract development insights during RED→GREEN→REFACTOR cycles to feed
  CORTEX tiers
rationale: Tiers need continuous learning from development activity, not just git
  commit messages
objectives:
- Feed tiers during development phases, not from commit messages
- Extract patterns during RED (test creation), GREEN (implementation), REFACTOR phases
- Eliminate circular dependency of extracting from git comments
deliverables:
- id: '3.1'
  name: Development Phase Insight Extraction
  description: Extract insights during RED→GREEN→REFACTOR phases instead of from git
    comments
  challenge_raised: true
  challenge_details: "CHALLENGE: Extracting from git comments creates circular dependency\
    \ - commit messages \nsummarize work that should already be in tiers. ALTERNATIVE:\
    \ Extract insights during \neach TDD phase:\n- RED: Capture test intent, requirements,\
    \ edge cases\n- GREEN: Capture implementation patterns, dependencies, decisions\n\
    - REFACTOR: Capture improvements, performance gains, simplifications\nThis feeds\
    \ tiers in real-time, not post-hoc from commit messages.\n"
  files_affected:
  - src/orchestrators/tdd_orchestrator.py
  - src/tier1/working_memory.py
  - src/tier2/pattern_storage.py
  - src/tier3/development_context.py
  acceptance_criteria:
  - RED phase extracts test requirements and edge cases to Tier 1
  - GREEN phase extracts implementation patterns to Tier 2
  - REFACTOR phase extracts improvements and metrics to Tier 3
  - Extraction happens automatically during each phase
  - No git comment parsing needed
  estimated_effort: 10 hours
- id: '3.2'
  name: Pattern Learning from TDD Cycles
  description: Enhance Tier 2 to learn development patterns from completed TDD cycles
  files_affected:
  - src/tier2/pattern_storage.py
  - src/tier2/semantic_search.py
  - cortex-brain/tier2/knowledge_graph.db (schema update)
  acceptance_criteria:
  - Completed TDD cycles stored as patterns
  - 'Patterns include: test strategy, implementation approach, refactoring type'
  - Future TDD cycles suggest relevant patterns
  - Pattern matching uses FTS5 semantic search
  estimated_effort: 8 hours
- id: '3.3'
  name: Development Context Real-Time Updates
  description: Update Tier 3 with code metrics and hotspots during development, not
    post-commit
  files_affected:
  - src/tier3/development_context.py
  - src/tier3/code_metrics.py
  - src/utils/realtime_metrics.py
  acceptance_criteria:
  - Code complexity metrics calculated during GREEN phase
  - Refactoring impact measured during REFACTOR phase
  - Hotspot detection updates in real-time
  - Metrics stored in Tier 3 before commit
  estimated_effort: 7 hours
dependencies:
- phase_0 (TDD requires clean code foundation)
testing_requirements:
- Run full TDD cycle and verify all phases feed tiers
- Verify Tier 1 captures test requirements
- Verify Tier 2 learns implementation patterns
- Verify Tier 3 updates code metrics
- Test extraction does not slow down TDD workflow (max 2% overhead)
total_estimated_effort: 25 hours
