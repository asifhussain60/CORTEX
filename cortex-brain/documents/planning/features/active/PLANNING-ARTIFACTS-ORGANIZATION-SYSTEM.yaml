metadata:
  plan_id: "PLAN-2025-12-13-planning-artifacts-organization"
  title: "Planning Artifacts Organization System"
  created_date: "2025-12-13"
  author: "Asif Hussain"
  priority: "HIGH"
  complexity: "MEDIUM"
  estimated_duration: "20-22 hours"
  version: "2.2.0"

overview:
  problem_statement: |
    Current planning system creates artifacts (master plans, sub-plans, reports, trackers, 
    status updates) scattered across multiple locations with no unified structure. This 
    makes navigation difficult and pollutes the filesystem with loose files.
    
    Current issues:
    - Master plans and sub-plans stored as flat files in features/active/
    - No relationship tracking between related artifacts
    - Reports, status updates mixed with plan files
    - Difficult to find all artifacts for a specific plan
    - No standardized folder structure per plan
    - Migration needed for ~300+ existing planning documents
  
  solution_summary: |
    Implement a hierarchical folder structure where each plan gets its own folder with 
    standardized subfolders for all artifacts. Integrate into planning orchestrator to 
    auto-create structure. Add migration utility to reorganize existing artifacts.
    
    **V2.0 Simplifications:**
    - Direct folder implementation (no dual-mode complexity)
    - Feature flag controls behavior (cortex.config.json)
    - Git-based rollback (instant, reliable)
    - Reduced timeline: 17 hours (saved 4h by removing dual-mode)
  
  success_criteria:
    - "All new plans auto-generate organized folder structure"
    - "Master plan, sub-plans, trackers in standardized locations"
    - "Easy navigation: one folder = one plan + all artifacts"
    - "Migration tool successfully reorganizes existing 300+ documents"
    - "No broken references after migration"
    - "Clean, maintainable filesystem organization"
    - "Feature flag controls folder structure usage"
    - "Git rollback tested and working"
  
  implementation_phases_summary:
    phase_1: "Folder structure design & implementation (2h)"
    phase_2: "Migration system development (4h)"
    phase_3: "Vacuum & cleanup integration (2h)"
    phase_4: "Testing & validation (2h)"
    phase_5: "Orchestrator integration (4h)"
    phase_6: "Production migration - Primary folders (7h)"
    phase_7: "Production migration - Secondary folders (optional, 2h)"
    phase_8: "Documentation alignment & guide updates (1h)"
    phase_4: "Testing & validation (2h)"
    phase_5: "Orchestrator & capability validation (4h)"
    phase_6: "Migration execution & documentation (3h)"
    total_estimated: "17 hours"
    complexity_reductions:
      - "Removed dual-mode support: -2h implementation"
      - "Removed backward compatibility testing: -1h testing"
      - "Simplified rollback to Git: -1h setup"
      - "Total time saved: ~4 hours"

