  - phase_number: 6
    name: "Production Migration - Primary Folders"
    duration: "7 hours"
    description: |
      Execute migration on production data with expanded scope to include all primary 
      planning folders. This phase migrates active work, ADO items, and root-level loose 
      files to establish unified folder-based organization.
      
      **Scope Expansion (from v2.0):**
      - Added: active/ folder (80 files)
      - Added: ado/ folder (18 files)
      - Added: features/active/ merge (17 files)
      - Added: Root-level loose file cleanup (28 files)
      - Original: completed/ and archived/ folders
      
      **Total: ~280 files across 6 folder sources**
      
      **Rationale for Expansion:**
      1. Prevents dual-standard confusion (old flat + new hierarchical)
      2. active/ folder contains most current work requiring immediate structure
      3. ado/ folder already follows naming conventions, perfect fit
      4. features/active/ already attempting hierarchy, merge for consistency
      5. Root-level loose files cause same navigation issues Phase 1-3 solved
      6. Migration engine supports batch processing (proven with 132/132 tests)
    
    tasks:
      - task_id: "6.1"
        name: "Staged Migration - Primary Folders"
        description: |
          Execute migration in stages with validation gates:
          
          **Stage 1: Dry-run on all folders**
          - Run migration in preview mode
          - Generate migration plan for all 280 files
          - Review file groupings and folder assignments
          - Identify potential issues (duplicates, naming conflicts)
          - Estimated affected files:
            - active/: 80 files → ~40 plan folders
            - ado/: 18 files → ~10 ADO work item folders
            - features/active/: 17 files → merge into parent structure
            - root loose: 28 files → classify and migrate/archive
            - completed/: 11 files → ~8 plan folders
            - archived/: 50 files (first batch) → ~25 plan folders
          
          **Stage 2: Migrate active/ folder (80 files)**
          - Execute migration for active plans
          - Create hierarchical folders per plan
          - Organize artifacts into subfolders
          - Validate: no data loss, all files moved, README generated
          - Test: Can navigate structure, find artifacts easily
          
          **Stage 3: Migrate ado/ folder (18 files)**
          - Execute migration for ADO work items
          - Treat as master plans (ADO-12345 format)
          - Create ADO-specific folder structure
          - Validate: ADO references intact, structure correct
          
          **Stage 4: Migrate features/active/ folder (17 files)**
          - Execute migration and merge into parent features/ structure
          - Resolve any conflicts with Stage 2 migrations
          - Consolidate duplicate folders if found
          - Validate: unified structure, no orphaned files
          
          **Stage 5: Migrate root-level loose files (28 files)**
          - Classify each file:
            - Master plans → migrate to features/{status}/PLAN-xxx/
            - Tracking docs → archive or move to appropriate category
            - Obsolete files → vacuum to .archive/
          - Execute migrations based on classification
          - Validate: root directory cleaned, no orphans
          
          **Stage 6: Migrate completed/ folder (11 files)**
          - Execute migration for completed plans
          - Move to features/completed/ with folder structure
          - Validate: lifecycle preserved, structure correct
          
          **Stage 7: Migrate archived/ folder (first 50 files)**
          - Execute migration on first batch of archived plans
          - Lower priority, historical only
          - Validate: structure correct, no data loss
          - Note: Remaining 81 archived files deferred to Phase 7
        
        acceptance_criteria:
          - "All 7 stages completed successfully"
          - "~230 files migrated (280 - 50 deferred)"
          - "No data loss verified at each stage"
          - "Validation passing after each stage"
          - "Rollback tested for at least one stage"
        
        estimated_duration: "5 hours"
      
