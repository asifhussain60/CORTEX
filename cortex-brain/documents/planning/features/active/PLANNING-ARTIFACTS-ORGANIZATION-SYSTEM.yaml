      - "setup-reports/ (system-level)"
      - "cleanup-reports/ (system-level)"
      - "artifacts/ (system-level backups)"
      - "discovery-reports/ (separate concern)"

  migration_strategy:
    feature_flag:
      description: "Control folder structure with configuration flag"
      implementation:
        - "cortex.config.json: planning.use_folder_structure (default: true)"
        - "PlanFolderManager respects flag for new plan creation"
        - "Existing flat files preserved during migration"
    
    one_shot_migration:
      description: "Direct migration with Git-based safety"
      implementation:
        - "Git branch protection (CORTEX-3.0 branch)"
        - "One migration script execution"
        - "Single commit with all changes"
        - "Validation before merge to main"
    
    git_rollback:
      description: "Rollback via Git (not code changes)"
      implementation:
        - "Git revert if migration fails"
        - "No dual-mode code to maintain"
        - "Clean rollback to previous commit"

  rollback_plan:
    trigger_conditions:
      - "Data loss detected (missing files)"
      - "Broken references exceed 5%"
      - "Critical orchestrator failures"
    
    git_rollback_steps:
      - "Identify migration commit hash"
      - "git revert <commit-hash> OR git reset --hard <pre-migration-commit>"
      - "Validate restored state (flat files restored)"
      - "Generate rollback report"
      - "No code changes needed (feature flag controls behavior)"
    
    backup_strategy:
      - "Git tag before migration: planning-migration-YYYYMMDD"
      - "Git checkpoint commit before migration"
      - "Optional: Manual backup in cortex-brain/backups/ for extra safety"
      - "Rollback is single Git command (instant)"

notes:
