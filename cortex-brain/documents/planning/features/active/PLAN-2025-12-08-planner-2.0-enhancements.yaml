plan_id: PLAN-2025-12-08-planner-2.0-enhancements
title: Planner 2.0 Enhanced Progress Templates & Threat Modeling
created_date: 2025-12-08
updated_date: 2025-12-08
author: Asif Hussain
status: active
version: "1.0"

metadata:
  complexity: medium
  estimated_hours: 12-16
  priority: medium
  tags:
    - planning-system
    - progress-visualization
    - threat-modeling
    - user-experience
  dependencies:
    - Planning System 2.0 (existing)
    - ThreatModelerAgent (existing)
    - Progress decorator system (existing)
    - Response template system (existing)

summary: |
  Enhance Planner 2.0 with custom user response templates that display visual progress
  bars at each execution stage, add meta-instructions to generated plans for Copilot
  to follow, and integrate threat modeling as an optional analysis phase.

objectives:
  primary:
    - Integrate custom response templates with visual progress bars during plan execution
    - Add Copilot meta-instructions to generated plans
    - Integrate ThreatModelerAgent into plan generation workflow
    - Improve user visibility into plan execution progress
  secondary:
    - Create reusable template patterns for other orchestrators
    - Document threat modeling integration patterns
    - Establish best practices for Copilot instruction embedding

definition_of_ready:
  - Current planning orchestrator code reviewed and understood
  - Response template system architecture documented
  - ThreatModelerAgent capabilities mapped
  - Progress decorator patterns identified
  - TDD Mastery workflow MUST be followed (RED→GREEN→REFACTOR)
  - Tests MUST fail before implementation (RED phase validation)
  - Git checkpoints required at RED, GREEN, REFACTOR phases
  - Test coverage targets defined for all new code
  - Test files MUST exist for all production code (per-layer validation)
  - No empty/placeholder tests allowed (quality validation)

definition_of_done:
  - Planning orchestrator renders progress templates during execution
  - Generated plans include meta-instructions section for Copilot
  - Threat modeling integrated as optional phase in plan generation
  - Visual progress bars visible during autonomous execution
  - Unit tests achieve 85%+ coverage for new code
  - Integration tests validate end-to-end workflow
  - Documentation updated (planning-orchestrator-guide.md)
  - All code follows TDD workflow with git checkpoints
  - Git history shows test-first commits (RED phase before GREEN phase)
  - All tests pass with minimum coverage thresholds met
  - No test skips or ignores without documented justification
  - Per-layer coverage thresholds met (Domain: 90%, Application: 85%, Infrastructure: 70%, API: 80%)
  - No empty placeholder tests (UnitTest1, Test1, etc.) in codebase

phases:
  - phase_id: 1
    name: Progress Template Integration
    description: Wire custom response templates into planning execution flow
    estimated_hours: 4-5
    tasks:
      - task_id: "1.1"
        name: Add template rendering to execute_plan_autonomously
        description: |
          Modify PlanningOrchestrator.execute_plan_autonomously() to render
          autonomous_execution_progress template at key execution points
        estimated_hours: 1.5
        implementation_notes: |
          - Import ResponseTemplateManager (already initialized in __init__)
          - After each phase completion, render progress template
          - Pass phase_name, current_phase, total_phases, progress_bar string
          - Use yield_progress() to trigger template rendering
          - Example: self.template_manager.render('autonomous_execution_progress', context)
        acceptance_criteria:
          - Template renders after each phase completes
          - Progress bar shows accurate phase completion
          - Template includes elapsed time, task count, current task
          
      - task_id: "1.2"
        name: Enhance autonomous_execution_progress template
        description: |
          Update cortex-brain/response-templates.yaml template to include
          more detailed phase breakdown and visual progress indicators
        estimated_hours: 1.0
        implementation_notes: |
          - Add phase-by-phase checklist with completion status
          - Include DoR/DoD validation status
          - Add estimated time remaining calculation
          - Show TDD phase indicators (RED/GREEN/REFACTOR)
          - Example format:
            Phase 1: [✅ RED ✅ GREEN ✅ REFACTOR]
            Phase 2: [✅ RED ⏳ GREEN ⏸️ REFACTOR]
        acceptance_criteria:
          - Template shows per-phase TDD status
          - Visual indicators use emojis (✅ ⏳ ⏸️)
          - Progress bars use Unicode block characters
          
      - task_id: "1.3"
        name: Add progress template to non-autonomous execution
        description: |
          Extend progress template usage to interactive planning workflow
          (not just autonomous execution)
        estimated_hours: 1.5
        implementation_notes: |
          - Identify interactive planning touchpoints
          - Add template rendering in create_plan(), approve_plan()
          - Show plan creation progress (skeleton → DoR → phases → DoD)
          - Use planning-workflow template from response-templates.yaml
        acceptance_criteria:
          - Progress visible during interactive plan creation
          - Template used consistently across all planning modes
          - User sees progress without needing to check files

  - phase_id: 2
    name: Copilot Meta-Instructions
    description: Add instructions to generated plans for Copilot to follow
    estimated_hours: 3-4
    tasks:
      - task_id: "2.1"
        name: Design meta-instructions schema
        description: |
          Define YAML schema for embedded Copilot instructions in plans
        estimated_hours: 1.0
        implementation_notes: |
          - Add copilot_instructions section to plan-schema.yaml
          - Include fields: response_template, progress_updates, custom_format
          - Example:
            copilot_instructions:
              response_template: autonomous_execution_progress
              progress_updates: true
              custom_format: |
                Use 5-part response format with visual progress bars.
                Update progress after each task completion.
        acceptance_criteria:
          - Schema validates copilot_instructions section
          - Schema includes all necessary instruction types
          - Schema documented in plan-schema.yaml comments
          
      - task_id: "2.2"
        name: Generate meta-instructions during plan creation
        description: |
          Modify IncrementalPlanGenerator to inject copilot_instructions
          into generated plans automatically
        estimated_hours: 1.5
        implementation_notes: |
          - Update generate_plan_skeleton() to include copilot_instructions
          - Default to autonomous_execution_progress template
          - Add instructions for progress updates at task boundaries
          - Include instructions for TDD workflow integration
          - Add instructions for threat modeling (if enabled)
        acceptance_criteria:
          - All new plans include copilot_instructions section
          - Instructions are clear and actionable
          - Instructions reference correct response template
          
      - task_id: "2.3"
        name: Update planning-orchestrator-guide.md
        description: |
          Document how Copilot reads and follows meta-instructions from plans
        estimated_hours: 0.5
        implementation_notes: |
          - Add "Copilot Meta-Instructions" section
          - Explain schema and purpose
          - Show examples of meta-instructions in action
          - Document best practices for instruction writing
        acceptance_criteria:
          - Guide explains meta-instructions clearly
          - Examples show actual YAML snippets
          - Best practices section included

  - phase_id: 3
    name: Threat Modeling Integration
    description: Add optional security analysis phase to plan generation
    estimated_hours: 4-5
    tasks:
      - task_id: "3.1"
        name: Add threat modeling phase to plan schema
        description: |
          Extend plan-schema.yaml to include optional threat_analysis phase
        estimated_hours: 0.5
        implementation_notes: |
          - Add threat_analysis object to phases (optional)
          - Include fields: enabled, stride_categories, owasp_mapping
          - Example:
            threat_analysis:
              enabled: true
              stride_categories: [SPOOFING, TAMPERING, INFORMATION_DISCLOSURE]
              owasp_mapping: [A01, A07]
              auto_mitigations: true
        acceptance_criteria:
          - Schema validates threat_analysis section
          - Field descriptions explain STRIDE and OWASP
          - Examples provided in schema comments
          
      - task_id: "3.2"
        name: Integrate ThreatModelerAgent into plan generation
        description: |
          Call ThreatModelerAgent during plan creation to generate threat analysis
        estimated_hours: 2.0
        implementation_notes: |
          - Check if threat_analysis.enabled in plan config
          - Call self.threat_modeler.analyze_feature(feature_name, feature_type)
          - Append threat report to plan metadata
          - Add threat mitigation tasks to implementation phases
          - Update DoR to include "Threat model reviewed"
          - Update DoD to include "Mitigations implemented"
        acceptance_criteria:
          - Threat analysis runs automatically when enabled
          - Threat report included in plan metadata
          - Mitigation tasks added to appropriate phases
          - DoR/DoD updated with security criteria
          
      - task_id: "3.3"
        name: Add threat modeling to response template
        description: |
          Enhance autonomous_execution_progress template to show threat modeling status
        estimated_hours: 1.0
        implementation_notes: |
          - Add threat modeling section to template
          - Show STRIDE categories analyzed
          - Display threat count by risk rating (Critical/High/Medium/Low)
          - Include mitigation implementation status
          - Example:
            ### 🔒 Security Analysis
            **Threats Identified:** 12 (2 Critical, 4 High, 6 Medium)
            **STRIDE Coverage:** S, T, R, I, D, E
            **Mitigations:** [████░░] 4/6 implemented
        acceptance_criteria:
          - Template shows threat analysis summary
          - Visual progress for mitigation implementation
          - Links to full threat report
          
      - task_id: "3.4"
        name: Document threat modeling integration
        description: |
          Create threat-modeling-integration-guide.md with usage examples
        estimated_hours: 1.0
        implementation_notes: |
          - Explain when to enable threat modeling (API, auth, data features)
          - Show example plan with threat_analysis enabled
          - Document ThreatModelerAgent capabilities
          - Provide mitigation strategy examples
          - Link to STRIDE and OWASP resources
        acceptance_criteria:
          - Guide explains threat modeling clearly
          - Examples show real-world scenarios
          - Links to external resources provided

  - phase_id: 4
    name: Testing & Validation
    description: Comprehensive testing of all enhancements
    estimated_hours: 3-4
    tasks:
      - task_id: "4.1"
        name: Unit tests for template integration
        description: |
          Write unit tests for template rendering in planning orchestrator
        estimated_hours: 1.5
        implementation_notes: |
          - Test template rendering at each execution phase
          - Mock ResponseTemplateManager
          - Verify progress bar generation
          - Test template context data structure
          - Test error handling when template not found
          - File: tests/orchestrators/test_planning_template_integration.py
        acceptance_criteria:
          - 10+ unit tests covering template integration
          - Tests verify correct template selection
          - Tests validate progress data accuracy
          - Coverage >85% for new code
          
      - task_id: "4.2"
        name: Integration tests for threat modeling
        description: |
          Test end-to-end threat modeling integration in plan generation
        estimated_hours: 1.5
        implementation_notes: |
          - Test plan generation with threat_analysis enabled
          - Verify ThreatModelerAgent called correctly
          - Test threat report appended to plan metadata
          - Test mitigation tasks added to phases
          - Test DoR/DoD updated with security criteria
          - File: tests/integration/test_threat_modeling_planning.py
        acceptance_criteria:
          - 8+ integration tests covering threat modeling
          - Tests validate full workflow
          - Tests verify threat report structure
          - Coverage >85% for new code
          
      - task_id: "4.3"
        name: End-to-end autonomous execution test
        description: |
          Test complete autonomous execution with progress templates and threat modeling
        estimated_hours: 1.0
        implementation_notes: |
          - Create sample plan with threat_analysis enabled
          - Execute plan autonomously
          - Verify progress templates rendered at each phase
          - Verify threat analysis included in output
          - Capture and validate all progress updates
          - File: tests/e2e/test_autonomous_execution_enhanced.py
        acceptance_criteria:
          - E2E test completes successfully
          - Progress templates visible in output
          - Threat modeling results included
          - Test validates all phases execute correctly

risks:
  - risk_id: R1
    description: Template rendering overhead may slow down execution
    likelihood: low
    impact: medium
    mitigation: |
      - Profile template rendering performance
      - Cache template compilation (Jinja2 already does this)
      - Only render templates when progress updates occur (not every loop)
      - Add threshold for template rendering (only if execution >5 seconds)
      
  - risk_id: R2
    description: Threat modeling may add significant time to plan generation
    likelihood: medium
    impact: medium
    mitigation: |
      - Make threat modeling optional (enabled flag)
      - Run threat analysis asynchronously
      - Cache threat templates for common feature types
      - Allow users to skip threat modeling for non-critical features
      
  - risk_id: R3
    description: Copilot may not correctly interpret meta-instructions
    likelihood: medium
    impact: high
    mitigation: |
      - Use clear, explicit instruction language
      - Test meta-instructions with actual Copilot sessions
      - Provide examples of correct instruction following
      - Add validation to ensure instructions are parseable
      - Document common instruction patterns

assumptions:
  - Copilot can read and interpret YAML meta-instructions
  - ResponseTemplateManager is thread-safe for concurrent rendering
  - ThreatModelerAgent is already tested and stable
  - Progress decorator system handles nested progress calls
  - Users want more visibility into plan execution progress

success_metrics:
  quantitative:
    - Progress template rendering adds <500ms overhead per phase
    - Threat modeling completes in <10 seconds for typical features
    - Test coverage >85% for all new code
    - Zero regressions in existing planning workflow
  qualitative:
    - Users report better visibility into plan execution
    - Copilot correctly follows meta-instructions in 90%+ of cases
    - Threat modeling identified in real-world features

rollback_plan: |
  If enhancements cause issues:
  1. Feature flags can disable template rendering (add config flag)
  2. Threat modeling optional - can be disabled per plan
  3. Meta-instructions ignored if Copilot doesn't support them
  4. All changes in planning orchestrator are additive (no breaking changes)
  5. Git revert to commit before enhancement if critical failure

notes: |
  Implementation Priority:
  1. Phase 1 (Progress Templates) - Highest value, lowest risk
  2. Phase 2 (Meta-Instructions) - Medium value, medium risk (depends on Copilot)
  3. Phase 3 (Threat Modeling) - High value, medium risk (performance concern)
  4. Phase 4 (Testing) - Mandatory, run in parallel with implementation
  
  Consider parallelizing Phase 1 and Phase 3 - they have minimal dependencies.
  
  Key Files to Modify:
  - src/orchestrators/planning_orchestrator.py (template integration)
  - cortex-brain/response-templates.yaml (template enhancements)
  - cortex-brain/config/plan-schema.yaml (schema extensions)
  - src/workflows/incremental_plan_generator.py (meta-instructions generation)
  - .github/prompts/modules/planning-orchestrator-guide.md (documentation)
  
  Threat Modeling Already Exists:
  - ThreatModelerAgent already initialized in PlanningOrchestrator.__init__ (line 81)
  - Integration is primarily wiring, not new development
  - Focus on making it seamless and optional
