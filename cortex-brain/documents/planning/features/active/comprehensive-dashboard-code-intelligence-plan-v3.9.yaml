          COVERAGE METRICS:
          - **Line Coverage**: % of executable lines covered by tests
          - **Function Coverage**: % of functions with at least one test
          - **Class Coverage**: % of classes with test files
          - **Branch Coverage**: % of conditional branches tested (if available)
          - **Domain Coverage**: Coverage % per business domain (Phase 1.3)
          
          CALCULATION METHODS:
          - **Method 1**: Parse coverage reports (gold standard, requires test execution)
          - **Method 2**: AST analysis - match test names to source names
          - **Method 3**: Import analysis - detect which modules are imported by tests
          - **Method 4**: Fallback - test file count / source file count ratio
          
