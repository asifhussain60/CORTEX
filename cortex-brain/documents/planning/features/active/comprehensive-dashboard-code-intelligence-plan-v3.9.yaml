      - id: "2.5.3"
        title: "Test Gap Prioritization Matrix"
        status: "complete"
        description: |
          Categorize untested/undertested code by business criticality and risk.
          
          PRIORITIZATION CRITERIA:
          
          **P0 - CRITICAL (Must Test)**:
          - API endpoints (REST/SOAP/GraphQL)
          - Authentication/authorization logic
          - Data mutation operations (INSERT/UPDATE/DELETE)
          - Financial calculations (money, tax, payroll)
          - Security-sensitive code (encryption, validation, permissions)
          - Public interfaces (exported classes, public methods)
          - Criteria: High business impact + High risk + Low current coverage (<30%)
          
          **P1 - HIGH (Should Test)**:
          - Business logic services
          - Data validation and transformation
          - Workflow orchestration
          - Report generation
          - Integration points (external APIs, databases)
          - Criteria: Medium-high business impact + Medium risk + Low-medium coverage (30-60%)
          
          **P2 - MEDIUM (Nice to Test)**:
          - Utility functions and helpers
          - Data access layer (CRUD operations)
          - Configuration loaders
          - Logging and monitoring
          - UI controllers with minimal logic
          - Criteria: Medium business impact + Low-medium risk + Medium coverage (60-80%)
          
          **P3 - LOW (Optional)**:
          - DTOs and POCOs (data transfer objects)
          - Simple getters/setters
          - Constants and enums
          - Generated code
          - Third-party wrapper classes (minimal logic)
          - Criteria: Low business impact + Low risk + High coverage (>80%) or trivial code
          
          RISK SCORING FACTORS:
          - **Complexity**: Cyclomatic complexity >10 → higher risk
          - **Change Frequency**: >10 commits in last 90 days → higher risk
          - **Bug History**: >3 bug fixes in last 6 months → higher risk
          - **Dependencies**: Used by >5 other modules → higher risk
          - **Data Sensitivity**: Handles PII/financial data → higher risk
          
          DETECTION PATTERNS:
          - API endpoints: Route attributes ([HttpGet], @app.route, @RequestMapping)
          - Auth code: Keywords (authorize, authenticate, permission, role, token)
          - Money operations: Decimal/Money types, currency symbols, tax/fee keywords
          - Security: encrypt, hash, sanitize, validate, escape keywords
          - Public APIs: public class/method, exported functions
          
          OUTPUT:
          ```json
          {
            "p0_critical": {
              "count": 47,
              "total_loc": 8234,
              "estimated_hours": 94,
              "examples": [
                {
                  "file": "PayrollCalculator.cs",
                  "class": "PayrollCalculator",
                  "method": "CalculateNetPay",
                  "reason": "Financial calculation with 0% coverage",
                  "complexity": 18,
                  "risk_score": 95,
                  "current_coverage": 0,
                  "effort_hours": 3
                }
              ]
            },
            "p1_high": {...},
            "p2_medium": {...},
            "p3_low": {...},
            "summary": {
              "total_untested_methods": 312,
              "p0_percentage": 15.1,
              "total_effort_hours": 234
            }
          }
          ```
        acceptance_criteria:
          - Categorizes all untested code into P0/P1/P2/P3
          - Detection patterns identify API/auth/money/security code with 90%+ accuracy
          - Risk scoring incorporates complexity, change frequency, bug history
