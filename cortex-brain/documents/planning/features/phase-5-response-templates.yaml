# Phase 5: Response Template System Refactor
# Version: 1.0.0
# Priority: 6
# Status: Not Started
# Estimated Effort: 38 hours

metadata:
  phase_id: "phase_5"
  name: "Response Template System Refactor"
  priority: 6
  status: "not-started"
  description: "Refactor monolithic 2,669-line response-templates-v4.yaml into modular profile-driven system"
  rationale: "Monolithic templates hard to maintain; user profile integration missing"
  total_estimated_effort: "38 hours"

objectives:
  - "Split monolithic YAML into 4 modular files (base components, templates, profiles, routing)"
  - "Integrate UserProfileManager for interaction mode-driven responses"
  - "Support dynamic template variants (Autonomous, Guided, Educational, Pair modes)"
  - "Replace YAML anchors with template composition engine"
  - "Reduce configuration complexity by 58% (2,669 → 1,120 lines)"

deliverables:
  - id: "5.1"
    name: "Modular YAML Structure"
    description: "Split response-templates-v4.yaml into 4 focused files"
    files_affected:
      - "cortex-brain/response-templates/base-components.yaml (new)"
      - "cortex-brain/response-templates/template-definitions.yaml (new)"
      - "cortex-brain/response-templates/profile-variants.yaml (new)"
      - "cortex-brain/response-templates/routing-rules.yaml (new)"
      - "cortex-brain/response-templates-v4.yaml (legacy, deprecated)"
    acceptance_criteria:
      - "base-components.yaml: 200 lines (header, sections, footers)"
      - "template-definitions.yaml: 400 lines (18 templates with placeholders)"
      - "profile-variants.yaml: 300 lines (4 interaction modes)"
      - "routing-rules.yaml: 220 lines (trigger mapping)"
      - "Total: 1,120 lines (58% reduction)"
    estimated_effort: "8 hours"
    
  - id: "5.2"
    name: "Template Composition Engine"
    description: "Replace YAML anchor inheritance with Python composition engine"
    files_affected:
      - "src/response_templates/composer.py (new)"
      - "src/response_templates/template_manager.py"
      - "src/response_templates/profile_adapter.py (new)"
    acceptance_criteria:
      - "Load 4 YAML files into in-memory structure"
      - "Compose template based on profile interaction_mode"
      - "Autonomous mode: compact format, minimal sections"
      - "Educational mode: extended format, 'Why This Matters' sections"
      - "Backward compatible with existing template manager API"
    estimated_effort: "12 hours"
    
  - id: "5.3"
    name: "UserProfile Integration"
    description: "Connect template system to UserProfileManager for profile-driven responses"
    files_affected:
      - "src/response_templates/template_manager.py"
      - "src/orchestrators/user_profile_manager.py"
      - "src/cortex_agents/intent_router.py"
    acceptance_criteria:
      - "Intent router passes user_id to template manager"
      - "Template manager fetches profile from UserProfileManager"
      - "Profile interaction_mode determines template variant"
      - "Fallback to 'guided' mode if no profile exists"
    estimated_effort: "6 hours"
    
  - id: "5.4"
    name: "Dynamic Section Rendering"
    description: "Support interaction mode-specific section inclusion/exclusion"
    files_affected:
      - "src/response_templates/composer.py"
      - "src/response_templates/section_renderer.py (new)"
    acceptance_criteria:
      - "Autonomous: Excludes 'Understanding', 'Challenge', 'Request Echo'"
      - "Guided: Includes all 5 standard sections"
      - "Educational: Adds 'Why This Matters', 'Learn More' sections"
      - "Pair: Replaces 'Response' with 'Options' + 'Recommendation'"
      - "Mandatory header (🧠 CORTEX + Author) ALWAYS present"
    estimated_effort: "7 hours"
    
  - id: "5.5"
    name: "Backward Compatibility Layer"
    description: "Ensure existing code continues working during migration"
    files_affected:
      - "src/response_templates/legacy_adapter.py (new)"
      - "src/response_templates/template_manager.py"
    acceptance_criteria:
      - "Legacy code using old template manager API works unchanged"
      - "New code can use profile-driven API"
      - "Deprecation warnings for old API usage"
      - "Migration guide in docs/RESPONSE-TEMPLATE-MIGRATION.md"
    estimated_effort: "5 hours"

dependencies:
  - "phase_0 (Clean code needed before refactoring)"

testing_requirements:
  - "Test all 18 templates render correctly"
  - "Test all 4 interaction modes produce correct variants"
  - "Verify mandatory header present in all modes"
  - "Test backward compatibility with legacy code"
  - "Performance: Template loading <50ms, composition <10ms"

notes:
  - "58% reduction in configuration complexity"
  - "User profile integration enables personalized responses"
  - "Modular structure simplifies maintenance"
