# Phase 1: Setup & Onboarding Enhancement
# Version: 1.0.0
# Priority: 2
# Status: Completed
# Estimated Effort: 21 hours

metadata:
  phase_id: "phase_1"
  name: "Setup & Onboarding Enhancement"
  priority: 2
  status: "completed"
  completion_date: "2025-12-01"
  description: "Fix multi-repo Python environment issues, enhance onboarding UX, add application naming"
  rationale: "Setup problems block user adoption; must fix before adding features"
  total_estimated_effort: "21 hours"
  actual_effort: "~20 hours"

objectives:
  - "Resolve Python environment conflicts across multiple CORTEX-enabled repos"
  - "Implement shared CORTEX tooling environment to eliminate duplication"
  - "Add user expectation management for long-running operations"
  - "Require application name as parameter for onboarding"

deliverables:
  - id: "1.1"
    name: "Shared CORTEX Tooling Environment"
    description: "Create global CORTEX tooling environment separate from project-specific Python environments"
    challenge_raised: true
    challenge_details: |
      CHALLENGE: Installing identical tooling 10 times is inefficient, but shared environments 
      risk version conflicts. ALTERNATIVE: Create ~/.cortex/venv/ as shared tooling environment 
      with symlinks from each project. Project-specific dependencies stay isolated.
    files_affected:
      - "src/orchestrators/setup_orchestrator.py"
      - "scripts/setup-cortex.sh"
      - "cortex.config.json"
      - "docs/SETUP-CORTEX.md"
    acceptance_criteria:
      - "Shared CORTEX venv created at ~/.cortex/venv/"
      - "Each project references shared environment via config"
      - "Project-specific dependencies installed separately"
      - "Setup time reduced from 10x to 1x + 10 symlinks"
    estimated_effort: "8 hours"
    
  - id: "1.2"
    name: "Long-Running Operation Notifications"
    description: "Add user expectation management for operations >5 minutes"
    files_affected:
      - "src/orchestrators/onboarding_orchestrator.py"
      - "src/utils/progress_decorator.py"
      - "cortex-brain/response-templates.yaml"
    acceptance_criteria:
      - "Operations >5 min show initial notification: 'This will take 10-15 minutes. Good time for coffee.'"
      - "Progress decorator enhanced with time estimates"
      - "Onboarding shows step-by-step progress (1/7, 2/7, etc.)"
    estimated_effort: "3 hours"
    
  - id: "1.3"
    name: "Application Name Requirement"
    description: "Rename 'onboard application' to require application name as parameter"
    files_affected:
      - "src/orchestrators/onboarding_orchestrator.py"
      - "src/cortex_agents/intent_router.py"
      - "cortex-brain/tier1/working_memory.db (schema)"
      - "cortex-brain/response-templates.yaml"
    acceptance_criteria:
      - "Onboarding requires --app-name parameter"
      - "Application name stored in Tier 1 working memory"
      - "CORTEX uses application name in all subsequent interactions"
      - "Help text updated: 'onboard application <name>'"
    estimated_effort: "4 hours"
    
  - id: "1.4"
    name: "Onboarding Module Completion"
    description: "Complete unfinished onboarding application module (request mentions 'does not')"
    files_affected:
      - "src/orchestrators/onboarding_orchestrator.py"
      - "tests/test_onboarding_orchestrator.py"
    acceptance_criteria:
      - "All onboarding steps complete end-to-end"
      - "Error handling covers edge cases (missing files, invalid structure)"
      - "Integration tests verify full onboarding workflow"
    estimated_effort: "6 hours"

dependencies:
  - "phase_0 (Foundation must be clean before setup changes)"

testing_requirements:
  - "Test setup across 3 different repos"
  - "Verify no conflicts between shared and project environments"
  - "Test onboarding with valid and invalid application names"
  - "Verify long-running operation notifications appear"

notes:
  - "Shared environment approach reduces setup overhead"
  - "Application name enables personalized CORTEX interactions"
