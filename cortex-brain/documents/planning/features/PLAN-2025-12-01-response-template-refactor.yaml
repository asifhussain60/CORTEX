## Open Questions

1. **Should response_detail override interaction_mode entirely?**
   - Current: response_detail modifies mode-based variant
   - Alternative: response_detail replaces mode for template selection

2. **Should we keep 5-part structure as default?**
   - Current proposal: 3-section base (header + response + next steps)
   - Alternative: Make section count profile-driven

3. **How to handle template-specific overrides?**
   - Example: "help_table" always shows context summary regardless of mode
   - Proposed: Template-level `force_sections` config

4. **Migration timeline for deprecating legacy YAML?**
   - Option 1: Deprecate immediately (aggressive)
   - Option 2: 3-month transition period (conservative)
   - Option 3: Never remove (maintain dual system)

