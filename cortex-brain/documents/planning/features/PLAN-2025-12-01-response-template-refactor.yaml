#### 3. Onboarding Integration

**Enhanced Onboarding Flow:**

**Current Onboarding (3 questions):**
1. Experience level → Junior/Mid/Senior/Expert
2. Interaction mode → Autonomous/Guided/Educational/Pair
3. Tech stack → Azure/AWS/GCP/No preference/Custom

**Proposed Enhancement:**

**Question 2a: Response Detail Preference (NEW)**
```
How much detail do you prefer in responses?

1. Concise - Get to the point quickly (like Autonomous mode)
2. Balanced - Standard explanations with context (Default)
3. Verbose - Detailed explanations with examples (like Educational mode)

Note: This works with your interaction mode for optimal experience.
```

**Mapping:**
- **Concise** → Forces compact format regardless of mode
- **Balanced** → Uses mode default (Autonomous=compact, Guided=standard, etc.)
- **Verbose** → Forces extended format with "Why This Matters" sections

**Implementation:**

```python
# In UserProfileManager
def create_profile(
    self,
    interaction_mode: str,
    experience_level: str,
    response_detail: str = "balanced",  # NEW
    tech_stack_preference: Optional[Dict] = None
) -> bool:
    """
    Create user profile with response detail preference.
    
    Args:
        interaction_mode: autonomous, guided, educational, pair
        experience_level: junior, mid, senior, expert
        response_detail: concise, balanced, verbose (NEW)
        tech_stack_preference: Optional tech stack config
    """
    # Validate new field
    valid_details = ["concise", "balanced", "verbose"]
    if response_detail not in valid_details:
        raise ValueError(f"Invalid response_detail: {response_detail}")
    
    # Store in database
    self.db.execute("""
        INSERT INTO user_profile 
        (interaction_mode, experience_level, response_detail, tech_stack_preference)
        VALUES (?, ?, ?, ?)
    """, (interaction_mode, experience_level, response_detail, json.dumps(tech_stack_preference)))
```

