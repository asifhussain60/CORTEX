#### 2. Template Composer Engine

**New Class:** `src/utils/template_composer.py`

```python
class TemplateComposer:
    """
    Composes response templates dynamically based on user profile.
    
    Replaces YAML anchor inheritance with programmatic composition.
    """
    
    def __init__(self):
        self.components = self._load_yaml("response-base-components.yaml")
        self.templates = self._load_yaml("response-template-definitions.yaml")
        self.variants = self._load_yaml("response-profile-variants.yaml")
        self.routing = self._load_yaml("response-routing-rules.yaml")
        self.profile_manager = UserProfileManager()
        
    def compose_response(
        self, 
        template_id: str, 
        context: Dict[str, Any],
        user_profile: Optional[Dict] = None
    ) -> str:
        """
        Compose response with profile-aware template selection.
        
        Args:
            template_id: Template identifier (e.g., "onboarding")
            context: Template variables (operation, understanding_content, etc.)
            user_profile: Optional profile override (uses stored profile by default)
            
        Returns:
            Formatted response string ready for display
            
        Example:
            composer = TemplateComposer()
            response = composer.compose_response(
                "help_table",
                {
                    "operation": "Help",
                    "response_content": "Commands: help, plan, tdd...",
                    "context_summary": "[3 convs loaded, Quality: 8/10]"
                }
            )
        """
        # Get user profile
        profile = user_profile or self.profile_manager.get_profile()
        interaction_mode = profile.get("interaction_mode", "guided") if profile else "guided"
        experience_level = profile.get("experience_level", "mid") if profile else "mid"
        
        # Get template definition
        template = self.templates["templates"][template_id]
        
        # Get profile variant
        variant = self.variants["interaction_modes"][interaction_mode]
        
        # Build section list based on profile
        sections = self._build_section_list(template, variant)
        
        # Compose header
        header_format = variant["header_format"]
        header = self.components["header"][header_format].format(**context)
        
        # Compose sections
        composed_sections = []
        for section_name in sections:
            if section_name not in template["content"]:
                continue
                
            section_content = template["content"][section_name]
            
            # Apply experience level adjustments
            section_content = self._apply_experience_level(
                section_content, 
                experience_level
            )
            
            # Format section with component template
            section_config = self.components["sections"][section_name]
            section_format = section_config[variant["style"]]
            
            formatted_section = section_format.format(content=section_content)
            composed_sections.append(formatted_section)
        
        # Compose footer
        footer_format = variant.get("footer_format", "minimal")
        footer = self.components["footers"].get(footer_format, "")
        
        # Combine all parts
        response = "\n\n".join([
            header,
            *composed_sections,
            footer
        ])
        
        return response
    
    def _build_section_list(
        self, 
        template: Dict, 
        variant: Dict
    ) -> List[str]:
        """Build section list based on template + profile variant."""
        sections = []
        
        # Start with required sections
        sections.extend(template["sections_required"])
        
        # Add optional sections if allowed by variant
        for section in template.get("sections_optional", []):
            if section in variant["sections_include"]:
                sections.append(section)
        
        # Add additional sections from variant
        for section_name, section_config in variant.get("additional_sections", {}).items():
            position = section_config["position"]
            # Insert at position (after_challenge, after_next_steps, etc.)
            self._insert_at_position(sections, section_name, position)
        
        # Remove excluded sections
        for section in variant["sections_exclude"]:
            if section in sections:
                sections.remove(section)
        
        return sections
    
    def _apply_experience_level(
        self, 
        content: str, 
        level: str
    ) -> str:
        """Apply experience-level adjustments to content."""
        level_config = self.variants["experience_levels"][level]
        
        # For junior: Add more context
        if level == "junior" and level_config["context_depth"] == "high":
            # Add context markers for educational content
            pass
        
        # For expert: Remove verbose explanations
        if level == "expert" and level_config["context_depth"] == "minimal":
            # Strip verbose explanations
            pass
        
        return content
```

