    """
    One-time migration from legacy response-templates.yaml to modular system.
    
    Usage: python -m src.operations.migrate_templates
    """
    
    def migrate_templates():
        """Archive legacy file and validate new system."""
        legacy = brain_path / "response-templates.yaml"
        archive = brain_path / "archives" / "legacy-response-templates-v2.yaml"
        
        if legacy.exists():
            shutil.move(legacy, archive)
            logger.info(f"✅ Archived: {archive}")
        
        # Validate new files exist
        new_files = [
            "response-base-components.yaml",
            "response-template-definitions.yaml", 
            "response-profile-variants.yaml",
            "response-routing-rules.yaml"
        ]
        
        for file in new_files:
            if not (brain_path / file).exists():
                logger.error(f"❌ Missing: {file}")
                return False
        
        logger.info("✅ Migration complete - new template system active")
        return True
    ```

