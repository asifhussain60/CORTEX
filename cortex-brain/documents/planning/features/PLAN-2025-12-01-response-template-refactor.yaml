          "tests/response_templates/test_introduction_discovery_template.py"
      ]
      
      found_legacy = [p for p in legacy_paths if (project_root / p).exists()]
      
      return {
          "passed": len(found_legacy) == 0,
          "severity": "ERROR",
          "message": "Legacy response template code removed",
          "evidence": {
              "legacy_files_remaining": found_legacy,
              "count": len(found_legacy)
          }
      }
