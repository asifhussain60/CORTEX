# Response Template System Refactor - Comprehensive Plan

**Version:** 2.0  
**Date:** 2025-12-01  
**Author:** Asif Hussain  
**Status:** PLANNING

---

## Executive Summary

**Current State:**
- 2,669-line monolithic YAML file (response-templates.yaml)
- 18 minimal templates (reduced from 107)
- Template inheritance via YAML anchors (&standard_5_part_base)
- Hard-coded response styles in templates
- No dynamic template selection based on user profile

**Proposed State:**
- **Modular architecture** with 4 separate YAML files
- **Profile-driven template selection** using UserProfileManager
- **Dynamic template variants** per interaction mode (Autonomous, Guided, Educational, Pair)
- **Template composition engine** replacing YAML anchors
- **58% reduction** in configuration complexity (2,669 → 1,120 lines)

**Key Benefits:**
- ✅ User preference-driven responses (onboarding integration)
- ✅ Maintainable modular structure
- ✅ Preserved mandatory CORTEX header + author
- ✅ Flexible 3-section base format (header + response + next steps)
- ✅ Backward compatible with existing code

---

## Problem Analysis

### Current Architecture Issues

**1. Monolithic YAML File (2,669 lines)**
- **Issue:** Single file contains all templates, shared components, routing rules
- **Impact:** Difficult to navigate, high merge conflict risk, slow to parse
- **Evidence:** Lines 1-100 shared components, 100-2600 templates, 2600-2669 routing

**2. Template Inheritance Complexity**
- **Issue:** YAML anchors (&standard_5_part_base) require complex substitution logic
- **Impact:** Template engine must understand YAML anchor resolution before variable substitution
- **Evidence:** 3 base templates with <<: *standard_5_part_base inheritance

**3. Hard-Coded Response Styles**
- **Issue:** Each template specifies full structure regardless of user preference
- **Impact:** Cannot adapt to Autonomous (concise) vs Educational (verbose) modes
- **Evidence:** All templates use same 5-section structure

**4. No User Profile Integration**
- **Issue:** UserProfileManager exists with interaction modes, but templates don't use it
- **Impact:** Missed opportunity for personalized responses
- **Evidence:** grep shows only 2 matches for "interaction_mode" (in onboarding template)

**5. Duplicate Content Patterns**
- **Issue:** Same header/footer/section structures repeated across 18 templates
- **Impact:** 43% duplication (shared components exist but still verbose)
- **Evidence:** Lines 8-18 (standard_header), 20-40 (standard_5_part), 42-82 (tech_aware)

