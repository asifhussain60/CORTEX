## Risk Assessment

### High Risk

**1. Backward Compatibility with Existing Code**
- **Risk:** Orchestrators depend on legacy template format
- **Mitigation:** Keep legacy `response-templates.yaml` with deprecation warning
- **Fallback:** Feature flag to disable new system

**2. Production Deployment Failure**
- **Risk:** New gates block deployment or cause runtime errors
- **Mitigation:** 3 validation gates (17-19) + post-deployment smoke tests
- **Fallback:** Documented rollback procedure with git revert

### Medium Risk

**3. YAML Parsing Performance**
- **Risk:** 4 YAML files slower than 1 cached file
- **Mitigation:** Lazy loading + 24-hour cache (same as current)
- **Fallback:** Pre-compile YAMLs to Python dicts on startup

**4. CLI Enforcement Breaking Workflows**
- **Risk:** Startup validation blocks legitimate use cases
- **Mitigation:** Clear error messages with migration command
- **Fallback:** Feature flag `features.modular_templates: false`

**5. Legacy Code Removal Impact**
- **Risk:** Unknown dependencies on `src/response_templates/`
- **Mitigation:** Comprehensive grep search before deletion + archive files
- **Fallback:** Restore from `cortex-brain/archives/` if issues arise

### Low Risk

**6. User Confusion with 4 Preference Questions**
- **Risk:** Users overwhelmed by onboarding
- **Mitigation:** Make response_detail optional with smart defaults
- **Fallback:** Skip Question 2a, infer from interaction_mode

