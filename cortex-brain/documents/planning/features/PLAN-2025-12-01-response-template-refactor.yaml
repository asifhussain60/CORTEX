## Rollback Plan

**If critical issues arise during deployment:**

### Level 1: Feature Flag Disable (5 minutes)
```yaml
# cortex.config.json - Emergency rollback
features:
  modular_templates: false  # Reverts to legacy system
```
- **Impact:** Immediate reversion to `response-templates.yaml`
- **Data Loss:** None (user profiles preserved)
- **User Experience:** No response_detail customization

### Level 2: Git Revert (15 minutes)
```bash
# Restore legacy files from CORTEX-3.0 branch
cd /path/to/CORTEX

# 1. Restore legacy YAML
git checkout CORTEX-3.0 -- cortex-brain/response-templates.yaml

# 2. Restore legacy module
git checkout CORTEX-3.0 -- src/response_templates/

# 3. Restore legacy tests
git checkout CORTEX-3.0 -- tests/response_templates/

# 4. Commit restoration
git add -A
git commit -m "ROLLBACK: Restore legacy response template system"

# 5. Deploy with validation skip (known legacy state)
python scripts/deploy_cortex.py --skip-validation
```
- **Impact:** Full rollback to pre-refactor state
- **Data Loss:** None (archives preserved)
- **User Experience:** Reverts to old 5-part structure

### Level 3: Branch Rollback (30 minutes)
```bash
# If main branch is broken, rollback entire deployment
cd /path/to/CORTEX

# 1. Find last good commit
git log --oneline main | head -n 10

# 2. Revert to last good state
git revert <bad-commit-hash>

# 3. Force push (CAUTION: Coordination required)
git push origin main --force

# 4. Notify users
# Create GitHub issue with rollback details
```
- **Impact:** Full deployment rollback
- **Data Loss:** Potential (if users cloned during window)
- **User Experience:** Temporary unavailability

### Gradual Rollout Option (Safest)

**Week 1: Internal Testing**
- Enable for dev team only (10 users)
- Monitor error logs, performance metrics
- Fix issues before broader rollout

**Week 2: Limited Release (10%)**
```yaml
features:
  modular_templates: true
  rollout_percentage: 10
```
- Random 10% of user base
- Monitor feedback, composition time
- Rollback feature flag if >5% error rate

**Week 3: Majority Release (50%)**
```yaml
features:
  modular_templates: true
  rollout_percentage: 50
```
- Expand to 50% of users
- Confidence threshold met (error rate <2%)

**Week 4: Full Release (100%)**
```yaml
features:
  modular_templates: true
  rollout_percentage: 100
```
- All users on new system
- Legacy files archived permanently

**Rollback Triggers:**
- ❌ Composition time >100ms (2x target)
- ❌ Error rate >5% (template rendering failures)
- ❌ User complaints >10 (profile issues)
- ❌ Critical security issue discovered
- ❌ Data corruption in user_profile table

**Post-Rollback Actions:**
1. Create incident report in `cortex-brain/documents/reports/`
2. Update plan with root cause analysis
3. Fix issues in feature branch
4. Re-deploy with enhanced validation gates

