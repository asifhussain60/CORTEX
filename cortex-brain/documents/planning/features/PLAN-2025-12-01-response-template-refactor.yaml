#### 4. Template Selection Logic

**Enhanced Selection Algorithm:**

```python
class TemplateSelector:
    """
    Selects appropriate template based on user intent and profile.
    """
    
    def select_template(
        self, 
        user_message: str,
        profile: Optional[Dict] = None
    ) -> Tuple[str, Dict]:
        """
        Select template ID and variant configuration.
        
        Args:
            user_message: User's input message
            profile: User profile with interaction_mode, response_detail
            
        Returns:
            (template_id, variant_config)
            
        Example:
            selector = TemplateSelector()
            template_id, variant = selector.select_template(
                "help",
                {"interaction_mode": "autonomous", "response_detail": "concise"}
            )
            # Returns: ("help_table", {"style": "compact", "sections": ["response"]})
        """
        # Step 1: Detect intent (exact match, fuzzy match, fallback)
        template_id = self._detect_intent(user_message)
        
        # Step 2: Load base variant from profile
        if profile:
            interaction_mode = profile.get("interaction_mode", "guided")
            response_detail = profile.get("response_detail", "balanced")
        else:
            interaction_mode = "guided"
            response_detail = "balanced"
        
        # Step 3: Get variant configuration
        variant = self._get_variant(interaction_mode, response_detail)
        
        return template_id, variant
    
    def _get_variant(
        self, 
        interaction_mode: str, 
        response_detail: str
    ) -> Dict:
        """
        Get variant configuration with response detail override.
        """
        # Load base variant from interaction mode
        base_variant = self.variants["interaction_modes"][interaction_mode]
        
        # Apply response detail override
        if response_detail == "concise":
            # Force compact format
            base_variant["style"] = "compact"
            base_variant["sections_include"] = ["response", "next_steps"]
            base_variant["header_format"] = "compact"
            
        elif response_detail == "verbose":
            # Force extended format
            base_variant["style"] = "extended"
            base_variant["verbosity"] = "detailed"
            # Add educational sections if not present
            if "why_matters" not in base_variant["sections_include"]:
                base_variant["sections_include"].append("why_matters")
        
        # balanced uses mode defaults
        
        return base_variant
```

