        name: "Enhanced Cleanup CLI - Path Reference Updates"
        description: "Update cleanup CLI to search and update file path references during reorganization"
        challenge_raised: true
        challenge_details: |
          CHALLENGE: When cleanup reorganizes files (e.g., moves deprecated code to archives/), 
          other files may still reference old paths, causing import errors and broken functionality.
          SOLUTION: Add path reference scanner and updater to cleanup CLI:
          - Scan all Python files for import statements
          - Detect references to files being moved/renamed
          - Automatically update imports to new paths
          - Generate report of updated references
          - Support dry-run mode to preview changes before applying
        files_affected:
          - "src/orchestrators/holistic_cleanup_orchestrator.py"
          - "src/utils/path_reference_scanner.py (new)"
          - "src/utils/import_updater.py (new)"
          - "scripts/cleanup/update_path_references.py (new)"
          - "tests/utils/test_path_reference_scanner.py (new)"
        acceptance_criteria:
          - "Path scanner detects all import statements in Python files"
          - "Scanner identifies references to files being moved"
          - "Updater rewrites imports with new paths (relative/absolute)"
          - "Dry-run mode shows preview without modifying files"
          - "Generated report lists all updated references"
          - "Supports undo operation (backup original files)"
          - "Integrated into cleanup workflow (automatic step)"
        estimated_effort: "10 hours"
        
      - id: "8.4"
        name: "Patch Release Deployment Strategy"
        description: "Implement hot-fix/patch release system for incremental updates without full reinstall"
        challenge_raised: true
        challenge_details: |
          CHALLENGE: Current deployment always publishes complete CORTEX package. For bug fixes
          or small feature additions, users must re-setup entirely. This is heavyweight and risky.
          SOLUTION: Add patch release capability to deployment system:
          - Version format: X.Y.Z where Z = patch number
          - Patch release includes only changed files + manifest
          - Manifest specifies file operations (add/update/delete)
          - Users run 'cortex patch apply' to incrementally update
          - Rollback support: 'cortex patch rollback <version>'
          - Validation: Verify patch applies cleanly before committing
        files_affected:
          - "scripts/deploy_cortex.py"
          - "scripts/patch_builder.py (new)"
          - "src/orchestrators/patch_orchestrator.py (new)"
          - "cortex-brain/patches/ (new directory)"
          - "tests/orchestrators/test_patch_orchestrator.py (new)"
        acceptance_criteria:
          - "Patch builder detects changed files since last release"
          - "Patch manifest includes: version, files changed, operations, checksums"
          - "Patch orchestrator validates current version before applying"
          - "Apply operation updates only changed files (preserves brain data)"
          - "Rollback operation restores previous file versions"
          - "Patch release tagged in git: vX.Y.Z-patch"
          - "Users can list available patches: 'cortex patch list'"
          - "Automated testing validates patch applies/rolls back correctly"
