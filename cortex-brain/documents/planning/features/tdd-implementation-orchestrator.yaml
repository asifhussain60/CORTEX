# ==================== RISKS & MITIGATIONS ====================
risks:
  - risk: "Refactoring breaks existing tests"
    mitigation: "Rollback capability via git checkpoints, incremental refactoring with re-test after each change"
    
  - risk: "Duplicate detection too slow"
    mitigation: "Scope analysis limits files, use efficient algorithms (AST-based), cache results"
    
  - risk: "SOLID validation false positives"
    mitigation: "Allow user override, tune validation rules, provide clear explanations"
    
  - risk: "Integration complexity with PlanExecutionOrchestrator"
    mitigation: "Clear interface definition, integration tests, incremental rollout"
    
  - risk: "Out-of-scope blocker detection misses critical issues"
    mitigation: "Conservative detection (flag anything suspicious), manual review option"

