- id: AC-DEBT-008
  title: Aggregate Test Evidence Into Unified Bundle
  description: |
    Problem: Test results scattered across pytest output, audit logs, orchestrator
    stdout. No unified evidence view. Validation operator must manually aggregate.
    
    Solution:
    1. Create evidence-aggregator tool
    2. Query all sources (pytest, audit logs, orchestrator output)
    3. Produce unified evidence bundle (JSON)
    4. Include: test count, passing/failing, coverage %, timestamps
    5. Sign bundle (hash for integrity verification)
    
    Acceptance Criteria:
    - evidence-aggregator tool created
    - Aggregates from pytest, audit, orchestrator
    - Produces signed evidence bundle
    - Tests: run tests, generate bundle, verify completeness
  status: planned
  priority: high
  phase: 2
  category: testing
  tests:
