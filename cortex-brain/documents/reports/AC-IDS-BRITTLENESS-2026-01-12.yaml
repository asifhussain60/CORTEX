- id: AC-DEBT-012
  title: Calculate Phase Completion % from Evidence (Not Metadata)
  description: |
    Problem: Completion % calculated as completed_ac_ids / total_ac_ids.
    If AC-ID "implemented" but tests failing, % still counts it.
    
    Solution:
    1. Change calculation to: passing_test_count / total_tests
    2. Query test results (from pytest or audit logs)
    3. Update tracker % on every test run
    4. Block phase advance if % < gate threshold (80%)
    
    Acceptance Criteria:
    - Completion % now evidence-based
    - Updated after each test run
    - Phase advance blocked if % < 80%
    - Tests: run failing tests, verify % decreases
  status: planned
  priority: medium
  phase: 2
  category: observability
  tests:
  - tests/orchestrators/test_phase_completion_percentage.py
  dependencies:
  - AC-DEBT-007
  estimatedEffort: 6
  effort_unit: hours
  owner: TodoManager
  riskIfUnfixed: medium

- id: AC-DEBT-013
  title: Add Correlation ID Index for Audit Logs
  description: |
    Problem: Audit logs JSONL but no index. Querying "all logs for orchestrator
    run XYZ" requires full scan. No fast correlation ID lookup.
    
    Solution:
    1. Create audit log index (SQLite or RocksDB)
    2. Key: correlation_id, value: list of log line numbers
    3. Query time: O(log N) instead of O(N)
    4. Update index on every audit log write
    5. Add audit query tool: query_audit_by_correlation_id()
    
    Acceptance Criteria:
    - Audit index implemented
    - Queries fast (< 100ms for 10k logs)
    - Tests: create logs, query by correlation ID, verify results
  status: planned
  priority: medium
  phase: 3
  category: observability
  tests:
  - tests/infrastructure/test_audit_index.py
  dependencies:
  - AC-AUDIT-007
  estimatedEffort: 6
  effort_unit: hours
  owner: EnterpriseAuditLogger
  riskIfUnfixed: medium

- id: AC-DEBT-014
  title: Add Smoke Tests for Critical Paths (Governance, Routing, Lifecycle)
  description: |
    Problem: Governance merge, pattern routing, phase lifecycle untested by
    integration tests. Single rule change breaks entire routing → discovered in production.
    
    Solution:
    1. Add smoke test: test_governance_merge_smoke
       - Load all tier YAML files, verify no parse errors
       - Merge tiers, verify precedence correct
    2. Add smoke test: test_routing_smoke
       - Test 20+ common intents, verify routes to correct orchestrator
    3. Add smoke test: test_phase_lifecycle_smoke
       - Create phase, transition states, verify state machine correct
    4. Run smoke tests on every commit (pre-commit hook)
    
    Acceptance Criteria:
    - 3 smoke tests implemented
    - All common intents routed correctly
    - Phase state transitions correct
    - Tests run in <10 seconds (fast feedback)
  status: planned
