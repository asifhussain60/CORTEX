# RELIABILITY & STATE CONSISTENCY ISSUES (AC-RISK-008 to AC-RISK-013)

- id: AC-RISK-008
  title: Create Plan-Viewer Canonical Data Source
  description: |
    Problem: plan-viewer.html synced from progress-tracker.json via manual
    sync_plan_viewer_data.py script. No atomic writes. If sync forgotten or script fails,
    HTML and tracker drift → dashboard shows wrong phase status.
    
    Solution:
    Create cortex-brain/registry/plan-viewer-data.json as canonical source:
    1. progress-tracker.json writes to plan-viewer-data.json (atomic + backup)
    2. plan-viewer.html reads ONLY from plan-viewer-data.json
    3. Remove hardcoded values from HTML (all from JSON)
    4. Validate sync on startup (file hash check)
    5. Implement drift detection (plan-viewer reads tracker, compares to registry)
    
    Acceptance Criteria:
    - plan-viewer-data.json created and maintains AC-ID list
    - Atomic writes (backup before write, verify after)
    - plan-viewer.html reads all data from JSON (no hardcoded values)
    - Sync script validates both sources match (hash comparison)
    - On mismatch, log warning and repair (tracker is authoritative)
    - Tests: verify no hardcoded values in HTML, verify atomic writes
  status: planned
  priority: critical
  phase: 2
  category: reliability
  tests:
  - tests/integration/test_plan_viewer_sync.py
  - tests/quality/test_plan_viewer_html_validation.py
  dependencies:
  - AC-TODO-002
  estimatedEffort: 16
  effort_unit: hours
  owner: MasterOrchestrator
  riskIfUnfixed: critical

- id: AC-RISK-009
  title: Add TodoManager Task Persistence (todo.db)
  description: |
    Problem: TodoManager stores tasks in-memory only. On orchestrator restart,
    all tasks lost. No recovery mechanism → phase must repeat from beginning.
    
    Solution:
    Create cortex-brain/state/todo.db (SQLite):
    1. TodoManager persists tasks on creation and state changes
    2. On startup, load tasks from DB
    3. Implement atomic writes (WAL mode + backup)
    4. Task recovery: if task incomplete on restart, retry with exponential backoff
    5. Periodic cleanup: archive completed tasks after 7 days
    
    Acceptance Criteria:
    - todo.db created and tasks persisted
    - Tasks loaded on TodoManager init
    - Atomic writes with no corruption risk
    - Restart recovery works (incomplete tasks retry)
    - Tests: simulate restart, verify tasks loaded; corrupt DB, verify recovery
  status: planned
  priority: critical
  phase: 2
  category: reliability
  tests:
  - tests/orchestrators/test_todo_persistence.py
  - tests/quality/test_state_recovery.py
  dependencies:
  - AC-TODO-002
  estimatedEffort: 12
  effort_unit: hours
  owner: TodoManager
  riskIfUnfixed: critical

