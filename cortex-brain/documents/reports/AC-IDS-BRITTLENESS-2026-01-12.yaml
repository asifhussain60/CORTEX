- id: AC-RISK-011
  title: Add Rollback on Phase Failure
  description: |
    Problem: Phase execution writes artifacts (code, tests, docs) before DoD validation.
    If DoD fails, artifacts left in inconsistent state. Phase retry uncertain (idempotent or not?).
    
    Solution:
    1. Snapshot workspace before phase start (files, directories, DB state)
    2. On phase failure, restore snapshot (atomic rollback)
    3. Test rollback: simulate failure mid-phase, verify workspace cleaned
    4. Log rollback action to audit trail (what was rolled back, why)
    
    Acceptance Criteria:
    - Workspace snapshot taken before phase.start()
    - Rollback implemented as atomic restore
    - Phase failure triggers rollback
    - Tests: simulate failure, verify rollback works
  status: planned
  priority: high
  phase: 2
  category: reliability
  tests:
  - tests/orchestrators/test_phase_rollback.py
  estimatedEffort: 8
  effort_unit: hours
  owner: MasterOrchestrator
  riskIfUnfixed: high

- id: AC-RISK-012
  title: Harden SQLite Concurrency (WAL + Advisory Locks)
  description: |
    Problem: planning.db uses WAL mode but allows multiple simultaneous writers.
    Corruption risk: power loss during write, truncated WAL file, race conditions.
    
    Solution:
    1. Implement advisory locks (SQLite `BEGIN EXCLUSIVE` before writes)
    2. Backup DB before every write operation (copy to .backup file)
    3. Verify WAL integrity on startup (check WAL header + CRC)
    4. Implement write timeout + retry (exponential backoff)
    
    Acceptance Criteria:
    - Advisory locks prevent concurrent writes
    - DB backups created before writes
    - WAL integrity validated on startup
    - Tests: simulate concurrent writes, verify no corruption
  status: planned
  priority: high
  phase: 2
  category: reliability
  tests:
  - tests/infrastructure/test_sqlite_concurrency.py
  dependencies:
  - AC-STATE-002
  estimatedEffort: 8
  effort_unit: hours
  owner: StateManager
  riskIfUnfixed: high

