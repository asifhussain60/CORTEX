# SCALABILITY & PERFORMANCE (AC-PERF-003 to AC-PERF-004)

- id: AC-PERF-003
  title: Implement Knowledge Graph Caching
  description: |
    Problem: Every orchestrator invocation may scan entire workspace
    (knowledge graph queries). Repeated scans on same data → high latency → timeouts.
    
    Solution:
    1. Cache knowledge graph in-memory (invalidate on file change)
    2. Use file watcher (watchdog library) to detect file changes
    3. On change, invalidate cache + rebuild
    4. TTL: 1 hour (or force refresh on demand)
    
    Acceptance Criteria:
    - Cache implemented
    - Invalidates on file change
    - TTL enforced
    - Tests: cache hit/miss, verify performance improvement
  status: planned
  priority: medium
  phase: 3
  category: performance
  tests:
  - tests/tools/test_knowledge_graph_caching.py
  estimatedEffort: 6
  effort_unit: hours
  owner: KnowledgeGraphCrawler
  riskIfUnfixed: medium

- id: AC-PERF-004
  title: Implement Audit Log Rotation & Archival
  description: |
    Problem: Audit logs (JSONL) append-only, unbounded growth.
    After 1 month: 500MB+. Disk full risk.
    
    Solution:
    1. Implement log rotation (daily rollover)
    2. Compress old logs (gzip)
    3. Archive to cold storage (S3 or local archive/)
    4. Keep 30 days hot logs, 1 year cold storage
    5. Add cleanup job (delete >1 year old)
    6. Monitor disk usage, alert at >90%
    
    Acceptance Criteria:
    - Logs rotate daily
    - Old logs compressed + archived
    - Retention policy enforced
    - Cleanup job runs daily
    - Tests: create logs, verify rotation, verify cleanup
  status: planned
  priority: medium
  phase: 3
  category: performance
  tests:
  - tests/infrastructure/test_audit_log_rotation.py
  estimatedEffort: 8
  effort_unit: hours
  owner: EnterpriseAuditLogger
  riskIfUnfixed: medium
