  owner: TDD-Master
  riskIfUnfixed: high

- id: AC-DEBT-009
  title: Validate Verification Rate Against Actual Tests
  description: |
    Problem: Phase 1 verification rate (88.24%) claimed but not validated
    against actual passing tests. Metadata may drift from reality.
    
    Solution:
    1. Implement verification-validator tool
    2. Query actual test results (pytest database or logs)
    3. Calculate true verification % = passing_tests / total_tests
    4. Compare to claimed % in tracker
    5. If drift > 5%, log warning and update tracker
    
    Acceptance Criteria:
    - Verification validator implemented
    - Compares claimed vs actual %
    - Updates tracker if drift detected
    - Tests: set claim to 90%, run tests that give 85%, verify detected
  status: planned
  priority: high
  phase: 2
  category: testing
  tests:
  - tests/orchestrators/test_verification_validation.py
  dependencies:
  - AC-DEBT-007
  estimatedEffort: 6
  effort_unit: hours
  owner: TodoManager
  riskIfUnfixed: high

