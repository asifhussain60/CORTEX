# SECURITY & SECRETS (AC-SEC-004 to AC-SEC-006)

- id: AC-SEC-004
  title: Redact Secrets from Audit Logs
  description: |
    Problem: Audit logs (JSONL) store full governance rule evaluation context.
    If rule checks for API keys, auth patterns, or secrets → logged in plaintext
    → accessible to all users.
    
    Solution:
    1. Define sensitive patterns (API_KEY, password, token, secret, etc.)
    2. Before logging context, scan for sensitive fields
    3. Replace sensitive values with [REDACTED] placeholder
    4. Log original field name + redaction reason (for debugging)
    5. Add audit category for redaction events (AuditCategory.SECURITY)
    
    Acceptance Criteria:
    - Secrets redacted in all audit logs
    - Sensitive patterns detected and replaced
    - Redaction logged with reason
    - Tests: log context with secret, verify redacted in audit trail
  status: planned
  priority: high
  phase: 2
  category: security
  tests:
  - tests/infrastructure/test_audit_secrets_redaction.py
  dependencies:
  - AC-AUDIT-007
  estimatedEffort: 6
  effort_unit: hours
  owner: EnterpriseAuditLogger
  riskIfUnfixed: high

- id: AC-SEC-005
  title: Encrypt Planning Database at Rest
  description: |
    Problem: planning.db readable by all processes on same machine.
    If workstation compromised, attacker reads full plan state
    (includes secrets, orchestration logic, AC-ID details).
    
    Solution:
    1. Use SQLCipher for encryption at rest
    2. Implement key management (store password securely, e.g., environment variable)
    3. Test encryption/decryption on open
    4. Add pre-commit hook: verify DB encrypted (check magic bytes)
    
    Acceptance Criteria:
    - planning.db encrypted with SQLCipher
    - Password required to open
    - Tests: encrypt, close, reopen, verify data readable
  status: planned
  priority: medium
  phase: 2
  category: security
  tests:
  - tests/infrastructure/test_db_encryption.py
  estimatedEffort: 6
  effort_unit: hours
  owner: StateManager
  riskIfUnfixed: medium

- id: AC-SEC-006
  title: Audit Log Rotation & Retention Policy
  description: |
    Problem: Audit logs (JSONL) append-only, unbounded growth.
    After 1 month: 500MB+. Disk full risk. Old logs not cleaned.
    
    Solution:
    1. Implement log rotation (daily, compress old files)
    2. Define retention policy: 30 days hot, 1 year cold storage
    3. Archive old logs to cold storage (S3, compressed tar)
    4. Add cleanup job (delete logs >1 year old)
    5. Monitor disk usage, alert if >90%
    
    Acceptance Criteria:
    - Logs rotate daily
    - Old logs compressed + archived
    - Retention policy enforced
    - Tests: create logs, verify rotation, verify cleanup
  status: planned
  priority: medium
  phase: 2
  category: security
  tests:
  - tests/infrastructure/test_audit_log_rotation.py
  estimatedEffort: 6
  effort_unit: hours
  owner: EnterpriseAuditLogger
  riskIfUnfixed: medium

