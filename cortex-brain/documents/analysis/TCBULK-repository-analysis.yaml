# ==================== PROJECT PURPOSE ====================
project_purpose:
  main_application:
    name: Transit Card Management System (HQY.TCCARD)
    domain: Transportation/Finance
    purpose: |
      Enterprise web application for managing transit cards (similar to metro/bus cards).
      Provides card lifecycle management, payment processing, account management,
      and financial reporting capabilities.
      
    key_capabilities:
      - Card issuance and activation
      - Card balance management (load/unload)
      - Transaction processing and history
      - Card replacement for lost/damaged cards
      - Payment processing integration
      - User account management
      - Role-based access control
      - Email notifications
      - Financial reporting
      - Card transfers between accounts
      
    business_model:
      - Transit card provider
      - Payment gateway integration
      - Multi-user system with roles
      - External API sessions
      - PAN-to-proxy card mapping
      
  ai_assistant:
    name: CORTEX
    purpose: |
      Cognitive enhancement system for GitHub Copilot providing long-term memory,
      pattern learning, and strategic planning capabilities. Acts as persistent
      brain architecture that remembers conversations, learns from project patterns,
      and protects against suboptimal decisions.
      
    integration: Embedded in TCBULK repository to assist with HQY.TCCARD development
    
