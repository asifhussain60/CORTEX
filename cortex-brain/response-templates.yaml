    name: Policy Validation
    triggers:
    - validate policies
    - check compliance
    - policy validation
    - policy check
    - compliance check
    - validate against policies
    response_type: detailed
    operation_name: Policy Validation
    understanding_content: You want CORTEX to validate itself against your organization's
      policies and coding standards.
    challenge_content: No Challenge - Policy validation ensures CORTEX aligns with
      your team's requirements and best practices.
    response_content: "**Policy Validation System**\n\nCORTEX will scan for policy\
      \ documents in your repository and validate its configuration and implementation\
      \ against your standards.\n\n**What Gets Validated:**\n\n✅ **Naming Conventions**\
      \ (25% weight)\n   • PascalCase for classes\n   • snake_case for functions/variables\n\
      \   • UPPER_CASE for constants\n   • Descriptive names (min 3 chars)\n\n✅ **Security\
      \ Practices** (35% weight)\n   • No hardcoded credentials\n   • Environment\
      \ variables for secrets\n   • Input validation present\n   • Encryption at rest/transit\n\
      \n✅ **Code Standards** (25% weight)\n   • Docstrings for public functions\n\
      \   • Test coverage ≥70%\n   • Linter compliance\n   • Cyclomatic complexity\
      \ <10\n\n✅ **Architecture Patterns** (15% weight)\n   • SOLID principles\n \
      \  • Separation of concerns\n   • Error handling\n   • Max 50 lines per function\n\
      \n**Policy Search Locations:**\n• `.github/policies/` (recommended)\n• `docs/policies/`\n\
      • `policies/`\n• `POLICIES.yaml`, `POLICIES.json`, `POLICIES.md`\n\n**If No\
      \ Policies Found:**\nCORTEX can create a starter policy template with sensible\
      \ defaults covering all 4 validation categories.\n\n**Compliance Reporting:**\n\
      • Overall compliance percentage (0-100%)\n• Violations categorized by severity\
      \ (Critical/Warning/Info)\n• Specific recommendations for each violation\n•\
      \ Report saved to `cortex-brain/documents/reports/policy-compliance.md`\n\n\
      **Critical Violations:**\nSetup will pause if critical violations detected (e.g.,\
      \ hardcoded secrets, missing security practices). You can choose to:\n• Fix\
      \ violations and retry\n• Continue anyway (not recommended)\n• Skip policy validation\n"
    request_echo_content: Validate CORTEX configuration against organizational policies
    next_steps_content: '1. CORTEX will scan for policy documents (7 locations)

      2. If policies found → Run validation across 4 categories

      3. If no policies → Offer to create starter template

      4. Generate compliance report with recommendations

      5. Pause for critical violations (requires confirmation)


      **To start validation:**

      • Say "validate policies" or "check compliance"

      • During setup: Policy validation runs automatically in Phase 3.5


      **Expected output:**

      • Compliance percentage (e.g., 87.5%)

      • Violation count by severity

      • Detailed report path

      • Next steps for remediation

      '
