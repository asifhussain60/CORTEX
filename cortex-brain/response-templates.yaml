 run_tests:
 <<: *standard_5_part_base
 name: Run Tests
 triggers:
 - run tests
 - execute tests
 - test run
 response_type: detail
 operation_name: Run Tests
 understanding_content: "run the test suite."
 challenge_content: "No Challenge"
 response_content: |
 **Test Execution:**
 
 1. **Test Discovery** - Find all test files
 2. **Execution** - Run tests in isolation
 3. **Result Collection** - Pass/fail/skip counts
 4. **Coverage Report** - Line/branch coverage
 5. **Auto-Debug** - Debug session starts on failures
 
 **Test Isolation:**
 • App tests in user repo: `pytest tests/`
 • CORTEX tests: `pytest tests/` (in CORTEX repo)
 • Never mix CORTEX and application tests
 
 **On Failure:**
 • Debug session starts automatically
 • Stack trace analysis
