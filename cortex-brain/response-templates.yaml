    understanding_content: You want to deploy CORTEX to the publish branch with full validation
    challenge_content: 'Deployment Risk - 19 validation gates must pass before publish'
    response_content: |
      ## 🚀 CORTEX Publish Branch Deployment
      
      **Production deployment** with 19 comprehensive validation gates
      
      **Deployment Pipeline:**
      
      **Phase 1: Pre-Deployment Validation (Gates 1-10)**
      1. Version consistency check
      2. Brain database integrity
      3. Test suite execution (100% pass required)
      4. Documentation completeness
      5. Response template validation
      6. Brain protection rules verification
      7. Configuration file validation
      8. Import dependency check
      9. SKULL rule compliance
      10. Performance benchmark
      
      **Phase 2: Deployment Execution (Gates 11-15)**
      11. Git branch validation
      12. Commit history verification
      13. Merge conflict detection
      14. Branch protection bypass
      15. Push to publish branch
      
      **Phase 3: Post-Deployment Validation (Gates 16-19)**
      16. Publish branch integrity
      17. Deployment verification
      18. Rollback preparation
      19. Telemetry initialization
      
      **Deployment Safety:**
      - ✅ Automatic rollback on any gate failure
      - ✅ Git checkpoint before deployment
      - ✅ Full system backup
      - ✅ Admin-only operation (context detection)
      
      **Success Criteria:** All 19 gates pass + zero critical issues
    request_echo_content: Deploy CORTEX to publish branch with full validation
    next_steps_content: |
      **Deployment Commands:**
      
      1. Say "deploy cortex" to start full deployment
      2. Say "deploy dry-run" to validate without deploying
      3. Say "deploy status" to check deployment readiness
      
      ⚠️ **Admin Only:** This operation requires admin context

