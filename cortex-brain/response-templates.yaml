    - rollback to
    - restore to checkpoint
    - undo to checkpoint
    - revert to checkpoint
    response_type: detailed
    expected_orchestrator: RollbackOrchestrator
    handler: src.orchestrators.rollback_orchestrator.RollbackOrchestrator
    understanding_content: You want to rollback your repository to a previous checkpoint
      created during TDD workflow (pre-work, tdd-red, tdd-green, refactoring, post-work).
    challenge_content: No Challenge - Rollback will validate checkpoint exists, check
      for uncommitted changes, show diff preview, and require confirmation before
      executing.
    response_content: "**Rollback Workflow Steps:**\n   \n   1. **Checkpoint Validation**\
      \ - Verify checkpoint exists in PhaseCheckpointManager\n   2. **Safety Checks**\
      \ - Detect uncommitted changes and merge conflicts\n   3. **Preview Changes**\
      \ - Show git diff of changes to be discarded\n   4. **User Confirmation** -\
      \ Require explicit 'yes' confirmation\n   5. **Execute Rollback** - Run git\
      \ reset --hard to checkpoint\n   \n   **Safety Features:**\n   • Blocks rollback\
      \ if uncommitted changes exist\n   • Blocks rollback if merge in progress\n\
      \   • Shows diff preview before confirmation\n   • Dry-run mode (--dry-run)\
      \ for preview without execution\n   • Force mode (--force) to bypass safety\
      \ checks (DANGER: loses changes)\n   \n   **Checkpoint Types:**\n   • pre-work\
      \ - Before starting feature work\n   • tdd-red - After writing failing test\n\
      \   • tdd-green - After making test pass\n   • refactoring - After code cleanup\n\
      \   • post-work - After completing feature"
    request_echo_content: Rollback to previous checkpoint
    next_steps_content: "**Execution Options:**\n   \n   1. **Safe Rollback** - Say\
      \ \"rollback to <checkpoint-id>\" for full safety workflow\n   2. **Preview\
      \ Only** - Say \"rollback to <checkpoint-id> --dry-run\" to see diff without\
      \ executing\n   3. **Force Rollback** - Say \"rollback to <checkpoint-id> --force\"\
      \ to bypass safety (⚠️ loses uncommitted changes)\n   \n   **Finding Checkpoints:**\n\
      \   • Say \"list checkpoints\" to see available checkpoint IDs\n   • Checkpoint\
      \ IDs follow format: phase-YYYYMMDD-HHMMSS (e.g., tdd-green-20251129-140000)\n\
      \   \n   **Resolution Tips:**\n   • If uncommitted changes block rollback: commit\
      \ or stash first\n   • If merge in progress: complete merge or abort with \"\
      git merge --abort\"\n   \n   Ready to rollback? Provide checkpoint ID or say\
      \ \"list checkpoints\" to see options."
