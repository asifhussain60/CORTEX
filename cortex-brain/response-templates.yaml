    request_echo_content: Perform automated risk analysis on feature plan
    next_steps_content: |
      **Risk Mitigation Options:**
      
      1. **Address HIGH severity risks first** - These block execution
      2. **Review remediation plan** - If DoR incomplete, CORTEX generates remediation steps
      3. **Update plan** - Mark DoR fields as complete after addressing risks
