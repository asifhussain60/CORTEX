    understanding_content: You want to learn CORTEX through hands-on practice with real feature implementation
    challenge_content: 'No Challenge - Clear learning path with practical exercises'
    response_content: |
      ## 🎓 CORTEX Hands-On Tutorial System
      
      **Interactive learning program:** Build real features while learning CORTEX capabilities
      
      **Tutorial Modes:**
      
      1. **Quick Tutorial (15 min)** - Core concepts only
         - Feature discovery and validation
         - Response template system
         - Basic alignment checks
      
      2. **Standard Tutorial (30 min)** - Production-ready workflow
         - User authentication feature (complete implementation)
         - TDD workflow (RED → GREEN → REFACTOR)
         - Git checkpoint automation
         - Test generation and execution
      
      3. **Comprehensive Tutorial (60 min)** - Full CORTEX mastery
         - Everything in Standard +
         - Planning System 2.0 with Vision API
         - Dashboard analytics
         - Team telemetry integration
         - Production deployment
      
      **Learning Outcomes:**
      - ✅ Understand 4-tier brain architecture
      - ✅ Master TDD Mastery workflow
      - ✅ Use Planning System 2.0 with DoR/DoD
      - ✅ Leverage dashboard for visual analytics
      - ✅ Deploy production-ready code
      
      **Tutorial Features:**
      - Real code (not mock examples)
      - Automated validation checks
      - Progress tracking
      - Rollback capability
      - Certificate of completion
    request_echo_content: Start interactive hands-on tutorial to learn CORTEX
    next_steps_content: |
      **Choose Tutorial Mode:**
      
      1. Say "tutorial quick" for 15-min core concepts
      2. Say "tutorial standard" for 30-min production workflow
      3. Say "tutorial comprehensive" for 60-min full mastery
      
      **Or:** Say "tutorial" to start with recommended standard mode

  cleanup:
