    understanding_content: You want to clean up obsolete files, temporary data, and optimize CORTEX storage
    challenge_content: 'No Challenge - Safe cleanup with automatic backup'
    response_content: |
      ## 🧹 CORTEX System Cleanup
      
      **Automated cleanup orchestration** across multiple categories
      
      **Cleanup Targets:**
      
      1. **Obsolete Code** (deprecated modules, unused files)
         - Auto-detection via ObsoleteCodeDetector
         - Safe removal with backup
         - Dependency analysis
      
      2. **Temporary Files** (logs, cache, temp data)
         - Log files older than 30 days
         - Cache entries expired
         - Temporary processing files
      
      3. **Test Artifacts** (old test results, coverage reports)
         - Archived test outputs
         - Stale coverage data
         - Benchmark results
      
      4. **Documentation Duplicates** (redundant docs, old versions)
         - Duplicate detection
         - Version consolidation
         - Broken link removal
      
      **Cleanup Modes:**
      - **Dry Run:** Preview changes without deletion
      - **Safe Mode:** Backup before deletion (default)
      - **Aggressive:** Maximum cleanup with space recovery
      
      **Safety Features:**
      - ✅ Automatic backup to cortex-brain/archives/
      - ✅ Rollback capability
      - ✅ Dependency validation
      - ✅ User confirmation for critical deletions
    request_echo_content: Run system cleanup to remove obsolete files and optimize storage
    next_steps_content: |
      **Cleanup Options:**
      
      1. Say "cleanup dry-run" to preview what will be deleted
      2. Say "cleanup safe" for cleanup with backup (recommended)
      3. Say "cleanup aggressive" for maximum space recovery
      
      **Or:** Say "cleanup" to run in safe mode (default)

