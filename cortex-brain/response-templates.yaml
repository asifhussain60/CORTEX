    handler: src.operations.commit.run_commit
    understanding_content: "You want to synchronize your local repository with origin using stash-pull-merge-push workflow that intelligently preserves both local and remote work, especially for split-machine scenarios."
    challenge_content: "No Challenge - Commit workflow will handle pre-flight validation, untracked files, stash local changes, intelligent merge with conflict resolution, and create safety checkpoints automatically."
    response_content: "**Stash-Pull-Merge-Push Workflow:**\n   \n   1. **Pre-flight Check** - Validate current repository state\n   2. **Handle Untracked Files** - Prompt to add or ignore untracked files\n   3. **Stash Local Changes** - Preserve uncommitted work before pull\n   4. **Pull from Origin** - Fetch and merge/rebase with remote changes\n   5. **Apply Stash** - Restore local changes with intelligent conflict resolution\n   6. **Create Checkpoint** - Safety checkpoint for rollback capability\n   7. **Push to Origin** - Upload merged changes to remote repository\n   \n   **Safety Features:**\n   • Stash before pull (preserves local work)\n   • Intelligent conflict resolution (split-machine work)\n   • Git checkpoint after merge (rollback if needed)\n   • Merge conflict detection with clear guidance\n   • Untracked file validation (zero untracked files guarantee)\n   • Progress reporting for each step\n   \n   **Split-Machine Intelligence:**\n   • Python files: Preserves both local and remote changes\n   • Other files: Prefers local version (safer default)\n   • Auto-resolves stash conflicts when work split across machines"
    request_echo_content: "Sync repository with origin (pull, merge, push)"
    next_steps_content: "**Execution Options:**\n   \n   1. **Standard Sync** - Say \"commit\" to start with interactive prompts\n   2. **Auto-add Untracked** - Say \"commit --auto-add\" to automatically stage untracked files\n   3. **Rebase Strategy** - Say \"commit --rebase\" to use rebase instead of merge\n   4. **Custom Message** - Say \"commit --message 'your message'\" for custom commit message\n   \n   **Rollback Safety:**\n   If issues occur, say \"rollback to checkpoint\" to restore pre-sync state.\n   \n   Ready to sync? Say \"commit\" to begin."
