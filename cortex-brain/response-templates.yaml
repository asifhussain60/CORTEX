        {{description}}
      {{/each}}
      
      {{/each}}
      
      **Execution Options:**
      
      **Option 1: Complete DoR (RECOMMENDED)**
      1. Execute remediation plan
      2. Update original plan's DoR fields to `true`
      3. Re-run execution normally
      
      **Option 2: Force Execution (WITH APPROVED REMEDIATION)**
      1. Review and approve remediation plan
      2. Execute original plan with `force_execution=True`
      3. Address DoR gaps during implementation (higher risk)
      
      **Option 3: Cancel Execution**
      - Return to planning phase
      - Complete DoR items before implementation
    
