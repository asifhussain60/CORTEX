    name: Tech-Aware Implementation (Example)
    triggers:
    - implement caching
    - add caching
    - cache layer
    response_type: tech_aware
    operation_name: Caching Implementation
    understanding_content: You want to implement a caching layer to improve application
      performance.
    challenge_content: No Challenge - Caching is a proven performance optimization
      pattern.
    recommended_solution: "**Best Practice: Redis**\nRedis is the industry-standard\
      \ for application caching with:\n- Sub-millisecond response times\n- Rich data\
      \ structures (strings, hashes, sets, sorted sets)\n- Built-in persistence options\n\
      - Pub/sub messaging capabilities\n- Cluster support for horizontal scaling\n\
      \n```python\n# Example: Redis caching implementation\nimport redis\nfrom functools\
      \ import wraps\n\nredis_client = redis.Redis(host='localhost', port=6379, decode_responses=True)\n\
      \ndef cache_result(ttl=300):\n    def decorator(func):\n        @wraps(func)\n\
      \        def wrapper(*args, **kwargs):\n            cache_key = f\"{func.__name__}:{args}:{kwargs}\"\
      \n            cached = redis_client.get(cache_key)\n            if cached:\n\
      \                return cached\n            result = func(*args, **kwargs)\n\
      \            redis_client.setex(cache_key, ttl, result)\n            return\
      \ result\n        return wrapper\n    return decorator\n```\n"
    company_aligned_implementation: "**Azure Cache for Redis**\nDeploy Redis on Azure\
      \ for seamless integration with your stack:\n- Fully managed Redis service (no\
      \ server maintenance)\n- Enterprise-grade SLA (99.9% uptime)\n- Built-in security\
      \ (VNet integration, private endpoints)\n- Automatic backups and geo-replication\n\
      - Integration with Azure Monitor for observability\n\n**Deployment via {iac_tool}:**\n\
      ```hcl\n# Terraform example for Azure Cache for Redis\nresource \"azurerm_redis_cache\"\
      \ \"main\" {\n  name                = \"myapp-cache\"\n  location          \
      \  = azurerm_resource_group.main.location\n  resource_group_name = azurerm_resource_group.main.name\n\
      \  capacity            = 1\n  family              = \"C\"\n  sku_name      \
      \      = \"Standard\"\n  enable_non_ssl_port = false\n  minimum_tls_version\
      \ = \"1.2\"\n}\n```\n\n**Connection String (stored in Azure Key Vault):**\n\
      ```python\n# Same Redis client code - just different connection string\nredis_client\
      \ = redis.Redis(\n    host=os.environ['AZURE_REDIS_HOST'],\n    port=6380,\n\
      \    password=os.environ['AZURE_REDIS_KEY'],\n    ssl=True\n)\n```\n\n**Monitoring\
      \ via {monitoring_platform}:**\n- Cache hit/miss rates\n- Memory usage and eviction\
      \ metrics\n"
    request_echo_content: Implement caching layer
    next_steps_content: '1. Choose deployment approach (best practice Redis vs. company-aligned)

      2. Implement caching decorator

      3. Add monitoring/alerting

      4. Load test to validate performance improvements

      '
