# User Interaction Profiles for CORTEX Response Templates
# Defines how responses adapt to different interaction modes
# 
# Purpose: Configure response formatting based on user experience level and preference
# Integration: Connects to Tier 1 user_profile table via UserProfileManager
# 
# Interaction Modes:
#   - autonomous: Minimal guidance, maximum efficiency (experienced developers)
#   - guided: Balanced detail and structure (default for most users)
#   - educational: Extended explanations with learning context (junior developers)
#   - pair: Collaborative mode with options and trade-offs (active decision-making)
# 
# Version: 3.2
# Phase: 5.1 - Modular YAML Structure
# Last Updated: December 2, 2025

schema_version: '3.2'
last_updated: '2025-12-02'

profiles:
  autonomous:
    name: "Autonomous Mode"
    description: "Minimal guidance, maximum efficiency. User wants direct answers without explanation."
    verbosity: compact
    format_style: compact_format
    characteristics:
      - No challenge section (inline in header)
      - Compact response format
      - Minimal explanations
      - Focus on actionable outcomes
    next_steps_format: numbered
    example_use_case: "Experienced developers who know what they want"
    
    section_customization:
      understanding_section:
        prefix: ""
        max_lines: 1
      challenge_section:
        show: false  # Inline in header instead
      response_section:
        style: compact
        max_lines: 10
      request_echo_section:
        inline: true  # Combine with next steps
      next_steps_section:
        format: numbered
        max_items: 5
  
  guided:
    name: "Guided Mode"
    description: "Standard CORTEX experience with balanced detail and structure."
    verbosity: concise
    format_style: standard_5_part
    characteristics:
      - Full 5-part structure
      - Clear explanations without over-detail
      - Standard context sections
      - Balanced next steps
    next_steps_format: numbered
    example_use_case: "Default mode for most users"
    
    section_customization:
      understanding_section:
        prefix: "### 🎯 My Understanding Of Your Request"
        max_lines: 3
      challenge_section:
        prefix: "### ⚠️ Challenge"
        show: true
      response_section:
        style: standard
        max_lines: 30
      request_echo_section:
        prefix: "### 📝 Your Request"
        show: true
      next_steps_section:
        prefix: "### 🔍 Next Steps"
        format: numbered
        max_items: 7
  
  educational:
    name: "Educational Mode"
    description: "Extended explanations with learning context and detailed breakdowns."
    verbosity: detailed
    format_style: educational
    characteristics:
      - "Detailed 5-part structure"
      - "Context sections expanded"
      - "Why explanations included"
      - "Learning resources referenced"
      - "Conceptual breakdowns"
    next_steps_format: checkboxes
    example_use_case: "Junior developers or learning new technologies"
    
    section_customization:
      understanding_section:
        prefix: "### 🎯 My Understanding Of Your Request"
        max_lines: 5
        include_context: true
      challenge_section:
        prefix: "### ⚠️ Challenge"
        show: true
        include_explanation: true
      response_section:
        style: detailed
        include_analysis: true
        include_recommendations: true
        include_examples: true
        max_lines: 50
      request_echo_section:
        prefix: "### 📝 Your Request"
        show: true
      next_steps_section:
        prefix: "### 🔍 Next Steps"
        format: checkboxes
        include_learning_resources: true
        max_items: 10
  
  pair:
    name: "Pair Programming Mode"
    description: "Collaborative mode with options and discussion of trade-offs."
    verbosity: detailed
    format_style: standard_5_part
    characteristics:
      - "Full 5-part structure"
      - "Multiple options presented"
      - "Trade-off discussions"
      - "Collaborative language"
      - "What do you think prompts"
    next_steps_format: parallel
    example_use_case: "Active collaboration and decision-making sessions"
    
    section_customization:
      understanding_section:
        prefix: "### 🎯 My Understanding Of Your Request"
        max_lines: 4
        collaborative_tone: true
      challenge_section:
        prefix: "### ⚠️ Challenge"
        show: true
        present_options: true
      response_section:
        style: collaborative
        include_options: true
        include_tradeoffs: true
        ask_preferences: true
        max_lines: 40
      request_echo_section:
        prefix: "### 📝 Your Request"
        show: true
      next_steps_section:
        prefix: "### 🔍 Next Steps"
        format: parallel
        include_decision_points: true
        max_tracks: 3

# Profile selection rules
selection_rules:
  # Priority order for profile selection
  priority:
    - user_profile_database  # Check Tier 1 user_profile table first
    - context_inference      # Infer from conversation context
    - default                # Fall back to 'guided'
  
  # Default profile if none specified
  default_profile: guided
  
  # Context inference keywords
  inference_keywords:
    autonomous:
      - "quick"
      - "just show me"
      - "tldr"
      - "summary"
      - "fast"
    educational:
      - "explain"
      - "teach me"
      - "how does"
      - "why"
      - "learn"
      - "understand"
    pair:
      - "what do you think"
      - "options"
      - "which approach"
      - "trade-offs"
      - "collaborate"

# Profile switching
switching:
  # Allow mid-conversation profile changes
  allow_dynamic: true
  
  # Commands to switch profiles
  commands:
    autonomous:
      - "be concise"
      - "shorter"
      - "autonomous mode"
    guided:
      - "standard format"
      - "guided mode"
      - "normal"
    educational:
      - "explain more"
      - "educational mode"
      - "teach mode"
    pair:
      - "pair mode"
      - "collaborate"
      - "show options"
  
  # Persist changes to Tier 1 database
  persist_changes: true
