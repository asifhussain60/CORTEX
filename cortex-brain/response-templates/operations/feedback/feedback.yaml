category: operations/feedback
templates:
  feedback_agent:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: Feedback Collection
    triggers:
    - feedback
    - report issue
    - report bug
    - suggest improvement
    response_type: operational
    expected_orchestrator: feedback_agent
    operation_name: FeedbackCollection
    sections:
      understanding_scope_content: You want to provide feedback about CORTEX (bug, improvement,
        or question)
      approach_considerations_content: No significant challenges - Structured feedback collection with auto-upload
      response_content: '## 💬 Feedback Collection Agent


        **Structured feedback system** for bugs, improvements, and questions


        **Feedback Types:**


        **1. Bug Reports**

        - What happened vs expected

        - Reproduction steps

        - Error messages

        - Environment details

        - Severity classification


        **2. Feature Gaps**

        - Missing functionality

        - Use case description

        - Workarounds tried

        - Priority assessment


        **3. Improvements**

        - Current behavior

        - Proposed enhancement

        - Expected benefit

        - Implementation suggestions


        **4. Questions**

        - Technical questions

        - Usage clarifications

        - Documentation gaps


        **Feedback Process:**


        1. **Collection** - Structured prompts for details

        2. **Sanitization** - Auto-redact sensitive data

        3. **Classification** - Auto-detect type and severity

        4. **Storage** - Save to `cortex-brain/feedback/`

        5. **Upload** - Optional GitHub Gist upload

        6. **Tracking** - Unique feedback ID assigned


        **Privacy Protection:**

        - Sensitive data auto-redacted

        - User consent before upload

        - Local storage always available


        **Feedback Report Format:**

        ```markdown

        # CORTEX Feedback Report


        **ID:** CORTEX-FEEDBACK-20251205_143022

        **Type:** Bug Report

        **Severity:** High

        **Date:** December 5, 2025


        ## Description

        [User''s detailed description]


        ## Context

        - CORTEX Version: 3.7.1

        - Python Version: 3.11

        - OS: Windows 11


        ## Steps to Reproduce

        1. [Step 1]

        2. [Step 2]


        ## Expected vs Actual

        Expected: [...]

        Actual: [...]

        ```

        '
      impact_changes_content: Provide feedback about CORTEX
      next_steps_content: '**Feedback Commands:**


        1. Say "feedback" to start feedback collection

        2. Say "report bug" for bug-specific report

        3. Say "suggest improvement" for enhancement ideas

        4. Say "ask question" for technical questions


        **Auto-Upload:** Enabled by default (opt-out available)

        '
