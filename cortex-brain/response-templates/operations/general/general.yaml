        \ discovery** from Razor/Blazor views\n\n**Problem Solved:**\n- TDD workflow\
        \ previously generated tests with **assumed selectors**\n- Tests failed immediately\
        \ due to non-existent element IDs\n- Manual element discovery took **60+ minutes**\n\
        - View Discovery reduces to **<5 minutes** (92% time saving)\n\n**Discovery\
        \ Capabilities:**\n\n**1. Element ID Extraction**\n- Parse Razor files for\
        \ `id` attributes\n- Extract `data-testid` attributes\n- Discover CSS classes\n\
        - Map button text to elements\n- Recommended selector strategy (ID > data-testid\
        \ > class > text)\n\n**2. Navigation Flow Discovery**\n- Extract `@page` route\
        \ directives\n- Identify component hierarchy\n- Detect authentication requirements\n\
        - Map parent-child relationships\n\n**3. Selector Strategy Generation**\n\
        ```csharp\n// Priority: ID selector\ndriver.FindElement(By.Id(\"submit-button\"\
        ))\n\n// Fallback: data-testid\ndriver.FindElement(By.CssSelector(\"[data-testid='submit-btn']\"\
        ))\n\n// Fallback: CSS class\ndriver.FindElement(By.ClassName(\"btn-primary\"\
        ))\n\n// Last resort: Text match\ndriver.FindElement(By.XPath(\"//button[text()='Submit']\"\
        ))\n```\n\n**4. Quality Checks**\n- Flag components without IDs\n- Identify\
        \ duplicate IDs\n- Warn about unstable selectors\n- Suggest ID additions\n\
        \n**Output Formats:**\n- **JSON:** Element mappings for test generation\n\
        - **Database:** Tier 2 knowledge graph storage\n- **Markdown:** Human-readable\
        \ report\n\n**Integration:**\n- Auto-runs before test generation in TDD workflow\n\
        - Feeds element mappings to test generator\n- Results in **95%+ test accuracy**\
        \ (up from 30%)\n\n**Example Output:**\n```json\n{\n  \"file\": \"Pages/Login.razor\"\
        ,\n  \"route\": \"/login\",\n  \"elements\": [\n    {\n      \"element_id\"\
        : \"username-input\",\n      \"element_type\": \"input\",\n      \"selector_strategy\"\
        : \"By.Id('username-input')\",\n      \"user_facing_text\": null,\n      \"\
        line_number\": 42\n    },\n    {\n      \"element_id\": \"login-button\",\n\
        \      \"element_type\": \"button\",\n      \"selector_strategy\": \"By.Id('login-button')\"\
        ,\n      \"user_facing_text\": \"Sign In\",\n      \"line_number\": 58\n \
        \   }\n  ]\n}\n```\n"
      impact_changes_content: Discover UI element IDs from Razor/Blazor views
      next_steps_content: '**View Discovery Commands:**


        1. Say "discover views in [file/folder]" to scan specific files

        2. Say "discover views project" to scan entire project

        3. Say "view discovery report" to see discovered elements

        4. Say "flag missing ids" to identify elements without IDs


        **Auto-Integration:** Runs automatically during TDD test generation

        '
