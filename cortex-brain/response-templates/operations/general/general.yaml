  plan_execution:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: Plan Execution
    triggers:
    - execute plan
    - run plan
    - start plan
    - implement plan
    - approve plan
    response_type: operational
    expected_orchestrator: plan_execution_orchestrator
    operation_name: PlanExecution
    sections:
      understanding_scope_content: You want to execute a saved feature plan
      approach_considerations_content: No significant challenges - Automated execution with TDD integration
      response_content: '## ▶️ Plan Execution


        **Automated plan execution** with TDD Mastery workflow integration


        **Execution Phases:**


        **Phase 1: Pre-Execution Validation**

        - Load plan from `cortex-brain/documents/planning/`

        - Verify DoR (Definition of Ready) compliance

        - Check dependencies

        - Validate environment setup


        **Phase 2: TDD Workflow Initiation**

        - Auto-start TDD Mastery workflow

        - Generate test stubs from acceptance criteria

        - Create implementation skeleton

        - Set up git checkpoint automation


        **Phase 3: Implementation Guidance**

        - RED: Write failing tests first

        - GREEN: Implement minimal solution

        - REFACTOR: Optimize code

        - Auto-checkpoint after each phase


        **Phase 4: DoD (Definition of Done) Validation**

        - ✅ All tests pass (100%)

        - ✅ Code reviewed

        - ✅ Documentation updated

        - ✅ Security scan clean

        - ✅ Performance benchmarks met


        **Phase 5: Completion**

        - Final git checkpoint

        - Update development context

        - Generate completion report

        - Archive plan


        **Execution Monitoring:**

        - Real-time progress tracking

        - Blockers detection

        - ETA calculation

        - Phase completion alerts


        **Execution Modes:**

        - **Guided:** Step-by-step prompts (recommended for beginners)

        - **Automated:** Minimal intervention (for experienced users)

        - **Review:** Pause at each phase for review

        '
      impact_changes_content: Execute saved feature plan with TDD integration
      next_steps_content: '**Plan Execution Commands:**


        1. Say "approve plan [name]" to start execution

        2. Say "resume plan [name]" to continue paused execution

        3. Say "list plans" to see available plans

        4. Say "plan status [name]" to check execution progress


        **Execution Control:**

        - Say "pause execution" to pause

        - Say "skip phase" to skip current phase (with confirmation)

        - Say "abort execution" to stop (checkpoint created)

        '
