templates:
  cleanup:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: System Cleanup
    triggers:
    - cleanup
    - clean up
    - remove obsolete
    - delete temp files
    - cleanup system
    - cortex cleanup
    response_type: operational
    expected_orchestrator: cleanup_orchestrator
    operation_name: Cleanup
    sections:
      understanding_scope_content: You want to clean up obsolete files, temporary data,
        and optimize CORTEX storage
      approach_considerations_content: No significant challenges - Safe cleanup with automatic backup
      response_content: "## \U0001F9F9 CORTEX System Cleanup\n\n**Automated cleanup\
        \ orchestration** across multiple categories\n\n**Cleanup Targets:**\n\n1.\
        \ **Obsolete Code** (deprecated modules, unused files)\n   - Auto-detection\
        \ via ObsoleteCodeDetector\n   - Safe removal with backup\n   - Dependency\
        \ analysis\n\n2. **Temporary Files** (logs, cache, temp data)\n   - Log files\
        \ older than 30 days\n   - Cache entries expired\n   - Temporary processing\
        \ files\n\n3. **Test Artifacts** (old test results, coverage reports)\n  \
        \ - Archived test outputs\n   - Stale coverage data\n   - Benchmark results\n\
        \n4. **Documentation Duplicates** (redundant docs, old versions)\n   - Duplicate\
        \ detection\n   - Version consolidation\n   - Broken link removal\n\n**Cleanup\
        \ Modes:**\n- **Dry Run:** Preview changes without deletion\n- **Safe Mode:**\
        \ Backup before deletion (default)\n- **Aggressive:** Maximum cleanup with\
        \ space recovery\n\n**Safety Features:**\n- ✅ Automatic backup to cortex-brain/archives/\n\
        - ✅ Rollback capability\n- ✅ Dependency validation\n- ✅ User confirmation\
        \ for critical deletions\n"
      impact_changes_content: Run system cleanup to remove obsolete files and optimize
        storage
      next_steps_content: '**Cleanup Options:**


        1. Say "cleanup dry-run" to preview what will be deleted

        2. Say "cleanup safe" for cleanup with backup (recommended)

        3. Say "cleanup aggressive" for maximum space recovery


        **Or:** Say "cleanup" to run in safe mode (default)

        '
  optimize_cortex:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: CORTEX Performance Optimization
    triggers:
    - optimize cortex
    - performance optimization
    - speed up cortex
    - cortex optimization
    response_type: operational
    expected_orchestrator: optimize_cortex_orchestrator
    operation_name: Optimize
    sections:
      understanding_scope_content: You want to optimize CORTEX performance and reduce resource
        usage
      approach_considerations_content: No significant challenges - Safe optimization with performance validation
      response_content: "## ⚡ CORTEX Performance Optimization\n\n**Comprehensive system\
        \ optimization** targeting speed, memory, and disk usage\n\n**Optimization\
        \ Categories:**\n\n1. **Database Optimization**\n   - VACUUM SQLite databases\
        \ (tier1-3)\n   - Index optimization\n   - Query performance tuning\n   -\
        \ Connection pool management\n\n2. **Cache Optimization**\n   - Tier1 working\
        \ memory FIFO enforcement\n   - Expired entry removal\n   - Cache hit rate\
        \ improvement\n   - Memory footprint reduction\n\n3. **File System Optimization**\n\
        \   - Duplicate file detection\n   - Log rotation and archival\n   - Temporary\
        \ file cleanup\n   - Archive compression\n\n4. **Code Optimization**\n   -\
        \ Import dependency analysis\n   - Dead code detection\n   - Module load time\
        \ profiling\n   - Startup time optimization\n\n5. **Response Template Optimization**\n\
        \   - Template size reduction\n   - Token count optimization\n   - Compression\
        \ analysis\n   - Delivery speed improvement\n\n**Performance Targets:**\n\
        - Startup time: <3 seconds\n- Query response: <100ms\n- Memory usage: <200\
        \ MB\n- Disk footprint: <100 MB\n\n**SKULL Tests Included:** Full test suite\
        \ execution to validate no regressions\n"
      impact_changes_content: Optimize CORTEX system performance and resource usage
      next_steps_content: '**Optimization Options:**


        1. Say "optimize cortex" for full optimization

        2. Say "optimize database" for database-only optimization

        3. Say "optimize cache" for cache-only optimization

        4. Say "profile cortex" to see current performance metrics


        **Expected Results:** 20-40% performance improvement

        '
  design_sync:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: Design Documentation Synchronization
    triggers:
    - design sync
    - sync design docs
    - update design
    - refresh design docs
    - design documentation
    response_type: operational
    expected_orchestrator: design_sync_orchestrator
    operation_name: DesignSync
    sections:
      understanding_scope_content: You want to synchronize design documentation with implementation
      approach_considerations_content: Documentation Drift - Design docs may be out of sync with
        code
      response_content: "## \U0001F4D0 Design Documentation Synchronization\n\n**Automated\
        \ synchronization** between design documents and implementation\n\n**Sync\
        \ Categories:**\n\n1. **Architecture Diagrams**\n   - UML class diagrams\n\
        \   - Sequence diagrams\n   - Component diagrams\n   - Deployment diagrams\n\
        \   - Auto-generation from code\n\n2. **API Documentation**\n   - Method signatures\n\
        \   - Parameter types\n   - Return types\n   - Example usage\n   - Extracted\
        \ from docstrings\n\n3. **System Design Documents**\n   - Brain architecture\
        \ (4-tier)\n   - Orchestrator workflows\n   - Agent interactions\n   - Plugin\
        \ system\n   - Database schemas\n\n4. **Configuration Documentation**\n  \
        \ - cortex.config.json structure\n   - Brain protection rules\n   - Response\
        \ templates\n   - Operations registry\n\n**Sync Process:**\n1. Scan codebase\
        \ for documentation markers\n2. Extract current implementation details\n3.\
        \ Compare with existing design docs\n4. Generate diff report\n5. Update design\
        \ docs (with approval)\n6. Regenerate diagrams\n\n**Output Formats:**\n- Markdown\
        \ (.md)\n- PlantUML diagrams (.puml)\n- Mermaid diagrams (.mmd)\n- HTML documentation\n"
      impact_changes_content: Synchronize design documentation with current implementation
      next_steps_content: '**Sync Options:**


        1. Say "design sync all" to sync all design documentation

        2. Say "design sync architecture" for architecture diagrams only

        3. Say "design sync api" for API documentation only

        4. Say "design sync report" to see what''s out of sync


        **Recommended:** Run "design sync report" first to review changes

        '
