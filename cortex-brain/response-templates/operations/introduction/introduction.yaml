# Introduction Templates - Audience-Specific Variants
# Version: 4.0
# Purpose: Map introduction intents to response-templates-v4.yaml templates
# Part of: Response Template Cleanup (Phase 4)

schema_version: '4.0'
last_updated: '2025-12-30'
category: operations/introduction

# ============================================================================
# INTRODUCTION TEMPLATES - Audience Variants
# ============================================================================
# Note: These map to the 'introduction' and 'business_value' templates in
# response-templates-v4.yaml. The routing layer uses these to select the
# appropriate content focus based on detected audience.

templates:
  introduction_professional:
    description: "Default introduction for Software Engineers and Technical Leads"
    maps_to: "custom_templates.introduction"
    source_file: "cortex-brain/response-templates-v4.yaml"
    audience:
      - "Software Engineer"
      - "Technical Lead"
      - "Developer"
      - "Architect"
    focus_sections:
      - "Core Capabilities"
      - "4-Tier Brain Architecture"
      - "Getting Started"
      - "Next Steps"
    intent_patterns:
      - "introduce yourself"
      - "introduce cortex"
      - "what is cortex"
      - "tell me about cortex"
      - "present cortex"

  introduction_engineering:
    description: "Engineering-focused introduction (alias for professional)"
    maps_to: "custom_templates.introduction"
    source_file: "cortex-brain/response-templates-v4.yaml"
    audience:
      - "Engineer"
      - "Developer"
      - "Programmer"
    focus_sections:
      - "Core Capabilities"
      - "TDD Mastery"
      - "Debug System"
      - "Getting Started"
    intent_patterns:
      - "introduce yourself to engineers"
      - "introduce cortex to engineering"
      - "present cortex to developers"
      - "cortex for engineers"

  introduction_leadership:
    description: "Leadership-focused introduction (ROI and business impact)"
    maps_to: "custom_templates.business_value"
    source_file: "cortex-brain/response-templates-v4.yaml"
    audience:
      - "Leadership"
      - "Executive"
      - "CTO"
      - "VP Engineering"
      - "Director"
      - "Manager"
    focus_sections:
      - "Executive Summary"
      - "Quantified Business Impact"
      - "Implementation Benefits"
      - "ROI Metrics"
    intent_patterns:
      - "introduce yourself to leadership"
      - "introduce cortex to leadership"
      - "present cortex to leadership"
      - "cortex for leadership"

  introduction_product:
    description: "Product Owner-focused introduction (delivery and planning)"
    maps_to: "custom_templates.introduction"
    source_file: "cortex-brain/response-templates-v4.yaml"
    audience:
      - "Product Owner"
      - "Product Manager"
      - "Scrum Master"
      - "Delivery Manager"
    focus_sections:
      - "Core Capabilities"
      - "Planning System"
      - "Azure DevOps Integration"
      - "Timeframe Estimation"
    intent_patterns:
      - "introduce yourself to product"
      - "introduce cortex to product"
      - "present cortex to product owners"
      - "cortex for product"

# ============================================================================
# TEMPLATE RESOLUTION NOTES
# ============================================================================
# 
# The routing layer (response-routing-rules.yaml) detects audience from:
# 1. Explicit phrases: "to leadership", "for engineers", etc.
# 2. Implicit keywords: "ROI", "architecture", "sprint", etc.
# 3. Default: introduction_professional
#
# Template content is dynamically selected from response-templates-v4.yaml
# based on the maps_to field. This file serves as the routing metadata.
