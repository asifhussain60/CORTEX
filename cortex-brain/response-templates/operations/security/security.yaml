templates:
  security_posture:
    description: "Security overview for concerned stakeholders"
    tier: "TIER 3"
    audience:
      - "Security Team"
      - "Compliance Officer"
      - "CTO"
      - "VP Engineering"
    intent_patterns:
      - "security concerns"
      - "how does cortex address security"
      - "cortex security"
      - "is cortex secure"
      - "security posture"
      - "data security"
      - "privacy concerns"
    format: |
      ## 🧠 CORTEX Security Posture
      **Author:** Asif Hussain | **Website:** https://asifhussain60.github.io/CORTEX/
      
      ---
      
      ### 🔒 Security Overview
      
      CORTEX is designed with security as a foundational principle, implementing multiple layers of protection for your development workflow.
      
      ---
      
      ### 🛡️ Data Protection
      
      | Aspect | Implementation |
      |--------|----------------|
      | **Data Storage** | Browser-native SQL.js (local-only, no external servers) |
      | **Brain Data** | Stored in project workspace, never transmitted externally |
      | **Conversation History** | FIFO 70-conversation limit, no persistent cloud storage |
      | **Sensitive Data** | Never stored in brain - filtered by SKULL protection rules |
      
      ---
      
      ### 🧠 SKULL Protection Layer (Tier 0)
      
      The SKULL (Security, Knowledge, Unified Logic Layer) provides governance:
      
      **Active Protections:**
      - ❌ Credentials/secrets never captured
      - ❌ PII detection and filtering
      - ❌ API keys excluded from memory
      - ✅ Audit logging for compliance
      - ✅ Code sanitization for safe sharing
      
      ---
      
      ### 🔐 Code Sanitization Pipeline
      
      5-phase cleanup for secure code sharing:
      
      1. **Secret Detection** - Credentials, API keys, tokens
      2. **PII Removal** - Personal information, email addresses
      3. **Metadata Cleanup** - Git history, author info
      4. **Structure Normalization** - Company-specific patterns
      5. **Verification** - Compliance validation
      
      [Sanitization Guide →](https://asifhussain60.github.io/CORTEX/features/code-sanitization.html)
      
      ---
      
      ### 📋 Compliance Support
      
      | Standard | Coverage |
      |----------|----------|
      | **GDPR** | No external data transmission, local-only storage |
      | **SOC 2** | Audit logging, access controls |
      | **HIPAA** | PII filtering, encryption at rest |
      | **PCI-DSS** | Credential exclusion, tokenization |
      
      ---
      
      ### 🔍 Security Best Practices
      
      **Recommended Configuration:**
      ```yaml
      brain_protection:
        skull_enabled: true
        pii_filtering: true
        credential_detection: strict
        audit_logging: true
        sanitization_on_export: true
      ```
      
      ---
      
      ### 📞 Security Contact
      
      For security concerns or vulnerability reports:
      - **GitHub:** https://github.com/asifhussain60/CORTEX/security
      - **Documentation:** https://asifhussain60.github.io/CORTEX/security/
      
      **Next:** Review the full security documentation or ask specific security questions.
