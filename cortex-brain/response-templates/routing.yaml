# Response Template Routing Configuration
# Maps triggers to templates and defines selection logic
# Version: 3.2
# Phase: 5.1 - Modular YAML Structure

schema_version: '3.2'
last_updated: '2025-12-02'

routing:
  # Trigger to template ID mapping
  trigger_index:
    # Onboarding triggers
    onboard: onboarding
    onboarding: onboarding
    "setup profile": onboarding
    "first time": onboarding
    "new user": onboarding
    
    # Help triggers
    help: help
    /help: help
    "what can cortex do": help
    
    # Tutorial triggers
    tutorial: hands_on_tutorial
    "start tutorial": hands_on_tutorial
    "hands on tutorial": hands_on_tutorial
    "interactive tutorial": hands_on_tutorial
    "learn cortex": hands_on_tutorial
    
    # Planning triggers
    plan: planning
    planning: planning
    "create plan": planning
    "feature planning": planning
    
    # TDD triggers
    "start tdd": tdd_workflow
    tdd: tdd_workflow
    "test driven": tdd_workflow
    
    # Feedback triggers
    feedback: feedback
    "report issue": feedback
    "bug report": feedback
    
    # Admin triggers
    admin: admin_operations
    "deploy cortex": admin_operations
    "generate docs": admin_operations
    "system alignment": admin_operations
    
    # Threat modeling triggers
    "threat report": threat_report
    "security review": threat_report
    "stride analysis": threat_report
    
    # Status triggers
    status: status_check
    "where are we": status_check
    progress: status_check
  
  # Default template when no trigger matches
  default_template: fallback
  
  # Template selection priority
  selection_priority:
    - exact_trigger_match      # Match trigger from trigger_index
    - fuzzy_trigger_match      # Partial match with similarity scoring
    - orchestrator_hint        # Expected orchestrator from context
    - interaction_mode         # User profile interaction mode
    - default_fallback         # Use fallback template
  
  # Fuzzy matching configuration
  fuzzy_matching:
    enabled: true
    similarity_threshold: 0.8  # 80% similarity required
    max_candidates: 3          # Show top 3 matches if ambiguous
  
  # Context-aware routing
  context_routing:
    # If conversation context suggests a specific template
    use_context: true
    context_weight: 0.3        # 30% weight to context vs trigger match
    
    # Recent operations influence template selection
    recent_operations_window: 10  # Consider last 10 operations
    
    # Operation chaining (suggest next template based on current)
    operation_chains:
      planning:
        next_suggested:
          - tdd_workflow
          - threat_report
      tdd_workflow:
        next_suggested:
          - status_check
      threat_report:
        next_suggested:
          - planning
  
  # Template filtering by repository context
  repository_filtering:
    # CORTEX development repo (has cortex-brain/admin/)
    cortex_development:
      allow_admin: true
      all_templates: true
    
    # User repositories (no admin/ directory)
    user_repository:
      allow_admin: false
      exclude_templates:
        - admin_operations
  
  # Caching configuration
  caching:
    enabled: true
    cache_trigger_lookups: true
    cache_ttl_seconds: 300  # 5 minutes
    invalidate_on_profile_change: true

# Template metadata for enhanced routing
template_metadata:
  onboarding:
    priority: high
    required_context: minimal
    estimated_time_seconds: 30
    
  help:
    priority: high
    required_context: none
    estimated_time_seconds: 5
    
  hands_on_tutorial:
    priority: medium
    required_context: minimal
    estimated_time_seconds: 900  # 15 minutes
    
  planning:
    priority: high
    required_context: moderate
    estimated_time_seconds: 180  # 3 minutes
    
  tdd_workflow:
    priority: high
    required_context: moderate
    estimated_time_seconds: 300  # 5 minutes
    
  feedback:
    priority: medium
    required_context: minimal
    estimated_time_seconds: 60
    
  admin_operations:
    priority: high
    required_context: full
    estimated_time_seconds: 600  # 10 minutes
    repository_restriction: cortex_development
    
  threat_report:
    priority: high
    required_context: moderate
    estimated_time_seconds: 180  # 3 minutes
    
  status_check:
    priority: low
    required_context: moderate
    estimated_time_seconds: 10
    
  fallback:
    priority: lowest
    required_context: none
    estimated_time_seconds: 5
