# Base Components for Response Templates (Phase 5)
# Schema: v0.1 (scaffold)
# Purpose: Reusable sections/partials (headers, footers, sections)
# Backcompat: Non-disruptive. Composer-only consumption.

schema_version: '0.1'
last_updated: '2025-12-02'

components:
  headers:
    standard_5_part: |
      ## 🧠 CORTEX {{operation}}
      **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
      
      ---
  sections:
    understanding: |
      ### 🎯 My Understanding Of Your Request
      {{understanding_content}}
    challenge: |
      ### ⚠️ Challenge
      {{challenge_content}}
    response: |
      ### 💬 Response
      {{response_content}}
    request_echo: |
      ### 📝 Your Request
      {{request_echo_content}}
    next_steps: |
      ### 🔍 Next Steps
      {{next_steps_content}}

