category: specialized/threat-modeling
templates:
  threat_modeler_agent:
    inherits_from: core/base-templates/5-part-standard.yaml
    name: Threat Modeling
    triggers:
    - threat model
    - security threats
    - stride analysis
    - analyze threats
    - security review
    response_type: operational
    expected_orchestrator: threat_modeler_agent
    operation_name: ThreatModeling
    sections:
      understanding_content: You want to perform security threat analysis using STRIDE
        framework
      challenge_content: Security Risk - Threats must be identified before implementation
      response_content: "## \U0001F6E1️ Threat Modeling Agent\n\n**Enhanced security\
        \ analysis** using STRIDE framework + OWASP Top 10\n\n**Threat Analysis Framework:**\n\
        \n**STRIDE Categories:**\n\n**S - Spoofing Identity**\n- Authentication bypass\n\
        - Token theft\n- Session hijacking\n- Impersonation attacks\n\n**T - Tampering\
        \ with Data**\n- Input manipulation\n- SQL injection\n- Man-in-the-middle\n\
        - Data integrity violations\n\n**R - Repudiation**\n- Missing audit logs\n\
        - Non-repudiation failures\n- Log tampering\n- Activity denial\n\n**I - Information\
        \ Disclosure**\n- Sensitive data exposure\n- Insecure storage\n- Information\
        \ leakage\n- Privacy violations\n\n**D - Denial of Service**\n- Resource exhaustion\n\
        - Rate limiting bypass\n- Crash vulnerabilities\n- Service disruption\n\n\
        **E - Elevation of Privilege**\n- Authorization bypass\n- Privilege escalation\n\
        - Role manipulation\n- Access control failures\n\n**OWASP Top 10 Integration:**\n\
        - Auto-map threats to OWASP categories\n- A01: Broken Access Control\n- A02:\
        \ Cryptographic Failures\n- A03: Injection\n- A04: Insecure Design\n- A05:\
        \ Security Misconfiguration\n- [Full OWASP Top 10 2021 coverage]\n\n**Mitigation\
        \ Strategies:**\n\nEach threat includes:\n- **Implementation steps** (actionable\
        \ checklist)\n- **Code examples** (language-specific)\n- **Effort estimation**\
        \ (hours)\n- **Effectiveness rating** (percentage)\n- **Testing guidance**\
        \ (verification methods)\n- **Tool recommendations** (security scanners)\n\
        \n**Risk Rating:**\n```\nRisk Score = Likelihood × Impact\n\nCRITICAL: Score\
        \ 9-12 (Immediate action)\nHIGH: Score 6-8 (Priority fix)\nMEDIUM: Score 3-5\
        \ (Scheduled fix)\nLOW: Score 1-2 (Monitor)\n```\n\n**Example Mitigation:**\n\
        ```csharp\n// Threat: SQL Injection (STRIDE: Tampering)\n// OWASP: A03:2021\
        \ - Injection\n\n// ❌ VULNERABLE CODE\nstring query = \"SELECT * FROM Users\
        \ WHERE username = '\" + input + \"'\";\n\n// ✅ MITIGATED CODE\nusing (SqlCommand\
        \ cmd = new SqlCommand(\n    \"SELECT * FROM Users WHERE username = @username\"\
        , conn))\n{\n    cmd.Parameters.AddWithValue(\"@username\", input);\n    //\
        \ Parameterized queries prevent injection\n}\n\n// Effort: 2 hours\n// Effectiveness:\
        \ 99%\n// Testing: Use sqlmap or manual injection attempts\n```\n\n**Report\
        \ Sections:**\n1. Executive Summary (risk level, threat count)\n2. STRIDE\
        \ Coverage (threats per category)\n3. OWASP Mapping (compliance status)\n\
        4. Critical Threats (CRITICAL and HIGH only)\n5. Mitigation Roadmap (prioritized\
        \ action plan)\n6. Implementation Guidance (code examples)\n"
      request_echo_content: Perform security threat analysis using STRIDE framework
      next_steps_content: '**Threat Modeling Commands:**


        1. Say "threat model [feature]" to analyze specific feature

        2. Say "stride analysis [feature]" for STRIDE-focused review

        3. Say "security review" for comprehensive threat report

        4. Say "owasp compliance" to check OWASP Top 10 coverage


        **Integration:** Auto-runs during Planning System 2.0 (DoR validation)

        '
