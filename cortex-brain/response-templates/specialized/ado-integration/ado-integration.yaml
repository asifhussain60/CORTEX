category: specialized/ado-integration
templates:
  ado_agent:
    inherits_from: core/base-templates/5-part-standard.yaml
    name: Azure DevOps Agent
    triggers:
    - ado
    - azure devops
    - import ado
    - ado work item
    - ado story
    response_type: operational
    expected_orchestrator: ado_agent
    operation_name: ADOIntegration
    sections:
      understanding_scope_content: You want to import Azure DevOps work items into CORTEX
        planning
      approach_considerations_content: No significant challenges - Vision API auto-extracts from ADO screenshots
      response_content: "## \U0001F537 Azure DevOps Agent\n\n**Seamless ADO integration**\
        \ with Vision API screenshot extraction\n\n**Import Methods:**\n\n**1. Screenshot\
        \ Import (Recommended)**\n- Upload ADO work item screenshot\n- Vision API\
        \ auto-extracts:\n  - Work item ID\n  - Title and description\n  - Acceptance\
        \ criteria\n  - Story points\n  - Priority and tags\n- Generates CORTEX feature\
        \ plan\n\n**2. Manual Import**\n- Paste ADO work item URL\n- Paste work item\
        \ details\n- Manual field mapping\n\n**3. Bulk Import**\n- Upload multiple\
        \ screenshots\n- Batch processing\n- Priority-based ordering\n\n**Extracted\
        \ Data:**\n```yaml\nado_work_item:\n  id: 12345\n  type: User Story\n  title:\
        \ \"Implement user authentication\"\n  description: \"Users need to log in\
        \ securely...\"\n  acceptance_criteria:\n    - Login form with validation\n\
        \    - Password encryption\n    - Session management\n  story_points: 8\n\
        \  priority: High\n  tags: [security, authentication]\n```\n\n**Integration\
        \ Features:**\n- ✅ Auto-generate feature plan\n- ✅ DoR validation with ADO\
        \ context\n- ✅ Test generation from acceptance criteria\n- ✅ Bi-directional\
        \ sync (optional)\n- ✅ Status updates to ADO\n\n**Vision API Accuracy:**\n\
        - OCR: 95%+ accuracy\n- Field detection: 90%+ accuracy\n- Layout parsing:\
        \ 85%+ accuracy\n"
      impact_changes_content: Import Azure DevOps work items into CORTEX planning
      next_steps_content: '**ADO Import Commands:**


        1. Say "ado import" and upload work item screenshot

        2. Say "ado bulk import" for multiple work items

        3. Say "ado sync status" to update ADO with progress

        4. Say "plan ado" to start planning from imported item


        **Vision API:** Upload screenshots directly in chat

        '
