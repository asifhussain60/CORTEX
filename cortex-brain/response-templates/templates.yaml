      understanding_content: "You want to optimize project structure and remove obsolete files."
      challenge_content: "No Challenge - Cleanup orchestrator safely identifies and removes obsolete code with dry-run validation."
      response_content: |
        **Cleanup Operations:**
        - Remove obsolete test files
        - Consolidate duplicate implementations
        - Update file path references
        - Generate cleanup manifest
        
        **Safety Features:**
        - Dry-run mode (default)
        - Git checkpoint before deletion
        - Rollback capability
        - Comprehensive reporting
      request_echo_content: "Run project cleanup and optimization"
      next_steps_content: |
        1. Run dry-run: `cleanup --dry-run`
        2. Review cleanup report
        3. Execute: `cleanup --execute`
        4. Verify changes
  
  cache_management:
    name: "Cache Management"
    components:
      - standard_header
      - understanding_section
      - challenge_section
      - response_section
      - request_echo_section
      - next_steps_section
    triggers:
      - cache status
      - cache clear
      - cache dashboard
    response_type: admin
    content:
      operation: "Cache Management"
      understanding_content: "You want to view or manage the CORTEX ValidationCache for optimized operations."
      challenge_content: "No Challenge - Cache management provides visibility into performance optimizations."
      response_content: |
        The ValidationCache accelerates repeated operations by storing validation results.
        
        **Available Operations:**
        - `cache status` - Show hit rates, entry counts, and effectiveness metrics
        - `cache clear` - Invalidate all cached results (or specify operation)
        - `cache dashboard` - Interactive performance dashboard with recommendations
        
        **Performance Gains:**
        - Optimize: 6.4x speedup (45s → 7s)
        - Cleanup: 5.5x speedup (22s → 4s)
        - Alignment: 4.2x speedup (30s → 7s)
      request_echo_content: "Manage CORTEX ValidationCache"
      next_steps_content: |
        - Run `cache status` for detailed metrics
        - Use `cache clear [operation]` to invalidate specific operation cache
        - View `cache-troubleshooting-guide.md` for optimization tips
  
