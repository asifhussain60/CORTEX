name: "Requirements Gathering - Discovery Context"
phase: "Phase 2: Discovery Context Injection"
purpose: "Present existing features/orchestrators found via Feature Discovery scan"
audience: "User (to prevent reinventing existing functionality)"

template: |
  ## 🔍 CORTEX Discovery Context
  **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
  
  ---
  
  ### 🎯 Discovery Scan Results
  
  **Scan Type:** {scan_type}
  
  **Scope:** {scan_scope}
  
  ---
  
  ### ✅ Existing Features Found
  
  {existing_features}
  
  ---
  
  ### 📊 Coverage Analysis
  
  | Requirement | Coverage Status | Existing Implementation | Gap |
  |-------------|-----------------|-------------------------|-----|
  {coverage_table}
  
  ---
  
  ### 🧩 Related Components
  
  **Discovered Orchestrators:**
  {related_orchestrators}
  
  **Discovered Modules:**
  {related_modules}
  
  **Discovered Utilities:**
  {related_utilities}
  
  ---
  
  ### 💡 Insights
  
  **What Already Exists:**
  {what_exists}
  
  **What's Missing:**
  {what_missing}
  
  **Potential Reuse Opportunities:**
  {reuse_opportunities}
  
  ---
  
  ### 🔍 Next Steps
  
  **Proceeding to Phase 3:** Enhancement Proposal
  - Analyzing gaps with evidence-based context
  - Proposing enhancements that leverage existing features
  - Estimating complexity with reuse considerations
  
  **Your Feedback:** Should we proceed with enhancement proposals, or do you want to review discovery findings first?

variables:
  scan_type:
    type: string
    enum: ["Full Codebase", "Orchestrators Only", "Specific Module", "Cross-Project"]
    description: "Type of Feature Discovery scan executed"
    required: true
    
  scan_scope:
    type: string
    description: "What directories/files were scanned"
    required: true
    
  existing_features:
    type: string
    description: "Markdown list of existing features/orchestrators found (with file paths)"
    required: true
    
  coverage_table:
    type: string
    description: "Table rows showing requirement → coverage → implementation → gap"
    required: true
    
  related_orchestrators:
    type: list
    description: "List of orchestrators related to user request"
    required: true
    
  related_modules:
    type: list
    description: "List of modules/packages that might be reused"
    required: true
    
  related_utilities:
    type: list
    description: "List of utility functions/classes relevant to request"
    required: true
    
  what_exists:
    type: string
    description: "Summary of functionality that already exists"
    required: true
    
  what_missing:
    type: string
    description: "Summary of functionality gaps"
    required: true
    
  reuse_opportunities:
    type: list
    description: "Specific components/patterns that can be reused"
    required: true

validation_rules:
  - rule: "existing_features list must include file paths"
  - rule: "coverage_table must have at least 3 rows"
  - rule: "related_* lists can be empty if nothing found"
  - rule: "what_missing must identify specific gaps, not generic statements"
  - rule: "reuse_opportunities must be actionable (not 'maybe reuse X')"

examples:
  - context: "User wants orchestrator sub-plans, discovery finds sub-plan template"
    output: |
      Existing Features Found:
      - ✅ Sub-plan template (`orchestrators/SUB-PLAN-TEMPLATE.md`) - 500 lines, 6 sections
      - ✅ Sub-plan tracker (`orchestrators/README.md`) - Status dashboard
      - ✅ Folder structure (`src/orchestration_3_0/`) - 15 directories created
      
      Coverage Table:
      | Sub-plan structure | 100% | `SUB-PLAN-TEMPLATE.md` | None - already exists |
      | Progress tracking | 100% | `orchestrators/README.md` | None - already exists |
      | Individual plans | 0% | N/A | Need to create 10 sub-plans |

usage_notes:
  - "Run Feature Discovery scan BEFORE generating this template"
  - "If no existing features found, still show this template with 'No matches' message"
  - "Always highlight reuse opportunities to prevent duplication"
  - "If user already knows about existing features, skip this phase"
  - "Use semantic search + grep for comprehensive discovery"
