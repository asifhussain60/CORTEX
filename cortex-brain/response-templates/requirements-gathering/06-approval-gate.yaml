name: "Requirements Gathering - Approval Gate"
phase: "Phase 5: Approval Gate"
purpose: "Final requirements review and explicit user approval before planning"
audience: "User (final sign-off)"

template: |
  ## ✅ CORTEX Requirements Approval
  **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
  
  ---
  
  ### 🎯 Final Requirements Summary
  
  **Project/Feature:** {project_name}
  
  **Total Iterations:** {total_iterations}
  
  **Last Updated:** {last_updated}
  
  ---
  
  ### 📋 Finalized Requirements
  
  {finalized_requirements}
  
  ---
  
  ### ✨ Approved Enhancements
  
  {approved_enhancements}
  
  ---
  
  ### 📊 Effort & Complexity Summary
  
  | Enhancement | Complexity | LOC Estimate | Time Estimate | Priority |
  |-------------|------------|--------------|---------------|----------|
  {effort_summary_table}
  
  **Total Effort:** {total_effort}
  
  ---
  
  ### 📈 Expected Outcomes
  
  **Success Criteria:**
  {success_criteria}
  
  **Deliverables:**
  {deliverables}
  
  **Timeline:**
  {timeline}
  
  ---
  
  ### 🔒 Approval Checkpoint
  
  **Before Proceeding:**
  - ✅ All requirements clearly defined
  - ✅ Enhancements prioritized
  - ✅ Effort estimated
  - ✅ Success criteria established
  - ✅ Timeline agreed upon
  
  **Your Approval Required:**
  
  {approval_prompt}
  
  ---
  
  ### 🔍 Next Steps (Upon Approval)
  
  **Phase 6: Requirements Lock & Planning**
  1. Lock requirements (no further changes without formal change request)
  2. Generate requirements manifest (`requirements-manifest-{timestamp}.yaml`)
  3. Feed manifest to Planning Orchestrator for detailed planning
  4. Begin execution based on approved plan
  
  **Your Decision:** Do you approve these requirements? (Reply: APPROVED / NEEDS CHANGES)

variables:
  project_name:
    type: string
    description: "Name of project/feature being planned"
    required: true
    
  total_iterations:
    type: integer
    description: "Total refinement iterations completed"
    required: true
    
  last_updated:
    type: string
    format: "YYYY-MM-DD HH:MM"
    description: "Timestamp of last requirement update"
    required: true
    
  finalized_requirements:
    type: string
    description: "Complete list of finalized requirements (numbered)"
    required: true
    
  approved_enhancements:
    type: string
    description: "Complete list of approved enhancements (numbered with descriptions)"
    required: true
    
  effort_summary_table:
    type: string
    description: "Table rows showing enhancement → complexity → LOC → time → priority"
    required: true
    
  total_effort:
    type: string
    description: "Total LOC + total time + overall complexity (e.g., '500 LOC, 12 hours, MEDIUM')"
    required: true
    
  success_criteria:
    type: list
    description: "Measurable success criteria (SMART goals)"
    required: true
    
  deliverables:
    type: list
    description: "Concrete deliverables that will be produced"
    required: true
    
  timeline:
    type: string
    description: "Estimated timeline (e.g., 'Week 1-2', '3 days', 'Sprint 5')"
    required: true
    
  approval_prompt:
    type: string
    description: "Final approval question tailored to project context"
    required: true

validation_rules:
  - rule: "finalized_requirements must match requirements from last iteration"
  - rule: "approved_enhancements must match enhancements from last iteration"
  - rule: "effort_summary_table must match complexity estimations from last iteration"
  - rule: "success_criteria must be measurable (avoid 'improve', use '50% faster')"
  - rule: "deliverables must be concrete artifacts (files, modules, documentation)"
  - rule: "timeline must be specific (dates or sprint numbers)"

examples:
  - context: "User approves orchestrator sub-plan generation with validation"
    output: |
      Project: Orchestrator Sub-Plan Generation System
      
      Total Iterations: 2
      
      Last Updated: 2025-12-10 15:30
      
      Finalized Requirements:
      1. Sub-plan template exists (✅ DONE)
      2. Individual sub-plans generated (10 documents from template)
      3. Pre-populated orchestrator data (from hardcoded metadata)
      4. Validation checks (ensure all 6 sections complete)
      5. Progress tracking (update orchestrators/README.md)
      
      Approved Enhancements:
      1. **Sub-Plan Generation Script** (HIGH VALUE)
         - Python script reads template + hardcoded metadata → generates 10 files
         - Includes validation hooks for 6-section completeness
         - 250 LOC, 5 hours
      
      2. **Sub-Plan Validation Engine** (HIGH VALUE)
         - Validation rules for each section (Existing State, New Structure, Migration, Tests, Wiring, Removal)
         - Error reporting for missing/incomplete sections
         - 150 LOC, 4 hours
      
      Effort Summary:
      | Sub-Plan Generation Script | HIGH | 250 LOC | 5 hours | P0 (Critical) |
      | Sub-Plan Validation Engine | MEDIUM | 150 LOC | 4 hours | P0 (Critical) |
      
      Total Effort: 400 LOC, 9 hours, HIGH complexity
      
      Success Criteria:
      - ✅ All 10 sub-plans generated in <5 minutes
      - ✅ 100% validation pass rate (all 6 sections complete)
      - ✅ Zero manual edits needed for basic structure
      - ✅ Consistent formatting across all sub-plans
      
      Deliverables:
      1. `scripts/generate_sub_plans.py` (250 LOC)
      2. `scripts/validate_sub_plans.py` (150 LOC)
      3. 10 sub-plan documents (`orchestrators/*-plan.md`)
      4. Updated progress tracker (`orchestrators/README.md`)
      
      Timeline: 1-2 days (within Week 0 of orchestration master plan)
      
      Approval Prompt:
      **Do you approve:**
      - ✅ Automated sub-plan generation (vs. manual creation)
      - ✅ Hardcoded metadata (vs. YAML config)
      - ✅ Validation enforcement (vs. manual review)
      - ✅ 400 LOC, 9 hours effort estimate
      - ✅ 1-2 day timeline for completion
      
      **Reply APPROVED to lock these requirements and begin implementation.**

usage_notes:
  - "This template is FINAL gate before planning/execution begins"
  - "Require explicit 'APPROVED' from user (not just 'ok' or 'yes')"
  - "If user says 'NEEDS CHANGES', return to Phase 4 (Iterative Refinement)"
  - "Upon approval, generate requirements manifest YAML file"
  - "Lock requirements - further changes require formal change request process"
  - "Feed manifest to Planning Orchestrator for detailed planning"

approval_keywords:
  approved: ["APPROVED", "approve", "approved ✅", "looks good - approve"]
  needs_changes: ["NEEDS CHANGES", "needs changes", "wait", "not yet", "modify", "change"]
  
post_approval_actions:
  - "Generate requirements-manifest-{timestamp}.yaml with all approved details"
  - "Save manifest to cortex-brain/documents/planning/requirements-manifests/"
  - "Update conversation context with locked requirements"
  - "Trigger Planning Orchestrator with manifest as input"
  - "Begin TDD workflow (RED phase) for implementation"

requirements_manifest_schema:
  project_name: string
  approved_date: timestamp
  total_iterations: integer
  requirements: list[string]
  enhancements: list[object]
  effort: object
    total_loc: integer
    total_hours: float
    complexity: enum[LOW, MEDIUM, HIGH]
  success_criteria: list[string]
  deliverables: list[string]
  timeline: string
  approved_by: string (user identifier)
  manifest_version: "1.0"
