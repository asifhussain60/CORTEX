name: "Requirements Gathering - Enhancement Proposal"
phase: "Phase 3: Enhancement Proposal"
purpose: "Present CORTEX's analysis of gaps and proposed enhancements with rationale"
audience: "User (for review and feedback)"

template: |
  ## 💡 CORTEX Enhancement Proposal
  **Author:** Asif Hussain | **GitHub:** github.com/asifhussain60/CORTEX
  
  ---
  
  ### 🎯 Proposal Overview
  
  **Based on your requirements and discovery context, CORTEX proposes the following enhancements:**
  
  {overview}
  
  ---
  
  ### 🔍 Gap Analysis
  
  | Requirement | Current State | Gap | Proposed Enhancement | Impact |
  |-------------|---------------|-----|----------------------|--------|
  {gap_analysis_table}
  
  ---
  
  ### ✨ Proposed Enhancements
  
  {enhancements}
  
  ---
  
  ### 📊 Complexity & Effort Estimation
  
  {complexity_estimation}
  
  ---
  
  ### 🔀 Alternative Approaches
  
  {alternatives}
  
  ---
  
  ### 📈 Expected Impact
  
  **Benefits:**
  {benefits}
  
  **Risks:**
  {risks}
  
  **Mitigation Strategies:**
  {mitigations}
  
  ---
  
  ### 🔍 Next Steps
  
  **Proceeding to Phase 4:** Iterative Refinement
  - Present this proposal for your review
  - Accept modifications and feedback
  - Iterate until requirements are finalized
  
  **Your Feedback:** Do you approve these enhancements, or would you like modifications?

variables:
  overview:
    type: string
    description: "High-level summary of all proposed enhancements (2-3 sentences)"
    required: true
    
  gap_analysis_table:
    type: string
    description: "Table rows showing requirement → current → gap → proposal → impact"
    required: true
    
  enhancements:
    type: string
    description: "Detailed description of each enhancement (numbered list with rationale)"
    required: true
    
  complexity_estimation:
    type: string
    description: "Complexity breakdown by enhancement (LOW/MEDIUM/HIGH with LOC/time estimates)"
    required: true
    
  alternatives:
    type: string
    description: "Alternative approaches considered (with pros/cons for each)"
    required: true
    
  benefits:
    type: list
    description: "Expected benefits (measurable where possible)"
    required: true
    
  risks:
    type: list
    description: "Potential risks or challenges"
    required: true
    
  mitigations:
    type: list
    description: "Risk mitigation strategies (one per risk)"
    required: true

validation_rules:
  - rule: "gap_analysis_table must have at least 3 rows"
  - rule: "enhancements must include rationale (WHY, not just WHAT)"
  - rule: "complexity_estimation must provide LOC + time estimates"
  - rule: "alternatives must have at least 2 options with pros/cons"
  - rule: "benefits must be specific, not generic ('faster' vs '50% faster')"
  - rule: "each risk must have corresponding mitigation"

examples:
  - context: "User wants orchestrator sub-plans, discovery found template, CORTEX proposes creation automation"
    output: |
      Overview: Based on your requirement for sub-plans and the existing template, CORTEX proposes automating sub-plan generation with a script that creates 10 documents from the template, pre-populating orchestrator-specific data.
      
      Gap Analysis Table:
      | Sub-plan template | Exists | None | N/A | Template ready |
      | Individual plans | Missing | 10 plans needed | Auto-generate from template | Eliminate manual copy-paste |
      | Pre-population | Manual | No orchestrator data | Script with metadata injection | 80% faster creation |
      
      Enhancements:
      1. **Sub-Plan Generation Script** (HIGH VALUE)
         - Rationale: Manual creation of 10 similar documents is error-prone and time-consuming
         - Implementation: Python script reads template + orchestrator metadata → generates 10 files
         - Benefit: Consistent structure, pre-populated data, 80% time savings
      
      2. **Metadata Configuration File** (MEDIUM VALUE)
         - Rationale: Orchestrator details (LOC, files, purpose) currently scattered in master plan
         - Implementation: YAML file with orchestrator metadata (name, LOC, files, purpose)
         - Benefit: Single source of truth, easy updates, reusable for other tooling
      
      Complexity Estimation:
      - Enhancement 1: MEDIUM (200 LOC, 4 hours) - Python script + template parsing
      - Enhancement 2: LOW (100 LOC, 2 hours) - YAML config + validation
      - Total: MEDIUM (300 LOC, 6 hours)
      
      Alternatives:
      1. **Manual Creation** (Baseline)
         - Pros: No development time, full control
         - Cons: Error-prone, time-consuming (4-6 hours), inconsistent structure
      
      2. **Template + Snippets** (Low Effort)
         - Pros: Faster than fully manual, no scripting needed
         - Cons: Still repetitive, data entry errors, no validation
      
      3. **Full Automation** (Proposed)
         - Pros: Consistent, fast (5 minutes), validated, reusable
         - Cons: Initial development time (6 hours)

usage_notes:
  - "Generate proposals AFTER discovery context injection (Phase 2)"
  - "Base proposals on evidence from discovery scan"
  - "Always include rationale (WHY) for each enhancement"
  - "Prioritize enhancements by value vs. complexity"
  - "Provide alternatives so user can choose approach"
  - "If no enhancements needed (requirements fully met), say so explicitly"

proposal_categories:
  - "Automation (reduce manual work)"
  - "Enhancement (improve existing functionality)"
  - "New Feature (add missing capability)"
  - "Refactoring (improve code quality without changing behavior)"
  - "Integration (connect with other systems/orchestrators)"
  - "Documentation (improve clarity, add examples)"

complexity_scale:
  LOW:
    description: "<200 LOC, <4 hours, minimal risk"
    examples: ["Config file", "Utility function", "Template update"]
  MEDIUM:
    description: "200-800 LOC, 4-16 hours, moderate risk"
    examples: ["Script automation", "Module creation", "Integration"]
  HIGH:
    description: ">800 LOC, >16 hours, significant risk"
    examples: ["New orchestrator", "Architecture change", "Major refactoring"]
