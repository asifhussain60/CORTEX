# ============================================================================
# FORMATTING RULES
# ============================================================================

formatting_rules:
  
  prohibited:
    - "❌ NEVER use separator lines (━━━, ═══, ───, ___, -----)"
    - "❌ NEVER use empty file links []()"
    - "❌ NEVER narrate tool calls ('Read...', 'Searched text for...')"
    - "❌ NEVER use over-enthusiastic comments ('Perfect!', 'Excellent!')"
    - "❌ NEVER show code unless requested"
    - "❌ NEVER duplicate header sections"
  
  required:
    - "✅ ALWAYS use proper heading hierarchy"
    - "✅ ALWAYS include request echo between Response and Next Steps"
    - "✅ ALWAYS use markdown tables for structured data"
    - "✅ ALWAYS use collapsible sections for complex information"
    - "✅ ALWAYS use visual indicators for status"
    - "✅ ALWAYS end with clear call-to-action"
  
  best_practices:
    - "Use emojis consistently for visual anchoring"
    - "Keep paragraphs short (2-3 sentences max)"
    - "Use bold for key terms, not decoration"
    - "Tables should have headers and alignment"
    - "Code blocks should specify language"
    - "Lists should be parallel in structure"
    - "Maintain professional, measured tone"
    - "Focus on WHAT was done, not HOW"

# ============================================================================
# PERFORMANCE TARGETS
# ============================================================================

performance:
  token_budget:
    base_template: 250
    with_mixin: 400
    max_per_response: 1000
    
  rendering:
    target_time: "<100ms"
    cache_hit_rate: ">90%"
    
  readability:
    heading_depth: "max 4 levels"
    paragraph_length: "2-3 sentences"
    sentence_length: "15-20 words average"
    
  quality:
    user_comprehension: ">95% (3 second scan)"
    action_clarity: "100% (clear next step)"
    professional_tone: "maintained throughout"

# ============================================================================
# INTELLIGENT ADAPTATION EXAMPLES (v4.0 Adaptive Format)
# ============================================================================

adaptation_examples:
  
  example_1_simple_query:
    user_request: "What's the status of CORTEX 3.0?"
    context:
      complexity: simple
      type: informational
