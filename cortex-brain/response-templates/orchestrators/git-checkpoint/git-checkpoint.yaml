category: orchestrators/git-checkpoint
templates:
  git_checkpoint:
    inherits_from: core/base-templates/adaptive-base.yaml
    name: Git Checkpoint
    triggers:
    - git checkpoint
    - checkpoint
    - save checkpoint
    - commit checkpoint
    response_type: operational
    expected_orchestrator: git_checkpoint_orchestrator
    operation_name: GitCheckpoint
    sections:
      understanding_scope_content: You want to create a git checkpoint during TDD workflow
      approach_considerations_content: No significant challenges - Automated checkpoint with TDD phase detection
      response_content: '## 🔖 Git Checkpoint (TDD Workflow)


        **Automated git commits** during TDD Mastery workflow phases


        **TDD Phase Detection:**


        **RED Phase Checkpoint:**

        - Commit message: "🔴 RED: [feature] - Tests fail as expected"

        - Staged files: Test files only

        - Verification: Tests MUST fail before commit

        - Brain protection: Validates RED phase compliance


        **GREEN Phase Checkpoint:**

        - Commit message: "🟢 GREEN: [feature] - Tests pass"

        - Staged files: Implementation + tests

        - Verification: Tests MUST pass before commit

        - Brain protection: Validates GREEN phase compliance


        **REFACTOR Phase Checkpoint:**

        - Commit message: "♻️ REFACTOR: [feature] - Code optimized"

        - Staged files: Refactored code

        - Verification: Tests still pass + metrics improved

        - Brain protection: Validates REFACTOR improvements


        **Checkpoint Features:**

        - ✅ Auto-stage relevant files

        - ✅ Phase-appropriate commit messages

        - ✅ Pre-commit validation (tests, linting)

        - ✅ Brain state snapshot

        - ✅ Rollback capability


        **Git Isolation Enforcement:**

        - CORTEX code: Never committed to user repos

        - User code: Never committed to CORTEX repo

        - Test location: App tests in user repo, CORTEX tests in `tests/`


        **Note:** Git checkpoint is exclusively for TDD Mastery workflow. For general
        commits, use "commit" command which runs commit_push_sync orchestrator.

        '
      impact_changes_content: Create git checkpoint during TDD workflow
      next_steps_content: '**Git Checkpoint Usage:**


        **Automatic (Recommended):**

        - TDD Mastery workflow auto-checkpoints after each phase

        - No manual intervention needed


        **Manual:**

        1. Say "git checkpoint red" after writing failing test

        2. Say "git checkpoint green" after implementation passes

        3. Say "git checkpoint refactor" after code optimization


        **For General Commits:** Use "commit" command instead (not TDD-specific)

        '
