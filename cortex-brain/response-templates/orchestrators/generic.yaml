schema_version: '5.0'
layer: 3
orchestrator: generic
description: |
  Generic fallback templates for orchestrators without specific Layer 3 files.
  Provides basic success/failure/progress templates.

inherits:
  - mandatory-header.yaml
  - executive-summary.yaml

templates:
  generic_success:
    trigger: "operation complete"
    placeholders:
      operation: "Operation"
      details: "completed successfully"
    content: |
      {operation} {details}.
      
      ✅ **Outcomes**
      • Operation completed successfully
      
      🎯 **Impact**
      • Requested capability now operational
  
  generic_failure:
    trigger: "operation failed"
    placeholders:
      operation: "Operation"
      error_details: "Unknown error"
    content: |
      ⚠️ **Operation Failed**
      
      {operation} encountered an error:
      {error_details}
      
      ⚠️ **Risks**
      • Operation did not complete
      • May require manual intervention
      
      📋 **Next Steps**
      • Review error details
      • Retry with corrected inputs
  
  generic_progress:
    trigger: "operation in progress"
    placeholders:
      operation: "Operation"
      status: "running"
      progress_percent: "50"
    content: |
      ⚙️ **In Progress**
      
      {operation} is {status} ({progress_percent}% complete).
      
      ⚙️ **In Progress**
      • Operation executing
      • Will report when complete

added_in_phase: Phase 9.7
related_acs:
  - AC-TEMPLATE-002
