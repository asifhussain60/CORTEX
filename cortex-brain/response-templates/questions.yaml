  question_cortex_differences:
    content: '🆚 **CORTEX vs Standard GitHub Copilot**


      **GitHub Copilot (Standard):**

      ❌ No memory across chats (amnesia)

      ❌ No learned patterns from your code

      ❌ No project-specific context

      ❌ Limited to current conversation

      ❌ No strategic planning


      **CORTEX Enhancement:**

      ✅ Long-term memory (last 20 conversations)

      ✅ Learns patterns from every interaction

      ✅ Project-specific knowledge graph

      ✅ 4-tier brain architecture

      ✅ 10 specialist agents coordinating

      ✅ Strategic + tactical planning


      **Concrete Example:**


      Without CORTEX:

      You: "Add a login button"

      Copilot: Creates button ✅


      [Next chat - Copilot forgets]

      You: "Make it purple"

      Copilot: "Make what purple?" ❌


      With CORTEX:

      You: "Add a login button"

      CORTEX: Creates button, stores context ✅


      [Next chat - CORTEX remembers]

      You: "Make it purple"

      CORTEX: "Making login button purple" ✅


      **Architecture:**

      • Tier 1: Working Memory (20 conversations)

      • Tier 2: Knowledge Graph (learned patterns)

      • Tier 3: Development Context (git, tests, metrics)

      • Tier 0: Protection Layer (governance rules)

      '
    context_needed: false
    metadata:
      category: system
      question_type: comparison
    response_type: detailed
    triggers:
    - difference between cortex and
    - cortex vs copilot
    - how is cortex different
    - why use cortex
    - cortex advantages
    verbosity: detailed
