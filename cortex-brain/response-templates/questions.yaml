  question_how_cortex_works:
    content: '🧠 **How CORTEX Works - Simple Explanation**


      **The Problem:**

      GitHub Copilot is like an amnesiac intern - brilliant but forgets everything after each chat.


      **The Solution:**

      CORTEX gives Copilot a brain with long-term memory and learning capabilities.


      **4-Tier Brain Architecture:**


      **Tier 0: Instinct (Protection)**

      • Immutable governance rules

      • SKULL protection (test validation)

      • Prevents untested changes


      **Tier 1: Working Memory**

      • Last 20 conversations stored

      • FIFO queue (oldest removed)

      • SQLite database


      **Tier 2: Knowledge Graph**

      • Learned patterns from interactions

      • File relationships

      • Anti-patterns detected

      • Pattern decay (confidence decreases over time)


      **Tier 3: Development Context**

      • Git metrics (commits, velocity)

      • Test coverage

      • Project health


      **10 Specialist Agents:**


      LEFT BRAIN (Tactical):

      • Executor - Implements features

      • Tester - Creates tests

      • Validator - Quality checks

      • Work Planner - Task breakdown

      • Documenter - Auto-docs


      RIGHT BRAIN (Strategic):

      • Intent Detector - Routes requests

      • Architect - System design

      • Health Validator - Project diagnosis

      • Pattern Matcher - Finds solutions

      • Learner - Accumulates wisdom


      **Workflow:**

      1. You ask question → Intent Detector routes

      2. Appropriate agent activates

      3. Context injected from Tiers 1-3

      4. Response generated with memory

      5. Interaction stored for future learning

      '
    context_needed: false
    metadata:
      category: system
      question_type: architecture_explanation
    response_type: narrative
    triggers:
    - how does cortex work
    - explain cortex
    - cortex architecture
    - how cortex thinks
    verbosity: detailed
