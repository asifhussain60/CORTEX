    format: standard_5_part
    response_type: security_analysis
    expected_orchestrator: ThreatModelingOrchestrator
    
    triggers:
      - "security review"
      - "threat model"
      - "owasp"
    
    required_sections:
      - header_standard
      - section_understanding
      - section_response
      - section_next_steps

  threat_analysis_summary:
    id: template_threat_analysis_summary
    name: "Threat Analysis Summary"
    description: "Quick threat analysis summary for chat"
    format: compact
    response_type: security_analysis
    expected_orchestrator: PlanningOrchestrator
    
    triggers:
      - "analyze threats"
      - "threat analysis"
      - "security threats"
      - "stride analysis"
    
    required_sections:
      - header_compact
      - section_response
      - section_next_steps
    
    content_structure:
      - risk_level_badge
      - threat_count_summary
      - critical_threats_list
      - high_threats_list
      - mitigation_summary
      - owasp_coverage_brief

  threat_analysis_detailed:
    id: template_threat_analysis_detailed
    name: "Detailed Threat Analysis Report"
    description: "Comprehensive threat report for markdown file"
    format: report
    response_type: security_analysis
    expected_orchestrator: PlanningOrchestrator
    
    triggers:
      - "detailed threat analysis"
      - "full threat report"
      - "complete security analysis"
    
    required_sections:
      - header_report
      - executive_summary
      - stride_analysis
      - owasp_mapping
      - mitigation_strategies
      - implementation_guidance
      - risk_assessment
      - recommendations
    
    content_structure:
      - feature_overview
      - risk_level_assessment
      - stride_categories:
          - spoofing
          - tampering
          - repudiation
          - information_disclosure
          - denial_of_service
          - elevation_of_privilege
      - owasp_top_10_mapping
      - threat_details_table
      - mitigation_strategies_with_code
      - implementation_timeline
      - verification_checklist

