# Response Template Definitions
# Version: 3.3.0
# Purpose: Template structures with metadata (no hard-coded content)
# Part of: Response Template System Refactor (Phase 5)

schema_version: '3.3'
last_updated: '2025-12-02'
refactor_phase: 'modular_architecture'

# ============================================================================
# TEMPLATE DEFINITIONS - Structure + Metadata (content in components)
# ============================================================================

templates:
  # -------------------------------------------------------------------------
  # ONBOARDING TEMPLATES
  # -------------------------------------------------------------------------
  onboarding:
    id: template_onboarding
    name: "User Onboarding"
    description: "Interactive onboarding process for new users"
    format: standard_5_part
    response_type: interactive
    expected_orchestrator: OnboardingOrchestrator
    
    triggers:
      - "onboard"
      - "onboarding"
      - "setup profile"
      - "first time"
      - "new user"
      - "onboard application --app-name"
    
    required_sections:
      - header_standard
      - section_understanding
      - section_challenge
      - section_response
      - section_request_echo
      - section_next_steps
    
    optional_sections: []
    
    default_content:
      operation_name: "Onboarding"
      understanding_content: "You're starting the onboarding process to personalize CORTEX for your experience level, interaction preferences, and tech stack."
      challenge_content: "No Challenge - This quick 3-question setup helps CORTEX adapt to your needs."
      request_echo_content: "Set up CORTEX profile with application name"

  # -------------------------------------------------------------------------
  # HELP & DOCUMENTATION
  # -------------------------------------------------------------------------
  help_table:
    id: template_help_table
    name: "Help Table"
    description: "Command reference in table format"
    format: compact
    response_type: reference
    expected_orchestrator: null
    
    triggers:
      - "help"
      - "commands"
      - "what can you do"
      - "operations"
    
    required_sections:
      - header_compact
      - section_response
      - section_next_steps
    
    optional_sections:
      - section_request_echo

  help_detailed:
    id: template_help_detailed
    name: "Detailed Help"
    description: "Comprehensive command documentation"
    format: standard_5_part
    response_type: documentation
    expected_orchestrator: null
    
    triggers:
      - "help detailed"
      - "full help"
      - "all commands"
    
    required_sections:
      - header_standard
      - section_response
      - section_next_steps

