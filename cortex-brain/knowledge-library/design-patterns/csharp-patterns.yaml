metadata:
  version: '1.0.0'
  domain: design-patterns
  subdomain: object-oriented
  author: 'Asif Hussain'
  created: '2025-12-29'
  source: 'Gang of Four Design Patterns'
  keywords:
    - design-patterns
    - csharp
    - object-oriented
    - creational
    - structural
    - behavioral
    - gang-of-four

pattern_selection_guide:
  creational: "Use when object creation logic needs to be decoupled from usage"
  structural: "Use when composing objects into larger structures"
  behavioral: "Use when defining communication patterns between objects"

creational_patterns:
  singleton:
    intent: "Ensure only one instance exists and provide global access"
    category: "creational"
    when_to_use:
      - "Single database connection pool"
      - "Configuration manager"
      - "Logging service"
    csharp_implementation:
      thread_safe: "Use Lazy<T> for thread-safe lazy initialization"
      example_signature: "public static Singleton Instance => _lazy.Value"
    considerations:
      - "Can make unit testing difficult (global state)"
      - "Thread safety must be explicitly handled"
      - "Violates Single Responsibility Principle"
      
  factory_method:
    intent: "Define interface for creating objects, let subclasses decide type"
    category: "creational"
    when_to_use:
      - "Unknown types at compile time"
      - "Extensible product families"
      - "Reusable creation logic"
    participants:
      - "Creator (declares factory method)"
      - "ConcreteCreator (overrides factory method)"
      - "Product (interface for created objects)"
      - "ConcreteProduct (implements Product)"
    csharp_notes:
      - "Use abstract or virtual factory method"
      - "Return interface type, not concrete"
      
  abstract_factory:
    intent: "Create families of related objects without specifying concrete classes"
    category: "creational"
    when_to_use:
      - "Multiple product families"
      - "Related objects must be used together"
      - "Cross-platform UI components"
    structure:
      - "AbstractFactory (declares creation methods)"
      - "ConcreteFactory (implements for specific family)"
      - "AbstractProduct (interface per product type)"
      - "ConcreteProduct (family-specific implementation)"
    comparison_with_factory_method:
      - "Factory Method: one product"
      - "Abstract Factory: family of products"
      
  builder:
    intent: "Separate complex object construction from representation"
    category: "creational"
    when_to_use:
      - "Complex objects with many optional parts"
      - "Step-by-step construction process"
      - "Different representations needed"
    participants:
      - "Director (orchestrates construction)"
      - "Builder (abstract interface)"
      - "ConcreteBuilder (implements construction)"
      - "Product (complex object being built)"
    csharp_fluent_pattern:
      description: "Return 'this' for method chaining"
      example: "builder.SetName('X').SetAge(25).Build()"
      
  prototype:
    intent: "Create new objects by copying existing ones"
    category: "creational"
    when_to_use:
      - "Costly object creation"
      - "Avoid subclassing for configuration"
      - "Dynamic object composition"
    csharp_implementation:
      interface: "ICloneable or custom IPrototype<T>"
      shallow_copy: "MemberwiseClone()"
      deep_copy: "Serialize/deserialize or manual copy"
    considerations:
      - "Deep vs shallow copy semantics"
      - "Circular reference handling"

structural_patterns:
  adapter:
    intent: "Convert interface to one clients expect"
    category: "structural"
    when_to_use:
      - "Integrate legacy code"
      - "Third-party library incompatibility"
      - "Multiple incompatible interfaces"
    types:
      class_adapter: "Inheritance-based (multiple inheritance)"
      object_adapter: "Composition-based (preferred in C#)"
    participants:
      - "Target (expected interface)"
      - "Adaptee (existing incompatible class)"
      - "Adapter (bridges the gap)"
      
  bridge:
    intent: "Separate abstraction from implementation for independent variation"
    category: "structural"
    when_to_use:
      - "Avoid permanent binding"
      - "Both hierarchies need extension"
      - "Implementation changes shouldn't affect clients"
    structure:
      - "Abstraction (defines interface, holds implementor)"
      - "RefinedAbstraction (extends abstraction)"
      - "Implementor (implementation interface)"
      - "ConcreteImplementor (specific implementation)"
    vs_adapter:
      - "Adapter: fix existing incompatibility"
      - "Bridge: design for future flexibility"
      
  decorator:
    intent: "Add responsibilities dynamically without subclassing"
    category: "structural"
    when_to_use:
      - "Add behavior at runtime"
      - "Avoid explosion of subclasses"
      - "Optional or combinable features"
    csharp_example:
      - "Stream wrappers (BufferedStream, GZipStream)"
      - "ASP.NET middleware pipeline"
    participants:
      - "Component (interface)"
      - "ConcreteComponent (base implementation)"
      - "Decorator (wraps component, implements interface)"
      - "ConcreteDecorator (adds specific behavior)"
    key_principle: "Decorator IS-A and HAS-A Component"
    
  facade:
    intent: "Provide simplified interface to complex subsystem"
    category: "structural"
    when_to_use:
      - "Simplify complex API"
      - "Reduce coupling to subsystem"
      - "Layer system architecture"
    csharp_examples:
      - "HttpClient (simplifies HTTP operations)"
      - "DbContext in Entity Framework"
    considerations:
      - "Don't make facade a god object"
      - "Subsystem still accessible if needed"
      
  proxy:
    intent: "Provide surrogate to control access to object"
    category: "structural"
    types:
      virtual_proxy: "Lazy loading expensive objects"
      protection_proxy: "Access control"
      remote_proxy: "Local representative of remote object"
      caching_proxy: "Cache results of operations"
    csharp_implementations:
      - "Lazy<T> for virtual proxy"
      - "Castle DynamicProxy for AOP"
      - "WCF client proxies"
      
  flyweight:
    intent: "Share objects to support large numbers efficiently"
    category: "structural"
    when_to_use:
      - "Large number of similar objects"
      - "Storage costs are high"
      - "Extrinsic state can be externalized"
    key_concepts:
      intrinsic_state: "Shared, immutable data stored in flyweight"
      extrinsic_state: "Context-specific data passed by client"
    csharp_examples:
      - "String interning"
      - "Font objects in text editors"
      
  composite:
    intent: "Compose objects into tree structures for part-whole hierarchies"
    category: "structural"
    when_to_use:
      - "Tree structures of objects"
      - "Uniform treatment of individual and composite objects"
    participants:
      - "Component (interface for all)"
      - "Leaf (no children)"
      - "Composite (has children, delegates)"
    csharp_examples:
      - "UI control hierarchies"
      - "File system (files and directories)"

behavioral_patterns:
  template_method:
    intent: "Define algorithm skeleton, let subclasses override steps"
    category: "behavioral"
    when_to_use:
      - "Common algorithm structure"
      - "Different implementations of steps"
      - "Control extension points"
    csharp_implementation:
      - "Base class with sealed template method"
      - "Protected virtual/abstract hook methods"
    vs_strategy:
      - "Template Method: inheritance-based"
      - "Strategy: composition-based"
      
  strategy:
    intent: "Define family of algorithms, make them interchangeable"
    category: "behavioral"
    when_to_use:
      - "Multiple algorithms for same task"
      - "Avoid conditional statements"
      - "Runtime algorithm selection"
    csharp_approaches:
      interface_based: "IStrategy interface with implementations"
      delegate_based: "Func<T> or Action delegates"
    examples:
      - "Sorting algorithms"
      - "Payment processing"
      - "Compression strategies"
      
  command:
    intent: "Encapsulate request as object for parameterization and queuing"
    category: "behavioral"
    when_to_use:
      - "Parameterize objects with operations"
      - "Queue or log operations"
      - "Support undo functionality"
    participants:
      - "Command (interface with Execute)"
      - "ConcreteCommand (binds receiver to action)"
      - "Invoker (asks command to execute)"
      - "Receiver (knows how to perform)"
    csharp_examples:
      - "ICommand in WPF/MVVM"
      - "Menu actions"
      - "Macro recording"
      
  memento:
    intent: "Capture object state for later restoration without exposing internals"
    category: "behavioral"
    when_to_use:
      - "Undo/redo functionality"
      - "Snapshot and restore"
      - "Transactional rollback"
    participants:
      - "Originator (creates memento of its state)"
      - "Memento (stores state, opaque to caretaker)"
      - "Caretaker (manages memento lifecycle)"
    considerations:
      - "Memory usage for large state"
      - "Immutability of memento"
      
  mediator:
    intent: "Define object that encapsulates how objects interact"
    category: "behavioral"
    when_to_use:
      - "Complex communication patterns"
      - "Reduce direct dependencies"
      - "Centralize control logic"
    csharp_examples:
      - "MediatR library for CQRS"
      - "Message brokers"
      - "Dialog controllers"
    benefits:
      - "Loose coupling between colleagues"
      - "Centralized communication logic"
    drawbacks:
      - "Mediator can become complex"
      
  observer:
    intent: "Define one-to-many dependency for automatic notification"
    category: "behavioral"
    when_to_use:
      - "State changes affect multiple objects"
      - "Loose coupling between subject and observers"
    csharp_implementations:
      events: "event keyword with EventHandler<T>"
      iobservable: "IObservable<T>/IObserver<T> for reactive"
    considerations:
      - "Memory leaks from unsubscribed handlers"
      - "Order of notification"
      - "Exception handling in observers"
      
  chain_of_responsibility:
    intent: "Pass request along chain until handled"
    category: "behavioral"
    when_to_use:
      - "Multiple potential handlers"
      - "Handler not known in advance"
      - "Request processing pipeline"
    csharp_examples:
      - "ASP.NET Core middleware"
      - "Exception handling"
      - "Logging filters"
    structure:
      - "Handler (interface with HandleRequest)"
      - "ConcreteHandler (handles or passes on)"
      
  state:
    intent: "Allow object to alter behavior when internal state changes"
    category: "behavioral"
    when_to_use:
      - "Behavior depends on state"
      - "Avoid large conditional statements"
      - "State machine implementations"
    participants:
      - "Context (maintains current state)"
      - "State (interface for behavior)"
      - "ConcreteState (implements state-specific behavior)"
    vs_strategy:
      - "State: transitions managed by states"
      - "Strategy: client selects algorithm"
      
  visitor:
    intent: "Define new operations without changing visited classes"
    category: "behavioral"
    when_to_use:
      - "Many distinct operations on structure"
      - "Classes rarely change"
      - "Accumulating state during traversal"
    double_dispatch:
      description: "Element calls visitor method, passing self"
      pattern: "element.Accept(visitor) -> visitor.Visit(element)"
    considerations:
      - "Adding new element types is difficult"
      - "Breaks encapsulation"
      
  iterator:
    intent: "Access elements sequentially without exposing representation"
    category: "behavioral"
    csharp_implementation:
      interface: "IEnumerable<T>/IEnumerator<T>"
      yield: "yield return for custom iterators"
    benefits:
      - "Uniform traversal interface"
      - "Support multiple traversals"
      - "Lazy evaluation with yield"
      
  interpreter:
    intent: "Define grammar representation and interpreter for language"
    category: "behavioral"
    when_to_use:
      - "Simple, frequent grammar"
      - "Domain-specific languages"
    components:
      - "AbstractExpression"
      - "TerminalExpression"
      - "NonterminalExpression"
      - "Context"
    csharp_examples:
      - "Regular expressions"
      - "Math expression parsers"
