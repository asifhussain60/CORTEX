metadata:
  version: '1.0.0'
  domain: security
  subdomain: microservices
  author: 'Asif Hussain'
  created: '2025-12-29'
  source: 'Pluralsight Microservices Security Course'
  keywords:
    - microservices-security
    - authentication
    - authorization
    - tls
    - mtls
    - oauth2
    - jwt
    - api-gateway
    - service-mesh

service_to_service_security:
  transport_layer_security:
    tls:
      description: "Encrypts data in transit between services"
      components:
        - "Server certificate"
        - "Public/private key pair"
        - "Certificate Authority (CA)"
      when_to_use: "Basic encryption, external communications"
      
    mtls:
      description: "Mutual TLS - both client and server present certificates"
      benefits:
        - "Bilateral authentication"
        - "Zero-trust architecture support"
        - "Protection against man-in-the-middle attacks"
      components:
        - "Server certificate"
        - "Client certificate"
        - "Shared CA trust"
      when_to_use: "Internal service mesh, high-security environments"
      
  implementation_approaches:
    direct_service:
      description: "Each service manages its own TLS configuration"
      pros: "Full control"
      cons: "Complex certificate management"
      
    service_mesh:
      description: "Sidecar proxies handle TLS automatically"
      pros: "Simplified management, consistent policy"
      cons: "Additional infrastructure overhead"

authentication_patterns:
  oauth2:
    description: "Industry standard protocol for authorization"
    flows:
      - name: "Authorization Code"
        use_case: "Web applications with server-side component"
      - name: "Client Credentials"
        use_case: "Service-to-service authentication"
      - name: "Resource Owner Password"
        use_case: "Trusted first-party applications"
    components:
      - "Authorization Server"
      - "Resource Server"
      - "Client Application"
      - "Resource Owner"
      
  openid_connect:
    description: "Identity layer on top of OAuth2"
    adds:
      - "ID Token (identity information)"
      - "UserInfo endpoint"
      - "Standard scopes (openid, profile, email)"
    use_case: "User authentication in addition to authorization"
    
  jwt_tokens:
    structure:
      header: "Algorithm and token type"
      payload: "Claims (sub, exp, iat, custom)"
      signature: "Integrity verification"
    best_practices:
      - "Short expiration times"
      - "Use refresh tokens for session extension"
      - "Validate signature on every request"
      - "Store sensitive claims encrypted"
    security_considerations:
      - "Never store in localStorage (XSS vulnerable)"
      - "Use HttpOnly cookies when possible"
      - "Validate issuer and audience claims"

api_gateway_security:
  role: "Central entry point for all external requests"
  security_functions:
    - name: "Authentication"
      description: "Validate tokens before forwarding requests"
    - name: "Authorization"
      description: "Check permissions at gateway level"
    - name: "Rate Limiting"
      description: "Prevent abuse and DDoS attacks"
    - name: "Request Validation"
      description: "Sanitize and validate input"
    - name: "SSL Termination"
      description: "Handle HTTPS at edge"
      
  patterns:
    gateway_offloading:
      description: "Move cross-cutting concerns to gateway"
      includes:
        - "Authentication"
        - "Logging"
        - "Response caching"
        
    backend_for_frontend:
      description: "Separate gateways per client type"
      examples:
        - "Web BFF"
        - "Mobile BFF"
        - "Partner API Gateway"

rate_limiting:
  purpose: "Protect services from abuse and ensure fair usage"
  strategies:
    - name: "Fixed Window"
      description: "Count requests in fixed time periods"
      pros: "Simple implementation"
      cons: "Burst at window boundaries"
      
    - name: "Sliding Window"
      description: "Rolling time window for counting"
      pros: "Smoother rate limiting"
      cons: "More memory required"
      
    - name: "Token Bucket"
      description: "Tokens replenish at fixed rate"
      pros: "Allows bursts up to bucket size"
      cons: "More complex implementation"
      
    - name: "Leaky Bucket"
      description: "Requests processed at constant rate"
      pros: "Predictable output rate"
      cons: "May delay valid requests"
      
  implementation_levels:
    - "API Gateway"
    - "Per-service rate limiting"
    - "Per-user/tenant quotas"

logging_and_monitoring:
  centralized_logging:
    description: "Aggregate logs from all services"
    tools:
      - "ELK Stack (Elasticsearch, Logstash, Kibana)"
      - "Splunk"
      - "Datadog"
    best_practices:
      - "Structured logging (JSON format)"
      - "Correlation IDs across services"
      - "Sensitive data masking"
      
  security_monitoring:
    key_metrics:
      - "Failed authentication attempts"
      - "Unusual access patterns"
      - "API abuse indicators"
      - "Certificate expiration warnings"
    alerting:
      - "Real-time anomaly detection"
      - "Threshold-based alerts"
      - "Integration with incident management"

service_mesh_security:
  istio:
    description: "Service mesh providing security features out of the box"
    security_features:
      - name: "Automatic mTLS"
        description: "Encrypt all service-to-service traffic"
      - name: "Authorization Policies"
        description: "Fine-grained access control"
      - name: "Request Authentication"
        description: "JWT validation at mesh level"
    components:
      control_plane:
        - "Istiod (configuration management)"
        - "Certificate Authority"
      data_plane:
        - "Envoy sidecars"
        
  authorization_policies:
    elements:
      - "Selector (target workloads)"
      - "Rules (sources, operations)"
      - "Action (ALLOW, DENY)"
    examples:
      - "Allow only specific services to call"
      - "Require specific headers"
      - "Restrict by namespace"

security_testing:
  approaches:
    - name: "SAST (Static Analysis)"
      description: "Analyze code for vulnerabilities"
      tools: ["SonarQube", "Checkmarx", "Veracode"]
      
    - name: "DAST (Dynamic Analysis)"
      description: "Test running application"
      tools: ["OWASP ZAP", "Burp Suite"]
      
    - name: "Dependency Scanning"
      description: "Check for vulnerable dependencies"
      tools: ["Snyk", "Dependabot", "npm audit"]
      
    - name: "Container Scanning"
      description: "Analyze container images"
      tools: ["Trivy", "Clair", "Anchore"]

threat_modeling:
  stride_model:
    threats:
      - name: "Spoofing"
        mitigation: "Strong authentication"
      - name: "Tampering"
        mitigation: "Integrity checks, signatures"
      - name: "Repudiation"
        mitigation: "Audit logging"
      - name: "Information Disclosure"
        mitigation: "Encryption, access control"
      - name: "Denial of Service"
        mitigation: "Rate limiting, scaling"
      - name: "Elevation of Privilege"
        mitigation: "Least privilege, input validation"
        
  microservices_specific_threats:
    - "Service impersonation"
    - "Token theft/replay"
    - "Sidecar bypass"
    - "Network segmentation breach"
    - "Secrets exposure"
