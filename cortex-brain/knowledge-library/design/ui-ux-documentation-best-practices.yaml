## 📋 Checklist for New Documentation Pages

checklist:
  planning:
    - "[ ] Identify user personas for this page"
    - "[ ] Define primary user goal (what do they need to learn?)"
    - "[ ] Determine content depth (Level 1 overview vs Level 2 detail)"
    - "[ ] Choose appropriate visualizations (D3, Mermaid, charts)"
    - "[ ] Plan progressive disclosure (what starts hidden?)"
  
  design:
    - "[ ] Use hub-and-spoke navigation (no wizard Prev/Next)"
    - "[ ] Maintain 2-level maximum hierarchy"
    - "[ ] Apply glassmorphism design standard v4.0"
    - "[ ] Use T1 subtle animations (0.2s transitions)"
