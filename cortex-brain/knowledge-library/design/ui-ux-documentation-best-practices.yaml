## 📚 Documentation-Specific Patterns

documentation_patterns:
  multi_visual_approach:
    title: "Multiple Visualizations per Page"
    description: "Layer different view types to accommodate learning styles"
    structure:
      primary_visualization:
        type: "Interactive D3.js or Mermaid diagram"
        purpose: "High-level overview, exploratory"
        example: "Force-directed graph, Sankey flow"
      
      secondary_visualization:
        type: "Simplified Mermaid flowchart or ER diagram"
        purpose: "Focus on specific workflow or relationships"
        example: "Decision tree, sequence diagram"
      
      tertiary_visualization:
        type: "Statistical chart (bar, line, treemap)"
        purpose: "Quantitative metrics, comparison"
        example: "Module counts, coverage percentages"
    
    spacing: "3rem between visualizations"
  
  contextual_panels:
    title: "Contextual Information Panels"
    description: "Surround visualizations with explanatory text"
    layout: |
      1. Overview panel (What is this?)
      2. PRIMARY VISUALIZATION
      3. How-to-read panel (Interpret visual elements)
      4. Key metrics panel (Impressive numbers)
      5. SECONDARY VISUALIZATION
      6. Real-world example panel (Practical scenario)
      7. TERTIARY VISUALIZATION
      8. Related topics panel (Navigation links)
    
    panel_types:
      info_panel:
        class: "glass-card-info"
        use: "Explanations, definitions, how-tos"
        icon: "🔍, 📖, 🛠️"
      
      metric_panel:
        class: "glass-card-metrics"
        use: "Key performance indicators"
        format: "Label-value pairs in rows"
      
      example_panel:
        class: "glass-card-example"
        use: "Code snippets, scenarios"
        style: "Monospace font, syntax highlighting"
  
  breadcrumb_navigation:
    title: "Breadcrumb Trail"
    description: "Show current location in hierarchy"
    format: "Home / Architecture / SKULL Protection"
    guidelines:
      - "Always visible at top of page"
      - "Each level is clickable link"
      - "Current page not clickable (just text)"
      - "Separator: / or > or →"
      - "Mobile: Collapse to 'Back' button"
  
  footer_navigation:
    title: "Footer Navigation"
    description: "Help users return to hub"
    layout: |
      <footer class="glass-nav-footer">
        <a href="index.html">↑ Back to Architecture</a>
      </footer>
    
    anti_pattern:
      pattern: "Previous/Next links in footer"
      why_bad: "Implies linear progression (wizard pattern)"
      exception: "Step-by-step tutorials only"

