## 📱 Responsive Design

responsive_design:
  mobile_first:
    title: "Mobile-First Approach"
    description: "Design for smallest screen, enhance for larger"
    breakpoints:
      mobile: "320px-767px (default base)"
      tablet: "768px-1023px"
      desktop: "1024px-1439px"
      large: "1440px+"
    guidelines:
      - "Touch targets minimum 44x44px"
      - "Stack layout vertically on mobile"
      - "Hamburger menu for mobile navigation"
      - "Larger text on mobile (16px minimum to prevent zoom)"
      - "Hide non-essential content on mobile"
  
  fluid_typography:
    title: "Fluid Typography"
    description: "Text scales smoothly between breakpoints"
    implementation: |
      /* Clamp for fluid scaling */
      font-size: clamp(16px, 4vw, 24px);
      
      /* CSS Variables for consistency */
      :root {
        --text-sm: clamp(14px, 2.5vw, 16px);
        --text-base: clamp(16px, 4vw, 18px);
        --text-lg: clamp(18px, 4.5vw, 22px);
        --text-xl: clamp(24px, 5vw, 32px);
      }
    guidelines:
      - "Never use fixed pixel sizes for body text"
      - "Use rem/em for scalability"
      - "Test with browser zoom (200%+)"
  
  flexible_images:
    title: "Responsive Images"
    description: "Images adapt to container and screen density"
    implementation: |
      /* Responsive image */
      img {
        max-width: 100%;
        height: auto;
      }
      
      /* SVG preferred for icons/diagrams */
      <svg viewBox="0 0 800 600">...</svg>
      
      /* Picture element for art direction */
      <picture>
        <source media="(min-width: 1024px)" srcset="large.jpg">
        <source media="(min-width: 768px)" srcset="medium.jpg">
        <img src="small.jpg" alt="Description">
      </picture>

