## 🚀 Performance Optimization

performance:
  page_load:
    title: "Fast Initial Load"
    targets:
      first_contentful_paint: "<1.5s"
      largest_contentful_paint: "<2.5s"
      time_to_interactive: "<3.5s"
    
    techniques:
      - "Minify CSS/JS (remove whitespace, comments)"
      - "Defer non-critical JavaScript"
      - "Inline critical CSS (above-the-fold)"
      - "Lazy load images (loading='lazy')"
      - "Use CDN for libraries (D3.js, Mermaid)"
      - "HTTP/2 server push for critical assets"
  
  asset_optimization:
    title: "Asset Optimization"
    images:
      - "WebP format (30-50% smaller than JPEG)"
      - "Responsive images (srcset, sizes attributes)"
      - "SVG for icons/diagrams (scalable, small)"
      - "Compress PNGs (TinyPNG, ImageOptim)"
    
    fonts:
      - "Subset fonts (include only used glyphs)"
      - "WOFF2 format (best compression)"
      - "Font-display: swap (show fallback while loading)"
      - "Preload critical fonts"
    
    animations:
      - "Use transform/opacity (GPU-accelerated)"
      - "Avoid animating width/height/top/left"
      - "Conditional blur: disable on low-end devices"
      - "will-change: transform (sparingly—memory cost)"
  
  caching:
    title: "Caching Strategy"
    static_assets:
      cache_control: "max-age=31536000 (1 year)"
      versioning: "Filename hashing (main.a8b3f2.css)"
    
    html_pages:
      cache_control: "max-age=3600 (1 hour)"
      validation: "ETag or Last-Modified header"
    
    service_worker:
      - "Cache-first for assets (CSS, JS, fonts)"
      - "Network-first for HTML"
      - "Stale-while-revalidate for API data"

