## 📊 Data Visualization

data_visualization:
  chart_selection:
    title: "Choosing the Right Chart Type"
    comparison:
      type: "Bar Chart"
      use: "Compare values across categories"
      example: "Test coverage per module"
    
    trend:
      type: "Line Chart"
      use: "Show change over time"
      example: "Token usage trend, performance metrics"
    
    composition:
      type: "Pie/Donut Chart"
      use: "Show parts of a whole"
      example: "Error distribution by type"
      warning: "Limit to 5-7 segments max"
    
    relationship:
      type: "Scatter Plot"
      use: "Show correlation between variables"
      example: "Code complexity vs bug count"
    
    hierarchy:
      type: "Treemap"
      use: "Show nested categories with size"
      example: "File size distribution by folder"
    
    flow:
      type: "Sankey Diagram"
      use: "Show flow/transitions"
      example: "Data pipeline stages, tier flow"
    
    network:
      type: "Force-Directed Graph"
      use: "Show connections/relationships"
      example: "Knowledge graph, dependencies"
  
  d3_best_practices:
    title: "D3.js Implementation"
    description: "Best practices for D3.js visualizations"
    guidelines:
      - "Use SVG for scalability (vector graphics)"
      - "Set viewBox for responsive sizing"
      - "T1 animations only (opacity, stroke-width, 0.2s)"
      - "Tooltips on hover showing exact values"
      - "Legend with color key for multi-series"
      - "Axis labels with units (%, ms, MB)"
      - "Accessible color palettes (colorblind-safe)"
    performance:
      - "Limit data points (1000 max for line charts)"
      - "Use canvas for >5000 data points"
      - "Debounce resize events (wait 200ms)"
      - "Lazy load visualizations (IntersectionObserver)"
  
  diagram_guidelines:
    title: "Mermaid Diagrams"
    description: "Best practices for Mermaid.js diagrams"
    types:
      flowchart:
        use: "Processes, decision trees, workflows"
        orientation: "TB (top-bottom) or LR (left-right)"
        max_nodes: "15-20 (split if larger)"
      
      sequence:
        use: "API interactions, async operations"
        participants: "3-5 (avoid clutter)"
      
      state:
        use: "State transitions, status workflows"
        states: "5-10 (group substates if more)"
      
      erd:
        use: "Database models, relationships"
        entities: "8-12 (focus on core entities)"
    
    styling:
      - "Use theme: 'base' with CSS variables"
      - "Consistent colors per element type"
      - "NO animations on diagram elements"
      - "T1 hover via CSS, not Mermaid config"

