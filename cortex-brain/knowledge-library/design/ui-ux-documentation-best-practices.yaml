## 🎨 Visual Design Principles

visual_design:
  spacing:
    title: "Spacing System"
    description: "Consistent spacing creates visual rhythm and clarity"
    scale:
      xs: "4px (tight inline spacing)"
      sm: "8px (related elements)"
      md: "16px (component padding)"
      lg: "24px (section spacing)"
      xl: "32px (major section breaks)"
      xxl: "48px (page-level spacing)"
    rules:
      - "Use 8px base unit for all spacing (4, 8, 16, 24, 32, 48)"
      - "More space between unrelated elements than related ones"
      - "Consistent vertical rhythm (same spacing between paragraphs)"
      - "Breathing room around interactive elements (44px min touch target)"
  
  color_psychology:
    title: "Color Usage"
    description: "Colors convey meaning and guide attention"
    guidelines:
      primary: "Brand color for interactive elements (links, buttons, accents)"
      secondary: "Supporting actions, less prominent features"
      success: "Green for positive states (completed, approved, success)"
      warning: "Yellow/orange for caution (pending, attention needed)"
      error: "Red for errors, destructive actions, failures"
      neutral: "Gray tones for text hierarchy and backgrounds"
    accessibility:
      - "Minimum 4.5:1 contrast ratio for normal text (WCAG AA)"
      - "Minimum 3:1 contrast ratio for large text (18pt+) (WCAG AA)"
      - "Don't rely on color alone—add icons or text labels"
      - "Test with color blindness simulators"
  
  glassmorphism:
    title: "Glassmorphism Pattern"
    description: "Modern frosted-glass aesthetic with depth"
    components:
      backdrop_filter: "blur(10-25px) saturate(150-200%)"
      background: "rgba(255, 255, 255, 0.05-0.1)"
      border: "1px solid rgba(255, 255, 255, 0.1-0.2)"
      shadow: "0 8px 32px rgba(0, 0, 0, 0.1-0.3)"
    best_practices:
      - "Use subtle blur (10-15px) for text-heavy panels"
      - "Higher blur (20-25px) for background decorative elements"
      - "Maintain text contrast—darker background when needed"
      - "Limit nesting—too many glass layers reduce readability"
      - "GPU-accelerate with transform: translateZ(0)"
    performance:
      - "Use will-change: backdrop-filter sparingly (high GPU cost)"
      - "Conditional blur: disable on low-end devices"
      - "Static images preferred over live blur for large areas"

