## ♿ Accessibility (WCAG 2.1 AA)

accessibility:
  semantic_html:
    title: "Semantic HTML"
    description: "Use HTML elements for their intended purpose"
    guidelines:
      - "Use <nav> for navigation, <article> for content, <aside> for sidebars"
      - "Heading hierarchy: Only one <h1>, sequential <h2>-<h6>"
      - "Use <button> for actions, <a> for navigation"
      - "Form labels with <label> + for/id association"
      - "Use <table> for tabular data, not layout"
  
  keyboard_navigation:
    title: "Keyboard Accessibility"
    description: "All interactive elements accessible via keyboard"
    requirements:
      - "Tab order matches visual flow (left-to-right, top-to-bottom)"
      - "Focus indicators visible (outline, ring, border change)"
      - "Skip-to-content link for screen readers"
      - "Escape closes modals/dropdowns"
      - "Arrow keys navigate within components (tabs, dropdowns)"
      - "Enter/Space activates buttons"
    testing:
      - "Navigate entire site using only Tab, Shift+Tab, Enter, Escape"
      - "Verify focus visible at all times"
      - "No keyboard traps (can always Tab out)"
  
  screen_reader:
    title: "Screen Reader Support"
    description: "Content accessible to assistive technology"
    guidelines:
      - "Alt text for images (descriptive, not decorative)"
      - "aria-label for icon-only buttons"
      - "aria-live for dynamic content updates"
      - "aria-expanded for collapsible sections"
      - "role='navigation' for nav landmarks"
      - "role='region' aria-labelledby for sections"
    anti_patterns:
      - "Don't use div/span for buttons—screen readers won't recognize"
      - "Don't use placeholders as labels—they disappear on focus"
      - "Don't hide content with display:none if needed by screen readers"
  
  reduced_motion:
    title: "Respect Motion Preferences"
    description: "Provide alternatives for users sensitive to motion"
    implementation: |
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    guidelines:
      - "Disable auto-playing carousels"
      - "Remove parallax scrolling effects"
      - "Simplify hover animations to opacity/color changes"

