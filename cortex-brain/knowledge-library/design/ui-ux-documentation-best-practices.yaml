## 📝 Content Strategy

content_strategy:
  descriptive_text:
    title: "Descriptive Panel Content"
    description: "Explain visualizations so users understand what they're seeing"
    structure:
      overview:
        heading: "🔍 Overview"
        content: "2-3 sentences: What is this? Why does it matter?"
      
      how_to_read:
        heading: "📖 How to Read This Visualization"
        content: |
          - Bullet list explaining visual elements
          - Node size = X, Color = Y, Edges = Z
          - Interactive features (hover, click, zoom)
      
      key_metrics:
        heading: "📊 Key Metrics"
        content: "Highlight impressive numbers with context"
        format: "15 layers | 8,429 nodes | 24,817 edges"
      
      real_example:
        heading: "💡 Real-World Example"
        content: "Concrete scenario showing practical application"
        format: "Code snippet or step-by-step walkthrough"
      
      related_concepts:
        heading: "🔗 Related Topics"
        content: "Links to related documentation pages"
  
  writing_style:
    title: "Writing for Documentation"
    guidelines:
      - "Active voice: 'CORTEX loads data' not 'Data is loaded by CORTEX'"
      - "Second person: 'You can configure...' not 'Users can configure...'"
      - "Present tense: 'CORTEX validates' not 'CORTEX will validate'"
      - "Short paragraphs: 3-4 sentences maximum"
      - "Scannable: Use headings, bullets, numbered lists"
      - "Concrete: Avoid vague terms like 'some', 'various', 'etc.'"
    tone:
      technical_audience: "Professional, precise, assume domain knowledge"
      business_audience: "Clear, benefit-focused, avoid jargon"
      mixed_audience: "Layered: simple intro + 'Technical Details' expandable"
  
  code_examples:
    title: "Code Snippets"
    description: "Show, don't just tell"
    guidelines:
      - "Syntax highlighting (Prism.js or highlight.js)"
      - "Copy button in top-right corner"
      - "Line numbers for multi-line code"
      - "Language label (Python, JavaScript, YAML)"
      - "Comments explaining non-obvious logic"
      - "Complete, runnable examples (not partial snippets)"
    format: |
      ```python
      # Example: Load CORTEX manifest
      from pathlib import Path
      import yaml
      
      manifest_path = Path("cortex-brain/manifests/planning-system-4.0-manifest.yaml")
      manifest = yaml.safe_load(manifest_path.read_text())
      ```

