## 🎭 Interaction Patterns

interactions:
  animation_tiers:
    title: "Animation Tier System"
    description: "Categorize animations by purpose and intensity"
    tiers:
      t1_subtle:
        name: "T1: Subtle (DEFAULT)"
        use_case: "All content pages, documentation, forms"
        duration: "0.2-0.3s"
        effects:
          - "Opacity fade (0 → 1)"
          - "Transform translate (0-5px)"
          - "Color transitions"
        example: "transition: opacity 0.2s ease, transform 0.2s ease;"
      
      t2_accent:
        name: "T2: Accent"
        use_case: "Interactive feedback (button press, form focus)"
        duration: "0.1-0.2s"
        effects:
          - "Scale (0.98-1.02)"
          - "Box shadow changes"
          - "Border color highlights"
        example: "transform: scale(0.98); transition: transform 0.1s ease;"
      
      t3_dramatic:
        name: "T3: Dramatic (RESTRICTED)"
        use_case: "Hero sections, landing pages ONLY"
        duration: "2-10s"
        effects:
          - "Gradient animations"
          - "Particle effects"
          - "Morphing shapes"
          - "Infinite loops"
        warning: "Never use on content pages—distracting and performance-heavy"
  
  hover_states:
    title: "Hover States"
    description: "Visual feedback for interactive elements"
    clickable_elements:
      indicators:
        - "cursor: pointer (hand icon)"
        - "Subtle color change or underline"
        - "Slight lift (translateY(-2px))"
        - "Border glow or shadow increase"
      animation: "transition: all 0.2s ease;"
    
    non_clickable_elements:
      indicators:
        - "cursor: default (no hand)"
        - "No lift effect"
        - "Optional: slow glass reflection (8s loop)"
      animation: "NO hover state OR very subtle ambient animation"
    
    anti_patterns:
      - "Don't animate non-clickable cards—confuses users"
      - "Don't use same hover effect for clickable + non-clickable"
      - "Don't rely on hover for mobile—use tap states"
  
  loading_states:
    title: "Loading Indicators"
    description: "Communicate system activity to prevent user confusion"
    types:
      spinner:
        use: "Indeterminate wait (unknown duration)"
        size: "32-48px, centered"
        color: "Primary brand color"
      
      progress_bar:
        use: "Determinate loading (known duration)"
        show_percentage: "Yes, if >3 seconds"
        update_frequency: "Every 100ms minimum"
      
      skeleton:
        use: "Content loading (lazy-loaded sections)"
        pattern: "Gray placeholder matching final layout"
        animation: "Subtle pulse or shimmer"
    
    best_practices:
      - "Show loader after 300ms delay (avoid flash for fast responses)"
      - "Disable buttons during loading"
      - "Provide cancel option for long operations"
      - "Error message if timeout (>30s)"
  
  tooltips:
    title: "Tooltips & Help Text"
    description: "Contextual help without cluttering interface"
    guidelines:
      - "Hover tooltips for desktop, tap for mobile"
      - "Maximum 2-3 lines of text (25-35 words)"
      - "Appear after 500ms hover delay"
      - "Position: above element if space, below if not"
      - "Arrow pointing to trigger element"
      - "Use for definitions, examples, shortcuts"
    accessibility:
      - "Use aria-describedby to link tooltip to element"
      - "Keyboard accessible (focus triggers tooltip)"
      - "Don't hide critical information in tooltips"

