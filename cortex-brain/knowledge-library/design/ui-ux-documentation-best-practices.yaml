## 🧪 Testing & Validation

testing:
  usability_testing:
    title: "Usability Testing"
    methods:
      - "5-user testing (Nielsen: finds 85% of usability issues)"
      - "Think-aloud protocol (users verbalize thoughts)"
      - "Task completion rate (can users find information?)"
      - "Time-on-task (how long to complete goal?)"
    
    scenarios:
      - "Find specific feature documentation (e.g., SKULL Protection)"
      - "Understand a diagram (e.g., Knowledge Graph)"
      - "Navigate from home to Level 2 detail page"
      - "Use search to find relevant topic"
  
  accessibility_testing:
    title: "Accessibility Testing"
    tools:
      - "WAVE (browser extension)"
      - "axe DevTools (automated testing)"
      - "Lighthouse (Chrome DevTools)"
      - "Screen reader testing (NVDA, JAWS, VoiceOver)"
    
    checklist:
      - "[ ] Keyboard navigation works throughout site"
      - "[ ] All images have descriptive alt text"
      - "[ ] Color contrast ratios meet WCAG AA (4.5:1)"
      - "[ ] Forms have associated labels"
      - "[ ] Headings are in logical order"
      - "[ ] Focus indicators are visible"
  
  browser_testing:
    title: "Cross-Browser Testing"
    browsers:
      - "Chrome 90+ (Chromium engine)"
      - "Firefox 88+ (Gecko engine)"
      - "Safari 14+ (WebKit engine)"
      - "Edge 90+ (Chromium engine)"
    
    mobile:
      - "iOS Safari (iPhone/iPad)"
      - "Chrome Mobile (Android)"
      - "Samsung Internet"
    
    considerations:
      - "Backdrop-filter requires -webkit- prefix for Safari"
      - "CSS Grid has different implementations (use autoprefixer)"
      - "JavaScript APIs vary (check caniuse.com)"

