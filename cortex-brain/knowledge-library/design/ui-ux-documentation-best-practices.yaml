# UI/UX Documentation Best Practices

version: "1.0.0"
created: "2026-01-01"
author: "CORTEX Knowledge Library"
category: "design"
tags: ["ux", "ui", "documentation", "accessibility", "usability", "web-design"]

description: |
  Comprehensive best practices for creating user-centered documentation websites
  with focus on visual hierarchy, accessibility, progressive disclosure, and
  modern interaction patterns.

---

## 🎯 Core Principles

principles:
  user_centered_design:
    title: "User-Centered Design"
    description: "Design for the user's goals, not technology constraints"
    guidelines:
      - "Identify user personas (technical architects, developers, business users)"
      - "Map user journeys for common tasks"
      - "Prioritize content based on user needs, not organizational structure"
      - "Use language appropriate to user expertise level"
    
  progressive_disclosure:
    title: "Progressive Disclosure"
    description: "Reveal complexity gradually, don't overwhelm users"
    guidelines:
      - "Start with overview, drill down to details"
      - "Use expandable sections for optional information"
      - "Provide 'Learn More' links for deep dives"
      - "Limit initial page load to essential information"
      - "Maximum 2-3 levels of hierarchy for navigation"
    examples:
      - "Dashboard overview → Feature details → Technical specs"
      - "Summary cards → Expanded panels → Modal deep-dives"
  
  visual_hierarchy:
    title: "Visual Hierarchy"
    description: "Guide user attention through clear information structure"
    guidelines:
      - "Use size, color, spacing to establish importance"
      - "Group related information with proximity"
      - "Maintain consistent heading levels (H1 → H2 → H3)"
      - "Use visual cues (icons, colors) to categorize content"
      - "White space is not wasted space—it improves comprehension"
    typography:
      heading_h1: "36-48px, bold, high contrast"
      heading_h2: "28-32px, semibold, primary color accent"
      heading_h3: "20-24px, semibold, neutral"
      body_text: "16-18px, regular, line-height 1.6-1.8"
      caption: "14px, light, secondary color"
  
  consistency:
    title: "Consistency"
    description: "Maintain predictable patterns across documentation"
    guidelines:
      - "Use same layout patterns for similar content types"
      - "Consistent navigation structure across pages"
      - "Standardized component styling (buttons, cards, alerts)"
      - "Uniform terminology (don't switch between 'user/customer/client')"
      - "Design system with reusable components"

---

## 📐 Layout Best Practices

layout_patterns:
  f_pattern:
    title: "F-Pattern Reading (Text-Heavy Pages)"
    description: "Users scan in F-shape: top, left side, horizontal mid-page"
    use_when:
      - "Documentation with long-form text"
      - "Tutorial pages"
      - "Technical guides"
    implementation:
      - "Place most important content in top-left"
      - "Use left-aligned headings as scannable anchors"
      - "Break text with subheadings every 3-4 paragraphs"
      - "Add visual breaks (images, code blocks) mid-page"
  
  z_pattern:
    title: "Z-Pattern (Visual Pages)"
    description: "Users scan top-left → top-right → bottom-left → bottom-right"
    use_when:
      - "Landing pages"
      - "Dashboard overviews"
      - "Marketing/feature showcase pages"
    implementation:
      - "Logo/title top-left"
      - "Primary CTA top-right"
      - "Supporting content middle-left"
      - "Secondary CTA bottom-right"
  
  card_grid:
    title: "Card Grid (Navigation Pages)"
    description: "Equal-sized cards for browsing options"
    use_when:
      - "Hub pages (Architecture, Security, Orchestrators)"
      - "Feature category pages"
      - "Tool selection pages"
    implementation:
      - "2-4 columns responsive grid"
      - "Equal visual weight per card"
      - "Icon + title + 1-2 sentence description"
      - "Hover state for interaction feedback"
      - "Clear clickable area (entire card, not just text)"
  
  hub_spoke:
    title: "Hub-and-Spoke (No Wizard Navigation)"
    description: "Central page with links to details, no forced sequence"
    use_when:
      - "Feature documentation (Level 1 → Level 2)"
      - "Non-linear learning paths"
      - "Reference documentation"
    implementation:
      - "Level 1: Overview hub with links to all Level 2 pages"
      - "Level 2: Detail pages with breadcrumb back to hub"
      - "NO 'Previous/Next' navigation (wizard pattern)"
      - "Allow users to explore in any order"
    anti_pattern:
      pattern: "Wizard navigation (Prev/Next buttons)"
      why_bad: "Forces linear progression, users can't skip to relevant sections"
      exception: "Only acceptable for step-by-step tutorials where order matters"

