metadata:
  version: '1.0.0'
  domain: architecture
  subdomain: migration
  author: 'Asif Hussain'
  created: '2025-12-29'
  source: 'Pluralsight Microservices Transition Course'
  keywords:
    - strangler-pattern
    - monolith-decomposition
    - microservices-migration
    - database-decomposition
    - feature-toggles
    - incremental-migration

strangler_application_pattern:
  description: "Incrementally replace monolith functionality with microservices"
  origin: "Named after strangler fig trees that grow around host trees"
  phases:
    - name: "Identify"
      description: "Find capabilities suitable for extraction"
      criteria:
        - "Well-defined boundaries"
        - "Limited dependencies"
        - "Business value from extraction"
    - name: "Intercept"
      description: "Route requests through abstraction layer"
    - name: "Replace"
      description: "Implement new service and redirect traffic"
    - name: "Retire"
      description: "Remove old code once stable"
      
  routing_components:
    facade:
      description: "Simple pass-through that forwards requests"
      use_case: "Early migration phase"
    proxy:
      description: "Intelligent routing with transformation capabilities"
      use_case: "Complex migrations with API changes"
    gateway:
      description: "Full-featured entry point with cross-cutting concerns"
      use_case: "Production deployments"

capability_identification:
  bounded_context_discovery:
    techniques:
      - "Domain event storming"
      - "Business capability mapping"
      - "Context mapping (DDD)"
    outputs:
      - "Context boundaries"
      - "Interface contracts"
      - "Data ownership maps"
      
  extraction_criteria:
    business_factors:
      - "Independent deployment needs"
      - "Different scaling requirements"
      - "Separate team ownership"
    technical_factors:
      - "Clean interface boundaries"
      - "Minimal shared state"
      - "Independent data store potential"
      
  anti_patterns_to_avoid:
    - name: "Distributed Monolith"
      description: "Services tightly coupled through synchronous calls"
    - name: "Shared Database"
      description: "Multiple services accessing same tables directly"
    - name: "Chatty Services"
      description: "Excessive inter-service communication"

database_decomposition:
  patterns:
    shared_database:
      description: "Starting point - all services share one database"
      problems:
        - "Schema coupling"
        - "Deployment coupling"
        - "Performance bottlenecks"
        
    database_per_service:
      description: "Each service owns its data"
      benefits:
        - "Independent deployments"
        - "Technology flexibility"
        - "Clear ownership"
      challenges:
        - "Data consistency"
        - "Cross-service queries"
        - "Migration complexity"
        
  transition_strategies:
    - name: "Database View Layer"
      description: "Create views to abstract table structure"
      steps:
        - "Create views for each service's data needs"
        - "Update services to use views"
        - "Migrate views to separate databases"
        
    - name: "Synchronization Service"
      description: "Keep data in sync during transition"
      techniques:
        - "Change Data Capture (CDC)"
        - "Event sourcing"
        - "Two-phase writes"
        
    - name: "Saga Pattern"
      description: "Manage distributed transactions"
      types:
        - "Choreography (event-based)"
        - "Orchestration (coordinator-based)"

feature_toggles:
  description: "Control feature availability without code deployment"
  types:
    - name: "Release Toggles"
      lifespan: "Short (days to weeks)"
      use_case: "Hide incomplete features"
      
    - name: "Ops Toggles"
      lifespan: "Variable"
      use_case: "Control operational aspects"
      
    - name: "Experiment Toggles"
      lifespan: "Short to medium"
      use_case: "A/B testing"
      
    - name: "Permission Toggles"
      lifespan: "Long"
      use_case: "Feature entitlements"
      
  migration_use_cases:
    - "Gradually shift traffic to new service"
    - "Quick rollback capability"
    - "Canary deployments"
    - "User segment testing"

routing_strategies:
  traffic_splitting:
    description: "Route percentage of traffic to new service"
    progression:
      - "1% canary test"
      - "10% early adopters"
      - "50% wider rollout"
      - "100% full migration"
    monitoring:
      - "Error rates comparison"
      - "Latency measurements"
      - "Business metrics"
      
  content_based_routing:
    description: "Route based on request characteristics"
    criteria:
      - "User segment"
      - "Request type"
      - "Geographic location"
      - "Client version"

api_versioning:
  strategies:
    - name: "URL Path Versioning"
      example: "/api/v1/resource, /api/v2/resource"
      pros: "Explicit, easy to understand"
      cons: "URL pollution"
      
    - name: "Header Versioning"
      example: "Accept: application/vnd.api.v2+json"
      pros: "Clean URLs"
      cons: "Less visible"
      
    - name: "Query Parameter"
      example: "/api/resource?version=2"
      pros: "Simple implementation"
      cons: "Caching challenges"
      
  compatibility_rules:
    backward_compatible:
      - "Adding new fields"
      - "Adding new endpoints"
      - "Making required fields optional"
    breaking_changes:
      - "Removing fields"
      - "Changing field types"
      - "Changing response structure"

testing_strategies:
  contract_testing:
    description: "Verify service interfaces match expectations"
    tools: ["Pact", "Spring Cloud Contract"]
    benefits:
      - "Catch breaking changes early"
      - "Consumer-driven contracts"
      - "Independent service testing"
      
  shadow_testing:
    description: "Send duplicate traffic to new service"
    characteristics:
      - "Production traffic copy"
      - "Results discarded"
      - "Compare outputs for validation"
      
  synthetic_monitoring:
    description: "Automated health checks in production"
    checks:
      - "Endpoint availability"
      - "Response time thresholds"
      - "Business transaction validation"

migration_anti_patterns:
  - name: "Big Bang Migration"
    problem: "All-or-nothing approach increases risk"
    solution: "Incremental strangler approach"
    
  - name: "Premature Decomposition"
    problem: "Breaking apart before understanding boundaries"
    solution: "Start with modular monolith"
    
  - name: "Ignoring Data"
    problem: "Focusing only on services, not data migration"
    solution: "Plan database decomposition alongside services"
    
  - name: "No Rollback Plan"
    problem: "Unable to recover from failed migration"
    solution: "Feature toggles and traffic routing"

organizational_considerations:
  team_structure:
    conways_law: "System design reflects organizational structure"
    recommendations:
      - "Align teams with service boundaries"
      - "Full-stack teams per service"
      - "Clear ownership and accountability"
      
  communication:
    - "Regular architecture reviews"
    - "Cross-team dependency tracking"
    - "Shared documentation practices"
    
  governance:
    - "API design standards"
    - "Technology radar"
    - "Migration progress tracking"
