      size_reduction:
        - "CORTEX.prompt.md: 250→50 lines (-80%)"
        - "copilot-instructions.md: 150→50 lines (-67%)"
        - "master-orchestrator.yaml: 418→550 lines (+132 lines for transformation rules)"
