          purpose: "Core audit logging infrastructure"
          features:
            - "Structured JSON logging"
            - "Performance decorators (@timed, @logged)"
            - "Context managers (with audit_context())"
            - "Rotation policy (10MB, 5 backups)"
        
        - path: "src/entry_point/cortex_entry_audit.py"
          purpose: "Wrap CortexEntry with audit logging"
          hooks:
            - "pre_execution: Log request, pattern, transformation"
            - "post_execution: Log result, duration, errors"
        
        - path: "src/orchestrators/base/base_orchestrator_audit_mixin.py"
          purpose: "Audit mixin for all orchestrators"
          methods:
            - "log_phase_start(phase_number, phase_name)"
            - "log_phase_end(phase_number, status, outputs)"
            - "log_validation(rule, passed, error=None)"
            - "log_performance(metric_name, value, unit)"
      
      log_format:
        structure: "JSON Lines (.jsonl)"
        schema:
          timestamp: "ISO 8601 with microseconds"
          event_type: "handoff | execution | validation | performance | error"
          context:
            request_id: "UUID v4"
            plan_id: "string | null"
            phase_number: "int | null"
            orchestrator: "string"
          data: "event-specific payload (JSON object)"
        example: |
          {"timestamp": "2026-01-05T22:15:34.123456Z", "event_type": "handoff", "context": {"request_id": "a1b2c3d4", "orchestrator": "planning_v5"}, "data": {"pattern_matched": "^(plan|create a plan)", "confidence": 1.0, "transformation": "plan OAuth2 system with JWT..."}}
      
      storage:
        location: "logs/cortex-audit/"
        files:
          - "handoffs-{date}.jsonl (daily rotation)"
          - "executions-{date}.jsonl (daily rotation)"
          - "performance-{date}.jsonl (daily rotation)"
          - "errors-{date}.jsonl (daily rotation)"
        retention: "30 days (auto-purge)"
      
      analysis_tools:
        - script: "scripts/analysis/audit_report.py"
          purpose: "Generate daily/weekly/monthly audit reports"
          outputs:
            - "Average handoff latency"
            - "Pattern matching accuracy"
            - "Orchestrator success rate"
            - "Performance trends"
        
        - script: "scripts/analysis/audit_query.py"
          purpose: "Query audit logs by request_id, plan_id, date range"
          usage: "python3 scripts/analysis/audit_query.py --request-id a1b2c3d4"
    
    validation:
      unit_tests:
        - "test_audit_logger.py: Test JSON logging, rotation, context managers"
        - "test_audit_decorators.py: Test @timed, @logged decorators"
        - "test_audit_integration.py: Test end-to-end handoff tracking"
      
      integration_tests:
        - "Run Phase 23 with audit logging enabled"
        - "Verify handoff logs captured (9 events expected)"
        - "Verify performance logs show latency <5s"
        - "Verify no sensitive data in logs (PII/secrets)"
      
      acceptance_criteria:
        - "All handoff events logged (100% coverage)"
        - "Performance metrics captured for all phases"
        - "Logs are queryable by request_id"
        - "Audit report generation works"
        - "No performance overhead >5%"
    
    outputs:
      - "src/orchestrators/audit_logger.py"
      - "src/entry_point/cortex_entry_audit.py"
      - "src/orchestrators/base/base_orchestrator_audit_mixin.py"
      - "scripts/analysis/audit_report.py"
      - "scripts/analysis/audit_query.py"
      - "tests/test_audit_logger.py"
      - "tests/test_audit_decorators.py"
      - "tests/test_audit_integration.py"
      - "docs/audit-logging-guide.md"
