          - "Define meta_directive_patterns (8 directives)"
          - "Define transformation_templates (12 templates)"
          - "Add routing_enhancements section"
        outputs:
          - "cortex-brain/config/master-orchestrator.yaml (+132 lines)"
      
      phase_3:
        name: "Reduce CORTEX.prompt.md"
        duration: "1.5 hours"
        tasks:
          - "Keep only: Purpose (3 lines), Core Protocol (7 lines), Intent Router (20 lines), Examples (15 lines), Footer (5 lines)"
          - "Remove: Transformation details, verbose examples, duplication"
          - "Add reference to Master Orchestrator for logic"
        outputs:
          - ".github/prompts/CORTEX.prompt.md.v5.2.0.backup (250 lines backup)"
