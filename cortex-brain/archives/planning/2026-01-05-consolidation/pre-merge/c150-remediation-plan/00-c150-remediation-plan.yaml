        outputs:
          - ".github/copilot-instructions.md.v5.0.0.backup (150 lines backup)"
          - ".github/copilot-instructions.md (50 lines)"
    
    new_file_structure:
      request_transformer_py:
        location: "src/orchestrators/request_transformer.py"
        classes:
          - "MetaDirectiveParser: Extract [no verbose], [concise], [explain] from requests"
          - "PatternMatcher: Match user intent against routing patterns"
          - "TransformationEngine: Transform request → Python CLI command"
        methods:
          - "parse_request(raw_request: str) → ParsedRequest"
          - "extract_meta_directives(text: str) → List[MetaDirective]"
          - "match_pattern(clean_request: str) → MatchResult"
          - "transform_to_cli(request: ParsedRequest, match: MatchResult) → CLICommand"
      
      master_orchestrator_yaml_additions:
        transformation_rules:
          meta_directives:
            - "[no verbose]→mode=concise"
            - "[concise]→mode=concise"
            - "[explain]→mode=verbose"
            - "[detailed]→mode=verbose"
            - "[plan mode]→force_planning=true"
            - "[dry run]→dry_run=true"
            - "[wizard]→wizard_mode=true"
            - "[auto]→wizard_mode=false"
          
          transformation_templates:
