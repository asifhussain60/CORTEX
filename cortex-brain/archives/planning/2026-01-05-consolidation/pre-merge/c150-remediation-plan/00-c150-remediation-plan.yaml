      phase_4:
        name: "Reduce copilot-instructions.md"
        duration: "1.5 hours"
        tasks:
          - "Keep only: Entry Point (5 lines), Intent Routing Defer (10 lines), Response Format (10 lines), Brain Protection (10 lines), Quick Start (10 lines), Footer (5 lines)"
          - "Remove: Orchestrator tables, transformation logic, verbose documentation"
