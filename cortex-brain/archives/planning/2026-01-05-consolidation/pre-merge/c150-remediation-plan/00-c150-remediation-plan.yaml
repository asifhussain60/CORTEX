            vacuum: "python3 -m src.main 'vacuum {path} --mode {mode} --dry-run {dry_run}'"
            cleanup: "python3 -m src.main 'cleanup --mode {mode} --dry-run {dry_run}'"
            investigation: "python3 -m src.main 'investigate {symptom} --scope {scope}'"
    
    cortex_prompt_v5_3_structure:
