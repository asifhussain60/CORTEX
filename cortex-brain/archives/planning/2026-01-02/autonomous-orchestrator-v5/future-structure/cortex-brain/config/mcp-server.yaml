# MCP Server Configuration (Production)

⚠️ PREVIEW FILE - NOT YET IMPLEMENTED
Phase: 1 (MCP Tool Infrastructure)
Status: 📋 ARCHITECTURAL PREVIEW

server:
  host: "localhost"
  port: 5000
  debug: false
  log_level: "INFO"
  timeout: 300
  max_concurrent_requests: 10

registry:
  auto_discover: true
  hot_reload: false
  health_check_interval: 60
  orchestrator_paths:
    - "src/orchestrators/"

orchestrators:
  planning:
    enabled: true
    max_execution_time: 600
    brain_tier_updates: true
    governance_validation: true
  
  ado:
    enabled: true
    max_execution_time: 300
    azure_devops_url: "${AZURE_DEVOPS_URL}"
    pat_token: "${AZURE_DEVOPS_PAT}"
  
  vacuum:
    enabled: true
    max_execution_time: 900
    safe_mode: true
    dry_run_default: true
  
  cleanup:
    enabled: true
    max_execution_time: 600
    safe_mode: true
    dry_run_default: true

monitoring:
  metrics_enabled: true
  log_directory: "logs/mcp/"
  retention_days: 30
  trace_requests: true

security:
  validate_inputs: true
  sanitize_outputs: true
  rate_limiting: true
  max_requests_per_minute: 60

