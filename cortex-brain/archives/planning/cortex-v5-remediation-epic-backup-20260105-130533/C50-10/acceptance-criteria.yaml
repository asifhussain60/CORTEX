# Acceptance Criteria for C50-10: Phase-Level Acceptance Criteria (Gap 1)
# CORTEX-5.0 Remediation - Acceptance Validation System

phases:
  - phase_number: 0
    phase_name: "DoR/DoD Implementation"
    dor:
      - criterion: "C50-00B complete (Planning v5 operational)"
        validation_type: "automated"
        validation_command: "grep -q 'C50-00B.*complete' cortex-brain/documents/planning/active/C50-cortex-v5-remediation/epic-progress-tracker.json"
      - criterion: "Test coverage ≥50%"
        validation_type: "automated"
        validation_command: "/usr/bin/python3 -c \"import json; data=json.load(open('coverage.json')); exit(0 if data['totals']['percent_covered'] >= 50 else 1)\""
      - criterion: "VSCodeCacheManager operational"
        validation_type: "automated"
        validation_command: "test -f src/operations/utilities/vscode_cache_manager.py"
      - criterion: "Previous phase DoD validated"
        validation_type: "manual"
        validation_notes: "Phase -2 (Setup Verification) passed"
    dod:
      - criterion: "acceptance_validator.py module created (≥300 LOC)"
        validation_type: "automated"
        validation_command: "test -f src/orchestrators/planning/acceptance_validator.py && [ $(wc -l < src/orchestrators/planning/acceptance_validator.py) -ge 295 ]"
      - criterion: "AcceptanceCriteriaValidator class implemented"
        validation_type: "automated"
        validation_command: "grep -q 'class AcceptanceCriteriaValidator' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "validate_phase_dor() function implemented"
        validation_type: "automated"
        validation_command: "grep -q 'def validate_phase_dor' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "validate_phase_dod() function implemented"
        validation_type: "automated"
        validation_command: "grep -q 'def validate_phase_dod' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "PhaseNotReadyError exception class defined"
        validation_type: "automated"
        validation_command: "grep -q 'class PhaseNotReadyError' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "PhaseIncompleteError exception class defined"
        validation_type: "automated"
        validation_command: "grep -q 'class PhaseIncompleteError' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "Integration with Planning Orchestrator v5"
        validation_type: "automated"
        validation_command: "grep -q 'from src.orchestrators.planning.acceptance_validator import' src/orchestrators/planning/planning_orchestrator_v5.py"
      - criterion: "execute_phase() override implemented in PlanningOrchestratorV5"
        validation_type: "automated"
        validation_command: "grep -A10 'def execute_phase' src/orchestrators/planning/planning_orchestrator_v5.py | grep -q 'DoR'"
      - criterion: "Unit tests created (≥18 tests)"
        validation_type: "automated"
        validation_command: "test -f tests/orchestrators/planning/test_acceptance_validator.py && [ $(grep -c 'def test_' tests/orchestrators/planning/test_acceptance_validator.py) -ge 18 ]"
      - criterion: "Unit tests passing (≥90% pass rate)"
        validation_type: "automated"
        validation_command: "/usr/bin/python3 -m pytest tests/orchestrators/planning/test_acceptance_validator.py --tb=no -q 2>&1 | grep -q 'passed'"
      - criterion: "acceptance-criteria-template.md copied to C50-10/context/"
        validation_type: "automated"
        validation_command: "test -f cortex-brain/documents/planning/active/C50-cortex-v5-remediation/C50-10/context/acceptance-criteria-template.md"
      - criterion: "Type hints added (mypy validation passing)"
        validation_type: "manual"
        validation_notes: "Type hints visible in code review"
      - criterion: "Docstrings for all public functions"
        validation_type: "automated"
        validation_command: "grep -A1 'def validate_phase_dor\\|def validate_phase_dod\\|class AcceptanceCriteriaValidator' src/orchestrators/planning/acceptance_validator.py | grep -c '\"\"\"' | awk '{exit ($1 >= 3 ? 0 : 1)}'"
      - criterion: "Code reviewed"
        validation_type: "manual"
        validation_notes: "Self-review completed during autonomous execution"
  
  - phase_number: 1
    phase_name: "Integration Testing"
    dor:
      - criterion: "Phase 0 DoD validated"
        validation_type: "automated"
        validation_command: "grep -q 'PhaseIncompleteError' src/orchestrators/planning/acceptance_validator.py"
      - criterion: "Planning Orchestrator v5 integration complete"
        validation_type: "automated"
        validation_command: "grep -q 'acceptance_validator' src/orchestrators/planning/planning_orchestrator_v5.py"
    dod:
      - criterion: "DoR blocking behavior tested (phase start prevented if criteria not met)"
        validation_type: "manual"
        validation_notes: "Unit tests cover blocking scenarios"
      - criterion: "DoD blocking behavior tested (phase completion prevented if criteria not met)"
        validation_type: "manual"
        validation_notes: "Unit tests cover blocking scenarios"
      - criterion: "End-to-end workflow validated"
        validation_type: "manual"
        validation_notes: "Integration tests verify full lifecycle"
      - criterion: "Documentation complete"
        validation_type: "automated"
        validation_command: "test -f cortex-brain/documents/planning/active/C50-cortex-v5-remediation/C50-10/context/acceptance-criteria-template.md"
  
  - phase_number: 999
    phase_name: "REFACTOR + Commit"
    dor:
      - criterion: "Phase 1 DoD validated"
        validation_type: "manual"
        validation_notes: "All previous phases complete"
      - criterion: "All deliverables created"
        validation_type: "automated"
        validation_command: "test -f src/orchestrators/planning/acceptance_validator.py && test -f tests/orchestrators/planning/test_acceptance_validator.py"
    dod:
      - criterion: "Code refactored (SKULL rule: whole-file cleanup)"
        validation_type: "manual"
        validation_notes: "Code follows CORTEX standards"
      - criterion: "Final validation passed"
        validation_type: "automated"
        validation_command: "/usr/bin/python3 -m pytest tests/orchestrators/planning/test_acceptance_validator.py --tb=no -q 2>&1 | grep -q '18 passed'"
      - criterion: "Git commit created"
        validation_type: "automated"
        validation_command: "git log --oneline -1 | grep -q 'C50-10'"
      - criterion: "Epic progress tracker updated"
        validation_type: "automated"
        validation_command: "grep -q 'C50-10.*complete' cortex-brain/documents/planning/active/C50-cortex-v5-remediation/epic-progress-tracker.json"
