# Week 26: Profiling Strategies
# Part of Phase 10.2 - Specialization Domains
# Focus: Performance profilers, memory profilers, bottleneck identification, benchmarking

metadata:
  week: 26
  phase: "10.2"
  domain: "Performance Optimization"
  difficulty: "Advanced"
  prerequisites:
    - "Performance fundamentals"
    - "System architecture understanding"
    - "Statistics basics"
    - "Development tools familiarity"

profiling_strategies:
  profiling_fundamentals:
    description: "Core concepts and approaches for performance analysis"
    
    types_of_profiling:
      sampling_profilers:
        mechanism: "Periodically sample program state"
        advantages:
          - "Low overhead (1-5%)"
          - "Suitable for production"
          - "Minimal code changes"
        disadvantages:
          - "Statistical approximation"
          - "May miss rare events"
          - "Less accurate for short functions"
        use_cases:
          - "Production monitoring"
          - "Initial bottleneck discovery"
          - "Long-running processes"
      
      instrumentation_profilers:
        mechanism: "Insert measurement code at function boundaries"
        advantages:
          - "Precise measurement"
          - "Complete call counts"
          - "Detailed timing"
        disadvantages:
          - "Higher overhead (10-100%)"
          - "May affect behavior"
          - "Not for production"
        use_cases:
          - "Development analysis"
          - "Detailed optimization"
          - "Algorithm comparison"
      
      tracing_profilers:
        mechanism: "Record every event/call"
        advantages:
          - "Complete execution history"
          - "Timeline visualization"
          - "Causality tracking"
        disadvantages:
          - "Very high overhead"
          - "Large data volume"
          - "Complex analysis"
        use_cases:
          - "Debugging specific issues"
          - "Understanding call sequences"
          - "Concurrency analysis"
    
    profiling_dimensions:
      time_profiling:
        metrics:
          - "CPU time (user + system)"
          - "Wall clock time"
          - "Function call counts"
          - "Time per call"
        questions_answered:
          - "Which functions consume most CPU?"
          - "Where is time spent in code?"
          - "Are functions called too often?"
      
      memory_profiling:
        metrics:
          - "Heap allocations"
          - "Memory leaks"
          - "Peak memory usage"
          - "Allocation patterns"
        questions_answered:
          - "What allocates most memory?"
          - "Are there memory leaks?"
          - "Can memory usage be reduced?"
      
      io_profiling:
        metrics:
          - "I/O operations count"
          - "Bytes read/written"
          - "I/O wait time"
          - "Cache hit rates"
        questions_answered:
          - "Is I/O a bottleneck?"
          - "Are reads/writes efficient?"
          - "Is buffering effective?"
      
      concurrency_profiling:
        metrics:
          - "Lock contention"
          - "Thread utilization"
          - "Context switches"
          - "Synchronization overhead"
        questions_answered:
          - "Are threads balanced?"
          - "Where is lock contention?"
          - "Is parallelism effective?"

  cpu_profiling:
    description: "Analyzing CPU time and execution patterns"
    
    tools_by_platform:
      linux:
        - tool: "perf"
          type: "Sampling profiler"
          capabilities:
            - "CPU profiling"
            - "Hardware counters"
            - "Call graphs"
            - "Flame graphs"
          usage: |
            # Record profile
            perf record -g ./program
            # View report
            perf report
            # Generate flame graph
            perf script | stackcollapse-perf.pl | flamegraph.pl > flame.svg
        
        - tool: "gprof"
          type: "Instrumentation profiler"
          capabilities:
            - "Function timing"
            - "Call counts"
            - "Call graph"
          usage: |
            # Compile with profiling
            gcc -pg program.c
            # Run to generate gmon.out
            ./a.out
            # Analyze
            gprof a.out gmon.out
        
        - tool: "Valgrind (callgrind)"
          type: "Instrumentation profiler"
          capabilities:
            - "Instruction-level profiling"
            - "Cache simulation"
            - "Call graphs"
          usage: |
            # Profile
            valgrind --tool=callgrind ./program
            # Visualize
            kcachegrind callgrind.out.*
      
      windows:
        - tool: "Visual Studio Profiler"
          type: "Sampling/Instrumentation"
          capabilities:
            - "CPU usage"
            - "Function timing"
            - "Timeline view"
            - "Hot paths"
        
        - tool: "Windows Performance Analyzer"
          type: "Tracing"
          capabilities:
            - "System-wide profiling"
            - "ETW events"
            - "Multi-process analysis"
        
        - tool: "Intel VTune"
          type: "Advanced profiler"
          capabilities:
            - "Microarchitecture analysis"
            - "Hotspot detection"
            - "Threading analysis"
      
      macos:
        - tool: "Instruments"
          type: "Comprehensive profiler"
          capabilities:
            - "Time Profiler"
            - "Allocations"
            - "System Trace"
            - "Network"
          usage: "Launch from Xcode or command line"
        
        - tool: "sample"
          type: "Sampling profiler"
          capabilities:
            - "Process sampling"
            - "Call stacks"
          usage: "sample <process> <duration>"
      
      language_specific:
        python:
          - name: "cProfile"
            type: "Built-in profiler"
            usage: "python -m cProfile -o output.prof script.py"
          
          - name: "line_profiler"
            type: "Line-by-line profiling"
            usage: "@profile decorator, kernprof -lv script.py"
          
          - name: "py-spy"
            type: "Sampling profiler"
            usage: "py-spy record -o profile.svg -- python script.py"
        
        java:
          - name: "JProfiler"
            type: "Commercial profiler"
          
          - name: "YourKit"
            type: "Commercial profiler"
          
          - name: "async-profiler"
            type: "Sampling profiler"
            usage: "Low overhead, flame graphs"
        
        dotnet:
          - name: "dotTrace"
            type: "Commercial profiler"
          
          - name: "PerfView"
            type: "Free sampling profiler"
            usage: "ETW-based, flame graphs"
          
          - name: "BenchmarkDotNet"
            type: "Microbenchmarking"
    
    analysis_techniques:
      flame_graphs:
        description: "Visualization of profiling data"
        interpretation:
          x_axis: "Alphabetical order (not time)"
          y_axis: "Call stack depth"
          width: "CPU time / sample count"
          color: "Usually by package/module"
        reading_tips:
          - "Wide plateaus = hot functions"
          - "Tall spires = deep call chains"
          - "Look for unexpected patterns"
        types:
          cpu: "CPU time flame graph"
          off_cpu: "Waiting/blocking time"
          differential: "Compare two profiles"
      
      call_graphs:
        description: "Who calls whom and how often"
        metrics:
          self_time: "Time in function itself"
          total_time: "Time including callees"
          call_count: "Number of invocations"
        use_cases:
          - "Identify expensive call paths"
          - "Find unnecessary recursion"
          - "Optimize caller relationships"
      
      hot_spot_analysis:
        approach: "Focus on top time consumers"
        rule_of_thumb: "80/20 rule - 80% time in 20% of code"
        workflow:
          - "Sort by self time"
          - "Examine top functions"
          - "Understand why they're hot"
          - "Consider optimization feasibility"
      
      comparative_analysis:
        purpose: "Measure optimization impact"
        technique:
          - "Profile before changes"
          - "Apply optimization"
          - "Profile after changes"
          - "Compare results"
        tools:
          - "Differential flame graphs"
          - "Side-by-side call graphs"
          - "Metric dashboards"

  memory_profiling:
    description: "Analyzing memory usage and allocation patterns"
    
    heap_profiling:
      allocation_profiling:
        purpose: "Track memory allocations"
        metrics:
          - "Allocation count"
          - "Bytes allocated"
          - "Allocation call stacks"
          - "Object lifetimes"
        
        tools:
          valgrind_massif:
            platform: "Linux"
            usage: |
              valgrind --tool=massif ./program
              ms_print massif.out.*
            features:
              - "Heap profiling"
              - "Stack usage"
              - "Snapshots over time"
          
          heaptrack:
            platform: "Linux"
            features:
              - "Allocation tracking"
              - "Leak detection"
              - "Flamegraph visualization"
          
          dotmemory:
            platform: ".NET"
            features:
              - "Snapshot comparison"
              - "Allocation tracking"
              - "Retention paths"
          
          memory_profiler:
            platform: "Python"
            usage: "@profile decorator with memory_profiler"
            features: "Line-by-line memory usage"
      
      leak_detection:
        strategies:
          snapshot_diff:
            technique: "Compare memory before/after operation"
            workflow:
              - "Take initial snapshot"
              - "Exercise suspected code"
              - "Take final snapshot"
              - "Compare: new objects are potential leaks"
          
          reachability_analysis:
            technique: "Find objects not reachable from roots"
            principle: "Unreachable objects should be collected"
            tools:
              - "Valgrind memcheck"
              - "AddressSanitizer"
              - "Java/C# heap analyzers"
          
          reference_tracking:
            technique: "Track object reference counts"
            use_cases:
              - "Python refcount leaks"
              - "COM object leaks"
              - "Smart pointer issues"
        
        common_leak_patterns:
          - pattern: "Event handler not unsubscribed"
            symptom: "Objects retained by event system"
            fix: "Unsubscribe in cleanup"
          
          - pattern: "Cache without eviction"
            symptom: "Unbounded growth"
            fix: "LRU or size-limited cache"
          
          - pattern: "Circular references"
            symptom: "Reference-counted objects not freed"
            fix: "Weak references or break cycle"
          
          - pattern: "Static collections"
            symptom: "Application-lifetime objects"
            fix: "Review necessity of static state"
    
    fragmentation_analysis:
      types:
        internal_fragmentation:
          cause: "Allocated size > requested size"
          example: "Allocate 33 bytes, get 64-byte block"
          impact: "Wasted space within allocations"
        
        external_fragmentation:
          cause: "Free memory not contiguous"
          example: "Total 100KB free, max allocation 40KB"
          impact: "Cannot satisfy large allocations"
      
      measurement:
        metrics:
          - "Free space total"
          - "Largest free block"
          - "Allocation success rate"
          - "Compaction frequency"
      
      mitigation:
        - "Size-classed allocators"
        - "Memory pooling"
        - "Compacting garbage collection"
        - "Arena allocation"
    
    gc_profiling:
      managed_runtimes:
        metrics:
          - "GC pause time"
          - "GC frequency"
          - "Generation promotions"
          - "Heap size"
        
        tools:
          java:
            - "-Xlog:gc* (Java 9+)"
            - "GCViewer for log analysis"
            - "VisualVM heap dumps"
          
          dotnet:
            - "PerfView for ETW events"
            - "dotMemory"
            - "GC.GetTotalMemory() in code"
          
          python:
            - "gc module statistics"
            - "tracemalloc"
            - "objgraph for references"
      
      optimization_signals:
        too_frequent:
          symptom: "GC runs very often"
          causes:
            - "Excessive allocation"
            - "Heap too small"
          solutions:
            - "Reduce allocations"
            - "Increase heap size"
        
        long_pauses:
          symptom: "Application freezes during GC"
          causes:
            - "Large heap"
            - "Many live objects"
          solutions:
            - "Concurrent/incremental GC"
            - "Reduce object lifetime"
        
        promotions:
          symptom: "Young objects promoted to old generation"
          causes:
            - "Objects live too long"
            - "Young generation too small"
          solutions:
            - "Shorter object lifetimes"
            - "Tune generation sizes"

  io_profiling:
    description: "Analyzing input/output performance"
    
    file_io:
      tools:
        linux:
          - name: "strace"
            purpose: "System call tracing"
            usage: "strace -c ./program  # Count syscalls"
            metrics: "calls, time, errors"
          
          - name: "iotop"
            purpose: "Real-time I/O usage by process"
            metrics: "read/write bandwidth"
          
          - name: "blktrace"
            purpose: "Block layer tracing"
            detail: "Track I/O from application to disk"
        
        windows:
          - name: "Process Monitor"
            purpose: "File system activity monitoring"
            capabilities:
              - "Filter by process"
              - "Call stacks"
              - "Operation timing"
        
        macos:
          - name: "fs_usage"
            purpose: "File system activity"
            usage: "sudo fs_usage -w -f filesystem"
      
      metrics:
        operation_counts:
          - "open/close"
          - "read/write"
          - "seek"
          - "sync/fsync"
        
        performance:
          - "Operations per second"
          - "Throughput (MB/s)"
          - "Latency per operation"
          - "Sequential vs random ratio"
        
        patterns:
          - "Sequential vs random access"
          - "Read vs write ratio"
          - "I/O size distribution"
          - "File open duration"
      
      analysis:
        excessive_operations:
          symptom: "Too many open/close or small I/O"
          solution: "Batch operations, keep files open, larger buffers"
        
        synchronous_io:
          symptom: "Thread blocked on I/O"
          solution: "Async I/O, I/O threads, overlapped I/O"
        
        cache_misses:
          symptom: "Repeated reads of same data"
          solution: "Application-level caching, larger OS cache"
    
    network_io:
      tools:
        packet_capture:
          - name: "Wireshark"
            capabilities:
              - "Packet inspection"
              - "Protocol analysis"
              - "Latency measurement"
          
          - name: "tcpdump"
            usage: "tcpdump -i eth0 port 80"
            purpose: "Command-line packet capture"
        
        connection_analysis:
          - name: "netstat / ss"
            purpose: "Connection states"
            usage: "ss -tan  # TCP connections"
          
          - name: "lsof"
            purpose: "Open network sockets"
            usage: "lsof -i :8080"
        
        application_level:
          - name: "curl with timing"
            usage: "curl -w '%{time_total}' URL"
            purpose: "HTTP request timing"
          
          - name: "ab (Apache Bench)"
            purpose: "HTTP load testing"
            metrics: "requests/sec, latency percentiles"
      
      metrics:
        latency_components:
          - "DNS resolution"
          - "TCP handshake"
          - "TLS handshake"
          - "Time to first byte"
          - "Data transfer"
        
        throughput:
          - "Requests per second"
          - "Bytes per second"
          - "Connection reuse rate"
        
        errors:
          - "Connection failures"
          - "Timeouts"
          - "Retransmissions"
      
      common_issues:
        - issue: "Slow DNS"
          symptom: "High DNS lookup time"
          solution: "DNS caching, connection pooling"
        
        - issue: "Connection overhead"
          symptom: "Many short connections"
          solution: "Keep-alive, connection pooling"
        
        - issue: "Small transfers"
          symptom: "Many small packets"
          solution: "Nagle algorithm, message batching"
        
        - issue: "Bandwidth saturation"
          symptom: "High latency under load"
          solution: "Compression, rate limiting, scale out"

  concurrency_profiling:
    description: "Analyzing parallel execution and synchronization"
    
    thread_analysis:
      utilization:
        metrics:
          - "Thread count over time"
          - "CPU utilization per thread"
          - "Idle vs busy time"
          - "Work distribution balance"
        
        tools:
          - "Thread activity timelines"
          - "CPU flame graphs per thread"
          - "Gantt charts of thread execution"
        
        ideal_state:
          cpu_bound: "All threads at 100% CPU (one per core)"
          io_bound: "Threads mostly waiting, high count OK"
      
      synchronization:
        lock_contention:
          detection:
            - "High lock wait time"
            - "Threads blocked on locks"
            - "Lock hold time"
          
          tools:
            linux: "perf lock"
            java: "Java Flight Recorder, jstack"
            dotnet: "Concurrency Visualizer"
          
          solutions:
            - "Reduce critical section size"
            - "Use lock-free structures"
            - "Fine-grained locking"
            - "Read-write locks"
        
        deadlock_detection:
          symptoms:
            - "Threads permanently blocked"
            - "Circular wait on locks"
          
          tools:
            - "Thread dumps (jstack, dotnet-dump)"
            - "Debugger inspection"
            - "Lock hierarchy validation"
          
          prevention:
            - "Consistent lock ordering"
            - "Lock timeout"
            - "Deadlock detection runtime"
        
        false_sharing:
          detection:
            - "High cache miss rate"
            - "Cache line invalidation events"
          
          tools:
            - "perf c2c (cache-to-cache)"
            - "Intel VTune cache analysis"
          
          solution:
            - "Padding between hot variables"
            - "Thread-local variables"
            - "Align to cache line boundaries"
      
      message_passing:
        queue_analysis:
          metrics:
            - "Queue depth over time"
            - "Enqueue/dequeue rate"
            - "Message latency"
          
          problems:
            growing_queue: "Producer faster than consumer"
            empty_queue: "Consumer idle, producer slow"
          
          solutions:
            - "Backpressure mechanisms"
            - "Dynamic thread pool sizing"
            - "Work stealing"

  benchmarking:
    description: "Controlled performance measurement"
    
    microbenchmarking:
      purpose: "Measure small code snippets"
      
      challenges:
        warm_up:
          issue: "JIT compilation, cache warming"
          solution: "Run many iterations before measurement"
        
        dead_code_elimination:
          issue: "Optimizer removes unused code"
          solution: "Use results, prevent optimization"
        
        constant_folding:
          issue: "Compiler evaluates at compile time"
          solution: "Use non-constant inputs"
        
        measurement_overhead:
          issue: "Timing code affects results"
          solution: "Measure in batches, subtract overhead"
      
      best_practices:
        - "Isolate code under test"
        - "Multiple iterations for statistics"
        - "Measure percentiles, not just average"
        - "Run in realistic conditions"
        - "Compare before/after with same conditions"
      
      frameworks:
        java:
          - name: "JMH (Java Microbenchmarking Harness)"
            features:
              - "Handles warm-up"
              - "Prevents dead code elimination"
              - "Statistical analysis"
        
        dotnet:
          - name: "BenchmarkDotNet"
            features:
              - "Multiple runtimes"
              - "Memory diagnostics"
              - "Exporters (HTML, CSV)"
        
        cpp:
          - name: "Google Benchmark"
            features:
              - "Statistics"
              - "Comparison mode"
              - "Custom counters"
        
        python:
          - name: "pytest-benchmark"
            features:
              - "Integration with pytest"
              - "Calibration"
              - "Comparison reports"
    
    macro_benchmarking:
      purpose: "Measure whole system performance"
      
      types:
        load_testing:
          goal: "Performance under expected load"
          metrics:
            - "Response time"
            - "Throughput"
            - "Error rate"
          tools:
            - "JMeter, Gatling (web)"
            - "wrk, hey (HTTP)"
            - "Custom workload generators"
        
        stress_testing:
          goal: "Find breaking point"
          approach: "Gradually increase load until failure"
          observe:
            - "When does latency spike?"
            - "What component fails first?"
            - "How does it fail?"
        
        endurance_testing:
          goal: "Detect leaks and degradation"
          duration: "Hours to days"
          watch_for:
            - "Memory growth"
            - "Increasing latency"
            - "Resource exhaustion"
        
        spike_testing:
          goal: "Sudden load increases"
          pattern: "Normal → spike → normal"
          check:
            - "Does system handle spike?"
            - "Recovery time"
            - "Error rate during spike"
      
      realistic_workloads:
        principles:
          - "Model real user behavior"
          - "Use production-like data volumes"
          - "Include data variance"
          - "Mix operation types"
        
        workload_characterization:
          - "Request rate distribution"
          - "Think time between requests"
          - "Session patterns"
          - "Data access patterns"
    
    performance_regression_testing:
      purpose: "Detect performance degradation"
      
      approach:
        continuous:
          - "Run benchmarks on every commit/PR"
          - "Compare against baseline"
          - "Alert on significant regressions"
        
        baseline_management:
          - "Maintain known-good baseline"
          - "Update baseline after intentional changes"
          - "Track historical trends"
      
      statistical_comparison:
        techniques:
          - "Confidence intervals"
          - "T-tests for significance"
          - "Control for variance"
        
        thresholds:
          - "Define acceptable degradation (e.g., 5%)"
          - "Stricter for critical paths"
          - "Consider variance in measurement"
      
      tools:
        - "Continuous Benchmark (GitHub Action)"
        - "pytest-benchmark with --benchmark-compare"
        - "Custom CI integration"

  bottleneck_identification:
    description: "Systematic approach to finding performance problems"
    
    methodology:
      top_down:
        approach: "Start with system overview, drill down"
        steps:
          - step: "Measure end-to-end performance"
            tools: "Application metrics, load testing"
          
          - step: "Identify slow components"
            tools: "Distributed tracing, APM tools"
          
          - step: "Profile component internals"
            tools: "CPU/memory profilers"
          
          - step: "Optimize hottest code"
            tools: "Algorithm analysis, micro-optimization"
        
        benefit: "Focus on actual user impact"
      
      bottom_up:
        approach: "Start with code, look for obvious issues"
        steps:
          - "Profile critical code paths"
          - "Identify expensive operations"
          - "Optimize and measure"
        
        risk: "May optimize non-bottlenecks"
      
      hybrid:
        approach: "Combine both approaches"
        strategy:
          - "Use top-down to find problem area"
          - "Use bottom-up for detailed optimization"
          - "Validate with end-to-end measurements"
    
    common_bottlenecks:
      cpu_bound:
        symptoms:
          - "High CPU utilization"
          - "Low I/O wait"
        causes:
          - "Inefficient algorithms"
          - "Excessive computation"
          - "Serialization/deserialization"
        solutions:
          - "Algorithm optimization"
          - "Caching results"
          - "Parallelization"
      
      io_bound:
        symptoms:
          - "Low CPU, high I/O wait"
          - "Slow response times"
        causes:
          - "Excessive disk/network I/O"
          - "Synchronous I/O"
          - "Small I/O operations"
        solutions:
          - "Async I/O"
          - "Caching"
          - "Batching"
          - "Better indexing"
      
      memory_bound:
        symptoms:
          - "High memory usage"
          - "Frequent GC pauses"
          - "Swapping"
        causes:
          - "Memory leaks"
          - "Large working set"
          - "Inefficient data structures"
        solutions:
          - "Fix leaks"
          - "Reduce memory usage"
          - "Better data structures"
          - "Streaming instead of loading all"
      
      lock_contention:
        symptoms:
          - "Low CPU, threads blocked"
          - "Poor scaling with cores"
        causes:
          - "Excessive locking"
          - "Long critical sections"
          - "Lock convoys"
        solutions:
          - "Lock-free algorithms"
          - "Fine-grained locking"
          - "Reduce critical section size"
    
    tools_by_bottleneck:
      cpu: "Flame graphs, perf, sampling profilers"
      memory: "Heap profilers, leak detectors"
      io: "strace, iotop, network analyzers"
      locks: "Thread analyzers, lock profilers"

best_practices:
  profiling_workflow:
    - step: "Establish baseline"
      action: "Measure current performance"
    
    - step: "Identify bottleneck"
      action: "Use appropriate profiling tools"
    
    - step: "Form hypothesis"
      action: "Understand why it's slow"
    
    - step: "Optimize"
      action: "Apply targeted optimization"
    
    - step: "Validate"
      action: "Re-measure to confirm improvement"
    
    - step: "Iterate"
      action: "Move to next bottleneck"
  
  measurement_hygiene:
    - "Isolate system (close other programs)"
    - "Run multiple times for statistics"
    - "Measure on production-like hardware"
    - "Use representative workloads"
    - "Account for variance and noise"
  
  interpretation:
    - "Don't trust single measurements"
    - "Look at distributions, not just averages"
    - "Consider p50, p95, p99 latencies"
    - "Understand tool overhead"
    - "Correlate with system metrics"
  
  common_mistakes:
    - "Profiling debug builds"
    - "Optimizing non-bottlenecks"
    - "Ignoring measurement variance"
    - "Drawing conclusions from small samples"
    - "Not validating optimizations"

integration:
  with_optimization:
    - "Profile to find what to optimize"
    - "Measure before and after"
    - "Validate optimization effectiveness"
  
  with_monitoring:
    - "Use profiling to investigate alerts"
    - "Profile in production (sampling)"
    - "Continuous profiling for trends"
  
  with_development:
    - "Profile during development"
    - "Performance regression tests in CI"
    - "Profile before optimization work"

tools_comparison:
  selection_criteria:
    overhead: "Lower for production use"
    detail: "Higher for development"
    ease_of_use: "Important for regular use"
    platform: "Must support your environment"
    cost: "Open source vs commercial"
  
