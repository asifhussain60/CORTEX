# Week 26: Caching Patterns
# Part of Phase 10.2 - Specialization Domains
# Focus: Cache strategies, distributed caching, invalidation patterns, cache monitoring

metadata:
  week: 26
  phase: "10.2"
  domain: "Performance Optimization"
  difficulty: "Advanced"
  prerequisites:
    - "Data structures fundamentals"
    - "Concurrency concepts"
    - "Distributed systems basics"
    - "Performance analysis"

caching_patterns:
  caching_fundamentals:
    description: "Core concepts and principles of caching"
    
    cache_benefits:
      performance:
        - "Reduced latency (memory vs disk/network)"
        - "Improved throughput"
        - "Lower CPU usage (cache results)"
      
      scalability:
        - "Reduce backend load"
        - "Handle traffic spikes"
        - "Scale reads independently"
      
      cost:
        - "Fewer database queries"
        - "Reduced API calls"
        - "Lower bandwidth usage"
    
    cache_tradeoffs:
      consistency:
        issue: "Cached data may be stale"
        mitigation:
          - "TTL (time-to-live)"
          - "Invalidation strategies"
          - "Read-through caching"
      
      complexity:
        issue: "Additional component to manage"
        considerations:
          - "Cache invalidation logic"
          - "Monitoring and debugging"
          - "Operational overhead"
      
      memory:
        issue: "Caches consume memory"
        mitigation:
          - "Size limits"
          - "Eviction policies"
          - "Memory monitoring"
    
    cache_hierarchy:
      levels:
        l1_cpu_cache:
          size: "32KB - 256KB"
          latency: "~1ns"
          scope: "Per CPU core"
          control: "Hardware managed"
        
        l2_cpu_cache:
          size: "256KB - 2MB"
          latency: "~3-10ns"
          scope: "Per CPU core or shared"
          control: "Hardware managed"
        
        l3_cpu_cache:
          size: "2MB - 64MB"
          latency: "~10-30ns"
          scope: "Shared across cores"
          control: "Hardware managed"
        
        application_memory:
          size: "GBs"
          latency: "~100ns"
          scope: "Process"
          control: "Application manages"
        
        local_disk:
          size: "100s of GBs"
          latency: "~1-10ms (SSD), ~10-50ms (HDD)"
          scope: "Machine"
          control: "OS + application"
        
        distributed_cache:
          size: "TBs"
          latency: "~1-10ms"
          scope: "Cluster"
          control: "Cache system"
        
        origin_backend:
          size: "Unlimited"
          latency: "~10-1000ms"
          scope: "System"
          control: "Backend service"
      
      principle: "Check faster caches first, fall back to slower"

  cache_strategies:
    description: "Different approaches to caching data"
    
    cache_aside:
      name: "Lazy loading / Cache aside"
      pattern: |
        data = cache.get(key)
        if data is None:
            data = database.query(key)
            cache.set(key, data, ttl)
        return data
      
      characteristics:
        - "Application manages cache"
        - "Cache misses query backend"
        - "Cache populated on demand"
      
      advantages:
        - "Simple to implement"
        - "Only requested data cached"
        - "Cache failure doesn't break system"
      
      disadvantages:
        - "Initial request is slow (cache miss)"
        - "Possible stale data"
        - "Three network round trips on miss"
      
      use_cases:
        - "Read-heavy workloads"
        - "Unpredictable access patterns"
        - "Data that doesn't change frequently"
    
    read_through:
      name: "Read-through cache"
      pattern: |
        data = cache.get(key)  # Cache loads from DB if missing
        return data
      
      characteristics:
        - "Cache manages loading"
        - "Transparent to application"
        - "Synchronous loading"
      
      advantages:
        - "Simpler application code"
        - "Consistent loading logic"
        - "Cache controls loading"
      
      disadvantages:
        - "Initial request still slow"
        - "Cache system more complex"
        - "Tight coupling to backend"
      
      use_cases:
        - "When cache can own loading logic"
        - "Multiple applications using cache"
        - "Standard query patterns"
    
    write_through:
      name: "Write-through cache"
      pattern: |
        cache.set(key, data)  # Cache writes to DB synchronously
        database.write(key, data)
      
      characteristics:
        - "Writes go through cache"
        - "Synchronous write to backend"
        - "Cache always consistent"
      
      advantages:
        - "Strong consistency"
        - "Cache always up-to-date"
        - "Read performance"
      
      disadvantages:
        - "Write latency (two writes)"
        - "Write-heavy becomes bottleneck"
        - "Unused data may be cached"
      
      use_cases:
        - "Data read frequently after write"
        - "Strong consistency required"
        - "Read-heavy, moderate writes"
    
    write_back:
      name: "Write-back / Write-behind cache"
      pattern: |
        cache.set(key, data)  # Immediate return
        # Later, asynchronously:
        database.write(key, data)
      
      characteristics:
        - "Asynchronous backend writes"
        - "Batched writes possible"
        - "Cache is authoritative (temporarily)"
      
      advantages:
        - "Fast writes"
        - "Write batching possible"
        - "Reduced backend load"
      
      disadvantages:
        - "Data loss risk (cache failure)"
        - "Complex failure handling"
        - "Eventual consistency"
      
      use_cases:
        - "Write-heavy workloads"
        - "Writes can be batched"
        - "Can tolerate temporary inconsistency"
    
    write_around:
      name: "Write-around cache"
      pattern: |
        database.write(key, data)
        # Optionally:
        cache.delete(key)  # Invalidate
      
      characteristics:
        - "Writes bypass cache"
        - "Cache may be stale"
        - "Lazy population"
      
      advantages:
        - "Avoids caching infrequently read data"
        - "Simple write path"
        - "No write amplification"
      
      disadvantages:
        - "Read after write misses cache"
        - "Possible stale data"
        - "Requires invalidation strategy"
      
      use_cases:
        - "Data written but rarely read"
        - "Write-heavy workloads"
        - "Large data that doesn't fit in cache"
    
    refresh_ahead:
      name: "Refresh-ahead / Predictive refresh"
      pattern: |
        data = cache.get(key)
        if data.ttl < threshold:
            async_refresh(key)  # Refresh before expiry
        return data
      
      characteristics:
        - "Proactive cache refresh"
        - "Based on TTL or access patterns"
        - "Prevents cache misses"
      
      advantages:
        - "Consistent low latency"
        - "No cold cache misses"
        - "Good for predictable access"
      
      disadvantages:
        - "May refresh unused data"
        - "Complex refresh logic"
        - "Additional backend load"
      
      use_cases:
        - "Frequently accessed data"
        - "Predictable access patterns"
        - "When low latency is critical"

  eviction_policies:
    description: "Strategies for removing items when cache is full"
    
    lru:
      name: "Least Recently Used"
      principle: "Evict least recently accessed item"
      
      implementation:
        data_structures:
          - "Hash map for O(1) lookup"
          - "Doubly linked list for LRU order"
        operations:
          get: "Move to head, O(1)"
          put: "Add to head, evict tail if full, O(1)"
      
      advantages:
        - "Good for temporal locality"
        - "Simple to understand"
        - "Efficient implementation"
      
      disadvantages:
        - "Can evict frequently used items"
        - "Scan-resistant: single large scan evicts everything"
      
      use_cases:
        - "General-purpose caching"
        - "Temporal locality of access"
        - "Most common eviction policy"
    
    lfu:
      name: "Least Frequently Used"
      principle: "Evict least frequently accessed item"
      
      implementation:
        tracking: "Count access frequency"
        eviction: "Remove item with lowest count"
      
      advantages:
        - "Keeps popular items"
        - "Good for frequency-based access"
      
      disadvantages:
        - "Old items stay (early accessed)"
        - "Complex implementation"
        - "Doesn't adapt to changing patterns"
      
      use_cases:
        - "Zipf distribution access"
        - "Long-lived popular items"
        - "Stable access patterns"
    
    lru_k:
      name: "LRU-K"
      principle: "Consider K most recent accesses"
      
      mechanism:
        - "Track last K access times"
        - "Evict based on Kth access"
        - "Common: K=2"
      
      advantages:
        - "Better than LRU for scans"
        - "Balances recency and frequency"
      
      disadvantages:
        - "More memory overhead"
        - "More complex"
      
      use_cases:
        - "Mix of scans and repeated access"
        - "Database buffer pools"
    
    arc:
      name: "Adaptive Replacement Cache"
      principle: "Balance between LRU and LFU"
      
      mechanism:
        - "Two LRU lists: recent and frequent"
        - "Dynamically adjust sizes"
        - "Ghost lists for adaptation"
      
      advantages:
        - "Self-tuning"
        - "Good for variable workloads"
        - "Scan-resistant"
      
      disadvantages:
        - "Complex implementation"
        - "Higher overhead"
        - "Patent concerns (expired 2010)"
      
      use_cases:
        - "Unknown or changing workloads"
        - "Mix of access patterns"
    
    fifo:
      name: "First In First Out"
      principle: "Evict oldest item"
      
      advantages:
        - "Very simple"
        - "Low overhead"
      
      disadvantages:
        - "Ignores access patterns"
        - "May evict popular items"
      
      use_cases:
        - "When simplicity matters"
        - "No clear access pattern"
    
    random:
      name: "Random eviction"
      principle: "Evict random item"
      
      advantages:
        - "Simplest implementation"
        - "No overhead"
        - "No worst case"
      
      disadvantages:
        - "May evict hot items"
        - "Unpredictable"
      
      use_cases:
        - "Ultra-simple cache"
        - "When patterns unknown"
    
    ttl:
      name: "Time-To-Live"
      principle: "Evict expired items"
      
      implementation:
        - "Each item has expiration time"
        - "Periodic scan or lazy deletion"
      
      advantages:
        - "Explicit freshness control"
        - "Combines with other policies"
      
      use_cases:
        - "Time-sensitive data"
        - "Combine with LRU/LFU"

  invalidation_strategies:
    description: "Keeping cache consistent with source of truth"
    
    time_based:
      ttl_fixed:
        approach: "Set fixed expiration time"
        example: "cache.set(key, value, ttl=300)  # 5 minutes"
        
        advantages:
          - "Simple to implement"
          - "Guaranteed freshness bound"
        
        disadvantages:
          - "May serve stale data"
          - "Unnecessary refreshes"
        
        tuning:
          short_ttl: "More fresh, more backend load"
          long_ttl: "Less load, more stale"
      
      ttl_adaptive:
        approach: "Adjust TTL based on patterns"
        factors:
          - "Update frequency"
          - "Access frequency"
          - "Data importance"
        
        example: |
          if frequently_updated:
              ttl = 60
          elif rarely_updated:
              ttl = 3600
      
      sliding_expiration:
        approach: "Reset TTL on access"
        benefit: "Keep hot items longer"
        risk: "Never evict popular items"
    
    event_based:
      explicit_invalidation:
        approach: "Invalidate on data change"
        pattern: |
          def update_data(key, value):
              database.write(key, value)
              cache.delete(key)  # or cache.set(key, value)
        
        advantages:
          - "Cache always current"
          - "Immediate consistency"
        
        challenges:
          - "Must catch all updates"
          - "Distributed coordination"
          - "Race conditions"
      
      publish_subscribe:
        approach: "Broadcast invalidation events"
        pattern: |
          # Publisher
          database.write(key, value)
          pubsub.publish('invalidate', key)
          
          # Subscribers
          def on_invalidate(key):
              cache.delete(key)
        
        advantages:
          - "Decoupled components"
          - "Multiple cache instances"
        
        challenges:
          - "Event delivery guarantees"
          - "Timing issues"
      
      change_data_capture:
        approach: "Monitor database change logs"
        mechanism:
          - "Database binlog/WAL"
          - "Change stream"
          - "Triggers"
        
        advantages:
          - "Guaranteed capture of changes"
          - "No application code changes"
        
        disadvantages:
          - "Setup complexity"
          - "May have lag"
    
    validation_based:
      conditional_requests:
        http_example: "If-Modified-Since, ETag"
        pattern: |
          cached = cache.get(key)
          if cached and not_modified(cached.etag):
              return cached.value
          else:
              value = fetch_fresh()
              cache.set(key, value)
              return value
        
        advantages:
          - "Verify freshness without full fetch"
          - "Bandwidth efficient"
        
        use_cases:
          - "HTTP caching"
          - "Expensive data transfer"
      
      version_checking:
        approach: "Check version before using cached data"
        pattern: |
          cached = cache.get(key)
          current_version = get_version(key)
          if cached and cached.version == current_version:
              return cached.value
        
        advantages:
          - "Explicit version control"
          - "Can invalidate by version"
    
    cache_coherence:
      write_invalidate:
        approach: "Invalidate cache on write"
        pros: "Simple, reduces traffic"
        cons: "Next read misses cache"
      
      write_update:
        approach: "Update cache on write"
        pros: "Next read hits cache"
        cons: "More traffic, may update unused entries"
      
      distributed_invalidation:
        challenge: "Invalidate across multiple cache nodes"
        solutions:
          - "Broadcast invalidation"
          - "Consistent hashing with replication"
          - "Central invalidation service"

  distributed_caching:
    description: "Caching across multiple machines"
    
    architectures:
      client_side:
        description: "Cache in application memory"
        
        advantages:
          - "Lowest latency"
          - "No network overhead"
          - "Simple"
        
        disadvantages:
          - "Memory per instance"
          - "Cache warm-up per instance"
          - "No sharing between instances"
        
        use_cases:
          - "Small, read-only data"
          - "Reference data"
          - "Configuration"
      
      dedicated_cache:
        description: "Separate cache tier (Redis, Memcached)"
        
        advantages:
          - "Shared cache across instances"
          - "Centralized management"
          - "Scales independently"
        
        disadvantages:
          - "Network latency"
          - "Network as bottleneck"
          - "Additional infrastructure"
        
        use_cases:
          - "Multi-instance applications"
          - "Large cache needs"
          - "Shared state"
      
      cdn:
        description: "Content Delivery Network"
        
        characteristics:
          - "Geographically distributed"
          - "Edge caching"
          - "HTTP-focused"
        
        advantages:
          - "Global low latency"
          - "Offload origin"
          - "DDoS protection"
        
        use_cases:
          - "Static content"
          - "Public APIs"
          - "Media streaming"
      
      hybrid:
        description: "Multi-level caching"
        pattern: "L1 (local) → L2 (distributed) → origin"
        
        advantages:
          - "Best of both worlds"
          - "Reduced distributed cache load"
        
        complexity: "Cache coherence across levels"
    
    partitioning:
      consistent_hashing:
        purpose: "Distribute keys across nodes"
        
        algorithm:
          - "Hash ring: 0 to 2^32-1"
          - "Place nodes on ring"
          - "Keys hash to ring position"
          - "Walk clockwise to find node"
        
        advantages:
          - "Minimal redistribution on node change"
          - "Balanced distribution"
          - "Scales well"
        
        virtual_nodes:
          purpose: "Better distribution"
          technique: "Each physical node = many virtual nodes"
          benefit: "Even load distribution"
      
      range_partitioning:
        approach: "Assign key ranges to nodes"
        example: "A-M → node1, N-Z → node2"
        
        advantages:
          - "Simple"
          - "Range queries possible"
        
        disadvantages:
          - "Uneven distribution (hotspots)"
          - "Rebalancing on scale"
      
      hash_partitioning:
        approach: "hash(key) % num_nodes"
        
        advantages:
          - "Even distribution"
          - "Simple"
        
        disadvantages:
          - "All data moves when nodes change"
          - "Not suitable for dynamic clusters"
    
    replication:
      primary_replica:
        pattern: "One primary, N replicas"
        writes: "Primary only"
        reads: "Primary or replicas"
        
        advantages:
          - "Read scaling"
          - "Availability"
        
        consistency: "Eventual (replication lag)"
      
      active_active:
        pattern: "Multiple writable nodes"
        conflict_resolution: "Required"
        
        advantages:
          - "Write scaling"
          - "High availability"
        
        challenges:
          - "Conflict resolution"
          - "Complex"
      
      replication_strategies:
        synchronous:
          guarantee: "Replicas updated before ack"
          tradeoff: "Latency vs consistency"
        
        asynchronous:
          guarantee: "Replicas updated eventually"
          tradeoff: "Performance vs data loss risk"
    
    cache_systems:
      redis:
        type: "In-memory data structure store"
        features:
          - "Strings, lists, sets, sorted sets, hashes"
          - "Pub/sub"
          - "Persistence (RDB, AOF)"
          - "Replication"
          - "Lua scripting"
        
        use_cases:
          - "Caching"
          - "Session store"
          - "Real-time analytics"
          - "Leaderboards"
      
      memcached:
        type: "Simple key-value cache"
        features:
          - "String values only"
          - "No persistence"
          - "LRU eviction"
          - "Simple protocol"
        
        use_cases:
          - "Simple caching"
          - "Session store"
          - "High-performance needs"
      
      hazelcast:
        type: "In-memory data grid"
        features:
          - "Distributed data structures"
          - "Compute grid"
          - "Event listeners"
          - "Transactions"
        
        use_cases:
          - "Java applications"
          - "Distributed computing"
          - "Real-time processing"
      
      comparison:
        redis_vs_memcached:
          redis:
            pros: "Rich data types, persistence, pub/sub"
            cons: "Single-threaded (per instance)"
          
          memcached:
            pros: "Multi-threaded, simpler"
            cons: "Only strings, no persistence"
        
        selection:
          use_redis: "Need data structures or persistence"
          use_memcached: "Simple cache, performance critical"

  cache_patterns:
    description: "Common caching patterns and use cases"
    
    memoization:
      purpose: "Cache function results"
      pattern: |
        cache = {}
        def fibonacci(n):
            if n in cache:
                return cache[n]
            if n <= 1:
                return n
            result = fibonacci(n-1) + fibonacci(n-2)
            cache[n] = result
            return result
      
      use_cases:
        - "Pure functions"
        - "Expensive computations"
        - "Recursive algorithms"
    
    query_result_caching:
      purpose: "Cache database query results"
      pattern: |
        key = f"query:{hash(sql)}:{params}"
        result = cache.get(key)
        if not result:
            result = database.execute(sql, params)
            cache.set(key, result, ttl=300)
      
      considerations:
        - "Invalidation on data changes"
        - "Query parameter normalization"
        - "Result set size limits"
      
      use_cases:
        - "Expensive queries"
        - "Repeated queries"
        - "Read-heavy workloads"
    
    computed_aggregates:
      purpose: "Cache expensive aggregations"
      examples:
        - "Dashboard metrics"
        - "Report data"
        - "Analytics results"
      
      pattern: |
        key = f"aggregate:{metric}:{start}:{end}"
        if not cache.exists(key):
            value = compute_expensive_aggregate()
            cache.set(key, value, ttl=3600)
      
      refresh_strategy:
        - "Time-based (TTL)"
        - "Event-based (data change)"
        - "Scheduled (cron job)"
    
    api_response_caching:
      http_caching:
        headers:
          cache_control: "Cache-Control: max-age=300, public"
          etag: "ETag: 'version-hash'"
          last_modified: "Last-Modified: timestamp"
        
        layers:
          - "Browser cache"
          - "CDN"
          - "Reverse proxy"
          - "Application cache"
      
      considerations:
        - "Cache key includes relevant params"
        - "Vary header for content negotiation"
        - "Authentication bypass prevention"
    
    session_caching:
      purpose: "Store user session data"
      
      advantages:
        - "Fast session lookup"
        - "Shared across app servers"
        - "Automatic expiration"
      
      pattern: |
        session_id = get_session_cookie()
        session = cache.get(f"session:{session_id}")
        if not session:
            session = create_new_session()
        cache.set(f"session:{session_id}", session, ttl=1800)
      
      considerations:
        - "Sensitive data encryption"
        - "Session fixation prevention"
        - "Sliding expiration"
    
    rate_limiting:
      sliding_window:
        pattern: |
          key = f"rate:{user_id}:{timestamp_window}"
          count = cache.incr(key)
          if count == 1:
              cache.expire(key, window_size)
          if count > limit:
              raise RateLimitExceeded
      
      token_bucket:
        pattern: |
          key = f"tokens:{user_id}"
          tokens = cache.get(key) or max_tokens
          if tokens > 0:
              cache.decr(key)
          else:
              raise RateLimitExceeded
      
      advantages:
        - "Fast in-memory check"
        - "Distributed rate limiting"
        - "Automatic expiration"
    
    cache_warming:
      purpose: "Pre-populate cache"
      
      approaches:
        startup:
          when: "Application start"
          technique: "Load common data"
          benefit: "No cold start"
        
        scheduled:
          when: "Periodic refresh"
          technique: "Cron job or scheduler"
          benefit: "Always warm cache"
        
        predictive:
          when: "Before peak hours"
          technique: "Machine learning or heuristics"
          benefit: "Ready for demand"
      
      considerations:
        - "Don't overload backend"
        - "Prioritize hot data"
        - "Monitor effectiveness"

  monitoring_and_observability:
    description: "Tracking cache performance and health"
    
    key_metrics:
      hit_rate:
        formula: "hits / (hits + misses)"
        target: ">80% for effective cache"
        interpretation:
          high: "Cache is effective"
          low: "Poor cache strategy or sizing"
      
      miss_rate:
        formula: "misses / (hits + misses)"
        watch_for: "Sudden increases"
      
      eviction_rate:
        meaning: "Items removed per second"
        high_rate_indicates:
          - "Cache too small"
          - "TTL too short"
          - "Too much unique data"
      
      latency:
        p50_p99_p999: "Response time percentiles"
        compare:
          - "Cache hit latency"
          - "Cache miss latency"
          - "Backend latency"
      
      memory_usage:
        track:
          - "Used memory"
          - "Fragmentation"
          - "Peak usage"
        alerts:
          - "Approaching limit"
          - "Unexpected growth"
      
      throughput:
        metrics:
          - "Operations per second"
          - "Bytes transferred"
          - "Connections"
    
    alerting:
      conditions:
        - alert: "Low hit rate"
          threshold: "<70%"
          action: "Investigate cache strategy"
        
        - alert: "High eviction rate"
          threshold: ">100/sec"
          action: "Consider increasing cache size"
        
        - alert: "High latency"
          threshold: "P99 > 10ms"
          action: "Check cache server health"
        
        - alert: "Memory pressure"
          threshold: ">90% used"
          action: "Scale or optimize"
        
        - alert: "Connection saturation"
          threshold: ">80% max connections"
          action: "Scale or optimize clients"
    
    debugging:
      cache_key_analysis:
        - "Identify hot keys"
        - "Check key distribution"
        - "Find large values"
        - "Detect access patterns"
      
      slow_log:
        purpose: "Find slow cache operations"
        configuration: "Log operations >N milliseconds"
        example: "Redis SLOWLOG GET"
      
      client_monitoring:
        track:
          - "Connection pool usage"
          - "Client-side latency"
          - "Timeout rate"
          - "Error rate"
      
      cache_visualization:
        tools:
          - "Redis Commander, RedisInsight"
          - "Memcached stats viewer"
          - "Custom dashboards (Grafana)"
        
        visualize:
          - "Hit/miss rate over time"
          - "Memory usage trends"
          - "Key space distribution"
          - "Command latencies"

  best_practices:
    design:
      - "Cache at appropriate layer"
      - "Use appropriate TTL"
      - "Handle cache failures gracefully"
      - "Don't cache user-specific authenticated data publicly"
      - "Consider cache stampede"
    
    implementation:
      - "Use connection pooling"
      - "Set timeouts"
      - "Handle serialization efficiently"
      - "Use namespaces to organize keys"
      - "Monitor cache performance"
    
    operations:
      - "Plan for cache warm-up"
      - "Have invalidation strategy"
