          # Computation here
          return result
  
  distributed_cache_pattern:
    code: |
      def get_user(user_id):
          # Try L1 cache (local)
          user = local_cache.get(f"user:{user_id}")
          if user:
              return user
          
          # Try L2 cache (Redis)
          user = redis.get(f"user:{user_id}")
          if user:
              local_cache.set(f"user:{user_id}", user, ttl=60)
              return user
          
          # Fetch from database
          user = database.get_user(user_id)
          
          # Populate caches
          redis.set(f"user:{user_id}", user, ttl=3600)
          local_cache.set(f"user:{user_id}", user, ttl=60)
          
          return user
  
  cache_stampede_prevention:
    code: |
      def get_with_lock(key, fetch_fn, ttl):
          value = cache.get(key)
          if value:
              return value
          
          lock_key = f"lock:{key}"
          if cache.set(lock_key, 1, nx=True, ex=10):
              # We got the lock, fetch data
              try:
                  value = fetch_fn()
                  cache.set(key, value, ex=ttl)
                  return value
              finally:
                  cache.delete(lock_key)
          else:
              # Someone else is fetching, wait and retry
              time.sleep(0.1)
              return get_with_lock(key, fetch_fn, ttl)

