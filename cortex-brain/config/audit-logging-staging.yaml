# CORTEX Audit Logger Configuration - Staging Environment
# Version: 1.0.0
# Environment: Staging
# Purpose: Production-like testing with moderate verbosity

audit_logging:
  # Core Settings
  enabled: true
  environment: "staging"
  log_level: "INFO"
  
  # Output Configuration
  output:
    console: false
    file: true
    database: true
    
  # File Settings
  file:
    base_path: "logs/audit"
    format: "jsonl"
    rotation:
      enabled: true
      max_size_mb: 200
      max_files: 100
      max_age_days: 60
    compression:
      enabled: true
      algorithm: "gzip"
      level: 6
      
  # Buffer Settings
  buffer:
    enabled: true
    size: 5000
    flush_interval_seconds: 3
    flush_on_exit: true
    overflow_strategy: "drop_oldest"
    
  # Performance Settings
  performance:
    async_writes: true
    batch_size: 100
    max_latency_ms: 10
    monitor_overhead: true
    
  # Security Settings (Test Encryption)
  security:
    encryption_enabled: true
    encryption_algorithm: "AES-256-GCM"
    sanitize_pii: true
    access_control_enabled: true
    integrity_checks: true
    checksum_algorithm: "SHA-256"
    
  # Self-Healing Settings
  self_healing:
    enabled: true
    pattern_detection: true
    anomaly_detection: true
    error_clustering: true
    auto_recovery: true
    max_retry_attempts: 5
    retry_backoff_seconds: [1, 3, 10, 30, 60]
    recovery_timeout_seconds: 300
    
  # Orchestrator Coverage (Selective)
  orchestrators:
    planning_v5:
      enabled: true
      log_level: "INFO"
      capture_context: false
    ado_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    vacuum_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    cleanup_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    investigation_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    tdd_v4:
      enabled: true
      log_level: "INFO"
      capture_context: false
    debug_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    refinement_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    maintenance_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    sanitization_v2:
      enabled: true
      log_level: "INFO"
      capture_context: false
    master_orchestrator:
      enabled: true
      log_level: "INFO"
      capture_context: true
      
  # Feature Flags
  features:
    detailed_context: false
    stack_traces: true
    request_body_logging: false
    response_body_logging: false
    llm_call_logging: true
    database_query_logging: true
    state_transition_logging: true
    
  # Monitoring & Alerting
  monitoring:
    enabled: true
    metrics_collection: true
    alert_on_errors: true
    alert_threshold_errors_per_minute: 10
    dashboard_export: true
    prometheus_export: true
    
  # Cleanup & Retention
  cleanup:
    enabled: true
    retention_days: 60
    archive_before_delete: true
    archive_path: "logs/audit/archives"
    run_schedule: "0 3 * * *"  # 3 AM daily
    
  # Compliance
  compliance:
    gdpr_mode: true
    soc2_mode: true
    hipaa_mode: false
    audit_trail_integrity: true
    retention_policy_enforcement: true
