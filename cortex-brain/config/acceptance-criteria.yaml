# CORTEX-5.0 Acceptance Criteria
# Version: 1.0
# Created: January 4, 2026
# Format: YAML with JSON Schema validation

metadata:
  plan_id: "cortex-v5-gap-remediation"
  total_criteria: 130
  automation_target: 80  # 104/130 automated
  manual_validation: 20  # 26/130 manual
  
  categories:
    functional: 52      # 40% - Automated tests
    architectural: 39   # 30% - AST/Pattern scripts
    experiential: 26    # 20% - Manual checklists
    performance: 13     # 10% - Benchmark harnesses

  icons:
    not_started: "⬜"
    in_progress: "🔄"
    complete: "✅"      # ONLY for verified completion
    blocked: "⏸️"
    failed: "❌"
    skipped: "⏭️"

# ============================================================
# 3-TIER CHECKPOINT SYSTEM
# ============================================================

checkpoints:
  l1_task:
    name: "Task Completion Validation"
    frequency: "After each task in implementation guide"
    scope: "Task-specific DoD (5-10 items)"
    blocker: "Next task in same phase"
    automation: true
    
  l2_phase:
    name: "Phase Exit Validation"
    frequency: "After each sub-plan completion"
    scope: "Phase acceptance criteria + Parent plan subset"
    blocker: "Dependent sub-plans"
    automation: true
    
  l3_master:
    name: "Master Validation"
    frequency: "Once per major release"
    scope: "All 130 acceptance criteria"
    blocker: "Production deployment"
    automation: "hybrid"  # 80% automated, 20% manual

