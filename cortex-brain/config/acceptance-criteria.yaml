# ============================================================
# VALIDATION REPORTS SCHEMA
# ============================================================

validation_reports:
  l1_task_report:
    template: |
      # L1 Task Validation Report
      
      **Task:** {task_id}
      **Sub-Plan:** {sub_plan}
      **Date:** {date}
      
      ## Results
      
      | Criteria | Status | Details |
      |----------|--------|---------|
      {criteria_rows}
      
      ## Summary
      
      - ✅ Passed: {pass_count}
      - ❌ Failed: {fail_count}
      - ⬜ Pending: {pending_count}
      
      **Blocker:** {blocker_status}
      
  l2_phase_report:
    template: |
      # L2 Phase Exit Validation Report
      
      **Sub-Plan:** {sub_plan}
      **Phase:** {phase_name}
      **Date:** {date}
      
      ## Phase Criteria
      
      {phase_criteria_table}
      
      ## Parent Plan Subset
      
      {parent_criteria_table}
      
      ## Summary
      
      - Phase Criteria: {phase_pass}/{phase_total} passed
      - Parent Criteria: {parent_pass}/{parent_total} passed
      - Overall: {overall_percentage}% complete
      
      **Dependent Sub-Plans:** {dependent_sub_plans}
      **Block Status:** {block_status}
      
  l3_master_report:
    template: |
      # L3 Master Validation Report
      
      **Plan:** CORTEX-5.0
      **Date:** {date}
      **Version:** {version}
      
      ## Overall Progress
      
      {progress_bar}
      
      ## By Category
      
      | Category | Passed | Total | Percentage |
      |----------|--------|-------|------------|
      | Functional | {func_pass} | 52 | {func_pct}% |
      | Architectural | {arch_pass} | 39 | {arch_pct}% |
      | Experiential | {exp_pass} | 26 | {exp_pct}% |
      | Performance | {perf_pass} | 13 | {perf_pct}% |
      
      ## Failures
      
      {failure_list}
      
      ## Production Readiness
      
      **Status:** {production_status}
      **Blocker:** {blocker_description}

# ============================================================
# AUTOMATION CONFIGURATION
# ============================================================

automation:
  ci_cd_integration:
    enabled: true
    trigger: "pull_request"
    run_checkpoints: ["l1_task", "l2_phase"]
    fail_on_error: true
    
  pre_commit_hooks:
    - name: "Icon Validator"
      script: "src/validators/icon_validator.py"
      args: ["--fix"]
      
    - name: "SKULL Compliance"
      script: "src/validators/architectural/skull_compliance_checker.py"
      args: ["--strict"]
      
  scheduled_validations:
    - checkpoint: "l3_master"
      schedule: "daily"
      time: "00:00 UTC"
      notify_on_failure: true
      
  notifications:
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channels:
        failures: "#cortex-alerts"
        reports: "#cortex-reports"
        
    email:
      enabled: false

