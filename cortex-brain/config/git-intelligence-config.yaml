# ==============================================================================
# CORTEX Git History Intelligence Configuration
# ==============================================================================
# Purpose: Configure git history search, extraction, and indexing behavior
# Version: 1.0.0
# Created: 2026-01-10
# Author: Asif Hussain
#
# This tool searches CORTEX branches for existing implementations
# before creating new code. "Don't reinvent the wheel."
# ==============================================================================

# Target branches (searched in priority order)
target_branches:
  - CORTEX-5.5    # Current development
  - CORTEX-5.0    # Stable release
  - CORTEX-4.0    # Rich implementations (has crawlers, analyzers)
  - CORTEX-3.0    # Core patterns
  - CORTEX-2.0    # Early patterns
  - CORTEX-1.0    # Original design

# Known valuable assets per branch
branch_highlights:
  CORTEX-4.0:
    - path: "src/crawlers/git_history_analyzer.py"
      description: "Git history analysis implementation"
      
    - path: "src/crawlers/"
      description: "Full crawler suite (28 files)"
      
    - path: "cortex-brain/brain-protection-rules.yaml"
      description: "Complete 61 SKULL rules with 24 layers"
      
  CORTEX-5.0:
    - path: ".asif/AI-Learning/cortex-workings/brain-architecture.md"
      description: "Brain architecture documentation"
      
    - path: ".github/prompts/"
      description: "Prompt files collection"

# Keyword expansions for intelligent search
keyword_expansions:
  auth:
    - authentication
    - authorization
    - login
    - logout
    - oauth
    - jwt
    - token
    - session
    - credential
    
  governance:
    - skull
    - rule
    - governance
    - protection
    - enforcement
    - tier0
    - brain
    - constraint
    
  file_locking:
    - lock
    - flock
    - fcntl
    - msvcrt
    - mutex
    - semaphore
    - concurrent
    - race
    
  ado:
    - azure
    - devops
    - ado
    - work_item
    - backlog
    - sprint
    - iteration
    - board
    
  tdd:
    - test
    - tdd
    - red
    - green
    - refactor
    - pytest
    - unittest
    - assertion
    
  state:
    - state
    - session
    - persistence
    - checkpoint
    - continuation
    - snapshot
    - resume
    
  audit:
    - audit
    - log
    - trace
    - track
    - record
    - history
    - event
    
  planning:
    - plan
    - phase
    - epic
    - todo
    - backlog
    - roadmap
    - milestone
    
  vacuum:
    - vacuum
    - cleanup
    - clean
    - purge
    - archive
    - delete
    - remove
    
  crawlers:
    - crawler
    - scanner
    - analyzer
    - parser
    - walker
    - indexer
    - discovery

# Output configuration
output:
  root: "cortex-brain/git-history-assets"
  
  structure:
    index: "index"
    extracted: "extracted"
    search_results: "search-results"
    transformations: "transformations"
    
  formats:
    index: "json"
    search_results: "yaml"
    integration: "yaml"
    manifest: "json"

# Index configuration
indexing:
  auto_index_on_search: true
  cache_ttl_hours: 24
  max_file_size_kb: 500
  
  skip_patterns:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/*.egg-info/**"
    - "**/.venv/**"

# Search configuration
search:
  default_max_results: 20
  relevance_threshold: 0.3
  boost_exact_match: 2.0
  boost_filename_match: 1.5
  
  # Files to prioritize in search
  priority_files:
    - "*.py"
    - "*.yaml"
    - "*.json"
    - "*.prompt.md"
    - "README.md"

# Extraction configuration
extraction:
  add_source_header: true
  track_in_manifest: true
  
  transformations:
    - name: "add_extraction_header"
      enabled: true
      
    - name: "flag_version_references"
      enabled: true
      patterns:
        - "5.5"
        - "5.0"
        - "4.0"
        
    - name: "flag_import_paths"
      enabled: true
      patterns:
        - "from src."
        - "import src."

# Integration with CX6 requirements
cx6_integration:
  output_file: "cx6-requirements-integration.yaml"
  
  ac_id_mapping:
    governance: "AC-GOV"
    orchestrators: "AC-ORCH"
    infrastructure: "AC-INFRA"
    tools: "AC-TOOL"
    patterns: "AC-PATTERN"
    configurations: "AC-CONFIG"
    
  auto_suggest_ac_ids: true
  
# Audit logging integration
audit:
  log_searches: true
  log_extractions: true
  log_index_builds: true
  category: "BRAIN"
  component: "git_history_intelligence"

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
