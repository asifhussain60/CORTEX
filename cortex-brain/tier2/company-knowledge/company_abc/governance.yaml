# Company ABC - Governance Rules
# Version: 1.0.0
# Last Updated: 2026-01-06

company_id: company_abc
company_name: ABC Corporation

# Security governance
security:
  authentication:
    required: true
    method: OAuth2 + Azure AD
    token_type: JWT Bearer
  
  authorization:
    model: Role-Based Access Control (RBAC)
    enforce_at: API Gateway + Service Level
  
  secrets_management:
    vault: Azure Key Vault
    no_hardcoded_secrets: true
    rotation_policy: 90 days
  
  sensitive_data:
    pii_handling: Encrypt at rest and in transit
    compliance: GDPR, CCPA
    data_classification: Required on all fields

# Code governance
code_quality:
  required_reviews: 2  # Minimum 2 approvals per PR
  automated_checks:
    - Static code analysis (SonarQube)
    - Security scanning (Snyk)
    - License compliance
    - Code coverage (minimum 80%)
  
  branch_protection:
    main: true
    require_pr: true
    require_tests_pass: true
    no_force_push: true

# Testing governance
testing:
  unit_tests:
    required: true
    minimum_coverage: 80%
  
  integration_tests:
    required: true
    scope: Critical paths
  
  e2e_tests:
    required: true
    scope: Top 3 user journeys
  
  performance_tests:
    required_for: APIs with >100 req/min expected load

# Deployment governance
deployment:
  environments:
    - dev
    - staging
    - production
  
  approval_gates:
    staging: Tech Lead approval
    production: Senior Architect + Product Owner approval
  
  rollback_strategy: Blue-green deployment
  
  health_checks:
    required: true
    endpoints:
      - /health/ready
      - /health/live

# Documentation governance
documentation:
  required_docs:
    - README.md (every repository)
    - ARCHITECTURE.md (every service)
    - API documentation (OpenAPI/Swagger)
    - Deployment guide
  
  api_documentation:
    format: OpenAPI 3.0
    auto_generated: true
    published_to: Internal API Portal
  
  architecture_decisions:
    format: ADR (Architecture Decision Records)
    location: /docs/adr/

# Monitoring governance
monitoring:
  observability:
    logging: Required (Application Insights)
    metrics: Required (Azure Monitor)
    tracing: Required (correlation IDs)
  
  alerts:
    required_for:
      - API errors (>1% error rate)
      - High latency (>500ms p95)
      - Service unavailability
      - Security events
  
  sla_tracking:
    required: true
    targets:
      critical_services: 99.9%
      standard_services: 99.5%

# Dependency governance
dependencies:
  allowed_sources:
    - NuGet.org (verified packages only)
    - npm registry (verified packages only)
    - Internal package registry
  
  security_scanning:
    tool: Snyk
    frequency: On every PR + weekly scans
    block_on: Critical or High vulnerabilities
  
  license_compliance:
    allowed_licenses:
      - MIT
      - Apache 2.0
      - BSD
    prohibited_licenses:
      - GPL (any version)
      - AGPL

# Data governance
data:
  backup:
    frequency: Daily (production databases)
    retention: 30 days
    encryption: Required
  
  disaster_recovery:
    rpo: 1 hour (Recovery Point Objective)
    rto: 4 hours (Recovery Time Objective)
  
  data_retention:
    user_data: 7 years (regulatory requirement)
    logs: 90 days (production), 30 days (non-prod)
    audit_logs: 7 years

# Compliance
compliance:
  standards:
    - SOC 2 Type II
    - ISO 27001
    - GDPR
    - CCPA
    - PCI-DSS (payment service only)
  
  audit_requirements:
    audit_logs: Required for all data mutations
    retention: 7 years
    immutable: true
  
  privacy:
    data_minimization: Collect only necessary data
    right_to_erasure: Implement user data deletion
    consent_management: Required for marketing data

# Incident management
incidents:
  severity_levels:
    P0: Service completely down
    P1: Major functionality impaired
    P2: Minor functionality impaired
    P3: Cosmetic issues
  
  response_times:
    P0: Immediate (15 minutes)
    P1: 1 hour
    P2: 4 hours
    P3: Next sprint
  
  post_mortem:
    required_for: P0, P1 incidents
    timeline: Within 48 hours
    format: Blameless post-mortem

# Change management
change_management:
  change_request:
    required_for: Production changes
    approval: Change Advisory Board (CAB)
  
  maintenance_windows:
    production: Saturday 2-6 AM UTC
    notification: 7 days advance notice
  
  emergency_changes:
    approval: On-call manager
    post_approval: CAB review within 24 hours
