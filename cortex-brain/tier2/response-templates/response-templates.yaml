# =============================================================================
# TIER 2: RESPONSE TEMPLATES WITH INHERITANCE
# =============================================================================
# Domain-specific response templates with inheritance support.
# Enables orchestrators to provide consistent, domain-appropriate responses
# while allowing overrides for specific use cases.
# =============================================================================

metadata:
  tier: 2
  title: "Domain Response Templates"
  description: "Templated responses for orchestrators with inheritance from base templates"
  created_at: "2026-01-15T14:00:00Z"
  domains: ["tdd", "planning", "ado", "interaction"]
  inheritance_strategy: "base → domain-specific → use-case-specific"
  notes: |
    Template hierarchy:
    1. Base Templates: Generic, used across all domains (tier 2_base)
    2. Domain Templates: Domain-specific overrides and extensions
    3. Use-case Templates: Specific patterns for known scenarios
    
    Inheritance flow:
    - Orchestrator needs template → Check domain templates first
    - If found: Use domain template (may reference base)
    - If not found: Fall back to base template
    - Template variables replaced with context data

# =============================================================================
# BASE TEMPLATES (Applicable to all domains)
# =============================================================================

base_templates:
  # =========================================================================
  # Status/Summary Templates
  # =========================================================================
  
  status_success:
    id: "base.status.success"
    name: "Successful Operation Status"
    description: "Generic success message for completed operations"
    template: |
      ✅ Operation Completed Successfully
      
      **Summary:** {summary}
      **Duration:** {duration}
      **Status:** {status}
      **Timestamp:** {timestamp}
      
      **Details:**
      {details}
    variables:
      - name: "summary"
        type: "string"
        required: true
        example: "All tests passed in 45 seconds"
      - name: "duration"
        type: "string"
        required: true
        example: "45 seconds"
      - name: "status"
        type: "string"
        required: true
        example: "COMPLETE"
      - name: "details"
        type: "string"
        required: false
        example: "22 tests passed, 0 skipped, 0 failed"
    severity: "INFO"
    category: "status"
  
  status_warning:
    id: "base.status.warning"
    name: "Warning Status"
    description: "Operation completed with warnings"
    template: |
      ⚠️ Operation Completed with Warnings
      
      **Summary:** {summary}
      **Status:** {status}
      **Warnings Count:** {warning_count}
      
      **Warning Details:**
      {warnings}
      
      **Recommended Action:** {action}
    variables:
      - name: "summary"
        type: "string"
        required: true
      - name: "status"
        type: "string"
        required: true
      - name: "warning_count"
        type: "integer"
        required: true
      - name: "warnings"
        type: "string"
        required: true
      - name: "action"
        type: "string"
        required: true
    severity: "WARNING"
    category: "status"
  
  status_error:
    id: "base.status.error"
    name: "Error Status"
    description: "Operation failed with errors"
    template: |
      ❌ Operation Failed
      
      **Error:** {error_message}
      **Code:** {error_code}
      **Timestamp:** {timestamp}
      
      **Details:**
      {error_details}
      
      **Recovery Options:**
      {recovery_options}
    variables:
      - name: "error_message"
        type: "string"
        required: true
      - name: "error_code"
        type: "string"
        required: true
      - name: "error_details"
        type: "string"
        required: true
      - name: "recovery_options"
        type: "string"
        required: true
      - name: "timestamp"
        type: "string"
        required: true
    severity: "ERROR"
    category: "status"
  
  # =========================================================================
  # Progress Templates
  # =========================================================================
  
  progress_update:
    id: "base.progress.update"
    name: "Progress Update"
    description: "Generic progress report"
    template: |
      📊 Progress Update
      
      **Overall Progress:** {progress_percent}% ({completed}/{total})
      **Current Phase:** {phase}
      **Elapsed Time:** {elapsed_time}
      **Estimated Remaining:** {estimated_remaining}
      
      **Breakdown:**
      {breakdown}
      
      **Next Steps:**
      {next_steps}
    variables:
      - name: "progress_percent"
        type: "integer"
        required: true
      - name: "completed"
        type: "integer"
        required: true
      - name: "total"
        type: "integer"
        required: true
      - name: "phase"
        type: "string"
        required: true
      - name: "elapsed_time"
        type: "string"
        required: true
      - name: "estimated_remaining"
        type: "string"
        required: true
      - name: "breakdown"
        type: "string"
        required: true
      - name: "next_steps"
        type: "string"
        required: true
    severity: "INFO"
    category: "progress"
  
  # =========================================================================
  # Summary/Report Templates
  # =========================================================================
  
  summary_report:
    id: "base.summary.report"
    name: "Execution Summary Report"
    description: "Comprehensive summary of execution results"
    template: |
      📋 Execution Summary Report
      
      **Execution ID:** {execution_id}
      **Started:** {start_time}
      **Completed:** {end_time}
      **Total Duration:** {total_duration}
      
      **Results:**
      - Success: {success_count}
      - Warnings: {warning_count}
      - Failures: {failure_count}
      - Skipped: {skipped_count}
      
      **Metrics:**
      {metrics}
      
      **Artifacts:**
      {artifacts}
      
      **Logs:**
      {logs}
    variables:
      - name: "execution_id"
        type: "string"
        required: true
      - name: "start_time"
        type: "string"
        required: true
      - name: "end_time"
        type: "string"
        required: true
      - name: "total_duration"
        type: "string"
        required: true
      - name: "success_count"
        type: "integer"
        required: true
      - name: "warning_count"
        type: "integer"
        required: true
      - name: "failure_count"
        type: "integer"
        required: true
      - name: "skipped_count"
        type: "integer"
        required: true
      - name: "metrics"
        type: "string"
        required: true
      - name: "artifacts"
        type: "string"
        required: false
      - name: "logs"
        type: "string"
        required: false
    severity: "INFO"
    category: "summary"

