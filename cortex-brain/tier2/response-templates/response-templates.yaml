          - name: "feedback_count"
            type: "integer"
            required: false
        severity: "INFO"
        category: "knowledge_base"

# =============================================================================
# TEMPLATE INHERITANCE & RESOLUTION STRATEGY
# =============================================================================

inheritance_strategy:
  description: "How templates are resolved at runtime"
  
  resolution_order:
    - step: 1
      name: "Domain-specific search"
      logic: "Check domain_templates[domain_id] for exact template match"
      fallback: "Step 2"
    
    - step: 2
      name: "Base template search"
      logic: "Check base_templates for generic template"
      fallback: "Step 3"
    
    - step: 3
      name: "Inheritance chain"
      logic: "If template specifies 'inherits_from', load parent and merge"
      fallback: "Step 4"
    
    - step: 4
      name: "Template not found"
      logic: "Return error with available alternatives"
      fallback: "None"
  
  merge_strategy:
    description: "How child templates override parent templates"
    rules:
      - "Child template 'template' field overrides parent"
      - "Child template 'variables' extend parent variables"
      - "Duplicate variable names use child definition"
      - "Child category overrides parent category"
      - "Child severity can be different from parent"
  
  variable_substitution:
    description: "How variables are replaced at render time"
    format: "{variable_name}"
    rules:
      - "Required variables must be provided"
      - "Optional variables render as empty string if missing"
      - "Unknown variables raise error (no silent defaults)"
      - "Type checking enforced for provided values"

