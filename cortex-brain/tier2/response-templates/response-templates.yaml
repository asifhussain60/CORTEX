usage_examples:
  
  example_1:
    description: "TDD orchestrator renders test execution report"
    query: |
      template = get_template("tdd", "test_execution_complete")
      # Resolves to: domain_templates["tdd"]["test_execution_complete"]
    
    render: |
      context = {
        "test_suite": "unit tests",
        "total_tests": 155,
        "duration": "1.06s",
        "passed": 155,
        "skipped": 0,
        "failed": 0,
        "line_coverage": 95.2,
        "branch_coverage": 88.5,
        "function_coverage": 100.0,
        "slowest_test": "test_full_ac_domain_population",
        "slowest_duration": "0.43s",
        "avg_duration": "0.007s",
        "recommendations": "All tests passing. Consider adding edge case tests."
      }
      rendered = template.render(context)
  
  example_2:
    description: "Planning orchestrator renders phase status"
    query: |
      template = get_template("planning", "phase_status")
      # Resolves to: domain_templates["planning"]["phase_status"]
    
    context: |
