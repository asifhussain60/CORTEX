domain_templates:
  
  # =========================================================================
  # TDD DOMAIN TEMPLATES
  # =========================================================================
  
  tdd:
    description: "Test-Driven Development response templates"
    templates:
      
      test_execution_complete:
        id: "tdd.test.execution_complete"
        name: "Test Execution Complete"
        description: "Report after test execution completes"
        template: |
          🧪 Test Execution Complete
          
          **Test Suite:** {test_suite}
          **Total Tests:** {total_tests}
          **Duration:** {duration}
          
          **Results:**
          ✅ Passed: {passed}
          ⚠️  Skipped: {skipped}
          ❌ Failed: {failed}
          
          **Coverage:**
          - Line Coverage: {line_coverage}%
          - Branch Coverage: {branch_coverage}%
          - Function Coverage: {function_coverage}%
          
          {failure_details}
          
          **Performance:**
          - Slowest Test: {slowest_test} ({slowest_duration})
          - Average Duration: {avg_duration}
          
          **Recommendations:**
          {recommendations}
        variables:
          - name: "test_suite"
            type: "string"
            required: true
          - name: "total_tests"
            type: "integer"
            required: true
          - name: "duration"
            type: "string"
            required: true
          - name: "passed"
            type: "integer"
            required: true
          - name: "skipped"
            type: "integer"
            required: true
          - name: "failed"
            type: "integer"
            required: true
          - name: "line_coverage"
            type: "number"
            required: true
          - name: "branch_coverage"
            type: "number"
            required: true
          - name: "function_coverage"
            type: "number"
            required: true
          - name: "failure_details"
            type: "string"
            required: false
          - name: "slowest_test"
            type: "string"
            required: false
          - name: "slowest_duration"
            type: "string"
            required: false
          - name: "avg_duration"
            type: "string"
            required: false
          - name: "recommendations"
            type: "string"
            required: false
        severity: "INFO"
        category: "test_results"
        inherits_from: "base.summary.report"
      
      coverage_report:
        id: "tdd.coverage.report"
        name: "Code Coverage Report"
        description: "Detailed code coverage analysis"
        template: |
          📈 Code Coverage Report
          
          **Overall Coverage:** {overall_coverage}%
          **Trend:** {coverage_trend}
          
          **By Component:**
          {coverage_breakdown}
          
          **Coverage Gaps:**
          {coverage_gaps}
          
          **Improvement Recommendations:**
          {recommendations}
        variables:
          - name: "overall_coverage"
            type: "number"
            required: true
          - name: "coverage_trend"
            type: "string"
            required: true
          - name: "coverage_breakdown"
            type: "string"
            required: true
          - name: "coverage_gaps"
            type: "string"
            required: true
          - name: "recommendations"
            type: "string"
            required: true
        severity: "INFO"
        category: "coverage"
      
      mutation_report:
        id: "tdd.mutation.report"
        name: "Mutation Testing Report"
        description: "Results from mutation testing"
        template: |
          🧬 Mutation Testing Report
          
          **Mutation Score:** {mutation_score}%
          **Mutations Generated:** {total_mutations}
          **Mutations Killed:** {killed_mutations}
          **Mutations Survived:** {survived_mutations}
          
          **Survived Mutations (High Priority):**
          {survived_details}
          
          **Recommendations:**
          {recommendations}
        variables:
          - name: "mutation_score"
            type: "number"
            required: true
          - name: "total_mutations"
            type: "integer"
            required: true
          - name: "killed_mutations"
            type: "integer"
            required: true
          - name: "survived_mutations"
