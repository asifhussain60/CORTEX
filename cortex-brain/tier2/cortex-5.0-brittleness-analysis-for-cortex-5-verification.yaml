        - "P00.2: Document Schema Mismatches"
        - "P00.3: Implement Database Views for Compatibility (CREATE VIEW tier2_patterns)"
        - "P00.4: Fix user_profile Schema (add response_detail column)"
        - "P00.5: Consolidate Duplicate Databases (knowledge-graph.db → knowledge_graph.db)"
        - "P00.6: Migrate Data Between Schemas"
        - "P00.7: Fix Code References (update pattern_search.py, unified_context_manager.py)"
        - "P00.8: Validate Schema Integrity"
      deliverables:
        - "cortex-brain/documents/reports/database-schema-audit-complete.md"
        - "CREATE VIEW tier2_patterns AS SELECT id, title AS name, ... FROM patterns"
        - "ALTER TABLE user_profile ADD COLUMN response_detail TEXT"
        - "Consolidated knowledge_graph.db (single source of truth)"
        - "Fixed: pattern_search.py, unified_context_manager.py references"
        - "tests/integration/test_database_schema_compatibility.py"
      status: "✅ WILL BE ADDRESSED - Phase P00 enhanced with database audit findings"
  
  # Root Cause 6: ADO v2 Import Path Inconsistency
  rc_006_ado_import_path:
    id: "RC-006"
    category: "import_structure"
    severity: "high"
    title: "ADO v2 Import Path Broken (File vs Import Mismatch)"
    
    description: |
      ADO orchestrator file exists at src/orchestrators/ado/v2/ado_orchestrator_v2.py,
      but import expects src/orchestrators/ado/ado_orchestrator_v2.py. Results in
      ModuleNotFoundError when attempting import.
    
    symptoms:
      - "ADO orchestrator fails brittleness test (5/6 passing)"
      - "ModuleNotFoundError during orchestrator import"
      - "High-priority fix (blocks ADO functionality)"
    
    evidence:
      file_location: "src/orchestrators/ado/v2/ado_orchestrator_v2.py"
      import_expectation: "from src.orchestrators.ado import ADOOrchestratorV2"
      actual_import_fails: true
      error: "ModuleNotFoundError: No module named 'src.orchestrators.ado.ado_orchestrator_v2'"
    
    fix_required:
      file: "src/orchestrators/ado/__init__.py"
      change: "from .v2.ado_orchestrator_v2 import ADOOrchestratorV2"
      __all__: "['ADOOrchestrator', 'ADOOrchestratorV2']"
    
    resolution:
      status: "IDENTIFIED but not fixed in CORTEX-5.0"
      estimated_fix_time: "0.5 hours"
      priority: "P1 (High)"
    
    cortex_5_verification:
