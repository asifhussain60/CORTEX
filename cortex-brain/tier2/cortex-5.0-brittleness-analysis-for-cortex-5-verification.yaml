root_causes:
  
  # Root Cause 1: Prompt-Level Brittleness
  rc_001_progress_rendering:
    id: "RC-001"
    category: "prompt_instructions"
    severity: "high"
    title: "CORTEX Master Prompt Lacks Explicit Progress Rendering Instructions"
    
    description: |
      CORTEX master prompt (.github/prompts/CORTEX.prompt.md) lacked explicit instructions
      telling GitHub Copilot WHEN (which orchestrator types) and HOW (format specification)
      to render progress bars after autonomous orchestrator hand-off.
    
    symptoms:
      - "Progress bars displayed inconsistently for autonomous orchestrators"
      - "Extension prompts (maintenance, investigation) worked correctly"
      - "CORTEX prompt sometimes showed progress, sometimes didn't"
      - "Users had no visibility into multi-phase autonomous operations"
    
    evidence:
      files:
        - path: ".github/prompts/CORTEX.prompt.md"
          lines: "358 lines → 507 lines after fix"
          issue: "Template references only, no embedded examples"
        - path: ".github/prompts/cortex-maintenance.prompt.md"
          lines: "16-40, 375-395"
          status: "WORKING - Has embedded progress format"
        - path: "cortex-brain/response-templates-v4.yaml"
          lines: "1449"
          status: "Template defined but not rendered"
      
      architectural_gap: |
        Layer 1 (Code): ✅ PlanningOrchestratorV5 returns OrchestratorResult with progress
        Layer 2 (Config/Wiring): ❌ CORTEX prompt lacks instructions to render progress
        Layer 3 (Architecture): ⚠️ Extension prompts work (direct instructions), CORTEX doesn't
        Layer 4 (Assumptions): ⚠️ Assumed auto-display, but Copilot needs explicit instructions
    
    resolution:
      status: "RESOLVED in CORTEX-5.0"
      solution: "Added 149-line 'Post-Orchestrator Progress Rendering' section"
      implementation:
        - "Complete format specification with examples"
        - "Decision tree for when to render (autonomous vs guided)"
        - "ASCII progress bar format rules"
        - "Status emoji definitions"
        - "Percentage calculation formula"
      impact: "100% consistency for autonomous orchestrators, zero breaking changes"
    
    cortex_5_verification:
      addressed_by: "Already resolved in CORTEX-5.0, carried forward to CORTEX-5.5"
      epic_phase: "N/A - Fix already implemented"
      status: "✅ NO ACTION NEEDED"
  
  # Root Cause 2: Response Rendering Pipeline Gaps
  rc_002_continuation_prompt_not_displaying:
    id: "RC-002"
    category: "response_pipeline"
    severity: "high"
    title: "Master Orchestrator Missing ResponseRenderer Integration"
    
    description: |
      Continuation prompts were GENERATED and WRITTEN to files (tracking/CONTINUATION-PROMPT.md),
      but the user NEVER SAW THEM in chat response. ResponseRenderer exists but may not be
      integrated into execution pipeline properly.
    
    symptoms:
      - "Token warning messages generated but not displayed to user"
      - "Continuation prompts saved to files but invisible in chat"
      - "Success messages missing metadata"
      - "Validation warnings not displayed"
    
    evidence:
      code_layer_analysis:
        layer_1_implementation:
          status: "✅ EXISTS & WORKING"
          files:
            - path: "src/orchestrators/base/base_orchestrator_v4_1.py"
              method: "check_token_usage()"
              finding: "Correctly generates user_message field with token warning"
            - path: "src/orchestrators/planning/planning_orchestrator_v5.py"
              method: "execute()"
              finding: "Appends token_status['user_message'] to success_message"
            - path: "src/orchestrators/vacuum/vacuum_orchestrator_v2.py"
              method: "execute()"
              finding: "Appends token warning to completion_message"
        
        layer_2_wiring:
          status: "❌ ROOT CAUSE IDENTIFIED"
          files:
            - path: "src/orchestrators/master_orchestrator.py"
              method: "handle_request()"
              finding: |
                PROBLEM: handle_request() never renders OrchestratorResult.message to user
                
                Current flow:
                1. execute_orchestrator() returns ExecutionResult object
                2. ExecutionResult contains nested OrchestratorResult.message
                3. handle_request() returns dict with message field
                4. ❌ MISSING: Step 4 - Render result.message to user
                
                Returns internal dict, not user-facing markdown
              line: 99
              imports: "ResponseRenderer imported but not called in handle_request()"
    
    similar_issues:
      - "Error messages from orchestrators not displaying"
      - "Token warnings from check_token_usage() not visible"
      - "Validation warnings not displayed"
    
    resolution:
      status: "IDENTIFIED but not implemented in CORTEX-5.0"
      recommended_solution: "Architecture Refactor (8 hours) - ResponseRenderer + ResponseMiddleware"
      investigation_report_recommendation: |
        Option B: Create ResponseRenderer middleware in Python
        - Time: 8 hours
        - Robustness: High
        - Maintainability: High
        - Breaking changes: Maybe
    
    cortex_5_verification:
      addressed_by: "Phase P01.2 - Verify ResponseRenderer renders to user"
      epic_reference: "cortex5-enhancement-epic-v2"
      epic_phase: "Phase P01 (Task Management + ResponseRenderer + SKULL Middleware)"
      duration: "1 day"
      deliverables:
        - "tests/integration/test_response_renderer_to_user.py"
        - "Fixed: master_orchestrator.py handle_request() returns rendered markdown"
        - "Verified: continuation prompts display to user"
        - "cortex-brain/documents/investigations/response-renderer-verification-report.md"
      acceptance_criteria:
        - "✅ ResponseRenderer confirmed rendering to GitHub Copilot Chat"
        - "✅ Continuation prompts display (no longer missing)"
        - "✅ Token warnings display to user"
      status: "✅ WILL BE ADDRESSED - Phase P01.2 explicitly targets this issue"
  
  # Root Cause 3: SKULL Middleware Invocation Unclear
  rc_003_skull_middleware_invocation:
    id: "RC-003"
    category: "middleware_integration"
    severity: "high"
    title: "SKULL Middleware Imported But Invocation Unclear"
    
    description: |
      SetupVerifier, GovernanceCheckpoint, and TeardownRefactor are IMPORTED in
      master_orchestrator.py (lines 103-105), but it's UNCLEAR if they are CALLED
      during execution. brain-protection-rules.yaml defines SETUP_VERIFICATION and
      TEARDOWN_REFACTOR rules, but no evidence middleware hooks actually invoked.
    
    symptoms:
      - "Middleware components exist but execution unclear"
      - "No governance audit logs showing middleware invocations"
      - "Orchestrators may bypass brain protection rules"
      - "No verification that Phase -2 (Setup) and Phase N+1 (Teardown) execute"
    
    evidence:
      imports:
        file: "src/orchestrators/master_orchestrator.py"
        lines: "103-105"
        imported:
          - "self.setup_verifier = SetupVerifier(workspace_root=Path.cwd())"
          - "self.governance_checkpoint = GovernanceCheckpoint(workspace_path=str(Path.cwd()))"
          - "self.teardown_refactor = TeardownRefactor(workspace_root=Path.cwd())"
        status: "✅ IMPORTED"
      
      invocation:
        file: "src/orchestrators/master_orchestrator.py"
        method: "handle_request() / execute_orchestrator()"
        finding: "❓ No evidence middleware hooks called during execution"
        status: "❌ INVOCATION UNCLEAR"
      
      configuration:
        file: "cortex-brain/brain-protection-rules.yaml"
        rules_defined:
          - "SETUP_VERIFICATION (Phase -2)"
          - "GOVERNANCE_CHECKPOINTS (Runtime)"
          - "TEARDOWN_REFACTOR (Phase N+1)"
        status: "✅ RULES DEFINED"
      
      audit_logs:
        location: "cortex-brain/tier1/governance-audit.jsonl"
        finding: "No middleware invocation logs found"
        status: "❌ NO EVIDENCE OF EXECUTION"
    
    architecture_gap:
      issue: "Middleware imported but not wired into execution flow"
      expected_flow: |
        1. User request arrives
        2. PHASE -2: SetupVerifier validates environment
        3. RUNTIME: GovernanceCheckpoint validates during execution
        4. PHASE N+1: TeardownRefactor cleans up
      
      actual_flow: |
        1. User request arrives
        2. ❌ SetupVerifier NOT called (or unclear)
        3. ❌ GovernanceCheckpoint NOT called (or unclear)
        4. ❌ TeardownRefactor NOT called (or unclear)
    
    resolution:
      status: "IDENTIFIED but not implemented in CORTEX-5.0"
      required_fix: "Verify middleware integration + add execution hooks if missing"
    
    cortex_5_verification:
      addressed_by: "Phase P01.3 - Verify SKULL middleware invocation"
      epic_reference: "cortex5-enhancement-epic-v2"
      epic_phase: "Phase P01 (Task Management + ResponseRenderer + SKULL Middleware)"
      duration: "1 day"
      deliverables:
        - "tests/integration/test_skull_middleware_invocation.py"
        - "Verified: SetupVerifier runs before orchestrator execution (Phase -2)"
        - "Verified: GovernanceCheckpoint validates during execution"
        - "Verified: TeardownRefactor runs after execution (Phase N+1)"
        - "Fixed: middleware hooks integrated into execution_engine.py if missing"
      acceptance_criteria:
        - "✅ SetupVerifier executes before every orchestrator (Phase -2 logged)"
        - "✅ GovernanceCheckpoint validates during execution (checkpoints logged)"
        - "✅ TeardownRefactor executes after every orchestrator (Phase N+1 logged)"
        - "✅ tracking/governance-audit.jsonl shows middleware invocations"
      status: "✅ WILL BE ADDRESSED - Phase P01.3 explicitly verifies and fixes this"
  
  # Root Cause 4: Orchestrator Instantiation Failures
  rc_004_orchestrator_instantiation:
    id: "RC-004"
    category: "orchestrator_compatibility"
    severity: "critical"
    title: "6 Orchestrators Cannot Instantiate (P0 Blocker)"
    
    description: |
      Comprehensive brittleness audit revealed 6 orchestrators CANNOT be imported or
      instantiated. Each has specific errors (syntax, kwargs, args, missing methods).
      This BLOCKS all autonomous execution.
    
    impact:
      severity: "P0_CRITICAL"
      blocks: ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08"]
      orchestrator_pass_rate: "5/6 (83%)"
      brittleness_contribution: "16.6/100 (20% weight)"
    
    failures:
      - orchestrator: "planning_v5"
        error: "SyntaxError: f-string backslash"
        file: "src/orchestrators/planning/planning_orchestrator_v5.py"
        line: 718
        fix_required: "Remove backslash from f-string"
      
      - orchestrator: "tdd_orchestrator"
        error: "Unexpected kwarg 'config_path'"
        file: "src/orchestrators/tdd/tdd_orchestrator.py"
        line: "N/A"
        fix_required: "Update __init__ signature to accept config_path"
      
      - orchestrator: "ado_orchestrator_v2"
        error: "Missing positional arg 'state_db'"
        file: "src/orchestrators/ado/ado_orchestrator_v2.py"
        line: "N/A"
        fix_required: "Add state_db parameter to __init__"
      
      - orchestrator: "sanitization"
        error: "Unexpected kwarg 'config_path'"
        file: "src/orchestrators/sanitization/sanitization_orchestrator.py"
        line: "N/A"
        fix_required: "Update __init__ signature to accept config_path"
      
      - orchestrator: "cleanup_v2"
        error: "Missing positional arg 'state_db'"
        file: "src/orchestrators/cleanup/cleanup_orchestrator_v2.py"
        line: "N/A"
        fix_required: "Add state_db parameter to __init__"
      
      - orchestrator: "vacuum_v2"
        error: "StateManager.log_execution() missing"
        file: "src/orchestrators/vacuum/vacuum_orchestrator_v2.py"
        line: "N/A"
        fix_required: "Implement StateManager.log_execution() method"
    
    resolution:
      status: "IDENTIFIED but not fixed in CORTEX-5.0"
      estimated_fix_time: "1 day"
    
    cortex_5_verification:
      addressed_by: "Phase P00B - Critical Orchestrator Instantiation Fixes"
      epic_reference: "cortex5-enhancement-epic-v2"
      epic_phase: "Phase P00B (added as P0_CRITICAL phase)"
      priority: "P0_CRITICAL"
      duration: "1 day"
      status_in_epic: "planning"
      deliverables:
        - "Fixed: planning_v5 f-string syntax error"
        - "Fixed: tdd_orchestrator __init__ signature"
        - "Fixed: ado_orchestrator_v2 state_db parameter"
        - "Fixed: sanitization_orchestrator __init__ signature"
        - "Fixed: cleanup_v2 state_db parameter"
        - "Fixed: vacuum_v2 StateManager.log_execution() method"
        - "tests/integration/test_all_orchestrators_instantiate.py (6/6 passing)"
      blocks: ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08"]
      status: "✅ WILL BE ADDRESSED - Phase P00B added specifically for these fixes"
  
  # Root Cause 5: Database Schema Inconsistencies
  rc_005_database_schema_audit:
    id: "RC-005"
    category: "database_architecture"
    severity: "critical"
    title: "Database Schema Mismatches & Duplicate Databases"
    
    description: |
      Database schema audit (2026-01-05) revealed critical mismatches between code
      expectations and actual database schema, plus duplicate databases with
      inconsistent data.
    
    critical_issues:
      - issue: "Schema name mismatch"
        expected: "tier2_patterns table"
        actual: "patterns table"
        impact: "❌ Pattern search fails (code expects tier2_patterns.name, DB has patterns.title)"
      
      - issue: "Missing column"
        expected: "user_profile.response_detail column"
        actual: "Column does not exist"
        impact: "❌ User profile queries fail"
      
      - issue: "Duplicate databases"
        files: ["knowledge-graph.db (old)", "knowledge_graph.db (new)"]
        impact: "❌ Data inconsistency (two knowledge graph DBs with different data)"
      
      - issue: "No compatibility views"
        expected: "CREATE VIEW tier2_patterns AS SELECT ... FROM patterns"
        actual: "Views do not exist"
        impact: "Backward compatibility broken"
    
    affected_components:
      - "pattern_search.py (expects tier2_patterns table)"
      - "unified_context_manager.py (expects tier2_patterns)"
      - "user_profile_manager.py (expects response_detail column)"
      - "knowledge_graph_loader.py (unclear which DB to use)"
    
    resolution:
      status: "IDENTIFIED but not fixed in CORTEX-5.0"
      estimated_fix_time: "Multiple sub-phases required"
    
    cortex_5_verification:
      addressed_by: "Phase P00 - Database Schema Consolidation (8 sub-phases)"
      epic_reference: "cortex5-enhancement-epic-v2"
      epic_phase: "Phase P00 (Enhanced with 8 specific sub-phases)"
      sub_phases:
