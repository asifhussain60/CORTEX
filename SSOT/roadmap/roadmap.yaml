################################################################################
# PART 6: BRITTLENESS FIXES (14 AC-IDs - Bug Fixes)
################################################################################

brittleness_fixes:
  title: "Brittleness Prevention & Fixes"
  status: "APPROVED FOR PHASE 9.4+10"
  total_ac_ids: 14
  total_problems: 4
  critical_issues: 4
  high_priority_fixes: 10

  critical_production_blockers:
    phase: "9.4 (Day 0 - 2 hours)"
    issues: 4

    issue_1:
      problem_id: "BRITTLE-001"
      title: "Database Concurrency (SQLite Journal Mode)"
      severity: "CRITICAL"
      component: "ProgressTrackerManager"
      root_cause: "SQLite journal mode = 'delete' (default) instead of WAL"
      impact: "Power failure during concurrent writes → Silent data corruption, lost audit trail"
      solution: "Enable WAL mode on startup (1 line: PRAGMA journal_mode=WAL)"
      prevention_ac_id: "AC-BRITTLE-001"
      effort: "15 minutes"
      acceptance_criteria:
        - "WAL mode enabled on startup"
        - "governance.db has -wal and -shm files"
        - "Concurrent writes safe (tested)"
      test: "Verify governance.db has -wal and -shm files"

    issue_2:
      problem_id: "BRITTLE-002"
      title: "Audit Database Schema Missing"
      severity: "CRITICAL"
      component: "EnhancedAuditLogger"
      root_cause: "audit_logs table not created in governance.db"
      impact: "'no such table: audit_logs' error in validator; 97% verification rate becomes 0%; evidence collection unusable"
      solution: "Create schema migration, auto-initialize on first connection"
      prevention_ac_id: "AC-BRITTLE-002"
      effort: "45 minutes"
      acceptance_criteria:
        - "Schema migration created"
        - "Auto-initialization on first connection"
        - "Table has correct columns (id, operation, ac_id, timestamp, etc.)"
      test: "Query SELECT COUNT(*) FROM audit_logs (no error)"

    issue_3:
      problem_id: "BRITTLE-003"
      title: "Tracker Progress Broken (0/0 Phase Counts)"
      severity: "CRITICAL"
      component: "ProgressTrackerManager"
      root_cause: "progress-tracker.json shows 0/0 for all phases"
      impact: "Dashboard shows 0%, phase gates unenforceable, cannot determine actual progress"
      solution: "Rebuild tracker from AC-INDEX using evidence validator --fix"
      prevention_ac_id: "AC-BRITTLE-003"
      effort: "30 minutes"
      acceptance_criteria:
        - "Tracker rebuilt from AC-INDEX"
        - "All phases have correct counts"
        - "Dashboard reflects actual progress"
      test: "Verify tracker.phases.*.completed_count > 0 (if phase has AC-IDs)"

    issue_4:
      problem_id: "BRITTLE-004"
      title: "Pytest Collection Warnings (Hidden Test Failures Risk)"
      severity: "CRITICAL"
      component: "Test Infrastructure"
      root_cause: "Dataclass naming (TestResult, TestExecutor) confuses pytest"
      impact: "Tests may be silently skipped, false confidence in coverage"
      solution: "Rename dataclasses to remove 'Test' prefix (3 renames, <5 min)"
      prevention_ac_id: "AC-BRITTLE-004"
      effort: "5 minutes"
      acceptance_criteria:
        - "Dataclass names changed (TestResult → Result, etc.)"
        - "Pytest collects with 0 warnings"
        - "All 1,498 tests collected successfully"
      test: "Run pytest --co -q, verify 0 warnings and all 1,498 tests collected"

  high_priority_fixes:
    phase: "9.4 (Week 1 - 5 days)"
    issues: 10

    issue_5:
      problem_id: "BRITTLE-005"
      title: "Import Brittleness (Relative Imports)"
      severity: "HIGH"
      component: "src/orchestrators/core/"
      root_cause: "Relative imports assume incorrect package paths (../infrastructure/ when actually at src/infrastructure/)"
      impact: "Test collection fails with ImportError, Phase 4.5 integration testing blocked"
      solution: "Replace relative imports with absolute imports (explicit pathlib-based approach)"
      prevention_ac_id: "AC-BRITTLE-005"
      effort: "2 hours"
      acceptance_criteria:
        - "8 import statements in master_orchestrator.py converted to absolute"
        - "All tests collect successfully (1,498+ tests)"
        - "Integration tests pass (15/15)"
      test: "pytest --co -q succeeds with 1,498+ tests collected"

    issue_6:
      problem_id: "BRITTLE-006"
      title: "Test Collection Brittleness"
      severity: "HIGH"
      component: "tests/"
      root_cause: "11 of 46 test files fail to collect (24% failure rate)"
      impact: "Partial test execution impossible, evidence validation blocked"
      solution: "Fix syntax errors and missing module imports in test files"
      prevention_ac_id: "AC-BRITTLE-006"
      effort: "3 hours"
      acceptance_criteria:
        - "All 46 test files collect successfully"
        - "0 collection errors"
        - "1,498+ tests collected"

    issue_7:
      problem_id: "BRITTLE-007"
      title: "Package Path Brittleness"
      severity: "HIGH"
      component: "src/"
      root_cause: "Package structure assumptions in imports and code"
      impact: "Code breaks when folder structure changes"
      solution: "Standardize all paths using get_project_root() utility"
      prevention_ac_id: "AC-BRITTLE-007"
      effort: "2 hours"

    issue_8:
      problem_id: "BRITTLE-008"
      title: "AC Completeness Brittleness"
      severity: "HIGH"
      component: "AC-INDEX.yaml"
      root_cause: "11 AC-IDs missing implementation (32% incomplete)"
      impact: "Cannot complete phase if AC-IDs unimplemented"
      solution: "Implement missing AC-IDs with TDD (Red → Green → Refactor)"
      prevention_ac_id: "AC-BRITTLE-008"
      effort: "5 days"

    issue_9:
      problem_id: "BRITTLE-009"
      title: "Evidence Generation Brittleness"
      severity: "HIGH"
      component: "EvidenceBundleGenerator"
      root_cause: "Evidence capture returns 0/100 (0% implemented)"
      impact: "Cannot verify AC completion"
      solution: "Implement evidence bundle generation from test results, code changes, audit logs"
      prevention_ac_id: "AC-BRITTLE-009"
      effort: "3 days"

    issue_10:
      problem_id: "BRITTLE-010"
      title: "Portability Brittleness"
      severity: "HIGH"
      component: "src/ (all modules)"
      root_cause: "Hardcoded paths, platform-specific code without guards"
      impact: "Code fails on different platforms (MAC vs WIN vs Linux)"
      solution: "Standardize all paths with pathlib, use platform.system() for OS-specific code"
      prevention_ac_id: "AC-BRITTLE-010"
      effort: "2 days"

    issue_11:
      problem_id: "BRITTLE-011"
      title: "State Management Brittleness"
      severity: "HIGH"
      component: "LifecycleManager"
      root_cause: "State machine incomplete (50/100)"
      impact: "State transitions not atomic, race conditions possible"
      solution: "Implement distributed locking for state transitions"
      prevention_ac_id: "AC-BRITTLE-011"
      effort: "1.5 days"

    issue_12:
      problem_id: "BRITTLE-012"
      title: "Governance Enforcement Brittleness"
      severity: "HIGH"
      component: "GovernanceRegistry"
      root_cause: "Only 40% of governance rules enforced (10 of 25 active)"
      impact: "15 rules not enforced, violations undetected"
      solution: "Wire remaining 15 rules into GovernanceRegistry"
      prevention_ac_id: "AC-BRITTLE-012"
      effort: "2 days"

    issue_13:
      problem_id: "BRITTLE-013"
      title: "Test-AC Linking Brittleness"
      severity: "HIGH"
      component: "test infrastructure"
      root_cause: "Tests not organized by AC-ID (0/100)"
      impact: "Cannot link test results to AC-IDs automatically"
      solution: "Implement test discovery by AC-ID"
      prevention_ac_id: "AC-BRITTLE-013"
      effort: "2 hours"

    issue_14:
      problem_id: "BRITTLE-014"
      title: "Verification Rate Brittleness"
      severity: "HIGH"
      component: "AuditBasedEvidenceValidator"
      root_cause: "Verification rate 0% (target 80%+)"
      impact: "Cannot prove AC completion, DoR assessment impossible"
      solution: "Implement evidence validation from AC-INDEX"
      prevention_ac_id: "AC-BRITTLE-014"
      effort: "2 days"

