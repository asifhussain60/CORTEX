  content: "# Framework Architecture Specification\n\n**Date:** 2026-01-14  \n**Version:**\
    \ 1.0.0-APPROVED  \n**Status:** Ready for Implementation  \n**Scope:** Orchestrators,\
    \ Response Templates, MCP Integration, Base Interfaces\n\n---\n\n## Part 1: Orchestrator\
    \ Framework\n\n### 1.1 Base Orchestrator Interface\n\nAll orchestrators (CORTEX-owned\
    \ and custom) implement `BaseOrchestrator` with mandatory methods:\n\n**Core Contract:**\n\
    - `execute(request: ExecutionRequest) -> ExecutionResult` (REQUIRED)\n- `can_handle(request:\
    \ ExecutionRequest) -> bool` (REQUIRED)\n- `delegate(request: ExecutionRequest)\
    \ -> Optional[ExecutionResult]` (PROVIDED)\n- `get_metadata() -> OrchestratorMetadata`\
    \ (REQUIRED)\n\n**Orchestrator Lifecycle:**\n```\nPENDING → RUNNING → COMPLETED/FAILED/CANCELLED\n\
    ```\n\n**State Transitions:**\n- PENDING: Just created, not yet executed\n- RUNNING:\
    \ execute() called, in progress\n- COMPLETED: execute() returned successfully\
    \ (result.success = true)\n- FAILED: execute() threw exception or returned failure\
    \ (result.success = false)\n- CANCELLED: User explicitly cancelled via cancel()\
    \ method\n\n---\n\n### 1.2 Composite Pattern: Parent-Child Orchestrators\n\n**Hierarchy:**\n\
    ```\nMasterOrchestrator (root)\n├─ PlanningOrchestrator (core)\n├─ TddMasterOrchestrator\
    \ (core)\n├─ AdoOrchestrator (domain)\n├─ GovernanceOrchestrator (core)\n├─ EvidenceOrchestrator\
    \ (core)\n└─ CustomPaymentOrchestrator (user-defined, isolated)\n    └─ StripeMicroOrchestrator\
    \ (child, handles payment processing)\n```\n\n**Delegation Rules:**\n- Parent\
    \ calls first child that returns `can_handle(request) = true`\n- If no child handles,\
    \ parent returns error\n- If child raises exception, parent catches and logs;\
    \ attempts next child\n- No unhandled exceptions propagate to MasterOrchestrator\
    \ (critical for stability)\n\n---\n\n### 1.3 Orchestrator Registry (Plugin System)\n\
    \n**Registration Points:**\n- Auto-discovery: Scan `src/orchestrators/custom/`\
    \ at startup\n- Manual registration: Call `registry.register(name, class, is_core)`\n\
    - Runtime check: `if registry.has_orchestrator('payment'):`\n\n**Safety Guardrails:**\n\
    - Custom orchestrators run in separate process (multiprocessing)\n- Unhandled\
    \ exceptions don't crash parent (caught at boundary)\n- Dependency resolution:\
    \ Orchestrators can declare dependencies\n- Circular dependencies detected at\
    \ startup (startup fails if cycle detected)\n\n---\n\n## Part 2: Response Template\
    \ Architecture\n\n### 2.1 Response Template System\n\n**Purpose:** Standardized\
    \ response format for all operations (success, error, partial)\n\n**Template Hierarchy:**\n\
    ```\nBaseResponseTemplate\n├─ SuccessResponse\n│  ├─ SingletonResponse (one outcome)\n\
    │  └─ CompositeResponse (multiple orchestrator outcomes)\n├─ ErrorResponse\n│\
    \  ├─ ValidationError\n│  ├─ RuntimeError\n│  └─ TimeoutError\n└─ PartialResponse\
    \ (for degraded mode)\n```\n\n---\n\n### 2.2 Response Schema\n\n**Mandatory Fields\
    \ (All Responses):**\n```json\n{\n  \"correlation_id\": \"uuid\",\n  \"timestamp\"\
    : \"ISO8601\",\n  \"status\": \"success|error|partial\",\n  \"operation\": \"\
    AC-ID or user request\",\n  \"execution_time_ms\": 1234\n}\n```\n\n**Success Response:**\n\
    ```json\n{\n  \"correlation_id\": \"...\",\n  \"timestamp\": \"...\",\n  \"status\"\
    : \"success\",\n  \"operation\": \"implement AC-AUDIT-001\",\n  \"execution_time_ms\"\
    : 2500,\n  \"results\": {\n    \"planning\": {\n      \"status\": \"completed\"\
    ,\n      \"output\": \"7-step plan generated\",\n      \"time_ms\": 500\n    },\n\
    \    \"tdd\": {\n      \"status\": \"completed\",\n      \"output\": \"5 red tests\
    \ created\",\n      \"time_ms\": 800\n    },\n    \"governance\": {\n      \"\
    status\": \"completed\",\n      \"passed_rules\": 24,\n      \"violations\": 0,\n\
    \      \"time_ms\": 150\n    }\n  },\n  \"evidence\": {\n    \"bundle_id\": \"\
    evidence-2026-01-14-abc123\",\n    \"artifacts\": [\n      \"test_results.json\"\
    ,\n      \"code_diff.patch\",\n      \"audit_log.sqlite\"\n    ]\n  }\n}\n```\n\
    \n**Error Response:**\n```json\n{\n  \"correlation_id\": \"...\",\n  \"timestamp\"\
    : \"...\",\n  \"status\": \"error\",\n  \"operation\": \"implement AC-AUDIT-001\"\
    ,\n  \"execution_time_ms\": 1200,\n  \"error\": {\n    \"code\": \"GOVERNANCE_VIOLATION\"\
    ,\n    \"message\": \"CORE-002: Root-level markdown not allowed\",\n    \"rule_violated\"\
    : \"CORE-002\",\n    \"severity\": \"blocked\",\n    \"context\": {\n      \"\
    file_attempted\": \"architecture-summary.md\",\n      \"location\": \"root\",\n\
    \      \"expected_location\": \"cortex-brain/documents/ or docs/\"\n    }\n  },\n\
    \  \"recovery_suggestion\": \"Move file to docs/ and retry\"\n}\n```\n\n**Partial\
    \ Response (Degraded Mode):**\n```json\n{\n  \"correlation_id\": \"...\",\n  \"\
    timestamp\": \"...\",\n  \"status\": \"partial\",\n  \"operation\": \"implement\
    \ AC-TDD-001\",\n  \"execution_time_ms\": 5100,\n  \"warning\": \"Operation completed\
    \ with reduced capability\",\n  \"completed_stages\": [\n    \"planning\",\n \
    \   \"tdd\"\n  ],\n  \"skipped_stages\": [\n    \"ado\",\n    \"evidence\"\n \
    \ ],\n  \"reason\": \"ADO orchestrator timeout (>10s) triggered fallback mode\"\
    ,\n  \"results\": {\n    \"planning\": { \"status\": \"completed\", ... },\n \
    \   \"tdd\": { \"status\": \"completed\", ... },\n    \"ado\": { \"status\": \"\
    timeout\", \"error\": \"Connection to Azure DevOps failed\" },\n    \"governance\"\
    : { \"status\": \"skipped\", \"reason\": \"ADO failed; cannot assess compliance\"\
    \ }\n  }\n}\n```\n\n---\n\n### 2.3 Response Template Configuration\n\n**YAML Configuration:**\n\
    ```yaml\nresponse_templates:\n  version: \"1.0.0\"\n  \n  success:\n    include_evidence:\
    \ true\n    include_timing: true\n    include_rule_evaluation: true\n    max_output_size_mb:\
    \ 10\n  \n  error:\n    include_context: true\n    include_recovery_suggestion:\
    \ true\n    include_full_stack_trace: false  # Production safety\n    redact_secrets:\
    \ true\n  \n  partial:\n    include_completion_percentage: true\n    include_next_steps:\
    \ true\n    include_retry_advice: true\n```\n\n---\n\n## Part 2.5: Custom Response\
    \ Templates (NEW)\n\n### 2.5.1 Optional Custom Templates Per Orchestrator\n\n\
    **Feature:** Orchestrators can define optional custom response templates while\
    \ maintaining automatic fallback to standard CORTEX 4.0 template.\n\n**Use Case:**\
    \ Specialized orchestrators need domain-specific response formats (e.g., TDD Master\
    \ shows test coverage metrics, ADO Orchestrator shows work item links).\n\n**Architecture:**\n\
    \n```\nOrchestrator Response Generation Flow:\n  1. Orchestrator generates ExecutionResult\n\
    \  2. render_response() called with result\n  3. TemplateResolver checks for custom_template_path\n\
    \  4. If custom template exists + valid: use it\n  5. Else if child orchestrator:\
    \ try parent's template\n  6. Else: use standard CORTEX template (fallback)\n\
    \  7. Render with result data\n  8. Return formatted response\n```\n\n### 2.5.2\
    \ Orchestrator Metadata Extension\n\n**BaseOrchestrator.get_metadata() now includes:**\n\
    \n```python\nclass OrchestratorMetadata:\n    name: str                      \
    \    # \"TDD Master\"\n    version: str                       # \"1.0.0\"\n  \
    \  category: str                      # \"core\", \"domain\", \"custom\"\n   \
    \ \n    # NEW: Custom template support\n    custom_template: Optional[CustomTemplateConfig]\
    \ = None\n    \nclass CustomTemplateConfig:\n    enabled: bool = False       \
    \       # Set True to use custom template\n    path: str                     \
    \     # \"cortex-brain/tier2/response-templates/...\"\n    schema_version: str\
    \ = \"4.6.0\"     # Must match standard schema version\n    fallback_on_error:\
    \ bool = True     # Use standard if custom fails\n```\n\n### 2.5.3 Template Resolution\
    \ Algorithm\n\n```\ndef resolve_response_template(orchestrator: BaseOrchestrator)\
    \ -> ResponseTemplate:\n    \"\"\"Resolve template with fallback chain: custom\
    \ → parent → standard\"\"\"\n    \n    # Step 1: Check custom template\n    if\
    \ orchestrator.metadata.custom_template?.enabled:\n        try:\n            template\
    \ = load_template(orchestrator.metadata.custom_template.path)\n            if\
    \ validate_schema(template, schema_version=\"4.6.0\"):\n                return\
    \ template\n        except Exception as e:\n            log.warning(f\"Custom\
    \ template failed: {e}; falling back...\")\n    \n    # Step 2: Try parent template\
    \ (if child orchestrator)\n    if hasattr(orchestrator, 'parent_orchestrator')\
    \ and orchestrator.parent_orchestrator:\n        return resolve_response_template(orchestrator.parent_orchestrator)\n\
    \    \n    # Step 3: Standard template (always available)\n    return load_standard_template()\n\
    ```\n\n### 2.5.4 Template File Organization\n\n**Location:** `cortex-brain/tier2/response-templates/`\n\
    \n```\n_schema/                               (immutable standard schema)\n  └──\
    \ standard-schema.yaml             (CORTEX 4.0 schema reference)\n\ncore/    \
    \                              (core CORTEX orchestrators)\n  ├── master-orch.yaml\n\
    \  ├── tdd-master.yaml                 (custom template example)\n  ├── planning-orch.yaml\n\
    \  └── governance-orch.yaml\n\ndomain/                                (domain-specific\
    \ orchestrators)\n  ├── ado-orch.yaml\n  ├── vacuum-orch.yaml\n  └── investigation-orch.yaml\n\
    \ncustom/                                (user-defined orchestrators)\n  └── .gitkeep\n\
    ```\n\n**Naming:** All files follow kebab-case, max 25 characters\n\n### 2.5.5\
    \ Custom Template Example (TDD Master)\n\nFile: `cortex-brain/tier2/response-templates/core/tdd-master.yaml`\n\
    \n```yaml\nschema_version: '4.6.0'\norchestrator: \"TddMasterOrchestrator\"\n\
    description: \"TDD Master with test coverage metrics\"\n\nmandatory_header:\n\
    \  enabled: true\n  # Uses standard header format\n\nexecutive_summary:\n  enabled:\
    \ true\n  sections:\n    - name: \"Outcomes\"\n      marker: \"✅\"\n      required:\
    \ true\n    - name: \"In Progress\"\n      marker: \"⚙️\"\n      required: false\n\
    \    - name: \"Risks\"\n      marker: \"⚠️\"\n      required: false\n\ncustom_sections:\n\
    \  enabled: true\n  sections:\n    - name: \"Test Results\"\n      marker: \"\U0001F4CA\
    \"\n      required: true\n      format: |\n        \U0001F4CA TEST RESULTS\n \
    \       \n        • Unit Tests: {unit_passed}/{unit_total} passed\n        • Integration\
    \ Tests: {int_passed}/{int_total} passed\n        • Code Coverage: {coverage}%\n\
    ```\n\n### 2.5.6 New Components\n\n1. **TemplateResolver** (`src/orchestrators/response/template-resolver.py`)\n\
    \   - Loads/validates templates from YAML files\n   - Implements fallback chain\n\
    \   - Caches in memory (<5ms resolution)\n\n2. **ResponseRenderer** (updated `src/orchestrators/response/response-renderer.py`)\n\
    \   - Resolves template before rendering\n   - Enforces mandatory sections\n \
    \  - Validates output format\n\n3. **TemplateRegistry** (`src/orchestrators/registry/template-registry.py`)\n\
    \   - Auto-loads all templates at startup\n   - Detects and logs missing/invalid\
    \ templates\n   - Provides template introspection API\n\n### 2.5.7 Acceptance\
    \ Criteria\n\n- [ ] CustomTemplateConfig extends OrchestratorMetadata\n- [ ] TemplateResolver\
    \ fallback chain: custom → parent → standard\n- [ ] Child orchestrators inherit\
    \ parent templates\n- [ ] Invalid templates don't crash system (logged + fallback)\n\
    - [ ] All templates in tier2/response-templates/ with kebab-case naming\n- [ ]\
    \ Schema validation enforces CORTEX 4.0 format\n- [ ] <5ms template resolution\
    \ (cached)\n- [ ] Tests cover: custom template, inheritance, fallback, invalid\
    \ schema\n\n---\n\n## Part 3: MCP Integration Strategy\n\n### 3.1 Standard MCP\
    \ Tools (Use These)\n\n**MCP Server: Filesystem**\n- `list_directory(path)` -\
    \ List files\n- `read_file(path, start_line, end_line)` - Read file contents\n\
    - `write_file(path, contents)` - Create/write file\n- `search_files(pattern)`\
    \ - Find files by glob\n\n**MCP Server: Git**\n- `get_commit_history(branch)`\
    \ - Get recent commits\n- `create_branch(name, base)` - Create feature branch\n\
    - `commit(message, files)` - Commit changes\n- `create_pull_request(title, body)`\
    \ - Open PR\n\n**MCP Server: SQLite**\n- `query(sql)` - Execute SELECT/INSERT/UPDATE/DELETE\n\
    - `run_migration(script)` - Run schema migration\n\n---\n\n### 3.2 Custom CORTEX\
    \ MCP Tools\n\n**Tool Set 1: Audit Operations**\n- `audit_query(filter, correlation_id)`\
    \ - Query audit trail\n- `audit_export(format)` - Export logs (JSON/CSV)\n- `audit_verify_chain(start,\
    \ end)` - Verify hash chain integrity\n\n**Tool Set 2: Governance Operations**\n\
    - `governance_evaluate(rules, context)` - Evaluate rules against context\n- `governance_add_rule(yaml)`\
    \ - Add new rule to registry\n- `governance_status()` - Show loaded rules + violations\n\
    \n**Tool Set 3: Orchestrator Operations**\n- `orchestrator_list()` - List available\
    \ orchestrators\n- `orchestrator_execute(name, request)` - Trigger orchestrator\n\
    - `orchestrator_status()` - Show running orchestrators\n\n**Tool Set 4: Evidence\
    \ Operations**\n- `evidence_create_bundle(test_results, code_changes)` - Create\
    \ evidence\n- `evidence_query(ac_id)` - Find evidence for AC-ID\n- `evidence_export(bundle_id)`\
    \ - Export bundle\n\n**Tool Set 5: State Operations**\n- `state_get(ac_id)` -\
    \ Get current state\n- `state_transition(ac_id, target_state)` - Attempt transition\n\
    - `state_list_active()` - List all active operations\n\n---\n\n### 3.3 MCP Tool\
    \ Invocation Pattern\n\n**Safe Invocation Protocol:**\n```\n1. Tool registration:\
    \ @mcp_tool decorator + metadata\n2. Schema validation: Copilot validates request\
    \ against schema\n3. Execution in sandbox: Tool runs with resource limits (timeout,\
    \ memory)\n4. Result wrapping: Result wrapped in ExecutionResult\n5. Audit logging:\
    \ Tool invocation logged with correlation_id\n6. Error handling: Tool exception\
    \ caught, wrapped in error response\n```\n\n**Example Tool Definition:**\n```python\n\
    @mcp_tool(\n    name=\"audit_query\",\n    description=\"Query audit log with\
    \ filters\",\n    input_schema={\n        \"type\": \"object\",\n        \"properties\"\
    : {\n            \"filter\": {\n                \"type\": \"string\",\n      \
    \          \"description\": \"SQL WHERE clause (e.g., 'ac_id = AC-AUDIT-001')\"\
    \n            },\n            \"correlation_id\": {\n                \"type\"\
    : \"string\",\n                \"description\": \"Optional: specific operation\
    \ UUID\"\n            },\n            \"limit\": {\n                \"type\":\
    \ \"integer\",\n                \"default\": 100,\n                \"description\"\
    : \"Max results to return\"\n            }\n        },\n        \"required\":\
    \ [\"filter\"]\n    }\n)\ndef audit_query(filter: str, correlation_id: str = None,\
    \ limit: int = 100) -> Dict[str, Any]:\n    \"\"\"Query audit log. Returns list\
    \ of matching entries.\"\"\"\n    # Implementation\n    pass\n```\n\n---\n\n##\
    \ Part 4: Base Infrastructure Interfaces\n\n### 4.1 Execution Request / Response\
    \ Types\n\n**ExecutionRequest:**\n```python\n@dataclass\nclass ExecutionRequest:\n\
    \    correlation_id: str  # UUID for tracing\n    operation: str  # AC-ID or human-readable\
    \ operation\n    user_intent: str  # What user asked for\n    context: Dict[str,\
    \ Any]  # Operation-specific context\n    timeout_seconds: int = 30  # Max execution\
    \ time\n    audit_mode: str = \"development\"  # development | production | hybrid\n\
    ```\n\n**ExecutionResult:**\n```python\n@dataclass\nclass ExecutionResult:\n \
    \   success: bool  # True if operation completed successfully\n    correlation_id:\
    \ str  # Trace ID\n    operation: str  # What was executed\n    message: str \
    \ # Human-readable result\n    data: Dict[str, Any]  # Operation-specific output\n\
    \    evidence: Optional[EvidenceBundle] = None  # Proof of execution\n    duration_ms:\
    \ int = 0  # Execution time\n    violations: List[GovernanceViolation] = field(default_factory=list)\n\
    \    timestamp: str = field(default_factory=lambda: datetime.utcnow().isoformat())\n\
    ```\n\n---\n\n### 4.2 Governance Evaluation Interface\n\n**GovernanceEvaluation:**\n\
    ```python\n@dataclass\nclass GovernanceEvaluation:\n    passed: bool  # True if\
    \ all rules passed\n    rules_evaluated: int  # How many rules checked\n    violations:\
    \ List[GovernanceViolation]  # Failed rules\n    execution_time_ms: float  # How\
    \ long evaluation took\n    registry_version: str  # Hash of loaded ruleset (for\
    \ consistency check)\n```\n\n**GovernanceViolation:**\n```python\n@dataclass\n\
    class GovernanceViolation:\n    rule_id: str  # e.g., \"CORE-002\"\n    severity:\
    \ str  # \"blocked\" | \"warning\" | \"info\"\n    message: str  # Human-readable\
    \ violation reason\n    context: Dict[str, Any]  # What triggered violation\n\
    ```\n\n---\n\n### 4.3 State Manager Interface\n\n**LifecycleManager Methods:**\n\
    ```python\nclass LifecycleManager:\n    def get_state(self, ac_id: str) -> OperationState:\n\
    \        \"\"\"Get current state.\"\"\"\n        pass\n    \n    def transition(self,\
    \ ac_id: str, target_state: str) -> bool:\n        \"\"\"Attempt state transition.\
    \ Returns success.\"\"\"\n        pass\n    \n    def register_callback(self,\
    \ state: str, callback: Callable):\n        \"\"\"Call callback when entering\
    \ state.\"\"\"\n        pass\n    \n    def cancel(self, ac_id: str) -> bool:\n\
    \        \"\"\"Attempt to cancel operation.\"\"\"\n        pass\n```\n\n---\n\n\
    ## Part 5: Implementation Sequence\n\n### Phase 1: Foundations (Week 1)\n- [x]\
    \ ExecutionRequest / ExecutionResult types\n- [x] BaseOrchestrator interface +\
    \ Composite pattern\n- [x] OrchestratorRegistry (plugin system)\n- [x] Response\
    \ template types\n- [x] Governance evaluation interface\n- [x] Unit tests: 100%\
    \ interface coverage\n\n### Phase 2: Integration (Week 2)\n- [ ] MasterOrchestrator\
    \ implementation (uses interfaces above)\n- [ ] MCP tool registration system\n\
    - [ ] Response template rendering\n- [ ] Error handling + fallback strategies\n\
    - [ ] Integration tests: All orchestrators work together\n\n### Phase 3: Safety\
    \ (Week 3)\n- [ ] Distributed lock for state manager\n- [ ] Circuit breaker for\
    \ timeouts\n- [ ] Exception isolation (process sandboxing)\n- [ ] Graceful degradation\
    \ (partial mode)\n- [ ] Chaos tests: Kill random components, verify recovery\n\
    \n### Phase 4: Observability (Week 4)\n- [ ] OpenTelemetry instrumentation\n-\
    \ [ ] Governance evaluation tracing\n- [ ] Orchestrator dependency graph visualization\n\
    - [ ] Alerting: governance inconsistency, slow rules, broken chains\n\n---\n\n\
    ## Part 6: Framework Guidelines\n\n### Design Principles\n\n**1. Simplicity Over\
    \ Completeness**\n- ✅ Implement 80% of features cleanly\n- ❌ Don't implement 100%\
    \ with complexity\n- Trade-off: Some advanced features deferred to Phase 2+\n\n\
    **2. Fail-Safe Defaults**\n- ✅ Operations blocked until governance passes\n- ✅\
    \ Secrets redacted by default (opt-in to log)\n- ✅ Orchestrators isolated by default\n\
    - ❌ No \"unsafe mode\" that disables safety\n\n**3. Observable From First Principles**\n\
    - ✅ Every operation traced (correlation_id from start)\n- ✅ Governance evaluations\
    \ timed + logged\n- ✅ Orchestrator execution order visible\n- ❌ No \"magic\" behavior\
    \ that's hard to trace\n\n**4. Graceful Degradation**\n- ✅ If ADO fails, continue\
    \ with other orchestrators\n- ✅ If KG load fails, continue without intent clarification\n\
    - ✅ If evidence capture fails, log warning but don't block\n- ❌ Cascade failures\
    \ (one broken component stops everything)\n\n---\n\n### Code Organization\n\n\
    ```\nsrc/\n├── orchestrators/\n│   ├── base/\n│   │   ├── base_orchestrator.py\n\
    │   │   ├── orchestrator_registry.py\n│   │   └── execution_types.py\n│   ├──\
    \ core/\n│   │   ├── master_orchestrator.py\n│   │   ├── todo_manager.py\n│  \
    \ │   └── ...\n│   ├── domain/\n│   │   ├── planning_orchestrator.py\n│   │  \
    \ ├── tdd_master.py\n│   │   └── ...\n│   └── custom/\n│       └── (user-defined\
    \ orchestrators auto-discovered)\n├── infrastructure/\n│   ├── execution_request.py\n\
    │   ├── execution_result.py\n│   ├── response_template.py\n│   ├── governance_evaluation.py\n\
    │   └── lifecycle_manager.py\n├── mcp/\n│   ├── mcp_decorator.py\n│   ├── audit_tools.py\n\
    │   ├── governance_tools.py\n│   ├── orchestrator_tools.py\n│   ├── evidence_tools.py\n\
    │   └── state_tools.py\n└── tools/\n    └── (existing helper utilities)\n```\n\
    \n---\n\n## Final Checklist\n\n- [ ] All interfaces documented with examples\n\
    - [ ] Base orchestrator interface implemented (100 lines max)\n- [ ] Response\
    \ template types defined (50 lines)\n- [ ] MCP tool decorators working\n- [ ]\
    \ Unit tests for all interfaces (coverage > 95%)\n- [ ] No external framework\
    \ dependencies\n- [ ] Cross-platform tested (Windows + macOS + Linux)\n\n"
