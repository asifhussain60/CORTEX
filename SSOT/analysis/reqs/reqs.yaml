  content: "# CORTEX 7.0 Design Complete: Custom Templates & Folder Structure\n\n\
    **Date:** 2026-01-14  \n**Status:** ✅ READY FOR IMPLEMENTATION  \n**Commits:**\
    \ 1 comprehensive commit with 5 updated/new roadmap files  \n**Lines Added:**\
    \ 1,771 (new design documentation)\n\n---\n\n## What Was Delivered\n\n### 1. Custom\
    \ Response Template System (NEW)\n\n**File:** `SSOT/roadmap/custom-response-templates.md`\
    \ (350 lines)\n\n**Capability:** Orchestrators can define optional custom response\
    \ templates while maintaining automatic fallback to standard CORTEX 4.0 format.\n\
    \n**Key Components:**\n\n```\nTemplateResolver\n├─ Load YAML templates\n├─ Validate\
    \ schema (CORTEX 4.0 v4.6.0)\n├─ Implement fallback chain: custom → parent → standard\n\
    ├─ Cache in memory (<5ms resolution)\n└─ Handle errors gracefully\n\nTemplate\
    \ Organization\n├─ cortex-brain/tier2/response-templates/_schema/\n│  └─ standard-schema.yaml\
    \ (CORTEX 4.0 immutable reference)\n├─ cortex-brain/tier2/response-templates/core/\n\
    │  ├─ master-orch.yaml (standard)\n│  ├─ tdd-master.yaml (custom with test metrics)\n\
    │  ├─ planning-orch.yaml\n│  └─ governance-orch.yaml\n├─ cortex-brain/tier2/response-templates/domain/\n\
    │  ├─ ado-orch.yaml\n│  ├─ vacuum-orch.yaml\n│  └─ investigation-orch.yaml\n└─\
    \ cortex-brain/tier2/response-templates/custom/\n   └─ (user-defined orchestrators)\n\
    \nTemplate Fallback Chain\nChild Orchestrator\n  ├─ Has custom_template? → Use\
    \ it\n  ├─ No custom? → Inherit parent's template\n  ├─ Parent has custom? → Use\
    \ parent's\n  └─ No custom anywhere? → Use standard (always available)\n```\n\n\
    **Benefits:**\n- ✅ Flexibility for domain-specific formats\n- ✅ Automatic fallback\
    \ ensures safety\n- ✅ Inheritance reduces duplication\n- ✅ Standard template always\
    \ available\n- ✅ <5ms resolution time (cached)\n\n### 2. Nested Folder Structure\
    \ Design (NEW)\n\n**File:** `SSOT/roadmap/folder-structure-design.md` (520 lines)\n\
    \n**Capability:** Complete reorganization into clean, scalable, nested folder\
    \ hierarchy.\n\n**Current State (Before):**\n```\nCORTEX/ (cluttered)\n├── SSOT/\
    \ (18 root .md files - scattered)\n├── src/orchestrators/ (flat, hard to navigate)\n\
    ├── tests/ (flat)\n├── scripts/ (flat)\n└── cortex-brain/ (mixed organization)\n\
    ```\n\n**Target State (After):**\n```\nCORTEX/ (clean, organized)\n├── SSOT/roadmap/\
    \ (consolidated documentation)\n├── cortex-brain/tier2/response-templates/ (new\
    \ location)\n├── src/\n│   ├── orchestrators/\n│   │   ├── core/ (master, tdd-master,\
    \ planning, governance, evidence)\n│   │   ├── domain/ (ado, vacuum, investigation,\
    \ sanitization)\n│   │   ├── custom/ (user-defined, isolated)\n│   │   ├── middleware/\
    \ (governance check, execution guard, audit logger)\n│   │   ├── registry/ (orchestrator-registry,\
    \ template-registry, dependency-resolver)\n│   │   └── response/ (response-renderer,\
    \ template-resolver, response-formatter)\n│   └── infrastructure/ (organized by\
    \ subdomain)\n│       ├── audit-logger/ (logger, schema, queries)\n│       ├──\
    \ governance/ (registry, evaluator, middleware)\n│       ├── state/ (manager,\
    \ persistence, lifecycle)\n│       └── execution/ (request, result, context)\n\
    ├── tests/ (organized by layer)\n│   ├── unit/\n│   ├── integration/\n│   └──\
    \ fixtures/\n└── scripts/ (organized by purpose)\n    ├── admin/\n    ├── generate/\n\
    \    └── tools/\n```\n\n**Naming Convention:**\n- All kebab-case (not snake_case,\
    \ not PascalCase)\n- Max 25 characters (e.g., `tdd-master-orchestrator.py`)\n\
    - Consistent, easy to navigate\n\n### 3. Updated Architecture Specifications\n\
    \n**File:** `SSOT/roadmap/framework-arch-spec.md` (updated, now 620 lines)\n\n\
    **Addition:** Part 2.5 - Custom Response Templates (120 lines)\n\n```\nSections\
    \ Added:\n2.5.1: Optional Custom Templates Per Orchestrator\n2.5.2: Orchestrator\
    \ Metadata Extension (CustomTemplateConfig)\n2.5.3: Template Resolution Algorithm\
    \ (fallback chain)\n2.5.4: Template File Organization (tier2 structure)\n2.5.5:\
    \ Standard Template Format (CORTEX 4.0 schema compliance)\n2.5.6: Implementation\
    \ Details (TemplateResolver, ResponseRenderer, TemplateRegistry)\n2.5.7: Example\
    \ - Custom TDD Master Template\n2.5.8: Acceptance Criteria (AC-TEMPLATE-001, AC-TEMPLATE-002)\n\
    ```\n\n### 4. Consolidated Requirements Updates\n\n**File:** `SSOT/roadmap/consolidated-requirements.md`\
    \ (updated, now 625 lines)\n\n**Additions:**\n- **AR-009: Custom Response Templates\
    \ (APPROVED, 95% confidence)**\n  - Orchestrators can define optional custom templates\n\
    \  - Fallback chain: custom → parent → standard\n  - All templates conform to\
    \ CORTEX 4.0 schema\n  - Child inheritance, no broken responses\n\n- **AR-010:\
    \ Nested Folder Organization (APPROVED, 95% confidence)**\n  - Clean hierarchy\
    \ for all components\n  - Kebab-case naming, max 25 chars\n  - Tier2 response\
    \ templates location specified\n  - Scalable for future plugins\n\n### 5. Implementation\
    \ Roadmap Expansion\n\n**File:** `SSOT/roadmap/implementation-roadmap.md` (updated,\
    \ now 1,350 lines)\n\n**Additions:**\n\n**Week 1 Pre-Tasks (4 hours):**\n- Pre-Task\
    \ 1: Create nested folder structure (30min)\n- Pre-Task 2: Create standard response\
    \ template schema (30min)\n- Pre-Task 3: Create template files for core orchestrators\
    \ (1 hour)\n\n**Week 2 Day 4 Expansion (8 hours):**\n- Task 4.1: TemplateResolver\
    \ (custom template system)\n- Task 4.2: ResponseRenderer updates (custom sections\
    \ support)\n- Task 4.3: TemplateRegistry (auto-discovery)\n- Task 4.4: BaseOrchestrator\
    \ integration (metadata, inheritance)\n\n**NEW Phase 3.5: Folder Structure Migration\
    \ (Parallel Track)**\n- Migration Task 1: Pre-migration validation (1h)\n- Migration\
    \ Task 2: Create directory structure (1h)\n- Migration Task 3: Migrate files by\
    \ category (6h, parallel)\n- Migration Task 4: Update all imports (4h, parallel)\n\
    - Migration Task 5: SSOT consolidation (2h)\n- Migration Task 6: Delete 18 root\
    \ files (30min)\n- Migration Task 7: Final validation (2h)\n- Migration Task 8:\
    \ Merge & close (30min)\n- **Total:** ~16 hours non-blocking parallel track\n\n\
    **Key Feature:** Migration is a PARALLEL track during Weeks 2-3. Does NOT block\
    \ Phase 2-4 implementation. Can be done incrementally.\n\n---\n\n## Architecture\
    \ Decisions Approved & Reflected\n\n| Decision | Status | Files | Implementation\
    \ |\n|----------|--------|-------|-----------------|\n| Custom response templates\
    \ (optional) | ✅ APPROVED | custom-response-templates.md, framework-arch-spec.md\
    \ Part 2.5 | Week 2 Day 4, Tasks 4.1-4.4 |\n| Automatic fallback to standard |\
    \ ✅ APPROVED | custom-response-templates.md Part 5 | TemplateResolver.fallback_chain()\
    \ |\n| Child orchestrator inheritance | ✅ APPROVED | custom-response-templates.md\
    \ Part 3.3 | BaseOrchestrator.get_metadata() + TemplateResolver |\n| Templates\
    \ in tier2/response-templates/ | ✅ APPROVED | folder-structure-design.md Part\
    \ 2.1, Part 4 | Pre-Task 3 + Migration Task 3 |\n| Kebab-case naming, max 25 chars\
    \ | ✅ APPROVED | folder-structure-design.md Part 2.2 | Validation in all files\
    \ |\n| Nested folder organization | ✅ APPROVED | folder-structure-design.md Part\
    \ 2.1 | Migration Task 2-8 |\n| Folder migration as parallel track | ✅ APPROVED\
    \ | implementation-roadmap.md Phase 3.5 | Non-blocking execution |\n\n---\n\n\
    ## New Requirements Introduced\n\n| AC-ID | Title | Status | Roadmap Location\
    \ | Implementation Week |\n|-------|-------|--------|------------------|---------------------|\n\
    | AR-009 | Custom Response Templates | APPROVED | consolidated-requirements.md\
