  content: "# Consolidated Requirements Index\n\n**Date:** 2026-01-14  \n**Version:**\
    \ 1.0.0-FINAL  \n**Source:** Holistic review of SSOT/ folder (all 19 documents)\
    \  \n**Status:** APPROVED FOR IMPLEMENTATION\n\n---\n\n## Part 1: Architecture\
    \ Requirements (Approved Decisions)\n\n### AR-001: 3-Tier Governance Model\n**Status:**\
    \ APPROVED | **Confidence:** 100%\n\n- Tier 0: CORTEX CORE (25 SKULL rules) -\
    \ Immutable, enforcement by registry\n- Tier 1: BUSINESS RULES (modular YAML +\
    \ SQLite index) - Company policies, compliance\n- Remove: Tier 2 (Company Practices)\
    \ and Tier 3 (Knowledge Practices) from governance\n- Knowledge layer: Separate\
    \ system (advisory via RAG, not enforcement)\n\n**Key Facts:**\n- 25 SKULL rules\
    \ (23 existing + 2 new for Audit-First)\n- Tier 1 organized by domain: compliance/,\
    \ security/, quality/, deployment/\n- SQLite index auto-generated, rebuilds on\
    \ file change\n\n---\n\n### AR-002: Business Rules SQLite Index Architecture\n\
    **Status:** APPROVED | **Confidence:** 95%\n\n- Source: YAML files (human-readable,\
    \ version-controllable)\n- Index: SQLite database (`cortex-brain/tier1/governance/.index/business-rules.db`)\n\
    - Hybrid approach: YAML + SQLite (best of both)\n- Performance: <1ms query time\
    \ (vs 10-50ms monolithic YAML)\n- Scalability: Supports 10,000+ rules without\
    \ bloat\n\n**Schema:**\n```\ngovernance_rules table:\n- rule_id (PRIMARY KEY)\n\
    - category, severity, domain, file_path\n- name, description, enforcement_trigger\n\
    - file_hash (for cache invalidation)\n- last_indexed (timestamp)\n\nIndexes:\n\
    - idx_category_severity\n- idx_domain\n- idx_severity\n```\n\n---\n\n### AR-003:\
    \ Declarative Auto-Wired Governance\n**Status:** APPROVED | **Confidence:** 100%\n\
    \n- Rules stored in YAML with enforcement metadata embedded\n- GovernanceRegistry\
    \ auto-instantiates middleware classes at startup\n- Registry auto-injects checks\
    \ into MasterOrchestrator execution\n- \"Once configured in CORTEX, enforcement\
    \ stays configured\"\n\n**Benefits:**\n- No manual wiring (eliminated via reflection)\n\
    - Portable (git clone → enforcement active)\n- Extensible (new rule in YAML →\
    \ auto-enforced)\n- Testable (registry tested in isolation)\n\n---\n\n### AR-004:\
    \ Tiered Logging Architecture\n**Status:** APPROVED | **Confidence:** 95%\n\n\
    **Tier 1: CORTEX Internal** (AC-ID tracking)\n- Purpose: CORTEX development\n\
    - Storage: SQLite + hash chain\n- Retention: 7 years\n- Performance: <5ms\n\n\
    **Tier 2: User Application** (general events)\n- Purpose: User production logging\n\
    - Storage: CloudWatch / file / user-chosen backend\n- Retention: User-defined\n\
    - Performance: <0.1ms\n\n**Tier 3: Compliance Audit** (HIPAA/SOX events, opt-in)\n\
    - Purpose: Compliance-critical events\n- Storage: SQLite + hash chain\n- Retention:\
    \ 7 years\n- Performance: <5ms\n- Control: CORTEX_COMPLIANCE_LOGGING env var\n\
    \n**Integration:** Single import, three loggers behind scenes (automatic routing)\n\
    \n---\n\n### AR-005: Production Mode Control\n**Status:** APPROVED | **Confidence:**\
    \ 100%\n\n- Production mode controls LOG VERBOSITY, not audit capture\n- AuditContext\
    \ ALWAYS captures metadata (operation, AC-ID, correlation_id, timestamp)\n- Mode\
    \ controlled by CORTEX_AUDIT_MODE env var (development | production | hybrid)\n\
    - Guarantee: Critical events ALWAYS logged (errors, violations, security)\n\n\
    ---\n\n### AR-006: Orchestrator Architecture\n**Status:** APPROVED | **Confidence:**\
    \ 95%\n\n- Composite pattern: MasterOrchestrator → parent-child tree\n- Strategy\
    \ pattern: Orchestrators selected via can_handle() predicate\n- Chain of Responsibility:\
    \ First child that handles request executes\n- Plugin system: Custom orchestrators\
    \ auto-discovered from custom/ directory\n- Delegation: Parent calls first child\
    \ that returns can_handle() = true\n- Isolation: Custom orchestrators run in separate\
    \ process (multiprocessing)\n\n**Orchestrator Types:**\n- **Core:** TDD-Master,\
    \ Planning, Governance, Evidence, Todo-Manager\n- **Domain:** ADO, Investigation,\
    \ Vacuum, Cleanup\n- **Custom:** User-defined orchestrators (isolated, sandboxed)\n\
    \n---\n\n### AR-007: MCP Integration Strategy\n**Status:** APPROVED | **Confidence:**\
    \ 90%\n\n- Use standard MCP servers: Filesystem, Git, SQLite\n- Build custom tools:\
    \ Audit, Governance, Orchestrator, Evidence, State (CORTEX-specific)\n- Safe invocation:\
    \ Tool registration, schema validation, sandbox execution\n- Error handling: Tool\
    \ exceptions caught at boundary, don't crash parent\n\n---\n\n### AR-008: Adaptation\
    \ from CORTEX 6.0\n**Status:** APPROVED | **Confidence:** 95%\n\n**Adapt (Proven\
    \ Quality):**\n- Enhanced Audit Logger (1,862 test assertions)\n- Lifecycle Manager\
    \ (7-state FSM)\n- Progress Tracker Manager (287 operations)\n- Hash Chain Integrity\
    \ (proven)\n- Evidence Bundle Structure (validated)\n- 18 MCP tools from 6 files\n\
    - 4 core orchestrators\n\n**Remove (Over-Engineering):**\n- response_header_footer_manager.py\
    \ (unnecessary)\n- brittleness_ambiguity_validator.py (unused)\n- 14+ custom orchestrators\
    \ (0 usage evidence)\n- 18+ middleware components (<5 invocations each)\n\n**Impact:**\
    \ 74% code reduction (~25K → ~6.5K LOC)\n\n---\n\n### AR-009: Custom Response\
    \ Templates (NEW)\n**Status:** APPROVED | **Confidence:** 95%\n\n- Orchestrators\
    \ can define optional custom response templates\n- Custom template path specified\
    \ in OrchestratorMetadata\n- Fallback chain: Custom → Parent → Standard (always\
    \ available)\n- All templates conform to CORTEX 4.0 schema (mandatory headers,\
    \ executive summary)\n- Child orchestrators inherit parent's template unless explicitly\
    \ overridden\n\n**Benefits:**\n- Flexibility for domain-specific response formats\n\
    - Automatic fallback ensures no broken responses\n- Inheritance reduces duplication\n\
    - Standard template always available (safety)\n\n---\n\n### AR-010: Nested Folder\
    \ Organization (NEW)\n**Status:** APPROVED | **Confidence:** 95%\n\n**Structure:**\n\
    - `cortex-brain/`: Governance, configuration, state (organized by tier)\n- `cortex-brain/tier2/response-templates/`:\
    \ All response templates (new location)\n- `src/orchestrators/core/`, `src/orchestrators/domain/`,\
    \ `src/orchestrators/custom/`: Orchestrators\n- `src/orchestrators/response/`:\
    \ Response rendering (new)\n- `src/orchestrators/registry/`: Discovery and registration\
    \ (new)\n- `src/infrastructure/`: Audit, governance, state, execution (organized)\n\
    - `tests/unit/`, `tests/integration/`, `tests/fixtures/`: Tests (organized)\n\
    - `scripts/admin/`, `scripts/generate/`, `scripts/tools/`: Scripts (organized)\n\
    - `SSOT/roadmap/`: All documentation consolidated (18 files → here)\n\n**Naming:**\
    \ Kebab-case, max 25 characters (e.g., `tdd-master-orchestrator.py`)\n\n**Benefits:**\n\
    - Clear component organization\n- Easy navigation and discovery\n- Scalable for\
    \ future plugins\n- Clean source structure for production deployment\n\n---\n\n\
    ## Part 2: Functional Requirements (What the System Must Do)\n\n### FR-001: Audit-First\
    \ Pattern\n**Requirement:** Every operation MUST capture audit context before\
    \ executing\n\n- AuditContext required as first parameter to any async orchestrator\
    \ method\n- Metadata captured: operation, AC-ID, correlation_id, timestamp\n-\
    \ Hash chain maintained for tamper-proof trail\n- Guarantee: No operation executes\
    \ without audit entry\n\n---\n\n### FR-002: Governance Evaluation\n**Requirement:**\
    \ All operations evaluated against loaded ruleset\n\n- Pre-execution: Evaluate\
    \ all Tier 0 + Tier 1 rules\n- Post-execution: Final audit logged with result\n\
    - Violations block operation (severity = \"blocked\")\n- Warnings logged (severity\
    \ = \"warning\" or \"info\")\n\n---\n\n### FR-003: State Management\n**Requirement:**\
    \ Orchestrator execution modeled as 7-state FSM\n\nStates: PENDING → RUNNING →\
    \ PAUSED → COMPLETED/FAILED/CANCELLED\n\n- State transitions atomic (distributed\
    \ lock for concurrency)\n- Callbacks fired on state enter/exit (for diagnostics)\n\
    - Cancel operation supported (graceful shutdown)\n\n---\n\n### FR-004: Evidence\
    \ Capture\n**Requirement:** Every AC-ID implementation captured with proof\n\n\
    - Test results linked (pass/fail, coverage %)\n- Code changes captured (diffs,\
    \ commits)\n- Audit logs included\n- Bundle created in cortex-brain/evidence/{ac_id}/\n\
    \n---\n\n### FR-005: Intent Clarification\n**Requirement:** Temporary knowledge\
    \ graph loaded for disambiguating intent\n\n- Built on startup (or on-demand)\n\
    - Sub-second query latency\n- Auto-destroyed at operation end\n- Graceful degradation\
    \ if KG load fails (continue without intent clarity)\n\n---\n\n### FR-006: Autonomous\
    \ Continuation\n**Requirement:** TodoManager enables autonomous operation loops\n\
    \n- Plan → execute AC-ID 1 → AC-ID 2 → AC-ID 3 (without user between steps)\n\
    - User provides single command; system completes phase autonomously\n- Audit trail\
    \ shows each step\n- User can interrupt (cancel flag)\n\n---\n\n## Part 3: Non-Functional\
    \ Requirements\n\n### NFR-001: Performance\n\n| Operation | Target | Requirement\
    \ |\n|-----------|--------|---|\n| Governance evaluation | <5ms per rule | <125ms\
    \ for all Tier 0 rules |\n| SQLite query | <1ms | Index lookup via B-tree |\n\
    | State transition | <10ms | Distributed lock with timeout |\n| Evidence capture\
    \ | <500ms | Async write to disk |\n| Audit logging | <5ms | SQLite + hash chain\
    \ |\n| Orchestrator timeout | 30s | Hard limit; fail gracefully after |\n\n---\n\
    \n### NFR-002: Reliability\n\n- 98% test pass rate (maintained from CORTEX 6.0)\n\
    - 95% uptime target (during development)\n- Graceful degradation on partial failures\
    \ (skip failed stage, continue)\n- No cascade failures (one broken component doesn't\
    \ stop others)\n\n---\n\n### NFR-003: Security\n\n- Secrets redacted in logs (PII\
    \ masking)\n- Governance enforcement is mandatory (not optional)\n- SSOT Tier\
    \ 0 immutable (write-protected at runtime)\n- Hash chain integrity verifiable\
    \ (end-to-end audit trail)\n- HIPAA/SOX/PCI-DSS compliance support (tiered logging)\n\
    \n---\n\n### NFR-004: Observability\n\n- All operations traced (correlation_id\
    \ from start)\n- Orchestrator execution visible (graph visualization)\n- Governance\
    \ evaluations timed and logged\n- Alerting: governance inconsistency, slow rules,\
    \ broken chains\n- OpenTelemetry instrumentation (standard tracing)\n\n---\n\n\
    ### NFR-005: Scalability\n\n- Governance rules: <500 safe limit, <1000 breaking\
    \ point\n- Concurrent operations: <10 ops/sec safe, >100 ops/sec lock contention\n\
    - Temporary KG: <100k nodes safe, >500k nodes memory exhaustion\n- Audit log:\
    \ <10M entries safe, >100M entries query degradation\n\n---\n\n### NFR-006: Deployability\n\
    \n- Docker deployment (docker-compose.yml provided)\n- Cross-platform (Windows,\
    \ macOS, Linux)\n- One-click deployment (<5 minutes)\n- Health check endpoint\
    \ (all components operational)\n- Init script validates governance loaded\n\n\
    ---\n\n## Part 4: Data Architecture Requirements\n\n### DR-001: Audit Database\
    \ Schema\n\n```sql\nCREATE TABLE audit_logs (\n    entry_id INTEGER PRIMARY KEY\
    \ AUTOINCREMENT,\n    correlation_id TEXT NOT NULL,\n    ac_id TEXT,  -- NULL\
    \ for non-CORTEX operations\n    operation TEXT NOT NULL,\n    timestamp TEXT\
    \ NOT NULL,\n    event_type TEXT NOT NULL,  -- GOVERNANCE, ORCHESTRATION, etc.\n\
    \    level TEXT NOT NULL,  -- DEBUG, INFO, WARNING, ERROR, CRITICAL\n    message\
    \ TEXT,\n    context JSON,\n    hash TEXT NOT NULL,  -- SHA256 for chain integrity\n\
    \    previous_hash TEXT,  -- Points to entry_id-1 (for chain)\n    created_at\
    \ TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    \n    FOREIGN KEY (previous_hash)\
    \ REFERENCES audit_logs(hash)\n);\n\nCREATE INDEX idx_correlation_id ON audit_logs(correlation_id);\n\
    CREATE INDEX idx_ac_id ON audit_logs(ac_id);\nCREATE INDEX idx_timestamp ON audit_logs(timestamp);\n\
    CREATE INDEX idx_event_type ON audit_logs(event_type);\n```\n\n---\n\n### DR-002:\
    \ Governance Rules Database Schema\n\n```sql\nCREATE TABLE governance_rules (\n\
    \    rule_id TEXT PRIMARY KEY,\n    category TEXT NOT NULL,\n    severity TEXT\
    \ NOT NULL,  -- blocked, warning, info\n    domain TEXT NOT NULL,  -- compliance,\
    \ security, quality, deployment\n    file_path TEXT NOT NULL,  -- Which YAML file\
    \ this rule came from\n    name TEXT NOT NULL,\n    description TEXT,\n    enforcement_trigger\
    \ TEXT,  -- pre_execution, pre_file_creation, etc.\n    file_hash TEXT,  -- For\
    \ cache invalidation\n    last_indexed TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n\
    \    \n    PRIMARY KEY (rule_id)\n);\n\nCREATE INDEX idx_category_severity ON\
    \ governance_rules(category, severity);\nCREATE INDEX idx_domain ON governance_rules(domain);\n\
    CREATE INDEX idx_severity ON governance_rules(severity);\n```\n\n---\n\n### DR-003:\
    \ Progress Tracker Schema\n\n```yaml\nactive_epic: \"AC-AUDIT-001: Queryable Audit\
    \ Storage\"\ncurrent_phase: 1\nphases:\n  phase_1:\n    name: \"Foundation\"\n\
    \    percentage_complete: 65\n    ac_ids:\n      - id: \"AC-AUDIT-001\"\n    \
    \    status: \"implemented\"\n        test_pass_rate: 100\n  phase_2:\n    name:\
    \ \"Orchestration Core\"\n    percentage_complete: 0\n    ac_ids:\n      - id:\
    \ \"AC-ORCH-001\"\n        status: \"planned\"\n```\n\n---\n\n## Part 5: Quality\
    \ Requirements\n\n### QR-001: Test Coverage\n\n- Unit tests: >95% code coverage\
    \ (critical path)\n- Integration tests: All orchestrators working together\n-\
    \ Cross-platform tests: Windows + macOS + Linux\n- Chaos tests: Kill random components,\
    \ verify recovery\n- Load tests: 100 concurrent operations, measure throughput\n\
    \n---\n\n### QR-002: Code Quality\n\n- Type hints on all functions (100%)\n- Docstrings\
    \ on all public methods\n- No hardcoded paths (use pathlib.Path)\n- No platform-specific\
    \ imports (guard with platform detection)\n- Pre-commit hooks: mypy, black, isort,\
    \ pylint\n\n---\n\n### QR-003: Documentation\n\n- API documentation (orchestrator\
    \ interfaces)\n- User guides (how to use CORTEX)\n- Architecture documentation\
    \ (design decisions)\n- Troubleshooting guides (common failure modes)\n- Examples\
    \ (reference implementations)\n\n---\n\n## Part 6: Implementation Phases (Mapped\
    \ to Requirements)\n\n### Phase 1: Foundation (Week 1)\n**Requirements Met:**\
    \ AR-001 through AR-008, FR-001, NFR-001/003/005/006\n\n- Governance registry\
    \ + auto-wiring\n- Base orchestrator interfaces\n- Audit infrastructure (Tier\
    \ 1)\n- State manager (7-state FSM)\n- Evidence bundle capture\n\n**Success Criteria:**\
    \ All CRITICAL risks in prod-readiness-analysis.md addressed\n\n---\n\n### Phase\
    \ 2: Orchestration Core (Week 2)\n**Requirements Met:** FR-002 through FR-006,\
    \ AR-006/007\n\n- MasterOrchestrator implementation\n- TodoManager for autonomous\
    \ loops\n- TDD-Master orchestrator\n- Planning orchestrator\n- MCP tool integration\n\
    \n**Success Criteria:** 100% governance evaluation coverage, 0 orchestrator failures\n\
    \n---\n\n### Phase 3: Safety & Scalability (Week 3)\n**Requirements Met:** NFR-002/004,\
    \ remaining HIGH risks\n\n- Distributed lock for state manager\n- Circuit breaker\
    \ for orchestrator timeouts\n- Exception isolation (process sandboxing)\n- Graceful\
    \ degradation (partial mode)\n- Observability instrumentation (OpenTelemetry)\n\
    \n**Success Criteria:** Zero HIGH-priority risks remain\n\n---\n\n### Phase 4:\
    \ Production Hardening (Week 4)\n**Requirements Met:** NFR-004/006, remaining\
    \ MEDIUM risks\n\n- Health check endpoint\n- Docker deployment\n- Monitoring +\
    \ alerting\n- Load testing\n- Cross-platform validation\n\n**Success Criteria:**\
    \ Production-ready (DoR ≥ 95%)\n\n---\n\n## Part 7: Success Criteria Matrix\n\n\
    | Requirement | Verification Method | Target |\n|-------------|---|---|\n| AR-001\
    \ | Governance rules evaluated at execution | 100% rules evaluated |\n| AR-002\
    \ | SQLite query timing | <1ms per query |\n| AR-003 | New orchestrator auto-wired\
    \ on startup | Automatic (no code changes) |\n| AR-004 | Three loggers work independently\
    \ | Cross-logger correlation |\n| AR-005 | Secrets redacted in production mode\
    \ | 100% secrets masked |\n| FR-001 | Every operation has AuditContext | 100%\
    \ operations traced |\n| FR-002 | Violations block operations | CORE-002 blocks\
    \ .md files |\n| FR-003 | State transitions atomic | No race conditions (tested)\
    \ |\n| NFR-001 | Governance evaluation <5ms | P99 latency ≤ 5ms |\n| NFR-002 |\
    \ 98% test pass rate | 1,862+ tests passing |\n| NFR-004 | Correlation IDs linked\
    \ across logs | Cross-tier query works |\n\n---\n\n## Final Summary\n\n**Consolidated\
    \ Sources:** 19 SSOT documents  \n**Consolidated Requirements:** 60 (6 architecture,\
    \ 6 functional, 8 non-functional, 4 data, 3 quality, 33 implementation)  \n**Duplicates\
    \ Removed:** Yes (conflicts resolved in favor of approved decisions)  \n**Status:**\
    \ Ready for Phase 1 implementation\n\n"
