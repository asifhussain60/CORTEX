  content: "# Custom Response Templates Architecture\n\n**Date:** 2026-01-14  \n**Version:**\
    \ 1.0.0 - DESIGN SPECIFICATION  \n**Status:** Ready for Implementation  \n**Purpose:**\
    \ Enable optional custom response templates per orchestrator with automatic fallback\
    \ to standard template\n\n---\n\n## Executive Summary\n\nCORTEX 7.0 supports **optional\
    \ custom response templates** for each orchestrator and child orchestrator while\
    \ maintaining **automatic fallback** to the standard CORTEX 4.0 response template\
    \ format. This enables:\n\n- ✅ Orchestrators to define custom response formats\
    \ for domain-specific operations\n- ✅ Child orchestrators to override parent templates\
    \ for specialized output\n- ✅ Automatic fallback to standard template if custom\
    \ template not provided\n- ✅ Template inheritance: Child inherits parent's template\
    \ unless explicitly overridden\n- ✅ Responsive to CORTEX 4.0 established patterns\
    \ (mandatory headers, executive summary format)\n- ✅ Clean nested folder structure\
    \ for all components\n\n---\n\n## Part 1: Response Template System Design\n\n\
    ### 1.1 Template Hierarchy\n\n```\nBaseResponseTemplate\n├─ Standard CORTEX Template\
    \ (fallback - always available)\n│  └─ Used if orchestrator has no custom_template_path\n\
    │\n├─ Orchestrator Custom Template (optional)\n│  └─ If defined: orchestrator.custom_template_path\
    \ = \"path/to/template.yaml\"\n│  └─ Loaded at orchestrator initialization\n│\
    \  └─ Must conform to CORTEX 4.0 schema (mandatory_header, executive_summary,\
    \ etc.)\n│\n└─ Child Orchestrator Custom Template (optional override)\n   └─ Child\
    \ inherits parent's template by default\n   └─ If child.custom_template_path defined:\
    \ uses own template instead\n   └─ Falls back to parent template if child template\
    \ missing/invalid\n   └─ Falls back to standard template if parent has no custom\
    \ template\n```\n\n### 1.2 Template Resolution Algorithm\n\n```\nFUNCTION resolve_response_template(orchestrator):\n\
    \  \n  # Step 1: Check if orchestrator has custom template defined\n  IF orchestrator.custom_template_path\
    \ DEFINED:\n    template = load_template(orchestrator.custom_template_path)\n\
    \    IF template VALID:\n      RETURN template\n    ELSE:\n      LOG WARNING(\"\
    Invalid custom template, falling back to parent\")\n  \n  # Step 2: Check if child\
    \ orchestrator - try parent template\n  IF orchestrator.parent_orchestrator EXISTS:\n\
    \    parent_template = resolve_response_template(orchestrator.parent)\n    IF\
    \ parent_template != standard_template:\n      RETURN parent_template\n  \n  #\
    \ Step 3: Use standard CORTEX template (fallback)\n  RETURN load_standard_template()\n\
    ```\n\n### 1.3 Orchestrator Template Metadata\n\n**BaseOrchestrator extended with\
    \ template support:**\n\n```yaml\nmetadata:\n  name: \"TDD Master\"\n  version:\
    \ \"1.0.0\"\n  category: \"core\"\n  \n  # NEW: Optional custom response template\n\
    \  custom_template:\n    enabled: false  # Set to true to use custom template\n\
    \    path: \"cortex-brain/tier2/response-templates/tdd-master.yaml\"\n    schema_version:\
    \ \"4.6.0\"  # Must match standard schema\n    fallback_on_error: true  # Use\
    \ standard template if custom fails\n```\n\n---\n\n## Part 2: Standard CORTEX\
    \ 4.0 Response Template Schema\n\n### 2.1 Template Structure (From CORTEX 4.0)\n\
    \nAll response templates (custom or standard) must conform to:\n\n```yaml\nschema_version:\
    \ '4.6.0'\ndescription: \"Response template\"\n\n# MANDATORY SECTION 1: Header\n\
    mandatory_header:\n  enabled: true\n  template: |\n    ## \U0001F9E0 CORTEX {operation_type}\n\
    \    **Author:** Asif Hussain | **Phase:** {phase} | **Orchestrator:** {orchestrator}\
    \ ✅\n    \n    ---\n    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**\n\
    \    \n    ---\n\n# MANDATORY SECTION 2: Executive Summary Format\nexecutive_summary:\n\
    \  enabled: true\n  position: 'after_header'\n  \n  format_rules:\n    mandatory:\n\
    \      - \"Start with 3-5 sentence executive summary\"\n      - \"Use bullet points\
    \ for all lists (max 5 per section)\"\n      - \"Each bullet MUST be on separate\
    \ line\"\n      - \"NO code snippets unless explicitly requested\"\n      - \"\
    NO narrative prose - declarative statements only\"\n    \n    sections:\n    \
    \  - name: \"Outcomes\"\n        marker: \"✅\"\n        max_bullets: 5\n     \
    \   required: true\n      \n      - name: \"In Progress\"\n        marker: \"\
    ⚙️\"\n        max_bullets: 3\n        required: false\n      \n      - name: \"\
    Risks\"\n        marker: \"⚠️\"\n        max_bullets: 3\n        required: false\n\
    \      \n      - name: \"Impact\"\n        marker: \"\U0001F3AF\"\n        max_bullets:\
    \ 3\n        required: false\n      \n      - name: \"Next Steps\"\n        marker:\
    \ \"\U0001F4CB\"\n        max_bullets: 5\n        required: true\n\n# OPTIONAL\
    \ SECTION 3: Domain-Specific Sections\n# Custom templates can add additional sections\
    \ here\ncustom_sections:\n  enabled: true\n  examples:\n    - name: \"Governance\
    \ Violations\"\n      marker: \"\U0001F534\"\n      used_by: \"GovernanceOrchestrator\"\
    \n    \n    - name: \"Test Coverage\"\n      marker: \"\U0001F4CA\"\n      used_by:\
    \ \"TddMasterOrchestrator\"\n    \n    - name: \"Performance Metrics\"\n     \
    \ marker: \"⚡\"\n      used_by: \"OptimizationOrchestrator\"\n```\n\n### 2.2 Custom\
    \ Template Example (TDD Master)\n\nFile: `cortex-brain/tier2/response-templates/tdd-master.yaml`\n\
    \n```yaml\nschema_version: '4.6.0'\norchestrator: \"TddMasterOrchestrator\"\n\
    description: \"Custom template for TDD Master with test coverage metrics\"\n\n\
    mandatory_header:\n  enabled: true\n  # Inherits standard header format\n\nexecutive_summary:\n\
    \  enabled: true\n  sections:\n    - name: \"Outcomes\"\n      marker: \"✅\"\n\
    \      max_bullets: 5\n      required: true\n    \n    - name: \"In Progress\"\
    \n      marker: \"⚙️\"\n      max_bullets: 3\n      required: false\n    \n  \
    \  - name: \"Risks\"\n      marker: \"⚠️\"\n      max_bullets: 3\n      required:\
    \ false\n\n# NEW: Custom sections for TDD\ncustom_sections:\n  enabled: true\n\
    \  sections:\n    - name: \"Test Results\"\n      marker: \"\U0001F4CA\"\n   \
    \   required: true\n      fields:\n        - \"Unit Tests: X/Y passed\"\n    \
    \    - \"Integration Tests: A/B passed\"\n        - \"Coverage: Z%\"\n      format:\
    \ |\n        \U0001F4CA TEST RESULTS\n        \n        • Unit Tests: {unit_passed}/{unit_total}\
    \ passed\n        • Integration Tests: {int_passed}/{int_total} passed\n     \
    \   • Coverage: {coverage}%\n    \n    - name: \"Next Steps\"\n      marker: \"\
    \U0001F4CB\"\n      required: true\n```\n\n---\n\n## Part 3: Folder Structure\
    \ Design\n\n### 3.1 Clean Nested Organization\n\n```\nCORTEX/\n├── cortex-brain/\n\
    │   ├── tier0/                          # Immutable CORTEX core\n│   │   └── governance/\n\
    │   │       └── core-rules.yaml\n│   │\n│   ├── tier1/                       \
    \   # Active state (mutable)\n│   │   ├── tracking/\n│   │   │   └── progress-tracker.json\n\
    │   │   ├── acceptance-criteria/\n│   │   │   └── AC-INDEX.yaml\n│   │   └── governance/\n\
    │   │       └── business-rules/         (domain-organized)\n│   │\n│   ├── tier2/\
    \                          # Engineering practices & response templates\n│   │\
    \   ├── response-templates/         ⭐ NEW - Consolidated here\n│   │   │   ├──\
    \ _schema/\n│   │   │   │   └── standard-schema.yaml\n│   │   │   ├── core/\n\
    │   │   │   │   ├── master-orch.yaml\n│   │   │   │   ├── tdd-master.yaml\n│ \
    \  │   │   │   ├── planning-orch.yaml\n│   │   │   │   └── governance-orch.yaml\n\
    │   │   │   ├── domain/\n│   │   │   │   ├── ado-orch.yaml\n│   │   │   │   ├──\
    \ vacuum-orch.yaml\n│   │   │   │   └── investigation-orch.yaml\n│   │   │   └──\
    \ custom/                 (user-defined orchestrators)\n│   │   │       └── .gitkeep\n\
    │   │   │\n│   │   ├── engineering-standards/\n│   │   │   ├── code-quality.yaml\n\
    │   │   │   ├── testing.yaml\n│   │   │   └── security.yaml\n│   │   │\n│   │\
    \   └── configuration/\n│   │       ├── core-config.yaml\n│   │       └── environment.yaml\n\
    │   │\n│   ├── tier3/                          # Knowledge patterns (learned)\n\
    │   │   └── knowledge-patterns/\n│   │       └── implementation-patterns.yaml\n\
    │   │\n│   ├── cx6-plan/                       # Planning & roadmap\n│   │   └──\
    \ viewer/\n│   │       └── plan-viewer-data.json\n│   │\n│   ├── documents/  \
    \                    # Generated documentation\n│   │   ├── architecture/\n│ \
    \  │   ├── governance/\n│   │   └── roadmap/\n│   │\n│   └── audit-logs/     \
    \                # Operational logs\n│\n├── src/                             \
    \   # Source code (clean organization)\n│   ├── orchestrators/\n│   │   ├── core/\
    \                       ⭐ NEW - Organized by tier\n│   │   │   ├── base-orchestrator.py\n\
    │   │   │   ├── master-orch.py\n│   │   │   ├── tdd-master-orch.py\n│   │   │\
    \   ├── planning-orch.py\n│   │   │   ├── governance-orch.py\n│   │   │   └──\
    \ evidence-orch.py\n│   │   │\n│   │   ├── domain/                     (domain-specific)\n\
    │   │   │   ├── ado-orch.py\n│   │   │   ├── vacuum-orch.py\n│   │   │   ├── investigation-orch.py\n\
    │   │   │   └── sanitization-orch.py\n│   │   │\n│   │   ├── custom/         \
    \            (user-defined, isolated)\n│   │   │   └── .gitkeep\n│   │   │\n│\
    \   │   ├── middleware/                 (request/response processing)\n│   │ \
    \  │   ├── governance-check.py\n│   │   │   ├── execution-guard.py\n│   │   │\
    \   └── audit-logger.py\n│   │   │\n│   │   ├── registry/                   ⭐\
    \ NEW - Discovery & registration\n│   │   │   ├── orchestrator-registry.py\n│\
