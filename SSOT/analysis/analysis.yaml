    \ document for consolidating all requirements holistically\n\n---\n\n## A1: SSOT/analysis\
    \ Review Complete ✅\n\n### Files in SSOT/analysis/reqs/ (9 files):\n1. 00-consolidation-summary.md\
    \ - Consolidation report (331 lines)\n2. consolidated-requirements.md - Requirements\
    \ index (510 lines) ✅ ANALYZED\n3. custom-response-templates.md - AR-009 design\
    \ (350+ lines)\n4. folder-structure-design.md - AR-010 design (520+ lines)\n5.\
    \ framework-arch-spec.md - Technical spec (670+ lines)\n6. implementation-roadmap.md\
    \ - 5-week roadmap (1,350+ lines)\n7. IMPLEMENTATION-SUMMARY.md - Phase 3 summary\
    \ (337 lines)\n8. prod-readiness-analysis.md - Risks/safety (400+ lines)\n9. README.md\
    \ - Navigation (355 lines)\n\n### Total Consolidated Requirements from SSOT/roadmap:\n\
    \n#### Architecture Requirements (10 AR-IDs):\n- AR-001: 3-Tier Governance Model\n\
    - AR-002: Business Rules SQLite Index Architecture\n- AR-003: Declarative Auto-Wired\
    \ Governance\n- AR-004: Tiered Logging Architecture (3 tiers: CORTEX Internal,\
    \ User App, Compliance)\n- AR-005: Production Mode Control (env var: CORTEX_AUDIT_MODE)\n\
    - AR-006: Orchestrator Architecture (composite, strategy, plugin system)\n- AR-007:\
    \ MCP Integration Strategy (standard + custom tools)\n- AR-008: Adaptation from\
    \ CORTEX 6.0 (74% code reduction to 6.5K LOC)\n- AR-009: Custom Response Templates\
    \ (fallback chain: custom → parent → standard)\n- AR-010: Nested Folder Organization\
    \ (kebab-case, max 25 chars)\n\n#### Functional Requirements (6 FR-IDs):\n- FR-001:\
    \ Audit-First Pattern (every operation captures audit context)\n- FR-002: Governance\
    \ Evaluation (pre/post execution)\n- FR-003: State Management (7-state FSM)\n\
    - FR-004: Evidence Capture (test results, code changes, audit logs)\n- FR-005:\
    \ Intent Clarification (knowledge graph for disambiguation)\n- FR-006: Autonomous\
    \ Continuation (TodoManager execution loops)\n\n#### Non-Functional Requirements\
    \ (4 NFR-IDs):\n- NFR-001: Performance (<5ms governance, <1ms SQLite query, <10ms\
    \ state transition)\n- NFR-002: Reliability (98% test pass rate, 95% uptime, graceful\
    \ degradation)\n- NFR-003: Security (secrets redacted, enforcement mandatory,\
    \ HIPAA/SOX/PCI-DSS support)\n- NFR-004: Observability (correlation_id tracing,\
    \ orchestrator graphs, governance audit)\n\n#### Core Governance Rules: 25 SKULL\
    \ Rules\n- From consolidated-requirements.md (referenced as CORE-001 through CORE-025,\
    \ though specific titles need to be extracted)\n- CORTEX CORE rules (immutable,\
    \ enforcement via registry)\n- Organized by category (TDD, governance, portability,\
    \ documentation, etc.)\n\n---\n\n## A2: Hallucination Prevention Requirements\n\
    \n### Source Documents:\n- __backup/cortex-brain/documents/execution-summaries/hallucination-prevention-integration-2026-01-13.md\
    \ (302 lines) ✅ REVIEWED\n\n### Extracted Enhancement AC-IDs (25 total):\n\n####\
    \ Phase 2 WIN Machine (15 AC-IDs, +3.5 days → 17.5 days total):\n\n**Input Validation\
    \ (AC-VALIDATE-001 to AC-VALIDATE-010):**\n- AC-VALIDATE-001: Intent canonicalization\n\
    - AC-VALIDATE-002: AC-ID existence check\n- AC-VALIDATE-003: Evidence bundle pre-check\n\
    - AC-VALIDATE-004: Cross-reference coherence\n- AC-VALIDATE-005: Semantic output\
    \ validation\n- AC-VALIDATE-006: AC-ID format validation\n- AC-VALIDATE-007: Phase\
    \ alignment enforcement\n- AC-VALIDATE-008: Request contradiction detection\n\
    - AC-VALIDATE-009: Schema validation (requests match orchestrator input schema)\n\
    - AC-VALIDATE-010: Backward compatibility checks\n\n**Health Metrics (AC-METRICS-001\
    \ to AC-METRICS-005):**\n- AC-METRICS-001: Input validation success rate\n- AC-METRICS-002:\
    \ Semantic validation accuracy\n- AC-METRICS-003: Cross-reference success rate\n\
    - AC-METRICS-004: Phase alignment enforcement rate\n- AC-METRICS-005: Anomaly\
    \ detection (triggers alerts on unusual patterns)\n\n#### Phase 4 MAC Machine\
    \ (10 AC-IDs, +5.25 days → 19.25 days total):\n\n**Cross-File Coherence (AC-COHERENCE-001\
    \ to AC-COHERENCE-004):**\n- AC-COHERENCE-001: File-to-file requirement coherence\n\
    - AC-COHERENCE-002: AC-ID naming consistency across files\n- AC-COHERENCE-003:\
    \ Reference validity (all references resolve)\n- AC-COHERENCE-004: Contradiction\
    \ detection (conflicting AC-IDs flagged)\n\n**Provenance Tracking (AC-EXPLAIN-001\
    \ to AC-EXPLAIN-005):**\n- AC-EXPLAIN-001: Requirement source tracking\n- AC-EXPLAIN-002:\
    \ Decision justification capture\n- AC-EXPLAIN-003: Architecture decision rationale\n\
    - AC-EXPLAIN-004: Test coverage justification\n- AC-EXPLAIN-005: Evidence bundle\
    \ provenance\n\n---\n\n## A3: Brittleness Fix Requirements\n\n### Source Documents:\n\
    - __backup/cortex-brain/documents/validation/brittleness-executive-briefing.md\
    \ (122 lines) ✅ REVIEWED\n- __backup/cortex-brain/documents/analysis/brittleness-fix-summary.md\
    \ (292 lines) ✅ REVIEWED\n- __backup/cortex-brain/documents/misc/brittleness-scorecard.md\
    \ (510 lines) ✅ REVIEWED\n- Additional: validate-prompt-brittleness.py, brittleness_ambiguity_validator.py,\
    \ brittleness-review-2026-01-13.md, etc.\n\n### Extracted Brittleness Problems\
    \ & Solutions:\n\n#### 4 CRITICAL Production Blockers (Phase 9.4, Day 0):\n1.\
    \ **Database Concurrency (Data Corruption Risk)**\n   - Problem: SQLite journal\
    \ mode = 'delete' (default) instead of WAL\n   - Impact: Power failure during\
    \ concurrent writes → silent data corruption\n   - Solution: Enable WAL mode on\
    \ startup (1 line: `conn.execute(\"PRAGMA journal_mode=WAL\")`)\n   - Prevention:\
    \ AC-BRITTLE-001\n   - Test: Verify governance.db has `-wal` and `-shm` files\n\
    \n2. **Audit Schema Missing (Evidence Validation Broken)**\n   - Problem: \"no\
    \ such table: audit_logs\" error in validator\n   - Impact: 97% verification rate\
    \ becomes 0%, evidence collection unusable\n   - Solution: Create schema migration,\
    \ auto-initialize on first connection\n   - Prevention: AC-BRITTLE-002\n   - Test:\
    \ Query SELECT COUNT(*) FROM audit_logs (no error)\n\n3. **Tracker Progress Broken\
    \ (Phase Gates Unenforceable)**\n   - Problem: progress-tracker.json shows 0/0\
    \ for all phases\n   - Impact: Cannot determine actual progress, phase gates unenforceable\n\
    \   - Solution: Rebuild from AC-INDEX using evidence validator --fix\n   - Prevention:\
    \ AC-BRITTLE-003\n   - Test: Verify tracker.phases.*.completed_count > 0 (if phase\
    \ has AC-IDs)\n\n4. **Pytest Collection Warnings (Hidden Test Failures Risk)**\n\
    \   - Problem: Dataclass naming (TestResult, TestExecutor) confuses pytest\n \
    \  - Impact: Tests may be silently skipped, false confidence in coverage\n   -\
    \ Solution: Rename dataclasses to remove 'Test' prefix (3 renames, <5 min)\n \
    \  - Prevention: AC-BRITTLE-004\n   - Test: Run pytest --co -q, verify 0 warnings\n\
    \n#### 10 HIGH Priority Fixes (Phase 9.4 Week 1):\n- AC-BRITTLE-005: Import brittleness\
    \ (relative imports → absolute imports)\n- AC-BRITTLE-006: Test collection brittleness\n\
    - AC-BRITTLE-007: Package path brittleness\n- AC-BRITTLE-008: AC Completeness\
    \ brittleness (11 missing AC implementations)\n- AC-BRITTLE-009: Evidence generation\
    \ brittleness\n- AC-BRITTLE-010: Portability brittleness (0/100 cross-platform)\n\
    - AC-BRITTLE-011: State management brittleness\n- AC-BRITTLE-012: Governance enforcement\
    \ brittleness\n- AC-BRITTLE-013: Test-AC linking brittleness\n- AC-BRITTLE-014:\
    \ Verification rate brittleness (0% → target 80%+)\n\n### Import Brittleness Details:\n\
    - Relative imports assume incorrect package paths (../infrastructure/ when actually\
    \ at src/infrastructure/)\n- Created: scripts/validate_import_patterns.py\n- Fixed:\
    \ 8 import statements in src/orchestrators/core/master_orchestrator.py\n- Test:\
    \ 1498 tests now runnable (was 1476)\n- Impact: Phase 4.5 integration testing\
    \ unblocked\n\n### Test Collection Brittleness Details:\n- 11 of 46 test files\
    \ fail to collect (24% failure rate)\n- Syntax errors and missing modules\n- AC-TEST-001/002:\
    \ Implement AC-based discovery + execution system\n\n### Brittleness Scorecard\
    \ (Before Fixes):\n```\nTest Execution:          0/100  \U0001F534 (11 of 46 files\
    \ fail to collect)\nAC Completeness:        67/100  \U0001F7E0 (11 AC-IDs missing\
    \ implementation)\nEvidence Generation:     0/100  \U0001F534 (cannot capture\
    \ test results)\nPortability:             0/100  \U0001F534 (no cross-platform\
    \ support)\nState Management:       50/100  \U0001F7E0 (7-state FSM exists but\
    \ incomplete)\nGovernance Enforce:     40/100  \U0001F7E0 (25 rules, only 10 active)\n\
    Test-AC Linking:        0/100  \U0001F534 (tests not organized by AC-ID)\nVerification\
    \ Rate:      0/100  \U0001F534 (no evidence bundle generation)\n─────────────────────────────────\n\
    OVERALL:               27/100  \U0001F534 CRITICAL\n```\n\n---\n\n## A4: Requirement-to-Component\
    \ Mapping\n\n### Components Identified from framework-arch-spec.md:\n\n#### Core\
    \ Framework Components:\n1. **BaseOrchestrator** - Base interface for all orchestrators\n\
    2. **MasterOrchestrator** - Root orchestrator, governance evaluation, state management\n\
    3. **OrchestratorRegistry** - Plugin discovery and registration\n4. **TemplateResolver**\
    \ - Custom template resolution with fallback chain\n5. **ResponseRenderer** -\
    \ Response rendering and formatting\n6. **EnhancedAuditLogger** - Audit logging\
    \ across 3 tiers (from CORTEX 6.0)\n7. **LifecycleManager** - 7-state FSM state\
    \ management (from CORTEX 6.0)\n8. **ProgressTracker** - Phase and AC-ID progress\
    \ tracking\n9. **GovernanceRegistry** - Rule instantiation and enforcement\n10.\
    \ **EvidenceBundle** - Test results, code changes, audit logs packaging\n\n####\
    \ Domain Components:\n- TDD-Master Orchestrator\n- Planning Orchestrator\n- ADO\
    \ Orchestrator (Azure DevOps integration)\n- Investigation Orchestrator\n- Governance\
    \ Orchestrator\n- Evidence Orchestrator\n- Todo-Manager Orchestrator\n- Vacuum\
    \ Orchestrator\n- Cleanup Orchestrator\n\n#### Infrastructure Components:\n- SQLite\
    \ Governance Index (business rules indexing)\n- Hash Chain Integrity (tamper-proof\
    \ audit trail)\n- Knowledge Graph (intent disambiguation)\n- MCP Tool Integration\
    \ (5 custom tools)\n\n#### Response Template Components (AR-009):\n- CustomTemplateConfig\
    \ (OrchestratorMetadata extension)\n- TemplateRegistry (auto-discovery of custom\
    \ templates)\n- TemplateResolver (fallback chain: custom → parent → standard)\n\
    - ResponseSchema (CORTEX 4.0 v4.6.0)\n- ResponseRenderer (updated for custom sections)\n\
    \n#### Folder Organization Components (AR-010):\n- cortex-brain/tier0/ (CORTEX\
    \ CORE rules)\n- cortex-brain/tier1/ (business rules, tracking, AC registry)\n\
    - cortex-brain/tier2/ (response templates, engineering practices)\n- cortex-brain/tier3/\
    \ (knowledge patterns)\n- src/orchestrators/ (core, domain, custom subdirectories)\n\
    - src/orchestrators/response/ (template rendering)\n- src/orchestrators/registry/\
    \ (discovery)\n- src/infrastructure/ (audit, governance, state, execution)\n-\
    \ tests/ (unit, integration, fixtures)\n- scripts/ (admin, generate, tools)\n\n\
    ---\n\n## Summary: Total Requirements for SSOT\n\n### By Category:\n- **Architecture\
    \ Decisions:** 10 (AR-001 through AR-010)\n- **Functional Requirements:** 6 (FR-001\
    \ through FR-006)\n- **Non-Functional Requirements:** 4 (NFR-001 through NFR-004)\n\
    - **Governance Rules:** 25 SKULL rules (CORE-001 through CORE-025)\n- **Hallucination\
    \ Prevention:** 25 AC-IDs (AC-VALIDATE-001 through AC-EXPLAIN-005)\n- **Brittleness\
    \ Fixes:** 14 AC-IDs (AC-BRITTLE-001 through AC-BRITTLE-014)\n- **Total Identified:**\
    \ 84 items\n\n### By Status:\n- **Approved:** 20 (10 AR + 6 FR + 4 NFR)\n- **Governance:**\
    \ 25 SKULL rules\n- **Enhancement:** 25 hallucination prevention AC-IDs\n- **Bug\
    \ Fix:** 14 brittleness fix AC-IDs\n\n### By Phase (from implementation-roadmap.md):\n\
    - **Week 1 Pre-Tasks:** Folder structure, template schema (4 hours)\n- **Week\
    \ 1 Days 1-5:** Foundation (governance, audit, state, evidence, progress)\n- **Week\
    \ 2 Days 1-3:** Orchestrator framework\n- **Week 2 Day 4:** Custom templates (AR-009)\
    \ + hallucination validation (AC-VALIDATE-001 to 010)\n- **Week 3:** Safety and\
    \ scalability\n- **Week 4:** Production hardening\n- **Phase 3.5:** Folder migration\
    \ (parallel, non-blocking, 16 hours)\n- **Phase 2 Enhancement:** Hallucination\
    \ prevention (15 AC-IDs, +3.5 days)\n- **Phase 4 Enhancement:** Coherence validation\
    \ (10 AC-IDs, +5.25 days)\n\n---\n\n## Next: Phase B - YAML Document Creation\n\
    \nReady to create:\n1. roadmap.yaml (machine-readable SSOT with all 84 items)\n\
    2. roadmap.md (human-readable roadmap from YAML)\n\n"
