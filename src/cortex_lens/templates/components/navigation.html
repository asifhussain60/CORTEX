<!-- Navigation Styles -->
<style>
/* ============================================
   SIDEBAR NAVIGATION
   ============================================ */

.cortex-sidebar {
  position: fixed;
  left: 0;
  top: 0;
  height: 100vh;
  width: 280px;
  z-index: var(--z-fixed);
  display: flex;
  flex-direction: column;
  transition: transform var(--duration-normal) var(--easing-smooth);
}

.cortex-sidebar.collapsed {
  transform: translateX(-280px);
}

/* Sidebar Header */
.sidebar-header {
  padding: var(--spacing-6);
  border-bottom: 1px solid var(--color-border-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-container {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}

.logo-icon {
  flex-shrink: 0;
}

.logo-text {
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-bold);
  color: var(--color-text-primary);
  margin: 0;
}

.sidebar-toggle {
  background: transparent;
  border: none;
  color: var(--color-text-secondary);
  cursor: pointer;
  padding: var(--spacing-2);
  border-radius: var(--radius-sm);
  transition: var(--transition-colors);
  display: none; /* Show on mobile */
}

.sidebar-toggle:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--color-text-primary);
}

/* Sidebar Content */
.sidebar-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: var(--spacing-4) 0;
}

/* Navigation Tabs */
.nav-tabs {
  list-style: none;
  padding: 0;
  margin: 0;
  flex: 1;
}

.nav-item {
  margin: 0;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-4) var(--spacing-6);
  color: var(--color-text-secondary);
  text-decoration: none;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  transition: var(--transition-all);
  border-left: 3px solid transparent;
  position: relative;
}

.nav-link:hover {
  background: rgba(255, 255, 255, 0.03);
  color: var(--color-text-primary);
  border-left-color: var(--color-primary);
}

.nav-link.active {
  background: rgba(59, 130, 246, 0.1);
  color: var(--color-primary);
  border-left-color: var(--color-primary);
}

.nav-link.active .nav-icon {
  color: var(--color-primary);
}

.nav-icon {
  flex-shrink: 0;
  transition: var(--transition-colors);
}

.nav-text {
  flex: 1;
}

/* Sidebar Footer */
.sidebar-footer {
  padding: var(--spacing-4) var(--spacing-6);
  border-top: 1px solid var(--color-border-primary);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-3);
}

.version-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--font-size-sm);
}

.version-label {
  color: var(--color-text-tertiary);
}

.version-number {
  color: var(--color-text-secondary);
  font-weight: var(--font-weight-medium);
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  font-size: var(--font-size-sm);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-success);
  animation: pulse 2s ease-in-out infinite;
}

.status-dot.status-active {
  background: var(--color-success);
}

.status-dot.status-inactive {
  background: var(--color-text-quaternary);
  animation: none;
}

.status-text {
  color: var(--color-text-tertiary);
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

/* Mobile Overlay */
.mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: calc(var(--z-fixed) - 1);
  opacity: 0;
  transition: opacity var(--duration-normal) var(--easing-ease-in-out);
}

.mobile-overlay.active {
  display: block;
  opacity: 1;
}

/* ============================================
   RESPONSIVE - MOBILE
   ============================================ */

@media (max-width: 768px) {
  .cortex-sidebar {
    transform: translateX(-280px);
  }

  .cortex-sidebar.open {
    transform: translateX(0);
  }

  .sidebar-toggle {
    display: block;
  }
}

/* ============================================
   RESPONSIVE - TABLET
   ============================================ */

@media (min-width: 769px) and (max-width: 1024px) {
  .cortex-sidebar {
    width: 240px;
  }

  .cortex-sidebar.collapsed {
    transform: translateX(-240px);
  }
}
</style>

<!-- Navigation JavaScript -->
<script>
(function() {
  'use strict';

  // Navigation state
  const nav = {
    activeTab: 'overview',
    sidebarOpen: window.innerWidth >= 769,
    tabs: ['overview', 'architecture', 'metrics', 'files', 'tests', 'dependencies', 'conversation', 'settings']
  };

  // DOM elements
  const sidebar = document.getElementById('cortex-sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const mobileOverlay = document.getElementById('mobile-overlay');
  const navLinks = document.querySelectorAll('.nav-link');

  /**
   * Set active tab
   */
  function setActiveTab(tabName) {
    if (!nav.tabs.includes(tabName)) {
      console.warn(`Invalid tab name: ${tabName}`);
      return;
    }

    nav.activeTab = tabName;

    // Update nav link states
    navLinks.forEach(link => {
      const linkTab = link.dataset.tab;
      if (linkTab === tabName) {
        link.classList.add('active');
        link.setAttribute('aria-selected', 'true');
      } else {
        link.classList.remove('active');
        link.setAttribute('aria-selected', 'false');
      }
    });

    // Emit custom event
    document.dispatchEvent(new CustomEvent('cortex:tab-change', {
      detail: { tab: tabName }
    }));

    // Close sidebar on mobile after tab selection
    if (window.innerWidth < 769) {
      closeSidebar();
    }
  }

  /**
   * Toggle sidebar
   */
  function toggleSidebar() {
    nav.sidebarOpen = !nav.sidebarOpen;
    
    if (nav.sidebarOpen) {
      openSidebar();
    } else {
      closeSidebar();
    }
  }

  /**
   * Open sidebar
   */
  function openSidebar() {
    sidebar.classList.add('open');
    sidebar.classList.remove('collapsed');
    mobileOverlay.classList.add('active');
    nav.sidebarOpen = true;
  }

  /**
   * Close sidebar
   */
  function closeSidebar() {
    sidebar.classList.remove('open');
    if (window.innerWidth < 769) {
      sidebar.classList.add('collapsed');
    }
    mobileOverlay.classList.remove('active');
    nav.sidebarOpen = false;
  }

  /**
   * Handle nav link clicks
   */
  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const tabName = link.dataset.tab;
      setActiveTab(tabName);
      
      // Update URL hash
      window.location.hash = tabName;
    });
  });

  /**
   * Handle sidebar toggle click
   */
  if (sidebarToggle) {
    sidebarToggle.addEventListener('click', toggleSidebar);
  }

  /**
   * Handle mobile overlay click
   */
  if (mobileOverlay) {
    mobileOverlay.addEventListener('click', closeSidebar);
  }

  /**
   * Handle window resize
   */
  window.addEventListener('resize', () => {
    if (window.innerWidth >= 769) {
      sidebar.classList.remove('collapsed', 'open');
      mobileOverlay.classList.remove('active');
      nav.sidebarOpen = true;
    } else {
      if (!nav.sidebarOpen) {
        sidebar.classList.add('collapsed');
      }
    }
  });

  /**
   * Initialize from URL hash
   */
  function initFromHash() {
    const hash = window.location.hash.substring(1);
    if (hash && nav.tabs.includes(hash)) {
      setActiveTab(hash);
    } else {
      setActiveTab('overview');
    }
  }

  /**
   * Handle hash change
   */
  window.addEventListener('hashchange', initFromHash);

  // Initialize
  initFromHash();

  // Expose API
  window.CortexNav = {
    setActiveTab,
    toggleSidebar,
    openSidebar,
    closeSidebar,
    getActiveTab: () => nav.activeTab,
    isSidebarOpen: () => nav.sidebarOpen
  };

})();
</script>
