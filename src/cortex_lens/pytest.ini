# CORTEX Lens Pytest Configuration
# Test suite configuration with coverage and quality gates

[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Options
addopts =
    # Verbose output with summary
    -v
    --tb=short
    
    # Coverage options
    --cov=src/cortex_lens
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    
    # Coverage thresholds (fail if below)
    --cov-fail-under=80
    
    # Show slowest tests
    --durations=10
    
    # Strict markers (fail on unknown markers)
    --strict-markers
    
    # Show warnings
    -W default
    
    # Capture output (use -s to disable)
    --capture=no

# Markers (for categorizing tests)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, dependencies)
    slow: Slow tests (performance, stress testing)
    regression: Regression tests (baseline validation)
    browser: Browser tests (requires Playwright)
    performance: Performance benchmarks
    ast: AST parsing tests
    collector: Collector tests
    analyzer: Analyzer tests

# Coverage Options
[coverage:run]
source = src/cortex_lens
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Exclude patterns from coverage
exclude_lines =
    # Standard pragmas
    pragma: no cover
    
    # Defensive programming
    def __repr__
    raise AssertionError
    raise NotImplementedError
    
    # Type checking blocks
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    
    # Abstract methods
    @abstractmethod
    @abc.abstractmethod
    
    # Debug code
    if __name__ == .__main__.:
    if settings.DEBUG

[coverage:html]
directory = htmlcov

[coverage:json]
output = coverage.json
