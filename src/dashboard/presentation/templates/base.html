<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <h1>CORTEX Dashboard</h1>
            </div>
            
            {% if available_apps %}
            <div class="app-switcher">
                <select id="application-switcher" data-switcher="true" onchange="switchApplication(this.value)">
                    {% for app in available_apps %}
                    <option value="{{ app.id }}" {% if current_app_id == app.id %}selected{% endif %}>
                        {{ app.display_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="#" onclick="refreshDashboard(); return false;">Refresh</a>
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}
        <!-- Child templates override this block -->
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2024 CORTEX | Author: Asif Hussain</p>
    </footer>
    
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
