# CATEGORY 4: POLICY DECISION TESTS (20 tests)
# Validates GovernanceMerger tier precedence and conflict resolution
policy_decision_tests:
  - id: PD-001
    scenario: "Tier 0 rule conflicts with Tier 1 business rule"
    tier0_rule: "CORE-001: Max 500 lines per operation"
    tier1_rule: "BUSINESS-001: Allow 800 lines for critical hotfixes"
    expected_decision: "tier0_wins"
    validation_criteria:
      - detect_conflict: true
      - apply_tier_precedence: true
      - enforce_tier0: true
      - log_conflict_resolution: true
  
  - id: PD-002
    scenario: "Tier 1 business rule conflicts with Tier 2 company practice"
    tier1_rule: "BUSINESS-002: Use MongoDB for user data"
    tier2_rule: "COMPANY-001: Use PostgreSQL for all services"
    expected_decision: "tier1_wins"
    validation_criteria:
      - detect_conflict: true
      - apply_tier_precedence: true
      - enforce_tier1: true
      - log_conflict_resolution: true
  
  - id: PD-003
    scenario: "Tier 2 company practice conflicts with Tier 3 learned pattern"
    tier2_rule: "COMPANY-002: Use REST APIs for service communication"
    tier3_rule: "KNOWLEDGE-001: Prefer gRPC for high-performance services"
    expected_decision: "tier2_wins"
    validation_criteria:
      - detect_conflict: true
      - apply_tier_precedence: true
      - enforce_tier2: true
      - log_conflict_resolution: true
  
  - id: PD-004
    scenario: "Tier 0 TDD enforcement conflicts with business urgency"
    tier0_rule: "CORE-008: TDD required for all code"
    tier1_rule: "BUSINESS-003: Skip tests for demo MVP"
    expected_decision: "tier0_wins"
    validation_criteria:
      - detect_conflict: true
      - apply_tier_precedence: true
      - block_test_skip: true
      - log_conflict_resolution: true
  
  - id: PD-005
    scenario: "Tier 0 path portability conflicts with legacy system"
    tier0_rule: "CORE-005: No hardcoded paths"
    tier1_rule: "BUSINESS-004: Legacy system requires C:\\Data path"
    expected_decision: "tier0_wins"
    validation_criteria:
      - detect_conflict: true
      - apply_tier_precedence: true
      - enforce_portability: true
