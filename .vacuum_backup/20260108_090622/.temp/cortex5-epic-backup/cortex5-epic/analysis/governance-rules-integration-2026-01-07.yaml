  checked_rules:
    - existing_rule: "PLAN_FILE_ORGANIZATION"
      new_rule: "NO_SUMMARY_FILE_GENERATION"
      similarity_score: 0.75
      decision: "Keep both (different focus: organization vs blocking)"
      rationale: "PLAN_FILE_ORGANIZATION organizes all plan files into subfolders. NO_SUMMARY_FILE_GENERATION specifically blocks unwanted summary file creation. Complementary, not duplicate."
      
    - existing_rule: "SETUP_VERIFICATION"
      new_rule: "INCREMENTAL_AUTONOMOUS_EXECUTION"
      similarity_score: 0.3
      decision: "Keep both (different lifecycle phases)"
      rationale: "SETUP_VERIFICATION runs pre-execution (Phase -2). INCREMENTAL_AUTONOMOUS_EXECUTION runs during execution. Different concerns."
      
  no_duplicates_found: true
  
