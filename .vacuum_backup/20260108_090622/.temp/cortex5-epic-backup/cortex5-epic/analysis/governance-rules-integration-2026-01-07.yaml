# ==============================================================================
# NEW GOVERNANCE RULES ADDED
# ==============================================================================

new_rules:
  - rule_id: "INCREMENTAL_AUTONOMOUS_EXECUTION"
    category: "orchestration_lifecycle"
    severity: "blocked"
    priority: 8
    problem_solved: "Prevents token limit errors (HTTP 502) and server failures"
    user_pain_point: "Large orchestrator operations exceed token context window causing catastrophic failures"
    implementation_status: "rule_added_middleware_pending"
    middleware_required: "src/orchestrators/middleware/incremental_executor.IncrementalExecutor"
    integration_phase: "P00B"
    
  - rule_id: "NO_SUMMARY_FILE_GENERATION"
    category: "response_formatting"
    severity: "blocked"
    priority: 2
    problem_solved: "Prevents workspace clutter from unwanted summary files"
    user_pain_point: "User explicitly requested 'Do not create a summary document at the end'"
    user_feedback_reference: ".github/copilot/copilot-chats/chat01.md:15"
    implementation_status: "rule_added_middleware_pending"
    middleware_required: "src/orchestrators/middleware/file_creation_guard.FileCreationGuard"
    integration_phase: "P00B"
    blocked_patterns:
      - "*-summary.md"
      - "*-report.md"
      - "*-explanation.md"
      - "completion-*.md"
      - "executive-summary.md"
      - "EXECUTIVE-SUMMARY.md"
    
  - rule_id: "VISUAL_PROGRESS_RESPONSE_FORMAT"
    category: "response_formatting"
    severity: "blocked"
    priority: 5
    problem_solved: "Provides executive summaries with visual progress bars, no code snippets"
    user_pain_point: "Code snippets clutter responses and reduce readability"
    implementation_status: "rule_added_middleware_pending"
    middleware_required: "src/orchestrators/middleware/response_formatter.ResponseFormatter"
    template_reference: "cortex-brain/response-templates-v4.yaml:autonomous_execution_progress"
    integration_phase: "P00B"
    visual_format_reference: ".github/prompts/cortex-maintenance.prompt.md"

# ==============================================================================
# SCHEMA CHANGES
# ==============================================================================

schema_changes:
  - type: "category_addition"
    category: "response_formatting"
    rationale: "New category needed for response format enforcement rules"
    existing_categories:
      - "development_workflow"
      - "architecture_integrity"
      - "quality_gates"
      - "orchestration_lifecycle"
      - "security_privacy"
      - "portability"
    new_categories:
      - "response_formatting"

# ==============================================================================
# INTEGRATION STRATEGY
# ==============================================================================

integration_strategy:
  phase: "P00B - Critical Blocker Resolution"
  approach: "Incremental middleware implementation"
  
  step_1_middleware_creation:
    - name: "IncrementalExecutor"
      file: "src/orchestrators/middleware/incremental_executor.py"
      purpose: "Split large operations into <500 line increments with token monitoring"
      dependencies: ["src.utils.token_counter.TokenUsageMonitor"]
      
    - name: "FileCreationGuard"
      file: "src/orchestrators/middleware/file_creation_guard.py"
      purpose: "Block summary file creation matching blocklist patterns"
      dependencies: []
      
    - name: "ResponseFormatter"
      file: "src/orchestrators/middleware/response_formatter.py"
      purpose: "Format responses with visual progress bars, block code snippets"
      dependencies: ["cortex-brain/response-templates-v4.yaml"]
  
  step_2_hook_integration:
    - hook: "pre_execution"
      middleware: "IncrementalExecutor"
      priority: 8
      trigger: "orchestrator_execution_start"
      
    - hook: "pre_file_creation"
      middleware: "FileCreationGuard"
      priority: 2
      trigger: "file_creation_attempt"
      
    - hook: "post_execution"
      middleware: "ResponseFormatter"
      priority: 5
      trigger: "orchestrator_completion"
  
  step_3_validation:
    - test: "Test IncrementalExecutor prevents 502 errors on large operations"
    - test: "Test FileCreationGuard blocks summary file patterns"
    - test: "Test ResponseFormatter generates compliant responses"
    - test: "Integration test: Full orchestrator execution with all 3 rules"

