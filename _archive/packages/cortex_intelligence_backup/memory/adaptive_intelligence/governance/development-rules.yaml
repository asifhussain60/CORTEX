context: "development"
tier: "tier2"
environment: "development"

rules:
  - id: "DEVENV-001"
    name: "Fast Feedback"
    description: "Tests run <5 seconds per commit"
    severity: "medium"
    
  - id: "DEVENV-002"
    name: "Mock External Services"
    description: "Do not call real external services"
    severity: "high"
    
  - id: "DEVENV-003"
    name: "Local Database"
    description: "Use local/in-memory database for tests"
    severity: "high"

status: "DEFINED"
