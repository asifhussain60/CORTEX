# Sample Orchestrator Configuration - Maximum Complexity

name: "ComplexOrchestrator"
type: "core"
tier: 1
priority: 1  # Highest priority
capabilities:
  - "request_processing"
  - "event_emission"
  - "state_management"
  - "error_recovery"
  - "metrics_collection"
dependencies:
  - "EventBus"
  - "GitBackedRegistry"
  - "AuditDatabase"
event_subscriptions:
  - event_type: "user_request_received"
    handler: "handle_user_request"
    priority: 1
  - event_type: "orchestrator_error"
    handler: "handle_error"
    priority: 2
  - event_type: "state_changed"
    handler: "handle_state_change"
    priority: 3
mcp_tools:
  - "complex_tool_1"
  - "complex_tool_2"
  - "complex_tool_3"
health_check:
  enabled: true
  timeout_seconds: 10
  retry_count: 3
  backoff_seconds: 5
audit_trail:
  enabled: true
  ac_marker_prefix: "AC-COMPLEX"
  log_level: "DEBUG"
  include_stack_traces: true
resource_limits:
  max_concurrent_requests: 100
  max_memory_mb: 512
  max_execution_seconds: 300
recovery:
  auto_rollback: true
  checkpoint_interval_seconds: 60
  max_rollback_attempts: 3
