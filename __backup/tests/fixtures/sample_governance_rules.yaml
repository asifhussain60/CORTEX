governance:
  version: "1.0.0"
  last_updated: "2026-01-07"
  
rules:
  # Critical Rules - Must never be violated
  - id: TDD_ENFORCEMENT
    name: "TDD Enforcement"
    description: "Tests must fail before implementation"
    severity: CRITICAL
    category: DEVELOPMENT
    enabled: true
    enforcement:
      mode: STRICT
      action: BLOCK
    validation:
      type: test_failure_check
      required: true
      
  - id: HOLISTIC_DISCOVERY
    name: "Holistic Discovery"
    description: "Search before create (prevent duplication)"
    severity: CRITICAL
    category: DEVELOPMENT
    enabled: true
    enforcement:
      mode: STRICT
      action: BLOCK
    validation:
      type: search_audit
      required: true
      
  - id: GIT_ISOLATION
    name: "Git Isolation"
    description: "CORTEX code never commits to user repos"
    severity: CRITICAL
    category: SECURITY
    enabled: true
    enforcement:
      mode: STRICT
      action: BLOCK
    validation:
      type: git_repo_check
      required: true

  # High Priority Rules
  - id: PLANNING_ISOLATION
    name: "Planning Isolation"
    description: "Planning commands create plans ONLY, never implement"
    severity: HIGH
    category: EXECUTION
    enabled: true
    enforcement:
      mode: WARN
      action: LOG
    validation:
      type: command_audit
      required: true
      
  - id: AUDIT_LOGGING
    name: "Audit Logging Required"
    description: "All orchestrator operations must be audit logged"
    severity: HIGH
    category: COMPLIANCE
    enabled: true
    enforcement:
      mode: STRICT
      action: BLOCK
    validation:
      type: audit_presence_check
      required: true

# Exemptions for specific scenarios
exemptions:
  - rule_id: TDD_ENFORCEMENT
    context: "infrastructure_setup"
    reason: "Initial scaffolding doesn't require TDD"
    expiry: null
    
  - rule_id: HOLISTIC_DISCOVERY
    context: "new_feature_bootstrap"
    reason: "New features may not have existing code to discover"
    expiry: "2026-12-31"

# Compliance tracking
compliance:
  tracking_enabled: true
  report_frequency: "per_session"
  storage:
    type: sqlite
    path: "cortex-brain/database/compliance.db"
