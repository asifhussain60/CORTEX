[pytest]
# ==============================================================================
# CORTEX 6.0 Pytest Configuration
# ==============================================================================
# Author: Asif Hussain
# Copyright © 2025-2026 Asif Hussain. All rights reserved.
# ==============================================================================

# Test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts = -v --tb=short --strict-markers -ra

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    governance: marks tests as governance/compliance tests
    unit: marks tests as unit tests
    wip: marks tests as work in progress
    cross_platform: marks tests as cross-platform compatibility tests
    mac: marks tests that only run on macOS
    win: marks tests that only run on Windows
    ac_id: Acceptance Criteria ID marker for CORTEX 6.0 traceability
    phase1: Phase 1 (Foundation) tests - Dashboard backend API
    phase2: Phase 2 (Features) tests - Dashboard frontend SPA
    phase3: Phase 3 (Integration) tests - Dashboard orchestrator integration
    phase4: Phase 4 (Polish) tests - Dashboard deployment and testing

# Minimum pytest version
minversion = 7.0

# Timeout for individual tests (seconds)
timeout = 30

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
