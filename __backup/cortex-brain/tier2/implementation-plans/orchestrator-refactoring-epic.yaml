success_metrics:
  refactor_orchestrator:
    - "Correctly routes refactor requests to appropriate children (100% accuracy)"
    - "Reduces cyclomatic complexity by ≥20%"
    - "Increases test coverage by ≥10%"
    - "Eliminates duplicate code blocks (≥5 lines)"
    - "Enforces SOLID principles (zero violations)"
  
  housekeeping_orchestrator:
    - "Detects bugs from audit logs (≥90% accuracy)"
    - "Promotes valuable knowledge tier1 → tier2 (≥80% useful)"
    - "Removes duplicates and conflicts (≥95% success)"
    - "Identifies underutilized orchestrators (100% accuracy)"
    - "Runs on schedule without failures (99.9% reliability)"
  
  master_intelligence:
    - "Blocks direct orchestrator creation (100% enforcement)"
    - "Enforces YAML-first design (100% enforcement)"
    - "Detects pattern collisions (100% accuracy)"
    - "Validates hierarchy (100% correctness)"

risks:
  - risk: "Pattern collision with existing orchestrators"
    mitigation: "PatternCollisionDetector validates all new patterns"
    severity: "medium"
  
  - risk: "Performance degradation with many child orchestrators"
    mitigation: "Lazy loading + parallel execution where possible"
    severity: "low"
  
  - risk: "Knowledge absorption promotes incorrect knowledge"
    mitigation: "Strict promotion criteria + manual review for critical changes"
    severity: "medium"
  
  - risk: "Housekeeping deletes valuable files incorrectly"
    mitigation: "Dry-run mode + user confirmation + backup before deletion"
    severity: "high"

