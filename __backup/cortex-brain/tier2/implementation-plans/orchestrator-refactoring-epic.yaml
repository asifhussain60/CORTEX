# CORTEX Orchestrator Refactoring Implementation Plan
# Epic: Refactor Orchestrator System + Housekeeping + Master Intelligence
# Author: Asif Hussain
# Copyright © 2025-2026 Asif Hussain. All rights reserved.

metadata:
  epic_id: "cortex-orchestrator-refactoring-epic"
  version: "1.0.0"
  created: "2026-01-07"
  author: "Asif Hussain"
  status: "ready_for_execution"
  estimated_duration: "3-4 weeks"

executive_summary: |
  Comprehensive refactoring of CORTEX orchestrator architecture to implement:
  
  1. **Refactor Orchestrator System** (parent + 4 children)
     - Parent: Routes refactor requests to specialized children
     - Children: Code Quality, Architecture, Documentation, Tests
     - Intelligence: Parent decides child invocation strategy
  
  2. **Housekeeping Orchestrator** (autonomous maintenance)
     - Audit log analysis (bug detection)
     - Knowledge absorption (tier promotion)
     - Redundancy elimination (duplicates, conflicts)
     - Orchestrator optimization (performance, deprecation)
     - Scheduled execution (hourly, daily, weekly, monthly)
  
  3. **Master Orchestrator Intelligence Layer**
     - Prevents user mistakes (direct orchestrator creation blocked)
     - Manages orchestrator lifecycle (create, enhance, deprecate, delete)
     - Enforces YAML-first design (manifest before implementation)
     - Validates hierarchy (parent-child relationships)
     - Detects and resolves conflicts (pattern collisions)
  
  4. **YAML-First Architecture Enforcement**
     - All orchestrators use YAML manifests (no MD files)
     - Machine-readable configurations only
     - Standardized structure across all orchestrators

strategic_goals:
  autonomous_execution:
    description: "RAG/DAG execution via Python scripts (post-LLM handoff)"
    alignment: "100% - All new orchestrators Python-based autonomous"
    evidence:
      - "RefactorOrchestrator invokes children via registry"
      - "HousekeepingOrchestrator runs scheduled tasks autonomously"
      - "MasterIntelligence prevents manual orchestrator management"
  
  best_practices_enforcement:
    description: "Knowledge library integration and governance"
    alignment: "100% - Static analysis integrated, governance rules enforced"
    evidence:
      - "Refactor orchestrators enforce SOLID, type hints, docstrings"
      - "Housekeeping absorbs knowledge from execution logs"
      - "MasterIntelligence validates against brain-protection-rules.yaml"
  
  company_domain_boundaries:
    description: "Company knowledge overrides CORTEX intelligently"
    alignment: "100% - Housekeeping promotes tier1 → tier2 knowledge"
    evidence:
      - "Knowledge absorption with promotion criteria"
      - "Business domain update validation"
      - "Conflict resolution (CORTEX vs company knowledge)"
  
  token_optimization:
    description: "Minimize LLM calls, maximize pattern matching"
    alignment: "100% - YAML-first eliminates inline LLM generation"
    evidence:
      - "Machine-readable YAML manifests"
      - "Python implementation executes autonomously"
      - "No Markdown files requiring LLM parsing"

architecture:
  orchestrator_hierarchy:
    master_orchestrator:
      role: "Central routing hub + lifecycle manager"
      responsibilities:
        - "Route requests via pattern matching (90%+ success)"
        - "Manage orchestrator lifecycle (create, register, deprecate)"
        - "Enforce YAML-first design"
        - "Prevent user mistakes (block direct creation)"
        - "Validate hierarchy and dependencies"
    
    parent_orchestrators:
      examples:
        - "RefactorOrchestrator (coordinates refactoring children)"
        - "AnalysisOrchestrator (coordinates analysis children)"
      responsibilities:
        - "Parse and classify requests"
        - "Decide which children to invoke (sequence, parallel, conditional)"
        - "Track execution in todo list"
        - "Aggregate results from children"
    
    child_orchestrators:
      examples:
        - "CodeQualityRefactor (complexity, duplication)"
        - "ArchitectureRefactor (SOLID, design patterns)"
        - "DocumentationRefactor (docstrings, type hints)"
        - "TestRefactor (coverage, quality)"
      responsibilities:
        - "Execute specific function only"
        - "Return structured results"
        - "No coordination with siblings (parent handles)"
    
    autonomous_orchestrators:
      examples:
        - "HousekeepingOrchestrator (scheduled maintenance)"
        - "VacuumOrchestrator (filesystem cleanup)"
        - "PlanningOrchestrator (planning workflows)"
      responsibilities:
        - "Execute independently (no children)"
        - "Handle complete workflow end-to-end"
  
  yaml_first_design:
    principles:
      - "Manifest MUST exist before implementation"
      - "Manifest validated against schema"
      - "Implementation references manifest_path"
      - "Registry auto-generated from manifests"
    
    manifest_structure:
      schema_version: "5.0"
      orchestrator:
        name: "orchestrator_id"
        version: "semver"
        type: "autonomous | guided | wizard"
        parent_orchestrator_id: "optional_parent"
        description: "Clear purpose"
        implementation: "path.to.module"
        base_class: "BaseOrchestratorV4_1"
      
      phases:
        - id: int
          name: "PHASE_NAME"
          description: "What this phase does"
          activities: ["activity_1", "activity_2"]
          outputs: ["output_file_1.yaml"]
      
      capabilities: ["capability_1", "capability_2"]
      
      metrics:
        - name: "metric_name"
          type: "int | float | str"
          description: "Metric description"
      
      governance:
        rules_enforced: ["RULE_ID_1", "RULE_ID_2"]

phases:
  phase_0:
    name: "Manifest Creation"
    duration: "1 day"
    deliverables:
      - "refactor-orchestrator-v2.yaml ✅ CREATED"
      - "housekeeping-orchestrator.yaml ✅ CREATED"
      - "master-orchestrator-intelligence.yaml ✅ CREATED"
      - "refactor-code-quality.yaml ✅ CREATED"
      - "refactor-architecture.yaml ✅ CREATED"
      - "refactor-documentation.yaml ✅ CREATED"
      - "refactor-tests.yaml ✅ CREATED"
    status: "completed"
  
  phase_1:
    name: "Master Orchestrator Intelligence Implementation"
    duration: "3 days"
    dependencies: ["phase_0"]
    deliverables:
      - file: "src/orchestrators/master/orchestrator_intelligence.py"
        description: "Intelligence layer for orchestrator management"
        methods:
          - "analyze_request(user_request) -> OrchestratorDecision"
          - "check_consolidation(new_orch) -> ConsolidationRecommendation"
          - "validate_hierarchy(parent_id, child_id) -> bool"
          - "decide_child_invocation(parent, children) -> InvocationStrategy"
      
      - file: "src/orchestrators/middleware/file_creation_guard.py"
        description: "Block direct orchestrator file creation"
        hook: "pre_file_creation"
      
      - file: "src/orchestrators/middleware/manifest_validator.py"
        description: "Validate YAML-first enforcement"
        hook: "orchestrator_registration"
      
      - file: "src/orchestrators/middleware/registry_guard.py"
        description: "Protect registry integrity"
        hook: "file_modification"
      
      - file: "src/orchestrators/middleware/pattern_collision_detector.py"
        description: "Detect and prevent pattern conflicts"
        hook: "orchestrator_registration"
    
    tests:
      - "test_orchestrator_intelligence.py"
      - "test_file_creation_guard.py"
      - "test_manifest_validator.py"
      - "test_registry_guard.py"
      - "test_pattern_collision_detector.py"
    
    success_criteria:
      - "User cannot create orchestrators directly (blocked)"
      - "Manifest required before implementation (enforced)"
      - "Registry edits blocked (auto-regeneration works)"
      - "Pattern collisions detected and rejected"
  
  phase_2:
    name: "Refactor Orchestrator Parent Implementation"
    duration: "3 days"
    dependencies: ["phase_1"]
    deliverables:
      - file: "src/orchestrators/refactor/refactor_orchestrator_v2.py"
        description: "Parent refactor orchestrator"
        phases:
          - "ANALYSIS - Classify refactor request"
          - "ORCHESTRATION - Invoke child orchestrators"
          - "VALIDATION - Run static analysis"
          - "COMPLETION - Generate consolidated report"
      
      - file: "src/orchestrators/refactor/__init__.py"
        description: "Module initialization"
    
    tests:
      - "test_refactor_orchestrator_v2.py"
      - "test_refactor_request_classification.py"
      - "test_child_invocation_strategy.py"
    
    success_criteria:
      - "Correctly classifies refactor requests (code quality, architecture, docs, tests)"
      - "Invokes appropriate child orchestrators (sequential, parallel, conditional)"
      - "Tracks execution in todo list (state_db persistence)"
      - "Aggregates results from all children"
  
  phase_3:
    name: "Refactor Child Orchestrators Implementation"
    duration: "5 days"
    dependencies: ["phase_2"]
    deliverables:
      - file: "src/orchestrators/refactor/code_quality_refactor.py"
        description: "Code quality refactoring"
        capabilities:
          - "Cyclomatic complexity reduction"
          - "Duplicate code elimination"
          - "Naming standardization"
          - "Import optimization"
      
      - file: "src/orchestrators/refactor/architecture_refactor.py"
        description: "Architectural refactoring"
        capabilities:
          - "SOLID principles enforcement"
          - "Design pattern application"
          - "Dependency injection"
          - "Module restructuring"
      
      - file: "src/orchestrators/refactor/documentation_refactor.py"
        description: "Documentation improvements"
        capabilities:
          - "Docstring generation (Google style)"
          - "Type hint validation"
          - "README synchronization"
      
      - file: "src/orchestrators/refactor/test_refactor.py"
        description: "Test suite refactoring"
        capabilities:
          - "Coverage gap analysis"
          - "Test quality improvement"
          - "Fixture optimization"
    
    tests:
      - "test_code_quality_refactor.py"
      - "test_architecture_refactor.py"
      - "test_documentation_refactor.py"
      - "test_test_refactor.py"
    
    success_criteria:
      - "Each child orchestrator runs independently"
      - "Static analysis tools integrated (mypy, pylint, pydocstyle, black, isort)"
      - "Test suite passes (pytest 100%)"
      - "Coverage ≥80% unit, ≥60% integration"
  
  phase_4:
    name: "Housekeeping Orchestrator Implementation"
    duration: "4 days"
    dependencies: ["phase_1"]
    deliverables:
      - file: "src/orchestrators/housekeeping/housekeeping_orchestrator.py"
        description: "Autonomous CORTEX maintenance"
        phases:
          - "AUDIT_LOG_ANALYSIS - Bug detection from logs"
          - "KNOWLEDGE_ABSORPTION - Tier promotion"
          - "REDUNDANCY_ELIMINATION - Duplicates, conflicts"
          - "ORCHESTRATOR_OPTIMIZATION - Performance, deprecation"
          - "CACHE_CLEANUP - Clear expired caches"
          - "CONFLICT_RESOLUTION - Resolve knowledge/config conflicts"
          - "VALIDATION - SKULL tests, manifest validation"
      
      - file: "src/orchestrators/housekeeping/audit_analyzer.py"
        description: "Audit log pattern detection"
      
      - file: "src/orchestrators/housekeeping/knowledge_absorber.py"
        description: "Knowledge tier promotion logic"
      
      - file: "src/orchestrators/housekeeping/redundancy_eliminator.py"
        description: "Duplicate/conflict detection"
      
      - file: "src/orchestrators/housekeeping/orchestrator_optimizer.py"
        description: "Usage analysis and optimization"
    
    tests:
      - "test_housekeeping_orchestrator.py"
      - "test_audit_analyzer.py"
      - "test_knowledge_absorber.py"
      - "test_redundancy_eliminator.py"
      - "test_orchestrator_optimizer.py"
    
    success_criteria:
      - "Detects bugs from audit logs (repeated failures, timeouts)"
      - "Promotes valuable tier1 → tier2 knowledge"
      - "Removes duplicates and resolves conflicts"
      - "Identifies underutilized orchestrators (deprecation candidates)"
      - "Runs on schedule (daily, weekly, monthly)"
  
  phase_5:
    name: "Master Orchestrator Integration"
    duration: "2 days"
    dependencies: ["phase_2", "phase_3", "phase_4"]
    deliverables:
      - file: "cortex-brain/config/master-orchestrator.yaml"
        changes:
          - "Add refactor_orchestrator routing rule"
          - "Add housekeeping_orchestrator routing rule"
          - "Update priorities to avoid conflicts"
      
      - file: ".github/prompts/CORTEX.prompt.md"
        changes:
          - "Add refactor pattern to routing table"
          - "Add housekeeping pattern to routing table"
      
      - file: "cortex-brain/registry/orchestrators.json"
        changes:
          - "Register refactor_orchestrator"
          - "Register refactor_code_quality"
          - "Register refactor_architecture"
          - "Register refactor_documentation"
          - "Register refactor_tests"
          - "Register housekeeping_orchestrator"
    
    tests:
      - "test_master_orchestrator_routing.py"
      - "test_pattern_matching.py"
    
    success_criteria:
      - "Refactor requests route to RefactorOrchestrator"
      - "Housekeeping requests route to HousekeepingOrchestrator"
      - "No pattern collisions (all tests pass)"
  
  phase_6:
    name: "Integration Testing"
    duration: "2 days"
    dependencies: ["phase_5"]
    deliverables:
      - file: "tests/integration/test_refactor_workflow.py"
        description: "End-to-end refactor workflow tests"
      
      - file: "tests/integration/test_housekeeping_workflow.py"
        description: "End-to-end housekeeping workflow tests"
      
      - file: "tests/integration/test_orchestrator_lifecycle.py"
        description: "Orchestrator creation, registration, deprecation tests"
    
    success_criteria:
      - "Refactor workflow completes successfully (all phases)"
      - "Housekeeping workflow completes successfully (all phases)"
      - "Orchestrator lifecycle operations blocked/allowed correctly"
  
  phase_7:
    name: "Documentation & User Guidance"
    duration: "1 day"
    dependencies: ["phase_6"]
    deliverables:
      - file: "cortex-brain/documents/orchestrators/refactor-orchestrator-guide.md"
        description: "User guide for refactor orchestrator"
      
      - file: "cortex-brain/documents/orchestrators/housekeeping-orchestrator-guide.md"
        description: "User guide for housekeeping orchestrator"
      
      - file: "cortex-brain/documents/orchestrators/orchestrator-management-guide.md"
        description: "How to request new orchestrators (via MasterOrchestrator)"
    
    success_criteria:
      - "All orchestrators documented"
      - "Examples provided"
      - "User guidelines clear"

