################################################################################
## INTEGRATION WITH MasterOrchestrator
################################################################################

orchestrator_integration:
  
  when_user_says_align_prompts:
    - CORTEX.prompt.md clarifies intent
    - Delegates to: python3 -m src.main "align prompts to v3.0" --orchestrator master
    - MasterOrchestrator:
      1. Loads cortex-brain/tier2/prompt-alignment-governance.yaml
      2. Runs Phase 1: python3 scripts/validate-prompt-brittleness.py --audit
      3. For each prompt: applies standardized fixes from this plan
      4. Runs Phase 3: python3 scripts/validate-prompt-brittleness.py --validate-all
      5. Updates progress-tracker.json
      6. Triggers SyncOrchestrator
    - Returns structured result to user
    
  automation_hook:
    trigger: "After MasterOrchestrator state update"
    action: "Run validate-prompt-brittleness.py --validate-all"
    failure_handling: "Report brittleness issues to orchestrator for remediation"
    recovery: "Re-run prompt alignment Phase 1"

