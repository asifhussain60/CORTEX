      count: 5
      files: [CORTEX.prompt.md, cortex-brittleness-review, cortex-evidence-validator, cortex-plan-executor, cortex-search-and-fix]
      issue: "Found references to sync_plan_viewer_data.py or similar"
      fix: |
        Action: Add clarifying comment
        "These are EXAMPLES of what the orchestrator handles. Prompts do NOT call these directly.
         MasterOrchestrator calls all sync operations automatically after state updates."
      
    - category: "Response Format (Warning)"
      count: 6
      files: [All prompts]
      issue: "Response format may be non-standard"
      fix: |
        Action: Ensure each prompt includes response format guidance
        Add section: "## Response Format (MANDATORY)"
        Include: Reference to response-templates-v4.yaml
        Include: Example format with ✅ ⚙️ 🎯 ❌ ⚠️
      
    - category: "Hardcoded Paths (Warning)"
      count: 5
      files: [CORTEX-ALIGN, CORTEX, cortex-brittleness-review, cortex-plan-executor, cortex-search-and-fix]
      issue: "Found 6-15 hardcoded path references"
      fix: |
        Action: These are acceptable in CONTEXT/REFERENCE sections
        Verify: They appear only in examples, not in executable logic
        Verify: Logic sections have NO hardcoded paths
        Note: Having 6-15 matches is expected for documentation

  execution_steps:
    - step: 1
      description: "Add clarifying comments on sync commands"
