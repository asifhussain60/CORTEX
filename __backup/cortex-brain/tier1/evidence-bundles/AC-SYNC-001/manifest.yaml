notes: |
  This is a critical infrastructure component that prevents state drift across CORTEX.
  It runs silently on every turn, only displaying output when issues are detected.
  
  The sync score calculation is transparent:
    Sync Score = (sources_accurate / sources_total) × 100%
  
  Sources can have 4 statuses:
    - accurate: Current and valid
    - stale: Outdated, needs update
    - conflicting: Has internal conflicts
    - missing: File doesn't exist
  
  Discrepancy types have severity levels:
    - CRITICAL: Blocks operations immediately
    - HIGH: Strongly recommended to fix
    - MEDIUM: Should fix soon
    - LOW: Optional improvement
