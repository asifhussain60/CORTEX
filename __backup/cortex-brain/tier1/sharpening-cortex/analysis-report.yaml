# ==============================================================================
# RESET INFRASTRUCTURE
# ==============================================================================
reset_infrastructure:
  purpose: "Enable multiple test runs with clean slate"
  implementation: "cortex-brain/tier1/sharpening-cortex/reset-manager.py"
  
  reset_types:
    sql_seed:
      applications: ["BadMonolith"]
      mechanism: "HTTP endpoint triggers database reset"
      validation: "Row count check"
      
    ef_migration:
      applications: ["CleanSolidApp"]
      mechanism: "Entity Framework drop + recreate"
      validation: "Migration history check"
      
    git_checkout:
      applications: ["_Real"]
      mechanism: "Git hard reset to HEAD"
      validation: "Git diff shows no changes"
      
    docker_compose:
      applications: ["Cortex-Clean"]
      mechanism: "Docker volumes down/up"
      validation: "Container health check"
      
    test_fixtures:
      applications: ["Cortex-SDD"]
      mechanism: "pytest fixtures with autouse=True"
      validation: "Fixture teardown logs"
  
  reset_all_command:
    script: "sharpening-cortex/reset-all.ps1"
    execution_time: "< 60 seconds"
    validation: "All applications return to baseline state"

