# ==============================================================================
# APPLICATION CATALOG
# ==============================================================================
applications:
  
  # --------------------------------------------------------------------------
  # 1. BadMonolith - The Horror Show
  # --------------------------------------------------------------------------
  bad_monolith:
    name: "BadMonolith"
    type: "anti-pattern_showcase"
    description: "Intentionally horrible monolithic design demonstrating 28+ anti-patterns"
    path: "sharpening-cortex/BadMonolith/"
    
    technology_stack:
      backend:
        language: "C#"
        framework: ".NET 8 Minimal API"
        database: "SQL Server"
        key_file: "backend/Program.cs"
        lines_of_code: 143
      
      frontend:
        language: "TypeScript"
        framework: "Angular"
        key_file: "frontend/src/app/app.component.ts"
        lines_of_code: ~200
    
    anti_patterns:
      security:
        - id: "SEC-001"
          name: "Hardcoded Credentials"
          severity: "CRITICAL"
          location: "backend/Program.cs:10"
          example: "string connString = \"Server=localhost;Database=CortexBadDb;User Id=sa;Password=Your_password123;\""
          test_capability: "AC-TDD-005 (Security test generation)"
          
        - id: "SEC-002"
          name: "SQL Injection Vulnerability"
          severity: "CRITICAL"
          location: "backend/Program.cs:67"
          example: "cmd.CommandText = \"DELETE FROM Tasks WHERE Id = \" + id;"
          test_capability: "AC-TDD-005, AC-CRAWLER-003 (vulnerability detection)"
          
        - id: "SEC-003"
          name: "No Input Validation"
          severity: "HIGH"
          location: "backend/Program.cs:45-75"
          example: "No query param sanitization, accepts any input"
          test_capability: "AC-TDD-008 (Edge case testing)"
      
      architecture:
        - id: "ARCH-001"
          name: "God Class / God Method"
          severity: "HIGH"
          location: "backend/Program.cs:17-142"
          example: "Single endpoint handles GET/POST/PUT/DELETE with if-statements"
          test_capability: "AC-PLAN-006 (Refactoring roadmap)"
          
        - id: "ARCH-002"
          name: "No Separation of Concerns"
          severity: "HIGH"
          location: "backend/Program.cs"
          example: "HTTP, SQL, business logic all in Program.cs"
          test_capability: "AC-CRAWLER-003 (Architectural analysis)"
          
        - id: "ARCH-003"
          name: "Global Mutable State"
          severity: "MEDIUM"
          location: "backend/Program.cs:12"
          example: "List<Dictionary<string, object>> CachedTasks = new()"
          test_capability: "AC-PLAN-007 (State management refactor)"
      
      code_quality:
        - id: "QUAL-001"
          name: "No Error Handling"
          severity: "HIGH"
          location: "backend/Program.cs:45-142"
          example: "No try-catch, no validation, comment says 'just vibes'"
          test_capability: "AC-TDD-004 (RED→GREEN→REFACTOR quality)"
          
        - id: "QUAL-002"
          name: "No Logging"
          severity: "MEDIUM"
          location: "backend/Program.cs"
          example: "Zero logging throughout entire application"
          test_capability: "AC-AUDIT-003 (Logging standards)"
          
        - id: "QUAL-003"
          name: "No Tests"
          severity: "CRITICAL"
          location: "backend/"
          example: "No test project, no unit tests, no integration tests"
          test_capability: "AC-TDD-001 to AC-TDD-010 (Full TDD cycle)"
          
        - id: "QUAL-004"
          name: "Magic Strings"
          severity: "LOW"
          location: "backend/Program.cs:19"
          example: "action == \"seed\", action == \"list\", etc."
          test_capability: "AC-CRAWLER-002 (Code smell detection)"
      
      solid_violations:
        - id: "SOLID-001"
          name: "Single Responsibility Violation"
          severity: "HIGH"
          location: "backend/Program.cs:17-142"
          example: "MapMethods endpoint does routing, SQL, caching, HTTP"
          test_capability: "AC-PLAN-008 (SOLID refactoring)"
          
        - id: "SOLID-002"
          name: "Open/Closed Violation"
          severity: "MEDIUM"
          location: "backend/Program.cs"
          example: "Adding new action requires modifying existing method"
          test_capability: "AC-KNOW-002 (Domain patterns - strategy pattern)"
          
        - id: "SOLID-003"
          name: "Dependency Inversion Violation"
          severity: "HIGH"
          location: "backend/Program.cs"
          example: "Direct SqlConnection instantiation, no abstractions"
          test_capability: "AC-PLAN-008, AC-TDD-007 (Testability)"
      
      performance:
        - id: "PERF-001"
          name: "N+1 Query Problem"
          severity: "MEDIUM"
          location: "backend/Program.cs:48-55"
          example: "No eager loading, potential for excessive queries"
          test_capability: "AC-CRAWLER-005 (Performance analysis)"
          
        - id: "PERF-002"
          name: "No Connection Pooling"
          severity: "LOW"
          location: "backend/Program.cs:24"
          example: "New connection per request"
          test_capability: "AC-PLAN-006 (Performance optimization)"
    
    frontend_anti_patterns:
      - id: "FE-001"
        name: "God Component"
        severity: "HIGH"
        location: "frontend/src/app/app.component.ts"
        example: "All logic in single component"
        test_capability: "AC-CRAWLER-004 (Angular analyzer)"
        
      - id: "FE-002"
        name: "No Service Layer"
        severity: "HIGH"
        location: "frontend/src/app/"
        example: "HTTP calls directly in component"
        test_capability: "AC-PLAN-008 (Frontend architecture)"
        
      - id: "FE-003"
        name: "No Models/Interfaces"
        severity: "MEDIUM"
        location: "frontend/src/app/"
        example: "Using 'any' types throughout"
        test_capability: "AC-TDD-006 (Type safety)"
    
    reset_mechanism:
      type: "sql_seed"
      script: "backend/Program.cs:seed action"
      commands:
        - "curl http://localhost:5000/api/tasks?action=seed"
      validation: "Check Tasks table has exactly 2 rows"
    
    test_scenarios:
      - scenario: "TDD Security Test Generation"
        ac_ids: ["AC-TDD-005", "AC-TDD-008"]
        input: "BadMonolith backend/Program.cs"
        expected_output: "SQL injection tests, hardcoded credential tests"
        
      - scenario: "Architecture Refactoring Plan"
        ac_ids: ["AC-PLAN-006", "AC-PLAN-008"]
        input: "BadMonolith backend/"
        expected_output: "Layered architecture migration plan (Controllers → Services → Repositories)"
        
      - scenario: "Crawler Vulnerability Detection"
        ac_ids: ["AC-CRAWLER-003"]
        input: "BadMonolith/"
        expected_output: "Knowledge graph showing SQL injection attack surface"

  # --------------------------------------------------------------------------
  # 2. CleanSolidApp - The Reference Implementation
  # --------------------------------------------------------------------------
  clean_solid_app:
    name: "CleanSolidApp"
    type: "best_practice_showcase"
    description: "Same domain as BadMonolith but properly architected"
    path: "sharpening-cortex/CleanSolidApp/"
    
    technology_stack:
      backend:
        language: "C#"
        framework: "ASP.NET Core Web API"
        orm: "Entity Framework Core"
        architecture: "Layered (API → Application → Domain → Infrastructure)"
      
      frontend:
        language: "TypeScript"
        framework: "Angular"
        architecture: "Service-based with components"
    
    good_practices:
      - id: "GOOD-001"
        name: "Repository Pattern"
        location: "backend/Application/Interfaces/ITaskRepository.cs"
        benefit: "Abstraction over data access"
        test_capability: "AC-TDD-007 (Testability with mocks)"
        
      - id: "GOOD-002"
        name: "Dependency Injection"
        location: "backend/API/Program.cs"
        benefit: "Loose coupling, testability"
        test_capability: "AC-PLAN-008 (SOLID compliance)"
        
      - id: "GOOD-003"
        name: "Separation of Concerns"
        location: "backend/"
        benefit: "Clear layer boundaries"
        test_capability: "AC-CRAWLER-003 (Architecture validation)"
        
      - id: "GOOD-004"
        name: "Service Layer"
        location: "frontend/src/app/services/"
        benefit: "Centralized HTTP logic"
        test_capability: "AC-TDD-004 (Unit testing services)"
    
    reset_mechanism:
      type: "ef_migration"
      commands:
        - "cd backend && dotnet ef database drop --force"
        - "dotnet ef database update"
        - "curl http://localhost:5001/api/tasks/seed"
      validation: "EF migrations recreate clean state"
    
    test_scenarios:
      - scenario: "Before/After Comparison"
        ac_ids: ["AC-PLAN-006"]
        input: "Compare BadMonolith vs CleanSolidApp"
        expected_output: "Migration plan showing transformation steps"
        
      - scenario: "Crawler Architecture Detection"
        ac_ids: ["AC-CRAWLER-003", "AC-GRAPH-002"]
        input: "CleanSolidApp backend/"
        expected_output: "Knowledge graph showing layered architecture pattern"

  # --------------------------------------------------------------------------
  # 3. _Real - Production Legacy Applications
  # --------------------------------------------------------------------------
  real_legacy:
    name: "_Real"
    type: "production_legacy"
    description: "Real-world legacy applications from actual projects"
    path: "sharpening-cortex/_Real/"
    
    applications:
      - name: "RA-Domain"
        description: "Healthcare reimbursement domain model (sanitized)"
        challenges: ["Complex domain logic", "HIPAA compliance", "Legacy patterns"]
        test_capability: "AC-SAN-001 to AC-SAN-004 (Data sanitization)"
        
      - name: "payment-api-specs"
        description: "OpenAPI specs for payment processor"
        challenges: ["API contract validation", "Version management"]
        test_capability: "AC-PLAN-007 (API modernization)"
        
      - name: "payment-processor-modernized"
        description: "Partially refactored payment processor"
        challenges: ["Mid-modernization state", "Mixed patterns"]
        test_capability: "AC-PLAN-006 (Incremental modernization)"
    
    sanitization:
      mapping_file: "sharpening-cortex/sanitization-mappings.json"
      transformations: 39
      categories:
        - "Healthcare → Generic compliance"
        - "PHI → PII"
        - "HIPAA → GDPR"
        - "Domain-specific → Generic payment"
      test_capability: "AC-SAN-002 (Pattern-based sanitization)"
    
    reset_mechanism:
      type: "git_checkout"
      commands:
        - "cd _Real && git checkout HEAD -- ."
      validation: "Git status shows no modified files"
    
    test_scenarios:
      - scenario: "Sanitization Validation"
        ac_ids: ["AC-SAN-001", "AC-SAN-002"]
        input: "_Real/RA-Domain with sanitization-mappings.json"
        expected_output: "All PHI terms replaced with PII equivalents"

  # --------------------------------------------------------------------------
