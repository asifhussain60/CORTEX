acceptance_criteria_entries:

  - id: AC-BRITTLE-001
    phase: Phase 9.4
    category: Database Integrity
    priority: CRITICAL
    title: Enable SQLite WAL Mode for Governance Database
    description: |
      Enable Write-Ahead Logging (WAL) mode on governance.db to prevent
      data corruption under concurrent writes. Current mode is 'delete'
      (default), which causes data loss on power failures during writes.
      
      CORE-006 setup verification must validate database integrity
      by checking PRAGMA journal_mode and enabling WAL mode automatically.
    status: planned
    implementation_status: PLANNED
    test_coverage: 0/3
    tests_passing: 0
    tests_total: 3
    pass_rate: 0/3 (0%)
    verification_status: not_verified
    evidence: tests/infrastructure/test_database_wal_mode.py
    dependencies:
      - CORE-006
      - AC-SYNC-001
    owner: Infrastructure Team
    duration_hours: 0.25
    
