  - risk: "Category assignment conflicts"
    impact: "MEDIUM"
    mitigation: "Allow multi-category inheritance"
    detection: "Audit logs show category resolution path"
  
  - risk: "Testing overhead"
    impact: "MEDIUM"
    mitigation: "Generate test matrix from orchestrator registry automatically"
