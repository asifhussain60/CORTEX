# ==============================================================================
# PHASE DESCRIPTION
# ==============================================================================
description:
  summary: |
    Establishes THE DEFAULT WORKING MECHANISM at the core of CORTEX operations.
    MasterOrchestrator is IN CHARGE: evaluates requests, creates tasks, executes.
    This is the central controller that all user requests flow through.
  
  why_second: |
    Phase 2 depends on Phase 1 infrastructure:
    - MasterOrchestrator logs to audit (AC-AUDIT-*)
    - TodoManager persists to state (AC-STATE-*)
    - TDD-Master enforces governance (AC-GOV-*)
    - All generate Evidence Bundles (AC-EVIDENCE-*)
    Without Foundation, orchestration cannot reliably operate.
  
  critical_path: |
    This is THE CORE WORKFLOW:
    Request → GovernanceMerger → MasterOrchestrator → TodoManager → Execute
    All other orchestrators are features that plug into this pipeline.
  
  dependencies:
    - "Phase 1 (Foundation Enhancement)"
  blocks_phases: [3, 4]

