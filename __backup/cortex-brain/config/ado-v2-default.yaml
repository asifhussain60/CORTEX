# ADO Orchestrator v2 - Default Configuration
schema_version: "5.0"

orchestrator:
  name: "Azure DevOps Orchestrator v2"
  version: "2.0.0"
  type: "autonomous"
  description: "Azure DevOps work item generation with AI-powered requirements decomposition"

# ADO connection settings
ado:
  organization: ""  # Set via environment or at runtime
  project: ""       # Set via environment or at runtime
  pat_token: ""     # Set via environment variable ADO_PAT

# Work item generation
work_items:
  default_area_path: ""
  default_iteration_path: ""
  auto_assign: false
  estimate_story_points: true

# AI decomposition
decomposition:
  enabled: true
  max_story_points_per_story: 13
  max_tasks_per_story: 8
  generate_acceptance_criteria: true

# Database configuration
database:
  path: "cortex-brain/database/planning_state.db"
  auto_create: true

# Logging configuration
logging:
  level: "INFO"
  format: "structured"
