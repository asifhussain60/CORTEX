# ==============================================================================
# CORTEX INTELLIGENCE LAYER - MISTAKE PREVENTION RULES
# ==============================================================================
# Purpose: Intelligent validation rules for user mistake prevention
# Feature: feat04-core-orchestration Phase 1
# Version: 1.0.0
# Created: 2026-01-08
# ==============================================================================

schema_version: '1.0'
category: intelligence_middleware
enabled: true

metadata:
  feature: feat04-core-orchestration
  created_by: "feat04 Phase 1 Task 1.1"
  created_at: "2026-01-08T03:40:00Z"
  rule_count: 8

# ==============================================================================
# INTELLIGENCE RULES
# ==============================================================================
rules:
  # ----------------------------------------------------------------------------
  # IR-001: Planning vs Implementation Separation
  # ----------------------------------------------------------------------------
  - id: IR-001
    name: "Planning vs Implementation Separation"
    category: planning_vs_implementation
    severity: error
    enabled: true
    description: |
      Planning commands create plans only, never implement.
      Implementation commands execute plans, never plan.
    
    condition:
      orchestrator: "planning_orchestrator"
      params_contain_any: ["implement", "write code", "create file", "execute"]
    
    message: "Planning commands create plans only. Use implementation orchestrator to execute."
    
    suggestion: "Run: 'implement plan [plan-id]' to execute the plan"
    
    examples:
      pass:
        - "plan user authentication system"
        - "create plan for data migration"
      fail:
        - "plan and implement user authentication"
        - "create plan then write the code"

  # ----------------------------------------------------------------------------
  # IR-002: Missing Test Infrastructure
  # ----------------------------------------------------------------------------
  - id: IR-002
    name: "Missing Test Infrastructure"
    category: missing_prerequisites
    severity: warning
    enabled: true
    description: |
      Test infrastructure must exist before implementation.
      TDD requires tests first.
    
    condition:
      orchestrator_contains: "implement"
      context_missing: "test_framework_exists"
    
    message: "Test infrastructure not detected. TDD requires tests first."
    
    suggestion: "Run: 'setup tests' or verify tests/ folder exists with pytest.ini"
    
    check:
      paths_exist:
        - "tests/"
        - "tests/conftest.py"
        - "pytest.ini"

  # ----------------------------------------------------------------------------
  # IR-003: Duplicate Operation Detection
  # ----------------------------------------------------------------------------
  - id: IR-003
    name: "Duplicate Operation Detection"
    category: duplicate_operations
    severity: warning
    enabled: true
    description: |
      Detect when user requests operation that was recently completed.
      Prevents redundant work.
    
    condition:
      recent_operations_contains: "same_operation"
      time_threshold_minutes: 30
    
    message: "This operation was completed {minutes_ago} minutes ago."
    
    suggestion: "Review recent work or clarify if this is intentional repetition"
    
    metadata:
      cache_duration_minutes: 30
      similarity_threshold: 0.85

  # ----------------------------------------------------------------------------
  # IR-004: Unsafe Destructive Operations
  # ----------------------------------------------------------------------------
  - id: IR-004
    name: "Unsafe Destructive Operations"
    category: unsafe_operations
    severity: warning
    enabled: true
    description: |
      Warn about destructive operations without explicit confirmation.
      Prevents accidental data loss.
    
    condition:
      operation_type: "destructive"
      no_confirmation_flag: true
    
    destructive_operations:
      - "delete"
      - "drop"
      - "truncate"
      - "remove"
      - "vacuum"
      - "cleanup"
    
    message: "Destructive operation detected: {operation}. This may cause data loss."
    
    suggestion: "Add --confirm flag or review operation scope carefully"

  # ----------------------------------------------------------------------------
  # IR-005: Context Mismatch Detection
  # ----------------------------------------------------------------------------
  - id: IR-005
    name: "Context Mismatch Detection"
    category: context_mismatch
    severity: error
    enabled: true
    description: |
      Detect when operation targets wrong repository or feature.
      Prevents cross-contamination.
    
    condition:
      context_mismatch: true
    
    checks:
      - name: "wrong_repository"
        detect: "operation targets different repo than current workspace"
      - name: "wrong_feature"
        detect: "operation references feature not in current branch"
      - name: "wrong_phase"
        detect: "operation jumps phases without completing current"
    
    message: "Context mismatch: {mismatch_type}"
    
    suggestion: "Verify workspace, branch, and current position in tracker"

  # ----------------------------------------------------------------------------
  # IR-006: YAML-First Enforcement
  # ----------------------------------------------------------------------------
  - id: IR-006
    name: "YAML-First Enforcement"
    category: yaml_first
    severity: error
    enabled: true
    description: |
      Enforce YAML-first for all configurations and plans.
      Markdown plan files are prohibited (CORE-018).
    
    condition:
      file_creation: true
      file_pattern_matches_any:
        - "*-PLAN.md"
        - "*-plan.md"
        - "*-implementation-plan.md"
        - "cortex-brain/documents/planning/**/*-design.md"
    
    message: "YAML-first violation: Markdown plan files are prohibited (CORE-018)"
    
    suggestion: |
      Use YAML for plans and configs:
      - Track tasks in 00-TODO-CONTINUITY-TRACKER.yaml
      - Use cortex-brain/config/*.yaml for configurations
      - Architecture docs (optional) go in cortex-brain/documents/architecture/
    
    blocked_patterns:
      - "*-PLAN.md"
      - "*-plan.md"
      - "*-implementation-plan.md"
    
    allowed_patterns:
      - "README.md"
      - "CONTINUATION-PROMPT.md"
      - "cortex-brain/documents/architecture/**/*.md"

  # ----------------------------------------------------------------------------
  # IR-007: Missing Governance Check
  # ----------------------------------------------------------------------------
  - id: IR-007
    name: "Missing Governance Check"
    category: governance_integration
    severity: warning
    enabled: true
    description: |
      Ensure governance rules are checked before execution.
      Prevents SKULL rule violations.
    
    condition:
      orchestrator_execution: true
      governance_check_skipped: true
    
    message: "Governance rules not checked. This may violate SKULL rules."
    
    suggestion: "Enable governance integration in orchestrator configuration"
    
    integration:
      governance_merger: "src.orchestrators.core.governance_merger.GovernanceMerger"
      check_timing: "pre_execution"

  # ----------------------------------------------------------------------------
  # IR-008: TODO Dependency Blocking
  # ----------------------------------------------------------------------------
  - id: IR-008
    name: "TODO Dependency Blocking"
    category: todo_dependencies
    severity: error
    enabled: true
    description: |
      Block execution if TODO dependencies are not met.
      Enforces proper DAG execution order.
    
    condition:
      has_parent_todo: true
      todo_status: "BLOCKED"
    
    message: "Cannot execute: TODO {todo_id} is BLOCKED by unmet dependencies"
    
    suggestion: "Complete dependency TODOs first: {blocked_by}"
    
    integration:
      todo_orchestrator: "src.orchestrators.core.todo_orchestrator.TodoOrchestrator"
      check_method: "read_todo"

# ==============================================================================
# VALIDATION RESULT STRUCTURE
# ==============================================================================
validation_result:
  structure:
    is_valid: boolean
    errors: list[string]
    warnings: list[string]
    suggestions: list[string]
    metadata: dict
  
  example:
    is_valid: false
    errors:
      - "Planning commands create plans only. Use implementation orchestrator."
    warnings:
      - "Test infrastructure not detected. TDD requires tests first."
    suggestions:
      - "Run: 'implement plan [plan-id]' to execute the plan"
      - "Run: 'setup tests' or verify tests/ folder exists"
    metadata:
      rules_evaluated: 8
      rules_triggered: 2
      execution_time_ms: 3.5

# ==============================================================================
# PERFORMANCE TARGETS
# ==============================================================================
performance:
  validation_overhead_ms: 10
  rule_evaluation_ms: 5
  max_rules: 50
  cache_enabled: true
  cache_ttl_minutes: 30

# ==============================================================================
# INTEGRATION POINTS
# ==============================================================================
integration:
  governance_merger:
    enabled: true
    path: "src.orchestrators.core.governance_merger.GovernanceMerger"
    method: "generate_unified_instruction_set"
  
  todo_orchestrator:
    enabled: true
    path: "src.orchestrators.core.todo_orchestrator.TodoOrchestrator"
    method: "read_todo"
  
  audit_logger:
    enabled: true
    log_violations: true
    category: "INTELLIGENCE_VALIDATION"
    correlation_prefix: "INTEL"
