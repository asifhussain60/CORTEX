# Cleanup Orchestrator v2 - Default Configuration
schema_version: "5.0"

orchestrator:
  name: "Cleanup System v2"
  version: "2.0.0"
  type: "autonomous"
  description: "Intelligent workspace cleanup with selective modes"

# Cleanup modes
modes:
  cache:
    enabled: true
    targets:
      - "__pycache__"
      - ".pytest_cache"
      - ".mypy_cache"
      - "node_modules/.cache"
      - ".next/cache"
  
  logs:
    enabled: true
    targets:
      - "*.log"
      - "logs/**/*.log"
      - "cortex-lens-output/**/*.log"
    max_age_days: 7
  
  artifacts:
    enabled: true
    targets:
      - "*.pyc"
      - "*.pyo"
      - ".DS_Store"
      - "Thumbs.db"
    
  git:
    enabled: true
    clean_untracked: false  # Safety: don't delete untracked by default
    prune_branches: false    # Safety: don't prune by default
  
  full:
    enabled: true
    includes_all_modes: true

# Safety settings
safety:
  dry_run_by_default: false
  require_confirmation: false
  backup_before_delete: false
  protected_patterns:
    - ".git/**"
    - "cortex-brain/**/*.db"
    - "cortex-brain/tier*/**"

# Database configuration
database:
  path: "cortex-brain/database/planning_state.db"
  auto_create: true

# Logging configuration
logging:
  level: "INFO"
  format: "structured"
