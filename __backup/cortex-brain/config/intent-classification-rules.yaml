# Intent Classification Rules - Planning vs Task Breakdown
# Version: 1.0.0 | Created: 2026-01-05 | Part of Epic P01
# Purpose: Define clear routing rules for PLANNING (orchestrator) vs TASK_BREAKDOWN (agent)

# CRITICAL ARCHITECTURE RULE:
# Planning Orchestrator expects autonomous terminal execution (python3 -m src.main)
# WorkPlanner agent handles simple task breakdowns within agent framework
# NEVER nest orchestrator calls inside agents (architectural violation)

classification_rules:
  # PLANNING Intent - Routes to Planning Orchestrator (autonomous Python)
  planning_intent:
    description: "Full feature planning with architecture review, threat modeling, TDD integration, and progress tracking"
    execution_mode: autonomous_orchestrator
    route_to: PlanningOrchestrator
    invocation: "python3 -m src.main 'plan {feature}'"
    
    triggers:
      keywords:
        - "plan"
        - "plan feature"
        - "create plan"
        - "plan for"
        - "generate plan"
        - "planning"
        - "epic"
        - "remediation plan"
        - "proceed with plan"
        - "execute plan"
        - "run plan"
      
      patterns:
        - "plan .+ feature"
        - "create (a |an )?plan"
        - "plan for .+"
        - "planning .+"
        - "proceed with .+ plan"
      
      context_indicators:
        - "architecture"
        - "threat model"
        - "security"
        - "authentication"
        - "authorization"
        - "api"
        - "integration"
        - "deployment"
        - "migration"
        - "user story"
        - "feature request"
        - "autonomous"
        - "remediation"
    
    features_enabled:
      - "Architectural review (REQ-003)"
      - "Interactive DoR refinement (REQ-002)"
      - "Threat modeling integration (REQ-007)"
      - "Visual progress bars"
      - "Git checkpoints"
      - "TDD integration"
      - "manage_todo_list tracking"
      - "Auto-refreshing HTML viewer"
    
    response_format: "response-templates-v4.yaml:autonomous_execution_progress"
  
  # TASK_BREAKDOWN Intent - Routes to WorkPlanner Agent
  task_breakdown_intent:
    description: "Quick task decomposition with time estimates (no orchestrator features)"
    execution_mode: agent_framework
    route_to: WorkPlannerAgent
    invocation: "agent_executor.execute(AgentType.PLANNER, request)"
    
    triggers:
      keywords:
        - "estimate"
        - "breakdown"
        - "how long"
        - "time estimate"
        - "effort"
        - "decompose"
        - "split tasks"
        - "task list"
      
      patterns:
        - "estimate .+"
        - "how long .+"
        - "break down .+"
        - "decompose .+"
        - "split .+ into tasks"
      
      context_indicators:
        - "hours"
        - "days"
        - "effort estimation"
        - "velocity"
        - "quick estimate"
        - "rough estimate"
    
    features_enabled:
      - "Complexity analysis"
      - "Pattern-based task templates (Tier 2)"
      - "Velocity-aware time estimation (Tier 3)"
      - "Dependency identification"
      - "Risk assessment"
    
    features_disabled:
      - "No architectural review"
      - "No threat modeling"
      - "No git checkpoints"
      - "No progress tracking"
      - "No TDD integration"
    
    response_format: "Standard agent response (message + task list)"

# Routing Decision Tree
routing_decision_tree:
  step_1:
    check: "Does message contain planning keywords?"
    if_yes: "Route to PLANNING intent"
    if_no: "Continue to step 2"
  
  step_2:
    check: "Does message contain task breakdown keywords?"
    if_yes: "Route to TASK_BREAKDOWN intent"
    if_no: "Continue to step 3"
  
  step_3:
    check: "Does message mention architecture/security/threat model?"
    if_yes: "Route to PLANNING intent (enhanced features needed)"
    if_no: "Continue to step 4"
  
  step_4:
    check: "Is intent explicitly 'plan' or 'feature'?"
    if_yes: "Route to PLANNING intent"
    if_no: "Default to TASK_BREAKDOWN (simple estimate)"

# Priority Rules (First Match Wins)
priority_rules:
  - rule: "If message contains 'plan' + ('feature'|'epic'|'remediation'), ALWAYS route to Planning Orchestrator"
    priority: 1
    confidence: 1.0
  
  - rule: "If message contains 'proceed with' + 'plan', route to Planning Orchestrator (resume existing plan)"
    priority: 2
    confidence: 1.0
  
  - rule: "If message contains 'estimate' or 'how long', route to WorkPlanner agent"
    priority: 3
    confidence: 0.9
  
  - rule: "If intent='plan' but message contains 'estimate', route to WorkPlanner (simple breakdown requested)"
    priority: 4
    confidence: 0.8
  
  - rule: "Default: If intent='plan', route to Planning Orchestrator"
    priority: 5
    confidence: 0.7

# Examples
examples:
  planning_orchestrator:
    - "plan authentication feature"
    - "create a plan for user management"
    - "plan API integration with threat model"
    - "proceed with epic remediation plan"
    - "plan migration to microservices"
    - "generate plan for payment system"
  
  work_planner_agent:
    - "estimate time for auth module"
    - "break down login feature into tasks"
    - "how long will API integration take?"
    - "quick estimate for user profile page"
    - "decompose search functionality"

# Anti-Patterns (FORBIDDEN)
anti_patterns:
  - pattern: "WorkPlanner agent calling PlanningOrchestrator"
    reason: "Architectural violation - orchestrators expect autonomous terminal execution"
    impact: "Hangs on interactive prompts, 'BUG' errors, incomplete plans"
    fix: "Route directly to orchestrator via MasterOrchestrator"
  
  - pattern: "Nesting orchestrator calls inside agents"
    reason: "Breaks autonomous execution model"
    impact: "Unpredictable behavior, missing features, poor UX"
    fix: "Orchestrators must be invoked at entry point (src/main.py)"
  
  - pattern: "Agent framework handling full feature planning"
    reason: "Missing enhanced features (architecture review, threat modeling, progress tracking)"
    impact: "Incomplete plans, no TDD integration, no git checkpoints"
    fix: "Use Planning Orchestrator for comprehensive planning"

# Implementation Notes
implementation:
  intent_router_changes:
    file: "src/cortex_agents/intent_router.py"
    method: "_classify_intent()"
    logic: "Check planning keywords → return IntentType.PLANNING if matched, else IntentType.TASK_BREAKDOWN"
  
  master_orchestrator_changes:
    file: "src/orchestrators/master/master_orchestrator.py"
    method: "route_request()"
    logic: "If intent=PLANNING, invoke PlanningOrchestrator directly, bypass agent_executor"
  
  work_planner_changes:
    file: "src/cortex_agents/work_planner/agent.py"
    method: "__init__()"
    change: "Set self._planning_orchestrator = None permanently (disable nested orchestrator)"
    method: "_should_use_orchestrator()"
    change: "Always return False (force simple breakdown mode)"

# Validation Tests
validation:
  test_planning_routing:
    input: "plan authentication feature"
    expected_route: PlanningOrchestrator
    expected_invocation: "python3 -m src.main 'plan authentication feature'"
  
  test_task_breakdown_routing:
    input: "estimate time for auth module"
    expected_route: WorkPlannerAgent
    expected_invocation: "agent_executor.execute(AgentType.PLANNER, request)"
  
  test_ambiguous_planning:
    input: "plan with estimate"
    expected_route: PlanningOrchestrator
    reason: "'plan' keyword takes precedence"
  
  test_ambiguous_breakdown:
    input: "estimate for plan implementation"
    expected_route: WorkPlannerAgent
    reason: "'estimate' keyword takes precedence"
