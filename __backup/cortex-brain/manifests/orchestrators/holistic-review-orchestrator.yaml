# Holistic Review Orchestrator Configuration
# Automated architectural analysis at phase transitions
#
# Purpose: Extract patterns, identify reuse opportunities, and generate
#          actionable recommendations from completed migrations.
#
# Author: Asif Hussain
# Copyright © 2025-2026 Asif Hussain. All rights reserved.

orchestrator:
  id: "holistic_review_orchestrator"
  name: "Holistic Review Orchestrator"
  version: "1.0.0"
  type: "autonomous"
  description: |
    Automated architectural analysis system that reviews completed work
    holistically to ensure pattern consistency and maximize code reuse
    across CORTEX v5 migrations.

# Execution Configuration
execution:
  mode: "autonomous"  # Runs automatically without user interaction
  trigger_type: "automatic"  # Triggered by Master Orchestrator
  execution_time_target: "45s"  # Target execution time
  max_execution_time: "120s"  # Maximum allowed execution time
  
  # Context requirements
  required_context:
    - parent_plan_id  # Plan being reviewed
    - review_number  # Which review (1-5)
    - review_name  # Descriptive name
    - document_path  # Where to save review document
    - scope  # What to analyze
    - completed_phases  # List of completed phase numbers
  
  optional_context:
    - sibling_migrations  # Other migrations to analyze
    - specific_artifacts  # Specific artifacts to include

# Workflow Phases
phases:
  - name: "GATHER"
    description: "Collect artifacts from completed phases and sibling migrations"
    execution_order: 1
    timeout_seconds: 20
    outputs:
      - artifacts_gathered  # List of collected artifacts
    
    artifact_sources:
      - type: "progress_tracking"
        location: "{parent_plan_id}/tracking/progress.json"
      
      - type: "sibling_migration_reports"
        locations:
          - "ado-v2-migration/reports/completion*.md"
          - "cleanup-v2-migration/reports/completion*.md"
          - "vacuum-v2-migration/reports/completion*.md"
      
      - type: "previous_reviews"
        location: "{parent_plan_id}/architecture/holistic-review-*.md"
      
      - type: "implementation_files"
        scope_condition: "code_reuse_strategy"
        locations:
          - "src/orchestrators/cleanup/*.py"
          - "src/orchestrators/vacuum/*.py"
          - "src/orchestrators/ado/*.py"
  
  - name: "ANALYZE"
    description: "Extract patterns and identify reuse opportunities"
    execution_order: 2
    timeout_seconds: 30
    outputs:
      - patterns_extracted  # Architectural patterns found
    
    analysis_strategies:
      - name: "architectural_patterns"
        focus:
          - "Engine-based modular architecture"
          - "Transactional operations"
          - "BaseOrchestrator v4.1 compliance"
          - "Progressive analysis patterns"
      
      - name: "code_reuse"
        focus:
          - "Reusable engines (FilesystemEngine, SafetyValidator)"
          - "Shared utilities (AST analyzers, report generators)"
          - "Base classes and inheritance patterns"
      
      - name: "implementation_approaches"
        focus:
          - "Multi-phase workflows"
          - "Performance optimizations"
          - "Safety validation strategies"
      
      - name: "test_patterns"
        focus:
          - "Test coverage standards (95%+)"
          - "Test structure (unit/integration/e2e)"
          - "Mock strategies and fixtures"
  
  - name: "RECOMMEND"
    description: "Generate actionable recommendations"
    execution_order: 3
    timeout_seconds: 20
    outputs:
      - recommendations  # List of recommendations
      - insights  # High-priority insights for injection
    
    recommendation_categories:
      - architecture  # Design decisions, patterns to adopt
      - code_reuse  # Components to import/adapt
      - implementation  # Approaches, optimizations
      - testing  # Coverage, test structure
      - configuration  # Manifest patterns
    
    priority_levels:
      - MANDATORY  # Must be implemented
      - HIGH  # Strongly recommended
      - MEDIUM  # Nice to have
      - LOW  # Consider if time permits
  
  - name: "DOCUMENT"
    description: "Create holistic-review-{N}.md report"
    execution_order: 4
    timeout_seconds: 15
    outputs:
      - review_document  # Path to created document
    
    document_structure:
      - header  # Review metadata
      - executive_summary  # Key findings
      - artifacts_analyzed  # What was reviewed
      - patterns_extracted  # Patterns found
      - recommendations  # Actionable recommendations
      - next_steps  # Action items
  
  - name: "INJECT"
    description: "Prepare insights for context injection"
    execution_order: 5
    timeout_seconds: 5
    outputs:
      - formatted_insights  # Insights ready for injection
    
    injection_format:
      fields:
        - text  # Insight text
        - priority  # HIGH/MEDIUM/LOW
        - review_number  # Which review
        - applicable_to  # next_phase/current_phase

# Review Scopes
# Determines what to analyze and recommend
scopes:
  design:
    description: "Pre-design architectural review"
    focus:
      - Architectural patterns from completed migrations
      - High-level design decisions
      - Technology stack consistency
    document_template: "holistic-review-{N}-design.md"
  
  code_reuse_strategy:
    description: "Pre-implementation code reuse analysis"
    focus:
      - Reusable components from sibling migrations
      - Shared utilities and base classes
      - Code extraction opportunities
    document_template: "holistic-review-{N}-code-reuse.md"
  
  implementation_quality:
    description: "Post-implementation quality review"
    focus:
      - Code quality and consistency
      - Test coverage analysis
      - Performance optimization opportunities
    document_template: "holistic-review-{N}-quality.md"
  
  configuration:
    description: "Pre-configuration manifest review"
    focus:
      - Configuration patterns across orchestrators
      - Manifest structure consistency
      - Template reuse opportunities
    document_template: "holistic-review-{N}-config.md"
  
  integration:
    description: "Pre-integration routing review"
    focus:
      - Master Orchestrator routing patterns
      - Priority assignment consistency
      - Pattern optimization opportunities
    document_template: "holistic-review-{N}-integration.md"
  
  final:
    description: "Final comprehensive review"
    focus:
      - System-wide architectural consistency
      - Cross-migration pattern analysis
      - Future migration recommendations
    document_template: "holistic-review-{N}-final.md"

# Pattern Detection Rules
patterns:
  # Architectural patterns
  - name: "Engine-Based Modular Architecture"
    detection:
      indicator: "Multiple *_engine.py files in orchestrator directory"
      min_confidence: 0.8
    
  - name: "Transactional Operations"
    detection:
      indicator: "create_checkpoint, rollback, commit methods"
      min_confidence: 0.9
  
  - name: "Progressive Analysis"
    detection:
      indicator: "Multi-phase analysis with early exit"
      min_confidence: 0.7
  
  - name: "5-Level Risk Classification"
    detection:
      indicator: "SAFE, LOW, MEDIUM, HIGH, CRITICAL constants"
      min_confidence: 0.9
  
  # Code reuse opportunities
  - name: "Reusable Base Class"
    detection:
      indicator: "Base class with 3+ subclasses"
      min_confidence: 0.8
  
  - name: "Shared Utility Module"
    detection:
      indicator: "Module imported by 2+ orchestrators"
      min_confidence: 0.9

# Recommendation Templates
recommendation_templates:
  architecture:
    template: |
      **{priority} Priority:** {recommendation}
      
      - **Rationale:** {rationale}
      - **Action:** {action}
      - **Impact:** {estimated_impact}
  
  code_reuse:
    template: |
      **{priority} Priority:** {recommendation}
      
      - **Rationale:** {rationale}
      - **Action:** {action}
      - **Time Saved:** {estimated_time_saved}
      - **Code:** `{code_location}`
  
  implementation:
    template: |
      **{priority} Priority:** {recommendation}
      
      - **Rationale:** {rationale}
      - **Action:** {action}
      - **Impact:** {estimated_impact}
  
  testing:
    template: |
      **{priority} Priority:** {recommendation}
      
      - **Rationale:** {rationale}
      - **Action:** {action}
      - **Success Criteria:** {success_criteria}

# Performance Targets
performance:
  target_execution_time: 45  # seconds
  max_artifacts_gathered: 50
  max_patterns_extracted: 20
  max_recommendations: 15
  max_insights_injected: 10

# Integration with Master Orchestrator
integration:
  trigger_condition: "auto"  # Automatic triggering at phase transitions
  context_injection: true  # Inject insights into orchestrator context
  blocking: false  # Don't block orchestrator execution if review fails
  
  # Master Orchestrator will check progress.json for:
  # holistic_reviews:
  #   enabled: true
  #   auto_trigger: true
  #   schedule:
  #     - review_number: 2
  #       status: not_started
  #       trigger_condition: "phase_1_complete"

# Response Templates
response_templates:
  start:
    template: |
      ## 🧠 CORTEX Holistic Review #{review_number}
      **Author:** Asif Hussain | **Orchestrator:** Holistic Review
      
      Starting automatic holistic review: **{review_name}**
      
      **Scope:** {scope}
      **Parent Plan:** {parent_plan_id}
      **Artifacts to Gather:** ~{estimated_artifacts}
      
      ---
      
      ### 📊 Review Workflow
      
      ```
      1. GATHER  → Collect artifacts from completed work
      2. ANALYZE → Extract patterns and reuse opportunities
      3. RECOMMEND → Generate actionable recommendations
      4. DOCUMENT → Create holistic-review-{review_number}.md
      5. INJECT  → Prepare insights for context injection
      ```
      
      ⏳ Estimated time: ~45 seconds
  
  success:
    template: |
      ## ✅ Holistic Review #{review_number} Complete
      
      **Review Document:** `{document_path}`
      
      ### 📊 Results Summary
      
      - **Artifacts Analyzed:** {artifacts_count}
      - **Patterns Extracted:** {patterns_count}
      - **Recommendations Generated:** {recommendations_count}
      - **Insights for Injection:** {insights_count}
      - **Execution Time:** {duration_seconds}s
      
      ---
      
      ### 🚀 Key Insights (Injected into Context)
      
      {insights_list}
      
      ---
      
      ### ✅ Next Action
      
      Proceed with next phase. Review insights have been automatically
      injected into orchestrator context and will inform implementation
      decisions.
  
  error:
    template: |
      ## ❌ Holistic Review #{review_number} Failed
      
      **Error:** {error_message}
      
      **Impact:** Non-blocking. Proceeding with next phase without
      holistic review insights.
      
      **Manual Review Recommended:** Yes, review logs for details.

# Logging Configuration
logging:
  level: "INFO"
  log_phases: true
  log_patterns: true
  log_recommendations: true
  
  log_file: "logs/holistic-review-orchestrator.log"
  
  metrics_tracking:
    - execution_time
    - artifacts_gathered_count
    - patterns_extracted_count
    - recommendations_count
    - insights_injected_count

# Brain Protection (SKULL) Rules
brain_protection:
  rules:
    - HOLISTIC_DISCOVERY
    - GIT_ISOLATION
  
  # Reviews never modify code, only analyze and recommend
  readonly_mode: true
  no_file_modifications: true
  no_git_operations: true

# Version History
version_history:
  - version: "1.0.0"
    date: "2026-01-03"
    changes:
      - "Initial implementation"
      - "5-phase workflow (GATHER, ANALYZE, RECOMMEND, DOCUMENT, INJECT)"
      - "6 review scopes (design, code_reuse, implementation, config, integration, final)"
      - "Automatic context injection support"
      - "Master Orchestrator integration"
