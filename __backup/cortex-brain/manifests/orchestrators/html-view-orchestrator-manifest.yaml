# HTML View Orchestrator Manifest v1.0
# Intelligent HTML/CSS view development with global learning

schema_version: "1.0"
orchestrator_name: "HTML View Orchestrator"
orchestrator_type: "GUIDED"
version: "1.0"

# Orchestrator Metadata
metadata:
  description: "Intelligent HTML/CSS view development with glassmorphism design system and persistent learning"
  author: "Asif Hussain"
  created: "2026-01-04"
  phase: "Phase 14.5: HTML View Standardization"
  plan_reference: "html-glassmorphism-alignment"
  
  features:
    - "Vision API integration for visual analysis"
    - "Glassmorphism design system enforcement"
    - "Mermaid.js diagram generation"
    - "WCAG AA compliance validation"
    - "Preview-first development workflow"
    - "Responsive breakpoint management"
    - "Component pattern library"
    - "Global design requirement learning"
  
  capabilities:
    - "Screenshot analysis (auto-detect visual issues)"
    - "CSS standardization (BEM, utility classes)"
    - "Interactive component generation (tiles, cards, grids)"
    - "Diagram embedding (Mermaid mindmaps, flowcharts, sequences)"
    - "Accessibility testing (contrast, font size, touch targets)"
    - "Cross-view consistency checking"
    - "Design pattern extraction and reuse"

# Design System Configuration
design_system:
  name: "CORTEX Glassmorphism v4.0"
  base_path: "docs/assets/css/"
  
  core_principles:
    - "Glassmorphism: rgba backgrounds + backdrop-filter blur"
    - "Tier-coded colors: T0=#ff6b6b, T1=#ffd700, T2=#00d4ff, T3=#00ff88"
    - "WCAG AA: 4.5:1 contrast, 16-18px fonts, 44px touch targets"
    - "Responsive: clamp() typography, 320px-2560px breakpoints"
    - "Interactive: hover effects, transitions, tooltips"
  
  typography:
    font_family: "Inter, system-ui, sans-serif"
    base_size: "clamp(16px, 2vw, 18px)"
    line_height: 1.7
    scale:
      h1: "clamp(2rem, 4vw, 3rem)"
      h2: "clamp(1.5rem, 3vw, 2.25rem)"
      h3: "clamp(1.25rem, 2vw, 1.5rem)"
      body: "clamp(16px, 2vw, 18px)"
      small: "clamp(14px, 1.8vw, 16px)"
      code: "clamp(14px, 1.5vw, 16px)"
  
  colors:
    tier_0: "#ff6b6b"  # Red - Governance
    tier_1: "#ffd700"  # Gold - Working Memory
    tier_2: "#00d4ff"  # Cyan - Knowledge Graph
    tier_3: "#00ff88"  # Green - Dev Context
    
    backgrounds:
      primary: "rgba(26, 31, 58, 0.5)"
      secondary: "rgba(0, 0, 0, 0.3)"
      hover: "rgba(0, 212, 255, 0.1)"
    
    text:
      primary: "#ffffff"
      secondary: "rgba(255, 255, 255, 0.8)"
      muted: "rgba(255, 255, 255, 0.6)"
      code: "#00d4ff"
  
  spacing:
    section_margin: "3rem"
    card_margin: "3rem"  # Increased from 1.5rem for better spacing
    card_padding: "2.5rem"
    grid_gap: "1.5rem"
  
  effects:
    blur: "blur(20px)"
    border_radius: "12px"
    transition: "all 0.3s ease"
    
    hover:
      transform: "translateY(-4px)"
      shadow: "0 12px 32px rgba(0, 212, 255, 0.3)"
      lift: "4px"
      border_width: "8px"

# Component Library
components:
  tier_card:
    class: ".tier-card"
    use_case: "Individual tier description panels"
    structure:
      - "h3 with tier-badge + icon + title"
      - "Purpose paragraph (strong + description)"
      - "Feature list (2-column grid with icons)"
      - "Storage/metadata paragraph with code blocks"
    styling:
      gradient_backgrounds: true
      tier_specific_left_border: true
      hover_lift: "4px"
      bottom_margin: "3rem"
    
    required_elements:
      - tag: "tier-badge"
        attributes: ["tier-{N}"]
        purpose: "Tier identifier with color coding"
      - tag: "stat-badge"
        purpose: "Metrics display (61 rules, 149 plans, etc.)"
      - tag: "feature-list"
        layout: "2-column responsive grid"
      - tag: "diagram-container"
        purpose: "Mermaid.js charts"
  
  example_tile:
    class: ".example-tile"
    use_case: "Interactive example showcase cards"
    structure:
      - "h4 with command/pattern name"
      - "tier-flow visualization (vertical step badges)"
      - "Code output in cyan-tinted box"
      - "Tooltips on technical terms"
    styling:
      hover_effects: true
      responsive_grid: "repeat(auto-fit, minmax(300px, 1fr))"
  
  stat_badge:
    class: ".stat-badge"
    use_case: "Inline metrics highlighting"
    structure: "Compact pill with icon + value"
    styling:
      font_size: "clamp(12px, 1.5vw, 14px)"
      gradient_background: true
      inline_display: true
  
  diagram_container:
    class: ".diagram-container"
    use_case: "Mermaid.js diagram embedding"
    structure:
      - "Pre-heading (optional)"
      - "Mermaid code block"
      - "Caption (optional)"
    styling:
      padding: "2rem"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      max_width: "100%"
      overflow: "auto"
  
  tab_navigation:
    structure:
      - "Tab button row (flexbox, gap 1rem)"
      - "Tab content divs (display:none, active:block)"
      - "Hash-based routing"
    accessibility:
      - "ARIA roles: tablist, tab, tabpanel"
      - "Keyboard navigation (arrow keys)"
      - "Active state indication"

# Diagram Types (Mermaid.js)
diagrams:
  mindmap:
    use_case: "Hierarchical concept visualization (Tier 0 SKULL rules)"
    syntax: |
      ```mermaid
      mindmap
        root((Central Concept))
          Category 1
            Item A
            Item B
          Category 2
            Item C
      ```
  
  graph:
    use_case: "Relationships and flows (Tier 1 PlanningStateDB)"
    syntax: |
      ```mermaid
      graph LR
        A[Start] --> B{Decision}
        B -->|Yes| C[Result 1]
        B -->|No| D[Result 2]
      ```
  
  sequence:
    use_case: "Inter-tier communication flows"
    syntax: |
      ```mermaid
      sequenceDiagram
        participant User
        participant T0
        participant T1
        User->>T0: Request
        T0->>T1: Validated
        T1-->>User: Response
      ```
  
  flowchart:
    use_case: "Process workflows (Tier 3 context loading)"
    syntax: |
      ```mermaid
      flowchart TD
        A[Start] --> B[Process]
        B --> C{Check}
        C -->|Pass| D[Success]
        C -->|Fail| E[Error]
      ```

# Learning System (Global Requirements Memory)
learning:
  enabled: true
  storage: "cortex-brain/tier2/html-view-requirements.yaml"
  
  capture_categories:
    visual_patterns:
      description: "Successful visual design patterns"
      examples:
        - "Examples tab transformation (lists → tiles)"
        - "Tier flow visualization (step badges)"
        - "Stat badge design (gradient pills)"
      retention: "permanent"
    
    spacing_rules:
      description: "Margin/padding standards"
      examples:
        - "Card bottom margin: 3rem (not 1.5rem)"
        - "Section spacing: 3rem minimum"
        - "Grid gaps: 1.5rem standard"
      retention: "permanent"
    
    component_recipes:
      description: "Reusable component patterns"
      examples:
        - "Interactive tile: hover + lift + glow"
        - "Feature grid: 2-col responsive → 1-col mobile"
        - "Tier card: gradient + border + badge + icon"
      retention: "permanent"
    
    wcag_fixes:
      description: "Accessibility improvements"
      examples:
        - "Contrast fix: #ffd700 → #b89500 (gold)"
        - "Font size: 16px minimum"
        - "Touch target: 44px minimum"
      retention: "permanent"
    
    diagram_usage:
      description: "When to use which diagram type"
      examples:
        - "Mindmap: Category hierarchies (SKULL rules)"
        - "Flowchart: Linear processes (context loading)"
        - "Sequence: Multi-actor flows (tier communication)"
      retention: "permanent"
    
    anti_patterns:
      description: "What NOT to do"
      examples:
        - "Dense paragraphs (add diagrams + spacing)"
        - "Text-only metrics (use stat badges)"
        - "Inline styles only (extract to CSS)"
      retention: "permanent"
  
  query_on_start:
    enabled: true
    purpose: "Load past learnings before starting new view development"
    queries:
      - "Get last 10 visual patterns"
      - "Get current spacing standards"
      - "Get WCAG fixes from previous views"
      - "Get component recipes"

# Vision API Integration
vision:
  enabled: true
  auto_detect_images: true
  
  analysis_prompts:
    visual_issues: |
      Analyze this screenshot and identify:
      1. Text density issues (paragraphs too dense?)
      2. Missing visual elements (diagrams, icons, badges)
      3. Spacing problems (margins, padding, gaps)
      4. Visual hierarchy (headings, emphasis, contrast)
      5. Buried information (metrics, paths, key data)
      6. Static vs interactive elements
      7. WCAG AA compliance (contrast, font size)
      8. Glassmorphism consistency
    
    component_detection: |
      Identify components in this view:
      1. Card/panel types (tier cards, tiles, grids)
      2. Layout patterns (grid, flex, vertical stack)
      3. Interactive elements (buttons, tabs, hover states)
      4. Typography hierarchy (h1-h6, body, code)
      5. Color usage (tier colors, backgrounds, text)
      6. Spacing patterns (margins, padding, gaps)
    
    before_after_comparison: |
      Compare these before/after screenshots:
      1. Visual improvements made
      2. Remaining issues
      3. New problems introduced
      4. Consistency with other views
      5. Mobile responsiveness concerns

# Development Workflow
workflow:
  mode: "preview_first"
  preview_location: "cortex-lens-output/preview-approval/"
  production_location: "docs/"
  
  phases:
    - number: 1
      name: "Discovery"
      description: "Analyze existing view structure and identify issues"
      actions:
        - "Read HTML file"
        - "Vision API analysis (if screenshots provided)"
        - "Load learning system (past requirements)"
        - "Identify component types used"
      outputs:
        - "Issue list (8-15 items)"
        - "Component inventory"
        - "Design system gaps"
    
    - number: 2
      name: "Planning"
      description: "Plan CSS and HTML changes"
      actions:
        - "Prioritize issues (visual impact × effort)"
        - "Identify reusable components"
        - "Plan diagram insertions"
        - "Check WCAG compliance"
      outputs:
        - "Change checklist"
        - "CSS updates needed"
        - "HTML restructuring plan"
    
    - number: 3
      name: "CSS Enhancement"
      description: "Update stylesheets"
      actions:
        - "Increase margins/padding"
        - "Add gradient backgrounds"
        - "Create stat badge styles"
        - "Add diagram container styles"
        - "Enhance hover effects"
      outputs:
        - "Updated CSS (inline or external)"
    
    - number: 4
      name: "HTML Restructuring"
      description: "Transform content structure"
      actions:
        - "Add stat badges to headers"
        - "Insert Mermaid diagrams"
        - "Convert feature lists to grids"
        - "Elevate storage paths (code blocks)"
        - "Add tooltips to technical terms"
      outputs:
        - "Updated HTML"
    
    - number: 5
      name: "Validation"
      description: "Test and validate changes"
      actions:
        - "Preview in browser"
        - "WCAG AA check (contrast, font size, touch targets)"
        - "Responsive test (320px, 768px, 1920px)"
        - "Cross-browser check"
      outputs:
        - "Validation report"
    
    - number: 6
      name: "Learning Capture"
      description: "Save patterns for future use"
      actions:
        - "Extract successful patterns"
        - "Document spacing decisions"
        - "Save component recipes"
        - "Record WCAG fixes"
        - "Update anti-patterns"
      outputs:
        - "cortex-brain/tier2/html-view-requirements.yaml (updated)"

# Command Patterns
command_patterns:
  - pattern: "build HTML view for X"
    example: "build HTML view for four-tier brain"
    action: "Full workflow (discovery → validation)"
  
  - pattern: "fix visual issues in X"
    example: "fix visual issues in tier details tab"
    action: "Discovery + CSS + HTML phases"
  
  - pattern: "add diagram to X showing Y"
    example: "add diagram to Tier 0 showing SKULL rules"
    action: "Insert Mermaid diagram with appropriate type"
  
  - pattern: "standardize X to glassmorphism"
    example: "standardize dashboard to glassmorphism"
    action: "CSS enhancement + component alignment"
  
  - pattern: "make X responsive"
    example: "make tier cards responsive"
    action: "Add clamp(), responsive grids, mobile breakpoints"
  
  - pattern: "vision api X"
    example: "vision api the screenshot"
    action: "Run Vision API analysis on attached images"

# Response Template
response_template: "cortex-brain/response-templates-v4.yaml:structured_response"

# Accessibility Requirements (WCAG AA)
accessibility:
  wcag_level: "AA"
  
  contrast:
    minimum_ratio: 4.5
    text_on_background: "Check all text/background pairs"
    tier_badge_exceptions: "T0, T2 white text OK on tier colors"
  
  typography:
    minimum_font_size: "16px"
    body_text: "clamp(16px, 2vw, 18px)"
    headings: "clamp() with 1.2-1.5 scale"
    line_height_minimum: 1.5
    line_length_maximum: "80ch"
  
  interactive:
    touch_target_minimum: "44px"
    hover_indication: "Required on all clickable elements"
    keyboard_navigation: "Tab order + Enter/Space activation"
    focus_visible: "2px solid cyan outline"
  
  cognitive_load:
    concise_mode: true
    progress_updates: "Phase boundaries only"
    completion_summary: "≤40 lines"
    no_narration: "Avoid 'Now I'll...', 'Perfect!'"

# Brain Protection Integration
brain_protection:
  rules:
    - "HOLISTIC_DISCOVERY: Search for existing views before creating new"
    - "REFACTOR_CLEANUP: Remove inline styles when extracting to CSS"
    - "TDD_ENFORCEMENT: Write visual regression tests (optional)"
    - "GIT_ISOLATION: Never commit to user repos"
  
  tier_integration:
    tier_0: "SKULL rules enforcement (TDD, discovery, refactor)"
    tier_1: "Track active view development state"
    tier_2: "Save learnings to knowledge graph (html-view-requirements.yaml)"
    tier_3: "Read current workspace HTML files"

# Error Handling
error_handling:
  css_selector_not_found:
    action: "Read CSS section, find exact pattern, use multi_replace"
  
  mermaid_syntax_error:
    action: "Validate syntax, provide corrected version"
  
  wcag_violation:
    action: "Auto-fix contrast/font-size/touch-target issues"
  
  responsive_breakage:
    action: "Add clamp(), adjust grid columns, test at 320px"

# Execution Instructions for GitHub Copilot
execution_instructions:
  on_start:
    - "Load learning system: cortex-brain/tier2/html-view-requirements.yaml"
    - "If images attached: Auto-run Vision API analysis"
    - "Display header: ## 🧠 CORTEX HTML View Orchestrator"
  
  during_execution:
    - "Use multi_replace_string_in_file for CSS changes (3+ replacements)"
    - "Include 5 lines context before/after for replace_string_in_file"
    - "Test changes in preview environment first"
    - "Capture learnings after each successful pattern"
  
  on_completion:
    - "Save patterns to cortex-brain/tier2/html-view-requirements.yaml"
    - "Display completion summary (≤40 lines)"
    - "List: files changed, components added, diagrams inserted, WCAG fixes"
  
  progress_reporting:
    mode: "concise"
    display_at:
      - "Phase start (3 lines)"
      - "Phase completion (5 lines)"
      - "Overall completion (≤40 lines summary)"

# Version History
version_history:
  - version: "1.0"
    date: "2026-01-04"
    changes:
      - "Initial manifest creation"
      - "Glassmorphism design system integration"
      - "Vision API auto-detection"
      - "Learning system (Tier 2 integration)"
      - "6-phase workflow (discovery → learning capture)"
      - "Component library (tier-card, example-tile, stat-badge, diagram-container)"
      - "WCAG AA enforcement"
