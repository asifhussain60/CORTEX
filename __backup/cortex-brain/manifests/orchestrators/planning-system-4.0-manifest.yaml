          - "authentication"
          - "authorization"
          - "login"
          - "password"
          - "permission"
          - "access control"
          - "api endpoint"
          - "security"
          - "encryption"
          - "jwt"
          - "oauth"
        library_files:
          - "cortex-brain/knowledge-library/security/threat-modeling-framework.md"
          - "cortex-brain/knowledge-library/security/owasp-top-10-guide.md"
          - "cortex-brain/knowledge-library/security/api-security-foundations.md"
          - "cortex-brain/knowledge-library/security/access-control-patterns.md"
          - "cortex-brain/knowledge-library/security/data-protection-framework.md"
      
      compliance:
        keywords:
          - "gdpr"
          - "hipaa"
          - "pci"
          - "pci-dss"
          - "compliance"
          - "privacy"
          - "data protection"
          - "regulation"
          - "audit"
        library_files:
          - "cortex-brain/knowledge-library/compliance/gdpr-compliance-checklist.md"
          - "cortex-brain/knowledge-library/compliance/hipaa-compliance-checklist.md"
          - "cortex-brain/knowledge-library/compliance/pci-dss-compliance-checklist.md"
          - "cortex-brain/knowledge-library/compliance/soc2-compliance-checklist.md"
      
      design_patterns:
        keywords:
