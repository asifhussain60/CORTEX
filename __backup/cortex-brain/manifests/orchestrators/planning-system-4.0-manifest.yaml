# ========================================
# Response Templates (Composable System)
# ========================================

response_templates:
  use_algorithm: true
  algorithm_version: "1.0"
  algorithm_source: "cortex-brain/response-templates-v4.yaml::template_selection_algorithm"
  
  response_instructions: |
    CRITICAL: When orchestrator_engaged is true (autonomous execution):
    - MUST use cortex_header_shield block (includes 🛡️ shield icon)
    - Header format: "## 🛡️🧠 CORTEX {title}"
    - Shield icon provides visual confirmation of autonomous orchestrator engagement
    - This enforces AUTONOMOUS_EXECUTION_PROTECTION brain protection rule
  
  operations:
    plan_creation:
      description: "Plan creation completion notification"
      context_signals:
        operation_type: "planning"
        response_phase: "start"
        complexity_tier: "STRUCTURED"
        orchestrator_engaged: false
      blocks:
        mandatory: ["cortex_header", "next_action"]
        conditional: ["understanding", "approach", "plan_summary_table", "plan_structure_tree", "plan_file_link"]
        orchestrator_specific: []
      rendering_order: ["cortex_header", "understanding", "plan_summary_table", "plan_structure_tree", "plan_file_link", "next_action"]
    
    plan_execution:
      description: "Plan execution progress tracking (autonomous mode)"
      context_signals:
        operation_type: "execution"
        response_phase: "in_progress"
        complexity_tier: "COMPREHENSIVE"
        orchestrator_engaged: true
      blocks:
        mandatory: ["cortex_header_shield", "progress_tracker_standard", "validation_status_dor_dod", "plan_file_link", "next_action"]
        conditional: ["threat_analysis", "changes", "deliverables_matrix"]
        orchestrator_specific: ["threat_analysis", "deliverables_matrix"]
      rendering_order: ["cortex_header_shield", "progress_tracker_standard", "threat_analysis", "deliverables_matrix", "validation_status_dor_dod", "changes", "plan_file_link", "next_action"]
    
    plan_completion:
      description: "Plan completion with achievements"
      context_signals:
        operation_type: "planning"
        response_phase: "complete"
        complexity_tier: "STRUCTURED"
        orchestrator_engaged: true
      blocks:
        mandatory: ["cortex_header_shield", "progress_tracker_standard", "validation_status_dor_dod", "achievements"]
        conditional: ["changes", "deliverables_matrix", "plan_file_link"]
        orchestrator_specific: []
      rendering_order: ["cortex_header_shield", "progress_tracker_standard", "achievements", "changes", "validation_status_dor_dod"]
      completion_format: "🎉 CONGRATULATIONS"

