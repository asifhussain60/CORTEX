      standards:
        keywords:
          - "diagram"
          - "architecture diagram"
          - "visualization"
          - "documentation"
          - "technical spec"
        library_files:
          - "cortex-brain/knowledge-library/standards/diagram-guidelines.md"
  
  integration_points:
    plan_context:
      phase: "Phase 1 - Classification & Analysis"
      action: "Detect applicable domains and load relevant library files"
      output_section: "knowledge_library_references"
      format: |
        ### 📚 Knowledge Library References
        
        Based on detected domains, the following knowledge library files are applicable:
        
        {{#each applicable_files}}
        **{{domain}} - {{file}}**
        - **Relevant Sections:** {{sections}}
        - **Application:** {{application}}
        - **Key Patterns:** {{patterns}}
        {{/each}}
    
    phase_tasks:
      action: "Include library reminders in phase task lists"
      format: "[ ] Review {{library_file}} - {{specific_section}}"
      example: "[ ] Review OWASP A01 guidelines (access-control-patterns.md)"
    
    validation:
      requirement: "Each plan with detected domain MUST include at least one library reference"
      validation_phase: "Phase 6 - Documentation"
      failure_action: "Warning + suggestion of applicable library files"
  
  plan_manifest_schema:
    knowledge_library_references:
      type: "array"
      required: false
      items:
        - file: "string"
          domain: "string"
          relevant_sections: "array[string]"
          application: "string"
          key_patterns: "array[string]"

# ========================================
# Vision API Integration
# ========================================

vision_api_integration:
  enabled: true
  visual_indicator:
    required: true
    icon: "📷"
    header_format: "## 📷🧠 CORTEX Plan Execution (Vision Engaged)"
  
  image_detection:
    automatic: true
    supported_formats: ["PNG", "JPG", "JPEG", "WEBP", "GIF"]
    trigger_condition: "Any image attachment detected in planning request"
  
  analysis_configuration:
    comprehensive_extraction:
      priority_1_feature_identification:
        - "UI mockups → Extract visible features and components"
        - "Architecture diagrams → Identify system components and relationships"
        - "Wireframes → Map user flows and interaction points"
        - "Design comps → Extract layout structure and visual hierarchy"
      
      priority_2_technical_requirements:
        - "Technology stack indicators"
        - "Integration points between systems"
        - "Data flow patterns"
        - "API endpoints and contracts"
      
      priority_3_implementation_details:
        - "Component hierarchy and nesting"
        - "State management requirements"
        - "Navigation patterns"
        - "Form validation rules"
    
    output_format:
      structured_sections:
        - name: "image_metadata"
          includes: ["dimensions", "format", "url_context", "image_type"]
        
        - name: "feature_extraction"
          includes: ["identified_features", "complexity_estimates", "implementation_priority"]
        
        - name: "layout_structure"
          includes: ["inferred_html", "css_selectors", "component_hierarchy"]
        
        - name: "implementation_guide"
          includes: ["technology_recommendations", "file_structure", "development_phases"]
        
        - name: "test_automation_requirements"
          includes: ["test_selectors", "test_scenarios", "coverage_strategy"]
  
  planning_specific_integration:
    context_discovery_phase:
      when: "Image shows UI design, mockup, or feature specification"
      action: "Extract features and generate plan context"
      output_template: |
        ### 📷 Vision Analysis - Feature Extraction
        
        **Image Type:** {{image_type}} (UI Mockup / Architecture Diagram / Wireframe)
        **Dimensions:** {{width}}x{{height}} | **Format:** {{format}}
        {{#if url_detected}}
        **URL Context:** {{url}}
        {{/if}}
        
        **Identified Features ({{feature_count}} total):**
        {{#each features}}
        | Feature | Components | Complexity | Priority | Estimated Hours |
        |---------|------------|------------|----------|-----------------|
        | {{feature_name}} | {{component_list}} | {{complexity}} | {{priority}} | {{estimate}} |
        {{/each}}
        
        **Layout Structure (Inferred DOM):**
        ```html
        {{inferred_html_structure}}
        ```
        
        **Component Hierarchy:**
        ```
        {{component_tree}}
        ```
        
        **Technology Recommendations:**
        {{#each tech_recommendations}}
        - {{technology}}: {{rationale}}
        {{/each}}
        
        **Test Automation Selectors:**
        {{#each test_selectors}}
        - {{component_name}}: `{{selector}}` ({{selector_type}})
        {{/each}}
      
      integration_points:
        - location: "plan_context/visual_requirements.md"
          content: "Store vision analysis output for reference"
        
        - location: "implementation_phases"
          content: "Use extracted features to generate phase tasks"
        
        - location: "test_requirements"
          content: "Include test selectors in TDD requirements"
    
    phase_generation:
      when: "Features extracted from vision analysis"
      action: "Generate implementation phases based on visual complexity"
      logic: |
        For each detected feature:
          - Estimate complexity (low/medium/high)
          - Assign to appropriate phase
          - Generate subtasks based on component structure
          - Include test automation requirements
      
      output_integration:
        - "Phase task lists include vision-derived requirements"
        - "Test selectors automatically added to TDD phases"
        - "Component structure influences file organization"
    
    validation_phase:
      when: "Image shows acceptance criteria or expected outcomes"
      action: "Create validation checklist from visual requirements"
      output_template: |
        ### 📷 Vision Analysis - Validation Requirements
        
        **Visual Acceptance Criteria:**
        {{#each visual_requirements}}
        - [ ] {{requirement_name}}
          - Reference: {{screenshot_section}}
          - Test Selector: `{{test_selector}}`
          - Expected Behavior: {{behavior}}
        {{/each}}
      
      integration_points:
        - "Phase 6 - Documentation (validation checklist)"
        - "Final verification requirements"
  
  architectural_diagram_handling:
    when: "Image contains architecture diagram or system design"
    analysis_focus:
      - "System components and their boundaries"
      - "Communication patterns (REST, GraphQL, WebSocket)"
      - "Data stores and persistence layers"
      - "External integrations and third-party services"
      - "Deployment architecture"
    
    output_template: |
      ### 📷 Vision Analysis - Architecture Extraction
      
      **System Components Identified:**
      {{#each components}}
      | Component | Type | Technology | Responsibilities |
      |-----------|------|------------|------------------|
      | {{name}} | {{type}} | {{tech}} | {{responsibilities}} |
      {{/each}}
      
      **Integration Points:**
      {{#each integrations}}
      - {{source}} → {{target}}: {{protocol}} ({{data_format}})
      {{/each}}
      
      **Data Flow:**
      ```mermaid
      {{generated_mermaid_diagram}}
      ```
      
      **Implementation Phases (Architecture-Driven):**
      1. Core Services: {{core_components}}
      2. Integration Layer: {{integration_components}}
      3. Frontend Layer: {{ui_components}}
    
    plan_integration:
      - "Generate phases based on architectural layers"
      - "Create infrastructure setup tasks"
      - "Include integration testing requirements"
      - "Plan deployment pipeline stages"
  
  error_handling:
    vision_api_unavailable:
      action: "Continue with manual planning"
      message: "⚠️ Vision API unavailable - proceeding with text-based planning"
    
    image_analysis_failed:
      action: "Log error and continue"
      message: "⚠️ Image analysis failed - manual review required"
    
    no_features_detected:
      action: "Provide generic image description"
      message: "📷 Image analyzed but no UI/architecture features detected - may require manual interpretation"
  
  output_artifacts:
    plan_context_files:
      - "visual_requirements.md" # Vision analysis output
      - "feature_extraction.json" # Structured feature data
      - "component_hierarchy.yaml" # Component structure
      - "test_selectors.json" # Automation selectors
    
    manifest_updates:
      - "00-master-plan.md" # Include vision-derived features
      - "99-implementation-tracker.md" # Reference visual requirements

# ========================================
# Continuous Risk Analysis
# ========================================

continuous_risk_analysis:
  enabled: true
  enforcement_rule: "CONTINUOUS_RISK_ANALYSIS_ENFORCEMENT"
  visual_indicator:
    required: true
    icon: "💀"
    section_header: "### 💀 Risk Analysis & Recommendations"
  
  execution_frequency:
    trigger: "Every user interaction turn during planning"
    timing: "After user input, before response generation"
    scope: "Analyze current plan state + new changes"
  
  risk_categories:
    - category: "edge_cases"
      icon: "🎯"
      description: "Boundary conditions, null/empty inputs, extreme values, unexpected states"
      analysis_prompts:
        - "What happens with 0 items?"
        - "How does system handle maximum load?"
        - "What if API returns malformed/null data?"
        - "Edge case: Extreme input sizes (0 bytes, 10GB files)"
    
    - category: "failure_modes"
      icon: "💥"
      description: "System failures, dependency outages, network issues, timeout scenarios"
      analysis_prompts:
        - "Database connection lost mid-transaction?"
        - "Third-party API rate limit exceeded?"
        - "Disk space exhausted during operation?"
        - "Memory leak under sustained load?"
    
    - category: "race_conditions"
      icon: "🏁"
      description: "Concurrent access, state inconsistencies, deadlocks, timing issues"
      analysis_prompts:
        - "Two users modify same record simultaneously?"
        - "Order of async operations non-deterministic?"
        - "Cache invalidation race between read/write?"
        - "Deadlock: Process A waits for B, B waits for A?"
    
    - category: "integration_pitfalls"
      icon: "🔌"
      description: "API versioning, contract changes, dependency conflicts, protocol mismatches"
      analysis_prompts:
        - "Third-party API deprecated endpoints?"
        - "Breaking changes in library updates?"
        - "OAuth token refresh during operation?"
        - "Webhook delivery failures?"
    
    - category: "deployment_risks"
      icon: "🚀"
      description: "Zero-downtime deployment, database migrations, feature flags, rollout strategies"
      analysis_prompts:
        - "Schema change breaks old app version?"
        - "Blue-green deployment routing issues?"
        - "Feature flag toggle causes data inconsistency?"
        - "Rolling restart loses in-flight requests?"
    
    - category: "security_vulnerabilities"
      icon: "🔒"
      description: "Injection attacks, XSS, CSRF, auth bypass, data exposure, privilege escalation"
      analysis_prompts:
        - "SQL injection via unsanitized input?"
        - "JWT token doesn't expire?"
        - "CORS misconfiguration exposes API?"
        - "Sensitive data in logs/error messages?"
    
    - category: "performance_bottlenecks"
      icon: "⚡"
      description: "N+1 queries, inefficient algorithms, memory leaks, blocking operations"
      analysis_prompts:
        - "Loop makes hundreds of database calls?"
        - "O(n²) algorithm on large dataset?"
        - "Synchronous call blocks event loop?"
        - "No pagination on list endpoints?"
    
    - category: "scalability_limits"
      icon: "📈"
      description: "Horizontal/vertical scaling constraints, stateful sessions, single points of failure"
      analysis_prompts:
        - "In-memory cache doesn't scale horizontally?"
        - "Single database instance bottleneck?"
        - "File upload to local disk (not distributed)?"
        - "WebSocket server affinity required?"
    
    - category: "rollback_recovery"
      icon: "🔄"
      description: "Backup strategies, disaster recovery, data restoration, incident response"
      analysis_prompts:
        - "No automated backup before migration?"
        - "Point-in-time recovery not configured?"
        - "Rollback script doesn't reverse data changes?"
        - "No health check for canary deployment?"
    
    - category: "data_integrity"
      icon: "🗄️"
      description: "Validation rules, constraint enforcement, transaction boundaries, consistency checks"
      analysis_prompts:
        - "Email format not validated?"
        - "Foreign key constraint missing?"
        - "Transaction spans multiple microservices?"
        - "Eventual consistency window too large?"
    
    - category: "dependency_risks"
      icon: "📦"
      description: "Library vulnerabilities, supply chain attacks, unmaintained packages, version conflicts"
      analysis_prompts:
        - "Critical CVE in dependency?"
        - "Library last updated years ago?"
        - "Dependency diamond conflict?"
        - "Transitive dependency security issue?"
    
    - category: "maintainability_issues"
      icon: "🛠️"
      description: "Code complexity, technical debt, documentation gaps, testing coverage"
      analysis_prompts:
        - "Function has 500+ lines?"
        - "No unit tests for critical path?"
        - "Magic numbers without constants?"
        - "API contract not documented?"
  
  recommendation_template: |
    ### 💀 Risk Analysis & Recommendations
    
    **Analysis Run:** Turn {{turn_number}} of {{total_turns}}
    
    {{#each risk_categories}}
    #### {{category_icon}} {{category_name}}
    
    {{#each findings}}
    **Finding {{finding_number}}:** {{risk_description}}
    
    - **Impact:** {{impact_icon}} {{impact_level}}
    - **Likelihood:** {{likelihood}}
    - **Current Plan:** {{current_approach}}
    - **Gap Identified:** {{identified_gap}}
    
    **💡 Recommended Improvement:**
    {{recommendation_text}}
    
    {{#if smarter_alternative}}
    **🔄 Smarter Alternative:**
    {{smarter_alternative}}
    {{/if}}
    
    **❓ Decision Required:**
    - ✅ **Yes - Accept & Integrate** (Add to plan)
    - ❌ **No - Skip for Now** (Re-analyze next turn)
    
    ---
    {{/each}}
    {{/each}}
  
  impact_levels:
    critical:
      icon: "🔴"
      description: "System failure, data loss, security breach"
      action: "MUST address before deployment"
    
    high:
      icon: "🟠"
      description: "Major functionality impaired, significant performance degradation"
      action: "SHOULD address in current sprint"
    
    medium:
      icon: "🟡"
      description: "Minor functionality issues, moderate performance impact"
      action: "MAY address in next sprint"
    
    low:
      icon: "🟢"
      description: "Edge cases, minimal user impact"
      action: "Nice to have, backlog candidate"
  
  user_response_handling:
    accept:
      actions:
        - "Add to phase tasks in 00-master-plan.md"
        - "Update validation checklist"
        - "Create risk mitigation task"
        - "Add to risk register (risk-analysis/risk-register.yaml)"
        - "Update acceptance criteria if applicable"
      
      task_format: "[ ] {{risk_mitigation_action}} ({{category}} Risk #{{number}})"
      
      example: "[ ] Implement parameterized queries to prevent SQL injection (Security Risk #1)"
    
    reject:
      actions:
        - "Log rejection in risk-analysis/turn-{{N}}-risks.md"
        - "Track reason if provided"
        - "Re-analyze on next turn with updated context"
        - "Escalate if CRITICAL risk rejected"
      
      re_analysis_conditions:
        - "New context makes risk more relevant"
        - "User adds related feature"
        - "Risk severity increases"
  
  output_artifacts:
    risk_analysis_folder: "cortex-brain/documents/planning/active/{plan_name}/risk-analysis/"
    
    generated_files:
      - "turn-01-risks.md" # Risks identified on turn 1
      - "turn-02-risks.md" # Risks identified on turn 2
      - "turn-N-risks.md"  # Risks identified on turn N
      - "accepted-recommendations.md" # All accepted risks + integration details
      - "rejected-recommendations.md" # All rejected risks + reasons
      - "risk-register.yaml" # Comprehensive risk tracking
    
    risk_register_schema: |
      risks:
        - id: "RISK-001"
          category: "security_vulnerabilities"
          description: "SQL injection via user search"
          impact: "critical"
          likelihood: "very_likely"
          turn_identified: 2
          status: "accepted"
          mitigation: "Implement parameterized queries"
          integration_phase: "Phase 3 - Implementation"
          validation: "[ ] SQL injection tests pass"
        
        - id: "RISK-002"
          category: "performance_bottlenecks"
          description: "N+1 query in dashboard"
          impact: "high"
          likelihood: "likely"
          turn_identified: 3
          status: "rejected"
          rejection_reason: "Will optimize post-MVP"
          re_analysis_turns: [4, 5]
  
  integration_with_planning_phases:
    phase_1_classification:
      risk_focus: "High-level architecture risks, scalability concerns"
      timing: "After complexity analysis"
    
    phase_2_context_discovery:
      risk_focus: "Integration pitfalls, dependency risks, existing system constraints"
      timing: "After holistic discovery"
    
    phase_3_design:
      risk_focus: "Security vulnerabilities, data integrity, performance bottlenecks"
      timing: "After design decisions made"
    
    phase_4_implementation:
      risk_focus: "Race conditions, edge cases, failure modes"
      timing: "Before implementation tasks finalized"
    
    phase_5_validation:
      risk_focus: "Deployment risks, rollback recovery, maintainability"
      timing: "Before validation checklist created"
    
    phase_6_documentation:
      risk_focus: "Documentation gaps, technical debt awareness"
      timing: "Before plan finalization"
  
  escalation_rules:
    critical_risk_rejected:
      action: "Present again next turn with stronger rationale"
      message: "⚠️ CRITICAL risk previously identified - reconsider for production readiness"
    
    high_risk_rejected_twice:
      action: "Escalate to CRITICAL priority"
      message: "⚠️ This HIGH risk has been rejected twice - escalating to CRITICAL"
    
    medium_low_rejected:
      action: "Reduce presentation frequency"
      message: "Risk noted - will monitor for relevance"
  
  adaptive_learning:
    track_user_priorities:
      - "Which risk categories user accepts most"
      - "Which categories user consistently rejects"
      - "Risk threshold preferences (critical only vs. all levels)"
    
    noise_reduction:
      - "Reduce low-priority risks if user focuses on critical/high"
      - "Skip repeatedly rejected risks unless context changes"
      - "Learn user's risk tolerance level"
  
  example_interaction:
    turn_2: |
      ## 🧠 CORTEX Plan Execution
      
      [Plan content...]
      
      ### ⚠️ Risk Analysis & Recommendations
      
      **Analysis Run:** Turn 2 of 5
      
      #### 🔒 Security Vulnerabilities
      
      **Finding 1:** SQL Injection Risk in User Search
      
      - **Impact:** 🔴 CRITICAL
      - **Likelihood:** Very Likely
      - **Current Plan:** "User search endpoint accepts raw query parameters"
      - **Gap Identified:** No input sanitization or parameterized queries mentioned
      
      **💡 Recommended Improvement:**
      Implement parameterized queries using SQLAlchemy ORM. Add input validation middleware to sanitize all user inputs. Implement rate limiting to prevent brute force attacks.
      
      **🔄 Smarter Alternative:**
      Use Elasticsearch for full-text search instead of SQL LIKE queries. Provides built-in sanitization, better performance (indexing), and advanced features (fuzzy matching, relevance scoring, faceted search).
      
      **❓ Decision Required:**
      - ✅ **Yes - Accept & Integrate** (Add to plan)
      - ❌ **No - Skip for Now** (Re-analyze next turn)
      
      ---
      
      #### ⚡ Performance Bottlenecks
      
      **Finding 2:** N+1 Query Problem in Dashboard
      
      - **Impact:** 🟠 HIGH
      - **Likelihood:** Likely (when user has many orders)
      - **Current Plan:** "Load user profile, iterate through orders"
      - **Gap Identified:** Each order requires separate database query
      
      **💡 Recommended Improvement:**
      Use SQLAlchemy eager loading with `.options(joinedload(User.orders))` to fetch all data in single query. Add database indexes on foreign keys.
      
      **🔄 Smarter Alternative:**
      Implement DataLoader pattern or GraphQL with DataLoader library. Automatically batches and caches requests, preventing N+1 across entire application.
      
      **❓ Decision Required:**
      - ✅ **Yes - Accept & Integrate** (Add to plan)
      - ❌ **No - Skip for Now** (Re-analyze next turn)
      
      ---
      
      **Next:** Please respond with Yes/No for each finding, or provide your next planning input.

# ========================================
# Workflow
# ========================================

workflow:
  phases:
    - id: 1
      name: "Classification & Analysis"
      description: "Classify operation tier and analyze complexity"
      duration: "< 5 seconds"
      components:
        - "TieredRouter"
        - "ComplexityAnalyzer"

    - id: 2
      name: "Pre-Planning Discovery"
      description: "Check for existing/recent plans"
      duration: "30-60 seconds"
      components:
        - "pre_planning_discovery()"
      optional: true
      skip_condition: "force_new_plan=true"

    - id: 3
      name: "Execution"
      description: "Execute tier-specific planning workflow"
      duration: "Variable (depends on tier)"
      components:
        - "_execute_instant()" # Tier 1
        - "_execute_lightweight()" # Tier 2
        - "_execute_documented()" # Tier 3
        - "_execute_complex()" # Tier 4

    - id: 3.5
      name: "TDD Integration"
      description: "Automated RED→GREEN→REFACTOR cycle for all plans (Tier 2+)"
      duration: "Variable (depends on implementation complexity)"
      orchestrator: "tdd_orchestrator"
      integration_method: "Automatic inclusion in all plans"
      components:
        - "TDDOrchestrator"
        - "RedPhaseStrategy" # Generate failing tests
        - "GreenPhaseStrategy" # Minimal implementation
        - "RefactorPhaseStrategy" # AI-driven refactoring
      triggers:
        - "tier >= 2" # LIGHTWEIGHT and above
        - "skip_tdd=false" # Not explicitly disabled
      quality_gates:
        - "min_test_coverage: 80%"
        - "min_quality_score: 7.0/10.0"
        - "all_tests_passing: true"
        - "final_refactor_phase_enforced: true" # SKULL Rule: REFACTOR_CODE_CLEANUP_ENFORCEMENT
      rollback_on_failure: true
      notes: "TDD v4.0 provides adaptive learning (11+ languages), AI code generation, and clean code enforcement. SKULL Rule enforces mandatory final REFACTOR phase that reviews ENTIRE file for cleanliness."
      skull_enforcement:
        rule_id: "REFACTOR_CODE_CLEANUP_ENFORCEMENT"
        enforcement_level: "MANDATORY"
        description: "All plans MUST include final REFACTOR phase that reviews ENTIRE file (not just new code) for duplicates, broken structure, complexity >30, SOLID violations, and dead code"
        purpose: "Prevent technical debt accumulation by ensuring modified files are left in clean, optimized state"
      progress_tracker_sync:
        rule_id: "TRACKER_SYNC_ENFORCEMENT"
        enforcement_level: "MANDATORY"
        description: "Every phase MUST include final task to update progress tracker in master plan"
        purpose: "Keep master plan visual progress synchronized with actual work completion"
        implementation:
          - "Add task at end of each phase: 'Update progress tracker in 00-master-plan.md'"
          - "Use sync_plan_tracker.py from CORTEX Toolkit for automation"
          - "Validate consistency between master plan and tracking/progress-tracker.json"
        example_task: "[ ] {Phase}.{Last_Task_Num+1} Update progress tracker in master plan (python cortex-toolkit/sync_plan_tracker.py --update-phase {N} --progress {PCT} --status {STATUS})"
        phase_requirements:
          name: "Final REFACTOR - Whole-File Cleanup"
          type: "quality_gate"
          scope: "ALL modified files (not just new code)"
          activities:
            - "Review ENTIRE file structure (not just modified sections)"
            - "Fix broken HTML tags, syntax errors, structural issues"
            - "Remove ALL duplicate and redundant code"
            - "Refactor ALL functions with complexity >30 down to ≤30"
            - "Enforce SOLID principles throughout file"
            - "Remove ALL dead/orphaned code and unused imports"
            - "Validate file integrity and completeness"
            - "Run all tests to ensure no regressions"
          validation_criteria:
            - "✅ No broken HTML tags or structural issues"
            - "✅ Zero duplicate or redundant code blocks"
            - "✅ All function complexity ≤30"
            - "✅ SOLID principles enforced"
            - "✅ No dead code or unused imports"
            - "✅ All tests passing (100% pass rate)"
            - "✅ File is production-ready and maintainable"
        distinction_from_tdd_refactor:
          tdd_refactor: "Cleans code that was just written (micro-level, per-feature)"
          final_refactor: "Reviews ENTIRE file for overall cleanliness (macro-level, whole-file)"
        implementation:
          method: "_enforce_final_refactor_phase()"
          location: "src/orchestrators/planning/planning_orchestrator.py"
          integration_points:
            - "_integrate_tdd_workflow() - Called after TDD phases added"
            - "execute() - Applied after plan generation"
          test_coverage: "tests/orchestrators/planning/test_final_refactor_enforcement.py"
      bidirectional_linking:
        rule_id: "PLAN_FILE_LINKING"
        enforcement_level: "MANDATORY"
        description: "All decomposed plan files MUST include bidirectional links to master plan and related files"
        purpose: "Enable seamless navigation between master plan, context files, artifacts, and reports"
        implementation:
          - "Add '📄 Plan Navigation' section at end of each decomposed file"
          - "Include links to: master plan, progress tracker, context files, artifacts, reports"
          - "Use relative paths for portability"
          - "Auto-generate links using sync_plan_tracker.py --generate-links"
        template: |
          ### 📄 Plan Navigation
          
          **Master Plan:** [00-master-plan.md](../00-master-plan.md)
          **Progress Tracker:** [progress-tracker.json](../tracking/progress-tracker.json)
          
          **Related Files:**
          - [Context File](../context/{file}.md)
          - [Artifact](../artifacts/{artifact}.yaml)
          - [Report](../reports/{report}.md)


    - id: 4
      name: "Refactor"
      description: "Run refactor cycle for Tier 3+ operations"
      duration: "Variable"
      components:
        - "_run_refactor_cycle()"
      conditional: "tier >= 3 AND skip_refactor=false"

    - id: 5
      name: "Vacuum"
      description: "Run vacuum cycle for Tier 3+ operations"
      duration: "Variable"
      components:
        - "_run_vacuum_cycle()"
      conditional: "tier >= 3 AND skip_vacuum=false"

    - id: 6
      name: "Documentation"
      description: "Generate planning documentation"
      duration: "< 10 seconds"
      components:
        - "_generate_documentation()"

    - id: 7
      name: "Finalization"
      description: "Finalize planning and render visual tracker"
      duration: "< 5 seconds"
      components:
        - "PlanningSession.render_progress_table()"

# ========================================
# Metrics & Monitoring
# ========================================

metrics:
  tracked_metrics:
    - "operations_processed" # Total operations
    - "tier_breakdown" # Count per tier (1-4)
    - "planning_created" # Plans generated
    - "temporary_plans_created" # Implicit plans
    - "plans_approved" # Temp → active
    - "plans_completed" # Active → completed
    - "knowledge_extractions" # Completed → knowledge graph
    - "refactor_cycles_run" # Refactor invocations
    - "vacuum_cycles_run" # Vacuum invocations
    - "errors" # Error list
    - "warnings" # Warning list

  performance_targets:
    tier_1_execution: "< 2 seconds"
    tier_2_execution: "< 10 seconds"
    tier_3_execution: "< 60 minutes"
    tier_4_execution: "Variable (documented upfront)"
    discovery_overhead: "< 60 seconds"

# ========================================
# Configuration
# ========================================

configuration:
  plan_folder_structure:
    root: "cortex-brain/documents/planning/"
    subfolders:
      - "active/" # Current work
      - "temp-plans/" # Unapproved work
      - "completed/" # Archived work
      - "features/" # Legacy feature plans
  
  universal_subfolders:
    required:
      - "context/" # Context artifacts
      - "reports/" # Progress reports
      - "artifacts/" # Supporting files
      - "tracking/" # Progress tracking JSON
    automation:
      tool: "cortex-toolkit/core/utilities/plan_scaffold_generator.py"
      usage: "python plan_scaffold_generator.py '<plan-name>'"
      benefits:
        - "Eliminates manual folder creation (4 folders + tracker JSON)"
        - "Ensures consistent structure across all plans"
        - "Reduces orchestrator overhead by ~30 seconds per plan"
        - "Prevents missing folders or incorrect naming"
      enforcement: "Required for all new plans (see cortex-maintenance.prompt.md Phase 1)"

  plan_file_naming:
    master_plan: "00-master-plan.md"
    temp_plan: "11-temp-planning-session.md"
    sub_plans: "01-*.md, 02-*.md, etc."
    tracking: "tracking/progress-tracker.json"

