        test_count: 9
        status: "✅ ALL PASSING"
        tests:
          - "test_pre_planning_discovery_finds_active_plans"
          - "test_pre_planning_discovery_finds_temp_plans"
          - "test_pre_planning_discovery_finds_completed_plans"
          - "test_pre_planning_discovery_no_existing_plans"
          - "test_extract_feature_slug_basic"
          - "test_search_plans_by_time_range"
          - "test_find_master_plan_finds_correct_file"
          - "test_extract_plan_summary"
          - "test_discovery_performance_under_60_seconds"

      - name: "Phase Tracking"
        file: "test_phase_tracking.py"
        status: "⏸️ PENDING"
        tests:
          - "test_planning_session_initialization"
          - "test_phase_tracking_with_metrics"
          - "test_token_estimation"

      - name: "Visual Tracker Rendering"
        file: "test_visual_tracker_rendering.py"
        status: "⏸️ PENDING"
        tests:
          - "test_visual_tracker_in_response"
          - "test_session_metrics_display"
          - "test_master_plan_with_visual_tracker"

  integration_tests:
    location: "tests/integration/"
    test_suites:
      - name: "Visual Tracker Integration"
        file: "test_visual_tracker_integration.py"
        status: "⏸️ PENDING"
        tests:
          - "test_end_to_end_planning_with_discovery"
          - "test_visual_tracker_visible_in_responses"
          - "test_tracker_embedded_in_master_plans"
          - "test_metrics_accurately_tracked"
          - "test_discovery_finds_existing_plans"

# ========================================
# Requirements (Inherited from 2.0)
# ========================================

requirements:
  - requirement_id: "REQ-001"
    name: "Acceptance Criteria Approval Gate"
    priority: "high"
    status: "partial"
    notes: "Implemented in tier routing, needs explicit approval step"

  - requirement_id: "REQ-002"
    name: "Interactive DoR Workflow"
    priority: "high"
    status: "pending"
    notes: "Planned for Phase 3 (Plan Lifecycle Management)"

  - requirement_id: "REQ-003"
    name: "Contextual Review Orchestrator Integration"
    priority: "high"
    status: "implemented"
    notes: "Integrated via orchestration chain"

  - requirement_id: "REQ-004"
    name: "SWAG Estimation via Swagger"
    priority: "medium"
    status: "pending"
    notes: "Planned for future enhancement"

  - requirement_id: "REQ-005"
    name: "Visual Progress Rendering"
    priority: "critical"
    status: "implemented"
    implementation_phase: "Phase 1 (cortex-rearchitecture-v1)"
    tasks_completed:
      - "Task 1.1: Pre-planning discovery (✅)"
      - "Task 1.2: Helper methods (✅)"
      - "Task 1.3: PlanningSession integration (✅)"
      - "Task 1.4: Phase tracking (✅)"
      - "Task 1.5: Render visual tracker (✅)"
    tasks_pending:
      - "Task 1.6: Embed in master plans (⏸️)"
      - "Task 1.7: Update manifest (✅ THIS FILE)"
      - "Task 1.8: Integration testing (⏸️)"
    
    visual_progress_enforcement:
      description: |
        ALL planning operation responses MUST include visual progress tracker.
        This matches the maintenance prompt pattern for consistent UX.
      
      forbidden_behaviors:
        - "Phase completions without progress visualization"
        - "Text-only status updates (e.g., 'Phase 2 complete')"
        - "Skipping progress bars in autonomous mode"
        - "Displaying progress only at plan start/end (must show after EACH phase)"
      
      required_behaviors:
        - "Render visual progress table after EVERY phase completion"
        - "Use ASCII progress bars: `██████████░░░░░░░░░░` format"
        - "Show overall progress percentage in header"
        - "Display phase status with emojis (✅ Complete, 🔄 In Progress, ⏳ Pending)"
        - "Include summary metrics (tests, LOC, status)"
      
      required_format: |
        ---
        ### 📊 PLAN EXECUTION STATUS
        
        **Overall Progress:** `████████░░░░░░░░░░░░` **XX%** {STATUS_EMOJI} {STATUS_TEXT}
        
        | Phase | Progress | Status |
        |-------|----------|--------|
        | Phase 1 - {Name} | `██████████` | 100% ✅ Complete |
        | Phase 2 - {Name} | `████████░░` | 80% 🔄 In Progress |
        | Phase 3 - {Name} | `░░░░░░░░░░` | 0% ⏳ Pending |
        
        📊 **Tests:** XX/XX passing | **Code:** X,XXX LOC | **Status:** {STATUS}
        
        ---
      
      locations_requiring_tracker:
        - "cortex-brain/documents/planning/active/*/00-*.md (master plans)"
        - "Chat responses after each phase completion"
        - "cortex-brain/documents/reports/*.md (all planning reports)"
      
      implementation_references:
        template_file: "cortex-brain/response-templates-v4.yaml"
        template_component: "components.visual_progress.plan_tracker"
        renderer_method: "template_renderer.py::generate_phase_rows()"
        progress_bar_generator: "template_renderer.py::generate_progress_bar()"
      
      phase_transition_pattern: |
        After EACH phase completion, IMMEDIATELY render:
        
        ✅ Phase {N} - {NAME}: Complete
           └─ Actions: {count} | Fixed: {fixed_count} | Duration: {seconds}s
           └─ Auto-proceeding to Phase {N+1}...
        
        ### 📊 PLAN EXECUTION STATUS
        [Full progress table showing updated status]
      
      reference_implementation:
        source: ".github/prompts/cortex-maintenance.prompt.md"
        lines: "254-260"
        description: "Maintenance prompt demonstrates correct visual progress pattern"

  - requirement_id: "REQ-006"
    name: "Learning Library Auto-Documentation"
    priority: "medium"
    status: "partial"
    notes: "Knowledge extraction on plan completion"

  - requirement_id: "REQ-007"
    name: "Interactive Threat Modeling"
    priority: "low"
    status: "pending"
    notes: "Planned for future enhancement"

  - requirement_id: "REQ-008"
    name: "TDD Reminders Visibility"
    priority: "critical"
    status: "implemented"
    notes: "Enforced via SKULL rules"

