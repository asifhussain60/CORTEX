schema_version: "5.0"

orchestrator:
  name: "refactor_code_quality"
  version: "1.0.0"
  type: "autonomous"
  parent_orchestrator_id: "refactor_orchestrator"
  description: "Code quality improvements: complexity reduction, duplication elimination, naming standardization"
  implementation: "src/orchestrators/refactor/code_quality_refactor.py"
  base_class: "BaseOrchestratorV4_1"
  
  phases:
    - id: 1
      name: "ANALYSIS"
      description: "Analyze code quality metrics"
      activities:
        - "Calculate cyclomatic complexity per function"
        - "Detect duplicate code blocks (≥5 lines)"
        - "Analyze naming conventions (PEP 8)"
        - "Find unused imports"
        - "Identify overly complex expressions"
      outputs:
        - "code-quality-analysis.yaml"
    
    - id: 2
      name: "REFACTORING"
      description: "Apply code quality improvements"
      activities:
        - "Extract complex functions (cyclomatic ≥15) into smaller functions"
        - "Remove duplicate code (DRY principle)"
        - "Standardize naming (snake_case for functions, PascalCase for classes)"
        - "Remove unused imports"
        - "Simplify complex expressions"
      outputs:
        - "refactored-files.txt"
    
    - id: 3
      name: "VALIDATION"
      description: "Verify improvements and no regressions"
      activities:
        - "Run pytest (100% pass required)"
        - "Recalculate complexity (verify improvement)"
        - "Run black + isort (formatting)"
        - "Check for new linting errors"

capabilities:
  - "cyclomatic_complexity_reduction"
  - "duplicate_code_elimination"
  - "naming_standardization"
  - "import_optimization"
  - "expression_simplification"

metrics:
  - name: "complexity_before"
    type: "float"
    description: "Average cyclomatic complexity before refactor"
  
  - name: "complexity_after"
    type: "float"
    description: "Average cyclomatic complexity after refactor"
  
  - name: "complexity_improvement_percent"
    type: "float"
    description: "Percentage improvement in complexity"
  
  - name: "duplicates_removed"
    type: "int"
    description: "Number of duplicate code blocks removed"
  
  - name: "lines_changed"
    type: "int"
    description: "Total lines changed"

governance:
  rules_enforced:
    - "PYTHON_CODE_FORMATTING_REQUIRED"
    - "PYTHON_IMPORT_ORGANIZATION_REQUIRED"
