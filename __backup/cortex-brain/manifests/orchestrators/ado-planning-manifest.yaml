# ADO Planning Orchestrator Manifest
# Integrates with Planning System for ADO work item generation
#
# Version: 3.0.0
# Author: CORTEX Development Team
# Updated: 2025-12-15
# Status: ACTIVE - Phase 6: Planning System Integration Complete

schema_version: "1.0"
inherits_from: "planning-system-manifest.yaml"

# ========================================
# Metadata
# ========================================

metadata:
  orchestrator_name: "ado_planning_orchestrator"
  version: "3.0.0"
  description: "ADO work item generation integrated with Planning System architecture"
  category: "planning"
  deployment_tier: "user"
  status: "active"
  last_updated: "2025-12-15"
  maintainer: "CORTEX Planning Team"
  related_orchestrators:
    - "planning_orchestrator"  # Now uses Planning System
    - "ado_agent"
  documentation_path: ".github/prompts/modules/ado-planning-guide.md"
  integration_status: |
    Phase 6 Complete: Full Planning System integration with:
    - PlanningSession model for state management
    - Tiered routing (Tier 1-4 classification)
    - Historical context integration (anti-patterns, success patterns)
    - Visual progress tracking with 🎭 orchestrator hints
    - DoR/DoD compliance validation
    - TDD workflow integration

# ========================================
# Requirements (Inherited + ADO-Specific)
# ========================================

requirements:
  # ===== Inherited from Planning System =====
  
  - requirement_id: "REQ-001"
    name: "Acceptance Criteria Approval Gate"
    inherited_from: "planning-system"
    priority: "critical"
    status: "missing"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.approve_acceptance_criteria()"
    ado_specific_note: "Must work with ADO work item format"
    
  - requirement_id: "REQ-002"
    name: "Interactive DoR Workflow"
    inherited_from: "planning-system"
    priority: "critical"
    status: "missing"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.refine_dor_interactive()"
    
  - requirement_id: "REQ-003"
    name: "Contextual Review Orchestrator Integration"
    inherited_from: "planning-system"
    priority: "critical"
    status: "implemented"
    validation_method: "integration_test"
    validation_criteria: "Review orchestrator called before ADO item creation with context"
    ado_specific_note: |
      Context-aware review findings integrated into ADO work items.
      - Blocking issues → ADO Impediments
      - Critical issues → Linked tasks in story
      - Improvements → Optional tasks (lower priority)
    enhancement_date: "2025-12-09"
    
  - requirement_id: "REQ-004"
    name: "SWAG Estimation via Swagger"
    inherited_from: "planning-system"
    priority: "high"
    status: "missing"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.estimate_from_swagger()"
    ado_specific_note: "Estimation values mapped to ADO story points"
    
  - requirement_id: "REQ-005"
    name: "Visual Progress Rendering"
    inherited_from: "planning-system"
    priority: "high"
    status: "implemented"
    ado_specific_note: "Show ADO work item creation progress integrated into phase table"
    implementation:
      display_timing:
        - moment: "beginning"
          show: "complete_phase_table_with_work_items"
          description: "Show entire table with all phases and work item summary at start"
        - moment: "phase_completion"
          show: "overall_progress_and_next_phase"
          description: "Show overall progress bar and next phase only after each phase completes"
        - moment: "overall_completion"
          show: "complete_phase_table_with_work_items"
      progress_tracker_sync:
        inherited_from: "planning-system"
        enforcement_level: "MANDATORY"
        ado_specific_note: "Tracker sync includes ADO work item IDs and links"
        implementation:
          - "Each phase ends with: 'Update tracker with ADO work item details'"
          - "Sync work item IDs to tracking/ado-work-items.json"
          - "Update master plan progress with ADO completion status"
      bidirectional_linking:
        inherited_from: "planning-system"
        enforcement_level: "MANDATORY"
        ado_specific_additions:
          - "Link to ADO work items in Azure DevOps"
          - "Include work item URLs in navigation section"
          - "Track parent-child relationships between ADO items and plan phases"
    template_reference: "ado_execution_progress"
    format: "Markdown table (integrated progress bar)"
    includes:
      - "Overall progress bar in table header row"
      - "Work items created/planned count"
      - "Story points total"
      - "Phase-specific ADO item tracking"
    
    visual_progress_enforcement:
      description: |
        ALL ADO operation responses MUST include visual progress tracker.
        This matches the maintenance and planning prompt patterns for consistent UX.
      
      forbidden_behaviors:
        - "Phase completions without progress visualization"
        - "Text-only status updates (e.g., 'Phase 2 complete')"
        - "Skipping progress bars in autonomous mode"
        - "Displaying progress only at plan start/end (must show after EACH phase)"
        - "Omitting ADO-specific metrics (work items, story points)"
      
      required_behaviors:
        - "Render visual progress table after EVERY phase completion"
        - "Use ASCII progress bars: `██████████░░░░░░░░░░` format"
        - "Show overall progress percentage in header"
        - "Display phase status with emojis (✅ Complete, 🔄 In Progress, ⏳ Pending)"
        - "Include ADO metrics: work items created/planned, story points, links"
      
      required_format: |
        ---
        ### 📊 ADO WORK ITEM GENERATION STATUS
        
        **Overall Progress:** `████████░░░░░░░░░░░░` **XX%** {STATUS_EMOJI} {STATUS_TEXT}
        
        | Phase | Progress | Status |
        |-------|----------|--------|
        | Phase 1 - DISCOVERY | `██████████` | 100% ✅ Complete |
        | Phase 2 - VALIDATION | `████████░░` | 80% 🔄 In Progress |
        | Phase 3 - GENERATION | `░░░░░░░░░░` | 0% ⏳ Pending |
        | Phase 4 - APPROVAL | `░░░░░░░░░░` | 0% ⏳ Pending |
        | Phase 5 - EXECUTION | `░░░░░░░░░░` | 0% ⏳ Pending |
        | Phase 6 - COMPLETION | `░░░░░░░░░░` | 0% ⏳ Pending |
        
        📊 **Work Items:** XX/XX created | **Story Points:** XXX | **Status:** {STATUS}
        
        ---
      
      locations_requiring_tracker:
        - "Chat responses after each ADO phase completion"
        - "cortex-brain/documents/reports/ado-*.md (ADO operation reports)"
        - "ADO feature planning summaries"
      
      ado_specific_enhancements:
        work_item_metrics:
          - "Epics created/planned"
          - "Features created/planned"
          - "Tasks created/planned"
          - "Total story points"
        link_display:
          - "ADO work item URLs (clickable links)"
          - "Parent-child relationship indicators"
        status_indicators:
          - "✅ Created successfully"
          - "🔗 Linked to parent"
          - "⚠️ Creation pending"
          - "❌ Creation failed"
      
      implementation_references:
        template_file: "cortex-brain/response-templates-v4.yaml"
        template_component: "components.visual_progress.plan_tracker"
        renderer_method: "template_renderer.py::generate_phase_rows()"
        progress_bar_generator: "template_renderer.py::generate_progress_bar()"
        ado_orchestrator: "src/orchestrators/ado/ado_orchestrator.py"
      
      phase_transition_pattern: |
        After EACH ADO phase completion, IMMEDIATELY render:
        
        ✅ Phase {N} - {NAME}: Complete
           └─ Work Items: {created_count} created | Story Points: {points}
           └─ Duration: {seconds}s
           └─ Auto-proceeding to Phase {N+1}...
        
        ### 📊 ADO WORK ITEM GENERATION STATUS
        [Full progress table showing updated status + ADO metrics]
      
      reference_implementations:
        - source: ".github/prompts/cortex-maintenance.prompt.md"
          lines: "254-260"
          description: "Maintenance prompt demonstrates correct visual progress pattern"
        - source: "cortex-brain/manifests/orchestrators/planning-system-4.0-manifest.yaml"
          section: "REQ-005.visual_progress_enforcement"
          description: "Planning system visual progress enforcement rules"
    
  - requirement_id: "REQ-006"
    name: "Learning Library Auto-Documentation"
    inherited_from: "planning-system"
    priority: "high"
    status: "missing"
    ado_specific_note: "Document ADO planning strategies"
    
  - requirement_id: "REQ-007"
    name: "Interactive Threat Modeling"
    inherited_from: "planning-system"
    priority: "medium"
    status: "implemented"  # Phase 2: Security Enhancement
    ado_specific_note: "Threats added as ADO work items (type: Risk)"
    phase2_enhancement:
      description: |
        Phase 2 Security Enhancement: Automatic security story generation
        for ALL features. Security analysis is now MANDATORY.
      implementation:
        - "Security relevance automatically detected"
        - "STRIDE categories mapped to ADO Risk items"
        - "Security acceptance criteria auto-injected"
        - "Security testing tasks auto-generated"
      security_work_item_mapping:
        threat_to_risk:
          - stride_category: "Spoofing"
            ado_type: "Risk"
            priority: "2"
            title_template: "[Security] Spoofing Risk: {threat_name}"
          - stride_category: "Tampering"
            ado_type: "Risk"
            priority: "2"
            title_template: "[Security] Tampering Risk: {threat_name}"
          - stride_category: "Repudiation"
            ado_type: "Risk"
            priority: "3"
            title_template: "[Security] Repudiation Risk: {threat_name}"
          - stride_category: "Information Disclosure"
            ado_type: "Risk"
            priority: "1"
            title_template: "[Security] Information Disclosure Risk: {threat_name}"
          - stride_category: "Denial of Service"
            ado_type: "Risk"
            priority: "2"
            title_template: "[Security] DoS Risk: {threat_name}"
          - stride_category: "Elevation of Privilege"
            ado_type: "Risk"
            priority: "1"
            title_template: "[Security] Privilege Escalation Risk: {threat_name}"
      security_story_templates:
        - template_id: "SEC-STORY-001"
          title: "Security Testing Story"
          type: "User Story"
          description: |
            As a security-conscious development team,
            We need to perform comprehensive security testing,
            So that we can identify and remediate vulnerabilities before release.
          acceptance_criteria:
            - "OWASP ZAP security scan completed with no critical findings"
            - "Authentication bypass tests passed"
            - "Authorization boundary tests passed"
            - "Input validation and injection tests passed"
            - "Security code review completed"
          story_points: 5
        - template_id: "SEC-STORY-002"
          title: "Threat Model Review Story"
          type: "User Story"
          description: |
            As a security engineer,
            We need to review the threat model for this feature,
            So that we can ensure all security risks are identified and mitigated.
          acceptance_criteria:
            - "STRIDE analysis completed for all components"
            - "Data flow diagrams reviewed for security boundaries"
            - "Mitigation strategies documented for each threat"
            - "Residual risk accepted by product owner"
          story_points: 3
    
  - requirement_id: "REQ-008"
    name: "TDD Reminders Visibility"
    inherited_from: "planning-system"
    priority: "medium"
    status: "missing"
    ado_specific_note: "TDD requirements in ADO acceptance criteria"
    
  # ===== ADO-Specific Requirements =====
  
  - requirement_id: "REQ-ADO-001"
    name: "ADO API Authentication"
    description: "Secure authentication with Azure DevOps API using PAT"
    priority: "critical"
    status: "implemented"
    validation_method: "integration_test"
    validation_criteria: "ADO API calls succeed with valid PAT"
    
  - requirement_id: "REQ-ADO-002"
    name: "Work Item Type Mapping"
    description: |
      Map plan sections to ADO work item types:
      - Feature → Epic
      - Phase → Feature
      - Task → Task/User Story
      - Threat → Risk
    priority: "critical"
    status: "partial"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.map_to_ado_types()"
    
  - requirement_id: "REQ-ADO-003"
    name: "Parent-Child Relationship Management"
    description: "Maintain hierarchical relationships in ADO (Epic > Feature > Task)"
    priority: "high"
    status: "implemented"
    validation_method: "integration_test"
    validation_criteria: "ADO work items linked correctly"
    
  - requirement_id: "REQ-ADO-004"
    name: "Story Point Estimation"
    description: "Convert effort hours to story points using Fibonacci scale"
    priority: "high"
    status: "partial"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.convert_to_story_points()"
    
  - requirement_id: "REQ-ADO-005"
    name: "Area Path and Iteration Assignment"
    description: "Assign work items to correct area path and iteration"
    priority: "medium"
    status: "missing"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.assign_area_and_iteration()"
    
  - requirement_id: "REQ-ADO-006"
    name: "Bulk Work Item Creation"
    description: "Create multiple ADO work items in batch for performance"
    priority: "high"
    status: "missing"
    validation_method: "method_exists"
    validation_criteria: "ADOPlanningOrchestrator.create_items_batch()"
    
  - requirement_id: "REQ-ADO-007"
    name: "Work Item Link Generation"
    description: "Generate clickable ADO work item links in response"
    priority: "medium"
    status: "partial"
    validation_method: "template_validation"
    validation_criteria: "ADO links rendered in response template"

# ========================================
# Integrations
# ========================================

integrations:
  # Inherited integrations with ADO-specific notes
  
  - integration_id: "INT-001"
    target_component: "review_orchestrator"
    inherited_from: "planning-system"
    integration_type: "required"
    trigger_condition: "before_ado_planning_starts"
    ado_specific: |
      Context-aware review findings mapped to ADO work items:
      - Blocking issues → Impediment work items (blocks feature)
      - Critical issues → Task work items (linked to story, high priority)
      - Improvements → Task work items (linked to backlog, low priority)
      - Review score added to Epic/Feature description
    status: "implemented"
    enhancement_date: "2025-12-09"
    implementation_notes: |
      Inherits all contextual review capabilities from Planning System.
      ADO-specific mapping ensures findings become actionable work items.
    
  - integration_id: "INT-002"
    target_component: "threat_modeler_agent"
    inherited_from: "planning-system"
    integration_type: "conditional"
    trigger_condition: "feature_matches_security_keywords"
    ado_specific: "Each threat becomes ADO work item (type: Risk)"
    status: "missing"
    
  - integration_id: "INT-003"
    target_component: "git_checkpoint_orchestrator"
    inherited_from: "planning-system"
    integration_type: "required"
    trigger_condition: "after_ado_items_created"
    ado_specific: "Checkpoint after successful ADO API calls"
    status: "missing"
    
  # ADO-specific integrations
  
  - integration_id: "INT-ADO-001"
    target_component: "azure_devops_api"
    integration_type: "required"
    trigger_condition: "always"
    expected_behavior: "Create, update, link ADO work items via REST API"
    validation_method: "integration_test"
    status: "implemented"
    
  - integration_id: "INT-ADO-002"
    target_component: "ado_agent"
    integration_type: "required"
    trigger_condition: "always"
    expected_behavior: "Use ADO agent for API interactions and validation"
    validation_method: "method_exists"
    status: "partial"
    
  - integration_id: "INT-ADO-003"
    target_component: "planning_system"
    integration_type: "required"
    trigger_condition: "always"
    expected_behavior: "Share DoR/DoD, phases, TDD requirements with Planning System"
    validation_method: "integration_test"
    status: "partial"
    notes: "Parity requirement - must use same planning logic"

# ========================================
# Quality Gates
# ========================================

quality_gates:
  # Inherited gates
  
  - gate_id: "GATE-001"
    name: "Skeleton Approval"
    inherited_from: "planning-system"
    gate_type: "approval"
    blocking: true
    status: "missing"
    
  - gate_id: "GATE-005"
    name: "Acceptance Criteria Approval"
    inherited_from: "planning-system"
    gate_type: "approval"
    trigger_point: "before_ado_item_creation"
    blocking: true
    status: "missing"
    priority: "critical"
    
  - gate_id: "GATE-006"
    name: "DoR Completeness Validation"
    inherited_from: "planning-system"
    gate_type: "validation"
    blocking: true
    status: "missing"
    priority: "critical"
    
  # ADO-specific gates
  
  - gate_id: "GATE-ADO-001"
    name: "ADO Authentication Validation"
    gate_type: "validation"
    trigger_point: "before_api_calls"
    blocking: true
    validation_criteria: "PAT token valid, project accessible"
    status: "implemented"
    
  - gate_id: "GATE-ADO-002"
    name: "Work Item Hierarchy Validation"
    gate_type: "validation"
    trigger_point: "after_item_creation"
    blocking: false
    validation_criteria: "All parent-child links established correctly"
    status: "partial"
    
  - gate_id: "GATE-ADO-003"
    name: "Story Point Validation"
    gate_type: "validation"
    trigger_point: "before_item_creation"
    blocking: false
    validation_criteria: "All work items have valid story points (Fibonacci)"
    status: "missing"

# ========================================
# Workflows
# ========================================

workflows:
  - workflow_id: "WF-ADO-001"
    name: "ADO Planning Workflow"
    description: "Complete ADO work item generation workflow"
    phases:
      - phase_id: "PHASE-ADO-0"
        name: "Pre-ADO Planning"
        sequence: 0
        required: true
        steps:
          - step_id: "STEP-ADO-0.1"
            name: "Run Architectural Review"
            required: true
            validation: "review_orchestrator.execute() called"
            status: "missing"
          - step_id: "STEP-ADO-0.2"
            name: "Interactive DoR Refinement"
            required: true
            validation: "refine_dor_interactive() completes"
            status: "missing"
          - step_id: "STEP-ADO-0.3"
            name: "Authenticate with ADO"
            required: true
            validation: "ADO API authentication succeeds"
            status: "implemented"
            
      - phase_id: "PHASE-ADO-1"
        name: "Work Item Planning"
        sequence: 1
        required: true
        steps:
          - step_id: "STEP-ADO-1.1"
            name: "Generate Work Item Structure"
            required: true
            validation: "Epic/Feature/Task hierarchy generated"
            status: "implemented"
          - step_id: "STEP-ADO-1.2"
            name: "Map Effort to Story Points"
            required: true
            validation: "Hours converted to Fibonacci story points"
            status: "partial"
          - step_id: "STEP-ADO-1.3"
            name: "Inject TDD Requirements"
            required: true
            validation: "TDD acceptance criteria added to work items"
            status: "missing"
          - step_id: "STEP-ADO-1.4"
            name: "Run Threat Modeling"
            required: true  # Phase 2: Now MANDATORY for all features
            validation: "Threats converted to Risk work items"
            status: "implemented"  # Phase 2: Security Enhancement
            phase2_enhancement:
              description: "Phase 2 Security Enhancement - Automatic threat modeling"
              behavior:
                - "Security relevance automatically detected from feature description"
                - "STRIDE analysis performed for all security-relevant domains"
                - "Threats mapped to ADO Risk work items"
                - "Security testing user story auto-generated"
                - "Security acceptance criteria injected into parent Feature"
              trigger_condition: "ALWAYS (not conditional on security keywords)"
              knowledge_references:
                - "cortex-brain/knowledge-library/security/threat-modeling-framework.md"
                - "cortex-brain/knowledge-library/security/owasp-top-10-guide.md"
          - step_id: "STEP-ADO-1.5"
            name: "Generate Security Work Items"
            required: true
            validation: "Security stories and risk items created"
            status: "implemented"  # Phase 2: Security Enhancement
            phase2_enhancement:
              description: "Phase 2 Security Enhancement - Security work item generation"
              work_items_generated:
                - type: "User Story"
                  title: "[Security] Security Testing for {feature_name}"
                  condition: "ALWAYS"
                - type: "Risk"
                  title: "[Security] {stride_category}: {threat_description}"
                  condition: "For each identified STRIDE threat"
                - type: "Task"
                  title: "[Security] Implement mitigation: {mitigation_name}"
                  condition: "For each critical/high threat"
            
      - phase_id: "PHASE-ADO-2"
        name: "Work Item Creation"
        sequence: 2
        required: true
        steps:
          - step_id: "STEP-ADO-2.1"
            name: "Acceptance Criteria Approval Gate"
            required: true
            validation: "User approves before ADO API calls"
            status: "missing"
          - step_id: "STEP-ADO-2.2"
            name: "Create ADO Work Items (Batch)"
            required: true
            validation: "All work items created via API"
            status: "partial"
          - step_id: "STEP-ADO-2.3"
            name: "Establish Parent-Child Links"
            required: true
            validation: "Hierarchy links established"
            status: "implemented"
          - step_id: "STEP-ADO-2.4"
            name: "Git Checkpoint After Creation"
            required: true
            validation: "git_checkpoint.create_auto_checkpoint() called"
            status: "missing"
            
      - phase_id: "PHASE-ADO-3"
        name: "Documentation & Finalization"
        sequence: 3
        required: true
        steps:
          - step_id: "STEP-ADO-3.1"
            name: "Generate ADO Work Item Links"
            required: true
            validation: "Clickable links in response"
            status: "partial"
          - step_id: "STEP-ADO-3.2"
            name: "Document to Learning Library"
            required: false
            validation: "ADO planning strategy documented"
            status: "missing"
          - step_id: "STEP-ADO-3.3"
            name: "Show Visual Progress Summary"
            required: false
            validation: "Progress table in response"
            status: "missing"

# ========================================
# Response Templates (Composable System)
# ========================================

response_templates:
  use_algorithm: true
  algorithm_version: "1.0"
  algorithm_source: "cortex-brain/response-templates-v4.yaml::template_selection_algorithm"
  
  response_instructions: |
    CRITICAL: When orchestrator_engaged is true (autonomous execution):
    - MUST use cortex_header_shield block (includes 🛡️ shield icon)
    - Header format: "## 🛡️🧠 CORTEX {title}"
    - Shield icon provides visual confirmation of autonomous orchestrator engagement
    - This enforces AUTONOMOUS_EXECUTION_PROTECTION brain protection rule
  
  # Legacy template definition (for reference only)
  legacy:
    template_id: "TPL-ADO-001"
    template_name: "ado_agent"
    status: "deprecated"
    replaced_by: "composable_blocks_system"
  
  operations:
    story_creation:
      description: "ADO work item generation in progress"
      context_signals:
        operation_type: "ado"
        response_phase: "in_progress"
        complexity_tier: "COMPREHENSIVE"
        orchestrator_type: "ado"
        orchestrator_engaged: true
      blocks:
        mandatory: ["cortex_header_shield", "progress_tracker_standard", "work_item_summary", "ado_auth_status", "plan_file_link", "next_action"]
        conditional: ["ado_links", "validation_status_dor_dod"]
        orchestrator_specific: ["work_item_summary", "ado_links", "ado_auth_status"]
      rendering_order: ["cortex_header_shield", "progress_tracker_standard", "work_item_summary", "ado_links", "ado_auth_status", "plan_file_link", "next_action"]
    
    feature_breakdown:
      description: "ADO feature breakdown complete"
      context_signals:
        operation_type: "ado"
        response_phase: "complete"
        complexity_tier: "STRUCTURED"
        orchestrator_type: "ado"
        orchestrator_engaged: true
      blocks:
        mandatory: ["cortex_header_shield", "progress_tracker_standard", "work_item_summary", "ado_links", "ado_auth_status", "achievements"]
        conditional: ["plan_file_link"]
        orchestrator_specific: ["work_item_summary", "ado_links", "ado_auth_status"]
      rendering_order: ["cortex_header_shield", "progress_tracker_standard", "work_item_summary", "ado_links", "achievements", "ado_auth_status"]
      completion_format: "🎉 CONGRATULATIONS"

# ========================================
# Knowledge Library Integration (NEW)
# ========================================

knowledge_library_integration:
  enabled: true
  version: "1.0.0"
  description: "Automatic integration of knowledge library best practices in ADO work items"
  enforcement_rule: "KNOWLEDGE_LIBRARY_INTEGRATION_ENFORCEMENT"
  inherited_from: "planning-system-4.0-manifest.yaml"
  source: "cortex-brain/brain-protection-rules.yaml"
  ado_specific_enhancements: true
  
  integration_points:
    acceptance_criteria:
      action: "Inject library checklist items into acceptance criteria"
      format: |
        **Acceptance Criteria:**
        - [ ] Feature functionality works as specified
        - [ ] {{#each library_items}}
        - [ ] {{library_name}}: {{checklist_item}}
        {{/each}}
      example: |
        - [ ] OWASP A01: Access control verified at API level
        - [ ] GDPR Art. 25: Privacy by design implemented
    
    work_item_description:
      action: "Add knowledge library references section"
      section_title: "📚 Knowledge Library References"
      format: |
        ### 📚 Knowledge Library References
        
        This work item should follow these best practices:
        
        {{#each applicable_files}}
        **{{domain}} - {{file_name}}**
        - **Relevant Sections:** {{sections}}
        - **Checklist Items:** {{checklist_items}}
        - **Validation:** {{validation_criteria}}
        {{/each}}
    
    linked_tasks:
      action: "Create linked tasks for security/compliance validation"
      condition: "security OR compliance domain detected"
      task_type: "ADO Task"
      link_type: "Child"
      examples:
        - title: "Security Review - OWASP A01 Validation"
          description: "Verify access control implementation against OWASP A01 guidelines"
          assigned_to: "Security Team"
        - title: "GDPR Compliance Check - Data Protection"
          description: "Validate data handling against GDPR requirements"
          assigned_to: "Compliance Officer"
  
  domain_detection:
    inherited_from: "planning-system"
    ado_specific_fields:
      - "work_item_title"
      - "work_item_description"
      - "user_story"
      - "acceptance_criteria"
      - "tags"
  
  output_format:
    work_item_custom_fields:
      knowledge_library_refs:
        field_name: "Custom.KnowledgeLibraryReferences"
        type: "html"
        format: "bulleted list with links"
      compliance_requirements:
        field_name: "Custom.ComplianceRequirements"
        type: "string"
        format: "comma-separated list"
      security_considerations:
        field_name: "Custom.SecurityConsiderations"
        type: "html"
        format: "checklist"
  
  validation:
    requirement: "Security/compliance work items MUST include library references"
    validation_phase: "Before ADO API call"
    failure_action: "Block + require library reference addition"
    warning_threshold: "0 library references for detected security/compliance domain"

# ========================================
# Vision API Integration
# ========================================

vision_api_integration:
  enabled: true
  visual_indicator:
    required: true
    icon: "📷"
    header_format: "## 📷🧠 CORTEX ADO Work Item Generation (Vision Engaged)"
  
  image_detection:
    automatic: true
    supported_formats: ["PNG", "JPG", "JPEG", "WEBP", "GIF"]
    trigger_condition: "Any image attachment detected in ADO work item request"
  
  analysis_configuration:
    comprehensive_extraction:
      priority_1_requirements:
        - "UI mockups → Extract user stories and acceptance criteria"
        - "Wireframes → Identify user flows and navigation patterns"
        - "Design specs → Extract visual requirements"
        - "Error screenshots → Identify bug reproduction steps"
      
      priority_2_work_item_details:
        - "Functional requirements from visuals"
        - "Technical constraints visible in image"
        - "Integration touchpoints"
        - "Test automation opportunities"
      
      priority_3_acceptance_criteria:
        - "Visual validation requirements"
        - "UI element presence checks"
        - "Layout and styling expectations"
        - "Interaction behaviors"
    
    output_format:
      structured_sections:
        - name: "image_metadata"
          includes: ["dimensions", "format", "url_context", "work_item_context"]
        
        - name: "user_story_extraction"
          includes: ["as_a_user", "i_want", "so_that", "visual_reference"]
        
        - name: "acceptance_criteria"
          includes: ["testable_criteria", "visual_validation", "test_selectors"]
        
        - name: "test_automation_tasks"
          includes: ["automation_selectors", "test_scenarios", "expected_behaviors"]
        
        - name: "technical_details"
          includes: ["implementation_hints", "component_structure", "integration_points"]
  
  ado_specific_integration:
    user_story_generation:
      when: "Image shows UI mockup or feature design"
      action: "Extract user story from visual requirements"
      output_template: |
        ### 📷 Vision Analysis - User Story Extraction
        
        **Image Context:** {{image_type}}
        {{#if url_detected}}
        **Reference URL:** {{url}}
        {{/if}}
        
        **User Story:**
        - **As a** {{user_role}}
        - **I want** {{desired_functionality}}
        - **So that** {{business_value}}
        
        **Visual Requirements:**
        {{#each visual_elements}}
        - {{element_name}}: {{description}}
        {{/each}}
        
        **Acceptance Criteria (Vision-Derived):**
        {{#each acceptance_criteria}}
        - [ ] {{criterion}}
          - Visual Reference: {{screenshot_section}}
          - Test Selector: `{{test_selector}}`
          - Validation Method: {{validation_approach}}
        {{/each}}
        
        **Test Automation Selectors:**
        | Element | Selector | Type | Expected Behavior |
        |---------|----------|------|-------------------|
        {{#each test_selectors}}
        | {{element_name}} | `{{selector}}` | {{selector_type}} | {{behavior}} |
        {{/each}}
      
      ado_field_mapping:
        title: "Extracted from primary feature identified"
        description: "Include vision analysis summary + visual requirements"
        acceptance_criteria: "Visual validation requirements from image"
        tags:
          - "vision-derived"
          - "{{complexity_level}}"
          - "ui-automation"
      
      integration_points:
        - field: "description"
          content: "Full vision analysis with HTML structure"
        
        - field: "acceptance_criteria"
          content: "Testable criteria with test selectors"
        
        - field: "tasks"
          content: "Test automation tasks with selectors"
        
        - field: "attachments"
          content: "Original image as work item attachment"
    
    bug_work_item_generation:
      when: "Image shows error message, broken UI, or unexpected behavior"
      action: "Extract bug details from screenshot"
      output_template: |
        ### 📷 Vision Analysis - Bug Report
        
        **Error Detection:**
        {{#if error_message_detected}}
        ```
        {{extracted_error_text}}
        ```
        {{/if}}
        
        **Reproduction Steps (Visual):**
        {{#each repro_steps}}
        1. {{step_description}}
           - Element: `{{element_selector}}`
           - Action: {{user_action}}
        {{/each}}
        
        **Expected vs. Actual:**
        - Expected: {{expected_behavior}}
        - Actual: {{actual_behavior}} (visible in screenshot)
        
        **Environment Details:**
        {{#if url_detected}}
        - URL: {{url}}
        {{/if}}
        {{#if browser_detected}}
        - Browser: {{browser_info}}
        {{/if}}
        {{#if device_detected}}
        - Device: {{device_info}}
        {{/if}}
      
      ado_field_mapping:
        title: "Bug - {{extracted_issue_summary}}"
        repro_steps: "Vision-derived reproduction steps"
        system_info: "Extracted from screenshot (URL, browser, device)"
        severity: "Inferred from error type"
        tags:
          - "vision-derived"
          - "screenshot-attached"
          - "{{error_category}}"
    
    feature_work_item_generation:
      when: "Image shows architecture diagram or system design"
      action: "Extract technical requirements and implementation tasks"
      output_template: |
        ### 📷 Vision Analysis - Feature Requirements
        
        **Architecture Components:**
        {{#each components}}
        | Component | Type | Responsibilities | Integration Points |
        |-----------|------|------------------|-------------------|
        | {{name}} | {{type}} | {{responsibilities}} | {{integrations}} |
        {{/each}}
        
        **Implementation Tasks:**
        {{#each implementation_tasks}}
        - [ ] {{task_name}}
          - Component: {{component}}
          - Complexity: {{complexity}}
          - Dependencies: {{dependencies}}
          - Test Strategy: {{test_approach}}
        {{/each}}
        
        **Test Automation Requirements:**
        {{#each test_requirements}}
        - {{test_type}}: {{test_description}}
          - Scope: {{test_scope}}
          - Automation Level: {{automation_level}}
        {{/each}}
      
      ado_field_mapping:
        title: "Feature - {{extracted_feature_name}}"
        description: "Architecture analysis + technical requirements"
        tasks: "Generated from component breakdown"
        linked_items: "Dependencies identified from diagram"
        tags:
          - "vision-derived"
          - "architecture-driven"
          - "{{complexity_level}}"
  
  work_item_enhancement:
    automatic_enrichment:
      description_field:
        - "Include full vision analysis output"
        - "Add inferred HTML structure"
        - "Embed test automation selectors"
      
      acceptance_criteria_field:
        - "Visual validation requirements"
        - "UI element presence checks"
        - "Test automation selectors for each criterion"
      
      tasks_field:
        - "Generate test automation task per UI element"
        - "Include recommended selector strategy"
        - "Add visual regression test tasks"
      
      tags_field:
        - "vision-derived" (always added)
        - "{{complexity_level}}" (low/medium/high)
        - "ui-automation" (if UI elements detected)
        - "accessibility-required" (if a11y issues found)
    
    attachment_handling:
      action: "Attach original image to ADO work item"
      attachment_comment: "Vision API analysis source - {{analysis_timestamp}}"
  
  error_handling:
    vision_api_unavailable:
      action: "Continue with manual work item creation"
      message: "⚠️ Vision API unavailable - proceeding with text-based work item"
    
    image_analysis_failed:
      action: "Create work item without vision enhancement"
      message: "⚠️ Image analysis failed - work item created without visual requirements"
    
    no_requirements_detected:
      action: "Provide generic image description in work item"
      message: "📷 Image attached but no requirements detected - manual interpretation needed"
  
  output_artifacts:
    work_item_fields:
      - "title" # Extracted from primary feature
      - "description" # Full vision analysis
      - "acceptance_criteria" # Visual validation requirements
      - "tasks" # Test automation tasks
      - "tags" # vision-derived, complexity, etc.
      - "attachments" # Original image
    
    additional_documentation:
      - "Visual Requirements Summary"
      - "Test Automation Strategy"
      - "Selector Recommendations"

# ========================================
# Continuous Risk Analysis (ADO-Specific)
# ========================================

continuous_risk_analysis:
  enabled: true
  inherited_from: "planning-system-4.0-manifest.yaml::continuous_risk_analysis"
  enforcement_rule: "CONTINUOUS_RISK_ANALYSIS_ENFORCEMENT"
  visual_indicator:
    required: true
    icon: "💀"
    section_header: "### 💀 Risk Analysis & Recommendations (Work Item Enhancement)"
  
  execution_frequency:
    trigger: "Every user interaction turn during ADO work item generation"
    timing: "After user input, before work item creation"
    scope: "Analyze work item requirements + acceptance criteria + tasks"
  
  ado_specific_enhancements:
    risk_to_acceptance_criteria:
      description: "Convert risk findings into testable acceptance criteria"
      format: "[ ] System {{risk_validation}} ({{category}} Risk #{{number}})"
      examples:
        - "[ ] System handles SQL injection attempts gracefully (Security Risk #1)"
        - "[ ] Dashboard loads in <2s with 1000+ orders (Performance Risk #2)"
        - "[ ] Deployment rollback completes in <5 minutes (Deployment Risk #3)"
    
    risk_to_linked_tasks:
      description: "Create separate work items for critical risks"
      conditions:
        - impact: "critical"
          action: "Create linked Bug/Impediment work item"
        - impact: "high"
          action: "Create linked Task work item"
      
      task_template:
        title: "[{{category}}] {{risk_summary}}"
        work_item_type: "{{Bug|Task|Impediment}}"
        description: |
          **Risk Category:** {{category}}
          **Impact:** {{impact_level}}
          **Identified During:** ADO Planning Turn {{turn_number}}
          
          **Problem:**
          {{risk_description}}
          
          **Recommendation:**
          {{mitigation_strategy}}
          
          **Acceptance Criteria:**
          {{#each validation_steps}}
          - [ ] {{validation_step}}
          {{/each}}
        
        link_type: "Related" # Link to original user story/feature
        tags: ["risk-mitigation", "{{category}}", "{{impact_level}}"]
    
    risk_to_work_item_tags:
      auto_generated_tags:
        - "risk-{{category}}" # e.g., "risk-security", "risk-performance"
        - "impact-{{level}}" # e.g., "impact-critical", "impact-high"
        - "requires-{{expertise}}" # e.g., "requires-security-review", "requires-performance-testing"
      
      examples:
        - "risk-security"
        - "risk-performance"
        - "impact-critical"
        - "requires-security-review"
    
    risk_to_description_field:
      enhancement: "Add dedicated 'Risk Mitigation' section to work item description"
      format: |
        ## 📋 Requirements
        {{user_story_requirements}}
        
        ## ⚠️ Risk Mitigation Strategy
        
        {{#each accepted_risks}}
        ### {{category_icon}} {{category_name}} - {{risk_title}}
        
        **Risk:** {{risk_description}}
        **Impact:** {{impact_level}} | **Likelihood:** {{likelihood}}
        
        **Mitigation:**
        {{mitigation_steps}}
        
        **Validation:**
        {{validation_approach}}
        
        ---
        {{/each}}
        
        ## ✅ Acceptance Criteria
        {{acceptance_criteria_including_risk_validation}}
  
  recommendation_template_ado: |
    ### 💀 Risk Analysis & Recommendations (Work Item Enhancement)
    
    **Analysis Run:** Turn {{turn_number}}
    **Work Item Type:** {{work_item_type}}
    
    {{#each risk_categories}}
    #### {{category_icon}} {{category_name}}
    
    {{#each findings}}
    **Finding {{finding_number}}:** {{risk_description}}
    
    - **Impact:** {{impact_icon}} {{impact_level}}
    - **Likelihood:** {{likelihood}}
    - **Work Item Impact:** {{ado_impact_description}}
    
    **💡 Recommended Enhancement:**
    {{recommendation_text}}
    
    **🔄 Proposed Work Item Changes:**
    - **Acceptance Criteria:** Add "{{acceptance_criterion}}"
    - **Tasks:** Add "{{mitigation_task}}"
    {{#if create_linked_item}}
    - **Linked Item:** Create {{linked_item_type}} - "{{linked_item_title}}"
    {{/if}}
    - **Tags:** Add {{#each tags}}`{{this}}`{{/each}}
    
    {{#if smarter_alternative}}
    **🔄 Smarter Alternative:**
    {{smarter_alternative}}
    {{/if}}
    
    **❓ Decision Required:**
    - ✅ **Yes - Enhance Work Item** (Integrate risk mitigation)
    - ❌ **No - Skip for Now** (Re-analyze next turn)
    
    ---
    {{/each}}
    {{/each}}
  
  user_response_handling_ado:
    accept:
      actions:
        - "Add to acceptance_criteria field"
        - "Create mitigation task in tasks field"
        - "Add risk tags to work item"
        - "Add Risk Mitigation section to description"
        - "Create linked work items if CRITICAL/HIGH"
        - "Update risk register"
      
      acceptance_criteria_format: "[ ] {{risk_validation}} ({{category}} Risk #{{number}})"
      
      task_format: "- [ ] {{mitigation_action}} (Mitigates {{category}} Risk #{{number}})"
      
      example_enhancement:
        before: |
          Title: User Authentication
          Acceptance Criteria:
          - [ ] User can log in with email/password
          - [ ] User can log out
        
        after: |
          Title: User Authentication
          Acceptance Criteria:
          - [ ] User can log in with email/password
          - [ ] User can log out
          - [ ] System prevents SQL injection in login form (Security Risk #1)
          - [ ] System implements rate limiting (3 attempts per minute) (Security Risk #2)
          
          Tasks:
          - [ ] Implement parameterized queries for auth
          - [ ] Add rate limiting middleware
          - [ ] Add security unit tests
          
          Tags: risk-security, impact-critical, requires-security-review
    
    reject:
      actions:
        - "Log rejection in work item comments"
        - "Track reason if provided"
        - "Re-analyze on next turn"
        - "Escalate if CRITICAL risk rejected"
  
  output_artifacts_ado:
    risk_analysis_attachments:
      - "risk-analysis-turn-{{N}}.md" # Attach to work item as file
      - "accepted-risks-summary.md" # Attach to work item
    
    work_item_comments:
      auto_comment_on_creation: |
        ⚠️ **Risk Analysis Performed**
        
        Turn {{turn_number}} identified {{risk_count}} risks:
        - 🔴 Critical: {{critical_count}}
        - 🟠 High: {{high_count}}
        - 🟡 Medium: {{medium_count}}
        - 🟢 Low: {{low_count}}
        
        Accepted: {{accepted_count}} | Rejected: {{rejected_count}}
        
        See attached risk-analysis-turn-{{turn_number}}.md for details.
  
  integration_with_work_item_types:
    user_story:
      risk_focus: "Security, performance, edge cases, data integrity"
      acceptance_criteria_enhancement: true
      linked_tasks_generation: true
    
    feature:
      risk_focus: "Architecture, scalability, integration, deployment"
      acceptance_criteria_enhancement: true
      linked_tasks_generation: true
      linked_items_generation: true # Create technical spike for high-risk areas
    
    bug:
      risk_focus: "Root cause analysis, regression prevention, deployment safety"
      acceptance_criteria_enhancement: true
      linked_tasks_generation: false # Bug already has repro steps
    
    task:
      risk_focus: "Implementation edge cases, testing coverage"
      acceptance_criteria_enhancement: true
      linked_tasks_generation: false
  
  example_interaction_ado:
    turn_2: |
      ## 🧠 CORTEX ADO Work Item Generation
      
      [Work item content...]
      
      ### 💀 Risk Analysis & Recommendations (Work Item Enhancement)
      
      **Analysis Run:** Turn 2
      **Work Item Type:** User Story
      
      #### 🔒 Security Vulnerabilities
      
      **Finding 1:** SQL Injection Risk in Search Feature
      
      - **Impact:** 🔴 CRITICAL
      - **Likelihood:** Very Likely
      - **Work Item Impact:** User story lacks input validation acceptance criteria
      
      **💡 Recommended Enhancement:**
      Add security-focused acceptance criteria and create linked security review task.
      
      **🔄 Proposed Work Item Changes:**
      - **Acceptance Criteria:** Add "[ ] System prevents SQL injection in search inputs"
      - **Tasks:** Add "- [ ] Implement parameterized queries using SQLAlchemy"
      - **Linked Item:** Create Task - "[Security] Implement Input Validation Middleware"
      - **Tags:** Add `risk-security` `impact-critical` `requires-security-review`
      
      **🔄 Smarter Alternative:**
      Use ElasticSearch for search functionality instead of SQL LIKE queries. Provides built-in sanitization, better performance, and prevents injection by design.
      
      **❓ Decision Required:**
      - ✅ **Yes - Enhance Work Item** (Integrate risk mitigation)
      - ❌ **No - Skip for Now** (Re-analyze next turn)
      
      ---
      
      **Next:** Please respond Yes/No, or provide your next input.
  
  escalation_rules_ado:
    critical_risk_rejected:
      action: "Add comment to work item flagging unmitigated critical risk"
      comment_template: |
        ⚠️ **CRITICAL RISK FLAGGED**
        
        A critical risk was identified but not integrated into this work item:
        
        **Risk:** {{risk_description}}
        **Category:** {{category}}
        **Recommended Mitigation:** {{mitigation_strategy}}
        
        Consider addressing before deployment.
      
      tag_addition: "unmitigated-critical-risk"

# ========================================
# Compliance Rules
# ========================================

compliance_rules:
  - rule_id: "PARITY_WITH_PLANNING_2.0"
    source: "planning-system-manifest.yaml"
    enforcement_level: "mandatory"
    validation_method: "feature_comparison"
    description: "Must implement all Planning System features for ADO context"
    
  - rule_id: "TDD_ENFORCEMENT"
    inherited_from: "planning-system"
    enforcement_level: "mandatory"
    validation_method: "TDD requirements in ADO acceptance criteria"
    
  - rule_id: "DOCUMENT_ORGANIZATION"
    inherited_from: "planning-system"
    enforcement_level: "mandatory"
    validation_method: "ADO planning docs organized correctly"

# ========================================
# Parity Checklist
# ========================================

parity_checklist:
  description: "Features that MUST match Planning System"
  items:
    - feature: "Interactive DoR Workflow"
      planning_status: "missing"
      ado_status: "missing"
      parity: true
    - feature: "Review Orchestrator Integration"
      planning_status: "missing"
      ado_status: "missing"
      parity: true
    - feature: "Threat Modeling"
      planning_status: "implemented"
      ado_status: "implemented"  # Phase 2: Security Enhancement
      parity: true
      phase2_note: "Automatic threat modeling now MANDATORY for all features"
    - feature: "Security Work Item Generation"
      planning_status: "implemented"
      ado_status: "implemented"  # Phase 2: Security Enhancement
      parity: true
      phase2_note: "Security stories and risk items auto-generated"
    - feature: "TDD Requirements Injection"
      planning_status: "implemented"
      ado_status: "missing"
      parity: false
    - feature: "Learning Library Documentation"
      planning_status: "partial"
      ado_status: "missing"
      parity: false
    - feature: "Visual Progress Rendering"
      planning_status: "partial"
      ado_status: "missing"
      parity: false
    - feature: "Acceptance Criteria Gate"
      planning_status: "missing"
      ado_status: "missing"
      parity: true
    - feature: "SWAG Estimation"
      planning_status: "missing"
      ado_status: "missing"
      parity: true

# ========================================
# Validation Configuration
# ========================================

validation:
  on_initialization:
    enabled: true
    strict_mode: true
    fail_on_parity_violations: true
    log_level: "warning"
    
  on_execution:
    enabled: true
    validate_gates: true
    validate_ado_connectivity: true
    validate_parity_with_planning: true
    
  drift_detection:
    enabled: true
    check_frequency: "on_healthcheck"
    report_missing_features: true
    report_path: "cortex-brain/documents/reports/ado-planning-drift-report.md"
    compare_with_planning_2.0: true

# ========================================
# Post-Creation Actions
# ========================================

post_creation_actions:
  description: "Mandatory actions after ADO plan/work item creation completes"
  enabled: true
  actions:
    - action_id: "PCA-ADO-001"
      name: "Provide Clickable Plan Link"
      priority: "mandatory"
      description: |
        After creating an ADO plan, ALWAYS provide a clickable markdown link
        in the Copilot Chat response so user can open the plan in editor.
      format: |
        📄 **ADO Plan Created:** [{{plan_filename}}]({{plan_path}})
        
        Click the link above to open the plan in the editor for review.
      example: |
        📄 **ADO Plan Created:** [my-feature-ado-plan.yaml](cortex-brain/documents/planning/active/ado/my-feature-ado-plan.yaml)
        
        Click the link above to open the plan in the editor for review.
      
    - action_id: "PCA-ADO-002"
      name: "Work Item Summary"
      priority: "mandatory"
      description: "Show work item creation summary"
      format: |
        ### 🎫 Work Items Generated
        
        | Type | Count | Status |
        |------|-------|--------|
        | Epic | {{epic_count}} | {{epic_status}} |
        | Feature | {{feature_count}} | {{feature_status}} |
        | User Story | {{story_count}} | {{story_status}} |
        | Task | {{task_count}} | {{task_status}} |
        
        📄 **Plan File:** [{{plan_filename}}]({{plan_path}})

