# Panel Styling Manifest v1.0
# Natural Language Glassmorphism Styling Orchestrator

schema_version: "1.0"
orchestrator_name: "Panel Styler"
orchestrator_type: "GUIDED"
version: "1.0"

# Orchestrator Metadata
metadata:
  description: "Natural language glassmorphism panel styling using named taxonomy"
  author: "Asif Hussain"
  created: "2026-01-03"
  phase: "Phase 6: CORTEX Integration"
  plan_reference: "glassmorphism-css-standardization"
  
  features:
    - "11 named panel styles (tetris, intro, compact-cards, etc.)"
    - "Natural language parsing: 'style X like Y'"
    - "BEM class name resolution"
    - "HTML/CSS preview generation"
    - "Fuzzy panel matching"
    - "Multi-pattern command support"
  
  capabilities:
    - "Panel taxonomy lookup"
    - "Command pattern matching (5 patterns)"
    - "Interactive styling suggestions"
    - "CSS import guidance"
    - "Example HTML generation"

# Command Patterns
command_patterns:
  - pattern: "style X like Y"
    example: "style dashboard like tetris"
    regex: "style\\s+(.+?)\\s+like\\s+(\\w+(?:-\\w+)*)"
    confidence: 1.0
  
  - pattern: "make X look like Y"
    example: "make card look like intro panel"
    regex: "make\\s+(.+?)\\s+look\\s+like\\s+(\\w+(?:-\\w+)*)"
    confidence: 1.0
  
  - pattern: "use Y panel/layout/style"
    example: "use grid-cards layout"
    regex: "use\\s+(\\w+(?:-\\w+)*)\\s+(?:panel|layout|style)"
    confidence: 1.0
  
  - pattern: "apply Y to X"
    example: "apply neon-glass to button"
    regex: "apply\\s+(\\w+(?:-\\w+)*)\\s+to\\s+(.+)"
    confidence: 1.0
  
  - pattern: "Y style for X"
    example: "tetris style for metrics"
    regex: "(\\w+(?:-\\w+)*)\\s+style\\s+for\\s+(.+)"
    confidence: 1.0

# Panel Taxonomy (11 Styles)
panel_taxonomy:
  tetris:
    name: "Tetris Panel"
    class: ".panel-tetris"
    use_case: "Compact metrics grid (6+ tiles, dashboard KPIs)"
    visual: "Horizontal icon+value pairs in responsive grid"
    
  intro:
    name: "Intro Panel"
    class: ".panel-intro"
    use_case: "Hero description card (landing sections, CTAs)"
    visual: "Large centered card with gradient background"
  
  compact-cards:
    name: "Compact Cards"
    class: ".panel-compact-cards"
    use_case: "Horizontal capability row (5-6 cards)"
    visual: "Grid of cards with icon+title+description"
  
  grid-cards:
    name: "Grid Cards"
    class: ".panel-grid-cards"
    use_case: "Detailed grid layout (2x3/3x3)"
    visual: "Multi-column grid with detailed content and badges"
  
  hero-glass:
    name: "Hero Glass"
    class: ".panel-hero-glass"
    use_case: "Full-width hero sections (landing pages)"
    visual: "Full-width panel with strong blur and centered content"
  
  sidebar-glass:
    name: "Sidebar Glass"
    class: ".panel-sidebar-glass"
    use_case: "Navigation/filter panels (vertical, sticky)"
    visual: "Vertical sidebar with sections and sticky positioning"
  
  modal-glass:
    name: "Modal Glass"
    class: ".panel-modal-glass"
    use_case: "Overlay dialogs (confirmations, forms)"
    visual: "Centered overlay with header, content, footer"
  
  toast-glass:
    name: "Toast Glass"
    class: ".panel-toast-glass"
    use_case: "Notifications/alerts (4 variants)"
    visual: "Small floating panel with icon, message, auto-dismiss"
    variants:
      - ".panel-toast-glass--success"
      - ".panel-toast-glass--error"
      - ".panel-toast-glass--warning"
      - ".panel-toast-glass--info"
  
  blob-glass:
    name: "Blob Glass"
    class: ".panel-blob-glass"
    use_case: "Decorative organic shapes (3 sizes)"
    visual: "Organic morphing shapes with blur and animation"
    variants:
      - ".panel-blob-glass--sm"
      - ".panel-blob-glass--md"
      - ".panel-blob-glass--lg"
  
  neon-glass:
    name: "Neon Glass"
    class: ".panel-neon-glass"
    use_case: "Accent panels with glow (CTAs, premium cards)"
    visual: "Glowing borders with vibrant colors and pulse animation"
  
  agent-showcase:
    name: "Agent Showcase"
    class: ".panel-agent-showcase"
    use_case: "Agent capability cards (2x2 grid)"
    visual: "Header (icon+title+subtitle) + 2x2 grid + tag footer"

# Workflow
workflow:
  - step: 1
    name: "Parse Command"
    action: "Match natural language input against 5 command patterns"
    output: "Extracted panel_name + optional target"
  
  - step: 2
    name: "Resolve Panel"
    action: "Lookup panel in taxonomy (exact or fuzzy match)"
    output: "PanelStyle object with class, example HTML, metadata"
  
  - step: 3
    name: "Generate Response"
    action: "Create response with class name, HTML example, CSS import"
    output: "Dictionary with success, message, html_example, css_file"
  
  - step: 4
    name: "Provide Guidance"
    action: "Show BEM class application instructions"
    output: "Human-readable styling instructions"

# Response Templates
response_templates:
  success:
    format: |
      **✅ Panel Style Applied: {panel_name}**
      
      **Class Name:** `.{class_name}`
      **Use Case:** {use_case}
      **Visual Signature:** {visual_signature}
      
      **HTML Example:**
      ```html
      {html_example}
      ```
      
      **CSS Import:** Add to your HTML `<head>`:
      ```html
      <link rel="stylesheet" href="../assets/css/cortex-glass-system.css">
      ```
      
      **Instruction:** {instruction}
  
  not_found:
    format: |
      **❌ Panel Not Found: '{query}'**
      
      **Did you mean:** {did_you_mean}
      
      **Available Panels:**
      {panel_list}
      
      **Try:** `style X like tetris` or `use grid-cards layout`
  
  list_panels:
    format: |
      **📋 Available Panel Styles (11 total)**
      
      {panel_list}
      
      **Interactive Viewer:** `docs/design-system/panel-viewer.html`
      **CSS System:** `cortex-glass-system.css`

# Integration
integration:
  master_orchestrator:
    priority: 57
    pattern: "^(style|make .+ look like|use .+ panel|apply .+ to).*$"
    autonomous: false
  
  css_system:
    import_file: "cortex-glass-system.css"
    tokens_file: "glass-design-tokens.css"
    panels_file: "glass-named-panels.css"
  
  documentation:
    panel_viewer: "docs/design-system/panel-viewer.html"
    style_guide: "docs/design-system/glassmorphism-guide.html"
    plan: "cortex-brain/documents/planning/active/glassmorphism-css-standardization/"

# Usage Examples
examples:
  - command: "style dashboard like tetris"
    result: "Apply .panel-tetris to dashboard (metrics grid)"
  
  - command: "make hero look like intro panel"
    result: "Apply .panel-intro to hero (centered card)"
  
  - command: "use grid-cards layout"
    result: "Apply .panel-grid-cards (2x3/3x3 grid)"
  
  - command: "apply neon-glass to button"
    result: "Apply .panel-neon-glass to button (glowing accent)"
  
  - command: "tetris style for metrics section"
    result: "Apply .panel-tetris to metrics section"
  
  - command: "list panels"
    result: "Show all 11 panel styles with descriptions"

# Error Handling
error_handling:
  no_match:
    action: "Return fuzzy matches + full panel list"
    confidence_threshold: 0.7
  
  ambiguous:
    action: "Show similar panels, ask for clarification"
  
  invalid_syntax:
    action: "Show command pattern examples"

# Performance
performance:
  pattern_matching: "<1ms"
  fuzzy_matching: "<5ms"
  preview_generation: "<10ms"

# Future Enhancements
roadmap:
  - "AI-powered panel recommendations based on content type"
  - "Custom panel creation via natural language"
  - "Visual diff between panel styles"
  - "Panel composition (combine multiple panels)"
  - "A/B testing support for panel variants"
