# Refinement Orchestrator Manifest
# Version: 5.0.0
# Author: GitHub Copilot (Asif Hussain)
# Part of: CORTEX-5.0 Sub-Plan C50-01

schema_version: "4.1"

orchestrator:
  name: "refinement_orchestrator"
  version: "5.0.0"
  type: "guided"
  description: "Guided code improvement workflow with TDD enforcement"
  category: "code_quality"
  mode: "guided"

execution:
  phases:
    - number: 1
      name: "Code Analysis"
      description: "Scan codebase for improvement opportunities"
      timeout_seconds: 300
      optional: false
    
    - number: 2
      name: "Issue Identification"
      description: "Prioritize technical debt by severity"
      timeout_seconds: 180
      optional: false
    
    - number: 3
      name: "Impact Assessment"
      description: "Risk and effort estimation"
      timeout_seconds: 120
      optional: false
    
    - number: 4
      name: "Refactoring Plan"
      description: "Create improvement roadmap"
      timeout_seconds: 180
      optional: false
    
    - number: 5
      name: "Implementation"
      description: "TDD-enforced refactoring"
      timeout_seconds: 1800
      optional: false
    
    - number: 6
      name: "Validation"
      description: "Test coverage and performance validation"
      timeout_seconds: 300
      optional: false
    
    - number: 7
      name: "Documentation"
      description: "Update architecture docs and generate report"
      timeout_seconds: 180
      optional: false
  
  tdd_enforcement: true
  token_warning_threshold: 80000
  max_retries: 2

analysis_tools:
  complexity:
    tool: "radon"
    metrics:
      - "cyclomatic"
      - "cognitive"
      - "maintainability"
    thresholds:
      cyclomatic_max: 10
      cognitive_max: 15
      maintainability_min: "B"
  
  anti_patterns:
    tool: "pylint"
    rules:
      - "god_object"
      - "long_method"
      - "too_many_params"
      - "duplicate_code"
  
  test_coverage:
    tool: "coverage.py"
    threshold: 80
    report_format: "json"

validation:
  test_coverage_threshold: 80
  complexity_reduction_target: 20
  performance_regression_tolerance: 5
  all_tests_must_pass: true
  
  rollback_on:
    - "test_failure"
    - "coverage_drop"
    - "performance_regression"

severity_levels:
  critical:
    weight: 4
    priority: "immediate"
    examples:
      - "security_vulnerability"
      - "data_loss_risk"
      - "crash_potential"
  
  high:
    weight: 3
    priority: "next_sprint"
    examples:
      - "high_complexity"
      - "technical_debt"
      - "poor_maintainability"
  
  medium:
    weight: 2
    priority: "backlog"
    examples:
      - "code_smells"
      - "minor_performance_issues"
      - "incomplete_tests"
  
  low:
    weight: 1
    priority: "optional"
    examples:
      - "style_violations"
      - "documentation_gaps"
      - "naming_improvements"

success_criteria:
  test_coverage: "≥80%"
  complexity_reduction: "≥20%"
  all_tests_pass: true
  no_regressions: true
  documentation_updated: true

artifacts:
  outputs:
    - "code_analysis_report.json"
    - "issue_list.json"
    - "impact_matrix.json"
    - "refactoring_plan.json"
    - "implementation_log.json"
    - "validation_report.json"
    - "completion_report.md"
  
  storage_path: "cortex-brain/documents/refinement/"

templates:
  base_path: "cortex-brain/templates"
  response_template: "response-templates-v4.yaml"
  report_template: "refinement-report.md.jinja2"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/refinement-orchestrator.log"
