# Scoring Weights (must sum to 1.0)
scoring_weights:
  security: 0.35        # Highest weight - security is paramount
  quality: 0.25         # Code quality and maintainability
  maintainability: 0.15 # Long-term code health
  architecture: 0.15    # System design and structure
  test_coverage: 0.10   # Testing rigor

# Validation Thresholds
thresholds:
  # R1: Critical Vulnerability Cap
  critical_vuln_cap:
    enabled: true
    max_score_with_1_critical: 30
    max_score_with_multiple: 10
    severity: critical
  
  # R2: High Vulnerability Cap
  high_vuln_cap:
    enabled: true
    max_score_5_or_more: 50
    max_score_3_to_4: 60
    severity: high
  
  # R3: Security Score Thresholds
  security_threshold:
    enabled: true
    floor_below_30: 10
    floor_below_50: 30
    severity: high
  
  # R4: OWASP Compliance
  owasp_compliance:
    enabled: true
    max_violations: 5
    penalty_per_violation: 10
    severity: high
  
  # R5: Quality Floor
  quality_floor:
    enabled: true
    min_quality_score: 30
    code_smell_threshold: 100
    severity: medium
  
  # R6: Complexity Penalty
  complexity_penalty:
    enabled: true
    critical_threshold: 20
    high_threshold: 15
    critical_cap: 40
    high_cap: 60
    severity: medium
  
  # R7: Test Coverage Requirements
  test_coverage:
    enabled: true
    min_coverage: 30
    recommended_coverage: 50
    floor_below_30: 20
    floor_below_50: 40
    severity: high
  
  # R8: Security-Quality Correlation
  security_quality_correlation:
    enabled: true
    both_below: 50
    max_overall: 50
    severity: high
  
  # R9: Architecture-Security Alignment
  architecture_security_alignment:
    enabled: true
    arch_threshold: 80
    security_threshold: 40
    min_confidence: 0.8
    severity: medium
  
  # R10: Maintainability-Complexity Inverse
  maintainability_complexity:
    enabled: true
    complexity_threshold: 15
    maintainability_threshold: 80
    max_maintainability: 70
    severity: medium
  
  # R13: Production Configuration Violations
  prod_config:
    enabled: true
    severity: critical
    checks:
      - debug_mode_enabled
      - verbose_logging
      - development_endpoints
  
  # R14: Hardcoded Secrets Impact
  hardcoded_secrets:
    enabled: true
    severity: critical
    penalty_per_secret: 25
    floor_at_zero: true

# Anomaly Detection Settings
anomaly_detection:
  enabled: true
  min_confidence: 0.7
  z_score_threshold: 2.0
  
  # Anomaly types
  types:
    - score_inconsistency
    - outlier
    - trend_deviation
    - cross_tab_mismatch

# CVSS Scoring Configuration
cvss:
  version: "3.1"
  ranges:
    critical:
      min: 9.0
      max: 10.0
      normalized: [90, 100]
    high:
      min: 7.0
      max: 8.9
      normalized: [70, 89]
    medium:
      min: 4.0
      max: 6.9
      normalized: [40, 69]
    low:
      min: 0.1
      max: 3.9
      normalized: [1, 39]
    none:
      min: 0.0
      max: 0.0
      normalized: [0, 0]

# OWASP Top 10 (2025 Edition)
owasp_top_10:
  version: "2025"
  categories:
    A01: "Broken Access Control"
    A02: "Cryptographic Failures"
    A03: "Injection"
    A04: "Insecure Design"
    A05: "Security Misconfiguration"
    A06: "Vulnerable and Outdated Components"
    A07: "Identification and Authentication Failures"
    A08: "Software and Data Integrity Failures"
    A09: "Security Logging and Monitoring Failures"
    A10: "Server-Side Request Forgery (SSRF)"
    A11: "Insecure AI/ML Model Deployment"  # New in 2025

# Reporting Configuration
reporting:
  # Output format
  format: json
  
  # Include sections
  include:
    violations: true
    anomalies: true
    audit_trail: true
    metrics: true
    recommendations: true
  
  # Violation severity levels
  severity_levels:
    - critical
    - high
    - medium
    - low
    - info
  
  # Report retention (days)
  retention_days: 90

# Performance Settings
performance:
  # Cache settings
  cache_enabled: true
  cache_ttl_seconds: 300
  
  # Execution limits
  max_execution_time_ms: 5000
  warn_execution_time_ms: 1000
  
  # Parallel processing
  parallel_validation: true
  max_workers: 4

# Logging Configuration
logging:
  level: INFO
  include_timestamps: true
  include_execution_time: true
  log_violations: true
  log_anomalies: true
  log_adjustments: true

# Feature Flags
features:
  constraint_validation: true
  cross_tab_validation: true
  anomaly_detection: true
  audit_trail: true
  performance_monitoring: true
  
  # Experimental features
  experimental:
    predictive_scoring: false
    ml_anomaly_detection: false
    trend_analysis: false
