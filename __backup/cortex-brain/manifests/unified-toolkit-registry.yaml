orchestrator_registration:
  registry_file: cortex-brain/manifests/orchestrator-registry.yaml
  format: 'Each orchestrator entry:

    - name: Human-readable name

    - class: Actual class name

    - module: Import path

    - ac_ids: List of AC-IDs this orchestrator implements

    - status: ACTIVE, DEPRECATED, EXPERIMENTAL

    - exit_criteria: What needs to pass before considered "done"

    '
mcp_toolkit_exposure:
  duplicate_detection:
    module: src.tools.duplicate_detection_toolkit
    class: DuplicateDetectionToolkit
    methods_exposed:
    - scan_duplicates(scope, patterns, output_format)
    - analyze_duplicates(module_name, analysis_type)
    - generate_consolidation_plan(duplicates, priority)
    - consolidate_module(module_name, keep_primary, merge_features_from, delete, update_imports)
    - validate_consolidation(module_name)
    - update_toolkit_registry(action, tool_name, metadata)
housekeeping_orchestrator_integration:
  ac_id: AC-CLEAN-004
  capability: Duplicate Module Detection & Consolidation
  triggers:
  - Hourly background scan
  - 'On request: implement AC-CLEAN-004'
  - Post-merge validation
  workflow:
    step_1: scan_duplicates(scope="src/,scripts/")
    step_2: Compare to duplicate-modules-manifest.yaml
    step_3: 'If CRITICAL found: generate_consolidation_plan(priority="critical")'
    step_4: Execute consolidation_module(...) for each
    step_5: validate_consolidation(...) after each
    step_6: Run full test suite
    step_7: update_toolkit_registry(...)
success_criteria:
- No CRITICAL duplicates remain
- All tests pass (regression-free)
- Import graph clean
- Manifest accurate
- Registry up-to-date
