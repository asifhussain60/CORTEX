# ==============================================================================
# CORTEX TIER 0 GOVERNANCE - MCP TOOL USAGE RULES
# ==============================================================================
# Purpose: Governance rules for Model Context Protocol (MCP) tool usage
# Status: ACTIVE
# Version: 6.0.0
# Created: 2026-01-08
# 
# These rules define how MCP tools should be invoked, when they should be used,
# security boundaries, and cross-repository usage policies.
# ==============================================================================

schema_version: '6.0'
governance_tier: 0  # Tier 0 = Core CORTEX brain protection
category: MCP_TOOL_USAGE
precedence: HIGH  # High precedence for security and consistency

metadata:
  created_date: "2026-01-08T12:00:00Z"
  created_by: "CORTEX 6.0 Remediation Plan - Phase P0"
  rule_count: 12
  scope: "Universal MCP tool usage across all repositories"
  last_updated: "2026-01-08T12:00:00Z"

categories:
  - tool_invocation        # Rules for when and how to invoke MCP tools
  - security_boundaries    # Rules for security and access control
  - cross_repo_usage       # Rules for using tools across repositories
  - parameter_validation   # Rules for validating tool parameters
  - error_handling         # Rules for handling tool failures
  - audit_logging          # Rules for logging tool usage

rules:
  # ==========================================================================
  # MCP-001: Intelligent Tool Selection
  # ==========================================================================
  - rule_id: MCP-001
    category: tool_invocation
    severity: warning
    name: Use MCP Tools When Available, Fall Back to Local
    description: |
      GitHub Copilot SHOULD prefer MCP-exposed tools when available, but
      fall back to local tool invocation if MCP is unavailable.
      
      MCP tools provide:
      - Universal availability across repositories
      - Standardized parameter schemas
      - Consistent error handling
      - Centralized audit logging
      
      However, local tools are acceptable when:
      - MCP server is not running
      - Tool not yet registered in MCP
      - Development/testing of new tools
    
    enforcement:
      trigger: tool_invocation_request
      action: prefer_mcp_with_local_fallback
    
    validation:
      - Check if MCP server is available (attempt connection)
      - Check if tool exists in MCP capability registry
      - Fall back to local tool if MCP unavailable
      - Log decision (MCP vs local) for analytics
    
    implementation:
      decision_logic: src.orchestrators.middleware.mcp_tool_selector.MCPToolSelector
      priority: 5
    
    examples:
      pass:
        - "Attempt MCP cortex_validate_yaml → Success → Use MCP"
        - "Attempt MCP cortex_validate_yaml → Fail → Use local python -m src.tools.yaml_validator"
        - "Development mode: Directly use local tool for testing"
      fail:
        - "Always use local tools, ignore MCP availability"
        - "Hard-code tool paths, no fallback mechanism"
    
    rationale: |
      MCP provides universal tool access, but we must maintain robustness
      by supporting local fallback for offline development and testing.

  # ==========================================================================
  # MCP-002: Parameter Schema Validation
  # ==========================================================================
  - rule_id: MCP-002
    category: parameter_validation
    severity: blocked
    name: All Tool Parameters Must Validate Against Schema
    description: |
      ALL MCP tool invocations MUST validate parameters against the tool's
      registered schema BEFORE execution.
      
      Invalid parameters cause:
      - Tool failures mid-execution
      - Inconsistent behavior
      - Security vulnerabilities (path traversal, injection)
      - Wasted computational resources
      
      Schema validation is MANDATORY and non-negotiable.
    
    enforcement:
      trigger: mcp_tool_call
      action: block_if_invalid_parameters
    
    validation:
      - All required parameters present
      - Parameter types match schema (string, number, boolean, array)
      - Enum values within allowed set
      - String patterns match regex (if defined)
      - Numeric values within min/max bounds
      - File paths are absolute and within allowed directories
    
    implementation:
      validator: src.mcp.capability_registry.ParameterValidator
      hook: pre_tool_execution
      priority: 10  # Highest priority (security critical)
    
    examples:
      pass:
        - "cortex_validate_yaml with file_path='/abs/path/file.yaml', schema_type='feature'"
        - "cortex_checkpoint with action='create', checkpoint_id='CP1', name='Phase 1'"
      fail:
        - "cortex_validate_yaml with file_path='../../../etc/passwd' (path traversal)"
        - "cortex_checkpoint with action='delete' (not in enum: create/list/restore/validate)"
        - "cortex_detect_gaps with workspace_root=None (required parameter missing)"
    
    error_messages:
      missing_required: "Parameter '{param}' is required but not provided"
      invalid_type: "Parameter '{param}' expected type {expected}, got {actual}"
      invalid_enum: "Parameter '{param}' value '{value}' not in allowed values: {allowed}"
      pattern_mismatch: "Parameter '{param}' value '{value}' does not match pattern: {pattern}"
    
    rationale: |
      Parameter validation is the first line of defense against:
      1. Security vulnerabilities (injection, traversal)
      2. Tool misuse (incorrect parameters)
      3. Data corruption (invalid values)
      4. Resource waste (early failure detection)

  # ==========================================================================
  # MCP-003: Workspace Boundary Enforcement
  # ==========================================================================
  - rule_id: MCP-003
    category: security_boundaries
    severity: blocked
    name: Tools Must Respect Workspace Boundaries
    description: |
      MCP tools MUST NOT access files outside the target workspace unless
      explicitly authorized.
      
      Cross-workspace access is a security risk:
      - Accidental data leakage between projects
      - Unauthorized file modifications
      - Privacy violations (reading sensitive files)
      
      Tools MUST validate that all file paths are within workspace_root.
    
    enforcement:
      trigger: file_access_attempt
      action: block_if_outside_workspace
    
    validation:
      - All file paths resolved to absolute paths
      - All paths verified to be within workspace_root
      - Symlinks resolved and validated
      - Exception: Explicitly allowed paths (e.g., ~/.cortex/cache)
    
    implementation:
      validator: src.mcp.security.workspace_boundary_validator.WorkspaceBoundaryValidator
      hook: pre_file_access
      priority: 10  # Security critical
    
    allowed_exceptions:
      - ~/.cortex/cache/*          # CORTEX cache directory
      - ~/.cortex/config/*         # CORTEX configuration
      - /tmp/cortex-*              # Temporary files
      - $CORTEX_REPO/src/tools/*   # CORTEX tool source (read-only)
    
    examples:
      pass:
        - "workspace_root=/project, file_path=/project/src/main.py (within bounds)"
        - "workspace_root=/project, file_path=./relative/path.yaml (resolves to /project/relative/path.yaml)"
        - "Read CORTEX tool source: /Users/user/CORTEX/src/tools/yaml_validator.py"
      fail:
        - "workspace_root=/project, file_path=/etc/passwd (outside workspace)"
        - "workspace_root=/project, file_path=../../../sensitive.txt (traversal)"
        - "workspace_root=/project, file_path=/other-project/file.txt (different workspace)"
    
    rationale: |
      Workspace boundaries prevent:
      1. Accidental cross-project contamination
      2. Privacy violations (reading other users' files)
      3. Security breaches (unauthorized access)
      4. Data integrity issues (modifying wrong files)

  # ==========================================================================
  # MCP-004: Git Operation Confirmation
  # ==========================================================================
  - rule_id: MCP-004
    category: security_boundaries
    severity: blocked
    name: Git Operations Require User Confirmation
    description: |
      MCP tools performing git operations (commit, tag, push, reset, etc.)
      MUST require explicit user confirmation UNLESS:
      - Operation is checkpoint creation (automated snapshots)
      - Operation is read-only (log, status, diff)
      
      Destructive git operations without confirmation risk:
      - Data loss (reset, force push)
      - Commit history pollution (unwanted commits)
      - Repository corruption (invalid operations)
    
    enforcement:
      trigger: git_operation_request
      action: require_confirmation_unless_safe
    
    safe_operations:
      read_only:
        - git log
        - git status
        - git diff
        - git show
        - git branch --list
      automated:
        - git tag (checkpoint tags only)
        - git commit (checkpoint commits only)
    
    dangerous_operations:
      - git reset --hard
      - git push --force
      - git rebase
      - git cherry-pick
      - git merge
      - git stash drop
    
    implementation:
      validator: src.mcp.security.git_operation_validator.GitOperationValidator
      confirmation_handler: src.mcp.ui.confirmation_dialog.ConfirmationDialog
      priority: 10
    
    confirmation_format: |
      🚨 Git Operation Confirmation Required
      
      Tool: {tool_name}
      Operation: {git_command}
      Repository: {repo_path}
      Branch: {branch_name}
      
      Impact: {operation_description}
      
      Proceed? (yes/no):
    
    examples:
      pass:
        - "cortex_checkpoint create CP1 (automated, safe)"
        - "User confirms: git reset --hard HEAD~1 (user approved)"
        - "cortex_detect_gaps (no git operations, safe)"
      fail:
        - "Automated git push --force (destructive without confirmation)"
        - "Automated git reset --hard (data loss without confirmation)"
    
    rationale: |
      Git operations can be destructive. User confirmation prevents:
      1. Accidental data loss
      2. Unwanted repository modifications
      3. Commit history corruption
      4. Push/pull mistakes

  # ==========================================================================
  # MCP-005: Cross-Repository Tool Usage Intelligence
  # ==========================================================================
  - rule_id: MCP-005
    category: cross_repo_usage
    severity: warning
    name: Intelligent Cross-Repo Tool Adaptation
    description: |
      When MCP tools are used in non-CORTEX repositories, they SHOULD:
      1. Detect repository type/structure
      2. Adapt behavior to repository conventions
      3. Provide helpful guidance for missing structure
      4. Degrade gracefully when dependencies unavailable
      
      Example: cortex_detect_gaps in a non-CORTEX repo should:
      - Look for requirements in common locations (docs/, requirements/, etc.)
      - Adapt to repository's file structure
      - Provide guidance: "No feature.yaml found. Consider creating one for traceability."
    
    enforcement:
      trigger: tool_execution_in_external_repo
      action: adapt_behavior_to_repo_structure
    
    detection_logic:
      cortex_repo:
        indicators:
          - cortex-brain/ directory exists
          - src/orchestrators/ directory exists
          - .github/prompts/CORTEX.prompt.md exists
        behavior: Full CORTEX assumptions (Tier0-3, governance, etc.)
      
      non_cortex_repo:
        indicators:
          - No cortex-brain/ directory
        behavior: Generic mode, adapt to discovered structure
      
      detection_order:
        1. Check for cortex-brain/ (CORTEX repo)
        2. Check for package.json (Node.js project)
        3. Check for requirements.txt (Python project)
        4. Check for Cargo.toml (Rust project)
        5. Check for go.mod (Go project)
        6. Default to generic structure
    
    adaptation_examples:
      cortex_detect_gaps:
        cortex_repo: "Use .asif/AI-Learning/cortex6/source-of-truth/"
        python_repo: "Use docs/requirements/, requirements/, specs/"
        nodejs_repo: "Use docs/features/, README.md, ARCHITECTURE.md"
        generic: "Scan for *.md, *.yaml, README.md"
      
      cortex_validate_yaml:
        cortex_repo: "Use cortex-brain/schemas/"
        other_repo: "Use embedded default schemas or .cortex/schemas/"
    
    implementation:
      detector: src.mcp.adapters.repo_structure_detector.RepoStructureDetector
      adapters:
        - src.mcp.adapters.cortex_repo_adapter.CortexRepoAdapter
        - src.mcp.adapters.python_repo_adapter.PythonRepoAdapter
        - src.mcp.adapters.nodejs_repo_adapter.NodeJSRepoAdapter
        - src.mcp.adapters.generic_repo_adapter.GenericRepoAdapter
      priority: 3
    
    rationale: |
      Universal tool availability requires intelligent adaptation.
      Tools should be helpful across all repository types, not just CORTEX.

  # ==========================================================================
  # MCP-006: Audit Logging for All Tool Invocations
  # ==========================================================================
  - rule_id: MCP-006
    category: audit_logging
    severity: enforced
    name: All MCP Tool Invocations Must Be Logged
    description: |
      ALL MCP tool invocations MUST be logged to audit trail with:
      - Timestamp
      - Tool name
      - Parameters (sanitized - no sensitive data)
      - Workspace/repository context
      - User/client identifier (if available)
      - Execution duration
      - Success/failure status
      - Error messages (if failed)
      
      Audit logs enable:
      - Security monitoring (detect abuse)
      - Usage analytics (tool popularity, effectiveness)
      - Debugging (trace tool behavior)
      - Compliance (who did what, when)
    
    enforcement:
      trigger: mcp_tool_execution
      action: log_to_audit_trail
    
    log_format:
      timestamp: ISO 8601 format
      tool_name: String
      parameters: Dict (sanitized)
      workspace: Absolute path
      client_id: String (anonymized if needed)
      duration_ms: Integer
      status: '"success" | "failure"'
      error: String (if failed)
      repo_type: '"cortex" | "python" | "nodejs" | "generic"'
    
    sensitive_parameter_sanitization:
      - file_path: Replace user home with ~/ (privacy)
      - workspace_root: Replace user home with ~/ (privacy)
      - Any parameter containing "password", "token", "secret": Redact value
    
    implementation:
      logger: src.infrastructure.audit_logger.AuditLogger
      hook: post_tool_execution
      priority: 1  # Always log (even if tool fails)
    
    log_destination:
      primary: cortex-brain/audit-logs/mcp-tool-usage.jsonl
      backup: ~/.cortex/logs/mcp-tool-usage-{date}.jsonl
    
    example_log_entry: |
      {
        "timestamp": "2026-01-08T12:34:56.789Z",
        "tool_name": "cortex_detect_gaps",
        "parameters": {
          "workspace_root": "~/projects/my-app",
          "output_format": "yaml"
        },
        "workspace": "~/projects/my-app",
        "client_id": "vscode-copilot-1234",
        "duration_ms": 3456,
        "status": "success",
        "error": null,
        "repo_type": "python"
      }
    
    rationale: |
      Audit logging provides:
      1. Security: Detect unauthorized tool usage
      2. Analytics: Understand tool effectiveness
      3. Debugging: Trace execution history
      4. Compliance: Prove adherence to policies

  # ==========================================================================
  # MCP-007: Error Handling and User-Friendly Messages
  # ==========================================================================
  - rule_id: MCP-007
    category: error_handling
    severity: enforced
    name: Provide User-Friendly Error Messages
    description: |
      When MCP tools fail, error messages MUST be:
      1. User-friendly (not raw stack traces)
      2. Actionable (tell user how to fix)
      3. Context-aware (explain what went wrong)
      4. Logged (technical details in audit log)
      
      Bad error: "KeyError: 'file_path'"
      Good error: "Parameter 'file_path' is required. Please provide the path to the YAML file you want to validate."
    
    enforcement:
      trigger: tool_execution_failure
      action: transform_to_user_friendly_message
    
    error_transformation_rules:
      FileNotFoundError: "The file '{file_path}' could not be found. Please check the path and try again."
      PermissionError: "Permission denied accessing '{file_path}'. Please check file permissions."
      ValidationError: "Validation failed: {validation_message}. See details in audit log."
      KeyError: "Required parameter '{key}' is missing. {parameter_description}"
      ValueError: "Invalid value for '{parameter}': {value}. {expected_format}"
      subprocess.CalledProcessError: "Git command failed: {git_command}. Error: {stderr}"
      ConnectionError: "MCP server is not available. Please ensure CORTEX is running."
    
    error_response_format: |
      ❌ Tool Execution Failed
      
      Tool: {tool_name}
      Error: {user_friendly_message}
      
      Suggestion: {how_to_fix}
      
      Technical Details: See audit log at {log_path}
    
    implementation:
      transformer: src.mcp.error_handling.error_message_transformer.ErrorMessageTransformer
      hook: post_tool_failure
      priority: 2
    
    examples:
      pass:
        - "File not found: 'feature.yaml'. Did you mean 'features/feat01/feature.yaml'?"
        - "Invalid schema type: 'features'. Valid options: 'feature', 'requirements'."
      fail:
        - "Traceback (most recent call last):\n  File '...', line 123, in <module>\n    KeyError: 'file_path'"
        - "Error: Exception occurred. See logs."
    
    rationale: |
      User-friendly error messages improve:
      1. User experience (less frustration)
      2. Self-service (users fix issues themselves)
      3. Adoption (tools feel polished, not fragile)
      4. Debugging (clear root cause identification)

  # ==========================================================================
  # MCP-008: Tool Version Compatibility
  # ==========================================================================
  - rule_id: MCP-008
    category: tool_invocation
    severity: warning
    name: Check Tool Version Compatibility
    description: |
      MCP server SHOULD advertise tool versions and clients SHOULD check
      compatibility before invocation.
      
      Version mismatches cause:
      - Unexpected parameter requirements
      - Changed behavior
      - Removed features
      
      Tools follow semantic versioning (MAJOR.MINOR.PATCH):
      - MAJOR: Breaking changes (parameter renames, removals)
      - MINOR: New features (backward compatible)
      - PATCH: Bug fixes (fully compatible)
    
    enforcement:
      trigger: mcp_tool_call
      action: warn_if_version_mismatch
    
    compatibility_check:
      - Client requests tool version in tools/list
      - Server returns version in tool metadata
      - Client compares against required version
      - If major version differs: Warn user
      - If minor version lower: Inform about missing features
    
    version_format: "MAJOR.MINOR.PATCH"
    
    implementation:
      version_checker: src.mcp.versioning.tool_version_checker.ToolVersionChecker
      priority: 4
    
    examples:
      pass:
        - "Client requires cortex_validate_yaml@2.x, server has 2.3.1 (compatible)"
        - "Client uses cortex_detect_gaps@1.5.0, server has 1.6.2 (compatible, new features available)"
      fail:
        - "Client expects cortex_checkpoint@1.x, server has 2.0.0 (major version change, breaking)"
    
    warning_message: |
      ⚠️ Tool Version Mismatch
      
      Tool: {tool_name}
      Required: {required_version}
      Available: {server_version}
      
      This may cause unexpected behavior. Consider updating CORTEX or adjusting tool usage.
    
    rationale: |
      Version compatibility prevents:
      1. Unexpected tool failures
      2. Silent behavior changes
      3. Parameter mismatches
      4. Deprecated feature usage

  # ==========================================================================
  # MCP-009: Rate Limiting and Resource Management
  # ==========================================================================
  - rule_id: MCP-009
    category: security_boundaries
    severity: enforced
    name: Apply Rate Limits to Prevent Abuse
    description: |
      MCP tools MUST enforce rate limits to prevent:
      - Accidental infinite loops
      - Malicious abuse (DoS attacks)
      - Resource exhaustion (CPU, memory, disk)
      
      Rate limits apply per:
      - Client ID (per-user limits)
      - Tool name (per-tool limits)
      - Workspace (per-project limits)
    
    enforcement:
      trigger: mcp_tool_call
      action: enforce_rate_limits
    
    rate_limits:
      per_client:
        requests_per_minute: 60
        requests_per_hour: 1000
      
      per_tool:
        cortex_detect_gaps:
          requests_per_minute: 5   # Expensive operation
          max_concurrent: 2
        cortex_validate_yaml:
          requests_per_minute: 30  # Lightweight operation
          max_concurrent: 10
        cortex_checkpoint:
          requests_per_minute: 10  # Git operations
          max_concurrent: 1        # Serialize git ops
      
      per_workspace:
        concurrent_tools: 5  # Max 5 tools running in same workspace
    
    implementation:
      rate_limiter: src.mcp.security.rate_limiter.RateLimiter
      hook: pre_tool_execution
      priority: 9
    
    rate_limit_exceeded_response: |
      ⚠️ Rate Limit Exceeded
      
      Tool: {tool_name}
      Limit: {limit} requests per {period}
      Current: {current_count} requests
      
      Please wait {wait_seconds} seconds before retrying.
    
    rationale: |
      Rate limiting protects:
      1. Server resources (CPU, memory)
      2. User experience (no accidental loops)
      3. System stability (prevent DoS)
      4. Fair usage (no single user monopolizes)

  # ==========================================================================
  # MCP-010: Tool Discovery and Help
  # ==========================================================================
  - rule_id: MCP-010
    category: tool_invocation
    severity: recommended
    name: Provide Rich Tool Metadata for Discovery
    description: |
      All MCP tools SHOULD provide rich metadata to help users discover
      and understand tool capabilities:
      
      - Clear description (what does it do?)
      - Parameter schemas (what inputs required?)
      - Examples (how to use it?)
      - Use cases (when to use it?)
      - Categories/tags (how to find it?)
      
      Rich metadata improves:
      - Discoverability (users find relevant tools)
      - Usability (users understand tool purpose)
      - Adoption (users feel confident using tools)
    
    enforcement:
      trigger: tool_registration
      action: validate_metadata_completeness
    
    required_metadata:
      - name: Tool identifier (cortex_validate_yaml)
      - description: Clear 1-2 sentence description
      - category: Functional category (validation, analysis, etc.)
      - parameters: Full parameter schemas with descriptions
    
    recommended_metadata:
      - examples: 2-3 usage examples
      - use_cases: When to use this tool
      - related_tools: Tools often used together
      - documentation_url: Link to detailed docs
    
    implementation:
      validator: src.mcp.metadata.tool_metadata_validator.ToolMetadataValidator
      priority: 2
    
    example_rich_metadata: |
      {
        "name": "cortex_detect_gaps",
        "description": "Analyze implementation gaps between requirements and code",
        "category": "analysis",
        "parameters": { ... },
        "examples": [
          {
            "title": "Basic gap detection",
            "arguments": {"workspace_root": "/project"}
          }
        ],
        "use_cases": [
          "Validate feature completeness",
          "Identify missing implementations",
          "Track technical debt"
        ],
        "related_tools": ["cortex_validate_yaml", "cortex_audit_requirements"]
      }
    
    rationale: |
      Rich metadata enables:
      1. Self-service (users learn without asking)
      2. Faster adoption (clear value proposition)
      3. Better tool usage (understand when to use)
      4. Reduced support burden (fewer questions)

  # ==========================================================================
  # MCP-011: Idempotency for Safe Re-execution
  # ==========================================================================
  - rule_id: MCP-011
    category: tool_invocation
    severity: recommended
    name: Tools Should Be Idempotent When Possible
    description: |
      MCP tools SHOULD be idempotent (safe to run multiple times with same inputs):
      
      Idempotent tools:
      - Produce same result on repeated execution
      - Don't create duplicates (e.g., multiple checkpoints with same ID)
      - Check existing state before modifying
      
      Benefits:
      - Safe retry on failure
      - Deterministic behavior
      - Reduced user anxiety (won't break things)
    
    enforcement:
      trigger: tool_design_review
      action: recommend_idempotency
    
    idempotency_patterns:
      cortex_checkpoint:
        pattern: Check if checkpoint ID exists before creating
        behavior: If exists, return existing checkpoint (don't duplicate)
      
      cortex_validate_yaml:
        pattern: Pure validation (no side effects)
        behavior: Always idempotent (just validates, doesn't modify)
      
      cortex_convert_md_to_yaml:
        pattern: Check if output file exists
        behavior: Warn user, ask for overwrite confirmation
    
    implementation:
      guidance: Document in tool development guide
      priority: 3
    
    examples:
      idempotent:
        - "cortex_validate_yaml: Pure function, no side effects"
        - "cortex_checkpoint create CP1: If CP1 exists, return existing"
        - "cortex_detect_gaps: Analysis only, no modifications"
      
      non_idempotent_but_safe:
        - "cortex_convert_md_to_yaml: Warns if output exists, requires confirmation"
    
    rationale: |
      Idempotency provides:
      1. Safety (re-run without fear)
      2. Reliability (deterministic results)
      3. Retry logic (automatic recovery)
      4. User confidence (predictable behavior)

  # ==========================================================================
  # MCP-012: Performance Monitoring and Optimization
  # ==========================================================================
  - rule_id: MCP-012
    category: tool_invocation
    severity: enforced
    name: Monitor Tool Performance and Optimize
    description: |
      MCP tools MUST be monitored for performance to ensure:
      - Fast response times (sub-second for simple tools)
      - Scalability (handle large workspaces)
      - Resource efficiency (minimal CPU/memory)
      
      Performance metrics tracked:
      - Execution duration
      - Memory usage
      - CPU usage
      - Disk I/O
      - Success/failure rate
    
    enforcement:
      trigger: tool_execution
      action: collect_performance_metrics
    
    performance_targets:
      cortex_validate_yaml:
        target_duration_ms: 100
        max_duration_ms: 500
      
      cortex_detect_gaps:
        target_duration_ms: 3000
        max_duration_ms: 10000
      
      cortex_generate_dashboard:
        target_duration_ms: 500
        max_duration_ms: 2000
      
      cortex_checkpoint:
        target_duration_ms: 1000
        max_duration_ms: 5000
    
    slow_tool_warning: |
      ⚠️ Tool Performance Warning
      
      Tool: {tool_name}
      Duration: {actual_duration_ms}ms
      Target: {target_duration_ms}ms
      
      This tool is running slower than expected. Consider optimizing or using a smaller workspace.
    
    implementation:
      monitor: src.mcp.monitoring.performance_monitor.PerformanceMonitor
      hook: post_tool_execution
      priority: 1
    
    optimization_recommendations:
      - Cache expensive computations (e.g., file scanning)
      - Use incremental processing for large datasets
      - Parallelize independent operations
      - Profile hot paths and optimize
    
    rationale: |
      Performance monitoring enables:
      1. Proactive optimization (fix slow tools)
      2. User experience (fast tools = happy users)
      3. Resource management (identify heavy tools)
      4. SLA compliance (meet performance targets)

# ==============================================================================
# ENFORCEMENT SUMMARY
# ==============================================================================
enforcement_summary:
  total_rules: 12
  blocked_rules: 4      # MCP-002, MCP-003, MCP-004, MCP-009
  enforced_rules: 3     # MCP-006, MCP-007, MCP-012
  warning_rules: 3      # MCP-001, MCP-005, MCP-008
  recommended_rules: 2  # MCP-010, MCP-011

implementation_status:
  phase: P1  # To be implemented in Phase P1 of remediation
  estimated_effort: "3 hours (P1-T10: MCP tool registration)"
  priority: HIGH
