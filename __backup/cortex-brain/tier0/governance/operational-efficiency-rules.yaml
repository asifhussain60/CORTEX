# ==============================================================================
# CORTEX TIER 0 GOVERNANCE - OPERATIONAL EFFICIENCY & BRITTLENESS PREVENTION
# ==============================================================================
# Purpose: Rules that maximize CORTEX efficiency and eliminate brittleness
# Status: ACTIVE
# Version: 1.0.0
# Created: 2026-01-08
# 
# CRITICAL: These rules prevent brittleness, state corruption, and operational
# failures. They complement core-rules.yaml and mcp-tool-usage-rules.yaml.
# ==============================================================================

schema_version: '6.0'
governance_tier: 0  # Tier 0 = Core CORTEX brain protection
category: OPERATIONAL_EFFICIENCY
precedence: HIGH  # Just below CORTEX_CORE

metadata:
  created_date: "2026-01-08T12:00:00Z"
  created_by: "cortex6-fixes remediation plan analysis"
  purpose: "Prevent brittleness, maximize efficiency, ensure operational resilience"
  rule_count: 15
  last_updated: "2026-01-08T12:00:00Z"
  integration_phase: "P0-T7 (Governance Enhancement)"

categories:
  - state_management          # Rules governing state persistence and recovery
  - validation_enforcement    # Rules governing validation requirements
  - error_recovery           # Rules governing error handling and recovery
  - data_integrity           # Rules preventing data corruption
  - orchestrator_coordination # Rules for multi-orchestrator operations
  - performance_optimization  # Rules preventing performance degradation

rules:
  # ==========================================================================
  # OE-001: Mandatory State Persistence for All Orchestrators
  # ==========================================================================
  - rule_id: OE-001
    category: state_management
    severity: blocked
    name: All Orchestrators Must Persist State After Each Phase
    description: |
      Every orchestrator MUST save state after completing each phase/task to
      enable recovery from failures, continuation across sessions, and
      checkpoint restoration.
      
      State persistence prevents loss of work when:
      - Token limits exceeded (HTTP 502)
      - User interruption (Ctrl+C, browser close)
      - System crashes or network failures
      - Multi-session work spanning days
    
    enforcement:
      trigger: orchestrator_phase_completion
      action: block_if_state_not_persisted
    
    validation:
      - State saved to Tier 1 (working memory) in structured format (YAML/JSON)
      - "State includes: current_phase, completed_tasks, pending_tasks, metrics, context"
      - "State file location follows pattern: tier1/{orchestrator-name}/{session-id}/state.yaml"
      - State includes continuation_prompt for resumption
      - State is atomic (write to temp -> rename to prevent corruption)
    
    implementation:
      middleware: src.infrastructure.state_manager.StateManager
      hook: post_phase_execution
      priority: 10
      storage_path: "cortex-brain/tier1/state/{orchestrator}/{session_id}/"
    
    examples:
      pass:
        - "Planning v5 saves state.yaml after each phase completion"
        - "ADO v2 saves wizard state after each question answered"
        - "Investigation saves hypothesis state after each validation step"
      fail:
        - "Orchestrator completes phase but doesn't save state (data lost on crash)"
        - "State saved without continuation_prompt (can't resume)"
        - "State saved non-atomically (file corrupted on crash)"
    
    related_gaps:
      - "GAP-001: State loss on token limit errors"
      - "GAP-002: Can't resume multi-session work"
      - "GAP-003: Checkpoint restore fails without state"
    
    rationale: |
      State persistence is the foundation of resilience. Without it:
      1. Work is lost on any failure (wasted hours)
      2. Multi-session work requires restarting from scratch
      3. Checkpoints are meaningless (no state to restore)
      4. Users lose trust in system reliability

  # ==========================================================================
  # OE-002: YAML Schema Validation Before Persistence
  # ==========================================================================
  - rule_id: OE-002
    category: validation_enforcement
    severity: blocked
    name: All YAML Files Must Validate Against Schema Before Write
    description: |
      All YAML files written by CORTEX (plans, requirements, state, config)
      MUST be validated against their JSON schema BEFORE being persisted.
      
      Pre-write validation prevents:
      - Corrupt YAML breaking future reads
      - Schema drift accumulating unnoticed
      - Invalid data propagating through system
      - Manual cleanup of malformed files
    
    enforcement:
      trigger: yaml_file_write_attempt
      action: block_if_validation_fails
    
    validation:
      - Schema file exists in cortex-brain/schemas/{type}.schema.json
      - YAML validates against schema (all required fields, correct types)
      - Validation errors are surfaced to user with actionable messages
      - Failed writes do NOT create partial/corrupt files
      - Validation uses src/tools/yaml_validator.py (P0-T1 tool)
    
    implementation:
      middleware: src.tools.yaml_validator.YAMLValidator
      hook: pre_file_write
      priority: 9
      schema_dir: "cortex-brain/schemas/"
    
    examples:
      pass:
        - "Planning v5 validates master plan YAML before saving"
        - "Requirements converter validates feature.yaml before write"
        - "Dashboard validates phase YAML before saving progress"
      fail:
        - "YAML written without validation (corrupt file breaks system)"
        - "Validation errors ignored (invalid data persisted)"
        - "Partial file created on validation failure (filesystem pollution)"
    
    related_tools:
      - "P0-T1: YAML Schema Validator (src/tools/yaml_validator.py)"
    
    related_gaps:
      - "GAP-004: Invalid YAML breaks orchestrators"
      - "GAP-005: Schema drift causes silent failures"
    
    rationale: |
      Validation at write-time is 100x cheaper than debugging corrupt data:
      1. Catches errors immediately (clear error context)
      2. Prevents downstream failures (garbage in -> garbage out)
      3. Enforces schema compliance automatically
      4. Reduces technical debt accumulation

  # ==========================================================================
  # OE-003: Graceful Degradation on Non-Critical Failures
  # ==========================================================================
  - rule_id: OE-003
    category: error_recovery
    severity: enforced
    name: Orchestrators Must Continue on Non-Critical Failures
    description: |
      Orchestrators MUST distinguish between critical and non-critical failures
      and continue execution for non-critical errors (with degraded functionality).
      
      Critical failures: Block execution (data corruption, authentication failure)
      Non-critical failures: Log + continue (optional feature unavailable, cache miss)
      
      This prevents "all-or-nothing" brittleness where minor issues halt work.
    
    enforcement:
      trigger: exception_raised_in_orchestrator
      action: continue_if_non_critical
    
    validation:
      - Orchestrators categorize exceptions as CRITICAL or NON_CRITICAL
      - "Critical exceptions: Propagated immediately (halt execution)"
      - "Non-critical exceptions: Logged with WARNING level, execution continues"
      - User notified of degraded functionality (clear message)
      - Degraded mode documented in state (for debugging)
    
    implementation:
      middleware: src.infrastructure.error_handler.GracefulErrorHandler
      hook: exception_handler
      priority: 8
      categories:
        critical:
          - StateCorruption
          - SchemaValidationError
          - AuthenticationFailure
          - FileSystemPermissionError
        non_critical:
          - CacheMiss
          - OptionalFeatureUnavailable
          - NetworkTimeout (with retry)
          - ExternalAPIFailure (with fallback)
    
    examples:
      pass:
        - "Planning v5 continues if Tier 2 knowledge graph unavailable (no context enrichment)"
        - "ADO v2 continues if GitHub API rate limit hit (uses cached data)"
        - "Investigation continues if LLM hypothesis ranking fails (uses heuristics)"
      fail:
        - "Planning v5 halts if cache directory missing (should create)"
        - "ADO v2 aborts if one story fails validation (should skip + continue)"
        - "Investigation aborts if external tool unavailable (should use fallback)"
    
    related_rules:
      - "CORE-001: Incremental execution enables partial completion"
      - "OE-004: Retry logic for transient failures"
    
    rationale: |
      Graceful degradation prevents cascading failures:
      1. Maximizes work completed per session
      2. Reduces user frustration (progress not lost)
      3. Enables offline/degraded mode operation
      4. Improves system resilience

  # ==========================================================================
  # OE-004: Exponential Backoff Retry for Transient Failures
  # ==========================================================================
  - rule_id: OE-004
    category: error_recovery
    severity: enforced
    name: Transient Failures Must Use Exponential Backoff Retry
    description: |
      Operations that may fail transiently (network, filesystem, external APIs)
      MUST implement exponential backoff retry with configurable max attempts.
      
      Transient failures: Network timeouts, filesystem locks, API rate limits
      Permanent failures: Authentication errors, invalid parameters
      
      This prevents immediate failure on recoverable errors.
    
    enforcement:
      trigger: transient_operation_failure
      action: retry_with_backoff
    
    validation:
      - Retry decorator applied to transient operations
      - "Exponential backoff: wait = base_delay * (2 ** attempt)"
      - "Max retries: 3 (default), configurable via config"
      - Retry only on specific exception types (not all exceptions)
      - Log each retry attempt (for debugging)
    
    implementation:
      decorator: src.infrastructure.retry.exponential_backoff_retry
      config_file: "cortex-brain/config/retry-policy.yaml"
      default_config:
        base_delay_seconds: 1
        max_retries: 3
        max_delay_seconds: 30
        jitter: true  # Add randomness to prevent thundering herd
    
    examples:
      pass:
        - "Checkpoint manager retries git operations on lock contention (3 attempts)"
        - "Requirements auditor retries file reads on filesystem lock (exponential backoff)"
        - "MCP tool invocations retry on network timeout (with jitter)"
      fail:
        - "Git operation fails once -> abort (should retry 3x)"
        - "File read fails on lock -> immediate error (should wait + retry)"
        - "API call fails -> no retry (should distinguish transient vs permanent)"
    
    related_rules:
      - "OE-003: Graceful degradation after max retries exhausted"
      - "MCP-009: Rate limiting coordinated with retry logic"
    
    rationale: |
      Retry logic absorbs transient failures transparently:
      1. Network hiccups don't abort operations
      2. Filesystem locks resolve naturally (wait)
      3. API rate limits handled gracefully
      4. Reduces false negatives (failed but would have succeeded)

  # ==========================================================================
  # OE-005: Atomic File Operations to Prevent Corruption
  # ==========================================================================
  - rule_id: OE-005
    category: data_integrity
    severity: blocked
    name: All File Writes Must Be Atomic (Temp + Rename)
    description: |
      File writes MUST use atomic operations (write to temp file -> rename) to
      prevent partial writes and file corruption on crashes.
      
      Non-atomic writes risk:
      - Corrupt files on crash/interrupt
      - Readers seeing partial data
      - Unrecoverable state (can't rollback)
    
    enforcement:
      trigger: file_write_operation
      action: block_if_non_atomic
    
    validation:
      - "Write to temporary file: {target_path}.tmp.{random_suffix}"
      - "Fsync temp file (flush to disk)"
      - "Rename temp -> target (atomic operation on POSIX)"
      - "Delete temp file on write failure"
      - "Use pathlib for cross-platform compatibility"
    
    implementation:
      utility: src.infrastructure.file_utils.atomic_write
      pattern: |
        with atomic_write(target_path) as f:
            yaml.dump(data, f)
        # File only appears when complete
    
    examples:
      pass:
        - "State manager writes state.tmp -> renames to state.yaml"
        - "Planning v5 writes master-plan.tmp -> renames on success"
        - "Checkpoint metadata writes CP0.tmp.yaml -> renames atomically"
      fail:
        - "Direct write to state.yaml (corruption on crash)"
        - "No fsync before rename (data lost on power failure)"
        - "Temp file not deleted on error (filesystem pollution)"
    
    related_rules:
      - "OE-001: State persistence requires atomic writes"
      - "OE-002: Validation before atomic write"
    
    rationale: |
      Atomic writes are mandatory for reliability:
      1. Prevents corrupt files (all-or-nothing)
      2. Readers never see partial data
      3. Crash-safe (can restart safely)
      4. Standard practice for databases/critical systems

  # ==========================================================================
  # OE-006: Idempotent Operations for Safe Retry/Resume
  # ==========================================================================
  - rule_id: OE-006
    category: orchestrator_coordination
    severity: enforced
    name: All Orchestrator Operations Must Be Idempotent
    description: |
      Orchestrator operations MUST be idempotent (safe to execute multiple times)
      to enable retry, resume, and checkpoint restoration.
      
      Idempotent operations produce the same result whether executed once or N times.
      
      This prevents duplicate work, data corruption, and state inconsistency on resume.
    
    enforcement:
      trigger: orchestrator_operation_design
      action: validate_idempotency
    
    validation:
      - Operations check existing state before acting
      - "File creation: Check if file exists first"
      - "Task execution: Check if task already completed"
      - "Data updates: Use upsert (insert or update, not duplicate insert)"
      - "Side effects: Tracked in state to prevent duplication"
    
    implementation:
      pattern: |
        def execute_task(task_id):
            if self.state.is_task_completed(task_id):
                logger.info(f"Task {task_id} already completed, skipping")
                return self.state.get_task_result(task_id)
            
            # Execute task
            result = self._do_work(task_id)
            self.state.mark_completed(task_id, result)
            return result
    
    examples:
      pass:
        - "Planning v5 checks if plan folder exists before creating"
        - "Requirements converter checks if target YAML exists before converting"
        - "Checkpoint manager checks if checkpoint ID exists before creating"
      fail:
        - "Create plan folder without checking (fails on second run)"
        - "Convert requirement without checking (duplicate work)"
        - "Create checkpoint without checking (conflicting IDs)"
    
    related_rules:
      - "OE-001: State persistence enables idempotency checks"
      - "OE-004: Retry logic depends on idempotency"
      - "MCP-011: MCP tools must be idempotent (cross-repo)"
    
    rationale: |
      Idempotency is essential for resilience:
      1. Safe to retry any operation (no side effects)
      2. Resume from checkpoints works correctly
      3. Multi-user coordination possible (no race conditions)
      4. Debugging simplified (replay operations safely)

  # ==========================================================================
  # OE-007: Mandatory Rollback Support for Destructive Operations
  # ==========================================================================
  - rule_id: OE-007
    category: data_integrity
    severity: blocked
    name: Destructive Operations Must Support Rollback
    description: |
      Operations that delete, modify, or overwrite data MUST create rollback
      checkpoints before acting, enabling undo if operation fails.
      
      Destructive operations: File deletion, data updates, configuration changes
      
      This prevents permanent data loss on partial failures.
    
    enforcement:
      trigger: destructive_operation_start
      action: block_if_no_rollback_support
    
    validation:
      - Checkpoint created before destructive operation
      - "Checkpoint includes: Original data, operation metadata, timestamp"
      - "Checkpoint location: cortex-brain/tier1/rollback/{operation_id}/"
      - Rollback function implemented and tested
      - Automatic rollback on operation failure
    
    implementation:
      middleware: src.infrastructure.rollback_manager.RollbackManager
      pattern: |
        with rollback_manager.create_checkpoint(operation_id) as checkpoint:
            checkpoint.save_state(current_data)
            perform_destructive_operation()
            checkpoint.commit()  # Success, discard rollback
        # On exception, automatic rollback executed
    
    examples:
      pass:
        - "Vacuum creates backup before deleting duplicates"
        - "Cleanup creates checkpoint before cache deletion"
        - "Requirements conversion backs up original MD before conversion"
      fail:
        - "Vacuum deletes files without backup (unrecoverable)"
        - "Cleanup deletes cache without checkpoint (can't undo)"
        - "Conversion overwrites MD without backup (data loss)"
    
    related_tools:
      - "P0-T5: Checkpoint Manager (git-based rollback)"
    
    related_rules:
      - "OE-005: Atomic operations prevent partial corruption"
      - "CORE-006: Git isolation prevents accidental user repo changes"
    
    rationale: |
      Rollback support is insurance against mistakes:
      1. Users can undo destructive operations safely
      2. Partial failures don't leave system in corrupt state
      3. Experimentation is safer (can revert)
      4. Audit trail of all destructive operations

  # ==========================================================================
  # OE-008: Progress Tracking with Estimated Time Remaining
  # ==========================================================================
  - rule_id: OE-008
    category: performance_optimization
    severity: recommended
    name: Long-Running Operations Must Track Progress and ETA
    description: |
      Operations estimated to take >30 seconds MUST provide progress tracking
      with estimated time remaining (ETA) to improve user experience.
      
      Progress tracking prevents:
      - User uncertainty ("is it working?")
      - Premature cancellation (thought it was stuck)
      - No visibility into bottlenecks
    
    enforcement:
      trigger: long_running_operation_start
      action: warn_if_no_progress_tracking
    
    validation:
      - Progress updates every 5-10 seconds (not too frequent)
      - "Progress includes: Current step, completed/total, ETA"
      - "ETA calculated from: average_time_per_unit * remaining_units"
      - Progress persisted to state (survives interruption)
      - Progress displayed via ASCII progress bars (accessible)
    
    implementation:
      utility: src.tools.dashboard_generator.DashboardGenerator
      pattern: |
        with progress_tracker(total_units=100) as progress:
            for i, item in enumerate(items):
                process(item)
                progress.update(i+1, message=f"Processing {item}")
    
    examples:
      pass:
        - "Requirements auditor shows '50/300 files scanned (2m remaining)'"
        - "Vacuum shows '1.2GB / 4.5GB processed (5m remaining)'"
        - "Gap detector shows 'Phase 3/6: Implementation validation (70% complete)'"
      fail:
        - "Requirements audit runs for 10 minutes with no output (looks stuck)"
        - "Vacuum processes for 1 hour with no progress indication"
        - "Gap detector shows no status for 5 minutes (user cancels)"
    
    related_tools:
      - "P0-T4: Progress Dashboard Generator"
    
    related_rules:
      - "CORE-001: Incremental execution enables progress tracking"
      - "OE-001: State persistence preserves progress on interruption"
    
    rationale: |
      Progress tracking dramatically improves UX:
      1. Users know operation is working (not stuck)
      2. Users can make informed decisions (wait vs cancel)
      3. Bottlenecks become visible (optimization targets)
      4. Trust in system increases (transparent operation)

  # ==========================================================================
  # OE-009: Dependency Validation Before Orchestrator Execution
  # ==========================================================================
  - rule_id: OE-009
    category: validation_enforcement
    severity: blocked
    name: Orchestrators Must Validate Dependencies Before Execution
    description: |
      Orchestrators MUST validate all dependencies (files, tools, configs) exist
      and are valid BEFORE starting execution.
      
      Pre-flight validation prevents:
      - Partial execution followed by failure
      - Wasted time on doomed operations
      - Confusing error messages mid-execution
    
    enforcement:
      trigger: orchestrator_execution_start
      action: block_if_dependencies_invalid
    
    validation:
      - Required files exist and are readable
      - Required tools/commands available (e.g., git, python)
      - Required configurations valid (schema validation)
      - Required permissions granted (write access, etc.)
      - Dependency validation results logged to audit
    
    implementation:
      middleware: src.infrastructure.dependency_validator.DependencyValidator
      manifest_key: "required_dependencies"
      pattern: |
        dependencies:
          files:
            - "path: cortex-brain/config/master-orchestrator.yaml"
              required: true
          commands:
            - "name: git"
              version: ">=2.0"
          permissions:
            - "path: cortex-brain/tier1/"
              access: write
    
    examples:
      pass:
        - "Planning v5 validates Tier 1 write access before execution"
        - "Checkpoint manager validates git command available + repository exists"
        - "Requirements auditor validates source directory exists + readable"
      fail:
        - "Planning v5 starts execution then fails on Tier 1 write (should check first)"
        - "Checkpoint manager starts then fails on missing git (should check first)"
        - "Requirements auditor processes 100 files then fails on write access (wasted time)"
    
    related_rules:
      - "MCP-003: Workspace boundary validation is a dependency check"
      - "OE-002: YAML schema validation is a dependency check"
    
    rationale: |
      Pre-flight validation is fail-fast best practice:
      1. Catches errors immediately (clear context)
      2. Prevents wasted work on doomed operations
      3. Improves error messages (specific dependency missing)
      4. Reduces debugging time

  # ==========================================================================
  # OE-010: Structured Logging with Correlation IDs
  # ==========================================================================
  - rule_id: OE-010
    category: orchestrator_coordination
    severity: enforced
    name: All Operations Must Use Structured Logging with Correlation IDs
    description: |
      All operations MUST use structured logging (key-value pairs) with
      correlation IDs to enable tracing across orchestrators, tools, and sessions.
      
      Structured logging enables:
      - Cross-orchestrator operation tracing
      - Multi-session debugging
      - Performance profiling
      - Automated log analysis
    
    enforcement:
      trigger: logging_statement
      action: enforce_structured_format
    
    validation:
      - Log entries are JSON (not free-form strings)
      - "Required fields: timestamp, level, correlation_id, orchestrator, operation, message"
      - "Optional fields: duration_ms, task_id, phase_id, user_id, metadata"
      - Correlation ID propagated across all related operations
      - "Correlation ID format: {orchestrator}-{session_id}-{timestamp}"
    
    implementation:
      logger: src.infrastructure.audit_logger.AuditLogger
      format: JSON Lines (.jsonl)
      pattern: |
        logger.info(
            "Operation completed",
            correlation_id=ctx.correlation_id,
            orchestrator="planning_v5",
            operation="create_plan",
            duration_ms=1234,
            task_count=5,
            metadata={"plan_name": "user-auth"}
        )
    
    examples:
      pass:
        - "Planning v5 logs: {correlation_id: 'plan-abc123-20260108', operation: 'phase_complete', phase: 'P2'}"
        - "Checkpoint manager logs: {correlation_id: 'plan-abc123-20260108', operation: 'checkpoint_create', checkpoint_id: 'CP0'}"
        - "Gap detector logs: {correlation_id: 'gap-def456-20260108', operation: 'gap_detected', gap_id: 'MI-001'}"
      fail:
        - "Planning v5 logs: 'Phase 2 complete' (no structure, can't query)"
        - "Checkpoint manager logs: 'Created CP0' (no correlation ID, can't trace)"
        - "Gap detector logs: 'Found gap' (no gap ID, can't correlate)"
    
    related_rules:
      - "MCP-006: Audit logging for MCP tools uses same structure"
      - "OE-008: Progress tracking uses structured logs"
    
    rationale: |
      Structured logging is essential for complex systems:
      1. Enables automated log analysis (grep, jq, Splunk)
      2. Traces operations across orchestrators/sessions
      3. Debugging is 10x faster (query by correlation ID)
      4. Performance profiling via duration aggregation

  # ==========================================================================
  # OE-011: Configuration via YAML Files (No Hardcoded Constants)
  # ==========================================================================
  - rule_id: OE-011
    category: validation_enforcement
    severity: enforced
    name: All Configuration Must Be in YAML Files (No Hardcoded Values)
    description: |
      Configuration values (timeouts, limits, paths, defaults) MUST be stored
      in YAML files under cortex-brain/config/, not hardcoded in Python.
      
      Externalized configuration enables:
      - Runtime tuning without code changes
      - Different configs for dev/test/prod
      - User customization without forking
      - Easier debugging (change config, retry)
    
    enforcement:
      trigger: code_review
      action: reject_hardcoded_constants
    
    validation:
      - No magic numbers in code (except 0, 1, -1)
      - Configuration loaded from cortex-brain/config/{component}.yaml
      - Default values in YAML (fallback if config missing)
      - Configuration schema validated on load (OE-002)
      - Configuration changes logged to audit
    
    implementation:
      loader: src.infrastructure.config_loader.ConfigLoader
      pattern: |
        config = ConfigLoader.load("planning-orchestrator")
        max_retries = config.get("retry.max_attempts", default=3)
        timeout_seconds = config.get("timeout.default", default=30)
    
    examples:
      pass:
        - "Planning v5 timeout: config/planning-orchestrator.yaml -> timeout_seconds: 300"
        - "Retry logic: config/retry-policy.yaml -> max_retries: 3"
        - "Dashboard refresh: config/dashboard-generator.yaml -> refresh_interval_seconds: 10"
      fail:
        - "Planning v5: timeout = 300  # Hardcoded (should be in config)"
        - "Retry logic: for i in range(3):  # Magic number (should be in config)"
        - "Dashboard: time.sleep(10)  # Hardcoded interval (should be in config)"
    
    related_rules:
      - "OE-002: Configuration YAML must validate against schema"
      - "OE-009: Configuration file is a dependency to validate"
    
    rationale: |
      Externalized configuration is best practice:
      1. Tuning doesn't require code changes (no deploy)
      2. Different environments use different configs
      3. Users can customize behavior (no fork needed)
      4. Configuration is self-documenting (YAML comments)

  # ==========================================================================
  # OE-012: Dead Letter Queue for Failed Operations
  # ==========================================================================
  - rule_id: OE-012
    category: error_recovery
    severity: enforced
    name: Failed Operations Must Be Moved to Dead Letter Queue
    description: |
      Operations that fail after max retries MUST be moved to a dead letter
      queue (DLQ) for later inspection/reprocessing instead of being discarded.
      
      Dead letter queues enable:
      - Analysis of failure patterns
      - Manual retry after fixing root cause
      - No silent data loss
      - Audit trail of all failures
    
    enforcement:
      trigger: operation_max_retries_exceeded
      action: move_to_dlq
    
    validation:
      - "Failed operation moved to: cortex-brain/tier1/dlq/{orchestrator}/{timestamp}/"
      - "DLQ entry includes: Original request, error details, retry history, timestamp"
      - DLQ monitored for accumulation (alert if >10 entries)
      - DLQ entries have TTL (auto-delete after 30 days)
      - Manual reprocessing tool available
    
    implementation:
      utility: src.infrastructure.dead_letter_queue.DeadLetterQueue
      pattern: |
        try:
            result = retry_with_backoff(operation, max_retries=3)
        except MaxRetriesExceeded as e:
            dlq.add(
                operation=operation,
                error=e,
                retry_history=e.retry_history,
                metadata={"correlation_id": ctx.correlation_id}
            )
            logger.error("Operation failed, moved to DLQ", dlq_id=dlq_id)
    
    examples:
      pass:
        - "Requirements conversion fails on malformed MD -> DLQ (analyze later)"
        - "Git operation fails after 3 retries -> DLQ (investigate repo issue)"
        - "YAML validation fails on invalid structure -> DLQ (fix schema or data)"
      fail:
        - "Requirements conversion fails -> silently skip (data loss)"
        - "Git operation fails -> abort entire operation (other work lost)"
        - "YAML validation fails -> discard file (no record of failure)"
    
    related_rules:
      - "OE-004: DLQ is final destination after retry exhaustion"
      - "OE-010: DLQ entries use structured logging"
    
    rationale: |
      Dead letter queues prevent silent failures:
      1. No data is silently lost (all failures recorded)
      2. Failure patterns become visible (common root causes)
      3. Manual intervention possible (reprocess after fix)
      4. Audit compliance (prove all data handled)

  # ==========================================================================
  # OE-013: Health Check Endpoints for All Orchestrators
  # ==========================================================================
  - rule_id: OE-013
    category: performance_optimization
    severity: recommended
    name: Orchestrators Should Expose Health Check Endpoints
    description: |
      Orchestrators SHOULD implement health check methods that return current
      status, active operations, and resource usage.
      
      Health checks enable:
      - Monitoring dashboard (operational visibility)
      - Automated alerting (detect stuck operations)
      - Load balancing (distribute work)
      - Debugging (what's running right now?)
    
    enforcement:
      trigger: orchestrator_registration
      action: warn_if_no_health_check
    
    validation:
      - "Health check method: get_health_status() -> dict"
      - "Returns: status (healthy/degraded/unhealthy), active_operations, resource_usage"
      - Response time <100ms (lightweight check)
      - Health check doesn't block normal operations
      - Health history logged for trend analysis
    
    implementation:
      interface: src.orchestrators.base_orchestrator.HealthCheckMixin
      endpoint: /api/v1/orchestrators/{orchestrator_id}/health
      pattern: |
        def get_health_status(self) -> Dict[str, Any]:
            return {
                "status": "healthy" if self.is_operational() else "degraded",
                "active_operations": len(self.active_tasks),
                "resource_usage": {
                    "memory_mb": self.get_memory_usage(),
                    "cpu_percent": self.get_cpu_usage()
                },
                "last_error": self.last_error or None,
                "uptime_seconds": self.get_uptime()
            }
    
    examples:
      pass:
        - "Planning v5 health: {status: 'healthy', active_plans: 2, memory_mb: 150}"
        - "ADO v2 health: {status: 'degraded', error: 'GitHub API rate limited', active_stories: 5}"
        - "Checkpoint manager health: {status: 'healthy', active_checkpoints: 0, disk_usage_mb: 1200}"
      fail:
        - "Planning v5: No health check (can't detect if stuck)"
        - "ADO v2: Health check takes 5 seconds (too slow)"
        - "Checkpoint manager: Health check returns null (no information)"
    
    related_tools:
      - "P0-T4: Dashboard Generator (uses health checks)"
    
    related_rules:
      - "OE-008: Progress tracking complements health checks"
      - "OE-010: Health status changes logged"
    
    rationale: |
      Health checks enable proactive monitoring:
      1. Detect stuck operations before users complain
      2. Monitor resource usage trends (predict capacity issues)
      3. Automated alerting (page on-call if unhealthy)
      4. Load balancing (route work to healthy instances)

  # ==========================================================================
  # OE-014: Mandatory Schema Evolution Strategy
  # ==========================================================================
  - rule_id: OE-014
    category: data_integrity
    severity: blocked
    name: All Schema Changes Must Follow Backward-Compatible Evolution
    description: |
      Changes to YAML schemas (plan, requirements, state, config) MUST follow
      backward-compatible evolution rules to prevent breaking existing data.
      
      Compatible changes:
      - Add optional fields (with defaults)
      - Widen types (string -> string|null)
      - Increase limits (max_length: 100 -> 200)
      
      Incompatible changes (REQUIRE MIGRATION):
      - Remove required fields
      - Rename fields
      - Change types (string -> number)
      - Add required fields (no default)
    
    enforcement:
      trigger: schema_file_modification
      action: block_if_breaking_change_without_migration
    
    validation:
      - "Schema version incremented (semver: MAJOR.MINOR.PATCH)"
      - Breaking changes increment MAJOR version
      - Non-breaking changes increment MINOR version
      - Migration script provided for breaking changes
      - Old schema versions retained for 2 major versions
      - Migration tested on real data before deployment
    
    implementation:
      validator: src.infrastructure.schema_validator.SchemaEvolutionValidator
      migration_dir: cortex-brain/migrations/schemas/
      pattern: |
        # v1.0.0 -> v2.0.0 (breaking: removed field)
        # Migration: v1_to_v2_remove_deprecated_field.py
        # Provides: migrate_data(old_data) -> new_data
    
    examples:
      pass:
        - "Plan schema v1.0.0 -> v1.1.0: Add optional 'tags' field (backward compatible)"
        - "Requirements schema v2.0.0 -> v3.0.0: Remove 'deprecated_status' + migration script"
        - "State schema v1.2.0 -> v1.2.1: Fix typo in comment (patch version)"
      fail:
        - "Plan schema: Remove required 'phase_id' field (no migration, breaks existing plans)"
        - "Requirements schema: Rename 'name' -> 'title' (no migration, breaks readers)"
        - "State schema: Change 'progress' from number -> string (breaks parsers)"
    
    related_rules:
      - "OE-002: Validation enforces current schema version"
      - "OE-009: Schema file is a dependency to validate"
    
    rationale: |
      Schema evolution prevents data incompatibility:
      1. Old data remains readable (no forced migration)
      2. Gradual migration possible (parallel old/new versions)
      3. Rollback safe (old code works with new data if compatible)
      4. No data loss on upgrade

  # ==========================================================================
  # OE-015: Resource Limits to Prevent Runaway Operations
  # ==========================================================================
  - rule_id: OE-015
    category: performance_optimization
    severity: blocked
    name: All Long-Running Operations Must Have Resource Limits
    description: |
      Operations that process unbounded data (files, records, iterations) MUST
      have configurable resource limits to prevent runaway execution.
      
      Resource limits:
      - Max execution time (timeout)
      - Max memory usage
      - Max file size processed
      - Max iterations
      
      This prevents infinite loops, memory exhaustion, and token limit errors.
    
    enforcement:
      trigger: long_running_operation_start
      action: block_if_no_resource_limits
    
    validation:
      - "Timeout configured (default: 5 minutes, max: 1 hour)"
      - "Memory limit configured (default: 1GB, max: 4GB)"
      - "Max items configured (default: 1000 files, 10000 records)"
      - Limits enforced at runtime (operation aborted if exceeded)
      - Exceeded limits logged with ERROR level
    
    implementation:
      decorator: src.infrastructure.resource_limiter.with_limits
      config_file: cortex-brain/config/resource-limits.yaml
      pattern: |
        @with_limits(
            timeout_seconds=300,
            max_memory_mb=1024,
            max_iterations=1000
        )
        def process_files(files: List[Path]):
            for file in files:
                process(file)
    
    examples:
      pass:
        - "Requirements auditor: Max 10,000 files, timeout 10 minutes"
        - "Vacuum: Max 100GB processed, timeout 1 hour"
        - "Gap detector: Max 5,000 modules analyzed, timeout 15 minutes"
      fail:
        - "Requirements auditor: No file limit (processes 1M files, crashes)"
        - "Vacuum: No timeout (runs forever on corrupt filesystem)"
        - "Gap detector: No iteration limit (infinite loop on circular dependencies)"
    
    related_rules:
      - "CORE-001: Incremental execution prevents token limits"
      - "OE-004: Timeout is transient failure -> retry"
      - "OE-012: Exceeded limits -> DLQ for inspection"
    
    rationale: |
      Resource limits prevent catastrophic failures:
      1. Runaway operations don't crash system
      2. Token limit errors avoided (incremental processing)
      3. Memory exhaustion prevented (graceful abort)
      4. Infinite loops detected (iteration limit)

