# SSOT ENFORCEMENT RULES v1.0.0
# Purpose: Conflict resolution protocol for CORTEX 6.0
# Created: 2026-01-13
# Author: Asif Hussain
# Governance: CORE-002, CORE-009, CORE-017

# ══════════════════════════════════════════════════════════════════════
# PRIMARY RULE: master-plan.yaml is the SINGLE SOURCE OF TRUTH
# ══════════════════════════════════════════════════════════════════════

ssot_metadata:
  version: "1.0.0"
  created: "2026-01-13T13:00:00Z"
  updated: "2026-01-13T13:00:00Z"
  authority: "CORTEX 6.0 Architecture Team"
  enforcement_mode: "AUTOMATIC"
  violation_consequence: "FILE_DELETION"

# ══════════════════════════════════════════════════════════════════════
# AUTHORITY HIERARCHY (Highest to Lowest Priority)
# ══════════════════════════════════════════════════════════════════════

authority_hierarchy:
  tier_1_architecture:
    file: "cortex-brain/cx6-plan/master-plan.yaml"
    authority: "ABSOLUTE"
    description: "Defines ALL phases, AC-ID ranges, timelines, dependencies, machine assignments"
    modification_policy: "EXPLICIT_USER_APPROVAL_ONLY"
    conflict_resolution: "master-plan.yaml ALWAYS WINS"
    
  tier_2_execution_state:
    file: "cortex-brain/tier1/tracking/progress-tracker.json"
    authority: "HIGH"
    description: "Tracks execution state (current phase, completed AC-IDs, test evidence)"
    modification_policy: "MASTERORCHESTRATOR_ONLY"
    conflict_resolution: "progress-tracker.json wins execution state conflicts ONLY"
    
  tier_3_acceptance_criteria:
    file: "cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml"
    authority: "MEDIUM"
    description: "Defines acceptance criteria for each AC-ID"
    modification_policy: "MASTERORCHESTRATOR_OR_EXPLICIT_APPROVAL"
    conflict_resolution: "AC-INDEX.yaml defines AC criteria, but master-plan defines AC ranges"
    
  tier_4_governance:
    file: "cortex-brain/tier0/governance/core-rules.yaml"
    authority: "MEDIUM"
    description: "19 SKULL governance rules"
    modification_policy: "GOVERNANCE_TEAM_ONLY"
    conflict_resolution: "core-rules.yaml enforces behavior, but master-plan defines scope"

# ══════════════════════════════════════════════════════════════════════
# CONFLICT DETECTION RULES
# ══════════════════════════════════════════════════════════════════════

conflict_detection:
  # Phase Definition Conflicts
  phase_definitions:
    condition: "File defines phases that conflict with master-plan.yaml"
    resolution: "DELETE conflicting file, use master-plan.yaml as reference"
    examples:
      - "phase-1-tracking.json (defines Phase 1 differently than master-plan)"
      - "phase-2-plan.yaml (defines Phase 2 AC-IDs differently)"
      - "cx6-plan/phases/*.yaml (redundant phase definitions)"
  
  # AC-ID Range Conflicts
  ac_id_ranges:
    condition: "File claims AC-IDs outside master-plan.yaml defined ranges"
    resolution: "REJECT claims, update file to match master-plan ranges"
    examples:
      - "AC-AUDIT-099 claimed but master-plan only defines AC-AUDIT-001 to 007"
      - "AC-PHASE-001 claimed but no such prefix exists in master-plan"
  
  # Timeline Conflicts
  timelines:
    condition: "File defines different phase timelines than master-plan.yaml"
    resolution: "Use master-plan.yaml timelines, ignore conflicting file"
    examples:
      - "phase-schedule.yaml (defines different week allocations)"
      - "project-plan.md (narrative timeline contradicting master-plan)"
  
  # Machine Assignment Conflicts
  machine_assignments:
    condition: "File assigns phases to different machines than master-plan.yaml"
    resolution: "Use master-plan.yaml machine_assignment section"
    examples:
      - "Phase 4 assigned to WIN but master-plan assigns to MAC"
      - "Phase 2 assigned to MAC but master-plan assigns to WIN"

# ══════════════════════════════════════════════════════════════════════
# FILES TO DELETE (Redundant with SSOT)
# ══════════════════════════════════════════════════════════════════════

files_to_delete:
  redundant_tracking:
    reason: "progress-tracker.json is the ONLY execution state source"
    patterns:
      - "cortex-brain/cx6-plan/tracking/phase-*-tracking.json"
      - "cortex-brain/tier1/tracking/phase-*.json"
      - "cortex-brain/state/phase-state-*.json"
    action: "DELETE_IMMEDIATELY"
    exception: "None - ALL redundant tracking files must be deleted"
  
  redundant_plans:
    reason: "master-plan.yaml is the ONLY architecture source"
    patterns:
      - "cortex-brain/cx6-plan/phases/phase-*-plan.yaml"
      - "cortex-brain/documents/plans/phase-*.md"
      - "cortex-brain/cx6-plan/phase-*.yaml"
    action: "DELETE_IMMEDIATELY"
    exception: "Keep reference documents in cortex-brain/documents/reference/"
  
  multiple_sync_scripts:
    reason: "regenerate_plan_viewer_data.py is the ONLY sync script"
    patterns:
      - "scripts/sync_plan_viewer_*.py"
      - "scripts/update_dashboard_*.py"
      - "scripts/*_plan_data.py"
    action: "DELETE_IMMEDIATELY"
    exception: "Keep regenerate_plan_viewer_data.py ONLY"
  
  manual_dashboard_edits:
    reason: "plan-viewer-data.json is DERIVED from SSOT (never manually edited)"
    patterns:
      - "cortex-brain/cx6-plan/viewer/plan-viewer-data-*.json"
      - "cortex-brain/cx6-plan/viewer/plan-viewer-backup-*.json"
    action: "DELETE_IMMEDIATELY"
    exception: "Keep plan-viewer-data.json ONLY (regenerated automatically)"

# ══════════════════════════════════════════════════════════════════════
# PROTECTED FILES (Never Delete)
# ══════════════════════════════════════════════════════════════════════

protected_files:
  primary_ssot:
    - path: "cortex-brain/cx6-plan/master-plan.yaml"
      reason: "PRIMARY SSOT for architecture"
      modification_policy: "EXPLICIT_USER_APPROVAL_ONLY"
    
    - path: "cortex-brain/tier1/tracking/progress-tracker.json"
      reason: "PRIMARY SSOT for execution state"
      modification_policy: "MASTERORCHESTRATOR_ONLY"
  
  governance:
    - path: "cortex-brain/tier0/governance/core-rules.yaml"
      reason: "19 SKULL governance rules"
      modification_policy: "GOVERNANCE_TEAM_ONLY"
    
    - path: "cortex-brain/tier1/acceptance-criteria/AC-INDEX.yaml"
      reason: "AC-ID acceptance criteria definitions"
      modification_policy: "MASTERORCHESTRATOR_OR_EXPLICIT_APPROVAL"
  
  dashboard_system:
    - path: "cortex-brain/cx6-plan/viewer/plan-viewer.html"
      reason: "Dashboard UI (only modified for UI enhancements)"
      modification_policy: "EXPLICIT_USER_APPROVAL_ONLY"
    
    - path: "cortex-brain/cx6-plan/viewer/plan-viewer-data.json"
      reason: "Dashboard feed (regenerated automatically from SSOT)"
      modification_policy: "REGENERATION_SCRIPT_ONLY"
    
    - path: "scripts/regenerate_plan_viewer_data.py"
      reason: "ONLY sync script (SSOT → Dashboard)"
      modification_policy: "EXPLICIT_USER_APPROVAL_ONLY"

# ══════════════════════════════════════════════════════════════════════
# DASHBOARD SYNC PROTOCOL
# ══════════════════════════════════════════════════════════════════════

dashboard_sync_protocol:
  trigger_events:
    - "AC-ID completion with test evidence"
    - "Phase completion (100% gate)"
    - "Explicit user request"
    - "Evidence validation run (audit_based_evidence_validator.py)"
  
  sync_workflow:
    step_1:
      action: "Validate evidence (≥80% verification rate required)"
      command: "python3 scripts/audit_based_evidence_validator.py"
      gate: "BLOCK sync if verification rate < 80%"
    
    step_2:
      action: "Regenerate dashboard data from SSOT"
      command: "python3 scripts/regenerate_plan_viewer_data.py"
      inputs:
        - "cortex-brain/cx6-plan/master-plan.yaml (architecture)"
        - "cortex-brain/tier1/tracking/progress-tracker.json (execution state)"
      output: "cortex-brain/cx6-plan/viewer/plan-viewer-data.json"
    
    step_3:
      action: "Verify dashboard accuracy"
      checks:
        - "AC-ID counts match master-plan.yaml"
        - "Completion percentages match progress-tracker.json"
        - "Machine assignments match master-plan machine_assignment section"
        - "Phase statuses reflect test evidence, not claims"
    
    step_4:
      action: "Report sync status"
      output_format: |
        ✅ Dashboard synced to reality
        • Verification rate: {X}% (≥80% required)
        • Phases updated: {count}
        • AC-IDs with evidence: {completed}/{total}
  
  sync_frequency:
    within_phase: "After each AC-ID completion (continuous)"
    phase_boundary: "MANDATORY after 100% phase completion"
    on_demand: "Via explicit user request"
    scheduled: "NOT RECOMMENDED (use event-driven sync)"

# ══════════════════════════════════════════════════════════════════════
# CONFLICT RESOLUTION WORKFLOW
# ══════════════════════════════════════════════════════════════════════

conflict_resolution_workflow:
  detection:
    command: "python3 -m src.main 'detect SSOT conflicts' --format markdown"
    checks:
      - "Scan for redundant tracking files"
      - "Scan for redundant plan files"
      - "Scan for multiple sync scripts"
      - "Validate AC-ID ranges against master-plan"
      - "Validate phase definitions against master-plan"
      - "Validate machine assignments against master-plan"
  
  resolution:
    automatic:
      condition: "Conflict matches predefined patterns"
      action: "DELETE conflicting file (log action to audit trail)"
      examples:
        - "phase-1-tracking.json → DELETE (use progress-tracker.json)"
        - "phase-2-plan.yaml → DELETE (use master-plan.yaml)"
        - "sync_dashboard_alternate.py → DELETE (use regenerate_plan_viewer_data.py)"
    
    manual:
      condition: "Conflict requires human judgment"
      action: "FLAG for user review (do NOT auto-delete)"
      examples:
        - "AC-INDEX.yaml has AC-IDs not in master-plan (new feature?)"
        - "progress-tracker.json claims completion without test evidence"
        - "core-rules.yaml conflicts with master-plan governance scope"
  
  reporting:
    format: |
      ⚠️ SSOT CONFLICTS DETECTED
      
      Automatic Resolutions:
      • {count} redundant tracking files deleted
      • {count} redundant plan files deleted
      • {count} duplicate sync scripts deleted
      
      Manual Review Required:
      • {description of conflict requiring judgment}
      
      SSOT Integrity: ✅ RESTORED

# ══════════════════════════════════════════════════════════════════════
# ENFORCEMENT HOOKS
# ══════════════════════════════════════════════════════════════════════

enforcement_hooks:
  pre_execution:
    hook: "load_ssot_enforcement_rules()"
    action: "Load this file before any prompt execution"
    location: "cortex-plan-executor.prompt.md → STEP 0"
  
  pre_file_creation:
    hook: "validate_file_against_ssot()"
    action: "BLOCK creation of redundant tracking/plan files"
    examples:
      - "Attempt to create phase-3-tracking.json → BLOCKED"
      - "Attempt to create phase-4-plan.yaml → BLOCKED"
  
  pre_file_modification:
    hook: "validate_modification_policy()"
    action: "BLOCK unauthorized modifications to protected files"
    examples:
      - "Attempt to manually edit plan-viewer-data.json → BLOCKED"
      - "Attempt to modify master-plan.yaml without approval → BLOCKED"
  
  post_sync:
    hook: "verify_dashboard_accuracy()"
    action: "Validate dashboard reflects SSOT after regeneration"
    checks:
      - "AC-ID counts match master-plan"
      - "Completion percentages match progress-tracker"
      - "Machine assignments match master-plan"

# ══════════════════════════════════════════════════════════════════════
# TROUBLESHOOTING COMMANDS
# ══════════════════════════════════════════════════════════════════════

troubleshooting:
  detect_conflicts:
    command: "python3 -m src.main 'detect SSOT conflicts per ssot-enforcement.yaml' --format markdown"
    description: "Scan for files that violate SSOT architecture"
  
  resolve_conflicts:
    command: "python3 -m src.main 'resolve SSOT conflicts per ssot-enforcement.yaml' --format markdown"
    description: "Auto-delete redundant files, flag manual review items"
  
  validate_ssot:
    command: "python3 -c 'import yaml; yaml.safe_load(open(\"cortex-brain/cx6-plan/master-plan.yaml\"))'"
    description: "Verify master-plan.yaml is valid YAML"
  
  regenerate_dashboard:
    command: "python3 scripts/regenerate_plan_viewer_data.py"
    description: "Force dashboard regeneration from SSOT"
  
  validate_evidence:
    command: "python3 scripts/audit_based_evidence_validator.py"
    description: "Check that tracker claims are backed by test evidence"

