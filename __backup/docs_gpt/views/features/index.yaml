schema_version: 1.0
view:
  id: features-index-html
  title: "Features"
  target_html: "features/index.html"
  nav_level: 1
  parent: "index.html"
  audiences: ["Business leaders", "Product Owners", "Software Engineers"]
  tagline: "What makes CORTEX stand out"
design:
  base_template: "index_gemini.html"
  look_and_feel:
    theme: "dark glassmorphism + neon accents (cyan/purple)"
    typography: ["Inter", "Orbitron"]
    motion: "subtle, physics-y easing; no obnoxious bounce"
    accessibility: "WCAG-minded contrast, focus states, reduced-motion support"
  responsive:
    breakpoints_px: [1200, 900, 600]
    targets: ["phone", "tablet", "ipad", "desktop"]
  shared_components_required:
    - "sticky top nav with active section highlight"
    - "breadcrumb trail for level-2 pages"
    - "page-loading overlay (fast fade)"
    - "footer quick-links grid"
    - "glass-card component library"
    - "tab component (when useful)"
    - "lightweight animation helpers (IntersectionObserver reveal)"
assets:
  allowed_external_cdns:
    - name: "Font Awesome"
      url: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    - name: "Google Fonts"
      url: "https://fonts.googleapis.com"
    - name: "Mermaid"
      url: "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
    - name: "D3"
      url: "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"
  local_assets_expected:
    - "assets/images/CORTEX-logo-512.png"
    - "assets/images/Awakening-200.png"
    - "assets/images/MP4/E2E-Execution.mp4"
implementation_instructions:
  keep_text_minimal: true
  be_visual_first: true
  avoid_wall_of_text: true
  diagrams_are_required: true
  animations_should_be_subtle: true
  no_framework_required: true
  preferred_stack: ["HTML", "CSS", "Vanilla JS", "Mermaid", "D3.js"]
  include: 
    - "shared layout partials OR a small JS include to keep nav/footer consistent"
    - "one CSS file for shared tokens + per-page CSS blocks if needed"
  quality_bar:
    - "looks like a premium enterprise product site"
    - "everything aligns, breathes, and responds well on small screens"
    - "no broken links; nav matches master sitemap"

page:
  hero:
    headline: "Capabilities that compound"
    subheadline: "Governance, orchestration, intelligence\u2014and proof baked in."
    primary_cta: {"label": "Explore Lens", "href": "../lens/index.html"}
    secondary_cta: {"label": "Explore Toolkit", "href": "../toolkit-manager/index.html"}
  sections:
    - id: capability-map
      title: "Capability map (clickable)"
      layout: "interactive constellation grid"
      content_rules:
        - "keep copy to 2-4 short lines per card"
        - "prefer bullets over paragraphs"
      components:
        - "Constellation/graph of capabilities as glowing nodes grouped by: Governance, Orchestration, Intelligence, Proof"
        - "Each node links to the most relevant page; hover shows 1-sentence value"
      visualizations:
        - type: d3
          widget: "capability_constellation"
          label: "CORTEX capability constellation"
          data: "Nodes: Token Optimization, Lens, Toolkit/MCP, Orchestrators, Evidence, Audit, Lifecycle, TDD Mastery."
          behavior: "lazy-render when in viewport; tooltip on hover; keyboard focusable when feasible"
        - type: mermaid
          diagram_type: "flowchart"
          label: "How capabilities compound"
          content_guidance: "Foundation \u2192 MasterOrchestrator \u2192 Feature Orchestrators \u2192 Intelligence Layer \u2192 Views/Tooling"
          style: "dark theme + neon accents; wrapped in glass-card; copy button"
      interactions:
        - "Search filter for nodes"
        - "Click to open modal details with one diagram and one KPI chip (demo)"
    - id: token-optimization
      title: "Token Optimization (show the money)"
      layout: "two-column: metric widgets + process diagram"
      content_rules:
        - "keep copy to 2-4 short lines per card"
        - "prefer bullets over paragraphs"
      components:
        - "Savings gauge + cost projection cards"
        - "Before/after prompt preview (blurred; no walls of text)"
      visualizations:
        - type: d3
          widget: "token_savings_gauge"
          label: "Savings gauge"
          data: "60\u201380% token savings (demo). Include per-team monthly projection."
          behavior: "lazy-render when in viewport; tooltip on hover; keyboard focusable when feasible"
        - type: mermaid
          diagram_type: "sequenceDiagram"
          label: "Token optimization sequence"
          content_guidance: "Request \u2192 Context pruning \u2192 Summarize \u2192 Cache \u2192 Execute \u2192 Audit"
          style: "dark theme + neon accents; wrapped in glass-card; copy button"
    - id: tdd-mastery
      title: "TDD Mastery"
      layout: "triple-lane animation"
      content_rules:
        - "keep copy to 2-4 short lines per card"
        - "prefer bullets over paragraphs"
      components:
        - "Three-lane conveyor: RED \u2192 GREEN \u2192 REFACTOR (animated with CSS)"
        - "Evidence bundle preview card (manifest/tests/audit)"
      visualizations:
        - type: mermaid
          diagram_type: "stateDiagram-v2"
          label: "TDD state machine"
          content_guidance: "RED --> GREEN --> REFACTOR --> GREEN"
          style: "dark theme + neon accents; wrapped in glass-card; copy button"
        - type: d3
          widget: "test_pass_rate"
          label: "Test pass rate timeline"
          data: "Demo: pass-rate improving across iterations with annotations."
          behavior: "lazy-render when in viewport; tooltip on hover; keyboard focusable when feasible"
