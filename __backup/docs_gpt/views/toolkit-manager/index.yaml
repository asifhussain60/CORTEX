schema_version: 1.0
view:
  id: toolkit-manager-index-html
  title: "Toolkit Manager"
  target_html: "toolkit-manager/index.html"
  nav_level: 1
  parent: "index.html"
  audiences: ["Business leaders", "Product Owners", "Software Engineers"]
  tagline: "View generators, dashboards, and MCP-exposed tools"
design:
  base_template: "index_gemini.html"
  look_and_feel:
    theme: "dark glassmorphism + neon accents (cyan/purple)"
    typography: ["Inter", "Orbitron"]
    motion: "subtle, physics-y easing; no obnoxious bounce"
    accessibility: "WCAG-minded contrast, focus states, reduced-motion support"
  responsive:
    breakpoints_px: [1200, 900, 600]
    targets: ["phone", "tablet", "ipad", "desktop"]
  shared_components_required:
    - "sticky top nav with active section highlight"
    - "breadcrumb trail for level-2 pages"
    - "page-loading overlay (fast fade)"
    - "footer quick-links grid"
    - "glass-card component library"
    - "tab component (when useful)"
    - "lightweight animation helpers (IntersectionObserver reveal)"
assets:
  allowed_external_cdns:
    - name: "Font Awesome"
      url: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    - name: "Google Fonts"
      url: "https://fonts.googleapis.com"
    - name: "Mermaid"
      url: "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
    - name: "D3"
      url: "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"
  local_assets_expected:
    - "assets/images/CORTEX-logo-512.png"
    - "assets/images/Awakening-200.png"
    - "assets/images/MP4/E2E-Execution.mp4"
implementation_instructions:
  keep_text_minimal: true
  be_visual_first: true
  avoid_wall_of_text: true
  diagrams_are_required: true
  animations_should_be_subtle: true
  no_framework_required: true
  preferred_stack: ["HTML", "CSS", "Vanilla JS", "Mermaid", "D3.js"]
  include: 
    - "shared layout partials OR a small JS include to keep nav/footer consistent"
    - "one CSS file for shared tokens + per-page CSS blocks if needed"
  quality_bar:
    - "looks like a premium enterprise product site"
    - "everything aligns, breathes, and responds well on small screens"
    - "no broken links; nav matches master sitemap"

page:
  hero:
    headline: "Tools that make governance visible"
    subheadline: "Interactive viewers and generators that turn orchestration into something you can inspect."
    primary_cta: {"label": "Open Plan Viewer", "href": "plan-viewer.html"}
    secondary_cta: {"label": "MCP Server", "href": "mcp.html"}
  sections:
    - id: toolkit-overview
      title: "CORTEX Toolkit"
      layout: "two-column: tool cards + live preview widgets"
      content_rules:
        - "keep copy to 2-4 short lines per card"
        - "prefer bullets over paragraphs"
      components:
        - "Tool cards: Plan Viewer, Audit Viewer, Diagram Generator, Knowledge Graph, Evidence Browser, MCP Server"
        - "Mini previews (small D3 widgets) inside cards"
      visualizations:
        - type: d3
          widget: "tool_usage_sunburst"
          label: "Toolkit usage sunburst"
          data: "Demo: which tools are used by which persona and phase."
          behavior: "lazy-render when in viewport; tooltip on hover; keyboard focusable when feasible"
        - type: mermaid
          diagram_type: "flowchart"
          label: "Toolkit architecture"
          content_guidance: "Orchestrators \u2192 Emit artifacts \u2192 Toolkit renders views \u2192 Users explore"
          style: "dark theme + neon accents; wrapped in glass-card; copy button"
      interactions:
        - "Card hover reveals 'Open' + 'How it works' buttons"
