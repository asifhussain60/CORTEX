# 
CORE-095: Repository Folder Structure Governance
Authority: Wave 9 Ultimate Cleanup & Consolidation
Created: 2026-02-12
Status: ACTIVE
# 

rule_id: CORE-095
title: Repository Folder Structure Governance
category: architecture-integrity
severity: P1-HIGH
auto_fix: true

description: |
  Enforce clean repository folder structure to prevent drift and maintain coherence.
  
  BLOCKS:
  - Creating top-level folders outside approved structure
  - Creating duplicate functionality folders (e.g., governance_tools when governance/tools exists)
  - Nested workspace folders (e.g., _workspaces/legacy-backup)
  
  APPROVED TOP-LEVEL FOLDERS:
  - cortex/ (main package)
  - cortex_intelligence/ (brain & intelligence - RENAMED from cortex_intelligence in Phase 103)
  - cortex_lens/ (code intelligence)
  - cortex-registry/ (master planning)
  - tests/ (test suite)
  - docs/ (documentation)
  - scripts/ (utility scripts)
  - deployment/ (deployment configs)
  - company/ (customer-specific)
  - _workspaces/ (experimental, must contain only .chats/)
  - _archives/ (historical backups)
  
  ALL OTHER TOP-LEVEL FOLDERS: BLOCKED

rationale: |
  Wave 9 analysis revealed repository drift with 8+ unnecessary top-level folders:
  - _workspaces/ grew to 15 MB of legacy content
  - governance_tools/ duplicated governance/ structure
  - src/ existed as legacy folder with zero imports
  - dist/, .pytest_cache/ were committed (should be gitignored)
  
  This rule prevents recurrence by enforcing approved structure at commit time.

violations:
  - pattern: "^[^/]+/$"
    severity: WARNING
    message: "New top-level folder detected. Must be in approved list."
    auto_fix: false
    guidance: |
      If this is a new legitimate module, add to APPROVED_FOLDERS in CORE-095.
      If this is temporary/experimental, use _workspaces/.chats/ or _archives/.
  
  - pattern: "^src/"
    severity: ERROR
    message: "src/ folder is legacy (removed in Wave 9). Use cortex/ instead."
    auto_fix: true
    fix_action: "Block commit, display migration guide"
  
  - pattern: "^_workspaces/(?!\.chats)"
    severity: WARNING
    message: "_workspaces/ should only contain .chats/ (active chat sessions)"
    auto_fix: false
    guidance: |
      Legacy workspace content should be archived to _archives/ or deleted.
      Only _workspaces/.chats/ is approved for continuation optimizer.

enforcement:
  pre_commit: true
  ci_cd: true
  vacuum_orchestrator: true
  
  pre_commit_hook: |
    # .githooks/pre-commit (CORE-095 enforcement)
    
    # Get list of top-level folders in staged files
    STAGED_FOLDERS=$(git diff --cached --name-only --diff-filter=A | \
                     grep '^[^/]\+/$' | \
                     cut -d'/' -f1 | \
                     sort -u)
    
    APPROVED_FOLDERS="cortex cortex_intelligence cortex_lens cortex-registry tests docs scripts deployment company _workspaces _archives"
    
    for folder in $STAGED_FOLDERS; do
      if ! echo "$APPROVED_FOLDERS" | grep -qw "$folder"; then
        echo "❌ CORE-095 VIOLATION: Unapproved top-level folder '$folder/'"
        echo "   Approved folders: $APPROVED_FOLDERS"
        echo "   To add: Update CORE-095 governance rule"
        exit 1
      fi
    done

examples:
  violations:
    - file: "new_module/"
      reason: "Top-level folder not in approved list"
      fix: "Move to cortex/new_module/ or add to CORE-095"
    
    - file: "_workspaces/experiments/"
      reason: "Only .chats/ allowed in _workspaces/"
      fix: "Archive to _archives/ or delete"
    
    - file: "src/utils.py"
      reason: "src/ is legacy, removed in Wave 9"
      fix: "Use cortex/utils.py instead"

metrics:
  wave_9_cleanup:
    folders_removed: 8
    space_freed_mb: 14.1
    files_removed: 706
  
  prevention_target:
    top_level_folders: "≤ 11"
    _workspaces_folders: "= 1 (.chats/ only)"
    legacy_folders: "= 0"

