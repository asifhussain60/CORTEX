integration_test_gaps:
  gap_summary: |
    CRITICAL FINDING: PHASE-22-23-24 Orchestrator Integration Tests Incomplete
    
    Context:
    • PHASE-22 (MCP Protocol): 8 ACs, 187 tests, 100% pass
    • PHASE-23 (Complexity Gate): 4 ACs, tests passing
    • PHASE-24 (Response Composition): 4 ACs, tests passing
    
    Problem:
    • Tests verify individual PHASE functionality in isolation
    • No end-to-end orchestrator coordination tests
    • No multi-phase interaction scenario tests
    • No critical path validation (common user workflows)
  
  critical_paths_to_test: |
    CRITICAL PATH #1: Multi-turn MCP Tool Invocation
    ────────────────────────────────────────────────
    User: "Call cortex-mcp tool: execute_operation"
    Turn 1: MasterOrchestrator routes → LENS (4 phases) → Complexity Gate → Calls tool
    Turn 2: Tool returns result → Response Composition wraps → User sees result
    Turn 3: User: "Explain what you did" → MCP tool log → Response with PHASE-24 header
    
    Test Required:
    • test_mcp_multi_turn_orchestration.py
    • Verify tool exposed correctly (PHASE-22)
    • Verify complexity gate evaluates correctly (PHASE-23)
    • Verify response includes headers (PHASE-24)
    • Verify context carries across all 3 turns
    
    CRITICAL PATH #2: Complex Operation with Alternatives
    ──────────────────────────────────────────────────────
    User: "Refactor database schema"
    Turn 1: LENS comprehension identifies: complex, DB schema change
    Turn 2: Routing generates 3 alternatives (A, B, C)
    Turn 3: Complexity gate escalates (CRITICAL - 0.87 score)
    Turn 4: Response composition shows alternatives with tradeoffs
    Turn 5: User selects alternative B
    Turn 6: Operation executes, PHASE-24 wraps response
    
    Test Required:
    • test_complexity_gate_alternative_generation.py
    • Verify LENS confidence propagates to complexity assessment
    • Verify complexity score calculations
    • Verify alternatives ranked correctly
    • Verify response formatting includes all alternatives
    • Verify user selection in Turn 5 remembered in Turn 6
    
    CRITICAL PATH #3: Knowledge Repository Integration
    ───────────────────────────────────────────────────
    User: "What patterns are used for orchestrator composition?"
    Turn 1: Intent Router → Knowledge Orchestrator path
    Turn 2: LENS.Knowledge phase queries knowledge graph
    Turn 3: Intelligent Knowledge Protocol retrieves patterns
    Turn 4: Response composition with context headers
    
    Test Required:
    • test_lens_knowledge_phase_orchestration.py
    • Verify knowledge graph integration (PHASE-21 + PHASE-23)
    • Verify LENS phase 3 (Knowledge) executes correctly
    • Verify knowledge protocol compliant (PHASE-21)
    • Verify response headers present (PHASE-24)
    
    CRITICAL PATH #4: Hallucination Prevention in Multi-turn
    ─────────────────────────────────────────────────────────
    User: "Generate code for X"
    Turn 1: LENS generates response with confidence 0.72
    Turn 2: Hallucination detector flags: "Non-deterministic, high risk"
    Turn 3: Response with warning header + alternative
    Turn 4: User: "Can you be more certain?"
    Turn 5: LENS regenerates with different approach
    Turn 6: Hallucination detector: confidence 0.91 (accepted)
    
    Test Required:
    • test_hallucination_multi_turn_detection.py
    • Verify hallucination detector called in Turn 2
    • Verify confidence scores propagate correctly
    • Verify alternative generation in Turn 3
    • Verify context from Turn 1 available in Turn 5
    
    CRITICAL PATH #5: Challenge Integration Across Phases
    ──────────────────────────────────────────────────────
    User: "Execute AC-FIX-001-02"
    Turn 1: Challenge system flags: "High risk, requires approval"
    Turn 2: Complexity gate: escalated (0.82 score)
    Turn 3: Response shows challenge context + complexity rationale
    Turn 4: User: "Approve with conditions X, Y, Z"
    Turn 5: Approval context stored in governance.db
    Turn 6: Operation executes under conditions
    
    Test Required:
    • test_challenge_complexity_gate_interaction.py
    • Verify challenge triggers complexity escalation
    • Verify conditions in Turn 4 persisted for Turn 6
    • Verify operation validation includes conditions
    • Verify audit trail records complete flow

  required_integration_tests:
    - test_id: "test_mcp_multi_turn_orchestration"
      title: "Multi-turn MCP Tool Invocation (3+ turns)"
      scenarios: 3
      estimated_lines: 450
