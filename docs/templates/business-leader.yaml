---
template_id: business-leader
name: "Business Leader (BLUF) Template"
version: 1.0
audience: CTOs, VPs Engineering, Business Decision-Makers
read_time: 5 minutes
word_count: 1200-1500
voice: third-person neutral professional
authority: Chat01 findings + ENH-DIGEST-004

purpose: |
  Bottom Line Up Front (BLUF) documentation for time-constrained executives
  who need to make strategic decisions about capabilities, investments, and
  organizational priorities. Focus: decision support, not technical education.

structure:
  frontmatter:
    required_fields:
      - title: "[Feature/Capability Name] Business Guide"
      - audience: "Business Leaders (CTOs, VPs Engineering)"
      - read_time: "5 minutes"
      - format: "BLUF (Bottom Line Up Front)"
      - voice: "Third-person neutral professional"
      - last_updated: "[Date]"
    
    mandatory_disclaimer: |
      > **Notice:** This guide presents capabilities as system design intentions.
      > Actual results vary based on organizational context, codebase characteristics,
      > and implementation approach. Conduct proof-of-concept evaluation before
      > production decisions.

  sections:
    - id: bluf
      title: "Bottom Line Up Front"
      word_count: 150-200
      duration: 60 seconds
      requirements:
        - Decision summary (not technical details)
        - Three key areas: risk mitigation, efficiency, strategic implications
        - Qualified language ("may benefit", "has potential to")
        - Deployment timeframe estimate
        - Key success factors mentioned
      
    - id: strategic_value
      title: "Strategic Value Proposition"
      word_count: 300-400
      requirements:
        - Business value (not technical features)
        - Evidence-backed claims where available
        - Qualified benefits ("has potential to", "organizations report")
        - Strategic alignment opportunities
        - Competitive considerations if relevant
        - Investment considerations subsection
      
    - id: risk_mitigation
      title: "Risk Mitigation Capabilities"
      word_count: 250-300
      requirements:
        - Problem domain context
        - Three risk categories with qualified language
        - Operational considerations (false positives, training, rollout)
        - Realistic assessment (no guarantees)
      
    - id: visualizations
      title: "High-Value Visualizations"
      word_count: 200-250
      requirements:
        - Two visualization concepts (not code)
        - Purpose statement for each
        - Business value explanation
        - Visual metaphors executives understand
        - Key metrics/indicators shown
      
    - id: investment
      title: "Investment Considerations"
      word_count: 200-250
      requirements:
        - Initial investment breakdown (setup, infrastructure, training)
        - Ongoing investment (maintenance, support)
        - Expected benefits (qualified)
        - ROI timeline (realistic)
        - Context dependencies noted
      
    - id: deployment_timeline
      title: "Deployment Timeline"
      word_count: 150-200
      requirements:
        - Three phases: Evaluation, Pilot, Production
        - Timeframes for each
        - Key success factors
        - Realistic expectations
      
    - id: decision_points
      title: "Decision Points"
      word_count: 150-200
      requirements:
        - "Proceed If" criteria
        - "Defer If" criteria
        - Specific next steps with owners
        - Key questions to resolve

language_rules:
  voice:
    required: "Third-person only"
    examples:
      correct: "Organizations benefit from...", "Teams may experience..."
      incorrect: "You benefit from...", "Your team will experience..."
  
  claims:
    required: "Qualified language"
    examples:
      avoid: ["will definitely", "guaranteed to", "proven to", "100% effective"]
      use: ["has potential to", "organizations report", "may enable", "designed to support"]
  
  technical_depth:
    level: "Minimal"
    rule: "No implementation details, no code snippets, no technical jargon"
    exception: "High-level architecture concepts OK if explained simply"

quality_gates:
  - Total word count: 1200-1500
  - Disclaimer present at document start
  - No first-person or second-person voice
  - All capability claims qualified or evidence-backed
  - Decision focus evident in every section
  - No code snippets or technical implementation details
  - ROI framework explicit
  - Visualizations as concepts only (no code)

examples:
  good_opening: |
    Organizations considering intelligence-driven validation may benefit from
    understanding three key areas: early risk detection, development efficiency,
    and strategic alignment. The capability has potential to identify deployment
    risks before code reaches production environments. Initial integration
    typically requires 2-3 weeks for pilot deployment with existing workflows.
    Results vary based on codebase complexity and team maturity.
  
  bad_opening: |
    You will benefit from using our validation orchestrator! It's 100% proven
    to catch all bugs before production. The HolisticValidationOrchestrator
    class extends BaseOrchestrator and implements the validate() method...

meta:
