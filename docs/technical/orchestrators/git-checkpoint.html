        <section class="section">
            <h2>Overview<\/h2>
            <p>
                The Git Checkpoint Orchestrator provides automated phase milestone tracking and rollback 
                management for all CORTEX orchestrators. It creates safety checkpoints at key phase boundaries, 
                enabling quick recovery if issues are detected downstream.
            
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">📍 Phase Milestone Tracking<\/div>
                    <div class="feature-desc">
                        Automatically creates git commits at phase boundaries with standardized messages 
                        (e.g., "CHECKPOINT: Phase 3 Complete - Transform"). Enables granular rollback.
                <div class="feature-card">
                    <div class="feature-title">🔒 Branch Protection<\/div>
                    <div class="feature-desc">
                        Enforces branch protection rules: prevent force-push to main, require checkpoint 
                        commits before merges, validate test pass before commit.
                <div class="feature-card">
                    <div class="feature-title">⏮️ Intelligent Rollback<\/div>
                    <div class="feature-desc">
                        Smart rollback selection based on impact analysis. Shows files changed since checkpoint, 
                        affected modules, and potential downstream impact.
                <div class="feature-card">
                    <div class="feature-title">📊 Commit Timeline Visualization<\/div>
                    <div class="feature-desc">
                        Interactive D3.js timeline showing checkpoints, phase transitions, and rollback points 
                        with drill-down to commit details.

        <section class="section">
            <h2>Checkpoint Creation Workflow<\/h2>
            <div class="diagram-container">
                <div class="mermaid">
  graph TD
    START([Phase Complete]) --> VALIDATE{Validation<br/>Pass?}
    
    VALIDATE --> |No| FAIL[Skip checkpoint<br/>Report failure]
    VALIDATE --> |Yes| CHECK_CHANGES{Changes<br/>Exist?}
    
    CHECK_CHANGES --> |No| SKIP[Skip checkpoint<br/>No changes to commit]
    CHECK_CHANGES --> |Yes| STAGE[Stage files:<br/>git add relevant files]
    
    STAGE --> GEN_MSG[Generate checkpoint message:<br/>CHECKPOINT: Phase X - Description]
    
    GEN_MSG --> CHECK_BRANCH{Branch<br/>Protected?}
    
    CHECK_BRANCH --> |Yes| ENFORCE[Enforce protection rules:<br/>- No force-push<br/>- Tests must pass<br/>- Review required]
    CHECK_BRANCH --> |No| COMMIT
    
    ENFORCE --> VALIDATE_RULES{Rules<br/>Pass?}
    VALIDATE_RULES --> |No| BLOCK[Block commit<br/>Report violations]
    VALIDATE_RULES --> |Yes| COMMIT
    
    COMMIT[Create checkpoint commit:<br/>git commit -m message]
    
    COMMIT --> TAG[Create git tag:<br/>checkpoint-phase-X-timestamp]
    
    TAG --> METADATA[Store metadata:<br/>- Phase number<br/>- Files changed<br/>- Test results<br/>- Timestamp]
    
    METADATA --> PUSH{Auto-push<br/>Enabled?}
    
    PUSH --> |Yes| REMOTE[Push to remote:<br/>git push origin branch]
    PUSH --> |No| LOCAL[Local checkpoint only]
    
    REMOTE --> SUCCESS[✅ Checkpoint created]
    LOCAL --> SUCCESS
    
    FAIL --> END([Complete])
    SKIP --> END
    BLOCK --> END
    SUCCESS --> END
    
    style START fill:#00BCD4,stroke:#0097A7,color:#fff
    style VALIDATE fill:#4CAF50,stroke:#388E3C,color:#fff
    style COMMIT fill:#2196F3,stroke:#1976D2,color:#fff
    style TAG fill:#FF9800,stroke:#F57C00,color:#fff
    style SUCCESS fill:#10B981,stroke:#059669,color:#fff
    style FAIL fill:#DC2626,stroke:#B91C1C,color:#fff
    style BLOCK fill:#DC2626,stroke:#B91C1C,color:#fff
    style END fill:#10B981,stroke:#059669,color:#fff

        <section class="section">

        <section class="section">
            <h2>Branch Protection Rules<\/h2>
            <div class="diagram-container">
                <div class="mermaid">
  graph LR
    COMMIT[Commit Attempt] --> CHECK_BRANCH{Target<br/>Branch?}
    
    CHECK_BRANCH --> |main| MAIN_RULES[Main Branch Rules:<br/>- No direct commits<br/>- PR required<br/>- 2 approvals]
    CHECK_BRANCH --> |develop| DEV_RULES[Develop Branch Rules:<br/>- Tests must pass<br/>- No force-push]
    CHECK_BRANCH --> |feature| FEATURE_RULES[Feature Branch Rules:<br/>- No restrictions]
    
    MAIN_RULES --> VALIDATE_MAIN{Rules<br/>Pass?}
    DEV_RULES --> VALIDATE_DEV{Tests<br/>Pass?}
    FEATURE_RULES --> ALLOW
    
    VALIDATE_MAIN --> |No| REJECT[❌ Reject commit]
    VALIDATE_MAIN --> |Yes| ALLOW[✅ Allow commit]
    
    VALIDATE_DEV --> |No| REJECT
    VALIDATE_DEV --> |Yes| ALLOW
    
    REJECT --> LOG[Log violation<br/>Notify user]
    ALLOW --> CREATE[Create checkpoint]
    
    LOG --> END([Complete])
    CREATE --> END
    
    style COMMIT fill:#00BCD4,stroke:#0097A7,color:#fff
    style ALLOW fill:#10B981,stroke:#059669,color:#fff
    style REJECT fill:#DC2626,stroke:#B91C1C,color:#fff

    <script>
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#00BCD4',
                primaryTextColor: '#fff',
                primaryBorderColor: '#0097A7',
                lineColor: '#94a3b8',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            }
        });

        function createCommitTimeline() {
            const data = [
                { date: new Date('2025-12-26T10:00:00'), phase: 0, label: 'Start', type: 'start' },
                { date: new Date('2025-12-26T10:15:00'), phase: 1, label: 'Phase 1 Complete', type: 'checkpoint' },
                { date: new Date('2025-12-26T10:30:00'), phase: 2, label: 'Phase 2 Complete', type: 'checkpoint' },
                { date: new Date('2025-12-26T10:45:00'), phase: 3, label: 'Phase 3 Complete', type: 'checkpoint' },
                { date: new Date('2025-12-26T10:50:00'), phase: 3, label: 'Issue Detected', type: 'error' },
                { date: new Date('2025-12-26T10:52:00'), phase: 3, label: 'Rollback to Phase 2', type: 'rollback' },
                { date: new Date('2025-12-26T11:00:00'), phase: 3, label: 'Phase 3 Fixed', type: 'checkpoint' },
                { date: new Date('2025-12-26T11:15:00'), phase: 4, label: 'Complete', type: 'complete' }
            ];

            const width = document.getElementById('commitTimeline').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 60, left: 60 };

            const svg = d3.select('#commitTimeline')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const xScale = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([margin.left, width - margin.right]);

            const colorMap = {
                start: '#00BCD4',
                checkpoint: '#10B981',
                error: '#DC2626',
                rollback: '#F59E0B',
                complete: '#9C27B0'
            };

            // Timeline line
            svg.append('line')
                .attr('x1', margin.left)
                .attr('x2', width - margin.right)
                .attr('y1', height / 2)
                .attr('y2', height / 2)
                .attr('stroke', '#64748b')
                .attr('stroke-width', 3);

            // Commits
            const commits = svg.selectAll('.commit')
                .data(data)
                .enter()
                .append('g')
                .attr('class', 'commit')
                .attr('transform', d => `translate(${xScale(d.date)}, ${height / 2})`);

            commits.append('circle')
                .attr('r', d => d.type === 'rollback' ? 12 : 8)
                .attr('fill', d => colorMap[d.type])
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 2)
                .on('mouseover', function(event, d) {
                    const tooltip = d3.select('#tooltip');
                    tooltip.style('opacity', 1)
                        .html(`
                            <strong>${d.label}<\/strong><br/>
                            Phase: ${d.phase}<br/>
                            Time: ${d.date.toLocaleTimeString()}
                        `)
                        .style('left', (event.pageX + 10) + 'px')
                        .style('top', (event.pageY - 28) + 'px');
                })
                .on('mouseout', () => d3.select('#tooltip').style('opacity', 0));

            commits.append('text')
                .attr('y', (d, i) => i % 2 === 0 ? -20 : 35)
                .attr('text-anchor', 'middle')
                .attr('fill', '#e2e8f0')
                .attr('font-size', '11px')
                .attr('font-weight', '600')
                .text(d => d.label);

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale).ticks(6).tickFormat(d3.timeFormat('%H:%M')))
                .selectAll('text')
                .attr('fill', '#e2e8f0');
        }

        function createRollbackImpact() {
            const data = {
                name: "Rollback to Phase 2",
                children: [
                    {
                        name: "Files Changed (12)",
                        children: [
                            { name: "src/module_a.py", impact: "high" },
                            { name: "src/module_b.py", impact: "medium" },
                            { name: "tests/test_a.py", impact: "high" }
                        ]
                    },
                    {
                        name: "Tests Affected (8)",
                        children: [
                            { name: "test_phase_3_*", impact: "high" },
                            { name: "test_integration_*", impact: "medium" }
                        ]
                    },
                    {
                        name: "Downstream Impact",
                        children: [
                            { name: "Phase 4 blocked", impact: "high" },
                            { name: "Deploy delayed", impact: "medium" }
                        ]
                    }
                ]
            };

            const width = document.getElementById('rollbackImpact').clientWidth;
            const height = 500;

            const svg = d3.select('#rollbackImpact')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g')
                .attr('transform', `translate(${width / 2},${height / 2})`);

            const tree = d3.tree()
                .size([2 * Math.PI, Math.min(width, height) / 2 - 80]);

            const root = d3.hierarchy(data);
            tree(root);

            const impactColors = {
                high: '#DC2626',
                medium: '#F59E0B',
                low: '#10B981'
            };

            g.selectAll('.link')
                .data(root.links())
                .enter()
                .append('path')
                .attr('d', d3.linkRadial()
                    .angle(d => d.x)
                    .radius(d => d.y))
                .attr('fill', 'none')
                .attr('stroke', '#64748b')
                .attr('stroke-width', 2);

            const node = g.selectAll('.node')
                .data(root.descendants())
                .enter()
                .append('g')
                .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

            node.append('circle')
                .attr('r', d => d.depth === 0 ? 10 : 6)
                .attr('fill', d => d.data.impact ? impactColors[d.data.impact] : '#00BCD4')
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('dy', '0.31em')
                .attr('x', d => d.x < Math.PI === !d.children ? 6 : -6)
                .attr('text-anchor', d => d.x < Math.PI === !d.children ? 'start' : 'end')
                .attr('transform', d => d.x >= Math.PI ? 'rotate(180)' : null)
                .text(d => d.data.name)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '11px')
                .clone(true).lower()
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 3);
        }

        window.addEventListener('load', () => {
            createCommitTimeline();
            createRollbackImpact();
        });
  </style>
