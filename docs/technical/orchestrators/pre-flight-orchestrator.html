        <section class="section">
            <h2>Overview<\/h2>
            <p>
                The Pre-Flight Orchestrator validates environment requirements <strong>BEFORE<\/strong> plan execution 
                to prevent catastrophic delays. Inspired by the <em>2-week .NET SDK blocker<\/em> in RA migration 
                (detected in 15 minutes via PrevalidationWS). It scans projects for patterns (.csproj, requirements.txt, 
                package.json), infers required tools/SDKs, validates their presence, and generates executable 
                remediation scripts.
            
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">🔍 Pattern Detection<\/div>
                    <div class="feature-desc">
                        Scans project files to detect patterns: .NET API, Python FastAPI, Node.js Express, 
                        React SPA, JWT auth, Docker Compose, Kubernetes. Infers requirements from project structure.
                <div class="feature-card">
                    <div class="feature-title">⚠️ Severity-Based Blocking<\/div>
                    <div class="feature-desc">
                        Three severity levels: <strong>CRITICAL<\/strong> (blocks execution), 
                        <strong>RECOMMENDED<\/strong> (warns), <strong>OPTIONAL<\/strong> (info only). 
                        Prevents execution with missing critical requirements.
                <div class="feature-card">
                    <div class="feature-title">🛠️ Auto-Remediation Scripts<\/div>
                    <div class="feature-desc">
                        Generates platform-specific scripts (PowerShell for Windows, bash for Linux/macOS) 
                        with install commands, config fixes, and validation checks.
                <div class="feature-card">
                    <div class="feature-title">📊 Health Reports<\/div>
                    <div class="feature-desc">
                        Returns <code>PreFlightHealthReport<\/code> with status (PASS/WARN/BLOCK), validation 
                        results, blocking issues, warnings, and remediation script path.

            <div class="diagram-container">

  graph TD
    START([Planning System<br/>Pre-Phase 1]) --> PREFLIGHT[Pre-Flight<br/>Orchestrator Start]
    
    PREFLIGHT --> DETECT[Pattern Detection:<br/>Scan project files]
    
    DETECT --> SCAN_DOTNET{.csproj<br/>files?}
    DETECT --> SCAN_PYTHON{requirements.txt<br/>pyproject.toml?}
    DETECT --> SCAN_NODE{package.json?}
    DETECT --> SCAN_DOCKER{docker-compose.yml?}
    
    SCAN_DOTNET --> |Yes| PATTERN_DOTNET[Pattern: .NET API/Console]
    SCAN_PYTHON --> |Yes| PATTERN_PYTHON[Pattern: Python FastAPI/Flask]
    SCAN_NODE --> |Yes| PATTERN_NODE[Pattern: Node.js/React]
    SCAN_DOCKER --> |Yes| PATTERN_DOCKER[Pattern: Docker Compose]
    
    PATTERN_DOTNET --> REQ_DOTNET[Requirement:<br/>dotnet SDK 6.0+<br/>Severity: CRITICAL]
    PATTERN_PYTHON --> REQ_PYTHON[Requirement:<br/>Python 3.8+<br/>Severity: CRITICAL]
    PATTERN_NODE --> REQ_NODE[Requirement:<br/>Node.js 16+<br/>Severity: CRITICAL]
    PATTERN_DOCKER --> REQ_DOCKER_OPT[Requirement:<br/>Docker Desktop<br/>Severity: RECOMMENDED]
    
    REQ_DOTNET --> VALIDATE
    REQ_PYTHON --> VALIDATE
    REQ_NODE --> VALIDATE
    REQ_DOCKER_OPT --> VALIDATE
    
    VALIDATE[Execute Validation<br/>Checks] --> CHECK1[Check: dotnet --version]
    VALIDATE --> CHECK2[Check: python --version]
    VALIDATE --> CHECK3[Check: node --version]
    
    CHECK1 --> RESULT1{Installed?}
    CHECK2 --> RESULT2{Installed?}
    CHECK3 --> RESULT3{Installed?}
    
    RESULT1 --> |No + CRITICAL| BLOCK1[⛔ Blocking Issue:<br/>Missing .NET SDK]
    RESULT1 --> |Yes| PASS1[✅ Pass]
    
    RESULT2 --> |No + CRITICAL| BLOCK2[⛔ Blocking Issue:<br/>Missing Python]
    RESULT2 --> |Yes| PASS2[✅ Pass]
    
    RESULT3 --> |No + RECOMMENDED| WARN[⚠️ Warning:<br/>Missing Node.js]
    RESULT3 --> |Yes| PASS3[✅ Pass]
    
    BLOCK1 --> GENERATE_SCRIPT
    BLOCK2 --> GENERATE_SCRIPT
    WARN --> GENERATE_SCRIPT
    PASS1 --> AGGREGATE
    PASS2 --> AGGREGATE
    PASS3 --> AGGREGATE
    
    GENERATE_SCRIPT[Generate Remediation<br/>Script] --> SCRIPT_PS[PowerShell Script:<br/>install dotnet, python, node]
    
    SCRIPT_PS --> AGGREGATE
    
    AGGREGATE[Aggregate Results] --> STATUS{Overall<br/>Status?}
    
    STATUS --> |Critical Failed| REPORT_BLOCK[Report: BLOCK<br/>Cannot execute plan]
    STATUS --> |Recommended Failed| REPORT_WARN[Report: WARN<br/>Can execute with risks]
    STATUS --> |All Passed| REPORT_PASS[Report: PASS<br/>Ready to execute]
    
    REPORT_BLOCK --> SAVE[Save Report:<br/>pre-flight-health-report.json]
    REPORT_WARN --> SAVE
    REPORT_PASS --> SAVE
    
    SAVE --> RETURN{Status?}
    
    RETURN --> |BLOCK| EXIT_BLOCK[❌ Exit: Planning<br/>System aborts]
    RETURN --> |WARN| EXIT_WARN[⚠️ Continue with<br/>warnings logged]
    RETURN --> |PASS| EXIT_PASS[✅ Continue to<br/>Phase 1]
    
    EXIT_BLOCK --> END([Complete])
    EXIT_WARN --> END
    EXIT_PASS --> END

        function createComplexityHeatmap() {
            const patterns = ['.NET API', 'Python FastAPI', 'Node.js', 'React', 'Docker', 'Kubernetes'];
            const metrics = ['Requirements', 'Validation Time', 'Complexity'];
            
            const data = [];
            const values = [
                [4, 3, 3],  // .NET API
                [3, 2, 2],  // Python FastAPI
                [3, 2, 2],  // Node.js
                [2, 2, 2],  // React
                [2, 1, 1],  // Docker
                [1, 1, 1]   // Kubernetes
            ];

            patterns.forEach((pattern, i) => {
                metrics.forEach((metric, j) => {
                    data.push({
                        pattern: pattern,
                        metric: metric,
                        value: values[i][j]
                    });
                });
            });

            const width = document.getElementById('complexityHeatmap').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 80, left: 150 };

            const svg = d3.select('#complexityHeatmap')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const xScale = d3.scaleBand()
                .domain(metrics)
                .range([margin.left, width - margin.right])
                .padding(0.1);

            const yScale = d3.scaleBand()
                .domain(patterns)
                .range([margin.top, height - margin.bottom])
                .padding(0.1);

            const colorScale = d3.scaleSequential()
                .domain([1, 4])
                .interpolator(d3.interpolateRgb('#10B981', '#DC2626'));

            // Heatmap cells
            svg.selectAll('.cell')
                .data(data)
                .enter()
                .append('rect')
                .attr('class', 'cell')
                .attr('x', d => xScale(d.metric))
                .attr('y', d => yScale(d.pattern))
                .attr('width', xScale.bandwidth())
                .attr('height', yScale.bandwidth())
                .attr('fill', d => colorScale(d.value))
                .attr('opacity', 0.8);

            // Value labels
            svg.selectAll('.value-label')
                .data(data)
                .enter()
                .append('text')
                .attr('class', 'value-label')
                .attr('x', d => xScale(d.metric) + xScale.bandwidth() / 2)
                .attr('y', d => yScale(d.pattern) + yScale.bandwidth() / 2)
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .text(d => d.value)
                .attr('fill', '#fff')
                .attr('font-size', '14px')
                .attr('font-weight', '600');

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0')
                .attr('transform', 'rotate(-45)')
                .attr('text-anchor', 'end');

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');
        }

        function createRequirementsDashboard() {
            const requirements = [
                { name: '.NET SDK', severity: 'CRITICAL', status: 'PASS' },
                { name: 'Python', severity: 'CRITICAL', status: 'PASS' },
                { name: 'Node.js', severity: 'CRITICAL', status: 'BLOCKED' },
                { name: 'dotnet-ef', severity: 'CRITICAL', status: 'BLOCKED' },
                { name: 'Docker', severity: 'RECOMMENDED', status: 'WARNED' },
                { name: 'OpenSSL', severity: 'RECOMMENDED', status: 'PASS' },
                { name: 'kubectl', severity: 'OPTIONAL', status: 'PASS' },
                { name: 'Git', severity: 'CRITICAL', status: 'PASS' }
            ];

            const width = document.getElementById('requirementsDashboard').clientWidth;
            const height = 500;
            const margin = { top: 40, right: 40, bottom: 60, left: 150 };

            const svg = d3.select('#requirementsDashboard')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const yScale = d3.scaleBand()
                .domain(requirements.map(d => d.name))
                .range([margin.top, height - margin.bottom])
                .padding(0.2);

            const xScale = d3.scaleLinear()
                .domain([0, 1])
                .range([margin.left, width - margin.right]);

            const statusColor = {
                'PASS': '#10B981',
                'WARNED': '#F59E0B',
                'BLOCKED': '#DC2626'
            };

            // Bars
            svg.selectAll('.req-bar')
                .data(requirements)
                .enter()
                .append('rect')
                .attr('class', 'req-bar')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.name))
                .attr('width', xScale(1) - margin.left)
                .attr('height', yScale.bandwidth())
                .attr('fill', d => statusColor[d.status])
                .attr('opacity', 0.7);

            // Status labels
            svg.selectAll('.status-label')
                .data(requirements)
                .enter()
                .append('text')
                .attr('class', 'status-label')
                .attr('x', xScale(0.5))
                .attr('y', d => yScale(d.name) + yScale.bandwidth() / 2)
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .text(d => `${d.status} (${d.severity})`)
                .attr('fill', '#fff')
                .attr('font-size', '12px')
                .attr('font-weight', '600');

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // Legend
            const legend = svg.append('g')
                .attr('transform', `translate(${width - 150}, ${margin.top})`);

            Object.entries(statusColor).forEach(([status, color], i) => {
                legend.append('rect')
                    .attr('y', i * 25)
                    .attr('width', 20)
                    .attr('height', 10)
                    .attr('fill', color)
                    .attr('opacity', 0.7);

                legend.append('text')
                    .attr('x', 25)
                    .attr('y', i * 25 + 10)
                    .attr('fill', '#e2e8f0')
                    .attr('font-size', '12px')
                    .text(status);
            });
        }

        window.addEventListener('load', () => {
            createComplexityHeatmap();
            createRequirementsDashboard();
        });
  </style>
