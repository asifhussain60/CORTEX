                The Debug Orchestrator provides orchestrated bug resolution with full Planning/TDD parity. 
                It accepts bug reports in natural language or structured format, performs contextual architectural 
                review, injects debug code strategically, captures execution context, and learns from successful 
                resolutions to improve future debugging.

                    <div class="feature-title">🔍 Contextual Review Integration<\/div>
                    <div class="feature-desc">

                <div class="feature-card">

                    <div class="feature-desc">

                        has CORTEX_DEBUG_ markers for one-shot cleanup.
                <div class="feature-card">
                    <div class="feature-title">📊 Context Capture<\/div>
                    <div class="feature-desc">
                        Captures full execution context: variable states, function call stacks, timing data, 
                        and environment conditions during bug occurrence.
                <div class="feature-card">
                    <div class="feature-title">🧠 Learning Integration<\/div>
                    <div class="feature-desc">

                        cause analysis and fix strategy recommendations over time.
                <div class="feature-card">
                    <div class="feature-title">✅ Validation & Rollback<\/div>
                    <div class="feature-desc">

  graph TD
    START([Bug Report]) --> PARSE[Parse Bug Report<br/>Extract components & errors]

    CLASSIFY --> |Test Failure| TEST_ANALYSIS[Test Failure Analysis:<br/>- Failed test name<br/>- Assertion errors<br/>- Stack trace]
    CLASSIFY --> |Runtime Error| RUNTIME_ANALYSIS[Runtime Error Analysis:<br/>- Exception type<br/>- Error location<br/>- Call stack]
    CLASSIFY --> |UI Bug| UI_ANALYSIS[UI Bug Analysis:<br/>- Component affected<br/>- User interaction<br/>- Console errors]
    CLASSIFY --> |Performance| PERF_ANALYSIS[Performance Analysis:<br/>- Slow operations<br/>- Resource usage<br/>- Bottlenecks]
    
    TEST_ANALYSIS --> SCOPE
    RUNTIME_ANALYSIS --> SCOPE
    UI_ANALYSIS --> SCOPE
    PERF_ANALYSIS --> SCOPE
    
    SCOPE[Extract Scope Keywords<br/>Component/module names] --> REVIEW[Trigger Contextual Review<br/>ReviewOrchestrator integration]
    
    REVIEW --> FINDINGS[Review Findings:<br/>- BLOCKER issues<br/>- CRITICAL issues<br/>- INFO insights]
    
    FINDINGS --> PRIORITIZE{Critical<br/>Issues?}
    
    PRIORITIZE --> |Yes| ADDRESS_CRITICAL[Address critical issues first<br/>Before debug injection]
    PRIORITIZE --> |No| INJECT
    
    ADDRESS_CRITICAL --> INJECT[Inject Debug Code<br/>Template-based insertion]
    
    INJECT --> TEMPLATES{Select<br/>Templates}
    
    TEMPLATES --> |Function| FUNC_LOG[Function entry/exit logging<br/>Parameter capture]
    TEMPLATES --> |Variable| VAR_CAPTURE[Variable state snapshots<br/>At key locations]
    TEMPLATES --> |Exception| EXCEPTION_WRAP[Exception boundary wrapping<br/>Enhanced error details]
    TEMPLATES --> |UI| CONSOLE_LOG[Browser console.log<br/>Component lifecycle]
    
    FUNC_LOG --> MARK
    VAR_CAPTURE --> MARK
    EXCEPTION_WRAP --> MARK
    CONSOLE_LOG --> MARK
    
    MARK[Mark all injections:<br/>CORTEX_DEBUG_ prefix] --> EXECUTE[Execute with Debug Code<br/>Capture context]
    
    EXECUTE --> CAPTURE[Context Capture:<br/>- Variable states<br/>- Call stacks<br/>- Timing data<br/>- Environment]
    
    CAPTURE --> ANALYZE_ROOT[Root Cause Analysis<br/>Pattern matching]
    
    ANALYZE_ROOT --> QUERY_TIER2[Query Tier 2 Brain<br/>Similar bugs & fixes]
    
    QUERY_TIER2 --> RECOMMEND[Generate Fix Strategy:<br/>- Based on patterns<br/>- Confidence score<br/>- Alternative approaches]
    
    RECOMMEND --> APPLY_FIX[Apply Fix<br/>Code changes]
    
    APPLY_FIX --> CLEANUP[One-Shot Marker Cleanup<br/>Remove ALL CORTEX_DEBUG_]
    
    CLEANUP --> VALIDATE[Validation:<br/>Run test suite]
    
    VALIDATE --> CHECK_TESTS{Tests<br/>Pass?}
    
    CHECK_TESTS --> |Yes| LEARN[Store Pattern in Tier 2:<br/>- Bug signature<br/>- Root cause<br/>- Fix strategy<br/>- Success rate]
    CHECK_TESTS --> |No| ROLLBACK[Rollback Changes<br/>Restore checkpoint]
    
    ROLLBACK --> ALTERNATIVE{Try Alternative<br/>Fix?}
    
    ALTERNATIVE --> |Yes| RECOMMEND
    ALTERNATIVE --> |No| MANUAL[Manual Intervention Required<br/>Report to user]
    
    LEARN --> SUCCESS[Success Report:<br/>- Bug resolved<br/>- Test results<br/>- Learning stored]
    
    SUCCESS --> END([Complete])
    MANUAL --> END

        // Initialize Mermaid

            startOnLoad: true,

        // Error Trace Visualization (D3.js Sankey Diagram)
        function createErrorTrace() {
            const data = {
                nodes: [
                    { name: 'main()', level: 0 },
                    { name: 'process_request()', level: 1 },
                    { name: 'validate_input()', level: 2 },
                    { name: 'check_auth()', level: 2 },
                    { name: 'execute_query()', level: 3 },
                    { name: 'db_connection()', level: 4 },
                    { name: '❌ ConnectionError', level: 5, error: true }
                ],
                links: [
                    { source: 0, target: 1, value: 10 },
                    { source: 1, target: 2, value: 5 },
                    { source: 1, target: 3, value: 5 },
                    { source: 2, target: 4, value: 5 },
                    { source: 4, target: 5, value: 5 },
                    { source: 5, target: 6, value: 5 }
                ]
            };

            const width = document.getElementById('errorTrace').clientWidth;
            const height = 600;
            const margin = { top: 40, right: 40, bottom: 40, left: 40 };

            const svg = d3.select('#errorTrace')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const levelHeight = (height - margin.top - margin.bottom) / 6;

            // Create links
            const link = svg.append('g')
                .selectAll('path')
                .data(data.links)
                .enter()
                .append('path')
                .attr('d', d => {
                    const sourceY = margin.top + data.nodes[d.source].level * levelHeight;
                    const targetY = margin.top + data.nodes[d.target].level * levelHeight;
                    const midY = (sourceY + targetY) / 2;
                    return `M ${width / 2} ${sourceY} 
                            C ${width / 2} ${midY}, 
                              ${width / 2} ${midY}, 
                              ${width / 2} ${targetY}`;
                })
                .attr('fill', 'none')
                .attr('stroke', d => data.nodes[d.target].error ? '#DC2626' : '#64748b')
                .attr('stroke-width', d => d.value)
                .attr('opacity', 0.5);

            // Create nodes
            const node = svg.append('g')
                .selectAll('g')
                .data(data.nodes)
                .enter()
                .append('g')
                .attr('transform', (d, i) => `translate(${width / 2}, ${margin.top + d.level * levelHeight})`);

            node.append('rect')
                .attr('x', -100)
                .attr('y', -20)
                .attr('width', 200)
                .attr('height', 40)
                .attr('rx', 6)
                .attr('fill', d => d.error ? '#DC2626' : '#1e293b')
                .attr('stroke', d => d.error ? '#B91C1C' : '#F44336')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .attr('fill', '#e2e8f0')
                .attr('font-size', '14px')
                .attr('font-weight', '600')
                .text(d => d.name);

            // Add level labels
            svg.append('g')
                .selectAll('text')
                .data(data.nodes)
                .enter()
                .append('text')
                .attr('x', 20)
                .attr('y', d => margin.top + d.level * levelHeight)
                .attr('fill', '#94a3b8')
                .attr('font-size', '12px')
                .text((d, i) => `Level ${d.level}`);

            // Title
            svg.append('text')
                .attr('x', width / 2)
                .attr('y', 25)
                .attr('text-anchor', 'middle')
                .attr('fill', '#F44336')
                .attr('font-size', '18px')
                .attr('font-weight', '600')
                .text('Error Propagation Stack Trace');
        }

        // Rollback Decision Tree (D3.js Tree)
        function createRollbackTree() {
            const data = {
                name: "Fix Applied",
                children: [
                    {
                        name: "Run Tests",
                        children: [
                            {
                                name: "All Pass",
                                children: [
                                    { name: "✅ Success - Store Pattern" }
                                ]
                            },
                            {
                                name: "Some Fail",
                                children: [
                                    {
                                        name: "New Failures?",
                                        children: [
                                            {
                                                name: "Yes - Introduced Bugs",
                                                children: [
                                                    { name: "🔄 Rollback" }
                                                ]
                                            },
                                            {
                                                name: "No - Existing Failures",
                                                children: [
                                                    { name: "✅ Success - Fix Unrelated" }
                                                ]
                                            }
                                        ]
                                    }
                                ]
                            },
                            {
                                name: "All Fail",
                                children: [
                                    {
                                        name: "Severity?",
                                        children: [
                                            {
                                                name: "Critical",
                                                children: [{ name: "🔄 Immediate Rollback" }]
                                            },
                                            {
                                                name: "Non-Critical",
                                                children: [{ name: "⚠️ Flag for Review" }]
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                ]
            };

            const width = document.getElementById('rollbackTree').clientWidth;
            const height = 600;

            const svg = d3.select('#rollbackTree')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g')
                .attr('transform', `translate(${width / 2},${50})`);

            const tree = d3.tree()
                .size([width - 200, height - 100])
                .separation((a, b) => (a.parent == b.parent ? 1 : 1.5));

            const root = d3.hierarchy(data);
            tree(root);

            // Center the tree
            const minX = d3.min(root.descendants(), d => d.x);
            const maxX = d3.max(root.descendants(), d => d.x);
            g.attr('transform', `translate(${(width - (maxX - minX)) / 2 - minX},${50})`);

            // Links
            g.selectAll('.link')
                .data(root.links())
                .enter()
                .append('path')
                .attr('class', 'link')
                .attr('d', d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y))
                .attr('fill', 'none')
                .attr('stroke', '#64748b')
                .attr('stroke-width', 2);

            // Nodes
            const node = g.selectAll('.node')
                .data(root.descendants())
                .enter()
                .append('g')
                .attr('class', 'node')
                .attr('transform', d => `translate(${d.x},${d.y})`);

            node.append('circle')
                .attr('r', 8)
                .attr('fill', d => {
                    if (d.data.name.includes('✅')) return '#10B981';
                    if (d.data.name.includes('🔄')) return '#DC2626';
                    if (d.data.name.includes('⚠️')) return '#F59E0B';
                    return '#F44336';
                })
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('dy', '0.31em')
                .attr('x', d => d.children ? -10 : 10)
                .attr('text-anchor', d => d.children ? 'end' : 'start')
                .text(d => d.data.name)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '12px')
                .clone(true).lower()
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 3);
        }

        // Initialize visualizations
        window.addEventListener('load', () => {
            createErrorTrace();
            createRollbackTree();
        });
  </style>
