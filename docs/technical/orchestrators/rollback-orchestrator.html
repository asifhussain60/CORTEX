        <section class="section">
            <h2>Overview<\/h2>
            <p>
                The Rollback Orchestrator provides checkpoint-based state restoration for all CORTEX orchestrators. 
                It enables recovery from failed executions by restoring to known-good checkpoints and removing 
                all later checkpoints created after that point. Supports both git-based and memory-based checkpoints 
                with validation gates ensuring safe rollback operations.
            
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">🎯 Checkpoint Selection<\/div>
                    <div class="feature-desc">
                        Intelligent checkpoint selection by ID, phase, timestamp, or tag. Shows checkpoint 
                        metadata (phase, state, timestamp) before rollback to confirm target.
                <div class="feature-card">
                    <div class="feature-title">🔍 Pre-Rollback Validation<\/div>
                    <div class="feature-desc">
                        Validates checkpoint exists, is not corrupted, and is compatible with current 
                        orchestrator version. Prevents rollback to incompatible states.
                <div class="feature-card">
                    <div class="feature-title">🔄 Dual-Mode Rollback<\/div>
                    <div class="feature-desc">
                        Supports git rollback (filesystem + code changes) and memory rollback (state-only). 
                        Git mode uses `git restore`, memory mode updates internal state.
                <div class="feature-card">
                    <div class="feature-title">📊 State Comparison<\/div>
                    <div class="feature-desc">
                        Before/after state comparison showing: phase changes, file differences, test status, 
                        metric deltas. Confirms rollback achieved desired state.

        <section class="section">
            <h2>Rollback Workflow with Validation Gates<\/h2>
            <div class="diagram-container">
                <div class="mermaid">
  graph TD
    START([Rollback Request]) --> SELECT[Checkpoint Selection:<br/>- By ID<br/>- By phase<br/>- By timestamp<br/>- By tag]
    
    SELECT --> RETRIEVE[Retrieve Checkpoint<br/>Metadata]
    
    RETRIEVE --> VALIDATE1{Validation Gate 1:<br/>Checkpoint Exists?}
    
    VALIDATE1 --> |No| ERROR1[❌ Checkpoint not found]
    VALIDATE1 --> |Yes| VALIDATE2{Validation Gate 2:<br/>Not Corrupted?}
    
    VALIDATE2 --> |No| ERROR2[❌ Checkpoint corrupted]
    VALIDATE2 --> |Yes| VALIDATE3{Validation Gate 3:<br/>Compatible Version?}
    
    VALIDATE3 --> |No| ERROR3[❌ Version incompatible]
    VALIDATE3 --> |Yes| CONFIRM[Show Checkpoint Details:<br/>- Phase: Implementation<br/>- Timestamp: 2025-12-26<br/>- Files: 42 changed<br/>- Tests: 15 passing]
    
    CONFIRM --> USER{User<br/>Confirms?}
    
    USER --> |No| CANCEL[Cancel rollback]
    USER --> |Yes| SNAPSHOT[Create Pre-Rollback<br/>Snapshot]
    
    SNAPSHOT --> TYPE{Checkpoint<br/>Type?}
    
    TYPE --> |Git| GIT_ROLLBACK[Git Rollback:<br/>- git restore --source={commit}<br/>- Restore files<br/>- Update working tree]
    TYPE --> |Memory| MEMORY_ROLLBACK[Memory Rollback:<br/>- Restore orchestrator state<br/>- Update internal variables<br/>- Reset phase counter]
    
    GIT_ROLLBACK --> CLEANUP
    MEMORY_ROLLBACK --> CLEANUP
    
    CLEANUP[Cleanup Later Checkpoints:<br/>- Find checkpoints after target<br/>- Remove checkpoint files<br/>- Update checkpoint list]
    
    CLEANUP --> RESTORE[Restore Target State:<br/>- Phase<br/>- Variables<br/>- Context]
    
    RESTORE --> VALIDATE4{Validation Gate 4:<br/>State Restored?}
    
    VALIDATE4 --> |No| ROLLBACK_FAIL[Restore from<br/>pre-rollback snapshot]
    VALIDATE4 --> |Yes| COMPARE[Generate State<br/>Comparison Report]
    
    COMPARE --> SUCCESS[✅ Rollback complete]
    
    ROLLBACK_FAIL --> FAIL[❌ Rollback failed]
    
    ERROR1 --> END([Complete])
    ERROR2 --> END
    ERROR3 --> END
    CANCEL --> END
    FAIL --> END
    SUCCESS --> END
    
    style START fill:#F44336,stroke:#D32F2F,color:#fff

            <div class="diagram-container">

  graph LR
    ROLLBACK[Rollback Request] --> CHECK{Checkpoint<br/>Type?}
    
    CHECK --> |Git| GIT_FLOW[Git Rollback Flow]
    CHECK --> |Memory| MEM_FLOW[Memory Rollback Flow]
    
    GIT_FLOW --> GIT1[1. Get commit SHA<br/>from checkpoint]
    GIT1 --> GIT2[2. Run git restore<br/>--source={sha}]
    GIT2 --> GIT3[3. Update working tree]
    GIT3 --> GIT4[4. Restore file changes]
    GIT4 --> GIT_DONE[✅ Git restore complete]
    
    MEM_FLOW --> MEM1[1. Extract state<br/>from checkpoint]
    MEM1 --> MEM2[2. Update orchestrator<br/>internal state]
    MEM2 --> MEM3[3. Reset phase counter]
    MEM3 --> MEM4[4. Restore context vars]
    MEM4 --> MEM_DONE[✅ Memory restore complete]
    
    GIT_DONE --> CLEANUP[Cleanup later<br/>checkpoints]
    MEM_DONE --> CLEANUP
    
    style GIT_FLOW fill:#2196F3,stroke:#1976D2,color:#fff

    TIMESTAMP --> SCAN[Scan All Checkpoints<br/>for Orchestrator]
    
    SCAN --> FILTER[Filter Checkpoints<br/>After Target Timestamp]
    
    FILTER --> CHECK{Checkpoints<br/>Found?}
    
    CHECK --> |No| SKIP[No cleanup needed]
    CHECK --> |Yes| PRESERVE{Has Preserve<br/>Tags?}
    
    PRESERVE --> |Yes| WARN[Warn: Tagged checkpoint<br/>will be removed]
    PRESERVE --> |No| DELETE[Delete Checkpoint<br/>Files]
    
    WARN --> USER{User<br/>Confirms?}
    
    USER --> |No| ABORT[Abort cleanup]
    USER --> |Yes| DELETE
    
    DELETE --> UPDATE[Update Checkpoint<br/>List in Memory]
    
    UPDATE --> LOG[Log Deleted<br/>Checkpoint IDs]
    
    LOG --> DONE[✅ Cleanup complete]
    
    SKIP --> END([Complete])
    ABORT --> END
    DONE --> END

    <script>
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#F44336',
                primaryTextColor: '#fff',
                primaryBorderColor: '#D32F2F',
                lineColor: '#94a3b8',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            }
        });

        function createCheckpointTree() {
            const data = {
                name: "Checkpoints",
                children: [
                    {
                        name: "planning_orchestrator",
                        children: [
                            { name: "Phase1_Init", timestamp: "2025-12-26 09:00", type: "git" },
                            { name: "Phase2_Analysis", timestamp: "2025-12-26 09:30", type: "git" },
                            { name: "Phase3_Implementation", timestamp: "2025-12-26 10:00", type: "git" },
                            { name: "Phase4_Refactoring", timestamp: "2025-12-26 10:30", type: "memory" }
                        ]
                    },
                    {
                        name: "tdd_orchestrator",
                        children: [
                            { name: "RED_Phase", timestamp: "2025-12-26 11:00", type: "git" },
                            { name: "GREEN_Phase", timestamp: "2025-12-26 11:15", type: "git" },
                            { name: "REFACTOR_Phase", timestamp: "2025-12-26 11:30", type: "memory" }
                        ]
                    },
                    {
                        name: "maintenance_orchestrator",
                        children: [
                            { name: "Healthcheck_Pre", timestamp: "2025-12-26 12:00", type: "memory" },
                            { name: "Align_Complete", timestamp: "2025-12-26 12:15", type: "git" },
                            { name: "Cleanup_Done", timestamp: "2025-12-26 12:30", type: "memory" }
                        ]
                    }
                ]
            };

            const width = document.getElementById('checkpointTree').clientWidth;
            const height = 500;

            const svg = d3.select('#checkpointTree')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const tree = d3.tree()
                .size([height - 100, width - 200]);

            const root = d3.hierarchy(data);
            tree(root);

            const g = svg.append('g')
                .attr('transform', 'translate(100, 50)');

            g.selectAll('.link')
                .data(root.links())
                .enter()
                .append('path')
                .attr('d', d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x))
                .attr('fill', 'none')
                .attr('stroke', '#64748b')
                .attr('stroke-width', 2);

            const node = g.selectAll('.node')
                .data(root.descendants())
                .enter()
                .append('g')
                .attr('transform', d => `translate(${d.y},${d.x})`);

            node.append('circle')
                .attr('r', 6)
                .attr('fill', d => {
                    if (d.depth === 0) return '#F44336';
                    if (d.depth === 1) return '#FF9800';
                    return d.data.type === 'git' ? '#2196F3' : '#9C27B0';
                })
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('dy', '0.31em')
                .attr('x', d => d.children ? -10 : 10)
                .attr('text-anchor', d => d.children ? 'end' : 'start')
                .text(d => d.data.name)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '11px')
                .clone(true).lower()
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 3);

            // Add timestamp for leaf nodes
            node.filter(d => !d.children && d.data.timestamp)
                .append('text')
                .attr('dy', '1.5em')
                .attr('x', 10)
                .attr('text-anchor', 'start')
                .text(d => d.data.timestamp)
                .attr('fill', '#64748b')
                .attr('font-size', '9px');
        }

        function createStateComparison() {
            const beforeData = [
                { metric: 'Phase', before: 'Phase 3', after: 'Phase 1' },
                { metric: 'Files Changed', before: 42, after: 12 },
                { metric: 'Tests Passing', before: 15, after: 25 },
                { metric: 'Lines of Code', before: 5600, after: 4200 },
                { metric: 'Complexity Score', before: 68, after: 45 }
            ];

            const width = document.getElementById('stateComparison').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 60, left: 150 };

            const svg = d3.select('#stateComparison')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const yScale = d3.scaleBand()
                .domain(beforeData.map(d => d.metric))
                .range([margin.top, height - margin.bottom])
                .padding(0.2);

            // Normalize numeric values for visualization
            const normalizedData = beforeData.map(d => ({
                metric: d.metric,
                before: typeof d.before === 'number' ? d.before : 0,
                after: typeof d.after === 'number' ? d.after : 0,
                beforeLabel: d.before,
                afterLabel: d.after
            }));

            const maxValue = d3.max(normalizedData, d => Math.max(d.before, d.after));

            const xScale = d3.scaleLinear()
                .domain([0, maxValue])
                .range([margin.left, width - margin.right]);

            // Before bars
            svg.selectAll('.bar-before')
                .data(normalizedData)
                .enter()
                .append('rect')
                .attr('class', 'bar-before')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.metric))
                .attr('width', d => xScale(d.before) - margin.left)
                .attr('height', yScale.bandwidth() / 2)
                .attr('fill', '#DC2626')
                .attr('opacity', 0.7);

            // After bars
            svg.selectAll('.bar-after')
                .data(normalizedData)
                .enter()
                .append('rect')
                .attr('class', 'bar-after')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.metric) + yScale.bandwidth() / 2)
                .attr('width', d => xScale(d.after) - margin.left)
                .attr('height', yScale.bandwidth() / 2)
                .attr('fill', '#10B981')
                .attr('opacity', 0.7);

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // Legend
            const legend = svg.append('g')
                .attr('transform', `translate(${width - 120}, ${margin.top})`);

            legend.append('rect')
                .attr('width', 20)
                .attr('height', 10)
                .attr('fill', '#DC2626')
                .attr('opacity', 0.7);

            legend.append('text')
                .attr('x', 25)
                .attr('y', 10)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '12px')
                .text('Before');

            legend.append('rect')
                .attr('y', 20)
                .attr('width', 20)
                .attr('height', 10)
                .attr('fill', '#10B981')
                .attr('opacity', 0.7);

            legend.append('text')
                .attr('x', 25)
                .attr('y', 30)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '12px')
                .text('After');
        }

        window.addEventListener('load', () => {
            createCheckpointTree();
            createStateComparison();
        });
  </style>
