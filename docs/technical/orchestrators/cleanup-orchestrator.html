                The Cleanup Orchestrator organizes files into proper <code>cortex-brain/documents/{category}/<\/code> 
                structure and updates references across the codebase. It prevents root-level document sprawl by 
                enforcing CORTEX file organization standards with AST-powered reference tracking.

                <div class="feature-card">

        <section class="section">
            <h2>5-Phase File Organization Workflow<\/h2>
            <div class="diagram-container">
                <div class="mermaid">
  graph TD
    START([Cleanup Request]) --> SCAN[Phase 1: Scan<br/>Identify misplaced files]
    
    SCAN --> CHECK_ROOT{Files in<br/>Root?}
    
    CHECK_ROOT --> |No| SKIP[No cleanup needed]
    CHECK_ROOT --> |Yes| FILTER[Filter out protected files:<br/>README, LICENSE, configs]
    
    FILTER --> CATEGORIZE[Phase 2: Categorize<br/>Analyze content]
    
    CATEGORIZE --> ANALYZE{File<br/>Type?}
    
    ANALYZE --> |Report| CAT_REPORT[Category: reports/]
    ANALYZE --> |Analysis| CAT_ANALYSIS[Category: analysis/]
    ANALYZE --> |Summary| CAT_SUMMARY[Category: summaries/]
    ANALYZE --> |Investigation| CAT_INVEST[Category: investigations/]
    ANALYZE --> |Plan| CAT_PLAN[Category: planning/]
    ANALYZE --> |Guide| CAT_GUIDE[Category: implementation-guides/]
    ANALYZE --> |Unknown| CAT_ARCHIVE[Category: archive/]
    
    CAT_REPORT --> ORGANIZE
    CAT_ANALYSIS --> ORGANIZE
    CAT_SUMMARY --> ORGANIZE
    CAT_INVEST --> ORGANIZE
    CAT_PLAN --> ORGANIZE
    CAT_GUIDE --> ORGANIZE
    CAT_ARCHIVE --> ORGANIZE
    
    ORGANIZE[Phase 3: Organize<br/>Move files] --> BACKUP[Create backup:<br/>cortex-brain/backups/cleanup_timestamp/]
    
    BACKUP --> MOVE{Dry Run?}
    
    MOVE --> |Yes| SIMULATE[Simulate moves<br/>Log would-be changes]
    MOVE --> |No| EXECUTE[Execute moves:<br/>shutil.move(src, dest)]
    
    SIMULATE --> UPDATE_REFS
    EXECUTE --> UPDATE_REFS
    
    UPDATE_REFS[Phase 4: Update References<br/>AST analysis] --> SCAN_REFS[Scan codebase for references:<br/>- Python imports<br/>- Markdown links<br/>- File paths in code]
    
    SCAN_REFS --> FIND_REFS{References<br/>Found?}
    
    FIND_REFS --> |No| FINALIZE
    FIND_REFS --> |Yes| UPDATE[Update references:<br/>- Rewrite imports<br/>- Fix markdown links<br/>- Update path strings]
    
    UPDATE --> VALIDATE[Validate:<br/>- Imports resolve<br/>- Links valid<br/>- Tests pass]
    
    VALIDATE --> CHECK_VALID{Validation<br/>Pass?}
    
    CHECK_VALID --> |No| ROLLBACK[Rollback:<br/>Restore from backup]
    CHECK_VALID --> |Yes| FINALIZE
    
    ROLLBACK --> FAIL[❌ Cleanup failed<br/>Files restored]
    
    FINALIZE[Phase 5: Finalization<br/>Generate report] --> REPORT[Report metrics:<br/>- Files moved<br/>- References updated<br/>- Space freed<br/>- Errors]
    
    REPORT --> SUCCESS[✅ Cleanup complete]
    
    SKIP --> END([Complete])
    FAIL --> END
    SUCCESS --> END

    <script>
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#FF9800',
                primaryTextColor: '#fff',
                primaryBorderColor: '#F57C00',
                lineColor: '#94a3b8',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            }
        });

        function createProtectedDirsTree() {
            const data = {
                name: "CORTEX/",
                children: [
                    {
                        name: "Protected Root Files",
                        children: [
                            { name: "README.md", protected: true },
                            { name: "LICENSE", protected: true },
                            { name: "requirements.txt", protected: true },
                            { name: ".gitignore", protected: true },
                            { name: "setup.py", protected: true }
                        ]
                    },
                    {
                        name: "src/",
                        children: [
                            { name: "All Python files (never moved)", protected: true }
                        ]
                    },
                    {
                        name: "tests/",
                        children: [
                            { name: "All test files (never moved)", protected: true }
                        ]
                    },
                    {
                        name: "cortex-brain/",
                        children: [
                            { name: "*.yaml manifests (never moved)", protected: true },
                            { name: "*.db databases (never moved)", protected: true },
                            {
                                name: "documents/ (cleanup target)",
                                protected: false,
                                children: [
                                    { name: "reports/", protected: false },
                                    { name: "analysis/", protected: false },
                                    { name: "summaries/", protected: false }
                                ]
                            }
                        ]
                    }
                ]
            };

            const width = document.getElementById('protectedDirs').clientWidth;
            const height = 500;

            const svg = d3.select('#protectedDirs')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g')
                .attr('transform', `translate(50, 50)`);

            const tree = d3.tree()
                .size([height - 100, width - 150]);

            const root = d3.hierarchy(data);
            tree(root);

            g.selectAll('.link')
                .data(root.links())
                .enter()
                .append('path')
                .attr('d', d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x))
                .attr('fill', 'none')
                .attr('stroke', '#64748b')
                .attr('stroke-width', 2);

            const node = g.selectAll('.node')
                .data(root.descendants())
                .enter()
                .append('g')
                .attr('transform', d => `translate(${d.y},${d.x})`);

            node.append('circle')
                .attr('r', 6)
                .attr('fill', d => d.data.protected ? '#DC2626' : (d.data.protected === false ? '#10B981' : '#FF9800'))
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('dy', '0.31em')
                .attr('x', d => d.children ? -10 : 10)
                .attr('text-anchor', d => d.children ? 'end' : 'start')
                .text(d => d.data.name)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '12px')
                .clone(true).lower()
                .attr('stroke', '#0f172a')
                .attr('stroke-width', 3);
        }

        function createCleanupImpact() {
            const categories = [
                { name: 'Files Moved', before: 0, after: 42 },
                { name: 'Root Files', before: 58, after: 16 },
                { name: 'References Updated', before: 0, after: 156 },
                { name: 'Space Freed (KB)', before: 0, after: 2400 },
                { name: 'Duplicates Removed', before: 0, after: 8 }
            ];

            const width = document.getElementById('cleanupImpact').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 60, left: 150 };

            const svg = d3.select('#cleanupImpact')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const yScale = d3.scaleBand()
                .domain(categories.map(d => d.name))
                .range([margin.top, height - margin.bottom])
                .padding(0.2);

            const xScale = d3.scaleLinear()
                .domain([0, d3.max(categories, d => Math.max(d.before, d.after))])
                .range([margin.left, width - margin.right]);

            // Before bars
            svg.selectAll('.bar-before')
                .data(categories)
                .enter()
                .append('rect')
                .attr('class', 'bar-before')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.name))
                .attr('width', d => xScale(d.before) - margin.left)
                .attr('height', yScale.bandwidth() / 2)
                .attr('fill', '#64748b')
                .attr('opacity', 0.5);

            // After bars
            svg.selectAll('.bar-after')
                .data(categories)
                .enter()
                .append('rect')
                .attr('class', 'bar-after')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.name) + yScale.bandwidth() / 2)
                .attr('width', d => xScale(d.after) - margin.left)
                .attr('height', yScale.bandwidth() / 2)
                .attr('fill', '#FF9800')
                .attr('opacity', 0.8);

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // Legend
            const legend = svg.append('g')
                .attr('transform', `translate(${width - 120}, ${margin.top})`);

            legend.append('rect')
                .attr('width', 20)
                .attr('height', 10)
                .attr('fill', '#64748b')
                .attr('opacity', 0.5);

            legend.append('text')
                .attr('x', 25)
                .attr('y', 10)
                .attr('fill', '#e2e8f0')
                .attr('font-size', '12px')
                .text('Before');

            legend.append('rect')
                .attr('y', 20)
