        <section class="section">
            <h2>Overview<\/h2>
            <p>
                The Autonomous Execution Engine enables orchestrators to adapt execution behavior based on user intent, 
                task complexity, and safety requirements. It implements the <strong>Strategy Pattern<\/strong> with three 
                execution modes: <em>Supervised<\/em> (user confirmation per phase), <em>Autonomous<\/em> (full automation 
                with auto-rollback), and <em>Hybrid<\/em> (conditional confirmation for high-risk actions).
            
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">🎯 Intelligent Risk Assessment<\/div>
                    <div class="feature-desc">
                        Analyzes task descriptions for safety-critical keywords (delete, drop, production) and 
                        high-risk keywords (database, migration, deploy). Routes to appropriate execution strategy.
                <div class="feature-card">
                    <div class="feature-title">🔄 Automatic Checkpointing<\/div>
                    <div class="feature-desc">
                        Creates checkpoints before each autonomous phase execution. Enables instant rollback 
                        if errors occur, ensuring no permanent damage from failed operations.
                <div class="feature-card">
                    <div class="feature-title">🛡️ Validation Gates<\/div>
                    <div class="feature-desc">
                        Pre-execution validation checks: context completeness, parameter validity, dependency 
                        availability. Prevents execution with invalid or missing data.
                <div class="feature-card">
                    <div class="feature-title">⚡ Error Recovery<\/div>
                    <div class="feature-desc">
                        Three-level recovery: rollback to last checkpoint → retry with modified params → 
                        escalate to supervised mode. Never leaves system in broken state.

        <section class="section">
            <h2>Phase-by-Phase Execution Workflow<\/h2>
            <div class="diagram-container">
                <div class="mermaid">
  graph TD
    START([Execution Request]) --> MODE_SELECT{Select<br/>Execution Mode}
    
    MODE_SELECT --> |User Choice| SUPERVISED[Supervised Mode]
    MODE_SELECT --> |Auto-Detect| AUTO_SELECT[Auto-Select Mode:<br/>Risk Assessment]
    
    AUTO_SELECT --> RISK{Risk<br/>Level?}
    
    RISK --> |High| SUPERVISED
    RISK --> |Medium| HYBRID[Hybrid Mode]
    RISK --> |Low| AUTONOMOUS[Autonomous Mode]
    
    SUPERVISED --> PHASE1[Phase 1: Validate Context]
    HYBRID --> PHASE1
    AUTONOMOUS --> PHASE1
    
    PHASE1 --> VALIDATE1{Valid?}
    
    VALIDATE1 --> |No| ERROR1[❌ Validation failed<br/>Return errors]
    VALIDATE1 --> |Yes| CHECKPOINT1[Create Checkpoint:<br/>Phase 1 start]
    
    CHECKPOINT1 --> CONFIRM1{Mode-Specific<br/>Confirmation?}
    
    CONFIRM1 --> |Supervised: Yes| WAIT_USER1[Wait for user<br/>confirmation]
    CONFIRM1 --> |Hybrid: Conditional| CHECK_RISK1{High Risk?}
    CONFIRM1 --> |Autonomous: No| EXECUTE1
    
    CHECK_RISK1 --> |Yes| WAIT_USER1
    CHECK_RISK1 --> |No| EXECUTE1
    
    WAIT_USER1 --> USER_APPROVED1{User<br/>Approved?}
    
    USER_APPROVED1 --> |No| CANCEL[Cancel execution]
    USER_APPROVED1 --> |Yes| EXECUTE1[Execute Phase 1]
    
    EXECUTE1 --> SUCCESS1{Success?}
    
    SUCCESS1 --> |No| ROLLBACK1[Auto-Rollback:<br/>Restore checkpoint]
    SUCCESS1 --> |Yes| PHASE2[Phase 2: Execute]
    
    ROLLBACK1 --> RETRY1{Retry?}
    
    RETRY1 --> |Yes| EXECUTE1
    RETRY1 --> |No| FAIL[❌ Execution failed]
    
    PHASE2 --> VALIDATE2{Valid?}
    
    VALIDATE2 --> |No| ERROR2[❌ Phase 2 validation failed]
    VALIDATE2 --> |Yes| CHECKPOINT2[Create Checkpoint:<br/>Phase 2 start]
    
    CHECKPOINT2 --> EXECUTE2[Execute Phase 2]
    
    EXECUTE2 --> SUCCESS2{Success?}
    
    SUCCESS2 --> |No| ROLLBACK2[Auto-Rollback:<br/>Restore checkpoint]
    SUCCESS2 --> |Yes| COMPLETE[✅ Execution complete]
    
    ROLLBACK2 --> ESCALATE[Escalate to<br/>Supervised Mode]
    
    ESCALATE --> MANUAL[Manual intervention<br/>required]
    
    ERROR1 --> END([Complete])
    ERROR2 --> END
    CANCEL --> END
    FAIL --> END
    MANUAL --> END
    COMPLETE --> END

    <script>
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#00BCD4',
                primaryTextColor: '#fff',
                primaryBorderColor: '#0097A7',
                lineColor: '#94a3b8',
                secondaryColor: '#1e293b',

        function createProgressTimeline() {
            const data = [
                { phase: 'Phase 1', start: 0, duration: 30, status: 'completed', checkpoint: true },
                { phase: 'Phase 2', start: 30, duration: 45, status: 'completed', checkpoint: true },
                { phase: 'Phase 3', start: 75, duration: 20, status: 'failed', checkpoint: true },
                { phase: 'Rollback', start: 95, duration: 5, status: 'recovery', checkpoint: false },
                { phase: 'Phase 3 (retry)', start: 100, duration: 25, status: 'in-progress', checkpoint: false }
            ];

            const width = document.getElementById('progressTimeline').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 60, left: 150 };

            const svg = d3.select('#progressTimeline')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const yScale = d3.scaleBand()
                .domain(data.map(d => d.phase))
                .range([margin.top, height - margin.bottom])
                .padding(0.2);

            const xScale = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.start + d.duration)])
                .range([margin.left, width - margin.right]);

            const colorScale = d3.scaleOrdinal()
                .domain(['completed', 'failed', 'recovery', 'in-progress'])
                .range(['#10B981', '#DC2626', '#FF9800', '#00BCD4']);

            // Timeline bars
            svg.selectAll('.timeline-bar')
                .data(data)
                .enter()
                .append('rect')
                .attr('class', 'timeline-bar')
                .attr('x', d => xScale(d.start))
                .attr('y', d => yScale(d.phase))
                .attr('width', d => xScale(d.start + d.duration) - xScale(d.start))
                .attr('height', yScale.bandwidth())
                .attr('fill', d => colorScale(d.status))
                .attr('opacity', 0.8);

            // Checkpoint markers
            svg.selectAll('.checkpoint')
                .data(data.filter(d => d.checkpoint))
                .enter()
                .append('circle')
                .attr('class', 'checkpoint')
                .attr('cx', d => xScale(d.start))
                .attr('cy', d => yScale(d.phase) + yScale.bandwidth() / 2)
                .attr('r', 6)
                .attr('fill', '#4CAF50')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale).ticks(5).tickFormat(d => `${d}s`))
                .selectAll('text')
                .attr('fill', '#e2e8f0');

            // Legend
            const legend = svg.append('g')
                .attr('transform', `translate(${width - 150}, ${margin.top})`);

            const statuses = ['completed', 'failed', 'in-progress'];
            statuses.forEach((status, i) => {
                legend.append('rect')
                    .attr('y', i * 25)
                    .attr('width', 20)
                    .attr('height', 10)
                    .attr('fill', colorScale(status))
                    .attr('opacity', 0.8);

                legend.append('text')
                    .attr('x', 25)
                    .attr('y', i * 25 + 10)
                    .attr('fill', '#e2e8f0')
                    .attr('font-size', '11px')
                    .text(status);
            });
        }

        function createRiskAssessment() {
            const operations = ['Code Changes', 'Database Migration', 'Deployment', 'Refactoring', 'Testing'];
            const modes = ['Supervised', 'Hybrid', 'Autonomous'];
            
            const data = [];
            const riskLevels = [
                [3, 2, 1],  // Code Changes
                [3, 3, 2],  // Database Migration
                [3, 3, 1],  // Deployment
                [2, 2, 1],  // Refactoring
                [1, 1, 1]   // Testing
            ];

            operations.forEach((op, i) => {
                modes.forEach((mode, j) => {
                    data.push({
                        operation: op,
                        mode: mode,
                        risk: riskLevels[i][j]
                    });
                });
            });

            const width = document.getElementById('riskAssessment').clientWidth;
            const height = 400;
            const margin = { top: 40, right: 40, bottom: 80, left: 150 };

            const svg = d3.select('#riskAssessment')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            const xScale = d3.scaleBand()
                .domain(modes)
                .range([margin.left, width - margin.right])
                .padding(0.1);

            const yScale = d3.scaleBand()
                .domain(operations)
                .range([margin.top, height - margin.bottom])
                .padding(0.1);

            const colorScale = d3.scaleSequential()
                .domain([1, 3])
                .interpolator(d3.interpolateRgb('#10B981', '#DC2626'));

            // Heatmap cells
            svg.selectAll('.cell')
                .data(data)
                .enter()
                .append('rect')
                .attr('class', 'cell')
                .attr('x', d => xScale(d.mode))
                .attr('y', d => yScale(d.operation))
                .attr('width', xScale.bandwidth())
                .attr('height', yScale.bandwidth())
                .attr('fill', d => colorScale(d.risk))
                .attr('opacity', 0.8);

            // Risk labels
            svg.selectAll('.risk-label')
                .data(data)
                .enter()
                .append('text')
                .attr('class', 'risk-label')
                .attr('x', d => xScale(d.mode) + xScale.bandwidth() / 2)
                .attr('y', d => yScale(d.operation) + yScale.bandwidth() / 2)
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .text(d => ['Low', 'Med', 'High'][d.risk - 1])
                .attr('fill', '#fff')
                .attr('font-size', '12px')
                .attr('font-weight', '600');

            // X-axis
            svg.append('g')
                .attr('transform', `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(xScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0')
                .attr('transform', 'rotate(-45)')
                .attr('text-anchor', 'end');

            // Y-axis
            svg.append('g')
                .attr('transform', `translate(${margin.left},0)`)
                .call(d3.axisLeft(yScale))
                .selectAll('text')
                .attr('fill', '#e2e8f0');
        }

        window.addEventListener('load', () => {
            createProgressTimeline();
            createRiskAssessment();
        });
  </style>
