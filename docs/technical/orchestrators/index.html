<!DOCTYPE html>
<html lang="en">
<head>
<style>
/* Mobile font optimization */
html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
}
</style>
<style>
/* Touch target optimization */
a, button, [role="button"] {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
</style>
<style>
/* Mobile touch optimization */
button, a, input, select, textarea, [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Orchestrators | Interactive Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="shared-styles.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 1.3rem;
            opacity: 0.95;
        }
        .visualization-container {
            background: rgba(26, 31, 58, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }
        .level1-integration-icon-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .level1-integration-icon-container {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: callout-link 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .level1-integration-icon-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .level1-integration-icon-container.active {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.5), 0 5px 15px rgba(0,0,0,0.3);
        }
        .level1-integration-icon-container.callout-link { background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%); color: white; }
        .level1-integration-icon-container.improvement-explanation { background: #2196F3; color: white; }
        .level1-integration-icon-container.viz-execution { background: #4CAF50; color: white; }
        .level1-integration-icon-container.viz-system { background: #FF9800; color: white; }
        .level1-integration-icon-container.viz-analysis { background: #9C27B0; color: white; }
        .level1-integration-icon-container.viz-debug { background: #F44336; color: white; }
        #orchestratorMap {
            width: 100%;
            height: 800px;
            position: relative;
        }
        .node circle {
            cursor: pointer;
            stroke: #fff;
            stroke-width: 3px;
            transition: callout-link 0.3s ease;
        }
        .node:hover circle {
            stroke-width: 5px;
            filter: brightness(1.2);
        }
        .node text {
            font-size: 12px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
            fill: #ffffff;
        }
        .link {
            fill: none;
            stroke: #999;
            stroke-opacity: 0.3;
            stroke-width: 2px;
        }
        .visualization-tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 300px;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .visualization-tooltip.visible {
            opacity: 1;
        }
        .visualization-tooltip h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 5px;
        }
        .visualization-tooltip .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 5px;
            margin-top: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stat-card h2 {
            font-size: 3rem;
            margin: 0 0 10px 0;
        }
        .stat-card p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.95;
        }
        .level2-legend-orange {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .level2-legend-orange-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .level2-level2-legend-orange-orange {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding: 40px 0;
        }
        footer a {
            color: white;
            text-decoration: none;
            border-bottom: 2px solid rgba(255,255,255,0.5);
            transition: border-color 0.3s ease;
        }
        footer a:hover {
            border-bottom-color: white;
        }
    </style>
</head>
<body>
    <nav class="breadcrumb">
        <a href="../../index.html">Home</a>
        <span class="breadcrumb-separator">›</span>
        <span class="breadcrumb-current">Orchestrators</span>
    </nav>

    <div class="container">
        <header>
<style>
/* Mobile font optimization */
html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
}
</style>
<style>
/* Touch target optimization */
a, button, [role="button"] {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
</style>
<style>
/* Mobile touch optimization */
button, a, input, select, textarea, [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
}
</style>
            <h1>🎭 CORTEX Orchestrator Suite</h1>
            <p class="tagline">Interactive visualization of 16 specialized orchestrators</p>
        </header>

        <div class="visualization-container">
            <div class="level1-integration-icon-container">
                <button class="level1-integration-icon-container callout-link active" data-category="callout-link">callout-link Orchestrators</button>
                <button class="level1-integration-icon-container improvement-explanation" data-category="improvement-explanation">improvement-explanation (4)</button>
                <button class="level1-integration-icon-container viz-execution" data-category="viz-execution">viz-execution (2)</button>
                <button class="level1-integration-icon-container viz-system" data-category="viz-system">viz-system (5)</button>
                <button class="level1-integration-icon-container viz-analysis" data-category="viz-analysis">viz-analysis (3)</button>
                <button class="level1-integration-icon-container viz-debug" data-category="viz-debug">viz-debug (2)</button>
            </div>

            <div id="orchestratorMap"></div>
            <div class="visualization-tooltip"></div>

            <div class="level2-legend-orange">
                <div class="level2-legend-orange-item">
                    <div class="level2-level2-legend-orange-orange"></div>
                    <span>improvement-explanation</span>
                </div>
                <div class="level2-legend-orange-item">
                    <div class="level2-level2-legend-orange-orange"></div>
                    <span>viz-execution</span>
                </div>
                <div class="level2-legend-orange-item">
                    <div class="level2-level2-legend-orange-orange"></div>
                    <span>viz-system</span>
                </div>
                <div class="level2-legend-orange-item">
                    <div class="level2-level2-legend-orange-orange"></div>
                    <span>viz-analysis</span>
                </div>
                <div class="level2-legend-orange-item">
                    <div class="level2-level2-legend-orange-orange"></div>
                    <span>viz-debug</span>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h2>16</h2>
                <p>Total Orchestrators</p>
            </div>
            <div class="stat-card">
                <h2>64</h2>
                <p>Interactive Visualizations</p>
            </div>
            <div class="stat-card">
                <h2>100+</h2>
                <p>Workflow Phases</p>
            </div>
            <div class="stat-card">
                <h2>∞</h2>
                <p>Possibilities</p>
            </div>
        </div>
</div>

    <script>
        const orchestrators = [
            // improvement-explanation (4)
            { id: 'improvement-explanation-viz-system', name: 'improvement-explanation viz-system', category: 'improvement-explanation', phases: 13, complexity: 'HIGH', color: '#2196F3', url: 'improvement-explanation-viz-system.html', description: '4-tier routing, complexity detection, TDD auto-inclusion' },
            { id: 'tdd', name: 'TDD', category: 'improvement-explanation', phases: 11, complexity: 'HIGH', color: '#1976D2', url: 'tdd-orchestrator.html', description: 'RED→GREEN→REFACTOR cycle with 11+ language support' },
            { id: 'ado', name: 'ADO improvement-explanation', category: 'improvement-explanation', phases: 10, complexity: 'MEDIUM', color: '#0D47A1', url: 'ado-improvement-explanation.html', description: 'Story/Feature/Task creation with manifest inheritance' },
            { id: 'pre-flight', name: 'Pre-Flight', category: 'improvement-explanation', phases: 5, complexity: 'LOW', color: '#42A5F5', url: 'pre-flight.html', description: 'Pre-improvement-explanation discovery and complexity estimation' },
            
            // viz-execution (2)
            { id: 'sanitization', name: 'Code Sanitization', category: 'viz-execution', phases: 5, complexity: 'HIGH', color: '#4CAF50', url: 'code-sanitization.html', description: '5-phase workflow for company data removal' },
            { id: 'autonomous', name: 'Autonomous viz-execution', category: 'viz-execution', phases: 8, complexity: 'MEDIUM', color: '#388E3C', url: 'autonomous-viz-execution.html', description: 'Phase-by-phase viz-execution automation' },
            
            // viz-system (5)
            { id: 'maintenance', name: 'viz-system Maintenance', category: 'viz-system', phases: 7, complexity: 'HIGH', color: '#FF9800', url: 'maintenance-orchestrator.html', description: 'Tiered routing with 7-phase workflow' },
            { id: 'integrity', name: 'viz-system Integrity', category: 'viz-system', phases: 8, complexity: 'HIGH', color: '#F57C00', url: 'viz-system-integrity.html', description: '8-phase validation with auto-fix capabilities' },
            { id: 'refinement', name: 'Refinement', category: 'viz-system', phases: 7, complexity: 'HIGH', color: '#E65100', url: 'refinement-orchestrator.html', description: 'Holistic improvement with SKULL test optimization' },
            { id: 'cleanup', name: 'Cleanup', category: 'viz-system', phases: 4, complexity: 'MEDIUM', color: '#FB8C00', url: 'cleanup-orchestrator.html', description: 'AST-powered cleanup with reference tracking' },
            { id: 'git-checkpoint', name: 'Git Checkpoint', category: 'viz-system', phases: 3, complexity: 'MEDIUM', color: '#FFA726', url: 'git-checkpoint.html', description: 'Phase milestone tracking with rollback management' },
            
            // viz-analysis (3)
            { id: 'architectural', name: 'Architectural Review', category: 'viz-analysis', phases: 6, complexity: 'MEDIUM', color: '#9C27B0', url: 'architectural-review.html', description: '6-phase viz-analysis with 0-100 scoring' },
            { id: 'lens', name: 'CORTEX Lens v3', category: 'viz-analysis', phases: 8, complexity: 'HIGH', color: '#7B1FA2', url: 'cortex-lens.html', description: 'Narrative generation with pattern detection' },
            { id: 'dashboard', name: 'Intelligent Dashboard', category: 'viz-analysis', phases: 4, complexity: 'MEDIUM', color: '#4A148C', url: 'intelligent-dashboard.html', description: 'Metrics collection and live monitoring' },
            
            // viz-debug (2)
            { id: 'viz-debug', name: 'viz-debug', category: 'viz-debug', phases: 5, complexity: 'MEDIUM', color: '#F44336', url: 'viz-debug-orchestrator.html', description: 'Symptom viz-analysis → root cause → fix strategy' },
            { id: 'rollback', name: 'Rollback', category: 'viz-debug', phases: 3, complexity: 'MEDIUM', color: '#D32F2F', url: 'rollback-orchestrator.html', description: 'Safe rollback with state restoration' }
        ];

        // Define relationships
        const links = [
            { source: 'improvement-explanation-viz-system', target: 'tdd' },
            { source: 'improvement-explanation-viz-system', target: 'ado' },
            { source: 'improvement-explanation-viz-system', target: 'pre-flight' },
            { source: 'improvement-explanation-viz-system', target: 'autonomous' },
            { source: 'tdd', target: 'autonomous' },
            { source: 'pre-flight', target: 'improvement-explanation-viz-system' },
            { source: 'autonomous', target: 'git-checkpoint' },
            { source: 'sanitization', target: 'integrity' },
            { source: 'maintenance', target: 'integrity' },
            { source: 'maintenance', target: 'cleanup' },
            { source: 'maintenance', target: 'refinement' },
            { source: 'refinement', target: 'integrity' },
            { source: 'integrity', target: 'git-checkpoint' },
            { source: 'architectural', target: 'refinement' },
            { source: 'lens', target: 'dashboard' },
            { source: 'viz-debug', target: 'rollback' },
            { source: 'git-checkpoint', target: 'rollback' }
        ];

        // Setup SVG
        const width = document.getElementById('orchestratorMap').offsetWidth;
        const height = 800;

        const svg = d3.select('#orchestratorMap')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        const g = svg.append('g');

        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.5, 3])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });

        svg.call(zoom);

        // visualization-tooltip
        const visualization-tooltip = d3.select('.visualization-tooltip');

        // Force simulation
        const simulation = d3.forceSimulation(orchestrators)
            .force('link', d3.forceLink(links).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-500))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(60));

        // Create links
        const link = g.append('g')
            .selectAll('line')
            .data(links)
            .enter()
            .append('line')
            .attr('class', 'link');

        // Create nodes
        const node = g.append('g')
            .selectAll('g')
            .data(orchestrators)
            .enter()
            .append('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        node.append('circle')
            .attr('r', d => 20 + (d.phases * 2))
            .attr('fill', d => d.color);

        node.append('text')
            .attr('dy', d => 25 + (d.phases * 2) + 15)
            .text(d => d.name)
            .style('font-size', '12px');

        // Node interactions
        node.on('click', function(event, d) {
            window.location.href = d.url;
        });

        node.on('mouseover', function(event, d) {
            d3.select(this).select('circle')
                .transition()
                .duration(200)
                .attr('r', (d.phases * 2) + 25);

            visualization-tooltip.html(`
                <h3>${d.name} Orchestrator</h3>
                <p>${d.description}</p>
                <div>
                    <span class="badge" class="inline-fix-278">${d.category.toUpperCase()}</span>
                    <span class="badge" class="inline-fix-171">${d.phases} Phases</span>
                    <span class="badge" class="inline-fix-171">${d.complexity}</span>
                </div>
                <p>Click to view details</p>
            `)
            .style('left', (event.pageX + 15) + 'px')
            .style('top', (event.pageY - 15) + 'px')
            .classed('visible', true);
        });

        node.on('mouseout', function(event, d) {
            d3.select(this).select('circle')
                .transition()
                .duration(200)
                .attr('r', 20 + (d.phases * 2));

            visualization-tooltip.classed('visible', false);
        });

        // Update positions
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Category filtering
        document.querySelectorAll('.level1-integration-icon-container').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.level1-integration-icon-container').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const category = this.dataset.category;
                
                node.transition()
                    .duration(300)
                    .style('opacity', d => {
                        return category === 'callout-link' || d.category === category ? 1 : 0.2;
                    });

                link.transition()
                    .duration(300)
                    .style('opacity', l => {
                        if (category === 'callout-link') return 0.3;
                        return (l.source.category === category && l.target.category === category) ? 0.3 : 0.05;
                    });
            });
        });

        // Initial layout
        simulation.alpha(1).restart();
    </script>
</body>
</html>
