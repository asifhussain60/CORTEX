<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — Page Not Found | CORTEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/cortex.css"/>
<link rel="icon" href="favicon.ico" type="image/x-icon"/>
<style>
  /* Page-specific: 404 Error (Cyan theme - standalone fallback) */
  :root { --theme-accent: #00d4ff; --theme-accent-rgb: 0, 212, 255; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .error-container { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 1.5rem; padding: 3rem 2rem; max-width: 480px; backdrop-filter: blur(12px); }
  .error-code { font-family: 'Space Grotesk', sans-serif; font-size: 5rem; font-weight: 800; color: var(--theme-accent); line-height: 1; margin-bottom: 0.5rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  p { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
  a.home-link { display: inline-block; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, rgba(var(--theme-accent-rgb),0.15), rgba(var(--theme-accent-rgb),0.05)); border: 1px solid rgba(var(--theme-accent-rgb),0.3); border-radius: 0.5rem; color: var(--theme-accent); text-decoration: none; font-weight: 600; transition: background 0.2s; }
  a.home-link:hover { background: rgba(var(--theme-accent-rgb), 0.2); }
</style>
</head>
<body>
<div class="error-container">
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="index.html" class="home-link">← Back to CORTEX Home</a>
</div>
</body>
</html>
