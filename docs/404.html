<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — Page Not Found | CORTEX</title>
<link rel="icon" href="favicon.ico" type="image/x-icon"/>
<style>
  :root {
    --bg-primary: #0a0e27;
    --text-primary: #e2e8f0;
    --text-secondary: #78809a;
    --accent-cyan: #00d4ff;
    --glass-bg: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .error-container {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 3rem 2rem;
    max-width: 480px;
    backdrop-filter: blur(12px);
  }
  .error-code {
    font-size: 5rem;
    font-weight: 800;
    color: var(--accent-cyan);
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  p { color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; }
  a.home-link {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.05));
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 8px;
    color: var(--accent-cyan);
    text-decoration: none;
    font-weight: 600;
    transition: all 0.2s;
  }
  a.home-link:hover { background: rgba(0,212,255,0.2); }

    /* ── Tetris-Fit v1 — zero dead space in multi-column panels ──────────────
       Authority: cortex-registry/knowledge/sdlc/tetris-layout-spec.yaml
       Injected: 2026-03-09 — Phase 109.3 font/layout standardisation
       /* CORTEX-TETRIS-FIT-APPLIED */
       ─────────────────────────────────────────────────────────────────────── */

    /* Rule 1: Container stretch — all columns share tallest sibling */
    .feature-grid-2,
    .gs-cards-grid,
    .role-tiles-grid,
    .card-grid-3,
    .tetris-container {
        align-items: stretch;
    }

    /* Rule 2: Column fills grid cell top-to-bottom */
    .tp-card,
    .gs-card,
    .role-tile,
    .tetris-col {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    /* Rule 3: Last/growable child absorbs leftover height */
    .gs-card__list,
    .tp-visual,
    .tp-body,
    .tetris-grow {
        flex: 1;
        align-content: stretch;
    }

    /* Rule 4: Nested grid rows expand proportionally */
    .tp-visual {
        align-content: stretch;
    }

    /* Rule 5: Viz/chart panel fills column bottom */
    .macc__viz,
    .stat-chart-wrap,
    .tetris-viz {
        flex: 1;
        justify-content: space-between;
    }

    </style>
</head>
<body>
<div class="error-container">
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="index.html" class="home-link">← Back to CORTEX Home</a>
</div>
</body>
</html>
