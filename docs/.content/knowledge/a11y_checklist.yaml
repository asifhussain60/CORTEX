# a11y_checklist.yaml
# CORTEX Documentation — Accessibility Checklist (WCAG 2.1 Level AA)
# Authority: a11y-perf-guardian
# Updated: 2026-03-08 | Phase 108 — Design+Implement Mode
# Sources: WCAG 2.1 AA, W3C ARIA APG patterns, MDN Accessibility
#
# ⚠️  WCAG VERSION NOTE: This file covers WCAG 2.1 AA criteria.
#     WCAG 2.2 delta (9 new criteria + 1 removal) is in: wcag22_delta_checklist.yaml
#     Together, these two files represent FULL WCAG 2.2 AA compliance coverage.
#     Reference: https://www.w3.org/WAI/WCAG22/quickref/ (updated 2025-09-22)

standard: "WCAG 2.1 Level AA (see wcag22_delta_checklist.yaml for 2.2 additions)"
wcag_22_delta_file: "docs/.content/knowledge/wcag22_delta_checklist.yaml"
enforcement: "a11y-perf-guardian blocks any HTML view change that introduces a regression"

checks:
  perceivable:
    - id: a11y-001
      criterion: "1.1.1 Non-text Content (A)"
      rule: "All images have descriptive alt text"
      test: "grep -n '<img' cortex-docs/*.html | grep -v 'alt='"
      severity: P0
      fix: "Add alt attribute; use alt='' for decorative images with aria-hidden='true'"

    - id: a11y-002
      criterion: "1.3.1 Info and Relationships (A)"
      rule: "Semantic HTML used — headings, lists, tables, landmarks"
      test: "Validate heading hierarchy: no H3 without H2, no H4 without H3"
      severity: P0
      fix: "Replace <div> with appropriate semantic element (<article>, <section>, <nav>, etc.)"

    - id: a11y-003
      criterion: "1.3.2 Meaningful Sequence (A)"
      rule: "DOM order matches visual reading order"
      test: "Disable CSS; verify content is still logically ordered"
      severity: P1
      fix: "Reorder DOM; use order property in flex/grid only for visual adjustments"

    - id: a11y-004
      criterion: "1.4.3 Contrast Minimum (AA)"
      rule: "Text contrast ratio ≥ 4.5:1; large text ≥ 3:1"
      test: "var(--text-primary) #ffffff on var(--bg-primary) #0a0e27 = 19.2:1 ✅"
      severity: P0
      status: "PASSING — dark theme provides high contrast natively"
      watch: "var(--text-secondary) #a0a6c0 on glass-bg — verify ≥ 4.5:1"

    - id: a11y-005
      criterion: "1.4.4 Resize Text (AA)"
      rule: "Text remains readable at 200% zoom without horizontal scrolling"
      test: "Browser zoom to 200%; check no horizontal overflow"
      severity: P1
      fix: "Use relative units (rem, em, %) not px for font-size and container widths"

    - id: a11y-006
      criterion: "1.4.10 Reflow (AA)"
      rule: "No horizontal scrolling at 320px viewport width"
      test: "DevTools mobile emulation at 320px"
      severity: P1
      fix: "Use CSS Grid/Flexbox with wrapping; avoid fixed-width containers"

    - id: a11y-007
      criterion: "1.4.11 Non-text Contrast (AA)"
      rule: "UI components (tabs, buttons, icons) ≥ 3:1 contrast against adjacent colors"
      test: "Tab border, button outlines, input borders"
      severity: P1
      status: "Accent cyan #00d4ff on dark bg = 9.2:1 ✅"

  operable:
    - id: a11y-010
      criterion: "2.1.1 Keyboard (A)"
      rule: "All interactive elements reachable and operable by keyboard"
      test: "Tab through page; all tabs, buttons, links activatable with Enter/Space"
      severity: P0
      fix: "Add tabindex='0' to custom interactive elements; ensure focus visible"

    - id: a11y-011
      criterion: "2.1.2 No Keyboard Trap (A)"
      rule: "Focus never trapped in a component except intentional modals"
      test: "Tab through all tab panels and dialogs; confirm escape exits"
      severity: P0

    - id: a11y-012
      criterion: "2.4.1 Bypass Blocks (A)"
      rule: "Skip-to-main link present as first focusable element"
      test: "First Tab keypress goes to .skip-link"
      severity: P0
      status: "IMPLEMENTED — <a href='#main-content' class='skip-link'>"

    - id: a11y-013
      criterion: "2.4.3 Focus Order (A)"
      rule: "Focus order preserves meaning and operability"
      test: "Tab through page; focus sequence matches visual/reading order"
      severity: P0

    - id: a11y-014
      criterion: "2.4.7 Focus Visible (AA)"
      rule: "Keyboard focus indicator always visible"
      test: "Tab to each element; visible outline must appear"
      severity: P0
      fix: "Ensure :focus-visible { outline: 2px solid var(--accent-primary); } in main.css"

    - id: a11y-015
      criterion: "2.5.3 Label in Name (A)"
      rule: "Visible button/link text is included in accessible name"
      test: "aria-label must contain visible text substring"
      severity: P1

  understandable:
    - id: a11y-020
      criterion: "3.1.1 Language of Page (A)"
      rule: "<html lang='en'> present"
      test: "grep '<html' cortex-docs/*.html | grep 'lang='"
      severity: P0
      status: "IMPLEMENTED ✅"

    - id: a11y-021
      criterion: "3.2.1 On Focus (A)"
      rule: "No automatic context change on focus"
      test: "Tabbing to elements does not trigger navigation or content change"
      severity: P0

  robust:
    - id: a11y-030
      criterion: "4.1.1 Parsing (A)"
      rule: "Valid HTML — no duplicate IDs, properly nested elements"
      test: "W3C HTML Validator; or: grep -n 'id=' cortex-docs/index.html | sort | uniq -d"
      severity: P0

    - id: a11y-031
      criterion: "4.1.2 Name, Role, Value (A)"
      rule: "All interactive components have accessible name, role, and state"
      test: "Tab panels: role=tablist/tab/tabpanel; state: aria-selected, aria-expanded"
      severity: P0
      status: "IMPLEMENTED on cortex-tabs; verify demo-tabs-vertical"

  aria_patterns:
    tablist:
      required_attrs:
        - "role='tablist'"
        - "aria-label='[description]'"
      tab_attrs:
        - "role='tab'"
        - "aria-selected='true/false'"
        - "aria-controls='panel-id'"
        - "id='tab-id'"
      panel_attrs:
        - "role='tabpanel'"
        - "id='panel-id'"
        - "aria-labelledby='tab-id' (optional but recommended)"

    skip_link:
      pattern: "<a class='skip-link' href='#main-content'>Skip to main content</a>"
      placement: "First child of <body>"
      css: "Visually hidden by default (.sr-only equivalent); visible on :focus"

regression_rules:
  - "Any PR that introduces a new <img> without alt attribute → P0 block"
  - "Any PR that removes role='tablist' or aria-selected → P0 block"
  - "Any PR that adds inline style= → informational note (RELAXED — inline styles allowed)"
  - "Any PR that breaks heading hierarchy → P1 flag"
  - "Any PR that removes skip-link → P0 block"
