# design_system.yaml
# CORTEX Documentation Design System — Token Registry
# Authority: design-system-enforcer
# Updated: 2026-03-02 | Phase 108 — Design+Implement Mode
# Source: glass-design-tokens.css (canonical), main.css
# Constraint: This YAML is a human-readable mirror of CSS tokens — CSS is SSOT

identity:
  theme: "Dark Blue Glassmorphism"
  version: "4.0.0"
  constraint: "Theme identity is IMMUTABLE — no light mode, no alternative palettes"
  standard: "glassmorphism-design-standard.md v4.0"

colors:
  backgrounds:
    primary: "rgba(10, 14, 39, 1)   — #0a0e27 — page background deep navy"
    secondary: "rgba(26, 31, 58, 1) — #1a1f3a — card/panel background"
    glass_base: "rgba(26, 31, 58, 0.7) — var(--glass-bg-base)"
    glass_hover: "rgba(26, 31, 58, 0.8) — var(--glass-bg-hover)"
    glass_active: "rgba(26, 31, 58, 0.9) — var(--glass-bg-active)"
    glass_modal: "rgba(26, 31, 58, 0.95) — var(--glass-bg-modal)"
    overlay: "rgba(10, 14, 39, 0.8) — var(--glass-bg-overlay)"
  accents:
    primary: "#00d4ff — var(--accent-primary) — electric cyan"
    secondary: "#7b61ff — var(--accent-secondary) — indigo violet"
    success: "#00ff88 — var(--success)"
    warning: "#ffa500 — var(--warning)"
    danger: "#ff4444 — var(--danger)"
    info: "#3b82f6 — var(--info)"
  text:
    primary: "#ffffff — var(--text-primary)"
    secondary: "#a0a6c0 — var(--text-secondary)"
    muted: "#6b7280 — var(--text-muted)"

typography:
  fonts:
    body: "Inter — var(--font-family-body) — weights: 400, 500, 600"
    heading: "Space Grotesk — var(--font-family-heading) — weights: 500, 700"
    mono: "JetBrains Mono — var(--font-family-mono) — weights: 400, 500"
  scale:
    h1: "clamp(2rem, 4vw + 1rem, 3.5rem) — var(--heading-h1-size)"
    h2: "clamp(1.5rem, 3vw + 0.5rem, 2.5rem) — var(--heading-h2-size)"
    h3: "clamp(1.25rem, 2vw + 0.5rem, 1.875rem) — var(--heading-h3-size)"
    h4: "clamp(1.125rem, 1.5vw + 0.5rem, 1.5rem) — var(--heading-h4-size)"
    h5: "1.125rem — var(--heading-h5-size)"
    body: "1rem / 1.7 line-height"
    small: "0.875rem"
    mono: "0.875rem"
  enforcement:
    - "All headings use var(--font-family-heading) — Space Grotesk"
    - "All body copy uses var(--font-family-body) — Inter"
    - "Code snippets use var(--font-family-mono) — JetBrains Mono"
    - "Font sizes use CSS variables only — no raw px/rem in component files"

blur:
  small: "10px — var(--glass-blur-sm) — standard cards, panels"
  medium: "20px — var(--glass-blur-md) — hero sections, modals"
  large: "30px — var(--glass-blur-lg) — overlays, full-screen backgrounds"
  enforcement: "Never use raw blur values — always reference CSS variable tier"

borders:
  standard: "1px solid rgba(255, 255, 255, 0.1) — var(--glass-border)"
  accent: "1px solid rgba(0, 212, 255, 0.2)"
  accent_active: "1px solid rgba(0, 212, 255, 0.3)"
  radius:
    sm: "8px — var(--radius-sm)"
    md: "12px — var(--radius-md)"
    lg: "16px — var(--radius-lg)"
    full: "9999px — var(--radius-full) — pills, badges"

shadows:
  standard: "0 8px 32px 0 rgba(0, 0, 0, 0.37) — var(--shadow)"
  large: "0 20px 60px 0 rgba(0, 0, 0, 0.5) — var(--shadow-lg)"
  glow: "0 0 20px rgba(0, 212, 255, 0.3) — var(--glow)"
  glow_strong: "0 0 40px rgba(0, 212, 255, 0.5)"

spacing:
  xs: "0.25rem — var(--spacing-xs)"
  sm: "0.5rem — var(--spacing-sm)"
  md: "1rem — var(--spacing-md)"
  lg: "1.5rem — var(--spacing-lg)"
  xl: "2rem — var(--spacing-xl)"
  xxl: "3rem — var(--spacing-2xl)"

  # ── Inter-Section Spacing Algorithm (ISSA) ─────────────────────────────────
  # The visual gap between Section A (above) and Section B (below) is:
  #
  #   Visual Gap = margin_bottom_A + padding_bottom_A + padding_top_B + margin_top_B
  #
  # CSS margin collapsing rule: adjacent block margins collapse to max(mb_A, mt_B).
  # Padding NEVER collapses. Therefore the safe, deterministic recipe is:
  #
  #   Set mb_A = 0 and mt_B = 0 (zero margins, let padding drive the gap).
  #   Visual Gap = padding_bottom_A + padding_top_B = Target Gap Token
  #
  # Standard recipe: Section A → pb-6 (24px) + Section B → pt-6 (24px) = 48px = --space-2xl
  #
  # Formula when you CANNOT zero the margins:
  #   required_padding_sum = Target_px - max(mb_A_px, mt_B_px)
  #   split evenly: pb_A = pt_B = required_padding_sum / 2  (round up to nearest token)
  #
  # Gap Target Lookup Table (use token name as the design language):
  inter_section_spacing:
    algorithm: "Visual Gap = pb_A + pt_B + max(mb_A, mt_B)  [CSS margin-collapse applies]"
    safe_recipe: "Zero margins (mb=0, mt=0). Set pb_A = pt_B = Target_px / 2."
    targets:
      content_to_content:
        token: "--space-2xl"
        px: 48
        rem: "3rem"
        tailwind_recipe: "pb-6 pt-6"
        use_case: "Default: hero→features, features→stats, any two plain content sections"
      content_to_glass_panel:
        token: "--space-xl"
        px: 32
        rem: "2rem"
        tailwind_recipe: "pb-4 pt-4"
        use_case: "Section before/after a glass panel — panel border absorbs visual weight"
      diagram_to_text:
        token: "--space-xl"
        px: 32
        rem: "2rem"
        tailwind_recipe: "mb-8 mt-0 (diagram) + pt-8 (next section)"
        use_case: "After a D3.js / CSS diagram, before narrative text continues"
      card_grid_to_section:
        token: "--space-lg"
        px: 24
        rem: "1.5rem"
        tailwind_recipe: "pb-6 pt-0 (card wrapper already has gap-6)"
        use_case: "Card grid to next section — cards carry internal breathing room"
      hero_to_first_section:
        token: "--space-2xl"
        px: 48
        rem: "3rem"
        tailwind_recipe: "pb-12 pt-0 (hero) + pt-12 (first section, no margin)"
        use_case: "Spacious entry — hero to first content section"
      glass_panel_to_glass_panel:
        token: "--space-lg"
        px: 24
        rem: "1.5rem"
        tailwind_recipe: "my-6 (each panel)"
        use_case: "Stacked glass panels — my-6 = 24px already correct, now token-documented"
    enforcement_note: >
      When the design-system-enforcer validates spacing between adjacent sections,
      it MUST resolve the four-part sum (pb_A + mb_A + pt_B + mt_B) against this
      lookup table. A deviation of ±4px from the target token is a P1 FLAG.
      A deviation of >8px is a P0 BLOCK.

elevation:
  # Z-index layers for consistent stacking
  base: 1
  card: 10
  dropdown: 100
  sticky_nav: 1000
  modal: 2000
  toast: 3000

transitions:
  fast: "150ms ease-in-out — var(--transition-fast)"
  base: "200ms ease-in-out — var(--transition-base)"
  slow: "300ms ease-in-out — var(--transition-slow)"

animation_classes:
  - ".animation-t1 — stagger 0.1s (first elements)"
  - ".animation-t2 — stagger 0.2s (secondary elements)"
  - ".animation-t3 — stagger 0.3s (tertiary elements)"
  - ".pulse-glow-glass--fast — repeating glow pulse for icons"

diagram_tokens:
  # Canonical design tokens for D3.js SVG diagrams
  # Authority: visualization_standards.yaml (detailed rules), this section (token values)
  node_styles:
    primary:
      fill: "rgba(26, 31, 58, 0.7)"
      stroke: "rgba(0, 212, 255, 0.4)"
      stroke_width: "1.5px"
      rx: "8"
    secondary:
      fill: "rgba(26, 31, 58, 0.5)"
      stroke: "rgba(123, 97, 255, 0.4)"
      stroke_width: "1.5px"
      rx: "8"
    highlight:
      fill: "rgba(0, 212, 255, 0.15)"
      stroke: "rgba(0, 212, 255, 0.6)"
      stroke_width: "2px"
      rx: "8"
    danger:
      fill: "rgba(255, 68, 68, 0.15)"
      stroke: "rgba(255, 68, 68, 0.5)"
      stroke_width: "1.5px"
      rx: "8"
    success:
      fill: "rgba(0, 255, 136, 0.12)"
      stroke: "rgba(0, 255, 136, 0.4)"
      stroke_width: "1.5px"
      rx: "8"
  edge_styles:
    default:
      stroke: "rgba(160, 166, 192, 0.5)"
      stroke_width: "1.5px"
      stroke_dasharray: "none"
    dashed:
      stroke: "rgba(160, 166, 192, 0.4)"
      stroke_width: "1px"
      stroke_dasharray: "6,4"
    highlighted:
      stroke: "rgba(0, 212, 255, 0.6)"
      stroke_width: "2px"
      stroke_dasharray: "none"
  arrow_markers:
    default:
      id: "arrow-default"
      type: "path"
      d: "M 0 0 L 10 5 L 0 10 Z"
      fill: "rgba(160, 166, 192, 0.7)"
    accent:
      id: "arrow-accent"
      type: "path"
      d: "M 0 0 L 10 5 L 0 10 Z"
      fill: "rgba(0, 212, 255, 0.7)"
  text_styles:
    node_label:
      font_family: "var(--font-family-body)"
      font_size: "14px"
      fill: "#ffffff"
      font_weight: "500"
    edge_label:
      font_family: "var(--font-family-body)"
      font_size: "12px"
      fill: "var(--text-secondary)"
      font_weight: "400"
    title:
      font_family: "var(--font-family-heading)"
      font_size: "18px"
      fill: "#ffffff"
      font_weight: "600"
    annotation:
      font_family: "var(--font-family-mono)"
      font_size: "11px"
      fill: "var(--text-muted)"
      font_weight: "400"
  container:
    class: ".cortex-diagram"
    background: "transparent"
    padding: "1.5rem"
    border_radius: "var(--radius-md)"
    responsive_rules:
      - "SVG: width='100%', preserveAspectRatio='xMidYMid meet'"
      - "Container: max-width:100%, overflow-x:auto"
      - "Mobile (≤480px): font_size +2px, padding 1rem"
      - "Tablet (481-768px): font_size +1px, padding 1.25rem"
  glow_effects:
    node_hover: "filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.4))"
    edge_hover: "filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.3))"
    max_simultaneous: 3
    note: "Glow limited to 3 elements to prevent GPU compositing overload"

design_constraints:
  - "NEVER introduce light backgrounds — dark navy is the identity"
  - "Inline style= attributes are ALLOWED — prefer CSS classes for reusable patterns, inline for one-offs"
  - "NEVER add new font families — Inter + Space Grotesk + JetBrains Mono are locked"
  - "NEVER override blur with raw pixel values — use tier variables"
  - "ALL new components inherit from glass-design-tokens.css"
  - "Glassmorphism effect = backdrop-filter blur + semi-transparent bg + glass-border"
  - "ALL D3.js SVG diagrams use diagram_tokens above — no inline colour values in diagram code"
