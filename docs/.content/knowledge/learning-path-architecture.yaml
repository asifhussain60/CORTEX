    type: "CSS flexbox pipeline"
    purpose: "Visual progression from orientation through exploration to deep-dive"
    nodes: ["Choose Your Path", "Explore Concepts", "Master Details"]
    style: "3-step horizontal pipeline with glassmorphism cards"

  architecture_overview:
    type: "d3.tree() horizontal"
    purpose: "System layer view — Core → Domain → Support → Health → Intelligence → Git"
    d3_method: "d3.tree().size([height, width])"
