ac_fix_001_05:
  
  metadata:
    ac_id: "AC-FIX-001-05"
    type: "BUGFIX"
    severity: "CRITICAL"
    evidence_grade: "A (95%)"
    root_cause: "DESIGN_WEAKNESS"
    governance_rules: ["CORE-025", "CORE-008", "CORE-011", "CORE-012"]
    blocking_test: "test_hash_chain_integrity"
    investigation_report: "REVIEW-INVESTIGATION-HASH-CHAIN-20260118.yaml"
  
  title: "Fix hash chain to be GLOBAL not per-AC-ID"
  
  description: |
    The audit log hash chain is currently implemented as per-AC-ID chains (each AC
    starts with GENESIS). This violates CORE-025 which requires a single global
    hash chain for tamper-evidence across the entire audit trail.
    
    This fix changes _get_prior_entry_hash() to query the last entry in the entire
    audit log (not filtered by ac_id), ensuring continuous cryptographic linking.
  
  affected_files:
    - path: "src/infrastructure/database_transaction_manager.py"
      method: "_get_prior_entry_hash"
      lines: "314-327"
  
  code_change:
    file: "src/infrastructure/database_transaction_manager.py"
    method: "_get_prior_entry_hash"
    
    old_code: |
      def _get_prior_entry_hash(self, conn: sqlite3.Connection, ac_id: str) -> str:
          """Get previous hash for AC-ID."""
          cursor = conn.cursor()
          cursor.execute("""
              SELECT entry_hash
              FROM audit_log
              WHERE ac_id = ?
              ORDER BY id DESC
              LIMIT 1
          """, (ac_id,))
          
          row = cursor.fetchone()
          if row:
              # Return prior entry's entry_hash
              return row[0]
          else:
              # GENESIS entry (first entry for this AC-ID)
              return ""
    
    new_code: |
      def _get_prior_entry_hash(self, conn: sqlite3.Connection, ac_id: str) -> str:
          """Get previous hash for AC-ID (GLOBAL CHAIN - no ac_id filter)."""
          cursor = conn.cursor()
          cursor.execute("""
              SELECT entry_hash
              FROM audit_log
              ORDER BY id DESC
              LIMIT 1
          """)
          # NOTE: Removed "WHERE ac_id = ?" to create global chain, not per-AC-ID
          
          row = cursor.fetchone()
          if row:
              # Return prior entry's entry_hash (link to LAST entry globally)
              return row[0]
          else:
              # GENESIS entry (first entry in entire audit log)
              return ""
    
    changes_summary: |
      - Removed: "WHERE ac_id = ?" clause from query
      - Effect: Queries last entry overall, not just for this AC-ID
      - Result: Global hash chain (every entry links to prior entry chronologically)
  
  test_plan:
    local_verification:
      - test_file: "tests/unit/test_hash_chain_validation.py"
        test_name: "test_hash_chain_*"
        expected: "UPDATE NEEDED (tests assume per-AC-ID, now global)"
      
      - test_file: "tests/integration/test_audit_trail_integrity.py"
        test_name: "test_hash_chain_integrity"
        expected: "FAIL (until AC-FIX-001-06 regenerates log)"
        timing: "Run after AC-FIX-001-06"
    
    integration_verification:
      - action: "Regenerate audit log (AC-FIX-001-06)"
        reason: "Existing entries have per-AC-ID chains, need fresh data"
      - test: "pytest tests/integration/test_audit_trail_integrity.py::TestAuditTrailIntegrity::test_hash_chain_integrity -v"
        expected: "PASS ✅"
  
  verification_command: |
    # After implementing, before regenerating:
    cd /Users/asifhussain/PROJECTS/CORTEX
    
    # Run unit tests (may need update for global chain):
    python -m pytest tests/unit/test_hash_chain_validation.py -v
    
    # Check code syntax:
    python -m py_compile src/infrastructure/database_transaction_manager.py
    
    # Lint:
    pylint src/infrastructure/database_transaction_manager.py --disable=all --enable=syntax-error
  
  rollback_plan: |
    If needed to rollback:
    git checkout src/infrastructure/database_transaction_manager.py
  
  implementation_checklist:
    - "[ ] Read current code carefully (lines 314-327)"
    - "[ ] Understand per-AC-ID vs global chain difference"
    - "[ ] Make the one-line change (remove WHERE ac_id = ?)"
    - "[ ] Update docstring to mention GLOBAL CHAIN"
    - "[ ] Run local tests to verify syntax (ignore failures)"
    - "[ ] Commit with message: AC-FIX-001-05: Fix hash chain to be global"
    - "[ ] Verify commit shows one file changed, ~5 lines"

