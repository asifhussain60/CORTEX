# ENH-060: Test-Gated Auto-Commit
# Generated: 2026-02-07 via DIGEST mode (chat01.txt)
# Category: AUTOMATION | Priority: P2 | Confidence: 8.0

id: ENH-060
title: Test-Gated Auto-Commit
description: >
  Auto-commit after test validation during remediation work. When a work phase
  completes and tests pass, automatically stage files, generate descriptive
  commit message, and commit changes with proper audit trail.

problem: >
  Work marked "READY TO COMMIT" but requires manual git commands. Session
  flow breaks as user switches from CORTEX guidance to terminal commands.
  
  Current flow:
    Phase complete → Tests pass → "✅ READY TO COMMIT" → User manually:
      git add <files>
      git commit -m "message"
      git push
  
  Issues:
    - Context switching reduces flow
    - Users may forget to commit
    - Commit messages may be inconsistent
    - Audit trail gaps (no AC markers)
    - Lost work if session crashes

solution:
  trigger:
    - Work phase marked complete
    - All tests passing (100%)
    - P0 governance validation passed
  
  auto_commit_flow:
    step_1_test:
      - Run full test suite for affected components
      - If coverage < 80%, warn but continue
      - If P0 tests fail, STOP and report
    
    step_2_stage:
      - Auto-stage changed files
      - Respect .gitignore
      - Exclude temp files
    
    step_3_message:
      - Generate descriptive commit message
      - Include phase identifier
      - List key changes
      - Add AC markers for audit trail
      - Reference CORE rules applied
    
    step_4_commit:
      - Execute git commit
      - Log commit SHA
      - Report success
    
    step_5_push_offer:
      - If autonomous mode: auto-push
      - If interactive mode: ask "Push to remote? [y/N]"
      - If no remote: skip

  commit_message_template: |
    Phase {phase_id}: {short_description}
    
    {detailed_changes}
    
    AC-START: AC-{phase_id}
    Description: {work_description}
    AC-COMPLETE: AC-{phase_id} ✅ {test_count} tests passing
    
    Metrics:
    - Files modified: {modified_count}
    - Tests: {pass}/{total} ({percentage}%)
    - Coverage: {coverage}%
    
    Governance: {core_rules_applied}
    Refs: {related_phases}

implementation:
  components:
    - GitOrchestrator: Core git operations
    - CommitMessageGenerator: Template-based message creation
    - TestRunner: Pre-commit test execution
    - AuditLogger: AC marker injection
  
  safety_gates:
    - Only in remediation contexts (not exploratory)
    - Requires test coverage ≥ 80%
    - P0 governance validation must pass
    - User can disable via config: `auto_commit_enabled: false`
    - Respects .gitignore
    - Never commits to protected branches without approval
  
  configuration:
    auto_commit:
      enabled: true
      require_tests: true
      min_coverage: 0.80
      auto_push: false  # Only in autonomous mode
      protected_branches:
        - main
        - master
        - production
      excluded_patterns:
        - "**/*-SUMMARY.md"
        - "**/*-COMPLETION.md"
        - "**/READY-TO-COMMIT*.md"
  
  error_handling:
    test_failure:
      - STOP commit process
      - Report test failures
      - Wait for manual fix
    
    git_conflict:
      - STOP commit process
      - Report conflict
      - Offer to stash/pull/retry
    
    push_failure:
      - Commit still succeeded locally
      - Report push failure reason
      - Offer retry

