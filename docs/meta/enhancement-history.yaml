# Scoring Criteria
scoring_criteria:
  effort:
    Small: "< 1 week, minimal dependencies"
    Medium: "1-4 weeks, moderate complexity"
    Large: "> 1 month, significant architectural changes"
    
  impact:
    High: "Game-changing for users or system reliability"
    Medium: "Noticeable improvement in specific workflows"
    Low: "Nice-to-have enhancement"
    
  alignment:
