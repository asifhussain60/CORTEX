      - "Educational: Teaches developers TDD workflow"
      - "Governance metrics: Track TDD compliance rate"
    implementation_notes: |
      Pre-Commit Hook: .github/hooks/pre-commit-tdd-validator
      
      Validation Logic:
      1. Detect staged Python files in cortex/ directory
      2. Check if corresponding test file exists in tests/
      3. If new implementation file + no test → BLOCK commit
      4. If test file exists + passes → ALLOW commit
      
      Example Block Message:
        ❌ TDD Violation Detected (CORE-008)
        
        New implementation file detected:
          cortex/models/phase_detail_schema.py
        
        Required test file missing:
          tests/unit/models/test_phase_detail_schema.py
        
        Action: Create test file first, then commit both together
        
        Override (use with caution):
          git commit --no-verify
      
      Configuration (pyproject.toml):
        [tool.cortex.tdd-validator]
        enabled = true
        strict = true
        exempt_dirs = ["scripts/", "deployment/"]
      
      Files to create:
      - .github/hooks/pre-commit-tdd-validator (bash script)
      - .github/hooks/install-hooks.sh (team onboarding)
