    recommendation: "Capability Feasibility Gate - Pre-Execution Validation + Architecture Drift Detection"
    status: PLANNED
    domain: Governance
    source: "chat01.md DIGEST - Request executed despite capability gaps, causing user frustration"
    adoption_reason: |
      Current problem: CORTEX executes requests without validating if capabilities exist.
      chat01.md showed KSESSIONS onboarding proceeded despite C# analysis being file-count-only.
      Users discover gaps AFTER execution, wasting time and eroding trust.
      Architecture drifts can break existing functionality (documentation says PLANNED, code exists).
    expected_benefits:
      - "Pre-execution capability validation before DoR display"
      - "Architecture drift detection (code vs documentation alignment)"
      - "BLOCK mechanism for high-risk requests (drift_score > 0.7, feasibility < 0.3)"
      - "User transparency: know limitations BEFORE approving"
      - "Prevent capability claims that cannot be fulfilled"
      - "Reduce debugging time from capability mismatches"
    implementation_notes: |
      Plan File: _workspaces/cortex-plan/ENH-029-CAPABILITY-FEASIBILITY-GATE.yaml
      
      4-Phase Implementation (12 days total):
      
      Phase 1: CapabilityFeasibilityAnalyzer (4 days)
        * Analyze request against registered capabilities
        * Score: 0.0 (impossible) to 1.0 (fully capable)
        * Identify gaps with severity (BLOCKING, DEGRADED, MINOR)
        * 25 tests
      
      Phase 2: ArchitectureDriftDetector (3 days)
        * Compare code state vs documentation claims
        * Detect: PLANNED→EXISTS, EXISTS→MISSING, VERSION_MISMATCH
        * 20 tests
      
      Phase 3: InteractionOrchestrator Integration (3 days)
        * Insert feasibility check before DoR display
        * Add capability matrix to DoR output
        * BLOCK gate for drift_score > 0.7 OR feasibility < 0.3
        * 15 tests
      
      Phase 4: MCP Tools + Prompts (2 days)
        * cortex_validate_feasibility MCP tool
        * Update cortex-architect.prompt.md with feasibility section
        * 10 tests
      
      Total: 70 tests, 90% coverage target
      
      New Components:
      - cortex/orchestrators/core/capability_feasibility_analyzer.py
      - cortex/orchestrators/core/architecture_drift_detector.py
      - cortex/mcp/tools/feasibility_validation_tool.py
      
