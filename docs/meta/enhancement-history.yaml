      3. README.md (ENHANCE - add MCP Architecture section)
         - Add "Architecture: MCP-First Service-Oriented Design" badge
         - Link to docs/04-architecture/mcp-architecture.md
         - Add architecture diagram (MCP Server + Orchestrators)
         
      4. docs/04-architecture/comparison-table.md (NEW - 200 lines)
         Monolithic vs MCP-First Comparison:
         | Aspect | Monolithic | MCP-First CORTEX |
         |--------|-----------|------------------|
         | Service Boundaries | Tightly coupled modules | 28 independent orchestrators |
         | Communication | Direct function calls | MCP JSON-RPC protocol |
         | Scaling | Vertical (entire app) | Horizontal (per orchestrator) |
         | Deployment | Single process | Docker Compose / K8s |
         | Language Binding | Python-only | Language-agnostic (MCP) |
         
      Content Highlights:
      
      ## MCP Server = Service-Oriented Architecture
      
      CORTEX is NOT a monolithic application. It operates as:
      - **MCP Server:** All 28 orchestrators exposed as MCP tools
      - **Gateway Pattern:** cortex_process_request routes to appropriate orchestrator
      - **Independent Scaling:** Each orchestrator can scale independently via MCP proxy
      - **Protocol-Driven:** Tools communicate via MCP JSON-RPC (language-agnostic)
      - **Service Isolation:** Orchestrators don't import each other directly
      
      ### Why MCP-First?
      1. **Service Boundaries:** Each orchestrator = independent service
      2. **Language Agnostic:** Clients can be written in any language
      3. **Dynamic Discovery:** Tools register at runtime, no static wiring
      4. **Versioning:** Each tool can version independently
      5. **Observability:** MCP protocol enables centralized tracing
      
      ### Service Catalog (28 Orchestrators)
      - Core (8): MasterOrchestrator, InteractionOrchestrator, IntentRouter, ...
      - Domain (6): RefactoringOrchestrator, PlanningOrchestrator, ...
      - Support (14): OnboardingOrchestrator, ToolDiscoveryOrchestrator, ...
      
      ### Deployment Model
      ```yaml
      # docker-compose.yml (simplified)
      services:
        mcp-server:
          image: cortex-mcp-server
          ports: ["8000:8000"]
        
        orchestrator-master:
          image: cortex-orchestrator
          environment:
            ORCHESTRATOR_TYPE: master
        
        orchestrator-tdd:
          image: cortex-orchestrator
          environment:
            ORCHESTRATOR_TYPE: tdd
        
        # ... 26 more orchestrator services
      ```
      
      Migration Plan (2 weeks):
      - Week 1: Write docs/04-architecture/mcp-architecture.md
      - Week 1: Create MCP Tool Graph visualization
      - Week 2: Update README.md + comparison table
      - Week 2: Review + publish documentation
