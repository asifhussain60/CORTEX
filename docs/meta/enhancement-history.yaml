    implementation_notes: |
      Cache Architecture:
      
      Cache Key Strategy:
      - hash(user_request + repo_state_hash + lens_version)
      - repo_state_hash = git HEAD commit + file mtimes
      - Ensures cache invalidation on code changes
      
      Storage Options:
      1. Redis (production) - Distributed, TTL support, persistence
      2. In-memory (development) - Fast, no external dependency
      
      Cache Layers:
      Layer 1: Language Analysis Cache (50ms savings)
      - Key: hash(user_request)
      - Value: IntentClassification result
      - TTL: 5 minutes
      
      Layer 2: Examination Cache (200ms savings)
      - Key: hash(target_files + file_mtimes)
      - Value: ASTAnalysis + type inference results
      - TTL: 30 minutes
      
      Layer 3: Navigation Cache (400ms savings)
      - Key: hash(repo_path + git_HEAD)
      - Value: Git history + hotspot analysis
      - TTL: 60 minutes
      
      Layer 4: Synthesis Cache (100ms savings)
      - Key: hash(language + examination + navigation + governance_rules)
      - Value: Final LENS result with confidence score
      - TTL: 5 minutes
      
      Implementation Files:
      - cortex/lens/cache/lens_cache.py (300 lines)
      - cortex/lens/cache/cache_key_builder.py (150 lines)
      - cortex/lens/cache/redis_backend.py (200 lines)
      - cortex/lens/cache/memory_backend.py (150 lines)
      - cortex/lens/orchestrators/cached_lens_orchestrator.py (250 lines)
      - tests/unit/lens/cache/test_lens_cache.py (400 lines, 45 tests)
      
