    adoption_reason: "ChatGPT reviewer incorrectly characterized CORTEX as 'monolithic' and suggested 'microservices decomposition' — missed that CORTEX is already service-oriented via MCP server architecture. Need better documentation to prevent misunderstanding by external reviewers, new developers, and stakeholders."
