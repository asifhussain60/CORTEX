  - id: ENH-011
    date: "2026-02-04"
    recommendation: "Branch topology-aware CORTEX ecosystem upgrade detection"
    status: IMPLEMENTED
    domain: DX
    source: "User feedback - regression prevention in PRE-FLIGHT"
    adoption_reason: "Prevent false upgrade prompts when CORTEX branch has newer work than origin/main; detect ecosystem changes (prompts/agents/orchestrators)"
    expected_benefits:
      - "Zero false 'behind' warnings when CORTEX has exclusive commits"
      - "Correct diverged branch state detection (both branches have work)"
      - "Ecosystem-aware: detect prompt/agent/orchestrator/wiring changes"
      - "Merge strategy selection: merge (safe) vs rebase (clean history)"
      - "User education: explain branch topology with visual indicators"
    implementation_notes: |
      Files modified:
      - .github/prompts/cortex-architect.prompt.md (branch topology analysis)
      - .github/agents/core/cortex-environment-setup.md (v2.0 - ecosystem detection)
      - .github/agents/core/cortex-architect.md (updated PRE-FLIGHT flow)
      - docs/meta/enhancement-history.yaml (this file - ENH-011)
      
      Features:
      - Branch topology analysis via git merge-base
      - 4-state classification: UP_TO_DATE, AHEAD, BEHIND, DIVERGED
      - Ecosystem change detection:
        * .github/prompts/*.md files
        * .github/agents/core/*.md files
        * cortex/wiring/specifications/wiring.yaml
        * New orchestrators in cortex/orchestrators/
      - Merge vs rebase strategy selection (DIVERGED only)
      - Commit ancestry verification via timestamps
      - Enhanced user education (branch status guide)
      
      Git Commands:
      - git merge-base HEAD origin/main (find common ancestor)
      - git rev-list --count <base>..HEAD (CORTEX ahead)
      - git rev-list --count <base>..origin/main (origin/main ahead)
      - git diff --name-only <base>..origin/main (ecosystem changes)
      
      Safety Features:
      - Preserves local work during merge (never overwrites CORTEX commits)
      - Conflict pre-check via git merge-tree
      - Warn when skipping ecosystem updates
      - Show temporal relationship (commit timestamps)
      
      Fix for User Issue:
      - Previous: Used git rev-list HEAD..origin/main (misleading on diverged branches)
      - Fixed: Use merge-base + count commits from ancestor (accurate topology)
      - Result: CORTEX 10 ahead, origin/main 2 ahead = DIVERGED (not BEHIND)
    metrics:
      files_modified: 4
