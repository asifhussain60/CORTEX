# Claude Code Knowledge Rendering Rules
# Controls how learning content is presented across difficulty levels
# SSOT for explanation style, terminology, diagrams, and progressive complexity
# Last verified: 2026-03-14

metadata:
  title: Claude Code Rendering Rules
  version: "1.0"
  purpose: "Define how content scales across Beginner → Intermediate → Advanced"
  running_example: "TaskFlow — a task management CLI application"

# ─────────────────────────────────────────────
# Explanation Style Rules
# ─────────────────────────────────────────────
explanation_styles:
  beginner:
    tone: "friendly, encouraging, zero-jargon"
    sentence_length: "short (8-15 words average)"
    paragraph_length: "2-3 sentences max"
    structure: "What → Why → How (always in this order)"
    examples: "concrete, copy-pasteable, single-step"
    analogies: "everyday objects (filing cabinet, assistant, toolbox)"
    code_blocks: "1-3 lines max, heavily commented"
    mental_model: "Claude as a helpful assistant sitting next to you"

  intermediate:
    tone: "professional, practical, moderate technical depth"
    sentence_length: "medium (12-20 words average)"
    paragraph_length: "3-5 sentences"
    structure: "Context → Pattern → Implementation → Verification"
    examples: "multi-step, realistic project scenarios"
    analogies: "software engineering (assembly line, API contract, middleware)"
    code_blocks: "5-15 lines, key lines commented"
    mental_model: "Claude as a configurable development partner"

  advanced:
    tone: "technical, architectural, systems-thinking"
    sentence_length: "variable (supports complex ideas)"
    paragraph_length: "as needed for completeness"
    structure: "Problem → Architecture → Trade-offs → Implementation → Verification → Scale"
    examples: "production-grade, multi-file, multi-agent"
    analogies: "distributed systems (orchestration, consensus, fan-out/fan-in)"
    code_blocks: "15-40 lines, production patterns with error handling"
    mental_model: "Claude as an orchestrated AI workforce"

# ─────────────────────────────────────────────
# Terminology Simplification
# ─────────────────────────────────────────────
terminology:
  mappings:
    - technical: "agentic loop"
      beginner: "Claude's think-act-check cycle"
      intermediate: "the agentic tool-use loop"
      advanced: "agentic loop with tool-call arbitration"

    - technical: "context window"
      beginner: "Claude's short-term memory (what it can see right now)"
      intermediate: "the ~200K token context window"
      advanced: "context window with compaction heuristics and token budget management"

    - technical: "SKILL.md"
      beginner: "a recipe file that teaches Claude a new trick"
      intermediate: "a skill definition file with frontmatter and procedures"
      advanced: "a SKILL.md with intent-matching description, supporting references, and dynamic context injection"

    - technical: "subagent"
      beginner: "a helper you can send on a specific errand"
      intermediate: "a scoped Claude instance with restricted tools and its own memory"
      advanced: "a sandboxed agent with tool allowlists, MCP scoping, permission modes, and persistent memory"

    - technical: "hooks"
      beginner: "automatic actions that run at specific moments"
      intermediate: "lifecycle hooks that intercept tool execution with stdin/stdout protocol"
      advanced: "event-driven hooks with matcher patterns, transform actions, and cascading priority (project → user → agent)"

    - technical: "MCP server"
      beginner: "a plugin that gives Claude access to external tools"
      intermediate: "a Model Context Protocol server exposing tools via stdio/SSE transport"
      advanced: "an MCP server with tool schemas, permission scoping, and agent-level access control"

    - technical: "fan-out/fan-in"
      beginner: "splitting work into parallel tasks and collecting results"
      intermediate: "parallel agent execution with result synthesis"
      advanced: "fan-out/fan-in orchestration with mailbox coordination and conflict resolution"

    - technical: "orchestration"
      beginner: "coordinating multiple helpers to get work done"
      intermediate: "multi-agent coordination patterns"
      advanced: "layered orchestration stack (CLAUDE.md → Skills → Hooks → Agents → Teams)"

# ─────────────────────────────────────────────
# Diagram Recommendations
# ─────────────────────────────────────────────
diagrams:
  engine: "d3.js v7.8.5"
  fallback: "static SVG with alt text"
  accessibility: "all diagrams must have aria-label and keyboard navigation"

  per_level:
    beginner:
      types: ["flowchart", "simple-tree", "before-after"]
      max_nodes: 6
      animation: "gentle fade-in, no complex transitions"
      color_coding: "green = good, red = avoid, gold = current step"
      interaction: "hover tooltips only"
      examples:
        - "Agentic loop: User → Claude → Tool → Result → User"
        - "File structure: project root → CLAUDE.md → src/"
        - "Session flow: start → work → compact → continue"

    intermediate:
      types: ["flowchart", "hierarchy-tree", "sequence-diagram", "state-machine"]
      max_nodes: 12
      animation: "step-through with click progression"
      color_coding: "domain-coded (skills=blue, hooks=amber, agents=purple)"
      interaction: "click to expand, hover for details"
      examples:
        - "Skill loading: request → match → load SKILL.md → execute"
        - "Hook pipeline: event → matcher → hook → action (allow/deny/transform)"
        - "Agent tool scoping: agent → allowlist filter → tool execution"

    advanced:
      types: ["network-graph", "force-directed", "sankey", "timeline", "architecture-diagram"]
      max_nodes: 20
      animation: "force simulation, zoom/pan, animated data flow"
      color_coding: "layer-coded with opacity for depth"
      interaction: "full interactive: drag, zoom, filter, highlight paths"
      examples:
        - "Orchestration network: lead agent → teammates → mailbox → synthesis"
        - "CI/CD pipeline: trigger → fan-out → parallel agents → fan-in → report"
        - "5-layer stack: CLAUDE.md → Skills → Hooks → Agents → Teams (interactive drill-down)"

# ─────────────────────────────────────────────
# Progressive Complexity Guidelines
# ─────────────────────────────────────────────
progressive_complexity:
  running_example:
    name: "TaskFlow"
    description: "A CLI task management application used across all 3 levels"
    repository: "taskflow-app/ with src/, tests/, CLAUDE.md, .claude/"

    beginner_scope:
      - "Explore the existing TaskFlow codebase with Claude"
      - "Add a simple feature (mark task as done)"
      - "Fix a bug (date parsing error)"
      - "Write tests for existing functions"
      - "Create documentation"

    intermediate_scope:
      - "Create a TDD skill for TaskFlow development"
      - "Build a code review subagent scoped to TaskFlow"
      - "Add pre-commit hooks for TaskFlow quality gates"
      - "Manage context across multi-file TaskFlow changes"
      - "Build a skill library for TaskFlow conventions"

    advanced_scope:
      - "Orchestrate agent teams for TaskFlow feature sprint"
      - "Automate TaskFlow CI/CD with Claude in GitHub Actions"
      - "Build a TaskFlow plugin for team distribution"
      - "Design intent routing for TaskFlow maintenance"
      - "Implement convergence loops for TaskFlow audit"

  module_scaling:
    description: "Each of the 23 modules revisits the same concept at increasing depth"
    pattern:
      beginner: "What is it? → Try it once → See the result"
      intermediate: "How does it work? → Configure it → Integrate with other features"
      advanced: "How to architect it? → Scale it → Govern it → Automate it"

# ─────────────────────────────────────────────
# Technical-to-Plain-Language Translation
# ─────────────────────────────────────────────
translations:
  patterns:
    - pattern: "imperative-to-benefit"
      description: "Convert technical imperatives to user benefits"
      examples:
        - technical: "Set permissionMode to bypassPermissions"
          plain: "Let this agent run without asking you first (for trusted, well-tested agents only)"

    - pattern: "config-to-story"
      description: "Convert configuration to a narrative sequence"
      examples:
        - technical: "Add tools: [Read, Grep, Glob] to agent frontmatter"
          plain: "Tell Claude which tools this agent is allowed to use — like giving a new employee their access badge"

    - pattern: "error-to-action"
      description: "Convert error messages to actionable next steps"
      examples:
        - technical: "Context window exceeded — auto-compacting"
          plain: "Claude's memory is getting full. It's summarising the conversation so far to free up space. Your work is safe."

    - pattern: "architecture-to-analogy"
      description: "Convert architecture concepts to relatable analogies"
      examples:
        - technical: "The 5-layer orchestration stack"
          plain: "Think of it like a company: CLAUDE.md is the employee handbook, Skills are training manuals, Hooks are security guards, Agents are team members, and Teams are the whole department working together"

# ─────────────────────────────────────────────
# Visual Theme Rules
# ─────────────────────────────────────────────
visual_theme:
  name: "Golden Dark Glassmorphism"
  background: "#0a0e1a"
  glass_bg: "rgba(15, 20, 35, 0.75)"
  glass_border: "rgba(255, 255, 255, 0.08)"
  glass_blur: "blur(20px)"

  accent_palette:
    primary_gold: "#d4a017"
    light_gold: "#fbbf24"
    warm_gold: "#f59e0b"
    amber: "#d97706"
    highlight: "#fef3c7"

  level_colors:
    beginner: { primary: "#10b981", bg: "rgba(16, 185, 129, 0.12)", border: "rgba(16, 185, 129, 0.25)" }
    intermediate: { primary: "#f59e0b", bg: "rgba(245, 158, 11, 0.12)", border: "rgba(245, 158, 11, 0.25)" }
    advanced: { primary: "#ef4444", bg: "rgba(239, 68, 68, 0.12)", border: "rgba(239, 68, 68, 0.25)" }

  typography:
    body: "'Inter', system-ui, sans-serif"
    display: "'Space Grotesk', sans-serif"
    code: "'JetBrains Mono', monospace"

  animations:
    card_hover: "translateY(-4px) with gold glow"
    module_enter: "fadeInUp with 50ms stagger"
    diagram_load: "progressive reveal (nodes → edges → labels)"
    progress_bar: "width transition 300ms ease"
