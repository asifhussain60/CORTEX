    "id": "design_sync_orchestrator.DesignSyncOrchestrator",
    "name": "DesignSyncOrchestrator",
    "module": "design_sync_orchestrator",
    "method_count": 29,
    "is_abstract": false,
    "docstring": "Design-Implementation Synchronization Orchestrator.\n\nResolves design drift through 6-phase workflow:\n\nPhase 1: Live Implementation Discovery\n    - Scan src/operations/modules/ for actual module files\n    - Parse cortex-operations.yaml for operation definitions\n    - Count tests in tests/ directory\n    - Discover plugins in src/plugins/\n    - Build accurate implementation state\n\nPhase 2: Design Document Discovery\n    - Auto-detect LATEST design version (scan cortex-brain/cortex-2.0-design/)\n    - Find all status files (STATUS.md, CORTEX2-STATUS.MD, etc.)\n    - Identify verbose MD documents (>500 lines)\n    - Catalog YAML schemas already present\n\nPhase 3: Gap Analysis\n    - Compare design claims vs actual implementation\n    - Identify overclaimed features (claimed complete but not implemented)\n    - Identify underclaimed features (implemented but not documented)\n    - Find inconsistent module/test counts\n    - Detect redundant status files\n    - Flag verbose MD documents for YAML conversion\n\nPhase 4: Optimization Integration\n    - Run optimize_cortex to get latest recommendations\n    - Parse optimization output for architectural improvements\n    - Integrate recommendations into design updates\n    - Prioritize by impact and feasibility\n\nPhase 5: Document Transformation\n    - Convert verbose MD to YAML schemas (preserving critical info)\n    - Update status files with accurate counts\n    - **Auto-generate \"Recent Updates\" from git commit history**\n    - **Add contextual timestamps (e.g., \"design_sync + deployment updates\")**\n    - Consolidate multiple status files into ONE source of truth\n    - Generate visual progress bars based on reality\n    - Apply consistent formatting\n\nPhase 6: Git Commit & Reporting\n    - Commit all changes with detailed messages\n    - Generate comprehensive sync report\n    - Update Enhancement & Drift Log in 00-INDEX.md\n    - Provide next action recommendations\n\nUsage:\n    orchestrator = DesignSyncOrchestrator(project_root=Path('/path/to/cortex'))\n    result = orchestrator.execute(context={'profile': 'comprehensive'})\n\nProfiles:\n    - quick: Discovery and analysis only (no changes)\n    - standard: Discovery, analysis, consolidation (safe updates)\n    - comprehensive: Full sync with optimization + YAML conversion"
  },

    "id": "hardcoded_data_cleaner_module.HardcodedDataCleanerModule",
    "name": "HardcodedDataCleanerModule",
    "module": "hardcoded_data_cleaner_module",
    "method_count": 14,
    "is_abstract": false,
    "docstring": "Aggressively detects hardcoded paths, mock data, and fallback mechanisms.\n\nDetection Rules:\n\n1. HARDCODED PATHS (CRITICAL):\n   - Absolute paths: C:\\Users\\..., /home/user/..., D:\\PROJECTS\\...\n   - Platform-specific paths without Path() wrapper\n   - Hardcoded directory separators (\\, /) instead of Path.joinpath\n\n2. MOCK DATA (HIGH):\n   - unittest.mock imports in non-test files\n   - @patch, @MagicMock in production code\n   - Functions returning hardcoded dicts/lists without data source\n   - Fake/dummy/stub data in production code\n\n3. FALLBACK VALUES (HIGH):\n   - try/except returning hardcoded values on failure\n   - .get() with hardcoded defaults that mask missing config\n   - if/else chains with hardcoded fallbacks\n   - Default values that should come from config/environment\n\n4. TEST FIXTURES (MEDIUM):\n   - Hardcoded test data inside test functions\n   - No use of @pytest.fixture for shared test data\n   - Inline dictionaries/lists with test values\n\n5. PLACEHOLDER DATA (MEDIUM):\n   - TODO/FIXME comments with temporary hardcoded values\n   - Obvious placeholder strings ('test', 'example', 'dummy', 'fake')\n   - Hardcoded URLs, API keys, database connections\n\nUsage:\n    cleaner = HardcodedDataCleanerModule()\n    result = cleaner.execute(context={\n        'project_root': Path('/path/to/project'),\n        'scan_paths': [Path('src'), Path('tests')],\n        'exclude_patterns': ['__pycache__', '.git'],\n        'fail_on_critical': True\n    })"
  },

    "id": "complexity_analyzer.ComplexityAnalyzer",
    "name": "ComplexityAnalyzer",
    "module": "complexity_analyzer",
    "method_count": 12,
    "is_abstract": false,
    "docstring": "Analyzes planning complexity using 4-dimensional scoring.\n\nScoring Methodology:\n    - Scope Magnitude (25 pts): Files, entities, API endpoints affected\n    - Dependencies (25 pts): External services, libraries, breaking changes\n    - Risk Level (30 pts): Security, auth, data loss, compliance concerns\n    - Uncertainty (20 pts): Ambiguous requirements, unknown tech, R&D needed\n\nAuto-Route Triggers (HIGH complexity):\n    - Security patterns: authentication, authorization, encryption\n    - Data operations: migrations, schema changes, data loss risk\n    - API changes: breaking changes, versioning, contract modifications\n    - Critical domains: payment, healthcare, financial calculations\n\nIntegration:\n    - Called by TieredRouter before classification\n    - Influences Tier 3 vs Tier 4 routing decisions\n    - Used by Planning Orchestrator for execution mode selection"

  {
    "id": "domain_classifier.DomainClassifier",
    "name": "DomainClassifier",
    "module": "domain_classifier",
    "method_count": 7,
    "is_abstract": false,
    "docstring": "Classifies code domains for adaptive analysis depth.\n\nDomain Tiers:\n    CRITICAL (deep AST analysis):\n        - Security: authentication, authorization, encryption, input validation\n        - Compliance: PII handling, GDPR, HIPAA, PCI, audit trails\n        - Financial: payment processing, calculations, rounding, transactions\n        - Business Logic: core workflows, state machines, business rules\n    \n    STANDARD (high-level analysis):\n        - UI Components: React/Vue/Angular components, templates\n        - Utilities: helpers, formatters, converters\n        - API Clients: HTTP clients, SDK wrappers\n        - Middleware: logging, caching, error handling\n    \n    SIMPLE (surface-level analysis):\n        - Documentation: READMEs, guides, comments\n        - Configuration: JSON/YAML configs, env files\n        - Scaffolding: boilerplate, templates\n        - Test fixtures: mock data, test constants\n\nSecurity Pattern Library (OWASP Top 10):\n    - A01:2021 - Broken Access Control\n    - A02:2021 - Cryptographic Failures\n    - A03:2021 - Injection (SQL, XSS, Command)\n    - A04:2021 - Insecure Design\n    - A05:2021 - Security Misconfiguration\n    - A06:2021 - Vulnerable Components\n    - A07:2021 - Authentication Failures\n    - A08:2021 - Software/Data Integrity\n    - A09:2021 - Security Logging Failures\n    - A10:2021 - Server-Side Request Forgery\n\nIntegration:\n    - Called by ComplexityAnalyzer to boost risk scores\n    - Used by AST Engine to determine analysis depth\n    - Influences router tier classification (CRITICAL \u2192 Tier 4)"
  },

    "id": "planning_intelligence_coordinator.PlanningIntelligenceCoordinator",
    "name": "PlanningIntelligenceCoordinator",
    "module": "planning_intelligence_coordinator",
    "method_count": 8,
    "is_abstract": false,
    "docstring": "Coordinates complexity analysis and test value scoring for planning decisions.\n\nWorkflow:\n    1. User provides feature request\n    2. Analyze planning complexity (ComplexityAnalyzer)\n    3. If code exists, analyze test value (TestValueScorer)\n    4. Combine scores to recommend planning mode + test strategy\n    5. Provide time estimates based on combined analysis\n\nDecision Matrix:\n    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n    \u2502 Complexity      \u2502 CRITICAL Tests   \u2502 HIGH/MEDIUM Tests\u2502 LOW/TRIVIAL Tests\u2502\n    \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n    \u2502 CRITICAL/HIGH   \u2502 Incremental+Full \u2502 Incremental+Some \u2502 Incremental+Skip \u2502\n    \u2502 MEDIUM          \u2502 Skeleton+Targeted\u2502 Skeleton+Targeted\u2502 Skeleton+Skip    \u2502\n    \u2502 LOW/TRIVIAL     \u2502 Skeleton+Targeted\u2502 Direct+Skip      \u2502 Direct+Skip      \u2502\n    \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\nIntegration:\n    - Called by Planning Orchestrator before execution\n    - Informs TDD Orchestrator whether to generate tests\n    - Used by response templates to explain decisions"
  },

    "is_abstract": false,
    "docstring": "Meta-level orchestrator for comprehensive CORTEX system optimization.\n\nCoordinates 8 optimization phases:\n\nPhase 0: Instruction File Review\n    - Holistic review of CORTEX.prompt.md + copilot-instructions.md\n    - Detect redundancy, outdated references, bloat\n    - Validate trigger coverage and consistency\n    - Optimize for token efficiency\n\nPhase 1: Design Sync\n    - Run design_sync_orchestrator\n    - Resolve design-implementation drift\n    - Consolidate status files\n    - Update module counts\n\nPhase 2: Code Health\n    - Run optimize_cortex_orchestrator\n    - Identify obsolete tests\n    - Detect dead code\n    - Analyze test coverage gaps\n\nPhase 3: Brain Tuning\n    - Validate tier boundaries (Tier 0, 1, 2, 3)\n    - Prune low-confidence patterns (<0.50)\n    - Detect and merge duplicate patterns\n    - Validate brain protection rules (YAML)\n\nPhase 4: Entry Point Alignment\n    - Validate all orchestrator headers use HeaderFormatter\n    - Sync command registry with natural language triggers\n    - Update CORTEX.prompt.md with discovered commands\n    - Ensure consistent copyright attribution\n\nPhase 5: Test Suite Optimization\n    - Execute obsolete test removal (from Phase 2)\n    - Fix failing tests using recommendations\n    - Validate 100% pass rate (SKULL-007 compliance)\n    - Generate test coverage report\n\nPhase 6: Comprehensive Report\n    - Consolidate metrics from all phases\n    - Calculate overall health score\n    - Generate recommendations\n    - Save to cortex-brain/system-optimization-report.md\n\nPhase 7: Governance Health Check\n    - Check rule position drift vs optimal ordering\n    - Count forward references (target: <3)\n    - Detect file bloat (target: <1200 lines)\n    - Identify orphaned rules (never referenced)\n    - Validate metadata (copilot_position, reference_count)\n    - Calculate governance health score (0-100)\n\nPhase 8: SKULL Test Discovery & Validation\n    - Scan CORTEX system holistically for governance enforcement points\n    - Identify missing SKULL tests for brain protection rules\n    - Detect outdated SKULL tests (rules removed/refactored)\n    - Validate SKULL test coverage (all Tier 0 instincts tested)\n    - Recommend new SKULL tests based on governance drift\n    - Execute existing SKULL tests and report failures\n\nUsage:\n    orchestrator = OptimizeSystemOrchestrator(project_root=Path('/path/to/cortex'))\n    result = orchestrator.execute(context={'profile': 'comprehensive', 'mode': 'live'})"

        const width = document.getElementById('diagram').offsetWidth;
        const height = 800;
        
        const svg = d3.select("#diagram")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // Define arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");
        
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .join("path")
            .attr("class", "link");
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", d => d.is_abstract ? "node abstract" : "node")
            .attr("r", d => 10 + d.method_count * 2)
            .attr("fill", d => d.is_abstract ? "#ff9999" : "#6699ff")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);
        
        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name)
            .attr("text-anchor", "middle")
            .attr("dy", -15);
        
        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });
            
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            tooltip.style("opacity", 1)
                .html(`
                    <strong>${d.name}<\/strong><br/>
                    Module: ${d.module}<br/>
                    Methods: ${d.method_count}<br/>
                    ${d.is_abstract ? "Abstract Class<br/>" : ""}
                    ${d.docstring}
                `)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }
        
        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }
