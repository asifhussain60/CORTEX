<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Class Hierarchy</title>
<script src="https://d3js.org/d3.v7.8.5.min.js" type="text/javascript">
</script>
<style type="text/css">
      body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #diagram {
            width: 100%;
            height: 800px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .node {
            cursor: pointer;
            stroke: #333;
            stroke-width: 2px;
        }
        .node.abstract {
            stroke-dasharray: 5, 5;
        }
        .link {
            stroke: #999;
            stroke-width: 2px;
            fill: none;
            marker-end: url(#arrow);
        }
        .node-label {
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
  <body>
    <h1>Class Hierarchy<\/h1>
    <div id="diagram"><\/div>
    <div class="tooltip" id="tooltip"><\/div>
    
    <script>
        const nodes = [
  {
    "id": "tdd_orchestrator_v4.TDDPhase",
    "name": "TDDPhase",
    "module": "tdd_orchestrator_v4",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "TDD workflow phases."
  },
  {
    "id": "tdd_orchestrator_v4.ValidationResult",
    "name": "ValidationResult",
    "module": "tdd_orchestrator_v4",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Result from DoR/DoD validation."
  },
  {
    "id": "tdd_orchestrator_v4.PhaseResult",
    "name": "PhaseResult",
    "module": "tdd_orchestrator_v4",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Result from phase execution."
  },
  {
    "id": "tdd_orchestrator_v4.TechnologyProfile",
    "name": "TechnologyProfile",
    "module": "tdd_orchestrator_v4",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Adaptive technology profile for learning."
  },
  {
    "id": "tdd_orchestrator_v4.TDDPhaseStrategy",
    "name": "TDDPhaseStrategy",
    "module": "tdd_orchestrator_v4",
    "method_count": 4,
    "is_abstract": true,
    "docstring": "Base strategy for TDD phase execution.\n\nEach phase (RED, GREEN, REFACTOR) implements this interface with:\n- DoR validation (Definition of Ready)\n- Phase execution\n- DoD validation (Definition of Done)\n- Rollback capability"
  },
  {
    "id": "tdd_orchestrator_v4.TechnologyDiscoveryEngine",
    "name": "TechnologyDiscoveryEngine",
    "module": "tdd_orchestrator_v4",
    "method_count": 8,
    "is_abstract": false,
    "docstring": "Discovers and adapts to new technologies, frameworks, and patterns.\n\nPurpose: Keep TDD orchestrator current with latest releases\nFeatures:\n- Framework version detection\n- New pattern discovery\n- Best practice learning\n- Breaking change adaptation"
  },
  {
    "id": "tdd_orchestrator_v4.CleanCodeEnforcer",
    "name": "CleanCodeEnforcer",
    "module": "tdd_orchestrator_v4",
    "method_count": 9,
    "is_abstract": false,
    "docstring": "Enforces clean code best practices during TDD workflow.\n\nPrinciples:\n- SOLID principles\n- DRY (Don't Repeat Yourself)\n- KISS (Keep It Simple, Stupid)\n- YAGNI (You Aren't Gonna Need It)\n- Single Responsibility"
  },
  {
    "id": "tdd_orchestrator_v4.TDDOrchestratorV4",
    "name": "TDDOrchestratorV4",
    "module": "tdd_orchestrator_v4",
    "method_count": 7,
    "is_abstract": false,
    "docstring": "Unified TDD Orchestrator with adaptive learning and clean architecture.\n\nFeatures:\n- Strategy pattern for phase execution\n- Technology discovery and adaptation\n- Clean code enforcement\n- AI-driven code generation\n- Automatic learning from patterns\n- DoR/DoD validation with rollback"
  },
  {
    "id": "red_phase_strategy.REDPhaseStrategy",
    "name": "REDPhaseStrategy",
    "module": "red_phase_strategy",
    "method_count": 14,
    "is_abstract": false,
    "docstring": "RED Phase: Generate comprehensive tests that MUST fail.\n\nWorkflow:\n1. Validate DoR (feature defined, no existing tests)\n2. Analyze feature requirements\n3. Extract edge cases (null, empty, boundaries, errors)\n4. Query Tier 2 for domain patterns\n5. Generate test suite (unit + parametrized + property-based)\n6. Run tests (MUST fail - RED validation)\n7. Create git checkpoint\n8. Update documentation\n9. Feed patterns to brain"
  },
  {
    "id": "refactor_phase_strategy.REFACTORPhaseStrategy",
    "name": "REFACTORPhaseStrategy",
    "module": "refactor_phase_strategy",
    "method_count": 19,
    "is_abstract": false,
    "docstring": "REFACTOR Phase: AI-driven code improvement while keeping tests green.\n\nWorkflow:\n1. Validate DoR (tests passing, implementation exists)\n2. Detect code smells (god methods, duplicates, complexity)\n3. Generate refactoring suggestions (AI-driven)\n4. Apply refactorings incrementally\n5. Run tests after each refactoring (keep GREEN)\n6. Validate clean code compliance\n7. Create git checkpoint\n8. Update documentation\n9. Feed patterns to brain"
  },
  {
    "id": "green_phase_strategy.GREENPhaseStrategy",
    "name": "GREENPhaseStrategy",
    "module": "green_phase_strategy",
    "method_count": 16,
    "is_abstract": false,
    "docstring": "GREEN Phase: Minimal implementation to make tests pass.\n\nWorkflow:\n1. Validate DoR (tests exist and failing)\n2. Analyze failing tests\n3. Generate minimal implementation (AI-driven)\n4. Run tests continuously (RED \u2192 GREEN)\n5. Detect over-engineering\n6. Validate clean code compliance\n7. Create git checkpoint\n8. Update documentation\n9. Feed patterns to brain"
  }
  ];
        const links = [
  {
    "source": "Enum",
    "target": "tdd_orchestrator_v4.TDDPhase",
    "type": "inherits"
  },
  {
    "source": "ABC",
    "target": "tdd_orchestrator_v4.TDDPhaseStrategy",
    "type": "inherits"
  },
  {
    "source": "tdd_orchestrator_v4.TDDPhaseStrategy",
    "target": "red_phase_strategy.REDPhaseStrategy",
    "type": "inherits"
  },
  {
    "source": "tdd_orchestrator_v4.TDDPhaseStrategy",
    "target": "refactor_phase_strategy.REFACTORPhaseStrategy",
    "type": "inherits"
  },
  {
    "source": "tdd_orchestrator_v4.TDDPhaseStrategy",
    "target": "green_phase_strategy.GREENPhaseStrategy",
    "type": "inherits"
  }
  ];
        
        const width = document.getElementById('diagram').offsetWidth;
        const height = 800;
        
        const svg = d3.select("#diagram")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // Define arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");
        
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .join("path")
            .attr("class", "link");
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", d => d.is_abstract ? "node abstract" : "node")
            .attr("r", d => 10 + d.method_count * 2)
            .attr("fill", d => d.is_abstract ? "#ff9999" : "#6699ff")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);
        
        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name)
            .attr("text-anchor", "middle")
            .attr("dy", -15);
        
        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });
            
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            tooltip.style("opacity", 1)
                .html(`
                    <strong>${d.name}<\/strong><br/>
                    Module: ${d.module}<br/>
                    Methods: ${d.method_count}<br/>
                    ${d.is_abstract ? "Abstract Class<br/>" : ""}
                    ${d.docstring}
                `)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }
        
        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }
  </style>
</head>
<body>
</body>
</html>
