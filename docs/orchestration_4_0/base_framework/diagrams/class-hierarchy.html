<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Class Hierarchy</title>
<script src="https://d3js.org/d3.v7.8.5.min.js" type="text/javascript">
</script>
<style type="text/css">
      body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #diagram {
            width: 100%;
            height: 800px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .node {
            cursor: pointer;
            stroke: #333;
            stroke-width: 2px;
        }
        .node.abstract {
            stroke-dasharray: 5, 5;
        }
        .link {
            stroke: #999;
            stroke-width: 2px;
            fill: none;
            marker-end: url(#arrow);
        }
        .node-label {
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
  <body>
    <h1>Class Hierarchy<\/h1>
    <div id="diagram"><\/div>
    <div class="tooltip" id="tooltip"><\/div>
    
    <script>
        const nodes = [
  {
    "id": "base_orchestrator.BaseOrchestrator",
    "name": "BaseOrchestrator",
    "module": "base_orchestrator",
    "method_count": 10,
    "is_abstract": true,
    "docstring": "Abstract base class for all CORTEX 4.0 orchestrators.\n\nTemplate Method Pattern:\n1. _setup() - Initialize orchestrator-specific resources\n2. _register_phases() - Define phases for this orchestrator\n3. _execute_phase(phase_name) - Execute a single phase\n4. _teardown() - Cleanup resources\n\nSubclasses must implement these methods."
  },
  {
    "id": "error_handler.ErrorSeverity",
    "name": "ErrorSeverity",
    "module": "error_handler",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Error severity levels"
  },
  {
    "id": "error_handler.RecoveryStrategy",
    "name": "RecoveryStrategy",
    "module": "error_handler",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Error recovery strategies"
  },
  {
    "id": "error_handler.OrchestratorError",
    "name": "OrchestratorError",
    "module": "error_handler",
    "method_count": 1,
    "is_abstract": false,
    "docstring": "Structured error information for orchestrators.\n\nAttributes:\n    phase: Phase where error occurred\n    severity: Error severity level\n    message: Human-readable error message\n    exception: Original exception (if any)\n    traceback: Stack trace\n    recovery_strategy: Recommended recovery action\n    context: Additional context data\n    timestamp: When error occurred"
  },
  {
    "id": "error_handler.ErrorHandler",
    "name": "ErrorHandler",
    "module": "error_handler",
    "method_count": 10,
    "is_abstract": false,
    "docstring": "Centralized error handling for orchestrators.\n\nFeatures:\n- Structured error capture\n- Recovery strategy recommendation\n- Error history tracking\n- Retry logic with exponential backoff\n- User-friendly error messages"
  },
  {
    "id": "phase_manager.PhaseStatus",
    "name": "PhaseStatus",
    "module": "phase_manager",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Phase execution status"
  },
  {
    "id": "phase_manager.Phase",
    "name": "Phase",
    "module": "phase_manager",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Represents a single phase in an orchestrator workflow.\n\nAttributes:\n    name: Phase identifier (e.g., \"analyze\", \"transform\")\n    description: Human-readable phase description\n    required: Whether phase must complete successfully\n    validation: Optional validation function to run before phase\n    cleanup: Optional cleanup function to run after phase"
  },
  {
    "id": "phase_manager.PhaseTransition",
    "name": "PhaseTransition",
    "module": "phase_manager",
    "method_count": 1,
    "is_abstract": false,
    "docstring": "Represents a transition between phases.\n\nAttributes:\n    from_phase: Source phase name\n    to_phase: Target phase name\n    condition: Optional condition function (must return True to transition)\n    timestamp: When transition occurred"
  },
  {
    "id": "phase_manager.PhaseManager",
    "name": "PhaseManager",
    "module": "phase_manager",
    "method_count": 10,
    "is_abstract": false,
    "docstring": "Manages phase execution and transitions for orchestrators.\n\nFeatures:\n- Phase registration and ordering\n- Validation before phase execution\n- State tracking (pending \u2192 in_progress \u2192 completed/failed)\n- Transition history\n- Rollback support"
  }
  ];
        const links = [
  {
    "source": "ABC",
    "target": "base_orchestrator.BaseOrchestrator",
    "type": "inherits"
  },
  {
    "source": "Enum",
    "target": "error_handler.ErrorSeverity",
    "type": "inherits"
  },
  {
    "source": "Enum",
    "target": "error_handler.RecoveryStrategy",
    "type": "inherits"
  },
  {
    "source": "Enum",
    "target": "phase_manager.PhaseStatus",
    "type": "inherits"
  }
  ];
        
        const width = document.getElementById('diagram').offsetWidth;
        const height = 800;
        
        const svg = d3.select("#diagram")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // Define arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");
        
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .join("path")
            .attr("class", "link");
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", d => d.is_abstract ? "node abstract" : "node")
            .attr("r", d => 10 + d.method_count * 2)
            .attr("fill", d => d.is_abstract ? "#ff9999" : "#6699ff")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);
        
        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name)
            .attr("text-anchor", "middle")
            .attr("dy", -15);
        
        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });
            
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            tooltip.style("opacity", 1)
                .html(`
                    <strong>${d.name}<\/strong><br/>
                    Module: ${d.module}<br/>
                    Methods: ${d.method_count}<br/>
                    ${d.is_abstract ? "Abstract Class<br/>" : ""}
                    ${d.docstring}
                `)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }
        
        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }
  </style>
</head>
<body>
</body>
</html>
