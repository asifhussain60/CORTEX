<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Class Hierarchy</title>
<script src="https://d3js.org/d3.v7.8.5.min.js" type="text/javascript">
</script>
<style type="text/css">
      body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #diagram {
            width: 100%;
            height: 800px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .node {
            cursor: pointer;
            stroke: #333;
            stroke-width: 2px;
        }
        .node.abstract {
            stroke-dasharray: 5, 5;
        }
        .link {
            stroke: #999;
            stroke-width: 2px;
            fill: none;
            marker-end: url(#arrow);
        }
        .node-label {
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
  <body>
    <h1>Class Hierarchy<\/h1>
    <div id="diagram"><\/div>
    <div class="tooltip" id="tooltip"><\/div>
    
    <script>
        const nodes = [
  {
    "id": "documentation_orchestrator.DocumentationConfig",
    "name": "DocumentationConfig",
    "module": "documentation_orchestrator",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Configuration for documentation generation"
  },
  {
    "id": "documentation_orchestrator.DocumentationResult",
    "name": "DocumentationResult",
    "module": "documentation_orchestrator",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Results from documentation generation"
  },
  {
    "id": "documentation_orchestrator.DocumentationOrchestrator",
    "name": "DocumentationOrchestrator",
    "module": "documentation_orchestrator",
    "method_count": 19,
    "is_abstract": false,
    "docstring": "Orchestrates comprehensive technical documentation generation\n\nFeatures:\n- AST-based code analysis\n- Type hint extraction\n- API documentation generation\n- Interactive D3.js diagrams\n- Phase flow visualization\n- Class hierarchy diagrams\n\nExample:\n    orchestrator = DocumentationOrchestrator(logger, config)\n    \n    context = {\n        'config': DocumentationConfig(\n            source_paths=[Path(\"src/orchestration_4_0\")],\n            output_dir=Path(\"docs/orchestration\")\n        )\n    }\n    \n    result = orchestrator.execute(context)\n    print(f\"Documented {result['modules_analyzed']} modules\")"
  },
  {
    "id": "api_doc_generator.APIDocGenerator",
    "name": "APIDocGenerator",
    "module": "api_doc_generator",
    "method_count": 10,
    "is_abstract": false,
    "docstring": "Generates comprehensive API documentation in Markdown format\n\nCreates documentation with:\n- Table of contents\n- Module overview\n- Class documentation\n- Method signatures with type hints\n- Parameter descriptions\n- Return value documentation\n- Usage examples"
  },
  {
    "id": "diagram_generator.DiagramGenerator",
    "name": "DiagramGenerator",
    "module": "diagram_generator",
    "method_count": 7,
    "is_abstract": false,
    "docstring": "Generates D3.js-based interactive diagrams for documentation\n\nOutput is HTML with embedded D3.js visualization code.\nDiagrams are fully interactive with zoom, pan, and hover tooltips."
  },
  {
    "id": "type_extractor.TypeExtractor",
    "name": "TypeExtractor",
    "module": "type_extractor",
    "method_count": 9,
    "is_abstract": false,
    "docstring": "Extracts and formats type information from Python code\n\nHandles:\n- Basic types (int, str, bool, etc.)\n- Generic types (List[int], Dict[str, Any], etc.)\n- Optional types (Optional[str], Union[str, None])\n- Custom class types\n- Type aliases"
  },
  {
    "id": "code_analyzer.MethodInfo",
    "name": "MethodInfo",
    "module": "code_analyzer",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Information about a class method"
  },
  {
    "id": "code_analyzer.ClassInfo",
    "name": "ClassInfo",
    "module": "code_analyzer",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Information about a class"
  },
  {
    "id": "code_analyzer.FunctionInfo",
    "name": "FunctionInfo",
    "module": "code_analyzer",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Information about a standalone function"
  },
  {
    "id": "code_analyzer.ModuleInfo",
    "name": "ModuleInfo",
    "module": "code_analyzer",
    "method_count": 0,
    "is_abstract": false,
    "docstring": "Information about a Python module"
  },
  {
    "id": "code_analyzer.CodeAnalyzer",
    "name": "CodeAnalyzer",
    "module": "code_analyzer",
    "method_count": 9,
    "is_abstract": false,
    "docstring": "Analyzes Python code using AST to extract structural information\n\nExample:\n    analyzer = CodeAnalyzer()\n    module_info = analyzer.analyze_file(Path(\"my_module.py\"))\n    \n    # Access extracted information\n    for cls in module_info.classes:\n        print(f\"Class: {cls.name}\")\n        for method in cls.methods:\n            print(f\"  Method: {method.name} - {method.signature}\")"
  }
  ];
        const links = [
  {
    "source": "BaseOrchestrator",
    "target": "documentation_orchestrator.DocumentationOrchestrator",
    "type": "inherits"
  }
  ];
        
        const width = document.getElementById('diagram').offsetWidth;
        const height = 800;
        
        const svg = d3.select("#diagram")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // Define arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");
        
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .join("path")
            .attr("class", "link");
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", d => d.is_abstract ? "node abstract" : "node")
            .attr("r", d => 10 + d.method_count * 2)
            .attr("fill", d => d.is_abstract ? "#ff9999" : "#6699ff")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("mouseover", showTooltip)
            .on("mouseout", hideTooltip);
        
        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name)
            .attr("text-anchor", "middle")
            .attr("dy", -15);
        
        simulation.on("tick", () => {
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            });
            
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            tooltip.style("opacity", 1)
                .html(`
                    <strong>${d.name}<\/strong><br/>
                    Module: ${d.module}<br/>
                    Methods: ${d.method_count}<br/>
                    ${d.is_abstract ? "Abstract Class<br/>" : ""}
                    ${d.docstring}
                `)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }
        
        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }
  </style>
</head>
<body>
</body>
</html>
