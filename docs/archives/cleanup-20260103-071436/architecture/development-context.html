<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Development Context - CORTEX Architecture</title>
    <link href="../assets/images/CORTEX-logo.png" rel="icon" type="image/png">
    <link href="../assets/css/variables.css" rel="stylesheet">
    <link href="../assets/css/main.css" rel="stylesheet">
    <link href="../assets/css/glass-patterns.css" rel="stylesheet">
    <link href="../assets/css/micro-interactions.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2a2f4a 100%); min-height: 100vh; }
        .architecture-page { max-width: 1400px; margin: 0 auto; padding: var(--spacing-2xl) var(--spacing-lg); }
        .breadcrumb { display: flex; align-items: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-xl); font-size: var(--font-sm); color: var(--text-muted); }
        .breadcrumb a { color: var(--accent-primary); text-decoration: none; transition: color 0.2s ease; }
        .breadcrumb-separator { color: var(--text-muted); }
        .page-header { text-align: center; margin-bottom: var(--spacing-3xl); }
        .page-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: var(--spacing-md); }
        .page-subtitle { color: var(--text-secondary); font-size: var(--font-lg); max-width: 800px; margin: 0 auto; }
        .viz-container { background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); border-radius: var(--radius-xl); border: 1px solid var(--border-primary); padding: var(--spacing-2xl); margin-bottom: var(--spacing-2xl); box-shadow: var(--glass-shadow); }
        #dev-context-viz { width: 100%; height: 600px; }
        .nav-footer { display: flex; justify-content: center; margin-top: var(--spacing-3xl); }
        .nav-link { padding: var(--spacing-md) var(--spacing-xl); background: var(--glass-bg); border: 1px solid var(--border-primary); border-radius: var(--radius-md); color: var(--text-primary); text-decoration: none; transition: all 0.2s ease; }
        .nav-link:hover { background: rgba(0, 212, 255, 0.1); border-color: var(--accent-primary); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="architecture-page">
        <nav class="breadcrumb">
            <a href="../index.html">Home</a>
            <span class="breadcrumb-separator">/</span>
            <a href="index.html">Architecture</a>
            <span class="breadcrumb-separator">/</span>
            <span>Development Context</span>
        </nav>
        <header class="page-header">
            <h1 class="page-title">🔧 Development Context</h1>
            <p class="page-subtitle">Hierarchical tree of 40+ context categories across 8 domains enabling dynamic project understanding and codebase adaptation</p>
        </header>
        <div class="viz-container">
            <div id="dev-context-viz"></div>
        </div>
        <nav class="nav-footer">
            <a href="index.html" class="nav-link">← Back to Architecture</a>
        </nav>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const width = document.getElementById('dev-context-viz').clientWidth;
            const height = 600;
            const data = { name: 'Dev Context', children: [
                { name: 'Project', children: [{ name: 'Structure' }, { name: 'Dependencies' }, { name: 'Config' }] },
                { name: 'Code', children: [{ name: 'Modules' }, { name: 'Classes' }, { name: 'Functions' }] },
                { name: 'Tests', children: [{ name: 'Unit' }, { name: 'Integration' }, { name: 'E2E' }] },
                { name: 'Build', children: [{ name: 'Scripts' }, { name: 'Tasks' }, { name: 'Pipelines' }] },
                { name: 'Deploy', children: [{ name: 'Envs' }, { name: 'Configs' }, { name: 'Secrets' }] },
                { name: 'Docs', children: [{ name: 'API' }, { name: 'Guides' }, { name: 'Examples' }] },
                { name: 'Tools', children: [{ name: 'IDE' }, { name: 'Linters' }, { name: 'Formatters' }] },
                { name: 'Patterns', children: [{ name: 'Design' }, { name: 'Architectural' }, { name: 'Coding' }] }
            ]};
            const root = d3.hierarchy(data);
            const treeLayout = d3.tree().size([height - 100, width - 200]);
            treeLayout(root);
            const svg = d3.select('#dev-context-viz').append('svg').attr('width', width).attr('height', height).append('g').attr('transform', 'translate(100, 50)');
            svg.selectAll('.link').data(root.links()).join('path').attr('class', 'link').attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x)).attr('fill', 'none').attr('stroke', 'rgba(0, 212, 255, 0.4)').attr('stroke-width', 2);
            const nodes = svg.selectAll('.node').data(root.descendants()).join('g').attr('class', 'node').attr('transform', d => `translate(${d.y}, ${d.x})`);
            nodes.append('circle').attr('r', 6).attr('fill', d => d.children ? '#00d4ff' : '#8b5cf6').attr('stroke', '#fff').attr('stroke-width', 2).on('mouseover', function() { d3.select(this).transition().duration(200).attr('opacity', 1).attr('r', 8); }).on('mouseout', function() { d3.select(this).transition().duration(200).attr('opacity', 0.8).attr('r', 6); });
            nodes.append('text').attr('dy', '0.31em').attr('x', d => d.children ? -10 : 10).attr('text-anchor', d => d.children ? 'end' : 'start').text(d => d.data.name).attr('fill', '#ffffff').attr('font-size', '12px');
        });
    </script>
</body>
</html>
