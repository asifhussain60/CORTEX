<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Awakening of CORTEX</title>
    
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/story.css">
    
    <style>
        /* Simplified Story Layout - Inline for speed */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            font-size: 16px;
        }
        
        .story-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Left Sidebar - Fixed Navigation */
        .story-sidebar {
            width: 250px;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            background: rgba(15, 20, 40, 0.95);
            border-right: 1px solid rgba(150, 130, 255, 0.3);
            padding: 2rem 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }
        
        .sidebar-header {
            margin-bottom: 2rem;
        }
        
        .sidebar-logo {
            width: 150px;
            height: auto;
            margin-bottom: 1rem;
            display: block;
        }
        
        .sidebar-title {
            font-size: 2.0rem;
            font-weight: 700;
            color: #00d4ff;
            margin: 0 0 0.25rem 0;
            text-align: center;
        }
        
        .sidebar-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
        }
        
        .home-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            color: #00d4ff;
            text-decoration: none;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: rgba(0, 212, 255, 0.05);
        }
        
        .home-link:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
            transform: translateX(-2px);
        }
        
        .home-link::before {
            content: '← ';
        }
        
        .chapter-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .chapter-nav li {
            margin-bottom: 0.5rem;
        }
        
        .chapter-nav a {
            display: block;
            padding: 0.6rem 0.8rem;
            color: #b0b0b0;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1.25rem;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        
        .chapter-nav a:hover {
            background: rgba(150, 130, 255, 0.15);
            color: #00d4ff;
            border-left-color: #00d4ff;
        }
        
        /* Main Content Area */
        .story-main {
            margin-left: 250px;
            flex: 1;
            padding: 3rem;
            width: 100%;
            box-sizing: border-box;
        }
        
        .story-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Chapter Title */
        .chapter-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
            margin: 0 0 2rem 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(150, 130, 255, 0.4);
        }
        
        /* Story Text */
        .story-text p {
            margin: 1.5rem 0;
            font-size: 1.3rem !important;
            line-height: 1.8;
        }
        
        /* Chapter Navigation */
        .chapter-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(150, 130, 255, 0.3);
        }
        
        .chapter-nav-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(150, 130, 255, 0.15);
            border: 1px solid rgba(150, 130, 255, 0.4);
            border-radius: 8px;
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .chapter-nav-btn:hover {
            background: rgba(150, 130, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .nav-arrow {
            font-size: 1.5rem;
        }
        
        .nav-direction {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
        }
        
        .nav-title {
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .spacer {
            flex: 1;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .story-sidebar {
                width: 200px;
            }
            
            .story-main {
                margin-left: 200px;
                padding: 2rem 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .story-sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
            }
            
            .story-main {
                margin-left: 0;
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="story-container">
        <!-- Left Sidebar -->
        <aside class="story-sidebar">
            <div class="sidebar-header">
                <a href="../index.html">
                    <img src="../assets/images/CORTEX-logo.png" alt="CORTEX" class="sidebar-logo">
                </a>
                <h1 class="sidebar-title">The Awakening</h1>
                <p class="sidebar-subtitle">By Mr. Codenstein</p>
                <a href="../index.html" class="home-link">Back to Home</a>
            </div>
            
            <nav>
                <ul class="chapter-nav">
                    <li><a href="index.html">Prologue</a></li>
                    <li><a href="chapter-chapter1.html">1. Goldfish Theory</a></li>
                    <li><a href="chapter-chapter2.html">2. Brain Protector</a></li>
                    <li><a href="chapter-chapter3.html">3. SQLite</a></li>
                    <li><a href="chapter-chapter4.html">4. Agent Uprising</a></li>
                    <li><a href="chapter-chapter5.html">5. Knowledge Graph</a></li>
                    <li><a href="chapter-chapter6.html">6. Token Crisis</a></li>
                    <li><a href="chapter-chapter7.html">7. Hebb's Law</a></li>
                    <li><a href="chapter-chapter8.html">8. Templates</a></li>
                    <li><a href="chapter-chapter9.html">9. Cross-Platform</a></li>
                    <li><a href="chapter-chapter10.html">10. Awakening</a></li>
                    <li><a href="chapter-chapter11.html">11. Revolution</a></li>
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="story-main">
            <div class="story-content">
                {{STORY_CHAPTERS}}
            </div>
        </main>
    </div>
</body>
</html>
