<!DOCTYPE html>
<html lang="en">
<head>
<style>
/* Mobile font optimization */
html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
}
</style>
<style>
/* Touch target optimization */
a, button, [role="button"] {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
</style>
<style>
/* Mobile touch optimization */
button, a, input, select, textarea, [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Orchestrators...</title>
    <meta http-equiv="refresh" content="0; url=../orchestrators/index.html">
    <link rel="canonical" href="../orchestrators/index.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e2e8f0;
            text-align: center;
            padding: 2rem;
        }
        .story-credits {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }
        .spin-glass {
            margin: 1.5rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
<style>
        /* REFERENCE Theme - Level 2 */
        .level2-reference {
            --theme-primary: #00bfff;
            --theme-accent: #7c7cff;
            --theme-success: #00ff88;
            --theme-warning: #ffd700;
            --theme-glow: rgba(0, 191, 255, 0.25);
            
            /* Apply to glass effects */
            --glass-border-color: #00bfff33;
            --pulse-glow-color: rgba(0, 191, 255, 0.25);
        }
        
        /* Themed glass cards */
        .level2-reference .glass-card-clickable:hover {
            border-color: #00bfff66;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37),
                        0 0 30px rgba(0, 191, 255, 0.25);
        }
        
        /* Themed icons */
        .level2-reference .pulse-glow-glass--fast {
            filter: drop-shadow(0 0 10px rgba(0, 191, 255, 0.25));
        }
        
        /* Themed metric tiles */
        .level2-reference .token-metric-tile {
            border-color: #00bfff33;
        }
        
        .level2-reference .token-metric-tile:hover {
            border-color: #00bfff66;
            background: #00bfff11;
        }
</style>
</head>
<body>
    <div class="story-credits">
        <h1>🎭 Redirecting...</h1>
        <p>The Orchestrators page has moved to a new location for better organization.</p>
        <div class="spin-glass"></div>
        <p class="level2-text-xs">If you're not redirected automatically, click below:</p>
        <a href="../orchestrators/index.html">Go to Orchestrators →</a>
    </div>
    
    <script>
        // Fallback redirect after 1 second
        setTimeout(function() {
            window.location.href = '../orchestrators/index.html';
        }, 1000);
    </script>
</body>
</html>
