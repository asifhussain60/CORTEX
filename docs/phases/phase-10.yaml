phase:
  id: "PHASE-10-ADAPTIVE-EXECUTION"
  title: "Adaptive Execution Framework"
  description: |
    Enable intelligent orchestrator selection and routing based on:
    - Execution context analysis
    - Task complexity assessment
    - Resource availability
    - Historical performance data
  
  order: 10
  status: "IN_PROGRESS"
  locked: false
  
  requires: "PHASE-09-GOVERNANCE-TOOLS"
  required_for: "PHASE-13-OBSERVABILITY-MATURITY"
  blocking: false
  
  estimated_hours: 20
  estimated_days: 2.5
  
  ac_ids: 5
  completed_ac_ids: 4
  progress_percentage: 80.0

acceptance_criteria:
  - ac_id: "EX-001-01"
    title: "Execution Context Analyzer"
    description: "Analyze execution context: complexity, resources, capabilities"
    status: "COMPLETED"
    acceptance_tests:
      - "Context analysis extracts task complexity"
      - "Resource requirements estimated"
      - "Required capabilities identified"
    git_checkpoint: "EX-001-01-context-analyzer"
    
  - ac_id: "EX-001-02"
    title: "Orchestrator Selection & Routing Engine"
    description: "Route tasks to appropriate orchestrators based on context"
    status: "COMPLETED"
    acceptance_tests:
      - "Routing considers task type and complexity"
      - "Multiple orchestrators can be selected for composition"
      - "Routing decisions logged for analysis"
    git_checkpoint: "EX-001-02-routing"
    
  - ac_id: "EX-002-01"
    title: "Adaptive Execution Modes"
    description: "Implement FAST/BALANCED/THOROUGH execution modes"
    status: "COMPLETED"
    acceptance_tests:
      - "FAST mode minimizes overhead"
      - "BALANCED mode optimizes for common cases"
      - "THOROUGH mode maximizes validation"
    git_checkpoint: "EX-002-01-execution-modes"
    
  - ac_id: "EX-002-02"
    title: "Performance Optimization & Caching"
    description: "Cache execution results and optimize repeated operations"
    status: "COMPLETED"
    acceptance_tests:
      - "Results cached with TTL"
      - "Cache invalidation on relevant changes"
      - "Performance improvement measurable"
    git_checkpoint: "EX-002-02-caching"
    
  - ac_id: "EX-003-01"
    title: "Orchestrator Performance Profiling"
    description: "Profile orchestrator execution for optimization"
    status: "NOT_STARTED"
    acceptance_tests:
      - "Execution time tracked per orchestrator"
      - "Bottlenecks identifiable from profiles"
      - "Historical trends available"
    git_checkpoint: "EX-003-01-profiling"

