    implementation_details: |
      Comprehension Loop Flow:
      ```
      ┌──────────────────────────────────────────────────────────────┐
      │                    COMPREHENSION LOOP                        │
      │                                                              │
      │   ┌─────────────┐     ┌─────────────┐     ┌─────────────┐   │
      │   │ Knowledge   │ ──▶ │ YAML        │ ──▶ │ User        │   │
      │   │ Graph       │     │ Condenser   │     │ Review      │   │
      │   └─────────────┘     └─────────────┘     └──────┬──────┘   │
      │                                                   │          │
      │         ┌────────────────────────────────────────┤          │
      │         │                                        │          │
      │         ▼                                        ▼          │
      │   ┌─────────────┐                         ┌─────────────┐   │
      │   │ REFINE      │ ◀── Request Changes ◀── │ APPROVE     │   │
      │   │ (Loop Back) │                         │ (Exit Loop) │   │
      │   └─────────────┘                         └──────┬──────┘   │
      │                                                   │          │
      └───────────────────────────────────────────────────┼──────────┘
                                                          ▼
                                              ┌─────────────────────┐
                                              │ Brain Tier Push     │
                                              │  ├─ tier0: governance│
                                              │  ├─ tier1: AC mapping│
                                              │  ├─ tier2: standards │
                                              │  └─ tier3: knowledge │
                                              └─────────────────────┘
                                                          │
                                                          ▼
                                              ┌─────────────────────┐
                                              │ Cleanup Temp YAMLs  │
                                              └─────────────────────┘
      ```
      
