      Knowledge Graph Structure:
      ```python
      @dataclass
      class KnowledgeGraph:
          nodes: Dict[str, GraphNode]  # id -> node
          edges: List[GraphEdge]  # relationships
          metadata: GraphMetadata  # timestamps, sources
          
      @dataclass
      class GraphNode:
          id: str
          type: NodeType  # FILE, FUNCTION, CLASS, API, TABLE, etc.
          name: str
          source: str  # Which lens discovered it
          properties: Dict[str, Any]
          
      @dataclass
      class GraphEdge:
          source_id: str
          target_id: str
          relationship: RelationType  # CALLS, IMPORTS, REFERENCES, etc.
          weight: float  # Strength of relationship
      ```
      
