  # ---------------------------------------------------------------------------
  # IR-005: Intent-Based Orchestrator Routing
  # ---------------------------------------------------------------------------
  - ac_id: "IR-005-01"
    title: "Three-Stage Master Orchestrator Architecture"
    description: |
      Master Orchestrator operates in three stages:
      Stage 1: Intent Comprehension (InteractionOrchestrator as preprocessor)
      Stage 2: Intent-Based Routing (delegate to specialized orchestrators)
      Stage 3: Knowledge Integration (company overrides merged)
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Master orchestrator ALWAYS starts with Stage 1 (Comprehension)"
      - "InteractionOrchestrator is the FIRST-STAGE PREPROCESSOR (not default)"
      - "Stage 1 produces approved comprehension YAML before routing"
      - "Stage 2 routes based on canonicalized intent type"
      - "Stage 3 loads and merges knowledge context before execution"
      - "All three stages are audited"
    
    implementation_details: |
      Three-Stage Architecture:
      ```
      ┌─────────────────────────────────────────────────────────────────┐
      │                    MASTER ORCHESTRATOR                          │
      │                                                                 │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 1: INTENT COMPREHENSION                             ║ │
      │  ║   InteractionOrchestrator as Preprocessor                 ║ │
      │  ║                                                           ║ │
      │  ║   1. CORTEX LENS gathers context (knowledge graph)        ║ │
      │  ║   2. Holistic analysis of all sources                     ║ │
      │  ║   3. YAML condensation of understanding                   ║ │
      │  ║   4. User review loop until approval                      ║ │
      │  ║   5. Output: Approved Comprehension YAML                  ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                            │                                   │
      │                            ▼                                   │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 2: INTENT-BASED ROUTING                             ║ │
      │  ║                                                           ║ │
      │  ║   Intent Type → Target Orchestrator:                      ║ │
      │  ║   ─────────────────────────────────────                   ║ │
      │  ║   • planning, ado_work  → PlanningOrchestrator            ║ │
      │  ║   • code, implement,                                      ║ │
      │  ║     fix, refactor       → TDDOrchestrator                 ║ │
      │  ║   • query, status       → Direct Response (no delegation) ║ │
      │  ║   • analyze, review     → AnalysisOrchestrator            ║ │
      │  ║   • UNCLEAR/LOW_CONF    → Back to Stage 1 (clarification) ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                            │                                   │
      │                            ▼                                   │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 3: KNOWLEDGE INTEGRATION (Parallel with Stage 2)    ║ │
      │  ║                                                           ║ │
      │  ║   1. Load company domain YAMLs from cortex-brain/         ║ │
      │  ║   2. Load CORTEX rules from tier0/governance/             ║ │
      │  ║   3. MERGE: Company OVERRIDES CORTEX                      ║ │
      │  ║   4. Pass merged context to target orchestrator           ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                                                                 │
      └─────────────────────────────────────────────────────────────────┘
      ```
      
      Why This Architecture (Not "Interaction as Default"):
      - Avoids circular delegation (Master → Interaction → Master)
      - Clear separation: Comprehension vs Routing vs Execution
      - Interaction is a STAGE, not a fallback
      - Every request gets comprehension (no exceptions)
      - Routing happens AFTER understanding is confirmed
      
      Files to Create/Update:
      - src/orchestrators/master_orchestrator.py (major update)
      - src/orchestrators/stages/comprehension_stage.py
      - src/orchestrators/stages/routing_stage.py
      - src/orchestrators/stages/knowledge_stage.py
      - src/orchestrators/routing/intent_router.py
    
    verification_method: |
      Tests in tests/integration/test_three_stage_master.py:
      - TestStage1Comprehension: Always executes first
      - TestStage2Routing: Correct orchestrator selection
      - TestStage3Knowledge: Override merging
      - TestStageSequencing: Proper order enforcement
      - TestAuditTrail: All stages logged
    
    git_checkpoint: "IR-005-01-three-stage-master"

  - ac_id: "IR-005-02"
    title: "TDD Orchestrator Routing for Code Work"
    description: |
      All code-related work (implement, fix, refactor) MUST be routed 
      to TDDOrchestrator. No exceptions. TDD receives merged context 
      from Stage 3.
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Intent types [IMPLEMENT, FIX, REFACTOR, CODE] route to TDDOrchestrator"
      - "TDDOrchestrator receives comprehension YAML from Stage 1"
      - "TDDOrchestrator receives merged knowledge from Stage 3"
      - "TDD flow enforced: Test First → Implement → Verify"
      - "No code changes without TDD (governance enforced)"
      - "Routing decision audited with intent classification"
    
    implementation_details: |
      TDD Routing Logic:
      ```python
      CODE_INTENTS = {
          IntentType.IMPLEMENT,
          IntentType.FIX,
          IntentType.REFACTOR,
          IntentType.CODE,
          IntentType.TEST,
          IntentType.DEBUG,
      }
      
      def route_to_orchestrator(intent: CanonicalIntent) -> Orchestrator:
          if intent.type in CODE_INTENTS:
              return TDDOrchestrator(
                  comprehension=intent.comprehension_yaml,
                  knowledge_context=intent.merged_knowledge
              )
          elif intent.type in {IntentType.PLANNING, IntentType.ADO_WORK}:
              return PlanningOrchestrator(...)
          elif intent.type in {IntentType.QUERY, IntentType.STATUS}:
              return DirectResponse(...)  # No delegation needed
          else:
              # Low confidence or unclear
              return Stage1Comprehension(request_clarification=True)
      ```
      
      TDDOrchestrator Flow:
      ```
      Comprehension YAML + Merged Knowledge
                    │
                    ▼
      ┌─────────────────────────────────────┐
      │ TDDOrchestrator                     │
      │                                     │
      │   1. Extract test requirements      │
      │   2. Generate test cases FIRST      │
      │   3. Run tests (expect failure)     │
      │   4. Implement minimal solution     │
      │   5. Run tests (expect pass)        │
      │   6. Refactor if needed             │
      │   7. Final test verification        │
      └─────────────────────────────────────┘
      ```
      
      Files to Update:
      - src/orchestrators/routing/intent_router.py
      - src/orchestrators/tdd_orchestrator.py (receive merged context)
    
    verification_method: |
      Tests in tests/integration/test_tdd_routing.py:
      - TestCodeIntentRouting: All code intents → TDD
      - TestTDDContextInjection: Comprehension + knowledge passed
      - TestTDDFlowEnforcement: Test-first verified
      - TestNoBypass: Cannot skip TDD for code work
    
    git_checkpoint: "IR-005-02-tdd-routing"

