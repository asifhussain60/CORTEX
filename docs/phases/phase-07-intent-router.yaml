# =============================================================================
# GOVERNANCE RULES
# =============================================================================

governance:
  tier0_rules:
    - "CORE-008: TDD required for all implementations"
    - "CORE-011: Type hints on all functions"
    - "CORE-012: Docstrings on all public APIs"
    - "CORE-026: Git checkpoint before major action"
    - "CORE-027: Audit entry for AC lifecycle"
  
  tier1_rules:
    - "INT-RULE-001: Context Preservation"
    - "INT-RULE-003: Decision Capture & Rationale"
  
  domain_rules:
    - "interaction-rules.yaml: Interaction orchestrator governance"
  
  # =========================================================================
  # NEW: MANDATORY AUTO-CHALLENGE GOVERNANCE RULE (INT-RULE-009)
  # =========================================================================
  auto_challenge_rule:
    rule_id: "INT-RULE-009"
    title: "Mandatory Intelligent Challenge"
    enforcement: "STRICT"
    tier: "tier0"  # Core governance - cannot be disabled
    
    description: |
      Every user request processed by InteractionOrchestrator MUST be 
      intelligently challenged BEFORE execution. User should NOT need 
      to ask to be challenged - it happens automatically as part of
      the comprehension stage.
    
    rationale: |
      Proactive challenge prevents:
      - Breaking changes that slip through
      - Test coverage degradation
      - Governance violations
      - Repeated mistakes from historical patterns
      - Scope creep and misunderstood intent
      
      This embodies CORTEX's "challenge-first" philosophy where the system
      acts as an intelligent reviewer, not just an executor.
    
    requirements:
      - "Every request receives at least ONE challenge or recommendation"
      - "Challenges based on MERGED knowledge (CORTEX + Company)"
      - "Challenge includes: potential issues, edge cases, alternatives"
      - "If no genuine challenges found, provide optimization recommendations"
      - "Challenge confidence score included (skip individual challenge if < 0.3)"
      - "User can dismiss challenges but dismissal is LOGGED for learning"
      - "Fast-track mode for trivial requests (query, status) - lighter challenge"
      - "Challenges presented IN comprehension YAML (single review point)"
    
    challenge_categories:
      - category: "BREAKING_CHANGE"
        trigger: "Proposed change affects dependencies or consumers"
        severity_default: "HIGH"
        required: true
        
      - category: "TEST_GAP"
        trigger: "Insufficient test coverage for affected code"
        severity_default: "MEDIUM"
        required: true
        
      - category: "GOVERNANCE_CONFLICT"
        trigger: "Request may violate merged CORTEX+Company ruleset"
        severity_default: "HIGH"
        required: true
        
      - category: "HISTORICAL_ISSUE"
        trigger: "Similar code/pattern caused issues before (git history)"
        severity_default: "MEDIUM"
        required: true
        
      - category: "PERFORMANCE_RISK"
        trigger: "Scalability or efficiency concerns detected"
        severity_default: "LOW"
        required: false  # Advisory
        
      - category: "SECURITY_RISK"
        trigger: "Potential vulnerability or data exposure"
        severity_default: "CRITICAL"
        required: true
        
      - category: "ALTERNATIVE_APPROACH"
        trigger: "Better solution exists in knowledge base"
        severity_default: "LOW"
        required: false  # Advisory
        
      - category: "SCOPE_CREEP"
        trigger: "Request implies work beyond stated intent"
        severity_default: "MEDIUM"
        required: true
    
    implementation:
      file: "src/core/intent/auto_challenger.py"
      class: "AutoChallenger"
      method: "generate_challenges(intent, merged_rules, holistic_context)"
      
      integration_point: |
        InteractionOrchestrator.comprehend() calls AutoChallenger BEFORE
        generating comprehension YAML. Challenges are embedded in YAML.
      
      flow_diagram: |
        ┌─────────────────────────────────────────────────────────────┐
        │ EVERY REQUEST → InteractionOrchestrator.comprehend()       │
        │                                                             │
        │  1. Load MERGED_RULES (additive merge - happens first)     │
        │  2. Build holistic context (CORTEX LENS knowledge graph)   │
        │  3. ★ AUTO-CHALLENGE (INT-RULE-009 - mandatory)            │
        │     │                                                       │
        │     ├─ AutoChallenger.generate_challenges()                │
        │     │   ├─ Analyze intent against merged rules             │
        │     │   ├─ Check git history for similar patterns          │
        │     │   ├─ Detect breaking changes via dependency graph    │
        │     │   ├─ Calculate test coverage impact                  │
        │     │   ├─ Find alternatives in knowledge base             │
        │     │   └─ Score each challenge (confidence >= 0.3)        │
        │     │                                                       │
        │     └─ Output: ChallengeSet (min 1 item guaranteed)        │
        │                                                             │
        │  4. Generate comprehension YAML WITH embedded challenges   │
        │  5. Present to user (single review point)                  │
        │  6. User approves/refines (can dismiss challenges)         │
        │  7. Log dismissals → feed back to learning system          │
        │  8. Proceed to Stage 2 (Routing)                           │
        └─────────────────────────────────────────────────────────────┘
      
      challenge_yaml_structure: |
        ```yaml
        comprehension:
          session_id: "uuid"
          timestamp: "2026-01-15T10:30:00Z"
          
          intent_understanding:
            primary_intent: "IMPLEMENT"
            scope: ["src/api/users.py"]
            confidence: 0.92
          
          # ... other comprehension fields ...
          
          # ========================================
          # AUTO-CHALLENGES (INT-RULE-009)
          # ========================================
          auto_challenges:
            rule_applied: "INT-RULE-009"
            challenge_count: 3
            knowledge_source: "MERGED (CORTEX + COMPANY)"
            
            challenges:
              - id: "CHG-001"
                category: "BREAKING_CHANGE"
                severity: "HIGH"
                confidence: 0.87
                title: "API change affects 3 downstream consumers"
                description: |
                  The proposed change to UserController.get_user() 
                  modifies the response schema. 3 services depend on
                  current schema: billing-service, notification-service,
                  analytics-service.
                evidence:
                  - "API call graph shows 3 consumers"
                  - "git log: billing-service integrated 2024-06-15"
                mitigation: |
                  Consider API versioning (v2) to avoid breaking consumers.
                action_required: true
                user_dismissed: false
                
              - id: "CHG-002"
                category: "TEST_GAP"
                severity: "MEDIUM"
                confidence: 0.92
                title: "Coverage drops below 80% threshold"
                description: |
                  Current: 85%, After changes: ~72%
                  CORTEX-TEST-001 requires >= 80%
                evidence:
                  - "coverage report: 85% current"
                  - "3 new code paths uncovered"
                mitigation: |
                  Add tests for error handling, empty list edge case.
                action_required: true
                user_dismissed: false
                
              - id: "CHG-003"
                category: "ALTERNATIVE_APPROACH"
                severity: "LOW"
                confidence: 0.65
                title: "Repository pattern recommended"
                description: |
                  Knowledge base shows Repository pattern improves
                  testability for data access code.
                evidence:
                  - "tier3/patterns/repository.yaml"
                mitigation: |
                  Extract to UserRepository class (optional).
                action_required: false  # Advisory
                user_dismissed: false
            
            dismissal_log: []  # Populated when user dismisses
            
          approval_status: "PENDING"
        ```
    
    dismissal_learning:
      description: |
        When user dismisses a challenge, log it for pattern analysis.
        If same challenge TYPE dismissed > 5 times consecutively,
        flag as potential false positive for review.
      
      log_structure: |
        ```yaml
        dismissal:
          challenge_id: "CHG-001"
          category: "BREAKING_CHANGE"
          timestamp: "2026-01-15T10:35:00Z"
          user_reason: "Internal API only, no external consumers"
          consecutive_dismissals_this_type: 2
          flagged_for_review: false
        ```
    
    audit_requirements:
      - "Log ALL generated challenges (even if confidence < threshold)"
      - "Log user dismissals with timestamp and optional reason"
      - "Track dismissal patterns for challenge quality improvement"
      - "Alert if same challenge type dismissed > 5 times (false positive?)"
      - "Monthly report: challenge acceptance rate by category"

