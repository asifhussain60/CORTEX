      - "Request clarification when confidence < threshold"
    
    implementation_details: |
      Intent Types (Extended):
      - IMPLEMENT: Create new functionality
      - FIX: Resolve defect or error
      - REFACTOR: Improve without changing behavior
      - QUERY: Information retrieval
      - ANALYZE: Deep investigation
      - VALIDATE: Verify correctness
      - MIGRATE: Move/transform existing
      
      Canonicalization Process:
      1. Extract keywords and patterns from request
      2. Match against intent type patterns
      3. Use context intelligence to disambiguate
      4. Assign confidence score
      5. If confidence < 0.7, generate clarification prompt
      
