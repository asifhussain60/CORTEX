# PHASE-07-INTENT-ROUTER: Holistic Intent Router Intelligence
# =============================================================================
# Purpose: Master + Interaction Orchestrator pattern from CORTEX5.5
#          Combines AST, git history, code comments, and relationship traversal
#          to build holistic context and reflect user intent with recommendations
# Status: NOT_STARTED
# Requires: PHASE-ENHANCEMENT-03
# Estimated Duration: 8 days (64 hours) - expanded for full intelligence scope
# Origin: CORTEX5.5 LLM Intent Routing Intelligence
# =============================================================================

phase:
  id: "PHASE-07-INTENT-ROUTER"
  title: "Holistic Intent Router Intelligence"
  description: |
    Implement the CORTEX5.5 intelligence pattern where the Master Orchestrator 
    operates through THREE STAGES:
    
    STAGE 1 - INTENT COMPREHENSION (InteractionOrchestrator):
    - Use CORTEX LENS tools to build knowledge graph from multiple sources
    - Condense gathered context into comprehension YAMLs
    - Present to user for approval (repeat until approved)
    - On approval, intelligently push to brain tiers, delete temps
    
    STAGE 2 - INTENT ROUTING:
    - Planning/ADO intent → PlanningOrchestrator/ADOOrchestrator
    - Code/implement/fix intent → TDDOrchestrator
    - Query/status → Direct response
    - Ambiguous → Back to Interaction for clarification (DEFAULT)
    
    STAGE 3 - KNOWLEDGE INTEGRATION:
    - Load company domain specifications from cortex-brain/
    - Load CORTEX rules from tier0/governance/
    - COMPANY OVERRIDES CORTEX (intelligent merge)
    - Pass merged context to execution orchestrator (TDD, etc.)
    
    Vision: Transform ad-hoc user requests into well-understood, validated intents
    with company intelligence seamlessly integrated.
  
  order: 7
  status: "IN_PROGRESS"  # NOT_STARTED | IN_PROGRESS | COMPLETED
  locked: false
  
  # Dependencies
  requires: "PHASE-ENHANCEMENT-03"
  required_for: "PHASE-08-CORE-ORCHESTRATORS"
  can_run_parallel_with: []
  blocking: true  # Blocks downstream phases - defines orchestrator interaction pattern
  
  # Estimation (expanded for comprehensive 14-AC scope)
  estimated_hours: 64
  estimated_days: 8
  actual_hours: 4
  
  # Tracking
  ac_ids: 14  # Full coverage: IR-001 (4) + IR-002 (4) + IR-003 (4) + IR-004 (2)
  completed_ac_ids: 12
  progress_percentage: 85.7
  last_updated: "2026-01-15T19:00:00Z"
  completion_status: "LENS Protocol complete (IR-003), awaiting Intent Router (IR-004)"
  
  # CORTEX5.5 Reference
  origin:
    branch: "CORTEX-5.5"
    evidence:
      - "feat: Add orchestration enhancements with LLM intent routing and pre-flight orchestrator"
      - "feat(maintenance): Complete Phase 10 & 11 - LLM intent routing enhancements"
      - "feat: Discovery orchestrator with dependency intelligence and multi-language AST parsing"
    pattern: "Master orchestrator delegates to Interaction orchestrator for context building"

# =============================================================================
# ARCHITECTURE: THREE-STAGE MASTER ORCHESTRATOR
# =============================================================================
#
#   User Request
#        │
#        ▼
#   ┌─────────────────────────────────────────────────────────────────┐
#   │                    MASTER ORCHESTRATOR                          │
#   │  ┌──────────────────────────────────────────────────────────┐  │
#   │  │  STAGE 1: INTENT COMPREHENSION (InteractionOrchestrator) │  │
#   │  │  • CORTEX LENS context gathering                         │  │
#   │  │  • Multi-source knowledge graph                          │  │
#   │  │  • YAML condensation loop                                │  │
#   │  │  • User approval gate                                    │  │
#   │  └──────────────────────────────────────────────────────────┘  │
#   │                          │                                      │
#   │                          ▼                                      │
#   │  ┌──────────────────────────────────────────────────────────┐  │
#   │  │  STAGE 2: INTENT ROUTING (Based on approved YAML)        │  │
#   │  │  • planning/ado → PlanningOrchestrator/ADOOrchestrator   │  │
#   │  │  • code/implement/fix → TDDOrchestrator                  │  │
#   │  │  • query/status → Direct response                        │  │
#   │  │  • DEFAULT → Back to Interaction for clarification       │  │
#   │  └──────────────────────────────────────────────────────────┘  │
#   │                          │                                      │
#   │                          ▼                                      │
#   │  ┌──────────────────────────────────────────────────────────┐  │
#   │  │  STAGE 3: KNOWLEDGE INTEGRATION (Parallel)               │  │
#   │  │  • Load company domain YAMLs from cortex-brain/          │  │
#   │  │  • Load CORTEX rules from tier0/governance/              │  │
#   │  │  • COMPANY OVERRIDES CORTEX (intelligent merge)          │  │
#   │  │  • TDD receives merged context                           │  │
#   │  └──────────────────────────────────────────────────────────┘  │
#   └─────────────────────────────────────────────────────────────────┘
#
# =============================================================================

