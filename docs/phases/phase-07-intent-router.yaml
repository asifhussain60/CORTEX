  - ac_id: "IR-006-02"
    title: "Additive Merge with Selective Override & Priority Protection"
    description: |
      ENHANCED MERGE ALGORITHM: Additive merge with selective override.
      - All non-conflicting CORTEX rules are ALWAYS applied
      - Company overrides ONLY where there's a conflict
      - CRITICAL CORTEX rules cannot be overridden
      - Scope-aware override (partial overrides supported)
      - Merge happens BEFORE comprehension (not after)
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "CORTEX rules loaded as baseline (Set A)"
      - "Company rules loaded for overlay (Set B)"
      - "Non-conflicting CORTEX rules ALWAYS preserved"
      - "Conflicting rules: Company wins UNLESS CORTEX is CRITICAL"
      - "CRITICAL CORTEX rules cannot be overridden by Company"
      - "Scope-aware: partial override respects applies_to boundaries"
      - "Merge happens at START of Stage 1 (before comprehension)"
      - "User sees FINAL merged ruleset in comprehension YAML"
      - "Override audit trail with rationale for each decision"
    
    implementation_details: |
      ADDITIVE MERGE WITH SELECTIVE OVERRIDE
      ======================================
      
      Example:
      ```
      CORTEX (Set A): [A1, A2, A3, A4, A5]  (5 rules)
      COMPANY (Set B): [B2, B4]              (2 overrides)
      
      Result: [A1, B2, A3, B4, A5]  ← 5 rules total!
      NOT:    [B2, B4]              ← WRONG (replacement)
      ```
      
      Priority Levels:
      ```python
      class RulePriority(Enum):
          CRITICAL = 100    # CORTEX: Cannot be overridden (security, compliance)
          MANDATORY = 80    # CORTEX: Can be overridden with warning
          STANDARD = 50     # Normal rules, freely overridable
          ADVISORY = 20     # Suggestions, easily overridable
      ```
      
      Enhanced Merge Algorithm:
      ```python
      def additive_merge_with_selective_override(
          cortex_rules: List[DomainRule],
          company_rules: List[DomainRule]
      ) -> MergedRuleset:
          """
          ADDITIVE merge - keeps ALL non-conflicting rules from BOTH sets.
          SELECTIVE override - Company wins conflicts (except CRITICAL).
          SCOPE-AWARE - partial overrides respect applies_to boundaries.
          """
          merged = MergedRuleset()
          audit = MergeAuditLog()
          
          # Index by (rule_category, applies_to_scope)
          cortex_index = index_by_scope(cortex_rules)
          company_index = index_by_scope(company_rules)
          
          all_scopes = set(cortex_index.keys()) | set(company_index.keys())
          
          for scope in all_scopes:
              cortex_rule = cortex_index.get(scope)
              company_rule = company_index.get(scope)
              
              if cortex_rule and company_rule:
                  # CONFLICT detected
                  if cortex_rule.priority == RulePriority.CRITICAL:
                      # CRITICAL cannot be overridden
                      merged.add(cortex_rule)
                      audit.log(MergeDecision(
                          scope=scope,
                          winner="CORTEX",
                          reason="CRITICAL rule - cannot override",
                          cortex_rule=cortex_rule,
                          company_rule=company_rule,
                          company_rule_rejected=True
                      ))
                  else:
                      # Company wins (selective override)
                      merged.add(company_rule)
                      audit.log(MergeDecision(
                          scope=scope,
                          winner="COMPANY",
                          reason="Company override accepted",
                          cortex_rule=cortex_rule,
                          company_rule=company_rule
                      ))
              elif cortex_rule:
                  # Only CORTEX has rule - ALWAYS include (additive)
                  merged.add(cortex_rule)
                  audit.log(MergeDecision(
                      scope=scope,
                      winner="CORTEX",
                      reason="No company override - CORTEX preserved"
                  ))
              else:
                  # Only Company has rule - include (additive)
                  merged.add(company_rule)
                  audit.log(MergeDecision(
                      scope=scope,
                      winner="COMPANY",
                      reason="New company rule - added to merged set"
                  ))
          
          merged.audit_log = audit
          merged.stats = MergeStats(
              cortex_preserved=audit.count_cortex_preserved(),
              company_overrides=audit.count_company_wins(),
              company_additions=audit.count_company_new(),
              critical_protected=audit.count_critical_protected()
          )
          return merged
      ```
      
      Scope-Aware Override Example:
      ```yaml
      # CORTEX rule (broad scope)
      - rule_id: "CORTEX-TEST-001"
        description: "Test coverage >= 80%"
        applies_to: ["all_code"]
        priority: STANDARD
        
      # Company rule (narrow scope override)
      - rule_id: "COMPANY-TEST-001"
        description: "Test coverage >= 95%"
        applies_to: ["production_code"]  # Narrower!
        priority: STANDARD
      
      # MERGED RESULT:
      # - production_code: 95% (Company override)
      # - non_production_code: 80% (CORTEX still applies!)
      ```
      
      Merge Timing (CRITICAL):
      ```
      ┌─────────────────────────────────────────────────────────┐
      │  ★ MERGE HAPPENS FIRST (Before ANY comprehension)      │
      │                                                         │
      │  1. Load CORTEX rules from tier0/governance/            │
      │  2. Load Company rules from cortex-brain/               │
      │  3. Execute additive_merge_with_selective_override()    │
      │  4. MERGED_RULES available for entire request lifecycle │
      └─────────────────────────────────────────────────────────┘
                              │
                              ▼
      ┌─────────────────────────────────────────────────────────┐
      │  STAGE 1: Comprehension (uses MERGED_RULES)             │
      │  - User sees final merged ruleset                       │
      │  - No surprises between comprehension and execution     │
      └─────────────────────────────────────────────────────────┘
      ```
      
      Files to Create:
      - src/core/knowledge/additive_merger.py
      - src/core/knowledge/rule_priority.py
      - src/core/knowledge/scope_matcher.py
      - src/core/knowledge/merge_audit_log.py
    
    verification_method: |
      Tests in tests/unit/core/knowledge/test_additive_merger.py:
      - TestAdditivePreservation: Non-conflicting CORTEX rules kept
      - TestSelectiveOverride: Company wins conflicts
      - TestCriticalProtection: CRITICAL rules cannot be overridden
      - TestScopeAwareOverride: Partial override respects boundaries
      - TestMergeTiming: Merge before comprehension verified
      - TestAuditLogging: All decisions logged with rationale
    
    git_checkpoint: "IR-006-02-additive-merge"

# =============================================================================
# RISKS & MITIGATIONS
# =============================================================================

risks:
  - risk_id: "RISK-IR-001"
    description: "AST parsing may be slow for large codebases"
    severity: "MEDIUM"
    mitigation: "Implement incremental parsing with caching, only re-parse changed files"
    
  - risk_id: "RISK-IR-002"
    description: "Git history analysis may timeout on repositories with long history"
    severity: "MEDIUM"
    mitigation: "Implement pagination and depth limits, cache results"
    
  - risk_id: "RISK-IR-003"
    description: "Challenge generation may produce false positives"
    severity: "LOW"
    mitigation: "Include confidence scores, allow user to dismiss, learn from dismissals"
    
  - risk_id: "RISK-IR-004"
    description: "User may find reflection step annoying for simple requests"
    severity: "MEDIUM"
    mitigation: "Implement fast-track mode for high-confidence simple intents (configurable)"
    
  - risk_id: "RISK-IR-005"
    description: "Knowledge graph may become stale if not updated incrementally"
    severity: "HIGH"
    mitigation: "Implement file watcher and incremental graph updates on workspace changes"
    
  - risk_id: "RISK-IR-006"
    description: "Comprehension loop may create user fatigue with too many iterations"
    severity: "MEDIUM"
    mitigation: "Set maximum iteration limit (3), offer 'accept as-is' option after limit"
    
  - risk_id: "RISK-IR-007"
    description: "Company domain YAMLs may have syntax errors causing load failures"
    severity: "MEDIUM"
    mitigation: "Implement graceful degradation - fall back to CORTEX rules if company fails"
    
  - risk_id: "RISK-IR-008"
    description: "Override conflicts may silently suppress important CORTEX rules"
    severity: "HIGH"
    mitigation: "Always log overrides to audit trail, allow 'strict mode' that warns on override"

