  # ---------------------------------------------------------------------------
  - ac_id: "IR-005-01"
    title: "Three-Stage Master Orchestrator Architecture"
    description: |
      Master Orchestrator operates in three stages:
      Stage 1: Intent Comprehension (InteractionOrchestrator as preprocessor)
      Stage 2: Intent-Based Routing (delegate to specialized orchestrators)
      Stage 3: Knowledge Integration (company overrides merged)
    
    status: "NOT_STARTED"
    
    acceptance_tests:
      - "Master orchestrator ALWAYS starts with Stage 1 (Comprehension)"
      - "InteractionOrchestrator is the FIRST-STAGE PREPROCESSOR (not default)"
      - "Stage 1 produces approved comprehension YAML before routing"
      - "Stage 2 routes based on canonicalized intent type"
      - "Stage 3 loads and merges knowledge context before execution"
      - "All three stages are audited"
    
    implementation_details: |
      Three-Stage Architecture:
      ```
      ┌─────────────────────────────────────────────────────────────────┐
      │                    MASTER ORCHESTRATOR                          │
      │                                                                 │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 1: INTENT COMPREHENSION                             ║ │
      │  ║   InteractionOrchestrator as Preprocessor                 ║ │
      │  ║                                                           ║ │
      │  ║   1. CORTEX LENS gathers context (knowledge graph)        ║ │
      │  ║   2. Holistic analysis of all sources                     ║ │
      │  ║   3. YAML condensation of understanding                   ║ │
      │  ║   4. User review loop until approval                      ║ │
      │  ║   5. Output: Approved Comprehension YAML                  ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                            │                                   │
      │                            ▼                                   │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 2: INTENT-BASED ROUTING                             ║ │
      │  ║                                                           ║ │
      │  ║   Intent Type → Target Orchestrator:                      ║ │
      │  ║   ─────────────────────────────────────                   ║ │
      │  ║   • planning, ado_work  → PlanningOrchestrator            ║ │
      │  ║   • code, implement,                                      ║ │
      │  ║     fix, refactor       → TDDOrchestrator                 ║ │
      │  ║   • query, status       → Direct Response (no delegation) ║ │
      │  ║   • analyze, review     → AnalysisOrchestrator            ║ │
      │  ║   • UNCLEAR/LOW_CONF    → Back to Stage 1 (clarification) ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                            │                                   │
      │                            ▼                                   │
      │  ╔═══════════════════════════════════════════════════════════╗ │
      │  ║ STAGE 3: KNOWLEDGE INTEGRATION (Parallel with Stage 2)    ║ │
      │  ║                                                           ║ │
      │  ║   1. Load company domain YAMLs from cortex-brain/         ║ │
      │  ║   2. Load CORTEX rules from tier0/governance/             ║ │
      │  ║   3. MERGE: Company OVERRIDES CORTEX                      ║ │
      │  ║   4. Pass merged context to target orchestrator           ║ │
      │  ╚═══════════════════════════════════════════════════════════╝ │
      │                                                                 │
      └─────────────────────────────────────────────────────────────────┘
      ```
      
      Why This Architecture (Not "Interaction as Default"):
      - Avoids circular delegation (Master → Interaction → Master)
      - Clear separation: Comprehension vs Routing vs Execution
      - Interaction is a STAGE, not a fallback
      - Every request gets comprehension (no exceptions)
      - Routing happens AFTER understanding is confirmed
      
