# Files Pending Archive
files_to_archive:
  session_logs:
    pattern: "SESSION-*.md"
    count: 15
    location: "docs/_archive/sessions/"
    reason: "Working session documentation, preserved for history"
    status: "pending"

  phase_completion_reports:
    pattern: "PHASE-*.md"
    count: 50
    location: "docs/_archive/phases/"
    reason: "Phase completion reports, preserved for milestone reference"
    status: "pending"

  analysis_documents:
    pattern: "*-ANALYSIS*.md, *-FINDINGS-*.md"
    count: 25
    location: "docs/_archive/analysis/"
    reason: "Investigation and analysis working documents"
    status: "pending"

  dated_reports:
    pattern: "*-20260[0-9][0-9][0-9]-[0-9][0-9].md"
    count: 40
    location: "docs/_archive/"
    reason: "Date-stamped working and completion reports"
    status: "pending"

  review_artifacts:
    pattern: "REVIEW-*, *REVIEW-*.md, *HOLISTIC*.md"
    count: 20
    location: "docs/_archive/reviews/"
    reason: "Review and verification artifacts"
    status: "pending"

  implementation_plans:
    pattern: "*-IMPLEMENTATION-*.md"
    count: 10
    location: "docs/_archive/implementation-plans/"
    reason: "Superseded implementation plans"
    status: "pending"

# Files Successfully Archived (Historical Record)
archived_files:
  # Example entries (populated as migration progresses)
  example_archive:
    original_filename: "SESSION-EXAMPLE.md"
    archived_to: "docs/_archive/sessions/SESSION-EXAMPLE.md"
    archived_date: null
    reason: "Development session log"
    content_consolidated_to: null
    search_keywords: ["example", "session"]

# Duplicate Detection History
duplicates_detected:
  # Example entries (populated as validation runs)
  rest_api_duplication:
    files:
      - "DEPLOYMENT-API-REFERENCE.md"
      - "DEPLOYMENT-TROUBLESHOOTING.md"
    similarity: "45%"
    overlap_topics: ["REST endpoints", "API integration", "error handling"]
    status: "identified"
    resolution: "Consolidate into docs/03-api-reference/rest-api/0-guide.md"
    resolved_date: null

