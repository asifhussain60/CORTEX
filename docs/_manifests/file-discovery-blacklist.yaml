# CORTEX File Discovery & Blacklist Configuration
# Purpose: Define protected files and discovery parameters
# Version: 1.0
# Last Updated: 2026-01-20

---
metadata:
  description: "Blacklist and discovery configuration for Phase 0 file discovery"
  purpose: "Protect critical system files during recursive folder traversal"
  created: "2026-01-20T00:00:00Z"
  scope: "CORTEX repository root and all subdirectories"

---
# PROTECTED FILE PATTERNS (DO NOT MOVE)
# These files are critical to the project and must remain in place

protected_files:
  
  # ===== CRITICAL ROOT SYSTEM FILES =====
  root_system_files:
    - pattern: "requirements.txt"
      reason: "Python dependency pinning - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "pytest.ini"
      reason: "Test configuration - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "setup.py"
      reason: "Package setup configuration - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "pyproject.toml"
      reason: "Project configuration - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "cortex-config.yaml"
      reason: "Live application configuration - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "governance.db"
      reason: "Live governance database - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "README.md"
      reason: "Root project README - stays at repository root"
      severity: "HIGH"
      allow_move: false
    
    - pattern: "LICENSE.md"
      reason: "License file - stays at repository root"
      severity: "HIGH"
      allow_move: false
    
    - pattern: "copilot-instruction.md"
      reason: "Copilot configuration - system critical"
      severity: "CRITICAL"
      allow_move: false

  # ===== .GITHUB SYSTEM FILES =====
  github_system_files:
    - pattern: ".github/workflows/**/*"
      reason: "CI/CD workflow definitions - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".github/prompts/*.prompt.md"
      reason: "Agent prompt definitions - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".github/agents/*.md"
      reason: "Agent system documentation - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".github/actions/**/*"
      reason: "Custom GitHub Actions - system critical"
      severity: "CRITICAL"
      allow_move: false

  # ===== SOURCE CODE FILES (NEVER MOVE) =====
  source_code_files:
    - pattern: "cortex/**/*.py"
      reason: "Application source code - never move"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "cortex_brain/**/*.py"
      reason: "Brain module source code - never move"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "cortex_toolkit/**/*.py"
      reason: "Toolkit module source code - never move"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "src/**/*.py"
      reason: "Source code - never move"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "extensions/**/*.py"
      reason: "Extension code - never move"
      severity: "CRITICAL"
      allow_move: false

  # ===== BUILD & PACKAGE FILES =====
  build_package_files:
    - pattern: ".git/**/*"
      reason: "Git metadata - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".venv/**/*"
      reason: "Virtual environment - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "venv/**/*"
      reason: "Virtual environment - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "__pycache__/**/*"
      reason: "Python cache files - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "*.egg-info/**/*"
      reason: "Egg info metadata - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".pytest_cache/**/*"
      reason: "Pytest cache - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "dist/**/*"
      reason: "Distribution build artifacts - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: "build/**/*"
      reason: "Build artifacts - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".tox/**/*"
      reason: "Tox environment - system critical"
      severity: "CRITICAL"
      allow_move: false

  # ===== SYSTEM METADATA FILES =====
  system_metadata:
    - pattern: ".DS_Store"
      reason: "macOS metadata - system file"
      severity: "HIGH"
      allow_move: false
    
    - pattern: ".env"
      reason: "Environment variables - system critical"
      severity: "CRITICAL"
      allow_move: false
    
    - pattern: ".env.*"
      reason: "Environment configuration - system critical"
      severity: "CRITICAL"
      allow_move: false

  # ===== AGENT/CONFIG FILES TO PRESERVE =====
  agent_config_files:
    - pattern: "mcp-config/**/*"
      reason: "MCP configuration files - system critical"
      severity: "HIGH"
      allow_move: false
    
    - pattern: ".github/agents/**/*"
      reason: "Agent system files - system critical"
      severity: "HIGH"
      allow_move: false

  # ===== WORKSPACE FILES =====
  workspace_files:
    - pattern: "_workspaces/**/*.yaml"
      reason: "Workspace configurations - may be active"
      severity: "HIGH"
      allow_move: false
      note: "Only .md/.txt files should be discovered in _workspaces/"

---
# DISCOVERY PARAMETERS

discovery_config:
  
  # Root directory to scan
  root_directory: "/Users/asifhussain/PROJECTS/CORTEX"
  
  # Directories to recursively traverse
  traverse_directories:
    - "_workspaces/"
    - "cortex/"
    - "cortex_brain/"
    - "cortex_toolkit/"
    - "extensions/"
    - "mcp-config/"
    - "phases/"
    - "scripts/"
    - "src/"
    - "tests/"
    - ".github/"
  
  # File types to discover
  file_types:
    - "*.md"
    - "*.txt"
    - "*.rst"
  
  # Optional file types (if discovered, flag for review)
  optional_file_types:
    - "*.yaml"       # Config files (non-system)
    - "*.yml"        # Config files (non-system)
    - "*.json"       # JSON files (non-system)
  
  # Exclusion patterns
  exclusion_patterns:
    - "**/.git/*"
    - "**/__pycache__/*"
    - "**/*.egg-info/*"
    - "**/.pytest_cache/*"
    - "**/dist/*"
    - "**/build/*"
    - "**/.tox/*"
    - "**/.venv/*"
    - "**/venv/*"
    - "**/.DS_Store"
    - "**/node_modules/*"
    - "**/.egg-info/*"

---
# DISCOVERY REPORT STRUCTURE

discovery_report:
  
  # Top-level sections
  metadata:
    timestamp: "YYYY-MM-DDTHH:MM:SSZ"
    discovery_phase: "Phase 0"
    root_directory: "/Users/asifhussain/PROJECTS/CORTEX"
    total_files_scanned: 0
    
  # Summary statistics
  summary:
    files_discovered_count: 0
    files_to_move_count: 0
    files_to_archive_count: 0
    files_protected_count: 0
    files_excluded_count: 0
    
    by_file_type:
      markdown: 0      # *.md
      text: 0          # *.txt
      reStructured: 0  # *.rst
    
    by_location:
      root: 0
      cortex: 0
      cortex_brain: 0
      cortex_toolkit: 0
      extensions: 0
      scripts: 0
      src: 0
      tests: 0
      github: 0
      _workspaces: 0
      other: 0
  
  # Discovered files organized by action
  files_discovered:
    
    files_to_move:
      - source: "path/to/file.md"
        destination: "docs/section/"
        category: "documentation"
        reason: "documentation consolidation"
        status: "ready_to_move"
        notes: ""
    
    files_to_archive:
      - source: "path/to/report.md"
        destination: "docs/_archive/reports/"
        category: "working_artifact"
        reason: "non-production working document"
        status: "ready_to_move"
        notes: ""
    
    files_protected:
      - file: "requirements.txt"
        reason: "system_critical"
        status: "protected"
        severity: "CRITICAL"
    
    files_excluded:
      - file: "*.pyc"
        reason: "excluded_by_pattern"
        status: "skipped"

---
# BLACKLIST VALIDATION RULES

validation_rules:
  
  rule_1:
    name: "Protect Root System Files"
    description: "Do not move critical root-level files"
    files_to_protect:
      - "requirements.txt"
      - "pytest.ini"
      - "setup.py"
      - "pyproject.toml"
      - "cortex-config.yaml"
      - "governance.db"
      - "README.md"
      - "copilot-instruction.md"
    enforcement: "BLOCK"
    severity: "CRITICAL"
  
  rule_2:
    name: "Protect .github System Files"
    description: "Do not move CI/CD, workflows, or agent configuration"
    patterns_to_protect:
      - ".github/workflows/**"
      - ".github/prompts/**"
      - ".github/agents/**"
    enforcement: "BLOCK"
    severity: "CRITICAL"
  
  rule_3:
    name: "Protect Source Code"
    description: "Do not move any Python source code"
    patterns_to_protect:
      - "**/*.py"
      - "**/src/**"
      - "**/cortex/**"
    enforcement: "BLOCK"
    severity: "CRITICAL"
  
  rule_4:
    name: "Exclude Build Artifacts"
    description: "Skip all build, cache, and environment artifacts"
    patterns_to_exclude:
      - "**/__pycache__/**"
      - "**/.pytest_cache/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/.venv/**"
    enforcement: "SKIP"
    severity: "HIGH"
  
  rule_5:
    name: "Review Optional File Types"
    description: "Flag YAML, JSON config files for manual review"
    file_types_to_review:
      - "*.yaml"
      - "*.yml"
      - "*.json"
    enforcement: "REVIEW"
    severity: "MEDIUM"

---
# EXECUTION CHECKLIST

execution_checklist:
  
  pre_discovery:
    - [ ] Backup CORTEX root directory
    - [ ] Verify blacklist is current
    - [ ] Confirm discovery parameters
    - [ ] Test exclusion patterns on sample files
    - [ ] Create empty discovery_report.yaml
  
  during_discovery:
    - [ ] Scan root directory for .md/.txt files
    - [ ] Recursively traverse all folders
    - [ ] Apply blacklist filters
    - [ ] Categorize discovered files
    - [ ] Generate discovery report
    - [ ] Flag suspicious patterns for review
  
  post_discovery:
    - [ ] Review discovery_report.yaml
    - [ ] Verify blacklist protected all critical files
    - [ ] Confirm no source code files in move list
    - [ ] Spot-check 10 random files in move list
    - [ ] Sign-off on phase completion

---
# NOTES

notes:
  - "Phase 0 is DISCOVERY ONLY - no files are moved during this phase"
  - "All discovered files must be approved before Phase 1 begins"
  - "Blacklist is conservative by design - better to protect too much than too little"
  - "Any .md or .txt files in _workspaces/ should be discovered and categorized"
  - "Workspace configurations (.yaml) should NOT be moved"
  - "If uncertain about a file, add it to docs/_archive/ instead of deleting"
  - "This configuration is version controlled and subject to code review"
