<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Lifecycle Sankey</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin: 0 0 10px 0;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        
        #sankey {
            width: 100%;
            height: 700px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            max-width: 250px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 30px;
            font-size: 13px;
        }
        
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        text {
            font-size: 12px;
            pointer-events: none;
        }
        
        .node-label {
            font-weight: 500;
            fill: #333;
        }
        
        .link {
            stroke-opacity: 0.5;
        }
        
        .link:hover {
            stroke-opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Request Lifecycle Sankey Diagram</h1>
        <p class="subtitle">Flow of requests through CORTEX processing stages with volume and outcomes</p>
        <div id="sankey"></div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-color" style="background: #1976D2;"></span>
                Intake & Validation
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #0097A7;"></span>
                Processing
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #388E3C;"></span>
                Success Outcomes
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #D32F2F;"></span>
                Failures/Rejections
            </div>
        </div>
    </div>

    <script>
        const data = {
            nodes: [
                // Intake Stage
                {id: 0, name: "📥 Request", stage: "Intake", color: "#1976D2"},
                {id: 1, name: "✅ Validated", stage: "Validation", color: "#1976D2"},
                {id: 2, name: "❌ Invalid Input", stage: "Validation", color: "#D32F2F"},
                
                // Classification Stage
                {id: 3, name: "🧭 Classified", stage: "Classification", color: "#0097A7"},
                {id: 4, name: "❓ Ambiguous", stage: "Classification", color: "#FFA000"},
                
                // Approval Stage
                {id: 5, name: "⏳ Awaiting Approval", stage: "Approval", color: "#0097A7"},
                {id: 6, name: "✅ Approved", stage: "Approval", color: "#388E3C"},
                {id: 7, name: "❌ Rejected", stage: "Approval", color: "#D32F2F"},
                
                // Execution Stage
                {id: 8, name: "⚙️ Executing", stage: "Execution", color: "#0097A7"},
                {id: 9, name: "⚠️ In Progress", stage: "Execution", color: "#FFA000"},
                
                // Results Stage
                {id: 10, name: "✅ Completed", stage: "Results", color: "#388E3C"},
                {id: 11, name: "⚠️ Partial Success", stage: "Results", color: "#FFA000"},
                {id: 12, name: "❌ Failed", stage: "Results", color: "#D32F2F"},
                {id: 13, name: "🔄 Retry Queue", stage: "Results", color: "#FFA000"},
                
                // Final Stage
                {id: 14, name: "📤 Delivered", stage: "Final", color: "#388E3C"},
                {id: 15, name: "📧 Notified", stage: "Final", color: "#0097A7"},
            ],
            links: [
                // Validation flows
                {source: 0, target: 1, value: 950},
                {source: 0, target: 2, value: 50},
                
                // Classification flows
                {source: 1, target: 3, value: 900},
                {source: 1, target: 4, value: 50},
                
                // Re-validation of ambiguous
                {source: 4, target: 3, value: 45},
                {source: 4, target: 2, value: 5},
                
                // Approval flows
                {source: 3, target: 5, value: 900},
                
                // Approval decisions
                {source: 5, target: 6, value: 850},
                {source: 5, target: 7, value: 50},
                
                // Execution
                {source: 6, target: 8, value: 800},
                {source: 6, target: 9, value: 50},
                
                // Execution outcomes
                {source: 8, target: 10, value: 750},
                {source: 8, target: 11, value: 30},
                {source: 8, target: 12, value: 20},
                
                {source: 9, target: 11, value: 30},
                {source: 9, target: 13, value: 20},
                
                // Retries
                {source: 13, target: 8, value: 18},
                {source: 13, target: 12, value: 2},
                
                // Final delivery
                {source: 10, target: 14, value: 750},
                {source: 11, target: 15, value: 60},
                {source: 12, target: 15, value: 22},
                {source: 2, target: 15, value: 50},
                {source: 7, target: 15, value: 50},
            ]
        };

        const width = 1200;
        const height = 700;

        const svg = d3.select("#sankey")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // Create sankey
        const sankey = d3.sankey()
            .nodeWidth(15)
            .nodePadding(50)
            .extent([[1, 1], [width - 1, height - 6]]);

        const {nodes, links} = sankey({
            nodes: data.nodes.map(d => ({...d})),
            links: data.links.map(d => ({...d}))
        });

        // Tooltip
        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("display", "none");

        // Draw links
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .join("path")
            .attr("class", "link")
            .attr("d", d3.sankeyLinkHorizontal())
            .attr("stroke", d => {
                const sourceColor = d.source.color;
                // Convert to RGBA for opacity
                const color = d3.color(sourceColor);
                color.opacity = 0.4;
                return color;
            })
            .attr("stroke-width", d => Math.max(1, d.width));

        // Add link labels on hover
        link.on("mouseover", function(event, d) {
            d3.select(this)
                .attr("stroke-opacity", 0.8)
                .attr("stroke-width", d => Math.max(2, d.width));
            
            tooltip.style("display", "block")
                .html(`
                    <strong>${d.source.name} → ${d.target.name}</strong><br/>
                    Volume: ${d.value} requests
                `)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mousemove", function(event) {
            tooltip
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", function() {
            d3.select(this)
                .attr("stroke-opacity", 0.5)
                .attr("stroke-width", d => Math.max(1, d.width));
            tooltip.style("display", "none");
        });

        // Draw nodes
        const node = svg.append("g")
            .selectAll("rect")
            .data(nodes)
            .join("rect")
            .attr("x", d => d.x0)
            .attr("y", d => d.y0)
            .attr("height", d => d.y1 - d.y0)
            .attr("width", d => d.x1 - d.x0)
            .attr("fill", d => d.color)
            .attr("stroke", "#fff")
            .attr("stroke-width", 2)
            .on("mouseover", function(event, d) {
                d3.select(this)
                    .attr("opacity", 0.8)
                    .attr("stroke-width", 3);
                
                const value = d.value || (d.targetLinks?.reduce((a, l) => a + l.value, 0) || 0);
                tooltip.style("display", "block")
                    .html(`<strong>${d.name}</strong><br/>Volume: ${value}`)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mousemove", function(event) {
                tooltip
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", function() {
                d3.select(this)
                    .attr("opacity", 1)
                    .attr("stroke-width", 2);
                tooltip.style("display", "none");
            });

        // Add labels
        svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
            .attr("y", d => (d.y1 + d.y0) / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end")
            .text(d => d.name);
    </script>
</body>
</html>
