<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Brain Architecture</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin: 0 0 10px 0;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        
        #architecture {
            width: 100%;
            height: 700px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            max-width: 280px;
            z-index: 1000;
        }
        
        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 25px;
            font-size: 13px;
        }
        
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        text {
            font-size: 11px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Domain Brain Architecture</h1>
        <p class="subtitle">Layered knowledge and specialization architecture for CORTEX</p>
        <div id="architecture"></div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-color" style="background: #E3F2FD;"></span>
                Foundation Layer (Domain Core)
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #F3E5F5;"></span>
                Knowledge Layer (Practices & Patterns)
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #E8F5E9;"></span>
                Specialization Layer (Domain-Specific)
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #FFF3E0;"></span>
                Integration Layer (Cross-Cutting)
            </div>
        </div>
    </div>

    <script>
        const width = 1100;
        const height = 700;

        const svg = d3.select("#architecture")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("display", "none");

        // Architecture layers
        const layers = [
            {
                name: "🧠 Integration Layer",
                y: 50,
                height: 100,
                color: "#FFF3E0",
                elements: [
                    "State Manager",
                    "Audit Logger",
                    "Circuit Breaker",
                    "Error Handler",
                    "Result Pattern"
                ]
            },
            {
                name: "⚙️ Specialization Layer",
                y: 170,
                height: 140,
                color: "#E8F5E9",
                elements: [
                    "Platform Specialists",
                    "Domain Knowledge",
                    "Business Rules",
                    "Integration Rules",
                    "Validation Rules"
                ]
            },
            {
                name: "📚 Knowledge Layer",
                y: 330,
                height: 140,
                color: "#F3E5F5",
                elements: [
                    "TDD Patterns",
                    "Refactoring Patterns",
                    "API Design",
                    "Architecture Patterns",
                    "Error Recovery",
                    "Best Practices"
                ]
            },
            {
                name: "🔧 Foundation Layer",
                y: 490,
                height: 140,
                color: "#E3F2FD",
                elements: [
                    "CORE Rules (29)",
                    "Governance (DoR, AC)",
                    "Response Templates",
                    "Audit Trail",
                    "Type System"
                ]
            }
        ];

        let elementIndex = 0;
        const elementColors = [
            "#1976D2", "#0097A7", "#388E3C", "#D32F2F", "#F57F17",
            "#7B1FA2", "#C2185B", "#00BCD4", "#4CAF50", "#FFC107"
        ];

        // Draw layers
        layers.forEach((layer, layerIdx) => {
            // Layer background
            svg.append("rect")
                .attr("x", 20)
                .attr("y", layer.y)
                .attr("width", width - 40)
                .attr("height", layer.height)
                .attr("fill", layer.color)
                .attr("stroke", "#ccc")
                .attr("stroke-width", 1)
                .attr("rx", 4);

            // Layer label
            svg.append("text")
                .attr("x", 30)
                .attr("y", layer.y + 20)
                .attr("font-weight", "bold")
                .attr("font-size", "13px")
                .attr("fill", "#333")
                .text(layer.name);

            // Layer separator line
            if (layerIdx < layers.length - 1) {
                svg.append("line")
                    .attr("x1", 20)
                    .attr("y1", layer.y + layer.height)
                    .attr("x2", width - 20)
                    .attr("y2", layer.y + layer.height)
                    .attr("stroke", "#999")
                    .attr("stroke-width", 2)
                    .attr("stroke-dasharray", "3,3");
            }

            // Elements in this layer
            const elemWidth = (width - 60) / layer.elements.length;
            layer.elements.forEach((element, elemIdx) => {
                const elemX = 30 + elemIdx * elemWidth;
                const elemY = layer.y + 40;
                const elemHeight = layer.height - 50;

                // Element box
                svg.append("rect")
                    .attr("x", elemX + 5)
                    .attr("y", elemY)
                    .attr("width", elemWidth - 10)
                    .attr("height", elemHeight)
                    .attr("fill", elementColors[elementIndex % elementColors.length])
                    .attr("opacity", 0.7)
                    .attr("stroke", "white")
                    .attr("stroke-width", 2)
                    .attr("rx", 4)
                    .style("cursor", "pointer")
                    .on("mouseover", function(event) {
                        d3.select(this)
                            .attr("opacity", 0.9)
                            .attr("stroke-width", 3);

                        tooltip.style("display", "block")
                            .html(`
                                <strong>${element}</strong><br/>
                                <em>${layer.name}</em><br/>
                                <small>Part of knowledge hierarchy</small>
                            `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 10) + "px");
                    })
                    .on("mousemove", function(event) {
                        tooltip
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 10) + "px");
                    })
                    .on("mouseout", function() {
                        d3.select(this)
                            .attr("opacity", 0.7)
                            .attr("stroke-width", 2);
                        tooltip.style("display", "none");
                    });

                // Element text
                svg.append("text")
                    .attr("x", elemX + elemWidth / 2)
                    .attr("y", elemY + elemHeight / 2)
                    .attr("text-anchor", "middle")
                    .attr("dy", ".35em")
                    .attr("fill", "white")
                    .attr("font-size", "11px")
                    .attr("font-weight", "500")
                    .text(element)
                    .style("pointer-events", "none");

                elementIndex++;
            });
        });

        // Add directional arrows between layers
        const arrowPoints = [
            {x: width / 2 - 60, x2: width / 2 - 60},
            {x: width / 2, x2: width / 2},
            {x: width / 2 + 60, x2: width / 2 + 60}
        ];

        arrowPoints.forEach(arrow => {
            // Arrow from Integration to Specialization
            svg.append("line")
                .attr("x1", arrow.x)
                .attr("y1", 160)
                .attr("x2", arrow.x2)
                .attr("y2", 170)
                .attr("stroke", "#666")
                .attr("stroke-width", 2)
                .attr("marker-end", "url(#arrowhead)");

            // Arrow from Specialization to Knowledge
            svg.append("line")
                .attr("x1", arrow.x)
                .attr("y1", 320)
                .attr("x2", arrow.x2)
                .attr("y2", 330)
                .attr("stroke", "#666")
                .attr("stroke-width", 2)
                .attr("marker-end", "url(#arrowhead)");

            // Arrow from Knowledge to Foundation
            svg.append("line")
                .attr("x1", arrow.x)
                .attr("y1", 480)
                .attr("x2", arrow.x2)
                .attr("y2", 490)
                .attr("stroke", "#666")
                .attr("stroke-width", 2)
                .attr("marker-end", "url(#arrowhead)");
        });

        // Define arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("markerWidth", 10)
            .attr("markerHeight", 10)
            .attr("refX", 5)
            .attr("refY", 3)
            .attr("orient", "auto")
            .append("polygon")
            .attr("points", "0 0, 10 3, 0 6")
            .attr("fill", "#666");

        // Add flow labels
        svg.append("text")
            .attr("x", width - 30)
            .attr("y", 215)
            .attr("text-anchor", "end")
            .attr("font-size", "10px")
            .attr("fill", "#999")
            .text("Specialization ↓");

        svg.append("text")
            .attr("x", width - 30)
            .attr("y", 375)
            .attr("text-anchor", "end")
            .attr("font-size", "10px")
            .attr("fill", "#999")
            .text("Knowledge ↓");

        svg.append("text")
            .attr("x", width - 30)
            .attr("y", 535)
            .attr("text-anchor", "end")
            .attr("font-size", "10px")
            .attr("fill", "#999")
            .text("Foundation ↓");
    </script>
</body>
</html>
