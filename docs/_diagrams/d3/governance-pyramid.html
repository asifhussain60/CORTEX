<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTEX Governance Pyramid</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin: 0 0 10px 0;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        
        #pyramid {
            width: 100%;
            height: 600px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            max-width: 300px;
            z-index: 1000;
        }
        
        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 20px;
            font-size: 13px;
        }
        
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        text {
            font-size: 12px;
        }
        
        .tier-label {
            font-weight: bold;
            font-size: 14px;
        }
        
        .count-label {
            font-size: 11px;
            fill: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ CORTEX Governance Pyramid</h1>
        <p class="subtitle">Hierarchical governance structure with 29 CORE rules across 4 tiers</p>
        <div id="pyramid"></div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-color" style="background: #2196F3;"></span>
                Tier 0: Immutable Governance
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #00BCD4;"></span>
                Tier 1: Acceptance Criteria
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #4CAF50;"></span>
                Tier 2: Response Templates
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #FFC107;"></span>
                Tier 3: Knowledge & Practices
            </div>
        </div>
    </div>

    <script>
        // Data structure
        const data = {
            name: "CORTEX Governance",
            children: [
                {
                    name: "Tier 0: Immutable Governance",
                    value: 29,
                    color: "#2196F3",
                    description: "29 CORE Rules - Immutable foundation",
                    rules: [
                        "CORE-001: Intent Classification",
                        "CORE-008: TDD First",
                        "CORE-011: Type Hints",
                        "CORE-026: Git Checkpoints",
                        "+ 25 more fundamental rules"
                    ]
                },
                {
                    name: "Tier 1: Acceptance Criteria",
                    value: 4,
                    color: "#00BCD4",
                    description: "AC validation and phase specs",
                    rules: [
                        "DoR Validation",
                        "AC-ID Mapping",
                        "Phase Specifications",
                        "Success Metrics"
                    ]
                },
                {
                    name: "Tier 2: Response Templates",
                    value: 8,
                    color: "#4CAF50",
                    description: "Output formatting and boundaries",
                    rules: [
                        "Response Headers",
                        "DoR Display",
                        "Hallucination Prevention",
                        "Format Standards",
                        "Documentation",
                        "Examples",
                        "Error Handling",
                        "Status Reporting"
                    ]
                },
                {
                    name: "Tier 3: Knowledge & Practices",
                    value: 35,
                    color: "#FFC107",
                    description: "35+ YAML best practices",
                    rules: [
                        "TDD Patterns",
                        "Refactoring Strategies",
                        "API Design",
                        "CORTEX Architecture",
                        "Integration Patterns",
                        "Error Recovery",
                        "+ 29 more practices"
                    ]
                }
            ]
        };

        // Sunburst layout
        const width = 700;
        const height = 600;
        const radius = Math.min(width, height) / 2;

        const svg = d3.select("#pyramid")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [-width / 2, -height / 2, width, height]);

        const partition = d3.partition()
            .size([2 * Math.PI, radius]);

        const root = d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

        partition(root);

        const arc = d3.arc()
            .startAngle(d => d.x0)
            .endAngle(d => d.x1)
            .innerRadius(d => d.y0)
            .outerRadius(d => d.y1);

        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("display", "none");

        const slices = svg.selectAll("g")
            .data(root.descendants().slice(1))
            .join("g");

        slices.append("path")
            .attr("d", arc)
            .attr("fill", d => d.data.color || "#999")
            .attr("stroke", "white")
            .attr("stroke-width", 2)
            .on("mouseover", function(event, d) {
                d3.select(this)
                    .attr("stroke-width", 3)
                    .attr("opacity", 0.8);
                
                tooltip.style("display", "block")
                    .html(`
                        <strong>${d.data.name}</strong><br/>
                        <em>${d.data.description}</em><br/>
                        <small>Rules/Items: ${d.data.value}</small>
                    `)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mousemove", function(event) {
                tooltip
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", function() {
                d3.select(this)
                    .attr("stroke-width", 2)
                    .attr("opacity", 1);
                tooltip.style("display", "none");
            });

        slices.append("text")
            .attr("class", "tier-label")
            .attr("transform", d => {
                const x = (d.x0 + d.x1) / 2;
                const y = (d.y0 + d.y1) / 2;
                const rotate = x * 180 / Math.PI - 90;
                return `rotate(${rotate}) translate(${y}, 0) rotate(${x > Math.PI ? 180 : 0})`;
            })
            .attr("text-anchor", "middle")
            .attr("dy", ".3em")
            .attr("fill", "white")
            .text(d => d.data.name.split(":")[0])
            .on("mouseover", function(event, d) {
                tooltip.style("display", "block")
                    .html(`<strong>${d.data.name}</strong><br/>${d.data.description}`)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", function() {
                tooltip.style("display", "none");
            });

        slices.append("text")
            .attr("class", "count-label")
            .attr("transform", d => {
                const x = (d.x0 + d.x1) / 2;
                const y = (d.y0 + d.y1) / 2;
                const rotate = x * 180 / Math.PI - 90;
                return `rotate(${rotate}) translate(${y}, 15) rotate(${x > Math.PI ? 180 : 0})`;
            })
            .attr("text-anchor", "middle")
            .text(d => `${d.data.value} items`);
    </script>
</body>
</html>
