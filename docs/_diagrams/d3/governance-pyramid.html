<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chart { text-align: center; }
        .tooltip { position: absolute; padding: 5px; background: #333; color: white; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>CORTEX Governance Pyramid</h1>
    <p>Interactive visualization of 29 CORE rules across 5 categories</p>
    <div id="chart"></div>
    <script>
        const data = {
            name: "CORTEX Governance (29 CORE Rules)",
            children: [
                { name: "Code Quality", value: 8, color: "#FF9999" },
                { name: "Testing", value: 6, color: "#99FF99" },
                { name: "Documentation", value: 5, color: "#9999FF" },
                { name: "Operations", value: 7, color: "#FFFF99" },
                { name: "Security", value: 3, color: "#FF99FF" }
            ]
        };
        
        const width = 600, height = 500;
        const svg = d3.select("#chart").append("svg")
            .attr("width", width)
            .attr("height", height);
        
        const y_offset = 450;
        let x_pos = 50;
        
        data.children.forEach(d => {
            const bar_width = (d.value / 29) * 500;
            svg.append("rect")
                .attr("x", x_pos)
                .attr("y", y_offset - d.value * 20)
                .attr("width", bar_width)
                .attr("height", d.value * 20)
                .attr("fill", d.color)
                .attr("stroke", "#333")
                .attr("stroke-width", 1);
            
            svg.append("text")
                .attr("x", x_pos + bar_width / 2)
                .attr("y", y_offset + 20)
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .text(d.name);
            
            svg.append("text")
                .attr("x", x_pos + bar_width / 2)
                .attr("y", y_offset - d.value * 10)
                .attr("text-anchor", "middle")
                .style("fill", "white")
                .style("font-weight", "bold")
                .text(d.value);
            
            x_pos += bar_width + 5;
        });
        
        svg.append("text")
            .attr("x", width / 2)
            .attr("y", 30)
            .attr("text-anchor", "middle")
            .style("font-size", "16px")
            .style("font-weight", "bold")
            .text("CORTEX Governance Distribution");
    </script>
</body>
</html>
