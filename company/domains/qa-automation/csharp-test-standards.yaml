# C# Testing Coding Standards - HealthEquity Platform
# Extracted from: Platform.Classic.Tests ClassicQA documentation
# Version: 1.0
# Date: 2026-01-28

language: "C#"
framework: "MSTest"
purpose: "Test automation coding standards and style guidelines"

# Naming Conventions
naming_conventions:
  general_rules:
    pascal_case:
      usage: "Classes, methods, properties, constants"
      examples:
        - "Auth0NonMemberLoginTests"
        - "TestSetup"
        - "MemberHomePage"
        - "UsernameField"
    
    camel_case:
      usage: "Local variables and parameters"
      examples:
        - "memberId"
        - "expectedBalance"
        - "loginPage"
        - "transactionCount"
    
    underscore_camel_case:
      usage: "Private fields"
      prefix: "_"
      examples:
        - "_memberLoginPage"
        - "_dashboardPage"
        - "_testUsername"
    
    upper_case:
      usage: "Rare - only for true constants"
      note: "Not commonly used in test code"
  
  test_classes:
    format: "[FeatureArea][Component]Tests"
    rules:
      - "MUST end with 'Tests' suffix"
      - "MUST describe functionality, not reference tickets"
      - "DO NOT include ADO work item IDs"
      - "DO NOT include ticket numbers (TC, ADO, WorkItem)"
    
    correct_examples:
      - "Auth0NonMemberLoginTests"
      - "MemberDashboardNavigationTests"
      - "EmployerReportGenerationTests"
      - "AdvisorAutoPilotEnrollmentTests"
      - "AgreementServiceTests"
    
    incorrect_examples:
      - "Test1"                      # Too generic
      - "LoginTest"                  # Too generic, missing plural
      - "Tests"                      # Too vague
      - "TC193006LoginTests"         # WRONG: includes ticket ID
      - "ADO12345AuthTests"          # WRONG: includes ADO ID
      - "WorkItem54321Tests"         # WRONG: includes work item reference
  
  test_methods:
    format: "TC[ADO_ID]_[FeatureArea]_[Scenario]_[ExpectedOutcome]"
    rules:
      - "MUST start with TC[number]"
      - "Use underscores to separate sections"
      - "Be descriptive but concise"
      - "State expected outcome clearly"
    
    examples:
      good:
        - "TC193006_Auth0NonMemberLoginPage_LoginHappyPathAgreeToPrivacy_LoadsUnifiedEmployerDashboard"
        - "TC195976_Auth0NonMemberLoginPage_PartnerLogin_LoadsPartnerHomePage"
        - "TC509873_AdvisorAutoPilot_MemberWithMinRequired0AndThreshold1000_EnrollsAndUpdatesKeepInCash_ThenConvertsToGPS"
      
      bad:
        - "TC001234_Test"              # Not descriptive
        - "TestLogin"                  # No TC number, too generic
        - "TC001234_TestEverything"    # Too broad
  
  page_objects:
    format: "[PageName]Page"
    rules:
      - "MUST end with 'Page' suffix"
      - "Inherit from PageBase"
    
    examples:
      good:
        - "MemberHomePage"
        - "BusinessLoginPage"
        - "TransactionHistoryPage"
        - "_AdvisorPage"  # Underscore prefix for legacy/internal
      
      bad:
        - "HomePage"        # Too generic
        - "MemberHome"      # Missing "Page" suffix
        - "PageObject1"     # Non-descriptive
  
  elements:
    rule: "Include element type in the name"
    format: "[ElementName][ElementType]"
    
    element_types:
      - "Field"
      - "Button"
      - "Link"
      - "Text"
      - "Message"
      - "Dropdown"
      - "Checkbox"
      - "Radio"
      - "Modal"
      - "Menu"
      - "List"
    
    examples:
      good:
        - "UsernameField"
        - "LoginButton"
        - "ErrorMessage"
        - "WelcomeText"
        - "NavigationMenu"
        - "AccountDropdown"
      
      bad:
        - "Input1"          # Non-descriptive
        - "Element"         # Too generic
        - "Username"        # Missing type indicator
        - "Btn"             # Abbreviation without context
  
  variables:
    local_variables:
      case: "camelCase"
      rules:
        - "Descriptive names"
        - "No single letters (except loop counters)"
        - "No generic names (temp, data, x)"
      
      examples:
        good:
          - "memberUsername = \"testuser@example.com\""
          - "expectedBalance = 1500.00m"
          - "transactionCount = 5"
          - "loginPage = new MemberLoginPage()"
        
        bad:
          - "x = \"testuser@example.com\""    # Single letter
          - "temp = 1500.00m"                 # Too generic
          - "data = new MemberLoginPage()"    # Vague
    
    private_fields:
      case: "_camelCase"
      prefix: "_"
      rules:
        - "MUST use underscore prefix"
        - "Follow camelCase after underscore"
      
      examples:
        good:
          - "_loginPage"
          - "_dashboardPage"
          - "_testUsername"
        
        bad:
          - "loginPage"       # Missing underscore
          - "m_loginPage"     # Wrong prefix style
          - "mLoginPage"      # Hungarian notation
    
    constants:
      case: "PascalCase"
      scope: "private const"
      
      examples:
        good:
          - "private const string TestUsername = \"TestUser123\""
          - "private const int MaxRetryCount = 3"
          - "private const decimal DefaultBalance = 0.00m"
        
        bad:
          - "private const string TEST_USERNAME = \"TestUser123\""  # UPPER_CASE not needed
          - "private const int maxRetryCount = 3"                   # Should be PascalCase
    
    service_level_constants:
      pattern: "Descriptive constant names for magic numbers"
      examples:
        - "private const int SERVICE_LEVEL_AUTOPILOT = 10"
        - "private const int SERVICE_LEVEL_GPS = 5"
        - "private const int ALLOW_NET_SELLS_ENABLED = 1"
        - "private const int INVESTMENT_THRESHOLD_DEFAULT = 1000"
    
    timeout_constants:
      pattern: "TimeSpan constants for wait strategies"
      examples:
        - "private static readonly TimeSpan SHORT_WAIT = TimeSpan.FromSeconds(5)"
        - "private static readonly TimeSpan MEDIUM_WAIT = TimeSpan.FromSeconds(20)"
        - "private static readonly TimeSpan LONG_WAIT = TimeSpan.FromSeconds(30)"

# File Naming and Organization
file_naming:
  critical_rule: "File name MUST exactly match class name (excluding .cs extension)"
  
  correct_examples:
    - file: "Auth0NonMemberLoginTests.cs"
      class: "public class Auth0NonMemberLoginTests"
    
    - file: "MemberDashboardNavigationTests.cs"
      class: "public class MemberDashboardNavigationTests"
  
  incorrect_examples:
    - file: "LoginTests.cs"
      class: "public class Auth0NonMemberLoginTests"
      error: "File name does not match class name"
    
    - file: "Auth0Tests.cs"
      class: "public class Auth0NonMemberLoginTests"
      error: "File name does not match class name"

# Code Organization
code_organization:
  file_structure:
    order:
      1: "Copyright header (if applicable)"
      2: "Using statements (grouped and ordered)"
      3: "Namespace declaration"
      4: "Class declaration with attributes"
      5: "Constants"
      6: "Private fields"
      7: "Constructor (if needed)"
      8: "Test lifecycle methods (Initialize/Cleanup)"
      9: "Test methods"
      10: "Helper methods"
  
  using_statements:
    rules:
      - "Group by namespace (System first, then third-party, then project)"
      - "Order alphabetically within groups"
      - "Remove unused usings"
    
    example: |
      using System;
      using System.Collections.Generic;
      using System.Linq;
      
      using HEQAutomationCore;
      using Microsoft.VisualStudio.TestTools.UnitTesting;
      
      using PageClassesCore.MemberPortal;
      using TestCore.TestUtilities.Data.Factories;
  
  class_member_order:
    1: "Constants (SERVICE_LEVEL_*, TIMEOUT_*)"
    2: "Private fields (_pageObject, _testMemberId)"
    3: "TestInitialize methods"
    4: "TestCleanup methods"
    5: "Test methods (grouped by feature)"
    6: "Helper methods (private)"

# Comments and Documentation
comments_documentation:
  xml_documentation:
    required_for:
      - "Public methods"
      - "Helper methods"
      - "Complex test methods"
    
    tags:
      - "<summary>Brief description</summary>"
      - "<param name='paramName'>Parameter description</param>"
      - "<returns>Return value description</returns>"
      - "<remarks>Additional notes</remarks>"
    
    example: |
      /// <summary>
      /// TC509873: Validates that a member with minimum required 0 and Investment threshold equal to 1000
      /// can successfully enroll into AutoPilot with KeepInCash equal to 0, with CashReplenish set to 0
      /// and AutoInvest set to 1000. Tests updating KeepInCash values and converting to GPS.
      ///
      /// Test Steps:
      /// 1. Create a member with specific product configuration
      /// 2. Login to Investments desktop
      /// 3. Click on "Invest with guidance" and accept the agreement
      /// ...
      /// </summary>
      [TestMethod]
      public void TC509873_AdvisorAutoPilot_MemberWithMinRequired0AndThreshold1000_EnrollsAndUpdatesKeepInCash_ThenConvertsToGPS()
  
  inline_comments:
    phase_headers:
      format: "// ============ [PHASE] ============"
      examples:
        - "// ============ ARRANGE PHASE ============"
        - "// ============ ACT PHASE ============"
        - "// ============ ASSERT PHASE ============"
    
    section_comments:
      format: "// ========================================\n// SECTION NAME\n// ========================================"
      usage: "Major sections (constants, fields, methods)"
      example: |
        // ========================================
        // CONSTANTS - Service Levels & Configuration
        // ========================================
    
    step_comments:
      format: "// Step X: Action description"
      example: "// Step 5: Enroll into AutoPilot with KeepInCash = 0"
    
    explanatory_comments:
      rules:
        - "Explain WHY, not WHAT"
        - "Document non-obvious business logic"
        - "Note workarounds or temporary solutions"
      
      examples:
        good:
          - "// CashReplenishThreshold must match KeepInCash for AutoPilot (business rule)"
          - "// Wait 6 seconds for Couchbase cache to update"
          - "// TODO: Remove this workaround after ADO-12345 is fixed"
        
        bad:
          - "// Set variable to 10"
          - "// Call method"
          - "// Loop through items"
  
  todo_comments:
    format: "// TODO: Description (optional: ADO-12345)"
    usage: "Mark incomplete work or planned improvements"
    examples:
      - "// TODO: Refactor this helper method into utility class"
      - "// TODO: The builder needs fixed to also sign all agreements (ADO-195976)"

# Code Style
code_style:
  bracing:
    style: "Allman (opening brace on new line)"
    example: |
      if (condition)
      {
          DoSomething();
      }
  
  indentation:
    spaces: 4
    use_tabs: false
  
  line_length:
    recommended_max: 120
    hard_max: 150
    exception: "Long strings, URLs, SQL queries"
  
  blank_lines:
    between_methods: 1
    between_sections: 2
    between_logical_blocks: 1
  
  string_literals:
    preference: "Double quotes"
    interpolation: "Use string interpolation ($\"\") over concatenation"
    examples:
      good:
        - "$\"MemberId: {member.MemberId}\""
        - "$\"Expected: {expected}, Actual: {actual}\""
      bad:
        - "\"MemberId: \" + member.MemberId"
        - "string.Format(\"MemberId: {0}\", member.MemberId)"

# Best Practices
best_practices:
  magic_numbers:
    rule: "Extract magic numbers to named constants"
    examples:
      bad: |
        if (serviceLevel == 10)  // What does 10 mean?
        {
            // ...
        }
      
      good: |
        private const int SERVICE_LEVEL_AUTOPILOT = 10;
        
        if (serviceLevel == SERVICE_LEVEL_AUTOPILOT)
        {
            // ...
        }
  
  string_constants:
    rule: "Extract repeated strings to constants"
    examples:
      bad: |
        var query1 = "SELECT * FROM Advisor.dbo.Client WHERE MemberId = @Id";
        var query2 = "SELECT * FROM Advisor.dbo.Client WHERE MemberId = @Id";
      
      good: |
        private const string CLIENT_SELECT_QUERY = "SELECT * FROM Advisor.dbo.Client WHERE MemberId = @Id";
  
  method_length:
    guideline: "Keep test methods under 100 lines"
    solution: "Extract complex logic into helper methods"
    example: |
      // Extract verification logic
      private void VerifyClientTableValues(string memberId, int expectedServiceLevel)
      {
          // Verification logic here
      }
  
  helper_methods:
    naming: "Descriptive verb phrases"
    examples:
      - "UpdateKeepInCashAndVerify()"
      - "VerifyClientTableValues()"
      - "CreateScheduledDeduction()"
      - "PrepareRolloverTestData()"
  
  error_handling:
    assertion_messages:
      rule: "Always provide descriptive failure messages"
      format: "Include expected vs actual values"
      examples:
        good:
          - "Assert.AreEqual(expected, actual, $\"ServiceLevel mismatch. Expected: {expected}, Actual: {actual}\")"
          - "Assert.IsTrue(condition, \"Investments Dashboard page did not load within 20 seconds\")"
        
        bad:
          - "Assert.AreEqual(expected, actual)"
          - "Assert.IsTrue(condition)"
  
  test_data_cleanup:
    rule: "Always clean up created test data"
    pattern: |
      private string _testMemberId;
      
      [TestCleanup]
      public void TestCleanup()
      {
          if (!string.IsNullOrEmpty(_testMemberId))
          {
              try
              {
                  DeleteTestMember(_testMemberId);
              }
              catch (Exception ex)
              {
                  Console.WriteLine($"Cleanup warning: {ex.Message}");
              }
          }
      }

# Performance Guidelines
performance_guidelines:
  waits:
    - "Use explicit waits with conditions, not Thread.Sleep"
    - "Define timeout constants for readability"
    - "Always provide meaningful timeout error messages"
  
  database_queries:
    - "Use parameterized queries"
    - "Minimize database calls in loops"
    - "Clean up test data in batches when possible"
  
  page_objects:
    - "Lazy load elements (use properties with =>)"
    - "Cache page object instances in private fields"
    - "Reuse page objects across test methods when possible"

# Security Best Practices
security_best_practices:
  credentials:
    - "Never hardcode passwords in test code"
    - "Use TestEnvironmentSecurables for credentials"
    - "Use FW.ConfigureWCFDefaultAdminCredentials() for service calls"
  
  sql_injection:
    - "Always use parameterized queries"
    - "Never concatenate user input into SQL strings"
    - "Use Dapper ORM for type-safe queries"
  
  test_data:
    - "Use unique identifiers for test data (DateTime.Now.Ticks)"
    - "Clean up sensitive test data after tests"
    - "Don't log sensitive information (passwords, SSNs, etc.)"

# Code Review Checklist
code_review_checklist:
  naming:
    - "[ ] File name matches class name exactly"
    - "[ ] Class name does NOT include ADO work item ID"
    - "[ ] Test method name includes TC[ADO_ID]"
    - "[ ] Private fields use underscore prefix"
    - "[ ] Element names include type (Field, Button, etc.)"
  
  structure:
    - "[ ] Test class inherits from TestBase"
    - "[ ] TestInitialize and TestCleanup present if needed"
    - "[ ] Phase markers used (SetPhaseArrange/Act/Assert)"
    - "[ ] Test linked to ADO with TestProperty attribute"
  
  code_quality:
    - "[ ] No magic numbers (use named constants)"
    - "[ ] Descriptive variable names"
    - "[ ] Meaningful assertion failure messages"
    - "[ ] Proper error handling in cleanup"
    - "[ ] No hardcoded credentials or sensitive data"
  
  documentation:
    - "[ ] XML documentation for complex methods"
    - "[ ] Inline comments explain WHY, not WHAT"
    - "[ ] Test steps documented in method summary"
  
  best_practices:
    - "[ ] Uses existing data creation patterns (not custom logic)"
    - "[ ] Test data cleanup implemented"
    - "[ ] Explicit waits with timeout messages"
    - "[ ] Proper Page Object Model usage"
    - "[ ] No Thread.Sleep (use FW.WaitUntil instead)"

# CORTEX Integration
cortex_integration:
  code_generation:
    - "Apply all naming conventions exactly"
    - "Generate file name matching class name"
    - "Never include ADO IDs in class names"
    - "Always include TestProperty ADO link"
    - "Use phase markers in test structure"
  
  code_review:
    - "Validate naming conventions"
    - "Check for magic numbers"
    - "Verify assertion messages present"
    - "Ensure proper cleanup implemented"
  
  refactoring:
    - "Extract magic numbers to constants"
    - "Extract complex logic to helper methods"
    - "Suggest better variable names"
    - "Recommend existing patterns over custom code"
