# QA Automation Test Patterns - HealthEquity Platform
# Extracted from: Platform.Classic.Tests ClassicQA documentation
# Version: 1.0
# Date: 2026-01-28
# Framework: MSTest, C#, Selenium WebDriver

framework:
  name: "ClassicQA Test Automation Framework"
  type: "MSTest"
  language: "C#"
  ui_framework: "Selenium WebDriver"
  custom_framework: "HEQAutomationCore"
  repository: "Platform.Classic.Tests"

# Test Structure Patterns
test_structure:
  aaa_pattern:
    name: "Arrange-Act-Assert with Phase Markers"
    description: "Explicit test phase marking for traceability and reporting"
    phases:
      arrange:
        method: "SetPhaseArrange()"
        purpose: "Test setup, data creation, preconditions"
        placement: "Before test execution logic"
      
      act:
        method: "SetPhaseAct()"
        purpose: "Execute the action under test"
        placement: "Before performing the tested operation"
      
      assert:
        method: "SetPhaseAssert()"
        purpose: "Verify expected outcomes"
        placement: "Before assertions"
      
      complete:
        method: "SetPhaseComplete()"
        purpose: "Mark test completion (optional)"
        placement: "End of test method"
    
    example: |
      [TestMethod]
      public void TC123456_Feature_Scenario_Expected()
      {
          // ============ ARRANGE PHASE ============
          SetPhaseArrange();
          var member = CreateTestMember();
          
          // ============ ACT PHASE ============
          SetPhaseAct();
          member.PerformAction();
          
          // ============ ASSERT PHASE ============
          SetPhaseAssert();
          Assert.IsTrue(member.ActionSucceeded);
          
          SetPhaseComplete();
      }

# Test Naming Conventions
test_naming:
  test_class:
    format: "[FeatureArea][Component]Tests"
    examples:
      - "Auth0NonMemberLoginTests"
      - "MemberDashboardNavigationTests"
      - "EmployerReportGenerationTests"
      - "AdvisorAutoPilotEnrollmentTests"
    critical_rules:
      - "DO NOT include ADO work item IDs in class names"
      - "DO NOT include ticket numbers (TC, ADO, WorkItem) in class names"
      - "Class name describes functionality, not ticket reference"
    anti_patterns:
      - "TC193006LoginTests"  # Wrong: includes ticket ID
      - "ADO12345Tests"        # Wrong: includes ADO ID
      - "WorkItem54321Tests"   # Wrong: includes work item reference
  
  test_method:
    format: "TC[ADO_ID]_[FeatureArea]_[Scenario]_[ExpectedOutcome]"
    examples:
      - "TC193006_Auth0NonMemberLoginPage_LoginHappyPathAgreeToPrivacy_LoadsUnifiedEmployerDashboard"
      - "TC509873_AdvisorAutoPilot_MemberWithMinRequired0AndThreshold1000_EnrollsAndUpdatesKeepInCash_ThenConvertsToGPS"
      - "TC195976_Auth0NonMemberLoginPage_PartnerLogin_LoadsPartnerHomePage"
    rules:
      - "Always start with TC[ADO_ID]"
      - "Use underscores to separate sections"
      - "Be descriptive but concise"
      - "State expected outcome clearly"
  
  file_naming:
    critical_rule: "File name MUST exactly match class name"
    format: "[ClassName].cs"
    examples:
      correct:
        - "Auth0NonMemberLoginTests.cs contains public class Auth0NonMemberLoginTests"
        - "MemberDashboardNavigationTests.cs contains public class MemberDashboardNavigationTests"
      incorrect:
        - "LoginTests.cs containing public class Auth0NonMemberLoginTests"
        - "Auth0NonMemberLogin.cs containing public class Auth0NonMemberLoginTests"

# Test Attributes
test_attributes:
  required:
    - attribute: "[TestClass]"
      scope: "Class level"
      purpose: "MSTest class decorator"
    
    - attribute: "[TestMethod]"
      scope: "Method level"
      purpose: "MSTest method decorator"
  
  optional:
    - attribute: "[TestProperty(\"ADOTestCaseId\", \"123456\")]"
      purpose: "Link test to Azure DevOps work item"
      best_practice: "Always include for traceability"
    
    - attribute: "[TestProperty(\"Priority\", \"1\")]"
      purpose: "Test priority (1=highest)"
      values: ["1", "2", "3", "4"]
    
    - attribute: "[TestProperty(\"Owner\", \"TeamName\")]"
      purpose: "Test ownership"
    
    - attribute: "[TestCategory(\"Smoke\")]"
      purpose: "Test categorization"
      common_categories:
        - "Smoke"
        - "Regression"
        - "Integration"
        - "UI"
        - "API"
        - "E2E"
        - "[Feature area name]"
    
    - attribute: "[Description(\"Test description\")]"
      purpose: "Human-readable test description"
  
  example: |
    [TestMethod]
    [TestProperty("ADOTestCaseId", "509873")]
    [TestProperty("Priority", "2")]
    [TestProperty("Owner", "QA Team")]
    [TestCategory("Investments")]
    [TestCategory("Advisor")]
    [TestCategory("AutoPilot")]
    [Description("Validates AutoPilot enrollment with KeepInCash updates and GPS conversion")]
    public void TC509873_AdvisorAutoPilot_MemberWithMinRequired0AndThreshold1000_EnrollsAndUpdatesKeepInCash_ThenConvertsToGPS()

# Test Lifecycle Hooks
test_lifecycle:
  test_initialize:
    attribute: "[TestInitialize]"
    timing: "Runs before EACH test method"
    common_uses:
      - "Configure WCF credentials"
      - "Initialize page objects"
      - "Set up test data factories"
      - "Reset state"
    example: |
      [TestInitialize]
      public void TestSetup()
      {
          FW.ConfigureWCFDefaultAdminCredentials();
          _pageObject = new YourPageObject();
      }
  
  test_cleanup:
    attribute: "[TestCleanup]"
    timing: "Runs after EACH test method"
    common_uses:
      - "Clean up test data"
      - "Delete created entities"
      - "Reset database state"
      - "Close resources"
    example: |
      [TestCleanup]
      public void TestCleanup()
      {
          if (!string.IsNullOrEmpty(_testMemberId))
          {
              DeleteTestMember(_testMemberId);
          }
      }
  
  class_initialize:
    attribute: "[ClassInitialize]"
    timing: "Runs once before all tests in class"
    signature: "public static void ClassSetup(TestContext context)"
  
  class_cleanup:
    attribute: "[ClassCleanup]"
    timing: "Runs once after all tests in class"

# Page Object Model Pattern
page_object_model:
  inheritance:
    base_class: "PageBase"
    description: "All page objects inherit from PageBase"
  
  naming:
    format: "[PageName]Page"
    examples:
      - "MemberHomePage"
      - "BusinessLoginPage"
      - "TransactionHistoryPage"
      - "_AdvisorPage"  # Underscore prefix for legacy/internal pages
  
  element_declaration:
    pattern: "Property with FindElement method"
    format: "public Element [ElementName] => FindElement([locator], [FindTypes])"
    examples: |
      public Element UsernameField => FindElement("username", FindTypes.ID);
      public Element LoginButton => FindElement("btn-login", FindTypes.ID);
      public Element ErrorMessage => FindElement("error-msg", FindTypes.CLASSNAME);
    
    naming_convention: "Include element type in name"
    element_types:
      - "Field"
      - "Button"
      - "Link"
      - "Text"
      - "Message"
      - "Dropdown"
      - "Checkbox"
      - "Modal"
  
  locator_strategies:
    preference_order:
      1: "ID (most reliable)"
      2: "ClassName"
      3: "Name"
      4: "XPath (last resort)"
    
    find_types:
      - "FindTypes.ID"
      - "FindTypes.CLASSNAME"
      - "FindTypes.NAME"
      - "FindTypes.XPATH"
      - "FindTypes.CSSSELECTOR"
  
  action_methods:
    description: "Methods that perform actions on the page"
    examples: |
      public void LoginAndAgreeToPrivacy(string username, string password)
      {
          UsernameField.SendKeys(username);
          PasswordField.SendKeys(password);
          PrivacyCheckbox.Click();
          LoginButton.Click();
      }
  
  validation_methods:
    description: "Methods that check page state"
    examples: |
      public bool IsLoaded()
      {
          return PageTitle.IsDisplayed() && UsernameField.IsDisplayed();
      }
      
      public void WaitUntilLoaded()
      {
          FW.WaitUntil(() => IsLoaded(), TimeSpan.FromSeconds(20));
      }

# Wait Strategies
wait_strategies:
  custom_wait:
    method: "FW.WaitUntil()"
    signature: "FW.WaitUntil(Func<bool> condition, TimeSpan timeout, Func<string> errorMessage)"
    example: |
      FW.WaitUntil(
          () => _memberHomePage.IsLoaded(),
          TimeSpan.FromSeconds(20),
          () => "Member home page did not load within 20 seconds"
      );
  
  element_wait:
    method: "Browser.Wait()"
    example: |
      Browser.Wait(_advisorPage.KeepInCash.IsDisplayed, TimeSpan.FromSeconds(5));
  
  click_until:
    method: "Element.ClickUntil()"
    description: "Click element repeatedly until condition is met"
    example: |
      _advisorPage.rdoAutoPilot.ClickUntil(
          () => _advisorPage.rdoAutoPilot.IsSelected(),
          TimeSpan.FromSeconds(5)
      );
  
  timeout_constants:
    pattern: "Define timeout constants for readability"
    examples: |
      private static readonly TimeSpan SHORT_WAIT = TimeSpan.FromSeconds(5);
      private static readonly TimeSpan MEDIUM_WAIT = TimeSpan.FromSeconds(20);
      private static readonly TimeSpan LONG_WAIT = TimeSpan.FromSeconds(30);

# Data Creation Patterns
data_creation_patterns:
  pattern_types:
    data_creator:
      description: "Declarative data creation using predefined templates"
      usage: "Creating complete test scenarios with all related entities"
      access: "TestBase.DataCreator"
      example: |
        var createdData = DataCreator.Create(new StandardRAData());
        var memberId = createdData.Member.MemberId;
    
    builder_pattern:
      description: "Fluent API for building complex test entities"
      usage: "Building individual entities with specific configurations"
      example: |
        var member = new SelfDrivenMemberInvestmentScenarioBuilder()
            .WithAutoRebalance(false)
            .Build();
    
    identity_factory:
      description: "Quick creation of common identity entities"
      usage: "Simple member/employer creation for basic tests"
      examples:
        - "IdentityFactory.CreateMember()"
        - "IdentityFactory.CreateEmployerWithMajorMedicalPlan()"
        - "IdentityFactory.CreateMemberWithHsa(employer)"
    
    scenario_builder:
      description: "Build complete test scenarios with multiple entities"
      usage: "Complex multi-entity test setups"
      example: |
        var entity = new CardScenario(FW)
            .WithPartner("HealthEquity")
            .WithProduct(FeeScheduleBuilder.GenericProductXmlAttachment)
            .WithTpa()
            .WithPurseType("HS")
            .WithEmployer()
            .WithMember();
  
  best_practices:
    - "Prefer existing builders over creating custom data creation logic"
    - "Use DataCreator for standard test scenarios"
    - "Use Builder pattern for customized entity creation"
    - "Use IdentityFactory for simple, quick entity creation"
    - "Always clean up created test data in TestCleanup"

# Assertion Patterns
assertion_patterns:
  framework_assertions:
    description: "Custom assertion helpers from FWAssertions class"
    continue_on_failure:
      - "FW.AssertAreEqualAndContinue<T>(expected, actual, notes)"
      - "FW.AssertIsNullAndContinue(obj, notes)"
      - "FW.AssertIsTrueAndContinue(assertion, notes)"
    
    fail_immediately:
      - "FW.AssertAreEqualAndFailTest<T>(expected, actual, notes)"
      - "FW.AssertIsTrueAndFailTest(assertion, notes)"
  
  mstest_assertions:
    description: "Standard MSTest assertion methods"
    common_methods:
      - "Assert.AreEqual(expected, actual, message)"
      - "Assert.IsTrue(condition, message)"
      - "Assert.IsNotNull(value, message)"
      - "Assert.Fail(message)"
  
  best_practices:
    - "Always provide descriptive failure messages"
    - "Use FW assertions when you want to continue on failure"
    - "Use standard Assert for critical failures"
    - "Include actual vs expected values in messages"
  
  examples: |
    // Good: Descriptive message with context
    Assert.AreEqual(expectedServiceLevel, actualServiceLevel,
        $"ServiceLevel mismatch. Expected: {expectedServiceLevel} (AutoPilot), Actual: {actualServiceLevel}");
    
    // Good: FW assertion to continue testing
    FW.AssertAreEqualAndContinue(reviewableAgreements.Count(), 2,
        $"{reviewableAgreements.Count()} reviewable agreements were found.");
    
    // Bad: No context
    Assert.AreEqual(10, level);

# Browser Navigation
browser_navigation:
  load_url:
    method: "Browser.Load(url)"
    examples:
      - "Browser.Load(FW.BaseDomain.Classic)"
      - "Browser.Load(FW.BaseDomain.Client)"
      - "Browser.Load($\"{FW.BaseDomain.Client}/investments\")"
  
  base_domains:
    classic: "FW.BaseDomain.Classic  # Classic portal"
    client: "FW.BaseDomain.Client   # Client/unified portal"
    domain: "FW.Domain              # Current environment domain"

# Login Utilities
login_utilities:
  login_as_user:
    method: "LoginUtilities.LoginAsUser(username, password)"
    examples:
      - "LoginUtilities.LoginAsUser(member.Authentication.Username)"
      - "LoginUtilities.LoginAsUser(member.LoginId)"
  
  login_as_admin:
    method: "LoginUtilities.LoginAsAdmin()"
    returns: "HttpClient with authenticated session"
  
  impersonation:
    method: "LoginUtilities.ImpersonateEntity(entityId, entityType)"
    entity_types:
      - "ImpersonationEntityType.Member"
      - "ImpersonationEntityType.Employer"
  
  load_portal:
    method: "LoginUtilities.LoadWebPortal()"
    description: "Navigate to portal after login"
  
  logout:
    method: "LoginUtilities.Logout()"

# Database Operations
database_operations:
  query_execution:
    method: "FW.RunSqlQueryDapper<T>(query, parameters)"
    description: "Execute SQL query using Dapper ORM"
    examples: |
      var clientData = FW.RunSqlQueryDapper<dynamic>(
          "SELECT ServiceLevel, KeepInCash FROM Advisor.dbo.Client WHERE MemberId = @MemberId",
          new { MemberId = memberId }
      ).FirstOrDefault();
  
  connection_string:
    method: "FW.GetDbConnectionString()"
    description: "Get connection string for current environment"
  
  best_practices:
    - "Use parameterized queries to prevent SQL injection"
    - "Use Dapper for type-safe queries"
    - "Clean up test data in TestCleanup"
    - "Avoid direct database manipulation when service methods exist"

# Service Integration
service_integration:
  wcf_configuration:
    method: "FW.ConfigureWCFDefaultAdminCredentials()"
    placement: "TestInitialize or before service calls"
    description: "Configure WCF services with admin credentials"
  
  service_locator:
    pattern: "ServiceLocator.Get<IService>()"
    example: "var agreementService = ServiceLocator.Get<IAgreementService>()"
  
  transaction_runner:
    method: "TransactionRunner.ExecuteRequest(request)"
    description: "Execute service requests with transaction support"

# Test Documentation
test_documentation:
  inline_comments:
    phase_headers:
      format: "// ============ [PHASE] ============"
      examples:
        - "// ============ ARRANGE PHASE ============"
        - "// ============ ACT PHASE ============"
        - "// ============ ASSERT PHASE ============"
    
    step_comments:
      format: "// Step X: Description"
      example: "// Step 5: Enroll into AutoPilot with KeepInCash = 0"
  
  method_documentation:
    xml_comments:
      required_tags:
        - "<summary>Method description</summary>"
        - "<param>Parameter descriptions</param>"
        - "<returns>Return value description</returns>"
      example: |
        /// <summary>
        /// Helper method to verify Advisor Client table values
        /// </summary>
        /// <param name="memberId">Member ID to verify</param>
        /// <param name="expectedServiceLevel">Expected service level (10=AutoPilot, 5=GPS)</param>
        private void VerifyClientTableValues(string memberId, int expectedServiceLevel)
  
  test_case_documentation:
    format: |
      /// <summary>
      /// TC[ADO_ID]: Test case description
      ///
      /// Test Steps:
      /// 1. Step description
      /// 2. Step description
      /// ...
      ///
      /// Expected Results:
      /// - Result 1
      /// - Result 2
      /// </summary>

# Anti-Patterns (What NOT to Do)
anti_patterns:
  naming:
    - "Including ADO IDs in class names (TC193006LoginTests)"
    - "Generic class names (Test1, LoginTest, Tests)"
    - "Missing 'Tests' suffix on test class names"
    - "File name not matching class name"
  
  test_structure:
    - "Not using phase markers (SetPhaseArrange, etc.)"
    - "Missing ADO test case ID in test method name"
    - "Not cleaning up test data"
    - "Hardcoding test data instead of using factories"
  
  assertions:
    - "Assertions without failure messages"
    - "Using Assert.IsTrue for equality checks (use Assert.AreEqual)"
    - "Not providing context in failure messages"
  
  waits:
    - "Using Thread.Sleep instead of explicit waits"
    - "Not providing timeout error messages"
    - "Waiting for fixed time instead of condition"

# Best Practices Summary
best_practices_summary:
  do:
    - "Always inherit from TestBase"
    - "Use phase markers (SetPhaseArrange/Act/Assert)"
    - "Link tests to ADO with TestProperty attribute"
    - "Provide descriptive failure messages"
    - "Clean up test data in TestCleanup"
    - "Use existing data creation patterns (DataCreator, Builder, Factory)"
    - "Follow naming conventions exactly"
    - "Ensure file name matches class name"
    - "Use explicit waits with timeout messages"
    - "Prefer ID locators over XPath"
  
  dont:
    - "Don't include ADO IDs in class names"
    - "Don't skip framework documentation references"
    - "Don't hardcode test data"
    - "Don't commit without running tests"
    - "Don't use Thread.Sleep"
    - "Don't ignore coding standards"
    - "Don't create custom builders when existing ones exist"

# CORTEX Integration Notes
cortex_usage:
  when_generating_tests:
    - "Always reference this pattern file for test structure"
    - "Apply naming conventions exactly as specified"
    - "Use phase markers in correct order"
    - "Include all required attributes"
    - "Link to ADO work items"
    - "Follow Page Object Model pattern"
    - "Use existing data creation patterns"
  
  code_quality:
    - "Verify file name matches class name"
    - "Ensure class name does NOT include ADO ID"
    - "Validate test method naming format"
    - "Check for descriptive assertion messages"
    - "Confirm proper wait strategy usage"
