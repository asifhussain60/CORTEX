# WCAG Accessibility Guidelines
# Web Content Accessibility Guidelines 2.1
# Authority: World Wide Web Consortium (W3C)
# Source: https://www.w3.org/WAI/WCAG21/quickref/
# Version: 2.1 (2018), Level AA
# Last Updated: 2026-01-28

metadata:
  standard_id: "WCAG"
  version: "2.1"
  governing_body: "World Wide Web Consortium (W3C)"
  applies_to:
    - "Public sector websites (legally required in many jurisdictions)"
    - "Organizations seeking inclusive digital experiences"
    - "U.S. entities under Section 508/ADA"
  public_reference: "https://www.w3.org/WAI/WCAG21/quickref/"
  conformance_levels:
    A: "Minimum accessibility"
    AA: "Standard target (most common legal requirement)"
    AAA: "Enhanced accessibility"

# =============================================================================
# FOUR PRINCIPLES (POUR)
# =============================================================================

principles:
  perceivable:
    description: "Information must be presentable to users in ways they can perceive"
    guidelines:
      - "Text alternatives for non-text content"
      - "Captions and alternatives for multimedia"
      - "Content adaptable to different presentations"
      - "Distinguishable content (color, contrast)"
  
  operable:
    description: "User interface components must be operable"
    guidelines:
      - "Keyboard accessible"
      - "Enough time to read and use content"
      - "No content that causes seizures"
      - "Navigable"
      - "Input modalities beyond keyboard"
  
  understandable:
    description: "Information and UI operation must be understandable"
    guidelines:
      - "Readable text content"
      - "Predictable web pages"
      - "Input assistance for forms"
  
  robust:
    description: "Content must be robust enough for interpretation by assistive technologies"
    guidelines:
      - "Compatible with current and future tools"
      - "Maximize compatibility"

# =============================================================================
# GUIDELINES AND SUCCESS CRITERIA
# =============================================================================

guidelines:
  perceivable:
    "1.1":
      title: "Text Alternatives"
      criteria:
        "1.1.1":
          level: "A"
          name: "Non-text Content"
          description: "All non-text content has text alternative"
          implementation:
            images: "Use alt attribute with descriptive text"
            decorative: "Use alt='' or CSS background-image"
            complex: "Provide long description via aria-describedby"
          code_pattern: |
            <!-- Informative image -->
            <img src="chart.png" alt="Q4 sales increased 25% over Q3">
            
            <!-- Decorative image -->
            <img src="decoration.png" alt="" role="presentation">
            
            <!-- Complex image with long description -->
            <img src="diagram.png" alt="System architecture diagram" 
                 aria-describedby="diagram-desc">
            <div id="diagram-desc" class="visually-hidden">
              Detailed description of the architecture...
            </div>
    
    "1.2":
      title: "Time-based Media"
      criteria:
        "1.2.1":
          level: "A"
          name: "Audio-only and Video-only (Prerecorded)"
          description: "Alternatives for prerecorded audio-only and video-only content"
        "1.2.2":
          level: "A"
          name: "Captions (Prerecorded)"
          description: "Captions provided for prerecorded audio content in synchronized media"
        "1.2.3":
          level: "A"
          name: "Audio Description or Media Alternative"
          description: "Alternative or audio description for prerecorded video"
        "1.2.4":
          level: "AA"
          name: "Captions (Live)"
          description: "Captions provided for all live audio content"
        "1.2.5":
          level: "AA"
          name: "Audio Description (Prerecorded)"
          description: "Audio description provided for all prerecorded video content"
    
    "1.3":
      title: "Adaptable"
      criteria:
        "1.3.1":
          level: "A"
          name: "Info and Relationships"
          description: "Information, structure, and relationships conveyed through presentation can be programmatically determined"
          implementation:
            - "Use semantic HTML (h1-h6, nav, main, article)"
            - "Use proper table markup with headers"
            - "Use lists for list content"
            - "Use labels for form controls"
          code_pattern: |
            <!-- Proper form labeling -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            
            <!-- Proper table structure -->
            <table>
              <caption>Quarterly Sales</caption>
              <thead>
                <tr>
                  <th scope="col">Quarter</th>
                  <th scope="col">Sales</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row">Q1</th>
                  <td>$1.2M</td>
                </tr>
              </tbody>
            </table>
        "1.3.2":
          level: "A"
          name: "Meaningful Sequence"
          description: "Content sequence can be programmatically determined"
        "1.3.3":
          level: "A"
          name: "Sensory Characteristics"
          description: "Instructions don't rely solely on sensory characteristics"
        "1.3.4":
          level: "AA"
          name: "Orientation"
          description: "Content not restricted to single display orientation"
        "1.3.5":
          level: "AA"
          name: "Identify Input Purpose"
          description: "Input field purpose can be programmatically determined"
          implementation: "Use autocomplete attribute"
          code_pattern: |
            <input type="text" autocomplete="given-name" name="firstName">
            <input type="text" autocomplete="family-name" name="lastName">
            <input type="email" autocomplete="email" name="email">
            <input type="tel" autocomplete="tel" name="phone">
    
    "1.4":
      title: "Distinguishable"
      criteria:
        "1.4.1":
          level: "A"
          name: "Use of Color"
          description: "Color not used as only visual means of conveying information"
          implementation: "Supplement color with text, patterns, or icons"
        "1.4.2":
          level: "A"
          name: "Audio Control"
          description: "Mechanism to pause, stop, or control audio volume"
        "1.4.3":
          level: "AA"
          name: "Contrast (Minimum)"
          description: "Text has contrast ratio of at least 4.5:1 (3:1 for large text)"
          requirements:
            normal_text: "4.5:1 minimum"
            large_text: "3:1 minimum (18pt or 14pt bold)"
            ui_components: "3:1 minimum"
          code_pattern: |
            /* Good contrast examples */
            .text-primary { color: #1a1a1a; }  /* On white: 16.1:1 */
            .text-secondary { color: #595959; }  /* On white: 7.0:1 */
            .text-link { color: #0066cc; }  /* On white: 5.9:1 */
            
            /* Avoid low contrast */
            /* Bad: color: #999999; on white = 2.8:1 */
        "1.4.4":
          level: "AA"
          name: "Resize Text"
          description: "Text can be resized up to 200% without loss of content or functionality"
          implementation: "Use relative units (rem, em) not pixels"
        "1.4.5":
          level: "AA"
          name: "Images of Text"
          description: "Use actual text rather than images of text"
        "1.4.10":
          level: "AA"
          name: "Reflow"
          description: "Content reflows at 320px width without horizontal scrolling"
        "1.4.11":
          level: "AA"
          name: "Non-text Contrast"
          description: "UI components and graphics have 3:1 contrast ratio"
        "1.4.12":
          level: "AA"
          name: "Text Spacing"
          description: "No loss of content when text spacing is adjusted"
        "1.4.13":
          level: "AA"
          name: "Content on Hover or Focus"
          description: "Additional content on hover/focus is dismissible, hoverable, and persistent"
  
  operable:
    "2.1":
      title: "Keyboard Accessible"
      criteria:
        "2.1.1":
          level: "A"
          name: "Keyboard"
          description: "All functionality available from keyboard"
          implementation:
            - "Use native focusable elements (button, a, input)"
            - "Add tabindex='0' for custom interactive elements"
            - "Implement keyboard handlers for custom widgets"
          code_pattern: |
            <!-- Use native elements when possible -->
            <button onclick="handleClick()">Submit</button>
            
            <!-- Custom interactive element -->
            <div role="button" tabindex="0" 
                 onclick="handleClick()"
                 onkeydown="if(event.key==='Enter'||event.key===' ')handleClick()">
              Custom Button
            </div>
        "2.1.2":
          level: "A"
          name: "No Keyboard Trap"
          description: "Keyboard focus is not trapped in any component"
        "2.1.4":
          level: "A"
          name: "Character Key Shortcuts"
          description: "Single character key shortcuts can be turned off or remapped"
    
    "2.2":
      title: "Enough Time"
      criteria:
        "2.2.1":
          level: "A"
          name: "Timing Adjustable"
          description: "Users can turn off, adjust, or extend time limits"
        "2.2.2":
          level: "A"
          name: "Pause, Stop, Hide"
          description: "Moving, blinking, scrolling content can be paused, stopped, or hidden"
    
    "2.3":
      title: "Seizures and Physical Reactions"
      criteria:
        "2.3.1":
          level: "A"
          name: "Three Flashes or Below Threshold"
          description: "No content flashes more than 3 times per second"
    
    "2.4":
      title: "Navigable"
      criteria:
        "2.4.1":
          level: "A"
          name: "Bypass Blocks"
          description: "Mechanism to bypass repeated blocks of content"
          implementation: "Skip navigation link, ARIA landmarks"
          code_pattern: |
            <!-- Skip link (first element in body) -->
            <a href="#main-content" class="skip-link">Skip to main content</a>
            
            <!-- ARIA landmarks -->
            <header role="banner">...</header>
            <nav role="navigation">...</nav>
            <main role="main" id="main-content">...</main>
            <footer role="contentinfo">...</footer>
        "2.4.2":
          level: "A"
          name: "Page Titled"
          description: "Web pages have titles that describe topic or purpose"
        "2.4.3":
          level: "A"
          name: "Focus Order"
          description: "Focusable components receive focus in meaningful sequence"
        "2.4.4":
          level: "A"
          name: "Link Purpose (In Context)"
          description: "Link purpose can be determined from link text or context"
        "2.4.5":
          level: "AA"
          name: "Multiple Ways"
          description: "More than one way to locate a web page within a set"
        "2.4.6":
          level: "AA"
          name: "Headings and Labels"
          description: "Headings and labels describe topic or purpose"
        "2.4.7":
          level: "AA"
          name: "Focus Visible"
          description: "Keyboard focus indicator is visible"
          code_pattern: |
            /* Ensure visible focus */
            :focus {
              outline: 2px solid #005fcc;
              outline-offset: 2px;
            }
            
            /* Don't remove focus outline */
            /* Bad: :focus { outline: none; } */
    
    "2.5":
      title: "Input Modalities"
      criteria:
        "2.5.1":
          level: "A"
          name: "Pointer Gestures"
          description: "Multipoint or path-based gestures have single pointer alternative"
        "2.5.2":
          level: "A"
          name: "Pointer Cancellation"
          description: "Functions use up-event, abort/undo available"
        "2.5.3":
          level: "A"
          name: "Label in Name"
          description: "Visual label is part of accessible name"
        "2.5.4":
          level: "A"
          name: "Motion Actuation"
          description: "Functions triggered by motion have UI alternative"
  
  understandable:
    "3.1":
      title: "Readable"
      criteria:
        "3.1.1":
          level: "A"
          name: "Language of Page"
          description: "Default language can be programmatically determined"
          code_pattern: |
            <html lang="en">
        "3.1.2":
          level: "AA"
          name: "Language of Parts"
          description: "Language of parts can be programmatically determined"
          code_pattern: |
            <p>The French phrase <span lang="fr">c'est la vie</span> means "that's life."</p>
    
    "3.2":
      title: "Predictable"
      criteria:
        "3.2.1":
          level: "A"
          name: "On Focus"
          description: "Focus does not initiate change of context"
        "3.2.2":
          level: "A"
          name: "On Input"
          description: "Changing setting does not automatically change context"
        "3.2.3":
          level: "AA"
          name: "Consistent Navigation"
          description: "Navigation mechanisms repeated on multiple pages are consistent"
        "3.2.4":
          level: "AA"
          name: "Consistent Identification"
          description: "Components with same functionality are identified consistently"
    
    "3.3":
      title: "Input Assistance"
      criteria:
        "3.3.1":
          level: "A"
          name: "Error Identification"
          description: "Input errors are identified and described in text"
          code_pattern: |
            <!-- Error message -->
            <label for="email">Email Address</label>
            <input type="email" id="email" aria-invalid="true" 
                   aria-describedby="email-error">
            <span id="email-error" class="error">
              Please enter a valid email address.
            </span>
        "3.3.2":
          level: "A"
          name: "Labels or Instructions"
          description: "Labels or instructions provided for user input"
        "3.3.3":
          level: "AA"
          name: "Error Suggestion"
          description: "Suggestions provided when input errors detected"
        "3.3.4":
          level: "AA"
          name: "Error Prevention (Legal, Financial, Data)"
          description: "Submissions are reversible, checked, or confirmed"
  
  robust:
    "4.1":
      title: "Compatible"
      criteria:
        "4.1.1":
          level: "A"
          name: "Parsing"
          description: "Markup has complete start/end tags, nested correctly"
        "4.1.2":
          level: "A"
          name: "Name, Role, Value"
          description: "UI components have accessible name, role, state, value"
          code_pattern: |
            <!-- Custom checkbox with ARIA -->
            <div role="checkbox" aria-checked="false" tabindex="0"
                 aria-labelledby="checkbox-label">
              <span id="checkbox-label">Accept terms and conditions</span>
            </div>
        "4.1.3":
          level: "AA"
          name: "Status Messages"
          description: "Status messages can be programmatically determined"
          code_pattern: |
            <!-- Live region for dynamic updates -->
            <div role="status" aria-live="polite">
              Form submitted successfully.
            </div>
            
            <!-- Alert for important messages -->
            <div role="alert">
              Error: Please correct the highlighted fields.
            </div>

# =============================================================================
# TESTING TOOLS
# =============================================================================

testing:
  automated_tools:
    - name: "axe DevTools"
      url: "https://www.deque.com/axe/"
      coverage: "~30-40% of issues"
    - name: "WAVE"
      url: "https://wave.webaim.org/"
      coverage: "~30-40% of issues"
    - name: "Lighthouse"
      url: "Built into Chrome DevTools"
      coverage: "~30-40% of issues"
    - name: "Pa11y"
      url: "https://pa11y.org/"
      coverage: "~30-40% of issues"
  
  manual_testing:
    keyboard:
      - "Can all interactive elements receive focus?"
      - "Is focus order logical?"
      - "Is focus indicator visible?"
      - "Can all functions be completed with keyboard?"
    
    screen_reader:
      tools: ["NVDA (Windows)", "VoiceOver (Mac/iOS)", "JAWS (Windows)"]
      checks:
        - "Are images described appropriately?"
        - "Are form fields properly labeled?"
        - "Is content read in logical order?"
        - "Are state changes announced?"
    
    zoom:
      - "Test at 200% zoom"
      - "Ensure content reflows without horizontal scroll"
      - "Verify text remains readable"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/DOCUMENTATION/ui-ux-best-practices.yaml"
  
  related_standards:
    - "Section 508 (U.S. federal)"
    - "EN 301 549 (EU)"
    - "ADA Title III"
