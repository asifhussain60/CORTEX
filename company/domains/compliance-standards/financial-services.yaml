# Financial Services Compliance (SOX, GLBA, PSD2)
# Sarbanes-Oxley, Gramm-Leach-Bliley, Payment Services Directive 2
# Authority: U.S. SEC, U.S. FTC, European Union
# Version: 1.0
# Last Updated: 2026-01-28

metadata:
  standard_id: "FINANCIAL-SERVICES"
  version: "1.0"
  standards_included:
    - "SOX (Sarbanes-Oxley Act 2002)"
    - "GLBA (Gramm-Leach-Bliley Act 1999)"
    - "PSD2 (Payment Services Directive 2)"
  applies_to:
    - "Public companies (SOX)"
    - "Financial institutions (GLBA)"
    - "Payment service providers in EU (PSD2)"

# =============================================================================
# SARBANES-OXLEY ACT (SOX)
# =============================================================================

sox:
  description: "U.S. federal law for financial reporting accuracy and corporate accountability"
  governing_body: "U.S. Securities and Exchange Commission (SEC)"
  applies_to: "All public companies trading on U.S. exchanges"
  public_reference: "https://www.sec.gov/spotlight/sarbanes-oxley.htm"
  
  key_sections:
    section_302:
      title: "Corporate Responsibility for Financial Reports"
      requirements:
        - "CEO/CFO must certify financial reports"
        - "Certify internal controls are effective"
        - "Report any deficiencies to auditors and audit committee"
      implementation:
        - "Establish certification workflow"
        - "Document control effectiveness"
        - "Track deficiency remediation"
    
    section_404:
      title: "Management Assessment of Internal Controls"
      requirements:
        - "Annual assessment of internal control effectiveness"
        - "Auditor attestation on management's assessment"
        - "Document control framework"
      implementation:
        - "Implement control framework (COSO, COBIT)"
        - "Test controls periodically"
        - "Maintain evidence of control operation"
    
    section_409:
      title: "Real-Time Disclosure"
      requirements:
        - "Disclose material changes in financial condition 'on a rapid and current basis'"
      implementation:
        - "Establish disclosure committee"
        - "Monitor for material events"
        - "Rapid filing procedures"
    
    section_802:
      title: "Document Retention"
      requirements:
        - "Retain audit workpapers for 7 years"
        - "Criminal penalties for document destruction"
      implementation:
        - "Document retention policy"
        - "Legal hold procedures"
        - "Audit trail preservation"
  
  it_controls:
    description: "IT general controls supporting SOX compliance"
    categories:
      access_controls:
        - "User access management"
        - "Segregation of duties"
        - "Privileged access monitoring"
      change_management:
        - "Formal change approval process"
        - "Segregation of development and production"
        - "Testing before production deployment"
      computer_operations:
        - "Job scheduling controls"
        - "Backup and recovery procedures"
        - "Incident management"
      system_development:
        - "SDLC methodology"
        - "Security in development"
        - "Testing requirements"
    code_pattern: |
      class SOXAuditTrail:
          """SOX-compliant audit trail for financial transactions."""
          
          def log_transaction(self, transaction: FinancialTransaction):
              """Log all financial transactions with full audit trail."""
              audit_entry = {
                  "transaction_id": transaction.id,
                  "timestamp": datetime.utcnow().isoformat(),
                  "user_id": get_current_user(),
                  "action": transaction.action,
                  "amount": str(transaction.amount),  # String to preserve precision
                  "account_from": transaction.source,
                  "account_to": transaction.destination,
                  "approver": transaction.approved_by,
                  "system": get_system_identifier(),
                  "ip_address": get_client_ip(),
              }
              # Immutable log - cannot be modified
              append_to_immutable_log(audit_entry)
          
          def log_control_exception(self, control_id: str, exception: str):
              """Log any control exceptions for SOX reporting."""
              exception_log = {
                  "control_id": control_id,
                  "timestamp": datetime.utcnow().isoformat(),
                  "exception_description": exception,
                  "reported_by": get_current_user(),
                  "status": "OPEN",
              }
              notify_audit_committee(exception_log)
              append_to_exception_log(exception_log)

# =============================================================================
# GRAMM-LEACH-BLILEY ACT (GLBA)
# =============================================================================

glba:
  description: "U.S. federal law requiring financial institutions to protect customer data"
  governing_body: "U.S. Federal Trade Commission (FTC)"
  applies_to: "Financial institutions (banks, securities firms, insurance companies, etc.)"
  public_reference: "https://www.ftc.gov/business-guidance/privacy-security/gramm-leach-bliley-act"
  
  rules:
    financial_privacy_rule:
      description: "Governs collection and disclosure of customer financial information"
      requirements:
        - "Provide privacy notice at customer relationship start"
        - "Annual privacy notice"
        - "Describe information sharing practices"
        - "Allow opt-out of sharing with non-affiliates"
      implementation:
        initial_notice: "Before sharing NPI, at relationship establishment"
        annual_notice: "Yearly to all customers"
        opt_out: "Reasonable opportunity before sharing"
    
    safeguards_rule:
      description: "Requires security program for customer information"
      requirements:
        - "Written information security program"
        - "Designate employee to coordinate"
        - "Identify risks to customer information"
        - "Design and implement safeguards"
        - "Select appropriate service providers"
        - "Evaluate and adjust program"
      elements:
        risk_assessment:
          - "Identify internal and external risks"
          - "Assess current safeguards"
          - "Document findings"
        safeguards:
          - "Employee training"
          - "Information systems security"
          - "System failure prevention"
          - "Information disposal"
        service_providers:
          - "Due diligence in selection"
          - "Contractual requirements"
          - "Monitor compliance"
      code_pattern: |
        class GLBASafeguards:
            """GLBA Safeguards Rule implementation."""
            
            def __init__(self):
                self.security_coordinator = get_designated_coordinator()
            
            def assess_risk(self, system_component: str) -> RiskAssessment:
                """Conduct risk assessment per GLBA requirements."""
                internal_risks = self.identify_internal_risks(system_component)
                external_risks = self.identify_external_risks(system_component)
                current_controls = self.evaluate_current_controls(system_component)
                
                return RiskAssessment(
                    component=system_component,
                    risks=internal_risks + external_risks,
                    controls=current_controls,
                    gaps=self.identify_gaps(current_controls),
                    recommendations=self.generate_recommendations()
                )
            
            def verify_service_provider(self, provider: ServiceProvider) -> bool:
                """Verify service provider meets GLBA requirements."""
                checks = [
                    self.has_written_security_program(provider),
                    self.has_contractual_safeguards(provider),
                    self.allows_audit_rights(provider),
                    self.has_incident_notification(provider),
                ]
                return all(checks)
    
    pretexting_rule:
      description: "Prohibits obtaining customer information through false pretenses"
      requirements:
        - "Implement procedures to detect pretexting"
        - "Train employees on social engineering"
        - "Verify identity before disclosing information"
  
  nonpublic_personal_information:
    description: "NPI protected under GLBA"
    categories:
      - "Financial information provided by consumer"
      - "Information from transactions"
      - "Information from third parties"
    examples:
      - "Account numbers"
      - "Income"
      - "Credit history"
      - "Social Security number"
      - "Account balances"
      - "Transaction history"

# =============================================================================
# PAYMENT SERVICES DIRECTIVE 2 (PSD2)
# =============================================================================

psd2:
  description: "EU directive regulating payment services and open banking"
  governing_body: "European Union"
  applies_to: "Payment service providers operating in EU/EEA"
  public_reference: "https://ec.europa.eu/info/law/payment-services-psd-2-directive-eu-2015-2366_en"
  
  key_requirements:
    strong_customer_authentication:
      description: "SCA - Multi-factor authentication for electronic payments"
      requirements:
        - "Two or more independent authentication factors"
        - "Dynamic linking for remote transactions"
        - "Independence of elements"
      factors:
        knowledge: "Something the user knows (password, PIN)"
        possession: "Something the user has (phone, token)"
        inherence: "Something the user is (biometric)"
      exemptions:
        - "Low-value transactions (under €30)"
        - "Trusted beneficiaries"
        - "Recurring transactions (same amount, same payee)"
        - "Secure corporate payments"
        - "Transaction risk analysis"
      code_pattern: |
        class PSD2Authentication:
            """PSD2-compliant Strong Customer Authentication."""
            
            def authenticate_payment(
                self,
                user: User,
                transaction: Transaction
            ) -> AuthResult:
                """Perform SCA for payment transaction."""
                # Check for exemptions
                if self.qualifies_for_exemption(transaction):
                    return AuthResult(authenticated=True, sca_exempt=True)
                
                # Require two factors
                factors_verified = []
                
                # Factor 1: Knowledge
                if self.verify_pin(user):
                    factors_verified.append("knowledge")
                
                # Factor 2: Possession (via mobile app)
                if self.verify_device_possession(user):
                    factors_verified.append("possession")
                
                # Factor 3: Inherence (biometric)
                if self.verify_biometric(user):
                    factors_verified.append("inherence")
                
                # Must have at least 2 factors
                if len(factors_verified) < 2:
                    return AuthResult(
                        authenticated=False,
                        reason="Insufficient authentication factors"
                    )
                
                # Dynamic linking - bind auth to transaction details
                auth_code = self.generate_dynamic_link(
                    amount=transaction.amount,
                    payee=transaction.payee
                )
                
                return AuthResult(
                    authenticated=True,
                    factors=factors_verified,
                    auth_code=auth_code
                )
    
    open_banking:
      description: "Third-party access to accounts via APIs"
      requirements:
        - "Account Information Service Providers (AISP) access"
        - "Payment Initiation Service Providers (PISP) access"
        - "Dedicated interface (API) for TPPs"
        - "Real-time or near-real-time access"
      api_requirements:
        - "Same availability as customer-facing interface"
        - "Same performance as customer-facing interface"
        - "Documented, standardized APIs"
      consent:
        - "Explicit customer consent required"
        - "Consent for specific accounts"
        - "Consent expires after 90 days (AISP)"
    
    security_requirements:
      - "Secure communication (TLS 1.2+)"
      - "eIDAS certificates for identification"
      - "Transaction monitoring and fraud detection"
      - "Incident reporting within 4 hours (major incidents)"
    
    liability:
      unauthorized_transactions:
        - "PSP liable unless customer fraud or gross negligence"
        - "Customer liability capped at €50 before notification"
        - "PSP must refund immediately, investigate later"

