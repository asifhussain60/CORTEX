# =============================================================================
# KEY CONTROLS (Selected High-Impact Controls)
# =============================================================================

key_controls:
  access_control:
    AC-1:
      name: "Policy and Procedures"
      description: "Develop, document, and disseminate access control policy"
      implementation:
        - "Document access control policy"
        - "Review and update annually"
        - "Disseminate to relevant personnel"
    
    AC-2:
      name: "Account Management"
      description: "Manage system accounts throughout lifecycle"
      implementation:
        - "Define account types and assign managers"
        - "Establish conditions for group membership"
        - "Require approvals for account requests"
        - "Create, enable, modify, disable, remove accounts"
        - "Monitor account usage"
        - "Review accounts periodically"
      code_pattern: |
        class NISTAccountManagement:
            """NIST 800-53 AC-2 Account Management."""
            
            def create_account(self, request: AccountRequest) -> Account:
                """Create account with proper authorization (AC-2)."""
                # Verify approval
                if not request.has_manager_approval():
                    raise AccountCreationDenied("Manager approval required")
                
                # Verify conditions for account type
                if not self.meets_conditions(request.account_type, request.user):
                    raise AccountCreationDenied("Does not meet account conditions")
                
                # Create with audit trail
                account = Account(
                    user=request.user,
                    account_type=request.account_type,
                    created_by=get_current_admin(),
                    created_at=datetime.utcnow(),
                    review_date=self.calculate_review_date(request.account_type),
                    conditions=request.conditions
                )
                
                self.log_account_event("CREATE", account)
                return account
    
    AC-3:
      name: "Access Enforcement"
      description: "Enforce approved authorizations for logical access"
      implementation:
        - "Implement access control mechanisms"
        - "Enforce role-based or attribute-based access"
        - "Deny by default"
    
    AC-6:
      name: "Least Privilege"
      description: "Employ principle of least privilege"
      implementation:
        - "Authorize minimum access necessary"
        - "Restrict privileged accounts"
        - "Prohibit non-privileged users from privileged functions"
    
    AC-17:
      name: "Remote Access"
      description: "Establish usage restrictions for remote access"
      implementation:
        - "Document remote access methods"
        - "Enforce remote access policies"
        - "Authorize remote access before connection"
        - "Monitor for unauthorized access"
  
  audit_accountability:
    AU-2:
      name: "Event Logging"
      description: "Identify events to be logged"
      events:
        - "Account creation, modification, deletion"
        - "Successful and unsuccessful logon attempts"
        - "Privileged operations"
        - "Security-relevant events"
        - "Application-specific events"
    
    AU-3:
      name: "Content of Audit Records"
      description: "Audit records contain required information"
      required_fields:
        - "What type of event occurred"
        - "When the event occurred"
        - "Where the event occurred"
        - "Source of the event"
        - "Outcome of the event"
        - "Identity of individuals/subjects"
    
    AU-6:
      name: "Audit Record Review, Analysis, and Reporting"
      description: "Review and analyze audit records"
      implementation:
        - "Review logs at defined frequency"
        - "Analyze for indicators of compromise"
        - "Report findings to designated officials"
    
    AU-9:
      name: "Protection of Audit Information"
      description: "Protect audit information from unauthorized access"
      implementation:
        - "Restrict access to audit logs"
        - "Protect from modification"
        - "Protect from deletion"
      code_pattern: |
        class NISTAuditProtection:
            """NIST 800-53 AU-9 Audit Information Protection."""
            
            def __init__(self):
                self.audit_storage = ImmutableStorage()
                self.authorized_readers = get_audit_readers()
            
            def write_audit_record(self, record: AuditRecord) -> None:
                """Write audit record to protected storage."""
                # Append-only storage (no modification/deletion)
                self.audit_storage.append(record)
                
                # Replicate to backup location
                self.replicate_to_backup(record)
            
            def read_audit_records(self, user: User, query: AuditQuery) -> list:
                """Read audit records with access control."""
                if user.id not in self.authorized_readers:
                    self.log_unauthorized_access(user, query)
                    raise AuditAccessDenied("Not authorized to read audit logs")
                
                return self.audit_storage.query(query)
  
  identification_authentication:
    IA-2:
      name: "Identification and Authentication (Organizational Users)"
      description: "Uniquely identify and authenticate organizational users"
      implementation:
        - "Implement unique user identification"
        - "Authenticate before access granted"
        - "Implement MFA for privileged accounts"
        - "Implement MFA for network access"
    
    IA-5:
      name: "Authenticator Management"
      description: "Manage system authenticators"
      implementation:
        - "Verify identity before issuing authenticators"
        - "Establish initial authenticator content"
        - "Ensure authenticators have sufficient strength"
        - "Establish procedures for lost/compromised authenticators"
        - "Change default authenticators"
    
    IA-8:
      name: "Identification and Authentication (Non-Organizational Users)"
      description: "Identify and authenticate non-organizational users"
      implementation:
        - "Identify non-organizational users"
        - "Authenticate before access"
        - "Accept only approved credentials"
  
  system_communications_protection:
    SC-8:
      name: "Transmission Confidentiality and Integrity"
      description: "Protect transmitted information"
      implementation:
        - "Employ cryptographic mechanisms"
        - "Protect confidentiality"
        - "Protect integrity"
      code_pattern: |
        # NIST 800-53 SC-8 Transmission Protection
        TLS_CONFIG = {
            "min_version": "TLSv1.2",  # SC-8(1)
            "cipher_suites": [
                "TLS_AES_256_GCM_SHA384",
                "TLS_CHACHA20_POLY1305_SHA256",
            ],
            "certificate_verification": True,
            "perfect_forward_secrecy": True,
        }
    
    SC-12:
      name: "Cryptographic Key Establishment and Management"
      description: "Establish and manage cryptographic keys"
      implementation:
        - "Use approved key generation"
        - "Use approved key exchange"
        - "Protect key integrity"
        - "Manage key lifecycle"
    
    SC-13:
      name: "Cryptographic Protection"
      description: "Implement cryptographic mechanisms"
      approved_algorithms:
        encryption: ["AES-256", "AES-128"]
        hashing: ["SHA-256", "SHA-384", "SHA-512"]
        key_exchange: ["ECDH", "DH"]
        signatures: ["RSA-2048+", "ECDSA"]
    
    SC-28:
      name: "Protection of Information at Rest"
      description: "Protect information at rest"
      implementation:
        - "Encrypt sensitive information at rest"
        - "Use approved encryption algorithms"
        - "Manage encryption keys"
  
  incident_response:
    IR-4:
      name: "Incident Handling"
      description: "Implement incident handling capability"
      phases:
        - "Preparation"
        - "Detection and analysis"
        - "Containment, eradication, and recovery"
        - "Post-incident activity"
    
    IR-6:
      name: "Incident Reporting"
      description: "Report incidents to appropriate authorities"
      implementation:
        - "Define reporting requirements"
        - "Establish reporting timelines"
        - "Document and report incidents"
  
  configuration_management:
    CM-2:
      name: "Baseline Configuration"
      description: "Develop and maintain baseline configurations"
      implementation:
        - "Document current baseline"
        - "Review and update as required"
        - "Maintain under configuration control"
    
    CM-3:
      name: "Configuration Change Control"
      description: "Track, review, approve, and audit changes"
      implementation:
        - "Document change requests"
        - "Review proposed changes"
        - "Approve or disapprove changes"
        - "Implement approved changes"
        - "Audit changes"
    
    CM-6:
      name: "Configuration Settings"
      description: "Establish configuration settings"
      implementation:
        - "Define mandatory settings"
        - "Implement settings"
        - "Monitor for deviations"

# =============================================================================
# CONTROL BASELINES
# =============================================================================

control_baselines:
  description: "NIST defines minimum controls for system impact levels"
  
  low_impact:
    description: "Systems where loss would have limited adverse effect"
    control_count: "~125 controls"
    key_controls:
      - "AC-1, AC-2, AC-3, AC-17"
      - "AU-2, AU-3, AU-6"
      - "CM-2, CM-6"
      - "IA-2, IA-5"
      - "SC-8, SC-13"
  
  moderate_impact:
    description: "Systems where loss would have serious adverse effect"
    control_count: "~260 controls"
    additional_controls:
      - "AC-2(1), AC-6(1,2,5,9,10)"
      - "AU-12"
      - "CM-3, CM-5"
      - "IA-2(1,2,8,12)"
      - "SC-8(1), SC-28"
  
  high_impact:
    description: "Systems where loss would have severe or catastrophic effect"
    control_count: "~340 controls"
    additional_controls:
      - "AC-2(2,3,4,13)"
      - "AU-6(1,3)"
      - "CM-3(2)"
      - "IA-2(5)"
      - "SC-28(1)"

# =============================================================================
# COMPLIANCE MAPPING
# =============================================================================

compliance_mapping:
  to_fedramp:
    description: "NIST 800-53 is foundation for FedRAMP"
    mapping: "FedRAMP uses NIST 800-53 controls with additional parameters"
  
  to_iso27001:
    description: "Many controls map to ISO 27001 Annex A"
    note: "NIST provides more granular, prescriptive controls"
  
  to_soc2:
    description: "NIST controls support SOC 2 trust services criteria"
    mapping: "Security criteria (CC) largely covered by NIST AC, AU, SC, SI families"

