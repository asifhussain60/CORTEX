# ============================================================================
# SECURITY RULES FOR KASHKOLE
# ============================================================================

rules:
  - id: KASHKOLE-SEC-001
    name: no_hardcoded_secrets
    description: No secrets in source code or config files
    enforcement: pre-commit
    patterns:
      - "password\\s*=\\s*[\"'][^\"']+[\"']"
      - "apikey\\s*=\\s*[\"'][^\"']+[\"']"
      - "secret\\s*=\\s*[\"'][^\"']+[\"']"
    exclude:
      - "*.example"
      - "*.template"
      
  - id: KASHKOLE-SEC-002
    name: connection_string_security
    description: Connection strings must use Integrated Security or Key Vault
    enforcement: code-review
    
  - id: KASHKOLE-SEC-003
    name: input_validation_required
    description: All user inputs must be validated and sanitized
    enforcement: code-review
    applies_to:
      - "*.aspx"
      - "*.aspx.vb"
      - "*.asmx"

