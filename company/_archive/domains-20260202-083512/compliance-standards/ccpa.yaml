# CCPA/CPRA Compliance Standard
# California Consumer Privacy Act / California Privacy Rights Act
# Authority: State of California
# Source: https://oag.ca.gov/privacy/ccpa
# Version: CPRA (2023 amendments)
# Last Updated: 2026-01-28

metadata:
  standard_id: "CCPA"
  version: "CPRA-2023"
  governing_body: "State of California / California Privacy Protection Agency"
  effective_date: "2020-01-01 (CCPA), 2023-01-01 (CPRA)"
  applies_to:
    - "For-profit businesses collecting California residents' personal information"
    - "Annual gross revenue over $25 million"
    - "Buy, sell, share PI of 100,000+ consumers/households"
    - "50%+ revenue from selling/sharing PI"
  public_reference: "https://oag.ca.gov/privacy/ccpa"
  penalties:
    intentional: "$7,500 per violation"
    unintentional: "$2,500 per violation"
    minor_data: "$7,500 per violation involving minors"

# =============================================================================
# KEY DEFINITIONS
# =============================================================================

definitions:
  personal_information:
    description: "Information that identifies, relates to, or could be linked to a consumer or household"
    categories:
      identifiers:
        - "Name"
        - "Postal address"
        - "Email address"
        - "Account name"
        - "SSN"
        - "Driver's license"
        - "Passport number"
        - "IP address"
      commercial_information:
        - "Purchase history"
        - "Products/services purchased"
        - "Consuming histories/tendencies"
      biometric:
        - "Fingerprints"
        - "Face geometry"
        - "Voice recordings"
        - "Keystroke patterns"
      internet_activity:
        - "Browsing history"
        - "Search history"
        - "Interaction with websites/apps"
      geolocation:
        - "Precise location data"
      professional:
        - "Employment history"
        - "Professional information"
      education:
        - "Education records (non-FERPA)"
      inferences:
        - "Profiles reflecting preferences"
        - "Characteristics"
        - "Behavior"
        - "Attitudes"
  
  sensitive_personal_information:
    description: "CPRA category requiring additional protections"
    categories:
      - "SSN, driver's license, state ID, passport"
      - "Account log-in with password/credentials"
      - "Precise geolocation"
      - "Racial/ethnic origin"
      - "Religious/philosophical beliefs"
      - "Union membership"
      - "Genetic data"
      - "Biometric data for identification"
      - "Health information"
      - "Sex life/sexual orientation"
      - "Contents of mail/email/text (unless business is recipient)"
  
  sale:
    description: "Selling, renting, releasing, disclosing, disseminating, making available, transferring for monetary or other valuable consideration"
  
  share:
    description: "Sharing for cross-context behavioral advertising (CPRA addition)"

# =============================================================================
# CONSUMER RIGHTS
# =============================================================================

consumer_rights:
  right_to_know:
    description: "Right to know what PI is collected and how it's used"
    requirements:
      at_collection:
        - "Categories of PI collected"
        - "Purposes for collection"
        - "Whether PI is sold or shared"
      upon_request:
        - "Specific pieces of PI collected"
        - "Categories of PI collected"
        - "Sources of PI"
        - "Business/commercial purpose"
        - "Categories of third parties shared with"
    timeline: "45 days (90 days with extension)"
    code_pattern: |
      async def handle_know_request(consumer_id: str) -> KnowResponse:
          """Handle CCPA Right to Know request."""
          # Verify consumer identity
          await verify_consumer_identity(consumer_id)
          
          # Collect PI from all sources
          pi_collected = await get_all_pi(consumer_id)
          
          return KnowResponse(
              specific_pieces=pi_collected.data,
              categories=pi_collected.categories,
              sources=pi_collected.sources,
              purposes=get_collection_purposes(),
              third_parties=get_sharing_partners(),
              collection_period="12 months"
          )
  
  right_to_delete:
    description: "Right to request deletion of PI"
    requirements:
      - "Delete PI from records"
      - "Direct service providers to delete"
      - "Direct third parties to delete (CPRA)"
    exceptions:
      - "Complete transaction"
      - "Security purposes"
      - "Legal obligations"
      - "Internal uses aligned with consumer expectations"
    timeline: "45 days (90 days with extension)"
  
  right_to_correct:
    description: "Right to correct inaccurate PI (CPRA)"
    requirements:
      - "Allow consumers to request correction"
      - "Use commercially reasonable efforts to correct"
      - "Consider nature and documentation"
    timeline: "45 days (90 days with extension)"
  
  right_to_opt_out:
    description: "Right to opt out of sale/sharing"
    requirements:
      - "Clear 'Do Not Sell or Share My Personal Information' link"
      - "Honor opt-out requests"
      - "Don't require account creation to opt out"
      - "Wait 12 months before asking to opt back in"
    global_privacy_control:
      description: "Must honor GPC browser signals"
      implementation: "Treat as valid opt-out request"
    code_pattern: |
      def check_opt_out_status(consumer_id: str, request: Request) -> bool:
          """Check if consumer has opted out of sale/sharing."""
          # Check explicit opt-out
          if has_explicit_opt_out(consumer_id):
              return True
          
          # Check Global Privacy Control signal (CPRA requirement)
          gpc_header = request.headers.get("Sec-GPC")
          if gpc_header == "1":
              return True
          
          # Check DNT (optional, not required)
          # dnt_header = request.headers.get("DNT")
          
          return False
  
  right_to_limit:
    description: "Right to limit use of sensitive PI (CPRA)"
    requirements:
      - "'Limit Use of My Sensitive Personal Information' link"
      - "Limit to purposes necessary for services"
      - "Don't use for profiling without consent"
  
  right_to_non_discrimination:
    description: "Cannot discriminate for exercising rights"
    prohibited:
      - "Denying goods or services"
      - "Charging different prices"
      - "Providing different quality"
      - "Threatening any of above"
    allowed:
      - "Financial incentive programs with notice"
      - "Price differences reflecting PI value"
  
  right_to_portability:
    description: "Right to receive PI in portable format (CPRA)"
    requirements:
      - "Structured, commonly used format"
      - "Machine-readable"
      - "Transmit to another entity on request"

# =============================================================================
# BUSINESS OBLIGATIONS
# =============================================================================

business_obligations:
  privacy_notice:
    description: "Provide comprehensive privacy policy"
    required_contents:
      - "Categories of PI collected"
      - "Purposes for each category"
      - "Categories of third parties shared with"
      - "Categories sold/shared in past 12 months"
      - "Retention periods by category"
      - "Consumer rights description"
      - "How to submit requests"
      - "Opt-out link"
      - "Last updated date"
    updates: "Review and update annually"
  
  notice_at_collection:
    description: "Notice before or at point of collection"
    required_contents:
      - "Categories being collected"
      - "Purposes for collection"
      - "Link to full privacy policy"
      - "Whether sold or shared"
      - "Retention periods"
  
  data_minimization:
    description: "CPRA requirement to limit collection"
    requirements:
      - "Collect only what is necessary"
      - "Retain only as long as necessary"
      - "Document necessity for each data element"
  
  service_provider_contracts:
    description: "Contractual requirements for vendors"
    required_terms:
      - "Prohibit selling/sharing PI"
      - "Prohibit retention/use beyond contract"
      - "Require compliance with CCPA"
      - "Allow audits"
      - "Require notification of subcontractors"
  
  security:
    description: "Implement reasonable security measures"
    requirements:
      - "Reasonable security procedures and practices"
      - "Appropriate to nature of information"
    note: "Lack of reasonable security can result in private right of action for breaches"

# =============================================================================
# RESPONDING TO REQUESTS
# =============================================================================

request_handling:
  verification:
    description: "Must verify consumer identity before fulfilling requests"
    methods:
      - "Password-protected account login"
      - "Verification questions"
      - "Third-party identity verification"
    standards:
      know_request: "Reasonable degree of certainty"
      delete_request: "Reasonable degree of certainty"
      sensitive_info: "Reasonably high degree of certainty"
  
  request_methods:
    required:
      - "Toll-free phone number"
      - "Website or email address"
    if_online_only:
      - "Interactive web form"
  
  timeline:
    acknowledge: "10 business days"
    respond: "45 calendar days"
    extension: "Additional 45 days with notice"
  
  response_format:
    know_requests:
      - "Cover 12-month period"
      - "Portable format if requested"
      - "Free of charge"
    delete_requests:
      - "Confirm deletion"
      - "Note any exceptions applied"
  
  request_limits:
    know_requests: "2 per 12-month period"
    delete_requests: "No limit specified"

# =============================================================================
# MINORS
# =============================================================================

minors:
  under_13:
    description: "Affirmative opt-in required for sale/sharing"
    requirement: "Parent/guardian must opt in"
  
  age_13_to_15:
    description: "Affirmative opt-in required for sale/sharing"
    requirement: "Minor must opt in directly"
  
  age_16_plus:
    description: "Standard opt-out rules apply"

# =============================================================================
# ENFORCEMENT
# =============================================================================

enforcement:
  california_privacy_protection_agency:
    description: "CPRA created dedicated enforcement agency"
    powers:
      - "Investigate violations"
      - "Enforce regulations"
      - "Issue fines"
  
  attorney_general:
    description: "Can bring enforcement actions"
    cure_period: "None under CPRA (removed 30-day cure)"
  
  private_right_of_action:
    description: "Limited to data breaches"
    requirements:
      - "Breach of nonencrypted/nonredacted PI"
      - "Result of failure to implement reasonable security"
    damages:
      statutory: "$100-$750 per consumer per incident"
      actual: "Actual damages if greater"
    cure_period: "30 days before statutory damages"

# =============================================================================
# COMPLIANCE CHECKLIST
# =============================================================================

compliance_checklist:
  critical_requirements:
    - "Privacy policy with all required disclosures"
    - "Notice at collection"
    - "'Do Not Sell or Share' link on homepage"
    - "'Limit Use of Sensitive PI' link on homepage"
    - "Global Privacy Control support"
    - "Request intake mechanisms (phone + web)"
    - "Verification procedures"
    - "Service provider contracts updated"
    - "Data inventory and mapping"
    
  common_violations:
    - "Missing or incomplete privacy policy"
    - "No opt-out mechanism"
    - "Ignoring GPC signals"
    - "Failing to verify identity"
    - "Late responses to requests"
    - "Discrimination for exercising rights"
    - "Inadequate service provider contracts"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#data_retention"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#audit_logging"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#data_masking"
  
  related_standards:
    - "gdpr"
    - "pii-protection"
