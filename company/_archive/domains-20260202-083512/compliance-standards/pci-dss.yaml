# PCI-DSS Compliance Standard
# Payment Card Industry Data Security Standard v4.0
# Authority: PCI Security Standards Council
# Source: https://www.pcisecuritystandards.org/
# Version: 4.0 (March 2022)
# Last Updated: 2026-01-28

metadata:
  standard_id: "PCI-DSS"
  version: "4.0"
  governing_body: "PCI Security Standards Council"
  effective_date: "2022-03-31"
  mandatory_date: "2025-03-31"
  applies_to:
    - "Organizations that store, process, or transmit cardholder data"
    - "Service providers handling payment card data"
  public_reference: "https://www.pcisecuritystandards.org/document_library/"

# =============================================================================
# REQUIREMENTS OVERVIEW
# =============================================================================

requirements:
  build_and_maintain_secure_network:
    requirement_1:
      id: "1"
      title: "Install and maintain network security controls"
      objectives:
        - "Define and implement firewall and router configurations"
        - "Restrict inbound and outbound traffic"
        - "Review firewall rules at least every 6 months"
      controls:
        - id: "1.1"
          description: "Network security control configuration standards defined"
        - id: "1.2"
          description: "Network security controls configured and maintained"
        - id: "1.3"
          description: "Network access to cardholder data environment restricted"
        - id: "1.4"
          description: "Network connections between trusted and untrusted controlled"
        - id: "1.5"
          description: "Risks to CDE from computing devices mitigated"
    
    requirement_2:
      id: "2"
      title: "Apply secure configurations to all system components"
      objectives:
        - "Change vendor-supplied defaults"
        - "Develop configuration standards for all system types"
        - "Manage security configurations"
      controls:
        - id: "2.1"
          description: "Secure configuration processes defined and understood"
        - id: "2.2"
          description: "System components configured and managed securely"
        - id: "2.3"
          description: "Wireless environments configured and managed securely"

  protect_account_data:
    requirement_3:
      id: "3"
      title: "Protect stored account data"
      objectives:
        - "Minimize data storage and retention"
        - "Protect stored PAN with strong cryptography"
        - "Never store sensitive authentication data after authorization"
      controls:
        - id: "3.1"
          description: "Storage of account data minimized"
        - id: "3.2"
          description: "Sensitive authentication data not stored after authorization"
        - id: "3.3"
          description: "PAN masked when displayed"
        - id: "3.4"
          description: "PAN secured wherever stored"
        - id: "3.5"
          description: "PAN secured wherever transmitted"
        - id: "3.6"
          description: "Cryptographic keys protected"
        - id: "3.7"
          description: "Where cryptography used, key management processes defined"
      code_patterns:
        mask_pan: |
          def mask_pan(pan: str) -> str:
              """Mask PAN showing only first 6 and last 4 digits (PCI-DSS 3.3)."""
              if len(pan) < 13:
                  raise ValueError("Invalid PAN length")
              return f"{pan[:6]}{'*' * (len(pan) - 10)}{pan[-4:]}"
        
        never_store: |
          # PROHIBITED DATA - Never store after authorization:
          # - Full track data (magnetic stripe)
          # - CVV/CVC/CAV2
          # - PIN/PIN block
    
    requirement_4:
      id: "4"
      title: "Protect cardholder data with strong cryptography during transmission"
      objectives:
        - "Use strong cryptography for transmission over open networks"
        - "Never send unprotected PANs via end-user messaging"
      controls:
        - id: "4.1"
          description: "Strong cryptography protects CHD during transmission"
        - id: "4.2"
          description: "PAN secured when sent via end-user messaging technologies"
      code_patterns:
        tls_requirements: |
          # Minimum TLS Configuration for PCI-DSS
          TLS_MIN_VERSION = "TLSv1.2"
          TLS_PREFERRED_VERSION = "TLSv1.3"
          
          ALLOWED_CIPHER_SUITES = [
              "TLS_AES_256_GCM_SHA384",
              "TLS_CHACHA20_POLY1305_SHA256",
              "TLS_AES_128_GCM_SHA256",
          ]

  maintain_vulnerability_management:
    requirement_5:
      id: "5"
      title: "Protect all systems and networks from malicious software"
      objectives:
        - "Deploy anti-malware solutions on all commonly affected systems"
        - "Ensure anti-malware mechanisms are current and active"
      controls:
        - id: "5.1"
          description: "Anti-malware solutions deployed and maintained"
        - id: "5.2"
          description: "Malicious software is prevented or detected and addressed"
        - id: "5.3"
          description: "Anti-malware mechanisms actively running and cannot be disabled"
        - id: "5.4"
          description: "Anti-phishing mechanisms protect against phishing attacks"
    
    requirement_6:
      id: "6"
      title: "Develop and maintain secure systems and software"
      objectives:
        - "Identify and address security vulnerabilities"
        - "Develop software securely"
        - "Protect web applications from attacks"
      controls:
        - id: "6.1"
          description: "Security vulnerabilities identified and addressed"
        - id: "6.2"
          description: "Bespoke and custom software developed securely"
        - id: "6.3"
          description: "Security vulnerabilities identified and addressed"
        - id: "6.4"
          description: "Public-facing web applications protected against attacks"
        - id: "6.5"
          description: "Changes to all system components managed securely"

  implement_strong_access_control:
    requirement_7:
      id: "7"
      title: "Restrict access to system components and cardholder data by business need"
      objectives:
        - "Limit access to system components to only those needed"
        - "Access is granted based on job classification and function"
      controls:
        - id: "7.1"
          description: "Access to system components and data restricted by business need"
        - id: "7.2"
          description: "Access to system components and data appropriately defined"
        - id: "7.3"
          description: "Access to system components and data managed via access control"
    
    requirement_8:
      id: "8"
      title: "Identify users and authenticate access to system components"
      objectives:
        - "Assign unique IDs to all users"
        - "Implement strong authentication"
        - "Implement MFA for all access to CDE"
      controls:
        - id: "8.1"
          description: "User identification and related accounts managed"
        - id: "8.2"
          description: "User identification and authentication managed"
        - id: "8.3"
          description: "Strong authentication established"
        - id: "8.4"
          description: "MFA implemented for access into the CDE"
        - id: "8.5"
          description: "MFA systems configured to prevent misuse"
        - id: "8.6"
          description: "Use of application and system accounts managed"
      code_patterns:
        password_requirements: |
          PASSWORD_REQUIREMENTS = {
              "min_length": 12,  # PCI-DSS 4.0 requirement
              "require_uppercase": True,
              "require_lowercase": True,
              "require_numeric": True,
              "require_special": True,
              "history_count": 4,  # Cannot reuse last 4 passwords
              "max_age_days": 90,  # Or implement MFA
              "lockout_threshold": 10,
              "lockout_duration_minutes": 30,
          }
    
    requirement_9:
      id: "9"
      title: "Restrict physical access to cardholder data"
      objectives:
        - "Use appropriate facility entry controls"
        - "Identify and authenticate visitors"
        - "Protect devices that capture payment card data"

  regularly_monitor_and_test:
    requirement_10:
      id: "10"
      title: "Log and monitor all access to system components and cardholder data"
      objectives:
        - "Implement audit trails for all access"
        - "Review logs daily"
        - "Protect audit trail from modification"
      controls:
        - id: "10.1"
          description: "Audit logs enabled and active"
        - id: "10.2"
          description: "Audit logs record required details"
        - id: "10.3"
          description: "Audit logs protected from destruction and modification"
        - id: "10.4"
          description: "Audit logs reviewed to identify anomalies"
        - id: "10.5"
          description: "Audit log history retained and available"
        - id: "10.6"
          description: "Time-synchronization technology implemented"
        - id: "10.7"
          description: "Failures of critical security control systems detected"
      code_patterns:
        audit_log_fields: |
          REQUIRED_AUDIT_FIELDS = [
              "user_identification",
              "type_of_event",
              "date_and_time",
              "success_or_failure",
              "origination_of_event",
              "identity_or_name_of_affected_data",
          ]
          
          LOG_RETENTION_DAYS = 365  # Minimum 1 year
          IMMEDIATE_AVAILABILITY_DAYS = 90  # 3 months immediately available
    
    requirement_11:
      id: "11"
      title: "Test security of systems and networks regularly"
      objectives:
        - "Test for wireless access points quarterly"
        - "Run vulnerability scans quarterly"
        - "Perform penetration testing annually"
      controls:
        - id: "11.1"
          description: "Wireless access points identified and monitored"
        - id: "11.2"
          description: "Wireless access points authorized and managed"
        - id: "11.3"
          description: "Vulnerabilities identified, prioritized, and addressed"
        - id: "11.4"
          description: "External and internal penetration testing performed"
        - id: "11.5"
          description: "Network intrusions and file changes detected and responded to"
        - id: "11.6"
          description: "Unauthorized changes on payment pages detected and responded to"

  maintain_information_security_policy:
    requirement_12:
      id: "12"
      title: "Support information security with organizational policies and programs"
      objectives:
        - "Establish and publish security policy"
        - "Conduct risk assessments annually"
        - "Implement security awareness program"
      controls:
        - id: "12.1"
          description: "Information security policy established and maintained"
        - id: "12.2"
          description: "Acceptable use policies defined and understood"
        - id: "12.3"
          description: "Risks to cardholder data environment formally identified"
        - id: "12.4"
          description: "PCI DSS compliance managed"
        - id: "12.5"
          description: "PCI DSS scope documented and validated"
        - id: "12.6"
          description: "Security awareness education ongoing"
        - id: "12.7"
          description: "Personnel screened to reduce insider threat risk"
        - id: "12.8"
          description: "Risk to information assets from third parties managed"
        - id: "12.9"
          description: "Third-party service providers support PCI DSS compliance"
        - id: "12.10"
          description: "Security incidents detected and responded to immediately"

# =============================================================================
# COMPLIANCE CHECKLIST
# =============================================================================

compliance_checklist:
  critical_violations:
    - "Storing CVV/CVC after authorization"
    - "Storing full track data after authorization"
    - "Storing PIN or PIN block"
    - "Transmitting PAN unencrypted over public networks"
    - "Default passwords on systems in CDE"
    - "Missing audit logs for access to cardholder data"
    - "No MFA for administrative access to CDE"
    
  common_findings:
    - "Incomplete network segmentation"
    - "Insufficient logging detail"
    - "Missing quarterly vulnerability scans"
    - "Outdated software with known vulnerabilities"
    - "Weak password policies"
    - "Incomplete asset inventory"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_at_rest"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_in_transit"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#audit_logging"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#authentication"
  
  related_standards:
    - "soc2"
    - "iso27001"
    - "glba"
