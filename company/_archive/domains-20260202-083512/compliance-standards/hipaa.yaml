# HIPAA Compliance Standard
# Health Insurance Portability and Accountability Act
# Authority: U.S. Department of Health and Human Services (HHS)
# Source: https://www.hhs.gov/hipaa/
# Version: 2013 Omnibus Rule
# Last Updated: 2026-01-28

metadata:
  standard_id: "HIPAA"
  version: "2013-omnibus"
  governing_body: "U.S. Department of Health and Human Services (HHS)"
  applies_to:
    - "Covered Entities: Healthcare providers, health plans, healthcare clearinghouses"
    - "Business Associates: Organizations handling PHI on behalf of covered entities"
  public_reference: "https://www.hhs.gov/hipaa/for-professionals/index.html"
  penalties:
    tier1: "$100-$50,000 per violation (no knowledge)"
    tier2: "$1,000-$50,000 per violation (reasonable cause)"
    tier3: "$10,000-$50,000 per violation (willful neglect, corrected)"
    tier4: "$50,000+ per violation (willful neglect, not corrected)"
    annual_cap: "$1,500,000 per identical provision"

# =============================================================================
# PROTECTED HEALTH INFORMATION (PHI)
# =============================================================================

phi_definition:
  description: "Individually identifiable health information transmitted or maintained in any form"
  identifiers:
    - "Name"
    - "Geographic data smaller than state"
    - "Dates (except year) related to individual"
    - "Phone numbers"
    - "Fax numbers"
    - "Email addresses"
    - "Social Security numbers"
    - "Medical record numbers"
    - "Health plan beneficiary numbers"
    - "Account numbers"
    - "Certificate/license numbers"
    - "Vehicle identifiers and serial numbers"
    - "Device identifiers and serial numbers"
    - "Web URLs"
    - "IP addresses"
    - "Biometric identifiers"
    - "Full-face photographs"
    - "Any other unique identifying number or code"
  
  ephi:
    description: "Electronic Protected Health Information"
    requirements:
      - "All PHI in electronic form"
      - "Created, received, maintained, or transmitted electronically"

# =============================================================================
# PRIVACY RULE
# =============================================================================

privacy_rule:
  description: "Standards for protecting individually identifiable health information"
  
  permitted_uses:
    treatment: "Use or disclosure for treatment purposes"
    payment: "Use or disclosure for payment activities"
    healthcare_operations: "Use for quality improvement, training, etc."
    authorization: "Use with individual's written authorization"
    required_by_law: "Disclosures required by law"
    public_health: "Disclosures for public health activities"
  
  minimum_necessary:
    description: "Use or disclose only the minimum PHI necessary"
    implementation:
      - "Role-based access to PHI"
      - "Limit PHI in reports to necessary fields"
      - "Review access requests against need"
    code_pattern: |
      def get_patient_data(user_role: str, patient_id: str) -> dict:
          """Return minimum necessary PHI based on role (HIPAA Privacy Rule)."""
          if user_role == "billing":
              return get_billing_phi(patient_id)  # Only billing-relevant PHI
          elif user_role == "clinical":
              return get_clinical_phi(patient_id)  # Full clinical record
          elif user_role == "front_desk":
              return get_scheduling_phi(patient_id)  # Name, DOB, appointments
          raise UnauthorizedAccessError("Role not permitted to access PHI")
  
  individual_rights:
    access:
      description: "Right to access and obtain copy of PHI"
      timeline: "30 days (one 30-day extension permitted)"
    amendment:
      description: "Right to request amendment of PHI"
      response: "60 days to respond"
    accounting:
      description: "Right to accounting of disclosures"
      period: "6 years prior to request"
    restriction:
      description: "Right to request restrictions on uses"
    confidential_communications:
      description: "Right to request alternative means of communication"

# =============================================================================
# SECURITY RULE
# =============================================================================

security_rule:
  description: "Technical and non-technical safeguards for ePHI"
  
  administrative_safeguards:
    security_management:
      id: "164.308(a)(1)"
      requirements:
        - "Risk analysis"
        - "Risk management"
        - "Sanction policy"
        - "Information system activity review"
      implementation:
        - "Conduct annual risk assessments"
        - "Document and address identified risks"
        - "Review audit logs regularly"
    
    workforce_security:
      id: "164.308(a)(3)"
      requirements:
        - "Authorization and supervision"
        - "Workforce clearance procedures"
        - "Termination procedures"
    
    information_access_management:
      id: "164.308(a)(4)"
      requirements:
        - "Access authorization"
        - "Access establishment and modification"
    
    security_awareness_training:
      id: "164.308(a)(5)"
      requirements:
        - "Security reminders"
        - "Protection from malicious software"
        - "Log-in monitoring"
        - "Password management"
    
    security_incident_procedures:
      id: "164.308(a)(6)"
      requirements:
        - "Response and reporting procedures"
    
    contingency_plan:
      id: "164.308(a)(7)"
      requirements:
        - "Data backup plan"
        - "Disaster recovery plan"
        - "Emergency mode operation plan"
        - "Testing and revision procedures"
        - "Applications and data criticality analysis"
    
    business_associate_contracts:
      id: "164.308(b)(1)"
      requirements:
        - "Written contracts with business associates"
        - "Satisfactory assurances of PHI protection"
  
  physical_safeguards:
    facility_access_controls:
      id: "164.310(a)"
      requirements:
        - "Contingency operations"
        - "Facility security plan"
        - "Access control and validation"
        - "Maintenance records"
    
    workstation_use:
      id: "164.310(b)"
      requirements:
        - "Policies for proper workstation use"
    
    workstation_security:
      id: "164.310(c)"
      requirements:
        - "Physical safeguards for workstations"
    
    device_and_media_controls:
      id: "164.310(d)"
      requirements:
        - "Disposal"
        - "Media re-use"
        - "Accountability"
        - "Data backup and storage"
  
  technical_safeguards:
    access_control:
      id: "164.312(a)"
      requirements:
        - "Unique user identification"
        - "Emergency access procedure"
        - "Automatic logoff"
        - "Encryption and decryption"
      code_pattern: |
        class HIPAAAccessControl:
            """HIPAA-compliant access control (164.312(a))."""
            
            def __init__(self):
                self.session_timeout_minutes = 15  # Automatic logoff
            
            def authenticate(self, username: str, password: str) -> Session:
                """Unique user identification required."""
                user = verify_credentials(username, password)
                return create_session(user, timeout=self.session_timeout_minutes)
            
            def emergency_access(self, reason: str) -> Session:
                """Emergency access procedure with full audit."""
                log_emergency_access(reason)
                return create_emergency_session()
    
    audit_controls:
      id: "164.312(b)"
      requirements:
        - "Hardware, software, and procedural mechanisms to record and examine activity"
      implementation:
        log_events:
          - "PHI access (read)"
          - "PHI modification (create, update, delete)"
          - "Authentication attempts"
          - "Authorization failures"
          - "System events"
        retention: "6 years minimum"
      code_pattern: |
        def log_phi_access(user_id: str, patient_id: str, action: str, phi_fields: list):
            """HIPAA audit control logging (164.312(b))."""
            audit_record = {
                "timestamp": datetime.utcnow().isoformat(),
                "user_id": user_id,
                "patient_id": patient_id,  # Do not log actual PHI
                "action": action,
                "fields_accessed": phi_fields,
                "source_ip": get_client_ip(),
                "workstation_id": get_workstation_id(),
            }
            hipaa_audit_logger.log(audit_record)
    
    integrity:
      id: "164.312(c)"
      requirements:
        - "Mechanisms to authenticate ePHI"
        - "Protect ePHI from improper alteration or destruction"
      implementation:
        - "Checksums/hashes for data integrity"
        - "Version control for PHI records"
        - "Tamper-evident audit logs"
    
    person_or_entity_authentication:
      id: "164.312(d)"
      requirements:
        - "Verify identity of persons seeking access to ePHI"
      implementation:
        - "Multi-factor authentication for remote access"
        - "Strong password policies"
        - "Session management"
    
    transmission_security:
      id: "164.312(e)"
      requirements:
        - "Integrity controls"
        - "Encryption"
      implementation:
        - "TLS 1.2+ for all PHI transmission"
        - "End-to-end encryption for messages"
        - "VPN for remote access"
      code_pattern: |
        # HIPAA Transmission Security Configuration
        TLS_CONFIG = {
            "min_version": "TLSv1.2",
            "preferred_version": "TLSv1.3",
            "cipher_suites": [
                "TLS_AES_256_GCM_SHA384",
                "TLS_CHACHA20_POLY1305_SHA256",
            ],
            "certificate_verification": True,
        }

# =============================================================================
# BREACH NOTIFICATION RULE
# =============================================================================

breach_notification:
  description: "Requirements for notification following a breach of unsecured PHI"
  
  breach_definition: "Acquisition, access, use, or disclosure of PHI in violation of Privacy Rule that compromises security or privacy"
  
  exceptions:
    - "Unintentional acquisition by workforce member acting in good faith"
    - "Inadvertent disclosure between authorized persons"
    - "Good faith belief that unauthorized person could not retain information"
  
  risk_assessment:
    factors:
      - "Nature and extent of PHI involved"
      - "Unauthorized person who used or received PHI"
      - "Whether PHI was actually acquired or viewed"
      - "Extent to which risk has been mitigated"
  
  notification_requirements:
    individuals:
      timeline: "Without unreasonable delay, no later than 60 days"
      method: "First-class mail or email (if authorized)"
      content:
        - "Description of breach"
        - "Types of information involved"
        - "Steps individuals should take"
        - "Steps entity is taking"
        - "Contact procedures"
    
    hhs:
      under_500: "Annual log submission"
      over_500: "Within 60 days of discovery"
    
    media:
      threshold: "500+ individuals in a state/jurisdiction"
      timeline: "Without unreasonable delay, no later than 60 days"

# =============================================================================
# COMPLIANCE CHECKLIST
# =============================================================================

compliance_checklist:
  critical_requirements:
    - "Risk analysis conducted and documented"
    - "Encryption of ePHI at rest and in transit"
    - "Unique user IDs for all workforce members"
    - "Audit logging of all PHI access"
    - "Business Associate Agreements with all vendors"
    - "Security awareness training for workforce"
    - "Incident response procedures documented"
    - "Minimum necessary policies implemented"
    
  common_violations:
    - "Lack of risk analysis"
    - "Insufficient access controls"
    - "Missing audit trails"
    - "Unsecured PHI transmission"
    - "Improper disposal of PHI"
    - "Missing BAAs with vendors"
    - "Delayed breach notification"

# =============================================================================
# HSA/FSA SPECIFIC CONSIDERATIONS
# =============================================================================

hsa_fsa_integration:
  description: "HIPAA considerations for Health Savings and Flexible Spending Accounts"
  
  data_classification:
    phi_elements:
      - "Medical claims data"
      - "Provider information"
      - "Diagnosis codes"
      - "Treatment descriptions"
    non_phi_elements:
      - "Account balance"
      - "Contribution amounts"
      - "Transaction amounts (without medical detail)"
  
  requirements:
    - "Segregate PHI from financial data where possible"
    - "Apply HIPAA protections to all PHI"
    - "Implement minimum necessary for claims adjudication"
    - "Maintain audit trails for all PHI access"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_at_rest"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_in_transit"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#audit_logging"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#authentication"
  
  related_standards:
    - "pii-protection"
    - "soc2"
    - "hsa-fsa"
