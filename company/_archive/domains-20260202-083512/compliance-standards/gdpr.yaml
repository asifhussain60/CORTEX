# GDPR Compliance Standard
# General Data Protection Regulation
# Authority: European Union
# Source: https://gdpr-info.eu/
# Version: 2018 (with 2021 updates)
# Last Updated: 2026-01-28

metadata:
  standard_id: "GDPR"
  version: "2018"
  governing_body: "European Union"
  effective_date: "2018-05-25"
  applies_to:
    - "Organizations processing personal data of EU residents"
    - "Organizations offering goods/services to EU residents"
    - "Organizations monitoring behavior of EU residents"
  public_reference: "https://gdpr-info.eu/"
  penalties:
    tier1: "Up to €10 million or 2% of global annual turnover"
    tier2: "Up to €20 million or 4% of global annual turnover"

# =============================================================================
# KEY DEFINITIONS
# =============================================================================

definitions:
  personal_data:
    description: "Any information relating to an identified or identifiable natural person"
    examples:
      - "Name"
      - "Email address"
      - "Location data"
      - "Online identifiers (IP, cookies)"
      - "Physical, physiological, genetic identity factors"
  
  special_categories:
    description: "Sensitive personal data requiring additional protection"
    categories:
      - "Racial or ethnic origin"
      - "Political opinions"
      - "Religious or philosophical beliefs"
      - "Trade union membership"
      - "Genetic data"
      - "Biometric data"
      - "Health data"
      - "Sex life or sexual orientation"
  
  processing:
    description: "Any operation performed on personal data"
    operations:
      - "Collection"
      - "Recording"
      - "Organization"
      - "Storage"
      - "Adaptation"
      - "Retrieval"
      - "Consultation"
      - "Use"
      - "Disclosure"
      - "Erasure"

# =============================================================================
# PRINCIPLES (Article 5)
# =============================================================================

principles:
  lawfulness_fairness_transparency:
    article: "5(1)(a)"
    description: "Process lawfully, fairly, and transparently"
    implementation:
      - "Identify valid legal basis for processing"
      - "Provide clear privacy notices"
      - "Don't use data in unexpected ways"
  
  purpose_limitation:
    article: "5(1)(b)"
    description: "Collect for specified, explicit, legitimate purposes"
    implementation:
      - "Document purpose for each data processing activity"
      - "Don't use data for incompatible purposes"
      - "Further processing requires new legal basis"
  
  data_minimization:
    article: "5(1)(c)"
    description: "Adequate, relevant, limited to what is necessary"
    implementation:
      - "Collect only required fields"
      - "Review data collection forms"
      - "Delete unnecessary data"
  
  accuracy:
    article: "5(1)(d)"
    description: "Accurate and kept up to date"
    implementation:
      - "Enable user profile updates"
      - "Correct inaccurate data promptly"
      - "Erase inaccurate data"
  
  storage_limitation:
    article: "5(1)(e)"
    description: "Keep only as long as necessary"
    implementation:
      - "Define retention periods"
      - "Automate deletion"
      - "Document retention justification"
  
  integrity_confidentiality:
    article: "5(1)(f)"
    description: "Ensure appropriate security"
    implementation:
      - "Encrypt personal data"
      - "Implement access controls"
      - "Protect against unauthorized access"
  
  accountability:
    article: "5(2)"
    description: "Demonstrate compliance"
    implementation:
      - "Maintain processing records"
      - "Conduct DPIAs"
      - "Document compliance measures"

# =============================================================================
# LEGAL BASES (Article 6)
# =============================================================================

legal_bases:
  consent:
    article: "6(1)(a)"
    description: "Data subject has given consent"
    requirements:
      - "Freely given"
      - "Specific"
      - "Informed"
      - "Unambiguous"
      - "Easy to withdraw"
    code_pattern: |
      class ConsentRecord:
          """GDPR-compliant consent tracking."""
          user_id: str
          purpose: str
          granted_at: datetime
          ip_address: str
          consent_text_version: str
          withdrawal_date: Optional[datetime]
          
          def is_valid(self) -> bool:
              return self.withdrawal_date is None
  
  contract:
    article: "6(1)(b)"
    description: "Necessary for contract performance"
    use_cases:
      - "Processing order information"
      - "Shipping address for delivery"
      - "Payment processing"
  
  legal_obligation:
    article: "6(1)(c)"
    description: "Necessary for legal obligation compliance"
    use_cases:
      - "Tax records"
      - "Employment law requirements"
      - "Court orders"
  
  vital_interests:
    article: "6(1)(d)"
    description: "Protect vital interests of data subject"
    use_cases:
      - "Medical emergencies"
      - "Life-threatening situations"
  
  public_task:
    article: "6(1)(e)"
    description: "Necessary for public interest task"
    use_cases:
      - "Government functions"
      - "Public health"
  
  legitimate_interests:
    article: "6(1)(f)"
    description: "Necessary for legitimate interests"
    requirements:
      - "Conduct legitimate interests assessment (LIA)"
      - "Balance against data subject rights"
      - "Document assessment"

# =============================================================================
# DATA SUBJECT RIGHTS (Articles 12-22)
# =============================================================================

data_subject_rights:
  right_to_be_informed:
    articles: "13, 14"
    description: "Right to know how data is processed"
    requirements:
      - "Identity of controller"
      - "Purposes of processing"
      - "Legal basis"
      - "Data retention periods"
      - "Rights available"
    timeline: "At point of collection"
  
  right_of_access:
    article: "15"
    description: "Right to obtain copy of personal data"
    requirements:
      - "Confirm processing"
      - "Provide copy of data"
      - "Information about processing"
    timeline: "Within 1 month"
    code_pattern: |
      async def handle_access_request(user_id: str) -> DataAccessResponse:
          """Handle GDPR Article 15 access request."""
          # Verify identity
          await verify_identity(user_id)
          
          # Gather all personal data
          personal_data = await collect_all_user_data(user_id)
          
          # Include processing information
          processing_info = get_processing_information()
          
          return DataAccessResponse(
              personal_data=personal_data,
              purposes=processing_info.purposes,
              categories=processing_info.categories,
              recipients=processing_info.recipients,
              retention_period=processing_info.retention,
              rights_info=get_rights_information(),
              format="machine_readable"  # JSON or similar
          )
  
  right_to_rectification:
    article: "16"
    description: "Right to correct inaccurate data"
    timeline: "Within 1 month"
    implementation:
      - "Enable self-service correction"
      - "Process correction requests"
      - "Notify recipients of corrections"
  
  right_to_erasure:
    article: "17"
    description: "Right to be forgotten"
    grounds:
      - "Data no longer necessary"
      - "Consent withdrawn"
      - "Objection to processing"
      - "Unlawful processing"
      - "Legal obligation to erase"
    exceptions:
      - "Legal obligation to retain"
      - "Public health purposes"
      - "Archiving in public interest"
      - "Legal claims"
    timeline: "Within 1 month"
    code_pattern: |
      async def handle_erasure_request(user_id: str) -> ErasureResponse:
          """Handle GDPR Article 17 erasure request."""
          # Check for exemptions
          exemptions = await check_erasure_exemptions(user_id)
          if exemptions:
              return ErasureResponse(
                  status="partially_completed",
                  retained_data=exemptions,
                  retention_reason="legal_obligation"
              )
          
          # Erase from all systems
          await delete_user_data_all_systems(user_id)
          
          # Notify processors
          await notify_processors_of_erasure(user_id)
          
          # Log deletion (without PII)
          await log_erasure_completion(user_id)
          
          return ErasureResponse(status="completed")
  
  right_to_restriction:
    article: "18"
    description: "Right to limit processing"
    grounds:
      - "Contesting accuracy"
      - "Unlawful processing (prefers restriction over erasure)"
      - "Controller no longer needs data but subject needs it for claims"
      - "Objection pending verification"
  
  right_to_portability:
    article: "20"
    description: "Right to receive data in portable format"
    requirements:
      - "Structured, commonly used format"
      - "Machine-readable"
      - "Right to transmit to another controller"
    applies_when:
      - "Processing based on consent or contract"
      - "Processing carried out by automated means"
  
  right_to_object:
    article: "21"
    description: "Right to object to processing"
    absolute_rights:
      - "Direct marketing (must stop immediately)"
    conditional_rights:
      - "Legitimate interests (unless compelling grounds)"
      - "Public interest tasks"
  
  automated_decision_making:
    article: "22"
    description: "Rights related to automated decisions"
    requirements:
      - "Right not to be subject to solely automated decisions"
      - "Right to human intervention"
      - "Right to express point of view"
      - "Right to contest decision"
    exceptions:
      - "Necessary for contract"
      - "Authorized by law"
      - "Based on explicit consent"

# =============================================================================
# CONTROLLER OBLIGATIONS
# =============================================================================

controller_obligations:
  records_of_processing:
    article: "30"
    description: "Maintain records of processing activities"
    required_for: "Organizations with 250+ employees or high-risk processing"
    contents:
      - "Controller/processor details"
      - "Processing purposes"
      - "Categories of data subjects and data"
      - "Recipients"
      - "International transfers"
      - "Retention periods"
      - "Security measures"
  
  data_protection_impact_assessment:
    article: "35"
    description: "DPIA for high-risk processing"
    required_when:
      - "Systematic and extensive profiling with significant effects"
      - "Large scale processing of special categories"
      - "Large scale systematic monitoring of public areas"
    contents:
      - "Description of processing"
      - "Necessity and proportionality assessment"
      - "Risk assessment"
      - "Mitigation measures"
  
  data_protection_officer:
    article: "37"
    description: "Appoint DPO when required"
    required_when:
      - "Public authority (except courts)"
      - "Core activities require regular, systematic monitoring at scale"
      - "Core activities involve large scale processing of special categories"
  
  breach_notification:
    article: "33, 34"
    to_authority:
      timeline: "Within 72 hours"
      contents:
        - "Nature of breach"
        - "Categories and number affected"
        - "DPO contact"
        - "Likely consequences"
        - "Mitigation measures"
    to_data_subjects:
      when: "High risk to rights and freedoms"
      timeline: "Without undue delay"

# =============================================================================
# INTERNATIONAL TRANSFERS
# =============================================================================

international_transfers:
  article: "44-49"
  description: "Rules for transferring data outside EU/EEA"
  
  mechanisms:
    adequacy_decision:
      description: "Country deemed adequate by EU Commission"
      adequate_countries:
        - "Andorra"
        - "Argentina"
        - "Canada (commercial)"
        - "Faroe Islands"
        - "Guernsey"
        - "Israel"
        - "Isle of Man"
        - "Japan"
        - "Jersey"
        - "New Zealand"
        - "South Korea"
        - "Switzerland"
        - "UK"
        - "Uruguay"
    
    standard_contractual_clauses:
      description: "EU-approved contract terms"
      requirements:
        - "Use current EU SCCs (2021)"
        - "Conduct transfer impact assessment"
        - "Implement supplementary measures if needed"
    
    binding_corporate_rules:
      description: "Intra-group transfer framework"
      requirements:
        - "Approved by supervisory authority"
        - "Binding and enforceable"
    
    derogations:
      description: "Exceptions for specific situations"
      examples:
        - "Explicit consent"
        - "Contract performance"
        - "Legal claims"
        - "Vital interests"

# =============================================================================
# COMPLIANCE CHECKLIST
# =============================================================================

compliance_checklist:
  critical_requirements:
    - "Valid legal basis for all processing"
    - "Privacy notice provided to data subjects"
    - "Consent mechanism (where applicable)"
    - "Data subject rights processes"
    - "Records of processing activities"
    - "Breach notification procedures"
    - "Data processing agreements with processors"
    - "International transfer safeguards"
    
  common_violations:
    - "No valid legal basis"
    - "Invalid consent (pre-ticked boxes, bundled consent)"
    - "Failure to respond to access requests"
    - "Excessive data collection"
    - "Missing privacy notices"
    - "Late breach notifications"
    - "Transfers without safeguards"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#data_retention"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#audit_logging"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_at_rest"
  
  related_standards:
    - "pii-protection"
    - "ccpa"
