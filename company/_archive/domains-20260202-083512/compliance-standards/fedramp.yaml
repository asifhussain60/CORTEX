# FedRAMP Compliance Standard
# Federal Risk and Authorization Management Program
# Authority: U.S. General Services Administration (GSA)
# Source: https://www.fedramp.gov/
# Version: Rev 5 Baselines (2023)
# Last Updated: 2026-01-28

metadata:
  standard_id: "FEDRAMP"
  version: "Rev5-2023"
  governing_body: "U.S. General Services Administration (GSA)"
  applies_to:
    - "Cloud Service Providers (CSPs) serving federal agencies"
    - "Federal agencies using cloud services"
  public_reference: "https://www.fedramp.gov/documents/"
  note: "All FedRAMP documents freely available"

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  description: "Standardized approach to security assessment, authorization, and monitoring for cloud products"
  
  authorization_types:
    agency:
      description: "Authorization through individual agency"
      process: "Agency sponsors and authorizes directly"
      reuse: "Other agencies can reuse with risk acceptance"
    
    jab:
      description: "Joint Authorization Board (highest level)"
      members: ["DoD", "DHS", "GSA"]
      process: "Rigorous review by JAB"
      benefit: "Provisional authorization accepted government-wide"
  
  impact_levels:
    low:
      description: "Low-impact systems with limited adverse effects"
      data_types: "Publicly available data"
      control_count: "~156 controls"
    
    moderate:
      description: "Moderate-impact systems (most common)"
      data_types: "Controlled unclassified information (CUI)"
      control_count: "~325 controls"
    
    high:
      description: "High-impact systems with severe effects"
      data_types: "Highly sensitive data, law enforcement, financial"
      control_count: "~421 controls"

# =============================================================================
# AUTHORIZATION PROCESS
# =============================================================================

authorization_process:
  preparation:
    description: "CSP readiness and documentation"
    activities:
      - "Implement FedRAMP security controls"
      - "Develop System Security Plan (SSP)"
      - "Conduct readiness assessment"
      - "Engage 3PAO (Third Party Assessment Organization)"
    deliverables:
      - "FedRAMP Readiness Assessment Report"
      - "System Security Plan"
      - "Policies and procedures"
  
  authorization:
    description: "Security assessment and authorization"
    activities:
      - "3PAO conducts security assessment"
      - "CSP remediates findings"
      - "Authorization package submitted"
      - "Agency or JAB reviews and authorizes"
    deliverables:
      - "Security Assessment Report (SAR)"
      - "Plan of Action and Milestones (POA&M)"
      - "Authorization to Operate (ATO)"
  
  continuous_monitoring:
    description: "Ongoing security monitoring post-authorization"
    activities:
      - "Monthly vulnerability scanning"
      - "Annual penetration testing"
      - "Monthly POA&M updates"
      - "Annual security assessment"
      - "Significant change requests"
    deliverables:
      - "Monthly continuous monitoring reports"
      - "Annual assessment report"
      - "Significant change requests"

# =============================================================================
# KEY REQUIREMENTS
# =============================================================================

key_requirements:
  boundary_definition:
    description: "Define clear authorization boundary"
    includes:
      - "All system components"
      - "Data flows"
      - "Interconnections"
      - "Shared services"
    documentation: "System Security Plan Section 9"
  
  control_implementation:
    description: "Implement all required controls for impact level"
    base: "NIST 800-53 Rev 5 controls"
    fedramp_specific:
      - "Additional FedRAMP parameters"
      - "FedRAMP-specific requirements"
      - "Continuous monitoring requirements"
    
    key_control_areas:
      access_control:
        - "Multi-factor authentication for all users"
        - "Session timeout (15 min for moderate/high)"
        - "Account management with audit trail"
      
      audit_logging:
        - "Comprehensive event logging"
        - "Log protection and retention (1 year online, 3 years archive)"
        - "Real-time alerting for security events"
      
      configuration_management:
        - "Baseline configurations documented"
        - "Change control with approval process"
        - "Configuration monitoring"
      
      incident_response:
        - "Incident response plan"
        - "US-CERT reporting requirements"
        - "Agency notification within timelines"
      
      vulnerability_management:
        - "Monthly vulnerability scanning"
        - "Remediation timelines based on severity"
        - "Annual penetration testing"
  
  data_handling:
    encryption_in_transit:
      requirement: "FIPS 140-2/140-3 validated cryptography"
      minimum: "TLS 1.2"
      preferred: "TLS 1.3"
    
    encryption_at_rest:
      requirement: "Encrypt all federal data at rest"
      algorithms: "FIPS 140-2/140-3 validated modules"
    
    data_location:
      requirement: "Data must remain in United States"
      exceptions: "Specific agency approval required"
  
  personnel_requirements:
    us_persons:
      description: "Access to federal data by U.S. persons"
      exceptions: "Foreign national access requires agency approval"
    
    background_checks:
      description: "Personnel screening requirements"
      levels:
        - "Tier 1 (Low risk)"
        - "Tier 2 (Moderate risk)"
        - "Tier 4 (High risk)"

# =============================================================================
# VULNERABILITY MANAGEMENT
# =============================================================================

vulnerability_management:
  scanning_requirements:
    frequency: "Monthly operating system and database scans"
    web_application: "Monthly web application scans"
    container: "Image scanning before deployment"
    
  remediation_timelines:
    critical:
      cvss: "9.0-10.0"
      timeline: "30 days"
      deviation: "Requires documented justification"
    
    high:
      cvss: "7.0-8.9"
      timeline: "30 days"
      deviation: "Requires documented justification"
    
    moderate:
      cvss: "4.0-6.9"
      timeline: "90 days"
      
    low:
      cvss: "0.1-3.9"
      timeline: "180 days"
  
  penetration_testing:
    frequency: "Annual"
    scope:
      - "External penetration test"
      - "Internal penetration test"
      - "Web application test"
      - "Social engineering (for High)"
    provider: "Independent 3PAO or qualified firm"

# =============================================================================
# INCIDENT RESPONSE
# =============================================================================

incident_response:
  reporting_requirements:
    us_cert:
      description: "Report to US-CERT per federal requirements"
      timeline: "Within 1 hour of detection for significant incidents"
    
    fedramp_pmo:
      description: "Report to FedRAMP PMO"
      timeline: "Within 24 hours"
    
    agency_notification:
      description: "Notify affected agencies"
      timeline: "Per incident severity and agency agreements"
  
  incident_categories:
    cat1:
      description: "Root-level access or significant compromise"
      response: "Immediate escalation"
    
    cat2:
      description: "Unauthorized access to user data"
      response: "24-hour response"
    
    cat3:
      description: "Reconnaissance or probing"
      response: "72-hour response"

# =============================================================================
# CONTINUOUS MONITORING
# =============================================================================

continuous_monitoring:
  monthly_deliverables:
    - "Vulnerability scan results"
    - "POA&M updates"
    - "Inventory updates"
    - "Significant changes"
  
  annual_requirements:
    - "Full security assessment"
    - "Penetration testing"
    - "Contingency plan testing"
    - "Incident response testing"
  
  poa_m:
    description: "Plan of Action and Milestones"
    purpose: "Track and remediate security weaknesses"
    requirements:
      - "Document all identified weaknesses"
      - "Assign remediation timelines"
      - "Track progress monthly"
      - "Report to authorizing official"
    
    fields:
      - "Weakness ID"
      - "Point of Contact"
      - "Weakness Description"
      - "Security Control"
      - "Remediation Plan"
      - "Scheduled Completion Date"
      - "Milestones"
      - "Status"

# =============================================================================
# DOCUMENTATION REQUIREMENTS
# =============================================================================

documentation:
  system_security_plan:
    description: "Comprehensive security documentation"
    sections:
      - "System Information"
      - "System Environment"
      - "System Interconnections"
      - "Security Controls Implementation"
      - "Minimum Security Controls"
    template: "FedRAMP SSP Template (available on fedramp.gov)"
  
  policies_and_procedures:
    required:
      - "Access Control Policy"
      - "Audit and Accountability Policy"
      - "Configuration Management Policy"
      - "Contingency Planning Policy"
      - "Identification and Authentication Policy"
      - "Incident Response Policy"
      - "Maintenance Policy"
      - "Media Protection Policy"
      - "Personnel Security Policy"
      - "Physical and Environmental Protection Policy"
      - "Planning Policy"
      - "Risk Assessment Policy"
      - "Security Assessment Policy"
      - "System and Communications Protection Policy"
      - "System and Information Integrity Policy"
  
  additional_documents:
    - "Contingency Plan"
    - "Incident Response Plan"
    - "Configuration Management Plan"
    - "Rules of Behavior"
    - "Privacy Impact Assessment (if applicable)"

# =============================================================================
# IMPLEMENTATION GUIDANCE
# =============================================================================

implementation:
  code_pattern: |
    class FedRAMPCompliance:
        """FedRAMP compliance monitoring implementation."""
        
        def __init__(self, impact_level: str):
            self.impact_level = impact_level
            self.controls = load_fedramp_controls(impact_level)
        
        def validate_mfa(self, authentication_event: AuthEvent) -> bool:
            """Validate MFA requirement (IA-2)."""
            # FedRAMP requires MFA for all users at Moderate/High
            if self.impact_level in ["moderate", "high"]:
                if not authentication_event.mfa_used:
                    self.log_compliance_violation("IA-2", "MFA not used")
                    return False
            return True
        
        def validate_session_timeout(self, session: Session) -> bool:
            """Validate session timeout (AC-12)."""
            max_idle = {
                "low": 30,      # 30 minutes
                "moderate": 15,  # 15 minutes
                "high": 15       # 15 minutes
            }
            
            if session.idle_time_minutes > max_idle[self.impact_level]:
                session.terminate()
                return False
            return True
        
        def check_vulnerability_remediation(self, vulnerability: Vulnerability) -> dict:
            """Check vulnerability remediation timeline."""
            timelines = {
                "critical": 30,
                "high": 30,
                "moderate": 90,
                "low": 180
            }
            
            days_open = (datetime.now() - vulnerability.discovered_date).days
            max_days = timelines[vulnerability.severity]
            
            return {
                "compliant": days_open <= max_days,
                "days_open": days_open,
                "days_remaining": max_days - days_open,
                "overdue": days_open > max_days
            }

