# ISO 27001 Information Security Standard
# ISO/IEC 27001:2022 Information Security Management System
# Authority: International Organization for Standardization (ISO)
# Version: 2022
# Last Updated: 2026-01-28

metadata:
  standard_id: "ISO27001"
  version: "2022"
  governing_body: "International Organization for Standardization (ISO/IEC)"
  applies_to:
    - "Any organization seeking to establish information security management"
    - "Organizations requiring formal security certification"
  public_reference: "https://www.iso.org/isoiec-27001-information-security.html"
  note: "Full standard requires purchase; this covers public control objectives"

# =============================================================================
# ISMS REQUIREMENTS (Clauses 4-10)
# =============================================================================

isms_requirements:
  context_of_organization:
    clause: "4"
    requirements:
      - id: "4.1"
        title: "Understanding the organization and its context"
        description: "Determine external and internal issues relevant to ISMS"
      - id: "4.2"
        title: "Understanding needs and expectations of interested parties"
        description: "Identify parties and their requirements"
      - id: "4.3"
        title: "Determining the scope of the ISMS"
        description: "Define boundaries and applicability"
      - id: "4.4"
        title: "Information security management system"
        description: "Establish, implement, maintain, and continually improve ISMS"
  
  leadership:
    clause: "5"
    requirements:
      - id: "5.1"
        title: "Leadership and commitment"
        description: "Top management demonstrates leadership and commitment"
      - id: "5.2"
        title: "Policy"
        description: "Establish information security policy"
      - id: "5.3"
        title: "Organizational roles, responsibilities and authorities"
        description: "Assign and communicate security responsibilities"
  
  planning:
    clause: "6"
    requirements:
      - id: "6.1"
        title: "Actions to address risks and opportunities"
        description: "Risk assessment and risk treatment"
      - id: "6.2"
        title: "Information security objectives and planning"
        description: "Establish measurable security objectives"
      - id: "6.3"
        title: "Planning of changes"
        description: "Changes to ISMS conducted in planned manner"
  
  support:
    clause: "7"
    requirements:
      - id: "7.1"
        title: "Resources"
        description: "Determine and provide necessary resources"
      - id: "7.2"
        title: "Competence"
        description: "Determine necessary competence, ensure personnel competent"
      - id: "7.3"
        title: "Awareness"
        description: "Personnel aware of policy, contribution, and implications"
      - id: "7.4"
        title: "Communication"
        description: "Determine internal and external communications"
      - id: "7.5"
        title: "Documented information"
        description: "Include documented information required by standard"
  
  operation:
    clause: "8"
    requirements:
      - id: "8.1"
        title: "Operational planning and control"
        description: "Plan, implement, and control processes"
      - id: "8.2"
        title: "Information security risk assessment"
        description: "Perform risk assessments at planned intervals"
      - id: "8.3"
        title: "Information security risk treatment"
        description: "Implement risk treatment plan"
  
  performance_evaluation:
    clause: "9"
    requirements:
      - id: "9.1"
        title: "Monitoring, measurement, analysis and evaluation"
        description: "Determine what needs monitoring and measuring"
      - id: "9.2"
        title: "Internal audit"
        description: "Conduct internal audits at planned intervals"
      - id: "9.3"
        title: "Management review"
        description: "Top management review ISMS at planned intervals"
  
  improvement:
    clause: "10"
    requirements:
      - id: "10.1"
        title: "Continual improvement"
        description: "Continually improve ISMS suitability and effectiveness"
      - id: "10.2"
        title: "Nonconformity and corrective action"
        description: "React to nonconformities and take corrective action"

# =============================================================================
# ANNEX A CONTROLS (ISO 27001:2022)
# =============================================================================

annex_a_controls:
  organizational:
    category: "A.5"
    title: "Organizational Controls"
    controls:
      - id: "A.5.1"
        name: "Policies for information security"
        objective: "Provide management direction and support"
      - id: "A.5.2"
        name: "Information security roles and responsibilities"
        objective: "Define and allocate responsibilities"
      - id: "A.5.3"
        name: "Segregation of duties"
        objective: "Reduce opportunities for unauthorized modification"
      - id: "A.5.4"
        name: "Management responsibilities"
        objective: "Management requires compliance with policies"
      - id: "A.5.5"
        name: "Contact with authorities"
        objective: "Maintain appropriate contacts"
      - id: "A.5.6"
        name: "Contact with special interest groups"
        objective: "Maintain contacts with security groups"
      - id: "A.5.7"
        name: "Threat intelligence"
        objective: "Collect and analyze threat information"
      - id: "A.5.8"
        name: "Information security in project management"
        objective: "Integrate security into projects"
      - id: "A.5.9"
        name: "Inventory of information and other associated assets"
        objective: "Identify and maintain asset inventory"
      - id: "A.5.10"
        name: "Acceptable use of information and other associated assets"
        objective: "Define acceptable use rules"
      - id: "A.5.11"
        name: "Return of assets"
        objective: "Ensure assets returned on termination"
      - id: "A.5.12"
        name: "Classification of information"
        objective: "Classify information appropriately"
      - id: "A.5.13"
        name: "Labelling of information"
        objective: "Develop labelling procedures"
      - id: "A.5.14"
        name: "Information transfer"
        objective: "Protect information during transfer"
      - id: "A.5.15"
        name: "Access control"
        objective: "Limit access to information and processing facilities"
      - id: "A.5.16"
        name: "Identity management"
        objective: "Manage full lifecycle of identities"
      - id: "A.5.17"
        name: "Authentication information"
        objective: "Control allocation of authentication info"
      - id: "A.5.18"
        name: "Access rights"
        objective: "Provision, review, and remove access rights"
      - id: "A.5.19"
        name: "Information security in supplier relationships"
        objective: "Protect assets accessible to suppliers"
      - id: "A.5.20"
        name: "Addressing information security within supplier agreements"
        objective: "Establish security requirements in agreements"
      - id: "A.5.21"
        name: "Managing information security in the ICT supply chain"
        objective: "Manage ICT supply chain risks"
      - id: "A.5.22"
        name: "Monitoring, review and change management of supplier services"
        objective: "Monitor and review supplier services"
      - id: "A.5.23"
        name: "Information security for use of cloud services"
        objective: "Manage cloud service security"
      - id: "A.5.24"
        name: "Information security incident management planning and preparation"
        objective: "Plan incident management"
      - id: "A.5.25"
        name: "Assessment and decision on information security events"
        objective: "Assess and decide on events"
      - id: "A.5.26"
        name: "Response to information security incidents"
        objective: "Respond to incidents"
      - id: "A.5.27"
        name: "Learning from information security incidents"
        objective: "Use incidents to improve"
      - id: "A.5.28"
        name: "Collection of evidence"
        objective: "Define evidence collection procedures"
      - id: "A.5.29"
        name: "Information security during disruption"
        objective: "Protect information during disruption"
      - id: "A.5.30"
        name: "ICT readiness for business continuity"
        objective: "Plan ICT continuity"
      - id: "A.5.31"
        name: "Legal, statutory, regulatory and contractual requirements"
        objective: "Identify and document requirements"
      - id: "A.5.32"
        name: "Intellectual property rights"
        objective: "Protect intellectual property"
      - id: "A.5.33"
        name: "Protection of records"
        objective: "Protect records from loss"
      - id: "A.5.34"
        name: "Privacy and protection of PII"
        objective: "Protect personal information"
      - id: "A.5.35"
        name: "Independent review of information security"
        objective: "Review security independently"
      - id: "A.5.36"
        name: "Compliance with policies, rules and standards"
        objective: "Ensure compliance"
      - id: "A.5.37"
        name: "Documented operating procedures"
        objective: "Document operating procedures"
  
  people:
    category: "A.6"
    title: "People Controls"
    controls:
      - id: "A.6.1"
        name: "Screening"
        objective: "Verify background of personnel"
      - id: "A.6.2"
        name: "Terms and conditions of employment"
        objective: "State security responsibilities in employment"
      - id: "A.6.3"
        name: "Information security awareness, education and training"
        objective: "Provide appropriate training"
      - id: "A.6.4"
        name: "Disciplinary process"
        objective: "Define disciplinary process for violations"
      - id: "A.6.5"
        name: "Responsibilities after termination or change of employment"
        objective: "Define post-employment responsibilities"
      - id: "A.6.6"
        name: "Confidentiality or non-disclosure agreements"
        objective: "Identify and document confidentiality requirements"
      - id: "A.6.7"
        name: "Remote working"
        objective: "Implement remote working security"
      - id: "A.6.8"
        name: "Information security event reporting"
        objective: "Report observed security events"
  
  physical:
    category: "A.7"
    title: "Physical Controls"
    controls:
      - id: "A.7.1"
        name: "Physical security perimeters"
        objective: "Define and use security perimeters"
      - id: "A.7.2"
        name: "Physical entry"
        objective: "Protect secure areas with entry controls"
      - id: "A.7.3"
        name: "Securing offices, rooms and facilities"
        objective: "Design and apply physical security"
      - id: "A.7.4"
        name: "Physical security monitoring"
        objective: "Monitor premises continuously"
      - id: "A.7.5"
        name: "Protecting against physical and environmental threats"
        objective: "Design and implement protection"
      - id: "A.7.6"
        name: "Working in secure areas"
        objective: "Design and implement procedures"
      - id: "A.7.7"
        name: "Clear desk and clear screen"
        objective: "Define clear desk/screen rules"
      - id: "A.7.8"
        name: "Equipment siting and protection"
        objective: "Site and protect equipment"
      - id: "A.7.9"
        name: "Security of assets off-premises"
        objective: "Protect off-site assets"
      - id: "A.7.10"
        name: "Storage media"
        objective: "Manage storage media throughout lifecycle"
      - id: "A.7.11"
        name: "Supporting utilities"
        objective: "Protect from utility failures"
      - id: "A.7.12"
        name: "Cabling security"
        objective: "Protect power and telecommunications cabling"
      - id: "A.7.13"
        name: "Equipment maintenance"
        objective: "Maintain equipment correctly"
      - id: "A.7.14"
        name: "Secure disposal or re-use of equipment"
        objective: "Verify data removal before disposal"
  
  technological:
    category: "A.8"
    title: "Technological Controls"
    controls:
      - id: "A.8.1"
        name: "User endpoint devices"
        objective: "Protect information on endpoint devices"
      - id: "A.8.2"
        name: "Privileged access rights"
        objective: "Restrict and manage privileged access"
      - id: "A.8.3"
        name: "Information access restriction"
        objective: "Restrict access in accordance with policy"
      - id: "A.8.4"
        name: "Access to source code"
        objective: "Manage access to source code"
      - id: "A.8.5"
        name: "Secure authentication"
        objective: "Implement secure authentication"
      - id: "A.8.6"
        name: "Capacity management"
        objective: "Monitor and adjust capacity"
      - id: "A.8.7"
        name: "Protection against malware"
        objective: "Implement malware protection"
      - id: "A.8.8"
        name: "Management of technical vulnerabilities"
        objective: "Obtain information and take action on vulnerabilities"
      - id: "A.8.9"
        name: "Configuration management"
        objective: "Define and implement configurations"
      - id: "A.8.10"
        name: "Information deletion"
        objective: "Delete information when no longer required"
      - id: "A.8.11"
        name: "Data masking"
        objective: "Use data masking per policy"
      - id: "A.8.12"
        name: "Data leakage prevention"
        objective: "Apply DLP measures"
      - id: "A.8.13"
        name: "Information backup"
        objective: "Maintain and test backup copies"
      - id: "A.8.14"
        name: "Redundancy of information processing facilities"
        objective: "Implement redundancy"
      - id: "A.8.15"
        name: "Logging"
        objective: "Produce, store, protect, and analyze logs"
      - id: "A.8.16"
        name: "Monitoring activities"
        objective: "Monitor for anomalous behavior"
      - id: "A.8.17"
        name: "Clock synchronization"
        objective: "Synchronize clocks to approved sources"
      - id: "A.8.18"
        name: "Use of privileged utility programs"
        objective: "Restrict and control utility programs"
      - id: "A.8.19"
        name: "Installation of software on operational systems"
        objective: "Implement procedures for software installation"
      - id: "A.8.20"
        name: "Networks security"
        objective: "Secure networks and network services"
      - id: "A.8.21"
        name: "Security of network services"
        objective: "Identify and include security in agreements"
      - id: "A.8.22"
        name: "Segregation of networks"
        objective: "Segregate groups of services and users"
      - id: "A.8.23"
        name: "Web filtering"
        objective: "Manage access to external websites"
      - id: "A.8.24"
        name: "Use of cryptography"
        objective: "Define and implement cryptography rules"
      - id: "A.8.25"
        name: "Secure development life cycle"
        objective: "Establish rules for secure development"
      - id: "A.8.26"
        name: "Application security requirements"
        objective: "Identify and specify security requirements"
      - id: "A.8.27"
        name: "Secure system architecture and engineering principles"
        objective: "Establish and apply principles"
      - id: "A.8.28"
        name: "Secure coding"
        objective: "Apply secure coding principles"
      - id: "A.8.29"
        name: "Security testing in development and acceptance"
        objective: "Define and implement testing"
      - id: "A.8.30"
        name: "Outsourced development"
        objective: "Direct and monitor outsourced development"
      - id: "A.8.31"
        name: "Separation of development, test and production environments"
        objective: "Separate and secure environments"
      - id: "A.8.32"
        name: "Change management"
        objective: "Subject changes to change management"
      - id: "A.8.33"
        name: "Test information"
        objective: "Protect test information"
      - id: "A.8.34"
        name: "Protection of information systems during audit testing"
        objective: "Plan and agree audit activities"

# =============================================================================
# IMPLEMENTATION GUIDANCE
# =============================================================================

implementation:
  risk_assessment:
    description: "Core ISMS process for identifying and treating risks"
    steps:
      - "Define risk assessment methodology"
      - "Identify assets and their owners"
      - "Identify threats and vulnerabilities"
      - "Assess likelihood and impact"
      - "Determine risk levels"
      - "Select treatment options"
      - "Implement controls"
      - "Monitor and review"
  
  statement_of_applicability:
    description: "Document which Annex A controls are applicable"
    contents:
      - "All Annex A controls"
      - "Justification for inclusion/exclusion"
      - "Implementation status"
      - "Reference to implementing procedures"
  
  certification_process:
    stages:
      stage1: "Documentation review and readiness assessment"
      stage2: "Full audit of ISMS implementation"
      surveillance: "Annual surveillance audits"
      recertification: "Full audit every 3 years"

# =============================================================================
# INTEGRATION
# =============================================================================

integration:
  cortex_patterns:
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#access_control"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#encryption_at_rest"
    - "cortex_brain/tier3/knowledge/COMPLIANCE/compliance-patterns.yaml#audit_logging"
  
  related_standards:
    - "soc2"
    - "nist-800-53"
    - "pci-dss"
