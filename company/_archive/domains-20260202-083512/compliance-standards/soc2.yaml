# SOC 2 Compliance Standard
# Service Organization Control 2
# Authority: American Institute of CPAs (AICPA)
# Source: https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/sorhome
# Version: 2017 Trust Services Criteria
# Last Updated: 2026-01-28

metadata:
  standard_id: "SOC2"
  version: "2017-TSC"
  governing_body: "American Institute of CPAs (AICPA)"
  applies_to:
    - "Service organizations that store, process, or transmit customer data"
    - "SaaS providers"
    - "Data centers"
    - "Managed service providers"
  public_reference: "https://www.aicpa.org/resources/landing/system-and-organization-controls-soc-suite-of-services"
  report_types:
    type1: "Design of controls at a point in time"
    type2: "Design and operating effectiveness over a period (typically 6-12 months)"

# =============================================================================
# TRUST SERVICES CRITERIA
# =============================================================================

trust_services_criteria:
  security:
    description: "Protection against unauthorized access (Required for all SOC 2)"
    principle: "The system is protected against unauthorized access, use, or modification"
    common_criteria:
      CC1:
        title: "Control Environment"
        criteria:
          - id: "CC1.1"
            description: "COSO Principle 1: Demonstrates commitment to integrity and ethical values"
          - id: "CC1.2"
            description: "COSO Principle 2: Board exercises oversight responsibility"
          - id: "CC1.3"
            description: "COSO Principle 3: Management establishes structures and reporting lines"
          - id: "CC1.4"
            description: "COSO Principle 4: Demonstrates commitment to competence"
          - id: "CC1.5"
            description: "COSO Principle 5: Enforces accountability"
      CC2:
        title: "Communication and Information"
        criteria:
          - id: "CC2.1"
            description: "COSO Principle 13: Uses relevant information"
          - id: "CC2.2"
            description: "COSO Principle 14: Communicates internally"
          - id: "CC2.3"
            description: "COSO Principle 15: Communicates externally"
      CC3:
        title: "Risk Assessment"
        criteria:
          - id: "CC3.1"
            description: "COSO Principle 6: Specifies suitable objectives"
          - id: "CC3.2"
            description: "COSO Principle 7: Identifies and analyzes risk"
          - id: "CC3.3"
            description: "COSO Principle 8: Assesses fraud risk"
          - id: "CC3.4"
            description: "COSO Principle 9: Identifies and assesses changes"
      CC4:
        title: "Monitoring Activities"
        criteria:
          - id: "CC4.1"
            description: "COSO Principle 16: Selects and develops ongoing/separate evaluations"
          - id: "CC4.2"
            description: "COSO Principle 17: Evaluates and communicates deficiencies"
      CC5:
        title: "Control Activities"
        criteria:
          - id: "CC5.1"
            description: "COSO Principle 10: Selects and develops control activities"
          - id: "CC5.2"
            description: "COSO Principle 11: Selects and develops general controls over technology"
          - id: "CC5.3"
            description: "COSO Principle 12: Deploys through policies and procedures"
      CC6:
        title: "Logical and Physical Access Controls"
        criteria:
          - id: "CC6.1"
            description: "Implements logical access security software"
          - id: "CC6.2"
            description: "Registers and authorizes users prior to access"
          - id: "CC6.3"
            description: "Removes access when no longer required"
          - id: "CC6.4"
            description: "Restricts physical access to facilities"
          - id: "CC6.5"
            description: "Protects physical assets from environmental threats"
          - id: "CC6.6"
            description: "Implements controls to restrict logical access"
          - id: "CC6.7"
            description: "Restricts transmission, movement, and removal"
          - id: "CC6.8"
            description: "Implements controls to prevent malicious software"
      CC7:
        title: "System Operations"
        criteria:
          - id: "CC7.1"
            description: "Detects and monitors security events"
          - id: "CC7.2"
            description: "Monitors system components for anomalies"
          - id: "CC7.3"
            description: "Evaluates security events"
          - id: "CC7.4"
            description: "Responds to security incidents"
          - id: "CC7.5"
            description: "Recovers from security incidents"
      CC8:
        title: "Change Management"
        criteria:
          - id: "CC8.1"
            description: "Authorizes, designs, develops, configures, tests changes"
      CC9:
        title: "Risk Mitigation"
        criteria:
          - id: "CC9.1"
            description: "Identifies and assesses vendor and business partner risks"
          - id: "CC9.2"
            description: "Assesses and manages risks from vendors"
  
  availability:
    description: "System is available for operation and use"
    principle: "The system is available for operation and use as committed or agreed"
    criteria:
      - id: "A1.1"
        description: "Maintains, monitors, and evaluates capacity"
      - id: "A1.2"
        description: "Authorizes, designs, and tests recovery procedures"
      - id: "A1.3"
        description: "Tests recovery plan procedures"
  
  processing_integrity:
    description: "System processing is complete, valid, accurate, timely, and authorized"
    principle: "System processing is complete, valid, accurate, timely, and authorized"
    criteria:
      - id: "PI1.1"
        description: "Obtains or generates, uses, and communicates relevant information"
      - id: "PI1.2"
        description: "Implements policies and procedures for complete and accurate input"
      - id: "PI1.3"
        description: "Implements policies and procedures for complete and accurate processing"
      - id: "PI1.4"
        description: "Implements policies and procedures for complete and accurate output"
      - id: "PI1.5"
        description: "Implements policies and procedures for timely processing"
  
  confidentiality:
    description: "Information designated as confidential is protected"
    principle: "Information designated as confidential is protected as committed or agreed"
    criteria:
      - id: "C1.1"
        description: "Identifies and maintains confidential information"
      - id: "C1.2"
        description: "Disposes of confidential information appropriately"
  
  privacy:
    description: "Personal information is collected, used, retained, disclosed, and disposed properly"
    principle: "Personal information is managed according to privacy notice commitments"
    criteria:
      - id: "P1.1"
        description: "Provides notice about privacy practices"
      - id: "P2.1"
        description: "Communicates choices about collection, use, and disclosure"
      - id: "P3.1"
        description: "Collects personal information consistent with objectives"
      - id: "P3.2"
        description: "Collects from reliable sources"
      - id: "P4.1"
        description: "Uses personal information consistent with objectives"
      - id: "P4.2"
        description: "Retains personal information consistent with objectives"
      - id: "P4.3"
        description: "Disposes of personal information properly"
      - id: "P5.1"
        description: "Grants access to data subjects"
      - id: "P5.2"
        description: "Corrects or amends upon data subject request"
      - id: "P6.1"
        description: "Discloses personal information only for identified purposes"
      - id: "P6.2"
        description: "Creates and retains record of disclosures"
      - id: "P6.3"
        description: "Creates and retains record of third party disclosures"
      - id: "P6.4"
        description: "Obtains privacy commitments from vendors"
      - id: "P6.5"
        description: "Obtains consent for cross-border transfers"
      - id: "P6.6"
        description: "Notifies of breaches"
      - id: "P6.7"
        description: "Provides effective dispute resolution"
      - id: "P7.1"
        description: "Collects and maintains quality information"
      - id: "P8.1"
        description: "Monitors compliance with privacy program"

# =============================================================================
# IMPLEMENTATION GUIDANCE
# =============================================================================

implementation:
  access_control:
    requirements:
      - "Unique user IDs for all users"
      - "Strong password policies"
      - "Multi-factor authentication for sensitive systems"
      - "Role-based access control"
      - "Quarterly access reviews"
      - "Timely access revocation"
    code_pattern: |
      class SOC2AccessControl:
          """SOC 2 compliant access control implementation."""
          
          def provision_access(self, user: User, role: Role) -> AccessGrant:
              """Provision access with SOC 2 controls (CC6.2)."""
              # Verify approval workflow
              if not self.has_manager_approval(user, role):
                  raise AccessDenied("Manager approval required")
              
              # Create unique user ID
              user_id = generate_unique_user_id(user)
              
              # Grant role-based access
              grant = AccessGrant(
                  user_id=user_id,
                  role=role,
                  granted_by=get_current_admin(),
                  granted_at=datetime.utcnow(),
                  review_date=datetime.utcnow() + timedelta(days=90)
              )
              
              # Log for audit
              self.log_access_change("GRANT", grant)
              
              return grant
          
          def quarterly_access_review(self) -> ReviewReport:
              """Perform quarterly access review (CC6.3)."""
              all_grants = get_all_active_grants()
              review_items = []
              
              for grant in all_grants:
                  review_item = AccessReviewItem(
                      grant=grant,
                      user_still_employed=check_employment_status(grant.user_id),
                      role_still_needed=verify_role_requirement(grant),
                      manager_review=get_manager_attestation(grant)
                  )
                  review_items.append(review_item)
              
              return ReviewReport(
                  review_date=datetime.utcnow(),
                  items=review_items,
                  reviewer=get_current_admin()
              )
  
  change_management:
    requirements:
      - "Formal change request process"
      - "Impact assessment"
      - "Testing in non-production environment"
      - "Approval before production deployment"
      - "Rollback procedures"
      - "Change documentation"
    code_pattern: |
      class SOC2ChangeManagement:
          """SOC 2 compliant change management (CC8.1)."""
          
          def submit_change(self, change: ChangeRequest) -> ChangeTicket:
              """Submit change request with required documentation."""
              ticket = ChangeTicket(
                  request=change,
                  impact_assessment=self.assess_impact(change),
                  test_plan=change.test_plan,
                  rollback_plan=change.rollback_plan,
                  status="PENDING_APPROVAL"
              )
              
              # Route for appropriate approval
              ticket.approvers = self.determine_approvers(ticket)
              
              return ticket
          
          def deploy_change(self, ticket: ChangeTicket) -> DeploymentResult:
              """Deploy approved change to production."""
              # Verify all approvals obtained
              if not ticket.is_fully_approved():
                  raise ChangeNotApproved("Missing required approvals")
              
              # Verify testing completed
              if not ticket.testing_completed:
                  raise ChangeNotTested("Testing not completed")
              
              # Deploy with audit logging
              result = self.execute_deployment(ticket)
              
              # Log deployment
              self.log_deployment(ticket, result)
              
              return result
  
  monitoring:
    requirements:
      - "Security event logging"
      - "Log review and analysis"
      - "Alerting for anomalies"
      - "Incident response procedures"
      - "Log retention (minimum 1 year)"
    events_to_log:
      - "Authentication attempts (success/failure)"
      - "Authorization failures"
      - "Privileged operations"
      - "Configuration changes"
      - "Data access events"
      - "Security alerts"
  
  vendor_management:
    requirements:
      - "Vendor risk assessment"
      - "Due diligence before engagement"
      - "Contractual security requirements"
      - "Ongoing monitoring"
      - "SOC 2 reports from critical vendors"

# =============================================================================
# AUDIT PREPARATION
# =============================================================================

audit_preparation:
  evidence_collection:
    - "Policies and procedures documentation"
    - "System configurations"
    - "Access lists and reviews"
    - "Change management tickets"
    - "Incident reports and response"
    - "Security awareness training records"
    - "Vendor assessments"
    - "Risk assessments"
    - "Penetration test results"
    - "Vulnerability scan reports"
  
  common_gaps:
    - "Incomplete access reviews"
    - "Missing change approvals"
    - "Inadequate logging"
    - "Missing vendor assessments"
    - "Incomplete incident documentation"
    - "Outdated policies"

