### Issue Group 1: TIMEOUT & CONFIGURATION (3 issues, 4-6 hours)

#### ISSUE #1: Thread Join Timeout Coverage Verification
**Source Agent:** Brittleness  
**Severity:** CRITICAL (execution blocker potential)  
**Effort:** LOW (1-2 hours)  
**Impact:** HIGH (prevents system hangs)  

**Problem:**
Thread timeout configuration exists but coverage across codebase not verified. If any `thread.join()` call missing timeout, system could hang indefinitely.

**Root Cause:**
No systematic verification that ALL blocking operations use configured timeouts.

**Remediation Steps:**
1. Add static analysis rule: `grep -rn "\.join()" src/ | grep -v timeout`
2. Create test: `test_no_thread_join_without_timeout()`
3. Add pre-commit hook to enforce rule
4. Document timeout requirements in CONTRIBUTING.md

**Success Criteria:**
- All `thread.join()` calls have timeout parameter
- Pre-commit hook prevents violations
- Zero timeout-related test failures

**Files to Modify:**
- `cortex/infrastructure/config.py` (add enforcement)
- `tests/infrastructure/test_brittleness_remediation.py` (add test)
- `.git/hooks/pre-commit` (add check)

