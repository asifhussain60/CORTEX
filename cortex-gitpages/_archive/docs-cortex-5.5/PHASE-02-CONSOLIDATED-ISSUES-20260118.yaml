#### ISSUE #8: Architecture Decision Documentation
**Source Agent:** Debt  
**Severity:** MEDIUM  
**Effort:** LOW (30-45 min)  
**Impact:** HIGH (improves onboarding)  
**QUICK WIN**

**Problem:**
Complex design decisions (exponential backoff, timeout values, fallback strategies) not documented. Future maintainers must reverse-engineer rationale.

**Root Cause:**
Code includes rationale in tests, but not in centralized documentation.

**Remediation Steps:**
1. Create `docs/ARCHITECTURE-DECISIONS.md`:
   ```markdown
   # Architecture Decisions
   
   ## AD-001: Exponential Backoff with 2x Multiplier
   **Decision:** Use 2x multiplier for exponential backoff
   **Rationale:** 
   - 2x balances quick recovery and resource conservation
   - 1.5x too aggressive (too many retries)
   - 3x too conservative (users wait too long)
   **Evidence:** Studied patterns in HTTPRetry, AWS SDK
   
   ## AD-002: 60s Max Delay Cap
   **Decision:** Cap max backoff delay at 60 seconds
   **Rationale:**
   - Beyond 60s, user typically gives up or retries manually
   - Prevents resource hoarding
   **Trade-offs:** Conservative (might wait unnecessarily), Safe
   ```
2. Link to from README
3. Add decision template for future decisions

**Success Criteria:**
- All major design decisions documented
- Rationale and evidence provided
- Team follows template for new decisions

**Files to Modify:**
- `docs/ARCHITECTURE-DECISIONS.md` (NEW)
- `README.md` (link to decisions)
