#### ISSUE #3: Database Connection Pool Isolation
**Source Agent:** Brittleness  
**Severity:** MEDIUM  
**Effort:** MEDIUM (2-3 hours)  
**Impact:** MEDIUM (prevents cascading DB failures)  

**Problem:**
Single shared database connection with global timeout. If one slow operation blocks, affects all other operations.

**Root Cause:**
No component-level connection pooling or bulkhead pattern implemented.

**Remediation Steps:**
1. Create `cortex/infrastructure/component_connection_pool.py`:
   ```python
   class ComponentConnectionPool:
       """Per-component connection isolation."""
       def __init__(self, component_name: str, max_connections: int = 3):
           self.component_name = component_name
           self.max_connections = max_connections
   ```
2. Update DatabaseTransactionManager to use pools
3. Add configuration for pool sizes per component
4. Add test: `test_database_pool_isolation()`

**Success Criteria:**
- Each component has dedicated connection pool
- Pool size configurable per component
- Slow query in one component doesn't block others

**Files to Modify:**
- `cortex/infrastructure/database_transaction_manager.py` (refactor)
- `cortex/infrastructure/component_connection_pool.py` (NEW)
- `tests/infrastructure/test_database_pools.py` (NEW)

