#### ISSUE #10: Fallback Chain Length Limiting
**Source Agent:** Brittleness  
**Severity:** MEDIUM  
**Effort:** LOW (1-2 hours)  
**Impact:** LOW (improves failure response time)  

**Problem:**
Fallback strategies tried sequentially with no attempt limit. Long chains waste time under cascading failure.

**Root Cause:**
GracefulDegradationFramework iterates all fallbacks without timeout/limit.

**Remediation Steps:**
1. Add `max_fallback_attempts` config (default: 3)
2. Add `fallback_time_budget` config (default: 5 seconds)
3. Abort fallback chain if time budget exceeded
4. Add tests verifying limits

**Code Change:**
```python
class GracefulDegradationFramework:
    def __init__(self, max_fallback_attempts: int = 3, time_budget: float = 5.0):
        self.max_fallback_attempts = max_fallback_attempts
        self.time_budget = time_budget
    
    def execute_with_degradation(self, ...):
        start_time = time.time()
        attempts = 0
        
        for fallback in fallbacks:
            if attempts >= self.max_fallback_attempts:
                break
            if time.time() - start_time > self.time_budget:
                break
            attempts += 1
            # ... execute fallback
```

**Success Criteria:**
- Fallback chain stops after max attempts
- Time budget prevents excessive waiting
- Tests verify limits enforced

**Files to Modify:**
- `cortex_brain/tier2/resilience.py` (add limits)
- `tests/unit/test_graceful_degradation.py` (add tests)

