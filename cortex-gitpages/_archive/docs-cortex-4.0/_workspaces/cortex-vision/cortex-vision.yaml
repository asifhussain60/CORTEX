  full_name: "Cognitive Orchestration Runtime for Technical Excellence"
  tagline: "AI-Powered Development Orchestration System"
  
  purpose: |
    An autonomous AI orchestration framework that enhances software development 
    through intelligent planning, execution, and governance. CORTEX treats AI 
    as a collaborative partner, not just a tool.

  core_philosophy:
    - "Single Source of Truth (SSOT) - One canonical location for each type of data"
    - "Autonomous Execution - AI agents can execute complex workflows independently"
    - "Test-Driven Development - Every feature validated through comprehensive tests"
    - "Brain Protection - Governance rules prevent destructive AI actions"
    - "Holistic Validation - Changes validated against entire system, not just local scope"

