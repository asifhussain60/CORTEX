# ═══════════════════════════════════════════════════════════════════════════
# GUIDING PRINCIPLES
# ═══════════════════════════════════════════════════════════════════════════

principles:
  development:
    - "YAML-only for plans - never markdown docs"
    - "AC-ID driven - every action tied to acceptance criteria"
    - "Test first - every AC needs a passing test"
    - "Lock when done - prevent reimplementation"
    
  modification:
    - "Holistic validation before any change"
    - "Check conflicts, contradictions, ambiguity"
    - "Preserve phase coherence and dependencies"
    - "Update counts when AC-IDs change"
    
  governance:
    - "Tier 0 rules are immutable"
    - "Brain protection prevents destructive actions"
    - "Audit logging for all significant operations"
    - "Pre-flight checks before execution"
    
  tooling_centralization:
    principle: "One implementation per capability"
    examples:
      - "AST scanning → CORTEX LENS (PHASE-07)"
      - "Knowledge graph → CORTEX LENS (PHASE-07)"
      - "Visualization → Neural Observatory (PHASE-15)"
    anti_pattern: "Duplicating tools across components"
    
  simplicity:
    principle: "Simplest viable approach first"
    examples:
      - "YAML property over Python CLI tool"
      - "Single phase_tracker over multiple tracking files"
      - "Read existing data over new infrastructure"
    anti_pattern: "Over-engineering solutions"

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENT RELATIONSHIPS
# ═══════════════════════════════════════════════════════════════════════════

component_relationships:
  cortex_lens_vs_neural_observatory:
    cortex_lens:
      type: "Tooling / Analysis Layer"
      purpose: "Code intelligence, AST scanning, knowledge graph building"
      phase: "PHASE-07-INTENT-ROUTER"
      produces: "Analysis data, knowledge graphs, relationships"
      
    neural_observatory:
      type: "Visualization Layer"
      purpose: "Dashboard SPA for CORTEX brain visualization"
      phase: "PHASE-15-NEURAL-OBSERVATORY"
      consumes: "Existing SSOT data (governance.db, cortex-master.yaml)"
      
    relationship: |
      Neural Observatory is INDEPENDENT of CORTEX LENS.
      Observatory reads existing data that already exists today.
      LENS (when built) will add optional enhanced views to Observatory.
      Observatory does NOT depend on LENS for core functionality.
