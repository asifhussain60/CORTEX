### AC-PHASE0-01: Create Authoritative cortex-master.yaml

**Title:** Create cortex-master.yaml (v3.1) with canonical phase_tracker

**Description:**
```yaml
File: _workspaces/roadmap/cortex-master.yaml (NEW, canonical authority)

Sections Required:
  1. metadata
     - version: 3.1
     - date: 2026-01-20
     - authority: "filesystem scan + cortex-builder.prompt.md guidelines"
     - next_review: 2026-01-27
  
  2. phase_tracker
     Each phase with:
     - id, title, category (ARCH/CONSOLIDATION/REMEDIATION/ENHANCEMENT)
     - locked: boolean (true = complete, false = not started/in progress)
     - blocked_by: array of blocking phase IDs or issues
     - acs_total, acs_complete
     - tests_total, tests_passing, tests_target_pct
     - dependencies: array of required completed phases
     - status_reason: why locked/unlocked
     - last_audit: date
  
  3. blocked_issues (explicit list)
     - consolidation-001: 263 import errors, ~30 src.* imports remain
     - core-rules-missing: core-rules.yaml not in cortex_brain/tier0/governance/
     - tier-system-incomplete: tier1 empty, tier2 empty
     - mcp-stubs-only: 14/14 MCP tools return mock data, not functional
     - governance-enforcement: cannot validate CORE-008/011/012/013 without rules
  
  4. critical_path
     Order for immediate implementation:
     - phase-0-roadmap-healing (THIS PHASE)
     - consolidation-001-src-cleanup
     - impl-tdd-prod-ready-remediation phases 1-2
     - tier-system-population
     - Then remaining phases in order
  
  5. decision_tree (per cortex-builder.prompt.md § "Phase Decision Table")
     Phase Status | Action
     COMPLETED    | 🚫 REFUSE - already done, locked: true
     PARTIAL      | ⏳ CONTINUE - extend implementation
     STUB         | ✅ IMPLEMENT - functional code required
     MISSING      | 🔨 CREATE - from scratch
```

