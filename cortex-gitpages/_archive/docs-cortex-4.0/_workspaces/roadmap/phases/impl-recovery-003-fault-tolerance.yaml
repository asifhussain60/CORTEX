# PHASE: Error Recovery and Fault Tolerance
# ID: impl-recovery-003-fault-tolerance
# Priority: P0-CRITICAL (Blocks Production)
# Date: 2026-01-20

metadata:
  phase_id: "impl-recovery-003-fault-tolerance"
  title: "Error Recovery and Fault Tolerance"
  priority: "P0-CRITICAL"
  status: "NOT_STARTED"
  estimated_effort: "5-7 days"
  blocks_production: true
  dependencies: ["impl-infra-001-resilience", "impl-state-002-concurrency"]

executive_summary: |
  Current error handling is fragile with incomplete recovery paths, inconsistent error
  propagation, and missing compensation logic. Failures leave system in inconsistent state,
  partial operations aren't rolled back, and cascading failures aren't prevented.
  
  This phase implements comprehensive error recovery with compensation transactions,
  saga pattern for distributed operations, automatic repair mechanisms, and fault isolation
  to ensure system remains consistent even under failures.

problem_analysis:
  root_causes:
    incomplete_error_paths:
      issue: "Error handlers don't clean up partial state"
      location: "Multiple orchestrators, governance checks"
      risk: "Orphaned resources, inconsistent state"
      failure_mode: "Retries fail on stale state, manual cleanup required"
      example: "Phase marked IN_PROGRESS but orchestrator crashed"
    
    missing_compensation_logic:
      issue: "No undo operations for failed multi-step processes"
      risk: "Partial execution leaves system inconsistent"
      failure_mode: "Phase completed but AC not marked, manual reconciliation"
      current: "Simple rollback, no compensation transactions"
    
    cascading_failure_propagation:
      issue: "Errors propagate without isolation"
      location: "Orchestrator call chains"
      risk: "Single component failure brings down entire system"
      failure_mode: "Audit failure blocks all operations"
    
    no_automatic_repair:
      issue: "Inconsistencies detected but not repaired"
      location: "Hash chain verification, phase integrity checks"
      risk: "System degrades over time, requires manual intervention"
      example: "Hash chain break detected but not auto-repaired"
    
    insufficient_error_context:
      issue: "Errors lack causality, correlation, recovery hints"
      risk: "Difficult to diagnose root cause"
      failure_mode: "Operators can't determine recovery path"

  production_impact:
    correctness:
      - "Partial operations leave system in undefined state"
      - "Retry logic assumes clean slate (false assumption)"
      - "Compensation missing causes data inconsistency"
    
    reliability:
      - "Single component failure cascades system-wide"
      - "No automatic recovery from transient failures"
      - "Manual intervention required for common failures"
    
    operability:
      - "Operators lack runbook for common failure modes"
      - "Error messages insufficient for diagnosis"
      - "No automatic repair for known issues"

acceptance_criteria:
  AC-RECOVERY-003-01:
    title: "Compensation Transaction Pattern (Saga)"
    description: |
      Implement saga pattern for long-running multi-step operations with
      automatic compensation on partial failure.
    
    requirements:
      - "Saga coordinator tracks execution steps"
      - "Each step has compensating transaction"
      - "Forward recovery: retry transient failures"
      - "Backward recovery: compensate completed steps"
      - "Saga state persisted for crash recovery"
      - "Timeout handling: compensate after deadline"
    
    edge_cases:
      - "Compensation fails: retry with exponential backoff"
      - "Non-compensatable step: mark saga as stuck, alert"
      - "Partial compensation: track progress, continue from checkpoint"
      - "Coordinator crash: resume saga from persisted state"
      - "Idempotency: compensations safe to retry"
    
    validation:
      - "Multi-step operation fails at step 3, steps 1-2 compensated"
      - "Saga resumes after coordinator restart"
      - "Compensation idempotent (safe to retry)"
      - "Saga state auditable end-to-end"
    
    files:
      implementation: "cortex/core/recovery/saga_coordinator.py"
      tests: "tests/unit/recovery/test_saga_compensation.py"
      integration: "tests/integration/test_saga_under_failure.py"

  AC-RECOVERY-003-02:
    title: "Orphaned Resource Detection and Cleanup"
    description: |
      Automatically detect and clean up resources left inconsistent by
      failures: dangling locks, incomplete operations, stale state.
    
    requirements:
      - "Resource scanner runs every 5 minutes"
      - "Detection: operations stuck >1 hour, locks held >10 minutes"
      - "Cleanup strategies: release lock, mark failed, reset state"
      - "Audit trail: log all cleanup actions with reasoning"
      - "Manual override: operator can force cleanup"
      - "Safe cleanup: only orphaned resources, not active"
    
    edge_cases:
      - "Resource active but appears orphaned: verify liveness before cleanup"
      - "Cleanup fails: mark for manual intervention"
      - "Cascading cleanup: related resources cleaned together"
      - "Partial cleanup: track progress, resume on retry"
    
    validation:
      - "Orphaned lock released automatically after 10 minutes"
      - "Stuck operation marked failed after timeout"
      - "Active operations not cleaned up prematurely"
      - "Cleanup audited with full justification"
    
    files:
      implementation: "cortex/core/recovery/orphan_cleaner.py"
      tests: "tests/unit/recovery/test_orphan_detection.py"

  AC-RECOVERY-003-03:
    title: "Automatic State Repair Mechanisms"
    description: |
      Implement self-healing for known inconsistency patterns:
      hash chain breaks, version mismatches, referential integrity.
    
    requirements:
      - "Repair triggers: on detection, on schedule (daily), on demand"
      - "Repair strategies: rebuild hash chain, recompute aggregates, fix refs"
      - "Dry-run mode: detect without modifying"
      - "Repair audit: before/after state, actions taken"
      - "Rollback capability: undo repair if validation fails"
      - "Repair metrics: success rate, duration, items fixed"
    
    edge_cases:
      - "Multiple inconsistencies: prioritize by severity"
      - "Repair conflicts with active operations: defer or abort"
      - "Irreparable corruption: quarantine, alert operator"
      - "Partial repair: checkpoint progress, resume on retry"
    
    validation:
      - "Hash chain break repaired automatically"
      - "Referential integrity restored"
      - "Repair doesn't introduce new inconsistencies"
      - "Dry-run accurate (matches actual repair)"
    
    files:
      implementation: "cortex/core/recovery/state_repair.py"
      tests: "tests/unit/recovery/test_automatic_repair.py"

  AC-RECOVERY-003-04:
    title: "Error Isolation and Fault Containment"
    description: |
      Implement bulkheads to isolate failures and prevent cascading:
      separate failure domains, timeout propagation, error budget.
    
    requirements:
      - "Failure domains: governance, audit, knowledge, orchestration"
      - "Domain isolation: failure in one doesn't block others"
      - "Timeout propagation: parent timeout splits among children"
      - "Error budget: track failures per domain per time window"
      - "Automatic degradation: disable failing domain after budget exhausted"
      - "Recovery: re-enable domain after health check passes"
    
    edge_cases:
      - "All domains failing: system-wide degradation mode"
      - "Domain flip-flop: increase backoff on repeated failures"
      - "Partial domain failure: isolate to specific operations"
      - "Error budget reset: gradual restoration after recovery"
    
    validation:
      - "Audit failure doesn't block governance checks"
      - "Knowledge query timeout doesn't cascade"
      - "Domain automatically disabled after error budget exhausted"
      - "Domain recovers automatically when healthy"
    
    files:
      implementation: "cortex/infrastructure/fault_isolator.py"
      tests: "tests/unit/infrastructure/test_fault_isolation.py"

  AC-RECOVERY-003-05:
    title: "Structured Error Context and Causality"
    description: |
      Implement rich error context with causality chains, correlation IDs,
      recovery suggestions, and structured error types.
    
    requirements:
      - "Error types: Transient, Permanent, Configuration, Validation"
      - "Causality chain: error → root cause → contributing factors"
      - "Correlation ID: trace through distributed system"
      - "Recovery hints: operator actions, automatic retry guidance"
      - "Structured logging: errors machine-parseable"
      - "PII sanitization: remove sensitive data from errors"
    
    edge_cases:
      - "Circular causality: detect, break cycle, warn"
      - "Missing correlation ID: generate, propagate"
      - "Error context too large: truncate with summary"
      - "PII in error message: redact automatically"
    
    validation:
      - "All errors include correlation ID"
      - "Causality chain traceable end-to-end"
      - "Recovery hints present for common failures"
      - "No PII in error logs"
    
    files:
      implementation: "cortex/core/errors/structured_error.py"
      tests: "tests/unit/errors/test_error_context.py"

  AC-RECOVERY-003-06:
    title: "Crash Recovery and State Reconstruction"
    description: |
      Implement crash recovery to restore consistent state after
      process crash, ensuring no data loss or corruption.
    
    requirements:
      - "Write-ahead log (WAL) for critical state changes"
      - "Startup recovery: replay WAL, reconcile state"
      - "Checkpoint mechanism: periodic consistent snapshots"
      - "In-flight operation detection: resume or abort"
      - "State validation: verify integrity post-recovery"
      - "Recovery metrics: time to recover, records replayed"
    
    edge_cases:
      - "WAL corrupted: fallback to last checkpoint"
      - "Checkpoint during recovery: defer until complete"
      - "Concurrent recovery: coordinate via lock"
      - "State irreparably corrupted: alert, manual intervention"
    
    validation:
      - "Crash mid-operation: state consistent after recovery"
      - "WAL replay idempotent (safe to replay)"
      - "Recovery time <30 seconds for typical workload"
      - "Zero data loss for committed operations"
    
    files:
      implementation: "cortex/infrastructure/crash_recovery.py"
      tests: "tests/unit/infrastructure/test_crash_recovery.py"
      chaos: "tests/chaos/test_crash_at_random_times.py"

implementation_strategy:
  phase_1_compensation:
    duration: "2 days"
    focus: "Saga pattern and compensation transactions"
    deliverables:
      - "AC-RECOVERY-003-01: Saga coordinator"
      - "AC-RECOVERY-003-02: Orphan cleanup"
    validation: "Multi-step failures compensate correctly"
  
  phase_2_repair:
    duration: "2 days"
    focus: "Automatic repair and state reconstruction"
    deliverables:
      - "AC-RECOVERY-003-03: State repair mechanisms"
      - "AC-RECOVERY-003-06: Crash recovery"
    validation: "System self-heals common issues"
  
  phase_3_isolation:
    duration: "2 days"
    focus: "Fault isolation and error context"
    deliverables:
      - "AC-RECOVERY-003-04: Fault containment"
      - "AC-RECOVERY-003-05: Structured errors"
    validation: "Failures isolated, errors diagnosable"
  
  phase_4_validation:
    duration: "1 day"
    focus: "Chaos engineering and recovery testing"
    deliverables:
      - "Chaos tests: random failures, crash recovery"
      - "Operator runbook: common failures and recovery"
      - "Recovery playbook automation"

testing_strategy:
  unit_tests:
    - "Saga: compensation execution, state persistence, idempotency"
    - "Orphan cleanup: detection accuracy, safe cleanup"
    - "State repair: repair strategies, dry-run mode"
    - "Fault isolation: domain independence, error budget"
    - "Structured errors: causality tracking, PII sanitization"
    - "Crash recovery: WAL replay, checkpoint restoration"
  
  integration_tests:
    - "Multi-step saga fails mid-execution, compensates correctly"
    - "Orphaned resources cleaned up automatically"
    - "State corruption detected and repaired"
    - "Domain failure isolated to that domain"
    - "Crash during operation, recovery restores consistency"
  
  chaos_tests:
    - "Kill process at random points, verify recovery"
    - "Inject failures in compensation logic"
    - "Corrupt state, verify repair"
    - "Exhaust error budget, verify degradation"
    - "Network partition during saga execution"

success_criteria:
  correctness:
    - "Zero inconsistent state after failure + recovery"
    - "All compensations idempotent and complete"
    - "State repair accurate 100% on known patterns"
    - "Crash recovery restores consistent state"
  
  reliability:
    - "Automatic recovery from 95% of transient failures"
    - "Operator intervention only for novel failures"
    - "System self-heals within 5 minutes"
    - "Fault isolation prevents >90% of cascades"
  
  operability:
    - "Error messages actionable for operators"
    - "Recovery playbook automated where possible"
    - "State inspection tools for diagnosis"
    - "Audit trail for all recovery actions"

monitoring_requirements:
  metrics:
    - "saga_compensations_total (counter: success, failure)"
    - "orphaned_resources_detected (counter)"
    - "state_repairs_attempted (counter: success, failure)"
    - "fault_isolation_triggers (counter by domain)"
    - "crash_recovery_duration_seconds (histogram)"
    - "error_budget_remaining (gauge by domain)"
  
  alerts:
    - "Saga stuck (no progress >10 minutes)"
    - "Orphaned resource cleanup failing repeatedly"
    - "State repair unable to fix corruption"
    - "Domain error budget exhausted"
    - "Crash recovery taking >30 seconds"
