# CORTEX Implementation Phase: Duration Intelligence
# Phase ID: impl-intelligence-002-duration
# Priority: P1 (High-value quick win)
# Source: INTELLIGENCE-IMPLEMENTATION-ROADMAP.md (Module 2)
# Date: 2026-01-20

metadata:
  phase_id: "impl-intelligence-002-duration"
  title: "Operation Duration Intelligence"
  description: "Build duration baselines per operation type; detect slow operations"
  priority: "P1"
  estimated_effort: "2-3 hours"
  source_spec: "docs/INTELLIGENCE-IMPLEMENTATION-ROADMAP.md (Module 2)"
  status: "COMPLETED"
  locked: true
  completed_date: "2026-01-20"
  git_commit: "82301bac9"

objective:
  summary: "Build p50/p95/p99 duration baselines per operation type; proactively flag slow operations"
  business_value: "Enable early detection of performance degradation before user impact"

gap_analysis:
  current_state:
    - "Execution times recorded in metrics"
    - "No baseline/normal comparison per operation type"
    - "Generic anomaly detection exists but not operation-specific"
    - "No correlation between operation complexity and duration"
  
  missing_capability:
    - "Duration baseline calculation (p50, p95, p99) per operation type"
    - "Slow operation detection (duration > p99)"
    - "Handler performance comparison"
    - "Operation-type-aware performance monitoring"

acceptance_criteria:
  - id: "INT-DUR-002-01"
    description: "DurationAnalyzer records operation durations"
    verification:
      - "record_operation_duration() stores operation_type, duration_ms, handler_name, success"
      - "Data persisted to governance.db operation_durations table"
      - "Supports operation types: implement, fix, refactor, discovery, validation"
    tests:
      - "test_record_operation_duration()"
      - "test_operation_type_validation()"
      - "test_database_persistence()"
  
  - id: "INT-DUR-002-02"
    description: "DurationAnalyzer calculates duration baselines"
    verification:
      - "get_duration_baseline() returns p50, p95, p99, min, max, mean, count"
      - "Filters by operation_type"
      - "Supports time window filtering (days parameter)"
      - "Handles empty data gracefully"
    tests:
      - "test_get_duration_baseline_all_operations()"
      - "test_get_duration_baseline_specific_operation()"
      - "test_duration_baseline_time_window()"
      - "test_baseline_calculation_edge_cases()"
  
  - id: "INT-DUR-002-03"
    description: "DurationAnalyzer detects slow operations"
    verification:
      - "detect_slow_operations() identifies operations exceeding percentile threshold"
      - "Returns operation_type, duration_ms, baseline_p99, excess_ms, handler, timestamp"
      - "Configurable percentile_threshold (default 99)"
      - "Filters by time window"
    tests:
      - "test_detect_slow_operations_single()"
      - "test_detect_slow_operations_multiple()"
      - "test_detect_slow_operations_empty()"
      - "test_percentile_threshold_configuration()"
      - "test_time_window_filtering()"
  
  - id: "INT-DUR-002-04"
    description: "DurationAnalyzer calculates handler average durations"
    verification:
      - "get_handler_average_duration() returns durations grouped by operation_type"
      - "Filters by handler_name"
      - "Supports time window filtering"
      - "Enables handler performance comparison"
    tests:
      - "test_get_handler_average_duration()"
      - "test_handler_comparison()"
      - "test_handler_not_found()"

implementation:
  files_to_create:
    - path: "cortex/core/intelligence/duration_intelligence.py"
      loc: 180
      classes:
        - name: "DurationAnalyzer"
          methods:
            - "record_operation_duration(operation_type, duration_ms, handler_name, success)"
            - "get_duration_baseline(operation_type, days=30)"
            - "detect_slow_operations(percentile_threshold=99, days=7)"
            - "get_handler_average_duration(handler_name, days=7)"
    
    - path: "tests/unit/intelligence/test_duration_intelligence.py"
      loc: 250
      test_count: 12
  
  files_to_modify:
    - path: "cortex/orchestrators/core/master_orchestrator_stage_3.py"
      changes: "+5 lines after handler execution"
      reason: "Extract operation_type from routing decision; call duration_analyzer.record_operation_duration()"
      location: "After handler result and timing measurement"
    
    - path: "cortex/brain/core/observability/metrics_aggregator.py"
      changes: "+3 lines to add operation_type dimension"
      reason: "Enable operation-type-aware metrics collection"
  
  database_changes:
    table: "operation_durations"
    columns:
      - "id UUID PRIMARY KEY"
      - "operation_type VARCHAR(50) NOT NULL"
      - "duration_ms FLOAT NOT NULL"
      - "handler_name VARCHAR(255)"
      - "success BOOLEAN"
      - "timestamp DATETIME NOT NULL"
    indexes:
      - "idx_duration_timestamp ON timestamp"
      - "idx_duration_operation ON operation_type"
      - "idx_duration_handler ON handler_name"

api_specification:
  class: "DurationAnalyzer"
  
  methods:
    - name: "record_operation_duration"
      params:
        - "operation_type: str"  # implement, fix, refactor, discovery, validation
        - "duration_ms: float"
        - "handler_name: str"
        - "success: bool"
      returns: "None"
      docstring: "Record execution duration for an operation"
    
    - name: "get_duration_baseline"
      params:
        - "operation_type: str"
        - "days: int = 30"
      returns: "Dict[str, float]"
      example_output:
        p50: 150.0
        p95: 450.0
        p99: 800.0
        min: 50.0
        max: 2500.0
        mean: 200.0
        count: 500
    
    - name: "detect_slow_operations"
      params:
        - "percentile_threshold: int = 99"
        - "days: int = 7"
      returns: "List[Dict[str, Any]]"
      example_output:
        - operation_type: "implement"
          duration_ms: 2500
          baseline_p99: 800
          excess_ms: 1700
          handler: "handler_a"
          timestamp: "2026-01-20T10:30:00Z"
    
    - name: "get_handler_average_duration"
      params:
        - "handler_name: str"
        - "days: int = 7"
      returns: "Dict[str, float]"
      example_output:
        implement: 450.0
        fix: 200.0
        refactor: 350.0
        discovery: 150.0
        validation: 100.0

governance:
  compliance:
    - "CORE-008: TDD - tests written before implementation"
    - "CORE-011: Type hints on all public methods"
    - "CORE-012: Google docstrings on all classes and methods"
    - "CORE-013: No bare except clauses"
    - "CORE-027: AC_START → AC_EXECUTE → AC_COMPLETE audit trail"
  
  audit_trail:
    - event: "AC_START"
      phase: "impl-intelligence-002-duration"
      ac_id: "INT-DUR-002-01"
    - event: "AC_EXECUTE"
      phase: "impl-intelligence-002-duration"
      ac_id: "INT-DUR-002-01"
    - event: "AC_COMPLETE"
      phase: "impl-intelligence-002-duration"
      ac_id: "INT-DUR-002-01"

testing_strategy:
  unit_tests:
    count: 12
    framework: "pytest"
    coverage_target: "100%"
    tests:
      - "test_record_operation_duration() - Basic recording"
      - "test_operation_type_validation() - Valid operation types only"
      - "test_database_persistence() - Data integrity"
      - "test_get_duration_baseline_all_operations() - Overall baseline"
      - "test_get_duration_baseline_specific_operation() - Filtered baseline"
      - "test_duration_baseline_time_window() - Time filtering"
      - "test_baseline_calculation_edge_cases() - Empty data, single data point"
      - "test_detect_slow_operations_single() - Single slow operation"
      - "test_detect_slow_operations_multiple() - Multiple slow operations"
      - "test_detect_slow_operations_empty() - No slow operations"
      - "test_percentile_threshold_configuration() - Custom threshold (p95, p90)"
      - "test_time_window_filtering() - Date range validation"
  
  integration_tests:
    - "test_duration_analyzer_master_orchestrator_integration()"
    - "test_duration_baseline_metrics_correlation()"

dependencies:
  requires:
    - "impl-intelligence-001-routing.yaml"
  blocks: []
  related:
    - "impl-intelligence-003-errors.yaml"
    - "impl-intelligence-006-efficiency.yaml"

risks_and_mitigations:
  - risk: "Percentile calculation overhead for large datasets"
    mitigation: "Cache baselines; recalculate hourly not per-query"
    severity: "LOW"
  
  - risk: "Data volume growth (500+ operations/day)"
    mitigation: "30-day retention policy; cleanup job"
    severity: "LOW"
  
  - risk: "Incorrect operation_type classification"
    mitigation: "Validate operation_type enum; log warnings"
    severity: "MEDIUM"

success_metrics:
  - metric: "All 12 unit tests passing"
    target: "100%"
  
  - metric: "Baseline calculation performance"
    target: "get_duration_baseline() <200ms for 30-day window"
  
  - metric: "Slow operation detection accuracy"
    target: "Detects 100% of operations exceeding p99"
  
  - metric: "Integration overhead"
    target: "<3ms per operation"

rollback_plan:
  - step: "Remove duration_analyzer.record_operation_duration() call from master_orchestrator_stage_3.py"
  - step: "Revert metrics_aggregator.py changes"
  - step: "Drop operation_durations table"
  - step: "Remove duration_intelligence.py module"
  - step: "Revert git commit"

validation:
