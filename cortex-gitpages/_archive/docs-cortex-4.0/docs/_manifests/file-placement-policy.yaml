---
# CORTEX File Placement & Governance Policy
# Purpose: Enforce consistent file organization and prevent SSOT conflicts
# Authority: Enforced across ALL agents
# Version: 1.0.0
# Updated: 2026-01-20

# Core Policy
policy:
  name: "CORTEX File Placement & Governance"
  scope: "All documentation, configuration, and working files"
  enforcement_level: "STRICT"
  override_allowed: false
  version_pinned: "1.0.0"

# Canonical File Locations (SSOT)
canonical_sources:
  master_plan:
    file: "cortex-master.yaml"
    authority: "CANONICAL"
    owner: "cortex-builder"
    mutable: true
    scope: "Phase definitions, AC-IDs, live capabilities"
    usage: "Load before ANY documentation work"

  documentation_strategy:
    file: ".github/prompts/cortex-doc.prompt.md"
    authority: "CANONICAL"
    owner: "documentation team"
    mutable: true
    scope: "Folder hierarchy, naming conventions, strategy"
    usage: "Load before starting migration"

  documentation_root:
    directory: "docs/"
    authority: "CANONICAL"
    owner: "All"
    mutable: true
    scope: "All production documentation"
    usage: "Single location for all user-facing docs"

  archive_location:
    directory: "docs/_archive/"
    authority: "CANONICAL"
    owner: "All"
    mutable: false
    scope: "Historical documentation, working artifacts"
    usage: "Write-once, read-often for historical reference"

  manifests:
    directory: "docs/_manifests/"
    authority: "CANONICAL"
    owner: "cortex-documentation agent"
    mutable: true
    scope: "Content registry, file tracking, validation reports"
    usage: "Updated after each operation"

# Forbidden File Locations & Patterns
forbidden_patterns:
  # Pattern 1: Markdown reports outside docs/
  markdown_outside_docs:
    pattern: "*.md"
    exclude_paths:
      - "docs/**/*.md"
      - ".github/prompts/*.md"
      - ".github/agents/*.md"
      - "README.md"  # Root README only
      - "LICENSE.md"
    allowed_exception: "None - strict enforcement"
    violation_severity: "CRITICAL"
    action_on_violation: "Delete immediately and consolidate to docs/"
    example_violations:
      - "docs_md/section-name.md"
      - "documentation/guide.md"
      - "working/analysis.md"

  # Pattern 2: docs_md folder
  docs_md_folder:
    pattern: "docs_md/"
    location: "Root or any subdirectory"
    allowed_exception: "None - forbidden by architecture"
    violation_severity: "CRITICAL"
    action_on_violation: "Delete entire directory, migrate contents to docs/"
    reason: "Structure violation, causes duplicate documentation"

  # Pattern 3: Working session logs in active tree
  session_logs:
    pattern: "SESSION-*.md, CHAT*.md"
    exclude_paths:
      - "docs/_archive/sessions/*"
      - ".github/agents/cortex-agents-*.md"  # Agent docs only
    allowed_exception: "None in production tree"
    violation_severity: "HIGH"
    action_on_violation: "Archive to docs/_archive/sessions/"
    reason: "Working artifacts, should be archived"

  # Pattern 4: Date-stamped files in active tree
  date_stamped_files:
    pattern: "*-20260[0-9][0-9][0-9]-[0-9][0-9].md"
    exclude_paths:
      - "docs/_archive/**"
      - ".github/agents/cortex-agents-update-*.md"  # Agent updates only
    allowed_exception: "None in production docs"
    violation_severity: "MEDIUM"
    action_on_violation: "Rename to remove date, archive original"
    reason: "Temporal naming pollutes production tree"

  # Pattern 5: Phase designations in active tree
  phase_designations:
    pattern: "PHASE-*.md"
    exclude_paths:
      - "docs/_archive/phases/*"
      - ".github/agents/*.md"  # Agent reference only
    allowed_exception: "None in production tree"
    violation_severity: "HIGH"
    action_on_violation: "Archive to docs/_archive/phases/"
    reason: "Phase artifacts, should be archived"

  # Pattern 6: Multiple documentation sources for same topic
  duplicate_documentation:
    pattern: "Multiple .md files with >80% similar content"
    exclude_paths: "None - consolidate all"
    allowed_exception: "None - single source per topic"
    violation_severity: "HIGH"
    action_on_violation: "Consolidate into primary file, archive secondaries"
    reason: "SSOT violation, maintenance nightmare"

  # Pattern 7: Python scripts in root
  root_python_scripts:
    pattern: "/*.py"
    exclude_paths:
      - "setup.py"
      - "pyproject.toml"
      - "pytest.ini"
    allowed_exception: "None - scripts in src/ or scripts/"
    violation_severity: "MEDIUM"
    action_on_violation: "Move to src/ or scripts/ directory"
    reason: "Root pollution, breaks project structure"

  # Pattern 8: Governance reports as .md files
  governance_reports_md:
    pattern: "*GOVERNANCE*.md, *COMPLIANCE*.md outside docs/"
    exclude_paths:
      - "docs/**/*.md"
      - ".github/agents/*.md"
    allowed_exception: "None - use YAML format"
    violation_severity: "HIGH"
    action_on_violation: "Delete .md report, use YAML format to _manifests/"
    reason: "Authority confusion, should use YAML for tracking"

# Required File Locations
required_locations:
  production_docs:
    path: "docs/"
    structure:
      - "0-README.md"
      - "01-getting-started/"
      - "02-architecture/"
      - "03-api-reference/"
      - "04-guides/"
      - "05-reference/"
      - "06-tutorials/"
      - "07-contributing/"
      - "_archive/"
      - "_media/"
      - "_manifests/"
    mandatory: true
    reason: "Single source of truth for documentation"

  agent_definitions:
    path: ".github/agents/"
    files:
      - "cortex-documentation.md"
      - "cortex-builder.md"
      - "cortex-planner.md"
      - "cortex-review.md"
      - "cortex-gap-detection.md"
      - "cortex-review-*.md"
    mandatory: true
    reason: "Agent definitions for execution coordination"

  prompts:
    path: ".github/prompts/"
    files:
      - "cortex-doc.prompt.md"
      - "cortex-builder.prompt.md"  # If exists
    mandatory: true
    reason: "Prompt definitions for agent operation"

  manifests:
    path: "docs/_manifests/"
    files:
      - "content-registry.yaml"
      - "file-manifest.yaml"
      - "link-validation-report.yaml"
    mandatory: true
    reason: "Change detection and duplicate prevention"

# Governance Rules (Enforced by Agents)
governance_rules:
  rule_1_single_source:
    name: "Single Source of Truth"
    description: "One authoritative file per documentation topic"
    enforcement: "Before creating new doc, check registry for existing"
    violation_check: "Content hash registry scan"
    severity: "CRITICAL"

  rule_2_no_duplicates:
    name: "No Duplicate Content"
    description: "Identical or >80% similar content should be consolidated"
    enforcement: "Hash all files, flag duplicates"
    violation_check: "Duplicate detection scan"
    severity: "HIGH"

  rule_3_idempotent_operations:
    name: "All Operations Idempotent"
    description: "Can repeat any operation safely without data loss"
    enforcement: "Check manifest before each operation"
    violation_check: "Registry state verification"
    severity: "HIGH"

  rule_4_archive_preservation:
    name: "Archive Preservation (Write-Once)"
    description: "All files moved to archive, never deleted"
    enforcement: "Move with metadata, update registry"
    violation_check: "Verify file in _archive/ before deletion"
    severity: "CRITICAL"

  rule_5_manifest_tracking:
    name: "Manifest Tracking"
    description: "Every file migration updates content registry"
    enforcement: "Update registry after each operation"
    violation_check: "Registry audit trail verification"
    severity: "HIGH"

  rule_6_naming_consistency:
    name: "Production Naming Standard"
    description: "No dates, phases, or session refs in active tree"
    enforcement: "Validate filenames at creation/rename"
    violation_check: "Naming compliance scan"
    severity: "MEDIUM"

  rule_7_link_validity:
    name: "Link Validity"
    description: "All cross-references must be valid"
    enforcement: "Link validator after each migration"
    violation_check: "Link validation report"
    severity: "HIGH"

  rule_8_audience_tagging:
    name: "Audience Tagging"
    description: "Every documentation file must tag its audience"
    enforcement: "Verify frontmatter has audience field"
    violation_check: "Frontmatter audit"
    severity: "MEDIUM"

# Enforcement Procedures
enforcement:
  validation_frequency: "After each major operation"
  
  violation_detection:
    scan_trigger: "After every doc migration"
    automated_scan: true
    manual_review: false
    report_location: "_manifests/compliance-report.yaml"

  violation_severity_levels:
    CRITICAL:
      action: "Stop execution, report to operator, require manual fix"
      timeout: "Immediate"
      escalation: "Error output to terminal"
      examples: ["docs_md/ folder", "duplicate documentation", "deleted archived files"]

    HIGH:
      action: "Report violation, offer auto-fix or manual intervention"
      timeout: "Before finalizing migration"
      escalation: "Warning output, recommendation for fix"
      examples: ["session logs in active tree", "governance reports as .md", "broken links"]

    MEDIUM:
      action: "Flag for review, may auto-fix with confirmation"
      timeout: "Before next operation"
      escalation: "Info output, auto-fix if approved"
      examples: ["date-stamped files", "missing audience tags", "naming violations"]

  auto_fix_procedures:
    rename_files:
      trigger: "Date stamp detected in active tree"
      action: "Remove date, archive original if appropriate"
      approval_required: true

    consolidate_duplicates:
      trigger: ">80% content match between files"
      action: "Merge unique content, archive secondary"
      approval_required: true

    move_session_logs:
      trigger: "SESSION-*.md found outside _archive/"
      action: "Move to _archive/sessions/, update registry"
      approval_required: false

    fix_broken_links:
      trigger: "Link validator detects broken references"
      action: "Update link paths or flag for manual resolution"
      approval_required: true

# Audit Trail & Compliance
compliance_verification:
  required_checks:
    - "No files outside required locations"
    - "No duplicate content across files"
    - "All archived files in registry"
    - "All links valid"
    - "All files have audience tags"
    - "No date stamps in production tree"
    - "No PHASE-* or SESSION-* in production tree"
    - "Content registry synchronized with actual files"

  verification_script: "scripts/validate_documentation_compliance.py"
  
  compliance_report_format: "YAML"
  
  compliance_report_location: "_manifests/compliance-report.yaml"

# Special Cases & Exceptions
special_cases:
  root_readme:
    file: "README.md"
    exception: "Allowed at root (project overview)"
    reason: "Standard GitHub repository practice"
    governance: "Update when docs/ structure changes"

  license_file:
    file: "LICENSE.md"
    exception: "Allowed at root"
    reason: "Standard repository licensing"
    governance: "Immutable"

  agent_documentation:
    path: ".github/agents/"
    exception: "Allowed outside docs/"
    reason: "Agent system documentation, not user-facing"
    governance: "Updated only by agent system"

  prompt_files:
    path: ".github/prompts/"
    exception: "Allowed outside docs/"
    reason: "Agent prompts, not user-facing"
    governance: "Updated when strategy changes"

# Integration Points
integration_with_agents:
  cortex_documentation_agent:
    file: ".github/agents/cortex-documentation.md"
    responsibility: "Enforce this policy during doc operations"
    load_policy: "Before any file operation"
    update_registry: "After every operation"

  cortex_builder_agent:
    file: ".github/agents/cortex-builder.md"
    responsibility: "Provide live capabilities to documentation"
    coordination: "Signal when AC-IDs complete"
    update_master: "Update cortex-master.yaml"

  all_agents:
    responsibility: "Never violate file placement policy"
    check_before_creating: "Query content registry"
    check_before_deleting: "Verify not in use elsewhere"

