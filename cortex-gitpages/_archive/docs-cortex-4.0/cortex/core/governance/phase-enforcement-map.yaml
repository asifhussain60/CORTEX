# ==============================================================================
# PHASE GOVERNANCE ENFORCEMENT MAP
# ==============================================================================
# Purpose: Maps which governance rules apply to each phase and AC-ID
# Auto-enforced during implementation to prevent violations
# Audit-logged for compliance tracking
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
category: PHASE_ENFORCEMENT

metadata:
  rule_count: 28  # From core-rules.yaml
  phases: 7  # PHASE-01 through PHASE-06-ECOSYSTEM, plus PHASE-ENHANCEMENT-01
  enforcement_engine: "governance-enforcer.py"
  audit_logging: true

# ==============================================================================
# GLOBAL RULES (Apply to ALL phases)
# ==============================================================================

global_rules:
  mandatory:
    - rule_id: CORE-017
      name: "Strict Governance"
      enforcement: "blocked"
      description: "ALL rules enforced strictly. No overrides."
    
    - rule_id: CORE-026
      name: "Git Checkpoint Before Modify"
      enforcement: "blocked"
      description: "Checkpoint MUST be created before every major action"
      checkpoints_required:
        - "checkpoint: before AC-XXX-XXX"
        - "AC-XXX-XXX: [description] - tests passing"
        - "phase-XX: COMPLETED - audit verified"
    
    - rule_id: CORE-027
      name: "Audit Trail for Phase Completion"
      enforcement: "blocked"
      description: "Phase completion MUST be validated by audit trail"
      required_per_ac_id:
        - "AC_START"
        - "AC_EXECUTE"
        - "AC_COMPLETE"
      minimum_entries: 3
  
  warning:
    - rule_id: CORE-015
      name: "PEP 8 Imports"
      enforcement: "warning"

