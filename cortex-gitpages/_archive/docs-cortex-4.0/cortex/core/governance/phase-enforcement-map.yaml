# ==============================================================================
# ENFORCEMENT ACTIONS
# ==============================================================================

enforcement_actions:
  pre_ac_id_start:
    - Load applicable rules for AC-ID from this map
    - Load from core-rules.yaml for rule details
    - Create git checkpoint: "checkpoint: before AC-XXX-XXX"
    - Audit log: AC_START with all applicable rules
  
  during_implementation:
    - Validate each rule as code is written
    - Log violations (or compliance) to audit trail
    - For "blocked" rules: REFUSE implementation if violated
    - For "warning" rules: WARN but allow with override flag
  
  post_ac_id_completion:
    - Verify all "blocked" rules passed
    - Create git commit: "AC-XXX-XXX: [desc] - tests passing"
    - Audit log: AC_COMPLETE with pass/fail for each rule
    - Update roadmap status
  
  pre_phase_lock:
    - Query audit logs: ALL AC-IDs must have START, EXECUTE, COMPLETE
    - Verify hash chain integrity
    - Cleanup protocol (CORE-028 file naming)
    - Set audit_verification.verified: true
    - Create git commit: "phase-XX: COMPLETED - audit verified"
    - Audit log: PHASE_COMPLETE

# ==============================================================================
# AUDIT LOGGING REQUIREMENTS
# ==============================================================================

audit_logging:
  enabled: true
  location: "cortex_brain/state/governance.db"
  required_fields:
    - timestamp
    - phase_id
    - ac_id
    - rule_id
    - rule_name
    - enforcement_level
    - violation_status  # "PASS" | "FAIL" | "WARNING"
    - details
    - git_commit_hash
    - implementer
  
  queries:
    compliance_report: |
      SELECT phase_id, COUNT(*) as total_rules, 
             SUM(CASE WHEN violation_status='PASS' THEN 1 ELSE 0 END) as passed,
             SUM(CASE WHEN violation_status='FAIL' THEN 1 ELSE 0 END) as failed
      FROM audit_log
      WHERE rule_id IN (SELECT rule_id FROM phase_enforcement_map WHERE enforcement='blocked')
      GROUP BY phase_id
    
    violations_by_phase: |
      SELECT phase_id, rule_id, rule_name, COUNT(*) as violation_count
      FROM audit_log
      WHERE violation_status='FAIL'
      GROUP BY phase_id, rule_id
      ORDER BY violation_count DESC
    
    per_ac_compliance: |
      SELECT ac_id, COUNT(DISTINCT rule_id) as rules_checked,
             SUM(CASE WHEN violation_status='PASS' THEN 1 ELSE 0 END) as rules_passed
      FROM audit_log
      WHERE ac_id=?
      GROUP BY ac_id
