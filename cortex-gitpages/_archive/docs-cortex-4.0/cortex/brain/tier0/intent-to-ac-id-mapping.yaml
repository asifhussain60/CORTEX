# ==============================================================================
# INTENT-TO-AC-ID MAPPING
# ==============================================================================
# Purpose: Maps canonicalized user intents to AC-ID patterns for unified
#          classification. Closes gap between LENS protocol intent routing
#          and AC-ID driven development.
#
# Status: ACTIVE (Tier 0 = Immutable)
# Author: Asif Hussain
# Copyright: © 2025-2026 Asif Hussain. All rights reserved.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
category: INTENT_ROUTING
precedence: HIGH

metadata:
  purpose: "Unified mapping: Intent Type → AC-ID Category → Orchestrator"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."

# ==============================================================================
# INTENT TYPE TO AC-ID CATEGORY MAPPING
# ==============================================================================
# Maps the 6 intent types (from LENS.step_1_language) to AC-ID categories
# ==============================================================================

intent_to_ac_mapping:
  # =========================================================================
  # IMPLEMENT Intent → Architecture/Functional/Feature AC-IDs
  # =========================================================================
  IMPLEMENT:
    description: "User wants to build new functionality"
    markers: ["add", "create", "build", "implement", "new feature", "enable"]
    default_orchestrator: "TDDOrchestrator"
    
    ac_categories:
      - ac_prefix: "AR"
        name: "Architecture"
        description: "New architectural components or patterns"
        example_ac: "AR-005: Implement result pattern for error handling"
        subcategory: "major_feature"
        scope_estimate: "large (10+ files)"
        effort_estimate: "3-5 days"
      
      - ac_prefix: "FR"
        name: "Functional"
        description: "New user-facing features"
        example_ac: "FR-010: Implement email verification in registration"
        subcategory: "feature"
        scope_estimate: "medium (3-8 files)"
        effort_estimate: "1-2 days"
      
      - ac_prefix: "NFR"
        name: "Non-Functional"
        description: "Performance, security, scalability improvements"
        example_ac: "NFR-003: Implement rate limiting on auth endpoints"
        subcategory: "infrastructure"
        scope_estimate: "medium (2-5 files)"
        effort_estimate: "1 day"
      
      - ac_prefix: "HP"
        name: "Hardening"
        description: "Production safety and hardening features"
        example_ac: "HP-002: Implement circuit breaker pattern"
        subcategory: "infrastructure"
        scope_estimate: "small (2-3 files)"
        effort_estimate: "0.5-1 day"
      
      - ac_prefix: "OB"
        name: "Observability"
        description: "Logging, metrics, tracing infrastructure"
        example_ac: "OB-001: Implement OpenTelemetry integration"
        subcategory: "infrastructure"
        scope_estimate: "large (5+ files)"
        effort_estimate: "2-3 days"
    
    workflow:
      phase: "Planning + TDD Execution"
      steps:
        - "1. Parse intent via LENS.step_1_language"
        - "2. Classify to AC category (AR/FR/NFR/HP/OB)"
        - "3. Route to TDD Orchestrator"
        - "4. Execute: RED → GREEN → REFACTOR (CORE-008)"
        - "5. Update AC tracking + audit logs"

  # =========================================================================
  # FIX Intent → Bug/Defect AC-IDs
  # =========================================================================
  FIX:
    description: "User wants to fix a bug or issue"
    markers: ["fix", "bug", "broken", "error", "crash", "wrong", "issue"]
    default_orchestrator: "TDDOrchestrator"
    
    ac_categories:
      - ac_prefix: "BF"
        name: "Bug Fix"
        description: "Fixes for existing defects"
        example_ac: "BF-012: Fix token validation race condition"
        subcategory: "bug"
        scope_estimate: "small-medium (1-3 files)"
        effort_estimate: "2-4 hours"
      
      - ac_prefix: "BF"
        name: "Security Fix"
        description: "Security vulnerability fixes (same prefix as bugs)"
        example_ac: "BF-018: Fix SQL injection vulnerability in search"
        subcategory: "security_bug"
        scope_estimate: "small (1-2 files)"
        effort_estimate: "2-6 hours"
    
    severity_classification:
      - severity: "CRITICAL"
        markers: ["crash", "security", "data loss", "down", "broken"]
        routing: "Immediate (fast path)"
        approval: "auto_approved"
      
      - severity: "HIGH"
        markers: ["error", "bug", "broken", "wrong"]
        routing: "Normal TDD path"
        approval: "user_approval"
      
      - severity: "MEDIUM"
        markers: ["issue", "not working as expected"]
        routing: "Normal TDD path"
        approval: "user_approval"
    
    workflow:
      phase: "Root Cause Analysis + TDD Fix"
      steps:
        - "1. Parse intent + severity via LENS"
        - "2. If CRITICAL → fast path (no approval needed)"
        - "3. If HIGH/MEDIUM → normal TDD path"
        - "4. Execute: RED (failing test) → GREEN (fix) → REFACTOR"
        - "5. Verify fix + regression testing"

  # =========================================================================
  # REFACTOR Intent → Quality/Improvement AC-IDs
  # =========================================================================
  REFACTOR:
    description: "User wants to improve existing code"
    markers: ["refactor", "improve", "clean up", "optimize", "simplify", "consolidate"]
    default_orchestrator: "TDDOrchestrator"
    
    ac_categories:
      - ac_prefix: "RF"
        name: "Refactor"
        description: "Code quality and organization improvements"
        example_ac: "RF-005: Refactor auth module to use dependency injection"
        subcategory: "code_quality"
        scope_estimate: "medium (2-8 files)"
        effort_estimate: "1-2 days"
      
      - ac_prefix: "DC"
        name: "Consolidation"
        description: "Eliminate duplication, consolidate similar code"
        example_ac: "DC-003: Consolidate logging utilities into single module"
        subcategory: "deduplication"
        scope_estimate: "medium (3-10 files)"
        effort_estimate: "1 day"
      
      - ac_prefix: "DOC"
        name: "Documentation"
        description: "Update documentation and comments"
        example_ac: "DOC-005: Update CORTEX.prompt.md with response header section"
        subcategory: "documentation"
        scope_estimate: "small (1-2 files)"
        effort_estimate: "2-4 hours"
    
    workflow:
      phase: "TDD Refactor (Existing tests pass)"
      steps:
        - "1. Parse intent (refactor type) via LENS"
        - "2. Classify to AC category (RF/DC/DOC)"
        - "3. Route to TDD Orchestrator"
        - "4. Execute: GREEN (tests pass) → Refactor → GREEN (still pass)"
        - "5. Verify no regression"

  # =========================================================================
  # QUERY Intent → Analysis/Research AC-IDs
  # =========================================================================
  QUERY:
    description: "User wants information or analysis"
    markers: ["show", "what", "how", "where", "which", "analyze", "list", "find", "search"]
    default_orchestrator: "InteractionOrchestrator"
    
    ac_categories:
      - ac_prefix: "ANA"
        name: "Analysis"
        description: "Code analysis, pattern detection, insights"
        example_ac: "ANA-002: Analyze test coverage gaps in auth module"
        subcategory: "analysis"
        no_implementation: true
        returns: "Analysis report"
      
      - ac_prefix: "RESEARCH"
        name: "Research"
        description: "Technology research, best practices, feasibility studies"
        example_ac: "RESEARCH-001: Research OAuth2 vs OIDC for authentication"
        subcategory: "research"
        no_implementation: true
        returns: "Research report with recommendations"
    
    workflow:
      phase: "Analysis only (no implementation)"
      steps:
        - "1. Parse intent via LENS"
        - "2. Classify to analysis type (ANA/RESEARCH)"
        - "3. Route to Interaction Orchestrator"
        - "4. Execute analysis"
        - "5. Return report (no code changes)"

  # =========================================================================
  # VALIDATE Intent → Quality Assurance AC-IDs
  # =========================================================================
  VALIDATE:
    description: "User wants to verify or check something"
    markers: ["validate", "check", "verify", "test", "ensure", "confirm", "audit"]
    default_orchestrator: "ValidationOrchestrator"
    
    ac_categories:
      - ac_prefix: "VAL"
        name: "Validation"
        description: "Compliance, governance, quality checks"
        example_ac: "VAL-001: Validate all functions have type hints"
        subcategory: "compliance"
      
      - ac_prefix: "AUDIT"
        name: "Audit"
        description: "Audit trail verification, integrity checks"
        example_ac: "AUDIT-001: Verify phase completion audit entries"
        subcategory: "auditing"
    
    workflow:
      phase: "Validation/Audit Execution"
      steps:
        - "1. Parse intent via LENS"
        - "2. Classify validation type (VAL/AUDIT)"
        - "3. Route to Validation Orchestrator"
        - "4. Execute checks"
        - "5. Return validation report"

  # =========================================================================
  # MIGRATE Intent → Refactor/Restructuring AC-IDs
  # =========================================================================
  MIGRATE:
    description: "User wants to move or change structure"
    markers: ["migrate", "move", "refactor", "reorganize", "consolidate", "restructure"]
    default_orchestrator: "ArchitectureOrchestrator"
    
    ac_categories:
      - ac_prefix: "MIG"
        name: "Migration"
        description: "Code reorganization, module restructuring"
        example_ac: "MIG-001: Migrate from utils.py to structured modules"
        subcategory: "restructuring"
        scope_estimate: "large (10+ files)"
        effort_estimate: "2-5 days"
    
    workflow:
      phase: "Architecture Planning + Gradual Migration"
      steps:
        - "1. Parse intent via LENS"
        - "2. Create migration plan"
        - "3. Route to Architecture Orchestrator"
        - "4. Execute in phases (preserve functionality)"
        - "5. Verify all tests still pass"

# ==============================================================================
# ORCHESTRATOR ROUTING TABLE
# ==============================================================================
# Primary routing: Intent Type → Orchestrator (with override capability)
# ==============================================================================

orchestrator_routing:
  TDDOrchestrator:
    description: "Handles IMPLEMENT, FIX, REFACTOR (code changes + tests)"
    intent_types: ["IMPLEMENT", "FIX", "REFACTOR"]
    ac_prefixes: ["AR", "FR", "NFR", "HP", "OB", "BF", "RF", "DC", "DOC"]
    responsible_for:
      - "RED → GREEN → REFACTOR workflow"
      - "Test coverage validation"
      - "Code quality enforcement"
      - "Governance compliance checks"
  
  InteractionOrchestrator:
    description: "Handles QUERY, analysis, information requests"
    intent_types: ["QUERY"]
    ac_prefixes: ["ANA", "RESEARCH"]
    responsible_for:
      - "Code analysis"
      - "Pattern detection"
      - "Research compilation"
      - "Report generation"
  
  ValidationOrchestrator:
    description: "Handles VALIDATE, compliance checks, audits"
    intent_types: ["VALIDATE"]
    ac_prefixes: ["VAL", "AUDIT"]
    responsible_for:
      - "Compliance validation"
      - "Governance audits"
      - "Quality gate verification"
  
  ArchitectureOrchestrator:
    description: "Handles MIGRATE, system restructuring, major refactors"
    intent_types: ["MIGRATE"]
    ac_prefixes: ["MIG"]
    responsible_for:
      - "Architecture planning"
      - "Large-scale migrations"
      - "System restructuring"
  
  PlanningOrchestrator:
    description: "Cross-cutting: planning, roadmap, phase management"
    intent_types: []  # No direct mapping (used for meta-planning)
    ac_prefixes: []
    responsible_for:
      - "Phase planning"
      - "Implementation roadmaps"
      - "Dependency tracking"

# ==============================================================================
# DECISION TREE FOR INTENT CLASSIFICATION
# ==============================================================================
# Algorithm to classify ambiguous intents to AC-ID categories
# ==============================================================================

classification_algorithm:
  step_1_type_classification:
    input: "Canonicalized intent type from LENS.step_1"
    process: "Use markers to classify into 6 types above"
    output: "intent_type: IMPLEMENT | FIX | REFACTOR | QUERY | VALIDATE | MIGRATE"
  
  step_2_category_classification:
    input: "intent_type + user description + context"
    process: "Use ac_categories mapping to narrow down"
    rules:
      - "If mentions 'architecture' → AR"
      - "If mentions 'performance' → NFR"
      - "If mentions 'security' → NFR (or HP if production-critical)"
      - "If mentions 'observability/logging' → OB"
      - "If mentions 'test' → DOC (documentation) or AUDIT (validation)"
      - "If mentions 'bug' → BF"
      - "If unknown → Ask user for clarification"
    output: "ac_prefix: AR | FR | NFR | HP | OB | BF | RF | DC | DOC | ANA | VAL | AUDIT | MIG"
  
  step_3_orchestrator_routing:
    input: "intent_type + ac_prefix"
    process: "Map via intent_to_ac_mapping"
    output: "target_orchestrator: string"

# ==============================================================================
# EXAMPLES: INTENT CLASSIFICATION IN ACTION
# ==============================================================================

examples:
  example_1:
    user_request: "Add rate limiting to the login endpoint"
    lens_step_1_result:
      type: "IMPLEMENT"
      confidence: 0.96
    classification:
      ac_prefix: "HP"
      reasoning: "Production hardening (rate limiting = safety feature)"
      orchestrator: "TDDOrchestrator"
  
  example_2:
    user_request: "Fix the token validation bug that crashes on logout"
    lens_step_1_result:
      type: "FIX"
      severity: "CRITICAL"
      confidence: 0.98
    classification:
      ac_prefix: "BF"
      reasoning: "Bug fix with CRITICAL severity"
      orchestrator: "TDDOrchestrator"
      fast_path: true  # Auto-approved
  
  example_3:
    user_request: "Refactor the auth module to use dependency injection"
    lens_step_1_result:
      type: "REFACTOR"
      confidence: 0.92
    classification:
      ac_prefix: "RF"
      reasoning: "Code quality refactor"
      orchestrator: "TDDOrchestrator"
  
  example_4:
    user_request: "What's the test coverage for error handling?"
    lens_step_1_result:
      type: "QUERY"
      confidence: 0.99
    classification:
      ac_prefix: "ANA"
      reasoning: "Code analysis query"
      orchestrator: "InteractionOrchestrator"
  
  example_5:
    user_request: "Consolidate all logging utilities into a single module"
    lens_step_1_result:
      type: "REFACTOR"
      scope: "component"
      confidence: 0.88
    classification:
      ac_prefix: "DC"
      reasoning: "Deduplication + consolidation"
      orchestrator: "TDDOrchestrator"
  
  example_6:
    user_request: "Migrate from flat utils.py to structured modules"
    lens_step_1_result:
      type: "MIGRATE"
      scope: "system"
      confidence: 0.85
    classification:
      ac_prefix: "MIG"
      reasoning: "Large-scale restructuring"
      orchestrator: "ArchitectureOrchestrator"

# ==============================================================================
# ENFORCEMENT CONFIGURATION
# ==============================================================================

enforcement:
  mode: "strict"
  override_allowed: false
  validation_level: "comprehensive"
  audit_logging: true
  
  implementation:
    class: "IntentToACMapper"
    module: "src.core.intent_router"
    method: "classify_intent(canonicalized_intent: CanonicalIntent) -> ACIDClassification"
