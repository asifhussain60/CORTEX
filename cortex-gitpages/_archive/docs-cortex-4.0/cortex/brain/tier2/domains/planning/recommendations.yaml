    **Phase:** PHASE-DOC-REMEDIATION
    **AC-IDs:** 8
    **Estimated Hours:** 6
    
    ### Acceptance Criteria
    
    | AC-ID | Description | Priority | Est. Minutes |
    |-------|-------------|----------|--------------|
    | DOC-001-01 | CORTEX.prompt.md Response Header section | P0 | 60 |
    | DOC-001-02 | response-headers.yaml reference | P0 | 15 |
    | DOC-002-01 | copilot-instruction.md Response Format | P0 | 45 |
