# =============================================================================
# CORTEX TIER 2 - PLANNING RECOMMENDATIONS TEMPLATE
# =============================================================================
# Purpose: Template for implementation planning recommendations
# Domain: Planning
# Inherits: Header from cortex_brain/tier0/response-headers.yaml
# =============================================================================

metadata:
  template_id: "planning-recommendations"
  version: "1.0"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  description: "Template for implementation planning recommendations"
  tier: 2
  category: "domain"
  domain: "planning"

# =============================================================================
# TEMPLATE STRUCTURE
# =============================================================================

template:
  structure:
    - section: "header"
      source: "tier0/response-headers.yaml"
      required: true
    
    - section: "overview"
      required: true
      format: |
        ### Implementation Plan: {plan_title}
        
        **Phase:** {phase}
        **AC-IDs:** {ac_count}
        **Estimated Hours:** {estimated_hours}
    
    - section: "ac_breakdown"
      required: true
      format: |
        ### Acceptance Criteria
        
        {ac_table}
    
    - section: "dependencies"
      required: false
      format: |
        ### Dependencies
        
        {dependencies}
    
    - section: "risks"
      required: false
      format: |
        ### Risks & Mitigations
        
        {risks}
    
    - section: "recommendation"
      required: true
      format: |
        ### Recommendation
        
        {recommendation}

# =============================================================================
# VARIABLE DEFINITIONS
# =============================================================================

variables:
  mandatory:
    - name: "plan_title"
      type: "string"
      description: "Title of the implementation plan"
    
    - name: "phase"
      type: "string"
      description: "Phase being planned"
    
    - name: "ac_count"
      type: "integer"
      description: "Number of ACs in plan"
    
    - name: "estimated_hours"
      type: "float"
      description: "Total estimated hours"
    
    - name: "ac_table"
      type: "string"
      description: "Markdown table of ACs"
    
    - name: "recommendation"
      type: "string"
      description: "Final recommendation"
  
  optional:
    - name: "dependencies"
      type: "list"
      description: "Phase/AC dependencies"
    
    - name: "risks"
      type: "list"
      description: "Identified risks"

# =============================================================================
# EXAMPLE OUTPUT
# =============================================================================

example:
  output: |
    ## 🧠 CORTEX Implementation Plan
    **Author:** Asif Hussain | **Phase:** PHASE-DOC-REMEDIATION | **Orchestrator:** PlanningOrchestrator ✅
    
    ---
    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
    
