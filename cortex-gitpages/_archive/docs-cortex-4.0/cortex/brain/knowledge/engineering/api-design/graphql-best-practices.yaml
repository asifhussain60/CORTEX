# GraphQL Best Practices
# CORTEX Knowledge Base - Engineering Domain
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain
# Category: API Design Excellence
# Purpose: Comprehensive GraphQL design guidelines and best practices

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  updated: "2025-12-22"
  author: "Asif Hussain"
  category: "api-design"
  subcategory: "graphql"
  scope: "GraphQL schema design, query optimization, best practices"
  target_audience: ["backend-engineers", "api-developers", "architects"]
  maturity_level: "production-ready"
  learning_objectives:
    - "Design efficient GraphQL schemas"
    - "Optimize query performance with DataLoader"
    - "Implement proper error handling"
    - "Secure GraphQL APIs against attacks"
    - "Version schemas without breaking clients"
  prerequisites:
    - "GraphQL fundamentals"
    - "API design principles"
    - "Database query optimization"

# GraphQL Core Principles
core_principles:
  - name: "Strongly Typed Schema"
    description: "Schema defines complete API contract"
    benefits:
      - "Type safety at development time"
      - "Auto-generated documentation"
      - "Client code generation"
      - "Query validation before execution"

  - name: "Client-Specified Queries"
    description: "Clients request exactly what they need"
    benefits:
      - "No over-fetching or under-fetching"
      - "Single request for complex data"
      - "Reduced network overhead"

  - name: "Introspection"
    description: "Schema is queryable by clients"
    benefits:
      - "Auto-generated documentation"
      - "GraphQL playground/IDE support"
      - "Runtime schema validation"

  - name: "Single Endpoint"
    description: "All queries go to one endpoint (e.g., /graphql)"
    benefits:
      - "Simplified routing"
      - "Easier caching strategies"
      - "Unified authentication"

# Schema Design Best Practices
schema_design:
  naming_conventions:
    - rule: "Use PascalCase for types"
      good: "type UserProfile { ... }"
      bad: "type user_profile { ... }"

    - rule: "Use camelCase for fields"
      good: "firstName: String"
      bad: "first_name: String"

    - rule: "Use descriptive names"
      good: "type OrderLineItem"
      bad: "type Item"

    - rule: "Prefix boolean fields with 'is' or 'has'"
      good: "isActive: Boolean, hasPermission: Boolean"
      bad: "active: Boolean, permission: Boolean"

    - rule: "Use verbs for mutations"
      good: "createUser, updateProfile, deleteOrder"
      bad: "user, profile, order"

  type_design:
    object_types:
      description: "Primary building blocks of schema"
      best_practices:
        - "Keep types focused and cohesive"
        - "Use interfaces for shared fields"
        - "Avoid deeply nested types (>3-4 levels)"
        - "Make fields nullable by default unless guaranteed"
      example: |
        type User {
          id: ID!
          email: String!
          profile: UserProfile
          orders(first: Int, after: String): OrderConnection!
        }

    interfaces:
      description: "Abstract types implemented by multiple types"
      use_cases:
        - "Polymorphic responses (e.g., SearchResult)"
        - "Shared fields across types (e.g., Node interface)"
      example: |
        interface Node {
          id: ID!
        }
        
        type User implements Node {
          id: ID!
          name: String!
        }
        
        type Product implements Node {
          id: ID!
          title: String!
        }

    unions:
      description: "Return one of multiple types"
      use_cases:
        - "Search results with different types"
        - "Mutation results with success/error types"
      example: |
        union SearchResult = User | Product | Article
        
        type Query {
          search(query: String!): [SearchResult!]!
        }

    enums:
      description: "Fixed set of values"
      best_practices:
        - "Use for status fields, categories, roles"
        - "Use UPPER_SNAKE_CASE for enum values"
        - "Never remove enum values (deprecate instead)"
      example: |
        enum OrderStatus {
          PENDING
          PROCESSING
          SHIPPED
          DELIVERED
          CANCELLED
        }

    input_types:
      description: "Complex arguments for mutations"
      best_practices:
        - "Use for mutations with multiple fields"
        - "Separate input types from output types"
        - "Use nullable fields for partial updates"
      example: |
        input CreateUserInput {
          email: String!
          firstName: String!
          lastName: String!
          phoneNumber: String
        }
        
        input UpdateUserInput {
          firstName: String
          lastName: String
          phoneNumber: String
        }

  field_design:
    nullability:
      - "Use ! (non-null) sparingly"
      - "Non-null fields must ALWAYS be resolvable"
      - "Prefer nullable fields to avoid breaking changes"
      - "Use non-null for IDs and required business fields"

    lists:
      patterns:
        - pattern: "[Type!]!"
          description: "Non-null list of non-null items (never null, never null items)"
          use_case: "Required collection (e.g., user permissions)"

        - pattern: "[Type!]"
          description: "Nullable list of non-null items"
          use_case: "Optional collection"

        - pattern: "[Type]!"
          description: "Non-null list with nullable items"
          use_case: "Rare - usually avoid"

    arguments:
      best_practices:
        - "Use input types for complex arguments"
        - "Provide sensible defaults"
        - "Document required vs optional arguments"
        - "Use enums for fixed sets of options"
      example: |
        type Query {
          users(
            first: Int = 10
            after: String
            role: UserRole
            status: UserStatus = ACTIVE
          ): UserConnection!
        }

# Query Patterns
query_patterns:
  pagination:
    cursor_based:
      description: "Relay-style cursor pagination (recommended)"
      schema: |
        type Query {
          users(first: Int, after: String, last: Int, before: String): UserConnection!
        }
        
        type UserConnection {
          edges: [UserEdge!]!
          pageInfo: PageInfo!
          totalCount: Int
        }
        
        type UserEdge {
          node: User!
          cursor: String!
        }
        
        type PageInfo {
          hasNextPage: Boolean!
          hasPreviousPage: Boolean!
          startCursor: String
          endCursor: String
        }
      benefits:
        - "Handles inserts/deletes consistently"
        - "Works with infinite scroll"
        - "Standardized across industry"

    offset_based:
      description: "Simple page-based pagination"
      schema: |
        type Query {
          users(page: Int = 1, perPage: Int = 10): UserPage!
        }
        
        type UserPage {
          items: [User!]!
          page: Int!
          perPage: Int!
          total: Int!
          hasMore: Boolean!
        }
      use_case: "Simple UIs with page numbers"

  filtering:
    simple_filters:
      example: |
        type Query {
          users(role: UserRole, status: UserStatus): [User!]!
        }

    complex_filters:
      example: |
        input UserFilter {
          role: UserRole
          status: UserStatus
          createdAfter: DateTime
          searchTerm: String
        }
        
        type Query {
          users(filter: UserFilter): [User!]!
        }

  sorting:
    simple_sort:
      example: |
        enum UserSortField {
          CREATED_AT
          NAME
          EMAIL
        }
        
        enum SortOrder {
          ASC
          DESC
        }
        
        type Query {
          users(sortBy: UserSortField, order: SortOrder): [User!]!
        }

    multi_field_sort:
      example: |
        input SortInput {
          field: String!
          order: SortOrder!
        }
        
        type Query {
          users(sort: [SortInput!]): [User!]!
        }

# Mutation Patterns
mutation_patterns:
  naming:
    - "Use verb + noun format: createUser, updateOrder, deleteProduct"
    - "Group related mutations: user* for user operations"

  input_structure:
    single_argument:
      description: "Use single input type argument"
      good: |
        mutation {
          createUser(input: CreateUserInput!) {
            user { id, name }
            errors { field, message }
          }
        }
      bad: |
        mutation {
          createUser(email: String!, name: String!, age: Int) {
            id
            name
          }
        }

  response_structure:
    payload_type:
      description: "Return dedicated payload type, not directly the object"
      pattern: |
        type CreateUserPayload {
          user: User
          errors: [UserError!]
          clientMutationId: String
        }
        
        type UserError {
          field: String!
          message: String!
          code: ErrorCode!
        }
      benefits:
        - "Include errors without throwing exceptions"
        - "Add metadata without breaking changes"
        - "Support client mutation ID for optimistic updates"

  idempotency:
    - "Design mutations to be idempotent where possible"
    - "Use clientMutationId for duplicate detection"
    - "Return appropriate response for duplicate requests"

# Performance Optimization
performance:
  n_plus_1_problem:
    description: "Most common GraphQL performance issue"
    problem: |
      # This query causes N+1 queries
      {
        users {
          id
          orders { # Separate query per user
            id
            total
          }
        }
      }
    solution: "Use DataLoader for batching and caching"
    dataloader_example: |
      const orderLoader = new DataLoader(async (userIds) => {
        const orders = await db.orders.findAll({
          where: { userId: { in: userIds } }
        });
        return userIds.map(id => 
          orders.filter(order => order.userId === id)
        );
      });

  dataloader:
    description: "Batching and caching utility"
    features:
      - "Batches multiple requests into single query"
      - "Caches results per request"
      - "Reduces database round trips"
    best_practices:
      - "Create loaders per-request (avoid cache issues)"
      - "Use for any 1-to-N relationships"
      - "Batch by primary key when possible"

  query_complexity:
    description: "Prevent expensive queries"
    strategies:
      - name: "Query depth limiting"
        implementation: "Max 5-7 levels of nesting"
        tool: "graphql-depth-limit"

      - name: "Query complexity analysis"
        implementation: "Assign cost to fields, limit total cost"
        tool: "graphql-query-complexity"

      - name: "Rate limiting"
        implementation: "Limit queries per time window"

  caching:
    http_caching:
      - "Use GET requests for queries (enables HTTP caching)"
      - "Set Cache-Control headers for cacheable queries"
      - "Use persisted queries for cache keys"

    application_caching:
      - "Cache DataLoader results per request"
      - "Use Redis for cross-request caching"
      - "Implement cache invalidation strategies"

  field_level_caching:
    description: "Cache individual field results"
    example: |
      type User @cacheControl(maxAge: 3600) {
        id: ID!
        email: String! @cacheControl(maxAge: 300)
        profile: Profile @cacheControl(maxAge: 600)
      }

# Security Best Practices
security:
  authentication:
    - "Validate auth token on every request"
    - "Include user context in resolver context"
    - "Return appropriate errors for unauthenticated requests"
    example: |
      const context = ({ req }) => {
        const token = req.headers.authorization;
        const user = validateToken(token);
        return { user };
      };

  authorization:
    field_level:
      description: "Check permissions per field"
      example: |
        type User {
          id: ID!
          email: String! @requiresPermission(permission: "READ_EMAIL")
          ssn: String! @requiresRole(role: "ADMIN")
        }

    directive_based:
      example: |
        directive @auth(requires: Role!) on FIELD_DEFINITION
        
        type Query {
          users: [User!]! @auth(requires: ADMIN)
          me: User! @auth(requires: USER)
        }

  input_validation:
    - "Validate all inputs in resolvers"
    - "Use schema-level validation (custom scalars)"
    - "Sanitize string inputs"
    - "Validate file uploads (size, type)"

  rate_limiting:
    - "Implement per-user rate limits"
    - "Consider query complexity in rate limits"
    - "Return errors with retry information"

  introspection:
    - "Disable in production for public APIs"
    - "Enable for authenticated internal APIs"
    - "Use for development/testing only"

  depth_limiting:
    description: "Prevent deeply nested malicious queries"
    implementation: |
      import depthLimit from 'graphql-depth-limit';
      
      const server = new ApolloServer({
        schema,
        validationRules: [depthLimit(5)]
      });

  query_cost_analysis:
    description: "Prevent expensive queries"
    implementation: |
      import { createComplexityLimitRule } from 'graphql-validation-complexity';
      
      const rule = createComplexityLimitRule(1000);

# Error Handling
error_handling:
  error_types:
    - name: "User Errors"
      description: "Expected errors (validation, not found)"
      handling: "Return in response, don't throw"
      example: |
        type CreateUserPayload {
          user: User
          errors: [UserError!]
        }

    - name: "System Errors"
      description: "Unexpected errors (database down)"
      handling: "Throw exception, log details, return generic message"

  error_response_format:
    graphql_errors:
      description: "Standard GraphQL error format"
      structure: |
        {
          "errors": [
            {
              "message": "User not found",
              "path": ["user", "orders"],
              "locations": [{ "line": 2, "column": 3 }],
              "extensions": {
                "code": "USER_NOT_FOUND",
                "userId": "123"
              }
            }
          ],
          "data": null
        }

    custom_error_codes:
      - "UNAUTHENTICATED: No valid auth token"
      - "FORBIDDEN: Insufficient permissions"
      - "BAD_USER_INPUT: Validation failed"
      - "NOT_FOUND: Resource doesn't exist"
      - "INTERNAL_SERVER_ERROR: Unexpected error"

  error_masking:
    - "Never expose internal errors to clients"
    - "Log full error details server-side"
    - "Return generic message for system errors"

# Schema Evolution
schema_evolution:
  deprecation:
    description: "Mark fields as deprecated before removal"
    example: |
      type User {
        name: String @deprecated(reason: "Use firstName and lastName")
        firstName: String
        lastName: String
      }
    best_practices:
      - "Add deprecation reason"
      - "Provide migration path"
      - "Monitor deprecated field usage"
      - "Remove after deprecation period (6-12 months)"

  additive_changes:
    safe_changes:
      - "Add new types"
      - "Add new fields"
      - "Add new arguments with defaults"
      - "Add new enum values"
    rationale: "Clients ignore unknown fields"

  breaking_changes:
    dangerous_changes:
      - "Remove or rename types/fields"
      - "Change field types"
      - "Remove enum values"
      - "Make nullable field non-null"
      - "Remove field arguments"
    mitigation:
      - "Use deprecation workflow"
      - "Version schema if necessary"
      - "Communicate with clients"

  versioning:
    approach: "Avoid schema versioning if possible"
    alternatives:
      - "Use field deprecation"
      - "Add new fields alongside old"
      - "Use unions for evolving types"
    when_to_version: "Only for major breaking changes affecting all clients"

# Testing GraphQL APIs
testing:
  unit_tests:
    - "Test resolvers in isolation"
    - "Mock data sources"
    - "Test error handling"
    example: |
      test('user resolver returns user', async () => {
        const mockDataSource = { getUser: jest.fn(() => mockUser) };
        const result = await resolvers.Query.user(
          null, 
          { id: '123' }, 
          { dataSources: mockDataSource }
        );
        expect(result).toEqual(mockUser);
      });

  integration_tests:
    - "Test complete query execution"
    - "Test with real database (test instance)"
    - "Validate response shape"
    example: |
      test('user query returns correct data', async () => {
        const result = await client.query({
          query: GET_USER_QUERY,
          variables: { id: '123' }
        });
        expect(result.data.user.email).toBe('test@example.com');
      });

  schema_tests:
    - "Validate schema compiles"
    - "Check for breaking changes"
    - "Test deprecated fields"
    tool: "graphql-inspector"

  performance_tests:
    - "Test query performance under load"
    - "Measure DataLoader effectiveness"
    - "Monitor N+1 query issues"

# GraphQL Anti-Patterns
anti_patterns:
  - name: "RPC-style mutations"
    bad: "mutation { doEverything(data: JSON) }"
    good: "mutation { createUser(input: CreateUserInput!) }"
    reason: "Lose type safety and clarity"

  - name: "Ignoring N+1 problem"
    bad: "Querying database per item in list"
    good: "Use DataLoader for batching"
    reason: "Severe performance impact"

  - name: "Overly deep nesting"
    bad: "5+ levels of nested fields"
    good: "Flatten or limit depth to 3-4 levels"
    reason: "Performance and complexity"

  - name: "Exposing implementation details"
    bad: "Field names matching database columns"
    good: "API-focused naming"
    reason: "Coupling to implementation"

  - name: "No error handling"
    bad: "Throwing exceptions for user errors"
    good: "Return errors in payload"
    reason: "Poor client experience"

  - name: "Generic types"
    bad: "type Response { data: JSON }"
    good: "type CreateUserPayload { user: User }"
    reason: "Lose type safety"

  - name: "Not using DataLoader"
    bad: "Individual database queries in resolvers"
    good: "Batch and cache with DataLoader"
    reason: "N+1 query problem"

  - name: "Mutations without payload types"
    bad: "createUser returns User directly"
    good: "createUser returns CreateUserPayload"
    reason: "Can't add errors or metadata later"

# GraphQL vs REST
comparison:
  graphql_advantages:
    - "Client specifies exact data needed"
    - "Single request for complex data"
    - "Strongly typed schema"
    - "Real-time subscriptions built-in"
    - "Introspection and tooling"

  rest_advantages:
    - "Simpler caching (HTTP layer)"
    - "Better browser support (GET/POST)"
    - "Easier rate limiting per endpoint"
    - "More familiar to developers"

  when_to_use_graphql:
    - "Mobile apps needing optimized payloads"
    - "Complex data requirements with many relationships"
    - "Frequent UI changes requiring API flexibility"
    - "Real-time data with subscriptions"

  when_to_use_rest:
    - "Simple CRUD operations"
    - "Heavy caching requirements"
    - "File uploads/downloads"
    - "Third-party integrations expecting REST"

