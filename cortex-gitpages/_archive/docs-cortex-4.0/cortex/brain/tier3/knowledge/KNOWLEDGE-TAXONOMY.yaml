    owner: "Reliability Team"
    priority: 1
    subdomain: "Reliability"
    tags: ["error-handling", "recovery", "resilience"]

# KNOWLEDGE ENTRY SCHEMA
# =============================================================================
knowledge_entry_schema:
  required_fields:
    entry_id:
      type: string
      format: "KE-{DOMAIN}-{NNN}-{NN}"
      description: "Unique entry identifier"
    
    title:
      type: string
      max_length: 100
      description: "Entry title"
    
    domain:
      type: string
      enum: ["GOVERNANCE", "INTENT-ROUTING", "HALLUCINATION-PREVENTION", "EXECUTION-ORCHESTRATION",
             "DATA-MANAGEMENT", "OBSERVABILITY", "SECURITY", "API-DESIGN", "ML-MODELS",
             "KNOWLEDGE-CURATION", "TESTING-VALIDATION", "DEPLOYMENT", "DOCUMENTATION",
             "PERFORMANCE", "ARCHITECTURE", "ERROR-HANDLING"]
      description: "Primary domain"
    
    content:
      type: string
      min_length: 50
      description: "Entry content/body"
    
    ac_ids:
      type: array
      items: string
      pattern: "AC-[A-Z]+-[0-9]{3}-[0-9]{2}"
      description: "Related AC-IDs"
    
    created_at:
      type: datetime
      description: "Creation timestamp"
    
    created_by:
      type: string
      description: "Creator identifier"
    
  optional_fields:
    description:
      type: string
      max_length: 200
      description: "Short summary"
    
    related_entries:
      type: array
      items: string
      description: "Cross-domain references"
    
    tags:
      type: array
      items: string
      description: "Search tags"
    
    quality_score:
      type: float
      min: 0.0
      max: 1.0
      description: "AI-assessed quality (0.0-1.0)"
    
    expert_review:
      type: object
      properties:
        reviewer: string
        status: "enum[pending, approved, needs_revision]"
        feedback: string
      description: "Expert review details"
    
    last_updated:
      type: datetime
      description: "Last modification timestamp"
    
    update_history:
      type: array
      items:
        - timestamp: datetime
        - changed_by: string
        - changes: string
      description: "Modification history"

