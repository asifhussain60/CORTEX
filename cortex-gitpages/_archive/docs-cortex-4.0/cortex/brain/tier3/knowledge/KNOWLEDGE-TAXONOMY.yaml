    name: "Documentation & Knowledge Transfer"
    description: "Architecture docs, API docs, user guides, training"
    owner: "Technical Writing"
    priority: 1
    subdomain: "Documentation"
    tags: ["documentation", "knowledge-transfer", "guides"]
    
  - domain_id: "PERFORMANCE"
    name: "Performance & Optimization"
