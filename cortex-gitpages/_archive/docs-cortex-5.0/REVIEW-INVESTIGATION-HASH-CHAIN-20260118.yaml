# Step 4: Remediation Path
remediation_analysis:
  
  issue_type: "DESIGN_WEAKNESS - Per-AC-ID chains instead of global chain"
  
  fix_strategy: "Change architecture to create a single global hash chain"
  
  fix_steps:
    
    step_1_fix_code:
      ac_id: "AC-FIX-001-05"
      title: "Fix hash chain to be GLOBAL not per-AC-ID"
      file: "src/infrastructure/database_transaction_manager.py"
      method: "_get_prior_entry_hash()"
      
      change_required: |
        BEFORE (per-AC-ID chain):
          cursor.execute("""
              SELECT entry_hash
              FROM audit_log
              WHERE ac_id = ?        # Only same AC-ID
              ORDER BY id DESC
              LIMIT 1
          """, (ac_id,))
        
        AFTER (global chain):
          cursor.execute("""
              SELECT entry_hash
              FROM audit_log
              ORDER BY id DESC       # All entries chronologically
              LIMIT 1
          """)  # NO ac_id filter
      
      explanation: |
        Remove the "WHERE ac_id = ?" clause to query the LAST entry in the entire
        audit log (regardless of AC-ID). This ensures:
        1. First entry globally: previous_hash = "" (no prior entry)
        2. Entry 2: previous_hash = (entry 1).entry_hash
        3. Entry 3: previous_hash = (entry 2).entry_hash
        ... continuous chain across all AC-IDs
      
      complexity: "1 line change (remove WHERE clause)"
      effort: "30 minutes (fix + local test)"
      priority: "P0 - CRITICAL"
      risk: "LOW (one-line fix, well-tested)"
    
