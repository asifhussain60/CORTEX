# Step 2: Root Cause Investigation
root_cause_investigation:
  
  suspected_issue: "Each AC-ID starts with GENESIS instead of global chain continuation"
  
  code_inspection:
    file: "src/infrastructure/database_transaction_manager.py"
    method: "_get_prior_entry_hash(conn, ac_id)"
    lines: "314-327"
    
    current_code: |
      def _get_prior_entry_hash(self, conn: sqlite3.Connection, ac_id: str) -> str:
          """Get previous hash for AC-ID."""
          cursor = conn.cursor()
          cursor.execute("""
              SELECT entry_hash
              FROM audit_log
              WHERE ac_id = ?        # ← PROBLEM: Filters by ac_id
              ORDER BY id DESC
              LIMIT 1
          """, (ac_id,))
          
          row = cursor.fetchone()
          if row:
              return row[0]
          else:
              return ""  # GENESIS if no prior entry for THIS ac_id
    
    problem_analysis: |
      The query has "WHERE ac_id = ?" which means:
      1. It searches for the LAST entry with the SAME ac_id
      2. If no entry exists for this ac_id yet (first time), it returns "" (GENESIS)
      3. This creates SEPARATE chains per AC-ID, not ONE global chain
      
      Example:
        Entry 751: AC-MCP-EXPOSURE-001 START (GENESIS)
        Entry 752: AC-MCP-EXPOSURE-001 EXECUTE (links to 751 ✅)
        Entry 753: AC-MCP-EXPOSURE-001 COMPLETE (links to 752 ✅)
        Entry 754: AC-MCP-EXPOSURE-002 START (previous_hash = ?)
                   Query looks for: last entry WHERE ac_id = 'AC-MCP-EXPOSURE-002'
                   Result: None (first entry for this AC)
                   Returns: "" (GENESIS)
                   But SHOULD return: entry_hash from entry 753 (global chain)
    
    design_intent_vs_implementation: |
      DESIGN REQUIREMENT (CORE-025):
      - Global hash chain: Every entry in the audit log is cryptographically linked
      - First entry: previous_hash = "" (GENESIS)
      - Every subsequent entry: previous_hash = (prior entry).entry_hash
      - This ensures tamper-evidence across the entire audit trail
      
      CURRENT IMPLEMENTATION:
      - Per-AC-ID chain: Entries are linked only within their AC-ID
      - Each AC starts with GENESIS
      - Different ACs are not linked to each other
      - This allows tampering if attacker deletes entire AC entries
  
  evidence_items:
