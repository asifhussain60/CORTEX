# FinOps Domain Profile - Financial Operations
# Profile ID: finops-v1.0
# Category: Finance, Cost Management, Budgeting
# Target: Financial applications, cost management systems, billing services

profile:
  id: finops-v1.0
  name: Financial Operations
  version: "1.0"
  category: finance
  description: >
    Governance profile for financial operations applications including
    cost tracking, budgeting systems, and financial reporting tools.
  tags:
    - finance
    - cost-management
    - budgeting
    - billing
    - reporting

compatibility:
  cortex_min_version: "0.8.0"
  python_versions: ["3.10", "3.11", "3.12", "3.13"]
  
rules:
  # Audit & Compliance Rules
  - id: FIN-001
    name: audit-trail-required
    severity: critical
    description: All financial transactions must have complete audit trails
    pattern: "Financial operations require AuditTrail integration"
    enforcement: mandatory
    
  - id: FIN-002
    name: decimal-precision
    severity: high
    description: Use Decimal type for monetary values, never float
    pattern: "from decimal import Decimal"
    enforcement: mandatory
    auto_fix: true
    
  - id: FIN-003
    name: currency-handling
    severity: high
    description: Currency must be explicitly specified in all monetary operations
    pattern: "currency: str parameter required"
    enforcement: mandatory
    
  - id: FIN-004
    name: transaction-idempotency
    severity: critical
    description: All financial transactions must be idempotent
    pattern: "idempotency_key parameter required"
    enforcement: mandatory
    
  - id: FIN-005
    name: double-entry-accounting
    severity: high
    description: Implement double-entry accounting for all ledger operations
    pattern: "debit and credit must balance"
    enforcement: recommended
    
  # Security Rules
  - id: FIN-006
    name: pci-dss-compliance
    severity: critical
    description: Payment card data must comply with PCI-DSS
    pattern: "No raw card numbers in logs"
    enforcement: mandatory
    
  - id: FIN-007
    name: sensitive-data-masking
    severity: high
    description: Mask sensitive financial data in all outputs
    pattern: "account numbers partially masked"
    enforcement: mandatory
    
  - id: FIN-008
    name: encryption-at-rest
    severity: critical
    description: Financial data must be encrypted at rest
    pattern: "encryption_enabled: true"
    enforcement: mandatory
    
  # Validation Rules
  - id: FIN-009
    name: amount-validation
    severity: high
    description: Validate all monetary amounts are positive and within limits
    pattern: "amount > 0 and amount <= max_limit"
    enforcement: mandatory
    
  - id: FIN-010
    name: date-validation
    severity: medium
    description: Validate transaction dates are within acceptable ranges
    pattern: "transaction_date validation"
    enforcement: mandatory
    
  - id: FIN-011
    name: reference-number-format
    severity: medium
    description: Enforce consistent reference number formatting
    pattern: "reference format: PREFIX-YYYYMMDD-NNNNNN"
    enforcement: recommended
    
  # Reporting Rules
  - id: FIN-012
    name: reconciliation-support
    severity: high
    description: All transactions must support reconciliation reporting
    pattern: "reconciliation_status field"
    enforcement: mandatory
    
  - id: FIN-013
    name: period-closure
    severity: high
    description: Support financial period closure with no backdating
    pattern: "period_closed check before posting"
    enforcement: mandatory
    
  - id: FIN-014
    name: multi-currency-support
    severity: medium
    description: Support multiple currencies with exchange rate tracking
    pattern: "exchange_rate tracking"
    enforcement: recommended
    
  - id: FIN-015
    name: tax-calculation-audit
    severity: high
    description: Tax calculations must be auditable and reversible
    pattern: "tax_breakdown included"
    enforcement: mandatory

templates:
  - name: financial-service
    path: templates/finops/financial_service.py.j2
  - name: ledger-entry
    path: templates/finops/ledger_entry.py.j2
  - name: reconciliation-report
    path: templates/finops/reconciliation_report.py.j2

hooks:
  pre_commit:
    - check_decimal_usage
    - validate_currency_codes
  pre_push:
    - audit_trail_verification
    - pci_compliance_scan
