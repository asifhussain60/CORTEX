# ML Domain Profile - Machine Learning
# Profile ID: ml-v1.0
# Category: Data Science, AI, Machine Learning
# Target: ML pipelines, model training, inference services

profile:
  id: ml-v1.0
  name: Machine Learning
  version: "1.0"
  category: data-science
  description: >
    Governance profile for machine learning projects including
    model training, inference services, and ML pipelines.
  tags:
    - machine-learning
    - ai
    - data-science
    - model-training
    - mlops

compatibility:
  cortex_min_version: "0.8.0"
  python_versions: ["3.10", "3.11", "3.12", "3.13"]

rules:
  # Model Versioning & Tracking
  - id: ML-001
    name: model-versioning
    severity: high
    description: All models must be versioned with metadata
    pattern: "model_version in metadata"
    enforcement: mandatory
    
  - id: ML-002
    name: experiment-tracking
    severity: high
    description: Track all experiments with parameters and metrics
    pattern: "mlflow|wandb|neptune tracking"
    enforcement: mandatory
    
  - id: ML-003
    name: data-versioning
    severity: high
    description: Version training data alongside models
    pattern: "dvc or similar data versioning"
    enforcement: recommended
    
  # Reproducibility Rules
  - id: ML-004
    name: random-seed-control
    severity: medium
    description: Set random seeds for reproducibility
    pattern: "random_seed parameter"
    enforcement: mandatory
    
  - id: ML-005
    name: environment-capture
    severity: high
    description: Capture environment details with model
    pattern: "requirements.txt or conda.yaml"
    enforcement: mandatory
    
  # Model Quality Rules
  - id: ML-006
    name: validation-metrics
    severity: high
    description: Define and track validation metrics
    pattern: "validation_metrics defined"
    enforcement: mandatory
    
  - id: ML-007
    name: bias-detection
    severity: high
    description: Implement bias detection in model evaluation
    pattern: "fairness metrics included"
    enforcement: recommended
    
  - id: ML-008
    name: model-card
    severity: medium
    description: Generate model cards for documentation
    pattern: "model_card.md generated"
    enforcement: recommended
    
  # Deployment Rules
  - id: ML-009
    name: inference-validation
    severity: high
    description: Validate inputs during inference
    pattern: "input_schema validation"
    enforcement: mandatory
    
  - id: ML-010
    name: prediction-logging
    severity: medium
    description: Log predictions for monitoring
    pattern: "prediction audit trail"
    enforcement: recommended

templates:
  - name: training-pipeline
    path: templates/ml/training_pipeline.py.j2
  - name: inference-service
    path: templates/ml/inference_service.py.j2
  - name: model-card
    path: templates/ml/model_card.md.j2

hooks:
  pre_commit:
    - validate_random_seeds
    - check_data_versioning
  pre_push:
    - model_validation_check
    - bias_detection_scan
