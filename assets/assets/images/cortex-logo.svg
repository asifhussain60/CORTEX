<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cortexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#cortexGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Neural network nodes -->
  <circle cx="100" cy="50" r="8" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="60" cy="80" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="140" cy="80" r="8" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="50" cy="130" r="8" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="100" cy="120" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="150" cy="130" r="8" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="100" cy="160" r="8" fill="#0ea5e9" filter="url(#glow)"/>
  
  <!-- Neural connections -->
  <line x1="100" y1="50" x2="60" y2="80" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="50" x2="140" y2="80" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="80" x2="50" y2="130" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="80" x2="100" y2="120" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="80" x2="100" y2="120" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="80" x2="150" y2="130" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="130" x2="100" y2="160" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="120" x2="100" y2="160" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="130" x2="100" y2="160" stroke="url(#cortexGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- CORTEX text -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        text-anchor="middle" fill="url(#cortexGradient)">CORTEX</text>
</svg>
