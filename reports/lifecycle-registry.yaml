# Documentation Lifecycle Registry

Central registry for CORE-040 lifecycle management configuration and tracking.

## Category Definitions

### session (7 days)
- **Purpose:** Temporary development session artifacts
- **Examples:** Session notes, work-in-progress, debugging output
- **Auto-delete:** Yes, after 7 days
- **Archive path:** documentation/session-archive/

### analysis (30 days)
- **Purpose:** Analysis reports, investigation outputs, exploratory work
- **Examples:** Code analysis, architecture investigation, test results
- **Auto-delete:** Yes, after 30 days
- **Archive path:** documentation/analysis-archive/

### phase (90 days)
- **Purpose:** Phase completion docs, milestone summaries, progress reports
- **Examples:** Phase completion reports, milestone documentation
- **Auto-delete:** Yes, after 90 days
- **Archive path:** documentation/phase-archive/

### test (14 days)
- **Purpose:** Test execution reports, validation outputs
- **Examples:** Test run logs, coverage reports, validation summaries
- **Auto-delete:** Yes, after 14 days
- **Archive path:** documentation/test-archive/

### tool (30 days)
- **Purpose:** Tool-generated outputs, utility reports
- **Examples:** Linter reports, formatter output, code generation logs
- **Auto-delete:** Yes, after 30 days
- **Archive path:** documentation/tool-archive/

## Exemptions

Files that MUST NOT be auto-deleted:

```yaml
exemptions:
  - path: "reports/*/README.md"
    reason: "Structural documentation"
    lifetime: permanent
  
  - path: "reports/*.yaml"
    reason: "Data configuration files"
    lifetime: permanent
  
  - path: "reports/documentation/**"
    reason: "Permanent curated documentation"
    lifetime: permanent
  
  - path: "reports/governance/**"
    reason: "Governance configuration and standards"
    lifetime: permanent
```

## File Naming Convention (CORE-028)

All files MUST use kebab-case naming with max 25 characters including extension:

```
✅ Valid examples:
  session-2026-01-26-xyz.md        (24 chars)
  ana-cortex-review-001.md         (22 chars)
  phase-001-completion.md          (23 chars)

❌ Invalid examples:
  Session Report 2026-01-26.md     (spaces)
  session_report_2026.md           (underscores)
  Phase_1_Completion_Report.md     (underscores + camelCase)
```

## Metadata Requirements (CORE-040)

All files in auto-expired categories MUST include lifecycle metadata:

```yaml
---
created_at: ISO8601 timestamp      # File creation time
expires_at: ISO8601 timestamp      # Auto-delete time
lifetime_days: integer             # Duration in days
category: session|analysis|phase|test|tool
auto_delete_on_expiry: true|false  # Auto-deletion enabled
---

# File content...
```

## Cleanup Configuration

### Automated Cleanup (Future Option)

```python
# Optional background daemon (not in critical path)
validator = LifecycleMetadataValidator()
result = check_expired_files(Path('reports'))

for expired_file in result['expired']:
    # User review before deletion
    # Only delete if auto_delete_on_expiry=true
    # Log deletion to audit trail
    pass
```

### Manual Cleanup (Current Approach)

```bash
# Check for expired files
python -c "
from cortex.governance.validators.lifecycle_validator import check_expired_files
result = check_expired_files()
print('Expired files:', result['expired'])
"

# Archive or delete manually after review
git rm reports/session/2026-01-10-*.md  # Delete
git mv reports/analysis/old.md reports/documentation/analysis-archive/
```

