<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard Diagnostic</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #fff; }
        .diagnostic-box { background: rgba(0, 212, 255, 0.1); padding: 15px; margin: 10px 0; border-left: 4px solid #00d4ff; border-radius: 4px; }
        .success { border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .error { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .warning { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        h2 { color: #00d4ff; }
        code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; }
        button { background: #00d4ff; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; margin: 5px; }
        button:hover { background: #00a8cc; }
        #console-output { background: rgba(0, 0, 0, 0.5); padding: 15px; border-radius: 4px; max-height: 300px; overflow-y: auto; font-size: 12px; }
        .console-entry { margin: 3px 0; }
        .console-log { color: #aaa; }
        .console-error { color: #ef4444; }
        .console-warn { color: #f59e0b; }
        .console-info { color: #00d4ff; }
    </style>
</head>
<body>
    <h1>🔍 CORTEX Dashboard Diagnostic Tool</h1>
    
    <div class="diagnostic-box">
        <h3>Page Information</h3>
        <div id="page-info"></div>
    </div>

    <div class="diagnostic-box" id="script-status">
        <h3>JavaScript Status</h3>
        <div id="js-info"></div>
    </div>

    <div class="diagnostic-box">
        <h3>Dashboard Elements Check</h3>
        <div id="elements-info"></div>
    </div>

    <div class="diagnostic-box">
        <h3>Actions</h3>
        <button onclick="testDashboard()">🧪 Test Dashboard</button>
        <button onclick="window.location.href='cortex-lens-output/CORTEX/index.html?v=' + Date.now()">🔄 Open Dashboard (Cache Bust)</button>
        <button onclick="window.location.href='test-tabs.html'">✅ Test Simple Tabs</button>
    </div>

    <div class="diagnostic-box">
        <h3>Console Output</h3>
        <div id="console-output"></div>
    </div>

    <script>
        // Capture console logs
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        function addConsoleEntry(type, ...args) {
            const entry = document.createElement('div');
            entry.className = `console-entry console-${type}`;
            entry.textContent = `[${type.toUpperCase()}] ${args.join(' ')}`;
            consoleOutput.appendChild(entry);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        console.log = function(...args) {
            addConsoleEntry('log', ...args);
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            addConsoleEntry('error', ...args);
            originalError.apply(console, args);
        };

        console.warn = function(...args) {
            addConsoleEntry('warn', ...args);
            originalWarn.apply(console, args);
        };

        // Page info
        document.getElementById('page-info').innerHTML = `
            <p><strong>URL:</strong> ${window.location.href}</p>
            <p><strong>ReadyState:</strong> <code>${document.readyState}</code></p>
            <p><strong>User Agent:</strong> ${navigator.userAgent.substring(0, 100)}...</p>
        `;

        // JavaScript check
        console.log('🚀 Diagnostic page loaded');
        console.log('Document readyState:', document.readyState);

        document.getElementById('js-info').innerHTML = `
            <p class="success">✅ JavaScript is working</p>
            <p><strong>ReadyState:</strong> <code>${document.readyState}</code></p>
        `;

        function testDashboard() {
            console.log('🧪 Testing dashboard page...');
            
            // Try to load and check the dashboard
            fetch('cortex-lens-output/CORTEX/index.html')
                .then(response => {
                    console.log('Dashboard HTML status:', response.status);
                    return response.text();
                })
                .then(html => {
                    console.log('Dashboard HTML loaded, length:', html.length);
                    
                    // Check for tab elements
                    const hasTabButton = html.includes('class="tab-button"');
                    const hasTabContent = html.includes('class="tab-content"');
                    const hasScript = html.includes('cortex-unified.js');
                    
                    let elementsHtml = '<ul>';
                    elementsHtml += `<li ${hasTabButton ? 'class="success"' : 'class="error"'}>${hasTabButton ? '✅' : '❌'} Tab buttons found</li>`;
                    elementsHtml += `<li ${hasTabContent ? 'class="success"' : 'class="error"'}>${hasTabContent ? '✅' : '❌'} Tab content found</li>`;
                    elementsHtml += `<li ${hasScript ? 'class="success"' : 'class="error"'}>${hasScript ? '✅' : '❌'} JavaScript reference found</li>`;
                    elementsHtml += '</ul>';
                    
                    document.getElementById('elements-info').innerHTML = elementsHtml;
                    console.log('✅ Dashboard check complete');
                })
                .catch(err => {
                    console.error('❌ Error loading dashboard:', err);
                    document.getElementById('elements-info').innerHTML = '<p class="error">❌ Error loading dashboard: ' + err.message + '</p>';
                });

            // Test JS file
            fetch('cortex-lens-output/CORTEX/cortex-unified.js')
                .then(response => {
                    console.log('cortex-unified.js status:', response.status);
                    if (response.status === 200) {
                        document.getElementById('script-status').className = 'diagnostic-box success';
                        document.getElementById('js-info').innerHTML += '<p class="success">✅ cortex-unified.js loads successfully</p>';
                    }
                    return response.text();
                })
                .then(js => {
                    console.log('JS file loaded, length:', js.length);
                    const hasInitialize = js.includes('function initialize()');
                    const hasReadyState = js.includes('document.readyState');
                    
                    let scriptHtml = '<p><strong>Script Analysis:</strong></p><ul>';
                    scriptHtml += `<li ${hasInitialize ? 'class="success"' : 'class="error"'}>${hasInitialize ? '✅' : '❌'} initialize() function present</li>`;
                    scriptHtml += `<li ${hasReadyState ? 'class="success"' : 'class="error"'}>${hasReadyState ? '✅' : '❌'} readyState check present</li>`;
                    scriptHtml += '</ul>';
                    
                    document.getElementById('js-info').innerHTML += scriptHtml;
                })
                .catch(err => {
                    console.error('❌ Error loading JS file:', err);
                    document.getElementById('script-status').className = 'diagnostic-box error';
                    document.getElementById('js-info').innerHTML += '<p class="error">❌ Error loading cortex-unified.js: ' + err.message + '</p>';
                });
        }

        // Auto-run test on load
        window.addEventListener('load', () => {
            console.log('Page fully loaded, running auto-test...');
            setTimeout(testDashboard, 500);
        });
    </script>
</body>
</html>
