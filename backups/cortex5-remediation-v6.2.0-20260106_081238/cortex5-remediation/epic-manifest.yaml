# Python Orchestrator Architecture
orchestrator_architecture:
  entry_point: "src/main.py"
  invocation_pattern: "python3 -m src.main \"{request}\" --format markdown"
  execution_mode: terminal_based
  routing: master_orchestrator
  
  # Task Management System
  task_tracking:
    enabled: true
    storage: "tracking/task-registry.json"
    todo_manager: "src/orchestrators/master/todo_manager.py"
    features:
      - "Create, update, complete tasks"
      - "Priority-based sorting"
      - "Dependency tracking"
      - "Progress percentage calculation"
      - "Real-time JSON updates"
  
  # Progress Tracking
  progress_tracking:
    storage: "tracking/progress-tracker.json"
    update_frequency: "per_phase_completion"
    fields:
      - "epic_id"
      - "overall_progress"
      - "phases_complete"
      - "total_phases"
      - "current_phase"
      - "status"
      - "last_updated"
  
  # Plan Viewer Configuration
  plan_viewer:
    file: "plan-viewer.html"
    template: "templates/plan-viewer/plan-viewer-template.html"
    css_theme: "templates/plan-viewer/glassmorphism-theme.css"
    generator: "templates/plan-viewer/generate-plan-viewer.py"
    auto_refresh: true
    refresh_interval: 5  # seconds
    features:
      - "Real-time progress tracking"
      - "Phase status visualization"
      - "Task list display"
      - "Dependency graph"
      - "Glassmorphism design standard v4.2.9"
    regeneration:
      command: "python3 -m templates.plan-viewer.generate-plan-viewer --plan-dir {plan_dir}"
      trigger: "After CSS theme updates or metadata changes"
      applies_to: "All active plans when using --regenerate-all"

