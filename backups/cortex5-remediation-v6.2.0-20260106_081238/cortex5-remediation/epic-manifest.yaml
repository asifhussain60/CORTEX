  - phase_id: "P17"
    name: "Risk Mitigation Implementation"
    type: autonomous_python
    script: "scripts/phase_17_risk_mitigation.py"
    duration: "2 days"
    priority: P0_CRITICAL
    status: planning
    description: "Implement mitigations for 4 critical risks identified in HOLISTIC-RISK-ANALYSIS.md"
    
    # Why Critical
    justification: "13 critical risks identified but ZERO mitigations in current plan. Unaddressed risks will cause production failures: database corruption (RISK-001), race conditions (RISK-002), circular imports (RISK-003), renderer failures (RISK-004)."
    
    # Sub-phases
    sub_phases:
      - "P17.1: Atomic Database Migrations (RISK-001) (6h)"
      - "P17.2: Thread-Safe Task Registry (RISK-002) (6h)"
      - "P17.3: Circular Import Resolution (RISK-003) (8h)"
      - "P17.4: ResponseRenderer Retry Logic (RISK-004) (4h)"
    
    # Deliverables
    deliverables:
      - "src/database/atomic_migrator.py (AtomicMigrator with transaction + rollback)"
      - "src/database/migrations/migration_base.py (base class with savepoint support)"
      - "src/orchestrators/master/thread_safe_task_registry.py (SQLite-based task storage)"
      - "src/orchestrators/master/migrate_tasks_json_to_db.py (migration script)"
      - "src/orchestrators/lazy_loader.py (lazy orchestrator loading via DI)"
      - "src/orchestrators/orchestrator_factory.py (factory pattern for orchestrators)"
      - "src/orchestrators/response_renderer.py (retry logic + fallback template)"
      - "tests/integration/test_atomic_migrations.py (rollback verification)"
      - "tests/integration/test_concurrent_task_updates.py (race condition tests)"
      - "tests/unit/test_lazy_loading.py (circular import prevention)"
      - "tests/unit/test_response_renderer_retry.py (retry logic verification)"
      - "cortex-brain/documents/architecture/RISK-MITIGATION-REPORT.md"
    
    # Risk Mitigations
    risk_mitigations:
      RISK_001_atomic_migrations:
        problem: "Database migrations lack rollback, risk data corruption"
        solution: "Implement AtomicMigrator with savepoints + automatic rollback"
        implementation: |
          class AtomicMigrator:
              def migrate(self, migration):
                  with self.db.transaction():
                      self.db.savepoint('pre_migration')
                      try:
                          for step in migration.steps:
                              step.execute()
                              self.db.savepoint(f'after_{step.id}')
                          self.db.commit()
                      except Exception as e:
                          self.db.rollback_to('pre_migration')
                          raise MigrationFailedError(e)
      
      RISK_002_task_race_condition:
        problem: "JSON-based task registry not thread-safe, write-write conflicts"
        solution: "Migrate to SQLite-based storage with automatic locking"
        implementation: |
          class ThreadSafeTaskRegistry:
              def __init__(self):
                  self.db = sqlite3.connect('tracking/tasks.db')
                  self.db.execute("CREATE TABLE IF NOT EXISTS tasks (...)")
              
              def add_task(self, task):
                  with self.db:  # Automatic transaction + row locking
                      self.db.execute("INSERT INTO tasks VALUES (?)", task)
      
      RISK_003_circular_imports:
        problem: "6 orchestrators have circular import dependencies"
        solution: "Lazy loading via factory pattern + dependency injection"
        implementation: |
          # Replace direct imports
          from src.orchestrators.planning import PlanningOrchestrator
          
          # With lazy loading
          def get_orchestrator(name):
              if name == 'planning':
                  from src.orchestrators.planning import PlanningOrchestrator
                  return PlanningOrchestrator()
      
      RISK_004_renderer_failure:
        problem: "ResponseRenderer has no retry logic, silent failures possible"
        solution: "Add exponential backoff retry + fallback template"
        implementation: |
          class ResilientResponseRenderer:
              def render(self, template, context, retries=3):
                  for attempt in range(retries):
                      try:
                          return self._render(template, context)
                      except TemplateError as e:
                          if attempt == retries - 1:
                              return self._fallback_template(context)
                          time.sleep(0.1 * (2 ** attempt))
    
    acceptance_criteria:
      functional:
        - "✅ AtomicMigrator rolls back on migration failure (tested with intentional error)"
        - "✅ ThreadSafeTaskRegistry handles 10 concurrent writers without conflicts"
        - "✅ Lazy loader resolves all 6 circular import issues"
        - "✅ ResponseRenderer retries 3 times + uses fallback on persistent failure"
      
      testing:
        - "✅ Integration test: Force migration failure, verify rollback"
        - "✅ Concurrency test: 10 threads update tasks, verify no data loss"
        - "✅ Unit test: Import orchestrators in different orders, no circular errors"
        - "✅ Unit test: Mock template error, verify retry + fallback"
      
      data_integrity:
        - "✅ Migration rollback leaves database in pre-migration state"
        - "✅ Concurrent task updates result in all tasks saved (no lost writes)"
        - "✅ No data corruption during migration"
      
      performance:
        - "✅ SQLite task registry <10ms per operation"
        - "✅ Lazy loading adds <50ms to first orchestrator instantiation"
        - "✅ ResponseRenderer retry adds <100ms on failure (negligible on success)"
    
    metrics:
      migration_rollback_success_rate:
        baseline: "0% (no rollback logic)"
        target: "100% (all failed migrations rollback)"
        measurement: "Integration test with intentional migration errors"
      
      task_write_conflict_rate:
        baseline: "~10% (observed with 5+ concurrent writers)"
        target: "0% (SQLite ACID guarantees)"
        measurement: "Concurrency test: 10 threads, 100 writes each"
      
      circular_import_errors:
        baseline: "6 occurrences"
        target: "0 occurrences"
        measurement: "pytest --import-mode=importlib (all import orders)"
      
      renderer_failure_rate:
        baseline: "~1% (silent failures observed)"
        target: "<0.01% (retry + fallback)"
        measurement: "Load test: 10k renders with 1% error injection"
    
