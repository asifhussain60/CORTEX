      phase_2_design:
        duration: "3-4 hours"
        activities:
          - "Prioritize governance gaps (Architecture Integrity, Quality Gates, Security)"
          - "Draft 3-5 new rules based on real violations"
          - "Define enforcement triggers and validation criteria"
          - "Design rule interaction patterns (no conflicts)"
      
      phase_3_validation:
        duration: "2 hours"
        activities:
          - "Test new rules against P00-P17 execution history"
          - "Verify rules don't conflict with existing 4"
          - "Confirm plugin-based implementation feasible"
          - "Create acceptance criteria for each rule"
      
      phase_4_implementation_prep:
        duration: "1 hour"
        activities:
          - "Document finalized rules in brain-protection-rules.yaml"
          - "Create plugin stubs for new rules"
          - "Update governance documentation"
          - "Define P19 implementation tasks"
    
    # Deliverables
    deliverables:
      - "cortex-brain/documents/planning/active/cortex5-remediation/analysis/GIT-COMMIT-INTELLIGENCE-P00-P17.md (Phase 0 automated)"
      - "cortex-brain/documents/planning/active/cortex5-remediation/analysis/GOVERNANCE-RULE-CANDIDATES-FROM-GIT.json (Phase 0 automated)"
      - "cortex-brain/documents/planning/active/cortex5-remediation/analysis/VIOLATION-HEATMAP.json (Phase 0 automated)"
      - "cortex-brain/brain-protection-rules.yaml (updated with 3-5 new rules)"
      - "cortex-brain/documents/governance/GOVERNANCE-RULES-V2-SPECIFICATION.md (design doc)"
      - "cortex-brain/documents/governance/RULES-RATIONALE.md (why each rule exists)"
      - "src/orchestrators/middleware/governance/plugins/ (rule plugin stubs)"
      - "cortex-brain/documents/planning/active/cortex5-remediation/phases/P19-GOVERNANCE-RULES-IMPLEMENTATION.md"
      - "cortex-brain/documents/analysis/GOVERNANCE-GAP-ANALYSIS.md (violations from P00-P17)"
    
    # Candidate Rules (To Be Validated in Session)
    candidate_rules:
      architecture_integrity:
        - "ORCHESTRATOR_BASE_COMPLIANCE: All orchestrators must inherit from BaseOrchestrator"
        - "DEPENDENCY_INJECTION: No hardcoded dependencies, use DI pattern"
        - "ASYNC_SAFETY: All async operations must use asyncio.Lock for shared state"
        - "STATE_IMMUTABILITY: State modifications logged in audit trail"
      
      quality_gates:
        - "CODE_COVERAGE_THRESHOLD: New code must maintain >80% test coverage"
        - "COMPLEXITY_LIMIT: Cyclomatic complexity <15 per function"
        - "TYPE_SAFETY: All public APIs must have type hints"
        - "DOCUMENTATION_REQUIRED: All orchestrators must have docstrings"
      
      security_privacy:
        - "GIT_ISOLATION: CORTEX code never commits to user repos (from SKULL)"
        - "PII_DETECTION: Automated PII scanning before file writes"
        - "CREDENTIAL_SCANNING: Pre-commit hooks block credential exposure"
        - "ACCESS_CONTROL: User data accessible only to authorized orchestrators"
    
    # Success Criteria
    acceptance_criteria:
      collaborative_alignment:
        - "Human and AI agree on 3-5 high-value governance rules"
        - "All rules have clear enforcement triggers"
        - "No conflicts with existing 4 rules"
        - "Rules address real pain points (not speculative)"
      
      implementation_ready:
        - "brain-protection-rules.yaml updated with v6.0 schema"
        - "Plugin stubs created for all new rules"
        - "P19 implementation plan detailed"
        - "Acceptance tests defined for each rule"
      
      documentation_complete:
        - "Each rule has rationale (why it exists)"
        - "Enforcement strategy documented"
        - "Validation criteria specified"
        - "Examples (pass/fail) provided"
    
    # Metrics
    metrics:
      governance_coverage:
        baseline: "4 rules across 2/6 categories (33% populated)"
        target: "8-10 rules across 5/6 categories (83% populated)"
        measurement: "brain-protection-rules.yaml category coverage"
      
      violation_prevention:
        baseline: "N/A (new rules not yet enforced)"
        target: ">90% (violations prevented by plugins)"
        measurement: "Audit log analysis after P19 implementation"
      
      rule_addition_time:
        baseline: "3-5 days per rule (speculative design)"
        target: "2-4 hours per rule (plugin-based, data-driven)"
        measurement: "Time from rule design to enforcement"
    
    # Dependencies & Blocking
    dependencies: ["P17"]  # Must complete risk mitigation before governance finalization
    blocks: ["P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12", "P13"]  # Block orchestrator upgrades until governance finalized
    
    # Human-AI Collaboration Protocol
    collaboration_protocol:
      cortex_role:
        - "🆕 Phase 0: Run automated git commit intelligence analysis (30 min)"
        - "🆕 Phase 0: Extract violation patterns, refactoring clusters, rollbacks from git history"
        - "🆕 Phase 0: Generate governance rule candidates ranked by violation frequency"
        - "Phase 1: Analyze governance-audit.jsonl for patterns"
        - "Phase 1: Cross-reference git commit patterns with audit log violations"
        - "Phase 1: Extract architectural pain points from P00-P17"
        - "Phase 2: Propose rule candidates based on violations (git + audit data)"
        - "Phase 2: Draft enforcement logic and validation tests"
      
      human_role:
        - "Prioritize governance gaps (business context)"
        - "Validate rule candidates (strategic alignment)"
        - "Approve final rule set (3-5 rules)"
        - "Define acceptance criteria (domain expertise)"
      
      stopping_conditions:
        - "✅ 3-5 high-value rules identified and approved"
        - "✅ All rules have enforcement plugins designed"
        - "✅ P19 implementation plan accepted"
        - "⛔ Maximum 2-day duration reached (time-box)"
        - "⛔ No clear violations found (defer to post-P13 review)"
  
