# Task Registry Schema
task_registry_schema:
  task:
    id: "string (UUID)"
    title: "string"
    description: "string"
    phase_id: "string (references phases.phase_id)"
    status: "enum [not_started, in_progress, completed, blocked]"
    priority: "enum [P0_CRITICAL, P1, P2, P3]"
    created: "ISO 8601 datetime"
    updated: "ISO 8601 datetime"
    completed: "ISO 8601 datetime (nullable)"
    dependencies: "array of task IDs"
    assignee: "string (default: CORTEX)"
    estimated_hours: "number"
    actual_hours: "number (nullable)"
    progress_percentage: "number (0-100)"

# Progress Tracker Schema
progress_tracker_schema:
  epic_id: "string"
  epic_name: "string"
  version: "string"
  status: "enum [planning, in_progress, completed, blocked]"
  overall_progress: "number (0-100)"
  phases:
    total: "number"
    completed: "number"
    in_progress: "number"
    pending: "number"
  tasks:
    total: "number"
    completed: "number"
    in_progress: "number"
    pending: "number"
    blocked: "number"
  current_phase: "string (phase_id)"
  started: "ISO 8601 datetime (nullable)"
  completed: "ISO 8601 datetime (nullable)"
  last_updated: "ISO 8601 datetime"
  
# SKULL Rules Enforcement
skull_rules:
  - rule: "PLANNING_ISOLATION"
    enforcement: "Planning creates structure only, never implements"
  - rule: "HAND_OFF_PROTOCOL"
    enforcement: "All orchestrators invoke via terminal (python3 -m src.main)"
  - rule: "AUTONOMOUS_ONLY"
    enforcement: "NO markdown workflows, Python scripts only"
  - rule: "TDD_ENFORCEMENT"
    enforcement: "All code changes require RED→GREEN→REFACTOR"
  - rule: "HOLISTIC_DISCOVERY"
    enforcement: "Search before create (prevent duplicates)"
  - rule: "TRANSFORMATION_REQUIRED"
    enforcement: "Raw requests enriched before routing"

# Execution Strategy
execution_strategy:
  approach: "Sequential with dependency validation"
  start_phase: "P01"
  checkpoint_frequency: "per_phase"
  rollback_strategy: "Git-based with timestamped backups"
  validation_gates:
    - "Phase completion requires all tasks completed"
    - "Dependencies must be satisfied before phase start"
    - "Tests must pass before marking phase complete"
  
# Metrics & KPIs
metrics:
  brittleness_target: "< 30/100"
  test_coverage_target: "> 80%"
  orchestrator_readiness: "12/12 production-ready"
  task_completion_rate: "measured per phase"
  avg_task_duration: "tracked for estimation improvement"

# References
references:
  architecture: "cortex-brain/documents/cortex-architecture-quick-ref.md"
  skull_rules: "cortex-brain/brain-protection-rules.yaml"
  master_orchestrator: "cortex-brain/config/master-orchestrator.yaml"
  response_templates: "cortex-brain/response-templates-v4.yaml"
  
