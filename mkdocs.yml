site_name: CORTEX Documentation
site_description: AI-powered orchestration platform with multi-tier governance
site_author: Asif Hussain
repo_url: https://github.com/asifhussain60/CORTEX
repo_name: asifhussain60/CORTEX
edit_uri: edit/CORTEX/docs/

docs_dir: docs
site_dir: _build/site

theme:
  name: material
  custom_dir: docs/theme
  logo: assets/images/cortex-logo-200.png
  favicon: assets/images/CORTEX-logo-64.png
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/cortex-glassmorphism.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

plugins:
  - search:
      lang: en

exclude_docs: |
  _diagrams/
  _hooks/

# Custom post-build hook to copy assets to site folder
hooks:
  - docs/_hooks/copy_assets.py

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - "🚀 Home": 00-README.md
  - Getting Started:
    - Quickstart: 01-getting-started/quickstart.md
  - Architecture:
    - Overview: 02-architecture/overview.md
    - Brain Tiers: 02-architecture/brain-tiers.md
    - Orchestrators: 02-architecture/orchestrators.md
  - API Reference:
    - Overview: 03-api-reference/overview.md
  - Guides:
    - Overview: 04-guides/overview.md
  - Tutorials:
    - Overview: 05-tutorials/overview.md
  - Reference:
    - Overview: 06-reference/overview.md
  - Contributing: LICENSE.md
