# AC_START: AC-MEGA-B-S4-004
# Kubernetes Deployment Configuration for CORTEX MCP Server
# Authority: Phase 22 (MEGA-PHASE B) Stage 4
# Purpose: Production-ready Kubernetes deployment with health checks, scaling, and monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-mcp-server
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
    version: v2.0.0
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cortex
      component: mcp-server
  template:
    metadata:
      labels:
        app: cortex
        component: mcp-server
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cortex-mcp
      containers:
      - name: mcp-server
        image: cortex/mcp-server:2.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: CORTEX_ENV
          value: "production"
        - name: CORTEX_MCP_ENABLED
          value: "true"
        - name: PYTHONPATH
          value: "/app"
        - name: CORTEX_WORKSPACE
          value: "/workspace"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MAX_CONCURRENT_REQUESTS
          value: "50"
        - name: REQUEST_TIMEOUT_SECONDS
          value: "30"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: cortex-registry
          mountPath: /workspace/cortex-registry
          readOnly: true
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: cortex-workspace-pvc
      - name: config
        configMap:
          name: cortex-mcp-config
      - name: cortex-registry
        configMap:
          name: cortex-registry-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cortex
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-mcp-service
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
spec:
  type: ClusterIP
  selector:
    app: cortex
    component: mcp-server
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-mcp
  namespace: cortex-production
  labels:
    app: cortex
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortex-mcp-hpa
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortex-mcp-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortex-mcp-pdb
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cortex
      component: mcp-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-mcp-config
  namespace: cortex-production
  labels:
    app: cortex
data:
  server.yaml: |
    server:
      host: 0.0.0.0
      port: 8000
      workers: 4
      timeout: 30
      max_concurrent: 50
    
    logging:
      level: INFO
      format: json
      output: stdout
    
    monitoring:
      prometheus:
        enabled: true
        port: 9090
      health_check:
        enabled: true
        interval: 10
    
    governance:
      enforcement: strict
      audit_trail: true
    
    performance:
      routing_target_ms: 300
      execution_target_ms: 1000
      cache_enabled: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-workspace-pvc
  namespace: cortex-production
  labels:
    app: cortex
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwo
# AC_COMPLETE: AC-MEGA-B-S4-004 ✅ Kubernetes deployment configuration created
