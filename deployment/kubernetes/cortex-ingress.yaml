# Kubernetes Ingress Configuration for CORTEX MCP Server
# Authority: Phase 22 (MEGA-PHASE B) Stage 4
# Purpose: External access with TLS, rate limiting, and canary deployment

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-mcp-ingress
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
  annotations:
    # TLS Configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    
    # Canary Deployment Support
    nginx.ingress.kubernetes.io/canary: "false"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cortex.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cortex-mcp.example.com
    secretName: cortex-mcp-tls
  rules:
  - host: cortex-mcp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cortex-mcp-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: cortex-mcp-service
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: cortex-mcp-service
            port:
              number: 9090
---
# Canary Ingress for 10% traffic split
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-mcp-ingress-canary
  namespace: cortex-production
  labels:
    app: cortex
    component: mcp-server
    deployment: canary
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "always"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cortex-mcp.example.com
    secretName: cortex-mcp-tls
  rules:
  - host: cortex-mcp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cortex-mcp-service-canary
            port:
              number: 80
