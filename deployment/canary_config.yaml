# CORTEX Canary Deployment Configuration
# AC-MEGA-B-S4-003: Canary deployment routing configuration

canary:
  enabled: true
  traffic_split:
    stable: 0.90   # 90% to stable version
    canary: 0.10   # 10% to canary version

  rollback:
    failure_rate_threshold: 0.05  # Roll back if error rate exceeds 5%
    latency_p95_threshold_ms: 500
    auto_rollback: true

  monitoring:
    health_check_interval_seconds: 30
    evaluation_window_minutes: 10
    min_requests_for_evaluation: 100
