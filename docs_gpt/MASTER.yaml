schema_version: 1.0
site:
  name: "CORTEX - Enterprise Development Intelligence"
  short_name: "CORTEX"
  base_style_reference: "index_gemini.html"
  output_root: "site/"
  build_mode: "static"
  audiences:
    - Business leaders
    - Product Owners
    - Software Engineers

goals:
  - "Impress with visuals and clarity: minimal text, maximal signal."
  - "Tell a coherent story: Governance → Orchestration → Intelligence → Proof."
  - "Make it feel alive: subtle animations, responsive layouts, crisp interactions."
  - "Every page includes at least: 1 Mermaid diagram + 1 interactive D3 widget (unless explicitly noted)."

global_design_system:
  tokens:
    colors:
      bg_dark: "#050714"
      bg_panel: "#0f142e"
      accent_primary: "#00d4ff"
      accent_secondary: "#7b61ff"
      accent_success: "#00ff9d"
      accent_warning: "#ffb800"
      accent_danger: "#ff4d4d"
      glass_bg: "rgba(20, 25, 50, 0.65)"
      glass_border: "rgba(255, 255, 255, 0.08)"
      glass_highlight: "rgba(255, 255, 255, 0.03)"
    radii:
      card: "16px"
      panel: "20px"
    shadow:
      card: "0 8px 32px rgba(0, 0, 0, 0.2)"
    easing:
      ease_out: "cubic-bezier(0.22, 1, 0.36, 1)"

architecture:
  folder_structure:
    - "site/index.html"
    - "site/getting-started/index.html"
    - "site/story/viewer.html"
    - "site/features/index.html"
    - "site/lens/index.html"
    - "site/lens/crawlers.html"
    - "site/lens/knowledge-graph.html"
    - "site/toolkit-manager/index.html"
    - "site/toolkit-manager/plan-viewer.html"
    - "site/toolkit-manager/mcp.html"
    - "site/orchestrators/*.html"
    - "site/security/*.html"
    - "site/sts/*.html"
    - "site/faq.html"
    - "site/sitemap.html"
    - "site/design-system/glassmorphism-guide.html"
    - "site/assets/**"
  shared_files_to_create:
    - path: "site/assets/css/theme.css"
      purpose: "shared tokens, components, utilities, responsiveness"
    - path: "site/assets/js/app-shell.js"
      purpose: "inject nav/footer, active-link highlighting, loading overlay, reveal animations, prefers-reduced-motion"
    - path: "site/assets/js/d3-widgets.js"
      purpose: "reusable D3 widgets (ROI chart, token-savings gauge, timeline, network graph, heatmap)"
    - path: "site/assets/js/mermaid-init.js"
      purpose: "global Mermaid init with dark theme + per-page diagram rendering"
    - path: "site/assets/js/mock-data.js"
      purpose: "small deterministic mock data sets for D3 demos"

navigation:
  top_nav:
    - label: "Home"
      href: "index.html"
    - label: "Getting Started"
      href: "getting-started/index.html"
    - label: "Discovery (Lens)"
      href: "lens/index.html"
    - label: "Toolkit"
      href: "toolkit-manager/index.html"
    - label: "Orchestrators"
      href: "orchestrators/planning-system.html"
    - label: "Security"
      href: "security/dashboard.html"
    - label: "Quality (STS)"
      href: "sts/code-quality.html"
    - label: "Features"
      href: "features/index.html"
  footer_quick_links:
    - label: "FAQ"
      href: "faq.html"
    - label: "Site Map"
      href: "sitemap.html"
    - label: "Design System"
      href: "design-system/glassmorphism-guide.html"
    - label: "Plan Viewer"
      href: "toolkit-manager/plan-viewer.html"

content_principles:
  - "Use short copy blocks; prefer diagrams, cards, and interactive widgets."
  - "Show proof: evidence bundles, audit logs, lifecycle states, and governance gates."
  - "Make business value visual: token-optimization savings, cycle-time reduction, risk heatmaps."
  - "Keep claims grounded; label metrics as sample/demo if they are mock data."

copilot_execution_instructions:
  step_by_step:
    - "Read index_gemini.html and extract: tokens, components, animation patterns, nav/sections."
    - "Create shared theme.css and app-shell.js to keep all pages consistent."
    - "For each view YAML: generate the target HTML with the requested sections + diagrams."
    - "Ensure all href links match the navigation map above."
    - "Run local link-check: no missing targets."
    - "Validate responsiveness (phone/tablet/ipad)."
  acceptance_gates:
    - gate: "Design Parity"
      criteria:
        - "Typography, glass cards, gradients, and hover effects match index_gemini style."
        - "All pages share the same nav/footer look."
    - gate: "Visual Density"
      criteria:
        - "Each page has at least 2 high-quality visuals (Mermaid + D3), not decorative junk."
    - gate: "Performance"
      criteria:
        - "Lazy-render heavy D3 widgets when visible."
        - "No large blocking JS; defer where possible."
    - gate: "Accessibility"
      criteria:
        - "Keyboard navigable; visible focus ring."
        - "Respects prefers-reduced-motion."

