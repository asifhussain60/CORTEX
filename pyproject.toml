# CORTEX Python Project Configuration
# Purpose: Linting, formatting, and import validation rules
# Authority: Phase 96 - Import Linting Rules
# Created: 2026-02-16

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Enable import linting rules
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "TID",  # tidy imports (ban specific imports)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cortex.core.governance" = { msg = "Import directly from cortex_brain.tier0.governance instead" }
"cortex.core.hallucination_prevention" = { msg = "Import directly from cortex_brain.tier0.hallucination_prevention instead" }
"cortex.core.tier_validator" = { msg = "Import directly from cortex_brain.tier0 instead" }
"cortex.domain_brain.models" = { msg = "Import directly from cortex_brain.domain_brain.models instead" }
"cortex.domain_brain.api" = { msg = "Import directly from cortex_brain.domain_brain.api instead" }
"cortex.domain_brain.adapters" = { msg = "Import directly from cortex_brain.domain_brain.adapters instead" }
"cortex.brain.tier0" = { msg = "Import directly from cortex_brain.tier0 instead" }
"cortex.brain.tier1" = { msg = "Import directly from cortex_brain.tier1 instead" }
"cortex.brain.tier2" = { msg = "Import directly from cortex_brain.tier2 instead" }
"cortex.brain.tier3" = { msg = "Import directly from cortex_brain.tier3 instead" }

[tool.ruff.lint.isort]
# Sort imports with cortex_brain before cortex
known-first-party = ["cortex_brain", "cortex"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
