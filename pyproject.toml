# CORTEX Python Project Configuration
# Purpose: Linting, formatting, and import validation rules
# Authority: Phase 96 - Import Linting Rules
# Created: 2026-02-16

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Enable import linting rules
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "TID",  # tidy imports (ban specific imports)
]

[tool.ruff.lint.flake8-tidy-imports]
# Ban imports from cortex/* that should import from cortex_intelligence/* instead
# This prevents stub/wrapper creation
ban-relative-imports = "all"
# Note: banned-api requires dict format {module: {members: [list]}}
# Commenting out for now as these are module-level bans not supported by ruff TID
# banned-api = {
#     "cortex.core.governance": "Import from cortex_intelligence.memory.core.governance",
#     "cortex.domain_brain.models": "Import from cortex_intelligence.domain_brain.models",
# }

[tool.ruff.lint.isort]
# Sort imports with cortex_intelligence before cortex
known-first-party = ["cortex_intelligence", "cortex"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
