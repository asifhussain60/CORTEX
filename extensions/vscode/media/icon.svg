<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#brainGradient)"/>
  
  <!-- Brain representation (simplified) -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <!-- Left hemisphere -->
    <path d="M 35 45 Q 25 55 25 65 Q 25 75 35 85" />
    <path d="M 40 42 Q 32 50 32 60 Q 32 70 40 78" />
    <path d="M 45 40 Q 38 48 38 58 Q 38 68 45 76" />
    
    <!-- Right hemisphere -->
    <path d="M 93 45 Q 103 55 103 65 Q 103 75 93 85" />
    <path d="M 88 42 Q 96 50 96 60 Q 96 70 88 78" />
    <path d="M 83 40 Q 90 48 90 58 Q 90 68 83 76" />
    
    <!-- Central connection (corpus callosum) -->
    <line x1="50" y1="64" x2="78" y2="64" stroke-width="4"/>
    
    <!-- Neural nodes -->
    <circle cx="35" cy="55" r="2" fill="#ffffff"/>
    <circle cx="40" cy="50" r="2" fill="#ffffff"/>
    <circle cx="45" cy="48" r="2" fill="#ffffff"/>
    <circle cx="93" cy="55" r="2" fill="#ffffff"/>
    <circle cx="88" cy="50" r="2" fill="#ffffff"/>
    <circle cx="83" cy="48" r="2" fill="#ffffff"/>
  </g>
  
  <!-- CORTEX text -->
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CORTEX</text>
</svg>
