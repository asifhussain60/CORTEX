# violation_patterns.yaml — CORTEX Governance Violation Pattern Registry
# SSOT: cortex/governance/violation_scanner.py
# Supports: CORE-002, CORE-008, CORE-011, CORE-012, CORE-013, CORE-028, CORE-035
# Phase: 41 (AC-PHASE41-017)

patterns:
  CORE-002:
    description: "All output inline — never create .md/.txt report files via bash commands"
    patterns:
      - type: "cat_redirect"
        regex: "cat\\s*>\\s*[\\w\\-\\.]+\\.md"
        message: "CORE-002 violation: file generation via 'cat > *.md' detected — all output must be inline"
        example: "cat > output.md << 'EOF'"
      - type: "cat_heredoc"
        regex: "cat\\s*>\\s*[\\w\\-\\.]+\\.md\\s*<<[\\s\\'\"]?EOF"
        message: "CORE-002 violation: file generation via heredoc 'cat > *.md <<EOF' detected — use inline output only"
        example: "cat > summary.md <<EOF"
      - type: "echo_redirect"
        regex: "echo\\s+.+\\s*>\\s*[\\w\\-\\.]+\\.md"
        message: "CORE-002 violation: file generation via 'echo > *.md' detected — all output must be inline"
        example: "echo 'content' > output.md"
      - type: "printf_redirect"
        regex: "printf\\s+.+\\s*>\\s*[\\w\\-\\.]+\\.md"
        message: "CORE-002 violation: file generation via 'printf > *.md' detected — all output must be inline"
        example: "printf '%s\\n' 'data' > file.md"
      - type: "tee_md"
        regex: "tee\\s+[\\w\\-\\.]+\\.md"
        message: "CORE-002 violation: file generation via 'tee *.md' detected — all output must be inline"
        example: "command | tee output.md"
      - type: "redirect_append_md"
        regex: ">>\\s*[\\w\\-\\.]+\\.md"
        message: "CORE-002 violation: file append via '>> *.md' detected — all output must be inline"
        example: "echo 'more' >> output.md"
      - type: "txt_redirect"
        regex: "(cat|echo|printf)\\s+.+\\s*>\\s*[\\w\\-\\.]+\\.txt"
        message: "CORE-002 violation: file generation via redirect to '*.txt' detected — all output must be inline"
        example: "echo 'content' > report.txt"
      - type: "heredoc_variants"
        regex: "cat\\s*>\\s*[\\w\\-\\.]+\\.md\\s*<<[\\s\\\"']"
        message: "CORE-002 violation: heredoc file generation detected — all output must be inline"
        example: "cat > notes.md <<'EOF'"
      - type: "python_write_md"
        regex: "python3?\\s+-c\\s+['\"].*open.*\\.md.*write"
        message: "CORE-002 violation: Python one-liner writing to *.md file detected"
        example: "python3 -c \"open('out.md','w').write('...')\""
      - type: "redirect_any_report"
        regex: ">\\s*[\\w\\-\\.]*report[\\w\\-\\.]*\\.(md|txt)"
        message: "CORE-002 violation: redirect to report file detected — all output must be inline"
        example: "command > status-report.md"

  CORE-008:
    description: "TDD mandatory — write failing test first, then implement"
    patterns:
      - type: "implement_before_test"
        regex: "def\\s+\\w+.*:\\s*\\n(?!\\s*#.*test)"
        message: "CORE-008 violation: implementation before test detected"
        example: "def my_function(): # no test written first"
      - type: "skip_test"
        regex: "@pytest\\.mark\\.skip"
        message: "CORE-008 violation: skipped test — TDD requires all tests to run"
        example: "@pytest.mark.skip"
      - type: "xfail_permanent"
        regex: "@pytest\\.mark\\.xfail\\s*\\("
        message: "CORE-008 warning: xfail usage — ensure this is temporary during TDD RED phase"
        example: "@pytest.mark.xfail(reason='not implemented')"
      - type: "empty_test"
        regex: "def\\s+test_\\w+.*:\\s*\\n\\s*pass"
        message: "CORE-008 violation: empty test (pass only) — tests must have meaningful assertions"
        example: "def test_foo(): pass"
      - type: "todo_test"
        regex: "def\\s+test_\\w+.*:\\s*\\n\\s*#\\s*TODO"
        message: "CORE-008 violation: TODO placeholder test — implement before coding"
        example: "def test_foo(): # TODO"
      - type: "assert_true_only"
        regex: "def\\s+test_\\w+.*:.*\\n(\\s+.*\\n)*?\\s+assert\\s+True"
        message: "CORE-008 violation: test asserts only True — low-value test"
        example: "def test_foo(): assert True"

  CORE-011:
    description: "Type hints required on all functions"
    patterns:
      - type: "missing_return_hint"
        regex: "def\\s+\\w+\\s*\\([^)]*\\)\\s*:"
        message: "CORE-011 violation: function missing return type hint"
        example: "def foo(x): return x"
      - type: "missing_param_hint"
        regex: "def\\s+\\w+\\s*\\([^)]*[^:,)]\\s*\\)"
        message: "CORE-011 violation: function parameter missing type hint"
        example: "def foo(x, y): pass"

  CORE-012:
    description: "Docstrings required on all public APIs"
    patterns:
      - type: "missing_docstring_function"
        regex: "def\\s+[a-z]\\w+\\s*\\([^)]*\\)\\s*(?:->.*)?:\\s*\\n(?!\\s*[\"'])"
        message: "CORE-012 violation: public function missing docstring"
        example: "def my_func(): return None  # no docstring"
      - type: "missing_docstring_class"
        regex: "class\\s+\\w+[^:]*:\\s*\\n(?!\\s*[\"'])"
        message: "CORE-012 violation: class missing docstring"
        example: "class MyClass: pass  # no docstring"

  CORE-028:
    description: "File naming: snake_case only"
    patterns:
      - type: "screaming_case"
        regex: "[A-Z]{2,}_[A-Z]{2,}\\.py"
        message: "CORE-028 violation: SCREAMING_CASE filename detected — use snake_case"
        example: "MY_CLASS.py → my_class.py"
      - type: "camel_case_file"
        regex: "[a-z][A-Z]\\w*\\.py"
        message: "CORE-028 violation: camelCase filename detected — use snake_case"
        example: "myClass.py → my_class.py"
      - type: "pascal_case_file"
        regex: "^[A-Z][a-z]+[A-Z]\\w*\\.py"
        message: "CORE-028 violation: PascalCase filename detected — use snake_case"
        example: "MyClass.py → my_class.py"
      - type: "hyphenated_py"
        regex: "[\\w]+-[\\w]+\\.py"
        message: "CORE-028 violation: hyphenated Python filename — use underscores"
        example: "my-class.py → my_class.py"
      - type: "plan_file_too_long"
        regex: "[\\w\\-]{41,}\\.yaml"
        message: "CORE-028 violation: plan filename exceeds 40 characters"
        example: "cortex-very-long-plan-name-that-exceeds.yaml"
      - type: "numeric_prefix"
        regex: "^\\d+[_-][\\w]+\\.py"
        message: "CORE-028 violation: numeric prefix in filename — use descriptive snake_case"
        example: "1_my_module.py → my_module.py"
      - type: "double_underscore_file"
        regex: "__[a-z]+__\\.py(?<!__init__\\.py)(?<!__main__\\.py)"
        message: "CORE-028 violation: dunder filename outside canonical (__init__.py, __main__.py)"
        example: "__helper__.py"
      - type: "uppercase_yaml"
        regex: "[A-Z]+\\.yaml"
        message: "CORE-028 violation: uppercase YAML filename — use snake_case"
        example: "CONFIG.yaml → config.yaml"

  CORE-035:
    description: "Single canonical implementation — no duplicates"
    patterns:
      - type: "duplicate_class"
        regex: "class\\s+(\\w+).*:\\n(?:.*\\n)*?class\\s+\\1"
        message: "CORE-035 violation: duplicate class definition detected in same file"
        example: "class Foo: ...\nclass Foo: ..."
      - type: "shadow_import"
        regex: "from\\s+\\w+\\.\\w+\\s+import\\s+(\\w+).*\\nfrom\\s+\\w+\\.\\w+\\s+import\\s+\\1"
        message: "CORE-035 violation: same name imported from multiple sources"
        example: "from a import Foo\nfrom b import Foo"
      - type: "duplicate_orchestrator"
        regex: "class\\s+\\w+Orchestrator.*:\n"
        message: "CORE-035 check: multiple orchestrators found — verify canonical location"
        example: "class MyOrchestrator: defined in 2+ files"
      - type: "aliased_duplicate"
        regex: "from\\s+cortex\\.\\w+\\.\\w+\\s+import.*as.*\\w+"
        message: "CORE-035 warning: aliased import may indicate duplicate — review"
        example: "from cortex.a.foo import Bar as Baz"
      - type: "re_export_shim"
        regex: "^\\s*from\\s+\\.\\w+\\s+import\\s+\\*"
        message: "CORE-035 warning: wildcard re-export — verify no unintended duplication"
        example: "from .base import *"

ast_checks:
  missing_type_hints:
    enabled: true
    severity: "WARNING"
    check: "all_functions_have_type_hints"

  missing_docstrings:
    enabled: true
    severity: "WARNING"
    check: "all_public_functions_have_docstrings"

  empty_functions:
    enabled: true
    severity: "ERROR"
    check: "no_stub_only_implementations"
