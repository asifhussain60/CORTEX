# -------------------------------------------------------------------------
# DEPENDENCY VALIDATION RULES
# -------------------------------------------------------------------------
validation:
  rules:
    - name: "no_circular_dependencies"
      check: "dependency_graph_is_dag"
      severity: "ERROR"
      
    - name: "all_dependencies_exist"
      check: "all_dependency_names_in_orchestrator_list"
      severity: "ERROR"
      
    - name: "tier_ordering"
      check: "lower_tier_cannot_depend_on_higher_tier"
      severity: "WARNING"
      
    - name: "health_check_defined"
      check: "all_orchestrators_have_health_check"
      severity: "WARNING"

# -------------------------------------------------------------------------
# FALLBACK / DEGRADATION ROUTES
# -------------------------------------------------------------------------
fallback_routes:
  - orchestrator: "RefactoringOrchestrator"
    fallback_to: "TDDOrchestrator"
    condition: "health_check_fails"
    
  - orchestrator: "PlanningOrchestrator"
    fallback_to: "MasterOrchestrator"
    condition: "health_check_fails"
    
  - orchestrator: "DocumentationOrchestrator"
    fallback_to: "MasterOrchestrator"
    condition: "health_check_fails"
