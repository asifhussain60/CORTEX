# =========================================================================
# CORTEX UNIFIED WIRING SPECIFICATION
# =========================================================================
# Authority: CORE-035 (Single Canonical Implementation)
# 
# This is the SINGLE SOURCE OF TRUTH for ALL orchestrator wiring.
# Changes require review. This file is Git-tracked and diff-able.
#
# Structure:
#   orchestrators:
#     core: [...]      # 8 core orchestrators (includes IncrementalTaskDecomposer)
#     domain: [...]    # 6 domain orchestrators
#     support: [...]   # 20 support orchestrators (includes DebuggingOrchestrator, InstrumentationOrchestrator, OrchestratorVisibility)
#   Total: 34 orchestrators + 4 LENS analyzers
# =========================================================================

version: "2.0"
specification_date: "2026-02-04"
git_safe: true

# -------------------------------------------------------------------------
# GLOBAL CONFIGURATION
# -------------------------------------------------------------------------
config:
  lazy_initialization: true
  max_dependency_depth: 5
  allow_circular_dependencies: false
  health_check_timeout_seconds: 5
  health_check_retry_count: 3
  fail_fast_on_wiring_error: true

# -------------------------------------------------------------------------
# LENS ANALYZERS (Phase 7.1 + 8.2)
# -------------------------------------------------------------------------
analyzers:
  - name: "GitHistoryAnalyzer"
    module: "cortex.brain.analysis.git_history_analyzer"
    class: "GitHistoryAnalyzer"
    purpose: "Extract commit history, blame, author patterns"
    phase: "7.1"
    priority: 1

  - name: "ASTAnalyzer"
    module: "cortex.brain.analysis.ast_analyzer"
    class: "ASTAnalyzer"
    purpose: "Extract code structure, functions, classes, imports"
    phase: "7.1"
    priority: 2

  - name: "CommentExtractor"
    module: "cortex.brain.analysis.comment_extractor"
    class: "CommentExtractor"
    purpose: "Extract TODOs, FIXMEs, intent hints from comments"
    phase: "7.1"
    priority: 3

  - name: "SecurityThreatAnalyzer"
    module: "cortex.brain.analysis.security_threat_analyzer"
    class: "SecurityThreatAnalyzer"
    purpose: "Detect CWE vulnerabilities (Code Injection, Deserialization, Command Injection, SQL Injection, Weak Crypto, Path Traversal)"
    phase: "8.2"
    priority: 4
    cwe_coverage:
      - "CWE-94"   # Code Injection
      - "CWE-95"   # Deserialization
      - "CWE-78"   # Command Injection
      - "CWE-89"   # SQL Injection
      - "CWE-327"  # Weak Cryptography
      - "CWE-22"   # Path Traversal

# -------------------------------------------------------------------------
# CORE ORCHESTRATORS (8 - Phase 8.1)
# -------------------------------------------------------------------------
orchestrators:
  core:
    # STAGE 1: Comprehension (LENS Protocol)
    - name: "InteractionOrchestrator"
      module: "cortex.orchestrators.core.interaction_orchestrator"
      class: "InteractionOrchestrator"
      tier: 1
      priority: 10
      dependencies: []
      capabilities:
        - comprehension
        - lens_protocol
        - challenge_generation
        - pattern_enforcement
      health_check: "execute_turn"
      mcp_adapter: "cortex.mcp.adapters.interaction_adapter"
      metadata:
        icon: "💬"
        stages: 4
        intelligence: ["lens", "knowledge"]
      requires_params:
        conversation_protocol:
          type: "ConversationProtocol"
          source: "cortex.brain.core.orchestrator.conversation_protocol"
          lazy_create: true
          init_params:
            orchestrator: null  # Will be set by wiring system
            max_turns: 10
            token_limit: 20000
            adaptive_turn_limit: true
            memoization_enabled: true
      mcp_tools:
        - "cortex_interactive_mode"

    # STAGE 2: Intent Classification
    - name: "IntentRouter"
      module: "cortex.orchestrators.core.intent_router"
      class: "IntentRouter"
      tier: 1
      priority: 20
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - intent_classification
        - confidence_scoring
        - domain_routing
        - fuzzy_matching
      health_check: "classify_intent"
      mcp_adapter: "cortex.mcp.adapters.intent_router_adapter"
      metadata:
        icon: "🎯"
        stages: 3
        intelligence: ["lens"]

    # STAGE 2.3: Complexity Classification (Phase 2)
    - name: "ComplexityClassifier"
      module: "cortex.orchestrators.core.complexity_classifier"
      class: "ComplexityClassifier"
      tier: 1
      priority: 23
      dependencies:
        - "IntentRouter"
      capabilities:
        - complexity_classification
        - orchestrator_routing
        - complexity_analysis
      health_check: "classify_complexity"
      description: "Classifies task complexity (TRIVIAL/SIMPLE/MODERATE/COMPLEX/CRITICAL) and routes to appropriate orchestrator"
      mcp_adapter: "cortex.mcp.adapters.complexity_adapter"
      metadata:
        icon: "📊"
        stages: 3
        intelligence: ["lens"]
      phase: "2"

    # STAGE 2.5: LENS Synthesis & DoR Gate
    - name: "LENSSynthesis"
      module: "cortex.orchestrators.core.lens_synthesis"
      class: "LENSSynthesis"
      tier: 1
      priority: 25
      dependencies:
        - "IntentRouter"
        - "ComplexityClassifier"
      capabilities:
        - dor_generation
        - approval_gate
        - synthesis
      health_check: "synthesize"
      mcp_adapter: "cortex.mcp.adapters.lens_adapter"
      metadata:
        icon: "🔬"
        stages: 4
        intelligence: ["lens", "knowledge", "synthesis"]

    # STAGE 2.7: Governance Enforcement (Phase 8.1)
    - name: "EnforcementOrchestrator"
      module: "cortex.orchestrators.core.enforcement_orchestrator"
      class: "EnforcementOrchestrator"
      tier: 1
      priority: 27
      dependencies:
        - "LENSSynthesis"
      capabilities:
        - governance_enforcement
        - tier0_blocking
        - tier1_escalation
        - parallel_validation
      health_check: "validate_operation"
      mcp_adapter: "cortex.mcp.adapters.enforcement_adapter"
      metadata:
        icon: "🛡️"
        stages: 3
        intelligence: ["lens", "knowledge"]
      requires_params:
        governance_registry:
          type: "GovernanceRegistry"
          source: "cortex.brain.core.governance_registry"
          lazy_create: true
        audit_logger:
          type: "EnhancedAuditLogger"
          source: "cortex.infrastructure.enhanced_audit_logger"
          lazy_create: true

    # STAGE 3: TDD Execution
    - name: "TDDOrchestrator"
      module: "cortex.orchestrators.core.tdd_orchestrator"
      class: "TDDOrchestrator"
      tier: 1
      priority: 30
      dependencies:
        - "InteractionOrchestrator"
        - "IntentRouter"
      capabilities:
        - test_generation
        - tdd_workflow
        - test_execution
      health_check: "generate_tests"
      mcp_adapter: "cortex.mcp.adapters.tdd_adapter"
      metadata:
        icon: "🧪"
        stages: 4
        intelligence: ["lens", "knowledge"]

    # STAGE 3B: Incremental Task Decomposition (NEW)
    - name: "IncrementalTaskDecomposer"
      module: "cortex.orchestrators.planning.incremental_task_decomposer"
      class: "IncrementalTaskDecomposer"
      tier: 1
      priority: 31
      dependencies: []
      capabilities:
        - task_decomposition
        - token_budget_estimation
        - evidence_based_sizing
        - pert_estimation
      health_check: "decompose_into_subtasks"
      description: "Decomposes large tasks into token-budget-constrained subtasks using CAP framework"
      governance:
        - "CORE-008"
        - "CORE-011"
        - "CORE-012"
      version: "1.0"
      metadata:
        icon: "🧩"
        stages: 3
        intelligence: ["lens", "knowledge"]

    # Workflow Management
    - name: "WorkflowOrchestrator"
      module: "cortex.orchestrators.core.workflow_orchestrator"
      class: "WorkflowOrchestrator"
      tier: 1
      priority: 35
      dependencies:
        - "TDDOrchestrator"
      capabilities:
        - workflow_management
        - step_orchestration
      health_check: "execute_workflow"
      mcp_adapter: "cortex.mcp.adapters.workflow_adapter"
      metadata:
        icon: "⚙️"
        stages: 4
        intelligence: ["lens"]

    # STAGE 4: Master Coordination
    - name: "MasterOrchestrator"
      module: "cortex.orchestrators.core.master_orchestrator"
      class: "MasterOrchestrator"
      tier: 1
      priority: 100
      dependencies:
        - "InteractionOrchestrator"
        - "IntentRouter"
        - "LENSSynthesis"
        - "TDDOrchestrator"
      capabilities:
        - coordination
        - stage_management
        - orchestrator_routing
      health_check: "coordinate_operation"
      mcp_adapter: "cortex.mcp.adapters.master_adapter"
      metadata:
        icon: "🧠"
        stages: 4
        intelligence: ["lens", "knowledge", "synthesis"]

    # STAGE 4.5: Implementation Review & Gating (Phase 5)
    - name: "ReviewOrchestrator"
      module: "cortex.orchestrators.core.review_orchestrator"
      class: "ReviewOrchestrator"
      tier: 1
      priority: 99
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - implementation_review
        - plan_verification
        - coherence_verification
        - phase_gating
      health_check: "execute_final_review"
      description: "Holistic implementation verification using git analysis (Phase 5)"
      mcp_adapter: "cortex.mcp.adapters.review_adapter"
      metadata:
        icon: "✅"
        stages: 4
        intelligence: ["lens", "knowledge"]
      phase: "5"

  # -----------------------------------------------------------------------
  # DOMAIN ORCHESTRATORS (8 - was 6, added Phases 3-4)
  # -----------------------------------------------------------------------
  domain:
    # Phase 3: Code-Level Planning
    - name: "CodeLevelPlanner"
      module: "cortex.orchestrators.domain.code_level_planner"
      class: "CodeLevelPlanner"
      tier: 2
      priority: 48
      dependencies:
        - "ComplexityClassifier"
      capabilities:
