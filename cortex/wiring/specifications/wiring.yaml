      mcp_adapter: "cortex.mcp.adapters.refactoring_adapter"
      metadata:
        icon: "♻️"
        stages: 7
        intelligence: ["lens", "knowledge"]

    - name: "PlanningOrchestrator"
      module: "cortex.orchestrators.domain.enhanced_planning_orchestrator"
      class: "EnhancedPlanningOrchestrator"
      tier: 2
      priority: 51
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - plan_generation
        - phase_management
        - milestone_tracking
      health_check: "generate_plan"
      mcp_adapter: "cortex.mcp.adapters.planning_adapter"
      metadata:
        icon: "📋"
        stages: 4
        intelligence: ["lens", "knowledge"]

    - name: "DocumentationOrchestrator"
      module: "cortex.orchestrators.domain.enhanced_documentation_orchestrator"
      class: "EnhancedDocumentationOrchestrator"
      tier: 2
      priority: 52
      dependencies:
        - "MasterOrchestrator"
      capabilities:
        - doc_generation
        - api_documentation
        - changelog_management
      health_check: "generate_documentation"
      mcp_adapter: "cortex.mcp.adapters.documentation_adapter"
      metadata:
        icon: "📝"
        stages: 4
        intelligence: ["lens"]

    - name: "PhaseExecutor"
      module: "cortex.orchestrators.domain.phase_executor"
      class: "PhaseExecutor"
      tier: 2
      priority: 53
      dependencies:
        - "PlanningOrchestrator"
      capabilities:
        - phase_execution
        - checkpoint_management
      health_check: "execute_phase"
      metadata:
        icon: "▶️"
        stages: 4
        intelligence: ["lens"]

    - name: "AutonomousExecutionEngine"
      module: "cortex.orchestrators.domain.autonomous_execution_engine"
      class: "AutonomousExecutionEngine"
      tier: 2
      priority: 54
      dependencies:
        - "MasterOrchestrator"
        - "TDDOrchestrator"
      capabilities:
        - autonomous_execution
        - multi_step_operations
      health_check: "execute_autonomous"
      metadata:
        icon: "🤖"
        stages: 4
        intelligence: ["lens", "knowledge"]

    - name: "ConversationOrchestrator"
      module: "cortex.orchestrators.conversation_orchestrator"
      class: "ConversationOrchestrator"
      tier: 2
      priority: 55
      dependencies:
        - "InteractionOrchestrator"
      capabilities:
        - conversation_management
        - context_tracking
      health_check: "manage_conversation"
      metadata:
        icon: "🤝"
        stages: 4
        intelligence: ["lens", "knowledge"]

  # -----------------------------------------------------------------------
  # SUPPORT ORCHESTRATORS (16 - Added Phase 1, Phase 6, Phase 7 components)
  # -----------------------------------------------------------------------
  support:
    # Phase 1: Event-Driven Communication Backbone
    - name: "OrchestratorEventBus"
      module: "cortex.infrastructure.orchestrator_event_bus"
      class: "OrchestratorEventBus"
      tier: 3
      priority: 1
      dependencies: []
      capabilities:
        - event_publishing
        - event_subscription
        - event_history
        - event_replay
        - dead_letter_management
      health_check: "health_check"
      description: "Event-driven communication backbone enabling decoupled orchestrator communication (Phase 1)"
      mcp_tools: []
      governance:
        - "CORE-008"
        - "CORE-011"
      metadata:
        icon: "📡"
        stages: 1
        intelligence: []
      phase: "1"
      singleton: true

    # Phase 6: InteractionOrchestrator Enhancement
    - name: "InteractionOrchestratorEnhancement"
      module: "cortex.orchestrators.core.interaction_orchestrator_enhancement"
