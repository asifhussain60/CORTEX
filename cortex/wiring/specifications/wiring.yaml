      dependencies:
        - "OrchestratorEventBus"
        - "CodeLevelPlanner"
      capabilities:
        - event_subscription
        - planning_integration
        - multi_layer_coordination
        - dor_enhancement
        - challenge_extension
      health_check: "health_check"
      description: "Enhances InteractionOrchestrator with event subscription and planning integration (Phase 6)"
      metadata:
        icon: "🔌"
        stages: 1
        intelligence: []
      phase: "6"

    - name: "OnboardingOrchestrator"
      module: "cortex.orchestrators.onboarding.orchestrator"
      class: "OnboardingOrchestrator"
      tier: 3
      priority: 60
      dependencies: []
      capabilities:
        - user_onboarding
        - tutorial_guidance
      health_check: "start_onboarding"
      metadata:
        icon: "🎓"
        stages: 3
        intelligence: ["knowledge"]

    - name: "ToolDiscoveryOrchestrator"
      module: "cortex.orchestrators.core.tool_discovery_orchestrator"
