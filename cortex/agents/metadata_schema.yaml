# Agent Metadata Schema
# Version: 1.0
# Authority: Phase 81 S2 - Agent Metadata Standardization
# Purpose: Programmatic agent discovery, capability-based routing, collaboration optimization

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

metadata_schema:
  version: "1.0"
  format: "YAML front-matter in agent markdown files"
  validation: "strict"  # All required fields must be present
  
  fields:
    agent_id:
      type: string
      required: true
      pattern: "^cortex-[a-z0-9-]+$"
      description: "Unique agent identifier (kebab-case)"
      example: "cortex-meta-auditor"
      validation:
        - "Must start with 'cortex-'"
        - "Lowercase letters, numbers, hyphens only"
        - "No trailing hyphens"
    
    version:
      type: string
      required: true
      pattern: "^[0-9]+\\.[0-9]+$"
      description: "Agent implementation version"
      example: "1.0"
      validation:
        - "Format: MAJOR.MINOR"
        - "Increment on breaking changes (MAJOR)"
        - "Increment on feature additions (MINOR)"
    
    status:
      type: string
      required: true
      enum: ["active", "beta", "deprecated", "maintenance"]
      description: "Current agent status"
      example: "active"
      rules:
        - "active: Production-ready, all tests passing"
        - "beta: Functional but under testing"
        - "deprecated: Legacy agent, recommend replacement"
        - "maintenance: Active but in low-priority mode"
    
    layer:
      type: string
      required: true
      enum: ["core", "domain", "support"]
      description: "Agent layer in CORTEX architecture"
      example: "core"
      rules:
        - "core: 8 essential agents (identity layer)"
        - "domain: 6 domain-specific agents"
        - "support: 14+ support/specialized agents"
    
    capabilities:
      type: array[string]
      required: true
      min_length: 1
      max_length: 10
      description: "Capabilities provided by this agent"
      example:
        - "recursive_governance_validation"
        - "enforcement_gap_detection"
        - "mcp_first_compliance_verification"
      rules:
        - "Listed in snake_case"
        - "Match MCP tool names where applicable"
        - "Primary capability should be first"
        - "Max 10 capabilities per agent"
    
    modes_served:
      type: array[string]
      required: true
      min_length: 1
      max_length: 8
      description: "HEXA-MODE(+) modes this agent handles"
      example: ["META-AUDIT", "PLAN"]
      enum:
        - "PRE-FLIGHT"
        - "AUDIT"
        - "META-AUDIT"
        - "DIGEST"
        - "QUERY"
        - "PLAN"
        - "DESIGN"
        - "INTERACTIVE"
      rules:
        - "One agent can serve multiple modes"
        - "Each mode should have at least one agent"
        - "Primary mode should be first"
    
    mcp_tools:
      type: array[string]
      required: true
      min_length: 1
      max_length: 6
      description: "MCP tools exposed by this agent"
      example:
        - "cortex_meta_audit"
        - "cortex_validate_governance_health"
        - "cortex_enforcement_gap_detection"
      rules:
        - "All tools must be registered in MCP server"
        - "Tool names in snake_case"
        - "Primary tool should be first"
        - "Define input/output schemas in agent spec"
    
    collaborators:
      type: array[string]
      required: false
      description: "Agent IDs this agent collaborates with"
      example:
        - "cortex-auditor"
        - "cortex-holistic-validator"
      rules:
        - "List primary collaborators only (2-4 typical)"
        - "Bidirectional relationships assumed"
        - "Used for multi-agent workflow discovery"
    
    priority:
      type: string
      required: true
      enum: ["P0", "P1", "P2", "P3"]
      description: "Agent priority for resource allocation"
      example: "P0"
      rules:
        - "P0: Critical (enforcement, validation)"
        - "P1: High priority (auditing, planning)"
        - "P2: Medium priority (analysis, support)"
        - "P3: Low priority (cosmetic, optional)"
    
    token_cost_estimate:
      type: integer
      required: true
      min_value: 500
      max_value: 20000
      description: "Estimated tokens to load/initialize agent"
      example: 3000
      rules:
        - "Agent spec size + MCP tool definitions"
        - "Used for session budget planning"
        - "Update when agent spec expands >20%"
    
    created_date:
      type: string
      required: false
      format: "ISO8601"
      description: "Date agent was created"
      example: "2026-02-11"
    
    last_updated:
      type: string
      required: false
      format: "ISO8601"
      description: "Date agent was last updated"
      example: "2026-02-11"
    
    maintainer:
      type: string
      required: false
      description: "Person/team maintaining this agent"
      example: "Asif Hussain"
    
    documentation_url:
      type: string
      required: false
      format: "URI"
      description: "URL to full agent documentation"
      example: ".github/agents/core/cortex-meta-auditor.md"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  global_rules:
    - "All required fields must be present"
    - "Field values must match type and enum constraints"
    - "No extra fields allowed (strict schema)"
    - "YAML must be valid syntax"
  
  cross_field_rules:
    - "If status='deprecated', include migration_path field"
    - "If collaborators list includes agent, verify bidirectional"
    - "If modes_served includes 'PLAN', must be compatible with phase management"
    - "token_cost_estimate should be >= 1000 for core agents"
  
  consistency_rules:
    - "Each agent_id must be unique in .github/agents/core/"
    - "Each mcp_tool must be registered once and only once"
    - "Each mode must be served by at least one agent (P0-check)"
    - "Collaborators must reference existing agent_ids"

# ============================================================================
# EXAMPLE METADATA BLOCKS
# ============================================================================

example_core_agent: |
  ---
  agent_id: cortex-meta-auditor
  version: 1.0
  status: active
  layer: core
  capabilities:
    - recursive_governance_validation
    - enforcement_gap_detection
    - mcp_first_compliance_verification
    - governance_health_scoring
  modes_served:
    - META-AUDIT
  mcp_tools:
    - cortex_meta_audit
    - cortex_validate_governance_health
    - cortex_enforcement_gap_detection
  collaborators:
    - cortex-auditor
    - cortex-holistic-validator
  priority: P0
  token_cost_estimate: 3000
  created_date: "2026-02-11"
  last_updated: "2026-02-11"
  maintainer: "Asif Hussain"
  ---

example_domain_agent: |
  ---
  agent_id: cortex-enterprise-validator
  version: 1.0
  status: beta
  layer: domain
  capabilities:
    - enterprise_architecture_analysis
    - scalability_validation
    - performance_gate_checking
  modes_served:
    - AUDIT
    - DESIGN
  mcp_tools:
    - cortex_enterprise_audit
    - cortex_scalability_check
  collaborators:
    - cortex-auditor
    - cortex-designer
  priority: P1
  token_cost_estimate: 2500
  created_date: "2026-02-10"
  last_updated: "2026-02-11"
  maintainer: "Architecture Team"
  ---

# ============================================================================
# BACKWARD COMPATIBILITY
# ============================================================================

compatibility:
  minimum_version: "1.0"
  
  breaking_changes: []
  
  migration_path: |
    Agents without metadata will still work (graceful degradation).
    
    Migration Steps:
    1. Add YAML front-matter to agent markdown file
    2. Run: python cortex/agents/metadata_validator.py --check-all
    3. Fix any validation errors
    4. Commit with message: "Agent metadata standardization: {agent_id}"
  
  grace_period: "Phase 81 S2 completion (1.5 days)"

# ============================================================================
# TOOLING
# ============================================================================

tooling:
  validation_script: "cortex/agents/metadata_validator.py"
  validator_commands:
    - "validate_agent_metadata.py --file agents/core/cortex-*.md"
    - "validate_agent_metadata.py --check-all"
    - "validate_agent_metadata.py --schema-only"
  
  discovery_script: "cortex/agents/metadata_parser.py"
  discovery_methods:
    - "get_agents_by_capability(capability: str) -> List[Agent]"
    - "get_agents_by_mode(mode: str) -> List[Agent]"
    - "get_agents_by_layer(layer: str) -> List[Agent]"
    - "get_agent_collaborators(agent_id: str) -> List[str]"
  
  performance_targets:
    - "Metadata parsing: <50ms per agent"
    - "Capability lookup: <50ms"
    - "Mode discovery: <100ms for all agents"
    - "Cache invalidation: <10ms on file change"

# ============================================================================
# AUDIT REQUIREMENTS
# ============================================================================

audit:
  P0_checks:
    - "All core agents have metadata"
    - "All modes have coverage (CORE-049)"
    - "No circular dependencies in collaborators"
  
  P1_checks:
    - "metadata version matches implementation"
    - "token_cost_estimate within ±20% of actual"
    - "capabilities are used (not orphaned)"
  
  compliance:
    - "CORE-011: Type hints in metadata_parser.py"
    - "CORE-012: Google-style docstrings"
    - "CORE-028: Kebab-case agent_ids"
    - "CORE-035: No duplicate agents/capabilities"
