<!DOCTYPE html>
<html lang="en" x-data="dashboardApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - CORTEX LENS Dashboard</title>
    
    <!-- Tailwind CSS (local vendor) -->
    <link rel="stylesheet" href="/static/vendor/tailwind-3.4.0.min.css">
    
    {% block head %}{% endblock %}
    
    <style>
        /* Custom styles for CORTEX LENS Dashboard */
        .tab-active {
            @apply bg-blue-500 text-white;
        }
        .tab-inactive {
            @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
        }
        .overlay-badge {
            @apply inline-flex items-center px-2 py-1 text-xs font-medium rounded-full;
        }
        .overlay-security-high {
            @apply bg-red-100 text-red-800;
        }
        .overlay-security-medium {
            @apply bg-orange-100 text-orange-800;
        }
        .overlay-security-low {
            @apply bg-yellow-100 text-yellow-800;
        }
        .overlay-performance {
            @apply bg-purple-100 text-purple-800;
        }
        .overlay-compliance {
            @apply bg-green-100 text-green-800;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold text-gray-900">🧠 CORTEX LENS</h1>
                    <span class="text-sm text-gray-500">{{ repository_name }}</span>
                </div>
                
                <!-- Overlay Toggles -->
                <div class="flex space-x-2">
                    <button 
                        @click="toggleOverlay('security')"
                        :class="overlays.security ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-700'"
                        class="px-3 py-1 text-sm rounded-md hover:opacity-80 transition"
                    >
                        🔒 Security
                    </button>
                    <button 
                        @click="toggleOverlay('performance')"
                        :class="overlays.performance ? 'bg-purple-500 text-white' : 'bg-gray-200 text-gray-700'"
                        class="px-3 py-1 text-sm rounded-md hover:opacity-80 transition"
                    >
                        ⚡ Performance
                    </button>
                    <button 
                        @click="toggleOverlay('compliance')"
                        :class="overlays.compliance ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-700'"
                        class="px-3 py-1 text-sm rounded-md hover:opacity-80 transition"
                    >
                        ✓ Compliance
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Tabs Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex space-x-1 overflow-x-auto py-2">
                {% for tab in tabs %}
                <button
                    @click="activeTab = '{{ tab.id }}'"
                    :class="activeTab === '{{ tab.id }}' ? 'tab-active' : 'tab-inactive'"
                    class="px-4 py-2 text-sm font-medium rounded-md whitespace-nowrap transition"
                >
                    {{ tab.icon }} {{ tab.label }}
                </button>
                {% endfor %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-sm text-gray-500 text-center">
                Generated by <strong>CORTEX LENS Dashboard</strong> v1.0.0 | 
                Phase 14: Visual Intelligence
            </p>
        </div>
    </footer>

    <!-- Alpine.js (local vendor) -->
    <script src="/static/vendor/alpine-3.13.3.min.js" defer></script>
    
    <!-- Dashboard App Logic -->
    <script>
        function dashboardApp() {
            return {
                activeTab: '{{ tabs[0].id if tabs else "overview" }}',
                overlays: {
                    security: false,
                    performance: false,
                    compliance: false
                },
                toggleOverlay(overlay) {
                    this.overlays[overlay] = !this.overlays[overlay];
                    console.log(`Overlay ${overlay}:`, this.overlays[overlay]);
                }
            };
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
