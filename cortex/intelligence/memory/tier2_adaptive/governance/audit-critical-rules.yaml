context: "audit-critical"
tier: "tier2"
compliance: "required"

rules:
  - id: "AUD-001"
    name: "Immutable Logs"
    description: "Audit logs cannot be deleted or modified"
    severity: "critical"
    
  - id: "AUD-002"
    name: "Complete Attribution"
    description: "All actions must identify user, timestamp, resource, action"
    severity: "critical"
    
  - id: "AUD-003"
    name: "Retention Policy"
    description: "Audit logs retained for 7 years minimum"
    severity: "critical"
    
  - id: "AUD-004"
    name: "Signed Entries"
    description: "Audit log entries cryptographically signed"
    severity: "high"
    
  - id: "AUD-005"
    name: "Regular Review"
    description: "Audit logs reviewed quarterly by compliance"
    severity: "high"

status: "DEFINED"
