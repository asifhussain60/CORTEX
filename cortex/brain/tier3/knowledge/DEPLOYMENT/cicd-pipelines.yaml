# ==============================================================================
# QUALITY GATES
# ==============================================================================

quality_gates:
  description: "Automated checks that must pass before proceeding to next stage"
  
  gates:
    - name: "Code Quality Gate"
      stage: "Test"
      checks:
        - "Linting passes (no errors)"
        - "Code coverage > 80%"
        - "No code smells (SonarQube Quality Gate)"
      action_on_failure: "Fail build, prevent merge"
    
    - name: "Security Gate"
      stage: "Test/Build"
      checks:
        - "No critical/high vulnerabilities in dependencies"
        - "SAST finds no critical issues"
        - "No secrets in code"
      action_on_failure: "Fail build immediately"
    
    - name: "Performance Gate"
      stage: "Deploy (Staging)"
      checks:
        - "API response time < 200ms (p95)"
        - "No memory leaks detected"
        - "Load test passes (1,000 RPS)"
      action_on_failure: "Block production deployment"
    
    - name: "Production Readiness Gate"
      stage: "Deploy (Production)"
      checks:
        - "All smoke tests pass"
        - "Monitoring dashboards configured"
        - "Rollback tested"
        - "Runbook documented"
      action_on_failure: "Manual approval required"

# ==============================================================================
# CORTEX INTEGRATION
# ==============================================================================

cortex_integration:
  description: "How CORTEX uses this knowledge"
  use_cases:
    - "Generate CI/CD pipeline configurations from project structure"
    - "Recommend deployment strategies based on application type"
    - "Validate pipeline security (secrets management, scanning)"
    - "Optimize pipeline performance (caching, parallelization)"
    - "Detect CI/CD anti-patterns"
  
  detection_heuristics:
    - pattern: "Manual deployment"
      detection: "No CI/CD config files in repository"
      recommendation: "Generate GitHub Actions or GitLab CI pipeline"
    
    - pattern: "Slow pipeline"
      detection: "Pipeline duration > 30 minutes"
      recommendation: "Add caching, parallelize tests, optimize Docker builds"
    
    - pattern: "No security scanning"
      detection: "No SAST, dependency scanning, or container scanning steps"
      recommendation: "Add Snyk, Trivy, or Bandit to pipeline"
    
    - pattern: "Flaky tests"
      detection: "Same test intermittently fails"
      recommendation: "Increase test isolation, use explicit waits, fix race conditions"
