metadata:
  domain: devops
  category: cicd_pipelines
  version: "1.0"
  tags:
    - ci/cd
    - continuous-integration
    - continuous-deployment
    - automation
    - pipelines
    - devops
  learning_objectives:
    - Understand CI/CD pipeline stages and best practices
    - Implement automated testing and deployment workflows
    - Design secure, fast, and reliable pipelines
    - Apply environment-specific deployment strategies
    - Monitor and optimize pipeline performance

# ==============================================================================
# CI/CD PIPELINE OVERVIEW
# ==============================================================================

cicd_overview:
  definition: "Continuous Integration/Continuous Deployment automates software delivery from code commit to production"
  
  benefits:
    - name: "Faster Time to Market"
      description: "Automated pipelines reduce deployment time from weeks to minutes"
      impact: "60-90% reduction in release cycle time"
    
    - name: "Reduced Risk"
      description: "Small, frequent releases easier to troubleshoot than big-bang deployments"
      impact: "40-60% reduction in production incidents"
    
    - name: "Improved Quality"
      description: "Automated testing catches bugs before production"
      impact: "50-80% reduction in bugs reaching production"
    
    - name: "Consistent Deployments"
      description: "Same automated process every time eliminates human error"
      impact: "95% deployment success rate"
    
    - name: "Rapid Feedback"
      description: "Developers get test results within minutes"
      impact: "10x faster feedback loop"
  
  continuous_integration:
    definition: "Automatically build and test code changes on every commit"
    key_practices:
      - "Commit to trunk/main frequently (multiple times per day)"
      - "Every commit triggers automated build"
      - "Run full test suite on every build"
      - "Fix broken builds immediately (< 10 minutes)"
      - "Keep build time fast (< 10 minutes ideal)"
  
  continuous_delivery:
    definition: "Code is always in a deployable state, manual approval for production"
    characteristics:
      - "Automated deployment to staging/QA environments"
      - "Manual gate before production deployment"
      - "Release frequency: weeks to days"
  
  continuous_deployment:
    definition: "Every passing build automatically deploys to production"
    characteristics:
      - "No manual intervention"
      - "Feature flags control feature rollout"
      - "Release frequency: multiple times per day"

# ==============================================================================
# PIPELINE STAGES
# ==============================================================================

pipeline_stages:
  - stage: "Source"
    description: "Trigger pipeline on code changes"
    duration: "< 10 seconds"
    activities:
      - "Detect commit/PR in version control (Git)"
      - "Clone repository"
      - "Checkout specific branch/commit"
    tools:
      - "GitHub Actions (on: push, on: pull_request)"
      - "GitLab CI (on: [push, merge_request])"
      - "Jenkins (SCM polling, webhooks)"
      - "Azure Pipelines (trigger: branches)"
    best_practices:
      - "Use webhooks for instant triggering (not polling)"
      - "Shallow clone to reduce clone time"
      - "Cache dependencies between runs"
    example_github_actions: |
      name: CI Pipeline
      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]
  
  - stage: "Build"
    description: "Compile code, resolve dependencies, create artifacts"
    duration: "2-5 minutes (target)"
    activities:
      - "Install dependencies (npm install, pip install, nuget restore)"
      - "Compile code (if compiled language)"
      - "Run linters and static analysis"
      - "Generate build artifacts (Docker image, JAR, NPM package)"
    tools:
      - "Docker (multi-stage builds for optimization)"
      - "Maven/Gradle (Java)"
      - "npm/yarn (JavaScript)"
      - "pip/poetry (Python)"
      - "MSBuild/.NET CLI (C#)"
    best_practices:
      - "Use dependency caching to speed up builds"
      - "Run linters in build stage to fail fast"
      - "Use multi-stage Docker builds to reduce image size"
      - "Parallelize compilation when possible"
      - "Version artifacts with Git SHA or semantic version"
    example_docker_multistage: |
      # Build stage
      FROM node:18 AS build
      WORKDIR /app
      COPY package*.json ./
      RUN npm ci
      COPY . .
      RUN npm run build
      
      # Production stage
      FROM node:18-alpine
      WORKDIR /app
      COPY --from=build /app/dist ./dist
      COPY --from=build /app/package*.json ./
      RUN npm ci --production
      CMD ["node", "dist/server.js"]
  
  - stage: "Test"
    description: "Run automated tests to verify code quality"
    duration: "5-15 minutes (target)"
    test_levels:
      - name: "Unit Tests"
        description: "Test individual functions/methods in isolation"
        coverage_target: "80-90%"
        duration: "< 2 minutes"
        tools: ["pytest", "JUnit", "Jest", "xUnit"]
      
      - name: "Integration Tests"
        description: "Test interactions between components/services"
        coverage_target: "60-80%"
        duration: "3-8 minutes"
        tools: ["pytest + TestContainers", "Testcontainers", "Postman/Newman"]
      
      - name: "End-to-End Tests"
        description: "Test critical user journeys through UI"
        coverage_target: "Critical paths only"
        duration: "5-15 minutes"
        tools: ["Playwright", "Cypress", "Selenium"]
      
      - name: "Security Scans"
        description: "Scan for vulnerabilities in dependencies and code"
        required: true
        tools: ["Snyk", "OWASP Dependency-Check", "Bandit", "Trivy"]
      
      - name: "Code Quality"
        description: "Static analysis for code smells, complexity"
        tools: ["SonarQube", "CodeClimate", "ESLint", "Pylint"]
    
    best_practices:
      - "Run unit tests first (fail fast)"
      - "Parallelize test execution when possible"
      - "Use test containers for integration tests (Docker-based dependencies)"
      - "Run security scans on every build"
      - "Fail build on critical/high vulnerabilities"
      - "Cache test data and fixtures"
    
    example_pytest_parallel: |
      # pytest with parallel execution
      pytest tests/ -n auto --cov=src --cov-report=xml --maxfail=3
    
    example_github_actions_test: |
      - name: Run Tests
        run: |
          pytest tests/ --cov=src --cov-report=xml
          
      - name: Security Scan
        uses: snyk/actions/python@master
        with:
          command: test
          args: --severity-threshold=high
  
  - stage: "Artifact Storage"
    description: "Store build artifacts for deployment"
    duration: "< 1 minute"
    activities:
      - "Tag artifacts with version/Git SHA"
      - "Upload to artifact registry"
      - "Generate artifact manifest"
    artifact_types:
      - name: "Docker Images"
        registries: ["Docker Hub", "Amazon ECR", "Azure ACR", "Google GCR", "GitHub Container Registry"]
        naming: "myapp:1.2.3 or myapp:git-abc123"
      
      - name: "Application Packages"
        registries: ["NPM Registry", "PyPI", "NuGet Gallery", "Maven Central"]
        naming: "Semantic versioning (1.2.3)"
      
      - name: "Build Artifacts"
        registries: ["GitHub Releases", "Artifactory", "Nexus"]
        types: ["ZIP/TAR archives", "JAR/WAR files", "EXE installers"]
    
    best_practices:
      - "Use immutable tags (Git SHA) for traceability"
      - "Tag with semantic version for releases"
      - "Scan images for vulnerabilities before storage"
      - "Use multi-region replication for high availability"
      - "Implement artifact retention policies (delete old artifacts)"
    
    example_docker_push: |
      docker build -t myapp:${{ github.sha }} .
      docker tag myapp:${{ github.sha }} myapp:latest
      docker push myapp:${{ github.sha }}
      docker push myapp:latest
  
  - stage: "Deploy"
    description: "Deploy artifacts to target environments"
    duration: "2-10 minutes per environment"
    deployment_strategies:
      - name: "Blue-Green Deployment"
        description: "Run two identical environments, switch traffic instantly"
        use_case: "Zero-downtime deployments, instant rollback"
        steps:
          - "Deploy new version to 'green' environment"
          - "Run smoke tests on green"
          - "Switch load balancer from blue to green"
          - "Keep blue for rollback"
        tools: ["AWS Elastic Beanstalk", "Kubernetes", "Azure App Service slots"]
        pros: ["Zero downtime", "Instant rollback"]
        cons: ["2x infrastructure cost", "Database migrations tricky"]
      
      - name: "Rolling Deployment"
        description: "Update instances one at a time"
        use_case: "Limited infrastructure, gradual rollout"
        steps:
          - "Update 1 instance at a time"
          - "Wait for health check to pass"
          - "Continue to next instance"
        tools: ["Kubernetes RollingUpdate", "AWS CodeDeploy", "Ansible"]
        pros: ["No extra infrastructure", "Gradual rollout"]
        cons: ["Slower rollout", "Mixed versions during deployment"]
      
      - name: "Canary Deployment"
        description: "Route small % of traffic to new version"
        use_case: "High-risk changes, gradual validation"
        steps:
          - "Deploy new version to 5% of instances"
          - "Monitor metrics (error rate, latency)"
          - "Gradually increase to 10%, 25%, 50%, 100%"
          - "Rollback if metrics degrade"
        tools: ["Istio", "AWS App Mesh", "Flagger", "Spinnaker"]
        pros: ["Low-risk deployments", "Real user validation"]
        cons: ["Complex setup", "Requires monitoring"]
    
    environments:
      - name: "Development"
        purpose: "Developer testing, rapid iteration"
        deployment_frequency: "Multiple times per day"
        automation: "Fully automated on every commit to develop branch"
        testing: "Smoke tests only"
      
      - name: "Staging/QA"
        purpose: "QA testing, production-like environment"
        deployment_frequency: "Daily or per feature"
        automation: "Automated deployment from main branch"
        testing: "Full regression suite + manual QA"
        characteristics:
          - "Production-like data (anonymized)"
          - "Same infrastructure as production"
          - "Integration with external services (test endpoints)"
      
      - name: "Production"
        purpose: "Live customer-facing environment"
        deployment_frequency: "Weekly (CD) or multiple times per day (CD)"
        automation: "Automated with approval gate (CD) or fully automated (CD)"
        testing: "Smoke tests, canary analysis, monitoring"
        requirements:
          - "Manual approval (Continuous Delivery)"
          - "OR feature flags + automated rollback (Continuous Deployment)"
          - "Comprehensive monitoring and alerting"
          - "Rollback plan tested"
    
    best_practices:
      - "Use infrastructure-as-code (Terraform, CloudFormation)"
      - "Implement health checks and readiness probes"
      - "Run smoke tests after deployment"
      - "Use deployment slots/environments for zero-downtime"
      - "Always have a rollback plan"
      - "Monitor key metrics during and after deployment"
    
    example_kubernetes_deployment: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: myapp
      spec:
        replicas: 3
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
        template:
          spec:
            containers:
            - name: myapp
              image: myapp:1.2.3
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /ready
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 5
  
  - stage: "Monitor & Validate"
    description: "Monitor deployment success and application health"
    duration: "Continuous"
    activities:
      - "Track deployment metrics (success rate, duration)"
      - "Monitor application health (error rate, latency, throughput)"
      - "Alert on anomalies"
      - "Automated rollback on failure"
    key_metrics:
      - name: "Deployment Success Rate"
        target: "> 95%"
        description: "% of deployments that succeed without rollback"
      
      - name: "Deployment Frequency"
        target: "Multiple times per day (elite performers)"
        tiers:
          elite: "Multiple times per day"
          high: "Once per day to once per week"
          medium: "Once per week to once per month"
          low: "Once per month to once per 6 months"
      
      - name: "Lead Time for Changes"
        target: "< 1 hour (elite performers)"
        description: "Time from commit to production"
      
      - name: "Mean Time to Recovery (MTTR)"
        target: "< 1 hour"
        description: "Time to restore service after incident"
      
      - name: "Change Failure Rate"
        target: "< 5%"
        description: "% of deployments causing production incidents"
    
    monitoring_tools:
      - "Prometheus + Grafana (metrics)"
      - "ELK Stack (logs)"
      - "Jaeger/Zipkin (distributed tracing)"
      - "Datadog/New Relic/Dynatrace (APM)"
      - "PagerDuty/Opsgenie (alerting)"
    
    automated_rollback:
      description: "Automatically rollback on deployment failures"
      triggers:
        - "Error rate increases > 2x baseline"
        - "Latency increases > 50% baseline"
        - "Health check failures"
        - "Failed smoke tests"
      implementation:
        - "Kubernetes: automated rollback on failed readiness probes"
        - "Spinnaker: automated canary analysis"
        - "AWS CodeDeploy: automatic rollback on CloudWatch alarms"

# ==============================================================================
# PIPELINE PATTERNS
# ==============================================================================

pipeline_patterns:
  - name: "Trunk-Based Development"
    description: "All developers commit to main/trunk frequently, short-lived feature branches (< 1 day)"
    characteristics:
      - "Feature flags hide incomplete features"
      - "CI runs on every commit to main"
      - "Continuous deployment to production"
    benefits:
      - "Reduces merge conflicts"
      - "Faster feedback"
      - "Encourages small incremental changes"
    best_for: "High-performing teams, microservices"
    example_branch_strategy: |
      main (always deployable)
        ├── feature-branch-1 (< 1 day, merge frequently)
        └── feature-branch-2 (< 1 day, merge frequently)
  
  - name: "GitFlow"
    description: "Separate branches for develop, release, hotfixes"
    characteristics:
      - "develop branch for ongoing work"
      - "release branches for QA"
      - "hotfix branches for production fixes"
      - "main/master for production-ready code"
    benefits:
      - "Clear separation of environments"
      - "Supports scheduled releases"
    challenges:
      - "Slower feedback loop"
      - "Merge conflicts on long-lived branches"
    best_for: "Scheduled releases, monolithic applications"
    example_branch_strategy: |
      main (production)
      └── release/1.2.0 (QA testing)
          └── develop (ongoing work)
              ├── feature/login
              └── feature/dashboard
  
  - name: "Pull Request Workflows"
    description: "All changes go through PR review before merging"
    characteristics:
      - "Branch protection on main (no direct commits)"
      - "CI runs on every PR"
      - "Require approvals (1-2 reviewers)"
      - "Automated checks must pass"
    benefits:
      - "Code quality through peer review"
      - "Knowledge sharing"
      - "Catches bugs early"
    best_practices:
      - "Keep PRs small (< 400 lines changed)"
      - "Review within 24 hours"
      - "Automate formatting/linting checks"
    example_github_branch_protection: |
      # .github/workflows/pr.yml
      on: pull_request
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v3
            - name: Run tests
              run: pytest
            - name: Lint
              run: flake8 src/

# ==============================================================================
# PIPELINE SECURITY
# ==============================================================================

pipeline_security:
  secrets_management:
    description: "Securely store and inject secrets (API keys, passwords, certificates)"
    anti_patterns:
      - "Hardcoding secrets in code"
      - "Committing .env files to Git"
      - "Storing secrets in CI/CD configuration files"
    best_practices:
      - "Use secret management tools (GitHub Secrets, AWS Secrets Manager, Azure Key Vault, HashiCorp Vault)"
      - "Inject secrets as environment variables at runtime"
      - "Rotate secrets regularly"
      - "Use least-privilege access (secrets scoped to specific environments)"
      - "Never log secrets"
    example_github_secrets: |
      - name: Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          ./deploy.sh
  
  dependency_scanning:
    description: "Scan dependencies for known vulnerabilities"
    tools:
      - name: "Snyk"
        languages: ["JavaScript", "Python", "Java", "Go", ".NET", "Ruby", "PHP"]
        features: ["Dependency scanning", "License compliance", "Container scanning", "IaC scanning"]
      
      - name: "OWASP Dependency-Check"
        languages: ["Java", ".NET", "JavaScript", "Python"]
        type: "Open-source"
      
      - name: "GitHub Dependabot"
        features: ["Automated PRs for dependency updates", "Security alerts"]
      
      - name: "Trivy"
        focus: "Container image scanning"
        features: ["OS package vulnerabilities", "Application dependencies", "Misconfigurations"]
    
    best_practices:
      - "Scan on every build"
      - "Fail build on critical/high vulnerabilities"
      - "Automate dependency updates (Dependabot, Renovate)"
      - "Use lock files (package-lock.json, Pipfile.lock, go.sum)"
  
  static_application_security_testing:
    acronym: "SAST"
    description: "Analyze source code for security vulnerabilities"
    tools:
      - "Bandit (Python)"
      - "Brakeman (Ruby on Rails)"
      - "SonarQube (multi-language)"
      - "Semgrep (multi-language)"
      - "Checkmarx, Veracode (commercial)"
    detects:
      - "SQL injection vulnerabilities"
      - "XSS vulnerabilities"
      - "Hardcoded secrets"
      - "Insecure deserialization"
      - "Use of insecure functions"
    best_practices:
      - "Run SAST in build stage"
      - "Configure to fail on high-severity issues"
      - "Tune rules to reduce false positives"
  
  container_image_scanning:
    description: "Scan Docker images for vulnerabilities and misconfigurations"
    tools: ["Trivy", "Clair", "Anchore", "Snyk Container"]
    checks:
      - "OS package vulnerabilities (CVEs)"
      - "Application dependency vulnerabilities"
      - "Exposed secrets in image layers"
      - "Dockerfile best practices"
    best_practices:
      - "Scan images before pushing to registry"
      - "Use minimal base images (Alpine, Distroless)"
      - "Don't run containers as root"
      - "Regularly rebuild images with updated base layers"
    example_trivy_scan: |
      - name: Scan Docker Image
        run: |
          docker build -t myapp:${{ github.sha }} .
          trivy image --exit-code 1 --severity CRITICAL,HIGH myapp:${{ github.sha }}

# ==============================================================================
# PIPELINE OPTIMIZATION
# ==============================================================================

pipeline_optimization:
  caching:
    description: "Reuse dependencies and build artifacts between runs"
    targets:
      - name: "Dependency Caching"
        examples:
          - "npm/yarn cache (node_modules)"
          - "pip cache (~/.cache/pip)"
          - "Maven/Gradle cache (~/.m2, ~/.gradle)"
        impact: "50-80% faster dependency installation"
        implementation: |
          # GitHub Actions
          - uses: actions/cache@v3
            with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
              restore-keys: |
                ${{ runner.os }}-pip-
      
      - name: "Docker Layer Caching"
        description: "Reuse unchanged Docker layers"
        best_practices:
          - "Order Dockerfile commands from least to most frequently changing"
          - "COPY package files before source code"
        impact: "60-90% faster Docker builds"
        example: |
          # Good: package.json changes less frequently than source code
          COPY package*.json ./
          RUN npm ci
          COPY . .
      
      - name: "Build Artifact Caching"
        examples:
          - "Compiled binaries"
          - "Test results (run only changed tests)"
        tools: ["Bazel", "Nx", "Turborepo"]
  
  parallelization:
    description: "Run independent jobs concurrently"
    strategies:
      - name: "Test Parallelization"
        description: "Split tests across multiple runners"
        tools: ["pytest -n auto", "Jest --maxWorkers", "Playwright sharding"]
        impact: "50-80% faster test execution"
        example_github_matrix: |
          jobs:
            test:
              strategy:
                matrix:
                  shard: [1, 2, 3, 4]
              steps:
                - name: Run tests
                  run: pytest --shard ${{ matrix.shard }}/4
      
      - name: "Build Parallelization"
        description: "Build multiple modules/packages concurrently"
        tools: ["Gradle parallel builds", "Bazel", "Nx"]
        impact: "30-60% faster builds"
      
      - name: "Environment Parallelization"
        description: "Deploy to multiple environments simultaneously"
        example: "Deploy to dev-us-east-1, dev-eu-west-1 in parallel"
  
  pipeline_as_code:
    description: "Define pipelines in version-controlled YAML/Groovy files"
    benefits:
      - "Pipelines versioned with application code"
      - "Code review for pipeline changes"
      - "Rollback pipeline changes"
      - "Reusable pipeline templates"
    examples:
      - name: "GitHub Actions"
        file: ".github/workflows/ci.yml"
      
      - name: "GitLab CI"
        file: ".gitlab-ci.yml"
      
      - name: "Jenkins"
        file: "Jenkinsfile"
      
      - name: "Azure Pipelines"
        file: "azure-pipelines.yml"

# ==============================================================================
# ANTI-PATTERNS
# ==============================================================================

anti_patterns:
  - name: "Manual Deployments"
    description: "Deploying via manual steps (SSH, FTP, manual scripts)"
    problems:
      - "Human error"
      - "Inconsistent deployments"
      - "No audit trail"
      - "Not reproducible"
    solution: "Automate all deployments through CI/CD pipeline"
  
  - name: "Long-Running Pipelines"
    description: "Pipelines taking > 30 minutes"
    problems:
      - "Slow feedback loop"
      - "Developers move to next task while waiting"
      - "Context switching penalty"
    solution:
      - "Optimize build and test execution"
      - "Parallelize tests"
      - "Use caching aggressively"
      - "Consider splitting into separate pipelines (fast vs slow tests)"
  
  - name: "Flaky Tests"
    description: "Tests that intermittently fail without code changes"
    problems:
      - "Developers lose trust in tests"
      - "CI becomes unreliable"
      - "Slows down deployment"
    causes:
      - "Race conditions"
      - "External dependencies (network, time)"
      - "Test order dependencies"
      - "Insufficient waits in UI tests"
    solution:
      - "Fix or quarantine flaky tests immediately"
      - "Use retry mechanisms as temporary fix only"
      - "Increase test isolation"
      - "Use explicit waits in UI tests (not sleep)"
  
  - name: "Skipping Tests to Ship Faster"
    description: "Disabling tests or ignoring failures to meet deadlines"
    problems:
      - "Bugs reach production"
      - "Technical debt accumulates"
      - "Tests become permanently disabled"
    solution:
      - "Never skip tests"
      - "If tests are too slow, optimize them"
      - "If tests are flaky, fix them"
  
  - name: "No Rollback Plan"
    description: "Deploying without ability to quickly revert"
    problems:
      - "Extended outages when deployments fail"
      - "Panic-driven fixes to production"
    solution:
      - "Test rollback procedures regularly"
      - "Use blue-green or canary deployments"
      - "Keep previous version readily available"
  
  - name: "Secrets in Code or Logs"
    description: "Hardcoding secrets or logging them"
    problems:
      - "Secrets in Git history"
      - "Secrets in CI/CD logs"
      - "Security breach"
    solution:
      - "Use secret management tools"
      - "Scan code for secrets (git-secrets, truffleHog)"
      - "Never log secrets"
  
  - name: "Deploying from Developer Machines"
    description: "Deployments triggered from local laptops"
    problems:
      - "Works on my machine"
      - "No audit trail"
      - "Inconsistent environment"
    solution: "All deployments from CI/CD system"

# ==============================================================================
# BEST PRACTICES
# ==============================================================================

best_practices:
  - principle: "Build Once, Deploy Many"
    description: "Build artifact once, deploy same artifact to all environments"
    rationale: "Ensures consistency, reduces build time"
    implementation:
      - "Build Docker image with Git SHA tag"
      - "Deploy same image to dev, staging, production"
      - "Use environment variables for environment-specific config"
  
  - principle: "Fail Fast"
    description: "Run fastest checks first, fail immediately on errors"
    implementation:
      - "Linting/formatting checks before tests"
      - "Unit tests before integration tests"
      - "Security scans early in pipeline"
      - "Stop pipeline on first failure"
  
  - principle: "Keep Pipelines Fast"
    description: "Target < 10 minutes for full pipeline"
    techniques:
      - "Aggressive caching"
      - "Parallel execution"
      - "Optimize Docker builds"
      - "Split slow tests to separate pipeline"
  
  - principle: "Make Pipelines Deterministic"
    description: "Same input produces same output every time"
    techniques:
      - "Pin dependency versions (lock files)"
      - "Use specific tool versions"
      - "Avoid time-based logic"
      - "Eliminate external dependencies in tests"
  
  - principle: "Version Everything"
    description: "Track versions of code, artifacts, and infrastructure"
    implementation:
      - "Semantic versioning for releases"
      - "Git SHA for commit-level tracking"
      - "Tag Docker images with version"
      - "Store pipeline version in artifact metadata"
  
  - principle: "Monitor Pipeline Health"
    description: "Track pipeline metrics over time"
    key_metrics:
      - "Pipeline success rate"
      - "Average pipeline duration"
      - "Deployment frequency"
      - "Time to recovery"
    tools: ["GitHub Insights", "GitLab CI/CD Analytics", "Jenkins Metrics Plugin"]
  
  - principle: "Secure by Default"
    description: "Security checks integrated into pipeline"
    implementation:
      - "Dependency scanning on every build"
      - "SAST analysis"
      - "Container image scanning"
      - "Secrets scanning"
      - "Fail build on high/critical vulnerabilities"
  
  - principle: "Infrastructure as Code"
    description: "Define infrastructure in version-controlled code"
    tools: ["Terraform", "CloudFormation", "Pulumi", "ARM templates"]
    benefits:
      - "Reproducible infrastructure"
      - "Code review for infrastructure changes"
      - "Rollback capability"
      - "Documentation as code"

# ==============================================================================
# TOOL COMPARISON
# ==============================================================================

cicd_tools:
  - name: "GitHub Actions"
    type: "Cloud-native CI/CD"
    best_for: "GitHub-hosted projects, microservices, open-source"
    strengths:
      - "Tight GitHub integration"
      - "Large marketplace of actions"
      - "Free for public repos, generous free tier for private"
      - "Matrix builds for parallelization"
    weaknesses:
      - "Limited to GitHub"
      - "Less flexible than Jenkins"
    pricing: "Free (public repos), $0.008/minute (private repos, 2,000 free minutes/month)"
  
  - name: "GitLab CI"
    type: "Integrated DevOps platform"
    best_for: "GitLab users, enterprises wanting all-in-one solution"
    strengths:
      - "Built into GitLab (no separate tool)"
      - "Auto DevOps (pre-configured pipelines)"
      - "Strong Kubernetes integration"
      - "Self-hosted option"
    weaknesses:
      - "Tied to GitLab"
      - "Learning curve for advanced features"
    pricing: "Free tier, $19/user/month (Premium), $99/user/month (Ultimate)"
  
  - name: "Jenkins"
    type: "Self-hosted automation server"
    best_for: "Complex workflows, on-premises, full control"
    strengths:
      - "Highly customizable (1,800+ plugins)"
      - "Self-hosted (no vendor lock-in)"
      - "Mature ecosystem"
      - "Supports any VCS"
    weaknesses:
      - "Requires maintenance (server management, plugin updates)"
      - "Configuration complexity"
      - "UI feels dated"
    pricing: "Free (open-source), infrastructure costs for self-hosting"
  
  - name: "CircleCI"
    type: "Cloud-native CI/CD"
    best_for: "Docker-first workflows, microservices"
    strengths:
      - "Docker layer caching"
      - "Fast builds"
      - "Good parallelization"
      - "Orbs (reusable config packages)"
    weaknesses:
      - "Pricing can get expensive"
      - "Less flexible than Jenkins"
    pricing: "Free tier (6,000 build minutes/month), $15/month (25,000 credits)"
  
  - name: "Azure Pipelines"
    type: "Cloud-native CI/CD (Azure DevOps)"
    best_for: "Microsoft stack, Azure cloud, enterprises"
    strengths:
      - "Free unlimited minutes for open-source"
      - "Strong Windows/.NET support"
      - "Multi-cloud deployment"
      - "Tight Azure integration"
    weaknesses:
      - "Complex YAML syntax"
      - "Limited free tier for private repos"
    pricing: "Free (1 parallel job, 1,800 minutes/month), $40/month per parallel job"
  
  - name: "AWS CodePipeline"
    type: "AWS-native CI/CD"
    best_for: "AWS-centric deployments"
    strengths:
      - "Native AWS integration"
      - "Pay-per-use pricing"
      - "Managed service (no servers)"
    weaknesses:
      - "Limited to AWS"
      - "Less flexible than other tools"
      - "Build features in separate service (CodeBuild)"
    pricing: "$1 per active pipeline per month + CodeBuild costs"

# ==============================================================================
# MIGRATION STRATEGIES
# ==============================================================================

migration_to_cicd:
  - phase: "Phase 1: Assessment"
    duration: "1-2 weeks"
    activities:
      - "Document current deployment process"
      - "Identify pain points"
      - "Select CI/CD tool"
      - "Define success metrics"
  
  - phase: "Phase 2: Automated Build"
    duration: "1-2 weeks"
    activities:
      - "Set up CI server or cloud CI"
      - "Create build pipeline (compile, create artifacts)"
      - "Run on every commit"
    success_criteria:
      - "Builds triggered automatically on commit"
      - "Build artifacts produced consistently"
  
  - phase: "Phase 3: Automated Testing"
    duration: "2-4 weeks"
    activities:
      - "Add unit tests to pipeline"
      - "Add integration tests"
      - "Fail build on test failures"
    success_criteria:
      - "Tests run on every build"
      - "Build fails if tests fail"
      - "Test execution < 10 minutes"
  
  - phase: "Phase 4: Automated Deployment (Dev)"
    duration: "1-2 weeks"
    activities:
      - "Automate deployment to dev environment"
      - "Run smoke tests after deployment"
    success_criteria:
      - "Every commit to develop branch deploys to dev"
      - "Smoke tests verify deployment"
  
  - phase: "Phase 5: Automated Deployment (Staging)"
    duration: "2-3 weeks"
    activities:
      - "Automate deployment to staging"
      - "Run full test suite on staging"
    success_criteria:
      - "Every commit to main deploys to staging"
      - "Full regression suite passes"
  
  - phase: "Phase 6: Production Deployment"
    duration: "2-4 weeks"
    activities:
      - "Choose deployment strategy (blue-green, canary, rolling)"
      - "Set up monitoring and alerting"
      - "Implement rollback mechanism"
      - "Deploy to production (with approval gate initially)"
    success_criteria:
      - "Production deployments via pipeline"
      - "Monitoring detects issues"
      - "Rollback tested and functional"
  
  - phase: "Phase 7: Continuous Improvement"
    ongoing: true
    activities:
      - "Monitor pipeline metrics"
      - "Optimize pipeline speed"
      - "Add security scanning"
      - "Refine deployment strategies"

# ==============================================================================
# EXAMPLE PIPELINES
# ==============================================================================

example_pipelines:
  github_actions_nodejs:
    description: "Complete CI/CD pipeline for Node.js application"
    file: ".github/workflows/ci-cd.yml"
    code: |
      name: CI/CD Pipeline
      
      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]
      
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v3
            
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '18'
                cache: 'npm'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint
            
            - name: Run unit tests
              run: npm test -- --coverage
            
            - name: Run integration tests
              run: npm run test:integration
            
            - name: Build
              run: npm run build
            
            - name: Security audit
              run: npm audit --production --audit-level=moderate
        
        docker:
          needs: build
          runs-on: ubuntu-latest
          if: github.ref == 'refs/heads/main'
          steps:
            - uses: actions/checkout@v3
            
            - name: Build Docker image
              run: docker build -t myapp:${{ github.sha }} .
            
            - name: Scan image
              run: |
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                  aquasec/trivy image --exit-code 1 --severity CRITICAL myapp:${{ github.sha }}
            
            - name: Push to registry
              run: |
                echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
                docker push myapp:${{ github.sha }}
        
        deploy:
          needs: docker
          runs-on: ubuntu-latest
          if: github.ref == 'refs/heads/main'
          steps:
            - name: Deploy to staging
              run: |
                kubectl set image deployment/myapp myapp=myapp:${{ github.sha }} -n staging
                kubectl rollout status deployment/myapp -n staging
            
            - name: Run smoke tests
              run: |
                curl -f https://staging.myapp.com/health || exit 1
  
  gitlab_ci_python:
    description: "GitLab CI pipeline for Python application"
    file: ".gitlab-ci.yml"
    code: |
      stages:
        - test
        - build
        - deploy
      
      variables:
        PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
      
      cache:
        paths:
          - .cache/pip
          - venv/
      
      test:
        stage: test
        image: python:3.11
        before_script:
          - python -m venv venv
          - source venv/bin/activate
          - pip install -r requirements.txt
        script:
          - flake8 src/
          - pytest tests/ --cov=src --cov-report=xml
          - bandit -r src/
        coverage: '/^TOTAL.*\s+(\d+\%)$/'
      
      build:
        stage: build
        image: docker:latest
        services:
          - docker:dind
        script:
          - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
          - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        only:
          - main
      
      deploy_staging:
        stage: deploy
        image: alpine/k8s:1.28.0
        script:
          - kubectl config use-context staging
          - kubectl set image deployment/myapp myapp=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
          - kubectl rollout status deployment/myapp
        only:
          - main

