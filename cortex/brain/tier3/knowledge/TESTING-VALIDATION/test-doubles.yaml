# OVERVIEW
overview:
  concept: "Test Doubles"
  definition: >
    Test doubles are objects that stand in for real dependencies in automated tests. They enable
    testing units in isolation by replacing expensive, slow, or unpredictable dependencies
    (databases, web services, file systems) with controlled, fast alternatives.
  
  why_needed:
    - "Isolate unit under test from external dependencies"
    - "Make tests fast (no network, database, or file I/O)"
    - "Make tests deterministic (control inputs and timing)"
    - "Test error conditions (simulate failures that are hard to trigger)"
    - "Verify interactions (check method calls, arguments)"
  
  categories:
    - "Dummy - Passed but never used"
    - "Stub - Provides canned responses"
    - "Spy - Records interactions for verification"
    - "Mock - Pre-programmed with expectations"
    - "Fake - Working implementation (lightweight)"
  
  taxonomy_note: >
    Martin Fowler distinguishes "state verification" (stubs/fakes) from "behavior verification"
    (mocks/spies). Gerard Meszaros provides the comprehensive taxonomy in "xUnit Test Patterns".

# TYPE 1: DUMMY OBJECTS
dummy:
  name: "Dummy Objects"
  definition: >
    Dummy objects are passed around but never actually used. They fill parameter lists when
    a method signature requires them, but the test doesn't care about their values.
  
  characteristics:
    - "Never accessed or called"
    - "Simplest type of test double"
    - "Often just null or empty objects"
    - "Used to satisfy method signatures"
  
  when_to_use:
    - "Method requires parameter but test doesn't exercise that path"
    - "Filling required constructor dependencies not relevant to test"
    - "Implementing interfaces with many methods but only testing one"
  
  examples:
    - language: "python"
      code: |
        # Dummy logger - never called in this test
        def test_calculate_total_with_discount():
            logger = None  # Dummy - not used by calculate_total
            calculator = PriceCalculator(logger)
            
            result = calculator.calculate_total([10, 20, 30])
            
            assert result == 60
      
      explanation: "Logger is required by constructor but not used in this test path"
    
    - language: "csharp"
      code: |
        // Dummy email service
        [Fact]
        public void CreateOrder_CalculatesTotal()
        {
            IEmailService dummyEmail = null; // Dummy
            var orderService = new OrderService(dummyEmail);
            
            var order = orderService.CreateOrder(
                new[] { new Item(10), new Item(20) });
            
            Assert.Equal(30, order.Total);
        }
      
      explanation: "Email service required but CreateOrder doesn't send email yet"
  
  anti_pattern:
    description: "Using real objects as dummies when null would suffice"
    example: |
      # Wasteful - creating real database connection
      db = DatabaseConnection("localhost", 5432)  # Not used!
      service = UserService(db)
      
      # Better - use None
      service = UserService(None)

# TYPE 2: STUBS
stub:
  name: "Stubs"
  definition: >
    Stubs provide canned answers to calls made during the test. They don't respond to anything
    outside what's programmed for the test. Stubs focus on STATE VERIFICATION (checking return
    values or final state, not how methods were called).
  
  characteristics:
    - "Returns pre-defined responses"
    - "Simplest behavior (no logic)"
    - "State-based testing"
    - "No verification of calls"
    - "Replaces read operations"
  
  when_to_use:
    - "Need to control data returned by dependency"
    - "Simulating slow or unavailable external service"
    - "Testing error handling (stub returns error)"
    - "Avoiding database queries in unit tests"
  
  examples:
    - language: "python"
      code: |
        # Stub repository
        class StubUserRepository:
            def get_by_id(self, user_id):
                # Always return same canned response
                return User(id=user_id, name="Alice", email="alice@example.com")
        
        def test_user_service_formats_greeting():
            stub_repo = StubUserRepository()
            service = UserService(stub_repo)
            
            greeting = service.get_greeting(user_id=123)
            
            assert greeting == "Hello, Alice!"
      
      explanation: "Stub repository returns fixed user data; test verifies greeting logic"
    
    - language: "csharp"
      code: |
        // Stub payment gateway
        public class StubPaymentGateway : IPaymentGateway
        {
            public PaymentResult ProcessPayment(decimal amount)
            {
                // Always return success
                return new PaymentResult { Success = true, TransactionId = "STUB123" };
            }
        }
        
        [Fact]
        public void Checkout_WithSuccessfulPayment_CompletesOrder()
        {
            var stubGateway = new StubPaymentGateway();
            var checkoutService = new CheckoutService(stubGateway);
            
            var order = checkoutService.Checkout(cartTotal: 100m);
            
            Assert.Equal(OrderStatus.Completed, order.Status);
        }
      
      explanation: "Stub always returns successful payment to test happy path"
    
    - language: "python"
      framework: "unittest.mock"
      code: |
        from unittest.mock import Mock
        
        def test_weather_service_formats_message():
            # Stub weather API
            stub_api = Mock()
            stub_api.get_temperature.return_value = 72
            
            service = WeatherService(stub_api)
            message = service.get_forecast("New York")
            
            assert message == "Temperature in New York: 72°F"
      
      explanation: "Using mock library to create stub with canned response"
  
  variants:
    - variant: "Responder Stub"
      description: "Returns different values based on input"
      example: |
        class ResponderStub:
            def get_price(self, product_id):
                prices = {1: 10.00, 2: 20.00, 3: 30.00}
                return prices.get(product_id, 0.00)
    
    - variant: "Saboteur Stub"
      description: "Simulates errors or failures"
      example: |
        class SaboteurStub:
            def fetch_data(self):
                raise ConnectionError("Network unavailable")

# TYPE 3: SPIES
spy:
  name: "Spies (Test Spies)"
  definition: >
    Spies record information about how they were called (arguments, call count, order). Unlike
    mocks, spies don't have pre-programmed expectations; they just record for later verification.
    They're like stubs that also record interactions.
  
  characteristics:
    - "Provides canned responses (like stub)"
    - "Records all interactions"
    - "Verifies behavior after execution"
    - "More flexible than mocks"
    - "Supports state AND behavior verification"
  
  when_to_use:
    - "Need to verify method was called"
    - "Want to inspect arguments passed"
    - "Need to check call order or count"
    - "Less strict than mocks (don't specify expectations upfront)"
  
  examples:
    - language: "python"
      code: |
        # Manual spy
        class SpyEmailService:
            def __init__(self):
                self.sent_emails = []  # Record calls
            
            def send(self, to, subject, body):
                self.sent_emails.append({
                    'to': to,
                    'subject': subject,
                    'body': body
                })
        
        def test_registration_sends_welcome_email():
            spy_email = SpyEmailService()
            service = RegistrationService(spy_email)
            
            service.register("alice@example.com", "password123")
            
            # Verify spy recorded the call
            assert len(spy_email.sent_emails) == 1
            assert spy_email.sent_emails[0]['to'] == "alice@example.com"
            assert "Welcome" in spy_email.sent_emails[0]['subject']
      
      explanation: "Spy records all emails sent; test verifies interaction after execution"
    
    - language: "python"
      framework: "unittest.mock"
      code: |
        from unittest.mock import Mock
        
        def test_logger_called_with_correct_message():
            spy_logger = Mock()  # Mock as spy
            service = OrderService(spy_logger)
            
            service.process_order(order_id=123)
            
            # Verify call after execution
            spy_logger.info.assert_called_once_with("Processing order 123")
      
      explanation: "Mock library's Mock can act as spy with assert_called_* methods"
    
    - language: "csharp"
      framework: "Moq"
      code: |
        // Spy using Moq
        [Fact]
        public void ProcessOrder_LogsOrderId()
        {
            var spyLogger = new Mock<ILogger>();
            var service = new OrderService(spyLogger.Object);
            
            service.ProcessOrder(orderId: 123);
            
            // Verify interaction after execution
            spyLogger.Verify(l => l.Info("Processing order 123"), Times.Once);
        }
      
      explanation: "Moq's Verify checks recorded interactions after test execution"
  
  difference_from_mock:
    mocks: "Pre-programmed expectations (fail test if not met)"
    spies: "Record interactions; verify after execution (more flexible)"
    
    example: |
      # MOCK: Expectations set upfront (strict)
      mock_logger = Mock()
      mock_logger.info.expect_call("Processing order 123")  # Must happen!
      service.process_order(123)
      mock_logger.verify()  # Fails if expectation not met
      
      # SPY: Verify after execution (flexible)
      spy_logger = Mock()
      service.process_order(123)
      spy_logger.info.assert_called_with("Processing order 123")  # Check after

# TYPE 4: MOCKS
mock:
  name: "Mocks (Mock Objects)"
  definition: >
    Mocks are pre-programmed with expectations about calls they expect to receive. They verify
    BEHAVIOR (how something is called) rather than STATE (what the result is). Mocks fail the
    test if expectations aren't met. They're used in behavior-driven testing.
  
  characteristics:
    - "Pre-programmed with expectations"
    - "Behavior verification (not state)"
    - "Fail test if expectations not met"
    - "More strict than spies"
    - "Focuses on interactions between objects"
  
  when_to_use:
    - "Testing object collaboration (how objects interact)"
    - "Verifying side effects (logging, events, notifications)"
    - "Command pattern (actions without return values)"
    - "Testing that correct dependencies are called"
  
  philosophy:
    mockist_style: "London School / Interaction-based testing"
    description: >
      Mockist TDD focuses on object interactions. Tests verify that the object under test
      collaborates correctly with its neighbors by checking method calls. This style tends
      to use more mocks and tests behavior rather than state.
    
    vs_classicist_style: "Detroit School / State-based testing"
    description: >
      Classicist TDD focuses on final state. Tests verify the outcome by checking return
      values or object state. This style uses fewer mocks (only for external dependencies).
  
  examples:
    - language: "python"
      framework: "unittest.mock"
      code: |
        from unittest.mock import Mock
        
        def test_order_service_sends_confirmation_email():
            # Mock with expectation
            mock_email = Mock()
            service = OrderService(mock_email)
            
            service.place_order(order_id=123, email="alice@example.com")
            
            # Verify interaction (behavior verification)
            mock_email.send.assert_called_once_with(
                to="alice@example.com",
                subject="Order Confirmation",
                body="Your order 123 has been placed"
            )
      
      explanation: "Mock verifies email service was called with exact arguments"
    
    - language: "csharp"
      framework: "Moq"
      code: |
        [Fact]
        public void ProcessPayment_PublishesPaymentProcessedEvent()
        {
            // Arrange
            var mockEventBus = new Mock<IEventBus>();
            var service = new PaymentService(mockEventBus.Object);
            
            // Act
            service.ProcessPayment(100m);
            
            // Assert - Verify interaction
            mockEventBus.Verify(
                bus => bus.Publish(It.Is<PaymentProcessedEvent>(
                    e => e.Amount == 100m)),
                Times.Once);
        }
      
      explanation: "Mock verifies event bus was called with correct event"
    
    - language: "javascript"
      framework: "Jest"
      code: |
        test('audit log records user action', () => {
          // Mock with expectation
          const mockAudit = jest.fn();
          const service = new UserService({ auditLog: mockAudit });
          
          service.deleteUser(userId: 123);
          
          // Verify interaction
          expect(mockAudit).toHaveBeenCalledWith({
            action: 'DELETE_USER',
            userId: 123,
            timestamp: expect.any(Date)
          });
        });
      
      explanation: "Jest mock function verifies audit logging behavior"
  
  strict_vs_lenient:
    strict_mocks:
      description: "Fail on any unexpected call"
      when_to_use: "When exact interaction sequence matters"
      example: |
        mock_db = StrictMock()
        mock_db.expect_call("begin_transaction")
        mock_db.expect_call("insert", user)
        mock_db.expect_call("commit")
        # Any other call fails test
    
    lenient_mocks:
      description: "Only verify expected calls; ignore others"
      when_to_use: "When only specific interactions matter"
      example: |
        mock_logger = Mock()
        service.process(data)
        mock_logger.error.assert_called_once()  # Only check error call

# TYPE 5: FAKES
fake:
  name: "Fakes"
  definition: >
    Fakes are working implementations with shortcuts that make them unsuitable for production.
    They have real behavior but use simplified implementations (e.g., in-memory database instead
    of real database). Fakes are more complex than stubs but faster than real implementations.
  
  characteristics:
    - "Working implementation (has real logic)"
    - "Simplified (shortcuts for speed)"
    - "Not suitable for production"
    - "Often stateful"
    - "Reusable across tests"
  
  when_to_use:
    - "Dependency is complex and stubs are insufficient"
    - "Need realistic behavior without production overhead"
    - "Testing integration between components"
    - "Shared across many tests (reusable fake)"
  
  examples:
    - language: "python"
      code: |
        # Fake in-memory database
        class FakeUserRepository:
            def __init__(self):
                self._users = {}  # In-memory storage
                self._next_id = 1
            
            def save(self, user):
                user.id = self._next_id
                self._users[user.id] = user
                self._next_id += 1
                return user.id
            
            def get_by_id(self, user_id):
                return self._users.get(user_id)
            
            def get_by_email(self, email):
                return next((u for u in self._users.values() 
                           if u.email == email), None)
        
        def test_user_service_prevents_duplicate_emails():
            fake_repo = FakeUserRepository()
            service = UserService(fake_repo)
            
            service.register("alice@example.com", "pass123")
            
            with pytest.raises(DuplicateEmailError):
                service.register("alice@example.com", "pass456")
      
      explanation: "Fake repository has real behavior (storage, lookup) but uses dict not DB"
    
    - language: "csharp"
      code: |
        // Fake email service
        public class FakeEmailService : IEmailService
        {
            private readonly List<Email> _sentEmails = new();
            
            public void Send(string to, string subject, string body)
            {
                // Real behavior: validates and stores
                if (string.IsNullOrEmpty(to))
                    throw new ArgumentException("Email required");
                
                _sentEmails.Add(new Email(to, subject, body));
            }
            
            public IReadOnlyList<Email> SentEmails => _sentEmails.AsReadOnly();
        }
        
        [Fact]
        public void Registration_SendsWelcomeEmail()
        {
            var fakeEmail = new FakeEmailService();
            var service = new RegistrationService(fakeEmail);
            
            service.Register("alice@example.com", "pass123");
            
            Assert.Single(fakeEmail.SentEmails);
            Assert.Contains("Welcome", fakeEmail.SentEmails[0].Subject);
        }
      
      explanation: "Fake email has validation logic but doesn't actually send emails"
    
    - language: "java"
      code: |
        // Fake payment gateway
        public class FakePaymentGateway implements PaymentGateway {
            private List<Transaction> transactions = new ArrayList<>();
            private boolean shouldFail = false;
            
            @Override
            public PaymentResult processPayment(BigDecimal amount) {
                if (shouldFail) {
                    return PaymentResult.failure("Insufficient funds");
                }
                
                Transaction tx = new Transaction(UUID.randomUUID(), amount);
                transactions.add(tx);
                return PaymentResult.success(tx.getId());
            }
            
            public void simulateFailure() {
                shouldFail = true;
            }
            
            public List<Transaction> getTransactions() {
                return transactions;
            }
        }
      
      explanation: "Fake gateway has state and configurable behavior for testing scenarios"
  
  common_fakes:
    - name: "In-Memory Database"
      example: "SQLite :memory: mode, H2 database"
      use_case: "Testing data access layer without real database"
    
    - name: "Fake File System"
      example: "In-memory filesystem (Python: pyfakefs)"
      use_case: "Testing file operations without disk I/O"
    
    - name: "Fake Clock"
      example: "Controllable time source"
      use_case: "Testing time-dependent logic"
    
    - name: "Fake HTTP Server"
      example: "WireMock, MockServer"
      use_case: "Testing HTTP clients without real server"

# CHOOSING THE RIGHT TEST DOUBLE
decision_guide:
  question_1:
    question: "Is the dependency even used in this test?"
    answer_no: "Use DUMMY"
    answer_yes: "Continue to next question"
  
  question_2:
    question: "Do you need to verify HOW the dependency was called?"
    answer_yes: "Use MOCK or SPY"
    answer_no: "Continue to next question"
  
  question_3:
    question: "Does the dependency need realistic behavior?"
    answer_yes: "Use FAKE"
    answer_no: "Use STUB"
  
  summary_table:
    - type: "Dummy"
      purpose: "Fill parameter lists"
      verification: "None"
      complexity: "Lowest"
      example: "null, empty object"
    
    - type: "Stub"
      purpose: "Provide canned responses"
      verification: "State (return values)"
      complexity: "Low"
      example: "Always return fixed user"
    
    - type: "Spy"
      purpose: "Record interactions"
      verification: "Behavior (after execution)"
      complexity: "Medium"
      example: "Record all method calls"
    
    - type: "Mock"
      purpose: "Verify interactions"
      verification: "Behavior (expectations)"
      complexity: "Medium-High"
      example: "Expect specific method call"
    
    - type: "Fake"
      purpose: "Simplified implementation"
      verification: "State + Behavior"
      complexity: "High"
      example: "In-memory database"

# BEST PRACTICES
best_practices:
  - practice: "Use Real Objects When Possible"
    rationale: "Tests with real dependencies are more trustworthy"
    guideline: "Only use test doubles for slow, flaky, or unavailable dependencies"
    
    rule_of_thumb: |
      REAL: Value objects, DTOs, simple utilities
      DOUBLE: Databases, APIs, file system, time, random
  
  - practice: "Prefer Stubs Over Mocks"
    rationale: "Stubs are simpler and less brittle"
    quote: "Mockist tests are more coupled to implementation (Martin Fowler)"
    
    guideline: |
      USE MOCKS: When testing object collaboration is the point
      USE STUBS: When you just need data to test logic
  
  - practice: "Don't Mock What You Don't Own"
    rationale: "Mocking third-party libraries couples tests to library internals"
    
    solution: "Create adapter/wrapper interface; mock your interface"
    example: |
      # Bad: Mocking third-party library
      mock_boto3 = Mock(spec=boto3.client)
      
      # Good: Mock your adapter
      class S3Storage(Protocol):
          def upload(self, key: str, data: bytes): ...
      
      mock_storage = Mock(spec=S3Storage)
  
  - practice: "Keep Mocks Simple"
    rationale: "Complex mocks are hard to maintain and understand"
    
    warning_signs:
      - "Mock has > 5 method stubs"
      - "Mock setup is > 10 lines"
      - "Mock has conditional logic"
    
    solution: "Consider using a Fake instead"
  
  - practice: "Use Mocking Frameworks"
    rationale: "Libraries provide cleaner syntax and better error messages"
    
    recommendations:
      python: ["unittest.mock (built-in)", "pytest-mock", "flexmock"]
      csharp: ["Moq", "NSubstitute", "FakeItEasy"]
      java: ["Mockito", "EasyMock", "JMock"]
      javascript: ["Jest", "Sinon.js", "testdouble.js"]
  
  - practice: "Verify Meaningful Interactions"
    rationale: "Don't verify every single call; focus on important ones"
    
    example: |
      # Over-specified (brittle)
      mock_logger.debug.assert_called_once()
      mock_logger.info.assert_called_with("Processing")
      mock_logger.debug.assert_called_with("Step 1")
      
      # Better (focus on what matters)
      mock_email.send.assert_called_once_with(to="user@example.com")

# ANTI-PATTERNS
anti_patterns:
  - anti_pattern: "Mocking Everything"
    description: "Using mocks for all dependencies including simple ones"
    
    problem: |
      class Calculator:
          def add(self, a, b):
              return a + b
      
      # Over-mocking
      mock_calc = Mock(spec=Calculator)
      mock_calc.add.return_value = 5
      service = SomeService(mock_calc)
    
    solution: "Use real Calculator; it's fast and has no side effects"
  
  - anti_pattern: "Testing the Mock"
    description: "Tests verify mock behavior instead of production code"
    
    problem: |
      def test_user_service():
          mock_repo = Mock()
          mock_repo.save.return_value = User(id=1)  # Setup
          
          service = UserService(mock_repo)
          result = service.register("alice")
          
          assert result.id == 1  # Testing mock's return value!
    
    solution: "Verify real behavior of UserService, not mock configuration"
  
  - anti_pattern: "Asserting on Irrelevant Details"
    description: "Verifying implementation details that don't affect behavior"
    
    problem: |
      # Over-specified
      mock_db.query.assert_called_once_with(
          "SELECT * FROM users WHERE id = ?",
          (123,)
      )
    
    solution: "Verify outcome, not SQL query (unless query format is the feature)"
  
  - anti_pattern: "Fragile Tests"
    description: "Tests break when refactoring internal implementation"
    
    problem: "Mocking too many internal methods; tests couple to structure"
    
    solution: "Test public API only; mock external dependencies only"

# TOOLING
tooling:
  python:
    - name: "unittest.mock"
      built_in: true
      features: ["Mock", "MagicMock", "patch", "spy capabilities"]
      docs: "https://docs.python.org/3/library/unittest.mock.html"
    
    - name: "pytest-mock"
      built_in: false
      features: ["pytest fixtures for mocking", "cleaner syntax"]
      install: "pip install pytest-mock"
    
    - name: "responses"
      purpose: "Mock HTTP requests"
      use_case: "Testing code that calls REST APIs"
  
  csharp:
    - name: "Moq"
      popularity: "Most popular"
      features: ["Fluent API", "LINQ-based", "Behavior/State verification"]
      example: "var mock = new Mock<IService>();"
    
    - name: "NSubstitute"
      popularity: "Popular"
      features: ["Simpler syntax", "Less ceremony"]
      example: "var sub = Substitute.For<IService>();"
  
  java:
    - name: "Mockito"
      popularity: "De facto standard"
      features: ["Annotations", "Argument matchers", "Spying"]
      example: "@Mock private UserRepository repo;"
  
  javascript:
    - name: "Jest"
      features: ["Built-in mocking", "jest.fn()", "Snapshot testing"]
      use_case: "Most JavaScript/TypeScript projects"
    
    - name: "Sinon.js"
      features: ["Standalone", "Spies, Stubs, Mocks", "Fake timers"]
      use_case: "Framework-agnostic mocking"

