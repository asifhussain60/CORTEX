# ==============================================================================
# LENS PROTOCOL - IMPLEMENTATION MAPPING & TOOL REGISTRY
# ==============================================================================
# Purpose: Operationalize the LENS protocol (Language, Examination, Navigation,
#          Synthesis) with concrete tool mappings and execution procedures.
#
# Status: ACTIVE (Tier 0 = Immutable)
# Author: Asif Hussain
# Copyright: © 2025-2026 Asif Hussain. All rights reserved.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
category: INTENT_ROUTER
precedence: HIGH

metadata:
  purpose: "Map LENS protocol steps to executable tools and procedures"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."

# ==============================================================================
# LENS PROTOCOL OVERVIEW
# ==============================================================================
# The LENS protocol is a multi-source intelligence gathering methodology
# for building deep understanding of user intent and repository context.
#
# Steps:
#   L = Language: Parse intent from natural language
#   E = Examination: AST parsing of code structure
#   N = Navigation: Git history and change patterns
#   S = Synthesis: Aggregate into holistic context
#   (R = Relationships: Impact analysis - implicit in S)
# ==============================================================================

protocol:
  name: "LENS Protocol"
  version: "1.0"
  purpose: "Deep intent comprehension before execution"
  confidence_threshold: 0.80  # Abort if confidence < 80%

# ==============================================================================
# STEP 1: LANGUAGE UNDERSTANDING
# ==============================================================================
# Parse user intent from natural language into canonicalized form.
# ==============================================================================

step_1_language:
  name: "Language Understanding"
  description: "Parse natural language request into canonicalized intent"
  input_type: "user_request: string"
  output_type: "CanonicalIntent"
  
  # Intent type classification
  intent_types:
    - type: "IMPLEMENT"
      description: "User wants to build new functionality"
      markers: ["add", "create", "build", "implement", "new feature"]
      target_orchestrator: "TDDOrchestrator"
      confidence_boost: 0.15  # When marker found
    
    - type: "FIX"
      description: "User wants to fix a bug or issue"
      markers: ["fix", "bug", "broken", "error", "crash", "wrong"]
      target_orchestrator: "TDDOrchestrator"
      confidence_boost: 0.15
    
    - type: "REFACTOR"
      description: "User wants to improve existing code"
      markers: ["refactor", "improve", "clean up", "optimize", "simplify"]
      target_orchestrator: "TDDOrchestrator"
      confidence_boost: 0.10
    
    - type: "QUERY"
      description: "User wants information or analysis"
      markers: ["show", "what", "how", "where", "which", "analyze"]
      target_orchestrator: "InteractionOrchestrator"
      confidence_boost: 0.20
    
    - type: "VALIDATE"
      description: "User wants to verify or check something"
      markers: ["validate", "check", "verify", "test", "ensure"]
      target_orchestrator: "ValidationOrchestrator"
      confidence_boost: 0.15
    
    - type: "MIGRATE"
      description: "User wants to move or change structure"
      markers: ["migrate", "move", "refactor", "reorganize", "consolidate"]
      target_orchestrator: "ArchitectureOrchestrator"
      confidence_boost: 0.12
  
  # Scope classification
  scope_types:
    - scope: "function"
      description: "Affects one function/method"
      impact_radius: 1  # Only direct callers
      test_count_estimate: 5
    
    - scope: "class"
      description: "Affects one class"
      impact_radius: 2  # Direct + adjacent classes
      test_count_estimate: 15
    
    - scope: "module"
      description: "Affects one module/file"
      impact_radius: 3  # Module + dependents
      test_count_estimate: 30
    
    - scope: "component"
      description: "Affects multiple related files"
      impact_radius: 5  # Component + related
      test_count_estimate: 50
    
    - scope: "system"
      description: "Affects system architecture"
      impact_radius: 10  # Entire system
      test_count_estimate: 100+
  
  # Constraint extraction
  constraint_patterns:
    - pattern: "without breaking.*test"
      meaning: "Must maintain test pass rate"
      severity: "HIGH"
    
    - pattern: "backward.*compat"
      meaning: "Must maintain backward compatibility"
      severity: "HIGH"
    
    - pattern: "ASAP|urgent|critical"
      meaning: "Time-sensitive request"
      severity: "CRITICAL"
    
    - pattern: "minimal.*change"
      meaning: "Prefer small, focused changes"
      severity: "MEDIUM"
  
  # Canonicalization output
  output_structure: |
    {
      "intent": {
        "type": "IMPLEMENT|FIX|REFACTOR|QUERY|VALIDATE|MIGRATE",
        "target": "file/function/class/module identifier",
        "scope_type": "function|class|module|component|system",
        "description": "Human-readable intent summary",
        "constraints": ["constraint1", "constraint2"],
        "confidence": 0.92,  # 0.0-1.0
        "ambiguities": ["ambiguity1"],
        "clarification_needed": false|true,
        "target_orchestrator": "OrchestratorName"
      }
    }
  
  # Implementation
  implementation:
    class: "IntentParser"
    module: "src.core.intent_router"
    method: "parse_user_request(request: str) -> CanonicalIntent"

# ==============================================================================
# STEP 2: EXAMINATION (AST ANALYSIS)
# ==============================================================================
# Parse repository structure using AST to understand code organization.
# ==============================================================================

step_2_examination:
  name: "Examination (AST Analysis)"
  description: "Parse code structure to understand dependencies and patterns"
  input_type: "repository_path: Path, focal_point: str (optional)"
  output_type: "CodeStructureMap"
  
  analysis_components:
    # Component 1: File-level analysis
    file_analysis:
      description: "Parse focal file (or all files if no focal point)"
      extracts:
        - "All function definitions (name, signature, return type)"
        - "All class definitions (name, inheritance, methods)"
        - "All imports (stdlib, third-party, local)"
        - "Module-level variables and constants"
        - "Decorators on functions/classes"
      output_fields:
        - "functions: List[Function]"
        - "classes: List[Class]"
        - "imports: List[Import]"
        - "patterns: List[str]  # Design patterns detected"
    
    # Component 2: Call graph analysis
    call_graph:
      description: "Build call graph from focal point"
      depth: 3  # How many levels deep to traverse
      extracts:
        - "What calls this function?"
        - "What does this function call?"
        - "Transitive dependencies (2-3 levels)"
      output_fields:
        - "callers: List[str]"
        - "callees: List[str]"
        - "transitive_depth_1: List[str]"
        - "transitive_depth_2: List[str]"
    
    # Component 3: Pattern detection
    patterns:
      description: "Detect architectural patterns"
      patterns_to_detect:
        - "Singleton pattern"
        - "Factory pattern"
        - "Decorator pattern"
        - "Strategy pattern"
        - "Observer pattern"
        - "MVC/MVP/MVVM"
        - "Microservices"
        - "Repository pattern"
      output_fields:
        - "patterns_found: List[Pattern]"
        - "pattern_locations: Dict[Pattern, List[Location]]"
    
    # Component 4: Type annotation analysis
    type_analysis:
      description: "Check type hint coverage"
      extracts:
        - "Functions with type hints"
        - "Functions without type hints"
        - "Type hint completeness percentage"
      output_fields:
        - "coverage_percent: float  # 0-100"
        - "functions_untyped: List[str]"
  
  # Tool mapping
  tools_required:
    - name: "AST Parser"
      description: "Parse Python code into AST"
      implementation: "ast.parse() + custom traversal"
      module: "src.core.ast_intelligence"
    
    - name: "Call Graph Builder"
      description: "Build dependency graph"
      implementation: "callgraph library + custom extensions"
      module: "src.core.call_graph_builder"
    
    - name: "Pattern Detector"
      description: "Detect design patterns"
      implementation: "Custom pattern matching library"
      module: "src.core.pattern_detector"
  
  # Output structure
  output_structure: |
    {
      "file": "src/auth/oauth.py",
      "functions": [
        {
          "name": "authenticate",
          "signature": "(request: Request, callback: Optional[Callable]) -> Result[AuthToken]",
          "returns": "Result[AuthToken]",
          "called_by": ["login_handler", "refresh_token"],
          "calls": ["validate_token", "cache_token", "log_auth"],
          "type_hints": true,
          "docstring": true
        }
      ],
      "classes": [
        {
          "name": "OAuthProvider",
          "methods": ["authenticate", "refresh", "revoke"],
          "inherits_from": ["BaseProvider"]
        }
      ],
      "patterns": ["singleton", "factory_method"],
      "type_hint_coverage": 95  # percent
    }
  
  # Implementation
  implementation:
    class: "ASTIntelligenceEngine"
    module: "src.core.ast_intelligence"
    methods:
      - "parse_file(file_path: str) -> AST"
      - "extract_functions(tree: AST) -> List[Function]"
      - "extract_classes(tree: AST) -> List[Class]"
      - "build_call_graph(tree: AST) -> CallGraph"
      - "detect_patterns(tree: AST) -> List[Pattern]"

# ==============================================================================
# STEP 3: NAVIGATION (GIT HISTORY)
# ==============================================================================
# Analyze git history to understand change patterns and code ownership.
# ==============================================================================

step_3_navigation:
  name: "Navigation (Git History Analysis)"
  description: "Analyze git history to understand context and patterns"
  input_type: "repository_path: Path, file_path: str (optional)"
  output_type: "GitHistoryContext"
  
  analysis_components:
    # Component 1: Change frequency
    change_frequency:
      description: "How often does this code change?"
      metrics:
        - "Commit count (last 30 days)"
        - "Commit count (last 90 days)"
        - "Change frequency classification: STABLE | ACTIVE | HOT"
      output_fields:
        - "last_changed: datetime"
        - "change_frequency: STABLE|ACTIVE|HOT"
        - "commits_last_30_days: int"
        - "commits_last_90_days: int"
    
    # Component 2: Change patterns
    change_patterns:
      description: "What kinds of changes are made?"
      patterns_to_detect:
        - "Refactoring changes"
        - "Bug fix changes"
        - "Feature additions"
        - "Breaking changes"
        - "Documentation changes"
      output_fields:
        - "recent_changes: List[Change]"
        - "change_types: Dict[str, int]  # count by type"
    
    # Component 3: Authorship
    authorship:
      description: "Who knows this code best?"
      extracts:
        - "Primary author(s)"
        - "Most recent author"
        - "Number of different authors"
      output_fields:
        - "primary_author: str"
        - "last_author: str"
        - "total_authors: int"
        - "author_expertise: List[Author]"
    
    # Component 4: Historical issues
    historical_issues:
      description: "What problems has this code had?"
      extracts:
        - "Bug fixes in commit history"
        - "Breaking changes"
        - "Deprecations"
        - "Security issues"
      output_fields:
        - "issues_found: List[Issue]"
        - "breaking_changes: List[Change]"
  
  # Tool mapping
  tools_required:
    - name: "Git Log Parser"
      description: "Query git history"
      command: "git log --format=fuller"
      module: "src.core.git_history_analyzer"
    
    - name: "Git Diff Analyzer"
      description: "Analyze change patterns"
      command: "git diff HEAD~N HEAD -- file"
      module: "src.core.git_diff_analyzer"
    
    - name: "Git Blame Tool"
      description: "Track line-by-line authorship"
      command: "git blame file"
      module: "src.core.git_blame_analyzer"
  
  # Output structure
  output_structure: |
    {
      "file": "src/auth/oauth.py",
      "last_changed": "2026-01-12T14:32:00Z",
      "last_author": "alice@company.com",
      "change_frequency": "ACTIVE",
      "commits_last_30_days": 8,
      "recent_changes": [
        {
          "commit": "3a2f1e9",
          "date": "2026-01-12",
          "author": "alice@company.com",
          "type": "fix",
          "message": "Fix token validation bug"
        }
      ],
      "historical_issues": [
        {
          "issue": "Token validation bug in v1.2",
          "fixed_in": "v1.3",
          "commit": "7b4c9d1"
        }
      ]
    }
  
  # Implementation
  implementation:
    class: "GitHistoryAnalyzer"
    module: "src.core.git_history_analyzer"
    methods:
      - "get_file_history(file_path: str, max_commits: int) -> List[Commit]"
      - "get_change_frequency(file_path: str) -> ChangeFrequency"
      - "detect_refactorings(file_path: str) -> List[Refactoring]"
      - "get_author_context(file_path: str) -> AuthorContext"

# ==============================================================================
# STEP 4: SYNTHESIS (AGGREGATE CONTEXT)
# ==============================================================================
# Synthesize all gathered information into holistic understanding.
# ==============================================================================

step_4_synthesis:
  name: "Synthesis (Context Aggregation)"
  description: "Merge code analysis, history, and comments into holistic context"
  input_type: "code_structure: CodeStructureMap, git_history: GitHistoryContext, comments: CommentMap"
  output_type: "HolisticContext"
  
  synthesis_process:
    # Process 1: Extract developer intent from comments
    comments:
      description: "Parse docstrings, comments, markers"
      extracts:
        - "Function docstrings (Google style)"
        - "Technical debt markers (TODO, FIXME, HACK)"
        - "Warning comments"
        - "Implementation notes"
      output_fields:
        - "docstrings: Dict[str, str]"
        - "tech_debt: List[TechDebt]"
        - "warnings: List[str]"
    
    # Process 2: Build semantic index
    semantics:
      description: "Extract key concepts and terminology"
      extracts:
        - "Domain concepts (OAuth, token, session)"
        - "Related modules"
        - "Documentation references"
      output_fields:
        - "concepts: List[str]"
        - "related_modules: List[str]"
    
    # Process 3: Calculate change impact
    impact_analysis:
      description: "What breaks if this changes?"
      calculates:
        - "Test files covering this code"
        - "Dependent functions"
        - "Configuration impact"
        - "Documentation impact"
      output_fields:
        - "test_files: List[str]"
        - "dependent_functions: List[str]"
        - "config_files: List[str]"
        - "docs_affected: List[str]"
  
  # Output structure (comprehensive YAML)
  output_structure: |
    {
      "reflection": {
        "request_id": "req-20260115-001",
        "focal_point": "src/auth/oauth.py::authenticate",
        "timestamp": "2026-01-15T10:00:00Z",
        
        # FROM STEP 1: Intent
        "canonicalized_intent": {
          "type": "IMPLEMENT",
          "target": "rate limiting",
          "confidence": 0.96
        },
        
        # FROM STEP 2: Code Analysis
        "code_analysis": {
          "functions": [...],
          "classes": [...],
          "patterns": [...]
        },
        
        # FROM STEP 3: History
        "historical_context": {
          "change_frequency": "ACTIVE",
          "issues_found": [...]
        },
        
        # FROM STEP 4: Comments
        "developer_intent": {
          "docstrings": {...},
          "tech_debt": [...]
        },
        
        # Impact Analysis
        "impact_analysis": {
          "test_files": [...],
          "dependent_functions": [...]
        },
        
        # Challenges & Recommendations
        "challenges": [...],
        "recommendations": [...],
        
        # Ready for execution?
        "ready_for_execution": false,
        "approval_status": "PENDING_USER_CONFIRMATION"
      }
    }
  
  # Implementation
  implementation:
    class: "ContextSynthesizer"
    module: "src.core.context_synthesizer"
    methods:
      - "synthesize(code_analysis, git_history, comments) -> HolisticContext"
      - "calculate_impact(focal_point: str, depth: int) -> ImpactAnalysis"
      - "extract_challenges(context: HolisticContext) -> List[Challenge]"
      - "generate_recommendations(context: HolisticContext) -> List[Recommendation]"

# ==============================================================================
# LENS PROTOCOL EXECUTION ORCHESTRATION
# ==============================================================================
# How to orchestrate the full LENS protocol in a real workflow.
# ==============================================================================

execution:
  protocol: "Sequential (L → E → N → S)"
  total_time_estimate_ms: 5000  # ~5 seconds for full analysis
  
  steps:
    - step: 1
      name: "Language Understanding"
      duration_ms: 100
      parallel: false
      blocking: false
    
    - step: 2
      name: "Examination"
      duration_ms: 2000
      parallel: false
      depends_on: [1]
    
    - step: 3
      name: "Navigation"
      duration_ms: 1500
      parallel: false
      depends_on: [1]
    
    - step: 4
      name: "Synthesis"
      duration_ms: 1400
      parallel: false
      depends_on: [2, 3]
  
  # Error handling
  error_handling:
    - if: "language_confidence < 0.80"
      then: "Ask user for clarification"
      action: "ABORT_SYNTHESIS"
    
    - if: "repo_parse_fails"
      then: "Ask user for repo path"
      action: "RETRY_WITH_CONTEXT"
    
    - if: "git_history_unavailable"
      then: "Use code analysis only"
      action: "CONTINUE_WITH_WARNING"

# ==============================================================================
# INTEGRATION WITH INTENT ROUTER
# ==============================================================================
# How LENS feeds into Master Orchestrator's decision trees.
# ==============================================================================

routing_integration:
  description: "LENS output feeds into Intent Router decision trees"
  
  mapping:
    - lens_step: "Language (intent type)"
      routes_to: "Intent type classification"
      example: "intent.type=IMPLEMENT → Route to TDD Orchestrator"
    
    - lens_step: "Examination (scope analysis)"
      routes_to: "Scope impact calculation"
      example: "scope=function → <500 lines, single test file"
    
    - lens_step: "Navigation (change history)"
      routes_to: "Risk assessment"
      example: "change_frequency=HOT → Higher risk, more testing"
    
    - lens_step: "Synthesis (impact analysis)"
      routes_to: "Execution planning"
      example: "affected_files=15 → Larger refactor sprint"

# ==============================================================================
# ENFORCEMENT CONFIGURATION
# ==============================================================================

enforcement:
  mode: "strict"
  confidence_threshold: 0.80
  validation_level: "comprehensive"
  audit_logging: true
