# Refactoring Catalog
# Machine-readable refactoring techniques from Martin Fowler's catalog
# Version: 1.0
# Created: December 19, 2025
# Schema: RefactoringCatalogSchema (Pydantic validation)
# Source: Martin Fowler's Refactoring (2nd Edition), Refactoring.Guru
# Primary use: Refactoring agents, code smell detection, automated refactoring

metadata:
  name: "Refactoring Catalog"
  version: "1.0"
  author: "CORTEX Knowledge Library"
  source: "Martin Fowler's Refactoring (2nd Edition), Refactoring.Guru"
  created: "2025-12-19"
  updated: "2025-12-19"
  description: "Comprehensive refactoring techniques with smell → technique mapping"

# CODE SMELLS (Detection patterns for when to refactor)
code_smells:
  bloaters:
    - smell: "Long Method"
      description: "Method has too many lines of code"
      threshold: "> 20 lines"
      refactorings: ["refactor_001", "refactor_003", "refactor_004"]
    
    - smell: "Large Class"
      description: "Class has too many responsibilities"
      threshold: "> 200 lines or > 10 methods"
      refactorings: ["refactor_013", "refactor_025"]
    
    - smell: "Primitive Obsession"
      description: "Using primitives instead of small objects"
      refactorings: ["refactor_019", "refactor_026", "refactor_027"]
    
    - smell: "Long Parameter List"
      description: "Method has too many parameters"
      threshold: "> 3 parameters"
      refactorings: ["refactor_045", "refactor_046"]
    
    - smell: "Data Clumps"
      description: "Same group of data items appears together"
      refactorings: ["refactor_013", "refactor_045"]
  
  oo_abusers:
    - smell: "Switch Statements"
      description: "Complex switch/case or if/else chains"
      refactorings: ["refactor_036"]
    
    - smell: "Temporary Field"
      description: "Field only set in certain circumstances"
      refactorings: ["refactor_013", "refactor_028"]
    
    - smell: "Refused Bequest"
      description: "Subclass doesn't use inherited methods"
      refactorings: ["refactor_053", "refactor_054"]
    
    - smell: "Alternative Classes with Different Interfaces"
      description: "Two classes do the same thing but have different interfaces"
      refactorings: ["refactor_041", "refactor_011"]
  
  change_preventers:
    - smell: "Divergent Change"
      description: "One class changed for multiple reasons"
      refactorings: ["refactor_013"]
    
    - smell: "Shotgun Surgery"
      description: "One change requires many small changes in many classes"
      refactorings: ["refactor_011", "refactor_012", "refactor_014"]
    
    - smell: "Parallel Inheritance Hierarchies"
      description: "Creating subclass in one hierarchy requires creating one in another"
      refactorings: ["refactor_011", "refactor_012"]
  
  dispensables:
    - smell: "Comments"
      description: "Excessive comments explaining bad code"
      refactorings: ["refactor_001", "refactor_003", "refactor_036"]
    
    - smell: "Duplicate Code"
      description: "Same code structure in multiple places"
      refactorings: ["refactor_001", "refactor_011", "refactor_050", "refactor_055"]
    
    - smell: "Lazy Class"
      description: "Class doesn't do enough to justify existence"
      refactorings: ["refactor_002", "refactor_014", "refactor_056"]
    
    - smell: "Dead Code"
      description: "Unused code"
      refactorings: ["remove_code"]
    
    - smell: "Speculative Generality"
      description: "Unused abstraction added for future use"
      refactorings: ["refactor_002", "refactor_014", "refactor_056"]
  
  couplers:
    - smell: "Feature Envy"
      description: "Method uses more features of another class than its own"
      refactorings: ["refactor_011", "refactor_012"]
    
    - smell: "Inappropriate Intimacy"
      description: "Two classes too tightly coupled"
      refactorings: ["refactor_011", "refactor_012", "refactor_015", "refactor_053"]
    
    - smell: "Message Chains"
      description: "Long chain of method calls (a.getB().getC().getD())"
      refactorings: ["refactor_015"]
    
    - smell: "Middle Man"
      description: "Class delegates most work to another class"
      refactorings: ["refactor_016"]

# COMPOSING METHODS (Streamline methods, remove duplication)
composing_methods:
  - id: "refactor_001"
    name: "Extract Method"
    category: "composing_methods"
    problem: "Code fragment that can be grouped together"
    solution: "Move fragment to separate method with descriptive name"
    
    mechanics:
      - "Create new method with intention-revealing name"
      - "Copy extracted code to new method"
      - "Replace old code with call to new method"
      - "Find all variables used and pass as parameters"
    
    example_before: |
      def print_invoice(invoice):
          print("***********************")
          print("*** Customer Invoice ***")
          print("***********************")
          
          # Print details
          print(f"Name: {invoice.customer_name}")
          print(f"Amount: {invoice.amount}")
    
    example_after: |
      def print_invoice(invoice):
          print_banner()
          print_details(invoice)
      
      def print_banner():
          print("***********************")
          print("*** Customer Invoice ***")
          print("***********************")
      
      def print_details(invoice):
          print(f"Name: {invoice.customer_name}")
          print(f"Amount: {invoice.amount}")
  
  - id: "refactor_002"
    name: "Inline Method"
    category: "composing_methods"
    problem: "Method body is as clear as its name"
    solution: "Replace method call with method body"
    
    mechanics:
      - "Verify method is not polymorphic"
      - "Find all calls to method"
      - "Replace each call with method body"
      - "Delete method definition"
    
    example_before: |
      def get_rating(driver):
          return 2 if more_than_five_late_deliveries(driver) else 1
      
      def more_than_five_late_deliveries(driver):
          return driver.late_deliveries > 5
    
    example_after: |
      def get_rating(driver):
          return 2 if driver.late_deliveries > 5 else 1
  
  - id: "refactor_003"
    name: "Extract Variable"
    category: "composing_methods"
    problem: "Complex expression is hard to understand"
    solution: "Put expression result in variable with descriptive name"
    
    mechanics:
      - "Identify complex expression"
      - "Declare variable with clear name"
      - "Assign expression result to variable"
      - "Replace expression with variable reference"
    
    example_before: |
      if (platform.toUpperCase().indexOf("MAC") > -1 and
          browser.toUpperCase().indexOf("IE") > -1 and
          wasInitialized() and resize > 0):
          # Do something
    
    example_after: |
      is_mac_os = platform.toUpperCase().indexOf("MAC") > -1
      is_ie_browser = browser.toUpperCase().indexOf("IE") > -1
      was_resized = wasInitialized() and resize > 0
      
      if is_mac_os and is_ie_browser and was_resized:
          # Do something
  
  - id: "refactor_004"
    name: "Inline Temp"
    category: "composing_methods"
    problem: "Temporary variable assigned from simple expression"
    solution: "Replace temp references with expression itself"
    
    mechanics:
      - "Verify temp is assigned once"
      - "Replace all references with expression"
      - "Remove temp declaration"
    
    example_before: |
      base_price = order.base_price()
      return base_price > 1000
    
    example_after: |
      return order.base_price() > 1000
  
  - id: "refactor_005"
    name: "Replace Temp with Query"
    category: "composing_methods"
    problem: "Temporary variable holds result of expression"
    solution: "Extract expression to method, replace temp with method call"
    
    mechanics:
      - "Extract expression into method"
      - "Replace temp references with method call"
      - "Apply Extract Method if needed"
    
    example_before: |
      base_price = quantity * item_price
      if base_price > 1000:
          return base_price * 0.95
      else:
          return base_price * 0.98
    
    example_after: |
      def base_price():
          return quantity * item_price
      
      if base_price() > 1000:
          return base_price() * 0.95
      else:
          return base_price() * 0.98
  
  - id: "refactor_006"
    name: "Split Temporary Variable"
    category: "composing_methods"
    problem: "Temporary variable assigned more than once"
    solution: "Use separate variable for each assignment"
    
    mechanics:
      - "Change name of temp at first assignment"
      - "Change references up to next assignment"
      - "Repeat for each assignment"
    
    example_before: |
      temp = 2 * (height + width)
      print(temp)
      temp = height * width
      print(temp)
    
    example_after: |
      perimeter = 2 * (height + width)
      print(perimeter)
      area = height * width
      print(area)
  
  - id: "refactor_007"
    name: "Remove Assignments to Parameters"
    category: "composing_methods"
    problem: "Parameter is assigned a value in method body"
    solution: "Use temporary variable instead"
    
    mechanics:
      - "Create temporary variable"
      - "Assign parameter value to temp"
      - "Replace all parameter references with temp"
    
    example_before: |
      def discount(input_val, quantity):
          if quantity > 50:
              input_val -= 2  # Modifying parameter!
          return input_val
    
    example_after: |
      def discount(input_val, quantity):
          result = input_val
          if quantity > 50:
              result -= 2
          return result
  
  - id: "refactor_008"
    name: "Replace Method with Method Object"
    category: "composing_methods"
    problem: "Long method with many local variables preventing extraction"
    solution: "Turn method into separate class with local variables as fields"
    
    mechanics:
      - "Create new class named after method"
      - "Give class field for object method was on"
      - "Give class field for each local variable and parameter"
      - "Create constructor taking original object and parameters"
      - "Create compute() method with original method body"
    
    example_before: |
      def calculate_price(self, quantity, item_price):
          base = quantity * item_price
          discount = 0
          if quantity > 100:
              discount = base * 0.1
          shipping = min(base * 0.1, 100)
          return base - discount + shipping
    
    example_after: |
      class PriceCalculator:
          def __init__(self, order, quantity, item_price):
              self.order = order
              self.quantity = quantity
              self.item_price = item_price
          
          def compute(self):
              base = self.base_price()
              discount = self.discount()
              shipping = self.shipping()
              return base - discount + shipping
          
          def base_price(self):
              return self.quantity * self.item_price
          
          def discount(self):
              if self.quantity > 100:
                  return self.base_price() * 0.1
              return 0
          
          def shipping(self):
              return min(self.base_price() * 0.1, 100)
      
      def calculate_price(self, quantity, item_price):
          return PriceCalculator(self, quantity, item_price).compute()
  
  - id: "refactor_009"
    name: "Substitute Algorithm"
    category: "composing_methods"
    problem: "Algorithm can be replaced with clearer one"
    solution: "Replace algorithm with clearer alternative"
    
    mechanics:
      - "Write tests for existing algorithm"
      - "Replace algorithm body"
      - "Run tests to verify behavior"
    
    example_before: |
      def found_person(people):
          for person in people:
              if person == "Don":
                  return "Don"
              if person == "John":
                  return "John"
              if person == "Kent":
                  return "Kent"
          return ""
    
    example_after: |
      def found_person(people):
          candidates = ["Don", "John", "Kent"]
          for person in people:
              if person in candidates:
                  return person
          return ""

# MOVING FEATURES BETWEEN OBJECTS
moving_features:
  - id: "refactor_011"
    name: "Move Method"
    category: "moving_features"
    problem: "Method uses more features of another class than its own"
    solution: "Create new method in class it uses most, move code there"
    
    mechanics:
      - "Examine features used by method"
      - "Check for polymorphism in current class"
      - "Create new method in target class"
      - "Copy code to new method"
      - "Turn old method into delegating method or remove it"
    
    example_before: |
      class Account:
          def overdraft_charge(self):
              if self.type.is_premium():
                  return 10
              return 20
    
    example_after: |
      class AccountType:
          def overdraft_charge(self):
              if self.is_premium():
                  return 10
              return 20
      
      class Account:
          def overdraft_charge(self):
              return self.type.overdraft_charge()
  
  - id: "refactor_012"
    name: "Move Field"
    category: "moving_features"
    problem: "Field is used more by another class than its own"
    solution: "Create new field in target class, redirect all users"
    
    mechanics:
      - "Encapsulate field if public"
      - "Create field in target class with getter/setter"
      - "Determine how to reference target object"
      - "Remove field from source class"
      - "Replace references with calls to target"
    
    example_before: |
      class Account:
          interest_rate = 0.05  # Used by AccountType
      
      class AccountType:
          def calculate_interest(self, account):
              return account.balance * account.interest_rate
    
    example_after: |
      class AccountType:
          interest_rate = 0.05
          
          def calculate_interest(self, account):
              return account.balance * self.interest_rate
      
      class Account:
          pass  # interest_rate moved out
  
  - id: "refactor_013"
    name: "Extract Class"
    category: "moving_features"
    problem: "Class has responsibilities that should be split"
    solution: "Create new class, move relevant fields/methods"
    
    mechanics:
      - "Decide how to split responsibilities"
      - "Create new class"
      - "Link old class to new class"
      - "Use Move Field/Move Method to move features"
    
    example_before: |
      class Person:
          name: str
          office_area_code: str
          office_number: str
          
          def telephone_number(self):
              return f"({self.office_area_code}) {self.office_number}"
    
    example_after: |
      class Person:
          name: str
          _telephone: TelephoneNumber
          
          def telephone_number(self):
              return self._telephone.get_number()
      
      class TelephoneNumber:
          area_code: str
          number: str
          
          def get_number(self):
              return f"({self.area_code}) {self.number}"
  
  - id: "refactor_014"
    name: "Inline Class"
    category: "moving_features"
    problem: "Class doesn't do much"
    solution: "Move all features to another class, delete original"
    
    mechanics:
      - "Declare public methods of source class in target"
      - "Change references to use target class"
      - "Use Move Method/Move Field to move features"
      - "Delete source class"
    
    example_before: |
      class Person:
          telephone: TelephoneNumber
      
      class TelephoneNumber:  # Too simple
          area_code: str
          number: str
    
    example_after: |
      class Person:
          area_code: str
          number: str
  
  - id: "refactor_015"
    name: "Hide Delegate"
    category: "moving_features"
    problem: "Client calls delegate class of object"
    solution: "Create delegating method on server to hide delegate"
    
    mechanics:
      - "Create delegating method on server for each delegate method"
      - "Adjust client to call server methods"
      - "Remove delegate accessor if no longer needed"
    
    example_before: |
      manager = john.department.manager  # Client knows structure
    
    example_after: |
      class Person:
          def get_manager(self):
              return self.department.manager
      
      manager = john.get_manager()  # Structure hidden
  
  - id: "refactor_016"
    name: "Remove Middle Man"
    category: "moving_features"
    problem: "Class does too much simple delegation"
    solution: "Get client to call delegate directly"
    
    mechanics:
      - "Create accessor for delegate"
      - "Replace each delegating method with call to delegate"
      - "Remove delegating method after each replacement"
    
    example_before: |
      class Person:
          def get_manager(self):
              return self.department.manager
          
          def get_budget(self):
              return self.department.budget
          # Too many delegating methods...
    
    example_after: |
      class Person:
          def get_department(self):
              return self.department
      
      manager = john.get_department().manager  # Direct access

# ORGANIZING DATA
organizing_data:
  - id: "refactor_019"
    name: "Replace Data Value with Object"
    category: "organizing_data"
    problem: "Data item needs additional data or behavior"
    solution: "Turn data item into object"
    
    mechanics:
      - "Create class for value"
      - "Add field to class, initialize from constructor"
      - "Change value field to object field"
      - "Update references"
    
    example_before: |
      class Order:
          customer: str  # Just a string
    
    example_after: |
      class Order:
          customer: Customer
      
      class Customer:
          name: str
          address: str
          credit_rating: int
  
  - id: "refactor_026"
    name: "Replace Type Code with Class"
    category: "organizing_data"
    problem: "Numeric type code doesn't affect behavior"
    solution: "Replace number with new class"
    
    mechanics:
      - "Create class for type code"
      - "Modify implementation to use new class"
      - "Remove old type code"
    
    example_before: |
      class Person:
          O = 0  # Type codes
          A = 1
          B = 2
          AB = 3
          blood_type: int
    
    example_after: |
      class Person:
          blood_type: BloodType
      
      class BloodType:
          def __init__(self, code):
              self.code = code
          
          @staticmethod
          def O():
              return BloodType(0)
  
  - id: "refactor_024"
    name: "Encapsulate Field"
    category: "organizing_data"
    problem: "Public field"
    solution: "Make field private, provide accessors"
    
    mechanics:
      - "Create getter and setter"
      - "Find all references, replace with accessor calls"
      - "Make field private"
    
    example_before: |
      class Person:
          name: str  # Public field
    
    example_after: |
      class Person:
          _name: str  # Private field
          
          @property
          def name(self):
              return self._name
          
          @name.setter
          def name(self, value):
              self._name = value

# SIMPLIFYING CONDITIONAL EXPRESSIONS
simplifying_conditionals:
  - id: "refactor_033"
    name: "Decompose Conditional"
    category: "simplifying_conditionals"
    problem: "Complex conditional (if-then-else)"
    solution: "Extract condition, then part, else part into methods"
    
    mechanics:
      - "Extract condition into method"
      - "Extract then part into method"
      - "Extract else part into method"
    
    example_before: |
      if date.before(SUMMER_START) or date.after(SUMMER_END):
          charge = quantity * winter_rate + winter_service_charge
      else:
          charge = quantity * summer_rate
    
    example_after: |
      if is_summer(date):
          charge = summer_charge(quantity)
      else:
          charge = winter_charge(quantity)
  
  - id: "refactor_034"
    name: "Consolidate Conditional Expression"
    category: "simplifying_conditionals"
    problem: "Multiple conditionals with same result"
    solution: "Combine into single conditional, extract to method"
    
    mechanics:
      - "Check conditions have no side effects"
      - "Combine with logical operators"
      - "Extract to method"
    
    example_before: |
      if seniority < 2:
          return 0
      if months_disabled > 12:
          return 0
      if is_part_time:
          return 0
    
    example_after: |
      if is_not_eligible_for_disability():
          return 0
      
      def is_not_eligible_for_disability():
          return seniority < 2 or months_disabled > 12 or is_part_time
  
  - id: "refactor_036"
    name: "Replace Conditional with Polymorphism"
    category: "simplifying_conditionals"
    problem: "Conditional chooses behavior based on object type"
    solution: "Move each leg to subclass method"
    
    mechanics:
      - "Create subclasses for each variant"
      - "Create abstract method in superclass"
      - "Copy conditional leg to subclass"
      - "Remove conditional"
    
    example_before: |
      class Bird:
          def get_speed(self):
              if self.type == "EUROPEAN":
                  return self.base_speed
              elif self.type == "AFRICAN":
                  return self.base_speed - self.load_factor
              elif self.type == "NORWEGIAN_BLUE":
                  return 0 if self.is_nailed else self.base_speed
    
    example_after: |
      class Bird:
          def get_speed(self):
              pass  # Abstract
      
      class European(Bird):
          def get_speed(self):
              return self.base_speed
      
      class African(Bird):
          def get_speed(self):
              return self.base_speed - self.load_factor
      
      class NorwegianBlue(Bird):
          def get_speed(self):
              return 0 if self.is_nailed else self.base_speed
  
  - id: "refactor_037"
    name: "Introduce Null Object"
    category: "simplifying_conditionals"
    problem: "Repeated null checks"
    solution: "Replace null with null object"
    
    mechanics:
      - "Create null object class"
      - "Create isNull() method"
      - "Replace null checks with isNull() calls or remove"
    
    example_before: |
      if customer is None:
          plan = BillingPlan.basic()
      else:
          plan = customer.get_plan()
    
    example_after: |
      class NullCustomer(Customer):
          def get_plan(self):
              return BillingPlan.basic()
          
          def is_null(self):
              return True
      
      plan = customer.get_plan()  # No null check needed

# SIMPLIFYING METHOD CALLS
simplifying_method_calls:
  - id: "refactor_041"
    name: "Rename Method"
    category: "simplifying_method_calls"
    problem: "Method name doesn't reveal purpose"
    solution: "Rename method to reveal intent"
    
    mechanics:
      - "Check for polymorphism"
      - "Create new method with better name"
      - "Copy body to new method"
      - "Replace old method calls with new"
      - "Remove old method"
    
    example_before: |
      def get_inv_cdtlmt():  # What?
          pass
    
    example_after: |
      def get_invoice_credit_limit():
          pass
  
  - id: "refactor_045"
    name: "Introduce Parameter Object"
    category: "simplifying_method_calls"
    problem: "Group of parameters naturally go together"
    solution: "Replace them with object"
    
    mechanics:
      - "Create class for parameter group"
      - "Add parameter to method"
      - "Replace each parameter with object field access"
      - "Remove old parameters"
    
    example_before: |
      def amount_invoiced(start_date, end_date):
          pass
      
      def amount_received(start_date, end_date):
          pass
    
    example_after: |
      class DateRange:
          def __init__(self, start, end):
              self.start = start
              self.end = end
      
      def amount_invoiced(date_range: DateRange):
          pass
      
      def amount_received(date_range: DateRange):
          pass
  
  - id: "refactor_046"
    name: "Preserve Whole Object"
    category: "simplifying_method_calls"
    problem: "Getting several values from object to pass as parameters"
    solution: "Pass whole object instead"
    
    mechanics:
      - "Create parameter for whole object"
      - "Replace parameter usage with object calls"
      - "Remove old parameters"
    
    example_before: |
      low = days_temp_range.get_low()
      high = days_temp_range.get_high()
      within_plan = plan.within_range(low, high)
    
    example_after: |
      within_plan = plan.within_range(days_temp_range)
  
  - id: "refactor_049"
    name: "Replace Error Code with Exception"
    category: "simplifying_method_calls"
    problem: "Method returns special code to indicate error"
    solution: "Throw exception instead"
    
    mechanics:
      - "Decide on checked or unchecked exception"
      - "Find all callers"
      - "Replace error code with exception"
      - "Update callers to catch exception"
    
    example_before: |
      def withdraw(amount):
          if amount > balance:
              return -1  # Error code
          balance -= amount
          return 0
      
      if account.withdraw(100) == -1:
          handle_error()
    
    example_after: |
      def withdraw(amount):
          if amount > balance:
              raise InsufficientFundsError()
          balance -= amount
      
      try:
          account.withdraw(100)
      except InsufficientFundsError:
          handle_error()

# DEALING WITH GENERALIZATION
dealing_with_generalization:
  - id: "refactor_050"
    name: "Pull Up Field"
    category: "dealing_with_generalization"
    problem: "Two subclasses have same field"
    solution: "Move field to superclass"
    
    mechanics:
      - "Verify field used same way in subclasses"
      - "Check field names are the same"
      - "Move to superclass"
      - "Remove from subclasses"
    
    example_before: |
      class Salesman:
          name: str
      
      class Engineer:
          name: str
    
    example_after: |
      class Employee:
          name: str
      
      class Salesman(Employee):
          pass
      
      class Engineer(Employee):
          pass
  
  - id: "refactor_051"
    name: "Pull Up Method"
    category: "dealing_with_generalization"
    problem: "Methods in subclasses have same results"
    solution: "Move method to superclass"
    
    mechanics:
      - "Verify methods are identical"
      - "Check method signatures are same"
      - "Copy one method to superclass"
      - "Remove methods from subclasses"
    
    example_before: |
      class Salesman:
          def get_name(self):
              return self.name
      
      class Engineer:
          def get_name(self):
              return self.name
    
    example_after: |
      class Employee:
          def get_name(self):
              return self.name
      
      class Salesman(Employee):
          pass
      
      class Engineer(Employee):
          pass
  
  - id: "refactor_053"
    name: "Push Down Field"
    category: "dealing_with_generalization"
    problem: "Field used by some subclasses only"
    solution: "Move field to those subclasses"
    
    mechanics:
      - "Declare field in all subclasses that need it"
      - "Remove from superclass"
    
    example_before: |
      class Employee:
          quota: int  # Only used by Salesman
      
      class Salesman(Employee):
          pass
      
      class Engineer(Employee):
          pass  # Doesn't use quota
    
    example_after: |
      class Employee:
          pass
      
      class Salesman(Employee):
          quota: int
      
      class Engineer(Employee):
          pass
  
  - id: "refactor_054"
    name: "Push Down Method"
    category: "dealing_with_generalization"
    problem: "Method relevant to some subclasses only"
    solution: "Move method to those subclasses"
    
    mechanics:
      - "Copy method to subclasses that need it"
      - "Remove from superclass"
    
    example_before: |
      class Employee:
          def get_quota(self):  # Only for Salesman
              return self.quota
      
      class Salesman(Employee):
          pass
      
      class Engineer(Employee):
          pass  # Doesn't need quota
    
    example_after: |
      class Employee:
          pass
      
      class Salesman(Employee):
          def get_quota(self):
              return self.quota
      
      class Engineer(Employee):
          pass
  
  - id: "refactor_055"
    name: "Extract Subclass"
    category: "dealing_with_generalization"
    problem: "Class has features used only in some instances"
    solution: "Create subclass for subset of features"
    
    mechanics:
      - "Create new subclass"
      - "Provide constructor for subclass"
      - "Find calls to superclass constructor"
      - "Use Push Down Method and Push Down Field"
    
    example_before: |
      class Employee:
          type: str  # "engineer" or "manager"
          
          def get_bonus(self):
              if self.type == "manager":
                  return salary * 0.2
              return 0
    
    example_after: |
      class Employee:
          def get_bonus(self):
              return 0
      
      class Manager(Employee):
          def get_bonus(self):
              return self.salary * 0.2
  
  - id: "refactor_056"
    name: "Collapse Hierarchy"
    category: "dealing_with_generalization"
    problem: "Subclass doesn't add value"
    solution: "Merge subclass and superclass"
    
    mechanics:
      - "Choose which class to remove"
      - "Use Pull Up/Push Down to merge features"
      - "Update references"
      - "Remove empty class"
    
    example_before: |
      class Employee:
          pass
      
      class Salesman(Employee):
          pass  # Too similar, no unique behavior
    
    example_after: |
      class Employee:
          pass  # Merged

