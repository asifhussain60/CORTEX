# API Versioning Strategies
# CORTEX Knowledge Base - Engineering Domain
# Version: 1.0.0
# Created: December 22, 2025
# Author: Asif Hussain
# Category: API Design Excellence
# Purpose: Comprehensive API versioning strategies for backward compatibility

metadata:
  version: "1.0.0"
  created: "2025-12-22"
  updated: "2025-12-22"
  author: "Asif Hussain"
  category: "api-design"
  subcategory: "versioning"
  scope: "API versioning strategies, deprecation, evolution, migration"
  target_audience: ["backend-engineers", "api-developers", "architects"]
  maturity_level: "production-ready"
  learning_objectives:
    - "Choose appropriate versioning strategy"
    - "Implement backward-compatible changes"
    - "Manage API deprecation lifecycle"
    - "Migrate clients between versions"
    - "Monitor version usage and sunset old versions"
  prerequisites:
    - "REST or GraphQL API fundamentals"
    - "HTTP protocol"
    - "Semantic versioning concepts"

# Why API Versioning Matters
importance:
  problem: "APIs evolve, but clients depend on current behavior"
  consequences_without_versioning:
    - "Breaking existing clients with changes"
    - "Unable to improve API without client coordination"
    - "Fear of making any changes"
    - "Technical debt accumulation"
  benefits_with_versioning:
    - "Safe API evolution"
    - "Backward compatibility for existing clients"
    - "Clear migration paths"
    - "Measurable deprecation process"

# When to Version
versioning_triggers:
  breaking_changes:
    - name: "Removing endpoints or fields"
      example: "DELETE /users endpoint removed"
      impact: "High - clients will fail"

    - name: "Renaming fields or parameters"
      example: "user_name → userName"
      impact: "High - clients will fail"

    - name: "Changing field types"
      example: "age: String → age: Int"
      impact: "High - data parsing fails"

    - name: "Changing response structure"
      example: "Single object → Array of objects"
      impact: "High - client logic breaks"

    - name: "Changing authentication method"
      example: "API keys → OAuth 2.0"
      impact: "High - authentication fails"

    - name: "Removing enum values"
      example: "OrderStatus.PENDING removed"
      impact: "Medium - existing data may be invalid"

    - name: "Making optional fields required"
      example: "phoneNumber becomes required"
      impact: "High - existing requests fail validation"

  non_breaking_changes:
    - name: "Adding new endpoints"
      example: "POST /users/bulk-import"
      impact: "None - clients ignore unknown endpoints"

    - name: "Adding optional fields to requests"
      example: "New optional parameter 'include_metadata'"
      impact: "None - backward compatible"

    - name: "Adding fields to responses"
      example: "Adding 'created_by' to User object"
      impact: "None - clients ignore unknown fields"

    - name: "Adding new enum values"
      example: "Adding OrderStatus.PROCESSING"
      impact: "Low - only if clients validate against allowed values"

    - name: "Deprecating (not removing) fields"
      example: "Mark 'legacy_id' as deprecated"
      impact: "None - still functional"

# Versioning Strategies
versioning_strategies:
  uri_versioning:
    description: "Include version in URL path"
    pattern: "https://api.example.com/v1/users"
    
    pros:
      - "Highly visible and explicit"
      - "Easy to test with browser"
      - "Simple routing"
      - "Cache-friendly (different URLs)"
    
    cons:
      - "Pollutes URI space"
      - "Entire API versioned (even unchanged parts)"
      - "Harder to version individual resources"
    
    implementation:
      pattern_1: "/v1/users, /v2/users"
      pattern_2: "/api/v1/users, /api/v2/users"
      pattern_3: "/v1.2/users (minor versions)"
    
    routing_example: |
      # Express.js
      app.use('/v1', v1Router);
      app.use('/v2', v2Router);
    
    best_practices:
      - "Use major versions only (v1, v2, v3)"
      - "Place version early in path (/v1/... not /.../v1)"
      - "Consider default version redirect (/ → /v2)"
      - "Document version clearly"
    
    when_to_use:
      - "Public APIs with many external clients"
      - "Major breaking changes across entire API"
      - "Clear version boundaries"

  header_versioning:
    description: "Version specified in HTTP header"
    pattern: "Accept: application/vnd.example.v1+json"
    
    pros:
      - "Clean URLs (no version pollution)"
      - "Can version individual resources"
      - "Follows REST principles (content negotiation)"
    
    cons:
      - "Not visible in URL (harder to test)"
      - "Requires header support in all clients"
      - "More complex routing"
    
    implementation:
      custom_header: "X-API-Version: 1"
      accept_header: "Accept: application/vnd.example.v1+json"
      content_type: "Content-Type: application/vnd.example.v1+json"
    
    routing_example: |
      # Express.js middleware
      app.use((req, res, next) => {
        const version = req.headers['x-api-version'] || '1';
        req.apiVersion = version;
        next();
      });
    
    best_practices:
      - "Provide default version if header missing"
      - "Document header clearly in API docs"
      - "Support both Accept and custom header"
      - "Return version in response header"
    
    when_to_use:
      - "Internal APIs with controlled clients"
      - "RESTful APIs following HATEOAS"
      - "Per-resource versioning needed"

  query_parameter_versioning:
    description: "Version as query parameter"
    pattern: "https://api.example.com/users?version=1"
    
    pros:
      - "Simple implementation"
      - "Easy to test"
      - "Flexible per-request versioning"
    
    cons:
      - "Can be easily missed or forgotten"
      - "Caching challenges (query params in cache key)"
      - "Not RESTful"
    
    implementation:
      pattern: "GET /users?version=1&limit=10"
    
    routing_example: |
      # Express.js
      app.get('/users', (req, res) => {
        const version = req.query.version || '1';
        if (version === '1') {
          return v1Handler(req, res);
        }
        return v2Handler(req, res);
      });
    
    best_practices:
      - "Provide clear default version"
      - "Validate version parameter"
      - "Document prominently"
    
    when_to_use:
      - "Quick prototyping"
      - "Internal tools"
      - "NOT recommended for production public APIs"

  content_negotiation:
    description: "Use Accept/Content-Type headers with versioned media types"
    pattern: "Accept: application/vnd.example.user.v1+json"
    
    pros:
      - "Most RESTful approach"
      - "Resource-level versioning"
      - "Standards-compliant"
    
    cons:
      - "Complex implementation"
      - "Harder for clients to understand"
      - "Less common in practice"
    
    implementation:
      request: "Accept: application/vnd.example.user.v1+json"
      response: "Content-Type: application/vnd.example.user.v1+json"
    
    best_practices:
      - "Use vendor-specific media types (vnd.*)"
      - "Include version in media type"
      - "Support standard application/json as default"
    
    when_to_use:
      - "Mature REST APIs following hypermedia principles"
      - "Per-resource versioning requirements"
      - "Teams familiar with content negotiation"

  no_versioning:
    description: "Maintain backward compatibility without explicit versions"
    approach: "Additive-only changes with deprecation"
    
    pros:
      - "No version management overhead"
      - "Clean URLs and headers"
      - "Forces backward compatibility thinking"
    
    cons:
      - "Impossible for breaking changes"
      - "Accumulates technical debt"
      - "Schema bloat over time"
    
    strategies:
      - "Add new fields, never remove"
      - "Add new endpoints, deprecate old"
      - "Use optional parameters"
      - "Evolve response structure additively"
    
    when_to_use:
      - "Internal APIs with controlled clients"
      - "Simple APIs unlikely to need breaking changes"
      - "Microservices with version-compatible contracts"

# Semantic Versioning for APIs
semantic_versioning:
  format: "MAJOR.MINOR.PATCH"
  
  major:
    description: "Breaking changes"
    examples:
      - "Removing endpoints"
      - "Changing response structure"
      - "Renaming fields"
    increment: "1.3.5 → 2.0.0"
  
  minor:
    description: "New features, backward compatible"
    examples:
      - "Adding new endpoints"
      - "Adding optional parameters"
      - "Adding response fields"
    increment: "1.3.5 → 1.4.0"
  
  patch:
    description: "Bug fixes, no API changes"
    examples:
      - "Fix incorrect status code"
      - "Fix validation bug"
      - "Performance improvement"
    increment: "1.3.5 → 1.3.6"
  
  api_application:
    approach: "Use MAJOR.MINOR only in API URLs"
    pattern: "/v1.2/users (optional minor version)"
    common_practice: "/v1/users (major only)"
    rationale: "Minor/patch versions usually backward compatible"

# Deprecation Process
deprecation:
  lifecycle:
    - phase: "Announcement"
      duration: "Immediately"
      actions:
        - "Mark field/endpoint as deprecated in schema"
        - "Update API documentation"
        - "Send email to registered developers"
        - "Add deprecation warnings in responses"
    
    - phase: "Grace Period"
      duration: "6-12 months minimum"
      actions:
        - "Monitor deprecated feature usage"
        - "Send periodic reminders to users"
        - "Provide migration guides"
        - "Offer support for migration"
    
    - phase: "Sunset Warning"
      duration: "3 months before removal"
      actions:
        - "Intensify notifications"
        - "Return sunset headers in responses"
        - "Direct contact to remaining users"
    
    - phase: "Removal"
      duration: "After grace period"
      actions:
        - "Remove deprecated features"
        - "Return 410 Gone for removed endpoints"
        - "Update documentation"
        - "Monitor for issues"

  deprecation_headers:
    sunset_header:
      description: "RFC 8594 standard for deprecation date"
      example: "Sunset: Sat, 31 Dec 2025 23:59:59 GMT"
    
    deprecation_header:
      description: "Indicate deprecation status"
      example: "Deprecation: true"
    
    link_header:
      description: "Point to migration guide"
      example: 'Link: <https://docs.example.com/migration>; rel="deprecation"'
  
  response_warnings:
    description: "Include deprecation warnings in response"
    example: |
      {
        "data": { ... },
        "warnings": [
          {
            "code": "DEPRECATED_FIELD",
            "message": "Field 'legacy_id' is deprecated. Use 'id' instead.",
            "sunset_date": "2025-12-31",
            "migration_guide": "https://docs.example.com/migration"
          }
        ]
      }

  graphql_deprecation:
    description: "Built-in deprecation directive"
    example: |
      type User {
        id: ID!
        legacyId: String @deprecated(reason: "Use 'id' instead")
        name: String @deprecated(reason: "Use 'firstName' and 'lastName'")
        firstName: String
        lastName: String
      }
    introspection: "Deprecated fields visible in schema introspection"

# Migration Strategies
migration:
  documentation:
    - "Create detailed migration guides"
    - "Provide code examples in multiple languages"
    - "Document all breaking changes"
    - "Explain rationale for changes"
    - "Offer side-by-side comparisons (old vs new)"

  sdk_updates:
    - "Release SDK updates simultaneously"
    - "Provide SDK migration guides"
    - "Offer automated migration scripts where possible"

  testing:
    - "Provide sandbox environment with new version"
    - "Offer compatibility checking tools"
    - "Support dual-version testing"

  support:
    - "Dedicated support channel for migration"
    - "Office hours or webinars"
    - "FAQ based on common migration issues"

  monitoring:
    - "Track version usage by client"
    - "Monitor error rates during migration"
    - "Identify clients not migrating"
    - "Proactive outreach to lagging clients"

# Version Lifecycle Management
lifecycle_management:
  version_support_policy:
    current_version:
      status: "Fully supported"
      description: "Latest version with all new features"
      support: "Full support and updates"
    
    previous_version:
      status: "Maintenance mode"
      description: "One version behind current"
      support: "Bug fixes and security patches only"
      duration: "12-24 months"
    
    deprecated_version:
      status: "Sunset announced"
      description: "Scheduled for removal"
      support: "Security patches only"
      duration: "6-12 months"
    
    removed_version:
      status: "No longer available"
      description: "Returns 410 Gone"
      support: "None"

  version_monitoring:
    metrics:
      - "Requests per version"
      - "Unique clients per version"
      - "Error rates by version"
      - "Deprecated feature usage"
      - "Migration progress"
    
    alerts:
      - "Spike in old version usage"
      - "Errors after new version release"
      - "Clients not migrating before sunset"

  communication:
    channels:
      - "API changelog"
      - "Developer newsletter"
      - "Status page"
      - "In-app notifications"
      - "Email to registered developers"
    
    content:
      - "New version announcements"
      - "Deprecation notices"
      - "Sunset warnings"
      - "Migration guides"
      - "Breaking change summaries"

# Implementation Patterns
implementation:
  shared_code:
    description: "Reuse code across versions"
    strategies:
      - "Version-specific controllers calling shared services"
      - "Transformers to convert between version formats"
      - "Feature flags for gradual rollout"
    
    example: |
      # Shared service
      class UserService {
        getUser(id) { /* ... */ }
      }
      
      # v1 controller
      class V1UserController {
        async getUser(req, res) {
          const user = await userService.getUser(req.params.id);
          res.json(transformToV1(user));
        }
      }
      
      # v2 controller
      class V2UserController {
        async getUser(req, res) {
          const user = await userService.getUser(req.params.id);
          res.json(transformToV2(user));
        }
      }

  request_transformers:
    description: "Convert old version requests to new format internally"
    benefit: "Single codebase, multiple API versions"
    example: |
      function transformV1RequestToV2(v1Request) {
        return {
          firstName: v1Request.name?.split(' ')[0],
          lastName: v1Request.name?.split(' ')[1],
          email: v1Request.email
        };
      }

  response_transformers:
    description: "Convert internal format to version-specific responses"
    example: |
      function transformToV1Response(internalUser) {
        return {
          id: internalUser.id,
          name: `${internalUser.firstName} ${internalUser.lastName}`,
          email: internalUser.email
        };
      }

  feature_flags:
    description: "Gradual rollout of new version features"
    example: |
      if (featureFlags.isEnabled('v2-user-format', user)) {
        return v2Response;
      }
      return v1Response;

# Testing Across Versions
testing:
  contract_tests:
    description: "Validate API contracts don't break"
    tools:
      - "Pact (consumer-driven contracts)"
      - "Spring Cloud Contract"
      - "OpenAPI validators"
    
    example: |
      test('v1 API maintains contract', async () => {
        const response = await request.get('/v1/users/123');
        expect(response.body).toMatchSchema(v1UserSchema);
      });

  compatibility_tests:
    description: "Test new version works with old clients"
    approach: "Run old client tests against new version"

  regression_tests:
    description: "Ensure old versions still work"
    approach: "Maintain test suites for each supported version"

  migration_tests:
    description: "Validate migration paths work"
    example: |
      test('v1 to v2 migration', () => {
        const v1User = { name: 'John Doe', email: 'john@example.com' };
        const v2User = migrateV1ToV2(v1User);
        expect(v2User).toEqual({
          firstName: 'John',
          lastName: 'Doe',
          email: 'john@example.com'
        });
      });

# Common Versioning Anti-Patterns
anti_patterns:
  - name: "Too many supported versions"
    problem: "Supporting 5+ versions simultaneously"
    impact: "Maintenance nightmare, bug multiplication"
    solution: "Support max 2-3 versions, aggressive sunset policy"

  - name: "No deprecation process"
    problem: "Removing features without notice"
    impact: "Breaking clients, reputation damage"
    solution: "Formal deprecation lifecycle (6-12 months)"

  - name: "Micro-versioning"
    problem: "New version for every small change"
    impact: "Version proliferation, client confusion"
    solution: "Batch changes, use semantic versioning"

  - name: "Inconsistent versioning strategy"
    problem: "Mix of URL, header, and parameter versioning"
    impact: "Confusion, unpredictability"
    solution: "Choose one strategy and stick to it"

  - name: "Not monitoring version usage"
    problem: "No visibility into client versions"
    impact: "Can't plan sunsets, accumulate technical debt"
    solution: "Track version metrics, log version with every request"

  - name: "Breaking changes without version bump"
    problem: "Changing behavior in v1.2 that breaks v1.1 clients"
    impact: "Silent client failures"
    solution: "Strict semantic versioning, major version for breaking changes"

  - name: "No migration guides"
    problem: "Announce new version without migration documentation"
    impact: "Clients can't migrate, old versions linger"
    solution: "Comprehensive migration guides with examples"

  - name: "Versioning everything"
    problem: "Creating new version for additions"
    impact: "Unnecessary complexity"
    solution: "Only version on breaking changes"

# Real-World Examples
examples:
  stripe:
    strategy: "Date-based versioning"
    pattern: "Stripe-Version: 2024-12-22"
    approach: "Changes released on specific dates"
    migration: "Clients can pin to specific version, upgrade when ready"
    reference: "https://stripe.com/docs/api/versioning"

  github:
    strategy: "Header-based versioning"
    pattern: "Accept: application/vnd.github.v3+json"
    approach: "Major versions with long support periods"
    reference: "https://docs.github.com/en/rest/overview/api-versions"

  twitter:
    strategy: "URI versioning"
    pattern: "/2/tweets (version 2 API)"
    approach: "Major version changes with new capabilities"
    reference: "https://developer.twitter.com/en/docs/twitter-api"

  aws:
    strategy: "No explicit versioning"
    pattern: "Backward-compatible changes only"
    approach: "Additive changes, deprecate old parameters"
    migration: "Clients opt-in to new features"

# Decision Framework
decision_framework:
  questions:
    - question: "Is this a public API or internal?"
      public: "URI versioning (most visible)"
      internal: "Header or no versioning (flexibility)"
    
    - question: "How many external clients?"
      many: "URI versioning (explicit, easy to migrate)"
      few: "Header versioning or no versioning"
    
    - question: "How often do breaking changes occur?"
      frequent: "URI versioning with clear lifecycle"
      rare: "Consider no versioning with deprecation"
    
    - question: "Do clients need per-resource versioning?"
      yes: "Header versioning or content negotiation"
      no: "URI versioning acceptable"
    
    - question: "Team experience with REST principles?"
      high: "Content negotiation possible"
      low: "URI versioning (simpler)"

  recommendation_matrix:
    public_api_many_clients: "URI versioning (/v1/...)"
    public_api_few_clients: "Header versioning"
    internal_api_stable: "No versioning (backward compatible)"
    internal_api_evolving: "URI or header versioning"
    graphql_api: "Schema deprecation (avoid versioning)"

