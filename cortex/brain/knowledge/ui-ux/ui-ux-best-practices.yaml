      - "Improves SEO with structured data"

# PERFORMANCE OPTIMIZATION
performance:
  css_optimization:
    critical_css:
      description: "Inline critical CSS in <head> for above-fold content"
      strategy: |
        <head>
          <style>
            /* Critical CSS: Hero, navigation, first viewport */
            .hero { ... }
            .main-nav { ... }
          </style>
          <link rel="preload" href="main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        </head>
    
    unused_css:
      tools:
        - "PurgeCSS: Remove unused CSS classes"
        - "Chrome DevTools Coverage: Identify unused code"
      
      strategy:
        - "Run PurgeCSS on production build"
        - "Tree-shake CSS frameworks (Tailwind, Bootstrap)"
        - "Load page-specific CSS only (code splitting)"
  
  image_optimization:
    format_selection:
      webp:
        - "50-90% smaller than PNG/JPG"
        - "Supported by all modern browsers"
        - "Use with fallback: <picture> element"
      
      svg:
        - "Vector graphics for icons, logos"
        - "Infinitely scalable"
        - "Can be styled with CSS"
      
      example: |
        <picture>
          <source srcset="logo.webp" type="image/webp">
          <img src="logo.png" alt="CORTEX Logo">
        </picture>
    
    lazy_loading:
      html: |
        <img src="large-image.jpg" loading="lazy" alt="Description">
      
      intersection_observer: |
        const images = document.querySelectorAll('img[data-src]');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              observer.unobserve(img);
            }
          });
        });
        images.forEach(img => observer.observe(img));
  
  javascript_optimization:
    defer_non_critical:
      - "Use defer attribute for non-critical scripts"
      - "Use async for independent scripts (analytics)"
      - "Load D3.js/visualization libraries only on pages that need them"
    
    example: |
      <!-- Critical: Load immediately -->
      <script src="main.js"></script>
      
      <!-- Non-critical: Defer until DOM ready -->
      <script src="animations.js" defer></script>
      
      <!-- Independent: Load asynchronously -->
      <script src="analytics.js" async></script>
  
  performance_budget:
    targets:
      page_load: "< 3 seconds on 3G connection"
      first_contentful_paint: "< 1.5 seconds"
      time_to_interactive: "< 3.5 seconds"
      total_page_weight: "< 2MB (HTML + CSS + JS + images)"
    
    monitoring:
      - "Lighthouse performance audit (score > 90)"
      - "WebPageTest.org for real-world testing"
      - "Chrome DevTools Network tab for waterfall analysis"

