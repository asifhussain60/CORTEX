# COMMON PITFALLS & SOLUTIONS
common_pitfalls:
  backdrop_filter_performance:
    problem: "Applying backdrop-filter to many elements causes lag"
    solution:
      - "Limit to <20 elements per page"
      - "Use will-change: backdrop-filter for hover animations"
      - "Provide solid background fallback"
      - "Test on low-end devices (mobile, older laptops)"
  
  color_contrast_on_glass:
    problem: "Text on glassmorphism backgrounds can have poor contrast"
    solution:
      - "Increase background opacity (70-90% vs 50-60%)"
      - "Add text shadow for better readability: text-shadow: 0 2px 4px rgba(0,0,0,0.5)"
      - "Use text-primary (#ffffff) for body text (21:1 contrast)"
      - "Test with WebAIM contrast checker"
  
  safari_webkit_prefix:
    problem: "backdrop-filter not working in Safari"
    solution: |
      .glass-card {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* Safari */
      }
  
  animation_jankyness:
    problem: "Animations stutter or lag on mobile"
    solution:
      - "Use transform and opacity only (GPU accelerated)"
      - "Add will-change: transform to animated elements"
      - "Limit animations to <10 concurrent elements"
      - "Provide prefers-reduced-motion fallback"
  
  responsive_breakpoint_conflicts:
    problem: "Layout breaks between breakpoints"
    solution:
      - "Test at exact breakpoint values (768px, 1024px)"
      - "Use min-width media queries (mobile-first)"
      - "Avoid fixed widths, use max-width and percentages"
      - "Test on real devices, not just DevTools"

