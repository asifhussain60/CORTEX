# GLASSMORPHISM PATTERNS
glassmorphism:
  core_technique:
    name: "Frosted Glass Effect"
    definition: >
      Translucent UI elements with backdrop blur creating depth perception.
      Combines background opacity (70-90%), blur filter (10-30px), and subtle borders.
    
    css_implementation: |
      .glass-card {
        background: rgba(26, 31, 58, 0.7);           /* 70% opacity */
        backdrop-filter: blur(10px) saturate(180%);  /* Frosted effect */
        -webkit-backdrop-filter: blur(10px) saturate(180%); /* Safari */
        border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle border */
        border-radius: 12px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
    
    browser_support:
      - "Chrome 76+ (full support)"
      - "Safari 9+ (with -webkit- prefix)"
      - "Firefox 103+ (full support)"
      - "Edge 79+ (full support)"
      - "Fallback: Solid background for unsupported browsers"
  
  component_patterns:
    navigation_bar:
      characteristics:
        - "Sticky position with backdrop blur"
        - "70% background opacity at rest"
        - "90% opacity on scroll with increased blur"
        - "Glow effect on scroll for depth"
      
      css_example: |
        .main-nav {
          position: sticky;
          top: 0;
          background: rgba(10, 14, 39, 0.75);
          backdrop-filter: blur(20px) saturate(180%);
          border-bottom: 1px solid rgba(0, 212, 255, 0.2);
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .main-nav.scrolled {
          background: rgba(10, 14, 39, 0.9);
          backdrop-filter: blur(30px) saturate(200%);
          box-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
        }
      
      interactive_states:
        - "Hover: Increase glow, reduce opacity by 5%"
        - "Active: Accent border color, stronger glow"
        - "Focus: Blue outline for keyboard navigation"
    
    glass_cards:
      characteristics:
        - "70% background opacity for depth"
        - "10px blur for frosted effect"
        - "Hover: -4px translateY for lift effect"
        - "Shadow elevation on hover"
      
      css_example: |
        .glass-card {
          background: var(--glass-bg);
          backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          border-radius: var(--radius-md);
          padding: var(--spacing-lg);
          box-shadow: var(--shadow);
          transition: all var(--transition-base);
        }
        
        .glass-card:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-lg);
          border-color: rgba(255, 255, 255, 0.15);
        }
      
      variants:
        - "glass-card-flat: No hover effect for static content"
        - "glass-card-primary: Accent border for emphasis"
        - "glass-card-warning: Yellow/orange border for evolution banners"
    
    hero_buttons:
      characteristics:
        - "Large touch targets (min 48x48px for accessibility)"
        - "Icon + text + optional caption layout"
        - "Gradient backgrounds with glassmorphism overlay"
        - "Smooth scale transform on hover"
      
      css_example: |
        .btn-hero {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
          padding: 2rem 1.5rem;
          background: rgba(26, 31, 58, 0.7);
          backdrop-filter: blur(10px);
          border: 2px solid var(--glass-border);
          border-radius: var(--radius-md);
          transition: all var(--transition-base);
        }
        
        .btn-hero:hover {
          transform: scale(1.05);
          border-color: var(--accent-primary);
          box-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
        }
      
      variants:
        - "btn-hero-primary: Cyan border (CORTEX Bible, primary actions)"
        - "btn-hero-secondary: Purple border (Explore Features)"
        - "btn-hero-story: Large with image icon (The Awakening)"
        - "btn-hero-vision: Gradient border (4.0 Vision)"
  
  best_practices:
    do:
      - "Use 70-90% opacity for glass effect balance"
      - "Apply blur(10-20px) for subtle frosted appearance"
      - "Add subtle white borders (10-15% opacity)"
      - "Combine with shadows for depth perception"
      - "Use GPU-accelerated properties (transform, opacity)"
      - "Test on light/dark backgrounds for versatility"
    
    dont:
      - "Don't exceed 30px blur (causes performance issues)"
      - "Don't use on small elements (<100px) - blur won't show"
      - "Don't stack >3 glass layers (readability suffers)"
      - "Don't animate backdrop-filter (CPU-intensive)"
      - "Don't use pure transparency (text becomes unreadable)"
      - "Don't forget -webkit- prefix for Safari"
  
  accessibility_considerations:
    contrast:
      - "Ensure 4.5:1 minimum contrast for text on glass"
      - "Test with color blindness simulators"
      - "Provide high contrast mode alternative"
    
    performance:
      - "Limit backdrop-filter to <20 elements per page"
      - "Use will-change for hover animations"
      - "Provide reduced-motion media query fallback"
    
    fallback: |
      /* Fallback for browsers without backdrop-filter */
      @supports not (backdrop-filter: blur(10px)) {
        .glass-card {
          background: var(--bg-secondary); /* Solid background */
          border: 1px solid rgba(255, 255, 255, 0.2);
        }
      }

# RESPONSIVE DESIGN
responsive_design:
  breakpoints:
    mobile:
      range: "320px - 767px"
      layout: "Single column, stacked navigation"
      font_scale: "0.85-0.9x base size"
      touch_targets: "Min 48x48px (iOS/Android standards)"
    
    tablet:
      range: "768px - 1023px"
      layout: "2-column grid, collapsible navigation"
      font_scale: "0.95x base size"
      touch_targets: "Min 44x44px"
    
    desktop:
      range: "1024px+"
      layout: "3-column grid, persistent navigation"
      font_scale: "1x base size"
      pointer_precision: "Fine (mouse/trackpad)"
  
  mobile_first_approach:
    principle: "Design for mobile, progressively enhance for larger screens"
    
    css_strategy: |
      /* Mobile styles (default) */
      .feature-grid {
        grid-template-columns: 1fr; /* Single column */
        gap: 1rem;
      }
      
      /* Tablet enhancement */
      @media (min-width: 768px) {
        .feature-grid {
          grid-template-columns: repeat(2, 1fr); /* 2 columns */
          gap: 1.5rem;
        }
      }
      
      /* Desktop enhancement */
      @media (min-width: 1024px) {
        .feature-grid {
          grid-template-columns: repeat(3, 1fr); /* 3 columns */
          gap: 2rem;
        }
      }
    
    benefits:
      - "Forces prioritization of critical content"
      - "Ensures performant experience on constrained devices"
      - "Simplifies testing (start simple, add complexity)"
      - "Aligns with majority mobile-first user behavior"
  
  touch_optimization:
    guidelines:
      - "Minimum touch target: 48x48px (iOS/Android)"
      - "Spacing between targets: 8px minimum"
      - "Hover states optional on mobile (use active states)"
      - "Prevent 300ms click delay with touch-action: manipulation"
    
    css_example: |
      .btn {
        min-width: 48px;
        min-height: 48px;
        padding: 12px 20px;
        touch-action: manipulation; /* Remove click delay */
      }
      
      /* Mobile-specific active state */
      @media (hover: none) {
        .btn:active {
          transform: scale(0.95);
          background: var(--accent-primary);
        }
      }
  
  image_optimization:
    responsive_images: |
      <!-- Serve appropriate image sizes -->
      <img 
        src="logo-800w.png"
        srcset="logo-400w.png 400w,
                logo-800w.png 800w,
                logo-1200w.png 1200w"
        sizes="(max-width: 768px) 400px,
               (max-width: 1024px) 800px,
               1200px"
        alt="CORTEX Logo"
        loading="lazy"
      />
    
    guidelines:
      - "Use WebP format with PNG fallback"
      - "Lazy load images below fold (loading='lazy')"
      - "Provide 1x, 2x, 3x variants for retina displays"
      - "Use CSS filters for theme variations (avoid duplicate images)"

# ANIMATION BEST PRACTICES
animations:
  performance_principles:
    gpu_acceleration:
      - "Use transform (translateX, scale, rotate) - GPU accelerated"
      - "Use opacity - GPU accelerated"
      - "Avoid animating: width, height, top, left - CPU intensive"
      - "Avoid animating: box-shadow, border - causes repaints"
    
    css_example: |
      /* ✅ GOOD: GPU-accelerated */
      .card:hover {
        transform: translateY(-4px) scale(1.02);
        opacity: 0.95;
      }
      
      /* ❌ BAD: CPU-intensive */
      .card:hover {
        margin-top: -4px;      /* Forces layout recalculation */
        box-shadow: 0 20px 60px black; /* Expensive repaint */
      }
  
  timing_guidelines:
    durations:
      micro_interactions: "100-200ms"  # Hover, focus states
      ui_transitions: "200-300ms"      # Page transitions, modals
      complex_animations: "300-500ms"  # Multi-step animations
    
    easing_functions:
      ease_out:
        value: "cubic-bezier(0.4, 0, 0.2, 1)"
        usage: "Elements entering viewport (fade in, slide in)"
      
      ease_in:
        value: "cubic-bezier(0.4, 0, 1, 1)"
        usage: "Elements exiting viewport (fade out, slide out)"
      
      ease_in_out:
        value: "ease-in-out"
        usage: "Bidirectional transitions (toggles, accordions)"
  
  accessibility:
    reduced_motion: |
      /* Respect user's motion preferences */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    
    guidelines:
      - "ALWAYS provide prefers-reduced-motion alternative"
      - "Reduce animation duration to <50ms for accessibility"
      - "Never auto-play animations >5 seconds (WCAG 2.2.2)"
      - "Provide pause button for animations >5 seconds"
  
  common_patterns:
    fade_in_up:
      description: "Element slides up 20px while fading in"
      css: |
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        
        .element {
          animation: fadeInUp 0.8s ease-out;
        }
      
      usage: "Hero content, page sections on scroll"
    
    scale_hover:
      description: "Element scales 5-10% on hover with smooth easing"
      css: |
        .button {
          transition: transform 200ms ease-out;
        }
        
        .button:hover {
          transform: scale(1.05);
        }
      
      usage: "Buttons, cards, interactive elements"
    
    glow_pulse:
      description: "Subtle glow effect for emphasis"
      css: |
        @keyframes glowPulse {
          0%, 100% {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
          }
          50% {
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
          }
        }
        
        .element {
          animation: glowPulse 2s ease-in-out infinite;
        }
      
      usage: "Call-to-action buttons, notifications (use sparingly)"

# ACCESSIBILITY (WCAG 2.1 LEVEL AA)
accessibility:
  color_contrast:
    requirements:
      normal_text:
        ratio: "4.5:1"
        size: "< 18px regular or < 14px bold"
        example: "Body text, captions, links"
      
      large_text:
        ratio: "3:1"
        size: ">= 18px regular or >= 14px bold"
        example: "Headings, hero text, large CTAs"
      
      ui_components:
        ratio: "3:1"
        elements: "Buttons, form inputs, icons with meaning"
    
    cortex_compliance:
      - "text-primary (#ffffff) on bg-primary (#0a0e27): 21:1 ✅ AAA"
      - "text-secondary (#a0a6c0) on bg-primary: 8.2:1 ✅ AAA"
      - "accent-primary (#00d4ff) on bg-primary: 4.9:1 ✅ AA"
      - "accent-secondary (#7b61ff) on bg-primary: 4.6:1 ✅ AA"
    
    testing_tools:
      - "Chrome DevTools: Lighthouse accessibility audit"
      - "WebAIM Contrast Checker: https://webaim.org/resources/contrastchecker/"
      - "axe DevTools: Browser extension for WCAG testing"
  
  keyboard_navigation:
    requirements:
      - "All interactive elements focusable with Tab key"
      - "Logical tab order (left-to-right, top-to-bottom)"
      - "Visible focus indicators (outline or border)"
      - "Enter/Space activates buttons and links"
      - "Escape closes modals and dropdowns"
    
    css_example: |
      /* Visible focus indicator */
      .btn:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
      }
      
      /* Skip to main content link */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: var(--accent-primary);
        color: var(--bg-primary);
        padding: 8px;
      }
      
      .skip-link:focus {
        top: 0;
      }
    
    testing:
      - "Navigate entire page using only Tab/Shift+Tab"
      - "Activate all buttons/links with Enter/Space"
      - "Close modals with Escape"
      - "Verify focus order matches visual order"
  
  screen_reader_support:
    semantic_html: |
      <!-- Use semantic elements -->
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#features">Features</a></li>
        </ul>
      </nav>
      
      <main>
        <h1>CORTEX 4.0</h1>
        <section aria-labelledby="features-heading">
          <h2 id="features-heading">Core Capabilities</h2>
        </section>
      </main>
    
    aria_labels: |
      <!-- Provide context for icons -->
      <button aria-label="Close modal">
        <span aria-hidden="true">✕</span>
      </button>
      
      <!-- Announce dynamic content changes -->
      <div role="status" aria-live="polite">
        <p>Test passed successfully</p>
      </div>
    
    guidelines:
      - "Use semantic HTML5 elements (nav, main, article, aside)"
      - "Provide alt text for all meaningful images"
      - "Use aria-label for icon-only buttons"
      - "Mark decorative images with alt='' (empty string)"
      - "Use aria-live for dynamic content updates"
  
  wcag_checklist:
    perceivable:
      - "✅ Text alternatives for non-text content (alt text)"
      - "✅ Color contrast meets 4.5:1 minimum"
      - "✅ Content readable without reliance on color alone"
      - "✅ Text resizable up to 200% without loss of functionality"
    
    operable:
      - "✅ All functionality available via keyboard"
      - "✅ No keyboard traps (can navigate away from all elements)"
      - "✅ Sufficient time for users to read content (no auto-advance)"
      - "✅ Clear focus indicators on all interactive elements"
    
    understandable:
      - "✅ Language declared in HTML (<html lang='en'>)"
      - "✅ Consistent navigation across pages"
      - "✅ Clear error messages with suggestions"
      - "✅ Labels for all form inputs"
    
    robust:
      - "✅ Valid HTML5 (passes W3C validator)"
      - "✅ ARIA attributes used correctly"
      - "✅ Compatible with assistive technologies"

# DOCUMENTATION-SPECIFIC PATTERNS
documentation_patterns:
  progressive_disclosure:
    concept: "Reveal complexity gradually - executive summary → technical details"
    
    structure: |
      <section>
        <!-- Level 1: Executive Summary (everyone) -->
        <div class="summary-card">
          <h2>Planning System 2.0</h2>
          <p>Autonomous feature planning with DoR/DoD compliance</p>
        </div>
        
        <!-- Level 2: Overview (interested users) -->
        <details>
          <summary>Learn More</summary>
          <p>Detailed overview with architecture diagram...</p>
        </details>
        
        <!-- Level 3: Technical Docs (developers) -->
        <a href="planning-system-deep-dive.html">
          Complete Technical Documentation →
        </a>
      </section>
    
    benefits:
      - "Reduces cognitive load for new users"
      - "Allows power users to dive deep"
      - "Improves page load performance (lazy load details)"
      - "Better SEO (clear hierarchy)"
  
  visual_hierarchy:
    principles:
      - "1-3-5 Rule: 1 hero message, 3 key points, 5 supporting details"
      - "F-Pattern Layout: Users scan top-left to bottom-right"
      - "Z-Pattern for Landing Pages: Logo → CTA → Features → Footer CTA"
    
    implementation:
      hero_section:
        - "Large logo (300px) with glow effect"
        - "H1 title with gradient (64px, bold)"
        - "Tagline (24px, secondary color)"
        - "4 large CTA buttons in grid"
      
      content_sections:
        - "H2 section titles (40px, 3rem top margin)"
        - "3-column feature grid on desktop"
        - "Glass cards for each feature (hover effects)"
        - "Metrics dashboard with 6 key numbers"
      
      footer:
        - "3-column link grid"
        - "Copyright with CORTEX 4.0 branding"
        - "Social links (GitHub, LinkedIn)"
  
  code_examples:
    syntax_highlighting: |
      <pre><code class="language-python">
      # Python example with Prism.js highlighting
      def calculate_complexity(file_path: Path) -> int:
          """Calculate cyclomatic complexity."""
          return analyzer.analyze(file_path)
      </code></pre>
    
    copy_to_clipboard: |
      <div class="code-block">
        <button class="copy-btn" aria-label="Copy code">
          <span aria-hidden="true">📋</span>
        </button>
        <pre><code>...</code></pre>
      </div>
    
    best_practices:
      - "Use Prism.js or Highlight.js for syntax highlighting"
      - "Provide copy-to-clipboard button for all code blocks"
      - "Use monospace font (SF Mono, Cascadia Code)"
      - "Line numbers for long examples (>10 lines)"
      - "Highlight changed lines with background color"
  
  navigation_breadcrumbs:
    structure: |
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li><a href="/">Home</a></li>
          <li><a href="/features">Features</a></li>
          <li aria-current="page">Planning System</li>
