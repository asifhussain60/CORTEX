# OVERVIEW
overview:
  concept: "CORTEX Glassmorphism Design System"
  definition: >
    A modern, accessible design system built on glassmorphism principles with dark mode aesthetics,
    progressive disclosure patterns, and performance-optimized animations. The system provides
    consistent visual language across CORTEX documentation, dashboards, and orchestrator interfaces.
  
  core_principles:
    - principle: "Visual Hierarchy"
      description: "Information organized by importance with progressive disclosure"
      rationale: "Reduces cognitive load, guides user attention to critical content"
    
    - principle: "Accessibility First"
      description: "WCAG 2.1 Level AA compliance with 4.5:1 contrast minimum"
      rationale: "Ensures usability for all users including those with disabilities"
    
    - principle: "Performance Optimization"
      description: "CSS animations under 300ms, lazy loading for heavy assets"
      rationale: "Maintains <3s page load time, smooth 60fps animations"
    
    - principle: "Responsive Design"
      description: "Mobile-first approach with 3 breakpoints (mobile, tablet, desktop)"
      rationale: "Seamless experience across devices from 320px to 4K screens"
  
  benefits:
    consistency:
      - "Unified design language across all CORTEX interfaces"
      - "Reusable component library reduces development time"
      - "Design tokens (CSS variables) enable theme customization"
      - "Predictable user experience across features"
    
    accessibility:
      - "WCAG 2.1 Level AA compliant color contrast"
      - "Keyboard navigation support (Tab, Enter, Escape)"
      - "Screen reader friendly with ARIA labels"
      - "Reduced motion mode for accessibility"
    
    performance:
      - "GPU-accelerated animations (transform, opacity)"
      - "Lazy loading for images and heavy visualizations"
      - "CSS-only effects (no JavaScript for styling)"
      - "Optimized asset delivery (<100KB CSS bundle)"
    
    developer_experience:
      - "Clear naming conventions (BEM methodology)"
      - "Comprehensive design token system"
      - "Copy-paste component patterns"
      - "Self-documenting CSS with inline comments"

