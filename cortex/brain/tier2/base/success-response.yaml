# =============================================================================
# CORTEX TIER 2 - SUCCESS RESPONSE TEMPLATE
# =============================================================================
# Purpose: Standard template for successful operation responses
# Tier: 2 (Engineering Standards - can be customized per team)
# Inherits: Header from cortex_brain/tier0/response-headers.yaml
# =============================================================================

metadata:
  template_id: "success-response"
  version: "1.0"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  description: "Base template for successful operation responses"
  tier: 2
  category: "base"

# =============================================================================
# TEMPLATE STRUCTURE
# =============================================================================

template:
  # Header is automatically injected from tier0/response-headers.yaml
  # DO NOT duplicate header configuration here
  
  structure:
    - section: "header"
      source: "tier0/response-headers.yaml"
      required: true
    
    - section: "content"
      required: true
      format: |
        ### ✅ {title}
        
        {summary}
        
        **Details:**
        {details}
    
    - section: "next_steps"
      required: false
      format: |
        ### Next Steps
        {next_steps}
    
    - section: "footer"
      source: "tier0/response-headers.yaml"
      required: false

# =============================================================================
# VARIABLE DEFINITIONS
# =============================================================================

variables:
  mandatory:
    - name: "title"
      type: "string"
      description: "Success title (e.g., 'Operation Complete')"
      example: "AC-DOC-001-01 Complete"
    
    - name: "summary"
      type: "string"
      description: "Brief summary of what succeeded"
      example: "Response header integration section added to CORTEX.prompt.md"
  
  optional:
    - name: "details"
      type: "string"
      description: "Detailed information about the success"
      default: ""
    
    - name: "next_steps"
      type: "list"
      description: "Recommended follow-up actions"
      default: []

# =============================================================================
# EXAMPLE OUTPUT
# =============================================================================

example:
  input:
    operation: "AC Execution"
    phase: "PHASE-DOC-REMEDIATION"
    orchestrator: "MasterOrchestrator"
    title: "AC-DOC-001-01 Complete"
    summary: "Response header integration section added to CORTEX.prompt.md"
    details: |
      - Added ~150 lines of documentation
      - Updated Table of Contents
      - Included configuration source reference
    next_steps:
      - "Proceed to AC-DOC-001-02"
      - "Run validation script"
  
  output: |
    ## 🧠 CORTEX AC Execution
    **Author:** Asif Hussain | **Phase:** PHASE-DOC-REMEDIATION | **Orchestrator:** MasterOrchestrator ✅
    
    ---
    
    ### ✅ AC-DOC-001-01 Complete
    
    Response header integration section added to CORTEX.prompt.md
    
    **Details:**
    - Added ~150 lines of documentation
    - Updated Table of Contents
    - Included configuration source reference
    
    ### Next Steps
    - Proceed to AC-DOC-001-02
    - Run validation script

# =============================================================================
# USAGE NOTES
# =============================================================================

usage:
  when_to_use:
    - "Operation completed successfully"
    - "AC-ID implementation complete"
    - "Tests passing"
    - "Validation successful"
  
  best_practices:
    - "Keep summary under 2 sentences"
    - "Use bullet points for details"
    - "Always suggest actionable next steps"
    - "Include relevant metrics when available"
