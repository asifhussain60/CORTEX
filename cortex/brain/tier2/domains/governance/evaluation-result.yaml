# =============================================================================
# CORTEX TIER 2 - GOVERNANCE EVALUATION RESULT TEMPLATE
# =============================================================================
# Purpose: Template for governance rule evaluation responses
# Domain: Governance
# Inherits: Header from cortex_brain/tier0/response-headers.yaml
# =============================================================================

metadata:
  template_id: "governance-evaluation-result"
  version: "1.0"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  description: "Template for governance compliance evaluation results"
  tier: 2
  category: "domain"
  domain: "governance"

# =============================================================================
# TEMPLATE STRUCTURE
# =============================================================================

template:
  structure:
    - section: "header"
      source: "tier0/response-headers.yaml"
      required: true
    
    - section: "summary"
      required: true
      format: |
        ### Governance Evaluation Summary
        
        | Metric | Value |
        |--------|-------|
        | Rules Evaluated | {rules_evaluated} |
        | Rules Passed | {rules_passed} |
        | Rules Failed | {rules_failed} |
        | Compliance Rate | {compliance_rate}% |
    
    - section: "violations"
      required: false
      condition: "rules_failed > 0"
      format: |
        ### ❌ Violations Detected
        
        {violations_table}
    
    - section: "passed"
      required: false
      format: |
        ### ✅ Passed Rules
        
        {passed_list}
    
    - section: "recommendations"
      required: false
      condition: "rules_failed > 0"
      format: |
        ### Recommendations
        
        {recommendations}

# =============================================================================
# VARIABLE DEFINITIONS
# =============================================================================

variables:
  mandatory:
    - name: "rules_evaluated"
      type: "integer"
      description: "Total number of rules evaluated"
    
    - name: "rules_passed"
      type: "integer"
      description: "Number of rules that passed"
    
    - name: "rules_failed"
      type: "integer"
      description: "Number of rules that failed"
    
    - name: "compliance_rate"
      type: "float"
      description: "Percentage of rules passed"
  
  optional:
    - name: "violations_table"
      type: "string"
      description: "Markdown table of violations"
    
    - name: "passed_list"
      type: "list"
      description: "List of passed rule IDs"
    
    - name: "recommendations"
      type: "list"
      description: "Remediation recommendations"

# =============================================================================
# EXAMPLE OUTPUT
# =============================================================================

example:
  output: |
    ## 🧠 CORTEX Governance Evaluation
    **Author:** Asif Hussain | **Phase:** PHASE-13 | **Orchestrator:** GovernanceOrchestrator ✅
    
    ---
    **Copyright © 2025-2026 Asif Hussain. All rights reserved.**
    
    ### Governance Evaluation Summary
    
    | Metric | Value |
    |--------|-------|
    | Rules Evaluated | 29 |
    | Rules Passed | 28 |
    | Rules Failed | 1 |
    | Compliance Rate | 96.6% |
    
    ### ❌ Violations Detected
    
    | Rule | Severity | File | Line | Issue |
    |------|----------|------|------|-------|
    | CORE-013 | BLOCKED | src/utils.py | 45 | Bare except clause |
    
    ### Recommendations
    
    1. Replace bare except with specific exception type
    2. Run `cortex-governance validate --fix` for auto-fix
