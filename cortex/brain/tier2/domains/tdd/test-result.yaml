# =============================================================================
# CORTEX TIER 2 - TDD TEST RESULT TEMPLATE
# =============================================================================
# Purpose: Template for test execution result responses
# Domain: TDD (Test-Driven Development)
# Inherits: Header from cortex_brain/tier0/response-headers.yaml
# =============================================================================

metadata:
  template_id: "tdd-test-result"
  version: "1.0"
  created_at: "2026-01-16T00:00:00Z"
  author: "Asif Hussain"
  description: "Template for test execution result reports"
  tier: 2
  category: "domain"
  domain: "tdd"

# =============================================================================
# TEMPLATE STRUCTURE
# =============================================================================

template:
  structure:
    - section: "header"
      source: "tier0/response-headers.yaml"
      required: true
    
    - section: "summary"
      required: true
      format: |
        ### Test Results: {test_suite}
        
        | Metric | Value |
        |--------|-------|
        | Total Tests | {total_tests} |
        | Passed | {passed} ✅ |
        | Failed | {failed} ❌ |
        | Skipped | {skipped} ⏭️ |
        | Duration | {duration}s |
    
    - section: "failures"
      required: false
      condition: "failed > 0"
      format: |
        ### ❌ Failed Tests
        
        {failure_details}
    
    - section: "coverage"
      required: false
      format: |
        ### Coverage Report
        
        {coverage_table}
    
    - section: "next_steps"
      required: true
      format: |
        ### Next Steps
        
        {next_steps}

# =============================================================================
# VARIABLE DEFINITIONS
# =============================================================================

variables:
  mandatory:
    - name: "test_suite"
      type: "string"
      description: "Name of test suite or file"
    
    - name: "total_tests"
      type: "integer"
      description: "Total number of tests run"
    
    - name: "passed"
      type: "integer"
      description: "Number of passed tests"
    
    - name: "failed"
      type: "integer"
      description: "Number of failed tests"
    
    - name: "duration"
      type: "float"
      description: "Test duration in seconds"
    
    - name: "next_steps"
      type: "list"
      description: "Recommended next steps"
  
  optional:
    - name: "skipped"
      type: "integer"
      default: 0
    
    - name: "failure_details"
      type: "string"
      description: "Details of failed tests"
    
    - name: "coverage_table"
      type: "string"
      description: "Coverage statistics"

# =============================================================================
# TDD PHASE INDICATORS
# =============================================================================

tdd_phases:
  red:
    emoji: "🔴"
    description: "Test written but failing (expected)"
    next_step: "Write implementation code"
  
  green:
    emoji: "🟢"
    description: "Test passing"
    next_step: "Refactor if needed, then next AC-ID"
  
  refactor:
    emoji: "🔵"
    description: "Improving code without changing behavior"
    next_step: "Run tests again to verify"

# =============================================================================
# EXAMPLE OUTPUT
# =============================================================================

example:
  output: |
    ## 🧠 CORTEX Test Results
    **Author:** Asif Hussain | **Phase:** PHASE-13 | **Orchestrator:** TDDOrchestrator ✅
    
    ---
    
    ### Test Results: tests/unit/test_observability.py
    
    | Metric | Value |
    |--------|-------|
    | Total Tests | 26 |
    | Passed | 26 ✅ |
    | Failed | 0 ❌ |
    | Skipped | 0 ⏭️ |
    | Duration | 1.34s |
    
    ### Coverage Report
    
    | Module | Statements | Coverage |
    |--------|------------|----------|
    | src/observability/metrics.py | 45 | 92% |
    | src/observability/tracing.py | 38 | 88% |
    | **Total** | **83** | **90%** |
    
    ### Next Steps
    
    1. 🟢 All tests passing - proceed to next AC-ID
    2. Consider adding edge case tests for 100% coverage
    3. Update phase YAML with completion status
