# =============================================================================
# TIER 1: AC-TO-DOMAIN MAPPINGS
# =============================================================================
# Maps all 87 unique Acceptance Criteria to 4 orchestrator domains:
# - TDD: Test-Driven Development & Quality Assurance
# - PLANNING: Phase Management & Strategic Planning  
# - ADO: Work Item Management & DevOps Integration
# - INTERACTION: Communication, Feedback & Knowledge Sharing
# =============================================================================

metadata:
  tier: 1
  title: "Acceptance Criteria to Domain Mappings"
  description: "Bidirectional mapping between AC-IDs and orchestrator domains for governance query"
  created_at: "2026-01-15T12:00:00Z"
  ac_count: 87
  domain_count: 4
  mapping_strategy: "Architecture-driven with semantic clustering"
  notes: |
    Mapping rationale:
    - AR-001-005: Governance & Foundation → PLANNING (phase/tier mgmt) + ADO (work tracking)
    - AR-006-009: Core Infrastructure → TDD (testing, validation) + ADO (operations)
    - AR-010-011: Advanced Testing → TDD (test frameworks, performance)
    - AR-012: Orchestrator Framework → ADO (work item linkage) + PLANNING (phase control)
    - AR-013: Brain Tier Activation → PLANNING (tier management) + ADO (AC tracking)
    - AR-014: Hallucination Prevention → PLANNING (phase immutability) + INTERACTION (audit logging)
    - AR-015: Vision Evolution → PLANNING (vision governance) + INTERACTION (decision tracking)
    - FR-001-006: Foundation Features → Mixed (based on concern)
    - FR-008-009: Orchestrator Features → ADO + TDD (based on nature)
    - NFR-* : Cross-cutting → All domains (performance, security, reliability)

