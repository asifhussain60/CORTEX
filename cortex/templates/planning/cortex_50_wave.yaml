# =============================================================================
# CORTEX 50-Wave Mega-Project Template: Multi-Year Initiative
# =============================================================================
# Use Case: Large-scale system transformation or platform migration
# Estimated Duration: 12-18 months
# Complexity: Very High
# Dependencies: Highly complex with cross-wave dependencies
#
# This template demonstrates:
# - Wave-based decomposition (50 waves organized into 10 epics)
# - Multi-team coordination (10+ teams)
# - Incremental delivery with continuous validation
# - Long-running initiative with milestone-based releases
# - Realistic CORTEX development pattern
#
# Structure:
# - Epic 1-3: Foundation (Architecture, Infrastructure, Core Services)
# - Epic 4-6: Feature Development (Primary Capabilities)
# - Epic 7-8: Integration & Testing
# - Epic 9: Performance & Optimization
# - Epic 10: Documentation & Launch
#
# How to Use:
# This is a REFERENCE template showing realistic scale. For actual use:
# 1. Extract relevant epics/waves for your project
# 2. Adapt to your team structure and timelines
# 3. Start with Epic 1 and iterate incrementally
# =============================================================================

project:
  id: "cortex-50-wave-mega-project"
  name: "CORTEX Platform: Complete Development Lifecycle"
  description: "Full-scale CORTEX platform development from inception to production"
  
  # Metadata
  author: "CORTEX Team"
  created_at: "2024-01-01"
  estimated_duration_months: 15
  team_count: 12
  
  # Project-level configuration
  max_concurrent_waves: 5
  milestone_releases: 10
  rollback_strategy: "per_epic"
  checkpoint_frequency: "weekly"

# =============================================================================
# EPIC 1: Foundation & Architecture (Waves 1-5)
# =============================================================================

epics:
  - id: "epic-001"
    name: "Foundation & Architecture"
    description: "Establish architectural foundation and core patterns"
    duration_weeks: 6
    waves:
      - id: "wave-001"
        name: "Project Initialization & Standards"
        description: "Setup project structure, coding standards, and governance"
        priority: "critical"
        effort_hours: 40
        phases:
          - "Define project charter"
          - "Setup git repository structure"
          - "Establish coding standards (CORE rules)"
          - "Configure CI/CD pipeline basics"
      
      - id: "wave-002"
        name: "Architectural Blueprint"
        description: "Design system architecture and component boundaries"
        priority: "critical"
        effort_hours: 60
        phases:
          - "Design hexagonal architecture layers"
          - "Define component contracts"
          - "Create ADR (Architecture Decision Records)"
          - "Design MCP integration architecture"
      
      - id: "wave-003"
        name: "Core Models & Enums"
        description: "Implement canonical data models and enumerations"
        priority: "high"
        effort_hours: 32
        phases:
          - "Define ExecutionMode enum"
          - "Define IntentType enum"
          - "Create base dataclasses"
          - "Implement validation logic"
      
      - id: "wave-004"
        name: "Registry Infrastructure"
        description: "Build git-backed registry for orchestrators and knowledge"
        priority: "high"
        effort_hours: 48
        phases:
          - "Design registry file format (YAML)"
          - "Implement GitBackedRegistry class"
          - "Build hot-reload mechanism"
          - "Create registration decorators"
      
      - id: "wave-005"
        name: "Testing Framework"
        description: "Establish TDD infrastructure and testing patterns"
        priority: "high"
        effort_hours: 36
        phases:
          - "Configure pytest with plugins"
          - "Create test fixtures and factories"
          - "Setup coverage reporting"
          - "Write testing guidelines"

# =============================================================================
# EPIC 2: Core Orchestrators (Waves 6-12)
# =============================================================================

  - id: "epic-002"
    name: "Core Orchestrators"
    description: "Implement foundational orchestrators for request processing"
    duration_weeks: 10
    waves:
      - id: "wave-006"
        name: "MasterOrchestrator Framework"
        description: "Build top-level orchestrator for request routing"
        priority: "critical"
        effort_hours: 56
      
      - id: "wave-007"
        name: "IntentRouter Implementation"
        description: "Implement intent classification and routing logic"
        priority: "critical"
        effort_hours: 48
      
      - id: "wave-008"
        name: "TDDOrchestrator (RED-GREEN-REFACTOR)"
        description: "Build TDD enforcement orchestrator with test-first workflow"
        priority: "critical"
        effort_hours: 64
      
      - id: "wave-009"
        name: "EnforcementOrchestrator (7-Agent System)"
        description: "Implement governance enforcement with 7 specialized agents"
        priority: "critical"
        effort_hours: 80
      
      - id: "wave-010"
        name: "LENSSynthesis Orchestrator"
        description: "Build Language-Examination-Navigation-Synthesis pipeline"
        priority: "high"
        effort_hours: 52
      
      - id: "wave-011"
        name: "RefactoringOrchestrator"
        description: "Implement semantic refactoring with multi-language support"
        priority: "high"
        effort_hours: 60
      
      - id: "wave-012"
        name: "PlanningOrchestrator (Phase 1: Basic)"
        description: "Initial planning orchestrator with linear execution"
        priority: "medium"
        effort_hours: 44

