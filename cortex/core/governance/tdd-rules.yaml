# ==============================================================================
# TIER 0 GOVERNANCE - TDD ORCHESTRATOR DOMAIN RULES
# ==============================================================================
# Purpose: Test-Driven Development orchestrator governance rules
# Domain: tdd
# Status: ACTIVE
#
# These rules apply to TDD orchestrators and their domain-specific operations.
# They extend CORE rules and add TDD-specific constraints.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
domain: tdd
category: DOMAIN_ORCHESTRATOR
precedence: HIGH

metadata:
  rule_count: 8
  domain_id: "tdd"
  domain_name: "Test-Driven Development"
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."
  created_at: "2026-01-15T00:00:00Z"

categories:
  - test_execution
  - code_coverage
  - assertion_validation
  - test_isolation
  - performance_testing
  - mutation_testing

# ==============================================================================
# RULE DEFINITIONS
# ==============================================================================
rules:
  # --------------------------------------------------------------------------
  # TDD-RULE-001: Test Lifecycle
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-001
    category: test_execution
    severity: blocked
    name: Test Lifecycle Enforcement
    description: |
      TDD orchestrator MUST enforce test lifecycle:
      1. Setup: Create isolated test environment
      2. Execute: Run test(s) with timeout enforcement
      3. Assert: Validate all assertions pass
      4. Teardown: Clean up state and resources
      5. Report: Log pass/fail with coverage metrics
      
      Each stage MUST be logged for audit trail.
    validation:
      - Setup logged with timestamp
      - Execution has <30s timeout per test
      - All assertions validated
      - Teardown completes before next test
      - Test report includes coverage percentage

  # --------------------------------------------------------------------------
  # TDD-RULE-002: Code Coverage Minimum
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-002
    category: code_coverage
    severity: blocked
    name: Minimum Code Coverage Enforcement
    description: |
      New code MUST have ≥80% test coverage.
      Existing code modifications MUST maintain current coverage %.
      Coverage MUST be calculated per file, not project-wide aggregate.
    validation:
      - Coverage report generated per file
      - New code coverage ≥80%
      - Existing code coverage maintained
      - Excluded: __init__.py, test files, stubs

  # --------------------------------------------------------------------------
  # TDD-RULE-003: Assertion Validation
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-003
    category: assertion_validation
    severity: blocked
    name: Assertion Message Requirement
    description: |
      All assertions MUST include descriptive error messages.
      Error messages MUST explain what was expected vs what was found.
      Format: "Expected [X] but got [Y] in context [Z]"
    validation:
      - Each assert statement has message parameter
      - Messages are human-readable
      - Messages include expected/actual values
      - No generic or truncated messages

  # --------------------------------------------------------------------------
  # TDD-RULE-004: Test Isolation
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-004
    category: test_isolation
    severity: blocked
    name: Test Independence & Isolation
    description: |
      Tests MUST be independent and can run in any order.
      No test may depend on state created by another test.
      Setup must create fresh state; teardown must clean completely.
    validation:
      - Each test is self-contained
      - Tests can run in isolation with same result
      - Fixtures are function-scoped (not shared between tests)
      - No global state mutations

  # --------------------------------------------------------------------------
  # TDD-RULE-005: Performance Baselines
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-005
    category: performance_testing
    severity: warning
    name: Performance Regression Detection
    description: |
      Performance-critical tests MUST include baseline assertions.
      If execution time exceeds 110% of baseline, test WARNS (not fails).
      Performance tests MUST run in isolated environment (CPU not throttled).
    validation:
      - Performance test includes baseline timing
      - Warnings logged if >110% of baseline
      - Test environment documented
      - Outliers not counted in average

  # --------------------------------------------------------------------------
  # TDD-RULE-006: Test Documentation
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-006
    category: test_execution
    severity: high
    name: Test Documentation Requirements
    description: |
      Each test function MUST have docstring explaining:
      1. What is being tested (ARRANGE)
      2. What action is performed (ACT)
      3. What is expected as result (ASSERT)
      
      Format: "Test that [feature] [when condition] [then result]"
    validation:
      - Docstring present on every test
      - Docstring follows AAA pattern
      - Feature being tested is clear
      - Behavior conditions are explicit

  # --------------------------------------------------------------------------
  # TDD-RULE-007: Mutation Testing Compatibility
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-007
    category: mutation_testing
    severity: high
    name: Mutation-Killing Test Strength
    description: |
      Tests MUST be strong enough to kill mutations.
      Each test must have assertions that catch value changes.
      Avoid if/else-less tests that pass for wrong reasons.
    validation:
      - Multiple assertions per test (not just one)
      - Assertions validate behavior, not just presence
      - Edge cases tested explicitly
      - Boundary values tested

  # --------------------------------------------------------------------------
  # TDD-RULE-008: Fixture Management
  # --------------------------------------------------------------------------
  - rule_id: TDD-RULE-008
    category: test_isolation
    severity: high
    name: Test Fixture Best Practices
    description: |
      Fixtures MUST be:
      - Minimal (create only what's needed)
      - Isolated (no shared state)
      - Documented (explain what they create)
      - Parameterized (where applicable)
      
      Fixture scope: function (default), not session/module
    validation:
      - Fixture scope is function or narrower
      - Fixture docstrings present
      - Fixtures create minimal state
      - No global fixtures modifying state

# ==============================================================================
# DOMAIN ORCHESTRATOR REQUIREMENTS
# ==============================================================================
tdd_orchestrator_requirements:
  id: TDDOrchestrator
  tier_access: [0, 1, 2]
  required_rules:
    - TDD-RULE-001
    - TDD-RULE-002
    - TDD-RULE-003
    - TDD-RULE-004
    - TDD-RULE-005
  mcp_tools:
    - run_tests
    - get_coverage
    - generate_test_report
    - validate_mutations
  capabilities:
    - test_execution
    - coverage_analysis
    - mutation_testing
    - performance_profiling
  performance_sla:
    test_execution_timeout: 30000  # milliseconds per test
    coverage_calculation_timeout: 60000
    report_generation_timeout: 10000

# ==============================================================================
# DOMAIN-TO-AC MAPPINGS
# ==============================================================================
# AC-IDs that relate to TDD domain rules
domain_ac_mappings:
  - ac_id: FR-008-01
    description: "E2E test coverage for orchestrator execution"
    rules: [TDD-RULE-001, TDD-RULE-002]
  - ac_id: FR-008-02
    description: "Integration tests for brain tier communication"
    rules: [TDD-RULE-001, TDD-RULE-004]
  - ac_id: AC-AR-012-01
    description: "Base orchestrator interface tests"
    rules: [TDD-RULE-001, TDD-RULE-003]

