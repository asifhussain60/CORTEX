# ==============================================================================
# TIER 0 GOVERNANCE - ADO ORCHESTRATOR DOMAIN RULES
# ==============================================================================
# Purpose: Azure DevOps integration orchestrator governance rules
# Domain: ado
# Status: ACTIVE
#
# These rules apply to ADO orchestrators and their domain-specific operations.
# They enforce constraints on work items, sprint management, and DevOps integrations.
# ==============================================================================

schema_version: '1.0'
governance_tier: 0
domain: ado
category: DOMAIN_ORCHESTRATOR
precedence: HIGH

metadata:
  rule_count: 8
  domain_id: "ado"
  domain_name: "Azure DevOps Integration"
  author: "Asif Hussain"
  copyright: "© 2025-2026 Asif Hussain. All rights reserved."
  created_at: "2026-01-15T00:00:00Z"

categories:
  - work_item_management
  - sprint_planning
  - board_automation
  - devops_integration
  - traceability
  - team_collaboration

# ==============================================================================
# RULE DEFINITIONS
# ==============================================================================
rules:
  # --------------------------------------------------------------------------
  # ADO-RULE-001: Work Item Traceability
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-001
    category: work_item_management
    severity: blocked
    name: Work Item Traceability Chain
    description: |
      Every work item (User Story, Task, Bug) MUST have:
      - AC-ID linkage (links to specific AC-ID)
      - Acceptance criteria section (copy from AC-ID)
      - Sprint assignment (current or future sprint)
      - Story points estimate (if story/feature)
      - Definition of Done checklist (all items checked)
      
      Traceability: AC-ID → Work Item → Sprint → Completion
    validation:
      - Work item has AC-ID tag
      - Acceptance criteria populated
      - Sprint assignment present
      - DoD checklist completed before closure

  # --------------------------------------------------------------------------
  # ADO-RULE-002: Sprint Planning Governance
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-002
    category: sprint_planning
    severity: high
    name: Sprint Planning & Capacity Management
    description: |
      Sprint planning MUST follow:
      - Sprint capacity set based on team velocity (hours or story points)
      - Work items prioritized by dependency and business value
      - High-risk items scheduled early in sprint
      - Contingency buffer (20% of capacity reserved for blockers)
      - Daily standup updates logged
      
      Sprint cannot exceed capacity; items must move to next sprint.
    validation:
      - Capacity set at sprint start
      - Velocity calculated from previous sprint
      - Priority order documented
      - Buffer capacity allocated
      - Daily updates logged

  # --------------------------------------------------------------------------
  # ADO-RULE-003: Board State Transitions
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-003
    category: board_automation
    severity: blocked
    name: Kanban Board State Rules
    description: |
      Work item state transitions MUST follow:
      - New → Approved (PR review passed)
      - Approved → Committed (assigned to sprint)
      - Committed → In Progress (developer starts work)
      - In Progress → Code Review (PR created)
      - Code Review → Testing (QA begins testing)
      - Testing → Done (all tests pass)
      - Done → Closed (verified in production)
      
      Invalid transitions blocked. State change requires comment.
    validation:
      - State transition follows defined flow
      - Backward transitions not allowed without reason
      - State change comment required
      - Timestamp recorded per state

  # --------------------------------------------------------------------------
  # ADO-RULE-004: Defect Management
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-004
    category: work_item_management
    severity: high
    name: Defect Triage & Resolution
    description: |
      Bug/defect work items MUST have:
      - Severity level (CRITICAL, HIGH, MEDIUM, LOW)
      - Root cause category (code, test, requirement, external)
      - Reproduction steps (clear, repeatable)
      - Impact assessment (which features/users affected)
      - Resolution priority (P0=today, P1=this sprint, P2=next sprint, P3=backlog)
      
      CRITICAL bugs must have SLA ≤4 hours to resolution.
    validation:
      - Severity assigned
      - Reproduction steps ≥3 steps
      - Root cause documented
      - SLA set per severity
      - Resolution tracked and verified

  # --------------------------------------------------------------------------
  # ADO-RULE-005: Release Management
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-005
    category: devops_integration
    severity: blocked
    name: Release & Deployment Governance
    description: |
      All releases MUST:
      - Have release notes with AC-ID references
      - Include version number following semantic versioning
      - Have deployment checklist (pre-deploy, deploy, post-deploy)
      - Have rollback plan documented
      - Be tagged in git with release version
      - Have deployment approval from stakeholder
      
      Hotfixes must follow same process with expedited approval.
    validation:
      - Release notes contain AC-IDs fixed
      - Version number valid (major.minor.patch)
      - Deployment checklist complete
      - Rollback documented
      - Git tag matches version
      - Approval logged

  # --------------------------------------------------------------------------
  # ADO-RULE-006: Code Review Requirements
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-006
    category: devops_integration
    severity: high
    name: Pull Request Review Policy
    description: |
      All PRs MUST:
      - Have minimum 2 reviewers (1 if hotfix)
      - Have AC-ID referenced in PR description
      - Include test coverage report
      - Have all conversations resolved before merge
      - Have deployment plan documented
      - Have linked work item
      
      Auto-merge allowed only for non-production branches.
    validation:
      - Reviewers assigned
      - AC-ID referenced
      - Coverage report attached
      - All comments resolved
      - Merge approval required
      - Work item linked

  # --------------------------------------------------------------------------
  # ADO-RULE-007: Continuous Integration
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-007
    category: devops_integration
    severity: blocked
    name: CI/CD Pipeline Requirements
    description: |
      CI/CD pipeline MUST:
      - Run on every PR (unit tests, linting, coverage)
      - Block merge if tests fail or coverage <80%
      - Run integration tests before deploy
      - Generate artifacts (packages, containers)
      - Deploy to staging before production
      - Have automated rollback on failure
      
      All pipeline stages must be logged with timestamps.
    validation:
      - Tests run on PR creation
      - Merge blocked on failure
      - Coverage threshold enforced
      - Artifacts generated
      - Staging deployment verified
      - Production deployment approved

  # --------------------------------------------------------------------------
  # ADO-RULE-008: Team Collaboration & Communication
  # --------------------------------------------------------------------------
  - rule_id: ADO-RULE-008
    category: team_collaboration
    severity: high
    name: Asynchronous Communication Standards
    description: |
      All team communication MUST:
      - Be logged in ADO work items (no ephemeral chat only)
      - Include context (what decision, why, alternatives considered)
      - Have decision log for important choices
      - Be accessible to all team members
      - Be updated when decisions change
      - Include stakeholder sign-off for major decisions
      
      Real-time communication (Slack) used only for urgent escalation.
    validation:
      - All decisions logged in work item
      - Context provided (background, rationale)
      - Alternatives documented
      - Stakeholder approval recorded
      - Update history maintained

# ==============================================================================
# DOMAIN ORCHESTRATOR REQUIREMENTS
# ==============================================================================
ado_orchestrator_requirements:
  id: ADOOrchestrator
  tier_access: [0, 1, 2]
  required_rules:
    - ADO-RULE-001
    - ADO-RULE-002
    - ADO-RULE-003
    - ADO-RULE-005
  mcp_tools:
    - query_work_items
    - create_work_item
    - update_board_state
    - generate_sprint_report
    - validate_release_readiness
  capabilities:
    - work_item_synchronization
    - sprint_planning_automation
    - board_state_management
    - release_orchestration
    - team_reporting
  performance_sla:
    work_item_query_timeout: 10000  # milliseconds
    board_update_timeout: 5000
    report_generation_timeout: 30000

# ==============================================================================
# DOMAIN-TO-AC MAPPINGS
# ==============================================================================
# AC-IDs that relate to ADO domain rules
domain_ac_mappings:
  - ac_id: PHASE-VISION-CORE
    description: "ADO integration for phase tracking and work items"
    rules: [ADO-RULE-001, ADO-RULE-002]
  - ac_id: FR-008
    description: "E2E validation via ADO work items"
    rules: [ADO-RULE-001]
  - ac_id: AC-AR-014-02
    description: "AC immutability verification via ADO"
    rules: [ADO-RULE-001]

