# Overview
solid_overview:
  acronym: "SOLID"
  full_name: "Five Principles of Object-Oriented Design"
  author: "Robert C. Martin (Uncle Bob)"
  year: "2000s"
  purpose: "Create maintainable, flexible, and scalable software"
  
  principles:
    S: "Single Responsibility Principle (SRP)"
    O: "Open/Closed Principle (OCP)"
    L: "Liskov Substitution Principle (LSP)"
