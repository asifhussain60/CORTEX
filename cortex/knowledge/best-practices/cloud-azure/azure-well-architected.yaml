# Azure Well-Architected Framework
# Authority: Microsoft Azure Architecture Center
# Source: https://learn.microsoft.com/en-us/azure/well-architected/
# Version: 1.0
# Created: 2026-02-14

metadata:
  title: "Azure Well-Architected Framework (5 Pillars)"
  version: "1.0"
  domain: "cloud-azure"
  source: "https://learn.microsoft.com/en-us/azure/well-architected/"
  tech_stack: ["azure", "cloud", "architecture"]
  applicable_intents: ["IMPLEMENT", "ANALYZE", "AUDIT", "DESIGN"]
  created: "2026-02-14"
  author: "CORTEX Phase 23"

overview:
  description: |
    Azure Well-Architected Framework provides architectural best practices across
    five pillars: Reliability, Security, Cost Optimization, Operational Excellence,
    and Performance Efficiency. Use this framework to assess and improve Azure workloads.
  
  five_pillars:
    - "Reliability: Build resilient systems that recover from failures"
    - "Security: Protect applications and data from threats"
    - "Cost Optimization: Manage costs to maximize value delivered"
    - "Operational Excellence: Keep systems running in production"
    - "Performance Efficiency: Scale to meet demands efficiently"

# ============================================================================
# PILLAR 1: RELIABILITY
# ============================================================================

reliability:
  description: "Ensure application recovers from failures and continues to function"
  
  design_patterns:
    retry_pattern:
      description: "Retry transient failures with exponential backoff"
      azure_services: ["Azure Functions", "Service Bus", "Storage"]
      implementation: |
        Use built-in retry policies in Azure SDKs. For custom code:
        - Exponential backoff (2^n seconds)
        - Max retry count (3-5 attempts)
        - Detect transient vs permanent failures
      example: "Service Bus retry policy with 3 attempts, exponential backoff"
    
    circuit_breaker:
      description: "Prevent cascading failures by failing fast"
      azure_services: ["API Management", "App Service"]
      implementation: |
        - Monitor failure rate threshold (e.g., 50% over 30 seconds)
        - Open circuit when threshold exceeded
        - Half-open state for periodic retry
        - Close circuit when success resumes
      tools: ["Polly library", "Azure Front Door"]
    
    bulkhead_isolation:
      description: "Isolate critical resources to prevent total failure"
      azure_services: ["App Service Plans", "SQL Database elastic pools"]
      example: "Separate App Service Plans for critical vs non-critical workloads"
  
  high_availability:
    availability_zones:
      description: "Deploy across availability zones for 99.99% uptime"
      applicable_services: ["Virtual Machines", "AKS", "SQL Database"]
      configuration: "Minimum 3 zones for zone-redundant services"
    
    geo_redundancy:
      description: "Replicate to secondary region for disaster recovery"
      azure_services: ["Storage (GRS/RA-GRS)", "SQL Database", "Cosmos DB"]
      rpo_rto:
        storage_grs: "RPO: < 15 minutes, RTO: hours"
        sql_active_geo: "RPO: < 5 seconds, RTO: < 30 seconds"
    
    auto_scaling:
      description: "Scale resources based on demand metrics"
      metrics: ["CPU", "Memory", "Queue Length", "HTTP requests"]
      rules: "Scale out at 70% CPU, scale in at 30% CPU (5-min average)"
  
  health_monitoring:
    health_endpoints:
      description: "Implement /health endpoints for liveness and readiness"
      checks:
        - "Database connectivity"
        - "Dependent API availability"
        - "Disk space availability"
      response: "HTTP 200 (healthy), 503 (unhealthy)"
    
    application_insights:
      description: "Monitor application performance and availability"
      metrics:
        - "Request rate and duration"
        - "Dependency call failures"
        - "Exception rate"
        - "Availability tests"
      alerts: "Alert on 95th percentile latency or 5xx error rate"

# ============================================================================
# PILLAR 2: SECURITY
# ============================================================================

security:
  description: "Protect applications and data through entire lifecycle"
  
  identity_access:
    azure_ad:
      description: "Use Azure AD for authentication and authorization"
      best_practices:
        - "Enable MFA for all users"
        - "Use managed identities for Azure resources"
        - "Apply principle of least privilege"
        - "Implement Conditional Access policies"
      avoid: "Hardcoded credentials, connection strings in code"
    
    rbac:
      description: "Use Role-Based Access Control for resource access"
      built_in_roles: ["Owner", "Contributor", "Reader"]
      custom_roles: "Create when built-in roles too permissive"
      scope: "Apply at resource group or resource level, not subscription"
    
    managed_identities:
      description: "Eliminate credentials in code using managed identities"
      types:
        system_assigned: "Lifecycle tied to Azure resource"
        user_assigned: "Independent lifecycle, reusable"
      use_cases: ["Key Vault access", "Storage access", "SQL Database"]
  
  network_security:
    network_segmentation:
      description: "Isolate workloads using Virtual Networks and subnets"
      pattern: "Hub-spoke topology with Azure Firewall"
      nsg_rules: "Deny by default, allow specific traffic explicitly"
    
    private_endpoints:
      description: "Access PaaS services via private IP, not public internet"
      applicable_services: ["Storage", "SQL Database", "Key Vault", "Cosmos DB"]
      benefit: "Eliminates data exfiltration risk"
    
    web_application_firewall:
      description: "Protect web apps from OWASP Top 10 threats"
      azure_services: ["Application Gateway", "Front Door", "CDN"]
      rulesets: ["OWASP ModSecurity Core Rule Set (CRS)"]
  
  data_protection:
    encryption_at_rest:
      description: "Encrypt data in storage using platform-managed or customer-managed keys"
      services: ["Storage", "SQL Database", "Cosmos DB", "Managed Disks"]
      key_management: "Use Azure Key Vault for customer-managed keys"
    
    encryption_in_transit:
      description: "Enforce TLS 1.2+ for all connections"
      configuration: "Disable TLS 1.0/1.1, enforce HTTPS"
      certificate_management: "Use Azure Managed Certificates or Key Vault"

# ============================================================================
# PILLAR 3: COST OPTIMIZATION
# ============================================================================

cost_optimization:
  description: "Manage costs to maximize value delivered to business"
  
  right_sizing:
    description: "Match resource size to workload requirements"
    tools: ["Azure Advisor", "Cost Management recommendations"]
    patterns:
      - "Use B-series VMs for low-CPU workloads"
      - "Use Premium SSD only when IOPS required"
      - "Use serverless (Functions, SQL Database) for intermittent workloads"
  
  reserved_instances:
    description: "Purchase 1-year or 3-year reservations for predictable workloads"
    savings: "Up to 72% compared to pay-as-you-go"
    applicable_services: ["Virtual Machines", "SQL Database", "App Service"]
  
  auto_shutdown:
    description: "Shut down non-production resources during off-hours"
    savings: "Up to 65% for dev/test environments"
    tools: ["Azure DevTest Labs", "Automation Runbooks"]
  
  resource_tagging:
    description: "Tag resources for cost allocation and governance"
    required_tags:
      - "Environment: dev|test|prod"
      - "CostCenter: <org-unit>"
      - "Owner: <team-email>"
    policy: "Enforce via Azure Policy"

# ============================================================================
# PILLAR 4: OPERATIONAL EXCELLENCE
# ============================================================================

operational_excellence:
  description: "Keep systems running in production through operations practices"
  
  devops_practices:
    ci_cd:
      description: "Automate build, test, and deployment pipelines"
      tools: ["Azure DevOps", "GitHub Actions"]
      stages: ["Build → Test → Deploy Dev → Deploy Prod"]
      gates: "Approval gates before production deployment"
    
    infrastructure_as_code:
      description: "Define infrastructure using declarative templates"
      tools: ["Bicep", "ARM templates", "Terraform"]
      benefits: "Version control, repeatability, disaster recovery"
    
    blue_green_deployment:
      description: "Deploy to staging slot, swap to production"
      azure_services: ["App Service deployment slots"]
      rollback: "Instant rollback by swapping slots"
  
  monitoring_logging:
    centralized_logging:
      description: "Aggregate logs in Log Analytics workspace"
      sources: ["Application Insights", "Activity Logs", "Resource Logs"]
      retention: "90 days minimum for production"
    
    alerting:
      description: "Create actionable alerts for critical metrics"
      channels: ["Email", "SMS", "Azure Monitor Action Groups"]
      best_practices:
        - "Alert on symptoms, not causes"
        - "Set appropriate thresholds to avoid alert fatigue"
        - "Include runbook links in alert descriptions"

# ============================================================================
# PILLAR 5: PERFORMANCE EFFICIENCY
# ============================================================================

performance_efficiency:
  description: "Scale to meet demands efficiently"
  
  caching:
    azure_cache_redis:
      description: "Cache frequently accessed data to reduce latency"
      patterns: ["Cache-aside", "Read-through", "Write-behind"]
      ttl: "Set expiration based on data volatility"
    
    cdn:
      description: "Cache static content at edge locations"
      azure_services: ["Azure CDN", "Front Door"]
      content_types: ["Images", "CSS", "JavaScript", "Videos"]
  
  database_optimization:
    indexing:
      description: "Create indexes on frequently queried columns"
      tools: ["SQL Database Index Advisor"]
      avoid: "Over-indexing (degrades write performance)"
    
    connection_pooling:
      description: "Reuse database connections"
      configuration: "Min pool size: 10, Max pool size: 100"
    
    read_replicas:
      description: "Offload read queries to replicas"
      azure_services: ["SQL Database read replicas", "Cosmos DB multi-region"]
  
  async_processing:
    message_queues:
      description: "Decouple workloads using queues"
      azure_services: ["Storage Queues", "Service Bus"]
      pattern: "Producer-consumer with competing consumers"
    
    event_driven:
      description: "React to events using Event Grid/Event Hubs"
      use_cases: ["Real-time analytics", "Workflow orchestration"]

# ============================================================================
# ASSESSMENT CHECKLIST
# ============================================================================

assessment:
  reliability:
    - "Are availability zones configured for critical services?"
    - "Is geo-redundancy enabled for data stores?"
    - "Do health endpoints exist and monitored?"
    - "Are retry policies configured with exponential backoff?"
  
  security:
    - "Is Azure AD used for all authentication?"
    - "Are managed identities used instead of credentials?"
    - "Is data encrypted at rest and in transit?"
    - "Are private endpoints used for PaaS services?"
  
  cost:
    - "Are resources right-sized per Azure Advisor?"
    - "Are reserved instances used for predictable workloads?"
    - "Are non-prod resources shut down after hours?"
    - "Are resources tagged for cost allocation?"
  
  operations:
    - "Is infrastructure defined as code (Bicep/ARM)?"
    - "Are deployment pipelines automated?"
    - "Are logs centralized in Log Analytics?"
    - "Are actionable alerts configured?"
  
  performance:
    - "Is caching implemented (Redis/CDN)?"
    - "Are database indexes optimized?"
    - "Is async processing used for long-running tasks?"
    - "Are auto-scaling rules configured?"

# ============================================================================
# INTEGRATION WITH CORTEX
# ============================================================================

cortex_integration:
  onboarding:
    description: "Used during Azure app onboarding to assess architecture"
    checks: "Automated scanning for Well-Architected compliance"
  
  recommendations:
    description: "CORTEX generates recommendations based on pillar violations"
    priority: "Security and Reliability violations flagged as P0"
  
  refactoring:
    description: "CORTEX suggests refactoring patterns for violations"
    examples:
      - "Hardcoded credentials → Managed Identity"
      - "No availability zones → Zone-redundant deployment"
      - "No caching → Azure Redis Cache integration"

