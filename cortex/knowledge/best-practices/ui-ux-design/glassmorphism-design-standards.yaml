ui_ux_section:
  principle: Unified glassmorphism design system for all CORTEX documentation with
    mobile-first responsive approach
  importance: "Ensures consistent user experience across all documentation views (STS\
    \ Showcase, \nOrchestrator Index, Planning System) with accessibility, performance,\
    \ and \nmobile-first design. WCAG 2.1 AA compliant.\n"
  reference_implementations:
  - name: STS Showcase
    paths:
    - /sts/index.html
    - /sts/security.html
    features:
    - Category navigation
    - Code comparison
  - name: Orchestrator Index
    path: /orchestrators/index.html
    features:
    - D3.js visualizations
    - Breadcrumb navigation
  - name: Planning System
    path: /orchestrators/planning-system.html
    features:
    - Feature documentation
  core_principles:
  - id: mobile_first_responsive
    principle: Mobile-First Responsive
    requirement: All views MUST be fully responsive (320px to 1920px+)
    severity: CRITICAL
  - id: touch_friendly
    principle: Touch-Friendly
    requirement: Interactive elements ΓëÑ44px for mobile accessibility
    severity: CRITICAL
  - id: performance_optimized
    principle: Performance
    requirement: Optimized for fast loading on mobile networks
    severity: HIGH
  - id: readability
    principle: Readability
    requirement: Text remains legible across all device sizes
    severity: CRITICAL
  - id: glassmorphism_consistency
    principle: Glassmorphism
    requirement: Consistent blur and transparency effects
    severity: HIGH
  - id: accessibility_wcag
    principle: Accessibility
    requirement: WCAG 2.1 AA compliant color contrast and navigation
    severity: CRITICAL
  rules:
  - id: ui_ux_001
    name: Single Source CSS Architecture
    severity: CRITICAL
    description: "All documentation pages MUST link to main.css. STS pages additionally\
      \ \nlink to sts.css. No inline styles, no page-specific style tags.\n"
    validation:
      file_structure:
        required:
        - docs/assets/css/main.css
        - docs/assets/css/sts.css
        forbidden:
        - docs/**/custom.css
        - docs/**/*.html with <style>
    examples:
      good:
      - description: Correct CSS linking (all pages)
        code: '<link rel="stylesheet" href="../assets/css/main.css">

          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          '
      - description: STS pages additional CSS
        code: '<link rel="stylesheet" href="../assets/css/main.css">

          <link rel="stylesheet" href="../assets/css/sts.css">

          '
      bad:
      - description: Inline styles (forbidden)
        code: '<div style="color: red;">Bad</div>

          '
        reason: Use CSS classes instead
      - description: Page-specific style tags (forbidden)
        code: "<style>\n  .custom { color: blue; }\n</style>\n"
        reason: Define in main.css or sts.css
      - description: Missing viewport meta tag
        code: '<link rel="stylesheet" href="main.css">

          <!-- Missing viewport tag breaks mobile -->

          '
        reason: Mobile responsiveness requires viewport meta
  - id: ui_ux_002
    name: Mobile-First Responsive Layout
    severity: CRITICAL
    description: 'All pages MUST support 320px to 1920px+ viewport widths. Use CSS
      Grid

      with mobile-first breakpoints. Interactive elements ΓëÑ44px.

      '
    responsive_breakpoints:
      mobile: 320px - 767px
      tablet: 768px - 1023px
      desktop: 1024px - 1439px
      large_desktop: 1440px+
    examples:
      good:
      - description: Mobile-first grid layout
        code: ".container {\n  display: grid;\n  grid-template-columns: 1fr;  /* Mobile:\
          \ single column */\n  gap: 1rem;\n}\n\n@media (min-width: 768px) {\n  .container\
          \ {\n    grid-template-columns: repeat(2, 1fr);  /* Tablet: 2 columns */\n\
          \  }\n}\n\n@media (min-width: 1024px) {\n  .container {\n    grid-template-columns:\
          \ repeat(3, 1fr);  /* Desktop: 3 columns */\n  }\n}\n"
      - description: Touch-friendly buttons
        code: ".btn {\n  min-height: 44px;  /* Apple HIG minimum */\n  min-width:\
          \ 44px;\n  padding: 12px 24px;\n}\n"
      bad:
      - description: Fixed pixel widths (breaks mobile)
        code: ".container {\n  width: 1200px;  /* BAD: breaks on mobile */\n}\n"
        reason: Use max-width with % or responsive units
      - description: Desktop-first media queries
        code: "@media (max-width: 768px) {\n  /* Override desktop styles */\n}\n"
        reason: Start mobile, enhance for larger screens
      - description: Too-small interactive elements
        code: ".btn {\n  height: 20px;  /* BAD: too small for touch */\n}\n"
        reason: Minimum 44px for mobile accessibility
  - id: ui_ux_003
    name: Standardized Color Palette
    severity: HIGH
    description: 'Use CSS variables from main.css for all colors. WCAG 2.1 AA contrast

      ratios required for text (4.5:1 normal, 3:1 large).

      '
    css_variables:
      background:
      - '--bg-primary: #0a0e27'
      - '--bg-secondary: #1a1f3a'
      - '--glass-bg: rgba(26, 31, 58, 0.7)'
      - '--glass-border: rgba(255, 255, 255, 0.1)'
      accent:
      - '--accent-primary: #00d4ff'
      - '--accent-secondary: #7b61ff'
      text:
      - '--text-primary: #ffffff'
      - '--text-secondary: #a0a6c0'
      - '--text-muted: #6b7280'
      status:
      - '--success: #00ff88'
      - '--warning: #ffa500'
      - '--danger: #ff4444'
      - '--info: #3b82f6'
      effects:
      - '--shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37)'
      - '--shadow-lg: 0 20px 60px 0 rgba(0, 0, 0, 0.5)'
      - '--glow: 0 0 20px rgba(0, 212, 255, 0.3)'
    examples:
      good:
      - description: Using CSS variables
        code: ".card {\n  background: var(--glass-bg);\n  border: 1px solid var(--glass-border);\n\
          \  color: var(--text-primary);\n}\n"
      - description: Universal background gradient
        code: "body {\n  background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);\n\
          \  background-attachment: fixed;\n}\n"
      bad:
      - description: Hard-coded colors (forbidden)
        code: ".card {\n  background: #123456;  /* BAD: use var(--glass-bg) */\n \
          \ color: #fff;          /* BAD: use var(--text-primary) */\n}\n"
        reason: Breaks theme consistency and maintainability
      - description: Insufficient contrast
        code: ".text {\n  color: #888;  /* Contrast ratio < 4.5:1 on dark bg */\n\
          }\n"
        reason: WCAG 2.1 AA requires 4.5:1 for normal text
  - id: ui_ux_004
    name: Glassmorphism Visual Effects
    severity: HIGH
    description: 'All cards/panels use frosted glass effect with backdrop-filter blur,

      semi-transparent backgrounds, and subtle borders.

      '
    effect_specifications:
      backdrop_blur: 10px
      background_opacity: '0.7'
      border_opacity: '0.1'
      box_shadow: var(--shadow)
    examples:
      good:
      - description: Standard glass card
        code: ".glass-card {\n  background: var(--glass-bg);\n  backdrop-filter: blur(10px);\n\
          \  -webkit-backdrop-filter: blur(10px);\n  border: 1px solid var(--glass-border);\n\
          \  border-radius: 16px;\n  box-shadow: var(--shadow);\n}\n"
      - description: Hover state with glow
        code: ".glass-card:hover {\n  border-color: var(--accent-primary);\n  box-shadow:\
          \ var(--glow);\n  transform: translateY(-2px);\n  transition: all 0.3s ease;\n\
          }\n"
      bad:
      - description: Missing backdrop-filter
        code: ".card {\n  background: rgba(26, 31, 58, 0.7);\n  /* Missing backdrop-filter\
          \ blur */\n}\n"
        reason: No frosted glass effect without blur
      - description: Opaque backgrounds (not glass)
        code: ".card {\n  background: #1a1f3a;  /* Solid, not translucent */\n}\n"
        reason: Glassmorphism requires semi-transparency
  - id: ui_ux_005
    name: WCAG 2.1 AA Accessibility Compliance
    severity: CRITICAL
    description: 'All text must meet 4.5:1 contrast ratio (3:1 for large text ΓëÑ18pt).

      Focus indicators required for keyboard navigation. Semantic HTML.

      '
    wcag_requirements:
      contrast_normal_text: 4.5:1
      contrast_large_text: '3:1'
      focus_indicator: 2px solid var(--accent-primary)
      semantic_html: true
      aria_labels: true
    examples:
      good:
      - description: Accessible button with focus
        code: "<button class=\"btn\" aria-label=\"Submit form\">\n  Submit\n</button>\n\
          \n.btn:focus {\n  outline: 2px solid var(--accent-primary);\n  outline-offset:\
          \ 2px;\n}\n"
      - description: Semantic navigation
        code: "<nav aria-label=\"Main navigation\">\n  <ul>\n    <li><a href=\"#home\"\
          >Home</a></li>\n  </ul>\n</nav>\n"
      bad:
      - description: Missing focus indicator
        code: ".btn:focus {\n  outline: none;  /* BAD: removes keyboard focus */\n\
          }\n"
        reason: Keyboard users cannot see focus state
      - description: Non-semantic HTML
        code: '<div onclick="navigate()">Click here</div>

          '
        reason: Use <button> or <a> for interactive elements
      - description: Low contrast text
        code: ".muted {\n  color: #444;  /* Contrast ratio < 4.5:1 on dark bg */\n\
          }\n"
        reason: Fails WCAG 2.1 AA minimum contrast
  - id: ui_ux_006
    name: Performance & Mobile Network Optimization
    severity: HIGH
    description: 'CSS/JS minified and compressed. Images optimized (<100KB). Lazy
      loading

      for images. Critical CSS inlined. Fast mobile performance.

      '
    performance_targets:
      css_size: <50KB minified+gzip
      js_size: <100KB minified+gzip
      image_size: <100KB per image
      lcp: <2.5s
      fid: <100ms
      cls: <0.1
    examples:
      good:
      - description: Lazy loading images
        code: "<img src=\"placeholder.jpg\" \n     data-src=\"large-image.jpg\" \n\
          \     loading=\"lazy\"\n     alt=\"Description\">\n"
      - description: Minified CSS reference
        code: '<link rel="stylesheet" href="main.min.css">

          '
      bad:
      - description: Large unoptimized images
        code: '<img src="screenshot-5MB.png">

          '
        reason: Slow load on mobile networks, optimize to <100KB
      - description: Blocking scripts in <head>
        code: "<head>\n  <script src=\"heavy-library.js\"></script>\n</head>\n"
        reason: Move to end of <body> or use defer/async
  - id: ui_ux_007
    name: Image and Media Centering
    severity: HIGH
    description: 'All standalone images, icons, diagrams, and media elements MUST be
      horizontally centered within their container. Hero icons and visualizations
      require explicit centering rules.

      '
    centering_requirements:
      block_images: 'display: block; margin: 0 auto'
      inline_icons: 'text-align: center on parent'
      svg_diagrams: 'margin: 0 auto or flexbox centering'
      hero_icons: 'display: block; text-align: center'
    examples:
      good:
      - description: Centered hero icon
        code: ".hero-icon {\n  font-size: 4rem;\n  display: block;\n  text-align: center;\n  margin-bottom: var(--spacing-md);\n}\n"
      - description: Centered block image
        code: "img.centered {\n  display: block;\n  margin: 0 auto;\n  max-width: 100%;\n}\n"
      - description: Flexbox centered container
        code: ".icon-container {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n"
      bad:
      - description: Uncentered hero icon
        code: ".hero-icon {\n  font-size: 4rem;\n  /* Missing centering - icon will align left */\n}\n"
        reason: Hero elements must be centered for visual balance
      - description: Float-based centering (deprecated)
        code: "img {\n  float: none;\n  /* Float doesn't center, use margin: auto */\n}\n"
        reason: Use modern CSS (flexbox, grid, or margin auto)
  - id: ui_ux_008
    name: Navigation Button Consistency
    severity: HIGH
    description: 'All navigation buttons (prev/next, footer nav) MUST have identical
      styling. Use dedicated nav-link class with consistent glassmorphism, not mixed
      glass-card + nav-link.

      '
    navigation_requirements:
      min_height: 44px (touch-friendly)
      consistent_padding: var(--spacing-md) var(--spacing-xl)
      glass_effect: backdrop-filter blur(10px)
      hover_state: border-color accent + glow + subtle transform
      class_pattern: 'nav-link prev|next (not glass-card nav-link)'
    examples:
      good:
      - description: Consistent navigation buttons
        code: ".nav-link {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--spacing-sm);\n  padding: var(--spacing-md) var(--spacing-xl);\n  color: var(--text-secondary);\n  text-decoration: none;\n  background: var(--glass-bg);\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n  border: 1px solid var(--glass-border);\n  border-radius: var(--radius-lg);\n  transition: all 0.3s ease;\n  min-height: 44px;\n}\n\n.nav-link:hover {\n  color: var(--accent-primary);\n  border-color: var(--accent-primary);\n  box-shadow: var(--glow);\n}\n"
      - description: Directional hover transforms
        code: ".nav-link.prev:hover {\n  transform: translateX(-4px);\n}\n\n.nav-link.next:hover {\n  transform: translateX(4px);\n}\n"
      bad:
      - description: Mixed class styling (inconsistent)
        code: '<a class="glass-card nav-link">Back</a>

          '
        reason: Use nav-link alone with built-in glass styling
      - description: Asymmetric navigation styling
        code: ".nav-prev { background: blue; }\n.nav-next { background: green; }\n"
        reason: Navigation buttons must have identical base styling
enforcement:
  automated_validation: true
  validation_frequency: On every maintenance Phase 5
  validation_tools:
  - tool: cortex-toolkit/validate_ui_standards.py
    checks:
    - CSS structure
    - Responsive breakpoints
    - Accessibility
  - tool: WAVE (WebAIM)
    checks:
    - WCAG compliance
    - Contrast ratios
    - ARIA labels
  - tool: Lighthouse
    checks:
    - Performance
    - Accessibility
    - Best practices
  enforcement_level:
  - severity: CRITICAL
    action: 'BLOCK: Cannot deploy without fixes'
  - severity: HIGH
    action: 'WARN: Requires review and justification'
  - severity: MEDIUM
    action: 'INFO: Suggested improvements'
maintenance:
  review_frequency: Quarterly or on major UI changes
  sync_validation: Phase 5 of cortex-maintenance.prompt.md
  change_process:
  - step: 1
    action: Update markdown source (glassmorphism-design-standards-v2.md)
    trigger: Design changes or new patterns identified
  - step: 2
    action: Auto-sync triggers (via file watcher or maintenance Phase 5)
    script: scripts/sync_knowledge_library.py
  - step: 3
    action: YAML updated with new rules/examples
    validation: Hash comparison + content validation
  - step: 4
    action: SKULL rules enforced on next commit/PR
    enforcement: brain-protection-rules.yaml
integration:
  orchestrators:
  - name: Documentation Generator Orchestrator
    usage: Validates all HTML files against these standards
    validation_on:
    - Build
    - Pre-commit
    - CI/CD
  - name: Code Review Orchestrator
    usage: Flags CSS/HTML not following glassmorphism patterns
    severity_threshold: HIGH
  - name: Sanitization Orchestrator
    usage: Auto-fixes inline styles and structure issues
    auto_fix: true
  brain_protection:
    skull_rule: UI_STANDARDS_ENFORCEMENT
    file: cortex-brain/brain-protection-rules.yaml
    enforcement_phase: Pre-commit validation
references:
  wcag_guidelines: https://www.w3.org/WAI/WCAG21/quickref/
  apple_hig_touch: https://developer.apple.com/design/human-interface-guidelines/ios/visual-design/adaptivity-and-layout/
  glassmorphism_spec: https://uxdesign.cc/glassmorphism-in-user-interfaces-1f39bb1308c9
  internal_docs:
  - cortex-brain/documents/templates/glassmorphism-design-standards-v2.md
  - docs/assets/css/main.css
  - docs/assets/css/sts.css
