      title: "Domain-Driven Design: Aggregates & Entities"
      keywords: ["DDD", "aggregates", "entities", "bounded-contexts", "modeling"]
      
    - path: "architecture/ddd-bounded-contexts.yaml"
      title: "Domain-Driven Design: Bounded Contexts"
      keywords: ["DDD", "bounded-contexts", "domain", "integration", "anti-corruption"]
      
    - path: "architecture/ddd-domain-events.yaml"
      title: "Domain-Driven Design: Domain Events"
      keywords: ["DDD", "domain-events", "event-sourcing", "integration"]
      
    - path: "architecture/engineering-anti-patterns.yaml"
