  database_access:
    description: "SQL query execution with Dapper ORM"
    pattern:
      query_example:
        code: |
          var results = FW.RunSqlQueryDapper<YourModel>(
              "SELECT * FROM Table WHERE Id = @Id",
              new { Id = 123 }
          );
        
        explanation: "Execute parameterized query and map results to model"
      
      update_example:
        code: |
          FW.RunSqlQueryDapper<object>(
              "UPDATE Login SET Active = '0' WHERE Authentication_Username = @Username",
              new { Username = username }
          );
        
        explanation: "Execute update query with parameters"

# BEST PRACTICES
best_practices:
  do:
    - practice: "Always inherit from TestBase"
      reason: "Provides access to all framework functionality"
      
    - practice: "Use explicit test phases (SetPhaseArrange, SetPhaseAct, SetPhaseAssert)"
      reason: "Improves debugging and test reporting"
      
    - practice: "Provide descriptive failure messages in all assertions"
      reason: "Speeds up debugging when tests fail"
      
    - practice: "Use FW.WaitUntil() instead of Thread.Sleep()"
      reason: "Eliminates flakiness and reduces test execution time"
      
    - practice: "Initialize page objects in TestInitialize"
      reason: "Ensures clean state for each test"
      
    - practice: "Use test data factories instead of hardcoded values"
      reason: "Creates valid, environment-independent test data"
      
    - practice: 'Link tests to ADO with [TestProperty("ADOTestCaseId", "ID")]'
      reason: "Maintains traceability to requirements"
      
    - practice: "Follow AAA (Arrange-Act-Assert) pattern"
      reason: "Creates readable, maintainable tests"
  
  dont:
    - practice: "Don't use Thread.Sleep()"
      reason: "Causes flaky tests and wastes execution time"
      alternative: "Use FW.WaitUntil() with explicit conditions"
      
    - practice: "Don't hardcode URLs"
      reason: "Tests break when environments change"
      alternative: "Use FW.BaseDomain.* properties"
      
    - practice: "Don't create tests without TestBase inheritance"
      reason: "Loses access to framework utilities"
      
    - practice: "Don't skip test phases"
      reason: "Makes debugging harder"
      
    - practice: "Don't use generic assertion messages"
      reason: "Slows down debugging"
      examples: ['Assert.IsTrue(x, "Failed");', 'Assert.AreEqual(a, b, "Error");']
      
    - practice: "Don't create page objects inside test methods"
      reason: "Violates separation of concerns, reduces reusability"
      alternative: "Initialize in TestInitialize as private fields"

