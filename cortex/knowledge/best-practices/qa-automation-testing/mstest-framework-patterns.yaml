        returns: "Member entity with valid login credentials"
        
      - method: "IdentityAccessManagementFactories.CreateEmployerThatCanLogIn()"
        returns: "Employer entity with valid login credentials"
        
      - method: "IdentityAccessManagementFactories.CreateMemberWithMfaOptOutThatCanLogIn()"
        returns: "Member with MFA opt-out that can login"
  
  test_environment_securables:
    description: "Environment-specific credentials and constants"
    properties:
      - property: "TestEnvironmentSecurables.PasswordResetValue"
        description: "Standard test password for reset scenarios"
        
      - property: "TestEnvironmentSecurables.PlumServicePassword"
        description: "Service account password"
        
      - property: "TestEnvironmentSecurables.DefaultAdminUsername"
