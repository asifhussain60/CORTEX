# OVERVIEW
overview:
  concept: "MSTest Framework with HEQAutomationCore"
  definition: >
    Enterprise test automation framework built on MSTest (Microsoft.VisualStudio.TestTools.UnitTesting)
    with custom HEQAutomationCore library. Implements Page Object Model pattern with explicit test phases,
    custom wait strategies, and comprehensive utility methods for web, database, and service testing.
  
  core_components:
    - component: "TestBase Class"
      description: "Base class providing framework infrastructure, browser control, wait utilities, database access"
      
    - component: "Page Object Model"
      description: "Encapsulation of web page elements and actions in reusable page classes"
      
    - component: "Test Phases"
      description: "Explicit Arrange-Act-Assert phases with phase markers for reporting and debugging"
      
    - component: "Framework Object (FW)"
      description: "Central access point to framework utilities, configuration, and helper methods"
  
  benefits:
    maintainability:
      - "Page objects centralize element locators for easy maintenance"
      - "TestBase inheritance provides consistent framework access"
      - "Explicit test phases improve readability and debugging"
    
    reusability:
      - "Shared page objects across multiple test classes"
      - "Common utilities via TestBase (login, data creation, assertions)"
      - "Standardized patterns reduce duplication"
    
    reliability:
      - "Custom wait strategies eliminate flakiness from timing issues"
      - "Framework-provided assertion helpers with detailed error messages"
      - "Built-in retry and timeout handling"

# TEST BASE INHERITANCE
test_base_inheritance:
  rule: "All test classes MUST inherit from TestBase"
  importance: "CRITICAL"
  
  pattern:
    code: |
      using HEQAutomationCore;
      using Microsoft.VisualStudio.TestTools.UnitTesting;
      
      namespace TestCore.Tests.Auth0
      {
          [TestClass]
          public class Auth0NonMemberLoginTests : TestBase
          {
              // Test implementation
          }
      }
    
    explanation: "TestBase provides access to FW object, Browser, test phase methods, and all framework utilities"
  
  available_objects:
    framework_object:
      name: "FW"
      description: "Main framework access point"
      key_properties:
        - property: "FW.Domain"
          description: "Current test environment domain"
          
        - property: "FW.BaseDomain.Client"
          description: "Client portal base URL"
          
        - property: "FW.BaseDomain.Classic"
          description: "Classic portal base URL"
          
        - property: "FW.WaitUntil()"
          description: "Custom wait with timeout and error messaging"
          
        - property: "FW.RunSqlQueryDapper<T>()"
          description: "Execute database queries with Dapper"
          
        - property: "FW.ConfigureWCFDefaultAdminCredentials()"
          description: "Configure WCF service with admin credentials"
    
    browser_object:
      name: "Browser"
      description: "Selenium WebDriver wrapper"
      key_methods:
        - method: "Browser.Load(url)"
          description: "Navigate to URL"
          
        - method: "Browser.Driver"
          description: "Access raw Selenium WebDriver instance"

# TEST PHASES
test_phases:
  principle: "Explicit test phases improve debugging and reporting"
  importance: "HIGH"
  
  phase_methods:
    - phase: "Arrange"
      method: "SetPhaseArrange()"
      description: "Mark test setup/data preparation phase"
      usage: "Call before test data creation and precondition setup"
      
    - phase: "Act"
      method: "SetPhaseAct()"
      description: "Mark test execution phase"
      usage: "Call before performing the action being tested"
      
    - phase: "Assert"
      method: "SetPhaseAssert()"
      description: "Mark test verification phase"
      usage: "Call before assertions and verification logic"
      
    - phase: "Complete"
      method: "SetPhaseComplete()"
      description: "Mark test completion (optional)"
      usage: "Call at end of successful test execution"
  
  pattern_example:
    code: |
      [TestMethod]
      public void TC123456_Feature_ExpectedBehavior()
      {
          // ============ ARRANGE PHASE ============
          SetPhaseArrange();
          
          var member = IdentityAccessManagementFactories.CreateMemberThatCanLogIn();
          var loginPage = new MemberLoginPage();
          
          // ============ ACT PHASE ============
          SetPhaseAct();
          
          Browser.Load(FW.BaseDomain.Classic);
          loginPage.Login(member.Authentication.Username, TestEnvironmentSecurables.PasswordResetValue);
          
          // ============ ASSERT PHASE ============
          SetPhaseAssert();
          
          var dashboard = new MemberHomePage();
          FW.WaitUntil(() => dashboard.IsLoaded(), 
              TimeSpan.FromSeconds(20), 
              () => "Member dashboard failed to load.");
          
          Assert.IsTrue(dashboard.IsLoaded(), 
              "User should be logged in and see the dashboard.");
      }

# WAIT STRATEGIES
wait_strategies:
  principle: "Always use FW.WaitUntil() instead of Thread.Sleep()"
  importance: "CRITICAL"
  
  wait_method_signature:
    code: |
      FW.WaitUntil(
          () => condition,                      // Lambda expression returning bool
          TimeSpan.FromSeconds(timeoutSeconds), // Timeout duration
          () => "Descriptive error message"     // Error message on timeout
      );
    
    explanation: "Primary wait pattern that polls condition until true or timeout"
  
  common_patterns:
    - pattern: "Wait for element to display"
      code: |
        FW.WaitUntil(() => _loginPage.LoginButton.IsDisplayed(), 
            TimeSpan.FromSeconds(10), 
            () => "Login button did not appear");
      
    - pattern: "Wait for page to load"
      code: |
        FW.WaitUntil(() => _dashboardPage.IsLoaded(), 
            TimeSpan.FromSeconds(20), 
            () => "Dashboard page failed to load");
      
    - pattern: "Wait for text to match"
      code: |
        FW.WaitUntil(() => _statusLabel.Text == "Success", 
            TimeSpan.FromSeconds(15), 
            () => "Status did not update to Success");
      
    - pattern: "Wait for element to be enabled"
      code: |
        FW.WaitUntil(() => _submitButton.IsEnabled(), 
            TimeSpan.FromSeconds(10), 
            () => "Submit button did not become enabled");
  
  timeout_guidelines:
    - operation: "Quick operations (button clicks, field population)"
      recommended_timeout: "5-10 seconds"
      
    - operation: "Page loads (full page navigation)"
      recommended_timeout: "15-20 seconds"
      
    - operation: "Data processing (reports, batch operations)"
      recommended_timeout: "30-60 seconds"
      
    - operation: "Long operations (imports, exports, background jobs)"
      recommended_timeout: "120+ seconds"

# ASSERTION PATTERNS
assertion_patterns:
  principle: "Always provide clear, descriptive failure messages"
  importance: "HIGH"
  
  mstest_assertions:
    boolean_assertions:
      - method: "Assert.IsTrue(condition, message)"
        example: 'Assert.IsTrue(dashboard.IsLoaded(), "User should be logged in and see the Member dashboard.");'
        
      - method: "Assert.IsFalse(condition, message)"
        example: 'Assert.IsFalse(errorMessage.IsDisplayed(), "Error message should not be visible on successful login.");'
    
    equality_assertions:
      - method: "Assert.AreEqual(expected, actual, message)"
        example: 'Assert.AreEqual(expectedBalance, actualBalance, $"Account balance mismatch. Expected: ${expectedBalance}, Actual: ${actualBalance}");'
        
      - method: "Assert.AreNotEqual(expected, actual, message)"
        example: 'Assert.AreNotEqual(0, transactionCount, "Transaction list should not be empty.");'
    
    null_checks:
      - method: "Assert.IsNull(object, message)"
        example: 'Assert.IsNull(errorResponse, "Expected no error response for valid input.");'
        
      - method: "Assert.IsNotNull(object, message)"
        example: 'Assert.IsNotNull(userProfile, "User profile should be loaded.");'
  
  custom_framework_assertions:
    description: "FWAssertions provides custom assertion helpers - check FWAssertions.cs before adding assertions"
    helpers:
      - method: "FW.AssertAreEqualAndContinue<T>(expected, actual, notes)"
        behavior: "Compare and continue on failure"
        
      - method: "FW.AssertIsTrueAndContinue(assertion, notes)"
        behavior: "Assert true and continue"
        
      - method: "FW.AssertAreEqualAndFailTest<T>(expected, actual, notes)"
        behavior: "Compare and fail immediately"
        
      - method: "FW.AssertIsTrueAndFailTest(assertion, notes)"
        behavior: "Assert true and fail immediately"
  
  message_guidelines:
    good_practices:
      - "Include expected and actual values when relevant"
      - "Make messages actionable for debugging"
      - "Use descriptive language about what should happen"
    
    bad_practices:
      - "Avoid vague messages like 'Failed' or 'Error'"
      - "Don't omit messages entirely"
      - "Don't use technical jargon without context"
    
    examples:
      good:
        - 'Assert.IsTrue(dashboard.IsLoaded(), "User should be logged in and see the Member dashboard.");'
        - 'Assert.AreEqual(expectedBalance, actualBalance, $"Account balance mismatch. Expected: ${expectedBalance}, Actual: ${actualBalance}");'
      
      bad:
        - 'Assert.IsTrue(dashboard.IsLoaded(), "Failed");'
        - 'Assert.AreEqual(expected, actual);  // No message'

# TEST STRUCTURE AND ORGANIZATION
test_structure:
  file_naming:
    rule: "File name MUST exactly match class name (excluding .cs extension)"
    importance: "CRITICAL"
    
    correct_examples:
      - file: "Auth0NonMemberLoginTests.cs"
        class: "public class Auth0NonMemberLoginTests"
        
      - file: "MemberDashboardNavigationTests.cs"
        class: "public class MemberDashboardNavigationTests"
    
    incorrect_examples:
      - file: "LoginTests.cs"
        class: "public class Auth0NonMemberLoginTests"
        problem: "Names don't match"
  
  required_attributes:
    class_level:
      - attribute: "[TestClass]"
        description: "MSTest class decorator"
        required: true
        
    method_level:
      - attribute: "[TestMethod]"
        description: "MSTest method decorator"
        required: true
        
    optional_attributes:
      - attribute: '[TestProperty("ADOTestCaseId", "123456")]'
        description: "Link to Azure DevOps test case"
        
      - attribute: '[TestProperty("Priority", "1")]'
        description: "Test priority (1=highest)"
        
      - attribute: '[TestProperty("Owner", "TeamName")]'
        description: "Team or individual ownership"
        
      - attribute: '[TestCategory("Smoke")]'
        description: "Test category for filtering (multiple allowed)"
  
  test_naming_convention:
    format: "TC[ADO_ID]_[FeatureArea]_[ExpectedBehavior]"
    
    rules:
      - "Always start with TC followed by ADO work item ID"
      - "Use PascalCase for all parts"
      - "Be descriptive about feature and expected outcome"
      - "Keep concise but clear (50-80 characters preferred)"
    
    examples:
      - "TC193006_Auth0NonMemberLoginPage_LoginHappyPathAgreeToPrivacy_LoadsUnifiedEmployerDashboard"
      - "TC195976_Auth0NonMemberLoginPage_PartnerLogin_LoadsPartnerHomePage"
      - "TC195989_Auth0NonMemberLoginPage_BrokerLogin_LoadsBrokerHomePage"
  
  test_initialize_cleanup:
    pattern:
      code: |
        [TestInitialize]
        public void TestSetup()
        {
            // Runs before EACH test method
            FW.ConfigureWCFDefaultAdminCredentials();
            _pageObject = new YourPageObject();
        }
        
        [TestCleanup]
        public void TestCleanup()
        {
            // Runs after EACH test method
            // Clean up resources if needed
        }
      
      explanation: "TestInitialize runs before each test, TestCleanup runs after each test"

