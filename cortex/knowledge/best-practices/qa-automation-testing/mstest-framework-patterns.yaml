      - method: "LoginUtilities.LoginAsUser(username, password)"
        description: "Login with specific credentials"
        
      - method: "LoginUtilities.ImpersonateEntity(entityId, type)"
        description: "Impersonate member or employer"
        example: "LoginUtilities.ImpersonateEntity(employerId, ImpersonationEntityType.Employer);"
  
  test_data_factories:
    description: "Factory methods for creating test entities"
    methods:
