# ANTI-PATTERNS
anti_patterns:
  - pattern: "Using Thread.Sleep() for synchronization"
    problem: "Causes flaky tests, wastes time"
    solution: "Use FW.WaitUntil() with explicit conditions"
    severity: "CRITICAL"
    
  - pattern: "Hardcoding test data in tests"
    problem: "Tests break when data changes, not portable across environments"
    solution: "Use factory methods and DataCreator patterns"
    severity: "HIGH"
    
  - pattern: "Creating page objects in test methods"
    problem: "Violates DRY, makes tests harder to maintain"
    solution: "Declare as private fields, initialize in TestInitialize"
    severity: "MEDIUM"
    
  - pattern: "Missing or generic assertion messages"
    problem: "Difficult to debug failures"
    solution: "Always provide descriptive, actionable failure messages"
    severity: "MEDIUM"
    
  - pattern: "Not using test phases"
    problem: "Reduces readability and debugging capability"
    solution: "Always call SetPhaseArrange/Act/Assert"
    severity: "LOW"

