# COMPANY OVERVIEW
company_overview:
  name: "COMPANY, Inc."
  industry: "Healthcare & Financial Services"
  focus: "Health Savings Accounts and Benefits Administration"
  
  mission: "Provide technology-enabled benefits administration platform for health savings and spending accounts"
  
  core_products:
    - "Health Savings Accounts (HSA)"
    - "Flexible Spending Accounts (FSA)"
    - "Dependent Care Reimbursement Accounts (DCRA)"
    - "Health Reimbursement Arrangements (HRA)"
    - "Commuter Benefits"
    - "COBRA Administration"

# PRODUCT DOMAINS
product_domains:
  health_savings_account:
    acronym: "HSA"
    full_name: "Health Savings Account"
    description: "Tax-advantaged medical savings account available to taxpayers enrolled in high-deductible health plan"
    
    key_features:
      - "Triple tax advantage (tax-deductible, tax-free growth, tax-free withdrawals for qualified medical expenses)"
      - "Portable (follows the member even if they change employers or insurance)"
      - "Rollover (unused funds roll over year to year)"
      - "Investment options available"
    
    eligibility:
      - "Must be enrolled in High Deductible Health Plan (HDHP)"
      - "Cannot be claimed as dependent on someone else's tax return"
      - "Cannot be enrolled in Medicare"
      - "Cannot have other health coverage (with exceptions)"
    
    contribution_limits:
      year_2023:
        individual: "$3,850"
        family: "$7,750"
        catch_up_55_plus: "$1,000"
    
    common_terminology:
      - term: "HDHP"
        definition: "High Deductible Health Plan - Required for HSA eligibility"
      - term: "Qualified Medical Expense"
        definition: "IRS-approved medical expenses eligible for tax-free withdrawal"
      - term: "Catch-up Contribution"
        definition: "Additional contribution allowed for those 55 and older"
  
  flexible_spending_account:
    acronym: "FSA"
    full_name: "Flexible Spending Account"
    description: "Tax-advantaged account that allows employees to set aside pre-tax money for eligible expenses"
    
    types:
      healthcare_fsa:
        name: "Healthcare FSA"
        description: "For eligible medical, dental, and vision expenses"
        use_it_or_lose_it: true
        grace_period: "2.5 months or $500 rollover option"
        
      limited_purpose_fsa:
        name: "Limited Purpose FSA"
        description: "Compatible with HSA, covers only dental and vision"
        compatible_with_hsa: true
        
      dependent_care_fsa:
        name: "Dependent Care FSA (DCRA)"
        description: "For dependent daycare expenses"
        separate_account: true
  
  reimbursement_account:
    acronym: "RA"
    full_name: "Reimbursement Account"
    description: "General term for accounts that reimburse members for eligible expenses"
    
    types:
      - "HCRA - Health Care Reimbursement Account"
      - "DCRA - Dependent Care Reimbursement Account"
      - "LPFSA - Limited Purpose FSA"
    
    reimbursement_process:
      - "Member incurs eligible expense"
      - "Member submits claim with receipt/documentation"
      - "Claim is reviewed for eligibility"
      - "Approved claim is reimbursed to member"
    
    coverage_types:
      - type: "Self"
        description: "Individual coverage only"
        
      - type: "Couple"
        description: "Member plus spouse"
        
      - type: "Family"
        description: "Member plus dependents"
        
      - type: "Self + Children"
        description: "Member plus children (no spouse)"
  
  health_reimbursement_arrangement:
    acronym: "HRA"
    full_name: "Health Reimbursement Arrangement"
    description: "Employer-funded account that reimburses employees for qualified medical expenses"
    
    key_differences_from_hsa:
      - "Employer-funded only (no employee contributions)"
      - "Not portable (stays with employer)"
      - "No investment options"
      - "Employer controls rollover rules"

# USER ROLES AND PORTALS
user_roles:
  member:
    description: "Individual employee or consumer with health savings/spending account"
    portal: "Member Portal / Classic Portal"
    key_actions:
      - "View account balance"
      - "Submit claims"
      - "Upload receipts"
      - "View transactions"
      - "Manage investments (HSA)"
      - "Update personal information"
    
    authentication_types:
      - "Standard username/password"
      - "Multi-factor authentication (MFA)"
      - "Biometric (mobile app)"
  
  employer:
    description: "Business/organization that provides benefits to members"
    portal: "Employer Portal / Unified Employer Dashboard"
    key_actions:
      - "Manage employee eligibility"
      - "Process contributions"
      - "Generate reports"
      - "View employer dashboard"
      - "Manage plan configurations"
      - "Submit employee updates (new hires, terminations)"
    
    authentication:
      - "Auth0 business login"
      - "Privacy and security agreement required"
  
  partner:
    description: "Third-party organizations that integrate with COMPANY"
    portal: "Partner Portal"
    key_actions:
      - "Manage partner-specific settings"
      - "Access partner reports"
      - "View partner dashboard"
    
    authentication:
      - "Auth0 business login"
      - "Partner-specific credentials"
  
  broker:
    description: "Benefits brokers who help employers select and manage plans"
    portal: "Broker Portal"
    key_actions:
      - "View client accounts"
      - "Access broker dashboard"
      - "Generate broker reports"
    
    authentication:
      - "Auth0 business login"
  
  administrator:
    description: "COMPANY internal support staff"
    portal: "Admin Portal"
    key_actions:
      - "Member impersonation"
      - "Account adjustments"
      - "Dispute resolution"
      - "System administration"

# COMMON BUSINESS PROCESSES
business_processes:
  enrollment:
    description: "Process of enrolling members in health savings/spending accounts"
    steps:
      - "Employer provides employee eligibility file"
      - "COMPANY creates member accounts"
      - "Members receive welcome communications"
      - "Members activate accounts and set up authentication"
    
    election_amount:
      description: "Amount member elects to contribute annually"
      timing: "Typically during open enrollment period"
  
  contributions:
    types:
      employer_contribution:
        description: "Funds contributed by employer to member account"
        frequency: "Per pay period or lump sum"
        
      employee_contribution:
        description: "Payroll deductions from employee's paycheck"
        frequency: "Per pay period"
        tax_treatment: "Pre-tax"
    
    scheduled_deductions:
      description: "Regular payroll deductions scheduled to occur each pay period"
      automation: "Automatically processed by payroll integration"
  
  claims_and_reimbursement:
    claim_submission:
      methods:
        - "Online portal upload"
        - "Mobile app capture"
        - "Fax submission"
        - "Email submission"
      
      required_documentation:
        - "Itemized receipt"
        - "Explanation of Benefits (EOB) for insurance claims"
        - "Date of service"
        - "Provider name"
        - "Amount"
    
    claim_processing:
      - "Auto-adjudication for valid claims with proper documentation"
      - "Manual review for complex or incomplete claims"
      - "Substantiation for debit card transactions"
    
    reimbursement_methods:
      - "Direct deposit (ACH)"
      - "Paper check"
      - "Debit card (if available)"
  
  carryover_and_rollover:
    hsa_rollover:
      description: "All HSA funds roll over year to year"
      limit: "No limit"
      
    fsa_carryover:
      description: "Limited FSA carryover or grace period"
      options:
        - "Grace period: 2.5 months into next year"
        - "Carryover: Up to $500 to next year"
        - "Use it or lose it: No carryover"
      
    scheduled_carryover:
      description: "Scheduled transfer of carryover funds at plan year transition"
      automation: "Processed via scheduled items"
  
  card_operations:
    debit_card:
      description: "COMPANY debit card for direct payment at point of sale"
      types:
        - "HSA debit card"
        - "FSA debit card"
        - "HRA debit card"
      
      substantiation:
        description: "Process of verifying debit card transactions are for eligible expenses"
        required_when: "Transaction doesn't auto-substantiate"
        
    card_suspension:
      reasons:
        - "Unsubstantiated transactions"
        - "Insufficient funds"
        - "Fraud prevention"
      
      resolution:
        - "Submit missing documentation"
        - "Add funds to account"
        - "Contact customer service"

# TESTING TERMINOLOGY
testing_terminology:
  common_test_scenarios:
    - scenario: "Happy Path"
      description: "Ideal user flow with all valid inputs and expected outcomes"
      
    - scenario: "Spend Down"
      description: "Account approaching or reaching zero balance"
      
    - scenario: "Substantiation"
      description: "Verifying legitimacy of card transactions or claims"
      
    - scenario: "Plan Year Transition"
      description: "Moving from one benefits year to the next"
      
    - scenario: "Rollover/Carryover"
      description: "Transferring unused funds to new plan year"
  
  test_data_entities:
    - entity: "Member"
      description: "Individual with account"
      factory: "IdentityAccessManagementFactories.CreateMemberThatCanLogIn()"
      
    - entity: "Employer"
      description: "Organization providing benefits"
      factory: "IdentityAccessManagementFactories.CreateEmployerThatCanLogIn()"
      
    - entity: "Reimbursement Account"
      description: "Account for reimbursements (HSA, FSA, HRA)"
      builder: "ReimbursementAccountBuilder"
      
    - entity: "Scheduled Item"
      description: "Scheduled deduction or carryover"
      types: ["ScheduledDeduction", "ScheduledCarryover"]

# INTEGRATION POINTS
integration_points:
  authentication:
    auth0:
      description: "Auth0 identity platform for business user authentication"
      portals: ["Employer Portal", "Partner Portal", "Broker Portal"]
      required: "Privacy and security agreement acceptance"
    
    member_auth:
      description: "Member-specific authentication"
      portal: "Member Portal"
      options: ["Username/Password", "MFA", "Biometric"]
  
  payroll_integration:
    description: "Integration with employer payroll systems"
    data_exchange:
      - "Employee eligibility files"
      - "Contribution amounts"
      - "Deduction schedules"
    
  wcf_services:
    description: "Windows Communication Foundation services for backend operations"
    configuration: "FW.ConfigureWCFDefaultAdminCredentials()"
    usage: "Required for test scenarios involving service-level operations"

