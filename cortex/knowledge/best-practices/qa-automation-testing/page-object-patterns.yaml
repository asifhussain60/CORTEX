# PAGE OBJECT MODEL OVERVIEW
overview:
  concept: "Page Object Model (POM)"
  definition: >
    Design pattern that creates an object repository for web UI elements. Each web page is represented
    as a class, encapsulating elements and actions available on that page.
  
  benefits:
    - "Reduced code duplication"
    - "Easy maintenance when UI changes"
    - "Improved test readability"
    - "Separation of test logic from page structure"
    - "Reusable page interactions across multiple tests"

# NAMING AND STRUCTURE
naming_and_structure:
  class_naming:
    format: "[PageName]Page"
    rule: "Must end with 'Page' suffix"
    examples:
      - "MemberHomePage"
      - "BusinessLoginPage"
      - "TransactionHistoryPage"
    anti_pattern: "DO NOT include ticket/work item IDs in class names"
  
  inheritance:
    base_class: "PageBase"
    requirement: "MANDATORY"
    provided_by: "HEQAutomationCore.BaseClasses"
    
  file_organization:
    location: "AutomationCore/PageClassesCore/"
    structure:
      - "Auth0/ - Authentication pages"
      - "MemberPortal/ - Member-specific pages"
      - "EmployerPortal/ - Employer-specific pages"
      - "BrokerPortal/ - Broker-specific pages"
      - "PartnerPortal/ - Partner-specific pages"

# ELEMENT DEFINITIONS
element_definitions:
  element_declaration:
    pattern: "Property with lambda returning FindElement()"
    syntax: "public Element ElementName => FindElement(locator, FindTypes.TYPE);"
    
  find_types:
    - type: "FindTypes.ID"
      description: "Locate by HTML id attribute"
      preference: "HIGHEST - Most reliable"
      example: 'FindElement("login-email", FindTypes.ID)'
      
    - type: "FindTypes.CLASSNAME"
      description: "Locate by CSS class"
      preference: "MEDIUM - Can be fragile if class used multiple times"
      example: 'FindElement("checkmark", FindTypes.CLASSNAME)'
      
    - type: "FindTypes.XPATH"
      description: "Locate by XPath expression"
      preference: "LOW - Use when ID/Class unavailable"
      example: 'FindElement("//*[contains(text(), \'For Business\')]", FindTypes.XPATH)'
      
    - type: "FindTypes.CSS"
      description: "Locate by CSS selector"
      preference: "MEDIUM - Good alternative to XPath"
      example: 'FindElement("div.login-form input[name=\'email\']", FindTypes.CSS)'
  
  element_naming:
    rule: "Include element type in name for clarity"
    examples:
      good:
        - "UsernameField"
        - "LoginButton"
        - "ErrorMessage"
        - "WelcomeText"
        - "NavigationMenu"
        - "AccountDropdown"
      bad:
        - "Input1 - Non-descriptive"
        - "Element - Too generic"
        - "Username - Missing type indicator"
        - "Btn - Abbreviation without context"
  
  xml_documentation:
    rule: "Add XML summary comments to all elements"
    example: |
      /// <summary>
      /// Username or Email input field
      /// </summary>
      public Element UsernameOrEmailField => FindElement("login-email", FindTypes.ID);

# PAGE ACTIONS
page_actions:
  action_methods:
    principle: "Encapsulate page interactions as methods"
    benefits:
      - "Hide implementation details from tests"
      - "Provide meaningful action names"
      - "Enable reuse across tests"
      - "Simplify test maintenance"
    
    naming_convention:
      - "Use descriptive verb phrases"
      - "Indicate what action accomplishes"
      - "Examples: Login(), NavigateToTransactions(), SubmitClaim()"
    
    example:
      code: |
        /// <summary>
        /// Performs complete login flow including privacy agreement.
        /// </summary>
        /// <param name="username">Username or email</param>
        /// <param name="password">User password</param>
        public void LoginAndAgreeToPrivacy(string username, string password)
        {
            UsernameOrEmailField.SendKeys(username);
            PasswordField.SendKeys(password);
            PrivacyAndSecurityCheckBox.Click();
            LoginButton.Click();
        }
  
  validation_methods:
    principle: "Provide methods to verify page state"
    common_validations:
      - validation: "IsLoaded()"
        description: "Checks if page is fully loaded and ready"
        returns: "bool"
        example: |
          public bool IsLoaded()
          {
              return ForBusinessLoginTitle.IsDisplayed() &&
                     UsernameOrEmailField.IsDisplayed() &&
                     PasswordField.IsDisplayed() &&
                     LoginButton.IsDisplayed();
          }
      
      - validation: "GetElementText()"
        description: "Retrieves text content from element"
        returns: "string"
        example: |
          public string GetAccountBalance()
          {
              return AccountBalance.Text;
          }
      
      - validation: "IsElementDisplayed()"
        description: "Checks if specific element is visible"
        returns: "bool"
        example: |
          public bool IsRecentActivityDisplayed()
          {
              return RecentActivitySection.IsDisplayed();
          }

# PAGE OBJECT TEMPLATE
page_object_template:
  complete_example:
    code: |
      using System;
      using HEQAutomationCore.BaseClasses;
      using WebDriverKit;
      
      namespace PageClassesCore.Auth0
      {
          /// <summary>
          /// Page Object for Auth0 Business Login page.
          /// </summary>
          public class BusinessLoginPage : PageBase
          {
              // ========================================
              // PAGE ELEMENTS
              // ========================================
              
              /// <summary>
              /// "For Business" title indicating page loaded
              /// </summary>
              public Element ForBusinessLoginTitle => 
                  FindElement("//*[contains(text(), 'For Business')]", FindTypes.XPATH);
              
              /// <summary>
              /// Username or Email input field
              /// </summary>
              public Element UsernameOrEmailField => 
                  FindElement("login-email", FindTypes.ID);
              
              /// <summary>
              /// Password input field
              /// </summary>
              public Element PasswordField => 
                  FindElement("login-password", FindTypes.ID);
              
              /// <summary>
              /// Login button
              /// </summary>
              public Element LoginButton => 
                  FindElement("btn-login", FindTypes.ID);
              
              // ========================================
              // PAGE ACTIONS
              // ========================================
              
              /// <summary>
              /// Performs complete login flow.
              /// </summary>
              public void LoginAndAgreeToPrivacy(string username, string password)
              {
                  UsernameOrEmailField.SendKeys(username);
                  PasswordField.SendKeys(password);
                  PrivacyAndSecurityCheckBox.Click();
                  LoginButton.Click();
              }
              
              // ========================================
              // PAGE VALIDATIONS
              // ========================================
              
              /// <summary>
              /// Checks if page is fully loaded.
              /// </summary>
              public bool IsLoaded()
              {
                  return ForBusinessLoginTitle.IsDisplayed() &&
                         UsernameOrEmailField.IsDisplayed() &&
                         LoginButton.IsDisplayed();
              }
          }
      }

# BEST PRACTICES
best_practices:
  do:
    - practice: "Inherit from PageBase"
      reason: "Provides FindElement() and other utilities"
      
    - practice: "Use property syntax for elements (=>)"
      reason: "Lazy evaluation, fresh element lookup each time"
      
    - practice: "Prefer ID locators over XPath"
      reason: "More reliable and faster"
      
    - practice: "Add XML documentation to elements and methods"
      reason: "Improves IntelliSense and maintainability"
      
    - practice: "Group elements by section with comments"
      reason: "Improves code organization"
      
    - practice: "Create validation methods (IsLoaded, etc.)"
      reason: "Provides reusable verification logic"
      
    - practice: "Keep page objects focused on single page"
      reason: "Maintains single responsibility"
  
  dont:
    - practice: "Don't include assertions in page objects"
      reason: "Assertions belong in tests, not page objects"
      alternative: "Return values and let tests assert"
      
    - practice: "Don't include test data in page objects"
      reason: "Page objects should be data-agnostic"
      alternative: "Pass data as method parameters"
      
    - practice: "Don't use Thread.Sleep() in page objects"
      reason: "Causes flaky tests"
      alternative: "Use WebDriverWait or framework wait utilities"
      
    - practice: "Don't create page objects inside tests"
      reason: "Reduces reusability"
      alternative: "Initialize in TestInitialize as private fields"

