# AI-Assisted Test Automation with Browser Verification
# Source: COMPANY ClassicQA Framework Documentation
# Version: 1.0
# Created: 2026-01-23
# Purpose: AI-driven test generation with browser-assisted locator verification

metadata:
  title: "AI-Assisted Test Automation"
  company: "COMPANY"
  framework: "ClassicQA + GitHub Copilot + Playwright MCP"
  sources:
    - "ClassicQA/docs/browser-assisted-automation.md"
    - "ClassicQA/docs/README.md"
  version: "1.0"
  created: "2026-01-23"
