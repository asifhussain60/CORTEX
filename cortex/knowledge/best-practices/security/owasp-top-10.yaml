# A01:2021 - Broken Access Control
broken_access_control:
  rank: 1
  identifier: "A01:2021"
  name: "Broken Access Control"
  severity: "CRITICAL"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-200  # Exposure of Sensitive Information
    - CWE-201  # Exposure of Sensitive Information Through Sent Data
    - CWE-352  # Cross-Site Request Forgery (CSRF)
    - CWE-639  # Authorization Bypass Through User-Controlled Key
    - CWE-862  # Missing Authorization
    - CWE-863  # Incorrect Authorization
  
  description: >
    Access control enforces policy such that users cannot act outside their intended permissions.
    Failures typically lead to unauthorized information disclosure, modification, or destruction
    of data or performing business functions outside user limits.
  
  common_vulnerabilities:
    - name: "Violation of Least Privilege"
      description: "Granting access by default instead of denying"
      example: "Admin panel accessible to all authenticated users"
    
    - name: "Bypassing Access Checks"
      description: "Manipulating URL, API endpoint, or request parameters"
      example: "Changing /user/123 to /user/456 in URL to access other user's data"
    
    - name: "Insecure Direct Object References (IDOR)"
      description: "Exposing internal object references without authorization"
      example: "Using database primary keys in URLs without ownership validation"
    
    - name: "Missing Function Level Access Control"
      description: "API functions exposed without role verification"
      example: "DELETE endpoint accessible to read-only users"
    
    - name: "CORS Misconfiguration"
      description: "Allowing unauthorized cross-origin access"
      example: "Access-Control-Allow-Origin: *"
    
    - name: "Force Browsing"
      description: "Accessing authenticated pages as unauthenticated user"
      example: "Accessing /admin by typing URL directly"
  
  detection_patterns:
    code_patterns:
      - pattern: "if.*user.*admin.*return"
        risk: "Hardcoded role checks (should use policy-based)"
        severity: "MEDIUM"
      
      - pattern: "request\\.params\\[\\'id\\'\\]"
        risk: "Potential IDOR - verify ownership"
        severity: "HIGH"
      
      - pattern: "Access-Control-Allow-Origin:\\s*\\*"
        risk: "Permissive CORS policy"
        severity: "HIGH"
      
      - pattern: "@app\\.route\\(.+\\)\\s*def\\s+\\w+\\("
        risk: "Flask route without @login_required decorator"
        severity: "CRITICAL"
    
    architectural_patterns:
      - pattern: "Client-side authorization checks only"
        risk: "Easily bypassed - always validate server-side"
        severity: "CRITICAL"
      
      - pattern: "No centralized authorization service"
        risk: "Inconsistent enforcement across microservices"
        severity: "HIGH"
  
  mitigation_strategies:
    - strategy: "Deny by Default"
      description: "All resources should require explicit authorization"
      implementation:
        python: |
          # Flask example with role-based access control
          from functools import wraps
          from flask import abort, g
          
          def require_role(role):
              def decorator(f):
                  @wraps(f)
                  def decorated_function(*args, **kwargs):
                      if not g.user or g.user.role != role:
                          abort(403)  # Forbidden
                      return f(*args, **kwargs)
                  return decorated_function
              return decorator
          
          @app.route('/admin/users')
          @require_role('admin')  # Explicit authorization
          def admin_users():
              return "Admin panel"
        
        csharp: |
          // ASP.NET Core with policy-based authorization
          [Authorize(Policy = "AdminOnly")]
          public class AdminController : Controller
          {
              public IActionResult Index()
              {
                  return View();
              }
          }
          
          // Startup.cs
          services.AddAuthorization(options =>
          {
              options.AddPolicy("AdminOnly", policy =>
                  policy.RequireRole("Admin"));
          });
        
        javascript: |
          // Express.js middleware
          const requireRole = (role) => {
            return (req, res, next) => {
              if (!req.user || req.user.role !== role) {
                return res.status(403).json({ error: 'Forbidden' });
              }
              next();
            };
          };
          
          app.get('/admin/users', requireRole('admin'), (req, res) => {
            res.json({ message: 'Admin panel' });
          });
    
    - strategy: "Use Centralized Authorization"
      description: "Single source of truth for access decisions"
      implementation:
        python: |
          # Authorization service pattern
          class AuthorizationService:
              def __init__(self, user, resource):
                  self.user = user
                  self.resource = resource
              
              def can_read(self):
                  # Centralized logic
                  return (
                      self.user.role == 'admin' or
                      self.resource.owner_id == self.user.id
                  )
              
              def can_write(self):
                  return self.user.role == 'admin'
          
          # Usage
          auth = AuthorizationService(current_user, document)
          if not auth.can_read():
              abort(403)
    
    - strategy: "Validate Ownership"
      description: "Always verify user owns the resource"
      implementation:
        python: |
          @app.route('/documents/<int:doc_id>')
          @login_required
          def view_document(doc_id):
              document = Document.query.get_or_404(doc_id)
              
              # Validate ownership
              if document.owner_id != g.user.id and g.user.role != 'admin':
                  abort(403)
              
              return render_template('document.html', document=document)
    
    - strategy: "Implement Rate Limiting"
      description: "Prevent brute force attacks on access control"
      implementation:
        python: |
          from flask_limiter import Limiter
          
          limiter = Limiter(
              app,
              key_func=lambda: request.remote_addr,
              default_limits=["200 per day", "50 per hour"]
          )
          
          @app.route('/api/users/<int:user_id>')
          @limiter.limit("10 per minute")
          def get_user(user_id):
              # Rate limited endpoint
              pass
  
  testing_checklist:
    - check: "Attempt to access resources without authentication"
      expected: "401 Unauthorized"
    
    - check: "Attempt to access resources with insufficient privileges"
      expected: "403 Forbidden"
    
    - check: "Modify URL parameters to access other users' data"
      expected: "403 Forbidden or 404 Not Found"
    
    - check: "Bypass authorization by manipulating JWT/session tokens"
      expected: "Token validation failure"
    
    - check: "Force browse to admin pages as regular user"
      expected: "Redirect or 403 Forbidden"

# A02:2021 - Cryptographic Failures
cryptographic_failures:
  rank: 2
  identifier: "A02:2021"
  name: "Cryptographic Failures"
  severity: "CRITICAL"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-259  # Use of Hard-coded Password
    - CWE-327  # Use of Broken Cryptographic Algorithm
    - CWE-331  # Insufficient Entropy
    - CWE-916  # Use of Password Hash With Insufficient Computational Effort
  
  description: >
    Failures related to cryptography which often lead to exposure of sensitive data.
    Previously known as "Sensitive Data Exposure", this category focuses on failures
    related to cryptographic implementations.
  
  common_vulnerabilities:
    - name: "Weak Encryption Algorithms"
      description: "Using deprecated or broken algorithms"
      example: "MD5, SHA1, DES, RC4"
    
    - name: "Hardcoded Secrets"
      description: "Storing credentials in source code"
      example: "API_KEY = 'sk_live_123456789'"
    
    - name: "Insufficient Password Hashing"
      description: "Using weak hashing or no salt"
      example: "SHA256(password) instead of bcrypt"
    
    - name: "Transmitting Data in Clear Text"
      description: "Sending sensitive data over HTTP"
      example: "Login form submitting to http:// endpoint"
    
    - name: "Insufficient Randomness"
      description: "Using predictable random number generators"
      example: "random.Random() instead of secrets module"
  
  detection_patterns:
    code_patterns:
      - pattern: "hashlib\\.md5\\("
        risk: "MD5 is cryptographically broken"
        severity: "CRITICAL"
      
      - pattern: "hashlib\\.sha1\\("
        risk: "SHA1 is deprecated for security use"
        severity: "HIGH"
      
      - pattern: "API[_-]?KEY\\s*=\\s*['\"]\\w+"
        risk: "Hardcoded API key"
        severity: "CRITICAL"
      
      - pattern: "password\\s*=\\s*['\"]\\w+"
        risk: "Hardcoded password"
        severity: "CRITICAL"
      
      - pattern: "random\\.random\\("
        risk: "Not cryptographically secure"
        severity: "MEDIUM"
  
  mitigation_strategies:
    - strategy: "Use Strong Encryption"
      description: "AES-256, RSA-2048+, modern algorithms"
      implementation:
        python: |
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2
          
          # Symmetric encryption with Fernet (AES-128-CBC + HMAC)
          def encrypt_data(data: bytes, password: str) -> bytes:
              # Derive key from password
              kdf = PBKDF2(
                  algorithm=hashes.SHA256(),
                  length=32,
                  salt=b'salt_should_be_random',  # Store salt securely
                  iterations=100_000
              )
              key = base64.urlsafe_b64encode(kdf.derive(password.encode()))
              
              f = Fernet(key)
              return f.encrypt(data)
          
          def decrypt_data(encrypted: bytes, password: str) -> bytes:
              kdf = PBKDF2(
                  algorithm=hashes.SHA256(),
                  length=32,
                  salt=b'salt_should_be_random',
                  iterations=100_000
              )
              key = base64.urlsafe_b64encode(kdf.derive(password.encode()))
              
              f = Fernet(key)
              return f.decrypt(encrypted)
    
    - strategy: "Hash Passwords Properly"
      description: "Use bcrypt, scrypt, or Argon2 with salt"
      implementation:
        python: |
          import bcrypt
          
          def hash_password(password: str) -> str:
              """Hash password with bcrypt (automatic salt)"""
              salt = bcrypt.gensalt(rounds=12)  # 12 rounds = 2^12 iterations
              return bcrypt.hashpw(password.encode(), salt).decode()
          
          def verify_password(password: str, hashed: str) -> bool:
              """Verify password against hash"""
              return bcrypt.checkpw(password.encode(), hashed.encode())
        
        csharp: |
          using System.Security.Cryptography;
          using Microsoft.AspNetCore.Cryptography.KeyDerivation;
          
          public class PasswordHasher
          {
              public string HashPassword(string password)
              {
                  // Generate salt
                  byte[] salt = new byte[128 / 8];
                  using (var rng = RandomNumberGenerator.Create())
                  {
                      rng.GetBytes(salt);
                  }
                  
                  // Hash with PBKDF2
                  string hashed = Convert.ToBase64String(KeyDerivation.Pbkdf2(
                      password: password,
                      salt: salt,
                      prf: KeyDerivationPrf.HMACSHA256,
                      iterationCount: 100_000,
                      numBytesRequested: 256 / 8));
                  
                  return $"{Convert.ToBase64String(salt)}:{hashed}";
              }
          }
    
    - strategy: "Secure Secret Management"
      description: "Use environment variables or secret managers"
      implementation:
        python: |
          import os
          from dotenv import load_dotenv
          
          # Load from .env file (not committed to git)
          load_dotenv()
          
          API_KEY = os.environ.get('API_KEY')
          if not API_KEY:
              raise ValueError("API_KEY environment variable not set")
          
          # For production: use AWS Secrets Manager, Azure Key Vault, etc.
          import boto3
          
          def get_secret(secret_name):
              client = boto3.client('secretsmanager')
              response = client.get_secret_value(SecretId=secret_name)
              return response['SecretString']
    
    - strategy: "Enforce HTTPS"
      description: "Redirect all traffic to HTTPS"
      implementation:
        python: |
          # Flask example
          from flask_talisman import Talisman
          
          app = Flask(__name__)
          Talisman(app, force_https=True)  # Force HTTPS
        
        javascript: |
          // Express.js middleware
          app.use((req, res, next) => {
            if (req.header('x-forwarded-proto') !== 'https') {
              res.redirect(`https://${req.header('host')}${req.url}`);
            } else {
              next();
            }
          });
    
    - strategy: "Use Cryptographically Secure Random"
      description: "Use secrets module for tokens"
      implementation:
        python: |
          import secrets
          
          # Generate secure token
          token = secrets.token_urlsafe(32)  # 256 bits
          
          # Generate random password
          password = secrets.token_hex(16)
          
          # Secure random choice
          secure_random = secrets.SystemRandom()
          value = secure_random.choice([1, 2, 3, 4, 5])

# A03:2021 - Injection
injection:
  rank: 3
  identifier: "A03:2021"
  name: "Injection"
  severity: "CRITICAL"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-79   # Cross-site Scripting (XSS)
    - CWE-89   # SQL Injection
    - CWE-73   # External Control of File Name
    - CWE-77   # Command Injection
    - CWE-917  # Expression Language Injection
  
  description: >
    Application is vulnerable when user-supplied data is not validated, filtered, or sanitized.
    Hostile data can trick the interpreter into executing unintended commands or accessing data.
  
  common_vulnerabilities:
    - name: "SQL Injection"
      description: "Attacker can read/modify database by injecting SQL"
      example: "SELECT * FROM users WHERE username = '" + input + "'"
    
    - name: "Cross-Site Scripting (XSS)"
      description: "Injecting malicious scripts into web pages"
      example: "<script>alert(document.cookie)</script>"
    
    - name: "Command Injection"
      description: "Executing system commands via user input"
      example: "os.system('ping ' + user_input)"
    
    - name: "LDAP Injection"
      description: "Manipulating LDAP queries"
      example: "(&(uid=" + username + ")(password=" + password + "))"
    
    - name: "NoSQL Injection"
      description: "Manipulating NoSQL queries"
      example: "db.users.find({ username: req.body.username })"
  
  detection_patterns:
    code_patterns:
      - pattern: "execute\\([\"']SELECT .+ \\+ "
        risk: "SQL injection via string concatenation"
        severity: "CRITICAL"
      
      - pattern: "cursor\\.execute\\(.+ % "
        risk: "SQL injection via string formatting"
        severity: "CRITICAL"
      
      - pattern: "os\\.system\\(.+ \\+ "
        risk: "Command injection"
        severity: "CRITICAL"
      
      - pattern: "subprocess\\.call\\(.+ \\+ "
        risk: "Command injection"
        severity: "CRITICAL"
      
      - pattern: "eval\\("
        risk: "Code injection"
        severity: "CRITICAL"
      
      - pattern: "innerHTML\\s*=.+"
        risk: "Potential XSS"
        severity: "HIGH"
  
  mitigation_strategies:
    - strategy: "Use Parameterized Queries"
      description: "Separate SQL code from data"
      implementation:
        python: |
          import sqlite3
          
          # VULNERABLE - String concatenation
          def get_user_bad(username):
              query = f"SELECT * FROM users WHERE username = '{username}'"
              cursor.execute(query)  # SQL injection!
          
          # SECURE - Parameterized query
          def get_user_good(username):
              query = "SELECT * FROM users WHERE username = ?"
              cursor.execute(query, (username,))  # Safe
          
          # ORM (even better)
          from sqlalchemy import select
          
          def get_user_orm(username):
              stmt = select(User).where(User.username == username)
              return session.execute(stmt).scalar_one_or_none()
        
        csharp: |
          // VULNERABLE
          string query = $"SELECT * FROM Users WHERE Username = '{username}'";
          SqlCommand cmd = new SqlCommand(query, connection);
          
          // SECURE
          string query = "SELECT * FROM Users WHERE Username = @username";
          SqlCommand cmd = new SqlCommand(query, connection);
          cmd.Parameters.AddWithValue("@username", username);
        
        javascript: |
          // Node.js with pg (PostgreSQL)
          
          // VULNERABLE
          const query = `SELECT * FROM users WHERE username = '${username}'`;
          
          // SECURE
          const query = 'SELECT * FROM users WHERE username = $1';
          client.query(query, [username]);
    
    - strategy: "Escape Output (Prevent XSS)"
      description: "HTML-encode user data before rendering"
      implementation:
        python: |
          from flask import escape
          from markupsafe import Markup
          
          # Automatic escaping with Jinja2
          @app.route('/profile/<username>')
          def profile(username):
              # Jinja2 auto-escapes by default
              return render_template('profile.html', username=username)
          
          # Manual escaping
          safe_username = escape(user_input)
        
        javascript: |
          // React automatically escapes
          function UserProfile({ username }) {
            return <div>{username}</div>;  // Auto-escaped
          }
          
          // Vanilla JS - use textContent instead of innerHTML
          element.textContent = userInput;  // Safe
          element.innerHTML = userInput;     // Dangerous!
          
          // If you must use innerHTML, sanitize first
          import DOMPurify from 'dompurify';
          element.innerHTML = DOMPurify.sanitize(userInput);
    
    - strategy: "Validate Input"
      description: "Whitelist allowed values"
      implementation:
        python: |
          from pydantic import BaseModel, validator
          import re
          
          class UserInput(BaseModel):
              username: str
              email: str
              
              @validator('username')
              def validate_username(cls, v):
                  if not re.match(r'^[a-zA-Z0-9_]{3,20}$', v):
                      raise ValueError('Invalid username format')
                  return v
              
              @validator('email')
              def validate_email(cls, v):
                  if not re.match(r'^[\w\.-]+@[\w\.-]+\.\w+$', v):
                      raise ValueError('Invalid email format')
                  return v
    
    - strategy: "Use Safe APIs"
      description: "Avoid shell execution when possible"
      implementation:
        python: |
          import subprocess
          import shlex
          
          # VULNERABLE - Shell injection
          os.system(f"ping {user_input}")
          
          # BETTER - No shell, but still risky
          subprocess.run(['ping', user_input])
          
          # BEST - Validate + no shell
          def ping_host(host):
              # Validate hostname
              if not re.match(r'^[a-zA-Z0-9\.-]+$', host):
                  raise ValueError("Invalid hostname")
              
              # Use subprocess with list (no shell)
              result = subprocess.run(
                  ['ping', '-c', '4', host],
                  capture_output=True,
                  text=True,
                  timeout=10
              )
              return result.stdout

# A04:2021 - Insecure Design
insecure_design:
  rank: 4
  identifier: "A04:2021"
  name: "Insecure Design"
  severity: "HIGH"
  prevalence: "MEDIUM"
  cwe_mappings:
    - CWE-209  # Generation of Error Message Containing Sensitive Information
    - CWE-256  # Unprotected Storage of Credentials
    - CWE-501  # Trust Boundary Violation
    - CWE-522  # Insufficiently Protected Credentials
  
  description: >
    Missing or ineffective control design. Insecure design is not the same as insecure implementation.
    A secure implementation cannot fix an insecure design, as controls are missing by design.
  
  common_vulnerabilities:
    - name: "Missing Rate Limiting"
      description: "No throttling on sensitive operations"
      example: "Unlimited login attempts, OTP requests"
    
    - name: "Insufficient Logging"
      description: "Security events not logged"
      example: "Failed login attempts not tracked"
    
    - name: "Trust Boundary Violations"
      description: "Trusting untrusted data sources"
      example: "Client-side validation only"
    
    - name: "Missing Security Controls"
      description: "No defense in depth"
      example: "Single factor authentication for admin panel"
  
  mitigation_strategies:
    - strategy: "Threat Modeling"
      description: "Identify threats during design phase"
      implementation:
        markdown: |
          # STRIDE Threat Model
          
          **S**poofing - Can attacker impersonate another user?
          **T**ampering - Can attacker modify data in transit?
          **R**epudiation - Can actions be traced to users?
          **I**nformation Disclosure - Can attacker access sensitive data?
          **D**enial of Service - Can attacker overwhelm system?
          **E**levation of Privilege - Can attacker gain admin access?
    
    - strategy: "Defense in Depth"
      description: "Multiple layers of security controls"
      implementation:
        python: |
          # Example: Multi-layered authentication
          
          # Layer 1: Rate limiting
          @limiter.limit("5 per minute")
          @app.route('/login', methods=['POST'])
          def login():
              # Layer 2: CAPTCHA after 3 failed attempts
              if get_failed_attempts(request.remote_addr) >= 3:
                  if not verify_captcha(request.form.get('captcha')):
                      return "CAPTCHA required", 429
              
              # Layer 3: Password verification
              user = authenticate(username, password)
              if not user:
                  increment_failed_attempts(request.remote_addr)
                  return "Invalid credentials", 401
              
              # Layer 4: 2FA
              if not verify_otp(user, request.form.get('otp')):
                  return "Invalid OTP", 401
              
              # Layer 5: Session security
              session['user_id'] = user.id
              session['ip'] = request.remote_addr
              session['user_agent'] = request.headers.get('User-Agent')
              
              return "Login successful"

# A05:2021 - Security Misconfiguration
security_misconfiguration:
  rank: 5
  identifier: "A05:2021"
  name: "Security Misconfiguration"
  severity: "HIGH"
  prevalence: "VERY HIGH"
  cwe_mappings:
    - CWE-16   # Configuration
    - CWE-209  # Generation of Error Message Containing Sensitive Information
    - CWE-330  # Use of Insufficiently Random Values
    - CWE-732  # Incorrect Permission Assignment for Critical Resource
  
  description: >
    Security misconfiguration is the most commonly seen issue. Often a result of insecure default
    configurations, incomplete configurations, open cloud storage, misconfigured HTTP headers,
    and verbose error messages containing sensitive information.
  
  common_vulnerabilities:
    - name: "Default Credentials"
      description: "Using default admin/admin passwords"
      example: "Database with password 'password'"
    
    - name: "Directory Listing Enabled"
      description: "Web server shows directory contents"
      example: "Apache with Options +Indexes"
    
    - name: "Verbose Error Messages"
      description: "Stack traces exposed to users"
      example: "DEBUG=True in production"
    
    - name: "Unnecessary Features Enabled"
      description: "Unused services running"
      example: "FTP, Telnet enabled on production server"
    
    - name: "Outdated Software"
      description: "Not patching security vulnerabilities"
      example: "Running Apache 2.2 with known CVEs"
  
  detection_patterns:
    configuration_patterns:
      - pattern: "DEBUG\\s*=\\s*True"
        risk: "Debug mode in production"
        severity: "HIGH"
      
      - pattern: "ALLOWED_HOSTS\\s*=\\s*\\[\\*\\]"
        risk: "Permissive host configuration"
        severity: "MEDIUM"
      
      - pattern: "SECRET_KEY\\s*=\\s*['\"]\\w{1,20}['\"]"
        risk: "Weak secret key"
        severity: "HIGH"
  
  mitigation_strategies:
    - strategy: "Secure Default Configuration"
      description: "Harden production settings"
      implementation:
        python: |
          # Django production settings
          
          DEBUG = False  # Never True in production
          
          ALLOWED_HOSTS = [
              'example.com',
              'www.example.com'
          ]  # Specific domains only
          
          SECRET_KEY = os.environ.get('SECRET_KEY')  # From environment
          
          SECURE_SSL_REDIRECT = True  # Force HTTPS
          SESSION_COOKIE_SECURE = True  # HTTPS-only cookies
          CSRF_COOKIE_SECURE = True
          SECURE_HSTS_SECONDS = 31536000  # 1 year
          SECURE_HSTS_INCLUDE_SUBDOMAINS = True
          SECURE_CONTENT_TYPE_NOSNIFF = True
          SECURE_BROWSER_XSS_FILTER = True
          X_FRAME_OPTIONS = 'DENY'  # Prevent clickjacking
          
          # Security headers middleware
          MIDDLEWARE = [
              'django.middleware.security.SecurityMiddleware',
              # ... other middleware
          ]
    
    - strategy: "Disable Unnecessary Features"
      description: "Remove unused services/endpoints"
      implementation:
        python: |
          # Flask example
          app = Flask(__name__)
          
          # Disable automatic OPTIONS handling
          app.config['AUTO_OPTIONS'] = False
          
          # Remove server header
          @app.after_request
          def remove_server_header(response):
              response.headers.pop('Server', None)
              return response
          
          # Custom error handlers (no stack traces)
          @app.errorhandler(500)
          def internal_error(error):
              logger.error(f"Server error: {error}")
              return jsonify({"error": "Internal server error"}), 500

# A06:2021 - Vulnerable and Outdated Components
vulnerable_components:
  rank: 6
  identifier: "A06:2021"
  name: "Vulnerable and Outdated Components"
  severity: "HIGH"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-1104  # Use of Unmaintained Third Party Components
  
  description: >
    Using components with known vulnerabilities. This includes libraries, frameworks, and other
    software modules that run with the same privileges as the application.
  
  mitigation_strategies:
    - strategy: "Dependency Scanning"
      description: "Automated vulnerability scanning"
      implementation:
        shell: |
          # Python - Safety
          pip install safety
          safety check
          
          # Python - pip-audit
          pip install pip-audit
          pip-audit
          
          # JavaScript - npm audit
          npm audit
          npm audit fix
          
          # JavaScript - Snyk
          npm install -g snyk
          snyk test
          
          # CI/CD Integration
          # .github/workflows/security.yml
          name: Security Scan
          on: [push, pull_request]
          jobs:
            scan:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v2
                - name: Run Snyk
                  uses: snyk/actions/python@master
                  env:
                    SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
    - strategy: "Keep Dependencies Updated"
      description: "Regular patching schedule"
      implementation:
        shell: |
          # Dependabot configuration
          # .github/dependabot.yml
          version: 2
          updates:
            - package-ecosystem: "pip"
              directory: "/"
              schedule:
                interval: "weekly"
            
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "daily"

# A07:2021 - Identification and Authentication Failures
authentication_failures:
  rank: 7
  identifier: "A07:2021"
  name: "Identification and Authentication Failures"
  severity: "CRITICAL"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-287  # Improper Authentication
    - CWE-384  # Session Fixation
    - CWE-613  # Insufficient Session Expiration
    - CWE-620  # Unverified Password Change
  
  description: >
    Confirmation of user's identity, authentication, and session management is critical.
    Weaknesses include credential stuffing, brute force, weak passwords, and session hijacking.
  
  mitigation_strategies:
    - strategy: "Implement Multi-Factor Authentication"
      description: "Require second factor for sensitive operations"
      implementation:
        python: |
          import pyotp
          
          # Generate TOTP secret
          def generate_totp_secret():
              return pyotp.random_base32()
          
          # Verify TOTP code
          def verify_totp(secret, code):
              totp = pyotp.TOTP(secret)
              return totp.verify(code, valid_window=1)
          
          # Login with 2FA
          @app.route('/login', methods=['POST'])
          def login():
              user = User.authenticate(username, password)
              if not user:
                  return "Invalid credentials", 401
              
              # Require TOTP
              if not verify_totp(user.totp_secret, request.form.get('otp')):
                  return "Invalid OTP", 401
              
              create_session(user)
              return "Login successful"
    
    - strategy: "Secure Session Management"
      description: "Use secure, random session IDs"
      implementation:
        python: |
          import secrets
          from flask import session
          
          app.config.update(
              SESSION_COOKIE_SECURE=True,      # HTTPS only
              SESSION_COOKIE_HTTPONLY=True,    # No JavaScript access
              SESSION_COOKIE_SAMESITE='Strict', # CSRF protection
              PERMANENT_SESSION_LIFETIME=timedelta(hours=1)
          )
          
          # Generate secure session ID
          def create_session(user):
              session_id = secrets.token_urlsafe(32)
              session['id'] = session_id
              session['user_id'] = user.id
              session['created_at'] = datetime.utcnow()

# A08:2021 - Software and Data Integrity Failures
integrity_failures:
  rank: 8
  identifier: "A08:2021"
  name: "Software and Data Integrity Failures"
  severity: "HIGH"
  prevalence: "MEDIUM"
  cwe_mappings:
    - CWE-502  # Deserialization of Untrusted Data
    - CWE-829  # Inclusion of Functionality from Untrusted Control Sphere
  
  description: >
    Code and infrastructure that does not protect against integrity violations. This includes
    insecure deserialization, unsigned software updates, and untrusted CDNs.
  
  mitigation_strategies:
    - strategy: "Avoid Insecure Deserialization"
      description: "Never deserialize untrusted data"
      implementation:
        python: |
          import pickle
          import json
          
          # DANGEROUS - pickle can execute arbitrary code
          def load_data_bad(data):
              return pickle.loads(data)  # Never use on untrusted data!
          
          # SAFE - Use JSON for untrusted data
          def load_data_good(data):
              return json.loads(data)
    
    - strategy: "Verify Digital Signatures"
      description: "Validate software integrity"
      implementation:
        shell: |
          # Verify npm package signatures
          npm install --ignore-scripts
          
          # Verify Python package hashes
          pip install --require-hashes -r requirements.txt

# A09:2021 - Security Logging and Monitoring Failures
logging_failures:
  rank: 9
  identifier: "A09:2021"
  name: "Security Logging and Monitoring Failures"
  severity: "MEDIUM"
  prevalence: "HIGH"
  cwe_mappings:
    - CWE-117  # Improper Output Neutralization for Logs
    - CWE-223  # Omission of Security-relevant Information
    - CWE-532  # Insertion of Sensitive Information into Log File
    - CWE-778  # Insufficient Logging
  
  description: >
    Without logging and monitoring, breaches cannot be detected. Insufficient logging makes
    forensics and incident response difficult or impossible.
  
  mitigation_strategies:
    - strategy: "Comprehensive Security Logging"
      description: "Log all security-relevant events"
      implementation:
        python: |
          import logging
          from functools import wraps
          
          # Configure security logger
          security_logger = logging.getLogger('security')
          security_logger.setLevel(logging.INFO)
          
          # Log security events
          def log_security_event(event_type, user, details):
              security_logger.info(
                  f"[SECURITY] {event_type}",
                  extra={
                      'user_id': user.id if user else None,
                      'username': user.username if user else None,
                      'ip': request.remote_addr,
                      'user_agent': request.headers.get('User-Agent'),
                      'timestamp': datetime.utcnow(),
                      'details': details
                  }
              )
          
          # Decorator for sensitive operations
          def audit_log(operation):
              def decorator(f):
                  @wraps(f)
                  def decorated_function(*args, **kwargs):
                      log_security_event(
                          f"OPERATION_{operation}",
                          g.user,
                          {'args': args, 'kwargs': kwargs}
                      )
                      return f(*args, **kwargs)
                  return decorated_function
              return decorator
          
          # Usage
          @app.route('/admin/delete_user/<int:user_id>', methods=['DELETE'])
          @audit_log('DELETE_USER')
          def delete_user(user_id):
              # Log before action
              log_security_event('USER_DELETE_ATTEMPT', g.user, {'target_user_id': user_id})
              
              User.query.filter_by(id=user_id).delete()
              db.session.commit()
              
              # Log after success
              log_security_event('USER_DELETED', g.user, {'target_user_id': user_id})
              return "User deleted"
          
          # Log failed login attempts
          @app.route('/login', methods=['POST'])
          def login():
              username = request.form.get('username')
              password = request.form.get('password')
              
              user = User.query.filter_by(username=username).first()
              
              if not user or not user.verify_password(password):
                  log_security_event(
                      'LOGIN_FAILED',
                      None,
                      {'username': username, 'reason': 'invalid_credentials'}
                  )
                  return "Invalid credentials", 401
              
              log_security_event('LOGIN_SUCCESS', user, {})
              return "Login successful"

# A10:2021 - Server-Side Request Forgery (SSRF)
ssrf:
  rank: 10
  identifier: "A10:2021"
  name: "Server-Side Request Forgery (SSRF)"
  severity: "HIGH"
  prevalence: "MEDIUM"
  cwe_mappings:
    - CWE-918  # Server-Side Request Forgery (SSRF)
  
  description: >
    SSRF flaws occur when web application fetches remote resource without validating user-supplied URL.
    Allows attacker to coerce application to send crafted request to unexpected destination.
  
  common_vulnerabilities:
    - name: "Unrestricted URL Fetch"
      description: "Fetching arbitrary URLs provided by user"
      example: "fetch(request.params.url)"
    
    - name: "Cloud Metadata Access"
      description: "Accessing AWS/Azure metadata endpoints"
      example: "http://169.254.169.254/latest/meta-data/"
    
    - name: "Internal Network Scanning"
      description: "Probing internal services"
      example: "http://localhost:6379 (Redis)"
  
  mitigation_strategies:
    - strategy: "Whitelist Allowed Destinations"
      description: "Only allow specific domains/IPs"
      implementation:
        python: |
          from urllib.parse import urlparse
          import requests
          
          ALLOWED_DOMAINS = ['api.example.com', 'cdn.example.com']
          BLOCKED_IPS = [
              '127.0.0.1',
              '169.254.169.254',  # AWS metadata
              '10.0.0.0/8',        # Private network
              '172.16.0.0/12',     # Private network
              '192.168.0.0/16'     # Private network
          ]
          
          def fetch_url_safe(url):
              # Parse URL
              parsed = urlparse(url)
              
              # Validate scheme
              if parsed.scheme not in ['http', 'https']:
                  raise ValueError("Invalid scheme")
              
              # Validate domain
              if parsed.hostname not in ALLOWED_DOMAINS:
                  raise ValueError("Domain not whitelisted")
              
              # Prevent redirects to internal IPs
              response = requests.get(
                  url,
                  allow_redirects=False,
                  timeout=5
              )
              
              return response.content
    
    - strategy: "Network Segmentation"
      description: "Isolate application from internal services"
      implementation:
        markdown: |
          # Network Architecture
          
          - Web tier: DMZ (no access to internal services)
          - App tier: Restricted access to databases only
          - Data tier: No internet access
          
          # Firewall rules
          - Block outbound to 127.0.0.1, 169.254.169.254
          - Block private IP ranges (10.0.0.0/8, etc.)

