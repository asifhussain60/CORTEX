# Tool Integration
tool_integration:
  static_analysis:
    - tool: "Bandit"
      language: "Python"
      command: "bandit -r src/"
      detects: ["SQL injection", "Command injection", "Hardcoded secrets"]
    
    - tool: "Semgrep"
      language: "Multi-language"
      command: "semgrep --config=auto"
      detects: ["OWASP Top 10", "Custom security rules"]
    
    - tool: "SonarQube"
      language: "Multi-language"
      detects: ["Security hotspots", "Code quality issues"]
  
  dynamic_analysis:
    - tool: "OWASP ZAP"
      type: "DAST"
      detects: ["XSS", "SQL injection", "Authentication issues"]
    
    - tool: "Burp Suite"
      type: "Manual penetration testing"
      detects: ["Complex vulnerabilities", "Business logic flaws"]
  
  dependency_scanning:
    - tool: "Snyk"
      detects: ["Vulnerable dependencies", "License issues"]
    
    - tool: "Dependabot"
