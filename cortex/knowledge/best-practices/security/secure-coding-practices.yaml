          const safeParam = encodeURIComponent(userInput);
          const url = `https://example.com/search?q=${safeParam}`;
          
          // Build URL with URLSearchParams
          const params = new URLSearchParams({
            query: userQuery,
            category: userCategory
          });
          const url = `https://example.com/search?${params.toString()}`;
    
