# INPUT VALIDATION
input_validation:
  principle: "Never trust user input - validate, sanitize, and encode"
  importance: "CRITICAL - First line of defense against injection attacks"
  
  rules:
    - id: "input_001"
      name: "Whitelist Input Validation"
      description: "Define allowed characters, length, format, and type"
      severity: "CRITICAL"
      implementation:
        python: |
          import re
          from pydantic import BaseModel, validator, constr
          
          # Pydantic validation (recommended)
          class UserRegistration(BaseModel):
              username: constr(min_length=3, max_length=20, regex=r'^[a-zA-Z0-9_]+$')
              email: constr(regex=r'^[\w\.-]+@[\w\.-]+\.\w+$')
              age: int
              
              @validator('age')
              def validate_age(cls, v):
                  if not 13 <= v <= 120:
                      raise ValueError('Age must be between 13 and 120')
                  return v
          
          # Manual validation
          def validate_username(username: str) -> bool:
              # Whitelist approach
              allowed_pattern = r'^[a-zA-Z0-9_]{3,20}$'
              return bool(re.match(allowed_pattern, username))
          
          def validate_email(email: str) -> bool:
              pattern = r'^[\w\.-]+@[\w\.-]+\.\w{2,}$'
              return bool(re.match(pattern, email))
        
        csharp: |
          using System.ComponentModel.DataAnnotations;
          using System.Text.RegularExpressions;
          
          public class UserRegistration
          {
              [Required]
              [StringLength(20, MinimumLength = 3)]
              [RegularExpression(@"^[a-zA-Z0-9_]+$")]
              public string Username { get; set; }
              
              [Required]
              [EmailAddress]
              public string Email { get; set; }
              
              [Range(13, 120)]
              public int Age { get; set; }
          }
          
          // Fluent validation (recommended)
          public class UserValidator : AbstractValidator<UserRegistration>
          {
              public UserValidator()
              {
                  RuleFor(x => x.Username)
                      .NotEmpty()
                      .Length(3, 20)
                      .Matches(@"^[a-zA-Z0-9_]+$");
                  
                  RuleFor(x => x.Email)
                      .NotEmpty()
                      .EmailAddress();
                  
                  RuleFor(x => x.Age)
                      .InclusiveBetween(13, 120);
              }
          }
        
        javascript: |
          // Express-validator
          const { body, validationResult } = require('express-validator');
          
          app.post('/register',
            body('username')
              .isLength({ min: 3, max: 20 })
              .matches(/^[a-zA-Z0-9_]+$/)
              .withMessage('Invalid username format'),
            body('email')
              .isEmail()
              .normalizeEmail(),
            body('age')
              .isInt({ min: 13, max: 120 }),
            (req, res) => {
              const errors = validationResult(req);
              if (!errors.isEmpty()) {
                return res.status(400).json({ errors: errors.array() });
              }
              // Process valid data
            }
          );
    
    - id: "input_002"
      name: "Type Validation"
      description: "Ensure data matches expected type"
      severity: "HIGH"
      implementation:
        python: |
          from typing import Union
          import json
          
          def process_user_id(user_id: Union[int, str]) -> int:
              # Type coercion with validation
              try:
                  uid = int(user_id)
                  if uid <= 0:
                      raise ValueError("User ID must be positive")
                  return uid
              except (ValueError, TypeError):
                  raise ValueError("Invalid user ID format")
          
          def parse_json_safely(data: str) -> dict:
              try:
                  parsed = json.loads(data)
                  if not isinstance(parsed, dict):
                      raise ValueError("Expected JSON object")
                  return parsed
              except json.JSONDecodeError:
                  raise ValueError("Invalid JSON")
    
    - id: "input_003"
      name: "Sanitize File Uploads"
      description: "Validate file type, size, and content"
      severity: "CRITICAL"
      implementation:
        python: |
          import os
          import mimetypes
          from werkzeug.utils import secure_filename
          
          ALLOWED_EXTENSIONS = {'png', 'jpg', 'jpeg', 'gif', 'pdf'}
          MAX_FILE_SIZE = 5 * 1024 * 1024  # 5 MB
          
          def allowed_file(filename: str) -> bool:
              return '.' in filename and \
                     filename.rsplit('.', 1)[1].lower() in ALLOWED_EXTENSIONS
          
          def validate_file_upload(file):
              # Check filename
              if not file or not file.filename:
                  raise ValueError("No file provided")
              
              # Secure the filename (remove path traversal)
              filename = secure_filename(file.filename)
              
              # Validate extension
              if not allowed_file(filename):
                  raise ValueError("File type not allowed")
              
              # Check file size
              file.seek(0, os.SEEK_END)
              size = file.tell()
              file.seek(0)  # Reset pointer
              
              if size > MAX_FILE_SIZE:
                  raise ValueError("File too large")
              
              # Validate MIME type (don't trust client)
              mime_type, _ = mimetypes.guess_type(filename)
              if mime_type not in ['image/png', 'image/jpeg', 'application/pdf']:
                  raise ValueError("Invalid file type")
              
              return filename
    
    - id: "input_004"
      name: "Prevent Path Traversal"
      description: "Validate file paths to prevent directory traversal"
      severity: "CRITICAL"
      implementation:
        python: |
          import os
          from pathlib import Path
          
          UPLOAD_FOLDER = '/var/www/uploads'
          
          def safe_join(directory: str, filename: str) -> str:
              """Safely join directory and filename, preventing traversal"""
              # Normalize path
              filepath = os.path.normpath(os.path.join(directory, filename))
              
              # Ensure path is within allowed directory
              if not filepath.startswith(os.path.abspath(directory)):
                  raise ValueError("Path traversal detected")
              
              return filepath
          
          # Better approach using pathlib
          def safe_path(base_dir: Path, user_path: str) -> Path:
              full_path = (base_dir / user_path).resolve()
              
              # Ensure resolved path is within base directory
              if not str(full_path).startswith(str(base_dir.resolve())):
                  raise ValueError("Path traversal detected")
              
              return full_path
          
          # Usage
          base = Path(UPLOAD_FOLDER)
          try:
              safe_file = safe_path(base, user_input)
              # Process file
          except ValueError:
              abort(400, "Invalid file path")

# OUTPUT ENCODING
output_encoding:
  principle: "Encode output based on context to prevent injection"
  importance: "CRITICAL - Prevents XSS and other injection attacks"
  
  rules:
    - id: "output_001"
      name: "HTML Encoding"
      description: "Escape HTML special characters"
      severity: "CRITICAL"
      implementation:
        python: |
          from markupsafe import escape
          from flask import Markup
          
          # Automatic with Jinja2
          @app.route('/profile/<username>')
          def profile(username):
              # Jinja2 auto-escapes {{ username }}
              return render_template('profile.html', username=username)
          
          # Manual escaping
          safe_html = escape(user_input)
          
          # Allow HTML (dangerous - sanitize first!)
          from bleach import clean
          
          ALLOWED_TAGS = ['p', 'br', 'strong', 'em', 'a']
          ALLOWED_ATTRS = {'a': ['href', 'title']}
          
          def sanitize_html(dirty_html: str) -> str:
              return clean(
                  dirty_html,
                  tags=ALLOWED_TAGS,
                  attributes=ALLOWED_ATTRS,
                  strip=True
              )
        
        javascript: |
          // React automatically escapes
          function UserProfile({ username }) {
            return <div>{username}</div>;  // Safe
          }
          
          // Vanilla JS
          element.textContent = userInput;  // Safe
          element.innerText = userInput;    // Safe
          element.innerHTML = userInput;    // DANGEROUS!
          
          // DOMPurify for rich content
          import DOMPurify from 'dompurify';
          
          element.innerHTML = DOMPurify.sanitize(userInput, {
            ALLOWED_TAGS: ['p', 'br', 'strong', 'em'],
            ALLOWED_ATTR: []
          });
    
    - id: "output_002"
      name: "JavaScript Encoding"
      description: "Escape JavaScript strings"
      severity: "CRITICAL"
      implementation:
        python: |
          import json
          
          # Safe way to pass data to JavaScript
          @app.route('/page')
          def page():
              user_data = {'name': user.name, 'email': user.email}
              # JSON encoding is safe
              return render_template(
                  'page.html',
                  user_data_json=json.dumps(user_data)
              )
        
        html: |
          <!-- Template -->
          <script>
            // Parse JSON safely
            const userData = JSON.parse('{{ user_data_json | safe }}');
            
            // NEVER do this:
            const name = '{{ user.name }}';  // XSS vulnerability!
          </script>
    
    - id: "output_003"
      name: "URL Encoding"
      description: "Encode URL parameters"
      severity: "HIGH"
      implementation:
        python: |
          from urllib.parse import quote, urlencode
          
          # Encode single parameter
          safe_param = quote(user_input)
          url = f"https://example.com/search?q={safe_param}"
          
          # Encode multiple parameters
