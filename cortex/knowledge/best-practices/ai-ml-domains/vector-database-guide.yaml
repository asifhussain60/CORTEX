# Vector Database Fundamentals
fundamentals:
  what_is_vector_database:
    description: "Database optimized for storing and querying high-dimensional vectors"
    key_features:
      - "Similarity search (not exact match)"
      - "High-dimensional vector indexing"
      - "Approximate nearest neighbor (ANN) algorithms"
      - "Metadata filtering alongside vector search"
    
  use_cases:
    - "Semantic search (find similar documents)"
    - "RAG (Retrieval Augmented Generation)"
    - "Recommendation systems"
    - "Image/video similarity search"
    - "Anomaly detection"
    - "Deduplication"
    - "Question answering systems"
  
  vector_representation:
    description: "Numerical representation of data in high-dimensional space"
    examples:
      text: "1536-dimensional embedding from OpenAI"
      image: "2048-dimensional embedding from ResNet"
      audio: "512-dimensional embedding from audio model"
    similarity_metric: "Distance between vectors indicates similarity"

# Similarity Metrics
similarity_metrics:
  cosine_similarity:
    description: "Measures angle between vectors"
    formula: "cos(╬╕) = (A ┬╖ B) / (||A|| ||B||)"
    range: "[-1, 1] (1 = identical, -1 = opposite)"
    use_case: "Text embeddings (direction matters more than magnitude)"
    pros: ["Normalized", "Works well for text"]
    cons: ["Ignores magnitude"]
    example: |
      import numpy as np
      def cosine_similarity(a, b):
          return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))

  euclidean_distance:
    description: "Straight-line distance between vectors"
    formula: "d = ΓêÜ(╬ú(ai - bi)┬▓)"
    range: "[0, Γê₧] (0 = identical)"
    use_case: "Image embeddings, spatial data"
    pros: ["Intuitive", "Considers magnitude"]
    cons: ["Sensitive to scale"]
    example: |
      def euclidean_distance(a, b):
          return np.linalg.norm(a - b)

  dot_product:
    description: "Product of vector magnitudes and cosine of angle"
    formula: "A ┬╖ B = ╬ú(ai ├ù bi)"
    range: "[-Γê₧, Γê₧]"
    use_case: "When magnitude matters (e.g., confidence scores)"
    pros: ["Fast computation"]
    cons: ["Not normalized"]

  manhattan_distance:
    description: "Sum of absolute differences"
    formula: "d = ╬ú|ai - bi|"
    range: "[0, Γê₧]"
    use_case: "Grid-based data, specific domains"

# Indexing Algorithms
indexing_algorithms:
  hnsw:
    name: "Hierarchical Navigable Small World"
    description: "Graph-based algorithm with layered structure"
    complexity:
      build: "O(N log N)"
      query: "O(log N)"
    pros:
      - "Best query performance"
      - "High recall"
      - "Supports updates"
    cons:
      - "High memory usage"
      - "Slow build time"
    parameters:
      M: "Max connections per node (16-64 typical)"
      efConstruction: "Build quality (100-200 typical)"
      efSearch: "Search quality (10-500 typical)"
    use_case: "Production RAG systems, high-performance search"

  ivf:
    name: "Inverted File Index"
    description: "Partition space into clusters (Voronoi cells)"
    complexity:
      build: "O(N)"
      query: "O(N/k) where k = num clusters"
    pros:
      - "Fast build time"
      - "Memory efficient"
      - "Good for large datasets"
    cons:
      - "Lower recall than HNSW"
      - "Sensitive to nprobe parameter"
    parameters:
      nlist: "Number of clusters (sqrt(N) typical)"
      nprobe: "Clusters to search (10-100 typical)"
    use_case: "Massive datasets (millions of vectors)"

  flat:
    name: "Brute Force / Flat Index"
    description: "Exact search through all vectors"
    complexity:
      build: "O(N)"
      query: "O(N)"
    pros:
      - "100% recall (exact search)"
      - "Simple implementation"
      - "No parameters to tune"
    cons:
      - "Slow for large datasets"
      - "Not scalable"
    use_case: "Small datasets (<10k vectors), development/testing"

  product_quantization:
    name: "Product Quantization (PQ)"
    description: "Compress vectors by quantizing subvectors"
    compression: "32x-64x smaller than original"
    pros:
      - "Massive memory savings"
      - "Fast distance computation"
    cons:
      - "Loss of accuracy"
      - "Complex setup"
    use_case: "Memory-constrained environments, billions of vectors"

# Vector Database Options
vector_databases:
  pinecone:
    type: "Fully managed cloud service"
    features:
      - "Serverless option available"
      - "HNSW algorithm"
      - "Metadata filtering"
      - "Namespaces for multi-tenancy"
      - "Sparse-dense hybrid search"
    pros:
      - "Zero ops, fully managed"
      - "Easy to start"
      - "Good documentation"
    cons:
      - "Vendor lock-in"
      - "Cost at scale"
      - "Limited customization"
    pricing: "Pay per vector and queries"
    best_for: "Quick prototypes, startups, simple use cases"
    example: |
      import pinecone
      pinecone.init(api_key="KEY")
      index = pinecone.Index("my-index")
      index.upsert([("id1", [0.1, 0.2, ...], {"category": "tech"})])
      results = index.query([0.1, 0.2, ...], top_k=10, filter={"category": "tech"})

  weaviate:
    type: "Open-source, self-hosted or cloud"
    features:
      - "Multiple vectorizers (OpenAI, Cohere, etc.)"
      - "HNSW + PQ compression"
      - "GraphQL API"
      - "Multi-modal search"
      - "Hybrid search (BM25 + vector)"
    pros:
      - "Open source"
      - "Rich querying with GraphQL"
      - "Good documentation"
      - "Active community"
    cons:
      - "Self-hosting complexity"
      - "Less mature than some alternatives"
    best_for: "Complex querying, hybrid search, multi-modal data"
    example: |
      import weaviate
      client = weaviate.Client("http://localhost:8080")
      client.data_object.create(
          {"content": "Hello world"},
          "Document",
          vector=[0.1, 0.2, ...]
      )
      result = client.query.get("Document", ["content"]).with_near_vector({
          "vector": [0.1, 0.2, ...]
      }).with_limit(10).do()

  qdrant:
    type: "Open-source, Rust-based"
    features:
      - "HNSW algorithm"
      - "Payload filtering"
      - "Clustering and sharding"
      - "Snapshots and backups"
      - "gRPC and REST APIs"
    pros:
      - "Very fast (Rust)"
      - "Great filtering capabilities"
      - "Easy deployment"
      - "Good documentation"
    cons:
      - "Smaller ecosystem"
      - "Limited cloud options"
    best_for: "Production RAG, high-performance needs, complex filtering"
    example: |
      from qdrant_client import QdrantClient
      client = QdrantClient(host="localhost", port=6333)
      client.upsert(
          collection_name="my_collection",
          points=[{
              "id": 1,
              "vector": [0.1, 0.2, ...],
              "payload": {"category": "tech"}
          }]
      )
      results = client.search(
          collection_name="my_collection",
          query_vector=[0.1, 0.2, ...],
          limit=10,
          query_filter={"category": "tech"}
      )

  milvus:
    type: "Open-source, cloud-native"
    features:
      - "Multiple index types (HNSW, IVF, etc.)"
      - "GPU acceleration"
      - "Horizontal scaling"
      - "Time travel (versioning)"
      - "Hybrid search"
    pros:
      - "Highly scalable"
      - "GPU support"
      - "Rich feature set"
      - "Good for massive scale"
    cons:
      - "Complex setup"
      - "Steeper learning curve"
    best_for: "Large enterprises, massive scale (billions of vectors)"
    example: |
      from pymilvus import connections, Collection
      connections.connect("default", host="localhost", port="19530")
      collection = Collection("my_collection")
      collection.insert([[0.1, 0.2, ...]])
      results = collection.search(
          data=[[0.1, 0.2, ...]],
          anns_field="vector",
          param={"metric_type": "L2", "params": {"nprobe": 10}},
          limit=10
      )

  chroma:
    type: "Open-source, embedded"
    features:
      - "Embedded database (like SQLite)"
      - "Simple API"
      - "Built for LLM apps"
      - "Metadata filtering"
    pros:
      - "Extremely easy to use"
      - "No server needed"
      - "Great for development"
    cons:
      - "Not for production scale"
      - "Limited features"
    best_for: "Development, prototypes, small datasets"
    example: |
      import chromadb
      client = chromadb.Client()
      collection = client.create_collection("my_collection")
      collection.add(
          documents=["Hello world"],
          embeddings=[[0.1, 0.2, ...]],
          metadatas=[{"category": "tech"}],
          ids=["id1"]
      )
      results = collection.query(
          query_embeddings=[[0.1, 0.2, ...]],
          n_results=10
      )

  pgvector:
    type: "PostgreSQL extension"
    features:
      - "Vector data type for Postgres"
      - "IVFFlat and HNSW indexes"
      - "SQL queries with vector operations"
      - "Existing Postgres ecosystem"
    pros:
      - "Use existing Postgres infrastructure"
      - "Familiar SQL interface"
      - "ACID transactions"
      - "Combine with relational data"
    cons:
      - "Not as fast as specialized DBs"
      - "Limited to Postgres features"
    best_for: "Already using Postgres, hybrid relational+vector data"
    example: |
      -- SQL
      CREATE TABLE documents (id bigserial PRIMARY KEY, embedding vector(1536));
      CREATE INDEX ON documents USING ivfflat (embedding vector_cosine_ops);
      SELECT * FROM documents ORDER BY embedding <=> '[0.1,0.2,...]' LIMIT 10;

# RAG Integration Patterns
rag_integration:
  basic_rag_flow:
    steps:
      - "User asks question"
      - "Generate query embedding"
      - "Search vector DB for similar documents"
      - "Retrieve top K documents"
      - "Construct prompt with context"
      - "Send to LLM"
      - "Return response"
    
    example: |
      # 1. Query embedding
      query = "How does authentication work?"
      query_embedding = embed_model.encode(query)
      
      # 2. Search vector DB
      results = vector_db.search(query_embedding, top_k=5)
      
      # 3. Construct prompt
      context = "\n\n".join([r.content for r in results])
      prompt = f"Context: {context}\n\nQuestion: {query}\n\nAnswer:"
      
      # 4. LLM inference
      response = llm.generate(prompt)

  hybrid_search:
    description: "Combine keyword (BM25) and semantic (vector) search"
    benefits:
      - "Better recall"
      - "Handles exact matches and semantics"
      - "More robust"
    implementation: |
      # BM25 search
      keyword_results = bm25_search(query, top_k=20)
      
      # Vector search
      vector_results = vector_db.search(query_embedding, top_k=20)
      
      # Combine with RRF (Reciprocal Rank Fusion)
      combined = rrf(keyword_results, vector_results, k=60)
      top_results = combined[:5]

  metadata_filtering:
    description: "Pre-filter by metadata before similarity search"
    use_cases:
      - "Multi-tenant applications (filter by tenant_id)"
      - "Time-based filtering (filter by date)"
      - "Category filtering (filter by document_type)"
    example: |
      results = vector_db.search(
          query_embedding,
          top_k=10,
          filter={
              "tenant_id": "tenant123",
              "document_type": "technical",
              "published_date": {"$gte": "2024-01-01"}
          }
      )

  reranking:
    description: "Re-order results with more expensive model"
    flow:
      - "Retrieve 20-50 candidates from vector DB (fast)"
      - "Rerank with cross-encoder model (slow but accurate)"
      - "Return top 5-10"
    benefit: "Better accuracy without expensive search"
    example: |
      # Fast retrieval
      candidates = vector_db.search(query_embedding, top_k=50)
      
      # Rerank with cross-encoder
      pairs = [(query, doc.content) for doc in candidates]
      scores = reranker.predict(pairs)
      
      # Sort and return top K
      ranked = sorted(zip(candidates, scores), key=lambda x: x[1], reverse=True)
      top_results = [doc for doc, score in ranked[:5]]

# Performance Optimization
performance:
  chunking_strategies:
    description: "Split documents into optimal chunks for retrieval"
    
    fixed_size:
      approach: "Split by character/token count"
      size: "512-1024 tokens typical"
      overlap: "50-100 tokens between chunks"
      pros: ["Simple", "Consistent size"]
      cons: ["May split mid-sentence/thought"]
    
    semantic:
      approach: "Split by semantic boundaries (paragraphs, sections)"
      pros: ["Preserves meaning", "Better context"]
      cons: ["Variable size", "More complex"]
    
    recursive:
      approach: "Split by sections ΓåÆ paragraphs ΓåÆ sentences as needed"
      pros: ["Flexible", "Preserves structure"]
      cons: ["Complex implementation"]
    
    best_practice: "Fixed size with overlap + semantic boundaries"

  embedding_optimization:
    batch_embedding:
      description: "Embed multiple texts in single API call"
      speedup: "5-10x faster"
      example: |
        # Bad: One at a time
        embeddings = [embed_model.encode(text) for text in texts]
        
        # Good: Batch
        embeddings = embed_model.encode(texts, batch_size=32)
    
    caching:
      description: "Cache embeddings to avoid recomputation"
      storage: "Redis or disk cache keyed by text hash"
      example: |
        def get_embedding_cached(text):
            cache_key = hashlib.sha256(text.encode()).hexdigest()
            if cached := redis.get(cache_key):
                return pickle.loads(cached)
            embedding = embed_model.encode(text)
            redis.set(cache_key, pickle.dumps(embedding))
            return embedding

  index_optimization:
    parameter_tuning:
      hnsw_m: "16 for speed, 64 for accuracy"
      hnsw_ef_construction: "100 for speed, 400 for accuracy"
      hnsw_ef_search: "10 for speed, 500 for accuracy"
    
    compression:
      - "Use quantization for large datasets"
      - "Product quantization for 32x-64x compression"
      - "Scalar quantization for 4x compression"
    
    sharding:
      - "Distribute across multiple nodes"
      - "Shard by tenant_id or date"
      - "Parallel search for speed"

  query_optimization:
    limit_metadata:
      description: "Only return needed metadata fields"
      benefit: "Reduce network overhead"
    
    adjust_top_k:
      description: "Balance accuracy vs speed"
      recommendation: "Retrieve 20-50, rerank to 5-10"
    
    parallel_queries:
      description: "Search multiple collections in parallel"
      example: |
        import asyncio
        results = await asyncio.gather(
            vector_db1.search(query_embedding),
            vector_db2.search(query_embedding)
        )

# Production Considerations
production:
  data_ingestion:
    pipeline:
      - "Extract text from documents"
      - "Clean and normalize"
      - "Chunk into optimal sizes"
      - "Generate embeddings (batch)"
      - "Upsert to vector DB with metadata"
    
    example: |
      def ingest_document(doc):
          # 1. Extract and clean
          text = extract_text(doc)
          
          # 2. Chunk
          chunks = chunk_text(text, size=512, overlap=50)
          
          # 3. Embed (batch)
          embeddings = embed_model.encode(chunks, batch_size=32)
          
          # 4. Upsert
          vector_db.upsert([{
              "id": f"{doc.id}_chunk_{i}",
              "vector": emb.tolist(),
              "metadata": {
                  "doc_id": doc.id,
                  "chunk_index": i,
                  "content": chunk,
                  "doc_title": doc.title
              }
          } for i, (chunk, emb) in enumerate(zip(chunks, embeddings))])

  monitoring:
    metrics:
      - "Query latency (p50, p95, p99)"
      - "Recall@K (accuracy)"
      - "Index build time"
      - "Memory usage"
      - "Query throughput (QPS)"
    
    alerts:
      - "Latency > 100ms (p95)"
      - "Memory usage > 80%"
      - "Error rate > 1%"

  scalability:
    vertical:
      description: "Increase server resources"
      approach: "More RAM, faster CPU, GPU"
    
    horizontal:
      description: "Add more nodes"
      approach: "Sharding, replication"
      databases: "Milvus, Qdrant, Weaviate support clustering"

  backup_recovery:
    - "Regular snapshots of vector index"
    - "Store raw documents separately"
    - "Can rebuild index from documents"
    - "Test recovery procedures"

  security:
    - "Encrypt vectors at rest"
    - "TLS for vector DB connections"
    - "Authentication for vector DB access"
    - "Row-level security for multi-tenant"

# Testing Vector Search
testing:
  unit_tests:
    - "Test embedding generation"
    - "Test chunking logic"
    - "Test metadata extraction"
    example: |
      def test_chunking():
          text = "A" * 1000 + "B" * 1000
          chunks = chunk_text(text, size=500, overlap=50)
          assert len(chunks) == 4  # Approx
          assert chunks[0][-50:] == chunks[1][:50]  # Overlap

  integration_tests:
    - "Test end-to-end search"
    - "Validate top results are relevant"
    - "Test filtering works correctly"
    example: |
      def test_rag_search():
          # Ingest known document
          ingest_document(test_doc)
          
          # Search for known query
          results = search("test query about X")
          
          # Validate
          assert test_doc.id in [r.id for r in results]
          assert results[0].score > 0.8

  evaluation:
    metrics:
      recall_at_k: "% of relevant docs in top K"
      mrr: "Mean reciprocal rank of first relevant doc"
      ndcg: "Normalized discounted cumulative gain"
    
    approach:
      - "Create test set of queries and expected documents"
      - "Measure metrics on test set"
      - "Compare different configurations"

