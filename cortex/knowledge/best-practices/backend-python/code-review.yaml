# Code Review Guideline
# Machine-readable code review checklist for automated and manual reviews
# Version: 1.0
# Created: December 19, 2025
# Schema: CodeReviewGuidelineSchema (Pydantic validation)
# Primary use: Code review agents, PR automation, quality gates

metadata:
  name: "Code Review Best Practices"
  version: "1.0"
  author: "CORTEX Knowledge Library"
  source: "Industry standards (OWASP, Google Code Review, Microsoft Code Review)"
  created: "2025-12-19"
  updated: "2025-12-19"
  description: "Comprehensive code review checklist with automated detection rules"

# SECURITY REVIEW
security_review:
  - id: "security_001"
    name: "Input Validation"
    severity: "CRITICAL"
    category: "security"
    description: "All external inputs must be validated before use"
    
    checklist:
      - "Validate all user inputs (forms, APIs, CLI args)"
      - "Use allowlists over denylists"
      - "Sanitize inputs before database queries (prevent SQL injection)"
      - "Sanitize inputs before rendering (prevent XSS)"
      - "Validate file uploads (type, size, content)"
    
    detection_rules:
      patterns:
        - "request.args.get() without validation"
        - "request.form.get() without validation"
        - "request.json without schema validation"
        - "raw SQL with string concatenation"
        - "eval() or exec() on user input"
      
      tools:
        - name: "Bandit"
          command: "bandit -r src/"
        - name: "Semgrep"
          command: "semgrep --config=p/security-audit"
    
    example_bad: |
      # Python
      user_id = request.args.get('user_id')
      query = f"SELECT * FROM users WHERE id = {user_id}"  # SQL injection!
      
      # C#
      string query = "SELECT * FROM users WHERE id = " + userId;  // SQL injection!
    
    example_good: |
      # Python
      user_id = request.args.get('user_id', type=int)
      if not user_id or user_id <= 0:
          abort(400, "Invalid user_id")
      query = "SELECT * FROM users WHERE id = %s"
      cursor.execute(query, (user_id,))  # Parameterized query
      
      # C#
      int userId = int.Parse(Request.QueryString["userId"]);
      string query = "SELECT * FROM users WHERE id = @userId";
      cmd.Parameters.AddWithValue("@userId", userId);  // Parameterized query
  
  - id: "security_002"
    name: "Authentication & Authorization"
    severity: "CRITICAL"
    category: "security"
    description: "Verify authentication and authorization checks are present"
    
    checklist:
      - "Authentication required for all protected endpoints"
      - "Authorization checks before sensitive operations"
      - "Role-based access control (RBAC) enforced"
      - "Session management secure (timeout, regeneration)"
      - "Password policies enforced (complexity, hashing)"
    
    detection_rules:
      patterns:
        - "API endpoint without @login_required or @authorize"
        - "Sensitive operation without permission check"
        - "Plain text passwords in logs or database"
        - "Weak hashing (MD5, SHA1)"
      
      tools:
        - name: "Bandit"
          rules: ["B303", "B304", "B305", "B501"]
    
    example_bad: |
      # No authentication check
      @app.route('/admin/delete_user/<user_id>')
      def delete_user(user_id):
          User.delete(user_id)  # Anyone can delete!
    
    example_good: |
      @app.route('/admin/delete_user/<user_id>')
      @login_required
      @role_required('admin')
      def delete_user(user_id):
          if not current_user.can_delete_user(user_id):
              abort(403, "Insufficient permissions")
          User.delete(user_id)
  
  - id: "security_003"
    name: "Sensitive Data Exposure"
    severity: "CRITICAL"
    category: "security"
    description: "Prevent leaking sensitive data in logs, errors, or responses"
    
    checklist:
      - "PII never logged (emails, SSNs, credit cards)"
      - "Secrets not hardcoded (API keys, passwords)"
      - "Error messages don't expose internal details"
      - "Debug mode disabled in production"
      - "Stack traces not exposed to users"
    
    detection_rules:
      patterns:
        - "logger.info containing email, password, ssn, credit_card"
        - "Hardcoded API_KEY, SECRET_KEY, PASSWORD"
        - "DEBUG = True in production config"
        - "Exception details in API responses"
      
      tools:
        - name: "TruffleHog"
          command: "trufflehog git file://."
        - name: "Detect-Secrets"
          command: "detect-secrets scan"
    
    example_bad: |
      # Logging PII
      logger.info(f"User login: {user.email} with password {password}")
      
      # Hardcoded secret
      API_KEY = "sk-1234567890abcdef"
      
      # Exposing stack trace
      except Exception as e:
          return {"error": str(e), "traceback": traceback.format_exc()}
    
    example_good: |
      # Hash PII in logs
      logger.info(f"User login: {hash(user.email)}")
      
      # Use environment variables
      API_KEY = os.environ["API_KEY"]
      
      # Generic error message
      except Exception as e:
          logger.exception("Error processing request")
          return {"error": "internal_error", "message": "Please contact support"}
  
  - id: "security_004"
    name: "Cryptography"
    severity: "HIGH"
    category: "security"
    description: "Use strong cryptography and secure random number generation"
    
    checklist:
      - "Use bcrypt/Argon2 for password hashing (NOT MD5/SHA1)"
      - "Use secure random for tokens (secrets.token_urlsafe, NOT random)"
      - "Encrypt sensitive data at rest (AES-256)"
      - "Use TLS 1.2+ for data in transit"
      - "Verify certificates in HTTPS requests"
    
    detection_rules:
      patterns:
        - "hashlib.md5() or hashlib.sha1() for passwords"
        - "random.random() for security tokens"
        - "requests.get(..., verify=False)"
      
      tools:
        - name: "Bandit"
          rules: ["B303", "B304", "B305", "B501", "B502"]
    
    example_bad: |
      import hashlib
      import random
      
      # Weak hashing
      password_hash = hashlib.md5(password.encode()).hexdigest()
      
      # Insecure random
      token = ''.join(random.choice(string.ascii_letters) for _ in range(32))
    
    example_good: |
      import secrets
      from werkzeug.security import generate_password_hash
      
      # Strong hashing
      password_hash = generate_password_hash(password, method='pbkdf2:sha256')
      
      # Secure random
      token = secrets.token_urlsafe(32)

# PERFORMANCE REVIEW
performance_review:
  - id: "performance_001"
    name: "N+1 Query Detection"
    severity: "HIGH"
    category: "performance"
    description: "Identify and fix N+1 query problems"
    
    checklist:
      - "Use eager loading for related data (JOIN, includes, prefetch_related)"
      - "Avoid queries inside loops"
      - "Use batch queries where possible"
      - "Profile database queries in dev environment"
    
    detection_rules:
      patterns:
        - "for loop with database query inside"
        - "ORM query without .join() or .prefetch_related()"
      
      tools:
        - name: "Django Silk"
          description: "Profile Django queries"
        - name: "SQLAlchemy Echo"
          config: "engine = create_engine(..., echo=True)"
    
    example_bad: |
      # N+1 query problem
      users = User.query.all()
      for user in users:
          print(user.orders)  # 1 query per user!
    
    example_good: |
      # Eager loading
      users = User.query.options(joinedload(User.orders)).all()
      for user in users:
          print(user.orders)  # 1 query total
  
  - id: "performance_002"
    name: "Inefficient Algorithms"
    severity: "MEDIUM"
    category: "performance"
    description: "Detect algorithms with poor time/space complexity"
    
    checklist:
      - "No nested loops over large datasets (O(n┬▓) ΓåÆ O(n log n))"
      - "Use appropriate data structures (dict for lookups, set for membership)"
      - "Avoid repeated calculations (memoization)"
      - "Profile hot paths with cProfile"
    
    detection_rules:
      patterns:
        - "Nested for loops with list/array iteration"
        - "if x in list: for large lists (use set)"
        - "Repeated function calls with same args"
      
      tools:
        - name: "cProfile"
          command: "python -m cProfile -o profile.stats script.py"
        - name: "memory_profiler"
          command: "@profile decorator + python -m memory_profiler"
    
    example_bad: |
      # O(n┬▓) complexity
      for i in range(len(list1)):
          for j in range(len(list2)):
              if list1[i] == list2[j]:  # Slow!
                  matches.append(list1[i])
      
      # Repeated calculations
      for item in items:
          result = expensive_calculation(item.id)  # NOT cached
    
    example_good: |
      # O(n) complexity with set
      set2 = set(list2)
      matches = [x for x in list1 if x in set2]  # Fast!
      
      # Memoization
      @lru_cache(maxsize=128)
      def expensive_calculation(item_id):
          ...
      
      for item in items:
          result = expensive_calculation(item.id)  # Cached
  
  - id: "performance_003"
    name: "Resource Leaks"
    severity: "HIGH"
    category: "performance"
    description: "Detect unclosed resources (files, connections, streams)"
    
    checklist:
      - "Always close files, DB connections, network sockets"
      - "Use context managers (with statement)"
      - "Dispose IDisposable objects in C#"
      - "Close async resources with async with"
    
    detection_rules:
      patterns:
        - "open() without with statement"
        - "Database connection without try-finally or context manager"
        - "New HttpClient() in method (should be static/singleton)"
      
      tools:
        - name: "Pylint"
          rules: ["consider-using-with"]
    
    example_bad: |
      # Python - file leak
      f = open('file.txt')
      data = f.read()
      # f.close() missing!
      
      # C# - connection leak
      var conn = new SqlConnection(connectionString);
      conn.Open();
      // conn.Close() missing!
    
    example_good: |
      # Python - auto close
      with open('file.txt') as f:
          data = f.read()
      
      # C# - using statement
      using (var conn = new SqlConnection(connectionString))
      {
          conn.Open();
          // Auto closed
      }

# READABILITY REVIEW
readability_review:
  - id: "readability_001"
    name: "Naming Clarity"
    severity: "MEDIUM"
    category: "readability"
    description: "Names must reveal intent without comments"
    
    checklist:
      - "Variables: intention-revealing (user_email, NOT e)"
      - "Functions: verb phrases (get_user, NOT user)"
      - "Classes: noun phrases (PaymentService, NOT Process)"
      - "Constants: SCREAMING_SNAKE_CASE (MAX_RETRY_COUNT)"
      - "Avoid abbreviations unless domain-standard"
    
    detection_rules:
      patterns:
        - "Single-letter variables (except i, j, k in loops)"
        - "Abbreviations: usr, mgr, prc, tmp"
        - "Vague names: data, info, manager, handler"
      
      tools:
        - name: "Pylint"
          rules: ["invalid-name", "disallowed-name"]
    
    example_bad: |
      def proc(d):  # What does this do?
          r = []
          for i in d:
              if i[1] > 100:
                  r.append(i[0])
          return r
    
    example_good: |
      def filter_high_value_transactions(transactions):
          high_value_ids = []
          for transaction in transactions:
              if transaction.amount > 100:
                  high_value_ids.append(transaction.id)
          return high_value_ids
  
  - id: "readability_002"
    name: "Function Length & Complexity"
    severity: "MEDIUM"
    category: "readability"
    description: "Functions should be short and do one thing"
    
    checklist:
      - "Max 20 lines per function (ideal: 10)"
      - "Single responsibility (one reason to change)"
      - "One level of abstraction per function"
      - "Max 3 parameters (use objects for more)"
      - "Cyclomatic complexity Γëñ 10"
    
    detection_rules:
      metrics:
        function_length:
          warning: 20
          error: 50
        parameters:
          warning: 3
          error: 5
        complexity:
          warning: 5
          error: 10
      
      tools:
        - name: "Radon"
          command: "radon cc src/ -a -nb"
        - name: "McCabe"
          command: "flake8 --max-complexity=10"
    
    example_bad: |
      def process_order(user_id, product_id, quantity, discount_code, 
                       shipping_address, billing_address, payment_method):  # 7 params!
          # 150 lines of code...
    
    example_good: |
      @dataclass
      class OrderRequest:
          user_id: int
          product_id: int
          quantity: int
          discount_code: Optional[str]
          shipping_address: Address
          billing_address: Address
          payment_method: PaymentMethod
      
      def process_order(request: OrderRequest):
          # 15 lines of orchestration
  
  - id: "readability_003"
    name: "Code Duplication"
    severity: "MEDIUM"
    category: "readability"
    description: "Don't repeat yourself (DRY principle)"
    
    checklist:
      - "Extract common logic into functions"
      - "Use inheritance/composition for shared behavior"
      - "Max 5 lines of duplicate code"
    
    detection_rules:
      tools:
        - name: "Flake8-Duplication"
          command: "flake8 --select=D src/"
        - name: "Jscpd"
          command: "jscpd src/"
        - name: "PMD (Java/C#)"
          command: "pmd cpd --files src/"
    
    example_bad: |
      # Duplicate validation
      if not user.email or '@' not in user.email:
          raise ValueError("Invalid email")
      
      # Same validation elsewhere
      if not admin.email or '@' not in admin.email:
          raise ValueError("Invalid email")
    
    example_good: |
      def validate_email(email: str) -> None:
          if not email or '@' not in email:
              raise ValueError("Invalid email")
      
      validate_email(user.email)
      validate_email(admin.email)

# MAINTAINABILITY REVIEW
maintainability_review:
  - id: "maintainability_001"
    name: "Error Handling"
    severity: "HIGH"
    category: "maintainability"
    description: "Handle errors explicitly and gracefully"
    
    checklist:
      - "No bare except: clauses (catch specific exceptions)"
      - "Log errors with context before re-raising"
      - "Don't return None on error (raise exception)"
      - "Clean up resources in finally blocks"
    
    detection_rules:
      patterns:
        - "except: pass  # Swallowing exceptions"
        - "except Exception:  # Too broad"
        - "return None  # Ambiguous failure"
      
      tools:
        - name: "Pylint"
          rules: ["bare-except", "broad-except"]
    
    example_bad: |
      try:
          result = risky_operation()
      except:  # What went wrong?
          pass
    
    example_good: |
      try:
          result = risky_operation()
      except ValueError as e:
          logger.error(f"Invalid input: {e}")
          raise
      except ConnectionError as e:
          logger.error(f"Connection failed: {e}")
          raise OperationFailedError("Service unavailable") from e
  
  - id: "maintainability_002"
    name: "Documentation"
    severity: "MEDIUM"
    category: "maintainability"
    description: "Public APIs must have docstrings"
    
    checklist:
      - "All public classes have docstrings"
      - "All public functions have docstrings"
      - "Complex algorithms have explanation comments"
      - "API contracts documented (args, returns, raises)"
    
    detection_rules:
      patterns:
        - "Public class without docstring"
        - "Public function without docstring"
      
      tools:
        - name: "Pydocstyle"
          command: "pydocstyle src/"
        - name: "Interrogate"
          command: "interrogate -vv src/"
    
    example_bad: |
      def calculate_discount(price, user):
          if user.is_premium:
              return price * 0.8
          return price
    
    example_good: |
      def calculate_discount(price: Decimal, user: User) -> Decimal:
          """Calculate discounted price based on user tier.
          
          Premium users receive 20% discount.
          
          Args:
              price: Original price before discount
              user: User object with tier information
          
          Returns:
              Discounted price (original price for non-premium users)
          
          Example:
              >>> calculate_discount(Decimal('100'), premium_user)
              Decimal('80.00')
          """
          if user.is_premium:
              return price * Decimal('0.8')
          return price
  
  - id: "maintainability_003"
    name: "Dependency Management"
    severity: "MEDIUM"
    category: "maintainability"
    description: "Manage dependencies cleanly"
    
    checklist:
      - "No circular dependencies"
      - "Depend on abstractions, not implementations (DIP)"
      - "Use dependency injection"
      - "Keep dependencies up to date"
    
    detection_rules:
      tools:
        - name: "Pydeps"
          command: "pydeps src/ --show-cycles"
        - name: "Safety"
          command: "safety check"
    
    example_bad: |
      # Circular dependency
      # user.py
      from order import Order
      
      # order.py
      from user import User  # Circular!
    
    example_good: |
      # user.py (no import of Order)
      class User:
          pass
      
      # order.py
      from user import User
      
      class Order:
          user: User  # One-way dependency

# TEST COVERAGE REVIEW
test_coverage_review:
  - id: "test_coverage_001"
    name: "Test Coverage"
    severity: "HIGH"
    category: "testing"
    description: "Adequate test coverage for new code"
    
    checklist:
      - "New code has 85%+ line coverage"
      - "Critical paths have 100% coverage"
      - "Edge cases tested"
      - "Error paths tested"
    
    detection_rules:
      metrics:
        line_coverage:
          minimum: 85
          critical_paths: 100
      
      tools:
        - name: "Pytest-Cov"
          command: "pytest --cov=src --cov-report=term-missing"
        - name: "Coverage.py"
          command: "coverage run -m pytest && coverage report"
    
    example_good: |
      # Test success path
      def test_calculate_discount_premium_user():
          user = User(is_premium=True)
          assert calculate_discount(Decimal('100'), user) == Decimal('80')
      
      # Test edge case
      def test_calculate_discount_regular_user():
          user = User(is_premium=False)
          assert calculate_discount(Decimal('100'), user) == Decimal('100')
      
      # Test error path
      def test_calculate_discount_negative_price():
          user = User(is_premium=True)
          with pytest.raises(ValueError):
              calculate_discount(Decimal('-10'), user)
  
  - id: "test_coverage_002"
    name: "Test Quality"
    severity: "MEDIUM"
    category: "testing"
    description: "Tests are readable, maintainable, and isolated"
    
    checklist:
      - "Tests follow AAA pattern (Arrange, Act, Assert)"
      - "One assertion per test (or related assertions)"
      - "Tests are independent (no shared state)"
      - "Use fixtures for setup"
      - "Test names describe behavior"
    
    example_bad: |
      def test_user():  # Vague name
          u = User('test@example.com')
          u.save()
          assert u.id
          u.delete()
          assert not User.find(u.id)  # Multiple concerns
    
    example_good: |
      def test_user_save_assigns_id():
          # Arrange
          user = User('test@example.com')
          
          # Act
          user.save()
          
          # Assert
          assert user.id is not None
      
      def test_user_delete_removes_from_database():
          # Arrange
          user = User('test@example.com')
          user.save()
          user_id = user.id
          
          # Act
          user.delete()
          
          # Assert
          assert User.find(user_id) is None

# ARCHITECTURE REVIEW
architecture_review:
  - id: "architecture_001"
    name: "Layer Boundaries"
    severity: "HIGH"
    category: "architecture"
    description: "Respect architectural layer boundaries"
    
    checklist:
      - "Domain layer has no infrastructure dependencies"
      - "Use Case layer defines infrastructure interfaces"
      - "Infrastructure implements Use Case interfaces"
      - "Presentation depends on Use Case, not Infrastructure"
    
    detection_rules:
      patterns:
        - "Domain/ imports from Data/ or Api/"
        - "UseCase/ imports from Data/ or Api/"
        - "Direct database access from Api/"
      
      tools:
        - name: "Import-Linter"
          config: "contracts in .importlinter"
    
    example_bad: |
      # Domain importing Infrastructure
      # payment.py (Domain)
      from data.payment_repository import PaymentRepository  # Violation!
    
    example_good: |
      # Domain defines interface
      # payment.py (Domain)
      class IPaymentRepository(ABC):
          @abstractmethod
          def save(self, payment: Payment) -> None:
              pass
      
      # Infrastructure implements
      # payment_repository.py (Data)
      class PaymentRepository(IPaymentRepository):
          def save(self, payment: Payment) -> None:
              ...
  
  - id: "architecture_002"
    name: "SOLID Principles"
    severity: "MEDIUM"
    category: "architecture"
    description: "Code follows SOLID principles"
    
    checklist:
      - "SRP: Each class has one reason to change"
      - "OCP: Extend behavior without modifying existing code"
      - "LSP: Subtypes are substitutable for base types"
      - "ISP: Clients don't depend on unused methods"
      - "DIP: Depend on abstractions, not implementations"
    
    example_bad_srp: |
      class User:
          def save(self):
              # Database logic (violation!)
          
          def send_email(self):
              # Email logic (violation!)
    
    example_good_srp: |
      class User:
          pass  # Domain entity only
      
      class UserRepository:
          def save(self, user: User): ...
      
      class EmailService:
          def send(self, user: User, message: str): ...

# COMPLIANCE REVIEW
compliance_review:
  - id: "compliance_001"
    name: "License Compliance"
    severity: "MEDIUM"
    category: "compliance"
    description: "All dependencies have compatible licenses"
    
    checklist:
      - "No GPL dependencies in proprietary code"
      - "License headers in all source files"
      - "Third-party licenses documented"
    
    detection_rules:
      tools:
        - name: "LicenseCheck"
          command: "licensecheck --recursive src/"
        - name: "FOSSA"
          command: "fossa analyze"
  
  - id: "compliance_002"
    name: "Accessibility"
    severity: "MEDIUM"
    category: "compliance"
    description: "UI components meet accessibility standards"
    
    checklist:
      - "Alt text for images"
      - "Keyboard navigation support"
      - "ARIA labels for interactive elements"
      - "Color contrast ratio ΓëÑ 4.5:1"
    
    detection_rules:
      tools:
        - name: "axe-core"
          command: "axe --dir ./dist"
        - name: "Pa11y"
          command: "pa11y http://localhost:3000"

# CORTEX INTEGRATION
cortex_integration:
  code_review_agent:
    workflow: "Automated PR review with inline comments"
    detection_order:
      - "CRITICAL severity first (security, authentication)"
      - "HIGH severity (performance, resource leaks)"
      - "MEDIUM severity (readability, maintainability)"
    
    output_format: |
      # Code Review Summary
      
      ## ≡ƒö┤ Critical Issues (3)
      - security_001: SQL injection in user_controller.py:42
      - security_003: Hardcoded API key in config.py:12
      
      ## ≡ƒƒí High Priority (5)
      - performance_001: N+1 query in order_service.py:78
      
      ## ≡ƒƒó Improvements (12)
      - readability_001: Unclear variable name in payment.py:23
    
    auto_fix:
      enabled: true
      categories: ["readability", "formatting", "documentation"]
      requires_approval: ["security", "architecture"]
  
  pr_quality_gate:
    blocking:
      - "CRITICAL severity issues"
      - "Test coverage < 85%"
      - "Security vulnerabilities"
    
    warning:
      - "HIGH severity issues > 3"
      - "Test coverage 85-90%"
  
  learning:
    pattern_extraction: "Extract common review comments as new rules"
    false_positive_feedback: "User can mark false positives to improve detection"
