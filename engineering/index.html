<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CORTEX Software Engineers - AI-Powered Development Platform">
    <title>Software Engineers | CORTEX</title>
    
    <!-- Glassmorphism CSS System -->
    <link rel="stylesheet" href="/assets/css/glass-design-tokens.css">
    <link rel="stylesheet" href="/assets/css/cortex-glass-system.css">
    <link rel="stylesheet" href="/assets/css/glass-ui-components.css">
    <link rel="stylesheet" href="/assets/css/glass-animations.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    
    <style>
        :root {
            --role-accent: #10b981;
        }
        
        .role-landing {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(15, 15, 35, 0.95), rgba(25, 25, 55, 0.95));
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--role-accent);
            transform: translateY(-4px);
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(15, 15, 35, 0.98);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 1rem;
            overflow-y: auto;
        }
        
        .main-content {
            margin-left: 280px;
            padding: 2rem;
        }
        
        .breadcrumb {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
        }
        
        .breadcrumb a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }
        
        .breadcrumb a:hover {
            color: var(--role-accent);
        }
        
        .nav-item {
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--role-accent);
        }
        
        .nav-item.active {
            background: var(--role-accent);
            color: white;
        }
    </style>
</head>
<body>
    <div class="role-landing">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
                <span style="font-size: 2rem;">💻</span>
                <h2 style="color: white; margin: 0;">Software Engineers</h2>
            </div>
            
            
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Breadcrumbs -->
            <nav class="breadcrumb">
                
                
                <a href="/index.html">Home</a>
                <span>›</span>
                
                
                
                <span style="color: var(--role-accent);">Software Engineers</span>
                
                
            </nav>
            
            <!-- Role Landing Content -->
            <div>
                <h1 style="color: white; margin-bottom: 1rem;">
                    💻 Software Engineers
                </h1>
                <p style="color: rgba(255, 255, 255, 0.7); font-size: 1.125rem; margin-bottom: 3rem;">
                    Explore CORTEX capabilities tailored for your role.
                </p>
                
                <!-- Feature Cards Grid -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                    
                </div>
            </div>
        </main>
    </div>
</body>
</html>
