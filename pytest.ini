[pytest]
# Pytest configuration for CORTEX Internal Tests
# 
# ISOLATION GUARANTEE: These tests are for CORTEX health validation ONLY.
# They will NEVER interfere with or execute target application tests.

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths - CORTEX internal tests ONLY
testpaths = tests

# Prevent discovery outside CORTEX
# This ensures we never accidentally run target application tests
norecursedirs = 
    .git
    .tox
    .venv
    venv
    env
    dist
    build
    *.egg
    *.egg-info
    node_modules
    target
    bin
    obj
    .pytest_cache
    __pycache__
    # Exclude common application test directories
    **/tests
    **/test  
    **/__tests__
    **/spec
    # But allow CORTEX/tests
    !CORTEX/tests

# Output options
addopts = 
    -v
    -s
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    --show-capture=no

# Coverage options (use --cov to enable, e.g., pytest --cov=src tests/)
# Removed from addopts to prevent 55-second overhead on every test run
#    --cov=src
#    --cov-report=term-missing:skip-covered
#    --cov-report=html:htmlcov
#    --cov-report=json:coverage.json
#    --cov-config=.coveragerc
#    --cov-branch

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers - CORTEX internal testing only
markers =
    cortex_internal: Internal CORTEX health validation tests
    agent_test: Agent functionality tests
    brain_test: Brain tier tests (Tier 0-3)
    brain_protection: Brain Protection Rules (SKULL rules) tests
    tdd_enforcement: TDD_ENFORCEMENT brain protection rule tests
    holistic_discovery: HOLISTIC_DISCOVERY brain protection rule tests
    git_isolation: GIT_ISOLATION brain protection rule tests
    planning_isolation: PLANNING_ISOLATION brain protection rule tests
    hand_off_protocol: HAND_OFF_PROTOCOL brain protection rule tests
    orchestrator_test: Orchestrator workflow tests
    config_test: Configuration system tests
    template_test: Response template system tests
    unit: Unit tests for individual components
    integration: Integration tests across components
    e2e: End-to-end workflow tests
    slow: Tests that take more than 1 second
    fast: Tests that run in under 100ms
    performance: Performance benchmark tests (may hang if pytest-benchmark missing)
    fifo: Tests related to FIFO queue behavior
    edge_case: Edge case validation tests (Phase 5.3)
    vision_critical: CRITICAL Vision API auto-trigger enforcement tests - MUST PASS
    vision_integration: Vision API integration tests
    vision_regression: Vision API regression prevention tests
    requires_git: Tests that require git repository
    requires_ide: Tests that require IDE (VSCode/Visual Studio)
    requires_network: Tests that require network access
    cortex_v4: CORTEX 4.0 feature tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Temporary directory settings
tmp_path_retention_count = 3
tmp_path_retention_policy = all
