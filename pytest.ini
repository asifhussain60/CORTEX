[pytest]
# CORTEX Test Configuration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories
testpaths = tests cortex/tests cortex/infrastructure/tests

# Directories excluded from test collection
norecursedirs = .git __pycache__ .pytest_cache node_modules _quarantine _legacy_broken
    _archived
    scripts

# Output & Performance
# ─── SEQUENTIAL EXECUTION ────────────────────────────────────────────────────
# All tests run sequentially (no xdist parallel workers).
# Use -p no:xdist to ensure xdist is fully disabled even if installed.
# Use -p no:sugar to disable pytest-sugar's per-test tick display, which
# conflicts with CortexXdistPlugin and creates a "hanging" appearance
# when it renders each test result one-by-one (e.g. ✓✓✓✓✓...) stalling
# at slow scope groups. CortexXdistPlugin provides all progress output.
addopts = 
    --strict-markers
    --tb=short
    -ra
    --maxfail=10
    -p no:xdist
    -p no:sugar
    --ignore=tests/e2e/test_phase_navigation.py

# ============================================================================
# TIMEOUT SETTINGS (P0 — prevent hanging tests)
# ============================================================================
# Every test gets 30s max. Integration tests can override with @pytest.mark.timeout(60).
# This is the #1 fix for "tests appearing to hang" — without this, a single
# test doing network I/O or waiting on a lock runs forever.
timeout = 30
timeout_method = thread
timeout_func_only = false

# Custom markers
markers =
    regression: marks tests as regression tests
    integration: marks tests requiring external dependencies
    slow: marks tests that are slow to run (>5s)
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests (fast, high-value subset ~500 tests)
    critical: marks tests as critical path (core orchestrators, MCP, governance)
    full: marks tests that only run in full suite (perf, chaos, edge cases)
    timeout: override default timeout for specific tests
    rephrase: marks tests for REPHRASE mode enforcement
    golden: marks golden tests (expected output validation)
    e2e: marks end-to-end tests
    lens: marks LENS analyzer tests
    domain: marks domain analyzer tests
    dotnet: marks .NET analyzer tests
    discovery: marks discovery tests
    asyncio: marks async coroutine tests
    concurrent_safe: marks tests verified safe for parallel xdist execution
    dependency_heavy: marks tests with heavy external dependency requirements
    phase15: marks Phase-15 specific scenario tests
    tdd_red: marks TDD RED-phase tests (expected to fail until implementation)
    security: marks security tests
    knowledge_graph: marks knowledge graph tests
