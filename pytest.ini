[pytest]
# CORTEX Test Configuration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories
testpaths = tests cortex/tests cortex/infrastructure/tests

# Ignore broken tests temporarily (Phase 38.0)
norecursedirs = .git __pycache__ .pytest_cache node_modules _quarantine _legacy_broken
    _archived
    tests/_archived
    tests/unit/orchestrators/intelligence
    tests/unit/orchestrators/generated
    tests/unit/tier1/orchestrators
    tests/visualization
    tests/unit/dashboard/components
    tests/unit/orchestrators/intent
    tests/unit/orchestrators/planning  
    tests/unit/orchestrators/support
    tests/unit/tools
    tests/unit/core/intent
    tests/unit/orchestrators/adapters
    cortex/brain/testing
    scripts

# Ignore specific broken files
ignore = 
    cortex/brain/testing/test_audit_logger.py
    scripts/test_optimization_suite.py
    tests/unit/orchestrators/adapters/test_refactoring_tool_adapter.py
    tests/integration/test_phase21_contracts.py
    tests/unit/test_folder_structure.py
    tests/unit/test_governance_registry.py
    tests/unit/test_import_resolver.py
    tests/unit/test_path_abstraction.py
    tests/unit/test_phase5_targeted_markers.py
    tests/unit/test_phase8_extended_scope.py
    tests/unit/orchestrators/intent/test_lens_router_integration.py
    tests/unit/orchestrators/planning/test_autonomous_plan_executor.py
    tests/unit/orchestrators/support/test_comprehensive_suite_8_3a.py
    tests/unit/orchestrators/support/test_duplication_metrics_dashboard.py
    tests/unit/orchestrators/support/test_lens_orchestrator.py
    tests/unit/tier1/orchestrators/test_md_organizer_cleaner.py
    tests/unit/tools/test_orchestrator_inventory_auditor.py
    tests/visualization/test_lens_dashboard_integration.py

# Output & Performance
addopts = 
    --strict-markers
    --tb=short
    -ra
    --maxfail=10

# ============================================================================
# TIMEOUT SETTINGS (P0 — prevent hanging tests)
# ============================================================================
# Every test gets 30s max. Integration tests can override with @pytest.mark.timeout(60).
# This is the #1 fix for "tests appearing to hang" — without this, a single
# test doing network I/O or waiting on a lock runs forever.
timeout = 30
timeout_method = thread
timeout_func_only = false

# Custom markers
markers =
    regression: marks tests as regression tests
    integration: marks tests requiring external dependencies
    slow: marks tests that are slow to run (>5s)
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    timeout: override default timeout for specific tests
    rephrase: marks tests for REPHRASE mode enforcement
    golden: marks golden tests (expected output validation)
    e2e: marks end-to-end tests
